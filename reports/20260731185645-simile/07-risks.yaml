  figureRefs:
  - FR001
- id: model-validity-security-and-misuse-risk
  title: Model validity, security, and misuse risk
  body: >
    The second risk cluster is technical but commercially existential. Simile's product is only valuable if buyers trust it enough to act, yet independent literature repeatedly warns that synthetic users can produce plausible but shallow, biased, or unstable outputs. Public reviews from Nielsen Norman Group, User Interviews, MeasuringU, and the Cambridge political-analysis paper all converge on a similar concern: these systems may match broad trends while missing subgroup detail, effect magnitude, variability, or reproducibility. Gallup's refusal to use simulated responses for published population estimates is particularly important because it shows where even a friendly methodological partner draws the line. Simile's own mitigations — weekly validation, more than 7,000 evaluations, Total Variation Distance checks, and a confidence model — directly target this failure mode, but they do not eliminate it. The public record still does not show full subgroup calibration curves, failure-case disclosure, or detailed security architecture. Simile's privacy notice even states that no security measures are impenetrable and cannot guarantee perfect security. That leaves a real operational risk that output misuse, data leakage, or overconfident extrapolation could damage customers before the company detects the failure.
  claimRefs:
  - CR011
  - CR012
  - CR013
