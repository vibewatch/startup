- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Validation breakdown
    - Divergence between simulated and human results
    - Material subgroup error or confidence-model miss on marquee account
    - Pause expansion and re-underwrite technical moat.
  - - Privacy or consent controversy
    - Complaint, regulator inquiry, or incident involving participant data
    - Any material incident with customer or participant harm
    - Escalate legal diligence and revisit healthcare/policy exposure.
  - - Anchor-account weakness
    - CVS/Gallup or similar reference accounts stop expanding or publicly narrow usage
    - Loss of flagship proof point or nonrenewal of major customer
    - Lower conviction in repeatable GTM and valuation support.
  - - Commoditization
    - Incumbents or cheaper synthetic tools offer sufficiently similar outputs
    - Win rates compress or pricing power erodes without better proof
    - Re-rate company toward services or feature-layer economics.
  - - Governance immaturity
    - No evidence of robust security, review, or usage controls under diligence
    - Missing audits, unclear data boundaries, or no bounded-use history
    - Treat risk posture as structurally high despite growth potential.
  notes: Kill criteria are deliberately tied to observable validation, privacy, customer, and market signals.
