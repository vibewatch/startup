- id: scenario-valuation-and-comparable-set
  title: Bull, base, bear cases and comparable valuation set
  body: 'Because Simile does not publicly disclose ARR or margin structure, a precise revenue-multiple model would be false precision. A scenario framework is more appropriate. In the bull case, Simile converts its research lead, customer roster, and weekly validation narrative into visible software-like economics, broader enterprise diversification, and a credible path to platform leadership in synthetic behavioral insight; that state can support a mid-single-digit-billion outcome. In the base case, the company remains impressive but only partly de-risks the hardest questions around retention, gross margin, bounded use, and governance, which makes the current round look roughly fair rather than obviously cheap. In the bear case, validation limitations, procurement friction, or services-heavy delivery narrow the market story and compress the company toward lower-end workflow-software outcomes. Comparable evidence supports that framing: Harvey and Glean show how enterprise AI leaders with
    stronger disclosed scale can clear values above Simile, while Hebbia, Writer, and UserTesting show that attractive workflow categories can still price materially below the strongest late-stage AI premium band. Qualtrics provides the long-term upside reference for what a scaled customer-insight platform can become, not what Simile has already proven today.'
