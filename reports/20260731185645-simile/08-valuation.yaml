- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - valuation / status
  - what it suggests
  - relevance to Simile
  - limitation
  rows:
  - - Harvey
    - USD 5B Series E (2025)
    - Enterprise AI leaders with strong customer proof can command premium private valuations.
    - Useful upper-band vertical-AI comp with faster disclosed scale than Simile.
    - Legal AI has clearer monetization disclosure and a different risk surface.
  - - Glean
    - USD 7.2B Series F (2025)
    - Enterprise AI platforms with ARR visibility and broad workflow embedment can price above Simile.
    - Helpful high-scale enterprise-AI benchmark for what visible traction buys.
    - Glean disclosed $100M+ ARR and much broader connector/platform scale.
  - - Qualtrics
    - USD 12.5B take-private (2023)
    - Customer-insight and experience-management platforms can support very large outcomes at maturity.
    - Long-run category analogue for scaled research and insight software.
    - Qualtrics was a mature public company with 19,000+ organizations and deeper disclosure.
  - - UserTesting
    - USD 1.3B acquisition (2022)
    - Customer-research workflow companies can be strategically valuable even below mega-platform valuations.
    - Useful lower-band insight-software marker closer to workflow tooling than platform dominance.
    - Older market context and more mature, narrower workflow scope than Simile.
  - - Writer
    - USD 500M Series B (2023); USD 1.9B Series C (2024)
    - Enterprise AI application valuations can re-rate quickly when NRR, growth, security, and customer breadth are disclosed more concretely.
    - Good adjacent comp for enterprise-genAI platform packaging and premium re-rating potential.
    - Writer serves a broader horizontal content/agent use case, not behavioral simulation.
  - - Hebbia
    - USD 700M Series B (2024)
    - Early but monetized AI workflow companies can price richly without reaching Simile-scale marks.
    - Relevant because it shows strong AI workflow demand with more visible revenue context.
    - Primarily knowledge-work and finance/legal workflows, not synthetic behavior modeling.
  notes: Comparable set mixes private AI application leaders and customer-insight software benchmarks because no perfect public pure-play exists.
