- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold / event
  - transmission to thesis
  - action implication
  rows:
  - - Validation breakdown
    - Material subgroup miss or confidence-model failure on a marquee customer deployment
    - Undercuts the core moat and the premium valuation narrative.
    - Re-underwrite product edge and compress valuation assumptions immediately.
  - - Privacy / consent issue
    - Material complaint, incident, or regulator scrutiny tied to participant or customer data
    - Raises governance cost and may slow procurement across core verticals.
    - Pause conviction and escalate legal and security diligence.
  - - Anchor-account weakness
    - CVS, Gallup, or similar flagship account narrows use or does not expand
    - Reduces proof quality and weakens category-leader narrative.
    - Lower expected upside and re-rate toward workflow-niche outcomes.
  - - Competitive compression
    - Cheaper or incumbent tools narrow output quality gap without equivalent trust premium
    - Limits pricing power and turns the moat into a feature race.
    - Shift base case toward lower-end software multiples.
  - - Disclosure failure
    - Management cannot provide convincing ARR, margin, retention, security, and terms evidence in diligence
    - Prevents investors from converting narrative interest into economic conviction.
    - Maintain TRACK / pass posture at current price.
  notes: Kill triggers are chosen for direct impact on valuation, not for general operational concern alone.
  claimRefs:
  - CV036
  - CV038
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - ARR and revenue quality
    - Current ARR, growth cohorts, contract structure, and services mix are not publicly disclosed.
    - Without this, investors cannot judge whether $2B reflects software scale or narrative premium.
    - Request management revenue bridge and customer cohort file.
  - - Retention and expansion
    - NRR, GRR, logo retention, and flagship-to-broad-account expansion data are private.
    - Category creation is far more investable if expansion is repeatable rather than logo-led.
    - Request cohort and renewal analysis by segment.
  - - Gross margin and delivery model
    - Implementation effort, compute burden, and services attachment are not public.
    - These determine whether Simile can earn premium software multiples.
    - Request margin waterfall and deployment resource model.
  - - Security and governance
    - Public materials do not provide audits, architecture, or subgroup-calibration evidence.
    - Risk posture is central to both procurement velocity and valuation support.
    - Request security package, red-team results, and validation dashboards.
  - - Round terms and structure
    - Liquidation preferences, secondary mix, option-pool changes, and cap-table effects are undisclosed.
    - The real economic entry price may differ materially from the headline valuation.
    - Review term sheet, cap table, and counsel memos including legal-entity chain.
  notes: Each diligence ask is directly tied to whether the current price can be underwritten.
