company:
  name: Simile
chapter:
  number: 8
  title: Valuation
  summary: 'Simile has enough customer proof, scientific lineage, and category ambition to justify serious investor attention, but the public evidence does not yet justify a confident buy at a $2B Series B entry. The right conclusion from public materials is price-sensitive: track the company aggressively, but require deeper metric and governance proof before treating the round as obviously attractive.'
sections:
- id: thesis-and-recommendation
  title: Investment thesis, anti-thesis, and recommendation
  body: 'The investment thesis is real. Simile has a differentiated founder story anchored in influential Stanford research, a clearly articulated product thesis around synthetic populations, and unusually strong early proof for a young company, including Fortune 100 deployments, a marquee CVS Health case study, Gallup collaboration, and claims of 5x revenue growth since public launch. Those facts support the view that Simile may be creating a new workflow layer between market research, product insight, and enterprise decision support. The anti-thesis is just as important: the public record still does not disclose ARR, gross margin, renewal behavior, burn, pricing realization, or detailed round terms, and the risks chapter shows that privacy, validity, and customer-overtrust issues are not peripheral. That combination means the company can be high quality while the current price remains hard to underwrite. The recommendation from public evidence is therefore TRACK rather than BUY: the company
    deserves continued attention, but the current round should be treated as roughly full and highly sensitive to diligence outcomes rather than as an obvious bargain.'
  claimRefs:
