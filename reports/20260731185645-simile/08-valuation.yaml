  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr-retention-and-margin-disclosure
    missingEvidence: Public sources do not disclose ARR, GRR/NRR, gross margin, implementation burden, or the services-versus-software mix.
    whyItMatters: Those metrics determine whether a $2B price represents premium but fair software underwriting or narrative overpayment.
    diligencePath: Request cohort-level revenue bridge, renewal analysis, margin waterfall, and deployment resource model.
    relatedQuestionRefs:
    - QV004
    - QV018
    - QV026
    - QV027
  - type: private-evidence-only
    severity: blocking
    topic: series-b-terms-and-cap-table-economics
    missingEvidence: Liquidation preferences, secondary components, option-pool changes, and the full cap-table effect of recent financings are not public.
    whyItMatters: Headline valuation can differ materially from true investor economics.
    diligencePath: Review term sheet, cap table, side letters, and counsel summary including any secondary allocation.
    relatedQuestionRefs:
    - QV010
    - QV030
  - type: private-evidence-only
    severity: material
    topic: security-and-subgroup-governance
    missingEvidence: Public materials do not provide third-party security evidence, subgroup calibration curves, or a detailed failure-case library.
    whyItMatters: Governance quality directly affects procurement speed, downside risk, and how much premium investors should pay.
    diligencePath: Request security package, architecture overview, audit results, calibration dashboards, and bounded-use examples.
    relatedQuestionRefs:
    - QV026
    - QV027
    - QV028
  - type: missing-source
    severity: material
    topic: legal-entity-bridge
    missingEvidence: Public filings show a Simile Inc. trail, but public materials do not conclusively map that trail to the present-day startup.
    whyItMatters: Entity continuity matters for cap-table certainty, diligence hygiene, and round-document review.
    diligencePath: Reconcile formation documents, predecessor entities, and financing approvals with counsel.
    relatedQuestionRefs:
    - QV011
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: tv004-comparable-coverage
    missingEvidence: TV004 is a decision-useful comp set, not a full comp universe across all AI application or research-software companies.
    whyItMatters: Comparable choice can materially shift perceived valuation attractiveness.
    diligencePath: Expand the comp set with additional private and public workflow-AI and research-software benchmarks under NDA.
