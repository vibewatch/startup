  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor classes and the actual job buyers are hiring
        blocks:
          - type: paragraph
            body: >
              Buyers do not experience Simile as a generic "AI research" tool; they compare it against every way to
              reduce uncertainty before a launch, policy change, price test, or experience redesign. The reviewed
              landscape breaks into three classes. First are incumbent survey and panel providers such as Qualtrics,
              Alchemer, Nielsen, Kantar, Toluna, and YouGov, which still anchor trust in large-scale human data
              collection, brand tracking, and enterprise procurement. Second are AI-moderated human-research platforms
              such as UserTesting, Outset, Listen Labs, Respondent, and Prolific, which promise faster recruiting,
              interview automation, and synthesis while keeping real participants in the loop. Third are synthetic-user
              and digital-twin startups such as Synthetic Users, Fairgen, Viewpoints.ai, Evidenza, Brox, and Artificial
              Societies, which try to replace or front-load parts of fieldwork with simulated audiences. Simile sits
              closest to the third class but reaches upward into higher-stakes enterprise simulation, so the relevant
              competition is broader than a list of synthetic-user peers.
            claimRefs:
