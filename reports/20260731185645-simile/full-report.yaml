      - number: '3.3'
        title: Distribution, data access, and switching costs
        blocks:
          - type: paragraph
            body: >
              Simile’s strongest potential moat is not that competitors lack AI, but that few have both proprietary
              behavioral grounding and access to enterprise first-party data in workflows consequential enough to
              matter. UserTesting, Qualtrics, Nielsen, Kantar, Toluna, and YouGov already own procurement relationships,
              existing budgets, and long histories with research and insights teams. Human-panel platforms such as
              Respondent and Prolific have supply-side advantages in participant recruitment and verification. Synthetic
              startups counter by promising that hard-to-reach audiences can be modeled or expanded faster than they can
              be recruited, with Fairgen, Viewpoints.ai, Evidenza, Brox, and Artificial Societies each making variants
              of that argument. Simile’s enterprise advantage comes if customers believe custom twins built on consented
              and domain-specific data outperform generic or lightly targeted synthetic personas. But the switching cost
              remains two-sided: customers must trust the model outputs, and Simile must preserve access to proprietary
              data sources, recalibration workflows, and customer references that incumbents or model vendors cannot
              instantly clone.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >
              The adverse evidence is meaningful. Nielsen Norman Group and AIMultiple both frame synthetic users as best
              suited to hypothesis generation or early-stage testing rather than as full replacements for high-stakes
              human research. Synthetic Users explicitly markets itself as a discovery copilot, and Gallup says
              simulated responses will not be used for published population estimates. Those signals imply that part of
              the category may settle into a workflow-acceleration niche instead of displacing core research budgets. At
              the same time, startup peers are converging on similar claims around digital twins, validation, and
              inaccessible audiences, while incumbents can embed synthetic features inside existing platforms and bundle
              them with trusted human panels. Simile therefore needs its confidence model, validation cadence, customer
              outcomes, and domain-specific data partnerships to keep compounding faster than the field commoditizes. If
              buyers conclude that synthetic outputs are interchangeable or only safe for low-regret decisions,
              incumbent platforms and AI-moderated human tools could compress Simile’s pricing power and narrow its
              serviceable wedge.
            claimRefs:
