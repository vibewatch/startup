        title: Exhibits
        blocks:
          - type: callout
            title: Simile's biggest risk is believable wrongness
            body: >-
              The product becomes dangerous before it becomes obviously broken if simulated outputs look polished and
              trustworthy enough to drive real-world decisions while still failing on subgroup calibration, variance, or
              novel scenarios.
            calloutType: risk
