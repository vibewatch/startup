companyProfile:
  summary: >-
    Simile is a Palo Alto-based AI startup founded in 2024 by Joon Sung Park, Percy Liang, and Michael Bernstein. The
    company emerged from Stanford-origin research on generative agents and synthetic human-behavior simulation, then
    rapidly positioned itself as a platform for creating synthetic populations that enterprises can query instead of
    relying solely on surveys or focus groups. Public materials describe a foundation model trained on behavioral data,
    weekly validation across subpopulations, and a confidence model designed to estimate simulation accuracy. The
    company claims its customers have run tens of millions of simulations and that revenue has grown 5x since public
    launch. Simile raised roughly $100M in a Series A and more than $200M in a July 2026 Series B led by Greenoaks
    Capital, reaching a $2B valuation with support from Index Ventures, Hanabi, Bain Capital Ventures, A*, Factory, CVS
    Health Ventures, and Definition. Named customer or partner proof includes CVS Health, Gallup, Wealthfront, Banco
    Itaú, Suntory Beverages & Food, Deloitte, and Garnett Station Partners. The report's recommendation is TRACK: Simile
    may be building a meaningful category leader, but the current price already assumes a substantial amount of future
    software-like performance that public disclosures have not yet proven.
