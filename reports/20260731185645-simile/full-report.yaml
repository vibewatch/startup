      - number: '5.2'
        title: Architecture, grounding, and validation mechanics
        blocks:
          - type: paragraph
            body: >
              The core technical thesis combines three layers. First is the generative-agent architecture popularized by
              Joon Sung Park’s 2023 “Generative Agents” paper, where memory, retrieval, reflection, and planning make
              simulated humans behave coherently over time rather than like disconnected prompts. Second is the newer
              interview- and survey-grounded agent work that showed generative agents reproducing human responses at
              roughly 83% to 86% of the humans’ own retest consistency, supporting the idea that a model can generalize
              across many outcomes without task-specific retraining. Third is Simile’s enterprise layer: weekly
              validation against real humans, more than 7,000 evaluations across subpopulations and use cases, Total
              Variation Distance comparisons, and a separate confidence model intended to say when the system should be
              trusted less. The net result is a product that tries to make uncertainty first-class. That matters because
              the hardest problem for enterprise simulation is not generating plausible answers; it is knowing when
              plausible outputs remain sufficiently grounded once the scenario changes, the audience narrows, or
              multi-agent interactions introduce second-order effects.
