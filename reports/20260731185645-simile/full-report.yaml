      - number: '7.4'
        title: Financial risk, thesis-break triggers, and residual exposure
        blocks:
          - type: paragraph
            body: >
              Simile's financing strength dampens near-term survival risk, but it does not remove model or execution
              risk. More than $300 million of disclosed capital gives the company room to invest, yet the public record
              still lacks burn, runway, gross margin, ACV, and renewal data. That means investors cannot cleanly
              distinguish durable software economics from a high-cost, narrative-rich services business. The
              legal-entity history adds another modest but real diligence issue: an SEC filings record exists for a 2018
              Brooklyn-address Simile Inc., and the reviewed sources do not conclusively match that entity to the
              current Palo Alto startup. None of these gaps are thesis-killing on their own, but together they create a
              high residual-risk posture. The thesis breaks if Simile's validation signal weakens, if privacy or consent
              controversies surface, if anchor customers do not expand, or if incumbents and lower-cost synthetic tools
              erode the pricing power of a still-opaque model. The company has sensible mitigations, but the public
              evidence still supports careful monitoring rather than full trust.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
