      - number: '8.4'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Simile is not yet exit-ready from a public-evidence standpoint, but it is close enough to deserve
              disciplined follow-up. The company has the ingredients that could support a strategic or IPO narrative
              over the next several years: blue-chip customers, strong academic branding, a large private capital base,
              and a category story that resonates with enterprise AI buyers. What is missing is the evidence package
              that converts admiration into investment conviction. Investors still need hard data on ARR, NRR, renewal
              cohorts, gross margin, burn, runway, pricing realization, security controls, subgroup calibration, and
              round terms. Gallup's bounded-use posture and the risk chapter's governance concerns matter here because
              they constrain how quickly Simile can graduate from interesting tool to trusted decision layer. The thesis
              breaks if the validation edge weakens, if privacy or consent controversy appears, if anchor customers stop
              expanding, or if competitor products erase Simile's perceived methodological lead before the company
              standardizes procurement trust. Until those issues are better resolved, the right posture is active
              monitoring and targeted diligence rather than aggressive price acceptance.
            claimRefs:
