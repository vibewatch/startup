      - number: '2.2'
        title: Sizing lenses and what they do — and do not — imply
        blocks:
          - type: paragraph
            body: >-
              Public market numbers support a large opportunity, but they describe different things and should not be
              collapsed into one headline TAM. ESOMAR’s global insights-industry view points to a market above $140
              billion in 2023 and above $150 billion in 2024, while QuestionPro and The Business Research Company
              highlight a narrower purchased-services lens around the mid-$90 billions in 2026. Separate synthetic-data
              reports from Maximize Market Research and Mordor Intelligence show a much smaller but faster-growing
              market measured in the hundreds of millions to low billions. Simile likely participates in both
              narratives: it competes for some research-services and research-software budgets today, but it also
              benefits from the validation, privacy, and digital-twin spending tailwinds captured by synthetic-data
              forecasts. The right diligence conclusion is therefore that the broad market is undeniably large, but
              Simile’s near-term serviceable market is a constrained wedge inside enterprise decision workflows that
              require behavior prediction, scenario testing, and enough first-party or partner data to ground the model.
