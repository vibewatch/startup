      - number: '8.2'
        title: Current price context, round structure, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Simile's July 2026 financing context is powerful but also unusually expectation-heavy. The company
              reportedly moved from a roughly $100M Series A to a $200M-plus Series B at a $2B valuation within only a
              few months, taking disclosed capital to roughly $300M-plus. That pace signals strong investor demand, but
              it also means the Series B investor is paying ahead of full operating disclosure. Public materials
              identify high-profile investors and strategic participants, yet they do not disclose liquidation
              preferences, secondary components, option-pool changes, or other term-sheet details that determine real
              economic entry price. Even the SEC trail introduces a small but non-zero structural diligence question
              because a 2018 Simile Inc. filing record is visible without a conclusive public bridge to the current Palo
              Alto startup. As a result, entry discipline matters more here than in a typical narrative round: the
              question is not whether Simile is interesting, but whether a $2B price already assumes category-leader
              economics that the public record has not yet demonstrated.
            claimRefs:
              - CV011
