      - number: '3.2'
        title: Capability, pricing posture, and trust posture
        blocks:
          - type: paragraph
            body: >
              The most important competitive split is not feature count but where each vendor anchors trust. Incumbents
              emphasize real panels, massive historical datasets, and enterprise-grade governance. AI-moderated
              human-research platforms emphasize speed, recruiting reach, fraud controls, and automation around real
              interviews. Synthetic-user companies emphasize digital twins, synthetic respondents, parity studies, and
              access to otherwise unreachable segments. Simile’s own positioning pushes farther than discovery copilots:
              it claims agentic twins grounded in real behavioral data, weekly recalibration, and confidence scoring for
              whether a given simulation should be trusted. That is differentiated if true, but it also means buyers
              will demand more evidence than they ask from tools that merely help researchers run interviews faster.
              Public pricing transparency is limited across the field; many enterprise vendors hide pricing behind demos
              or custom contracts, while a few synthetic startups advertise free trials or low per-interview economics
              to seed adoption. The result is a market where switching decisions are driven more by proof, integration,
              and procurement comfort than by list price alone.
