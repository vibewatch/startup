  topStrengths:
    - Simile 正在开辟 AI 应用新品类，Stanford 起源的研究脉络和创始人-市场匹配度异常强。
    - 作为一家年轻私营公司，Simile 的公开客户验证强于平均水平，CVS Health 和 Gallup 尤其有参照意义。
    - 公司称公开发布以来收入增长 5 倍、已运行数千万次模拟，说明企业需求真实存在，并非只有学术兴趣。
    - 已披露超过 $300M 的资本基础，让 Simile 有时间投入模型质量、GTM 和治理，而不必立刻承受融资压力。
  topRisks:
    - ARR、毛利率、留存和烧钱速度仍未披露，仅靠公开证据无法拼出精确投资测算。
    - 隐私、使用边界和模型有效性风险一旦在重要客群暴露，会直接拖慢采购速度，并压低估值倍数支撑。
    - 当前 $2B 估值似乎已经假设 Simile 具备品类领导者经济性，但这些经济性尚未公开跑出来。
    - CVS Health 和 Gallup 这类旗舰验证点强化了叙事，也带来集中度和预期风险。
  unresolvedGaps:
    - 当前 ARR、NRR/GRR、毛利率和部署成本结构仍未公开。
    - Series B 清算优先权、老股交易占比、期权池影响和完整股权结构经济性均未公开。
    - 公开材料中未找到安全证据、子群体校准曲线和详细失败案例披露。
    - 公开来源尚未确凿连接当前公司与可见的 2018 年 Simile Inc. SEC 文件轨迹。
