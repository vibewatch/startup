  - FU003
- id: durability-expansion-and-repeat-usage
  title: Durability, expansion, and repeat-usage logic
  body: >
    Simile’s expansion logic appears to be workflow-led rather than seat-led. The strongest public cases begin with one well-defined problem — for example, care-journey design, product concept evaluation, or research acceleration — then widen into broader scenario testing once the organization trusts the outputs. CVS’ public narrative explicitly describes a progression from validating individual agents to scaling toward dynamic and multi-agent use cases. That pattern implies land-and-expand potential if early wins convert into recurring simulation programs across more teams, populations, and decision types. However, no public source discloses NRR, GRR, renewal rates, contract length, average deal size, or cohort retention. The best available durability proxies are customer quotations, the fact that some customers also invest in or partner with Simile, and the company’s claim of 5x revenue growth since public launch. Those are helpful but insufficient for underwriting customer quality on their own.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
