  rows:
  - - Healthcare enterprises
    - CX, care-experience, pharmacy, and insights leaders
    - Adherence, care journeys, access, and experience design
    - Fortune 100-scale buyer
    - High strategic value because stakes and data depth are high
    - Need proof of renewal cadence and number of active programs.
  - - Financial services
    - Research, design, and product leadership
    - Switching behavior, product testing, qualitative research, and consumer understanding
    - Large consumer platforms and banks
    - Attractive because small decision improvements can move large customer bases
    - Revenue mix between fintech and banks is unknown.
  - - Consumer products
    - Digital, product-development, and consumer-insights teams
    - Time-to-market acceleration and concept testing
    - Global branded consumer company
    - Strategic value from broad SKU pipelines and repeated launches
    - Public outcome disclosure is light.
  - - Research and advisory organizations
    - Methodology, polling, and client-service leaders
    - Research acceleration, scenario exploration, and stakeholder understanding
    - Global research/advisory institutions
    - Important because these buyers test methodology credibility directly
    - May also constrain usage boundaries more than commercial buyers.
  - - Private equity and strategy users
    - Operating partners and diligence teams
    - Consumer understanding, portfolio diligence, and market entry
    - Smaller logo count but high influence
    - Strategic value as a reference for investment and strategy workflows
    - Risk of opportunistic rather than recurring usage.
  notes: Segments the customer base by the decision job being solved rather than by logo count alone.
