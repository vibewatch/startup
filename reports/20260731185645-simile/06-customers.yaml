chapter:
  number: 6
  title: Customers
  summary: Simile's customer story is strongest where the company can point to named enterprise deployments that use simulations to accelerate expensive or sensitive decisions before live pilots. Public proof is deepest for CVS Health and directionally useful for Gallup, Wealthfront, Banco Itaú, Suntory, Deloitte, and Garnett Station Partners, but retention, revenue concentration, and renewal durability remain mostly undisclosed.
sections:
- id: customer-base-and-segmentation
  title: Customer base segmentation and buyer map
  body: >
    Simile’s customer base is best understood as a narrow set of enterprise buyers with expensive decisions, complex user journeys, and limited tolerance for failed live experiments. The named references cluster in healthcare, financial services, consumer products, research and advisory work, and private equity. That spread matters because it shows the product is not restricted to one department or one data regime; Simile is pitching insights, design, experience, innovation, strategy, and investment teams that all need to predict how humans will react before capital is committed. The likely buyer is a senior insights, CX, design, strategy, or operating leader, while day-to-day users sit with researchers, product managers, and analysts. Public evidence also suggests that the payer is usually an enterprise budget owner rather than an individual seat purchaser, which fits the company’s customer-specific populations and simulation workflows. The category mix is a strength because it shows horizontal applicability, but it also raises a diligence question: which verticals actually produce repeatable revenue and which are still proof-of-concept logos.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-deployments-and-adoption-trajectory
  title: Named deployments and adoption trajectory
  body: >
    Public proof is strongest where Simile and the customer both describe a concrete operating use case. CVS Health is the clearest case: the combined sources describe a year-long effort built on 2.9 million consented responses from more than 400,000 participants across 200-plus behavioral scenarios, used to improve care experiences, adherence, and competitive positioning before downstream pilots. Gallup is a second high-signal example because it frames simulated responses as a research tool while explicitly refusing to use them for published population estimates. That makes the proof more credible, not less, because it shows a sophisticated research organization defining boundaries. Beyond those two, Simile publicly presents testimonials from Wealthfront, Banco Itaú, Suntory Beverage & Food, Deloitte, and Garnett Station Partners. Those references suggest the product is already being used across product development, qualitative research expansion, consumer understanding, and private-equity diligence, but most of them are still testimonial-level evidence rather than independently documented outcome case studies. The adoption trajectory is therefore real but unevenly evidenced: a few deployments are concrete, while the broader logo map is still mostly company-asserted.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
