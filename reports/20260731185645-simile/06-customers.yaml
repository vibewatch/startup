  - FU004
- id: concentration-and-procurement-risk
  title: Concentration, procurement, and proof-quality risk
  body: >
    The main customer risks are concentration, proof asymmetry, and procurement friction. Publicly named customers are high quality, but the list is still short enough that one or two anchor accounts could shape the company’s roadmap, validation burden, and sales references disproportionately. Procurement is also likely to be slow because the product touches sensitive data and influences consequential business decisions. Gallup’s methodological caution and the broader synthetic-user literature both suggest that sophisticated buyers will treat simulations as accelerants rather than unquestioned truth, at least until long-run validation accumulates. This creates an awkward but manageable adoption dynamic: the very customers most capable of paying Simile large contracts are also the ones most likely to demand proofs, guardrails, and domain-specific evidence before expanding spend. As a result, customer quality may be high even while customer scalability remains constrained.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
