  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: Public sources do not provide NRR, GRR, renewal history, contract length, or cohort metrics.
    whyItMatters: Durable recurring revenue is a central input to customer quality and valuation.
    diligencePath: Request cohort retention by vintage, renewal schedules, and win-loss data for expansions and churn.
    relatedQuestionRefs: [QU019, QU025]
  - type: enumeration-incomplete
    severity: material
    topic: production-vs-pilot-status
    missingEvidence: The public named-customer list does not consistently distinguish pilot, bounded deployment, and scaled production usage.
    whyItMatters: Logo lists can overstate adoption maturity and mislead concentration analysis.
    diligencePath: Build an account-level status table showing live production, limited pilot, paused pilot, or prospect for every material customer.
    relatedQuestionRefs: [QU009, QU014, QU025]
    relatedTableRefs: [TU003]
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: No public source discloses top-customer revenue share, top-10 concentration, or ARR by vertical.
    whyItMatters: A short list of prominent accounts could imply concentration risk even if logo quality is high.
    diligencePath: Request logo-level ARR, pipeline by vertical, and dependency on anchor references such as CVS.
    relatedQuestionRefs: [QU022, QU025]
