companyProfile:
  summary: >-
    Simile 是一家位于 Palo Alto 的 AI 初创公司，2024 年由 Joon Sung Park、Percy Liang 和 Michael Bernstein 创立。公司脱胎于 Stanford
    关于生成式智能体和合成人类行为模拟的研究，很快把自己定位为一个合成人群平台：企业可以查询这些人群，而不必只靠问卷或焦点小组。公开材料称，公司训练了一个基于行为数据的基础模型，每周跨子人群验证，并用置信度模型估算模拟准确度。公司称客户已经运行数千万次模拟，收入自公开发布以来增长
    5x。Simile 在 Series A 融资约 $100M，并在 2026 年 7 月由 Greenoaks Capital 领投的 Series B 中融资超过 $200M，估值达到 $2B；参投方包括 Index
    Ventures、Hanabi、Bain Capital Ventures、A*、Factory、CVS Health Ventures 和 Definition。具名客户或合作伙伴证据包括 CVS
    Health、Gallup、Wealthfront、Banco Itaú、Suntory Beverages & Food、Deloitte 和 Garnett Station Partners。报告建议为 TRACK：Simile
    可能正在长成一个重要品类领导者，但当前价格已经假设了大量未来软件化表现，而公开披露尚未证明这些表现。
