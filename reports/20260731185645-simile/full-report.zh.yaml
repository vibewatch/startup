      - number: '1.4'
        title: 里程碑、验证姿态与风险提示
        blocks:
          - type: paragraph
            body: >-
              Simile 故事里最可信的一点，是它不只靠泛泛的 AI 营销语言。公开材料和外部报道反复提到每周验证、置信度模型，以及衡量智能体表现相对人类自我复测一致性的学术工作，而不是宣称完美预测。CVS 和 Gallup
              的客户侧证据也强调，模拟是筛选和排序层，不是直接人类测量的完整替代。这层细微差别很重要，因为一些最强的外部评论同时带着怀疑：TechCrunch 称模拟全部八十亿人的梦想「荒谬」，Gallup
              明确警告模拟回答不应替代基于概率的公开指标，公开融资披露也仍主要依赖公司和媒体来源，而不是清晰无歧义的备案。同样重要的是，同一批来源没有回答准确度在新领域会多快衰减，也没有说明公开主张背后有多少内部治理。因此，本概览为报告后续部分给出一个平衡基线：Simile
              有差异化技术根基和真实企业牵引力，但这些主张仍需放在私营公司长期不透明以及当下人类行为建模内在不确定性中解读。
