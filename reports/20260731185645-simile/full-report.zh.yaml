      - number: '3.2'
        title: 能力、定价姿态与信任锚点
        blocks:
          - type: paragraph
            body: >
              最重要的竞争分野不是功能数量，而是各家把信任锚在哪里。既有厂商强调真实样本、庞大历史数据集和企业级治理。AI
              主持的人类研究平台强调速度、招募覆盖、反欺诈控制，以及围绕真实访谈的自动化。合成用户公司强调数字孪生、合成受访者、一致性研究，以及触达原本难以触达的人群。Simile
              自身定位比发现型助手更进一步：它宣称有基于真实行为数据的智能体双胞胎、每周重新校准，以及判断某次模拟是否值得信任的置信度评分。如果属实，这是差异化；但也意味着买方会要求比「只是帮研究员更快跑访谈」的工具更多证据。全行业公开定价透明度有限；很多企业厂商把价格藏在演示或定制合同后面，也有少数合成初创公司用免费试用或低单次访谈经济性来播种采用。结果是，市场里的切换决定更多由证明、集成和采购舒适度驱动，而不是单一标价。
