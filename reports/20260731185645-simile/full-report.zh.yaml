      - number: '6.3'
        title: 留存、扩张与重复使用逻辑
        blocks:
          - type: paragraph
            body: >
              Simile 的扩张逻辑看起来由工作流驱动，而不是由席位驱动。最强的公开案例始于一个界定清楚的问题——例如照护旅程设计、产品概念评估或研究加速——然后在组织信任输出后，扩展到更广泛的情景测试。CVS
              的公开叙事明确描述了从验证单个智能体，到扩展至动态和多智能体用例的进程。这种模式意味着，如果早期成果转化为跨更多团队、人群和决策类型的经常性模拟项目，就存在先落地后扩张的潜力。不过，没有公开来源披露
              NRR、GRR、续约率、合同长度、平均交易规模或队列留存。可用的最佳耐久性代理指标，是客户引语、部分客户也投资或与 Simile 合作，以及公司关于公开发布以来收入增长 5x
              的说法。这些有帮助，但不足以单独承保客户质量。
