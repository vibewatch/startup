      - number: '6.2'
        title: 具名部署与采用轨迹
        blocks:
          - type: paragraph
            body: >
              公开证据最强的地方，是 Simile 和客户都描述了具体运营用例。CVS Health 最清楚：综合来源描述了一项历时一年的工作，基于 2.9 million 份经同意回答，覆盖超过 400,000 名参与者和
              200-plus 个行为情景，用于在下游试点前改善照护体验、依从性和竞争定位。Gallup
              是第二个高信号案例，因为它把模拟回答定位为研究工具，同时明确拒绝用于公开总体估计。这让证据更可信，而不是更弱，因为它显示一个成熟研究组织在划定边界。除此之外，Simile 公开展示了
              Wealthfront、Banco Itaú、Suntory Beverage & Food、Deloitte 和 Garnett Station Partners
              的客户证言。这些背书表明，产品已用于产品开发、定性研究扩展、消费者理解和私募股权尽调，但其中大多数仍是证言级证据，而不是独立记录结果的案例研究。因此，采用轨迹是真实的，但证据分布不均：少数部署很具体，更广泛的客户地图仍主要由公司自己主张。
