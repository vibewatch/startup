  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、商业化与确认姿态
        blocks:
          - type: paragraph
            body: >
              公开来源一致把 Simile
              描述为出售企业对合成人群、模拟和决策支持工作流的访问，而不是向消费者收费或靠广告变现。最合理的收入模式，是带有明显服务和定制成分的订阅式企业软件：客户带来或共同创建专有人群，运行情景研究，并可能为持续访问、模型调校和支持付费。这种结构符合公司对客户治理数据、领域专属人群和大型企业生产部署的强调。它也解释了为什么没有公开标价。如果客户关系依赖定制模型、验证支持、参与者来源流程和组织专属模拟，自助价格就无法捕捉真实经济单元。因此，关键的会计和质量问题不是
              Simile 有没有收入——公司说有，而且增长很快——而是经常性软件使用权与高接触服务或定制项目工作的占比各有多少。
