      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的初始买方不是消费级研究者，而是决策成本高、实验预算真实的企业团队。Simile
              的公开案例集中在医疗健康、金融、消费品、媒体和战略场景；在这些场景里，一次糟糕发布、模糊信息或设计不佳的工作流所付出的成本，明显高于再跑一个模型。QuestionPro 和 Similarweb
              的市场研究摘要解释了原因：买方越来越想要更快周期、混合方法和 AI 支持，但他们仍围绕具体业务决策和可衡量 ROI 来组织支出。Gallup 和 CVS
              也说明了采用路径。两者都把模拟定位为问题设计、优先级排序和试点选择的前端加速器，而不是监管或官方测量的替代品。实际操作中，买方旅程可能从创新、消费者洞察、UX、品牌或战略团队开始；只有模型反复省时间、缩小高成本真实实验集合之后，才会扩张。
