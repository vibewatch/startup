      - number: '3.3'
        title: 分销、数据获取与切换成本
        blocks:
          - type: paragraph
            body: >
              Simile 最强的潜在护城河，不是竞争对手没有
              AI，而是很少有公司同时拥有专有行为扎根能力，以及能进入足够关键企业工作流的一方数据。UserTesting、Qualtrics、Nielsen、Kantar、Toluna 和 YouGov
              已经掌握采购关系、既有预算和与研究洞察团队的长期历史。Respondent 和 Prolific
              等人类样本平台，在参与者招募和验证上有供给侧优势。合成初创公司则反击说，难触达人群可以被建模或扩展，速度快于招募；Fairgen、Viewpoints.ai、Evidenza、Brox 和 Artificial
              Societies 都在提出这个论点的变体。如果客户相信，基于同意且领域专属数据构建的定制双胞胎，优于通用或轻度定向的合成画像，Simile
              的企业优势就会成立。但切换成本是双边的：客户必须信任模型输出，Simile 也必须守住专有数据源、重新校准工作流和客户背书，不能让既有厂商或模型厂商立刻复制。
