            body: >
              主要客户风险是集中度、证据不对称和采购摩擦。公开具名客户质量高，但名单仍短，一个或两个锚定账户就可能过度影响公司路线图、验证负担和销售背书。采购也可能很慢，因为产品触及敏感数据并影响重要业务决策。Gallup
              的方法论谨慎，以及更广泛合成用户文献，都表明成熟买方会把模拟当作加速器，而不是不容置疑的真相，至少要等长期验证累积起来。这形成一个尴尬但可管理的采用动态：最有能力给 Simile
              付大合同的客户，也最可能在扩大支出前要求证明、护栏和领域专属证据。因此，客户质量可能很高，但客户可扩展性仍受约束。
