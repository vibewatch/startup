      - number: '2.2'
        title: 市场规模口径：说明什么、又不能说明什么
        blocks:
          - type: paragraph
            body: >-
              公开市场数字支持一个大机会，但这些数字描述的不是同一件事，不应压成一个 TAM 标题。ESOMAR 的全球洞察行业口径显示，2023 年市场超过 $140 billion，2024 年超过 $150
              billion；QuestionPro 和 The Business Research Company 则强调较窄的外购服务口径，2026 年约在 $90 billion 区间中段。Maximize Market
              Research 和 Mordor Intelligence 的合成数据报告显示，市场小得多，但增速更快，规模从数亿美元到十亿美元低段。Simile
              很可能同时参与两条叙事：今天争夺部分研究服务和研究软件预算，也受益于合成数据预测所捕捉的验证、隐私和数字孪生支出顺风。因此，正确的尽调结论是：广义市场无疑很大，但 Simile
              近期可服务市场是企业决策工作流内部一个受限切口，要求行为预测、情景测试，以及足够的一方或伙伴数据来扎根模型。
