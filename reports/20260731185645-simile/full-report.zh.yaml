  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值最敏感的变量是 Simile 能否证明软件式经济性和可信品类领导力，而不是停留在高端小众工作流。
    data:
      items:
        - label: 小众工作流结果
          value: 1.1
        - label: 基准情形：当前证据
          value: 2.2
        - label: 规模化软件证明
          value: 3.2
        - label: 明确品类领导者
          value: 4.2
        - label: Harvey 式溢价区间
          value: 5
    approximationNotes: 数值为基于里程碑状态和可比锚点推导的示意性十亿美元区间，不是已观察到的谈判价格。
    claimRefs:
      - CV020
      - CV021
      - CV024
      - CV025
      - CV026
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 本轮接近基准情形上沿，且明显低于上行情景区间；一旦公开证据令人失望，安全边际有限。
    data:
      items:
        - label: 悲观
          low: 0.9
          mid: 1.2
          high: 1.4
          unit: USD B
          detail: 工作流更窄、服务更重，或信任受挫。
        - label: 基准
          low: 1.8
          mid: 2.2
          high: 2.6
          unit: USD B
          detail: 公司实力强，但经济性和治理的去风险进展不一。
        - label: 当前轮次锚点
          low: 1.9
          mid: 2
          high: 2.1
          unit: USD B
          detail: 报道中的 2026 年 7 月 Series B 估值。
        - label: 乐观
          low: 3.5
          mid: 4.2
          high: 5
          unit: USD B
          detail: 品类领导者证明清晰，软件经济性可见。
    approximationNotes: 区间综合了可比轮次、风险调整后的里程碑逻辑和已披露融资锚点。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
