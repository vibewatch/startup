      - number: '3.4'
        title: 护城河耐久度与被替代风险
        blocks:
          - type: paragraph
            body: >
              反向证据有分量。Nielsen Norman Group 和 AIMultiple 都把合成用户定位为更适合假设生成或早期测试，而不是高风险人类研究的完整替代。Synthetic Users
              明确把自己营销为发现助手；Gallup
              也说模拟回答不会用于公开总体估计。这些信号意味着，品类的一部分可能落在工作流加速的小众位置，而不是取代核心研究预算。与此同时，初创同行正在围绕数字孪生、验证和难触达人群收敛到相似主张；既有厂商也可以把合成功能嵌入现有平台，并与可信人类样本打包。Simile
              因此需要让置信度模型、验证节奏、客户结果和领域专属数据伙伴关系的复利速度，快过全行业商品化。如果买方认定合成输出可以互换，或只适合低后悔成本决策，既有平台和 AI 主持的人类工具就可能压缩 Simile
              的定价权，收窄其可服务切口。
