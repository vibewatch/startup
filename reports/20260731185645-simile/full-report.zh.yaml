      - number: '2.4'
        title: 增长驱动、采用约束与时间节奏
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自速度、成本压力、隐私约束，以及触达招募昂贵或缓慢人群的需要。User Interviews、QuestionPro 和合成数据市场报告都指向这个方向，Simile
              的客户案例也显示，组织进入较慢的外勤研究或真实试点前，模拟可以帮助预先筛选选项。但约束面同样重要。User Interviews 报告了怀疑情绪、治理缺口和过度信任恐惧；Nielsen Norman Group
              认为合成用户最适合生成假设，不适合最终决策；Gallup
              明确拒绝用模拟回答替代公开总体估计。这些来源共同指向两阶段采用曲线。技术可以更早渗透方向性、探索性或低后悔成本工作流，但最高价值企业预算取决于验证、透明度，以及对模型何时应让位给真实人类的清楚认识。因此，Simile
              的机会很大但有条件：如果信任持续改善，切口可以变宽；如果买方过度延伸或监管收紧，采用可能停在研究辅助边缘。
