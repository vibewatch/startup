      - number: '5.4'
        title: 信任、隐私、安全与质量控制
        blocks:
          - type: paragraph
            body: >
              Simile
              的信任姿态异常直接地决定产品质量。隐私条款和参与者条款显示，公司会在客户和参与者工作流中收集个人信息、使用数据，并且很多情况下会收集原始文本、音频和视频提交；这些提交可用于生成基于文本的「智能体」，并披露给第三方客户。参与者协议把这些提交的广泛权利转让给
              Simile，禁止贡献者用机器人或 AI
              工具伪造回答，并把许多争议导入仲裁。产品研究版本协议更进一步，声明不承担已出货消费产品责任，并把产品安全和召回监测主要放在制造商和参与者身上。这些控制可能在商业上必要，但也说明 Simile
              为什么需要强治理、数据处理和客户侧护栏。NIST 的 AI 风险管理指南及隐私与 AI 材料强化了同一点：当 AI 系统用于影响重要决策，透明度、数据治理和校准不确定性就不是可选附加项。Simile
              自己关于置信度评分、每周重新校准和人类扎根的表述，方向上符合这一标准，但公开记录仍在安全架构、留存控制以及客户能访问多少原始参与者材料上留下有意义的尽调缺口。
