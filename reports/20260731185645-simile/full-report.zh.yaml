  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 估值 / 状态
      - 启示
      - 与 Simile 的相关性
      - 局限
    rows:
      - - Harvey
        - USD 5B Series E 轮（2025）
        - 有强客户证明的企业 AI 领导者可以拿到高溢价私募估值。
        - 可作为垂直 AI 上沿可比公司，披露规模增长快于 Simile。
        - 法律 AI 的变现披露更清晰，风险面也不同。
      - - Glean
        - USD 7.2B Series F 轮（2025）
        - 具备 ARR 可见性和广泛工作流嵌入的企业 AI 平台，估值可以高于 Simile。
        - 衡量可见商业牵引能换来什么估值时，这是规模化企业 AI 的有用参照。
        - Glean 披露 ARR 超过 $100M，连接器和平台规模也大得多。
      - - Qualtrics
        - USD 12.5B 私有化交易（2023）
        - 客户洞察和体验管理平台成熟后，也能撑起很大的退出结果。
        - 可作为研究和洞察软件规模化后的长期品类参照。
        - Qualtrics 当时已是成熟上市公司，服务 19,000+ 家组织，披露也更深。
      - - UserTesting
        - USD 1.3B 收购（2022）
        - 即便够不上巨型平台估值，客户研究工作流公司仍可能具备战略价值。
        - 这是洞察软件下沿的有用标尺，更接近工作流工具，而不是平台统治。
        - 市场背景更早，工作流范围比 Simile 更成熟、更窄。
      - - Writer
        - USD 500M Series B 轮（2023）；USD 1.9B Series C 轮（2024）
        - NRR、增长、安全和客户广度披露得更具体后，企业 AI 应用估值可能很快重估。
        - 这是企业 genAI 平台包装和溢价重估潜力的相邻可比对象。
        - Writer 服务的是更横向的内容 / 智能体用例，不是行为模拟。
      - - Hebbia
        - USD 700M Series B 轮（2024）
        - 早期但已变现的 AI 工作流公司，即使没到 Simile 级别的估值标记，也可能拿到高定价。
        - 有参考价值，因为它在收入背景更清楚的情况下，显示 AI 工作流需求很强。
        - 主要面向知识工作和金融 / 法律工作流，不是合成行为建模。
    notes: 可比集合混合了未上市 AI 应用龙头和客户洞察软件基准，因为不存在完全匹配的上市纯标的。
