  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻预算池与替代方案
        blocks:
          - type: paragraph
            body: >-
              不能把 Simile 按通用 LLM 公司来估算。已审阅证据显示，它处在四个相邻支出池的交汇处：外包市场研究服务、研究软件、合成数据基础设施和 AI 辅助决策工具。ESOMAR 的 2024
              年框架尤其有用，因为它把更广义的洞察行业和较窄的核心市场研究部门分开；Simile 自身材料和 Financial Narrative
              则显示，产品试图从样本组、问卷、焦点小组以及部分咨询式市场测试中拿预算。与此同时，替代方案不止传统研究。UserTesting、Outset、Listen Labs、YouGov 和 Toluna 等 AI
              主持的人类访谈平台，也在解决同一个「更快获得洞察」的问题，而且不用买方信任完全合成的人群。这意味着 Simile
              的真实市场边界不是「所有研究」，而是研究和战略决策中的一个子集：在这些场景里，模拟人类能产生足够可信的方向性价值，从而改变预算分配。
