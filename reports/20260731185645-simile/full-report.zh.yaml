            body: >
              即便没有完整财务披露，运营成本结构仍相当清楚。Simile 在做前沿模型式应用
              AI：这意味着研究人才、工程、模型基础设施、企业支持和持续验证构成高固定成本基座。参与者协议还显示，某些数据采集工作流依赖第三方招募平台，并可能包含文本、音频、视频和产品研究提交，从而增加纯软件业务不需要承担的可变交付成本。与此同时，如果定制人群和情景工作流从一次性研究变成可复用软件，商业模式的长期毛利潜力仍应强于传统研究机构。资本充足性方面，融资图景是档案里最清楚的一部分。Simile
              先完成 $100 million Series A，几个月后又以 $2 billion 投后估值完成超过 $200 million 的 Series
