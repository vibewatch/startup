        - 当前 ARR、增长队列、合同结构和服务收入占比没有公开披露。
        - 缺了这些，投资人无法判断 $2B 估值反映的是软件规模，还是叙事溢价。
        - 向管理层索取收入桥接表和客户队列文件。
      - - 留存与扩展
        - NRR、GRR、logo 留存，以及从旗舰账户扩展到更广账户的数据仍属私有。
        - 如果扩展可重复，而不是靠 logo 拉动，品类创造更值得投。
        - 按细分市场索取队列和续约分析。
      - - 毛利率与交付模式
        - 实施工作量、算力负担和服务绑定情况没有公开。
        - 这些决定 Simile 能否拿到高端软件倍数。
        - 索取毛利率瀑布图和部署资源模型。
      - - 安全与治理
        - 公开材料没有提供审计、架构或子群体校准证据。
        - 风险姿态直接影响采购速度，也支撑估值。
        - 索取安全包、红队结果和验证仪表盘。
      - - 融资条款与结构
        - 清算优先权、老股转让比例、期权池变化和股权结构影响均未披露。
        - 真实经济入场价可能与名义估值有重大差异。
        - 审阅投资条款清单、股权表和律师备忘录，包括法律实体链条。
    notes: 每项尽调要求都直接对应当前价格能否支撑投资论证。
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV037
      - CV041
      - CV042
