      - CI024
      - CI025
      - CI031
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Simile 的架构分层串起真人数据采集、行为锚定、智能体编排、验证和企业交付。
    data:
      layers:
        - label: 参与者与客户数据
          detail: 访谈、调研、行为数据集、忠诚度或遥测输入，以及产品研究提交内容。
          tone: neutral
        - label: 人类行为基础模型
          detail: 模型经过训练，用来表示偏好、经历和决策模式。
          tone: positive
        - label: 智能体架构
          detail: 记忆、检索、反思和规划让智能体随时间保持连贯。
          tone: positive
        - label: 验证与置信度
          detail: 每周校验、分布距离和预测准确率评分。
          tone: positive
        - label: 企业场景界面
          detail: 客户比较定价、信息表达、政策和体验场景。
          tone: positive
    approximationNotes: 技术栈根据公开产品、研究和验证描述综合而成，并非来自已发布的系统图。
    claimRefs:
      - CE001
      - CE010
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 产品作为实地调研前的模拟循环使用，在昂贵的真人测试或部署前先收窄选项。
    data:
      nodes:
        - id: n1
          label: 定义业务问题
          detail: 定价、政策、客户体验、产品或沟通决策。
          tone: neutral
        - id: n2
          label: 构建或选择目标人群
          detail: 以真实人群起步，在可用时加入客户管控的数据。
          tone: positive
        - id: n3
          label: 运行可比场景
          detail: 用同一人群测试多个选项。
          tone: positive
        - id: n4
          label: 检查置信度和子群输出
          detail: 用预测准确率和验证信号筛选结果。
          tone: warning
        - id: n5
          label: 用真人验证有希望的选项
          detail: 后续试点、实地调研或运营上线。
          tone: positive
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
    approximationNotes: 公开证据表明，Simile 最可信的定位是前端决策加速器，而不是闭环自治系统。
    claimRefs:
      - CE003
      - CE006
      - CE021
      - CE022
      - CE023
      - CE029
