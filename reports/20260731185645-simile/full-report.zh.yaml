      - number: '5.2'
        title: 架构、数据扎根与验证机制
        blocks:
          - type: paragraph
            body: >
              核心技术论点由三层组成。第一层是 Joon Sung Park 2023 年「Generative
              Agents」论文推广的生成式智能体架构；记忆、检索、反思和规划让模拟人类随时间保持连贯行为，而不是像彼此割裂的提示词。第二层是更新的、以访谈和问卷扎根的智能体工作；它显示生成式智能体复现人类回答的水平，约达到人类自身复测一致性的
              83% 到 86%，支持模型无需任务专属再训练也能跨多种结果泛化的想法。第三层是 Simile 的企业层：每周与真实人类对照验证，跨子人群和用例完成超过 7,000
              次评估，总变差距离比较，以及一个独立置信度模型，用来提示系统何时应少被信任。合在一起，这个产品试图把不确定性放到一等公民位置。这很关键，因为企业模拟最难的问题不是生成看似合理的答案；而是当情景变化、受众变窄或多智能体互动引入二阶效应时，如何知道合理输出仍有足够扎根。
