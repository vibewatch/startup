        title: 财务风险、论点失效触发器与剩余敞口
        blocks:
          - type: paragraph
            body: >
              Simile 融资能力强，压低了近期生存风险，但没有消掉模型和执行风险。已披露资本超过 $300 million， 让公司有空间继续投入；但公开记录仍缺少现金消耗、现金跑道、毛利率、ACV
              和续约数据。也就是说，投资人还无法清楚区分 可持续的软件经济性，和成本高、故事强的服务业务。法律实体沿革也带来一个不大但真实的尽调问题：SEC 备案记录中有一家 2018 年、地址在 Brooklyn 的
              Simile Inc.；已审阅来源无法最终证明该实体就是现在这家 Palo Alto 初创公司。 这些缺口单独看都不足以推翻投资论点，但合在一起，残余风险偏高。若 Simile
              的验证信号转弱，若隐私或同意授权争议浮现， 若锚定客户没有扩张，或若既有厂商和更低成本的合成工具侵蚀这个仍不透明模式的定价能力，投资论点就会失效。公司有合理缓释手段， 但公开证据仍支持谨慎跟踪，而不是完全信任。
