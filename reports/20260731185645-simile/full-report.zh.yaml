  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >
              Simile
              的公开政策清楚表明，这门生意处理的是敏感地带。公司在客户和参与者工作流中收集个人数据，可能摄取原始文本、音频和视频，可能用这些提交生成基于文本的数字孪生，也可能把这些提交提供给第三方客户，用于商业和市场研究目的。参与者协议随后把这些提交的广泛权利转让给
              Simile，把许多争议导入仲裁；在产品研究工作流中，还声明不承担产品缺陷、召回和许多下游伤害责任。这对快速移动的 AI
              初创公司并不罕见，但如果参与者、客户或监管者认为同意、披露、留存或下游使用边界不够清楚，就会产生真实法律和监管敞口。Simile 的医疗健康和政策邻近用例放大了风险。HIPAA
              不会自动适用于公开材料描述的每一个工作流，但它出现在医疗健康语境中，会抬高采购和治理门槛。NIST 和隐私政策来源强化了同一点：一旦 AI
              系统用于影响重要决策，可信性、隐私和治理就成为一阶法律风险，而不是次要文档工作。
            claimRefs:
              - CR001
