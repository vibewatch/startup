      - number: '8.2'
        title: 当前价格背景、轮次结构与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Simile 2026 年 7 月的融资背景很有冲击力，但预期也异常重。公司据报道只用了几个月，就从约 $100M 的 Series A 轮， 推进到估值 $2B、规模 $200M+ 的 Series B
              轮，已披露资本增至约 $300M+。这种速度说明投资人需求强劲， 但也意味着 Series B 投资人在完整运营披露之前就先把价格付上去了。公开材料列出高知名度投资人和战略参与方，
              却没有披露清算优先权、老股成分、期权池调整，或其他决定真实经济入场价的投资条款清单细节。连 SEC 线索也引出一个小但非零的结构性尽调问题： 一家 2018 年 Simile Inc.
              的备案记录可见，但公开层面没有把它和当前 Palo Alto 初创公司最终接上。 因此，这里的入场纪律比典型故事轮更重要：问题不是 Simile 是否有意思，而是 $2B 价格是否已经预设了品类龙头经济性，
              而公开记录尚未证明这一点。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
