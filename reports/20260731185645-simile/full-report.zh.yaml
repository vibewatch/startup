      - number: '7.2'
        title: 模型有效性、安全与误用风险
        blocks:
          - type: paragraph
            body: >
              第二组风险是技术性的，但在商业上关乎生死。只有买方足够信任并据此行动，Simile 产品才有价值；然而独立文献反复警告，合成用户可能产出看似合理但浅薄、有偏或不稳定的结果。Nielsen Norman
              Group、User Interviews、MeasuringU 和 Cambridge
              政治分析论文的公开评论，都收敛到类似担忧：这些系统也许能匹配大趋势，却会漏掉子群细节、效应幅度、变异性或可复现性。Gallup
              拒绝把模拟回答用于公开总体估计尤其重要，因为它显示即便友好的方法论伙伴也会划线。Simile 自身缓释措施——每周验证、超过 7,000
              次评估、总变差距离检查和置信度模型——直接瞄准这个失效模式，但并不能消除它。公开记录仍未显示完整子群校准曲线、失败案例披露或详细安全架构。Simile
              的隐私通知甚至写明，没有任何安全措施不可突破，也不能保证完美安全。因此存在真实运营风险：输出误用、数据泄漏或过度自信外推，可能在公司发现故障前就伤害客户。
