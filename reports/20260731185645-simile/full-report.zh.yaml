  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >
              理解 Simile
              客户群，最好把它看作一组范围较窄的企业买方：他们面对高成本决策、复杂用户旅程，并且对真实实验失败容忍度有限。具名背书集中在医疗健康、金融服务、消费品、研究与咨询工作和私募股权。这种分布重要，因为它显示产品并不局限于单一部门或单一数据制度；Simile
              面向洞察、设计、体验、创新、战略和投资团队销售，这些团队都需要在投入资本前预测人类会如何反应。可能的买方是资深洞察、CX、设计、战略或运营负责人，日常用户则在研究员、产品经理和分析师那里。公开证据还显示，付费方通常是企业预算负责人，而不是单个席位购买者；这符合公司的客户专属人群和模拟工作流。品类组合是优势，因为它显示横向适用性；但也提出一个尽调问题：哪些垂直行业真正带来可重复收入，哪些还只是概念验证客户。
