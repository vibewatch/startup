chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、使命与产品叙事
        blocks:
          - type: paragraph
            body: >-
              Simile
              展示给外界的不是又一个文本生成模型，而是一家在做人类行为基础模型的公司。官网和博客反复把产品包装成企业创建合成人群、在真实世界推出产品、信息、价格或政策前查询「智能体双胞胎」的方式。这个定位很关键：它把
              Simile 定义为研究和战略的决策基础设施，而不只是问卷工具或工作流助手。公司材料也说明，Simile 试图从一次性的客户响应模拟，逐步走向更广泛的市场模拟和多智能体模拟。尽调中的核心身份因此是：一家私营企业
              AI 软件公司，向大型组织出售模拟访问、定制数据扎根和带置信度评分的行为预测。
