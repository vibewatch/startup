            body: >
              Simile 当前部署姿态更像企业软件加研究服务，而不是自助开发者平台。已审阅界面强调客户专属研究、定制人群和边界清楚的业务问题，而非公开 API
              或透明用量计量。不过，产品似乎正在沿成熟度曲线向上走。公开材料提到 Fortune 100 部署、数千万次模拟、50+
              名员工，以及横跨医疗健康、金融服务、消费品和专业服务的扩展用例。路线图语言也很有野心：从单个客户模拟到跨时间旅程，再到竞争对手互动、政策变化，最终到市场级环境。这条弧线与从 Smallville
              到更大智能体人群的研究谱系一致，但也带来执行风险，因为交互变量越多，模拟质量越可能下降。连接原始研究的公开 GitHub 仓库提供了开发者信号，但也凸显 Simile
              商业平台本身大多仍是私有的，必须通过论文、客户故事和企业结果评估，而不是通过开源产品遥测。
