      - number: '8.4'
        title: 退出准备度、最终尽调问题与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Simile 还没有具备退出准备度，但已经足够接近，值得有纪律地继续跟进。公司具备未来几年支撑战略出售或 IPO 叙事的要素： 蓝筹客户、强学术品牌、大额私募资本基础，以及能打动企业 AI
              买家的品类故事。缺的是把欣赏转成投资确信的证据包。 投资人仍需要 ARR、NRR、续约分组、毛利率、现金消耗、现金跑道、定价兑现、安全控制、子群校准和轮次条款的硬数据。 Gallup
              的限定用途立场和风险章节中的治理担忧在这里很重要，因为它们限制 Simile 从有意思的工具升级为可信决策层的速度。
              如果验证优势转弱，隐私或同意授权争议出现，锚定客户停止扩张，或竞品在公司把采购信任标准化之前抹掉 Simile 感知上的方法论领先，
              投资论点就会失效。在这些问题更清楚之前，合适姿态是主动跟踪和定向尽调，而不是激进接受价格。
