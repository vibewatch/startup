  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Simile 似乎先切入一个高风险决策问题，靠更安全的预测试证明价值，再扩展到相邻工作流和人群。
    data:
      items:
        - label: 识别企业问题
          detail: 客户面对昂贵、敏感或难以测试的决策。
          tone: neutral
        - label: 首个模拟用例
          detail: 团队测试一个狭窄工作流，例如依从性、概念测试或定性探索。
          tone: positive
        - label: 信任与验证关口
          detail: 客户评估模拟发现能否匹配已知证据或下游真人证据。
          tone: warning
        - label: 更广泛项目扩展
          detail: 信心增强后，客户加入更多团队、场景和人群。
          tone: positive
        - label: 经常性战略系统
          detail: 模拟进入规划和实验节奏。
          tone: positive
