              - CV028
      - number: '8.3'
        title: 乐观、基准、悲观情景与可比估值组
        blocks:
          - type: paragraph
            body: >-
              由于 Simile 未公开披露 ARR 或毛利结构，精确收入倍数模型会是假精确。情景框架更合适。乐观情景下， Simile 把研究领先、客户名单和每周验证叙事转化为可见的软件化经济性、更广的企业客户分散度，
              以及通向合成行为洞察平台领导者的可信路径；这种状态可以支撑中个位数十亿美元结果。基准情景下， 公司仍然亮眼，但只部分拆掉留存、毛利率、限定用途和治理这些最难的问题，当前轮次看起来大致合理，而不是明显便宜。
              悲观情景下，验证局限、采购摩擦或偏服务交付会收窄市场故事，把公司压向低端工作流软件结果。可比证据支持这种框架： Harvey 和 Glean 显示，披露规模更强的企业 AI 领导者可以拿到高于 Simile
              的估值；Hebbia、Writer 和 UserTesting 则显示， 有吸引力的工作流品类仍可能显著低于最强后期 AI 溢价区间。Qualtrics 提供的是规模化客户洞察平台能走到哪里， 不是 Simile
              今天已经证明了什么。
