        - label: 研究 / 团队质量
          value: 9
        - label: 客户证明
          value: 7
        - label: 经济性可见度
          value: 3
        - label: 治理准备度
          value: 4
        - label: 估值吸引力
          value: 4
        - label: 退出准备度
          value: 5
    approximationNotes: 评分是基于公开证据的 0-10 尽调判断，不是内部运营 KPI。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV029
      - CV035
      - CV042
