  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流定义产品
        blocks:
          - type: paragraph
            body: >
              Simile
              卖的是模拟工作流，不只是模型端点。公司公开材料描述的流程从真实人群开始，使用专有研究设计和行为数据集构建人群，让客户运行可比情景，并返回带预测置信度的输出。实际产品似乎位于市场研究工具、决策支持软件和私有建模服务之间。客户被邀请带入自己的忠诚度、余额历史或遥测数据，让模型代表特定受众，而不是泛化消费者画像。公开用例——从
              CVS 服药依从性测试，到产品开发和市场进入情景——表明，当企业需要在真实试点或把客户暴露给糟糕决策之前预筛高风险想法时，这个工作流最有价值。Simile
              较新的产品研究参与文件还暗示第二个运营界面：公司管理与已出货消费产品相关的提交，把平台从纯文本问卷扩展到更丰富的观察式和居家研究工作流。
