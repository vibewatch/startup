    sections:
      - number: '3.1'
        title: 竞争类别与买方真正要完成的任务
        blocks:
          - type: paragraph
            body: >
              买方不会把 Simile 当成泛泛的「AI 研究」工具；他们会把它和发布、政策调整、价格测试或体验重设计前所有降低不确定性的方法比较。已审阅格局可分为三类。第一类是
              Qualtrics、Alchemer、Nielsen、Kantar、Toluna 和 YouGov 等既有问卷和样本供应商，它们仍用大规模人类数据采集、品牌追踪和企业采购来锚定信任。第二类是
              UserTesting、Outset、Listen Labs、Respondent 和 Prolific 等 AI 主持的人类研究平台，它们承诺更快招募、访谈自动化和综合分析，同时把真实参与者留在回路中。第三类是
              Synthetic Users、Fairgen、Viewpoints.ai、Evidenza、Brox 和 Artificial Societies
              等合成用户与数字孪生初创公司，试图用模拟受众替代或前置部分外勤研究。Simile 最接近第三类，但向上进入更高风险的企业模拟，因此相关竞争比合成用户同行清单更宽。
