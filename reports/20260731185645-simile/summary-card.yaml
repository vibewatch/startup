  topStrengths:
    - >-
      Stanford-origin research lineage and founder-market fit are unusually strong for a company creating a new AI
      application category.
    - >-
      Public customer proof is better than average for a young private company, with CVS Health and Gallup serving as
      especially meaningful reference points.
    - >-
      The company claims 5x revenue growth since public launch and tens of millions of simulations run, suggesting real
      enterprise pull rather than purely academic interest.
    - >-
      A $300M+ disclosed capital base gives Simile time to invest in model quality, GTM, and governance without
      immediate financing pressure.
  topRisks:
    - >-
      ARR, margin, retention, and burn remain undisclosed, making a precise underwriting case impossible from public
      evidence alone.
    - >-
      Privacy, bounded-use, and model-validity risks can directly affect procurement speed and multiple support if they
      surface in important customer segments.
    - >-
      The current $2B valuation appears to assume category-leader economics before those economics are publicly
      demonstrated.
    - >-
      Flagship proof points such as CVS Health and Gallup strengthen the story but also create concentration and
      expectation risk.
  unresolvedGaps:
    - Current ARR, NRR/GRR, gross margin, and deployment cost structure remain private.
    - Series B liquidation preferences, secondary mix, option-pool effects, and full cap-table economics are not public.
    - >-
      Security evidence, subgroup calibration curves, and detailed failure-case disclosures were not found in public
      materials.
    - >-
      The relationship between the current company and the visible 2018 Simile Inc. SEC filing trail is not conclusively
      bridged in public sources.
