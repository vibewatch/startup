callouts:
  - calloutType: insight
    title: Hybrid Software-Logistics Operating Model
    body: ShipBob's technical defensibility lies not merely in cloud-hosted microservices, but in the tight integration between proprietary warehouse management software (ShipBob WMS) and physical fulfillment center operations. While pure SaaS logistics platforms struggle with physical execution variance, ShipBob's unified software-and-facility model allows end-to-end data capture from cart checkout to carrier delivery handoff.
    claimRefs:
      - CE001
      - CE002
      - CE007
  - calloutType: risk
    title: Carrier and Warehouse Facility Externalities
    body: Despite high software automation and reported 99.97% fulfillment accuracy within warehouse facilities, ShipBob cannot insulate merchants from external carrier transit delays, regional labor bottlenecks, or peak season freight surcharges. Consumer complaints frequently reflect customer frustration originating at carrier handoffs rather than internal WMS logic.
    claimRefs:
      - CE004
      - CE011
      - CE012
      - CE015
