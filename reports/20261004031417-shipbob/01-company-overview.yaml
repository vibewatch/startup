chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2014 by Dhruv Saxena and Divey Gulati, ShipBob operates a global tech-enabled ecommerce fulfillment network spanning more than 50 fulfillment centers. The company reached a $1.0 billion valuation in its June 2021 Series E led by Bain Capital Ventures and has raised over $330.5 million to date, though post-2022 private valuation marks, 2024–2026 audited revenue actuals, and cash burn remain undisclosed private gaps."
sections:
  - id: "corporate-identity-and-business-model"
    title: "Corporate Identity and Business Model"
    body: "ShipBob, Inc. is a Chicago-headquartered supply chain and order fulfillment provider founded in 2014 by Dhruv Saxena and Divey Gulati. Launched through Y Combinator, ShipBob provides direct-to-consumer and omnichannel ecommerce brands with a unified software platform that integrates distributed warehouse operations, order orchestration, carrier selection, and real-time inventory tracking. The company's core operating model combines proprietary merchant-facing software and warehouse management systems (WMS) with an international network spanning more than 50 fulfillment centers across the United States, Canada, the United Kingdom, the European Union, and Australia. ShipBob reports fulfilling over 300 million orders through its network with a self-reported order fulfillment accuracy rate of 99.97% while supporting over 200 retail integration channels. In addition to standard DTC fulfillment, ShipBob expanded into adjacent merchant offerings including ShipBob Plus for fast-growing brands and ShipBob Capital embedded merchant financing."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Governance Structure"
    body: "ShipBob continues to be led by co-founder Dhruv Saxena, who has served as Chief Executive Officer since the company's inception in 2014 following an engineering background at Purdue University. Co-founder Divey Gulati partnered with Saxena in launching the company from initial package pickups into an international logistics network. In May 2025, ShipBob made a material executive addition by hiring Adam Patnaude as Chief Financial Officer, bringing over 25 years of capital markets, M&A, and investor relations experience from leadership roles including Grubhub to prepare the company's capital structure and governance for public listing readiness. Key-person dependence remains concentrated in CEO Dhruv Saxena, whose operational tenure and strategic direction anchor merchant relationships, institutional investor alignment, and technology execution."
    claimRefs:
      - "CO002"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-investors-and-valuation"
    title: "Capitalization, Investor Base, and Financing History"
    body: "ShipBob has raised over $330.5 million in cumulative primary funding across multiple venture and growth rounds. The company achieved unicorn status on June 29, 2021, closing a $200 million Series E round led by Bain Capital Ventures at a post-money valuation of $1.0 billion (with historical reports documenting $1.075 billion). The institutional cap table includes prominent venture capital and strategic backers such as Bain Capital Ventures, Menlo Ventures, Hyde Park Venture Partners, SoftBank, Silicon Valley Bank, and Y Combinator. While market research indicates the company reportedly explored a $4.0 billion valuation target for an initial public offering as of 2024, post-2022 private market valuation marks, liquidation preference seniority, and dilution waterfalls remain undisclosed. Furthermore, 3PL procurement evaluations emphasize that headline fulfillment rates must be weighed against accessorial fees, inventory reconciliation workflows, and service level adherence."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
