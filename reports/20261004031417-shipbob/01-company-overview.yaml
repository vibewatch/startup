callouts:
  - calloutType: "insight"
    title: "Hybrid Operating Model: Proprietary Software with Distributed Asset Footprint"
    body: "Unlike pure-play software brokers or traditional asset-heavy logistics operators, ShipBob combines 100% owned software IP (WMS, carrier routing, and merchant portal) with a distributed network of 50+ facilities. This architecture enables SMBs to access multi-node inventory placement while exposing ShipBob to warehouse operational overhead and warehouse-level SLA variability."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO016"
  - calloutType: "risk"
    title: "Capitalization Staleness vs. 2026 Multiples and Operational Execution Friction"
    body: "ShipBob's $1.0B valuation dates back to its June 2021 Series E round. In the absence of audited 2024–2026 financials or updated 409A marks, diligence must account for multiple compression in public e-commerce logistics comps, alongside documented procurement critiques regarding SLA breaches, inventory reconciliation errors, and complex accessorial fees."
    claimRefs:
      - "CO012"
      - "CO014"
      - "CO015"
      - "CO016"
