chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              ShipBob, Inc. is a Chicago-headquartered supply chain and order fulfillment provider founded in 2014 by
              Dhruv Saxena and Divey Gulati. Launched through Y Combinator, ShipBob provides direct-to-consumer and
              omnichannel ecommerce brands with a unified software platform that integrates distributed warehouse
              operations, order orchestration, carrier selection, and real-time inventory tracking. The company's core
              operating model combines proprietary merchant-facing software and warehouse management systems (WMS) with
              an international network spanning more than 50 fulfillment centers across the United States, Canada, the
              United Kingdom, the European Union, and Australia. ShipBob reports fulfilling over 300 million orders
              through its network with a self-reported order fulfillment accuracy rate of 99.97% while supporting over
              200 retail integration channels. In addition to standard DTC fulfillment, ShipBob expanded into adjacent
              merchant offerings including ShipBob Plus for fast-growing brands and ShipBob Capital embedded merchant
              financing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: Executive Leadership and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              ShipBob continues to be led by co-founder Dhruv Saxena, who has served as Chief Executive Officer since
              the company's inception in 2014 following an engineering background at Purdue University. Co-founder Divey
              Gulati partnered with Saxena in launching the company from initial package pickups into an international
              logistics network. In May 2025, ShipBob made a material executive addition by hiring Adam Patnaude as
              Chief Financial Officer, bringing over 25 years of capital markets, M&A, and investor relations experience
              from leadership roles including Grubhub to prepare the company's capital structure and governance for
              public listing readiness. Key-person dependence remains concentrated in CEO Dhruv Saxena, whose
              operational tenure and strategic direction anchor merchant relationships, institutional investor
              alignment, and technology execution.
            claimRefs:
