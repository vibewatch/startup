  - id: FI001
    title: Revenue activity bridge
    type: flow
    summary: A conceptual sequence from merchant activity to gross profit, with the undisclosed conversion inputs kept visible.
    data:
      nodes:
        - label: Merchant connects store
          detail: Commerce data enters ShipBob's workflow.
        - label: Inventory is received
          detail: Receiving can create event- and time-based charges.
        - label: Inventory is stored
          detail: Pallet, shelf, or bin capacity can create monthly charges.
        - label: Orders are picked and packed
          detail: Fulfillment activity creates order-handling revenue.
        - label: Orders are shipped
          detail: Shipping is delivered, but carrier accounting is not disclosed.
        - label: Gross profit remains
          detail: Realized price, pass-through costs, labor, and utilization are unavailable.
    approximationNotes: >-
      Conceptual mechanism only; the assigned sources do not disclose revenue mix, carrier pass-through accounting, or
      gross-margin conversion.
    claimRefs:
      - CI001
      - CI003
      - CI009
  - id: FE001
    title: ShipBob Platform Architecture Stack
    type: stack
    summary: >-
      Multi-tier operating stack spanning client integration, orchestration intelligence, warehouse execution, physical
      fulfillment assets, data telemetry, and technical governance.
    data:
      layers:
        - label: Experience & Integrations Layer
          detail: Merchant Web Portal in React/TypeScript, pre-built ecommerce connectors, and developer APIs.
          modules:
            - label: Merchant Dashboard
              detail: React & TypeScript web interface
            - label: Storefront Connectors
              detail: Shopify, Amazon, and 200+ retail channel APIs
            - label: Developer APIs
              detail: Solutions Architect integration endpoints
        - label: Intelligence & Orchestration Layer
          detail: Dynamic order routing algorithms, carrier rate calculations, and ShipBob AI context agents.
          modules:
            - label: ShipBob AI & MCP
              detail: Automated telemetry queries and action layer
            - label: Order Routing Engine
              detail: Facility proximity and SLA optimization
            - label: Inventory Placement
              detail: Multi-hub stock allocation algorithms
        - label: Warehouse Execution Layer (ShipBob WMS)
          detail: Proprietary warehouse execution system directing facility picking, packing, and validation.
          modules:
            - label: Location & Put-Away
              detail: Directed barcode put-away management
            - label: Wave & Batch Picking
              detail: Mobile terminal guided picking paths
            - label: Packing Verification
              detail: Barcode validation with 99.97% accuracy
        - label: Physical Network & Logistics Layer
          detail: Distributed network of 50+ global fulfillment centers and multi-carrier parcel induction.
          modules:
            - label: Fulfillment Centers
              detail: 50+ hubs in US, Canada, Europe, Australia
            - label: Operations & Tech Pods
              detail: On-site staff and dedicated technical teams
            - label: Carrier Induction
              detail: Regional postal and express carrier handoffs
        - label: Data & Telemetry Backbone Layer
          detail: Unified database state replication, event streaming, and operational audit telemetry.
          modules:
            - label: Event Bus & Queues
              detail: Real-time inventory and order updates
            - label: Audit & Reporting
              detail: Merchant analytics and dispute telemetry
        - label: Governance & Review Tier
          detail: Cross-cutting engineering standards, performance testing, and Architectural Review Board oversight.
          modules:
            - label: Architectural Review
              detail: Senior engineering governance board
            - label: Technical Debt Control
              detail: Performance planning and service standards
    approximationNotes: >-
      Architectural layers reflect functional logical tiers derived from verified software job postings, platform
      documentation, and operational disclosures.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: ShipBob Merchant Journey and Expansion Lifecycle
    type: journey-map
    summary: >-
      Visual map of the merchant lifecycle from channel integration and inventory distribution through multi-node
      expansion and retention friction points.
    data:
      nodes:
        - label: Storefront Integration
          detail: Connect Shopify, WooCommerce, Amazon, or EDI channels to sync products and catalog data.
        - label: Inventory Distribution
          detail: Inbound stock receiving and multi-node placement across regional fulfillment centers.
        - label: Automated Fulfillment
          detail: Orders ingested, picked, packed, and handed to optimal carriers with 2-day delivery SLA.
        - label: Channel Expansion
          detail: Merchant unlocks B2B retail dropship, wholesale kitting, and international cross-border hubs.
        - label: Account Durability Check
          detail: Quarterly merchant business reviews navigate quote variances, carrier surcharges, and SLA claims.
        - label: Retention or Churn Decision
          detail: Merchants either scale into dedicated enterprise WMS tiers or migrate away due to billing and SLA friction.
    approximationNotes: Journey stages modeled from ShipBob merchant onboarding documentation, MSM hiring specs, and procurement reviews.
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU012
      - CU013
