        title: Capitalization, Investor Base, and Financing History
        blocks:
          - type: paragraph
            body: >-
              ShipBob has raised over $330.5 million in cumulative primary funding across multiple venture and growth
              rounds. The company achieved unicorn status on June 29, 2021, closing a $200 million Series E round led by
              Bain Capital Ventures at a post-money valuation of $1.0 billion (with historical reports documenting
              $1.075 billion). The institutional cap table includes prominent venture capital and strategic backers such
              as Bain Capital Ventures, Menlo Ventures, Hyde Park Venture Partners, SoftBank, Silicon Valley Bank, and Y
              Combinator. While market research indicates the company reportedly explored a $4.0 billion valuation
              target for an initial public offering as of 2024, post-2022 private market valuation marks, liquidation
              preference seniority, and dilution waterfalls remain undisclosed. Furthermore, 3PL procurement evaluations
              emphasize that headline fulfillment rates must be weighed against accessorial fees, inventory
