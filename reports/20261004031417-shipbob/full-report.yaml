figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: Key corporate, operational, financing, and executive milestones across ShipBob's evolution from 2014 to 2026.
    approximationNotes: Milestones reflect verified public launch, funding, network scale, and executive appointment events.
    data:
      items:
        - label: '2014: Company Founding and Y Combinator'
          detail: >-
            Dhruv Saxena and Divey Gulati found ShipBob in Chicago to provide package shipping for SMBs, entering Y
            Combinator.
          tone: positive
        - label: '2015: Commercial Launch & Scheduled Pickups'
          detail: ShipBob launches scheduled package pickup and shipping for merchants selling on eBay, Shopify, and Etsy.
          tone: positive
        - label: '2017: Warehouse Network Expansion'
          detail: Company scales physical fulfillment operations from Chicago to 4 regional warehouses across the US.
          tone: neutral
        - label: '2021: Series E Unicorn Financing'
          detail: ShipBob raises $200M in Series E funding led by Bain Capital Ventures at a $1.0B post-money valuation.
          tone: positive
        - label: '2024: IPO Preparations Explored'
          detail: ShipBob reportedly evaluates public listing options and targets up to a $4B valuation marker.
          tone: neutral
        - label: '2025: CFO Appointment & Governance Buildout'
          detail: >-
            Adam Patnaude hired as CFO in May 2025 to lead capital structure, financial controls, and investor
            relations.
          tone: positive
        - label: '2025: Service Tier & Network Evolution'
          detail: Rolls out ShipBob Plus for fast-growing brands while expanding fulfillment network to 50+ global facilities.
          tone: neutral
        - label: '2026: Operational Scrutiny & SLA Friction'
          detail: >-
            Merchants and procurement reviews document SLA friction, carrier substitution disputes, and fee
            reconciliation issues.
          tone: negative
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO007
      - CO010
      - CO012
      - CO014
      - CO016
