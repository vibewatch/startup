  topStrengths:
    - Large distributed fulfillment footprint with 50+ centers and 300M+ orders fulfilled.
    - Strong customer proof from named merchants with measurable cost and time savings.
    - Proprietary WMS and integration stack support omnichannel fulfillment across channels.
  topRisks:
    - 'Private financial opacity: no audited 2024-2026 revenue, margin, burn, or preference-stack disclosure.'
    - Operational variability and merchant complaints around SLA, inventory, and billing disputes.
    - Pricing opacity and carrier / platform dependency risk remain material.
  unresolvedGaps:
