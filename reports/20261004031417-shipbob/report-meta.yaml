companyProfile:
  summary: >-
    ShipBob is a Chicago-based, founder-led tech-enabled 3PL that combines proprietary warehouse management software
    with a distributed global fulfillment network for DTC and omnichannel merchants. Founded in 2014 by Dhruv Saxena and
    Divey Gulati, the company reports 50+ fulfillment centers, 300M+ orders fulfilled, and more than $330.5M in
    cumulative funding, but current financial statements, post-2022 valuation marks, and capital-structure details
    remain opaque.
