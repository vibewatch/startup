evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-cash-burn
    missingEvidence: >-
      Audited financial statements for fiscal years 2024 through 2026, including GAAP revenue, cost of goods sold, gross
      margin baseline, net burn rate, and cash runway.
    whyItMatters: >-
      Without audited top-line and unit economics, revenue scale ($500M 2023 third-party estimate) and path to
      profitability cannot be verified.
    diligencePath: >-
      Request confidential audited financial statements, historical income statements, and management's 2026 budget
      under NDA.
    relatedQuestionRefs:
      - QO008
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-series-e-valuation-and-preference-stack
    missingEvidence: >-
      Current 409A common stock valuation marks, secondary market transaction pricing post-2022, and preferred share
      liquidation preference stack.
    whyItMatters: >-
      The $1.0B post-money valuation mark from June 2021 is over 5 years old; broader ecommerce 3PL public multiples
      compressed significantly between 2022 and 2026.
    diligencePath: Review recent cap table summary, board-approved 409A valuation reports, and secondary transaction volume.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: comprehensive-executive-leadership-enumeration
    missingEvidence: >-
      Full C-suite and vice president executive roster, including Chief Technology Officer, Chief Operating Officer, and
      Chief Revenue Officer profiles.
    whyItMatters: Ensures evaluation of organizational depth beyond CEO Dhruv Saxena and newly appointed CFO Adam Patnaude.
    diligencePath: >-
      Examine internal leadership organizational charts and formal corporate SEC Form S-1 registration statement filings
      if an IPO proceeds.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: addressable-market-share
    missingEvidence: >-
      Audited merchant GMV processed directly across ShipBob facilities to calculate exact market share of non-Amazon
      ecommerce GMV.
    whyItMatters: >-
      Without audited transaction volume or disclosed net revenue actuals, standalone SOM penetration cannot be
      validated against public comps.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve month GMV throughput, and merchant cohort retention
      data during confidential management meetings.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: enterprise-retention-rates
    missingEvidence: >-
      Audited merchant churn rates, gross logo retention, and net revenue retention (NRR) broken down by merchant order
      volume tier for 2024–2026.
    whyItMatters: >-
      Competitor comparison literature reports an overall 38% annual churn rate across the 3PL industry, but ShipBob's
      specific cohort retention remains undisclosed private data.
    diligencePath: >-
      Request audited cohort retention tables, customer churn schedules, and cohort gross retention data under NDA
      during investment diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Realized revenue mix, gross margin, carrier pass-through accounting, facility utilization, labor cost per order,
      CAC, sales cycle, and payback by merchant segment.
    whyItMatters: >-
      Without these inputs, list prices and operating scale cannot establish contribution margin, operating leverage, or
      GTM efficiency.
    diligencePath: >-
      Request audited segment revenue, cost-of-revenue bridges, facility-level operating metrics, and cohort-level CAC
      and payback schedules.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, downside runway, debt and lease obligations, planned use of funds, and the operating
      trigger for another financing.
    whyItMatters: >-
      Historical funding raised is not cash available and cannot establish whether ShipBob can fund its network and
      reach profitability.
    diligencePath: >-
      Obtain current balance sheet, monthly cash-flow statements, debt and lease schedules, capex plan, and management's
      base and downside financing forecasts.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: wms-throughput-metrics
    missingEvidence: >-
      Quantitative benchmarks for internal WMS pick-to-pack scan latency, hardware handheld terminal reliability, and
      peak-hour database transaction throughput.
    whyItMatters: >-
      Without system throughput and latency telemetry, technical diligence cannot independently verify whether
      proprietary WMS software scales efficiently during sudden merchant order volume surges.
    diligencePath: >-
      Request WMS performance metrics, APM error rates, average scan latency logs, and load test reports covering the
      most recent peak holiday shipping season.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: >-
      Audited merchant cohort retention, gross revenue retention (GRR), net revenue retention (NRR), and annual churn
      rates by GMV tier.
    whyItMatters: >-
      Without cohort retention data, investors cannot verify whether ShipBob's customer growth is driven by durable
      organic expansion or masks high merchant turnover due to service dissatisfaction.
    diligencePath: >-
      Request confidential historical cohort retention tables, customer lifetime value (LTV) to CAC ratios, and
      reason-coded merchant churn logs during confirmatory diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive customer list with revenue contribution, contract tenure, and churn status beyond promotional public
      case studies.
    whyItMatters: Sample case studies highlight top-performing reference accounts but omit customer churn and negative outcomes.
    diligencePath: >-
      Request an anonymized customer master file with contract start dates, monthly parcel volume, and historical churn
      indicators.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-profitability
    missingEvidence: >-
      Audited financial statements detailing annual revenue, gross margin by fulfillment center, EBITDA, and net cash
      burn.
    whyItMatters: >-
      Without financial disclosures, it is impossible to evaluate whether ShipBob generates positive operating cash flow
      or remains dependent on equity capital to fund warehouse lease commitments.
    diligencePath: >-
      Request confidential historical income statements, audited balance sheets, and unit economic cohort data under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QR005
  - id: gap-carrier-sla
    type: missing-source
    severity: material
    topic: operational-sla-data
    missingEvidence: >-
      Granular on-time carrier pickup rates, dock-to-stock turnaround times, and insurance claim resolution timeframes
      across each facility.
    whyItMatters: >-
      Merchant complaint threads frequently allege extended delays between order labeling and carrier scanning that
      degrade customer delivery promises.
    diligencePath: Obtain quarterly facility-level SLA audit reports and insurance dispute log histories.
    relatedQuestionRefs:
      - QR002
      - QR004
    relatedTableRefs:
      - TR002
  - id: gap-regulatory-scope
    type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive audit of state-level warehouse licensing, international customs brokerage agency agreements, and
      pending litigation records.
    whyItMatters: >-
      Confirming that regional cross-border facilities operate with complete regulatory licenses prevents sudden
      regulatory closure or seizure risks.
    diligencePath: Conduct legal public records searches across state logistics licensing boards and federal court dockets.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Certified audited profit and loss statement, balance sheet, and statement of cash flows for fiscal years 2024
      through 2026.
    whyItMatters: >-
      Without audited gross margin and cash burn metrics, accurate DCF and multiple-based valuation benchmarking cannot
      be established.
    diligencePath: >-
      Request confidential disclosure of PCAOB-audited historical financial statements and management accounts under
      NDA.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: cap-table-liquidation-preference
    missingEvidence: >-
      Fully diluted capitalization table detailing Series E preferred liquidation multipliers, participation rights, and
      senior debt covenants.
    whyItMatters: >-
      Senior liquidation preferences could absorb a disproportionate share of exit proceeds in an acquisition below peak
      valuation expectations.
    diligencePath: Review the company's amended certificate of incorporation and preferred share purchase agreements.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
