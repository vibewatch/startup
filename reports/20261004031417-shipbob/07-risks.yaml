callouts:
  - calloutType: "risk"
    title: "Carrier Handover Bottlenecks and Customer Discontent"
    body: "Operational reviews and Better Business Bureau complaint filings indicate that fulfillment delays often stem from friction at the warehouse-to-carrier interface, where pre-labeled orders sit awaiting carrier scans. When combined with customer service communication lags during exception resolution, this operational friction poses brand durability risks for merchants."
    claimRefs:
      - "CR004"
      - "CR008"
      - "CR010"
  - calloutType: "insight"
    title: "Structural Margin Opacity in Outsourced 3PL Logistics"
    body: "Without public disclosure of EBITDA, gross margin profiles, or unit economics, investors cannot determine whether ShipBob's software-enabled logistics platform operates at cash profitability or remains dependent on previous equity financing to absorb facility lease overhead and peak-season labor cost spikes."
    claimRefs:
      - "CR006"
      - "CR009"
      - "CR012"
