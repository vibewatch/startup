      - number: '3.4'
        title: 客户信任、运营风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              跨多仓网络运营的一致性，依然是 ShipBob 面临的首要执行风险。RFP.wiki 和 G2
              上的第三方评价汇总反映出各仓满意度参差不齐：核心技术集成与入驻流程虽然评分较高，但不同仓库在入库周转速度、承运商交接效率以及客服响应水平上差异明显。商业改进局（Better Business Bureau,
              BBB）归档的公开投诉记录显示，平台在计费调整与货品遗失索赔主张纠纷解决上记录不断，这在高周转物流运营中屡见不鲜。对拟投资人而言，核心投资评估缺口在于缺乏经审计的分客群留存表、按商户规模细分的客户数流失率（gross
              logo churn）以及净金额留存率（NRR）。核实 ShipBob 的大客户留存能否扛住全行业 38% 的年均流失基准线，对于评估其长期终局价值与定价权至关重要。
            claimRefs:
              - CP008
              - CP011
              - CP012
      - number: '3.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 账单缺乏透明度与附加费推高 3PL 商户流失率
            body: >-
              虽然 ShipBob 具备覆盖全美的两日达履约能力，但商户反馈突出反映，意料之外的入库费、仓储费和拣货附加费经常超出最初的销售报价。全行业服务商年切换率高达 38%，计费透明度已成为成长期 DTC
              商户流失的关键诱因。
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP013
          - type: callout
            title: 物理网络规模对比垂直仓库服务保证
            body: >-
              ShipBob 的核心护城河依托于其 50+ 处节点的全球履约网络与自研 WMS，在大批量标准件包裹履约上建立了显著的运营优势。然而，Red Stag
              等垂类专精对手凭借白纸黑字的“零错拣保证”在大件重货领域夺得先机，而 Amazon MCF 则牢牢锁住了本就存有共享 FBA 库存的多渠道卖家。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP004
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化变现
        blocks:
          - type: paragraph
            body: >-
              ShipBob 呈现出两类核心交付形态：一是全外包履约，由其负责库存保管及订单拣货、打包与发货；二是依托 ShipBob WMS
              软件赋能的自营或混合履约。其公开披露的业务流始于商家接入店铺并调入库存，随后的实体订单处理即构成计费行为。Sacra
              在分析中将入库接收、仓储与订单履约列为三大计费组件。现有证据表明，公司属于高度挂钩交易量与仓容的收入模式，而非纯 SaaS 模式。由于未披露收入结构、WMS
              授权商业条款、承运商代收代付会计处理、合同账期、折扣政策以及实际变现率（take rate），投资判断时应对各项收入来源分别估值，切忌直接套用混合软件估值倍数。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI009
      - number: '4.2'
        title: 公开定价依据与业务规模验证
        blocks:
          - type: paragraph
            body: >-
              掌握的公开证据提供了标价参考基准，但无法反映商户层面的实际收费情况。Sacra 列出的收费标准为：入库接收前两小时 $25，之后每增加一小时加收 $40；月仓储费按每个托盘 $40、每个货架 $10、每个储位
              $5 计费；面向月订单低于 400 笔商户的 Growth 方案，每月保底消费 $275。这些数据属于行业分析师梳理的公开牌价，绝非经审计的实际收入或边际贡献。就规模而言，ShipBob 官网宣称已完成超过 3
              亿笔订单履约，而 Sacra 则估算其 2023 年实现收入 $500M，同比增长 42.9%。各指标统计周期与计算口径存在出入，不能直接套用为 ARR，也不应草率拼凑为当期的收入运行率。
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: 单量经济模型与资本充足度
        blocks:
          - type: paragraph
            body: >-
              公开渠道信息尚无法拼出完整的单量经济模型。入库、仓储和履约收费虽指明了收入进账路径，但在审阅的材料中，毛利率、仓房利用率、单均人工成本、承运商成本、获客成本（CAC）、销售周期、回本周期、客户集中度、营运资本账期以及资本开支画像等核心数据均无从考证。各家融资数据库的数据也自相矛盾：Tracxn
              记录其 8 轮融资共计 $333M，EquityZen 列出 $370M，而 Sacra 则记录为
              $330.5M。这些数据属于历史累计融资金额，绝非账面现有资金，因而无法据此推导当期烧钱速度、现金跑道、举债能力或下轮融资窗口。Sacra
              提及公司从未披露过任何盈利路径，这也进一步证明，切勿根据以往融资历史臆测经营状况，必须以最新的一级市场一手财务数据为准。
            claimRefs:
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 财务综合研判
        blocks:
          - type: paragraph
            body: >-
              该模式具备扎实的造血基础，因为仓储与履约是紧扣商户库存及订单的实体服务，且公开规模指标印证其具备庞大的线下运营网络。然而其收入质量未获证实：公布的名义牌价无法反映实际成交价、留存水平、收入结构或利润率，而公司官网宣传的客户节支案例仅能作为局部印证，不能代表普遍的分客群经济模型。反向证据同样需要审慎对待：BBB
              明确表示其不核实第三方投诉内容的真实性，并提示读者结合企业规模与交易量客观看待纠纷，因此相关的投诉页面不能作为推算差错率的依据。最终投资结论完全取决于深入尽调：在对盈利能力或资金充裕度做出投资判断之前，必须调阅经审计的真实收入、边际贡献、账面现金、烧钱速度、负债状况以及客群留存数据。
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI016
      - number: '4.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 累计融资金额不等于账面流动性
            body: 公开数据库对累计融资额口径不一，且无一披露当期账面现金、烧钱速度或负债状况；绝不能把历史融资数据直接折算为现有的现金跑道。
            calloutType: risk
            claimRefs:
