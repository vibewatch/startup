            body: >-
              尽管仓内软件自动化程度高且自述发货准确率达到 99.97%，ShipBob
              依然无法替商家规避外部承运商中转延误、区域劳动力紧缺或旺季运费暴涨等外部冲击。大量客诉所反映的负面体验，其根源往往出现在与承运商的交接环节，而非源自其 WMS 内部的系统逻辑。
            calloutType: risk
