  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品平台与商户履约工作流执行
        blocks:
          - type: paragraph
            body: >-
              ShipBob 定位为端到端电商履约平台，旨在为 DTC 和全渠道品牌简化物流履约全流程。商家业务流始于店铺系统集成层，电商平台在此将商品类目元数据、库存数量及入库采购单直接同步至 ShipBob
              WMS。商家将货品分散备至 ShipBob 遍布美国、加拿大、欧洲和澳大利亚的 50+ 处全球履约中心，使库存贴近终端消费者，以此缩短干线配送时效。当零售或 DTC 渠道产生客户订单时，ShipBob
              的智能编排引擎会综合评估库存物理距离、履约交付等级及承运商运费规则，动态将包裹调度至最优仓库。进入履约中心后，仓内分拣人员在自研 WMS
              移动端和条码扫描软件指引下完成拣货、打包与发货流程，据公司披露包裹出库前订单准确率维持在 99.97%。为防范店铺初期对接时的配置差错，该平台已逐步从原有的纯自助入驻，转向由专家主导的落地实施交付模式。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
