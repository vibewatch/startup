      - number: '6.3'
        title: 标杆客户案例落地与量化业务成果
        blocks:
          - type: paragraph
            body: >-
              针对头部与高成长客户的真实案例，为各品类的运营投资回报率（ROI）提供了具体证明。厨具品牌 Our Place 将履约仓网扩展至 ShipBob 的 4 处仓库节点，把履约发货加在途运输时长从 5–6 天压缩到
              2.5 天，同时节省运费 $1.5M [CU004]。运动生活方式品牌 Spikeball 借助 ShipBob 自研 WMS 算法智能优化派送方案，累计节省邮资超 $400,000，整体履约成本降低 40%
              [CU010]。营养补充剂品牌 Bloom Nutrition 在接入 ShipBob 体系后，仅维持一支 3 人的内部运营团队，便将销售规模从早期初创拉升至九位数 [CU004]。同样，PetLab Co. 与
              Arrae 等健康与个护品牌也指出，供应链透明度与商家客服支持，是在单量爆发期保障终端消费者开箱体验的命脉
              [CU004]。尽管如此，公开信息中并未披露确切的合同期限、总金额留存率（GRR）以及分客群客户流失率，大客户合作的长期稳固度依然难以摸清 [CU011]。
