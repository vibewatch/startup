      - number: '6.2'
        title: 客户采用趋势、累计发货规模与全渠道复杂度
        blocks:
          - type: paragraph
            body: >-
              多渠道电商业务的扩张直接驱动了商户对 ShipBob 的采用速度；2026 年已有 86% 的电商品牌跨两家及以上零售与电商平台开展销售 [CU007]。公司依托其遍布美国、加拿大、欧洲与澳大利亚的 50
              多个履约中心全球布局，累计履约订单超 3 亿笔，累计发货总量突破 10 亿件大关 [CU001, CU008,
              CU009]。商户入网与其多节点库存切分策略日益绑定，通过在多座仓库分仓备货，既能大幅缩短运输时效，又能规避承运商跨区派送附加费 [CU004, CU010]。市场数据显示，84%
              的电商品牌至少将部分订单交由第三方物流履约，但也有 80% 的商家受到美国关税调整带来的成本上涨冲击，这进一步推高了对 ShipBob 自贸区保税仓储与跨区直达（zone skipping）服务的需求
              [CU007, CU009]。尽管 ShipBob 自报发货准确率达 99.97%，但外部报告显示 37% 的物流企业面临在途货物追踪盲区，这也使得外界对系统追踪能力与 SLA 问责机制提出了更高要求
              [CU001, CU007]。
