      - number: '5.2'
        title: 系统架构、AI 自动化与工程治理
        blocks:
          - type: paragraph
            body: >-
              其底层技术架构将面向商家的数字化前端、分布式物流调度编排以及线下实体仓库执行拆解为模块化服务。在前端与集成层，ShipBob 采用主流 TypeScript 和 React 技术栈开发 Web 操作界面，通过
              REST API 深度对接 Shopify 等主流电商建站平台及商家定制的 ERP 系统。Web 层背后，采用 Python
              等语言编写的后台调度服务与面向对象的微服务集群，负责维护库存状态机、订单分发寻优及承运商智能调度。ShipBob 还推出了 ShipBob AI，搭配 MCP（Model Context
              Protocol）连接器以及像 Bobby
              这样的智能体助手，依托私有仓储运营数据实现履约查询自动化与物流网络自主决策。工程治理方面，资深工程师组成架构评审委员会（ARB），在微服务上线前把关跨系统技术改造，防范技术债积压。不过，由于实体仓库高度依赖本地局域网、手持条码扫码枪和承运商扫描设备，软硬件结合的这一环节往往会成为实际业务中的摩擦点。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
