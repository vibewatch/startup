      - number: '5.3'
        title: 系统可靠性、外部伙伴依赖与质量治理
        blocks:
          - type: paragraph
            body: >-
              运营兼具软件与实体物流的混合基础设施，会产生与纯 SaaS 业务截然不同的运营依赖与风险敞口。ShipBob 平台的在线率与履约
              SLA，不仅受云服务商可用性制约，还取决于实体仓库的劳动力供给、现场供电网络、扫码硬件稳定度以及第三方包裹承运商的运输表现。尽管 ShipBob
              配备了专属商家成功经理、仓内应急升级小组以及面向复杂实施的技术支持小队，但商家依然会受到承运商揽件延误、旺季网络拥堵及区域运力卡脖子等不可控因素影响，而这些统统落在了其自研软件的控制边界之外。此外，商业改进局（BBB）等消费者权益组织留存的客户纠纷记录表明，库存对账误差、交接漏扫导致的丢件以及运输破损索赔是高频摩擦点。为维护运营基本盘的稳定，ShipBob
              取消了针对小型商户的全自助入驻通道，改为强制推行技术实施验收，确保在正式发货前完成商品目录匹配、SKU 条码映射及履约规则校验。
            claimRefs:
              - CE003
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 软件与物流深度融合的混合运营模式
            body: >-
              ShipBob 的技术壁垒不仅来自部署在云端的微服务，更源于自研仓储管理系统（ShipBob WMS）同实体履约中心一线操作的深度嵌合。纯 SaaS 物流软件往往无法掌控实体履约中的执行偏差，而 ShipBob
              这一软件与仓房一体化的运作模式，实现了从购物车结账到承运商交接出库的全链路数据闭环沉淀。
