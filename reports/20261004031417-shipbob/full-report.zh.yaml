chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              ShipBob, Inc. 总部位于芝加哥，是一家由 Dhruv Saxena 和 Divey Gulati 于 2014 年创立的供应链与订单履约服务商。公司自 Y Combinator 孵化起步，为 DTC
              及全渠道电商提供统一的软件平台，整合了分布式仓储运营、订单编排、承运商智能调度与实时库存追踪功能。其核心运营模式将自研的商户端软件与仓储管理系统（WMS），同遍布美国、加拿大、英国、欧盟及澳大利亚的 50+
              处履约中心国际网络结合在一起。据 ShipBob 披露，其网络已履约超过 3 亿笔订单，自述履约准确率达 99.97%，并支持 200 多个零售集成渠道。除标准 DTC 履约外，ShipBob
              还拓展了周边商户业务，包括面向高速成长品牌的 ShipBob Plus 以及嵌入式商户融资服务 ShipBob Capital。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: 管理团队与治理架构
        blocks:
          - type: paragraph
            body: >-
              ShipBob 目前仍由联合创始人 Dhruv Saxena 掌舵。他毕业于普渡大学工程专业，自公司 2014 年创立起便一直担任首席执行官（CEO）。另一位联合创始人 Divey Gulati 曾与
              Saxena 并肩作战，推动公司从最早的上门取件一步步做成跨国物流网络。2025 年 5 月，ShipBob 迎来重磅高管加盟，聘请 Adam Patnaude 出任首席财务官（CFO）；后者曾在 Grubhub
              等公司担任领导职务，拥有超过 25 年的资本市场、并购及投资者关系经验，此举旨在理顺资本结构与治理体系，为公开上市做准备。公司对关键人物的依赖主要集中在 CEO Dhruv Saxena
              身上，其长期的运营经验与战略方向维系着商户合作、机构投资人认同及技术落地。
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 资本化历程、股东结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              ShipBob 历经多轮风险投资与成长期融资，累计获得一级市场股权融资超 $330.5M。2021 年 6 月 29 日，公司完成由 Bain Capital Ventures 领投的 $200M E
              轮融资，投后估值达 $1.0B（历史上亦有报道记录为 $1.075B），由此跻身独角兽行列。机构股权结构表阵容强大，涵盖 Bain Capital Ventures、Menlo Ventures、Hyde
              Park Venture Partners、SoftBank、Silicon Valley Bank 及 Y Combinator 等知名风投与战略投资方。市场研究显示，截至 2024 年，据报道公司曾探讨过以
              $4.0B 估值目标推进首次公开募股（IPO）；但 2022 年之后的一级市场内部估值标记、清算优先权偿付顺位以及稀释清算瀑布细节均未公开披露。此外，3PL
              采购评估普遍强调，绝不能只看官方宣传的基础履约费率，必须综合权衡附加费、库存对账流程以及服务水平协议（SLA）的履约执行情况。
            claimRefs:
              - CO011
              - CO012
