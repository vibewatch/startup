  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群细分与理想客户画像（ICP）经济模型
        blocks:
          - type: paragraph
            body: >-
              ShipBob 的商业基本盘聚焦于原生数字化 DTC 品牌和处于扩张期的全渠道商家，这类客户既需要多仓分布式履约，又无力承担自建仓库的重资产开销 [CU001]。第三方装机量分析显示，截至 2026 年，全球
              190+ 个国家中有 23,264 家已核实企业在其技术栈中接入了 ShipBob，主要密集分布于零售、快消品以及时尚服饰行业
              [CU002]。采购决策者通常由电商副总裁、数字化负责人或首席运营官（COO）担任，而日常操作用户则涵盖物流主管、客户体验经理以及商户运营人员 [CU002,
              CU003]。其客户画像跨度极大，既有月包裹量数百单的新兴小商户，也有年营收突破九位数的腰部及头部大品牌 [CU001, CU004]。独立物流评测指出，对于月订单量不足 100 笔的极小商户，选择
              ShipBob 的综合成本并不如自发货划算；而月订单量在 3,500 至 120,000 笔之间的腰部品牌，才是其混合外包 3PL 服务与独立 ShipBob WMS 部署的核心客群 [CU005,
              CU006]。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
