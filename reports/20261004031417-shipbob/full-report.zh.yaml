              - CP006
              - CP014
      - number: '3.2'
        title: 能力差异化与技术护城河
        blocks:
          - type: paragraph
            body: >-
              ShipBob 的核心差异化优势主要立足于软件层集成与跨仓库存分布能力，这使得普通 DTC
              品牌无需自建物流团队，便能在全美范围内实现两日陆运达。为提高客户终身价值（LTV）并避免沦为同质化的纯包裹配送中介，ShipBob
              推出了仓储与配送增值服务（VAWD），涵盖定制开箱体验、促销组套打包装箱、批次追踪以及退货管理。然而，在 ShipBob 标准化自动化效率不高的领域，垂直专精型对手已构筑起坚固阵地。Red Stag
              Fulfillment 全力押注超重大件和高货值商品，并以书面承诺的“零错拣保证”和单笔 $50 的 SLA 违约赔偿作为运营背书。与此同时，ShipHero
              等自研软件替代方案，为倾向于自营实体仓库的品牌提供混合型或纯粹的仓储管理系统软件，以固定的软件订阅费免除了被 3PL 赚取履约加价的成本。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
      - number: '3.3'
        title: 定价透明度、单量经济模型与服务商切换动态
        blocks:
          - type: paragraph
            body: >-
              履约定价透明度一直是整个 3PL 行业的顽疾。ShipBob 采用定制化的报价模式，根据订单规模、SKU
              复杂度以及地理存储分布单独核价，而非公布标准化费率表。尽管软件分析与核心平台功能打包提供、不单独加收软件费，但商户账单中包含了浮动的拣货打包费、按月计收的托盘和货架仓储费以及各项入库附加费。同行对比与商户社群反馈表明，一旦度过初期入驻的蜜月期，账单上频频冒出的意外加价往往会引发强烈不满。Shipo
              等区域竞争对手指出，若品牌销量集中在特定区域，在全美多仓分散备货反倒推高了库存持有成本和对账开销。此外，行业数据显示，每年约有 38% 的电商品牌会更换 3PL
              服务商；费用一旦缺乏可预测性，商户仍会流失，高昂的迁移成本也拦不住。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
