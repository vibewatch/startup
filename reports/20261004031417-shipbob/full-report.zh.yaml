  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    summary: 从实体网络规模与商家软件实证，推导至估值不确定性与最终继续研究建议的逻辑链条。
    data:
      nodes:
        - id: network-scale
          label: 网络规模：全球 50+ 处设施与 300M+ 履约订单
        - id: software-proof
          label: 软件与渠道实证：多平台深度集成
        - id: service-friction
          label: 运营风险：有据可查的商家服务与 SLA 争议
        - id: valuation-gap
          label: 财务缺口：2021 年 Series E 估值标记过时且现金消耗未经审计
        - id: secondary-signals
          label: 二级市场定价：私募股权平台交易价格出现收缩
        - id: recommendation
          label: 决策：在完成财务尽调前维持继续研究建议
      edges:
        - from: network-scale
          to: software-proof
        - from: software-proof
          to: service-friction
        - from: service-friction
          to: valuation-gap
        - from: valuation-gap
          to: secondary-signals
        - from: secondary-signals
          to: recommendation
    approximationNotes: 概念决策工作流模型，展示正面运营网络指标如何与财务及争议披露相互权衡。
