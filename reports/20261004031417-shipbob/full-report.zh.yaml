  - id: FE001
    title: ShipBob 平台架构技术栈
    type: stack
    summary: 涵盖客户端集成、智能编排、仓库执行、实体履约资产、数据遥测及技术治理的多层运营技术栈。
    data:
      layers:
        - label: 体验与集成层
          detail: 基于 React/TypeScript 的商家 Web 门户、预置电商连接器及开发者 API。
          modules:
            - label: 商家控制台
              detail: React 与 TypeScript Web 界面
            - label: 店铺连接器
              detail: Shopify、Amazon 及 200+ 个零售渠道 API
            - label: 开发者 API
              detail: 解决方案架构师集成端点
        - label: 智能与编排层
          detail: 动态订单路由算法、承运商费率计算及 ShipBob AI 上下文智能体。
          modules:
            - label: ShipBob AI 与 MCP
              detail: 自动化遥测查询与执行层
            - label: 订单路由引擎
              detail: 设施就近距离与 SLA 优化
            - label: 库存布局规划
              detail: 多枢纽分仓算法
        - label: 仓库执行层（ShipBob WMS）
          detail: 指导仓库设施拣选、包装与校验的专有仓库执行系统。
          modules:
            - label: 库位与上架
              detail: 条码导向式上架管理
            - label: 波次与批量拣选
              detail: 移动终端指引式拣选路径
            - label: 包装复核
              detail: 准确率达 99.97% 的条码复核校验
        - label: 实体网络与物流层
          detail: 覆盖全球 50+ 处履约中心的分布式网络及多承运商包裹交接。
          modules:
            - label: 履约中心
              detail: 分布于美国、加拿大、欧洲、澳大利亚的 50+ 处枢纽
            - label: 运营与技术小组
              detail: 驻场作业人员与专属技术团队
            - label: 承运商交接
              detail: 区域邮政与快递承运商交接
        - label: 数据与遥测骨干层
          detail: 统一数据库状态复制、事件流与运营审计遥测。
          modules:
            - label: 事件总线与队列
              detail: 实时库存与订单更新
            - label: 审计与报告
              detail: 商家分析与纠纷遥测数据
        - label: 治理与评审层
          detail: 贯穿全局的工程标准、性能测试及架构评审委员会监督。
          modules:
            - label: 架构评审
              detail: 资深工程治理委员会
            - label: 技术债控制
              detail: 性能规划与服务标准
    approximationNotes: 架构分层反映了根据经过核实的软件招聘岗位、平台文档与运营披露提炼的功能逻辑层级。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: ShipBob 商家旅程与扩张生命周期
    type: journey-map
    summary: 展现从渠道集成、库存铺货到多节点扩张及客户留存摩擦点的商家全生命周期图景。
    data:
      nodes:
        - label: 店铺渠道集成
          detail: 连接 Shopify、WooCommerce、Amazon 或 EDI 渠道，同步商品与目录数据。
        - label: 库存分布调拨
          detail: 入库入仓接收与跨区域履约中心的多节点铺货。
        - label: 自动化履约
          detail: 订单接入、拣选、打包并交接给最优承运商，执行两日达交付 SLA。
        - label: 渠道扩张
          detail: 商家解锁 B2B 零售一件代发、批发组套及国际跨境枢纽业务。
        - label: 客户关系稳固度评估
          detail: 季度商家业务回顾，协商报价差异、承运商附加费与 SLA 索赔主张事项。
        - label: 留存或流失决策
          detail: 商家要么升级至专属企业级 WMS 方案，要么因账单与 SLA 摩擦而流失转投他处。
    approximationNotes: 生命周期各阶段基于 ShipBob 商家入驻文档、MSM 招聘说明及采购评测构建模型。
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU012
      - CU013
