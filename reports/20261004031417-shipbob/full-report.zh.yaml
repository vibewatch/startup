        - 25%
      - - 基准情景
        - 受核心 DTC 商家推动营收保持温和增长，仓库利用率稳定，经营性现金流达到盈亏平衡。
        - 估值依然锚定在 2021 年 E 轮约 $1.0B 至 $1.3B 的投后基准附近。
        - 仓储运营工资通胀、消费零售放缓以及来自区域性 3PL 的竞价压力。
        - 55%
      - - 悲观情景
        - 因服务争议导致商家持续流失，仓储固定开支挤压利润率，现金消耗高企。
        - 以低于 $1B 峰值估值的折价进行下轮融资或二级市场股份清算，引发清算优先权悬顶。
        - 商家大范围流失、仓库库存管理失误以及承运商合同重新谈判惩罚。
        - 20%
    notes: 将运营执行与利润率特征映射至潜在股权估值结果的情景分析。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: ShipBob 从 2014 年至 2026 年发展历程中的核心公司、运营、融资及高管里程碑。
    approximationNotes: 里程碑反映了经过验证的公开上线、融资、网络规模扩张以及高管任命事件。
    data:
      items:
        - label: 2014：公司成立与入选 Y Combinator
          detail: Dhruv Saxena 与 Divey Gulati 在芝加哥创立 ShipBob，为中小企业提供包裹运输服务，并入选 Y Combinator。
          tone: positive
        - label: 2015：商业化上线与预约揽收
          detail: ShipBob 面向在 eBay、Shopify 和 Etsy 上开店的商家推出定时包裹揽收与发货服务。
          tone: positive
        - label: 2017：仓储网络扩张
          detail: 公司实体履约运营从芝加哥扩展至遍布全美的 4 处区域仓库。
          tone: neutral
        - label: 2021：E 轮独角兽融资
          detail: ShipBob 在由 Bain Capital Ventures 领投的 E 轮融资中筹集 $200M，投后估值达 $1.0B。
          tone: positive
        - label: 2024：探索 IPO 筹备工作
          detail: 据报道 ShipBob 评估公开上市方案，目标估值最高达 $4B。
          tone: neutral
        - label: 2025：任命 CFO 与治理架构搭建
          detail: Adam Patnaude 于 2025 年 5 月受聘出任 CFO，分管资本结构、财务控制和投资者关系。
          tone: positive
        - label: 2025：服务分层与网络升级
          detail: 面向高增长品牌推出 ShipBob Plus，同时将履约网络扩展至全球 50+ 处设施。
          tone: neutral
        - label: 2026：运营受审视与 SLA 摩擦
          detail: 商家反馈与采购评测记录了 SLA 履约摩擦、承运商替换争议以及费用对账问题。
          tone: negative
