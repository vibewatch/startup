chapter:
  number: 4
  title: "Financials"
  summary: "ShipBob has a tangible, volume-linked fulfillment model with public list-price components and third-party evidence of meaningful scale, but revenue mix, realized pricing, gross margin, cash burn, and runway remain undisclosed. Conflicting cumulative-funding figures and an analyst-reported lack of a disclosed profitability path make primary financial statements the central underwriting requirement."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue model and monetization"
    body: >-
      ShipBob presents two core delivery modes: outsourced fulfillment, in which it stores
      inventory and picks, packs, and ships orders, and software-supported in-house or hybrid
      fulfillment using ShipBob WMS. Its public workflow starts with a merchant connecting a
      store and sending inventory, after which physical order processing drives billable
      activity. Sacra separately describes reception, warehousing, and order fulfillment as
      pricing components. This evidence supports a transaction- and capacity-linked revenue
      model, not a pure SaaS model. It does not disclose revenue mix, WMS licensing economics,
      carrier pass-through accounting, contract duration, discounts, or realized take rates,
      so each stream should be underwritten separately rather than assigned a blended software
      multiple.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI009"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-public-traction"
    title: "Pricing evidence and public traction"
    body: >-
      The assigned public evidence provides list-price reference points but not customer-level
      realization. Sacra lists $25 for the first two hours of inventory reception, $40 per
      additional hour, monthly storage charges of $40 per pallet, $10 per shelf, and $5 per
      bin, plus a $275 monthly minimum for the Growth Plan serving merchants below 400 orders
      per month. These values are analyst-published list pricing, not audited revenue or
      contribution margin. For scale, ShipBob's homepage claims more than 300 million orders
      fulfilled, while Sacra reports $500 million of revenue and 42.9% year-over-year growth
      for 2023. The periods and denominators differ, so none of these figures should be relabeled
      as ARR or combined into a current revenue run rate.
    claimRefs:
      - "CI004"
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI002"
  - id: "unit-economics-and-capital-adequacy"
    title: "Unit economics and capital adequacy"
    body: >-
      Public sources do not close the unit-economics model. Reception, storage, and fulfillment
      charges indicate where revenue enters, but the assigned evidence provides no gross margin,
      facility utilization, labor cost per order, carrier cost, CAC, sales-cycle, payback, customer
      concentration, working-capital schedule, or capex profile. Financing databases also disagree:
      Tracxn reports $333 million across eight rounds, EquityZen lists $370 million, and Sacra
      reports $330.5 million. These are cumulative historical funding figures, not cash on hand.
      They therefore cannot establish current burn, runway, debt capacity, or the timing of a next
      financing. Sacra's statement that no profitability path has been disclosed reinforces the
      need for current primary financials rather than inference from past fundraising.
    claimRefs:
      - "CI009"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial verdict"
    body: >-
      The model has credible revenue-generating activity because storage and fulfillment are
      observable services tied to merchant inventory and orders, and the public scale indicators
      are consistent with a substantial operating footprint. Revenue quality is nevertheless
      unproven: disclosed list prices do not reveal realized price, retention, mix, or margin,
      and company-hosted customer savings are proof points rather than representative cohort
      economics. Adverse evidence must also be handled carefully. BBB explicitly says it does
      not verify third-party submissions and asks readers to assess complaints relative to company
      size and transaction volume, so the assigned complaint page cannot support a defect-rate
      estimate. The investable conclusion is diligence-dependent: obtain audited revenue,
      contribution margin, cash, burn, debt, and cohort data before underwriting profitability
      or capital sufficiency.
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI016"
