callouts:
  - calloutType: "recommendation"
    title: "Capital Allocation Discipline Requires Private Financial Verification"
    body: "Prospective investors should resist anchoring to headline unicorn valuations set during the 2020-2021 ecommerce capital expansion. Because ShipBob has operated as a private company without disclosing certified balance sheets or cash flow statements, any investment decision prior to an initial public offering must require verification of customer retention curves, unit economics across company-operated versus partner fulfillment centers, and senior liquidation preferences."
    claimRefs:
      - "CV005"
      - "CV007"
      - "CV008"
      - "CV010"
