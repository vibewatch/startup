company:
  name: "ShipBob"
chapter:
  number: 8
  title: "Valuation"
  summary: "ShipBob demonstrates significant operational scale across more than 50 fulfillment centers and 300 million fulfilled orders, but its lack of publicly audited financial disclosures and reliance on a stale $1 billion-plus 2021 Series E baseline support a research-more stance rather than an unconditional buy."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for ShipBob rests on its proprietary cloud-based logistics software and warehouse management system (WMS), which enables omnichannel direct-to-consumer merchants to orchestrate distributed inventory across more than 50 fulfillment facilities globally. By offering native two-day delivery capabilities, multi-channel marketplace integrations with Shopify, Walmart, and Amazon, and automated carrier orchestration, ShipBob has established itself as an essential infrastructure layer for emerging commerce brands. However, the counter-thesis centers on extreme financial opacity, persistent customer service complaints regarding inventory loss and billing discrepancies reported to dispute bodies, and the risk that historical private valuation marks no longer reflect macroeconomic realities or public logistics multiples."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV008"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "recommendation-and-valuation-context"
    title: "Recommendation Stance and Capital Structure Context"
    body: "We assign ShipBob a recommendation of research-more with medium confidence, a high risk rating, and a valuation stance of stretched. ShipBob last established an explicit primary post-money equity valuation in June 2021, when Bain Capital Ventures led a $200 million Series E round that officially valued the logistics platform at well over $1 billion. Although cumulative disclosed primary equity capital reached $330.5 million, secondary trading data from the Nasdaq Private Market reflected an NPM price of $23.28 in September 2026, registering a 3.66% contraction compared to September 2024. Without access to audited financial statements detailing gross margins, EBITDA, customer churn, and liquidation preferences, initiating an investment at reported multi-billion-dollar aspirations lacks sufficient analytical defense."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV001"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Valuation Analysis and Diligence Priorities"
    body: "Scenario modeling highlights divergent valuation trajectories based on ShipBob's ability to demonstrate enterprise profitability and sustain warehouse service levels. Under our bull case, sustained international expansion and software automation justify an enterprise valuation multiple expansion toward leading technology-enabled logistics peers. Conversely, our base and bear cases account for operational execution friction, carrier cost pass-through headwinds, and small-merchant churn that depress sustainable margins. Pre-investment diligence must prioritize confirming actual 2024–2026 revenue run rates, audited gross margins, warehouse-level SLA breach rates, and the seniority structure of the Series E preferred shares before committing fresh capital."
    claimRefs:
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV003"
