    columns:
      - "Scenario"
      - "Key Operating Assumptions"
      - "Valuation and Return Logic"
      - "Key Risks and Downside Triggers"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Omnichannel WMS adoption scales, international fulfillment centers expand profitably, and gross margin exceeds 35%."
        - "Enterprise valuation expands toward top-tier tech-enabled logistics multiples, validating an IPO valuation above historical rounds."
        - "Enterprise client concentration, carrier surcharge escalation, and marketplace platform disintermediation."
        - "25%"
      - - "Base Case"
        - "Moderate revenue growth driven by core DTC merchants, steady warehouse utilization, and break-even operating cash flow."
        - "Valuation remains anchored near the 2021 Series E post-money baseline of approximately $1.0B to $1.3B."
        - "Wage inflation in warehouse operations, consumer retail slowdown, and competitive pricing pressure from regional 3PLs."
        - "55%"
      - - "Bear Case"
        - "Persistent merchant churn due to service disputes, margin compression from warehouse overhead, and elevated cash burn."
        - "Down-round financing or secondary share liquidation at a discount to the $1B peak mark, triggering preference overhang."
        - "Widespread merchant defections, warehouse inventory management failures, and carrier contract renegotiation penalties."
        - "20%"
    notes: "Scenario analysis mapping operational execution and margin profiles to potential equity valuation outcomes."
