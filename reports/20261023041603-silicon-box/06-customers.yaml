    title: Customer journey from qualification to expansion
    type: journey-map
    summary: Public evidence supports a journey from design consultation and automotive co-development to scaled packaging, but repeat-order and expansion stages remain unverified.
    data:
      items:
        - {label: "1", title: "Design consultation", description: "End-to-end chiplet architecture and packaging consultation is described.", status: "publicly described"}
        - {label: "2", title: "Co-development", description: "Automotive-grade packages are being co-developed with unnamed customers.", status: "publicly claimed"}
        - {label: "3", title: "Qualification", description: "Automotive interoperability, reliability, thermal, and quality requirements are part of the program.", status: "in progress / not fully disclosed"}
        - {label: "4", title: "Production", description: "100M and 250M+ unit milestones indicate scaled manufacturing.", status: "reported"}
        - {label: "5", title: "Repeat orders", description: "Repeat-order or renewal evidence by account is not disclosed.", status: "unverified"}
        - {label: "6", title: "Expansion", description: "Capacity expansion and a planned European facility could support broader customer deployment.", status: "planned / demand not quantified"}
    approximationNotes: "Stages are an analytical presentation of separately reported milestones, not a measured conversion funnel; public sources do not establish that every customer passes each stage."
    claimRefs: [CU001, CU003, CU005, CU006, CU007, CU010, CU013]
