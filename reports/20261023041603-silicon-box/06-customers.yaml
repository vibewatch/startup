schemaVersion: "report-v2"
artifact: customers
slug: silicon-box
runDate: 2026-10-23
company:
  name: Silicon Box
chapter:
  number: 6
  title: Customers
  summary: Silicon Box has credible evidence of scaled production and customer co-development, especially in automotive, but the public record does not name customers or disclose active-account, retention, revenue-concentration, or production-versus-pilot denominators.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: Silicon Box positions its offering as end-to-end chiplet design consultation, packaging, manufacturing, and testing rather than as a standardized component sold through a self-serve channel. Public materials point to automotive, AI, HPC, mobile, IoT, robotics, and space applications, with the automotive program providing the clearest current vertical signal. The buyer is likely an engineering and procurement organization that must qualify a packaging process, not an individual software user; however, the sources do not disclose named accounts, contract sizes, qualification stages, or whether volume is customer production, internal qualification, or R&D. The 2026 automotive announcement says the company is co-developing packages with customers for next-generation ADAS, while its factory announcement describes collaboration with early customers, so customer involvement is evidenced but customer identity and commercial terms remain opaque.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named-customer proof
    body: Production milestones are the strongest observable adoption proxy. Silicon Box reported 100 million units shipped in October 2025 and more than 250 million by Q1 2026, while a June 2026 financing release described capacity expansion to meet demand. These are company-issued operating figures and do not identify customers, units per account, revenue contribution, or repeat orders. Imec participation adds ecosystem validation and an automotive qualification path, including an IATF 16949 letter of conformance and stated co-development, but it is not proof of a named production customer. The customer diligence conclusion is therefore “scaled process with customer collaboration disclosed, account-level adoption unverified.”
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-and-concentration
    title: Retention, expansion, and concentration risk
    body: No retained source supplies NRR, GRR, churn, renewal rates, contract duration, cohort behavior, customer concentration, or account-level revenue. The company says capacity is being expanded for growing demand and that automotive revenue grew at an annualized 436% rate in Q1 2026, but the denominator, starting base, and customer mix are not disclosed. A Tracxn profile reports 2024 revenue below US$1 million and separately describes the business as funded, but it does not provide customer retention evidence. The large-format factory and planned European site may support expansion across geographies and applications, yet they also increase the cost of underutilized capacity if qualification or demand slips. Investors should request a customer-by-customer revenue bridge, qualified-versus-production account list, backlog, renewal evidence, and top-ten concentration.
    claimRefs: [CU010, CU011, CU012, CU013]
  - id: diligence-conclusion
    title: Customer diligence conclusion
    body: The evidence supports a technically credible manufacturing platform that has reached meaningful volume and participates in customer-facing automotive development. It does not support a precise customer count, durable retention conclusion, or concentration estimate. The central diligence gap is not whether Silicon Box can ship units; it is whether those units represent repeatable, paid production programs with diversified customers and acceptable economics. The adverse signal is that an independent account describes the technology as more complex and expensive to produce, which could lengthen qualification cycles and constrain the addressable buyer set. Until Silicon Box discloses named references or auditable cohort and revenue data, customer confidence should remain medium rather than high.
    claimRefs: [CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Scaled process evidence
    body: Reported unit shipments rose from 100 million in October 2025 to more than 250 million by Q1 2026, indicating operational scale even though account-level adoption is not disclosed.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Customer opacity
    body: Public evidence does not name customers or disclose retention, revenue concentration, production-versus-pilot mix, or contract durability; these gaps materially limit customer-quality underwriting.
    claimRefs: [CU010, CU011, CU012, CU013]
  - calloutType: recommendation
    title: Require account-level proof
    body: Before underwriting durable growth, request customer references, qualification status, paid production volumes, renewal or repeat-order evidence, and a top-customer revenue bridge.
    claimRefs: [CU013, CU016]
