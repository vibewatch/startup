company:
  name: Silicon Box
chapter:
  number: 8
  title: Valuation
  summary: Silicon Box has credible production and financing evidence, but the assigned public record does not establish a current price, audited revenue base, or round terms. The defensible posture is track/research-more until management supplies current financials, cap-table terms, and customer-level commercial evidence.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is an advanced-packaging company that has moved beyond laboratory
      claims: the company reported 250 million units shipped by Q1 2026, while its 2025
      release described mass production beginning in late 2023. A June 2026 debt facility
      and a concurrent US$150 million equity
      round provide evidence that capital providers are funding capacity expansion, not merely
      an R&D plan. The market backdrop is also supportive: Grand View Research estimates the
      global advanced-packaging market at US$43.9 billion in 2026 and US$66.0 billion in 2033.
      The anti-thesis is stronger for an entry decision: the assigned sources do not disclose
      audited revenue, gross margin, cash burn, runway, customer names, contract duration, or
      current post-money valuation. The only public valuation mark located is a historical
      US$1.55 billion figure, while Tracxn reports revenue below US$1 million as of
      December 31, 2023 and another profile reports US$1.87 million for the 2024 factory
      year. Those different periods and definitions make a revenue multiple unsuitable
      without diligence.
    claimRefs: [CV001, CV003, CV004, CV005, CV008, CV009, CV010, CV011]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The June 2026 financing is strategically useful but not equivalent to equity value:
      Silicon Box announced SGD100 million of debt from Ares Management, InnoVen Capital,
      January Capital Growth Credit, and Abound Capital, with an option to upsize by an
      additional US$75 million. TechNode reports the facility followed a completed US$150
      million Series B2 equity round and says proceeds are intended for capacity expansion.
      Debt can extend the build-out without immediate shareholder dilution, but it creates
      repayment, covenant, and refinancing exposure that cannot be assessed from the public
      record. The historical US$1.55 billion mark should therefore be treated as an
      unrefreshed reference point, not a current fair value. A disciplined entry would require
      a verified latest post-money valuation, primary-versus-secondary split, liquidation
      preferences, debt terms, cash balance, and a bridge from installed capacity to paid
      revenue. Without those inputs, a price target or target return would be false precision.
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV008, CV009, CV010, CV014]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and exit readiness
    body: >-
      A scenario framework is more decision-useful than a single multiple because the public
      evidence supports operating milestones but not an investable earnings base. The bull
      case assumes the reported shipment ramp converts into repeat, diversified paid programs,
      capacity installs on schedule, and the market expands as forecast; the base case assumes
      technical execution continues but commercial conversion and margins remain unproven; the
      bear case assumes capital intensity, debt service, construction delay, or customer
      concentration prevents adequate returns. Independent market-research sources identify
      Amkor, ASE, TSMC, Intel, Samsung, and JCET as major advanced-packaging players, while
      Macrotrends reports an Amkor snapshot of US$12.2 billion market capitalization and
      US$6.318 billion revenue as of February 6, 2026. That roughly 1.9x ratio is only a
      scale reference: Amkor is a mature public OSAT, whereas Silicon Box is private and its
      current revenue and profitability remain unverified. No defensible transaction multiple
      is disclosed in the assigned pool. Exit readiness is consequently conditional on audited
      financial reporting, customer references, capacity utilization, and evidence that the
      Singapore and planned European footprints generate acceptable returns on invested capital.
    claimRefs: [CV005, CV006, CV011, CV012, CV013, CV016]
    figureRefs: [FV001]
  - id: diligence-and-thesis-breaks
    title: Diligence asks and thesis-break triggers
    body: >-
      The next diligence round should test price, not just product quality. Request audited
      2024–2026 financial statements, monthly cash burn and runway, a round-by-round cap table,
      preference stack, debt agreement and covenants, customer-level bookings and production
      versus pilot mix, gross-margin bridge by package, and signed capacity commitments. Track
      whether the 2028 Singapore capacity-installation and Novara production milestones remain
      on schedule, whether reported unit growth is accompanied by revenue and cash collection,
      and whether the company can finance expansion without a down round or punitive debt
      refinancing. A thesis break occurs if production milestones fail to convert to paid
      revenue, if customer concentration prevents sustainable utilization, if expansion
      requires materially more capital than disclosed, or if current financing terms reveal
      senior claims that leave common-equity upside below the historical mark.
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV010, CV014, CV016]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Decision implication]
    rows:
      - [Recommendation, "Track / research-more", "Do not underwrite a new price without current financial and term disclosure"]
      - [Confidence, "Medium-low", "Production and financing evidence is stronger than valuation evidence"]
      - [Risk rating, "High", "Capital intensity, debt, construction, customer and disclosure risks remain material"]
      - [Valuation stance, "Stretched / unverified", "Historical US$1.55B mark lacks a current revenue denominator"]
      - [Entry discipline, "Require price and terms", "Obtain audited statements, cap table, preferences, debt and customer contracts"]
    notes: "Assessment synthesizes the assigned public sources; no current term sheet or audited financial statements were available."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["High-volume execution is plausible", "More than 250M units reported by Q1 2026", "Independent customer or production records and audited shipment-to-revenue reconciliation"]
      - ["Financing validates strategic relevance", "US$150M Series B2 plus SGD100M debt announced in June 2026", "Current valuation, debt covenants, and investor underwriting rationale"]
      - ["Market growth supports demand", "Advanced packaging estimated at US$43.9B in 2026 and US$66.0B in 2033", "Silicon Box share, backlog, utilization and margin evidence"]
      - ["Price may be too high", "Historical US$1.55B mark versus sub-US$1M or US$1.87M reported revenue figures", "Audited current revenue, gross margin, and a market-clearing transaction price"]
      - ["Expansion can amplify downside", "Full Singapore capacity installation and Italy production are described for 2028", "Permits, construction budget, funding plan, and return-on-capital case"]
    notes: "The two revenue figures come from different third-party profiles and periods/definitions; they are not treated as interchangeable."
    claimRefs: [CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV011, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Shipments convert to diversified paid programs; capacity installs on schedule; market grows", "Historical mark is supported or exceeded only after audited revenue and margin proof", "Low-to-medium; milestones are partly company-reported", "Revenue, utilization or cash conversion lags unit growth"]
      - [Base, "Technical execution continues; commercial conversion and margins remain opaque", "Hold/track; require a material valuation reset or verified economics before entry", "Medium; best fit to current evidence", "No customer-level bookings or audited financial bridge"]
      - [Bear, "Debt service, construction delay, concentration or added capital needs impair returns", "Down-round or preference-adjusted equity value could be materially below historical mark", "Medium; disclosure gaps prevent quantification", "Covenant stress, delayed plant, or failed commercialization"]
      - [Catalyst, "Audited statements, signed customer contracts and current financing terms arrive", "Re-underwrite using revenue/margin and preference-adjusted scenarios", "Unresolved; diligence-dependent", "Evidence remains promotional and non-audited"]
      - [Exit readiness, "Singapore scale and planned Europe footprint become cash-generative", "Strategic or public-market exit is plausible only with repeatable margins", "Low today; no exit filing or transaction evidence", "Capital intensity remains ahead of cash generation"]
    notes: "Scenario logic is an analytical framework, not a disclosed company forecast; no probability-weighted valuation is calculated because the public denominator is incomplete."
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV010, CV011, CV014, CV016]

