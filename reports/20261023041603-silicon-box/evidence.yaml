evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited financial statements, current cash balance, monthly burn, runway, gross margin and customer-level revenue.
    whyItMatters: >-
      Capital intensity and reported financing cannot be translated into solvency, unit economics or valuation support
      without these measures.
    diligencePath: >-
      Request the latest audited accounts, management accounts, 24-month cash forecast, customer revenue concentration
      and production-versus-R&D revenue bridge.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled capitalization table separating equity raised, debt committed, debt drawn, government aid and any
      secondary proceeds.
    whyItMatters: >-
      The assigned sources report different lifetime-funding totals and do not establish dilution, seniority or cash
      availability.
    diligencePath: >-
      Obtain financing agreements, round closing statements, cap table, debt schedule, grant agreement and valuation
      memo.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Named customer references and independent proof of commercial production, qualification status and concentration.
    whyItMatters: >-
      Application lists and company statements do not establish recurring demand, retention or customer bargaining
      power.
    diligencePath: >-
      Request reference calls, anonymized top-customer concentration, qualification milestones, shipment-by-customer and
      backlog data under NDA.
    relatedQuestionRefs:
      - QO007
      - QO008
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Current statutory director register, committee mandates, beneficial ownership and executive succession plan.
    whyItMatters: The public leadership profile is partial and contains duplicate or historical records.
    diligencePath: >-
      Obtain the current corporate registry extract, shareholder register, board minutes summary and governance
      policies.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Customer-level qualification records, contracted capacity, pricing, and production-versus-pilot mix for each
      application segment.
    whyItMatters: >-
      Broad market growth cannot be converted into Silicon Box revenue or share without evidence of funded, qualified
      customer programs.
    diligencePath: >-
      Request a customer pipeline schedule showing design-ins, qualification gates, production status, committed units,
      ASP or pricing bands, and concentration.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A reconciled definition and bottom-up serviceable-market build for panel-level packaging and chiplet integration.
    whyItMatters: The Mordor, Deloitte, and McKinsey figures use different scopes and cannot be added or treated as a single TAM.
