company:
  name: Silicon Box
chapter:
  number: 4
  title: Financials
  summary: Silicon Box has demonstrated meaningful manufacturing throughput and secured both equity and debt capital, but public evidence still does not disclose recurring revenue quality, margins, cash, burn, or runway. The underwriting case therefore depends on converting production milestones into auditable customer revenue while funding an unusually capital-intensive expansion.
sections:
  - id: revenue-model
    title: Revenue model and commercial traction
    body: Silicon Box appears to monetize end-to-end chiplet integration and advanced panel-level packaging rather than a software subscription or standardized commodity component. Its public materials describe design consultation, packaging and manufacturing, with customer collaboration around application-specific solutions. The October 2025 company release reported 100 million units shipped from the Tampines facility, but it did not disclose ASP, contract terms, customer names, revenue by application, or the split between qualification, R&D and production. A third-party profile reports US$1.87 million of 2024 factory-year revenue from pre-qualified customers and R&D; because that profile is not an audited filing, it is a directional datapoint rather than a verified revenue base. The commercial question is thus not whether the factory can ship, but whether unit volume converts into durable, profitable customer programs.
    claimRefs: [CI001, CI003, CI004]
    tableRefs: [TI001]
  - id: monetization-and-unit-economics
    title: Pricing, cost structure and unit economics
    body: No public source in the assigned evidence set provides a list price, realized price, gross margin, customer acquisition cost, payback period, utilization, or contribution margin. Silicon Box positions panel-level packaging as a lower-cost alternative to wafer-level and traditional packaging, while its own release also emphasizes high performance and high yield; those are company claims about the value proposition, not evidence of realized margin. The operating model is likely exposed to cleanroom, materials, test, utilities, labor, yield and depreciation costs, but the evidence does not quantify any of those items. Accordingly, a financial model should keep ASP, yield-adjusted cost per good unit, utilization and customer-specific engineering charges as explicit unknowns instead of inferring them from shipment counts. A buyer diligence package should reconcile contracted pricing to invoices and map each production program from qualification through volume ramp.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-intensity-and-funding
    title: Capital adequacy and financing dependency
    body: "Silicon Box has financed a manufacturing build-out with a mixture of equity and debt, but disclosed proceeds are not the same as cash available for operations. The company announced SGD100 million of debt financing in June 2026, including an option to upsize by an additional US$75 million, and said proceeds would be used for capacity expansion. The same release said this debt followed a US$150 million Series B2 equity round. A law-firm deal description separately describes US$100 million, US$150 million and S$100 million transactions, corroborating the existence of a substantial financing stack but not providing covenants, interest rates, maturity, collateral, cash balance or remaining proceeds. Expansion plans add further funding exposure: external coverage describes the Italian project as a €3.2 billion facility with a planned 2028 start, while trade coverage separately reports €1.3 billion in Italian government funding without public drawdown conditions. Without cash, burn, capex phasing, grants, customer prepayments and debt schedules, runway and next-round trigger remain unquantified."
    claimRefs: [CI002, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: "The evidence supports a technically credible, capital-backed manufacturing scale-up, not a fully underwritten financial profile. The strongest positive indicators are high-volume shipment claims, a reported 99.7% historical wafer-scale yield benchmark, a debt facility with named institutional lenders, and an identified European expansion program. The strongest negative indicator is disclosure opacity: the sources do not establish recurring revenue, gross profit, free cash flow, cash on hand, monthly burn, customer concentration, realized pricing or debt service capacity. The 2025 company release itself lists demand changes, construction delays, increased capital requirements, government support changes and insufficient ecosystem support among risks that could make actual results differ from plans. For investment underwriting, the decision should remain conditional on audited financial statements, customer-level bookings and backlog, capacity utilization, yield by product, capex commitments, grant conditions and a reconciled financing waterfall."
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
