callouts:
  - calloutType: strength
    title: Production proof is stronger than financial disclosure
    body: "The 100-million-unit milestone and financing announcements support execution and access to capital, but do not establish realized pricing, margin or free cash flow."
    claimRefs: [CI001, CI007, CI009]
  - calloutType: risk
    title: Expansion creates a financing dependency
    body: "The planned Singapore and Italy capacity build-outs are large relative to the disclosed operating metrics; cash, burn, debt terms and grant conditions are required before underwriting runway."
    claimRefs: [CI012, CI013, CI015]
