    notes: Benefits are separated from limitations because most performance and cost outcomes are company- or partner-reported rather than independently benchmarked.
    claimRefs: [CE002, CE003, CE004, CE010, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Chiplet design and package architecture", "Translate customer die requirements into an integrated package", "Customer die designs and package/interface specifications", "Integration errors or unclear interface ownership can delay qualification"]
      - ["High-density interconnection", "Connect chiplets within the package", "Fine-pitch process capability and compatible die/interface designs", "Claimed sub-5-micron density lacks an independent test report in the assigned sources"]
      - ["Panel-level assembly", "Build packages on large square panels", "Specialized equipment, materials, process recipes, and supply continuity", "Ramp, defect, and warpage performance at panel scale are not publicly quantified"]
      - ["Test and qualification", "Validate finished devices and support customer release", "Test infrastructure plus customer and automotive qualification requirements", "Singapore and planned European test scope may not be equivalent"]
      - ["Quality, environment, and safety management", "Control manufacturing and operational risks", "ISO systems and customer-specific quality audits", "Certificates do not disclose current audit findings or product-level reliability results"]
      - ["European expansion", "Add a Novara design-to-test manufacturing footprint", "Construction, financing, permits, grants, suppliers, and hiring", "2028 production is forward-looking and exposed to execution and capital risk"]
    notes: This architecture is an evidence-bounded operating model assembled from disclosed company, partner, industry, and technical sources; it is not a verified process flow diagram.
    claimRefs: [CE005, CE006, CE007, CE009, CE011, CE013]
