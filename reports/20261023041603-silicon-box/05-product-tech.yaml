callouts:
  - calloutType: strength
    title: Production evidence is stronger than product benchmarking
    body: Reported 100-million- and 500-million-unit milestones, mass production since late 2023, and formal management-system certifications support operational maturity at the Singapore-facility level. They do not substitute for independent yield, reliability, electrical, thermal, or customer-acceptance data.
    claimRefs: [CE005, CE006, CE009]
  - calloutType: risk
    title: Interoperability and scale-up remain underwriting gates
    body: The core value proposition depends on panel-scale yield, package interoperability, and successful qualification across customer applications. Public evidence describes the architecture and roadmap but does not establish UCIe compliance, full automotive certification, or the economics of the planned European expansion.
    claimRefs: [CE010, CE011, CE012, CE013]
