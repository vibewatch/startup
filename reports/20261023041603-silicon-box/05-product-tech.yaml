company:
  name: Silicon Box
chapter:
  number: 5
  title: Product & Technology
  summary: Silicon Box is an advanced semiconductor-packaging manufacturer built around chiplet integration on large square panels rather than conventional circular wafers. Public evidence supports a real Singapore production operation, ISO certifications, and reported high-volume shipments, but customer-level performance, interoperability, and independent yield evidence remain limited.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: Silicon Box sells semiconductor integration and packaging rather than a software product. The workflow begins with a customer's chiplet or die design and requires package architecture, interconnection, assembly, testing, and delivery of finished devices. Tracxn describes the company as providing "end-to-end semiconductor integration services, from chiplet design consultation through final manufacturing," while the company describes its technology as addressing performance, scalability, and cost constraints in wafer-level and traditional packaging. The practical customer value proposition is to fit square chips on square panels, increase usable manufacturing area, and provide a route to chiplet-based systems for AI, HPC, automotive, robotics, mobile, and IoT applications. Business Times reports that the company's panels have more than six times the productive area of standard 300 mm wafers, but this is an external description rather than a disclosed product specification. The public record does not identify customer names, package-level benchmark results, or realized cost savings, so those benefits should be treated as claims requiring customer and engineering diligence.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, manufacturing maturity, and roadmap
    body: The disclosed operating architecture is a panel-level packaging line with chiplet interconnection, manufacturing execution, quality controls, and testing. The Singapore Tampines facility began mass production in late 2023 and Silicon Box reported shipping 100 million units in October 2025 and 500 million units in August 2026. These milestones indicate commercial production maturity at the facility level, although the company-issued figures do not disclose the number of distinct products, die types, test coverage, defect definitions, or customer acceptance criteria. The company says the Singapore site is undergoing a US$300 million expansion, aims to increase production capacity by a factor of ten within 2026, and expects full capacity installation by 2028. A second Novara facility is planned for 2028 with native test capability. Those expansion and roadmap dates are forward-looking company statements; construction completion, qualification timing, and actual customer allocation remain open questions.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-controls
    title: Differentiation, trust, and technical risk
    body: "Silicon Box's claimed differentiation combines panel-scale manufacturing, high-density chiplet interconnection, and a founding team with prior packaging experience. TDK Ventures characterizes the approach as using panel packaging and short chiplet-to-chiplet interconnects, while Tracxn reports a claimed sub-5-micron interconnect density. These sources establish the nature of the proposed architecture, not an independently reproducible benchmark. The strongest observable control evidence is certification: the Tampines operation is reported to have achieved ISO 9001:2015 in 2024, ISO 14001:2015 and ISO 45001:2018 in 2025, and an AutomotiveWorld report says the company received an IATF 16949 Letter of Conformance ahead of full automotive certification. UCIe's public consortium material confirms that open chiplet interoperability is an active ecosystem requirement, but it does not establish Silicon Box compliance. Key risks are therefore qualification and interoperability, yield measurement at panel scale, dependence on specialized equipment and suppliers, and execution of a capital-intensive second fab. No public security, privacy, product-recall, outage, or incident disclosure was found in the assigned evidence; that absence is not evidence that no incidents exist."
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015]
    tableRefs: []
    figureRefs: []
