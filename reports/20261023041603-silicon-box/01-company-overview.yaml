    - type: private-evidence-only
      severity: material
      topic: disclosure
      missingEvidence: "Audited financial statements, current cash balance, monthly burn, runway, gross margin and customer-level revenue."
      whyItMatters: "Capital intensity and reported financing cannot be translated into solvency, unit economics or valuation support without these measures."
