company:
  name: Silicon Box
chapter:
  number: 1
  title: Company Overview
  summary: Silicon Box is a Singapore-founded private semiconductor-packaging company built around chiplet integration and panel-level packaging. Current evidence supports a technically ambitious, capital-intensive scaling story, but private-company disclosure leaves revenue, profitability, customer concentration, ownership and financing terms only partly verifiable.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Silicon Box was incorporated in Singapore in 2021 and is described across the retained sources as an advanced semiconductor packaging company rather than a chip designer or conventional wafer foundry. Its stated product and service model combines chiplet design collaboration with manufacturing using proprietary SiPlet panel-level packaging and sub-5-micron interconnects. The operating proposition is to assemble heterogeneous chiplets into packages for AI, high-performance computing, data-centre, automotive, mobile, IoT, robotics and space applications. The Singapore Tampines facility began mass production in late 2023, while a Novara facility is planned for Europe. The company’s positioning is therefore a specialized backend manufacturing and integration platform whose economics depend on yield, throughput, customer qualification and sustained capital access. Public material does not identify named production customers or disclose a complete commercial contract base, so the distinction between announced applications, early collaborations and recurring production revenue remains important.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Founders, leadership and governance
    body: >-
      The retained evidence identifies Byung Joon (BJ) Han as co-founder and CEO, with Sehat Sutardja and Weili Dai as co-founders and board-level leaders. The founding group combines prior semiconductor packaging and semiconductor-system experience: the company-issued milestone release describes Han’s prior STATS ChipPAC leadership and the two other founders’ Marvell background, while an investor-authored account frames Sutardja’s 2015 chiplet presentation as part of the founding thesis. Tracxn’s current profile lists a five-member active board, including the founders and two independent members, but the profile also contains duplicate-name records and historical directors. This supports a governance structure broader than a three-person founding team, while leaving board committee responsibilities, control rights, succession planning and key-person mitigation unconfirmed. Han’s combined CEO, technical and industry role remains a material dependency for execution and credibility.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Funding, valuation and operating scale
    body: >-
      Funding evidence is current but inconsistent in total-cash terminology. A June 2026 financing report describes S$100 million, approximately US$77.65 million, of debt financing with a further US$75 million upsizing option, following a US$150 million Series B2 equity round. Tracxn records US$658 million across seven rounds and a June 2026 conventional-debt round, while another company-profile source reports a different total and a US$1.55 billion private valuation. These figures should not be collapsed into one audited capitalization table: debt is not equity, a facility option is not cash drawn, and a private valuation is not liquid enterprise value. The company’s own October 2025 release reported 100 million units shipped and a planned full-capacity installation by 2028; later pool evidence reports higher 2026 shipment figures, but those later figures are not independently corroborated here. Revenue, margin, cash burn, cash on hand, runway, customer count and profitability remain open diligence items.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-open-risks
    title: Milestones and unresolved diligence
    body: >-
      The milestone record shows a progression from incorporation and founding, through facility opening and mass production, to public financing, regulatory support and reported shipment scale. The European Commission’s December 2024 decision is the strongest independent evidence for the planned Novara project: it approved an approximately €1.3 billion Italian state-aid measure for a €3.2 billion facility and described full-capacity operation as expected in 2033. This is evidence of policy approval and a funding structure, not proof that construction, qualification or commercial utilization will meet plan.       Company-issued 2025 material is explicit that expansion plans, customer demand and European investment contain forward-looking risks, including construction delays, higher capital requirements, insufficient ecosystem support and adverse government action. TrendForce also reports that Intel is pursuing large advanced-packaging customers while expanding capacity, adding an external execution and competition risk. The principal overview conclusion is consequently conditional: the company has credible technical and institutional milestones, but investors still need audited financials, customer-level production evidence, the full debt and equity terms, board-control details and a current ownership register.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: []
