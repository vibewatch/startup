      severity: material
      topic: funding
      missingEvidence: "A reconciled capitalization table separating equity raised, debt committed, debt drawn, government aid and any secondary proceeds."
      whyItMatters: "The assigned sources report different lifetime-funding totals and do not establish dilution, seniority or cash availability."
      diligencePath: "Obtain financing agreements, round closing statements, cap table, debt schedule, grant agreement and valuation memo."
