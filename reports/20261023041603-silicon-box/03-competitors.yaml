chapter:
  number: 3
  title: Competitors
  summary: Silicon Box competes at the intersection of advanced packaging, chiplet integration, and outsourced assembly and test. Its panel-level, high-yield positioning is differentiated, but incumbent OSATs and foundries have greater scale, customer qualification depth, and expanding alternative capacity.
sections:
  - id: landscape-and-profiles
    title: Competitive landscape and profiles
    body: >-
      The competitive set is broader than venture-backed chiplet specialists. Silicon Box describes
      a panel-level production model for chiplet packages, while established outsourced semiconductor
      assembly and test providers compete with wafer-scale, 2.5D, 3D, system-in-package, and
      test offerings. Tracxn lists Amkor, RRP Electronics, HANA Micron, UTAC, Unisem, and KYEC
      Group among the active alternatives, but its rankings are a screening signal rather than a
      capability benchmark. The relevant buyer choice is therefore between Silicon Box's
      specialized panel-scale route, incumbent OSAT capacity, foundry-owned packaging such as
      TSMC CoWoS, Intel's EMIB/Foveros ecosystem, and internal or outsourced design-plus-packaging
      programs. Public evidence does not establish a complete list of qualified suppliers or the
      exact customer overlap.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-buyer-tradeoffs
    title: Capability, distribution, and switching trade-offs
    body: >-
      Silicon Box's strongest stated differentiator is the combination of panel-scale manufacturing,
      high interconnection density, and commercial yield. Its 2025 release reported 100 million
      units shipped and said the Singapore site was the largest facility of its kind by production
      capacity; a 2026 company release reported 500 million units and a planned tenfold capacity
      ramp. Those are company-issued operating claims, not independent benchmark results. Incumbent
      alternatives bring a different advantage: Amkor reported multiple AI-GPU engagements using
      2.5D technology, while ASE reported leading-edge advanced packaging at 10% of ATM revenue
      in Q1 2025. Qualification, reliability data, package design rules, substrate and test access,
      and customer engineering history create switching costs. A buyer can multi-home across
      suppliers, but a production transfer still requires qualification and compatible upstream and
      downstream flows. Public pricing is unavailable for all compared providers, so the matrix
      records unknown rather than inferring a discount from claimed cost advantages.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: durability-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The moat is plausible but not yet durable on public evidence. TDK Ventures attributes Silicon
      Box's appeal to chiplet interconnect innovation, large-format high-yield production, team
      expertise, and ecosystem backing, but that is investor commentary from a partner rather than
      an independent benchmark. Meanwhile, independent reporting describes persistent 2.5D/3D
      packaging bottlenecks, spillover demand benefiting SPIL and Amkor, and Intel gaining traction
      from EMIB and FOEB. TSMC's CoWoS-L is reported to offer high performance, yield, and cost
      efficiency while TSMC expands its footprint. This creates both demand tailwind and
      displacement risk: constrained capacity may help an independent provider win qualification,
      while foundry and incumbent investment can compress its differentiation. The critical
      diligence question is whether Silicon Box's yield, reliability, cost per package, and
      customer retention remain superior after competing capacity arrives; the assigned evidence
      does not disclose those customer-level comparisons.
    claimRefs: [CP010, CP011, CP012, CP013]
    tableRefs: []
    figureRefs: []
