callouts:
  - calloutType: strength
    title: Differentiation is technically legible
    body: "Panel-scale production, chiplet integration, and claimed high-yield execution give Silicon Box a clear buyer-facing wedge against conventional packaging routes."
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Incumbent response can compress the moat
    body: "TSMC capacity expansion and incumbent OSAT or Intel alternatives may reduce scarcity-driven advantage before Silicon Box's customer-level economics are independently demonstrated."
    claimRefs: [CP010, CP011, CP012]
  - calloutType: recommendation
    title: Underwrite qualification evidence, not headline volume
    body: "Request named-customer qualification status, package-level yield denominators, reliability results, realized pricing, and capacity commitments before treating the stated differentiation as durable."
    claimRefs: [CP006, CP009, CP013]
