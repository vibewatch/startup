company:
  name: Silicon Box
chapter:
  number: 2
  title: Market Analysis
  summary: Silicon Box participates in a growing advanced-packaging market at the intersection of chiplet integration, AI accelerator demand, and regional supply-chain investment. The evidence supports a large and expanding opportunity, but published totals vary materially by inclusion rules, while packaging capacity, capital intensity, and customer qualification remain adoption constraints.
sections:
  - id: market-boundary
    title: Market boundary and substitution
    body: >-
      The relevant market is outsourced advanced semiconductor packaging and
      chiplet-integration services that go beyond conventional wire-bond
      assembly and create higher-density, higher-performance package-level
      integration. It includes panel-level packaging, fan-out, 2.5D
      interposer, 3D stacking, hybrid bonding, and related design-to-test
      services when the advanced integration feature is part of the paid
      offering. It excludes front-end wafer fabrication, standalone chip
      design, ordinary assembly and test without advanced integration, and the
      full value of downstream chips or AI systems. The practical substitutes
      are monolithic dies, conventional wafer-level or substrate packages,
      incumbent 2.5D/3D platforms, and internal packaging programs. Chiplet
      architecture improves modularity and reuse, but buyers still compare
      complete delivered performance, yield, reliability, time-to-market, and
      qualified capacity rather than packaging geometry alone.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market momentum
    body: >-
      No single published number should be treated as Silicon Box's directly
      addressable market. Mordor's advanced-packaging definition estimates
      USD 51.62 billion in 2025, USD 57.46 billion in 2026, and USD 90.11
      billion in 2031, while explicitly using a proprietary estimation
      framework. McKinsey instead frames the broader semiconductor market as
      potentially exceeding USD 1 trillion by 2030, not as packaging revenue.
      Deloitte's separate lens estimates the AI-chip market at about USD 500
      billion in 2026, which is an upstream device market and therefore an
      opportunity driver rather than a packaging TAM. The market case is
      strongest where these lenses intersect: AI and HPC raise package
      performance and capacity requirements, automotive and other embedded
      systems add diversified demand, and public subsidies encourage regional
      back-end investment. These figures are directional lenses with different
      denominators, not additive layers.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers
    title: Buyer segments and adoption path
    body: >-
      The economic buyer is typically a semiconductor company, hyperscaler,
      systems company, or device OEM that owns product cost, performance,
      reliability, and launch timing; the user is the chip, package, or system
      engineering team; and the payer is the product or manufacturing budget
      owner, sometimes supported by strategic or public capital. Adoption
      begins with architecture and design collaboration, proceeds through
      qualification and reliability testing, and reaches recurring production
      only after yield, thermal, electrical, and delivery commitments are
      demonstrated. AI training and inference products are the most urgent
      trigger because dense memory and die-to-die connections constrain system
      performance. Automotive, mobile, robotics, and other high-volume
      applications can broaden the base, but have longer qualification cycles
      and different reliability or cost thresholds.
    claimRefs: [CM008, CM009, CM010]
    tableRefs: [TM003]
  - id: constraints-and-gaps
    title: Constraints, timing, and diligence gaps
    body: >-
      Demand is not equivalent to near-term serviceable revenue. SemiAnalysis
      describes CoWoS and HBM as bottlenecks for leading-edge AI accelerators,
      but alternative packaging technologies and capacity additions can
      redirect spending. Mordor's estimate also says capital intensity above
      USD 500 million per panel-level line and rapid depreciation can compress
      margins and make financing difficult without customer prepayments. Silicon
      Box reports shipment and expansion milestones, yet the assigned evidence
      does not disclose customer names, production-versus-pilot mix, contracted
      capacity, package pricing, or conversion from shipments to recurring
      revenue. The investable sizing question therefore remains constrained:
      validate the buyer pipeline, qualification status, unit economics,
      capacity reservations, and the share of the published market that can
      actually be served by Silicon Box's process and geography.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: []
