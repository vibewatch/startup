    title: Advanced packaging sizing lenses
    type: pyramid
    summary: Alternative market lenses narrow from the broad semiconductor and AI-chip opportunity to the advanced-packaging revenue pool without implying additive conversion.
    data:
      items:
        - {label: "Global semiconductor market, 2030", value: 1000, unit: "USD bn; source says more than", detail: "McKinsey broad industry forecast"}
        - {label: "Global semiconductor market, 2021", value: 600, unit: "USD bn", detail: "McKinsey broad industry baseline"}
        - {label: "AI-chip market", value: 500, unit: "USD bn in 2026", detail: "Deloitte estimate; upstream chip market"}
        - {label: "Advanced packaging forecast", value: 90.11, unit: "USD bn in 2031", detail: "Mordor estimate; 9.42% CAGR from 2026"}
        - {label: "Advanced packaging", value: 57.46, unit: "USD bn in 2026", detail: "Mordor estimate"}
        - {label: "Panel-level packaging growth", value: 25.58, unit: "% CAGR through 2031", detail: "Mordor platform forecast"}
    approximationNotes: "The layers reproduce separate publisher values with different denominators and time bases; they are not additive or a mathematically comparable TAM/SAM/SOM conversion. The panel-level item is a growth rate, not market value, and the greater-than USD 1 trillion forecast is plotted at its stated lower bound."
    claimRefs: [CM004, CM005, CM006, CM007]
callouts:
  - calloutType: insight
    title: Growth is real, but the addressable slice is narrower
    body: "The evidence supports structural growth in advanced packaging and chiplet demand, while the portion available to a single panel-level provider depends on qualification, capacity, geography, and customer economics."
    claimRefs: [CM004, CM008, CM011, CM013]
  - calloutType: risk
    title: Capacity can be both tailwind and constraint
    body: "AI packaging bottlenecks support urgency, but panel-level lines require substantial capital and competing platforms are adding capacity; demand must be converted into funded, qualified programs."
    claimRefs: [CM011, CM012, CM015]
