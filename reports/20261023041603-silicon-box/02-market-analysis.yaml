      - ["Automotive and EV", "Tier-1, OEM, or automotive semiconductor supplier", "Reliability and power-electronics engineering", "Program and quality budget", "Long qualification and production ramp", "Program procurement", "Thermal cycling, efficiency, and long-life reliability"]
      - ["Mobile and consumer", "SoC vendor or device OEM", "Package, RF, and product engineering", "Product cost and launch budget", "Design-in to high-volume manufacturing", "Product sourcing", "Thinness, power, yield, and cost"]
      - ["Robotics and industrial", "Robotics OEM or system integrator", "Compute and controls engineering", "Product and capital-equipment budget", "Pilot, field validation, then repeat production", "Program owner", "Edge compute performance and supply assurance"]
    notes: "Buyer roles and workflows are an evidence-constrained operating map synthesized from the cited application and qualification descriptions; contract values, price points, and customer names are not disclosed in the assigned sources."
    claimRefs: [CM008, CM009, CM010, CM013]
figures:
