      - [McKinsey, 2024, Global, "More than USD 1T semiconductor market by 2030", "Not stated in fetched excerpt", "Industry outlook and scenario framing", high, "Broad semiconductor market; packaging share is not isolated"]
    notes: "Values use each publisher's stated unit, year, geography, and denominator. They are alternative sizing lenses and must not be summed into a TAM/SAM/SOM funnel."
    claimRefs: [CM004, CM005, CM006, CM007]
