chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Silicon Box was incorporated in Singapore in 2021 and is described across the retained sources as an
              advanced semiconductor packaging company rather than a chip designer or conventional wafer foundry. Its
              stated product and service model combines chiplet design collaboration with manufacturing using
              proprietary SiPlet panel-level packaging and sub-5-micron interconnects. The operating proposition is to
              assemble heterogeneous chiplets into packages for AI, high-performance computing, data-centre, automotive,
              mobile, IoT, robotics and space applications. The Singapore Tampines facility began mass production in
              late 2023, while a Novara facility is planned for Europe. The company’s positioning is therefore a
              specialized backend manufacturing and integration platform whose economics depend on yield, throughput,
              customer qualification and sustained capital access. Public material does not identify named production
              customers or disclose a complete commercial contract base, so the distinction between announced
              applications, early collaborations and recurring production revenue remains important.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
