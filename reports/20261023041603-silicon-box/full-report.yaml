      - CV016
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - High-volume execution is plausible
        - More than 250M units reported by Q1 2026
        - Independent customer or production records and audited shipment-to-revenue reconciliation
      - - Financing validates strategic relevance
        - US$150M Series B2 plus SGD100M debt announced in June 2026
        - Current valuation, debt covenants, and investor underwriting rationale
      - - Market growth supports demand
        - Advanced packaging estimated at US$43.9B in 2026 and US$66.0B in 2033
        - Silicon Box share, backlog, utilization and margin evidence
      - - Price may be too high
        - Historical US$1.55B mark versus sub-US$1M or US$1.87M reported revenue figures
        - Audited current revenue, gross margin, and a market-clearing transaction price
      - - Expansion can amplify downside
        - Full Singapore capacity installation and Italy production are described for 2028
        - Permits, construction budget, funding plan, and return-on-capital case
    notes: >-
      The two revenue figures come from different third-party profiles and periods/definitions; they are not treated as
      interchangeable.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Shipments convert to diversified paid programs; capacity installs on schedule; market grows
        - Historical mark is supported or exceeded only after audited revenue and margin proof
        - Low-to-medium; milestones are partly company-reported
        - Revenue, utilization or cash conversion lags unit growth
      - - Base
        - Technical execution continues; commercial conversion and margins remain opaque
        - Hold/track; require a material valuation reset or verified economics before entry
        - Medium; best fit to current evidence
        - No customer-level bookings or audited financial bridge
      - - Bear
        - Debt service, construction delay, concentration or added capital needs impair returns
        - Down-round or preference-adjusted equity value could be materially below historical mark
        - Medium; disclosure gaps prevent quantification
        - Covenant stress, delayed plant, or failed commercialization
      - - Catalyst
        - Audited statements, signed customer contracts and current financing terms arrive
        - Re-underwrite using revenue/margin and preference-adjusted scenarios
        - Unresolved; diligence-dependent
        - Evidence remains promotional and non-audited
      - - Exit readiness
        - Singapore scale and planned Europe footprint become cash-generative
        - Strategic or public-market exit is plausible only with repeatable margins
        - Low today; no exit filing or transaction evidence
        - Capital intensity remains ahead of cash generation
    notes: >-
      Scenario logic is an analytical framework, not a disclosed company forecast; no probability-weighted valuation is
      calculated because the public denominator is incomplete.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
      - CV016
