      - number: '1.2'
        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The retained evidence identifies Byung Joon (BJ) Han as co-founder and CEO, with Sehat Sutardja and Weili
              Dai as co-founders and board-level leaders. The founding group combines prior semiconductor packaging and
              semiconductor-system experience: the company-issued milestone release describes Han’s prior STATS ChipPAC
              leadership and the two other founders’ Marvell background, while an investor-authored account frames
              Sutardja’s 2015 chiplet presentation as part of the founding thesis. Tracxn’s current profile lists a
              five-member active board, including the founders and two independent members, but the profile also
              contains duplicate-name records and historical directors. This supports a governance structure broader
              than a three-person founding team, while leaving board committee responsibilities, control rights,
              succession planning and key-person mitigation unconfirmed. Han’s combined CEO, technical and industry role
              remains a material dependency for execution and credibility.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Funding, valuation and operating scale
        blocks:
          - type: paragraph
            body: >-
              Funding evidence is current but inconsistent in total-cash terminology. A June 2026 financing report
              describes S$100 million, approximately US$77.65 million, of debt financing with a further US$75 million
              upsizing option, following a US$150 million Series B2 equity round. Tracxn records US$658 million across
              seven rounds and a June 2026 conventional-debt round, while another company-profile source reports a
              different total and a US$1.55 billion private valuation. These figures should not be collapsed into one
              audited capitalization table: debt is not equity, a facility option is not cash drawn, and a private
              valuation is not liquid enterprise value. The company’s own October 2025 release reported 100 million
              units shipped and a planned full-capacity installation by 2028; later pool evidence reports higher 2026
              shipment figures, but those later figures are not independently corroborated here. Revenue, margin, cash
              burn, cash on hand, runway, customer count and profitability remain open diligence items.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a progression from incorporation and founding, through facility opening and
              mass production, to public financing, regulatory support and reported shipment scale. The European
              Commission’s December 2024 decision is the strongest independent evidence for the planned Novara project:
              it approved an approximately €1.3 billion Italian state-aid measure for a €3.2 billion facility and
              described full-capacity operation as expected in 2033. This is evidence of policy approval and a funding
              structure, not proof that construction, qualification or commercial utilization will meet plan.      
              Company-issued 2025 material is explicit that expansion plans, customer demand and European investment
              contain forward-looking risks, including construction delays, higher capital requirements, insufficient
              ecosystem support and adverse government action. TrendForce also reports that Intel is pursuing large
              advanced-packaging customers while expanding capacity, adding an external execution and competition risk.
              The principal overview conclusion is consequently conditional: the company has credible technical and
              institutional milestones, but investors still need audited financials, customer-level production evidence,
              the full debt and equity terms, board-control details and a current ownership register.
