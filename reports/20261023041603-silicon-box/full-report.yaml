  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitution
        blocks:
          - type: paragraph
            body: >-
              The relevant market is outsourced advanced semiconductor packaging and chiplet-integration services that
              go beyond conventional wire-bond assembly and create higher-density, higher-performance package-level
              integration. It includes panel-level packaging, fan-out, 2.5D interposer, 3D stacking, hybrid bonding, and
              related design-to-test services when the advanced integration feature is part of the paid offering. It
              excludes front-end wafer fabrication, standalone chip design, ordinary assembly and test without advanced
              integration, and the full value of downstream chips or AI systems. The practical substitutes are
              monolithic dies, conventional wafer-level or substrate packages, incumbent 2.5D/3D platforms, and internal
              packaging programs. Chiplet architecture improves modularity and reuse, but buyers still compare complete
              delivered performance, yield, reliability, time-to-market, and qualified capacity rather than packaging
              geometry alone.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >-
              No single published number should be treated as Silicon Box's directly addressable market. Mordor's
              advanced-packaging definition estimates USD 51.62 billion in 2025, USD 57.46 billion in 2026, and USD
              90.11 billion in 2031, while explicitly using a proprietary estimation framework. McKinsey instead frames
              the broader semiconductor market as potentially exceeding USD 1 trillion by 2030, not as packaging
              revenue. Deloitte's separate lens estimates the AI-chip market at about USD 500 billion in 2026, which is
              an upstream device market and therefore an opportunity driver rather than a packaging TAM. The market case
              is strongest where these lenses intersect: AI and HPC raise package performance and capacity requirements,
              automotive and other embedded systems add diversified demand, and public subsidies encourage regional
              back-end investment. These figures are directional lenses with different denominators, not additive
              layers.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is typically a semiconductor company, hyperscaler, systems company, or device OEM that
              owns product cost, performance, reliability, and launch timing; the user is the chip, package, or system
              engineering team; and the payer is the product or manufacturing budget owner, sometimes supported by
              strategic or public capital. Adoption begins with architecture and design collaboration, proceeds through
              qualification and reliability testing, and reaches recurring production only after yield, thermal,
              electrical, and delivery commitments are demonstrated. AI training and inference products are the most
              urgent trigger because dense memory and die-to-die connections constrain system performance. Automotive,
              mobile, robotics, and other high-volume applications can broaden the base, but have longer qualification
              cycles and different reliability or cost thresholds.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: Constraints, timing, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Demand is not equivalent to near-term serviceable revenue. SemiAnalysis describes CoWoS and HBM as
              bottlenecks for leading-edge AI accelerators, but alternative packaging technologies and capacity
              additions can redirect spending. Mordor's estimate also says capital intensity above USD 500 million per
              panel-level line and rapid depreciation can compress margins and make financing difficult without customer
              prepayments. Silicon Box reports shipment and expansion milestones, yet the assigned evidence does not
              disclose customer names, production-versus-pilot mix, contracted capacity, package pricing, or conversion
              from shipments to recurring revenue. The investable sizing question therefore remains constrained:
              validate the buyer pipeline, qualification status, unit economics, capacity reservations, and the share of
              the published market that can actually be served by Silicon Box's process and geography.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Growth is real, but the addressable slice is narrower
            body: >-
              The evidence supports structural growth in advanced packaging and chiplet demand, while the portion
              available to a single panel-level provider depends on qualification, capacity, geography, and customer
              economics.
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM011
              - CM013
          - type: callout
            title: Capacity can be both tailwind and constraint
            body: >-
              AI packaging bottlenecks support urgency, but panel-level lines require substantial capital and competing
              platforms are adding capacity; demand must be converted into funded, qualified programs.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and profiles
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than venture-backed chiplet specialists. Silicon Box describes a
              panel-level production model for chiplet packages, while established outsourced semiconductor assembly and
              test providers compete with wafer-scale, 2.5D, 3D, system-in-package, and test offerings. Tracxn lists
              Amkor, RRP Electronics, HANA Micron, UTAC, Unisem, and KYEC Group among the active alternatives, but its
              rankings are a screening signal rather than a capability benchmark. The relevant buyer choice is therefore
              between Silicon Box's specialized panel-scale route, incumbent OSAT capacity, foundry-owned packaging such
              as TSMC CoWoS, Intel's EMIB/Foveros ecosystem, and internal or outsourced design-plus-packaging programs.
              Public evidence does not establish a complete list of qualified suppliers or the exact customer overlap.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
      - number: '3.2'
        title: Capability, distribution, and switching trade-offs
        blocks:
          - type: paragraph
            body: >-
              Silicon Box's strongest stated differentiator is the combination of panel-scale manufacturing, high
              interconnection density, and commercial yield. Its 2025 release reported 100 million units shipped and
              said the Singapore site was the largest facility of its kind by production capacity; a 2026 company
              release reported 500 million units and a planned tenfold capacity ramp. Those are company-issued operating
              claims, not independent benchmark results. Incumbent alternatives bring a different advantage: Amkor
              reported multiple AI-GPU engagements using 2.5D technology, while ASE reported leading-edge advanced
              packaging at 10% of ATM revenue in Q1 2025. Qualification, reliability data, package design rules,
              substrate and test access, and customer engineering history create switching costs. A buyer can multi-home
              across suppliers, but a production transfer still requires qualification and compatible upstream and
              downstream flows. Public pricing is unavailable for all compared providers, so the matrix records unknown
              rather than inferring a discount from claimed cost advantages.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is plausible but not yet durable on public evidence. TDK Ventures attributes Silicon Box's appeal
              to chiplet interconnect innovation, large-format high-yield production, team expertise, and ecosystem
              backing, but that is investor commentary from a partner rather than an independent benchmark. Meanwhile,
              independent reporting describes persistent 2.5D/3D packaging bottlenecks, spillover demand benefiting SPIL
              and Amkor, and Intel gaining traction from EMIB and FOEB. TSMC's CoWoS-L is reported to offer high
              performance, yield, and cost efficiency while TSMC expands its footprint. This creates both demand
              tailwind and displacement risk: constrained capacity may help an independent provider win qualification,
              while foundry and incumbent investment can compress its differentiation. The critical diligence question
              is whether Silicon Box's yield, reliability, cost per package, and customer retention remain superior
              after competing capacity arrives; the assigned evidence does not disclose those customer-level
              comparisons.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is technically legible
            body: >-
              Panel-scale production, chiplet integration, and claimed high-yield execution give Silicon Box a clear
              buyer-facing wedge against conventional packaging routes.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Incumbent response can compress the moat
            body: >-
              TSMC capacity expansion and incumbent OSAT or Intel alternatives may reduce scarcity-driven advantage
              before Silicon Box's customer-level economics are independently demonstrated.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Underwrite qualification evidence, not headline volume
            body: >-
              Request named-customer qualification status, package-level yield denominators, reliability results,
              realized pricing, and capacity commitments before treating the stated differentiation as durable.
            calloutType: recommendation
            claimRefs:
              - CP006
              - CP009
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial traction
        blocks:
          - type: paragraph
            body: >-
              Silicon Box appears to monetize end-to-end chiplet integration and advanced panel-level packaging rather
              than a software subscription or standardized commodity component. Its public materials describe design
              consultation, packaging and manufacturing, with customer collaboration around application-specific
              solutions. The October 2025 company release reported 100 million units shipped from the Tampines facility,
              but it did not disclose ASP, contract terms, customer names, revenue by application, or the split between
              qualification, R&D and production. A third-party profile reports US$1.87 million of 2024 factory-year
              revenue from pre-qualified customers and R&D; because that profile is not an audited filing, it is a
              directional datapoint rather than a verified revenue base. The commercial question is thus not whether the
              factory can ship, but whether unit volume converts into durable, profitable customer programs.
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              No public source in the assigned evidence set provides a list price, realized price, gross margin,
              customer acquisition cost, payback period, utilization, or contribution margin. Silicon Box positions
              panel-level packaging as a lower-cost alternative to wafer-level and traditional packaging, while its own
              release also emphasizes high performance and high yield; those are company claims about the value
              proposition, not evidence of realized margin. The operating model is likely exposed to cleanroom,
              materials, test, utilities, labor, yield and depreciation costs, but the evidence does not quantify any of
              those items. Accordingly, a financial model should keep ASP, yield-adjusted cost per good unit,
              utilization and customer-specific engineering charges as explicit unknowns instead of inferring them from
              shipment counts. A buyer diligence package should reconcile contracted pricing to invoices and map each
              production program from qualification through volume ramp.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Silicon Box has financed a manufacturing build-out with a mixture of equity and debt, but disclosed
              proceeds are not the same as cash available for operations. The company announced SGD100 million of debt
              financing in June 2026, including an option to upsize by an additional US$75 million, and said proceeds
              would be used for capacity expansion. The same release said this debt followed a US$150 million Series B2
              equity round. A law-firm deal description separately describes US$100 million, US$150 million and S$100
              million transactions, corroborating the existence of a substantial financing stack but not providing
              covenants, interest rates, maturity, collateral, cash balance or remaining proceeds. Expansion plans add
              further funding exposure: external coverage describes the Italian project as a €3.2 billion facility with
              a planned 2028 start, while trade coverage separately reports €1.3 billion in Italian government funding
              without public drawdown conditions. Without cash, burn, capex phasing, grants, customer prepayments and
              debt schedules, runway and next-round trigger remain unquantified.
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a technically credible, capital-backed manufacturing scale-up, not a fully
              underwritten financial profile. The strongest positive indicators are high-volume shipment claims, a
              reported 99.7% historical wafer-scale yield benchmark, a debt facility with named institutional lenders,
              and an identified European expansion program. The strongest negative indicator is disclosure opacity: the
              sources do not establish recurring revenue, gross profit, free cash flow, cash on hand, monthly burn,
              customer concentration, realized pricing or debt service capacity. The 2025 company release itself lists
              demand changes, construction delays, increased capital requirements, government support changes and
              insufficient ecosystem support among risks that could make actual results differ from plans. For
              investment underwriting, the decision should remain conditional on audited financial statements,
              customer-level bookings and backlog, capacity utilization, yield by product, capex commitments, grant
              conditions and a reconciled financing waterfall.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI009
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production proof is stronger than financial disclosure
            body: >-
              The 100-million-unit milestone and financing announcements support execution and access to capital, but do
              not establish realized pricing, margin or free cash flow.
            calloutType: strength
            claimRefs:
              - CI001
              - CI007
              - CI009
          - type: callout
            title: Expansion creates a financing dependency
            body: >-
              The planned Singapore and Italy capacity build-outs are large relative to the disclosed operating metrics;
              cash, burn, debt terms and grant conditions are required before underwriting runway.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Silicon Box sells semiconductor integration and packaging rather than a software product. The workflow
              begins with a customer's chiplet or die design and requires package architecture, interconnection,
              assembly, testing, and delivery of finished devices. Tracxn describes the company as providing "end-to-end
              semiconductor integration services, from chiplet design consultation through final manufacturing," while
              the company describes its technology as addressing performance, scalability, and cost constraints in
              wafer-level and traditional packaging. The practical customer value proposition is to fit square chips on
              square panels, increase usable manufacturing area, and provide a route to chiplet-based systems for AI,
              HPC, automotive, robotics, mobile, and IoT applications. Business Times reports that the company's panels
              have more than six times the productive area of standard 300 mm wafers, but this is an external
              description rather than a disclosed product specification. The public record does not identify customer
              names, package-level benchmark results, or realized cost savings, so those benefits should be treated as
              claims requiring customer and engineering diligence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE011
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
              - CE012
      - number: '5.2'
        title: Architecture, manufacturing maturity, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating architecture is a panel-level packaging line with chiplet interconnection,
              manufacturing execution, quality controls, and testing. The Singapore Tampines facility began mass
              production in late 2023 and Silicon Box reported shipping 100 million units in October 2025 and 500
              million units in August 2026. These milestones indicate commercial production maturity at the facility
              level, although the company-issued figures do not disclose the number of distinct products, die types,
              test coverage, defect definitions, or customer acceptance criteria. The company says the Singapore site is
              undergoing a US$300 million expansion, aims to increase production capacity by a factor of ten within
              2026, and expects full capacity installation by 2028. A second Novara facility is planned for 2028 with
              native test capability. Those expansion and roadmap dates are forward-looking company statements;
              construction completion, qualification timing, and actual customer allocation remain open questions.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE011
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE010
              - CE012
              - CE014
      - number: '5.3'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Silicon Box's claimed differentiation combines panel-scale manufacturing, high-density chiplet
              interconnection, and a founding team with prior packaging experience. TDK Ventures characterizes the
              approach as using panel packaging and short chiplet-to-chiplet interconnects, while Tracxn reports a
              claimed sub-5-micron interconnect density. These sources establish the nature of the proposed
              architecture, not an independently reproducible benchmark. The strongest observable control evidence is
              certification: the Tampines operation is reported to have achieved ISO 9001:2015 in 2024, ISO 14001:2015
              and ISO 45001:2018 in 2025, and an AutomotiveWorld report says the company received an IATF 16949 Letter
              of Conformance ahead of full automotive certification. UCIe's public consortium material confirms that
              open chiplet interoperability is an active ecosystem requirement, but it does not establish Silicon Box
              compliance. Key risks are therefore qualification and interoperability, yield measurement at panel scale,
              dependence on specialized equipment and suppliers, and execution of a capital-intensive second fab. No
              public security, privacy, product-recall, outage, or incident disclosure was found in the assigned
              evidence; that absence is not evidence that no incidents exist.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production evidence is stronger than product benchmarking
            body: >-
              Reported 100-million- and 500-million-unit milestones, mass production since late 2023, and formal
              management-system certifications support operational maturity at the Singapore-facility level. They do not
              substitute for independent yield, reliability, electrical, thermal, or customer-acceptance data.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE009
          - type: callout
            title: Interoperability and scale-up remain underwriting gates
            body: >-
              The core value proposition depends on panel-scale yield, package interoperability, and successful
              qualification across customer applications. Public evidence describes the architecture and roadmap but
              does not establish UCIe compliance, full automotive certification, or the economics of the planned
              European expansion.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Silicon Box positions its offering as end-to-end chiplet design consultation, packaging, manufacturing,
              and testing rather than as a standardized component sold through a self-serve channel. Public materials
              point to automotive, AI, HPC, mobile, IoT, robotics, and space applications, with the automotive program
              providing the clearest current vertical signal. The buyer is likely an engineering and procurement
              organization that must qualify a packaging process, not an individual software user; however, the sources
              do not disclose named accounts, contract sizes, qualification stages, or whether volume is customer
              production, internal qualification, or R&D. The 2026 automotive announcement says the company is
              co-developing packages with customers for next-generation ADAS, while its factory announcement describes
              collaboration with early customers, so customer involvement is evidenced but customer identity and
              commercial terms remain opaque.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and named-customer proof
        blocks:
          - type: paragraph
            body: >-
              Production milestones are the strongest observable adoption proxy. Silicon Box reported 100 million units
              shipped in October 2025 and more than 250 million by Q1 2026, while a June 2026 financing release
              described capacity expansion to meet demand. These are company-issued operating figures and do not
              identify customers, units per account, revenue contribution, or repeat orders. Imec participation adds
              ecosystem validation and an automotive qualification path, including an IATF 16949 letter of conformance
              and stated co-development, but it is not proof of a named production customer. The customer diligence
              conclusion is therefore “scaled process with customer collaboration disclosed, account-level adoption
              unverified.”
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU007
              - CU010
              - CU013
      - number: '6.3'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies NRR, GRR, churn, renewal rates, contract duration, cohort behavior, customer
              concentration, or account-level revenue. The company says capacity is being expanded for growing demand
              and that automotive revenue grew at an annualized 436% rate in Q1 2026, but the denominator, starting
              base, and customer mix are not disclosed. A Tracxn profile reports 2024 revenue below US$1 million and
              separately describes the business as funded, but it does not provide customer retention evidence. The
              large-format factory and planned European site may support expansion across geographies and applications,
              yet they also increase the cost of underutilized capacity if qualification or demand slips. Investors
              should request a customer-by-customer revenue bridge, qualified-versus-production account list, backlog,
              renewal evidence, and top-ten concentration.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Customer diligence conclusion
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a technically credible manufacturing platform that has reached meaningful volume and
              participates in customer-facing automotive development. It does not support a precise customer count,
              durable retention conclusion, or concentration estimate. The central diligence gap is not whether Silicon
              Box can ship units; it is whether those units represent repeatable, paid production programs with
              diversified customers and acceptable economics. The adverse signal is that an independent account
              describes the technology as more complex and expensive to produce, which could lengthen qualification
              cycles and constrain the addressable buyer set. Until Silicon Box discloses named references or auditable
              cohort and revenue data, customer confidence should remain medium rather than high.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled process evidence
            body: >-
              Reported unit shipments rose from 100 million in October 2025 to more than 250 million by Q1 2026,
              indicating operational scale even though account-level adoption is not disclosed.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Customer opacity
            body: >-
              Public evidence does not name customers or disclose retention, revenue concentration,
              production-versus-pilot mix, or contract durability; these gaps materially limit customer-quality
              underwriting.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: callout
            title: Require account-level proof
            body: >-
              Before underwriting durable growth, request customer references, qualification status, paid production
              volumes, renewal or repeat-order evidence, and a top-customer revenue bridge.
            calloutType: recommendation
            claimRefs:
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and operating evidence
        blocks:
          - type: paragraph
            body: >-
              Silicon Box's strongest risk mitigant is demonstrated manufacturing execution rather than disclosed
              financial resilience. The company reported shipping 100 million units from its Singapore facility, which
              began mass production in late 2023, and reported ISO 9001:2015, ISO 14001:2015, and ISO 45001:2018
              certifications across 2024 and 2025. These are company-issued statements and do not substitute for
              independent yield data, customer-level quality data, or audited financial statements. A TDK Ventures
              investment thesis also identified demonstrated production capability, high yield, technical expertise, and
              ecosystem building as key conditions for the investment. The main residual concern is that expansion to
              Italy and full Singapore capacity are forward-looking projects exposed to construction, capital, demand,
              and government-support risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR009
      - number: '7.2'
        title: Legal, regulatory, and geopolitical exposure
        blocks:
          - type: paragraph
            body: >-
              The available record shows a live regulatory exposure rather than a disclosed enforcement event. The U.S.
              Bureau of Industry and Security's December 2024 interim final rule changed controls for advanced computing
              items, semiconductor manufacturing equipment, foreign-produced direct products, and high-bandwidth memory.
              For a Singapore-based advanced-packaging company serving AI, HPC, automotive, and other sectors, export
              classification, customer screening, technology transfer, and diversion controls are material diligence
              items. The company's own risk disclosure also names adverse legislative or government action, changes in
              incentives, and geopolitical trends as risks to its European plans. No assigned source establishes that
              Silicon Box itself has violated a rule; the appropriate conclusion is an unresolved compliance and
              supply-chain exposure.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR013
      - number: '7.3'
        title: Dependencies, financial model risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Silicon Box's operating model is dependent on a small number of high-consequence milestones: customer
              qualification and demand, panel-level yield and reliability, suppliers and ecosystem partners, capital
              availability, and public support for the Italian project. Imec describes its Automotive Chiplet Program as
              a consortium with more than 22 partners and says Silicon Box is co-developing automotive-grade packages
              with customers; that is a useful ecosystem signal but not proof of production revenue or customer
              concentration. Public market and database records are inconsistent on financing and valuation, and the
              assigned evidence does not provide audited burn, cash, margins, or runway. Investors should therefore
              monitor measurable milestones and treat missed qualification, repeated quality incidents, export-control
              restrictions, or funding shortfalls as thesis-break triggers.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Expansion is the principal thesis-break surface
            body: >-
              The Italian plant and Singapore capacity plan can increase strategic reach, but construction, capital,
              incentives, and demand must all arrive together; a delay or funding gap would materially change the risk
              profile.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR010
          - type: callout
            title: No incident finding is not a clean bill of health
            body: >-
              The assigned pool contains no confirmed Silicon Box enforcement, outage, or litigation event, but
              public-source absence does not establish that none exists; legal and compliance diligence remains
              required.
            calloutType: assumption
            claimRefs:
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is an advanced-packaging company that has moved beyond laboratory claims: the company
              reported 250 million units shipped by Q1 2026, while its 2025 release described mass production beginning
              in late 2023. A June 2026 debt facility and a concurrent US$150 million equity round provide evidence that
              capital providers are funding capacity expansion, not merely an R&D plan. The market backdrop is also
              supportive: Grand View Research estimates the global advanced-packaging market at US$43.9 billion in 2026
              and US$66.0 billion in 2033. The anti-thesis is stronger for an entry decision: the assigned sources do
              not disclose audited revenue, gross margin, cash burn, runway, customer names, contract duration, or
              current post-money valuation. The only public valuation mark located is a historical US$1.55 billion
              figure, while Tracxn reports revenue below US$1 million as of December 31, 2023 and another profile
              reports US$1.87 million for the 2024 factory year. Those different periods and definitions make a revenue
              multiple unsuitable without diligence.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing is strategically useful but not equivalent to equity value: Silicon Box announced
              SGD100 million of debt from Ares Management, InnoVen Capital, January Capital Growth Credit, and Abound
              Capital, with an option to upsize by an additional US$75 million. TechNode reports the facility followed a
              completed US$150 million Series B2 equity round and says proceeds are intended for capacity expansion.
              Debt can extend the build-out without immediate shareholder dilution, but it creates repayment, covenant,
              and refinancing exposure that cannot be assessed from the public record. The historical US$1.55 billion
              mark should therefore be treated as an unrefreshed reference point, not a current fair value. A
              disciplined entry would require a verified latest post-money valuation, primary-versus-secondary split,
              liquidation preferences, debt terms, cash balance, and a bridge from installed capacity to paid revenue.
              Without those inputs, a price target or target return would be false precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more decision-useful than a single multiple because the public evidence supports
              operating milestones but not an investable earnings base. The bull case assumes the reported shipment ramp
              converts into repeat, diversified paid programs, capacity installs on schedule, and the market expands as
              forecast; the base case assumes technical execution continues but commercial conversion and margins remain
              unproven; the bear case assumes capital intensity, debt service, construction delay, or customer
              concentration prevents adequate returns. Independent market-research sources identify Amkor, ASE, TSMC,
              Intel, Samsung, and JCET as major advanced-packaging players, while Macrotrends reports an Amkor snapshot
              of US$12.2 billion market capitalization and US$6.318 billion revenue as of February 6, 2026. That roughly
              1.9x ratio is only a scale reference: Amkor is a mature public OSAT, whereas Silicon Box is private and
              its current revenue and profitability remain unverified. No defensible transaction multiple is disclosed
              in the assigned pool. Exit readiness is consequently conditional on audited financial reporting, customer
              references, capacity utilization, and evidence that the Singapore and planned European footprints generate
              acceptable returns on invested capital.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV016
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence round should test price, not just product quality. Request audited 2024–2026 financial
              statements, monthly cash burn and runway, a round-by-round cap table, preference stack, debt agreement and
              covenants, customer-level bookings and production versus pilot mix, gross-margin bridge by package, and
              signed capacity commitments. Track whether the 2028 Singapore capacity-installation and Novara production
              milestones remain on schedule, whether reported unit growth is accompanied by revenue and cash collection,
              and whether the company can finance expansion without a down round or punitive debt refinancing. A thesis
              break occurs if production milestones fail to convert to paid revenue, if customer concentration prevents
              sustainable utilization, if expansion requires materially more capital than disclosed, or if current
              financing terms reveal senior claims that leave common-equity upside below the historical mark.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Decision: track / research-more'
            body: >-
              The evidence supports technical and financing momentum but not a current investable valuation. Re-open the
              recommendation after audited economics and financing terms are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
          - type: callout
            title: Largest valuation risk
            body: >-
              A historical US$1.55B mark has no reliable current revenue or preference-adjusted denominator in the
              assigned evidence, so downside from dilution, debt and a down round cannot be quantified.
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
