    columns: [Rule / exposure, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Advanced semiconductor export controls, United States / extraterritorial scope, "BIS interim final rule effective 2024-12-02", medium, critical, "Map products, tools, customers, and end uses to EAR controls", high, "Obtain export-control classification and restricted-party screening records"]
      - [Government incentives and approvals, Italy / European Union, "Reuters said Commission approval was still needed in 2024", medium, high, "Development agreement and state-aid process are cited by later company material", high, "Verify current aid decision, conditions, clawbacks, and financing"]
      - [Automotive quality and certification, Europe / automotive customers, "Imec reports an IATF 16949 Letter of Conformance and expected full certification", medium, high, "Consortium participation and certification path", medium, "Confirm certificate scope, audit findings, and customer PPAP / reliability acceptance"]
      - [Undisclosed litigation or enforcement, Singapore / cross-border, "No assigned source confirms an incident or enforcement action", unknown, high, "No public evidence in assigned pool", high, "Obtain legal representation letter, litigation search, sanctions review, and material-contract schedule"]
    notes: "Absence of an incident in the assigned sources is not evidence that no incident exists; the final row is an explicit diligence gap."
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and legal exposures identified in the assigned evidence pool through the 2026-10-23 refresh"
    claimRefs: [CR005, CR006, CR008, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty / role, Failure scenario, Severity, Current evidence, Mitigation maturity, Residual exposure, Diligence ask]
    rows:
      - [Automotive ecosystem, "imec ACP and more than 22 consortium partners", "Standards, interoperability, or customer adoption slips", high, "Silicon Box joined ACP; program targets automotive chiplets", medium, high, "Obtain named customer milestones and interoperability test results"]
      - [Italian government and EU support, "Italian ministry / EU state-aid process", "Aid delayed, conditioned, or withdrawn", critical, "Reuters describes government-backed plan; later support claims remain forward-looking", medium, high, "Review executed agreements, conditions, and funding sources"]
      - [Specialized equipment and supply chain, "Semiconductor equipment and materials ecosystem", "Long lead times or export restrictions delay ramp", high, "BIS controls create a relevant external constraint", low, high, "Review supplier concentration, alternate sources, and lead-time buffers"]
      - [Capital providers, "Private investors and debt providers", "Expansion requires more capital or refinancing", critical, "Funding and valuation figures vary across database and investor sources", low, high, "Obtain cap table, debt terms, cash, burn, runway, and committed capex"]
    notes: "Counterparty names and roles are limited to what the assigned sources identify; concentration and contractual protections remain unverified."
    claimRefs: [CR005, CR008, CR009, CR010, CR011]
