callouts:
  - calloutType: risk
    title: Expansion is the principal thesis-break surface
    body: The Italian plant and Singapore capacity plan can increase strategic reach, but construction, capital, incentives, and demand must all arrive together; a delay or funding gap would materially change the risk profile.
    claimRefs: [CR003, CR007, CR009, CR010]
  - calloutType: assumption
    title: No incident finding is not a clean bill of health
    body: The assigned pool contains no confirmed Silicon Box enforcement, outage, or litigation event, but public-source absence does not establish that none exists; legal and compliance diligence remains required.
    claimRefs: [CR013]
