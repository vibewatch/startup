company:
  name: Silicon Box
chapter:
  number: 7
  title: Risks
  summary: Silicon Box has demonstrated meaningful production execution and is building ecosystem credentials, but its risk profile remains dominated by expansion execution, export-control exposure, funding opacity, and dependence on future customer and partner adoption. The evidence supports a high-risk posture with concrete monitoring triggers rather than a claim that any single adverse event has occurred.
sections:
  - id: risk-posture
    title: Risk posture and operating evidence
    body: Silicon Box's strongest risk mitigant is demonstrated manufacturing execution rather than disclosed financial resilience. The company reported shipping 100 million units from its Singapore facility, which began mass production in late 2023, and reported ISO 9001:2015, ISO 14001:2015, and ISO 45001:2018 certifications across 2024 and 2025. These are company-issued statements and do not substitute for independent yield data, customer-level quality data, or audited financial statements. A TDK Ventures investment thesis also identified demonstrated production capability, high yield, technical expertise, and ecosystem building as key conditions for the investment. The main residual concern is that expansion to Italy and full Singapore capacity are forward-looking projects exposed to construction, capital, demand, and government-support risk.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: legal-regulatory
    title: Legal, regulatory, and geopolitical exposure
    body: >-
      The available record shows a live regulatory exposure rather than a disclosed enforcement event. The U.S. Bureau of Industry and Security's December 2024 interim final rule changed controls for advanced computing items, semiconductor manufacturing equipment, foreign-produced direct products, and high-bandwidth memory. For a Singapore-based advanced-packaging company serving AI, HPC, automotive, and other sectors, export classification, customer screening, technology transfer, and diversion controls are material diligence items. The company's own risk disclosure also names adverse legislative or government action, changes in incentives, and geopolitical trends as risks to its European plans. No assigned source establishes that Silicon Box itself has violated a rule; the appropriate conclusion is an unresolved compliance and supply-chain exposure.
    claimRefs: [CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: dependencies-and-triggers
    title: Dependencies, financial model risk, and kill criteria
    body: >-
      Silicon Box's operating model is dependent on a small number of high-consequence milestones: customer qualification and demand, panel-level yield and reliability, suppliers and ecosystem partners, capital availability, and public support for the Italian project. Imec describes its Automotive Chiplet Program as a consortium with more than 22 partners and says Silicon Box is co-developing automotive-grade packages with customers; that is a useful ecosystem signal but not proof of production revenue or customer concentration. Public market and database records are inconsistent on financing and valuation, and the assigned evidence does not provide audited burn, cash, margins, or runway. Investors should therefore monitor measurable milestones and treat missed qualification, repeated quality incidents, export-control restrictions, or funding shortfalls as thesis-break triggers.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
    figureRefs: [FR001]
