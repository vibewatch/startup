callouts:
- calloutType: risk
  title: Anduril is the clearest existential competitor
  body: Anduril combines the funding scale, integrated-defense stack, and public contract proof that Mach
    still lacks. Even when products do not perfectly overlap, Anduril can crowd Mach out of investor mindshare
    and fast-moving Pentagon budgets.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP024
  - CP037
- calloutType: insight
  title: Shield proves buyers will separate software and airframe winners
  body: Shield’s role inside Anduril’s Fury context suggests the market is not strictly winner-take-all.
    Buyers may combine best-of-breed autonomy and airframe vendors, which creates openings for Mach but
    also weakens any single-layer moat.
  claimRefs:
  - CP004
  - CP005
  - CP008
  - CP032
- calloutType: strength
  title: Mach still has a differentiated integration thesis
  body: Most rivals lead in one domain — air defense, software, small UAS, maritime autonomy, or hypersonics.
    Mach’s distinct bet is that one company can integrate vehicles, propulsion, energetics, and distributed
    factories before the market fully settles.
  claimRefs:
  - CP029
  - CP035
  - CP038
- calloutType: risk
  title: Price transparency is too weak to prove an economic moat
  body: Because most peers do not publish list prices or package-level economics, it remains difficult
    to know whether Mach is truly cheaper or merely earlier. This keeps the competitive case narrative-heavy.
  claimRefs:
  - CP030
  - CP031
  - CP039
