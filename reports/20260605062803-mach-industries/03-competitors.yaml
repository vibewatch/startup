- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Competitor / Platform
  - Price / Contract Model
  - Included Capabilities
  - Discount or Unknowns
  - Implication
  rows:
  - - Mach
    - Quote-based / undisclosed
    - Airframe + propulsion + manufacturing narrative
    - No public list price or backlog disclosure
    - Makes direct ROI comparison difficult
  - - Anduril Roadrunner-M
    - Program-specific; no public list price
    - Interceptor air vehicle plus autonomy and recovery logic
    - Contract value public, unit economics not
    - Strong on capability story; weak on public price comparability
  - - Shield AI V-BAT / Hivemind
    - Program-specific; software + hardware combinations
    - Mission autonomy stack plus aircraft and services
    - Software licensing economics undisclosed
    - Can bundle software moat into hardware competition
  - - Skydio X10/X10D
    - Quote-led enterprise/government packages
    - Drone, dock, software, services, regulatory support
    - No clean public defense pricing despite dual-use scale
    - Stronger packaging maturity than Mach for non-strike use cases
  - - AeroVironment Switchblade
    - Program orders and military packaging
    - Loitering munition, control unit, sustainment
    - Public order totals do not reveal unit cost by block
    - Most evidence-rich direct benchmark but still not simple MSRP
  - - Kratos Valkyrie
    - Program / partner-led packaging
    - Aircraft plus mission-system integration
    - No public allied or US list price
    - Competitive only where buyers accept developmental programs
  - - Castelion Blackbeard / hypersonics
    - Framework and program-specific
    - Weapon plus development/test/manufacturing build-out
    - Unit economics undisclosed
    - Adjacent proof that long-range strike buyers tolerate opaque early pricing
  notes: Pricing transparency is poor across the board. Public contract totals matter more than MSRP in
