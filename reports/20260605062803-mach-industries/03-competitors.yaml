- id: switching-costs
  title: 'Switching Costs and Multi-Homing: Government Buyers Are Selective, Not Monogamous'
  body: 'This market is sticky, but not in the way enterprise software is sticky. Buyers rarely face classic
    SaaS lock-in. Instead, switching costs come from test regimes, procurement vehicles, operator retraining,
    software certification, mission data, and the time it takes to requalify a platform under military
    workflows. Those frictions are real, yet multi-homing is clearly possible. The best current example
    is Shield’s autonomy software running in Anduril’s Fury context: the Air Force appears to prefer a
    best-of-breed stack over a single-vendor monopoly. That matters for Mach because it lowers the bar
    for insertion into programs where another prime or autonomy vendor already has a foothold. At the
    same time, it also lowers the bar for competitors to attack any one layer of Mach’s eventual stack.
    In practical terms, distribution power belongs to vendors with approved lists, installed fleets, or
    public orders — not simply to whoever has the most elegant architecture. For Mach, the moat question
    is therefore whether its vertical integration meaningfully reduces deployment friction, not whether
    buyers will ever tolerate two vendors in the same mission chain.'
