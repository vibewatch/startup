  rows:
  - - Anduril
    - Direct + integrated defense stack
    - $61B valuation; $5B Series H (2026)
    - Counter-UAS, autonomy, integrated defense, CCA
    - Roadrunner-M, Lattice, huge capital scale, public Pentagon credibility
    - Very broad stack; does not mirror Mach’s exact product mix one-for-one
  - - Shield AI
    - Direct autonomy / VTOL peer
    - $12.7B valuation; $2B financing package (2026)
    - Mission autonomy, EW-resilient ISR, VTOL military aircraft
    - Hivemind software, V-BAT, X-BAT, Air Force program credibility
    - More software-centric and ISR-heavy than Mach’s munition-centric products
  - - Skydio
    - Adjacent small-UAS leader
    - $4.4B valuation; $110M Series F (2026)
    - Small UAS, ISR, DFR, base security, dual-use government
    - Installed base, Blue UAS, strong manufacturing and distribution footprint
    - Limited overlap with one-way strike and long-range munitions
  - - AeroVironment
    - Direct loitering-munition incumbent
    - Public company; $186M Army order disclosed in 2026
    - Loitering munitions, precision strike, force protection
    - Switchblade combat proof and public contract volume
    - Less compelling on distributed-manufacturing narrative than Mach
  - - Kratos
    - Direct attritable-aircraft peer
    - Public defense prime; Valkyrie/UCCA programs advancing
    - Affordable combat aircraft, loyal wingman, allied teaming
    - Long-range attritable aircraft heritage and allied integration
    - Less breadth across small-UAS, counter-UAS, and manufacturing-platform narrative
  - - Castelion
    - Adjacent long-range strike peer
    - $350M Series B (2025); 500-weapon annual framework claim (2026)
    - Affordable hypersonic strike and scaled manufacturing
    - Pure speed-and-scale long-range deterrence narrative
    - Not an aerial autonomy or counter-UAS competitor today
  - - Saronic
    - Adjacent autonomy manufacturer
    - $1.75B Series D at $9.25B valuation (2026)
    - Maritime autonomy and shipyard-scale manufacturing
    - Massive capital raise and explicit industrial build-out
    - Different domain; limited direct overlap with Mach aircraft
  notes: Profile emphasis is on competitive posture, not only product similarity. Adjacent players remain
    relevant if they compete for the same budgets, talent, or investor narrative.
