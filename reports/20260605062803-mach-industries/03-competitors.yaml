company:
  name: Mach Industries
chapter:
  number: 3
  title: Competitors
  summary: 'Mach competes in a layered field where no single rival matches its full portfolio, but several
    competitors are much stronger on at least one critical dimension: Anduril on capital and integrated
    defense, Shield on autonomy software, AeroVironment on fielded munitions, and Skydio on dual-use distribution.
    The real threat is compositional — better-funded peers can surround Mach product by product while
    adjacent startups erode its uniqueness narrative.'
sections:
- id: landscape
  title: 'Landscape: Direct Rivals Are Fewer Than the Capital Narrative Suggests'
  body: 'Mach is often grouped with every hot defense-autonomy startup, but the true direct set is smaller.
    Anduril, Shield AI, AeroVironment, and Kratos each overlap with meaningful slices of Mach’s market:
    Anduril in interceptors and integrated autonomy; Shield in EW-resilient autonomy and VTOL military
    aircraft; AeroVironment in loitering munitions and public contract proof; Kratos in affordable collaborative
    combat aircraft. Skydio, Saronic, and Castelion are different. They are adjacent more than direct:
    Skydio is a dual-use small-UAS and site-security leader, Saronic is maritime autonomy, and Castelion
    is low-cost hypersonics. Yet these adjacent firms still matter because they absorb the same investor
    enthusiasm, engineering talent, and Pentagon attention that Mach needs to scale. The competitive question
    therefore has two layers. First, who can take the same budget line? Second, who can make Mach’s narrative
    feel less unique even if the product overlap is imperfect? Mach’s field is crowded enough that both
    layers matter.'
