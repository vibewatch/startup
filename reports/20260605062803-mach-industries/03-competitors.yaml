  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Public list prices, software subscription tiers, and package economics for Mach,
      Anduril, Shield, Saronic, Castelion, and Kratos programs.
    whyItMatters: Competitive pricing is central to switching-cost and commoditization analysis, but most
      peers disclose almost nothing beyond financing and occasional contract totals.
    diligencePath: Collect proposal data, contract award unit pricing, reseller quotes, and program-office
      testimony where available.
    relatedQuestionRefs:
    - QP015
    - QP024
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Program-level data on how long certification, retraining, integration, and doctrine
      changes take when a buyer swaps vendors.
    whyItMatters: Without this, moat analysis risks confusing customer inconvenience with genuine procurement
      lock-in.
    diligencePath: Interview operators and program managers on platform replacement cycles and software
      recertification timelines.
    relatedQuestionRefs:
    - QP016
    - QP017
  - type: missing-source
    severity: minor
    topic: helsing
    missingEvidence: Direct official sources with usable product and valuation detail for Helsing that
      are accessible in this run.
    whyItMatters: Helsing matters strategically in European defense AI, but the accessible evidence here
      is too thin to treat it on equal footing with better-documented peers.
    diligencePath: Fetch official press releases or high-confidence reporting once accessible and reassess
      whether it belongs in the direct comp set.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: backlog
    missingEvidence: Comparable public backlog, booked revenue, or unit-delivery metrics across private
      peers.
    whyItMatters: Valuation and production maturity are much easier to compare than actual contracted
      demand, which can distort relative readiness judgments.
    diligencePath: Request backlog and delivery data in diligence or triangulate from budget exhibits
      and government award notices.
    relatedQuestionRefs:
    - QP011
    - QP026
  - type: conflicting-data
    severity: minor
    topic: scope-overlap
    missingEvidence: A normalized product taxonomy that cleanly maps every peer against Mach’s five named
      systems and adjacent categories.
    whyItMatters: Several rivals are adjacent rather than direct, but still compete for some budgets,
      making share and rivalry claims easy to overstate.
    diligencePath: Build product-to-product mapping by mission, buyer, launch mode, payload, and contract
      vehicle rather than by company narrative.
    relatedQuestionRefs:
    - QP019
    - QP020
