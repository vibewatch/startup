  topStrengths:
    - >-
      Mach is operating in a real structural tailwind as Pentagon autonomy, attritable-systems, and counter-UAS budgets
      expand.
    - >-
      Public evidence supports genuine product and factory ambition across strike, counter-UAS, propulsion, and
      distributed manufacturing rather than a single-slide concept.
    - >-
      Army Strategic Strike evidence, African Lion evaluation visibility, and repeated Army references give Mach more
      public customer proof than many defense-autonomy startups at similar age.
    - >-
      The June 2026 Series C and roughly $485 million total raised provide meaningful capital to build facilities, hire
      talent, and pursue production conversion.
    - >-
      Vertical integration through Mach Propulsion, Energetics, and Forge could improve cost and supply resilience if
      execution holds.
  topRisks:
    - >-
      Public sources still do not disclose absolute revenue, backlog, gross margin, burn, runway, or customer
      concentration, so the economic quality of the business remains hard to underwrite.
    - >-
      Mach is trying to industrialize multiple defense hardware lines, facilities, and integrations within roughly three
      years of founding, which creates heavy execution risk.
    - >-
      Customer proof remains concentrated in government and defense-adjacent accounts, with the strongest public
      evidence still centered on Army development and evaluation rather than repeat production orders.
    - >-
      Export-control, autonomous-weapons governance, cyber, and safety scrutiny could slow deployment or compress
      valuation if rules tighten or incidents occur.
    - >-
      The $1.8 billion Series C appears ahead of publicly evidenced revenue and backlog proof, leaving limited margin of
      safety at the headline price.
  unresolvedGaps:
    - No public revenue, ARR, backlog, gross margin, burn, cash-balance, or runway disclosure.
    - >-
      No public cap-table detail, liquidation preferences, board composition, or governance-rights visibility for the
      latest round.
    - No public product-level reliability, yield, cost-per-shot, or facility-utilization metrics for the core systems.
    - No public enumeration of allied customers, non-Army production contracts, or reorder behavior by program.
    - >-
      No public specificity on autonomy safeguards, export classifications, or incident metrics sufficient for clean
      governance underwriting.
