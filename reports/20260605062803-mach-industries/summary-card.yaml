summary:
  headline: >-
    Mach Industries has credible defense-autonomy momentum, real manufacturing ambition, and enough Army-linked proof to
    stay on the radar, but weak revenue-quality disclosure and a stretched $1.8 billion Series C keep the name in TRACK
    rather than buy territory.
