  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis balance
        blocks:
          - type: paragraph
            body: >-
              Mach is attractive enough to monitor closely but not attractive enough to underwrite at the disclosed
              Series C price from public evidence alone. The pro side is real: the company is operating in a defense
              market with strong autonomy and counter-UAS budget support, it has built visible manufacturing capacity
              unusually quickly for a three-year-old company, and it has repeatedly attracted credible capital for a
              hardware-first thesis. Those are not cosmetic signals. They imply that investors and at least some defense
              stakeholders believe the company can matter. The negative side is just as real. Public evidence still does
              not reveal absolute revenue, backlog quality, gross margin, burn, or cap-table terms, and the public
              contract floor is tiny relative to a $1.8 billion mark. Governance and autonomy-policy scrutiny also
              remain material. Put differently, Mach looks strategically relevant and financially under-disclosed at the
              same time, which supports a TRACK recommendation with medium confidence, high risk, and a stretched
              valuation stance.
            claimRefs:
