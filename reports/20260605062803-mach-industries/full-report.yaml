      - number: '4.2'
        title: 'Unit Economics: Vertical Integration May Help, But It Also Raises the Fixed-Cost Base'
        blocks:
          - type: paragraph
            body: >-
              Mach’s public financial logic is manufacturing-heavy. The company is adding facilities, buying constrained
              suppliers, building a jet-engine operation, and scaling test infrastructure before it has disclosed the
              metrics that normally justify those moves. TechCrunch’s Exquadrum coverage is therefore especially
              important: it argues that the acquisition improves unit economics across Mach’s platforms at the precise
              moment the company begins to scale. That logic is plausible. Controlling solid rocket motors, energetics
              testing, and micro-jet production should reduce supplier markups and lead-time risk. But the same decision
              also adds 85 employees, a 70,000-square-foot Victorville footprint, test infrastructure, and more
              working-capital burden. Sacra’s estimate that products cost under $20 million to develop with roughly
              three-year maturation cycles suggests management thinks platform creation can be repeated many times
              before any one product fully monetizes. That is a venture-manufacturing model, not a mature production
              one. It can work, but it requires both patient capital and repeatable conversion from development to
              volume delivery.
