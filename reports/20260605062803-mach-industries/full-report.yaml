            body: >-
              The clearest public trust artifact is not a security white paper, but the supplier quality manual. It
              formalizes a purchase-order and quality-code regime that explicitly references ISO, AS9100, and FAR /
              DFARS expectations, and it imposes concrete controls around revision discipline, change approval,
              inspection, testing, nonconformance handling, counterfeit prevention, foreign-object-debris prevention,
              sub-tier flow down, and right of access for Mach, customers, and regulators. In other words, the company
              has published a real supplier-control framework rather than vague “quality matters” language. That helps
              on manufacturing diligence, but it does not fully answer system-safety diligence. Public product materials
              still provide very little on autonomy release criteria, operator override concepts, or safety-case
              documentation for strike and counter-strike systems. External watchdog and incident-monitoring sources
              therefore matter: they do not disprove Mach’s technical claims, but they show that autonomous weapons
