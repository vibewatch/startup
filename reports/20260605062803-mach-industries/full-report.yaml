  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What supports it
      - What would change the view
    rows:
      - - Thesis
        - >-
          Defense autonomy and counter-UAS budgets are expanding fast enough to support continued option value in the
          category.
        - DAWG, Replicator, and FY2026 autonomy / C-UAS reporting all point to a stronger demand backdrop.
        - Tailwind weakens if budgets or procurement priorities shift away from affordable mass and counter-UAS.
      - - Thesis
        - Mach has built real manufacturing and vertical-integration surfaces faster than most startups of similar age.
        - >-
          Forge, Mach Propulsion, Exquadrum, and Heven / Nominal partner evidence all point to serious industrial
          intent.
        - The view weakens if utilization, yield, or repeat production evidence fails to appear.
      - - Thesis
        - Mach can repeatedly attract capital for a capital-intensive defense thesis.
        - >-
          Series B, Series C, and the oversubscribed raise show access to venture capital even for manufacturing-heavy
          programs.
        - This matters less if a future round arrives before economics or backlog quality improve.
      - - Anti-thesis
        - Revenue quality remains opaque.
        - >-
          No public source reviewed discloses absolute revenue, backlog, margin, burn, or cash despite the step-up in
          valuation.
        - Disclosure of program revenue, backlog, and gross margin would materially improve underwriting.
      - - Anti-thesis
        - Public contract proof is thin relative to the valuation.
        - The visible federal award floor remains small versus the current headline mark.
        - Visible repeat production contracts or sizable disclosed backlog would reduce this gap.
      - - Anti-thesis
        - Autonomy-governance and execution risk can still compress value quickly.
        - >-
          OECD, HRW, and UN sources show category-level scrutiny, while factory ramp adds fixed-cost and safety
          exposure.
        - A documented control framework plus clean operating metrics would soften the valuation discount rate.
    notes: >-
      The table balances the strongest evidence-backed positives against the clearest reasons not to underwrite the
      current price today.
