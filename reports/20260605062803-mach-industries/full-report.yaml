      - number: '7.4'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              People risk at Mach is less about headline turnover and more about organizational stretch. The company is
              only about three years old by the 2026 run date, yet it is simultaneously operating multiple vehicle
              programs, integrating a sizeable acquisition, building manufacturing infrastructure, and hiring across
              engineering, manufacturing, software, quality, and operations. Media coverage also remains highly
              founder-centric: Ethan Thornton is still the easiest named executive for outside stakeholders to map to
              strategy, fundraising, and product ambition. That is an asset when momentum is positive, but it also
              creates key-person risk if execution slips, government relationships wobble, or internal delegation lags
              the scope of the build-out. The Exquadrum deal adds another layer because leadership integration matters
              as much as facility integration. Meanwhile, the supplier manual makes clear that Mach's execution burden
              extends into sub-tier oversight, meaning internal headcount alone is not the whole story. The residual
              question is whether the management system is maturing as fast as the product and factory narrative.
