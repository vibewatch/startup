  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Model: Publicly Visible Streams Exist, But Revenue Quality Is Mostly Opaque'
        blocks:
          - type: paragraph
            body: >-
              Mach is not a software company with transparent recurring revenue. Public evidence points instead to a
              blended hardware and manufacturing model built around direct government program sales, allied defense
              sales, component and subsystem sales through Mach Energetics and Mach Propulsion, and partner
              manufacturing utilization through Forge. Sacra explicitly frames the business around three revenue
              streams, while TechCrunch supplies the most provocative but least verified financial datapoint: Thornton’s
              claim that current revenue is split 50/50 between government and sales to other companies. That statement
              is directionally useful because it suggests Mach is not purely dependent on a single contracting channel.
              But it is still far from underwritable. No public source in this run provides absolute revenue, customer
              concentration, ARR, backlog, or collections data. The only hard public government revenue floor in hand is
              the $1.5 million Strategic Strike award visible in USAspending. Everything else points to potential
              revenue quality, not proven recurring economics.
