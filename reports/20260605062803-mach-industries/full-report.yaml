companyProfile:
  summary: >-
    Mach Industries is a Huntington Beach defense manufacturer founded in 2023 by Ethan Thornton to build asymmetric
    aerospace and defense systems at industrial scale. The company publicly markets a broad stack spanning Viper, Glide,
    Stratos, Pike, Dart, Energetics, Mach Propulsion, and the Forge decentralized manufacturing network. Public traction
    is strongest in Army-linked Strategic Strike work, Army field evaluation activity, and manufacturing partnerships
