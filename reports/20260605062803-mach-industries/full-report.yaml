      - number: '1.3'
        title: Capital Stack, Investor Conviction, and Industrial Scaling Narrative
        blocks:
          - type: paragraph
            body: >-
              Mach’s funding history explains why it is now treated as one of the fastest-scaling defense startups in
              the market. TechCrunch reports a $5.7 million Sequoia-led seed in 2023 and a $79 million Bedrock-led
              Series A later that year, while the June 2025 Series B added $100 million from Khosla Ventures and
              Bedrock. The June 2026 Series C then brought in $300 million at a $1.8 billion valuation, led by Infinite
              Capital and Ribbit Capital, with Bedrock, Sequoia, and Khosla continuing on the cap table. That sequence
              implies extraordinary investor confidence in a very capital-intensive category. It also finances an
              explicitly industrial plan: Forge Huntington already exists at 115,000 square feet; management says four
              more production facilities should come online by year-end 2026; and Mach Propulsion targets 12,000 engines
              of annual capacity. The Exquadrum acquisition fits the same logic, because owning solid rocket motor
              capability reduces supply-chain dependence at a time when propulsion remains a bottleneck across defense
              aerospace. This chapter’s strongest positive evidence is not traditional software-style revenue
              disclosure; it is the consistency of investor and manufacturing expansion signals across multiple
              independent sources.
