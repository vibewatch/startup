      - number: '2.4'
        title: 'Growth Drivers: Affordable Mass, Ukraine Lessons, and Procurement Reform'
        blocks:
          - type: paragraph
            body: >-
              The fastest-growing demand drivers are all visible in public policy and warfighting language. Replicator
              framed the problem as countering Chinese mass with thousands of attritable autonomous systems. Drone
              Dominance turned that into a steady procurement signal for over 200,000 lethal drones. RAND, AFRL, and War
              on the Rocks all emphasize a similar point from different angles: the future buyer is not paying for
              exquisite perfection, but for systems that are cheap enough to lose, fast enough to replace, and resilient
              enough to operate under electronic warfare pressure. That logic lifts Mach because the company is
              explicitly selling distributed manufacturing and speed-to-production, not just one platform. At the same
              time, Army and Air Force experimentation around PBAS, company-level sUAS, XQ-67A, and CCA indicates that
              buyers are no longer debating whether attritable autonomy matters; they are deciding how to organize,
              fund, and scale it. In market terms, that is a meaningful shift from experimentation demand to
              institutional demand. It does not guarantee contract conversion, but it does make the category
              structurally more durable than it was even two years ago.
