      - number: '1.2'
        title: Founder Centrality and Thin Public Governance
        blocks:
          - type: paragraph
            body: >-
              Mach’s public identity is highly founder-centric. Thornton is not only the founder and CEO; he is
              effectively the company’s operating narrative, fundraising face, and product strategist in every
              independent article reviewed. TechCrunch anchors the familiar MIT-dropout-at-19 storyline, while the
              Series C reporting still describes him as a 22-year-old founder running a three-year-old business. That
              founder charisma has clearly helped the company recruit capital and attention, but it also creates
              concentration risk because Mach discloses far less about its broader leadership bench than mature defense
              manufacturers usually would. Mach Propulsion’s Jeremy Klyde is the most clearly named operating executive
              outside Thornton, and the company says it has added senior technical and government-engagement leaders,
              but those hires are not publicly enumerated. Public materials also do not disclose the board, committee
              structure, or governance rights of lead investors. The result is a company with strong external momentum
              but relatively weak public visibility into succession depth, operating cadence beneath the founder, and
              investor control mechanics.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO032
              - CO039
