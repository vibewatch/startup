      - number: '2.2'
        title: 'Sizing Lenses: Official Budget Lines Are More Actionable Than Analyst TAMs'
        blocks:
          - type: paragraph
            body: >-
              The strongest public demand signal for Mach’s market is not a consultant slide; it is the Pentagon budget.
              The FY2026 request included $13.4 billion for autonomous systems and $3.1 billion for counter-UAS, while
              FY2027 stepped up again to $53.6 billion for autonomy, drone platforms, and contested logistics plus
              another $21 billion for munitions, counter-drone technologies, and advanced systems. Those figures do not
              map perfectly to Mach’s products, but they clearly show that autonomy and drone warfare have become budget
              categories, not pilot projects. Analyst reports then add texture rather than truth. StartUs estimates the
              military drones market at $22.81 billion by 2030, while other drone-adjacent estimates expand far higher
              when services, software, and critical-infrastructure demand are included. The same divergence appears in
              loitering munitions and counter-UAS reports: some models are conservative and narrowly military, while
              others include broader civilian infrastructure protection or more expansive platform definitions. For
              valuation and market work, that means official appropriations define the most credible demand floor, while
              analyst reports define the outer envelope and the uncertainty band.
