chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Core Product Thesis
        blocks:
          - type: paragraph
            body: >-
              Mach Industries is a Huntington Beach defense manufacturer founded in 2023 around Ethan Thornton’s claim
              that the United States needs faster, cheaper, and more distributed production of unmanned strike systems.
              Public materials consistently frame the business as a vertically integrated builder of asymmetric
              aerospace and defense systems, not just a drone startup or software vendor. The homepage, Forge materials,
              and 2026 financing announcement all present the same thesis: Mach wants to own enough of propulsion,
              energetics, airframes, and production infrastructure to compress the cycle from design to deployment. The
              product set now spans five named vehicles — Viper, Glide, Stratos, Dart, and Pike — which together cover
              one-way strike, high-altitude sensing, counter-drone interception, and munition delivery. This breadth is
              important because it means Mach is selling a manufacturing-and-platform stack rather than a single hero
              product. The key diligence question is not whether the company has ambition; it clearly does. The question
              is whether the publicly visible evidence already supports the transition from rapid prototype house to
              scaled production company.
