      - number: '6.4'
        title: 'Retention and durability: what is still missing'
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public record becomes thin. There is no disclosed NRR, GRR, cohort retention,
              renewal rate, customer satisfaction score, reference-call program, or even a public list of follow-on
              order values by account. The best public continuity signal is simply that the Army appears multiple times
              in different contexts: contract award, later award modifications, and a separate field-evaluation setting.
              That does not establish classic retention. It only suggests that the relationship was not one-and-done
              within the visible record. The same caution applies to Air Force and SOCOM. Their names appear in 2025 and
              2026 sources, but public materials still do not show whether those were pilot users, funded programs, test
              participants, or scaled operators. As a result, any durability conclusion must remain conservative. The
              right public answer is not to backfill fake percentages, but to mark the metrics as null and specify the
              diligence asks that would convert this chapter from customer-proof analysis into true retention analysis.
