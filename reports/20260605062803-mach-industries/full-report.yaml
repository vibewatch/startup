      - number: '7.5'
        title: Financial Model Risk, Mitigations, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Mach has enough capital to move fast, but not enough public operating disclosure to make that speed
              low-risk. By June 2026 the company had disclosed roughly $485 million of capital raised and a $1.8 billion
              valuation, and the use-of-funds language is explicit: expand Forge, stand up Mach Propulsion, advance
              second-generation systems, and deepen defense relationships. What remains missing is the model that
              connects those inputs to durable economics. Public sources still do not show revenue, backlog, burn, gross
              margin, or customer concentration. Even the most interesting datapoints — the claimed 50/50 government
              versus other-company revenue mix and the assertion that Exquadrum improves unit economics — are
              management-reported rather than independently validated. That leaves the core investment risk in a
              familiar defense-startup pattern: valuation and capex have already scaled, while production proof and
              economics disclosure lag. The right monitoring posture is therefore trigger-based. A serious safety or
              compliance event, a stalled conversion from development work to visible orders, or a funding round that
              arrives before proof points improve would all change the underwriting case materially.
