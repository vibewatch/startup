  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation depends on balancing real scale signals against thin economic disclosure and persistent policy
      risk.
    data:
      nodes:
        - id: n1
          label: Market tailwind
          description: DoD autonomy and counter-UAS budgets remain supportive.
        - id: n2
          label: Manufacturing proof
          description: Forge, propulsion, Energetics, and partner-use signals are real.
        - id: n3
          label: Customer / contract proof
          description: Public order floor is still limited relative to valuation.
        - id: n4
          label: Economic disclosure
          description: Revenue, backlog, margin, burn, and round terms remain private.
        - id: n5
          label: Policy and execution burden
          description: Autonomy scrutiny and factory-ramp risk keep the discount rate high.
        - id: n6
          label: TRACK / stretched
          description: Interesting company, insufficient public support for current entry price.
      edges:
        - from: n1
          to: n6
          label: supports interest
        - from: n2
          to: n6
          label: supports interest
        - from: n3
          to: n6
          label: still too thin
        - from: n4
          to: n6
          label: blocks conviction
        - from: n5
          to: n6
          label: raises discount rate
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV027
      - CV028
      - CV029
      - CV043
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Illustrative valuation delta versus the proof-constrained base case, shown in USD billions.
    approximationNotes: >-
      These bars are scenario deltas, not market marks, and are intended to show which variables would move underwriting
      most.
    data:
      items:
        - label: Repeat production backlog becomes visible
          value: 0.6
        - label: Revenue disclosure > $100M
          value: 0.5
        - label: Factory utilization / yield proof
          value: 0.3
        - label: Gross-margin transparency
          value: 0.2
        - label: Next financing before proof
          value: -0.6
        - label: Material autonomy / safety event
          value: -0.8
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV041
      - CV046
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario ranges show that the current price sits above the public-evidence base case and below a still-demanding
      bull case.
    approximationNotes: >-
      Ranges are 2028E scenario estimates based on current public facts and comparison lenses, not forecasts supplied by
      management.
    data:
      items:
        - label: Bear case
          low: 0.4
          mid: 0.65
          high: 0.9
        - label: Base case
          low: 1.2
          mid: 1.6
          high: 2
        - label: Current Series C
          low: 1.8
          mid: 1.8
          high: 1.8
        - label: Bull case
          low: 2.5
          mid: 3.2
          high: 4
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style snapshot of where Mach is strong, where evidence is thin, and why entry discipline matters.
    data:
      items:
        - label: Market tailwind
          value: 4 / 5
          detail: Budget and autonomy demand backdrop is strong.
        - label: Manufacturing proof
          value: 3 / 5
          detail: Real facilities and integration exist, but throughput is undisclosed.
        - label: Customer proof
          value: 2 / 5
          detail: Public contract floor is thin versus current valuation.
        - label: Revenue transparency
          value: 1 / 5
          detail: No public revenue, backlog, margin, or burn disclosure.
        - label: Financing capacity
          value: 4 / 5
          detail: Series B and Series C show repeat capital access.
        - label: Competitive position
          value: 3 / 5
          detail: Interesting niche, but peers have stronger proof or scale.
        - label: Governance / policy burden
          value: 1 / 5
          detail: Autonomy-policy scrutiny remains meaningful.
        - label: Entry attractiveness
          value: 2 / 5
          detail: Current price looks stretched relative to public proof.
    claimRefs:
      - CV005
      - CV010
      - CV011
      - CV014
      - CV021
      - CV028
      - CV029
      - CV043
      - CV046
