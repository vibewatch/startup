      - number: '4.3'
        title: 'Capital Adequacy: Mach Has Raised Enough to Scale Aggressively, Not Enough to Skip Proving Revenue'
        blocks:
          - type: paragraph
            body: >-
              The public funding record shows why Mach can move this quickly. The SEC Form D tied to the 2025 raise
              shows a roughly $102 million exempt offering, which lines up with the reported Series B. By June 2026 the
              company had raised $300 million more at a $1.8 billion valuation, taking total disclosed capital to
              roughly $485 million across seed, Series A, Series B, and Series C. Those are serious resources for a
              three-year-old defense manufacturer, and the use-of-funds language is consistent across announcements:
              build Forge, expand Mach Propulsion, deepen government relationships, hire aggressively, and accelerate
              product development. But capital adequacy is still different from financial adequacy. Public sources do
              not disclose cash on hand, monthly burn, debt obligations, or runway. They do disclose a
              115,000-square-foot Huntington Beach facility, four more planned production facilities, a 12,000-engine
              annual propulsion target, and a 70,000-square-foot Victorville acquisition. In other words, the visible
              cash demands are obvious while the visible cash buffer is not. That makes financing dependency a key part
              of the underwriting story.
