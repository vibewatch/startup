  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Residual-risk matrix ranking Mach's main exposures by likelihood and severity after visible mitigations.
    data:
      columns:
        - Low residual
        - Medium residual
        - High residual
        - Critical residual
      rows:
        - label: High likelihood
          values:
            - Privacy compliance drift
            - Hiring bottlenecks
            - Factory ramp miss
            - Contract proof lags valuation
        - label: Medium likelihood
          values:
            - IP / FTO dispute
            - Airport-authority limits
            - Export-license friction
            - Counter-UAS underperformance
        - label: Low likelihood
          values:
            - 'Single public enforcement action identified: none'
            - Heven utilization miss
            - Founder departure
            - Hazardous-process safety event
    approximationNotes: >-
      Quadrant placement is qualitative and reflects residual exposure after publicly visible mitigations, not
      probabilistic modelling.
    claimRefs:
      - CR006
      - CR018
      - CR023
      - CR033
      - CR042
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Directed graph showing how compliance, execution, concentration, and financing risks cascade into delivery,
      margin, fundraising, and valuation outcomes.
    data:
      nodes:
        - id: r1
          label: Export / autonomy rule shock
        - id: r2
          label: Operational failure or safety event
        - id: r3
          label: Thin public order conversion
        - id: r4
          label: Capex outruns economics proof
        - id: r5
          label: Delivery delay
        - id: r6
          label: Margin compression
        - id: r7
          label: Financing stress
        - id: r8
          label: Valuation impairment
        - id: r9
          label: Customer / regulator friction
      edges:
        - from: r1
          to: r9
          label: slows approvals and procurement
        - from: r2
          to: r5
          label: halts or delays production
        - from: r2
          to: r7
          label: adds remediation cost
        - from: r3
          to: r7
          label: weakens financing narrative
        - from: r3
          to: r8
          label: valuation outruns proof
        - from: r4
          to: r6
          label: fixed costs rise first
        - from: r4
          to: r7
          label: pulls forward next raise
        - from: r5
          to: r6
          label: inefficiency and rework
        - from: r5
          to: r8
          label: missed milestones hit confidence
        - from: r6
          to: r8
          label: economics de-rate
        - from: r7
          to: r8
          label: downround / dilution risk
        - from: r9
          to: r3
          label: fewer buyers convert
    approximationNotes: Edges are qualitative causal paths rather than weighted scenarios.
    claimRefs:
