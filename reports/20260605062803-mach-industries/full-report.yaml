      - number: '3.5'
        title: 'Moat Durability: Crowding, Commoditization, and the Burden of Proof'
        blocks:
          - type: paragraph
            body: >-
              The most adverse competitor evidence is not a lawsuit or failed product; it is the sheer intensity of the
              field. Breaking Defense captured this in the CCA category, where Anduril and General Atomics were already
              trading public shots before their aircraft had meaningfully entered service. That is a warning sign for
              Mach. It suggests defense-autonomy markets now attract enough money and policy attention that narrative
              advantage decays quickly. If airframes, warheads, and components commoditize faster than trust,
              distribution, and manufacturing scale, then Mach’s vertical integration could be a real moat. But if
              better-funded firms can match vertical claims while holding more public contract proof, then Mach’s
              current differentiation compresses into a story about future speed rather than present dominance. The
              upside case is still credible because Mach spans multiple categories. The risk case is equally credible
              because the category leaders are farther ahead on evidence than on imagination. Until Mach publishes more
              production, customer, and program detail, competitors retain the easier burden of proof.
            claimRefs:
