            body: >-
              Taken together, the public record shows a company moving quickly from concept claims toward a more layered
              operating base, but not yet one with full product transparency. Viper / Strategic Strike has the strongest
              evidence of funded development, disclosed mission parameters, and recurring flight activity. Dart has a
