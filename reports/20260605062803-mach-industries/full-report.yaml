      - number: '3.3'
        title: 'Scale, Distribution, and Public Proof: The Leaders Already Have What Mach Is Trying to Build'
        blocks:
          - type: paragraph
            body: >-
              The biggest competitive disadvantage for Mach is not that its products are obviously inferior; it is that
              several rivals already possess pieces of the maturity stack Mach is still assembling. Anduril has the
              valuation and capital base to fund integrated autonomy, counter-UAS, and manufacturing simultaneously.
              Shield has a software stack credible enough that the Air Force allowed it to sit inside a competitor’s
              aircraft program. Skydio has the installed base, manufacturing rhetoric, and dual-use footprint that turn
              product announcements into channel leverage. AeroVironment has public Army orders and a combat-proven
              loitering-munition brand. Saronic has raised $1.75 billion to industrialize a different domain but one
              driven by the same national-security spending cycle. Even Castelion’s rapid test-and-scale narrative
              competes for the same policy appetite around affordable deterrence. Mach’s opportunity is that no rival
              covers all of its categories at once. Its problem is that the best-funded competitors already dominate at
              least one maturity dimension — capital, fielding, installed base, or public contract proof — and those
              dimensions often determine trust faster than raw technical possibility.
