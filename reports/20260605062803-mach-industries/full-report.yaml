      - number: '6.5'
        title: Expansion vectors and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Mach does have visible expansion paths beyond its initial Army foothold, but each comes with concentration
              or proof-quality caveats. The first path is horizontal service-branch expansion through Air Force, SOCOM,
              and now a reported DIU / Navy program. The second is geographic expansion through allied governments and
              the foreign-observer surface created by African Lion. The third is payer diversification via Forge and
              partner manufacturing, where Heven provides a named example. The problem is that nearly all of these paths
              are still less evidentiary than the Army anchor. No allied country is named publicly. No non-Army contract
              value is disclosed. No top-customer share or backlog mix is visible. And because Mach's products sit in
              autonomous strike and counter-drone categories, governance scrutiny from HRW, the UN, and the OECD could
              create extra procurement review, export friction, or reputational drag around broader adoption. The result
              is a customer story with real momentum but meaningful concentration risk: Mach looks much closer to a
              U.S.-defense-concentrated adoption curve than to a diversified multi-segment revenue base.
