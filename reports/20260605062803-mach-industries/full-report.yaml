          detail: African Lion 26 is the clearest official evaluation surface
        - label: Named non-Army military organizations
          value: 2
          unit: logos
          detail: Air Force and SOCOM are named, but public proof remains statement-level
        - label: Named external OEM / factory customer
          value: 1
          unit: partner
          detail: HevenDrones is the clearest named Forge customer
        - label: Public retention metrics disclosed
          value: 0
          unit: metrics
          detail: No NRR, GRR, churn, renewal, or cohort data reviewed
        - label: Named allied governments disclosed
          value: 0
          unit: countries
          detail: Allied customers are mentioned only in aggregate
