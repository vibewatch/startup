      - number: '3.2'
        title: 'Direct Product Competition: Each Mach System Meets a Different Rival'
        blocks:
          - type: paragraph
            body: >-
              No single competitor matches Mach across Viper, Glide, Stratos, Dart, and Pike. Instead, the threat is
              compositional. Roadrunner-M is the clearest analogue to Mach Dart because it targets the same counter-air
              and interceptor logic, while doing so with a reusable turbojet vehicle and a public $250 million contract
              reference point. Shield AI competes differently: V-BAT and X-BAT emphasize autonomy software, EW-resilient
              ISR, and runway-independent operations rather than one-way munitions alone. AeroVironment’s Switchblade
              family is the most mature loitering-munition benchmark and provides the public contract validation that
              Mach still lacks. Kratos’ Valkyrie and the broader collaborative-aircraft field matter most for Viper and
              the larger runway-independent strike narrative. Skydio is less relevant for expendable strike but highly
              relevant wherever dual-use ISR, base security, and EW-resilient small UAS are the procurement path.
              Castelion and Saronic mainly pressure the long-range-strike and defense-manufacturing narrative rather
              than matching Mach aircraft system for system.
