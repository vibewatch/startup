  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Mach Sits in a Narrow, Defense-First Slice of the Drone Economy'
        blocks:
          - type: paragraph
            body: >-
              Mach should not be analyzed against the entire global drone market. The relevant boundary is much
              narrower: attritable strike aircraft, loitering munitions, counter-UAS systems, and the enabling
              manufacturing stack that allows those systems to be produced in useful volume. That means consumer drones,
              agricultural spraying, parcel delivery, and most general commercial robotics are poor comparables despite
              sharing airframe components or autonomy software. The official DoD language around Replicator, Drone
              Dominance, and attritable systems points toward a market defined by cost-effective mass, replacement
              speed, and wartime utility rather than by hobbyist or enterprise drone adoption. For Mach specifically,
              the adjacent categories that matter are the ones where a military buyer is paying for strike effects,
              resilient navigation, layered counter-drone defense, or rapidly reconfigurable production. This is why
              broad TAM figures can mislead: they often lump together segments with radically different buyers, legal
              regimes, and supply-chain economics. The better approach is to anchor on program-level military demand
              signals first, then use analyst market reports as upper and lower bounds instead of as direct proxies for
              Mach’s actual serviceable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM019
