  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Rivals Are Fewer Than the Capital Narrative Suggests'
        blocks:
          - type: paragraph
            body: >-
              Mach is often grouped with every hot defense-autonomy startup, but the true direct set is smaller.
              Anduril, Shield AI, AeroVironment, and Kratos each overlap with meaningful slices of Mach’s market:
              Anduril in interceptors and integrated autonomy; Shield in EW-resilient autonomy and VTOL military
              aircraft; AeroVironment in loitering munitions and public contract proof; Kratos in affordable
              collaborative combat aircraft. Skydio, Saronic, and Castelion are different. They are adjacent more than
              direct: Skydio is a dual-use small-UAS and site-security leader, Saronic is maritime autonomy, and
              Castelion is low-cost hypersonics. Yet these adjacent firms still matter because they absorb the same
              investor enthusiasm, engineering talent, and Pentagon attention that Mach needs to scale. The competitive
              question therefore has two layers. First, who can take the same budget line? Second, who can make Mach’s
              narrative feel less unique even if the product overlap is imperfect? Mach’s field is crowded enough that
              both layers matter.
