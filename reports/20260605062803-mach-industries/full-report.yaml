      - number: '8.2'
        title: Financing context and whether the price is publicly supported
        blocks:
          - type: paragraph
            body: >-
              The financing context is clear enough to describe but not clear enough to bless. Mach filed a Form D in
              2025, raised $100 million in the Series B at a reported $470 million valuation, and then jumped to a
              reported $300 million Series C at $1.8 billion in mid-2026. The new round appears to have been popular and
              oversubscribed, which shows real venture demand for defense manufacturing narratives. But headline price
              support is weaker than fundraising demand. Public disclosures do not show the terms needed to convert
              headline valuation into a true entry price, and they do not show the revenue base needed to compare that
              price cleanly with public or private comps. The result is a valuation that may be reasonable if Mach is
              already on a path to repeat production and nine-figure revenue, but may be aggressive if the business is
              still fundamentally pre-scale and contract-light. Today the evidence supports the latter uncertainty more
              than the former certainty.
