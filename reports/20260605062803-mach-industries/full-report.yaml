      - number: '1.4'
        title: Contracts, Partnerships, and the Move from Prototype to Production
        blocks:
          - type: paragraph
            body: >-
              The contract and partner evidence suggests Mach has moved beyond pure concept-stage status, though not all
              flagship claims are equally corroborated. Strategic Strike is the clearest program because it appears in a
              Mach press release, multiple defense publications, and USAspending records. Together those sources support
              a developmental Army effort focused on a vertical-takeoff cruise missile with 290-kilometer range and a
              10-kilogram-plus warhead. The company’s customer narrative broadens from there: Nominal says Mach supports
              Army, Air Force, and SOCOM programs, while an Army African Lion 26 article confirms Mach systems are
              already showing up inside real-world military experimentation. TechCrunch adds a more ambitious claim — a
              DIU contract to develop the Navy’s runway-independent strike aircraft — but that program still lacks the
              kind of direct DIU or NAVAIR source that would move it from credible to fully verified. Partnerships with
              HevenDrones, Divergent, and Nominal reinforce the operational picture. They show Mach using outside
              specialists in hydrogen UAS, digital airframe manufacturing, and test infrastructure to accelerate
              programs while still trying to keep the core industrial stack inside Forge, Mach Propulsion, and Mach
              Energetics.
