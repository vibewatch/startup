      - number: '4.5'
        title: 'Financial Verdict: Credible Capital Access, Low Public Revenue Quality, High Diligence Burden'
        blocks:
          - type: paragraph
            body: >-
              The public record supports one clear conclusion: Mach can raise capital. It does not yet support the
              stronger conclusion that Mach has already proven durable economics. There are enough signals to believe
              the company has a plausible revenue model — government contracts, allied demand, component sales, and
              partner-manufacturing work — and enough industrial signals to explain why investors wrote large checks.
              But almost every underwriting metric that matters remains private. There is no public gross margin, no
              monthly burn, no cash balance, no working-capital disclosure, no customer concentration, and no product
              pricing schedule. The 50/50 revenue-mix claim is interesting but not enough. As a result, this chapter’s
              financial verdict is intentionally split. On capital access and strategic fundraising, Mach looks strong.
              On revenue quality, margin path, and ability to self-fund growth, public evidence is still weak. The next
              major inflection will be whether production-scale contracts and disclosed operating results begin to
              replace financing announcements as the company’s main proof point.
