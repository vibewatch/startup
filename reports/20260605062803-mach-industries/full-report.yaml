  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Next financing before proof improves
        - Another large round arrives before disclosed revenue, backlog, or margin proof improves materially.
        - Signals the valuation case is still funding-led rather than economics-led.
        - Pause underwriting and reset expected entry price lower.
      - - Production conversion miss
        - Prototype or development wins fail to turn into visible repeat orders or meaningful backlog.
        - Breaks the argument that factories and integration are compounding into durable demand.
        - Downgrade the thesis from scale story to expensive experiment.
      - - Safety or autonomy-governance incident
        - A material event, investigation, or public controversy hits one of Mach's systems or facilities.
        - Raises discount rate and can impair customer adoption, exportability, and fundraising.
        - Move to avoid until root cause and mitigation are documented.
      - - Facility utilization or yield miss
        - Forge, propulsion, or Energetics assets remain visibly underused or operationally unstable.
        - Undercuts the vertical-integration thesis and increases fixed-cost burden.
        - Re-cut the scenario range toward the bear case.
      - - Policy or export shock
        - New autonomy, export, or allied-procurement restrictions materially narrow addressable demand.
        - Shrinks option value and lengthens time to revenue realization.
        - Treat the current round as over-earning its narrative premium.
      - - Founder / execution disruption
        - Key-person or integration issues materially slow program cadence or customer conversion.
        - Weakens confidence that Mach can manage many concurrent bets at once.
        - Increase risk rating and require stronger operating evidence before re-entry.
    notes: >-
      Each trigger is monitorable from future diligence materials or public reporting and is designed to change the
      recommendation faster than a normal quarterly update.
    claimRefs:
      - CV029
      - CV041
      - CV042
      - CV045
