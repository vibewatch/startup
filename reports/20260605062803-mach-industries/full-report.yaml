      - number: '6.3'
        title: Adoption trajectory from award to production language
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence traces a plausible progression even though the company does not publish account
              counts. The sequence begins with the Army award in 2024. By early 2025, the company and third-party
              outlets were discussing initial flight-test milestones and Forge as the manufacturing base behind Viper
              and Glide. By mid-2025, Series B materials claimed an expanded customer footprint across Army, Air Force,
              SOCOM, and allied governments. In March 2026, Nominal described a workflow running from early flight
              testing through high-rate production at Forge, which matters because it connects customer-facing delivery
              credibility to the test infrastructure needed for repeat execution. In April and May 2026, African Lion
              moved part of the Stratos-related story into field evaluation. By June 2026, TechCrunch and Washington
              Technology were describing five active vehicle programs, production expected on at least three, and even
              an adjacent DIU / Navy account. The pattern is not proof of scaled repeat buying, but it is stronger than
              a single contract headline and supports an adoption-trajectory thesis built around successive proof
              surfaces.
