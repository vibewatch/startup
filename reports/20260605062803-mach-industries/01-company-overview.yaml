callouts:
- calloutType: strength
  title: Unusually fast industrial scaling for a three-year-old defense startup
  body: Mach already combines a 115,000-square-foot California facility, a propulsion division targeting
    12,000 engines annually, and a $300 million Series C war chest. That is a much heavier industrial
    footprint than most startups at a similar age.
  claimRefs:
  - CO013
  - CO014
  - CO021
  - CO031
- calloutType: risk
  title: Founder-led narrative still outruns public governance disclosure
  body: Thornton is clearly the company’s anchor operator, fundraiser, and storyteller, but public materials
    do not yet show the board, broader executive roster, or formal governance guardrails that would normally
    underpin a billion-dollar defense manufacturer.
  claimRefs:
  - CO003
  - CO039
  - CO040
- calloutType: risk
  title: Commercial proof remains the soft spot in the overview story
  body: The strongest public evidence is on capital, contracts, and manufacturing ambition. The weakest
    public evidence is on named commercial customers and auditable economics, especially for the claimed
    50/50 government-commercial revenue mix.
  claimRefs:
  - CO024
  - CO035
- calloutType: risk
  title: Category backlash could matter before economics fully mature
  body: Even without a direct Mach safety incident, the company is building inside a policy environment
    where the UN, Human Rights Watch, and OECD-linked monitors are all escalating concern about lethal
    autonomy and the proliferation of autonomous strike systems.
  claimRefs:
  - CO041
  - CO042
  - CO043
