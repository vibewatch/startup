  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Named board members, formal governance rights, and a current executive roster beyond
      Ethan Thornton and Jeremy Klyde.
    whyItMatters: Key-person risk is impossible to underwrite cleanly when the public bench is this thin
      and no governance structure is visible.
    diligencePath: Request the latest board deck or cap-table governance summary and confirm current officers,
      board seats, and any observer rights.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Auditable breakout of government versus commercial revenue and a named commercial
      customer list.
    whyItMatters: The 50/50 mix materially affects concentration, working-capital, and valuation assumptions,
      but today rests on founder commentary alone.
    diligencePath: Obtain a revenue bridge by customer type plus top-customer concentration and recent
      invoices or booking schedules.
    relatedQuestionRefs:
    - QO020
  - type: missing-source
    severity: minor
    topic: capital-structure
    missingEvidence: Public evidence of debt facilities, venture debt, secondaries, or structured preferred
      terms beyond headline round announcements.
    whyItMatters: Capital structure can materially change downside protection and dilution even when headline
      valuation looks attractive.
    diligencePath: Review round documents, any UCC filings, and investor-side disclosures for debt, secondaries,
      and liquidation preferences.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: diu-navy
    missingEvidence: A direct DIU or Navy source that independently confirms the runway-independent strike
      aircraft award scope, value, and timeline.
    whyItMatters: The program is strategically important to the overview narrative, but today the clearest
      public description comes from founder-linked reporting rather than a government release.
    diligencePath: Monitor DIU, NAVAIR, and DoD award notices and request an unclassified statement of
      work or award announcement.
    relatedQuestionRefs:
    - QO017
  - type: private-evidence-only
    severity: minor
    topic: facilities
    missingEvidence: Addresses, square footage, and commissioning dates for the four additional production
      facilities expected in 2026.
    whyItMatters: Factory rollout pace is central to Mach’s scale thesis and directly informs whether
      manufacturing targets are plausible.
    diligencePath: Request facility list, lease or permit documentation, and current production ramp plans
      by site.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO004
