- id: milestones-and-adverse-context
  title: Milestones, External Critique, and What Remains Unproven
  body: 'Mach’s milestone arc is unusually compressed: founded in 2023, seed and Series A in its first
    year, a disclosed Army developmental contract in 2024, a $100 million Series B in 2025, and a $300
    million Series C at $1.8 billion in 2026. That pace is impressive, but it also means the public record
    is still much stronger on vision, production intent, and investor enthusiasm than on mature operating
    disclosure. The most important open issue is commercial proof. Thornton’s 50/50 government-commercial
    revenue mix is directionally encouraging because it suggests Mach is not a single-channel contractor,
    yet the company has not publicly named commercial buyers or published auditable revenue support. The
    second major issue is category risk. Human Rights Watch, UN officials, and the OECD AI Incidents Monitor
    all point to the legal, ethical, and reputational pressure building around increasingly autonomous
    strike systems. None of the sourced material shows a direct sanction, lawsuit, or safety incident
    involving Mach itself by the run date, but the company is clearly operating in a segment where policy
    backlash could become material before its economics are fully visible.'
