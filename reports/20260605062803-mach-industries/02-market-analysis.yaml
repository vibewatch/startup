- id: buyers-and-adoption
  title: 'Buyers, Users, and Payers: Military Program Offices Still Dominate'
  body: 'The core buyer set for Mach-like systems is military and quasi-military, not civilian enterprise.
    Army maneuver units want small UAS, attritable effects, and strike systems by echelon; Air Force autonomy
    offices want collaborative and attritable aircraft; Navy and SOCOM buyers want expeditionary strike,
    base defense, and ISR that can survive contested environments; and allied ministries follow those
    demand signals. Even in counter-UAS, the most urgent spend still clusters around military bases, force
    protection, borders, ports, and national-security sites. CRS, GAO, and market reports all reinforce
    that budget ownership is concentrated in service program offices, RDT&E lines, procurement appropriations,
    and federal authorities rather than in decentralized commercial buyers. Critical-infrastructure demand
    matters, but legal restrictions on active mitigation and the political sensitivity of lethal autonomy
    make that adjacency much less straightforward for Mach than it might be for a pure sensor or site-security
    vendor. The adoption path also remains long: budgets become solicitations, prototypes, tests, initial
    fielding, and then — only sometimes — programs of record or repeatable procurement. This is why Mach’s
    current market is large but not frictionless.'
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM024
  - CM033
  - CM034
