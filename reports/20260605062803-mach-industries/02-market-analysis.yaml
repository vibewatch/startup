  evidenceGaps:
  - type: missing-source
    severity: material
    topic: mach-specific-sam
    missingEvidence: A public source that cleanly maps Mach’s precise mix of loitering strike, HAPS surveillance,
      counter-UAS, and distributed manufacturing into one serviceable addressable market.
    whyItMatters: The broad drone TAM is real, but it overstates what Mach can capture without clearer
      category boundaries and procurement pathways.
    diligencePath: Build a bottoms-up SAM from program-level procurement lines, ally demand, and named
      platform categories rather than analyst TAMs.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: material
    topic: market-estimate-divergence
    missingEvidence: Harmonized methodology across loitering munition and counter-UAS market reports so
      estimates can be compared apples-to-apples.
    whyItMatters: Current market reports vary by multiples because they include different geographies,
      adjacent services, and civilian demand assumptions.
    diligencePath: Normalize each report to year, geography, included categories, and end users before
      using it in valuation or share analysis.
    relatedQuestionRefs:
    - QM008
    - QM010
  - type: private-evidence-only
    severity: minor
    topic: allied-demand
    missingEvidence: Program-level allied procurement plans for long-range strike drones, HAPS, and counter-UAS
      that align directly with Mach’s product mix.
    whyItMatters: International demand likely matters to the upside case, but public sources do not separate
      broad rearmament from Mach-relevant categories.
    diligencePath: Compile FMS announcements, allied defense budgets, and procurement white papers focused
      on attritable strike and persistent ISR.
    relatedQuestionRefs:
    - QM026
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: Open pricing or contract-unit-cost data for attritable aircraft, loitering munitions,
      and layered counter-UAS systems.
    whyItMatters: Adoption depends on cost-per-effect and replenishment math, but public sources still
      emphasize budget toplines rather than unit economics.
    diligencePath: Collect unit-cost disclosures from program hearings, budget exhibits, and contract
      award notices where available.
    relatedQuestionRefs:
    - QM014
    - QM017
  - type: private-evidence-only
    severity: minor
    topic: commercial-adjacency
    missingEvidence: Evidence on how much non-defense critical-infrastructure demand is practically open
      to a lethal-autonomy-focused supplier like Mach.
    whyItMatters: Counter-UAS and infrastructure defense expand the TAM on paper, but the actual overlap
      with Mach’s current positioning is unclear.
    diligencePath: Interview buyers in ports, energy, and base-security adjacent segments to test willingness
      to buy from a defense-first vendor.
    relatedQuestionRefs:
    - QM025
