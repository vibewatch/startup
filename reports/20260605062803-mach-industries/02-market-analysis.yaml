- id: constraints
  title: 'Constraints: Taxonomy Confusion, Legal Friction, and Industrial Bottlenecks'
  body: 'The bullish case for Mach’s market still has material constraints. First, taxonomy is poor: official
    budgets, analyst reports, and procurement categories are not aligned, so any single TAM figure risks
    false precision. Second, legal and policy restrictions remain important, especially in counter-UAS.
    GAO and Fortune both point to limits on jamming, spoofing, cyber takeover, and domestic deployment
    outside a handful of federal authorities. Third, industrial readiness is uneven. War on the Rocks
    argues the United States could use existing plastics, motor, and automotive assembly capacity to scale
    drone production, but the same piece identifies batteries and printed circuit boards as serious chokepoints.
    Fourth, battlefield conditions impose their own constraint: autonomy that fails under GPS denial,
    electronic warfare, or rapid adaptation cycles will not matter no matter how large the top-line budget
    looks. Finally, the market still lacks clean pricing transparency, especially for attritable airframes
    and layered counter-UAS stacks. That means adoption velocity depends not only on strategic urgency
    but on whether vendors can prove replenishment math, not just prototype performance.'
