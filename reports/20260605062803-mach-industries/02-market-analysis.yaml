callouts:
- calloutType: insight
  title: Budget lines matter more than broad TAMs
  body: The most credible public demand signal for Mach’s market is the official US budget line for autonomy
    and counter-UAS. Commercial TAM reports are useful only as boundary markers because they disagree
    too much on scope to stand alone.
  claimRefs:
  - CM005
  - CM006
  - CM019
- calloutType: risk
  title: Market estimates are directionally bullish but methodologically inconsistent
  body: Loitering munition estimates range from roughly $2B to more than $6B depending on what the report
    includes. Investors who do not normalize geography, buyer type, and adjacent services will overstate
    serviceable market size.
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM019
- calloutType: strength
  title: Affordable mass is becoming a structural procurement doctrine
  body: 'Replicator, Drone Dominance, Army unmanned mandates, and AFRL’s genus aircraft experiments all
    point to the same market shift: the buyer increasingly wants systems that can be replenished fast,
    not merely demonstrated once.'
  claimRefs:
  - CM003
  - CM011
  - CM028
  - CM033
  - CM038
- calloutType: risk
  title: Legal and industrial frictions still slow real adoption
  body: Counter-UAS authorities remain narrow outside four federal agencies, and even optimistic industrial-scale
    arguments still rely on batteries, PCBs, and navigation resilience that are not yet trivial to secure.
