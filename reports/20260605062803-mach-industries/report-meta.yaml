companyProfile:
  summary: >-
    Mach Industries is a Huntington Beach defense manufacturer founded in 2023 by Ethan
    Thornton to build asymmetric aerospace and defense systems at industrial scale. The
    company publicly markets a broad stack spanning Viper, Glide, Stratos, Pike, Dart,
    Energetics, Mach Propulsion, and the Forge decentralized manufacturing network. Public
    traction is strongest in Army-linked Strategic Strike work, Army field evaluation
    activity, and manufacturing partnerships such as HevenDrones and Nominal, while recent
    financing gives Mach unusually large capital access for a three-year-old company. The key
    underwriting problem is that Mach's public narrative is far richer than its public
    economics: revenue, backlog, margins, concentration, governance, and preference terms all
    remain substantially undisclosed relative to the $1.8 billion Series C headline.
  founders:
    - name: Ethan Thornton
      role: Founder & CEO
      background: Dropped out of MIT at age 19 to start Mach Industries.
      claimRefs: [CO003, CO004]
  foundingLocation: Huntington Beach, CA
  headquarters: Huntington Beach, CA
  productSummary: >-
    Mach sells and develops attritable strike and loitering systems (Viper, Glide, Pike),
    high-altitude communications and sensing platforms (Stratos), counter-UAS interceptors
    (Dart), propulsion and energetics capability, and the Forge manufacturing network meant to
    retool and scale production across Mach products and partner programs.
  customerFocus: >-
    U.S. defense organizations led by the Army, plus the Air Force, SOCOM, allied
    governments, and defense OEM or manufacturing partners that need scalable attritable,
    autonomous, or counter-drone capability.
  businessModel: >-
    Direct government and allied defense sales for Mach-developed systems, plus component,
    propulsion, energetics, and contract-manufacturing revenue through vertically integrated
    facilities and Forge partner production.
  stage: Series C private company
  fundingStatus: >-
    Raised a $300 million Series C in June 2026 at a $1.8 billion valuation; public sources
    indicate roughly $485 million of total funding across seed through Series C.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO013, CO014, CO021, CU003, CU038, CI008, CI014, CE001, CE008]
summary:
  headline: >-
    Mach Industries has credible defense-autonomy momentum, real manufacturing ambition, and
    enough Army-linked proof to stay on the radar, but weak revenue-quality disclosure and a
    stretched $1.8 billion Series C keep the name in TRACK rather than buy territory.
