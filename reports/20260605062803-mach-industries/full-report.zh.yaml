  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑平衡
        blocks:
          - type: paragraph
            body: >-
              Mach 足够值得密切跟踪，但仅凭公开证据，还不足以按已披露 Series C 价格投资。正面因素是真实的：公司所在国防市场有强劲自主和反 UAS
              预算支持；作为一家约三年历史的公司，它以罕见速度建出可见制造产能；它也反复为硬件优先投资逻辑吸引到可信资本。这些不是表面信号。它们意味着投资人和至少部分国防利益相关方相信公司会有分量。负面也同样真实。公开证据仍不披露绝对收入、积压订单质量、毛利率、烧钱速度或股权结构条款，而公开合同底座相对
              $1.8B 估值很小。治理和自主政策审查也仍然重要。换句话说，Mach 同时具备战略相关性和财务披露不足，这支撑一个“观察”建议：中等置信度、高风险、估值偏高。
