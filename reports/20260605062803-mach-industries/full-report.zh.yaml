  - id: TE001
    title: 产品模块 / 资产矩阵
    description: Publicly named Mach product lines and what is visible about their role and maturity.
    columns:
      - 产品 / 资产
      - 主要用户 / 任务
      - 公开成熟度 / 状态
      - 差异化
      - 尽调缺口
    rows:
      - - Viper / Strategic Strike
        - 需要远程打击、又没有固定发射架基础设施的陆军机动部队
        - 已获资助的研发项目，并有公开飞行测试证据
        - 垂直起飞打击概念，试图把类似巡航导弹的射程与战术部署灵活性拼在一起
        - 具体推进配置、导引头栈、安全释放逻辑和列装时间表仍未披露
      - - Glide
        - 需要低成本远程精确打击的作战方
        - 已公开命名的产品，但只有高层级任务描述
        - 定位为滑翔弹药，而不是有动力可重复使用飞行器
        - 未看到公开射程、载荷、制导或飞行测试证据
      - - Stratos
        - 需要从平流层提供通信、感知或效应的用户
        - 处于活跃研发，并有陆军演习评估信号
        - 高空伪卫星概念，可从距发射点数千英里外部署
        - 未披露公开续航、载荷质量、回收概念或环境包线
      - - Pike
        - 需要大批量部署模块化分布式弹药的部队
        - 已公开命名的产品，但披露仍停在概念阶段
        - 围绕低成本和大规模模块化部署来定位
        - 未看到公开导引头、战斗部、射程或测试状态细节
      - - Dart
        - 面对无人机蜂群的基地、机场、仓库和机动编队
        - 已能飞行的研发系统，目标是在 2026 年实现战区拦截
        - 围绕内部雷达和低成本拦截器搭建的「探测到交战」反无人机层
        - 未披露拦截器成本、再装填负担或已验证杀伤概率数据
      - - Energetics
        - 需要战斗部 / 含能输入的内部项目和防务供应链
        - 公共产品界面列出的类别，但没有单独文档
        - 暗示致命系统子组件的垂直整合更深
        - 未看到公开产品清单、认证基线或鉴定数据
