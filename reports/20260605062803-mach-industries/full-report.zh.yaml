  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品覆盖面与客户工作流定义
        blocks:
          - type: paragraph
            body: >-
              对于一家 2023 年成立的公司，Mach 的公开产品覆盖面异常宽。官网点名六个产品家族——Viper、Glide、Stratos、Pike、Dart 和
              Energetics——并用任务语言描述它们，而不是把它们说成抽象 R&D
              项目。这个框架重要，因为公司展示的不是单一无人机或导弹，而是一组围绕不同作战任务搭建的组合：垂直起飞打击、滑翔式精确效果、平流层持续存在、模块化可消耗弹药、反 UAS
              拦截，以及能够支撑致命系统的含能基础。Viper 的公开作战概念最清晰，第三方报道将其与陆军 Strategic Strike 努力联系起来，并给出已披露航程和战斗部要求。Dart
              是公开报道中第二具体的产品，因为 Mach
              已描述从探测到交战的架构和预期的蜂群防御角色。组合中的其他产品，在公开层面仍更多由类别和预期用途定义，而不是数据手册级性能细节；这意味着买家故事看得懂，但投资数据包仍很薄。
