      - number: '5.4'
        title: 信任、质量与控制环境
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开信任材料不是安全白皮书，而是供应商质量手册。它正式建立了一套采购订单与质量代码制度，明确引用 ISO、AS9100 和 FAR / DFARS
              预期，并围绕版本纪律、变更批准、检验、测试、不合格处理、防伪、防外来物碎屑、下级供应商向下传递，以及
              Mach、客户和监管方访问权施加具体控制。换句话说，公司发布了真实的供应商控制框架，而不是泛泛说「质量很重要」。这有助于制造尽调，但不能完全回答系统安全尽调。公开产品材料对自主能力放行标准、操作员接管概念，或打击与反打击系统的安全论证文档仍披露很少。因此，外部监督和事故监测来源很重要：它们没有推翻
              Mach 的技术主张，但说明自主武器治理已经成为这类产品公司的风险面的一部分。
