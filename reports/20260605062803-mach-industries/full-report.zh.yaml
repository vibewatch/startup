      - number: '3.2'
        title: 直接产品竞争：每个 Mach 系统都遇到不同对手
        blocks:
          - type: paragraph
            body: >-
              没有单一竞争对手能横跨 Viper、Glide、Stratos、Dart 和 Pike 与 Mach 对齐。威胁是组合式的。Roadrunner-M 是 Mach Dart
              最清晰的类比对象，因为它瞄准同样的防空和拦截逻辑，同时采用可复用涡喷载具，并有公开 $250 million 合同作为参照。Shield AI 的竞争方式不同：V-BAT 和 X-BAT 强调自主软件、抗 EW
              ISR 和不依赖跑道的作业，而不只是单程弹药。AeroVironment 的 Switchblade 系列是最成熟的巡飞弹基准，也提供 Mach 仍缺少的公开合同验证。Kratos 的 Valkyrie
              和更广泛的协同飞机领域，对 Viper 和更大的不依赖跑道打击叙事最重要。Skydio 与一次性打击关系较弱，但在军民两用 ISR、基地安防和抗 EW 小型 UAS
              成为采购路径的场景中高度相关。Castelion 和 Saronic 主要施压的是远程打击和防务制造叙事，而不是逐一匹配 Mach 的飞机系统。
