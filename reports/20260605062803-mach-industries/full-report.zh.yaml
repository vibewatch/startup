        title: 留存和耐久性：还缺什么
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录变薄的地方。没有披露
              NRR、GRR、队列留存、续约率、客户满意度、参考访谈项目，甚至没有按账户列出的后续订单金额公开清单。最好的公开连续性信号只是陆军在不同语境中多次出现：合同奖项、后续奖项修改，以及单独的野外评估场景。这不能建立经典意义上的留存，只能说明，在可见记录里，这段关系不是一次性。空军和
              SOCOM 也要同样谨慎。它们的名字出现在 2025 和 2026
              年来源里，但公开材料仍看不出它们是试点用户、受资助项目、测试参与者，还是规模化运营方。因此，任何耐久性结论都必须保守。正确的公开答案不是回填虚假的百分比，而是把指标标为
              null，并明确哪些尽调问题能把本章从客户证明分析推进到真正的留存分析。
