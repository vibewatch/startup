  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开防务客户旅程从需求发现走到授标、测试、野外评估、初始生产，之后才是复购或盟友扩张。
    data:
      nodes:
        - label: 需求发现
          detail: 当美国防务买方需要比传统主承包商更快交付远程打击、平流层感知或蜂群防御时，Mach 似乎最先出现。
          tone: neutral
        - label: 原型 / 开发合同
          detail: Strategic Strike 合同是最清晰的公开证据，说明买方已从兴趣进入获资助的开发工作。
          tone: positive
        - label: 试飞证据
          detail: 之后公开报道转向设计冻结、垂直起飞和早期飞行里程碑，用来建立买方信心。
          tone: positive
        - label: 野外评估
          detail: African Lion 把证据推进到士兵使用和采购建议循环，比单纯实验室测试更强。
          tone: positive
        - label: 生产工业化
          detail: Nominal 加 Forge 的表述显示，下一个关口是制造和测试严谨度能否支撑可重复产出。
          tone: warning
        - label: 复购 / 项目转入
          detail: 到这一步，公开证据转弱：没有披露的复购金额、队列数据或可持续续约指标。
          tone: risk
        - label: 盟友 / 跨军种扩张
          detail: 空军、SOCOM、盟友政府和 DIU / Navy 线索暗示扩张路径，但每条路径仍需要更强证据。
          tone: warning
        - label: 合作伙伴制造循环
          detail: Forge 可赢得 Heven 等外部 OEM 需求，即便终端用户证据滞后，也能形成第二条扩张循环。
          tone: positive
    approximationNotes: 阶段反映公开证据面，而非披露的内部 CRM 工作流。它们概括了已审阅来源所暗示的客户转化和扩张方式。
