      - number: '8.3'
        title: 乐观、基准、悲观区间逻辑
        blocks:
          - type: paragraph
            body: >-
              最适合理解的场景区间，是围绕证明转化做期权价值算账，而不是做精确 DCF。公开公司参考显示，一旦收入披露且装备落地真实，AeroVironment、Kratos
              这类规模化国防硬件公司可以维持中个位数到高个位数销售倍数。Red Cat 这类小型无人机纯标的在增长爆发时能交易到更高倍数，但那些估值仍落在实际收入底座上。Mach
              尚未公开提供这个底座，所以当前轮次实质上要求投资人为尚未披露的证据预付价格。基准情景因此低于本轮名义估值，因为部分生产转化和利用率进展可信但未被证明。乐观情景只有在 Mach
              迅速把制造野心转化为重复合同、披露收入规模和改善单位经济性时才成立。悲观情景不是归零，但会很严厉，因为如果证明之前再次融资，就会暴露今天估值中有多少来自叙事，而不是经济性。
