      - number: '7.3'
        title: 合作伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险在 Mach 故事里格外核心，因为公司试图在披露广泛公开合同基础之前证明规模。USAspending 显示真实陆军奖项，但也凸显，相对 $1.8B
              估值，可见的联邦底座仍然很薄。这让集中度成为现实问题：公开买方故事仍主要是陆军、更广的美国国防关系、盟国，以及少量合作伙伴证明。运营上，几个外部节点已经卡在关键路径上。Nominal
              被定位为从早期飞行测试到高速率生产的测试与运营基础设施。Heven 证明 Forge 能吸引外部制造工作，但也说明合作伙伴利用率假设很重要。Exquadrum 则指出 Mach
              垂直整合的底层原因：关键推进和含能材料产能稀缺，当前推进策略仍处在过渡期。换句话说，垂直整合减少了一类依赖，同时又创造了另一类执行依赖，落在设施、许可、数据系统，以及把政府关系转化为耐久订单上。
