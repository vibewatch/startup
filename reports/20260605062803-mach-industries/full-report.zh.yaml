          - type: paragraph
            body: >-
              公开融资记录解释了 Mach 为什么能如此快速推进。2025 年融资所用的 SEC Form D 显示大约 $102 million 豁免发行，与报道中的 Series B 对得上。到 2026 年 6
              月，公司又以 $1.8 billion 估值融资 $300 million，使种子轮、Series A、Series B 和 Series C 的累计披露资本达到约 $485
              million。对一家成立三年的防务制造商来说，这是相当重的资源；历次公告里的资金用途表述也一致：建设 Forge、扩张 Mach
              Propulsion、深化政府关系、积极招聘并加速产品开发。但资本充足不同于财务充足。公开来源没有披露手头现金、月度烧钱、债务义务或现金跑道。它们披露的是 115,000 平方英尺 Huntington
              Beach 设施、四个规划新增生产设施、12,000 台发动机年产目标，以及 70,000 平方英尺 Victorville
              收购资产。换句话说，可见现金需求很清楚，可见现金缓冲却不清楚。因此，融资依赖是投资判断故事里的关键部分。
