      - number: '4.4'
        title: 同业参照：Mach 价格低于品类领导者，但仍然激进
        blocks:
          - type: paragraph
            body: >-
              只看表面估值，Mach 似乎比最大的防务自主公司便宜。Anduril 目前为 $61 billion，Shield 为 $12.7 billion，Saronic 为 $9.25 billion，Skydio 为
              $4.4 billion。因此，$1.8 billion 的 Mach
              并没有试图跨过最成熟品类领导者的同一估值门槛。但这个比较是双向的。许多同业要么有更多公开合同证明，要么披露规模更大，要么装机基础证据更强。Mach
              的较低价格部分反映了这个差距。同时，对于一家没有披露收入、利润率或现金流数据的公司，这仍是一个激进估值。公开投资人还无法判断，Mach
              的估值是相对潜力保守，还是相对证据过早。最强的支持估值论点是，市场在为工业速度和稀缺供应链控制权付费。最弱的论点是，市场已经看到了足以支撑十亿美元以上制造业倍数的收入质量。
