      - number: '1.4'
        title: 合同、合作伙伴，以及从原型走向生产
        blocks:
          - type: paragraph
            body: >-
              合同和合作伙伴证据显示 Mach 已经越过纯概念阶段，不过并非所有旗舰主张都有同等佐证。Strategic Strike 是最清晰的项目，因为它同时出现在 Mach 新闻稿、多家防务媒体和 USAspending
              记录中。这些来源合在一起，支撑了一个陆军开发项目：垂直起飞巡航导弹，航程 290 kilometer，战斗部超过 10 kilogram。公司的客户叙事由此扩展：Nominal 称 Mach 支持陆军、空军和
              SOCOM 项目；陆军 African Lion 26 文章则确认 Mach 系统已经出现在真实军事试验中。TechCrunch 又加入一个更有野心的说法——DIU
              合同，用于开发海军不依赖跑道的打击飞机——但该项目仍缺少直接 DIU 或 NAVAIR 来源，无法从可信推进到完全验证。与 HevenDrones、Divergent 和 Nominal
              的合作强化了运营图景。Mach 借助外部专家的氢动力 UAS、数字机体制造和测试基础设施加速项目，同时仍试图把核心工业栈留在 Forge、Mach Propulsion 和 Mach Energetics 内部。
