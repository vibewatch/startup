      - number: '4.5'
        title: 财务结论：资本获取可信，公开收入质量低，尽调负担高
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个明确结论：Mach 能融资。它还不支持更强的结论——Mach
              已经证明耐久经济性。信号足够让人相信公司有一个合理收入模型：政府合同、盟国需求、组件销售和合作伙伴制造工作；工业信号也足够解释投资人为什么开大额支票。但几乎所有关键投资指标仍是私有信息。没有公开毛利率、月度烧钱、现金余额、营运资本披露、客户集中度或产品定价表。50/50
              收入结构说法有意思，但不够。因此，本章财务结论有意拆成两半。看资本获取和战略融资，Mach
              很强。看收入质量、利润率路径和自我供血增长能力，公开证据仍弱。下一个重大拐点，是规模化生产合同和披露的运营结果能否开始取代融资公告，成为公司主要证明点。
