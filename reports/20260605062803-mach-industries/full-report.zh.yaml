      - number: '2.5'
        title: 约束：分类混乱、法律摩擦与工业瓶颈
        blocks:
          - type: paragraph
            body: >-
              Mach 市场的乐观情景仍有实质约束。第一，分类很差：官方预算、分析师报告和采购类别并不对齐，任何单一 TAM 数字都有虚假精确的风险。第二，法律和政策限制仍然重要，尤其是在反 UAS 领域。GAO 和
              Fortune 都指出，干扰、欺骗、网络接管，以及少数联邦授权机构之外的国内部署受到限制。第三，工业准备度不均衡。War on the Rocks
              认为，美国可以利用现有塑料、发动机和汽车装配产能来扩大无人机生产；但同一篇文章也把电池和印刷电路板列为严重卡点。第四，战场条件自带约束：如果自主能力在 GPS
              拒止、电子战或快速适应周期下失效，无论总预算数字多大都没有意义。最后，市场仍缺少清晰定价透明度，尤其是可消耗式机体和分层反 UAS
              栈。因此，采用速度不仅取决于战略紧迫性，还取决于供应商能否证明补充账算得过来，而不只是原型性能好看。
