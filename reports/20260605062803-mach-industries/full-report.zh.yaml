  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 证明改善前再融资
        - 披露收入、订单储备或利润率证明明显改善前，又出现一轮大额融资。
        - 说明估值逻辑仍由融资驱动，而不是由经济性驱动。
        - 暂停承销，把预期入场价下调。
      - - 生产转化不达标
        - 原型或开发阶段订单未能转成可见的重复订单或有意义的订单储备。
        - 削弱工厂和集成能力正在复利成持久需求的论点。
        - 把投资逻辑从规模化故事下调为昂贵实验。
      - - 安全或自主治理事件
        - Mach 的某套系统或设施出现重大事件、调查或公开争议。
        - 抬高折现率，并可能拖累客户采用、出口能力和融资。
        - 在根因和缓解措施形成文件前回避。
      - - 设施利用率或良率不达标
        - Forge、推进或 Energetics 资产仍明显利用不足，或运营不稳定。
        - 削弱垂直整合逻辑，并增加固定成本负担。
        - 把情景区间向悲观情景重切。
      - - 政策或出口冲击
        - 新的自主系统、出口或盟友采购限制大幅收窄可服务需求。
        - 压缩期权价值，并拉长收入兑现时间。
        - 将当前轮次视为叙事溢价兑现过度。
      - - 创始人 / 执行中断
        - 关键人或整合问题显著拖慢项目节奏或客户转化。
        - 削弱 Mach 同时管理多条下注的可信度。
        - 提高风险评级，并在重新入场前要求更强运营证据。
    notes: 每个触发因素都可通过未来尽调材料或公开报道跟踪，设计目的都是比常规季度更新更快地改变推荐结论。
    claimRefs:
      - CV029
      - CV041
      - CV042
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 收入与订单储备衔接
        - 按项目拆分的过去 12 个月收入、订单储备和头部客户集中度。
        - 用来判断 $1.8B 是否锚定真实需求，还是只锚定期权价值。
        - CFO / 财务资料室请求。
      - - 毛利率与单元经济性
        - 按产品、部件和制造服务流拆分的毛利率，以及良率和报废数据。
        - 用来判断垂直整合是利润率杠杆，还是主要变成资本开支负担。
        - 运营 + 财务尽调会议。
      - - 股权结构表与轮次条款
        - 股数、优先股条款、清算堆叠、投资人权利和期权池影响。
        - 用来把名义估值翻译成真实入场价和下行清算堆叠。
        - 法务 / 律师融资文件。
      - - 工厂利用率与吞吐量
        - Forge、推进和 Energetics 的利用率、吞吐量、交付周期和质量指标。
        - 用来检验工业雄心是否转成可重复产出。
        - 制造 KPI 材料包和现场走访。
      - - 客户转化
        - 具名重复订单、生产合同，以及开发项目带来的收入兑现。
        - 用来把 Mach 从故事股推进到可承销的运营公司。
        - 商业 / 项目管理尽调。
      - - 治理与出口管制
        - 自主系统发布规则、出口矩阵、事件日志和安全升级流程。
        - 用来框定政策、合规和声誉冲击带来的下行。
        - 总法律顾问 / 安全负责人审查。
    notes: 这些问题刻意保持简短，并直接连到决策；若能清掉这些问题，推荐结论的重估幅度会超过再增加主题性市场评论。
    claimRefs:
      - CV007
      - CV008
      - CV030
      - CV040
      - CV042
