        - 报价制 / 未披露
        - 机体 + 推进 + 制造叙事
        - 无公开标价或积压订单披露
        - 直接比较 ROI 很难
      - - Anduril Roadrunner-M
        - 按项目定价；无公开标价
        - 拦截飞行器，加自主和回收逻辑
        - 合同金额公开，单位经济性不公开
        - 能力故事强；公开价格可比性弱
      - - Shield AI V-BAT / Hivemind
        - 按项目定价；软件 + 硬件组合
        - 任务自主栈，加飞行器和服务
        - 软件许可经济性未披露
        - 可把软件护城河打包进硬件竞争
      - - Skydio X10/X10D
        - 报价主导的企业 / 政府套装
        - 无人机、机库、软件、服务、监管支持
        - 虽有军民两用规模，但没有清晰公开的防务定价
        - 非打击用例的打包成熟度强于 Mach
      - - AeroVironment Switchblade
        - 项目订单和军方打包
        - 巡飞弹、控制单元、保障
        - 公开订单总额不披露分批次单位成本
        - 证据最丰富的直接标杆，但仍不是简单 MSRP
      - - Kratos Valkyrie
        - 项目 / 合作伙伴主导打包
        - 飞行器加任务系统集成
        - 无公开盟国或美国标价
        - 只有买方接受开发型项目时才有竞争力
      - - Castelion Blackbeard / 高超声速
        - 框架协议和按项目定价
        - 武器加开发 / 测试 / 制造扩建
        - 单位经济性未披露
        - 相邻案例显示，远程打击买方能接受早期定价不透明
    notes: 全行业定价透明度都差。这个市场里，公开合同总额比 MSRP 更重要。
