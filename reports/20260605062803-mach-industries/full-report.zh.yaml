        - 自主能力从试点资金转入结构性预算类别
        - 跟踪预算附表，确认哪些科目真正可由 Mach 覆盖
      - - Drone Dominance 超过 200k 的采购信号
        - 驱动因素
        - 2025-2027
        - 为小型致命无人机和工业化扩产释放需求信号
        - 评估采购机制更利好既有厂商还是新进入者
      - - 乌克兰和红海经验
        - 驱动因素
        - 持续
        - 让低成本打击和分层反无人机在作战上变得紧迫
        - 梳理哪些冲突经验对应 Mach 产品，哪些只对应相邻细分市场
      - - 陆军师级无人化指令
        - 驱动因素
        - 2025-2026
        - 将小型 UAS 和可消耗效应制度化到各级编队
        - 跟踪采购是否从备忘录转为持续订单
      - - 可负担规模化力量设计
        - 驱动因素
        - 持续
        - 利好能快速补充并重建库存的供应商
        - 验证 Mach 是否真能扩到管理层目标
      - - 集成式 AI 赋能反无人机栈
        - 驱动因素
        - 持续
        - 利好把感知、C2 和处置结合起来的平台
        - 澄清 Mach 会停留在平台制造商，还是扩展到分层防御软件
      - - 干扰和本土处置的法律限制
        - 约束
        - 已在发生
        - 限制非联邦反无人机采用，并拖慢民用相邻市场
        - 监测成文法变化和联邦授权下放
      - - 电池和 PCB 的工业瓶颈
        - 约束
        - 已在发生
        - 即使需求和资本都强，也可能限制补充速度
        - 索取关键子部件的供应商图谱和交期
      - - GPS 受限 / EW 韧性要求
        - 约束
        - 已在发生
        - 抬高工程负担，也可能淘汰原本便宜的系统
        - 审查导航、RF 韧性和故障安全表现的测试证据
      - - 分类口径和市场报告分歧
        - 约束
        - 长期存在
        - 如果不统一范围，估值和 TAM 主张会站不稳
        - 在测算份额或增长前，先统一每个市场来源的口径
    notes: 表中同时放入预算驱动、作战紧迫性、法律约束和工业瓶颈，因为这四类因素都会影响真实采用速度。
