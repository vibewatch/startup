      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Mach 的人员风险不太是高管流失新闻，而更是组织拉伸。截至 2026
              年报告日，公司只有约三年历史，却在同时运营多个飞行器项目、整合一笔规模不小的收购、建设制造基础设施，并在工程、制造、软件、质量和运营岗位上招聘。媒体报道也仍高度围绕创始人展开：对外部利益相关方来说，Ethan
              Thornton 仍是最容易对应到战略、融资和产品野心的具名高管。势头向上时，这是资产；但如果执行打滑、政府关系摇晃，或内部授权跟不上建设范围，它也会形成关键人风险。Exquadrum
              交易又加了一层，因为领导层整合与设施整合同样重要。同时，供应商手册明确显示，Mach 的执行负担会延伸到次级供应商监督，也就是说，内部员工数并不是全部。剩下的问题是，管理系统成熟速度能否追上产品和工厂叙事。
