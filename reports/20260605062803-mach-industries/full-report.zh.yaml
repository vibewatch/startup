      - number: '2.3'
        title: 买方、用户与付款方：军事项目办公室仍占主导
        blocks:
          - type: paragraph
            body: >-
              Mach 这类系统的核心买家是军事和准军事机构，不是民用企业。陆军机动部队希望按梯队配置小型 UAS、可消耗式打击效果和打击系统；空军自主办公室需要协同式、可消耗式飞机；海军和 SOCOM
              买家需要能在争夺环境中存活的远征打击、基地防御和 ISR；盟国部委则跟随这些需求信号。即便在反 UAS 领域，最紧迫支出仍集中在军事基地、部队防护、边境、港口和国家安全地点。CRS、GAO
              和市场报告都强化了同一点：预算所有权集中在军种项目办公室、RDT&E 科目、采购拨款和联邦授权机构，而不是分散的商业买家。关键基础设施需求重要，但主动缓解的法律限制和致命自主系统的政治敏感性，让这个相邻市场对
              Mach 来说远不如纯传感器或场地安防供应商那么直接。采用路径同样很长：预算会变成征标、原型、测试、初始部署，之后才是——而且只是有时——正式项目或可重复采购。这就是为什么 Mach 当前市场大，却并不顺滑。
