      - number: '3.4'
        title: 切换成本与多供应商并用：政府买家会筛选，但不从一而终
        blocks:
          - type: paragraph
            body: >-
              这个市场有粘性，但不是企业软件那种粘性。买家很少面对经典 SaaS
              锁定。切换成本来自测试制度、采购载体、操作员再培训、软件认证、任务数据，以及在军事工作流下重新认证平台所需的时间。这些摩擦真实存在，但多供应商并用显然可行。当前最好的例子是 Shield 的自主软件运行在
              Anduril 的 Fury 场景中：空军似乎更偏好单项最优组合，而不是单一供应商垄断。这对 Mach 很重要，因为在另一个主承包商或自主供应商已经占位的项目中，Mach
              插入门槛会更低。与此同时，这也降低了竞争者攻击 Mach 最终栈中任一层的门槛。务实地说，分销权属于进入批准清单、已有装机机队或公开订单的供应商，而不只是架构最优雅的一方。对 Mach
              来说，护城河问题因此不是买家是否会容忍同一任务链里有两个供应商，而是其垂直整合能否实质降低部署摩擦。
