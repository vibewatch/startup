  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接对手比资本叙事暗示的更少
        blocks:
          - type: paragraph
            body: >-
              Mach 常被放进所有热门防务自主初创公司的篮子里，但真正的直接竞争集合更小。Anduril、Shield AI、AeroVironment 和 Kratos 分别与 Mach 市场的关键切片重叠：Anduril
              在拦截器和整合自主系统上重叠；Shield 在抗 EW 自主和 VTOL 军用飞机上重叠；AeroVironment 在巡飞弹和公开合同证明上重叠；Kratos
              在可负担的协同作战飞机上重叠。Skydio、Saronic 和 Castelion 则不同。它们更多是相邻而非直接：Skydio 是军民两用小型 UAS 和场地安防领先者，Saronic
              是海上自主，Castelion 是低成本高超音速。但这些相邻公司仍然重要，因为它们吸收 Mach 扩张所需的同一批投资人热情、工程人才和 Pentagon
              注意力。因此竞争问题有两层。第一，谁能拿走同一条预算线？第二，即便产品重叠并不完美，谁能让 Mach 的叙事显得没那么独特？Mach 所在领域已经足够拥挤，两层都重要。
