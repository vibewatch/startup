            body: >-
              合在一起，公开记录显示 Mach 正快速从概念主张走向更分层的运营底座，但还没有达到完整产品透明度。Viper / Strategic Strike
              在有资金支持的开发、已披露任务参数和持续飞行活动上证据最强。Dart 的架构比多数公开反 UAS 公告更明确，但关键运营数字——拦截器成本、拦截概率、再装填概念和经测试吞吐——仍然缺失。Stratos 和
              Mach 的气球联动高空努力看起来真实到足以获得演习级曝光，但公开载荷和续航细节仍稀疏。Forge、Mach Propulsion 以及 Heven / Nominal 合作，都强化了一个判断：Mach
              正在建设可复用制造和运营系统，而不是孤立演示。剩余缺口在于，如果没有私人尽调室，投资人或买家仍无法把大部分产品组合从手册描述映射到单位经济性、安全放行标准和生产良率证据。
