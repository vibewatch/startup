        - 估值和设施规模持续扩大，但看不到后续量产证据
        - 将政府集中视为威胁投资逻辑，而不只是早期阶段特征
      - - 人员和整合压力
        - 领导层或组织事件
        - 创始人离任、重大领导层流失，或 Mach Energetics 明显整合停滞
        - 新资本投入前，要求提供修订后的执行计划
      - - 融资依赖
        - 资本市场事件
        - 下一轮融资发生时，积压订单、利润率或客户集中度披露尚未改善
        - 假设稀释风险比运营证据更主导该案
      - - 合规控制失效
        - 网络、安全或环境事件
        - 需报告事件、执法行动或许可证相关停工
        - 升级为停止推进的尽调姿态，并重新审视整个投资逻辑
    notes: 这些触发因素应当能从公开材料或管理层提供的尽调材料中监测到。跨过任何阈值并不会自动否决公司，但会推翻低摩擦规模化这一投资逻辑。
    claimRefs:
