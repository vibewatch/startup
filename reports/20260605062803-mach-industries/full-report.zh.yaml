      - number: '6.5'
        title: 扩张路径和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Mach 确实有超出最初陆军落点的可见扩张路径，但每条路径都有集中度或证据质量限制。第一条是横向军种扩张，覆盖空军、SOCOM，以及据报道的 DIU / 海军项目。第二条是地域扩张，靠盟国政府和 African
              Lion 形成的外国观察员界面。第三条是通过 Forge 和合作伙伴制造分散付款方，Heven
              就是具名案例。问题在于，几乎所有路径的证据强度都低于陆军锚点。没有盟国被公开点名。没有非陆军合同金额披露。没有头部客户占比或积压订单组合可见。并且，Mach 产品落在自主打击和反无人机类别，HRW、UN 和
              OECD 的治理审查可能给更广采用带来额外采购审查、出口摩擦或声誉拖累。因此，客户故事既有真实动能，也有明显集中度风险：Mach 更像一条高度集中在美国国防的采用曲线，而不是多细分市场分散收入底座。
