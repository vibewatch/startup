      - number: '5.2'
        title: 通用架构、推进与制造栈
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，Mach 试图在产品之间标准化的不只是营销语言。最强的技术信号来自 Venom 项目。Mach
              称，它使用来自经飞行验证技术栈的航电和仿真，加上模块化开放系统方法，提供了基线需求和架构。这暗示一层可复用的控制与验证层，而不是每种飞行器各做一套定制栈。制造侧也遵循同样逻辑。Forge
              被描述为去中心化、柔性工厂网络，可以快速改造以适配新设计，并与合作公司和国家一起部署；Mach Propulsion 则加入内部推进层，而不是让发动机完全留作外包瓶颈。公开报道称，Mach 当前
              Strategic Strike 推进仍依赖
              JetCat，但新的推进部门旨在内化更高推力等级，并提升发动机总产能。最终形成的运营架构，是一条把通用设计原语、推进、合作制造和分布式工厂产能连起来的垂直整合链，即便详细子系统地图仍未披露。
