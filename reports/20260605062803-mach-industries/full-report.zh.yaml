      - number: '1.2'
        title: 创始人中心叙事与薄弱的公开治理披露
        blocks:
          - type: paragraph
            body: >-
              Mach 的公开身份高度围绕创始人展开。Thornton 不只是创始人兼 CEO；在每一篇被审阅的独立文章里，他实际上也是公司的运营叙事、融资门面和产品战略制定者。TechCrunch 锚定了那条熟悉的「19 岁
              MIT 辍学」故事线；Series C 报道仍把他描述为一位 22 岁创始人，管理一家成立三年的公司。创始人魅力显然帮助公司拿到资本和关注，但也带来集中度风险，因为相较成熟防务制造商通常会披露的信息，Mach
              对更广泛的领导团队披露少得多。Thornton 之外，Mach Propulsion 的 Jeremy Klyde
              是公开命名最清晰的运营高管；公司也称已补入资深技术和政府关系负责人，但没有逐一公开这些任命。公开材料同样没有披露董事会、委员会结构，或领投方的治理权利。因此，Mach
              外部动能很强，但在继任深度、创始人之下的运营节奏、投资人控制机制上，公众能见度仍偏弱。
