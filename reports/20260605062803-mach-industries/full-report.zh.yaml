            body: >-
              如果把公开记录按买方类别而不是客户标识数量拆开，Mach 的客户地图最容易理解。第一类也是最重要的一类，是美国防务直接需求；其中陆军是唯一同时有合同证据和后续场地评估证据的账户。第二类是相邻美国军事需求：空军和
              Special Operations Command
              在公司和伙伴材料中被反复提及，但没有配套合同编号、单位名称或已交付系统披露。第三类是盟国政府需求，公司在多次融资公告中提到这一类，但没有逐国点名。第四类是外部制造或生态系统需求，其中 HevenDrones
              是最清晰、近似客户的 Forge 关系。这一分层重要，因为 Mach 并不是卖给一个多元化商业客户群；公开证明集中在防务买家、防务用户和合作伙伴 OEM 上，陆军是锚定账户，其他每个细分都明显更不透明。
