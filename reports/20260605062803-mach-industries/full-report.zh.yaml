  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 依据
    rows:
      - - 建议
        - 观察
        - Mach 具备战略相关性，也有商业吸引力，但公开记录仍太薄，无法支撑以 Series C 公开价格启动投资。
      - - 置信度
        - 中
        - 融资势头、设施和市场顺风都是真实的，但太多决定性的运营和融资指标仍未公开。
      - - 风险评级
        - 高
        - 对一家硬件优先、公开经济性有限的防务公司而言，执行、自主政策和融资风险仍然实质。
      - - 估值立场
        - 偏高
        - $1.8B 标价高于受证据约束的基准区间，需要公开证据尚未验证的假设。
      - - 所需回报门槛
        - '>3x，以较低风险入口测算的账面总回报'
        - 在当前价格下，相对下行和稀释风险，公开乐观情景给出的上行不够。
      - - 决策含义
        - 等待有证据支撑的重新进入点
        - 等积压订单、收入、毛利率、产能利用率和股权结构条款可得，或新一轮在更清晰证据基础上定价后，再重新审视。
    notes: 本摘要仅反映截至 2026-06-05 的公开证据，未针对未披露的优先股堆叠或老股交易作调整。
