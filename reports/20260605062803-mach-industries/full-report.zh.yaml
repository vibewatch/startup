  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与治理风险
        blocks:
          - type: paragraph
            body: >-
              Mach 最高的法律与监管风险不是已披露诉讼，而是一组义务；公司从原型叙事走向规模化国防生产，这组义务会越来越重。公司现在公开描述打击飞行器、反 UAS
              系统、推进、含能材料，以及面向政府的制造基础设施。这个组合带来三层重叠负担。第一，隐私和基础公司合规是真实问题，即便风险低于武器监管：Mach 自己的政策称，它在 CCPA
              式告知义务下处理招聘、供应商、网站和场地安全数据。第二，Supplier Quality Manual 明确把供应商引向 FAR 和 DFARS 纪律，而 DFARS 252.204-7012
              显示，一旦受管国防信息进入范围，网络和事故报告义务会多快硬化。第三，产品组合几乎必然触及出口管制和自主治理问题，而公开材料今天没有回答。Cornell 的 ITAR 文本、UN 对致命自主武器新规则的呼吁、HRW
              对人类控制标准弱化的批评，以及 OECD 关于 Mach 的危害条目，都指向同一方向：规模越大，法律和政策审查越强。公开缓释措施存在，但具体分类、许可证和网络安全状态仍是私有信息。
