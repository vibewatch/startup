  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 支撑证据
      - 何种情况会改变判断
    rows:
      - - 投资逻辑
        - 防务自主和反无人机预算扩张够快，足以支撑该品类继续保有期权价值。
        - DAWG、Replicator 和 FY2026 自主 / C-UAS 报告都指向更强的需求背景。
        - 如果预算或采购优先级从低成本规模化和反无人机转走，顺风会减弱。
      - - 投资逻辑
        - Mach 搭出的制造和垂直整合抓手真实存在，速度快过多数同龄创业公司。
        - Forge、Mach Propulsion、Exquadrum，以及 Heven / Nominal 合作证据都指向严肃的工业化意图。
        - 如果产能利用率、良率或重复生产证据仍不出现，这一判断会转弱。
      - - 投资逻辑
        - Mach 能为资本密集型防务逻辑反复吸引资金。
        - Series B、Series C 和超额认购融资表明，即便项目制造属性重，公司也能拿到风险资本。
        - 如果未来一轮早于经济性或积压订单质量改善而到来，这一点的重要性会下降。
      - - 反向逻辑
        - 收入质量仍不透明。
        - 已审阅公开来源均未披露绝对收入、积压订单、利润率、烧钱速度或现金，尽管估值已上台阶。
        - 披露项目收入、积压订单和毛利率会显著改善投资测算。
      - - 反向逻辑
        - 相对估值，公开合同证据偏薄。
        - 与当前公开标价相比，可见联邦授予金额下限仍然很小。
        - 可见的重复生产合同或披露的可观积压订单会缩小这一缺口。
      - - 反向逻辑
        - 自主治理和执行风险仍可能快速压缩价值。
        - OECD、HRW 和 UN 来源显示品类层面受到审视，工厂爬坡又增加固定成本和安全敞口。
        - 有文档支撑的控制框架，加上干净的运营指标，会降低估值折现率。
    notes: 本表把证据支撑最强的正面因素，与目前不应按当前价格承保的最清晰理由放在一起权衡。
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV018
      - CV025
      - CV027
      - CV028
      - CV029
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 重复生产保持有限，产能利用滞后，披露经济性改善前又出现一轮融资。
        - $0.4B-$0.9B，到 2028E；约为当前价格的 0.2x-0.5x。
        - 稀释和固定成本吸收会暴露当下估值里有多少只是叙事。
        - 中高
      - - 基准
        - 部分生产转化和产能利用进展已经显现，但收入质量和利润率披露仍不完整。
        - $1.2B-$2.0B，到 2028E；约为当前价格的 0.7x-1.1x。
        - 披露改善前，公司仍应以低于已充分去风险硬件同行的水平定价。
        - 中
      - - 乐观
        - Mach 拿到可见的重复生产订单，披露收入超过约 $150M，并且在没有政策冲击的情况下体现工厂经济性改善。
        - $2.5B-$4.0B，到 2028E；约为当前价格的 1.4x-2.2x。
        - 乐观情景仍要押注多个尚未验证的里程碑快速兑现。
        - 中低
      - - 当前 Series C 轮
        - 公开经营经济性披露前，投资者需求已足以让这轮名义融资过关。
        - 当前名义估值 $1.8B。
        - 投资者可能是在提前为尚未公开的证明付费。
        - 已观察
    notes: 区间是情景估计，不是市场标价。它们锚定已披露的 Mach 事实、上市公司估值视角和私营国防科技参照。
    claimRefs:
