chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、使命与核心产品逻辑
        blocks:
          - type: paragraph
            body: >-
              Mach Industries 是一家位于 Huntington Beach 的防务制造商，Ethan Thornton 于 2023
              年创立。公司围绕一个判断起步：美国需要更快、更便宜，也更分布式地生产无人打击系统。公开材料始终把 Mach 定位成垂直整合的非对称航空航天与防务系统制造商，而不只是无人机初创公司或软件供应商。官网、Forge
              材料和 2026 年融资公告讲的是同一套逻辑：Mach 想掌握足够多的推进、含能、机体和生产基础设施，把设计到部署的周期压短。如今产品集覆盖五个具名载具——Viper、Glide、Stratos、Dart 和
              Pike——合起来覆盖单程打击、高空传感、反无人机拦截和弹药投送。这个宽度很重要，因为 Mach
              卖的不是单个明星产品，而是制造与平台栈。关键尽调问题不是公司有没有野心；野心很明显。问题是，公开可见证据是否已经足以支撑 Mach 从快速原型公司转向规模化生产公司。
