              Mach 的公开财务逻辑很重制造。公司在披露通常用来证明这些动作合理的指标之前，就已经在加设施、买受限供应商、搭建喷气发动机业务、扩大测试基础设施。因此 TechCrunch 关于 Exquadrum
              的报道尤其重要：它认为，在 Mach 开始规模化的关键时点，这笔收购会改善各个平台的单位经济性。这个逻辑可信。掌握固体火箭发动机、含能测试和微型喷气生产，应能降低供应商加价和交付周期风险。但同一个决定也带来 85
              名员工、70,000 平方英尺 Victorville 场地、测试基础设施和更多营运资本负担。Sacra 估计产品开发成本低于 $20
              million、成熟周期约三年，这暗示管理层认为平台创造可以在单个产品完全货币化之前反复复制。这是创投式制造模型，不是成熟生产模型。它可以跑通，但需要耐心资本，也需要开发到批量交付的转化可重复。
