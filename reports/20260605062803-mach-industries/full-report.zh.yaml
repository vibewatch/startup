      - number: '1.5'
        title: 里程碑、外部批评与仍未证明的问题
        blocks:
          - type: paragraph
            body: >-
              Mach 的里程碑曲线压缩得异常厉害：2023 年成立，第一年完成种子轮和 Series A，2024 年披露陆军开发合同，2025 年完成 $100 million Series B，2026 年以 $1.8
              billion 估值完成 $300 million Series C。这个速度令人印象深刻，但也意味着公开记录在愿景、生产意图和投资人热情上，远强于成熟运营披露。最重要的未决问题是商业证明。Thornton
              所称政府与商业收入 50/50 的结构方向上令人鼓舞，因为它暗示 Mach 不是单一渠道承包商；但公司没有公开点名商业买家，也没有发布可审计收入支撑。第二个主要问题是品类风险。Human Rights
              Watch、UN 官员和 OECD AI Incidents Monitor 都指向围绕越来越自主的打击系统正在积累的法律、伦理和声誉压力。截至本轮报告日期，来源材料没有显示 Mach
              自身受到直接制裁、诉讼或安全事件影响；但公司显然处在一个政策反弹可能先于经济数据完全透明就变得重要的赛道。
