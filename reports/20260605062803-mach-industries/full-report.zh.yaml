      - - Anduril
        - 私营 / 2026 年 Series H 轮
        - $61B 估值
        - 规模化防务自主系统的估值上限参照
        - 证明、渠道和软件栈都大得多
      - - Shield AI
        - 私营 / 2026 年融资
        - USAF 交易后估值 $12.7B
        - 以自主系统为核心的防务同行，有可见合同催化
        - 软件杠杆更强，项目证明更清楚
      - - Saronic
        - 私营 / 2026 年 Series D 轮
        - $1.75B 融资和披露的 $392M Navy 合同后，估值 $9.25B
        - 制造属性重的防务类比样本，合同规模支撑价格
        - 海事场景和船厂经济性不同
      - - Skydio
        - 私营 / 2026 年 Series F 轮
        - $110M 融资后估值 $4.4B
        - 低于 Mach 的中等规模 UAS 基准
        - 客户结构不同，军民两用敞口更多
      - - Castelion
        - 私营 / 2025/2026 年 Series B 轮
        - 披露轮次规模 $350M；估值未公开
        - 显示投资者仍愿意下注制造属性重的武器初创公司
        - 融资规模不等于估值
      - - AeroVironment
        - 上市 / 2026 年 6 月
        - $10.3B 市值，TTM 收入 $1.61B（约 6.4x 销售额）
        - 已部署硬件和弹药基准
        - 成熟上市公司，收入基数宽得多
      - - Kratos
        - 上市 / 2026 年 6 月
        - $11.89B 市值，TTM 收入 $1.42B（约 8.4x 销售额）
        - 可消耗飞机和防务系统基准
        - 业务组合比 Mach 更宽
      - - Red Cat
        - 上市 / 2026 年 6 月
        - $2.21B 市值，TTM 收入 $54.57M（约 40.6x 销售额）
        - 显示小型无人机纯标的在公开市场也可能按创投式倍数交易
        - 上市小盘股波动，规模也小得多
      - - Palantir
        - 上市 / 2026 年 6 月
        - $339.7B 市值，TTM 收入 $5.22B（约 65x 销售额）
        - 防务相邻投资者愿意支付的软件溢价上限
        - 不是直接的制造或武器可比公司
    notes: 这是一组精选可比对象，并非穷尽。私营公司行侧重已披露估值语境；上市公司行侧重当前市值 / 收入视角。
