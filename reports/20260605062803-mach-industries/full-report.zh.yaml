      - number: '2.2'
        title: 规模测算视角：官方预算科目比分析师 TAM 更可用
        blocks:
          - type: paragraph
            body: >-
              Mach 所在市场最强的公开需求信号不是咨询公司幻灯片，而是 Pentagon 预算。FY2026 请求中包括 $13.4 billion 用于自主系统、$3.1 billion 用于反 UAS；FY2027
              又提升到 $53.6 billion，用于自主、无人机平台和争夺环境下的后勤，另有 $21 billion 投向弹药、反无人机技术和先进系统。这些数字无法与 Mach
              产品完全一一映射，但清楚说明自主系统和无人机战争已经成为预算类别，不再是试点项目。分析师报告提供的是纹理，不是真相。StartUs 估计军用无人机市场到 2030 年为 $22.81
              billion；如果把服务、软件和关键基础设施需求纳入，其他无人机相邻估算会高得多。巡飞弹和反 UAS
              报告里也有同样分歧：有些模型保守且聚焦军事，有些则纳入更广泛的民用基础设施防护或更宽的平台定义。用于估值和市场工作时，官方拨款界定最可信的需求地板，分析师报告则界定外沿和不确定区间。
