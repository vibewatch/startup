      - number: '7.5'
        title: 财务模型风险、缓释措施与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              Mach 有足够资本跑得很快，但公开运营披露不足，无法把这种速度看成低风险。到 2026 年 6 月，公司披露累计融资约 $485M、估值 $1.8B，资金用途也说得很明确：扩张 Forge、建立 Mach
              Propulsion、推进第二代系统、加深国防关系。仍然缺的是把这些投入接到耐久经济性的模型。公开来源仍看不到收入、积压订单、烧钱速度、毛利率或客户集中度。即便最有意思的数据点——所谓政府与其他公司收入
              50/50，以及 Exquadrum
              改善单位经济性的说法——也来自管理层口径，而不是独立验证。因此，核心投资风险落在一个熟悉的国防创业模式里：估值和资本开支已经上规模，生产证明和经济性披露却滞后。正确的监控姿态应按触发器推进。严重安全或合规事件、开发工作向可见订单转化停滞，或在证明点改善前又进行一轮融资，都会实质性改变投资判断。
