            body: >-
              最终投资问题不是 Mach 是否有意思，而是哪些内容必须变得可见，严肃投资人才应该付高价。答案主要在运营和财务上：按项目拆分的收入、积压订单质量、按收入流拆分的毛利率、Forge 和推进资产利用率与良率，以及
              Series C
              背后的股权结构条款。这些问题很重要，因为最可能的失败模式不是缺野心，而是原型和工厂建设无法转化为耐久经济性。风险侧也可能打破投资逻辑：重大安全或自主治理事件、运营证明改善前的新融资，或持续无法把开发胜利转化为重复订单，都会快速削弱投资理由。在这些问题解决前，Mach
              仍是有退出可选性，而不是退出就绪。公司可能值得放在高优先级观察名单，但还不该被当作透明的后期资产。
