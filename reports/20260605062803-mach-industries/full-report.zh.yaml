      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Mach 第二大风险在于，其速度叙事可能跑在公开可靠性证据前面。Venom 71 天完成首飞，Strategic Strike 有高要求的航程和载荷目标，Dart 已经用探测到交战的术语描述，African
              Lion 也显示至少部分系统在进入士兵评估。这些都是有意义的信号，但不等于披露出动架次、制造良率、拦截概率或故障率数据。风险更尖锐，是因为 Mach
              扩张的不是简单软件服务。它在增加喷气发动机工厂、与含能材料相关的 Victorville 设施，以及看起来像真实航空航天生产治理的供应商管控要求。OSHA 和 EPA
              规则说明这些运营可能需要怎样的危险工艺纪律；GAO、FAA 和 CISA 则显示，反 UAS
              和更广空域运营都有有效性边界和安全外部性。供应商手册是真正的缓释信号，因为它记录了检验、变更控制和防伪要求。尽管如此，在产出指标追上流程主张之前，剩余敞口仍然高。
