companyProfile:
  summary: >-
    Mach Industries 是一家位于 Huntington Beach 的防务制造商，Ethan Thornton 于 2023 年创立，目标是在工业规模上打造非对称航空航天与防务系统。公司公开营销的产品栈很宽，覆盖
    Viper、Glide、Stratos、Pike、Dart、Energetics、Mach Propulsion 和 Forge 去中心化制造网络。公开牵引力最强的部分是陆军牵头的 Strategic Strike
    工作、陆军场地评估活动，以及 HevenDrones、Nominal 等制造合作；近期融资也让 Mach 作为一家成立三年的公司获得了异常充足的资本。核心尽调难题在于，Mach 的公开叙事远比公开经济指标丰富：相对 $1.8
    billion 的 Series C 估值标题，收入、订单积压、利润率、集中度、治理和优先权条款都仍大幅未披露。
