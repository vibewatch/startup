        title: 规模、分销与公开证明：领先者已经拥有 Mach 正在搭建的东西
        blocks:
          - type: paragraph
            body: >-
              Mach 最大的竞争劣势不是产品明显更差，而是几个对手已经拥有 Mach 仍在拼装的成熟度栈中的一些部分。Anduril 有估值和资本基础，可以同时投入整合自主、反 UAS 和制造。Shield
              的软件栈可信到足以让空军把它放进竞争对手的飞机项目。Skydio 有装机基础、制造叙事和军民两用足迹，能把产品公告转化为渠道杠杆。AeroVironment 有公开陆军订单和经战场验证的巡飞弹品牌。Saronic
              已融资 $1.75 billion，要在另一个领域工业化，但它同样受国家安全支出周期驱动。即便 Castelion 的快速测试与规模化叙事，也在争夺围绕可负担威慑的同一政策胃口。Mach
              的机会在于没有对手一次覆盖它的所有品类。问题在于，资金最充足的竞争者至少已经主导一个成熟度维度——资本、部署、装机基础或公开合同证明——而这些维度往往比原始技术可能性更快决定信任。
