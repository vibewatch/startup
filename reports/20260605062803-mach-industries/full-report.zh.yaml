  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Mach 位于无人机经济中狭窄的防务优先切片
        blocks:
          - type: paragraph
            body: >-
              不应把 Mach 放进整个全球无人机市场去分析。真正要看的边界更窄：可消耗式打击飞行器、巡飞弹、反 UAS
              系统，以及让这些系统以有用规模生产的制造使能栈。这意味着消费级无人机、农业喷洒、包裹配送和大多数通用商用机器人，即便共享机体部件或自主软件，也都不是好的可比对象。DoD 围绕 Replicator、Drone
              Dominance 和可消耗式系统的官方表述，指向的是一个由成本有效的大批量、补充速度和战时效用定义的市场，而不是由爱好者或企业无人机采用定义的市场。对 Mach
              来说，真正重要的邻近品类，是军事买家为打击效果、韧性导航、分层反无人机防御或可快速重构生产付费的领域。这就是为什么宽泛 TAM
              数字可能误导：它们经常把买家、法律制度和供应链经济性完全不同的细分市场捆在一起。更好的方法，是先锚定项目级军事需求信号，再把分析师市场报告当成上下界，而不是直接代理 Mach 的真实可服务市场。
