      - number: '2.4'
        title: 增长驱动：可负担的大规模、乌克兰经验与采购改革
        blocks:
          - type: paragraph
            body: >-
              增长最快的需求驱动，都能在公开政策和作战语言里看到。Replicator 把问题定义为用数千套可消耗式自主系统对抗中国规模；Drone Dominance 则把这转化为超过 200,000
              架致命无人机的稳定采购信号。RAND、AFRL 和 War on the Rocks
              从不同角度强调同一点：未来买家不是为精致完美付费，而是为足够便宜、损失得起，足够快、补得上，并且能在电子战压力下运行的系统付费。这套逻辑抬升
              Mach，因为公司明确卖的是分布式制造和投产速度，而不只是一个平台。与此同时，陆军和空军围绕 PBAS、连级 sUAS、XQ-67A 和 CCA
              的试验显示，买家已经不再争论可消耗式自主是否重要；他们在决定如何组织、融资和扩大规模。用市场语言说，这是从试验需求转向制度性需求的重要变化。它不能保证合同转化，但确实让这个品类的结构韧性高于两年前。
