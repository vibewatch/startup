            body: >-
              融资背景足以描述，但还不足以背书。Mach 在 2025 年提交 Form D，Series B 融资 $100M、据报道估值 $470M，随后在 2026 年中跳到据报道 $300M 的 Series C、估值
              $1.8B。新一轮似乎很受欢迎且超额认购，说明风投对国防制造叙事有真实需求。但名义价格支撑弱于融资需求。公开披露没有给出把名义估值转换成真实入场价格所需的条款，也没有给出能与公开或私有可比标的干净比较的收入底座。因此，如果
              Mach 已经走在重复生产和九位数收入路径上，这个估值可能合理；但如果业务本质上仍处在未规模化、合同偏少阶段，这个估值就可能激进。今天的证据更支持后一种不确定性，而不是前一种确定性。
