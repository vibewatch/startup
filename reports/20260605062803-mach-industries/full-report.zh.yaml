            body: Mach 有足够市场顺风和工业野心，应该留在观察名单；但公开收入或积压订单证明不足，还不能有信心地支付当前 Series C 名义价格。
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV027
              - CV043
              - CV046
          - type: callout
            title: 工业化建设是真实的
            body: Forge、Mach Propulsion、Exquadrum 和合作伙伴生产信号显示，Mach 试图建设真实的国防制造栈，而不是一组停留在概念上的项目。
            calloutType: strength
            claimRefs:
              - CV011
              - CV012
              - CV013
          - type: callout
            title: 经济性不透明是主要障碍
            body: 公开证据仍没有给出收入、积压订单、利润率、烧钱速度或股权结构条款，投资人无法把 $1.8B 名义估值转化为有纪律的入场算账。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV033
