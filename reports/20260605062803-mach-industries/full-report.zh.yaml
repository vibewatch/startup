        - 多数产品缺少公开技术数据表，成熟度难以对标
      - - 控制与仿真层
        - 通用航电、仿真和开放系统架构加快设计复用与迭代
        - 取决于共享软件、模型和验证工具的质量
        - 公开来源没有记录软件保证、网络加固或操作员接管细节
      - - 推进层
        - 喷气发动机和其他推进技术支撑打击与 VTOL 系统
        - 近期依赖 JetCat，同时 Mach Propulsion 扩建存在执行风险
        - 发动机吞吐或耐久性短板可能卡住产品放量
      - - 数字制造层
        - Forge 网络和数字制造伙伴把设计转成可规模化生产
        - 取决于可重装产线设施、供应商要求下传和可制造设计
        - 吞吐、报废率和一次通过率指标未公开
      - - 测试与遥测数据层
        - Nominal 连接仿真、台架测试、地面运行和飞行遥测
        - 取决于仪器质量和跨站点的严格数据运营
        - 公开材料没有展示验证覆盖率或异常解决周期
      - - 供应商质量层
        - Quality Codes、检验、版本控制以及防伪 / FOD 预防约束输入
        - 取决于供应商合规，以及 Mach 对下级供应源的执行力度
        - 供应商手册政策很强，但缺少执行结果的公开证据
      - - 伙伴生产层
        - Heven 和 Divergent 把网络延伸到伙伴产品和增材机体制造
        - 取决于接口对齐、组件协同开发和共享制造标准
        - 公开披露未说明产能受限时如何给合作伙伴项目排优先级
