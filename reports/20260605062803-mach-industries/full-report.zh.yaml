              Mach 不是一家拥有透明经常性收入的软件公司。公开证据指向的是混合硬件与制造模型，围绕政府项目直销、盟国防务销售、通过 Mach Energetics 和 Mach Propulsion
              销售组件和子系统，以及通过 Forge 获取合作伙伴制造产能利用收入。Sacra 明确把业务概括为三条收入流；TechCrunch 则给出最挑动但验证最弱的财务数据点：Thornton
              称当前收入在政府和其他公司销售之间各占 50%。这个说法方向上有用，因为它暗示 Mach
              并非完全依赖单一合同渠道。但它离能支撑投资判断还很远。本轮没有任何公开来源提供绝对收入、客户集中度、ARR、订单积压或回款数据。手头唯一硬的公开政府收入地板，是 USAspending 中可见的 $1.5
