      - number: '1.3'
        title: 资本结构、投资人信心与工业化扩张叙事
        blocks:
          - type: paragraph
            body: >-
              Mach 的融资史解释了为什么它如今被视为市场上扩张最快的防务初创之一。TechCrunch 报道，2023 年 Sequoia 领投了 $5.7 million 种子轮，同年晚些时候 Bedrock 领投
              $79 million Series A；2025 年 6 月的 Series B 又从 Khosla Ventures 和 Bedrock 拿到 $100 million。2026 年 6 月，Infinite
              Capital 和 Ribbit Capital 领投 $300 million Series C，估值 $1.8 billion，Bedrock、Sequoia 和 Khosla
              继续留在股权结构表上。这个节奏说明，投资人对一个极其资本密集的品类有异常强的信心。融资也支撑了一套明确的工业化计划：Forge Huntington 已经有 115,000 平方英尺；管理层称 2026
              年底前还会有四个生产设施上线；Mach Propulsion 目标年产 12,000 台发动机。收购 Exquadrum
              也符合这套逻辑，因为在推进能力仍是整个防务航空航天瓶颈时，掌握固体火箭发动机能力可以降低供应链依赖。本章最强的正面证据不是传统软件式收入披露，而是多个独立来源中，投资人信号和制造扩张信号高度一致。
