  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-terms-and-dilution
    missingEvidence: Full cap table, preferred-stock terms, liquidation preferences, option pool changes, and investor rights for the Series C.
    whyItMatters: Without round terms, public evidence cannot convert the $1.8B headline into a preference-adjusted entry price or downside stack.
    diligencePath: Request the latest cap table, financing documents, and board-approved round summary from counsel or finance.
    relatedQuestionRefs:
    - QV008
    - QV021
  - type: private-evidence-only
    severity: blocking
    topic: revenue-backlog-and-margin
    missingEvidence: Program-level revenue bridge, backlog by customer and program, gross margin by stream, monthly burn, and current cash balance.
    whyItMatters: These are the core inputs for judging whether the current price reflects real economics or only option value.
    diligencePath: Request the last twelve months of monthly P&L, backlog rollforward, customer concentration, and current cash and burn schedule.
    relatedQuestionRefs:
    - QV010
    - QV029
    - QV025
  - type: private-evidence-only
    severity: material
    topic: export-autonomy-and-incident-controls
    missingEvidence: Product-by-product export classification, autonomy release criteria, human-control doctrine, and any incident or near-miss history.
    whyItMatters: Governance and regulatory shocks can erase valuation support quickly in autonomous-weapons categories.
    diligencePath: Request the export-control matrix, safety case, autonomy-governance memo, and incident log reviewed by management and counsel.
    relatedQuestionRefs:
    - QV030
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: More private defense-tech rounds with disclosed valuation and comparable revenue or contract detail.
    whyItMatters: The public comp set is directionally useful, but many private peers still do not disclose enough terms to normalize directly against Mach.
    diligencePath: Extend the comp set with private placement memos, secondary marks, or management-provided cap-table history for closer peers.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV004
