- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Key risk
  - Probability signal
  rows:
  - - Bear
    - Repeat production stays limited, utilization lags, and another financing arrives before disclosed economics improve.
    - $0.4B-$0.9B by 2028E, or roughly 0.2x-0.5x the current price.
    - Dilution and fixed-cost absorption expose how much of today's mark is narrative.
    - Medium-high
  - - Base
    - Some production conversion and utilization progress appears, but revenue quality and margin disclosure remain incomplete.
    - $1.2B-$2.0B by 2028E, or roughly 0.7x-1.1x the current price.
    - The company still trades below fully de-risked hardware peers until disclosure improves.
    - Medium
  - - Bull
    - Mach wins visible repeat production work, discloses revenue above roughly $150M, and shows improving factory economics without a policy shock.
    - $2.5B-$4.0B by 2028E, or roughly 1.4x-2.2x the current price.
    - Bull underwriting still depends on multiple unverified milestones happening quickly.
    - Low-medium
  - - Current Series C
    - Headline round clears on investor appetite before public economics are disclosed.
    - $1.8B headline today.
    - Investors may be pre-paying for proof that is not yet public.
    - Observed
  notes: Ranges are scenario estimates, not market marks. They are anchored to disclosed Mach facts, public-company valuation lenses, and private defense-tech references.
