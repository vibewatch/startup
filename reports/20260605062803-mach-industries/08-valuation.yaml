- id: SV003
  title: Bull, base, and bear range logic
  body: The scenario range is best thought of as option-value math around proof conversion, not as a precision DCF. Public-company references show that scaled defense hardware names such as AeroVironment and Kratos can sustain mid-single-digit to high-single-digit sales multiples once revenue is disclosed and fielding is real. Small drone pure-plays such as Red Cat can trade at far richer multiples when growth is explosive, but those marks still sit on an actual revenue base. Mach has not yet provided that base publicly, so the current round effectively asks investors to pre-pay for evidence that is not yet disclosed. The base case therefore sits below the headline round, because some production conversion and utilization progress are plausible but not proven. The bull case works only if Mach quickly translates manufacturing ambition into repeat contracts, disclosed revenue scale, and improving unit economics. The bear case is not a zero, but it is severe because another raise before proof
    would expose how much of today's valuation is narrative rather than economics.
