- id: SV004
  title: Diligence asks, thesis-break triggers, and exit readiness
  body: 'The final underwriting question is not whether Mach is interesting; it is what would have to become visible before a serious investor should pay up. The answer is mostly operational and financial: revenue by program, backlog quality, gross margin by stream, utilization and yield at Forge and propulsion assets, and the cap-table terms behind the Series C. Those asks matter because the most likely failure mode is not lack of ambition but lack of conversion from prototype and factory build-out into durable economics. The thesis can also break from the risk side: a material safety or autonomy-governance event, a new financing before operating proof improves, or a sustained failure to turn development wins into repeat orders would all undermine the case quickly. Until those items are resolved, Mach remains exit-optional rather than exit-ready. The company may deserve a premium watchlist spot, but it does not yet deserve to be treated like a transparent late-stage asset.'
