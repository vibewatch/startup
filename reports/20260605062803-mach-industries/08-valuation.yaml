tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Basis
  rows:
  - - Recommendation
    - TRACK
    - Mach is strategically relevant and commercially interesting, but the public record is still too thin to justify initiating at the Series C headline price.
  - - Confidence
    - Medium
    - Funding momentum, facilities, and market tailwinds are real, but too many decisive operating and financing metrics remain private.
  - - Risk rating
    - High
    - Execution, autonomy-policy, and financing risk all remain material for a hardware-first defense company with limited public economics.
  - - Valuation stance
    - Stretched
    - The $1.8B mark sits above a proof-constrained base range and requires assumptions that public evidence does not yet verify.
  - - Required return hurdle
    - '>3x underwritten gross from a lower-risk entry'
    - At the current price, the public bull case does not offer enough upside relative to the downside and dilution risk.
  - - Decision implication
    - Wait for proof-backed re-entry point
    - Revisit once backlog, revenue, gross margin, utilization, and cap-table terms are available or a new round prices on clearer proof.
  notes: This summary reflects public evidence only as of 2026-06-05 and does not adjust for undisclosed preference stack or secondary transactions.
