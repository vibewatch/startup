- id: TE002
  title: Workflow / use-case table
  description: How public Mach products and infrastructure map to buyer jobs and operational workflows.
  columns:
  - User job
  - Current workflow / pain point
  - Mach solution
  - Measurable benefit
  - Limitation
  rows:
  - - Launch deep strike from dispersed tactical units
    - Brigade and below formations can sense farther than they can organically strike
    - Viper / Strategic Strike vertical-takeoff cruise missile concept
    - Public target requirement of 180 miles with more than 22 pounds of warhead effect
    - Still in development and disclosed only at a high level
  - - Deliver lower-cost precision effects at range
    - Existing strike options can be too expensive or too infrastructure-heavy for mass use
    - Glide public munition line
    - Product line implies a cheaper precision-effect layer inside the broader portfolio
    - No public performance or maturity data reviewed
  - - Hold sensors, communications, or effects aloft for long standoff missions
    - Tactical users need persistence beyond short-endurance drone windows
    - Stratos high-altitude pseudo-satellite concept
    - Public concept claims thousands-of-miles launch standoff and multi-mission payload role
    - Endurance and payload specifics are not public
  - - Defeat repeated swarm raids at defended assets
    - Traditional air defense can be too expensive and inventory-limited against cheap UAVs
    - Dart detect-to-engage counter-UAS system
    - Designed for high-throughput, modular deployment and repeated low-cost engagements
    - No public intercept-performance or cost-per-shot data reviewed
  - - Scale partner drone manufacturing domestically
    - Defense buyers want non-Chinese supply and faster replenishment
    - Forge + HevenDrones production partnership
    - U.S.-based production of H100, H2D55, and Raider at Forge Huntington
    - Public order volumes and output quality metrics are not disclosed
  - - Compress the loop from test event to production decision
    - Hardware teams often lose traceability between simulation, bench work, flights, and factory handoff
    - Nominal connected test and operations data infrastructure
    - Faster cross-run comparison, automated checks, and planned go / no-go reporting
    - No public benchmark on defect reduction, yield improvement, or test throughput disclosed
  notes: Benefits reflect the specific public claims reviewed in source material, not validated combat
    performance or procurement outcomes.
