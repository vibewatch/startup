- id: sec502
  title: Common architecture, propulsion, and manufacturing stack
  body: Public materials suggest Mach is trying to standardize more than marketing language across products.
    The strongest technical signal comes from the Venom program, where Mach said it supplied the baseline
    requirements and architecture using avionics and simulation from flight-proven tech stacks plus a
    modular, open-systems approach. That implies a reusable control and validation layer rather than one
    bespoke stack per air vehicle. The manufacturing side follows the same logic. Forge is described as
    a decentralized, flexible factory network that can be rapidly retooled to new designs and deployed
    with partner companies and countries, while Mach Propulsion adds an internal propulsion layer rather
    than leaving engines as an entirely outsourced bottleneck. Public reporting says Mach still depends
    on JetCat for current Strategic Strike propulsion, but the new propulsion division is intended to
    internalize higher-thrust classes and raise total engine capacity. The resulting operating architecture
    is a vertically integrated chain linking common design primitives, propulsion, partner manufacturing,
    and distributed factory capacity, even if the detailed subsystem map remains undisclosed.
  claimRefs:
