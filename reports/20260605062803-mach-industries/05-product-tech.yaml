company:
  name: Mach Industries
chapter:
  number: 5
  title: Product & Technology
  summary: Mach Industries publicly presents a vertically integrated defense product stack spanning strike
    systems, high-altitude platforms, counter-UAS interceptors, propulsion, and the Forge manufacturing
    network. Public evidence is strongest around Viper / Strategic Strike, Mach Propulsion, the Nominal
    and HevenDrones partnerships, Venom rapid prototyping, and supplier-quality controls; disclosure is
    materially thinner on exact performance, autonomy guardrails, and production yield for most SKUs.
sections:
- id: sec501
  title: Product surface and customer workflow definition
  body: 'Mach’s public product surface is unusually broad for a company founded in 2023. The homepage
    names six product families — Viper, Glide, Stratos, Pike, Dart, and Energetics — and describes them
    in mission terms rather than as abstract R&D programs. That framing matters because the company is
    not presenting a single drone or missile, but a portfolio built around different operational jobs:
    vertical-takeoff strike, glide-based precision effects, stratospheric persistence, modular attritable
    munitions, counter-UAS interception, and the energetics base that can support lethal systems. Viper
    has the clearest public operating concept, with third-party reporting tying it to the Army’s Strategic
    Strike effort and giving a disclosed range and warhead requirement. Dart is the second most concrete
    product in public reporting, because Mach has described the detect-to-engage architecture and the
    intended swarm-defense role. The rest of the portfolio is still publicly defined more by category
    and intended use than by datasheet-grade performance detail, which means the buyer story is legible
    but the underwriting data package remains thin.'
