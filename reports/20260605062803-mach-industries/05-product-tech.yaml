- id: sec505
  title: Maturity signals, dependencies, and remaining underwriting gaps
  body: Taken together, the public record shows a company moving quickly from concept claims toward a
    more layered operating base, but not yet one with full product transparency. Viper / Strategic Strike
    has the strongest evidence of funded development, disclosed mission parameters, and recurring flight
    activity. Dart has a more explicit architecture than most public counter-UAS announcements, yet the
    crucial operating numbers — interceptor cost, intercept probability, reload concept, and tested throughput
    — are still absent. Stratos and Mach’s balloon-linked high-altitude efforts appear real enough to
    reach exercise-level exposure, but public payload and endurance details remain sparse. Forge, Mach
    Propulsion, and the Heven / Nominal partnerships all strengthen the case that Mach is building reusable
    manufacturing and operating systems, not isolated demos. The remaining gap is that investors or buyers
    still cannot map most of the portfolio from brochure description to unit economics, safety release
    standards, and production-yield evidence without a private diligence room.
  claimRefs:
