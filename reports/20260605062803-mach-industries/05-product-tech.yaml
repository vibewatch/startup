- id: TE005
  title: Roadmap / release / development-stage table
  description: Public milestones that indicate where Mach’s product stack sits between concept, flight,
    and scale-up.
  columns:
  - Date / stage
  - Feature / milestone
  - Status
  - Implication
  - Source
  rows:
  - - 2025-03 public contract phase
    - Viper / Strategic Strike selected by Army Applications Laboratory
    - Development contract and prototype flight activity disclosed
    - Gives Viper the strongest open-source evidence of funded product maturation inside the portfolio
    - PR Newswire + Breaking Defense + National Defense
  - - 2025-03 partnership launch
    - Forge begins scaling HevenDrones production
    - Announced
    - Shows Mach intends to manufacture partner UAS platforms, not only internal designs
    - DroneLife + Heven Drones + Mach newsroom
  - - 2026-01 public product reveal
    - Dart counter-UAS system enters open view
    - Flying and targeting in-theater intercepts by 2026
    - Extends Mach from strike systems into defensive counter-swarm infrastructure
    - Army Recognition
  - - 2026-03 data-infrastructure milestone
    - Nominal selected for engineering, test, and operations data
    - Announced and in use
    - Indicates Mach is building a durable validation layer from early flight test through Forge production
    - Nominal + Mach newsroom
  - - 2026 public rapid-prototyping demonstration
    - Venom concept-to-flight in 71 days
    - Flight demonstration announced
    - Demonstrates speed of iteration and digital manufacturing relevance for future programs
    - Mach newsroom + AeroTime
  - - 2026 public propulsion expansion
    - Mach Propulsion and jet engine factory plan
    - Division launched; factory build-out planned
    - Pushes vertical integration into a likely bottleneck subsystem and sets a 12,000-engine annual target
    - PR Newswire + Aerospace Manufacturing and Design + Mach newsroom
  - - 2026-05 multinational exercise signal
    - Stratos Darkwing and micro high-altitude balloons at African Lion 26
    - Army field evaluation context
    - Suggests at least part of the high-altitude stack is moving into operationally relevant testing
    - U.S. Army + Mach newsroom
  notes: Dates use public announcement timing or stage labels from reviewed sources; they do not imply
    fielding, procurement-at-scale, or sustained production outcomes.
