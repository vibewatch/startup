  evidenceGaps:
  - type: missing-source
    severity: material
    topic: platform-performance
    missingEvidence: Exact range, payload, endurance, and unit-cost datasheets for Glide, Pike, Stratos,
      Dart, and Energetics.
    whyItMatters: Buyers cannot compare the portfolio against alternatives or underwrite affordability
      and logistics from one-line product descriptions alone.
    diligencePath: Request current product spec sheets, latest flight-test summaries, and manufacturing
      cost assumptions for each named SKU.
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: factory-execution
    missingEvidence: Throughput, first-pass yield, defect rate, and supplier qualification metrics for
      Forge and planned Mach Propulsion output.
    whyItMatters: Vertical integration is central to Mach’s thesis, but public claims do not yet show
      whether factory economics and quality performance match the narrative.
    diligencePath: Review factory KPIs, supplier scorecards, propulsion qualification plans, and recent
      production-readiness reviews.
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: autonomy-governance
    missingEvidence: Human-in-the-loop policy, safety release criteria, override design, and autonomy
      test protocols for strike and counter-strike products.
    whyItMatters: Governance and safety controls are necessary to assess operational risk, procurement
      friction, and headline exposure for autonomous weapons programs.
    diligencePath: Request internal CONOPS, safety-case documents, verification plans, and customer rules-of-engagement
      assumptions for autonomous behaviors.
