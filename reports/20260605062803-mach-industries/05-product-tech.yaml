tables:
- id: TE001
  title: Product module / asset matrix
  description: Publicly named Mach product lines and what is visible about their role and maturity.
  columns:
  - Product / asset
  - Primary user / mission
  - Public maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Viper / Strategic Strike
    - Army maneuver units needing long-range strike without fixed launcher infrastructure
    - Funded development program with public flight-testing evidence
    - Vertical-takeoff strike concept intended to combine cruise-missile-like range with tactical deployment
      flexibility
    - Exact propulsion configuration, seeker stack, safety release logic, and fielding timeline remain
      undisclosed
  - - Glide
    - Operators needing lower-cost precision strike at range
    - Named public product with only high-level mission description
    - Presented as a glide munition rather than a powered reusable aircraft
    - No public range, payload, guidance, or flight-test evidence reviewed
  - - Stratos
    - Users needing communications, sensing, or effects from the stratosphere
    - Active development with Army exercise evaluation signal
    - High-altitude pseudo-satellite concept deployable thousands of miles from launch point
    - No public endurance, payload mass, recovery concept, or environmental envelope disclosed
  - - Pike
    - Units needing modular decentralized munitions deployed in volume
    - Named public product with concept-stage disclosure only
    - Framed around low cost and en-masse modular deployment
    - No public seeker, warhead, range, or test-status detail reviewed
  - - Dart
    - Bases, airfields, depots, and maneuver formations facing drone swarms
    - Flying development system targeting in-theater intercepts by 2026
    - Detect-to-engage counter-UAS layer built around internal radar and low-cost interceptors
    - No public interceptor cost, reload burden, or demonstrated kill-probability data disclosed
  - - Energetics
    - Internal programs and defense supply chain needing warhead / energetic input
    - Category listed on public product surface but not separately documented
    - Suggests deeper vertical integration of lethal-system subcomponents
    - No public product list, certification baseline, or qualification data reviewed
  notes: Rows reflect only publicly named assets and categories visible on Mach’s homepage plus product-specific
    reporting reviewed for this chapter; undisclosed variants and classified programs may exist outside
    this set.
  enumerationScope:
    coverage: partial
    basis: The public product surface names six categories, but only Viper and Dart have meaningful open-source
      technical reporting and the site does not enumerate every variant, payload, or configuration.
