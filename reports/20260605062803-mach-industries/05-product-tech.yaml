- id: TE004
  title: Trust / quality / compliance table
  description: Publicly visible quality controls and trust disclosures around Mach’s product stack.
  columns:
  - Control / disclosure
  - Status
  - Scope
  - Gap
  rows:
  - - Supplier quality manual
    - Publicly available
    - Defines PO-linked quality obligations for product suppliers
    - No public audit results or supplier performance scorecards reviewed
  - - ISO / AS9100 / FAR / DFARS alignment
    - Explicitly referenced in manual
    - Governs quality, aerospace-defense process discipline, and contracting expectations
    - Mach does not publish a broader enterprise certification map on reviewed pages
  - - Revision control and change approval
    - Explicitly required
    - Covers design, material, process, source, and inspection-method changes
    - No public example of engineering-change governance in practice reviewed
  - - Inspection, testing, and acceptance
    - Explicitly required
    - Requires pre-shipment verification with final acceptance normally at Mach receiving
    - No public first-pass-yield, acceptance-rate, or escape-rate metrics disclosed
  - - Nonconformance / SCAR / escape notification
    - Explicitly required
    - Covers corrective action, delivered escapes, root-cause response, and limited material review
    - Public materials do not show closure times or supplier-remediation performance
  - - Counterfeit and FOD prevention
    - Explicitly required
    - Covers authorized sourcing, traceability, and documented FOD program controls
    - No public counterfeit incident record or compliance audit summary reviewed
  - - Right of access and record retention
    - Explicitly required
    - Extends to Mach, customers, and regulators across facilities and records
    - Retention periods and regulator-specific implementations are not publicly detailed in reviewed excerpts
  - - Autonomy governance disclosure
    - Thin
    - Relevant to strike, counter-strike, and autonomous engagement systems
    - Public sources do not provide release-criteria, override, or safety-case detail
  notes: The manual gives strong evidence of supplier-control intent, but the public record remains much
    lighter on operational safety governance and measured quality outcomes.
