- id: TE003
  title: Technology / operating architecture table
  description: The public operating architecture Mach exposes across products, manufacturing, and validation.
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Mission systems layer
    - Viper, Glide, Stratos, Pike, Dart, and Energetics define the externally visible product surface
    - Depends on translating high-level product concepts into testable, repeatable configurations
    - Most products lack open technical datasheets, making maturity hard to benchmark
  - - Controls and simulation layer
    - Common avionics, simulation, and open-systems architecture accelerate design reuse and iteration
    - Depends on the quality of shared software, models, and validation tooling
    - Public sources do not document software assurance, cyber hardening, or operator override detail
  - - Propulsion layer
    - Jet engines and other propulsion technologies support strike and VTOL systems
    - Near-term dependence on JetCat plus execution risk on Mach Propulsion build-out
    - Engine throughput or durability shortfalls could bottleneck product scale-up
  - - Digital manufacturing layer
    - Forge network and digital manufacturing partners convert designs into scalable production
    - Depends on retoolable facilities, supplier flow-down, and manufacturable designs
    - Throughput, scrap, and first-pass-yield metrics are not public
  - - Test and telemetry data layer
    - Nominal links simulation, bench testing, ground runs, and flight telemetry
    - Depends on instrumentation quality and disciplined data operations across sites
    - Public materials do not show validation coverage or anomaly-resolution cycle times
  - - Supplier quality layer
    - Quality Codes, inspection, revision control, and counterfeit / FOD prevention govern inputs
    - Depends on supplier compliance and Mach enforcement across sub-tier sources
    - The supplier manual is strong on policy, but open evidence on execution outcomes is absent
  - - Partner production layer
    - Heven and Divergent extend the network into partner products and additive airframe fabrication
    - Depends on aligned interfaces, component co-development, and shared manufacturing standards
    - Public disclosures do not show how partner programs are prioritized under constrained capacity
  notes: This table models the public operating architecture buyers can infer from the evidence; it is
    not a hidden internal systems diagram and therefore emphasizes operational dependencies over component-level
    secrets.
