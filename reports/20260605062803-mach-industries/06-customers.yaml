    severity: material
    topic: air-force-socom-proof
    missingEvidence: Contract IDs, unit names, test outcomes, or deployment references that independently
      verify Air Force and SOCOM usage beyond company or partner statements.
    whyItMatters: Those logos materially improve the expansion story, but today they do not carry the
      same proof weight as the Army evidence.
