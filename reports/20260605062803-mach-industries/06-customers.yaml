- id: sec604
  title: 'Retention and durability: what is still missing'
  body: 'Durability is where the public record becomes thin. There is no disclosed NRR, GRR, cohort retention,
    renewal rate, customer satisfaction score, reference-call program, or even a public list of follow-on
    order values by account. The best public continuity signal is simply that the Army appears multiple
    times in different contexts: contract award, later award modifications, and a separate field-evaluation
    setting. That does not establish classic retention. It only suggests that the relationship was not
    one-and-done within the visible record. The same caution applies to Air Force and SOCOM. Their names
    appear in 2025 and 2026 sources, but public materials still do not show whether those were pilot users,
    funded programs, test participants, or scaled operators. As a result, any durability conclusion must
    remain conservative. The right public answer is not to backfill fake percentages, but to mark the
    metrics as null and specify the diligence asks that would convert this chapter from customer-proof
    analysis into true retention analysis.'
  claimRefs:
  - CU004
  - CU021
  - CU022
  - CU023
  - CU032
  - CU042
  tableRefs:
  - TU004
- id: sec605
  title: Expansion vectors and concentration risks
  body: 'Mach does have visible expansion paths beyond its initial Army foothold, but each comes with
    concentration or proof-quality caveats. The first path is horizontal service-branch expansion through
    Air Force, SOCOM, and now a reported DIU / Navy program. The second is geographic expansion through
    allied governments and the foreign-observer surface created by African Lion. The third is payer diversification
    via Forge and partner manufacturing, where Heven provides a named example. The problem is that nearly
    all of these paths are still less evidentiary than the Army anchor. No allied country is named publicly.
    No non-Army contract value is disclosed. No top-customer share or backlog mix is visible. And because
    Mach''s products sit in autonomous strike and counter-drone categories, governance scrutiny from HRW,
    the UN, and the OECD could create extra procurement review, export friction, or reputational drag
    around broader adoption. The result is a customer story with real momentum but meaningful concentration
    risk: Mach looks much closer to a U.S.-defense-concentrated adoption curve than to a diversified multi-segment
    revenue base.'
