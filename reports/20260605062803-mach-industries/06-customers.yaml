- id: sec602
  title: Named customer proof and reference quality ladder
  body: 'The strongest named customer proof belongs to the Army because four different proof surfaces
    stack on top of one another. First, the Strategic Strike award shows a real public contract line.
    Second, the March 2025 press and news cycle adds mission context, buyer segment, and initial flight-test
    evidence. Third, the African Lion 26 page shows Mach systems entering soldier evaluation rather than
    staying at pure prototype-demo level. Fourth, USAspending modifications imply administrative continuity
    over time. That is still not the same thing as a production program of record, but it is meaningful
    customer proof. Air Force and SOCOM evidence sits a tier below because it comes through Nominal and
    financing disclosures rather than contract registries or unit releases. HevenDrones is real proof
    of outside demand for Forge, yet it proves partner-manufacturing pull more than end-user adoption
    of Mach''s own aircraft. The chapter therefore treats named logos as unequal: Army is reference-grade,
    Heven is ecosystem-grade, and Air Force / SOCOM are credible but still under-evidenced in public.'
