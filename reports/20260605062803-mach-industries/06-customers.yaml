  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A program-by-program roster of named customers, units, allied countries, stage, contract
      value, and delivered quantity across Viper, Glide, Stratos, Dart, Pike, Forge, and Energetics.
    whyItMatters: Without a complete roster, concentration, customer count, and reference quality can
      only be approximated from scattered public proof points.
    diligencePath: Request CRM export or account-level pipeline and backlog list with stage, product,
      branch, country, value, and referenceability flags.
    relatedQuestionRefs:
    - QU001
    - QU005
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, renewal rate, logo churn, satisfaction metrics, and any retention-cohort
      data by customer segment or program.
    whyItMatters: Durability and expansion cannot be underwritten from public signals alone when repeat-buy
      and satisfaction data are undisclosed.
    diligencePath: Request cohort tables, renewal history, reference calls, backlog aging, and customer-success
      metrics by program and segment.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU016
    - QU026
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, backlog mix by service branch or ally, and the share
      of bookings tied to Army-led programs versus other accounts.
    whyItMatters: The public record points to high national-security concentration, but the magnitude
      of top-customer exposure is still unknowable.
    diligencePath: Request bookings, backlog, revenue, and forecast concentration by customer, branch,
      country, and product family.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU026
    relatedTableRefs:
    - TU005
