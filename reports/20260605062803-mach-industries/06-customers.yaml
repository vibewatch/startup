company:
  name: Mach Industries
chapter:
  number: 6
  title: Customers
  summary: Mach Industries has real public customer proof, but it is heavily concentrated in U.S. defense
    and strongest for the Army. The public record supports a progression from Army development contract
    to Army field evaluation and broader Air Force / SOCOM / allied-government naming, yet retention,
    reorder, and concentration metrics remain largely undisclosed, so durability must still be underwritten
    through diligence asks rather than public cohorts.
sections:
- id: sec601
  title: Government-first segmentation and what is actually named
  body: 'Mach''s customer map is easiest to understand if the public record is divided into buyer classes
    rather than logo count. The first and most important class is direct U.S. defense demand, where the
    Army is the only account with both contract evidence and later field-evaluation evidence. The second
    class is adjacent U.S. military demand: Air Force and Special Operations Command are named repeatedly
    in company and partner materials, but they are not accompanied by contract numbers, unit names, or
    delivered-system disclosures. A third class is allied-government demand, which the company references
    in multiple funding announcements but does not name country by country. The fourth class is external
    manufacturing or ecosystem demand, where HevenDrones is the clearest named customer-like relationship
    for Forge. That segmentation matters because Mach is not selling into a diversified commercial base;
    public proof is concentrated in defense buyers, defense users, and partner OEMs, with the Army as
    the anchor account and every other segment materially more opaque.'
