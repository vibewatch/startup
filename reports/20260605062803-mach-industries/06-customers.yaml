figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The public defense-customer journey runs from requirement discovery to award, test, field evaluation,
    initial production, and only then to repeat-buy or allied expansion.
  data:
    nodes:
    - label: Requirement discovery
      detail: Mach appears first where U.S. defense buyers need long-range strike, stratospheric sensing,
        or swarm defense delivered faster than traditional primes.
      tone: neutral
    - label: Prototype / development award
      detail: The Strategic Strike contract is the clearest public proof that a buyer moved from interest
        into funded work.
      tone: positive
    - label: Flight-test proof
      detail: Public reporting then shifts to design lock, vertical takeoff, and early flight milestones
        that build buyer confidence.
      tone: positive
    - label: Field evaluation
      detail: African Lion moves proof into soldier use and procurement recommendation loops, which is
        stronger than lab-only testing.
      tone: positive
    - label: Production industrialization
      detail: Nominal plus Forge language suggests the next gating step is whether manufacturing and test
        rigor can support repeatable output.
      tone: warning
    - label: Repeat buy / program transition
      detail: 'This is where public evidence becomes weak: no disclosed reorder values, cohort data, or
        durable renewal metrics.'
      tone: risk
    - label: Allied / cross-service expansion
      detail: Air Force, SOCOM, allied-government, and DIU / Navy references imply expansion paths, but
        each still needs better proof.
      tone: warning
    - label: Partner-manufacturing loop
      detail: Forge can win outside OEM demand such as Heven, creating a second expansion loop even when
        end-user proof lags.
      tone: positive
  approximationNotes: Stages reflect public proof surfaces, not a disclosed internal CRM workflow. They
    summarize how the reviewed sources imply customer conversion and expansion happen.
  claimRefs:
  - CU003
  - CU006
  - CU015
