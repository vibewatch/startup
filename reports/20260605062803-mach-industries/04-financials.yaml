  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: core-financials
    missingEvidence: Absolute revenue, gross margin, monthly burn, cash balance, and runway.
    whyItMatters: Without these core metrics, the company cannot be underwritten on traditional venture
      or manufacturing cash-flow logic.
    diligencePath: Request the latest board package or monthly financial package with revenue, gross margin,
      opex, capex, cash, and runway.
    relatedQuestionRefs:
    - QI010
    - QI014
    - QI021
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Program-level pricing, contract structure, and realized package economics for Mach
      products and manufacturing services.
    whyItMatters: Quote-only pricing obscures revenue quality, gross margin potential, and customer concentration
      risk.
    diligencePath: Collect sample quotes, contract excerpts, and realized ASPs by program type.
    relatedQuestionRefs:
    - QI004
    - QI024
  - type: private-evidence-only
    severity: material
    topic: commercial-split
    missingEvidence: Named commercial customers and booked revenue by government vs. non-government line.
    whyItMatters: The 50/50 mix meaningfully affects concentration, collections, and valuation, but still
      relies almost entirely on founder commentary.
    diligencePath: Request customer list, revenue bridge, and backlog by customer type.
    relatedQuestionRefs:
    - QI022
    - QI025
  - type: private-evidence-only
    severity: minor
    topic: gtm-efficiency
    missingEvidence: CAC, sales-cycle, payback, channel economics, and win-rate data.
    whyItMatters: Sales efficiency is important because defense and manufacturing GTM can consume capital
      faster than software investors expect.
    diligencePath: Request pipeline conversion metrics, sales-cycle length, proposal-to-award ratios,
      and customer acquisition cost estimates.
    relatedQuestionRefs:
    - QI012
    - QI026
  - type: missing-source
    severity: minor
    topic: capital-obligations
    missingEvidence: Any public documentation of debt facilities, equipment finance, or project-finance
      obligations beyond equity raises and Form D notices.
    whyItMatters: Manufacturing businesses often hide leverage or equipment commitments outside headline
      fundraising announcements.
    diligencePath: Search UCC liens, lender filings, and future SEC or state notices; confirm directly
      in diligence.
    relatedQuestionRefs:
    - QI013
