company:
  name: Mach Industries
chapter:
  number: 4
  title: Financials
  summary: Mach’s public financial profile is dominated by capital access and manufacturing spend, not
    by disclosed operating results. The company has enough visible capital to scale aggressively, but
    public revenue quality, margin structure, burn, and runway remain too opaque for clean underwriting.
sections:
- id: revenue-model
  title: 'Revenue Model: Publicly Visible Streams Exist, But Revenue Quality Is Mostly Opaque'
  body: 'Mach is not a software company with transparent recurring revenue. Public evidence points instead
    to a blended hardware and manufacturing model built around direct government program sales, allied
    defense sales, component and subsystem sales through Mach Energetics and Mach Propulsion, and partner
    manufacturing utilization through Forge. Sacra explicitly frames the business around three revenue
    streams, while TechCrunch supplies the most provocative but least verified financial datapoint: Thornton’s
    claim that current revenue is split 50/50 between government and sales to other companies. That statement
    is directionally useful because it suggests Mach is not purely dependent on a single contracting channel.
    But it is still far from underwritable. No public source in this run provides absolute revenue, customer
    concentration, ARR, backlog, or collections data. The only hard public government revenue floor in
    hand is the $1.5 million Strategic Strike award visible in USAspending. Everything else points to
    potential revenue quality, not proven recurring economics.'
  claimRefs:
  - CI010
  - CI011
  - CI014
  - CI015
  - CI016
  - CI017
  - CI027
  - CI039
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: unit-economics-and-costs
  title: 'Unit Economics: Vertical Integration May Help, But It Also Raises the Fixed-Cost Base'
  body: 'Mach’s public financial logic is manufacturing-heavy. The company is adding facilities, buying
    constrained suppliers, building a jet-engine operation, and scaling test infrastructure before it
    has disclosed the metrics that normally justify those moves. TechCrunch’s Exquadrum coverage is therefore
    especially important: it argues that the acquisition improves unit economics across Mach’s platforms
    at the precise moment the company begins to scale. That logic is plausible. Controlling solid rocket
    motors, energetics testing, and micro-jet production should reduce supplier markups and lead-time
    risk. But the same decision also adds 85 employees, a 70,000-square-foot Victorville footprint, test
    infrastructure, and more working-capital burden. Sacra’s estimate that products cost under $20 million
    to develop with roughly three-year maturation cycles suggests management thinks platform creation
    can be repeated many times before any one product fully monetizes. That is a venture-manufacturing
    model, not a mature production one. It can work, but it requires both patient capital and repeatable
    conversion from development to volume delivery.'
  claimRefs:
  - CI019
  - CI022
  - CI023
  - CI024
  - CI029
  - CI030
  - CI031
  - CI032
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-adequacy
  title: 'Capital Adequacy: Mach Has Raised Enough to Scale Aggressively, Not Enough to Skip Proving Revenue'
  body: 'The public funding record shows why Mach can move this quickly. The SEC Form D tied to the 2025
    raise shows a roughly $102 million exempt offering, which lines up with the reported Series B. By
    June 2026 the company had raised $300 million more at a $1.8 billion valuation, taking total disclosed
    capital to roughly $485 million across seed, Series A, Series B, and Series C. Those are serious resources
    for a three-year-old defense manufacturer, and the use-of-funds language is consistent across announcements:
    build Forge, expand Mach Propulsion, deepen government relationships, hire aggressively, and accelerate
    product development. But capital adequacy is still different from financial adequacy. Public sources
    do not disclose cash on hand, monthly burn, debt obligations, or runway. They do disclose a 115,000-square-foot
    Huntington Beach facility, four more planned production facilities, a 12,000-engine annual propulsion
    target, and a 70,000-square-foot Victorville acquisition. In other words, the visible cash demands
    are obvious while the visible cash buffer is not. That makes financing dependency a key part of the
    underwriting story.'
