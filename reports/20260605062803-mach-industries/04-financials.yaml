- id: peer-context
  title: 'Peer Context: Mach’s Price Is Lower Than the Category Leaders, But Still Ambitious'
  body: On headline valuation alone, Mach can look cheaper than the biggest defense-autonomy names. Anduril
    now sits at $61 billion, Shield at $12.7 billion, Saronic at $9.25 billion, and Skydio at $4.4 billion.
    Mach at $1.8 billion is therefore not trying to clear the same valuation bar as the most mature category
    leaders. But the comparison cuts both ways. Many of those peers have either more public contract proof,
    more disclosed scale, or stronger installed-base evidence than Mach. Mach’s lower price partly reflects
    that gap. At the same time, it is still an ambitious valuation for a company with no disclosed revenue,
    margin, or cash-flow data. Public investors cannot yet tell whether Mach’s valuation is conservative
    relative to its potential or simply early relative to the evidence. The strongest pro-valuation argument
    is that the market is paying for industrial speed and scarce supply-chain control. The weakest argument
    is that the market has already seen the revenue quality to support a billion-plus manufacturing multiple.
  claimRefs:
  - CI005
  - CI008
  - CI028
  - CI037
  - CI038
  figureRefs:
  - FI003
- id: verdict
  title: 'Financial Verdict: Credible Capital Access, Low Public Revenue Quality, High Diligence Burden'
  body: 'The public record supports one clear conclusion: Mach can raise capital. It does not yet support
    the stronger conclusion that Mach has already proven durable economics. There are enough signals to
    believe the company has a plausible revenue model — government contracts, allied demand, component
    sales, and partner-manufacturing work — and enough industrial signals to explain why investors wrote
    large checks. But almost every underwriting metric that matters remains private. There is no public
    gross margin, no monthly burn, no cash balance, no working-capital disclosure, no customer concentration,
    and no product pricing schedule. The 50/50 revenue-mix claim is interesting but not enough. As a result,
    this chapter’s financial verdict is intentionally split. On capital access and strategic fundraising,
    Mach looks strong. On revenue quality, margin path, and ability to self-fund growth, public evidence
    is still weak. The next major inflection will be whether production-scale contracts and disclosed
    operating results begin to replace financing announcements as the company’s main proof point.'
  claimRefs:
