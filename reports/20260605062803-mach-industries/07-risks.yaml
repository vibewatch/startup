  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-classification
    missingEvidence: Product-by-product export classifications, license status, foreign-person access controls, and any commodity-jurisdiction determinations.
    whyItMatters: Exact export treatment determines hiring flexibility, allied-sales speed, and whether scaled manufacturing can move without licensing delays.
    diligencePath: Request the export-control matrix by product line plus any outside-counsel classification memos and license history.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: cyber-assurance
    missingEvidence: System security plan, NIST 800-171 or CMMC status, recent penetration tests, subcontractor cyber-flowdown controls, and any incident log.
    whyItMatters: DFARS obligations matter only if the control environment is real, documented, and tested across the actual contractor information systems.
    diligencePath: Request the SSP, latest gap assessment, incident-response runbook, and evidence of 72-hour reporting readiness.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: booking-concentration
    missingEvidence: Backlog, booking, and production-commitment splits across Army, allies, partner manufacturing, and non-government channels.
    whyItMatters: Without concentration data, investors cannot tell whether Mach has diversified demand or a few public proof points carrying a very large valuation narrative.
    diligencePath: Request a customer concentration table with contract stage, value, backlog, expected delivery window, and renewal or follow-on status.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Sortie counts, mission-success rates, intercept probabilities, first-pass yield, defect rates, scrap, and field-failure data by program and facility.
    whyItMatters: Rapid-build narratives can hide a fragile operating system if reliability or manufacturing yield has not matured alongside speed.
    diligencePath: Request a program dashboard covering flight-test cadence, yield, acceptance criteria, and quality-escape history for Viper, Dart, Stratos, and Venom-like prototypes.
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: minor
    topic: site-permits-and-inspections
    missingEvidence: Facility-specific environmental permits, hazardous-material handling authorizations, and inspection history for Huntington Beach, Victorville, and Mach Propulsion sites.
    whyItMatters: A clean public narrative on expansion does not confirm that each site can ramp hazardous work without permitting or inspection friction.
    diligencePath: Pull local and state permit records plus any publicly disclosable inspection or enforcement history for each named site.
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-validation
    missingEvidence: Program-level cost build, contribution margin, working-capital requirements, burn, and cash runway by scenario.
    whyItMatters: The investment case depends on whether capital-funded vertical integration actually converts into durable margins instead of just higher fixed cost.
    diligencePath: Request the board or management operating model that bridges capital spend to unit-cost reduction, gross margin, and cash runway.
    relatedTableRefs:
    - TR005
