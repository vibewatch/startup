- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export or autonomy-governance shock
    - Policy or legal change
    - Mach products become explicitly constrained by new export, autonomy, or allied-procurement rules
    - Pause underwriting until management provides product-by-product compliance path
  - - Operational reliability miss
    - Program test or field signal
    - Publicly disclosed failure, major safety event, or repeated slip without offsetting reliability data
    - Re-underwrite delivery assumptions and move risk rating toward critical
  - - Demand concentration
    - Order-conversion signal
    - No visible follow-on production proof while valuation and facility footprint keep rising
    - Treat government concentration as thesis-threatening rather than merely early-stage
  - - People and integration strain
    - Leadership or org event
    - Founder departure, major leadership churn, or visible integration stall at Mach Energetics
    - Require a revised execution plan before new capital is committed
  - - Financing dependency
    - Capital-markets event
    - Next raise arrives before backlog, margin, or customer-concentration disclosure improves
    - Assume dilution risk is driving the case more than operating proof
  - - Compliance control failure
    - Cyber, safety, or environmental event
    - Reportable incident, enforcement action, or permit-related shutdown
    - Escalate to a stop-work diligence posture and revisit investment thesis entirely
  notes: These triggers are intended to be monitorable from public or management-provided diligence materials. Crossing any threshold does not automatically kill the company, but it does invalidate a low-friction scaling thesis.
