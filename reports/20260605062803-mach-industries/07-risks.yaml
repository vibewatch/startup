company:
  name: Mach Industries
chapter:
  number: 7
  title: Risks
  summary: Mach's highest residual risks are export and autonomy-governance scrutiny, operational scale outrunning public reliability proof, dependence on government buyers and key partners, founder- and hiring-driven execution strain, and a capital-intensive model that still lacks public backlog and margin disclosure.
sections:
- id: SR001
  title: Legal, Regulatory, and Governance Risk
  body: 'Mach''s highest legal-regulatory risk is not a disclosed lawsuit but a stack of obligations that gets heavier as the company moves from prototype narrative to scaled defense production. The company now openly describes strike aircraft, counter-UAS systems, propulsion, energetics, and government-facing manufacturing infrastructure. That combination brings three overlapping burdens. First, privacy and basic corporate compliance are real, even if lower-stakes than weapons regulation: Mach''s own policy says it processes recruiting, vendor, website, and site-security data under CCPA-style notice obligations. Second, its Supplier Quality Manual explicitly points suppliers at FAR and DFARS disciplines, while DFARS 252.204-7012 shows how quickly cyber and incident-reporting obligations harden once covered defense information is in scope. Third, the portfolio almost certainly touches export-control and autonomy-governance questions that are not answered publicly today. Cornell''s ITAR text,
    UN calls for new rules on lethal autonomy, HRW criticism of weakened human-control standards, and OECD''s hazard entry on Mach all point the same direction: legal and policy scrutiny will rise with scale. Public mitigations exist, but exact classifications, licenses, and cyber posture remain private.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
