- id: SR002
  title: Operational, Quality, and Safety Risk
  body: Mach's second major risk is that its speed narrative outruns the amount of public reliability evidence available. Venom reached first flight in 71 days, Strategic Strike has demanding range and payload goals, Dart is already described in detect-to-engage terms, and African Lion suggests at least some systems are moving into soldier evaluation. Those are meaningful signals, but they are not the same as disclosed sortie counts, manufacturing yield, intercept probability, or failure-rate data. The risk becomes sharper because Mach is not scaling a simple software service. It is adding a jet-engine factory, an energetics-linked Victorville facility, and supplier-control requirements that look like real aerospace production governance. OSHA and EPA rules illustrate the kind of hazardous-process discipline these operations can require, while GAO, FAA, and CISA all show how counter-UAS and broader airspace operations carry effectiveness limits and safety externalities. The supplier manual
    is a genuine mitigation signal because it documents inspection, change control, and counterfeit prevention. Still, the residual exposure stays high until output metrics catch up to process claims.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
