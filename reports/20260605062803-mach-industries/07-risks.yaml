- id: SR003
  title: Partner, Dependency, and Concentration Risk
  body: 'Dependency risk is unusually central to the Mach story because the company is trying to prove scale before it has disclosed a broad base of public contracts. USAspending shows a real Army award, but also highlights how thin the visible federal floor remains relative to a $1.8 billion valuation. That makes concentration a live issue: the public buyer story is still mostly Army, broader U.S. defense relationships, allies, and a small set of partner proofs. Operationally, several outside nodes now sit on the critical path. Nominal is positioned as test-and-operations infrastructure from early flight testing through high-rate production. Heven proves that Forge can attract outside manufacturing work, but it also shows that partner-utilization assumptions matter. Exquadrum highlights the underlying reason Mach is vertically integrating in the first place: critical propulsion and energetics capacity is scarce, and current propulsion strategy is still transitional. In other words, vertical
    integration reduces one class of dependency while creating another class of execution dependency on facilities, permits, data systems, and the conversion of government relationships into durable orders.'
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR028
  - CR029
