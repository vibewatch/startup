- id: SR004
  title: People and Execution Risk
  body: 'People risk at Mach is less about headline turnover and more about organizational stretch. The company is only about three years old by the 2026 run date, yet it is simultaneously operating multiple vehicle programs, integrating a sizeable acquisition, building manufacturing infrastructure, and hiring across engineering, manufacturing, software, quality, and operations. Media coverage also remains highly founder-centric: Ethan Thornton is still the easiest named executive for outside stakeholders to map to strategy, fundraising, and product ambition. That is an asset when momentum is positive, but it also creates key-person risk if execution slips, government relationships wobble, or internal delegation lags the scope of the build-out. The Exquadrum deal adds another layer because leadership integration matters as much as facility integration. Meanwhile, the supplier manual makes clear that Mach''s execution burden extends into sub-tier oversight, meaning internal headcount alone
    is not the whole story. The residual question is whether the management system is maturing as fast as the product and factory narrative.'
  claimRefs:
  - CR032
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  tableRefs:
  - TR004
- id: SR005
  title: Financial Model Risk, Mitigations, and Thesis-Break Triggers
  body: 'Mach has enough capital to move fast, but not enough public operating disclosure to make that speed low-risk. By June 2026 the company had disclosed roughly $485 million of capital raised and a $1.8 billion valuation, and the use-of-funds language is explicit: expand Forge, stand up Mach Propulsion, advance second-generation systems, and deepen defense relationships. What remains missing is the model that connects those inputs to durable economics. Public sources still do not show revenue, backlog, burn, gross margin, or customer concentration. Even the most interesting datapoints — the claimed 50/50 government versus other-company revenue mix and the assertion that Exquadrum improves unit economics — are management-reported rather than independently validated. That leaves the core investment risk in a familiar defense-startup pattern: valuation and capex have already scaled, while production proof and economics disclosure lag. The right monitoring posture is therefore trigger-based.
    A serious safety or compliance event, a stalled conversion from development work to visible orders, or a funding round that arrives before proof points improve would all change the underwriting case materially.'
