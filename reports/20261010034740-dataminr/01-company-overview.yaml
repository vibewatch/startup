callouts:
  - calloutType: insight
    title: Transition from Venture Equity to Structured Debt Financing
    body: Dataminr's funding trajectory reveals a notable structural pivot after 2021. Following its $475 million Series F equity round at a $4.1 billion post-money valuation in March 2021, the company did not raise another priced equity round. Instead, throughout 2025, Dataminr secured $485 million in convertible debt and credit facilities led by Fortress Investment Group, NightDragon, and HSBC. This reliance on structured debt preserves the headline $4.1 billion valuation while introducing potential liquidation overhang and coupon burdens.
    claimRefs:
      - CO004
      - CO005
      - CO006
  - calloutType: risk
    title: Civil Liberties Scrutiny and Public Surveillance Controversies
    body: Dataminr faces persistent reputational and regulatory scrutiny regarding public-sector surveillance use cases. Independent investigative reporting highlighted monitoring of domestic civil protests and law-abiding demonstrations on behalf of police departments and federal agencies. While Dataminr maintains that First Alert delivers non-demographic breaking news alerts, public scrutiny creates ongoing compliance and brand risks among commercial enterprise and international buyers.
    claimRefs:
      - CO011
      - CO012
