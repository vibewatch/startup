company:
  name: Dataminr
chapter:
  number: 1
  title: Company Overview
  summary: Dataminr is a New York-based real-time event and risk intelligence provider founded in 2009 that detects physical, digital, and cyber threats across multimodal public data streams for corporate, government, and defense clients. The company reached a $4.1 billion equity valuation at its Series F in March 2021 and approached $200 million in ARR, but subsequently transitioned to structured financing by raising $485 million in convertible debt and credit throughout 2025. In August 2026, Dataminr secured a landmark 5-year, $318 million enterprise contract with the U.S. Department of War, solidifying its defense footing while operating amid ongoing scrutiny regarding public-sector surveillance applications.
sections:
  - id: company-identity-and-business-model
    title: Company Identity and Business Model
    body: Founded in 2009 by Ted Bailey, Jeff Kinsey, and Sam Hendel, Dataminr, Inc. has established itself as a pioneer in real-time information discovery and AI-driven risk intelligence. The company operates from its global headquarters in New York City with engineering and regional hubs across North America, Europe, and Australasia. Dataminr's core business model centers on delivering subscription-based Software-as-a-Service (SaaS) intelligence solutions that process public data signals across text in 150 languages, imagery, video, audio, and sensor inputs to surface breaking developments before traditional news media. The commercial portfolio is bifurcated into Dataminr Pulse for corporate enterprise security and cyber risk defense, and First Alert for emergency responders, defense personnel, and public-sector agencies. Dataminr reports approaching $200 million in annual recurring revenue while serving a customer base that encompasses two-thirds of the Fortune 50, half of the Fortune 100, and more than 100 federal, state, and international government bodies.
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO013
      - CO014
    tableRefs:
      - TO001
  - id: founders-governance-and-leadership
    title: Founders, Governance, and Leadership
    body: Dataminr's organizational leadership reflects continuity at the founder level paired with seasoned enterprise software executives recruited to scale go-to-market execution. Chief Executive Officer Ted Bailey has led the company since its 2009 inception, maintaining primary strategic direction and high-level relationships across government and enterprise clients. Co-founder Jeff Kinsey serves as Chief Technology Officer, overseeing proprietary multimodal foundation model architectures and large-scale data ingestion infrastructure. To accelerate commercialization and partner expansion, Dataminr appointed Brian Gumbel as President and Chief Operating Officer, drawing on senior executive leadership experience from Armis, Forescout Technologies, Tanium, and Cisco. Gumbel leads global sales operations, customer success, marketing, and strategic channels, supported by Chief Partner Officer Matthew Harrell. While operating leadership is clearly defined, Dataminr does not publicly disclose its comprehensive Board of Directors roster, committee governance, or independent director oversight.
    claimRefs:
      - CO001
      - CO003
    tableRefs:
      - TO002
  - id: capitalization-valuation-and-investors
    title: Capitalization, Valuation, and Investor Syndicate
    body: Dataminr has accumulated more than $1.5 billion in lifetime capital commitments across venture equity, convertible notes, and credit facilities. The company reached its peak public valuation benchmark in March 2021 upon closing a $475 million Series F financing round at a $4.1 billion post-money valuation, supported by growth equity leaders including Institutional Venture Partners, Eldridge Industries, Valor Equity Partners, Morgan Stanley Tactical Value, and MSD Capital. Rather than testing public markets or pricing a new equity round during the subsequent venture recalibration, Dataminr executed a major capital restructuring throughout 2025. The company secured $485 million in structured financing, consisting of an $85 million convertible and credit package from NightDragon and HSBC in March 2025, followed by $100 million in April 2025 and $300 million in September 2025 in convertible debt from Fortress Investment Group. This financing strategy preserved the nominal $4.1 billion valuation but created substantial liquidation overhang and structural debt priority ahead of common equity.
    claimRefs:
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO003
  - id: operational-scale-milestones-and-controversies
    title: Operational Scale, Milestones, and Public Controversies
    body: Dataminr's operational evolution demonstrates rapid technological advancement counterbalanced by civil liberties scrutiny and workforce adjustments. In 2024, the company launched ReGenAI, introducing generative AI models that dynamically regenerate breaking event briefs in real time. This capability culminated in August 2026 when Dataminr secured a landmark 5-year, $318 million enterprise contract with the U.S. Department of War for its First Alert Advanced system, deploying autonomous intelligence across all military branches through 2031. However, this deep government integration has generated persistent controversy. Investigative reporting revealed that law enforcement agencies and U.S. Marshals utilized Dataminr to monitor domestic demonstrations, including constitutionally protected abortion rights rallies and racial justice protests. In 2025, reports documented over 50 real-time alerts provided to the Los Angeles Police Department regarding campus demonstrations. Concurrently, Dataminr rationalized operating costs, reducing headcount to approximately 753 employees in 2026 from peak levels exceeding 1,050 in 2022.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
    figureRefs:
      - FO001
