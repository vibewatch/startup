  - id: FI001
    title: 收入模型桥接与缺失的转换证据
    type: flow
    summary: 公开证据揭示了商业路径，却没有提供将使用量桥接至毛利所需的定价、计费、收入确认或成本转换信息。
    data:
      nodes:
        - id: customer-need
          label: 客户情报需求
          detail: 企业安全、网络防御、公共部门或新闻编辑室工作流
        - id: product-access
          label: Dataminr 产品访问
          detail: Corporate Security、Cyber Defense、First Alert 或 Dataminr 新闻版
        - id: commercial-unit
          label: 合同和商业计量单位
          detail: 一笔公共部门授标公开了合同结构；席位、站点、使用量和 API 单位未披露
        - id: billing
          label: 账单和积压
          detail: 融资金额、里程碑、选项、开票和递延收入均不可得
        - id: revenue
          label: 已确认收入
          detail: 2024 年曾报告接近 $200 million 的运行率代理值，但会计基础未说明
        - id: gross-profit
          label: 毛利和现金贡献
          detail: 毛利率、服务交付成本、营运资金、资本开支和现金转换均不可得
    approximationNotes: 这是定性顺序，不是按比例绘制的漏斗；桥接图不会根据客户活动推断转换率或收入确认。
    claimRefs:
      - CI002
      - CI004
      - CI006
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈，展示 Dataminr 从多模态公共数据摄取，经专有模型编排到企业集成的管线。
    data:
      layers:
        - label: 第 1 层：多模态摄取管线
          detail: 持续摄取 1M+ 个公共来源、社交平台、无线电传输、暗网和 IoT 传感器的数据，覆盖 150+ 种语言。
        - label: 第 2 层：事件检测与聚类引擎
          detail: 多模态融合算法过滤噪声、聚类相互印证的数据，并分配地理空间和实体坐标。
        - label: 第 3 层：专家参与的人工核验
          detail: 领域专家实时标注，结合主动反馈循环，持续优化 ML 模型和告警质量。
        - label: 第 4 层：专业 LLM 编排
          detail: 由 50-60+ 个经过微调的领域专用模型组成，训练数据来自 Dataminr 10+ 年的专有事件档案。
        - label: 第 5 层：智能体上下文与生成式智能
          detail: Intel Agents 和 ReGenAI 引擎生成实时 Live Event Briefs、战术预测和情境影响分析。
        - label: 第 6 层：交付与合作伙伴生态
          detail: 网页 / 移动应用、REST v4 API，以及与 Palantir Foundry、Esri ArcGIS 和 Elastic Security 的原生集成。
    approximationNotes: null
    claimRefs:
      - CE002
      - CE004
      - CE005
  - id: FU001
    title: 客户旅程与扩张循环
    type: journey-map
    summary: 客户采用阶段，从最初摄取事件发现告警，到企业范围的网络防御和伙伴驱动的交叉销售。
    data:
      items:
        - label: 事件发现与试点告警
          stage: Evaluation
          touchpoints:
            - 单个安全运营中心数据流
            - 试用观察名单配置
            - 移动端实时突发告警
          detail: 最初通过网页门户或合作伙伴试用启动，用于监测实体威胁。
        - label: 初始生产部署
          stage: Land
          touchpoints:
            - First Alert 席位许可
            - Pulse 企业安全部署
            - 直接电子邮件和 webhook 集成
          detail: 核心危机团队签订年度订阅；典型政府档位为每用户 $6k-$10k。
        - label: 工作流与渠道集成
          stage: Operationalization
          touchpoints:
            - Slack 和 Microsoft Teams 机器人路由
            - Esri ArcGIS 地理空间叠加层
            - Splunk 和 Palantir Foundry 连接器
          detail: 告警直接嵌入企业 SOC 日常作战手册和高管升级渠道。
        - label: 地理与多部门扩张
          stage: Expand
          touchpoints:
            - 全球设施地理围栏
            - 高管保护追踪
            - 海外旅行安全风险监测
          detail: 在各业务部门、校园设施和海外旅客追踪范围内扩大企业级覆盖。
        - label: 网络防御与威胁情报交叉销售
          stage: Cross-Sell
          touchpoints:
            - Dataminr 网络防御版平台
            - ThreatConnect 威胁情报管理
            - 持续暴露面优先级排序
          detail: 借助收购的 ThreatConnect 能力，将外部事件前瞻与内部 IT 遥测融合。
        - label: 企业与渠道分发规模化
          stage: Platform Lock-In
          touchpoints:
            - TD SYNNEX 经销商网络分发
            - 多年期企业主协议
            - 五年期机构范围国防项目
          detail: 合并为合同金额高、渠道分发广泛的多年期企业协议。
    approximationNotes: 采用阶段和扩张触点综合自客户案例、产品集成指南和合作伙伴网络分发公告。
    claimRefs:
      - CU001
      - CU006
      - CU009
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 风险矩阵按可能性、影响和缓解成熟度，对核心威胁维度进行排序。
    approximationNotes: 风险等级和缓解成熟度评分均为定性分类，依据公开调查报道和客户文档整理得出。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
      - CR007
      - CR010
      - CR013
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
      rows:
        - label: 国内监控审查
          values:
            - label: 高
              tone: risk
              note: 有记录的国内抗议活动预警历史，持续引发公民自由方面的问询
            - label: 高
              tone: risk
              note: 可能触发机构合同限制，或损害企业买家的品牌认知
            - label: 低
              tone: warning
              note: 公司声称自身定位是新闻预警，但缺乏独立监督机制
        - label: 社交媒体平台数据直连
          values:
            - label: 中
              tone: warning
              note: 与 X 及主要网络平台的商业许可条款需要定期重新谈判
            - label: 严重
              tone: risk
              note: 失去数据直连访问权将从根本上削弱核心实时延迟优势
            - label: 中
              tone: neutral
              note: 覆盖 1M 个来源、传感器和暗网的多模态扩张，可部分缓解单一来源风险
        - label: 公共部门收入集中度
          values:
            - label: 中
              tone: warning
              note: 空军 $317.8M 合同金额占未来收入承诺的比重极高
            - label: 高
              tone: risk
              note: 国防预算重新分配或项目重组将实质性损害现金流
            - label: 高
              tone: positive
              note: 五年固定总价结构锁定基础资金，覆盖至 June 2031
        - label: 预警精准度与误报
          values:
            - label: 高
              tone: risk
              note: 社交媒体和传感器噪声在突发事件中自然会产生未经验证的信号
            - label: 中
              tone: warning
              note: 企业因误报而过早采取行动，会带来运营责任和疲劳
            - label: 中
              tone: neutral
              note: ReGenAI 和 Multi-Modal Fusion AI 会交叉关联信号，但仍需人工核验
        - label: EU DORA 与数据隐私合规
          values:
            - label: 高
              tone: risk
              note: DORA 规定的严格第三方风险规则，以及不断变化的州级 AI 监管要求
            - label: 中
              tone: warning
              note: 欧洲监管机构的审计，以及潜在的合规整改支出
            - label: 中
              tone: neutral
              note: 企业 SOC 认证和标准客户数据处理协议
        - label: 可转债清算悬置风险
          values:
            - label: 中
              tone: warning
              note: 2025 Fortress 和 NightDragon/HSBC 可转债融资安排没有公开条款披露
            - label: 高
              tone: risk
              note: 优先清算权和转换折价可能稀释普通股股东权益
            - label: 低
              tone: warning
              note: 未公开的契约结构要求尽调期间提供私下披露的附表
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这套决策顺序先把运营层面的证明与融资、定价证据分开，再给出是否继续跟踪的建议。
    data:
      nodes:
        - label: 运营规模
          detail: 公司披露的 ARR 在 March 2025 接近 $200M
        - label: 独立采购证明
          detail: 有 8 家供应商报价的竞争性 $318M 国防合同
        - label: 历史估值锚点
          detail: March 2021 的 $4.1B 投后估值
        - label: 当前不利指标
          detail: Forge 在 October 9, 2026 显示的 $698.86M 估算值
        - label: 证据门槛
          detail: 仍需经审计的指标、股权结构表、转换条款和可执行价格
        - label: 决策
          detail: 继续跟踪 / 继续研究；公开数据未见足以单独支撑的定价建议
    approximationNotes: 有序的定性决策流程；金额保留原有期间，且 Forge 估算值不作为交易价格呈现。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV009
      - CV010
      - CV011
      - CV015
