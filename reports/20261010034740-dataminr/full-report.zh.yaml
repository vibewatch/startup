              - CV012
      - number: '8.2'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              清晰的历史锚点是 Dataminr 2021 年 3 月的融资：公司宣布以 $4.1 billion 估值完成 $475 million 融资。对于 2026 年入场决策，这一估值已过时。Yahoo
              Finance 目前显示，Forge Data 对 Dataminr 的估计估值为 $698.86 million，Forge Price 截至 2026 年 10 月 9 日为 $7.50，意味着相比 2021
              年 headline 估值折价约 83%。这一信号不利，但不能直接执行：Forge 表示其价格来自专有模型，并非报价，不代表供需，也可能依赖有限数据。2025 年融资还混合了可转债和信贷；NightDragon
              只表示有意通过 SPV 提供最多额外 $100 million
              的可转债额度。因此，融资额不等于可用现金，任何已披露金额都不能单独确定稀释或清算优先级。入场纪律应建立在真实条款清单、完全摊薄持股结构、证券优先级和经审计的当前指标之上，而不是任一公开估值 headline。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
