      - number: '3.3'
        title: 定价、产品包装、警报疲劳与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的商业模式依赖年度和多年期企业合同，价格约为每位用户每年 $30,000 或以上；在计入分析师人力成本前，平台年度总支出往往还需达到 $150,000 至 $500,000
              或以上。这种高起步定价使其容易被没有专职 3 至 5 名分析师 GSOC 团队的买家替代。区域运营商、采掘企业和人道组织越来越多地同时使用多个平台，或转向 Region Alert
              等按参与度收费的结构化情报供应商；后者提供经过整理的多语言简报，综合威胁信号，而非持续推送未经核验的原始警报。此外，独立金融基准评估将 Dataminr 的价格价值打为 10 分制 5
              分，指出信息过载和仅面向高端企业的访问壁垒。Dataminr 的护城河依靠专有多模态模型、深度政府工作流整合和实时摄取管线，但转换成本并不对称：在带有定制 API 集成的关键任务型 GSOC
              中很高，在次级风险和旅行照护部门却较为脆弱。
