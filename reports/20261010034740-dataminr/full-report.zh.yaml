  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点认为，Dataminr 已达到有意义的运营规模，并通过了高难度采购验证。公司在 2025 年 3 月称 ARR 接近 $200 million；其网站则称客户包括 100 多家美国政府机构、20-plus
              个国际政府、Fortune 50 的三分之二和 Fortune 100 的一半。最有力的独立证据是 DefenseScoop 的报道：一次有 8 个报价的竞争性采购最终产生 $318 million
              的国防部订单；Dataminr 的联合发布公告称项目期限为五年、持续至 2031 年。反论点是财务不透明，而不是已证明的需求不足。指定公开证据没有披露经审计的增长、毛利率、留存、现金烧钱、现金余额、客户集中度，或
              2025 年融资的转换和优先级条款。融资数据库对累计融资额也存在重大分歧，因此没有股权结构表，就不应把总融资额或假定的优先股堆叠视为定论。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV016
