chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Ted Bailey、Jeff Kinsey 和 Sam Hendel 于 2009 年创立 Dataminr, Inc.，公司已成为实时信息发现和 AI
              驱动风险情报领域的先行者。公司全球总部位于纽约市，并在北美、欧洲和澳大拉西亚设有工程及区域枢纽。Dataminr 的核心模式是提供订阅制 Software-as-a-Service（SaaS）情报解决方案，处理
              150 种语言的文本、图像、视频、音频和传感器输入中的公开数据信号，在传统新闻媒体之前发现突发进展。商业产品分为面向企业安全和网络风险防御的 Dataminr
              Pulse，以及面向应急响应人员、国防人员和公共部门机构的 First Alert。Dataminr 称其 ARR 接近 $200 million，客户包括 Fortune 50 的三分之二、Fortune
              100 的一半，以及 100 多个联邦、州和国际政府机构。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
      - number: '1.2'
        title: 创始人、治理与领导层
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的组织领导层既保持创始人层面的连续性，也引入经验丰富的企业软件高管来扩大市场执行。首席执行官 Ted Bailey 自 2009
              年公司成立起领导公司，持续负责主要战略方向以及与政府和企业客户的高层关系。联合创始人 Jeff Kinsey
              任首席技术官，负责专有多模态基础模型架构和大规模数据摄取基础设施。为加快商业化和合作伙伴拓展，Dataminr 任命 Brian Gumbel 为总裁兼首席运营官；他曾在 Armis、Forescout
              Technologies、Tanium 和 Cisco 担任高级管理职务。Gumbel 负责全球销售运营、客户成功、营销和战略渠道，并由首席合作伙伴官 Matthew Harrell
              支持。虽然运营领导分工清晰，Dataminr 并未公开披露完整董事会名单、委员会治理或独立董事监督情况。
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: 资本结构、估值与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              Dataminr 通过风险股权、可转债和信贷工具累计获得超过 $1.5 billion 的终身资本承诺。公司在 2021 年 3 月完成 $475 million 的 Series F
              融资时达到公开估值基准高点，投后估值为 $4.1 billion，参与者包括 Institutional Venture Partners、Eldridge Industries、Valor Equity
              Partners、Morgan Stanley Tactical Value 和 MSD Capital 等成长股权投资者。随后风险投资市场重新定价，公司没有测试公开市场或定价新一轮股权融资，而是在 2025
              年全面重组资本。公司获得 $485 million 的结构化融资：2025 年 3 月从 NightDragon 和 HSBC 获得 $85 million 的可转债及信贷组合，随后从 Fortress
              Investment Group 获得 2025 年 4 月的 $100 million 和 9 月的 $300 million 可转债融资。该策略保留了名义上的 $4.1 billion
              估值，却带来显著的清算悬置和高于普通股的结构性债务优先级。
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO010
      - number: '1.4'
        title: 运营规模、里程碑与公共争议
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的运营演进折射出技术快速进步、公民自由审查与员工规模调整之间的拉扯。公司在 2024 年推出 ReGenAI，引入可实时动态重生成突发事件简报的生成式 AI 模型。该能力在 2026 年 8
              月达到阶段性成果：Dataminr 为 First Alert Advanced 系统拿下美国战争部一份具有里程碑意义的 5 年期、$318 million 企业合同，向所有军种部署自主情报能力，期限至 2031
              年。然而，这种深度政府整合也持续引发争议。调查报道显示，执法机构和 U.S. Marshals 曾利用 Dataminr 监控国内示威，包括受宪法保护的堕胎权集会和种族正义抗议。2025 年，报道记录了
              Dataminr 向 Los Angeles Police Department 提供超过 50 条有关校园示威的实时警报。与此同时，Dataminr 压缩运营成本，员工数从 2022 年超过 1,050
              人的峰值降至 2026 年约 753 人。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO009
              - CO010
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从风险股权转向结构化债务融资
            body: >-
              Dataminr 的融资轨迹显示，2021 年后公司发生了显著的结构转向。公司于 2021 年 3 月完成 $475 million 的 Series F 股权融资，投后估值为 $4.1
              billion，此后未再进行定价股权融资。相反，Dataminr 在 2025 年通过 Fortress Investment Group、NightDragon 和 HSBC 主导的可转债与信贷工具获得
              $485 million。依赖结构化债务保住了 $4.1 billion 的名义估值，同时引入潜在清算悬置和票息负担。
            calloutType: insight
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: callout
            title: 公民自由审查与公共监控争议
            body: >-
              Dataminr 因公共部门监控使用场景持续面临声誉和监管审查。独立调查报道指出，警察部门和联邦机构曾利用其监控国内公民抗议和守法示威。Dataminr 坚称 First Alert
              提供的是不基于人口属性的突发新闻警报，但公共审查仍给商业企业和国际买家带来持续的合规与品牌风险。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、企业范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              实时事件和威胁情报位于原始公开数据摄取与下游危机响应之间的独立运营层。Dataminr 将核心边界定义为低延迟检测实体中断、网络暴露和突发事件，信号来自超过 100
              万个公开数据源。该类别不包括通用安全信息和事件管理日志监控、内部遥测以及回溯式媒体剪辑服务，因为它们缺乏实时公开信号发现能力。现状替代方案主要是人工分析师监控、开源情报抓取和传统新闻通讯社；在事件快速发展的情况下，它们会造成严重延迟和警报疲劳。Dataminr
              通过建立自动化指示与预警能力，瞄准需要即时态势感知的关键任务型企业安全运营中心和公共部门国防指挥机构。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角与受约束的增长路径
        blocks:
          - type: paragraph
            body: >-
              更广义的威胁情报和风险分析行业规模估计全球为 $10B 至 $15B，但 Dataminr 的可服务市场受到工作流专业化和高总拥有成本的限制。综合估算经常把通用实体安全硬件、IT
              安全编排和专业警报服务混在一起。自下而上的企业安全预算分析表明，Global 2000 企业和盟国国防组织中的专业实时情报可寻址市场为 $3B 至 $5B。Dataminr 的可获取服务市场集中在 Fortune
              1000 企业和有能力承受多席位订阅及专门集成成本的国防指挥机构。公共部门需求能带来巨额单合同规模，但商业企业扩张需要证明超越基础速度的、可量化的运营投资回报。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM007
              - CM009
      - number: '2.3'
        title: 买方分层、预算归属与采购流程
        blocks:
          - type: paragraph
            body: >-
              客户分层显示，商业企业买家与公共部门国防机构之间存在明显的运营差异。企业采购由首席安全官和全球安全运营中心负责人牵头，部署费用来自实体安全和风险管理预算；合同通常依据席位数和数据源，定价为每年 $30,000 至
              $150,000-plus。相比之下，政府和国防项目（例如 Dataminr 具有里程碑意义的 5 年期、$318 million
              美国战争部订单）由专门的国防运营与维护拨款提供资金，并承诺多年项目周期。商业买家越来越需要能够补充警报上下文、减少人工筛选工作的 agentic AI 能力，推动 Dataminr 与 Palantir
              Foundry、Crisis24 Horizon 等平台进行战略集成，把事件信号直接嵌入决策流程。
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM010
      - number: '2.4'
        title: 增长驱动、结构性约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              地缘政治不稳定上升、网络与实体威胁趋同，以及实时公开数据流激增并压垮内部安全团队，共同推动了采用。金融机构和企业供应链管理者越来越多地采用自动事件警报，在传统媒体披露之前预判大宗商品冲击和运营中断。但结构性阻力也设定了明确的采用上限。高额年度许可费，加上筛选警报量所需的大量分析师人力，限制了精英企业安全和国防层级之外的销售速度。此外，平台依赖第三方社交媒体和公开数据
              API，使其持续暴露于许可成本上涨和数据访问受限的风险。关于按客户群划分的净收入留存率和商业合同续约率，仍存在关键尽调缺口，客户扩张的底层动态因此不透明。
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公共部门规模与企业中端市场渗透的分化
            body: >-
              Dataminr 的市场渗透呈现明显的哑铃分布：公司拿下 $318M 的美国战争部订单等大型多年期政府合同，并服务于 Fortune 100
              一半以上的企业；但高年度合同金额（$30k-$150k+）和警报量限制了其在更广泛中端市场的采用。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与结构分类
        blocks:
          - type: paragraph
            body: >-
              Dataminr 位于开源情报自动化、实时威胁检测和企业风险缓解的交汇处。在全球安全运营中心（GSOCs）、企业传播部门和公共安全指挥中心，买家会从六种不同竞争姿态中评估替代方案：直接实时事件平台（如
              Factal）、专业网络威胁情报供应商（尤其是 Recorded Future）、传统地缘政治风险咨询公司（Janes、Control
              Risks）、预测型旅行风险引擎（Seerist）、群发通知系统（AlertMedia），以及新兴区域结构化情报平台（Region Alert）。Dataminr 的核心检测架构每天摄取超过 43
              terabytes 的多模态信号，涵盖文本、图像、视频、音频和传感器流，支持超过 150 种语言；但买方采用模式取决于运营成熟度。配备完整 24/7 GSOC 的大型企业利用 Dataminr
              的原始信号速度，而中端市场企业、NGO 和专业现场运营商经常流失或转向替代方案，因为处理每天数千条警报需要大量人工分流。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 竞争者画像、能力基准与政府定位
        blocks:
          - type: paragraph
            body: >-
              将 Dataminr 与主要替代方案比较，可以看到警报速度、分析师核验、领域专业化和商业包装之间的明显取舍。Factal 直接切入企业危机管理和新闻编辑室，与 Dataminr 正面竞争：它把 AI
              信号检测与人工记者核验结合，在升级警报前先验证，从而大幅减少传播团队面对的误报。在网络安全领域，Recorded Future 于 2024 年末被 Mastercard 以 $2.65 billion
              收购，在技术漏洞监控、暗网侦察和自动化 SOC 工作流方面保持明确领先；即便 Dataminr 通过收购 ThreatConnect 试图打通网络与实体暴露，Recorded Future 的技术深度仍胜过其
              Cyber Defense 套件。在公共部门，Dataminr 直接作为主承包商向国防部、国土安全部和司法部交付，已完成 50 个联邦订单且不依赖分包商；但 Janes
              等传统国防分析机构在长期地缘政治理论领域根基深厚，竞争依然激烈。
            claimRefs:
              - CP003
