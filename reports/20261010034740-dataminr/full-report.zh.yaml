              - CV011
              - CV015
      - number: '8.3'
        title: 情景、可比对象与退出准备度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持有条件的情景分析，而不支持精确估值区间或概率权重。乐观情景需要经审计的增长超过 2025 年 3 月 ARR
              口径、具吸引力的留存率和利润率、清晰的转换条款，以及国防订单带来的持久扩张。基准情景认可采购实力，但在当前财务报表和所有权条款可获得前，不给出定价建议。悲观情景则是私营市场持续下调，同时单位经济性疲弱，或高级债权主张会优先吃掉退出收益。指定可比证据不足以构建传统倍数集合：FundedIQ
              将 Dataminr 2021 年融资规模与广义人工智能融资中位数比较，而不是与相似企业的估值或运营倍数比较；Forge
              提供的是公司特定的指示性信号，而非已完成交易。五年期竞争性国防订单是积极的退出准备度指标，但合同总价值不是 ARR，也不能证明全公司的增长、盈利能力或退出路径。因此，最终尽调必须先补齐财务、股权结构表
              和可比交易缺口，才能判断目标回报、持有期或退出价值。
            claimRefs:
