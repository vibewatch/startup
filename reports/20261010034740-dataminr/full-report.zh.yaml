        - 经审计的当前 ARR、增长、毛利率和留存率将决定规模能否转化为持久价值。
      - - 正方：采购证明
        - 独立报道显示，国防部一笔 $318M 授标竞争激烈，共收到八份报价。
        - 若能证明交付里程碑、确认收入、续约经济性以及授标之外的扩张，论点会更有力。
      - - 正方：客户广度
        - 公司称已有超过 100 家美国政府机构，以及广泛的 Fortune 50 和国际政府客户采用。
        - 按客户列示的收入和续约明细可以检验客户集中度和质量。
      - - 反方：融资不透明
        - 2025 年 3 月的融资同时包含可转换融资和信贷；指定证据中没有转换、票息、契约和优先级条款。
        - 清晰的股权结构表和非惩罚性转换条款将降低稀释和优先权的不确定性。
      - - 反方：融资记录不一致
        - Tracxn 报告 13 轮累计 $1.24B，而 FundedIQ 记录一轮 $475M。
        - 对账后的融资文件和现金报表可以替代不完整的第三方总额。
    notes: 客户规模和 ARR 是公司自述；国防授标有独立报道，而累计融资总额在第三方数据集之间存在冲突。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 牛市、基准和熊市决策情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险和概率信号
    rows:
      - - 牛市
        - 经审计 ARR 高于 2025 年 3 月接近 $200M 的说法，增长和留存保持强劲，国防交付按计划推进，转换条款不具惩罚性。
        - 可以基于当前经审计指标和实际入场价格构建回报案例；目前没有站得住脚的公开估值区间。
        - 经审计的客户队列经济性和合同扩张会改善信号；指定证据不足以支持任何数值概率。
      - - 基准
        - 国防采购验证仍然稳固，但私营公司经济数据和资本条款仍不可得。
        - 跟踪但不投入资本；在计算目标回报或持有期前，要求提供条款清单和股权结构表瀑布。
        - 公开记录支持需求存在，但不能证明利润率或所有权结果；概率仍未量化。
      - - 熊市
        - 私募市场折价持续，单位经济性令人失望，或可转换融资和信用债权提出的优先受偿主张排在新股权之前。
        - 由于 Forge 不是报价且优先股堆叠未知，无法根据公开数据界定下行空间。
        - 触发因素包括更低的可执行价格、疲弱的经审计留存率或利润率、合同交付问题，或优先债权主张吃掉退出收益。
    notes: 这些是有条件的尽调情景，不是预测。由于缺少必要的私有财务和证券层面证据，没有赋予概率百分比、前瞻 ARR、估值区间或退出倍数。
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV010
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Dataminr 从 2009 年到 2026 年的创立、股权融资、可转换债务注资和重大国防合同。
    data:
      items:
        - label: 公司成立
          date: '2009'
          detail: Ted Bailey、Jeff Kinsey 和 Sam Hendel 在纽约创立 Dataminr，分析实时公共社交数据。
          tone: neutral
        - label: CNN 与 Twitter 合作
          date: '2014'
          detail: 与 CNN 和 Twitter 达成标志性的实时新闻告警合作，推出 Dataminr 新闻版。
          tone: positive
        - label: D 轮融资（$114M）
          date: 2015-03
          detail: 在机构投资者牵头下筹集 $114M，投后估值超过 $700M。
          tone: positive
        - label: E 轮融资（$392M）
          date: 2018-06
          detail: 以 $1.6B 估值完成 $392M 成长轮融资，扩大 First Alert 在企业和公共部门的部署。
          tone: positive
        - label: F 轮融资（$475M）
          date: 2021-03
          detail: 完成由 Eldridge 和 IVP 牵头的 $475M 融资，投后股权估值达到峰值 $4.1B。
          tone: positive
        - label: ReGenAI 平台发布
          date: '2024'
          detail: 发布 ReGenAI，利用多模态基础模型自动重新生成实时事件简报。
          tone: positive
        - label: 可转换债务融资（$485M）
          date: '2025'
          detail: 从 Fortress（总额 $400M）和 NightDragon/HSBC（$85M）获得结构化可转换融资和信贷。
          tone: neutral
        - label: 国防部合同（$318M）
          date: 2026-08
          detail: 获得一份为期 5 年、金额 $318M 的 First Alert Advanced 合同，覆盖所有军种至 2031 年。
          tone: positive
    approximationNotes: 里程碑时间线根据已确认的公司新闻稿、SEC 引用的风险投资轮次和经核实的新闻报道编制。早期轮次的具体日历日期采用正式公告日期。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO009
      - CO010
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 分层市场规模视角，展示从广义全球风险数据到 Dataminr 可触达运营范围的层级关系。
    approximationNotes: TAM、SAM 和 SOM 各层综合行业估算、自下而上的企业预算基准以及已披露的联邦国防合同授标。
    claimRefs:
      - CM002
      - CM007
      - CM009
    data:
      items:
        - label: 事件与威胁总宇宙（$25B+）
          value: $25B+
          detail: 所有非结构化公共数据流、网络传感器和全球事件监测。
        - label: 实时风险与事件告警 TAM（$12B）
          value: $12B
          detail: 全球企业和政府自动化事件告警可触达市场。
        - label: 专业企业与公共部门 SAM（$4B）
