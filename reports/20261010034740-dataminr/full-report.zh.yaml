        blocks:
          - type: paragraph
            body: >-
              Dataminr 将核心实时信息发现引擎包装成四项不同的商业和公共部门产品：面向企业安全的 Dataminr Pulse、Dataminr for Cyber Defense、面向国防和政府组织的 First
              Alert（包括 First Alert Advanced），以及 Dataminr for News。平台持续扫描公开数据信号，让客户从被动监控转向主动响应事件。在企业安全领域，Dataminr Pulse
              为企业运营中心提供员工安全、高管保护和设施安全的一体化威胁警报。在公共部门和国防运营中，First Alert 提供 Indications and Warning（I&W）和战术态势感知；最近扩展的 First
              Alert Advanced 还能生成自主上下文、实时事件简报和预测性轨迹情报。
