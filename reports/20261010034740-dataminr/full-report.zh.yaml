              - CR010
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 国防和执法合同中的公民自由暴露
            body: >-
              Dataminr 不断加大军事和执法情报承诺，$317.8 million
              的美国空军订单就是例证，进一步加剧了公民自由审查。已有记录的国内抗议提前警报挑战了公司作为未分级新闻工具的定位，使其暴露于潜在立法限制和采购监督之下。
            calloutType: risk
