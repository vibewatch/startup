artifact: financials
slug: dataminr
runDate: 2026-10-10
company:
  name: Dataminr
chapter:
  number: 4
  title: Financials
  summary: >-
    Dataminr shows meaningful commercial scale through a reported near-$200 million
    revenue run rate and a five-year, $318 million U.S. defense contract, but public
    evidence does not expose realized pricing, margins, retention, cash, burn, or
    financing terms needed for full underwriting. Recent convertible financings and
    a sharply lower proprietary secondary-market indication make capital structure
    and liquidity diligence central to the financial verdict.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Dataminr monetizes a common real-time intelligence platform through distinct
      enterprise, public-sector, cyber-defense, and newsroom products. The public
      materials describe broad adoption across large enterprises, governments, and
      more than 1,500 newsrooms, but they do not publish list prices, contract units,
      revenue mix, or realized discounts. The strongest current revenue evidence is
      the company-issued announcement of a five-year, $318 million U.S. defense
      award. A straight-line division produces a $63.6 million annualized contract
      value, not annual revenue: billing milestones, options, performance obligations,
      and revenue-recognition timing remain undisclosed. Separately, Forge reports
      management said in 2024 that the company was approaching a $200 million revenue
      run rate; that metric is neither ARR nor audited revenue and its period basis is
      not specified.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-sales-evidence
    title: Monetization and sales-efficiency evidence
    body: >-
      Public evidence suggests a direct enterprise and government contracting motion,
      with material account sizes possible in the public sector. The 2021 financing
      announcement said the corporate enterprise line had doubled revenue in each of
      the preceding three years, which is a historical momentum signal rather than a
      current growth rate or sales-efficiency measure. No assigned source discloses
      sales cycle, quota productivity, customer-acquisition cost, payback, channel
      economics, net revenue retention, or cohort expansion. Customer-logo breadth
      therefore cannot substitute for revenue concentration or renewal quality.
      Diligence should reconcile the reported run-rate metric to audited recognized
      revenue and billings, then segment it by product, customer class, geography,
      recurring versus services content, and contract duration.
    claimRefs: [CI001, CI003, CI004, CI006, CI007, CI015]
    tableRefs: [TI002]
  - id: capital-and-cost-structure
    title: Capital structure, cost signals, and financing dependency
    body: >-
      Dataminr has repeatedly used external capital to fund expansion. The 2021
      primary round raised $475 million at a $4.1 billion valuation; in 2025, Forge
      reported an $85 million package of convertible financing and credit, a potential
      NightDragon vehicle for up to another $100 million, and a separate $100 million
      Fortress convertible financing. These are financing amounts, not evidence of
      cash currently available, and their conversion discounts, seniority, covenants,
      draw conditions, maturity, and interest burden are not public in the assigned
      evidence. A 2022 company-issued release described 900-plus employees, while two
      independent profiles report a roughly 20% workforce reduction in 2023. Those
      data points indicate a substantial people-cost base and an efficiency action,
      but do not quantify current operating expense or cash burn.
    claimRefs: [CI008, CI009, CI010, CI011, CI013, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Revenue quality is promising but not yet underwritable from public evidence.
      Large, multi-year government awards can support visibility, while product and
      customer breadth may diversify demand; however, one disclosed $318 million
      award is large relative to the separately reported near-$200 million run-rate
      proxy, making recognition timing and concentration important. Forge's
      proprietary February 2026 indication of an $832.2 million valuation at $8.93
      per share is an adverse market signal rather than an audited enterprise value
      or a priced primary round. EquityZen also flags rising privacy and regulatory
      compliance burden as a potential cost pressure. The investment case therefore
      requires management evidence on recurring revenue quality, gross margin,
      retention, cash, burn, runway, debt-like obligations, and post-financing
      capitalization before assigning a durable margin path or capital-adequacy view.
    claimRefs: [CI004, CI006, CI012, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams and public traction
    columns:
      - Stream
      - Mechanism
      - Public unit or scale
      - Current evidence
      - Revenue quality
      - Diligence ask
    rows:
      - - Corporate Security
        - Contracted platform access; public billing terms unavailable
        - Customer, seat, site, or API unit not disclosed
        - Company says two-thirds of the Fortune 50 and half of the Fortune 100 use Dataminr
        - Potentially recurring, but mix and renewal evidence are unavailable
        - Provide ARR, recognized revenue, NRR, term, and concentration by enterprise cohort
      - - First Alert public sector
        - Government procurement and multi-year contracts
        - Five-year, $318 million U.S. defense award
        - Award announced on 2026-08-26; performance and billing schedule not disclosed
        - Multi-year visibility, subject to options, milestones, and recognition terms
        - Provide funded value, backlog, annual billings, termination rights, and revenue schedule
      - - Dataminr for News
        - Contracted newsroom product access; pricing unit unavailable
        - More than 1,500 newsrooms, company-claimed
        - Current product-site adoption statement
        - Broad logo base, but no revenue mix or retention disclosure
        - Provide newsroom ARR, average contract value, churn, discounts, and service cost
      - - Cyber Defense
        - Suite and API access; pricing and packaging unavailable
        - No public revenue or customer-count metric in assigned evidence
        - Product suite is publicly offered
        - Expansion opportunity, but monetization remains unquantified
        - Provide cyber ARR, attach rate, pricing metric, gross margin, and sales cycle
    notes: >-
      Company-issued adoption and contract figures are not audited revenue; private
      pricing, mix, renewal, and recognition fields are shown as unavailable rather
      than estimated.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offer or metric
      - Public value
      - List versus realized
      - Confidence and limitation
      - Underwriting implication
    rows:
      - - U.S. defense First Alert award
        - $318 million over five years
        - Contract award value; not list price or recognized revenue
        - Company-issued release; funded value, options, and milestones unavailable
        - Material visibility signal that requires backlog and recognition reconciliation
      - - Straight-line award allocation
        - $63.6 million per year
        - Analyst arithmetic only; not company guidance
        - Low confidence as a revenue proxy because timing and obligations are unknown
        - Do not add directly to the reported revenue run rate
      - - 2024 revenue run rate
        - Approaching $200 million
        - Management figure reported by Forge; period and definition unavailable
        - Third-party report of management commentary; not ARR or audited revenue
        - Reconcile to GAAP revenue, ARR, billings, and deferred revenue
      - - Enterprise, cyber, and newsroom pricing
        - Not publicly disclosed in assigned evidence
        - List and realized pricing both unavailable
        - No public discount, seat, usage, site, or API schedule
        - Data room must establish price realization and expansion economics
    notes: >-
      The $63.6 million figure is $318 million divided by five years and is explicitly
      an analytical allocation, not reported annual revenue or guidance.
    claimRefs: [CI004, CI005, CI006, CI015]
  - id: TI003
    title: Unit economics, cost, and capital-adequacy scorecard
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Required diligence evidence
    rows:
      - - Revenue scale
        - Approaching $200 million revenue run rate in 2024
        - Medium; third-party report of management commentary
        - Establishes scale but not recurrence, growth, or quality
        - Audited revenue bridge to ARR, billings, and deferred revenue
      - - Gross margin and service-delivery cost
        - Unavailable
        - Low
        - Determines software economics and AI/data infrastructure burden
        - Gross margin by product plus data, compute, support, and implementation costs
      - - CAC, payback, and sales efficiency
        - Unavailable
        - Low
        - Direct enterprise and government motions may carry long sales cycles
        - New-logo CAC, fully loaded payback, quota attainment, and sales-cycle cohorts
      - - Retention and concentration
        - NRR, churn, and segment concentration unavailable
        - Low
        - Logo breadth does not establish renewal quality or revenue diversification
        - NRR, GRR, top-10 concentration, renewal calendar, and contract-duration cohorts
      - - Capital added in 2025
        - $85 million financing-and-credit package plus $100 million Fortress convertible; additional NightDragon vehicle capacity up to $100 million
        - Medium; transaction summaries without full instruments
        - Indicates continued reliance on external capital but not cash availability
        - Executed instruments, cap table, cash balance, debt schedule, covenants, and conversion terms
      - - Cash burn and runway
        - Unavailable
        - Low
        - Prevents a conclusion on capital adequacy or next-round timing
        - Monthly cash, trailing burn, committed acquisition payments, and downside runway
    notes: >-
      Financing amounts are not treated as cash on hand; unavailable private metrics
      remain null-equivalent diligence gaps and no burn or margin estimate is inferred.
    claimRefs: [CI006, CI009, CI010, CI011, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge and missing conversion evidence
    type: flow
    summary: >-
      Public evidence identifies the commercial path but not the pricing, billing,
      recognition, or cost conversion needed to bridge usage to gross profit.
    data:
      nodes:
        - id: customer-need
          label: Customer intelligence need
          detail: Enterprise security, cyber defense, public sector, or newsroom workflow
        - id: product-access
          label: Dataminr product access
          detail: Corporate Security, Cyber Defense, First Alert, or Dataminr for News
        - id: commercial-unit
          label: Contract and commercial unit
          detail: Contract structure is visible in one public-sector award; seats, sites, usage, and API units are undisclosed
        - id: billing
          label: Billings and backlog
          detail: Funded value, milestones, options, invoicing, and deferred revenue are unavailable
        - id: revenue
          label: Recognized revenue
          detail: A near-$200 million run-rate proxy was reported for 2024, but its accounting basis is unspecified
        - id: gross-profit
          label: Gross profit and cash contribution
          detail: Gross margin, service-delivery cost, working capital, capex, and cash conversion are unavailable
    approximationNotes: >-
      This is a qualitative sequence, not a proportional funnel; the bridge does not
      infer conversion rates or revenue recognition from customer activity.
    claimRefs: [CI002, CI004, CI006, CI015]
callouts:
  - calloutType: risk
    title: Contract value is not annual revenue
    body: >-
      The five-year, $318 million award is a material commercial signal, but public
      evidence does not show funded backlog, annual billing, options, milestones, or
      accounting treatment. The $63.6 million annual figure is arithmetic only.
    claimRefs: [CI004, CI005]
  - calloutType: recommendation
    title: Gate underwriting on private financial evidence
    body: >-
      Require an audited revenue bridge, cohort retention, product gross margins,
      cash and burn history, debt and convertible instruments, and a fully diluted
      cap table before underwriting valuation or runway.
    claimRefs: [CI009, CI010, CI011, CI015]
