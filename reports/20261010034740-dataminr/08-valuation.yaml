company:
  name: "Dataminr"
chapter:
  number: 8
  title: "Valuation"
  summary: "Dataminr combines a company-reported approach to $200 million of ARR in March 2025 with a competitively awarded five-year, $318 million defense contract announced in August 2026. Public evidence nevertheless supports a track or research-more posture rather than a priced investment recommendation because the $4.1 billion valuation is a 2021 financing mark, Forge's current $698.86 million estimate is explicitly non-quotational, and the 2025 convertible-financing terms and core private-company economics are undisclosed."
sections:
  - id: "thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: >-
      The thesis is that Dataminr has reached meaningful operating scale and won difficult procurement validation. In March 2025 the company said it was approaching $200 million in annual recurring revenue, while its website claims adoption by more than 100 U.S. government agencies, 20-plus international governments, two-thirds of the Fortune 50, and half of the Fortune 100. The strongest independent proof is DefenseScoop's report that a competitive acquisition with eight offers produced a $318 million Defense Department award; Dataminr's syndicated release describes a five-year program through 2031. The anti-thesis is financial opacity rather than a demonstrated lack of demand. The assigned public evidence does not disclose audited growth, gross margin, retention, cash burn, cash balance, customer concentration, or the conversion and seniority terms of the 2025 financing. Funding databases also disagree materially on cumulative capital raised, so neither total funding nor a presumed preference stack should be treated as settled without a cap table.
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "price-and-entry-discipline"
    title: "Valuation Context and Entry Discipline"
    body: >-
      The clean historical anchor is Dataminr's March 2021 financing: the company announced a $475 million round at a $4.1 billion valuation. That mark is stale for a 2026 entry decision. Yahoo Finance now displays a Forge Data estimated valuation of $698.86 million and a Forge Price of $7.50 as of October 9, 2026, implying a roughly 83% discount to the 2021 headline valuation. The signal is adverse but not executable: Forge states that its price is derived from a proprietary model, is not a quotation, does not indicate available supply or demand, and may rely on limited data. The 2025 capital raise also mixed convertible financing and credit, while NightDragon only stated an intention to make up to another $100 million of convertible capacity available through an SPV. Funding raised is therefore not equivalent to cash available, and neither disclosed amount establishes dilution or liquidation priority. Entry discipline should be based on an actual term sheet, fully diluted ownership, security seniority, and audited current metrics rather than either public valuation headline.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenarios-comparables-and-exit"
    title: "Scenarios, Comparables, and Exit Readiness"
    body: >-
      Public evidence supports conditional scenarios, not precise valuation ranges or probability weights. A bull case requires audited growth above the March 2025 ARR claim, attractive retention and margins, clean conversion terms, and durable expansion from the defense award. A base case recognizes procurement strength but withholds a priced recommendation until current financial statements and ownership terms are available. A bear case combines a sustained private-market markdown with weak unit economics or senior claims that absorb exit proceeds. The assigned comparable evidence is inadequate for a conventional multiple set: FundedIQ compares Dataminr's 2021 round size with a broad artificial-intelligence financing median, not with similar businesses' valuation or operating multiples, while Forge provides an indicative company-specific signal rather than a completed transaction. The five-year competitive defense award is a positive exit-readiness indicator, but total contract value is not ARR and does not establish company-wide growth, profitability, or an exit path. Final diligence must therefore close the financial, cap-table, and comparable-transaction gaps before target return, hold period, or exit value can be underwritten.
    claimRefs:
      - "CV003"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs: []
