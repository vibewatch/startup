evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Financial metrics and cash burn
    missingEvidence: >-
      Audited GAAP financial statements detailing Dataminr's gross margin, net retention rate, operating cash flow, and
      runway.
    whyItMatters: >-
      While Dataminr reports approaching $200 million in ARR, the company has raised $485 million in debt and credit in
      2025, indicating substantial ongoing operating cash burn.
    diligencePath: Request audited financials, gross margin schedules, and current cash balance in confidential diligence review.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: Stakeholder or investor map
    missingEvidence: >-
      Detailed capitalization table specifying liquidation preferences, senior debt covenants, and convertible note
      conversion price caps.
    whyItMatters: >-
      The extensive $485 million convertible debt structure held by Fortress and NightDragon could severely dilute
      common shareholders or impair equity returns in an exit below peak valuation.
    diligencePath: Obtain complete cap table and debt covenant agreements under non-disclosure agreement.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: Leadership and founder table
    missingEvidence: >-
      Official disclosure of Dataminr's current Board of Directors, independent directors, and governance committee
      charters.
    whyItMatters: >-
      Public materials do not identify board voting control, investor representation thresholds, or independent audit
      oversight.
    diligencePath: Review board minutes, corporate charter filings, and investor voting agreements.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular breakdown of annual contract value (ACV), net retention rate (NRR), and renewal rates segmented across
      corporate security, cyber defense, and defense/public sector cohorts.
    whyItMatters: >-
      Without segmented cohort retention and contract data, it is impossible to independently verify whether commercial
      corporate enterprise expansion is keeping pace with lumpier public sector defense awards.
    diligencePath: >-
      Request audited revenue by customer segment, cohort-based net revenue retention schedules, and pipeline conversion
      rates during management diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: private-financial-gaps
    missingEvidence: >-
      Realized price schedules, ARR and revenue mix, billings, deferred revenue, GRR, NRR, churn, contract duration,
      customer concentration, and product cohorts.
    whyItMatters: >-
      Without these data, customer breadth and contract awards cannot establish recurring revenue quality, price
      realization, or durable growth.
    diligencePath: >-
      Reconcile audited revenue to ARR and billings, then inspect customer-level contracts and cohort schedules by
      product, segment, geography, and vintage.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, gross margin, working capital, capex, acquisition obligations, debt schedule, and full
      convertible-financing instruments.
    whyItMatters: >-
      Financing announcements do not establish liquidity, dilution, repayment priority, covenant headroom, or runway
      under downside cases.
    diligencePath: >-
      Review monthly financials, bank statements, cash forecast, debt and convertible documents, fully diluted cap
      table, covenant calculations, and board financing plan.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: model-accuracy-benchmarks
    missingEvidence: >-
      Audited model performance benchmarks including precision, recall, false-positive alert rates, and latency
      percentiles across differing data types and event categories.
    whyItMatters: >-
      Without empirical false-positive and latency metrics, underwriters cannot independently verify model reliability
      or evaluate alert fatigue risks in high-stress operational workflows.
    diligencePath: >-
      Request engineering evaluation datasets, confusion matrices, and SOC alert triage benchmarks during technical
      management diligence.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: proprietary-llm-specifications
    missingEvidence: >-
      Architectural specifications, parameter counts, fine-tuning methodologies, and training compute budgets for the
      50-60+ proprietary LLMs reported by Dataminr.
    whyItMatters: >-
      Prevents technical assessment of model unit economics, inference serving expenses, and the actual technical
      defensibility of custom fine-tuned models versus commercial frontier APIs.
    diligencePath: >-
      Review machine learning architecture documentation, compute vendor contracts (e.g. AWS/NVIDIA), and model serving
      cost breakdowns under NDA.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn-cohorts
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), logo churn, and cohort dollar retention curves
      broken down by commercial enterprise vs public-sector defense accounts.
    whyItMatters: >-
      Without segmented renewal and expansion benchmarks, investors cannot definitively evaluate whether top-line ARR
      acceleration reflects healthy organic SaaS expansion or one-off government procurement windfalls masking
      private-sector attrition.
    diligencePath: >-
      Request confidential SaaS cohort retention schedules, annualized churn rates by customer tier, and historical
      contract renewal rates during management confirmatory diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive customer master list or representative churn log across Dataminr Pulse, First Alert, and Cyber
      Defense client bases.
    whyItMatters: >-
      Public case studies highlight successful institutional deployments (United Nations, Deutsche Boerse) but do not
      reveal customer satisfaction levels, deployment drop-offs, or contract cancellation rates across the broader 800+
      customer roster.
    diligencePath: >-
      Conduct blind customer reference calls across enterprise security operations centers and review contract renewal
      histories for mid-market vs Fortune 50 clients.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: convertible-debt-covenants
    missingEvidence: >-
      Detailed credit agreements, conversion discounts, interest rates, and liquidation preferences for the 2025
      Fortress and NightDragon/HSBC financings.
    whyItMatters: >-
      Without disclosure of senior debt covenants and liquidation hurdles, equity investors cannot quantify downside
      dilution or bankruptcy trigger risks.
    diligencePath: >-
      Request confidential disclosure schedules, loan agreements, and updated capitalization tables in private
      management diligence.
    relatedQuestionRefs:
      - QR009
  - type: missing-source
    severity: material
    topic: algorithmic-precision-benchmarks
    missingEvidence: >-
      Independent quantitative audit data detailing precision, recall, and false-positive alert distributions across
      Dataminr's multi-modal LLM pipeline.
    whyItMatters: >-
      Customers rely on human editorial guardrails to catch false alarms; unmeasured false-positive rates introduce
      operational liability in critical event response.
    diligencePath: >-
      Review vendor SOC reports, enterprise customer error logs, and third-party red-teaming benchmarks during
      operational evaluation.
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete docket history of state and municipal public-records inquiries or potential investigations regarding
      domestic protest alerting.
    whyItMatters: >-
      Unresolved scrutiny could lead to legislative restrictions or government agency policy bans on open-source protest
      surveillance tools.
    diligencePath: Conduct formal FOIA audits across contracting agencies and examine civil rights litigation dockets.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Conversion price or discount, interest or coupon, maturity, covenants, security, seniority, participation rights,
      and the fully diluted cap table for the 2025 convertible financing and credit.
    whyItMatters: >-
      These terms determine dilution, preference overhang, ownership, and proceeds available to a new investor in
      downside and exit cases.
    diligencePath: >-
      Review executed financing agreements, the current capitalization table, debt schedule, and a security-by-security
      exit waterfall.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: >-
      Audited current revenue and ARR, growth, gross margin, net retention, customer concentration, cash, operating cash
      flow, and cash burn.
    whyItMatters: >-
      Without these metrics, public evidence cannot support a current multiple, runway assessment, target return, or
      valuation range.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, ARR and renewal bridges, customer-cohort
      schedules, and the current cash forecast.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV005
      - QV008
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A stage- and business-model-matched set of public-company trading multiples, private transactions, or M&A outcomes
      with consistent revenue, growth, margin, and date definitions.
    whyItMatters: >-
      The broad funding-round benchmark and company-specific Forge estimate do not establish a defensible valuation
      range or exit multiple.
    diligencePath: >-
      Build a comparable set from verified filings and transaction documents after audited Dataminr metrics establish
      the appropriate denominator and period.
    relatedQuestionRefs:
      - QV005
      - QV006
      - QV007
