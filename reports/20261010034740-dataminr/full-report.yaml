          values:
            - label: Medium
              tone: warning
              note: 2025 Fortress and NightDragon/HSBC convertible facilities lack public term disclosures
            - label: High
              tone: risk
              note: Senior liquidation preferences and conversion discounts could dilute common shareholders
            - label: Low
              tone: warning
              note: Non-public covenant structures require private disclosure schedules during due diligence
