    title: Thesis and anti-thesis evidence
    columns:
      - Lens
      - Evidence
      - What would change the view
    rows:
      - - 'Thesis: operating scale'
        - Company reported that ARR was approaching $200M in March 2025.
        - >-
          Audited current ARR, growth, gross margin, and retention would determine whether scale is translating into
          durable value.
      - - 'Thesis: procurement proof'
        - Independent reporting describes a competitive $318M Defense Department award with eight offers.
        - >-
          Evidence of delivery milestones, recognized revenue, renewal economics, and expansion beyond the award would
          strengthen the thesis.
      - - 'Thesis: customer breadth'
        - >-
          Company claims more than 100 U.S. government agencies and broad Fortune 50 and international-government
          adoption.
        - A customer-level revenue and renewal schedule would test concentration and quality.
      - - 'Anti-thesis: financing opacity'
        - >-
          The March 2025 funding combined convertible financing and credit; conversion, coupon, covenant, and seniority
          terms are not in the assigned evidence.
        - A clean cap table and non-punitive conversion terms would reduce dilution and preference uncertainty.
      - - 'Anti-thesis: inconsistent funding records'
        - Tracxn reports $1.24B across 13 rounds, whereas FundedIQ records $475M across one round.
        - Reconciled financing documents and cash statements would replace incomplete third-party totals.
    notes: >-
      Customer scale and ARR are company-issued claims; the defense award has independent reporting, while cumulative
      funding totals conflict across third-party datasets.
