              - CI004
              - CI006
              - CI015
      - number: '4.2'
        title: Monetization and sales-efficiency evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests a direct enterprise and government contracting motion, with material account
              sizes possible in the public sector. The 2021 financing announcement said the corporate enterprise line
              had doubled revenue in each of the preceding three years, which is a historical momentum signal rather
              than a current growth rate or sales-efficiency measure. No assigned source discloses sales cycle, quota
              productivity, customer-acquisition cost, payback, channel economics, net revenue retention, or cohort
              expansion. Customer-logo breadth therefore cannot substitute for revenue concentration or renewal quality.
              Diligence should reconcile the reported run-rate metric to audited recognized revenue and billings, then
              segment it by product, customer class, geography, recurring versus services content, and contract
              duration.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI007
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI015
      - number: '4.3'
        title: Capital structure, cost signals, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Dataminr has repeatedly used external capital to fund expansion. The 2021 primary round raised $475
              million at a $4.1 billion valuation; in 2025, Forge reported an $85 million package of convertible
              financing and credit, a potential NightDragon vehicle for up to another $100 million, and a separate $100
              million Fortress convertible financing. These are financing amounts, not evidence of cash currently
              available, and their conversion discounts, seniority, covenants, draw conditions, maturity, and interest
              burden are not public in the assigned evidence. A 2022 company-issued release described 900-plus
              employees, while two independent profiles report a roughly 20% workforce reduction in 2023. Those data
              points indicate a substantial people-cost base and an efficiency action, but do not quantify current
              operating expense or cash burn.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI013
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is promising but not yet underwritable from public evidence. Large, multi-year government
              awards can support visibility, while product and customer breadth may diversify demand; however, one
              disclosed $318 million award is large relative to the separately reported near-$200 million run-rate
              proxy, making recognition timing and concentration important. Forge's proprietary February 2026 indication
              of an $832.2 million valuation at $8.93 per share is an adverse market signal rather than an audited
              enterprise value or a priced primary round. EquityZen also flags rising privacy and regulatory compliance
              burden as a potential cost pressure. The investment case therefore requires management evidence on
              recurring revenue quality, gross margin, retention, cash, burn, runway, debt-like obligations, and
              post-financing capitalization before assigning a durable margin path or capital-adequacy view.
            claimRefs:
              - CI004
              - CI006
              - CI012
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract value is not annual revenue
            body: >-
              The five-year, $318 million award is a material commercial signal, but public evidence does not show
              funded backlog, annual billing, options, milestones, or accounting treatment. The $63.6 million annual
              figure is arithmetic only.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
          - type: callout
            title: Gate underwriting on private financial evidence
            body: >-
              Require an audited revenue bridge, cohort retention, product gross margins, cash and burn history, debt
              and convertible instruments, and a fully diluted cap table before underwriting valuation or runway.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Mission-Critical Intelligence Lines
        blocks:
          - type: paragraph
            body: >-
              Dataminr packages its core real-time information discovery engine into four distinct commercial and public
              sector offerings: Dataminr Pulse for corporate security, Dataminr for Cyber Defense, First Alert
              (including First Alert Advanced) for defense and government organizations, and Dataminr for News. Across
              these suites, the platform shifts client operations from reactive monitoring to proactive event response
              by scanning public data signals continuously. In corporate security, Dataminr Pulse equips enterprise
              operations centers with unified threat alerts across employee safety, executive protection, and facility
              security. In public sector and defense operations, First Alert provides Indications and Warning (I&W) and
              tactical situational awareness, recently expanded through First Alert Advanced to deliver autonomous
              context generation, real-time event live briefs, and predictive trajectory intelligence.
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE015
      - number: '5.2'
        title: Enterprise and Public Sector Operational Workflows
        blocks:
          - type: paragraph
            body: >-
              Dataminr operationalizes its alerts by embedding directly into existing client infrastructure rather than
              demanding separate standalone console monitoring. For enterprise physical security and crisis operations,
              Dataminr integrates with Esri ArcGIS Velocity, streaming JSON alert feeds into spatial tracking layers to
              correlate real-time incidents against corporate assets, mobile personnel, and supply-chain nodes. In
              cybersecurity operations, the Dataminr Pulse integration for Elastic Security leverages the Elastic Agent
              to poll the Pulse v4 REST API, ingest threat actor and CVE telemetry, and normalize indicators directly
              into the Elastic Common Schema (ECS). In national security and defense environments, First Alert Advanced
              deploys as a native application within the Palantir Foundry Marketplace, combining external public
              indications with sensitive operational data layers.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
