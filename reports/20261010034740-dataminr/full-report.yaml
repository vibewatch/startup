              note: Documented history of domestic protest alerting generates ongoing civil liberties inquiries
            - label: High
              tone: risk
              note: Potential to trigger agency contract restrictions or brand damage among enterprise buyers
            - label: Low
              tone: warning
              note: Company claims news alerting positioning but lacks independent oversight mechanisms
        - label: Social Media Platform Firehose
          values:
            - label: Medium
              tone: warning
              note: Commercial licensing terms with X and major networks subject to periodic renegotiation
            - label: Critical
              tone: risk
              note: Loss of firehose access would fundamentally impair core real-time latency advantage
            - label: Medium
              tone: neutral
              note: Multi-modal expansion across 1M sources, sensors, and dark web partially mitigates single-source risk
        - label: Public Sector Revenue Concentration
          values:
            - label: Medium
              tone: warning
              note: Air Force $317.8M award constitutes a massive share of forward revenue commitments
            - label: High
              tone: risk
              note: Defense budget reallocation or program restructuring would materially impair cash flows
            - label: High
              tone: positive
              note: Five-year firm-fixed-price structure locks in baseline funding through June 2031
        - label: Alert Precision & False Positives
          values:
            - label: High
              tone: risk
              note: Social media and sensor noise naturally produce unverified signals in breaking situations
            - label: Medium
              tone: warning
              note: Premature enterprise action on false alarms creates operational liabilities and fatigue
            - label: Medium
              tone: neutral
              note: ReGenAI and Multi-Modal Fusion AI cross-correlate signals, but human verification remains necessary
        - label: EU DORA & Data Privacy Compliance
          values:
            - label: High
              tone: risk
              note: Stringent third-party risk rules under DORA and evolving state-level AI regulations
            - label: Medium
              tone: warning
              note: Audits by European supervisory bodies and potential compliance remediation expenses
            - label: Medium
              tone: neutral
              note: Enterprise SOC certifications and standard customer data processing agreements
