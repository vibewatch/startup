figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological overview of Dataminr's founding, equity financings, convertible debt infusions, and major defense
      contracts from 2009 through 2026.
    data:
      items:
        - label: Company Founded
          date: '2009'
          detail: >-
            Ted Bailey, Jeff Kinsey, and Sam Hendel establish Dataminr in New York to analyze real-time public social
            data.
          tone: neutral
        - label: CNN & Twitter Partnership
          date: '2014'
          detail: Enters landmark real-time news alerting partnership with CNN and Twitter, launching Dataminr for News.
          tone: positive
        - label: Series D Financing ($114M)
          date: 2015-03
          detail: Raises $114M led by institutional investors, valuing the company at over $700M post-money.
          tone: positive
        - label: Series E Financing ($392M)
          date: 2018-06
          detail: >-
            Secures $392M growth round at a $1.6B valuation to expand enterprise and public sector First Alert
            deployments.
          tone: positive
        - label: Series F Financing ($475M)
          date: 2021-03
          detail: Completes $475M round led by Eldridge and IVP, establishing a peak $4.1B post-money equity valuation.
          tone: positive
        - label: ReGenAI Platform Launch
          date: '2024'
          detail: Unveils ReGenAI, automatically regenerating live event briefs using multimodal foundation models.
          tone: positive
        - label: Convertible Debt Financing ($485M)
          date: '2025'
          detail: Secures structured convertible financing and credit from Fortress ($400M total) and NightDragon/HSBC ($85M).
          tone: neutral
        - label: Department of War Contract ($318M)
          date: 2026-08
          detail: Awards 5-year, $318M contract for First Alert Advanced across all military branches through 2031.
          tone: positive
    approximationNotes: >-
      Milestone timeline constructed from confirmed company press releases, SEC-referenced venture rounds, and verified
      news coverage. Exact calendar days for early rounds reflect formal announcement dates.
