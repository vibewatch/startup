  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-tier architectural stack illustrating Dataminr's pipeline from multimodal public ingestion through proprietary
      model orchestration to enterprise integrations.
    data:
      layers:
        - label: 'Layer 1: Multimodal Ingestion Pipeline'
          detail: >-
            Continuous ingestion across 1M+ public sources, social platforms, radio transmissions, dark web, and IoT
            sensors in 150+ languages.
        - label: 'Layer 2: Event Detection & Clustering Engine'
          detail: >-
            Multimodal fusion algorithms filtering noise, clustering corroborating data, and assigning geospatial and
            entity coordinates.
        - label: 'Layer 3: Human-in-the-Loop Expert Validation'
          detail: >-
            Real-time domain expert annotation and active feedback loops continuously refining ML models and alert
            quality.
        - label: 'Layer 4: Specialized LLM Orchestration'
          detail: >-
            Constellation of 50-60+ fine-tuned domain-specific models trained on Dataminr's 10+ year proprietary event
            archive.
        - label: 'Layer 5: Agentic Context & Generative Intelligence'
          detail: >-
            Intel Agents and ReGenAI engines producing real-time Live Event Briefs, tactical forecasts, and contextual
            impact analyses.
        - label: 'Layer 6: Delivery & Partner Ecosystem'
          detail: >-
            Web/mobile applications, REST v4 API, and native integrations with Palantir Foundry, Esri ArcGIS, and
            Elastic Security.
