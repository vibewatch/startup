chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2009 by Ted Bailey, Jeff Kinsey, and Sam Hendel, Dataminr, Inc. has established itself as a
              pioneer in real-time information discovery and AI-driven risk intelligence. The company operates from its
              global headquarters in New York City with engineering and regional hubs across North America, Europe, and
              Australasia. Dataminr's core business model centers on delivering subscription-based Software-as-a-Service
              (SaaS) intelligence solutions that process public data signals across text in 150 languages, imagery,
              video, audio, and sensor inputs to surface breaking developments before traditional news media. The
              commercial portfolio is bifurcated into Dataminr Pulse for corporate enterprise security and cyber risk
              defense, and First Alert for emergency responders, defense personnel, and public-sector agencies. Dataminr
              reports approaching $200 million in annual recurring revenue while serving a customer base that
              encompasses two-thirds of the Fortune 50, half of the Fortune 100, and more than 100 federal, state, and
              international government bodies.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
      - number: '1.2'
        title: Founders, Governance, and Leadership
        blocks:
          - type: paragraph
            body: >-
              Dataminr's organizational leadership reflects continuity at the founder level paired with seasoned
              enterprise software executives recruited to scale go-to-market execution. Chief Executive Officer Ted
              Bailey has led the company since its 2009 inception, maintaining primary strategic direction and
              high-level relationships across government and enterprise clients. Co-founder Jeff Kinsey serves as Chief
              Technology Officer, overseeing proprietary multimodal foundation model architectures and large-scale data
              ingestion infrastructure. To accelerate commercialization and partner expansion, Dataminr appointed Brian
              Gumbel as President and Chief Operating Officer, drawing on senior executive leadership experience from
              Armis, Forescout Technologies, Tanium, and Cisco. Gumbel leads global sales operations, customer success,
              marketing, and strategic channels, supported by Chief Partner Officer Matthew Harrell. While operating
              leadership is clearly defined, Dataminr does not publicly disclose its comprehensive Board of Directors
              roster, committee governance, or independent director oversight.
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: Capitalization, Valuation, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Dataminr has accumulated more than $1.5 billion in lifetime capital commitments across venture equity,
              convertible notes, and credit facilities. The company reached its peak public valuation benchmark in March
              2021 upon closing a $475 million Series F financing round at a $4.1 billion post-money valuation,
              supported by growth equity leaders including Institutional Venture Partners, Eldridge Industries, Valor
              Equity Partners, Morgan Stanley Tactical Value, and MSD Capital. Rather than testing public markets or
              pricing a new equity round during the subsequent venture recalibration, Dataminr executed a major capital
              restructuring throughout 2025. The company secured $485 million in structured financing, consisting of an
              $85 million convertible and credit package from NightDragon and HSBC in March 2025, followed by $100
              million in April 2025 and $300 million in September 2025 in convertible debt from Fortress Investment
              Group. This financing strategy preserved the nominal $4.1 billion valuation but created substantial
              liquidation overhang and structural debt priority ahead of common equity.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO010
      - number: '1.4'
        title: Operational Scale, Milestones, and Public Controversies
        blocks:
          - type: paragraph
            body: >-
              Dataminr's operational evolution demonstrates rapid technological advancement counterbalanced by civil
              liberties scrutiny and workforce adjustments. In 2024, the company launched ReGenAI, introducing
              generative AI models that dynamically regenerate breaking event briefs in real time. This capability
              culminated in August 2026 when Dataminr secured a landmark 5-year, $318 million enterprise contract with
              the U.S. Department of War for its First Alert Advanced system, deploying autonomous intelligence across
              all military branches through 2031. However, this deep government integration has generated persistent
              controversy. Investigative reporting revealed that law enforcement agencies and U.S. Marshals utilized
              Dataminr to monitor domestic demonstrations, including constitutionally protected abortion rights rallies
              and racial justice protests. In 2025, reports documented over 50 real-time alerts provided to the Los
              Angeles Police Department regarding campus demonstrations. Concurrently, Dataminr rationalized operating
              costs, reducing headcount to approximately 753 employees in 2026 from peak levels exceeding 1,050 in 2022.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO009
              - CO010
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Transition from Venture Equity to Structured Debt Financing
            body: >-
              Dataminr's funding trajectory reveals a notable structural pivot after 2021. Following its $475 million
              Series F equity round at a $4.1 billion post-money valuation in March 2021, the company did not raise
              another priced equity round. Instead, throughout 2025, Dataminr secured $485 million in convertible debt
              and credit facilities led by Fortress Investment Group, NightDragon, and HSBC. This reliance on structured
              debt preserves the headline $4.1 billion valuation while introducing potential liquidation overhang and
              coupon burdens.
            calloutType: insight
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: callout
            title: Civil Liberties Scrutiny and Public Surveillance Controversies
            body: >-
              Dataminr faces persistent reputational and regulatory scrutiny regarding public-sector surveillance use
              cases. Independent investigative reporting highlighted monitoring of domestic civil protests and
              law-abiding demonstrations on behalf of police departments and federal agencies. While Dataminr maintains
              that First Alert delivers non-demographic breaking news alerts, public scrutiny creates ongoing compliance
              and brand risks among commercial enterprise and international buyers.
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Enterprise Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for real-time event and threat intelligence occupies a distinct operational layer between raw
              public data ingestion and downstream crisis response. Dataminr defines its core perimeter around
              low-latency detection of physical disruptions, cyber exposures, and breaking events synthesized from more
              than one million public data feeds. This category excludes generic security information and event
              management log monitoring, internal telemetry, and retrospective media clipping services, which lack
              real-time public signal discovery capabilities. Status-quo substitutes primarily consist of manual analyst
              monitoring, open-source intelligence scraping, and legacy news wires, which create severe latency and
              alert fatigue during fast-breaking incidents. By establishing an automated indication and warning
              capability, Dataminr targets mission-critical enterprise security operations centers and public sector
              defense commands requiring immediate situational awareness.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing Lenses and Constrained Growth Trajectories
        blocks:
          - type: paragraph
            body: >-
              Industry sizing for broader threat intelligence and risk analytics spans $10B to $15B globally, yet
              Dataminr's serviceable market is constrained by workflow specialization and high total cost of ownership.
              Aggregated estimates frequently conflate general physical security hardware, IT security orchestration,
              and specialized alerting. Bottom-up analysis of corporate enterprise security budgets indicates a
              specialized real-time intelligence addressable market of $3B to $5B among Global 2000 corporations and
              allied defense organizations. Dataminr's serviceable obtainable market centers on Fortune 1000 enterprises
              and defense commands capable of absorbing multi-seat subscriptions and dedicated integration overhead.
              While public sector demand provides massive single-contract scale, commercial enterprise expansion
              requires demonstrating quantifiable operational return on investment beyond baseline speed.
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM007
              - CM009
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Workflows
        blocks:
          - type: paragraph
            body: >-
              Customer segmentation reveals stark operational divergences between commercial enterprise buyers and
              public sector defense organizations. Corporate procurement is spearheaded by Chief Security Officers and
              Global Security Operations Center directors who fund deployments from physical security and risk
              management budgets, with contracts typically priced between $30,000 and $150,000-plus annually based on
              seat count and data feeds. In contrast, government and defense engagements, such as Dataminr's landmark
              5-year, $318 million U.S. Department of War award, are funded through specialized defense operations and
              maintenance appropriations with multi-year program commitments. Commercial buyers increasingly demand
              agentic AI capabilities that contextualize alerts and reduce manual filtering labor, driving strategic
              integrations with platforms like Palantir Foundry and Crisis24 Horizon to embed event signals directly
              into decision workflows.
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM010
      - number: '2.4'
        title: Growth Drivers, Structural Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption is propelled by rising geopolitical instability, cyber-physical threat convergence, and the
              proliferation of real-time public data streams that overwhelm internal security teams. Financial
              institutions and corporate supply chain managers increasingly adopt automated event alerting to anticipate
              commodity shocks and operational disruptions before traditional media disclosure. However, structural
              headwinds impose tangible adoption ceilings. High annual licensing fees and substantial analyst labor
              required to filter alert volume restrict sales velocity outside elite corporate security and defense
              tiers. Furthermore, platform reliance on third-party social media and public data APIs creates persistent
              exposure to licensing cost escalations and data access restrictions. Critical diligence gaps remain
              regarding cohort-specific net revenue retention and commercial contract renewal rates, obscuring
              underlying customer expansion dynamics.
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Divergence Between Public Sector Scale and Corporate Mid-Market Penetration
            body: >-
              Dataminr's market penetration reflects a pronounced barbell distribution: it secures massive multi-year
              government contracts such as its $318M Department of War award and serves over half of the Fortune 100,
              yet high annual contract values ($30k-$150k+) and alert volume limit adoption in the broader mid-market.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Structural Categorization
        blocks:
          - type: paragraph
            body: >-
              Dataminr operates at the convergence of open-source intelligence automation, real-time threat detection,
              and enterprise risk mitigation. Across global security operations centers (GSOCs), corporate
              communications, and public safety command centers, buyers evaluate alternatives across six distinct
              competitive postures: direct real-time event platforms (such as Factal), specialized cyber threat
              intelligence vendors (most notably Recorded Future), legacy geopolitical risk consultancies (Janes,
              Control Risks), predictive travel risk engines (Seerist), mass notification systems (AlertMedia), and
              emerging regional structured intelligence platforms (Region Alert). While Dataminr's core detection
              architecture ingests over 43 terabytes of daily multi-modal signals spanning text, image, video, audio,
              and sensor streams across more than 150 languages, buyer adoption patterns bifurcate based on operational
              maturity. Large enterprises with fully staffed 24/7 GSOCs leverage Dataminr's raw signal velocity, whereas
              mid-market enterprises, NGOs, and specialized field operators frequently churn or adopt substitutes due to
              the human triage overhead required to process thousands of daily alerts.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: Competitor Profiles, Capability Benchmarks, and Government Positioning
        blocks:
          - type: paragraph
            body: >-
              Evaluating Dataminr against primary alternatives reveals pronounced trade-offs between alert velocity,
              analyst verification, domain specialization, and commercial packaging. Factal directly challenges Dataminr
              in corporate crisis management and newsrooms by coupling AI signal detection with human journalist
              verification before alert escalation, substantially eliminating false positives for communications teams.
              In the cybersecurity domain, Recorded Future—acquired by Mastercard in late 2024 for $2.65
              billion—maintains definitive leadership in technical vulnerability monitoring, dark web reconnaissance,
              and automated SOC workflows, outmatching Dataminr's Cyber Defense suite in technical depth even as
              Dataminr attempts to bridge cyber and physical exposures via its ThreatConnect acquisition. In the public
              sector, Dataminr maintains direct prime contractor delivery across the Department of Defense, Department
              of Homeland Security, and Department of Justice with 50 completed federal awards and zero subcontracting
              dependency, yet faces entrenched competition from legacy defense analysts such as Janes for longitudinal
              geopolitical doctrine.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP010
              - CP011
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
      - number: '3.3'
        title: Pricing, Packaging, Alert Fatigue, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Dataminr's commercial model relies on annual and multi-year enterprise contracts priced at approximately
              $30,000 or more per user per year, frequently requiring $150,000 to $500,000 or more in aggregate annual
              platform expenditure before factoring in analyst personnel costs. This high-floor pricing strategy creates
              significant vulnerability to displacement among buyers lacking dedicated 3- to 5-analyst GSOC teams.
              Regional operators, extractive corporations, and humanitarian organizations increasingly multi-home or
              switch to engagement-based structured intelligence providers like Region Alert, which deliver curated
              multilingual briefings that synthesize threat signals rather than streaming unverified raw alerts.
              Furthermore, independent financial benchmark evaluations score Dataminr's pricing value at 5 out of 10,
              highlighting information overload and premium enterprise-only access barriers. Dataminr's moat durability
              rests on proprietary multi-modal models, deep government workflow integration, and real-time ingest
              pipelines, but switching costs remain asymmetric: high in mission-critical GSOCs with customized API
              integrations, yet fragile in secondary risk and travel duty-of-care departments.
            claimRefs:
              - CP004
              - CP007
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The GSOC Bottleneck and Asymmetric Switching Costs
            body: >-
              Dataminr's primary structural barrier is not algorithm capability, but customer operational absorption
              capacity. Delivering thousands of real-time multi-modal alerts creates tremendous value for scaled Fortune
              500 security operations centers equipped to triage incoming feeds. However, for organizations without a
              24/7 dedicated GSOC, the raw alert volume induces severe operator fatigue, creating an adoption barrier
              that agile, verified platforms like Factal and structured briefing providers like Region Alert exploit.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP007
          - type: callout
            title: Vulnerability to Vertical Domain and Language Specialization
            body: >-
              While Dataminr positions itself as a comprehensive multi-modal risk platform across cyber, corporate, and
              public safety, domain-focused specialists present acute displacement risks. In cybersecurity, Recorded
              Future commands superior credibility and workflow integration, whereas in regional physical operations,
              local-language reporting frequently surfaces ground-truth threat signals hours before English-language
              social streams register them.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Dataminr monetizes a common real-time intelligence platform through distinct enterprise, public-sector,
              cyber-defense, and newsroom products. The public materials describe broad adoption across large
              enterprises, governments, and more than 1,500 newsrooms, but they do not publish list prices, contract
              units, revenue mix, or realized discounts. The strongest current revenue evidence is the company-issued
              announcement of a five-year, $318 million U.S. defense award. A straight-line division produces a $63.6
              million annualized contract value, not annual revenue: billing milestones, options, performance
              obligations, and revenue-recognition timing remain undisclosed. Separately, Forge reports management said
              in 2024 that the company was approaching a $200 million revenue run rate; that metric is neither ARR nor
              audited revenue and its period basis is not specified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
