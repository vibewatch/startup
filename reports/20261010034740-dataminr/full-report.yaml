              - CE008
              - CE009
              - CE015
      - number: '5.3'
        title: Multimodal AI Stack and Specialized Model Constellation
        blocks:
          - type: paragraph
            body: >-
              Dataminr's core technical architecture relies on an end-to-end ingestion and processing pipeline that
              handles billions of public data inputs daily across text, imagery, video, audio, and sensor signals in
              over 150 languages. Rather than depending on single third-party frontier foundation models, Dataminr
              operates a constellation of over 50 fine-tuned, task-specific language models trained on its proprietary
              10-plus year historical event archive. This specialized model orchestration pairs Multimodal Fusion AI for
              initial anomaly detection with Generative AI for automated event description (ReGenAI) and Agentic AI
              (Intel Agents) for autonomous corroboration. Technical teams and integration partners access these
              capabilities via a dedicated Developer Portal, comprehensive REST APIs, and client software development
              kits.
            claimRefs:
              - CE002
              - CE004
              - CE005
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE008
              - CE009
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE004
              - CE005
      - number: '5.4'
        title: Security Controls, Trust Services, and Technical Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Operating across Fortune 50 enterprises and national defense agencies requires rigorous infrastructure
              security and governance controls. Dataminr deploys containerized microservices within AWS cloud
              infrastructure backed by zero-trust network segmentation, AES-256 data encryption at rest, TLS 1.2+
              encryption in transit, and continuous 24/7/365 Security Operations Center surveillance. Security posture
              is validated through annual third-party penetration tests, red-teaming exercises, and private bug bounty
              programs. However, technical diligence reveals two critical operational risks: first, Dataminr's upstream
              dependency on third-party public data sources leaves the pipeline vulnerable to API throttling, crawler
              blocks, or terms-of-service shifts; second, public materials disclose zero quantitative benchmarks
              regarding alert precision, false-positive frequencies, or latency distributions under high load.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Data Moat and Model Specialization
            body: >-
              Dataminr's orchestration of over 50 fine-tuned, task-specific LLMs trained on its 10-plus year proprietary
              event archive provides structural advantages over general-purpose frontier models in latency, domain
              accuracy, and intellectual property containment.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Opacity of Benchmark Accuracy and External Dependency Risks
            body: >-
              Public disclosures provide substantial evidence of platform breadth, partner integrations, and major
              customer deployments, but entirely lack quantitative precision, recall, and false-positive metrics, while
              the platform remains vulnerable to public data feed disruptions.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Buyer Personas
        blocks:
          - type: paragraph
            body: >
              Dataminr segments its commercial and public-sector operations across four primary customer categories:
              corporate enterprise security, public sector defense and emergency response, cyber threat defense, and
              news media organizations. In the corporate enterprise market, Dataminr Pulse targets Chief Security
              Officers, Global Security Operations Centers (GSOC), and corporate resilience directors who monitor
              physical facility security, supply chain disruptions, and executive traveler safety. Within national
              defense and government bodies, First Alert and the newly released First Alert Advanced serve defense
              agencies, frontline military commands, and humanitarian organizations requiring indications, warnings, and
              battlefield situational awareness. In cyber defense, the acquisition of ThreatConnect expanded Dataminr's
              addressable footprint across Security Operations Centers and threat intelligence analysts, combining
              external public signals with internal corporate telemetry. Meanwhile, Dataminr for News serves journalists
              and newsrooms globally, providing real-time breaking alerts that strengthen brand awareness and platform
              visibility.
            claimRefs:
              - CU001
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
      - number: '6.2'
        title: Adoption Trajectory & Contract Scale Dynamics
        blocks:
          - type: paragraph
            body: >
              Dataminr's annual recurring revenue (ARR) trajectory demonstrates accelerating adoption across large
              institutional buyers, rising from approximately $190 million at year-end 2024 to $205 million at year-end
              2025, and reaching an estimated $225 million in July 2026. This acceleration has been fueled primarily by
              robust expansion in international defense, where annualized recurring revenue grew more than 180%
              year-over-year in mid-2026. Commercial contract structures are typically structured as annual or
              multi-year enterprise licenses with pricing scaling by seat count, geography, and integrated API
              capabilities. For smaller municipal and state government deployments, standard public-sector First Alert
              seat pricing ranges between $6,000 and $10,000 per user annually. In contrast, large-scale defense
              deployments yield tens of millions in annual contract value, exemplified by Dataminr's landmark 5-year,
              $318 million U.S. Department of War agreement, which provides enterprise-wide real-time alerting across
              all military service branches through 2031.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Production Deployments & Verified Customer Outcomes
        blocks:
          - type: paragraph
            body: >
              Verified customer reference deployments demonstrate multi-year production usage across corporate,
              international non-profit, educational, and military institutions. The United Nations deployed Dataminr
              First Alert in 2019 through its UN Global Pulse initiative, provisioning real-time crisis detection and
              early event warnings to thousands of personnel across humanitarian missions in more than 100 countries. In
              corporate financial services, Deutsche Boerse Group rolled out Dataminr Pulse in 2018 across approximately
              60 global operating locations, integrating geospatial threat alerts into event response playbooks to
              accelerate operational decision-making for its physical security team. In higher education, Baylor
              University implemented First Alert in 2020 to safeguard students and faculty abroad, utilizing real-time
              event scoring to coordinate emergency travel triage and traveler repatriations during the onset of the
              COVID-19 pandemic. Furthermore, allied defense forces across 18 nations and 15 NATO member states rely on
              First Alert for indications and warnings, with NATO SHAPE operationalizing First Alert Advanced within
              Palantir Foundry workflows.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion Loops, Durability & Concentration Exposure
        blocks:
          - type: paragraph
            body: >
              Dataminr's commercial expansion strategy relies on land-and-expand dynamics, cross-selling cyber modules
              into corporate security accounts, and scaling channel distribution through systems aggregators and
              value-added resellers. In June 2026, Dataminr established a major distribution agreement with TD SYNNEX,
              authorizing more than 35,000 North American resellers to distribute Dataminr for Cyber Defense, thereby
              reducing direct sales friction. However, customer concentration presents material underwriting risk: the
              single $318 million U.S. Department of War award generates roughly $63.6 million in annualized revenue,
              accounting for over 28% of Dataminr's $225 million ARR base. Furthermore, public-sector retention is
              vulnerable to procurement disputes and political controversies. In late 2020, Dataminr lost its FBI social
              media intelligence contract to competitor Zerofox. Additionally, investigative reports revealing that
              Dataminr alerted law enforcement agencies to lawful racial justice and pro-Palestinian campus protests
              have triggered client scrutiny from academic institutions, municipal buyers, and civil liberties
              stakeholders.
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU006
              - CU009
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Defense Mega-Contracts Mask Private Sector Churn Dynamics
            body: >-
              The landmark $318 million U.S. Department of War award delivers exceptional revenue stability and accounts
              for roughly 28% of Dataminr's annualized run-rate. However, this massive federal concentration can obscure
              underlying logo churn or renewal friction within commercial mid-market and corporate security cohorts.
            calloutType: insight
            claimRefs:
              - CU006
              - CU008
          - type: callout
            title: Public Backlash on Protest Surveillance Jeopardizes Civil Deployments
            body: >-
              Dataminr's loss of the FBI social media monitoring contract to Zerofox in 2020 and subsequent
              controversies regarding domestic protest surveillance in Los Angeles and university campuses highlight
              recurring reputational friction that threatens procurement across civil agencies and corporate
              brand-sensitive accounts.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Civil Liberties Exposures
        blocks:
          - type: paragraph
            body: >
              Dataminr's core business model of aggregating, analyzing, and surfacing alerts from publicly available
              information faces heightened scrutiny across multiple regulatory jurisdictions. While the company
              positions First Alert as an unclassified news discovery platform rather than a surveillance tool,
              investigative disclosures have documented extensive use by municipal law enforcement and federal agencies
              to monitor domestic, constitutionally protected protest activity, including advance alerting prior to
              demonstrations. This track record creates acute reputational, contractual, and regulatory exposure,
              particularly as civil liberties organizations and legislative committees question the boundary between
              force protection and unregulated domestic surveillance. Concurrently, expanding regulatory
              frameworks—notably the European Union Digital Operational Resilience Act (DORA) and evolving U.S.
              state-level privacy and AI disclosure mandates—impose stringent data governance, provenance, and
              third-party risk management burdens on Dataminr's enterprise and financial customer segments. Compliance
              costs and operational oversight requirements will continue to compress margins and increase procurement
              friction.
            claimRefs:
              - CR001
              - CR003
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR007
      - number: '7.2'
        title: Operational Reliability, Model Quality, and Execution Risks
        blocks:
          - type: paragraph
            body: >
              Operating a real-time event intelligence pipeline at global scale requires ingesting volatile,
              unstructured, and often adversarial digital inputs while maintaining strict accuracy thresholds. In
              high-tempo newsroom and corporate security workflows, Dataminr alerts frequently generate false alarms or
              premature signals originating from unverified social media chatter, placing the operational burden of
              corroboration directly on customer editorial and security teams. The lack of standardized public
              benchmarks or independent audits detailing Dataminr's model precision, recall, and false-positive rates
              creates an unquantified operational risk for enterprise buyers who must institute secondary verification
              guardrails to avoid acting on inaccurate alerts. Furthermore, organizational execution remains strained by
              past restructuring initiatives, including a 20% workforce reduction in late 2023 aimed at curbing cash
              burn, followed by ambitious technical integration demands following the $290 million acquisition of
              ThreatConnect and the rollout of Dataminr for Cyber Defense.
            claimRefs:
              - CR005
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR008
              - CR011
              - CR013
      - number: '7.3'
        title: Platform Dependencies, Counterparty Friction, and Customer Concentration
        blocks:
          - type: paragraph
            body: >
              Dataminr's real-time detection advantage relies heavily on third-party commercial data partnerships and
              firehose access agreements, most critically with X (formerly Twitter). Although Dataminr maintains formal
              licensing partnerships that distinguish its pipeline from unauthorized web scraping, any unilateral shifts
              in platform access pricing, API availability, rate limits, or contractual terms present an existential
              risk to event detection latency and coverage. On the demand side, Dataminr exhibits significant
              counterparty concentration in defense and government intelligence, as demonstrated by the $317.8 million
              five-year U.S. Air Force contract awarded in August 2026. While multi-year federal awards provide
              predictable baselines, they tie enterprise valuation heavily to government procurement cycles, political
              oversight, and budgetary continuity, leaving the company vulnerable to federal policy shifts or
              competitive displacement by classified intelligence providers like Palantir.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR009
      - number: '7.4'
        title: Risk Synthesis, Monitoring Triggers, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >
              Evaluating Dataminr's risk profile requires weighing its established market leadership and proprietary
              multi-modal AI architecture against structural disclosure opacity and mounting public scrutiny. The
              company has demonstrated impressive commercial scale, securing major defense awards and commanding a $4.1
              billion Series F valuation mark. However, persistence of unanswered questions regarding senior liquidation
              preferences, net revenue retention, and model error rates warrants an elevated risk rating. For
              institutional investors, core monitoring indicators must include Congressional oversight inquiries into
              domestic protest alerting, contract renewals across Tier-1 media and financial clients, potential changes
              in social media platform licensing costs, and gross margin evolution in cyber defense offerings. A
              material thesis-break trigger would be any formal revocation or restriction of major social platform
              firehose access, or a binding legislative ban on government use of commercial AI alerting platforms for
              domestic monitoring.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Civil Liberties Exposure in Defense and Law Enforcement Contracts
            body: >-
              Dataminr's escalating commitments to military and law enforcement intelligence—highlighted by the $317.8
              million U.S. Air Force award—intensify civil liberties scrutiny. Documented advance alerts on domestic
              protests challenge the company's positioning as an unclassified news tool, exposing the business to
              potential legislative constraints and procurement oversight.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Dataminr has reached meaningful operating scale and won difficult procurement
              validation. In March 2025 the company said it was approaching $200 million in annual recurring revenue,
              while its website claims adoption by more than 100 U.S. government agencies, 20-plus international
              governments, two-thirds of the Fortune 50, and half of the Fortune 100. The strongest independent proof is
              DefenseScoop's report that a competitive acquisition with eight offers produced a $318 million Defense
              Department award; Dataminr's syndicated release describes a five-year program through 2031. The
              anti-thesis is financial opacity rather than a demonstrated lack of demand. The assigned public evidence
              does not disclose audited growth, gross margin, retention, cash burn, cash balance, customer
              concentration, or the conversion and seniority terms of the 2025 financing. Funding databases also
              disagree materially on cumulative capital raised, so neither total funding nor a presumed preference stack
              should be treated as settled without a cap table.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The clean historical anchor is Dataminr's March 2021 financing: the company announced a $475 million round
              at a $4.1 billion valuation. That mark is stale for a 2026 entry decision. Yahoo Finance now displays a
              Forge Data estimated valuation of $698.86 million and a Forge Price of $7.50 as of October 9, 2026,
              implying a roughly 83% discount to the 2021 headline valuation. The signal is adverse but not executable:
              Forge states that its price is derived from a proprietary model, is not a quotation, does not indicate
              available supply or demand, and may rely on limited data. The 2025 capital raise also mixed convertible
              financing and credit, while NightDragon only stated an intention to make up to another $100 million of
              convertible capacity available through an SPV. Funding raised is therefore not equivalent to cash
              available, and neither disclosed amount establishes dilution or liquidation priority. Entry discipline
              should be based on an actual term sheet, fully diluted ownership, security seniority, and audited current
              metrics rather than either public valuation headline.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Scenarios, Comparables, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional scenarios, not precise valuation ranges or probability weights. A
              bull case requires audited growth above the March 2025 ARR claim, attractive retention and margins, clean
              conversion terms, and durable expansion from the defense award. A base case recognizes procurement
              strength but withholds a priced recommendation until current financial statements and ownership terms are
              available. A bear case combines a sustained private-market markdown with weak unit economics or senior
              claims that absorb exit proceeds. The assigned comparable evidence is inadequate for a conventional
              multiple set: FundedIQ compares Dataminr's 2021 round size with a broad artificial-intelligence financing
              median, not with similar businesses' valuation or operating multiples, while Forge provides an indicative
              company-specific signal rather than a completed transaction. The five-year competitive defense award is a
              positive exit-readiness indicator, but total contract value is not ARR and does not establish company-wide
              growth, profitability, or an exit path. Final diligence must therefore close the financial, cap-table, and
              comparable-transaction gaps before target return, hold period, or exit value can be underwritten.
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse a derived mark with an executable price
            body: >-
              Forge expressly describes its price as a derived data point rather than a quotation and says it may rely
              on limited data. The approximately 83% discount to the 2021 financing valuation is a material adverse
              signal, but underwriting still requires transaction evidence and security-level terms.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
