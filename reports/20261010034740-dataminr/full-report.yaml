  - id: TV003
    title: Bull, base, and bear decision scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks and probability signal
    rows:
      - - Bull
        - >-
          Audited ARR is above the March 2025 approach-to-$200M claim, growth and retention remain strong, defense
          delivery is on plan, and conversion terms are non-punitive.
        - >-
          A return case could be built from current audited metrics and an actual entry price; no defensible public
          valuation range is available.
        - >-
          Signal improves with audited cohort economics and contract expansion; no numeric probability is supportable
          from the assigned evidence.
      - - Base
        - >-
          Defense procurement validation remains durable, but private-company economics and capital terms stay
          unavailable.
        - >-
          Track without committing capital; require a term sheet and cap-table waterfall before calculating target
          return or hold period.
        - The public record supports demand but not margin or ownership outcomes; probability remains unquantified.
      - - Bear
        - >-
          The private-market markdown persists, unit economics disappoint, or convertible and credit claims rank ahead
          of new equity.
        - >-
          Downside cannot be bounded from public data because Forge is not a quotation and the preference stack is
          unknown.
        - >-
          Triggers are a lower executable price, weak audited retention or margins, contract-delivery issues, or senior
          claims consuming exit proceeds.
    notes: >-
      These are conditional diligence scenarios, not forecasts. No probability percentages, forward ARR, valuation
      ranges, or exit multiples are assigned because the necessary private financial and security-level evidence is
      unavailable.
