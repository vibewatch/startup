chapter:
  number: 6
  title: "Customers"
  summary: "Dataminr serves a diversified tier of corporate security, government defense, cyber intelligence, and newsroom accounts, anchoring its revenue scale on enterprise subscriptions and high-value federal defense contracts like the landmark $318 million U.S. Department of War award. Public disclosures point to broad institutional adoption, but audited net revenue retention and cohort churn remain undisclosed, and the business faces reputational headwinds from surveillance controversies."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation & Buyer Personas"
    body: >
      Dataminr segments its commercial and public-sector operations across four primary customer categories: corporate enterprise security, public sector defense and emergency response, cyber threat defense, and news media organizations. In the corporate enterprise market, Dataminr Pulse targets Chief Security Officers, Global Security Operations Centers (GSOC), and corporate resilience directors who monitor physical facility security, supply chain disruptions, and executive traveler safety. Within national defense and government bodies, First Alert and the newly released First Alert Advanced serve defense agencies, frontline military commands, and humanitarian organizations requiring indications, warnings, and battlefield situational awareness. In cyber defense, the acquisition of ThreatConnect expanded Dataminr's addressable footprint across Security Operations Centers and threat intelligence analysts, combining external public signals with internal corporate telemetry. Meanwhile, Dataminr for News serves journalists and newsrooms globally, providing real-time breaking alerts that strengthen brand awareness and platform visibility.
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-contract-scale"
    title: "Adoption Trajectory & Contract Scale Dynamics"
    body: >
      Dataminr's annual recurring revenue (ARR) trajectory demonstrates accelerating adoption across large institutional buyers, rising from approximately $190 million at year-end 2024 to $205 million at year-end 2025, and reaching an estimated $225 million in July 2026. This acceleration has been fueled primarily by robust expansion in international defense, where annualized recurring revenue grew more than 180% year-over-year in mid-2026. Commercial contract structures are typically structured as annual or multi-year enterprise licenses with pricing scaling by seat count, geography, and integrated API capabilities. For smaller municipal and state government deployments, standard public-sector First Alert seat pricing ranges between $6,000 and $10,000 per user annually. In contrast, large-scale defense deployments yield tens of millions in annual contract value, exemplified by Dataminr's landmark 5-year, $318 million U.S. Department of War agreement, which provides enterprise-wide real-time alerting across all military service branches through 2031.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "verified-customer-deployments-and-outcomes"
    title: "Production Deployments & Verified Customer Outcomes"
    body: >
      Verified customer reference deployments demonstrate multi-year production usage across corporate, international non-profit, educational, and military institutions. The United Nations deployed Dataminr First Alert in 2019 through its UN Global Pulse initiative, provisioning real-time crisis detection and early event warnings to thousands of personnel across humanitarian missions in more than 100 countries. In corporate financial services, Deutsche Boerse Group rolled out Dataminr Pulse in 2018 across approximately 60 global operating locations, integrating geospatial threat alerts into event response playbooks to accelerate operational decision-making for its physical security team. In higher education, Baylor University implemented First Alert in 2020 to safeguard students and faculty abroad, utilizing real-time event scoring to coordinate emergency travel triage and traveler repatriations during the onset of the COVID-19 pandemic. Furthermore, allied defense forces across 18 nations and 15 NATO member states rely on First Alert for indications and warnings, with NATO SHAPE operationalizing First Alert Advanced within Palantir Foundry workflows.
    claimRefs:
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "expansion-loops-and-concentration-risks"
    title: "Expansion Loops, Durability & Concentration Exposure"
    body: >
      Dataminr's commercial expansion strategy relies on land-and-expand dynamics, cross-selling cyber modules into corporate security accounts, and scaling channel distribution through systems aggregators and value-added resellers. In June 2026, Dataminr established a major distribution agreement with TD SYNNEX, authorizing more than 35,000 North American resellers to distribute Dataminr for Cyber Defense, thereby reducing direct sales friction. However, customer concentration presents material underwriting risk: the single $318 million U.S. Department of War award generates roughly $63.6 million in annualized revenue, accounting for over 28% of Dataminr's $225 million ARR base. Furthermore, public-sector retention is vulnerable to procurement disputes and political controversies. In late 2020, Dataminr lost its FBI social media intelligence contract to competitor Zerofox. Additionally, investigative reports revealing that Dataminr alerted law enforcement agencies to lawful racial justice and pro-Palestinian campus protests have triggered client scrutiny from academic institutions, municipal buyers, and civil liberties stakeholders.
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU008"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
