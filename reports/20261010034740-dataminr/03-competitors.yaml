callouts:
  - calloutType: "insight"
    title: "The GSOC Bottleneck and Asymmetric Switching Costs"
    body: "Dataminr's primary structural barrier is not algorithm capability, but customer operational absorption capacity. Delivering thousands of real-time multi-modal alerts creates tremendous value for scaled Fortune 500 security operations centers equipped to triage incoming feeds. However, for organizations without a 24/7 dedicated GSOC, the raw alert volume induces severe operator fatigue, creating an adoption barrier that agile, verified platforms like Factal and structured briefing providers like Region Alert exploit."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP007"
  - calloutType: "risk"
    title: "Vulnerability to Vertical Domain and Language Specialization"
    body: "While Dataminr positions itself as a comprehensive multi-modal risk platform across cyber, corporate, and public safety, domain-focused specialists present acute displacement risks. In cybersecurity, Recorded Future commands superior credibility and workflow integration, whereas in regional physical operations, local-language reporting frequently surfaces ground-truth threat signals hours before English-language social streams register them."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP007"
