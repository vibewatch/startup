- id: cybersecurity-and-product-governance
  title: Cybersecurity, product safety, and governance complexity
  body: 'Cybersecurity has moved from a technical side issue to a strategic risk category for inverter and storage vendors. ESMC and pv magazine both frame Chinese inverter dependence as a security problem, but the more nuanced point is that cyber risk is no longer just about country of origin. The reviewed sector debate says bans alone cannot solve the problem because installed bases, remote-access tools, gateways, and other connected devices remain attack paths. CISA advisories reinforce that critical infrastructure is still compromised through unpatched software, remote-management tools, and third-party access. Fox ESS’s public posture offers some mitigation: certificates, warranty infrastructure, installer programmes, and extensive documentation are visible. But none of those disclosures answer the hardest underwriting questions, such as field-failure rates, cyber hardening, recall history, or software-update governance. For a connected residential energy vendor, product safety and cyber
    trust now sit close to market access, not just after-sales support.'
  claimRefs:
