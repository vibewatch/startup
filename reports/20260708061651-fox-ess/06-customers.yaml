chapter:
  number: 6
  title: Customers
  summary: Fox ESS’s public customer evidence is strongest at the channel and installer layer rather than at the disclosed account-count layer. The reviewed corpus supports real customer adoption in the UK and Australia plus broad partner reach, but retention, concentration, and customer-count data remain materially opaque.
sections:
- id: customer-base-and-channel-structure
  title: Customer base segmentation and channel structure
  body: 'Fox ESS’s customer map is better understood as a channel system than as a disclosed account list. End customers are primarily homeowners and some SME users, but distributors and installers heavily shape who buys Fox hardware and how the brand is experienced after installation. The strongest official evidence is in the UK, where Fox ESS publishes a distributor list and a tiered installer programme rather than a direct-to-consumer sales story. That pattern is consistent with the broader business model already established in earlier chapters: Fox sells hardware through local channel partners, not through a transparent enterprise-account roster. The implication is two-sided. Channel structure can scale a private hardware company faster than direct sales, but it also means customer access, service quality, and even brand reputation can vary significantly by partner and by country. For diligence, that makes buyer-user-payer segmentation straightforward enough, while concentration by partner
    or country remains unresolved.'
  claimRefs:
