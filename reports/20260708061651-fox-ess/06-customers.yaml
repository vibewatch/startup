- id: satisfaction-durability-and-post-sale-engagement
  title: Satisfaction, durability, and post-sale engagement
  body: 'The public durability picture is mixed rather than uniformly positive or negative. Trustpilot’s UK-local page was materially stronger than the global corporate-domain page at fetch time, which suggests that localized channel execution may matter more than headquarters branding to actual user satisfaction. Community and training signals also help. FoxESS Community, recurring Tech Hub events, and multiple independent installer reviews all indicate that Fox ESS remains active after installation rather than disappearing after shipment. At the same time, adverse reviews point toward support variance, installer quality, and long-tail warranty confidence as real diligence issues. That pattern matters because it tells investors where to look: not primarily for spectacular product failure claims, but for whether local channel quality is consistent enough to protect customer experience as the installed base grows. Publicly, Fox ESS looks adopted and support-aware; privately, the key unknown
    is whether that experience is consistent across channels, geographies, installer tiers, and service outcomes globally.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU021
