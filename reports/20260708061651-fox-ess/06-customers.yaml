  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Active customer count and installed-base breakdown by country, product family, and partner tier.
    whyItMatters: Public proof establishes adoption, but not scale by cohort or geography.
    diligencePath: Request installed-base, active-site, and repeat-order data by country and channel tier.
    relatedQuestionRefs:
    - QU002
    - QU005
    - QU025
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal behavior, warranty-claim retention, and repeat-order data by installer or distributor cohort.
    whyItMatters: Durability is the core customer-quality question, and proxy signals are weaker than formal retention metrics.
    diligencePath: Request cohort retention, repeat-order, claim-resolution, and NPS data by market and partner tier.
    relatedQuestionRefs:
    - QU015
    - QU021
    - QU024
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top distributor and top-installer share of sales by country.
    whyItMatters: Channel strength can hide concentration risk if a small partner set drives most volume.
    diligencePath: Request top-10 partner revenue contribution, volume, and dependency by geography.
    relatedQuestionRefs:
    - QU018
    - QU022
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: continental-europe-customer-proof
    missingEvidence: More direct German, Dutch, Italian, and Polish customer or installer case studies in public English-language sources.
    whyItMatters: Current regional proof is strongest in the UK and Australia, leaving continental-Europe customer visibility thinner across languages and channel types.
    diligencePath: Collect local-language installer case studies and distributor references on the next refresh.
    relatedQuestionRefs:
    - QU023
