- id: expansion-and-concentration-risk
  title: Expansion logic and concentration risk
  body: 'Fox ESS likely expands value within accounts by attaching batteries, hybrid inverters, charging, and a broader ecosystem, but public evidence does not support a classic SaaS-style retention or NRR story. The more supportable expansion logic is partner-led and hardware-led: once an installer or distributor trusts the platform, Fox ESS can place more categories into the same channel. That is commercially useful, but it also hides concentration risk. Public sources do not reveal top distributor concentration, top-country revenue share at the customer level, or churn by installer cohort. The same partner dependence that drives growth can therefore become a fragility if a few distributors or installer networks account for most sell-through. The chapter’s final customer verdict is therefore balanced: Fox ESS clearly has real channel adoption and growing partner breadth, but public evidence is still too thin to underwrite concentration, churn, or expansion efficiency with confidence.'
