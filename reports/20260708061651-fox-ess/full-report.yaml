            body: >-
              Public peers help set the right valuation and disclosure expectations. Enphase, Sungrow, SolarEdge, and
              SMA all provide either public filings or continuously updated market-data surfaces that let investors
              compare market cap and revenue. Those benchmarks imply that listed solar hardware names often trade at
              low-single-digit revenue multiples rather than software-style valuation levels. That matters because Fox
              ESS’s private valuation references and storage-ranking headlines can otherwise create an overly optimistic
              mental model. Fox ESS may deserve a premium to a distressed hardware name if its growth and
              residential-storage standing are sustained, but it still sits in a category where channel inventory,
              policy shifts, and pricing pressure can compress multiples quickly. The best supportable public-only
              verdict is therefore balanced: Fox ESS has real scale and a plausible path to funding growth, but export
              concentration, incomplete disclosures, and margin opacity remain the main blockers to a stronger
