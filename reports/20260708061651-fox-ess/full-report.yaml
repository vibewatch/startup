            body: >-
              The biggest near-term risk is not that Fox ESS suddenly loses all customers, but that Europe gradually
              narrows the most attractive financed, procurement-friendly, and trust-acceptable routes to market.
            calloutType: risk
            claimRefs:
              - CR003
              - CR011
              - CR032
          - type: callout
            title: Compliance visibility is a real mitigant
            body: >-
              Fox ESS shows more public compliance surface than a low-end gray-market vendor: certificates, warranty
              pathways, documentation, and partner enablement are visible. That reduces but does not remove risk.
            calloutType: insight
