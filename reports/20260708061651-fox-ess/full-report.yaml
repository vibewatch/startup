  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Geopolitics, trade exposure, and market access
        blocks:
          - type: paragraph
            body: >-
              Fox ESS’s risk profile starts with geography. The public financial coverage reviewed for this report says
              overseas revenue reached 99.16% in H1 2025 and repeatedly describes Europe as the company’s core market.
              That makes Fox ESS unusually exposed to external policy shifts rather than domestic Chinese demand
              smoothing. The most important recent development is the European Commission direction reported by ESS
              News, which restricts EU funding for projects using inverter suppliers from countries deemed high risk and
              explicitly includes battery power-conversion systems. Even if that policy initially bites only funded
              projects, it matters because it narrows the best-financed routes to market and adds a new trust filter
              around vendor origin. NZIA resilience criteria strengthen the same direction of travel. Together, these
              signals do not prove an immediate sales collapse, but they do support a thesis that Fox ESS could face
              gradually tougher qualification, procurement, and financing conditions in the geographies that matter most
              to its current business over the next several reporting periods in Europe.
