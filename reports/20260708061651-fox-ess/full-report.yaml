      - number: '8.4'
        title: Valuation verdict and scenario range
        blocks:
          - type: paragraph
            body: >-
              The upside case for Fox ESS is straightforward: it has real revenue scale, residential-storage leadership,
              broad product coverage, and third-party performance proof that make the business feel more substantial
              than many private clean-tech stories. The downside case is equally clear: Europe concentration, policy
              exposure, capital intensity, and private-company disclosure gaps can compress hardware multiples fast.
              These two truths can coexist. That is why the most supportable stance is fair rather than cheap. Fox ESS
              likely deserves a premium to distressed solar hardware, but it does not yet deserve an unqualified premium
              to best-in-class public comps. Until investors get better visibility into margins, share count, working
              capital, recall history, and true regional diversification, the correct underwriting posture is to treat
              the company as a credible unicorn with meaningful optionality, but also with a multiple that is already
              doing some of the work for management.
