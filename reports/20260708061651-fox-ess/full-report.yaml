              - CV009
      - number: '8.2'
        title: Revenue base and implied private multiple
        blocks:
          - type: paragraph
            body: >-
              The prospectus-update coverage provides the revenue base needed to move beyond storytelling. EnergyTrend
              and Energy-Storage.news both report 2024 revenue of RMB 3.392 billion and H1 2025 revenue of RMB 2.242
              billion, while also describing Fox ESS as a Europe-heavy exporter with 99.16% overseas revenue in H1 2025.
              Combined with the >RMB 10 billion private valuation floor, those disclosures imply a private-company sales
              multiple above roughly 2.9x on 2024 revenue. That multiple is not absurd for a growth hardware company,
              but it is not conservative either. It assumes investors give real credit to market leadership,
              international growth, and storage-category momentum. The size of the planned RMB 1.661 billion IPO raise
              reinforces the point: the market is being asked not only to recognize existing scale, but also to fund
              meaningful future expansion. That naturally pushes valuation sensitivity higher because dilution, policy,
              and execution risks all feed into how attractive that next step looks.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
