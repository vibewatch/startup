            body: >-
              The public architecture appears hardware-led and installer-mediated. Fox ESS markets PV and hybrid
              inverters as the control center, batteries as the storage layer, and monitoring plus support surfaces as
              the operational layer after installation. The hybrid page explicitly ties systems to high-voltage
              batteries and efficiency claims, while the PV page publishes efficiency bands and operating-range
              messaging. More revealing is the community evidence: Home Assistant threads and two separate Modbus
              integrations show that advanced users can interrogate Fox hardware directly through RS485 or LAN adapters,
              expose firmware and battery metadata, and in some cases avoid the cloud entirely. That is meaningful
              because it shows the ecosystem is usable beyond brochureware. It also suggests that deployment and
              integration quality depend heavily on field setup, firmware handling, and installer competence rather than
              on a fully closed consumer platform experience. The product works in an open hardware ecosystem, but that
