        title: Capital adequacy, capex plan, and IPO dependency
        blocks:
          - type: paragraph
            body: >-
              Fox ESS is clearly pursuing capital to expand, not merely to clean up a balance sheet. Multiple IPO
              summaries say the company wants RMB 1.661 billion, plans to issue up to 90 million shares, and would use
              proceeds for an industrial park, R&D, marketing and technical support, and working capital. That is
              consistent with a business funding manufacturing capacity, service infrastructure, and overseas growth
              simultaneously. The same evidence also supports a more cautious read. Because more than 99% of H1 2025
              revenue reportedly came from overseas markets, Fox ESS likely needs capital not only for factories but
              also for inventory, logistics, channel credit, localization, and FX management. Public sources do not
              disclose cash on hand, debt, or runway, so the underwriting question is not whether Fox ESS needs capital,
              but how tight the current balance-sheet buffer is relative to its expansion plan. The IPO process itself
              also showed friction when financial data lapsed and documents had to be refreshed at the end of 2025.
