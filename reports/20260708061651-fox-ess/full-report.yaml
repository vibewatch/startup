              the same families across different documentation surfaces, which is stronger evidence than a single
              marketing page. For product diligence, the practical takeaway is that Fox ESS already looks like a
              multi-SKU platform serving residential and some larger three-phase use cases, not a one-SKU challenger
              living off one launch cycle, and the documentation pattern reinforces that breadth.
