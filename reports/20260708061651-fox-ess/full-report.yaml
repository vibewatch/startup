      - number: '1.3'
        title: Scale signals, channel structure, and regional proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale signals are directional rather than fully audited, but they still show a
              company with real channel reach. Fox ESS claims large three-year installed bases for batteries, PV
              inverters, and EV chargers, and it says more than 400 people work in R&D. In the UK and Ireland, the local
              site describes a structured go-to-market model with strategic distributors, approved distributors, and a
              three-tier accredited-installer programme that requires training and code-of-conduct compliance. A
              third-party installer page from ACD Green-Tech confirms that Fox ESS products are actively sold through
              named installers, while the official UK site positions Fox ESS as both a local and global
              residential-storage leader using S&P Global as the citation anchor. Australia offers similar localization
              proof: Fox ESS says it has offices in Melbourne and Sydney, more than 30 local specialists, and VPP
              integrations with Amber Electric and Origin Loop. At the same time, external review and customer-sentiment
              sources add nuance. Trustpilot shows a stronger score for the UK local site than for the global corporate
              domain, and Solar Choice argues that Fox ESS’s short operating history still leaves long-tail warranty
              durability as a live diligence question.
