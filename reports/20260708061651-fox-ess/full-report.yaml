      - number: '2.3'
        title: Growth drivers, policy support, and competitive benchmark
        blocks:
          - type: paragraph
            body: >-
              Demand is being pushed by a combination of economics and product maturation. SolarPower Europe explicitly
              links home-battery adoption to electricity-cost pressure and energy independence, while Ofgem’s rules make
              clear why export tariffs and time-of-use spreads matter: batteries are valuable because they let a
              household arbitrage between import prices, export rates, and self-consumption. Europe’s 2025 growth also
              reflects falling technology cost, stronger investor confidence, and rising revenue-stacking opportunities.
              On the supply side, Wood Mackenzie and InfoLink show how concentrated and sophisticated the vendor
              landscape has become. A small number of brands dominate inverter and storage shipments, and leading
              vendors now compete on long warranties, integrated control software, and regionally resilient supply
              chains rather than on hardware price alone. Competitor launches in 2026 further show the direction of
              travel: Huawei emphasizes AI and grid-forming control, Sungrow all-in-one modularity, SolarEdge
              cybersecurity-backed resilience, GoodWe and Growatt all-in-one home platforms, and SMA one-source home
              energy integration.
            claimRefs:
