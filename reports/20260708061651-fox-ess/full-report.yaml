  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue scale, mix, and monetization model
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence comes from prospectus-update coverage rather than a directly
              retrieved prospectus PDF. Even with that caveat, the disclosed path is meaningful: revenue reportedly rose
              from RMB 2.486 billion in 2022 to RMB 2.90 billion in 2023 and RMB 3.392 billion in 2024, with H1 2025
              already at RMB 2.242 billion. That trajectory is consistent with a real hardware business rather than a
              pilot-stage story. The model is also fairly clear. Fox ESS sells inverter and storage hardware through
              distributor and installer channels, not through recurring-software contracts. That means revenue quality
              depends on sell-through, channel inventory behavior, geographic mix, and policy-sensitive household
              storage demand. External benchmarks like GetLatka provide a rough validation that Fox ESS reached scale,
              but the prospectus-update figures are more precise and should be treated as the primary public numbers for
              this report. The key caveat is that realized pricing, rebates, and channel gross-to-net adjustments remain
              opaque.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
