      - number: '4.2'
        title: Profitability, unit economics, and quality of earnings
        blocks:
          - type: paragraph
            body: >-
              The disclosed profit line suggests Fox ESS is not merely chasing revenue at any cost. Prospectus-update
              reporting says the company remained profitable in every disclosed period from 2022 through H1 2025, even
              though the profit path was uneven and likely reflected the channel and regional volatility described in
              later coverage. That matters because residential solar hardware can look large on revenue while being
              fragile on margin. The public evidence still falls short of a full quality-of-earnings view. There is no
              public gross-margin bridge, no CAC or payback disclosure, and no receivables-aging or returns data in the
              sources reviewed here. Regional commentary from OFweek does, however, show how inventory buildup and
              declining power prices in Europe could hit revenue quality even when the company remains profitable. The
              safest reading is that Fox ESS has achieved scale and positive earnings, but its margin durability is
              still a diligence question because the public record does not expose the unit-economics plumbing behind
              those results.
