      - number: '8.3'
        title: Public peer triangulation
        blocks:
          - type: paragraph
            body: >-
              Public comps help show where Fox ESS could plausibly trade if it were listed today. Using simple
              market-cap-to-revenue math from CompaniesMarketCap, Enphase screens a little above 4x sales, Sungrow
              around 3.3x, and SMA around 1.2x, while SolarEdge’s Macrotrends history highlights a much weaker roughly
              1x sales reference point. This spread is exactly why Fox ESS is hard to call either obviously cheap or
              clearly overvalued. Fox has more growth narrative and private-market momentum than a stressed peer like
              SolarEdge, but it does not yet offer the disclosure quality, governance transparency, or public-market
              trust of the cleanest listed names. The right inference is that Fox belongs somewhere inside the peer
              band, not outside it. Its current floor above RMB 10 billion therefore looks supportable, but only if
              investors continue to reward the company more like a growth leader than like a volatile, policy-exposed
              hardware exporter.
