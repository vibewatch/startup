              Fox ESS likely expands value within accounts by attaching batteries, hybrid inverters, charging, and a
              broader ecosystem, but public evidence does not support a classic SaaS-style retention or NRR story. The
              more supportable expansion logic is partner-led and hardware-led: once an installer or distributor trusts
