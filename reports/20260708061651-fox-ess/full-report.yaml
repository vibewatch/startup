  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, peer set, and benchmark vendors
        blocks:
          - type: paragraph
            body: >-
              Fox ESS is not competing in an empty white space. The practical peer set includes Chinese
              integrated-storage incumbents such as Sungrow, Huawei FusionSolar, GoodWe, Growatt, and SOFAR Solar;
              installer-trust incumbents such as SMA and SolarEdge; and the architecturally distinct but
              benchmark-setting microinverter platform Enphase. Wood Mackenzie’s 2025 inverter ranking matters because
              it shows how concentrated the field already is: scale is not evenly distributed, and a small top cohort
              still controls most market share. Independent buyer guides reinforce the same picture from a different
              angle. Residential buyers are routinely shown hybrid inverters, batteries, EV chargers, and monitoring as
              one system choice, not a standalone component choice. That means Fox ESS is compared not just on inverter
              efficiency, but on full-stack packaging, warranty comfort, app experience, and installer confidence. In
              short, the competitive frame is a crowded integrated-home-energy market with a few very scaled leaders and
              a long list of credible challengers.
