            title: Europe is the real lens, not global ESS alone
            body: >-
              Europe-wide storage statistics are useful context, but Fox ESS’s disclosed sales concentration and
              installer-led channel make distributed European storage the practical market to underwrite. Utility-scale
              ESS numbers can make the headline market look bigger than the company’s current serviceable lane.
