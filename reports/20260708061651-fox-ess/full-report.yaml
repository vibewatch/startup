      - number: '7.3'
        title: IPO process, cost of capital, and financing risk
        blocks:
          - type: paragraph
            body: >-
              Fox ESS is not simply managing operating risk; it is managing risk while trying to complete a large
              IPO-backed expansion path. Public sources show a valuation floor above RMB 10 billion in prior financing,
              large production-capacity ambitions, and a prospectus process that needed to be refreshed. None of those
              facts is inherently negative, but they create sensitivity to timing and sentiment. If European policy risk
              worsens, if investors become more skeptical of Chinese clean-tech exporters, or if disclosure requests
              intensify, Fox ESS could face a more difficult capital-raising environment just as it needs funds for
              manufacturing, service systems, and working capital. This matters because hardware businesses usually
              cannot rely on asset-light flexibility during market stress. They need inventory, logistics, compliance
              teams, and often channel credit. The main risk is therefore not just whether the IPO closes, but whether
              financing remains available on attractive enough terms to preserve growth without damaging future returns.
