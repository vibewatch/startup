    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Fox ESS presents itself as a young but already global renewable-energy equipment company rather than a
              single-product inverter brand. The strongest official evidence is internally consistent on the company's
              starting point: Fox ESS says it was founded in September 2019, established a Wuxi R&D center in the same
              year, and later moved into a Wenzhou headquarters footprint while building additional R&D capacity in
              Shanghai, Wuhan, and Germany. The current contact page gives a precise Wenzhou address, and the homepage
              plus company page say the business now spans more than 70 countries, six R&D centers, and more than 5,000
              employees. Product breadth matters because it explains the business model: the company sells PV inverters,
              hybrid inverters, residential and C&I batteries, EV chargers, heat pumps, and its FoxCloud monitoring
              stack, then distributes those products through local channels such as the UK installer and distributor
              network. That portfolio breadth, paired with very high overseas revenue exposure in prospectus-update
              coverage, means Fox ESS should be understood as an export-led hardware platform for residential and
              light-commercial solar-plus-storage rather than a domestic China-only inverter maker.
