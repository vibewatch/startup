      - number: '3.2'
        title: Capability, pricing posture, and buyer criteria
        blocks:
          - type: paragraph
            body: >-
              Public comparison sources show that the competition is not only about raw hardware specs. Enphase’s
              homeowner stack and SolarEdge’s Nexis line both emphasize premium control and resilience, while Huawei,
              Sungrow, GoodWe, Growatt, and Fox ESS all push integrated battery-plus-inverter system logic. Independent
              review ecosystems still place meaningful weight on trust, warranty clarity, and installer familiarity.
              That favors premium brands in some markets, especially where homeowners search directly, but it does not
              eliminate value-led challengers. Fox ESS’s installer reviews and comparison articles suggest its best
              wedge is practical value: modular batteries, straightforward installs, and acceptable warranty terms at a
              lower perceived price tier than premium incumbents. The weakness is transparency. Public pricing is often
              quote-driven and channel-mediated, so it is easier to infer relative packaging and value posture than to
              prove exact street price differences across countries. For diligence, that means capability comparison is
              supportable, while realized price leadership remains only partially observable from public evidence.
