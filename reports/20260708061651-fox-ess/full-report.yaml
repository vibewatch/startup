      - number: '1.4'
        title: Milestones, manufacturing expansion, and disclosure risks
        blocks:
          - type: paragraph
            body: >-
              Fox ESS’s milestone path is unusually compressed. From founding in 2019, the company says it launched
              first products and overseas shipments by 2020, built branch infrastructure across Europe, Australia, and
              Latin America by 2022, and entered EV charging plus pre-IPO fundraising in 2023. That growth narrative
              culminates in 2025 and 2026 with an IPO filing, first ESG report, first utility-storage activity in
              Europe, and visible participation at major trade events such as Smart Energy Australia, SNEC, and The
              Smarter E Europe. The 2026 manufacturing story reinforces the same expansion thesis: Fox ESS says its
              Phase II Wenzhou factory opened on a roughly 46,000 m² site, can output one battery pack every seven
              seconds, uses more than 60% automation, and shortens the time from material receipt to line commissioning
              to under five minutes. Those details suggest a company investing for scale and delivery speed ahead of
              public-market scrutiny. The main disclosure gaps are not whether Fox ESS is growing, but how cleanly
              outsiders can underwrite that growth. Board composition, founder ownership, named pre-IPO investors, and
              the official parent-company control chain remain less transparent than the operating narrative.
