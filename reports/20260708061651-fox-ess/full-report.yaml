      - number: '3.3'
        title: Distribution power, switching costs, and channel leverage
        blocks:
          - type: paragraph
            body: >-
              The most important competitive mechanic in Fox ESS’s category is channel power. Homeowners rarely buy
              directly from a manufacturer; they buy what installers know, can source quickly, and are willing to
              support after the sale. Fox ESS’s official UK evidence and Australian event messaging confirm that its GTM
              relies on distributors, accredited installers, and partner enablement rather than direct retail. That is a
              strength because it creates localized sell-through, but it also caps lock-in. Installers can multi-home
              across several brands and shift recommendations if supply, warranty handling, or margin support changes.
              Independent buyer guides reinforce that a system-specific fit still matters more than any single brand
              narrative. In practice, Fox ESS appears to have real channel credibility in value-conscious installer
              networks, but those same networks can switch if larger vendors offer better financing, better software, or
              less operational friction. This makes Fox ESS more defensible as a channel-execution story than as a
              deep-lock-in platform story.
            claimRefs:
