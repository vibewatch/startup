  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Private valuation anchors and funding context
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation anchor for Fox ESS is not a fully modeled DCF or a disclosed post-money cap
              table. It is a set of partial but still useful public markers: the company page says Fox ESS achieved
              pre-IPO financing at a valuation above RMB 10 billion in 2023, while CB Insights classifies the company in
              its unicorn collection and reports a cumulative funding total of $141.58 million. Those signals tell
              investors two things. First, Fox ESS is already a real scale asset in the eyes of private markets and data
              providers rather than an aspirational early-stage name. Second, the current floor is not trivial: it
              already embeds expectations for durable growth, successful IPO execution, and continued overseas
              relevance. In other words, the valuation question is not whether Fox ESS deserves to be worth more than
              zero or even more than a typical mid-market hardware maker. The real question is whether the next leg of
              value creation deserves to keep the company near the upper half of peer hardware ranges.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV036
          - type: table
            tableRef: TV001
            claimRefs:
