      - number: '7.4'
        title: Integrated risk verdict and mitigants
        blocks:
          - type: paragraph
            body: >-
              The right way to read Fox ESS risk is as an interaction problem. Export concentration makes policy changes
              more painful; cyber-trust concerns intensify policy scrutiny; broader product scope increases
              certification, warranty, and safety complexity; and IPO timing amplifies all of those issues by attaching
              financing needs to external sentiment. There are still meaningful mitigants. Fox ESS does not look like a
              fly-by-night supplier: it publishes product breadth, certificates, warranties, installer infrastructure,
              and local-market support signals. Those surfaces matter because they suggest the company is trying to
              operate inside major-market compliance systems. But the public record still leaves too much unresolved to
              underwrite with low risk. The most supportable conclusion is a high risk rating driven by geopolitical and
              regulatory uncertainty layered onto the ordinary hazards of scaling connected residential hardware across
              many jurisdictions at the current stage.
