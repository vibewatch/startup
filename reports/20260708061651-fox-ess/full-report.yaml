  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lens
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Fox ESS is narrower than global energy storage in aggregate. Fox ESS sells
              through installer-led distributed channels, and the sources in this chapter show that the relevant
              job-to-be-done is not utility-scale storage procurement but residential and light-commercial
              solar-plus-storage deployment. SolarPower Europe’s residential battery outlook frames the segment around
              rising electricity prices, energy independence, and renewable integration, while the 2026 Europe battery
              summary shows a market that has already surpassed 100 GWh of installed capacity and is still accelerating.
              That acceleration is not purely residential: utility-scale batteries crossed half of annual European
              installations for the first time in 2025. For diligence, this means headline ESS figures can overstate the
              addressable space for Fox ESS. A more useful lens is Europe’s distributed portion of the market,
              especially geographies where installer networks, self-consumption economics, and supportive policy
              frameworks make hybrid inverters plus modular batteries a mainstream household or SME purchase.
