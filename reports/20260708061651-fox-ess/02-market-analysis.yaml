- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Fox ESS
  - Diligence ask
  rows:
  - - High retail electricity prices and self-consumption appeal
    - Driver
    - Current / ongoing
    - Improves household payback logic for hybrid inverter plus battery systems
    - Quantify payback sensitivity in Germany, UK, Poland, and Australia
  - - SEG and other export / flexibility programs
    - Driver
    - Current / ongoing
    - Raises the value of controllable storage and VPP-capable systems
    - Map current export and flexibility tariffs by Fox’s core geographies
  - - Integrated all-in-one product evolution
    - Driver
    - Current / ongoing
    - Makes backup, monitoring, and installation simplicity a baseline expectation
    - Benchmark Fox ESS setup and app experience against SolarEdge, Sungrow, and GoodWe
  - - Permitting and grid-access barriers
    - Constraint
    - Current / ongoing
    - Can slow actual installations even when demand exists
    - Assess backlog and interconnection friction in core European regions
  - - Shipment growth without margin expansion
    - Constraint
    - 2025-2026
    - Could make a fast-growing vendor less profitable than top-line numbers imply
    - Request gross-margin bridge and cost pass-through evidence from Fox ESS
  - - Policy volatility and regional demand contraction risk
    - Constraint
    - 2025-2026
    - Creates downside if incentives or grid economics weaken in key export markets
    - Stress-test sales concentration against policy or demand changes in Germany, UK, and Poland
  notes: 'The same factor can create both upside and fragility: strong policy and tariff support expands demand, while policy shifts and margin pressure can quickly compress vendor economics.'
