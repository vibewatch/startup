- id: buyers-segments-and-access-path
  title: Buyers, segments, and access path
  body: The buyer map in this market is multi-layered. End users are homeowners and small businesses that want lower bills, resilience, or EV-friendly energy management. Installers and EPCs often act as the practical specifier because most households buy a system, not a collection of components. Distributors then determine which brands are available, what technical support exists, and how quickly replacement units can move. Policy and utility programs shape the payer logic by changing the value of self-consumption and exports. In the UK, for example, the price cap affects the baseline avoided cost of electricity while SEG governs the export value of solar generation; batteries sit between those two prices. Fox ESS’s own UK site confirms that its route to market is installer and distributor-led, while the official and third-party competitor pages show that Sungrow, SolarEdge, GoodWe, Growatt, Huawei, and SMA are all trying to win the same household by promising tighter integration, better
    backup, easier commissioning, and smarter software control.
