- id: constraints-and-fox-relevant-serviceable-market
  title: Constraints and Fox-relevant serviceable market
  body: 'The market is attractive, but it is not frictionless. SolarPower Europe still calls for faster permitting and better grid access, which means adoption can bottleneck even when demand exists. Wood Mackenzie’s inverter analysis adds another warning: shipment leadership coexists with an expectation of demand contraction in some regions, highlighting how cyclical and policy-sensitive the sector remains. InfoLink adds a further caution that strong shipment growth can fail to translate into margin expansion when integrators cannot pass through cost increases. For Fox ESS specifically, public data imply a serviceable market concentrated in export-led distributed energy rather than the entire storage sector. Prospectus-update coverage says Germany, the UK, and Poland generate more than 60% of sales and that overseas revenue was above 99% in H1 2025. That points to a SAM built around Europe-first distributed storage, installer trust, and supportive local economics. What remains missing is
    a public split between Fox ESS residential and C&I revenue, plus country-level exposure to subsidies and tariff design inside the top three markets. Those missing denominators are the main blockers to a tighter SOM estimate.'
