    - Household discretionary / home-improvement budget
  - - SME / light commercial
    - Owner-manager or facilities lead
    - Site operations
    - Business entity
    - Seeks self-consumption, tariff control, outage resilience
    - Facilities / energy / capex budget
  - - Installer-led retrofit
    - Installer / EPC recommends brand to customer
