  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: foxess-segment-split
    missingEvidence: No public source in this run isolates Fox ESS residential versus C&I revenue or shipment mix.
    whyItMatters: Without segment split, the serviceable market for Fox ESS can only be bounded directionally and cannot be tied cleanly to revenue quality.
    diligencePath: Request product-line revenue, shipment mix, and gross-margin split from management or the prospectus.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: country-level-exposure
    missingEvidence: This run did not retrieve a country-by-country subsidy, tariff, and sell-through breakdown for Germany, the UK, and Poland.
    whyItMatters: Fox ESS’s public sales concentration makes country-level policy dependence a first-order underwriting variable.
    diligencePath: Map tariff structures, subsidy exposure, and sell-through by country using local market disclosures and internal sales data.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: enumeration-incomplete
    severity: minor
    topic: market-definition-edge-cases
    missingEvidence: The chapter does not quantify every adjacency such as utility-scale hybrid projects, telecom storage, or off-grid micro-storage because those are peripheral to the Fox ESS thesis.
    whyItMatters: Market-boundary ambiguity can distort TAM storytelling if adjacencies are mixed with the core installer-led segment.
    diligencePath: Keep future refreshes focused on segment-specific markets and avoid mixing utility-scale and residential categories in one headline figure.
    relatedQuestionRefs:
    - QM001
  - type: stale
    severity: minor
    topic: 2026-vendor-roadmaps
