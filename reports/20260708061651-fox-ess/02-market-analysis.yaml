callouts:
- calloutType: insight
  title: Europe is the real lens, not global ESS alone
  body: Europe-wide storage statistics are useful context, but Fox ESS’s disclosed sales concentration and installer-led channel make distributed European storage the practical market to underwrite. Utility-scale ESS numbers can make the headline market look bigger than the company’s current serviceable lane.
  claimRefs:
  - CM002
  - CM003
  - CM030
  - CM031
  - CM043
- calloutType: risk
  title: Growth does not remove policy and margin risk
  body: Shipment growth in both Europe and the wider ESS market is impressive, but SolarPower Europe still cites permitting and market-access barriers, and InfoLink warns that cost pressure can break the link between shipment volume and supplier profitability.
  claimRefs:
  - CM011
  - CM012
  - CM025
  - CM046
