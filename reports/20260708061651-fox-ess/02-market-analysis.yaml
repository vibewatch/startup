    - End customer pays, installer influences choice
    - Training, product availability, warranty confidence
    - End customer budget mediated by installer
  - - Distributor-led volume channel
    - Distributor decides stocking breadth
    - Installers and resellers pull from stock
    - Distributor working capital and vendor credit
    - Fast fulfillment, technical support, pricing packages
    - Distributor procurement budget
  - - VPP / tariff-enabled household
    - Supplier or aggregator offers program overlay
    - Homeowner and control platform
    - Value shared via tariff or aggregation program
    - Battery plus software plus export participation
    - Supplier or aggregator economics plus household savings
  notes: The market does not have one buyer; Fox ESS succeeds only when it satisfies both the end-customer economics and the installer / distributor channel economics that influence brand selection.
