chapter:
  number: 2
  title: Market Analysis
  summary: Fox ESS competes in a fast-growing distributed solar-plus-storage market anchored in Europe and Australia rather than in the entire global ESS stack. Public data show record 2025 European battery installations, strong policy support for export and self-consumption, and a buyer journey increasingly shaped by integrated home-energy systems, but growth is uneven across segments and does not eliminate regulatory, channel, or margin risk.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing lens
  body: 'The right market boundary for Fox ESS is narrower than global energy storage in aggregate. Fox ESS sells through installer-led distributed channels, and the sources in this chapter show that the relevant job-to-be-done is not utility-scale storage procurement but residential and light-commercial solar-plus-storage deployment. SolarPower Europe’s residential battery outlook frames the segment around rising electricity prices, energy independence, and renewable integration, while the 2026 Europe battery summary shows a market that has already surpassed 100 GWh of installed capacity and is still accelerating. That acceleration is not purely residential: utility-scale batteries crossed half of annual European installations for the first time in 2025. For diligence, this means headline ESS figures can overstate the addressable space for Fox ESS. A more useful lens is Europe’s distributed portion of the market, especially geographies where installer networks, self-consumption economics,
    and supportive policy frameworks make hybrid inverters plus modular batteries a mainstream household or SME purchase.'
