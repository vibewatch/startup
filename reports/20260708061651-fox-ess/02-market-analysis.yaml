tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for Fox ESS
  rows:
  - - Residential solar-plus-storage
    - Hybrid inverter, battery, EMS, installer labor, monitoring, backup add-ons
    - Utility-scale battery parks and merchant-only grid assets
    - Homeowner user; installer specifier; household payer
    - This is the clearest Fox ESS fit based on UK channel evidence and product portfolio
  - - Light-commercial / SME storage
    - Three-phase inverters, C&I batteries, installer/EPC integration, tariff optimization
    - Large utility-scale storage and standalone grid-balancing assets
    - SME owner or facilities lead; distributor and EPC influence
    - Relevant because Fox ESS sells larger three-phase and C&I products but public sales split is undisclosed
  - - Utility-scale storage
    - Grid services, large PCS/BESS projects, project finance, merchant storage economics
    - Household backup and self-consumption systems
    - Developer, utility, IPP, financier
    - Important industry context, but not the core public route-to-market for Fox ESS
  - - Virtual-power-plant enablement
    - Software integration, control, tariff response, export orchestration
    - Physical generation-only assets with no controllability
    - Supplier, aggregator, and end customer share value
    - Fox ESS explicitly cites VPP partners in Australia, making this a monetization enhancer
  - - Installer and distribution channel
    - Training, local stock, technical support, warranty processing
    - Direct-to-consumer commodity battery sales
    - Distributor and installer act as gatekeepers
    - Channel depth determines whether Fox ESS can turn market growth into sell-through
  notes: Defines the market around the workflows and spending categories that a distributed solar-plus-storage vendor can actually capture; utility-scale storage is included as a context segment but not as the core Fox ESS fit.
