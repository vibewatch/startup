  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Country-level installer quotation data for matched Fox ESS, Growatt, GoodWe, Sungrow, and SolarEdge systems.
    whyItMatters: Value positioning is central to the thesis, but public web evidence shows packaging posture more clearly than actual sell-through pricing.
    diligencePath: Request distributor quote books or anonymized installer proposals across the UK, Germany, and Australia.
    relatedQuestionRefs:
    - QP009
    - QP021
  - type: private-evidence-only
    severity: material
    topic: fox-inverter-share
    missingEvidence: A third-party estimate of Fox ESS share within residential inverter shipments rather than storage shipments alone.
    whyItMatters: Competitive power differs if Fox is leading storage pairings but not inverter share in the same regions.
    diligencePath: Seek Wood Mackenzie, EUPD, or distributor panel data on residential inverter share by country.
    relatedQuestionRefs:
    - QP024
  - type: enumeration-incomplete
    severity: minor
    topic: distributor-concentration
    missingEvidence: Country-level distributor and installer-volume concentration for Fox ESS outside the UK.
    whyItMatters: Channel depth is a core competitive asset, but concentration risk determines durability.
    diligencePath: Request active-distributor volumes by country and top-partner share of shipments.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: minor
    topic: entrant-watchlist
    missingEvidence: A consistent third-party watchlist for likely new residential-storage entrants beyond the current peer set.
    whyItMatters: The market is expanding and could see faster crowding than current review ecosystems capture.
    diligencePath: Monitor future buyer guides and trade-show launch roundups through the next refresh cycle.
    relatedQuestionRefs:
    - QP023
