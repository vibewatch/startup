  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-debt
    missingEvidence: Current cash balance, debt schedule, covenant profile, and monthly cash burn.
    whyItMatters: Without cash and debt detail, the IPO dependency and runway cannot be underwritten.
    diligencePath: Request latest management balance sheet, debt schedule, and rolling cash forecast.
    relatedQuestionRefs:
    - QI014
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Gross margin by product family and geography plus reconciliation to operating profit.
    whyItMatters: Hardware valuation depends heavily on gross-margin durability and mix quality.
    diligencePath: Request audited margin bridge, warranty reserves, and freight/tariff cost allocations.
    relatedQuestionRefs:
    - QI003
    - QI022
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Top distributor, top country, and top-customer revenue concentration.
    whyItMatters: Export-heavy hardware companies can look diversified while actually depending on a narrow partner base.
    diligencePath: Request top-10 customer and distributor revenue share for 2024 and H1 2025.
    relatedQuestionRefs:
    - QI002
    - QI025
  - type: missing-source
    severity: minor
    topic: audited-prospectus-pdf
    missingEvidence: Direct retrieved SZSE or CNInfo prospectus document with line-item financial statements.
    whyItMatters: Current figures rely on secondary summaries rather than a directly reviewed filing PDF.
    diligencePath: Monitor official disclosure portals and attach the source document on the next refresh.
    relatedQuestionRefs:
    - QI004
    - QI005
