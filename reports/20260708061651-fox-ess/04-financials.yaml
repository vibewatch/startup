callouts:
- calloutType: risk
  title: The biggest financial risk is not scale, but opacity around margin and working capital
  body: Fox ESS appears to be a real, profitable hardware business at meaningful revenue scale. The underwriting challenge is that public sources still do not expose gross margin, receivables, debt, or runway in a way comparable to public peers.
  claimRefs:
  - CI013
  - CI034
  - CI035
  - CI036
  - CI040
- calloutType: insight
  title: Export concentration is both the growth engine and the balance-sheet stress point
  body: The same overseas focus that fueled Fox ESS’s expansion also increases sensitivity to logistics, FX, trade policy, and channel inventory conditions. That makes capital adequacy and working-capital management central diligence questions ahead of any IPO.
  claimRefs:
  - CI010
  - CI017
  - CI018
  - CI038
  - CI039
