    - Material
    - No reviewed source publishes a margin bridge
    - Obtain audited prospectus section or management disclosure
  - - Cash, debt, and runway
    - Blocking
    - No public balance-sheet detail in reviewed corpus
    - Request latest management accounts and debt agreements
  - - Top-customer and top-distributor concentration
    - Material
    - Revenue is export-heavy but partner concentration is undisclosed
    - Request customer concentration and top-partner sales share
  - - Receivables aging and inventory days
    - Material
    - Hardware expansion can hide channel stress in working capital
    - Request DSO, DIO, and write-down history
  - - Residential vs C&I revenue split
    - Material
    - Current public revenue is aggregate only
    - Request product-family revenue mix and gross margin split
  notes: Each gap is paired to a concrete diligence path because public evidence is sufficient for scale but not for full underwriting.
