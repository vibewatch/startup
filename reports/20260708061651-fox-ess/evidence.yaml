    severity: material
    topic: country-level-exposure
    missingEvidence: >-
      This run did not retrieve a country-by-country subsidy, tariff, and sell-through breakdown for Germany, the UK,
      and Poland.
    whyItMatters: Fox ESS’s public sales concentration makes country-level policy dependence a first-order underwriting variable.
    diligencePath: >-
      Map tariff structures, subsidy exposure, and sell-through by country using local market disclosures and internal
      sales data.
    relatedQuestionRefs:
