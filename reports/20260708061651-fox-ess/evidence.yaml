  - type: conflicting-data
    severity: minor
    topic: parent-company-structure
    missingEvidence: >-
      The Tsingshan and REPT relationship appears only in third-party reviews within this corpus, not in current
      official Fox ESS English pages.
    whyItMatters: Ownership and supply-chain control affect strategic alignment, supplier concentration, and related-party risk.
    diligencePath: >-
      Verify the legal ownership chain through Chinese corporate filings, the IPO prospectus, and any official group
      disclosures.
    relatedQuestionRefs:
