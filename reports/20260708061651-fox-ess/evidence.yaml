  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A complete board roster, founder roster, and executive org chart were not surfaced in the fetched public corpus.
    whyItMatters: Governance quality, succession risk, and board independence are core underwriting questions for a pre-IPO company.
    diligencePath: >-
      Obtain the latest prospectus, board list, and corporate presentation directly from Fox ESS or the exchange filing
      package.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Public sources do not disclose the names, ownership percentages, or preference terms of A-round or pre-IPO
      investors.
    whyItMatters: >-
      Without the cap table, investors cannot assess dilution, control rights, liquidation preferences, or related-party
      exposure.
    diligencePath: Request the current capitalization table, shareholder agreement summary, and round-by-round financing schedule.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: official-ipo-documents
    missingEvidence: >-
      This run did not retrieve the underlying ChiNext prospectus or exchange file directly, only credible secondary
      reporting on its contents.
    whyItMatters: >-
      Primary IPO documents are needed to validate revenue, profit, use-of-proceeds, and sponsor details at source
      level.
    diligencePath: Pull the final prospectus, sponsor letter, and SZSE disclosure package once publicly accessible.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO013
      - QO014
    relatedTableRefs:
