  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治、贸易敞口与市场准入
        blocks:
          - type: paragraph
            body: >-
              Fox ESS 的风险画像首先来自地理。为本报告审阅的公开财务报道称，H1 2025 海外收入达到 99.16%，并反复把欧洲描述为公司的核心市场。这让 Fox ESS
              异常暴露于外部政策变化，而不是由中国国内需求平滑。最重要的近期进展，是 ESS News 报道的 European Commission 方向：限制使用来自被认定为高风险国家逆变器供应商的项目获得 EU
              资金，并明确包括电池功率转换系统。即便该政策起初只影响受资助项目，它仍然重要，因为它收窄了资金最充足的市场路径，并围绕供应商来源增加了一道新的信任过滤。NZIA
              韧性标准强化了同一趋势。这些信号合在一起，并不能证明销售会立即崩塌，但足以支持一个判断：未来几个欧洲报告期内，Fox ESS 在最关键的地区，可能逐步面对更严格的资格、采购和融资条件。
