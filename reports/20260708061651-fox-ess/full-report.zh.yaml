            body: >-
              公开比较来源显示，竞争不只是原始硬件参数。Enphase 的业主栈和 SolarEdge 的 Nexis 系列都强调高端控制和韧性；Huawei、Sungrow、GoodWe、Growatt 和 Fox ESS
