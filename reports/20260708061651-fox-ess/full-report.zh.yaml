chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fox ESS 把自己定位为一家年轻但已经全球化的可再生能源设备公司，而不是单一产品的逆变器品牌。最强的官方证据在公司起点上相互一致：Fox ESS 称公司成立于 2019 年 9
              月，同年设立无锡研发中心，之后把总部版图落到温州，并在上海、武汉和德国继续扩充研发能力。当前联系页面给出明确的温州地址，首页和公司页面还称业务覆盖超过 70 个国家、拥有六个研发中心和 5,000
              多名员工。产品宽度重要，因为它解释了商业模式：公司销售光伏逆变器、混合逆变器、户用和工商业电池、EV 充电器、热泵，以及 FoxCloud
              监控栈，再通过英国安装商和分销商网络等本地渠道分发。产品组合宽，再叠加招股书更新报道中极高的海外收入占比，说明 Fox ESS
              更应被视为面向户用和轻工商业光储场景的出口驱动硬件平台，而不是只服务中国国内的逆变器厂商。
