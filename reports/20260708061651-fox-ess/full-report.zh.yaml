      - number: '1.4'
        title: 里程碑、制造扩张与披露风险
        blocks:
          - type: paragraph
            body: >-
              Fox ESS 的里程碑推进异常紧凑。公司称 2019 年成立后，2020 年即推出首批产品并开始海外出货，2022 年在欧洲、澳大利亚和拉丁美洲搭建分支基础设施，2023 年进入 EV 充电和 pre-IPO
              融资。到 2025 和 2026 年，这条增长叙事落到 IPO 申报、首份 ESG 报告、欧洲首个公用事业储能动作，以及在 Smart Energy Australia、SNEC、The Smarter E
              Europe 等大型展会上的可见参与。2026 年制造叙事进一步强化同一扩张论点：Fox ESS 称温州二期工厂投用，基地面积约 46,000 m²，每七秒可产出一个电池包，自动化率超过
              60%，并把从物料接收到产线调试的时间压到五分钟以内。这些细节说明，公司在接受公开市场审视前，已为规模和交付速度投入。主要披露缺口不在于 Fox ESS
              是否增长，而在于外部人能多清楚地为这种增长形成判断。董事会构成、创始人持股、具名 pre-IPO 投资者，以及官方母公司控制链，都比经营叙事更不透明。
