      - number: '8.3'
        title: 上市同业估值交叉验证
        blocks:
          - type: paragraph
            body: >-
              上市可比公司有助于判断 Fox ESS 如果今天上市，大致可能落在哪个交易区间。用 CompaniesMarketCap 的市值 / 收入做简单口径，Enphase 的销售倍数略高于 4x，Sungrow 约
              3.3x，SMA 约 1.2x；SolarEdge 的 Macrotrends 历史数据则给出弱得多的约 1x 参照点。这个区间跨度，正是 Fox ESS 很难被简单判定为明显便宜或明显高估的原因。相比
              SolarEdge 这类承压同业，Fox 有更强增长叙事和私人市场动能，但还拿不出最优质上市公司那种披露质量、治理透明度和公开市场信任。正确结论是，Fox 应落在同业区间内部，而不是区间外。因此，目前超过人民币
              100 亿元的估值下限看起来可以支撑，但前提是投资人继续把它当作成长领军者定价，而不是当作波动大、受政策牵动的硬件出口商。
