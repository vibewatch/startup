        blocks:
          - type: paragraph
            body: >-
              Fox ESS 的客户地图，更适合被理解为一个渠道系统，而不是一份已披露账户名单。终端客户主要是住宅业主和部分中小企业用户，但分销商和安装商很大程度上决定谁购买 Fox
              硬件，以及安装后品牌体验如何。最强官方证据在英国：Fox ESS 发布分销商名单和分级安装商计划，而不是直接面向消费者的销售故事。这个模式与前文已经建立的更广商业模式一致：Fox
              通过本地渠道伙伴销售硬件，而不是通过透明的企业账户名录。含义有两面。渠道结构能让私营硬件公司比直销更快扩张，但也意味着客户触达、服务质量甚至品牌声誉会因伙伴和国家而显著不同。尽调时，买方—用户—付款方分层足够清楚，但按伙伴或国家计算的集中度仍未解决。
