      - number: '2.4'
        title: 约束与 Fox 相关可服务市场
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但并非没有摩擦。SolarPower Europe 仍呼吁加快许可和改善电网接入，这意味着即便需求存在，采用也会被瓶颈卡住。Wood Mackenzie
              的逆变器分析还给出另一重警告：出货领先与部分地区需求收缩预期并存，凸显这个行业仍有周期性和政策敏感性。InfoLink 进一步提醒，当集成商无法转嫁成本上涨时，强劲出货增长也可能无法转化为利润率扩张。具体到
              Fox ESS，公开数据意味着其可服务市场集中在出口驱动的分布式能源，而不是整个储能行业。招股书更新报道称，德国、英国和波兰贡献超过 60% 销售，H1 2025 海外收入占比高于
              99%。这指向一个围绕欧洲优先分布式储能、安装商信任和本地经济性支撑搭建的 SAM。缺失的仍是 Fox ESS 户用与工商业收入拆分，以及前三大市场内对补贴和电价机制的国家级敞口。这些缺失的分母，是形成更紧
              SOM 估计的主要障碍。
