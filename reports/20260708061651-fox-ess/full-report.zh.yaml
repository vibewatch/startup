      - number: '2.3'
        title: 增长驱动、政策支持与竞争基准
        blocks:
          - type: paragraph
            body: >-
              需求由经济性和产品成熟共同推着走。SolarPower Europe 明确把户用电池采用与电力成本压力、能源独立联系起来；Ofgem
              规则也说明了为什么上网电价和分时价差重要：电池让家庭在购电价格、上网费率和自发自用之间套利。欧洲 2025 年增长还反映了技术成本下降、投资者信心增强和收入叠加机会增加。供给侧，Wood Mackenzie 和
              InfoLink 显示，厂商格局已经高度集中且更复杂。少数品牌主导逆变器和储能出货，领先厂商如今竞争的不只是硬件价格，而是长质保、集成控制软件和具区域韧性的供应链。2026
              年竞品发布进一步指向行业方向：Huawei 强调 AI 和构网控制，Sungrow 强调一体化模块化，SolarEdge 强调网络安全背书的韧性，GoodWe 和 Growatt 强调一体化家庭平台，SMA
              强调单一来源的家庭能源集成。
