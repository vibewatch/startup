  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模判断框架
        blocks:
          - type: paragraph
            body: >-
              Fox ESS 的正确市场边界，比全球储能总量更窄。Fox ESS 通过安装商主导的分布式渠道销售，本章来源显示，真正的待办任务不是公用事业级储能采购，而是户用和轻工商业光储部署。SolarPower
              Europe 的户用电池展望，把这一细分市场放在电价上行、能源独立和可再生能源整合的背景下；2026 年欧洲电池摘要则显示，市场已超过 100 GWh
              累计装机，且仍在加速。这种加速并非纯粹来自户用：公用事业级电池在 2025 年首次超过欧洲年度新增装机的一半。尽调时，这意味着总量 ESS 数字可能夸大 Fox ESS
              的可服务空间。更有用的视角，是欧洲市场中的分布式部分，尤其是那些安装商网络、自发自用经济性和支持性政策框架，让混合逆变器加模块化电池成为主流家庭或中小企业采购的地区。
