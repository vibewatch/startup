      - number: '1.3'
        title: 规模信号、渠道结构与区域验证
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模信号偏方向性，而不是完整审计口径，但仍能显示公司已有真实渠道触达。Fox ESS 声称电池、光伏逆变器和 EV 充电器三年累计装机基数很大，并称研发人员超过 400
              人。在英国和爱尔兰，本地网站描述了一套结构化销售打法：战略分销商、认证分销商，以及要求培训和遵守行为准则的三级认证安装商计划。ACD Green-Tech 的第三方安装商页面确认，Fox ESS
              产品正通过具名安装商销售；官方英国站则引用 S&P Global，把 Fox ESS 定位为本地和全球户用储能龙头。澳大利亚给出了类似本地化验证：Fox ESS 称其在墨尔本和悉尼设有办公室，拥有 30
              多名本地专家，并与 Amber Electric 和 Origin Loop 做了 VPP 集成。与此同时，外部评论和客户情绪来源也补上了层次。Trustpilot 显示英国本地站评分强于全球公司域名；Solar
              Choice 认为 Fox ESS 经营历史较短，长尾质保耐久性仍是活跃的尽调问题。
