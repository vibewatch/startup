            body: >-
              招股书更新报道给出了摆脱纯叙事所需的收入底盘。EnergyTrend 和 Energy-Storage.news 均披露，Fox ESS 2024 年收入为人民币 33.92 亿元，2025 年上半年收入为人民币
              22.42 亿元；同时，它们也把 Fox ESS 描述为欧洲占比较重的出口商，2025 年上半年海外收入占比 99.16%。再叠加超过人民币 100 亿元的私人市场估值下限，这些披露意味着，按 2024
              年收入计算，私营公司销售倍数约高于 2.9x。成长型硬件公司拿到这个倍数并不荒唐，但也谈不上保守。它假设投资人会实打实认可市场领先地位、国际增长和储能品类动能。计划募资人民币 16.61 亿元的 IPO
              规模也强化了这一点：市场不仅要认可现有规模，还要为可观的未来扩张买单。估值敏感性自然被推高，因为稀释、政策和执行风险都会影响下一步是否足够有吸引力。
