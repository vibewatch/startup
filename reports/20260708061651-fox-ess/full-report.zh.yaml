              都提供公开申报文件，或持续更新的市场数据界面，让投资者比较市值和收入。这些基准意味着，上市太阳能硬件公司的交易倍数常是低个位数收入倍数，而不是软件式估值水平。这一点重要，因为 Fox ESS
              的私募估值参考和储能排名光环，否则可能制造过于乐观的心智模型。如果 Fox ESS
              的增长和户用储能地位能够维持，它也许应较陷入困境的硬件公司享有溢价；但它仍处在一个渠道库存、政策变化和价格压力都可能快速压缩倍数的品类中。因此，基于公开资料最可支撑的判断是平衡的：Fox ESS
