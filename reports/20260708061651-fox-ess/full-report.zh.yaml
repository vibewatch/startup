      - number: '3.3'
        title: 分销权力、切换成本与渠道杠杆
        blocks:
          - type: paragraph
            body: >-
              Fox ESS 所在品类最重要的竞争机制是渠道权力。住宅业主很少直接从制造商购买；他们买的是安装商熟悉、能快速拿货、且愿意售后支持的品牌。Fox ESS
              的官方英国证据和澳大利亚活动信息确认，其销售路径依赖分销商、认证安装商和伙伴赋能，而不是直接零售。这是优势，因为它带来本地化终端动销，但也限制了锁定。安装商可以同时经营多个品牌，并在供货、质保处理或利润支持变化时调整推荐。独立买方指南也说明，系统层面的具体匹配仍比任何单一品牌叙事更重要。实践中，Fox
              ESS 似乎在重视性价比的安装商网络里有真实渠道信誉；但如果更大厂商给出更好融资、更好软件或更少运营摩擦，同一批网络也可能切换。这让 Fox ESS 更像一个渠道执行故事，而不是深度锁定的平台故事。
