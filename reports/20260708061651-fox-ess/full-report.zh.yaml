            body: >-
              Fox ESS 的公开产品面足够宽，具有战略意义。公司不是只有一个核心逆变器页面，而是分别维护光伏逆变器、混合逆变器、电池和微型逆变器品类；2026
              年活动发布又把这些产品线打包进更宽的“动态能源生态系统”。混合系列尤其重要，因为它覆盖多个功率段和形态，从 H1/AC1 单相系统，到 H3 Smart、H3 PRO，再到更大的 H3 Plus
              和可堆叠一体机系统。这种宽度不只是门面：手册、快速指南、声明和质保文件在不同文档界面反复出现同一批产品家族，这比单个营销页面更有证明力。做产品尽调时，实际结论是 Fox ESS 已经像一个多 SKU
              平台，服务户用和部分更大型三相使用场景，而不是靠一个发布周期吃饭的单 SKU 挑战者；文档模式也强化了这种宽度。
