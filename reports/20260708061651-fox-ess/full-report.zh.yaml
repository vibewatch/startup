companyProfile:
  summary: >-
    Fox ESS 是一家总部位于温州的中国光伏逆变器和电池储能公司，成立于 2019 年。公司靠出口渠道、产品线扩张、工厂建设和仍在推进的创业板 IPO
    路径快速放大。公开证据支持它已有可观收入规模、户用储能势头强、地域覆盖广，但在所有权、利润率和资本结构经济性细节上仍明显不透明。
  foundedDate: '2019-09-01'
