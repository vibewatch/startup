      - number: '8.4'
        title: 估值结论和情景区间
        blocks:
          - type: paragraph
            body: >-
              Fox ESS
              的上行情景很直接：它有真实收入规模、住宅储能领先地位、广泛产品覆盖，以及第三方性能佐证，业务比许多私人清洁科技故事更扎实。下行情景同样清楚：欧洲集中度、政策敞口、资本开支强度和私营公司披露缺口，都可能快速压缩硬件倍数。两个判断可以同时成立。因此，最有支撑的立场不是便宜，而是公允。Fox
              ESS
              可能理应比困境中的太阳能硬件公司拿更高溢价，但还不该无条件享有一线上市可比公司的溢价。在投资人看清利润率、股本数、营运资本、召回历史和真实区域多元化之前，正确的承销判断是：把公司视作可信的独角兽，保留可观选择权；但它的估值倍数已经替管理层先兑现了一部分成果。
