      - number: '1.2'
        title: 领导层、治理与资本背景
        blocks:
          - type: paragraph
            body: >-
              公开披露的领导层信息，比公司的经营规模暗示的水平更薄。现有官方材料一直把 Michael Zhu 标为 CEO；Lyren Liu 在 2026 年活动报道中以首席商务官身份出现；Brooks Richard
              Geng 则公开对应 APAC 和中东地区。除这些经营高管外，本次审阅的英文公开记录很快变得稀疏。公司页面没有展示创始人姓名、完整董事会名单或具名早期投资者，尽管它称 2019 年完成天使轮融资、2022 年完成
              A 轮融资、2023 年 pre-IPO 融资时公司估值超过 RMB 10 billion。二级 IPO 报道补上了一些流程细节：Fox ESS 正在推进深交所创业板上市，据称拟由国泰海通证券保荐，通过最多 90
              million 股 A 股募集 RMB 1.661 billion。这个进程真实且已推进较深，但也暴露了警示信号：据报道，2025 年有五名股东对 IPO 议案投反对票；交易所要求在 2025
              年末重新提交招股书前更新财务数据。从尽调角度看，资本市场野心清楚，治理透明度仍不完整。
