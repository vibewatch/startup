        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据来自招股书更新报道，而不是直接获取的招股书 PDF。即便有这个限制，披露路径仍有分量：收入据称从 2022 年 RMB 2.486 billion 增至 2023 年 RMB 2.90
              billion、2024 年 RMB 3.392 billion，H1 2025 已达 RMB 2.242 billion。这条轨迹更像一家真实硬件业务，而不是试点阶段故事。模式也相当清楚。Fox ESS
              通过分销商和安装商渠道销售逆变器及储能硬件，而不是靠经常性软件合同。这意味着收入质量取决于终端动销、渠道库存行为、地域结构和政策敏感的家庭储能需求。GetLatka 等外部基准大致验证了 Fox ESS
              已经达到规模，但招股书更新数字更精确，应作为本报告的主要公开数字。关键限制在于，实际定价、返利和渠道总额到净额调整仍不透明。
