  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、同业集合与基准厂商
        blocks:
          - type: paragraph
            body: >-
              Fox ESS 并不是在空白市场里竞争。实际同业集合包括 Sungrow、Huawei FusionSolar、GoodWe、Growatt、SOFAR Solar 等中国集成储能老牌厂商，也包括
              SMA、SolarEdge 这类安装商信任积累更久的厂商，以及架构不同但设定基准的微型逆变器平台 Enphase。Wood Mackenzie 2025
              年逆变器排名之所以重要，是因为它显示行业已高度集中：规模并不平均分布，少数头部阵营仍控制大部分市场份额。独立买方指南从另一角度强化了同一图景。户用买家通常看到的是混合逆变器、电池、EV
              充电器和监控组成的一套系统选择，而不是单个组件选择。这意味着 Fox ESS
              不只会被拿来比较逆变器效率，还会被比较全栈打包、质保安心度、应用体验和安装商信心。简言之，竞争框架是一个拥挤的一体化家庭能源市场，里面有少数规模极大的龙头，也有一长串可信挑战者。
