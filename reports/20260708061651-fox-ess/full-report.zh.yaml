            body: >-
              披露的利润线显示，Fox ESS 并非不计代价追逐收入。招股书更新报道称，公司在 2022 年至 H1 2025
              的每个已披露期间都保持盈利，尽管利润路径不均，且很可能反映了后续报道中描述的渠道和区域波动。这一点重要，因为户用太阳能硬件收入看起来可以很大，利润率却可能脆弱。公开证据仍不足以形成完整的盈利质量视图。审阅来源里没有公开毛利率桥、CAC
              或回收期披露，也没有应收账款账龄或退货数据。不过 OFweek 的区域评论显示，欧洲库存堆积和电价下行即使在公司仍盈利时，也可能冲击收入质量。最稳妥的解读是，Fox ESS
              已经实现规模和正向盈利，但利润率耐久性仍是尽调问题，因为公开记录没有暴露支撑这些结果的单位经济模型管线。
