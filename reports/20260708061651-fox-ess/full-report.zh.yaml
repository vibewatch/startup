              的安装商评价和比较文章显示，它最好的楔子是实用价值：模块化电池、安装直接、质保条款可接受，感知价格层级低于高端老牌厂商。弱点是透明度。公开定价往往依赖报价并由渠道中介，因此更容易推断相对打包方式和价值姿态，而不是证明各国精确终端成交价差。从尽调角度看，能力比较可被支撑，实际价格领先只能由公开证据部分观察。
