      - number: '2.2'
        title: 买方、细分与进入路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方地图是多层的。终端用户是希望降低账单、提高韧性或做 EV 友好能源管理的住宅业主和小企业。安装商和 EPC
              往往才是实际规格制定者，因为多数家庭买的是一套系统，而不是一堆组件。分销商再决定哪些品牌可买、技术支持是否到位、替换设备能多快流转。政策和公用事业项目通过改变自发自用和上网电的价值，塑造付款逻辑。以英国为例，价格上限影响电力基准避免费用，SEG
              则决定太阳能发电上网价值；电池夹在这两个价格之间。Fox ESS
              自己的英国站确认，其销售路径由安装商和分销商主导；官方和第三方竞品页面则显示，Sungrow、SolarEdge、GoodWe、Growatt、Huawei 和 SMA
              都在争取同一户家庭，承诺更紧的集成、更好的备电、更容易的调试和更聪明的软件控制。
