      - number: '7.2'
        title: 网络安全、产品安全与治理复杂性
        blocks:
          - type: paragraph
            body: >-
              网络安全已经从技术边缘问题，变成逆变器和储能厂商的战略风险类别。ESMC 和 pv magazine
              都把对中国逆变器的依赖描述为安全问题，但更细的点在于，网络风险已不再只是原产国问题。本次审阅的行业辩论认为，单靠禁令无法解决问题，因为已有装机、远程访问工具、网关和其他联网设备仍是攻击路径。CISA
              安全公告也强化了这一点：关键基础设施仍会通过未打补丁软件、远程管理工具和第三方访问被攻破。Fox ESS
              的公开姿态提供了一些缓释：证书、质保基础设施、安装商计划和大量文档都可见。但这些披露都没有回答最难的投资判断问题，例如现场故障率、网络加固、召回历史或软件更新治理。对一家联网户用能源厂商而言，产品安全和网络信任如今已经贴近市场准入，而不只是售后支持。
