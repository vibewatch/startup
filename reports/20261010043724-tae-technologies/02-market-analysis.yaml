callouts:
  - calloutType: insight
    title: Near-Term Revenue Separation from Core Fusion
    body: >-
      While core commercial fusion power generation remains on a 2031 deployment horizon via the Da Vinci plant, TAE's
      adjacent subsidiaries—TAE Power Solutions and TAE Life Sciences—target commercial traction in power management and
      cancer therapy to generate near-term cash flows.
    claimRefs:
      - CM003
      - CM004
  - calloutType: risk
    title: Fuel Supply and Plant Siting Dependencies
    body: >-
      Commercialization hinges on securing viable fuel cycles (such as prospective helium-3 supply agreements with Black
      Moon Energy or pure p-B11 aneutronic physics) and navigating lengthy multi-state utility-scale siting processes
      before groundbreak.
    claimRefs:
      - CM013
      - CM014
      - CM015
