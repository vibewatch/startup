callouts:
  - calloutType: "risk"
    title: "Reverse Merger Capital Structure and Public Market Transition Risk"
    body: "The pending all-stock merger with Trump Media & Technology Group presents profound governance and capital-structure contradictions for a 27-year-old deep-tech venture. While providing up to $300 million in potential cash injections and access to liquid public markets, the transaction ties TAE's long-term scientific roadmap to retail meme-stock volatility, Bitcoin treasury holdings, and a bifurcated co-CEO management structure that could severely penalize inevitable deep-physics timeline adjustments."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
  - calloutType: "insight"
    title: "Near-Term Revenue Hedging Through Commercial Spin-Off Subsidiaries"
    body: "TAE's establishment of specialized commercial spinoffs—including TAE Power Solutions in power electronics, TAE Life Sciences in cancer therapy accelerators, and the TAE Beam UK joint venture with UKAEA—provides essential non-fusion revenue diversification. These operating entities validate core accelerator and power-management IP in commercial markets while hedging the multi-decade capital demands of utility-scale fusion power plant development."
    claimRefs:
      - "CI004"
      - "CI005"
