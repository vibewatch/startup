      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public Market Exposure and Governance Friction
            body: >-
              The proposed 50/50 all-stock merger with TMTG exposes TAE's patient 27-year scientific program to retail
              sentiment swings, meme-stock price volatility, and a divided co-CEO governance structure that may conflict
              with the capital-intensive timelines required for fusion development.
            calloutType: risk
            claimRefs:
