      - number: '7.4'
        title: Residual risk hierarchy and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The heatmap ranks commercial-reactor viability and capital sufficiency as the largest residual exposures
              because the companies themselves disclose both significant capital needs and the possibility that a viable
              reactor may not be delivered on schedule or at all. Transaction closing is next: filing progress reduces
              procedural uncertainty but does not remove approval and effectiveness conditions. Operational supply,
              licensing, and integration risks remain material because disclosed mitigations are plans rather than
              independently demonstrated controls. Investment work should stop or reset the thesis if the merger is
              terminated, definitive filings show funding insufficient to reach the next independently verified
              technical milestone, regulators identify a non-remediable licensing path, or independent engineering
              review cannot substantiate the claimed safety and scale assumptions. Until those tests are met, milestone
              financing and explicit downside protections are more defensible than treating announced funding as
              available runway.
