      - number: '6.2'
        title: Commercial Adoption Trajectory and Deployment Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating TAE's customer adoption trajectory requires separating technical plasma milestones from
              commercial grid deployments. Over its 27-year history since founding in 1998, TAE has constructed and
              operated five experimental research reactors—including its fifth-generation Norman reactor and the current
              Norm machine—conducting more than 170,000 experimental cycles. However, none of these devices have
              generated commercial electricity or delivered dispatchable power to an external customer. Disclosed
              roadmaps project a sequence starting with site selection in 2026, first plasma on the Da Vinci prototype
              in 2029, net energy demonstration by 2030, and initial power operations of a 50 MWe first-of-a-kind
              facility by 2031, scaling later to 350 to 500 MWe plants.


              Because no utility customer has committed capital or signed an interconnection agreement, the adoption
              trajectory for utility power remains at zero percent commercial penetration. TAE's business model relies
              on private equity and capital markets rather than customer cash flows. The company has raised over $1.3
              billion across multiple funding rounds from institutional and strategic corporate backers, but public
              market disclosures and analyst estimates indicate that commercial revenue from power generation is absent.
              Without a verified operating reactor capable of sustained net energy, customer adoption cannot be
              benchmarked against conventional software or industrial equipment deployment metrics.
            claimRefs:
              - CU007
              - CU008
