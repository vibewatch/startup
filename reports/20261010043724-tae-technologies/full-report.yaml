chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Stage, and Technology Platform
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies is an energy and deep-technology company based in Foothill Ranch, California, pursuing
              utility-scale commercial fusion power. Established in 1998, the organization has spent nearly three
              decades advancing a proprietary reactor architecture known as beam-driven Field-Reversed Configuration
              (FRC). Unlike conventional deuterium-tritium approaches that produce intense neutron fluxes and
              radioactive waste, TAE's long-term commercial roadmap centers on aneutronic hydrogen-boron (p-B11) fuel,
              which yields non-radioactive helium exhaust and eliminates the operational risks of meltdowns or toxic
              byproducts. Alongside its core fusion program, TAE has commercialized its underlying accelerator and
              power-management innovations through partially-owned subsidiaries, including TAE Power Solutions for grid
              and electric vehicle power delivery and TAE Life Sciences for biologically targeted Boron Neutron Capture
              Therapy cancer treatments.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO012
