            title: Valuation Discipline at Proposed Transaction Terms
            body: >-
              At an implied $6.0 billion enterprise transaction value—a 140% premium to recent secondary prints of $2.47
              billion to $2.50 billion—investors should maintain an Avoid stance until the SEC declares Form S-4
              effective and management provides substantiated first-plant levelized cost economics.
