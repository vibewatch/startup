  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Transaction, regulatory, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The proposed TMTG combination remains a gating event rather than completed financing. A joint company
              release says a Form S-4 was filed on September 30, 2026, but also says the registration statement was not
              yet effective; the same release conditions completion on shareholder, stockholder, regulatory, and other
              closing requirements. TMTG management separately continued to target year-end 2026 while declining to
              commit to a specific date because of the regulatory process. That combination of progress and explicit
              conditionality makes closing delay or failure a high-impact risk. The assigned pool does not contain the
              actual SEC filing, an effective notice, a site-specific licensing roadmap, or legal dockets, so the
              register is partial rather than evidence that no other proceedings or approval barriers exist.
            claimRefs:
