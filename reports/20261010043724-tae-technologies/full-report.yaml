      - number: '5.4'
        title: Operating Subsystem Architecture, Regulatory Status, and Technical Risks
        blocks:
          - type: paragraph
            body: >
              Despite notable progress in experimental plasma physics, TAE faces formidable technical hurdles across
              material science, plasma stability, and commercialization timelines. The physics of aneutronic p-B11
              fusion requires maintaining plasma temperatures above 100 to 150 million °C alongside high confinement
              densities, where bremsstrahlung radiation losses threaten to exceed fusion power output unless plasma
              purity and energetic beam distribution remain near-perfect. Independent industry observers have
              characterized TAE's stated timeline of commencing construction on the Da Vinci utility-scale plant in 2026
              as very ambitious, noting that commercial licensing, environmental reviews, and site selection must
              proceed without delay while core physics thresholds remain unvalidated at net-energy scale.


              From a regulatory perspective, commercial fusion in the United States benefits from a landmark Nuclear
              Regulatory Commission (NRC) decision to regulate fusion facilities under its particle accelerator
              framework (10 CFR Part 30/32) rather than the onerous Part 50/52 licensing rules governing nuclear fission
              reactors. This significantly reduces licensing timelines and radiation containment burdens. However,
              commercial deployment still requires state-level environmental impact reviews, utility grid
              interconnection approvals, and complex multi-year power purchase agreements. Furthermore, secondary market
              transparency remains limited, as institutional valuations and operational benchmarking for TAE remain
              restricted to private subscriber tracking services, leaving public investors reliant on high-level
              corporate roadmap releases.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
