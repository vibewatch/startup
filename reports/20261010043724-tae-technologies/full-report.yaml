  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Fusion Architecture and Advanced Beam-Driven FRC
        blocks:
          - type: paragraph
            body: >
              TAE Technologies was established in 1998 in Foothill Ranch, California, to pioneer commercial nuclear
              fusion power through an advanced beam-driven Field-Reversed Configuration (FRC) rather than conventional
              tokamak or stellarator geometries. The company's architecture relies on a linear cylindrical vacuum vessel
              where closed magnetic field lines are generated primarily by internal eddy currents within the plasma
              itself rather than heavy external toroidal magnet assemblies. To overcome the historical instability that
              plagued early FRC designs, TAE surrounds the central chamber with neutral particle accelerators that
              inject high-energy neutral atom streams at tangential angles. These neutral beams transfer momentum and
              heat to sustain the internal magnetic field and provide active equilibrium control, confining the
              superheated plasma in a stable configuration. The company's power management system anchors this design,
              discharging and synchronizing up to 750 megawatts of bi-directional power on sub-millisecond timescales to
              drive magnetic coils and accelerator injectors with high precision.


              Unlike mainstream fusion programs pursuing deuterium-tritium (D-T) reactions, TAE is intentionally
              engineered for aneutronic hydrogen-boron (p-B11) fuel. In this fuel cycle, protons fuse with boron-11
              nuclei to yield three energetic alpha particles (helium nuclei) and light, producing minimal damaging
              neutron flux and eliminating the need for complex tritium breeding blankets or thick shielding
              infrastructure. However, p-B11 demands operating plasma temperatures exceeding 100 to 150 million °C—far
              above the requirements for D-T fusion—making energy confinement time and bremsstrahlung radiation
              mitigation critical engineering constraints. To solve these non-linear confinement dynamics, TAE has
              partnered with Google Research since 2014, embedding machine learning algorithms including the Optometrist
              Algorithm directly into experimental control loops to optimize plasma duration, reconstruct
              high-dimensional parameters, and guide active feedback.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE011
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
