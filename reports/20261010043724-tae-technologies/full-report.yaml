      - number: '3.2'
        title: 'Technical Differentiation: p-B11 Aneutronic Fusion vs. D-T and D-3He'
        blocks:
          - type: paragraph
            body: >-
              TAE's core technical differentiation lies in its deliberate commitment to an aneutronic hydrogen-boron
              (p-B11) fuel cycle, in stark contrast to mainstream competitors pursuing deuterium-tritium (D-T) or
              deuterium-helium-3 (D-3He). Deuterium-tritium systems, adopted by Commonwealth Fusion Systems and General
              Fusion, benefit from lower required ignition temperatures (roughly 100 million degrees Celsius) but suffer
              from severe neutron bombardment, heavy tritium breeding requirements, and radioactive material management.
              In contrast, TAE's p-B11 fuel is virtually aneutronic, abundant, and non-radioactive, producing harmless
              helium ions without toxic waste or proliferation risks. However, p-B11 demands unprecedented plasma
              conditions, requiring temperatures exceeding 100 million to 150 million degrees Celsius and exceptional
              confinement density that have never been achieved in a commercial net-energy reactor. TAE deploys
              high-energy neutral beam injectors that accelerate and neutralize ion streams to stabilize the
              self-organizing FRC plasmoid. This technical path avoids complex radioactive licensing and blanket
              degradation but places an immense burden on plasma physics, creating a profound barrier to near-term
              commercial realization.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.3'
        title: Commercialization Models, GTM Strategies, and Adjacent Spinoffs
        blocks:
          - type: paragraph
            body: >-
              Commercial go-to-market strategies among fusion developers reflect differing approaches to technology
              monetization and capital risk mitigation. While peer developers focus exclusively on long-term power
              purchase agreements (PPAs)—exemplified by Helion Energy's announced bilateral power delivery agreement
              with Microsoft—TAE has developed an adjacent commercialization strategy. Over its 27-year operating
              history, TAE has spun out specialized operating subsidiaries, including TAE Power Solutions for automotive
              power electronics and grid storage, TAE Life Sciences for boron neutron capture cancer therapy (BNCT), and
              TAE Beam UK for neutral beam manufacturing. These operating arms validate subsystem engineering and
              generate near-term non-fusion revenue, partially insulating parent operations from single-point fusion
              development timelines. Nevertheless, in core utility power generation, TAE has not disclosed executed
              commercial offtake contracts, power purchase agreements, or levelized cost of electricity guarantees. The
              company's proposed corporate merger with Trump Media & Technology Group commits up to $300 million in cash
              to support utility-scale development, but public market valuation expectations remain heavily dependent on
              delivering unproven baseload energy economics.
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Displacement Hazards, and Public Timeline Pressures
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies possesses substantial intellectual property defenses surrounding neutral beam injection,
              high-voltage power management, and FRC plasma stabilization algorithms developed over nearly three
              decades. However, the durability of this competitive moat is vulnerable to rapid technological
              displacement and narrative fatigue. Competitors operating on lower-temperature D-T fuel cycles, such as
              Commonwealth Fusion Systems with its SPARC and ARC devices, may achieve demonstrable net electricity
              output years before TAE can reach the extreme plasma regimes required for net p-B11 fusion. Furthermore,
              TAE's announced roadmap—promising site selection in 2026, first plasma in 2029, net energy in 2030, and
              initial power operations in 2031—establishes a rigid calendar that is poorly aligned with the empirical
              uncertainties inherent in plasma physics. In a public market environment following the TMTG combination,
              any delay in site permitting or experimental iterations risks severe retail shareholder backlash,
              valuation contraction, and higher future capital costs, threatening TAE's ability to finance the
              multi-billion-dollar commercialization phase.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Fuel Cycle Dichotomy: Aneutronic Purity vs. Plasma Temperature Penalty'
            body: >-
              While Commonwealth Fusion Systems and General Fusion accept severe tritium breeding and neutron shielding
              requirements to operate at lower deuterium-tritium temperatures, TAE's hydrogen-boron choice trades away
              radiation shielding complexity for an extreme plasma physics threshold requiring temperatures exceeding
              100 million to 150 million degrees Celsius.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Public Market Exposure vs. Patient Physics Milestones
            body: >-
              TAE's proposed public transaction with Trump Media & Technology Group introduces quarterly earnings
              discipline and retail equity volatility to an enterprise requiring patient, multi-decade capital cycles,
              creating substantial narrative risk if dated milestones (such as 2026 site selection or 2031 power
              operations) encounter typical deep-tech engineering delays.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Monetization Models, and Commercial Diversification
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies pursues a hybrid commercialization strategy spanning utility-scale commercial fusion
              power generation and nearer-term technology monetization through targeted spin-off subsidiaries. In its
              core fusion business, TAE is pre-revenue and focused on constructing its first commercial-scale
              demonstration power plant, Da Vinci, designed to produce 50 MWe of net electricity with operations
              targeted for 2031. Longer-term commercial facilities are planned to scale between 350 and 500 MWe,
              monetized through multi-decade power purchase agreements (PPAs) and clean baseload capacity payments to
              electric utilities, industrial operators, and hyperscale data center campuses. To de-risk the fuel cycle,
              TAE entered into a strategic collaboration with Black Moon Energy Corporation for prospective helium-3
              fuel supplies alongside its primary hydrogen-boron (p-B11) architecture. In parallel, TAE has developed
              near-term commercialization vectors via TAE Power Solutions, which supplies high-capacity power management
              hardware discharging up to 750 MW for AI data centers and automotive OEMs, and TAE Life Sciences, which
              commercializes accelerator-based neutron beams for Boron Neutron Capture Therapy. Most recently, the
              December 2025 TAE Beam UK joint venture with the UK Atomic Energy Authority establishes a manufacturing
              foundation for industrial neutral beam systems, providing contracted engineering revenues while utility
              fusion matures.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
