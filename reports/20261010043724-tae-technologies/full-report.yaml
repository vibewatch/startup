            body: >-
              Unlike competing private fusion ventures that have secured conditional off-take commitments or power
              purchase letters with hyperscale data center operators, TAE Technologies possesses no signed commercial
              power purchase agreements or utility offtake contracts. Disclosures around the pending Trump Media merger
              explicitly caution that the transaction creates no legal commitment to build or site a fusion facility,
