  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope Boundaries
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies operates at the intersection of commercial nuclear fusion power research and specialized
              high-power electronics engineering. The company's primary market focus is the development of utility-scale
              fusion power plants utilizing a proprietary advanced beam-driven Field-Reversed Configuration (FRC)
              designed to achieve clean, carbon-free electricity generation. In contrast to conventional magnetic
              confinement systems that rely predominantly on deuterium-tritium fuel cycles, TAE prioritizes aneutronic
              or alternative fuel cycles such as hydrogen-boron (p-B11) and prospective helium-3 mixtures to minimize
              radioactive activation and high-level waste handling. In addition to long-horizon fusion power generation,
              TAE has established commercial adjacencies through its operating subsidiaries, TAE Power Solutions and TAE
              Life Sciences, addressing electric vehicle power management, grid-scale energy storage, and boron neutron
              capture therapy (BNCT). The total market boundary encompasses wholesale baseload power generation, firm
              clean capacity procurement, and industrial power electronics, while explicitly excluding short-duration
              intermittent renewable assets, fission fuel manufacturing, and merchant energy trading.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing and Industry Projections
        blocks:
          - type: paragraph
            body: >-
              The addressable market for commercial fusion power is embedded within the multi-trillion-dollar global
              market for wholesale electricity generation and clean baseload capacity replacement. Independent industry
              research forecasts that the global nuclear fusion sector will expand at an 18.4% compound annual growth
              rate (CAGR) from 2024 to 2030, driven by private capital inflows, advanced plasma diagnostics, and growing
              institutional support for firm decarbonization solutions. TAE's commercial deployment trajectory is
              anchored on its sixth-generation experimental device, Norm, informing key engineering designs for Da
              Vinci, a planned 50 MWe utility-scale demonstration facility with site selection underway and target
              operations in 2031. Subsequent commercial plants are designed to scale to 350–500 MWe to deliver
              cost-competitive electricity into wholesale power grids. Outside of core fusion, private commercial
              databases estimate TAE's current annual revenues between $100 million and $500 million, though these
              evaluations reflect statistical industry modeling rather than audited financial disclosures.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
