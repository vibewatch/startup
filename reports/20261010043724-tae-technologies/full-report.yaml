  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers and Confinement Paradigms'
        blocks:
          - type: paragraph
            body: >-
              The commercial nuclear fusion sector has expanded to over 60 active privately funded companies worldwide,
              representing diverse confinement paradigms and capital strategies. Within this cohort, TAE Technologies
              ranks fourth in overall Tracxn evaluation scoring and third in cumulative capital secured, trailing only
              Commonwealth Fusion Systems and Helion Energy in total funding. The competitive field divides
              fundamentally along plasma confinement physics. Commonwealth Fusion Systems, having raised $4.0 billion
              with over 1,100 employees, pursues high-field tokamak architectures using high-temperature superconducting
              magnets. Helion Energy, backed by $1.4 billion, focuses on pulsed magneto-inertial fusion aiming for
              direct electricity recovery. Meanwhile, General Fusion ($515 million raised) and Zap Energy ($330 million
              raised) pursue magnetized target and sheared-flow Z-pinch architectures, respectively. TAE differentiates
              itself through an advanced beam-driven Field-Reversed Configuration (FRC), operating with approximately
              300 employees as of late 2026. This landscape illustrates intense competition for private capital,
              intellectual property, and engineering talent across fundamentally divergent fusion concepts.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
