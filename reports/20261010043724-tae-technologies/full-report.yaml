      - number: '1.4'
        title: Operational Trajectory, S-4 Progression, and Public Transition Risks
        blocks:
          - type: paragraph
            body: >-
              TAE's operational roadmap has achieved successive experimental validations, progressing from the Norman
              reactor to the compact Norm prototype, which demonstrated stable plasma temperatures exceeding 70 million
              degrees Celsius in 2025. Following the December 2025 merger announcement, TMTG and TAE advanced the
              transaction by filing an SEC Form S-4 registration statement in September 2026. However, independent
              energy and financial analysts highlight severe structural friction in transitioning a capital-intensive
              deep-tech program to public equity markets. Public markets demand quarterly financial disclosures and
              short-term operational deliverables, which conflict with multi-year physics iteration and complex FOAK
              plant permitting. Furthermore, associating reactor capitalization with TMTG's volatile equity and treasury
              assets introduces narrative and financing vulnerabilities if milestone delays are interpreted by retail
              investors as project failure.
