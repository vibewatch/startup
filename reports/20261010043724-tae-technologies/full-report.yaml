            body: >-
              TAE Power Solutions represents the primary operational bridge to paying commercial customers.
              Collaborations with Tier-1 automotive supplier Marelli and participation in the BMW APC18 CELERITAS
              battery consortium validate the tangible engineering value of TAE's sub-millisecond bi-directional power
              management technology, partially de-risking the company's reliance on multi-decade fusion physics
