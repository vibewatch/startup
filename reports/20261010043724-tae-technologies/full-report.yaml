      - number: '6.3'
        title: Named Customer Deployments, Research Partnerships, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Documented customer proof and operational relationships are concentrated among industrial technology
              collaborators and research institutions rather than independent power offtakers. In the power electronics
              and automotive sector, subsidiary TAE Power Solutions established a multi-year partnership with Tier-1
              automotive supplier Marelli to co-develop power management architectures and validate Converter Battery
              Module technology for electric vehicles. In addition, TAE Power Solutions secured entry into the UK APC18
              CELERITAS consortium alongside German automaker BMW and industrial partners following the strategic
              acquisitions of transport electrification specialists Sprint Power and Eltrium.


              In scientific research, TAE announced a landmark multi-year collaboration with Japan's National Institute
              for Fusion Science (NIFS) to conduct hydrogen-boron plasma reaction tests inside the Large Helical Device
              stellarator. While these engagements validate TAE's technical engineering, power electronics, and
              accelerator physics know-how, they do not constitute commercial fusion offtake. Customer concentration
              risk in core fusion is absolute: TAE has zero diversified power purchasers and remains dependent on
              capital markets and industrial sponsors to finance ongoing development before commercial offtake can even
              be contemplated.
