              - CI013
          - type: callout
            title: Near-Term Revenue Hedging Through Commercial Spin-Off Subsidiaries
            body: >-
              TAE's establishment of specialized commercial spinoffs—including TAE Power Solutions in power electronics,
              TAE Life Sciences in cancer therapy accelerators, and the TAE Beam UK joint venture with UKAEA—provides
              essential non-fusion revenue diversification. These operating entities validate core accelerator and
              power-management IP in commercial markets while hedging the multi-decade capital demands of utility-scale
              fusion power plant development.
            calloutType: insight
            claimRefs:
