      - number: '4.2'
        title: Cost Structure, Reactor Capex Drivers, and Unit Economics Opacity
        blocks:
          - type: paragraph
            body: >-
              The economic viability of TAE Technologies' beam-driven Field-Reversed Configuration depends on achieving
              competitive overnight capital costs and levelized cost of electricity (LCOE) relative to alternative firm
              clean generation sources. The company asserts that its simplified 'Norm' reactor architecture reduces
              reactor complexity and lowers projected power plant capital expenditure by approximately 50% compared to
              earlier multi-magnet configurations. However, absolute capital expenditure estimates for the 50 MWe Da
              Vinci first-of-a-kind (FOAK) facility remain strictly confidential private data, and no audited plant
              engineering, procurement, and construction (EPC) budgets have been placed in the public domain. Operating
              expenses are dominated by high-caliber plasma physics and engineering payroll across an estimated
              workforce of 251 to 304 personnel, specialized cryogenic and vacuum manufacturing, and power delivery
              infrastructure. While hydrogen-boron fuel offers structural operating cost advantages over
              deuterium-tritium designs by eliminating complex tritium breeding blankets and heavy radioactive
              shielding, achieving the extreme plasma temperatures required for p-B11 fusion creates severe material
              degradation and power recirculating demands. As a consequence, plant-level unit economics cannot be
              verified without detailed engineering disclosure packages.
            claimRefs:
              - CI001
              - CI008
              - CI009
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
      - number: '4.3'
        title: Capital Adequacy, Historical Funding, and Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              Over its 27-year history since founding in 1998, TAE Technologies has functioned as one of the most
              heavily capitalized private ventures in deep technology, raising over $1.3 billion in cumulative equity
              funding across 12 financing rounds. The company's latest announced primary equity round in June 2025
              secured more than $150 million at a reported post-money valuation of $2.9 billion, supported by
              long-standing institutional partners including Google, Chevron Technology Ventures, and New Enterprise
              Associates. Secondary market trading marks recorded by Forge Data and Yahoo Finance indicate private
              market equity valuations hovering near $2.47 billion as of October 2026, reflecting investor discounting
              against late-stage capital requirements. Given an annual estimated cash burn exceeding $100 million to
              support ongoing experimental reactor operations and Da Vinci pre-construction engineering, TAE faces
              continuous financing dependency. The proposed December 2025 business combination with Trump Media &
              Technology Group (TMTG) at an implied $6 billion valuation represents an aggressive pivot to public
              capital markets. While offering up to $300 million in combined cash commitments from TMTG's reported $3.1
              billion balance sheet, this structure couples TAE's capital availability to a highly volatile public
              entity subject to meme-stock trading swings and cryptocurrency asset fluctuations.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial Diligence Verdict, Underwriting Blockers, and Outlook
        blocks:
          - type: paragraph
            body: >-
              From a formal diligence and investment underwriting perspective, TAE Technologies occupies an anomalous
              position between pioneering physical science and opaque corporate finance. The company possesses
              extraordinary intellectual property assets, including over 1,500 granted patents and a three-decade
              research pedigree backed by premier strategic corporate partners. Furthermore, its commercial spinoffs
              provide legitimate technical validation in automotive power management and radiation oncology.
              Nevertheless, the financial foundation required for institutional underwriting is absent. The pending
              reverse merger with TMTG lacks a filed Form S-4 registration statement detailing audited financial
              statements, pro-forma cash flows, governance arrangements, and capital expenditure obligations for the Da
              Vinci plant. Neither utility off-take agreements nor definitive customer contracts have been verified for
              the core fusion power generation business. Given the immense capital intensity of fusion plant
              construction and the unpredictable valuation dynamics of public meme equities, TAE cannot be underwritten
              on conventional unit economics. Investors must treat current entry valuations as speculative deep-tech
              venture pricing rather than an operating infrastructure investment until comprehensive S-4 disclosure
              filings and binding EPC commitments are established.
            claimRefs:
              - CI001
              - CI004
              - CI011
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reverse Merger Capital Structure and Public Market Transition Risk
            body: >-
              The pending all-stock merger with Trump Media & Technology Group presents profound governance and
              capital-structure contradictions for a 27-year-old deep-tech venture. While providing up to $300 million
              in potential cash injections and access to liquid public markets, the transaction ties TAE's long-term
              scientific roadmap to retail meme-stock volatility, Bitcoin treasury holdings, and a bifurcated co-CEO
              management structure that could severely penalize inevitable deep-physics timeline adjustments.
            calloutType: risk
            claimRefs:
              - CI011
