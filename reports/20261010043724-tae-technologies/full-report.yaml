      - number: '2.3'
        title: Buyer Segmentation and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Adoption pathways for TAE's commercial fusion plants divide across regulated electric utilities, municipal
              power authorities, and energy-intensive industrial consumers such as hyperscale data center operators.
              Utilities require dispatchable, carbon-free baseload power to replace retiring thermal power plants while
              complying with regional clean energy mandates and transmission reliability requirements. Hyperscale
              technology operators represent an emerging private procurement class seeking 24/7 firm clean energy to
              power artificial intelligence data centers, driving interest in behind-the-meter or dedicated plant
              interconnection arrangements. TAE has commenced multi-state site visits across the United States to
              identify prospective host locations capable of accommodating the initial 50 MWe Da Vinci facility. In the
              competitive landscape, Tracxn ranks TAE fourth among 64 tracked active private fusion competitors,
              supported by an extensive intellectual property portfolio comprising over 1,500 granted patents covering
              beam injection, magnetic confinement, and bi-directional power delivery.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Market adoption of TAE's fusion architecture is propelled by surging demand for firm clean power, grid
              decarbonization mandates, and the unique safety profile of non-radioactive aneutronic fuel cycles.
              However, substantial structural constraints temper near-term commercial velocity. Independent industry
              observers and technical commentators emphasize that non-deuterium-tritium fusion schemes remain highly
              speculative, requiring plasma temperatures far exceeding conventional approaches and challenging
              aggressive 2031 commercial operational timelines. Developing commercial plants demands immense capital;
              TAE has raised more than $1.3 billion in private financing to date and is advancing a public business
              combination with Trump Media & Technology Group Corp. (TMTG) to access capital markets. Critical diligence
              gaps remain regarding plant levelized cost of electricity (LCOE), the commercial viability of prospective
              helium-3 fuel supply agreements with Black Moon Energy, and the absence of binding power purchase
              agreements or interconnection approvals from prospective utility buyers.
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Near-Term Revenue Separation from Core Fusion
            body: >-
              While core commercial fusion power generation remains on a 2031 deployment horizon via the Da Vinci plant,
              TAE's adjacent subsidiaries—TAE Power Solutions and TAE Life Sciences—target commercial traction in power
              management and cancer therapy to generate near-term cash flows.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: Fuel Supply and Plant Siting Dependencies
            body: >-
              Commercialization hinges on securing viable fuel cycles (such as prospective helium-3 supply agreements
              with Black Moon Energy or pure p-B11 aneutronic physics) and navigating lengthy multi-state utility-scale
              siting processes before groundbreak.
            calloutType: risk
            claimRefs:
