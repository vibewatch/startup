      - number: '7.3'
        title: Capital, partner, and organizational dependencies
        blocks:
          - type: paragraph
            body: >-
              TAE's own cautionary language says financing may not be available on acceptable terms and that future
              losses or failure to achieve profitability are possible. Public funding totals cannot resolve that
              exposure: Tracxn reports $1.32 billion across 11 rounds, while FundedIQ reports $680 million across three
              rounds. Those totals use different recorded universes and describe funding raised, not cash available,
              burn, restricted capital, or runway. The same providers disagree on staffing, with Tracxn reporting 304
              employees and FundedIQ a 101-250 band. The merger also introduces counterparty, governance, and
              integration dependence because the joint release describes roughly equal fully diluted ownership and
              commercialization across Fusion, Power Solutions, and Life Sciences. A low-reputation independent
              commentary flags integration friction, but definitive governance, segment economics, and operating plans
              remain the necessary diligence evidence.
