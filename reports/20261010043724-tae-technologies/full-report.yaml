      - number: '7.2'
        title: Commercial-reactor and operational execution
        blocks:
          - type: paragraph
            body: >-
              The core operating risk is not whether TAE has built a differentiated research architecture, but whether
              it can convert that architecture into a commercially viable plant on an acceptable schedule and budget.
              Company-issued disclosures expressly identify reactor viability, development and manufacturing delays,
              access to materials, disruption, approvals, and strategic relationships as uncertainties. TAE also says
              its power system can discharge and synchronize up to 750 megawatts of bidirectional electricity on a
              sub-millisecond timescale; that is a power-management specification, not evidence of fusion electricity
              output or plant economics. Likewise, company safety and hydrogen-boron claims are not independently
              validated by the assigned evidence. Mitigation maturity therefore remains early until engineering, safety,
              fuel-cycle, reliability, and cost claims receive third-party review.
