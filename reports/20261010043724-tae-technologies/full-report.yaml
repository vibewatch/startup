      - number: '1.3'
        title: Capitalization History, Valuation Benchmarks, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Across its 27-year operating history, TAE Technologies has accumulated more than $1.3 billion to $1.4
              billion in private equity and strategic investment across approximately 12 rounds. Its syndicate includes
              patient corporate strategics such as Google, which has co-developed machine-learning plasma control
              algorithms with TAE since 2014, Chevron Technology Ventures, and Sumitomo Corporation of Americas,
              alongside institutional venture funds like New Enterprise Associates. Historical private valuations
              expanded from $2.1 billion in 2017 to $2.6 billion following a $280 million Series F round in April 2021.
              In secondary private markets, Forge Global reported an indicative price of $45.00 per share in October
              2026, implying an equity valuation of $2.47 billion. This private-market benchmark contrasts with the
              announced December 2025 all-stock merger with TMTG, which values the combined business at over $6 billion
              based on trailing trading prices and grants TAE shareholders approximately 50% pro forma ownership.
