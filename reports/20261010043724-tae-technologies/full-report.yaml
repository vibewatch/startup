  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative prioritization places reactor viability and capital sufficiency above transaction, licensing, supply,
      integration, and safety-validation risks.
    data:
      columns:
        - label: Impact
          detail: Consequence if the risk materializes
        - label: Likelihood
          detail: Directional assessment from retained disclosures, not a numerical probability
        - label: Mitigation maturity
          detail: Evidence that a control is implemented and independently demonstrated
      rows:
        - label: Commercial reactor viability
          note: Company disclosures acknowledge viability and timing uncertainty.
          values:
            - label: Critical
              detail: Failure would impair the core fusion thesis.
            - label: Medium-High
              detail: Commercial viability has not been demonstrated in the assigned evidence.
            - label: Early
              detail: Development work is described, but commercial proof is absent.
        - label: Capital sufficiency
          note: Funding raised is not cash available or runway.
          values:
            - label: Critical
              detail: Underfunding can halt technical and construction milestones.
            - label: Medium-High
              detail: Significant capital need and financing risk are expressly disclosed.
            - label: Early
              detail: No retained cash, burn, or milestone-budget evidence.
        - label: Merger closing
          note: The announced S-4 had not yet become effective in the retained release.
          values:
            - label: High
              detail: Delay or failure changes the capital and governance path.
            - label: Medium
              detail: Filing progress exists, but conditions remain.
            - label: Developing
              detail: Process milestones are underway but incomplete.
        - label: Licensing and site
          note: No site-specific approval roadmap was assigned.
          values:
            - label: High
              detail: Approval or site failure can block plant deployment.
            - label: Medium
              detail: Company disclosures identify approval and site-selection risk.
            - label: Early
              detail: No retained regulator correspondence or permit matrix.
        - label: Supply and manufacturing
          note: Materials and manufacturing delays appear in company risk language.
          values:
            - label: High
              detail: Delay can compound schedule and capital requirements.
            - label: Medium
              detail: Exposure is disclosed, while concentration is unknown.
            - label: Early
              detail: No supplier qualification or redundancy evidence.
        - label: Integration and governance
          note: Approximately equal ownership increases the importance of reserved-matter clarity.
          values:
            - label: High
              detail: Conflict can slow capital allocation and execution.
            - label: Medium
              detail: An independent commentary flags integration friction.
            - label: Developing
              detail: Definitive governance and integration evidence is not retained.
    approximationNotes: >-
      Ordinal labels are analyst assessments anchored to cited disclosures; they are not measured probabilities,
      incident rates, or quantitative scores.
