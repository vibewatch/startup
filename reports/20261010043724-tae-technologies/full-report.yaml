      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies was co-founded by pioneering plasma physicists including Dr. Michl Binderbauer, who
              currently serves as Chief Executive Officer and director, alongside theoretical physicist Hendrik
              Monkhorst and the late Norman Rostoker. Binderbauer represents the primary scientific and operational
              anchor of the company, holding over 100 patents across plasma confinement, magnetic field shaping, and
              neutral beam injection. In June 2026, the company expanded executive operations by appointing Jeff
              Woodbury as President and Chief Operating Officer to manage plant engineering and supply-chain scaling.
              Governance is undergoing a fundamental structural transition pursuant to the definitive merger agreement
              with Trump Media & Technology Group: upon transaction close, the combined entity will operate under a
              co-CEO framework dividing responsibilities between Devin Nunes (overseeing media and fintech operations)
              and Dr. Michl Binderbauer (directing fusion development and technology commercialization).
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO013
