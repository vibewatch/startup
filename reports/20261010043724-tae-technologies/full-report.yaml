  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Strategic Lens
      - Core Investment Thesis
      - Core Counter-Thesis
      - Thesis-Pivot Triggers
    rows:
      - - Fuel Cycle & Physics
        - >-
          Aneutronic p-B11 fuel eliminates damaging high-energy neutron flux, minimizing radioactive waste and avoiding
          complex tritium breeding blankets.
        - >-
          p-B11 fusion requires plasma temperatures above 150M °C and extreme confinement densities, unproven at
          commercial net-energy scale.
        - >-
          Empirical peer-reviewed demonstration of sustained high-confinement plasma and Q>1 net energy gain on
          Copernicus.
      - - Commercialization & Spin-outs
        - >-
          Adjacent operating units (TAE Power Solutions for EV/grid power and TAE Life Sciences for BNCT cancer therapy)
          provide non-fusion revenue and IP validation.
        - >-
          Spin-out revenues remain early-stage and cannot offset the multi-billion-dollar capital expenditures required
          for utility-scale reactor construction.
        - >-
          Signed long-term commercial contracts exceeding $100M annually in Power Solutions or an accretive standalone
          spin-off valuation.
      - - Capital Access & Liquidity
        - >-
          Proposed merger with TMTG unlocks immediate public market access, retail trading liquidity, and a balance
          sheet reporting over $3.1B in financial assets.
        - >-
          Public listing subjects patient science to quarterly earnings pressure, meme-stock volatility, crypto asset
          swings, and short-seller campaigns.
        - >-
          Execution of committed cash balance-sheet injections and non-dilutive sovereign partnership funding
          agreements.
      - - Timeline & Project Delivery
        - >-
          Aggressive milestone schedule targets site selection and construction in 2026, first plasma in 2029, and
          facility power operations by 2031.
        - >-
          Compressing FOAK plant licensing, environmental permitting, construction, and net energy into five years
          invites inevitable timeline slippage.
        - >-
          Securing binding utility interconnection positions and final local environmental permits for the 50 MWe
          prototype plant.
    notes: >-
      Core arguments and pivot criteria compiled from company filings, peer-reviewed technical publications, and
      independent diligence reviews.
    claimRefs:
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Key Assumptions & Catalysts
      - Implied Valuation Range
      - Downside Triggers & Diligence Asks
    rows:
      - - Bull Case
        - 20%
        - >-
          Merger closes successfully; Copernicus validates 150M °C plasma stability; 50 MWe FOAK plant breaks ground by
          2027; Power Solutions secures major auto/datacenter contracts.
        - $8.0B – $12.0B enterprise value
        - Engineering delays on high-power neutral beam injectors; failure to secure utility power purchase commitments.
      - - Base Case
        - 50%
        - >-
          Merger consummates but public trading multiples compress; FOAK plant construction slips 2–3 years into
          2029–2030; spin-outs generate modest cash flow ($30M–$50M).
        - $2.5B – $4.0B enterprise value
        - >-
          Subsequent dilutive equity offerings; co-CEO leadership friction; quarterly earnings misses triggering
          shareholder class actions.
      - - Bear Case
        - 30%
        - >-
          SEC Form S-4 registration stalls or is aborted; transaction terminates; TMTG share price contracts; TAE forced
          to execute a distressed down-round or spin-out divestiture.
        - $1.0B – $1.8B enterprise value
        - Transaction termination without cash injection; liquidity crisis; departure of core plasma physics talent.
    notes: >-
      Valuation ranges represent probability-weighted enterprise values based on prototype milestone delivery, public
      market multiples, and balance sheet durability.
