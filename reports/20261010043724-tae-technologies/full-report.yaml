      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Algorithmic Plasma Stability Advantage
            body: >-
              TAE's decade-long collaboration with Google Research has fundamentally transformed plasma confinement from
              an empirical trial-and-error process into an algorithmic optimization problem. By leveraging the
              Optometrist Algorithm and high-dimensional machine learning on the Norm reactor, TAE demonstrated stable
              plasma at 70 million °C, providing practical validation for its simplified linear core design.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: The Physics Gap of Hydrogen-Boron Fusion
            body: >-
              While aneutronic p-B11 fuel eliminates tritium breeding requirements and long-lived neutron activation,
              the physics thresholds are unforgiving. Achieving ignition requires plasma temperatures exceeding 100 to
              150 million °C—more than double that of deuterium-tritium—while maintaining extreme plasma density to
              overcome severe bremsstrahlung radiation cooling losses.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Operating Surfaces
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies operates across two fundamentally distinct commercial tiers: a speculative long-horizon
              utility power generation business and near-term industrial spin-out subsidiaries. In core fusion power,
              the target customers are electric utilities, grid transmission operators, and power-hungry hyperscale
              artificial intelligence data center operators seeking clean, 24/7 baseload electricity. However, TAE
              currently has zero utility-scale paying customers, zero signed power purchase agreements, and no binding
              offtake commitments. Regulatory filings for the pending corporate merger with Trump Media & Technology
              Group confirm that the transaction sets no legal or operational obligation to construct, site, or permit a
              fusion power plant, leaving utility customer traction purely aspirational.


              Near-term commercial traction and customer relationships exist exclusively within TAE's operating
              subsidiaries. Spun out to commercialize fusion-adjacent innovations, TAE Power Solutions focuses on power
              management, electric vehicle battery drivelines, and energy storage systems for automotive OEMs and
              stationary storage operators. TAE Life Sciences targets cancer treatment centers and research hospitals
              with boron neutron capture therapy accelerator hardware. While these adjacent units engage established
              industrial and research counterparties, core fusion power generation remains an unproven commercial
              concept without utility revenue.
            claimRefs:
