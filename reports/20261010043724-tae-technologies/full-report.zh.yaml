      - number: '6.2'
        title: 商业采用轨迹与部署现实
        blocks:
          - type: paragraph
            body: >-
              评估 TAE 的客户采用轨迹，必须把技术等离子体里程碑与商业电网部署区分开来。自 1998 年成立以来的 27 年间，TAE 已建造并运营五座实验研究反应堆，包括第五代 Norman 反应堆和当前的 Norm
              装置，完成超过 170,000 个实验循环。但这些装置没有一座产生过商业电力，或向外部客户提供可调度电力。公开路线预计依次完成 2026 年选址、2029 年 Da Vinci 原型首次等离子体、2030
              年净能量演示，以及 2031 年首座 50 MWe FOAK 设施初次发电，之后扩展至 350–500 MWe 电厂。


              由于没有任何公用事业客户承诺资本或签署并网协议，公用事业电力的商业渗透率仍为零。TAE 的商业模式依赖私募股权和资本市场，而不是客户现金流。公司已从机构和产业战略支持者处通过多轮融资筹得超过
              $1.3B，但公开市场披露和分析师估算显示，发电商业收入尚不存在。没有经过验证、能够持续实现净能量的运营反应堆，就无法用传统软件或工业设备部署指标衡量客户采用。
