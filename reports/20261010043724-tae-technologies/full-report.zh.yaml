            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: 创始人、执行领导层与治理架构
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies 由包括 Dr. Michl Binderbauer 在内的先驱等离子体物理学家共同创立；Binderbauer 目前担任 CEO 兼董事，联合创始人还包括理论物理学家
              Hendrik Monkhorst 和已故的 Norman Rostoker。Binderbauer 是公司的核心科学与运营支柱，拥有覆盖等离子体约束、磁场塑形和中性束注入的 100 多项专利。2026 年 6
              月，公司任命 Jeff Woodbury 为总裁兼 COO，负责工厂工程和供应链扩张，扩大了执行团队。根据与 Trump Media & Technology Group
              签署的最终合并协议，公司治理正经历根本性转型：交易完成后，合并实体将采用联合 CEO 架构，由 Devin Nunes 负责媒体和金融科技业务，Dr. Michl Binderbauer
              负责聚变开发与技术商业化。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
