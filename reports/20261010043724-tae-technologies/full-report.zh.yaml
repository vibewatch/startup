      - number: '3.2'
        title: 技术差异化：p-B11 非中子性聚变对比 D-T 与 D-3He
        blocks:
          - type: paragraph
            body: >-
              TAE 的核心技术差异，在于刻意坚持非中子性氢硼（p-B11）燃料循环，与主流竞争者采用的氘氚（D-T）或氘氦-3（D-3He）形成鲜明对比。Commonwealth Fusion Systems 和
              General Fusion 采用的氘氚系统，所需点火温度较低（约 1 亿摄氏度），但会遭受严重中子轰击，需要大量增殖氚并管理放射性材料。相比之下，TAE 的 p-B11
              燃料几乎不产生中子、储量丰富且不具放射性，生成无害氦离子，不会产生有毒废物或扩散风险。但 p-B11 需要前所未有的等离子体条件：温度超过 1 亿至 1.5
              亿摄氏度，并达到商业净能量反应堆从未实现过的极高约束密度。TAE 部署高能中性束注入器，加速并中和离子流，以稳定自组织 FRC
              等离子体团。这条路线避开了复杂的放射性许可和包层退化问题，却把巨大压力转移到等离子体物理上，成为近期商业化的深层障碍。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.3'
        title: 商业化模式、GTM 策略与相邻分拆业务
        blocks:
          - type: paragraph
            body: >-
              聚变开发商的商业化策略，反映出技术变现和资本风险缓释上的不同路径。同业开发商主要专注长期购电协议（PPA），例如 Helion Energy 已宣布与 Microsoft 签署双边供电协议；TAE
              则发展了相邻商业化策略。在 27 年运营历史中，TAE 分拆出多个专业运营子公司，包括面向汽车电力电子和电网储能的 TAE Power Solutions、面向硼中子俘获癌症疗法（BNCT）的 TAE Life
              Sciences，以及制造中性束的 TAE Beam UK。这些运营实体验证子系统工程能力并带来近期非聚变收入，部分隔离母公司对单一聚变开发时间表的依赖。然而，在核心公用事业发电业务上，TAE
              尚未披露已签署的商业供电合同、购电协议或 LCOE 保证。公司拟与 Trump Media & Technology Group 合并，并承诺最多投入 $300M
              现金支持公用事业规模开发；但公开市场估值预期仍高度依赖其交付未经证明的基荷能源经济性。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
