chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、发展阶段与技术平台
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies 是一家位于加州 Foothill Ranch、专注于公用事业规模商业聚变发电的能源与深科技公司。公司成立于 1998 年，近 30
              年来一直在推进名为束流驱动场反转构型（FRC）的专有反应堆架构。传统氘氚路线会产生强烈中子通量和放射性废物；TAE
              的长期商业路线则以非中子性的氢硼（p-B11）燃料为核心，可产生非放射性氦废气，避免熔毁和有毒副产物带来的运行风险。除聚变核心业务外，TAE
              还通过部分持股子公司将底层加速器和电力管理创新商业化，包括为电网和电动车供电的 TAE Power Solutions，以及开展生物靶向硼中子俘获疗法癌症治疗的 TAE Life Sciences。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO012
