  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业与约束范式
        blocks:
          - type: paragraph
            body: >-
              全球商业核聚变行业已扩展至 60 多家获得私募资金支持的活跃公司，采用多样化的约束范式和资本策略。在这一群体中，TAE 的 Tracxn 综合评估排名第四，累计获得资本排名第三，仅次于 Commonwealth
              Fusion Systems 和 Helion Energy。竞争主要沿等离子体约束物理分化。Commonwealth Fusion Systems 已筹得 $4.0B、拥有超过 1,100
              名员工，采用高温超导磁体构建高场托卡马克；Helion Energy 获得 $1.4B 支持，专注于脉冲磁惯性聚变并力求直接回收电力。General Fusion（已筹 $515M）和 Zap Energy（已筹
              $330M）分别采用磁化靶和剪切流 Z 箍缩架构。TAE 则以先进的束流驱动 FRC 区分自身，截至 2026 年底约有 300 名员工。整个行业都在争夺私募资本、知识产权和工程人才，背后是截然不同的聚变路线。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
