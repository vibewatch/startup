        title: 展示材料
        blocks:
          - type: callout
            title: 近期收入与聚变核心分离
            body: >-
              核心商业聚变发电仍以 2031 年通过 Da Vinci 电厂部署为目标；TAE 的相邻子公司 TAE Power Solutions 和 TAE Life Sciences
              则瞄准电力管理和癌症治疗领域的商业进展，以产生近期现金流。
            calloutType: insight
            claimRefs:
