        - 关键
        - 据报道，公司历史上完成多轮融资，但现金可用性未知
        - 在缺少现金、消耗、承诺和里程碑预算的情况下为关键
      - - 战略关系与材料
        - 未披露的合作伙伴和供应商
        - Unknown
        - 关键关系失效，或所需材料不可获得或不具经济性
        - 高
