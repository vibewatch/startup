              TAE Technologies 围绕中性束注入、高压电力管理和 FRC 等离子体稳定算法建立了大量知识产权防线，这些技术经过近 30 年开发。但竞争护城河可能受到快速技术替代和叙事疲劳的侵蚀。采用较低温 D-T
              燃料循环的竞争者，例如拥有 SPARC 和 ARC 装置的 Commonwealth Fusion Systems，可能在 TAE 达到 p-B11
              净聚变所需的极端等离子体状态前数年，就实现可展示的净发电。此外，TAE 已公布的路线——2026 年选址、2029 年首次等离子体、2030 年净能量、2031
              年初次发电——形成了与等离子体物理实证不确定性并不匹配的刚性日历。TMTG 合并后的公开市场环境中，选址许可或实验迭代任何延误，都可能引发散户股东强烈反弹、估值收缩和未来资本成本上升，威胁 TAE
