      - number: '1.3'
        title: 资本化历史、估值基准与股东画像
        blocks:
          - type: paragraph
            body: >-
              在 27 年运营历史中，TAE Technologies 通过约 12 轮融资累计获得超过 $1.3B 至 $1.4B 的私募股权和战略投资。其投资者包括 Google、Chevron Technology
              Ventures 和 Sumitomo Corporation of Americas 等耐心的产业战略投资者，以及 New Enterprise Associates 等机构风险基金。Google 自 2014
              年起与 TAE 共同开发机器学习等离子体控制算法。历史私募估值从 2017 年的 $2.1B 升至 2021 年 4 月完成 $280M F 轮融资后的 $2.6B。Forge Global 报告称，2026 年
              10 月二级私募市场的指示性价格为每股 $45.00，对应股权估值 $2.47B。相比之下，2025 年 12 月宣布的 TMTG 全股票合并按当时的交易价格将合并业务估值定在超过 $6B，并给予 TAE 股东约
              50% 的备考持股比例。
