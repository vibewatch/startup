      - number: '6.3'
        title: 已披露客户部署、研究合作与集中度
        blocks:
          - type: paragraph
            body: >-
              已记录的客户证明和运营关系，主要集中在工业技术合作方和科研机构，而非独立电力买家。在电力电子和汽车领域，子公司 TAE Power Solutions 与一级汽车供应商 Marelli
              建立多年合作，共同开发电力管理架构，并为电动车验证 Converter Battery Module 技术。此外，在战略收购交通电气化专业公司 Sprint Power 和 Eltrium 后，TAE Power
              Solutions 与德国车企 BMW 及产业合作伙伴一起加入英国 APC18 CELERITAS 联盟。


              在科学研究领域，TAE 宣布与日本核聚变科学研究所（NIFS）开展里程碑式多年合作，在大型螺旋装置仿星器内开展氢硼等离子体反应测试。这些合作验证了 TAE
              的技术工程、电力电子和加速器物理能力，但不构成商业聚变供电。核心聚变的客户集中度风险是绝对的：TAE 没有多元化电力买家，在甚至能够考虑商业供电之前，仍依赖资本市场和产业赞助者为持续开发融资。
            claimRefs:
