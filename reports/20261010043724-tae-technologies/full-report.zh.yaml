  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: TAE Technologies 从成立、原型验证，到完成重大融资及待定的 2026 年公开合并的时间顺序。
    data:
      items:
        - date: '1998'
          label: 公司成立
          details: Dr. Michl Binderbauer、Hendrik Monkhorst 和 Norman Rostoker 在加州 Foothill Ranch 创立公司，开发束流驱动的 FRC 聚变。
        - date: '2014'
          label: Google ML 合作建立
          details: 与 Google Research 启动多年合作，开发用于实时优化等离子体的机器学习算法。
        - date: 2021-04
          label: F 轮融资（$280M）
