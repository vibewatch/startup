      - number: '5.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 算法化等离子体稳定优势
            body: >-
              TAE 与 Google Research 长达十年的合作，已把等离子体约束从经验式试错转变为算法优化问题。借助 Optometrist Algorithm 和 Norm 反应堆上的高维机器学习，TAE 证明了
              7000 万 °C 下的稳定等离子体，为其简化线性核心设计提供了实际验证。
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: 氢硼聚变的物理鸿沟
            body: >-
              非中子性 p-B11 燃料虽然无需增殖氚，也不会产生长寿命中子活化，但其物理门槛极其苛刻。点火需要超过 100–150 million °C
              的等离子体温度——超过氘氚聚变的两倍——同时还要维持极高等离子体密度，以克服严重的轫致辐射冷却损失。
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与运营场景
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies
              横跨两种根本不同的商业层级：投机性、长期的公用事业发电业务，以及近期工业分拆子公司。在聚变核心业务中，目标客户是电力公用事业、电网输电运营商和寻求清洁、全天候基荷电力的高耗能超大规模人工智能数据中心运营商。但目前
              TAE 没有任何公用事业规模付费客户，没有签署的购电协议，也没有具有约束力的供电承诺。待完成的公司合并监管文件确认，交易不构成建设、选址或许可聚变电厂的法律或运营义务，因此公用事业客户进展仍只是设想。


              近期商业进展和客户关系完全存在于 TAE 的运营子公司中。TAE Power Solutions 从公司聚变相邻创新中分拆出来，专注于面向汽车 OEM
              和固定式储能运营商的电力管理、电动车电池传动系统和储能系统。TAE Life Sciences
              面向癌症治疗中心和研究医院，提供硼中子俘获疗法加速器硬件。尽管这些相邻业务已与成熟的工业和科研合作方合作，核心聚变发电仍是没有公用事业收入、未经证明的商业概念。
