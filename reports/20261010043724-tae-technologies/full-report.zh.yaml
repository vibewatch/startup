      - number: '7.3'
        title: 资本、合作伙伴与组织依赖
        blocks:
          - type: paragraph
            body: >-
              TAE 自身的风险提示称，融资未必能以可接受的条件获得，未来可能继续亏损或无法实现盈利。公开融资总额无法消除这一风险敞口：Tracxn 报告 11 轮融资合计 $1.32B，FundedIQ 报告 3 轮融资合计
              $680M。这些总额采用了不同的记录范围，描述的是募集到的资金，而不是可用现金、烧钱速度、受限资本或现金跑道。两家数据提供商对员工数也不一致：Tracxn 报告 304 名员工，FundedIQ 给出的区间是
              101-250 人。此次合并还引入了交易对手方、治理和整合依赖，因为联合公告称，完全稀释后双方持股大致各半，商业化覆盖 Fusion、Power Solutions 和 Life
              Sciences。一个声誉较低的独立评论指出整合摩擦，但确定性的治理安排、分部经济性和运营计划仍是必要的尽调证据。
