  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              TAE Technologies
              位于商业核聚变电力研究与专用高功率电子工程的交汇处。公司的主要市场方向，是开发采用专有先进束流驱动场反转构型（FRC）的公用事业规模聚变电厂，以实现清洁、无碳发电。与主要依赖氘氚燃料循环的传统磁约束系统不同，TAE
              优先考虑非中子性或替代燃料循环，例如氢硼（p-B11）和潜在的氦-3 混合物，以降低放射性活化和高放废物处理需求。除长期聚变发电外，TAE 还通过 TAE Power Solutions 和 TAE Life
              Sciences 建立了电动车电力管理、电网级储能和硼中子俘获疗法（BNCT）等相邻商业业务。市场边界包括批发基荷发电、稳定清洁容量采购和工业电力电子，但明确排除短时歇性可再生资产、裂变燃料制造和商户能源交易。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 可触达市场规模与行业预测
        blocks:
          - type: paragraph
            body: >-
              商业聚变电力的可触达市场，嵌在数万亿美元级全球批发电力发电及清洁基荷替代市场之中。独立行业研究预测，全球核聚变行业将在 2024 至 2030 年以 18.4%
              的复合年增长率（CAGR）扩张，驱动力包括私募资本流入、先进等离子体诊断技术，以及机构对稳定脱碳方案日益增长的支持。TAE 的商业部署路线以第六代实验装置 Norm 为锚点，并据此推进 Da Vinci
              的关键工程设计；这是一座规划中的 50 MWe 公用事业规模示范设施，目前正在选址，目标于 2031 年投入运营。后续商业电厂计划扩展至 350–500
              MWe，向批发电网输送具备成本竞争力的电力。除聚变核心外，私营商业数据库估算 TAE 当前年收入在 $100M 至 $500M 之间，但这些估算来自统计行业模型，而非经审计的财务披露。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
