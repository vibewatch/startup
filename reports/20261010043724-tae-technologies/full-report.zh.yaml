  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 评估
      - 基准 / 背景
      - 投资与尽调含义
    rows:
      - - 建议
        - 回避 / 跟踪
        - 行业同业中位数：跟踪
        - 在 Form S-4 生效且商用电厂经济性得到佐证前，避免以拟议的 $6.0B 合并估值投入新资本。
      - - 信心
        - 中
        - 私营深科技标准：中
        - 对核心 FRC 专利组合和束流物理学的信心高；对公开市场执行和联席 CEO 治理的信心中等。
      - - 风险评级
        - 高
        - 未经证明的净能量聚变：高
        - p-B11 无中子燃料循环面临极高技术挑战，又叠加散户迷因股波动和合并交割条件。
      - - 估值立场
        - 昂贵
        - 二级市场估值：$2.5B
        - 在缺少支持性备考披露的情况下，$6.0B 隐含交易企业价值较二级市场估值（$2.47B–$2.5B）溢价 140%。
    notes: 评估综合了二级市场交易估值（QuantLogix、Forge Data）、SEC Form S-4 提交公告和聚变行业对比基准。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 战略视角
      - 核心投资论点
      - 核心反方论点
      - 论点转向触发条件
    rows:
      - - 燃料循环与物理学
        - 无中子 p-B11 燃料消除了有害的高能中子通量，从而减少放射性废物，并避免复杂的氚增殖包层。
        - p-B11 聚变需要超过 150M °C 的等离子体温度和极高约束密度，在商用净能量规模上尚未得到证明。
        - 在 Copernicus 上，以同行评审的实证证明展示持续高约束等离子体和 Q>1 净能量增益。
      - - 商业化与分拆业务
        - 相邻运营单元（面向电动车 / 电网电力的 TAE Power Solutions，以及面向 BNCT 癌症治疗的 TAE Life Sciences）提供非聚变收入和 IP 验证。
        - 分拆业务收入仍处于早期，无法抵消建设公用事业规模反应堆所需的数十亿美元资本开支。
        - Power Solutions 签署年收入超过 $100M 的长期商业合同，或分拆后获得增厚价值的独立估值。
      - - 资本获取与流动性
        - 与 TMTG 的拟议合并将立即打开公开市场渠道和散户交易流动性，资产负债表还将报告超过 $3.1B 的金融资产。
        - 上市会让耐心型科学研发承受季度业绩压力、迷因股波动、加密资产价格波动和卖空者行动。
        - 落实已承诺的资产负债表现金注入，以及非稀释性主权合作伙伴融资协议。
      - - 时间线与项目交付
        - 激进的里程碑计划目标是在 2026 年选址并开工，2029 年实现首次等离子体，2031 年前让设施投入发电。
        - 将 FOAK 电厂许可、环境审批、建设和净能量实现压缩在五年内，几乎必然导致进度拖延。
        - 为 50 MWe 原型电厂取得具有约束力的公用事业并网位置和最终地方环境许可。
    notes: 核心论点和转向标准整理自公司文件、同行评审技术出版物和独立尽调审阅。
    claimRefs:
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 概率
      - 关键假设与催化剂
      - 隐含估值区间
      - 下行触发因素与尽调要求
    rows:
      - - 乐观情景
        - 20%
        - 合并顺利交割；Copernicus 验证 150M °C 等离子体稳定性；50 MWe FOAK 电厂在 2027 年前开工；Power Solutions 获得大型汽车 / 数据中心合同。
        - $8.0B – $12.0B 企业价值
        - 大功率中性束注入器出现工程延迟；未能取得公用事业购电承诺。
      - - 基准情景
        - 50%
        - 合并完成但公开市场交易倍数收缩；FOAK 电厂建设延迟 2–3 年至 2029–2030 年；分拆业务产生有限现金流（$30M–$50M）。
        - $2.5B – $4.0B 企业价值
        - 后续股权发行造成稀释；联席 CEO 领导层摩擦；季度业绩不及预期并触发股东集体诉讼。
      - - 悲观情景
        - 30%
        - SEC Form S-4 注册停滞或中止；交易终止；TMTG 股价下跌；TAE 被迫进行困境轮融资或出售分拆业务。
        - $1.0B – $1.8B 企业价值
        - 交易终止且没有现金注入；流动性危机；核心等离子体物理人才离职。
    notes: 估值区间是根据原型里程碑交付、公开市场倍数和资产负债表韧性计算的概率加权企业价值。
    claimRefs:
      - CV007
      - CV013
