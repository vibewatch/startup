  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 交易、监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              拟议的 TMTG 合并仍是一个闸门事件，而不是已经完成的融资。联合公司公告称，Form S-4 已于 2026 年 9 月 30
              日提交，但也称注册声明尚未生效；同一公告将完成交易置于股东、持股人、监管和其他交割条件满足之后。TMTG 管理层仍以 2026
              年底为目标，但由于监管流程，拒绝承诺具体日期。这种既有进展又明确附带条件的组合，使交割延迟或失败成为高影响风险。已分配资料中没有实际 SEC
              文件、生效通知、项目特定许可路线图或法律案卷，因此风险登记并不完整，不能据此证明不存在其他诉讼或审批障碍。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR010
