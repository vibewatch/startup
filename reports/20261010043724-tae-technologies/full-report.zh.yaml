            body: >-
              热力图将商用反应堆可行性和资本充足性列为最大的剩余风险敞口，因为公司自身都披露了巨额资本需求，也承认可能无法按时交付可行反应堆，甚至可能完全无法交付。交易交割位居其次：申报进展降低了程序性不确定性，但并未消除审批和生效条件。运营供应、许可和整合风险仍然重大，因为已披露的缓释措施只是计划，并非经过独立证明的控制措施。如果合并终止、最终申报显示资金不足以推进到下一个经独立验证的技术里程碑、监管机构认定许可路径无法补救，或独立工程审查无法证实其声称的安全和规模假设，投资工作就应停止或重置投资论点。在这些测试通过前，相比把公告中的融资当作可用现金跑道，里程碑融资和明确的下行保护更站得住脚。
