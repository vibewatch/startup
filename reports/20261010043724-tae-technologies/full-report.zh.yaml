      - number: '5.3'
        title: 电气化商业化与超大规模客户工作流
        blocks:
          - type: paragraph
            body: >
              为在聚变开发成熟前捕捉近期商业收入，TAE 成立 TAE Power Solutions，将最初为弥补聚变反应堆功率缺口而开发的电力管理和输送技术商业化。其旗舰商业应用是 D-Series
              电池储能系统（BESS），专为面向商业、工业和公用事业规模部署、且面临剧烈功率波动的场景设计。2025 年 6 月，TAE Power Solutions 与数字基础设施运营商 MARA 达成战略合作，部署一套
              10MW 清洁能源储能网络，服务超大规模数据中心、高性能计算（HPC）和数字资产计算设施。


              超大规模 AI 集群和 HPC 工作负载会让变电站及当地电网承受剧烈负荷波动，在微秒内推高或压低功率需求。D-Series BESS
              集成专有双向电力电子、边缘控制硬件和机器学习模型，以微秒级时间尺度监测电芯温度、荷电状态（SOC）和健康状态（SOH）。快速闭环响应让数据中心能够在本地缓冲计算峰值，为区域输电运营商提供快速频率响应，并避免昂贵的公用事业并网升级。TAE
              的电气化工程团队按系统安全标准完成端到端认证，以 UL 1973、UL 9540、UL 9540A 和 NFPA 855 消防安全标准验证 BESS 硬件，确保商业场地顺利接入。
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: 运营子系统架构、监管状态与技术风险
        blocks:
          - type: paragraph
            body: >
              尽管等离子体物理实验取得显著进展，TAE 仍在材料科学、等离子体稳定性和商业化时间表上面临严峻技术障碍。非中子性 p-B11 聚变要求维持超过 100–150 million °C
              的等离子体温度，同时保持高约束密度；除非等离子体纯度和高能束流分布近乎完美，否则轫致辐射损失会超过聚变功率输出。独立行业观察人士认为，TAE 声称 2026 年开始建设 Da Vinci
              公用事业规模电厂的时间表非常激进，因为商业许可、环境审查和选址必须不延误地推进，而核心物理阈值在净能量规模上仍未验证。


              从监管角度看，美国商业聚变受益于核监管委员会（NRC）的里程碑式决定：按照粒子加速器框架（10 CFR Part 30/32）监管聚变设施，而不是沿用适用于核裂变反应堆的繁重 Part 50/52
              许可规则。这显著缩短了许可时间并降低辐射防护负担。但商业部署仍需州级环境影响审查、公用事业电网并网批准和复杂的多年期购电协议。此外，二级市场透明度仍然有限，TAE
              的机构估值和运营基准主要局限在私营订阅跟踪服务中，公众投资者只能依赖公司层面的高阶路线发布。
