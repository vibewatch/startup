  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策路径将等离子体物理学成熟度、资本规模、合并条款、治理风险和估值脱节连接至最终的“回避”建议。
    data:
      nodes:
        - id: physics-milestone
          label: 无中子物理学可行性
          description: 束流驱动 FRC 已开发 27 年并达到 70M °C，但 p-B11 净能量仍未经证明。
        - id: capital-scale
          label: 历史融资
          description: 历史上分 12 轮融资超过 $1.4B，2026 年又补充了 $250M 的 G 轮融资。
        - id: merger-terms
          label: TMTG 全股票合并
          description: 拟议中的 50/50 合并将企业估值定为 $6.0B，Form S-4 已于 2026 年 9 月 30 日提交。
        - id: governance-volatility
          label: 上市架构与波动
          description: 联席 CEO 治理分裂，牵涉 DJT 与加密资产的散户迷因股波动极为剧烈。
        - id: valuation-gap
          label: 估值压顶
          description: 在工厂经济性尚未披露的情况下，$6.0B 交易价值较 $2.5B 二级市场成交价高出 140%。
        - id: recommendation-outcome
          label: 立场：回避 / 跟踪
          description: 在 Form S-4 宣布生效且 FOAK 工厂经济性得到充分验证前，继续维持回避 / 跟踪立场。
    approximationNotes: 流程顺序展示了从核心物理学就绪度到最终投资立场的定性尽调层级。
