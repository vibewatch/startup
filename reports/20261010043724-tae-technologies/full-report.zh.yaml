              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开市场敞口与治理摩擦
            body: 与 TMTG 拟议的 50/50 全股票合并，会让 TAE 这项历经 27 年、需要耐心的科学项目暴露于散户情绪波动、迷因股价格波动，以及可能与聚变开发所需高资本投入时间表冲突的双 CEO 分裂治理架构之下。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
          - type: callout
            title: 拟议交易条款下的估值纪律
            body: >-
              按隐含 $6.0B 的企业交易价值计算，相比近期 $2.47B 至 $2.50B 的二级市场成交价溢价 140%，投资者应维持回避立场，直到 SEC 宣布 Form S-4
              生效，且管理层提供有据可查的首座电站平准化成本经济性。
            calloutType: recommendation
