      - number: '2.3'
        title: 买方细分与采购动态
        blocks:
          - type: paragraph
            body: >-
              TAE
              商业聚变电厂的采用路径，横跨受监管电力公用事业、市政电力机构，以及超大规模数据中心运营商等高耗能工业客户。公用事业需要可调度、无碳的基荷电力替代退役火电，同时满足区域清洁能源要求和输电可靠性要求。超大规模科技运营商正在成为新兴的私营采购群体，希望获得全天候稳定清洁能源，为人工智能数据中心供电，因此对表后或专用电厂并网安排产生兴趣。TAE
              已开始在美国多个州开展选址考察，寻找能够容纳首座 50 MWe Da Vinci 设施的候选地点。在竞争格局中，Tracxn 在其跟踪的 64 家活跃私营聚变竞争者中将 TAE 排名第四；公司拥有超过 1,500
              项已授权专利，覆盖束流注入、磁约束和双向电力输送。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              TAE
              聚变架构的市场采用，受稳定清洁电力需求激增、电网脱碳要求，以及非放射性非中子性燃料循环独特的安全特性推动。但重大的结构性约束压低了近期商业化速度。独立行业观察人士和技术评论者强调，非氘氚聚变方案仍高度投机，需要远高于传统路线的等离子体温度，使激进的
              2031 年商业运营时间表面临挑战。建设商业电厂需要巨额资本；截至目前，TAE 已筹得超过 $1.3B 私募融资，并正推进与 Trump Media & Technology Group
              Corp.（TMTG）的公开市场业务合并。关键尽调缺口包括电厂平准化电力成本（LCOE）、与 Black Moon Energy 签订的潜在氦-3
              燃料供应协议是否具备商业可行性，以及潜在公用事业买家尚无具有约束力的购电协议或并网批准。
            claimRefs:
              - CM013
              - CM014
              - CM015
