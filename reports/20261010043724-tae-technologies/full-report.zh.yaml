  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序将反应堆可行性和资本充足性置于交易、许可、供应、整合及安全验证风险之上。
    data:
      columns:
        - label: 影响
          detail: 风险实现后的后果
        - label: 可能性
          detail: 根据留存披露作出的方向性评估，不是数值概率
        - label: 缓解措施成熟度
          detail: 控制措施已实施并经独立证明的证据
      rows:
        - label: 商用反应堆可行性
          note: 公司披露承认可行性和时间存在不确定性。
          values:
            - label: 关键
              detail: 失败将损害核心聚变论点。
            - label: 中高
              detail: 指定证据尚未证明商用可行性。
            - label: 早期
              detail: 已描述开发工作，但缺少商业化证明。
        - label: 资本充足性
          note: 融资额不等于可用现金或现金跑道。
          values:
            - label: 关键
              detail: 资金不足可能令技术和建设里程碑停摆。
            - label: 中高
              detail: 披露明确指出资本需求和融资风险重大。
            - label: 早期
              detail: 未留存现金、消耗或里程碑预算证据。
        - label: 合并交割
          note: 留存公告中的 S-4 尚未生效。
          values:
            - label: 高
              detail: 延迟或失败会改变资本和治理路径。
            - label: 中
              detail: 提交进展存在，但条件仍未满足。
            - label: 发展中
              detail: 流程里程碑正在推进，但尚未完成。
        - label: 许可与选址
          note: 未指定具体选址的审批路线图。
          values:
            - label: 高
              detail: 审批或选址失败可能阻碍电厂部署。
            - label: 中
              detail: 公司披露指出审批和选址风险。
            - label: 早期
              detail: 未留存监管机构往来或许可矩阵。
        - label: 供应与制造
          note: 材料和制造延迟出现在公司的风险表述中。
          values:
            - label: 高
              detail: 延迟可能进一步推高进度和资本要求。
            - label: 中
              detail: 已披露相关暴露，但集中度未知。
            - label: 早期
              detail: 没有供应商资质或冗余证据。
        - label: 整合与治理
          note: 大致相等的持股比例提高了明确保留事项的重要性。
          values:
            - label: 高
              detail: 冲突可能拖慢资本配置和执行。
            - label: 中
              detail: 一份独立评论指出整合摩擦。
            - label: 发展中
              detail: 未留存确定的治理和整合证据。
    approximationNotes: 序数标签是以所引披露为依据的分析师评估，不是实测概率、事故率或量化评分。
