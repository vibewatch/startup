      - number: '7.2'
        title: 商业反应堆与运营执行
        blocks:
          - type: paragraph
            body: >-
              核心运营风险不在于 TAE
              是否搭建出了差异化的研究架构，而在于能否以可接受的时间表和预算，把这套架构转化为具备商业可行性的电站。公司发布的披露明确将反应堆可行性、开发与制造延误、材料获取、业务中断、审批和战略关系列为不确定因素。TAE
              还称，其电力系统可以在亚毫秒级时间尺度内释放并同步高达 750
              兆瓦的双向电力；这只是电力管理规格，不是聚变发电量或电站经济性的证据。同样，公司的安全和氢硼相关表述尚未得到本次证据范围内的独立验证。因此，在工程、安全、燃料循环、可靠性和成本主张接受第三方审查前，缓释措施的成熟度仍处于早期。
