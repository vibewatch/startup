            title: 完全缺乏具有约束力的商业供电合同
            body: >-
              不同于已与超大规模数据中心运营商取得有条件供电承诺或购电意向书的私营聚变企业，TAE Technologies 没有签署任何商业购电协议或公用事业供电合同。有关待完成 Trump Media
              合并的披露明确警告，交易不构成建设或选址聚变设施的法律承诺，因此商业客户基础完全未经验证。
