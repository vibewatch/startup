      - number: '1.4'
        title: 运营轨迹、S-4 进展与转向公开市场的风险
        blocks:
          - type: paragraph
            body: >-
              TAE 的运营路线持续取得实验验证，从 Norman 反应堆推进到紧凑型 Norm 原型机；后者在 2025 年证明等离子体温度可稳定超过 7000 万摄氏度。2025 年 12 月宣布合并后，TMTG 与
              TAE 于 2026 年 9 月提交 SEC Form S-4
              注册声明，推进了交易。但独立能源和金融分析师指出，将资本密集型深科技项目转入公开股权市场存在严重结构性摩擦。公开市场要求季度财务披露和短期运营交付，这与多年物理迭代及复杂的 FOAK
              工厂许可流程相冲突。此外，将反应堆资本化与 TMTG 波动的股权和国库资产绑定，如果里程碑延期被散户投资者解读为项目失败，就会引入叙事与融资脆弱性。
