  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心聚变架构与先进束流驱动 FRC
        blocks:
          - type: paragraph
            body: >
              TAE Technologies 于 1998 年在加州 Foothill Ranch
              成立，目标是以先进的束流驱动场反转构型（FRC），而非传统托卡马克或仿星器几何结构，开创商业核聚变发电。公司的架构采用线性圆柱形真空容器，闭合磁力线主要由等离子体内部的涡电流产生，而不是依赖笨重的外部环向磁体组件。为解决早期
              FRC 设计长期存在的不稳定性，TAE
              在中心腔室周围布置中性粒子加速器，以切向角度注入高能中性原子流。这些中性束向等离子体传递动量和热量，维持内部磁场并主动控制平衡，将过热等离子体约束在稳定构型中。公司的电力管理系统支撑这一设计，可在亚毫秒级时间尺度释放并同步最高
              750 MW 的双向电力，精确驱动磁线圈和加速器注入器。


              与采用氘氚（D-T）反应的主流聚变项目不同，TAE 从设计上就以非中子性氢硼（p-B11）燃料为目标。在这一燃料循环中，质子与硼-11 原子核聚变，产生三个高能 α
              粒子（氦核）并释放能量，几乎不产生破坏性中子通量，也不需要复杂的增殖氚包层或厚重屏蔽基础设施。但 p-B11 要求运行温度超过 100–150 million °C，远高于 D-T
              聚变，因此能量约束时间和轫致辐射抑制成为关键工程约束。为解决非线性约束动力学，TAE 自 2014 年起与 Google Research 合作，将 Optometrist Algorithm
              等机器学习算法嵌入实验控制回路，以优化等离子体持续时间、重建高维参数并指导主动反馈。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE011
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE008
              - CE013
      - number: '5.2'
        title: 反应堆开发管线与产品资产地图
        blocks:
          - type: paragraph
            body: >
              TAE 的技术进展由持续数十年的五个国家实验室规模实验原型串联而成，并最终进入当前示范反应堆阶段。最近完成的实体平台 Norm 在简化反应堆几何中实现了超过 7000 万 °C
              的稳定等离子体，证明中性束注入结合算法控制，可以在紧凑设备占地中维持稳态约束。基于 Norm 的运行数据，TAE 正在推进第六座示范装置 Copernicus 的建设。Copernicus
              是关键科学桥梁，计划在本十年结束前证明净能量能力（科学盈亏平衡，Q > 1），并作为全面商业部署前的直接前身。


              商业化路线最终指向规划中的 Da Vinci 设施，它被设想为全球首座公用事业规模原型聚变电厂，初始目标输出容量为 50 MWe，未来商业机组将扩展至 350–500 MWe。按当前开发计划，管理层计划于
              2026 年开始 Da Vinci 的场地准备和土建施工，目标在 2029 至 2030 年开展集成系统测试和首次等离子体，随后于 2030 年代初向电网商业供电。围绕聚变能源核心，TAE
              还分拆了多个专业运营子公司，将成熟的子系统创新商业化，包括面向电网级电池储能和电动出行的 TAE Power Solutions、面向硼中子俘获疗法（BNCT）癌症治疗的 TAE Life
              Sciences，以及制造中性束的 TAE Beam UK。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
