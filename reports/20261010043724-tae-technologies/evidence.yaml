evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-dispersion
    missingEvidence: >-
      Audited cap table waterfall and fully diluted share count to reconcile the $6.0B merger valuation against the
      $2.47B-$2.60B private funding and secondary benchmarks.
    whyItMatters: >-
      The disparity between private market indications and the announced merger consideration affects economic recovery
      and post-merger dilution sensitivity.
    diligencePath: >-
      Inspect the final Form S-4 proxy/prospectus disclosures upon SEC effectiveness to verify equity share classes and
      liquidation preferences.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-fusion-offtake
    missingEvidence: >-
      Binding commercial power purchase agreements or utility interconnection studies for the planned 50 MWe
      utility-scale plant.
    whyItMatters: >-
      Commercial viability and cash flow timing remain speculative until binding customer contracts or host-site
      interconnection approvals are demonstrated.
    diligencePath: >-
      Review public utility commission dockets and host-state siting permit applications for the designated 50 MWe
      demonstration plant.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: utility-offtake-commitments
    missingEvidence: >-
      Signed power purchase agreements, binding utility offtake contracts, or interconnection queue applications for the
      Da Vinci 50 MWe facility.
    whyItMatters: >-
      Without contractual offtake commitments, commercial power demand for first-of-a-kind fusion power generation
      remains unvalidated by institutional buyers.
    diligencePath: >-
      Review future Form S-4 merger registration disclosures for signed utility letters of intent, power purchase terms,
      or development joint venture agreements.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: commercial-revenue-disclosures
    missingEvidence: >-
      Audited financial statements breaking out revenue by business unit across core fusion, TAE Power Solutions, and
      TAE Life Sciences.
    whyItMatters: >-
      Third-party commercial estimates range widely ($100M–$500M statistical evaluation on IncFact vs unverified private
      metrics), obscuring actual commercial traction across non-fusion subsidiaries.
    diligencePath: >-
      Examine audited financial statements in Form S-4 registration statement once filed by Trump Media & Technology
      Group Corp. for the pending merger.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-offtake-and-ppa-pricing
    missingEvidence: >-
      Fully executed and disclosed power purchase agreements (PPAs), utility interconnect contracts, or industrial
      offtake pricing structures for TAE's planned 50 MWe first utility plant.
    whyItMatters: >-
      Without signed customer offtake documentation, TAE's commercial revenue timeline and levelized cost of electricity
      (LCOE) competitiveness cannot be benchmarked against peers like Helion.
    diligencePath: >-
      Inspect upcoming SEC merger registration filings (Form S-4/A) or utility regulatory filings in the selected plant
      jurisdiction for executed binding offtake contracts.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
