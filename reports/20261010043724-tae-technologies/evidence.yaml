  - type: private-evidence-only
    severity: blocking
    topic: da-vinci-plant-economics
    missingEvidence: >-
      Audited engineering, procurement, and construction (EPC) capital expenditure budgets, levelized cost of
      electricity (LCOE) models, and site selection documentation for the 50 MWe Da Vinci prototype fusion power plant.
    whyItMatters: >-
      Without capital expenditure and operating cost projections, institutional investors cannot evaluate reactor return
      on invested capital, financing requirements, or electricity tariff competitiveness.
    diligencePath: >-
      Obtain the formal Da Vinci EPC feasibility study, equipment procurement schedules, and management financial model
      during pre-investment data room review.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
