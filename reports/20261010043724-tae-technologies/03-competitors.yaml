callouts:
  - calloutType: "insight"
    title: "Fuel Cycle Dichotomy: Aneutronic Purity vs. Plasma Temperature Penalty"
    body: "While Commonwealth Fusion Systems and General Fusion accept severe tritium breeding and neutron shielding requirements to operate at lower deuterium-tritium temperatures, TAE's hydrogen-boron choice trades away radiation shielding complexity for an extreme plasma physics threshold requiring temperatures exceeding 100 million to 150 million degrees Celsius."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP014"
  - calloutType: "risk"
    title: "Public Market Exposure vs. Patient Physics Milestones"
    body: "TAE's proposed public transaction with Trump Media & Technology Group introduces quarterly earnings discipline and retail equity volatility to an enterprise requiring patient, multi-decade capital cycles, creating substantial narrative risk if dated milestones (such as 2026 site selection or 2031 power operations) encounter typical deep-tech engineering delays."
    claimRefs:
      - "CP010"
      - "CP011"
      - "CP012"
