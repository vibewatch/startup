callouts:
  - calloutType: "strength"
    title: "Algorithmic Plasma Stability Advantage"
    body: "TAE's decade-long collaboration with Google Research has fundamentally transformed plasma confinement from an empirical trial-and-error process into an algorithmic optimization problem. By leveraging the Optometrist Algorithm and high-dimensional machine learning on the Norm reactor, TAE demonstrated stable plasma at 70 million °C, providing practical validation for its simplified linear core design."
    claimRefs:
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "The Physics Gap of Hydrogen-Boron Fusion"
    body: "While aneutronic p-B11 fuel eliminates tritium breeding requirements and long-lived neutron activation, the physics thresholds are unforgiving. Achieving ignition requires plasma temperatures exceeding 100 to 150 million °C—more than double that of deuterium-tritium—while maintaining extreme plasma density to overcome severe bremsstrahlung radiation cooling losses."
    claimRefs:
      - "CE011"
      - "CE012"
