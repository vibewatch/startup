  - id: "reactor-pipeline-and-commercial-assets"
    title: "Reactor Development Pipeline and Product Asset Map"
    body: |
      TAE's technological progression is defined by a multi-decade sequence of five national-laboratory-scale experimental prototypes leading into current demonstration reactors. The latest completed physical platform, Norm, achieved a core breakthrough by establishing stable plasma at temperatures exceeding 70 million °C within a simplified reactor geometry, demonstrating that neutral beam injection combined with algorithmic control could sustain steady-state confinement in a compact machine footprint. Building on Norm's operational data, TAE is advancing construction on its sixth demonstration unit, designated Copernicus. Copernicus is engineered as the definitive scientific bridge intended to demonstrate net energy capability (scientific break-even, Q > 1) before the end of the current decade, serving as the immediate predecessor to full commercial deployment.
      
      The commercialization roadmap culminates in the planned Da Vinci facility, envisioned as the world's first utility-scale prototype fusion power plant with an initial target output capacity of 50 MWe, scaling to future commercial units generating 350 to 500 MWe. Under current development schedules, management plans to begin site preparation and civil construction for Da Vinci in 2026, targeting integrated systems testing and first plasma by 2029 to 2030, followed by commercial grid power delivery in the early 2030s. Parallel to its fusion energy core, TAE has spun out specialized operating subsidiaries to commercialize mature subsystem innovations, notably TAE Power Solutions for grid-scale battery storage and electric mobility, TAE Life Sciences for boron neutron capture therapy (BNCT) cancer treatment, and TAE Beam UK for neutral beam manufacturing.
    claimRefs:
