chapter:
  number: 6
  title: "Customers"
  summary: "TAE Technologies remains entirely pre-commercial in core nuclear fusion power with zero utility offtake contracts, power purchase agreements, or grid-scale operating revenue. Near-term customer and commercial validation is confined to non-fusion spin-outs and Tier-1 automotive partnerships, while utility-scale power adoption faces extended multi-year scientific, permitting, and construction horizons."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Segmentation and Operating Surfaces"
    body: "TAE Technologies operates across two fundamentally distinct commercial tiers: a speculative long-horizon utility power generation business and near-term industrial spin-out subsidiaries. In core fusion power, the target customers are electric utilities, grid transmission operators, and power-hungry hyperscale artificial intelligence data center operators seeking clean, 24/7 baseload electricity. However, TAE currently has zero utility-scale paying customers, zero signed power purchase agreements, and no binding offtake commitments. Regulatory filings for the pending corporate merger with Trump Media & Technology Group confirm that the transaction sets no legal or operational obligation to construct, site, or permit a fusion power plant, leaving utility customer traction purely aspirational.\n\nNear-term commercial traction and customer relationships exist exclusively within TAE's operating subsidiaries. Spun out to commercialize fusion-adjacent innovations, TAE Power Solutions focuses on power management, electric vehicle battery drivelines, and energy storage systems for automotive OEMs and stationary storage operators. TAE Life Sciences targets cancer treatment centers and research hospitals with boron neutron capture therapy accelerator hardware. While these adjacent units engage established industrial and research counterparties, core fusion power generation remains an unproven commercial concept without utility revenue."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-deployment-proof"
    title: "Commercial Adoption Trajectory and Deployment Realities"
    body: "Evaluating TAE's customer adoption trajectory requires separating technical plasma milestones from commercial grid deployments. Over its 27-year history since founding in 1998, TAE has constructed and operated five experimental research reactors—including its fifth-generation Norman reactor and the current Norm machine—conducting more than 170,000 experimental cycles. However, none of these devices have generated commercial electricity or delivered dispatchable power to an external customer. Disclosed roadmaps project a sequence starting with site selection in 2026, first plasma on the Da Vinci prototype in 2029, net energy demonstration by 2030, and initial power operations of a 50 MWe first-of-a-kind facility by 2031, scaling later to 350 to 500 MWe plants.\n\nBecause no utility customer has committed capital or signed an interconnection agreement, the adoption trajectory for utility power remains at zero percent commercial penetration. TAE's business model relies on private equity and capital markets rather than customer cash flows. The company has raised over $1.3 billion across multiple funding rounds from institutional and strategic corporate backers, but public market disclosures and analyst estimates indicate that commercial revenue from power generation is absent. Without a verified operating reactor capable of sustained net energy, customer adoption cannot be benchmarked against conventional software or industrial equipment deployment metrics."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-customer-and-partner-proof"
    title: "Named Customer Deployments, Research Partnerships, and Concentration"
    body: "Documented customer proof and operational relationships are concentrated among industrial technology collaborators and research institutions rather than independent power offtakers. In the power electronics and automotive sector, subsidiary TAE Power Solutions established a multi-year partnership with Tier-1 automotive supplier Marelli to co-develop power management architectures and validate Converter Battery Module technology for electric vehicles. In addition, TAE Power Solutions secured entry into the UK APC18 CELERITAS consortium alongside German automaker BMW and industrial partners following the strategic acquisitions of transport electrification specialists Sprint Power and Eltrium.\n\nIn scientific research, TAE announced a landmark multi-year collaboration with Japan's National Institute for Fusion Science (NIFS) to conduct hydrogen-boron plasma reaction tests inside the Large Helical Device stellarator. While these engagements validate TAE's technical engineering, power electronics, and accelerator physics know-how, they do not constitute commercial fusion offtake. Customer concentration risk in core fusion is absolute: TAE has zero diversified power purchasers and remains dependent on capital markets and industrial sponsors to finance ongoing development before commercial offtake can even be contemplated."
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
