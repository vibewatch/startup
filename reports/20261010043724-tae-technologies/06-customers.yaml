callouts:
  - calloutType: "risk"
    title: "Total Absence of Binding Commercial Offtake Contracts"
    body: "Unlike competing private fusion ventures that have secured conditional off-take commitments or power purchase letters with hyperscale data center operators, TAE Technologies possesses no signed commercial power purchase agreements or utility offtake contracts. Disclosures around the pending Trump Media merger explicitly caution that the transaction creates no legal commitment to build or site a fusion facility, leaving the commercial customer base entirely unproven."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU016"
  - calloutType: "insight"
    title: "Subsidiary Industrial Partnerships Provide Critical Non-Fusion Proof"
    body: "TAE Power Solutions represents the primary operational bridge to paying commercial customers. Collaborations with Tier-1 automotive supplier Marelli and participation in the BMW APC18 CELERITAS battery consortium validate the tangible engineering value of TAE's sub-millisecond bi-directional power management technology, partially de-risking the company's reliance on multi-decade fusion physics timelines."
    claimRefs:
      - "CU004"
      - "CU013"
      - "CU014"
