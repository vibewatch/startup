companyProfile:
  summary: >-
    TAE Technologies is a Foothill Ranch, California-based deep-tech energy company founded in 1998 and focused on
    commercializing beam-driven field-reversed-configuration fusion. Its core fusion program remains pre-revenue, while
    adjacent businesses in power management and life sciences commercialize accelerator and power-electronics IP. The
    company is capital intensive, has raised substantial private funding, and is now pursuing a proposed all-stock
    merger with Trump Media & Technology Group to access public capital.
