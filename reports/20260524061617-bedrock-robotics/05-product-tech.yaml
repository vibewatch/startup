  - type: private-evidence-only
    severity: material
    topic: product-maturity
    missingEvidence: A roadmap with milestone exit criteria from supervised autonomy to operator-less commercial operation.
    whyItMatters: Without clear maturity gates, it is impossible to judge whether the 2026 operator-less target is conservative or aggressive.
    diligencePath: Review internal release gates, safety sign-off criteria, and customer pilot progression metrics.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: deployment-infrastructure
    missingEvidence: Detailed setup time, network requirements, calibration steps, and failure modes across different site types.
    whyItMatters: Temporary construction sites can punish products that need heavy setup or brittle connectivity assumptions.
    diligencePath: Request site-level installation playbooks and postmortems from at least three different deployment environments.
