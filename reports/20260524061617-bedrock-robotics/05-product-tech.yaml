  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: safety-validation
    missingEvidence: Formal safety case documentation, disengagement logic, and third-party validation metrics for Bedrock deployments.
    whyItMatters: Autonomy credibility depends on more than partner quotes; investors need objective evidence on how the system handles edge cases.
    diligencePath: Request safety architecture documents, hazard analyses, and incident / near-miss reporting from active sites.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE018
    - QE023
