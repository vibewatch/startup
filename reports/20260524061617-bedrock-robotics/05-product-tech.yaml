chapter:
  number: 5
  title: Product & Technology
  summary: 'Bedrock Robotics’ product is a retrofit autonomy stack for heavy construction equipment built around sensing, onboard compute, machine-learning software, and jobsite monitoring. Public proof is strongest for supervised excavation and truck-loading workflows on large sites, where repetitive work makes autonomy easier to justify and evaluate. The technical opportunity is large, but so is the challenge: Bedrock still has to prove that its Waymo-inspired data-driven approach can generalize from supervised pilots to reliable operator-less production deployments.'
sections:
- id: product-definition
  title: What the Product Is
  body: 'Bedrock’s product is best understood as a retrofit autonomy stack, not as a new piece of OEM machinery. The company’s own materials describe the Bedrock Operator as a sensor-and-software system that can be added to existing heavy equipment. Public deployment coverage fills in more detail: LiDAR, GPS, inertial sensors, cameras, and onboard compute sit on the machine, while remote progress visibility helps connect autonomy to jobsite operations. That combination matters because it tells investors where the product boundary really sits. Bedrock is selling a way to make today’s fleet behave differently, not a new fleet. The product therefore has to solve both robotics and deployment-engineering problems at once. Hardware, machine integration, and software are all part of the offer, which raises complexity but also creates a stronger wedge if Bedrock can make retrofits feel routine for contractors. The careers page also suggests engineering depth is still expanding rapidly.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
