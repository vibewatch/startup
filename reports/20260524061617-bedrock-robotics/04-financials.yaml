chapter:
  number: 4
  title: Financials
  summary: Bedrock Robotics has raised substantial capital—more than $350 million including a $270 million Series B—yet public evidence on revenue, pricing, margins, and burn is still extremely limited. The best-supported financial view is a hybrid business model in which deployment and installation revenue likely coexist with recurring autonomy software and support revenue. That structure could become attractive at scale, but today the main underwriting challenge is missing operating metrics rather than missing funding history.
sections:
- id: monetization-model
  title: Monetization Model and Revenue Shape
  body: 'Bedrock’s public materials do not read like a standard software company because the product is not delivered purely through code. The company retrofits heavy equipment on customer sites, which implies at least some installation, calibration, and deployment-services revenue in addition to any recurring autonomy software charges. Over time, the economic promise likely shifts toward software, remote monitoring, and multi-machine orchestration, especially if Bedrock succeeds in moving from supervised single-machine deployments toward coordinated fleets. But the current evidence suggests a hybrid model: some service-heavy revenue to get machines live, followed by recurring value if the customer keeps the system in production. That mix is strategically attractive because it is tied to real jobsite ROI, yet it also means the company probably does not enjoy software-like margins today. For underwriting, the important distinction is not whether Bedrock is “software” or “hardware,” but how
    quickly repeat deployments can push the business toward a more leveraged recurring profile.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
