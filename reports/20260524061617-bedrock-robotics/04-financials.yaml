  figureRefs:
  - FI002
- id: capital-adequacy-and-runway
  title: Capital Adequacy and Runway Logic
  body: 'What Bedrock does have publicly is capital. The company paired an $80 million launch financing in July 2025 with a $270 million Series B only seven months later, bringing disclosed total funding to more than $350 million. That gives it a much stronger cash cushion than most early autonomy startups. It also tells investors something important: Bedrock is being funded like a capital-intensive scale-up, not like a modestly financed software experiment. That is sensible for a business that needs hardware, safety validation, customer deployment teams, and potentially inventory. The unresolved question is adequacy, not absolute dollars. Without burn, headcount, or cash-balance disclosure, outside investors still cannot tell whether the current war chest funds two years of disciplined execution or a much shorter runway if deployments expand quickly. The cap table breadth suggests Bedrock can likely raise again, but future financing leverage will depend on whether current capital converts
    into repeatable commercial evidence.'
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI029
  - CI030
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: public-gaps-and-underwriting-limits
  title: Public Gaps and Underwriting Limits
  body: 'The core limitation of this chapter is that Bedrock has disclosed funding far more clearly than operating performance. Public sources do not provide revenue, ARR, margin, customer count, company-wide headcount, or cash burn. As a result, there is no honest way to apply a conventional revenue-multiple or gross-margin-adjusted framework today. The most useful public underwriting frame is therefore simpler: does the company have enough capital to pursue its roadmap, and is field evidence accumulating quickly enough to justify the next valuation step? That is a weaker basis than investors would ideally want, but it is still informative for a private company at this stage. It forces later valuation work to stay scenario-based rather than precision-based. Bedrock may become a highly scalable autonomy platform, but public evidence alone cannot yet distinguish that outcome from a very well-funded pilot program. The missing metrics are not footnotes; they are the main diligence work remaining.
    That uncertainty should be priced directly into recommendation confidence.'
