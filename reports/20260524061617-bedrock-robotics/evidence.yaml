    severity: minor
    topic: competitive-risk-register
    missingEvidence: A fuller list of private startups and machine-control vendors active in adjacent earthmoving autonomy.
    whyItMatters: The public market is fragmented and likely more crowded than the named set visible in accessible sources.
    diligencePath: Expand the competitive census using customer interviews, trade-show notes, and dealer-channel intelligence.
