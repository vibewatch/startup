evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, burn, and company-wide headcount disclosures.
    whyItMatters: >-
      Without audited operating metrics, investors cannot test whether the valuation is supported by commercial traction
      or capital efficiency.
    diligencePath: Request board materials, monthly financials, and an investor update covering revenue, burn, backlog, and staffing.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO020
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: Current board composition, board observer rights, and investor control provisions.
    whyItMatters: >-
      Governance rights determine how much control strategic investors or growth funds hold over fundraising, exits, and
      operating priorities.
    diligencePath: Request the latest board list, voting agreements, and lead-investor rights summary from company counsel.
    relatedQuestionRefs:
      - QO018
      - QO019
      - QO022
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: Signed contract counts, expansion cohorts, and paid deployment conversion rates from pilots to production.
    whyItMatters: >-
      The company is already valued as a unicorn, so repeatability of go-live economics matters more than anecdotal
      pilot enthusiasm.
    diligencePath: Obtain customer cohort data by site, contract type, deployment maturity, and renewal or expansion status.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: leadership-depth
    missingEvidence: A fully current executive roster beyond the handful of leaders named in launch and funding materials.
    whyItMatters: Autonomy companies often add safety, field operations, and commercial executives quickly between financing rounds.
    diligencePath: Review the current org chart and key hire log since the February 2026 financing.
    relatedQuestionRefs:
      - QO011
      - QO013
      - QO014
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: tam-isolation
    missingEvidence: A clean public source isolating autonomous earthmoving retrofit spend as a standalone market.
    whyItMatters: >-
      Without a discrete market line, TAM can be overstated by blending machine sales, telematics, and robotics
      categories.
    diligencePath: >-
      Interview buyers and channel partners to estimate real budget pools for autonomy upgrades versus other jobsite
      technology.
    relatedQuestionRefs:
      - QM010
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: Actual autonomy budget owners, deal sizes, and payback thresholds at contractor customers.
    whyItMatters: Market pain does not automatically translate into funded budgets or repeatable buying programs.
    diligencePath: Request a pipeline by segment showing buyer title, budget source, project type, and target payback period.
    relatedQuestionRefs:
      - QM011
      - QM014
      - QM015
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: growth-drivers-constraints
    missingEvidence: >-
      A fuller quantified map of adoption blockers such as insurance, union rules, site connectivity, and customer
      change management.
    whyItMatters: >-
      The driver/constraint table is intentionally partial because public sources emphasize labor and safety more than
      budget mechanics.
    diligencePath: Expand diligence with broker, insurer, and union interviews plus procurement-policy review at named contractors.
    relatedQuestionRefs:
      - QM019
      - QM020
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: Actual Bedrock pricing, deployment fees, and support terms versus rival autonomy offerings.
    whyItMatters: Without commercial terms, feature comparison alone cannot determine which vendor has the strongest ROI case.
    diligencePath: Collect customer proposals or pilot statements of work from Bedrock and at least two rival solutions.
    relatedQuestionRefs:
      - QP011
      - QP012
      - QP022
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: oem-response
    missingEvidence: >-
      A direct statement from OEMs about whether they plan to interoperate with retrofit autonomy vendors or compete
      head-on.
    whyItMatters: OEM openness or hostility could materially change Bedrock’s channel strategy and installation economics.
    diligencePath: Interview Cat, Deere, Komatsu, and Volvo channel partners on retrofit policy and warranty boundaries.
    relatedQuestionRefs:
      - QP008
