company:
  name: Bedrock Robotics
chapter:
  number: 6
  title: Customers
  summary: 'Bedrock Robotics has credible early customer proof with named contractors, public workflow quotes, and measurable deployment output, especially through Sundt and other site-prep partners. Its clearest customer wedge is among general contractors and earthmoving specialists working on large repetitive projects where labor scarcity and schedule compression matter. The unresolved question is durability: public evidence does not yet show retention, repeat revenue, or a broad installed base beyond design-partner style deployments.'
sections:
- id: customer-segments
  title: Who the Customer Is
  body: 'Bedrock’s public customer story starts with contractors, not with developers, municipalities, or equipment OEMs. That makes sense because the company is solving a workflow problem on the jobsite: who owns the machine, who struggles to staff it, and who gets rewarded if the task finishes faster. General contractors and earthmoving specialists are therefore the cleanest first segments. The named partner list supports that view by centering Sundt, Zachry, Champion Site Prep, and Capitol Aggregates. Rental companies are not proven customers yet, but they matter strategically because a retrofit product can travel across mixed fleets more easily than an OEM-locked system. Large EPC and mega-project builders also matter because they operate the kinds of capital-intensive sites where schedule pressure, labor scarcity, and repetitive site work can create the highest autonomy ROI. Those segments give Bedrock a rational customer-ordering strategy. It also suggests enterprise sales discipline
    will matter early.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU030
  - CU031
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-evidence
  title: Adoption Evidence and Named Customer Proof
  body: The customer evidence is stronger than a typical early startup, but it is still different from a mature enterprise-software customer ledger. Bedrock has named partners, public workflow quotes, and operating metrics from a real Phoenix site. The 65,000-cubic-yard figure matters because it converts customer proof from abstract interest into measured activity. At the same time, the company has not published revenue per customer, deployment counts by account, or any standardized conversion funnel. That means the correct interpretation is “credible and improving proof,” not “fully de-risked adoption.” The quality of the reference accounts does help. Sundt and Austin Bridge carry real weight in heavy civil and site work, while Champion demonstrates specialist excavation demand. Customer proof today is operational and testimonial. Economic proof is the missing layer. That distinction should temper any easy traction narrative. Investors still need to separate reference quality from revenue
    quality.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU027
  - CU028
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: retention-and-durability
  title: Retention, Durability, and Expansion Logic
  body: Retention is where public evidence runs out quickly. No disclosed source provides renewal rates, NRR, churn, or account-level expansion patterns. The best proxy today is whether reference partners continue to deepen engagement and whether Bedrock can add new contractors without losing the operational quality of earlier deployments. That is useful, but it is not a substitute for cohort data. Construction technology can win a strong first pilot and still struggle to become a repeat operating budget item if training burden, support load, or workflow disruption stays high. Bedrock’s promise is that it can help crews tackle repetitive earthmoving while preserving human supervision where needed. If that promise holds, expansion should be possible. If not, customer relationships may remain shallow and project-specific. For now, durability remains more of a diligence question than a public fact. Investors should treat retention as unresolved, not implied. Repeatability is the commercial
    threshold still missing publicly.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU029
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-and-channel-risk
  title: Concentration and Channel Risk
  body: 'Because the named public account set is still small, concentration risk is almost certainly meaningful today. That is not unusual for a company this young, but it matters because a handful of design-partner relationships can shape roadmap, reference quality, and near-term revenue. Bedrock’s best chance to reduce that risk is to turn strong reference accounts into a flywheel that opens adjacent contractors and, eventually, channel partners such as rental companies. End markets like data centers and domestic manufacturing are especially attractive because they combine schedule urgency with large site-prep scopes, but those same large projects often come with demanding procurement processes. The customer chapter therefore ends in the same place as the financial one: Bedrock has enough proof to justify continued interest, but not enough public conversion data to assume broad, durable customer adoption yet. Channel leverage is the key upside to watch from here. Concentration and expansion
    must be evaluated together, not separately. That framing matters for underwriting discipline.'
