  figureRefs:
  - FV002
  - FV003
- id: comparable-frame
  title: Comparable Frame and Its Limits
  body: Bedrock does not have a neat public comparable set. Built Robotics is useful because it shows what construction automation can look like when a startup focuses tightly on one workflow. Caterpillar, Komatsu, Hexagon, and Trimble are useful because they show how much channel power and workflow control incumbents can bring. Off-road autonomy platforms show that investor appetite for industrial autonomy exists beyond construction. But none of these is a clean multiple comp. Their products, channels, and customer economics differ too much. That is why this chapter treats comparables as archetypes instead of pretending a spreadsheet of public multiples can settle the argument. Bedrock should be valued against what it might become—a construction autonomy layer with real workflow proof—while still recognizing that the business may never achieve the scale, distribution, or profitability investors are implicitly hoping for today. Comparable humility is part of sound underwriting. Investors
    should expect wide error bars here.
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
  - CV023
  tableRefs:
  - TV004
- id: triggers-and-final-asks
  title: Thesis-Break Triggers and Final Diligence Asks
  body: 'The final investment judgment should turn on a small number of decisive facts. If Bedrock can show safe operator-less progress, repeat customer expansion, and improving deployment economics, the current valuation can still make sense. If instead safety issues emerge, customers stall at pilot stage, or OEM alternatives close the gap, investors should assume the mark is too rich. The discipline here is straightforward: define the stop triggers before the next round of storytelling arrives. That is why the final diligence asks are practical rather than academic. Investors need revenue cohorts, safety and insurance material, roadmap gates, concentration data, and a more grounded comparable framework. Without those items, confidence should remain medium at best. With them, Bedrock could move from an intriguing autonomy bet to a fundable conviction case—or to a clearer pass. That is the real decision tree investors face. Milestones should drive pricing more than narrative alone for now
    in practice always.'
