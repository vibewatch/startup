company:
  name: Bedrock Robotics
chapter:
  number: 8
  title: Valuation
  summary: 'Bedrock Robotics looks strategically compelling but financially under-disclosed. The best-supported judgment from public evidence is that the company merits continued diligence, not dismissal, yet its $1.75 billion valuation already prices in substantial future execution. Recommendation: research-more, with medium confidence and a stretched valuation stance until commercialization data improves.'
sections:
- id: recommendation-logic
  title: Recommendation Logic
  body: 'Bedrock deserves a serious seat on an investor watchlist because the company is attacking a large and painful market problem with a credible technical team and increasingly real field proof. That said, the public record is not yet strong enough for a high-conviction bullish recommendation. The reason is simple: Bedrock’s valuation already reflects category-leader ambition, but public economics still lag public storytelling. Investors can clearly see the funding, the partner roster, and the Phoenix deployment. They cannot clearly see revenue quality, margin structure, renewal behavior, or customer-conversion depth. That combination argues for a measured recommendation. There is enough evidence to stay engaged, but not enough to underwrite a hard “buy” from public information alone. The correct posture is conviction in the problem, curiosity about the product, and discipline about the missing numbers. Recommendation discipline matters more than headline excitement here. Price already
    embeds a lot of optimism.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV035
  tableRefs:
  - TV001
  - TV002
