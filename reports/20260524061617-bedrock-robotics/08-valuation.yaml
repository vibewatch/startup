  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation-underwrite
    missingEvidence: Revenue, margin, customer-conversion, and retention metrics sufficient to support a conventional valuation framework.
    whyItMatters: Without operating metrics, investors cannot tell whether the current valuation is visionary but justified or simply ahead of evidence.
    diligencePath: Request cohort revenue, gross-margin bridge, live-site count, and renewal data before making a hard valuation call.
    relatedQuestionRefs:
    - QV004
    - QV006
    - QV020
    - QV022
    - QV024
  - type: private-evidence-only
    severity: material
    topic: scenario-validation
    missingEvidence: A milestone-based roadmap tying operator-less deployments, customer expansion, and software leverage to future financing needs.
    whyItMatters: The entire bull/base/bear framework depends on whether commercialization milestones arrive on time and on budget.
    diligencePath: Obtain the internal roadmap and link each major milestone to customer evidence, safety sign-off, and capital use.
