      - number: '4.4'
        title: Public Gaps and Underwriting Limits
        blocks:
          - type: paragraph
            body: >-
              The core limitation of this chapter is that Bedrock has disclosed funding far more clearly than operating
              performance. Public sources do not provide revenue, ARR, margin, customer count, company-wide headcount,
              or cash burn. As a result, there is no honest way to apply a conventional revenue-multiple or
              gross-margin-adjusted framework today. The most useful public underwriting frame is therefore simpler:
              does the company have enough capital to pursue its roadmap, and is field evidence accumulating quickly
              enough to justify the next valuation step? That is a weaker basis than investors would ideally want, but
              it is still informative for a private company at this stage. It forces later valuation work to stay
              scenario-based rather than precision-based. Bedrock may become a highly scalable autonomy platform, but
              public evidence alone cannot yet distinguish that outcome from a very well-funded pilot program. The
              missing metrics are not footnotes; they are the main diligence work remaining. That uncertainty should be
              priced directly into recommendation confidence.
