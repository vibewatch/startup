      - number: '5.4'
        title: Trust, Safety, and Product Maturity
        blocks:
          - type: paragraph
            body: >-
              Bedrock’s product story is strongest where public proof and maturity line up: supervised excavation
              autonomy with real contractor partners. That is enough to support technical credibility, but it is not the
              same as broad commercial maturity. Safety remains central, and the company’s own language around work-zone
              awareness and fewer surprises implicitly acknowledges that autonomy buyers will judge the product first on
              risk. The presence of supervised deployments suggests Bedrock understands this and is using human
              oversight as a maturity and trust bridge. External safety context from OSHA and CDC reinforces why that is
              sensible. The real maturity test lies ahead: can Bedrock move from supervised success to operator-less,
              lower-touch commercial deployments without introducing enough friction or risk to scare customers away?
              The product appears promising and directionally well designed, but it is still on the steep part of the
              autonomy maturation curve. That makes validation velocity almost as important as raw technical ambition.
