      - number: '4.3'
        title: Capital Adequacy and Runway Logic
        blocks:
          - type: paragraph
            body: >-
              What Bedrock does have publicly is capital. The company paired an $80 million launch financing in July
              2025 with a $270 million Series B only seven months later, bringing disclosed total funding to more than
              $350 million. That gives it a much stronger cash cushion than most early autonomy startups. It also tells
              investors something important: Bedrock is being funded like a capital-intensive scale-up, not like a
              modestly financed software experiment. That is sensible for a business that needs hardware, safety
              validation, customer deployment teams, and potentially inventory. The unresolved question is adequacy, not
              absolute dollars. Without burn, headcount, or cash-balance disclosure, outside investors still cannot tell
              whether the current war chest funds two years of disciplined execution or a much shorter runway if
              deployments expand quickly. The cap table breadth suggests Bedrock can likely raise again, but future
              financing leverage will depend on whether current capital converts into repeatable commercial evidence.
            claimRefs:
