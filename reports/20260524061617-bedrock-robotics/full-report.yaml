  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the Customer Is
        blocks:
          - type: paragraph
            body: >-
              Bedrock’s public customer story starts with contractors, not with developers, municipalities, or equipment
              OEMs. That makes sense because the company is solving a workflow problem on the jobsite: who owns the
              machine, who struggles to staff it, and who gets rewarded if the task finishes faster. General contractors
              and earthmoving specialists are therefore the cleanest first segments. The named partner list supports
              that view by centering Sundt, Zachry, Champion Site Prep, and Capitol Aggregates. Rental companies are not
              proven customers yet, but they matter strategically because a retrofit product can travel across mixed
              fleets more easily than an OEM-locked system. Large EPC and mega-project builders also matter because they
              operate the kinds of capital-intensive sites where schedule pressure, labor scarcity, and repetitive site
              work can create the highest autonomy ROI. Those segments give Bedrock a rational customer-ordering
              strategy. It also suggests enterprise sales discipline will matter early.
            claimRefs:
