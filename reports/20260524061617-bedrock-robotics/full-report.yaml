  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              The right way to frame Bedrock’s market is narrower than “construction robotics” and more specific than
              “construction equipment.” The company is not trying to automate every trade on a jobsite. Its disclosed
              proof points center on repetitive earthmoving, truck loading, mass excavation, and related site-prep tasks
              that can benefit from long machine hours and tight cycle consistency. Bedrock also approaches the market
              as a retrofit layer rather than as an OEM equipment program, which means the relevant budget is not just
              new-machine capex. It sits at the intersection of construction equipment, machine-control software,
              telematics, and autonomy. That matters because the closest substitutes are not only other autonomy
              startups; they include machine-control vendors, telematics platforms, and incumbent OEM autonomy programs
              that can attack the same buyer pain from different starting points. The market boundary therefore has to
              be defined by the workflow and buyer problem first, not by the broadest published TAM category.
