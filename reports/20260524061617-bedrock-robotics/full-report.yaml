      - number: '8.2'
        title: Bull / Base / Bear Scenario Framing
        blocks:
          - type: paragraph
            body: >-
              This chapter uses scenario analysis because point-estimate valuation work would imply precision that the
              public evidence does not support. In the bull case, Bedrock graduates from supervised excavation to
              repeatable operator-less deployments and begins to earn something closer to platform economics from
              multi-machine orchestration. In the base case, it becomes a valuable but still operationally heavy
              autonomy specialist with continued investor support. In the bear case, customers keep liking the demos
              without converting into durable, scalable programs, leaving the current valuation ahead of proof. The
              important thing is not the exact number attached to each scenario. It is the set of milestones that
              separates them: safety validation, deployment conversion, and software leverage. Those are the variables
              investors should watch because they drive both valuation and eventual return potential more than any
              single comparable multiple does today. Scenario discipline protects against false precision. It also
              clarifies what to monitor quarterly.
            claimRefs:
