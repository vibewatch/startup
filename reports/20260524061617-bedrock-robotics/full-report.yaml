      - number: '8.3'
        title: Comparable Frame and Its Limits
        blocks:
          - type: paragraph
            body: >-
              Bedrock does not have a neat public comparable set. Built Robotics is useful because it shows what
              construction automation can look like when a startup focuses tightly on one workflow. Caterpillar,
              Komatsu, Hexagon, and Trimble are useful because they show how much channel power and workflow control
              incumbents can bring. Off-road autonomy platforms show that investor appetite for industrial autonomy
              exists beyond construction. But none of these is a clean multiple comp. Their products, channels, and
              customer economics differ too much. That is why this chapter treats comparables as archetypes instead of
              pretending a spreadsheet of public multiples can settle the argument. Bedrock should be valued against
              what it might become—a construction autonomy layer with real workflow proof—while still recognizing that
              the business may never achieve the scale, distribution, or profitability investors are implicitly hoping
              for today. Comparable humility is part of sound underwriting. Investors should expect wide error bars
              here.
            claimRefs:
