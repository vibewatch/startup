      - number: '8.4'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The final investment judgment should turn on a small number of decisive facts. If Bedrock can show safe
              operator-less progress, repeat customer expansion, and improving deployment economics, the current
              valuation can still make sense. If instead safety issues emerge, customers stall at pilot stage, or OEM
              alternatives close the gap, investors should assume the mark is too rich. The discipline here is
              straightforward: define the stop triggers before the next round of storytelling arrives. That is why the
              final diligence asks are practical rather than academic. Investors need revenue cohorts, safety and
              insurance material, roadmap gates, concentration data, and a more grounded comparable framework. Without
              those items, confidence should remain medium at best. With them, Bedrock could move from an intriguing
              autonomy bet to a fundable conviction case—or to a clearer pass. That is the real decision tree investors
              face. Milestones should drive pricing more than narrative alone for now in practice always.
