      - number: '1.5'
        title: Adverse Factors and Open Questions
        blocks:
          - type: paragraph
            body: >-
              Despite the unusually strong launch narrative, Bedrock remains a very young private company. Public
              evidence is rich on fundraising and increasingly good on partner validation, but still thin on the
              variables that matter most for underwriting a business rather than a concept: paid contract mix, margin
              structure, fleet utilization economics, company-wide headcount, and board governance. The company’s
              flagship proof points also remain supervised rather than fully unattended deployments, so the leap to
              operator-less commercial work is still forward-looking. In parallel, Bedrock operates in a sector where
              regulators and safety agencies document persistent construction hazards, where contractors report acute
              labor shortages, and where autonomous systems must work around people, dust, terrain change, and narrow
              work zones. That combination means the company overview can support a strong strategic identity and
              funding history, but it cannot yet close the case on commercialization durability. The unresolved
              questions are not cosmetic; they are central to valuation, risk, and recommendation.
