      - number: '1.4'
        title: Deployments, Partner Expansion, and Public Milestones
        blocks:
          - type: paragraph
            body: >-
              The most important non-financing proof point is Bedrock’s supervised mass-excavation work with Sundt
              Construction. Equipment World and ENR report that the company’s systems were installed on excavators
              across the 20- to 80-ton range at a 130-acre Phoenix manufacturing site, where the machines had already
              moved more than 65,000 cubic yards of earth. Those are still supervised operations, but they move the
              discussion beyond concept videos into production-adjacent jobsite work. Public sources also show the
              partner base expanding over time: launch materials named Sundt, Zachry, Champion Site Prep, and Capitol
              Aggregates, while later field reporting added Austin Bridge & Road, Maverick Constructors, and Haydon.
              This cadence—launch, deployment metrics, broader partner network, then large financing—gives later
              diligence chapters a coherent sequence of record. It also clarifies the gating milestone ahead: turning
              supervised deployments and partner enthusiasm into repeatable operator-less commercial operations in 2026
              and beyond.
