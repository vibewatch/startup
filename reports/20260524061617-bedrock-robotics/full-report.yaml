      - number: '2.2'
        title: Sizing the Market with Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No accessible source gives an authoritative standalone TAM for autonomous earthmoving retrofits, so a
              single headline figure would be misleading. The best available public evidence instead provides a ladder
              of adjacent estimates. At the broadest level, construction equipment is a very large global market
              measured in the hundreds of billions of dollars. Narrower categories such as smart construction equipment
              and construction robots are much smaller but still large enough to support well-funded entrants. What
              matters for Bedrock is that the company only needs a small share of a subset to build a meaningful
              business if it can win the highest-value repetitive workflows. The spread between Fortune, Global Market
              Insights, Future Market Insights, and Mordor Intelligence should be treated as a warning against
              overprecision rather than as a problem that invalidates the market thesis. The right conclusion is that
              the underlying equipment base is huge, the autonomy wedge is real, and the exact spend pool still needs
              bottoms-up diligence.
