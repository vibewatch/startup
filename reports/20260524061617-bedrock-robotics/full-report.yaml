chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics positions itself as an autonomy company for heavy construction equipment, not as a new
              equipment manufacturer. The official launch letter says the company was founded in 2024 by a team that
              helped build autonomous driving systems at Waymo and then asked where the same machine-learning and safety
              discipline could matter most in the physical economy. Their answer was construction: an industry under
              pressure to deliver housing, factories, energy infrastructure, and data centers with too few skilled
              operators. Bedrock’s core choice is to retrofit existing fleets with sensors, compute, and software,
              allowing contractors to upgrade machines they already own rather than wait for bespoke OEM platforms. That
              matters strategically because it shortens adoption cycles, broadens the addressable fleet, and keeps
              Bedrock aligned with contractors’ installed base. It also means the business likely scales through
              deployment services, autonomy software, and operational support rather than through selling a wholly new
              machine line.
