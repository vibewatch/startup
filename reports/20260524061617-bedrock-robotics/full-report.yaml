      - number: '7.2'
        title: Operational and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Bedrock’s operational risk comes from the fact that its system must work on temporary, messy, changing
              sites rather than in a controlled factory. Dust, terrain variation, moving trucks, and human crews all
              increase the burden on perception, planning, and field operations. Public proof is encouraging, but it is
              still supervised and therefore not the same as a fully mature product. The dependency picture compounds
              this. Bedrock needs contractor partners for learning and proof, field teams for deployment quality, and
              ongoing compatibility with machines it does not manufacture. Capital is another dependency because a
              full-stack autonomy company can spend heavily long before commercial economics are obvious. This does not
              make the business untenable, but it does mean the path to scale is less about pure software distribution
              and more about disciplined system execution across several external constraints at once. Operational
              excellence is a risk control, not just a cost center.
