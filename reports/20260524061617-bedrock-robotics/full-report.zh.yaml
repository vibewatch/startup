              - CR019
              - CR020
      - number: '7.4'
        title: 缓释措施与停止条件
        blocks:
          - type: paragraph
            body: >-
              Bedrock
              确实有可见缓释措施。有人监督部署在产品成熟时保留一道人类安全层。可逆改装降低买方焦虑，因为机器可以退回手动操作。伙伴共研确保产品是在真实工作流上训练，而不是只靠合成演示。这些都是有意义的正面因素。但它们不是无限保护。Bedrock
              最终必须证明，有人监督的成功可以转化为更安全、低接触且经济上可重复的运营模式。严重事故模式、无法把合作伙伴转成耐久项目，或 OEM
              快速追赶，都将成为投资逻辑的真实停止条件。正确的投资人姿态不是因为风险高就否定公司，也不是因为痛点真实就无视风险。正确姿态，是要求证据证明 Bedrock
              的学习曲线跑赢风险曲线。这是下一次刷新时的核心风险测试，也是最清晰的董事会层面监控议程。
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR031
              - CR034
              - CR035
