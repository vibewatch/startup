      - number: '3.3'
        title: 包装、商业形态与购买摩擦
        blocks:
          - type: paragraph
            body: >-
              定价是竞争格局中最不透明的部分之一。Bedrock
              没有发布标价，说明当前商业动作仍围绕试点、工地和客户特定部署范围定制。这并不代表业务弱，只是意味着尽调暂时无法拿一张干净的价格表，同竞争对手做同口径价格比较。Built Robotics
              的太阳能设备包装看起来更产品化；Caterpillar 则能把自主能力同机器销售和服务支持打包。Hexagon 可以用软件和工作流 ROI
              竞争，自主平台玩家有时也能在不拥有车辆的情况下给系统层定价。投资人应看到：现阶段部署实证和买方信任，比名义标价更有信息量。商业条款可见之前，这个品类更应该按安装摩擦、现场支持和重复使用实证来判断，而不是只看标价。
