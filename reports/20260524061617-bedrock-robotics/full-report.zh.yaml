chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics 把自己定位成重型工程设备自主公司，而不是新的设备制造商。官方发布信称，公司由一支曾在 Waymo 搭建自动驾驶系统的团队于 2024
              年创立；他们随后追问，同样的机器学习和安全纪律在实体经济哪里最有价值。答案是建筑业：这个行业要交付住房、工厂、能源基础设施和数据中心，却缺少足够熟练的操作员。Bedrock
              的核心选择，是用传感器、计算和软件改装现有机队，让承包商升级手里的机器，而不是等待定制 OEM 平台。战略上这很关键：采用周期更短，可覆盖机队更广，也让 Bedrock
              贴着承包商既有资产走。也就是说，公司的规模化大概率靠部署服务、自主软件和运营支持，而不是销售一整条全新的机器产品线。
