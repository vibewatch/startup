      - number: '6.3'
        title: 留存、耐久性与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              留存是公开证据很快耗尽的地方。没有披露来源提供续约率、NRR、流失率或账户级扩张模式。今天最好的替代指标，是参考伙伴是否持续加深参与，以及 Bedrock
              能否增加新承包商而不牺牲早期部署的运营质量。这有用，但不能替代队列数据。建筑科技可能赢得强劲首个试点，却仍难以成为可重复运营预算项目，特别是当培训负担、支持压力或工作流扰动居高不下时。Bedrock
              的承诺是，在必要时保留人类监督，同时帮助施工队处理重复土方。如果这个承诺成立，扩张应当可行；如果不成立，客户关系可能停留在浅层和项目制。眼下，耐久性更像尽调问题，而不是公开事实。投资人应把留存视为未解，而不是默认成立。可重复性仍是公开层面缺失的商业门槛。
            claimRefs:
              - CU016
              - CU017
              - CU018
              - CU019
              - CU020
              - CU029
              - CU034
