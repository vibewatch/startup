  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              给 Bedrock
              划市场，正确方式比“建筑机器人”更窄，也比“工程设备”更具体。公司并不想自动化工地上的每一种工种。已披露的实证集中在重复性土方、卡车装载、大规模挖掘和相关场地准备任务；这些工作能从长时间机器运转和稳定循环节奏中受益。Bedrock
              进入市场时也把自己作为改装层，而不是 OEM
              设备项目，因此相关预算不只是新机资本开支。它位于工程设备、机器控制软件、远程信息处理和自主技术的交汇处。关键在于，最接近的替代品不只有其他自主初创公司，还包括机器控制供应商、远程信息处理平台和现有 OEM
              自主项目；这些玩家能从不同起点切入同一类买方痛点。因此，市场边界必须先按工作流和买方问题来定义，而不是按最宽的已发布 TAM 类别来套。
