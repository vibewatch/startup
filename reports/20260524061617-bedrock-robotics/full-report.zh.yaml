      - number: '6.4'
        title: 集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              由于已公开点名的账户集合仍然很小，今天的集中度风险几乎肯定有意义。这对一家如此年轻的公司并不罕见，但很关键，因为少数设计伙伴关系可以塑造路线图、参考质量和近期收入。Bedrock
              降低风险的最佳机会，是把强参考账户转成飞轮，打开相邻承包商，并最终打开租赁公司等渠道伙伴。数据中心和本土制造等终端市场尤其有吸引力，因为它们把工期紧迫性同大规模场地准备范围结合在一起；但同样的大项目往往伴随严格采购流程。因此，客户章节同财务章节落在同一个位置：Bedrock
              有足够实证支撑持续关注，但公开转化数据还不足以假设广泛、耐久的客户采用。渠道杠杆是接下来最值得盯的上行点。集中度和扩张必须放在一起评估，而不是分开看。这个框架对承销纪律很重要。
            claimRefs:
              - CU021
              - CU022
              - CU023
              - CU024
              - CU025
              - CU032
              - CU033
              - CU035
