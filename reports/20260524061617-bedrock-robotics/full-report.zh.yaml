  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议逻辑
        blocks:
          - type: paragraph
            body: >-
              Bedrock 值得认真放进投资人观察名单，因为公司正在用可信技术团队和越来越真实的现场实证，攻打一类巨大而痛的市场问题。即便如此，公开记录还不足以支撑高确信度看多建议。原因很简单：Bedrock
              的估值已经反映了品类领导者野心，但公开经济性仍落后于公开叙事。投资人可以清楚看到融资、合作伙伴名单和 Phoenix
              部署；却看不清收入质量、利润率结构、续约行为或客户转化深度。这个组合支持的是克制建议。证据足以保持跟进，但仅靠公开信息，还不足以承销一个坚决的“买入”。正确姿态是相信问题、对产品保持好奇、并对缺失数字保持纪律。这里，建议纪律比头条兴奋更重要。价格已经嵌入大量乐观预期。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV035
