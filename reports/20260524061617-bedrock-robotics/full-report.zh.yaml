              - CR035
      - number: '7.2'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Bedrock
              的运营风险来自一个事实：系统必须在临时、混乱、不断变化的工地上运行，而不是在受控工厂里运行。粉尘、地形变化、移动卡车和人工作业队都会提高感知、规划和现场运营负担。公开实证令人鼓舞，但它仍有人监督，因此不能等同于完全成熟的产品。依赖图景进一步放大了这一点。Bedrock
              需要承包商伙伴来学习和证明，需要现场团队来保证部署质量，还需要持续兼容自己并不制造的机器。资本也是依赖项，因为全栈自主公司可能在商业经济性清晰之前就大量花钱。这不代表业务不可行，但说明规模化路径不靠纯软件分发，而靠在多个外部约束下有纪律地执行系统。运营卓越不仅是成本中心，也是风险控制。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
