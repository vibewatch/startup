  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              任何把自主系统装到重型机械上的公司，都会继承很高的举证负担。建筑业本来就是危险行业，OSHA、CDC 和 BLS 材料明确显示，即使不加入自主技术，危险也长期存在。这意味着 Bedrock
              不能只靠宣称系统更安全就获得信用；它必须用监管方、客户和保险方都能信任的方式证明安全。Frontiers 和 ILO 的外部研究进一步强化了这一点：机器人可以同时减少某些危险，也引入新的危险。Bedrock
              眼前的法律问题，不是建筑业是否需要更好的安全工具——它显然需要。问题在于，Bedrock
              从有人监督部署迈向低接触作业时，能否建立可重复的责任和合规框架。公开层面，这仍未解决。法律清晰度可能会长期落后于技术曲线。法院和保险方在实践中也可能适应缓慢。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR032
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
