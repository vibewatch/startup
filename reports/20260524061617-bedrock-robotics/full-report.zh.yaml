              对融资披露远比对运营表现披露清楚。公开来源没有收入、ARR、利润率、客户数、全公司员工数或烧钱速度。因此，现在没有诚实办法套用传统收入倍数或毛利率调整框架。最有用的公开承销框架反而更简单：公司是否有足够资本推进路线图，现场证据是否积累得足够快、足以支撑下一步估值？这比投资人理想中想要的基础更弱，但对一家处于这个阶段的私营公司仍有信息量。它迫使后续估值工作保持情景化，而不是假装精确。Bedrock
              可能成为高度可扩展的自主平台，但仅靠公开证据，还无法把这个结果同一个资金充裕的试点项目清楚区分开。缺失指标不是脚注；它们就是剩下的主要尽调工作。这个不确定性应当直接反映到建议置信度中。
