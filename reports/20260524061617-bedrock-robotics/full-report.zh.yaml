              客户证据强于典型早期初创公司，但仍不同于成熟企业软件客户账本。Bedrock 有已点名合作伙伴、公开工作流引述，也有真实 Phoenix 工地的运营指标。65,000-cubic-yard
              这个数字重要，因为它把客户实证从抽象兴趣变成可计量活动。与此同时，公司没有公布每个客户收入、按账户拆分的部署数量，也没有任何标准化转化漏斗。因此，正确解读是“可信且正在改善的实证”，而不是“采用已完全去风险”。参考账户质量确实有帮助。Sundt
