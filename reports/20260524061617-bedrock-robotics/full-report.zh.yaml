            body: >-
              关于 Bedrock
              今天最适合在哪里工作，公开证据高度一致：大型工地上的重复挖掘和卡车装载。这是特性，不是限制。重复工作流正是承包商最强烈感到劳动力短缺的地方，也能让机器通过更长工时、更低疲劳和更可预测循环时间产生可衡量
              ROI。Bedrock
              的合作伙伴和媒体报道还说明，公司很努力地嵌入现有承包商运营，而不是强迫客户改用全新作业模式。安装套件、跑有人监督作业、测进度、再重复。对年轻自主公司来说，这是合理运营路径，因为客户可以在验证性能时让人类留在闭环附近。下一个问题是，这套流程会自然扩展到更广的工地自主，还是只在窄口径挖掘重任务上最有力。这个转变将决定
              Bedrock 是工作流解决方案，还是更广的平台。
