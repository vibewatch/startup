      - number: '1.3'
        title: 融资历史、估值与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Bedrock 的对外融资节奏异常快。公司在 2025 年 7 月公开发布时同步披露了 $80M 种子轮和 A 轮融资；不到一年后，又完成 $270M B 轮，独立报道给出的估值大约为
              $1.75B。这次跳升很重要，因为它在公开披露收入之前就把 Bedrock 推进独角兽区间，投资人押注的是未来机队级采用，而不是历史损益表。股东名单混合了传统成长资本和具备战略价值的支持者。CapitalG 带来
              Alphabet 网络背书；8VC 公开主张美国开发建设需要更快的工具；Tishman Speyer 则把 Bedrock
              接入房地产开发中资本强度最高的客户生态之一。好处是股权结构表同部署规模一致；坏处是，Bedrock 现在背负的风险资本预期，更接近成熟平台公司，而不是早期现场试点初创公司。
