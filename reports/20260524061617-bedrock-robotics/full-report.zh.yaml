  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现模式与收入形态
        blocks:
          - type: paragraph
            body: >-
              Bedrock
              的公开材料读起来不像标准软件公司，因为产品并不是纯靠代码交付。公司在客户工地改装重型设备，这意味着除任何经常性自主软件收费之外，至少还会有安装、校准和部署服务收入。随着时间推移，经济承诺可能转向软件、远程监控和多机编排；如果
              Bedrock 能从有人监督的单机部署推进到协同机队，这一点尤其成立。但现有证据指向一种混合模式：先用偏服务的收入让机器上线，若客户持续把系统用于生产，再形成经常性价值。这个组合在战略上有吸引力，因为它同真实工地
              ROI 绑定；但也意味着公司今天大概率还没有软件式利润率。承销时，重要的不是 Bedrock 到底是“软件”还是“硬件”，而是重复部署能多快把业务推向杠杆更高的经常性收入结构。
