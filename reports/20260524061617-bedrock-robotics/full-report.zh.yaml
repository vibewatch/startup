      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Bedrock 正在形成的护城河，不是一项单一专利或一种硬件形态，而是现场数据、承包商整合和工作流专业度的组合；部署规模扩大后，这些能力可能复利增长。这个方向有前景，但还不稳固。OEM
              仍是最大威胁，因为它们控制机器平台、质保边界和服务渠道；一旦它们决定积极进入同样的重复土方用例，Bedrock
              的改装优势可能收窄。同时，初创公司和软件层竞争者也表明，自主技术栈本身可能随时间变得更可替代。Bedrock
              眼下最好的防守，是证明承包商信任它、系统能以很小扰动适配承包商工作流，并且有人监督作业产生的现场数据能让产品迭代速度快过竞争对手追赶。换句话说，Bedrock
              的护城河由学习速度驱动。它有机会变得耐久，但前提是客户转化和部署重复先于现有巨头补齐差距。这个品类仍然很年轻，执行速度极其重要。
