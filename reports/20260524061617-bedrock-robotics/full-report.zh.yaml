      - number: '2.4'
        title: 增长驱动、约束与数据缺口
        blocks:
          - type: paragraph
            body: >-
              最强的公开需求驱动很直接：劳动力短缺、安全压力，以及项目更快交付带来的经济溢价。AGC 2025 年调查和 ABC 劳动力估计都显示，劳动力市场仍然结构性紧张。CDC 和 OSHA
              材料进一步说明，建筑业风险仍高，即便不计算生产率提升，自动化也有第二层逻辑。但同一证据基础也解释了为什么采用不会自动发生。建筑工地临时、动态且社会关系复杂；买方在承诺自主系统前，往往可以先部署机器控制工具或人员调配替代方案。公开市场数据也仍然令人沮丧地不精确。我们知道宏观市场很大、痛点真实，但尚没有清晰公开数据集能拆出自主预算、试点到生产转化，或让无人操作成为必需品的
              ROI 门槛。后续财务和估值章节必须一直盯住这些问题。
