      - number: '8.3'
        title: 可比框架及其边界
        blocks:
          - type: paragraph
            body: >-
              Bedrock 没有整洁的公开可比公司集合。Built Robotics 有用，因为它展示了初创公司紧盯一个工作流时，建筑自动化可以长成什么样。Caterpillar、Komatsu、Hexagon 和
              Trimble
              有用，因为它们展示现有巨头能带来多大的渠道力量和工作流控制。越野自主平台也说明，投资人对工业自主的兴趣并不局限于建筑业。但这些公司没有一个是干净的倍数可比对象。它们的产品、渠道和客户经济性差异太大。因此，本章把可比公司当作原型，而不是假装一张公开倍数表能解决争论。Bedrock
              应该按它可能成为的样子估值——一个有真实工作流实证的建筑自主层——同时也要承认，公司可能永远达不到投资人今天隐含期待的规模、分发或盈利能力。可比谦逊是健全承销的一部分。投资人应预期这里误差区间很宽。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV004
            claimRefs:
              - CV018
              - CV019
