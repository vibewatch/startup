  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户是谁
        blocks:
          - type: paragraph
            body: >-
              Bedrock 的公开客户故事从承包商开始，而不是开发商、市政机构或设备
              OEM。这说得通，因为公司解决的是工地工作流问题：谁拥有机器，谁难以配齐操作员，任务更快完成后谁受益。因此，总承包商和土方专业承包商是最清晰的第一批细分市场。已点名的合作伙伴名单支持这一判断，核心包括
              Sundt、Zachry、Champion Site Prep 和 Capitol Aggregates。租赁公司还不是已证明客户，但战略上重要，因为改装产品比 OEM 锁定系统更容易跨混合机队流转。大型 EPC
              和超大型项目建设商也重要，因为它们运营资本强度高的工地，工期压力、劳动力稀缺和重复场地作业最可能创造最高自主 ROI。这些细分市场给了 Bedrock 合理的客户排序策略，也说明企业销售纪律很早就会变得重要。
