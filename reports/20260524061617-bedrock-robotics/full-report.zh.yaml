      - number: '8.2'
        title: 乐观 / 基准 / 悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              本章采用情景分析，因为点估值会暗示公开证据并不支持的精确度。乐观情景下，Bedrock
              从有人监督挖掘毕业到可重复无人操作部署，并开始从多机编排中获得更接近平台经济的收益。基准情景下，它成为一家有价值、但运营仍然偏重的自主专业公司，并继续获得投资人支持。悲观情景下，客户持续喜欢演示，却没有转成耐久、可扩展的项目，导致当前估值跑在证据前面。关键不在每个情景对应的精确数字，而在分开这些情景的一组里程碑：安全验证、部署转化和软件杠杆。投资人应盯住这些变量，因为今天它们比任何单一可比倍数更能驱动估值和最终回报潜力。情景纪律能防止虚假精确，也能明确每个季度该监控什么。
            claimRefs:
              - CV013
              - CV014
              - CV015
