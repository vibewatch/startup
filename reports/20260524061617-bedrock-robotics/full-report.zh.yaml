              - CV021
              - CV022
              - CV023
      - number: '8.4'
        title: 投资逻辑失效触发条件与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终投资判断应落在少数决定性事实之上。如果 Bedrock 能展示安全的无人操作进展、重复客户扩张和改善中的部署经济性，当前估值仍可能说得通。反过来，如果出现安全问题、客户停在试点阶段，或 OEM
              替代方案补齐差距，投资人应假设估值过高。这里的纪律很直接：在下一轮叙事到来前，先定义停止触发条件。因此，最终尽调要求是务实的，而不是学术的。投资人需要收入队列、安全和保险材料、路线图闸门、集中度数据，以及更扎实的可比框架。没有这些，置信度最多应保持中等。有了这些，Bedrock
              可能从一个有意思的自主赌注，变成可下注的确信案例——或者变成更清楚的放弃对象。这才是投资人面对的真实决策树。眼下乃至实际执行中，定价都应更多由里程碑驱动，而不是只靠叙事。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
