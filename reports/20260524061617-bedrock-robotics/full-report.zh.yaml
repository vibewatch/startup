  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁在与 Bedrock 竞争，以及为什么
        blocks:
          - type: paragraph
            body: >-
              Bedrock 的竞争集合，比一张做“建筑机器人”的初创公司名单要宽。最接近的类比，是那些解决同一个买方问题的公司：在更少依赖稀缺操作员的情况下，让重型设备产出更安全、更稳定。这形成三个实际类别。第一类是
              Built Robotics 这样的初创类比对象，它同样讲建筑自动化叙事，但更集中在太阳能工作流。第二类是 Caterpillar 这样的 OEM
              现有巨头，它们能把自主能力直接嵌入底层机器，并带来经销商触达、服务和既有信任。第三类是 Hexagon、Pronto、Polymath 等相邻自主或工作流玩家，它们通过软件、数据、运输或平台工具切入市场，而不是
              Bedrock 的承包商共研模式。只有按工作流适配、渠道控制和上线就绪度比较这些类别时，Bedrock 的位置才说得通；把所有玩家压进一个宽泛机器人桶里，反而会失真。
