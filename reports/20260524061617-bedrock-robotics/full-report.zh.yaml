      - number: '1.2'
        title: 创始人、领导梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              公开材料一直把 Boris Sofman 放在公司运营中枢的位置。TechCrunch 以及后续融资报道描述的创始团队，既有 Waymo 自主技术老将，也有来自 Segment 和 Twilio
              的软件平台经验。这样的背景同产品很匹配：Bedrock 同时需要感知、控制、安全、现场运营和云端遥测能力。2026 年 2 月的融资公告还披露了两位面向规模化的招聘——负责评估的 Vincent Gonguet
              和负责人力运营的 John Chu——说明 Bedrock
              开始在创始团队核心之外，把模型质量和组织流程正式化。即便如此，公司没有公开董事会、治理结构，也没有披露投资人财团附带的决策权。关键尽调问题仍然悬而未决：商业路线图有多少由创始人掌控，战略投资人怎样影响部署优先级，Sofman
              之下的领导梯队是否足够支撑多工地现场扩张。
