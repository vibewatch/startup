      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向总承包商和土方分包商，这是第一批可信买方群体。他们承担工期风险、重复挖掘任务和操作员瓶颈，也正是 Bedrock
              在现场部署中反复强调的问题。工业项目建设商和重型土木承包商尤其相关，因为大型制造、能源和基础设施工地会产生大量重复场地准备工作，自主系统可以长时间运行，不必频繁改工作流。租赁公司在战略上很有意思，因为改装模式能适配混合机队，但公开证据还不能证明
              Bedrock
              已通过租赁渠道销售。开发商和业主多数情况下不是直接买方，却制造了经济紧迫感：如果承包商能更快完成数据中心垫层或工厂场地，哪怕业主不直接采购自主系统，承包商也可能获得份额。因此，采用路径很可能先从承包商开始；ROI
              得到证明后，再走向更广的渠道合作。
