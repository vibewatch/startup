      - number: '1.5'
        title: 负面因素与未解问题
        blocks:
          - type: paragraph
            body: >-
              尽管发布叙事异常强，Bedrock
              仍是一家非常年轻的私营公司。公开证据在融资上很丰富，合作伙伴验证也越来越充分，但真正决定能否把概念承销成业务的变量仍然稀缺：付费合同组合、利润率结构、机队利用率经济性、全公司员工数和董事会治理。公司的标志性实证也仍是有人监督，而非完全无人值守部署，所以迈向无人操作商业作业仍是前瞻性命题。与此同时，Bedrock
              所在行业中，监管方和安全机构持续记录建筑业危险；承包商报告严重劳动力短缺；自主系统还必须在人员、粉尘、地形变化和狭窄作业区周围运行。这个组合足以支撑强战略身份和融资历史，却还不能证明商业化耐久性。未解问题不是装饰性细节；它们直接关系到估值、风险和建议。
