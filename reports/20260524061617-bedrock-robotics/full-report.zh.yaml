  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是什么
        blocks:
          - type: paragraph
            body: >-
              最适合把 Bedrock 的产品理解为改装式自主技术栈，而不是一台新的 OEM 机器。公司自己的材料把 Bedrock Operator
              描述为可加装到现有重型设备上的传感器加软件系统。公开部署报道补足了更多细节：LiDAR、GPS、惯性传感器、摄像头和车载计算装在机器上；远程进度可见性则把自主能力同工地运营连接起来。这个组合很关键，因为它告诉投资人产品边界到底在哪里。Bedrock
              卖的是让今天的机队换一种方式运行的方法，而不是一支新机队。因此，产品必须同时解决机器人和部署工程问题。硬件、机器集成和软件都是产品的一部分，这提高了复杂度；但如果 Bedrock
              能让承包商觉得改装是常规动作，也会形成更强切入点。招聘页还显示，公司工程纵深仍在快速扩张。
