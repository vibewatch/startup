      - number: '7.3'
        title: 人员、劳动力与采用风险
        blocks:
          - type: paragraph
            body: >-
              自主技术采用从来不只是技术问题。它会改变工作组织方式，改变人们觉得自己是被威胁还是被赋能，也改变客户在依赖系统前必须投入多少培训和信任。Bedrock
              的合作伙伴引述很聪明：它把产品定位成释放熟练操作员去做更有价值的任务，而不只是替代他们。即便如此，Brookings、St. Louis Fed 和 ILO
              都显示，工人被替代的叙事可能成为真实采用障碍。公司内部也面临典型初创执行风险：公开身份高度绑定少数创始人、快速招聘，以及仍在长成估值所暗示规模的管理梯队。如果变革管理或劳动力接受度落后于产品路线图，即便技术继续改进，客户扩张也会放慢。人的因素可能成为隐藏瓶颈。
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR030
              - CR033
          - type: table
            tableRef: TR004
            claimRefs:
