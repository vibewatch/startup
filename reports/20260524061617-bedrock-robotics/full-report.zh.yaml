            body: >-
              即使公司没有发布技术白皮书，Bedrock 的架构假设也很清楚。创始人相信，Waymo
              发展出的数据驱动自主技术可以迁移到建筑场景；在这里，机器必须实时理解地形、移动资产和工地目标。挑战比直线导航更难，因为工程设备不只是穿过世界，它在工作时会改变世界。这意味着感知、规划和控制都必须跟上动态地形，以及附近作业的人员和卡车。也意味着现场运营会变成技术系统的一部分，因为部署质量、校准和客户信任会影响软件能否发挥作用。Bedrock
              的产品架构和运营架构不可分割。因此，数据、现场支持和承包商共研都不是可选附加项，而是依赖项。产品必须在技术和运营上同时成功。
