      - number: '3.2'
        title: 功能宽度、工作流适配与渠道深度
        blocks:
          - type: paragraph
            body: >-
              Bedrock 在产品层面最强的差异，是 OEM 中立的改装姿态。公开报道显示，它把系统装到现有挖掘机上，并在承包商活跃工地部署，而不是要求客户购买一套全新的机器生态。Caterpillar
              的模式不同：自主层由对机器和服务渠道的完全控制来强化。Hexagon 的模式也不同：工作流数据和工地系统比直接机器改装更重要。Built Robotics
              展示了另一个战略极端：深耕一个可重复的建筑工作流，这能产出更标准化的产品，但也收窄了可覆盖用例。Pronto 和 Polymath 重要，是因为它们证明自主能力可以跨越越野车辆类别迁移，即使没有 Bedrock
              完全相同的工地焦点。因此，Bedrock 的竞争不主要看原始功能数量，而是看产品能多干净地嵌入真实承包商条件下的重复土方工作流。
            claimRefs:
              - CP007
