- id: deployments-and-milestones
  title: Deployments, Partner Expansion, and Public Milestones
  body: 'The most important non-financing proof point is Bedrock’s supervised mass-excavation work with Sundt Construction. Equipment World and ENR report that the company’s systems were installed on excavators across the 20- to 80-ton range at a 130-acre Phoenix manufacturing site, where the machines had already moved more than 65,000 cubic yards of earth. Those are still supervised operations, but they move the discussion beyond concept videos into production-adjacent jobsite work. Public sources also show the partner base expanding over time: launch materials named Sundt, Zachry, Champion Site Prep, and Capitol Aggregates, while later field reporting added Austin Bridge & Road, Maverick Constructors, and Haydon. This cadence—launch, deployment metrics, broader partner network, then large financing—gives later diligence chapters a coherent sequence of record. It also clarifies the gating milestone ahead: turning supervised deployments and partner enthusiasm into repeatable operator-less
    commercial operations in 2026 and beyond.'
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
  - CO031
  - CO034
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: adverse-factors-and-open-questions
  title: Adverse Factors and Open Questions
  body: 'Despite the unusually strong launch narrative, Bedrock remains a very young private company. Public evidence is rich on fundraising and increasingly good on partner validation, but still thin on the variables that matter most for underwriting a business rather than a concept: paid contract mix, margin structure, fleet utilization economics, company-wide headcount, and board governance. The company’s flagship proof points also remain supervised rather than fully unattended deployments, so the leap to operator-less commercial work is still forward-looking. In parallel, Bedrock operates in a sector where regulators and safety agencies document persistent construction hazards, where contractors report acute labor shortages, and where autonomous systems must work around people, dust, terrain change, and narrow work zones. That combination means the company overview can support a strong strategic identity and funding history, but it cannot yet close the case on commercialization durability.
    The unresolved questions are not cosmetic; they are central to valuation, risk, and recommendation.'
  claimRefs:
  - CO031
  - CO033
  - CO034
  - CO035
