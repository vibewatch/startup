- id: funding-and-investor-base
  title: Funding History, Valuation, and Investor Base
  body: Bedrock’s external financing path has been unusually fast. The company paired its July 2025 public launch with disclosure of $80 million in Seed and Series A financing, then returned less than a year later with a $270 million Series B that independent coverage placed at roughly a $1.75 billion valuation. That jump matters because it pushes Bedrock into unicorn territory before public revenue disclosure, meaning investors are underwriting future fleet-scale adoption rather than historical income statements. The roster mixes traditional growth capital and strategically useful backers. CapitalG adds Alphabet-network credibility, 8VC has publicly argued that U.S. development needs faster building tools, and Tishman Speyer connects Bedrock to one of the most capital-intensive customer ecosystems in real estate development. The upside is a cap table aligned with deployment scale. The downside is that Bedrock now carries venture expectations closer to a mature platform company than to an
    early field-pilot startup.
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO022
  - CO023
  - CO024
  - CO035
  tableRefs:
