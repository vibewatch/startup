  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, burn, and company-wide headcount disclosures.
    whyItMatters: Without audited operating metrics, investors cannot test whether the valuation is supported by commercial traction or capital efficiency.
    diligencePath: Request board materials, monthly financials, and an investor update covering revenue, burn, backlog, and staffing.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO020
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: Current board composition, board observer rights, and investor control provisions.
    whyItMatters: Governance rights determine how much control strategic investors or growth funds hold over fundraising, exits, and operating priorities.
    diligencePath: Request the latest board list, voting agreements, and lead-investor rights summary from company counsel.
    relatedQuestionRefs:
    - QO018
    - QO019
    - QO022
    - QO023
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: Signed contract counts, expansion cohorts, and paid deployment conversion rates from pilots to production.
    whyItMatters: The company is already valued as a unicorn, so repeatability of go-live economics matters more than anecdotal pilot enthusiasm.
    diligencePath: Obtain customer cohort data by site, contract type, deployment maturity, and renewal or expansion status.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO004
  - type: stale
    severity: minor
    topic: leadership-depth
    missingEvidence: A fully current executive roster beyond the handful of leaders named in launch and funding materials.
    whyItMatters: Autonomy companies often add safety, field operations, and commercial executives quickly between financing rounds.
    diligencePath: Review the current org chart and key hire log since the February 2026 financing.
