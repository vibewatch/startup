company:
  name: Bedrock Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Bedrock Robotics is a San Francisco autonomy startup founded in 2024 by former Waymo leaders to retrofit existing heavy construction equipment with autonomous capabilities. After launching publicly in July 2025 with $80 million of Seed and Series A funding, it announced a $270 million Series B in February 2026 at roughly a $1.75 billion valuation. Public proof points now include named contractor partners, a 130-acre Phoenix excavation deployment, and more than 65,000 cubic yards of earth moved under supervised autonomy, but core commercial metrics remain private.
sections:
- id: identity-and-mission
  title: Identity, Mission, and Business Model
  body: 'Bedrock Robotics positions itself as an autonomy company for heavy construction equipment, not as a new equipment manufacturer. The official launch letter says the company was founded in 2024 by a team that helped build autonomous driving systems at Waymo and then asked where the same machine-learning and safety discipline could matter most in the physical economy. Their answer was construction: an industry under pressure to deliver housing, factories, energy infrastructure, and data centers with too few skilled operators. Bedrock’s core choice is to retrofit existing fleets with sensors, compute, and software, allowing contractors to upgrade machines they already own rather than wait for bespoke OEM platforms. That matters strategically because it shortens adoption cycles, broadens the addressable fleet, and keeps Bedrock aligned with contractors’ installed base. It also means the business likely scales through deployment services, autonomy software, and operational support rather
    than through selling a wholly new machine line.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO006
  - CO007
