- id: leadership-and-governance
  title: Founders, Leadership Bench, and Governance Signals
  body: 'Public materials consistently center Boris Sofman as the company’s operating linchpin. TechCrunch and later financing coverage describe a founder group that mixes Waymo autonomy veterans with software-platform experience from Segment and Twilio. That background is coherent with the product: Bedrock needs perception, controls, safety, field operations, and cloud telemetry expertise all at once. The February 2026 financing release also disclosed two scale-oriented hires—Vincent Gonguet for evaluation and John Chu for people operations—suggesting Bedrock is starting to formalize model quality and organizational processes beyond the initial founder nucleus. Even so, the company does not publicly disclose its board, governance structure, or the decision rights attached to its investor syndicate. That leaves key diligence questions open: how much of the commercial roadmap is controlled by founders, how strategic investors influence deployment priorities, and whether the leadership bench
    below Sofman is deep enough for multi-site field scaling.'
  claimRefs:
  - CO004
  - CO009
