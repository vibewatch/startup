  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: safety-incidents
    missingEvidence: Incident, disengagement, near-miss, and corrective-action data from Bedrock’s live deployments.
    whyItMatters: Risk cannot be underwritten credibly without objective operational safety evidence from the environments Bedrock is using to train trust.
    diligencePath: Request a deployment safety ledger with incidents, interventions, and postmortem actions by site.
    relatedQuestionRefs:
    - QR002
    - QR006
    - QR007
    - QR023
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: insurance-liability
    missingEvidence: Insurance terms, indemnity structure, and liability allocation between Bedrock, contractors, and machine owners.
    whyItMatters: A scalable autonomy business needs a repeatable liability framework, especially before unattended operations become normal.
    diligencePath: Review customer MSAs, insurance binders, and any broker analysis for autonomous-equipment deployments.
    relatedQuestionRefs:
    - QR005
    - QR013
    - QR022
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: kill-criteria
    missingEvidence: Internal no-go thresholds for safety, conversion, or deployment economics that would cause management to pause rollout.
    whyItMatters: Investors need to know whether management has disciplined stop conditions rather than a growth-at-all-costs posture.
    diligencePath: Ask management for explicit safety and commercialization gates tied to future deployment stages.
