  - FR003
- id: people-and-adoption-risks
  title: People, Workforce, and Adoption Risk
  body: 'Autonomy adoption is never just a technical problem. It changes how work is organized, which people feel threatened or empowered, and how much training and trust a customer has to build before relying on the system. Bedrock’s partner quotes wisely frame the product as freeing skilled operators for more valuable tasks rather than simply replacing them. Even so, Brookings, the St. Louis Fed, and the ILO all show that worker-displacement narratives can become a real adoption barrier. Internally, the company also faces classic startup execution risk: a public identity tied closely to a few founders, fast hiring, and a management bench that is still growing into the scale implied by the valuation. If change management or workforce acceptance lags behind the product roadmap, customer expansion can slow even if the technology continues to improve. Human factors could become the hidden bottleneck.'
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR030
  - CR033
  tableRefs:
  - TR004
- id: mitigations-and-stop-criteria
  title: Mitigations and Stop Criteria
  body: Bedrock does have visible mitigations. Supervised deployment keeps a human safety layer in place while the product matures. Reversible retrofit lowers buyer anxiety because a machine can fall back to manual operation. Partner co-development ensures the product is trained on real workflows rather than synthetic demos. Those are meaningful positives. But they are not infinite protection. Eventually Bedrock has to show that supervised success converts into a safer, lower-touch, economically repeatable operating model. A serious incident pattern, a failure to convert partners into durable programs, or rapid OEM catch-up would each represent real stop conditions for the thesis. The right investor posture is therefore not to dismiss the company because the risks are high, nor to ignore those risks because the pain point is real. The right posture is to demand evidence that Bedrock’s learning curve is outrunning its risk curve. That is the core risk test for the next refresh. It is also
    the clearest board-level monitoring agenda.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR031
  - CR034
  - CR035
