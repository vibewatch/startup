company:
  name: Bedrock Robotics
chapter:
  number: 7
  title: Risks
  summary: 'Bedrock Robotics faces high but understandable risk: it is bringing autonomous systems into one of the most hazardous and operationally variable work environments in the economy. Regulatory, safety, and operational risks are all material, and the company’s best mitigation today is supervised deployment with strong contractor partners rather than broad unattended operation. The thesis remains viable, but only if Bedrock can prove that its learning speed and safety controls stay ahead of customer, insurance, and OEM-related constraints.'
sections:
- id: regulatory-and-legal-risks
  title: Regulatory and Legal Risk
  body: Any company putting autonomous systems onto heavy machinery inherits a high burden of proof. Construction is already a dangerous sector, and OSHA, CDC, and BLS materials make clear that hazards are persistent even before autonomy is added. That means Bedrock does not get credit simply for saying its system is safer. It has to demonstrate that safety in ways that regulators, customers, and insurers can trust. External research from Frontiers and the ILO strengthens the point by showing that robotics can simultaneously reduce certain hazards and introduce new ones. For Bedrock, the immediate legal question is not whether construction needs better safety tools—it clearly does. The question is whether Bedrock can create a repeatable liability and compliance framework as it moves from supervised deployments toward lower-touch operation. That is still unresolved publicly. Legal clarity may lag the technology curve for some time. Courts and insurers may adapt slowly in practice anyway.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR032
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-dependency-risks
  title: Operational and Dependency Risk
  body: Bedrock’s operational risk comes from the fact that its system must work on temporary, messy, changing sites rather than in a controlled factory. Dust, terrain variation, moving trucks, and human crews all increase the burden on perception, planning, and field operations. Public proof is encouraging, but it is still supervised and therefore not the same as a fully mature product. The dependency picture compounds this. Bedrock needs contractor partners for learning and proof, field teams for deployment quality, and ongoing compatibility with machines it does not manufacture. Capital is another dependency because a full-stack autonomy company can spend heavily long before commercial economics are obvious. This does not make the business untenable, but it does mean the path to scale is less about pure software distribution and more about disciplined system execution across several external constraints at once. Operational excellence is a risk control, not just a cost center.
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
