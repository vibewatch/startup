- id: buyers-and-adoption-path
  title: Buyer Segments and Adoption Path
  body: 'The public evidence points to general contractors and earthmoving subcontractors as the first credible buyer groups. They own the schedule risk, the repetitive excavation tasks, and the operator bottlenecks that Bedrock highlights in its field deployments. Industrial project builders and heavy civil contractors are especially relevant because large manufacturing, energy, and infrastructure sites create the kind of repetitive site-prep work where autonomy can run for long hours without constant workflow changes. Rental companies are strategically interesting because a retrofit model is compatible with mixed fleets, but there is no public proof yet that Bedrock sells through rental channels. Developers and owners are not the direct buyer in most cases, yet they create the economic urgency: a contractor that can finish a data-center pad or factory site faster may gain share even if the owner never buys autonomy directly. Adoption will therefore likely proceed through contractors first,
    then through broader channel partnerships if ROI is proven.'
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM029
  - CM030
