company:
  name: Bedrock Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Bedrock Robotics addresses a very large underlying construction-equipment market but only a narrow near-term autonomy wedge within it: repetitive earthmoving and site-prep workflows where labor scarcity, safety pressure, and schedule compression matter most. Public market sources range from hundreds of millions for construction robots to tens of billions for smart construction equipment and more than $180 billion for total equipment, reinforcing that a multi-lens TAM approach is more credible than one headline number. Buyer logic is strongest with general contractors and earthmoving subcontractors, while rental channels and owner influence remain secondary or indirect.'
sections:
- id: market-boundary
  title: Market Boundary and Scope
  body: The right way to frame Bedrock’s market is narrower than “construction robotics” and more specific than “construction equipment.” The company is not trying to automate every trade on a jobsite. Its disclosed proof points center on repetitive earthmoving, truck loading, mass excavation, and related site-prep tasks that can benefit from long machine hours and tight cycle consistency. Bedrock also approaches the market as a retrofit layer rather than as an OEM equipment program, which means the relevant budget is not just new-machine capex. It sits at the intersection of construction equipment, machine-control software, telematics, and autonomy. That matters because the closest substitutes are not only other autonomy startups; they include machine-control vendors, telematics platforms, and incumbent OEM autonomy programs that can attack the same buyer pain from different starting points. The market boundary therefore has to be defined by the workflow and buyer problem first, not by
    the broadest published TAM category.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM032
  tableRefs:
