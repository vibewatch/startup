  - type: missing-source
    severity: material
    topic: Independent primary research on enterprise AI video authoring market size
    missingEvidence: A primary-source analyst report specifically sizing the enterprise AI video authoring segment (not general AI video) with enterprise-only boundaries; all available reports include consumer or broad AI scope
    whyItMatters: The wide range of TAM estimates ($717 M to $10.3 B) makes it difficult to size Synthesia's SAM with confidence; a more precise boundary estimate would materially affect valuation assessments
    diligencePath: Commission bespoke market study or request Gartner/Forrester enterprise authoring tools Market Guide from the company
    relatedQuestionRefs: []
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: Synthesia deal size distribution and average contract value by segment
    missingEvidence: Average contract value, deal size distribution by segment (SMB vs. enterprise vs. Fortune 100), and churn rate by segment
    whyItMatters: Without ACV data it is impossible to verify whether ARR growth is driven by expansion of existing accounts or new logo acquisition — a material distinction for NRR assessment
    diligencePath: Request CRM data and cohort analytics in formal due diligence
