      - number: '2.3'
        title: 买方与细分格局
        blocks:
          - type: paragraph
            body: |
              Synthesia 的主要买方是企业 L&D（学习与发展）团队，其次是大型公司内部的 HR、内部沟通和营销职能。
              典型买方是在拥有 500+ 员工公司任职的 L&D 或 HR 经理，企业套餐还需要 IT 或采购签字。预算归属在 HR/L&D 成本中心；
              这类部门历史上通常将总薪资的 3–5% 分配给培训支出。付款方几乎总是企业部门或业务单元，而不是最终学习者。

              按职能划分的关键细分包括：（1）企业培训和合规——最大且最可预测的细分；由数据隐私、健康与安全、反贿赂等监管要求驱动，
              这些要求需要年度再认证。（2）员工入职——由招聘周期触发的高频用例；视频入职能缩短达产时间并降低单次招聘成本。
              （3）产品和流程培训——在分布式销售和支持团队中扩散复杂产品知识。（4）内部沟通和高管信息传达——COO/CEO 以规模化方式沟通，
              尤其适用于多语言全球员工队伍。（5）客户和合作伙伴教育——增长中的细分，客户把 Synthesia 视频视为等同于真人讲解者的载体。

              Synthesia 披露的 70%+ Fortune 100 渗透率表明，企业细分顶端已被相当程度拿下。未来单位经济取决于：（a）在现有大客户中扩大
              平均合同价值；（b）向中端市场（500–10,000 名员工）扩张，那里品牌认知更低，Articulate Storyline / Adobe Captivate / Canva
              会围绕价格敏感度竞争。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
