  productSummary: >
    Synthesia 的核心产品是 AI 视频创作平台，让企业用户用 230+ 个内置 AI 头像或定制个人 AI 头像，生成 140+ 种语言的视频内容。Synthesia 2.0（2024 年 6 月）推出全身头像和
    Express-1 模型。Express-2（2025 年 9 月，在所有套餐上线）提供实时、超写实 AI 头像视频。Synthesia 3.0 / Video Agents（2025 年 10 月）加入实时交互式对话 AI
    头像，可用于 HR 筛选、合规培训、客户入职和个性化学习，把产品从视频创作扩展到 AI 原生工作流自动化。
  customerFocus: >
    客户集中在企业和中端市场组织，覆盖 L&D、内部沟通、HR 和销售赋能。70%+ Fortune 100 公司是其客户。具名企业客户包括 Heineken（70,000 名员工部署）、 DuPont（L&D
    成本节省）、Zoom（视频制作提速 90%）、Spirit Airlines（真人客服咨询减少 76%）、Orange（学习者留存提升 9x）和 BSH Group（60,000 名员工培训部署）。
  businessModel: >
    SaaS 订阅，按席位和企业层级定价。企业合同包括定制头像创建、专属客户成功、API 访问以及 SCORM/LRS 集成。GTM 采用先落地、再扩张：客户从部门级采用起步，再扩展到全企业部署。 142% NRR
    反映初始席位向更广组织合同扩张的力度。国际收入占比重要，客户基础覆盖欧盟、英国和北美。
