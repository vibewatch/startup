  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 维度
      - 正向论点
      - 反向论点
      - 综合判断
    rows:
      - - 市场地位
        - Fortune 100 渗透率 70%+；客户 65,000 家；企业 AI 视频市场领导者
        - 如果 AI 视频商品化，市场定义可能收窄；在消费者或创作者市场没有主导地位
        - 正向论点更强——Fortune 100 护城河是高质量企业验证
      - - AI 模型护城河
        - Express-2 专有且由研究驱动；学术脉络来自 TU Munich 和 UCL
        - 神经渲染技术已公开发表；资金充足、跑道 1–3 年的竞争对手可以复现
        - 短期内正向论点成立；若没有持续 R&D 投入，3 年以上维度会变弱
      - - 财务指标
        - NRR 142%；毛利率 77%+；ARR $146M，同比增 66%——在所有未上市 SaaS 公司中位居前十分位
        - GRR 未披露；NRR 口径未经审计；盈利路径未披露
        - 指标很有吸引力，但需要核验；这是标准尽调问题
      - - 监管合规
        - ISO 42001（全球首个 AI 视频平台）；SOC 2 Type II；GDPR；CAI 会员身份
        - EU AI Act 第 50 条水印要求未经独立审计；2024 年宣传事件显示同意框架可能被绕过
        - 正向论点只部分成立——认证带来差异化，但合规缺口仍在
      - - 产品差异化
        - Video Agents 打开新类别；Express-2 真实感同类领先；支持 140+ 种语言
        - Microsoft/Google 可能把可比 AI 视频功能打包进 M365/Workspace，让用户零增量成本使用
        - 关键风险——科技巨头打包是首要破坏论点情景；12–24 个月窗口最关键
      - - 退出路径
        - GV 领投 Series E 轮；HolonIQ EdTech 背书；ARR $100M+；市场地位具备 IPO 条件
        - 经营亏损显著；IPO 前盈利叙事尚未建立；已融资 $530M 带来较大清算优先权压力
        - IPO 路径可信，但路演前需要补出盈利叙事并完成监管审计
