      - number: '4.2'
        title: 单位经济与利润率画像
        blocks:
          - type: paragraph
            body: >
              Synthesia 不发布集团层面的合并财务。最精确的数据点是英国子公司 FY2023 Companies House 文件（Synthesia Limited，英国公司编号 10933652），披露营业额
              £26M（约 $33M）、毛利润 £20M，意味着该英国实体当财年毛利率为 77%。这与分析师对类似成本结构企业 AI SaaS 平台 70–90% 毛利率的估计一致。收入成本的关键组成包括：
              模型推理算力（视频渲染的云 GPU 成本）、多语言 TTS / 口型同步、头像个性化，以及标准层级下有限的客户支持。2025 年末 142% 净留存率（高于 2024 年的 119%）
              确认净扩张显著超过流失，是定价权和客户健康度的领先指标。隐含的单客户平均年收入（ARPU）约 $2,246（按 $146M ARR / 65,000 客户计算），显示定价分层明显： 企业账户单个可能贡献
              $30K–$50K+，而大量 SMB / 创作者基础把账户数锚定在低得多的 ARPU。按约 $146M ARR / 约 700 名员工计算，人均收入约 $209K， 不利于与 HeyGen
              等资本效率更高的竞争者比较（相近 ARR 规模下 $637K/employee）。
            claimRefs: []
