  - id: TR001
    title: 监管 / 法律风险登记表
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >-
        Primary regulatory and legal risks for an AI synthetic media / avatar video platform with EU, UK, and US
        enterprise customers as of May 2026. Covers deepfake labeling, digital replica liability, data protection, and
        content governance obligations. Excludes jurisdiction-specific labor and environmental law.
    columns:
      - 法规 / 法律
      - 司法辖区
      - 状态
      - Synthesia 义务
      - 处罚 / 风险暴露
      - Synthesia 缓释措施
      - 来源
    rows:
      - - EU AI Act 第 50 条 — 深度伪造标识
        - 欧盟（面向欧盟分发的内容全球适用）
        - 已生效（2025 年 8 月 2 日）
        - 确保 AI 生成的视频输出带有机器可读的合成内容标记；部署方必须向观看者披露 AI 生成属性
        - €35M 或全球年营业额 7%；按 $146M ARR 运行率约 €10M
        - ISO 42001 认证；CAI 会员资格；可部分缓释，但水印落地未经过独立审计
        - S701, S703
      - - EU AI Act — 高风险分类（招聘 / HR 用途）
        - 欧盟
        - 已生效；2026 年执法
        - 用于招聘 / HR 筛选的 Video Agents 可能被归为高风险 AI 系统，需完成合格评定、技术文档和透明度义务
        - 未遵守高风险义务可罚 €30M 或全球营业额 6%
        - Synthesia AI governance practices 页面覆盖用例治理；尚未公开发布 Video Agents 用于 HR 的合格评定
        - S701, S709
      - - GDPR / UK GDPR — 生物识别数据处理（数字人创建）
        - 欧盟、英国
        - 已生效
        - 创建定制数字人会处理生物识别数据（面部录制）；每位主体都需要明确同意、合法依据、DPA 对齐和数据最小化
        - €20M 或全球营业额 4%（欧盟）；UK GDPR 下也可能有重大罚款
        - 数字人同意框架以及与客户签订 DPA；ISO 27701 认证；个人同意文件
        - S704, S703
      - - 美国州级深度伪造立法（截至 2026 年 14+ 个州）
        - 美国（州级 — 加利福尼亚、德克萨斯、弗吉尼亚等）
        - 多部法律已生效，各州要求不一
        - 州级要求不一：有的要求披露标签，有的禁止未经同意使用，有的专门监管政治深度伪造；加州还增加了数字身份盗用条款
        - 民事和刑事处罚因州而异；对美国客户占比较高的客群，累计风险不小
        - 客户服务条款；内容审核；法务团队审查；尚未公开记录统一的美国合规方案
        - S706, S707
      - - 美国 NO FAKES Act（拟议联邦立法）
        - 美国联邦
        - 拟议中（截至 2026 年 5 月尚未颁布）
        - 一旦通过，将为创建未经授权的个人数字复制品设立联邦民事责任；即便数字人在创建时已获同意，若超出约定范围使用，也需要承担同意和下架义务
        - 每次违规承担民事赔偿；若出镜人员肖像被用于宣传，存在集体诉讼风险
        - 若法案通过，同意框架需大幅升级；Synthesia 尚未公开说明 NO FAKES 合规立场
        - S708, S705
      - - 美国 TAKE IT DOWN Act（2025）
        - 美国联邦
        - 已签署成法（2025）
        - 要求平台移除未经同意的私密深度伪造；Synthesia 并非主要面向消费者的平台，但若其 API 被用来生成此类内容，仍可能承担义务
        - 下架义务；若平台被认定协助生成，可能面临执法行动
        - 内容审核和服务条款；面向用户的 API 控制；举报机制
        - S707, S705
      - - 英国 Criminal Justice Bill — 私密深度伪造（2024）
        - 英国
        - 已颁布（英国，2024）
        - 把创建私密深度伪造定为犯罪；Synthesia 的 API 和平台不得协助生成此类内容；英国业务需要内容治理控制
        - 个人可能被刑事起诉；若协助生成且控制不足，平台可能承担责任
        - 服务条款；内容审核；同意框架；英国总部使英国监管风险成为最高优先级
        - S709, S712
