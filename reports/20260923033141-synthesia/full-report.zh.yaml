chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: |
              Synthesia（完整法定名称 Synthesia Ltd）是一家总部位于英国伦敦的私营科技公司，
              在 New York、Copenhagen 等地设有办公室。公司成立于 2017 年，以 B2B SaaS
              平台运营。其核心产品 Synthesia STUDIO 让企业用户把文字脚本转成专业质量视频，
              视频由逼真的 AI 头像出镜并以 140+ 种语言发声，不需要任何真人上镜录制或传统制作流程。
              商业模式为订阅制，层级从免费 / 入门套餐到 Creator 和 Enterprise 套餐；收入大部分来自企业合同。
              Synthesia 被归入 AI 生成视频、合成媒体和职场学习创作工具类别。2025 年 12 月，
              HolonIQ 将 Synthesia 纳入 Global EdTech Unicorn 榜单，并因企业 L&D 与培训团队采用度高，
              将其归为「创作工具（AI）」。公司最初的独角兽标签来自 2023 年 6 月 Series C，
              当时投后估值为 $1.0 B。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO016
      - number: '1.2'
        title: 创始人与管理层
        blocks:
          - type: paragraph
            body: |
              Synthesia 于 2017 年由四位创始人共同创立，能力覆盖 AI 研究、计算机视觉和创业。
              Viktor Riparbelli（CEO）负责商业和战略，把公司从研究项目推进到 $4 B 企业平台。
              联合创始人 Steffen Tjerrild 现任 COO/CFO，负责运营和财务。Prof. Matthias Niessner
              （Technical University of Munich）和 Prof. Lourdes Agapito（University College London）
              都是知名计算机视觉研究者，联合创办公司并持续提供科学领导；Niessner 的神经渲染研究支撑了
              Synthesia 很多头像技术。Jonathan Starck 担任 CTO，领导工程；Peter Hill 在 2025 年 1 月
              Series D 收官前后加入，担任高级技术高管。董事会包括关键投资方 GV（Google Ventures）、
              Accel、NEA 和 Kleiner Perkins 的代表。关键人物风险集中在 Viktor Riparbelli：其公开形象和愿景
              推动媒体与投资人关系；不过，学术联合创始人提供技术可信度和机构厚度，部分缓释了这一风险。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
