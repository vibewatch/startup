        - Enacted (UK 2024)
        - >-
          Criminalizes creation of intimate deepfakes; Synthesia's API and platform must not facilitate generation of
          such content; requires content governance controls for UK operations
        - Criminal charges for individuals; platform liability if facilitating creation inadequately controlled
        - >-
          Terms of Service; content moderation; consent framework; UK headquarters places UK regulatory exposure at
          highest priority
        - S709, S712
