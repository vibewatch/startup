chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: |
              Synthesia (full legal name Synthesia Ltd) is a private technology company headquartered
              in London, United Kingdom, with offices in New York, Copenhagen, and other locations.
              It was incorporated in 2017 and operates as a B2B SaaS platform. The company's core
              product — Synthesia STUDIO — allows enterprise users to turn text scripts into
              professional-quality videos featuring lifelike AI avatars speaking in 140+ languages
              without any on-camera recording or traditional production workflow. The business model
              is subscription-based, with tiers ranging from a free/starter plan through Creator and
              Enterprise plans; the majority of revenue derives from enterprise contracts. Synthesia
              is classified in the AI-generated video, synthetic media, and workplace learning
              authoring-tool categories. HolonIQ added Synthesia to its Global EdTech Unicorn list in
              December 2025, categorising it under "Authoring Tools (AI)" given substantial adoption
              by corporate L&D and training teams. The company's original unicorn designation came
              from its June 2023 Series C at a $1.0 B post-money valuation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO016
      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: |
              Synthesia was co-founded in 2017 by four individuals with complementary expertise in
              AI research, computer vision, and entrepreneurship. Viktor Riparbelli (CEO) is the
              commercial and strategic leader who has steered the company from research project to
              $4 B enterprise platform. Steffen Tjerrild, co-founder and now COO/CFO, oversees
              operations and finance. Prof. Matthias Niessner (Technical University of Munich) and
              Prof. Lourdes Agapito (University College London), both distinguished computer-vision
              researchers, co-founded the company and provide ongoing scientific leadership;
              Niessner's work on neural rendering underpins much of Synthesia's avatar technology.
              Jonathan Starck serves as CTO, leading engineering; Peter Hill joined as a senior
              technology executive around the Series D close in January 2025. The board includes
              representatives from key investors GV (Google Ventures), Accel, NEA, and Kleiner
              Perkins. Key-person risk is concentrated around Viktor Riparbelli, whose public profile
              and vision drive press and investor relations; however, the academic co-founders provide
              technical credibility and institutional depth that partially mitigates this risk.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: |
              Synthesia has raised approximately $530 M in total equity funding across six rounds
              since its founding. The seed/Series A in April 2019 raised approximately $3.8 M from
              LDV Capital, Mark Cuban, and Seedcamp. A $12.5 M round in April 2021 (FirstMark,
              LDV Capital) preceded the landmark $50 M Series B in December 2021 led by Kleiner
              Perkins — a round that brought in GV (Google Ventures), Accel, and angel investors
              Patrick Collison and John Collison at a reported $1 B post-money valuation. The
              $90 M Series C in June 2023 (led by Accel, with NVentures/Nvidia and GV) solidified
              unicorn status at a $1 B valuation. Synthesia then raised $180 M in January 2025
              (Series D, NEA-led, $2.1 B valuation) and $200 M in October 2025 (Series E,
              Google Ventures-led, $4.0 B valuation). The Series E included a secondary share
              sale facility facilitated with Nasdaq, enabling employees to cash out. Adobe Ventures
              made a strategic investment in April 2025 alongside the company's $100 M ARR
              milestone. The company was classified as an EdTech unicorn by HolonIQ in December 2025
              at the $4.0 B Series E valuation because of its education and training authoring use
              case — though its original unicorn round was the June 2023 Series C at $1 B.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: Scale, Metrics, and Geographic Footprint
        blocks:
          - type: paragraph
            body: |
              As of early 2026, Synthesia reports more than 65,000 business customers and over
              1 million registered users on its platform. More than 70 % of Fortune 100 companies
              are active customers. Annual recurring revenue (ARR) crossed $100 M in April 2025
              and analyst estimates placed ARR at approximately $145–146 M by September 2025.
              Revenue is split roughly 50/50 between the United States and international markets.
              Headcount grew to approximately 700 employees by early 2026, with a heavy
              engineering and AI research weighting. The product is available globally, with
              active commercial emphasis in North America, the United Kingdom, continental Europe,
              Japan, and Australia. The platform supports 240+ AI avatars, 1,000+ AI voices, and
              more than 140 languages, making localization a major enterprise value driver.
            claimRefs:
              - CO006
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO012
      - number: '1.5'
        title: Adverse Events and Governance Issues
        blocks:
          - type: paragraph
            body: |
              Synthesia has faced material reputational and ethical controversy stemming from
              the misuse of its AI avatars in political propaganda. Multiple actors who had sold
              their likeness to Synthesia for avatar creation discovered their digital likenesses
              appearing in disinformation videos supporting authoritarian regimes in Venezuela
              and Burkina Faso — uses the actors had not consented to. UK performers' union Equity
              documented at least one case in detail in 2024 and has campaigned for stronger legal
              protections under its "Stop AI Stealing the Show" initiative. Critics including VICE,
              WION, and the International Business Times reported that Synthesia's content
              moderation safeguards were insufficient to prevent propaganda use. Synthesia
              participated in the Partnership on AI (PAI) synthetic media framework as part of
              its response, and has since published updated responsible-AI guidelines, but the
              adequacy of these controls remains contested. No formal lawsuit against Synthesia has
              been confirmed in public records as of the report date; regulatory exposure under
              evolving EU AI Act and UK AI regulation frameworks remains a forward-looking risk.
            claimRefs:
              - CO006
              - CO014
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid Revenue Scaling and Enterprise Traction
            body: |
              Synthesia crossed $100 M ARR in April 2025 and reached an estimated $146 M by
              September 2025 — implying strong net retention and enterprise expansion. Over 70 % of
              Fortune 100 companies are reported customers, providing durable logo quality and
              upsell optionality. The combination of a $4 B valuation and confirmed revenue milestone
              anchors the investment case.
            calloutType: strength
            claimRefs:
              - CO006
              - CO014
          - type: callout
            title: Deepfake Controversy Exposes Content Governance Gaps
            body: |
              The 2024 propaganda misuse incidents — where Synthesia avatars appeared in
              disinformation campaigns for authoritarian regimes without actors' consent — represent
              a material reputational and regulatory risk. Equity (UK performers' union) has
              campaigned publicly, and evolving EU AI Act and UK AI regulation may impose stricter
              controls. While Synthesia has issued updated guidelines and joined the PAI framework,
              the adequacy of these controls is actively contested.
            calloutType: risk
            claimRefs:
              - CO006
              - CO014
          - type: callout
            title: HolonIQ EdTech Listing Reflects Training-Tool Reclassification
            body: |
              Synthesia's original unicorn round was the June 2023 Series C at $1 B. HolonIQ
              independently added Synthesia to its global EdTech unicorn list in December 2025 at
              the $4.0 B Series E valuation because of the company's substantial adoption as a
              corporate learning and training authoring tool. This classification underscores
              Synthesia's dual identity: a general-purpose AI video platform that has achieved
              dominant penetration specifically in enterprise L&D and workforce training contexts.
            calloutType: insight
            claimRefs:
              - CO003
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definitions
        blocks:
          - type: paragraph
            body: |
              Synthesia's addressable market spans three nested categories. The broadest frame is
              the global AI video market — encompassing all AI-generated or AI-enhanced video
              creation, editing, and streaming, across consumer, media, and enterprise verticals.
              This market is too broad for Synthesia's current enterprise focus. The relevant
              mid-level frame is the enterprise AI video platform market: software tools enabling
              businesses to create, personalise, and localise video content at scale, primarily
              for internal communications, training, onboarding, sales enablement, and customer
              education — without traditional production workflows. Within this, Synthesia's
              tightest competitive space is enterprise eLearning and training authoring tools —
              specifically AI-powered platforms that replace or augment PowerPoint/live-trainer
              workflows with AI avatar-driven video content. This is the category under which
              HolonIQ classifies Synthesia as an EdTech unicorn.

              Spend explicitly excluded from Synthesia's SAM includes: broadcast and streaming
              video platforms (Netflix, Disney+, YouTube infrastructure), traditional video
              production agencies and studios, general-purpose video editing software (Adobe
              Premiere, DaVinci), AI video for entertainment/gaming, and video surveillance/security.
              Adjacent growth opportunities — customer-facing marketing video, interactive product
              tours, AI video agents for sales — represent expansion paths not yet at scale in
              Synthesia's current revenue mix. Status-quo substitutes that Synthesia displaces or
              competes with include: in-house video production studios, professional video agencies,
              screen-recorder + voiceover stacks (Camtasia, Loom), PowerPoint + narration, and
              traditional instructor-led training.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
      - number: '2.2'
        title: Market Sizing — Multiple Lenses
        blocks:
          - type: paragraph
            body: |
              Analyst estimates for Synthesia's relevant markets vary substantially depending on
              market boundary definition. The broadest reliable estimate (Grand View Research) puts
              the global AI video market at $3.86 B in 2024, growing at a 30–35 % CAGR to an
              estimated $42.3 B by 2033. Precedence Research sizes the market at $10.3 B in 2025,
              projecting growth to $156 B by 2034 (≈35 % CAGR) — a significantly more aggressive
              estimate that likely includes streaming AI applications. The AI video generator
              software segment (more comparable to Synthesia's positioning) is sized at approximately
              $717 M in 2025 by Fortune Business Insights, reaching $3.35 B by 2034 at an 18.8 %
              CAGR. The enterprise video communications market is separately estimated at $16.6 B
              in 2023 growing to $49 B by 2032 (Allied Market Research, 12 % CAGR) — a broader
              category that includes live video conferencing.

              For the HolonIQ-relevant eLearning authoring tools market, estimates range from
              $6.1–7.2 B in 2025 (Research and Markets, TechSci Research), growing to $13.9–17.6 B
              by 2030 at a 17–19 % CAGR. The broader corporate eLearning market was estimated at
              $104 B in 2024 by Grand View Research, projected to reach $335 B by 2030 (21.7 %
              CAGR). The AI in L&D market specifically is estimated at $9.3 B in 2025 by Market.us,
              reaching $97 B by 2034 (26 % CAGR).

              A bottom-up sanity check: Synthesia reports ~$146 M ARR (Sep 2025 est.) from 65,000+
              customers. Assuming the enterprise AI video authoring market is approximately $2–3 B
              in directly addressable annual spend (excluding consumer/media), Synthesia has captured
              roughly 5–7 % of its SAM — a strong early-stage position with material headroom.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: Buyer and Segment Landscape
        blocks:
          - type: paragraph
            body: |
              Synthesia's primary buyers are enterprise L&D (Learning and Development) teams,
              followed by HR, internal communications, and marketing functions within large
              corporations. The typical buyer is an L&D or HR manager at a company with 500+
              employees, with an IT or procurement sign-off required for enterprise tiers. Budget
              ownership sits in HR/L&D cost centres, which have historically allocated 3–5 % of
              total payroll to training spend. The payer is almost always a corporate department
              or business unit — not the end learner.

              Key segments by function: (1) Corporate training and compliance — the largest and
              most predictable segment; driven by regulatory mandates (data privacy, health and
              safety, anti-bribery) that require annual recertification. (2) Employee onboarding —
              a high-frequency use case triggered by hiring cycles; video onboarding reduces
              time-to-productivity and cost per hire. (3) Product and process training — scaling
              knowledge of complex products across distributed sales and support teams. (4) Internal
              communications and executive messaging — COO/CEO communication at scale, especially
              for multilingual global workforces. (5) Customer and partner education — a growing
              segment where customers view Synthesia video as an equivalent to a human presenter.

              Synthesia's reported 70 %+ Fortune 100 penetration signals that the top end of the
              enterprise segment is substantially captured. Future unit economics depend on (a)
              expansion of average contract value within existing large accounts, and (b) expansion
              into mid-market (500–10,000 employees) where brand-recognition is lower and
              Articulate Storyline / Adobe Captivate / Canva compete on price-sensitivity.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              Primary growth drivers include: (1) AI-driven content-cost deflation — Synthesia
              reduces video production time by up to 90 %, converting historically capex-heavy
              production into opex SaaS spend, a structural shift that expands the total buyer
              pool. (2) Multilingual/global workforce demand — enterprises expanding to Asia, LATAM,
              and EMEA require localised video at a scale impossible for traditional production;
              Synthesia's 140+ language support is a structural advantage. (3) Generative AI
              platform maturation — as avatar quality improves and enterprise AI spending grows
              (73 % of global organisations using AI in 2025), buyers are more willing to deploy
              AI video for compliance and public-facing training. (4) Fortune 100 social proof —
              once 70 %+ of the top 100 use a product, the barrier for peer enterprises drops
              substantially. (5) Adobe Ventures and Google Ventures endorsement signals
              ecosystem integration potential that accelerates enterprise procurement decisions.

              Key constraints and headwinds: (1) Avatar-realism ceiling — synthetic avatars
              are widely accepted for internal training but face resistance in customer-facing
              contexts (sales demos, customer success calls) where human warmth matters. This
              limits Synthesia's TAM expansion beyond internal use cases. (2) Deepfake/ethical
              trust deficit — the 2024 propaganda controversy (see Chapter 1) created a residual
              trust tax, particularly with regulated industries (financial services, pharma) and
              public-sector buyers who face procurement scrutiny. (3) EU AI Act and UK AI regulation
              — evolving legislation may impose mandatory disclosures, watermarking, or consent
              requirements on synthetic-media platforms, increasing compliance costs and slowing
              enterprise procurement. (4) LMS integration complexity — most enterprise L&D budgets
              are tied to LMS platforms (Workday Learning, SAP SuccessFactors, Cornerstone);
              Synthesia must integrate cleanly or risk displacement when these platforms add native
              AI video. (5) Competitive commoditisation — open-source models (Stable Video Diffusion,
              RunwayML) and lower-cost competitors (HeyGen, D-ID) are rapidly narrowing the quality
              gap, threatening Synthesia's premium pricing. (6) Engagement-ROI measurement gap —
              enterprises struggle to demonstrate measurable learning outcomes from AI video,
              creating friction in budget renewal cycles.
            claimRefs:
              - CM007
              - CM010
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Wide Market Boundary Dispersion Requires Conservative SAM Framing
            body: |
              Analyst estimates for Synthesia's addressable market range from $717 M
              (AI video generator software) to $10.3 B (broad AI video), a 14× span.
              Diligence should anchor to the eLearning authoring tools segment ($6–7 B)
              and enterprise AI video authoring sub-segment (~$2–3 B) as the most comparable
              boundaries. Synthesia's ~$146 M ARR at 5–7 % SAM penetration suggests
              significant runway — but requires sustained product quality and pricing power.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM011
          - type: callout
            title: LMS Platform Incumbents Threaten to Commoditise the Authoring Layer
            body: |
              Workday, SAP SuccessFactors, and Cornerstone OnDemand are all adding native
              AI content-creation capabilities to their LMS platforms. If these incumbents
              embed AI video authoring natively, Synthesia's integration advantage erodes
              and its SAM could shrink to a premium niche of enterprises willing to pay for
              dedicated avatar-video creation. This risk intensifies as Synthesia's $4 B
              valuation implies a TAM capture thesis that requires durable category leadership.
            calloutType: risk
            claimRefs:
              - CM007
              - CM010
          - type: callout
            title: Multilingual Capability Is a Structural Moat in the Global Enterprise SAM
            body: |
              Synthesia's 140+ language support addresses a structural gap in traditional
              enterprise video production: most global enterprises cannot produce training
              content in 20+ languages at speed or affordable cost. This creates a
              switching-cost dynamic — once an enterprise has built its multilingual video
              library in Synthesia, the cost of re-recording in another platform is high.
              This is Synthesia's most defensible market-side advantage.
            calloutType: strength
            claimRefs:
              - CM007
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Synthesia competes across five distinct competitor classes: direct AI video avatar platforms (HeyGen,
              D-ID, Colossyan, Deepbrain AI), eLearning authoring incumbents (Articulate 360), adjacent personalization
              platforms (Tavus), likely big-tech entrants bundling AI video into enterprise suites (Microsoft 365
              Copilot with Sora, Google Workspace Vids/Veo), and the status quo alternatives of traditional video
              production and internal AI engineering builds. No single competitor spans all five value dimensions
              Synthesia serves: enterprise compliance, avatar realism, multilingual scale, SCORM/LMS workflow
              integration, and content governance. This fragmented landscape reflects the early stage of the market and
              creates a window for Synthesia to establish durable lock-in before big-tech platforms achieve feature
              parity. The most acute near-term pressure comes from HeyGen — the only direct competitor approaching
              Synthesia's revenue scale — while the structural long-term threat is Microsoft's and Google's ability to
              bundle AI video as a zero-marginal-cost feature within existing enterprise agreements.
            claimRefs: []
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
      - number: '3.2'
        title: Direct AI Video Avatar Competitors
        blocks:
          - type: paragraph
            body: >
              HeyGen is the closest direct competitor by revenue and growth trajectory. With approximately $95–100
              million ARR as of late 2025, 85,000 total customers, and only 157 employees, HeyGen demonstrates capital
              efficiency that Synthesia's 700-person organization cannot match. HeyGen's differentiation rests on
              superior voice cloning (supporting 40+ language dubbing of existing real-person video), creator-centric
              product design, and a more accessible self-serve pricing ladder. However, HeyGen's compliance posture is
              weaker than Synthesia's: it lacks SOC 2 Type II certification (as of mid-2025) and targets SMBs and
              marketing teams more than regulated enterprise L&D. D-ID expanded its enterprise footprint by acquiring
              Simpleshow in September 2025, gaining 1,500+ enterprise customers including Adobe, Microsoft, and Deutsche
              Bank, but its ARR of approximately $34 million in 2024 remains well below Synthesia's. Colossyan is the
              strongest Synthesia alternative specifically in the corporate L&D segment, offering unlimited video
              minutes at $88/seat/month — directly undercutting Synthesia's metered model. Deepbrain AI is comparable on
              avatar realism with 150+ language support and ISO/SOC compliance, but its template- driven workflow
              constrains creative flexibility for non-standardized content.
            claimRefs: []
