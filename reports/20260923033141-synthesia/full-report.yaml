      - Penalty / Exposure
      - Synthesia Mitigation
      - Sources
    rows:
      - - EU AI Act Article 50 — deepfake labeling
        - EU (applies globally for EU-distributed content)
        - In force (Aug 2, 2025)
        - >-
          Ensure AI-generated video outputs are machine-readable marked as synthetic; deployers must disclose
          AI-generated nature to viewers
        - €35M or 7% global annual turnover; ~€10M at $146M ARR run rate
        - >-
          ISO 42001 certification; CAI membership; partially mitigates but watermarking implementation not independently
          audited
        - S701, S703
      - - EU AI Act — high-risk classification (employment/HR use)
        - EU
        - In force; enforcement 2026
        - >-
          Video Agents used in hiring/HR screening may be classified as high-risk AI systems requiring conformity
          assessment, technical documentation, and transparency obligations
        - €30M or 6% global turnover for non-compliance with high-risk obligations
        - >-
          Synthesia AI governance practices page addresses use-case governance; no public conformity assessment for
          Video Agents in HR published
        - S701, S709
      - - GDPR / UK GDPR — biometric data processing (avatar creation)
        - EU, UK
        - In force
        - >-
          Custom avatar creation processes biometric data (facial recording); requires explicit consent, lawful basis,
          DPA alignment, and data minimization for each subject
        - €20M or 4% global turnover (EU); significant fines under UK GDPR
        - Avatar consent framework and DPA with customers; ISO 27701 certification; individual consent documentation
        - S704, S703
      - - US state deepfake legislation (14+ states as of 2026)
        - US (state level — California, Texas, Virginia et al.)
        - Multiple laws in force, varying by state
        - >-
          State-level requirements vary: some require disclosure labels, some prohibit use without consent, some
          regulate political deepfakes specifically; California adds digital identity theft provisions
        - Civil and criminal penalties vary by state; collective exposure non-trivial for US-heavy customer base
        - >-
          Customer Terms of Service; content moderation; legal team review; no single unified US compliance program
          publicly documented
        - S706, S707
      - - US NO FAKES Act (proposed federal legislation)
        - US Federal
        - Proposed (not yet enacted as of May 2026)
        - >-
          Would create federal civil liability for creating unauthorized digital replicas of individuals; would require
          consent and takedown obligations even for consensual-at-creation avatars if used beyond agreed scope
        - Civil damages per violation; class action risk for talent whose likenesses were used in propaganda
        - >-
          Would require significant consent framework upgrade; Synthesia has not publicly addressed NO FAKES compliance
          posture
        - S708, S705
      - - US TAKE IT DOWN Act (2025)
        - US Federal
        - Signed into law (2025)
        - >-
          Requires platforms to remove nonconsensual intimate deepfakes; Synthesia is not primarily a consumer platform
          but could face obligations if its API is used to generate such content
        - Takedown obligations; potential for enforcement action if platform is found to facilitate generation
        - Content moderation and terms of service; user-facing API controls; flagging mechanisms
        - S707, S705
