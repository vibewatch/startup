  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Rule of 40 score — EBITDA margin not publicly disclosed; prevents valuation benchmarking against premium SaaS cohort
    missingEvidence: Synthesia's EBITDA margin (or EBIT margin) for 2024–2025; operating loss as a percentage of revenue; Rule of 40 score (growth + EBITDA margin); path-to-profitability ARR threshold and timeline
    whyItMatters: Public market investors at IPO will price Synthesia against the Rule of 40 cohort (growth + EBITDA margin >40%); without EBITDA margin, it is impossible to determine whether Synthesia's high growth is achieved at sustainable cost structures or through aggressive cash burn that would compress the IPO multiple
    diligencePath: Request management's EBITDA margin target and path-to-profitability revenue threshold; request last 4 quarters of operating loss/EBITDA bridge; ask for sales efficiency metric (CAC payback period)
    relatedQuestionRefs: []
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: Comparable valuation table (T804) — private comparables use estimated valuations not publicly confirmed
    missingEvidence: HeyGen's confirmed valuation and NRR; Databricks' confirmed NRR at comparable ARR scale; Articulate 360's exact exit ARR and M&A multiple confirmation; D2L's current NRR
    whyItMatters: The comparable set in T804 uses analyst-estimated valuations for private companies (HeyGen, Databricks); uncertainty in these comparables reduces the precision of Synthesia's relative multiple assessment; the most critical gap is HeyGen's valuation confirmation as the closest direct comparable
    diligencePath: Request market intelligence from Synthesia management on HeyGen fundraising data; use PitchBook or Crunchbase private market data for HeyGen; request Databricks NRR from Sacra or CB Insights
    relatedQuestionRefs:
    - QV009
    relatedTableRefs: []
  - type: missing-source
    severity: moderate
    topic: Synthesia IPO readiness assessment — profitability narrative and S-1 preparation status
    missingEvidence: Whether Synthesia has engaged investment banks for IPO preparation; public market equity story narrative; governance structure (Board composition, independent directors, audit committee); whether dual-class share structure is planned
    whyItMatters: IPO readiness is critical for estimating the 2027–2028 exit timeline; if Synthesia has not yet engaged banks or begun S-1 preparation, the IPO could slip to 2029+ — extending the holding period and compressing returns for Series E investors
    diligencePath: Request IPO advisory status from Synthesia management; ask for Board composition and independent director count; request governance structure for any planned public offering
    relatedQuestionRefs: []
    relatedTableRefs: []
