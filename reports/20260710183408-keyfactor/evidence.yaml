evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: absolute-revenue
    missingEvidence: Absolute ARR, GAAP revenue, and revenue mix by product or segment.
    whyItMatters: Without denominators, growth claims and valuation reasonableness cannot be fully underwritten.
    diligencePath: Request audited or board-approved FY2024/FY2025 revenue bridge, ARR walk, and segment mix in management diligence.
    relatedQuestionRefs:
      - QO019
      - QO025
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Debt facilities, secondary components, liquidation preferences, and ownership percentages for Insight, Sixth
      Street, and Summit.
    whyItMatters: Control rights and preference stack directly affect entry price discipline and downside protection.
    diligencePath: Review cap table, stock purchase agreements, and any side letters for the 2023 and 2026 transactions.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: A full current board roster with committee assignments and independent-director status.
    whyItMatters: Governance quality, sponsor influence, and oversight capacity cannot be judged from financing releases alone.
    diligencePath: Ask for board deck cover pages, director list, and governance documents during diligence.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: Customer concentration, ARR by vertical/geography, and the share of production customers versus reference logos.
    whyItMatters: Public penetration claims are impressive, but concentration and paid-deployment quality determine durability.
    diligencePath: Request cohort tables, top-20 customer ARR, gross retention, and public-to-private customer mapping.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO025
  - type: stale
    severity: minor
    topic: security-incident-context
    missingEvidence: A reconciled list of remediated versus currently exploitable CVEs and whether any led to customer incidents.
    whyItMatters: >-
      Open vulnerability listings are not the same as live exploit exposure, but they matter for trust-platform
      diligence.
    diligencePath: Ask management for a security advisory closeout log, patch adoption data, and incident postmortems if any exist.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: conflicting-data
    severity: material
    topic: sam-som
    missingEvidence: >-
      A management-backed segmentation of core CLM revenue opportunity versus broader machine identity and PQC
      adjacency.
    whyItMatters: >-
      Published TAM figures are directionally useful, but they do not isolate Keyfactor’s realistic capture zone after
      bundled competition and services overlap.
    diligencePath: >-
      Request pipeline segmentation by product family, buyer type, and competitor displacement, plus win/loss data by
      segment.
    relatedQuestionRefs:
      - QM021
      - QM022
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Actual budget-owner patterns, deal sizes, and sales-cycle lengths by vertical and deployment model.
    whyItMatters: >-
      Buyer maps inferred from vendor materials can misstate who truly pays and how quickly the market converts urgency
      into bookings.
    diligencePath: >-
      Ask management for closed-won sample deals, budget-owner titles, procurement pathways, and stage-conversion data
      by segment.
    relatedQuestionRefs:
      - QM014
      - QM015
  - type: stale
    severity: minor
    topic: survey-bias
    missingEvidence: >-
      Fresh independent survey work that triangulates vendor-published urgency metrics around PKI, AI, and quantum
      readiness.
    whyItMatters: >-
      Several cited pressure metrics come from vendor-sponsored research and may overemphasize category urgency or
      solution fit.
    diligencePath: Cross-check with Gartner, IDC, Forrester, or enterprise customer interviews during diligence.
    relatedQuestionRefs:
      - QM020
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: status-quo-substitutes
    missingEvidence: Quantified share of deployments still managed through spreadsheets, internal build, or general-purpose tooling.
    whyItMatters: The size of the displacement opportunity depends on how far buyers remain from full lifecycle automation.
    diligencePath: >-
      Request pipeline notes and implementation assessments showing incumbent manual processes in recent competitive
      wins.
    relatedQuestionRefs:
      - QM017
      - QM023
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Apples-to-apples commercial terms, discounting behavior, and contract structures across Keyfactor,
      CyberArk/Venafi, DigiCert, Sectigo, and AppViewX.
    whyItMatters: Competitive strength can be overstated if rivals are undercutting or bundling away the category in live deals.
    diligencePath: Request recent competitive bake-off sheets, pricing exceptions, and procurement redlines from management.
    relatedQuestionRefs:
      - QP015
      - QP024
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Segmented win/loss rates by competitor class and deal size.
    whyItMatters: >-
      Public positioning does not show whether Keyfactor wins against bundled suites, cloud-native substitutes, or
      status-quo incumbents in practice.
    diligencePath: Review CRM-coded win/loss records and pipeline conversion by competitor over the last four quarters.
    relatedQuestionRefs:
      - QP023
      - QP024
  - type: missing-source
    severity: minor
    topic: entrust-detail
    missingEvidence: >-
      Richer current public product detail on Entrust’s packaging and deployment model beyond third-party summaries and
      ABI positioning.
    whyItMatters: Entrust is a top-ranked competitor, but its live public surface was less transparent than peers during this run.
    diligencePath: Request management’s current Entrust comparison materials and recent field intelligence from sales engineering.
    relatedQuestionRefs:
      - QP004
      - QP024
  - type: stale
    severity: minor
    topic: vendor-authored-comparisons
    missingEvidence: Independent user or analyst evidence validating vendor-authored claims about feature superiority and better value.
    whyItMatters: Competitor pages are useful for packaging and positioning, but not enough to settle superiority claims.
    diligencePath: Cross-check with customer references, review platforms, and analyst interviews in live diligence.
    relatedQuestionRefs:
      - QP007
      - QP024
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-revenue
    missingEvidence: Current ARR, GAAP revenue, quarterly growth bridge, and revenue mix by product line.
    whyItMatters: These are the minimum inputs needed to turn public growth signals into a defensible valuation or downside case.
    diligencePath: Request monthly ARR and revenue bridge by product, geography, and customer cohort.
    relatedQuestionRefs:
      - QI008
      - QI019
      - QI025
  - type: private-evidence-only
