  evidenceGaps:
    - type: "conflicting-data"
      severity: "material"
      topic: "sam-som"
      missingEvidence: "A management-backed segmentation of core CLM revenue opportunity versus broader machine identity and PQC adjacency."
      whyItMatters: "Published TAM figures are directionally useful, but they do not isolate Keyfactor’s realistic capture zone after bundled competition and services overlap."
      diligencePath: "Request pipeline segmentation by product family, buyer type, and competitor displacement, plus win/loss data by segment."
      relatedQuestionRefs: [QM021, QM022]
    - type: "private-evidence-only"
      severity: "material"
      topic: "budget-ownership"
      missingEvidence: "Actual budget-owner patterns, deal sizes, and sales-cycle lengths by vertical and deployment model."
      whyItMatters: "Buyer maps inferred from vendor materials can misstate who truly pays and how quickly the market converts urgency into bookings."
      diligencePath: "Ask management for closed-won sample deals, budget-owner titles, procurement pathways, and stage-conversion data by segment."
      relatedQuestionRefs: [QM014, QM015]
    - type: "stale"
      severity: "minor"
      topic: "survey-bias"
      missingEvidence: "Fresh independent survey work that triangulates vendor-published urgency metrics around PKI, AI, and quantum readiness."
      whyItMatters: "Several cited pressure metrics come from vendor-sponsored research and may overemphasize category urgency or solution fit."
      diligencePath: "Cross-check with Gartner, IDC, Forrester, or enterprise customer interviews during diligence."
      relatedQuestionRefs: [QM020, QM025]
    - type: "private-evidence-only"
      severity: "minor"
      topic: "status-quo-substitutes"
      missingEvidence: "Quantified share of deployments still managed through spreadsheets, internal build, or general-purpose tooling."
      whyItMatters: "The size of the displacement opportunity depends on how far buyers remain from full lifecycle automation."
      diligencePath: "Request pipeline notes and implementation assessments showing incumbent manual processes in recent competitive wins."
      relatedQuestionRefs: [QM017, QM023]
