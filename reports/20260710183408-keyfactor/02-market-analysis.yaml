    title: "The category is being pulled by policy as much as by technology"
    body: "Certificate lifetime compression and federal PQC deadlines matter because they convert a technical best practice into a dated operational requirement."
    claimRefs: [CM010, CM011, CM019, CM020]
  - calloutType: "strength"
    title: "Keyfactor’s positioning sits in the middle of the right convergence"
    body: "The company’s CLM, PKI, and crypto-agility story aligns with the market’s three biggest demand vectors: automation, machine identity sprawl, and post-quantum readiness."
    claimRefs: [CM004, CM007, CM022, CM028, CM031]
  - calloutType: "risk"
    title: "Published market size does not automatically equal standalone vendor capture"
    body: "The most important market categories are increasingly contested by bundled CA, PAM, and platform-security vendors, which can compress pure-play CLM budgets even as urgency rises."
    claimRefs: [CM023, CM027, CM034, CM040]

