    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-structure"
      missingEvidence: "Debt facilities, secondary components, liquidation preferences, and ownership percentages for Insight, Sixth Street, and Summit."
      whyItMatters: "Control rights and preference stack directly affect entry price discipline and downside protection."
