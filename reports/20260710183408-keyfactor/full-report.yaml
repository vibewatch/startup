            body: >
              Public governance visibility is partial rather than complete, but the available record is enough to
              establish who currently drives strategy and where disclosure remains thin. Jordan Rackie is the current
              CEO in the 2023 and 2026 financing announcements, while Ted Shorter appears as CTO in federal and
              platform-launch announcements and remains the most visible technical spokesperson on trust infrastructure,
              certificate automation, and post-quantum migration. In January 2026 Keyfactor added a major go-to-market
              executive, appointing Michael Volanoski as President and Chief Revenue Officer to run sales, marketing,
              and channel functions. That release matters for more than biography: management used it to say the company
              had nearly doubled ARR in less than two years and expanded to 540+ employees across 12 countries, implying
              a scaling inflection that likely required a broader executive layer. Board evolution can also be inferred
              from financing events. Sixth Street’s 2023 minority investment brought Bo Stanley and Alex Katz onto the
              board, while the July 2026 Summit-led transaction added managing directors Andy Collins and Colin Mistele.
              What remains undisclosed is equally relevant: the company does not publicly publish a full current board
              roster, ownership percentages, protective provisions, or any formal statement on secondaries or debt
              covenants. That limits outside assessment of control dynamics even though the public record clearly shows
              investor influence rising with each growth transaction.
