      - number: '2.4'
        title: Growth Drivers, Constraints, and the Most Important Market Gaps
        blocks:
          - type: paragraph
            body: >
              Four demand accelerants stand out across vendor, analyst, and policy sources. First, certificate lifetime
              compression is now a hard timetable, not an abstract possibility: DigiCert, Sectigo, and GlobalSign all
              describe the CA/Browser Forum schedule that cuts maximum TLS validity to 200 days in 2026, 100 days in
              2027, and 47 days in 2029. Second, machine identity sprawl is accelerating with AI, cloud, containers, and
              APIs. Third, PQC has shifted from thought leadership to procurement planning after the White House’s June
              2026 executive order, which Federal News Network says sets 2030 and 2031 federal transition deadlines and
              extends pressure into contractors and critical infrastructure. Fourth, regulatory and audit expectations
              increasingly require continuous visibility rather than periodic spreadsheet-based inventory. The
              constraints are equally important. The 2024 Keyfactor PKI report says 80% of respondents are concerned
              about adapting to cryptographic change, 84% cite growing certificate volumes as operational headaches, and
              36% still planned to delay quantum-readiness work until after standards releases. AppViewX’s market
              education still describes spreadsheets, email-based renewals, and weak storage practices as live
              status-quo substitutes, which implies that buyer education, talent scarcity, and migration complexity
              remain meaningful adoption brakes. The unresolved gap is the missing SAM/SOM consensus: public sources
              size the category, but they do not isolate how much of that spend is realistically open to an independent
              vendor like Keyfactor versus bundled public CA, PAM, or platform security alternatives.
