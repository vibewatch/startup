              monetization rather than a one-product SKU story. Command is the operating layer for certificate lifecycle
              automation and machine identity governance. EJBCA Enterprise monetizes private PKI deployment and
              administration across self-managed, managed, and cloud delivery patterns. SignServer expands monetization
              into code, firmware, document, and container signing, while Cloud PKI as-a-Service and the government
              cloud certificate lifecycle automation offering add managed-service revenue on top of software. This
              matters because the business is unlikely to depend on one narrow certificate-renewal workflow; it is
              selling a broader control plane for trust infrastructure. Public pricing remains opaque, so the exact
              split between subscription, support, services, and managed operations is not visible. Even so, the product
              surface, the FedRAMP-authorized government option, and the TEI study’s cost-saving narrative all point to
