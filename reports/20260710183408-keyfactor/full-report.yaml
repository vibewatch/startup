      - number: '8.2'
        title: Financing context supports a step-up from 2023, but not unlimited optimism
        blocks:
          - type: paragraph
            body: >
              Public financing anchors imply meaningful value creation since 2023, but they do not produce a clean mark
              for 2026. The clearest disclosed anchor is the October 2023 Sixth Street transaction at an approximately
              $1.3 billion enterprise value. By July 2026, Keyfactor announced a $1 billion-plus strategic growth
              investment led by Summit Partners, with existing investors remaining significant holders and management
              describing accelerating growth and record profitability. That combination strongly suggests that the 2026
              round happened from a position of strength, not distress. It does not, however, disclose post-money
              valuation, primary versus secondary mix, liquidation preferences, governance changes beyond board seats,
              or the revenue base against which a new price should be judged. Comparable market context helps but does
              not solve the problem. CyberArk’s $1.54 billion acquisition of Venafi shows strategic buyer appetite for
              machine identity and trust assets. Public cloud-security and identity names such as CyberArk, Okta,
              Rubrik, Palo Alto Networks, Zscaler, CrowdStrike, and SentinelOne all carry large public-equity values in
              July 2026, but they are not apples-to-apples references for a private trust-infrastructure company with
              undisclosed unit economics. So the financing context supports a higher 2026 value than 2023, but only
              within a wide confidence band.
