      - number: '6.3'
        title: Expansion logic is clear, but retention and satisfaction are largely undisclosed
        blocks:
          - type: paragraph
            body: >
              The public record suggests a strong land-and-expand motion even though classical SaaS retention metrics
              are absent. Several customer stories begin with one operational wedge—certificate visibility, PKI
              modernization, code signing, public-sector identity verification, or compliance modernization—and then
              expand into broader automation, governance, or future crypto-agility needs. M&T Bank’s more-than-ten-year
              relationship and the Netherlands Ministry’s 15-plus years of PKI operations are the clearest duration
              signals in the public record. OVHcloud’s case explicitly references open-source affinity and enterprise
              support, which is useful evidence that Keyfactor can convert community-compatible buyers into enterprise
              relationships. ServiceNow, Siemens, SK ID, Schneider, and GRENKE all describe operational integration deep
              enough that replacement would likely be difficult once workflows, policy, and trust anchors are
              centralized. Still, the public record does not disclose NRR, GRR, renewal rates, churn, contract length,
              or customer satisfaction metrics. That means durability is best inferred from workflow depth and
              relationship length rather than measured retention disclosure.
