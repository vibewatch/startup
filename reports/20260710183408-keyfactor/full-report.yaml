  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risks are ranked around trust failures, regulated delivery, and execution opacity
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s risk profile is unusual because the company sells directly into the operational fabric of
              digital trust. That means a failure in its own product security, upgrade process, or compliance posture
              would not be treated like a minor software bug by customers; it would be interpreted as a contradiction of
              the company’s core promise. Public evidence shows that the risk surface is real. The company maintains an
              active security-advisories program, OpenCVE aggregates multiple disclosed vulnerabilities across Command,
              SignServer, EJBCA, and AWS Orchestrator, and NVD records several medium-to-high severity issues across
              recent versions. None of that is automatically thesis-breaking—serious infrastructure software always
              requires patching—but it does make security execution the first risk family to underwrite. The second
              family is regulated-delivery risk: FedRAMP and public-sector positioning expand the opportunity but create
              ongoing certification and operational obligations. The third family is evidence opacity. Public sources do
              not disclose the customer concentration, retention, cash, or reliability detail needed to bound downside
              precisely. As a result, Keyfactor can look strategically strong while still carrying under-measured
              residual risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
