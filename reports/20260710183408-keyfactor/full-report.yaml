      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s moat is real but conditional. It is strongest where buyers need an independent control plane
              that spans discovery, CA diversity, signing, private PKI, and crypto-agility without forcing them into a
              single public CA or broader identity suite. Reference customers like Siemens, ServiceNow, and OVHcloud
              support that story because they show Keyfactor winning in automation-heavy, regulated, and
              sovereignty-sensitive environments. Switching costs become meaningful after the platform is integrated
              into issuance workflows, alerting, HSMs, DevOps pipelines, and policy governance; at that point, replacing
              the control plane is not just a license decision but an operational migration. Even so, multi-homing
              remains possible at the certificate issuance layer because many buyers already use multiple CAs or trust
              sources. That is why the real strategic battle is shifting upward from issuance into discovery,
              governance, and post-quantum readiness. This also creates the main displacement risk. As certificate
              lifetimes shrink and baseline automation becomes mandatory, commoditization pressure falls hardest on
              simple renewal tooling. Vendors with broader bundles, stronger distribution, or embedded platform
              positions can compress the value of point CLM unless Keyfactor continues to differentiate on visibility,
              orchestration breadth, and trust-infrastructure governance.
