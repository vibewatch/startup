  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: constructive, but only with strict entry discipline'
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s public evidence supports a positive company-quality view and a qualified valuation view. The
              bullish side is clear: the company operates in a category with structural urgency, has a repeat-sponsor
              capital stack, shows strong reference-quality customers, and owns a broader trust-infrastructure story
              than a simple certificate-renewal tool. The anti-thesis is also clear: public evidence still does not
              reveal the company’s current ARR, net retention, margin structure, concentration, or the exact terms of
              the 2026 transaction. That means the right recommendation is not a blanket “invest” but a conditional one:
              invest or lean in only if price, structure, and diligence outputs compensate for the still-missing
              underwriting inputs. Put differently, this is not a question of whether Keyfactor is strategically
              relevant. It is. The question is whether an investor is being asked to pay as if the company’s growth
              durability, margin path, and concentration are already proven. Public evidence does not justify that kind
              of blind premium. A disciplined investor should stay constructive on the asset, but insist on sharper
              valuation support and downside protections before underwriting a top-of-range outcome.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
