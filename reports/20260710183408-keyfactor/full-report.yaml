      - number: '7.2'
        title: Legal, regulatory, and customer risks center on compliance posture and reference-account exposure
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s public legal and regulatory profile is not dominated by known litigation, but that should not
              be confused with low exposure. The company’s privacy policy makes clear that it handles personal and
              business data across website, event, marketing, and service interactions, which creates baseline privacy
              and cross-border processing obligations. The government and regulated-enterprise positioning creates a
              second layer of exposure. FedRAMP authorization is a valuable signal, yet it also becomes a monitorable
              dependency: if the authorization posture deteriorates or supporting controls weaken, the company could
              lose credibility in exactly the customer set it wants to deepen. On the customer side, public proof is
              concentrated in large, reference-grade organizations across banks, government agencies, industrial groups,
              and platform providers. That is strategically positive, but it also implies potential concentration, heavy
              procurement, and demanding support expectations. Public evidence is insufficient to determine whether the
              customer base is diversified enough to absorb a major renewal loss. In that sense, legal and customer risk
              are linked: the more Keyfactor leans into regulated buyers, the more trust, documentation, and
              certification maintenance become revenue-critical obligations.
            claimRefs:
