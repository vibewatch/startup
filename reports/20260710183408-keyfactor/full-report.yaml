      - number: '2.3'
        title: Who Buys, Who Uses, and How Adoption Typically Starts
        blocks:
          - type: paragraph
            body: >
              The buyer journey for this market is cross-functional even when budget authority ultimately sits with
              security leadership. Certificate, PKI, and machine identity platforms are usually championed by PKI
              architects, certificate operations teams, security engineering, or platform engineering groups that feel
              the operational pain directly. Budget approval typically routes through the CISO organization,
              infrastructure leadership, or government/compliance owners in regulated environments. Product pages from
              DigiCert, Sectigo, CyberArk, and Keyfactor all point to the same multi-stakeholder adoption path: first
              discover and inventory what exists, then centralize policy and visibility, then automate issuance and
              renewal, and finally extend governance into cloud workloads, developer tooling, device identity, and
              post-quantum preparation. Vertical demand also clusters in predictable places. TBRC explicitly lists
              finance, healthcare, government, IT/telecom, and manufacturing as major CLM industries. Keyfactor’s own
              customer proof maps cleanly onto those segments, and CyberArk’s 2025 survey suggests AI, cloud, and
              workload growth are pushing security teams to revisit machine identities even outside classical PKI-heavy
              sectors. The market therefore behaves less like discretionary tooling and more like infrastructure
              modernization with compliance, outage prevention, and cryptographic agility attached.
