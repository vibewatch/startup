      - number: '1.5'
        title: Milestones, Federal Validation, and Adverse Context
        blocks:
          - type: paragraph
            body: >
              The milestone record supports a view of Keyfactor as a maturing category leader, but it also surfaces the
              kinds of adverse evidence an investor cannot ignore. Positive milestones are substantial: the 2018 rebrand
              formalized the software pivot, the 2019 Insight round funded expansion, the 2023 Sixth Street investment
              pushed the company to a disclosed $1.3 billion enterprise value, May 2026 brought FedRAMP Moderate
              authorization for Government CLAaaS, June 2026 introduced the Trust Control Plane narrative, and July 2026
              delivered a Summit-led $1B+ strategic growth investment. Yet the adverse record is not zero. Keyfactor’s
              support portal lists a May 2026 EJBCA MPIC compliance issue and multiple 2025 SignServer advisories, while
              OpenCVE aggregates security findings that include historical Keyfactor Command SQL injection and
              access-control issues as well as several SignServer vulnerabilities. None of these sources indicate a
              catastrophic public breach, but they do show that Keyfactor operates in a product category where trust
              claims are continuously tested by implementation defects, compliance edge cases, and patch-management
              discipline. The right framing is therefore not “no risk,” but rather “enterprise platform with real proof
              and real attack surface,” which is exactly the balance later risk and valuation chapters need to preserve.
