        title: Direct peer profiles and strategic directions
        blocks:
          - type: paragraph
            body: >
              The direct-peer set is differentiated more by operating model and channel than by the basic idea of
              certificate automation. ABI says Keyfactor wins on flexibility, CA agnosticism, PKI-IoT applications, and
              cryptographic discovery. Entrust is presented as the broadest platformized incumbent with deep
              integrations and consultancy. DigiCert brings public-trust PKI heritage, global scale, and a modern Trust
              Lifecycle Manager pitch built around discovery, governance, and automation across any CA or trust store.
              Sectigo emphasizes a CA-agnostic CLM layer, public CA services, 50+ integrations, and cloud-first
              deployment. AppViewX frames machine identity management as certificates and keys across devices,
              workloads, applications, and IoT, highlighting the operational risk of expired certificates and manual
              management. CyberArk’s machine identity security platform moves even further upstack by combining secrets,
              certificates, workload identities, and SSH keys, while the 2024 Venafi acquisition shows it can now sell
              those capabilities inside a larger identity-security suite. HashiCorp and Smallstep should not be ignored
              just because their starting points are more developer-centric. Vault’s PKI engine supports dynamic
              issuance, short TTLs, and standard issuance protocols, while Smallstep’s hardware-backed device identity
              and AI-agent messaging point to a strong fit with modern Zero Trust and cloud-native programs.
