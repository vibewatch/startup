  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
        blocks:
          - type: paragraph
            body: >
              The buyer can solve Keyfactor’s job in at least five ways, which is why a narrow “Venafi versus Keyfactor”
              frame is insufficient. First are direct enterprise PKI and CLM peers: Entrust, DigiCert, Sectigo,
              AppViewX, and historically Venafi. Second are broader identity-security incumbents like CyberArk, which
              now owns Venafi and can bundle certificate and machine identity controls into a larger privileged-access
              narrative. Third are cloud-native and developer-led adjacencies such as HashiCorp Vault PKI and Smallstep,
              which excel in short-lived certificates, API workflows, and device or workload identity. Fourth are
              infrastructure-provider substitutes like AWS Private CA and Microsoft Active Directory Certificate
              Services, which can satisfy a meaningful portion of private CA and internal certificate needs without
              buying a full independent control plane. Fifth is the status quo itself: spreadsheets, siloed CA consoles,
              and manual certificate handling inside platform or infrastructure teams. ABI Research’s 2025 ranking is
              useful because it recognizes the field’s breadth: Keyfactor, Entrust, and DigiCert lead; Garantir,
              Sectigo, and AppViewX follow; and CyberArk, GlobalSign, Ascertia, eMudhra, and HID remain mainstream. That
              is not a winner-take-all market. It is a layered market where buyer context determines what “good enough”
              looks like.
