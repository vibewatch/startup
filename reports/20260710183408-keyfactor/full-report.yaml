        blocks:
          - type: paragraph
            body: >
              Keyfactor’s trust posture is unusually observable for a private company because it exposes multiple
              quality-control surfaces. The company has a public security-advisories section, public product
              documentation, public community repositories, and a public FedRAMP announcement for its government
              offering. Those are meaningful controls because they show a product organization willing to document
              issues and operational guardrails rather than hiding all evidence behind sales channels. At the same time,
              the same transparency also reveals technical risk. The security-advisory page lists multiple 2025 and 2026
              issues affecting EJBCA and SignServer, including the EJBCA MPIC compliance issue and several SignServer
              vulnerabilities. OpenCVE also aggregates disclosed issues across Command, SignServer, EJBCA, and AWS
              Orchestrator. This does not prove product weakness relative to peers—serious infrastructure software will
              always carry vulnerability management obligations—but it does show that customers need disciplined upgrade
              and patch operations. In other words, Keyfactor’s trust posture is credible partly because the company
              discloses risk, but the disclosed risk is real and should be treated as part of implementation and support
