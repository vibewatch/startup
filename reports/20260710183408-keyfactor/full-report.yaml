      - number: '1.3'
        title: Funding History, Capital Formation, and Traction Signals
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s financing history shows a company that moved from software growth equity to large-cap
              strategic capital while keeping existing sponsors involved. In January 2019 the company closed a $77
              million growth round from Insight Venture Partners shortly after its rebrand, and management used that
              announcement to say Keyfactor had doubled revenue year over year and was securing more than 500 million
              certificates for Global 2000 clients. In October 2023 Keyfactor announced a significant minority
              investment from Sixth Street Growth at an enterprise value of approximately $1.3 billion; management
              additionally claimed more than 1,500 organizations used its solutions and that three-year revenue CAGR
              exceeded 70%. The next and most important step arrived on July 6, 2026, when Summit Partners led a $1B+
              strategic growth investment and existing investors Insight Partners and Sixth Street Growth retained
              significant ownership. The company described the business as scaling from a position of strong
              profitability and accelerating year-over-year revenue growth, but it still did not disclose absolute ARR,
              revenue, cash, debt, or transaction structure beyond the strategic growth framing. That omission is
              critical for later financial and valuation work: public capital milestones are clear, but underwriting
              still depends on management access for revenue quality, margin structure, and cap-table detail.
