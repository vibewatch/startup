      - number: '6.2'
        title: Named customer proof is unusually specific and production-oriented
        blocks:
          - type: paragraph
            body: >
              The most persuasive part of Keyfactor’s customer evidence is not the count of logos; it is the specificity
              of the outcomes. ServiceNow describes millions of certificates issued across services and workloads with
              API-driven issuance and renewal. Siemens reports an 85% reduction in deployment time after automating PKI
              as code with EJBCA and Ansible. OVHcloud says it achieved full internal PKI control while supporting more
              than 1.5 million developers and 10,000-plus certificates. SK ID Solutions says it migrated 20 million
              certificates across more than 20 countries with zero incidents since implementation. The Netherlands
              Ministry of Justice and Security highlights 15-plus years of PKI operations supported by EJBCA across
              passports, visas, internal IT services, and digital health certificates. GRENKE reports 25,000-plus
              centrally managed active certificates, provisioning in under five minutes, and zero certificate-related
