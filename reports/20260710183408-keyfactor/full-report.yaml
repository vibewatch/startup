  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Security trust failure
        - Critical exploited platform vulnerability or repeated severe advisories
        - Undermines trust-infrastructure thesis
        - Pause or materially re-price
      - - Retention / concentration disappointment
        - NRR or top-customer exposure materially worse than expected
        - Reduces quality of growth and exit logic
        - Lower target entry valuation or walk away
      - - Regulated-growth slowdown
        - Meaningful slippage in government / banking pipeline or authorization posture
        - Weakens the strongest reference segments
        - Reduce bull-case probability
      - - Structure overhang
        - Preference stack or round terms materially worse than implied by headline narrative
        - Cuts common-equity upside
        - Demand structural protection or pass
      - - Bundle pressure
        - Win-loss deterioration against strategic suites
        - Compresses valuation ceiling
        - Lower base-case multiple and exit confidence
      - - Services-heavy scale
        - Implementation intensity rises faster than product leverage
        - Weakens margin path and sponsor exit quality
        - Recast business closer to services-enabled software
    notes: These triggers translate the risk chapter into valuation discipline.
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV032
      - CV036
      - CV037
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR and growth quality
        - Latest ARR, growth bridge, bookings, and revenue mix
        - Core input for any price-to-growth judgment
        - Finance team / data room
      - - Retention and concentration
        - NRR, GRR, churn, top-10 customer exposure, renewal calendar
        - Determines downside resilience and valuation durability
        - Finance + RevOps / data room
      - - Margin path
        - Gross margin by software, support, managed service, and professional services
        - Separates scalable software economics from services drag
        - Finance / data room
      - - Round structure
        - Primary versus secondary, preference stack, governance rights, dilution terms
        - Determines actual investor outcome at a given headline price
        - Legal + finance / transaction docs
      - - Competitive reality
        - Recent win-loss records against bundled and CA incumbents
        - Tests whether platform narrative holds in live deals
        - Sales ops / field interviews
      - - Security execution
        - Incident history, patch adoption, support SLAs, and remediation cadence
        - Trust-infrastructure multiple depends on execution quality
        - Security + support diligence
    notes: These diligence asks are the minimum needed to convert strategic interest into a priced investment view.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV033
      - CV038
      - CV040
