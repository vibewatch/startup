        title: 'Public verdict: strong strategic momentum, but incomplete underwriting package'
        blocks:
          - type: paragraph
            body: >
              On publicly available evidence alone, Keyfactor screens as a strong private cybersecurity asset with
              recurring enterprise demand, sponsor support, and credible signs of operating scale. The public case is
              strongest on category tailwinds, capital access, product breadth, and enterprise relevance. It is
              materially weaker on the inputs an investor would need to underwrite the next five years of financial
              performance: current ARR, net revenue retention, gross margin by product line, services mix, CAC, payback,
              partner economics, concentration, and cash generation. The TEI study is helpful because it shows why
              enterprise buyers may fund the purchase, but it is commissioned customer ROI evidence, not company
              income-statement evidence. Public substitute pricing from AWS also shows that part of the broader trust
              market exposes buyers to more transparent infrastructure-native economics, which can put a ceiling on how
              much opaque enterprise pricing can expand without clear ROI. The correct public verdict is therefore
              neither bearish nor fully underwritten. Keyfactor appears financially healthy and strategically
              well-funded, but there are still enough disclosure gaps that an investor should treat valuation confidence
