      - number: '7.3'
        title: Operational and dependency risks arise from upgrades, HSMs, clouds, partners, and hybrid complexity
        blocks:
          - type: paragraph
            body: >
              The public technical record shows that Keyfactor’s architecture is mature but not simple. Recent EJBCA and
              SignServer materials document Java and application-server upgrades, composite-certificate support,
              CloudHSM improvements, and continuing release work around migration and automation. Those are positive
              roadmap indicators, but they also reveal operational failure modes: stack upgrades can break deployments,
              HSM integration can slow or complicate rollouts, and hybrid customer estates magnify the consequences of
              misconfiguration. Customer case studies themselves underscore how complex the starting environment often
              is: multiple PKI systems, legacy platforms, self-signed certificates, distributed CAs, or siloed signing
              tools. That complexity is one reason customers buy Keyfactor, but it also means implementation quality and
              support maturity are fundamental risk mitigants. Partner and ecosystem motion adds another layer. If key
              integrations, partner workflows, or cloud dependencies weaken, the platform may still function but lose
              deployment speed, referenceability, or go-to-market leverage. The presence of open-source community
              editions further complicates the picture: they are a powerful adoption surface, yet they also create
              support-boundary and self-managed deployment risk when customers underinvest in enterprise operational
              discipline.
