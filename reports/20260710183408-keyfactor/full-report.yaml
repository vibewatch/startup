      - number: '6.4'
        title: Public customer quality is strong, but concentration and procurement risk remain open questions
        blocks:
          - type: paragraph
            body: >
              The same evidence that makes Keyfactor attractive also highlights what outsiders still cannot see. Public
              proof skews toward large, reference-grade organizations, which supports enterprise credibility but also
              raises the possibility that revenue concentration, long sales cycles, and procurement complexity matter
              more than the public record shows. Keyfactor’s vertical concentration looks strongest in regulated
              environments: financial services, public sector, infrastructure, manufacturing, and large software
              estates. Those are strong segments, but they often bring compliance scrutiny, renewal rigor, and slower
              procurement. Government and large-bank opportunities can be sticky and high-value, yet they can also
              create dependence on certification maintenance, partner ecosystems, and heavyweight implementation
              resources. The partner surface also implies that some expansion may rely on channel and integration
              relationships rather than purely direct self-propelled demand. Because public sources do not reveal
              top-customer exposure, cohort economics, or contract structure, the correct customer verdict is positive
              but incomplete: Keyfactor has better public production proof than many private cybersecurity peers, but
              concentration and renewal quality still need direct diligence.
