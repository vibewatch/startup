      - number: '1.4'
        title: Portfolio Breadth and Reference-Quality Customer Evidence
        blocks:
          - type: paragraph
            body: >
              The company overview chapter must establish enough product and customer ground truth to support later
              technical and commercial chapters without importing foreign claim IDs. Product evidence shows a layered
              architecture. Command is a CA-agnostic control plane for discovery, governance, and lifecycle automation
              across SSH, TLS, and client certificates. EJBCA Enterprise is the underlying scalable PKI platform with
              cloud, on-prem, self-managed, and as-a-service deployment options. SignServer Enterprise extends the
              portfolio into code, document, container, firmware, and ePassport signing with centralized HSM-backed key
              control. Cloud PKI as-a-Service and the government-focused CLAaaS offer managed deployment options for
              buyers that want faster time-to-value or lighter operational lift. Customer proof is also stronger than
              generic logo pages. Siemens reports an 85% reduction in PKI deployment time with automated EJBCA
              deployment. ServiceNow says EJBCA enabled dynamic certificate issuance across services and workloads while
              removing dozens of engineering hours of manual work. OVHcloud uses EJBCA to centralize PKI for a sovereign
              cloud footprint that supports 1.5+ million developers and 10K+ certificates. SK ID migrated 20 million
              certificates and reports zero PKI incidents since rollout, while the Netherlands Ministry of Justice and
              Security cites 15+ years of PKI operations on EJBCA. These are material proof points because they show
              regulated, infrastructure-heavy, and national-scale use cases rather than only pilot customers.
