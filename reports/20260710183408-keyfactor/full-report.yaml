      - number: '7.4'
        title: Financial and investment risk hinges on opacity, bundle pressure, and measurable kill triggers
        blocks:
          - type: paragraph
            body: >
              The financial-model risk is less about imminent insolvency and more about what public evidence still
              cannot verify. Sponsor backing from Insight, Sixth Street, and Summit reduces immediate capital-risk
              anxiety, but public sources do not disclose ARR, NRR, churn, cash, burn, gross margin, or top-customer
              exposure. That is important because bundle pressure from CyberArk/Venafi, DigiCert, and cloud-native
              substitutes can affect pricing power, implementation scope, and renewal economics before it shows up in
              top-line headlines. In a trust-infrastructure business, a single major security incident, certification
              setback, or marquee-customer renewal failure can also transmit disproportionately into valuation because
              the market reads those events as product-trust failures, not ordinary SaaS noise. The correct investment
              posture is therefore to convert the broad risk list into measurable triggers: material breach or exploited
              vulnerability, FedRAMP slippage, sharp slowdown in regulated-vertical wins, contraction in sponsor
              support, or evidence that expansion depends on services-heavy custom work rather than scalable product
              leverage. Those are the risk events most likely to break the thesis, not generic macro softness alone.
