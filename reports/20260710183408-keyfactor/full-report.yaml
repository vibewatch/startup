      - number: '8.3'
        title: Bull/base/bear cases depend more on evidence quality than on market size alone
        blocks:
          - type: paragraph
            body: >
              The valuation debate should be scenario-led because public evidence quality is uneven across the most
              important drivers. The bull case assumes that Keyfactor’s trust-infrastructure platform becomes a
              category-defining control plane for regulated enterprises and governments, that ARR growth remains strong,
              and that customers expand from PKI modernization into signing, discovery, and post-quantum programs. In
              that case, a valuation well above the 2023 anchor is easy to rationalize. The base case assumes continued
              strategic relevance but still treats retention, margin, and concentration as unresolved diligence items;
              that case supports a measured step-up rather than an aggressive re-rating. The bear case is not “the
              market disappears.” It is that bundle pressure, services intensity, or evidence gaps prove that Keyfactor
              is less scalable and less durable than the sponsor narrative implies, which could leave valuation support
              closer to the 2023 mark than headline excitement suggests. This is why recommendation confidence must stay
              moderate rather than high. The downside is driven less by category demand than by what diligence could
              still reveal about economics and customer mix.
