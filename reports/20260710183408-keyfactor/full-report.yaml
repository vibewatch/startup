  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Operating Focus
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s canonical corporate history is unusually important because the company’s present positioning
              sits on top of a long PKI operating history rather than a newly formed AI-security startup narrative. The
              business was founded in 2001 as Certified Security Solutions (CSS), then rebranded as Keyfactor in
              November 2018 as management shifted the story from consulting roots toward a software-led digital identity
              platform. By 2026 the company describes itself as the leader in trust infrastructure for AI and machines
              and frames its core problem as enterprise control over machine identities, certificates, cryptographic
              assets, and post-quantum transition planning. Product pages show that the operating center of gravity is a
              portfolio rather than a single point tool: Keyfactor Command for certificate lifecycle automation, EJBCA
              Enterprise for PKI, SignServer Enterprise for signing workflows, and cloud-delivered PKI and
              government-specific offerings. Scale claims also matter because they anchor later market, customer, and
              valuation analysis. The July 2026 Summit transaction announcement says Keyfactor manages billions of
              machine identities each year for more than 2,500 customers worldwide and serves over 40% of the Fortune
              100, 50% of the largest banks in the U.S. and Europe, and 80% of leading U.S. retailers. The January 2026
              Michael Volanoski appointment adds a separate operating-footprint datapoint: 540+ employees across 12
              countries.
