  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Counts as the Addressable Problem
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s market should not be defined so narrowly that it ignores adjacent spend, nor so broadly that
              it collapses into generic cybersecurity or identity software. The core budget line is certificate
              lifecycle management (CLM): software that automates issuance, renewal, monitoring, and governance for TLS,
              code-signing, email, and client certificates across enterprise infrastructure. The Business Research
              Company’s 2026 market framing is useful because it explicitly includes deployment models, organization
              sizes, and regulated verticals where Keyfactor is strongest, while excluding unrelated human-identity
              workflows. That core CLM layer sits inside a broader enterprise PKI and machine identity management
              problem. AppViewX’s educational material and CyberArk’s machine identity messaging both describe the same
              underlying challenge: machines, workloads, containers, APIs, applications, and IoT devices all
              authenticate with certificates, keys, secrets, or related cryptographic identities that must be
              discovered, governed, and renewed. Keyfactor’s own messaging pushes even further into “trust
              infrastructure,” adding crypto-agility, cryptographic discovery, and post-quantum readiness. The right
              boundary, therefore, is a layered one: core CLM spend today, broader machine identity control-plane spend
              around it, and PQC migration budget as the fastest-growing adjacency rather than the present-day revenue
              core.
