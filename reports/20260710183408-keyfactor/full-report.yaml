      - number: '8.4'
        title: Exit paths are credible, but final underwriting still depends on missing core data
        blocks:
          - type: paragraph
            body: >
              Exit logic is credible on both strategic and financial paths. A strategic buyer thesis exists because
              machine identity, certificate management, signing, and crypto-agility increasingly matter to larger
              security and infrastructure vendors. The Venafi acquisition proves that appetite. A sponsor-to-sponsor
              path is also plausible because Keyfactor already fits the profile growth-equity firms like to own:
              software-heavy, category tailwind, regulated-customer proof, and room for product expansion plus M&A. But
              exit readiness is not the same as underwriting readiness. Before an investor should bless a premium
              valuation, the diligence burden is straightforward: confirm current ARR and growth quality, quantify net
              retention and customer concentration, separate software margin from managed-service drag, and test whether
              the platform scales through product leverage or through services-heavy implementation. Until those
              questions are answered, the company may deserve attention and access, but not blind valuation generosity.
              The correct final ask is not “is this a good company?” It is “what exact price and structure convert
              strong strategic evidence into an investable risk-adjusted return?”
