      - number: '2.2'
        title: 'Sizing Lenses: Core CLM Today, PQC and Machine Identity as Adjacencies'
        blocks:
          - type: paragraph
            body: >
              The most defensible published sizing lens for Keyfactor’s near-term category is the CLM software market,
              not the entire cybersecurity stack. The Business Research Company estimates the category at $6.19 billion
              in 2026, up from $5.23 billion in 2025, and projects growth to $11.05 billion by 2030. That framing is
              broad enough to include the certificate types and verticals Keyfactor targets, but still narrower than the
              full machine identity problem. A second, adjacent lens is post-quantum cryptography. MarketsandMarkets
              projects the PQC market from $0.42 billion in 2025 to $2.84 billion by 2030 at 46.2% CAGR; that spend is
              not yet interchangeable with CLM revenue, but it directly influences Keyfactor’s category narrative
              because migration projects begin with certificate inventories, cryptographic discovery, and governance. A
              third lens is operational urgency rather than revenue size. CyberArk’s 2025 Identity Security Landscape
              says machine identities outnumber humans by 82 to 1, 42% have sensitive or privileged access, and 87% of
              surveyed organizations experienced at least two successful identity-centric breaches in the prior year.
              Those numbers do not define TAM on their own, but they explain why CLM, PKI, and machine identity tooling
              have moved from niche PKI admin pain into board-level resilience and compliance budgets.
