      - number: '3.3'
        title: Capability breadth, packaging opacity, and distribution power
        blocks:
          - type: paragraph
            body: >
              Across the field, headline capability overlap is high, but packaging and distribution are not. Keyfactor
              combines CLM, enterprise PKI, code/document signing, and managed/cloud deployment options in one
              independent portfolio. DigiCert and Sectigo have the advantage of public-CA relationships, installed
              trust, and broader certificate procurement channels. CyberArk/Venafi can sell machine identity security
              inside broader identity programs and cross-sell through privileged-access relationships. HashiCorp, AWS,
              and Microsoft have strong embedded positions because platform teams may already standardize on Vault, AWS,
              or AD CS for adjacent reasons. Public pricing is generally opaque among enterprise vendors: Keyfactor,
              DigiCert, Sectigo, CyberArk/Venafi, Entrust, and Smallstep all drive buyers to demos, sales calls, or
              tailored proposals. That makes price competition hard to benchmark externally. The clearest substitute
              economics come from infrastructure-native options such as AWS Private CA, whose appeal is operational
              integration, and from lower-friction products like ManageEngine Key Manager Plus, which emphasizes rapid
              deployment, SaaS or on-prem availability, and bundled certificate plus SSH/PGP key management. The net
              result is that competition is often won through channel access, incumbent trust, deployment fit, and
              total-operating-model simplicity rather than a visible per-certificate list price.
