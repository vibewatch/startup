  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack maps to real trust-infrastructure workflows
        blocks:
          - type: paragraph
            body: >
              Keyfactor’s product definition is best understood as a workflow stack, not a single SKU. Customers use
              Command to discover, automate, and govern machine identities and certificates across enterprise estates.
              EJBCA Enterprise anchors certificate authority and private PKI workflows, while SignServer Enterprise
              addresses adjacent but strategically important signing workflows such as code signing, document signing,
              timestamping, firmware signing, and other artifact-trust use cases. Cloud PKI as-a-Service and the
              government-focused certificate lifecycle automation offering reduce infrastructure burden for customers
              that do not want to run the underlying PKI stack themselves. The newer Trust Control Plane narrative
              attempts to unify these surfaces into one control layer for machine identities, cryptographic assets, and
              trust systems. That matters in customer workflow terms because the buyer problem is rarely “issue a
              certificate” in isolation; it is usually discover what exists, automate issuance and renewal, preserve
              signing trust, migrate cryptography safely, and keep policy control as environments grow more hybrid and
              AI-driven. The stack therefore spans both operational trust plumbing and higher-level governance.
