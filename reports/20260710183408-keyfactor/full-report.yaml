        - Shows how the market values scaled identity-security platforms
        - Not a direct revenue or margin multiple for Keyfactor
      - - Okta public market cap
        - Public equity value
        - $24.34B
        - Relevant identity-security reference for premium software sentiment
        - Different product mix and scale
      - - Rubrik public market cap
        - Public equity value
        - $17.31B
        - Cloud-security comp with enterprise profile
        - Different data-protection category
      - - Palo Alto Networks public market cap
        - Public equity value
        - Large-cap platform benchmark
        - Shows upper-bound platform premium context
        - Far larger and more diversified than Keyfactor
      - - Zscaler public market cap
        - Public equity value
        - Large-cap cloud-security benchmark
        - Shows premium market appetite for security growth
        - Different architecture and GTM
      - - SentinelOne public market cap
        - Public equity value
        - Endpoint-security growth benchmark
        - Helps frame private-security pricing context
        - Category mismatch and different maturity
    notes: These are valuation anchors and sentiment references, not direct apples-to-apples pricing formulas for Keyfactor.
