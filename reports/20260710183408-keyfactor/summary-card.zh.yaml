  topStrengths:
    - 品类紧迫性强：机器身份蔓延、证书有效期缩短、后量子迁移和监管压力，都支撑信任基础设施的结构性需求
    - 软件、工业、金融服务、基础设施、数字身份和政府领域都有参考级客户证据，支撑真实生产采用，而不只是 logo 营销
    - 产品栈覆盖 CLM、私有 PKI、签名、云交付和 Trust Control Plane 定位，让 Keyfactor 的平台故事宽过单一证书工具
    - Insight、Sixth Street 和 Summit 反复背书，支撑战略质量和融资可得性
    - FedRAMP Moderate 授权和受监管客户证据，增强公共部门和高保障场景可信度
    - EJBCA 与 SignServer 的开源根基，增强从业者信任和生态深度
  topRisks:
    - 公开证据未披露 ARR、NRR、毛利率、集中度或 2026 年融资结构，限制了估值和下行承保的精度
    - 信任悖论风险真实存在：一旦发生严重安全、可靠性或合规失误，公司核心价值主张会被直接削弱
    - 更大安全与身份平台的打包压力，可能压缩续约质量、定价权或最终退出兴趣
    - 受监管细分增长要靠政府和银行场景中的认证、支持质量和采购可信度撑住
    - 实施、升级以及 HSM 或混合环境复杂度，可能推高服务强度和运营负担
    - 公开客户证据很强，但偏向大型参考客户，集中度风险仍未解开
  unresolvedGaps:
    - 当前 ARR、收入结构、毛利率和现金流并未公开披露
    - 净留存、流失、合同期限和头部客户集中度仍属非公开信息
    - 2026 年交易中新股与老股比例、优先股堆叠和稀释条款并不公开
    - 对打包型竞争对手的近期赢单 / 输单数据不公开
    - 独立的正常运行时间、实施工作量和支持 SLA 数据没有公开来源
    - 托管服务与软件订阅收入的精确经济性仍不清楚
