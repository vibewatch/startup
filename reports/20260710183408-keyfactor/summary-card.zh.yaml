summary:
  headline: >
    Keyfactor 看起来是优质的私营信任基础设施资产：企业和政府采用证据真实，多轮 sponsor 验证，产品关联面也够宽；但公开证据仍留下
    ARR、留存、利润率、集中度和交易结构缺口，正确动作是带严格价格纪律继续研究，而不是无条件买入。
