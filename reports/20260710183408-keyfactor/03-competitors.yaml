      - ["CyberArk / Venafi", "Low", "Suite-led enterprise sales", "Machine identity plus broader identity-security platform", "Cross-sell power may outweigh product-level price transparency"]
      - ["DigiCert", "Low", "Tiered TLM packaging", "Discovery, governance, automation, support tiers", "Pricing likely tied to complexity and assurance level"]
      - ["Sectigo", "Low", "Platform plus public CA services", "CLM, public/private certs, integrations", "Can blend software and CA economics"]
      - ["HashiCorp Vault", "Medium", "Self-managed platform economics", "Dynamic PKI plus broader secrets platform", "May look cheaper on license but costlier in internal operating effort"]
      - ["AWS Private CA", "Medium", "Usage-oriented managed service", "Private CA hierarchy inside AWS", "Substitute is attractive where AWS footprint dominates"]
      - ["ManageEngine", "Medium", "SaaS or on-prem with bundled key management", "Certificate plus SSH/PGP management", "Competes on time-to-value and operational simplicity"]
    notes: "Public pages rarely provide apples-to-apples pricing. This table captures packaging posture and commercial implications rather than invented list prices."
