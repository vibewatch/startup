  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing"
      missingEvidence: "Apples-to-apples commercial terms, discounting behavior, and contract structures across Keyfactor, CyberArk/Venafi, DigiCert, Sectigo, and AppViewX."
      whyItMatters: "Competitive strength can be overstated if rivals are undercutting or bundling away the category in live deals."
      diligencePath: "Request recent competitive bake-off sheets, pricing exceptions, and procurement redlines from management."
      relatedQuestionRefs: [QP015, QP024]
    - type: "private-evidence-only"
      severity: "material"
      topic: "win-rates"
      missingEvidence: "Segmented win/loss rates by competitor class and deal size."
      whyItMatters: "Public positioning does not show whether Keyfactor wins against bundled suites, cloud-native substitutes, or status-quo incumbents in practice."
      diligencePath: "Review CRM-coded win/loss records and pipeline conversion by competitor over the last four quarters."
      relatedQuestionRefs: [QP023, QP024]
    - type: "missing-source"
      severity: "minor"
      topic: "entrust-detail"
      missingEvidence: "Richer current public product detail on Entrust’s packaging and deployment model beyond third-party summaries and ABI positioning."
      whyItMatters: "Entrust is a top-ranked competitor, but its live public surface was less transparent than peers during this run."
      diligencePath: "Request management’s current Entrust comparison materials and recent field intelligence from sales engineering."
      relatedQuestionRefs: [QP004, QP024]
    - type: "stale"
      severity: "minor"
      topic: "vendor-authored-comparisons"
      missingEvidence: "Independent user or analyst evidence validating vendor-authored claims about feature superiority and better value."
      whyItMatters: "Competitor pages are useful for packaging and positioning, but not enough to settle superiority claims."
      diligencePath: "Cross-check with customer references, review platforms, and analyst interviews in live diligence."
      relatedQuestionRefs: [QP007, QP024]
