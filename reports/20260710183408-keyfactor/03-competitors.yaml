      - ["Microsoft AD CS", "Status quo / substitute", "Windows-heavy enterprises", "Built-in PKI role and policy integration", "Operational burden rises in heterogeneous or multi-CA estates"]
      - ["ManageEngine Key Manager Plus", "Value competitor", "Cost-sensitive enterprise IT and security teams", "Fast deployment with certificate and SSH/PGP management", "Lower apparent strategic breadth than trust-infrastructure platforms"]
    notes: "The profile table mixes direct rivals, bundled incumbents, and substitutes because buyers routinely compare them inside the same purchasing process."
