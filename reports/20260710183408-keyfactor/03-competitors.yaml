    columns: ["Moat claim", "Threat", "Severity", "Why it matters", "Mitigation / diligence ask"]
    rows:
      - ["Independent CA-agnostic control plane", "Bundled suites from CyberArk/Venafi and DigiCert narrow standalone budgets", "high", "Platform vendors can amortize CLM inside broader identity or CA relationships", "Test win rates against bundled alternatives and verify attach rates"]
      - ["Breadth across CLM + PKI + signing", "Certificate automation commoditizes as shorter lifetimes force all vendors to automate", "high", "Simple renewal workflows may stop differentiating", "Verify discovery, signing, and PQC modules drive measurable expansion"]
      - ["Open-source and flexible deployment heritage", "Cloud-native buyers choose Vault, Smallstep, or AWS-native substitutes", "medium", "Developer-led teams may favor embedded tools over full enterprise suites", "Assess cloud-native feature velocity and developer adoption"]
      - ["Government and regulated credibility", "Incumbents add the same compliance messaging or public-sector channels", "medium", "Regulatory posture can be copied faster than deep product integration", "Track federal pipeline quality and certification maintenance costs"]
      - ["Reference-quality customers", "Competitors also display large-logo proof and broader distribution", "medium", "Logo counts alone do not secure future share", "Request cohort retention and expansion versus top rivals"]
    notes: "The main threat is not one superior feature, but convergence: competitors are broadening into each other’s territory while buyers demand more automation by default."
    claimRefs: [CP021, CP024, CP025, CP026, CP027, CP028, CP032, CP033, CP035, CP036, CP038]

