callouts:
  - calloutType: "insight"
    title: "The market is converging from both ends"
    body: "Independent CLM vendors are moving up into trust infrastructure while identity, CA, and cloud incumbents are moving down into machine identity automation."
    claimRefs: [CP008, CP010, CP012, CP021, CP028, CP036]
  - calloutType: "risk"
    title: "Bundled distribution is the clearest displacement risk"
    body: "CyberArk/Venafi and DigiCert can position certificate and machine identity controls inside larger incumbent buying motions that a standalone vendor must fight one account at a time."
    claimRefs: [CP008, CP009, CP021, CP028, CP036]
  - calloutType: "strength"
    title: "Keyfactor’s best defense is independent breadth"
    body: "Keyfactor is hardest to displace where buyers need CA-agnostic discovery, enterprise PKI, signing, managed deployment, and PQC readiness in one operating model."
    claimRefs: [CP017, CP018, CP019, CP020, CP025, CP032]

