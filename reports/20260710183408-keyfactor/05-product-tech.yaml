chapter:
  number: 5
  title: "Product & Technology"
  summary: "Keyfactor delivers a layered trust-infrastructure stack built around certificate lifecycle automation, enterprise PKI, digital signing, and managed deployment options. The technology story is credible because it combines commercial control planes with open-source roots in EJBCA and SignServer, public release documentation, and visible security-advisory practice. The main product risks are not whether the platform exists—it clearly does—but whether customers can absorb ongoing upgrade, integration, and crypto-agility complexity as Keyfactor expands into a broader Trust Control Plane."
sections:
  - id: product-stack-and-workflows
    title: "Product stack maps to real trust-infrastructure workflows"
    body: |
      Keyfactor’s product definition is best understood as a workflow stack, not a single SKU. Customers use Command to discover, automate, and govern machine identities and certificates across enterprise estates. EJBCA Enterprise anchors certificate authority and private PKI workflows, while SignServer Enterprise addresses adjacent but strategically important signing workflows such as code signing, document signing, timestamping, firmware signing, and other artifact-trust use cases. Cloud PKI as-a-Service and the government-focused certificate lifecycle automation offering reduce infrastructure burden for customers that do not want to run the underlying PKI stack themselves. The newer Trust Control Plane narrative attempts to unify these surfaces into one control layer for machine identities, cryptographic assets, and trust systems. That matters in customer workflow terms because the buyer problem is rarely “issue a certificate” in isolation; it is usually discover what exists, automate issuance and renewal, preserve signing trust, migrate cryptography safely, and keep policy control as environments grow more hybrid and AI-driven. The stack therefore spans both operational trust plumbing and higher-level governance.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE023, CE030, CE032]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001, FE002]

  - id: architecture-dependencies-and-maturity
    title: "Architecture relies on open-source foundations, commercial layers, and external dependencies"
    body: |
      Keyfactor’s architecture shows a deliberate combination of open-source community surfaces and commercial enterprise layers. The EJBCA and SignServer community repositories make clear that community editions are intended for learning, testing, and prototyping rather than production; enterprise editions add higher-assurance features, certifications, SLAs, auditability, and operational support. That is strategically useful because it gives Keyfactor a top-of-funnel developer and partner surface while preserving a paid enterprise boundary. The technical stack is concrete rather than hand-wavy. Public materials show Java-based application delivery, container and Helm deployment paths, software and SDK ecosystems around EJBCA, and HSM-oriented integrations in signing workflows. Recent release notes also show ongoing platform evolution: EJBCA Community 9.0 moved to newer application-server and Java prerequisites, while SignServer 7.6 added composite certificates, CloudHSM migration support, and new security fixes. Those details support real product maturity, but they also reveal dependency risk. Customers depend on app-server compatibility, Java runtime changes, HSM support, cloud integrations, and deployment discipline. That creates real implementation and upgrade burden even in a mature product family.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE016, CE017, CE018, CE026, CE034, CE035, CE037]
    tableRefs: [TE003]
    figureRefs: [FE003, FE004]

  - id: trust-controls-and-security-posture
    title: "Trust, quality, and security controls are visible, but so are patching obligations"
    body: |
      Keyfactor’s trust posture is unusually observable for a private company because it exposes multiple quality-control surfaces. The company has a public security-advisories section, public product documentation, public community repositories, and a public FedRAMP announcement for its government offering. Those are meaningful controls because they show a product organization willing to document issues and operational guardrails rather than hiding all evidence behind sales channels. At the same time, the same transparency also reveals technical risk. The security-advisory page lists multiple 2025 and 2026 issues affecting EJBCA and SignServer, including the EJBCA MPIC compliance issue and several SignServer vulnerabilities. OpenCVE also aggregates disclosed issues across Command, SignServer, EJBCA, and AWS Orchestrator. This does not prove product weakness relative to peers—serious infrastructure software will always carry vulnerability management obligations—but it does show that customers need disciplined upgrade and patch operations. In other words, Keyfactor’s trust posture is credible partly because the company discloses risk, but the disclosed risk is real and should be treated as part of implementation and support cost.
    claimRefs: [CE013, CE014, CE019, CE020, CE021, CE028, CE031, CE033]
    tableRefs: [TE004]
    figureRefs: []

  - id: differentiation-roadmap-and-gaps
    title: "Differentiation comes from breadth and crypto-agility, while public gaps remain around benchmarked performance"
    body: |
      The strongest technical differentiation is breadth under one operating umbrella. Keyfactor can credibly argue that it spans certificate lifecycle automation, private PKI, signing, managed deployment, government delivery, and crypto-agility rather than merely offering a narrow renewal engine. The open-source project surfaces for EJBCA and SignServer strengthen that argument because they show ecosystem depth and a practitioner on-ramp that most purely proprietary vendors do not have. Product materials also indicate active work around post-quantum readiness, composite certificates, CloudHSM-backed signing, SaaS delivery, and tighter integration between discovery and lifecycle automation. Those are sensible roadmap directions given certificate-lifetime compression and the need to modernize legacy PKI estates. The biggest public gaps are not basic existence or category fit, but independent evidence on performance, uptime, and implementation effort at scale. There is no public architecture benchmark proving throughput or deployment times across the stack, and there is no detailed public reference architecture for Trust Control Plane that resolves how much customers must still integrate themselves. So the product story is mature and credible, but not fully benchmarked for diligence purposes.
    claimRefs: [CE015, CE022, CE024, CE025, CE027, CE029, CE036, CE038]
    tableRefs: [TE005]

