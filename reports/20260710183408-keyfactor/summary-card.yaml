summary:
  headline: >
    Keyfactor appears to be a strong private trust-infrastructure asset with real enterprise and government proof,
    repeated sponsor validation, and broad product relevance—but public evidence still leaves enough ARR, retention,
    margin, concentration, and structure gaps that the right call is research-more with strict price discipline rather
    than an unconditional buy.
