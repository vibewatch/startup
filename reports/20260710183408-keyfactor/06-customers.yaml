company:
  name: "Keyfactor"
chapter:
  number: 6
  title: "Customers"
  summary: "Keyfactor’s public customer record supports real enterprise adoption across financial services, software, manufacturing, cloud infrastructure, digital identity, and government. The strongest proof comes from detailed case studies with operational outcomes—millions of certificates, zero-incident migrations, materially faster deployments, and reduced signing cost—rather than from generic logo walls. The public record is strong on production proof and weak on retention, concentration, and contract economics, so customer-quality conviction is positive but not fully underwritten."
sections:
  - id: segment-map-and-buyer-profile
    title: "Customer base spans regulated enterprise, software, infrastructure, and government"
    body: |
      Keyfactor’s public customer story is broad enough to support a category platform thesis rather than a niche point-solution thesis. Company materials say Keyfactor serves more than 2,500 customers globally and has deep penetration in financial services, banking, technology, healthcare, telecom, retail, and U.S. federal environments. The named-customer proof fits that segmentation. ServiceNow represents large-scale software and platform operations. Siemens and Schneider Electric show industrial and device-trust use cases. OVHcloud and SK ID Solutions show infrastructure-heavy and sovereign or digital-identity contexts. M&T Bank and GRENKE demonstrate financial-services relevance, while the Netherlands Ministry of Justice and Security shows long-duration public-sector trust. In buyer terms, the payer is usually the security or infrastructure organization, the user is typically PKI, platform, DevOps, or signing teams, and the budget rationale is outage prevention, compliance, zero-trust readiness, or trust-platform modernization. This breadth matters because it suggests Keyfactor can land through multiple operational pain points, not only through one vertical-specific use case.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]

  - id: named-customer-proof
    title: "Named customer proof is unusually specific and production-oriented"
    body: |
      The most persuasive part of Keyfactor’s customer evidence is not the count of logos; it is the specificity of the outcomes. ServiceNow describes millions of certificates issued across services and workloads with API-driven issuance and renewal. Siemens reports an 85% reduction in deployment time after automating PKI as code with EJBCA and Ansible. OVHcloud says it achieved full internal PKI control while supporting more than 1.5 million developers and 10,000-plus certificates. SK ID Solutions says it migrated 20 million certificates across more than 20 countries with zero incidents since implementation. The Netherlands Ministry of Justice and Security highlights 15-plus years of PKI operations supported by EJBCA across passports, visas, internal IT services, and digital health certificates. GRENKE reports 25,000-plus centrally managed active certificates, provisioning in under five minutes, and zero certificate-related outages. Schneider Electric reports a 10x reduction in software-signing cost, an 80% drop in key-ceremony cost, and support for more than one million signing events annually. M&T Bank reports 350,000-plus active certificates managed enterprise-wide and more than ten years of partnership. These are production-like outcomes, not pilot narratives.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021]
    tableRefs: [TU003, TU004]
    figureRefs: [FU002, FU003]

  - id: durability-expansion-and-gaps
    title: "Expansion logic is clear, but retention and satisfaction are largely undisclosed"
    body: |
      The public record suggests a strong land-and-expand motion even though classical SaaS retention metrics are absent. Several customer stories begin with one operational wedge—certificate visibility, PKI modernization, code signing, public-sector identity verification, or compliance modernization—and then expand into broader automation, governance, or future crypto-agility needs. M&T Bank’s more-than-ten-year relationship and the Netherlands Ministry’s 15-plus years of PKI operations are the clearest duration signals in the public record. OVHcloud’s case explicitly references open-source affinity and enterprise support, which is useful evidence that Keyfactor can convert community-compatible buyers into enterprise relationships. ServiceNow, Siemens, SK ID, Schneider, and GRENKE all describe operational integration deep enough that replacement would likely be difficult once workflows, policy, and trust anchors are centralized. Still, the public record does not disclose NRR, GRR, renewal rates, churn, contract length, or customer satisfaction metrics. That means durability is best inferred from workflow depth and relationship length rather than measured retention disclosure.
    claimRefs: [CU022, CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030]
    tableRefs: [TU005]

  - id: concentration-and-procurement-risk
    title: "Public customer quality is strong, but concentration and procurement risk remain open questions"
    body: |
      The same evidence that makes Keyfactor attractive also highlights what outsiders still cannot see. Public proof skews toward large, reference-grade organizations, which supports enterprise credibility but also raises the possibility that revenue concentration, long sales cycles, and procurement complexity matter more than the public record shows. Keyfactor’s vertical concentration looks strongest in regulated environments: financial services, public sector, infrastructure, manufacturing, and large software estates. Those are strong segments, but they often bring compliance scrutiny, renewal rigor, and slower procurement. Government and large-bank opportunities can be sticky and high-value, yet they can also create dependence on certification maintenance, partner ecosystems, and heavyweight implementation resources. The partner surface also implies that some expansion may rely on channel and integration relationships rather than purely direct self-propelled demand. Because public sources do not reveal top-customer exposure, cohort economics, or contract structure, the correct customer verdict is positive but incomplete: Keyfactor has better public production proof than many private cybersecurity peers, but concentration and renewal quality still need direct diligence.
    claimRefs: [CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038]
    tableRefs: [TU006]

