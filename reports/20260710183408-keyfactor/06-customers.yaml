figures:
  - id: FU001
    title: "Customer journey map"
    type: "journey-map"
    summary: "Customers typically begin with a trust pain point and expand into broader automation, PKI control, and signing or compliance workflows."
    data:
      nodes:
        - { id: "pain", label: "Pain point", description: "Customers typically start with certificate outages, legacy PKI complexity, signing fragmentation, or compliance pressure." }
        - { id: "land", label: "Initial deployment", description: "The first deployment is usually certificate visibility, PKI modernization, API issuance, or sovereign control over trust infrastructure." }
        - { id: "operate", label: "Operationalization", description: "Once deployed, teams automate renewal, standardize policy, improve auditability, and reduce manual operator effort." }
        - { id: "expand", label: "Expansion", description: "Broader trust complexity can then pull customers into signing, managed delivery, government use, or broader governance." }
    claimRefs: [CU004, CU010, CU011, CU012, CU013, CU023, CU029]

  - id: FU002
    title: "Adoption / deployment funnel"
    type: "flow"
    summary: "The customer path is usually operational pain to modernization, then to broader trust control and expansion."
    data:
      nodes:
        - { id: "pain", label: "Outages / manual PKI / fragmented trust" }
        - { id: "land", label: "Initial Keyfactor deployment" }
        - { id: "scale", label: "Automated issuance / centralized control" }
        - { id: "expand", label: "Broader governance, signing, or managed delivery" }
      edges:
        - { from: "pain", to: "land", label: "Modernization decision" }
        - { from: "land", to: "scale", label: "Production rollout" }
        - { from: "scale", to: "expand", label: "Land-and-expand" }
    claimRefs: [CU010, CU011, CU012, CU014, CU022, CU023, CU029]

  - id: FU003
    title: "Customer proof matrix"
    type: "matrix"
    summary: "Reference quality is high across the named sample, but financial durability disclosure is low."
    data:
      columns: ["Production maturity", "Outcome specificity", "Reference quality", "Retention visibility"]
