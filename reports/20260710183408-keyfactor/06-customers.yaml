        - { label: "Siemens", values: ["High", "High", "High", "Low"] }
        - { label: "OVHcloud", values: ["High", "High", "High", "Low"] }
        - { label: "SK ID", values: ["High", "High", "Medium", "Low"] }
        - { label: "Government / ministry", values: ["High", "Medium", "High", "Medium"] }
        - { label: "GRENKE / M&T", values: ["High", "High", "High", "Medium"] }
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU023, CU026]

