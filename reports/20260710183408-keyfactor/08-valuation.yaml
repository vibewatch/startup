      - ["Missing ARR, NRR, margin, and concentration data make precision difficult", "Anti-thesis", "A strong data room with durable cohorts and software-heavy margins would improve confidence"]
      - ["Bundle pressure from larger security platforms can compress budgets and exits", "Anti-thesis", "Sustained win rates in regulated segments versus bundled rivals would reduce concern"]
    notes: "The anti-thesis is primarily evidence-quality and scaling-risk driven, not market-denial driven."
    claimRefs: [CV002, CV003, CV005, CV006, CV008, CV023, CV028, CV032]

