      - ["Base", "Growth stays healthy, but public evidence gaps partly persist and margins / concentration are only moderate", "Supports a measured step-up from $1.3B rather than an unconstrained re-rating", "Retention or margin could disappoint", "Most consistent with current public evidence"]
      - ["Bear", "Growth quality is weaker than sponsor narrative, services intensity is high, or concentration is elevated", "Valuation support drifts back toward the last disclosed EV anchor", "Multiple compression and renewal pressure", "Cannot be ruled out without data-room proof"]
    notes: "Scenario logic is framed around what diligence could still discover, not just around market-size optimism."
    claimRefs: [CV011, CV014, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030]

