companyProfile:
  summary: |
    Keyfactor is a Cleveland-based cybersecurity company that helps enterprises and government
    agencies manage machine identities, cryptographic assets, certificate lifecycles, private
    PKI, and digital signing workflows. Its portfolio combines Keyfactor Command for lifecycle
    automation and governance, EJBCA Enterprise for private PKI and certificate authority
    operations, SignServer Enterprise for software and document signing, and managed cloud PKI
    and government delivery options. Public customer proof includes ServiceNow, Siemens,
    OVHcloud, SK ID Solutions, GRENKE, M&T Bank, Schneider Electric, and the Netherlands
    Ministry of Justice and Security. The company positions this portfolio as a unified Trust
    Control Plane for the AI and quantum era, and public evidence shows repeated sponsor support
    from Insight Partners, Sixth Street, and Summit Partners.
  foundedDate: "2001-01-01"
  founders:
    - name: "Kevin von Keyserling"
      role: "Co-Founder and former CEO"
      background: |
        Public 2019 financing materials identify Kevin von Keyserling as Chief Executive Officer
        and Co-Founder during the post-rebrand growth phase that followed the company’s shift
        from CSS to Keyfactor.
      claimRefs: [CO002]
  foundingLocation: "Cleveland, Ohio, USA"
  headquarters: "Cleveland, Ohio, USA"
  productSummary: |
    Keyfactor delivers a layered trust-infrastructure stack: Command for certificate lifecycle
    automation and machine-identity governance; EJBCA Enterprise for private PKI and certificate
    authority workflows; SignServer Enterprise for code, firmware, container, document, and
    other signing use cases; and cloud-delivered PKI plus government-focused certificate
    lifecycle automation for customers that want managed delivery. The company increasingly
    frames these capabilities as one Trust Control Plane spanning cryptographic discovery,
    issuance, governance, signing, and post-quantum readiness.
  customerFocus: >
    Large enterprises, regulated industries, financial services, software and cloud platforms,
    industrial and device-security organizations, digital-identity providers, and government
    agencies; served through enterprise direct sales, partner ecosystems, and managed-delivery
    motions.
  businessModel: >
    Enterprise software and managed-service model spanning certificate lifecycle management,
    private PKI, digital signing, and managed cloud deployment; likely sold through multi-year
    contracts with quote-led pricing, support, and possible services or implementation layers.
  stage: "Private growth-stage / sponsor-backed"
  fundingStatus: >
    $77M Insight growth round in January 2019; significant minority investment from Sixth Street
    in October 2023 at approximately $1.3B enterprise value; $1B+ Summit-led strategic growth
    investment in July 2026 with Insight and Sixth Street retaining significant ownership.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO011, CO015, CO024, CO028, CO030]

