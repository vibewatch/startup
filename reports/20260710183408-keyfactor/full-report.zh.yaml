      - number: '4.3'
        title: 资本充足性看起来强，但现金、消耗和利润率结构仍是私有信息
        blocks:
          - type: paragraph
            body: >
              资本故事比运营模型更清楚，但仍不完整。Keyfactor 2019 年从 Insight 融资 $77M，2023 年以约 $1.3B 企业价值引入 Sixth Street Growth，随后在 2026 年
              7 月宣布 Summit Partners 领投的 $1B+ 战略增长投资，并让 Insight 和 Sixth Street 继续作为重要股东。 这些事件强烈显示，公司近期不受资本约束，尤其是管理层和投资者把
              2026 年交易围绕产品创新、地域扩张、团队建设和战略收购来表述， 而不是紧急修补资产负债表。公开公告还描述了收入增长加速和创纪录盈利，这是方向性利好。不过，所有资本公告都没有披露账上现金、
              月度现金消耗、债务契约、跑道或自由现金流。成本结构也仍是推断，而非披露。相比硬件或支付基础设施公司，这类业务应当更轻资本开支， 但客户成功、合规、云托管、HSM
              支撑运营、伙伴支持和公共部门交付仍可能带来实质成本。结果是资本充足性信号有利，但真实利润率结构 和现金转化仍存在实质不透明。
