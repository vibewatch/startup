        - 机器身份教育强，CLM 深度高
        - 与 Keyfactor 套件相比，CLM 之外的广度不那么明显
      - - CyberArk / Venafi
        - 既有厂商 / 捆绑套件
        - 身份安全与机器身份买家
        - 身份套件更广，大企业渠道更强
        - 对较窄的 PKI 用例，可能更复杂且更依赖捆绑
      - - HashiCorp Vault PKI
        - 相邻方案 / 内部自建
        - 云原生平台团队
        - 动态短寿命证书，API / 协议支持深
        - 默认不是完整的企业 CLM 治理套件
      - - Smallstep
        - 相邻方案 / 专家型厂商
        - 零信任、设备身份、AI 工作负载项目
        - 硬件背书的短寿命设备与机器身份
        - 广义传统企业 PKI 治理证据较少
      - - AWS Private CA
        - 替代方案
        - 以 AWS 为中心的团队
        - 托管私有 CA，并与 AWS 原生集成
        - 不是独立的跨资产信任控制平面
      - - Microsoft AD CS
        - 现状 / 替代方案
        - Windows 占比较高的企业
        - 内置 PKI 角色与策略集成
        - 在异构或多 CA 资产中，运营负担会上升
      - - ManageEngine Key Manager Plus
        - 价值型竞争者
        - 对成本敏感的企业 IT 与安全团队
        - 部署快，覆盖证书和 SSH/PGP 管理
        - 相比信任基础设施平台，战略广度看起来较低
    notes: 画像表混合了直接对手、捆绑型既有厂商和替代方案，因为买家通常会在同一个采购流程里比较它们。
