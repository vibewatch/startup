      - number: '7.2'
        title: 法律、监管和客户风险集中在合规姿态与标杆客户敞口
        blocks:
          - type: paragraph
            body: >
              Keyfactor
              的公开法律和监管画像并未被已知诉讼主导，但这不等于敞口低。公司的隐私政策写明，它在网站、活动、营销和服务互动中处理个人和企业数据，由此产生基础隐私和跨境处理义务。政府和受监管企业定位构成第二层敞口。FedRAMP
              授权是有价值的信号，但也会变成可监测的依赖：如果授权姿态恶化，或支撑控制变弱，公司会在正想深化的客户群里失去可信度。客户侧，公开验证集中在银行、政府机构、工业集团和平台提供商等大型、可背书组织。战略上是正面信号，但也意味着潜在集中、重采购和高支持要求。公开证据不足以判断客户基础是否足够多元，能吸收一次重大续约流失。从这个意义上说，法律风险和客户风险相连：Keyfactor
              越向受监管买家倾斜，信任、文档和认证维护就越会成为收入关键义务。
