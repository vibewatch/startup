        title: 退出路径可信，但最终投资测算仍取决于缺失的核心数据
        blocks:
          - type: paragraph
            body: >
              从战略和财务两条路径看，退出逻辑都可信。战略买家假设成立，因为机器身份、证书管理、签名和密码敏捷性对更大的安全和基础设施厂商越来越重要。Venafi 收购证明了这种胃口。赞助方转赞助方路径也合理，因为
              Keyfactor
              已符合成长股权机构喜欢持有的画像：软件占比高、有品类顺风、受监管客户验证充分，还有靠产品扩张和并购继续增长的空间。但退出准备就绪不等于投资测算准备就绪。投资者要认可溢价估值之前，尽调负担很直接：确认当前 ARR
              和增长质量，量化净留存和客户集中度，把软件利润率与托管服务拖累拆开，并测试平台是靠产品杠杆扩展，还是靠服务很重的实施扩展。在这些问题得到回答之前，公司也许值得关注和接触，但不值得盲目给予估值宽容。正确的最终提问不是“这是不是一家好公司？”而是“什么精确价格和结构，能把强战略证据转化为可投资的风险调整回报？”
