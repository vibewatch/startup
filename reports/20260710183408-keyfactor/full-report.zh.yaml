  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式指向经常性软件叠加托管信任服务
        blocks:
          - type: paragraph
            body: >
              Keyfactor 的公开产品组合支持一种经常性企业软件收入模式，并带有分层变现，而不是单产品 SKU 故事。Command 是证书生命周期 自动化和机器身份治理的运营层。EJBCA Enterprise
              通过自托管、托管和云交付模式下的私有 PKI 部署与管理变现。SignServer 将变现 扩展到代码、固件、文档和容器签名；Cloud PKI as-a-Service
              和政府云证书生命周期自动化产品，又在软件之上增加托管服务收入。 这很重要，因为业务不太可能依赖一个狭窄的证书续期工作流；它销售的是更宽的信任基础设施控制平面。公开定价仍不透明，所以订阅、
              支持、服务和托管运营之间的精确拆分不可见。即便如此，产品表面、FedRAMP 授权的政府选项和 TEI 研究中的成本节约叙事，都指向
              通过多年期、高接触企业合同销售的平台，而不是自助席位定价。公开证据下最稳妥的结论是，收入质量很可能是经常性且企业驱动的， 但确切组合和实际定价仍未披露。
