      - number: '8.2'
        title: 融资背景支持较 2023 年上台阶，但不支持无限乐观
        blocks:
          - type: paragraph
            body: >
              公开融资锚点意味着 2023 年以来已创造可观价值，但无法给 2026 年提供干净标记。最清楚的披露锚点，是 2023 年 10 月 Sixth Street 交易，企业价值约 $1.3B。到 2026 年 7
              月，Keyfactor 宣布由 Summit Partners 领投超过 $1B 的战略增长投资，现有投资者仍是重要持有人，管理层称增长加速且盈利能力创纪录。这组信息强烈暗示 2026
              轮发生在强势位置，而非困境状态。不过，它没有披露投后估值、一级与二级混合、清算优先权、除董事席位外的治理变化，或可用来判断新价格的收入基数。可比市场背景有帮助，但不能解决问题。CyberArk 以 $1.54B
              收购 Venafi，显示战略买家对机器身份和信任资产有胃口。CyberArk、Okta、Rubrik、Palo Alto Networks、Zscaler、CrowdStrike 和 SentinelOne
              等公共云安全和身份公司，在 2026 年 7 月都有很大的公开股权价值，但它们不能与一家单位经济性未披露的私营信任基础设施公司完全类比。因此，融资背景支持 2026 年价值高于 2023
              年，但只是在很宽的置信区间内。
