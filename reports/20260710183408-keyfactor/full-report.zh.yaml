      - number: '2.2'
        title: 规模测算视角：当前核心 CLM，PQC 和机器身份是相邻市场
        blocks:
          - type: paragraph
            body: >
              对 Keyfactor 近期类别最站得住脚的公开规模测算，是 CLM 软件市场，而不是整个网络安全栈。The Business Research Company 估计，该类别 2026 年规模为
              $6.19B，高于 2025 年的 $5.23B，并预计 2030 年增长至 $11.05B。 这个框架足够宽，能覆盖 Keyfactor 瞄准的证书类型和垂直行业；但它仍窄于完整机器身份问题。第二个相邻视角是
              后量子密码。MarketsandMarkets 预计 PQC 市场从 2025 年的 $0.42B 增至 2030 年的 $2.84B，CAGR 为 46.2%； 这笔支出尚不能与 CLM
              收入直接互换，但它会直接影响 Keyfactor 的类别叙事，因为迁移项目从证书清单、密码发现 和治理开始。第三个视角不是收入规模，而是运营紧迫性。CyberArk 2025 年 Identity
              Security Landscape 称， 机器身份数量是人类的 82 倍，42% 拥有敏感或特权访问，87% 的受访组织在过去一年经历过至少两次成功的身份中心 攻击。这些数字本身不定义 TAM，但解释了为什么
              CLM、PKI 和机器身份工具已从小众 PKI 管理痛点，进入董事会层面的 韧性和合规预算。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
