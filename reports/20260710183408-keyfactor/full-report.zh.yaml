      - number: '2.4'
        title: 增长驱动、约束与最重要的市场缺口
        blocks:
          - type: paragraph
            body: >
              横跨供应商、分析机构和政策来源，四个需求加速器最突出。第一，证书有效期压缩已经是硬时间表，不再是抽象可能性： DigiCert、Sectigo 和 GlobalSign 都描述了 CA/Browser Forum
              时间表，2026 年将 TLS 最长期限削至 200 天， 2027 年削至 100 天，2029 年削至 47 天。第二，AI、云、容器和 API 正在加速机器身份蔓延。第三，白宫 2026 年 6
              月行政令之后，PQC 已从思想领导话题进入采购规划；Federal News Network 称，该行政令设定了 2030 年和 2031
              年联邦迁移期限，并把压力延伸至承包商和关键基础设施。第四，监管和审计预期越来越要求持续可见性，而不是 周期性的电子表格清单。约束同样重要。2024 年 Keyfactor PKI 报告称，80%
              的受访者担心适应密码变化，84% 将不断 增长的证书量视为运营头痛点，36% 仍计划等标准发布后再推进量子准备。AppViewX 的市场教育仍把电子表格、邮件续期
              和薄弱存储实践描述为仍在使用的现状替代方案，这意味着买方教育、人才稀缺和迁移复杂度仍是有分量的采用刹车。 未解决的缺口是缺少 SAM/SOM 共识：公开来源给出了类别规模，却没有拆出这笔支出中有多少现实上会流向
              Keyfactor 这样的独立供应商，而不是捆绑式公共 CA、PAM 或平台安全替代方案。
