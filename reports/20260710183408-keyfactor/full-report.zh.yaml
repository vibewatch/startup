  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈对应真实信任基础设施工作流
        blocks:
          - type: paragraph
            body: >
              理解 Keyfactor 的产品定义，最好把它看作工作流栈，而不是单个 SKU。客户用 Command 在企业环境中发现、自动化和治理机器身份与证书。 EJBCA Enterprise 锚定证书颁发机构和私有
              PKI 工作流；SignServer Enterprise 处理相邻但战略上重要的签名工作流，例如代码签名、 文档签名、时间戳、固件签名和其他制品信任场景。Cloud PKI as-a-Service
              和面向政府的证书生命周期自动化产品，为不想自行运行底层 PKI 栈的客户降低基础设施负担。较新的 Trust Control Plane 叙事试图把这些表面统一成一个控制层，覆盖机器身份、密码资产和信任系统。
              从客户工作流看，这很重要，因为买方问题很少只是孤立地“签发一张证书”；通常是发现现有资产，自动化签发和续期，守住签名信任，安全迁移 密码体系，并在环境更混合、更受 AI
              驱动时维持政策控制。因此，这个栈既覆盖运营层信任管道，也覆盖更高层治理。
