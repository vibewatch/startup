  productSummary: |
    Keyfactor 提供分层信任基础设施栈：Command 负责证书生命周期自动化和机器身份
    治理；EJBCA Enterprise 支持私有 PKI 和证书颁发机构工作流；SignServer
    Enterprise 覆盖代码、固件、容器、文档等签名场景；云交付 PKI 与面向政府的
    证书生命周期自动化，则服务于希望采用托管交付的客户。公司越来越将这些能力
    包装为一个 Trust Control Plane，横跨密码发现、签发、治理、签名和后量子准备。
  customerFocus: |
