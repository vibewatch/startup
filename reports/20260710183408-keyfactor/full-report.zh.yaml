  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接竞品、既有巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >
              买方至少可以用五种方式完成 Keyfactor 要解决的工作，所以狭窄的“Venafi 对 Keyfactor”框架不够。第一类是 直接企业 PKI 和 CLM
              同行：Entrust、DigiCert、Sectigo、AppViewX，以及历史上的 Venafi。第二类是更大的身份安全 既有巨头，例如 CyberArk；它已收购
              Venafi，可以把证书和机器身份控制打包进更大的特权访问叙事。第三类是云原生 和开发者主导的相邻方案，例如 HashiCorp Vault PKI 和 Smallstep；它们擅长短期证书、API
              工作流，以及设备或工作负载 身份。第四类是基础设施供应商替代方案，例如 AWS Private CA 和 Microsoft Active Directory Certificate Services；
              它们无需购买完整独立控制平面，也能满足相当一部分私有 CA 和内部证书需求。第五类是现状本身：电子表格、割裂的 CA 控制台，以及平台或基础设施团队内部的手工证书处理。ABI Research 2025
              年排名有用，因为它承认了这个领域的宽度： Keyfactor、Entrust 和 DigiCert 领先；Garantir、Sectigo 和 AppViewX
              跟随；CyberArk、GlobalSign、Ascertia、 eMudhra 和 HID 仍属主流。这不是赢者通吃市场，而是一个分层市场，买方情境决定什么算“够好”。
