            body: >
              Keyfactor 的公开运营信号指向典型的企业安全 GTM 动作。公司 2026 年 1 月任命总裁兼 CRO，并明确负责销售、营销和渠道，这与
              成规模、带配额的外勤销售组织一致，而不是产品驱动模式。同一公告称，Keyfactor ARR 在不到两年内几乎翻倍，员工扩至 12 个国家 540+ 人，并在公司史上最强年份之后进入 2026
              年。更早披露补上了更长增长曲线：2023 年 Sixth Street 投资公告称三年收入 CAGR 超过 70%，平台上有 1,500 多家组织；2026 年 7 月投资公告称，公司服务 2,500
              多家客户，每年管理数十亿个机器身份。这些都是有 分量的规模信号，但仍只是代理指标。它们没有披露当前 ARR、总留存、净收入留存、销售效率或客户集中度。因此，公开证据支持增长动能
              和装机基础宽度，却不足以做精确销售效率投资判断。
