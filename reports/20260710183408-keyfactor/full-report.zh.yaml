  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 头部风险围绕信任失效、受监管交付和执行不透明排序
        blocks:
          - type: paragraph
            body: >
              Keyfactor
              的风险画像并不常见，因为公司直接卖进数字信任的运营底座。一旦它自己的产品安全、升级流程或合规姿态出问题，客户不会把它当成小软件缺陷；客户会把它解读为公司核心承诺的自我矛盾。公开证据显示，风险面真实存在。公司维持活跃的安全公告计划，OpenCVE
              汇总了 Command、SignServer、EJBCA 和 AWS Orchestrator 中多项已披露漏洞，NVD
              也记录了近期版本中的若干中高危问题。漏洞披露本身不会自动推翻投资判断——严肃的基础设施软件总要打补丁——但确实让安全执行成为最先要核验的一类风险。第二类是受监管交付风险：FedRAMP
              和公共部门定位扩大机会，也带来持续认证和运营义务。第三类是证据不透明。公开来源没有披露足以精确界定下行空间的客户集中度、留存、现金或可靠性细节。因此，Keyfactor
              可以在战略上显得很强，同时仍背负尚未充分衡量的剩余风险。
