            body: >
              对一家私有公司来说，Keyfactor 的信任态势格外可观察，因为它暴露了多个质量控制表面。公司有公开安全公告区、公开产品文档、公开社区仓库， 以及政府产品的公开 FedRAMP
              公告。这些控制有意义，因为它们显示产品组织愿意记录问题和运营护栏，而不是把所有证据藏在销售渠道之后。同时， 同样的透明度也暴露技术风险。安全公告页列出多项影响 EJBCA 和 SignServer 的 2025
              年与 2026 年问题，包括 EJBCA MPIC 合规问题和若干 SignServer 漏洞。OpenCVE 也汇总了 Command、SignServer、EJBCA 和 AWS Orchestrator
              的披露问题。这不能证明产品弱于同行——严肃基础设施 软件总会背负漏洞管理义务——但确实说明客户需要有纪律的升级和补丁运营。换句话说，Keyfactor 的信任态势可信，部分因为公司披露风险；但被披露
