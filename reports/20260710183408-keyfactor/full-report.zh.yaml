  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：建设性看待，但必须严守入场纪律
        blocks:
          - type: paragraph
            body: >
              Keyfactor
              的公开证据支持对公司质量给出正面判断，对估值则应带条件看待。看多一面很清楚：公司所在品类有结构性紧迫性，资本结构里有重复投资的赞助方，标杆客户质量强，叙事也比单纯证书续期工具更广，指向信任基础设施。反向判断同样清楚：公开证据仍没有揭示公司当前
              ARR、净留存、利润率结构、集中度，或 2026 年交易的具体条款。因此，正确建议不是无条件“投资”，而是有条件：只有价格、结构和尽调结果能补偿仍缺失的投资测算输入时，才投资或加大投入。换句话说，问题不在于
              Keyfactor
              是否具有战略价值。它有。问题在于，投资者是否被要求按公司增长耐久性、利润率路径和集中度已经被证明的价格买单。公开证据不支持这种盲目溢价。纪律严明的投资者应对这项资产保持建设性，但在按顶格结果测算之前，要坚持更清晰的估值支撑和下行保护。
