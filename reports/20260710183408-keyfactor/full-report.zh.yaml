      - number: '2.3'
        title: 谁买、谁用、采用通常如何启动
        blocks:
          - type: paragraph
            body: >
              这个市场的采购路径是跨职能的，即便预算权最终通常在安全领导层手里。证书、PKI 和机器身份平台通常由直接承受 运营痛点的 PKI 架构师、证书运营团队、安全工程或平台工程团队推动。预算审批通常走 CISO
              组织、基础设施领导层， 或监管环境中的政府 / 合规负责人。DigiCert、Sectigo、CyberArk 和 Keyfactor 的产品页都指向同一条多方参与的
              采用路径：先发现并盘点现有资产，再集中政策和可见性，随后自动化签发和续期，最后把治理延伸到云工作负载、开发者 工具、设备身份和后量子准备。垂直需求也集中在可预测的位置。TBRC 明确将金融、医疗、政府、IT /
              电信和制造列为 主要 CLM 行业。Keyfactor 自己的客户证据与这些分群吻合，CyberArk 2025 年调查也显示，AI、云和工作负载增长正在 推动安全团队重新审视机器身份，即便是在传统 PKI
              负担没那么重的行业之外。因此，这个市场不像可自由取舍的工具， 更像一项带着合规、防宕机和密码敏捷性的基础设施现代化工程。
