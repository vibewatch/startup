  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：什么算可服务的问题
        blocks:
          - type: paragraph
            body: >
              定义 Keyfactor 的市场时，边界不能窄到忽视相邻支出，也不能宽到滑入泛网络安全或身份软件。核心预算项是 证书生命周期管理（CLM）：这类软件为企业基础设施中的
              TLS、代码签名、邮件和客户端证书自动化签发、续期、 监控和治理。The Business Research Company 的 2026 年市场框架有用，因为它明确纳入部署模式、组织规模和 Keyfactor
              最强的监管垂直领域，同时排除无关的人类身份工作流。核心 CLM 层又嵌在更宽的企业 PKI 和机器身份 管理问题里。AppViewX 的教育材料和 CyberArk
              的机器身份叙事都描述了同一个底层挑战：机器、工作负载、容器、 API、应用和 IoT 设备都用证书、密钥、secret 或相关密码身份做认证，而这些身份必须被发现、治理和续期。 Keyfactor
              自己的表述进一步推向“信任基础设施”，加入密码敏捷性、密码发现和后量子准备。因此，合适的边界是 分层的：今天的核心 CLM 支出，围绕它的更宽机器身份控制平面支出，以及作为增速最快相邻预算的 PQC 迁移，
              而不是把 PQC 当成当前收入核心。
