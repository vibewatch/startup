      - number: '3.2'
        title: 直接竞品画像与战略方向
        blocks:
          - type: paragraph
            body: >
              直接竞品之间的差异更多来自运营模式和渠道，而不是证书自动化这个基本概念。ABI 认为 Keyfactor 在灵活性、CA 无关性、 PKI-IoT 应用和密码发现上占优。Entrust
              被呈现为平台化最广的既有玩家，集成深、咨询能力强。DigiCert 带来公共信任 PKI 基因、全球规模，以及围绕任意 CA 或信任库的发现、治理和自动化打造的现代 Trust Lifecycle Manager
              叙事。 Sectigo 强调 CA 无关 CLM 层、公共 CA 服务、50+ 个集成和云优先部署。AppViewX 把机器身份管理定义为跨设备、工作负载、 应用和 IoT
              的证书与密钥，突出证书过期和手工管理带来的运营风险。CyberArk 的机器身份安全平台进一步上探，把 secret、 证书、工作负载身份和 SSH 密钥合在一起；2024 年收购 Venafi
              也说明，它现在能把这些能力放进更大的身份安全套件销售。 不能因为 HashiCorp 和 Smallstep 的起点更偏开发者，就忽略它们。Vault 的 PKI engine 支持动态签发、短 TTL
              和标准签发 协议；Smallstep 的硬件支撑设备身份和 AI agent 叙事，则非常贴合现代 Zero Trust 和云原生项目。
