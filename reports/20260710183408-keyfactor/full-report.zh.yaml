              公司概览章节必须建立足够的产品和客户事实底座，支撑后续技术和商业章节，同时不能引入外部 claim ID。 产品证据显示一套分层架构。Command 是 CA 无关控制平面，负责跨 SSH、TLS
              和客户端证书做发现、治理和 生命周期自动化。EJBCA Enterprise 是底层可扩展 PKI 平台，支持云、本地、自托管和 as-a-service 部署。 SignServer Enterprise
              将组合延伸到代码、文档、容器、固件和 ePassport 签名，并用集中式 HSM 支撑密钥 控制。Cloud PKI as-a-Service 和面向政府的 CLAaaS
              为希望更快见效或降低运营负担的买方提供托管部署选项。 客户证据也强于普通 logo 页。Siemens 报告自动化 EJBCA 部署让 PKI 部署时间减少 85%。ServiceNow 称 EJBCA
              支持跨服务和工作负载动态签发证书，并去掉了数十小时工程师手工工作。OVHcloud 用 EJBCA 为其主权云足迹集中 PKI，支撑 1.5+ 百万开发者和 10K+ 张证书。SK ID 迁移了 2,000
              万张证书，并报告上线后零 PKI 事故；荷兰司法 与安全部则引用了 15+ 年基于 EJBCA 的 PKI 运营。这些都是实质性验证点，因为它们显示的是监管、重基础设施和 国家级使用场景，而不只是试点客户。
