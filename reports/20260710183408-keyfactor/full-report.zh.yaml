      - number: '3.3'
        title: 能力宽度、打包不透明度与分发力量
        blocks:
          - type: paragraph
            body: >
              横看全场，表层能力重叠很高，但打包和分发并不相同。Keyfactor 在一个独立产品组合里结合 CLM、企业 PKI、代码 / 文档签名， 以及托管和云部署选项。DigiCert 和 Sectigo 拥有公共
              CA 关系、已安装信任和更广的证书采购渠道。CyberArk/Venafi 能把机器 身份安全放进更宽的身份项目里，并通过特权访问关系交叉销售。HashiCorp、AWS 和 Microsoft
              的嵌入位置很强，因为平台团队可能 已经因相邻原因标准化 Vault、AWS 或 AD CS。企业供应商的公开定价通常不透明：Keyfactor、DigiCert、Sectigo、CyberArk/Venafi、
              Entrust 和 Smallstep 都把买方导向 demo、销售电话或定制方案。因此，外部很难基准比较价格竞争。最清楚的替代经济性来自 AWS Private CA
              等基础设施原生选项，它们的吸引力在于运营集成；也来自 ManageEngine Key Manager Plus 等低摩擦产品，它强调 快速部署、SaaS 或本地可用性，以及证书加 SSH/PGP
              密钥管理打包。最终，竞争常常靠渠道进入、既有信任、部署适配和整体运营模式 简单度取胜，而不是靠可见的单证书标价。
