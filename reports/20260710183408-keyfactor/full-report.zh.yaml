companyProfile:
  summary: |
    Keyfactor 是一家总部位于 Cleveland 的网络安全公司，帮助企业和政府
    机构管理机器身份、密码资产、证书生命周期、私有 PKI 和数字签名工作流。
    产品组合包括负责生命周期自动化和治理的 Keyfactor Command、负责私有
    PKI 和证书颁发机构运营的 EJBCA Enterprise、负责软件和文档签名的
    SignServer Enterprise，以及托管云 PKI 和政府交付选项。公开客户证据包括
    ServiceNow、Siemens、OVHcloud、SK ID Solutions、GRENKE、M&T Bank、
    Schneider Electric 和荷兰司法与安全部。公司把这套组合定位为面向 AI
    和量子时代的统一 Trust Control Plane；公开证据也显示 Insight Partners、
    Sixth Street 和 Summit Partners 多次提供资方支持。
  foundedDate: '2001-01-01'
  founders:
    - name: Kevin von Keyserling
      role: 联合创始人兼前 CEO
      background: |
        2019 年公开融资材料显示，Kevin von Keyserling 在公司从 CSS 转向
        Keyfactor 后的品牌重塑增长阶段担任 CEO 兼联合创始人。
