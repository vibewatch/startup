      - number: '4.4'
        title: 公开结论：战略动能强，但投资判断材料不完整
        blocks:
          - type: paragraph
            body: >
              仅看公开证据，Keyfactor 像是一项强势私有网络安全资产，具备经常性企业需求、资方支持和可信的运营规模迹象。公开论据最强的部分在
              类别顺风、资本可得性、产品宽度和企业相关性。它在投资者判断未来五年财务表现所需的输入上明显更弱：当前 ARR、净收入留存、按产品线 拆分的毛利率、服务占比、CAC、回本周期、伙伴经济性、集中度和现金生成。TEI
              研究有帮助，因为它说明企业买方为什么愿意拨预算购买， 但那是委托制作的客户 ROI 证据，不是公司利润表证据。AWS 的公开替代价格也显示，在更宽的信任市场里，部分买方会面对更透明的基础设施
              原生经济性；如果没有清晰 ROI，透明价格可能给不透明企业定价的扩张设上天花板。因此，正确的公开结论既不是看空，也不是完全可承销。 Keyfactor
              看起来财务健康、战略资金充足，但披露缺口仍多，投资者应把估值信心视为取决于管理层数据室支持。
