      - 阈值 / 事件
      - 行动含义
    rows:
      - - 安全执行失败
        - 漏洞利用或紧急公告
        - 旗舰产品出现被利用的 Critical 级 CVE，或反复发布严重公告
        - 暂停投资或重定价，直到修复成熟度得到证明
      - - 认证 / 公共部门延误
        - FedRAMP 或政府控制问题
