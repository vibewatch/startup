          - type: paragraph
            body: >
              公开治理能见度只是局部，而非完整，但现有记录足以说明当前谁在推动战略，以及披露哪里仍然 偏薄。Jordan Rackie 是 2023 年和 2026 年融资公告中的现任 CEO；Ted Shorter
              在联邦业务和 平台发布公告中以 CTO 身份出现，也是信任基础设施、证书自动化和后量子迁移方面最常见的技术 发言人。2026 年 1 月，Keyfactor 补入一名重要 GTM 高管，任命 Michael
