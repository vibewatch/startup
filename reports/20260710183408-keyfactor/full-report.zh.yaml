        title: 牛市、基准、熊市情景比起市场规模，更取决于证据质量
        blocks:
          - type: paragraph
            body: >
              估值讨论应由情景驱动，因为最重要驱动因素上的公开证据质量并不均衡。牛市情景假设 Keyfactor 的信任基础设施平台成为受监管企业和政府的品类定义型控制平面，ARR 增长保持强劲，客户从 PKI
              现代化扩展到签名、发现和后量子项目。在这种情况下，远高于 2023
              年锚点的估值很容易自圆其说。基准情景假设战略价值延续，但仍把留存、利润率和集中度视为未解尽调事项；基准情景支持有分寸的上台阶，而不是激进重估。熊市情景不是“市场消失”。而是打包压力、服务强度或证据缺口证明，Keyfactor
              的可扩展性和耐久性不如赞助方叙事所暗示，估值支撑可能更接近 2023
              年标记，而不是头条热度所暗示的水平。因此，建议置信度必须保持中等，而不是高。下行更多由尽调仍可能揭示的经济性和客户结构问题驱动，而不是品类需求本身。
