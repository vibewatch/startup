      - number: '3.4'
        title: 切换成本、多供应商并用与护城河耐久度
        blocks:
          - type: paragraph
            body: >
              Keyfactor 的护城河是真实的，但有条件。当买方需要一个独立控制平面，横跨发现、CA 多样性、签名、私有 PKI 和密码敏捷性， 又不愿被锁进单一公共 CA
              或更大的身份套件时，护城河最强。Siemens、ServiceNow 和 OVHcloud 等参考客户支持这个故事，因为它们 展示了 Keyfactor
              在自动化密集、监管严格和主权敏感环境中胜出。平台一旦接入签发工作流、告警、HSM、DevOps 流水线和政策治理，
              切换成本就变得有分量；到那时，更换控制平面不只是许可证决定，而是一场运营迁移。即便如此，证书签发层仍可能多家并用，因为很多 买方已经使用多个 CA
              或信任来源。因此，真正的战略战场正从签发上移到发现、治理和后量子准备。这也带来主要替代风险。证书有效期 缩短、基础自动化变成必需之后，商品化压力最先压向简单续期工具。除非 Keyfactor
              持续在可见性、编排宽度和信任基础设施治理上做出 差异化，否则拥有更大捆绑、更强分发或嵌入式平台位置的供应商，可能压缩单点 CLM 的价值。
