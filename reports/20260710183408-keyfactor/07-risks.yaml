callouts:
  - calloutType: "risk"
    title: "Trust contradiction is the thesis-breaking risk"
    body: "A major security or compliance failure would be interpreted as a failure of Keyfactor’s core promise, not as an ordinary software defect."
    claimRefs: [CR001, CR007, CR008, CR025, CR031, CR034]
  - calloutType: "recommendation"
    title: "Focus diligence on mitigation maturity, not just raw risk existence"
    body: "The important question is whether Keyfactor can detect, remediate, and communicate issues fast enough for regulated customers to keep trusting the platform."
    claimRefs: [CR007, CR008, CR013, CR029, CR039]
  - calloutType: "insight"
    title: "Most major risks transmit through the customer base"
    body: "Security, certification, partner, and execution failures all ultimately matter because they threaten customer trust, renewal quality, or procurement velocity."
    claimRefs: [CR016, CR017, CR021, CR031, CR032, CR040]

