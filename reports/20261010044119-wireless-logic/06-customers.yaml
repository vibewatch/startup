figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Customer journey from connectivity evaluation and SIM prototyping through global fleet scaling and multi-IMSI lifecycle management."
    data:
      items:
        - label: "Evaluation & Scoping"
          touchpoints:
            - "Network coverage assessment"
            - "SIM form-factor selection (plastic vs eSIM)"
          detail: "Enterprise defines device deployment footprint and cellular network requirements across target operating regions."
        - label: "Hardware & SIM Prototyping"
          touchpoints:
            - "Test SIM provisioning"
            - "SIMPro portal access"
            - "Initial API integration"
          detail: "Piloting connectivity with small device batches and testing roaming behavior across local MNO profiles."
        - label: "Initial Production Deployment"
          touchpoints:
            - "Automated batch activation"
            - "Static IP assignment"
            - "Cellular APN configuration"
          detail: "Commercial rollout across core operating markets under unsteered roaming or direct carrier IMSI."
        - label: "Centralized Fleet Operations"
          touchpoints:
            - "SIMPro usage analytics"
            - "Real-time automated alerting"
            - "Security posture monitoring"
          detail: "Daily monitoring of data consumption, rogue device isolation, and automated threshold alerts to control overage."
        - label: "International & Multi-IMSI Expansion"
          touchpoints:
            - "Conexa core network routing"
            - "Over-the-air profile provisioning"
            - "Permanent roaming compliance"
          detail: "Deploying across cross-border markets using eSIM/Conexa to bypass local carrier permanent roaming restrictions."
        - label: "Contract Renewal & Tier Expansion"
          touchpoints:
            - "Data tariff optimization"
            - "Aggregated data pooling"
            - "Add-on security & billing integration"
          detail: "Negotiating enterprise volume tiers and integrating value-added software such as Zipit subscription billing."
    approximationNotes: null
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU007"
callouts:
  - calloutType: "risk"
    title: "Platform Usability and Training Overhead in Complex Deployments"
    body: "While Wireless Logic achieves strong 4.7 out of 5.0 peer satisfaction ratings, enterprise user reviews note that navigating the extensive SIMPro management portal and configuring multi-network rules requires upfront training, creating potential operational drag for smaller teams without dedicated cellular engineers."
    claimRefs:
      - "CU012"
      - "CU013"
  - calloutType: "insight"
    title: "International Scaling Drag Driven by Permanent Roaming Regulations"
    body: "Over 41% of cellular IoT adopters report permanent roaming restrictions as a primary operational barrier. Wireless Logic's Conexa platform and eUICC eSIM technology address this vulnerability by allowing over-the-air localization, yet enterprise migration remains slowed by multi-MNO commercial dependencies and network profile switching costs."
    claimRefs:
      - "CU007"
      - "CU014"
