company:
  name: "Wireless Logic"
chapter:
  number: 6
  title: "Customers"
  summary: "Wireless Logic serves an estimated base of 25,000 enterprise and SME accounts across 165 countries, managing more than 18 million connected devices across transport, utilities, healthcare, security, and retail. Verified customer reviews and case studies demonstrate strong customer satisfaction (4.7/5.0 on Gartner Peer Insights), while survey data indicates that 41% of cellular IoT adopters face permanent roaming restrictions that drive demand for Conexa eSIM orchestration."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation & Deployment Domains"
    body: "Wireless Logic segments its customer base across five primary industry verticals: transport and logistics, smart utilities and energy, security and lone-worker protection, healthcare and life sciences, and retail and smart city infrastructure. Buyers typically include enterprise Chief Technology Officers, IoT systems architects, and specialized hardware original equipment manufacturers (OEMs) who embed cellular connectivity directly into field devices. The company addresses both low-bandwidth, latency-tolerant telemetry applications such as smart metering and high-bandwidth, continuous streaming deployments such as connected bus fleets and outdoor digital signage. In addition, the strategic acquisition of North American provider Zipit Wireless has introduced a B2B2C subscription billing platform that enables device manufacturers to manage layered consumer subscriptions alongside commercial cellular connectivity."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Enterprise Fleet Adoption & Contract Scale"
    body: "Enterprise adoption at Wireless Logic has scaled rapidly under private equity sponsorship, growing from a regional UK connectivity reseller into a pan-European and global managed platform. Corporate and investor announcements indicate that the active connected device fleet exceeds 18 million SIMs across 165 countries, supported by agreements with over 50 mobile network operators and satellite carriers. Third-party transaction records from Montagu and CVC confirm that revenue expanded more than sixfold between 2018 and 2025 as enterprise accounts migrated from fragmented carrier contracts to centralized SIMPro software management. Customer reference directories document 55 validated enterprise case studies, while Gartner Peer Insights captures an aggregate rating of 4.7 out of 5.0 across product capability and contracting dimensions. The Zipit Wireless business unit further reinforces adoption trajectory by facilitating more than $45 million in recurring subscription revenues for connected hardware OEMs."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU006"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof"
    title: "Production Deployments & Named Reference Evidence"
    body: "Public case studies and customer references confirm scaled commercial deployments across critical operational infrastructure rather than unverified pilot trials. In the transportation vertical, Spanish transit operator Moventis deployed the Conexa IoT core network to connect bus fleets, delivering real-time telemetry and contactless ticketing across municipal routes. In medical cold-chain logistics, Blackfrog Technologies relies on Conexa eSIMs and SIMPro software for real-time temperature tracking during remote vaccine deliveries. Infrastructure providers such as ElectrAssure utilize unsteered multi-network SIMs to maintain continuous uptime across commercial electric vehicle charging plazas. In digital out-of-home advertising, Ocean Outdoor maintains connectivity across thousands of outdoor screens with flexible data allocations. These deployments confirm that enterprise customers entrust core operational workflows to Wireless Logic's managed cellular network layer."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-and-concentration"
    title: "Churn Drivers, Roaming Friction & Retention Risks"
    body: "While customer satisfaction remains positive across verified review portals, enterprise IoT scaling introduces significant technical friction and switching hurdles. An industry survey by Kaleido Intelligence and Wireless Logic reveals that 41% of cellular IoT adopters identify permanent roaming bans by national mobile operators as a critical barrier when deploying devices internationally, while 42% struggle with managing multi-provider billing relationships. On independent review platforms, enterprise practitioners indicate that the breadth of the SIMPro management platform requires formal onboarding training, which can present a usability barrier for organizations lacking specialized network engineering personnel. Furthermore, Wireless Logic does not publicly disclose quantitative net retention rates, gross revenue retention, or customer concentration schedules, leaving open questions regarding underlying contract durability and cohort churn."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
