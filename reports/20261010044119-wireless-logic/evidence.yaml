evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fy2025-financial-performance
    missingEvidence: >-
      Consolidated FY2025 and FY2026 financial statements for parent entity Blue Holdco, specifically gross margin
      decomposition, net debt, and cash burn.
    whyItMatters: >-
      Without post-FY2024 audited statutory accounts, the £3.5 billion valuation multiple cannot be underwritten against
      current EBITDA, leverage, or organic versus acquired growth rates.
    diligencePath: >-
      Review UK Companies House filings for Blue Holdco and request private lender compliance certificates or sponsor
      confidential information memorandums.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Public disclosures on net revenue retention (NRR), gross retention rate (GRR), enterprise churn rate, and customer
      concentration.
    whyItMatters: >-
      Assessing the defensibility of the 25,000+ enterprise customer base requires verifying whether subscription
      connectivity revenue expands organically or suffers carrier attrition.
    diligencePath: >-
      Request cohort retention schedules, top-20 customer revenue concentration tables, and contract duration metrics
      during sponsor management presentations.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: secondary-continuation-vehicle-terms
    missingEvidence: >-
      Full LP terms, management incentive carry allocation, and liquidity rights governing the 2025 €2.0 billion Montagu
      single-asset continuation vehicle.
    whyItMatters: >-
      Governance dynamics between Montagu, lead secondary backer TPG GP Solutions, co-leads CVC and Partners Group, and
      minority growth backer General Atlantic influence eventual exit timing and M&A financing.
    diligencePath: >-
      Examine the continuation vehicle limited partnership agreement (LPA) and side letter disclosures via secondary
      advisory diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-uncertainty
    missingEvidence: >-
      Audited third-party market sizing data breaking down global enterprise spending across cellular IoT connectivity,
      core network orchestration, and connectivity management software.
    whyItMatters: >-
      Without segmented dollar TAM and SAM figures, market projections rely on device connection counts rather than
      validated contract values and software monetization potential.
    diligencePath: >-
      Obtain dedicated analyst reports (e.g. Berg Insight, Transforma Insights, or Machina Research) and confidential
      sponsor market models detailing subscription ARPU and spend breakdown.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: regional-segmentation
    missingEvidence: >-
      Comprehensive vertical-by-vertical spend breakdowns comparing Latin American, North American, and European
      enterprise cellular IoT budgets.
    whyItMatters: >-
      Regional demand drivers vary markedly (e.g., POS terminals in Brazil vs. long-haul logistics in Mexico and North
      America), impacting go-to-market resource allocation and churn profiles.
    diligencePath: >-
      Request customer cohort revenue data segmented by geographic destination and industry vertical from company
      management.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited enterprise cohort churn, net revenue retention (NRR), and average contract duration across Wireless Logic
      and competing IoT MVNOs.
    whyItMatters: >-
      Without verified retention and cohort economics, underwriting depends on gross device additions and M&A roll-up
      volume rather than structural customer stickiness.
    diligencePath: >-
      Request confidential sponsor diligence materials detailing annual logo churn, gross revenue retention, and
      multi-year contract commitments during bilateral data room review.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: consolidated-financials
    missingEvidence: >-
      Audited FY2025 consolidated statutory accounts disclosing exact net revenue, gross margin breakdown between
      pass-through data and software, and debt covenants.
