company:
  name: Wireless Logic
chapter:
  number: 1
  title: Company Overview
  summary: Wireless Logic has scaled into Europe's leading managed IoT connectivity platform, operating the Conexa core network
    across 20+ million connected devices and 25,000 enterprise customers. The business is anchored by Montagu's €2.0 billion
    single-asset continuation vehicle and General Atlantic's minority investment at an enterprise valuation of approximately
    £3.5 billion, while navigating persistent global permanent roaming restrictions and unobserved post-FY2024 cash burn.
sections:
- id: corporate-identity-and-foundations
  title: Corporate Identity, Platform Architecture, and Commercial Model
  body: Founded in 2000 in the United Kingdom, Wireless Logic has evolved from a specialist cellular airtime provider into
    Europe's preeminent managed IoT connectivity platform. The company bridges enterprise hardware with global mobile network
    operators (MNOs) by providing single-window connectivity orchestration, security management, and billing administration.
    At the core of Wireless Logic's technical differentiation is Conexa, a purpose-built telecommunications core network delivering
    an enterprise-grade 99.99 percent uptime service level agreement (SLA) with multi-IMSI connectivity spanning more than
    750 cellular networks across 165 countries. Rather than relying on standard commercial SIM roaming profiles that face
    increasing regulatory scrutiny, the platform integrates GSMA SGP.32 remote SIM provisioning to manage embedded SIM (eSIM)
    profiles over the air. This architecture enables enterprise fleets in energy, logistics, utilities, and agriculture to
    deploy connected hardware globally without physical SIM card replacements, while providing native private APNs, real-time
    diagnostic telemetry, and end-to-end security compliance aligned with the EU Cyber Resilience Act.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: executive-leadership-and-governance
  title: Executive Leadership, Governance Structure, and Founder Transitions
  body: Wireless Logic's executive leadership combines long-standing founder continuity with institutional telecommunications
    governance. Co-founder Oliver Tucker continues to lead the business as Chief Executive Officer, having co-founded the
    venture in 2000 and successfully engineered its 2011 management buyback from Peter Jones's Phones International Group
    with backing from ECI Partners. Co-founder Philip Cole similarly guided European commercial expansion and MNO partnership
    development across two decades of rapid corporate scaling. To oversee its transition into a multi-billion-pound enterprise,
    Wireless Logic instituted a Tier-1 governance board chaired by Sir Michael Rake, former Chairman of BT Group, former President
    of the Confederation of British Industry (CBI), and former Senior Partner of KPMG International. Governance oversight
    expanded further following General Atlantic's minority growth investment, which appointed Vittorio Colao—former Chief
    Executive Officer of Vodafone Group and former Italian Minister for Technological Innovation and Digital Transition—to
    the board as non-executive director, providing high-level carrier relationship management and strategic regulatory guidance.
  claimRefs:
  - CO005
  - CO006
  - CO007
  tableRefs:
  - TO002
- id: capitalization-sponsors-and-ownership
  title: Ownership Capitalization, Private Equity Sponsors, and Valuation Escalation
  body: The corporate ownership structure of Wireless Logic reflects sequential private equity sponsorship that accelerated
    following Montagu Private Equity's acquisition of majority control from CVC Capital Partners in 2018 for an enterprise
    value reported at approximately £1.3 billion. In 2025, Montagu established a landmark €2.0 billion single-asset continuation
    vehicle (SACV)—the largest continuation fund completed in Europe that year—to retain primary sponsorship and extend its
    partnership with the company into its next growth phase. TPG GP Solutions served as lead secondary investor, accompanied
    by CVC Secondary Partners and Partners Group as co-leads. Concurrently, global growth equity firm General Atlantic acquired
    a significant minority equity stake through its BeyondNetZero climate fund, establishing an implied enterprise valuation
    of approximately £3.5 billion (~$4.65 billion). In March 2026, UAE-backed climate investment fund ALTÉRRA committed capital
    from its newly launched Opportunity Fund alongside BeyondNetZero to accelerate decarbonization-enabling IoT infrastructure
    deployments across global supply chains.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  tableRefs:
  - TO003
- id: operational-scale-and-growth-milestones
  title: Operational Scale, Strategic M&A Expansion, and Industry Headwinds
  body: Wireless Logic currently orchestrates over 20 million active connected devices across an enterprise base exceeding
    25,000 corporate organizations. This scale has been driven by an aggressive programmatic buy-and-build M&A playbook, executing
    more than 15 acquisitions since 2018 across Europe, North America, and Latin America. Key milestone transactions include
    the April 2025 purchase of Brazilian IoT MVNO Arqia (adding over 3 million managed device connections), the acquisition
    of US-based multi-carrier billing specialist Zipit Wireless in August 2025, and the signed agreement in August 2026 to
    acquire Algar Telecom's IoT connectivity business in Brazil. However, this aggressive expansion confronts meaningful industry
    headwinds. Independent research surveying 1,000 cellular IoT adopters reveals that 41 percent of organizations encounter
    permanent roaming restrictions as a primary bottleneck to international scaling, while 32.9 percent find existing global
    carrier connectivity support inadequate. These friction points, combined with £141 million in acquisition-related expenses
    that contributed to an accounting pre-tax loss of £222.3 million at Blue Holdco in FY2024, underscore that rapid geographical
    expansion entails operational integration risk and significant upfront capital costs.
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  figureRefs:
  - FO001
