callouts:
- calloutType: insight
  title: Sponsor Continuation Vehicle Secures Valuation but Deepens Due Diligence Scrutiny
  body: The €2.0 billion single-asset continuation vehicle completed by Montagu in 2025 alongside General Atlantic's minority
    investment established a headline £3.5 billion enterprise valuation. However, the private vehicle structure locks in high
    sponsor valuation hurdles while leaving consolidated net leverage and post-2024 cash burn unobservable to external market
    participants.
  claimRefs:
  - CO008
  - CO009
- calloutType: risk
  title: Permanent Roaming Restrictions and Carrier Governance Create Ongoing Operating Headwinds
  body: While Wireless Logic's Conexa platform and SGP.32 eSIM provisioning mitigate operator lock-in, 41% of enterprise IoT
    deployments globally struggle with permanent roaming restrictions and 32.9% report current connectivity support is inadequate.
    Escalating international regulatory enforcement against permanent roaming poses an ongoing friction to rapid multi-region
    SIM scaling.
  claimRefs:
  - CO004
  - CO015
