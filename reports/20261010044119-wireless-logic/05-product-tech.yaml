chapter:
  number: 5
  title: "Product & Technology"
  summary: "Wireless Logic operates a vertically integrated IoT connectivity enablement platform that unites its Conexa carrier-grade core network, NetPro private APN infrastructure, and SIMPro management software across more than 600 global cellular networks, supported by recent GSMA SGP.32 remote eSIM provisioning integration with Thales."
sections:
  - id: "section-product-overview"
    title: "Product Portfolio and Platform Capabilities"
    body: "Wireless Logic delivers a comprehensive suite of IoT connectivity enablement solutions designed to abstract the underlying complexity of cellular network procurement, provisioning, and fleet management. The central software surface of the company is SIMPro, a unified management platform that enables enterprise fleet operators to provision, monitor, control data consumption, and automate billing across geographically dispersed deployments. The product catalog extends beyond basic cellular airtime into integrated value-added software and hardware solutions, including DevicePro for endpoint monitoring, MapPro for mapping telemetry integrations with Google and HERE Technologies, and Cloud Secure with IoT SAFE for automated credential onboarding. These capabilities are deployed across demanding industrial verticals such as healthcare telemetry, smart grid utilities, retail point-of-sale terminals, and precision agriculture, providing enterprises with customized network profiles tailored to application bandwidth and latency requirements."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE009"
    tableRefs:
      - "TE001"
    figureRefs: []
  - id: "section-workflows-use-cases"
    title: "Enterprise IoT Workflows and Deployment Models"
    body: "Enterprise IoT deployments routinely face severe operational friction when scaling across national borders, managing carrier lock-in, and preventing unpredictable roaming overage expenses. Wireless Logic resolves these workflow barriers by replacing fragmented local carrier contracts with a single operational relationship backed by non-steered multi-network SIMs and dynamic over-the-air IMSI profile switching. Through its strategic collaboration with Thales, the platform incorporates factory-preloaded bootstrap profiles directly onto GSMA SGP.32-compliant eSIMs during manufacturing, enabling connected hardware to achieve instant global connectivity upon power-up without requiring physical SIM installation. In ongoing fleet operations, SIMPro automates data pooling, enforces granular usage capping, and throttles anomalous data consumption in real time, preventing bill shock while NetPro private APNs isolate critical device traffic from the public internet."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE009"
    tableRefs:
      - "TE002"
    figureRefs: []
  - id: "section-architecture-core-network"
    title: "Conexa Core Architecture and Carrier-Grade Infrastructure"
    body: "The technical foundation of Wireless Logic's platform is organized into a six-layer architecture spanning physical hardware modules, multi-bearer radio access networks, the Conexa packet core, NetPro security infrastructure, Cloud Secure governance, and SIMPro cloud management. Conexa functions as a carrier-grade cellular core network specifically engineered for IoT workloads, integrating distributed packet gateways, subscriber registries, and automated multi-carrier roaming failover. NetPro provides a dedicated £4 million private infrastructure layer that overlays partner carrier networks, deploying co-located Tier 3 data centers, custom APN gateways, and IPsec 3DES VPN encryption to establish private two-way telemetry tunnels. Supported by €2 billion in continuation vehicle backing from Montagu, TPG, CVC, and Partners Group following rapid headcount and revenue expansion, this multi-tier infrastructure delivers carrier-grade availability while shielding enterprise endpoints from public routing vulnerabilities."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE010"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "section-security-reliability-diligence"
    title: "Security Controls, Technical Differentiation, and Diligence Risks"
    body: "Wireless Logic establishes technical differentiation through multi-layer security controls and carrier neutrality, rather than proprietary radio access hardware. Its Cloud Secure framework implements the GSMA IoT SAFE standard, leveraging the hardware SIM as an on-chip root of trust for zero-touch cloud credential provisioning and protection against spoofing and ransomware. Network reliability is anchored by NetPro's audited 99.79% historical uptime SLA and dedicated 24/7 technical support managed through the integrated SIMPro Help Centre. However, technical diligence reveals two material risks: first, the platform remains fundamentally reliant on wholesale carrier pricing and roaming enforcement across third-party mobile network operators, and second, Wireless Logic maintains an enterprise-opaque developer posture with no publicly accessible SDK repositories, developer portal metrics, or community telemetry to independently verify developer friction."
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE012"
      - "CE013"
      - "CE015"
    tableRefs: []
    figureRefs: []
