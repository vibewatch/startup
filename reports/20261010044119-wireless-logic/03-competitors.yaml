callouts:
  - calloutType: "insight"
    title: "Service Complexity Displaces Pure SIM Volume as Key Differentiator"
    body: "In a maturing IoT market characterized by single-digit regional volume growth in mature European geographies, commodity connectivity pricing is insufficient for sustainable expansion. Providers that package resilient multi-carrier core networking, automated eSIM profile switching under SGP.32, and complex downstream subscription billing command higher gross retention than pure cellular aggregators."
    claimRefs:
      - "CP001"
      - "CP005"
      - "CP007"
      - "CP009"
  - calloutType: "risk"
    title: "Carrier Disintermediation and Roaming Restrictions Challenge Aggregator Economics"
    body: "Independent IoT MVNOs remain structurally exposed to carrier wholesale terms and escalating regulatory crackdowns on permanent cellular roaming. With over 41% of enterprise IoT deployers highlighting permanent roaming restrictions as a critical scaling barrier and Tier-1 MNOs tightening wholesale access, long-term gross margins require continuous investment in localized IMSI agreements and multi-network core resilience."
    claimRefs:
      - "CP003"
      - "CP010"
      - "CP011"
