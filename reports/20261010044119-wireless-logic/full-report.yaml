      - number: '6.4'
        title: Churn Drivers, Roaming Friction & Retention Risks
        blocks:
          - type: paragraph
            body: >-
              While customer satisfaction remains positive across verified review portals, enterprise IoT scaling
              introduces significant technical friction and switching hurdles. An industry survey by Kaleido
              Intelligence and Wireless Logic reveals that 41% of cellular IoT adopters identify permanent roaming bans
              by national mobile operators as a critical barrier when deploying devices internationally, while 42%
              struggle with managing multi-provider billing relationships. On independent review platforms, enterprise
              practitioners indicate that the breadth of the SIMPro management platform requires formal onboarding
              training, which can present a usability barrier for organizations lacking specialized network engineering
              personnel. Furthermore, Wireless Logic does not publicly disclose quantitative net retention rates, gross
              revenue retention, or customer concentration schedules, leaving open questions regarding underlying
              contract durability and cohort churn.
            claimRefs:
              - CU012
              - CU013
              - CU014
