      - number: '4.3'
        title: Cost Structure, Unit Economics, and Traction
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic exhibits attractive operating leverage characteristic of scaled managed connectivity
              aggregators, although detailed segment gross margins remain confidential. Under Montagu's ownership since
              2018, the business has grown its employee base over seven times, expanded revenue more than sixfold, and
              increased EBITDA over sevenfold across 15 acquisitions. Industry analyst profiling from Gartner Peer
              Insights estimates Wireless Logic's annual revenue in the $500 million to $1 billion bracket, supported by
              an employee headcount between 1,001 and 5,000 and verified customer satisfaction ratings averaging 4.4 out
              of 5. Cost of goods sold is dominated by wholesale cellular data access and network interconnect fees paid
              to mobile network operators, alongside cloud hosting and SIM card hardware fulfillment. Operating expenses
              center on specialized IoT engineering, regulatory compliance, and international enterprise sales. Because
              standalone customer acquisition cost, logo retention, and net revenue retention are not public, confirming
              organic unit economics remains an active diligence priority.
