      - number: '5.3'
        title: Conexa Core Architecture and Carrier-Grade Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The technical foundation of Wireless Logic's platform is organized into a six-layer architecture spanning
              physical hardware modules, multi-bearer radio access networks, the Conexa packet core, NetPro security
              infrastructure, Cloud Secure governance, and SIMPro cloud management. Conexa functions as a carrier-grade
              cellular core network specifically engineered for IoT workloads, integrating distributed packet gateways,
              subscriber registries, and automated multi-carrier roaming failover. NetPro provides a dedicated £4
              million private infrastructure layer that overlays partner carrier networks, deploying co-located Tier 3
              data centers, custom APN gateways, and IPsec 3DES VPN encryption to establish private two-way telemetry
              tunnels. Supported by €2 billion in continuation vehicle backing from Montagu, TPG, CVC, and Partners
              Group following rapid headcount and revenue expansion, this multi-tier infrastructure delivers
              carrier-grade availability while shielding enterprise endpoints from public routing vulnerabilities.
