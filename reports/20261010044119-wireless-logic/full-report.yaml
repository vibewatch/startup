        title: Capital Adequacy, Financing Structure, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capital adequacy and balance sheet perspective, Wireless Logic is supported by top-tier private
              equity and climate growth investors. In 2025, Montagu established a €2 billion single-asset continuation
              vehicle led by TPG GP Solutions and co-led by CVC Secondary Partners and Partners Group to support
              long-term expansion. Simultaneously, General Atlantic acquired a minority interest via its BeyondNetZero
              fund in a transaction valuing Wireless Logic at £3.5 billion, complemented in March 2026 by co-investment
              from ALTERRA's Opportunity Fund. These substantial liquidity events affirm strong investor appetite and
              valuation support for the platform's cash-generative buy-and-build model. However, for clean investment
              underwriting, material private-data gaps persist: consolidated statutory financial statements disclosing
              net debt leverage, credit facility covenants, and organic versus acquisition-driven EBITDA expansion have
