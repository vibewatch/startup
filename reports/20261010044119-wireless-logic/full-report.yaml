            title: Sponsor Continuation Vehicle Secures Valuation but Deepens Due Diligence Scrutiny
            body: >-
              The €2.0 billion single-asset continuation vehicle completed by Montagu in 2025 alongside General
              Atlantic's minority investment established a headline £3.5 billion enterprise valuation. However, the
              private vehicle structure locks in high sponsor valuation hurdles while leaving consolidated net leverage
              and post-2024 cash burn unobservable to external market participants.
            calloutType: insight
            claimRefs:
              - CO008
              - CO009
          - type: callout
            title: Permanent Roaming Restrictions and Carrier Governance Create Ongoing Operating Headwinds
            body: >-
              While Wireless Logic's Conexa platform and SGP.32 eSIM provisioning mitigate operator lock-in, 41% of
              enterprise IoT deployments globally struggle with permanent roaming restrictions and 32.9% report current
              connectivity support is inadequate. Escalating international regulatory enforcement against permanent
              roaming poses an ongoing friction to rapid multi-region SIM scaling.
            calloutType: risk
            claimRefs:
              - CO004
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Service Taxonomies, and Spend Scope
        blocks:
          - type: paragraph
            body: >-
              The market for managed Internet of Things (IoT) connectivity spans cellular and satellite network access,
              connectivity management platforms (CMPs), and lifecycle device orchestration. Within this perimeter,
              enterprise expenditure includes recurring SIM subscription data plans, multi-IMSI and eSIM provisioning
              profiles, private APNs, secure core routing infrastructure such as Wireless Logic's Conexa platform, and
              centralized fleet diagnostic software. Excluded from this boundary are capital investments in physical
              cellular base stations, macro tower infrastructure, cellular chipset manufacturing, and bespoke enterprise
              application development. Historically, organizations attempted to procure connectivity directly from
              mobile network operators (MNOs), but multinational device fleets quickly encounter carrier fragmentation,
              incompatible billing structures, and complex roaming rules. Managed IoT connectivity aggregators resolve
              these status-quo friction points by delivering carrier-agnostic connectivity across hundreds of carrier
              networks through unified operational interfaces.
            claimRefs:
              - CM003
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM005
              - CM010
              - CM013
      - number: '2.2'
        title: Market Sizing Lenses, Fleet Scale, and Addressable Demand
        blocks:
          - type: paragraph
            body: >-
              Audited public disclosures lack a single consensus dollar-denominated figure for total addressable market
              (TAM) spend in managed IoT connectivity, requiring diligence to evaluate the opportunity through
              operational scale metrics and fleet survey distributions. Research conducted by Kaleido Intelligence
              indicates that 59.3% of cellular IoT adopters manage fleets where more than half of all deployed devices
              require international or multi-regional connectivity. Furthermore, enterprise device fleets are expanding
              rapidly across emerging geographies; in Latin America, regional IoT connectivity is compounding at an
              estimated 14% annual rate. In terms of serviced scale, Wireless Logic orchestrates more than 20 million
              active IoT connections across 165 countries, utilizing partnerships with over 750 cellular networks
              worldwide. Software monetization represents an expanding subset of this addressable spend, evidenced by
              specialized platform acquisitions such as Zipit Wireless, which facilitated over $45 million in cumulative
              subscription billing revenue for connected equipment manufacturers.
            claimRefs:
              - CM001
              - CM008
              - CM010
              - CM012
              - CM014
