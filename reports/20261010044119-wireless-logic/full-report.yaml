      - number: '6.3'
        title: Production Deployments & Named Reference Evidence
        blocks:
          - type: paragraph
            body: >-
              Public case studies and customer references confirm scaled commercial deployments across critical
              operational infrastructure rather than unverified pilot trials. In the transportation vertical, Spanish
              transit operator Moventis deployed the Conexa IoT core network to connect bus fleets, delivering real-time
              telemetry and contactless ticketing across municipal routes. In medical cold-chain logistics, Blackfrog
              Technologies relies on Conexa eSIMs and SIMPro software for real-time temperature tracking during remote
              vaccine deliveries. Infrastructure providers such as ElectrAssure utilize unsteered multi-network SIMs to
              maintain continuous uptime across commercial electric vehicle charging plazas. In digital out-of-home
              advertising, Ocean Outdoor maintains connectivity across thousands of outdoor screens with flexible data
              allocations. These deployments confirm that enterprise customers entrust core operational workflows to
              Wireless Logic's managed cellular network layer.
