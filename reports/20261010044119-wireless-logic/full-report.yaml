  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Platform Capabilities
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic delivers a comprehensive suite of IoT connectivity enablement solutions designed to
              abstract the underlying complexity of cellular network procurement, provisioning, and fleet management.
              The central software surface of the company is SIMPro, a unified management platform that enables
              enterprise fleet operators to provision, monitor, control data consumption, and automate billing across
              geographically dispersed deployments. The product catalog extends beyond basic cellular airtime into
              integrated value-added software and hardware solutions, including DevicePro for endpoint monitoring,
              MapPro for mapping telemetry integrations with Google and HERE Technologies, and Cloud Secure with IoT
              SAFE for automated credential onboarding. These capabilities are deployed across demanding industrial
              verticals such as healthcare telemetry, smart grid utilities, retail point-of-sale terminals, and
              precision agriculture, providing enterprises with customized network profiles tailored to application
              bandwidth and latency requirements.
