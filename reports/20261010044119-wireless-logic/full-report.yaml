        title: Exhibits
        blocks:
          - type: callout
            title: Platform Usability and Training Overhead in Complex Deployments
            body: >-
              While Wireless Logic achieves strong 4.7 out of 5.0 peer satisfaction ratings, enterprise user reviews
              note that navigating the extensive SIMPro management portal and configuring multi-network rules requires
              upfront training, creating potential operational drag for smaller teams without dedicated cellular
              engineers.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
          - type: callout
            title: International Scaling Drag Driven by Permanent Roaming Regulations
            body: >-
              Over 41% of cellular IoT adopters report permanent roaming restrictions as a primary operational barrier.
              Wireless Logic's Conexa platform and eUICC eSIM technology address this vulnerability by allowing
              over-the-air localization, yet enterprise migration remains slowed by multi-MNO commercial dependencies
              and network profile switching costs.
            calloutType: insight
            claimRefs:
              - CU007
