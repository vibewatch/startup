  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >
              Wireless Logic presents a compelling operational footprint as Europe's preeminent managed IoT connectivity
              platform, orchestrating more than 20 million active device connections across 165 countries for 25,000
              enterprise accounts. The core investment thesis is anchored in the mission-critical nature of its Conexa
              cellular core network, which links into 750 carrier networks under a 99.99 percent contractual uptime
              service level agreement. Historically, as corroborated by early private equity sponsor ECI Partners, this
              connectivity architecture achieved near-zero customer churn upon long-term contract completion due to high
              customer switching hurdles. In late 2025, majority sponsor Montagu executed a landmark €2.0 billion
              single-asset continuation vehicle alongside co-leads TPG GP Solutions, CVC Secondary Partners, and
              Partners Group, signaling deep institutional backing for the platform's multi-national expansion.


              Despite these impressive operational foundations, disciplined underwriting dictates a research-more
              recommendation rather than an unhedged buy. The headline valuation benchmark of approximately $4.65
              billion established by recent sponsor transactions prices Wireless Logic at aggressive SaaS-equivalent
              multiples. In practice, public filings and company releases do not disclose the exact gross margin
              breakdown between commoditized carrier connectivity pass-through and proprietary software platforms such
              as SIMPro and Conexa. Moreover, 41 percent of cellular IoT deployers cite permanent roaming restrictions
              as a paramount operational barrier, threatening international fleet economics. Until audited disclosures
              illuminate net revenue retention, organic expansion rates, and continuation vehicle debt structures,
              committing capital at current headline marks carries excessive valuation risk.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.2'
        title: Core Thesis Drivers, Anti-Thesis Friction, and Market Realities
        blocks:
          - type: paragraph
            body: >
              The core bull argument centers on Wireless Logic's programmatic acquisition engine and specialized
              networking software. Through October 2026, the company completed 19 strategic acquisitions across 11
              countries, establishing deep local presence in key commercial corridors including North America via Zipit
              Wireless and Latin America via Arqia. The integration of Zipit Wireless illustrates this strategic
              synergy: beyond basic SIM supply, Zipit contributes proprietary cloud subscription billing software that
              has powered more than $45 million in OEM recurring subscription revenue. By embedding multi-network SIMs
              that dynamically toggle across alternative mobile network operators, Wireless Logic insulates
              mission-critical industrial, utility, and smart grid fleets against localized carrier blackouts,
              supporting resilient pricing power and high customer retention.


              Conversely, the anti-thesis highlights mounting market frictions and underlying business model ambiguity.
              Independent survey evidence from Kaleido Intelligence reveals that 42 percent of enterprise cellular IoT
              users struggle with managing fragmented multi-provider relationships, and 32.9 percent consider current
              global connectivity support inadequate. More critically, permanent roaming restrictions enforced by
              national telecommunications regulators pose existential compliance and margin risks for cross-border
              deployments. If mobile network operators aggressively restrict roaming access or develop direct enterprise
              eSIM management interfaces, Wireless Logic's intermediary margin could face compression. Without verified
              visibility into organic growth excluding acquired revenues, investors risk misinterpreting serial
              acquisition volume as underlying product momentum.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Valuation Scenarios, Return Expectations, and Diligence Criteria
        blocks:
          - type: paragraph
            body: >
              Underwriting Wireless Logic requires stress-testing returns across discrete operational scenarios over a
              standard private equity horizon through 2029. In our base-case scenario, which we weight at 55 percent
              probability, the company sustains 15 to 20 percent annual device growth, maintains mid-tier connectivity
              gross margins, and integrates selective tuck-in acquisitions. Under this trajectory, enterprise value
              clears between €3.0 billion and €3.6 billion (approximately $3.3 billion to $4.0 billion), generating a
              steady 10 to 14 percent internal rate of return suitable for mature infrastructure investors. The bull
              case (25 percent probability) envisions rapid acceleration in high-margin software ARR from Conexa and
              Zipit, validating the full $4.65 billion valuation mark and setting up a lucrative 2028-2029 IPO or
              mega-sponsor buyout.


              The downside bear case (20 percent probability) accounts for aggressive regulatory enforcement against
              permanent roaming, carrier margin squeezing, and elevated debt service obligations under the €2.0 billion
              continuation vehicle. Under these conditions, valuation multiples would contract toward pure telecom
              reseller benchmarks of 8x to 10x EBITDA, depressing enterprise value toward $2.5 billion. Governance
              reinforcements, including the addition of former Vodafone chief executive Vittorio Colao to the board
              alongside General Atlantic's BeyondNetZero fund, bolster strategic execution. Nevertheless, prudent
              investment committee approval demands firm diligence deliverables: specifically, audited financial
              statements proving that software gross margins exceed connectivity resale pass-through, alongside detailed
              debt amortization schedules from the sponsor continuation vehicle.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV010
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Discipline Precludes Chasing Unaudited Private Valuation Marks
            body: >-
              While Wireless Logic's fleet scale of 20 million connections and high-profile sponsor backing validate
              operational resilience, the implied $4.65 billion valuation benchmark requires premium SaaS multiples for
              what remains largely connectivity distribution. Institutional capital should remain in research-more
              stance until audited gross margins and continuation vehicle debt structures are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV013
              - CV014
          - type: callout
            title: Permanent Roaming Restrictions Threaten Cross-Border Fleet Margins
            body: >-
              Independent industry survey data confirms that 41 percent of cellular IoT deployers face major operational
              hurdles from permanent roaming restrictions. Without transparent adoption rates for GSMA SGP.32 remote
              profile switching, Wireless Logic risks margin erosion or compliance lockouts across key international
              enterprise accounts.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
