  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Telecom Licensing, and Roaming Restrictions
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic navigates an increasingly fragmented global telecommunications regulatory environment where
              compliance obligations extend far beyond traditional carrier licensing. A primary operational and legal
              threat stems from national permanent roaming restrictions. Regulatory authorities in jurisdictions such as
              Brazil, Turkey, India, and the United Arab Emirates strictly limit or prohibit devices utilizing foreign
              International Mobile Subscriber Identities (IMSIs) from operating indefinitely on local networks without
              domestic registration. With industry data indicating that over forty percent of cellular IoT adopters
              identify permanent roaming constraints as a top obstacle to international scaling, Wireless Logic must
              continuously localize connectivity through regional MVNO operating units such as Arqia in Latin America.
              Simultaneously, European operations face tightening cybersecurity mandates under the EU Cyber Resilience
              Act and NIS2 Directive. These frameworks impose statutory vulnerability disclosure obligations, strict
              supply-chain security reviews, and direct corporate liability for connected deployments. While Wireless
              Logic maintains ISO 27001 accreditation and structures its Conexa architecture around defensive security
              frameworks, regulatory compliance remains an active operational cost driver and diligence verification
              priority.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
