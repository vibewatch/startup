              - CR014
      - number: '7.4'
        title: Severity Heatmap, Thesis-Break Triggers, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Evaluating Wireless Logic from an investment diligence perspective requires balancing its demonstrated
              operational scale against structural ecosystem dependencies. The risk profile is dominated by two primary
              vectors: carrier wholesale pricing pressure and private-equity capital structure governance. The €2
              billion single-asset continuation vehicle closed in 2025 by Montagu, with TPG GP Solutions and CVC
              Secondary Partners, provides stable capital but restricts public financial visibility regarding debt
              leverage and interest coverage. Investors must establish rigorous thesis-break kill criteria before
              committing follow-on capital. Specific monitoring triggers include: any structural gross margin
              compression exceeding two hundred basis points driven by MNO wholesale repricing; regulatory enforcement
              actions or permanent roaming shutdowns affecting core enterprise fleets; and customer churn acceleration
              resulting from unaddressed portal integration friction. Diligence must focus on auditing master service
              agreements with top cellular carriers, verifying SGP.32 exit interoperability across live enterprise
              deployments, and obtaining audited SACV capitalization schedules.
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: MNO Wholesale Squeeze and Carrier Repricing
            body: >-
              Because Wireless Logic operates as an IoT MVNO without owning physical radio access networks, its gross
              margin is fundamentally exposed to wholesale data rate increases by tier-1 MNOs such as BT/EE, Vodafone,
              and US carriers. Any structural deterioration in wholesale tariff agreements directly compresses operating
              profitability.
            calloutType: risk
            claimRefs:
              - CR006
