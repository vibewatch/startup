  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Deployment Domains
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic segments its customer base across five primary industry verticals: transport and logistics,
              smart utilities and energy, security and lone-worker protection, healthcare and life sciences, and retail
              and smart city infrastructure. Buyers typically include enterprise Chief Technology Officers, IoT systems
              architects, and specialized hardware original equipment manufacturers (OEMs) who embed cellular
              connectivity directly into field devices. The company addresses both low-bandwidth, latency-tolerant
              telemetry applications such as smart metering and high-bandwidth, continuous streaming deployments such as
              connected bus fleets and outdoor digital signage. In addition, the strategic acquisition of North American
              provider Zipit Wireless has introduced a B2B2C subscription billing platform that enables device
              manufacturers to manage layered consumer subscriptions alongside commercial cellular connectivity.
            claimRefs:
