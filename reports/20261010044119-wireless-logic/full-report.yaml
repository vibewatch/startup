            - Automated cross-border roaming and carrier failover
        - label: Layer 4 - NetPro Private Overlay Infrastructure
          detail: Dedicated £4m private infrastructure isolating IoT traffic from the public internet
          modules:
            - Direct APN gateways to global mobile networks
            - IPSec 3DES VPN encryption and tunnel termination
            - Static and fixed private/public IP address routing
        - label: Layer 5 - Cloud Secure & Threat Detection
          detail: Zero-trust device authentication and AI-driven security monitoring
          modules:
