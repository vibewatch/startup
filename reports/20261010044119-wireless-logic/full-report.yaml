      - number: '6.2'
        title: Enterprise Fleet Adoption & Contract Scale
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption at Wireless Logic has scaled rapidly under private equity sponsorship, growing from a
              regional UK connectivity reseller into a pan-European and global managed platform. Corporate and investor
              announcements indicate that the active connected device fleet exceeds 18 million SIMs across 165
              countries, supported by agreements with over 50 mobile network operators and satellite carriers.
              Third-party transaction records from Montagu and CVC confirm that revenue expanded more than sixfold
              between 2018 and 2025 as enterprise accounts migrated from fragmented carrier contracts to centralized
              SIMPro software management. Customer reference directories document 55 validated enterprise case studies,
              while Gartner Peer Insights captures an aggregate rating of 4.7 out of 5.0 across product capability and
              contracting dimensions. The Zipit Wireless business unit further reinforces adoption trajectory by
              facilitating more than $45 million in recurring subscription revenues for connected hardware OEMs.
            claimRefs:
