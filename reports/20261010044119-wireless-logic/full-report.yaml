        - label: Layer 6 - SIMPro Platform & Enterprise Integration
          detail: Centralized cloud management platform providing single-pane control and API integration
          modules:
            - Estate provisioning, SIM activation, and pooling
            - Real-time usage alerting, capping, and billing
            - REST APIs into enterprise ERP, CRM, and cloud platforms
