      - number: '7.3'
        title: Carrier Wholesale Relationships, Concentration, and Vendor Lock-In
        blocks:
          - type: paragraph
            body: >-
              As an independent IoT virtual network operator, Wireless Logic maintains an asymmetric structural
              dependence on underlying mobile network operators. While the platform aggregates access across seven
              hundred and fifty partner networks globally, underlying physical radio access and data carriage remain
              controlled by tier-one carriers including BT/EE, Vodafone, AT&T, and Verizon. This concentration exposes
              the business to unilateral wholesale tariff repricing, roaming de-prioritization, and margin compression
              during contract renewals. Wireless Logic mitigates carrier lock-in by implementing GSMA SGP.32 remote SIM
              provisioning standards, enabling over-the-air profile reconfigurations that theoretically allow customers
              to switch underlying carrier networks without recalling physical SIM hardware. Nevertheless, enterprise
              reviews highlight that proprietary APN routing, custom portal workflows, and commercial multi-year
              commitments generate substantial practical switching barriers. Additionally, recent strategic partnerships
              with non-terrestrial providers like SpaceX Starlink expand hybrid connectivity options but introduce
              reliance on emerging satellite commercial agreements that remain unproven across large-scale enterprise
              device fleets.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
