  - id: TV002
    title: Thesis / anti-thesis table
    notes: Presents balanced underwriting arguments mapped against observable operational triggers and evidence requirements.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
    columns:
      - Analytical Angle
      - Investment Thesis Argument
      - Anti-Thesis Counter-Argument
      - Evidence Trigger Moving View
    rows:
      - - Core Connectivity Scale
        - >-
          Global core network Conexa reaching 750+ carriers and 20M+ devices creates resilient network effects and
          defensible customer switching costs.
        - >-
          Connectivity remains fundamentally commoditized data resale vulnerable to MNO disintermediation and local
          pricing pressure.
        - Disclosure of software platform ARR exceeding 50% of total revenue would validate platform defensibility.
      - - M&A Consolidation Engine
        - >-
          Programmatic acquisition engine (19 acquisitions across 11 countries) rapidly expands geographic TAM and
          cross-sells value-added billing platforms like Zipit.
        - >-
          Aggressive serial M&A creates complex operational debt, integration overhead, and unproven organic revenue
          growth underlying top-line expansion.
        - Proof of organic ARR growth sustaining above 15% YoY excluding M&A contributions would de-risk thesis.
      - - Customer Retention & SLAs
        - >-
          Contractual 99.99% network SLA and multi-network failover deliver mission-critical reliability with
          historically minimal enterprise churn.
        - >-
          Third-party surveys show 32.9% of enterprise adopters find global connectivity support inadequate, with rising
          SLA dissatisfaction.
        - >-
          Audited enterprise gross revenue retention (GRR) sustained above 95% across multi-year contracts would confirm
          moat.
      - - Regulatory & Roaming Dynamics
        - >-
          eSIM SGP.32 remote profile provisioning allows dynamic in-life operator switching to bypass permanent roaming
          barriers.
        - >-
          41% of adopters report permanent roaming restrictions as a critical scaling barrier that threatens
          cross-border device fleet viability.
        - >-
          Accelerated enterprise migration to verified GSMA SGP.32 compliant profiles would mitigate roaming regulatory
          risk.
  - id: TV003
    title: Bull / base / bear scenario table
    notes: Assumes holding horizon through 2029-2030 aligned with Montagu single-asset continuation vehicle lifecycle.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV009
      - CV010
      - CV013
    columns:
      - Scenario
      - Core Operating & Market Assumptions
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Conexa software and Zipit billing expansion accelerate platform ARR to >40% of revenue; organic device volume
          grows >25% annually; international M&A integrations achieve seamless operational synergies.
        - >-
          Supports full sponsor mark of ~$4.65B+ (18x-22x EBITDA); provides clear path to public IPO or mega-sponsor
          buyout delivering 20%+ IRR.
        - Carrier resistance to eSIM provisioning; integration delays across US acquisitions (Zipit, SIMETRY).
        - 25% - Requires substantial acceleration in high-margin software ARR and successful multi-regional execution
      - - Base Case
        - >-
          Device volume expands at 15-20% CAGR; connectivity data margins experience mild compression; programmatic
          tuck-in acquisitions continue at 1-2 deals annually; stable customer retention.
        - >-
          Enterprise value clears around €3.0B-€3.6B ($3.3B-$4.0B, 13x-15x EBITDA); delivers steady 10-14% IRR matching
          mature infrastructure/PE profile.
        - Customer resistance to blended pass-through fees; mid-tier MNO margin pressure.
        - 55% - Consistent with historical growth trajectory and sponsor continuation vehicle horizon through 2029
      - - Bear Case
        - >-
          Permanent roaming enforcement in key jurisdictions restricts multi-country deployments; major MNOs directly
          target enterprise fleets; continuation vehicle debt service strains free cash flow.
        - >-
          Multiples de-rate to pure connectivity reseller levels of 8x-10x EBITDA; implied valuation drops below $2.5B;
          potential equity dilution or down-round recapitalization.
        - MNO tariff hikes; regulatory roaming blocks; credit rating downgrades on holding vehicle leverage.
        - 20% - Mitigated by diversified customer base and multi-network failover capabilities
