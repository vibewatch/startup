      NetPro security overlay, Cloud Secure governance, and SIMPro platform integration.
    approximationNotes: null
    data:
      layers:
        - label: Layer 1 - Physical Devices & Embedded SIMs
          detail: Customer IoT end-devices, telemetry hardware, industrial sensors, and embedded eUICC/SIM cards
          modules:
