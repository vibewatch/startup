  topStrengths:
    - Global managed IoT connectivity scale across a large enterprise customer base.
    - Mission-critical platform architecture supported by Conexa, SIMPro, NetPro, and eSIM provisioning capabilities.
    - Strong sponsor validation from Montagu, General Atlantic, and continuation-vehicle financing.
    - Broad vertical exposure across transport, utilities, healthcare, retail, security, and OEM deployments.
  topRisks:
    - FY2025/FY2026 statutory financials, leverage, and margin decomposition remain undisclosed.
    - Permanent roaming restrictions and carrier wholesale repricing could compress economics.
    - Net retention, churn, and customer concentration are not publicly disclosed.
    - Integration complexity from repeated acquisitions can obscure organic growth quality.
  unresolvedGaps:
    - >-
      FY2025 consolidated revenue, net debt, leverage, and any updated sponsor-clearing valuation support are still the
      biggest blockers to clean underwriting.
    - >-
      No public source retained in this run discloses Wireless Logic's NRR, GRR, churn, customer concentration, or
      average contract duration.
    - >-
      Gross margin by connectivity pass-through versus platform or managed-services revenue is not public, so the right
      long-term comp set remains partly unresolved.
    - >-
      The exact economics and governance implications of the 2025 continuation-vehicle structure still require
      fund-level diligence materials rather than public summaries alone.
