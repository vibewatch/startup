companyProfile:
  summary: >-
    Wireless Logic is a UK-founded managed IoT connectivity platform that orchestrates global SIM and eSIM connectivity
    for enterprise and SME fleets through Conexa, SIMPro, and related platform software. The business combines recurring
    connectivity subscriptions with platform and value-added software, serving verticals such as transport, utilities,
    healthcare, retail, security, and OEM deployments. It remains controlled by Montagu and supported by General
    Atlantic after the 2025 continuation-vehicle and minority-investment transactions, while public visibility into
    post-FY2024 margins, leverage, and retention remains limited.
