callouts:
  - calloutType: recommendation
    title: "Discipline Precludes Chasing Unaudited Private Valuation Marks"
    claimRefs:
      - CV001
      - CV006
      - CV013
      - CV014
    body: "While Wireless Logic's fleet scale of 20 million connections and high-profile sponsor backing validate operational resilience, the implied $4.65 billion valuation benchmark requires premium SaaS multiples for what remains largely connectivity distribution. Institutional capital should remain in research-more stance until audited gross margins and continuation vehicle debt structures are verified."

  - calloutType: risk
