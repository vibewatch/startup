chapter:
  number: 7
  title: Risks
  summary: >-
    Wireless Logic demonstrates operational resilience through its Conexa IoT core network and multi-carrier redundancy,
    but faces structural exposure to mobile network operator wholesale repricing, multi-jurisdiction permanent roaming
    restrictions, and technical debt across fifteen acquisitions. Diligence must monitor MNO margin compression, SGP.32
    profile switching, and single-asset continuation vehicle capital governance.
sections:
  - id: regulatory-and-legal-exposure
    title: Regulatory Compliance, Telecom Licensing, and Roaming Restrictions
    body: >-
      Wireless Logic navigates an increasingly fragmented global telecommunications regulatory environment where
      compliance obligations extend far beyond traditional carrier licensing. A primary operational and legal threat
      stems from national permanent roaming restrictions. Regulatory authorities in jurisdictions such as Brazil,
      Turkey, India, and the United Arab Emirates strictly limit or prohibit devices utilizing foreign International
      Mobile Subscriber Identities (IMSIs) from operating indefinitely on local networks without domestic registration.
      With industry data indicating that over forty percent of cellular IoT adopters identify permanent roaming
      constraints as a top obstacle to international scaling, Wireless Logic must continuously localize connectivity
      through regional MVNO operating units such as Arqia in Latin America. Simultaneously, European operations face
      tightening cybersecurity mandates under the EU Cyber Resilience Act and NIS2 Directive. These frameworks impose
      statutory vulnerability disclosure obligations, strict supply-chain security reviews, and direct corporate
      liability for connected deployments. While Wireless Logic maintains ISO 27001 accreditation and structures its
      Conexa architecture around defensive security frameworks, regulatory compliance remains an active operational cost
      driver and diligence verification priority.
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR008
    tableRefs:
      - TR001
  - id: operational-infrastructure-and-security
    title: Core Network Resilience, Cybersecurity, and Outage Mitigation
    body: >-
      The operational integrity of Wireless Logic depends upon the continuous availability of its Conexa cellular core
      and NETPro private networking overlay. Because the company provides connectivity across critical infrastructure,
      utility grids, healthcare monitoring, and municipal automation, service interruptions introduce severe corporate
      liabilities and brand impairment. Wireless Logic mitigates downtime through a carrier-grade architecture
      underpinned by a contractual ninety-nine point ninety-nine percent uptime service level agreement, geographically
      dispersed data centers, and multi-cloud failover redundancy. Security controls incorporate private Access Point
      Names (APNs), dedicated IPsec VPN tunnels, and automated distributed denial-of-service protections designed to
      prevent device hijacking. However, operational risk is substantially heightened by the technical debt accumulated
      from fifteen strategic acquisitions completed under Montagu ownership. Integrating heterogeneous billing engines,
      SIM provisioning workflows, and legacy customer portals from entities such as Zipit, SIMETRY, and Comms365 creates
      ongoing architectural friction. Approximately one-third of surveyed enterprise IoT customers cite current global
      connectivity support as inadequate, reflecting persistent customer onboarding bottlenecks and dashboard usability
      challenges that require ongoing engineering remediation.
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR009
      - CR012
    tableRefs:
      - TR002
  - id: partner-and-mno-dependencies
    title: Carrier Wholesale Relationships, Concentration, and Vendor Lock-In
    body: >-
      As an independent IoT virtual network operator, Wireless Logic maintains an asymmetric structural dependence on
      underlying mobile network operators. While the platform aggregates access across seven hundred and fifty partner
      networks globally, underlying physical radio access and data carriage remain controlled by tier-one carriers
      including BT/EE, Vodafone, AT&T, and Verizon. This concentration exposes the business to unilateral wholesale
      tariff repricing, roaming de-prioritization, and margin compression during contract renewals. Wireless Logic
      mitigates carrier lock-in by implementing GSMA SGP.32 remote SIM provisioning standards, enabling over-the-air
      profile reconfigurations that theoretically allow customers to switch underlying carrier networks without
      recalling physical SIM hardware. Nevertheless, enterprise reviews highlight that proprietary APN routing, custom
      portal workflows, and commercial multi-year commitments generate substantial practical switching barriers.
      Additionally, recent strategic partnerships with non-terrestrial providers like SpaceX Starlink expand hybrid
      connectivity options but introduce reliance on emerging satellite commercial agreements that remain unproven
      across large-scale enterprise device fleets.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR010
      - CR014
    tableRefs:
      - TR003
  - id: risk-synthesis-and-kill-criteria
    title: Severity Heatmap, Thesis-Break Triggers, and Diligence Path
    body: >-
      Evaluating Wireless Logic from an investment diligence perspective requires balancing its demonstrated operational
      scale against structural ecosystem dependencies. The risk profile is dominated by two primary vectors: carrier
      wholesale pricing pressure and private-equity capital structure governance. The €2 billion single-asset
      continuation vehicle closed in 2025 by Montagu, with TPG GP Solutions and CVC Secondary Partners, provides stable
      capital but restricts public financial visibility regarding debt leverage and interest coverage. Investors must
      establish rigorous thesis-break kill criteria before committing follow-on capital. Specific monitoring triggers
      include: any structural gross margin compression exceeding two hundred basis points driven by MNO wholesale
      repricing; regulatory enforcement actions or permanent roaming shutdowns affecting core enterprise fleets; and
      customer churn acceleration resulting from unaddressed portal integration friction. Diligence must focus on
      auditing master service agreements with top cellular carriers, verifying SGP.32 exit interoperability across live
      enterprise deployments, and obtaining audited SACV capitalization schedules.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR012
      - CR013
    figureRefs:
      - FR001
