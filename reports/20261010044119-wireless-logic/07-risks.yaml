callouts:
  - calloutType: risk
    title: MNO Wholesale Squeeze and Carrier Repricing
    body: >-
      Because Wireless Logic operates as an IoT MVNO without owning physical radio access networks, its gross margin is
      fundamentally exposed to wholesale data rate increases by tier-1 MNOs such as BT/EE, Vodafone, and US carriers.
      Any structural deterioration in wholesale tariff agreements directly compresses operating profitability.
    claimRefs:
      - CR006
      - CR010
  - calloutType: insight
    title: Permanent Roaming as a Structural Growth Bottleneck
    body: >-
      With over 40% of global IoT adopters identifying permanent roaming restrictions as a top deployment barrier,
      Wireless Logic's reliance on roaming agreements in regulated markets necessitates continuous investment in local
      profiles and SGP.32 eUICC infrastructure.
    claimRefs:
      - CR003
      - CR007
