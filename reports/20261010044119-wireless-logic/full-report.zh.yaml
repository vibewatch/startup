      - number: '3.4'
        title: 切换成本、锁定效应与长期防御力
        blocks:
          - type: paragraph
            body: >-
              过去，实体 SIM 更换成本造成显著结构性锁定，硬件部署到现场后，企业客户往往不愿更换连接供应商。GSMA eUICC 标准和 SGP.32 远程 SIM
              配置的商业成熟，借助空中更新配置改变了这一竞争格局：客户无需召回实体设备，也拥有可信的技术退出权。然而，高价值企业客户仍受深度 API 集成、定制专用 APN、自动安全监控及 EU Cyber
              Resilience Act 等框架下的监管合规流程等软件和运营切换成本牵制。Wireless Logic 借助 Conexa 核心网络和较高客户满意度维持企业留存；Gartner Peer Insights
              评分为 4.4 / 5。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
