      - number: '1.4'
        title: 运营规模、战略并购扩张与行业逆风
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 目前为超过 25,000 家企业组织编排超过 20 million 台活跃联网设备。公司通过程序化并购整合策略推动这一规模，自 2018 年以来在欧洲、北美和拉丁美洲完成超过 15
              起收购。关键交易包括 2025 年 4 月收购巴西物联网 MVNO Arqia（新增超过 3 million 个托管设备连接）、2025 年 8 月收购美国多运营商计费专家 Zipit Wireless，以及
              2026 年 8 月签署协议收购 Algar Telecom 在巴西的物联网连接业务。然而，激进扩张也遭遇明显行业逆风。对 1,000 家蜂窝物联网采用者的独立调查显示，41 percent
              的组织把永久漫游限制视为国际扩张的首要瓶颈，32.9 percent 认为现有全球运营商连接支持不足。这些摩擦点，加上与收购相关的 £141 million 费用，并导致 Blue Holdco 在 FY2024
              出现 £222.3 million 会计税前亏损，说明快速地理扩张伴随运营整合风险和显著前期资本成本。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO009
              - CO013
              - CO014
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资方延续基金锁定估值，却加大尽调审查
            body: >-
              Montagu 于 2025 年完成的 €2.0 billion 单资产延续基金，加上 General Atlantic 的少数股权投资，确立了 £3.5 billion 的基准
              企业估值。但私募基金结构锁定了较高的资方估值门槛，同时令外部市场参与者无法观察合并口径的净杠杆和 2024 年之后的烧钱速度。
            calloutType: insight
            claimRefs:
              - CO008
              - CO009
          - type: callout
            title: 永久漫游限制与运营商治理持续制造运营逆风
            body: >-
              Wireless Logic 的 Conexa 平台和 SGP.32 eSIM 配置能够缓解运营商锁定，但全球企业物联网部署中有 41% 受永久漫游限制困扰，32.9%
              表示当前连接支持不足。各国对永久漫游的监管执行不断加码，持续拖累 SIM 在多地区快速扩张。
            calloutType: risk
            claimRefs:
              - CO004
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务分类与支出范围
        blocks:
          - type: paragraph
            body: >-
              托管式物联网（IoT）连接市场覆盖蜂窝和卫星网络接入、连接管理平台（CMP）以及设备全生命周期编排。在这一边界内，企业支出包括经常性 SIM 订阅数据套餐、multi-IMSI 和 eSIM 配置、专用
              APN、Wireless Logic 的 Conexa
              等安全核心路由基础设施，以及集中式车队诊断软件。实体蜂窝基站、宏基站基础设施、蜂窝芯片制造和定制企业应用开发不在这一范围内。过去企业尝试直接向移动网络运营商（MNO）采购连接，但跨国设备车队很快会遇到运营商碎片化、不兼容的计费结构和复杂漫游规则。托管式物联网连接聚合商通过统一运营界面、跨数百个运营商网络提供与运营商无关的连接，化解这些现状摩擦。
            claimRefs:
              - CM003
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM005
              - CM010
              - CM013
      - number: '2.2'
        title: 市场规模测算视角、车队规模与可服务需求
        blocks:
          - type: paragraph
            body: >-
              经审计的公开披露没有给出托管式物联网连接总可用市场（TAM）支出的单一共识美元数字，因此尽调需要结合运营规模指标和车队调查分布评估机会。Kaleido Intelligence 的研究显示，59.3%
              的蜂窝物联网采用者管理的车队中，超过一半已部署设备需要国际或跨地区连接。此外，新兴地区的企业设备车队正在快速扩张；拉丁美洲区域物联网连接预计按 14% 的年率增长。就服务规模而言，Wireless Logic 在
              165 个国家编排超过 20 million 个活跃物联网连接，利用全球超过 750 个蜂窝网络的合作关系。Zipit Wireless 等专业平台收购表明，软件变现正成为可服务支出中不断扩大的部分；Zipit
              Wireless 已为联网设备制造商带来超过 $45 million 的累计订阅计费收入。
            claimRefs:
              - CM001
              - CM008
              - CM010
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM008
              - CM010
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
      - number: '2.3'
        title: 买方画像、企业预算与决策标准
        blocks:
          - type: paragraph
            body: >-
              企业采购托管式物联网连接的预算来自运营技术（OT）、产品工程和数字化转型，具体取决于设备架构。在商业运输和物流领域，车队运营高管优先考虑跨境网络冗余和实时车联网追踪，以避免国际贸易走廊上的货物中断。相反，在支付基础设施领域，商户收单机构需要销售点终端具备故障切换蜂窝可靠性，因为停机将直接阻断消费者交易。Kaleido
              Intelligence 的调查显示，网络覆盖质量是最重要的技术选择标准，55% 的企业采用者提到这一点，其后是商业灵活性（53%）和增值软件能力（52%）。决策者越来越希望采购一站式托管服务，把多网络
              SIM、硬件诊断工具和自动计费集成打包，以减少分散运营团队的供应商管理复杂度。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM010
      - number: '2.4'
        title: 增长催化剂、采用摩擦与监管约束
        blocks:
          - type: paragraph
            body: >-
              工业自动化、AI 边缘处理和多网络无线可用性等长期顺风，正在加速企业物联网部署，但跨国扩张仍面对严重的运营和监管障碍。国家电信监管机构及当地 MNO 施加的永久漫游限制是关键壁垒，41%
              的受访者将其列为首要运营挑战。为绕开永久漫游禁令并避免运营商锁定，45% 的企业组织采用 eSIM 和 GSMA SGP.32 远程 SIM
              配置标准，以空中切换配置来接入本地网络。设备维护开销和故障排查成本也常令部署后的运营支出超过企业预期。Wireless Logic
              已扩大与主要美国移动网络运营商的直接连接，并加入自动订阅变现能力以解决这些地理和运营瓶颈，但长期软件净收入留存仍缺乏独立验证，构成未解决的尽调证据缺口。
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多供应商复杂度推动与运营商无关的聚合需求
            body: 42% 的企业采用者表示维护多个运营商合同是重大运营障碍，59.3% 需要跨境连接；需求因此明确从原始 SIM 商品采购转向统一托管式连接平台，由平台抽象掉区域电信碎片化。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: callout
            title: 永久漫游限制威胁跨国车队运营
            body: 影响 41% 企业物联网部署的运营商永久漫游禁令，为全球车队带来严重运营脆弱性；SGP.32 空中切换配置因此成为缓解运营商锁定和设备意外离线的前提。
            calloutType: risk
            claimRefs:
              - CM002
              - CM006
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 物联网连接格局的结构性变化
        blocks:
          - type: paragraph
            body: >-
              随着专业物联网移动虚拟网络运营商（MVNO）从传统 Tier-1
              移动网络运营商（MNO）手中夺取份额，全球物联网连接格局发生了明显结构转变。跨多个国际市场部署联网设备车队的大型跨国企业，越来越拒绝依赖单一运营商，因为这通常会带来严重运营摩擦、监管性永久漫游障碍和复杂的多供应商合同管理。Wireless
              Logic 等独立平台聚合商因此通过统一核心网络基础设施编排数百个全球运营商网络，建立了战略防御力。在 Montagu 私募股权持有和 General Atlantic 支持下，Wireless Logic
              已完成 15 起战略收购，扩大地域覆盖、设备数量和专业网络能力，将自身定位为规模化的全球托管式物联网连接服务领导者。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 竞争者画像与战略定位
        blocks:
          - type: paragraph
            body: >-
              企业买方从两个主要维度评估物联网连接供应商：核心网络独立性，以及高层软件管理的成熟度。传统移动网络运营商拥有无可匹敌的实体无线接入网络和较低的国内传输成本，但商业激励和僵化的单运营商覆盖会给跨境部署带来严重障碍。独立物联网
              MVNO 同行则凭借灵活的 API 优先工具和开发者接入展开竞争，但许多同行缺少 Wireless Logic 所展现的深厚企业核心基础设施和欧洲区域收购规模。Wireless Logic 依托自研 Conexa
              核心网络及近期的专业收购（包括英国韧性连接专家 Comms365 和美国订阅计费平台 Zipit Wireless），靠服务智能、多网络故障切换和与运营商无关的全生命周期控制实现差异化，而不是只在批发 SIM
              数量上竞争。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP009
              - CP014
