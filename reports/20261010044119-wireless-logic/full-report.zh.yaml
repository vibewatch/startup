  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    notes: 将平衡的投资判断论点与可观察的运营触发点和证据要求对应起来。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
    columns:
      - 分析角度
      - 投资逻辑论点
      - 反向逻辑论点
      - 改变判断的证据触发点
    rows:
      - - 核心连接规模
        - 覆盖 750+ 家运营商和 20M+ 台设备的全球核心网络 Conexa，形成韧性网络效应和可守住的客户切换成本。
        - 连接本质上仍是商品化的数据转售业务，容易受到 MNO 去中介化和本地定价压力影响。
        - 若披露软件平台 ARR 超过总收入的 50%，将验证平台的可防守性。
      - - 并购整合引擎
        - 程序化并购引擎（在 11 个国家完成 19 次收购）快速扩大地域 TAM，并交叉销售 Zipit 等增值计费平台。
        - 激进的连续并购带来复杂的运营负债和整合成本，而营收增长背后的自然增长尚未得到验证。
        - 若剔除并购贡献后，自然 ARR 增长持续高于 15% 同比，投资逻辑的风险将下降。
      - - 客户留存与 SLA
        - 合同约定的 99.99% 网络 SLA 和多网络故障切换带来关键任务级可靠性，历史企业客户流失率极低。
        - 第三方调查显示，32.9% 的企业采用者认为全球连接支持不足，SLA 不满度正在上升。
        - 若经审计的企业总收入留存率（GRR）在多年期合同中持续高于 95%，将确认护城河。
      - - 监管与漫游动态
        - eSIM SGP.32 远程配置文件下发支持在用期间动态切换运营商，从而绕过永久漫游障碍。
        - 41% 的采用者称永久漫游限制是关键扩张障碍，威胁跨境设备车队的可行性。
        - 企业加速迁移到经验证的 GSMA SGP.32 合规配置文件，将缓解漫游监管风险。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: 假设持有期覆盖 2029–2030 年，与 Montagu 单资产延续性载体的生命周期一致。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV009
      - CV010
      - CV013
    columns:
      - 情景
      - 核心运营与市场假设
      - 估值与回报逻辑
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - Conexa 软件和 Zipit 计费业务扩张将平台 ARR 推高至收入的 >40%；设备自然增长量年增 >25%；国际并购整合实现无缝运营协同。
        - 支持发起方约 $4.65B+ 的完整估值（18x–22x EBITDA）；为公开市场 IPO 或大型发起方收购创造清晰路径，带来 20%+ IRR。
        - 运营商抵制 eSIM 配置；美国收购标的（Zipit、SIMETRY）整合延迟。
        - 25% - 需要高利润率软件 ARR 大幅加速，并成功执行多区域扩张
      - - 基准情景
        - 设备量以 15–20% 的 CAGR 增长；连接数据利润率小幅压缩；程序化补强型收购持续每年 1–2 笔；客户留存稳定。
        - 企业价值约为 €3.0B–€3.6B（$3.3B–$4.0B，13x–15x EBITDA）；带来稳定的 10–14% IRR，符合成熟基础设施 / PE 画像。
        - 客户抵制混合转嫁费用；中型 MNO 利润率承压。
        - 55% - 与历史增长轨迹及发起方延续性载体截至 2029 年的期限一致
      - - 悲观情景
        - 关键司法辖区执行永久漫游限制，阻碍多国部署；主要 MNO 直接争夺企业设备车队；延续性载体偿债挤压自由现金流。
        - 倍数下调至纯连接转售商的 8x–10x EBITDA 水平；隐含估值跌破 $2.5B；可能出现股权稀释或下轮资本重组。
        - MNO 资费上调；监管封锁漫游；控股载体杠杆信用评级下调。
        - 20% - 多元化客户基础和多网络故障切换能力可降低风险
