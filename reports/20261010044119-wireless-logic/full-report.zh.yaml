            - 网络覆盖评估
            - SIM 封装选择（塑料 vs eSIM）
          detail: 企业确定目标运营区域的设备部署范围和蜂窝网络需求。
        - label: 硬件与 SIM 原型测试
          touchpoints:
            - 测试 SIM 配置
            - SIMPro 门户访问
            - 初始 API 集成
          detail: 用小批量设备试点连接，并测试本地 MNO 配置文件下的漫游行为。
        - label: 初始生产部署
          touchpoints:
            - 自动批量激活
            - 静态 IP 分配
            - 蜂窝 APN 配置
          detail: 在核心运营市场通过非引导漫游或运营商直连 IMSI 进行商业部署。
        - label: 集中式车队运营
          touchpoints:
            - SIMPro 用量分析
            - 实时自动告警
            - 安全态势监控
          detail: 每日监控数据消耗、隔离异常设备，并通过自动阈值告警控制超额用量。
        - label: 国际化与多 IMSI 扩张
          touchpoints:
            - Conexa 核心网络路由
            - 空中配置文件下发
            - 永久漫游合规
          detail: 利用 eSIM / Conexa 跨境部署，绕过本地运营商的永久漫游限制。
        - label: 合同续签与层级扩展
          touchpoints:
            - 数据资费优化
            - 聚合数据池化
            - 附加安全与计费集成
          detail: 协商企业用量层级，并集成 Zipit 订阅计费等增值软件。
    approximationNotes: null
    claimRefs:
      - CU002
      - CU005
      - CU007
