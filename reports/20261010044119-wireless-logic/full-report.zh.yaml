              - CP009
          - type: callout
            title: 运营商去中介化与漫游限制挑战聚合商经济性
            body: >-
              独立物联网 MVNO 在结构上仍暴露于运营商批发条款和日益严厉的永久蜂窝漫游监管打击。超过 41% 的企业物联网部署者把永久漫游限制视为关键扩张障碍，Tier-1 MNO
              又在收紧批发接入，长期毛利率就需要持续投资本地 IMSI 协议和多网络核心韧性。
