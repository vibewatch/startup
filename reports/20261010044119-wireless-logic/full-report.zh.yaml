chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、平台架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 于 2000
              年在英国成立，从专业蜂窝通信时长供应商成长为欧洲领先的托管式物联网连接平台。公司把企业硬件与全球移动网络运营商（MNO）连接起来，提供统一窗口的连接编排、安全管理和计费管理。Wireless Logic
              的技术差异化核心是 Conexa：这套专为电信场景打造的核心网络提供企业级 99.99 percent 可用性 SLA，依托 multi-IMSI 连接覆盖 165 个国家、超过 750
              个蜂窝网络。平台不再依赖日益受到监管审查的标准商业 SIM 漫游配置，而是集成 GSMA SGP.32 远程 SIM 配置，通过空中方式管理嵌入式
              SIM（eSIM）配置。该架构让能源、物流、公用事业和农业领域的企业车队无需更换实体 SIM 卡即可在全球部署联网硬件，同时提供原生专用 APN、实时诊断遥测，并按 EU Cyber Resilience Act
              对齐端到端安全合规。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO010
              - CO012
      - number: '1.2'
        title: 高管团队、治理结构与创始人交接
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的高管团队兼具创始人长期延续性与机构化电信治理。联合创始人 Oliver Tucker 仍任首席执行官；他于 2000 年共同创办公司，并在 ECI Partners 支持下于
              2011 年完成从 Peter Jones 的 Phones International Group 管理层回购。联合创始人 Philip Cole 也在公司快速扩张的二十年间负责欧洲商业拓展和 MNO
              合作伙伴发展。为管理公司向数十亿英镑规模企业的转型，Wireless Logic 建立 Tier-1 治理董事会，由 BT Group 前董事长、英国工业联合会（CBI）前主席及 KPMG
              International 前高级合伙人 Sir Michael Rake 担任主席。General Atlantic 取得少数成长股权后，治理监督进一步加强：公司任命 Vodafone Group
              前首席执行官、前意大利技术创新与数字转型部长 Vittorio Colao 为非执行董事，负责高层运营商关系和战略监管指导。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 股权结构、私募股权资方与估值提升
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的公司股权结构显示出连续的私募股权支持：Montagu Private Equity 于 2018 年以据报道约 £1.3 billion 的企业价值从 CVC Capital
              Partners 手中取得多数控制权，此后扩张提速。2025 年，Montagu 设立 €2.0 billion
              单资产延续基金（SACV），这是当年欧洲完成的最大延续基金，以保留主要资方地位并把合作延续到下一增长阶段。TPG GP Solutions 担任主要老股投资者，CVC Secondary Partners 和
              Partners Group 担任联合主投方。与此同时，全球成长股权机构 General Atlantic 通过其 BeyondNetZero 气候基金取得重要少数股权，对应隐含企业估值约 £3.5
              billion（约 $4.65 billion）。2026 年 3 月，阿联酋支持的气候投资基金 ALTÉRRA 从新设 Opportunity Fund 承诺出资，与 BeyondNetZero
              一起加快全球供应链中的减碳型物联网基础设施部署。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
