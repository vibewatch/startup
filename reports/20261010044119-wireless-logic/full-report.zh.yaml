  summary: >-
    Wireless Logic 是一家源自英国的托管式物联网连接平台，通过 Conexa、SIMPro 及相关平台软件，为企业和中小企业设备车队编排全球 SIM 与 eSIM
    连接。公司将经常性连接订阅与平台及增值软件结合，服务运输、公用事业、医疗、零售、安防和 OEM 部署等垂直行业。2025 年延续基金和少数股权投资交易完成后，公司仍由 Montagu 控制，并获得 General Atlantic
    支持；但 FY2024 之后的利润率、杠杆和留存情况对外公开程度有限。
