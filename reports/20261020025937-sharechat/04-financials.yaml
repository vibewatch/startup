company:
  name: "ShareChat"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    ShareChat's FY24 filing-based disclosures show a business split between live-streaming or
    chatroom monetization and advertising, but with losses and operating cash outflow still larger
    than revenue. Later company-issued updates indicate substantial EBITDA improvement and a
    ₹1,000 crore-plus annualized revenue level, yet current cash, audited FY26 statements, realized
    pricing, and financing terms remain unavailable for underwriting.
sections:
  - id: "revenue-model-and-quality"
    title: "Revenue model and quality"
    body: >-
      ShareChat monetizes two related activity pools rather than a single subscription product.
      Filing-based reporting for FY24 attributes ₹403 crore, or 56.1% of operating revenue, to live
      streaming or chatrooms and ₹315.37 crore to advertising. Company and secondary descriptions
      connect the first pool to consumer transactions and virtual gifting, while advertising
      converts regional-language reach into brand inventory. This mix reduces pure dependence on
      advertising, but public evidence does not disclose virtual-gift take rates, payer conversion,
      creator payouts, ad load, or realized CPMs. The reported ₹718.1 crore of FY24 operating
      revenue is therefore revenue, not ARR, and the current contribution margin of either stream
      cannot be reconstructed from public data.
    claimRefs: ["CI001", "CI002", "CI003", "CI004"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "cost-base-and-unit-economics"
    title: "Cost base and unit-economics proxies"
    body: >-
      FY24 shows meaningful cost compression without establishing attractive unit economics.
      Entrackr's review of consolidated filings reports total expenses of ₹2,644.71 crore, net loss
      of ₹1,898.94 crore, and adjusted EBITDA loss of ₹777.84 crore. It also reports ₹964.96 crore
      of operating cash outflow, which must not be conflated with either accounting loss or adjusted
      EBITDA. Employee benefits and server rent remained major cost centers, while finance cost rose
      to ₹510.57 crore. The resulting public proxies show that infrastructure, people, financing,
      content, and creator economics all matter, but they do not reveal CAC, cohort retention,
      payer density, creator payout ratios, or gross margin by product.
    claimRefs: ["CI005", "CI006", "CI007", "CI008", "CI010"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital adequacy and financing dependency"
    body: >-
      The latest detailed balance-sheet snapshot in the assigned evidence is weak relative to the
      operating burden: Entrackr reports only ₹36.2 crore of cash and bank balances at FY24 year-end,
      alongside ₹964.96 crore of operating cash outflow for that year. ShareChat subsequently
      announced a $49 million convertible-debenture round for monetization investment and consumer
      transactions, while Inc42 lists two 2024 debt tranches totaling $64.89 million and Entrackr
      rounds the year's debt raised to $65 million. Funding raised is not cash available, and none of
      these sources discloses current unrestricted cash, coupon, maturity, conversion mechanics,
      security, covenants, or preference effects. Capital adequacy therefore remains a material
      diligence blocker rather than a calculable runway.
    claimRefs: ["CI008", "CI009", "CI010", "CI011", "CI012"]
  - id: "trajectory-and-financial-verdict"
    title: "Trajectory and financial verdict"
    body: >-
      Later indicators point in the right direction but are not equivalent to audited cash-flow
      proof. A secondary report says FY25 revenue was broadly flat at ₹723 crore while adjusted
      EBITDA loss fell 72% to ₹219 crore. In a 2026 LinkedIn update, the company said annualized
      revenue had passed ₹1,000 crore in FY26 and that it had generated positive EBITDA for the last
      two quarters. Those claims suggest operating leverage and a possible inflection, but they are
      company-issued, use an annualized run-rate measure rather than recognized full-year revenue,
      and do not disclose cash conversion. The underwriting verdict is improving revenue quality
      and margin direction with high residual financing risk; audited FY25-FY26 statements and a
      current debt-and-cash schedule are required before assigning a durable margin or runway case.
    claimRefs: ["CI013", "CI014", "CI015", "CI016"]
