      - ["Virtual gifting / consumer transactions", "Users purchase digital goods or gifts linked to creators and live activity", "Named by the company as a growth avenue; no standalone revenue disclosed", "Company-issued and secondary descriptions", "Potentially diversifies revenue beyond ads, but margin is unproven", "Provide payer conversion, ARPPU, take rate, creator share, payment fees, and chargebacks"]
      - ["QuickTV subscriptions / microdramas", "Paid subscription for short-form drama content", "FY25 secondary source describes the model; price and recognized revenue unavailable", "Low-reputation secondary report", "Adds a subscription path but introduces content-acquisition cost", "Provide plan prices, paid subscribers, churn, content amortization, and contribution margin"]
    notes: "Values are historical public disclosures or source descriptions; unavailable stream economics are shown as gaps rather than estimates."
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI013"]
  - id: "TI002"
    title: "Pricing and monetization evidence"
    columns: ["Monetization surface", "Price / unit / contract evidence", "List versus realized pricing", "Known discount or cost issue", "Source status", "Diligence ask"]
    rows:
      - ["Advertising", "No public rate card or contract unit retained", "Realized FY24 revenue disclosed; unit pricing unavailable", "Discounts, agency rebates, and revenue concentration unavailable", "Operating revenue reported from filings", "Sample top advertiser contracts and invoice-level net CPM bridge"]
      - ["Virtual gifts / live transactions", "Coin, gift, or take-rate schedule unavailable", "Company identifies the stream but does not disclose realized unit price", "Creator payout, payment processing, taxes, and refunds unavailable", "Mechanism described by company and secondary sources", "Monthly payer cohorts, gross billings, net revenue, and creator waterfall"]
      - ["QuickTV subscription", "Subscription model reported; plan price unavailable", "Neither list nor realized price retained", "Promotions, free trials, churn, and content cost unavailable", "Secondary report only", "Subscriber ledger, plan mix, renewal curve, and content contribution margin"]
    notes: "No public pricing schedule in the assigned evidence supports a realized-price conclusion; every null is an explicit diligence request."
    claimRefs: ["CI001", "CI003", "CI004", "CI013"]
  - id: "TI003"
    title: "Public unit-economics and capital proxies"
    columns: ["Metric", "Period", "Reported value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Operating revenue", "FY24", "₹718.1 crore", "Medium", "Denominator for scale and expense comparisons; not ARR", "Audited revenue recognition by product and gross-versus-net treatment"]
      - ["Total expenses", "FY24", "₹2,644.71 crore", "Medium", "Shows the cost base remained far above operating revenue", "Audited expense bridge separating recurring and exceptional items"]
      - ["Net loss", "FY24", "₹1,898.94 crore", "Medium", "Accounting loss remains substantial", "Reconcile net loss to adjusted EBITDA and cash flow"]
      - ["Adjusted EBITDA loss", "FY24", "₹777.84 crore", "Medium", "Management-style operating proxy excludes major costs", "Exact adjustment schedule and policy consistency"]
      - ["Operating cash outflow", "FY24", "₹964.96 crore", "Medium", "Closest retained public burn proxy, but only for the historical period", "Monthly cash flow and current normalized burn"]
      - ["Cash and bank balances", "FY24 year-end", "₹36.2 crore", "Medium", "Historical liquidity snapshot; not current cash available", "Current unrestricted cash, restricted cash, and minimum-liquidity covenants"]
      - ["Finance cost", "FY24", "₹510.57 crore", "Medium", "Signals a material financing burden", "Instrument-level interest, maturity, security, and conversion schedule"]
      - ["Adjusted EBITDA loss", "FY25", "₹219 crore; down 72% from ₹793 crore", "Low", "Suggests cost repair, but relies on secondary reporting", "Audited FY25 statements and EBITDA reconciliation"]
    notes: "FY24 values come from Entrackr's filing review; FY25 adjusted EBITDA is lower-confidence secondary reporting and is not treated as cash burn."
    claimRefs: ["CI002", "CI005", "CI006", "CI007", "CI008", "CI009", "CI010", "CI014"]
