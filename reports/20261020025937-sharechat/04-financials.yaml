callouts:
  - calloutType: "risk"
    title: "Financing is not runway"
    body: >-
      The 2024 debt and convertible-debenture raises extend financing capacity, but the assigned
      evidence does not establish current unrestricted cash or instrument terms. Funding raised
      therefore cannot be presented as cash available or divided by historical loss to infer runway.
    claimRefs: ["CI008", "CI009", "CI011", "CI012"]
  - calloutType: "insight"
    title: "The profitability signal improved, but the proof standard has not"
    body: >-
      FY25 secondary reporting and the company's 2026 update point to much better adjusted EBITDA,
      yet neither replaces audited statements, an adjustment bridge, or cash conversion data.
    claimRefs: ["CI013", "CI014", "CI015", "CI016"]
