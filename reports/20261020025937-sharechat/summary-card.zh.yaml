  topStrengths:
    - ShareChat 和 Moj 聚焦印度本土语言，定位差异化；据报道，整个产品矩阵每月可变现用户超过 2 亿。
    - 据报道，FY25 调整后 EBITDA 亏损下降 72%，至 2.19 亿卢比，显示经营状况明显修复。
    - 变现触点覆盖广告、直播或聊天室活动、创作者生态，以及新兴的微短剧形式。
  topRisks:
    - 当前不受限现金、债务与可转债条款、契约风险敞口，以及现金流核对关系，均未被公开证实。
    - FY25 收入几乎没有增长，法定口径亏损仍然很大；Moj 还在亏损，原因是视频流媒体成本高。
    - 隐私、安全、内容审核有效性、监管状态、诉讼和集中度控制，均缺乏独立的公开验证。
    - 当前一轮融资的估值、完全摊薄股权结构表、清算优先权和转换机制均未公开披露。
  unresolvedGaps:
    - 经审计的 FY25 和 FY26 财务报表、当前不受限现金，以及从调整后 EBITDA 到经营现金流的月度桥接表。
    - 完整的债务和可转债协议，包括票息、到期日、契约、转换触发条件、受偿顺序和清算优先权。
    - 完全摊薄股权结构表、当前条款清单、董事会权利、委员会构成，以及近期一级或二级市场估值证据。
    - 产品层面的留存率、付费转化率、广告主集中度、创作者分成、实际成交价格和贡献利润率。
    - 独立安全测试、事故历史、隐私控制、正常运行时间，以及各语言层面的内容审核有效性。
