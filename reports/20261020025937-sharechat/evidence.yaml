evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee composition, founder voting rights, and executive organization chart.
    whyItMatters: Governance rights determine oversight quality, key-person exposure, and IPO readiness.
    diligencePath: Request the latest cap table, board minutes, committee charters, and current organization chart from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: Current priced equity valuation and complete terms for the 2024 debt or convertible financings.
    whyItMatters: >-
      Historical funding raised does not establish current equity value, dilution, liquidation preference, or debt
      burden.
    diligencePath: Obtain executed 2024 financing documents, the latest 409A or board valuation, and the fully diluted cap table.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: cover-metrics
    missingEvidence: Current headcount, unrestricted cash, monthly active users by product, payer count, and advertiser count.
    whyItMatters: Dated or differently defined operating metrics cannot establish current scale, liquidity, or monetization quality.
    diligencePath: Request the latest board KPI pack, payroll roster, bank statements, and metric-definition bridge by product.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: investor-rights
    missingEvidence: Exhaustive current shareholder list with ownership, preferences, debt conversion rights, and board representation.
    whyItMatters: A historical investor roster cannot establish present control or the economic waterfall.
    diligencePath: Reconcile the statutory shareholder register, cap table, financing documents, and board appointment rights.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A reputable market-wide estimate for Indian regional-language social, short-video, live-interaction, and
      microdrama spend with non-overlapping definitions.
    whyItMatters: >-
      Without a spend denominator and category definitions, TAM, SAM, SOM, and market share cannot be calculated
      defensibly.
    diligencePath: >-
      Commission or obtain third-party India digital-advertising and paid-content datasets segmented by language,
      format, geography, and platform category.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: audience-denominators
    missingEvidence: >-
      Deduplicated monthly active, monthly monetizable, creator, viewer, payer, and subscriber counts by app and
      geography.
    whyItMatters: Published user and download measures may overlap and cannot establish serviceable reach or conversion.
    diligencePath: >-
      Review management dashboards and metric definitions, then reconcile ShareChat, Moj, and QuickTV cohorts to one
      unique-user bridge.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Advertiser retention, repeat-spend cohorts, realized CPMs, live-chat payer rates, QuickTV paid conversion, and
      creator payout shares.
    whyItMatters: >-
      Revenue totals alone do not show budget durability, unit economics, or whether new adjacencies expand the
      serviceable market.
    diligencePath: >-
      Request product-level cohort, pricing, contribution-margin, advertiser-retention, and creator-payout schedules for
      FY25 and FY26.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: >-
      Comparable advertiser rate cards, realized CPMs, campaign ROI, creator payouts, discount schedules, and contract
      terms across ShareChat, Meta, YouTube, and domestic peers.
    whyItMatters: >-
      Without realized prices and outcomes, the report cannot determine whether regional targeting creates a defensible
      pricing advantage or merely offsets smaller distribution.
    diligencePath: >-
      Obtain anonymized advertiser contracts and campaign cohorts, then benchmark realized pricing, conversion, repeat
      spend, and contribution margin against alternative channels.
