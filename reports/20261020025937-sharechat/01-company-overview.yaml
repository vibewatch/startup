company:
  name: ShareChat
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Mohalla Tech is the Bengaluru-based private company behind ShareChat, Moj,
    and QuickTV. Company-reported FY25 revenue was Rs 723 crore and adjusted
    EBITDA loss was Rs 219 crore, but current valuation, unrestricted cash,
    headcount, financing terms, and board rights remain material diligence gaps.
sections:
  - id: identity-and-portfolio
    title: Identity, origin, and product portfolio
    body: >-
      ShareChat is the consumer brand of Mohalla Tech Private Limited, a
      Bengaluru-headquartered company founded in 2015 by Ankush Sachdeva, Bhanu
      Pratap Singh, and Farid Ahsan. Its organizing thesis is vernacular social
      participation: the official site describes a platform designed for
      Indian-language communities, while secondary profiles consistently identify
      ShareChat and Moj as the core social and short-video products. Mohalla Tech
      launched Moj in July 2020 and added subscription-led micro-drama app QuickTV
      in May 2025. This broadens the portfolio from social feeds and short video
      into paid entertainment, but the assigned evidence does not provide
      product-level audited revenue or profit allocation.
    claimRefs: [CO001, CO002, CO003, CO004]
    figureRefs: [FO001]
  - id: scale-and-business-model
    title: Scale and monetization
    body: >-
      The strongest current scale disclosure is company-issued: ShareChat said
      in October 2025 that its platforms had more than 200 million monthly
      monetizable users. That denominator is not interchangeable with monthly
      active users, customers, or paying users, so it should not be presented as
      a customer count. FY24 filing-based reporting provides a clearer business
      model signal: live streaming or chatroom activity generated Rs 403 crore,
      or 56.1% of operating revenue, while advertising generated Rs 315.37 crore.
      The mix shows material dependence on user monetization alongside ads.
      Current cohort retention, payer density, advertiser concentration, and
      product-level revenue remain unavailable in the allocated evidence.
    claimRefs: [CO005, CO009]
    tableRefs: [TO001]
  - id: capital-and-financial-position
    title: Capital history and financial position
    body: >-
      Independent funding summaries place cumulative capital raised at roughly
      $1.26 billion to $1.3 billion, but this is capital raised rather than cash
      available. Inc42 lists major equity rounds in 2018 and 2021 and two debt
      tranches totaling about $64.9 million in 2024. For FY25, the company
      reported Rs 723 crore of revenue and a 72% reduction in adjusted EBITDA
      loss to Rs 219 crore; it separately said annual recurring revenue exceeded
      Rs 1,000 crore by the end of H1 FY26. ARR is a run-rate measure, not
      recognized revenue. Filing-based FY24 reporting showed an accounting loss
      of Rs 1,898.94 crore and only Rs 36.2 crore in cash and bank balances,
      underscoring why audited cash flow and debt terms matter.
    claimRefs: [CO006, CO007, CO008, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, governance, and execution dependence
    body: >-
      An October 2025 company announcement identifies cofounder Ankush Sachdeva
      as CEO, making him the only current executive whose role is verified in the
      assigned evidence. The two other founders are consistently named in
      company and secondary sources, but their current operating titles, board
      seats, and voting rights are not disclosed here. Recurring workforce
      reductions from 2023 through early 2025 are an adverse execution signal:
      filing-based reporting cites 700 cuts in two 2023 phases and another 5% in
      August 2024, while a separate profile describes further reductions in
      January 2025. Without a current organization chart or cap table, key-person
      exposure and institutional governance cannot be fully assessed.
    claimRefs: [CO002, CO015, CO016]
    tableRefs: [TO002]
