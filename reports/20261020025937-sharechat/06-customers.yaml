schemaVersion: "report-v2"
artifact: customers
slug: sharechat
runDate: 2026-10-20
company:
  name: ShareChat
chapter:
  number: 6
  title: Customers
  summary: >-
    ShareChat serves a large vernacular-language consumer audience and a creator
    supply base, while monetization is split between live/chatroom activity and
    advertising. Public evidence supports reach and engagement but does not
    disclose cohort retention, payer density, advertiser concentration, or
    independently verified production outcomes for named commercial partners.
sections:
  - id: customer-segments-and-scale
    title: Customer segments and scale
    body: >-
      ShareChat is best understood as a multi-sided network rather than a
      conventional single-buyer product. Regional-language consumers use the
      feeds, video, chatroom, and community surfaces; creators supply localized
      content and can earn through brand collaborations or platform incentives;
      advertisers and agencies pay for access to those audiences; and live or
      chatroom participants generate microtransaction revenue. IIMA describes
      the original wedge as overlooked regional-language internet users, while a
      lower-quality secondary profile describes demand among first-time users in
      smaller Indian towns. The official company page displayed 110 million-plus
      monthly active users and 1.5 million-plus creators when accessed, but it
      did not date those measurements. Those figures establish claimed scale,
      not unique paying customers, retention, or customer-level economics.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU015]
    tableRefs: [TU001]
  - id: adoption-and-monetization
    title: Adoption, engagement, and monetization
    body: >-
      The clearest public adoption signals are company-disclosed engagement
      metrics: 31 minutes of average daily time spent and more than 1.1 billion
      daily video plays. Their missing measurement dates and denominators limit
      trend interpretation. FY24 financial reporting provides a firmer view of
      payer behavior: Entrackr reported that live streaming or chatrooms
      generated INR 403 crore, or 56.1% of operating revenue, while advertising
      generated INR 315.37 crore. This indicates two distinct monetization
      engines rather than a disclosed enterprise-customer base. IIMA also
      identifies low ARPU, constrained advertising revenue, and rising
      infrastructure costs as structural monetization challenges. QuickTV adds
      a subscription-oriented expansion path, although its download and
      consumption figures currently come from a single secondary article.
    claimRefs: [CU006, CU007, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-proof-and-concentration
    title: Durability, named proof, and concentration
    body: >-
      Public customer proof is materially weaker than the audience-scale story.
      StartupTalky names JioCinema, GroupM, Dukaan, and Httpool as partners, but
      the retained evidence does not quantify campaign outcomes, contract
      duration, repeat spend, or production status. The table therefore treats
      them as counterparties rather than customers and marks the enumeration as
      partial. A separate secondary source reports that Moj monthly active users
      had declined nearly 23% by early 2024, providing an adverse durability
      signal but not a cohort-retention measure. Publicly visible audience
      figures also conflict: Wikipedia carries an undated claim of more than 350
      million ShareChat monthly active users versus the official page's 110
      million-plus figure. Investment diligence should therefore prioritize
      dated platform-level MAU/DAU cohorts, payer repeat rates, advertiser
      concentration, partner contracts, and counterparty-verified outcomes.
    claimRefs: [CU008, CU014, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation and economic role
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Revenue or strategic value
      - Diligence gap
    rows:
      - - Regional-language consumers
        - User
        - Local-language social, video, and community consumption
        - "110Mn+ MAU on the official page; measurement date not shown"
        - Supplies attention and engagement inventory
        - Platform-level DAU/MAU, geography, and cohort retention
      - - Creators
        - User and content supplier
        - Create localized posts and videos; build audiences
        - "1.5Mn+ creator community on the official page; measurement date not shown"
        - Supplies content and supports brand collaboration
        - Active-creator rate, payout distribution, and creator retention
      - - Live and chatroom participants
        - User and payer
        - Participate in live or chatroom experiences and related transactions
        - "INR 403 crore FY24 revenue; 56.1% of operating revenue"
        - Largest disclosed FY24 operating-revenue stream
        - Paying-user count, payer density, repeat rate, and take rate
      - - Advertisers and agencies
        - Payer and channel
        - Reach vernacular audiences with campaigns
        - "INR 315.37 crore FY24 advertising revenue"
        - Second disclosed monetization engine
        - Top-advertiser concentration, renewal, pricing, and repeat spend
      - - Content and commerce partners
        - Partner and distribution channel
        - Supply content or connect merchants and creators
        - Four named counterparties in one secondary roundup
        - Extends inventory, distribution, and commercial reach
        - Counterparty confirmation, contract scope, and measured outcomes
    notes: >-
      Scale figures are company-disclosed and undated unless FY24 is stated;
      customer, payer, and creator categories overlap and must not be summed.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU008, CU009, CU010]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period / date
      - Source
      - Confidence
      - Implication
      - Missing denominator or qualifier
    rows:
      - - ShareChat monthly active users
        - "110Mn+"
        - Undated page accessed 2026-10-20
        - ShareChat
        - Medium
        - Large claimed consumer reach
        - Platform definition, geography, and comparable prior periods
      - - Creator community
        - "1.5Mn+"
        - Undated page accessed 2026-10-20
        - ShareChat
        - Medium
        - Meaningful claimed content-supply base
        - Active creators, earnings, and retention
      - - Average daily time spent
        - "31 minutes"
        - Undated page accessed 2026-10-20
        - ShareChat
        - Medium
        - Indicates claimed engagement depth
        - Per active user methodology and platform scope
      - - Daily video plays
        - "1.1Bn+"
        - Undated page accessed 2026-10-20
        - ShareChat
        - Medium
        - Indicates claimed content-consumption volume
        - Unique viewers, autoplay treatment, and platform scope
      - - Moj monthly active user movement
        - "Nearly 23% decline from over 72 million"
        - Early 2024
        - Grokipedia
        - Low
        - Adverse proxy for durability and competitive pressure
        - Primary measurement source, exact endpoints, and cohort detail
      - - QuickTV downloads
        - "More than 15 million"
        - Reported 2025-10-21
        - Bharatfast
        - Low
        - Suggests early reach for the subscription expansion
        - Active subscribers, retention, geography, and acquisition cost
    notes: >-
      This is a mixed-metric trajectory, not a cohort funnel; company-disclosed
      metrics lack vintages and the Grokipedia and Bharatfast figures require
      primary-source confirmation.
    claimRefs: [CU004, CU005, CU006, CU007, CU012, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - JioCinema
        - Content partner
        - Multilingual short-form Paris Olympics 2024 content
        - Time-bounded production partnership reported
        - No quantified outcome in retained evidence
        - No counterparty source, reach, economics, or renewal evidence
      - - GroupM
        - Agency partner
        - Digital-marketing collaboration
        - Partnership reported; operating scope not verified
        - No quantified outcome in retained evidence
        - No client spend, campaign result, or renewal evidence
      - - Dukaan
        - Commerce partner
        - Connect merchants with ShareChat and Moj creators
        - Partnership reported; production volume not verified
        - No quantified outcome in retained evidence
        - No merchant count, conversion, spend, or retention evidence
      - - Httpool by Aleph
        - Sales-channel partner
        - Increase sales and broaden market reach
        - Partnership reported; production scope not verified
        - No quantified outcome in retained evidence
        - No revenue attribution, geography, or renewal evidence
    notes: >-
      Partial enumeration from one secondary roundup, corroborated only at the
      business-model level by a separate secondary source; these are partners,
      not verified retained customers, and null outcomes mean not publicly found.
    enumerationScope:
      coverage: partial
      basis: >-
        Named commercial counterparties found in the assigned prefetched source
        pool through the 2026-10-20 access date.
    claimRefs: [CU002, CU008]
figures:
  - id: FU001
    title: Customer participation and monetization journey
    type: journey-map
    summary: >-
      ShareChat converts regional-language discovery into creator supply,
      engagement, transactions, advertising inventory, and partner distribution.
    data:
      items:
        - label: Discover
          detail: Regional-language consumers enter through localized social and video feeds.
          touchpoints:
            - ShareChat feed
            - Moj short video
          value: "110Mn+ claimed ShareChat MAU"
          note: Official figure is undated.
        - label: Create
          detail: Creators publish localized posts and videos for language communities.
          touchpoints:
            - Creation tools
            - Creator community
          value: "1.5Mn+ claimed creators"
          note: Active-creator and retention rates are not disclosed.
        - label: Engage
          detail: Users watch video and participate in community and chatroom activity.
          touchpoints:
            - Video
            - Communities
            - Chatrooms
          value: "31 minutes claimed average daily time spent"
          note: Methodology and platform scope are not disclosed.
        - label: Transact
          detail: Live and chatroom participation supports user-funded monetization.
          touchpoints:
            - Live streaming
            - Chatrooms
          value: "56.1% of FY24 operating revenue"
          note: Paying-user count and repeat rate are unavailable.
        - label: Advertise
          detail: Brands and agencies pay to reach vernacular audiences.
          touchpoints:
            - Brand campaigns
            - Agency channel
          value: "INR 315.37 crore FY24 advertising revenue"
          note: Customer concentration and renewal are unavailable.
        - label: Expand
          detail: Content, commerce, and sales partners extend inventory and distribution.
          touchpoints:
            - JioCinema
            - Dukaan
            - GroupM
            - Httpool
          value: "Four named counterparties in retained evidence"
          note: Counterparty-confirmed outcomes were not found.
    approximationNotes: >-
      Ordered analytical journey only; stages are not a conversion funnel and do
      not represent one population, a common period, or value-proportional scale.
    claimRefs: [CU001, CU003, CU006, CU009, CU010, CU015]
callouts:
  - calloutType: insight
    title: Monetization is multi-sided
    body: >-
      FY24 revenue evidence indicates that live/chatroom activity and advertising
      are separate payer engines, so consumer MAU should not be treated as a
      customer count or converted into ARPU without payer and platform denominators.
    claimRefs: [CU009, CU010, CU011]
  - calloutType: risk
    title: Scale claims are not yet durable-customer proof
    body: >-
      Conflicting, undated MAU figures and the absence of cohort retention,
      advertiser renewal, and partner-outcome data prevent a reliable view of
      customer durability or concentration.
    claimRefs: [CU004, CU014, CU016]
