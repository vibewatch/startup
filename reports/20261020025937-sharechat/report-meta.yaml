companyProfile:
  summary: >-
    ShareChat is the consumer brand of Bengaluru-based Mohalla Tech Private Limited, founded in 2015 to serve
    Indian-language internet users. Its portfolio spans the ShareChat social platform, Moj short video, live and
    chatroom monetization, and newer QuickTV microdramas. Public disclosures show meaningful audience scale and
    improving adjusted EBITDA, but the private company remains opaque on current liquidity, security terms, governance,
    retention, and product-level profitability.
