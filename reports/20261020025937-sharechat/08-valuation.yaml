    claimRefs: [CV003, CV007, CV008, CV009, CV010, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price before quality
    body: >-
      The company may be improving, but the available evidence cannot translate that improvement
      into an investable price. Require current security terms and audited cash flow before changing
      the recommendation from track / research more.
    claimRefs: [CV004, CV005, CV014, CV015, CV016]
  - calloutType: risk
    title: Funding raised is not cash available
    body: >-
      Cumulative funding exceeds $1 billion in every retained aggregator, while Entrackr reports
      only Rs 36.2 crore of cash and bank balances at FY24 year-end. The different dates and scopes
      prevent a direct runway calculation, but they make fresh liquidity evidence essential.
    claimRefs: [CV001, CV002, CV003, CV009]
