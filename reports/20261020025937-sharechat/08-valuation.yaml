company:
  name: ShareChat
chapter:
  number: 8
  title: Valuation
  summary: >-
    ShareChat shows meaningful operating repair, but the retained public evidence does not support
    a current equity value or return underwriting. A reported markdown from a roughly $5 billion
    peak to below $2 billion, 2024 debt financing, and thin FY24 cash make the recommendation
    track / research more until current terms, audited cash flow, and exit assumptions are verified.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The evidence supports a track / research-more recommendation, with medium confidence in the
      direction of the call but low confidence in any price-specific conclusion. ShareChat has
      raised substantial capital and third-party reports describe operating improvement, yet total
      funding is not cash available and operational profitability is not the same as audited net
      income or free cash flow. More importantly, the assigned sources do not disclose a current
      primary equity valuation, fully diluted ownership, liquidation preferences, conversion
      mechanics, or unrestricted cash after FY24. The investment implication is therefore
      conditional: operational repair merits continued diligence, but a commitment should wait for
      a current term sheet, cap table, audited cash-flow bridge, and security-level return model.
      Historical valuation headlines alone cannot establish an attractive entry price.
    claimRefs: [CV003, CV004, CV005, CV009, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that ShareChat has a differentiated vernacular audience, several monetization
      surfaces, and evidence of cost repair after an expensive expansion cycle. InforCapital
      reports more than 200 million monthly active users across the apps, while FY24 operating
      revenue rose to Rs 718.1 crore and a later report puts FY25 revenue near Rs 723 crore.
      BharatFast also reports a sharp reduction in adjusted EBITDA loss, and ScoopEarth describes
      operational profitability in the first quarter of the fiscal year beginning April 2026.
      The anti-thesis is equally material: revenue was nearly flat from FY24 to FY25 on the cited
      figures, FY24 accounting loss and operating cash outflow remained large, and external funding
      was still needed. The case improves only if audited results confirm durable cash generation
      rather than metric-definition changes or temporary cost compression.
    claimRefs: [CV001, CV006, CV007, CV008, CV011, CV012, CV014]
    tableRefs: [TV002]
  - id: financing-and-valuation-context
    title: Financing and valuation context
    body: >-
      Public funding databases agree on the broad conclusion that ShareChat has raised more than
      $1 billion, but they disagree on the exact cumulative amount. The retained figures range from
      $1.2 billion to more than $1.4 billion, so cumulative capital should be treated as an
      approximate financing-history indicator rather than a precise balance-sheet input. The
      strongest downside signal is the reported valuation reset: Grokipedia describes a peak near
      $5 billion followed by a 2024 mark below $2 billion. Inc42 and Entrackr separately identify
      two 2024 debt tranches totaling about $65 million. That structure may have extended runway,
      but the sources do not expose coupon, maturity, conversion triggers, seniority, preferences,
      or dilution. Without those terms, neither the effective entry valuation nor common-equity
      downside can be calculated responsibly.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010, CV015]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and diligence gates
    body: >-
      Bull, base, and bear cases can be framed directionally, but public evidence does not support
      numerical valuation ranges or probability percentages. The bull case requires the reported
      operational profitability to reconcile to audited cash generation, sustained revenue growth,
      and IPO-ready controls. The base case assumes operating repair continues while financing and
      exit timing remain uncertain, which supports monitoring rather than entry. The bear case is a
      renewed financing need, adverse conversion or preference terms, or failure to translate
      engagement into durable cash flow. ScoopEarth reports an ambition to raise up to $400 million
      in an IPO within four to five quarters, but this is a reported plan rather than evidence of
      readiness or market-clearing demand. Thesis-break triggers are a new down round, rising net
      debt, reversal of cash profitability, or inability to produce audited FY25-FY26 statements
      and a complete capitalization schedule.
    claimRefs: [CV004, CV005, CV007, CV008, CV009, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
