      - [Revenue, "FY24 operating revenue rose 29.9% to Rs 718.1 crore", "FY25 revenue was reported near Rs 723 crore, implying weak follow-through"]
      - [Efficiency, "Adjusted EBITDA loss was reported down to Rs 219 crore in FY25", "The view weakens if the improvement does not convert to audited free cash flow"]
      - [Financing, "More than $1 billion of historical capital demonstrates investor backing", "Prior funding is not available cash and 2024 debt may add senior claims"]
      - [Exit, "Management was reported to be targeting an IPO", "The view changes only with filed offering evidence, audited controls, and credible demand"]
    notes: "Metrics come from different third-party reports and definitions; comparisons are directional, not a reconciled audit."
    claimRefs: [CV001, CV005, CV006, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Case, Assumptions, Valuation or return logic, Key risk, Probability signal]
    rows:
      - [Bull, "Audited cash generation confirms reported operational profitability; growth reaccelerates; IPO preparation becomes verifiable", "A premium to the latest private mark may become supportable only after pricing and dilution are disclosed", "Execution or market-window slippage", "Audited positive cash flow plus a filed offering process"]
      - [Base, "Cost repair persists but growth, financing terms, and exit timing remain uncertain", "No numerical valuation range is supportable; require negotiated downside protection", "Preference overhang and a prolonged private hold", "Stable cash balance and no new senior financing"]
      - [Bear, "Cash generation reverses or another financing is required before a credible exit", "Common-equity value could compress materially after debt, conversion, and preferences", "Down round, dilution, or liquidity shortfall", "Rising net debt, missed audits, or another valuation reset"]
    notes: "Scenario ranges and probabilities are intentionally not quantified because current valuation, cap-table, debt-term, and audited cash-flow inputs are unavailable."
    claimRefs: [CV004, CV005, CV007, CV008, CV009, CV011, CV013, CV014, CV015, CV016]
