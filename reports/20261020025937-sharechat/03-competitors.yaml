  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-comparison
      missingEvidence: >-
        Comparable advertiser rate cards, realized CPMs, campaign ROI, creator payouts, discount schedules,
        and contract terms across ShareChat, Meta, YouTube, and domestic peers.
      whyItMatters: >-
        Without realized prices and outcomes, the report cannot determine whether regional targeting creates
        a defensible pricing advantage or merely offsets smaller distribution.
      diligencePath: >-
        Obtain anonymized advertiser contracts and campaign cohorts, then benchmark realized pricing,
        conversion, repeat spend, and contribution margin against alternative channels.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: minor
      topic: quicktv-launch
      missingEvidence: A primary-source QuickTV launch announcement establishing the exact public launch date.
      whyItMatters: >-
        The assigned independent sources report February and May 2025, so launch-age comparisons and growth
        rates need a verified starting date.
      diligencePath: Review the original app-store release history or a dated company launch announcement.
      relatedQuestionRefs: [QP007]
    - type: private-evidence-only
      severity: material
      topic: moat-validation
      missingEvidence: >-
        Cohort retention by language and product, creator exclusivity, multi-homing frequency, advertiser
        repeat spend, and contribution margin after content and acquisition costs.
      whyItMatters: >-
        Public user and subscriber counts do not establish switching costs, durable creator supply, or
        profitable distribution.
      diligencePath: >-
        Request monthly cohorts, creator earnings and exclusivity data, campaign renewal cohorts, and
        product-level contribution-margin bridges for ShareChat, Moj, and QuickTV.
      relatedQuestionRefs: [QP005, QP006, QP007, QP008]
