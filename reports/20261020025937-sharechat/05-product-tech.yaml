      - ["Creator and community systems", "Creator ecosystem, creator tools, chatrooms, categories, and livestream", "Creator liquidity, moderation, payments, and live operations", "No payout waterfall, abuse rate, or creator concentration data"]
      - ["Trust and safety", "Content moderation is named as a product pod", "Multilingual policy operations and review tooling", "No audited effectiveness or language-level enforcement metrics"]
      - ["Infrastructure and cost", "Large-scale systems support the product portfolio", "Server capacity and external infrastructure", "FY24 server-rent spend remained ₹559.57 crore after a 45.3% reduction"]
    notes: "Conceptual operating map derived only from public disclosures; it is not a verified internal system diagram or data-flow representation."
    claimRefs: [CE001, CE002, CE006, CE010, CE014, CE015]
