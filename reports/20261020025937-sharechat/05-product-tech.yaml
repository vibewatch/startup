chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    ShareChat's public product surface is a multi-app, vernacular-media portfolio led by ShareChat and Moj, with QuickTV adding a newer microdrama format. The disclosed operating model emphasizes AI-led discovery, creator tooling, experimentation, and content moderation, but public evidence does not establish the internal architecture, service reliability, security posture, or moderation effectiveness needed for technical underwriting.
sections:
  - id: "product-surface-and-workflows"
    title: "Product surface and user workflows"
    body: >-
      Mohalla Tech operates ShareChat and Moj as mobile content applications, while third-party coverage describes the broader business as a multi-product vernacular platform. ShareChat's official product page positions the core app around Indic-language discovery across entertainment, news, sports, devotion, and humour; Moj is the creation-and-consumption surface for short video, trending tags, and contests. QuickTV is a newer adjacent product: BharatFast reports a May 2025 launch and more than 15 million downloads, but the assigned evidence does not independently verify retention, paid conversion, or whether usage is incremental to ShareChat and Moj. The customer workflow is therefore clear at the surface level—discover, create, engage, and consume—but measurable user outcomes remain sparse.
    claimRefs: [CE001, CE005, CE011, CE012, CE013]
    tableRefs: [TE001, TE002]
  - id: "operating-model-and-maturity"
    title: "Operating model and product maturity"
    body: >-
      The official product page says ShareChat and Moj are run with AI, data-led product principles, and large-scale A/B experimentation. It also names product pods spanning feed personalization, content understanding, the creator ecosystem, discovery, chatrooms, creator tools, livestream, and content moderation. Coverage of the IIMA case study provides evidence of execution speed—the company launched Moj within 30 hours of India's TikTok ban—and attributes later growth to the MX TakaTak acquisition and AI-powered recommendation systems. Those disclosures support a mature product-operations layer, not a verified internal architecture: no assigned source exposes service boundaries, model evaluation, deployment topology, data lineage, release cadence, or rollback controls.
    claimRefs: [CE002, CE006, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "scale-differentiation-and-dependencies"
    title: "Scale, differentiation, and technical dependencies"
    body: >-
      The defensible product thesis is localization plus recommendation at scale rather than a novel public protocol or developer platform. Two non-company descriptions say the service supports more than 15 Indian languages, while official materials emphasize localized content and multiple AI-led discovery surfaces. Scale claims need reconciliation: the product page describes a 180 million-strong user community, whereas the current official history page displays 110 million-plus MAU, 1.5 million-plus creators, and 1.1 billion-plus daily video plays. These labels may measure different products, dates, or populations, so they should not be combined. Infrastructure is economically material: Entrackr reports FY24 server-rent expense of ₹559.57 crore even after a 45.3% decline.
    claimRefs: [CE003, CE004, CE007, CE008, CE012, CE014]
  - id: "trust-safety-and-diligence"
    title: "Trust, safety, reliability, and diligence priorities"
    body: >-
      ShareChat publicly identifies content moderation as a product pod, which establishes organizational ownership but not control effectiveness. The assigned pool contains no public uptime SLA, status history, penetration-test result, security certification, privacy-impact assessment, moderation precision or recall, incident taxonomy, or appeal-outcome data. It also contains no eligible developer-signal source such as a maintained repository, package registry, public API forum, engineering talk, or integration-partner technical post. Technical diligence should therefore test rather than assume resilience: management should provide architecture and data-flow diagrams, availability and incident records, model-governance evidence, moderation quality by language, security assurance, dependency concentration, and a reconciled metric dictionary for the conflicting audience labels.
    claimRefs: [CE004, CE006, CE014, CE015]
