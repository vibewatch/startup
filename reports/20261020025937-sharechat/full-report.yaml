          Audited cash generation confirms reported operational profitability; growth reaccelerates; IPO preparation
          becomes verifiable
        - A premium to the latest private mark may become supportable only after pricing and dilution are disclosed
        - Execution or market-window slippage
        - Audited positive cash flow plus a filed offering process
      - - Base
        - Cost repair persists but growth, financing terms, and exit timing remain uncertain
        - No numerical valuation range is supportable; require negotiated downside protection
        - Preference overhang and a prolonged private hold
        - Stable cash balance and no new senior financing
      - - Bear
        - Cash generation reverses or another financing is required before a credible exit
        - Common-equity value could compress materially after debt, conversion, and preferences
        - Down round, dilution, or liquidity shortfall
        - Rising net debt, missed audits, or another valuation reset
    notes: >-
      Scenario ranges and probabilities are intentionally not quantified because current valuation, cap-table,
      debt-term, and audited cash-flow inputs are unavailable.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
