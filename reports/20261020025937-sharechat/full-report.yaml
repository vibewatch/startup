chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and product portfolio
        blocks:
          - type: paragraph
            body: >-
              ShareChat is the consumer brand of Mohalla Tech Private Limited, a Bengaluru-headquartered company founded
              in 2015 by Ankush Sachdeva, Bhanu Pratap Singh, and Farid Ahsan. Its organizing thesis is vernacular
              social participation: the official site describes a platform designed for Indian-language communities,
              while secondary profiles consistently identify ShareChat and Moj as the core social and short-video
              products. Mohalla Tech launched Moj in July 2020 and added subscription-led micro-drama app QuickTV in May
              2025. This broadens the portfolio from social feeds and short video into paid entertainment, but the
              assigned evidence does not provide product-level audited revenue or profit allocation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO012
              - CO014
      - number: '1.2'
        title: Scale and monetization
        blocks:
          - type: paragraph
            body: >-
              The strongest current scale disclosure is company-issued: ShareChat said in October 2025 that its
              platforms had more than 200 million monthly monetizable users. That denominator is not interchangeable
              with monthly active users, customers, or paying users, so it should not be presented as a customer count.
              FY24 filing-based reporting provides a clearer business model signal: live streaming or chatroom activity
              generated Rs 403 crore, or 56.1% of operating revenue, while advertising generated Rs 315.37 crore. The
              mix shows material dependence on user monetization alongside ads. Current cohort retention, payer density,
              advertiser concentration, and product-level revenue remain unavailable in the allocated evidence.
            claimRefs:
              - CO005
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
