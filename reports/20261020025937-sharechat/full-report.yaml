  - id: FU001
    title: Customer participation and monetization journey
    type: journey-map
    summary: >-
      ShareChat converts regional-language discovery into creator supply, engagement, transactions, advertising
      inventory, and partner distribution.
    data:
      items:
        - label: Discover
          detail: Regional-language consumers enter through localized social and video feeds.
          touchpoints:
            - ShareChat feed
            - Moj short video
          value: 110Mn+ claimed ShareChat MAU
          note: Official figure is undated.
        - label: Create
          detail: Creators publish localized posts and videos for language communities.
          touchpoints:
            - Creation tools
            - Creator community
          value: 1.5Mn+ claimed creators
          note: Active-creator and retention rates are not disclosed.
        - label: Engage
          detail: Users watch video and participate in community and chatroom activity.
          touchpoints:
            - Video
            - Communities
            - Chatrooms
          value: 31 minutes claimed average daily time spent
          note: Methodology and platform scope are not disclosed.
        - label: Transact
          detail: Live and chatroom participation supports user-funded monetization.
          touchpoints:
            - Live streaming
            - Chatrooms
          value: 56.1% of FY24 operating revenue
          note: Paying-user count and repeat rate are unavailable.
        - label: Advertise
          detail: Brands and agencies pay to reach vernacular audiences.
          touchpoints:
            - Brand campaigns
            - Agency channel
          value: INR 315.37 crore FY24 advertising revenue
          note: Customer concentration and renewal are unavailable.
        - label: Expand
          detail: Content, commerce, and sales partners extend inventory and distribution.
          touchpoints:
            - JioCinema
            - Dukaan
            - GroupM
            - Httpool
          value: Four named counterparties in retained evidence
          note: Counterparty-confirmed outcomes were not found.
    approximationNotes: >-
      Ordered analytical journey only; stages are not a conversion funnel and do not represent one population, a common
      period, or value-proportional scale.
    claimRefs:
