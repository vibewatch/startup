            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI010
      - number: '4.2'
        title: Cost base and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              FY24 shows meaningful cost compression without establishing attractive unit economics. Entrackr's review
              of consolidated filings reports total expenses of ₹2,644.71 crore, net loss of ₹1,898.94 crore, and
              adjusted EBITDA loss of ₹777.84 crore. It also reports ₹964.96 crore of operating cash outflow, which must
              not be conflated with either accounting loss or adjusted EBITDA. Employee benefits and server rent
              remained major cost centers, while finance cost rose to ₹510.57 crore. The resulting public proxies show
              that infrastructure, people, financing, content, and creator economics all matter, but they do not reveal
              CAC, cohort retention, payer density, creator payout ratios, or gross margin by product.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The latest detailed balance-sheet snapshot in the assigned evidence is weak relative to the operating
              burden: Entrackr reports only ₹36.2 crore of cash and bank balances at FY24 year-end, alongside ₹964.96
              crore of operating cash outflow for that year. ShareChat subsequently announced a $49 million
              convertible-debenture round for monetization investment and consumer transactions, while Inc42 lists two
              2024 debt tranches totaling $64.89 million and Entrackr rounds the year's debt raised to $65 million.
              Funding raised is not cash available, and none of these sources discloses current unrestricted cash,
              coupon, maturity, conversion mechanics, security, covenants, or preference effects. Capital adequacy
              therefore remains a material diligence blocker rather than a calculable runway.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Trajectory and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Later indicators point in the right direction but are not equivalent to audited cash-flow proof. A
              secondary report says FY25 revenue was broadly flat at ₹723 crore while adjusted EBITDA loss fell 72% to
              ₹219 crore. In a 2026 LinkedIn update, the company said annualized revenue had passed ₹1,000 crore in FY26
              and that it had generated positive EBITDA for the last two quarters. Those claims suggest operating
              leverage and a possible inflection, but they are company-issued, use an annualized run-rate measure rather
              than recognized full-year revenue, and do not disclose cash conversion. The underwriting verdict is
              improving revenue quality and margin direction with high residual financing risk; audited FY25-FY26
              statements and a current debt-and-cash schedule are required before assigning a durable margin or runway
              case.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The 2024 debt and convertible-debenture raises extend financing capacity, but the assigned evidence does
              not establish current unrestricted cash or instrument terms. Funding raised therefore cannot be presented
              as cash available or divided by historical loss to infer runway.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
          - type: callout
            title: The profitability signal improved, but the proof standard has not
            body: >-
              FY25 secondary reporting and the company's 2026 update point to much better adjusted EBITDA, yet neither
              replaces audited statements, an adjustment bridge, or cash conversion data.
            calloutType: insight
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflows
        blocks:
          - type: paragraph
            body: >-
              Mohalla Tech operates ShareChat and Moj as mobile content applications, while third-party coverage
              describes the broader business as a multi-product vernacular platform. ShareChat's official product page
              positions the core app around Indic-language discovery across entertainment, news, sports, devotion, and
              humour; Moj is the creation-and-consumption surface for short video, trending tags, and contests. QuickTV
              is a newer adjacent product: BharatFast reports a May 2025 launch and more than 15 million downloads, but
              the assigned evidence does not independently verify retention, paid conversion, or whether usage is
              incremental to ShareChat and Moj. The customer workflow is therefore clear at the surface level—discover,
              create, engage, and consume—but measurable user outcomes remain sparse.
            claimRefs:
              - CE001
              - CE005
              - CE011
              - CE012
              - CE013
