      - number: '5.2'
        title: Operating model and product maturity
        blocks:
          - type: paragraph
            body: >-
              The official product page says ShareChat and Moj are run with AI, data-led product principles, and
              large-scale A/B experimentation. It also names product pods spanning feed personalization, content
              understanding, the creator ecosystem, discovery, chatrooms, creator tools, livestream, and content
              moderation. Coverage of the IIMA case study provides evidence of execution speed—the company launched Moj
              within 30 hours of India's TikTok ban—and attributes later growth to the MX TakaTak acquisition and
              AI-powered recommendation systems. Those disclosures support a mature product-operations layer, not a
              verified internal architecture: no assigned source exposes service boundaries, model evaluation,
              deployment topology, data lineage, release cadence, or rollback controls.
            claimRefs:
