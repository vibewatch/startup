  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than "Indian social media" and broader than the ShareChat app alone. The
              supported boundary includes regional-language user-generated social content, short video through Moj,
              live-streaming and chatroom monetization, advertising inventory, creator-led engagement, and subscription
              or advertising-led microdrama. It excludes the full revenue of global social networks, all Indian digital
              advertising, and generic OTT subscriptions unless ShareChat can actually compete for that budget. Tracxn's
              peer set includes global video platforms and local-language operators, while independent profiles
              emphasize smaller-city and native-language use. The practical substitutes are therefore YouTube,
              TikTok-style short video, Instagram-like feeds, VerSe/Josh, messaging-based content sharing, and users
              doing nothing beyond existing entertainment habits.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The pool does not contain a credible third-party estimate of total Indian regional-language social-media
              spend, so a conventional TAM/SAM/SOM would create false precision. A safer lens separates audience reach,
              consumption, and realized monetization. ShareChat reports more than 200 million monthly monetizable users
              across its platforms, while its FY24 operating revenue was Rs 718.1 crore and FY24 advertising revenue was
              Rs 315.37 crore. Those figures show commercial demand but are company-scale proxies, not market size.
              Microdrama adds a newer adjacency: the company reports about 35 million monthly viewers on ShareChat and
              Moj, more than 15 million QuickTV downloads, and more than 200 million episodes watched daily. None of
              those measures can be added together or converted into market share without unique-user, payer, pricing,
              and category-spend data.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
              - CM013
      - number: '2.3'
        title: Buyers, users, and payers
        blocks:
          - type: paragraph
            body: >-
              ShareChat serves several economically distinct constituencies. Consumers create and consume
              regional-language feeds and short video; advertisers and agencies buy reach segmented by language,
              interest, and location; live-streaming or chatroom participants fund virtual interactions; and QuickTV
              viewers may pay subscriptions while ShareChat and Moj viewers receive advertising-supported microdrama.
              Creators supply the content that attracts both audiences and brand budgets, but the retained sources do
              not reveal creator payout rates or revenue shares. Budget ownership therefore differs by product: brand
              and agency marketing budgets support advertising, consumers support live or subscription products, and
              ShareChat funds creator tooling and recommendation infrastructure to keep those sides active.
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Cheap smartphones, lower mobile-data costs, native-language interfaces, culturally specific content, and
              habitual sharing are the central adoption drivers described by the retained sources. The commercial
              constraint is that India is also described by ShareChat as a low-ARPU and highly competitive market,
              making reach insufficient unless advertising, live-chat, subscriptions, and creator economics convert
              efficiently. FY24 operating cash outflow and a small reported cash balance relative to that outflow
              underscore the capital intensity of scaling engagement, even though later company-issued material says the
              core business became cash-flow positive. For valuation, the key diligence issue is not whether engagement
              exists, but whether unique users, payer conversion, advertiser repeat spend, and contribution margins
              support a durable share of addressable budgets.
            claimRefs:
              - CM002
              - CM008
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: TAM remains unproven
            body: >-
              The retained pool supports company-scale audience, consumption, and revenue proxies, not a market-wide
              spend denominator or non-overlapping serviceable audience. A valuation case should not convert the 200
              million-plus portfolio claim or third-party 400 million-plus user language into market share without
              reconciled definitions.
            calloutType: risk
            claimRefs:
              - CM004
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans global incumbents, local short-video peers, and new entertainment formats
        blocks:
          - type: paragraph
            body: >-
              ShareChat and Moj compete for attention, creators, and advertiser budgets rather than occupying an
              isolated vernacular category. The reviewed evidence places Instagram and Facebook among the global social
              incumbents, YouTube among the video alternatives, and Josh, Roposo, and Chingari among the domestic
              short-video set. Internal advertiser content programs and distribution through existing social channels
              remain practical substitutes because public sources do not show that buyers must use ShareChat to reach
              regional-language audiences. The most important landscape change is category expansion: QuickTV places
              Mohalla Tech beside Kuku and EloElo in microdramas, where the audience, content economics, and
              subscription-versus-advertising choices differ from the original social-feed market. This is therefore a
              portfolio competition, not a single-app contest.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Language depth is real differentiation, but distribution power belongs to larger networks
        blocks:
          - type: paragraph
            body: >-
              Native regional-language content and discovery remain ShareChat's clearest differentiated capability. That
              focus serves users and creators outside English-first feeds and is consistently described across the
              retained sources. It is not, however, exclusive access: ShareChat's CFO said the company no longer frames
              itself as a replacement for Meta or Google, and management claims that 95% of its audience also uses Meta
              or YouTube. The implication is extensive multi-homing and weak platform-level lock-in. Creators can seek
              broader fame and monetization on global networks while using ShareChat for local discoverability;
              advertisers can similarly allocate across channels. ShareChat's advantage is thus relevance within a
              particular consumption context, not ownership of the user relationship.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP008
              - CP010
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP016
      - number: '3.3'
        title: Public evidence favors an economics comparison over a list-price comparison
        blocks:
          - type: paragraph
            body: >-
              None of the retained sources provides comparable advertiser rate cards, realized CPMs, creator payouts, or
              enterprise contract terms across ShareChat, Meta, YouTube, and local peers. The defensible comparison is
              therefore packaging and economic mechanism, with unsupported price cells explicitly marked unknown.
              ShareChat's established model is advertising and creator-led engagement, while the microdrama portfolio
              introduces subscription packaging alongside advertising. Management cited a materially higher acquisition
              cost for a paying microdrama subscriber than for a general ShareChat or Moj user, highlighting the risk
              that apparent subscription revenue is recycled into acquisition. Without cohort retention, realized
              pricing, and contribution-margin data, reported subscriber or user scale cannot establish durable unit
              economics.
            claimRefs:
              - CP009
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP016
      - number: '3.4'
        title: The moat is contextual relevance, while displacement risk remains structural
        blocks:
          - type: paragraph
            body: >-
              The competitive evidence supports a moderate, conditional moat. ShareChat has a differentiated
              language-first product and Moj survived the attrition that removed several domestic short-video peers, but
              the core app's third-party monthly-active-user estimate fell from 104 million in March 2024 to 79 million
              in February 2025 after paid acquisition stopped. Global platforms benefit from larger creator pools,
              mature recommendation systems, and broader monetization reach. Microdramas may increase time spent and
              open another revenue stream, yet the category reportedly contains at least 50 apps and high churn. The
              investment case should treat vernacular engagement as a useful wedge, not a permanent barrier, until
              management demonstrates stable cohorts, creator exclusivity, and profitable acquisition.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-homing limits lock-in
            body: >-
              Management's claim that 95% of ShareChat's audience overlaps with Meta and YouTube means local relevance
              should not be mistaken for exclusive distribution or high switching cost.
            calloutType: risk
            claimRefs:
              - CP006
          - type: callout
            title: Microdrama is a category shift, not a simple feature extension
            body: >-
              QuickTV introduces subscription economics and a different competitor set; headline subscriber counts
              should be underwritten against acquisition cost, churn, content cost, and advertising contribution.
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and quality
        blocks:
          - type: paragraph
            body: >-
              ShareChat monetizes two related activity pools rather than a single subscription product. Filing-based
              reporting for FY24 attributes ₹403 crore, or 56.1% of operating revenue, to live streaming or chatrooms
              and ₹315.37 crore to advertising. Company and secondary descriptions connect the first pool to consumer
              transactions and virtual gifting, while advertising converts regional-language reach into brand inventory.
              This mix reduces pure dependence on advertising, but public evidence does not disclose virtual-gift take
              rates, payer conversion, creator payouts, ad load, or realized CPMs. The reported ₹718.1 crore of FY24
              operating revenue is therefore revenue, not ARR, and the current contribution margin of either stream
              cannot be reconstructed from public data.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
