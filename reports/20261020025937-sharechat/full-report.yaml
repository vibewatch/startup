  - id: FM001
    title: Observed opportunity ladder
    type: pyramid
    summary: >-
      Separate audience, engagement, and revenue signals show scale without pretending that the metrics form an additive
      TAM or a conversion funnel.
    data:
      items:
        - label: Portfolio monthly monetizable users
          value: 200
          unit: million+ users
          detail: Company-reported across all platforms; unique-user overlap is undisclosed.
        - label: ShareChat and Moj monthly microdrama viewers
          value: 35
          unit: million users
          detail: Company-reported monthly viewers as of October 2025.
        - label: QuickTV downloads
          value: 15
          unit: million+ downloads
          detail: Cumulative downloads within four months; not active or paying users.
        - label: Daily microdrama episodes watched
          value: 200
          unit: million+ episodes per day
          detail: Company-reported consumption across ShareChat and Moj.
        - label: FY24 advertising revenue
          value: 315.37
          unit: Rs crore
          detail: Entrackr-reported revenue segment, up 23.5% year over year.
        - label: FY24 live streaming or chatroom revenue
          value: 403
          unit: Rs crore
          detail: Entrackr-reported segment representing 56.1% of operating revenue.
    approximationNotes: >-
      No values are transformed or added; units, populations, and periods differ, so authored order is analytical rather
      than magnitude-comparable.
