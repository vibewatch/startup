        - date: '2015-01-08'
          label: Company founded
          detail: Mohalla Tech founded by Ankush Sachdeva, Bhanu Pratap Singh, and Farid Ahsan.
          tone: neutral
        - date: '2018-09-18'
          label: Series C financing
          detail: Inc42 lists a $100 million Series C financing.
          tone: positive
        - date: 2020-07
          label: Moj launched
          detail: The short-video app launched after India's TikTok ban.
          tone: positive
        - date: '2021-04-07'
          label: Series E financing
          detail: Inc42 lists a $502 million Series E financing.
          tone: positive
        - date: '2021-12-15'
          label: Series G financing
