      - CM005
      - CM006
      - CM010
      - CM011
      - CM013
  - id: FP001
    title: 'Competitive positioning map: regional-language specificity versus distribution power'
    type: quadrant
    summary: >-
      Evidence-backed ordinal scores place ShareChat high on regional specificity but below global incumbents on
      distribution power; the chart is directional and not an independent benchmark.
    data:
      points:
        - label: ShareChat
          x: 5
          'y': 3
          detail: High regional-language specificity; meaningful but declining third-party core-app audience estimate.
        - label: Moj
          x: 4
          'y': 3
          detail: Regional short-video focus with retained portfolio reach, but global creator competition.
        - label: Instagram and Facebook
          x: 3
          'y': 5
          detail: Broad localization and superior distribution; management no longer frames ShareChat as a replacement.
        - label: YouTube and Shorts
          x: 3
          'y': 5
          detail: Broad video distribution and creator reach; regional depth was not independently benchmarked.
        - label: Josh, Roposo, and Chingari
          x: 4
          'y': 2
          detail: Domestic language relevance, with weaker evidence of durable scale.
        - label: Kuku and EloElo
          x: 2
          'y': 2
          detail: Format-specific microdrama rivals; subscriber claims do not establish broad distribution.
    approximationNotes: >-
      Analyst-assigned 1-5 ordinal coordinates synthesize retained evidence: x is regional-language specificity and y is
      distribution power. Scores are directional, not measured market shares or independently verified benchmarks.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP016
  - id: FI001
    title: Revenue model and financial burden flow
    type: flow
    summary: >-
      Public evidence supports two monetization branches feeding revenue, while cost and financing burdens determine
      whether that revenue converts to cash.
    data:
      nodes:
        - id: user-activity
          label: User activity
          detail: Regional social, short-video, and live engagement create monetizable activity.
        - id: advertising
          label: Advertising inventory
          detail: Brands buy access to regional-language audiences; realized unit pricing is not public.
        - id: live
          label: Live sessions and chatrooms
          detail: Live participation supports consumer-transaction opportunities.
        - id: transactions
          label: Virtual gifts and consumer transactions
          detail: Public sources identify the mechanism but not platform take rate or creator payout.
        - id: revenue
          label: Operating revenue
          detail: FY24 operating revenue was ₹718.1 crore, with live/chatrooms the larger disclosed stream.
        - id: economics
          label: Costs, finance, and cash conversion
          detail: Infrastructure, employees, content, creator economics, and finance costs determine profitability.
      edges:
        - from: user-activity
          to: advertising
        - from: user-activity
          to: live
        - from: live
          to: transactions
        - from: advertising
          to: revenue
        - from: transactions
          to: revenue
        - from: revenue
          to: economics
    approximationNotes: >-
      Conceptual flow only; it does not imply disclosed conversion rates, a complete revenue mix, or positive cash
      conversion.
