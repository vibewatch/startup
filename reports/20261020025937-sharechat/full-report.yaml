        title: Leadership, governance, and execution dependence
        blocks:
          - type: paragraph
            body: >-
              An October 2025 company announcement identifies cofounder Ankush Sachdeva as CEO, making him the only
              current executive whose role is verified in the assigned evidence. The two other founders are consistently
              named in company and secondary sources, but their current operating titles, board seats, and voting rights
              are not disclosed here. Recurring workforce reductions from 2023 through early 2025 are an adverse
