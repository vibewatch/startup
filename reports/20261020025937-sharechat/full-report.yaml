  - id: FR001
    title: Evidence-backed residual risk heatmap
    type: matrix
    summary: >-
      Financing, statutory-loss conversion, advertising-policy exposure, and Moj economics remain the highest evidenced
      risks; compliance-control exposure is intentionally unscored.
    data:
      columns:
        - id: likelihood
          label: Likelihood / status
        - id: impact
          label: Impact
        - id: mitigation
          label: Mitigation maturity
        - id: residual
          label: Residual severity
      rows:
        - label: Liquidity and refinancing
          note: Historical cash outflow and debt dependence; current cash is unavailable.
          values:
            - value: High absent current proof
            - value: Critical
            - value: Partial
            - value: Critical
        - label: Accounting-loss conversion
          note: Adjusted EBITDA improved faster than statutory profitability.
          values:
            - value: Current
            - value: High
            - value: Intermediate
            - value: High
        - label: Advertising-policy shock
          note: A regulatory ban already removed a major advertising cohort.
          values:
            - value: Realized
            - value: High
            - value: Early
            - value: High
        - label: Moj streaming economics
          note: Moj remained loss-making because video streaming was costly.
          values:
            - value: Current in FY25 evidence
            - value: High
            - value: Early
            - value: High
        - label: Workforce execution
          note: Multiple workforce reductions increase continuity and delivery risk.
          values:
            - value: Recurring historical pattern
            - value: Medium-high
            - value: Reactive
            - value: Medium-high
        - label: Moderation, privacy, and security assurance
          note: Current primary evidence was not available in the assigned pool.
          values:
            - value: Unknown
            - value: Potentially high
            - value: Undisclosed
            - value: Unscored
    approximationNotes: >-
      Qualitative categories are analytical labels anchored to cited reported outcomes; unknown and unscored values
      remain gaps rather than inferred incident or compliance findings.
    claimRefs:
      - CR004
      - CR005
      - CR010
      - CR011
      - CR012
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The ordered evidence chain ends at track / research more because operating repair is offset by price and
      capital-structure opacity.
    data:
      nodes:
        - id: scale
          label: Large vernacular reach
          detail: A third-party profile reports more than 200 million monthly active users across the apps.
        - id: capital
          label: More than $1 billion raised
          detail: Public databases disagree on the exact cumulative funding total.
        - id: repair
          label: Reported operating repair
          detail: Loss reduction and operational-profitability reports improve the direction of travel.
        - id: stress
          label: Debt and thin FY24 cash
          detail: Two 2024 debt tranches and Rs 36.2 crore FY24 cash constrain confidence.
        - id: opacity
          label: Current price and terms unknown
          detail: No retained source provides a current primary valuation or preference stack.
        - id: decision
          label: Track / research more
          detail: Proceed only after audited liquidity, cap-table, security-term, and exit diligence.
    approximationNotes: This is a qualitative decision sequence, not a probability-weighted or value-proportional model.
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
      - CV015
