      - number: '5.3'
        title: Scale, differentiation, and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              The defensible product thesis is localization plus recommendation at scale rather than a novel public
              protocol or developer platform. Two non-company descriptions say the service supports more than 15 Indian
              languages, while official materials emphasize localized content and multiple AI-led discovery surfaces.
              Scale claims need reconciliation: the product page describes a 180 million-strong user community, whereas
              the current official history page displays 110 million-plus MAU, 1.5 million-plus creators, and 1.1
              billion-plus daily video plays. These labels may measure different products, dates, or populations, so
              they should not be combined. Infrastructure is economically material: Entrackr reports FY24 server-rent
              expense of ₹559.57 crore even after a 45.3% decline.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
              - CE012
              - CE014
      - number: '5.4'
        title: Trust, safety, reliability, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              ShareChat publicly identifies content moderation as a product pod, which establishes organizational
              ownership but not control effectiveness. The assigned pool contains no public uptime SLA, status history,
              penetration-test result, security certification, privacy-impact assessment, moderation precision or
              recall, incident taxonomy, or appeal-outcome data. It also contains no eligible developer-signal source
              such as a maintained repository, package registry, public API forum, engineering talk, or
              integration-partner technical post. Technical diligence should therefore test rather than assume
              resilience: management should provide architecture and data-flow diagrams, availability and incident
              records, model-governance evidence, moderation quality by language, security assurance, dependency
              concentration, and a reconciled metric dictionary for the conflicting audience labels.
            claimRefs:
              - CE004
              - CE006
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical proof remains below underwriting standard
            body: >-
              Public evidence supports the product portfolio and operating themes, but not service-level reliability,
              security assurance, model governance, moderation effectiveness, or a reproducible internal architecture.
            calloutType: risk
            claimRefs:
              - CE006
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and scale
        blocks:
          - type: paragraph
            body: >-
              ShareChat is best understood as a multi-sided network rather than a conventional single-buyer product.
              Regional-language consumers use the feeds, video, chatroom, and community surfaces; creators supply
              localized content and can earn through brand collaborations or platform incentives; advertisers and
              agencies pay for access to those audiences; and live or chatroom participants generate microtransaction
              revenue. IIMA describes the original wedge as overlooked regional-language internet users, while a
              lower-quality secondary profile describes demand among first-time users in smaller Indian towns. The
              official company page displayed 110 million-plus monthly active users and 1.5 million-plus creators when
              accessed, but it did not date those measurements. Those figures establish claimed scale, not unique paying
              customers, retention, or customer-level economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption, engagement, and monetization
        blocks:
          - type: paragraph
            body: >-
              The clearest public adoption signals are company-disclosed engagement metrics: 31 minutes of average daily
              time spent and more than 1.1 billion daily video plays. Their missing measurement dates and denominators
              limit trend interpretation. FY24 financial reporting provides a firmer view of payer behavior: Entrackr
              reported that live streaming or chatrooms generated INR 403 crore, or 56.1% of operating revenue, while
              advertising generated INR 315.37 crore. This indicates two distinct monetization engines rather than a
              disclosed enterprise-customer base. IIMA also identifies low ARPU, constrained advertising revenue, and
              rising infrastructure costs as structural monetization challenges. QuickTV adds a subscription-oriented
              expansion path, although its download and consumption figures currently come from a single secondary
              article.
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU009
              - CU010
              - CU015
      - number: '6.3'
        title: Durability, named proof, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is materially weaker than the audience-scale story. StartupTalky names JioCinema,
              GroupM, Dukaan, and Httpool as partners, but the retained evidence does not quantify campaign outcomes,
              contract duration, repeat spend, or production status. The table therefore treats them as counterparties
              rather than customers and marks the enumeration as partial. A separate secondary source reports that Moj
              monthly active users had declined nearly 23% by early 2024, providing an adverse durability signal but not
              a cohort-retention measure. Publicly visible audience figures also conflict: Wikipedia carries an undated
              claim of more than 350 million ShareChat monthly active users versus the official page's 110 million-plus
              figure. Investment diligence should therefore prioritize dated platform-level MAU/DAU cohorts, payer
              repeat rates, advertiser concentration, partner contracts, and counterparty-verified outcomes.
            claimRefs:
              - CU008
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU008
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Monetization is multi-sided
            body: >-
              FY24 revenue evidence indicates that live/chatroom activity and advertising are separate payer engines, so
              consumer MAU should not be treated as a customer count or converted into ARPU without payer and platform
              denominators.
            calloutType: insight
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: callout
            title: Scale claims are not yet durable-customer proof
            body: >-
              Conflicting, undated MAU figures and the absence of cohort retention, advertiser renewal, and
              partner-outcome data prevent a reliable view of customer durability or concentration.
            calloutType: risk
            claimRefs:
              - CU004
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest evidenced residual risk is financing and liquidity. FY24 filings, as reported by Entrackr,
              showed Rs 964.96 crore of operating cash outflow and only Rs 36.2 crore of cash and bank balances at
              year-end, while 2024 debt financing totaled about $65 million across two tranches. Those historical
              figures do not establish current cash availability, but they make updated unrestricted cash, debt terms,
              and a cash-flow bridge threshold diligence items rather than optional follow-ups. The second tier combines
              monetization and operating execution: FY25 revenue was nearly flat, advertising revenue declined, Moj
              remained loss-making because of video-streaming costs, and repeated workforce reductions show that cost
              repair has relied partly on organizational contraction. The thesis should break if current liquidity
              cannot cover at least 12 months of the board-approved operating plan, financing terms create a material
              preference or conversion overhang, or Moj lacks a credible, measured path to contribution breakeven.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.2'
        title: Financial-model and operational execution risk
        blocks:
          - type: paragraph
            body: >-
              Reported improvement is real but metric selection matters. FY24 accounting loss was Rs 1,898.94 crore,
              while adjusted EBITDA loss was Rs 777.84 crore after excluding financing, non-cash, and provisioning
              items. In FY25, adjusted EBITDA loss fell to Rs 219 crore, yet loss before tax remained Rs 1,105 crore and
              revenue moved only from Rs 718 crore to Rs 723 crore. The risk is therefore not that cost action failed;
              it is that adjusted profitability can improve faster than statutory loss, cash generation, or growth
              quality. Management should provide audited FY25 and FY26 statements, a reconciliation from adjusted EBITDA
              to operating cash flow, and product-level contribution margins. Monitoring should include consolidated
              operating cash flow, Moj streaming cost per engaged hour, advertising revenue, live-streaming payer
              concentration, regretted attrition, and delivery against product-roadmap milestones after successive
              workforce reductions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.3'
        title: Regulatory, legal, privacy, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies one realized policy shock: the ban on real-money gaming removed a major
              advertising cohort, alongside an 8% year-on-year decline in FY25 advertising revenue. That is evidence
              that regulatory changes affecting advertiser categories can flow directly into monetization. A secondary
              source also reports investment in AI and machine learning for moderation, but the pool does not contain
              regulator records, a privacy or security audit, certification evidence, incident history, litigation
              dockets, or quantified moderation outcomes. Those absences cannot be treated as proof of clean status.
              Before investment, counsel should complete jurisdiction-by-jurisdiction checks for content, intermediary,
              privacy, advertising, intellectual-property, and child-safety obligations; security diligence should
              obtain independent testing, incident logs, data maps, and moderation effectiveness metrics. Any material
              enforcement action, undisclosed breach, or inability to evidence lawful data processing is a thesis-break
              trigger.
            claimRefs:
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Dependencies, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Capital providers, advertisers, payers, creators, and video infrastructure are the most visible dependency
              groups, but only some are quantified. Public data identifies two 2024 debt tranches, live streaming or
              chatroom at 56.1% of FY24 operating revenue, an advertising decline after a regulated advertiser cohort
              disappeared, and continuing Moj losses tied to streaming costs. It does not identify lender covenants,
              cloud-provider concentration, advertiser concentration, payer cohorts, creator payout obligations, or
              counterparty switching costs. Mitigation maturity is therefore partial at best: cost reductions and
              product diversification are visible, but resilience against a funding delay, platform-cost shock, or
              concentration loss is not demonstrated. Investment conditions should require debt documents, a 24-month
              monthly liquidity model, counterparty concentration schedules, cloud architecture and exit plans, and
              cohort-level monetization data. Kill criteria include covenant default, loss of a critical platform
              service without tested failover, or material revenue dependence on a single advertiser, payer cohort, or
              financing source without a funded contingency.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adjusted EBITDA is not cash flow
            body: >-
              Loss reduction is directionally positive, but the public evidence still requires a bridge from adjusted
              EBITDA through financing costs, provisions, working capital, and cash flow.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
          - type: callout
            title: Make liquidity and dependency evidence closing conditions
            body: >-
              Do not underwrite the next financing or a durable Moj turnaround without current cash, debt terms, product
              contribution margins, and counterparty concentration schedules.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track / research-more recommendation, with medium confidence in the direction of
              the call but low confidence in any price-specific conclusion. ShareChat has raised substantial capital and
              third-party reports describe operating improvement, yet total funding is not cash available and
              operational profitability is not the same as audited net income or free cash flow. More importantly, the
              assigned sources do not disclose a current primary equity valuation, fully diluted ownership, liquidation
              preferences, conversion mechanics, or unrestricted cash after FY24. The investment implication is
              therefore conditional: operational repair merits continued diligence, but a commitment should wait for a
              current term sheet, cap table, audited cash-flow bridge, and security-level return model. Historical
              valuation headlines alone cannot establish an attractive entry price.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that ShareChat has a differentiated vernacular audience, several monetization surfaces, and
              evidence of cost repair after an expensive expansion cycle. InforCapital reports more than 200 million
              monthly active users across the apps, while FY24 operating revenue rose to Rs 718.1 crore and a later
              report puts FY25 revenue near Rs 723 crore. BharatFast also reports a sharp reduction in adjusted EBITDA
              loss, and ScoopEarth describes operational profitability in the first quarter of the fiscal year beginning
              April 2026. The anti-thesis is equally material: revenue was nearly flat from FY24 to FY25 on the cited
              figures, FY24 accounting loss and operating cash outflow remained large, and external funding was still
              needed. The case improves only if audited results confirm durable cash generation rather than
              metric-definition changes or temporary cost compression.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Public funding databases agree on the broad conclusion that ShareChat has raised more than $1 billion, but
              they disagree on the exact cumulative amount. The retained figures range from $1.2 billion to more than
              $1.4 billion, so cumulative capital should be treated as an approximate financing-history indicator rather
              than a precise balance-sheet input. The strongest downside signal is the reported valuation reset:
              Grokipedia describes a peak near $5 billion followed by a 2024 mark below $2 billion. Inc42 and Entrackr
              separately identify two 2024 debt tranches totaling about $65 million. That structure may have extended
              runway, but the sources do not expose coupon, maturity, conversion triggers, seniority, preferences, or
              dilution. Without those terms, neither the effective entry valuation nor common-equity downside can be
              calculated responsibly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV015
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Bull, base, and bear cases can be framed directionally, but public evidence does not support numerical
              valuation ranges or probability percentages. The bull case requires the reported operational profitability
              to reconcile to audited cash generation, sustained revenue growth, and IPO-ready controls. The base case
              assumes operating repair continues while financing and exit timing remain uncertain, which supports
              monitoring rather than entry. The bear case is a renewed financing need, adverse conversion or preference
              terms, or failure to translate engagement into durable cash flow. ScoopEarth reports an ambition to raise
              up to $400 million in an IPO within four to five quarters, but this is a reported plan rather than
              evidence of readiness or market-clearing demand. Thesis-break triggers are a new down round, rising net
              debt, reversal of cash profitability, or inability to produce audited FY25-FY26 statements and a complete
              capitalization schedule.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price before quality
            body: >-
              The company may be improving, but the available evidence cannot translate that improvement into an
              investable price. Require current security terms and audited cash flow before changing the recommendation
              from track / research more.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Funding raised is not cash available
            body: >-
              Cumulative funding exceeds $1 billion in every retained aggregator, while Entrackr reports only Rs 36.2
              crore of cash and bank balances at FY24 year-end. The different dates and scopes prevent a direct runway
              calculation, but they make fresh liquidity evidence essential.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
