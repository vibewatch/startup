        title: Capital history and financial position
        blocks:
          - type: paragraph
            body: >-
              Independent funding summaries place cumulative capital raised at roughly $1.26 billion to $1.3 billion,
              but this is capital raised rather than cash available. Inc42 lists major equity rounds in 2018 and 2021
              and two debt tranches totaling about $64.9 million in 2024. For FY25, the company reported Rs 723 crore of
              revenue and a 72% reduction in adjusted EBITDA loss to Rs 219 crore; it separately said annual recurring
              revenue exceeded Rs 1,000 crore by the end of H1 FY26. ARR is a run-rate measure, not recognized revenue.
              Filing-based FY24 reporting showed an accounting loss of Rs 1,898.94 crore and only Rs 36.2 crore in cash
              and bank balances, underscoring why audited cash flow and debt terms matter.
