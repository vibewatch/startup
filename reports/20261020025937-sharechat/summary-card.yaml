  topStrengths:
    - >-
      Differentiated Indian-language positioning across ShareChat and Moj, with more than 200 million monthly
      monetizable users reported across the portfolio.
    - FY25 adjusted EBITDA loss reportedly fell 72% to Rs 219 crore, indicating substantial operating repair.
    - >-
      Multiple monetization surfaces span advertising, live or chatroom activity, creator ecosystems, and newer
      microdrama formats.
  topRisks:
    - >-
      Current unrestricted cash, debt and convertible terms, covenant exposure, and a cash-flow reconciliation are not
      publicly established.
    - >-
      FY25 revenue was nearly flat, statutory losses remained large, and Moj was still loss-making because of
      video-streaming costs.
    - >-
      Privacy, security, moderation effectiveness, regulatory status, litigation, and concentration controls lack
      independent public verification.
    - >-
      No current primary valuation, fully diluted cap table, liquidation preferences, or conversion mechanics are
      publicly disclosed.
  unresolvedGaps:
    - >-
      Audited FY25 and FY26 financial statements, current unrestricted cash, and a monthly bridge from adjusted EBITDA
      to operating cash flow.
    - >-
      Complete debt and convertible agreements, including coupon, maturity, covenants, conversion triggers, seniority,
      and liquidation preferences.
    - >-
      A fully diluted cap table, current term sheet, board rights, committee composition, and recent primary or
      secondary valuation evidence.
    - >-
      Product-level retention, payer conversion, advertiser concentration, creator payouts, realized pricing, and
      contribution margins.
    - >-
      Independent security testing, incident history, privacy controls, uptime, and language-level moderation
      effectiveness.
