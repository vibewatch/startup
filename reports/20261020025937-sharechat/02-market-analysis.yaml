callouts:
  - calloutType: risk
    title: TAM remains unproven
    body: >-
      The retained pool supports company-scale audience, consumption, and revenue proxies,
      not a market-wide spend denominator or non-overlapping serviceable audience. A valuation
      case should not convert the 200 million-plus portfolio claim or third-party 400
      million-plus user language into market share without reconciled definitions.
    claimRefs: [CM004, CM016]
