      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开融资数据库大体都认定 ShareChat 已募集超过 $1 billion，但对确切累计金额存在分歧。现有数字从 $1.2 billion 到超过 $1.4 billion
              不等，因此累计资本应被视为融资历史的约数指标，而不是精确的资产负债表输入。最强的下行信号是报道称估值 重置：Grokipedia 描述估值峰值接近 $5 billion，随后 2024 年降至低于 $2
              billion。Inc42 和 Entrackr 分别确认 2024 年 两笔债务融资，合计约 $65 million。这一结构可能延长了 runway，但来源没有披露票息、到期日、转换触发条件、优先级、优先权
              或摊薄。没有这些条款，既无法负责任地计算有效入场估值，也无法计算普通股下行空间。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV015
      - number: '8.4'
        title: 情景、退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              乐观情景、基准情景和悲观情景可以做方向性描述，但公开证据不支持数值估值区间或概率百分比。乐观情景要求已报告的经营盈利能够与经审计现金生成、持续收入增长和 IPO
              就绪控制对上。基准情景假设经营修复继续，而融资和退出时点仍不确定，因此支持继续监控而非入场。悲观情景包括再次融资需求、不利的转换或优先权条款，或无法把互动转化为持久现金流。ScoopEarth 报道，公司
              计划在四至五个季度内通过 IPO 募集最多 $400 million，但这是报道中的计划，不是已准备就绪或市场有足够需求的证据。新一轮 下行融资、净债务上升、现金盈利逆转，或无法提供经审计 FY25-FY26
              报表和完整资本化明细，均是投资论点失效的触发条件。
            claimRefs:
