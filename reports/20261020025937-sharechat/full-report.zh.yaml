      - number: '4.2'
        title: 成本基础与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              FY24 显示成本明显压缩，但并未证明单位经济性有吸引力。Entrackr 审阅合并申报文件后报告，总费用为 ₹2,644.71 crore，净亏损 为 ₹1,898.94 crore，经调整 EBITDA
              亏损为 ₹777.84 crore。其还报告经营现金流出 ₹964.96 crore，这不能与会计亏损或经调整 EBITDA 混为一谈。员工福利和服务器租金仍是主要成本中心，财务成本则升至 ₹510.57
              crore。现有公共代理指标说明基础设施、 人员、融资、内容和创作者经济都很重要，但无法揭示 CAC、cohort 留存、付费密度、创作者支付比例或产品层面毛利率。
