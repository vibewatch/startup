        title: 监管、法律、隐私与安全敞口
        blocks:
          - type: paragraph
            body: >-
              现有证据确认了一次已经发生的政策冲击：真钱游戏禁令移除了一个重要广告主群体，同时 FY25 广告收入同比下降 8%。这说明 影响广告主品类的监管变化会直接传导到变现。另一份二手来源还称，公司投入 AI
              和机器学习进行审核，但现有资料没有监管机构 记录、隐私或安全审计、认证证据、事件历史、诉讼案卷或量化审核结果。这些缺失不能被当作状态清白的证明。投资前，法律顾问
              应逐司法辖区核查内容、中介、隐私、广告、知识产权和儿童安全义务；安全尽调应取得独立测试、事件日志、数据地图和审核 有效性指标。任何重大执法行动、未披露的数据泄露，或无法证明数据处理合法，都应触发投资论点失效。
            claimRefs:
              - CR013
