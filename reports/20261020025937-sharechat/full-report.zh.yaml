      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 经调整 EBITDA 不等于现金流
            body: 亏损下降方向上是积极的，但公开证据仍需要一份从经调整 EBITDA 经融资成本、拨备和营运资金到现金流的桥接。
