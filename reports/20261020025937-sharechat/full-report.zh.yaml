              - CI011
              - CI012
      - number: '4.4'
        title: 轨迹与财务结论
        blocks:
          - type: paragraph
            body: >-
              后续指标指向改善，但不等同于经审计现金流证明。一份二手报道称，FY25 收入大致持平于 ₹723 crore，而经调整 EBITDA 亏损 下降 72% 至 ₹219 crore。公司在 2026 年
              LinkedIn 更新中称，FY26 年化收入已超过 ₹1,000 crore，且过去两个季度 EBITDA
              为正。这些说法暗示经营杠杆改善、业务可能出现拐点，但它们来自公司，采用年化运行速率而非全年已确认收入，也没有披露 现金转化。投资判断是收入质量和利润率方向正在改善，但剩余融资风险高；在赋予持久利润率或
              runway 逻辑前，必须取得经审计的 FY25-FY26 报表以及最新债务与现金明细。
            claimRefs:
