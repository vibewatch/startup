  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“跟踪 / 继续研究”的建议，对判断方向的信心中等，但对任何具体价格结论的信心较低。ShareChat 已募集大量资本，
              第三方报道也描述了经营改善，但募集总额不是可用现金，经营盈利也不等于经审计净利润或自由现金流。更重要的是，现有来源 没有披露当前一级股权估值、完全摊薄后的持股、清算优先权、转换机制或 FY24
              之后的不受限现金。因此，投资含义是有条件的： 经营修复值得继续尽调，但在取得当前条款清单、股权结构表、经审计现金流桥接和按证券拆分的回报模型前，不应承诺投资。 仅凭历史估值新闻不能证明入场价格有吸引力。
            claimRefs:
