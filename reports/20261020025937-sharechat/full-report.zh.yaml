  - id: FU001
    title: 客户参与和变现旅程
    type: journey-map
    summary: ShareChat 把本土语言发现转化为创作者供给、互动、交易、广告库存和合作伙伴分发。
    data:
      items:
        - label: 发现
          detail: 本土语言消费者通过本地化社交和视频信息流进入。
          touchpoints:
            - ShareChat 信息流
            - Moj 短视频
          value: 110Mn+ claimed ShareChat MAU
          note: 官方数字没有日期。
        - label: 创作
          detail: 创作者为语言社群发布本地化帖子和视频。
          touchpoints:
            - 创作工具
            - 创作者社群
          value: 1.5Mn+ claimed creators
          note: 活跃创作者数和留存率未披露。
        - label: 互动
          detail: 用户观看视频，参与社群和聊天室活动。
          touchpoints:
            - 视频
            - 社群
            - 聊天室
          value: 31 minutes claimed average daily time spent
          note: 方法论和平台范围未披露。
        - label: 交易
          detail: 参与直播和聊天室支持由用户付费的变现。
          touchpoints:
            - 直播
            - 聊天室
          value: 56.1% of FY24 operating revenue
          note: 付费用户数和复购率不可得。
        - label: 广告
          detail: 品牌和代理商付费触达本土语言用户。
          touchpoints:
            - 品牌活动
            - 代理商渠道
          value: INR 315.37 crore FY24 advertising revenue
          note: 客户集中度和续约情况不可得。
        - label: 扩张
          detail: 内容、电商和销售合作伙伴扩大库存与分发。
          touchpoints:
            - JioCinema
            - Dukaan
            - GroupM
            - Httpool
          value: Four named counterparties in retained evidence
          note: 未找到经交易对手确认的结果。
    approximationNotes: 仅为有序分析旅程；各阶段不是转化漏斗，也不代表同一人群、同一期间或与价值成比例的规模。
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU009
      - CU010
      - CU015
  - id: FR001
    title: 有证据支持的剩余风险热力图
    type: matrix
    summary: 融资、法定亏损转化、广告政策敞口和 Moj 经济性仍是证据最充分的高风险；合规控制敞口刻意不评分。
    data:
      columns:
        - id: likelihood
          label: 可能性 / 状态
        - id: impact
          label: 影响
        - id: mitigation
          label: 缓解措施成熟度
        - id: residual
          label: 剩余严重性
      rows:
        - label: 流动性和再融资
          note: 历史现金流出和债务依赖；当前现金不可得。
          values:
            - value: High absent current proof
            - value: Critical
            - value: Partial
            - value: Critical
        - label: 会计亏损转化
          note: 调整后 EBITDA 改善速度快于法定盈利能力。
          values:
            - value: Current
            - value: High
            - value: Intermediate
            - value: High
        - label: 广告政策冲击
          note: 监管禁令已经移除一个重要广告客户群。
          values:
            - value: Realized
            - value: High
            - value: Early
            - value: High
        - label: Moj 流媒体经济性
          note: 视频流媒体成本高，Moj 仍处于亏损状态。
          values:
            - value: Current in FY25 evidence
            - value: High
            - value: Early
            - value: High
        - label: 员工执行
          note: 多次裁员增加连续性和交付风险。
          values:
            - value: Recurring historical pattern
            - value: Medium-high
            - value: Reactive
            - value: Medium-high
        - label: 内容审核、隐私和安全保障
          note: 本次分配的来源池中没有当前一手证据。
          values:
            - value: Unknown
            - value: Potentially high
            - value: Undisclosed
            - value: Unscored
    approximationNotes: 定性类别是锚定已引用报告结果的分析标签；未知和未评分的数值仍是缺口，不应推断为事故或合规结论。
    claimRefs:
      - CR004
      - CR005
      - CR010
      - CR011
      - CR012
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 有序证据链最终指向持续跟踪 / 继续研究，因为运营修复被价格和资本结构不透明所抵消。
    data:
      nodes:
        - id: scale
          label: 广泛的本土语言触达
          detail: 一份第三方简介报告称，各应用月活用户超过 2 亿。
        - id: capital
          label: 融资超过 $1 billion
          detail: 公开数据库对累计融资总额的准确数值存在分歧。
        - id: repair
          label: 已报告的运营修复
          detail: 亏损减少和经营盈利报告改善了发展方向判断。
        - id: stress
          label: 债务和偏薄的 FY24 现金
          detail: 两笔 2024 年债务和 Rs 36.2 crore 的 FY24 现金余额限制了信心。
        - id: opacity
          label: 当前价格和条款未知
          detail: 保留来源中没有任何来源提供当前一手估值或优先股堆叠。
        - id: decision
          label: 持续跟踪 / 继续研究
          detail: 只有完成流动性、股权结构表、证券条款和退出尽调后才应推进。
    approximationNotes: 这是定性决策顺序，不是按概率加权或与价值成比例的模型。
