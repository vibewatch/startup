              ShareChat 公开将内容审核列为一个产品小组，这能确认组织归属，但不能确认控制有效性。现有资料没有公开 uptime SLA、状态历史、
              渗透测试结果、安全认证、隐私影响评估、审核精确率或召回率、事件分类，或申诉结果数据。资料中也没有符合条件的开发者信号 来源，例如持续维护的代码库、软件包注册表、公开 API
