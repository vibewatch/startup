    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的现金创造能力证明已报告的经营盈利；增长重新加速；IPO 准备工作变得可验证
        - 只有披露定价和稀释后，才可能支持高于最新私募估值的溢价
        - 执行或市场窗口延误
        - 经审计的正现金流，加上已提交的发行流程
      - - 基准
        - 成本修复持续，但增长、融资条款和退出时间仍不确定
        - 没有依据支持数值化估值区间；要求协商下行保护
        - 优先权负担和长期保持非上市状态
        - 现金余额稳定，且没有新增优先级融资
      - - 悲观
        - 现金创造能力反转，或在可信退出前还需要再融资
        - 考虑债务、转换和优先权后，普通股价值可能大幅收缩
        - 下轮融资、稀释或流动性短缺
        - 净债务上升、错过审计，或估值再次重置
    notes: 由于当前估值、股权结构表、债务条款和经审计现金流等输入不可得，情景区间和概率刻意不作量化。
