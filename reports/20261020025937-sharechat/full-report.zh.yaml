  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              现有证据中最高的剩余风险是融资和流动性。Entrackr 报道的 FY24 申报文件显示，经营现金流出为 964.96 crore 卢比，年末现金和 银行存款仅 36.2 crore 卢比；2024
              年债务融资则通过两笔融资合计约 $65 million。这些历史数字不能证明当前现金可用性，但 使最新的不受限现金、债务条款和现金流桥接成为必须完成的尽调项目，而不是可选跟进。第二层风险结合了变现和运营执行：
              FY25 收入基本持平，广告收入下降，Moj 因视频流媒体成本仍在亏损，反复裁员也说明成本修复部分依赖组织收缩。如果当前流动性 无法覆盖董事会批准的至少 12 个月运营计划，融资条款造成重大优先权或转换悬空，或
              Moj 没有可信且可衡量的贡献盈亏平衡路径， 投资论点就应失效。
            claimRefs:
