  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与质量
        blocks:
          - type: paragraph
            body: >-
              ShareChat 变现的是两个相互关联的活动池，而非单一订阅产品。基于申报文件的 FY24 报道显示，直播或聊天室贡献 ₹403 crore， 占营业收入的 56.1%；广告贡献 ₹315.37
              crore。公司和二手资料把前者与消费者交易及虚拟礼物联系起来，广告则把地区语言触达 转化为品牌库存。这一组合降低了对纯广告的依赖，但公开证据没有披露虚拟礼物抽成率、付费转化、创作者支付、广告负载或 实际
              CPM。因此，已报告的 FY24 营业收入 ₹718.1 crore 是收入而非 ARR，任何一条收入流的当前贡献利润率都无法由公开数据还原。
