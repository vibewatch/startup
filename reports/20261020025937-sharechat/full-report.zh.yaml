            body: >-
              报告中的改善是真实的，但指标选择很重要。FY24 会计亏损为 1,898.94 crore 卢比；剔除融资、非现金和拨备项目后，经调整 EBITDA 亏损为 777.84 crore 卢比。FY25 经调整
              EBITDA 亏损降至 219 crore 卢比，但税前亏损仍为 1,105 crore 卢比，收入 也只从 718 crore 卢比升至 723 crore
