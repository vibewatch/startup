      - number: '8.2'
        title: 论点与反论点
        blocks:
          - type: paragraph
            body: >-
              论点是，ShareChat 拥有差异化的方言用户群、多个变现界面，并有证据表明在昂贵的扩张周期后进行了成本修复。InforCapital 报告这些应用的月活用户超过 2 亿；FY24 营业收入升至 718.1
              crore 卢比，后续报道则称 FY25 收入约为 723 crore 卢比。 BharatFast 还报道经调整 EBITDA 亏损大幅下降，ScoopEarth 则描述截至 2026 年 4
              月开始的财年第一季度实现经营盈利。 反论点同样重要：按引用数字，FY24 至 FY25 收入几乎持平；FY24 会计亏损和经营现金流出仍然很大，公司仍需要外部融资。
              只有当经审计结果证明现金持续生成，而非仅仅来自指标定义变化或临时成本压缩时，投资论点才会改善。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
