  - id: FP001
    title: 竞争定位图：本土语言针对性与分发能力
    type: quadrant
    summary: 有证据支持的序数评分显示，ShareChat 的本土语言针对性较强，但分发能力低于全球巨头；该图仅用于判断方向，不是独立基准。
    data:
      points:
        - label: ShareChat
          x: 5
          'y': 3
          detail: 本土语言针对性强；第三方对核心应用用户规模的估计仍有意义，但正在下降。
        - label: Moj
          x: 4
          'y': 3
          detail: 聚焦本土短视频，保有组合触达，但面临全球创作者竞争。
        - label: Instagram 和 Facebook
          x: 3
          'y': 5
          detail: 本地化广泛、分发能力更强；管理层已不再把 ShareChat 定位为替代品。
        - label: YouTube 和 Shorts
          x: 3
          'y': 5
          detail: 视频分发和创作者触达广泛；本土语言深度未经独立基准比较。
        - label: Josh、Roposo 和 Chingari
          x: 4
          'y': 2
          detail: 本土语言相关性强，但持久规模的证据较弱。
        - label: Kuku 和 EloElo
          x: 2
          'y': 2
          detail: 聚焦特定形态的微短剧竞争者；订阅用户说法不足以证明广泛分发能力。
    approximationNotes: 分析师根据保留证据设定 1–5 序数坐标：x 轴为本土语言针对性，y 轴为分发能力。评分仅指示方向，不是实测市场份额或经独立验证的基准。
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP016
  - id: FI001
    title: 收入模式与财务负担流
    type: flow
    summary: 公开证据支持两条变现支路贡献收入，但收入能否转化为现金，取决于成本和融资负担。
    data:
      nodes:
        - id: user-activity
          label: 用户活动
          detail: 本土社交、短视频和直播互动创造可变现活动。
        - id: advertising
          label: 广告库存
          detail: 品牌购买触达本土语言用户的机会；实际单价未公开。
        - id: live
          label: 直播和聊天室
          detail: 直播参与带来消费者交易机会。
        - id: transactions
          label: 虚拟礼物和消费者交易
          detail: 公开来源说明了这一机制，但未披露平台抽成或创作者分成。
        - id: revenue
          label: 经营收入
          detail: FY24 经营收入为 ₹718.1 crore，直播 / 聊天室是披露收入中更大的部分。
        - id: economics
          label: 成本、融资与现金转化
          detail: 基础设施、员工、内容、创作者经济性和融资成本共同决定盈利能力。
      edges:
        - from: user-activity
          to: advertising
        - from: user-activity
          to: live
        - from: live
          to: transactions
        - from: advertising
          to: revenue
        - from: transactions
          to: revenue
        - from: revenue
          to: economics
    approximationNotes: 仅为概念性流程；不代表已披露转化率、完整收入结构或正向现金转化。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
  - id: FE001
    title: 公开证据下的产品运营栈
    type: stack
    summary: 六个已披露的运营层把面向用户的产品连接到需要技术尽调的能力和依赖项。
    data:
      layers:
        - label: 用户体验
          detail: ShareChat 本土语言发现、Moj 短视频和 QuickTV 微短剧
          modules:
            - ShareChat
            - Moj
            - QuickTV
        - label: 创作与互动
          detail: 创作者工具、热门标签、活动、聊天室和直播
          modules:
            - 创作者工具
            - 聊天室
            - 直播
        - label: 发现
          detail: 信息流个性化、内容理解、分类和搜索 / 发现
          modules:
            - 信息流个性化
            - 内容理解
            - 发现
        - label: 决策系统
          detail: AI 驱动的推荐和大规模 A/B 实验
          modules:
            - 推荐
            - 实验
        - label: 信任与运营
          detail: 内容审核和创作者生态运营
          modules:
            - 内容审核
            - 创作者生态
        - label: 基础设施
          detail: 大规模系统和具有重要经济影响的服务器容量
          modules:
