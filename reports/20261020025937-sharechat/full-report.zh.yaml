      - number: '7.4'
        title: 依赖、缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              资本提供方、广告主、付费者、创作者和视频基础设施是最明显的依赖群体，但只有部分得到量化。公开数据确认了两笔 2024 年 债务融资、直播或聊天室占 FY24 营业收入的
              56.1%、受监管广告主群体消失后广告收入下降，以及 Moj 因流媒体成本持续亏损。 但公开资料没有确认贷款人契约、云服务商集中度、广告主集中度、付费者 cohort、创作者支付义务或交易对手转换成本。因此，
              缓释措施的成熟度充其量只是部分：成本削减和产品多元化可见，但对融资延迟、平台成本冲击或集中度损失的韧性尚未得到证明。 投资条件应要求提供债务文件、24
              个月月度流动性模型、交易对手集中度明细、云架构和退出方案，以及 cohort 层面的变现数据。
              终止标准包括契约违约、关键平台服务失效且没有经过测试的故障切换，或在没有资金支持的应急方案时，收入对单一广告主、付费者 cohort 或融资来源形成重大依赖。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
