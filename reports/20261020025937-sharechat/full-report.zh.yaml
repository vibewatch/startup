      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              现有证据中最新的详细资产负债表快照相对于经营负担偏弱：Entrackr 报告 FY24 年末现金及银行存款仅 ₹36.2 crore，而当年 经营现金流出为 ₹964.96 crore。此后 ShareChat
              宣布完成一轮 $49 million 的可转债融资，用于变现投资和消费者交易；Inc42 列出 2024 年合计 $64.89 million 的两笔债务融资，Entrackr 则将当年债务融资四舍五入为 $65
              million。募集金额不是可用现金， 而且这些来源均未披露当前不受限现金、票息、到期日、转换机制、担保、契约或优先权影响。因此，资本充足性仍是重大尽调阻碍， 不能据此计算 runway。
            claimRefs:
              - CI008
