chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与产品组合
        blocks:
          - type: paragraph
            body: >-
              ShareChat 是 Mohalla Tech Private Limited 面向消费者的品牌。Mohalla Tech 总部位于班加罗尔，由 Ankush Sachdeva、Bhanu Pratap
              Singh 和 Farid Ahsan 于 2015 年创立。公司的核心逻辑是让方言用户参与社交：官网将其描述为服务印度语种社区的平台， 二手资料也始终把 ShareChat 和 Moj
              认定为核心社交及短视频产品。Mohalla Tech 于 2020 年 7 月推出 Moj，并于 2025 年 5 月 增加订阅驱动的微短剧应用
              QuickTV。业务组合因此从社交信息流和短视频扩展到付费娱乐，但现有证据没有提供产品层面的 经审计收入或利润分配。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO012
              - CO014
      - number: '1.2'
        title: 规模与变现
        blocks:
          - type: paragraph
            body: >-
              当前最有力的规模披露来自公司：ShareChat 于 2025 年 10 月称，其平台拥有超过 2 亿月度可变现用户。这个分母不能与月活用户、 客户或付费用户混用，因此不应把它写成客户数。基于 FY24
              申报文件的报道更清楚地展示了商业模式：直播或聊天室活动贡献 403 crore 卢比，占营业收入的 56.1%；广告贡献 315.37 crore 卢比。这个组合说明公司除了广告外，也明显依赖用户变现。
              现有证据没有披露当前 cohort 留存、付费密度、广告主集中度或产品层面收入。
            claimRefs:
              - CO005
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
              - CO013
      - number: '1.3'
        title: 资本历史与财务状况
        blocks:
          - type: paragraph
            body: >-
              独立融资汇总显示累计募集资本约为 $1.26 billion 至 $1.3 billion，但这是募集金额，不是可用现金。Inc42 列出了 2018 年和 2021 年的主要股权轮次，以及 2024 年合计约
              $64.9 million 的两笔债务融资。FY25，公司报告收入为 723 crore 卢比， 经调整 EBITDA 亏损减少 72% 至 219 crore 卢比；公司另称，截至 FY26
              上半年，年度经常性收入已超过 1,000 crore 卢比。 ARR 是运行速率指标，不是已确认收入。基于 FY24 申报文件的报道显示会计亏损为 1,898.94 crore 卢比，现金及银行存款 仅 36.2
              crore 卢比，这也说明经审计现金流和债务条款为何重要。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: 领导层、治理与执行依赖
        blocks:
          - type: paragraph
            body: >-
              公司 2025 年 10 月的一则公告确认联合创始人 Ankush Sachdeva 担任 CEO，因此在现有证据中，只有他的现任高管职务得到核实。
              另外两位创始人在公司和二手来源中均被反复提及，但这里没有披露他们当前的运营职务、董事会席位或投票权。2023 年至 2025 年初反复裁员，是不利的执行信号：基于申报文件的报道称，公司在 2023 年分两阶段裁减
              700 人，并于 2024 年 8 月 再裁减 5%；另一份资料则称 2025 年 1 月还出现进一步裁员。没有最新组织架构图或股权结构表，就无法完整评估关键人风险和 机构治理。
            claimRefs:
              - CO002
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 运行速率增长不等于流动性
            body: 公司报告的 1,000 crore 卢比以上 ARR 里程碑，不应被解读为 FY26 已确认收入、不受限现金，或全公司盈利的证明。
            calloutType: risk
            claimRefs:
              - CO008
              - CO010
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场比“印度社交媒体”更窄，但比 ShareChat 单一应用更宽。可支持的边界包括地区语言用户生成的社交内容、Moj 短视频、
              直播和聊天室变现、广告库存、创作者驱动的互动，以及订阅或广告驱动的微短剧。除非 ShareChat 确实能够争夺这部分预算， 否则边界不包括全球社交网络的全部收入、印度全部数字广告支出和泛 OTT
              订阅。Tracxn 的同业集合涵盖全球视频平台和 本地语言运营商，独立资料则强调小城市和母语使用。实际替代品因此包括 YouTube、TikTok 式短视频、Instagram 式信息流、
              VerSe/Josh、基于消息的内容分享，以及用户继续保持现有娱乐习惯而不做任何改变。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有资料没有可信的第三方估计，无法确认印度地区语言社交媒体的总支出，因此套用传统 TAM/SAM/SOM 只会制造虚假的精确感。 更稳妥的看法是拆开用户触达、消费和实际变现。ShareChat 报告其平台拥有超过
              2 亿月度可变现用户；FY24 营业收入为 718.1 crore 卢比，FY24 广告收入为 315.37 crore 卢比。这些数字说明存在商业需求，但只是公司规模代理指标，不是市场规模。
              微短剧是较新的邻近业务：公司称 ShareChat 和 Moj 每月约有 3,500 万观众，QuickTV 下载量超过 1,500 万，每日观看集数超过 2
              亿。没有独立用户、付费者、定价和品类支出数据，不能把这些指标相加或换算成市场份额。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
              - CM013
      - number: '2.3'
        title: 买方、用户与付费方
        blocks:
          - type: paragraph
            body: >-
              ShareChat 服务多个经济利益不同的群体。消费者创作和消费地区语言信息流及短视频；广告主和代理机构按语言、兴趣和位置购买 触达；直播或聊天室参与者为虚拟互动付费；QuickTV 观众可能购买订阅，而
              ShareChat 和 Moj 观众观看广告支持的微短剧。 创作者提供吸引观众和品牌预算的内容，但现有来源没有披露创作者支付费率或收入分成。因此，各产品的预算归属不同：品牌和
              代理机构的营销预算支撑广告，消费者支撑直播或订阅产品，ShareChat 则投入创作者工具和推荐基础设施，让两端保持活跃。
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              现有来源描述的核心采用驱动因素包括低价智能手机、更低的移动数据成本、母语界面、文化特定内容和习惯性分享。商业约束在于， ShareChat 也将印度描述为低 ARPU
              且竞争激烈的市场；除非广告、直播聊天、订阅和创作者经济能够高效转化，否则触达规模 仍然不够。FY24 的经营现金流出，以及相对于该流出的较小现金余额，凸显了扩大互动规模的资本密集度，尽管后来的公司材料
              称核心业务已实现现金流为正。估值时，关键问题不是是否存在互动，而是独立用户、付费转化、广告主重复支出和贡献利润率能否 支撑其持续占据可争夺预算。
            claimRefs:
              - CM002
              - CM008
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: TAM 仍未得到证明
            body: 现有资料支持的是公司规模的用户、消费和收入代理指标，而不是全市场支出分母或不重叠的可服务用户群。除非先统一定义， 估值论证不应把 2 亿以上的组合用户说法或第三方“4 亿以上用户”的表述直接换算为市场份额。
            calloutType: risk
            claimRefs:
              - CM004
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局横跨全球巨头、本地短视频同业与新娱乐形态
        blocks:
          - type: paragraph
            body: >-
              ShareChat 和 Moj 争夺的是注意力、创作者和广告预算，而不是一个封闭的方言市场。经审阅的证据把 Instagram 和 Facebook 归入全球社交巨头，把 YouTube 归入视频替代品，把
              Josh、Roposo 和 Chingari 归入印度本土短视频阵营。由于公开来源没有显示 买方必须使用 ShareChat
              才能触达地区语言用户，广告主自建内容项目及通过现有社交渠道分发仍是现实替代方案。最重要的格局 变化是品类扩张：QuickTV 让 Mohalla Tech 与 Kuku、EloElo
              一同进入微短剧市场，其用户、内容经济以及订阅与广告之间的选择 都不同于原有社交信息流市场。因此，这是一场组合业务竞争，而不是单一应用之争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: 语言深度是真正的差异化，但分发能力掌握在更大网络手中
        blocks:
          - type: paragraph
            body: >-
              原生地区语言内容和发现能力仍是 ShareChat 最明显的差异化能力。这一定位服务于英语优先信息流之外的用户和创作者，现有来源对此也有一致描述。但它并非排他性入口：ShareChat 的 CFO
              表示，公司已不再把自己定位成 Meta 或 Google 的替代品；管理层则称，95% 的用户也使用 Meta 或 YouTube。由此可见，用户广泛多栖，平台层面的锁定很弱。创作者可以在全球网络上追求
              更广泛的知名度和变现，同时利用 ShareChat 做本地发现；广告主也可以在多个渠道之间分配预算。因此，ShareChat 的优势是在特定消费场景中的相关性，而不是掌握用户关系。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP008
              - CP010
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP016
      - number: '3.3'
        title: 公开证据更支持经济机制比较，而非标价比较
        blocks:
          - type: paragraph
            body: >-
              现有来源没有提供 ShareChat、Meta、YouTube 和本地同业之间可比的广告价目表、实际 CPM、创作者支付或企业合同条款。因此，
              能够站得住脚的比较应聚焦产品打包和经济机制；没有证据支持的价格单元要明确标为未知。ShareChat 的成熟模式是广告和创作者
              驱动的互动，微短剧组合则在广告之外引入订阅打包。管理层称，付费微短剧订阅者的获客成本明显高于普通 ShareChat 或 Moj 用户，这提示表面上的订阅收入可能被重新投入获客。没有 cohort
              留存、实际定价和贡献利润率数据，已披露的订阅者或 用户规模不足以证明可持续的单位经济性。
            claimRefs:
              - CP009
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP016
      - number: '3.4'
        title: 护城河是场景相关性，但被替代风险仍具结构性
        blocks:
          - type: paragraph
            body: >-
              竞争证据支持的是中等、且有条件的护城河。ShareChat 拥有差异化的语言优先产品，Moj 也熬过了淘汰多家本土短视频同业的 竞争，但在停止付费获客后，第三方估计其核心应用月活用户从 2024 年 3 月的
              1.04 亿降至 2025 年 2 月的 7,900 万。 全球平台拥有更大的创作者池、更成熟的推荐系统和更广的变现触达。微短剧可能增加使用时长并打开另一条收入来源，但据报道 该品类至少有 50
              个应用，且流失率很高。在管理层证明 cohort 稳定、创作者具有排他性且获客能够盈利之前，投资论点应把 方言互动视为有用的切入口，而不是永久壁垒。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多栖使用限制锁定效应
            body: 管理层称 ShareChat 95% 的用户与 Meta、YouTube 重叠，因此不能把本地相关性误认为排他性分发或高切换成本。
            calloutType: risk
            claimRefs:
              - CP006
          - type: callout
            title: 微短剧是品类迁移，不是简单的功能延伸
            body: QuickTV 引入订阅经济和不同的竞争者集合；评估表面订阅者数时，应同时核对获客成本、流失率、内容成本和广告贡献。
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
