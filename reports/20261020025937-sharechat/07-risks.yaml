callouts:
  - calloutType: risk
    title: Adjusted EBITDA is not cash flow
    body: >-
      Loss reduction is directionally positive, but the public evidence still requires a bridge
      from adjusted EBITDA through financing costs, provisions, working capital, and cash flow.
    claimRefs: [CR004, CR005, CR006, CR011, CR012]
  - calloutType: recommendation
    title: Make liquidity and dependency evidence closing conditions
    body: >-
      Do not underwrite the next financing or a durable Moj turnaround without current cash,
      debt terms, product contribution margins, and counterparty concentration schedules.
    claimRefs: [CR006, CR007, CR008, CR015]
