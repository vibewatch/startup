company:
  name: ShareChat
chapter:
  number: 7
  title: Risks
  summary: >-
    ShareChat has materially reduced adjusted EBITDA losses, but FY25 revenue was nearly flat,
    the consolidated business still recorded a large loss before tax, Moj remained loss-making,
    and the latest assigned evidence did not establish current liquidity or financing terms.
    Regulatory advertising exposure has already had a commercial effect, while privacy,
    moderation, security, litigation, and concentration controls remain public-evidence gaps.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implication
    body: >-
      The highest evidenced residual risk is financing and liquidity. FY24 filings, as reported
      by Entrackr, showed Rs 964.96 crore of operating cash outflow and only Rs 36.2 crore of cash
      and bank balances at year-end, while 2024 debt financing totaled about $65 million across
      two tranches. Those historical figures do not establish current cash availability, but they
      make updated unrestricted cash, debt terms, and a cash-flow bridge threshold diligence
      items rather than optional follow-ups. The second tier combines monetization and operating
      execution: FY25 revenue was nearly flat, advertising revenue declined, Moj remained
      loss-making because of video-streaming costs, and repeated workforce reductions show that
      cost repair has relied partly on organizational contraction. The thesis should break if
      current liquidity cannot cover at least 12 months of the board-approved operating plan,
      financing terms create a material preference or conversion overhang, or Moj lacks a
      credible, measured path to contribution breakeven.
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR010, CR013, CR015]
    figureRefs: [FR001]
  - id: financial-operational-risk
    title: Financial-model and operational execution risk
    body: >-
      Reported improvement is real but metric selection matters. FY24 accounting loss was
      Rs 1,898.94 crore, while adjusted EBITDA loss was Rs 777.84 crore after excluding financing,
      non-cash, and provisioning items. In FY25, adjusted EBITDA loss fell to Rs 219 crore, yet
      loss before tax remained Rs 1,105 crore and revenue moved only from Rs 718 crore to
      Rs 723 crore. The risk is therefore not that cost action failed; it is that adjusted
      profitability can improve faster than statutory loss, cash generation, or growth quality.
      Management should provide audited FY25 and FY26 statements, a reconciliation from adjusted
      EBITDA to operating cash flow, and product-level contribution margins. Monitoring should
      include consolidated operating cash flow, Moj streaming cost per engaged hour, advertising
      revenue, live-streaming payer concentration, regretted attrition, and delivery against
      product-roadmap milestones after successive workforce reductions.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR009, CR010, CR011, CR012, CR013, CR015]
    tableRefs: [TR002]
  - id: regulatory-legal-security
    title: Regulatory, legal, privacy, and security exposure
    body: >-
      The assigned evidence identifies one realized policy shock: the ban on real-money gaming
      removed a major advertising cohort, alongside an 8% year-on-year decline in FY25 advertising
      revenue. That is evidence that regulatory changes affecting advertiser categories can flow
      directly into monetization. A secondary source also reports investment in AI and machine
      learning for moderation, but the pool does not contain regulator records, a privacy or
      security audit, certification evidence, incident history, litigation dockets, or quantified
      moderation outcomes. Those absences cannot be treated as proof of clean status. Before
      investment, counsel should complete jurisdiction-by-jurisdiction checks for content,
      intermediary, privacy, advertising, intellectual-property, and child-safety obligations;
      security diligence should obtain independent testing, incident logs, data maps, and
      moderation effectiveness metrics. Any material enforcement action, undisclosed breach, or
      inability to evidence lawful data processing is a thesis-break trigger.
    claimRefs: [CR013, CR014, CR016]
    tableRefs: [TR001]
  - id: dependencies-mitigations-kill-criteria
    title: Dependencies, mitigations, and kill criteria
    body: >-
      Capital providers, advertisers, payers, creators, and video infrastructure are the most
      visible dependency groups, but only some are quantified. Public data identifies two 2024
      debt tranches, live streaming or chatroom at 56.1% of FY24 operating revenue, an advertising
      decline after a regulated advertiser cohort disappeared, and continuing Moj losses tied to
      streaming costs. It does not identify lender covenants, cloud-provider concentration,
      advertiser concentration, payer cohorts, creator payout obligations, or counterparty
      switching costs. Mitigation maturity is therefore partial at best: cost reductions and
      product diversification are visible, but resilience against a funding delay, platform-cost
      shock, or concentration loss is not demonstrated. Investment conditions should require
      debt documents, a 24-month monthly liquidity model, counterparty concentration schedules,
      cloud architecture and exit plans, and cohort-level monetization data. Kill criteria include
      covenant default, loss of a critical platform service without tested failover, or material
      revenue dependence on a single advertiser, payer cohort, or financing source without a
      funded contingency.
    claimRefs: [CR006, CR007, CR008, CR009, CR013, CR014, CR015]
    tableRefs: [TR003]
