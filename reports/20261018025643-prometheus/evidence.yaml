evidenceGaps:
  - type: missing-source
    severity: material
    topic: website
    missingEvidence: >-
      A first-party Prometheus homepage, legal page, or press room that directly confirms the current official domain
      and corporate branding.
    whyItMatters: Identity ambiguity weakens diligence on customers, hiring, legal entities, and later source attribution.
    diligencePath: >-
      Obtain a first-party domain from management, a filing, or a direct company announcement and verify it against
      archived captures.
    relatedQuestionRefs:
      - QO007
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      Primary round documents or authoritative company/investor statements reconciling whether April's $10B and June's
      $12B were one resized syndication or separate financings.
    whyItMatters: >-
      Total capital raised, dilution, and balance-sheet inference change materially depending on which interpretation is
      correct.
    diligencePath: Request term sheets, cap-table snapshots, or named investor confirmations covering both 2026 financing events.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Customer count, revenue, profitability, and any live deployment disclosures.
    whyItMatters: >-
      The company is heavily financed, but public evidence still does not show whether product adoption or monetization
      has begun.
    diligencePath: Ask management for pipeline, signed customers, revenue run rate, and any pilot-to-production conversion data.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership and stakeholder enumeration
    missingEvidence: A full executive roster, board list, and current cap table with ownership and control rights.
    whyItMatters: >-
      The public record is sufficient to identify key names but not to assess governance concentration or minority
      protections.
    diligencePath: Request the board deck, org chart, cap table, and governance documents during diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: promethesus-specific-sam
    missingEvidence: >-
      Bottom-up SAM or SOM math tied to Prometheus's initial workflow, geography, pricing unit, and expected contract
      size.
    whyItMatters: >-
      A broad industrial-AI narrative cannot support valuation or go-to-market quality without a disclosed initial wedge
      and spend denominator.
    diligencePath: Request management's internal market model, design-partner pipeline, and pricing assumptions by segment.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owner
    missingEvidence: >-
      Named buyers, users, payers, pilot structure, and budget owners for current Prometheus deployments or commercial
      trials.
    whyItMatters: Without real buyer proof, the chapter can only infer who owns adoption and how quickly budgets could convert.
    diligencePath: Obtain customer references or pilot case studies showing workflow, payer, contract owner, and deployment timeline.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: namesake-ambiguity
    missingEvidence: >-
      Company-specific market sizing that avoids keyword collisions with unrelated Prometheus-branded observability or
      maintenance software.
    whyItMatters: Generic web market reports can create false precision and understate or misclassify the target market entirely.
    diligencePath: >-
      Use management-provided bottom-up market segmentation and corroborate it with sector-specific third-party sources
      rather than company-name searches.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-visibility
    missingEvidence: >-
      Public or diligence-room product packaging, price metric, contract structure, and discounting norms for
      Prometheus.
    whyItMatters: >-
      Without commercial terms, it is impossible to compare switching cost, budget owner, or willingness-to-pay against
      named alternatives.
    diligencePath: Request current pricing decks, sample MSAs/order forms, and any pilot-to-production conversion data.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: product-benchmark
    missingEvidence: >-
      Independent benchmark or customer case study showing Prometheus outperforming incumbent engineering or frontier AI
      alternatives on a real workflow.
    whyItMatters: The moat thesis currently rests on ambition and financing rather than verified product outcomes.
    diligencePath: Obtain a referenceable pilot, workflow benchmark, or customer technical evaluation against the incumbent stack.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: missing-source
    severity: material
    topic: competitor-economics
    missingEvidence: Source-backed cost or implementation comparisons across Prometheus, incumbents, and internal-build alternatives.
    whyItMatters: Buyers often stay with incumbents when migration cost and operating burden are opaque.
    diligencePath: >-
      Collect pricing pages, procurement records, or customer migration case studies for the highest-probability
      alternatives.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: material
    topic: pricing-quality
    missingEvidence: Official product packaging, price book, standard contract terms, and booked ARR or ACV by product.
    whyItMatters: >-
      A generic subscription label does not show whether revenue is recurring, discounted, services-heavy, or tied to
      one-off pilots.
    diligencePath: Request current pricing sheets, sample order forms, and an ARR bridge by product and customer cohort.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Monthly revenue, gross margin, burn, cash balance, working-capital use, and capex detail.
    whyItMatters: >-
      Without these metrics, the public record cannot distinguish a scalable software margin profile from a compute- or
      program-heavy operating model.
    diligencePath: >-
      Request management accounts, board reporting, and a 24-month budget with compute, personnel, and infrastructure
      breakout.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Pipeline conversion, sales-cycle length, CAC, payback, renewal evidence, and named paying deployments.
    whyItMatters: >-
      Commercial efficiency determines whether the company can translate large funding rounds into durable software
      revenue rather than expensive experimentation.
    diligencePath: Request funnel metrics, signed customer contracts, deployment timeline data, and retention or expansion cohorts.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: official-disclosure-surface
    missingEvidence: A clearly attributable Prometheus company website, investor page, or first-party pricing surface.
    whyItMatters: >-
      The assigned public pool is dominated by media and profile pages, which limits confidence in packaging, pricing,
      and disclosure completeness.
    diligencePath: >-
      Ask management for the official web properties, pricing artifacts, and any investor FAQ used in the latest
      fundraising.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: missing-source
    severity: material
    topic: public-product-surface
    missingEvidence: >-
      Official product pages, release notes, SKU names, API/docs, or architecture materials for the Prometheus AI
      product.
    whyItMatters: >-
      Without an official technical surface, product maturity and implementation claims cannot be validated
      independently.
    diligencePath: >-
      Request current product brief, architecture diagram, release roadmap, and any external-facing docs or demo
      environment.
    relatedQuestionRefs:
      - QE002
      - QE003
      - QE008
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: Named customer deployments, reliability metrics, integration references, support model, and benchmark results.
    whyItMatters: >-
      Industrial-design software must prove workflow fit and measurable production outcomes before its technical claims
      can support underwriting.
    diligencePath: Request customer references, implementation diagrams, uptime/support metrics, and benchmark or pilot result packs.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Security, privacy, compliance, and safety-readiness documentation for use in critical physical-world workflows.
    whyItMatters: >-
      Engineering and manufacturing deployments may carry IP, quality, and liability risk that cannot be assessed from
      the public record today.
    diligencePath: >-
      Request security architecture, data-governance controls, model-validation process, and any regulatory or quality
      certifications.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Any public developer or practitioner signal tied directly to Prometheus AI rather than to unrelated namesake
      properties.
    whyItMatters: >-
      Developer or practitioner evidence would help verify whether the product has an external technical footprint or
      ecosystem pull.
    diligencePath: >-
      Request links to public repos, engineering talks, API communities, partner implementation posts, or a reason no
      such surface exists.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal, cohort, and contract-length metrics by customer segment.
    whyItMatters: Without durability data, customer lifetime value and product stickiness cannot be underwritten.
    diligencePath: Request cohort retention and renewal data from management, segmented by vertical and deployment stage.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: At least three independently verifiable third-party production deployments with scope, timing, and outcomes.
    whyItMatters: A buyer list without third-party validation does not establish that Prometheus works in live industrial workflows.
    diligencePath: Ask management for reference calls, public case studies, or procurement records tied to named customers.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, channel mix, and dependence on Bezos-affiliated entities or captive deployments.
    whyItMatters: Concentration and related-party demand could make early traction look stronger than it is.
    diligencePath: Request revenue concentration, channel mix, and any related-party customer disclosures.
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-readiness
    missingEvidence: >-
      Company-specific compliance mapping, deployment boundaries, insurance structure, and product-liability allocation
      for safety-sensitive use cases.
    whyItMatters: >-
      The retained pool contains commentary about likely obligations but not the primary documents needed to underwrite
      legal and regulatory readiness.
    diligencePath: >-
      Request an AI Act or equivalent compliance memo, product terms, indemnity language, insurer posture, and any
      sector-specific audit package.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: Named production deployments, revenue metrics, product benchmarks, and retention data tied to real customers.
    whyItMatters: >-
      Without direct traction evidence, the ranking of execution and valuation risk remains anchored to absence of proof
