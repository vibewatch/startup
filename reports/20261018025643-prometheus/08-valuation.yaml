    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, research-more, "Financing marks are clear, but public operating proof is still thin.", "Do not treat the current price as underwritten by disclosed fundamentals."]
