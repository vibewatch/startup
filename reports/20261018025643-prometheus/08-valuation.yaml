    claimRefs: [CV001, CV008, CV010, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: "Current call: respect the round, do not chase the price"
    body: >-
      Prometheus merits continued diligence because the company has assembled an
      unusual mix of founder capital, institutional backing, and ambition, but
      the current public record does not support treating the June 2026 mark as
      obviously investable.
    claimRefs: [CV001, CV003, CV012]
  - calloutType: risk
    title: "Most important downside"
    body: >-
      The clearest downside is a valuation reset triggered by a new financing or
      secondary event before Prometheus discloses product, customer, or revenue
      proof that outsiders can benchmark.
    claimRefs: [CV006, CV007, CV010, CV012]
  - calloutType: assumption
    title: "What would move the view"
    body: >-
      The case improves materially if the company publishes credible evidence on
      deployments, revenue, product benchmarks, and capital structure rather
      than relying on financing headlines alone.
    claimRefs: [CV008, CV009, CV012]
