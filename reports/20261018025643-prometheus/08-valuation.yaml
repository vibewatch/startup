      - [Risk rating, high, "Public evidence still lacks disclosed revenue, named customer proof, public benchmarks, and detailed cap-table terms.", "Any new entry should assume substantial execution and markdown risk."]
      - [Valuation stance, stretched, "Observable marks moved from roughly $38B in April 2026 to $41B in June 2026 before public traction metrics were disclosed.", "Existing buyers are paying for category optionality more than demonstrated operating proof."]
      - [Target return / hold / exit, not supportable from public evidence, "No public revenue, margin, or retention base is available to ground a return model.", "Wait for milestone proof or materially better price rather than forcing false precision."]
    notes: "Synthesis of disclosed 2026 financing marks and public evidence gaps; no public return model inputs are available."
    claimRefs: [CV001, CV002, CV003, CV008, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - Why it matters now
      - What would change the view
    rows:
      - ["Elite capital formation", thesis, "Bezos plus JPMorgan, Goldman Sachs, BlackRock, and other backers have already funded the company at exceptional scale.", "Keep positive weight only if capital converts into visible product and customer proof."]
      - ["Large opportunity with compute backing", thesis, "Management is aiming at high-value engineering and manufacturing workflows, and TechCrunch says a large share of proceeds will fund compute.", "Upgrade only if compute spend produces benchmarks, deployments, or disclosed revenue."]
      - ["Commercial proof gap", anti-thesis, "Public reporting still leaves product specifics under wraps and does not disclose public customer or revenue proof.", "Named deployments, revenue disclosure, or benchmarked product output would materially strengthen the case."]
      - ["Comparable-set limitation", anti-thesis, "Peer context exists, but Prometheus itself lacks disclosed revenue and EV/Rev, so public comps do not validate the current private mark.", "A cleaner benchmark bridge requires disclosed operating metrics or a later round with fuller terms."]
    notes: "Rows separate financing strength from missing operating evidence; comparable context is directional, not valuation proof."
    claimRefs: [CV001, CV007, CV008, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Prometheus publicly discloses a product, shows named enterprise deployments, and starts reporting revenue or equivalent commercial traction before the next financing.", "The June 2026 $41B mark could be defended or expanded because operating proof would begin to catch up with capital intensity.", "Requires new evidence not yet public as of runDate.", "Failure to convert compute spend into visible customer outcomes."]
      - [Base, "Funding remains ample, but public evidence on revenue, customers, and benchmarked performance stays limited through the next diligence cycle.", "Treat the current $38B-$41B financing range as a ceiling for outside underwriting rather than a clear bargain.", "Most consistent with the current evidence set.", "Further time passes without customer, revenue, or benchmark disclosure."]
      - [Bear, "Prometheus reaches a new financing or secondary-mark event without public commercial proof, while AI valuation appetite cools.", "A markdown below the 2026 private marks becomes plausible because the market would still be underwriting narrative more than demonstrated traction.", "Explicitly supported by the missing-proof and structural-risk record.", "Down-round, softer secondaries, or unfavorable preference terms."]
    notes: "Scenario ranges are milestone-based because public revenue, margin, and retention data are unavailable; this avoids unsupported precision."
    claimRefs: [CV001, CV006, CV007, CV008, CV010, CV012]
