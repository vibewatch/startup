      - ["Vik Bajaj", "Co-founder / co-CEO / investor in some reports", "Central operating counterpart to Bezos and sometimes included among round participants", "Clarify ownership stake, board seat, and separation between Prometheus and other Bajaj ventures."]
      - ["JPMorgan", "Institutional investor", "Repeatedly named in April and June financing reports and could shape future capital formation", "Confirm exact vehicle, check size, and any structured financing terms."]
      - ["BlackRock", "Institutional investor", "Repeatedly named as a participant and likely validation point for later investors", "Confirm whether exposure is direct balance-sheet capital or client-vehicle capital."]
