company:
  name: Prometheus
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Prometheus emerged in late 2025 around Jeff Bezos and Vik Bajaj, with public
    sources consistently describing a San Francisco-based physical-engineering AI
    company that expanded quickly across San Francisco, London, and Zurich.
    Public reporting agrees on a fast rise to roughly 120 employees and an
    "artificial general engineer" product narrative, but it still leaves
    unresolved conflicts about cumulative capital raised, the current official
    website, and any customer, revenue, or governance disclosure.
sections:
  - id: identity-and-positioning
    title: Identity and positioning
    body: >-
      Public reporting consistently places Prometheus's formation in November
      2025 under Jeff Bezos and Vik Bajaj, originally under the name Project
      Prometheus and later shortened to Prometheus. The company's public product
      framing also converges more than its branding surfaces do: sources
      describe a physical-economy or physical-AI company aimed at engineering,
      manufacturing, and design workflows rather than a robotics business.
      Bezos's reported description of an "artificial general engineer" and a
      modern CAD-like design stack gives later chapters a usable working
      definition of the product, but the assigned pool still does not
      independently verify an official first-party web domain for the company.
    claimRefs: [CO001, CO002, CO003, CO004, CO015]
    tableRefs: [TO001]
  - id: leadership-and-organization
    title: Leadership and organizational grounding
    body: >-
      The clearest public management picture is a founder-led structure with
      Bezos as co-CEO beside Bajaj, whose background spans Google X, Verily,
      GRAIL, and Foresite. Public reporting also connects the General Agents
      acquisition to the addition of Sherjil Ozair and William Guss, which helps
      explain how Prometheus paired scientific leadership with agentic-AI
      talent early in its buildout. Scale disclosures remain approximate rather
      than audited, but the evidence cluster consistently points to a rapid rise
      toward roughly 120 employees by mid-2026 and a multi-office footprint
      spanning San Francisco, London, and Zurich.
    claimRefs: [CO002, CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing, stakeholders, and unresolved ownership questions
    body: >-
      Funding headlines are strong but not perfectly consistent. Public
      reporting agrees that Prometheus launched with $6.2 billion of capital and
      then entered a much larger 2026 financing cycle that named JPMorgan,
      BlackRock, and other large institutions. What remains less settled is
      whether April's $10 billion at roughly $38 billion and June's $12 billion
      at $41 billion were successive descriptions of one enlarged syndication or
      separate rounds that should both count toward cumulative capital. That
      ambiguity matters because it changes total-raised math, implied dilution,
      and how much cash may actually sit on the balance sheet today.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Milestones and open diligence gaps
    body: >-
      The observable milestone trail is unusually financing-heavy: founding,
      launch funding, an early acqui-hire, public clarification of the product
      thesis, and mega-round reporting all arrived before the market saw public
      customers, revenue, or a verified official website. That imbalance does
      not invalidate the business, but it makes Prometheus's current stage one
      of capitalized ambition rather than demonstrated commercial proof. For
      diligence, the biggest carry-forward gaps are board and cap-table
      transparency, customer and revenue disclosure, round-structure
      reconciliation, and direct verification of first-party identity surfaces.
    claimRefs: [CO007, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
