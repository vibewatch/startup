  evidenceGaps:
    - type: missing-source
      severity: material
      topic: website
      missingEvidence: A first-party Prometheus homepage, legal page, or press room that directly confirms the current official domain and corporate branding.
      whyItMatters: Identity ambiguity weakens diligence on customers, hiring, legal entities, and later source attribution.
      diligencePath: Obtain a first-party domain from management, a filing, or a direct company announcement and verify it against archived captures.
      relatedQuestionRefs: [QO007]
    - type: conflicting-data
      severity: material
      topic: total-raised
      missingEvidence: Primary round documents or authoritative company/investor statements reconciling whether April's $10B and June's $12B were one resized syndication or separate financings.
      whyItMatters: Total capital raised, dilution, and balance-sheet inference change materially depending on which interpretation is correct.
      diligencePath: Request term sheets, cap-table snapshots, or named investor confirmations covering both 2026 financing events.
      relatedQuestionRefs: [QO006]
    - type: private-evidence-only
      severity: material
      topic: commercial-traction
      missingEvidence: Customer count, revenue, profitability, and any live deployment disclosures.
      whyItMatters: The company is heavily financed, but public evidence still does not show whether product adoption or monetization has begun.
      diligencePath: Ask management for pipeline, signed customers, revenue run rate, and any pilot-to-production conversion data.
      relatedQuestionRefs: [QO005]
    - type: enumeration-incomplete
      severity: material
      topic: leadership and stakeholder enumeration
      missingEvidence: A full executive roster, board list, and current cap table with ownership and control rights.
      whyItMatters: The public record is sufficient to identify key names but not to assess governance concentration or minority protections.
      diligencePath: Request the board deck, org chart, cap table, and governance documents during diligence.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002, TO003]
