      - [Anthropic, Frontier AI lab, "Late-stage / heavily funded private company", "Enterprise model deployment and researcher hiring", "Enterprise deployment credibility and frontier-model competition", "No retained source shows industrial workflow product overlap in detail"]
      - [xAI, Frontier AI lab, "Late-stage / heavily funded private company", "Model capability and technical talent", "Competes for technical talent and frontier attention", "No retained source shows manufacturing-specific workflow product evidence"]
      - [Google DeepMind, Frontier AI research group, "Corporate-backed advanced AI research group", "Scientific AI and engineering-relevant foundation models", "Deep research bench and scientific-model credibility", "Retained evidence does not show direct commercial packaging against Prometheus"]
      - [Siemens Digital Industries Software, Engineering incumbent, "Corporate-backed global software suite", "Physical-systems design workflows", "Installed engineering workflow presence and incumbent distribution", "Retained evidence does not isolate current AI product details or pricing"]
      - [Autodesk, Engineering incumbent, "Public company / incumbent design platform", "CAD and engineering design tooling", "Existing design-system footprint in buyer workflows", "Retained evidence does not show direct feature-by-feature overlap"]
    notes: >-
      Public competitor names and category framing come from the August 2026 tear sheet, supplemented by
      June 2026 coverage on incumbent-response risk. This table summarizes what the retained evidence can
      prove; it does not imply full product equivalence where the pool is silent.
    claimRefs: [CP001, CP002, CP003, CP004, CP013]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Prometheus
      - Frontier labs
      - Engineering incumbents
      - Developer-workflow adjacents
    rows:
      - ["Physical-world engineering focus", "Yes in public narrative; AI for engineering, manufacturing, and drug design", "General-purpose AI capability; engineering specialization not shown in retained sources", "Yes for engineering workflows through incumbent design suites", "Adjacency only; coding and developer automation rather than physical-system engineering"]
      - ["Installed workflow distribution", "Not publicly disclosed", "Enterprise AI reach, but retained sources do not show embedded engineering workflow control", "Strongest evidence-backed position because incumbents already own design software relationships", "Useful team-level tooling, but retained evidence does not show plant or engineering-suite control"]
      - ["Public commercial proof", "Not disclosed in retained evidence", "Not disclosed in retained evidence for this chapter’s comparison set", "Existing enterprise presence is implied by incumbent status, but retained sources do not provide customer-level proof here", "Not disclosed in retained evidence"]
      - ["Core competitive lever", "Capital, talent, and prospective proprietary physical-world data", "Frontier model quality, compute, and researcher brand", "Workflow lock-in, installed base, and account control", "Incremental automation that can absorb engineering tasks before a full platform switch"]
    notes: >-
      Cells marked “not disclosed in retained evidence” reflect limits of the assigned pool, not a universal
      statement about market availability. Developer-workflow adjacents refer to Cognition, Anysphere, and
      Replit as named in the retained competitor list.
    claimRefs: [CP002, CP003, CP006, CP008, CP013, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Comparison set
      - Price / unit / contract model
      - Included capabilities in retained evidence
      - Discount / unknowns
      - Implication
    rows:
      - [Prometheus, "Not publicly disclosed", "Physical-economy / engineering AI vision only", "No list pricing, contract model, or deployment terms in retained sources", "Cannot benchmark switching cost or budget-owner fit yet"]
      - [Frontier labs, "Not evidenced in the assigned pool for this chapter", "General enterprise AI infrastructure and model capability", "Retained sources name the competitors but do not provide pricing artefacts", "Comparison remains strategic rather than commercial"]
      - [Engineering incumbents, "Not evidenced in the assigned pool for this chapter", "Design and engineering workflow control", "No retained pricing pages or contracts for Siemens DISW or Autodesk in this pool", "Incumbent distribution is visible; cost comparison is not"]
      - [Internal build / composite stack, "N/A in retained public pricing evidence", "Combination of incumbent tools plus internal engineering effort", "No retained source quantifies engineering effort, integration cost, or operating burden", "Status quo may remain sticky because the alternative economics are still opaque"]
    notes: >-
      This table intentionally reports pricing visibility within the retained evidence set. The assigned pool
      does not include public pricing artefacts for Prometheus or the named physical-engineering comparison
      set, so unknowns are surfaced rather than inferred away.
    claimRefs: [CP005, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on retained evidence: Prometheus scores high on workflow ambition but low on
      disclosed distribution, while incumbents score highest on embedded workflow control.
    data:
      xAxis:
        label: "Workflow specificity (1=broad AI platform, 5=deep engineering workflow presence)"
        min: 1
        max: 5
        lowLabel: "Broad platform"
        highLabel: "Engineering workflow depth"
      yAxis:
        label: "Distribution / installed-base leverage (1=limited disclosed reach, 5=embedded incumbent reach)"
        min: 1
        max: 5
        lowLabel: "Limited disclosed reach"
        highLabel: "Embedded reach"
      points:
        - label: Prometheus
          x: 4
          y: 1
          detail: "High public ambition around physical-world engineering; low disclosed commercial distribution."
        - label: OpenAI
          x: 2
          y: 3
          detail: "Broad frontier AI reach and talent pull, but retained sources do not show engineering-suite depth."
        - label: Anthropic
          x: 2
          y: 2
          detail: "Enterprise model competitor with limited retained evidence on engineering workflow ownership."
        - label: xAI
          x: 2
          y: 2
          detail: "Frontier model competitor competing on capability and technical talent."
        - label: Siemens DISW
          x: 5
          y: 5
          detail: "Incumbent engineering workflow control and global account reach."
        - label: Autodesk
          x: 4
          y: 4
          detail: "Strong design-tool footprint with closer overlap to engineering workflows than frontier labs."
    approximationNotes: >-
      Ordinal scores synthesize the retained evidence only; they are not source-native benchmarks. X reflects
      how specific the public overlap is to engineering workflows, and Y reflects disclosed or implied
      workflow distribution strength.
    claimRefs: [CP001, CP002, CP003, CP013, CP014]
