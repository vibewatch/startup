        title: 展示项
        blocks:
          - type: callout
            title: 叙事广阔，切入口未披露
            body: 公开描述支持实体经济工程 AI 的长期市场可能极其庞大，但指定来源没有说明 Prometheus 首先要服务哪个买方细分、工作流或定价模式。
            calloutType: insight
            claimRefs:
              - CM003
              - CM009
          - type: callout
            title: 关键词 TAM 不足以用于尽调
            body: 公开网络上的“Prometheus”市场报告主要讨论无关的可观测性或维护类别；两份保留的 managed-Prometheus-services 估算在考虑类别错配之前就已互相冲突。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 公开可见的竞争版图很广，但尚未落到具体产品
        blocks:
          - type: paragraph
            body: >-
              指定证据没有呈现清晰的一对一产品对手，因为 Prometheus 尚未公开商业产品、价格表或可比较的部署足迹。公开记录显示，Prometheus 想解决的那类问题周围已经形成宽泛的竞争圈：争夺研究人员和企业 AI
              基础设施的前沿 AI 实验室，以及已经嵌入设计和制造工作流的工程软件 incumbents。保留材料中，投资人 tear sheet 给出的具名竞争者列表最清晰，覆盖
              OpenAI、Anthropic、Google DeepMind、xAI、Mistral、Cognition、Anysphere、Replit、Siemens Digital Industries
              Software 和 Autodesk。这种组合意味着，未来买方比较的可能不只是其他模型公司，也包括既有设计系统和相邻 AI 工具；后者可以自动化部分工程工作，而不必完成“人工通用工程师”的完整跨越。
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
