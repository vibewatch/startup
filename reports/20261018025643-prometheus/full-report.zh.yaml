            - 企业研发或项目预算
        - label: 嵌入现有工具的工作流
          detail: Prometheus 被描述为一个工程层，可叠加在客户已经使用的 CAD 和仿真软件之上。
          touchpoints:
            - CAD / PLM / 仿真技术栈
            - 工程优化工作流
        - label: 案例研究证据
          detail: Blue Origin 仅被提出为潜在案例客户。
          touchpoints:
            - 与 Bezos 相关的验证
            - 未披露生产范围
        - label: 算力邻近客户
          detail: Amazon 仅被提及为潜在算力客户，而非终端市场用户。
          touchpoints:
            - 基础设施客户
            - 不是产品采用证据
        - label: 生产制造商部署
          detail: 公开资料没有披露具体设计合作方、工厂客户或独立生产部署。
          touchpoints:
            - 缺少点名部署
            - 缺少 ROI 或续约证据
        - label: 扩张 / 自有资产闭环
          detail: 报道中的收购载体论点会让业务从软件扩展到自有工业资产，但该闭环尚无公开客户证据。
          touchpoints:
            - 数据访问论点
            - 商业执行尚未验证
    approximationNotes: 各阶段结合了已表述的商业意图与明确缺失的证据；该图是对哪些事项有证据、哪些没有证据的尽调视角，不是已确认的运营漏斗。
