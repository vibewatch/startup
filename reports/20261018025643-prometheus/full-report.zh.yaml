  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是实体工程 AI，而非通用的“Prometheus”软件
        blocks:
          - type: paragraph
            body: >-
              本次指定来源将 Prometheus 描述为实体经济或工业 AI 公司，而不是通用企业 copilot。Pulse 2.0 称，公司正在构建理解物理定律、服务工程和制造等实体行业的 AI 系统；AI Weekly
              与 2026 年 8 月的 tear sheet
              则将其雄心描述为用于设计实体对象的“人工通用工程师”。这一定义意味着相关支出应来自工程设计、仿真、先进制造转型及相邻科学设计预算，而不能因为名称相同就纳入无关类别。同名搜索噪音很大：同一关键词还会命中开源
              Prometheus 监控项目、Prometheus Group 的资产管理软件，以及旧版 Prometheus Products 硬件页面。这些同名对象是证据质量警示，不是直接市场可比公司。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
      - number: '2.2'
        title: 相关市场规模很大，但 Prometheus 的 SAM/SOM 未披露
        blocks:
          - type: paragraph
            body: >-
              指定来源池中唯一直接相关的数字视角，是 Pulse 2.0 引用的制造业 AI 第三方估算：2025 年约 $34B，到 2030 年扩大至约 $155B；其所在的全球制造业基盘约为 $16.8T，而 AI
              渗透率仍低于 1%。这一口径支持一个非常大的长期上限，却不足以形成可用于尽调的 Prometheus SAM 或
              SOM。没有保留的来源按工作流、地域、价格点或客户细分拆出公司的初始切入口。与此同时，关键词命中的“Managed Prometheus
              Services”报告给出小得多的可观测性市场估算，且彼此还不一致。由于这些报告讨论的是围绕开源 Prometheus 栈的云监控，它们只能作为名称碰撞噪音和失败估值路径的证据，不能作为
              Prometheus.ai 的有效估值锚点。
            claimRefs:
