      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 在下一轮融资前，Prometheus 公开披露产品、展示具体企业部署，并开始报告收入或同等商业化进展。
        - 随着运营证据开始追上资本投入强度，2026 年 6 月的 $41B 估值可能得到守住或进一步上调。
        - 截至 runDate 仍需要尚未公开的新证据。
        - 算力投入未能转化为可见的客户成果。
      - - 基准
        - 资金仍然充裕，但到下一轮尽调周期结束前，关于收入、客户和经基准测试验证的表现的公开证据仍然有限。
        - 将当前 $38B-$41B 融资区间视为外部投资判断的上限，而不是明显的便宜价。
        - 与当前证据集最为一致。
        - 时间继续过去，但仍未披露客户、收入或基准测试结果。
      - - 悲观
        - 在 AI 估值热度降温之际，Prometheus 在没有公开商业证据的情况下进入新一轮融资或二级市场定价事件。
        - 由于市场仍在评估叙事而非已验证的商业化进展，跌破 2026 年私募估值变得合理。
        - 有证据缺口和结构性风险记录明确支持。
        - 下轮融资降价、更弱的二级市场价格，或不利的优先权条款。
    notes: 由于公开收入、利润率和留存数据不可得，情景区间以里程碑为基础，避免制造无依据的精确度。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV010
      - CV012
