      - number: '8.4'
        title: 情景框架、退出准备度与逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              由于公开披露没有精确投资判断所需的常规要素，情景分析必须以里程碑为轴。只有当 Prometheus
              将融资优势转化为可见的商业证据——发布产品、出现具名部署、披露收入，并证明重算力支出产生了企业价值而非只有实验——乐观情景才可能守住或超过 2026 年 6
              月估值。基准情景是公司仍具战略吸引力，但还没准备好做出按价格买入的决定，因此需要继续尽调，并等待更强证明或更好入场条款。悲观情景是，公司在下一轮融资前仍没有公开客户、收入或 benchmark
              支撑，最终出现下修轮或折价老股交易。这也界定了退出准备度：公司未来可能变得有吸引力，但当前公开证据仍太薄，无法锚定有信心的持有或回报目标。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断：尊重融资轮次，不要追高
            body: Prometheus 值得继续尽调，因为公司集结了非同寻常的创始人资本、机构支持和雄心；但当前公开记录不足以把 2026 年 6 月的估值视为显然值得投资。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
          - type: callout
            title: 最重要的下行风险
            body: 最清晰的下行风险，是在 Prometheus 披露外部人可以比较的产品、客户或收入证明之前，新融资或老股交易触发估值重置。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
          - type: callout
            title: 哪些变化会推动判断改变
            body: 如果公司发布关于部署、收入、产品 benchmark 和资本结构的可信证据，而不是只依赖融资 headline，投资逻辑会明显改善。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV009
              - CV012
