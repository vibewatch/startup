  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议仍受融资实力与公开披露运营证据之间缺口的约束。
    data:
      nodes:
        - id: capital
          label: 资本信号异常强
          detail: $12B 于 2026 年 6 月以 $41B 估值完成，4 月估值约为 $38B。
          tone: opportunity
        - id: compute
          label: 资金似乎用于能力建设
          detail: TechCrunch 称本轮大部分资金将用于算力。
          tone: neutral
        - id: proof
          label: 公开运营证据仍有限
          detail: 没有已披露收入、点名客户证据或公开基准桥接。
          tone: risk
        - id: comps
          label: 可比背景不完整
          detail: 同业存在，但 Prometheus 未披露收入和 EV/Rev。
          tone: risk
        - id: price
          label: 当前估值看起来偏高
          detail: 公开证据支持观察 $38B-$41B 的估值，而不是将其完整纳入投资判断。
          tone: risk
        - id: decision
          label: 建议：继续研究
          detail: 在将该估值视为可投资之前，等待里程碑证据或更好的入场条款。
          tone: warning
      edges:
        - from: capital
          to: compute
          label: 为近期扩张提供资金
        - from: compute
          to: proof
          label: 仍需商业产出
        - from: proof
          to: comps
          label: 指标缺失削弱可比性
        - from: comps
          to: price
          label: 限制公允价值支撑
        - from: price
          to: decision
          label: 推动入场纪律
    approximationNotes: 该解释链基于已披露融资事实和缺失的公开运营指标，不是量化模型。
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
