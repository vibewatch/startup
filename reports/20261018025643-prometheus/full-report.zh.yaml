      - number: '3.2'
        title: 既有厂商掌控工作流，可能在 Prometheus 证明执行力前反击
        blocks:
          - type: paragraph
            body: >-
              公开报道显示的竞争威胁，与其说是“另一个拥有相同 pitch 的初创公司”，不如说是资本充足的模型公司与根深蒂固的工业 incumbents 的组合。AI Weekly 2026 年 6
              月的总结明确指出，Siemens、GE Vernova 和 Honeywell 等工业 incumbents 可能在 Prometheus 规模化部署前加快自身 AI 路线，或收购防御性标的。Pulse 2.0
              补充称，截至 2026 年 4 月融资时，Prometheus 尚未发布产品、研究或收入，因此其相对优势主要仍是战略性的，尚未得到商业验证。Prometheus
              的防御性路径似乎取决于拼出专有实体世界数据、吸引前沿人才，并可能借助关联收购实体进入既有厂商已经熟悉的运营环境。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP008
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP013
              - CP014
      - number: '3.3'
        title: 价格与能力对比证据稀薄，名称碰撞又制造搜索噪音
        blocks:
          - type: paragraph
            body: >-
              本章的尽调难点在于，指定来源池没有 Prometheus 自身报价、产品打包或客户证明，因此持久的能力比较仍主要是间接的。最有证据支持的比较其实是负面的：公开报道可以列出竞争者类别，却还不能说明买方将如何与
              Prometheus
              签约，或如何将其与前沿实验室、既有工程套件和内部自建路径比较。除此之外，初创公司的品牌还要与一个同名且已成熟的开源监控项目共存。指定来源中的独立及官方材料显示，“Prometheus”已经强烈关联可观测性工具，并与
              Grafana、Datadog、VictoriaMetrics 等产品构成拥挤的替代集合。这不意味着监控栈是直接产品对手，但确实增加了名称周围的搜索、定位和心智噪音。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP012
      - number: '3.4'
        title: 护城河耐久性更多取决于数据访问和工作流控制，而非公开展示的功能
        blocks:
          - type: paragraph
            body: >-
              保留来源支持护城河假设，但还没有证明护城河存在。公开报道称，Prometheus 正尝试构建理解工程、制造及相邻领域物理流程的 AI
              系统，同时探索把运营数据回流模型的结构。如果跑通，公司可能形成一般前沿实验室和纯软件 copilot 难以复制的训练与部署闭环。但同一证据也显示该逻辑目前多么脆弱：Bezos
              被引述为关注问题难度而非既有护城河；既有厂商拥有安装基础；而且没有公开 benchmark 或商业证明显示买方应放弃既有工程工作流，或在其上叠加 Prometheus。当前结论是：Prometheus
              有战略雄心和资本，但竞争耐久性仍是假设，等待产品证据。
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP012
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 既有工作流控制是近期威胁
            body: 最高置信度的竞争风险不是克隆型初创公司，而是工业软件厂商和资本充足的模型公司可以在 Prometheus 证明可重复的产品、客户或定价模式前作出回应。
            calloutType: risk
            claimRefs:
              - CP003
              - CP005
              - CP014
          - type: callout
            title: 公司参与的类别尚未被公开钉死
            body: 公开证据列出了前沿实验室、工程软件 incumbents 和相邻 AI 工具，但 Prometheus 尚未披露足够产品细节，市场还不知道哪组比较对象应占主导。
            calloutType: insight
            claimRefs:
              - CP001
              - CP012
              - CP013
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本可见，经营证明不可见
        blocks:
          - type: paragraph
            body: >-
              公开来源对融资规模的描述基本一致，但不足以支持通常的软件投资判断。Pulse 2.0 报道 2026 年 4 月约 $10B 的融资，对应约 $38B 估值；多份 2026 年 6 月摘要随后又称融资为
              $12B、估值 $41B，使披露资本超过 $18B（CI001、CI002、CI003、CI011）。缺少的是经营分母：4 月报道称公司尚未发布产品、研究或收入，6
              月评论仍称没有公开收入、产品时间表或客户部署（CI004、CI005）。因此资产负债表故事清楚，但业务本身几乎没有公开基本面定价。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI011
      - number: '4.2'
        title: 公开变现证据止步于笼统的订阅标签
        blocks:
          - type: paragraph
            body: >-
              最强的公开变现信号，是资料网站将 Prometheus 归为服务工程与制造买方的 B2B 订阅业务；但它们没有公布标价、定价指标、合同模板或收入确认政策（CI006、CI014）。EquityZen
              的公开页面主要体现披露边界：它推广私募市场准入，却把详细收入和财务数据放在有门槛的投资人流程之后；Silicon Valley Invest Club 的 tear sheet
              也称收入和盈利能力未公开披露（CI007、CI008、CI009）。就连显眼的 prometheus.io
              网站也属于无关的监控产品，进一步说明指定公开来源中没有管理层提供的、可明确归因于公司的一方定价或投资者关系页面（CI016）。
