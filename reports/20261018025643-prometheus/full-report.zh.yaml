    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              公开报道一致称，Prometheus 于 2025 年 11 月由 Jeff Bezos 和 Vik Bajaj 创立，最初名为 Project Prometheus，后来简称
              Prometheus。公司的公开产品叙事也比品牌呈现更趋一致：来源将其描述为实体经济或实体 AI 公司，目标是工程、制造和设计工作流，而非机器人业务。Bezos 所称的“人工通用工程师”以及现代 CAD
              式设计栈，为后续章节提供了可用的产品定义；但在本次指定来源池中，仍无法独立验证公司官方的一方网站域名。
