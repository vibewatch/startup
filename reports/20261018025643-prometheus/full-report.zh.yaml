      - number: '2.3'
        title: 买方预算可能很大，但采用速度慢且摩擦高
        blocks:
          - type: paragraph
            body: >-
              公开描述显示，潜在买方位于值得用战略预算压缩工程周期的领域：航空航天与国防的先进设计项目、芯片制造和工业制造，以及药物设计等科学研发。可能的用户包括工程师、仿真团队、工艺专家和研究人员；付款方则可能在研发、工程、运营转型或企业投资实体之间切换，取决于
              Prometheus 是卖软件、与设计伙伴做试点，还是嵌入收购的工业资产。相同证据也凸显采用约束。实体 AI
              需要材料行为、工程公差和工业流程的专有数据，而指定报道仍未披露产品、收入或具名客户证明。如果产品能跑通，最终预算空间可能很大；但相较标准应用 AI 软件，商业化路径会更慢、更难。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
