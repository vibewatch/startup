    columns:
      - 论点
      - 方向
      - 为何当前重要
      - 什么会改变判断
    rows:
      - - 顶级资本形成
        - 正论
        - Bezos、JPMorgan、Goldman Sachs、BlackRock 及其他支持者已按非凡规模为公司提供资金。
        - 只有当资本转化为可见的产品和客户证明时，才保留正面权重。
      - - 算力支撑下的巨大机会
        - 正向论点
        - 管理层瞄准高价值工程与制造工作流，TechCrunch 称本轮大部分资金将用于算力。
        - 只有当算力投入带来基准测试、部署或已披露收入时，才应上调判断。
      - - 商业化证据缺口
        - 反向论点
        - 公开报道仍未披露产品细节，也没有公开客户或收入证据。
        - 若披露具体部署、收入或经基准测试验证的产品产出，论据将明显增强。
      - - 可比组局限
        - 反向论点
        - 市场上有同业参照，但 Prometheus 未披露收入和 EV/Rev，因此公开可比公司无法验证当前私募估值。
        - 要建立更可靠的估值桥梁，需要披露运营指标，或等待条款更完整的后续融资。
    notes: 各行将融资实力与运营证据缺口分开；可比背景只能指示方向，不能证明估值。
