      - number: '8.3'
        title: 投资逻辑、反向逻辑与可比纪律
        blocks:
          - type: paragraph
            body: >-
              乐观情景很容易陈述：Jeff Bezos
              投入了异常规模的资本，机构投资人加入融资，管理层瞄准了一个足够大的实体工程机会；如果产品市场匹配到来，超高的前期算力和人才投入或许合理。反向逻辑是，公开证据仍显示公司没有披露收入、没有公开产品
              benchmark，也没有宣布客户证明，外部人无法测试 $38B 至 $41B 是否是理性入场点，而非动量定价。Multiples 确实列出包括 OpenAI、Anthropic、Z.ai 和 Snowflake
              在内的可比对象，但同一记录仍未披露 Prometheus 收入和 EBITDA，因此无法建立干净的收入倍数桥接。Tracxn 的另一条“Prometheus”结果指向 Prometheus Fuels，而不是
              Bezos 领导的 AI 公司，说明估值工作应排除仅按名称匹配的数据库结果。正确的分析姿态是只把已核实的同业引用当作类别资本偏好的背景，而不是据此认可当前价格。
            claimRefs:
              - CV001
