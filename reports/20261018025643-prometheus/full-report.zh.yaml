        title: 里程碑与待补尽调缺口
        blocks:
          - type: paragraph
            body: >-
              可观察的里程碑轨迹异常偏重融资：成立、启动融资、早期人才收购、产品主张的公开澄清以及超大额融资报道，都发生在市场看到公开客户、收入或经验证的官方网站之前。这种失衡并不否定业务，但意味着 Prometheus
              当前更像是资本充足的雄心，而不是已经证明商业化的公司。尽调需要继续追踪的最大缺口包括董事会与股权结构透明度、客户与收入披露、轮次结构对账，以及一方身份信息的直接验证。
