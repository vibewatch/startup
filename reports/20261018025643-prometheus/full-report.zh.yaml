      - number: '1.2'
        title: 领导层与组织基础
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开管理层图景是由 Bezos 与 Bajaj 共同担任联席 CEO 的创始人主导结构；Bajaj 的经历横跨 Google X、Verily、GRAIL 和 Foresite。公开报道还将
              General Agents 的收购与 Sherjil Ozair、William Guss 的加入联系起来，这有助于解释 Prometheus 如何在早期建设中把科学领导力与智能体 AI
              人才结合起来。规模披露仍是估算而非审计结果，但证据群持续指向：截至 2026 年年中，公司员工数快速增至约 120 人，并在旧金山、伦敦和苏黎世形成多办公室布局。
