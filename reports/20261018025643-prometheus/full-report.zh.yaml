      - number: '1.3'
        title: 融资、利益相关方与未解决的所有权问题
        blocks:
          - type: paragraph
            body: >-
              融资 headline 很强，但并不完全一致。公开报道一致称，Prometheus 以 $6.2B 资本启动，随后在 2026 年进入更大规模的融资周期，JPMorgan、BlackRock
              等大型机构被点名参与。尚未厘清的是：4 月约 $38B 估值下的 $10B 融资，与 6 月 $41B 估值下的 $12B
              融资，究竟是同一轮扩大的联合融资的先后描述，还是应共同计入累计资本的两轮独立融资。这个歧义会改变累计融资计算、隐含稀释程度，以及如今资产负债表上实际可能剩余多少现金。
