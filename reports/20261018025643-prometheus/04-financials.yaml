schemaVersion: "report-v2"
artifact: financials
slug: prometheus
runDate: 2026-10-18
company:
  name: Prometheus
chapter:
  number: 4
  title: Financials
  summary: >-
    Prometheus is exceptionally well capitalized on public evidence, with June 2026 reporting placing the company at
    more than $18 billion raised and a $41 billion valuation, but the same record still omits revenue, customer,
    pricing, and margin disclosures needed for normal underwriting. The practical verdict is low near-term solvency
    risk but high uncertainty around revenue quality, unit economics, and the boundary between Prometheus software
    economics and any affiliated industrial-asset strategy.
sections:
  - id: capital-base-vs-operating-proof
    title: Capital is visible; operating proof is not
    body: >-
      Public sources are consistent on financing scale even though they do not support normal software underwriting.
      Pulse 2.0 reported a roughly $10 billion April 2026 round at about a $38 billion valuation, and multiple June
      2026 summaries then described a $12 billion round at a $41 billion valuation, pushing disclosed capital above
      $18 billion (CI001, CI002, CI003, CI011). What is missing is the operating denominator. April coverage said the
      company had released no products, published no research, and generated no revenue, while June commentary still
      referenced no public revenue, no product timeline, and no customer deployments (CI004, CI005). That leaves the
      balance-sheet story legible but the business itself largely unpriced by public fundamentals.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI011]
  - id: monetization-surface
    title: Public monetization evidence stops at a generic subscription label
    body: >-
      The strongest public monetization signal is that profile sites classify Prometheus as a B2B subscription
      business serving engineering and manufacturing buyers, but they do not publish a list price, pricing metric,
      contract template, or revenue-recognition policy (CI006, CI014). EquityZen's public page is useful mostly as a
      disclosure limit: it advertises private-market access while placing detailed revenue and financial data behind a
      gated investor workflow, and the Silicon Valley Invest Club tear sheet likewise says revenue and profitability are
      not publicly disclosed (CI007, CI008, CI009). Even the obvious prometheus.io web property is an unrelated
      monitoring product site, which reinforces that management has not supplied a clearly attributable first-party
      pricing or investor-relations surface in the assigned public pool (CI016).
    claimRefs: [CI006, CI007, CI008, CI009, CI014, CI016]
    tableRefs: [TI001, TI002]
  - id: unit-economics-and-runway
    title: Runway looks ample, but burn and margin path remain opaque
    body: >-
      The public record points to financing strength rather than financial efficiency. More than $18 billion of
      reported capital gives Prometheus a large runway buffer relative to most startups, and the separate
      manufacturing-asset vehicle discussed in June reporting suggests a strategy that could require even more capital
      than a normal software company (CI003, CI012, CI013). But there is still no public ARR, customer cohort, gross
      margin, services mix, burn, or working-capital disclosure that would allow a sales-efficiency or payback model
      (CI010, CI013, CI015). Investors can see that the company is funded; they still cannot see whether commercial
      traction and cost structure are converging toward a venture-scale software outcome.
    claimRefs: [CI003, CI010, CI012, CI013, CI015]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: verdict-and-blockers
    title: "Financial verdict: low insolvency risk, high underwriting uncertainty"
    body: >-
      Financially, Prometheus should be treated as an exceptionally well-funded but still unproven operating business.
      The adverse evidence is not that the company lacks cash; it is that public reporting still does not show revenue,
      customer proof, margin structure, or contract economics commensurate with a $41 billion valuation (CI010, CI013,
      CI014, CI015). The separate industrial-acquisition narrative may prove strategically valuable, but until
      management provides entity boundaries, intercompany economics, and a revenue bridge, it also complicates any
      clean view of software quality or capital intensity (CI012). Underwriting should therefore focus first on booked
      revenue, gross margin, burn, and contract structure rather than on headline valuation alone.
    claimRefs: [CI010, CI012, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue surfaces and disclosure status
    columns:
      - Surface
      - Mechanism
      - Unit
      - Current public status
      - Quality
      - Diligence ask
    rows:
      - ["Software subscriptions", "B2B subscription model for engineering/manufacturing users", "Contract / subscription", "Publicly labeled as subscription, but no price or revenue disclosed", "Low", "Provide product packaging, price book, and booked ARR by product line"]
      - ["Industrial-asset economics", "Reported separate acquisition or holding vehicle could create economics adjacent to software", "Vehicle / asset program", "Strategic narrative reported, but not disclosed as current Prometheus revenue", "Low", "Clarify legal separation, intercompany charges, and any shared P&L items"]
      - ["Revenue recognition policy", "Recognition basis for licenses, services, milestones, or usage", "Accounting policy", "No public disclosure", "Low", "Provide accounting memo plus sample invoices and recognition timing"]
    notes: "Public sources support only a high-level subscription label plus a reported adjacent asset strategy; all pricing, accounting, and realized revenue details remain private."
    claimRefs: [CI006, CI012, CI014]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Pricing element
      - Public evidence
      - List vs. realized pricing
      - Unknowns / caveats
      - Source implication
    rows:
      - ["List price", "No public price card or pricing page retained in the assigned pool", "Unknown / unknown", "No official price surface in evidence", "Cannot benchmark ACV or entry-point friction"]
      - ["Contract unit", "Subscription is disclosed, but seat, usage, project, and milestone basis are not", "Generic list concept only / realized terms unknown", "Unit economics cannot be normalized", "Blocks revenue-model comparability"]
      - ["Discounting and term", "No public discount, multi-year, or minimum-commitment disclosure", "Unknown / unknown", "Could materially change realized ASP and payback", "Blocks pricing-quality assessment"]
      - ["Secondary liquidity", "EquityZen markets shareholder liquidity access, not company operating revenue", "Secondary share pricing / not operating revenue", "Useful for demand interest, not monetization quality", "Keep cap-table liquidity separate from product revenue"]
    notes: "This table captures what the assigned public pool does and does not show; unknown means not publicly disclosed, not zero."
    claimRefs: [CI006, CI007, CI008, CI014, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Value or public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Total capital raised", "More than $18B reported by June 2026", "Medium", "Creates a large cash buffer relative to early-stage peers", "Reconcile round proceeds to current cash and restricted cash"]
      - ["Latest valuation", "$41B (Jun 2026 reporting)", "Medium", "Sets investor expectations but not operating quality", "Provide board materials supporting the current round valuation"]
      - ["Revenue / ARR", null, "Low", "Without a revenue base, valuation cannot be tested against normal software multiples", "Provide monthly GAAP revenue, ARR bridge, and customer concentration"]
      - ["Gross margin / delivery cost", null, "Low", "Determines whether the model scales like software or like a services/industrial program", "Provide gross margin by product or contract type including compute and support"]
      - ["Burn / runway", "Burn undisclosed; runway cannot be computed from public data despite very large funding", "Low", "Capital dependency depends on spend rate, not just money raised", "Provide 24-month budget, hiring plan, and cash waterfall"]
    notes: "Null values indicate missing public disclosure rather than absent economics."
    claimRefs: [CI002, CI003, CI008, CI010, CI011, CI013, CI015]
