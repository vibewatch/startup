              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU011
              - CU014
      - number: '6.3'
        title: Durability evidence is absent, and search ambiguity raises reference-quality risk
        blocks:
          - type: paragraph
            body: >-
              Two separate issues block confidence on customer durability. First, no source in the assigned pool
              discloses NRR, GRR, churn, renewal rates, contract length, cohort behavior, or top-customer exposure, so
              there is no public basis to underwrite retention or concentration risk. Second, ordinary Prometheus
              customer searches are badly polluted by unrelated entities with the same name: Prometheus Group's
              asset-management software customers, Prometheus Hyperscale's Lumen-backed data-center story, and the
              open-source Prometheus monitoring project's broad adoption all surface as plausible but non-target
              "customer proof." Any future diligence should therefore require customer references that also match the
              Bezos/Bajaj physical-economy context before treating them as valid customer evidence for this company.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is still below reference quality
            body: >-
              The public record supports who Prometheus wants to sell to, but not whether any third-party industrial
              customer has bought, renewed, or expanded a live deployment.
            calloutType: risk
            claimRefs:
              - CU001
