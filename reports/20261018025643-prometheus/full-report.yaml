  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              Prometheus' top-ranked risk is execution against price. Retained April-June 2026 coverage places the
              company at a $38B-$41B valuation after $10B-$12B financings, yet the same evidence still described a
              business that had released no products, published no research, and disclosed no revenue. That forces
              investors to underwrite future delivery rather than current operating proof. A second, less obvious risk
              is evidence quality itself: exact-name Prometheus searches in the assigned pool also returned unrelated
              finance, monitoring, enterprise software, and legacy hardware entities, so ongoing diligence and
              reputation monitoring have a high false-positive burden.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
