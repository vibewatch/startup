  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public sources imply a four-layer stack: scarce industrial data in, engineering AI in the middle, workflow
      applications on top, and a reported operating-data flywheel around the edge.
    data:
      layers:
        - label: Physics substrate
          detail: The most generic knowledge base described in public reporting.
          modules:
            - label: Physics laws
            - label: Physical constraints
          outputs:
            - Base rules for physical-world reasoning
        - label: Industrial data inputs
          detail: Publicly described raw materials beyond general physical reasoning.
          modules:
            - label: Manufacturing testing results
            - label: Material / tolerance / process data
              note: Much of it is described as proprietary and difficult to obtain
          outputs:
            - Training corpus for physical-world models
        - label: Model and reasoning layer
          detail: High-level model function described in public reporting.
          modules:
            - label: AI systems that understand the laws of physics
            - label: Artificial general engineer
          outputs:
            - Physical-system reasoning
        - label: Design tooling layer
          detail: How the public narrative says users would experience the product.
          modules:
            - label: Designing physical objects
            - label: Engineering recommendations
            - label: Design iteration
          outputs:
            - Engineer-facing workflow support
        - label: Workflow application layer
          detail: Publicly named user workflows.
          modules:
            - label: Engineering
            - label: Manufacturing
            - label: Drug design
          outputs:
            - Physical-economy workflow automation
        - label: Sector and data-flywheel layer
          detail: Reported strategic extension around the core product.
          modules:
            - label: Aerospace / logistics / other physical industries
            - label: Manufacturing-transformation vehicle
            - label: Acquire businesses reshaped by physical AI
            - label: Operational data feedback loop
          outputs:
            - Potential proprietary deployment data
    approximationNotes: This map uses public descriptions of layers and dependencies, not a disclosed internal system diagram.
    claimRefs:
      - CE004
      - CE007
      - CE008
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence supports the intended buyer journey more clearly than it supports any verified live deployment.
    data:
      items:
        - label: Engineering buyer identified
          detail: Bezos's public framing says "the engineer is our customer."
          touchpoints:
            - Industrial engineering organization
            - Enterprise R&D or program budget
        - label: Workflow insertion into incumbent tools
          detail: >-
            Prometheus is described as an engineering layer that can sit on top of CAD and simulation software customers
            already run.
          touchpoints:
            - CAD / PLM / simulation stack
            - Engineering optimization workflow
        - label: Case-study proof
          detail: Blue Origin was floated only as a possible case-study customer.
          touchpoints:
            - Bezos-adjacent validation
            - No disclosed production scope
        - label: Compute adjacency
          detail: Amazon was mentioned only as a possible compute customer rather than an end-market user.
          touchpoints:
            - Infrastructure customer
            - Not product adoption proof
        - label: Production manufacturer deployment
          detail: No named design partner, factory customer, or independent production deployment has been disclosed publicly.
          touchpoints:
            - Missing named deployment
            - Missing ROI or renewal evidence
        - label: Expansion / owned-asset loop
          detail: >-
            The reported acquisition-vehicle thesis would expand from software into owned industrial assets, but no
            customer proof for that loop is public yet.
          touchpoints:
            - Data-access thesis
            - Commercial execution unverified
    approximationNotes: >-
      Stages combine stated commercial intent with explicitly missing proof; the map is a diligence view of what is and
      is not evidenced, not a confirmed operating funnel.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU014
