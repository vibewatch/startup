  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The recommendation stays constrained by the gap between financing strength and publicly disclosed operating proof.
    data:
      nodes:
        - id: capital
          label: Capital signal is unusually strong
          detail: $12B closed at $41B in June 2026 after a roughly $38B April mark.
          tone: opportunity
        - id: compute
          label: Proceeds appear aimed at capability building
          detail: TechCrunch says a large portion of the round will go to compute.
          tone: neutral
        - id: proof
          label: Public operating proof is still limited
          detail: No disclosed revenue, named customer proof, or public benchmark bridge is available.
          tone: risk
        - id: comps
          label: Comparable context is incomplete
          detail: Peers exist, but Prometheus lacks disclosed revenue and EV/Rev.
          tone: risk
        - id: price
          label: Existing mark looks stretched
          detail: Public evidence supports observing the $38B-$41B marks, not fully underwriting them.
          tone: risk
        - id: decision
          label: 'Recommendation: research-more'
          detail: Wait for milestone proof or better entry terms before treating valuation as investable.
          tone: warning
      edges:
        - from: capital
          to: compute
          label: Funds near-term scale-up
        - from: compute
          to: proof
          label: Still needs commercial output
        - from: proof
          to: comps
          label: Missing metrics weaken benchmarkability
        - from: comps
          to: price
          label: Limits fair-value support
        - from: price
          to: decision
          label: Drives entry discipline
    approximationNotes: >-
      Interpretive sequence based on disclosed financing facts and missing public operating metrics; not a quantified
      model.
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
