      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The retained sources describe Prometheus as building AI for engineering, manufacturing, and
              drug-design-adjacent workflows rather than low-consequence productivity software. That makes legal and
              regulatory uncertainty more than a theoretical issue. The retained legal analysis argues that AI-generated
              design ownership, product-liability allocation, and high-risk AI oversight all become live questions once
              outputs are used in physical systems. Because the retained public profiles emphasize ambition and capital
              formation rather than concrete compliance credentials, the practical mitigation burden is to verify
              deployment boundaries, human-review controls, insurance structure, and jurisdiction-specific readiness
              before treating regulated-sector expansion as underwritten.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Prometheus is attempting to pair a frontier-model program with a capital-heavy plan to
              acquire or build industrial businesses that can feed proprietary operating data back into its models.
              Retained coverage frames that strategy as a differentiator, but it also introduces integration,
              governance, and balance-sheet risk well before there is public proof of product reliability or
              commercialization. The same evidence points to dependence on outside capital providers and external
              compute, so adverse changes in financing appetite, supplier terms, or acquisition execution would hit both
              model development and the broader industrial-holding thesis at once.
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Diligence gates and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The near-term thesis should be gated by evidence, not narrative. Kill criteria are straightforward: if
              management cannot produce named production deployments, disclosed commercialization metrics, and a
              credible explanation for how compliance and liability are handled in safety-sensitive workflows, the
              current valuation has too little support. Monitoring should also focus on whether the acquisition-vehicle
              concept stays optional or becomes structurally required to justify model performance, because that would
              materially raise execution complexity and capital dependence. Finally, the public-information surface
              needs active disambiguation because routine monitoring of "Prometheus" alone is not a reliable signal of
              company-specific legal or operational change.
            claimRefs:
              - CR003
              - CR007
              - CR010
              - CR012
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core underwritten risk
            body: >-
              The central downside is that public evidence still supports price discovery and ambition more clearly than
              product delivery or monetization.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: Legal readiness is not yet evidenced
            body: >-
              Retained public materials describe high-consequence use cases, but the assigned pool does not contain
              concrete proof of how Prometheus allocates IP, liability, and high-risk AI compliance obligations.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Brand ambiguity is a real diligence cost
            body: >-
              Exact-name monitoring of Prometheus alone is unreliable because the assigned pool also surfaced unrelated
              regulated, open-source, industrial-software, and legacy-hardware entities using the same name.
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Prometheus has already proven that elite capital will finance the company at exceptional size and speed:
              the June 2026 Series B closed at $12 billion and a $41 billion valuation after earlier April reporting
              pointed to a roughly $38 billion mark. That financing strength matters, but the same public record still
              leaves core underwriting inputs thin. As of the disclosed 2026 evidence, Prometheus had not publicly shown
              revenue, customer traction, product benchmarks, or a clean comp-based valuation bridge; even the
              company-specific details of what was already built were described as under wraps. The practical call is
              therefore research-more with high risk and a stretched valuation stance: investors can respect the capital
              formation signal without treating it as proof that the current price is fundamentally supported.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Financing context, dilution clues, and valuation support
        blocks:
          - type: paragraph
            body: >-
              The clearest observable valuation facts are financing marks rather than operating fundamentals. TechCrunch
              and follow-on coverage place the company at $41 billion in June 2026, while April reporting described a
              $10 billion round at roughly $38 billion and total committed capital above $16 billion before the later
              close was revised upward to $18.2 billion. A Silicon Valley Invest Club tear sheet adds one of the few
              public cap table clues by estimating that the June round sold about 29% of the company and explicitly
              noting that the full shareholder register is not public. That is enough to say valuation rose quickly and
              dilution has likely been meaningful even before employee equity expansion, but not enough to underwrite
              preference overhang, liquidation stack, or exact downside protection for a new investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
      - number: '8.3'
        title: Thesis, anti-thesis, and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case is easy to state: Jeff Bezos has committed extraordinary capital, institutional investors
              joined the round, and management is targeting a large physical-engineering opportunity that could justify
              unusually high upfront compute and talent spend if product-market fit arrives. The anti-thesis is that
              public evidence still shows a company with no disclosed revenue, no public product benchmark, and no
              announced customer proof that would let outsiders test whether $38 billion to $41 billion is a rational
              entry point rather than a momentum mark. Multiples does provide a comparable list that includes OpenAI,
              Anthropic, Z.ai, and Snowflake, but that same record keeps Prometheus revenue and EBITDA undisclosed, so a
              clean revenue-multiple bridge is unavailable. A separate Tracxn result for “Prometheus” resolves to
              Prometheus Fuels rather than the Bezos-led AI company, illustrating why name-only database matches should
              be excluded from valuation work. The right analytical posture is to use verified peer references only as
              context for category appetite, not as enough evidence to bless the current price.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Scenario framing, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario work has to stay milestone-based because public disclosures do not provide the normal ingredients
              for precision underwriting. A bull case can defend or exceed the June 2026 mark only if Prometheus turns
              its funding edge into visible commercial evidence: product release, named deployments, revenue disclosure,
              and proof that compute-heavy spending is producing enterprise value rather than only experimentation. The
              base case is that the company remains strategically interesting but not yet ready for a price-taking buy
              decision, which points to further diligence and a willingness to wait for either better proof or better
              entry terms. The bear case is a down-round or marked-down secondary if the company reaches the next
              financing without public customer, revenue, or benchmark support. That also defines exit readiness: the
              company may become compelling later, but current public evidence is still too thin to anchor a confident
              hold or return target.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: respect the round, do not chase the price'
            body: >-
              Prometheus merits continued diligence because the company has assembled an unusual mix of founder capital,
              institutional backing, and ambition, but the current public record does not support treating the June 2026
              mark as obviously investable.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
          - type: callout
            title: Most important downside
            body: >-
              The clearest downside is a valuation reset triggered by a new financing or secondary event before
              Prometheus discloses product, customer, or revenue proof that outsiders can benchmark.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
          - type: callout
            title: What would move the view
            body: >-
              The case improves materially if the company publishes credible evidence on deployments, revenue, product
              benchmarks, and capital structure rather than relying on financing headlines alone.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV009
              - CV012
