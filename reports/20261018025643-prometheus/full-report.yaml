  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on retained evidence: Prometheus scores high on workflow ambition but low on disclosed
      distribution, while incumbents score highest on embedded workflow control.
    data:
      xAxis:
        label: Workflow specificity (1=broad AI platform, 5=deep engineering workflow presence)
        min: 1
        max: 5
        lowLabel: Broad platform
        highLabel: Engineering workflow depth
      yAxis:
        label: Distribution / installed-base leverage (1=limited disclosed reach, 5=embedded incumbent reach)
        min: 1
        max: 5
        lowLabel: Limited disclosed reach
        highLabel: Embedded reach
      points:
        - label: Prometheus
          x: 4
          'y': 1
          detail: High public ambition around physical-world engineering; low disclosed commercial distribution.
        - label: OpenAI
          x: 2
          'y': 3
          detail: Broad frontier AI reach and talent pull, but retained sources do not show engineering-suite depth.
        - label: Anthropic
          x: 2
          'y': 2
          detail: Enterprise model competitor with limited retained evidence on engineering workflow ownership.
        - label: xAI
          x: 2
          'y': 2
          detail: Frontier model competitor competing on capability and technical talent.
        - label: Siemens DISW
          x: 5
          'y': 5
          detail: Incumbent engineering workflow control and global account reach.
        - label: Autodesk
          x: 4
          'y': 4
          detail: Strong design-tool footprint with closer overlap to engineering workflows than frontier labs.
    approximationNotes: >-
