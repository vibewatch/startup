  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, churn, renewal, cohort, and contract-length metrics by customer segment.
      whyItMatters: Without durability data, customer lifetime value and product stickiness cannot be underwritten.
      diligencePath: Request cohort retention and renewal data from management, segmented by vertical and deployment stage.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: At least three independently verifiable third-party production deployments with scope, timing, and outcomes.
      whyItMatters: A buyer list without third-party validation does not establish that Prometheus works in live industrial workflows.
      diligencePath: Ask management for reference calls, public case studies, or procurement records tied to named customers.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, channel mix, and dependence on Bezos-affiliated entities or captive deployments.
      whyItMatters: Concentration and related-party demand could make early traction look stronger than it is.
      diligencePath: Request revenue concentration, channel mix, and any related-party customer disclosures.
