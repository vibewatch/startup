company:
  name: Prometheus
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence for Prometheus remains thesis-level rather than deployment-level.
    Management positioning makes clear that industrial engineering teams are the intended buyer,
    but the assigned source pool does not disclose a named third-party production customer,
    retention metric, or concentration profile.
sections:
  - id: target-buyer-and-commercial-shape
    title: Target buyer is legible, but customer segmentation is still management-led
    body: >-
      The clearest customer signal in the assigned pool is positioning, not adoption. Coverage
      of Bezos and Bajaj's June 2026 launch framing says the product is meant for engineering
      organizations that design complex physical systems, with enterprise value tied to
      shortening design and simulation cycles inside incumbent CAD, PLM, and simulation
      workflows. That suggests a high-ACV enterprise motion aimed at aerospace, semiconductor,
      industrial manufacturing, and drug-design teams rather than a broad self-serve software
      market. What remains missing is the bridge from target account theory to live account
      evidence: no source in the pool discloses pricing, signed design partners, deployment
      volumes, or a named customer roster that would prove which of those segments has actually
      converted.
    claimRefs: [CU002, CU003, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-customer-proof-and-adoption
    title: Named customer proof is thin and still short of production validation
    body: >-
      The customer-proof surface is notably weak for a company valued at $41 billion. The most
      direct third-party characterization in the assigned pool says Prometheus had "no public
      product, no named customer and a deliberately thin footprint" at the June 2026 Series B
      announcement, while other coverage said commercial traction and active customer pilots had
      not been established publicly. Bezos reportedly floated Blue Origin only as a possible case
      study customer, and AI Weekly separately mentioned Amazon only as a potential compute
      customer, which is infrastructure adjacency rather than proof that an external industrial
      buyer has deployed the engineering product. Public product availability, revenue, and
      revenue quality were also undisclosed, so adoption trajectory has to be treated as unproven
      rather than merely undisclosed.
    claimRefs: [CU001, CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
  - id: durability-concentration-and-reference-quality
    title: Durability evidence is absent, and search ambiguity raises reference-quality risk
    body: >-
      Two separate issues block confidence on customer durability. First, no source in the
      assigned pool discloses NRR, GRR, churn, renewal rates, contract length, cohort behavior,
      or top-customer exposure, so there is no public basis to underwrite retention or
      concentration risk. Second, ordinary Prometheus customer searches are badly polluted by
      unrelated entities with the same name: Prometheus Group's asset-management software
      customers, Prometheus Hyperscale's Lumen-backed data-center story, and the open-source
      Prometheus monitoring project's broad adoption all surface as plausible but non-target
      "customer proof." Any future diligence should therefore require customer references that
      also match the Bezos/Bajaj physical-economy context before treating them as valid customer
      evidence for this company.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Aerospace and defense engineering teams
        - Buyer and user appear to be design and simulation engineers; payer would likely be enterprise R&D or program owners
        - Compress physical-design cycles for aircraft, engines, and other safety-critical systems
        - Sector named repeatedly in third-party coverage, but no named customer disclosed
        - Potential multimillion-dollar enterprise software seat or workflow value if time-to-design claims hold
        - No public account name, contract scope, or production outcome
      - - Semiconductor and advanced hardware teams
        - Engineering organizations using CAD, simulation, and manufacturing workflows
        - Design optimization for chips and other complex physical products
        - Coverage positions Prometheus against existing engineering-stack incumbents, not against consumer AI
        - Could anchor workflow expansion if embedded in incumbent tooling
        - No evidence that any chip or hardware company is live
      - - Industrial manufacturing enterprises
        - Engineering leads and manufacturing operations with proprietary process data
        - Simulation, optimization, and manufacturing-design improvement
        - Reported acquisition-vehicle thesis implies interest in manufacturers as data-rich accounts
        - Strategic value could include software spend plus privileged data access
        - No named design partner or portfolio company has been disclosed
      - - Drug-design and medical-device teams
        - Scientists and engineers working on physical-economy R&D workflows
        - Physical-system or molecule design assistance
        - Public profiles mention drug design as a target domain, but without customer proof
        - Opens a second vertical beyond heavy industry if models generalize
        - No named pharma or medtech reference customer
    notes: >-
      Segment rows synthesize management positioning from third-party coverage; they are target
      markets, not verified active customer cohorts.
    claimRefs: [CU002, CU003, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Named external customers
        - None publicly disclosed
        - 2026-06
        - Substack and AI Weekly
        - Medium
        - Customer proof is still below production-reference quality
        - Total accounts and pipeline not disclosed
      - - Named product pilots
        - Not publicly established
        - 2026-06
        - AI Weekly
        - Medium
        - Commercial readiness remains unverified
        - Pilot count and conversion rates not disclosed
      - - Public product availability
        - No public product disclosed
        - 2026-04 to 2026-06
        - Pulse2 and Substack
        - Medium
        - Adoption may still be pre-launch or highly private
        - Release status by segment not disclosed
      - - Revenue / profitability disclosure
        - None disclosed publicly
        - 2026-04 to 2026-08
        - Pulse2 and SVIC tear sheet
        - Medium
        - There is no public monetization baseline for retention analysis
        - ARR, bookings, GM, and burn all missing
      - - Workforce scale
        - 120 employees on 2026-06-11; later coverage said around 150
        - 2026-06 to 2026-08
        - AI Weekly and SVIC tear sheet
        - Medium
        - Hiring scale is visible, but customer productivity per employee is not
        - Revenue per employee and quota-carrying headcount missing
      - - Named design partner / acquisition partner
        - None publicly named
        - 2026-06
        - Substack
        - Medium
        - Expansion thesis into owned or partnered industrial assets is still conceptual
        - Partner funnel and close dates not disclosed
    notes: >-
      Values record only what the assigned public pool made explicit; "none disclosed" should not
      be read as evidence that the company lacks customers, only that public proof was absent.
    claimRefs: [CU001, CU005, CU006, CU007, CU012, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Blue Origin
        - Bezos-adjacent aerospace context
        - Floated only as a possible case-study customer
        - Unverified
        - Suggests a plausible first proof domain
        - Not disclosed as a paying production deployment
      - - Amazon
        - Infrastructure adjacency
        - Mentioned only as a potential compute customer
        - Unverified
        - Shows possible infrastructure demand rather than product demand
        - Does not prove an end-market engineering user adopted the product
      - - No independent third-party customer publicly named
        - Industrial buyer base unknown
        - No public design partner or reference customer identified in the pool
        - Unverified
        - Reinforces that customer evidence is still thesis-level
        - Prevents validation of production status, ROI, and reference quality
    notes: >-
      The pool did not provide three independently verifiable production deployments, so this
      table enumerates the explicit names or absences that were actually observable in public.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates only explicit customer or customer-adjacent names visible in the assigned
        public pool from April to August 2026; it is not a full customer census.
    claimRefs: [CU001, CU004, CU005, CU011, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports the intended buyer journey more clearly than it supports any
      verified live deployment.
    data:
      items:
        - label: Engineering buyer identified
          detail: Bezos's public framing says "the engineer is our customer."
          touchpoints:
            - Industrial engineering organization
            - Enterprise R&D or program budget
        - label: Workflow insertion into incumbent tools
          detail: Prometheus is described as an engineering layer that can sit on top of CAD and simulation software customers already run.
          touchpoints:
            - CAD / PLM / simulation stack
            - Engineering optimization workflow
        - label: Case-study proof
          detail: Blue Origin was floated only as a possible case-study customer.
          touchpoints:
            - Bezos-adjacent validation
            - No disclosed production scope
        - label: Compute adjacency
          detail: Amazon was mentioned only as a possible compute customer rather than an end-market user.
          touchpoints:
            - Infrastructure customer
            - Not product adoption proof
        - label: Production manufacturer deployment
          detail: No named design partner, factory customer, or independent production deployment has been disclosed publicly.
          touchpoints:
            - Missing named deployment
            - Missing ROI or renewal evidence
        - label: Expansion / owned-asset loop
          detail: The reported acquisition-vehicle thesis would expand from software into owned industrial assets, but no customer proof for that loop is public yet.
          touchpoints:
            - Data-access thesis
            - Commercial execution unverified
    approximationNotes: >-
      Stages combine stated commercial intent with explicitly missing proof; the map is a
      diligence view of what is and is not evidenced, not a confirmed operating funnel.
    claimRefs: [CU002, CU003, CU004, CU005, CU014]
callouts:
  - calloutType: risk
    title: Customer proof is still below reference quality
    body: >-
      The public record supports who Prometheus wants to sell to, but not whether any third-party
      industrial customer has bought, renewed, or expanded a live deployment.
    claimRefs: [CU001, CU005, CU012, CU013]
