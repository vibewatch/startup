company:
  name: Prometheus
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Prometheus is publicly framed as a physical-economy AI company aimed at engineering,
    manufacturing, and adjacent scientific design rather than a narrow enterprise-software
    category. The strongest relevant public sizing lens in the assigned evidence is a
    third-party AI-in-manufacturing estimate inside a vast manufacturing base, but the
    company has not publicly disclosed a segment-specific SAM/SOM, buyer budget, or customer
    wedge. Open-web keyword results are also contaminated by unrelated "Prometheus"
    observability and maintenance-software markets, so generic name-matched TAM reports are
    not usable as direct valuation anchors.
sections:
  - id: market-boundary
    title: Market boundary is physical-engineering AI, not generic "Prometheus" software
    body: >-
      Prometheus is described in the assigned current sources as a physical-economy or
      industrial-AI company, not as a generic enterprise copilot. Pulse 2.0 says the company
      is building AI systems that understand the laws of physics for engineering,
      manufacturing, and other physical industries, while AI Weekly and the August 2026 tear
      sheet frame the ambition as an "artificial general engineer" for designing physical
      objects. That boundary implies the relevant spend sits in engineering design,
      simulation, advanced manufacturing transformation, and adjacent scientific design
      budgets. It does not justify importing unrelated categories that merely share the
      Prometheus name. Search ambiguity is material: the same keyword also surfaces the
      open-source Prometheus monitoring project, Prometheus Group's asset-management software,
      and older Prometheus Products hardware pages. Those namesakes matter as evidence-quality
      warnings, not as direct market comparables.
    claimRefs: [CM001, CM002, CM003, CM013, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Relevant market sizing is broad; Prometheus-specific SAM/SOM is undisclosed
    body: >-
      The only directly relevant numeric lens in the assigned pool is the third-party
      AI-in-manufacturing estimate cited by Pulse 2.0: around $34 billion in 2025,
      expanding to roughly $155 billion by 2030, within a much broader $16.8 trillion
      global manufacturing base where AI penetration remains below 1%. That framing
      supports a very large long-run ceiling but not a diligence-grade Prometheus SAM or
      SOM. No retained source isolates the company's initial wedge by workflow, geography,
      price point, or customer segment. Meanwhile, keyword-matched "Managed Prometheus
      Services" reports produce much smaller observability-market estimates and even
      disagree with one another. Because those reports concern cloud monitoring around the
      open-source Prometheus stack, they are useful only as evidence of name-collision
      noise and failed sizing paths, not as valid valuation anchors for Prometheus.ai.
    claimRefs: [CM004, CM005, CM009, CM011, CM012, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-constraints
    title: Buyer budgets could be large, but adoption looks slow and high-friction
    body: >-
      Public descriptions suggest buyers sit where engineering-cycle compression is worth
      strategic spend: advanced design programs in aerospace and defense, chipmaking and
      industrial manufacturing, plus scientific R&D such as drug design. The likely users
      are engineers, simulation teams, process experts, and research specialists, while
      the payer could shift between R&D, engineering, operations-transformation, or
      corporate investment vehicles depending on whether Prometheus sells software, pilots
      with design partners, or embeds inside acquired industrial assets. The same evidence
      also highlights adoption constraints. Physical AI requires proprietary data on
      material behavior, engineering tolerances, and industrial processes, and the
      assigned coverage still shows no disclosed product, revenue, or named customer
      proof. That combination argues for large eventual budgets if the product works, but
      a slower and harder commercialization path than standard application-AI software.
    claimRefs: [CM006, CM007, CM008, CM010, CM015]
    tableRefs: [TM003]
