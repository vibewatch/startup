  topStrengths:
    - 长期深耕 Maven Central，在企业依赖控制领域占据稳固位置。
    - 在受监管企业客户和供应链治理场景中拥有扎实的商业覆盖。
    - Nexus 平台覆盖仓库、生命周期、Firewall 和 SBOM 工作流，产品面广。
  topRisks:
