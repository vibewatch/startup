    - 留存、合同期限和各产品线的经济性缺乏公开透明度。
    - 超大规模云厂商和 DevSecOps 套件的打包平台可能压缩定价能力。
    - 公开证据无法完整拆分 ARR、收入结构、利润率贡献和公共部门敞口。
  unresolvedGaps:
    - 当前债务、净现金和任何发起方遗留负担均未公开披露。
    - NRR、GRR、流失率和合同期限仍未披露。
    - 公开证据无法清晰拆分各模块的 ARR、GAAP 收入、产品结构或毛利率贡献。
    - 较新的 Nexus One 模块在付费采用和续约韧性上仍不如仓库类用例，公开验证也更少。
    - 公共部门收入结构和续约质量披露不足，尚无法判断集中度风险。
