figures:
  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: Commercial conversion path from open-source Maven Central telemetry and free repository usage into paid multi-product enterprise subscriptions and platform expansion.
    data:
      nodes:
        - label: 1. Open Source Ingress
          detail: Maven Central ecosystem hosting 1.233M+ indexed packages and driving 9.8T registry downloads.
        - label: 2. Developer & Repository Adoption
          detail: Nexus Repository OSS deployed across 15M+ developers as artifact storage and build infrastructure.
        - label: 3. Policy Ingress & Repository Firewall
          detail: Point-of-ingress automated quarantine blocking malicious packages and policy violations.
        - label: 4. Lifecycle Governance & Compliance
          detail: Continuous software composition analysis (SCA) and policy remediation across active applications.
        - label: 5. Multi-Product Platform Bundling
          detail: Bundled packaging of Repository Pro/Enterprise, Lifecycle, Firewall, and SBOM Manager.
        - label: 6. Enterprise Expansion & Services
          detail: Annual subscriptions ($50k-$300k+ ACV) with 10-20% premium support tiers and professional services.
      edges:
        - from: 1. Open Source Ingress
          to: 2. Developer & Repository Adoption
        - from: 2. Developer & Repository Adoption
          to: 3. Policy Ingress & Repository Firewall
        - from: 3. Policy Ingress & Repository Firewall
          to: 4. Lifecycle Governance & Compliance
        - from: 4. Lifecycle Governance & Compliance
          to: 5. Multi-Product Platform Bundling
        - from: 5. Multi-Product Platform Bundling
          to: 6. Enterprise Expansion & Services
    approximationNotes: Flow illustrates observed customer monetization architecture; individual stage conversion rates and contract tier mix are private and not disclosed.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI007
      - CI008
      - CI013
callouts:
  - calloutType: risk
    title: Private Equity Debt and Retention Opacity Limit Underwriting Confidence
    body: Because Sonatype operates under Vista Equity Partners private equity ownership without public debt, cash, NRR, or churn disclosures, investors cannot reliably underwrite equity value, leverage coverage, or net expansion velocity without private data room access.
    claimRefs:
      - CI011
      - CI012
  - calloutType: insight
    title: High Average Contract Values Driven by Bundled Platform Expansion
    body: Observed contract benchmarks demonstrate significant expansion leverage as mid-sized buyers commit $50,000 to $150,000 annually and large enterprise deployments exceed $250,000 to $500,000 by bundling Repository, Lifecycle, and premium support tiers.
    claimRefs:
      - CI003
      - CI004
      - CI007
