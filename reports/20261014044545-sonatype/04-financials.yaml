  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics-and-retention
      missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), annual customer churn rate, and module-specific attach rates for Firewall and SBOM Manager.
      whyItMatters: Without retention and churn data, it is impossible to evaluate whether the $50k-$150k+ ACV contracts reflect durable compounding recurring revenue or require heavy replacement sales effort.
      diligencePath: Request historical cohort retention schedules, gross renewal rates by contract cohort, and module attach analysis from Sonatype management under NDA.
      relatedQuestionRefs:
        - QI007
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: capital-structure-and-debt
      missingEvidence: Current debt principal, credit facility drawdown, interest coverage, cash on balance sheet, and sponsor preference overhang under Vista Equity Partners.
      whyItMatters: Enterprise value cannot be translated into equity value without visibility into debt obligations, sponsor debt leverage, and capital adequacy.
      diligencePath: Obtain debt schedule, credit facility compliance certificates, and audited balance sheet from the private equity sponsor.
      relatedQuestionRefs:
        - QI006
        - QI007
      relatedTableRefs:
        - TI003
