callouts:
  - calloutType: risk
    title: Private Equity Debt Overhang and Capital Opacity
    body: >-
      Sonatype has been backed by Vista Equity Partners since November 2019 without public disclosure of its balance
      sheet debt, interest burdens, or sponsor fees. In a higher-for-longer interest rate environment, debt servicing
      can constrain R&D reinvestment and depress equity returns even if top-line revenue expands.
    claimRefs:
      - CR005
      - CR012
  - calloutType: insight
    title: AI-Driven Acceleration of Software Dependency Vulnerabilities
    body: >-
      The adoption of generative AI coding assistants and autonomous agents introduces machine-speed dependency
      consumption into development pipelines. While this increases the demand for automated ingestion firewalls like
      Nexus One, it simultaneously elevates vulnerability blast radiuses and malicious package hallucination risks
      across enterprise codebases.
    claimRefs:
      - CR002
      - CR003
      - CR014
