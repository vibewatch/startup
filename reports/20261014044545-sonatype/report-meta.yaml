companyProfile:
  summary: >-
    Sonatype is a late-stage private software supply chain security vendor founded in 2008 in Fulton, Maryland by Jason
    Van Zyl, the creator of Apache Maven. The company's Nexus platform and Maven Central stewardship make it a control
    point for enterprise dependency intake, policy enforcement, SBOM workflows, and malware prevention across regulated
    buyers.
