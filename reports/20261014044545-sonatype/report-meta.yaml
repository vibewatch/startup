  topStrengths:
    - Deep stewardship of Maven Central and a durable enterprise dependency-control position.
    - Strong commercial footprint across regulated enterprise buyers and supply-chain governance use cases.
    - Broad Nexus platform surface spanning repository, lifecycle, firewall, and SBOM workflows.
  topRisks:
    - Sponsor debt, capital structure, and cash generation remain undisclosed under private-equity ownership.
    - Retention, contract duration, and product-line economics are not publicly transparent.
    - Bundled platforms from hyperscalers and DevSecOps suites could compress pricing power.
    - Public evidence does not fully separate ARR, revenue mix, margin contribution, or public-sector exposure.
  unresolvedGaps:
    - Current debt, net cash, and any sponsor overhang are not publicly disclosed.
    - NRR, GRR, churn, and contract duration remain undisclosed.
    - Public evidence does not cleanly separate ARR, GAAP revenue, product mix, or gross-margin contribution by module.
    - Paid adoption and renewal durability for newer Nexus One modules remain thinner than for repository use cases.
    - Public-sector mix and renewal quality are not visible enough to judge concentration risk.
