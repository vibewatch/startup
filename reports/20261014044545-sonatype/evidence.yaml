evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current sponsor valuation, debt facilities, net cash, and preferred equity overhang under Vista Equity Partners.
    whyItMatters: >-
      Enterprise value cannot be translated into equity value without visibility into debt covenants and sponsor capital
      structure.
    diligencePath: >-
      Review private credit and syndicated debt filings or request audited sponsor capitalization disclosures during
      confidential diligence.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited GAAP annual recurring revenue, net revenue retention (NRR), gross retention, and product gross margins
      across Nexus modules.
    whyItMatters: >-
      Reported revenue figures ($115M to $150M) are based on commercial estimates rather than audited GAAP subscription
      disclosures.
    diligencePath: >-
      Request confidential sponsor financial presentations covering GAAP ARR breakdown, cohort retention, and
      module-level gross margins.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: private-equity-financial-transparency
    missingEvidence: >-
      Audited standalone ARR, Net Revenue Retention (NRR), module attach rates, and debt capitalization details for
      Sonatype under Vista Equity Partners ownership.
    whyItMatters: >-
      Without verified product-line ARR and retention disclosure, market sizing and SOM conversion cannot be isolated
      from historical sponsor estimates.
    diligencePath: >-
      Request sponsor financial packages, lender presentations, and segmented revenue disclosures during formal
      management diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-win-loss-ratios
    missingEvidence: >-
      Audited head-to-head win/loss ratios, churn data, and displacement metrics between Sonatype Nexus and JFrog/Snyk
      in enterprise accounts.
    whyItMatters: >-
      Without segmented win/loss data, it is difficult to determine whether Sonatype is losing net-new SCA deals to
      GitHub Advanced Security or maintaining stable gross retention.
    diligencePath: >-
      Request customer renewal cohort retention, gross churn rates, and RFP displacement logs segmented by competitive
      vendor from management during commercial diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-retention
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), annual customer churn rate, and
      module-specific attach rates for Firewall and SBOM Manager.
    whyItMatters: >-
      Without retention and churn data, it is impossible to evaluate whether the $50k-$150k+ ACV contracts reflect
      durable compounding recurring revenue or require heavy replacement sales effort.
    diligencePath: >-
      Request historical cohort retention schedules, gross renewal rates by contract cohort, and module attach analysis
      from Sonatype management under NDA.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-structure-and-debt
    missingEvidence: >-
      Current debt principal, credit facility drawdown, interest coverage, cash on balance sheet, and sponsor preference
      overhang under Vista Equity Partners.
    whyItMatters: >-
      Enterprise value cannot be translated into equity value without visibility into debt obligations, sponsor debt
      leverage, and capital adequacy.
    diligencePath: >-
      Obtain debt schedule, credit facility compliance certificates, and audited balance sheet from the private equity
      sponsor.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: revenue-run-rate-discrepancy
    missingEvidence: >-
      Reconciliation between third-party private market revenue estimates ($115M from CheckThat.ai vs prior report $150M
      ARR estimate) and verified GAAP recognized revenue.
    whyItMatters: >-
      Growth trajectory, valuation multiples, and operational efficiency metrics diverge significantly depending on
      whether base recurring revenue is $115M or $150M.
    diligencePath: Request trailing-twelve-month GAAP revenue and ending ARR bridge breakdown from company financial disclosures.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Module-level uptime, latency, throughput, recovery, false-positive, false-negative, and production incident data
      segmented by managed and customer-operated deployments.
    whyItMatters: >-
      Without measured operating evidence, investors cannot distinguish a coherent product architecture from dependable
      performance at enterprise scale.
    diligencePath: >-
      Request audited service metrics, recent incident postmortems, architecture review materials, and three customer
      references covering both managed and self-hosted deployments.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current independent assurance artifacts covering security controls, product testing, data handling, and the scope
      of certifications across modules.
    whyItMatters: >-
      Preventive security claims require evidence that controls operate effectively and that customer data and build
      workflows are protected.
    diligencePath: >-
      Obtain current audit reports, penetration-test summaries, certification scope statements, trust-center evidence,
      and remediation records directly from Sonatype.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Audited net revenue retention (NRR), gross retention rate (GRR), logo churn, and contract duration cohorts across
      enterprise customers.
    whyItMatters: >-
      Without public cohort disclosure, it is impossible to verify whether the 600 reported new customers in 2025 expand
      over time or whether seat churn offsets new logo acquisition.
    diligencePath: >-
      Request confidential sponsor retention schedules, multi-year cohort retention tables, and churn breakdowns from
      management during diligence.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Breakdown of top 10/20 customer concentration by percentage of ARR, public-sector vs. commercial contract value,
      and renewal contract terms.
    whyItMatters: >-
      High concentration among major financial institutions or federal government entities could expose Sonatype to
      procurement freezes, budget reallocations, or single-account contract shocks.
    diligencePath: >-
      Request customer concentration revenue schedule, public sector contract renewal dates, and government procurement
      vehicle allocations.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: pe-debt-capital-structure
    missingEvidence: >-
      Audited financial disclosure detailing Sonatype's current debt obligations, net leverage ratios, interest service
      coverage, and sponsor covenant terms under Vista Equity Partners.
    whyItMatters: >-
      Without debt and capital structure disclosures, equity investors cannot determine how much enterprise value is
      consumed by senior debt or evaluate refinancing risks.
    diligencePath: >-
      Request audited balance sheets, credit agreement schedules, debt amortization terms, and sponsor management fee
      agreements under NDA during confirmatory diligence.
    relatedQuestionRefs:
      - QR003
  - type: missing-source
    severity: material
    topic: public-sector-contract-concentration
    missingEvidence: >-
      Exact ARR breakdown, customer concentration ratios, and renewal rates across federal government and defense
