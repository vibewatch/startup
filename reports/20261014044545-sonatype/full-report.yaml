chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2008 in Fulton, Maryland by Jason Van Zyl—the original creator of Apache Maven—Sonatype
              operates as a foundational control plane for enterprise software supply chain security and automated
              open-source governance. The company established its primary industry defensibility through the long-term
              stewardship of Maven Central alongside the widespread adoption of Nexus Repository, which serves as an
              enterprise system of record for developer artifacts across dozens of package formats [CO001, CO002].
              Rather than positioning solely as a downstream vulnerability scanner, Sonatype's commercial business model
              centers on subscription software licensing for its integrated Nexus platform, encompassing Nexus
              Repository Pro, Nexus Lifecycle, Nexus Firewall, and the newly consolidated Nexus One platform [CO003].
              These commercial tiers govern software ingestion, block malicious dependencies at perimeter boundaries,
              enforce internal license compliance, and generate automated software bills of materials (SBOMs) for highly
              regulated enterprises across banking, defense, and healthcare [CO004].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO007
              - CO009
