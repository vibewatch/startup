  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Sonatype delivers controls for the path by which external and internally produced software components
              enter, move through, and are documented inside an enterprise development environment. Independent
              descriptions consistently identify repository management, dependency analysis, malware protection,
              software-composition analysis, and license compliance as the core jobs. The official product overview
              broadens that surface into Nexus Repository, Repository Firewall, Lifecycle, Guide, SBOM Manager,
              Developer, and an Advanced Legal Pack. The 2026 Nexus One announcement organizes five of those
              capabilities into a single control-plane narrative: select components, block unsafe inputs, maintain a
              system of record, remediate policy violations, and produce evidence about application contents. This is a
              coherent workflow proposition, but public materials do not establish equal maturity or commercial adoption
              across every module.
            claimRefs:
