  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Adoption and expansion journey from Maven Central open-source ingestion to enterprise-wide policy enforcement and
      SBOM compliance.
    data:
      items:
        - label: Open-Source Discovery
          user: Individual Developers
          touchpoints:
            - Maven Central repository search
            - IDE dependency resolution
            - Direct component downloads
          action: Developers pull open-source components into initial application builds
          expansionLoop: Unmanaged dependency sprawl creates enterprise visibility and security risk
        - label: Repository Ingestion
          user: DevOps & Build Engineers
          touchpoints:
            - Nexus Repository Manager
            - CI/CD pipeline integration
            - Internal proxy caching
          action: Centralizes artifact staging and binary management across development teams
          expansionLoop: Deployment across teams exposes security and compliance vulnerabilities in incoming packages
        - label: Perimeter Prevention
          user: AppSec Engineers
          touchpoints:
            - Nexus Repository Firewall
            - Automated package inspection rules
            - Quarantine releases
          action: Blocks known malicious packages and policy-violating components at the perimeter
          expansionLoop: Demonstrated threat blocking justifies broader automated lifecycle policy enforcement
        - label: Continuous Lifecycle Policy
          user: Security & Compliance Teams
          touchpoints:
            - Sonatype Lifecycle
            - Automated SCA scanning
            - IDE and PR policy remediation guidance
          action: Monitors applications in production, triggers vulnerability remediation, and tracks component quality
          expansionLoop: Deep pipeline integration establishes enterprise-wide DevSecOps governance standards
        - label: Enterprise Governance & Audit
          user: CISO & Legal Officers
          touchpoints:
            - SBOM Manager
            - Regulatory compliance reports
            - Software transparency attestations
          action: Generates comprehensive Software Bills of Materials and verifies software supply chain integrity
          expansionLoop: Executive and regulatory mandates lock in multi-year platform contracts and expansion
        - label: Agentic AI Dependency Control
          user: Enterprise Architects
          touchpoints:
            - Nexus One AI package guidance
            - Model artifact governance
            - Agentic workflow guardrails
          action: Enforces automated trust and component verification on AI-generated and agent-selected dependencies
          expansionLoop: Accelerating AI coding adoption expands subscription scope across newer AI workflows
