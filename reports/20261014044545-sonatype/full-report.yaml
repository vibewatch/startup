      - number: '6.3'
        title: Named Account Deployments and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Documented customer references confirm Sonatype's penetration across tier-one institutions with complex,
              multi-site development environments. In the financial services sector, global banking giant BNP Paribas
              relies on Sonatype to govern software component integrity and standardize repository policies across
              global engineering operations. In the public sector, the United States Patent and Trademark Office and
              multiple defense organizations utilize Sonatype's air-gapped capabilities to ensure strict regulatory
              compliance and safeguard sensitive government software supply chains. In industrial manufacturing, global
              instrumentation leader Endress + Hauser deploys Sonatype to manage open-source dependencies and eliminate
              licensing liabilities across embedded software applications. These named accounts reflect multi-year
              production deployments rather than speculative pilot tests, demonstrating Sonatype's mission-critical role
              in enterprise release pipelines. Recognized by Gartner as a Leader in the 2026 Magic Quadrant for Software
              Supply Chain Security, Sonatype maintains an established brand presence, although public disclosures omit
              individual customer contract sizes, module attach rates, and multi-year commitment terms.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU010
              - CU013
