      - number: '3.2'
        title: Competitor Profiles, Packaging Models, and Buying Criteria
        blocks:
          - type: paragraph
            body: >-
              Commercial evaluation across the competitive set reflects marked divergence in packaging, licensing
              metrics, and strategic positioning. Sonatype operates a hybrid pricing structure that prices Nexus
              Repository Pro on user-seat tiers and high-availability instances while scoping Nexus Lifecycle on
              trailing active developer contributors. This contributor metric introduces substantial budget expansion
              risk in expanding enterprise accounts, particularly where contractor commits or automated AI-assisted
              commits broaden the audit scope. Snyk by contrast leverages developer-first IDE integration and security
              posture management, capturing high early developer engagement but commanding premium standalone contract
              pricing. JFrog bundles artifact storage with its Xray scanning module, offering a direct multi-format
              binary substitute to Nexus Repository and challenging Sonatype's single-vendor consolidation thesis. Black
              Duck Synopsys targets deep enterprise and legal license compliance audits, maintaining sticky deployments
              within highly regulated legal procurement workflows despite higher configuration overhead. Meanwhile,
              bundled developer platforms like GitHub Advanced Security create strong budget displacement pressure by
              offering native SCA and code scanning embedded directly inside enterprise source control subscriptions.
            claimRefs:
