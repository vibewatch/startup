      - number: '3.3'
        title: Moat Durability, Switching Frictions, and Displacement Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Sonatype's defensibility rests primarily on repository-level inertia, proxy firewall rules, and
              long-standing Maven Central ecosystem visibility. When Nexus Repository Pro serves as the primary artifact
              caching proxy across multi-site enterprise engineering operations, replacing it requires reconfiguring
              build pipeline endpoints, dependency mirror scripts, and container registries, creating meaningful
              operational switching friction. Furthermore, the integration of Nexus Firewall allows enterprise policy
              teams to quarantine malicious components at the network boundary, establishing defensive governance that
              standalone CI scanners struggle to replicate. However, this moat faces two distinct structural threats.
              First, developer-first tooling (Snyk) and source-code platform bundling (GitHub Advanced Security)
              challenge Sonatype's expansion into downstream developer workflows, limiting IDE module attach rates to
              roughly 28% and leaving Sonatype vulnerable to seat attrition if developers prioritize workflow
              convenience over central repository controls. Second, private equity ownership and commercial discounting
              behavior create pricing elasticity under multi-vendor RFP pressure, where enterprises citing competing
              JFrog or Snyk bids routinely extract 22% to 40% contract concessions.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
