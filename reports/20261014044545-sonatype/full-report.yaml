        title: Exhibits
        blocks:
          - type: callout
            title: Contributor Audit Exposure and Bundled Platform Displacement
            body: >-
              Sonatype's commercial model creates twin vulnerabilities for enterprise buyers and investors: Lifecycle's
              active-contributor pricing model routinely produces contract true-up friction during post-acquisition
              migrations or AI-assisted commit growth, while bundled platforms like GitHub Advanced Security create
              continuous displacement pressure on standalone SCA renewals.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP014
          - type: callout
            title: Repository-Level Interception and Ecosystem Moat
            body: >-
              By pairing Nexus Repository Pro with Nexus Firewall at the network boundary, Sonatype intercepts malicious
              and vulnerable open-source packages before ingestion, providing an architectural control plane that
              pure-play CI/CD scanners and IDE tools cannot duplicate without repository-level infrastructure.
            calloutType: strength
            claimRefs:
              - CP001
