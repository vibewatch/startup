      - number: '4.2'
        title: Pricing Architecture, Packaging, and Contract Economics
        blocks:
          - type: paragraph
            body: >-
              Sonatype's pricing structure is primarily indexed to application portfolio count and deployment
              architecture rather than purely seat-based licensing. For Sonatype Lifecycle, pricing scales directly with
              the number of applications under active security management, while Repository pricing incorporates
              repository instances, user tiers, and high-availability enterprise requirements. Based on transaction
              benchmark data from Vendr, mid-sized organizations managing 50 to 100 applications with bundled Lifecycle
              and Repository deployments typically see annual contract values (ACVs) between $50,000 and $150,000. Large
              enterprise deployments covering over 200 applications with bundled security modules and premium support
              routinely exceed $250,000, reaching $500,000 or more for complex global footprints. Realized contract
              values reflect substantial vendor flexibility: multi-year commitments of two to three years combined with
              annual prepayment unlock observed discounts between 15% and 30% off list pricing. Ancillary revenue
              streams include mandatory or recommended professional implementation services ($10,000 to $50,000+) and
              premium support tiers (adding 10% to 20% to base subscription fees).
            claimRefs:
