              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Primary Commercial Streams
        blocks:
          - type: paragraph
            body: >-
              Sonatype generates revenue primarily through annual recurring subscriptions for its software supply chain
              security and repository management solutions. The commercial model bridges developer-facing infrastructure
              with enterprise governance, monetizing high-volume developer adoption through paid governance tiers across
              its core product families: Sonatype Lifecycle, Sonatype Repository (formerly Nexus Repository), Sonatype
              Firewall, and SBOM Manager. While entry-level repository capabilities are offered through open-source
              tooling and low-friction monthly tiers, enterprise monetization centers on annual multi-product platform
              agreements. Company disclosures indicate that Sonatype's solutions are trusted by more than 15 million
              developers and deployed across nearly 2,000 enterprise organizations, including approximately 70% of the
              Fortune 100. Commercial expansion relies on converting open-source Maven Central telemetry and free
              repository instances into paid policy enforcement and automated dependency governance workflows.
            claimRefs:
