      - number: '1.3'
        title: Capitalization, Scale Metrics, and Operational Trajectory
        blocks:
          - type: paragraph
            body: >-
              Prior to its majority acquisition by Vista Equity Partners in November 2019, Sonatype raised a cumulative
              $148 million in venture capital across six funding rounds from premier venture and growth institutions,
              including Accel, New Enterprise Associates, and Goldman Sachs [CO009]. In operating scale, third-party
              profile registries report Sonatype employing approximately 398 to 567 personnel across global engineering
              and go-to-market functions, while generating an estimated $115 million to $150 million in annual
              commercial revenue [CO010]. Commercial platform momentum accelerated through the rollout of Nexus One,
              which currently supports over 2,650 enterprise customers globally, adding more than 600 net customers over
              the trailing twelve months alone [CO011]. Sonatype's market execution received premier validation in June
              2026, when Gartner positioned the company as a Leader in the 2026 Magic Quadrant for Software Supply Chain
              Security based on completeness of vision and ability to execute [CO012].
