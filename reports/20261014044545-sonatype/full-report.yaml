      - number: '5.3'
        title: Maturity, Differentiation, and Roadmap Signals
        blocks:
          - type: paragraph
            body: >-
              Nexus Repository has the strongest observable maturity signal: independent practitioner material describes
              established multi-format repository workflows, and Sonatype treats it as a core installed product.
              Sonatype's differentiation claim is the combination of that repository control point with governance,
              rather than a scanner added after artifacts have already entered the build path. CheckThat.ai
              independently characterizes repository management and governance as co-equal architectural capabilities,
              although it does not publish benchmark methodology for that conclusion. A current Sonatype engineering
              posting also shows active investment in agentic-first capabilities inside Nexus Repository Manager and
              multi-agent development practices. That is evidence of roadmap direction and engineering intent, not
              evidence that agentic product features are generally available, reliable, or commercially adopted.
            claimRefs:
              - CE002
              - CE006
              - CE014
