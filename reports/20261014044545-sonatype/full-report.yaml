        title: Financial Underwriting Verdict and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              From an investment diligence perspective, Sonatype exhibits strong qualitative revenue quality indicators:
              substantial contract sizes ($50k to $500k+), deep Fortune 100 account penetration, and high switching
