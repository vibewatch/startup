      - number: '5.2'
        title: Architecture, Integration, and Deployment Model
        blocks:
          - type: paragraph
            body: >-
              The most defensible public architecture is a logical operating model rather than a verified implementation
              topology. Sonatype documentation says licensed solutions are built from Nexus Repository 3, Sonatype IQ
              Server, and integrations; its license-to-installation map places Repository on the repository engine,
              Lifecycle and SBOM Manager on IQ Server, and Firewall across IQ Server and Repository. Nexus can host,
              proxy, or group repositories, while third-party practitioner material describes CI/CD, IDE, and API
              integration patterns. For customer-managed deployments, Sonatype publishes cloud-native reference
              architectures and Terraform templates for AWS, Azure, and GCP. Together these sources support a layered
              model from component selection and ingress control through storage, policy evaluation, remediation, and
              evidence generation. They do not support claims about internal databases, clustering behavior, throughput,
              failover, or the precise topology of Sonatype-managed services.
