              Prior to its acquisition by Vista Equity Partners in November 2019, Sonatype raised approximately $148
              million in institutional venture funding across six rounds, supported by investors including Accel, New
              Enterprise Associates, and Goldman Sachs. Under private equity ownership, Sonatype operates as an opaque
              private entity without mandatory public disclosure of balance sheet health, operating cash flow, or debt
