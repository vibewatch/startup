              - CO011
      - number: '1.2'
        title: Executive Leadership, Governance, and Sponsor Ownership
        blocks:
          - type: paragraph
            body: >-
              Sonatype's executive leadership is headed by Chief Executive Officer Bhagwat Swaroop, an experienced
              enterprise security and SaaS veteran with nearly three decades of technology leadership [CO005]. Swaroop
              joined Sonatype following senior executive assignments across major infrastructure security businesses,
              having previously served as President of Digital Security Solutions at Entrust, President and General
              Manager of One Identity (orchestrating the acquisition of OneLogin), and Executive Vice President and
              General Manager at Proofpoint where he helped scale email security revenue from $250 million to over $1
              billion in ARR [CO005]. Product development and engineering execution are directed by Chief Product
              Development Officer Mitchell Johnson, who spearheads the architectural consolidation of Nexus One across
              developer and agentic workflows [CO006]. Governance remains strictly anchored under private-equity sponsor
              Vista Equity Partners, which acquired Sonatype in November 2019 [CO007]. While Vista's majority
              sponsorship provides deep institutional backing, operational metrics including sponsor debt leverage,
              board composition, and precise capital structure remain privately held and undisclosed [CO008].
