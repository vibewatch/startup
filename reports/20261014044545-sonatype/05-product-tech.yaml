chapter:
  number: 5
  title: "Product & Technology"
  summary: "Sonatype's public product architecture is a software-supply-chain control workflow built around Nexus Repository, Sonatype IQ Server, and a suite spanning component admission, policy remediation, dependency guidance, and SBOM evidence. The product map is clear, but objective reliability, performance, security-assurance, and module-adoption evidence remains a material diligence gap."
sections:
  - id: "product-and-module-map"
    title: "Product Definition and Module Map"
    body: >-
      Sonatype delivers controls for the path by which external and internally produced software
      components enter, move through, and are documented inside an enterprise development
      environment. Independent descriptions consistently identify repository management,
      dependency analysis, malware protection, software-composition analysis, and license
      compliance as the core jobs. The official product overview broadens that surface into Nexus
      Repository, Repository Firewall, Lifecycle, Guide, SBOM Manager, Developer, and an Advanced
      Legal Pack. The 2026 Nexus One announcement organizes five of those capabilities into a
      single control-plane narrative: select components, block unsafe inputs, maintain a system of
      record, remediate policy violations, and produce evidence about application contents. This
      is a coherent workflow proposition, but public materials do not establish equal maturity or
      commercial adoption across every module.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE009"
    tableRefs:
      - "TE001"
  - id: "architecture-and-deployment"
    title: "Architecture, Integration, and Deployment Model"
    body: >-
      The most defensible public architecture is a logical operating model rather than a verified
      implementation topology. Sonatype documentation says licensed solutions are built from
      Nexus Repository 3, Sonatype IQ Server, and integrations; its license-to-installation map
      places Repository on the repository engine, Lifecycle and SBOM Manager on IQ Server, and
      Firewall across IQ Server and Repository. Nexus can host, proxy, or group repositories, while
      third-party practitioner material describes CI/CD, IDE, and API integration patterns. For
      customer-managed deployments, Sonatype publishes cloud-native reference architectures and
      Terraform templates for AWS, Azure, and GCP. Together these sources support a layered model
      from component selection and ingress control through storage, policy evaluation, remediation,
      and evidence generation. They do not support claims about internal databases, clustering
      behavior, throughput, failover, or the precise topology of Sonatype-managed services.
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "maturity-and-differentiation"
    title: "Maturity, Differentiation, and Roadmap Signals"
    body: >-
      Nexus Repository has the strongest observable maturity signal: independent practitioner
      material describes established multi-format repository workflows, and Sonatype treats it as
      a core installed product. Sonatype's differentiation claim is the combination of that
      repository control point with governance, rather than a scanner added after artifacts have
      already entered the build path. CheckThat.ai independently characterizes repository
      management and governance as co-equal architectural capabilities, although it does not
      publish benchmark methodology for that conclusion. A current Sonatype engineering posting
      also shows active investment in agentic-first capabilities inside Nexus Repository Manager
      and multi-agent development practices. That is evidence of roadmap direction and engineering
      intent, not evidence that agentic product features are generally available, reliable, or
      commercially adopted.
    claimRefs:
      - "CE002"
      - "CE006"
      - "CE014"
    tableRefs:
      - "TE003"
  - id: "trust-and-technical-risk"
    title: "Trust, Security, and Technical Diligence Gaps"
    body: >-
      The security proposition is preventive in design: Sonatype says Firewall blocks malicious,
      vulnerable, and non-compliant components before entry; Guide steers package and model
      selection; Lifecycle prioritizes remediation; and SBOM Manager documents application
      contents. Those are issuer claims about intended controls, not independent measurements of
      detection efficacy or production resilience. The fetched Nexus One page lists policy
      management, malware protection, compliant version selection, and legal compliance, but the
      retrieved text does not identify comparison vendors or quantify outcomes. Across the retained
      independent sources, there are no measured uptime, scan-latency, false-positive, recovery, or
      externally audited control results. Technical diligence should therefore treat architecture
      and workflow fit as supported, while keeping reliability, security assurance, deployment
      burden, and module-level maturity open until Sonatype supplies primary evidence and customer
      reference data.
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE015"
      - "CE016"
