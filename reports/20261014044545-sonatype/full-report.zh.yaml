      - number: '3.2'
        title: 竞争对手画像、打包模式与购买标准
        blocks:
          - type: paragraph
            body: >-
              竞争集的商业评估在打包、授权指标和战略定位上差异明显。Sonatype 采用混合定价：Nexus Repository Pro 按用户席位和高可用实例定价，Nexus Lifecycle
              则按过去一段时间内活跃的开发者贡献者计费。企业扩张时，承包商提交或 AI 辅助提交会扩大审计范围，使这一贡献者指标带来明显的预算上行风险。相比之下，Snyk 依靠开发者优先的 IDE
              集成和安全态势管理，能较早抓住开发者参与度，但独立合同价格较高。JFrog 将构件存储与 Xray 扫描模块捆绑，直接替代 Nexus Repository 的多格式二进制能力，挑战 Sonatype
              的单一供应商整合逻辑。Black Duck Synopsys 面向深度企业和法律许可证合规审计，虽配置负担更重，仍在高度受监管的法律采购流程中保持较强黏性。GitHub Advanced Security
              等捆绑开发者平台则把原生 SCA 和代码扫描嵌进企业源码控制订阅，持续挤压独立产品预算。
