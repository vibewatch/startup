      - number: '1.3'
        title: 资本化、规模指标与经营轨迹
        blocks:
          - type: paragraph
            body: >-
              在 2019 年 11 月被 Vista Equity Partners 控股收购前，Sonatype 分六轮融资累计获得 $148 million 风险投资，投资方包括 Accel、New Enterprise
              Associates 和 Goldman Sachs [CO009]。第三方档案显示，公司全球工程和市场拓展团队约有 398 至 567 名员工，预计年度商业收入为 $115 million 至 $150
              million [CO010]。Nexus One 上线后商业平台势头加快，目前全球支持超过 2,650 家企业客户，仅过去 12 个月就净增超过 600 家。2026 年 6 月，Gartner
              依据愿景完整度和执行能力，将 Sonatype 列为 2026 年软件供应链安全魔力象限领导者，进一步验证了其市场执行力 [CO011, CO012]。
            claimRefs:
