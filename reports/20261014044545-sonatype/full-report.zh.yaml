chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Sonatype 于 2008 年由 Apache Maven 的最初创建者 Jason Van Zyl 在马里兰州 Fulton 创立，定位是企业软件供应链安全和开源自动化治理的基础控制平面。公司长期维护
              Maven Central，加上 Nexus Repository 的广泛采用，建立了主要行业防御力；后者已成为企业管理数十种包格式、记录开发者构件的系统记录。Sonatype 并非只做下游漏洞扫描，而是靠
              Nexus 一体化平台的订阅授权赚钱，产品包括 Nexus Repository Pro、Nexus Lifecycle、Nexus Firewall，以及新整合的 Nexus
              One。商业版本负责软件接入，在边界拦截恶意依赖，执行内部许可证合规，并为银行、国防、医疗等高度受监管企业自动生成软件物料清单（SBOM）[CO001, CO002, CO003, CO004]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO007
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 管理层、治理与发起方持股
        blocks:
          - type: paragraph
            body: >-
              Sonatype 由首席执行官 Bhagwat Swaroop 领军；他是拥有近 30 年技术管理经验的企业安全和 SaaS 老兵 [CO005]。加入 Sonatype 前，他曾在 Entrust 担任
              Digital Security Solutions 总裁，在 One Identity 担任总裁兼总经理并负责 OneLogin 收购，还曾在 Proofpoint
              担任执行副总裁兼总经理，帮助其将邮件安全收入从 $250 million 提升到超过 $1 billion ARR。首席产品开发官 Mitchell Johnson 负责产品与工程，主导 Nexus One
              在开发者和智能 agent 工作流中的架构整合 [CO006]。治理仍牢牢掌握在私募股权发起方 Vista Equity Partners 手中，后者于 2019 年 11 月收购 Sonatype
              [CO007]。Vista 的多数股权支持带来深厚机构资源，但发起方债务杠杆、董事会构成和精确资本结构等经营指标仍属私有且未披露 [CO008]。
