      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              软件供应链治理的企业买方和采购路径，在技术使用者与经济赞助者之间存在明显分化。平台需求主要来自高度受监管行业，包括联邦国防和民用机构、一级金融机构、保险集团与医疗科技供应商；对这些组织而言，软件可追溯性不可妥协。公共部门通常通过
              Carahsoft 等授权分销商采购，利用联邦合同目录和专门的隔离环境能力（SAGE）满足国家安全约束。预算往往来自两套组织预算：平台工程或 DevOps
              基础设施团队负责构件仓库托管，CISO、应用安全（AppSec）或合规部门则负责 SCA 漏洞扫描、防火墙和 SBOM 生命周期管理。合规要求会推动商业采用。例如，企业客户 Software AG
              记录显示，从定期 SCA 切换到持续的 CI/CD 内联策略执行后，发布合规审计周期从 2 至 3 周缩短至 2 分钟。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
      - number: '2.4'
        title: 增长驱动、落地瓶颈与尽调现实
        blocks:
          - type: paragraph
            body: >-
              监管与技术两股压力同时加大，市场需求正在加速，但组织惯性仍会拖慢落地。美国第 14028 号行政命令第 4 节要求政府软件供应商透明生成 SBOM，已把供应链风险从开发者卫生问题提升为董事会治理议题。生成式 AI
              和自动代码助手快速普及，也将未经审查的依赖与机器生成代码以前所未有的规模注入仓库，促使 Sonatype 推出 Nexus One，统一治理 AI
              模型和依赖。然而落地约束依然很重：企业买方需要在严格的二进制阻断规则与开发发布速度之间取舍，防火墙策略过激时，误报可能卡住交付管线。私募股权持有又让商业尽调更难：独立经常性收入、毛利率和债务偿付义务都未披露，因此无法确认近期账户增长究竟来自高毛利平台扩张，还是折扣捆绑销售仓库产品。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM010
              - CM012
