        title: 展示项
        blocks:
          - type: callout
            title: 仓库工作流中心地位带来治理护城河
            body: Sonatype 把构件治理和二进制防火墙直接放进仓库与构建管线，而不是只做构建完成后的扫描，因此能在脆弱组件向下游扩散前，先占住开发者工作流中心。
            calloutType: insight
            claimRefs:
              - CM001
