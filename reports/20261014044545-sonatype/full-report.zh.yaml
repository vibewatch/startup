      - number: '3.3'
        title: 护城河韧性、切换摩擦与替代风险
        blocks:
          - type: paragraph
            body: >-
              Sonatype 的防御力主要来自仓库级惯性、代理防火墙规则和长期积累的 Maven Central 生态可见度。当 Nexus Repository Pro
              成为多站点企业工程运营的主要构件缓存代理，替换它就要重配构建管线端点、依赖镜像脚本和容器注册表，运营切换摩擦不小。Nexus Firewall 还允许企业策略团队在网络边界隔离恶意组件，形成独立 CI
              扫描器难以复制的防御治理。不过，护城河面临两项结构性威胁。第一，开发者优先工具（Snyk）和源码平台捆绑（GitHub Advanced Security）争夺下游开发者工作流，使 IDE 模块附加率限制在约
              28%；如果开发者优先选择工作流便利性，Sonatype 就容易流失席位。第二，多供应商 RFP 会制造价格弹性：引用 JFrog 或 Snyk 竞标的企业，通常能争取 22% 至 40% 的合同让利。
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
