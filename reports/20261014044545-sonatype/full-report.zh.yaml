  - id: FP001
    title: 软件供应链竞争定位
    type: quadrant
    summary: 评估主要软件供应链解决方案，比较摄入前的仓库控制与开发者工作流集成。
    data:
      points:
        - label: Sonatype Nexus One
          x: 8.8
          'y': 6.2
          detail: 摄入前仓库防火墙和 Maven 维护领域的领导者，开发者 IDE 附加程度中等。
        - label: JFrog Artifactory & Xray
          x: 8.5
          'y': 6
          detail: 占主导地位的企业制品管理老牌平台，集成 Xray 二进制漏洞扫描。
        - label: Snyk
          x: 4.2
          'y': 9.1
          detail: 开发者优先的 SCA 先驱，IDE 工作流领先市场，但没有原生二进制仓库控制平面。
        - label: GitHub Advanced Security
          x: 5.5
          'y': 8.6
          detail: 深度嵌入源代码控制流水线，工作流采用率高，但缺少多格式代理仓库。
        - label: Black Duck Synopsys
          x: 4.8
          'y': 4.5
          detail: 企业法律和许可证合规老牌平台，依赖重型集中式扫描，开发者速度较慢。
        - label: Mend.io
          x: 4.5
          'y': 5.8
          detail: 具备成本效益的 SCA 替代方案，提供多语言依赖检查，但没有仓库控制。
        - label: Status-Quo Internal Mirrors
          x: 3
          'y': 2.5
          detail: 基础制品代理，没有自动恶意软件包隔离、策略执行或合规证据。
      xAxis:
        label: 摄入前仓库与防火墙治理（1-10）
        min: 1
        max: 10
      yAxis:
        label: 开发者工作流与 IDE 集成（1-10）
        min: 1
        max: 10
    approximationNotes: 序数评分基于对产品架构、企业能力基准和供应商定位研究的分析。
