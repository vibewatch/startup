      - number: '1.4'
        title: 供应链风险环境与监管压力
        blocks:
          - type: paragraph
            body: >-
              Sonatype 处在全球开源分发的交汇点，因此公司及其企业客户都承受严重且不利的生态结构性压力。Sonatype 第 11 份《软件供应链现状》研究称，2025
              年公共注册表的开源下载量达到前所未有的机器规模：9.8 trillion 次；合成自动化、冷缓存构建运行器和临时 CI/CD 环境加重了注册表运营商的带宽与基础设施成本
              [CO013]。与此同时，开源攻击面迅速恶化：单个年度周期记录了超过 454,000 个新恶意包，使 Sonatype 编录的累计恶意软件数量超过 1.23 million 个
              [CO014]。漏洞管理还存在严重系统性滞后：国家漏洞数据库（NVD）中 65% 的开源 CVE 没有官方 CVSS 严重性评级，生成式 AI 代码助手在依赖推荐中的幻觉率达到 27.76% [CO015,
              CO016]。欧盟《网络韧性法案》（CRA）和 NIS2 指令等全球监管执法同步收紧，自动 SBOM 和主动供应链治理正从加分项变成企业合规硬要求。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从工具转向治理控制平面
            body: >-
              Sonatype 在 Vista Equity Partners 和 CEO Bhagwat Swaroop 带领下，有意从独立开发者工具（Nexus
              Repository）转向企业级软件供应链控制平面（Nexus One）。它把治理嵌入开源、容器和新兴 AI 编程 agent，靠开发者信任和监管要求变现 [CO003, CO005, CO016]。
            calloutType: insight
            claimRefs:
              - CO003
              - CO005
              - CO016
          - type: callout
            title: 生态承压与发起方杠杆不透明
            body: >-
              Sonatype 面临两项重大逆风：合成流量和武器化恶意软件让维护开源分发的成本与威胁复杂度不断上升；同时，Vista Equity Partners 的债务资本化和单位经济性也缺乏透明度 [CO008,
              CO013, CO014]。
            calloutType: risk
            claimRefs:
              - CO008
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作流与支出划分
        blocks:
          - type: paragraph
            body: >-
              软件供应链安全市场位于更广泛的企业应用安全和 DevSecOps 工具内部，但边界清晰。它不负责部署后的运行时防护或专有源代码扫描，而是治理第三方开源包、容器和 AI
              模型的接入、验证、存储与组装。可服务领域包括二进制构件仓库管理、持续软件成分分析（SCA）、通过仓库防火墙提前执行接入策略，以及生成机器可读的 SBOM。通用云安全态势管理（CSPM）、端点检测和 Web
              应用防火墙属于相邻类别，不计入这项核心支出。Sonatype 把 Maven Central 和 Nexus Repository 的开发者构件工作流与自动策略门结合起来，锚定了这一类别。技术评估显示，Nexus
              Repository Professional 支持约 18 个核心企业包生态，具备专用代理和高可用架构；相比之下，许多主流开发者平台仍把构件存储当作未经检查的普通存储桶。
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM013
      - number: '2.2'
        title: 可服务市场测算、TAM/SAM/SOM 与攻击增长
        blocks:
          - type: paragraph
            body: >-
              测算软件供应链安全的可服务市场，不能依赖缺乏依据的单一分析师数字，而要结合开发者使用规模、宏观依赖密度和实际攻击遥测。如今开源代码约占现代企业软件构成的
              90%，外部依赖接入已成为应用开发的主要威胁入口。Sonatype 的威胁情报显示，三年间年度软件供应链攻击激增 742%；2025 年单年记录了 454,648 个新恶意包，自 2019 年以来累计记录超过
              1.233 million 个。需求端覆盖全球超过 15 million 名使用构件仓库的开发者。SAM 主要集中在 Global 2000
              和受严格软件完整性标准约束的受监管企业。商业客户披露显示，Sonatype 已从近 2,000 个账户（包括财富 100 强的 70%）扩展到超过 2,650 家活跃企业客户，过去 12 个月净增超过 600
              个账户。第三方行业画像估计公司年度收入约 $115 million、员工 398 人，但发起方披露限制使正式 ARR 拆分无法确认。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM010
              - CM014
