        - 企业销售周期延长，开发者抵制严格的网关政策
      - - 基准情景
        - 55%
        - ARR 稳定增长 10-15%，达到 $150M 运行率，毛留存率中等
        - 与成熟 DevSecOps 同业一致的 6.5x EV / ARR 倍数
        - $975M 企业价值
        - GitHub Advanced Security 和 GitLab Ultimate 捆绑带来的定价压力
      - - 悲观情景
        - 20%
        - 合同流失和偿债压力下，收入停滞在历史数据库底部约 $115M
        - 反映旧仓库分类和私募股权债务折价的 4.0x EV / ARR 倍数
        - $460M 企业价值
        - 发起方资本重组、管理层离职，以及客户流失至集成式 CI/CD 平台
    notes: 估值区间是基于当前 DevSecOps 软件倍数的示意性企业价值；股权价值将因未披露的净债务而不同。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 Sonatype 从创立到引领代理式平台的发展轨迹，涵盖公司、融资、产品和生态系统关键里程碑。
    data:
      items:
        - label: '2008'
          title: Founding and Maven Stewardship
          detail: Sonatype 由 Apache Maven 创始人 Jason Van Zyl 在马里兰州富尔顿创立，负责管理开源依赖。
          tone: positive
        - label: '2009'
          title: Series A Financing
          detail: 获得首轮机构风险资本，用于开发商业代码仓库工具。
          tone: positive
        - label: '2016'
          title: Growth Financing & Debt Facility
          detail: 获得由 Goldman Sachs 领投的 D 轮股权和债务资本，用于扩展企业级 DevSecOps 套件。
          tone: positive
        - label: '2018'
          title: Series E Financing Completion
          detail: 完成 E 轮融资，累计风险资本达到 $148 million。
          tone: positive
        - label: '2019'
          title: Vista Equity Partners Acquisition
          detail: 于 2019 年 11 月被 Vista Equity Partners 收购，转为私募股权支持的所有权结构。
          tone: neutral
        - label: '2025'
          title: Infrastructure & Threat Escalation
          detail: 全球开源下载量达到 9.8 trillion，累计记录的恶意软件包超过 1.2 million。
          tone: warning
        - label: '2025'
          title: Nexus One AI-Native Launch
          detail: 推出 Nexus One 统一 DevSecOps 平台，覆盖开源、容器和 AI/ML 组件风险。
          tone: positive
        - label: '2026'
          title: Gartner MQ Leader Position
          detail: 被评为 2026 年 6 月 Gartner 软件供应链安全魔力象限的领导者。
          tone: positive
    approximationNotes: 时间线综合经核实的公司公告、研究发布和行业认可。
    claimRefs:
      - CO001
      - CO007
      - CO009
      - CO012
      - CO013
      - CO014
