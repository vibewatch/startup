  - id: FV001
    title: Sonatype 尽调建议决策流程
    type: flow
    summary: 将企业护城河和商业证明与发起方信息不透明及竞争风险串联起来，最终得出“继续研究”的立场。
    approximationNotes: 该逻辑流程综合尽调发现，从市场领先地位推导至最终投资立场。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV010
      - CV014
    data:
      nodes:
        - id: n1
          label: 企业护城河与市场领导力
          detail: 在 2026 年 Gartner 软件供应链安全魔力象限中处于领先地位，并负责维护 Maven Central
        - id: n2
          label: 商业规模与客户基础
          detail: 拥有超过 2,650 家企业客户和 1,500 万名开发者，2025 年净增客户超过 600 家
        - id: n3
          label: 平台统一（Nexus One）
          detail: 端到端控制平面，统一 Repository、Firewall、Guide、Lifecycle 和 SBOM Manager
        - id: n4
          label: 发起方治理与财务不透明
          detail: 自 2019 年起由 Vista Equity Partners 持有，但债务结构未经审计，现金消耗也未公布
        - id: n5
          label: 竞争与估值差异
          detail: 收入估算介于 $115M 至 $150M 之间，同时面临 GitHub 和 GitLab 平台捆绑的威胁
        - id: n6
          label: 最终判断：继续研究 / 公允
          detail: 估值判断为公允（模型隐含 EV 约 $1.0B）；待发起方审计完成后建议继续研究
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
