  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与架构分层
        blocks:
          - type: paragraph
            body: >-
              企业软件供应链安全分成两种主要架构路线：仓库级接入治理，以及开发者优先的 CI/CD 工作流安全。Sonatype 位于接入治理核心，凭借维护 Maven Central 二十年的积累和 Nexus
              Repository，在第三方依赖进入前截获它们。但直接商业对手和捆绑平台正从多个产品层级争夺这一边界。说到构件仓库管理，JFrog Artifactory
              是主要商业在位者，直接竞争企业二进制存储、高可用集群和多格式管理。在 SCA 领域，Sonatype Lifecycle 处于中游位置，面对开发者优先的 Snyk、传统企业扫描套件 Black Duck
              Synopsys、价格更低的 Mend.io，以及 GitHub Advanced Security 等开发者生态套件。企业工程团队还会把内部构建脚本和无人管理的开源代理作为旧有替代方案，但第 14028
              号行政命令和欧盟《网络韧性法案》带来的监管审查，正迫使企业转向正式商业工具。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
