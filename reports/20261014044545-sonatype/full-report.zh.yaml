          - type: callout
            title: 私募股权财务不透明遮蔽单位规模
            body: 客户已覆盖 2,650 个账户和财富 100 强的 70%，但 Vista Equity 的所有权遮蔽了模块级 ARR 附加率、毛利率拆分和净收入留存，仍需正式确认股权价值驱动因素。
            calloutType: risk
            claimRefs:
