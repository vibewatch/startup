  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 从开源 Maven Central 遥测和免费仓库使用，转化为付费多产品企业订阅并扩展平台。
    data:
      nodes:
        - label: 1. 开源流入
          detail: Maven Central 生态托管 1.233M+ 个已索引软件包，推动注册表下载量达到 9.8T。
        - label: 2. 开发者与仓库采用
          detail: Nexus Repository OSS 覆盖 15M+ 名开发者，作为制品存储和构建基础设施。
        - label: 3. 策略流入与仓库防火墙
          detail: 入口处自动隔离，阻止恶意软件包和违反策略的内容。
        - label: 4. 生命周期治理与合规
          detail: 对活跃应用持续开展软件成分分析（SCA）和策略修复。
        - label: 5. 多产品平台捆绑
          detail: 捆绑销售 Repository Pro/Enterprise、Lifecycle、Firewall 和 SBOM Manager。
        - label: 6. 企业扩展与服务
          detail: 年度订阅（ACV $50k-$300k+），配套 10-20% 的高级支持层级和专业服务。
      edges:
        - from: 1. Open Source Ingress
          to: 2. Developer & Repository Adoption
        - from: 2. Developer & Repository Adoption
          to: 3. Policy Ingress & Repository Firewall
        - from: 3. Policy Ingress & Repository Firewall
          to: 4. Lifecycle Governance & Compliance
        - from: 4. Lifecycle Governance & Compliance
          to: 5. Multi-Product Platform Bundling
        - from: 5. Multi-Product Platform Bundling
          to: 6. Enterprise Expansion & Services
    approximationNotes: 流程图展示已观察到的客户变现架构；各阶段转化率和合同层级组合属于私有信息，未予披露。
