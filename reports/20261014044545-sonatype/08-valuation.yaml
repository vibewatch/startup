callouts:
  - calloutType: recommendation
    title: 'Valuation Verdict: Research-More Under Sponsor Opacity'
    body: While Sonatype demonstrates robust enterprise positioning and leadership in the 2026 Gartner Magic Quadrant for Software Supply Chain Security, the lack of audited financials, undisclosed debt structure from Vista Equity Partners' 2019 buyout, and wide variance in revenue estimates ($115M to $150M) preclude an actionable buy rating without private data room access.
