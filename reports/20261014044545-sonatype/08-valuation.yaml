  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Probability
      - Operating Assumptions
      - Implied Revenue & Multiple
      - Estimated Valuation
      - Key Downside Trigger
    rows:
      - - Bull Case
        - 25%
        - ARR accelerates to $180M+ driven by AI-generated code governance and Nexus One cross-sell
        - 8.0x EV / ARR multiple benchmarked against premium cybersecurity assets
        - $1,440M Enterprise Value
        - Prolonged enterprise sales cycles and developer resistance to strict gateway policies
      - - Base Case
        - 55%
        - Steady 10-15% ARR growth reaching $150M run rate with moderate gross retention
        - 6.5x EV / ARR multiple consistent with mature DevSecOps peers
        - $975M Enterprise Value
        - Pricing pressure from GitHub Advanced Security and GitLab Ultimate bundling
      - - Bear Case
        - 20%
        - Revenue stagnates near $115M historical database floor with contract attrition and debt service strain
        - 4.0x EV / ARR multiple reflecting legacy repository classification and PE debt discount
        - $460M Enterprise Value
        - Sponsor recapitalization, executive turnover, and customer churn to integrated CI/CD platforms
    notes: Valuation ranges are illustrative enterprise values based on prevailing DevSecOps software multiples; equity value will differ based on undisclosed net debt.
