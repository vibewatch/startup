  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: Audited net revenue retention (NRR), gross retention rate (GRR), logo churn, and contract duration cohorts across enterprise customers.
      whyItMatters: Without public cohort disclosure, it is impossible to verify whether the 600 reported new customers in 2025 expand over time or whether seat churn offsets new logo acquisition.
      diligencePath: Request confidential sponsor retention schedules, multi-year cohort retention tables, and churn breakdowns from management during diligence.
      relatedQuestionRefs:
        - QU006
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Breakdown of top 10/20 customer concentration by percentage of ARR, public-sector vs. commercial contract value, and renewal contract terms.
      whyItMatters: High concentration among major financial institutions or federal government entities could expose Sonatype to procurement freezes, budget reallocations, or single-account contract shocks.
      diligencePath: Request customer concentration revenue schedule, public sector contract renewal dates, and government procurement vehicle allocations.
      relatedTableRefs:
        - TU003
