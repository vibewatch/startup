    title: "Chapter 11 Changes the Competitive Question"
    body: "The key issue is no longer only whether Hydro-to-Cathode can outperform conventional processing. Buyers must also assess continuity of supply, unfinished-capacity funding, contract treatment, and qualification durability through restructuring."
    claimRefs:
      - "CP001"
      - "CP013"
      - "CP014"
      - "CP016"
  - calloutType: "insight"
    title: "Technical Integration Is Necessary but Not Sufficient"
    body: "Ascend's process scope can reduce intermediary steps, yet Redwood's reuse pivot and Chinese cost leadership show that monetization flexibility and scaled distribution may be more durable than a process claim alone."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP016"
