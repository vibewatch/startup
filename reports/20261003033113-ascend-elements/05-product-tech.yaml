callouts:
  - calloutType: "risk"
    title: "Structural Disconnect Between Core Technology and Industrial Scale-Up"
    body: "Ascend Elements' patented Hydro-to-Cathode technology offers a genuine, verified chemical engineering innovation that can synthesize battery-grade precursor cathode active material directly from recycled black mass with substantial energy and emissions savings. However, the company proved unable to translate laboratory and pilot success into reliable industrial execution. Compounding fatal cost-overruns on an un-capped cost-plus construction contract at Apex 1, severe fire hazards at Covington Base 1, and unilateral grant cancellations by the Department of Energy, the technological pipeline remains physically stranded at 60% construction completion with no debtor financing to finish the asset."
