company:
  name: "Ascend Elements"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Ascend Elements developed a proprietary Hydro-to-Cathode hydrometallurgical direct precursor synthesis technology designed to convert lithium-ion battery scrap and black mass directly into precursor cathode active material (pCAM) and recycled lithium carbonate. However, while commercial-scale lithium carbonate production commenced at the Base 1 (Apex 0) recycling facility in Covington, Georgia, commercialization of pCAM was paralyzed by the construction halt at the flagship Apex 1 campus in Hopkinsville, Kentucky and the company's April 2026 Chapter 11 bankruptcy filing."
sections:
  - id: "product-definition-and-modular-asset-map"
    title: "Product Definition and Facility Asset Map"
    body: "Ascend Elements positions its product portfolio across three integrated physical outputs derived from closed-loop lithium-ion battery recycling: recycled black mass, battery-grade recycled lithium carbonate (>99% purity), and engineered precursor cathode active materials (pCAM) tailored for nickel-manganese-cobalt (NMC) chemistries. In conventional battery recycling workflows, spent cells and manufacturing scrap are shredded into black mass and then hydrometallurgically separated into individual virgin-grade metal salts (nickel sulfate, cobalt sulfate, manganese sulfate, and lithium carbonate), which must subsequently undergo chemical precipitation to synthesize new cathode precursor material. Ascend Elements' product strategy seeks to bypass intermediate metal-salt extraction through its patented Hydro-to-Cathode direct precursor synthesis process, producing engineered pCAM directly from leached black mass solution. Across its physical operating footprint, the company established Base 1 (Apex 0) in Covington, Georgia as its primary North American mechanical shredding and lithium carbonate recovery facility, designed with a capacity of 30,000 metric tons of battery scrap annually. Upstream pCAM manufacturing was planned at the 450,000-square-foot Apex 1 megasite in Hopkinsville, Kentucky, designed to supply cathode materials for 250,000 electric vehicles annually, while European operations are structured via the AE Elemental joint venture in Zawiercie, Poland and the planned Apex 2 extraction facility in Lower Silesia. However, following Ascend's Chapter 11 filing in April 2026, pCAM production remains uncommercialized as Apex 1 construction sits stalled at 60% completion."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
