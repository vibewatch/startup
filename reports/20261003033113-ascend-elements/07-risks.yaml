callouts:
  - calloutType: "risk"
    title: "Binary Outcome: Section 363 Distressed Sale or Chapter 7 Liquidation"
    body: "Ascend Elements operates under an unforgiving court-approved sale timeline where failure to secure qualified bids by May 9, 2026, or finalize a transaction at the May 21 hearing, triggers immediate termination events under the Senior Secured Cash Collateral Order. With no committed DIP facility, cash reserves will run dry, converting the restructuring into a Chapter 7 liquidation that eliminates all common equity and severely impairs unsecured obligations."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR014"
  - calloutType: "risk"
    title: "Priming Mechanic's Liens Eliminate Distressed Asset Recovery Value"
    body: "Even if an acquirer bids on the paused Apex 1 campus, Turner-Kokosing Joint Venture's $138.4 million perfected mechanic's lien and RMF Nooter's $39.85 million sub-lien claim statutory super-priority under Kentucky law over prepetition noteholders. Litigating or settling this priming claim will absorb substantial cash proceeds from any sale of the Hopkinsville real estate."
    claimRefs:
      - "CR003"
      - "CR004"
