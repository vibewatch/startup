              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports qualitative scenarios, not numerical valuation ranges or probabilities. The
              bull case requires a court-approved transaction that preserves operating assets and customer
              relationships, fully funds remaining scale-up, and offers a clean, preference-aware entry price. The base
              case is a distressed restructuring or asset sale in which strategic value survives but existing
              common-equity economics cannot be underwritten from public data. The bear case is further delay, contract
              impairment, or asset fragmentation that leaves common equity with no supportable recovery. Historical
              capacity targets also need reconciliation: a 2022 regional announcement cited output for 250,000 electric
              vehicles annually, while a 2023 syndicated company announcement cited 750,000, apparently against a larger
              facility scope. Neither target establishes current production.
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
