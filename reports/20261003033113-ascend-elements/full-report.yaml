      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              The principal durability test is whether process IP and customer relationships can survive financing and
              scale-up risk. Ascend began Chapter 11 proceedings in April 2026, and the same reporting described Apex 1
              as still under construction; that combination weakens buyer confidence even if Base 1 continues operating
              and an offtake remains nominally in place. At the same time, Redwood's move into grid-scale storage
              illustrates how a recycling network can support a second monetization path, while Chinese producers retain
              scale and cost pressure. The evidence therefore supports a conditional moat: circular process integration
              may differentiate the product, but capital access, on-time qualification, feedstock control, and
              enforceable demand commitments determine whether that differentiation becomes durable distribution power.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
              - CP014
              - CP016
