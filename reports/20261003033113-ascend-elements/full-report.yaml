              - CE014
      - number: '5.3'
        title: Facility Deployment, Reliability Track Record, and Technical Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Industrial deployment of Ascend Elements' technology has suffered severe operational reliability
              breakdowns, substantial capital expenditure overruns, and fatal contractual impasses. At the operational
              Covington Base 1 plant, capital costs surged to over $120 million against an original $43 million budget,
              and the facility experienced fourteen fire-related safety incidents between March 2023 and February 2025.
              These recurring fires led to an operational suspension by the municipal Covington Fire Department, forcing
              facility shutdowns, safety system overhauls, and site management replacements before restarting in late
              August 2025. In Kentucky, construction of the Apex 1 campus—engineered by SSOE Group utilizing Autodesk
              Construction Cloud and built by the Turner-Kokosing Joint Venture (TKJV)—expanded from an initial $310
              million Phase 1 estimate to an $878 million scope before work was halted in December 2024. The breakdown
              was exacerbated by an abrupt mid-project engineering pivot in May 2023, where Ascend directed TKJV to
              abandon the originally planned cathode active material (CAM) manufacturing process as no longer
              commercially viable and pivot exclusively to pCAM. Compounding these technical and capital challenges, the
              U.S. Department of Energy mutually canceled a $164 million CAM infrastructure grant in February 2025 and
              unilaterally terminated a $316.2 million pCAM grant in October 2025 after disbursing $207 million, citing
              missed project milestones and lack of economic viability. Following $138.4 million in contractor mechanic
              liens and the April 2026 Chapter 11 filing, Debtors formally disavowed any restart of Apex 1, leaving the
              company's flagship pCAM commercialization pathway fully blocked.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Disconnect Between Core Technology and Industrial Scale-Up
            body: >-
              Ascend Elements' patented Hydro-to-Cathode technology offers a genuine, verified chemical engineering
              innovation that can synthesize battery-grade precursor cathode active material directly from recycled
              black mass with substantial energy and emissions savings. However, the company proved unable to translate
              laboratory and pilot success into reliable industrial execution. Compounding fatal cost-overruns on an
              un-capped cost-plus construction contract at Apex 1, severe fire hazards at Covington Base 1, and
              unilateral grant cancellations by the Department of Energy, the technological pipeline remains physically
              stranded at 60% construction completion with no debtor financing to finish the asset.
            calloutType: risk
            claimRefs:
              - CE002
              - CE011
