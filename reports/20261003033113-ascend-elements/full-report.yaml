              - CM014
      - number: '2.2'
        title: Market Sizing, Demand Reality, and the CAM Disconnection
        blocks:
          - type: paragraph
            body: >-
              Public and private projections previously envisioned a rapid multi-billion-dollar domestic battery
              materials manufacturing base in North America, bolstered by federal initiatives such as the Department of
              Energy's Battery Materials Processing and Battery Manufacturing Initiative. At its peak, Ascend Elements
              secured major commercial commitments, including a multi-year take-or-pay agreement with commodities trader
              Trafigura Group for 15,000 metric tons of recycled lithium carbonate and a multi-year supply contract
              valued at nearly $1 billion with a leading global automaker. Yet, addressable demand diverged sharply
              between product categories during late 2024 and 2025. Demand for finished domestic CAM failed to
              materialize at scale, compelling Ascend Elements to voluntarily return a $164 million DOE grant and
              abandon domestic CAM production entirely at Apex 1. While demand for pCAM and high-purity lithium
              carbonate remained active in supplier contracts, the inability to monetize intermediate materials before
              completing capital-intensive refining lines created fatal liquidity gaps, culminating in the sale of
              operational and under-construction assets out of bankruptcy in mid-2026.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
              - CM008
              - CM015
      - number: '2.3'
        title: Buyer Segmentation, Procurement Requirements, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Adoption within the advanced battery materials sector is governed by two major customer cohorts: global
              commodity traders and Tier 1 automotive OEMs or battery manufacturers. Automotive OEMs and cell producers
              require rigorous, multi-year product validation cycles for cathode active materials, as cell chemistry
              modifications introduce significant warranty and safety liabilities. In contrast, commodity traders like
              Trafigura procure upstream lithium carbonate under take-or-pay offtake structures, prioritizing volume
              certainty, geographic origin, and compliance with federal domestic-sourcing mandates over proprietary
              formulation lock-in. Meanwhile, consumer electronics producers evaluate localized metal salts and mixed
              metal oxides for niche circular applications. Across all buyer tiers, budget ownership rests with
              centralized corporate procurement and supply-chain officers who operate under rigid pricing parity
              expectations against Asian incumbents, limiting the willingness of commercial buyers to absorb domestic
              green premiums.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Structural Drivers, Regulatory Tailwinds, and Capital Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The primary structural driver for North American battery recycling has been regulatory intervention,
              specifically the Inflation Reduction Act's domestic sourcing rules and critical mineral tax credits.
              Primary domestic lithium extraction faces severe regulatory hurdles, frequently requiring 7 to 10 years
              for environmental permitting and more than 20 years from initial discovery to commercial production.
              Recycled black mass and secondary hydrometallurgical refining present an immediate above-ground substitute
              that bypasses primary extraction lead times. However, adoption and operational scaling face prohibitive
              bottlenecks. Green-field pCAM manufacturing campuses require massive capital expenditures, as demonstrated
              by the $1 billion Apex 1 development in Kentucky. Furthermore, heavy reliance on federal grant
              disbursements introduces critical political and counterparty risk; federal grant cancellations of $110
              million and contractual disputes over unpaid construction bills catalyzed Ascend Elements' insolvency. In
              addition, operational safety risks, such as repeated industrial fire incidents at shredding sites, pose
              persistent regulatory and community resistance.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Market Diligence Findings and Valuation Contradictions
        blocks:
          - type: paragraph
            body: >-
              Diligence reveals profound contradictions between secondary equity market valuations and distressed-asset
              liquidation values in the clean technology sector. Secondary platforms such as EquityZen and pre-IPO
              trading venues quoted private market valuations around $1.6 billion following Ascend Elements' Series D1
              round in early 2024, citing the company's patented Hydro-to-Cathode technology. Even after operational
              turmoil emerged in late 2025, trade literature continued to celebrate grant milestones, such as Poland's
              $320 million grant offer for Apex 2. Yet, actual commercial recovery in Chapter 11 realized only $31.7
              million from builder Turner-Kokosing Joint Venture for the 60-percent-complete Kentucky campus and $100
              million from Kinterra Capital for Polish assets. This disparity demonstrates that pre-IPO secondary
              metrics fundamentally failed to price in construction execution risk, federal grant clawbacks, and the
              severe liquidity constraints inherent in scaling first-of-a-kind chemical recycling infrastructure.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity Versus Intermediate Demand Mismatch
            body: >-
              The economic failure of Ascend Elements demonstrates that securing domestic mineral supply mandates cannot
              offset severe capital expenditure overruns when intermediate demand for downstream cathode materials (CAM)
              fails to materialize.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM015
          - type: callout
            title: Secondary Extraction Lead-Time Advantage
            body: >-
              With primary domestic lithium mining facing 7-to-10-year permitting cycles and over 20-year
              discovery-to-production horizons, above-ground secondary recycling from scrap and end-of-life batteries
              remains the only viable near-term path for domestic battery-grade lithium carbonate production.
            calloutType: insight
            claimRefs:
              - CM003
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set extends beyond battery recyclers. Ascend Elements competes with the
              primary-metal route used for much of global pCAM and CAM production, Chinese manufacturers that TechCrunch
              reports dominate battery materials and push costs down, and customer choices to continue importing
              qualified material rather than adopt a new domestic source. Redwood Materials is the only named recycling
              peer described in the assigned evidence: it has added a stationary-storage use for packs moving through
              its sourcing network. Internal build, dual sourcing, and black-mass-only processing remain plausible buyer
              alternatives, but this source set does not identify their current providers, scale, or economics; they are
              therefore shown as unquantified pathways rather than named competitors.
