  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Revenue Streams, Contracting Structure, and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements operates as an engineered materials and battery recycling producer transforming discarded
              lithium-ion batteries and gigafactory manufacturing scrap into battery-grade critical materials. The core
              commercial products comprise recycled battery-grade lithium carbonate, precursor cathode active materials
              (pCAM) for nickel-manganese-cobalt (NMC) chemistries, and intermediate black mass concentrate. The company
              achieved commercial-scale production of recycled lithium carbonate at greater than 99% purity at its Base
              1 facility in Covington, Georgia, in September 2025. Commercial contracts include a November 2025
              multi-year take-or-pay agreement with Trafigura Group for 15,000 metric tons of recycled lithium carbonate
              covering deliveries between 2027 and 2031, alongside a multi-year supply agreement valued at approximately
              $1 billion executed in December 2025 with an unnamed global automaker. Historical commercial deliveries
              have also been executed with Navitas Systems for defense programs and Freudenberg e-Power Systems, though
              early-stage volumes were minor compared to intended commercial runs. The commercial pricing mechanism is
              exposed to extreme underlying commodity volatility: lithium carbonate spot benchmark prices collapsed from
              $80,000 per metric ton in November 2022 to $8,259 in June 2025 before recovering to roughly $26,278 per
              metric ton in early 2026. Because pricing realized across long-term contracts is tied to prevailing metal
              indexes and direct synthesis processing premiums rather than traditional software licensing or fixed unit
              rates, pricing visibility is highly dependent on commodity market cycles and processing yield.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI004
              - CI007
      - number: '4.2'
        title: Capital Structure, Capex Overruns, and Project-Level Obligations
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements scaled through aggressive institutional equity rounds, raising $542 million in its Series
              D round in September 2023 led by Decarbonization Partners, Temasek, and Qatar Investment Authority,
              followed by a $162 million expansion in February 2024 led by Just Climate, Clearvision Ventures, and
              IRONGREY, bringing total cumulative financing across equity and grants above $1.1 billion. However,
              industrial scale-up across multiple capital projects created severe cash absorption. Its primary
              commercial facility, Apex 0 in Covington, Georgia, experienced construction and commissioning budget
              increases, escalating from an initial $43 million announcement to over $120 million in invested capital.
              Concurrently, the flagship Apex 1 project in Hopkinsville, Kentucky, was scoped as a $310 million Phase 1
              investment on 140 acres designed to supply precursor cathode active materials for up to 750,000 electric
              vehicles annually, with the overall campus projected to scale to nearly $1 billion. In November 2022,
              Ascend contracted the Turner-Kokosing Joint Venture (TKJV) under a cost-plus agreement with no guaranteed
              maximum price, leaving cost-overrun risks on Ascend Elements as owner. By May 2024, scope modifications
              and design revisions expanded the project footprint from 950,000 to 1.45 million square feet, with the
              estimated cost surging to $878 million. After disputes regarding change orders and $41.5 million in
              delinquent invoices, TKJV filed mechanics' liens totaling $138.4 million against the Hopkinsville site,
              while construction work was suspended on December 20, 2024, leaving Apex 1 halted at approximately 60%
              completion.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI010
              - CI013
              - CI015
      - number: '4.3'
        title: Federal Grant Rescissions, Chapter 11 Filing, and Liquidation Trajectory
        blocks:
          - type: paragraph
            body: >-
              The financial collapse was accelerated by federal grant cancellations and subsequent working capital
              exhaustion. In October 2022, the U.S. Department of Energy awarded Ascend Elements two Bipartisan
              Infrastructure Law grants totaling approximately $480 million: $316.2 million for pCAM infrastructure and
              $164 million for CAM manufacturing infrastructure. In February 2025, Ascend mutually agreed to return the
              $164 million CAM grant after pivoting production away from finished cathode material toward precursor
              only. In October 2025, the DOE terminated the remaining unspent portion of the $316.2 million pCAM grant
              after having disbursed $207 million, leaving roughly $110 million in expected public subsidies unfunded
              due to missed operational milestones and economic viability concerns. Cut off from public capital and
              unable to secure definitive debtor-in-possession (DIP) financing, Ascend Elements, Inc. filed for Chapter
              11 bankruptcy in the U.S. Bankruptcy Court for the Southern District of Texas on April 9, 2026. The
              petition listed $1 billion to $10 billion in estimated assets and $500 million to $1 billion in total
              liabilities, with headcount reduced to approximately 102 employees. The bankruptcy proceedings shifted
              into an expedited Section 363 sale process, culminating in a court-supervised liquidation plan that took
              effect in September 2026. In this liquidation outcome, equity ownership, including late-stage Series D
              shares issued at a $1.62 billion valuation, was effectively wiped out, with asset sale proceeds
              subordinated to mechanics' liens and secured noteholder claims.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Fatal Capex Overruns and Unhedged Cost-Plus Contract Exposure
            body: >-
              Ascend Elements executed its primary manufacturing buildout under an AIA A141 cost-plus agreement with no
              guaranteed maximum price. This structural contracting error assigned uncapped construction cost risk to
              the company rather than the contractor, enabling project estimates at Apex 1 to explode from $310 million
              to $878 million. Combined with a threefold capex overrun at the Covington facility, the company exhausted
              liquid reserves before reaching commercial pCAM cash generation.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Dependency on Government Subsidies Created Fragile Balance Sheet
            body: >-
              The business model relied heavily on non-dilutive government funding, including $480 million in Department
              of Energy grants. When federal energy policy shifted and project milestones slipped, the mutual return of
              the $164 million CAM grant and the unilateral cancellation of $110 million in remaining pCAM grant funds
              created an irrecoverable financing deficit that private markets refused to bridge.
            calloutType: insight
            claimRefs:
              - CI011
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Facility Asset Map
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements positions its product portfolio across three integrated physical outputs derived from
              closed-loop lithium-ion battery recycling: recycled black mass, battery-grade recycled lithium carbonate
              (>99% purity), and engineered precursor cathode active materials (pCAM) tailored for
              nickel-manganese-cobalt (NMC) chemistries. In conventional battery recycling workflows, spent cells and
              manufacturing scrap are shredded into black mass and then hydrometallurgically separated into individual
              virgin-grade metal salts (nickel sulfate, cobalt sulfate, manganese sulfate, and lithium carbonate), which
              must subsequently undergo chemical precipitation to synthesize new cathode precursor material. Ascend
              Elements' product strategy seeks to bypass intermediate metal-salt extraction through its patented
              Hydro-to-Cathode direct precursor synthesis process, producing engineered pCAM directly from leached black
              mass solution. Across its physical operating footprint, the company established Base 1 (Apex 0) in
              Covington, Georgia as its primary North American mechanical shredding and lithium carbonate recovery
              facility, designed with a capacity of 30,000 metric tons of battery scrap annually. Upstream pCAM
              manufacturing was planned at the 450,000-square-foot Apex 1 megasite in Hopkinsville, Kentucky, designed
              to supply cathode materials for 250,000 electric vehicles annually, while European operations are
              structured via the AE Elemental joint venture in Zawiercie, Poland and the planned Apex 2 extraction
              facility in Lower Silesia. However, following Ascend's Chapter 11 filing in April 2026, pCAM production
              remains uncommercialized as Apex 1 construction sits stalled at 60% completion.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
