      - number: '3.3'
        title: Commercial Model, Distribution, and Switching
        blocks:
          - type: paragraph
            body: >-
              Public disclosures describe relationship-based rather than catalog-priced competition. A 2023 company
              release announced a multi-year pCAM supply agreement valued at $1 billion, with options then described as
              increasing potential value to $5 billion; that historical announcement did not disclose unit pricing or
              prove present enforceability. Recycling Today later reported that a 15,000-metric-ton take-or-pay
