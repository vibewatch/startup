  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Value Chain, and Feedstock Dynamics
        blocks:
          - type: paragraph
            body: >-
              The lithium-ion battery closed-loop economy divides into two distinct operational stages: mechanical
              preprocessing to generate black mass and chemical hydrometallurgical refining into battery-grade chemical
              precursors. Ascend Elements targeted both segments through its Base 1 recycling facility in Covington,
              Georgia, and the planned Apex 1 complex in Hopkinsville, Kentucky. The addressable market comprises
              end-of-life electric vehicle batteries and gigafactory manufacturing scrap, which are transformed into
              precursor cathode active material (pCAM), cathode active materials (CAM), and recycled lithium carbonate.
              However, the market boundary excludes primary mining, traditional extraction, and downstream battery cell
              assembly. While the company established shredding capacity of 30,000 metric tons per year at its Georgia
              plant, overall North American battery cell and component production remains overwhelmingly reliant on
              foreign capacity, with 85 percent to 95 percent of production historically situated outside the United
              States and Europe. Consequently, domestic recyclers must navigate a market constrained by thin domestic
              feedstock supplies and high domestic processing hurdles.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
