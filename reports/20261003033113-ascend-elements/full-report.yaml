  - id: TE002
    title: Battery Recycling and Precursor Synthesis Workflow Analysis
    columns:
      - Workflow Stage
      - Conventional Industry Process
      - Ascend Elements Hydro-to-Cathode Solution
      - Measurable Technical Benefit
      - Technical Limitation & Process Vulnerability
    rows:
      - - Feedstock Sourcing & Sorting
        - Manual battery pack disassembly and thermal smelting (pyrometallurgy)
        - Direct mechanical shredding of whole packs and scrap under inert conditions
        - Avoids toxic gas emissions and recovers lithium lost in slag
        - Thermal runaway hazard during shredding, causing repeated fires
      - - Black Mass Leaching
        - High-temperature acid digestion followed by selective solvent extraction
        - Hydrometallurgical digestion with targeted impurity precipitation
        - Lower chemical consumption and reduced wastewater generation
        - High reagent costs if scrap composition deviates from target ratio
      - - Intermediate Refining
        - Crystallization and separation into pure NiSO4, CoSO4, and MnSO4 salts
        - 'Direct solution adjustment: skips individual metal salt separation'
        - Eliminates multi-step energy-intensive crystallization loops
        - Cannot selectively isolate single metals if market demand shifts
      - - Precursor Synthesis
        - Re-dissolution of virgin metal salts into co-precipitation CSTR reactors
        - Direct co-precipitation of NMC precursor powder straight from leach liquid
        - Up to 90% reduction in carbon footprint vs mining; reduced capex
        - Requires tight chemical process controls; never proven at commercial scale
      - - Lithium Recovery
        - Discarded in slag or recovered at low purity (<95%) via evaporative ponds
        - Selective chemical extraction producing >99% pure lithium carbonate
        - Delivers battery-grade lithium carbonate locally from domestic scrap
        - Dependent on high utility infrastructure not fully complete at Covington
      - - Cathode Finishing (CAM)
        - High-temperature calcination and solid-state sintering with lithium hydroxide
        - Planned solid-state sintering; abandoned in May 2023 pivot
        - Theoretical closed loop to final active cathode powder
        - Deemed commercially unviable by Ascend; eliminated from Apex 1 scope
    notes: >-
      Comparison derived from Ascend technical disclosures, WPI research patent documentation, and industry technical
      literature.
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE008
      - CE010
      - CE014
