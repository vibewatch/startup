      - number: '7.2'
        title: Capital Project Halts, Facility Fire Hazards, and Industrial Scaling Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements' industrial operations exhibit acute physical and execution failure modes across both its
              operating and uncompleted processing campuses. At the commercial Apex 0 (Base 1) recycling facility in
              Covington, Georgia, an aggressive scale-up resulted in capital expenditures exceeding $120 million—a
              near-threefold overrun compared to the original $43 million budget. More critically, between March 2023
              and February 2025, Apex 0 experienced 14 separate fire-related safety incidents that prompted an emergency
              operational shutdown under pressure from the Covington Fire Department. While site operations restarted in
              August 2025 following management overhauls and safety engineering retrofits, the facility still requires
              utility-connection upgrades to achieve commercial-scale, cost-viable lithium carbonate output. In
              Hopkinsville, Kentucky, the 1-million-square-foot Apex 1 manufacturing campus—initially budgeted at $310
              million to produce precursor cathode active material (pCAM) for 750,000 EVs annually—halted construction
              at approximately 60% completion on December 20, 2024 following an owner Work Suspension Directive and
              severe cost projections ballooning to $878 million. The Debtors have explicitly disavowed any intention to
              restart construction of Apex 1 during the Chapter 11 case, stranding hundreds of millions of dollars in
              capital equipment subject to reversionary federal security interests.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
