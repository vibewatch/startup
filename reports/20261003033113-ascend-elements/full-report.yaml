            title: Chapter 11 Changes the Competitive Question
            body: >-
              The key issue is no longer only whether Hydro-to-Cathode can outperform conventional processing. Buyers
              must also assess continuity of supply, unfinished-capacity funding, contract treatment, and qualification
              durability through restructuring.
            calloutType: risk
            claimRefs:
