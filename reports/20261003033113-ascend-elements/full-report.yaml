      - number: '8.2'
        title: Financing and Price Context
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $1.1 billion across 13 rounds, but its category mix includes early-stage and late-stage
              equity, debt, and grants; that total is neither revenue nor cash available at the run date. A 2023
              syndicated company announcement reported $542 million of new equity investments and said the proceeds
              would advance Apex 1 construction. The same historical record contains a $458 million post-money mark for
              an August 2022 Series C round, while later Tracxn rows leave post-money valuation blank. EquityZen
              advertises access to a current valuation and stock price only after sign-up, so the public page does not
              provide an actionable current mark. Planned project investment, funding raised, and enterprise value must
              therefore remain separate measures.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
