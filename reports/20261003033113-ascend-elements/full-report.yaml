      - number: '6.3'
        title: Named Customer Proof, Offtake Durability, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The core of Ascend Elements' commercial valuation rests on four cornerstone multi-year customer
              commitments that collectively represent over $2 billion in nominal contracted value. In November 2025,
              Ascend executed a multi-year take-or-pay agreement with Trafigura Group for 15,000 metric tons of
              battery-grade lithium carbonate scheduled between 2027 and 2031. In December 2025, the company announced
              an executed multi-year supply contract valued at approximately $1 billion with an unnamed leading global
              automaker, building upon a prior June 2023 $1 billion pCAM contract with an undisclosed major U.S. company
              with options expanding up to $5 billion. Additionally, Ascend signed an agreement with fluorinated
              solutions provider Koura for up to 5,000 metric tons annually of recycled lithium carbonate. However,
              customer concentration is acute: each of the major commercial contracts requires operational volume from
              Apex 1 or upgraded Apex 0 output. Following Ascend's Chapter 11 petition on April 9, 2026, all prepetition
              customer contracts are subject to Section 365 bankruptcy scrutiny, where counterparties face indefinite
              supply delays or potential contract rejection as assets head toward a court-supervised Section 363 sale.
            claimRefs:
