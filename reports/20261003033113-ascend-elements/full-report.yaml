      - number: '6.2'
        title: Adoption Trajectory, Operating Throughput, and Revenue Realization
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements' commercial adoption has exhibited a sharp divergence between contracted future pipeline
              value and actual operational throughput. In December 2025, company announcements highlighted
              commercial-scale production of recycled lithium carbonate at the Base 1 (Apex 0) recycling facility in
              Covington, Georgia, which operates with a nameplate input capacity of 30,000 metric tons per year of spent
              batteries and scrap. While secondary team profiles reported 2024 revenue reaching $169.4 million, verified
              Chapter 11 bankruptcy filings in the U.S. Bankruptcy Court for the Southern District of Texas revealed
              estimated 2024 operating revenue was approximately $35 million. The operational scale-up faced repeated
              interruptions: the Covington facility suffered 14 fire-related safety incidents between March 2023 and
              February 2025, causing a temporary shutdown by local municipal fire authorities before restarting in
              August 2025. Furthermore, commercial delivery of precursor cathode active material (pCAM) was tied
              directly to the flagship Apex 1 manufacturing campus in Hopkinsville, Kentucky, where construction halted
              at 60% completion in late 2024 following prime contractor payment disputes and mechanic lien foreclosures.
            claimRefs:
              - CU005
