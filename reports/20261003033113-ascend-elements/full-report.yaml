  - id: FE001
    title: Ascend Elements Closed-Loop Technology Stack
    type: stack
    summary: >-
      Layered technical and operational architecture spanning feedstock intake, mechanical shredding, chemical
      hydrometallurgy, precursor synthesis, and downstream offtake.
    data:
      layers:
        - label: Feedstock Intake & Logistics Layer
          detail: >-
            Intake of spent EV battery modules, gigafactory manufacturing scrap, and end-of-life electronics from OEM
            partners.
        - label: Mechanical Processing Layer (Base 1 / Apex 0)
          detail: >-
            Shredding, magnetic extraction, and air classification generating raw black mass intermediate at Covington,
            GA.
        - label: Hydrometallurgical Extraction Layer
          detail: >-
            Acid leaching, selective impurity separation, and extraction of battery-grade lithium carbonate (>99%
            purity).
        - label: Direct Precursor Synthesis Layer (Hydro-to-Cathode)
          detail: >-
            CSTR chemical co-precipitation synthesizing NMC precursor cathode active material (pCAM) designed for Apex
            1.
        - label: Cathode Finishing Layer (CAM / Discontinued)
          detail: >-
            Solid-state thermal sintering and calcination; abandoned in May 2023 strategic pivot as commercially
            unviable.
        - label: Downstream Commercial Offtake Layer
          detail: >-
            Product qualification and supply delivery to automotive OEMs and commodity traders under take-or-pay
            agreements.
    approximationNotes: Architecture layers correspond to Ascend's published Hydro-to-Cathode closed-loop recycling stages.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE010
