  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements targets four primary customer segments across the closed-loop battery materials value
              chain: automotive original equipment manufacturers (OEMs), global commodity trading houses, tier-1 battery
              cell manufacturers, and industrial or governmental specialty buyers. In the automotive OEM segment, buyers
              seek domestic, compliant precursor cathode active materials (pCAM) and recycled lithium carbonate to
              satisfy Inflation Reduction Act (IRA) domestic sourcing mandates and lower scope 3 embedded carbon
              emissions. The commodity trading and chemical processing segment, exemplified by Trafigura Group and Koura
              (Orbia), focuses on securing long-term merchant off-take of battery-grade lithium carbonate (>99% purity)
              to hedge structural critical-mineral supply imbalances. The tier-1 cell manufacturing segment—including
              partners such as SK Battery America and EcoPro Group—relies on stable precursor specifications to supply
              electric vehicle battery manufacturing facilities. Finally, specialty buyers, including Navitas Systems
              for defense applications and Freudenberg e-Power Systems, represent smaller pilot or project-specific
              deployments. Despite commercial interest, commercial off-take agreements are structurally dependent on
              capital-intensive refining assets that remain unfinished or legally encumbered.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
