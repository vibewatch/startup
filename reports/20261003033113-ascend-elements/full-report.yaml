    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current stage
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements was founded in 2015 and is headquartered in Westborough, Massachusetts. Its business model
              spans battery recycling and engineered materials: the company recovers critical minerals from end-of-life
              batteries and manufacturing scrap, then refines intermediates into black mass, lithium carbonate, and
              precursor cathode active material. That industrial scope is evidenced both by a company-issued technical
              recruiting document and by bankruptcy-case summaries. The current stage is not an ordinary private growth
              round. Ascend Elements, Inc. and Ascend Elements US, LLC filed for Chapter 11 on April 9, 2026, so legacy
              private-market funding and valuation figures are historical reference points rather than evidence of
              current equity value. The operating footprint includes facilities in Massachusetts, Georgia, Kentucky, and
              Poland, but construction and production status vary materially by site.
