              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              EquityZen describes generic private-company exits through an IPO, merger or acquisition, or an eligible
              secondary transaction; it does not demonstrate liquidity for Ascend Elements securities. In the current
              distress context, exit readiness instead depends on court-authorized transaction terms, transferable
              customer contracts, funded operating plans, and a transparent creditor and preference stack. Before any
              capital commitment, investors should obtain the bankruptcy docket, debtor-in-possession financing terms,
              current cash and burn, audited revenue and margin data, updated facility completion budgets, customer
              contract status, a fully diluted capitalization table, and management's restructuring plan. The thesis
              breaks if those materials do not establish durable operations, clean title to acquired assets, and a price
              with a credible downside-protected return.
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides company-quality arguments
            body: >-
              Avoid new common-equity exposure unless a court-approved transaction, verified capitalization table,
              current operating data, and downside-protected entry price establish a credible return path.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
              - CV016
