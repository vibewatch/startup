callouts:
  - calloutType: "risk"
    title: "Fatal Capex Overruns and Unhedged Cost-Plus Contract Exposure"
    body: "Ascend Elements executed its primary manufacturing buildout under an AIA A141 cost-plus agreement with no guaranteed maximum price. This structural contracting error assigned uncapped construction cost risk to the company rather than the contractor, enabling project estimates at Apex 1 to explode from $310 million to $878 million. Combined with a threefold capex overrun at the Covington facility, the company exhausted liquid reserves before reaching commercial pCAM cash generation."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
  - calloutType: "insight"
    title: "Dependency on Government Subsidies Created Fragile Balance Sheet"
    body: "The business model relied heavily on non-dilutive government funding, including $480 million in Department of Energy grants. When federal energy policy shifted and project milestones slipped, the mutual return of the $164 million CAM grant and the unilateral cancellation of $110 million in remaining pCAM grant funds created an irrecoverable financing deficit that private markets refused to bridge."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI014"
