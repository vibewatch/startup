      - number: '7.4'
        title: 下行情景架构、投资逻辑破损指标与尽调查验要点
        blocks:
          - type: paragraph
            body: >-
              评估 Ascend Elements 的剩余企业回收价值，需要严密监测法律、流动性与运营维度的关键红线。首要的下行逻辑证伪触发点，是在法庭规定的拍卖截止日前未能锁定合格的基础出价或“假马”竞购方，这将迫使第 11
              章债务人将破产程序转为第 7 章破产清算。在第 7 章程序下，机械与电气资产将面临折价远低于重置成本的困境拍卖处置，所得款项将被破产财产管理费用、DIP
              贷方、优先有担保票据持有人以及已完善手续的工程留置权人悉数分食。第二个关键失效触发点，是波兰 3.2 亿美元资助被正式撤回，或在法院批准的
              $100,000关联公司划款上限到期后海外运营实体陷入破产。最后，合计名义价值超过 $2B的破产前商业合同——包括 Trafigura 的 15,000 公吨碳酸锂照付不议协议以及 10 亿美元主机厂 pCAM
              供应合同——一旦买方拒绝承担资不抵债制造债务人的交付风险，均面临随时被拒付解除或终止的风险。尽调重心必须放在美国能源部提交的 UCC-1
              产权返还登记、克里斯蒂安县待决的留置权拍卖裁决以及破产申请后现金抵押品的消耗速率上。
            claimRefs:
              - CR014
              - CR015
              - CR016
