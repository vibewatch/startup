      - number: '7.3'
        title: 联邦补贴撤销、欧洲合资企业原料冲突与交易对手高集中度
        blocks:
          - type: paragraph
            body: >-
              监管政策反复、官方补贴撤回以及凶险的合作伙伴纠纷打乱了 Ascend Elements 的商业模式。2022 年 10 月，美国能源部（DOE）依据《两党基础设施法》批准了两笔共计 $480M
              的资助，但随后的市场恶化迫使 Ascend 于 2025 年 2 月协商放弃了 $164M 的 CAM 资助；在拨付约 $207M 后，能源部又于 2025 年 10 月单方面取消了剩余的 $316.2M
              前驱体资助。依据联邦法规（2 CFR § 910.360），能源部对补贴采购的设备保留有未分割的物权返还权益，妨碍了无负担的抵押品转让。在欧洲，Ascend 推进的波兰 Project Apex 2
              依赖波兰经济发展与技术部在欧盟《临时危机和过渡框架》下给出的 $320M（1.22B 兹罗提）附条件补贴要约；然而这笔款项尚未发生具备法律约束力的拨付，且美国第 11
              章现金管理法令对海外子公司的关联公司间资金划拨设定了 $100,000的上限，导致海外业务面临两个月内现金耗尽的紧迫风险。此外，在波兰扎维尔切各占一半（50/50）的合资企业 AE Elemental
              中，Ascend 的本地合作伙伴 Elemental Holding 正在借助 €240M政府援助同期建设具有竞争关系的 POLVOLT 精炼工厂，直接造成了区域黑粉回收的内在原料争夺冲突。
