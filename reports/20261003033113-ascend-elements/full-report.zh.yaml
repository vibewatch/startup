        title: 基地落地推进、可靠性记录与工程执行风险
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 技术的工业化落地遭遇了严重的运营可靠性崩溃、巨额资本支出超支以及致命的合同纠纷僵局。在已投入运营的卡温顿 Base 1 工厂，实际资本开支较最初 $43M 的预算飙升至逾
              $120M，且该工厂在 2023 年 3 月至 2025 年 2 月期间发生了 14 起火灾安全事故。接二连三的火灾导致当地卡温顿消防局责令停产整顿，迫使工厂关停、安全系统全面大修并更换现场管理团队，直至
              2025 年 8 月底才得以复产。在肯塔基州，由 SSOE Group 依托 Autodesk Construction Cloud 进行工程设计、并由 Turner-Kokosing Joint
              Venture（TKJV）承建的 Apex 1 基地，在 2024 年 12 月停工前，规模从最初一期预估的 $310M 急剧膨胀至 $878M。工程中途的突兀转向加剧了崩盘：2023 年 5 月，Ascend
              指示 TKJV 放弃原定的正极材料（CAM）制造工艺，认为其不再具备商业可行性，转而全面押注前驱体（pCAM）。技术与资金困境雪上加霜的是，美国能源部于 2025 年 2 月与公司协商取消了 $164M 的
              CAM 基础设施资助，并在拨付 $207M 后，于 2025 年 10 月以未能达成项目里程碑且缺乏经济可行性为由，单方面终止了 $316.2M 的前驱体资助。在总承包商申请了 $138.4M 的工程留置权以及
              2026 年 4 月申请第 11 章破产重组后，债务人已正式放弃重启 Apex 1，导致公司旗舰前驱体的商业化路径被彻底堵死。
