      - number: '6.3'
        title: 具名客户验证、包销协议稳定性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 商业估值的核心建立在四大多年期基石客户承诺之上，这些协议的名义合同价值合计超过 $2B。2025 年 11 月，Ascend 与 Trafigura Group
              签署了一项多年期照付不议协议，约定在 2027 至 2031 年间供应 15,000 公吨电池级碳酸锂。2025 年 12 月，公司宣布与某未公开的全球领先整车厂签署了一份估值约 $1B的多年期供应合同，这是在
              2023 年 6 月与一家未披露的美国大型企业签署的 $1B pCAM 合同（附带最高可扩增至 $5B 的期权）基础上的延伸。此外，Ascend 还与含氟解决方案提供商 Koura 签署了每年最多 5,000
              公吨再生碳酸锂的供应协议。然而，客户集中度极高：每一份主要商业合同都需要依赖 Apex 1 的有效产能或 Apex 0 的扩产产出。随着 Ascend 于 2026 年 4 月 9 日申请第 11
              章破产重组，所有破产申请前的客户合同均须接受《破产法》第 365 条的破产审查；随着资产走向法院监督的第 363 条出售程序，交易对手方将面临无限期的供货延期或潜在的合同被拒绝风险。
