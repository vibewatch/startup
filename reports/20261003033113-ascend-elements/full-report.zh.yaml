    sections:
      - number: '1.1'
        title: 企业定位与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 成立于 2015 年，总部位于马萨诸塞州韦斯特伯勒。商业模式覆盖电池回收与工程化材料：从报废电池和制造废料中回收关键矿物，再将中间产物精炼为黑粉（black
              mass）、碳酸锂及正极活性前驱体材料（pCAM）。公司发布的技术招聘文档与破产案件摘要均印证了上述工业生产范围。当前阶段并非普通的一级市场成长期融资。Ascend Elements, Inc. 与 Ascend
              Elements US, LLC 已于 2026 年 4 月 9 日申请第 11
              章破产重组，历史一级市场融资和估值数据仅供参考，不能证明当前股权价值。公司业务布局覆盖马萨诸塞州、佐治亚州、肯塔基州和波兰，但各工厂建设与投产状态存在实质差异。
