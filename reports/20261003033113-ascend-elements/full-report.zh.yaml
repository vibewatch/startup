  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与客户替代方案
        blocks:
          - type: paragraph
            body: >-
              实际竞争范围不仅限于电池回收企业。Ascend Elements 还要与主导全球大部分 pCAM 和 CAM 生产的原生金属路线竞争；TechCrunch
              报道称，中国厂商主导了电池材料领域并持续压低成本；此外，客户亦可选择继续进口经认证的材料，而非采购全新的本土原料。Redwood Materials
              是给定材料中唯一明确提及的回收同行：该公司为其回收网络中的电池组增加了固定式储能用途。自建产线、双供应商策略以及纯黑粉加工仍是买方可行的替代方案，但现有资料未标明相关方案的具体供应商、规模或经济效益，因此将其列为尚未量化的替代路径，而非具体具名竞品。
            claimRefs:
