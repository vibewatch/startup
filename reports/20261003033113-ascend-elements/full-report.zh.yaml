companyProfile:
  summary: >-
    Ascend Elements 总部位于马萨诸塞州，是一家电池回收与工程化电池材料制造商，2015 年成立，前身为 Battery Resourcers，2022 年更名。核心 Hydro-to-Cathode®
    工艺旨在将废旧锂电池和制造废料转化为电池级碳酸锂，以及用于新电动汽车电池的镍钴锰前驱体材料。公司在佐治亚州卡温顿建成了在运营的 Base 1 工厂，并在肯塔基州霍普金斯维尔推进规模更大的 Apex 1 前驱体（pCAM）基地，先后与
    Honda、Trafigura 和 Koura 签署战略协议，并获得美国能源部的大额资助；但补贴削减与工程延期最终导致公司于 2026 年 4 月申请第 11
    章破产重组。尽调的核心问题因而不再是技术是否真实可行，而是破产资产能否在走出重组时获得充足资金与客户信任，从而实现规模化扩张。
