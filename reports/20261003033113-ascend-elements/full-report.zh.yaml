  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 第 11 章破产重组、高级债权人控制权与诉讼风险敞口
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 面临的首要生死存亡风险，是其与债务人关联公司 Ascend Elements US, LLC 于 2026 年 4 月 9 日（破产申请日）向美国得克萨斯南区破产法院提起的第 11
              章破产司法程序。申请前的资金耗尽与突发流动性枯竭，迫使公司进入法院监督下为期 42 天的快速资产出售流程，目标是直接进入 2026 年 5 月 21 日的出售听证会，而非进行日常运营重组。Ascend 进入第
              11 章程序时既没有确定的破产保护（DIP）融资支持，也没有获批的“假马”（stalking
              horse）竞标方，维持日常运转完全依赖经各方同意使用的申请前现金抵押品，而该抵押品受制于优先有担保票据持有人设立的严格里程碑违约终止条款。依据现金抵押品法令，票据持有人对合同解除与资产出售批准保留有一票否决权。除财务破产外，Ascend
              还深陷与工程总承包商 Turner-Kokosing Joint Venture（TKJV）的高烈度诉讼：因欠款违约及争议金额达 $16M的多计工程款反诉，TKJV 登记了
              $138.4M的优先工程留置权，并在肯塔基州克里斯蒂安县巡回法院发起了留置权强制拍卖诉讼。包括 RMF Nooter 在内的分包商也提出了总额达
              $39.85M的独立优先工程留置权，引发了旷日持久的债权人优先权顺位之争，不仅让资产产权蒙上阴影，更使得次级无担保债权人与现有股东权益面临全额归零的威胁。
