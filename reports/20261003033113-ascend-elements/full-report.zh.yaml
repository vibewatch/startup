      - number: '2.2'
        title: 市场规模、实际需求与 CAM 需求脱节
        blocks:
          - type: paragraph
            body: >-
              此前官方和民间预测均设想北美将迅速建立起价值数十亿美元的本土电池材料制造基地，并受到美国能源部“电池材料加工与电池制造计划”等联邦政策的有力支撑。在巅峰期，Ascend Elements
              锁定了重磅商业承诺，包括与大宗商品贸易商 Trafigura Group 签订 15,000 公吨再生碳酸锂的多年期照付不议协议，以及与某全球领先汽车制造商签订价值近 $1B的多年期供应合同。然而在 2024
              年底至 2025 年期间，各产品类别的实际需求发生了剧烈分化。北美本土对成品 CAM 的需求未能如期放量，迫使 Ascend Elements 主动退还了 1.64 亿美元的美国能源部资助，并在 Apex 1
              完全放弃了本土 CAM 生产。尽管供应商合同中对前驱体（pCAM）和高纯碳酸锂的需求依然存在，但公司在耗资巨大的精炼生产线竣工前无法将中间材料变现，直接导致了致命的流动性枯竭，最终走向 2026
              年中在破产程序中出售在建和运营中资产的结局。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
