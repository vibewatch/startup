      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              保留的证据仅支持定性情景，不支持量化估值区间或概率推算。乐观情景需要达成经法院批准的交易：完整保留运营资产与客户关系、为剩余规模化扩建提供充足资金，并给出厘清清算优先权且干净的入场价格。基准情景是困境重组或资产出售：战略价值得以留存，但无法依据公开数据对现有普通股回报进行投资判断。悲观情景是进一步延期、合同减值或资产分拆破碎，导致普通股无法获得任何有支撑的受偿。历史产能目标同样需要对账：2022
              年的一项地方公告称年产能可满足 250,000 辆电动汽车，而 2023 年的一份公司通稿则称可满足 750,000 辆，显然对应更大的工厂规划。这两个目标都无法证明当前已有实际产能。
            claimRefs:
              - CV001
              - CV006
              - CV008
