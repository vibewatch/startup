  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业收入来源、合同架构与定价动态
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements
              是一家工程材料与电池回收制造企业，将废旧锂离子电池及超级工厂制造废料转化为电池级关键材料。核心商业产品包括回收的电池级碳酸锂、用于镍钴锰（NMC）化学体系的正极活性前驱体材料（pCAM）以及中间产物浓缩黑粉。2025
              年 9 月，公司在佐治亚州卡温顿的 Base 1 工厂实现了纯度超过 99% 的回收碳酸锂商业化量产。商业合同包括：2025 年 11 月与 Trafigura Group 签署的多年期照付不议协议，约定在
              2027 至 2031 年间供应 15,000 公吨回收碳酸锂；2025 年 12 月与某未公开全球汽车制造商签署的多年期供应协议，合同估值约 $1B。此前公司还曾向国防项目的 Navitas Systems
              以及 Freudenberg e-Power Systems 完成过商业交付，但早期交付规模与计划商业化批产相比微不足道。商业定价机制承受着底层大宗商品的剧烈波动：碳酸锂现货基准价从 2022 年 11
              月的每公吨 $80,000断崖式下跌至 2025 年 6 月的 $8,259，随后在 2026 年初反弹至每公吨约
              $26,278。由于长期合同的实际结算价格与主流金属指数及直接合成加工溢价挂钩，而非传统软件授权费或固定单价，因此价格能见度极度依赖大宗商品周期及加工收率。
