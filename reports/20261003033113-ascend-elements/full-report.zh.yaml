      - number: '3.2'
        title: 核心能力定位与差异化壁垒
        blocks:
          - type: paragraph
            body: >-
              Ascend 宣称的差异化优势在于凭借 Hydro-to-Cathode
              工艺，将废旧电池与制造废料垂直直接转化为前驱体（pCAM），相比公司材料所描述的传统工艺路线减少了中间处理环节。公开运营证据参差不齐：Recycling Today 报道称，Base 1 每年可处理 30,000
              公吨电池和废料，而 Apex 1 截至 2026 年 4 月仍在建设中。一份早期的招聘岗位描述也显示了围绕 NMC
              前驱体生产的实验室与生产工作，印证了工艺研发深度，但无法证明商业化收率、成本平价或客户认证表现。因此，其技术能力逻辑强于工程执行表现，且给定材料中没有任何独立的基准测试能够验证其相对成本、纯度、收率或客户认证表现。
