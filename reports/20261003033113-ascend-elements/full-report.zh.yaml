      - number: '5.2'
        title: Hydro-to-Cathode 工艺运行架构与技术差异化壁垒
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 宣称的核心技术差异化优势在于其闭环 Hydro-to-Cathode 工艺，该技术最初由伍斯特理工学院（WPI）研发，通过在全球拥有 154
              项已获授权和申请中专利的知识产权组合获得授权。该化学工程架构将机械破碎、酸浸、除杂以及在连续搅拌釜反应器（CSTR）中直接沉淀前驱体相结合，随后在工业电炉中完成热烧结。该工艺直接从净化浸出液中将镍、锰、钴共沉淀为
              NMC 前驱体粉末，避开了传统多级湿法冶金精炼所需的高热能、高耗水和大量化学试剂消耗。公司披露材料声称，相比传统采矿和精炼路线，直接合成路线可减少最高达 90% 的温室气体排放，降低生产废料，并回收最高达 98%
              的关键电池金属。此外，2025 年 9 月，Ascend 在卡温顿工厂展示了从黑粉中提取纯度超过 99% 的本土再生碳酸锂的能力，打破了此前对南美盐湖锂进口的绝对依赖——此前美国超过 99%
              的锂进口依赖智利和阿根廷。尽管如此，先进电池制造领域的行业人士与开发人员指出，直接前驱体合成对原料杂质耐受度要求极高：废料原料化学成分的波动（如磷酸铁锂与不同 NMC
              配比的混杂）需要大量化学调配和持续监测，在工业级生产中容易暴露出工艺控制的脆弱性。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
