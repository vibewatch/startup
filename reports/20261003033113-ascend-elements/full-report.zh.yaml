            body: >-
              EquityZen 描述了私营公司通过 IPO、并购或合资格老股交易实现退出的一般路径，并未证明 Ascend Elements
              证券具备实际流动性。在当前的困境背景下，退出准备度转而取决于法院批准的交易条款、可转让的客户合同、资金到位的运营计划，以及透明的债权与优先股堆叠。在做出任何资金承诺之前，投资人应获取破产法院案卷、DIP
              融资条款、当前现金与烧钱速度、经审计的收入与利润率数据、更新后的工厂竣工预算、客户合同履行状态、完全稀释的股权结构表，以及管理层的重组方案。若这些材料无法确立业务可持续运营、所购资产产权清晰，且入场价格具备可信的下行保护回报，整套投资逻辑便不成立。
