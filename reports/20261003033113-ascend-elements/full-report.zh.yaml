      - number: '6.2'
        title: 客户接纳走势、实际运营吞吐量与收入兑现
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 的商业落地表现出签约远期项目储备价值与实际运营产能的严重背离。2025 年 12 月，公司公告着重宣传佐治亚州卡温顿的 Base 1（Apex
              0）回收工厂实现了商业级规模的回收碳酸锂量产，该厂名义年处理废旧电池及废料产能为 30,000 公吨。尽管二级市场资料曾报道其 2024 年收入达到 1.694 亿美元，但向美国得克萨斯南区破产法院提交并核实的第
              11 章破产文件显示，2024 年预估营业收入仅约 3,500 万美元。运营规模扩张屡遭打断：卡温顿工厂在 2023 年 3 月至 2025 年 2 月期间发生了 14
              起火灾安全事故，遭到当地市政消防部门责令临时关停，直到 2025 年 8 月才恢复运营。正极前驱体（pCAM）的商业交付直接系于肯塔基州霍普金斯维尔的旗舰 Apex 1
              制造基地，在与总承包商发生工程款纠纷及留置权强制执行后，该基地已于 2024 年底停工，工程停滞在 60% 完工进度。
