            body: >-
              公开披露表明其竞争依托大客户关系而非公开标准价目表。公司 2023 年发布公告，称签署了一项价值 10 亿美元的多年期前驱体（pCAM）供应协议，且附带期权当时据称可将潜在价值推高至 50
