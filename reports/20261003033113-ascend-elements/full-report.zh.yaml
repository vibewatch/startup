      - number: '7.2'
        title: 基建项目停工、工厂火灾隐患与工业化规模失效模式
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 的工业化运营在投产基地与未完工基地均暴露出严重的物理与执行失效。在佐治亚州卡温顿的商业级 Apex 0（Base 1）回收工厂，激进扩产导致资本支出超过 $120M——相较于最初
              $43M 的预算超支近三倍。更为关键的是，在 2023 年 3 月至 2025 年 2 月期间，Apex 0 发生了 14
              起独立的火灾安全事故，在卡温顿消防局的压力下被迫紧急停产。尽管在管理层调整和安全工程改造后工厂于 2025 年 8
              月复工，但该厂仍需公用管网接驳升级才能实现具备成本竞争力的商业化碳酸锂产出。在肯塔基州霍普金斯维尔，占地 100 万平方英尺的 Apex 1 制造基地（最初预算 $310M，规划年产能为 75
              万辆电动汽车提供前驱体材料）在业主发出停工指令以及成本预估暴增至 $878M后，于 2024 年 12 月 20 日停工，施工进度停滞在约 60%。债务人已明确表示无意在第 11 章案件期间重启 Apex 1
              的建设，导致数亿美元的机器设备闲置搁浅，且这些设备还背负着附带返还性质的联邦担保权益。
