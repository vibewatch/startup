      - number: '4.3'
        title: 联邦补贴撤回、第 11 章破产申请与清算走向
        blocks:
          - type: paragraph
            body: >-
              联邦补贴取消及随之而来的营运资金枯竭加速了这场财务崩塌。2022 年 10 月，美国能源部根据《两党基础设施法》向 Ascend Elements 批复两笔总计约 $480M 的资助：$316.2M
              用于前驱体（pCAM）基础设施，$164M 用于正极材料（CAM）制造基础设施。2025 年 2 月，公司战略转向放弃成品正极材料并专注前驱体，双方同意退还 $164M的 CAM 资助。2025 年 10
              月，在累计拨付 $207M 后，能源部以未达成运营里程碑及经济可行性存疑为由，单方面终止了 $316.2M 前驱体资助中未使用的剩余资金，导致原本指望的约 $110M
              公共补贴落空。政府资金断供且无法敲定确切的破产保护（DIP）融资，Ascend Elements, Inc. 最终于 2026 年 4 月 9 日向美国得克萨斯南区破产法院申请第 11
              章破产重组。破产申请文件列出的预估资产为 $1B 至 $10B，总负债为 $500M 至 $1B，在职员工精简至约 102 人。破产程序随后转向快速推进的《破产法》第 363 条资产出售，并在 2026 年 9
              月正式生效由法院监管的清算方案。在该清算结果下，包括以 $1.62B 估值发行的后期 D 轮股份在内的股东权益被全额归零，资产出售所得款项优先用于清偿工程留置权与有担保票据持有人的债权主张。
