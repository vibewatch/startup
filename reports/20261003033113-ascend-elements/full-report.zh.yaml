      - number: '2.3'
        title: 客户群体细分、采购要求与预算归属
        blocks:
          - type: paragraph
            body: >-
              先进电池材料领域的采购主要由两大客户群体主导：全球大宗商品贸易商，以及汽车一级主机厂或电芯制造商。汽车主机厂与电芯厂商对正极活性材料有着长达数年的严格产品验证周期，因为电芯化学成分的改动会带来巨大的质保与安全责任隐患。相比之下，Trafigura
              等大宗商品贸易商通过照付不议的包销协议采购上游碳酸锂，相比专有配方绑定，更看重供货规模确定性、产地来源以及是否符合联邦本土采购法规。消费电子产品生产商则评估将本地化金属盐与混合金属氧化物用于细分循环应用。在所有客户层级中，预算决策权均归属于集团集中采购及供应链负责人，他们对标亚洲现有成熟厂商有着严苛的平价预期，极大地限制了商业买家为本土绿色溢价买单的意愿。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
