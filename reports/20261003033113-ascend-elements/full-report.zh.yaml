      - number: '5.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 核心技术与工业化规模扩张之间的结构性脱节
            body: >-
              Ascend Elements 专利所有的 Hydro-to-Cathode
              技术代表了一项经检验的真实化工创新，能够直接利用回收黑粉合成电池级正极活性前驱体材料，并显著节省能耗与碳排放。然而，公司未能将实验室与中试成果转化为可靠的工业化落地。由于 Apex 1
              上不封顶的成本加成建造合同造成致命超支、卡温顿 Base 1 频发严重火灾隐患，以及能源部单方面取消资助，其技术产线在工程进度达到 60% 时陷入停滞搁浅，且毫无破产重组融资来完成资产建设。
