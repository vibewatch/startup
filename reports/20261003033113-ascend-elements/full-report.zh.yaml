  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 经法院批准的交易保全了核心业务与合同；新资金全额保障规模化扩产
        - 具备潜在战略价值，但在价格、债权主张和股权比例披露前，无法给出估值区间或目标回报
        - 合同转让、完工资金、优先清算权遗留负担以及业务重启
        - 属于条件性判断；指定证据未包含经核实的重整方案或出清价格
      - - 基准
        - 困境重组或资产出售保全了部分资产，但未能确立普通股价值
        - 定价未知时应回避；只针对附带正式文件的注资或资产交易做投资研判
        - 股权稀释、债权顺位、工程造价超支以及公开运营披露薄弱
        - 鉴于破产困境报道及关键估值参数缺失，这是目前最站得住脚的研判立场
      - - 悲观
        - 工期延误、合同减值或资产拆分蚕食战略价值
        - 普通股清偿率可能归零，但尚不支持给出精确的清偿估算
        - 流动性断裂、厂房未完工、客户流失以及出售流程不确定性
        - 缺少法院、现金流和竞购报价数据，无法量化测算
    notes: 各情景均为定性分析，因所指定资料未披露当前竞买报价、企业价值、净负债、债权顺位或完全稀释资本结构表。
