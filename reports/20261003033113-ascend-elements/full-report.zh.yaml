  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、目标价值链与原料动态
        blocks:
          - type: paragraph
            body: >-
              锂电池闭环循环经济分为两个截然不同的运营阶段：机械预处理生成黑粉（black mass），以及湿法冶金化学精炼产出电池级化学前驱体。Ascend Elements 试图通过佐治亚州卡温顿的 Base 1
              回收工厂与肯塔基州霍普金斯维尔规划的 Apex 1
              基地覆盖这两个环节。其目标市场包括报废电动汽车电池和超级工厂制造废料，加工转化为正极活性材料前驱体（pCAM）、正极活性材料（CAM）以及再生碳酸锂。不过，该市场边界排除了原矿开采、传统提纯以及下游电芯组装。尽管公司在佐治亚工厂建立了每年
              30,000 公吨的破碎产能，但北美电池电芯及组件整体生产仍极度依赖海外产能，历史上 85% 至 95% 的产能位于欧美以外。因此，本土回收企业必须在本土原料供应不足与本土加工门槛过高的双重制约下求生。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
