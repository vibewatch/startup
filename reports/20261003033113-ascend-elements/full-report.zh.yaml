      - number: '2.4'
        title: 结构性驱动因素、监管红利与资本瓶颈
        blocks:
          - type: paragraph
            body: >-
              推动北美电池回收的核心结构性驱动力来自政策干预，特别是《通胀削减法案》（IRA）的本土采购要求与关键矿物税收抵免。北美本土锂矿开采面临严峻的监管审批阻碍，环境许可审批往往耗时 7 至 10
              年，从初步探矿到商业化投产通常需要 20
              年以上。回收黑粉及二次湿法冶金精炼构成了一种立即可用的地面替代矿源，避开了原矿开采的漫长交付周期。然而，市场接纳与产能爬坡面临极高门槛。新建前驱体（pCAM）制造基地需要耗费巨额资本支出，耗资 $1B的肯塔基州
              Apex 1 项目便是明证。过度依赖联邦补贴拨款也带来了关键的政治与交易对手风险：$110M 联邦资助遭到取消，加之拖欠工程款合同纠纷，直接触发了 Ascend Elements
              的破产清算。破碎工厂反复发生的工业火灾等安全隐患，也引发了持续的监管与社区阻力。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 市场尽调发现与估值矛盾
        blocks:
          - type: paragraph
            body: >-
              尽调揭示出清洁技术领域老股二级市场估值与困境资产清算价值之间的巨大脱节。在 Ascend Elements 于 2024 年初完成 D1 轮融资后，EquityZen 等老股交易平台和 Pre-IPO
              交易场所援引其专利技术 Hydro-to-Cathode，给出约 $1.6B 的一级市场估值。即便在 2025 年底运营陷入动荡后，行业报道仍继续赞誉其补贴里程碑，例如波兰为 Apex 2 提供的 $320M
              补贴要约。然而，在第 11 章破产程序中，实际商业回收价值仅包括：总承包商 Turner-Kokosing Joint Venture 就完工六成 的肯塔基基地接盘出资 $31.7M，以及 Kinterra
              Capital 为波兰资产出资 $100M。这种巨大落差表明，Pre-IPO 二级交易指标根本未能将工程建设执行风险、联邦补贴追回风险，以及首台套化工回收基础设施规模化过程中固有的严重流动性瓶颈计入价格。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.6'
        title: 专题图表
        blocks:
          - type: callout
            title: 资本密集度与中间产物需求错配
            body: Ascend Elements 的商业失败证明，一旦下游正极材料（CAM）的中间需求未能如期爆发，即便手握本土矿产保供政策红利，也无法对冲严重的资本支出超支风险。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM015
          - type: callout
            title: 二次提取的交付周期优势
            body: 鉴于北美本土原矿提锂面临长达 7 至 10 年的环评审批周期，且从探矿到投产需历时 20 年以上，利用废料和报废电池进行地面二次回收，仍是短期内本土生产电池级碳酸锂唯一可行的路径。
            calloutType: insight
            claimRefs:
