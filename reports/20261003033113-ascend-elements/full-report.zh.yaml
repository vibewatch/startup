  - id: TE002
    title: 电池回收与前驱体合成工艺流程分析
    columns:
      - 工艺阶段
      - 传统行业工艺
      - Ascend Elements Hydro-to-Cathode 方案
      - 可量化技术收益
      - 技术局限与工艺薄弱点
    rows:
      - - 原料采购与分选
        - 人工拆解电池包与高温熔炼（火法冶金）
        - 惰性环境下对整包及废料直接机械破碎
        - 避免有毒气体排放，并回收炉渣中流失的锂
        - 破碎期间存在热失控风险，导致屡次起火
      - - 黑粉浸出
        - 高温酸浸后进行选择性溶剂萃取
        - 湿法冶金酸浸结合定向杂质沉淀
        - 降低化学品消耗，减少废水产生
        - 废料成分偏离目标配比时试剂成本高昂
      - - 中间品精炼
        - 结晶并分离为纯净的 NiSO4、CoSO4 与 MnSO4 盐
        - 直接溶液调配：跳过单一金属盐分离步骤
        - 消除多道高能耗结晶循环
        - 市场需求变化时无法选择性分离单一金属
      - - 前驱体合成
        - 原生金属盐重新溶解后注入共沉淀 CSTR 反应器
        - 直接从浸出液共沉淀制备 NMC 前驱体粉末
        - 相比矿产开采碳足迹降低高达 90%；降低资本开支
        - 要求严密化工工艺控制；从未在商业化规模上得到验证
      - - 锂回收
        - 随炉渣废弃，或经蒸发池低纯度回收（<95%）
        - 选择性化学萃取生产纯度 >99% 的碳酸锂
        - 利用本土废料在当地交付电池级碳酸锂
        - 依赖高负荷公用工程设施，而 Covington 厂区尚未完全建成
      - - 正极成品精加工（CAM）
        - 高温煅烧以及与氢氧化锂进行固相烧结
        - 原计划固相烧结；在 2023 年 5 月转型中放弃
        - 直通最终活性正极粉末的理论闭环
        - 被 Ascend 认定商业上不可行；已从 Apex 1 范围中剔除
    notes: 对比来自 Ascend 技术披露、WPI 研究专利文件以及行业技术文献。
