  - id: FI001
    title: 收入模型传导图
    type: flow
    summary: 流程传导图：追踪原料投入、中间加工至商业化营收及资本偿付义务的转化链条。
    data:
      nodes:
        - id: feedstock-intake
          label: 电池原料流入
          detail: 自汽车与工业伙伴处回收的废旧锂电池及超级工厂废料
        - id: covington-processing
          label: Base 1 湿法冶炼精炼
          detail: Covington 工厂最高可处理 30,000 MT 原料，转化为黑粉及纯度 >99% 的碳酸锂
        - id: lithium-monetization
          label: 碳酸锂销售
          detail: 依据与 Trafigura 签署的 15,000 MT 照付不议包销协议进行商业化交付
        - id: apex1-pcam-pause
          label: Apex 1 pCAM 制造（已暂停）
          detail: 位于 Hopkinsville 的工厂工程进度达 60%，因 $138.4M 承包商留置权与 DOE 拨款削减而停工
        - id: capex-liabilities
          label: 资本消耗与债务结构
          detail: 负债及承包商债权主张规模达 $500M-$1B，最终触发第 11 章破产清算
        - id: liquidation-resolution
          label: 第 363 条清算方案
          detail: 依据 2026 年 9 月生效的重整计划，在法院监督下出售资产，股权处于劣后清偿地位
      edges:
        - from: feedstock-intake
          to: covington-processing
        - from: covington-processing
          to: lithium-monetization
        - from: covington-processing
          to: apex1-pcam-pause
        - from: apex1-pcam-pause
          to: capex-liabilities
        - from: capex-liabilities
          to: liquidation-resolution
    approximationNotes: 反映运营与资本转化动态；资金结算流向体现第 11 章破产受偿顺位分配。
    claimRefs:
      - CI001
      - CI002
      - CI009
      - CI010
      - CI013
      - CI015
  - id: FE001
    title: Ascend Elements 闭环技术架构
    type: stack
    summary: 涵盖原料进料、机械破碎、化学湿法冶金、前驱体合成及下游消纳的分层技术与运营架构。
    data:
      layers:
        - label: 原料进料与物流层
          detail: 从 OEM 合作方接收废旧电动汽车电池模组、超级工厂制造废料以及报废消费电子。
        - label: 机械加工层（Base 1 / Apex 0）
          detail: 在佐治亚州 Covington 经破碎、磁选与气流分选，产出粗制黑粉中间体。
        - label: 湿法冶金提取层
          detail: 经酸浸、选择性杂质分离，提取电池级碳酸锂（纯度 >99%）。
        - label: 直接前驱体合成层（Hydro-to-Cathode）
          detail: 专为 Apex 1 设计的连续搅拌釜反应器（CSTR）化学共沉淀工艺，用于合成 NMC 前驱体正极活性材料（pCAM）。
        - label: 正极成品精加工层（CAM / 已终止）
          detail: 固态热烧结与煅烧工艺；在 2023 年 5 月的战略转向中因缺乏商业可行性而放弃。
        - label: 下游商业消纳层
          detail: 按照付不议协议向汽车 OEM 及大宗商品交易商提供产品认证与供货交付。
    approximationNotes: 架构层级对应 Ascend 公开发布的 Hydro-to-Cathode 闭环回收各阶段。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 客户商业化旅程与破产价值链瓶颈
    type: journey-map
    summary: 客户旅程阶段可视化映射：贯穿原料采购至精炼材料交付，详析第 11 章破产下的卡点。
    data:
      nodes:
        - id: stage-1
          label: 原料采购
          detail: 从电芯厂（如 SK Battery America）回收电池废料及废旧电动汽车电池包
        - id: stage-2
          label: 机械预处理
          detail: Covington Base 1 破碎产出黑粉；期间遭遇 14 起安全事故及费用超支干扰
        - id: stage-3
          label: 化学精炼
          detail: 在 Apex 0 湿法提取电池级 Li2CO3（纯度 >99%）
        - id: stage-4
          label: 前驱体合成（pCAM）
          detail: Apex 1（Hopkinsville）原计划采用 Hydro-to-Cathode 生产 pCAM；工程在 60% 进度停工
        - id: stage-5
          label: 商业包销执行
          detail: Trafigura 照付不议合同及 $1B OEM 订单项下的交付；在 Chapter 11 程序中被冻结
        - id: stage-6
          label: 客户合同重组审查
          detail: 法院监督的 363 资产出售期间，针对 Section 365 项下合同承继或解除的审查
    approximationNotes: 各阶段反映了公司公告及法庭文件中披露的物理加工顺序与商业包销依存关系。
    claimRefs:
      - CU001
      - CU005
      - CU007
