  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体细分与买方经济学
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements
              瞄准闭环电池材料价值链中的四大核心客户群体：汽车整车厂（OEM）、全球大宗商品贸易商、一级电芯制造商以及工业或政府特种采购方。汽车整车厂群体寻求合规的本土前驱体（pCAM）与回收碳酸锂，以此满足《通胀削减法案》（IRA）的本土采购要求并降低范围三隐含碳排放。以
              Trafigura Group 和 Koura（Orbia）为代表的大宗商品贸易与化工加工群体，侧重锁定电池级碳酸锂（纯度 >99%）的长期现货商业包销，对冲关键矿物的结构性供需失衡。一级电芯制造群体（包括 SK
              Battery America 与 EcoPro Group 等合作伙伴）依赖稳定的前驱体规格参数，为电动汽车电池工厂稳定供货。面向国防应用领域的 Navitas Systems 及 Freudenberg
              e-Power Systems 等特种采购方则代表规模较小的试点或特定项目交付。尽管商业意向明确，但商业包销协议在结构上高度依赖资本密集型的精炼资产，而这些资产要么尚未完工，要么背负了法律纠纷负担。
