      - number: '3.4'
        title: 护城河持久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河持久度的核心考验在于工艺专利及客户关系能否扛过融资与扩产风险。Ascend 于 2026 年 4 月进入第 11 章破产程序，同期报道称 Apex 1 仍在建设中；即便 Base 1
              仍在运转且包销协议名义上依然有效，这种局面也大幅削弱了买方信心。与此同时，Redwood
              拓展电网级储能业务的做法表明，回收网络能够支撑第二条变现路径，而中国厂商则牢牢保持着规模与成本优势。因此，现有证据指向一条有条件的护城河：闭环工艺一体化或许能带来产品差异化，但融资渠道、按期完成认证、原料掌控力以及具备法律约束力的采购承诺，才决定了这种差异化能否转化为持久的渠道壁垒。
