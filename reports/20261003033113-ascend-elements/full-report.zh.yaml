  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与生产基地资产分布
        blocks:
          - type: paragraph
            body: >-
              Ascend Elements 将其产品组合定位于闭环锂电池回收衍生的三大集成实物产物：回收黑粉、电池级回收碳酸锂（纯度
              >99%），以及针对镍钴锰（NMC）化学体系定制的工程化正极活性前驱体材料（pCAM）。在传统电池回收流程中，废旧电芯与制造废料先被破碎为黑粉，再通过湿法冶炼分离成单一的原生级金属盐（硫酸镍、硫酸钴、硫酸锰和碳酸锂），后续还需经过化学沉淀来合成新的正极前驱体材料。Ascend
              Elements 的产品策略试图通过专利技术 Hydro-to-Cathode 直接前驱体合成工艺绕过中间金属盐提取环节，直接从浸出黑粉溶液中制备工程化前驱体。在实体运营基地布局上，公司在佐治亚州卡温顿建立了
              Base 1（Apex 0）作为北美主要的机械破碎与碳酸锂回收基地，设计年处理电池废料产能为 30,000 公吨。上游前驱体制造原规划在肯塔基州霍普金斯维尔占地 45 万平方英尺的 Apex 1
              大型基地，设计年产能可为 25 万辆电动汽车供应正极材料；欧洲业务则通过位于波兰扎维尔切（Zawiercie）的合资企业 AE Elemental 及位于下西里西亚省规划的 Apex 2 提取工厂展开。然而，随着
              Ascend 于 2026 年 4 月申请第 11 章破产重组，由于 Apex 1 施工停滞在 60% 的完工进度上，前驱体生产仍未实现商业化。
