          claimRefs: [CO008, CO016]
    approximationNotes: >-
      Year- or month-level dates are used where the assigned evidence does not
      support a more precise date; milestones include company claims and planned
      projects and do not imply that announced capacity was achieved.
    claimRefs: [CO001, CO004, CO007, CO008, CO010, CO011, CO012, CO013, CO015, CO016]
callouts:
