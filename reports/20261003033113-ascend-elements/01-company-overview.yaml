company:
  name: Ascend Elements
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ascend Elements is a Westborough-based battery-materials company founded in
    2015 around technology for converting used lithium-ion batteries and factory
    scrap into battery-grade materials. Its April 2026 Chapter 11 filing makes
    restructuring and asset-sale outcomes, rather than its February 2024 private
    valuation, the controlling facts for current-stage diligence.
sections:
  - id: identity-and-current-stage
    title: Identity and current stage
    body: >-
      Ascend Elements was founded in 2015 and is headquartered in Westborough,
      Massachusetts. Its business model spans battery recycling and engineered
      materials: the company recovers critical minerals from end-of-life batteries
      and manufacturing scrap, then refines intermediates into black mass, lithium
      carbonate, and precursor cathode active material. That industrial scope is
      evidenced both by a company-issued technical recruiting document and by
      bankruptcy-case summaries. The current stage is not an ordinary private
      growth round. Ascend Elements, Inc. and Ascend Elements US, LLC filed for
      Chapter 11 on April 9, 2026, so legacy private-market funding and valuation
      figures are historical reference points rather than evidence of current
      equity value. The operating footprint includes facilities in Massachusetts,
      Georgia, Kentucky, and Poland, but construction and production status vary
      materially by site.
    claimRefs: [CO001, CO002, CO003, CO008, CO010]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      The founding group publicly associated with the company comprises Diran
      Apelian, Eric Gratz, and Yan Wang. Current-source pages identify Linh Austin
      as President and CEO, Eric Gratz as Chief Technology Officer, and Ahmed
      Allouache as Chief Financial Officer. The retained court-derived summaries
      also say eight of eleven senior leaders joined during or after 2025, indicating
      that the team overseeing restructuring is substantially different from the
      group that led the capital-intensive expansion. That transition may improve
      turnaround discipline, but it also creates key-person and institutional-memory
      risk around Austin, Gratz, and the newer finance leadership. Public materials
      do not provide a complete current board roster, committee structure, voting
      rights, or post-petition governance map; those items require direct corporate
      and court-document diligence rather than inference from older private-market
      profiles.
    claimRefs: [CO004, CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital history and stakeholder reset
    body: >-
      Forge's August 2026 profile reports $924.19 million of total funding and a
      $1.62 billion post-money valuation for its February 2024 Series D record.
      Those labels and the reported period must be retained: the figure is neither
      revenue nor cash available in October 2026, and Chapter 11 makes it unsuitable
      as a current valuation. Earlier public-development materials described $480
      million of federal grants and a potential matched project investment exceeding
      $960 million, while the bankruptcy evidence says Apex 1 is only about 60%
      complete, paused, and non-revenue-generating. The stakeholder hierarchy has
      therefore shifted from growth investors and public grant providers toward
      secured creditors, construction lien claimants, prospective asset purchasers,
      employees, customers, and foreign joint-venture partners. The absence of a
      retained final sale result, confirmed DIP package, or post-restructuring cap
      table is a material gap, not evidence that legacy ownership remains intact.
    claimRefs: [CO011, CO012, CO013, CO014, CO016]
    tableRefs: [TO003]
  - id: milestones-and-scale
    title: Milestones, operating scale, and unresolved metrics
    body: >-
      The milestone record shows a rapid transition from a 2015 research spinout
      to multi-site industrial expansion, followed by a 2025 leadership overhaul
      and the April 2026 bankruptcy filing. Georgia began operating in 2022 and
      later produced recycled lithium carbonate at commercial scale in 2025,
      according to company claims repeated by independent sources. Poland added an
      operating joint venture in 2024, while Kentucky's Apex 1 remained unfinished
      and paused at the petition date. Petition-date staffing was approximately
      102 employees, but the assigned evidence does not establish October 2026
      headcount, current revenue or run-rate, customer count, or a reconciled
      investor-only funding total. Those omissions limit any current scale claim.
      The timeline therefore distinguishes dated operating milestones from planned
      capacity and financing announcements, and it treats bankruptcy as the latest
      verified corporate-stage event.
    claimRefs: [CO001, CO007, CO008, CO009, CO010, CO013, CO014, CO015]
    figureRefs: [FO001]
