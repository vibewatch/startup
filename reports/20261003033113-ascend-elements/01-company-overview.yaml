          tone: positive
          claimRefs: [CO012]
        - date: "2024-09"
          label: Poland joint venture opened
          detail: "The Zawiercie joint venture entered commercial operation, though current output was described as small."
          tone: neutral
          claimRefs: [CO013]
        - date: "2025"
          label: Leadership and operations reset
          detail: "Most senior leaders joined during or after 2025, while Georgia reported commercial-scale recycled lithium carbonate production."
          tone: warning
          claimRefs: [CO007, CO015]
        - date: "2026-04-09"
