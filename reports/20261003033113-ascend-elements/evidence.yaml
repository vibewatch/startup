evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      Current revenue, revenue run-rate, customer count, October 2026 headcount, unrestricted cash, and a reconciled
      investor-only funding total.
    whyItMatters: >-
      These quantities determine operating scale and liquidity but cannot be inferred from legacy financing, grants,
      commitments, or petition-date staffing.
    diligencePath: >-
      Obtain October 2026 management accounts, payroll roster, customer schedule, bank statements, and a
      financing-source reconciliation.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete current executive and board roster, committee mandates, voting rights, retention agreements, and
      post-petition reporting lines.
    whyItMatters: Public profiles do not establish complete decision authority or succession coverage during restructuring.
    diligencePath: >-
      Obtain the current organization chart, board minutes, governance documents, executive contracts, and key-person
      retention plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Complete capitalization table, creditor matrix, lien-priority schedule, grant restrictions, and joint-venture
      control provisions.
    whyItMatters: The sample stakeholder map cannot determine economic ownership, recoveries, or consent rights after a sale.
    diligencePath: >-
      Review the bankruptcy claims register, financing orders, cap table, grant agreements, and Poland joint-venture
      shareholder agreement.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: restructuring
    missingEvidence: >-
      Final DIP terms, winning bid or confirmed plan, creditor-priority resolution, sale closing evidence, and the
      post-restructuring ownership structure.
    whyItMatters: These outcomes determine which assets and contracts survive and whether legacy equity retains any value.
    diligencePath: >-
      Pull the current bankruptcy docket and obtain entered financing, sale, confirmation, and closing documents plus
      management's post-close cap table.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Named-peer list with current capacity, funding, target customers, product specifications, unit prices, discounts,
      and contract terms.
    whyItMatters: >-
      Without consistent denominators, the chapter cannot rank delivered cost, customer value, or commercial scale
      across competitors.
    diligencePath: >-
      Obtain current competitor filings, product specifications, procurement records, customer contracts, and
      independent market-share data.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: post-petition-contracts
    missingEvidence: >-
      Post-petition enforceability, realized pricing, delivery milestones, qualification status, and termination rights
      for Ascend's customer and offtake agreements.
    whyItMatters: >-
      A nominally outstanding agreement may not translate into revenue, switching cost, or durable distribution during
      restructuring.
    diligencePath: >-
      Review the bankruptcy docket, assumed-or-rejected contract schedules, unredacted agreements, customer
      confirmations, and shipment records.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
