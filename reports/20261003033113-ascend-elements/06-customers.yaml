callouts:
  - calloutType: "risk"
    title: "Customer Contract Enforceability in Chapter 11 Proceedings"
    body: "Ascend Elements' customer commitments represent over $2 billion in headline off-take value, but the Debtors' Chapter 11 petition renders these contracts subject to assumption, assignment, or rejection under Bankruptcy Code Section 365. Because the company has expressly disavowed restarting Apex 1 construction during bankruptcy, commitments requiring domestic pCAM volume cannot be fulfilled on their original delivery schedules, creating substantial cancellation and damage claims."
