company:
  name: 80 Acres Farms
chapter:
  number: 1
  title: Company Overview
  summary: >-
    80 Acres Farms is a Hamilton, Ohio-based vertical farming company co-founded in 2015 by
    food-industry veterans Mike Zelkind and Tisha Livingston. The company has raised more than
    $370 million across multiple rounds led by General Atlantic, Siemens Financial Services,
    and Virgo Investment Group, and in August 2025 merged with Soli Organic to form a combined
    indoor farming network with projected first-year revenues approaching $200 million across
    17,000+ U.S. retail storefronts. Post-merger integration includes a May 2026 facility
    closure in Virginia and reflects industry-wide pressure on vertical-farming unit economics.

sections:
  - id: identity-and-business-model
    title: Identity, Mission, and Business Model
    body: >
      80 Acres Farms is a private, growth-stage vertical farming company headquartered at 345
      High Street, 7th Floor, Hamilton, Ohio 45011. Founded in 2015 by veteran food industry
      executives Mike Zelkind and Tisha Livingston in the Cincinnati area, the company has
      since relocated its headquarters to Hamilton while maintaining farms in multiple states.
      Its stated mission is to grow the freshest, safest, and most nutritious produce by
      controlling every aspect of the indoor growing environment, using 100% renewable
      electricity and roughly 95% less water per pound of produce than conventional
      agriculture.


      The business model centers on vertically integrated indoor farming: the company develops
      and operates large-scale controlled-environment farms using its proprietary GroLoop
      technology platform (developed by its wholly owned subsidiary Infinite Acres), grows a
      diversified produce portfolio—salad blends, salad kits, herbs, microgreens, tomatoes,
      and dressings—and distributes primarily through major grocery and foodservice channels
      under its own branded label. Products are available at Kroger, Whole Foods, Meijer, and
      thousands of other retail locations. The company does not publicly disclose revenue by
      product line or its gross margin structure.


      Following the August 2025 merger with Soli Organic, the combined company also sells
      USDA Certified Organic herbs and greens under the Soli Organic brand, extending the
      product portfolio into field-grown organic produce and reaching more than 17,000 U.S.
      retail storefronts. The company generates revenue from retail product sales; it does not
      currently publish subscriber, licensing, or SaaS revenue streams for the Infinite Acres
      technology platform, though it is exploring commercializing GroLoop for third-party
      growers over time.
