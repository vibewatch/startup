  - id: scale-milestones-and-market-presence
    title: Scale, Milestones, and Market Presence
    body: >
      The company's operational footprint has expanded through a combination of new farm builds,
      technology-led retrofits of acquired facilities, and the August 2025 merger with Soli
      Organic. The Kentucky farm, opened in September 2023, is the largest single facility:
      a 200,000-square-foot, $95 million investment in Boone County that is approximately
      three times larger and four times as productive as the company's prior largest farm,
      with the capacity to produce up to 40 million servings of produce per year. Kentucky
      state incentives (approved by KEDFA in January 2022) supported job creation.


      Following the merger, the combined company operates seven nationally distributed vertical
      farms with total annual production capacity of 15 to 20 million pounds of fresh produce,
      serves more than 17,000 retail storefronts across the United States, and employs
      approximately 1,400 people (revised to more than 1,200 following the May 2026
      Harrisonburg closure). Products reach Kroger, Whole Foods, Meijer, HEB, Walmart, and
      thousands of regional grocers.


      Revenue is not publicly disclosed with precision. In February 2025, the company reported
      a 60% compound annual growth rate over the prior three-year period. The combined entity's
      projected first-year revenue approaches $200 million per the August 2025 merger press
      release. Pre-merger 80 Acres alone served over 1,500 retailers with a reported revenue
      CAGR of 60% since 2021. The company has been a Kroger supplier since 2019, growing from
      a single Cincinnati store to roughly 1,000 Kroger locations announced in 2023.
