  - id: adverse-events-and-risk-context
    title: Adverse Events and Industry Risk Context
    body: >
      In May 2026, 80 Acres Farms announced the closure of its Harrisonburg, Virginia
      facility—the former Soli Organic/Shenandoah Growers site—effective July 21, 2026,
      resulting in approximately 80 job losses. CEO Mike Zelkind cited strategic consolidation
      of operations toward Atlanta and Indianapolis as the driver; a WARN Act notification was
      filed with the state. The closure follows Soli Organic's pre-merger cut of 128 jobs in
      Georgia just days before the August 2025 merger announcement, signaling that operational
      rationalization was an explicit feature, not an unexpected consequence, of the
      combination.


      Industry-level headwinds compound company-specific risks. Controlled environment
      agriculture investment fell by approximately 53% year over year in 2024, according to
      the 2025 AgFunder Global AgriFoodTech Investment Report, as investors shifted focus from
      expansion to profitability. High-profile bankruptcies of Bowery Farming (2024), Aerofarms,
      and Plenty's valuation declines have increased market skepticism. Industry analysts have
      specifically criticized 80 Acres' $95 million Kentucky facility as an example of
      high-CapEx risk relative to the low-margin economics of commodity produce like leafy
      greens. The unit-economics question—whether vertical farming can break even and generate
      returns on infrastructure of this scale—remains open and material to any investment
      judgment.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO039
      - CO040

