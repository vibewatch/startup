- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Integration and capacity rationalization
    - Additional closure or WARN notice after Harrisonburg
    - Any new material site closure or >50-worker notice within 12 months
    - Move to avoid / re-underwrite as unresolved overcapacity rather than efficient redundancy
  - - Bridge-financing risk
    - Next disclosed financing event
    - Small insider-heavy bridge, highly structured project financing, or another revenue-undisclosed filing without operating proof
    - Assume weaker liquidity than planned and demand stronger downside protection
  - - Customer concentration risk
    - Kroger or other anchor-account signal
    - Planned rollout stalls, SKU assortment shrinks, or no new named large accounts emerge
    - Increase concentration discount and require contract evidence before new capital
  - - Regulatory / quality risk
    - FDA, certifier, or retailer compliance event
    - Recall, warning letter, mock-recall failure, or organic-label correction across a major SKU family
    - Immediate investment hold; treat as thesis-break until corrected and audited
  - - Energy / vendor dependence
    - Power-cost and automation performance trend
    - Power cost per pound rises materially without offset or retrofit milestones slip repeatedly
    - Cut margin assumptions and question scalability of acquired assets
  - - People / leadership risk
    - Leadership turnover or repeated labor disruption
    - Founder departure without visible bench or another material integration layoff wave
    - Treat execution premium as gone; underwrite only as a stressed produce operator
  notes: These are investor kill criteria, not management KPIs; each is chosen because it directly falsifies a key part of the current scale-and-efficiency narrative.
