- id: legal-and-regulatory-risk
  title: Legal and regulatory risk
  body: 'The most concrete legal and regulatory risks are operational rather than existential. The Virginia WARN notice is a completed labor-law event, not a hypothetical, and it shows that integration already has employment-law and local-political consequences. The more material forward-looking compliance burden is food regulation: FDA traceability rules require event-level records, a traceability plan, and 24-hour retrieval capability, while USDA organic labeling rules require certifier-approved label governance. Those rules matter more after the Soli merger because the retail pitch now depends partly on USDA Organic herbs and salads and on a larger multi-site distribution network. A traceability miss, organic-label error, or quality incident would therefore land in the exact channels management uses to validate the merger. Structured finance adds a second regulatory layer. The Florence expansion closed with NMTC and USDA-related financing support in a severely distressed census tract;
    that is attractive capital, but it usually comes with job, use-of-proceeds, and compliance obligations that are not public in reviewed sources. The public record also exposes a softer legal-compliance issue: 80 Acres’ consumer-facing privacy policy is still dated 2020, and there is no public SOC 2, data-processing, or incident-response disclosure in the reviewed corpus.'
  claimRefs:
