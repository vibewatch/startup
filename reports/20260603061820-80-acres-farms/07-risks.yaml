- id: people-execution-and-financial-model-risk
  title: People, execution, and financial-model risk
  body: 'The financial-model risk is straightforward: public evidence still does not prove that 80 Acres has escaped the capital-intensity trap that broke peers. Company disclosures name strong investors and a 60% revenue CAGR, but SEC filings still decline to disclose revenue, the 2025B Form D looks like a relatively small follow-on compared with the operating ambition, and the business is simultaneously carrying integration work, site optimization, and partner-financed expansion. People risk follows the same pattern. The company still appears founder-centered around Mike Zelkind and Tisha Livingston while integrating Soli teams, Plantae’s Israel-based science group, and Kalera assets. Virginia Business reported more than 1,200 employees nationally even as Harrisonburg closed and prior Georgia layoffs surfaced in the same integration window. Sector benchmarks make this combination dangerous. AppHarvest’s filings show how quickly single-facility concentration, exclusive distribution dependence,
    food-safety exposure, and urgent financing needs can compound; Plenty’s 2025 restructuring shows that even very large private funding totals do not buy much time once growth and cost narratives detach. The result is a residual risk profile that remains high until investors see auditable proof of post-merger utilization, margin durability, and funding sufficiency.'
