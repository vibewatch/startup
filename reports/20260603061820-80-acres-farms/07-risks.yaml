  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer concentration
    missingEvidence: Top-customer revenue share, minimum purchase commitments, retailer penalty terms, and current off-take coverage for Kroger plus other top five accounts.
    whyItMatters: Kroger is the best public proof point, but concentration cannot be underwritten without actual revenue share and contract minima; this is the biggest missing input in the partner-risk register.
    diligencePath: Request customer concentration table, top-account contracts, and 12-month shipment mix by banner under NDA.
    relatedQuestionRefs:
    - QR005
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: NMTC and USDA compliance terms
    missingEvidence: Full covenant package, milestone schedule, recapture triggers, and reporting obligations tied to the Florence NMTC / USDA-backed financing stack.
    whyItMatters: Structured finance improves cash efficiency but can reduce flexibility exactly when integration stress is highest.
    diligencePath: Obtain all financing agreements and compliance certificates from Truist, Affordable Equity Fund, and management.
    relatedQuestionRefs:
    - QR009
    - QR024
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: cybersecurity and privacy controls
    missingEvidence: Any current SOC 2, ISO 27001, incident-response, vendor-management, or U.S. state privacy compliance disclosure newer than the 2020 privacy policy.
    whyItMatters: The company takes order, payment, and marketing data yet discloses no current security posture, leaving a blind spot on operational and legal risk.
    diligencePath: Request security program summary, incident log, DPA inventory, and privacy counsel memo; search state AG and breach-notification databases.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: facility-level unit economics and energy costs
    missingEvidence: Power cost per pound, labor cost per unit, gross margin by site, and utilization by facility before and after the Soli merger.
    whyItMatters: Public sources show the direction of the cost problem but not whether 80 Acres has actually solved it.
    diligencePath: Request site P&Ls, power contracts, and monthly operating dashboards for Hamilton, Florence, Atlanta, and Indianapolis.
    relatedQuestionRefs:
    - QR013
    - QR020
    - QR022
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: post-merger organic-certifier map
    missingEvidence: Current certifiers, approved labels, NOP non-compliance notices if any, and SKU-level organic handling controls across the combined portfolio.
    whyItMatters: The merger pitch leans on Soli’s organic shelf presence; certifier drift or label errors would directly damage the retail proposition.
    diligencePath: Request certifier roster, approved artwork, audit findings, and corrective-action logs.
    relatedQuestionRefs:
    - QR011
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: minor
    topic: company-specific litigation sweep
    missingEvidence: A dated PACER/state-court sweep and outside-counsel litigation summary for 80 Acres and key subsidiaries.
    whyItMatters: No public litigation appeared in the reviewed free sources, but absence from public press is not the same as a clean litigation profile.
    diligencePath: Run PACER and state-court searches on 80 Acres Urban Agriculture, Infinite Acres, and major subsidiaries; request management legal schedule.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR001
