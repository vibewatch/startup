  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent farm-level P&L and technology audit
      missingEvidence: >-
        No independent third-party audit of GroLoop's technical capabilities, farm-level
        energy consumption per pound of produce, or the veracity of "95% less water" and
        "100% renewable electricity" claims exists in the public domain. Farm-level
        profitability data is not publicly disclosed.
      whyItMatters: >-
        Technology moat claims and sustainability-differentiation arguments underpin the
        investment thesis; unverified claims risk restatement under regulatory scrutiny
        (FTC Green Guides) or investor due-diligence challenge.
      diligencePath: >-
        Request third-party energy and water-efficiency audit, FSMA inspection records,
        SBTi target validation correspondence, and farm-level cost-per-pound data in the
        data room.
      relatedQuestionRefs:
        - QE015
        - QE016
        - QE017
        - QE026

    - type: missing-source
      severity: material
      topic: GroLoop third-party customer evidence
      missingEvidence: >-
        No public announcement of a paying external GroLoop customer or licensing agreement
        exists as of mid-2026. The platform-revenue thesis is entirely prospective.
      whyItMatters: >-
        The SaaS/licensing revenue stream that justifies a premium platform valuation
        multiple cannot be modeled without at least one signed third-party deal. The
        absence of external validation raises the risk that GroLoop is primarily an
        internal cost-optimization tool rather than a marketable platform.
      diligencePath: >-
        Request customer pipeline, signed LOIs, and any executed license agreements for
        GroLoop from management; determine whether the platform's pricing model and
        go-to-market strategy have been validated with potential customers.
      relatedQuestionRefs:
        - QE019
        - QE021

    - type: missing-source
      severity: material
      topic: genetics program timeline and commercialization plan
      missingEvidence: >-
        No proprietary crop variety has been announced from the Plantae/Infinite Acres
        Israel program; no timeline for first commercial variety, regulatory clearance
        pathway, or R&D milestones has been publicly disclosed.
      whyItMatters: >-
        The genetics program is presented as the "next big unlock" for vertical farming
        profitability; without a concrete timeline and milestone roadmap, the acquisition
        premium paid for Plantae ($115M raise partly attributed to genetics strategy)
        cannot be justified in diligence models.
      diligencePath: >-
        Request Plantae R&D roadmap, variety development pipeline, regulatory strategy
        for genome-edited products (USDA, FDA, international), and Weizmann Institute
        collaboration terms from management.
      relatedQuestionRefs:
        - QE010
        - QE024

    - type: proxy-only
      severity: minor
      topic: developer-signal coverage
      missingEvidence: >-
        80 Acres Farms and Infinite Acres do not have public GitHub repositories, npm
        packages, developer documentation portals, or Hacker News presence as would be
        expected for a B2B SaaS platform company. Developer-signal sources for this
        chapter are therefore proxied through LinkedIn hiring patterns, CEA professional
        community engagement, and industry conference participation.
      whyItMatters: >-
        The absence of developer-facing documentation or open-source signals is consistent
        with a closed-source, trade-secret-protected enterprise platform strategy; however,
        it also limits independent technical validation of GroLoop's architecture claims.
        For a company positioning GroLoop as a third-party-licensable platform, the lack
        of any developer-facing presence is a go-to-market gap.
      diligencePath: >-
        Request technical architecture documentation, API specifications, and customer
        onboarding materials for GroLoop; determine whether the company intends to
        publish developer documentation as part of the licensing go-to-market.
      relatedQuestionRefs:
        - QE022
        - QE025

    - type: private-evidence-only
      severity: material
      topic: IP protection and patent filings
      missingEvidence: >-
        No granted patents, published patent applications, or registered trade secrets
        associated with GroLoop or the Plantae genetics technology have been identified
        in public patent databases as of mid-2026.
      whyItMatters: >-
        The technology moat depends substantially on accumulated operational data and
        trade-secret protection, which is inherently fragile; key employees holding
        institutional knowledge represent concentration risk not mitigated by registered IP.
      diligencePath: >-
        Conduct FTO (freedom-to-operate) and patent landscape search; request IP register
        and any executed NDA, IP assignment, and non-compete agreements from management.
      relatedQuestionRefs:
        - QE025

