  - id: farm-network-infrastructure
    title: Farm Network and Operational Infrastructure
    body: >
      As of mid-2026, 80 Acres Farms operates a network of commercial farms equipped with
      the Infinite Acres technology platform, supported by a regional R&D facility and two
      international research outposts. The flagship Hamilton, Ohio facility (70,000 square
      feet, 10 growing levels, operational since 2019) serves as the technology proving ground
      and the first farm to have completed a full GroLoop integration. The Florence/Boone County,
      Kentucky farm (200,000 square feet, opened September 2023, $95 million investment, 125
      jobs) is the company's largest and most advanced commercial farm, capable of producing
      tens of millions of servings annually; it features high-tech vertical growing infrastructure,
      climate-controlled harvesting and packaging, and full distribution capability.


      The March 2025 acquisition of three Kalera, Inc. farms—located in Georgia, Texas, and
      Colorado—expanded the national footprint beyond the Ohio/Kentucky regional cluster and
      added relationships with retailers and distributors in the South and Mountain West. These
      farms are being retrofitted with the Infinite Acres platform to meet 80 Acres' operational
      standards. A fourth Kalera-acquired farm in Harrisonburg, Virginia was subsequently
      closed in July 2026, reflecting ongoing post-merger rationalization and challenging
      unit economics for that specific location.


      All commercial farms operate on 100% renewable electricity (through renewable energy
      certificates and direct sourcing) and use water recycling systems that reduce consumption
      by approximately 95% per pound of produce relative to conventional field agriculture.
      The company's growing systems use no pesticides or herbicides; produce is marketed as
      pesticide-free. The farms operate in enclosed, climate-controlled environments with
      AI-driven environmental setpoints, LED lighting tuned for crop-specific photosynthetic
      efficiency, and robotic seeding, transplanting, and harvesting systems.
