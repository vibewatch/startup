  - id: FE003
    title: GroLoop Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
      GroLoop's commercial viability depends on several converging dependencies: the hardware
      partner ecosystem (Signify, Siemens, SICK, TTA-ISO), the agronomic software and AI
      layer developed by Infinite Acres, the farm operator team, and the nascent genetics
      program. Risks are concentrated at the hardware-partner and genetics-program nodes;
      the core software OS is proprietary and wholly owned.
    data:
      nodes:
        - id: groloop-os
          label: GroLoop OS
          type: core
