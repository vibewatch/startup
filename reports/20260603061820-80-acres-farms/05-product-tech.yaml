  - id: TE004
    title: Quality, Compliance, and Sustainability Standards
    columns:
      - standard or commitment
      - status
      - evidence basis
      - verification tier
      - diligence note
    rows:
      - - FDA FSMA Produce Safety Rule
        - Required compliance (large-scale covered produce operation)
        - FDA final rule applies to covered produce farms; 80 Acres classified as covered
        - Regulatory requirement (third-party enforced)
        - No publicly available inspection record; compliance is required by law but not independently published
      - - Pesticide-free (no synthetic pesticides or herbicides)
        - Active self-declared claim
        - Company website, press releases, product packaging; consistent with indoor growing method
        - Self-declared; not third-party certified
        - No third-party audit of growing inputs; claim is credible given indoor growing environment but unverified
      - - 100% renewable electricity
        - Active self-declared claim
        - Company sustainability page, multiple press releases and investor materials
