  - id: quality-compliance-sustainability
    title: Quality, Compliance, and Sustainability
    body: >
      80 Acres Farms' quality and safety framework is built around FSMA Produce Safety Rule
      compliance, pesticide-free growing practices, and food-safety-focused controlled
      environments. As a large-scale covered produce operation, the company is subject to the
      FDA's FSMA Produce Safety Rule, which establishes science-based minimum standards for
      the safe growing, harvesting, packing, and holding of fruits and vegetables for human
      consumption. Indoor farms under covered structures may qualify for certain exemptions
      under the rule, but large commercial operations like 80 Acres are generally required to
      comply with standards around water quality, worker training, equipment hygiene, and
      recordkeeping.


      The company markets its produce as pesticide-free, which is a factual claim about
      its growing inputs rather than a third-party certification. Unlike USDA Organic—which
      requires field-grown conditions as part of the certification framework—pesticide-free
      indoor produce occupies a distinct market position. The company has not pursued USDA
      Organic certification for its 80 Acres branded products, though the post-merger portfolio
      includes Soli Organic's USDA Certified Organic products.


      On sustainability, 80 Acres Farms is committed to the Science Based Targets initiative
      (SBTi), targeting a 42% reduction in Scope 1 and Scope 2 greenhouse gas emissions by
      2030 from a 2021 baseline. The company reports using 100% renewable electricity across
      its farm network, recycling approximately 95% of irrigation water, and eliminating all
      synthetic pesticide and herbicide inputs. The company's sustainability strategy is framed
      around four pillars: Plants (growing efficiency), Product (packaging), People (community
      engagement), and Plans (farm infrastructure). The Siemens digital twin collaboration
      was specifically cited as supporting energy optimization and GHG-reduction targets at
      the farm level.
