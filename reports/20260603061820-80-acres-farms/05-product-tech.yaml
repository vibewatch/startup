    title: Infinite Acres Technology Platform Layers
    type: stack
    layout: wide
    summary: >-
      The Infinite Acres platform is organized into four integrated layers: a hardware
      ecosystem of strategic partners (Signify, Siemens, SICK, TTA-ISO), a proprietary
      software and environmental control layer (GroLoop OS), an applied agronomy layer
      (AI-guided growing protocols, yield analytics), and a genetics/biology layer (Plantae /
      Infinite Acres Israel). These layers compound into a vertically integrated CEA operating
      system designed to optimize productivity, consistency, and cost across any scale of
      indoor farm.
