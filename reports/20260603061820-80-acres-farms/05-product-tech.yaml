        - Indoor vertical farms are currently ineligible for USDA Organic certification under existing rules; Soli Organic (post-merger brand) holds the organic certification
      - - No-pesticide label (product packaging)
        - Active on 80 Acres branded products
        - Product labeling; consistent with all disclosed growing practices
        - Self-declared
        - No FTC Green Guides complaint found; claim is defensible given enclosed indoor growing method
    notes: >-
      All sustainability metrics are company-stated. No independent third-party audit of energy,
      water, or GHG claims has been publicly disclosed. Investors should request sustainability
