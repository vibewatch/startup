        - REC-based claims are widely criticized for not guaranteeing additionality; verification type not disclosed
      - - ~95% less water vs. conventional farming
        - Active self-declared claim
        - Company website and multiple third-party news sources
        - Self-declared; no independent comparative audit
        - Percentage is specific (95%) but methodology not disclosed; dependent on crop-type comparison baseline
      - - SBTi commitment (42% GHG reduction by 2030 from 2021 baseline, Scope 1+2)
        - Committed; in progress
        - 80 Acres sustainability page; SBTi framework confirmation
        - SBTi framework requires approved target validation; commitment status not confirmed as approved target
        - SBTi commitment is self-reported; the target-dashboard does not confirm 80 Acres as an approved SBTi company as of the research date
      - - USDA Organic (80 Acres branded products)
        - Not certified
        - Company explicitly does not hold USDA Organic certification for 80 Acres branded lines
