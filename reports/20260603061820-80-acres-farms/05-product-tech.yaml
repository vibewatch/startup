  - id: FE002
    title: Seed-to-Shelf Operating Flow
    type: flow
    layout: wide
    summary: >-
      The 80 Acres / Infinite Acres operating flow runs from seed selection (increasingly
      informed by Plantae genetics) through controlled indoor germination, AI-guided growing
      cycles, robotic harvesting, in-farm packaging, and direct-to-retail distribution—with
      GroLoop OS monitoring and optimizing each stage. The short supply chain (farm within
      a few hours of retail) is a core freshness differentiation relative to field-grown produce
      shipped cross-country.
    data:
      nodes:
        - id: step-genetics
          label: Seed / Genetics
          detail: >-
            Seeds selected or engineered via Plantae/Infinite Acres Israel genetics program;
            CEA-optimized traits (yield, flavor, texture, nutrition)
          tone: positive
        - id: step-germination
          label: Germination & Propagation
          detail: >-
