evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: >-
      Post-money valuation from any funding round; audited financials or a term sheet showing the round price and
      cap-table dilution.
    whyItMatters: >-
      Without a valuation anchor, it is impossible to assess return potential, dilution risk, or whether the company is
      attractively priced. All analyst estimates are unconfirmed.
    diligencePath: >-
      Request cap table, most recent term sheet, and any board-approved 409A or external valuation from management in
      the data room.
