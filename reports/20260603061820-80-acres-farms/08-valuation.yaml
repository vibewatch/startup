  title: Valuation
  summary: >
    80 Acres Farms is a private vertical farming company that has raised $370M–$400M in
    documented equity capital across three SEC Form D offerings but has never disclosed a
    post-money valuation, revenue figures, or audited financials. With a company-claimed
    60% revenue CAGR and projected combined revenues of ~$200M post-Soli merger, but a
    sector dominated by bankruptcies (Bowery, AppHarvest, Plenty, AeroFarms), the
    evidence supports a TRACK recommendation at medium confidence: the technology
    differentiation and scale leadership are real, but the undisclosed valuation, absence
    of audited data, post-merger integration costs (Harrisonburg closure, Georgia layoffs),
    and sector-wide multiple compression make a price-sensitive buy call impossible to
    underwrite without full financial disclosure. Valuation stance is UNKNOWN; the
    evidence-based EV range is $200M–$700M at 1–3.5x revenue, with $1B+ (unicorn)
    requiring assumptions not yet supported by public evidence.

sections:
  - id: investment-thesis-and-recommendation
    title: Investment Thesis, Anti-Thesis, and Recommendation
    body: >
      80 Acres Farms occupies the strongest surviving position in the U.S. vertical farming
      sector following the collapse of Bowery Farming ($472M raised, $2.3B peak valuation,
      shut November 2024), AppHarvest (SPAC-listed, Chapter 11 July 2023), Plenty Unlimited
      (Chapter 11 March 2025), and AeroFarms (Chapter 11 July 2023). The company has raised
      $370M–$400M in equity capital from high-quality institutional investors including General
      Atlantic (growth equity, $65B+ AUM), Siemens Financial Services (strategic technology
      partner), Barclays Climate Ventures, and Virgo Investment Group, across a Series A
      (2019), Series B (2021), and subsequent 2024 raises totaling $115M. The August 2025 Soli
      Organic merger created a combined entity projecting ~$200M in first-year revenues across
      17,000+ U.S. retail storefronts, establishing scale leadership among pure-play indoor
      farming companies. Management claims 60% revenue CAGR over the three years through 2024
      and "profitable farm unit economics," both unverified by independent audit.


      The core investment thesis rests on four pillars: (1) the GroLoop technology platform
      (Infinite Acres) provides genuine automation and AI-based crop optimization advantages;
      (2) General Atlantic's continued participation through the 2024 raise signals sustained
      sponsor confidence; (3) the Soli merger doubled retail reach and revenue at minimal
      incremental construction cost; and (4) the Plantae Biosciences acquisition adds a
      proprietary genetics capability that could differentiate crop varieties for CEA. The
      anti-thesis is equally concrete: (1) no audited financials exist; (2) valuation is
      undisclosed; (3) AppHarvest's 10-K shows that vertical farming at comparable operational
      scale generated gross margins of –290% ($14.6M revenue, –$42.4M gross loss in FY2022);
      (4) the Harrisonburg, VA facility closure (80 WARN Act employees, July 2026) and prior
      Georgia layoffs (128 workers) signal that post-merger integration is generating
      restructuring costs not yet reflected in public projections; and (5) the Form D 2025B
      filing ($28.4M, first sale August 2025) looks like a bridge or small follow-on rather
      than a full strategic round.


      The recommendation is TRACK. 80 Acres is the strongest risk-adjusted opportunity in
      vertical farming but the entry price is unknown, revenue and unit economics are
      unverified, and the sector's track record demands a higher evidence threshold before
      initiating a buy position. A research-more determination is inappropriate because the
      differentiation thesis is well-evidenced; the constraint is price and financial
      transparency, not strategic direction.
