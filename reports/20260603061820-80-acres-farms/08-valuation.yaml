          ceiling constrains margin expansion; continued sector capital contraction.
        - >-
          Low-to-medium; requires multiple simultaneous successes including licensing
          launch and margin improvement, neither of which is yet evidenced.
      - - Base
        - >-
          Revenue stabilizes at $175–200M post-integration; Harrisonburg closure is
          isolated; two or three additional facilities operational; GroLoop remains
          internal; next raise at $400–600M implied EV.
        - $190M
        - "$285M–$475M (1.5–2.5x)"
        - >-
          Additional site closures; integration charges exceed projections; premium consumer
          fatigue compresses retail volumes; down round at lower mark than Series C.
        - >-
          Medium; consistent with current evidence base and comparable private CEA
          multiples in a constrained capital environment.
      - - Bear
        - >-
          Second major facility closure within 12 months; integration costs consume
          merger synergies; a retailer reduces shelf space; bridge raise at distressed
          terms; revenue falls to $120–140M range.
        - $130M
        - "$104M–$156M (0.8–1.2x)"
        - >-
          Full insolvency risk if unit economics do not improve; KKR-style debt
          distress (cf. Bowery $150M KKR loan before closure) if debt is introduced.
        - >-
          Low-to-medium; precedent from Bowery, AppHarvest, Plenty shows bear case
          can reach zero in vertical farming; 80 Acres is differentiated but not immune.
    notes: >-
      Revenue estimates are derived by applying the stated multiple to an indicative scenario
      revenue figure; all estimates are model-based inferences from publicly available
      evidence and are not drawn from audited financials. Probability signals are qualitative
      based on available evidence, not quantitative probability estimates.

