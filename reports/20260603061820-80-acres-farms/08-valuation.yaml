callouts:
  - calloutType: recommendation
    title: "TRACK: Price-Sensitive Position — Do Not Buy Without Valuation and Audited Financials"
    body: >
      80 Acres Farms is the best-positioned surviving vertical farming company, but the
      investment call is TRACK at medium confidence. The strategic thesis (GroLoop platform,
      Soli merger scale, General Atlantic sponsorship, Plantae genetics) is real and
      well-evidenced. The price is not. Without a disclosed post-money valuation, audited
      revenues, facility-level margins, or a cap table, it is impossible to determine
      whether the current equity represents an attractive entry, a fair entry, or an
      overpriced position relative to a sector where the next most comparable company
      (AppHarvest) went bankrupt one year after reporting –290% gross margins on $14.6M
      in revenue. A buy position requires the five diligence conditions listed in TV006
      to be met; a track position is appropriate until then.
    claimRefs:
      - CV012
      - CV024
      - CV025
      - CV043

  - calloutType: risk
    title: "Adverse Signal: Harrisonburg Closure and Post-Merger Integration Costs Are Unpriced"
    body: >
      The May 2026 WARN Act notification for the Harrisonburg, Virginia facility (80 employees,
      closure by July 2026) and Soli Organic's own pre-merger layoff of 128 workers in Georgia
      are explicit adverse signals that the Soli integration is generating restructuring costs
      not reflected in the $200M first-year revenue projection. The Form D 2025B ($28.4M,
      August 2025) may be a bridge to cover these costs rather than a growth round. Investors
      should stress-test the revenue projection by subtracting any facility closures from
      the post-merger revenue base before accepting the $200M headline.
    claimRefs:
      - CV030
      - CV031
      - CV004

