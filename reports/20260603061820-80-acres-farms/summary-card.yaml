  topStrengths:
    - >-
      80 Acres has emerged as one of the few scaled indoor-farming survivors, with national retail reach after the Soli
      Organic merger.
    - >-
      The GroLoop / Infinite Acres operating stack and the company's willingness to buy and retrofit distressed assets
      create a more disciplined scale story than many failed peers had.
    - >-
      Institutional investor support and repeated access to capital suggest the company still commands sponsor
      confidence in a difficult sector.
  topRisks:
    - >-
      No audited financial statements, disclosed valuation, or site-level margin data are public, making precise
      underwriting unsafe.
    - >-
      Post-merger integration remains unsettled, with the Harrisonburg closure and prior Georgia layoffs implying
      restructuring costs not reflected in headline revenue claims.
    - >-
      Vertical farming remains a capital-intensive and energy-sensitive sector with a recent history of bankruptcies,
      restructurings, and multiple compression.
  unresolvedGaps:
