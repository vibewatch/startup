  title: Customer Segmentation
  columns:
  - segment
  - buyer/user/payer
  - use case
  - scale
  - revenue/strategic value
  - gap
  rows:
  - - Midwest conventional grocery chains
    - 'Buyer: produce/category buyer; User: grocery shopper; Payer: retailer'
    - Branded leafy greens, salad kits, herbs, tomatoes
    - Single Kroger store in 2019 to >300 stores in 2021 to ~1,000 planned in 2023
    - Core proving ground for mainstream grocery adoption and repeat shelf expansion
    - Current active-door count, velocity, and margin by banner are not public
  - - Eastern U.S. grocery and restaurant base
    - 'Buyer: retailer or restaurant operator; User: shopper / diner; Payer: retailer / restaurant'
    - Branded salads, kits, herbs, microgreens, tomatoes
    - '>1,500 retailers and restaurants as of Feb. 2025'
    - Shows demand beyond one banner and beyond pure grocery-only placement
    - Endpoint mix between grocers and restaurants is not broken out
  - - Post-Kalera regional farm network
    - 'Buyer: retailer and food-distributor procurement; User: shopper / foodservice kitchen; Payer: retailer / distributor'
    - Local replenishment from GA, TX, and CO plus legacy OH/KY network
    - Three acquired farms added in Mar. 2025
    - Adds local-service coverage and capital-efficient expansion capacity
    - No public customer list by acquired farm or region
  - - Post-merger national grocery footprint
    - 'Buyer: national or regional retail buying teams; User: shopper; Payer: retailer'
    - Salad blends, kits, herbs, tomatoes, microgreens
    - 17,000 U.S. retail locations after Soli merger
    - Step-change in shelf access and assortment breadth
    - Door count likely includes legacy Soli doors and not just fresh 80 Acres branded placements
  - - Foodservice distributors
    - 'Buyer: distributor procurement; User: restaurant / institutional kitchen; Payer: distributor / operator'
    - Greens, herbs, and produce through local farm network
    - Named historically via U.S. Foods and broader distributor language
    - Diversifies demand beyond grocery category resets
    - No current distributor-native proof, contract size, or renewal data
  - - Ingredients and technology adjacencies
    - 'Buyer: food manufacturer or enterprise grower; User: CPG formulator / grower; Payer: enterprise customer'
    - Ingredients channel and possible GroLoop commercialization
    - Management says ingredients channel is being developed; named customers absent
    - Potential higher-margin expansion path outside branded produce
    - No named ingredients customers, volumes, or revenue disclosed
  notes: Segmentation is reconstructed from public operating statements; the combined 17,000-door figure is a network-scale claim rather than a disclosed account roster.
