- id: TU006
  title: 'Retention Cohort Substitute: Public Durability Proxy Inventory'
  columns:
  - proxy signal
  - latest public observation
  - retention inference
  - why not a cohort
  - diligence step
  rows:
  - - Kroger footprint expansion
    - Expanded from 1 store to >300 and then to a ~1,000-store plan
    - Suggests banner-level repeat ordering and buyer trust
    - No monthly cohort, store survival, or reorder curve is disclosed
    - Obtain Kroger door history by quarter and SKU survival by reset cycle
  - - 17,000-door post-merger footprint
    - Combined network reaches 17,000 retail locations
    - Large network could improve resilience and repeat purchase opportunity
    - Door count is not a retention percentage and may include legacy Soli doors
    - Request active-door cohorts by banner and brand
  - - Retail value proposition language
    - Management and Walter Robb stress shelf life, supply surety, and differentiated products
    - Signals why customers might stay
    - No measured satisfaction, shrink, or re-order metrics are public
    - Request shrink reduction, spoilage, and repeat-order KPIs
  - - Retailer-native proof freshness
    - Kroger search is current; Whole Foods and Meijer surfaces are incomplete or broken
    - Fresh proof exists for one banner only
    - Freshness is uneven across named customers and says little about renewals
    - Run retailer-side SKU audits across top banners and compare to shipped revenue
  - - Network consolidation event
    - Harrisonburg closure moves coverage toward Atlanta and Indianapolis
    - Shows management actively re-optimizes service network
    - A network change is not evidence of retained demand
    - Review any lost-door, service-exception, or buyer-escalation reports around the change
  notes: This table substitutes for a cohort figure because public sources do not expose time-bucketed customer-retention percentages.
