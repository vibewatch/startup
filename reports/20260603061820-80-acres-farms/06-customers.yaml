chapter:
  number: 6
  title: Customers
  summary: Public customer evidence shows a clear expansion arc from a single Kroger store in 2019 to more than 300 stores in 2021, a planned nearly 1,000-store Kroger rollout by 2023, more than 1,500 retailers and restaurants by February 2025, and 17,000 U.S. retail locations after the August 2025 Soli Organic merger. Kroger is the strongest named-customer proof because a June 2026 retailer-native search still surfaced an 80 Acres Farms brand filter with 13 results, while Whole Foods, Meijer, and foodservice relationships remain supported mainly by older company disclosures or inaccessible current retail surfaces. No public NRR, churn, renewal, or concentration data exists, and the May 2026 Harrisonburg closure shows that customer durability still depends on successful network consolidation.
sections:
- id: segmentation-and-channel-footprint
  title: Segmentation and channel footprint
  body: 'Public customer evidence points to a mixed buyer, user, and payer stack rather than one monolithic customer. The direct buyer is usually a grocery produce-category manager or a foodservice procurement team; the end user is the grocery shopper or restaurant diner; and the payer is the retailer, distributor, or operator taking inventory risk. Before the Soli Organic merger, the best-documented segment was conventional grocery via Kroger, complemented by a broader eastern U.S. base of more than 1,500 retailers and restaurants. The March 2025 Kalera asset acquisition extended geography into Georgia, Texas, and Colorado and explicitly framed retailers and food distributors as a combined go-to-market channel. After the August 2025 merger, the segmentation widened again: 80 Acres'' vertical-farm salads, kits, tomatoes, and microgreens sit beside Soli''s longstanding herb footprint, materially increasing national grocery coverage. That said, the 17,000-door claim is best read as a combined-network
    number, not as proof that every door carries the same 80 Acres branded assortment today. Management''s separate ingredients-channel language also implies an emerging B2B customer segment, but no named ingredients customers are public.'
