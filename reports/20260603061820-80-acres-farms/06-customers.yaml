- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'The adoption story is strongest where there is chronological, cross-source evidence. Kroger is the clearest case: retrospective Kentucky and Lane Report coverage says 80 Acres started in a single downtown Cincinnati Kroger store in 2019, expanded to more than 300 stores across Ohio, Indiana, and Kentucky by 2021, and announced a plan for nearly 1,000 Kroger stores across the Midwest and Southeast in 2023. A fresh June 2026 Kroger search still returns an 80 Acres Farms brand filter with 13 results, which is the best retailer-native signal that live assortment persists. Beyond Kroger, public proof quality falls off. A 2018 PRNewswire release said the Hamilton farm would supply Whole Foods Markets and U.S. Foods, which supports historical production relationships, but the current Whole Foods search surface is JS-dependent and the Meijer search URL returned an error page on the run date. Accordingly, public enumeration of named customers is only partial: strong for Kroger, historical
    but stale for Whole Foods and U.S. Foods, and materially weaker for Meijer.'
