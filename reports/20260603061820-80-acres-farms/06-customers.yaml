- id: TU005
  title: Expansion and Concentration Risk
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Kroger account expansion from regional pilot to multi-state rollout
    - Kroger may still represent an outsized share of fresh 80 Acres-branded volume
    - A banner reset or buyer change could matter more than the 17,000-door headline suggests
    - Request revenue by top 10 customers and by banner, plus renewal dates
  - - Kalera farm acquisitions in GA, TX, and CO
    - New regional capacity may outrun contracted demand if local placements lag
    - Underutilized assets would pressure utilization and service economics
    - Request utilization by farm, customer commitments by region, and ramp assumptions
  - - Soli Organic merger and herb footprint
    - 17,000 retail locations may overstate same-brand diversification because the number aggregates legacy Soli doors
    - Door-count optics could mask concentration within a few large banners or categories
    - Request brand-level door mix and active doors by banner post-merger
  - - Ingredients-channel buildout
    - Expansion story may rely on an undeveloped B2B segment with no named customers
    - If ingredients does not materialize, growth remains more dependent on grocery retail
    - Request pipeline, LOIs, first-customer timing, and channel economics
  - - Network consolidation after Harrisonburg closure
    - East-coast service quality could dip during rerouting to Atlanta and Indianapolis
    - Even temporary service disruption could affect resets and reorder confidence
    - Review service-level metrics, fill rates, and customer communication logs around the closure
  notes: Public evidence supports the expansion logic, but not the concentration math. The main unknown is whether broader network scale truly diversified revenue.
