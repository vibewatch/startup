callouts:
- calloutType: risk
  title: Door-count growth is not the same as durable retention
  body: Public evidence is strong on expansion but weak on durability. 80 Acres can point to Kroger growth, a broader 1,500-plus pre-merger endpoint base, and a 17,000-door post-merger network, yet none of the public materials disclose NRR, banner renewals, churn, or top-customer concentration. The Harrisonburg closure also shows that customer coverage can be materially re-routed within the network, which may be strategically rational but still leaves outside diligence unable to measure any service fallout or door attrition.
  claimRefs:
  - CU018
  - CU022
  - CU028
  - CU029
  - CU033
