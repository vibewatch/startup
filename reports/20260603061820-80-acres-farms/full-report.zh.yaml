      - number: '7.3'
        title: 运营与伙伴 / 依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营层面的核心问题是：80 Acres 真正在收获规模经济，还是仍在清理此前过度建设的成本。管理层把合并网络描述为区域冗余、资本效率高，并能吸收当前需求；Harrisonburg
              关闭则说明，冗余也可能意味着闲置或位置不佳的产能，需要被理顺。Kalera
              收购从另一个角度提出同样问题：改造困境资产可以比建设绿地农场更便宜，但前提是改造时间表、产量和服务水平可预测。伙伴图谱进一步加深这一风险暴露。Kroger
              仍是最清晰的大客户证明，也可能仍是主导销量对手方，但公开来源不披露收入集中度或最低采购承诺。技术栈同样依赖伙伴：Siemens、Signify、SICK
              和其他供应商不是外围角色，而是嵌入自动化、电力、控制和数字孪生优化中。伙伴保持一致时，这种结构可以成为护城河；但它也可能形成故障链条，设备、软件或能源管理表现不佳，先体现为产量波动，再变成服务失败，最后造成客户流失。
