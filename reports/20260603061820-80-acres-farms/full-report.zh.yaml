      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >
              Mike Zelkind（CEO）和 Tisha Livingston（Infinite Acres CEO）是联合创始人，从公司创立一路带到多轮融资和 2025 年的转型性合并。Zelkind
              过去运营过大规模食品制造业务，包括在 Del Monte 等公司的经历；这让 80 Acres 有别于主要由软件或技术高管带队的竞争对手。Livingston 拥有 University of
              Cincinnati 工程背景，自公司成立起就管理 Infinite Acres 技术栈，并继续负责整个农场网络中的 GroLoop 平台、全部硬件、软件和控制系统。


              近几年治理结构明显拓宽。General Atlantic 董事总经理 Shaw Joseph 在 2021 年 8 月 Series B 交易中加入 80 Acres Farms 董事会。Whole Foods
              Market 前联合 CEO（1983–2017）、合并前 Soli Organic 联席董事长 Walter Robb 于 2025 年 8
              月加入合并公司董事会，带来零售信誉和深厚的杂货商关系，这类资源很少有独立董事能够复制。


              关键人集中度仍是重大尽调顾虑。战略、资本获取、技术执行和零售关系管理仍高度集中在 Zelkind 和 Livingston 手里。业务智能与战略财务副总裁 Noah Zelkind 是 Mike Zelkind
              的家庭成员，引入了第二层治理集中风险。2021 年和 2025 年的董事会新增成员提供了一定制衡，但任一联合创始人离开，都会对当前战略方向和投资者信心造成高严重度冲击。公开资料没有描述接班计划。
