    summary: 展示运营和融资冲击如何传导至服务水平、利润率和估值。
    data:
      nodes:
        - id: n1
          label: 整合冲击
        - id: n2
          label: 产能利用率
        - id: n3
          label: 客户服务 / OTIF
        - id: n4
          label: 毛利率
        - id: n5
          label: 流动性 / 下一轮融资
        - id: n6
          label: 估值 / 可投资性
      edges:
        - from: n1
          to: n2
          label: 基地关停与改造延误
        - from: n2
          to: n3
          label: 销量或新鲜度不达标
        - from: n2
          to: n4
          label: 固定成本吸收
        - from: n3
          to: n6
          label: 客户集中度折价
        - from: n4
          to: n5
          label: 烧钱速度 / 过桥需求
        - from: n5
          to: n6
          label: 降价轮或结构化融资信号
    claimRefs:
      - CR003
      - CR032
      - CR033
      - CR039
      - CR047
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: 运营模型仍依赖的关键外部交易对手和节点。
    data:
      nodes:
        - id: d1
          label: Kroger / 锚定零售
        - id: d2
          label: Siemens + 自动化技术栈
        - id: d3
          label: Truist / NMTC / 投资者
        - id: d4
          label: FDA + USDA 认证机构
        - id: d5
          label: Atlanta + Indianapolis 枢纽
        - id: d6
          label: 80 Acres 运营模型
        - id: d7
          label: 收入 / 利润率韧性
      edges:
        - from: d1
          to: d6
          label: 销量与货架准入
        - from: d2
          to: d6
          label: 控制与效率
        - from: d3
          to: d6
          label: 资本开支流动性
        - from: d4
          to: d6
          label: 合规许可
        - from: d5
          to: d6
          label: 实体履约
        - from: d6
          to: d7
          label: 执行结果
    claimRefs:
      - CR003
      - CR016
      - CR020
      - CR024
      - CR045
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从技术证明和规模证据，到财务不透明和行业风险，串起一条逻辑链，最终给出中等信心的观察建议。
    data:
      nodes:
        - id: tech_proof
          label: GroLoop 平台 + Plantae 遗传育种（有差异化）
        - id: scale_proof
          label: 17,000+ 个零售门店，预计收入 $200M
        - id: investor_quality
          label: General Atlantic + Siemens + W&S Life（高质量支持方）
        - id: sector_risk
          label: Bowery / AppHarvest / Plenty / AeroFarms 均已破产或重组
        - id: financial_opacity
          label: 没有经审计财务；估值未披露；没有股权结构表
        - id: integration_risk
          label: Harrisonburg 关停（WARN Act）；Georgia 裁员；Form D 2025B 过桥融资
        - id: recommendation
          label: 观察（中等信心）——暂不买入；必须披露入场价和财务数据
        - id: move_to_buy
          label: 买入触发条件：经审计 P&L + 股权结构表 + 估值 <2x 收入
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV013
      - CV015
      - CV024
      - CV030
  - id: FV002
    title: 收入与倍数下的估值敏感性
    type: bar
    layout: wide
    summary: 80 Acres Farms 在不同收入情景（$130M–$250M）和倍数区间（0.8x–4.0x）下的隐含企业价值，展示有证据支撑的 $200M–$700M 基准区间。
    data:
      items:
        - label: 悲观：$130M 收入 × 0.8x
          value: 104
        - label: 悲观：$130M 收入 × 1.2x
          value: 156
        - label: 基准低位：$175M 收入 × 1.5x
          value: 263
        - label: 基准：$200M 收入 × 2.0x
          value: 400
        - label: 基准高位：$200M 收入 × 2.5x
          value: 500
        - label: 基准高位：$200M 收入 × 3.0x
          value: 600
        - label: 乐观：$250M 收入 × 3.0x
          value: 750
        - label: 乐观：$250M 收入 × 4.0x
          value: 1000
    approximationNotes: >-
      所有收入数字均为模型估计，依据公司声称的 60% CAGR 和 Soli 并购后预测；并非来自经审计财务。倍数根据可比私营食品科技交易和 AppHarvest SPAC 先例推断；没有可用于校准的独立第三方 80 Acres
      交易。数值以百万美元计。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值与回报区间
    type: range
    layout: standard
    summary: 80 Acres Farms 在悲观、基准、乐观情景下的低、中、高企业价值 / 回报区间，以行业可比证据和收入倍数分析为锚。
    data:
      items:
        - label: 悲观 EV（0.8–1.2x $130M）
          low: 104
          high: 156
          note: 基地关停加速；整合失败；降价轮；行业可比：AppHarvest 关停时
        - label: 基准 EV（1.5–2.5x $190M）
          low: 285
          high: 475
          note: Soli 整合兑现；单位利润率小幅改善；可比对象为私营 CEA 运营商
        - label: 乐观 EV（3.0–4.0x $250M）
          low: 750
          high: 1000
          note: GroLoop 对外授权；遗传平台商业化；GA 领投增长轮
        - label: 独角兽门槛
          low: 1000
          high: 1000
          note: 需要验证单位利润率、授权收入，且优先权没有进一步稀释
    approximationNotes: 所有 EV 数值以百万美元计。区间为分析师模型估计，并非来自任何已披露交易。「独角兽门槛」行反映 $1B 边界，不是点估计；high = low = 1000 用于显示一条门槛线。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 可用的七维评分：市场、证明、护城河、经济性、风险、估值和证据质量。每项 1–5 分（5 = 最好）。
    data:
      items:
        - label: 市场机会
          value: 4
          note: 全球 VF 市场 $6–10B，CAGR 约 19%；美国有机市场 $76.6B；高端细分在增长
        - label: 商业证明
          value: 3
          note: 17,000 个零售门店；公司声称 60% CAGR；Kroger 扩张；但未经审计
        - label: 护城河 / 差异化
          value: 4
          note: GroLoop 平台叠加 Siemens / Signify / SICK；Plantae 遗传育种；Soli 分销规模
        - label: 单位经济性
          value: 2
          note: 管理层称单位经济性可盈利；没有独立验证；AppHarvest 可比案例构成反向证据
        - label: 风险画像
          value: 2
          note: Harrisonburg 关停；并购后整合；行业破产潮；没有经审计数据
        - label: 估值纪律
          value: 1
          note: 估值未披露；独角兽猜测未经验证；优先权悬压未知
        - label: 证据质量
          value: 2
          note: SEC Form D 确认有资本进入；收入 / 利润率完全由公司自称；没有经审计 P&L
    claimRefs:
      - CV009
      - CV010
      - CV019
      - CV024
      - CV025
      - CV030
      - CV043
