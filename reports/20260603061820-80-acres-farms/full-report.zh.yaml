  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入画像与增长轨迹
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 是一家私营公司，没有披露审计财务报表；所有收入指标要么来自公司声称，要么由二手证据推断。最强的可得财务信号，是管理层在 2025 年 2 月公司新闻稿中披露的说法：截至 2024
              年的三年内，收入复合年增长率为 60%。套用任何合理的 2022 年基线，这意味着进入 2025 年时收入运行率在 $100–140M 区间，与新闻和 SEC 文件中可见的运营规模一致，但没有得到确认。


              2025 年 8 月的 Soli Organic 合并大幅重置了收入基线。管理层预计合并后首年收入接近 $200 million，反映 80 Acres 技术驱动农场与 Soli Organic 35
              年以上传统的结合；Soli Organic 作为独立香草和叶菜运营商，历史收入接近 $120M。合并实体目前服务美国约 17,000 个零售网点，高于合并前约 1,500 个（主要在 Midwest），每年生产
              15 到 20 million pounds 农产品。


              截至 2026 年 6 月报告日，收入流覆盖自有品牌农产品（沙拉混合菜、带自有 Mother Raw 调味酱的沙拉套装、香草、微型蔬菜和番茄），通过包括 Kroger
              在内的全国杂货零售商分销；还包括面向食品制造客户的成分渠道，以及通过 Plantae Biosciences 收购获得的早期植物遗传能力。技术平台（Infinite Acres
              GroLoop）尚未产生外部授权收入，完全作为内部成本中心和竞争护城河运营。


              自有品牌沙拉零售价格通常约为每 5-oz 袋 $4–6，沙拉套装为 $6–9，相比大宗田间种植替代品有 20–50%
              溢价。这种高端定位是单位经济性论证的核心，因为在垂直农场成本结构下，大宗农产品的贡献利润率极薄。
