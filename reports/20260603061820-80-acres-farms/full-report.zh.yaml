      - number: '7.2'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              最具体的法律和监管风险是运营性风险，不是生存性风险。Virginia WARN 通知是已经发生的劳动法事件，不是假设，说明整合已经带来雇佣法和地方政治后果。更实质的前瞻合规负担来自食品监管：FDA
              可追溯性规则要求事件级记录、可追溯计划和 24 小时检索能力；USDA 有机标签规则要求经认证机构批准的标签治理。Soli 并购后，这些规则更重要，因为零售卖点现在部分依赖 USDA Organic
              香草和沙拉，也依赖更大的多站点分销网络。可追溯性失误、有机标签错误或质量事件，因此会正好落在管理层用来验证并购的渠道中。结构化融资增加了第二层监管。Florence 扩张在严重困难普查区内通过 NMTC 和
              USDA 相关融资支持完成；这种资本有吸引力，但通常伴随就业、募集资金用途和合规义务，而已审阅来源没有公开这些内容。公开记录还暴露出较软的法律合规问题：80 Acres 面向消费者的隐私政策仍停留在 2020
              年，已审阅语料中没有公开 SOC 2、数据处理或事件响应披露。
