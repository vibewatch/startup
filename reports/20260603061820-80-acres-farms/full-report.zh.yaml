      - number: '5.4'
        title: 农场网络与运营基础设施
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，80 Acres Farms 运营一张配备 Infinite Acres 技术平台的商业农场网络，并由一个区域研发设施和两个国际研究据点支撑。Ohio 的 Hamilton
              旗舰设施（70,000 平方英尺，10 层种植，2019 年起运营）是技术验证场，也是第一座完成 GroLoop 全面集成的农场。Kentucky 的 Florence/Boone County
              农场（200,000 平方英尺，2023 年 9 月启用，$95 million 投资，125
              个岗位）是公司最大、最先进的商业农场，年产可达数千万份；设施具备高科技垂直种植基础设施、气候控制采收和包装，以及完整分销能力。


              2025 年 3 月收购位于 Georgia、Texas 和 Colorado 的三座 Kalera, Inc. 农场，把全国版图从 Ohio/Kentucky
              区域集群扩展出去，并增加了南部和山地西部零售商、分销商关系。这些农场正在接入改造后的 Infinite Acres 平台，以达到 80 Acres 的运营标准。第四座从 Kalera 收购的 Virginia
              Harrisonburg 农场随后于 2026 年 7 月关闭，反映并购后仍在持续优化资产，也说明该具体地点的单位经济性承压。


              所有商业农场都使用 100% 可再生电力（通过可再生能源证书和直接采购），并采用水循环系统；按每磅农产品计，用水量相对传统露地农业约减少
              95%。公司的种植系统不使用农药或除草剂；农产品以无农药销售。农场在封闭、气候受控环境中运营，使用 AI 驱动的环境设定点、按作物光合效率调校的 LED 照明，以及机器人播种、移栽和采收系统。
