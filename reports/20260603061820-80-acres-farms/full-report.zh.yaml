          label: LED 能源成本
          detail: |
            公司称使用 100% 可再生电力；能源是垂直农业最大的 COGS 驱动项（估计占生产成本 30–40%）。可再生采购降低了对商品电价的暴露。
          tone: neutral
        - id: automation
          label: 机器人与自动化
          detail: |
            Infinite Acres GroLoop 自动完成播种、移栽和采收，降低单位劳动力成本；Siemens 数字孪生和 Signify LED 照明支持精准气候管理。
          tone: positive
        - id: cold-chain
          label: 近消费者选址
          detail: |
            靠近配送中心的农场降低冷链成本和货架损耗；更短供应链相对从 California 田间种植、跨州运输形成结构性优势。
          tone: positive
        - id: farm-margin
          label: 农场层面毛利（公司称为正）
          detail: |
            Tisha Livingston 2025 年 3 月表示“农场单位经济性已经盈利”；未经独立验证。上市可比公司 AppHarvest 在破产前的 2022 年毛利率为 –290%。
          tone: neutral
      edges:
        - from: crop-genetics
          to: farm-margin
        - from: energy-costs
          to: farm-margin
        - from: automation
          to: farm-margin
        - from: cold-chain
          to: farm-margin
    approximationNotes: |
      农场层面毛利是公司说法；没有一级来源确认。该流程是定性和方向性的，不是量化损益表。
    claimRefs:
