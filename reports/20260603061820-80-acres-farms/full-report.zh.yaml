      - number: '3.5'
        title: 证据要点
        blocks:
          - type: callout
            title: Soli 合并后的规模和产品广度，是最清晰的公开切入口
            body: >-
              支撑 80 Acres Farms 竞争地位的最强公开证据，不是抽象技术叙事，而是具体分销触达：17,000+ 个零售门店，覆盖 Kroger、Whole Foods、Harris
              Teeter、Meijer、Sysco、US Foods 和 Soli Organic
              的香草网络。再叠加活跃室内农场中最广的产品组合——沙拉、香草、微型蔬菜、番茄、黄瓜和调味酱——这种规模和广度目前不是任何幸存直接同行能够复制的。
            calloutType: strength
            claimRefs:
              - CP001
              - CP022
              - CP024
              - CP030
              - CP031
          - type: callout
            title: 能源成本、高端定价与缺少利润率证明，是结构性风险而非偶发风险
            body: >-
              美国四大室内农业失败案例——Bowery Farming、AppHarvest、Plenty 和 AeroFarms——在失败或重组前合计融资超过 $2.2
              billion。共同线索是能源成本、资本强度，以及消费者不愿在规模化下持续支付高端价格。80 Acres Farms 尚未用可独立验证的毛利率数据化解这些风险；2025 年 7 月 Harrisonburg
              设施关闭说明，即便对品类中最强的运营商，单场经济性仍然脆弱。
            calloutType: risk
            claimRefs:
              - CP028
              - CP035
              - CP038
              - CP039
              - CP041
              - CP043
          - type: callout
            title: 竞争威胁来自结构，而不是资金充足的直接同行
            body: >-
              截至 2026 年中，Bowery 已停业，AppHarvest 已清算，Plenty 重组后转向草莓，AeroFarms 收窄到微型蔬菜；在广义沙拉和香草室内农业类别中，80 Acres Farms
              没有资本充足的直接同行。真正的竞争压力来自传统田间种植者（Taylor Farms、Dole），它们以远低成本掌握约 95%
              的美国沙拉销量；压力也来自室内农业本身的结构性经济性，而不是来自拥有可比平台或分销深度的室内农业对手。
