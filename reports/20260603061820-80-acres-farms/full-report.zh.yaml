  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与市场定位
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 的消费端产品组合由无农药、室内种植农产品构成，主要通过美国东部和中西部大型杂货连锁销售。核心 SKU
              包括即食沙拉包、沙拉混合菜（春季混合菜、芝麻菜、嫩菠菜和特色混合菜）、新鲜香草（罗勒、莳萝、香菜、薄荷）、微型蔬菜、樱桃番茄和葡萄番茄，以及高端沙拉酱（2024 年 3 月随 Mother Raw
              品牌收购）。公司也种植黄瓜，并通过 Plantae Biosciences 研发管线试点更多适合室内环境的作物品种。


              产品围绕三项属性定位：新鲜（农场到货架供应链距离短）、安全（无农药；无化学投入品）和稳定（AI 控制环境，消除天气与季节波动）。公司没有 USDA Organic 认证，这使其区别于露地有机竞争者，也区别于
              2025 年 8 月并入的 Soli Organic。并购后，合并实体同时销售 80 Acres 品牌无农药室内农产品，以及 Soli Organic 的 USDA Certified Organic
              香草和绿叶菜。


              截至 2025 年末，Soli Organic 并购后零售分销覆盖超过 18,000 个美国零售门店；关键客户包括 Kroger（2019 年起合作；目前覆盖中西部和东南部数千家门店）、Whole Foods
              Market、Meijer、Sysco 和 US Foods。2025 年 3 月收购 Kalera 农场，加强了公司与 Georgia、Texas 和 Colorado
              市场零售商及食品分销商的关系，这些市场此前覆盖不足。公司服务的是杂货市场中的新鲜农产品品类——该品类能带来高频到店，并支撑差异化、本地种植、无农药产品的溢价。
