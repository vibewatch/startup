      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 观察：价格敏感仓位——没有估值和经审计财务，不应买入
            body: >
              80 Acres Farms 是现存定位最好的垂直农业公司，但投资判断是中等置信度的观察。战略逻辑（GroLoop 平台、Soli 并购规模、General Atlantic 支持、Plantae
              遗传学）真实且证据充分。价格不是。没有披露投后估值、经审计收入、设施层面利润率或股权结构表，就无法判断当前股权相对行业是否是有吸引力的进入点、合理进入点，还是定价过高；而该行业中下一个最可比公司
              AppHarvest 在报告 $14.6M 收入和 –290% 毛利率一年后破产。买入仓位要求 TV006 所列五项尽调条件全部满足；在此之前，观察仓位更合适。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV024
              - CV025
              - CV043
          - type: callout
            title: 反向信号：Harrisonburg 关闭和并购后整合成本尚未计价
            body: >
              2026 年 5 月 Virginia Harrisonburg 设施的 WARN Act 通知（80 名员工，2026 年 7 月前关闭）以及 Soli Organic 自身并购前在 Georgia 裁员
              128 人，都是明确反向信号，说明 Soli 整合正在产生重组成本，而 $200M 首年收入预测没有反映。Form D 2025B（$28.4M，2025 年 8
              月）可能是用于覆盖这些成本的过桥，而不是增长轮。投资者在接受 $200M 标题数字前，应通过从并购后收入基础中扣除任何设施关闭来压力测试收入预测。
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
              - CV004
