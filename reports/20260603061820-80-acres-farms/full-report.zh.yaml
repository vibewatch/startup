      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              室内农业最强的增长驱动因素，是 LED 效率的长期改善：园艺 LED 效率从 2015 年约 2.5 micromoles per joule 升至 2025 年的 3.8 micromoles per
              joule，根据 Mordor Intelligence，这让每 kilogram 生菜所需电力减少约 35%。LED 和软件许可的资本成本下降到足以把绿地垂直农场设施的回本周期从 2020 年的 8 年压缩到
              2026 年约 5 年。消费者对无农药、本地种植农产品的需求是第二个关键驱动因素：North America 消费者调查显示，他们愿意为这类产品支付 15% 或更高溢价。根据 Organic Trade
              Association，美国有机市场在 2025 年达到 $76.6 billion，同比增长 6.8%，连续第三年跑赢整体食品市场，说明消费者偏好持续转向。USDA Risk Management Agency
              把受控环境作物保险扩展到 48 个 county，并提供 85% 作物价值覆盖，降低了中型种植者融资风险。气候韧性是需求拉动因素：Mordor Intelligence 称，2024 年干旱让
              California 生菜产量下降 18%，批发价格上涨 22%，使室内农场在田间供应冲击期间更具价格竞争力。约束侧，电力成本仍是最大单项运营挑战。根据 EIA，2026 年初美国商业电价平均为 13.97
              cents per kWh（工业：8.94 cents/kWh），能源约占垂直农场运营成本的 25%。资本强度很高：绿地垂直农场成本为每 square meter
              $1,500–$2,500，几乎比被动温室高一个数量级。垂直农场板块融资从 2022 年 $2.8 billion 急剧下降到 2023 年 $680
              million，迫使许多运营商暂停新建。盈利作物组合窗口很窄——叶菜和微型蔬菜是唯一在规模化下经济性得到证明的作物——限制了收入多元化；来自 Mexico、Netherlands 和 Canada
              的露地及温室竞争对手则享有免费阳光带来的结构性成本优势。
