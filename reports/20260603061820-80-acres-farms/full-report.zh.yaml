      - CI025
      - CI027
      - CI028
  - id: FI003
    title: 财务估算区间 — 收入、毛利率和累计融资
    type: range
    layout: wide
    summary: >
      估算区间很宽，因为缺少审计财务数据；收入锚定管理层合并后 $200M 预测；毛利率区间从仍为负（行业基线）到小幅为正（公司自身说法）；融资区间低端由 SEC Form D 文件约束，中位由 AgFunder 的 $370M+
      约束。
    data:
      items:
        - label: 合并收入估算（FY2026，$M）
          low: 160
          mid: 200
          high: 230
          unit: $M
          displayValue: $160M–$230M
          detail: >
            中位锚定管理层所称首年合并收入“接近 $200M”（2025 年 8 月 Soli Organic 合并后）。低端反映整合风险（Harrisonburg 关闭、Georgia 裁员、Kalera
            设施爬坡时间）。高端反映 Kalera 爬坡快于计划及原料渠道贡献。
          source: 80 Acres Farms / Virginia Business / ProduceGrower
          tone: neutral
        - label: 农场层面毛利率估算（%）
          low: -10
          mid: 5
          high: 20
          unit: '%'
          displayValue: –10% to +20%
          detail: >
            低端参考 AppHarvest 2022 年可比项（–290% 很极端；–10%
            是更温和的失败情景）。中位反映公司称毛利为正，并由持续机构融资提供部分验证。高端只有在全面自动化、且高价产品组合能在规模化后维持时才可实现。
          source: AppHarvest 10-K / 80 Acres Farms management
