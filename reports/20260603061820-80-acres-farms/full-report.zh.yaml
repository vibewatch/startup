      - number: '2.6'
        title: 证据要点
        blocks:
          - type: callout
            title: 分析师 TAM 数字可能高估农产品收入 30–50%
            body: >
              GVR（$9.62B，2025）和 Mordor（$6.27B，2025）报告的全球垂直农场 TAM 对同一年份相差 53%。两者都可能包含 LED
              硬件、气候系统和软件支出；这些是农场运营商的资本开支，不是他们能捕获的农产品收入。投资者若把这些数字作为估值锚点，应先至少下调 30%，以隔离出农产品收入口径的可触达市场。
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
          - type: callout
            title: 行业破产潮至少到 2026 年都会压制投资者胃口
            body: >
              AeroFarms（Ch. 11，2023）、Bowery Farming（2023 年清算）、Infarm（2023 年破产）和 AppHarvest（2023 年破产）代表了 12
              个月窗口内最受关注的四起垂直农场失败。风险融资从 2022 年 $2.8B 降至 2023 年 $680M。虽然 80 Acres 在 2025 年 2 月筹集
              $115M，但板块资本成本仍偏高，增长假设需要用明显低于失败同行的单位经济性来证明。
