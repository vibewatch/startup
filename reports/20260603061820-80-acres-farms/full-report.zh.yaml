      - number: '5.2'
        title: Infinite Acres 技术平台与 GroLoop
        blocks:
          - type: paragraph
            body: >
              Infinite Acres 是 80 Acres Farms 的全资技术子公司，由 Tisha Livingston（联合创始人兼 Infinite Acres
              CEO）共同创立并领导，主要创新中心位于荷兰海牙，工程团队与更广泛的 80 Acres 农场网络协同。截至 2026 年中，Infinite Acres 约有 53
              名员工（LinkedIn），岗位覆盖农场系统工程、软件开发、控制系统和农学。


              Infinite Acres 的旗舰产品是 GroLoop。经过多年自研并在 80 Acres 农场网络中部署后，GroLoop 于 2026 年 5 月商业发布。GroLoop
              被描述为硬件无关的智能体农场操作系统，把环境控制、机器人、排程、产量分析和合规监控统一到一个平台中。发布时，GroLoop 管理六个州约 100 万平方英尺的受控环境农业，服务超过 18,000
              个零售点，并连接全球 1,000 多名 CEA 专业人员。平台设计为可向第三方种植者销售或授权，标志着公司在产品销售之外，战略性转向软件 / 平台收入流。


              Infinite Acres 的技术架构建立在公司称为 “Infinite Acres Loop system” 的三根支柱上：（1）专门打造的硬件栈——包括 Signify（原 Philips
              Lighting）园艺 LED 补光系统、Siemens 用于农场设计和能源优化的数字孪生模拟、SICK 实时环境监测传感器阵列，以及 TTA/TTA-ISO 精密机械；（2）应用农学软件——覆盖环境控制、AI
              指导的播种和采收排程、机器人编排、水肥管理和预测分析；（3）以性状为导向的植物遗传学，由 Plantae Biosciences 收购和 Infinite Acres Israel 遗传学设施承接。


              公司最初在 2018–2020 年阶段的农场中，与荷兰温室控制公司 Priva 合作做环境控制。到 2023 年，Siemens 合作和 Infinite Acres
              软件栈已在其旗舰设施中取代或补充第三方控制系统。GroLoop 平台正在改造并接入从 Kalera 收购的三座农场（Georgia、Texas、Colorado），以统一运营参数；Livingston
              将这种能力称为资产收购策略的关键差异化因素。
