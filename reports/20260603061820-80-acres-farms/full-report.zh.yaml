      - number: '8.3'
        title: 可比估值集与情景分析
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，没有一家纯垂直农场上市公司仍处于可比运营状态：AppHarvest（2020 年 SPAC 上市）已破产；Bowery
              已彻底关闭。最接近的可交易可比公司是传统温室和露地农产品运营商（Fresh Del Monte、Dole），它们按 0.2–0.5x
              收入交易，但由于资本强度和能源成本低得多，结构上不可比。最有启发的私募市场可比是 AppHarvest 的 SPAC 隐含估值轨迹：2020 年上市时隐含企业价值 $1B+，到 2022 年 6 月非关联方市值仅
              $259.7M（见其 10-K），一年后申请破产，FY2022 净销售 $14.6M、毛损 $42.4M。这说明，一旦单位经济性不能随规模改善，垂直农业估值可以多快恶化。


              对 80 Acres 而言，可按 $200M 预计收入兑现程度和可维持倍数分成三组情景。乐观情景下，Soli 并购整合把收入推至 $250M，单位利润率改善（管理层称 60% CAGR
              可持续），反映技术平台护城河和全国分销的 3.0–4.0x 收入倍数，对应企业价值 $750M–$1B。基准情景下，收入达到 $175–200M，但 Harrisonburg 类型关闭和整合成本压低 EBITDA
              利润率，适用 1.5–2.5x 倍数，对应 $263M–$500M 企业价值。悲观情景下，并购后重组成本高于披露，一处设施需要关闭，关键客户减少采购订单，或发生降估值轮；$120–140M 收入配
              0.8–1.2x 倍数，意味着企业价值 $96M–$168M。AppHarvest 可比案例说明，如果基本单位经济性不改善，悲观情景可以归零。


              有机农产品类比在方向上有用：Driscoll's（私有）和 Taylor
              Farms（私有）各自收入达数十亿美元，但交易倍数会接近大宗食品（0.5–1.5x）。拥有经常性收入模式（SaaS、授权）的高端食品科技公司可获得 3–8x 收入倍数，但 80 Acres
              尚未拥有经常性技术收入流；截至 2026 年 6 月，GroLoop 仍仅供内部使用。对 $200M 预计收入应用 2–3x 倍数（$400–$600M
              企业价值）是证据基础最好的基准区间，但需受制于未经审计收入、未经验证利润率和未知优先权压力带来的实质不确定性。
