      - number: '7.4'
        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              财务模型风险很直接：公开证据仍无法证明 80 Acres 已摆脱压垮同行的资本强度陷阱。公司披露中有强势投资者和 60% 收入 CAGR，但 SEC 文件仍拒绝披露收入，2025B Form D
              相比运营雄心看起来只是规模较小的跟投，并且公司同时承担整合工作、站点优化和伙伴融资扩张。人员风险遵循同一模式。公司仍显得以 Mike Zelkind 和 Tisha Livingston
              两位创始人为中心，同时整合 Soli 团队、Plantae 的以色列科学团队和 Kalera 资产。Virginia Business 报道其全国员工超过 1,200 人，而 Harrisonburg 关闭和此前
              Georgia 裁员都出现在同一个整合窗口。行业基准让这种组合很危险。AppHarvest 的文件显示，单设施集中、独家分销依赖、食品安全暴露和紧迫融资需求可以多快叠加；Plenty 的 2025
              年重组显示，即便私募融资总额很大，一旦增长叙事和成本叙事脱节，也买不到太多时间。结果是，投资者在看到并购后利用率、利润率耐久性和资金充足性的可审计证明前，剩余风险仍然偏高。
