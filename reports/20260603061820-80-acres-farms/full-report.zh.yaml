    type: pyramid
    layout: standard
    summary: |
      从最宽的全球垂直农业总可用市场（TAM），到美国高端农产品可服务市场（SAM），再到 80 Acres Farms 受约束的可获取市场（SOM）注释，构成三层规模金字塔。
