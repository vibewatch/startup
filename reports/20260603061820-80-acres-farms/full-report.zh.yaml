      - number: '3.4'
        title: 护城河耐久性、行业失败与结构性竞争风险
        blocks:
          - type: paragraph
            body: >-
              室内农业行业的大规模失败记录——Bowery Farming（融资 $700M+，Fidelity 减记 99%）、AppHarvest（融资 $475M，联邦诉讼、OSHA 投诉）、Plenty（融资
              $800M+，Chapter 11）和 AeroFarms（融资 $238M，Chapter 11）——说明能源成本、资本强度和消费者价格敏感性是结构性风险，而不是个别公司问题。所有室内垂直农场都需要为 LED
              照明、HVAC 和自动化承担巨大电力负荷，这是田间种植者不需要的。80 Acres Farms 声称 100% 使用可再生电力，这改善可持续性观感，但并不能消除绝对能源成本负担。MarketsandMarkets
              预测全球垂直农场市场将从 2022 年约 $5.6 billion 增长到 2030 年 $23.5 billion（约 19.5%
              CAGR），显示品类顺风；但同样的顺风此前也吸引资本涌入如今已经失败的企业。80 Acres Farms 的竞争护城河在这些地方最耐久：GroLoop 平台、工业合作伙伴生态、Plantae
              遗传能力，以及大型农场运营共同形成温室运营商难以轻易复制的壁垒。零售关系——尤其是 Kroger 分销网络和合并后的 Soli Organic 足迹——构成第二层护城河，并随规模叠加。不过，2025 年 7
              月关闭 Virginia Harrisonburg 设施提醒投资者，即便是品类中最强的运营商，单场经济性也可能失效；高端定价上限仍是长期扩张的未解约束。
