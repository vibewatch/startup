  - id: FE001
    title: Infinite Acres 技术平台层
    type: stack
    layout: wide
    summary: >-
      Infinite Acres 平台分为四个整合层：战略伙伴硬件生态（Signify、Siemens、SICK、TTA-ISO）、自研软件和环境控制层（GroLoop OS）、应用农学层（AI 引导的种植配方、产量分析），以及遗传
      / 生物层（Plantae / Infinite Acres Israel）。这些层叠加成一个垂直整合的 CEA 操作系统，旨在跨不同规模的室内农场优化产能、一致性和成本。
    data:
      layers:
        - label: 遗传与生物层
          sublabel: Infinite Acres Israel (Plantae Biosciences) — Weizmann Institute collab
          detail: 用代谢组学 + 基因编辑培育 CEA 优化作物性状（风味、产量、营养）；处于 R&D 阶段；截至 2026 年中未发布商业品种
          level: 4
        - label: 应用农学与 AI 分析层
          sublabel: Proprietary algorithms + agronomists
          detail: AI 驱动的生长配方优化；产量预测；持续优化环境设定点；按作物定制光合协议
          level: 3
        - label: GroLoop OS – 软件与控制层
          sublabel: Infinite Acres proprietary (commercial launch May 2026)
          detail: 硬件无关的农场 OS；统一环境控制、机器人调度、水 / 营养液投放、合规监控和分析；管理约 1M sq ft
          level: 2
        - label: 硬件生态层
          sublabel: Signify (LED) · Siemens (Digital Twin) · SICK (Sensors) · TTA-ISO (Automation)
          detail: 在 80 Acres 农场网络验证的联合优化硬件栈；Signify 全光谱 LED、Siemens 虚拟农场仿真、SICK 环境监测阵列、TTA-ISO 精密播种 / 移栽 / 采收机器人
          level: 1
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FE002
    title: 从种子到货架的运营流程
    type: flow
    layout: wide
    summary: >-
      80 Acres / Infinite Acres 运营流程从种子选择开始（越来越多由 Plantae 遗传项目提供信息），经过受控室内发芽、AI 引导种植周期、机器人采收、农场内包装，再到直接面向零售的分销；GroLoop
      OS 监控并优化每个环节。短供应链（农场距零售仅数小时）是相对跨州运输的田间农产品的核心新鲜度差异。
    data:
      nodes:
        - id: step-genetics
          label: 种子 / 遗传
          detail: 种子由 Plantae/Infinite Acres Israel 遗传项目选择或改造；面向 CEA 优化的性状（产量、风味、质地、营养）
          tone: positive
        - id: step-germination
          label: 发芽与育苗
          detail: 种子在无菌、气候受控的育苗区发芽；GroLoop OS 管理温度、湿度和光照周期
          tone: positive
        - id: step-grow
          label: 受控环境种植
          detail: 多层垂直种植塔配备按作物调校的 Signify LED 照明；SICK 传感器实时监测环境；AI 调整设定点；Hamilton 约 10 个生长层；机器人管理植株移动
          tone: positive
        - id: step-harvest
          label: 机器人采收
          detail: TTA/TTA-ISO 精密机器人在最佳成熟度采收；相对人工采收降低劳动力成本和污染风险
          tone: positive
        - id: step-pack
          label: 农场内包装
          detail: 产品在现场气候受控区域包装；包装形式包括沙拉包、翻盖盒和香草包；从切割到装箱时间短
          tone: positive
        - id: step-distribute
          label: 区域分销与零售
          detail: 短途配送至区域杂货零售和餐饮服务；Kroger、Whole Foods、Meijer、Sysco、US Foods；合并后 18,000+ 个零售门店
          tone: positive
      edges:
        - from: step-genetics
          to: step-germination
          label: 种子完成选择
        - from: step-germination
          to: step-grow
          label: 幼苗转移
        - from: step-grow
          to: step-harvest
          label: 作物成熟
        - from: step-harvest
          to: step-pack
          label: 采收农产品
        - from: step-pack
          to: step-distribute
          label: 包装成品
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE018
