  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分层与渠道覆盖
        blocks:
          - type: paragraph
            body: >-
              公开客户证据指向的是买方、用户和付款方混合的栈，而不是单一客户。直接买方通常是杂货生鲜品类经理或餐饮服务采购团队；最终用户是杂货消费者或餐厅食客；承担库存风险并付款的是零售商、分销商或运营商。Soli
              Organic 并购前，证据最充分的细分市场是通过 Kroger 进入传统杂货渠道，另有美国东部 1,500 多家零售商和餐厅的更广泛基础。2025 年 3 月 Kalera 资产收购把地理覆盖延伸到
              Georgia、Texas 和 Colorado，并明确把零售商和食品分销商作为联合商业化渠道。2025 年 8 月并购后，分层再次拓宽：80 Acres 的垂直农场沙拉、套装、番茄和微型蔬菜，与 Soli
              长期经营的香草版图并列，显著提高全国杂货覆盖。不过，17,000 个门店的说法最好理解为合并网络数字，而不是证明今天每个门店都上架同一套 80 Acres 品牌
              SKU。管理层另行提到的配料渠道语言，也暗示一个正在出现的 B2B 客户分层，但没有公开具名配料客户。
