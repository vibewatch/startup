  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 第二座主要设施关闭
        - Harrisonburg（2026 年 7 月）之后 12 个月内任何新增设施关闭，影响 >50 名员工。
        - 显示合并后单位经济性没有改善，$200M 收入预测存在风险；也可能暴露 Form D 2025B 之外的资本需求。
        - 暂停或减仓；进一步投入前索取更新后的设施级 P&L；升级为正式观察状态。
      - - 降价轮或困境债务融资
        - 新增股权或债务融资的每股价格或隐含 EV 低于 2023–2025 Series C 标记，或以困境条款引入 KKR 型有担保债务。
        - 暴露投资方估值压缩，并显示此前估值标记难以维持；优先权悬挂风险急剧上升。
        - 重新评估持仓；若确认降价轮低于 $400M，意味着悲观情景落地；退出或重组既有承诺。
      - - 联合创始人离职
        - Mike Zelkind（CEO）或 Tisha Livingston（Infinite Acres CEO）离开公司，且没有明确具名、有经验的继任者。
        - 关键人集中是已披露风险；联合创始人掌控技术路线图、资本获取和零售关系；离职会显著抬高执行和融资风险。
        - 立即召开尽调电话；将风险评级上调至关键；继任者完成评估前不投入新资本。
      - - 零售伙伴缩减
        - Kroger、Whole Foods 或任何贡献预计收入 >15% 的伙伴宣布减少或终止 80 Acres 货架陈列。
        - 零售客户集中是主要 GTM 约束；主要伙伴退出会压低收入，也说明溢价点位下消费者需求不足。
        - 调查根因；若由价格 / 利润率而非质量驱动，更新收入模型；考虑重校准至基准到悲观情景。
      - - 垂直农业行业监管负面事件
        - FDA 因食品安全失败对室内农场采取 FSMA 执法行动；或 USDA 修改有机认证规则，使室内种植农产品处于劣势。
        - 行业层面声誉风险；可能加速溢价敏感度上升，并让所有 CEA 运营商面对更谨慎的零售买方。
        - 评估 80 Acres 具体暴露；若问题属于全行业，维持持仓；若任何 80 Acres 设施被牵涉，立即升级。
      - - 流动性危机或过桥贷款
        - 任何设施出现公开 WARN Act 文件、租约违约或供应商付款违约；或 Form D 显示在异常时点融资 <$10M。
        - 显示公司现金生成或资本市场准入已恶化到低于运营需求；随后降价轮或出售的概率高。
        - 视为阻断项；不投入新资本；请法律顾问分析债权人清偿顺序。
    notes: 触发阈值是指示性的分析师估计；实际监控阈值应由能够访问审计现金流数据的领投方校准。
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - 80 Acres Farms 以及 Soli 合并后实体的 FY2024 和 FY2025 审计 P&L、资产负债表和现金流量表。
        - 所有收入和利润率说法都来自公司；AppHarvest 的 –290% 毛利率说明管理层预测可能与现实偏离多大；没有审计数据就无法给交易定价。
        - 在正式数据室向管理层索取；若无法提供，至少要求 SAS 70 / SOC 2 报告和过去 12 个月管理账。
      - - 股权结构表和优先股堆叠
        - 完整股权结构表，列出普通股与优先股、清算优先权、反稀释条款，以及各轮任何参与型优先股条款。
        - 已有记录的 $313.5M+ 优先股权益，会在任何退出收益中形成结构性优先索取；若悲观情景退出低于 $500M，优先权悬挂可能让普通股归零。
        - 直接向 80 Acres CFO / 法律顾问索取；复核三份 Form D 文件的投资者名单作交叉核验（2025A 有 81 名投资者；2022 有 29 名）。
      - - 设施级单位经济性
        - Hamilton OH、Boone County KY，以及至少一座 Kalera 收购设施的毛利率、每 lb 农产品能源成本、单位劳动力成本和单位折旧。
        - >-
          管理层声称“农场单位经济性已盈利”，但没有独立支持；Harrisonburg 关闭和 Georgia 裁员显示并非所有站点都有经济性；Boone County 每 sq ft $475 的 capex
          暗示较高的盈亏平衡吞吐量。
        - 索取设施级月度管理账；对标 USDA CEA 普查数据和 ProduceGrower 行业盈亏平衡分析。
      - - 并购后整合成本计划
        - 正式整合计划，列出一次性重组费用（Harrisonburg 关闭、Georgia 裁员）、遣散责任，以及 Soli 技术迁移成本。
        - $200M 合并收入预测没有纳入整合成本；Harrisonburg（80 名 WARN Act 员工）和 Soli 并购前 Georgia 裁员（128 名员工）代表至少 $5–15M 重组费用，公开数字均未反映。
        - 索取 WARN Act 通知和完整遣散责任计划；如可得，复核并购后董事会会议纪要。
      - - Arizona SPV 目的和资本承诺
        - Eloy I10 & Tonto Road 80 Acres LLC 的目的和资本结构（CIK 0002056260，2025 年 2 月 Form D，已融资 $28.4M，Phoenix AZ）。
        - 公司层面的 Arizona 项目载体，意味着新的农场扩张或项目融资结构，未体现在公司层面的 Form D 文件中；对总资本承诺分析很重要。
        - 向管理层索取；在 EDGAR 复核 Arizona Form D 文件（adsh 0002056260-25-000001），确认发行规模和投资者名单。
      - - Kentucky 激励提款计划
        - Boone County 设施的 KEDFA 税收抵免和 KEIA 补助提款计划，包括条件、里程碑和任何追回条款。
        - 州激励会降低实际 capex 负担，但以绩效为条件；若就业或产量里程碑未达成（例如并购后重组导致），激励追回会抬高有效 capex。
        - 向管理层索取；依据 KY Open Records Act 向 KEDFA 提交申请，获取激励协议条款和任何修订通知。
    notes: 尽调事项按阻断严重性排序；第 1 项（审计财务）和第 2 项（股权结构表）是任何本金投资决策的前置条件，不取决于对战略逻辑的确信度。第 3–6 项是完整承销所需，但可与初步财务复核并行推进。
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      80 Acres Farms 的里程碑从 2015 年 Cincinnati 初创起步，经过 2021 年成长股权融资拐点、2023 年 Kentucky 产能跃迁和 2025 年 Soli Organic 合并；2026
      年设施关闭则提示并购后整合压力。
    data:
      items:
        - date: '2015'
          label: 成立
          detail: Mike Zelkind 和 Tisha Livingston 在 Ohio 州 Cincinnati 联合创办 80 Acres Farms；聚焦全自动化和受控环境农产品。
          tone: positive
        - date: 2018-09
          label: Hamilton 动工
          detail: 宣布在 Ohio 州 Hamilton 建设美国首座全自动室内农场；标志下一代概念验证。
          tone: positive
        - date: 2019-01
          label: Series A 轮 – Virgo
          detail: Virgo Investment Group 领投 >$40M Series A，资金用于完成 Hamilton 设施和早期自动化建设。
          tone: positive
        - date: 2021-08
          label: Series B 轮 – $160M（General Atlantic）
          detail: General Atlantic 领投 $160M Series B；报告收入增长 450%+；8 座农场、600+ 个零售 / 餐饮网点；Shaw Joseph 加入董事会。
          tone: positive
        - date: 2022-01
          label: Kentucky 设施公布
          detail: Boone County 设施随 KEDFA 激励一并公布；计划成为公司最大农场，面积 200,000 sq ft。
          tone: positive
        - date: 2023-09
          label: Kentucky 农场投产
          detail: $95M 农场在 Kentucky 州 Florence / Boone County 投产；规模为此前最大农场的 3×；年产能 40M 份；创造 125 个岗位。
          tone: positive
        - date: 2025-02
          label: 融资 $115M + 收购 Plantae
          detail: 宣布 2024 年总额 $115M 的融资；收购 Plantae Biosciences（Israel），为 Infinite Acres 增加加速植物育种能力。
          tone: positive
        - date: 2025-03
          label: 收购 Kalera 农场
          detail: 以困境估值收购三座原 Kalera 垂直农场（GA、TX、CO）及 IP；以轻资本方式扩大全国足迹。
          tone: positive
        - date: 2025-08
          label: Soli Organic 合并
          detail: 与 Soli Organic 战略合并；合并实体预计收入约 $200M；17,000+ 个零售网点；7 座农场；约 1,400 名员工；Walter Robb 加入董事会。
          tone: positive
        - date: 2025-08
          label: Soli Georgia 裁员（并购前）
          detail: 合并宣布前数日，Georgia 裁撤 128 个岗位；释放并购前合理化信号。
          tone: warning
        - date: 2026-05
          label: Harrisonburg, VA 关闭
          detail: 裁撤 80 个岗位；Harrisonburg 原 Soli Organic 站点于 2026 年 7 月 21 日关闭；运营整合至 Atlanta 和 Indianapolis。
          tone: warning
    approximationNotes: 2019 Series A 和 2021 Series B 的日期采用官方新闻稿的宣布 / 交割日期。2024 年融资在 2024 年分批执行，但于 2025 年 2 月公开宣布。
