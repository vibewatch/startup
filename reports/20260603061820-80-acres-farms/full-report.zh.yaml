      - number: '6.4'
        title: 扩张循环、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              扩张循环直观清楚：先在一个零售品牌验证需求，再增加周边农场改善服务半径，扩宽 SKU 组合，随后用更大的网络赢下新零售品牌或餐饮服务节点。Soli Organic
              并购通过带来长期香草关系和更广的全国版图，加速这一循环；Kalera 资产收购则增加本地农场，可支撑分布式补货。但同一结构也带来集中度和整合问题。公开材料不披露头部客户收入占比，投资者无法判断 Kroger
              是否仍是主导账户，也无法判断 17,000 个门店网络是否已在多个零售品牌间充分分散。2026 年 5 月 Harrisonburg 关闭加重了这种不确定性，因为它显示客户覆盖可以迅速围绕 Atlanta 和
              Indianapolis 枢纽重新组织。采购摩擦也确实存在：运行日三个面向客户的 80 Acres 网页返回 404，多个为客户验证提供的新新闻 URL
              也无法访问。这些缺口让外部验证更困难，而这些正是尽调最需要精确的地方——活跃门店、实时 SKU 和续约耐久性。
