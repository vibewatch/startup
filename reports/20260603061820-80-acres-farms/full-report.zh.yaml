        - ~$475M
        - $1.3B+（SPAC，2020）；$259.7M 市值（2022 年 6 月）
        - FY2022 净销售额 $14.6M（–290% 毛利率）
        - 唯一公开上市的纯垂直农场，拥有 SEC 审计的 P&L；作为警示性数据点，单位经济性可直接对比。
        - 已破产；EV 接近归零；不是可用于估值上行的持续经营可比公司。
