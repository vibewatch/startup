      nodes:
        - id: tam
          label: 全球 VF 总可用市场（TAM，2025）
          value: $6.3B–$9.6B
          note: 分析师区间：Mordor $6.27B 至 GVR $9.62B；包括硬件和作物收入
        - id: sam
          label: 美国高端农产品可服务市场（SAM）
          value: ~$2.5B–$4.0B
          note: 北美约占全球 VF 的 41%；包括高端渠道中的农产品收入
        - id: som
