      - number: '4.2'
        title: 资本充足性与融资结构
        blocks:
          - type: paragraph
            body: >
              80 Acres Urban Agriculture, Inc.（SEC CIK 0001925495）是一家总部位于 Ohio Hamilton 的 Delaware 公司，已向 SEC 提交三份 Form D
              豁免发行文件，合计记录截至 2025 年从至少 81 名投资者处筹集 $313.5 million。2022 年文件（首次销售 2021-06-17）记录从 29 名投资者筹集 $170.8M；2025A
              文件（首次销售 2023-06-08）记录 $150M 发行，其中 $114.3M 已售予 81 名投资者；2025B 文件（首次销售 2025-08-13）记录从 72 名投资者处筹集 $28.4M。加上估计的
              2022 年前轮次（Virgo Investment Group 2019、早期天使），总融资达到 AgFunderNews 2025 年 2 月引用的 $370M+ 数字。


              公开宣布的 2022 年 7 月 $160M Series B 由 General Atlantic 领投，Siemens Financial Services、Barclays、Blue Earth
              Capital、Taurus Investment Holdings 和 BeyondNetZero impact fund 参投。随后在 2025 年 2 月宣布的 $115M（覆盖 2024 年交割）引入
              Virgo Investment Group、Western and Southern Life Insurance Company，并有返投投资者参与。这个投资者基础在战略上自洽：Siemens
              的参与连接公司的数字孪生和能源管理合作，General Atlantic 则提供全球成长型股权经验，以及扩张食品和消费业务的记录。


              现金余额、月度烧钱速度和现金跑道都没有公开披露。三份 SEC Form D 文件在收入区间字段均列为 “Decline to Disclose”，使独立现金流建模不可能。Kentucky Economic
              Development Finance Authority（KEDFA）与 Boone County 设施绑定的激励，通过基于绩效的税收抵免降低实际 capex 负担，但这些激励的金额和时点没有公开披露。
