      - number: '3.2'
        title: 技术平台、产品广度与分销触达
        blocks:
          - type: paragraph
            body: >-
              80 Acres Farms 的主要竞争优势是 GroLoop 技术平台，由其子公司 Infinite Acres 运营。GroLoop 把精密传感器、AI
              驱动的作物优化、环境控制、自动化物流和需求预测整合进一个垂直统一系统。技术合作伙伴——Siemens 负责工业自动化和数字孪生模拟，Signify 负责园艺照明，SICK 负责传感，Priva
              负责气候管理，Ocado 负责物流——让 GroLoop 拥有幸存直接同行都未公开披露过的工业整合深度。2024 年收购 Plantae Biosciences（持有 Weizmann Institute
              加速植物育种独家许可）增加了自有作物遗传能力，强化平台长期防御性。产品广度上，80 Acres 是唯一一家活跃的室内农业公司，能从单一整合供应链提供沙拉混合菜、新鲜香草（通过 Soli
              Organic）、微型蔬菜、番茄、黄瓜和自有品牌沙拉调味酱（通过 Mother Raw）。AeroFarms 已收窄到只做微型蔬菜。Gotham Greens 区域性生产叶菜和调味酱。BrightFarms 和
              Little Leaf 聚焦生菜。Revol Greens 从 Midwest 和 Texas 设施生产沙拉菜。Plenty 正完全转向草莓。仅 Kentucky 农场就占地 200,000 square
              feet，建设成本 $95 million，每年可生产约 40 million 份农产品，树立了多数幸存同行在单一场址难以匹配的规模参照。
