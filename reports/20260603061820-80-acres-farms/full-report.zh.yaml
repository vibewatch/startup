  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的概览
        blocks:
          - type: paragraph
            body: >-
              最严重的风险不是单一起诉或召回，而是资本强度、整合波动和并购后经济性仍未验证三者叠加。80 Acres 要求投资者相信，Soli 并购、Kalera
              改造项目和此前技术投入已把公司推入更有韧性的阶段，但公开记录仍显示近期裁员、2026 年 7 月设施关闭、当前 SEC 文件不披露收入，以及对伙伴资本和伙伴渠道的持续依赖。Soli 合并后不久就关闭
              Harrisonburg 尤其重要，因为这是管理层开始宣传 17,000 个门店、近 $200 million
              合并平台后，第一条硬性反证运营信号。行业先例让这一风险难以忽视：AppHarvest、AeroFarms 和 Plenty 都曾达到规模、融资金额可观，但一旦承购安排、设施集中度或单位经济性破裂，最终仍进入
              Chapter 11 或紧急重组。这并不能证明 80 Acres 会走同一条路，但意味着投资者应先把它按资本纪律严格的农产品运营商来承销，其次才把它视为技术平台故事。
