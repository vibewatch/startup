      - number: '7.5'
        title: 缓释因素、触发器与否决标准
        blocks:
          - type: paragraph
            body: >-
              管理层确实有一些可信缓释因素：业务有蓝筹投资者，Soli
              并购后零售版图更大，能够复用困境资产而不是总建新农场，技术栈也有可信的自动化伙伴。问题在于，没有任何一个缓释因素可以自证。每一项都必须转化为可监测证据。投资者应期待三个近期证明点：第一，在合并网络据称扩张时，不再出现额外重大关闭或
              WARN 通知；第二，下一次融资事件的规模和定价像主动增长资本，而不是过桥流动性；第三，80 Acres 能在 Kroger
              扩张标题和旧版隐私政策之外，拿出可信的客户多元化和合规控制。如果任一测试失败，投资逻辑应迅速修订。投资逻辑破裂不需要破产或召回；再次关闭、内部人占比高且规模偏薄的过桥轮、零售商下架，或 FDA/USDA
              合规事件，都足以把风险评级显著推高，因为这些都会削弱支撑当前叙事的核心主张——冗余、规模、供应链韧性和盈利单位经济性。
