      - number: '3.3'
        title: 定价动态、零售分销与竞争性 GTM
        blocks:
          - type: paragraph
            body: >-
              没有任何室内农业竞争对手——包括 80 Acres Farms、AeroFarms、Gotham Greens、BrightFarms 或 Little Leaf Farms——公布公开标价、单件零售价格表或
              B2B 合同结构。整个板块完全依靠定制化零售买手谈判运转，进场费、促销补贴和销量承诺条款都不公开。80 Acres Farms 在公开沟通中不披露已实现毛利率、合同条款，也不披露相对传统农产品的定价。Bowery
              Farming 失败的记录部分归因于消费者对室内农业高端价格接受度不足，这对所有运营商都是结构性警示。80 Acres Farms 最清晰的竞争差异点是分销：2019 年从 Cincinnati 单个
              Kroger 门店起步，到 2021 年扩展到约 300 家 Kroger 门店，并在 2023 年宣布计划覆盖 Midwest 和 Southeast 约 1,000 个 Kroger 网点。公司还通过
              Sysco 和 US Foods 分销，除了零售杂货外也触达餐饮服务买方。合并后的 Soli Organic 网络把香草产品加入 17,000+ 门店，包括美国前 10 大零售商中的
              70%，使合并公司拥有任何室内农业同行都无法证明的分销触达。根据公司披露，80 Acres Farms 到 2024 年收入复合年增长率为 60%，但底层毛利率轨迹仍属私密信息。
