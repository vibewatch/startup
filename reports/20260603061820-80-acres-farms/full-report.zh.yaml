chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 是一家处于成长阶段的私营垂直农场公司，总部位于 345 High Street, 7th Floor, Hamilton, Ohio 45011。公司由食品行业资深高管 Mike
              Zelkind 和 Tisha Livingston 于 2015 年在 Cincinnati 周边创立，之后将总部迁至
              Hamilton，并在多个州保留农场。公司宣称的使命是控制室内种植环境的每个环节，种出最新鲜、最安全、营养最高的农产品；其用电 100% 来自可再生电力，每磅农产品耗水量比传统农业少约 95%。


              商业模式围绕垂直一体化室内农业展开：公司开发并运营大规模受控环境农场，使用其自研 GroLoop 技术平台（由全资子公司 Infinite Acres
              开发），种植多元产品组合——沙拉混合菜、沙拉套装、香草、微型蔬菜、番茄和调味酱——并主要通过大型杂货零售和餐饮服务渠道以自有品牌分销。产品已进入 Kroger、Whole Foods、Meijer
              以及数千个其他零售网点。公司不公开披露按产品线划分的收入，也不披露毛利率结构。


              2025 年 8 月与 Soli Organic 合并后，合并公司还以 Soli Organic 品牌销售 USDA Certified Organic
              香草和叶菜，把产品组合延伸到田间种植的有机农产品，并覆盖超过 17,000 个美国零售门店。公司收入来自零售产品销售；Infinite Acres 技术平台目前没有披露订阅、授权或 SaaS
              收入流，不过公司正在探索未来将 GroLoop 商业化给第三方种植者。
