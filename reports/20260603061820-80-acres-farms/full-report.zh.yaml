      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              80 Acres go-to-market 模式中的主要买方和付款方是杂货零售连锁——公司的农产品在传统超市、天然 / 高端商店和大众市场杂货商销售。美国截至 2024 年约有 45,575
              家超市（包括传统超市、有限品类杂货店、大型商超、仓储杂货店、会员店和天然 / 高端商店），合计销售额约 $915 billion。FMI 报告称，美国人在 2024 年把可支配收入的 5.0%
              用于家庭食品，反映出庞大而稳定的需求池。在杂货店内，鲜食农产品部门通常贡献门店收入的
              8–12%，也是最能带动客流的品类之一，使农产品供应商相对于中心货架包装食品具备显著谈判杠杆。终端用户是注重健康的消费者，他们寻找无农药、本地种植、高端鲜食农产品；根据 Mordor Intelligence
              引用的消费者调查数据，他们愿意为这类产品支付 15% 或更高溢价。零售层面的付款方是杂货买手（品类经理），他们控制货架位置、定价层级和促销预算。餐饮服务分销商构成次级买方群体——80 Acres
              历史上也供应过一些餐厅和机构客户——但零售仍是主要渠道。特色农产品预算位于杂货品类经理的采购预算内，连锁客户通常由区域或全国总部决策，独立门店则在门店 /
              市场层面决策。触发零售连锁采用的因素包括货架差异化、自有品牌本地化潜力、封闭系统种植的食品安全优势，以及全年供应链一致性。
