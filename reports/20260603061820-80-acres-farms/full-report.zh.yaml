        - $2.3B（2021，Bloomberg 报道）
        - 未披露（基于关闭时间线，可能 <$30M）
        - 按产品宽度和 VC 背书看，它是 80 Acres 最接近的战略同业；显示行业在周期高点可达到的同业 EV 上限。
