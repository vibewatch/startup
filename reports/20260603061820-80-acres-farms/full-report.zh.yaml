          - type: callout
            title: 有机市场增长带来高端定价顺风
            body: >
              2025 年美国有机销售额达到 $76.6 billion，同比增长 6.8%，是整体食品市场增速的两倍，并且连续第三年如此。有机农产品是有机品类中最大的单一类别。消费者对清洁标签、可追溯农产品的结构性偏好，为
              80 Acres 这类无农药 CEA 生产商创造了持久的高端定价窗口，前提是公司能可信地传达其生产优势。
