  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: 公司的竞争位置从运营商出身的创始团队出发，经由自有技术平台延伸到全国农场产能、多元农产品和广泛零售分销；主要约束是资本强度和整合风险。
    data:
      nodes:
        - id: founders
          label: 创始团队
          detail: 食品行业老将 Zelkind 和 Livingston 带来垂直农业少见的制造规模运营经验；文化重运营。
          tone: positive
        - id: technology
          label: Infinite Acres / GroLoop 平台
          detail: 自有硬件、软件、环境控制、机器人和 AI 驱动优化；由 Tisha Livingston 担任 CEO 的全资子公司。
          tone: positive
        - id: capital
          label: 资本基础（已融资 $370M+）
