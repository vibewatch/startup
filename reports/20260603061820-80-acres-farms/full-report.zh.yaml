      - number: '5.5'
        title: 质量、合规与可持续性
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 的质量与安全框架围绕 FSMA Produce Safety Rule 合规、无农药种植实践和以食品安全为核心的受控环境搭建。作为大规模覆盖式农产品运营商，公司受 FDA 的
              FSMA Produce Safety Rule 约束；该规则为供人食用水果和蔬菜的安全种植、采收、包装和储存制定基于科学的最低标准。覆盖结构下的室内农场可能符合规则中的若干豁免条件，但像 80 Acres
              这样的大型商业运营通常必须遵守水质、员工培训、设备卫生和记录保存等标准。


              公司把农产品营销为无农药，这是关于种植投入品的事实性声明，而不是第三方认证。不同于 USDA Organic——其认证框架要求露地种植条件——无农药室内农产品占据独立市场位置。公司没有为 80 Acres
              品牌产品申请 USDA Organic 认证，不过并购后的产品组合包含 Soli Organic 的 USDA Certified Organic 产品。


              可持续性方面，80 Acres Farms 承诺参与 Science Based Targets initiative（SBTi），目标是在 2030 年前以 2021 年为基线，将 Scope 1 和
              Scope 2 温室气体排放减少 42%。公司报告称，整个农场网络使用 100% 可再生电力，约 95%
              灌溉水被回收利用，并清除了所有合成农药和除草剂投入。公司的可持续性战略围绕四根支柱展开：Plants（种植效率）、Product（包装）、People（社区参与）和 Plans（农场基础设施）。Siemens
              数字孪生合作被特别提及，用于支持农场层面的能源优化和温室气体减排目标。
