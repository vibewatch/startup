      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 是一家私营公司，自 2019 年以来已通过多轮股权融资筹集超过 $370 million。融资轨迹说明，即便许多垂直农场同行已经申请破产或停止运营，投资者仍对团队和运营执行保持信心。


              2019 年 1 月，Virgo Investment Group（San Francisco Bay Area 私募股权公司）领投超过 $40 million 的 Series A 股权融资，用于完成 Ohio
              Hamilton 旗舰设施；该设施当时被定位为北美第一座全自动室内农场。约在 2020 年 11 月，公司完成第二笔 Series A 融资，Virgo 继续参与，金额未公开披露。2021 年 8
              月，General Atlantic 领投 $160 million Series B，Siemens Financial Services（技术与战略投资方）、Blue Earth
              Capital（影响力私募股权）、Barclays（同时担任唯一配售代理）、Taurus Investment Holdings 以及 General Atlantic 的 BeyondNetZero
              气候影响团队参投。到那时，公司自 2020 年底以来收入增长超过 450%，通过 8 座农场服务超过 600 个零售和餐饮服务网点。


              2024 年，80 Acres 又从返投投资者（General Atlantic、Siemens Financial Services、Barclays Climate Ventures、Virgo、Blue
              Earth Capital）和新参与者（The Western and Southern Life Insurance Company 以及其他 Midwest 金融机构）处筹集 $115
              million。公司同期收购 Plantae Biosciences（Israel）和 Mother Raw 调味酱，并在 Netherlands The Hague 开设 Field Lab。截至 2025 年
              2 月公开公告，AgFunderNews 称累计融资超过 $370 million，而 University of Cincinnati 报道称总额超过 $400
              million。公司任何一轮融资都未公开披露估值；分析师数据库显示公司接近独角兽区间，但没有一手来源确认具体数字。
