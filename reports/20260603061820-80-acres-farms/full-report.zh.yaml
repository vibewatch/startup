            body: >-
              有时间顺序且跨来源的证据最能支撑采用故事。Kroger 是最清晰案例：Kentucky 和 Lane Report 的回顾性报道称，80 Acres 2019 年从 Cincinnati 市中心一家 Kroger
              门店起步，到 2021 年扩展到 Ohio、Indiana 和 Kentucky 超过 300 家门店，并在 2023 年宣布计划进入中西部和东南部近 1,000 家 Kroger 门店。2026 年 6 月的新
              Kroger 搜索仍返回一个包含 13 个结果的 80 Acres Farms 品牌过滤项，这是零售商原生层面最好的信号，说明实时商品组合仍在。Kroger 之外，公开证明质量明显下降。2018 年
              PRNewswire 稿件称 Hamilton 农场将供应 Whole Foods Markets 和 U.S. Foods，能支撑历史生产关系，但当前 Whole Foods 搜索界面依赖 JS，Meijer
              搜索 URL 在运行日返回错误页。因此，公开资料对具名客户的枚举只能算部分：Kroger 证据强；Whole Foods 和 U.S. Foods 有历史证据但已经陈旧；Meijer 明显更弱。
