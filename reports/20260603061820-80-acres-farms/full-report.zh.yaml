      - number: '5.3'
        title: 研发与植物遗传学
        blocks:
          - type: paragraph
            body: >
              Infinite Acres Loop system 的第三根支柱——以性状为导向的植物遗传学——通过 2025 年 2 月收购以色列生物技术公司 Plantae Biosciences 正式落地。Plantae
              Biosciences 专注于代谢组学驱动的作物工程和基因组编辑，加速开发适合受控环境农业的作物品种。该公司自 2020 年起一直与 Weizmann Institute of Science
              合作推进植物育种创新。收购完成后，Plantae Biosciences 被整合进 Infinite Acres，并以 Infinite Acres Israel
              身份运营，把公司的研发版图延伸到以色列遗传学设施。


              收购背后的战略逻辑反映了管理层判断：垂直农场盈利的下一道边界，不是已经掌握的环境控制，而是作物遗传学——在室内受控条件下设计出产量更高、营养结构更好、风味更优、货架期更长的植物；这些性状对以抗旱性和供应链耐受性育成的露地作物而言，要么无关，要么甚至不理想。CEO
              Mike Zelkind 表示：“既然我们已经学会控制植物环境，让它每天都过上‘完美的一天’，我们认为垂直农业的下一个大突破在植物遗传学。”


              除遗传学外，80 Acres 在 Arkansas 维护一个研发田间设施（作物试验和种植系统研究），并于 2024
              年在荷兰海牙开设田间实验室。荷兰田间实验室旨在让新种植技术、环境规程和与欧洲技术伙伴的硬件集成先完成试验，再进入商业规模农场。Infinite Acres 在 GreenTech Amsterdam 2024
              上亮相；该活动是欧洲领先的园艺技术会议之一，显示公司正积极参与全球 CEA 研究与供应商社群。
