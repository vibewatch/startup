      - number: '2.2'
        title: TAM、SAM 与证据约束下的市场测算
        blocks:
          - type: paragraph
            body: >
              分析机构对全球垂直农场行业的市场规模估算差异很大。Grand View Research（2026 年 1 月）把 2025 年全球垂直农场市场定为 $9.62 billion，并预计到 2033 年增长至
              $39.20 billion，CAGR 为 19.3%。Mordor Intelligence（2026 年 1 月）估计 2025 年为 $6.27 billion、2026 年为 $7.50
              billion，并预测到 2031 年达到 $18.40 billion，CAGR 为 19.66%。MarketsandMarkets（2024 年 7 月）估算 2024 年市场为 $5.6
              billion，到 2029 年达到 $13.7 billion，CAGR 为 19.7%。Allied Market Research 给出最激进估算——2022 年 $4.5 billion，到 2032
              年达到 $42.5 billion，CAGR 为 25.5%。估算分歧来自范围定义不同（有的纳入组件硬件销售，有的只纳入作物收入）、地理覆盖不同，以及自上而下与自下而上建模方法差异。按 Mordor
              口径，North America 约占 2025 年全球垂直农场收入的 41%，意味着以美国为权重的 SAM 约为 $2.5–4.0 billion。80 Acres Farms
              实际可服务可获取市场受分销地理、冷藏货架期、产品组合和零售客户集中度约束。关键在于，全球 VF 市场数字包含 LED 照明和气候硬件支出（这是组件，不是农产品收入），会相对 80 Acres
              这类农产品种植者可捕获收入夸大 TAM。更保守的 SAM 应从农产品收入侧估算，即 80 Acres 已建立分销的美国 Midwest、Southeast 和 East
              高端叶菜及特色农产品零售板块——今天大约是数亿美元量级，并会随公司扩张而增长。
