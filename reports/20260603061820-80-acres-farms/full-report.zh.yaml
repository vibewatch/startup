      - number: '2.5'
        title: 市场测算缺口、矛盾与反证
        blocks:
          - type: paragraph
            body: >
              垂直农场的分析师市场规模数据存在重大矛盾。Grand View Research（2026 年 1 月）把 2025 年市场估值为 $9.62 billion，而 Mordor Intelligence（2026
              年 1 月）对同一年度估计为 $6.27 billion；两份报告发布时间只差数周，同一日历年口径却相差 53%。Allied Market Research 将 2022 年基数放在 $4.5
              billion，而 Mordor 将 2025 年放在 $6.27 billion；但 AMR 的 2032 年预测为 $42.5 billion，明显高于 GVR 的 2033 年 $39.2
              billion，即便其时间跨度更短。这些分歧来自范围定义不一致——有的机构把组件硬件（LED、气候系统）计入市场收入，有的只统计农产品产出——也来自区域覆盖差异。行业经历了一串显著反向事件：AeroFarms
              曾估值 $1 billion、是微型蔬菜赛道领导者，2023 年 7 月申请 Chapter 11 破产保护，随后在新所有者手下以更窄范围重返市场；Bowery Farming 是大型风投支持运营商，2023
              年申请破产并被清算；德国室内农业公司 Infarm 曾扩张到 20 多个国家，2023 年进入破产程序，关闭零售模块后转向集中式 hub 模式。行业风险资本流入从 2022 年 $2.8 billion 降至
              2023 年 $680 million，限制了新设施开发。具体到 80 Acres，公司在 2026 年 5 月确认，将于 2026 年 7 月 21 日前关闭 Virginia Harrisonburg
              设施，把产能整合到 Atlanta 和 Indianapolis；这说明公司在做战略性设施精简，也说明并非所有生产场址都能持续盈利。这些数据点合在一起表明，相对于运营商可实现的农产品收入，分析师 TAM
              预测几乎肯定偏高；任何单一运营商的现实 SOM 都只是全球 VF 标题数字的一小部分。尽调应在接受 TAM 推导的市场渗透假设前，独立验证 80 Acres 的单位经济性、设施级利润率和分销密度。
            claimRefs:
