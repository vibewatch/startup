      - number: '8.4'
        title: 退出准备度、否决触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 的自然退出路径包括战略收购、财务投资人收购或成长股权续投，以及最终 IPO。战略收购方范围包括大型传统农产品公司（Taylor Farms、Fresh Del
              Monte、Dole）、寻求可持续溢价和零售货架存在感的食品巨头，或 Siemens 这类技术集成商（已是财务股东）。食品巨头按 $200M 预计收入给 1–2x 收入倍数收购，会把 80 Acres 估在
              $200–400M，低于 Series C 投资者若按独角兽标记入场的隐含成本。公司不太可能在至少连续两个经审计财年证明 EBITDA 盈利前 IPO；行业 SPAC 历史（AppHarvest、Revol
              Greens 尝试 de-SPAC）已让公开市场投资者保持谨慎。延续基金或二级交易可以按协商估值为早期 Virgo 或 General Atlantic 持仓提供流动性。


              概率最高的投资逻辑破坏情景，是 Harrisonburg 之后 12 个月内再次关闭一处主要设施，这将表明站点层面经济性并未在并购后改善，且 $200M
              收入预测被高估。第二个触发器是降估值轮或债务融资轮，条款显示投资者侧估值压缩到低于最近隐含标记。第三个触发器是管理层离职（Mike Zelkind 或 Tisha
              Livingston），鉴于关键人物集中度，这会显著增加融资准入和执行风险。


              做出买入判断前，不可妥协的尽调项包括：（1）经审计的 FY2024 和 FY2025 财务，含收入、EBITDA 和设施层面利润率；（2）股权结构表，含优先股堆叠、清算瀑布和反稀释条款；（3）Soli
              Organic 整合成本计划和重组费用规模；（4）Kentucky KEDFA 激励提款计划和截至 2026 年中的现金余额；（5）Arizona SPV（Eloy I10 & Tonto Road 80
              Acres LLC）的用途、资本承诺和设施经济性。
