      - number: '1.5'
        title: 反向事件与行业风险背景
        blocks:
          - type: paragraph
            body: >
              2026 年 5 月，80 Acres Farms 宣布关闭 Virginia Harrisonburg 设施——即前 Soli Organic / Shenandoah Growers 场址——关闭将于
              2026 年 7 月 21 日生效，约 80 个岗位流失。CEO Mike Zelkind 称，驱动因素是将运营战略性整合到 Atlanta 和 Indianapolis；公司已向州政府提交 WARN Act
              通知。此前，Soli Organic 在 2025 年 8 月合并公告前数日已在 Georgia 裁减 128 个岗位；这说明运营精简是合并的明确特征，而不是意外后果。


              行业层面的逆风放大了公司特有风险。根据 2025 AgFunder Global AgriFoodTech Investment Report，受控环境农业投资在 2024 年同比下降约
              53%，投资者把重点从扩张转向盈利。Bowery Farming（2024）、AeroFarms 破产，以及 Plenty 估值下滑，已经加剧市场怀疑。行业分析师尤其批评 80 Acres 的 $95
              million Kentucky 设施，认为它体现了高 CapEx
              风险，而叶菜等大宗农产品经济性本来就是低利润率。单位经济性问题——垂直农场能否在这种规模的基础设施上打平并产生回报——仍未解决，对任何投资判断都至关重要。
            claimRefs:
              - CO026
