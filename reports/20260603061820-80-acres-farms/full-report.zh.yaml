      - number: '4.3'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 财务论证的核心问题，是它能否维持足以支撑资本密集设施版图的毛利率。公司声称已经拥有“盈利的农场单位经济性”；这句话由联合创始人兼 Infinite Acres CEO Tisha
              Livingston 在 2025 年 3 月新闻稿中提出，并由公司持续获得机构资本的能力支撑。不过，这一说法没有独立验证，而垂直农场行业提供了严峻背景：AppHarvest 作为公开上市的垂直农场运营商，在
              2022 年仅 $14.6M 净销售额上报告 $42.4M 毛亏损（毛利率约 -290%），随后于 2023 年 7 月申请破产。


              Kentucky Boone County 设施需要最多 $95M 资本投资，面积 200,000 square feet，意味着设施成本约为每 square foot $475。作为参照，传统温室建设成本为每
              square foot $50–150；垂直农场成本更高，来自多层种植塔、LED 照明基础设施、气候控制和自动化系统。ProduceGrower 盈亏平衡分析显示，一个生产每袋 $3 生菜的 $100M
              设施，每年大约需要 20 million 单位产量，才足以收回年化 capex；这还没有计入销售、一般和行政费用。


              80 Acres Farms 在几个成本杠杆上做出差异化。公司声称所有农场 100% 使用可再生电力（相对依赖电网的同行降低能源成本溢价），并且每磅农产品用水比传统农业少 95%。Infinite Acres
              GroLoop 平台把硬件、软件和环境控制整合进整个网络，Siemens 数字孪生和 Signify LED 照明技术支持精密优化。机器人和自动化覆盖播种、移栽和收获，相比人工垂直农场降低单件劳动力成本。2025
              年 3 月，公司以未披露价格收购 Kalera 的三座农场（Kalera 破产前融资约 $250M），体现其轻资本扩张策略：以原始建设成本的一小部分收购困境垂直农场资产，并用 Infinite Acres
              技术改造。


              尽管运营信号偏乐观，行业整体数据在结构上不利。根据 2025 AgFunder 报告，垂直农场投资在 2024 年同比下降 53%；Bowery Farming 即便融资 $600M，仍在 2024
              年底停业；在高资本基础设施里生产低价农产品，若没有显著自动化和产量，规模化经济性仍然艰难。GrandView Research 估计 2025 年全球垂直农场市场价值为 $9.62B，并以 19.3% CAGR
              增长至 2033 年 $39.2B，但单个公司的经济性会与这种标题增长显著分化。
