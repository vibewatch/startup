        - 观察
        - 它是仍存活的室内农场运营商中最强的一家，但估值未披露、收入未经验证；不支持价格敏感型买入。
      - - 置信度
        - 中
        - 投资逻辑证据较充分（General Atlantic 背书、Soli 合并、GroLoop 平台），但财务透明度不足，无法支撑高确信度。
      - - 风险评级
        - 高
        - 全行业破产潮、没有审计财务、Harrisonburg 关闭暴露整合成本，Form D 2025B 小额融资模式提示短期现金需求。
      - - 估值立场
        - UNKNOWN
        - 各轮都没有披露投后估值；基于证据的 EV 区间为 $200M–$700M；独角兽（$1B+）需要未经验证的假设。
      - - 决策含义
        - 在考虑本金投资前，启动正式尽调，要求审计财务、股权结构表和优先股堆叠。
        - 缺少这五项数据，即便认可战略逻辑，也无法承销一笔价格敏感型买入。
    notes: 所有评估字段代表作者截至 2026-06-03 基于证据的判断；“未知”估值立场反映一手来源没有披露任何投后估值，并非对内在价值的负面判断。
  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 维度
      - 投资逻辑（看多论据）
      - 反向逻辑（什么会改变判断）
    rows:
      - - 技术护城河
        - >-
          GroLoop（Infinite Acres）把 Siemens 自动化、Signify LED、SICK 传感器、Priva 气候控制和 Ocado 物流整合进一套独特运营栈，同行尚未复刻。Plantae
          的遗传能力又加入自有作物设计。
        - GroLoop 只供内部使用；如果 Infinite Acres 无法对外授权，平台就仍是成本中心，而不是收入倍增器，可实现的 EV 倍数会被压缩。
      - - 规模和分销
        - Soli 合并后覆盖美国 17,000+ 个零售门店，其中包括美国前十大零售商的 70%。全国性香草和沙拉品牌，供应链一体化。Kroger 扩张计划覆盖 1,000 家门店。
        - 零售端溢价上限仍未解决；Bowery Farming 在相近分销规模下倒闭。Harrisonburg 关闭和 Georgia 裁员显示，并非所有站点都盈利。
      - - 投资方质量
        - >-
          General Atlantic（$65B+ AUM）参与了 2021 Series B 和 2024 融资。Siemens Financial Services 既是财务合作方也是战略合作方。Western &
          Southern Life Insurance（$A 评级保险公司）在 2024 年加入。
        - 投资方继续参与，并不等于新投资者按当前估值进入能获得正 IRR。已记录的 $313M+ 股权带来的优先权悬挂，会给普通股或后期投资者造成结构性稀释风险。
      - - 行业整合者
        - 以困境价格收购 Kalera 资产（Georgia、Texas、Colorado，破产前约融资 $250M）；与 Soli Organic 合并；收购 Plantae Biosciences 取得遗传能力。
        - 整合会加快收入，但也吸收遗留成本结构和劳动力负债；Soli 并购前在 Georgia 的裁员（128 名员工）已经暴露整合复杂度。
      - - 收入轨迹
        - 公司称截至 2024 年 CAGR 为 60%；合并后首年收入预计 $200M；年产量 15–20 million lbs。
        - 所有收入数字均由公司声称，没有独立审计；AppHarvest 证明，垂直农场收入预测在运营规模化后可能大幅落空。
      - - 单位经济性进展
        - 管理层称“农场单位经济性已盈利”（Tisha Livingston，2025 年 3 月）；可再生电力和 95% 节水带来结构性成本优势。
        - AppHarvest FY2022 在相近早期规模阶段录得 –290% 毛利率（$14.6M 收入，–$42.4M 毛亏损）；80 Acres 没有独立验证其单位经济性说法。
    notes: 每条投资逻辑论据都来自公司披露或独立报道的证据；每条反向逻辑论据都来自同行破产、SEC 文件或独立负面报道。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 收入估计
      - 隐含 EV（倍数）
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - >-
          Soli 合并整合带来 $250M+ 收入；单位利润率提升至 20%+ EBITDA；GroLoop 开始对外授权（2027）；General Atlantic 领投增长轮，估值 $1B+；Kentucky
          设施按计划扩张。
        - $250M
        - $750M–$1,000M（3.0–4.0x）
        - 授权收入未能启动；设施成本超支；溢价上限限制利润率扩张；行业资本继续收缩。
        - 低到中；需要多项成功同时发生，包括授权启动和利润率改善，而两者目前都没有证据。
      - - 基准
        - 整合后收入稳定在 $175–200M；Harrisonburg 关闭是孤立事件；另有两到三座设施投入运营；GroLoop 仍只供内部使用；下一轮隐含 EV 为 $400–600M。
        - $190M
        - $285M–$475M（1.5–2.5x）
        - 新增站点关闭；整合费用超出预测；高端消费者疲劳压缩零售销量；下一轮估值低于 Series C。
        - 中；与当前证据基础以及资本受限环境下可比私营 CEA 倍数一致。
      - - 悲观
        - 12 个月内第二座主要设施关闭；整合成本吞噬合并协同；某零售商减少货架空间；以困境条款完成过桥融资；收入降至 $120–140M 区间。
        - $130M
        - $104M–$156M（0.8–1.2x）
        - 若单位经济性没有改善，存在完全破产风险；若引入债务，可能出现 KKR 式债务困境（参见 Bowery 关闭前的 $150M KKR 贷款）。
        - 低到中；Bowery、AppHarvest、Plenty 的先例显示，垂直农业的悲观情景可以归零；80 Acres 有差异化，但并非免疫。
    notes: 收入估计通过将上述倍数应用于指示性情景收入数字得出；所有估计都是基于公开证据的模型推断，并非来自审计财务。概率信号是基于可得证据的定性判断，不是定量概率估计。
  - id: TV004
    title: 可比估值表
