  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms 竞争的是美国高端鲜食农产品市场，具体位于受控环境农业（CEA）子板块，重点是无农药叶菜、香草、番茄、黄瓜和特色作物。相关支出边界包括零售渠道鲜食农产品——主要是传统杂货店和天然 /
              高端杂货店——公司在这些渠道销售沙拉菜、微型蔬菜和草莓等产品。公司当前范围不包括大宗田间农产品、鲜切和加工蔬菜、冷冻农产品，以及面向机构 / SNAP 的大宗农产品。相邻市场包括有机农产品（2025 年美国
              $76.6 billion 板块，同比增长 6.8%）、餐饮服务 / 餐厅供应，以及 80 Acres 尚未大规模进入的直接面向消费者模式。室内种植生菜和叶菜的主要现状替代品，是 California 和
              Arizona 的田间种植农产品，以及来自 Mexico、Netherlands 和 Canada 的温室进口产品；这些替代品都受益于免费阳光和更低资本成本。CEA
              市场通常有两种口径：要么作为独立垂直农场收入池（2025 年全球约 $6–10 billion），要么作为更大的美国杂货农产品类别中高端农产品溢价（零售约 $100 billion）；评估 80 Acres
              可触达机会时，这两种视角不能互换，必须分开阅读。
