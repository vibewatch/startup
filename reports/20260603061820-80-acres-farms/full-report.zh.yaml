      - number: '6.3'
        title: 留存、耐久性与缺失指标
        blocks:
          - type: paragraph
            body: >-
              已审阅的公开来源没有披露 NRR、GRR、流失、合同期限、续约节奏或客户队列。这意味着耐久性只能靠代理指标推断，无法直接衡量。最有建设性的代理指标是 Kroger
              内部扩张：这段关系似乎从一家门店推进到数百家，再到计划中的千店规模，意味着某种程度的重复订货和买方信心。管理层和并购评论也用零售商语言包装供给——差异化产品、供应确定性、供应链韧性、货架期和更丰富的客户选择——说明产品卖点不只是新奇，也包括运营可靠性。并购后规模也可能有帮助，因为
              17,000
              个门店的合并覆盖和更广泛农场网络，应该会降低单点服务风险。即便如此，这些代理指标不能替代真实留存数据。公开材料没有说明零售品牌调整、年度审查、损耗降低、进场费、品类周转，或报告门店中究竟有多少持续复购、多少只是获得上架授权。
