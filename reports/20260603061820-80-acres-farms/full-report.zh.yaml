      - number: '1.4'
        title: 规模、里程碑与市场存在
        blocks:
          - type: paragraph
            body: >
              公司运营版图靠三件事扩张：新建农场、用技术改造收购来的设施，以及 2025 年 8 月与 Soli Organic 合并。Kentucky 农场于 2023 年 9 月启用，是最大的单体设施：位于 Boone
              County，占地 200,000-square-foot，投资 $95 million，面积约为公司此前最大农场的 3 倍，产能约为 4 倍，每年最多可生产 40 million 份农产品。Kentucky
              州激励（2022 年 1 月获 KEDFA 批准）支持了岗位创造。


              合并后，公司运营 7 座全国分布式垂直农场，年总产能为 15 to 20 million pounds 鲜食农产品，服务美国超过 17,000 个零售门店，员工约 1,400 人（2026 年 5 月关闭
              Harrisonburg 后修订为超过 1,200 人）。产品进入 Kroger、Whole Foods、Meijer、HEB、Walmart 以及数千家区域杂货商。


              收入没有精确公开披露。2025 年 2 月，公司报告过去三年复合年增长率为 60%。根据 2025 年 8 月合并新闻稿，合并实体预计首年收入接近 $200 million。合并前，仅 80 Acres
              就服务超过 1,500 家零售商，并报告自 2021 年以来收入 CAGR 为 60%。公司自 2019 年起就是 Kroger 供应商，从 Cincinnati 单店起步，扩大到 2023 年宣布的约
              1,000 个 Kroger 网点。
