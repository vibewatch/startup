      - number: '1.6'
        title: 证据要点
        blocks:
          - type: callout
            title: 运营者带队，具备少见的食品制造履历
            body: >-
              不同于多数由软件或投资专业人士带队的垂直农场公司，80 Acres Farms
              由运营过大规模制造设施的食品行业老兵掌舵。这种运营基因体现在公司的多作物广度、食品安全文化，以及从战略投资者（Siemens、Barclays）处融资的能力；这些投资者审视过团队执行记录。Soli Organic
              合并和 Kalera 收购显示，公司在有意做资本效率更高的整合，而不是押注投机性绿地扩张。
            calloutType: strength
            claimRefs:
              - CO007
              - CO006
              - CO009
              - CO016
              - CO017
          - type: callout
            title: 高 CapEx 模型面对结构性利润率压力
            body: >-
              80 Acres Farms 的 $95 million Kentucky 设施体现了垂直农场常见的集中资本风险：低利润率叶菜的经济性要求设施保持很高利用率，才能在可接受的回本周期内收回固定资产成本。行业层面
              CEA 融资在 2024 年下降 53%，多家融资充足的竞争对手已经失败。公司合并后的设施关闭和合并前裁员说明，不牺牲单位经济性地整合规模，仍是未解决的运营挑战。
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
              - CO028
              - CO039
              - CO026
          - type: callout
            title: 投入资本前，应优先尽调单位经济性
            body: >-
              关键未解决尽调事项包括每个 SKU 的毛利率、设施层面的现金贡献、股权结构表和优先股堆叠，以及合并后整合是否产生了足以支撑合并实体资本基础的成本协同。投资者推进前应要求审计收入、农场级 P&L
              和股权结构文件。60% 收入 CAGR 和全国零售触达在战略上重要，但私营公司不透明，使盈利质量验证必不可少。
