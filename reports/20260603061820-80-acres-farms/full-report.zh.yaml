      - number: '8.2'
        title: 融资背景、SEC 文件与估值证据
        blocks:
          - type: paragraph
            body: >
              80 Acres Urban Agriculture, Inc.（SEC CIK 0001925495）已向 SEC 提交三份 Form D 豁免发行通知。2022 年文件（adsh
              0001925495-22-000001）记录 Series B：首次销售日期 2021-06-17，29 名投资者认购 $170.8M。2025A 文件（adsh
              0001925495-25-000004）记录一项 $150M 发行，81 名投资者已认购 $114.3M，首次销售日期 2023-06-08——本质上是一轮跨 2023–2024 年的 Series
              C。2025B 文件（adsh 0001925495-25-000003）记录 72 名投资者认购 $28.4M，首次销售日期 2025-08-13，符合过桥或部分关账特征。三份文件的收入类别均列为
              “Decline to Disclose”，阻止外部独立验证收入。


              SEC 文件可确认的股权融资总额约为 $313.5M（170.8 + 114.3 + 28.4）。与公开引用的 $370M–$400M 总额之间的差距，来自 2022 年前 Virgo 领投的 Series A
              轮（2019 年 1 月约 $40M，以及 2020 年一笔分期），这些没有在 Form D 中单独记录。最近 Form D 活动（2025A 和 2025B 均于 2025-10-31 提交）确认，至少到
              2025 年中，80 Acres 仍是活跃融资方。另有 Eloy I10 & Tonto Road 80 Acres LLC（CIK 0002056260）于 2025 年 2 月为 Arizona 项目载体提交
              Form D，暗示企业层级之下也有项目融资或设施 SPV 活动。


              任何轮次均未披露投后估值。Pitchbook 将 80 Acres 列为已到 Series C 的私人公司，但没有确认估值标记。University of Cincinnati 报道称，截至 2025 年 1
              月累计融资超过 “$400M+”。多家媒体（AgFunderNews、ProduceGrower、Ohio Tech
              News）称公司“接近独角兽区间”，但都没有引用一手估值来源。分析师对独角兽状态的猜测不是估值锚；最多说明至少有一名投资者或二级市场参与者在非正式评论中给出 $1B+
              隐含估值。鉴于没有任何已披露的股权结构表、优先股堆叠或反稀释条款，$313.5M+ 已记录股权融资带来的优先权压力仍是未知但实质的普通股稀释风险。
