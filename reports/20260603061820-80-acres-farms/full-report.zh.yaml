  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接同行、既有企业与现状替代品
        blocks:
          - type: paragraph
            body: >-
              2023 至 2025 年，室内农业竞争格局经历了历史性整合。Bowery Farming 曾筹集超过 $700 million 风险资本、估值达到 $2.3
              billion，但在遭遇财务困境、作物疾病和消费者对高端价格需求疲弱后，于 2024 年 11 月彻底停业。AppHarvest 在 SPAC 上市不顺和后续股东诉讼之后，于 2023 年 7 月申请
              Chapter 11 破产保护。Plenty Unlimited 于 2025 年 3 月进入 Chapter 11，2025 年 5 月围绕由 Driscoll's
              合作关系支撑的高端草莓战略完成重组后退出。AeroFarms 也在 2023 年经历 Chapter 11，之后以只聚焦高端微型蔬菜的更窄业务重返市场。仍存活的温室竞争对手——Gotham
              Greens、BrightFarms、Little Leaf Farms 和 Revol
              Greens——使用受控环境农业，但没有纯室内农场的全垂直堆叠和人工照明，因此能源成本结构更好，但产品广度更窄、地理灵活性更低。现状且占主导的替代品仍是 Taylor Farms、Dole 和 Fresh
              Express 的传统田间种植农产品；它们估计掌握美国鲜食沙拉 95% 或以上销量，成本是室内农场在当前规模下无法匹配的。2025 年 8 月 80 Acres Farms 与 Soli Organic
              合并建立了新的规模门槛，把 7 座全国分布式垂直农场、Soli 的 17,000+ 零售门店网络和室内有机香草领导地位结合在一起。
