  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Second major facility closure
        - Any additional facility closure within 12 months of Harrisonburg (July 2026), affecting >50 employees.
        - >-
          Signals that unit economics are not improving post-merger and that the $200M revenue projection is at risk;
          may expose capital need beyond Form D 2025B.
        - >-
          Pause or reduce position; request updated facility-level P&L before further commitment; escalate to formal
          watch status.
      - - Down round or distressed debt raise
        - >-
          New equity or debt raise at a per-share price or implied EV below the 2023–2025 Series C mark, or introduction
          of KKR-type secured debt at distressed terms.
        - >-
          Reveals investor-side valuation compression and signals that prior marks were not sustainable; preference
          overhang risk rises sharply.
        - >-
          Reassess position; a confirmed down round below $400M implies bear scenario materialising; exit or restructure
          prior commitment.
      - - Co-founder departure
        - >-
          Mike Zelkind (CEO) or Tisha Livingston (Infinite Acres CEO) leaves the company without a clearly named and
          experienced successor.
        - >-
          Key-person concentration is a disclosed risk; co-founders control technology roadmap, capital access, and
          retail relationships; departure materially increases execution and fundraising risk.
        - >-
          Immediate diligence call; escalate risk rating to CRITICAL; do not commit new capital until successor is
          evaluated.
      - - Retail partner reduction
        - >-
          Kroger, Whole Foods, or any partner accounting for >15% of projected revenue announces reduction or
          termination of 80 Acres shelf placement.
        - >-
          Retail customer concentration is the primary go-to-market constraint; a major partner withdrawal would reduce
          revenue and signal consumer demand shortfall at the premium price point.
        - >-
          Investigate root cause; if pricing/margin-driven rather than quality-driven, update revenue model; consider
          recalibrating to base-to-bear scenario.
      - - Vertical farming sector regulatory adverse event
        - >-
          FDA FSMA enforcement action against an indoor farm for food safety failure; or USDA changes to organic
          certification that disadvantage indoor-grown produce.
        - >-
          Sector-wide reputational risk; could accelerate premium price sensitivity and retail buyer caution across all
          CEA operators.
        - >-
          Assess 80 Acres-specific exposure; if fault is industry-wide, maintain position; if any 80 Acres facility
          implicated, escalate immediately.
      - - Liquidity crisis or bridge loan
        - >-
          Public WARN Act filings, lease defaults, or vendor payment defaults at any facility; or Form D filing for
          <$10M raise at irregular timing.
        - >-
          Signals that company cash generation or capital market access has deteriorated below operational needs; high
          probability of subsequent down round or sale.
        - Treat as blocking; do not commit new capital; engage legal counsel on creditor waterfall analysis.
    notes: >-
      Trigger thresholds are indicative analyst estimates; actual monitoring thresholds should be calibrated by a lead
      investor with access to audited cash flow data.
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financial statements
        - >-
          FY2024 and FY2025 audited P&L, balance sheet, and cash flow statement for 80 Acres Farms and the combined
          post-Soli entity.
        - >-
          All revenue and margin claims are company-asserted; AppHarvest's –290% gross margin illustrates the degree to
          which management projections can diverge from reality; cannot price a transaction without audited data.
        - >-
          Request from management in formal data room; if unavailable, require SAS 70 / SOC 2 report and trailing
          12-month management accounts as a minimum.
      - - Cap table and preference stack
        - >-
          Complete cap table showing common vs. preferred shares, liquidation preferences, anti-dilution provisions, and
          any participating preferred terms across all rounds.
        - >-
          $313.5M+ of documented preferred equity creates structural senior claims on any exit proceeds; preference
          overhang could zero out common equity in a bear case exit below $500M.
        - >-
          Request directly from 80 Acres CFO / legal counsel; review all three Form D filings for investor list as a
          cross-check (81 investors in 2025A; 29 in 2022).
      - - Facility-level unit economics
        - >-
          Gross margin, energy cost per lb of produce, labour cost per unit, and depreciation per unit for the Hamilton
          OH, Boone County KY, and at least one Kalera-acquired facility.
        - >-
          Management claims "profitable farm unit economics" without independent support; the Harrisonburg closure and
          Georgia layoffs suggest not all sites are economic; the $475/sq ft capex for Boone County implies a high
          break-even throughput.
        - >-
          Request facility-level monthly management accounts; benchmark against USDA CEA census data and ProduceGrower
          industry break-even analysis.
      - - Post-merger integration cost schedule
        - >-
          Formal integration plan with one-time restructuring charges (Harrisonburg closure, Georgia layoffs), severance
          liabilities, and technology migration costs for Soli.
        - >-
          The $200M combined revenue projection omits integration costs; Harrisonburg (80 WARN Act employees) and Soli's
          pre-merger Georgia layoffs (128 workers) represent minimum $5–15M in restructuring charges not reflected in
          any public figure.
        - Request WARN Act notices and full severance liability schedule; review post-merger board minutes if available.
      - - Arizona SPV purpose and capital commitment
        - >-
          Purpose and capital structure of Eloy I10 & Tonto Road 80 Acres LLC (CIK 0002056260, Form D February 2025,
          $28.4M raised, Phoenix AZ).
        - >-
          An Arizona project vehicle at the corporate level indicates either a new farm expansion or a project finance
          structure not reflected in corporate-level Form D filings; material for total capital commitment analysis.
        - >-
          Request from management; review Arizona Form D filing (adsh 0002056260-25-000001) on EDGAR for offering size
          and investor list.
      - - Kentucky incentive draw schedule
        - >-
          KEDFA tax credit and KEIA grant draw schedule for the Boone County facility, including conditions, milestones,
          and any clawback provisions.
        - >-
          State incentives reduce realized capex burden but are performance-based; if employment or production
          milestones are missed (e.g. due to post-merger restructuring), incentive clawback would increase effective
          capex.
        - >-
          Request from management; file a KY Open Records Act request to KEDFA for the incentive agreement terms and any
          amendment notices.
    notes: >-
      Diligence items are prioritized in order of blocking severity; items 1 (audited financials) and 2 (cap table) are
      pre-condition to any principal investment decision regardless of conviction level on the strategic thesis. Items
      3–6 are required for full underwriting but may be addressed in parallel with initial financial review.
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      80 Acres Farms' milestone record runs from a 2015 Cincinnati startup through a 2021 growth equity inflection, a
      2023 Kentucky capacity leap, and the 2025 Soli Organic merger—with a 2026 facility closure signaling post-merger
      integration pressure.
    data:
      items:
        - date: '2015'
          label: Founded
          detail: >-
            Mike Zelkind and Tisha Livingston co-found 80 Acres Farms in Cincinnati, OH; focus on full automation and
            controlled-environment produce.
          tone: positive
        - date: 2018-09
          label: Hamilton groundbreaking
          detail: >-
            Announces construction of first fully automated indoor farm in the U.S., in Hamilton, Ohio; signals
            next-generation proof of concept.
          tone: positive
        - date: 2019-01
          label: Series A – Virgo
          detail: >-
            Virgo Investment Group leads >$40M Series A, funding Hamilton facility completion and early-stage automation
            buildout.
          tone: positive
        - date: 2021-08
          label: Series B – $160M (General Atlantic)
          detail: >-
            General Atlantic leads $160M Series B; 450%+ revenue growth reported; 8 farms, 600+ retail/foodservice
            locations; Shaw Joseph joins board.
          tone: positive
        - date: 2022-01
          label: Kentucky facility announced
          detail: Boone County facility announced with KEDFA incentives; planned as company's largest farm at 200,000 sq ft.
          tone: positive
        - date: 2023-09
          label: Kentucky farm opens
          detail: >-
            $95M farm opens in Florence/Boone County KY; 3× larger than prior largest farm; 40M servings/year capacity;
            125 jobs.
          tone: positive
        - date: 2025-02
          label: $115M raised + Plantae acquired
          detail: >-
            2024 capital raises totaling $115M announced; Plantae Biosciences (Israel) acquired, adding accelerated
            plant-breeding to Infinite Acres.
          tone: positive
        - date: 2025-03
          label: Kalera farms acquired
          detail: >-
            Three former Kalera vertical farms (GA, TX, CO) plus IP acquired at distressed valuations; extends national
            footprint capital-efficiently.
          tone: positive
        - date: 2025-08
