      - number: '7.3'
        title: Operational and partner/dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the core question is whether 80 Acres is genuinely harvesting scale economies or still
              cleaning up the cost of prior overbuild. Management frames the combined network as regionally redundant,
              capital-efficient, and able to absorb current demand; the Harrisonburg shutdown shows redundancy can also
              mean spare or mislocated capacity that must be rationalized. The Kalera acquisition raises the same issue
              from another angle: retrofitting distressed assets can be cheaper than building greenfield farms, but only
              if retrofit timelines, yields, and service levels are predictable. The partner map deepens that exposure.
              Kroger remains the clearest large customer proof and may still be the dominant volume counterparty, yet
              public sources do not disclose revenue concentration or minimum commitments. The technology stack is
              similarly partner-dependent: Siemens, Signify, SICK, and other vendors are not peripheral—they are
              embedded in automation, power, controls, and digital-twin optimization. That structure can be a moat if
              partners stay aligned, but it can also create a failure chain in which equipment, software, or
              energy-management underperformance shows up first as yield variance, then service failures, then customer
              attrition.
