      - number: '1.5'
        title: Adverse Events and Industry Risk Context
        blocks:
          - type: paragraph
            body: >
              In May 2026, 80 Acres Farms announced the closure of its Harrisonburg, Virginia facility—the former Soli
              Organic/Shenandoah Growers site—effective July 21, 2026, resulting in approximately 80 job losses. CEO
              Mike Zelkind cited strategic consolidation of operations toward Atlanta and Indianapolis as the driver; a
              WARN Act notification was filed with the state. The closure follows Soli Organic's pre-merger cut of 128
              jobs in Georgia just days before the August 2025 merger announcement, signaling that operational
              rationalization was an explicit feature, not an unexpected consequence, of the combination.


              Industry-level headwinds compound company-specific risks. Controlled environment agriculture investment
              fell by approximately 53% year over year in 2024, according to the 2025 AgFunder Global AgriFoodTech
              Investment Report, as investors shifted focus from expansion to profitability. High-profile bankruptcies
              of Bowery Farming (2024), Aerofarms, and Plenty's valuation declines have increased market skepticism.
              Industry analysts have specifically criticized 80 Acres' $95 million Kentucky facility as an example of
              high-CapEx risk relative to the low-margin economics of commodity produce like leafy greens. The
              unit-economics question—whether vertical farming can break even and generate returns on infrastructure of
              this scale—remains open and material to any investment judgment.
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO039
              - CO040
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Operator-Led Team with Rare Food-Manufacturing Pedigree
            body: >-
              Unlike most vertical farming companies led by software or investment professionals, 80 Acres Farms is led
              by food-industry veterans who have operated large-scale manufacturing facilities. This operational DNA is
              reflected in the company's multi-crop breadth, food-safety culture, and ability to raise capital from
              strategic investors (Siemens, Barclays) that vetted the team's execution record. The Soli Organic merger
              and Kalera acquisition demonstrate deliberate, capital-efficient consolidation rather than speculative
              greenfield expansion.
            calloutType: strength
            claimRefs:
              - CO007
              - CO006
              - CO009
              - CO016
              - CO017
          - type: callout
            title: High CapEx Model Faces Structural Margin Pressure
            body: >-
              80 Acres Farms' $95 million Kentucky facility represents the concentrated capital-risk profile common to
              vertical farming: the economics of low-margin leafy greens require very high utilization rates to recover
              fixed-asset costs within acceptable payback horizons. Industry-level CEA funding dropped 53% in 2024, and
              multiple well-funded competitors have failed. The company's post-merger facility closures and pre-merger
              job cuts signal that integrating scale without degrading unit economics is an unresolved operational
              challenge.
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
              - CO028
              - CO039
              - CO026
          - type: callout
            title: Prioritize Unit-Economics Diligence Before Capital Commitment
            body: >-
              Key unresolved diligence items include gross margin per SKU, facility-level cash contribution, the
              cap-table and preference stack, and whether post-merger integration is generating the cost synergies
              needed to justify the combined entity's capital base. Investors should request audited revenue, farm-level
              P&L, and cap-table documentation before advancing. The 60% revenue CAGR and national retail reach are
              strategically significant, but private-company opacity makes quality-of-earnings verification essential.
            calloutType: recommendation
            claimRefs:
              - CO022
              - CO029
              - CO037
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms competes in the U.S. premium fresh produce market, specifically within the
              controlled-environment agriculture (CEA) sub-segment focused on pesticide-free leafy greens, herbs,
              tomatoes, cucumbers, and specialty crops. The relevant spend boundary includes retail-channel fresh
              produce—primarily conventional and natural/gourmet grocery stores—where the company sells products such as
              salad greens, microgreens, and strawberries. Excluded from the company's current scope are commodity
              field-grown produce, fresh-cut and processed vegetables, frozen produce, and institutional/SNAP-oriented
              bulk produce. Adjacent markets include organic produce (a $76.6 billion U.S. segment in 2025 growing at
              6.8% year-over-year), food service/restaurant supply, and direct-to-consumer models that 80 Acres has not
              yet entered at scale. The primary status-quo substitutes for indoor-grown lettuce and greens are
              field-grown California and Arizona produce and greenhouse-grown imports from Mexico, the Netherlands, and
              Canada, all of which benefit from access to free sunlight and lower capital costs. The CEA market itself
              is typically sized either as a standalone vertical-farming revenue pool (~$6–10 billion globally in 2025)
              or as a premium produce premium within the much larger U.S. grocery produce category (~$100 billion at
              retail); these two lenses are not interchangeable and must be read separately when assessing 80 Acres'
              addressable opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
