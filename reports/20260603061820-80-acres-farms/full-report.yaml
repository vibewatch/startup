      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >
              Market-size estimates for the global vertical farming industry range widely across analyst firms. Grand
              View Research (January 2026) pegged the global vertical farming market at $9.62 billion in 2025,
              projecting growth to $39.20 billion by 2033 at a 19.3% CAGR. Mordor Intelligence (January 2026) estimated
              $6.27 billion in 2025 and $7.50 billion in 2026, forecasting $18.40 billion by 2031 at a 19.66% CAGR.
              MarketsandMarkets (July 2024) placed the market at $5.6 billion in 2024 and $13.7 billion by 2029, a 19.7%
              CAGR. Allied Market Research offered the most aggressive estimate—$4.5 billion in 2022 reaching $42.5
              billion by 2032 at a 25.5% CAGR. The divergence among estimates reflects differing scope definitions (some
              include component hardware sales, others include only crop revenue), varying geographic coverage, and
              methodological differences in top-down versus bottom-up modeling. North America represents approximately
              41% of global vertical farming revenue in 2025 per Mordor, implying a U.S.-weighted SAM of roughly
              $2.5–4.0 billion. 80 Acres Farms' practical serviceable obtainable market is constrained by distribution
              geography, refrigerated shelf-life, product mix, and retail customer concentration. Critically, the global
              VF market numbers include LED lighting and climate hardware spend (which is component, not produce
              revenue), which inflates TAM relative to what produce growers like 80 Acres can capture. A more
              conservative SAM from the produce revenue side is estimated as the premium-leafy-greens and
              specialty-produce retail segment in the U.S. Midwest, Southeast, and East where 80 Acres has established
              distribution—roughly in the hundreds of millions of dollars today, growing as the company expands.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
