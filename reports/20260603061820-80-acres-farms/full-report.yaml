              carry large electricity loads for LED lighting, HVAC, and automation that field growers do not. 80 Acres
              Farms' claim of 100% renewable electricity use addresses sustainability optics but does not eliminate the
              absolute energy cost burden. The MarketsandMarkets projection of the global vertical farming market
              growing from approximately $5.6 billion in 2022 to $23.5 billion by 2030 (~19.5% CAGR) suggests category
              tailwinds, but those same tailwinds previously attracted the capital that flowed into now-failed ventures.
              80 Acres Farms' competitive moat is most durable where the GroLoop platform, industrial partner ecosystem,
              Plantae genetics capability, and large-format farm operations create replication barriers that a
              greenhouse operator cannot easily match. The retail relationships—particularly the Kroger distribution
              network and the post-merger Soli Organic footprint—represent a second moat layer that compounds with
              scale. However, the July 2025 closure of its Harrisonburg, Virginia facility is a reminder that site-level
              economics can fail even for the strongest operator in the category, and that the premium pricing ceiling
