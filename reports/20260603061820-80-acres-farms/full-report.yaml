      - number: '6.3'
        title: Retention, durability, and missing metrics
        blocks:
          - type: paragraph
            body: >-
              No public source reviewed discloses NRR, GRR, churn, contract length, renewal cadence, or customer
              cohorts. That means durability has to be inferred from proxies rather than measured directly. The most
              constructive proxy is expansion within Kroger: the relationship appears to have moved from one store to
              hundreds and then to a planned thousand-store scale, which implies some degree of repeat ordering and
              buyer confidence. Management and merger commentary also frame the offer in retailer
              language—differentiated products, surety of supply, supply-chain resilience, shelf life, and enhanced
              customer choice—suggesting the product is sold on operational reliability rather than novelty alone.
              Post-merger scale may help too, because a 17,000-door combined footprint and a broader farm network should
              reduce single-site service risk. Still, these proxies are not substitutes for actual retention data.
              Public materials say nothing about banner resets, annual reviews, shrink reduction, slotting fees,
              category velocity, or what share of reported doors reorder consistently versus being merely authorized.
