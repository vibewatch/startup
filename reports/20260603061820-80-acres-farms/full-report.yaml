      - number: '8.2'
        title: Financing Context, SEC Filings, and Valuation Evidence
        blocks:
          - type: paragraph
            body: >
              80 Acres Urban Agriculture, Inc. (SEC CIK 0001925495) has filed three Form D exempt offering notices with
              the SEC. The 2022 filing (adsh 0001925495-22-000001) records the Series B: first sale date 2021-06-17,
              $170.8M raised from 29 investors. The 2025A filing (adsh 0001925495-25-000004) records a $150M offering
              with $114.3M sold to 81 investors, first sale dated 2023-06-08 — effectively a Series C spread over
              2023–2024. The 2025B filing (adsh 0001925495-25-000003) records $28.4M from 72 investors, first sale dated
              2025-08-13, consistent with a bridge or partial close. All three filings list revenue category as "Decline
              to Disclose," preventing independent revenue verification.


              Total SEC-documented equity: approximately $313.5M (170.8 + 114.3 + 28.4). The gap to the $370M–$400M
              aggregate figure cited publicly reflects pre-2022 Virgo-led Series A rounds (January 2019 ~$40M, and a
              2020 tranche), which are not separately documented in Form D. The most recent Form D activity (2025A and
              2025B both filed 2025-10-31) confirms 80 Acres remained an active capital raiser through at least
              mid-2025. An additional Eloy I10 & Tonto Road 80 Acres LLC (CIK 0002056260) filed a Form D in February
              2025 for an Arizona project vehicle, suggesting project finance or facility SPV activity is also occurring
              below the corporate level.


              No post-money valuation has been disclosed for any round. Pitchbook lists 80 Acres as a private company
              through Series C without a confirmed valuation mark. University of Cincinnati's reporting referenced
              "$400M+" in total capital raised as of January 2025. Multiple media sources (AgFunderNews, ProduceGrower,
              Ohio Tech News) characterized the company as "approaching unicorn territory" but none cited a
              primary-source valuation. Analyst speculation of unicorn status is not a valuation anchor; at best it
              suggests that at least one investor or secondary market has ascribed a $1B+ implied valuation in informal
              commentary. Given the absence of any disclosed cap-table reference, preference stack, or anti-dilution
              terms, preference overhang on the $313.5M+ of documented equity is an unknown but material dilution risk
              for common equity holders.
