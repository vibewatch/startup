      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              Mike Zelkind (CEO) and Tisha Livingston (CEO of Infinite Acres) are co-founders who have led the company
              from inception through multiple funding rounds and the transformative 2025 merger. Zelkind previously ran
              large-scale food manufacturing operations—including experience at firms such as Del Monte—which
              distinguishes 80 Acres from competitors led primarily by software or technology executives. Livingston
              holds a University of Cincinnati engineering background, has managed the Infinite Acres technology stack
              since its inception, and retains operational leadership over the GroLoop platform, all hardware, software,
              and control systems across the farm network.


              Governance has broadened meaningfully in recent years. Shaw Joseph, Managing Director of General Atlantic,
              joined the 80 Acres Farms board of directors as part of the August 2021 Series B deal. Walter Robb, former
              co-CEO of Whole Foods Market (1983–2017) and co-chairman of Soli Organic before the merger, joined the
              board of the combined company in August 2025, bringing retail-credibility and grocer-relationship depth
              that few independent directors could replicate.


              Key-person concentration remains a material diligence concern. Strategy, capital access, technology
              execution, and retail-relationship management are still closely concentrated in Zelkind and Livingston.
              Noah Zelkind, VP of Business Intelligence and Strategic Finance, is a family member of Mike Zelkind, which
              introduces a secondary governance concentration risk. The board additions in 2021 and 2025 provide some
              counterweight, but any loss of either co-founder would represent a high-severity disruption to current
              strategic direction and investor confidence. Succession plans are not publicly described.
            claimRefs:
