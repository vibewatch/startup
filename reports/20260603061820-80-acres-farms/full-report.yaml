      - number: '8.3'
        title: Comparable Valuation Set and Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              No pure-play public vertical farm company survived in a comparable operating state as of June 2026:
              AppHarvest (SPAC-listed 2020) is bankrupt; Bowery shut down entirely. The closest tradeable comps are
              conventional greenhouse and field-produce operators (Fresh Del Monte, Dole), which trade at 0.2–0.5x
              revenue and are structurally incomparable due to their much lower capital intensity and energy costs. The
              most instructive private-market comp is AppHarvest's SPAC-implied valuation trajectory: listed at a $1B+
              implied enterprise value in 2020, its non-affiliate market cap at June 2022 was only $259.7M (per its
              10-K) and it filed for bankruptcy one year later with FY2022 net sales of $14.6M and a gross loss of
              $42.4M. This illustrates how quickly vertical farming valuations can deteriorate when unit economics fail
              to improve with scale.


              For 80 Acres, three scenario buckets emerge based on what the $200M projected revenue materializes to and
              what multiple can be sustained. In a bull case, the Soli merger integration drives revenue to $250M with
              improving unit margins (management claims 60% CAGR sustained), and a 3.0–4.0x revenue multiple reflecting
              the technology platform moat and national distribution yields an enterprise value of $750M–$1B. In a base
              case, revenue achieves $175–200M but Harrisonburg-type closures and integration costs depress EBITDA
              margins, warranting a 1.5–2.5x multiple and a $263M–$500M enterprise value. In a bear case, post-merger
              restructuring proves more expensive than disclosed, a facility requires closure, a key customer reduces
              purchase orders, or a down-round occurs; revenue of $120–140M with a 0.8–1.2x multiple implies an
              enterprise value of $96M–$168M. The AppHarvest comp shows the bear case can reach zero if fundamental unit
              economics do not improve.


              The organic produce analogy is directionally useful: Driscoll's (private) and Taylor Farms (private) each
              generate multi-billion-dollar revenues but would trade at commodity food multiples (0.5–1.5x). Premium
              food tech companies with recurring revenue models (SaaS, licensing) attract 3–8x revenue, but 80 Acres
              does not yet have a recurring technology revenue stream; GroLoop is internal-only as of June 2026. A 2–3x
              multiple on $200M projected revenue ($400–$600M enterprise value) represents the best-evidenced base
              range, subject to the material uncertainty of unaudited revenue, unverified margins, and unknown
              preference overhang.
            claimRefs:
              - CV012
              - CV013
