  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Market Positioning
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms' consumer product portfolio consists of pesticide-free, indoor-grown produce sold primarily
              through major grocery chains in the eastern and midwestern United States. Core SKUs include ready-to-eat
              salad kits, salad blends (spring mix, arugula, baby spinach, and specialty mixes), fresh herbs (basil,
              dill, cilantro, mint), microgreens, cherry and grape tomatoes, and premium salad dressings (acquired under
              the Mother Raw brand in March 2024). The company also grows cucumbers and is piloting additional crop
              varieties optimized for indoor conditions via its Plantae Biosciences R&D pipeline.


              Products are positioned on three attributes: freshness (short supply-chain distances from farm to shelf),
              safety (pesticide-free; no chemical inputs), and consistency (AI-controlled environments eliminate weather
              and seasonal variation). The company does not hold USDA Organic certification, which distinguishes it from
              field-grown organic competitors and from Soli Organic, which it merged with in August 2025. Post-merger,
              the combined entity markets both 80 Acres branded pesticide-free indoor produce and Soli Organic USDA
              Certified Organic herbs and greens.


              Retail distribution as of late 2025 extended to more than 18,000 U.S. retail storefronts following the
              Soli Organic merger, with key customers including Kroger (partner since 2019; now in thousands of stores
              across the Midwest and Southeast), Whole Foods Market, Meijer, Sysco, and US Foods. The Kalera farm
              acquisitions in March 2025 strengthened relationships with retailers and food distributors in Georgia,
              Texas, and Colorado markets that were previously underserved. The company serves the fresh produce segment
              of the grocery market—a category that drives high trip frequency and supports premium pricing for
              differentiated, locally grown, pesticide-free offerings.
