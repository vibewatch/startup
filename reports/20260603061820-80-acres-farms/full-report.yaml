            title: 'Top risk: financing plus integration, not regulation alone'
            body: >-
              The most dangerous scenario is a modest bridge round or another site rationalization before the market
              sees audited post-merger utilization. That would imply the scale story still depends on external patience
              rather than self-funding operations.
