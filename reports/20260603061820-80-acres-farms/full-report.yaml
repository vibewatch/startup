      - number: '2.5'
        title: Sizing Gaps, Contradictions, and Disconfirming Evidence
        blocks:
          - type: paragraph
            body: >
              Material contradictions exist in the analyst market-size data for vertical farming. Grand View Research
              (Jan 2026) valued the market at $9.62 billion in 2025 while Mordor Intelligence (Jan 2026) estimated $6.27
              billion for the same year—a 53% spread for the same calendar year published within weeks of each other.
              Allied Market Research placed the 2022 base at $4.5 billion while Mordor placed 2025 at $6.27 billion, but
              AMR's 2032 forecast of $42.5 billion far exceeds GVR's 2033 forecast of $39.2 billion despite a shorter
              time horizon. These divergences result from inconsistent scope definitions—some firms count component
              hardware (LEDs, climate systems) as market revenue, while others count only produce output—and from
              different regional coverages. The sector has experienced a significant adverse event cluster: AeroFarms,
              once valued at $1 billion and a sector leader in microgreens, filed for Chapter 11 bankruptcy in July 2023
              and emerged under new ownership with a narrowed scope; Bowery Farming, a major venture-backed operator,
              filed for bankruptcy and was liquidated in 2023; Infarm, a German indoor farming company that expanded to
              over 20 countries, went through insolvency in 2023 and pivoted to a centralized hub model after shuttering
              retail modules. Venture capital inflows to the sector fell from $2.8 billion in 2022 to $680 million in
              2023, constraining new facility development. Within 80 Acres specifically, the company confirmed in May
              2026 that it will close its Harrisonburg, Virginia facility by July 21, 2026, consolidating production to
              Atlanta and Indianapolis; this signals strategic facility rationalization but also that not all production
              sites are sustainably profitable. These data points collectively suggest that analyst TAM forecasts are
              almost certainly overstated relative to achievable produce revenue for operators, and that the realistic
              SOM for any single operator is a small fraction of the global VF headline numbers. Diligence should
              independently verify 80 Acres' unit economics, facility-level margins, and distribution density before
              accepting TAM-derived market penetration assumptions.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Analyst TAM Figures Likely Overstate Produce Revenue by 30–50%
            body: >
              The global vertical farming TAM reported by GVR ($9.62B, 2025) and Mordor ($6.27B, 2025) diverge by 53%
              for the same year. Both likely include LED hardware, climate system, and software spend, which is capital
              expenditure for farm operators—not produce revenue they can capture. Investors should apply a downward
              adjustment of at least 30% to isolate the produce-revenue addressable market before using these figures as
              valuation anchors.
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
          - type: callout
            title: Sector Bankruptcy Wave Constrains Investor Appetite Through at Least 2026
            body: >
              AeroFarms (Ch. 11, 2023), Bowery Farming (liquidated 2023), Infarm (insolvency 2023), and AppHarvest
              (bankruptcy 2023) represent the four highest-profile vertical farming failures in a 12-month window.
              Venture funding fell from $2.8B in 2022 to $680M in 2023. While 80 Acres raised $115M in February 2025,
              the sector's cost of capital remains elevated and growth assumptions require demonstrably lower unit
              economics than failed peers.
            calloutType: risk
            claimRefs:
              - CM031
