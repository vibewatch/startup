        title: Moat durability, industry failures, and structural competitive risk
        blocks:
          - type: paragraph
            body: >-
              The indoor farming industry's track record of large-scale failures—Bowery Farming ($700M+ raised,
              Fidelity's 99% writedown), AppHarvest ($475M raised, federal lawsuits, OSHA complaints), Plenty ($800M+
              raised, Chapter 11), and AeroFarms ($238M raised, Chapter 11)—establishes energy cost, capital intensity,
