            body: >-
              The expansion loop is intuitive: prove demand in one banner, add nearby farms to improve service radius,
              widen the SKU set, and then use the larger network to win new banners or foodservice nodes. The Soli
              Organic merger accelerates that loop by contributing longstanding herb relationships and a far broader
              national footprint, while the Kalera asset acquisition adds local farms that can support distributed
              replenishment. But the same structure creates concentration and integration questions. Public materials do
              not disclose top-customer revenue share, so investors cannot tell whether Kroger remains a dominant
              account or whether the 17,000-door network is broadly diversified across banners. The May 2026
