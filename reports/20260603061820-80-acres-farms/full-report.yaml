  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked overview
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk is not a single lawsuit or recall; it is the combination of capital intensity,
              integration volatility, and still-unproven post-merger economics. 80 Acres is asking investors to believe
              that the Soli merger, Kalera retrofit program, and prior technology investments have pushed the company
              into a more resilient phase, yet the public record still shows recent layoffs, a July 2026 facility
              closure, undisclosed revenue in current SEC filings, and continued dependence on partner capital and
              partner channels. The closure of Harrisonburg so soon after the Soli combination is especially important
              because it is the first hard disconfirming operating signal after management began promoting a
              17,000-door, nearly $200 million merged platform. Sector precedent makes that risk hard to dismiss:
              AppHarvest, AeroFarms, and Plenty each reached scale, raised substantial capital, and still ended up in
              Chapter 11 or emergency restructuring once off-take, facility concentration, or unit economics cracked.
              That does not prove 80 Acres will follow the same path, but it does mean investors should underwrite the
              business as a capital-disciplined produce operator first and only secondarily as a technology platform
              story.
