      - number: '7.5'
        title: Mitigations, triggers, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Management does have plausible mitigations: the business has blue-chip investors, a larger retail
              footprint after Soli, an ability to reuse distressed assets instead of always building new farms, and a
              technology stack with credible automation partners. The problem is that none of those mitigations is
              self-proving. Each must convert into monitorable evidence. Investors should expect three near-term proof
              points: first, that no additional material closures or WARN notices emerge while the combined network is
              supposedly scaling; second, that the next financing event is sized and priced like deliberate growth
              capital rather than bridge liquidity; and third, that 80 Acres can name credible customer diversification
              and compliance controls beyond Kroger rollout headlines and a legacy privacy policy. If any of those tests
              fail, the investment thesis should be revised quickly. A thesis-break does not require bankruptcy or
              recall; another closure, a thin insider-heavy bridge round, a retailer de-listing, or an FDA/USDA
              compliance event would each be enough to move the risk rating materially higher because they would
              undermine the exact claims—redundancy, scale, supply-chain resilience, and profitable unit economics—that
              support the current story.
