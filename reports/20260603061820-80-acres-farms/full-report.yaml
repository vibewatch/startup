  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and status-quo alternatives'
        blocks:
          - type: paragraph
            body: >-
              The indoor farming competitive landscape underwent a historic consolidation between 2023 and 2025. Bowery
              Farming, which raised more than $700 million in venture capital and reached a $2.3 billion valuation, shut
              down entirely in November 2024 after encountering financial distress, crop disease, and weak consumer
              demand at premium prices. AppHarvest filed for Chapter 11 bankruptcy in July 2023 following a troubled
              SPAC debut and subsequent shareholder lawsuits. Plenty Unlimited entered Chapter 11 in March 2025 and
              emerged in May 2025 after restructuring around a premium strawberry strategy anchored by a Driscoll's
              partnership. AeroFarms, which also went through Chapter 11 in 2023, returned to market with a narrowed
              focus exclusively on premium microgreens. The surviving greenhouse competitors—Gotham Greens, BrightFarms,
              Little Leaf Farms, and Revol Greens—use controlled-environment agriculture without the full vertical
              stacking and artificial lighting of pure indoor farms, giving them a better energy cost structure but
              narrower product breadth and less geographic flexibility. The status-quo and dominant substitute remains
              conventional field-grown produce from Taylor Farms, Dole, and Fresh Express, which commands an estimated
              95% or more of U.S. fresh salad volume at costs that indoor farms cannot match at current scale. The
              August 2025 merger between 80 Acres Farms and Soli Organic established a new scale threshold, combining
              seven nationally distributed vertical farms with Soli's 17,000+ retail door network and indoor organic
              herb leadership.
