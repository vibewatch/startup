      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The strongest growth driver for indoor farming is the secular improvement in LED efficacy: horticultural
              LED efficacy rose from approximately 2.5 micromoles per joule in 2015 to 3.8 micromoles per joule by 2025,
              reducing electricity required per kilogram of lettuce by approximately 35% per Mordor Intelligence.
              Capital costs for LEDs and software licenses declined sufficiently to reduce the payback period for a
              greenfield vertical farming facility from eight years in 2020 to approximately five years in 2026.
              Consumer demand for pesticide-free, locally grown produce is the second key driver: consumer surveys in
              North America show willingness to pay 15% or more for such products. The U.S. organic market reached $76.6
              billion in 2025, growing 6.8% versus prior year and outpacing the overall food market for the third
              consecutive year, per the Organic Trade Association—a signal of sustained consumer preference shift. The
              USDA Risk Management Agency's expansion of controlled-environment crop insurance to 48 counties with 85%
              crop-value coverage reduces financing risk for mid-size growers. Climate resilience is a demand-pull
              driver: droughts cut California lettuce yields by 18% in 2024 and lifted wholesale prices by 22%,
              according to Mordor Intelligence, making indoor farms more price-competitive during field supply shocks.
              On the constraint side, electricity cost remains the single largest operating challenge. The U.S.
              commercial electricity rate averaged 13.97 cents per kWh (industrial: 8.94 cents/kWh) in early 2026 per
              the EIA, and energy accounts for approximately 25% of vertical farm operating costs. Capital intensity is
              severe: greenfield vertical farms cost $1,500–$2,500 per square meter, nearly an order of magnitude above
              passive greenhouses. Funding for the vertical farming sector declined sharply from $2.8 billion in 2022 to
              $680 million in 2023, forcing many operators to halt new builds. A narrow crop-portfolio profitability
              window—leafy greens and microgreens are the only crops with proven economics at scale—limits revenue
              diversification, and open-field and greenhouse competitors from Mexico, the Netherlands, and Canada enjoy
              structural cost advantages from free sunlight.
            claimRefs:
