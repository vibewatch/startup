              - CM034
          - type: callout
            title: Organic Market Growth Creates Premium Pricing Tailwind
            body: >
              U.S. organic sales hit $76.6 billion in 2025, growing 6.8%—double the overall food market growth rate—for
              the third straight year. Organic produce is the largest single category within organic. This structural
              consumer preference for clean-label, traceable produce creates a durable premium pricing window for
              pesticide-free CEA producers like 80 Acres, provided the company can credibly communicate its production
              advantage.
