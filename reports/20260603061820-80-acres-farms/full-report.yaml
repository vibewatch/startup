      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The primary buyers and payers in 80 Acres' go-to-market model are retail grocery chains—the company's
              produce is sold in conventional supermarkets, natural/gourmet stores, and mass-market grocers. In the
              United States, there are approximately 45,575 supermarkets as of 2024 (including conventional
              supermarkets, limited-assortment grocery, supercenters, warehouse grocery, club stores, and
              natural/gourmet stores), generating combined sales of approximately $915 billion. The FMI reports that
              Americans spent 5.0% of disposable income on food at home in 2024, reflecting a large, stable demand pool.
              Within grocery, the fresh produce department typically contributes 8–12% of store revenue and is among the
              top traffic-driving categories, giving produce suppliers significant negotiating leverage relative to
              center-store packaged goods. End-users are health-conscious consumers who seek pesticide-free, locally
              grown, premium fresh produce and are willing to pay a 15% or greater premium for such products per
              consumer survey data cited by Mordor Intelligence. Payers at the retail level are grocery buyers (category
              managers) who control shelf placement, pricing tiers, and promotional budgets. Foodservice distributors
              represent a secondary buyer segment—80 Acres has historically supplied some restaurant and institutional
              customers—but retail is the primary channel. Budget for specialty produce sits within the grocery category
              manager's merchandising budget, with decisions typically made at the regional or national headquarters
              level for chain accounts and at the store/market level for independents. The adoption trigger for retail
              chains is shelf differentiation, private-label local branding potential, food-safety advantages of
              closed-system growing, and supply chain consistency year-round.
            claimRefs:
              - CM013
