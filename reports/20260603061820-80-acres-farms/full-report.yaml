  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Profile and Growth Trajectory
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms is a private company with no disclosed audited financial statements; all revenue metrics
              are either company-claimed or inferred from secondary evidence. The strongest available financial signal
              is management's own statement of a 60% compound annual growth rate in revenue over the three years through
              2024, disclosed in the company's February 2025 press release. Applied to any plausible 2022 baseline, this
              implies a revenue run-rate in the $100–140M range entering 2025, consistent with but not confirmed by the
              operational scale visible in news and SEC filings.


              The Soli Organic merger of August 2025 substantially resets the revenue baseline. Management projected
              combined first-year revenues approaching $200 million, reflecting the union of 80 Acres' technology-led
              farms with Soli Organic's 35-plus-year legacy, which itself had historic revenues near $120M as a
              standalone herb and greens operator. The combined entity now serves approximately 17,000 retail locations
              in the United States, up from about 1,500 (mostly Midwest) before the merger, and produces between 15 and
              20 million pounds of produce annually.


              Revenue streams as of the June 2026 report date span branded produce (salad blends, salad kits with
              proprietary Mother Raw dressings, herbs, microgreens, and tomatoes) distributed through national grocery
              retailers including Kroger, a developing ingredients channel for food-manufacturer customers, and an
              early-stage plant genetics capability via the Plantae Biosciences acquisition. The technology platform
              (Infinite Acres GroLoop) has not yet generated external licensing revenue, operating entirely as an
              internal cost centre and competitive moat.


              Retail pricing for branded salads typically ranges from approximately $4–6 per 5-oz bag, with salad kits
              at $6–9, representing a 20–50% premium to commodity field-grown alternatives. This premium positioning is
              essential to the unit economics thesis, since contribution margins on commodity produce at vertical-farm
              cost structures are extremely thin.
