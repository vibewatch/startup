        title: Segmentation and channel footprint
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence points to a mixed buyer, user, and payer stack rather than one monolithic
              customer. The direct buyer is usually a grocery produce-category manager or a foodservice procurement
              team; the end user is the grocery shopper or restaurant diner; and the payer is the retailer, distributor,
              or operator taking inventory risk. Before the Soli Organic merger, the best-documented segment was
              conventional grocery via Kroger, complemented by a broader eastern U.S. base of more than 1,500 retailers
              and restaurants. The March 2025 Kalera asset acquisition extended geography into Georgia, Texas, and
              Colorado and explicitly framed retailers and food distributors as a combined go-to-market channel. After
              the August 2025 merger, the segmentation widened again: 80 Acres' vertical-farm salads, kits, tomatoes,
              and microgreens sit beside Soli's longstanding herb footprint, materially increasing national grocery
              coverage. That said, the 17,000-door claim is best read as a combined-network number, not as proof that
              every door carries the same 80 Acres branded assortment today. Management's separate ingredients-channel
              language also implies an emerging B2B customer segment, but no named ingredients customers are public.
