      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms is a private company that has raised more than $370 million in equity capital across
              multiple rounds since 2019. The fundraising trajectory reflects investor confidence in the team and
              operational execution even as many peer vertical farming companies have filed for bankruptcy or closed
              operations.


              The January 2019 Series A, led by Virgo Investment Group (a San Francisco Bay Area private equity firm)
              for more than $40 million in equity, funded completion of the Hamilton, Ohio flagship facility—positioned
              at the time as the first fully automated indoor farm in North America. A second Series A tranche was
              raised in approximately November 2020 with continued Virgo participation; the amount was not publicly
              disclosed. In August 2021, General Atlantic led a $160 million Series B with participation from Siemens
              Financial Services (a technology and strategic investor), Blue Earth Capital (impact-focused private
              equity), Barclays (which also served as sole placement agent), Taurus Investment Holdings, and General
              Atlantic's BeyondNetZero climate impact team. At that point, the company had achieved over 450% revenue
              growth since the end of 2020 and served more than 600 retail and foodservice locations across 8 farms.


              In 2024, 80 Acres raised an additional $115 million from a combination of returning investors (General
              Atlantic, Siemens Financial Services, Barclays Climate Ventures, Virgo, Blue Earth Capital) and new
              participants (The Western and Southern Life Insurance Company and other Midwestern financial
              institutions). The company simultaneously acquired Plantae Biosciences (Israel) and Mother Raw dressings,
              and opened a Field Lab in The Hague, Netherlands. As of the February 2025 public announcement, aggregate
              capital raised exceeded $370 million according to AgFunderNews, while University of Cincinnati reporting
              cites the total as surpassing $400 million. The valuation has not been publicly disclosed in any round;
              analyst databases indicate the company approaches unicorn territory but no primary source confirms a
              specific figure.
