      - number: '5.2'
        title: Infinite Acres Technology Platform and GroLoop
        blocks:
          - type: paragraph
            body: >
              Infinite Acres is 80 Acres Farms' wholly owned technology subsidiary, co-founded and led by Tisha
              Livingston (co-founder and CEO of Infinite Acres), with its primary innovation hub in The Hague,
              Netherlands, and engineering presence aligned with the broader 80 Acres farm network. As of mid-2026,
              Infinite Acres employs approximately 53 people (LinkedIn) with roles spanning farm systems engineering,
              software development, control systems, and agronomics.


              The flagship product of Infinite Acres is GroLoop, commercially launched in May 2026 after years of
              proprietary development and deployment across the 80 Acres farm network. GroLoop is described as a
              hardware-agnostic, agentic farm operating system that unifies environmental controls, robotics,
              scheduling, yield analytics, and compliance monitoring into a single platform. At launch, GroLoop managed
              approximately one million square feet of controlled-environment agriculture across six states, serving
              more than 18,000 retail locations and engaging more than 1,000 CEA professionals globally. The platform is
              designed to be sold or licensed to third-party growers—marking a strategic shift toward a
              software/platform revenue stream alongside product sales.


              The technology architecture of Infinite Acres rests on three pillars the company calls the "Infinite Acres
              Loop system": (1) Purpose-built hardware stack—including Signify (formerly Philips Lighting) horticultural
              LED grow-lighting systems, Siemens digital twin simulation for farm design and energy optimization, SICK
              sensor arrays for real-time environmental monitoring, and TTA/TTA-ISO precision mechanics; (2) Applied
              agronomic software—encompassing environmental controls, AI-guided planting and harvest scheduling,
              robotics orchestration, water and nutrient management, and predictive analytics; and (3) Trait-driven
              plant genetics, delivered through the Plantae Biosciences acquisition and the Infinite Acres Israel
              genetics facility.


              The company originally partnered with Dutch greenhouse controls firm Priva for environmental controls in
              its 2018–2020 era farms. By 2023 the Siemens collaboration and Infinite Acres software stack had displaced
              or supplemented third-party controls at its flagship facilities. The GroLoop platform is being retrofitted
              into the three Kalera-acquired farms (Georgia, Texas, Colorado) to standardize operating parameters, a
              capability Livingston highlighted as a key differentiator for the asset-acquisition strategy.
