      (Signify, Siemens, SICK, TTA-ISO), a proprietary software and environmental control layer (GroLoop OS), an applied
      agronomy layer (AI-guided growing protocols, yield analytics), and a genetics/biology layer (Plantae / Infinite
      Acres Israel). These layers compound into a vertically integrated CEA operating system designed to optimize
      productivity, consistency, and cost across any scale of indoor farm.
    data:
      layers:
        - label: Genetics & Biology Layer
          sublabel: Infinite Acres Israel (Plantae Biosciences) — Weizmann Institute collab
          detail: >-
            Metabolomics + genome editing for CEA-optimized crop traits (flavor, yield, nutrition); R&D stage; no
            commercial variety released as of mid-2026
          level: 4
        - label: Applied Agronomy & AI Analytics Layer
          sublabel: Proprietary algorithms + agronomists
          detail: >-
            AI-driven growth-recipe optimization; yield forecasting; continuous environmental setpoint refinement;
            crop-specific photosynthetic protocols
          level: 3
        - label: GroLoop OS – Software & Controls Layer
          sublabel: Infinite Acres proprietary (commercial launch May 2026)
          detail: >-
            Hardware-agnostic farm OS; unifies environmental controls, robotics scheduling, water/nutrient dosing,
            compliance monitoring, and analytics; ~1M sq ft under management
          level: 2
        - label: Hardware Ecosystem Layer
          sublabel: Signify (LED) · Siemens (Digital Twin) · SICK (Sensors) · TTA-ISO (Automation)
          detail: >-
            Jointly optimized hardware stack validated across 80 Acres' farm network; Signify full-spectrum LEDs,
            Siemens virtual-farm simulation, SICK environmental monitoring arrays, TTA-ISO precision
            seeding/transplanting/harvesting robotics
          level: 1
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FE002
    title: Seed-to-Shelf Operating Flow
    type: flow
    layout: wide
    summary: >-
      The 80 Acres / Infinite Acres operating flow runs from seed selection (increasingly informed by Plantae genetics)
      through controlled indoor germination, AI-guided growing cycles, robotic harvesting, in-farm packaging, and
      direct-to-retail distribution—with GroLoop OS monitoring and optimizing each stage. The short supply chain (farm
      within a few hours of retail) is a core freshness differentiation relative to field-grown produce shipped
      cross-country.
    data:
      nodes:
        - id: step-genetics
          label: Seed / Genetics
          detail: >-
            Seeds selected or engineered via Plantae/Infinite Acres Israel genetics program; CEA-optimized traits
            (yield, flavor, texture, nutrition)
          tone: positive
        - id: step-germination
          label: Germination & Propagation
          detail: >-
            Seeds germinated in sterile, climate-controlled propagation zones; GroLoop OS manages temperature, humidity,
            lighting photoperiod
          tone: positive
        - id: step-grow
          label: Controlled-Environment Growing
          detail: >-
            Multi-level vertical growing towers with Signify LED lighting tuned per crop; SICK sensors monitor real-time
            environment; AI adjusts setpoints; ~10 growing levels in Hamilton; robotics manage plant movement
          tone: positive
        - id: step-harvest
          label: Robotic Harvesting
          detail: >-
            TTA/TTA-ISO precision robotics harvest at optimal maturity; reduces labor cost and contamination risk versus
            manual harvesting
          tone: positive
        - id: step-pack
          label: In-Farm Packaging
          detail: >-
            Products packed in climate-controlled area on-site; packaging includes salad kits, clamshells, herb packs;
            short time from cut to case
          tone: positive
        - id: step-distribute
          label: Regional Distribution & Retail
          detail: >-
            Short-haul distribution to regional grocery and foodservice; Kroger, Whole Foods, Meijer, Sysco, US Foods;
            18,000+ retail storefronts post-merger
          tone: positive
      edges:
        - from: step-genetics
          to: step-germination
          label: Seeds selected
        - from: step-germination
          to: step-grow
          label: Seedlings transferred
        - from: step-grow
          to: step-harvest
          label: Crops mature
        - from: step-harvest
          to: step-pack
          label: Harvested produce
        - from: step-pack
          to: step-distribute
          label: Packed product
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE018
  - id: FE003
    title: GroLoop Critical Dependency Map
    type: dag
