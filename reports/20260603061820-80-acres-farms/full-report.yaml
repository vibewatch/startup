      - number: '8.4'
        title: Exit Readiness, Kill Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              80 Acres Farms' natural exit pathways are a strategic acquisition, a financial sponsor buyout or growth
              equity continuation, or an eventual IPO. The strategic acquirer universe includes large conventional
              produce companies (Taylor Farms, Fresh Del Monte, Dole), food majors seeking a sustainability premium and
              retail shelf presence, or technology integrators such as Siemens (already a financial shareholder). A food
              major acquisition at 1–2x revenue on $200M projected revenues would value 80 Acres at $200–400M, below the
              implied entry for the Series C investors if unicorn markings were assigned. An IPO is unlikely before
              demonstrated EBITDA profitability across at least two consecutive audited fiscal years; the sector's SPAC
              history (AppHarvest, Revol Greens attempted de-SPAC) has made public market investors cautious. A
              continuation fund or secondary transaction could provide liquidity for early Virgo or General Atlantic
              positions at a negotiated mark.


              The thesis-break scenario with the highest probability is a second major facility closure within 12 months
              of Harrisonburg, which would signal that site-level economics have not improved post-merger and that the
              $200M revenue projection is overestimated. A secondary trigger is a down round or debt-financed raise at
              terms that reveal investor-side valuation compression below the most recent implied mark. A third trigger
              is management departure (Mike Zelkind or Tisha Livingston), which would substantially increase capital
              access and execution risk given key-person concentration.


              The non-negotiable diligence items before a buy determination: (1) audited FY2024 and FY2025 financials
              with revenue, EBITDA, and facility-level margins; (2) cap table with preference stack, liquidation
              waterfall, and anti-dilution terms; (3) Soli Organic integration cost schedule and restructuring charge
              quantum; (4) Kentucky KEDFA incentive draw schedule and cash-on-hand as of mid-2026; and (5) the Arizona
              SPV (Eloy I10 & Tonto Road 80 Acres LLC) purpose, capital commitment, and facility economics.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV024
              - CV025
              - CV028
              - CV030
