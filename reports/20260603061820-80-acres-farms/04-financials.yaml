      Pre-2022 rounds (~$57M) are inferred as the difference between the AgFunder $370M
      total and the three documented Form D tranches ($313.5M); actual amount may differ.
      Form D 2025B ($28.4M) was an ongoing offering as of its filing date; final amount may
      be higher. All amounts in USD millions.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI018
      - CI019

callouts:
  - calloutType: strength
    title: Institutional investor quality signals operational credibility
    body: >
      General Atlantic, Siemens Financial Services, Barclays Climate Ventures, and Western
      and Southern Life have participated across multiple rounds with knowledge of 80 Acres'
      internal financials. Their continued participation—and the company's ongoing ability
      to raise—is the strongest available proxy for positive unit economics in the absence
      of public disclosures.
    claimRefs:
      - CI016
      - CI017
      - CI018
  - calloutType: risk
    title: Revenue and margin remain entirely unverified private assertions
    body: >
      The 60% CAGR claim and $200M merger revenue projection are company-stated and cannot
      be reconciled against SEC Form D data (all "Decline to Disclose"). Without audited
      financials, investors cannot distinguish between genuine profitability and a narrative
      supported by continued equity issuance rather than operating cash flow.
    claimRefs:
      - CI001
      - CI002
      - CI015
      - CI044
  - calloutType: risk
    title: Post-merger restructuring signals integration cost overhang
    body: >
      The Harrisonburg closure (80 jobs, WARN Act, July 2026) and Georgia layoffs (128
      workers pre-merger) add one-time costs not captured in the $200M revenue projection.
      Consolidation to Atlanta and Indianapolis is strategically sound, but the near-term
      cost overhang and potential morale impact on the broader 1,200-person workforce warrant
      close monitoring.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036
  - calloutType: insight
    title: Capital-light M&A is the most differentiated strategic move
    body: >
      Acquiring Kalera's three operational farms (Georgia, Texas, Colorado) for an undisclosed
      price—after Kalera spent an estimated $250M building them—and retrofitting with
      Infinite Acres technology is the most capital-efficient expansion approach in the sector.
      If the Soli Organic merger follows the same playbook (scale at a fraction of greenfield
      cost), the combined entity could achieve network density without proportional capex.
    claimRefs:
      - CI041
      - CI042

