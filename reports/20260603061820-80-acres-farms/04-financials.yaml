  - id: capital-adequacy-and-funding-structure
    title: Capital Adequacy and Funding Structure
    body: >
      80 Acres Urban Agriculture, Inc. (SEC CIK 0001925495), a Delaware corporation headquartered
      in Hamilton, Ohio, has filed three Form D exempt offerings with the SEC, collectively
      documenting $313.5 million raised from at least 81 investors as of 2025. A 2022 filing
      (first sale 2021-06-17) recorded $170.8M raised from 29 investors; a 2025A filing (first
      sale 2023-06-08) recorded a $150M offering with $114.3M sold to 81 investors; and a 2025B
      filing (first sale 2025-08-13) recorded $28.4M raised from 72 investors. Adding estimated
      pre-2022 rounds (Virgo Investment Group 2019, early angels), total funding reaches the
      $370M+ figure cited by AgFunderNews in February 2025.


      The publicly announced $160M Series B in July 2022 was led by General Atlantic, with
      participation from Siemens Financial Services, Barclays, Blue Earth Capital, Taurus
      Investment Holdings, and the BeyondNetZero impact fund. The subsequent $115M announced
      in February 2025 (covering 2024 closes) brought in Virgo Investment Group and Western and
      Southern Life Insurance Company alongside returning investors. This investor base is
      strategically coherent: Siemens' participation links to the company's digital-twin and
      energy-management partnerships, while General Atlantic provides global growth equity
      expertise and a track record in scaling food and consumer businesses.


      Cash on hand, monthly burn, and runway are not disclosed publicly. All three SEC Form D
      filings list "Decline to Disclose" in the revenue range field, making independent cash-flow
      modelling impossible. Kentucky Economic Development Finance Authority (KEDFA) incentives
      tied to the Boone County facility reduce realized capex burden through performance-based
      tax credits, but the quantum and timing of these incentives are not publicly disclosed.
