  - id: FI002
    title: Farm-Level Unit Economics Bridge (Qualitative)
    type: flow
    layout: wide
    summary: >
      80 Acres Farms' claimed positive farm unit economics rest on renewable energy sourcing,
      automation-driven labour reduction, and near-consumer farm location shortening cold chain;
      not independently verified.
    data:
      nodes:
        - id: crop-genetics
          label: Optimized Crop Varieties
          detail: >
            Plantae Biosciences (acquired 2025) accelerates breeding of varieties optimized for
            indoor controlled environments, improving yield per sq ft and quality metrics.
          tone: positive
        - id: energy-costs
          label: LED Energy Cost
          detail: >
            100% renewable electricity claimed; energy is the largest COGS driver in vertical
            farming (estimated 30–40% of production cost). Renewable sourcing reduces exposure
            to commodity electricity pricing.
          tone: neutral
        - id: automation
          label: Robotics & Automation
          detail: >
            Infinite Acres GroLoop automates seeding, transplanting, and harvesting, reducing
            per-unit labour cost; Siemens digital-twin and Signify LED lighting enable
            precision climate management.
          tone: positive
        - id: cold-chain
          label: Near-Consumer Location
          detail: >
            Farms near distribution centres reduce cold-chain cost and shelf waste; shorter
            supply chain is a structural advantage vs. California field-grown shipped cross-country.
          tone: positive
        - id: farm-margin
          label: Farm-Level Margin (Claimed Positive)
          detail: >
            Tisha Livingston stated "already profitable farm unit economics" in March 2025; not
