companyProfile:
  summary: 80 Acres Farms is a private U.S. vertical-farming company that combines controlled-environment produce cultivation with the GroLoop / Infinite Acres technology stack and an acquisition-led expansion strategy. Founded in 2015 by Mike Zelkind and Tisha Livingston, the company has grown from a Cincinnati-area operator into a Hamilton, Ohio-headquartered national platform after acquiring Kalera assets and merging with Soli Organic. Public evidence supports real commercial scale and a differentiated automation story, but the company still does not publish audited financials or a disclosed valuation.
  foundedDate: '2015-01-01'
  founders:
    - name: Mike Zelkind
      role: Co-founder and CEO
      background: Public company materials describe him as the commercial and capital-markets lead with prior large-scale food-manufacturing experience.
      claimRefs: [CO001, CO007]
    - name: Tisha Livingston
      role: Co-founder and CEO of Infinite Acres
      background: Engineering-trained co-founder who remains central to the GroLoop / Infinite Acres technology platform and broader farm-operations narrative.
      claimRefs: [CO001, CO006]
  foundingLocation: Cincinnati, Ohio
  headquarters: Hamilton, Ohio
  productSummary: 80 Acres Farms sells branded salad blends, salad kits, herbs, microgreens, tomatoes, and dressings through retail grocery and foodservice channels, while using the GroLoop / Infinite Acres platform to automate indoor-farm operations and retrofit acquired facilities.
  customerFocus: Grocery retailers, foodservice distributors, and branded fresh-produce consumers seeking premium indoor-grown leafy greens, herbs, and related products.
  businessModel: Revenue comes primarily from branded and distributed produce sales; strategic value also depends on operational leverage from GroLoop, integration of acquired farm assets, and continued access to external capital.
  stage: Growth-stage / Series C
  fundingStatus: Public reporting indicates $370M-$400M of cumulative capital raised, including a $115M 2024 raise and a smaller 2025 Form D sale, but no public post-money valuation has been disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO018, CI001, CI002, CI003, CV001, CV002, CV043]
summary:
  headline: 80 Acres Farms appears to be the most credible remaining U.S. vertical-farming consolidator, but no audited financials and no disclosed valuation justify TRACK rather than BUY.
