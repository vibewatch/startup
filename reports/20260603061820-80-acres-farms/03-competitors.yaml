  evidenceGaps:
  - type: missing-source
    severity: material
    topic: GroLoop-independent-benchmark
    missingEvidence: No independent third-party performance benchmarks, crop yield comparisons, or energy efficiency audits comparing GroLoop against competitor technology platforms or greenhouse operations.
    whyItMatters: 80 Acres Farms' technology moat narrative rests entirely on self-disclosed platform capabilities and partner-authored press releases; without independent validation, the GroLoop advantage cannot be verified in diligence.
    diligencePath: Request third-party technology assessments, agronomist yield audits, and energy-per-pound comparisons for GroLoop farms versus BrightFarms or Gotham Greens greenhouse facilities.
    relatedQuestionRefs:
    - QP015
  - type: private-evidence-only
    severity: blocking
    topic: revenue-growth-2026
    missingEvidence: No public evidence of 80 Acres Farms' revenue, gross margin, or growth rate for 2025 or 2026; the 60% CAGR claim is as of 2024 and predates the Soli Organic merger and Harrisonburg closure.
    whyItMatters: The investment thesis depends on whether the combined entity can maintain growth trajectory and approach profitable operations; neither the pro forma margins nor the merged entity's first-year economics are publicly disclosed.
    diligencePath: Request audited revenue, gross margin, and EBITDA for 2024 and the first post-merger period; confirm whether Harrisonburg closure is reflected in 2025 figures and whether Soli Organic integration created or destroyed margin.
    relatedQuestionRefs:
    - QP019
    - QP024
  - type: private-evidence-only
    severity: material
    topic: retail-contract-pricing
    missingEvidence: No public disclosure of per-unit pricing, slotting fees, promotional allowances, or retail buyer contract structures for any 80 Acres Farms retail program including Kroger, Whole Foods, Harris Teeter, or Soli Organic channels.
    whyItMatters: The difference between gross revenue and realized margin in grocery retail is largely driven by these trade spend terms; without them, the 60% revenue CAGR cannot be translated into profit trajectory.
    diligencePath: Request retail trade spend as a percentage of revenue, confirmed gross margin by channel, and renewal terms for the Kroger and Whole Foods programs.
    relatedQuestionRefs:
    - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: capital-efficiency-comparison
    missingEvidence: Comparison of 80 Acres Farms' revenue-per-dollar-raised to failed peers is approximate due to incomplete public disclosure of 80 Acres' total historical capital raised versus total cumulative revenue.
    whyItMatters: Capital efficiency versus Bowery Farming, AppHarvest, or Plenty is a key thesis differentiator but cannot be fully quantified from public sources alone.
    diligencePath: Request a historical capital raised versus cumulative revenue table for 80 Acres Farms and confirm against investor-provided cap table data.
    relatedQuestionRefs:
    - QP024
