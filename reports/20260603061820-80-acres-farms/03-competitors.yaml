- id: pricing-and-market-dynamics
  title: Pricing dynamics, retail distribution, and competitive GTM
  body: 'No indoor farming competitor—including 80 Acres Farms, AeroFarms, Gotham Greens, BrightFarms, or Little Leaf Farms—publishes a public list price, per-unit retail schedule, or B2B contract structure. The sector operates entirely on custom retail buyer negotiations with undisclosed slotting fees, promotional allowances, and volume commitment terms. 80 Acres Farms does not disclose realized gross margins, contract terms, or pricing versus conventional produce in its public communications. The documented failure of Bowery Farming is partly attributable to weak consumer uptake at indoor farming''s premium price points, a structural warning for all operators. 80 Acres Farms'' distribution story is its clearest competitive differentiator: starting from a single Kroger store in Cincinnati in 2019, it expanded to approximately 300 Kroger stores by 2021 and announced plans for roughly 1,000 Kroger locations across the Midwest and Southeast by 2023. The company also distributes through Sysco and US Foods, reaching foodservice buyers in addition to retail grocery. The post-merger Soli Organic network adds herbs across 17,000+ storefronts, including 70% of the top 10 U.S. retailers, giving the combined company a distribution reach that no indoor farming peer can demonstrate. 80 Acres Farms reported a 60% compound annual revenue growth rate through 2024 per company disclosure, though the underlying gross margin trajectory remains private.'
