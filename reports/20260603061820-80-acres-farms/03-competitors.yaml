- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - GroLoop tech platform and industrial partner ecosystem
    - No public independent benchmark of GroLoop performance; partners (Siemens, Signify) supply similar tech to other operators
    - Medium
    - Request independent crop yield, energy efficiency, and automation uptime data benchmarked against greenhouse peers
  - - Retail distribution reach (Kroger, Soli network, foodservice)
    - Retail buyers negotiate hard on slotting; consolidation at grocery chains concentrates buyer power
    - High
    - Request retailer contract structures, renewal terms, and slotting fee exposure as a share of revenue
  - - Product breadth and vertical integration (dressings, herbs, greens, tomatoes)
    - Gotham Greens also offers dressings; Soli integration adds complexity without guaranteed margin uplift
    - Medium
    - Confirm that Mother Raw and Soli Organic integrations improve consolidated gross margin, not just revenue
  - - Energy cost moat via renewable electricity
    - Renewable procurement reduces sustainability critique but does not eliminate electricity cost versus field farming
    - High
    - Obtain per-pound electricity cost and compare to greenhouse peers and field growers; confirm renewable contract terms
  - - Industry consolidation as barrier to new entry
    - Capital market downturn in indoor farming could attract distressed-asset acquirers or lower-cost entrants
    - Medium
    - Monitor Plenty restructuring, AeroFarms trajectory, and whether new capital enters the category in 2026
  - - Premium consumer pricing ceiling
    - Documented consumer resistance to indoor farming premiums (Bowery failure); economic downturns depress willingness to pay
    - High
    - Track retail price gaps versus conventional produce; request consumer elasticity studies and premium retention data
  notes: Severity is an analytic judgment from retained public evidence, not a company-reported score. Each row identifies the specific diligence artifact needed to convert narrative moat claims into verifiable competitive proof.
