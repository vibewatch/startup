callouts:
  - calloutType: risk
    title: Analyst TAM Figures Likely Overstate Produce Revenue by 30–50%
    body: >
      The global vertical farming TAM reported by GVR ($9.62B, 2025) and Mordor ($6.27B, 2025) diverge by 53% for the same year. Both likely include LED hardware, climate system, and software spend, which is capital expenditure for farm operators—not produce revenue they can capture. Investors should apply a downward adjustment of at least 30% to isolate the produce-revenue addressable market before using these figures as valuation anchors.
    claimRefs:
      - CM029
      - CM030

  - calloutType: risk
    title: Sector Bankruptcy Wave Constrains Investor Appetite Through at Least 2026
    body: >
      AeroFarms (Ch. 11, 2023), Bowery Farming (liquidated 2023), Infarm (insolvency 2023), and AppHarvest (bankruptcy 2023) represent the four highest-profile vertical farming failures in a 12-month window. Venture funding fell from $2.8B in 2022 to $680M in 2023. While 80 Acres raised $115M in February 2025, the sector's cost of capital remains elevated and growth assumptions require demonstrably lower unit economics than failed peers.
    claimRefs:
      - CM031
      - CM032
      - CM033
      - CM034

  - calloutType: insight
    title: Organic Market Growth Creates Premium Pricing Tailwind
    body: >
      U.S. organic sales hit $76.6 billion in 2025, growing 6.8%—double the overall food market growth rate—for the third straight year. Organic produce is the largest single category within organic. This structural consumer preference for clean-label, traceable produce creates a durable premium pricing window for pesticide-free CEA producers like 80 Acres, provided the company can credibly communicate its production advantage.
    claimRefs:
      - CM022
      - CM023

