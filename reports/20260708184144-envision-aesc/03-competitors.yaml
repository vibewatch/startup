  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "AESC competes in a brutal battery field split between scaled Asian incumbents, OEM-backed local builders, and a fragile second tier of Western challengers. The public file supports a narrow positive case: AESC remains relevant because local-for-local procurement and OEM qualification still matter, and Europe remains open enough for non-CATL suppliers to win. But the stronger conclusion is adverse. Scale leaders such as CATL, BYD, LG Energy Solution, Panasonic, and Samsung SDI retain more chemistry breadth and balance-sheet power, while PowerCo proves OEM-backed localization is becoming live production rather than just a policy slogan."
  },
  "sections": [
    {
      "id": "incumbent-benchmark-set",
      "title": "The benchmark set starts with scale leaders, not with other late-stage private challengers",
      "body": "The first mistake in underwriting AESC is benchmarking it only against other venture-backed battery hopefuls. Public market-share and official-company sources show that the real reference set starts with CATL, BYD, LG Energy Solution, Samsung SDI, and Panasonic Energy. These players are not interchangeable, but they share the traits that matter most in battery competition: chemistry breadth, large balance sheets, manufacturing depth, and enough customer reach to convert capacity announcements into actual procurement power. Electrive's SNE Research summary and CarNewsChina's China-share reporting show how concentrated the category remains around CATL and BYD. Official company pages then widen the picture beyond sheer share: LG Energy Solution, Samsung SDI, Panasonic, and BYD all market broader energy or automotive battery ecosystems rather than one-off regional factories. For AESC, that means the central competitive question is not whether it is better than an early-stage European startup. It is whether a localized multi-region supplier with finite disclosed funding can carve out durable room beside public giants that already shape the cost curve and customer shortlist.",
