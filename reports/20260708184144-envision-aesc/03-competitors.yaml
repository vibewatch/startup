    {
      "id": "switching-costs-and-moat-verdict",
      "title": "Localization helps AESC, but it is not a moat unless utilization and policy resilience follow",
      "body": "The best case for AESC is that battery buying still carries genuine switching costs. BMW's announcement tying South Carolina cells to a specific Spartanburg EV program shows how supply can become locked to a local platform once qualification, industrial planning, and incentives align. AESC's own site also makes clear that the company is trying to compete across both EV and storage contexts, not as a single-site supplier. But the moat conclusion still comes out thin. BMWBLOG's report on the South Carolina pause shows how quickly policy and tariff changes can weaken one localized plant, while Hungarian and broader European reporting show Korean and Chinese rivals continuing to crowd the same regional logic. In other words, AESC's localization strategy is necessary but no longer distinctive. The company remains competitive where OEMs want a qualified local partner and the very largest incumbents are not politically or commercially ideal. It does not yet have public evidence of enough price visibility, utilization certainty, or balance-sheet superiority to call that position durable.",
