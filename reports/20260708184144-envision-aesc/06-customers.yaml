    {
      "id": "retention-and-durability-are-mostly-proxy-analysis",
      "title": "Retention, repeat usage, and durability are still mostly inferred rather than measured",
      "body": "AESC's business likely has meaningful switching costs, but the public evidence on actual retention remains thin. In heavy industry and automotive supply, long qualification cycles, local plant integration, and program-specific tooling usually create more stickiness than in transactional markets. That logic is visible here: Nissan, Renault, BMW, and Nidec are not impulse buyers. Even so, the record still lacks the metrics investors normally use to separate sticky accounts from simply prestigious ones. There is no public NRR, GRR, churn, cohort curve, satisfaction score, or disclosed average contract length in the reviewed file. That forces the chapter to use proxies. Automotive and infrastructure accounts probably retain better than newly won storage relationships because switching is harder and integration is deeper, but that remains an estimate, not a disclosed fact. Investors should therefore read AESC's customer durability as plausible and partially evidenced, not as verified.",
      "claimRefs": [
        "CU024",
