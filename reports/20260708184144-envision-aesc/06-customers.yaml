    {
      "id": "expansion-loops-and-concentration-risk",
      "title": "Expansion potential is real, but concentration and policy dependence remain the core customer risks",
      "body": "The expansion story is credible. Once AESC wins a regional anchor program and finances a local plant, it can potentially sell into adjacent models, related OEM demand, or storage deployments that benefit from the same manufacturing footprint. The storage-customer file makes this especially clear: Prevalon, Nidec, Fluence, and CBEA-cited integrator relationships show AESC trying to use manufacturing scale beyond passenger EVs. But the risk side is equally clear. The public customer base still appears concentrated in a few strategic ecosystems, and South Carolina shows how quickly a high-profile OEM-linked opportunity can become less dependable when policy and market conditions change. That means AESC probably has high-quality customers but not yet obviously diversified customer economics. The best customer verdict is therefore balanced: strong account proof, improving end-market breadth, but material concentration and renewal-opacity risk. That is why account breadth, top-customer mix, and program-level continuity matter as much as any one marquee announcement.",
