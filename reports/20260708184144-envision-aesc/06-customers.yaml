    {
      "id": "named-proof-is-production-grade",
      "title": "Named customer proof is strongest where it is tied to plants, GWh, or platform scope",
      "body": "The best AESC customer evidence is production-grade rather than logo-based. Nissan links Sunderland output to the next-generation LEAF and EV36Zero. Renault and related trade coverage place AESC inside a real Douai EV-production ecosystem. BMW's announcement and South Carolina development coverage show a next-generation cylindrical-cell role tied to Spartanburg-built EVs. On the storage side, the best proof comes from scope-rich agreements rather than generic partnership language. PR Newswire, Energy-Storage.news, and Renewables Now all describe more than 10 GWh of planned supply to Prevalon over three years, while Nidec's own announcement and its mirrored release say AESC will supply over 3 GWh of LFP batteries in the first phase of cooperation. Fluence is supportive but weaker: the public record confirms orders, not a deployment scope as explicit as Prevalon or Nidec. The practical conclusion is that AESC already has enough named proof to demonstrate real adoption. What varies is the maturity and specificity of that proof by customer.",
