evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Current fully diluted ownership table showing Envision, Nissan, GIC, other investors, and project-level
      ring-fencing.
    whyItMatters: Minority-rights, governance, and exit-value allocation cannot be underwritten from public summaries alone.
    diligencePath: Request the latest cap table, shareholder agreements, and board observer or reserved-matter schedules.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: hq-identity
    missingEvidence: >-
      An authoritative current legal-entity disclosure reconciling Japanese headquarters references with Chinese-parent
      corporate-office references.
    whyItMatters: >-
      Jurisdiction, regulatory exposure, and management accountability depend on which entity and office truly anchor
      the group.
    diligencePath: >-
      Obtain current legal-entity chart, registered-office filings in Japan and China, and latest group annual
      sustainability or governance report.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated revenue, gross margin, EBITDA, capex, debt, and cash balances for the operating group and
      major project vehicles.
    whyItMatters: >-
      Without audited financials, valuation and credit-quality judgments rely on database previews and project
      announcements rather than hard operating performance.
    diligencePath: Request audited financial statements, management accounts, project-finance term sheets, and covenant packages.
    relatedQuestionRefs:
      - QO016
      - QO017
  - type: stale
    severity: material
    topic: ipo
    missingEvidence: >-
      A filed prospectus, mandate letter, or updated financing announcement confirming Hong Kong IPO timing, size, or
      abandonment.
    whyItMatters: IPO headlines shape perceived valuation and liquidity but remain preliminary until formally filed or withdrawn.
    diligencePath: >-
      Monitor Hong Kong exchange filings, Bloomberg follow-ups, and company/investor statements for a live process
      update.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: AESC utilization by localized region
    missingEvidence: >-
      Plant-by-plant utilization assumptions, offtake schedules, and customer allocations for Sunderland, Douai, Spain,
      Japan, and any restart case in the US.
    whyItMatters: >-
      Without utilization and customer-allocation data, the SAM/SOM range cannot be converted into credible revenue or
      margin capture.
    diligencePath: Request offtake summaries, customer allocation by plant, and management's utilization ramp assumptions.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: precise market-size figure
    missingEvidence: >-
      A single market-study methodology that isolates the exact battery demand AESC can serve without mixing global TAM,
      local EV production, and ESS adjacency.
    whyItMatters: >-
      Headline TAM numbers are easy to overstate and can distort valuation if they are not tied to localized industrial
      reality.
    diligencePath: Build a bottoms-up regional battery-demand model from named vehicle programs and ESS project pipelines.
    relatedQuestionRefs:
      - QM016
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: TM002 sizing layer coverage
    missingEvidence: >-
      A public source that directly quantifies localized battery demand in AESC's exact plant geographies instead of
      broader regional EV demand.
    whyItMatters: >-
      The chapter uses a layered SAM approach because public data are richer on regions and competitors than on
      AESC-specific localized demand.
    diligencePath: >-
      Look for lender decks, OEM supplier disclosures, or regional battery-cluster studies that specify local GWh demand
      by vehicle platform.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: TM003 buyer map coverage
    missingEvidence: A public AESC source naming real ESS customers and the budget owners behind those programs.
    whyItMatters: >-
      The storage adjacency is strategically important but much less customer-specific in the public file than the OEM
      side.
    diligencePath: Request reference accounts, ESS case studies, or integrator partnerships from management.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: AESC and peer plant economics
    missingEvidence: Plant-level unit-cost curves, yield, and break-even utilization for AESC and the nearest regional rivals.
    whyItMatters: Without true cost and utilization data, localization can look like a moat when it may only be a capex trap.
    diligencePath: Request plant-level contribution margins, utilization ramps, and customer allocation by site.
    relatedQuestionRefs:
      - QP022
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: Pricing / packaging comparison coverage
    missingEvidence: Public battery ASPs, discounting structures, and take-or-pay details by program.
    whyItMatters: The chapter can compare industrial posture, but not who is actually winning economically on price.
    diligencePath: Obtain customer contracts, supplier agreements, or procurement benchmarks for comparable regional programs.
    relatedQuestionRefs:
      - QP012
      - QP024
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: European challenger viability
    missingEvidence: >-
      A reconciled view of which European plants are permanently impaired versus temporarily paused or still
      financeable.
    whyItMatters: This determines whether AESC is benefiting from a temporary shakeout or facing a recoverable competitor set.
    diligencePath: Cross-check bankruptcy filings, lender updates, and current construction status across named rival projects.
    relatedQuestionRefs:
      - QP010
      - QP023
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: minor
    topic: Competitor profile completeness
    missingEvidence: >-
      Fresh public evidence on exact customer concentration, utilization, and contract duration for listed incumbents
      and European challengers.
    whyItMatters: Profile rows summarize visible strategy and scale, but not actual book quality.
    diligencePath: Collect supplier award disclosures, plant utilization commentary, and lender materials.
    relatedQuestionRefs:
      - QP017
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: Consolidated revenue, margin, and cash runway
    missingEvidence: Audited consolidated revenue, gross margin, EBITDA, cash on hand, monthly burn, and runway months.
    whyItMatters: >-
      Without core income-statement and liquidity figures, the financing stack cannot be converted into a real
      underwriting view.
    diligencePath: Request audited financial statements plus current management accounts and cash-forecast model.
    relatedQuestionRefs:
      - QI004
      - QI018
      - QI019
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: minor
