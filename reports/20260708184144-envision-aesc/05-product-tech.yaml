  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "AESC is no longer just a legacy Nissan pouch-cell supplier. The public file supports a broader product platform spanning localized EV-battery manufacturing and increasingly explicit large-format storage cells, with next-generation NMC and cylindrical programs now visible. The strongest verified strengths are operational: real gigafactories, named OEM workflows, clean-room manufacturing, safety certifications, and an increasingly concrete storage roadmap. The biggest remaining gap is process specificity: public evidence is much thinner on exact chemistry mix, yield, module architecture, and patents than on manufacturing footprint and customer programs."
  },
  "sections": [
    {
      "id": "product-lines-and-asset-map",
      "title": "AESC now presents as an EV-and-storage battery platform, not a single legacy auto program",
      "body": "The official AESC surface describes the company in deliberately broad terms: battery cells for electric vehicles plus industrial-scale energy systems. That positioning is supported by customer and trade sources. BMW, Nissan, and Renault announcements show the EV side, while the China Battery Industry article gives the clearest storage-side product detail, including 300+Ah, 500+Ah, 530Ah, and 700+Ah storage-cell families. This is important because it changes how the technology should be underwritten. AESC is not only a regional auto supplier whose future depends on one Nissan legacy line. It is trying to operate a dual product stack in which EV programs require qualification, regional plants, and platform-specific formats, while storage products require cycle life, safety, energy efficiency, and partnerships with integrators. Public maturity signals are strongest where those product lines already map to real plants: Sunderland, Douai, and customer-tied OEM programs. The weaker area is exact product mix by plant, because the open web still does not cleanly reveal which chemistry, form factor, or cell family dominates each site.",
