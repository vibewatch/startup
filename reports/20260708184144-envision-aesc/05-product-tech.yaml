    {
      "id": "trust-quality-and-technical-risk",
      "title": "Trust and quality signals are meaningful, but public process transparency remains the technical weak point",
      "body": "AESC's public trust story is more concrete than many private manufacturers' marketing. The sustainability page gives renewable-electricity and LCA-coverage metrics; the CBEA article lists a long set of Chinese, Japanese, US, and IEC certifications; and both CBEA and older EV-program coverage emphasize safety narratives rather than only energy density. The storage-cell coverage is especially useful because it pairs performance claims with safety framing, AI-assisted quality control, and a record of zero major accidents. Even workforce development shows up as a relevant diligence signal: because AESC is not a software company with a GitHub trail, the National Battery Training & Skills Academy functions as a practitioner-community proxy for the skills base needed to operate gigafactories. Still, the biggest product-tech risk is not absence of evidence; it is uneven evidence. Public disclosures say little about patents, proprietary process steps, yields, recalls, or exact chemistry allocation by plant. Combined with market pressure from the industry-wide LFP shift, that means AESC's technology appears credible and commercial, but its process moat is still less legible than its manufacturing footprint.",
