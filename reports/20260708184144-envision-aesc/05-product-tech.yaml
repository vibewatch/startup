    {
      "id": "technology-architecture-and-manufacturing-flow",
      "title": "The architecture is visible from chemistry to localized production, but the middle of the stack stays partly opaque",
      "body": "Public sources reveal the ends of AESC's architecture better than the middle. On the front end, BMW and InsideEVs show a next-generation cylindrical program with explicit performance claims, while Nikkan Jidosha Shimbun points to a Gen6 NMC roadmap with higher energy density and smaller packaging. On the storage side, CBEA provides unusually concrete specs: a 530Ah cell with more than 1.6 kWh per cell, 12,000 cycles, 95% efficiency, and a larger 700+Ah roadmap behind it. The back end is also relatively visible. Evertiq highlights clean-room production at Sunderland, and the company's public sites and customer releases show localized manufacturing tied to vehicle programs. What remains hard to see is the middle layer investors usually want most: the exact bill of materials, anode/cathode detail by line, cell-to-pack design choices, software/BMS boundaries, and the process-yield recipe that converts engineering into margin. So the chapter can map the stack conceptually, but it cannot prove every layer with the same granularity.",
