    {
      "id": "deployment-maturity-and-roadmap",
      "title": "Commercial maturity is real in UK and French plants, while the roadmap keeps widening toward new chemistries and storage formats",
      "body": "The public record supports a company in active industrial deployment rather than in lab-stage development. Nissan and Renault sources tie AESC output to specific vehicle programs, while multiple trade sources say Sunderland and Douai were in production by 2025. Companies House filings further support that the UK manufacturing entity is active and current. At the same time, roadmap claims are still expanding. The Gen6 NMC title points to 2026 production and a density gain, while the storage-cell portfolio extends from commercial 530Ah cells to a 700+Ah product promised for 2026. That widening roadmap is strategically attractive because it lets AESC pursue both EV and stationary-storage demand. It also raises execution questions. Supporting cylindrical OEM programs, next-generation NMC improvements, and large-format storage cells at once increases manufacturing complexity and capital requirements. The maturity verdict is therefore mixed but favorable: the platform is clearly beyond pilot stage, yet parts of the future product set remain roadmap-stage claims rather than fully disclosed commercial lines.",
