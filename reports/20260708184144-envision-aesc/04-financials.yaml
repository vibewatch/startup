    {
      "id": "financial-verdict-and-underwriting-blockers",
      "title": "The verdict is credible industrial scale, weak public monetization visibility, and unresolved margin risk",
      "body": "AESC's public financial profile is neither a blank slate nor an investable model. The company clearly has more substance than a slide-deck startup: live plants, active UK filings, lender-backed financing, and real OEM-linked demand anchors are all visible. At the same time, the underwriting blockers are the exact metrics equity investors usually need most. No reviewed official source discloses consolidated revenue, gross margin, cash on hand, burn rate, working-capital intensity, contract duration, or plant-level utilization. The South Carolina pause sharpens the downside interpretation because it shows that announced capex and customer linkage can still buckle under policy and market uncertainty. The most balanced conclusion is that AESC probably has enough institutional support to keep building, but not enough public disclosure to prove self-sustaining economics. That keeps the company in the category of a serious industrial asset platform whose value depends on whether externally financed capacity converts into visible revenue quality and acceptable returns rather than into merely larger fixed costs.",
