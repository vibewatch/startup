    {
      "id": "capital-stack-and-financing-dependency",
      "title": "The visible capital stack is large, layered, and still dependent on external financing",
      "body": "The clearest financial data in AESC's public file are not revenue numbers; they are capital tickets. The Sunderland buildout alone is framed as more than £1 billion of financing, with £680 million unlocked by public guarantees and the rest coming from private financing plus new equity. Standard Chartered separately quantified the package at GBP1.036 billion. Companies House filing histories add further texture by showing filed accounts, registered charges, satisfied charges, and fresh statements of capital in the UK structure. Outside the UK, the capital story stays large and conditional: South Carolina started as an $810 million project, then doubled through a further $810 million expansion before construction was paused, while PitchBook tags AESC's latest disclosed deal as $1.38 billion of project financing and TNW plus PE Insights say a Hong Kong IPO of up to $2 billion remains under consideration. Taken together, the picture is unmistakable. AESC is financing industrial scale-up with a mix of debt-like security arrangements, public guarantees, project finance, equity, and potentially public-market proceeds. That is not a sign of weakness by itself, but it does mean the company should still be analyzed as capital-hungry.",
