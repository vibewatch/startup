    {
      "id": "public-traction-is-plant-centric",
      "title": "Public traction is measured in plants, GWh, and filings rather than in sales or margins",
      "body": "AESC's strongest public traction indicators are industrial. Companies House shows active operating and holding entities in Sunderland with current accounts filings through March 2025, which is materially better evidence than a pure announcement vehicle. On the operating side, government, trade, and secondary reporting converge on meaningful traction at Sunderland: more than £1 billion of financing, a 15.8 GWh capacity anchor, production start in December 2025, and employment rising toward roughly 1,000 people. Douai adds a second proof point, with electrive and Battery-Tech treating the French site as a 2025 production launch tied to Renault demand. Even South Carolina, despite later trouble, contributes a traction signal because the original announcements and BMW-linked design work show the company can win large OEM-linked programs. The problem is that all of these are asset and throughput proxies. They indicate serious execution and capital deployment, but they still stop short of telling outsiders how much revenue is booked, what utilization is achieved, or how much margin survives after cells leave the line.",
