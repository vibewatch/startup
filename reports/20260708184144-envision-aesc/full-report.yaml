      - number: '3.3'
        title: Europe remains contestable, but the second tier keeps proving how hard battery scale really is
        blocks:
          - type: paragraph
            body: >-
              AESC's most credible competitive opening is Europe and adjacent localized manufacturing. That opening is
              real, but it is not clean. On the positive side, Verkor still presents as an active European builder, and
              PowerCo has moved from promise to production with the Salzgitter start. Those datapoints matter because
              they show the region is not reserved solely for Chinese imports or a single incumbent stack. At the same
              time, the adverse evidence is overwhelming: Northvolt publicly filed for Chapter 11, ACC abandoned
              second-wave projects in Germany and Italy, Battery-Tech used Morrow's bankruptcy as a case study in broken
              economics, Manufacturing Dive reported Freyr's Georgia cancellation, and Battery-News described Italvolt
              as at risk of failure. The pattern is not one isolated execution miss. It is a structural warning that
              Western cell manufacturing still burns capital faster than policy headlines imply. AESC therefore benefits
              from remaining one of the few non-public, multi-region battery platforms still standing, but it does so
              inside a field where many peers have already shown how quickly enthusiasm can outrun economics.
            claimRefs:
