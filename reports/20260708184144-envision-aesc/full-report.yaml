chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legacy, and control structure
        blocks:
          - type: paragraph
            body: >-
              Envision AESC still carries the DNA of the original Nissan-NEC battery venture, but the control story is
              now unmistakably different. Nissan's 2018 disposal announcement established that the battery business, its
              associated engineering operations, and plants in Japan, Sunderland, and Smyrna were sold to Envision
              Group, with Nissan retaining a minority equity stake rather than fully exiting. Later coverage and
              investor-oriented databases consistently describe AESC as China-controlled, GIC-backed, and still
              strategically linked to Nissan even after the change in ownership. The company itself now markets a
              broader identity than a captive automotive supplier: its current official website describes an 'AI Energy
              System Company' delivering batteries for both EVs and industrial-scale energy storage, with manufacturing
              spread across Asia, Europe, and North America. That evolution matters for diligence because it means AESC
              is no longer just a legacy Leaf battery asset. It is a large, industrial battery platform straddling
              Japanese operating heritage, Chinese control, Western factory expansion, and policy-sensitive supply
              chains.
