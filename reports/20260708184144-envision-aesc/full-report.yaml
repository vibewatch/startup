            body: >-
              The official AESC surface describes the company in deliberately broad terms: battery cells for electric
              vehicles plus industrial-scale energy systems. That positioning is supported by customer and trade
              sources. BMW, Nissan, and Renault announcements show the EV side, while the China Battery Industry article
              gives the clearest storage-side product detail, including 300+Ah, 500+Ah, 530Ah, and 700+Ah storage-cell
