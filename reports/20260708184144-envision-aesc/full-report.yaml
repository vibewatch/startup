      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Current recommendation is research-more, not because AESC lacks substance but because price support is
              incomplete
            body: >-
              The open web supports a real battery-manufacturing franchise. It does not yet support paying a premium
              private valuation with confidence.
            calloutType: recommendation
            claimRefs:
