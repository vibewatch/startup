      - number: '1.4'
        title: Risk signals and unresolved underwriting questions
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal in the current file is the June 2025 decision to pause construction at the
              South Carolina site. Across multiple local, trade, and public-radio reports, AESC attributed the halt to
              policy and market uncertainty, said more than $1 billion had already been invested, and insisted it still
              intended to meet its long-term commitment. That episode matters because it reveals how dependent the
              company is on incentive clarity, tariffs, EV demand, and customer timing when building out new capacity. A
              second uncertainty is valuation. Independent reports in 2026 describe AESC exploring a Hong Kong IPO that
              could raise up to $2 billion after earlier US listing ambitions became harder to execute amid
              foreign-entity-of-concern concerns. Yet those same stories do not give the market a clean, current equity
              valuation or enough detail on project debt, preference structure, or the exact size of Nissan's residual
              stake. Database profiles add useful color on management and possible revenue proxies, but they also
              conflict on corporate-office geography and should not be treated as audited truth. The underwriting
              takeaway is that AESC has credible industrial heft but only partial public transparency.
            claimRefs:
