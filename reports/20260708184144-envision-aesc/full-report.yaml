            body: >-
              AESC does not present a broad SMB-style customer roster. Instead, the public file points to a concentrated
              set of high-value buyers: automotive OEM programs in the UK, France, and the US, plus a growing set of
              grid-scale storage integrators. This is normal for a battery manufacturer, but it matters for underwriting
              because a few relationships likely drive a disproportionate share of strategic value. BMW, Nissan, and
              Renault are the clearest automotive anchors, while Prevalon, Nidec, Fluence, and Powin-style relationships
              define the storage side. The upside of this mix is account quality. These are not speculative logos; they
              are industrial customers or partners with real deployment stakes. The downside is concentration. AESC's
              public evidence remains much stronger on the strategic importance of a handful of accounts than on
              breadth, customer count, or churn resistance across a diversified book. That makes the company's customer
              quality look strong while leaving customer-portfolio resilience harder to test.
