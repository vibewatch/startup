companyProfile:
  summary: >-
    Envision AESC is a Japan-founded battery manufacturer now controlled by Envision Group, with legacy Nissan roots,
    named supply relevance to BMW and alliance-linked OEM programs, and an expanding EV-plus-storage product story.
    Public evidence confirms operating milestones in Sunderland and Douai plus substantial UK financing support, but
    also shows that the South Carolina expansion paused in 2025 because of policy and market uncertainty. The company
    therefore appears industrially real and strategically relevant while still being difficult to value cleanly from
    public information alone.
