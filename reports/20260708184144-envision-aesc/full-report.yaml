  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: batteries, not all transport electrification spend'
        blocks:
          - type: paragraph
            body: >-
              AESC's real market is not every dollar spent on electric mobility. The included spend is battery-cell,
              module, pack, and system value for passenger EVs, commercial EVs, and stationary storage systems that use
              similar manufacturing capabilities. Excluded spend includes raw-mining economics, full vehicle assembly,
              charging infrastructure, and downstream retail electricity services except where they directly change
              battery demand. The IEA's Global EV Outlook and Batteries and Secure Energy Transitions reports support
              that framing: they explicitly connect EV deployment to battery demand, treat charging infrastructure as an
              adjacent rather than identical market, and describe battery storage as a distinct but increasingly
              important power-sector market. AESC's own website also widens the lens beyond auto cells by marketing both
              EV batteries and industrial-scale energy-storage systems. This matters because the company should be
              analyzed as a battery-platform supplier to a few capital-intensive buyer segments, not as a generic
              climate-tech software company or a broad 'energy transition' proxy.
