      - number: '7.3'
        title: Dependency risk is concentrated in capital providers, anchor customers, and policy-backed plants
        blocks:
          - type: paragraph
            body: >-
              AESC's dependency map is unusually dense. On the financing side, Sunderland depends on guarantees and
              lender confidence, while the UK filing histories confirm the presence of charges and evolving capital
              structure. On the customer side, a few accounts and ecosystems likely matter disproportionately: BMW,
              Nissan, Renault, and a newer set of storage integrators such as Prevalon and Nidec. Those relationships
              help the company, but they also increase the damage of any single program disruption. Storage agreements
              widen the customer base, yet they introduce their own integrator and deployment risks because signed scope
              still has to convert into delivered volume and acceptable economics. The capex profile compounds the
              issue. AESC is not merely selling cells; it is continuously financing localized industrial assets whose
              economics can deteriorate if policy support or customer timing weakens. That is why the residual
              dependency risk remains high even though the company has more proof than many battery startups. The same
              evidence that makes AESC look real also makes it look exposed.
            claimRefs:
