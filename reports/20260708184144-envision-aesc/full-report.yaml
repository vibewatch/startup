      - number: '7.4'
        title: Mitigations exist, but the kill criteria are concrete and should be monitored explicitly
        blocks:
          - type: paragraph
            body: >-
              AESC does not lack mitigations. It has active customers, regulatory-grade financing support, product
              certifications, and multiple geographies rather than one single-asset bet. Those factors differentiate it
              from weaker peers. But the mitigation story is incomplete unless it is paired with explicit kill criteria.
              The clearest thesis-break events would be a prolonged inability to restart or replace South Carolina
              capacity, a material loss of U.S. incentive eligibility under FEOC-related rules, a financing shortfall
              that forces distress or highly dilutive capital, or evidence that storage agreements do not translate into
              repeat volume. Likewise, the absence of public recall or litigation data should be treated as a diligence
              prompt, not as proof of zero exposure. The right risk verdict is therefore balanced but cautious: AESC has
              real mitigations and still faces a multi-variable residual risk profile that must be actively monitored,
              not passively assumed away.
            claimRefs:
