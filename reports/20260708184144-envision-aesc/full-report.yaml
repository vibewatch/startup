              a regional auto supplier whose future depends on one Nissan legacy line. It is trying to operate a dual
              product stack in which EV programs require qualification, regional plants, and platform-specific formats,
              while storage products require cycle life, safety, energy efficiency, and partnerships with integrators.
              Public maturity signals are strongest where those product lines already map to real plants: Sunderland,
              Douai, and customer-tied OEM programs. The weaker area is exact product mix by plant, because the open web
