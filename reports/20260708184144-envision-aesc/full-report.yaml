  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline point to research-more rather than a premium-priced buy
        blocks:
          - type: paragraph
            body: >-
              AESC deserves a serious valuation discussion because the company is not a science project. Official and
              partner evidence shows real industrial milestones, named OEM relationships, and live European production
              starts. That matters. It means the downside case is not built on whether AESC exists or whether it can
              make cells at all. The problem is different: the public file does not expose the operating data an
              investor would need to confidently pay a premium private valuation today. Companies House helps on
              legal-entity visibility, and PitchBook plus IPO reporting help on financing context, but neither
              substitutes for audited consolidated revenue, margin, cash, leverage, or preference-stack detail. In
              practice that makes the call price-sensitive. At a materially lower entry or with audited disclosure, the
              case could migrate toward track. At a rumored double-digit-billion equity value, however, the evidence
              supports research-more with a high residual risk rating and a stretched valuation stance.
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV033
              - CV034
              - CV039
              - CV040
