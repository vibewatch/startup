      - number: '1.3'
        title: Milestones, customers, and operating signals
        blocks:
          - type: paragraph
            body: >-
              The chronology of AESC's recent milestones is not just a growth story; it is also the quickest way to see
              where confidence should rise and where it should fall. Positive signals include the Douai production
              launch for Renault, the Sunderland project-finance close, the Sunderland production start for the
              next-generation Nissan Leaf supply chain, and continued official sustainability claims such as 97%
              renewable electricity sourcing and full life-cycle-assessment coverage across products. The customer set
              is concentrated but high quality: BMW, Nissan, Renault, and related alliance programs anchor the public
              file. At the same time, AESC's operating profile remains expansion-heavy and policy-sensitive. The company
              is committing capital across multiple jurisdictions, using both government-backed debt and local
              subsidies, and depends on EV adoption plus industrial-policy continuity to absorb that capacity. That
              combination supports relevance and scale, but it also means milestone execution carries more underwriting
              weight than for software companies or lightly capitalized component suppliers.
