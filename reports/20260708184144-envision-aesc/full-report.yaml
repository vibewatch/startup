      - number: '8.3'
        title: Scenario ranges suggest upside exists, but the rumored top-end valuation needs better revenue and margin proof
        blocks:
          - type: paragraph
            body: >-
              The scenario exercise is less about forecasting one precise fair value than about bounding what would have
              to be true. The bear case assumes South Carolina remains stalled, policy access stays fragile, and
              European ramps fail to prove attractive utilization or economics. The base case assumes Sunderland and
              Douai continue to ramp, BMW and alliance-linked customer programs remain intact, and AESC secures capital
              without distress, but still does not earn a premium to the strongest public peers until disclosure
              improves. The bull case assumes audited operating performance proves multi-billion-scale revenue,
              acceptable margins, and a cleaner path to public-market readiness, which would make a top-end valuation
              discussion more credible. The key discipline point is simple: a $10 billion equity value can be reasonable
              only if AESC demonstrates a much stronger earnings base than the current public file exposes. Without
              that, the upside case remains possible but unproven.
            claimRefs:
              - CV018
              - CV021
              - CV024
              - CV027
