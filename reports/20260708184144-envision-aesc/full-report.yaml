      - number: '3.2'
        title: Rivals win through breadth, localization, and financial muscle more than public price sheets
        blocks:
          - type: paragraph
            body: >-
              Battery competition is unusually opaque on price and unusually transparent on industrial posture. Public
              sources say much more about announced GWh, plant sites, chemistry families, and customer programs than
              about realized ASPs or discount structures. That matters because buyers are not picking from a clean
              e-commerce catalog. They are choosing between supply chains that differ on cylindrical versus pouch
              emphasis, EV-only versus EV-plus-storage breadth, captive versus merchant orientation, and whether a
              supplier can credibly localize a plant for a named OEM. BYD is the clearest example of a non-comparable
              integrated rival: its group-level EV presence and Battery-Box storage line mean AESC is competing with a
              company whose battery business is embedded in a larger vehicle-and-energy platform. LG Energy Solution,
              Samsung SDI, and Panasonic are less vertically integrated than BYD but still bring public-market scale
              that AESC does not disclose. The result is a field where visible differentiation sits in scope,
              credibility, and capital access rather than in published price lists.
