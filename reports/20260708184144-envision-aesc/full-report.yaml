  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue exists as industrial program logic, but not as a disclosed income statement
        blocks:
          - type: paragraph
            body: >-
              The public record is good enough to explain how AESC should make money, but not good enough to prove how
              much money it already makes. Official and customer-facing sources place the company inside long-cycle
              battery supply programs for Nissan, Renault, BMW, and energy-storage use cases. That implies a revenue
              model where OEM qualification leads to multi-year cell shipments, plant utilization, and then gross profit
              once volume stabilizes. What the same public record does not provide is an audited or management-confirmed
              consolidated revenue line. Craft offers a FY2024 revenue figure, but it appears as database-style profile
              data rather than a clearly audited company disclosure, while AESC's own site does not publish revenue,
              EBITDA, or cash metrics. This leaves the chapter in an awkward but honest position: revenue is
              economically legible, yet financially opaque. Investors can trace the mechanism from plants to customers,
              but not the quality of monetization, price realization, or contribution margin that mechanism actually
              produces today.
