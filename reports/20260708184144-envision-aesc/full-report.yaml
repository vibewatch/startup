      - number: '7.2'
        title: Operational risk rises because AESC is scaling multiple plants and product lines simultaneously
        blocks:
          - type: paragraph
            body: >-
              AESC's operating footprint creates real industrial risk. South Carolina is the clearest example because a
              very large BMW-linked project moved from expansion story to pause signal once policy and market
              uncertainty changed. But the broader risk is not confined to one plant. AESC is trying to manage
              production ramps across Sunderland, Douai, legacy Japanese operations, Spain plans, and U.S. ambitions
              while also expanding from EV cells into large-format storage products. Public quality signals
              exist—certifications, sustainability metrics, zero-major-accident claims, AI-assisted quality control, and
              clean-room manufacturing—but those do not substitute for disclosed yield, scrap, warranty, or recall data.
              Sector history also matters. Northvolt and ACC show how battery projects can fail or retrench even after
              major backing, while PowerCo shows the opposite: successful rival execution can compress the room for
              error. AESC therefore faces a classic industrial-execution risk where plant timing, chemistry shifts,
              quality control, and local demand all need to line up at the same time.
            claimRefs:
              - CR008
              - CR009
              - CR015
              - CR016
