              - CV040
      - number: '8.4'
        title: The remaining diligence path is concrete, and thesis-break triggers are already visible in the open web
        blocks:
          - type: paragraph
            body: >-
              This is not a case where the next diligence step is vague. The missing items are explicit: audited
              consolidated revenue and margin, plant-level utilization and yield, debt and covenant detail, ownership
              and preference overhang, and program-level customer economics. Those are exactly the items that determine
              whether AESC is merely capital intensive or genuinely value accretive at scale. The open web already
              highlights the core downside trigger set. South Carolina showed that policy and market changes can halt a
              major plant; financing disclosures show that project execution is debt- and guarantee-sensitive; and
              public peers remind investors that serious valuation work normally sits on top of routine financial
              reporting. If management can close those evidence gaps, the recommendation can improve. If not, or if more
              policy or execution stress appears, the correct posture stays cautious and the thesis can break quickly.
              The remaining work is therefore operationally specific, not conceptually ambiguous.
            claimRefs:
              - CV008
              - CV010
              - CV033
              - CV037
              - CV038
              - CV041
