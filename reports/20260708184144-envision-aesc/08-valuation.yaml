  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "AESC is valuable enough to merit serious diligence, but the current public file supports a recommendation of research-more rather than a premium-priced buy. Official milestones, named OEM relationships, UK financing support, and live European ramps prove the company is industrially real. Yet the same file still lacks the audited consolidated revenue, margin, cash, debt, and cap-table detail needed to confidently underwrite rumored top-end valuation talk around $10 billion. Public listed peers suggest the revenue and disclosure bar for that kind of pricing is high. The right present-tense view is therefore cautious but not dismissive: AESC has strategic value and genuine upside, but valuation support remains incomplete until management closes the disclosure gap."
  },
  "sections": [
    {
      "id": "recommendation-and-price-discipline",
      "title": "Recommendation and price discipline point to research-more rather than a premium-priced buy",
      "body": "AESC deserves a serious valuation discussion because the company is not a science project. Official and partner evidence shows real industrial milestones, named OEM relationships, and live European production starts. That matters. It means the downside case is not built on whether AESC exists or whether it can make cells at all. The problem is different: the public file does not expose the operating data an investor would need to confidently pay a premium private valuation today. Companies House helps on legal-entity visibility, and PitchBook plus IPO reporting help on financing context, but neither substitutes for audited consolidated revenue, margin, cash, leverage, or preference-stack detail. In practice that makes the call price-sensitive. At a materially lower entry or with audited disclosure, the case could migrate toward track. At a rumored double-digit-billion equity value, however, the evidence supports research-more with a high residual risk rating and a stretched valuation stance.",
      "claimRefs": [
