    {
      "id": "public-anchors-and-disclosure-gap",
      "title": "Public valuation anchors exist, but they are financing and comp anchors more than direct AESC earnings proof",
      "body": "The most visible AESC valuation anchors are indirect. Publicly, outsiders can see the size of the South Carolina commitment, the UK financing package, the latest project-finance record, and the possibility of a Hong Kong IPO. They can also see that AESC has enough plant and customer proof to justify inclusion in a serious battery-manufacturing comparable set. What they cannot see is equally important. The retained public file still does not provide a clean consolidated revenue bridge, audited margin profile, or cap-table and preference picture. That is why public-market peers are useful here: they do not tell us what AESC is worth by themselves, but they show the revenue scale and disclosure standards investors typically rely on when pricing battery manufacturers. Panasonic and LG Energy Solution also illustrate a transparency gap, because their investor portals expose report and earnings pathways that are simply not available for AESC in equivalent depth. That difference matters because public batteries are usually priced with routine earnings, report, and balance-sheet reference points already in view.",
      "claimRefs": [
        "CV009",
