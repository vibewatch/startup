      - number: '3.3'
        title: 欧洲仍可争夺，但第二梯队不断证明电池规模化有多难
        blocks:
          - type: paragraph
            body: >-
              AESC 最可信的竞争切口，是欧洲及相邻本地化制造。这个切口真实存在，但并不干净。正面看，Verkor 仍呈现为活跃的欧洲建设者，PowerCo 也随着 Salzgitter
              投产从承诺走向生产。这些数据点很重要，因为它们说明该地区并非只留给中国进口或单一既有体系。与此同时，负面证据压倒性：Northvolt 公开申请 Chapter 11，ACC
              放弃德国和意大利的第二波项目，Battery-Tech 把 Morrow 破产作为经济性断裂案例，Manufacturing Dive 报道 Freyr 取消 Georgia 项目，Battery-News 称
              Italvolt 有失败风险。这不是一次孤立执行失误，而是一个结构性警告：西方电芯制造烧钱速度仍快过政策标题暗示。AESC
              因此受益于自己仍是少数尚存的非上市、多区域电池平台之一，但它所在的赛场已经有许多同行证明，热情多快会跑到经济性前面。
