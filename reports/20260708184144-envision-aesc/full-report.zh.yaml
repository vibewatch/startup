      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 政策准入本身就是商业模式的一部分
            body: AESC 在美国的经济性不只取决于能否生产电芯，还取决于合规和资格。因此，FEOC 与税收抵免规则是一线投资风险。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR028
              - CR029
          - type: callout
            title: 南卡罗来纳暂停是最有用的压力测试
            body: 即便战略理由看起来成立，客户验证、资本开支和政策也可能一起失灵，南卡罗来纳已经说明这一点。
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR034
          - type: callout
            title: 评估缓释之后的残余风险，不要孤立看总风险
            body: AESC 确实有缓释项，但只有持续跟踪政策、融资、客户范围和工厂执行，才能支撑投资确信。
            calloutType: recommendation
