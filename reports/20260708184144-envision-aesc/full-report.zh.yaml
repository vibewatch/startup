  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和地缘政治风险是一阶风险，因为补贴资格会改变客户经济性
        blocks:
          - type: paragraph
            body: >-
              对 AESC 来说，政策不是背景噪音，而是产品市场匹配的一部分。Treasury、DOE、IRS 以及关于 FEOC 和清洁车辆抵免的法律文本显示，美国 EV
              电池经济性现在取决于持续合规、可追溯性和所有权敏感规则。这对 AESC 比对普通供应商更重要，因为公司正处在投资者最担心的灰色地带：一家总部在日本、由中国母公司控制、同时供应美国相关项目的电池制造商。TNW
              关于香港 IPO 的报道从另一个角度提出同一点，明确把上市地点选择与地缘政治和 FEOC
              式担忧相连。欧洲和英国不是缓解，而是叠加更多层。欧洲电池框架和英国电池战略都释放信号：产业政策、可持续性和电池监管会继续成为活跃合规负担。结果是一种风险姿态：即使底层电芯按设计工作，法律或政策变化也能直接传导到客户资格、融资意愿和估值。
