      - number: '5.3'
        title: 英国和法国工厂的商业成熟度真实存在，路线图则继续向新化学体系和储能形态扩宽
        blocks:
          - type: paragraph
            body: >-
              公开记录支持这样一个判断：公司处在主动工业部署阶段，而不是实验室阶段。Nissan 和 Renault 来源把 AESC 产出绑定到具体车型项目，多家行业来源称 Sunderland 和 Douai 到 2025
              年已经投产。Companies House 备案进一步支撑英国制造实体活跃且保持更新。与此同时，路线图主张仍在扩张。Gen6 NMC 标题指向 2026 年生产和密度提升，储能电芯组合则从商业化 530Ah
              电芯延伸到承诺 2026 年推出的 700+Ah 产品。路线图扩宽在战略上有吸引力，因为它让 AESC 同时追逐 EV 和固定式储能需求。但它也抬高执行问题。同时支持圆柱 OEM 项目、下一代 NMC
              改进和大规格储能电芯，会增加制造复杂度和资本需求。因此，成熟度判断是混合但偏正面：平台显然已过试点阶段，但未来产品组合的一部分仍是路线图主张，而不是完全披露的商业产线。
