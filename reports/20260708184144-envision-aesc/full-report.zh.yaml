      - number: '5.2'
        title: 从化学体系到本地化生产，架构两端可见；中间栈仍部分不透明
        blocks:
          - type: paragraph
            body: >-
              公开来源更能揭示 AESC 架构的两端，而不是中间。前端，BMW 和 InsideEVs 展示了下一代圆柱项目，并给出明确性能主张；Nikkan Jidosha Shimbun 指向 Gen6 NMC
              路线图，能量密度更高、封装更小。储能侧，CBEA 提供了异常具体的规格：530Ah 电芯，每颗超过 1.6 kWh、12,000 次循环、95% 效率，背后还有更大的 700+Ah
              路线图。后端也相对可见。Evertiq 强调 Sunderland
              的洁净室生产，公司公开站点和客户发布显示，本地化制造与车辆项目绑定。难看清的是投资者通常最想要的中间层：精确物料清单、各产线正负极细节、cell-to-pack 设计选择、软件 / BMS
              边界，以及把工程转成利润率的工艺良率配方。因此，本章可以概念性勾勒技术栈，但不能以同等颗粒度证明每一层。
