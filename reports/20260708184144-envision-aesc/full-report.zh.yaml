      - number: '1.2'
        title: 资本基础、产能足迹与工业扩张
        blocks:
          - type: paragraph
            body: >-
              AESC 的公开足迹扩张速度远快于公开披露。英国和 South Carolina 官方公告、BMW
              合作方发布、独立行业报道合在一起，显示公司正围绕锚定客户并行建设区域供应链。英国故事最清晰：政府、National Wealth Fund 和商业银行在 2025 年 5 月披露了超过 £1 billion 的
              Sunderland 融资包；随后 AESC 和行业媒体又把该基地描述为 15.8 GWh 工厂，计划每年为约 100,000 辆 EV 供电。在美国，BMW 宣布 South Carolina
              电芯合作，绑定其第六代圆柱电芯；South Carolina 官员后来又把 Florence 项目从 $810 million、1,170 个岗位扩大到总计 $1.62 billion、1,620
              个岗位的已宣布规模。在欧洲大陆，Douai 于 2025 年为 Renault 项目投产，西班牙则在 2024 年破土，AESC
              的欧洲网络再次扩宽。结果是一套真实的多洲制造平台，但其经济性仍主要靠项目公告来理解，而不是靠合并报表。
