      - number: '2.3'
        title: 增长驱动强劲，但集中度和价格压力比标题 TAM 暗示的更重
        blocks:
          - type: paragraph
            body: >-
              市场背景在方向上有利。IEA 继续把电动汽车部署、电池需求和充电建设视为长周期增长领域，其电池报告还强调，固定式储能是电力部门增长最快的清洁能源技术。但利润池比需求曲线难得多。Electrive 基于 SNE 的
              2025 年份额数据表明，CATL 和 BYD 合计控制全球 EV 电池产出超过一半；CarNewsChina 基于 CPCA 的报道则显示，2026 年初 CATL 在中国国内市场份额超过 50%。The
              Investor 对 LFP 的报道把压力讲得更直接：这一化学体系增长快于 NCM，韩国挑战者认为美国和欧盟贸易规则有帮助，但仍承认与中国竞争时价格竞争力是核心障碍。对 AESC
              来说，机会真实存在，但要赢，必须成为少数能在合适司法辖区组合本地工厂、可信 OEM 关系和可融资成本曲线的非中国背景供应商之一。
