      - number: '3.2'
        title: 对手更多靠广度、本地化和财务肌肉取胜，而不是靠公开价目表
        blocks:
          - type: paragraph
            body: >-
              电池竞争在价格上异常不透明，在工业姿态上却异常透明。公开来源谈得更多的是已宣布 GWh、工厂地点、化学体系家族和客户项目，而不是已实现 ASP
              或折扣结构。这很重要，因为买方不是在一个干净的电商目录里挑货。它们是在不同供应链之间选择：圆柱与软包侧重点不同，EV 单一与 EV + 储能广度不同，内部配套与商用供应取向不同，供应商能否为具名 OEM
              可信地本地化一座工厂也不同。BYD 是最清晰的不可直接比较的整合型对手：集团级 EV 存在感和 Battery-Box 储能线意味着，AESC 竞争的是一家电池业务嵌在更大汽车和能源平台里的公司。LG
              Energy Solution、Samsung SDI 和 Panasonic 垂直整合程度低于 BYD，但仍带来 AESC
              未披露的公开市场规模。结果是，一个差异化更体现在范围、可信度和资本可得性，而不是已发布价格清单的赛场。
