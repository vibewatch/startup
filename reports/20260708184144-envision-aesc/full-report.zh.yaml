        title: 里程碑、客户与运营信号
        blocks:
          - type: paragraph
            body: >-
              AESC 近期里程碑的时间线不只是增长故事，也是判断哪里该提高信心、哪里该降低信心的最快路径。正面信号包括 Renault 的 Douai 投产、Sunderland 项目融资交割、面向下一代 Nissan
              Leaf 供应链的 Sunderland 投产，以及公司持续发布的官方可持续性主张，例如 97% 可再生电力采购和全产品生命周期评估覆盖。客户组合集中但质量高：BMW、Nissan、Renault
              及联盟项目构成公开材料的锚点。与此同时，AESC 的运营画像仍是重扩张、强政策敏感。公司正在多个司法辖区投放资本，使用政府背书债务和地方补贴，并依赖 EV
              普及和产业政策连续性来消化产能。这个组合支撑重要性和规模，但也意味着里程碑执行在尽调中的权重，比软件公司或轻资本零部件供应商更高。
