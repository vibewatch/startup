      - number: '8.3'
        title: 情景区间显示仍有上行空间，但传闻中的顶端估值需要更强的收入和利润率证明
        blocks:
          - type: paragraph
            body: >-
              做情景测算，不是为了预测一个精确公允价值，而是圈定哪些条件必须成立。熊市情景假设南卡罗来纳继续停滞，政策准入仍然脆弱，欧洲爬坡无法证明有吸引力的利用率或经济性。基准情景假设 Sunderland 和 Douai
              继续爬坡，BMW 及联盟绑定客户项目保持完整，AESC
              能在不陷入困境的情况下拿到资本；但在披露改善前，公司仍不能相对最强的上市同行获得溢价。牛市情景假设，经审计经营表现证明收入达到数十亿美元规模、利润率可接受，并且通往公开市场准备状态的路径更清晰，从而让顶端估值讨论更可信。关键价格纪律很简单：只有
              AESC 证明其盈利基础远强于当前公开材料披露的水平，$10B 股权价值才可能合理。否则，上行情景仍然可能存在，但证据还没坐实。
