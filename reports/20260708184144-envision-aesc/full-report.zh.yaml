        title: 可见资本栈庞大、分层，并且仍依赖外部融资
        blocks:
          - type: paragraph
            body: >-
              AESC 公开材料里最清晰的财务数据不是收入数字，而是资本票据。仅 Sunderland 建设就被描述为超过 £1 billion 融资，其中 £680 million
              由公共担保释放，其余来自私人融资加新增股本。Standard Chartered 另行把该融资包量化为 GBP1.036 billion。Companies House
              的备案历史进一步补充了英国结构中的已提交账目、已登记押记、已清偿押记和新的股本声明。英国之外，资本故事仍大而有条件：South Carolina 从 $810 million 项目起步，随后又通过另一轮 $810
              million 扩张翻倍，之后建设暂停；PitchBook 标记 AESC 最新披露交易为 $1.38 billion 项目融资，TNW 和 PE Insights 则称最多 $2 billion 的香港 IPO
              仍在考虑中。合在一起，图景非常清楚。AESC 正用类债务担保安排、公共担保、项目融资、股权，以及潜在公开市场资金的组合为工业规模化融资。这本身不是弱点，但确实意味着公司仍应被视为资本饥渴型。
