  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手 / 原型
      - 类别
      - 公开规模锚点
      - 目标细分
      - 差异化信号
      - 相比 AESC 的当前局限
    rows:
      - - AESC
        - 后期未上市、多区域电池供应商
        - 私有公司；公开融资记录远小于已上市亚洲同行
        - OEM EV 电池加 ESS 邻近业务
        - 在英国、法国、日本、西班牙，以及选择性美国项目中建立本地供本地足迹
        - 南卡罗来纳州执行暂停，且运营经济性未披露，耐久性难以支撑投资判断
      - - CATL
        - 全球既有独立供应商
        - 2025 年全球 EV 电池份额 38.5%
        - 全球 EV 与储能供应
        - 规模、化学体系深度与全球市场领导姿态
        - 政治和贸易敏感度可能让部分 OEM 寻找替代方
      - - BYD
        - 垂直整合的汽车与电池既有玩家
        - 2025 年全球 EV 电池份额 16.7%；市值约 $117.82B
        - 自有 EV 需求加外部储能与电池生态
        - 整车集成加 Battery-Box 储能广度
        - 相比多元化电芯专家，作为第三方中立供应商不够纯粹
      - - LG Energy Solution、Samsung SDI 与 Panasonic
        - 有规模的已上市亚洲挑战者
        - 市值约 $49.00B / $9.63B / $62.24B
        - 全球 OEM 电池供应
        - 公开市场规模与广泛技术可信度
        - 更多区域推进电池供应本地化，仅靠本地属性的差异化变弱
      - - PowerCo
        - OEM 背书的欧洲电芯建设方
        - Salzgitter 已投产；一期 20 GWh，可扩至 40 GWh
        - Volkswagen 生态与欧洲供应链
        - 有 OEM 需求支撑，且已进入实际生产
        - 相比成熟亚洲既有厂商，工业爬坡仍处早期
      - - ACC / Verkor
        - 聚焦欧洲汽车的电芯建设方
        - 公开定位为欧洲电芯冠军，但执行结果分化
        - 欧洲 OEM 与工业需求
        - 本地政治匹配与欧洲身份
        - ACC 后撤暴露执行风险；Verkor 规模仍低于公开亚洲领导者
      - - Northvolt / Morrow / Freyr / Italvolt
        - 承压或收缩的替代方
        - 第 11 章破产保护、破产、取消或失败风险信号
        - 政策支持的西方电池本地化
        - 说明市场需要亚洲既有厂商之外的替代方
        - 也说明规模到来前，资本强度足以摧毁潜在护城河
    notes: 这张表同时纳入直接巨头、OEM 支持的建设者、欧洲挑战者和承压替代方，因为它们都会影响买方选择和 AESC 的战略空间。
