  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：电池，不是所有交通电气化支出
        blocks:
          - type: paragraph
            body: >-
              AESC 的真实市场不是电动出行的每一美元支出。纳入范围的是乘用 EV、商用 EV
              和固定式储能系统里的电芯、模组、电池包和系统价值，这些产品使用相近的制造能力。排除范围包括原始矿采经济性、整车装配、充电基础设施，以及下游零售电力服务，除非它们直接改变电池需求。IEA 的 Global EV
              Outlook、Batteries and Secure Energy Transitions 报告支持这种划分：它们明确把 EV
              部署与电池需求相连，把充电基础设施视为相邻而非同一市场，并把电池储能描述成一个独立但越来越重要的电力部门市场。AESC 自己的网站也通过同时营销 EV
              电池和工业级储能系统，把视角从汽车电芯扩宽。关键在于，公司应被分析为一个面向少数重资本买方细分市场的电池平台供应商，而不是泛气候科技软件公司或宽泛的“能源转型”代理标的。
