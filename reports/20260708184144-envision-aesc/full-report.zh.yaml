  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 商业变量
      - 公开来源显示什么
      - 仍不清楚什么
      - 为什么重要
      - 竞争含义
    rows:
      - - 实际 ASP
        - 几乎没有审阅来源披露电池 ASP 或折扣表
        - 按化学体系、区域或客户拆分的项目级定价
        - 价格是核心利润率变量
        - 不能假设 AESC 比已上市竞争对手更便宜，或定价结构更好
      - - 客户专属供应项目
        - BMW-AESC 与 VW-PowerCo 案例显示与指定平台绑定
        - 确切的照付不议条款与期限
        - 项目一旦通过认证，就会制造切换成本
        - 拥有更多指定项目的既有厂商更能守住产能利用率
      - - 化学体系 / 形态姿态
        - 公开来源强调 LFP 压力、圆柱项目和 ESS 广度
        - 按化学体系和电池包架构加权的经济性
        - 形态和化学体系影响成本曲线与买方匹配度
        - AESC 必须证明买方偏好变化后仍能保持相关性
      - - 本地化模型
        - 公开页面和项目新闻强调按国家布点的工厂
        - 本地工厂达到规模后是否真正有成本竞争力
        - 采购准入往往需要本地化
        - PowerCo 和其他区域建设者削弱 AESC 的独特性
      - - 资产负债表支持
        - 市值快照显示已上市同行有庞大融资蓄水池
        - 各工厂的手头现金与项目融资细节
        - 需求到来前，电池制造就可能失败
        - 规模型同行能在下行周期中比弱势进入者撑得更久
    notes: 这张表刻意强调可见度：公开证据更能说明工业姿态，而不是价目表或合同包装。
