  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入有工业项目逻辑，但没有披露的损益表
        blocks:
          - type: paragraph
            body: >-
              公开记录足以解释 AESC 应该如何赚钱，但不足以证明它已经赚了多少钱。官方和面向客户的来源把公司放进 Nissan、Renault、BMW 和储能应用的长周期电池供应项目中。这意味着一种收入模型：OEM
              认证带来多年电芯出货、工厂利用率，等产量稳定后再产生毛利。同一套公开记录没有提供经审计或管理层确认的合并收入线。Craft 给出了 FY2024 收入数字，但它更像数据库式资料，而非清楚的经审计公司披露；AESC
              自己的网站也不发布收入、EBITDA 或现金指标。这让本章处在一个尴尬但诚实的位置：收入在经济逻辑上可读，在财务上却不透明。投资者能从工厂追到客户，却看不到这套机制今天实际产出的变现质量、价格实现或贡献利润率。
