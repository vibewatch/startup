  - id: TV005
    title: 推翻论点与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 传导到论点
      - 行动含义
    rows:
      - - 南卡继续停滞
        - 没有可信的复工、替代方案或客户产量回补
        - 削弱美国本地化上行空间，并放大搁浅资本开支担忧
        - 转为回避，或下调下行情景
      - - 政策资格走弱
        - 关键项目的 FEOC / 税收抵免准入明显恶化
        - 伤害客户经济性，也削弱公开市场叙事
        - 下调估值区间，并加深监管尽调
      - - 融资收紧
        - 再融资承压、惩罚性条款或沉重优先权包袱的证据
        - 上行空间从增长转向资产负债表修复
        - 没有完整资本结构透明度，就不要按溢价出资
      - - 欧洲爬坡不及预期
        - Sunderland / Douai 利用率、良率偏弱，或存量客户拉动不足
        - 打破基准情景：在产工厂能转成经济性验证的假设
        - 下调建议，并压缩基准情景区间
    notes: 每个触发项都可用公司披露、工厂更新、融资文件和客户项目信号来监控。
    claimRefs:
      - CV036
      - CV037
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 合并财务
        - 按主要实体或集团口径披露的经审计收入、毛利率、EBITDA、资本开支、债务和现金
        - 没有真实经营盈利底盘，就无法干净承销公允价值
        - 管理层 + 审计师材料包
      - - 资本结构 / 所有权
        - 当前股权结构、Nissan 剩余持股、优先权、项目债、担保和契约
        - 决定稀释风险、控制权和下行回收
        - 财务团队 + 法律尽调
      - - 工厂经济性
        - Sunderland、Douai、日本存量产能以及任何暂停的美国资产：利用率、良率、报废率和客户分配
        - 把工业化验证转成估值验证
        - 运营尽调 + 数据室
      - - 客户经济性
        - 项目期限、照付不议 / 产量承诺、价格重置条款，以及按客户划分的集中度
        - 判断收入和利润率持续性所必需
        - 商业尽调 + 合同审阅
      - - 政策 / 资格地图
        - 逐设施梳理对类似 FEOC 规则和地方补贴制度的敞口
        - 决定本地化上行空间能否融资、能否复制
        - 监管尽调 + 外部律师
    notes: 这些要求刻意收窄，直接服务交易；每一项都会实质影响估值置信度。
    claimRefs:
      - CV010
      - CV033
      - CV037
      - CV038
      - CV041
