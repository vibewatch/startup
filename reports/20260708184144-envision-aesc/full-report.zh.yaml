      - number: '2.4'
        title: 证据受限的规模测算：AESC 的 SAM 是围绕其足迹的本地化电池需求切片
        blocks:
          - type: paragraph
            body: >-
              公开来源没有给出一个干净的 AESC 可服务市场数字，因此最好的框架不是一个标题 TAM，而是分层测算。最宽一层是全球 EV 和储能电池需求，IEA
              和市场份额数据都显示其快速上升。下一层是车企和政府希望获得附近、合格供应的本地化市场：欧洲、英国、日本和部分北美项目。最窄一层，是 AESC
              通过具名客户、运营工厂或推进较深的建设项目真正能够触达的部分。这个可触达切片远小于全球电池需求，但更可投资，因为它映射到 BMW、Nissan、Renault 和 ESS
              相邻机会，公司可以较可信地变现既有或近端资产。主要尽调难点不是证明电池市场很大，而是测试 AESC 的本地化工厂能否保持足够成本竞争力，在政策或客户变化侵蚀优势之前，拿到可持续利用率和利润率。
