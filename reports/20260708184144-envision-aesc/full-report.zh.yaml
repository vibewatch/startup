  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律指向继续研究，而不是高价买入
        blocks:
          - type: paragraph
            body: >-
              AESC 值得认真讨论估值，因为它不是一个科学项目。官方和合作伙伴证据已经显示真实的产业里程碑、具名 OEM 关系，以及欧洲投产启动。这一点很重要。下行情景不是在质疑 AESC
              是否存在，或它到底能不能生产电芯。问题在另一处：公开材料没有披露投资者今天要有信心支付高溢价私募估值所需的经营数据。Companies House 能提供法律实体可见度，PitchBook 和 IPO
              报道能补上融资背景，但都无法替代经审计的合并收入、利润率、现金、杠杆或优先权结构细节。实际判断因此高度依赖价格。如果入场价格大幅降低，或公司拿出经审计披露，项目可能转向跟踪。但在传闻中百亿美元级股权价值下，现有证据更支持继续研究，并给出高残余风险评级和估值偏高判断。
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV033
              - CV034
              - CV039
              - CV040
