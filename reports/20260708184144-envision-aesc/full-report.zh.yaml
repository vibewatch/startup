      - number: '8.4'
        title: 剩余尽调路径很具体，投资论点破裂触发因素已经在公开网络中可见
        blocks:
          - type: paragraph
            body: >-
              这不是一个下一步尽调模糊的项目。缺口已经很明确：经审计的合并收入和利润率、工厂级利用率和良率、债务及契约细节、所有权与优先权负担，以及项目级客户经济性。这些项目恰好决定 AESC
              只是资本密集，还是能在规模化后真正增值。公开网络已经标出核心下行触发因素。南卡罗来纳说明，政策和市场变化可以叫停一座大型工厂；融资披露说明，项目执行对债务和担保高度敏感；上市同行则提醒投资者，严肃估值通常建立在常规财务报告之上。管理层若能补齐这些证据缺口，建议可以改善。否则，或者一旦出现更多政策或执行压力，正确姿态仍是谨慎，投资论点也可能很快破裂。因此，剩余工作是经营层面的具体核验，不是概念上的模糊问题。
