      - number: '3.4'
        title: 本地化帮助 AESC，但只有利用率和政策韧性跟上，它才算护城河
        blocks:
          - type: paragraph
            body: >-
              AESC 最好的论点，是电池采购仍有真实切换成本。BMW 将 South Carolina 电芯绑定到特定 Spartanburg EV
              项目的公告显示，一旦认证、工业规划和激励对齐，供应就能锁进本地平台。AESC 自己的网站也明确表明，公司试图同时覆盖 EV 和储能场景，而不是做单一基地供应商。但护城河结论仍偏薄。BMWBLOG 关于 South
              Carolina 暂停的报道显示，政策和关税变化能多快削弱一座本地化工厂；匈牙利和更广泛欧洲报道则显示，韩国和中国对手仍在挤进同一套区域逻辑。换句话说，AESC 的本地化战略是必要项，但已经不再独特。公司在
              OEM 需要合格本地伙伴、且最大既有巨头在政治或商业上不够理想的地方仍有竞争力。公开证据还不足以显示足够的价格可见性、利用率确定性或资产负债表优势，来把这一位置称为可持续。
