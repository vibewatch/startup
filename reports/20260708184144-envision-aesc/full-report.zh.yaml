    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、历史遗产与控制结构
        blocks:
          - type: paragraph
            body: >-
              Envision AESC 仍带着最初 Nissan-NEC 电池合资公司的 DNA，但控制权故事已经完全换了方向。Nissan 2018
              年的出售公告确认，电池业务、配套工程运营，以及日本、Sunderland、Smyrna 工厂都出售给 Envision Group；Nissan 保留少数股权，而不是完全退出。后续报道和投资者数据库一致把
              AESC 描述为中国控制、GIC 支持，并且在所有权变更后仍与 Nissan 保持战略联系。公司现在对外呈现的身份也不再只是车企内部供应商：其当前官网称自己是 「AI Energy System
              Company」，为 EV 和工业级储能提供电池，制造布局覆盖亚洲、欧洲和北美。这一演变对尽调很重要，因为 AESC 已不只是老 Leaf
              电池资产。它已变成一个大型工业电池平台，横跨日本运营遗产、中国控制、西方工厂扩张和受政策影响很深的供应链。
