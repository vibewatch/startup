        title: 对标组从规模龙头开始，而不是从其他后期私营挑战者开始
        blocks:
          - type: paragraph
            body: >-
              尽调 AESC 的第一个错误，是只拿它和其他风投支持的电池希望者比较。公开市场份额和公司官方来源显示，真正的参照组从 CATL、BYD、LG Energy Solution、Samsung SDI 和
              Panasonic Energy 开始。这些玩家并不等同，但共享电池竞争里最重要的特征：化学体系广度、庞大资产负债表、制造深度，以及足以把产能公告转成实际采购权力的客户触达。Electrive 对 SNE
              Research 的摘要和 CarNewsChina 对中国份额的报道说明，品类仍高度集中在 CATL 和 BYD 周围。官方公司页面随后把视角从纯份额拉宽：LG Energy Solution、Samsung
              SDI、Panasonic 和 BYD 都在营销更宽的能源或汽车电池生态，而不是一次性的区域工厂。对 AESC
              来说，核心竞争问题不是它是否强于一家早期欧洲初创公司，而是一个披露资金有限的本地化、多区域供应商，能否在已经塑造成本曲线和客户短名单的上市巨头身边切出可持续空间。
