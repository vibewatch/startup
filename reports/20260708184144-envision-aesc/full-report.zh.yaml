      - number: '2.2'
        title: 买方集中，采购越来越本地化
        blocks:
          - type: paragraph
            body: >-
              买方地图异常集中。现实中，电池需求由车企、平台采购团队、电池包装配运营，以及储能侧的公用事业或商业集成商拉动。AESC 的公开证据把这一点展示得很清楚：BMW 将 South Carolina 电芯绑定到第六代
              EV 平台，Nissan 将 Sunderland 电池连接到下一代 Leaf 和 EV36Zero，Renault 的 Douai 生态则锚定法国需求。因此，一个简单的全球 TAM 会误导对 AESC
              的判断。公司竞争的场域是区域化供应链，客户认证、补贴资格、关税待遇、物流和政治可接受性，与化学体系和成本同样重要。因此，市场奖励能把产能本地化到 OEM
              需求附近、满足贸易规则测试、并在收入到来前为电池超级工厂融资的供应商。AESC 在英国、法国、西班牙、日本和美国的足迹让它切入这一地方化市场，但也让它暴露在多重监管制度和客户集中点之下。
