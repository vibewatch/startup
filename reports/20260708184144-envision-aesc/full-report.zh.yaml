  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: AESC 现在呈现为 EV 与储能电池平台，而不是单一老汽车项目
        blocks:
          - type: paragraph
            body: >-
              AESC 官方界面有意把公司描述得很宽：面向电动汽车的电芯，加上工业级能源系统。客户和行业来源支撑这一定位。BMW、Nissan 和 Renault 公告展示 EV
              侧，中国电池工业文章则给出最清晰的储能侧产品细节，包括 300+Ah、500+Ah、530Ah 和 700+Ah 储能电芯家族。这一点很重要，因为它改变了技术尽调方式。AESC
              不只是一个区域汽车供应商，未来押在一条 Nissan 遗留产线上。它试图运营双产品栈：EV
              项目需要认证、区域工厂和平台特定形态；储能产品需要循环寿命、安全、能效以及与集成商合作。公开成熟度信号在这些产品线已经映射到真实工厂的地方最强：Sunderland、Douai 以及绑定客户的 OEM
              项目。较弱的地方是各工厂的精确产品组合，因为公开网络仍没有清楚揭示每个基地由哪种化学体系、形态或电芯家族主导。
