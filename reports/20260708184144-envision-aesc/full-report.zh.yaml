        title: 信任和质量信号有意义，但公开工艺透明度仍是技术弱点
        blocks:
          - type: paragraph
            body: >-
              AESC 的公开信任叙事比许多私营制造商的营销更具体。可持续发展页面给出可再生电力和 LCA 覆盖指标；CBEA 文章列出一长串中国、日本、美国和 IEC 认证；CBEA 与较早 EV
              项目报道都强调安全叙事，而不只讲能量密度。储能电芯报道尤其有用，因为它把性能主张与安全框架、AI 辅助质量控制和零重大事故记录配在一起。即使员工培训也能成为尽调信号：AESC 不是一家有 GitHub
              轨迹的软件公司，因此 National Battery Training & Skills Academy
              可以作为运营电池超级工厂所需技能基础的从业者社区代理指标。尽管如此，最大的产品技术风险不是没有证据，而是证据不均。公开披露很少谈专利、专有工艺步骤、良率、召回或各工厂的精确化学体系分配。再叠加全行业向 LFP
              转移带来的市场压力，AESC 的技术看起来可信且商业化，但工艺护城河仍不如制造足迹清晰。
