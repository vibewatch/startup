        title: 结论是工业规模可信、公开变现可见性弱、利润率风险未解
        blocks:
          - type: paragraph
            body: >-
              AESC 的公开财务画像既不是白纸，也还不是可投资模型。公司显然比幻灯片初创企业更有实质：在运工厂、活跃英国备案、有贷款方支持的融资，以及真实 OEM
              需求锚点都可见。与此同时，尽调障碍正是股权投资者通常最需要的指标。已审阅官方来源没有披露合并收入、毛利率、手头现金、烧钱速度、营运资本强度、合同期限或工厂级利用率。South Carolina
              暂停加重了下行解读，因为它说明已宣布资本开支和客户连接仍可能在政策和市场不确定性下弯折。最平衡的结论是，AESC
              可能有足够机构支持继续建设，但公开披露不足以证明自我维持的经济性。公司因此属于严肃工业资产平台，其价值取决于外部融资产能能否转化为可见收入质量和可接受回报，而不是只转化为更大的固定成本。
