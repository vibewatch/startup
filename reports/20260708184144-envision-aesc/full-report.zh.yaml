      - number: '1.4'
        title: 风险信号与未解决的尽调问题
        blocks:
          - type: paragraph
            body: >-
              当前材料里最清晰的负面信号，是 2025 年 6 月暂停 South Carolina 工地建设。多家地方媒体、行业媒体和公共广播报道中，AESC 把停工归因于政策和市场不确定性，称已投入超过 $1
              billion，并坚持仍打算履行长期承诺。这一事件很关键，因为它暴露出公司建设新产能时，对激励明确性、关税、EV 需求和客户节奏有多依赖。第二个不确定性是估值。2026 年的独立报道称，AESC 正探索香港
              IPO，最多可融资 $2 billion；此前美国上市计划因受关注外国实体（FEOC）担忧而更难推进。但同样的报道没有给市场一个干净、当前的股权估值，也没有提供足够的项目债务、优先结构或 Nissan
              剩余持股具体规模细节。数据库资料能补充管理层和可能收入代理指标，但在公司办公地点地理上也有冲突，不能当作审计事实。尽调结论是：AESC 有可信的工业分量，但公开透明度仍只是部分透明。
