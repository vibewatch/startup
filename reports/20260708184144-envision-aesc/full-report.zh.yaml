      - number: '4.2'
        title: 公开牵引力看工厂、GWh 和文件，而不是销售额或利润率
        blocks:
          - type: paragraph
            body: >-
              AESC 最强的公开牵引指标是工业指标。Companies House 显示 Sunderland 有活跃运营和控股实体，账目文件更新到 2025 年 3
              月，这比纯公告载体强得多。运营侧，政府、行业和二级报道都指向 Sunderland 的实质进展：超过 £1 billion 融资、15.8 GWh 产能锚点、2025 年 12 月投产，以及就业向约 1,000
              人爬升。Douai 提供第二个证明点，electrive 和 Battery-Tech 都把法国基地视为 2025 年投产，并绑定 Renault 需求。South Carolina
              虽然后来出问题，也贡献了牵引信号，因为原始公告和 BMW 绑定设计工作显示，公司能拿下大型 OEM
              关联项目。问题在于，这些都是资产和吞吐量代理指标。它们指向严肃执行和资本部署，但仍没有告诉外部人已确认多少收入、实现了多少利用率，或电芯下线后留下多少利润率。
