      - number: '8.2'
        title: 公开估值锚点存在，但更多是融资和可比公司锚点，不是 AESC 盈利的直接证明
        blocks:
          - type: paragraph
            body: >-
              AESC 最显眼的估值锚点是间接的。公开层面，外部投资者能看到南卡罗来纳承诺规模、英国融资包、最新项目融资记录，以及香港 IPO 的可能性；也能看到 AESC
              已有足够的工厂和客户验证，可以放进严肃的电池制造可比公司组。看不到的部分同样重要。现有公开材料仍没有给出清晰的合并收入桥、经审计利润率画像、股权结构和优先权图谱。所以上市可比公司在这里有用：它们不能单独告诉我们
              AESC 值多少钱，但能显示投资者给电池制造商定价时通常依赖的收入规模和披露标准。Panasonic 和 LG Energy Solution 也暴露出透明度差距，因为它们的投资者门户提供报告和业绩入口，而
              AESC 没有等同深度的公开资料。这个差异很关键，因为上市电池企业定价时，常规业绩、报告和资产负债表参考点通常已经摆在台面上。
            claimRefs:
