    {
      "id": "sizing-and-aesc-relevance",
      "title": "Evidence-constrained sizing: AESC's SAM is the localized battery-demand slice around its footprint",
      "body": "Because public sources do not give a single clean addressable-market number for AESC, the best framing is layered sizing rather than one headline TAM. The broadest layer is global EV and storage battery demand, which IEA and market-share data show rising rapidly. The next layer is the localized market where automakers and governments want nearby, qualified supply: Europe, the UK, Japan, and some North American programs. The narrowest layer is the portion where AESC has real access through named customers, operating plants, or advanced buildouts. That reachable slice is much smaller than global battery demand but more investable, because it maps to BMW, Nissan, Renault, and ESS-adjacent opportunities where the company can plausibly monetize existing or near-term assets. The main diligence challenge is not proving that the battery market is large; it is testing whether AESC's localized plants can stay cost-competitive enough to capture durable utilization and margin inside that market before new policy or customer changes erode the advantage.",
