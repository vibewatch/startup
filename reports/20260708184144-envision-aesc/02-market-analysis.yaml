    {
      "id": "growth-drivers-and-competitive-constraints",
      "title": "Growth drivers are strong, but concentration and price pressure are stronger than the headline TAM suggests",
      "body": "The market backdrop is directionally favorable. IEA continues to treat electric-vehicle deployment, battery demand, and charging buildout as long-horizon growth areas, and its batteries report underscores that stationary storage is the fastest-growing clean-energy technology in the power sector. Yet the profit pool is much harder than the demand curve. Electrive's SNE-based 2025 market-share data shows CATL and BYD together controlling more than half of global EV battery output, while CarNewsChina's CPCA-based reporting shows CATL above 50% in China's domestic market in early 2026. The Investor's reporting on LFP makes the pressure more explicit: the chemistry is growing faster than NCM, Korean challengers see US and EU trade rules as helpful, but they still admit price competitiveness against China is the central obstacle. For AESC this means the opportunity is real, but winning depends on being one of the few non-Chinese-backed suppliers that can combine local plants, credible OEM relationships, and financeable cost curves in the right jurisdictions.",
