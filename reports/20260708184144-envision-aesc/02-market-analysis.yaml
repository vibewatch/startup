  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "AESC participates in two overlapping markets: EV traction batteries for automakers and stationary battery systems for grid and commercial storage. The strongest public evidence points to structurally growing demand, falling battery-cost curves, and increasing policy support for local supply chains, but also to intense concentration around Chinese incumbents, a fast LFP shift, and a financing environment that punishes subscale entrants. For AESC, the relevant market is therefore narrower than global battery demand: it is the localized, incentive-eligible, anchor-customer-led battery supply opportunity in Japan, Europe, the UK, and selected North American programs."
  },
  "sections": [
    {
      "id": "market-boundary-and-demand",
      "title": "Market boundary: batteries, not all transport electrification spend",
      "body": "AESC's real market is not every dollar spent on electric mobility. The included spend is battery-cell, module, pack, and system value for passenger EVs, commercial EVs, and stationary storage systems that use similar manufacturing capabilities. Excluded spend includes raw-mining economics, full vehicle assembly, charging infrastructure, and downstream retail electricity services except where they directly change battery demand. The IEA's Global EV Outlook and Batteries and Secure Energy Transitions reports support that framing: they explicitly connect EV deployment to battery demand, treat charging infrastructure as an adjacent rather than identical market, and describe battery storage as a distinct but increasingly important power-sector market. AESC's own website also widens the lens beyond auto cells by marketing both EV batteries and industrial-scale energy-storage systems. This matters because the company should be analyzed as a battery-platform supplier to a few capital-intensive buyer segments, not as a generic climate-tech software company or a broad 'energy transition' proxy.",
      "claimRefs": [
