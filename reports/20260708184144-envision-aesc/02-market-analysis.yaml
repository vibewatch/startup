    {
      "id": "buyers-and-regionalization",
      "title": "Buyers are concentrated and procurement is increasingly local-for-local",
      "body": "The buyer map is unusually concentrated. In practice, battery demand is pulled by automakers, platform procurement teams, pack-assembly operations, and—on the storage side—utility or commercial integrators. Public AESC evidence shows this clearly: BMW tied South Carolina cells to its sixth-generation EV platform, Nissan linked Sunderland batteries to the next-generation Leaf and EV36Zero, and Renault's Douai ecosystem anchors French demand. This is why a simple global TAM is misleading for AESC. The company competes inside regionalized supply chains where customer qualification, subsidy eligibility, tariff treatment, logistics, and political acceptability matter alongside chemistry and cost. The market therefore rewards suppliers that can localize capacity close to OEM demand, meet trade-rule tests, and finance gigafactories before revenue arrives. AESC's footprint across the UK, France, Spain, Japan, and the US makes it relevant in that localized market, but also exposes it to multiple regulatory regimes and customer concentration points.",
      "claimRefs": [
        "CM013",
