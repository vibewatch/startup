  topStrengths:
    - Real OEM and storage relevance supported by BMW, Nissan-alliance heritage, and live European production milestones.
    - Meaningful capital access signals including UK-backed financing and large disclosed project-finance activity.
    - Strategic value from localized battery manufacturing footprint across Japan, the UK, France, and planned additional regions.
  topRisks:
    - Public disclosure is too thin on consolidated revenue, margins, cash generation, debt terms, and cap-table overhang.
    - The South Carolina pause shows policy, demand, and capex sensitivity can quickly impair upside.
    - A rumored top-end valuation requires stronger audited operating proof than the current public file provides.
  unresolvedGaps:
    - Audited consolidated financial statements and plant-level unit economics are not public.
    - Current ownership, preference structure, debt covenants, and Nissan residual-stake economics remain unclear.
    - Public evidence still does not cleanly establish fair value at any rumored 2026 IPO or private-mark level.
