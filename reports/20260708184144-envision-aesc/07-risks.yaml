  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "AESC's risk profile is defined less by one catastrophic red flag than by interacting policy, financing, and execution dependencies. The sharpest headline risks are U.S. FEOC and clean-vehicle-credit eligibility, Chinese-ownership geopolitics, the paused South Carolina plant, and ongoing reliance on lenders, guarantees, and external capital. Operationally, AESC has meaningful mitigations—certifications, quality controls, and real customers—but the public file still leaves gaps on recalls, litigation, yields, contract durability, and plant economics. The right underwriting stance is therefore residual-risk based: the business may be viable, but only if policy access, capital availability, and localized plant execution all hold at once."
  },
  "sections": [
    {
      "id": "regulatory-and-geopolitical-risk",
      "title": "Regulatory and geopolitical risk is first-order because subsidy access can change customer economics",
      "body": "For AESC, policy is not background noise. It is part of the product-market fit. Treasury, DOE, IRS, and legal texts on FEOC and clean-vehicle credits show that U.S. EV battery economics now depend on recurring compliance, traceability, and ownership-sensitive rules. That matters more for AESC than for a generic supplier because the company sits in the gray zone investors worry about most: a Japan-headquartered battery maker controlled by a Chinese parent and supplying U.S.-linked programs. TNW's Hong Kong IPO reporting makes the same point from a different angle by explicitly linking venue choice to geopolitical and FEOC-style concern. Europe and the UK add more layers rather than relief. The European battery framework and UK battery strategy both signal that industrial policy, sustainability, and battery regulation will remain active compliance burdens. The result is a risk posture in which legal or policy changes can directly flow into customer eligibility, financing appetite, and valuation, even if the underlying cells work as designed.",
      "claimRefs": [
