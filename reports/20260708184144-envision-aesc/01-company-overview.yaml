      "id": "capital-and-footprint",
      "title": "Capital base, footprint, and industrial expansion",
      "body": "AESC's public footprint has expanded far faster than its public disclosure. Official UK and South Carolina announcements, partner releases from BMW, and independent industry reporting together show a company pursuing parallel regional supply chains around anchor customers. The UK story is the cleanest: the government, National Wealth Fund, and commercial banks disclosed a more than £1 billion Sunderland financing package in May 2025, while AESC and industry press later framed the site as a 15.8 GWh plant intended to power roughly 100,000 EVs annually. In the US, BMW announced a South Carolina battery-cell partnership tied to its sixth-generation round cells, and South Carolina leaders later expanded the Florence project from $810 million and 1,170 jobs to a total announced $1.62 billion and 1,620 jobs. In continental Europe, Douai entered production in 2025 for Renault programs and Spain broke ground in 2024 as AESC's European network widened again. The result is a real multi-continent manufacturing platform, but one whose economics are still understood mostly through project announcements rather than consolidated reporting.",
