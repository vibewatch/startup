  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Envision AESC is a Japan-founded EV battery maker now controlled by China's Envision Group, with legacy Nissan ties, a widening EV-plus-ESS product story, and a global factory network spanning Japan, the UK, France, Spain, and the United States. Public evidence confirms major 2025 project-finance support for Sunderland, a 2025 production start at Douai, and a June 2025 pause at the South Carolina BMW-linked expansion because of policy and market uncertainty. The file is strong on footprint and industrial milestones but materially weaker on consolidated financial disclosure, exact cap-table ownership, and a current arm's-length equity valuation."
  },
  "sections": [
    {
      "id": "identity-and-ownership",
      "title": "Identity, legacy, and control structure",
      "body": "Envision AESC still carries the DNA of the original Nissan-NEC battery venture, but the control story is now unmistakably different. Nissan's 2018 disposal announcement established that the battery business, its associated engineering operations, and plants in Japan, Sunderland, and Smyrna were sold to Envision Group, with Nissan retaining a minority equity stake rather than fully exiting. Later coverage and investor-oriented databases consistently describe AESC as China-controlled, GIC-backed, and still strategically linked to Nissan even after the change in ownership. The company itself now markets a broader identity than a captive automotive supplier: its current official website describes an 'AI Energy System Company' delivering batteries for both EVs and industrial-scale energy storage, with manufacturing spread across Asia, Europe, and North America. That evolution matters for diligence because it means AESC is no longer just a legacy Leaf battery asset. It is a large, industrial battery platform straddling Japanese operating heritage, Chinese control, Western factory expansion, and policy-sensitive supply chains.",
