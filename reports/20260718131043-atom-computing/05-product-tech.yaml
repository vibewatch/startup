- id: architecture-and-logical-qubit-stack
  title: Architecture and operating model
  body: The retained technical evidence shows a coherent architecture thesis. Atom’s qubits are individual neutral atoms held in optical traps and moved as needed to create interactions. The 2023 announcement established scale at the physical layer through a 1,225-site array populated with roughly 1,180 qubits and paired that scale with long coherence and mid-circuit measurement claims. Microsoft’s 2024 announcement and the later arXiv paper then shift the analysis from physical scale to reliable logical compute. Together they describe 24 entangled logical qubits, computation on 28 logical qubits, a 256-qubit neutral-atom processor, atom movement enabling full connectivity, and erasure-conversion techniques that turn some error sources into detectable atom loss. In practice that means Atom’s operating model is not just hardware manufacturing. It is hardware plus decoder-aware software, error-correction orchestration, and AI/HPC integration. The combination is differentiated because it gives
    Atom a public path from large physical arrays toward useful logical computation, but it also means the weakest layer—hardware fidelity, decoder quality, or orchestration—can become the scaling bottleneck.
