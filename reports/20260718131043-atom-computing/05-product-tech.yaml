chapter:
  number: 5
  title: Product & Technology
  summary: Atom’s product case is strongest where neutral-atom hardware, Microsoft’s logical-qubit stack, and QuNorth’s flagship deployment intersect. Public evidence supports a differentiated architecture—optically trapped neutral atoms, 1,200-plus physical-qubit scale, and logical-qubit demonstrations with Microsoft—but it remains thin on pricing, formal reliability metrics, and enterprise assurance disclosures, so the product looks technically advanced and commercially promising rather than fully operationalized at scale.
sections:
- id: product-definition-and-surfaces
  title: Product definition in customer workflow terms
  body: 'Atom’s public product surface is best understood as a system-and-stack offering rather than a single SKU. The homepage centers on AC1000 and the “logical qubit era,” while the funding release says the company is deploying commercial on-premises systems for enterprise and government customers. That already implies at least three product layers: core neutral-atom hardware, logical-qubit enablement via Microsoft’s software stack, and high-touch deployment or support for customers that want secure local access. QuNorth’s Magne project makes this concrete. Customer and independent sources describe a full-stack system in which Atom supplies the neutral-atom hardware and Microsoft supplies software, middleware, and cloud connectivity. The workflow evidence is therefore less about low-friction cloud consumption and more about bespoke deployment for chemistry, materials, drug-discovery-adjacent, and optimization workloads. This matters for underwriting because the commercial surface is valuable
    but necessarily services-heavy: Atom is selling a powerful quantum system plus the integration work that lets sophisticated buyers use it.'
