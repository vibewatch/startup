      - number: '8.4'
        title: Scenario underwriting and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should stay simple and evidence-sensitive. In the bull case, Atom delivers QuNorth on
              schedule, converts Microsoft and government credibility into another named customer, and keeps the IPO
              window open long enough to be valued more like a scaled strategic platform than like a single-program
              hardware bet. In the base case, the company remains financeable and strategically relevant, but public
              disclosure improves only incrementally and the next round clears the current mark only modestly. In the
              bear case, the flagship slips, customer proof stays concentrated, or broader quantum multiples compress
              enough that even a technically credible company cannot sustain a July 2026 premium. That downside is not
              theoretical: adverse market commentary already frames pure-play quantum equities as options on
              breakthroughs with severe drawdown risk. The practical answer is to demand diligence that directly changes
              probability—D-1 terms, preference stack, QuNorth economics, revenue recognition, and evidence of another
              paid deployment. Until those are available, the right posture is disciplined curiosity, not valuation
              complacency.
