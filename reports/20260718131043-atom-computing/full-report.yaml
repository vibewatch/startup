  - id: TR006
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Roadmap execution
        - Public milestone cadence
        - Libra slips materially beyond 2028 or the gigaquop path loses a credible 2028-2029 window
        - Pause valuation expansion and re-baseline the entire timing model.
      - - Customer repeatability
        - Named paid lighthouse wins
        - >-
          No second named paid system or equivalent sovereign/HPC contract beyond the current public set by the next
          major financing event
        - Treat current customer proof as concentrated option value rather than as a repeatable commercial engine.
      - - Export and contractor compliance
        - Management compliance packet
        - >-
          Management cannot show ECCN mapping, deemed-export controls, and government-customer cybersecurity posture in
          diligence
        - Escalate compliance review and halt assumptions about frictionless global hiring or procurement.
      - - Platform dependence
        - AWS or NVIDIA commitment
        - Material partner reprioritization, cloud-hosting delay, or decoder-integration slip on a critical path
        - Increase schedule and margin discounts and narrow the base case to existing-generation products.
      - - Capital adequacy
        - Runway and next-round terms
        - No clear runway through the next milestone set or a flat/down round with punitive seniority
        - Re-underwrite dilution, downside control, and ability to complete the roadmap.
      - - People and talent
        - Critical-role continuity
        - Loss of key FTQC, QEC, or partner-facing leaders without a clear successor
        - Raise execution risk immediately and require evidence of bench depth.
      - - Security assurance
        - Government or critical-infrastructure diligence outcome
        - No credible uptime, CUI-handling, or security-attestation packet for sensitive deployments
        - Treat public-sector and regulated-industry expansion as delayed until assurance evidence appears.
