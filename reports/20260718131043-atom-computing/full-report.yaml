  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Atom should be analyzed inside the quantum-computing hardware-and-services market, but inside that market
              its practical boundary is narrower than many headline TAM slides imply. The relevant spend is not “all
              quantum technology,” and it is not even every quantum-computing dollar. Atom’s addressable layer is
              neutral-atom quantum capability sold through cloud access, on-prem systems, hybrid HPC integration, and
              application co-design for buyers who need simulation or optimization workloads that may eventually outrun
              classical methods. That boundary includes Aquila and future Braket access, the AIST-style on-prem route,
              and service work tied to algorithm development and integration. It excludes quantum sensing, quantum
              communications or QKD, and most post-quantum cryptography migration budgets, because those categories can
              grow rapidly without buying Atom hardware. The status-quo substitute is therefore not “nothing”; it is
              classical HPC, GPU-heavy AI simulation, classical optimization software, and quantum-safe software
              migration. BCG’s caution that quantum still provides no tangible commercial advantage over classical
              computing today is essential here, because it means Atom is competing against fast-improving alternatives,
              not just against other quantum vendors. Neutral atoms remain relevant because AWS, Braket, and Atom all
              tie the modality to simulation and optimization tasks where geometry, reconfigurability, and
              all-to-all-style connectivity matter.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
