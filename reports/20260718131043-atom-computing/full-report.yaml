        - Real cost to scale from Novera into broader production programs is still opaque
        - Appeals to labs that care more about control and integration than turnkey managed access
      - - Google Willow
        - No public price signal retained
        - Proposal-gated early access for selected research partners
        - State-of-the-art hardware access for accepted proposals plus Cirq ecosystem
        - Commercial terms, volumes, and future catalog plans are unknown
        - Competitive threat is strategic and ecosystem-driven rather than immediate on price
      - - D-Wave Leap / Advantage2
        - No simple public rate card on retained D-Wave pages
        - Cloud access, hybrid solvers, and on-prem system purchase
        - Annealing systems, hybrid solvers, and enterprise-grade uptime/security posture
        - Exact commercial list pricing is private even though system sales are publicly referenced
        - Substitute route for buyers who need operational quantum workflows today
