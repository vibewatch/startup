      - number: '6.3'
        title: Durability, expansion, and channel dependence
        blocks:
          - type: paragraph
            body: >-
              Durability is where the customer chapter becomes materially weaker. Public sources do not disclose NRR,
              GRR, churn, renewals, contract length, or customer concentration, so analysts must rely on proxies. The
              best proxy is the quality of the flagship itself: QuNorth is not a vague pilot, and the Microsoft-Atom
              system is explicitly designed for academia and industry. Even so, one flagship is not a diversified
              installed base. The same logic applies to channels. Microsoft is a major commercialization partner, and
              government-linked programs are major validation channels, but those strengths also create dependencies. A
              customer pipeline that leans too heavily on sovereign or partner-shaped demand can look stronger than it
              really is if repeat enterprise conversion remains slow. The plausible bull case is land-and-expand from
              anchor deployments into adjacent chemistry, materials, and optimization customers. The plausible bear case
              is concentration: a small number of strategic programs dominate attention while enterprise adoption takes
              much longer than expected. Public evidence today supports the former as a possibility, not yet as a
              settled pattern. A further caution is competitive buyer education: Google and Quantinuum can already point
              customers to visible programs and stack documentation, so Atom must win not just on physics but on the
              confidence that buyers can actually stand up repeatable workflows. That makes named references,
              post-deployment case studies, and renewal evidence especially important in the next refresh.
