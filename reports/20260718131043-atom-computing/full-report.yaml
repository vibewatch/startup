        title: Founders, leadership, investors, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The public founder record is thinner than Atom’s funding record but strong enough to anchor later
              chapters. Forge identifies Benjamin Bloom and Jonathan King as founders, while Atom’s own current
              materials and external partner materials consistently put Ben Bloom in the founder-CEO role. Capital
              visibility is materially better. The company and PR Newswire both disclosed more than $300 million of
              cumulative funding as of June 2026, including a $100 million Series C led by Third Point Ventures with
              DCVC and Cisco Investments participating and a separate $100 million Department of Commerce Letter of
              Intent. DCVC’s own commentary goes further and frames the government support as an equity stake, which
              raises the strategic importance of Atom’s policy alignment even if the specific legal paperwork remains
              private. Forge adds another layer by reporting a July 2026 Series D-1 valuation of $2.06 billion and an
              approximately $89 million financing, but because that valuation comes from COI-derived market-data
              presentation rather than a company press release, it should be treated as strong directional evidence
              rather than fully disclosed priced-round transparency. Governance disclosure remains materially thinner
              than financing disclosure: the retained public record identifies leaders and investors, but not a full
              board map, committee structure, or detailed minority-protection terms.
