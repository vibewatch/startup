  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Atom is not competing in a single tidy peer group. The direct peer set is the neutral-atom cohort, where
              Atom Computing and Pasqal are also selling the same promise of scalable, gate-based or hybrid neutral-atom
              systems. The incumbent reference set is broader and better capitalized: IBM Quantum and Google Quantum AI
              in superconducting systems, IonQ and Quantinuum in trapped ions, PsiQuantum in photonics, and Rigetti as a
              smaller superconducting full-stack challenger. D-Wave is not a like-for-like universal gate-model rival,
              but it is a real substitute for optimization-heavy buyers who care more about production workflows today
              than about which architecture ultimately wins fault tolerance. A second substitute layer sits above the
              hardware vendors altogether. AWS Braket and Azure Quantum aggregate multiple backends behind one
              procurement surface, while hybrid AI/HPC platforms such as NVIDIA CUDA-Q let teams defer a hard hardware
              commitment. That means Atom has to beat direct modality peers, broader universal-hardware alternatives,
              and the default choice to keep experimenting through cloud brokers or classical-quantum hybrid stacks
              rather than standardizing on one hardware vendor.
