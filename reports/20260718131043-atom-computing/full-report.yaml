  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Atom deserves a serious place on the watchlist, but the public evidence does not justify treating the
              current mark as obviously cheap. Forge’s July 2026 COI-based data gives Atom a concrete $2.06 billion
              Series D-1 valuation and shows that investors were still willing to finance the company after the June
              Series C. That is important because it means the price is not a rumor built only on chat-room
              extrapolation. Even so, the investment case is still dominated by milestone logic rather than by operating
              fundamentals. Atom has first-sale proof, logical-qubit commercialization proof, Microsoft distribution
              credibility, and unusual federal support, but it still does not publicly disclose revenue, gross margin,
              or recurring mix. The right decision is therefore research-more: treat Atom as a high-quality deep-tech
              candidate whose valuation already embeds a premium for technical scarcity, policy relevance, and the
              belief that QuNorth will become the first of several real systems rather than a one-off flagship.
            claimRefs:
