  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Atom Computing describes itself as a builder of highly scalable gate-based quantum computers using arrays
              of optically trapped neutral atoms. The retained evidence is consistent on the essentials but not on every
              operating-detail nuance. Forge places the company’s headquarters in Berkeley, California and dates the
              founding to 2018, while the 2023 qubit-scale press release shows a commercial operations facility in
              Boulder, Colorado and the 2026 homepage signals a company operating across product, partnership, and
              hiring tracks rather than as a pure lab project. That mix matters because later chapters should treat Atom
              as a late-stage private deep-tech company with real commercialization surfaces, not as a pre-product
              research spinout. The most visible business model is on-premises system delivery paired with
              logical-qubit-capable hardware, strategic partner integration, and government or enterprise deployment
              support. Unlike cloud-first competitors whose public narrative centers on marketplace access, Atom’s
              public positioning now emphasizes AC1000, logical qubits, and sovereign or enterprise deployment pathways.
              The result is a company that appears past the proof-of-concept stage on identity and product positioning,
              but still selective in what it discloses about operating scale, customer breadth, and financial maturity.
