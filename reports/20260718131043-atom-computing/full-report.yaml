      - number: '2.2'
        title: 'Evidence-constrained sizing: revenue, value-pool, sovereign-budget, and lighthouse-procurement lenses'
        blocks:
          - type: paragraph
            body: >-
              Public market sizing only becomes useful after the market boundary is tightened. The near-term third-party
              revenue lenses are not enormous: McKinsey puts quantum-computing company revenue just above $1 billion in
              2025 and at $3.2 billion to $4.4 billion by 2028, while QED-C offers a similar but not identical picture
              at $1.4 billion to $1.9 billion in 2025 and more than $3 billion by 2028. Those differences are already
              meaningful enough to show that the market is still definition-sensitive. BCG is even more cautious on what
              providers can realistically monetize before fault tolerance, keeping the provider market at only $1
              billion to $2 billion by 2030 even while preserving a much larger $90 billion to $170 billion
              provider-revenue case by 2040 and a $450 billion to $850 billion economic-value envelope. For Atom
              specifically, the most decision-useful lens is neither the broad 2035 value pool nor a simplistic TAM
              cascade. It is the sovereign-budget and lighthouse-procurement lens: BCG says public orders already
              support more than half of the market, the UK strategy commits £2.5 billion over ten years, the U.S.
              reauthorization path funds testbeds and applications, DOE wants a scientifically relevant fault-tolerant
              platform by 2028, and Atom itself already has named proof points in AIST, NERSC, AWS, and Italy’s ICSC
              program. That is enough to say the market is real, but not enough to publish a clean neutral-atom-specific
              SAM or SOM without private pricing, contract, and utilization data. The right conclusion is therefore that
              Atom’s reachable early market is sovereign and simulation-heavy, while long-run upside depends on whether
              fault-tolerant adoption arrives anywhere near the company’s own timetable.
