companyProfile:
  summary: >-
    Atom Computing is a private neutral-atom quantum-computing company founded in 2018 and headquartered in Berkeley,
    California. Its public story now combines 1,200-plus physical-qubit scale, Microsoft-backed logical-qubit
    commercialization, DARPA Stage B validation, and a first commercial on-prem deployment with QuNorth, making it one
    of the more credible late-stage quantum hardware platforms. More than $300 million of announced capital and a
    Forge-reported $2.06 billion D-1 valuation support the company’s strategic relevance, but the operating model
    remains materially under-disclosed relative to the current price.
