      - number: '7.3'
        title: Operational, partner, and customer concentration stack
        blocks:
          - type: paragraph
            body: >-
              Operationally, Atom already looks more real than many quantum startups because it is not just promising a
              future machine; it is supporting Aquila on Braket, preparing Libra for cloud delivery, running
              public-program deployments, and co-designing applications before fault-tolerant hardware arrives. That
              breadth is also the core risk. Cloud distribution creates AWS dependence on access and economics. Decoder
              and hybrid-workflow performance route through NVIDIA and surrounding classical infrastructure. Public
              validation routes through DARPA, while customer proof routes heavily through AIST, NERSC, and NQCC. Each
              of those nodes is valuable, but none is redundant. The AIST deployment shows real willingness to buy an
              on-prem system; NERSC and NQCC show institutional relevance; AWS proves accessible distribution. Yet the
              same evidence set also shows concentration: most named proof comes from government, sovereign, or HPC
              organizations comfortable with long lead times and policy goals. If Atom misses a milestone, the damage
              can propagate quickly because customer proof, partner confidence, and roadmap credibility all rest on a
              small set of counterparties and use cases. The transmission and dependency diagrams focus on that
              correlation rather than on isolated technical anecdotes.
