      - number: '8.2'
        title: Financing context and comparable stack
        blocks:
          - type: paragraph
            body: >-
              The best way to understand Atom’s price is through financing momentum and relative valuation, not
              near-term earnings power. Forge indicates that Atom moved from a $714.4 million C-1 valuation in June 2026
              to a $2.06 billion D-1 mark in July 2026 while also showing an $89.07 million financing. That is a sharp
              re-pricing for a company whose public revenue profile is still largely undisclosed. Relative comps explain
              why the market may still tolerate it. IonQ already has meaningful revenue and a public market cap near $13
              billion; Quantinuum’s June 2026 IPO targeted roughly $14.3 billion and raised $1.68 billion; PsiQuantum
              still commands a $7 billion private valuation on utility-scale ambition; and public names such as D-Wave
              and Rigetti continue to trade at multi-billion-dollar market caps despite modest revenue bases. Atom
              therefore does not look misclassified inside the quantum cohort, but it does look like a name that needs
              continued execution to defend a premium re-rating that arrived faster than its public operating
              disclosure.
