      - number: '1.3'
        title: Milestones, partnerships, and commercialization proof
        blocks:
          - type: paragraph
            body: >-
              Atom’s strongest public evidence is milestone-based. In 2023 the company announced a 1,225-site array
              populated with roughly 1,180 qubits and claimed the first universal gate-based system to exceed 1,000
              qubits. In 2024 and 2025 the Microsoft collaboration moved the discussion from raw physical scale toward
              logical computing, with Microsoft and Atom presenting a commercial machine that entangled 24 logical
              qubits and computed with 28 logical qubits. DARPA then selected Atom for Stage B of the Quantum
              Benchmarking Initiative, giving the company a visible role in a government-led program aimed at
              utility-scale roadmap credibility. The most important commercial proof point is QuNorth. Multiple
              independent and customer-side sources say Atom and Microsoft will deliver Magne, a Level 2 system with 50
              logical qubits and 1,225 physical neutral-atom qubits, to a Danish-owned initiative funded by EIFO and the
              Novo Nordisk Foundation. That matters because it converts Atom’s story from “promising physics” into a
              concrete on-premises system purchase with customer ownership, named applications, and regional strategic
              intent. Cisco, NVIDIA, and Nu Quantum further widen the strategic network, but QuNorth and Microsoft
              remain the clearest evidence that Atom is translating technical milestones into deployable systems.
