- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - QuNorth lands on time, a second buyer appears, and IPO conditions stay open
    - Valuation could push toward public-premium peers and clear the >2x gross hurdle
    - Execution, manufacturing, and public-market sentiment still matter
    - Repeat system sales plus visible revenue progression
  - - Base
    - Atom delivers flagship milestones and remains strategic, but disclosure stays limited
    - Next financing clears the current mark only modestly and preserves option value
    - Commercial breadth remains narrow and cap-table terms matter more
    - Successful delivery without broad revenue proof
  - - Bear
    - Flagship timing slips or revenue remains too concentrated while quantum multiples cool
    - Private mark compresses toward flat or down-round territory
    - Customer concentration, funding terms, and sentiment all worsen together
    - Missed delivery, weaker demand, or punitive financing structure
  notes: Scenario logic is milestone-based rather than DCF-based because public revenue and margin disclosure remain insufficient for a conventional operating model.
