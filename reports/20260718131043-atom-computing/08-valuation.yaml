chapter:
  number: 8
  title: Valuation
  summary: Atom’s $2.06 billion July 2026 D-1 mark is real enough to anchor underwriting, but it still sits on milestone logic rather than on disclosed scale economics. The combination of QuNorth as first commercial proof, Microsoft logical-qubit packaging, DARPA Stage B validation, and Department of Commerce backing explains why investors may pay a premium; the absence of public revenue, margin, and cap-table detail explains why the correct call remains research-more with a stretched valuation stance and high risk rating.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Atom deserves a serious place on the watchlist, but the public evidence does not justify treating the current mark as obviously cheap. Forge’s July 2026 COI-based data gives Atom a concrete $2.06 billion Series D-1 valuation and shows that investors were still willing to finance the company after the June Series C. That is important because it means the price is not a rumor built only on chat-room extrapolation. Even so, the investment case is still dominated by milestone logic rather than by operating fundamentals. Atom has first-sale proof, logical-qubit commercialization proof, Microsoft distribution credibility, and unusual federal support, but it still does not publicly disclose revenue, gross margin, or recurring mix. The right decision is therefore research-more: treat Atom as a high-quality deep-tech candidate whose valuation already embeds a premium for technical scarcity, policy relevance, and the belief that QuNorth will become the first of several real systems rather than a one-off flagship.'
