- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis evidence
  - Anti-thesis or risk
  - What would change the view
  rows:
  - - Technical scarcity
    - Logical-qubit commercialization, DARPA Stage B, and neutral-atom scale make Atom scarce
    - Scarcity is not the same thing as durable monetization
    - Show another named deployment or recurring revenue signal
  - - Government support
    - DoC and DARPA participation reduce solvency and signaling risk
    - Policy backing can still coexist with weak end-market breadth
    - Separate grants, equity, and true customer demand clearly
  - - Commercial proof
    - QuNorth proves someone will buy an on-prem system
    - One sovereign flagship can overstate repeatability
    - Add a second named buyer or cloud-to-system conversion
  - - Relative valuation
    - Atom is still cheaper than IonQ, Quantinuum, and PsiQuantum on fetched marks
    - Cheaper than bigger comps does not make it cheap on its own fundamentals
    - Show revenue scale or cleaner IPO readiness
  - - IPO optionality
    - Forge shows confidential-filing language and D-1 financing momentum
    - No public S-1, audited numbers, or roadshow evidence are visible here
    - Publish audited financials or a clear listing timeline
  - - Entry discipline
    - Current mark may work if execution keeps comp parity intact
    - Fast markup plus thin disclosure leaves limited room for slippage
    - See D-1 terms and downside protections before underwriting price
  notes: Each row is an underwriting lens, not a prediction; the table highlights exactly what would have to become true to move the call upward.
