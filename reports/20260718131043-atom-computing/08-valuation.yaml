  evidenceGaps:
  - type: missing-source
    severity: material
    topic: d1-terms
    missingEvidence: Executed Series D-1 term sheet, investor roster, liquidation preferences, and any side letters or governance rights.
    whyItMatters: The private mark is visible, but the economic value of that mark to new common-equity investors is not.
    diligencePath: Request the D-1 financing package and updated cap table directly from management and counsel.
  - type: private-evidence-only
    severity: material
    topic: qunorth-economics
    missingEvidence: QuNorth contract value, revenue-recognition schedule, support obligations, and any Microsoft revenue-sharing terms.
    whyItMatters: The first commercial sale is central to the valuation argument, but its economic quality is still unknown.
    diligencePath: Review customer contract economics and interview both management and customer-side stakeholders under NDA.
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Revenue bridge, maintenance or cloud mix, gross-margin profile, backlog, and customer concentration for the next 12-24 months.
    whyItMatters: Without an operating bridge, investors cannot distinguish durable platform economics from a small number of bespoke flagship projects.
    diligencePath: Obtain monthly revenue and backlog reporting plus product-line gross-margin disclosure in diligence.
  - type: stale
    severity: material
    topic: ipo-status
    missingEvidence: Current banker process, any amended confidential filing, and management's latest view on timing for a public listing.
    whyItMatters: Forge indicates IPO optionality, but the market cannot price optionality accurately without knowing whether the process is active, paused, or purely exploratory.
    diligencePath: Ask management to reconcile Forge's filing signal with current listing plans and provide a readiness timeline.
  - type: enumeration-incomplete
    severity: minor
    topic: private-neutral-atom-comps
    missingEvidence: A complete, sourced list of private neutral-atom valuation marks for peers such as Oratomic, QuEra, and other late-stage platforms.
    whyItMatters: The comparable table is directionally useful, but private-market opacity limits precision for the closest architecture peers.
    diligencePath: Supplement public evidence with PitchBook, Caplight, or direct investor references before making a priced decision.
    relatedTableRefs:
    - TV004
