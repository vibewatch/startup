- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - D-1 economics
    - Term sheet, investor list, preference stack, liquidation terms
    - Determines whether the current mark is clean common-equity value or structure-heavy price
    - Lead investor / counsel review of executed financing docs
  - - QuNorth revenue recognition
    - Contract value, milestones, and support obligations
    - Separates headline customer proof from true economic proof
    - Management finance review and customer contract diligence
  - - Second paid deployment
    - Another named system sale or durable cloud-to-on-prem conversion
    - Would materially reduce single-flagship concentration
    - Pipeline review plus customer reference calls
  - - Government-support conditions
    - Close timing, restrictions, and whether support is equity, grant, or milestone-tied
    - Changes dilution math and governance implications
    - Review DoC documentation and board materials
  - - IPO readiness
    - Audited statements, bankers, and timing assumptions behind confidential-filing language
    - Tests whether public-market optionality is real or merely exploratory
    - Management Q&A and public-filing watch
  - - Operating model
    - Hardware margin, maintenance revenue, and services burden
    - Decides whether Atom can scale beyond bespoke flagship projects
    - Revenue bridge, margin walk, and deployment-unit-economics package
  notes: These asks are intentionally specific because Atom’s valuation is easier to observe than its economics or capital-structure details.
