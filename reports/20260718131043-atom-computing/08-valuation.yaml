tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence base
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Strong technical and policy signals, but incomplete economic disclosure at a $2.06B mark
    - Keep active diligence rights, not a fully underwritten conviction call
  - - Confidence
    - Medium
    - Price is concrete via Forge, but revenue quality and D-1 terms remain private
    - Do not extrapolate precision beyond the fetched record
  - - Risk rating
    - High
    - Capital intensity, flagship concentration, and public-comp volatility remain material
    - Underwrite downside before underwriting upside
  - - Valuation stance
    - Stretched
    - Current mark is plausible inside quantum comps but rich versus disclosed fundamentals
    - Require proof that commercialization is broadening
  - - Return hurdle
    - Need credible path to >$4.1B for 2x gross and >$6.2B for 3x gross before dilution
    - Current price leaves less room for execution misses than earlier-stage entries
    - Only justify aggressive price support if repeat deployments emerge
  notes: Decision posture is price-sensitive because public evidence is stronger on valuation marks and strategic backing than on recurring revenue or cap-table detail.
