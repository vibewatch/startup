- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Atom Computing
    - Private D-1 valuation
    - ~$2.06B (Forge, Jul 2026)
    - Current underwriting anchor for this chapter
    - COI-derived mark is more concrete than revenue disclosure
  - - IonQ
    - Public market cap plus 2026 revenue guide
    - ~$12.98B market cap; $260M-$270M FY2026 guide
    - Shows what a public quantum hardware/software story can command with visible revenue
    - Public premium embeds volatility and a more mature disclosure set
  - - Quantinuum
    - 2026 IPO valuation
    - Up to ~$14.3B valuation; ~$1.68B IPO proceeds
    - Upper-end benchmark for a more mature full-stack quantum platform
    - IPO enthusiasm may not be available to Atom without stronger revenue proof
  - - PsiQuantum
    - Private valuation
    - ~$7B valuation after $1B round
    - Useful moonshot benchmark for utility-scale ambition
    - Photonic architecture and much larger fundraise differ from Atom
  - - QuEra
    - Private neutral-atom financing
    - '>$230M financing; valuation undisclosed in retained sources'
    - Closest modality peer for financing depth and cloud partnership narrative
    - No retained public valuation mark to compare directly
  - - Oratomic
    - 2026 neutral-atom Series A
    - $300M Series A; valuation opaque in reviewed free sources
    - Signals strong investor appetite for neutral-atom challengers
    - Stage, revenue maturity, and free-source valuation transparency differ
  - - D-Wave / Rigetti
    - Public market caps
    - ~$6.20B and ~$4.69B market caps
    - Lower public quantum benchmarks that remind investors the market still pays for scarce assets
    - Architectures and product mixes differ from Atom’s neutral-atom path
  notes: Comparable set is representative rather than exhaustive; where direct private valuation marks are not visible in retained free sources, the row is explicitly marked as opaque or financing-only.
