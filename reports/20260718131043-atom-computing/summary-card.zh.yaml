  topStrengths:
    - 中性原子规模、Microsoft 逻辑量子比特商业化和 DARPA Stage B，让这家私有量子公司拥有罕见可信的技术平台。
    - QuNorth / Magne 销售是真实商业证明，说明 Atom 不只是发布研究里程碑，也能卖出本地部署系统。
    - 累计融资超过 $300 million，再叠加 Department of Commerce 支持，相比许多量子同行明显缓解了近期融资压力。
    - Forge 的 D-1 标记和保密申报信号表明，资本市场已把 Atom 视为可能的后期候选公司，而不是小型实验性初创。
  topRisks:
    - 收入、利润率、订单积压和经常性收入占比披露仍太薄，无法有信心承销当前经济性。
    - 商业证明仍集中在 QuNorth 这一旗舰部署上，而不是来自多元化的具名客户基础。
    - $2.06B 估值已经内嵌高预期，给进度滑坡或后续需求疲软留下的容错很小。
    - 公开量子可比公司波动仍很大，负面市场评论也仍把这个品类看成期权式资产，而不是软件式资产。
    - 政府背书有战略价值，但本身不能证明客户需求可重复，也不能证明公司已具备 IPO 准备度。
  unresolvedGaps:
    - 已签署的 D-1 条款清单、投资者名单和清算优先权堆叠。
    - QuNorth 合同金额、收入确认节奏和 Microsoft 收入分成条款。
    - 首个旗舰系统之外，第二个具名付费部署的证据。
    - 经审计财务数据，以及 Forge 保密申报信号究竟仍有效还是历史信号的更清楚说明。
    - 覆盖订单积压、毛利率、服务负担和经常性收入结构的运营指标。
