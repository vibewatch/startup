company:
  name: Atom Computing
chapter:
  number: 1
  title: Company Overview
  summary: Atom Computing is a 2018 neutral-atom quantum-computing company led by founder-CEO Ben Bloom that now combines 1,200-plus-qubit hardware claims, a Microsoft logical-qubit partnership, DARPA Stage B participation, and a first commercial on-premises sale to QuNorth. Public capital evidence is unusually strong for a private quantum company—more than $300 million raised, a planned $100 million Department of Commerce investment, and a Forge-reported $2.06 billion July 2026 valuation—but revenue, customer count, headcount, and detailed financing terms remain materially under-disclosed.
sections:
- id: identity-stage-and-business-model
  title: Identity, stage, footprint, and business model
  body: Atom Computing describes itself as a builder of highly scalable gate-based quantum computers using arrays of optically trapped neutral atoms. The retained evidence is consistent on the essentials but not on every operating-detail nuance. Forge places the company’s headquarters in Berkeley, California and dates the founding to 2018, while the 2023 qubit-scale press release shows a commercial operations facility in Boulder, Colorado and the 2026 homepage signals a company operating across product, partnership, and hiring tracks rather than as a pure lab project. That mix matters because later chapters should treat Atom as a late-stage private deep-tech company with real commercialization surfaces, not as a pre-product research spinout. The most visible business model is on-premises system delivery paired with logical-qubit-capable hardware, strategic partner integration, and government or enterprise deployment support. Unlike cloud-first competitors whose public narrative centers on
    marketplace access, Atom’s public positioning now emphasizes AC1000, logical qubits, and sovereign or enterprise deployment pathways. The result is a company that appears past the proof-of-concept stage on identity and product positioning, but still selective in what it discloses about operating scale, customer breadth, and financial maturity.
