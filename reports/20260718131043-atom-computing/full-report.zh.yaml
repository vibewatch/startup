        blocks:
          - type: paragraph
            body: >-
              客户章节在耐久性上明显变弱。公开来源没有披露 NRR、GRR、流失、续约、合同期限或客户集中度，分析师只能依赖代理指标。最佳代理指标是旗舰本身的质量： QuNorth 不是模糊试点，Microsoft-Atom
              系统也明确面向学术界和产业界。即便如此，一个旗舰并不是多元装机基础。渠道也适用同样逻辑。Microsoft 是重要商业化伙伴，
              政府相关项目是重要验证渠道，但这些优势也会带来依赖。如果客户管线过度依赖主权或伙伴塑形需求，而重复企业转化仍然缓慢，它可能看起来比实际更强。合理乐观情景是从锚点部署向相邻化学、
              材料和优化客户落地后扩张。合理悲观情景是集中度：少数战略项目占据注意力，而企业采用比预期慢得多。今天的公开证据支持前者作为一种可能， 但还不是已经确立的模式。另一个警示是竞争性买家教育：Google 和
              Quantinuum 已经可以把客户指向可见项目和技术栈文档，因此 Atom 不仅要靠物理赢， 还要让买家相信自己确实能搭起可重复工作流。具名参考、部署后案例研究和续约证据会在下一次更新中特别重要。
