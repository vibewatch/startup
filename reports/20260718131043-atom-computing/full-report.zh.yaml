  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Atom 值得认真放进观察名单，但公开证据不足以证明当前价格明显便宜。Forge 2026 年 7 月基于 COI 的数据给出 Atom 具体的 $2.06 billion Series D-1
              估值，并显示投资人在 6 月 Series C 后仍愿意继续融资。这很重要，因为这个价格不是只靠聊天室外推堆出来的传闻。即便如此，投资逻辑仍主要由里程碑驱动，而不是运营基本面。Atom
              有首单验证、逻辑量子比特商业化验证、Microsoft 分发可信度和不寻常的联邦支持，但仍未公开披露收入、毛利率或经常性收入占比。正确决策因此是继续研究：把 Atom
              视为高质量深科技候选标的，但其估值已经为技术稀缺性、政策相关性，以及 QuNorth 会成为多个真实系统中的第一个、而不是一次性旗舰项目这一信念，嵌入了溢价。
