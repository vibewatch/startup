  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Atom 并不在一个整齐的单一同业组里竞争。直接同业是中性原子队列，Atom Computing 和 Pasqal 都在出售同一个承诺：可扩展、基于量子门或混合的中性原子系统。
              既有参照组更宽，也更有资本实力：IBM Quantum 和 Google Quantum AI 代表超导系统，IonQ 和 Quantinuum 代表离子阱，PsiQuantum 代表光子学， Rigetti
              则是规模较小的超导全栈挑战者。D-Wave 不是同类的通用门模型对手，但对那些今天更在意生产工作流、而不是最终哪种架构赢得容错的优化密集型买家来说，它是真实替代品。 第二层替代品位于硬件供应商之上。AWS
              Braket 和 Azure Quantum 把多个后端聚合到一个采购界面之后，NVIDIA CUDA-Q 等混合 AI/HPC 平台让团队推迟对硬件的硬承诺。 这意味着 Atom
              必须击败直接模态同业、更广泛的通用硬件替代方案，以及继续通过云经纪或经典 - 量子混合栈实验、而非标准化在单一硬件供应商上的默认选择。
