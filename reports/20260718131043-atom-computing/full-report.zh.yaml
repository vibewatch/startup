  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Atom 的公开产品触面最好理解为系统与栈的组合，而不是单一 SKU。官网聚焦 AC1000 和“逻辑量子比特时代”；融资新闻稿称公司正在为企业和政府客户部署商业本地系统。
              这已经暗示至少三层产品：核心中性原子硬件、通过 Microsoft 软件栈启用逻辑量子比特，以及为需要安全本地访问的客户提供高接触部署或支持。QuNorth 的 Magne
              项目把这一点具体化。客户和独立来源描述的是一个全栈系统：Atom 提供中性原子硬件，Microsoft 提供软件、中间件和云连接。因此，工作流证据更少指向低摩擦云消费，
              更多指向面向化学、材料、邻近药物发现和优化工作负载的定制部署。这对承保很重要，因为商业触面有价值，但必然服务较重：Atom 卖的是强大量子系统， 以及让复杂买家真正用起来的集成工作。
