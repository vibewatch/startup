      - number: '7.3'
        title: 运营、伙伴和客户集中叠加
        blocks:
          - type: paragraph
            body: >-
              从运营看，Atom 已经比许多量子创业公司更像一家真实公司，因为它不只是承诺未来机器；它已经在 Braket 上支持 Aquila，为 Libra
              云交付做准备，推进公共项目部署，并在容错硬件到来之前共设计应用。这份广度本身也是核心风险。云分发把访问和经济性绑定到 AWS。解码器和混合工作流性能要经过 NVIDIA 及周边经典基础设施。公共验证经过
              DARPA，客户验证则高度依赖 AIST、NERSC 和 NQCC。每个节点都有价值，但没有一个冗余。AIST 部署证明客户确实愿意购买本地系统；NERSC 和 NQCC 证明机构相关性；AWS
              证明分发可以触达用户。但同一组证据也揭示集中：大多数具名验证来自政府、主权或 HPC 组织，这些买方能接受长周期和政策目标。Atom
              一旦错过里程碑，损害会快速传导，因为客户验证、伙伴信心和路线图可信度都压在少数交易对手和用例上。传导和依赖图关注的正是这种相关性，而不是孤立的技术轶事。
