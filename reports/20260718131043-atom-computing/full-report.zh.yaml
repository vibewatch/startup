      - number: '5.2'
        title: 架构和运营模型
        blocks:
          - type: paragraph
            body: >-
              已采纳技术证据显示出一致的架构逻辑。Atom 的量子比特是光学陷阱中的单个中性原子，并可按需移动以产生相互作用。2023 年公告通过 1,225 位点阵列、约 1,180
              个量子比特，确立了物理层规模，并同时提出长相干和中途测量主张。Microsoft 2024 年公告及后续 arXiv 论文随后把分析从物理规模转向可靠逻辑计算。 两者合起来描述了 24 个纠缠逻辑量子比特、在
              28 个逻辑量子比特上计算、一个 256 量子比特中性原子处理器、通过原子移动实现全连接，以及把部分错误来源转化为可检测原子损失的擦除转换技术。 实际上，这意味着 Atom
              的运营模型不只是硬件制造，而是硬件加上解码器感知软件、纠错编排和 AI/HPC 集成。这个组合差异化明显，因为它给 Atom
              提供了一条从大型物理阵列走向有用逻辑计算的公开路径；但也意味着最弱的一层——硬件保真度、解码器质量或编排——都可能成为扩展瓶颈。
