      - number: '3.3'
        title: 切换成本、分发权力和伙伴访问
        blocks:
          - type: paragraph
            body: >-
              对“赢家通吃”护城河最强的反证，是访问层已经高度标准化。AWS Braket 把 Atom、IonQ 和 Rigetti 放在一个控制平面上；Azure Quantum 则发布
              IonQ、Quantinuum、Rigetti 和 Pasqal 的伙伴专属产品。开放开发者工具强化了这个格局：Google 推 Cirq，Quantinuum 推 pytket， IonQ 支持主要
              SDK，Rigetti 可从外部格式编译，NVIDIA 正推动一种混合量子 - 经典模型，把 QPU 视为更大加速系统的一部分。软件侧切换成本因此保持中等。
              买家可以跑基准、多宿主，并推迟承诺。锁定效应仍存在，但主要是硬件特定和工作流特定，而不是应用层排他：中性原子模拟仿真、离子阱保真度、超导门速度、光子制造或退火式优化，
              各自适配不同工作负载和控制假设。因此，分发权力向已经拥有云关系、企业支持模型或本地部署集成足迹的经纪商和既有厂商倾斜。Atom 的访问多样性帮助它留在候选名单上， 但尚未消除云市场鼓励的货比三家动态。
