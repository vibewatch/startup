        title: 情景承销和尽调门槛
        blocks:
          - type: paragraph
            body: >-
              情景分析应保持简单，并对证据敏感。乐观情景下，Atom 按计划交付 QuNorth，把 Microsoft 和政府可信度转化为另一个具名客户，并让 IPO
              窗口保持足够久，使市场按规模化战略平台而不是单项目硬件押注来估值。基准情景下，公司仍能融资，也保持战略相关性，但公开披露只逐步改善，下一轮只以有限幅度高于当前标记完成。悲观情景下，旗舰项目延误，客户验证继续集中，或者更广泛的量子板块估值倍数压缩到足以让一家技术可信的公司也撑不住
              2026 年 7 月溢价。这个下行并非理论风险：反向市场评论已经把纯量子上市股票框定为押注突破的期权，且回撤风险很重。务实做法是要求能直接改变概率的尽调材料——D-1 条款、优先股堆叠、QuNorth
              经济性、收入确认，以及另一个付费部署证据。在这些材料出现之前，正确姿态是有纪律的好奇，而不是估值自满。
