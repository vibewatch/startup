      - number: '2.2'
        title: 证据约束下的规模测算：收入、价值池、主权预算和标杆采购视角
        blocks:
          - type: paragraph
            body: >-
              只有先收紧市场边界，公开市场规模测算才有用。短期第三方收入视角并不巨大：McKinsey 估计 2025 年量子计算公司收入刚过 $1 billion， 2028 年达到 $3.2 billion 至 $4.4
              billion；QED-C 给出相似但并不完全一致的图景，2025 年为 $1.4 billion 至 $1.9 billion， 2028 年超过 $3
              billion。这些差异已经足以说明，市场仍对定义高度敏感。BCG 对供应商在容错前能现实变现多少更加谨慎，将 2030 年供应商市场维持在仅 $1 billion 至 $2 billion，同时保留 2040
              年 $90 billion 至 $170 billion 的更大供应商收入情景，以及 $450 billion 至 $850 billion 的经济价值区间。对 Atom 而言，最有决策价值的视角既不是宽泛的
              2035 年价值池，也不是简单的 TAM 级联，而是主权预算和标杆采购视角：BCG 称公共订单已支撑超过半数市场， 英国战略承诺十年投入 £2.5 billion，美国再授权路径资助测试床和应用，DOE 希望到
              2028 年拥有一个具备科学相关性的容错平台，而 Atom 自身已经在 AIST、NERSC、AWS 和 Italy 的 ICSC
              项目中有具名证据。这足以说明市场真实存在，但若没有未公开定价、合同和利用率数据，还不足以发布清晰的中性原子特定 SAM 或 SOM。 因此，正确结论是 Atom
              可触达的早期市场偏主权和仿真密集；长期上行取决于容错采用能否接近公司自己的时间表。
