      - number: '3.2'
        title: 定价、GTM 和信任比较
        blocks:
          - type: paragraph
            body: >-
              与许多量子初创公司相比，Atom 的商业触面异常清晰，因为 AWS 公布 Aquila 费率，Atom 也单独宣传高级直接访问和本地部署。即便如此，Atom 仍不是最容易购买的供应商。 IBM
              仍是透明打包的基准，因为它在一个地方公开发布 Open plan、按量付费访问、更大的年度承诺和本地部署路径。IonQ 和 Quantinuum 是最接近的商业威胁，
              因为两者都把直接云访问与企业部署路径结合起来，Quantinuum 还增加了通过 Azure 经纪的订阅，并公开月度定价。Google 的威胁不同：Willow 在技术上重要，
              也有大型生态背书，但访问仍需提交提案，而不是像目录一样购买。Rigetti 和 D-Wave 各自增加了不同类型的信任信号——Rigetti 靠深度栈控制和可立即交付的本地部署 QPU， D-Wave
              靠可用时间、混合求解器就绪度和真实签署的系统合同。实际采购中，买家比较的不只是架构和量子比特质量，还包括能否给产品定价、快速测试、接入 HPC， 并信任供应商能够支持多年期项目。
