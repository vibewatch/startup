      - number: '2.4'
        title: 增长驱动、采用约束和估值相关性
        blocks:
          - type: paragraph
            body: >-
              Atom 的市场有三个最重要驱动。第一，主权资金和公私测试床在主流企业 ROI 出现前，就持续创造非共识需求。第二，后量子密码和安全规划迫使政府及受监管机构现在就建立量子能力，
              即便这些支出不会立即转成硬件采购。第三，市场正从炒作转向证据驱动采购；如果 Atom 的公开里程碑、伙伴栈和混合 HPC 定位强于同业，这反而利好 Atom。 但约束同样重要。BCG、Moody’s 和 IBM
              都以不同方式指出，硬件就绪度仍是瓶颈，优势主张需要反复验证。Atom 自己的调查显示，只有少数机构已把应用有效规模化； QED-C 也提示人才和供应链瓶颈。经典计算竞争是另一个重大约束：AI 和 HPC
              改进速度足以抬高每个仿真和优化用例所需的 ROI 门槛。BCG 的成本比较对估值尤其重要，
              因为买家往往想要短回本周期，而量子计算时间仍比经典计算贵得多。换句话说，这个市场可以同时战略上很大、商业上很窄。估值上，投资人应更关注 Atom 的渠道证据、 采购质量和节奏纪律，而不是最终量子经济的抽象规模。
