  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Atom 的最高等级风险不是已知丑闻，也不是某一场监管冲突；真正的风险在于，这条雄心很大的多代容错路线图，可能比当前公开叙事暗示的来得更晚、成本更高，或更难商业化复制。公司手里有可信资产：真实云访问、点名的
              AIST 合同、DARPA 阶段门、以及很深的 NVIDIA/AWS 生态。但这些资产也把下行风险集中起来。Libra 一旦延误，gigaquop
              里程碑如果后移，或者公共项目客户验证没能扩展成可复制企业需求，收入集中和融资压力会很快恶化。阅读本章应把它看成一个耦合系统。出口管制会拖慢招聘和合作；政府客户安全要求会拖慢采购；AWS 和 NVIDIA
              依赖会压缩利润率或排期弹性；客户集中会让每一次项目延误都比多元化软件公司更痛。因此，热力图把路线图压缩、客户集中、以及合规与依赖之间的相互作用，放在普通创业噪音之上。
