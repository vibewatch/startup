chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段、版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Atom Computing 称自己使用光学捕获中性原子阵列，打造高度可扩展的基于量子门的量子计算机。已采纳证据在核心事实上一致，但并不覆盖每个运营细节的细微差别。 Forge 将公司总部列为 Berkeley,
              California，并把成立时间定为 2018 年；2023 年量子比特规模新闻稿显示其在 Boulder, Colorado 设有商业运营设施，2026
              年官网则显示公司已经沿着产品、合作和招聘多线推进，而不是单纯的实验室项目。这种组合很重要，因为后续章节应把 Atom
              视为一家拥有真实商业化触面的后期非上市深科技公司，而不是尚未成品化的研究剥离项目。最显眼的商业模式，是交付本地部署系统，并搭配具备逻辑量子比特能力的硬件、
              战略伙伴集成，以及面向政府或企业的部署支持。与公开叙事围绕云市场访问展开的云优先竞争对手不同，Atom 现在公开强调 AC1000、逻辑量子比特，
              以及主权或企业部署路径。因此，公司在身份和产品定位上看起来已经越过概念验证阶段，但在运营规模、客户广度和财务成熟度披露上仍有选择性。
