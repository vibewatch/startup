        - 30+ 台超过 100 量子比特的系统，2,300+ 可用量子比特，97% 正常运行时间
        - 企业、HPC、研究机构和本地部署买方
        - 通过 IBM Quantum Platform 提供 Open、按量付费、Flex、Premium 和本地部署计划
        - 企业包装最透明、设备阵列最广；低温超导栈和纠错开销仍是真实约束
      - - Google Quantum AI
        - 既有研发对手
        - Alphabet 支持的 Willow 项目，105 量子比特基准结果
        - 顶尖研究合作者和旗舰科学伙伴
        - 选择性 Willow Early Access 加 Cirq 软件生态
        - 生态引力高、技术品牌强；近期采购入口弱，因为访问未公开
      - - IonQ
        - 商业离子阱竞争者
        - 上市公司，2026 年 Q1 收入 $64.7M，并有激进的 2026-2030 路线图
        - 企业、政府、云和数据中心运营商
        - 直接云、预留、主流 SDK 支持，以及本地部署 Forte Enterprise 系统
        - 商业重叠和渠道宽度很强；路线图野心走在当前 36 量子比特产品规模前面
      - - Quantinuum
        - 商业离子阱竞争者
        - Honeywell 支持的 Helios 平台，提供 Azure 和直接订阅
        - 企业、政府、医药、金融和先进研发买方
        - 直接订阅、云服务、Azure 分发，以及本地部署 Helios 访问
        - 高保真全栈方案，有公开经纪定价；偏企业的经济性可能放慢更广泛试验
      - - PsiQuantum
        - 光子长期竞争者
        - 政府支持的 Chicago 和 Australia 公用事业级建设
        - 主权、战略和长期企业买方
        - 今天没有广泛公开算力；平台和软件故事瞄准公用事业级 FTQC
        - 深度制造逻辑和资本强度让它具备战略重要性；即时买方可及性有限
      - - Rigetti
        - 超导挑战者
        - 全栈 Fab-1 制造商，有 108Q 云系统历史和 Novera 产品
        - 研究、政府、HPC 关联实验室、硬件测试床
        - 混合云服务，加上可立即交付的 9 量子比特本地部署 Novera QPU
        - 吸引需要硬件控制和低延迟混合工作流的买方；商业规模小于 IBM 或离子阱龙头
      - - D-Wave
        - 相邻 / 替代
        - $20M FAU 系统协议和生产级 Leap 服务
        - 优化密集型企业、公共部门、物流、制造
        - Leap 量子云、混合求解器、本地部署 Advantage2 系统，以及门模型研发
        - 今天用于优化任务的运营就绪替代方案最强；不是一对一的通用门模型竞争者
      - - AWS / Azure 经纪 + 混合 HPC 现状
        - 云经纪与内部自建替代
        - 超大规模云厂商分发，加上按量付费市场和经典 GPU 存量
        - 想推迟硬件承诺的探索型买方、平台团队和预算所有者
        - 经纪访问多个 QPU，加上 CUDA-Q 等混合开发栈
        - 最容易多宿主并比较供应商；不能消除特定模态的性能差异
    notes: 行覆盖直接中性原子同行、既有通用硬件平台、相邻替代和经纪化现状路线，这些都是 2026 年买方可以实际拿来与 Atom 比较的对象； 规模信号混合融资、设备阵列和商业化证据，而不是单一标准化指标。
