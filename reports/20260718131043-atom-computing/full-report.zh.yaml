companyProfile:
  summary: >-
    Atom Computing 是一家非上市中性原子量子计算公司，2018 年成立，总部位于 Berkeley, California。它的公开叙事已经把超过 1,200 个物理量子比特的规模、Microsoft
    支持的逻辑量子比特商业化、DARPA Stage B 验证，以及 QuNorth 首个商业本地部署结合在一起， 使其成为更可信的后期量子硬件平台之一。已宣布资本超过 $300 million，Forge 报告的 D-1 估值为
    $2.06 billion，这些都支撑公司的战略相关性； 但相对当前价格，运营模型仍明显披露不足。
