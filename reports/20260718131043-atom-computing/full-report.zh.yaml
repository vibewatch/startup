              能以数十亿美元估值获得额外资本。与此同时，披露的募资用途清楚表明 Atom 仍是重投入项目。资金将投向更高量子比特数量的系统、更好保真度、 控制系统、纠错、全球部署和团队增长。DARPA Stage B
              又补充证据，说明路线图需要持续原型开发和风险压降支出。由于公开来源没有披露现金、烧钱速度或现金跑道， 正确立场是：Atom
              当前融资状况好于许多非上市同业，但仍依赖融资。它的资本证据足以降低短期偿付担忧，但不足以排除在经济性变得广泛且可重复前继续融资的可能。
