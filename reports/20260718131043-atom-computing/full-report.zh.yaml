      - number: '8.3'
        title: 商业化、政府背书和 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              商业化和政府支持合起来看，Atom 的溢价更容易辩护。QuNorth 销售意味着 Atom 不再只是研究叙事；它有具名本地部署客户项目、具体部署目标，以及与 Microsoft 集成的产品故事。DARPA
              Stage B 和美国商务部更广泛的量子投资项目，也进一步降低了 Atom
              只是一个没有战略赞助的孤立科学项目的概率。但这些积极因素也容易被过度解读。政府资金降低偿付压力，也可能加快部署，但它不能证明可复制客户基础；单一主权旗舰项目也不等于广泛商业采用。因此，Forge
              的保密递交标签应解读为可选性，而不是 Atom 已经马上具备 IPO 条件的证据。更清晰的公开市场路径是：把 QuNorth 转化为可见的已交付收入，增加另一个具名系统买方，并在要求公开市场投资人用
              Quantinuum 式热情给故事定价之前，证明逻辑量子比特商业化可以扩展到一个旗舰项目之外。
