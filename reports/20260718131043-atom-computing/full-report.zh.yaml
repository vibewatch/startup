              是最干净的证据点，因为它是具名、客户背书、主权资助的系统项目，而不是泛泛的试点公告。但同一证据也凸显披露缺口：公开来源描述了买家、配置和 Magne 的战略重要性， 却没有披露 Atom
              的确认收入、利润率结构或服务义务。其他地方也呈现同样模式。Microsoft 的商业机器公告证明 Atom 能卖进全栈打包方案，但没有说明该方案成本多少、 收入如何分成。诚实判断是，Atom
              有收入触面和公开牵引，但缺少能让外部投资人区分一次性硬件收入与可重复平台经济性的运营披露。
