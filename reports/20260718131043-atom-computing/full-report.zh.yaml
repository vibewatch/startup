  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买家、用户、付款方和用例细分客户基础
        blocks:
          - type: paragraph
            body: >-
              Atom 可见客户基础数量不广，但类型相当清楚。最强具名证据来自一个主权背书倡议：QuNorth，由 EIFO 和 Novo Nordisk Foundation 资助，
              预期用户是北欧研究人员和产业界，核心用例是化学、材料、生物学和优化。政府和公共研究渠道与企业渠道同样重要。DARPA 的 Stage B 角色让美国政府成为重要路线图客户或赞助方； NERSC
              和更广泛的国家量子倡议也显示，公共实验室和政策背书机构正在围绕中性原子系统建设工作流。企业需求以叙事形式存在——材料科学、制药、能源、物流和工业优化—— 但 QuNorth
              生态之外的公开具名生产用户仍很稀疏。因此，正确的细分结论是，Atom 当前最强的是主权、研究和高接触技术买家；企业垂直仍通过伙伴主导和旗舰项目渠道浮现。
              围绕其他量子供应商的公开市场和私募市场报道也表明，买家仍在评估少数高知名度平台，而不是几十家可互换供应商，这提高了每个 Atom 旗舰参考案例的战略重要性。
