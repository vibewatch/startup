      - number: '1.3'
        title: 里程碑、合作伙伴与商业化证据
        blocks:
          - type: paragraph
            body: >-
              Atom 最强的公开证据来自里程碑。2023 年，公司宣布一个 1,225 位点阵列，装载大约 1,180 个量子比特，并称这是首个超过 1,000 个量子比特的通用门模型系统。2024 年和 2025
              年，Microsoft 合作把讨论从原始物理规模推向逻辑计算，Microsoft 和 Atom 展示了一台商业机器， 可纠缠 24 个逻辑量子比特，并用 28 个逻辑量子比特进行计算。随后 DARPA 选择
              Atom 进入 Quantum Benchmarking Initiative 的 Stage B， 让公司在政府主导、旨在验证实用规模路线图可信度的项目中获得可见角色。最重要的商业证据是
              QuNorth。多个独立和客户侧来源称，Atom 与 Microsoft 将把 Magne——一套 Level 2 系统，包含 50 个逻辑量子比特和 1,225 个物理中性原子量子比特——交付给一个由 EIFO
              和 Novo Nordisk Foundation 资助、丹麦方面拥有的倡议。 这很关键，因为它把 Atom
              的故事从“有前景的物理”转成一笔具体的本地部署系统采购，背后有客户所有权、具名应用和区域战略意图。Cisco、NVIDIA 和 Nu Quantum 进一步拓宽了战略网络，但 QuNorth 和
              Microsoft 仍是 Atom 将技术里程碑转化为可部署系统的最清晰证据。
