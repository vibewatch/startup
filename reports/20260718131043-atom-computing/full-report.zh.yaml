              而不是披露的客户队列或大规模云使用量。这意味着 CAC、回本周期和 NRR 等经典 SaaS 指标不只是缺失；它们也可能不是公司当前阶段的第一视角。
              更好的代理视角是项目集中度和渠道质量。按这个标准，证据喜忧参半。QuNorth 是强旗舰，Department of Commerce 和 DARPA 背景暗示异常高的战略相关性。 但 Atom
