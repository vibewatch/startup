  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - D-1 经济性
        - 条款清单、投资人名单、优先股堆叠、清算条款
        - 判断当前估值是干净的普通股价值，还是结构很重的价格
        - 领投方 / 律师审阅已签署融资文件
      - - QuNorth 收入确认
        - 合同金额、里程碑和支持义务
        - 区分头条客户证明和真实经济性证明
        - 管理层财务访谈和客户合同尽调
      - - 第二个付费部署
        - 另一笔具名系统销售，或持久的云端到本地部署转化
        - 会实质降低单一旗舰客户集中度
        - 管线审阅加客户推荐访谈
      - - 政府支持条件
        - 关闭时间、限制，以及支持是股权、拨款还是与里程碑绑定
        - 改变稀释测算和治理含义
        - 审阅 DoC 文件和董事会材料
      - - IPO 准备度
        - 保密申报措辞背后的经审计报表、投行和时间假设
        - 检验公开市场可选性是真实存在，还是只是探索
        - 管理层问答和公开申报跟踪
      - - 经营模型
        - 硬件毛利、维护收入和服务负担
        - 决定 Atom 能否越过定制化旗舰项目，规模化复制
        - 收入桥、毛利拆解和部署单元经济性材料
    notes: 问题刻意问得很具体，因为 Atom 的估值比它的经济性和资本结构细节更容易观察。
