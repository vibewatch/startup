      - number: '8.2'
        title: 融资背景和可比公司栈
        blocks:
          - type: paragraph
            body: >-
              理解 Atom 的价格，最好看融资动能和相对估值，而不是近端盈利能力。Forge 显示，Atom 在 2026 年 6 月的 C-1 估值为 $714.4 million，到 2026 年 7 月 D-1
              标记升至 $2.06 billion，同时还显示一笔 $89.07 million 融资。一家公开收入画像仍基本未披露的公司遇到这样的重估，幅度很陡。相对可比公司解释了市场为何仍可能容忍。IonQ
              已经有可观收入，公开市值接近 $13 billion；Quantinuum 2026 年 6 月 IPO 目标约 $14.3 billion，并募资 $1.68 billion；PsiQuantum
              仍凭公用事业级雄心支撑 $7 billion 私营估值；D-Wave 和 Rigetti 等上市公司即便收入基数有限，也继续以数十亿美元市值交易。因此，Atom
              在量子公司群中并不算被错分，但它确实需要持续执行，才能守住一个比公开运营披露更快到来的溢价重估。
