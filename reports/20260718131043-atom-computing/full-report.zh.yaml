      - number: '2.3'
        title: 按细分市场拆解买家、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Atom 的买家地图比泛泛的“企业量子”故事更分层。当前最强买家类别是政府和国家实验室基础设施：付款方是主权或研究项目预算，用户是计算科学家或平台团队， 采用触发点是国家能力目标，而不是一年期企业 ROI
              门槛。这就是 AIST、NERSC 和 ICSC 远比普通市场调研数据点重要的原因。第二层是企业共创：BCG X 和 Deloitte 都把 Atom 定位为企业、政府和 HPC
              中心的合作伙伴，这些客户在大规模购买硬件时间前，需要先完成用例发现、基准设计和集成规划。在企业层里，制药和生命科学今天比金融更可信， 因为 Atom 有公开的生物学和药物发现项目；金融仍主要通过行业研究项目和
              Atom 之外的混合试点可见。材料、化学和能源也在结构上重要，因为仿真是 QED-C、McKinsey、AWS 和 Pawsey
              所共同指向的最有形短期用例集群。金融仍是长期目标，因为价值池很大、银行也在积极学习，但 Atom 自己的调查和公开银行证据都暗示其规模化更晚：
              金融机构需要安全的混合环境、量子安全迁移计划，以及更强的实用性证据，之后才会成为重复买家。也就是说，Atom 的采用路径是先云端探索，再共创设计，再主权或实验室锚点部署， 最后才是更广泛的企业生产工作负载。
