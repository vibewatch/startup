              公开采用轨迹更多由具体里程碑衡量，而不是客户数量。QuNorth 是关键事件，因为它把 Atom 的产品故事转成一个具名商业本地部署，带有客户资金、逻辑量子比特配置和明确时间安排。 Magne 系统预计在
              2027 年初前后投入运行，这意味着当前证据在承诺和配置上很强，但在实际使用上仍有一部分是未来时。QuNorth 之外，最强的邻近证据来自政策和项目对齐： DARPA QBI、NERSC
              的中性原子征集，以及支持量子能力建设的政策框架。这些证据有价值，因为它们展示需求路径，但它们不等同于一份已披露的付费生产账户名单。
              已采纳公开来源也没有给出总装机基础、客户队列或多个企业账户的部署节奏。因此，采用路径应被解读为真实但集中：Atom 已跨过从理论到旗舰客户证据的门槛，
