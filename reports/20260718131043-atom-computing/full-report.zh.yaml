      - number: '1.2'
        title: 创始人、领导层、投资人和治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开创始人记录比 Atom 的融资记录更薄，但足以支撑后续章节。Forge 将 Benjamin Bloom 和 Jonathan King 识别为创始人； Atom 自身当前材料和外部伙伴材料则一致把 Ben
              Bloom 放在创始人 CEO 角色。资本可见度明显更好。公司和 PR Newswire 都披露，截至 2026 年 6 月， 累计融资超过 $300 million，其中包括 Third Point
              Ventures 领投、DCVC 和 Cisco Investments 参投的 $100 million Series C，以及另一笔 $100 million Department of Commerce
              意向书。DCVC 自身评论更进一步，将政府支持描述为股权，这提高了 Atom 与政策对齐的战略重要性， 即便具体法律文件仍未公开。Forge 又补上一层，报告 2026 年 7 月 Series D-1 估值为
              $2.06 billion、融资约 $89 million；但该估值来自基于 COI 的市场数据展示，
              不是公司新闻稿披露的轮次信息，因此应视为强方向性证据，而不是完整披露的定价轮透明度。治理披露仍明显弱于融资披露：已采纳公开记录识别了领导者和投资人， 但没有给出完整董事会图谱、委员会结构或详细少数股东保护条款。
