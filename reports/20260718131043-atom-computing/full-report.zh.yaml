        title: 监管、法律和主权风险
        blocks:
          - type: paragraph
            body: >-
              Atom 面临的法律风险，首先是政策边界问题，而不是已经摆到台面的诉讼问题。美国出口管制如今覆盖量子计算机、组件、软件和技术，已发布规则明确考虑部分外籍人员访问的视同出口和再出口可见性。这一点很关键，因为
              Atom
              正是依赖国际研究人才、跨境合作者和主权客户项目的公司。联邦和关键基础设施采购的重要性，也高于普通创业公司法律模板所暗示的水平。OMB、CISA、NIST、白宫以及后续法律评论都指向同一个方向：后量子迁移和承包商网络安全义务，正在成为联邦生态的运营要求，而不是抽象的长期主题。英国则通过
              NQCC 和 National Security and Investment Act
              框架加入主权视角。与此同时，公开法律案卷和专利检索工具虽然存在，但保留的公开证据仍无法给出经律师确认的诉讼或自由实施结论。因此，投资人应把法律风险按“合规执行 + 尽调不完整”来承销，而不是把它当成健康证明。
