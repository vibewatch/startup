      - number: '2.5'
        title: 矛盾、未解问题和仍需尽调事项
        blocks:
          - type: paragraph
            body: >-
              本章最大的两个矛盾应被保留，而不是被平均掉。第一个是市场规模框架：短期收入视角集中在低个位数十亿美元，但长期价值池估计会跃升到数十亿或数千亿美元，
              取决于来源衡量的是供应商收入、行业创造价值，还是更宽泛的量子技术伞。第二个是时间线：Atom 和 AWS 把 2028 年描述为可通过云访问的容错工作流起点， BCG 却仍把全面容错放在 2040
              年之后。没有额外尽调，不能把两种观点同时当作基准情景。还有一些重要缺口。公开证据没有隔离出中性原子特定 SAM， 没有披露 Atom 的定价或部署经济性，也没有验证 Atom
              在金融领域的具名客户，除了一般性行业实验。这些遗漏很重要，因为 Atom 的估值不太取决于“量子”在抽象意义上是否是大品类， 更取决于 Atom
              能否在经典替代方案继续改进前，把一小组锚点渠道转成可重复商业合同。因此，实际尽调路径是要求披露垂直行业收入组合、定价和利用率假设、金融领域具名设计伙伴证据， 以及对 Libra
              时间表的外部技术审查。在这些材料可得之前，市场逻辑应被视为战略方向强、在政府和 HPC 最强，但企业转化经济性仍不完整。
