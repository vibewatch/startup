  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代品
        blocks:
          - type: paragraph
            body: >-
              Atom 应放在量子计算硬件与服务市场内分析，但即便在这个市场内，它的实际边界也比许多标题式 TAM 幻灯片更窄。相关支出不是“所有量子技术”，甚至也不是每一美元量子计算支出。 Atom
              可触达的层，是通过云访问、本地部署系统、混合 HPC 集成和应用共创出售的中性原子量子能力，面向那些需要仿真或优化工作负载、且这些负载未来可能超过经典方法的买家。 这个边界包括 Aquila 和未来 Braket
              访问、AIST 式本地部署路径，以及与算法开发和集成相关的服务工作。它不包括量子传感、量子通信或 QKD，也不包括多数后量子密码迁移预算， 因为这些类别可以快速增长而无需购买 Atom
              硬件。因此，现状替代品不是“什么都没有”，而是经典 HPC、GPU 密集型 AI 仿真、经典优化软件和量子安全软件迁移。 BCG 提醒量子计算今天相对经典计算仍没有可触知商业优势，这一点很关键，因为它意味着
              Atom 竞争的对象是快速改进的替代方案，而不只是其他量子供应商。中性原子仍然相关， 因为 AWS、Braket 和 Atom 都把这种模态与仿真和优化任务相连，而这些任务重视几何结构、可重构性和类全连接。
