- id: adoption-trajectory-and-proof
  title: Adoption trajectory and named customer proof
  body: 'The public adoption trajectory is measured less by customer count and more by concrete milestones. QuNorth is the pivotal event because it converts Atom’s product story into a named commercial on-premises deployment with customer funding, logical-qubit configuration, and explicit timing. The Magne system is expected to be operational around early 2027, which means the current proof is strong on commitment and configuration but still partly future-tense on realized usage. Beyond QuNorth, the strongest adjacent proof comes from policy and program alignment: DARPA QBI, NERSC’s neutral-atom call, and the policy frameworks that support quantum capability-building. Those are valuable because they show demand pathways, but they are not the same as a disclosed roster of paying production accounts. Public retained sources also do not give a total installed-base number, a customer cohort, or a deployment cadence across multiple enterprise accounts. So the adoption path should be read as real
    but concentrated: Atom has crossed the threshold from theory to flagship customer proof, yet it has not publicly crossed the threshold to broad portfolio visibility. This also means the next refresh should specifically test whether Magne has moved from commitment into measurable user activity and repeat workload demand.'
