company:
  name: Atom Computing
chapter:
  number: 6
  title: Customers
  summary: 'Atom’s customer proof is real but concentrated. QuNorth is a meaningful flagship because it combines sovereign funding, a named buyer, a logical-qubit system, and a planned on-premises deployment in Copenhagen, while DARPA, NERSC, and broader public-sector policy support indicate that government and research buyers are central to the near-term customer base. What remains missing is breadth: public sources do not disclose total customer count, retention, or concentration, so the current customer story supports credibility more than durability.'
sections:
- id: customer-base-segmentation
  title: Customer base segmentation by buyer, user, payer, and use case
  body: 'Atom’s visible customer base is not broad in count, but it is fairly clear in type. The strongest named proof sits in a sovereign-backed initiative: QuNorth, funded by EIFO and the Novo Nordisk Foundation, with Nordic researchers and industries as intended users and chemistry, materials, biology, and optimization as core use cases. Government and public-research channels matter just as much as enterprise channels. DARPA’s Stage B role makes the U.S. government an important roadmap customer or sponsor, while NERSC and broader national-quantum initiatives show that public labs and policy-backed institutions are building workflows around neutral-atom systems. Enterprise demand is present in narrative form—materials science, pharmaceuticals, energy, logistics, and industrial optimization—but public named production users outside the QuNorth ecosystem remain sparse. The right segmentation conclusion is therefore that Atom is currently strongest with sovereign, research, and high-touch
    technical buyers, with enterprise verticals still emerging through partner-led and flagship-program channels. Public-market and private-market coverage across other quantum vendors also suggests buyers continue to evaluate a small number of high-profile platforms rather than dozens of interchangeable providers, which increases the strategic importance of each flagship reference for Atom.'
