- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Current revenue / ARR
    - Blocks fundamental valuation and trend analysis
    - Request trailing-12-month revenue bridge and monthly run rate.
  - - Gross margin and COGS detail
    - Blocks quality-of-revenue analysis
    - Request hardware, software, and services cost breakdown.
  - - Cash, burn, and runway
    - Blocks solvency timing analysis
    - Request latest board package or treasury summary.
  - - Customer concentration
    - Blocks durability analysis
    - Request revenue by top customers and stage.
  - - Pricing and contract economics
    - Blocks unit-economics modeling
    - Request standard pricing schedules and realized discounts.
  - - D-1 investor list and preferences
    - Blocks clean dilution analysis
    - Request cap table and financing documents.
  notes: These gaps are the minimum set of private metrics required for an investable bottom-up model.
