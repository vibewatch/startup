- id: gtm-and-unit-economics-proxies
  title: GTM motion and unit-economics proxies
  body: 'The public go-to-market motion looks consultative and infrastructure-heavy rather than software-like. Atom’s strongest proof comes from strategic programs—QuNorth, Microsoft, DARPA, and public-sector ecosystem demand—rather than from disclosed customer cohorts or volume cloud usage. That means classic SaaS measures such as CAC, payback, and NRR are not merely missing; they may also be the wrong first lens for the company’s current phase. The better proxy lens is project concentration and channel quality. On that score, the evidence is mixed. QuNorth is a strong flagship, and the Department of Commerce and DARPA context suggest unusually high strategic relevance. But Atom has not yet shown that flagship programs convert into a diversified base of repeatable commercial contracts. Public quantum filings from IonQ, Rigetti, and D-Wave reinforce why this matters: even companies with more disclosure and real revenue can still carry heavy losses, financing needs, and uneven revenue mix.
    Atom’s GTM story is therefore credible enough to stay investable, but not mature enough to score as efficient or durable from public data alone.'
