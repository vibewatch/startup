- id: financial-people-and-kill-criteria
  title: Financial, people, and thesis-break criteria
  body: 'Financial and execution risk remain tightly linked. The 2025 financing meaningfully improved Atom''s position,
    but public evidence still does not show burn, cash, runway, or the concentration of current revenue behind AIST
    and other named programs. That means investors cannot cleanly separate technological progress from financing
    risk. The commercial environment is also less forgiving than peak-hype quantum narratives implied. Atom''s
    own 2026 market report describes proof-driven procurement, flat budgets for many buyers, sovereignty filters,
    and a specialist talent shortage led by quantum error correction. Those are exactly the frictions that can slow
    a company trying to move from public technical leadership into scalable enterprise adoption. People risk therefore
    matters as much as hardware risk: Atom must recruit and retain scarce QEC, platform, and field-support talent
    while managing more government, sovereign, and partner interfaces. The mitigation logic is still credible—DARPA
    validation, strong partners, meaningful public programs, and more than $230 million of recent capital—but those
    mitigants are partial. A thesis-break is not merely a missed experiment; it is any combination of roadmap slip,
    repeat-customer failure, punitive financing, or missing compliance packets that turns a technically credible
    company into a perpetually deferred commercialization story.'
