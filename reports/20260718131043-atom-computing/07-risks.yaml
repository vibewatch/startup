company:
  name: Atom Computing
chapter:
  number: 7
  title: Risks
  summary: Atom's risk profile is led by aggressive fault-tolerant roadmap execution, concentrated public-program
    customer proof, and a tightening regulatory perimeter around export controls and government-security obligations.
    DARPA stage gates, AWS and NVIDIA partnerships, and large sovereign or HPC deployments mitigate some risk but
    also create correlated dependencies. The company is technically credible and better capitalized than many peers,
    yet public disclosure on burn, customer concentration, export-license history, and security assurance remains
    too thin to treat the business as de-risked.
sections:
- id: risk-overview
  title: Severity-ranked risk overview
  body: Atom's highest-severity risk is not a known scandal or a single regulatory fight; it is the possibility
    that an ambitious, multi-generation fault-tolerant roadmap arrives later, costlier, or less commercially repeatable
    than the current public narrative implies. The company has credible assets—real cloud access, a named AIST contract,
    DARPA stage-gates, and a deep NVIDIA/AWS ecosystem—but those same assets concentrate the downside. If Libra
    slips, if gigaquop milestones move right, or if public-program customer proof fails to broaden into repeatable
    enterprise demand, revenue concentration and financing pressure can worsen quickly. The right way to read the
    chapter is as a coupled system. Export controls can slow hiring and partnerships; government-customer security
    requirements can slow procurement; AWS and NVIDIA dependencies can compress margins or schedule flexibility;
    and customer concentration can make each program delay more painful than it would be for a diversified software
    business. The heatmap therefore weights roadmap compression, customer concentration, and compliance-plus-dependency
    interactions above more ordinary startup noise.
  claimRefs:
