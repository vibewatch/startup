- id: regulatory-legal-and-sovereignty
  title: Regulatory, legal, and sovereignty risk
  body: 'For Atom, legal risk is primarily a policy-perimeter problem rather than a visible courtroom problem.
    U.S. export controls now cover quantum computers, components, software, and technology, and the published rule
    specifically contemplates deemed-export and reexport visibility for some foreign-national access. That matters
    because Atom is exactly the kind of company that relies on international research talent, cross-border collaborators,
    and sovereign customer programs. Federal and critical-infrastructure procurement also matters more than generic
    startup legal boilerplate would suggest. OMB, CISA, NIST, the White House, and later legal commentary all point
    in the same direction: post-quantum migration and contractor cybersecurity obligations are becoming operational
    requirements for federal ecosystems, not abstract long-term themes. The U.K. adds a sovereignty lens through
    NQCC and the National Security and Investment Act framework. Meanwhile, public legal-docket and patent-search
    tools exist, but the retained public evidence still does not provide a counsel-cleared answer on litigation
    or freedom-to-operate. Investors should therefore underwrite legal risk as compliance execution plus diligence
    incompleteness, not as a clean bill of health.'
  claimRefs:
