evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, shareholder control rights, and any special governance terms tied to major investors.
    whyItMatters: >-
      Without board and control-right visibility, it is hard to assess founder control, downside protections, and
      whether strategic investors can shape operating decisions.
    diligencePath: Request the current cap table, board observer list, and investor rights summary from management or lead counsel.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-bench coverage for TO002
    missingEvidence: >-
      Full biographies, tenure dates, and complete board-level leadership disclosure for the executive bench shown in
      TO002.
    whyItMatters: >-
      The visible executive lineup is good enough for a public snapshot, but the absence of fuller biographies and
      governance links limits deeper key-person and succession analysis.
    diligencePath: >-
      Collect management bios, organizational chart excerpts, and any board or committee disclosures that connect
      leaders to responsibilities and reporting lines.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A reconciled total capital raised figure after the undisclosed January 2026 Pacific Alliance Ventures investment,
      including whether any secondaries were part of the event.
    whyItMatters: Valuation alone does not reveal dilution, investor economics, or the actual cash added to the balance sheet.
    diligencePath: >-
      Obtain the financing deck or board-approved financing summary showing proceeds, security type, and post-money
      ownership.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A management-confirmed 2026 headcount by geography and function.
    whyItMatters: >-
      Public sources disagree on whether Cast AI is closer to roughly 200 employees or above 300, which affects
      operating-leverage and execution-capacity judgments.
    diligencePath: Request an HR snapshot or investor-update headcount table by office and function as of Q2 2026.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology coverage for TO004
    missingEvidence: >-
      A full dated chronology of every financing, major product launch, leadership change, and regional office opening
      through the 2026 run date.
    whyItMatters: >-
      The public milestone table is sufficient for the main storyline but not exhaustive, so omitted events could still
      matter for diligence sequencing and change management.
    diligencePath: >-
      Request the company timeline used in board decks or PR planning and reconcile it against the public newsroom
      archive.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: cast-specific-sam
    missingEvidence: >-
      A market study that sizes only the overlap of Kubernetes cost management, multicloud FinOps, and AI/GPU
      optimization relevant to Cast AI.
    whyItMatters: >-
      Headline CloudOps or cloud FinOps TAMs materially overstate the investable opportunity if they are used without
      narrowing assumptions.
    diligencePath: >-
      Commission a bottoms-up market model using customer spend cohorts, cluster scale, and AI workload intensity
      instead of generic research-house categories.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: buyer segmentation detail
    missingEvidence: >-
      Vertical-by-vertical evidence on which industries and company sizes most often buy third-party Kubernetes
      optimization instead of relying on native tools.
    whyItMatters: Without better vertical conversion data, segment priority remains more qualitative than quantitative.
    diligencePath: >-
      Review customer roster by industry, ACV, cloud footprint, and primary replacement pattern versus native or
      internal tooling.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: native-tool displacement
    missingEvidence: >-
      Empirical conversion data showing how often enterprises graduate from native controls to third-party optimization
      vendors and why.
    whyItMatters: >-
      Third-party penetration depends on proving that native or open-source substitutes leave enough unmet need to
      justify incremental spend.
    diligencePath: >-
      Ask management for win/loss reasons, POC conversion data, and displacement evidence versus Autopilot, AKS,
      Karpenter, Kubecost, and internal platform teams.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM001
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Signed enterprise contracts or at least anonymized price sheets showing realized Cast AI, Flexera Ocean,
      StormForge, and Kubex pricing by cluster size.
    whyItMatters: >-
      Public list pricing is limited, which makes price-to-value and win-rate analysis much weaker than feature
      comparison.
    diligencePath: >-
      Request current enterprise quotes, pricing cards, and implementation SOWs for at least three recent competitive
      evaluations.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Recent competitive win-loss data showing Cast AI performance against Flexera Ocean, IBM Kubecost, and native-cloud
      substitutes by segment.
    whyItMatters: >-
      Without actual conversion or churn data, moat durability remains an informed judgment rather than an underwritten
      fact.
    diligencePath: >-
      Ask management for the last 12 months of competitive opportunities, renewal saves, and lost-deal reasons segmented
      by cloud topology.
    relatedQuestionRefs:
      - QP024
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: competitor-scale
    missingEvidence: Consistent public metrics on StormForge and Kubex customer counts, deployment scale, or current funding footing.
    whyItMatters: Scale helps distinguish niche feature overlap from true enterprise competition and influences channel durability.
    diligencePath: >-
      Pull private-market databases or vendor-provided references to fill current-scale gaps for smaller private
      competitors.
    relatedQuestionRefs:
      - QP008
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: gpu-adoption
    missingEvidence: >-
      A clear breakout of Cast AI revenue or customer adoption attributable to GPU, AI, or non-core Kubernetes
      optimization modules.
    whyItMatters: >-
      GPU positioning is a central moat argument, but public evidence does not show whether it is material or still
      mostly narrative.
    diligencePath: >-
      Request module-level ARR, customer counts, and attach rates for GPU- and AI-related products launched in
      2025-2026.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-growth
    missingEvidence: Current ARR, TTM revenue, growth rate, and revenue mix by core optimization versus newer AI or GPU products.
    whyItMatters: Without core revenue and growth data, valuation and sales-efficiency underwriting cannot be performed responsibly.
    diligencePath: Request latest board KPI pack and monthly revenue bridge by product module.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-burn
    missingEvidence: >-
      Gross margin, hosting / support costs, burn, cash balance, runway assumptions, and comparable internal margin
      bridges for new GPU products.
    whyItMatters: >-
      These metrics determine whether Cast behaves like a high-margin software company or a more capital-intensive
      infrastructure business, and whether public comps can be used responsibly.
    diligencePath: Request detailed P&L, cash-flow statement, and budget plan including GPU / OMNI cost buckets.
    relatedQuestionRefs:
      - QI016
      - QI017
      - QI023
      - QI024
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: contract-structure
    missingEvidence: Sample customer contracts showing subscription, usage, savings-share, support, and renewal mechanics.
    whyItMatters: Revenue quality and pricing power depend on the exact contract design, not just headline starting price signals.
    diligencePath: Review recent enterprise MSAs, order forms, and renewal exhibits across customer segments.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Net revenue retention, gross retention, logo churn, and top-customer concentration metrics.
    whyItMatters: Case-study savings prove value for some customers but do not prove repeatability or portfolio resilience.
    diligencePath: Request cohort analysis, renewal dashboard, and top-10 customer revenue share.
    relatedQuestionRefs:
      - QI018
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gpu-monetization
    missingEvidence: Revenue contribution, take rate, and gross-margin profile of OMNI Compute and GPU-related products.
    whyItMatters: The AI / GPU narrative may improve growth but could materially alter cost structure and valuation framing.
    diligencePath: Request module-level bookings, revenue, and gross-margin breakout for GPU / marketplace products.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: omni-ga
    missingEvidence: GA timeline, design-partner count, and production-scale deployment data for OMNI Compute.
    whyItMatters: >-
      OMNI is central to the AI / GPU moat narrative, but early-access status means production maturity is not yet
      obvious.
    diligencePath: Request OMNI customer references, SLA model, and GA roadmap with production-scale usage metrics.
    relatedQuestionRefs:
      - QE005
      - QE025
    relatedTableRefs:
      - TE005
  - type: private-evidence-only
    severity: material
    topic: security-transition
    missingEvidence: >-
      Detailed roadmap for deprecated and moved Kvisor / security features, including support guarantees during
      migration.
    whyItMatters: >-
