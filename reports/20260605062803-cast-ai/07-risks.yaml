- id: operational-quality-and-security-risk
  title: Operational, Quality, and Security Risk
  body: 'Operationally, Cast AI is exposed because it is not sitting outside the stack; it is making or influencing changes inside clusters. The platform-permissions docs show that the product depends on explicit permissions, data collection, port openings, and access to cluster/cloud metadata. The database-optimizer security docs reinforce that data minimization matters: query SQL is anonymized, parameters are hashed, and retention is intentionally limited. Those are good controls, but they also underscore that Cast is touching meaningful telemetry and infrastructure pathways. Security-specific risk is similarly double-sided. Kvisor is documented as an open-source security agent with image scanning, runtime monitoring, and network observability, yet several security docs warn that the feature set is undergoing significant changes and that some functionality is being deprecated or moved. That creates change-management risk for customers who care about stable control frameworks. Finally,
    external outage aggregators make clear that reliability is not invisible: StatusGator and IsDown both track incidents, and IsDown reports a non-trivial history of outages since January 2025. For a product operating in mission-critical Kubernetes environments, even short disruptions or configuration errors can have outsized reputational consequences.'
