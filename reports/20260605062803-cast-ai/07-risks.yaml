- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Area
  - Existing mitigation
  - Residual concern
  - Kill criterion / escalation trigger
  rows:
  - - Privacy / legal
    - Terms, privacy policy, DPA, processor framing
    - Customer-specific data flows still need validation
    - Cannot clearly explain controller / processor boundaries or breach obligations
  - - Security governance
    - ISO 27001, SOC 2 Type II, CIS-certified reporting, Kvisor
    - Security features are evolving and need configuration
    - Cannot show current roadmap, audit evidence, or migration support
  - - Operational reliability
    - Public docs, status surfaces, and resume / permissions guidance
    - External incidents and misconfiguration still possible
    - No credible MTTR history or incident-management narrative
  - - Dependency risk
    - Multicloud value proposition and provider integrations
    - Cloud outages and GPU scarcity remain upstream constraints
    - No fallback plan for provider or capacity disruption
  - - Execution risk
    - Security pedigree and hiring culture
    - Broadening platform may outrun docs and support
    - Org cannot demonstrate enough product, support, and security capacity to sustain expansion
  notes: The table converts public mitigations into explicit diligence thresholds so that control signals are not mistaken for fully closed risk.
