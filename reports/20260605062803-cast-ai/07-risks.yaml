company:
  name: Cast AI
chapter:
  number: 7
  title: Risks
  summary: 'Cast AI''s risk profile is driven less by product-market doubt than by execution, dependency, and trust requirements that come with automating customer infrastructure. The company has meaningful mitigants—legal contracting, a DPA, ISO 27001, SOC 2 Type II, CIS-certified security reporting, open-source security components, and public docs on permissions and data handling—but also clear exposure to IAM misconfiguration, upstream cloud incidents, evolving security features, and the absence of public retention or concentration data. The public file supports a medium overall risk rating: enterprise-grade controls exist, yet the product touches mission-critical systems deeply enough that documentation gaps, partner dependence, or operational failures could still have outsized consequences.'
sections:
- id: legal-privacy-and-compliance-risk
  title: Legal, Privacy, and Compliance Risk
  body: The legal and privacy framework around Cast AI is substantive, which is good, but it also reveals where the company is exposed. The Terms of Service are a binding order-form model effective February 2025, meaning disputes, suspension rights, onboarding responsibilities, and service access are contractually centralized. The privacy policy and DPA go further by splitting controller responsibilities between the U.S. entity and the Lithuanian entity and by explicitly placing Cast in the processor role for customer-uploaded cloud-service data. That helps enterprise buyers frame GDPR and U.S. privacy obligations, but it also means Cast's compliance burden is real and cross-border. The information security policy, SOC 2 Type II announcement, CIS certification press release, and CIS partner page provide meaningful trust signals, especially for regulated or security-sensitive buyers. Still, those are control-layer mitigants, not proofs that every enterprise deployment is low risk. The product
    operates inside customer Kubernetes environments, so any mismatch between contractual processor obligations, actual permissions granted, and real-world incident handling could create legal exposure, audit pain, or slowed procurement in regulated segments. A further wrinkle is that outside commentary shows AI-governance requirements are tightening in 2026, which may increase diligence burden as Cast expands AI-oriented tooling around model and GPU workflows.
