tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  columns:
  - Risk
  - Why it exists
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Contractual suspension / access risk
    - Terms govern service access and onboarding acceptance through binding order forms
    - Terms of Service effective Feb. 6, 2025
    - Medium
    - Review suspension, termination, and limitation clauses against enterprise risk appetite
  - - Cross-border privacy governance
    - Controller roles split across U.S. and Lithuanian entities while customer data is processed globally
    - Privacy Policy + DPA
    - Medium
    - Map customer jurisdiction to controller / processor responsibilities
  - - Data-processing compliance
    - Processor obligations attach when customer personal data flows through Cast services
    - DPA references GDPR, CCPA, and other privacy laws
    - High
    - Validate SCCs, subprocessors, and breach-notification mechanics
  - - Procurement / audit burden
    - Security certifications help but procurement teams will still test deployment-specific controls
    - SOC 2, ISO 27001, CIS materials
    - Medium
    - Request latest reports, bridge letters, and customer-control matrix
  - - Regulated-customer expansion risk
    - Finance, telecom, and global enterprises can impose more demanding compliance requirements
    - Named customers and CIS alignment
    - Medium
    - Assess whether product evidence meets target vertical requirements
  notes: The legal register focuses on risks created by the company’s own contracts, privacy roles, and security/compliance obligations rather than broad macro regulation alone.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most visible legal and regulatory risk buckets evidenced in the public file and are not a complete legal memo on every possible jurisdiction or product use case.
