callouts:
- calloutType: risk
  title: Trust risk is operational, not just legal
  body: The biggest risk is not whether Cast has policies. It is whether a product that touches customer infrastructure this deeply can keep permissions, documentation, incident response, and evolving feature surfaces aligned in production.
  claimRefs:
  - CR008
  - CR010
  - CR016
  - CR025
  - CR033
- calloutType: recommendation
  title: Demand deployment-specific evidence, not only certifications
  body: SOC 2, ISO 27001, CIS certification, and public legal pages are positive signals, but diligence should still demand incident metrics, permission maps, and a clear security-transition roadmap for the buyer’s exact deployment shape.
