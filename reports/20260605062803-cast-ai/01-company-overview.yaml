company:
  name: Cast AI
chapter:
  number: 1
  title: Company Overview
  summary: Cast AI is a Miami-headquartered, Vilnius-centered cloud automation company founded in 2019 by Yuri Frayman, Laurent Gil, and Leon Kuperman after their Zenedge experience exposed the cost and reliability pain of scaling cloud infrastructure. Public evidence confirms an oversubscribed $108M Series C at roughly an $850M valuation in April 2025, followed by an undisclosed Pacific Alliance Ventures investment that pushed valuation above $1B in January 2026 as the company launched OMNI Compute for cross-cloud GPU access. The public file also shows real enterprise customer proof and strong cost-saving case studies, but exact post-2026 total capital, board control, and precise headcount remain opaque.
sections:
- id: identity-and-platform
  title: Identity and Platform Narrative
  body: 'Cast AI should be understood as more than a dashboarding or cost-visibility vendor. Official materials consistently position the company as an Application Performance Automation platform that began with Kubernetes cost optimization and has expanded into broader infrastructure automation, AI workload efficiency, and cross-cloud GPU provisioning. The origin story is unusually coherent: the founders say Cast AI was created after the team struggled with runaway cloud bills while scaling Zenedge before Oracle acquired that business in 2018. Public company and investor materials anchor legal founding in 2019 and link the business model to automated rightsizing, autoscaling, bin packing, spot management, and continuous performance-aware infrastructure decisions. The January 2026 OMNI Compute launch pushed the narrative another step forward by framing Cast AI as a control plane for external compute and GPU capacity, not just a savings layer inside one Kubernetes cluster. That matters because
    it broadens the company from FinOps tooling into AI infrastructure orchestration while preserving the core promise of better performance with less manual work and no application rewrites.'
