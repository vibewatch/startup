- id: traction-milestones-and-risk-signals
  title: Traction, Milestones, and Risk Signals
  body: 'Customer proof is one of the strongest parts of Cast AI''s public file. Across official funding and launch materials, the company names Akamai, BMW, Cisco, FICO, HuggingFace, NielsenIQ, Swisscom, Samsung, and TGS, while case studies provide deeper evidence that the platform is used in production rather than only tested in pilots. NielsenIQ reported 60-80% savings on non-production clusters and payback within two months; project44 reported 50% compute-cost savings within one month on its initial rollout; and Branch described a path to lower EC2 spend without spot-related incidents. These studies reinforce management''s claim that Cast AI increasingly sells reliability and automation, not only lower bills. Milestone quality is also decent: the company ties its 2025 Series C to Application Performance Automation, its 2026 launch to OMNI Compute, and its geographic expansion to India, Singapore, and additional regional offices. The risk side is subtler but real. Cybernews flagged setup
    complexity, reporting limitations, and higher pricing for smaller teams, while StatusGator showed that service-health incidents can still surface around Kubernetes node provisioning. Headcount and capital totals also remain imprecise in public sources.'
