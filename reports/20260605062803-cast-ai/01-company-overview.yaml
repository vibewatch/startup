callouts:
- calloutType: strength
  title: Customer proof is unusually concrete for a private infrastructure company
  body: Cast AI does not rely only on logo slides. Public financing materials repeatedly name major customers, and the company also publishes detailed case studies with quantified savings, deployment context, and implementation commentary from engineers at NielsenIQ, project44, and Branch. That makes the adoption story meaningfully stronger than a typical private infra startup narrative built only on investor quotes.
  claimRefs:
  - CO008
  - CO030
  - CO031
  - CO032
- calloutType: risk
  title: The unicorn milestone is credible, but the 2026 economics are still opaque
  body: Public sources support the April 2025 ~$850M step-up and the January 2026 move above $1B after Pacific Alliance Ventures invested. But the 2026 amount, security type, and resulting total capital raised were not disclosed, leaving real uncertainty around dilution, secondary mix, and preference overhang. Public workforce estimates are also inconsistent, and reviewer feedback shows that adoption can still be demanding for smaller or less mature teams.
  claimRefs:
  - CO019
  - CO021
  - CO022
  - CO027
  - CO038
