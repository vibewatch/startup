  - - StormForge
    - Rightsizing specialist
    - CloudBolt-owned optimization product
    - Teams that want guardrailed workload-level tuning
    - Autonomous vertical rightsizing that works with HPA and GitOps-friendly workflows
    - Narrower than a full multicloud optimization suite
  - - Kubex
    - Rightsizing plus AI / GPU optimization
    - Rebranded Densify / private enterprise software vendor
    - Large enterprises optimizing Kubernetes, nodes, and GPU-heavy workloads
