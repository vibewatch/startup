    - Enterprise-heavy positioning and less evidence of broad self-serve adoption
  - - Native cloud tools
    - Provider-native substitute
    - Built into AWS, Google Cloud, and Azure platform contracts
    - Single-cloud platform teams
    - Can be included or preconfigured inside the cloud stack with strong native integration
    - Usually single-cloud and fragmented across providers
  - - OpenCost / internal build
    - Open-source and process substitute
    - Vendor-neutral open source plus in-house engineering effort
    - Cost-conscious teams with sufficient platform talent
    - Low-cost visibility floor and flexible internal composition
    - Does not provide one-click autonomous execution out of the box
