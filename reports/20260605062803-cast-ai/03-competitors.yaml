  - - Flexera Ocean / former Spot
    - Automation-first FinOps and container optimization
    - Spot portfolio now owned by Flexera
    - Enterprises and MSPs seeking automated workload-cost reduction inside a broader FinOps suite
    - AI/ML-driven container optimization tied to a wider cloud-financial-management portfolio
