- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Cross-cloud automation is harder to replicate than single-cloud tooling
    - Hyperscalers keep adding native node provisioning and cost controls
    - High
    - GKE Autopilot and AKS NAP already automate meaningful parts of the workflow
    - Ask for win rates against native tools in single-cloud accounts
  - - One platform can unify visibility and execution
    - OpenCost plus native cloud tooling can be assembled modularly
    - High
    - OpenCost, Karpenter, and AKS/GKE features lower switching costs
    - Request proof that unified execution materially outperforms modular alternatives
  - - GPU / AI optimization creates new differentiation
    - Broad FinOps suites may bundle AI budget controls faster than Cast scales distribution
    - Medium
    - Flexera and IBM both market broader FinOps expansion around AI-era cloud budgets
    - Verify current revenue and customer adoption from GPU-related modules
  - - Fresh capital improves product velocity
    - Large incumbents have wider enterprise channels and contract leverage
    - Medium
    - IBM, Flexera, and Turbonomic all sit inside broader enterprise motions
    - Test whether Cast still wins when bundled into wider FinOps RFPs
  - - Reviewer love signals product-market fit
    - Onboarding complexity and smaller-team pricing hurt expansion at the low end
    - Medium
    - Cybernews and competitor-authored comparisons both cite setup or cost concerns
    - Ask for gross retention by customer-size band and implementation timeline data
  notes: Severity reflects competitive risk to selling and renewal quality rather than existential risk to category demand; the table focuses on the threats that most directly compress Cast AI pricing power or win rates.
