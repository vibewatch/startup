company:
  name: Cast AI
chapter:
  number: 4
  title: Financials
  summary: Cast AI's public financial file is strong on financing milestones, pricing hints, and customer ROI proof, but weak on the core operating metrics needed for underwriting. The record supports a freemium-to-enterprise software motion centered on Kubernetes cost monitoring and paid automation, reinforced by case studies showing 50-80% savings and several-million-dollar annual impact for named customers. Capital adequacy appears solid after an oversubscribed $108 million Series C in 2025 and a January 2026 strategic investment that pushed valuation above $1 billion, yet ARR, gross margin, burn, runway, NRR, and realized contract structure remain undisclosed, leaving a medium-confidence financial verdict rather than a fully underwritable one.
sections:
- id: revenue-model-and-pricing-signals
  title: Revenue Model and Pricing Signals
  body: 'The public evidence points to a software-first land-and-expand model rather than a services-heavy business. Cast AI''s documentation centers on cost monitoring, optimization recommendations, autoscaling, bin packing, and spot automation delivered through one platform. Review surfaces add the clearest monetization clues: G2 shows a free Kubernetes cost monitoring tier, while Software Advice lists a starting price of $200 per month and describes automation features such as autoscaling, rightsizing, and spot instance management. Cast''s own pricing page is notably sales-led and does not publish a transparent enterprise rate card, which implies meaningful contract-level variation by cluster size, module mix, and support needs. This is consistent with an ROI-based enterprise sale in which the product proves savings first and monetizes deeper automation after trust is established. The emerging OMNI Compute and GPU-control-plane narrative also suggests that the company may be broadening
    beyond classic optimization subscription revenue, but the public file does not disclose whether newer AI or GPU features are monetized separately, bundled into the platform, or tied to external compute marketplace economics.'
