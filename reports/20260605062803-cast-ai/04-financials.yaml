- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial verdict is positive but incomplete. Cast AI looks like a growth-stage infrastructure software company with genuine proof of customer value, a credible free-to-paid funnel, meaningful enterprise traction, and enough capital to keep investing through the current cycle. Those are real strengths. But nearly every metric required for disciplined underwriting is still missing from the public file: ARR, GAAP revenue growth, gross margin, burn, runway, NRR, churn, customer concentration, and the economics of GPU or marketplace-style products. The result is that Cast can be judged as commercially promising yet still financially under-disclosed. From an investor or acquirer perspective, the next diligence step is not more headline funding data; it is contract-level economics. Specifically, one needs to see whether pricing is subscription, percentage-of-savings, or hybrid; whether gross margin compresses as GPU or external-capacity services expand; and whether rapid customer-count
    growth is converting into healthy retention and efficient sales payback. Until those questions are answered, the company merits a medium-confidence financial assessment: solid capital support and attractive customer ROI, but insufficient transparency on the underlying engine that converts those outcomes into durable software economics.'
