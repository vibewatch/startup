- id: traction-and-sales-efficiency-proxies
  title: Traction and Sales-Efficiency Proxies
  body: 'Because Cast AI does not disclose ARR or cohort metrics, the best public traction evidence comes from customer count, logo quality, third-party growth commentary, and time-to-value case studies. The strongest signals are unusually concrete for a private infrastructure company. Public materials tied to the Series C say Cast doubled its customer base between 2023 and 2024 and reached more than 2,100 organizations. Reuters-linked coverage said total funding exceeded $180 million after the 2025 round and described sharply rising demand as AI adoption increased Kubernetes automation needs. Customer outcomes reinforce that the value proposition is not hypothetical: NielsenIQ reported savings of up to 80 percent, project44 reported 50 percent savings on GKE in one month, and Branch highlighted several million dollars of annual AWS savings. Those are customer-finance outcomes, not just technical benchmarks. G2-based recognition and a large review base also suggest that Cast has enough installed
    base and usage breadth to support efficient proof-driven selling. Still, the public file does not expose win rates, CAC payback, average contract value, or net retention, so sales efficiency remains a proxy judgment rather than a measured fact.'
