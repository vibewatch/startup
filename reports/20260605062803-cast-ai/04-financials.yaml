- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR and revenue growth
    - Prevents direct valuation-multiple or Rule-of-40 underwriting
    - Request board deck or monthly KPI pack with current ARR, revenue, and growth bridge
  - - Gross margin by product line
    - Blocks judgment on whether GPU / marketplace features dilute software economics
    - Request P&L by core automation, AI/GPU, support, and any marketplace components
  - - Burn and runway
    - Makes capital-adequacy assessment incomplete despite large financing rounds
    - Request cash balance, burn trend, and 12-24 month operating plan
  - - NRR and churn
    - Obscures whether savings products naturally expand or are vulnerable to replacement by native tools
    - Request cohort retention table and downgrade reasons
  - - Customer concentration
    - Important for enterprise software resilience and GTM efficiency
    - Request top-10 customer revenue share and vertical concentration
  - - Contract structure
    - Without subscription vs savings-share mix, revenue quality cannot be judged cleanly
    - Sample recent contracts and summarize pricing mechanics
  - - GPU / OMNI monetization mix
    - New products could drive upside or margin complexity, but public disclosures are silent
    - Break out pipeline, bookings, and revenue contribution for GPU-related modules
  notes: These are the minimum missing fields needed to move from medium-confidence directional analysis to an investable financial model.
