- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / revenue run rate
    - null
    - Low
    - Core scale indicator for any late-stage software business
    - Provide current ARR, trailing-12-month revenue, and growth by module
  - - Average contract value
    - null
    - Low
    - Needed to interpret sales efficiency and segment fit
    - Share ACV / median deal size by SMB, mid-market, and enterprise
  - - Gross margin
    - null
    - Low
    - Critical to judge whether automation and GPU features behave like software or services
    - Provide GAAP and non-GAAP gross margin plus module-level mix
  - - CAC payback
    - null
    - Low
    - Determines capital efficiency of go-to-market spend
    - Provide sales and marketing spend, new ARR, and payback calculation
  - - Net revenue retention
    - null
    - Low
    - Tests whether savings products expand naturally inside customers
    - Provide NRR, gross retention, and upsell drivers
  - - Time to initial customer value
    - 'project44: 50% savings in one month; NielsenIQ: large savings quickly evidenced'
    - Medium
    - Fast time-to-value can improve close rates and payback
    - Quantify median time from pilot to savings realization across recent cohorts
  - - Pricing leverage vs customer savings
    - Savings framed as 50-80% or several million dollars annually
    - Medium
    - ROI framing can support strong pricing power even without public list pricing
    - Show realized price as a share of verified customer savings
  notes: Nulls reflect genuine public-data gaps, not author omission; the only usable public proxies are customer savings outcomes and initial entry-price signals from review marketplaces.
