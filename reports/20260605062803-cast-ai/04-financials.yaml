- id: capital-adequacy-and-cost-structure
  title: Capital Adequacy and Cost Structure
  body: Capital adequacy appears comfortably positive in the near term, but with major blind spots. Cast closed an oversubscribed $108 million Series C in April 2025, and Reuters-linked coverage said total funding exceeded $180 million after that event. In January 2026 the company announced a strategic investment from Pacific Alliance Ventures and said valuation had crossed $1 billion, which indicates a fresh balance-sheet step-up and continued investor confidence. TechCrunch said the Series C proceeds were earmarked for more research and development plus geographic expansion, while investor commentary linked the round to rapid revenue growth and surging demand. What remains unknown is equally important. The public record does not reveal cash on hand, monthly burn, runway, debt obligations, or the exact size of the 2026 investment. It also leaves open whether OMNI Compute or broader GPU access changes Cast's cost structure relative to a pure control-plane SaaS model. Compared with public
    comparables such as IBM, Datadog, and NetApp—each of which files full 10-K statements with the SEC—Cast offers almost no direct margin or cash-flow visibility. That opacity is the main reason the financial chapter cannot move from directional confidence to full underwriting confidence.
