- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Why it matters
  - Public warning sign
  - Diligence test
  rows:
  - - ARR materially below premium-multiple thresholds
    - Would make the $1B mark too rich
    - No public ARR disclosure
    - Request current ARR and forward growth bridge
  - - Gross margin below premium software expectations
    - Would weaken AI-native infra multiple case
    - No public gross margin disclosure
    - Request GAAP gross margin and product mix
  - - Weak NRR / expansion despite strong logos
    - Would imply customer proof is less monetizable than it appears
    - No public retention metrics
    - Request NRR, cohort retention, and AI-module expansion rates
  - - GPU / AI modules not materially monetized
    - Would reduce the AI-infrastructure premium narrative
    - Public evidence emphasizes products, not attach rate
    - Request module-level ARR and active customer count
  - - Undisclosed round terms prove investor protection or weak quality
    - Could mean the unicorn headline overstates economic quality
    - 2026 amount undisclosed
    - Review term sheet, liquidation preferences, and secondary mix
  - - Native-cloud competition compresses willingness to pay
    - Would push Cast toward lower comp buckets
    - CloudZero comparison and broad substitute set
    - Review win-loss data and pricing pressure by cloud
  notes: These are the few variables that can most quickly move Cast from a fair premium story to an overvalued one.
