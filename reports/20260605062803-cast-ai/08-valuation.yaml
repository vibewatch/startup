- id: scenario-view-and-recommendation
  title: Scenario View and Recommendation
  body: 'The easiest way to pressure-test Cast''s unicorn pricing is to invert the multiple math. If the company deserves an approximately 11x AI-native software multiple, then a $1 billion value implies around $91 million of ARR. If it deserves the more aggressive 21.2x AI-native VC median, the same valuation implies only about $47 million of ARR. But if the business is ultimately judged closer to legacy or lower-premium software at 5.5x or 3.8x, the implied ARR requirement jumps to roughly $182 million to $263 million. That spread is huge, and it captures the entire debate. The bull case is that Cast''s customer proof, multicloud automation, and GPU adjacency justify premium AI-infrastructure treatment. The bear case is that native-cloud commoditization, opaque round terms, and absent retention / margin disclosure eventually force investors to underwrite it like a less differentiated cloud-software company. The base case therefore lands in the middle: the $1 billion mark is believable
    and not obviously reckless, but it is also not conservative enough to make the company look clearly mispriced in an investor''s favor. The right practical stance is fair / track rather than aggressive buy-in.'
