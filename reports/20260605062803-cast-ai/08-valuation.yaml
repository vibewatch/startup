- id: comparable-framework-and-multiple-context
  title: Comparable Framework and Multiple Context
  body: 'Because Cast AI does not disclose ARR, gross margin, or NRR publicly, the valuation chapter has to start with frameworks rather than a precision model. The key question is whether Cast should be benchmarked closer to premium AI-native infrastructure software or to ordinary cloud-software / SaaS businesses. Analyst-market-data sources suggest a wide spread. SaasRise cites a median 21.2x EV/revenue in VC rounds and 11.5x in M&A for AI-native software, while Windsor Drake places AI-native application software near an 11x public benchmark and notes that investors are still paying 15x to 30x for foundation-model labs. Multiples.vc adds that public software multiples in 2026 are increasingly driven by AI relevance, technical complexity, and market position rather than generic TAM claims. PublicComps matters less as a number source than as proof of how investors benchmark software: EV/NTM revenue, retention, ACV, analyst estimates, and historicals. To translate those frameworks into a
    Cast lens, it is helpful to note that public comp candidates with audited filings span both high-quality observability / infrastructure names like Datadog, Cloudflare, Dynatrace, and Snowflake and more mixed infrastructure or hybrid names like IBM, NetApp, DigitalOcean, and MongoDB. That dispersion is exactly why Cast''s missing private metrics matter so much.'
