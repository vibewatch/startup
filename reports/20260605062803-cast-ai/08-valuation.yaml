- id: diligence-asks-and-thesis-breaks
  title: Diligence Asks and Thesis Breaks
  body: 'The valuation thesis breaks in only a few ways, but they are fundamental. First, if ARR turns out to be materially below the rough thresholds implied by premium AI-native multiples, the current price is too full. Second, if gross margins or retention resemble lower-quality infrastructure software rather than sticky, high-value automation, the premium multiple case weakens. Third, if AI and GPU expansion turns out to be more narrative than monetized reality, the company should probably be valued on the narrower Kubernetes-optimization story rather than on a broader AI-infrastructure narrative. Finally, if native cloud and open-source substitutes continue to compress willingness-to-pay, Cast may struggle to hold a premium even if growth remains respectable. The diligence asks are therefore straightforward and non-negotiable: current ARR, gross margin, NRR, customer concentration, AI / GPU module attach rates, contract structure, and the exact economic terms of the January 2026 round.
    Until those are disclosed, valuation work remains an exercise in scenario framing and comparables rather than a true intrinsic model. That is enough to say the company is worth tracking, but not enough to say the $1 billion mark is definitively cheap.'
