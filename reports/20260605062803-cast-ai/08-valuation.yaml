chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports that Cast AI crossed the $1 billion mark in January 2026 after a 2025 Series C that was widely reported around an $850 million to near-$900 million valuation. The valuation step-up is directionally credible given strong customer proof, AI/GPU product expansion, and premium 2026 multiples for AI-native software, but the absence of disclosed ARR, gross margin, NRR, and the exact size of the 2026 round makes exact underwriting impossible. Relative to public software and infrastructure comps, Cast looks fairly valued rather than obviously cheap: a $1 billion entry can be justified only if revenue and retention are already strong enough to support AI-native infrastructure multiples, while any reversion toward legacy SaaS or commoditized-cloud tooling would compress that story quickly.'
sections:
- id: current-valuation-facts-and-why-opacity-matters
  title: Current Valuation Facts and Why Opacity Matters
  body: The cleanest valuation facts in the public record are the step-ups, not the economics underneath them. Cast AI's April 2025 Series C was reported by TechCrunch as a near-unicorn round close to $900 million post-money, while Reuters-linked coverage carried by Yahoo Finance and MarketScreener pointed to roughly $850 million and total funding above $180 million. In January 2026 Cast AI and Business Wire said a strategic investment from Pacific Alliance Ventures had pushed valuation above $1 billion. Tech.eu then framed the milestone as Lithuania's fifth unicorn. Those facts make the $1 billion headline credible as a market event. What they do not provide is a way to evaluate whether the valuation was cheap, expensive, or simply strategic. The amount of the 2026 round remains undisclosed, so outsiders cannot observe dilution, preference structure, or whether the new money meaningfully changed implied valuation quality. Third-party profile sites such as Premier Alternatives add more noise
    than clarity because they summarize the headline valuation while admitting incomplete funding-history imports. For valuation work, that means the entry mark is real but the capital-stack context remains materially opaque.
