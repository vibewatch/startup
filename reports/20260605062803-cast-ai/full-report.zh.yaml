  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价信号
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，这更像软件优先的落地扩张模式，而不是服务很重的业务。Cast AI 文档围绕一个平台交付成本监控、优化建议、自动扩缩容、装箱和 Spot 自动化。评测页面提供最清楚的变现线索：G2 显示有免费的
              Kubernetes 成本监控层，Software Advice 列出起价每月 $200，并描述自动扩缩容、资源规格调整、Spot 实例管理等自动化功能。Cast
              自己的定价页明显以销售驱动，没有发布透明企业价目表，这意味着合同层面会因集群规模、模块组合和支持需求产生显著差异。这符合 基于 ROI 的 企业销售：产品先证明节省，建立信任后再用更深的自动化变现。正在成形的
              OMNI Compute 和 GPU 控制平面 叙事也表明，公司可能正在拓宽到经典优化订阅收入之外，但公开档案没有披露更新的 AI 或 GPU 功能是单独变现、打包进平台，还是绑定外部计算市场经济性。
