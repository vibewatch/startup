          detail: 企业审查或合规问题升级
        - id: rev
          label: 收入 / 续约风险
          detail: 扩张放慢，或客户流失
      edges:
        - from: perm
          to: ops
          label: 导致
        - from: ops
          to: trust
          label: 削弱
        - from: trust
          to: audit
          label: 触发
        - from: audit
          to: rev
          label: 推高
    claimRefs:
      - CR008
      - CR016
      - CR017
      - CR022
      - CR025
      - CR031
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Cast AI 要安全交付，离不开法律框架、云厂商基础设施、遥测权限，以及专业的安全 / 平台执行能力。
    data:
      nodes:
        - id: contracts
          label: 合同与 DPA
          detail: 条款、隐私、处理方义务
        - id: provider
          label: 云厂商与 GPU 供给
          detail: 上游基础设施和容量
        - id: telemetry
          label: 权限与遥测
          detail: 元数据、端口、数据流
        - id: security
          label: 安全控制
          detail: SOC 2、ISO、CIS、Kvisor、仪表盘
        - id: team
          label: 执行团队
          detail: 产品、安全、支持、文档
        - id: customer
          label: 客户信任
          detail: 企业愿不愿意部署和扩张
      edges:
        - from: contracts
          to: customer
          label: 塑造
        - from: provider
          to: customer
          label: 间接影响
        - from: telemetry
          to: customer
          label: 必须让其接受
        - from: security
          to: customer
          label: 支撑
        - from: team
          to: customer
          label: 维持
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR018
      - CR025
      - CR026
      - CR027
      - CR035
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议先承认其独角兽事实基础可信，再纳入可比公司带来的不确定性，最后落到“公允 / 跟踪”结论。
    data:
      nodes:
        - id: fact
          label: 估值事实
          detail: '> $1B 里程碑有公开材料支撑'
        - id: proof
          label: 客户 / 产品验证
          detail: 企业客户背书强，AI / GPU 产品在扩张
        - id: opacity
          label: 经济指标不透明
          detail: ARR、利润率、NRR 和轮次金额未披露
        - id: comps
          label: 可比公司分歧大
          detail: AI 原生溢价与传统软件估值压缩并存
        - id: output
          label: 公允 / 跟踪
          detail: 值得跟踪，但看不出明显对投资者有利的错价
      edges:
        - from: fact
          to: proof
          label: 由其支撑
        - from: proof
          to: opacity
          label: 被其抵消
        - from: opacity
          to: comps
          label: 迫使
        - from: comps
          to: output
          label: 导向
    claimRefs:
      - CV015
      - CV023
      - CV024
      - CV026
      - CV027
      - CV038
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 同样是 $1B 企业价值，市场最终给出的倍数区间不同，对 ARR 的要求会完全不一样。
    data:
      items:
        - label: 21.2x AI 原生 VC 中位数
          value: 47.2
        - label: 11.0x AI 原生上市公司基准
          value: 90.9
        - label: 8.0x 稳健基础设施软件
          value: 125
        - label: 5.5x 传统 SaaS VC 中位数
          value: 181.8
        - label: 3.8x 传统 SaaS 并购中位数
          value: 263.2
      yAxis:
        label: 支撑 $1B EV 所需 ARR（USD M）
    approximationNotes: 数值按 EV ÷ 收入倍数反推；这些是敏感性点位，不是 Cast AI 披露的 ARR 区间。
    claimRefs:
      - CV010
      - CV011
      - CV016
      - CV017
      - CV018
      - CV019
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 选取几个示意性 ARR 区间后，Cast 若被视为 AI 原生公司，还是更接近传统软件公司，公允价值区间会明显摆动。
    data:
      items:
        - label: 如果 ARR 为 $50M
          low: 190
          mid: 550
          high: 1060
        - label: 如果 ARR 为 $75M
          low: 285
          mid: 825
          high: 1590
        - label: 如果 ARR 为 $100M
          low: 380
          mid: 1100
          high: 2120
    approximationNotes: 低位使用 3.8x 传统软件并购倍数，中位使用 11.0x AI 原生上市公司基准，高位使用外部分析师市场数据来源中的 21.2x AI 原生 VC 中位数。
    claimRefs:
      - CV010
      - CV011
      - CV016
      - CV017
      - CV018
      - CV019
      - CV031
      - CV032
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 这张紧凑 KPI 表聚焦投资逻辑最关键的指标，以及披露最薄弱的环节。
    data:
      items:
        - label: 公开估值下限
          value: '1000'
          unit: USD M
        - label: 2025 年后公开融资下限
          value: '180'
          unit: USD M+
        - label: 宣称覆盖的组织数
          value: '2100'
          unit: customers+
        - label: 未优化集群的 GPU 利用率
          value: '5'
          unit: '%'
        - label: ARR 披露质量
          value: Low
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV015
      - CV033
      - CV042
