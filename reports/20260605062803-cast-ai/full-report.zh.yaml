      - number: '8.2'
        title: 可比框架与倍数语境
        blocks:
          - type: paragraph
            body: >-
              由于 Cast AI 没有公开披露 ARR、毛利率或 NRR，估值章节必须先用框架，而不是精确模型。关键问题是，Cast 应更接近高溢价 AI 原生基础设施软件，还是普通云软件 / SaaS
              公司。分析师市场数据来源给出的区间很宽。SaasRise 称 AI 原生软件在 VC 轮次中的 EV/收入中位数为 21.2x，M&A 为 11.5x；Windsor Drake 把 AI
              原生应用软件的公开市场基准放在接近 11x，并指出投资人仍愿意为基础模型实验室支付 15x 到 30x。Multiples.vc 补充称，2026 年公开软件倍数越来越由 AI
              相关性、技术复杂度和市场位置驱动，而不是泛泛的 TAM 叙事。PublicComps 作为数字来源没那么重要，更重要的是证明投资人如何给软件做基准：EV/NTM
              收入、留存、ACV、分析师估计和历史数据。把这些框架转成 Cast 视角时，需要注意，拥有经审计申报文件的公开可比公司横跨两端：Datadog、Cloudflare、Dynatrace、Snowflake
              等高质量可观测性 / 基础设施公司，以及 IBM、NetApp、DigitalOcean、MongoDB 等更混合的基础设施或混合型公司。这种分散正是 Cast 的未公开指标缺口如此关键的原因。
