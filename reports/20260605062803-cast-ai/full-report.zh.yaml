            body: >-
              运营上，Cast AI 暴露在风险中，因为它不是站在技术栈外部；它会在集群内部做出或影响变更。平台权限 文档显示，产品依赖明确权限、数据收集、端口开放，以及对集群 / 云元数据的访问。数据库优化器安全
              文档进一步说明数据最小化很重要：查询 SQL 会匿名化，参数 会哈希，留存被有意限制。这些都是好的控制，但也强调 Cast 正在触及有意义的遥测和基础设施路径。安全特定风险同样两面。Kvisor
              被记录为开源安全代理，具备镜像扫描、运行时监控和网络可观测性；但多份安全文档警告功能集正在发生重大变化，一些功能正在被弃用或迁移。关心稳定控制框架的客户会因此面临
              变更管理风险。最后，外部停机聚合器清楚显示可靠性并非不可见：StatusGator 和 IsDown 都追踪事件，IsDown 报告自 January 2025 以来有一段不算轻的停机历史。对于在 关键任务
