      - number: '2.3'
        title: 买方、用户与预算负责人
        blocks:
          - type: paragraph
            body: >-
              FinOps 和云成本优化天然跨职能，这一点重要，因为 Cast AI 的买方图谱不是单一预算线。FinOps Foundation
              明确把这一学科建立在工程、财务、产品、运营、采购和高管的共同所有权上。Google 的成本优化指南点名 CTO、CIO、CFO、架构师、开发者、管理员和运维人员为相关利益方，Microsoft 则把 FinOps
              描述为财务管理与云工程之间的运营桥梁。实际使用者通常是平台工程、SRE、DevOps 或 AI
              基础设施团队，负责集群行为和资源效率。付费中心通常是中央云平台、基础设施工程预算，或由高管控制、与财务和采购挂钩的优化项目。CNCF Kubernetes FinOps microsurvey
              说明这些买方为何在意：很多组织的 Kubernetes 已经吃掉可观云预算，从半数受访者最多四分之一，到一个高支出队列每月超过 $1M。这种支出集中度让即便温和的利用率提升也会对财务和平台团队产生实质意义。
