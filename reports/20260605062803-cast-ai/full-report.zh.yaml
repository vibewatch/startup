      - number: '4.2'
        title: 牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              因为 Cast AI 不披露年经常性收入（ARR）或队列指标，最好的公开牵引力证据来自客户数量、logo 质量、第三方增长评论和价值实现时间 案例研究。对一家私有基础设施公司来说，最强信号异常具体。与
              Series C 绑定的公开材料称，Cast 在 2023 和 2024 之间将客户基数翻倍，并服务超过 2,100 家组织。Reuters 相关报道称 2025 轮后累计融资超过 $180
              million，并把需求快速上升归因于 AI 采用增加了 Kubernetes 自动化需求。客户结果强化了价值主张并非假设：NielsenIQ 报告最高节省 80%，project44 报告一个月内 GKE 节省
              50%，Branch 强调年度 AWS 节省数百万美元。这些是客户财务结果，不只是技术基准测试。基于 G2 的认可和大量评价也说明，Cast
              拥有足够安装基础和使用广度，可以支撑证据驱动的高效销售。不过，公开档案没有暴露赢率、获客成本（CAC）回本、平均合同价值或净留存，因此销售效率仍是代理判断，而不是可测事实。
