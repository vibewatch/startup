companyProfile:
  summary: >-
    Cast AI 是一家总部位于 Miami、工程重心在 Vilnius 的基础设施软件公司，销售一套 Kubernetes 自动化平台，覆盖成本监控、资源规格调整、自动扩缩容、Spot 管理，并通过 OMNI Compute
    扩展到更新的多云 GPU 编排。公司由连续创业者于 2019 创立；他们此前在 Zenedge 经历过云成本压力。Cast AI 现在面向在公有云上运行可观云原生和 AI 工作负载的中大型企业。
