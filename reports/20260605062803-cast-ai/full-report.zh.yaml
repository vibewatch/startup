              Cast 覆盖多元行业：汽车和数字平台中的 BMW Group 与 Mercedes-Benz.io；网络和云基础设施中的 Cisco 与 Akamai；分析与金融决策中的 FICO；电信中的
              Swisscom；数据分析中的 NielsenIQ；物流软件中的 project44；移动归因中的 Branch；AI 基础设施中的 Hugging Face；教育 AI 中的 ALLEN
              Digital。这个广度很重要，因为它意味着产品不局限于某一种小众工作负载模式。同时，待完成任务 相当一致：大规模公有云运营、Kubernetes 管理、GPU 或 CPU
              密集工作负载，以及在不牺牲性能的情况下自动节省成本。公开档案因此指向一种客户画像：由云复杂度和支出强度定义，而不是只由垂直行业定义。
