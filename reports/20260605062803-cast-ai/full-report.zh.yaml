      - number: '4.3'
        title: 资本充足性与成本结构
        blocks:
          - type: paragraph
            body: >-
              短期看，资本充足性似乎相当正面，但存在重大盲区。Cast 在 April 2025 完成超额认购的 $108 million Series C，Reuters 相关报道称该事件后累计融资超过 $180
              million。January 2026，公司宣布 Pacific Alliance Ventures 进行战略投资，并称估值越过 $1
              billion，这意味着资产负债表再次上台阶，投资人信心延续。TechCrunch 称 Series C
              资金将用于更多研发和地域扩张，投资人评论则把该轮与快速收入增长和需求激增相连。未知项同样重要。公开记录没有披露手头现金、月度烧钱速度、现金跑道、债务义务或 2026 投资的准确规模。它也没有说明 OMNI
              Compute 或更广的 GPU 访问是否会改变 Cast 相对于纯 控制平面 SaaS 模型的成本结构。与 IBM、Datadog、NetApp 等上市可比公司不同——这些公司都向 SEC 提交完整 10-K
              报告——Cast 几乎没有直接的毛利率或现金流可见性。这种不透明，是财务章节无法从方向性信心上升到完整承销信心的主要原因。
