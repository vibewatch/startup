  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、隐私与合规风险
        blocks:
          - type: paragraph
            body: >-
              Cast AI 周围的法律和隐私框架有实质内容，这是好事，但也暴露了公司的风险位置。服务条款是一套自 February 2025
              生效、绑定订单表的模式，意味着争议、暂停权、上手责任和服务访问都在合同上集中管理。隐私政策和 DPA 更进一步，把控制者责任在美国实体与立陶宛实体之间拆分，并明确将 Cast 置于客户上传云服务数据的处理者
              角色。这有助于企业买方框定 GDPR 和美国隐私义务，但也意味着 Cast 的合规负担真实且跨境。信息安全政策、SOC 2 Type II 公告、CIS 认证新闻稿 和 CIS 伙伴页面
              提供了有意义的信任信号，尤其面向受监管或安全敏感买方。但这些是控制层面的缓释，不等于证明每个企业部署都是低风险。产品在客户 Kubernetes
              环境内部运行，因此合同处理者义务、实际授予权限和真实事件处理之间一旦不匹配，就可能造成法律暴露、审计痛点，或拖慢受监管细分市场的采购。还有一个额外复杂点：外部评论显示 AI 治理要求在 2026 收紧，随着
              Cast 扩张围绕模型和 GPU 工作流的 面向 AI 的工具，尽调负担可能上升。
