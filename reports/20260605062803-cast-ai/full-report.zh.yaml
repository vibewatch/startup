  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值事实，以及不透明为何重要
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的估值事实是一级级估值跃升，而不是背后的经济性。TechCrunch 报道称，Cast AI 2025 年 4 月的 Series C 轮是接近独角兽的融资，投后估值接近 $900
              million；Yahoo Finance 和 MarketScreener 转载的 Reuters 相关报道则指向大约 $850 million，累计融资超过 $180 million。2026 年 1
              月，Cast AI 和 Business Wire 称 Pacific Alliance Ventures 的战略投资已把估值推到 $1 billion 以上。Tech.eu
              随后把这一里程碑定义为立陶宛第五家独角兽。这些事实足以让 $1 billion 这个标题作为市场事件成立。但它们没有提供判断估值便宜、昂贵，还是纯粹战略性定价的方法。2026
              年轮次金额仍未披露，外部投资人看不到稀释、优先权结构，也看不到新资金是否实质改善了隐含估值质量。Premier Alternatives
              等第三方画像网站只增加噪音，不增加清晰度：它们总结了头条估值，同时承认融资历史导入不完整。用于估值工作时，结论是入场估值真实存在，但资本结构背景仍然相当不透明。
