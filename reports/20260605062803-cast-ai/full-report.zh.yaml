      - number: '8.4'
        title: 尽调要求与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              估值逻辑只有几种破裂方式，但都很根本。第一，如果 ARR 远低于高溢价 AI
              原生倍数隐含的粗略门槛，当前价格就太满。第二，如果毛利率或留存更像低质量基础设施软件，而不是黏性强、高价值的自动化，溢价倍数逻辑会变弱。第三，如果 AI 和 GPU
              扩张更多是叙事而非已变现现实，公司可能应该按更窄的 Kubernetes 优化故事估值，而不是更宽的 AI 基础设施叙事。最后，如果云原生和开源替代品继续压缩付费意愿，即使增长仍然体面，Cast
              也可能难以守住溢价。尽调要求因此直接且不可谈判：当前 ARR、毛利率、NRR、客户集中度、AI / GPU 模块附加率、合约结构，以及 2026 年 1
              月轮次的确切经济条款。在这些信息披露之前，估值工作仍只是情景框架和可比公司分析，而不是真正的内在价值模型。足以说公司值得观察，但不足以说 $1 billion 估值明确便宜。
