      - number: '8.3'
        title: 情景视角与建议
        blocks:
          - type: paragraph
            body: >-
              压力测试 Cast 独角兽定价，最直接的方法是倒推倍数。如果公司配得上约 11x 的 AI 原生软件倍数，$1 billion 估值意味着 ARR 约 $91 million。如果它配得上更激进的 21.2x
              AI 原生 VC 中位数，同样估值只需要约 $47 million ARR。但如果业务最终更接近传统或低溢价软件，倍数只有 5.5x 或 3.8x，隐含 ARR 门槛就会跳到约 $182 million 到
              $263 million。这个跨度很大，也把争议全部装了进去。乐观情景是 Cast 的客户证明、多云自动化和 GPU 邻近性足以获得高溢价 AI 基础设施待遇。悲观情景是云原生工具商品化、轮次条款不透明、留存 /
              毛利率缺披露，最终迫使投资人按一家差异化较弱的云软件公司来承销。基准情景因此落在中间：$1 billion 估值可信，也不明显冒进，但还不够保守，无法让公司在投资人视角下显得明显错定价且有利。实际立场应是合理 /
              观察，而不是激进买入。
