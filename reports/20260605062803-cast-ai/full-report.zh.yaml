      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论是正面但不完整。Cast AI
              看起来像一家成长期基础设施软件公司，客户价值证明真实、免费到付费漏斗可信、企业牵引力可观，也有足够资本支撑当前周期继续投入。这些都是真优势。但严谨承销所需的几乎所有指标仍缺席公开档案：年经常性收入（ARR）、GAAP
              收入增长、毛利率、烧钱速度、现金跑道、净留存率（NRR）、流失、客户集中度，以及 GPU 或市场型 产品经济性。结果是，Cast
              可以被判断为商业前景有吸引力，但财务披露仍不足。从投资人或收购方视角看，下一步尽调不是更多标题级融资数据，而是合同层面的经济性。具体要看定价是订阅、节省分成还是混合；GPU
              或外部容量服务扩张时毛利率是否被压缩；快速客户数量增长是否转化为健康留存和高效销售回本。在这些问题得到回答前，公司只适合中等信心的财务评估：资本支持扎实、客户 ROI
              有吸引力，但把这些结果转化为持久软件经济性的底层引擎仍缺少透明度。
