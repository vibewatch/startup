      - number: '1.2'
        title: 创始人、领导层与地域
        blocks:
          - type: paragraph
            body: >-
              官方和投资人材料里，创始团队异常稳定且身份清楚。Cast AI 公开列出 Yuri Frayman 为 CEO、Leon Kuperman 为 CTO、Laurent Gil 为
              President，三人均为联合创始人。第三方访谈补充了有用背景：三人曾共同打造 Viewdle 和 Zenedge，在启动 Cast AI
              前已有很长的共事历史。今天的高管队伍看起来也不只是创始人驱动的初创公司，职能覆盖财务、人力运营、客户成功和全球销售。地域同样是尽调叙事的一部分。独立报道通常从公司定位上称 Cast AI 位于
              Miami，但多方来源也把 Vilnius
              描述为核心工程中心，并视为公司立陶宛独角兽身份的来源。这种组合有利于招聘和叙事定位，但公开治理披露仍然很薄。已审阅资料没有清楚披露董事会构成、投票控制或投资人保护性权利，因此创始人影响力看起来很强，却无法只靠公开证据精确量化。
