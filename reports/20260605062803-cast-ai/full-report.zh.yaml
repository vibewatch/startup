      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              最适合把技术运营模型理解为围绕既有 Kubernetes 集群的连续控制环。在核心产品中，Cast AI 代理和
              策略监控需求、比较价格与容量，然后驱动节点级和工作负载级动作，如资源规格调整、自动扩缩容或智能驱逐。Mercedes-Benz.io
              的工程文章给出少见具体的外部生产证据：团队从静态节点自动扩缩容迁移到动态、感知工作负载的自动扩缩容、运行时装箱，并在零停机约束下使用智能驱逐。休眠
              展示了运营模型的另一部分：正常工作负载恢复前，系统会先通过恢复节点拉回必要组件。OMNI 让自动扩缩器 可以评估外部位置和跨云稀缺 GPU 容量，从而把架构延伸到单一区域或供应商之外。GPU
              Optimization 再叠加加速器的分区、共享和放置逻辑。这让平台技术上雄心很大，运营价值也高，但也意味着 Cast 深度依赖云厂商 API、权限、调度器行为、容量信号，以及自身关键组件的正确编排。
