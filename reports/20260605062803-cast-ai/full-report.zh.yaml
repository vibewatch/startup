      - number: '3.3'
        title: 原生云、开源与切换成本动态
        blocks:
          - type: paragraph
            body: >-
              最严肃的替代风险不只来自风投支持的同业。超大规模云厂商和开源项目已经在技术栈内部直接解决了大块问题。Karpenter 已经给以 AWS 为中心的团队提供开源的即时节点调配和成本感知合并逻辑。Google 将
              GKE Autopilot 营销为一种由 Google 管理节点、扩缩容、安全和基础设施选择的模式，同时也把成本优化功能描述为包含在 GKE 定价中。Microsoft 也在往同一方向推进，把 AKS
              节点自动调配做成基于 Karpenter 的原生能力，并保留经典集群自动扩缩器供较轻用例使用。OpenCost 为成本分摊和成本回显 建立低成本底线，FinOps Foundation
              也强化了一个事实：使用优化可以被当作广泛的内部运营实践，而非必须购买的产品。这些事实会降低切换成本并鼓励多栖。买方可以把 Kubecost 或 OpenCost 的可视性与 Karpenter、GKE 或 AKS
              的原生调配结合起来，而不是完全标准化到 Cast AI。
