      - number: '5.4'
        title: 信任、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              公开档案显示，信任与质量控制真实存在，但成熟度不均。正面看，Cast 把 Kvisor 记录为一个开源安全代理，可扫描镜像、监控运行时行为、观察网络活动，并在安全 仪表盘中提供集中合规视图。Cast 还公开宣布其
              Security Report 在主要托管 Kubernetes 环境中获得 CIS Benchmark 认证；这对受监管或重视安全的企业买方是有意义的信任信号。与此同时，文档多次警告 Kubernetes
              安全功能集正在发生重大变化，一些功能正在被弃用或迁移到控制台。这个警告有价值，因为它坦诚揭示产品演进，但也凸显过渡风险。可靠性信号类似。StatusGator 和 IsDown 显示平台有公开事件历史，多个
              2026 信号指向短暂的云厂商相关降级，而不是完全不可见。合在一起，这些来源说明技术可以用于生产且持续改进，但并非无摩擦。Cast
              的护城河是技术深度；它的风险也来自同一深度——需要谨慎的权限、文档和事件处理，才能保持客户信任。
