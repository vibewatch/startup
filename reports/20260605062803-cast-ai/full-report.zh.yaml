        title: 资本基础与独角兽里程碑
        blocks:
          - type: paragraph
            body: >-
              公开记录里，证据最充分的融资事件是 April 2025 Series C。官方、Reuters 转发和科技媒体资料一致确认轮次规模为 $108M，领投方为 G2 Venture Partners 与
              SoftBank Vision Fund 2，Aglaé Ventures 也加入，既有支持者包括 Hedosophia、Cota Capital、Vintage Investment
              Partners、Creandum 和 Uncorrelated Ventures。Reuters 报道称，该轮对 Cast AI 的估值约 $850M，并把已披露累计融资推高到 $180M 以上。January
              2026 的里程碑性质不同。Cast AI 和 BusinessWire 确认 Pacific Alliance Ventures（Shinsegae Group
              的美国企业风险投资部门）进行了战略投资，并称公司估值已越过
              $1B。但公开材料没有披露投资金额、是新股还是混合老股，也没有说明融资如何影响累计融资和优先股堆叠。结论是：独角兽里程碑可信，但股权结构透明度不足；估值事件是真的，战略投资人已知，2026
              轮的经济条款仍然披露严重不足。
