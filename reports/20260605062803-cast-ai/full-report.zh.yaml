      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Cast AI 品类的需求逻辑很直接。CNCF 调研数据和 Cast AI 自有基准测试 都显示，过度预置是结构性问题，不是偶发浪费；实际利用率远低于财务团队预期，也低于云原生团队以为自己购买到的水平。AI
              让问题更复杂：Deloitte 认为推理的单位成本已经大幅下降，但总体 AI
              支出仍在上升，因为使用量增长压过了效率提升。这会把更多组织推向严肃的工作负载放置决策，在公有云、私有基础设施和边缘环境之间取舍；同时也抬高了围绕 GPU
              调配、区域选择和混合资源调度的自动化价值。约束也真实存在。Kubernetes 仍难运维，工具链碎片化，技能稀缺，很多企业还能用 GKE Autopilot、AKS 自动扩缩容、基于 Karpenter
              的节点调配或 Red Hat 成本回显 等原生服务解决相当一部分问题。因此，采用更偏向那些云复杂度足够高、支出足够大、运营痛点足够强的组织；在这些场景里，第三方自动化显著胜过原生控制。
