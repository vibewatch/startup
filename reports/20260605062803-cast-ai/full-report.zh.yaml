  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Cast AI 自己的材料一直说明，它不只是仪表盘或推荐引擎。产品从 Kubernetes 成本监控和优化建议起步，但真正重心是执行：自动扩缩容、节点选择、资源规格调整、Spot
              编排、装箱和策略控制，这些动作会改变集群实际运行方式。模块地图现在已经超出原始核心。集群休眠 让非生产环境在保留控制平面的同时缩到零。OMNI 增加了一个多云或跨区域计算控制层，用于稀缺 GPU
              和计算容量。GPU Optimization for AI Infrastructure 增加了针对昂贵加速器的工作负载分区、Dynamic Resource Allocation 和吞吐优化。安全层又通过
              Kvisor 扩大边界，Cast 把它记录为一个用于运行时监控、镜像扫描和网络可观测性的开源安全代理。结果是一套至少包含五个有意义产品层的技术栈：监控、自动扩缩容、成本优化、AI/GPU
              编排，以及安全或合规工具。正是这种广度让 Cast AI 区别于单点工具，也抬高了复杂度、实施范围和文档要求。
