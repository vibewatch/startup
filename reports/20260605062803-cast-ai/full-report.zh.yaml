      - number: '2.2'
        title: 规模测算视角与受约束的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Cast AI 所在空间的公开市场规模测算有方向价值，但高度依赖定义。IDC April 2026 关于智能 CloudOps 软件的主题演讲提供最宽的软件市场视角：2024 年 $23.4B，按 14%
              CAGR 增至 2029 年 $45.0B。MarketsandMarkets 给出略窄的云 FinOps 视角：2025 年 $14.88B，2030 年
              $26.91B，并强调成本管理与优化是最大应用场景，多云是最大部署环境。最相关的直接视角来自 The Business Research Company，它把 Kubernetes 成本管理市场测算为 2025
              年 $1.75B、2026 年 $2.23B、2030 年 $5.78B。Verified Market Reports 和 Business Research Insights
              发布的云成本管理数字更宽，2026 年区间为 $9.2B-$11.01B，也再次说明边界选择很关键。实际结论是：Cast AI 的真实可服务市场窄于宽口径 CloudOps，又略宽于严格 Kubernetes
              成本管理，因为 AI/GPU 优化和混合放置决策越来越进入同一次采购动作。公开证据支持区间判断，而不是一个精确 TAM 故事。
