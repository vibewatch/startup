chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与平台叙事
        blocks:
          - type: paragraph
            body: >-
              Cast AI 的定位不应停留在仪表盘或成本可视化供应商。官方资料一贯把公司定位成应用性能自动化平台：起点是 Kubernetes 成本优化，后来延伸到更广的基础设施自动化、AI 工作负载效率和跨云 GPU
              调配。创始故事也少见地连贯：创始人称，在 Oracle 于 2018 收购 Zenedge 之前，团队扩张 Zenedge 时被失控的云账单困扰，Cast AI
              因此诞生。公开的公司和投资人材料把法律意义上的创立时间锚定在 2019，并把商业模式连接到自动资源规格调整、自动扩缩容、装箱、Spot 管理，以及持续、以性能感知为前提的基础设施决策。January 2026
              发布 OMNI Compute 后，叙事又向前走了一步：Cast AI 被框定为外部计算与 GPU 容量的控制平面，而不只是某个 Kubernetes 集群里的节省层。这很关键，因为它把公司从 FinOps
              工具扩到 AI 基础设施编排，同时保留核心承诺：用更少人工和零应用改写换取更好性能。
