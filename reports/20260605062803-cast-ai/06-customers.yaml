  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, counts of customers above material revenue thresholds, and any concentration by vertical or cloud provider.
    whyItMatters: Logo quality alone cannot show whether the revenue base is diversified enough to withstand churn from one or two marquee accounts.
    diligencePath: Request the top-10 customer revenue table and concentration analysis from finance leadership.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, gross retention, logo churn, and cohort expansion metrics by segment.
    whyItMatters: Without retention data, it is impossible to know whether case-study wins convert into durable recurring customer economics.
    diligencePath: Request cohort dashboards and renewal history by enterprise, mid-market, and AI / GPU customers.
    relatedQuestionRefs:
    - QU015
    - QU023
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: minor
    topic: proof-bias
    missingEvidence: More customer-authored case studies or reference calls independent of Cast-owned content.
    whyItMatters: Vendor-authored proof is useful but can overstate benefits or omit implementation friction.
    diligencePath: Collect customer-authored ROI decks, engineering posts, and live reference calls from at least three named accounts.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: expansion-potential
    missingEvidence: Attach-rate and expansion data for AI / GPU modules inside the existing customer base.
    whyItMatters: AI and GPU stories may represent meaningful upsell opportunity, but public proof does not show how broad that motion is.
    diligencePath: Request customer counts and ARR by module, especially for AI / GPU offerings.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
