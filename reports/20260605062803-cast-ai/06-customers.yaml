- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Risk area
  - Public status
  - Impact
  - Best public evidence
  - Diligence ask
  rows:
  - - Customer concentration
    - Unknown
    - Could materially affect revenue durability if one or two large logos dominate
    - No public concentration disclosures
    - Request top-10 customer revenue share and any >10% customers
  - - Retention / NRR
    - Unknown
    - Without it, logo quality cannot be translated into durable revenue quality
    - No cohort or renewal metrics disclosed
    - Request NRR, gross retention, and logo churn by segment
  - - Logo depth inconsistency
    - Known
    - Some logos are deeply evidenced while others are only mentioned
    - Case-study depth differs sharply across named customers
    - Map each logo to actual deployment scope and contract size
  - - Vendor-authored proof bias
    - Known
    - Could overstate benefits if independent references are sparse
    - Many proof points come from Cast-owned case studies and press releases
    - Provide reference calls and customer-authored ROI decks
  - - AI / GPU expansion inside base
    - Plausible but unquantified
    - Could improve expansion economics if attach rates are real
    - Hugging Face and ALLEN Digital show AI fit, but not attach-rate breadth
    - Break out AI / GPU customer count and expansion ARR
  notes: The key customer risk is not absence of logos but absence of revenue-distribution and retention context around those logos.
