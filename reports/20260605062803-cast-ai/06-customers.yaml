- id: adoption-satisfaction-and-repeat-usage-proxies
  title: Adoption, Satisfaction, and Repeat-Usage Proxies
  body: 'Cast AI does not publish classic SaaS retention or cohort metrics, so customer quality has to be inferred from adoption proxies. The best ones are meaningful. The company says it doubled its customer base between 2023 and 2024 and serves more than 2,100 organizations. G2-derived marketing materials say the product won 20 badges across 36 Spring 2026 reports, and the archived G2 page shows a large review base for a relatively specialized infrastructure product. Those signals matter because infrastructure tools rarely accumulate broad review footprints unless the deployment base is both real and reasonably satisfied. At the same time, the adverse evidence should not be ignored. Cybernews highlights onboarding friction, IAM complexity, and documentation clarity issues, which are plausible headwinds for expansion and customer-success load. The result is a balanced customer-quality read: Cast likely has strong fit in cloud-native, platform-engineering-led accounts, but the public file
    still does not reveal whether those wins translate into repeatable expansion, multi-product adoption, or exceptional retention over time.'
