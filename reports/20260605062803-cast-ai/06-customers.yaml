company:
  name: Cast AI
chapter:
  number: 6
  title: Customers
  summary: 'Cast AI''s public customer file is unusually strong for a private infrastructure company: the business claims more than 2,100 organizations, documents multiple quantified savings case studies, and names large enterprises such as BMW, Cisco, FICO, Hugging Face, Swisscom, Akamai, NielsenIQ, Branch, and project44. The most persuasive proof comes from deep case studies with concrete outcomes—80% savings at NielsenIQ, 50% savings in one month at project44, several million dollars annually at Branch, and 71% LLM-cost savings at ALLEN Digital—while the weakest part of the record is what is not disclosed: retention, revenue concentration, and whether named logos represent broad, repeatable expansion or a smaller set of marquee references. Overall, customer quality looks strong and enterprise-oriented, but reference depth is uneven and concentration risk remains unresolved.'
sections:
- id: customer-segmentation-and-fit
  title: Customer Segmentation and Fit
  body: 'The visible customer base suggests Cast AI is not primarily an SMB tool. The named references point toward mid-market and enterprise buyers that run meaningful Kubernetes, cloud, or AI workloads and care about reliability as much as cost. Public materials and customer pages place Cast across a diverse set of sectors: BMW Group and Mercedes-Benz.io in automotive and digital platforms; Cisco and Akamai in networking and cloud infrastructure; FICO in analytics and financial decisioning; Swisscom in telecom; NielsenIQ in data analytics; project44 in logistics software; Branch in mobile attribution; Hugging Face in AI infrastructure; and ALLEN Digital in education AI. This breadth matters because it implies the product is not confined to one niche workload pattern. At the same time, the jobs-to-be-done are fairly consistent: large-scale public-cloud operations, Kubernetes management, GPU or CPU-intensive workloads, and the need to automate savings without sacrificing performance. The
    public file therefore points to a customer profile defined more by cloud complexity and spend intensity than by vertical alone.'
