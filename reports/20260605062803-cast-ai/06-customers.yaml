- id: concentration-and-reference-quality-risks
  title: Concentration and Reference-Quality Risks
  body: The main customer risk is not lack of logos; it is lack of financial context around those logos. Public evidence does not show how revenue is distributed across the account base, whether any single customer is above a material threshold, how many logos are paying at scale versus piloting, or what retention looks like beyond individual success stories. SEC disclosure guidance is relevant conceptually here because it illustrates that public issuers would typically need to call out material customer concentrations, while Cast—as a private company—does not have to. That leaves a real diligence gap. There is also a reference-quality issue. Many of the strongest public proofs are vendor-authored case studies or press releases, and some named customers such as BMW, Cisco, FICO, and Swisscom appear more often as referenced logos than as deeply documented deployments. This does not invalidate the customer story, but it does mean the evidence is uneven. A prudent reader should separate high-depth
    proof accounts like NielsenIQ, project44, Branch, ALLEN Digital, Hugging Face, Akamai, and Mercedes-Benz.io from logo-only references whose deployment scope is not publicly described.
  claimRefs:
