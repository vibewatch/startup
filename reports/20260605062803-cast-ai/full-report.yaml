      - number: '7.4'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Cast AI does have a credible mitigation stack. On paper it combines legal controls (terms, privacy policy,
              DPA), security governance (ISO 27001, SOC 2 Type II), compliance tooling (CIS-certified reporting,
              security dashboard, Kvisor), and public technical documentation about permissions and data handling. Those
              controls reduce but do not eliminate risk. The key diligence question is therefore not whether controls
              exist; it is whether they are specific enough for the buyer's deployment context and whether the
              organization can support them reliably while the platform evolves. Practical kill criteria follow directly
              from the public record's weak spots. If management cannot clearly map required permissions and data flows,
              explain the current and future state of the security transition, provide incident-management evidence
              beyond aggregator snapshots, or demonstrate that GPU and multicloud dependencies are operationally
              resilient, risk should rise materially. Likewise, if customer concentration, retention, or support burden
              turn out to be worse than the public file suggests, the legal and operational mitigants will matter less
              because the business model itself will be more fragile. In short, the mitigants are real, but they need
              customer-specific validation before being treated as sufficient.
            claimRefs:
              - CR022
