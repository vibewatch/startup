      - CV023
      - CV024
      - CV026
      - CV027
      - CV038
      - CV042
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: wide
    summary: >-
      A $1B enterprise value implies very different ARR requirements depending on which multiple band the market
      ultimately assigns.
    data:
      items:
        - label: 21.2x AI-native VC median
          value: 47.2
        - label: 11.0x AI-native public benchmark
          value: 90.9
        - label: 8.0x solid infra software
          value: 125
        - label: 5.5x legacy SaaS VC median
          value: 181.8
        - label: 3.8x legacy SaaS M&A median
          value: 263.2
      yAxis:
        label: ARR needed for $1B EV (USD M)
    approximationNotes: >-
      Values are reverse-engineered using EV ÷ revenue multiple; they are sensitivity points, not disclosed ARR ranges
      for Cast AI.
    claimRefs:
      - CV010
      - CV011
      - CV016
      - CV017
      - CV018
      - CV019
      - CV038
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: >-
      For a few illustrative ARR bands, the fair-value range swings materially depending on whether Cast is treated as
      AI-native or closer to legacy software.
    data:
      items:
        - label: If ARR is $50M
          low: 190
          mid: 550
          high: 1060
        - label: If ARR is $75M
          low: 285
          mid: 825
          high: 1590
        - label: If ARR is $100M
          low: 380
          mid: 1100
          high: 2120
    approximationNotes: >-
      Low uses a 3.8x legacy-software M&A multiple, mid uses an 11.0x AI-native public benchmark, and high uses a 21.2x
      AI-native VC median from external analyst-market-data sources.
    claimRefs:
