              exceeded $180 million after that event. In January 2026 the company announced a strategic investment from
              Pacific Alliance Ventures and said valuation had crossed $1 billion, which indicates a fresh balance-sheet
              step-up and continued investor confidence. TechCrunch said the Series C proceeds were earmarked for more
