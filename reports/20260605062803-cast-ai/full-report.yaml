  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Cast AI's own materials consistently describe more than a dashboard or recommendation engine. The product
              starts from Kubernetes cost monitoring and optimization suggestions, but the real center of gravity is
              execution: autoscaling, node selection, rightsizing, Spot orchestration, bin packing, and policy controls
              that alter how clusters actually run. The module map now extends beyond that original core. Cluster
              hibernation lets non-production environments scale to zero while keeping the control plane intact. OMNI
              adds a multicloud or cross-region compute control layer for scarce GPU and compute capacity. GPU
              Optimization for AI Infrastructure adds workload partitioning, Dynamic Resource Allocation, and throughput
              optimization for expensive accelerators. Security broadens the surface again through Kvisor, which Cast
              documents as an open-source security agent for runtime monitoring, image scanning, and network
              observability. The result is a stack with at least five meaningful product layers: monitoring,
              autoscaling, cost optimization, AI/GPU orchestration, and security or compliance tooling. That breadth is
              exactly what differentiates Cast AI from point tools but also raises complexity, implementation scope, and
              documentation demands.
