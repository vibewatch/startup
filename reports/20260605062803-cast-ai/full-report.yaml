      - number: '1.3'
        title: Capital Base and Unicorn Milestone
        blocks:
          - type: paragraph
            body: >-
              The best-documented financing event in the public record is the April 2025 Series C. Official,
              Reuters-syndicated, and tech press sources align on the round size at $108M and on the lead investors: G2
              Venture Partners and SoftBank Vision Fund 2, with Aglaé Ventures joining existing backers such as
              Hedosophia, Cota Capital, Vintage Investment Partners, Creandum, and Uncorrelated Ventures. Reuters
              reported that the round valued Cast AI at about $850M and pushed total disclosed capital above $180M. The
              January 2026 milestone is different. Cast AI and BusinessWire confirmed a strategic investment from
              Pacific Alliance Ventures, Shinsegae Group's U.S. corporate venture arm, and said the company's valuation
              had crossed $1B. But public materials did not disclose the amount of the investment, whether it was
              primary or mixed with secondaries, or how the financing affected total raised and preference-stack
              dynamics. The result is a credible unicorn milestone with incomplete cap-table transparency: the valuation
              event is real, the strategic investor is known, but the economics of the 2026 round remain materially
              under-disclosed.
