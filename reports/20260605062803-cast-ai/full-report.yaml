      - number: '2.3'
        title: Buyers, Users, and Budget Owners
        blocks:
          - type: paragraph
            body: >-
              FinOps and cloud cost optimization are inherently cross-functional, which matters because Cast AI’s buyer
              map is not a single budget line. The FinOps Foundation explicitly frames the discipline around shared
              ownership among engineering, finance, product, operations, procurement, and executives. Google’s
              cost-optimization guidance names CTOs, CIOs, CFOs, architects, developers, administrators, and operators
              as relevant stakeholders, while Microsoft describes FinOps as an operating bridge between financial
              management and cloud engineering. In practice, the hands-on users are usually platform engineering, SRE,
              DevOps, or AI infrastructure teams responsible for cluster behavior and resource efficiency. The paying
              centers are typically central cloud platforms, infrastructure engineering budgets, or executive-controlled
              optimization programs tied to finance and procurement. The CNCF Kubernetes FinOps microsurvey shows why
              these buyers care: for many organizations Kubernetes already consumes a meaningful share of cloud budget,
              from up to a quarter for half of respondents to above one million dollars per month for a large-spend
              cohort. That spending concentration makes even modest utilization gains material to finance and platform
              teams.
