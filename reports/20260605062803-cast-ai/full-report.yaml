      - number: '8.4'
        title: Diligence Asks and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              The valuation thesis breaks in only a few ways, but they are fundamental. First, if ARR turns out to be
              materially below the rough thresholds implied by premium AI-native multiples, the current price is too
              full. Second, if gross margins or retention resemble lower-quality infrastructure software rather than
              sticky, high-value automation, the premium multiple case weakens. Third, if AI and GPU expansion turns out
              to be more narrative than monetized reality, the company should probably be valued on the narrower
              Kubernetes-optimization story rather than on a broader AI-infrastructure narrative. Finally, if native
              cloud and open-source substitutes continue to compress willingness-to-pay, Cast may struggle to hold a
              premium even if growth remains respectable. The diligence asks are therefore straightforward and
              non-negotiable: current ARR, gross margin, NRR, customer concentration, AI / GPU module attach rates,
              contract structure, and the exact economic terms of the January 2026 round. Until those are disclosed,
              valuation work remains an exercise in scenario framing and comparables rather than a true intrinsic model.
              That is enough to say the company is worth tracking, but not enough to say the $1 billion mark is
              definitively cheap.
            claimRefs:
              - CV015
              - CV020
              - CV028
              - CV029
              - CV030
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV015
              - CV020
              - CV028
              - CV029
              - CV030
              - CV038
              - CV039
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The debate is multiple band, not milestone reality
            body: >-
              The market event itself is well supported: Cast crossed $1B. The hard question is which revenue-multiple
              band actually belongs on the company, and that depends on private metrics the public file still does not
              disclose.
            calloutType: insight
            claimRefs:
              - CV001
              - CV005
              - CV015
              - CV038
          - type: callout
            title: Opacity is the core anti-thesis
            body: >-
              The cleanest bearish argument is not product failure; it is that investors may be underwriting a premium
              AI-native multiple without enough public evidence on ARR, gross margin, retention, or the exact mechanics
              of the undisclosed 2026 round.
            calloutType: risk
            claimRefs:
              - CV005
              - CV015
              - CV020
              - CV035
              - CV037
