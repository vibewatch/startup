  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame Cast AI’s market is as an overlap problem. The company is not simply a
              cloud-cost dashboard vendor, a generic observability tool, or a pure GPU cloud provider. Instead it sits
              at the intersection of cloud FinOps, Kubernetes cost management, and AI/GPU workload optimization. The
              broadest lens comes from CloudOps and cloud FinOps software, where vendors promise financial visibility,
              optimization, governance, and increasingly automated execution across hybrid and multi-cloud estates. The
              narrower and more direct lens is Kubernetes cost management, which focuses on rightsizing, autoscaling,
              cost allocation, and governance for containerized workloads. A third adjacency has become much more
              important as AI workloads scale: GPU allocation, hybrid infrastructure placement, and the economics of
              inference. Market boundary also depends on substitutes. Google’s GKE Autopilot, Microsoft’s AKS
              optimization guidance, Red Hat OpenShift cost management, IBM’s hybrid cloud optimization stack, and
              open-source Karpenter all cover pieces of the same problem. That means Cast AI’s real addressable market
              is not every dollar of cloud spend but the subset of organizations that want cross-platform optimization
              beyond native controls.
