      - number: '3.3'
        title: Native Cloud, Open-Source, and Switching-Cost Dynamics
        blocks:
          - type: paragraph
            body: >-
              The most serious displacement risk does not come only from venture-backed peers. It comes from the fact
              that hyperscalers and open-source projects now solve large chunks of the problem directly inside the
              stack. Karpenter already gives AWS-oriented teams open-source just-in-time node provisioning and
              cost-aware consolidation logic. Google markets GKE Autopilot as a mode where Google manages nodes,
              scaling, security, and infrastructure choices, while also describing cost-optimization features as
              included in GKE pricing. Microsoft is pushing the same direction by making AKS node auto-provisioning a
              Karpenter-based native capability and keeping the classic cluster autoscaler available for lighter use
              cases. OpenCost establishes a low-cost floor under cost allocation and showback, and the FinOps Foundation
              reinforces that usage optimization can be treated as a broad internal operating practice rather than a
              purchased product. These facts lower switching costs and encourage multi-homing. A buyer can combine
              visibility from Kubecost or OpenCost with native provisioning from Karpenter, GKE, or AKS instead of
              standardizing fully on Cast AI.
