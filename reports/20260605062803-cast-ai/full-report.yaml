  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation moves from a credible unicorn fact pattern through comp-based uncertainty to a fair / track
      conclusion.
    data:
      nodes:
        - id: fact
          label: Valuation Fact
          detail: '> $1B milestone is publicly supported'
        - id: proof
          label: Customer / Product Proof
          detail: Strong enterprise references and AI / GPU product expansion
        - id: opacity
          label: Economic Opacity
          detail: ARR, margin, NRR, and round amount undisclosed
        - id: comps
          label: Wide Comp Dispersion
          detail: AI-native premium vs legacy software compression
        - id: output
          label: Fair / Track
          detail: Worth tracking, not obviously mispriced in investor’s favor
      edges:
        - from: fact
          to: proof
          label: supported by
        - from: proof
          to: opacity
          label: offset by
        - from: opacity
          to: comps
          label: forces
        - from: comps
          to: output
          label: leads to
    claimRefs:
