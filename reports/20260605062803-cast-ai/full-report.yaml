companyProfile:
  summary: >-
    Cast AI is a Miami-headquartered, Vilnius-centered infrastructure software company that sells a Kubernetes
    automation platform spanning cost monitoring, rightsizing, autoscaling, spot management, and newer multicloud GPU
    orchestration through OMNI Compute. The company was founded in 2019 by repeat founders who previously experienced
    cloud-cost pain at Zenedge, and it now targets mid-to-large enterprises that run meaningful cloud-native and AI
    workloads across public clouds.
