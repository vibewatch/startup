            title: Trust risk is operational, not just legal
            body: >-
              The biggest risk is not whether Cast has policies. It is whether a product that touches customer
              infrastructure this deeply can keep permissions, documentation, incident response, and evolving feature
              surfaces aligned in production.
            calloutType: risk
