      - number: '7.3'
        title: Partner, Dependency, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The product architecture makes Cast highly dependent on outside systems and on its own ability to keep
              specialist talent aligned with a fast-moving roadmap. Dependence on cloud providers is obvious from the
              docs: permissions, ports, price feeds, status-page components, and region or GPU capacity all sit upstream
              of Cast's automation engine. That matters because a customer may blame Cast even when the root cause is a
              cloud-provider issue or a capacity shortfall. Dependency risk also increased with the push into OMNI
              Compute and GPU fungibility, where scarce supply and multicloud orchestration become part of the value
              proposition. People risk is subtler but still important. The careers page emphasizes speed, ownership,
              customer obsession, and hiring the best; the SOC 2 blog emphasizes the security pedigree of the founding
              team and the CTO's background in security products. Those are good signs, yet they also imply a company
              that must keep hiring scarce platform and security talent while shipping aggressively. Combined with docs
              that explicitly admit feature movement and transition, the execution question is not whether Cast
              understands the category. It is whether it can sustain high-quality delivery, support, and documentation
              across a widening product surface without overextending itself.
