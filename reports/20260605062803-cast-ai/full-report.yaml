              The cleanest near-term opportunity is not every Kubernetes user. It is the subset of buyers who already
              exhausted native cloud controls or who operate across providers, clusters, and workload types in ways that
              make a single-cloud answer insufficient. That is where cross-cloud automation and unified governance can
