      - number: '1.2'
        title: Founders, Leadership, and Geography
        blocks:
          - type: paragraph
            body: >-
              The founder bench is unusually stable and clearly identified in official and investor materials. Cast AI
              publicly lists Yuri Frayman as CEO, Leon Kuperman as CTO, and Laurent Gil as President, with all three
              described as co-founders. Third-party interview material adds useful context: the trio previously built
              Viewdle and Zenedge together, giving them a long operating history before launching Cast AI. The
              present-day executive bench appears broader than a simple founder-led startup, with leadership roles
              spanning finance, people operations, customer success, and global sales. Geography is equally important to
              the diligence narrative. Independent reporting consistently calls Cast AI Miami-based for corporate
              positioning, but multiple sources also describe Vilnius as a core engineering center and the source of the
              company's Lithuanian-unicorn identity. That mix is strategically useful for recruiting and narrative
              positioning, but public governance disclosure remains thin. Reviewed sources do not clearly disclose board
              composition, voting control, or protective investor rights, so founder influence looks strong but cannot
              be cleanly quantified from public evidence alone.
