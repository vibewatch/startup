      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The technical operating model is best read as a continuous control loop around existing Kubernetes
              clusters. In the core product, Cast AI agents and policies monitor demand, compare pricing and capacity,
              and then drive node-level and workload-level actions such as rightsizing, autoscaling, or smart eviction.
              The Mercedes-Benz.io engineering write-up gives unusually concrete outside evidence of how this works in
              production: the team moved from static node autoscaling to dynamic workload-aware autoscaling, runtime bin
              packing, and smart eviction under zero-downtime constraints. Hibernation shows another part of the
              operating model, where essential components are deliberately brought back first via resume nodes before
              normal workloads return. OMNI extends the architecture beyond one region or provider by letting the
              autoscaler evaluate external locations and scarce GPU capacity across clouds. GPU Optimization then layers
              on partitioning, sharing, and placement logic for accelerators. This makes the platform technically
              ambitious and operationally valuable, but it also means Cast is deeply dependent on provider APIs,
              permissions, scheduler behavior, capacity signals, and correct orchestration of its own critical
              components.
