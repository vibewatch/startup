- id: trust-security-and-technology-risks
  title: Trust, Security, and Technology Risks
  body: Trust and quality controls are real but unevenly mature in the public file. On the positive side, Cast documents Kvisor as an open-source security agent that can scan images, monitor runtime behavior, observe network activity, and expose centralized compliance views in the security dashboard. Cast also publicized CIS Benchmark certification for its Security Report across major managed-Kubernetes environments, which is a meaningful trust signal for regulated or enterprise buyers. At the same time, the documentation repeatedly warns that the Kubernetes security feature set is undergoing significant changes and that some features are being deprecated or moved in the console. That warning is valuable because it reveals product evolution honestly, but it also highlights transition risk. Reliability signals are similar. StatusGator and IsDown show that the platform has public incident history, and several 2026 signals point to short cloud-provider-related degradations rather than perfect
    invisibility. Together, these sources suggest the technology is production-worthy and improving, but not frictionless. Cast's moat is technical depth; its risk is that the same depth requires careful permissions, documentation, and incident handling to keep customer trust high.
