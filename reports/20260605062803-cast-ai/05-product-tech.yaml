  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - User problem
  - Technical mechanism
  - Evidence of maturity
  - Current status
  rows:
  - - Core autoscaler / optimization
    - Overprovisioned clusters and inefficient node mix
    - Autoscaling, rightsizing, spot automation, bin packing, policy controls
    - Docs, Terraform resource, AWS Marketplace, multiple customer cases
    - Mature core product
  - - Cluster hibernation
    - Non-production clusters incur unnecessary 24/7 compute spend
    - Scale-to-zero while preserving control plane and resuming critical components first
    - Dedicated documentation with manual, scheduled, API, and Terraform workflows
    - Shipped / documented
  - - OMNI Compute
    - GPU scarcity and multicloud / cross-region capacity fragmentation
    - Extend clusters to other regions and clouds; autoscaler compares price and availability
    - Docs, launch press, and external news coverage
    - Early access
  - - GPU optimization / AI infrastructure
    - Low GPU utilization and expensive AI workloads
    - GPU sharing, partitioning, Dynamic Resource Allocation, bin packing
    - GPU product page, benchmark report, ALLEN Digital case study
    - Active growth area
  - - Kvisor security
    - Need runtime security, vulnerability scanning, and compliance
    - Open-source agent plus dashboard, scans, and network observability
    - Security docs, CIS certification press, GitHub repo
    - Live but undergoing changes
  notes: Rows reflect the major product surfaces visible in reviewed public materials as of the 2026 run date; status labels capture the maturity signals those materials explicitly provide.
