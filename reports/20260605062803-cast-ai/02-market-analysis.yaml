callouts:
- calloutType: insight
  title: Cast AI’s category looks most defensible where native tools fragment
  body: The cleanest near-term opportunity is not every Kubernetes user. It is the subset of buyers who already exhausted native cloud controls or who operate across providers, clusters, and workload types in ways that make a single-cloud answer insufficient. That is where cross-cloud automation and unified governance can command budget.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM042
- calloutType: risk
  title: Headline TAM numbers overstate the investable opportunity
  body: Broad CloudOps and cloud FinOps reports are useful for directionality, but they include monitoring, services, governance, and adjacent spend that a Kubernetes-native optimizer will never fully capture. A valuation case built on the full market rather than a constrained overlap market would be materially overstated.
  claimRefs:
  - CM001
