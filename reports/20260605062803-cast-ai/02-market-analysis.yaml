  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cast-specific-sam
    missingEvidence: A market study that sizes only the overlap of Kubernetes cost management, multicloud FinOps, and AI/GPU optimization relevant to Cast AI.
    whyItMatters: Headline CloudOps or cloud FinOps TAMs materially overstate the investable opportunity if they are used without narrowing assumptions.
    diligencePath: Commission a bottoms-up market model using customer spend cohorts, cluster scale, and AI workload intensity instead of generic research-house categories.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: buyer segmentation detail
    missingEvidence: Vertical-by-vertical evidence on which industries and company sizes most often buy third-party Kubernetes optimization instead of relying on native tools.
    whyItMatters: Without better vertical conversion data, segment priority remains more qualitative than quantitative.
    diligencePath: Review customer roster by industry, ACV, cloud footprint, and primary replacement pattern versus native or internal tooling.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: native-tool displacement
    missingEvidence: Empirical conversion data showing how often enterprises graduate from native controls to third-party optimization vendors and why.
    whyItMatters: Third-party penetration depends on proving that native or open-source substitutes leave enough unmet need to justify incremental spend.
    diligencePath: Ask management for win/loss reasons, POC conversion data, and displacement evidence versus Autopilot, AKS, Karpenter, Kubecost, and internal platform teams.
