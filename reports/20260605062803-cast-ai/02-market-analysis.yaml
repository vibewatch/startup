- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer / Payer
  - Cast AI Relevance
  rows:
  - - Cloud FinOps / cloud financial management
    - Spend visibility, governance, optimization, chargeback, forecasting across cloud estates
    - Generic ERP spend management or non-technology procurement
    - CFO / CIO / FinOps leader
    - Broad outer boundary; relevant but too wide alone
  - - Kubernetes cost management
    - Cluster cost allocation, rightsizing, autoscaling, showback, optimization for containerized workloads
    - Non-container application monitoring and generic observability budgets
    - Platform engineering, SRE, infrastructure
    - Core — closest direct market lens
  - - AI / GPU workload optimization
    - GPU provisioning, workload placement, hybrid inference economics, utilization improvements
    - Standalone model training SaaS or chip manufacturing economics
    - AI infrastructure and platform teams
    - High-growth adjacency increasingly bundled into the same buying motion
  - - Managed Kubernetes native controls
    - Autopilot / AKS / provider-native automation and billing controls
    - Third-party cross-cloud governance layers
    - Cloud platform team
    - Status-quo substitute, not full third-party TAM
  - - Hybrid / multicloud cost governance
    - Cross-cloud visibility, tagging, policy, budget controls, showback
    - Broad data-center CapEx programs
    - FinOps, finance, central IT
    - Relevant because Cast competes when native tools fragment
  - - Generic observability / APM
    - Telemetry, traces, performance monitoring
    - Cost optimization execution and financial governance
    - SRE / observability team
    - Adjacent but mostly excluded from Cast-specific SAM
  notes: The boundary intentionally excludes raw public-cloud spend and generic IT software because Cast AI monetizes only the portion of spend that requires optimization, governance, or automation for Kubernetes-heavy and AI-intensive workloads.
