- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Structural overprovisioning in Kubernetes
    - Driver
    - Current / ongoing
    - Creates clear ROI for rightsizing and automation
    - Measure how much customer waste is still addressable versus already optimized
  - - Multi-cloud and hybrid deployment growth
    - Driver
    - Current / ongoing
    - Increases complexity and weakens single-provider optimization strategies
    - Confirm whether buyers need cross-cloud visibility or mostly single-cloud controls
  - - AI inference economics and GPU scarcity
    - Driver
    - Near-term 2026-2028
    - Raises urgency for GPU placement, sharing, and hybrid compute choices
    - Test whether Cast’s GPU capabilities are production-grade or still mostly narrative
  - - Chargeback / showback and FinOps maturity
    - Driver
    - Current / ongoing
    - Pushes buyers toward granular cost allocation and ownership models
    - Check how often Cast replaces spreadsheets or native billing exports
  - - Native cloud tools improving
    - Constraint
    - Current / ongoing
    - Shrinks third-party urgency for lower-complexity accounts
    - Benchmark Cast against GKE Autopilot, AKS, Karpenter, and Red Hat workflows
  - - Kubernetes complexity and skills shortage
    - Constraint
    - Current / ongoing
    - Can both create demand and slow implementation success
    - Quantify required onboarding effort and customer-success load
  - - Fragmented billing and tagging data
    - Constraint
    - Current / ongoing
    - Makes FinOps adoption harder and can delay value realization
    - Assess how much data cleanup customers must do before Cast creates insight
  - - Market-definition ambiguity
    - Constraint
    - Ongoing
    - Complicates TAM storytelling and valuation comparables
    - Use constrained overlap markets rather than vendor-sized headline categories
  notes: The same factor can be both a growth driver and an adoption brake; complexity creates demand for automation but also raises deployment friction and elevates customer-success costs.
