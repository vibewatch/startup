          x: 7
          y: 7
          xLabel: Digital journey control
          yLabel: Distribution reach
          note: Ordinal score synthesized from assigned evidence; not a market-share estimate.
        - label: Digit Insurance
          name: Digit Insurance
          x: 7
          y: 6
          xLabel: Digital journey control
          yLabel: Distribution reach
          note: Ordinal score based on the assigned source's description of a digital challenger; comparable data are incomplete.
        - label: Traditional insurer
          name: Traditional insurer
          x: 4
          y: 8
          xLabel: Digital journey control
          yLabel: Distribution reach
          note: Illustrative category position based on reported incumbent distribution strength and online investment.
        - label: Broker or comparison platform
          name: Broker or comparison platform
          x: 6
          y: 5
          xLabel: Digital journey control
          yLabel: Distribution reach
          note: Intermediary position; it compares or distributes policies but does not own the insurance balance sheet.
        - label: Agent or branch status quo
          name: Agent or branch status quo
          x: 3
          y: 7
          xLabel: Digital journey control
          yLabel: Distribution reach
          note: Ordinal category position reflecting assisted distribution with lower digital journey control.
        - label: Internal build
          name: Internal build
          x: 5
          y: 4
          xLabel: Digital journey control
          yLabel: Distribution reach
          note: Status-quo alternative for a platform or enterprise that builds an insurance workflow rather than buying Acko.
    xAxis:
      label: Digital journey control
      min: 0
      max: 10
    yAxis:
      label: Distribution reach
      min: 0
      max: 10
    claimRefs: [CP001, CP002, CP003, CP004]
callouts:
  - calloutType: strength
    title: Integrated digital insurer model
    body: Acko controls the insurer, product and customer-journey layers rather than acting only as a comparison intermediary.
    claimRefs: [CP001, CP002]
  - calloutType: risk
    title: Partner-led growth is also a control surface
    body: The IRDAI fine shows that partner authorization, commission design and governance can become a competitive liability rather than only a distribution advantage.
    claimRefs: [CP013, CP014]
  - calloutType: assumption
    title: Positioning scores are ordinal
    body: The quadrant uses evidence-backed ordinal judgments because the assigned pool does not provide comparable market-share, pricing or service-quality measurements.
    claimRefs: [CP003, CP004, CP012]
