  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Comparable current quotes, realized premiums, discounts and coverage terms for Acko, Digit and incumbent policies.
      whyItMatters: Without normalized price and coverage evidence, the report cannot determine whether digital distribution creates a buyer-visible price advantage.
      diligencePath: Obtain matched quotes for the same customer risk, geography, deductible and coverage from Acko, Digit and at least two incumbent insurers.
      relatedQuestionRefs: [QP004, QP008]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: moat
      missingEvidence: Competitor-comparable renewal, claims, loss-ratio, CAC and switching data by channel.
      whyItMatters: Product breadth and reported renewal mix are not enough to establish a durable advantage over digitizing incumbents or multi-homing platforms.
      diligencePath: Request cohort-level retention, claims severity, acquisition cost and contribution-margin data split by direct, embedded and partner channels.
      relatedQuestionRefs: [QP005, QP006, QP008]
      relatedTableRefs: [TP002]
    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: Public remediation detail and current partner-control testing after the IRDAI fine.
      whyItMatters: The historical enforcement action could affect trust and distribution economics if control improvements are not demonstrable.
      diligencePath: Obtain the regulator correspondence, remediation plan, partner-register controls and independent testing results.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP002]
