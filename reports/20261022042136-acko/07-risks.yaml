company:
  name: Acko
chapter:
  number: 7
  title: Risks
  summary: Acko's most evidenced risks are regulatory-control execution, persistent underwriting losses, and operating-model change while it prepares for a potential IPO. The evidence also shows useful mitigants—solvency disclosure, board processes, product controls, and automated claims—but does not establish that remediation is complete or that profitability is durable.
sections:
  - id: regulatory-governance
    title: Regulatory and governance exposure
    body: >-
      The clearest adverse signal is a 2025 IRDAI penalty concerning outsourcing and
      commission practices. The reported order says Acko used an arrangement with Ola
      Financial Services to solicit or aid policy sales while the counterparty was not
      legally authorised for that role, and that payments described as advertising,
      web-branding, and API fees were treated as remuneration or rewards. The same
      account says the regulator required board-level consideration and an Action Taken
      Report within 90 days. This is a control-design and oversight risk, not evidence
      that issued policies were invalid: legal commentary in the source says policies
      remained enforceable. The FY2023-24 annual report separately discloses a prior
      regulatory penalty as a contingent liability while listing no penalty awarded in
      that year's table, so the publication record is not a complete substitute for the
      underlying order or remediation evidence. Monitoring should focus on the ATR,
      board minutes, intermediary authorisations, related-party payment controls, and
      repeat findings.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-financial
    title: Operating and financial model risk
    body: >-
      Acko remains exposed to the conversion of scale into underwriting profit. Its
      FY2023-24 general-insurance annual report records total revenue of Rs 1,390.64
      crore, a loss after tax of Rs 456.43 crore, gross written premium of Rs 1,870
      crore, and a solvency ratio of 1.89 times. The same report shows net incurred
      claims and other outgoes of Rs 850.19 crore and operating expenses of Rs 829.35
      crore for that year. More recent reported group figures point in a better
      direction—FY25 operating revenue of Rs 28.36bn and a consolidated net loss of
      Rs 4.24bn versus Rs 6.67bn—but the reporting scope is not identical to the
      annual-report entity, and the company is still described as not profitable. The
      risk is therefore not simply loss magnitude; it is whether product mix, claims,
      expense ratios, and capital remain controlled as volume grows. Required tests are
      entity-level reconciliation, loss-ratio and expense-ratio trends, solvency headroom,
      and cash/capital needs under adverse claims and pricing conditions.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: execution-dependency
    title: Execution, people, and dependency risk
    body: >-
      The digital distribution model creates operational leverage and dependency at the
      same time. Acko's own description in the annual report identifies embedded
      business as its fastest-growing line in FY2023-24, while the IPO coverage says
      platforms such as Amazon India and Ola expose products to large user bases.
      Those relationships can lower distribution friction, but they also make
      partner governance, API availability, data handling, and economics material
      failure points. A 2026 report says Acko reduced its workforce by around 5% amid
      an AI-led restructuring, with approximately 1,200 employees as of March 2026,
      and calls it the company's second known layoff round. The same report links the
      change to a proposed IPO and reports a senior marketing transition. Workforce
      changes may improve efficiency, but they can also affect controls, claims
      service, product delivery, and institutional knowledge. The practical mitigation
      is a control-owner map for critical partners and a service-quality dashboard
      spanning claims, outages, complaints, staffing, and regulatory exceptions.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring, mitigations, and thesis-break triggers
    body: >-
      There are credible but incomplete mitigants. The annual report says Acko began
      quality checks at garages to reduce rework, expanded to more than 4,000 hospitals,
      and automated windshield-damage claims; it also reports investment primarily in
      government securities and AAA-rated corporate bonds, with AA+ exposure below 3%.
      The report describes board evaluation, independent directors, and malus/clawback
      provisions for misconduct or poor regulatory compliance. These controls reduce
      identified exposure but do not prove effectiveness after the later IRDAI finding
      or during restructuring. A thesis break would be a repeated or materially larger
      regulatory action, failure to evidence the required remediation, solvency falling
      toward the regulatory minimum, worsening claims and expense ratios, or service
      deterioration after workforce and partner changes. A diligence decision should
      require the underlying IRDAI order and ATR, entity-reconciled management accounts,
      partner concentration and outsourcing schedules, incident and complaint data, and
      evidence that control testing reaches embedded distribution.
    claimRefs: [CR013, CR014, CR015, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Outsourcing and commission controls, "IRDAI penalty reported for outsourcing and remuneration practices involving OFSPL; board review and ATR required.", High, Critical, Developing, High, "Obtain order, board minutes, ATR, and current intermediary-authorisation testing."]
      - [Remediation and governance follow-through, "Public coverage says Acko had not issued a statement; FY2023-24 report discloses a contingent regulatory penalty but not the later outcome.", Medium, High, Developing, High, "Verify remediation closure, repeat findings, and accountable control owners."]
      - [Product and regulatory change, "Annual report says products were revised and compliance with applicable regulations was an operating focus.", Medium, High, Moderate, Medium, "Review product approvals, change controls, and compliance testing by line."]
    notes: "Rows synthesize the cited regulator-related reporting and FY2023-24 company filing; likelihood, maturity, and residual exposure are analytical judgments tied to the stated evidence and require management validation."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented regulatory and governance risks available in assigned sources through 2026-10-22"
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Underwriting losses and claims-cost pressure, High, Critical, Developing, High, "No current public entity-reconciled loss-ratio bridge."]
      - [Expense and capital intensity during growth, Medium, High, Developing, High, "Need current expense ratio, solvency headroom, and capital plan."]
      - [Claims quality and service failure, Medium, High, Moderate, Medium, "Need complaint, turnaround, rework, and outage distributions."]
      - [Investment and credit risk, Low, Medium, Moderate, Low, "Need current asset-liability and stress-test disclosures."]
    notes: "The annual report supplies historical financial, solvency, claims-process, and investment evidence; the current residual assessments are not audited forecasts and should be stress-tested."
    claimRefs: [CR005, CR006, CR007, CR008, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - [Embedded distribution, "Amazon India, Ola, and other digital platforms", "Partner policy/API access, economics, or authorisation changes reduce demand or create compliance exposure.", High, "Contract, intermediary-status, API, and partner-control reviews.", High, "Partner share, uptime, complaints, and authorised-distribution exceptions."]
      - [Outsourced operations, "Claims, technology, and marketing service providers", "Provider failure or weak oversight causes claims, data, or regulatory breaches.", Critical, "Vendor due diligence, control testing, and board reporting.", High, "Critical-vendor incidents, audit exceptions, and remediation ageing."]
      - [Workforce and leadership transition, "AI restructuring and senior marketing change", "Loss of control expertise or service capacity during restructuring.", High, "Retention plans, control-owner map, and service-level monitoring.", Medium, "Staffing, claims turnaround, control defects, and attrition."]
    notes: "Dependency rows are based on assigned coverage and the company annual report; public sources do not disclose partner concentration, contract protections, or vendor-level incident rates."
    claimRefs: [CR009, CR010, CR011, CR012, CR016]
