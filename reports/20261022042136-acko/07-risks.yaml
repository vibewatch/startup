    xAxis: "Qualitative likelihood"
    yAxis: "Qualitative impact"
    claimRefs: [CR001, CR005, CR009, CR010, CR013, CR016]
callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: "The IRDAI-related outsourcing and commission finding is the most decision-relevant risk because it links distribution growth to control design, governance escalation, and unresolved remediation evidence."
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: assumption
    title: Thesis-break trigger
    body: "Treat a repeated material regulatory finding, absent remediation proof, deteriorating solvency or claims economics, or service degradation during restructuring as a thesis-break event."
    claimRefs: [CR006, CR007, CR013, CR014, CR016]
