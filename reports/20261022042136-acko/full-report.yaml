      - number: '5.2'
        title: Operating architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The public technical description is high level but coherent: cloud-based and API-based services support
              KYC workflows, external data retrieval, behavior-linked pricing, and claims management with fraud
              detection. The architecture appears to combine direct digital journeys with partner distribution and a
              data layer, rather than expose a documented developer platform. Acko's annual report confirms a
              diversified insurance product operating context and international travel launches, while the technical
              deck identifies vehicle, health, and micro-insurance as the main product lines. The differentiation is
              therefore an operating model—fast digital issuance, embedded distribution, and data-assisted
              underwriting—rather than a publicly demonstrated proprietary algorithm or exclusive infrastructure.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
