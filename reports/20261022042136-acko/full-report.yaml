      - number: '1.4'
        title: Ground truth and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Acko has a credible identity as a regulated, technology-led insurer with a differentiated distribution
              thesis, but its evidence base contains an important perimeter problem. The annual report is company-issued
              and audited for Acko General Insurance Limited; media reports describe the broader Acko group, its
              technology-services parent, or a prospective IPO vehicle. The FY2024 report also shows a Rs 456.43 crore
              loss after tax and total expenditure of Rs 1,847.08 crore, while later reports discuss FY2025 group
              revenue and loss improvement without providing the same audited scope in the assigned materials. The
              regulatory record adds a material governance and distribution diligence item: Economic Times reports an
              IRDAI Rs 1 crore fine over arrangements with Ola Financial Services, while explaining that the order did
              not invalidate policyholder contracts. Before relying on current valuation, revenue, headcount, customer
              or IPO metrics, diligence should obtain the latest audited entity-level statements, cap table, board
              roster, solvency and EoM compliance, and the full regulatory remediation record.
            claimRefs:
              - CO016
              - CO017
              - CO018
              - CO019
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The addressable market should be bounded around regulated insurance risk transfer rather than all
              financial protection or all digital commerce. Acko's documented operating scope spans motor, health,
              travel, life, and embedded products, with the company describing digital purchase, renewal, and claims as
              alternatives to agent-led and paper-heavy workflows. The status quo is not simply another app: it includes
              branch and agent distribution, broker-led comparison, and customers who remain uninsured or self-insure
              because conventional purchase and claims processes are cumbersome. The sources also show that embedded
              distribution changes the buying moment by placing cover in partner transactions, but it does not remove
              licensing, capital, claims, or consumer-protection constraints. Acko's market boundary therefore includes
              premiums written through direct and partner channels, while excluding partner platform GMV, general
              fintech spend, and unverified claims about a total digital-insurance market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is heterogeneous. One investor-style report estimates an India insurance TAM of
              $280 billion in 2025 and describes a 12–15% CAGR, while other sources provide company revenue, funding, or
              product descriptions rather than a comparable market denominator. The $280 billion figure is therefore a
              broad directional lens, not Acko's SAM or SOM; its methodology and denominator are not disclosed in the
              prefetched text. Acko's FY24 revenue figures are likewise company-scale indicators, not market size. The
              defensible conclusion is that a large protection gap and digital distribution trend may support expansion,
              but a valuation case needs a reconciled premium pool by product, geography, channel, and payer. The table
              preserves the conflicting scope rather than converting company revenue into market share.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
              - CM010
              - CM012
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buying chain differs by segment. A retail policyholder is the user and often the payer; an employer,
              lender, travel platform, ecommerce marketplace, or mobility platform can instead own distribution access
              or budget for embedded cover. Sources describe direct purchase through web and app, partner checkout
              placements, and enterprise-oriented products, implying distinct adoption triggers: convenience, contextual
              relevance, faster claims, or distribution economics. Drivers include smartphone and internet use,
              automated underwriting, personalized products, and lower friction. Constraints include trust without
              physical agents, regulatory authorization of intermediaries, claims quality, rising acquisition costs, and
              the still-unproven conversion of distribution scale into underwriting profit. The 2025 IRDAI-related
              reporting is a concrete reminder that an API or marketing relationship can create compliance exposure when
              the partner's authorization and compensation structure are not clear.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Embedded distribution is an adoption channel, not a market-size proof
            body: >-
              Acko's partner-led reach can reduce purchase friction and expose products at a point of need, but the
              retained evidence does not quantify partner conversion, renewal, loss ratio, or channel CAC. Treat
              embedded reach as a mechanism requiring unit-economic validation, not as a substitute for SAM/SOM
              evidence.
            calloutType: insight
            claimRefs:
              - CM003
              - CM010
              - CM012
          - type: callout
            title: SAM and SOM remain unresolved
            body: >-
              The broad $280 billion estimate has no disclosed methodology in the retained text, and public sources do
              not provide a consistent denominator for Acko's product and channel mix. A decision-grade market case
              therefore still needs reconciled premium pools and channel-level conversion and retention data.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and customer proposition
        blocks:
          - type: paragraph
            body: >-
              Acko competes across several layers rather than against a single named rival. Traditional insurers such as
              ICICI Lombard and newer digital challenger Digit combine insurance underwriting with established or
              growing distribution, while brokers and comparison platforms compete for the customer decision without
              owning the risk-bearing balance sheet. Acko's distinct proposition is to own the insurer role and control
              a digital buying, servicing and claims journey. FoundLanes describes the company as an internet-only
              carrier rather than an online intermediary, while also noting that its mature model is hybrid: direct
              channels coexist with API-based enterprise partnerships. StartupWired similarly reports that Acko competes
              with traditional insurers and new-age digital platforms as incumbents invest in their own online channels.
              The practical buyer choice is therefore between Acko's integrated digital experience, an incumbent's
              distribution breadth and balance-sheet history, a broker's comparison convenience, or the status quo of
              buying through an existing bank, mobility platform or agent.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
      - number: '3.2'
        title: Capability, packaging and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Acko's evidence-backed advantages are concentrated in workflow control and product experimentation, not in
              a disclosed price advantage. The FY24 annual report records automated windshield settlement,
              visual-assessment and customer-steerage initiatives, while the October 2026 launch extends the proposition
              before a claim through DriveCam, ACKO Clinic and AirPass. Those products also show a move from one-off
              policy purchase toward service and subscription touchpoints. The public record does not provide a
              like-for-like premium schedule against Digit or ICICI Lombard, nor comparable realized loss ratios, CAC or
              retention by channel. Pricing cells are therefore marked unknown where the pool does not support
              comparison. Partnerships can lower distribution friction, but the regulatory source shows why partner
              incentives and authorization must be governed tightly.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The potential moat is cumulative operating data, integrated product and claims infrastructure, renewal
              behavior and access to digital distribution. More than 60% of motor revenue was described by ACKO as
              coming from renewals. Its FY24 report documents a 4,000-plus-hospital network, while the October 2026
              launch coverage says its repair and roadside-assistance network services about 2,500 cars per month. These
              are useful operating assets, but they are not exclusive: incumbents can digitize their channels, platforms
              can multi-home insurers, and a broker or internal build can remain a substitute for some buyers. The
              regulatory fine for historical outsourcing and commission practices is adverse evidence that partner-led
              distribution can create execution and trust liabilities. Because the assigned evidence does not provide
              competitor-comparable pricing, loss ratios, acquisition costs or switching rates, durability still depends
              on unverified underwriting discipline and compliant scale rather than a demonstrated structural lock-in.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
