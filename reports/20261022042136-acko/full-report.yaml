      - number: '5.3'
        title: Maturity, dependencies, and control risks
        blocks:
          - type: paragraph
            body: >-
              Maturity is mixed. The sources show a live multi-line product surface, partner-specific insurance use
              cases, and a cloud/API workflow, but they do not disclose architecture diagrams, API documentation,
              uptime, incident history, model validation, security attestations, or customer-support performance.
              Partner dependence is material to the embedded model: the technical deck lists platforms including Amazon,
              Ola, Zomato, and others, while an Economic Times report describes a regulatory finding concerning the
              structure of Acko's historical relationship with Ola Financial Services. That finding was about
              outsourcing and commission practices rather than policy validity, but it makes partner governance,
              authorization, data handling, and audit trails central diligence questions. Current remediation and
              control testing are not public in the assigned pool.
