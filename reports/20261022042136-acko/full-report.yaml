figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Selected dated milestones show Acko's path from founding and licensing to regulated scale, leadership transition,
      and prospective IPO.
    data:
      items:
        - date: 2016-11
          label: Founded
          details: Varun Dua and Ruchi Deepak launched ACKO General Insurance in Bengaluru.
          tone: positive
          claimRefs:
            - CO001
        - date: 2017-09
          label: IRDAI licence
          details: Company-history reporting says Acko received its operating licence from IRDAI.
          tone: positive
          claimRefs:
            - CO002
        - date: 2021-10
          label: Unicorn financing
          details: Company-history reporting says Acko reached a $1.1 billion valuation after a $255 million round.
          tone: positive
          claimRefs:
            - CO011
        - date: '2024-03-31'
          label: FY2024 operating baseline
          details: Acko General Insurance reported Rs 1,870 crore GWP and a 1.89-times solvency ratio.
          tone: positive
          claimRefs:
            - CO013
            - CO015
        - date: '2024-04-01'
          label: CEO transition
          details: Animesh Kumar Das became managing director and chief executive officer, subject to IRDAI approval.
          tone: positive
          claimRefs:
            - CO009
        - date: '2025-05-24'
          label: Regulatory fine reported
          details: Economic Times reported an IRDAI Rs 1 crore fine concerning outsourcing and commission practices.
          tone: adverse
          claimRefs:
            - CO019
        - date: '2026-01-14'
          label: IPO bank pitches
          details: Insurance Journal reported a potential IPO seeking up to $350 million, with terms not final.
          tone: neutral
          claimRefs:
            - CO016
        - date: 2026-04
          label: Prospective IPO valuation
          details: >-
            Assigned IPO coverage described a possible $2 billion to $2.5 billion valuation and H2 2026 confidential
            filing.
          tone: neutral
          claimRefs:
