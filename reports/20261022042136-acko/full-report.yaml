chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Acko was founded in Bengaluru in November 2016 by Varun Dua and Ruchi Deepak, after Dua's experience with
              Coverfox exposed the limits of putting a digital storefront on top of legacy insurance processes. The
              company received an Insurance Regulatory and Development Authority of India licence in September 2017,
              while later reporting says operations began in 2018. Acko's model is digitally issued insurance sold
              through its own channels and embedded partnerships, rather than an agent-led branch network. Its product
              footprint spans motor, health, travel, equipment, liability and other covers in the audited
              general-insurance report, while newer company descriptions also refer to life insurance. The identity is
              therefore clear at the brand level, but the legal and financial perimeter needs care: the FY2024 annual
              report is for Acko General Insurance Limited, whereas later revenue, funding and IPO numbers are reported
              for Acko Technology & Services or the wider Acko group.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Varun Dua remains the founder associated with Acko's strategy and digital-insurance proposition, while
              Ruchi Deepak is identified as a co-founder in the available company-history source. The audited FY2024
              report records meaningful operating-company turnover: Ruchi Deepak resigned as a non-executive director on
              16 February 2024; Sanjeev Srinivasan resigned as managing director and chief executive officer on 31 March
              2024; and Animesh Kumar Das became managing director and chief executive officer on 1 April 2024 after
              IRDAI approval on 30 April 2024. The same report records Srinivasan Vaidyanathswamy's independent-director
              reappointment and Sharayu Jadhav's appointment as an additional non-executive director. This supports a
              governance transition, but it does not establish the current board roster or demonstrate how founder
              responsibilities are divided across the group. Key-person dependence should therefore be tested against
              the current board, executive mandates, succession planning, and retention of underwriting and regulatory
              expertise.
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capital, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              Acko's capital history is substantial but the public record is not fully reconciled. Independent reporting
              says the company invited banks for a potential IPO of up to $350 million, with terms still subject to
              change, while other coverage describes a possible $2 billion to $2.5 billion valuation and more than $583
              million of total funding. A separate company-history source reports more than $450 million raised and a
              $1.1 billion valuation in October 2021; the differing totals may reflect scope, later financings, or
              source methodology and should not be collapsed into one figure. The audited FY2024 Acko General Insurance
              report provides a firmer operating-company baseline: Rs 1,870 crore of gross written premium, Rs 1,390.64
              crore of total revenue, and a 1.89-times solvency ratio at 31 March 2024. Later group-level growth claims
              should be verified against filings before being used as consolidated cover metrics.
