  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and channel segmentation
        blocks:
          - type: paragraph
            body: >-
              Acko serves policyholders across motor, health, travel, life, and related automotive or protection
              services, with the customer journey delivered through its own digital surfaces and partner platforms. The
              available evidence supports a two-sided segmentation: direct digital buyers who transact with Acko and
              users reached inside partner journeys such as Amazon India, Ola, Zomato, and CRED. The payer is generally
              the individual or household buying protection, while the distribution counterparty may be a platform or
              enterprise. This distinction matters because an embedded logo or API relationship can create reach without
              proving that Acko owns the end-customer relationship, renewal, or economics. Public sources do not provide
              a reconciled split by product, geography, buyer, payer, or revenue band, so the segmentation below is
              directional rather than exhaustive.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU008
      - number: '6.2'
        title: Adoption scale and trajectory
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates substantial adoption, but the measures are not interchangeable. Foundlanes reports
              that Acko Life says the general-insurance business has served more than 78 million customers and issued
              more than one billion policies, while StartupTalky reported 28 million customers and 80 million policies
              as of January 2024. The scopes and vintages are not reconciled. The FY2023-24 filing provides a firmer
              operating denominator: 2.949 million policies written, with 38.18% classified as rural and 61.81% as
              urban. Economic Times also reported Rs 81 crore of gross written premium in Q1 FY22 and said new-customer
              growth from non-metro cities was 3.5 times year-on-year, versus 2.5 times in metros. These measures signal
              distribution expansion, but none is a verified active-customer cohort or retention curve. Customer-count,
              policy-count, premium, geographic mix, and growth measures therefore belong in separate rows.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU007
              - CU014
              - CU015
              - CU016
      - number: '6.3'
        title: Named customer and partner proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence names distribution relationships and enterprise reach more readily than it names end
              customers with independently measured outcomes. Creative Collaboration describes Acko as embedded within
              Amazon India and Ola, while the strategy material names Amazon, Ola, Zomato, and CRED as partners.
              Foundlanes says Acko's enterprise platform promotes API-based infrastructure and partnerships with
              hundreds of enterprises, and reports a company claim of more than 500 partners. These sources support a
              real channel and integration footprint, but they do not establish that every named relationship is a
              production insurance deployment, nor do they disclose policy volume, premium, claim outcome, or renewal by
              counterparty. The enumeration is therefore a partial sample of public proof, not a complete customer list.
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Retention, expansion, and customer-risk signals
        blocks:
          - type: paragraph
            body: >-
              Acko's customer proposition depends on reducing friction at purchase and claim, then converting a digital
              or embedded first transaction into repeat protection and broader product use. The available evidence
              supports the convenience proposition: Startupwired describes policy purchase through apps or partner
              platforms and says claims processing takes less time than at traditional insurers. The FY2023-24 filing
              supplies a measured service baseline of 326,303 settled claims with a 13-day average across lines,
              although the line-level range was wide and motor third-party claims averaged 241 days. Neither source
              provides NRR, GRR, churn, renewal, contract duration, satisfaction by cohort, or customer-level expansion.
              The adverse customer signal is channel governance: Economic Times reports an IRDAI fine concerning
              solicitation and payments involving Ola Financial Services when it was not authorised for that role. The
              order did not invalidate policies, but it raises diligence needs around intermediary oversight,
              disclosures, and customer recourse.
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU013
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU011
              - CU013
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution reach is evidenced, not just marketed
            body: >-
              Acko has public evidence of large reported customer and policy totals, direct digital distribution, and
              named embedded-platform relationships; those signals establish reach while leaving cohort quality to
              verify.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Reach does not yet equal durable customer economics
            body: >-
              Public sources do not reconcile active customers, repeat purchase, renewal, churn, or customer-level
              economics, and the Ola-related regulatory action makes channel-control diligence material.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal is a 2025 IRDAI penalty concerning outsourcing and commission practices. The
              reported order says Acko used an arrangement with Ola Financial Services to solicit or aid policy sales
              while the counterparty was not legally authorised for that role, and that payments described as
              advertising, web-branding, and API fees were treated as remuneration or rewards. The same account says the
              regulator required board-level consideration and an Action Taken Report within 90 days. This is a
              control-design and oversight risk, not evidence that issued policies were invalid: legal commentary in the
              source says policies remained enforceable. The FY2023-24 annual report separately discloses a prior
              regulatory penalty as a contingent liability while listing no penalty awarded in that year's table, so the
              publication record is not a complete substitute for the underlying order or remediation evidence.
              Monitoring should focus on the ATR, board minutes, intermediary authorisations, related-party payment
              controls, and repeat findings.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating and financial model risk
        blocks:
          - type: paragraph
            body: >-
              Acko remains exposed to the conversion of scale into underwriting profit. Its FY2023-24 general-insurance
              annual report records total revenue of Rs 1,390.64 crore, a loss after tax of Rs 456.43 crore, gross
              written premium of Rs 1,870 crore, and a solvency ratio of 1.89 times. The same report shows net incurred
              claims and other outgoes of Rs 850.19 crore and operating expenses of Rs 829.35 crore for that year. More
              recent reported group figures point in a better direction—FY25 operating revenue of Rs 28.36bn and a
              consolidated net loss of Rs 4.24bn versus Rs 6.67bn—but the reporting scope is not identical to the
              annual-report entity, and the company is still described as not profitable. The risk is therefore not
              simply loss magnitude; it is whether product mix, claims, expense ratios, and capital remain controlled as
              volume grows. Required tests are entity-level reconciliation, loss-ratio and expense-ratio trends,
              solvency headroom, and cash/capital needs under adverse claims and pricing conditions.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
      - number: '7.3'
        title: Execution, people, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The digital distribution model creates operational leverage and dependency at the same time. Acko's own
              description in the annual report identifies embedded business as its fastest-growing line in FY2023-24,
              while the IPO coverage says platforms such as Amazon India and Ola expose products to large user bases.
              Those relationships can lower distribution friction, but they also make partner governance, API
              availability, data handling, and economics material failure points. A 2026 report says Acko reduced its
              workforce by around 5% amid an AI-led restructuring, with approximately 1,200 employees as of March 2026,
              and calls it the company's second known layoff round. The same report links the change to a proposed IPO
              and reports a senior marketing transition. Workforce changes may improve efficiency, but they can also
              affect controls, claims service, product delivery, and institutional knowledge. The practical mitigation
              is a control-owner map for critical partners and a service-quality dashboard spanning claims, outages,
              complaints, staffing, and regulatory exceptions.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              There are credible but incomplete mitigants. The annual report says Acko began quality checks at garages
              to reduce rework, expanded to more than 4,000 hospitals, and automated windshield-damage claims; it also
              reports investment primarily in government securities and AAA-rated corporate bonds, with AA+ exposure
              below 3%. The report describes board evaluation, independent directors, and malus/clawback provisions for
              misconduct or poor regulatory compliance. These controls reduce identified exposure but do not prove
              effectiveness after the later IRDAI finding or during restructuring. A thesis break would be a repeated or
              materially larger regulatory action, failure to evidence the required remediation, solvency falling toward
              the regulatory minimum, worsening claims and expense ratios, or service deterioration after workforce and
              partner changes. A diligence decision should require the underlying IRDAI order and ATR, entity-reconciled
              management accounts, partner concentration and outsourcing schedules, incident and complaint data, and
              evidence that control testing reaches embedded distribution.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR010
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority risk
            body: >-
              The IRDAI-related outsourcing and commission finding is the most decision-relevant risk because it links
              distribution growth to control design, governance escalation, and unresolved remediation evidence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a repeated material regulatory finding, absent remediation proof, deteriorating solvency or claims
              economics, or service degradation during restructuring as a thesis-break event.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR013
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a digital insurer with a direct and embedded distribution model, broadening products,
              and reported FY25 revenue growth of 35% to Rs 2,837 crore with a 37% reduction in net losses. Several 2026
              publications describe a proposed IPO with a target valuation of $2–2.5 billion, but the range is
              attributed to unnamed sources rather than a filed offer document. The anti-thesis is equally material: the
              business is not yet profitable, the valuation range is not independently derived, and an IRDAI-related
              penalty concerned outsourcing and commission practices. The public evidence does not disclose loss ratios,
              channel CAC, renewal economics, or a reconciled group perimeter, so reported top-line momentum cannot yet
              establish durable underwriting returns.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Acko's last clearly dated financing evidence in this pool is Reuters' account of a $255 million Series D
              in October 2021 at a $1.1 billion valuation. Later 2026 reporting places the proposed IPO at $2–2.5
              billion, with proceeds variously reported as $300–500 million or up to $350 million and a mix of fresh
              shares and secondary sales. Another 2026 article calls the 2021 private valuation $1.4 billion,
              conflicting with Reuters' contemporaneous $1.1 billion figure. These amounts are not interchangeable: the
              raise ranges describe proposed transaction size, the valuation range describes reported equity value, and
              none is a binding offer price. No investor return or hold period can be estimated without dilution,
              preference, share-count, underwriting-profit, and final issue-price disclosures. Entry discipline should
              therefore be based on the filed DRHP and audited entity-level accounts rather than pre-filing media
              estimates.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The base case is continued diligence rather than a priced investment: Acko reaches a public filing with
              continued revenue growth and narrowing losses, but underwriting profitability and governance controls
              remain unverified. The bull case requires the direct model and embedded partnerships to translate into
              sustainable risk selection, lower acquisition cost, and improving loss ratios after listing. The bear case
              is a down-round or delayed IPO if market volatility, regulatory remediation, customer concentration, or
              persistent losses undermine the proposed range. Exit readiness is not established by hiring bankers or
              confidential filing plans. Before underwriting, request audited segment and group accounts, loss and
              combined ratios, retention and CAC by channel, cap-table and preference terms, regulator remediation, and
              the final DRHP. A thesis break is a disclosed deterioration in loss ratios or cash needs, a material
              unresolved regulatory finding, or an issue valuation that implies growth without evidence of underwriting
              economics.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more before pricing
            body: >-
              The reported growth and IPO preparation are credible reasons to continue diligence, but public evidence
              does not yet support a price-sensitive investment decision or a target return at the proposed range.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV016
          - type: callout
            title: Regulatory and disclosure overhang
            body: >-
              A reported IRDAI penalty and missing underwriting disclosures make remediation, audited scope, and channel
              economics gating items for any IPO underwriting decision.
            calloutType: risk
            claimRefs:
              - CV006
              - CV014
              - CV015
