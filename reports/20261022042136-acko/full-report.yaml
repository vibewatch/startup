        title: Exhibits
        blocks:
          - type: callout
            title: Integrated digital insurer model
            body: >-
              Acko controls the insurer, product and customer-journey layers rather than acting only as a comparison
              intermediary.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Partner-led growth is also a control surface
            body: >-
              The IRDAI fine shows that partner authorization, commission design and governance can become a competitive
