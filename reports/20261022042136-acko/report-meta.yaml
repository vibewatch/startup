companyProfile:
  summary: >-
    Acko is a Bengaluru-based digital-first Indian insurer founded in 2016 by Varun Dua and Ruchi Deepak. It combines
    direct digital distribution with embedded partnerships across motor, health, travel, life, and related protection
    products. The evidence shows meaningful operating scale, but the public record does not yet reconcile the regulated
    general-insurance entity with later group-level growth, funding, and IPO reporting.
