  topStrengths:
    - Direct and embedded digital distribution creates a differentiated customer-acquisition and product-delivery model.
    - Acko has disclosed meaningful premium, policy, product, and partner-platform scale.
    - FY24 solvency disclosure and reported FY25 growth provide a credible base for continued diligence.
  topRisks:
    - >-
      Entity-scope differences make group-level revenue, funding, valuation, and IPO claims difficult to reconcile with
      audited general-insurance accounts.
    - >-
      Regulatory-control findings involving outsourcing and commission practices create governance and
      partner-authorization risk.
    - >-
      Persistent losses and undisclosed channel, renewal, loss-ratio, and product-level economics prevent a defensible
      valuation.
    - >-
      Public evidence does not establish the effectiveness of remediation or the durability of recent operating
      improvement.
  unresolvedGaps:
    - Public sources do not reconcile ACKO General, ACKO Life, and wider group financial scope cleanly.
    - Line-level loss ratios, channel CAC, partner concentration, and renewal economics remain undisclosed.
    - Claims-quality distributions, grievance rates by product, and retention by cohort are not publicly available.
    - Board-level remediation evidence tied to the reported IRDAI findings is not public in sufficient detail.
