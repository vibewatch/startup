evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary cap table and financing ledger reconciling the reported more-than-$450 million and more-than-$583
      million totals, round dates, and entity scope.
    whyItMatters: >-
      Funding and valuation figures affect ownership, dilution, IPO proceeds, and the credibility of public-market
      claims.
    diligencePath: >-
      Obtain the latest audited holding-company statements, cap table, subscription agreements, and investor
      confirmations.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: A current group-wide board and executive roster, including mandates after the 2024 operating-company transition.
    whyItMatters: >-
      The available filing is historical and entity-specific, so current key-person dependence and governance coverage
      cannot be established.
    diligencePath: >-
      Request current board minutes, committee charters, executive biographies, succession plans, and IRDAI-approved
      appointments.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: financials
    missingEvidence: >-
      Audited consolidated statements that reconcile Acko General Insurance figures with Acko Technology & Services,
      Acko Life, and any wider group reporting.
    whyItMatters: >-
      Group-level revenue, loss, customer, and valuation claims are not directly comparable with the FY2024
      general-insurance filing.
    diligencePath: >-
      Obtain entity charts, audited consolidated accounts, segment notes, intercompany eliminations, and the latest
      regulatory returns.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: The full IRDAI order, Acko's response, and evidence of remediation after the reported Rs 1 crore fine.
    whyItMatters: The reported distribution-control lapse may affect governance, partner oversight, and regulatory execution risk.
    diligencePath: >-
      Review the complete order, compliance action plan, subsequent audit findings, and current intermediary
      permissions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: scale
    missingEvidence: Current audited customer count, headcount, renewal, loss-ratio, channel economics, and partner-concentration data.
    whyItMatters: These metrics determine whether reported growth translates into durable underwriting and distribution economics.
    diligencePath: >-
      Request current operating dashboards, actuarial reports, cohort retention, claims triangles, and partner-level
      contribution schedules.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: >-
      A reconciled product- and geography-specific Indian premium pool with a transparent methodology and Acko SAM/SOM
      bridge.
    whyItMatters: Without a denominator, the broad TAM cannot support market-share, growth, or valuation conclusions.
    diligencePath: >-
      Request management's market model, product-level gross written premium pools, target geographies, channel mix, and
      explicit SAM/SOM assumptions.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Channel-level CAC, conversion, renewal, loss ratio, and partner concentration data for direct and embedded
      distribution.
    whyItMatters: Distribution reach may not translate into durable contribution margin or underwriting profitability.
    diligencePath: >-
      Obtain cohort and channel dashboards covering quote-to-bind, renewal, claims, CAC, contribution margin, and
      partner concentration.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: company-scale
    missingEvidence: A reconciled definition of Acko General, Acko Life, and group-level revenue and customer metrics.
    whyItMatters: Mixed entity scope can overstate the addressable business and make market penetration comparisons misleading.
    diligencePath: Reconcile audited subsidiary and holding-company disclosures by period, product, and reporting perimeter.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable current quotes, realized premiums, discounts and coverage terms for Acko, Digit and incumbent policies.
    whyItMatters: >-
      Without normalized price and coverage evidence, the report cannot determine whether digital distribution creates a
      buyer-visible price advantage.
    diligencePath: >-
      Obtain matched quotes for the same customer risk, geography, deductible and coverage from Acko, Digit and at least
      two incumbent insurers.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: Competitor-comparable renewal, claims, loss-ratio, CAC and switching data by channel.
    whyItMatters: >-
      Product breadth and reported renewal mix are not enough to establish a durable advantage over digitizing
      incumbents or multi-homing platforms.
    diligencePath: >-
      Request cohort-level retention, claims severity, acquisition cost and contribution-margin data split by direct,
      embedded and partner channels.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: Public remediation detail and current partner-control testing after the IRDAI fine.
    whyItMatters: >-
      The historical enforcement action could affect trust and distribution economics if control improvements are not
      demonstrable.
    diligencePath: Obtain the regulator correspondence, remediation plan, partner-register controls and independent testing results.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
