    title: Recommendation logic
    type: flow
    summary: Improving reported scale supports interest, while incomplete economics and regulatory uncertainty constrain the decision.
    data:
      nodes:
        - id: scale
          label: Reported scale
          detail: FY25 revenue Rs 2,837 crore; 35% growth reported
        - id: loss-trend
          label: Loss direction
          detail: Net losses reported down 37%, but not eliminated
        - id: distribution
          label: Digital distribution
          detail: Direct and embedded channels are described by reporting
        - id: price
          label: Proposed price
          detail: $2–2.5bn IPO valuation reported by sources
        - id: gaps
          label: Unresolved economics
          detail: Loss ratios, CAC, retention, dilution, and entity scope are not public here
        - id: decision
          label: Research more
          detail: Reassess after DRHP and audited underwriting evidence
      edges:
        - [scale, loss-trend]
        - [loss-trend, distribution]
        - [distribution, price]
        - [price, gaps]
        - [gaps, decision]
    claimRefs: [CV001, CV002, CV003, CV006, CV012, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Research more before pricing
    body: >-
      The reported growth and IPO preparation are credible reasons to continue diligence, but
      public evidence does not yet support a price-sensitive investment decision or a target
      return at the proposed range.
    claimRefs: [CV001, CV003, CV004, CV006, CV016]
  - calloutType: risk
    title: Regulatory and disclosure overhang
    body: >-
      A reported IRDAI penalty and missing underwriting disclosures make remediation, audited
      scope, and channel economics gating items for any IPO underwriting decision.
    claimRefs: [CV006, CV014, CV015]
