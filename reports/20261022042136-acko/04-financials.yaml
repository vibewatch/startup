        - [premium-pool, underwriting]
        - [underwriting, claims-costs]
        - [premium-pool, supplementary-income]
        - [claims-costs, financial-outcome]
        - [supplementary-income, financial-outcome]
        - [operating-costs, financial-outcome]
    approximationNotes: "The flow is a conceptual evidence-backed model; public sources do not quantify every edge or establish product-level contribution margins."
    claimRefs: [CI005, CI009, CI012]
