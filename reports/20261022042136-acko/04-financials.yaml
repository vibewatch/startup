  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Current consolidated unrestricted cash, monthly operating cash flow, burn, runway, debt, and next-round trigger.
      whyItMatters: Statutory solvency does not establish group-level liquidity or financing dependency.
      diligencePath: Request audited cash-flow statements, a 24-month liquidity model, debt schedule, and board-approved capital plan.
      relatedQuestionRefs: [QI007, QI009]
    - type: conflicting-data
      severity: material
      topic: revenue-scope
      missingEvidence: A reconciled bridge between Acko General statutory revenue, FY25 media-reported revenue, Acko Life, and wider group entities.
      whyItMatters: Mixing legal-entity and group metrics can materially distort growth, valuation, and margin conclusions.
      diligencePath: Obtain consolidated audited accounts and a legal-entity-to-group revenue and premium reconciliation.
      relatedQuestionRefs: [QI002, QI003, QI009]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Product and channel CAC, partner fees, loss ratios, renewal rates, claims severity, and contribution margin.
      whyItMatters: Revenue growth and a broad expense ratio cannot establish sustainable underwriting profitability.
      diligencePath: Request cohort-level economics by motor, health, embedded, travel, and other product lines for FY25 and FY26.
      relatedQuestionRefs: [QI004, QI005, QI006, QI009]
      relatedTableRefs: [TI002, TI003]
    - type: missing-source
      severity: material
      topic: regulatory-remediation
      missingEvidence: Current board-level remediation and control-testing evidence after the IRDAI enforcement matter.
      whyItMatters: Distribution-control failures can create fines, customer harm, and repeat compliance costs.
      diligencePath: Obtain the remediation plan, independent testing, partner-register controls, and management response to IRDAI.
      relatedQuestionRefs: [QI008]
