artifact: financials
slug: acko
runDate: 2026-10-22
company:
  name: Acko
chapter:
  number: 4
  title: Financials
  summary: Acko's reported FY2023-24 statutory accounts show strong premium scale but continuing losses, while FY25 media reporting describes faster revenue growth and materially narrower losses. The underwriting model benefits from direct and embedded distribution, yet public evidence remains insufficient to underwrite realized pricing, channel economics, cash runway, or product-level profitability.
sections:
  - id: revenue-model
    title: Revenue model and reported traction
    body: >-
      Acko is a licensed general insurer, so the core economic engine is underwriting premiums rather than
      broker commissions. The FY2023-24 annual report records gross written premium of Rs 1,870 crore and
      identifies embedded business and motor as growth contributors, with embedded business up 48% and motor
      up 26%, while group health declined 18%. The same report shows total revenue of Rs 1,390.64 crore
      and a loss after tax of Rs 456.43 crore for the year ended 31 March 2024. Later reporting describes
      FY25 revenue of Rs 2,837 crore, up 35%, and a 37% year-on-year reduction in net losses, but those
      figures are media-reported rather than reconciled here to the statutory accounts. This supports a
      growth-and-loss-narrowing direction, not a conclusion that Acko has reached profitability or that
      group and general-insurance scopes are identical.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-efficiency
    title: Monetization, distribution, and cost drivers
    body: >-
      Public descriptions identify direct policy premiums across motor, health, travel, life, and embedded
      products as the principal monetization path. The direct model is presented as avoiding traditional
      agent commissions, while partner checkout integrations can place small products inside existing
      transactions. That can reduce acquisition friction, but it does not by itself prove lower realized
      CAC, better loss ratios, or positive contribution margin. Acko's own FY2023-24 report gives an
      expenses-of-management ratio of 55% of gross written premium, a useful company-level efficiency
      indicator but not a product-level CAC or payback measure. Its cost base still includes claims,
      technology, personnel, compliance, distribution arrangements, and investment operations. Public
      sources do not disclose a consistent list-versus-realized premium bridge, partner take rates, renewal
      retention, channel CAC, or contribution margin by product.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting blockers
    body: >-
      The statutory report provides a more usable capital signal than startup funding summaries: Acko
      General reported a 1.89-times solvency ratio at 31 March 2024, against a stated minimum capital
      requirement of Rs 332 crore and total available capital for solvency purposes of Rs 625 crore. It
      also says the insurer uses reinsurance to keep risk exposure commensurate with capacity and focuses
      investments on government securities and rated debt instruments. The filing reports Rs 18.25 crore
      of cash and bank balances and no borrowings at 31 March 2024, but those historical insurer-level
      figures do not establish current consolidated liquidity or runway. An audit disclosure says some
      premium, claims, expense, investment, reinsurance, and
      commission computations were maintained in spreadsheets and manually posted to Oracle, creating a
      reporting-control diligence item. The 2025 IRDAI enforcement report adds a material governance and
      distribution risk around payments to Ola Financial Services during the period when it was not a
      registered corporate agent. Current consolidated cash, burn, runway, debt obligations, and
      next-round triggers remain unavailable in the assigned public evidence.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      The evidence supports a financially interesting but not yet fully underwritable profile. Acko has
      demonstrated substantial gross written premium, a broadening product set, and reported FY25 top-line
      growth alongside loss reduction. Its direct and embedded distribution may create structural efficiency
      advantages, and the Google Cloud case study documents a reporting turnaround improvement of three to
      four times and a five-times improvement in some poorly running jobs. However, those technology
      outcomes are operational proxies, not proof of insurance profitability. The key underwriting gap is
      reconciliation: statutory general-insurance revenue, group-level media metrics, premium mix, claims
      costs, capital consumption, and cash needs are not presented on one comparable basis. The prudent
      stance is to credit growth and distribution reach while requiring audited segment economics, current
      solvency, cash and capital plans, and remediation evidence before valuing the business as a
      sustainably profitable insurer.
    claimRefs: [CI003, CI004, CI007, CI009, CI015]
    tableRefs: [TI003]
callouts:
  - calloutType: strength
    title: Growth with a measurable statutory capital buffer
    body: The FY2023-24 annual report combines Rs 1,870 crore of gross written premium with a 1.89-times solvency ratio, giving the business a real insurance balance-sheet signal even though profitability remained negative.
    claimRefs: [CI001, CI009]
  - calloutType: risk
    title: Revenue growth is not yet underwriting proof
    body: FY25 media-reported revenue growth and loss reduction are encouraging, but public evidence does not reconcile them to product-level loss ratios, cash burn, partner economics, or current capital adequacy.
    claimRefs: [CI004, CI012, CI015]
  - calloutType: recommendation
    title: Require a current unit-economics and capital pack
    body: Before underwriting valuation, request audited FY25/FY26 financials, product and channel contribution margins, renewal cohorts, cash runway, reinsurance structure, and remediation of the spreadsheet and intermediary-control issues.
    claimRefs: [CI012, CI013, CI015]
