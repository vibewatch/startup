      - ["Embedded insurance", "Partner checkout and contextual products", "Embedded business grew 48% in FY2023-24", "Statutory company report", "Reconcile partner volume, take rate, claims, and renewal economics"]
      - ["Gross written premium", "Premium written by the insurer", "Rs 1,870 crore in FY2023-24", "Statutory company report", "Obtain current GWP, earned premium, and retention by product"]
      - ["Total revenue", "Reported company revenue", "Rs 1,390.64 crore in FY2023-24; FY25 media report says Rs 2,837 crore", "Mixed scope and periods", "Reconcile ACKO General, ACKO Life, and group reporting scope"]
      - ["Investment income and recoveries", "Conventional insurer income streams", "Public descriptions identify these as possible supplementary sources; amount not isolated", "Secondary source", "Obtain audited revenue-account bridge and investment income detail"]
    notes: "FY2023-24 statutory figures are from Acko General's annual report; FY25 revenue is media-reported and may not be scope-comparable; null or qualitative entries mean the assigned evidence did not provide a reconciled amount."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization table
    columns: [Price or contract model, Included mechanism, Realized pricing status, Financial implication, Unknown or diligence ask]
    rows:
      - ["Policy premium", "Direct sale of insurance coverage", "Realized premium by product not disclosed", "Captures underwriting economics but also claims risk", "Request quote-to-bind conversion, discounts, and earned-premium data"]
      - ["Embedded micro-insurance", "Contextual cover in Amazon, Ola, travel, and other flows", "A Rs 1 Ola example is described by a secondary source; not independently validated here", "Low-friction distribution may lower acquisition cost", "Verify partner settlement, fees, loss ratio, and volume"]
      - ["AirPass subscription", "Annual plan with disruption benefits", "Rs 1,500 delay payout and up to Rs 3,000 rebooking discount reported for the launch", "Subscription economics and frequency risk are unknown", "Request subscriber count, claims frequency, pricing, and renewal"]
      - ["ACKO Clinic membership", "Year-round healthcare access", "Members-only launch described; price not provided", "Service cost and cross-subsidy into insurance are unknown", "Obtain membership price, utilization, provider cost, and accounting treatment"]
    notes: "Public descriptions establish mechanisms and selected list benefits, not realized revenue, margin, or contract economics; launch benefits and the Rs 1 example require management verification."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Expenses of management / GWP, "55% in FY2023-24", high, "Shows a broad operating-cost burden relative to written premium", "Split acquisition, servicing, technology, and corporate costs"]
      - [Solvency ratio, "1.89x at 31 March 2024", high, "Core insurance capital buffer against regulatory minimums", "Obtain current ratio, eligible capital, and stress tests"]
      - [Minimum capital requirement, "Rs 332 crore at 31 March 2024", high, "Provides the denominator context for the solvency signal", "Confirm current requirement and capital plan"]
      - [Available capital for solvency, "Rs 625 crore at 31 March 2024", high, "Indicates statutory capital available for solvency purposes", "Reconcile with restricted assets, reinsurance, and group support"]
      - [Cash and bank balances, "Rs 18.25 crore at 31 March 2024; no borrowings", high, "Historical insurer liquidity is not current consolidated runway", "Obtain current unrestricted cash, statutory restrictions, debt, and monthly burn"]
      - [Cash burn and runway, null, low, "Determines financing dependency outside statutory solvency", "Request monthly cash flow, unrestricted cash, burn, debt, and next-round trigger"]
    notes: "The annual report provides FY2023-24 statutory cash-flow and capital metrics, but no current consolidated runway or product-level contribution-margin pack was retained; null means unavailable for the stated current period."
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
