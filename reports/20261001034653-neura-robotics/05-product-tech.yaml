  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Conventional Workflow
      - NEURA Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Semiconductor Cleanroom Material Transport
        - Manual cart movement or rigid fixed-track automated guided vehicles (AGVs)
        - Cognitive mobile platforms equipped with distributed edge compute and dynamic obstacle avoidance
        - Elimination of physical facility modifications and real-time adaptation to changing floor layouts
        - Rigorous cleanroom particle generation certification and wireless latency constraints
      - - Collaborative Industrial Workpiece Assembly
        - Caged industrial robotic arms requiring dedicated optical safety fences and physical barriers
        - Cobots with joint-level torque sensing, voice command, and reactive collision avoidance
        - Direct side-by-side human-robot collaboration without physical fencing, reducing cell footprint
        - Payload and speed limitations imposed by collaborative safety standards (ISO/TS 15066)
      - - Hospital Internal Bed & Asset Logistics
        - Orderlies and healthcare staff manually pushing heavy hospital beds and transport equipment
        - Dedicated healthcare autonomous transport units navigating crowded clinical corridors
        - Reallocation of clinical nursing hours toward patient care rather than logistical transport
        - Strict healthcare hygiene compliance, elevator integration, and emergency override reliability
      - - Multi-Robot Fleet Dispatching & Integration
        - Siloed vendor-specific programmable logic controllers (PLCs) with proprietary fieldbuses
        - Unified interface architecture supporting OPC UA, MQTT, ROS 2, REST, and gRPC integration
        - Cross-fleet interoperability and rapid reconfiguration across heterogeneous automation lines
        - High software complexity in managing real-time QoS across mixed wired/wireless network topologies
    notes: >-
      Workflow mappings reflect official architectural objectives, target application domains, and standard
      collaborative robotics constraints; verified operational efficiency gains depend on facility-specific deployment
      parameters.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE009
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer
      - Primary Role
      - Key Technical Dependency
      - Primary Operational Risk
    rows:
      - - Distributed Edge Compute (Smart Limbs)
        - Execute real-time motor control loops and sensory reflex processing directly within robotic joints
        - Qualcomm Dragonwing robotics processors packaged into SECO-manufactured electronic modules
        - Thermal dissipation in enclosed joint housings and single-source silicon supply chain dependency
      - - Core Robotics Middleware Stack
        - Provide deterministic, sub-millisecond publish-subscribe data exchange between robot subsystems
        - Data Distribution Service (FastDDS / CycloneDDS) and ROS/ROS2 communication frameworks
        - Network jitter and message serialization overhead under high-bandwidth multi-camera sensor streaming
      - - Unified Platform Interface & Dispatcher
        - Expose standardized APIs to external systems and dynamically map configs to robot hardware revisions
        - Multi-protocol API gateway supporting REST, gRPC, OPC UA, MQTT, and ZeroMQ SDK bindings
        - API version drift, backward compatibility maintenance across hardware generations, and authentication latency
      - - Systems Engineering & Safety Architecture
        - Ensure end-to-end requirement traceability, functional safety compliance, and cyber risk mitigation
        - Machinery Directive standards, VDI guidelines, and automated Docs-as-Code CI/CD pipelines
        - Evolving humanoid safety standards requiring potential hardware recertification as regulations advance
    notes: >-
      Operating architecture components compiled from verified systems engineering roles, DDS developer specifications,
      and industrial partnership disclosures; fault recovery latency in production environments is unverified.
    claimRefs:
      - CE003
      - CE004
      - CE008
      - CE011
