callouts:
  - calloutType: "risk"
    title: "Financing Dependency and Milestone Disbursement Risk"
    body: "The headline $1.4B Series C facility announced in June 2026 is widely summarized in financial media as committed capital, yet Bloomberg reporting confirms that full disbursement remains strictly conditional upon Neura achieving undisclosed commercial and technical milestones. With no verified production deployments on record as of August 2026 and an extensive workforce exceeding 1,200 to 1,500 personnel operating in high-cost German facilities, failure to hit interim milestone gates could trigger severe liquidity compression before serial production is established."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI013"
      - "CI015"
  - calloutType: "insight"
    title: "Capital Structure Alignment with Industrial Supply Chain"
    body: "Unlike Silicon Valley robotics startups whose cap tables are dominated by venture capital firms, Neura Robotics has systematically anchored its shareholder registry with global manufacturing suppliers and industrial partners, including Bosch (actuators and automotive sensors), Schaeffler (precision bearings and joint mechanisms), and Qualcomm (edge processors). While this structure aligns the company with essential component supply chains, the strategic participation of Tether introduces non-traditional governance dynamics that require institutional investor scrutiny."
    claimRefs:
      - "CI010"
      - "CI012"
      - "CI016"
