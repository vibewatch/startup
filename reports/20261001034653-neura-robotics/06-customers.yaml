    title: "Evidence-weighted customer adoption journey"
    type: "journey-map"
    summary: "Public evidence supports discovery, training, and relationship signals, while production, retention, and expansion remain unverified."
    data:
      items:
        - label: "1. Discovery"
          summary: "Portfolio positioning for industrial buyers, developers, integrators, and OEMs."
          touchpoints:
            - "Company website"
            - "Trade-show demonstrations"
          note: "Targeting evidence, not customer adoption evidence"
        - label: "2. Evaluation"
          summary: "Live product demonstrations and selected partner-developed applications."
          touchpoints:
            - "Automate 2026"
            - "Partner application demonstrations"
          note: "No public conversion count or paid-pilot denominator"
        - label: "3. Training and validation"
          summary: "NEURA Gyms and NEURA Academy are intended to prepare partner-specific use cases."
          touchpoints:
            - "NEURA Gym"
            - "LARA and MAiRA training"
          note: "Company-described enablement mechanism"
        - label: "4. Commercial commitment"
          summary: "Order-book, pipeline, framework, pilot, option, or offtake signals may enter this stage."
          touchpoints:
            - "Reported pipeline"
            - "Reported Schaeffler offtake"
          note: "Instrument mix and binding status are not disclosed"
        - label: "5. Production deployment"
          summary: "Paid units operating at named customer sites with disclosed reliability and utilization."
          touchpoints:
            - "Shipped units"
            - "Robot-hours and uptime"
          note: "Not verified by the assigned evidence"
        - label: "6. Retention and expansion"
          summary: "Renewal, repeat orders, fleet expansion, and software or service attachment."
          touchpoints:
            - "Renewal and repeat purchase"
            - "Cross-site fleet growth"
          note: "No NRR, GRR, churn, cohort, or concentration metrics disclosed"
    approximationNotes: "Conceptual evidence-status journey only; it does not assert that one comparable customer cohort progressed through every stage or imply a conversion rate."
    claimRefs:
