callouts:
  - calloutType: "risk"
    title: "Pipeline is not retained revenue"
    body: "The public headline combines an order book with a strategic deployment pipeline, while the assigned evidence does not disclose binding status, revenue recognition, retention, or customer-level concentration. Investment diligence should reconcile every material commitment to contract terms, delivery acceptance, paid invoices, and repeat orders before treating the figure as durable adoption."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU014"
      - "CU016"
