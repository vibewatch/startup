company:
  name: "Neura Robotics"
chapter:
  number: 6
  title: "Customers"
  summary: "NEURA Robotics publishes a broad industrial customer proposition and says its order book plus strategic deployment pipeline exceed $1 billion, but that combined figure does not disclose contract quality or revenue conversion. The strongest named demand signal in the assigned evidence is a secondhand report of Schaeffler's long-dated offtake plan; public proof of production deployments, retention, and customer concentration remains insufficient."
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer Segments and Buying Centers"
    body: "NEURA addresses several customer surfaces rather than one homogeneous buyer. Company materials frame the portfolio for industry, work, and everyday-life applications, while a syndicated company release separately identifies industrial customers, system integrators, developers, and OEMs. Tracxn characterizes the practical industrial jobs as assembly, material handling, quality inspection, welding, gluing, and machine tending; Venture Capital Tracker adds service and care, logistics, and unstructured-environment use cases. The public evidence therefore supports segment breadth, but not segment-level customer counts, payer mix, deployed fleet size, or revenue contribution. Investors should treat the buyer map as positioning until contracts and installed-base data distinguish active users from ecosystem participants."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-signals-and-conversion"
    title: "Adoption Signals and Conversion Quality"
    body: "The headline adoption metric is company-issued: NEURA says its existing order book and strategic deployment pipeline exceed $1 billion. The wording combines two categories and does not disclose the amount represented by binding orders, framework agreements, pilots, options, or other commitments. New Market Pitch explicitly cautions that an order book in robotics can contain those different instruments and is not equivalent to revenue. Automate 2026 live demonstrations and partner-developed applications show commercial outreach and product availability for evaluation, but not paid production use. Max Robotics also reports that revenue is undisclosed and that the composition of the order book cannot be determined from public material."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-deployment-status"
    title: "Named Proof and Deployment Status"
    body: "Named evidence is materially weaker than the aggregate pipeline claim. New Market Pitch reports that Schaeffler has an offtake agreement and plans thousands of NEURA robots across its production network by 2035, with German reporting placing the related order near EUR 300 million. The same source links earlier demand to Kawasaki Heavy Industries and Omron, but does not provide paid-unit, site, uptime, or repeat-order data for those relationships. Max Robotics' June 2026 dossier says no named customer had publicly confirmed a deployment in its reviewed record. These sources support the existence of relationship signals, not a conclusion that any named account is already running a scaled production fleet."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "enablement-durability-and-expansion"
    title: "Enablement, Durability, and Expansion"
    body: "NEURA describes an enablement path that moves from demonstrations to training and validation: NEURA Gyms are intended to let partners train and validate use cases before full industrial deployment, and NEURA Academy says it trains customers and integrators on LARA and MAiRA. Those mechanisms could reduce integration friction, while planned US Gym locations could widen geographic reach. However, no assigned source supplies NRR, GRR, churn, renewals, contract length, satisfaction, support burden, customer-level revenue concentration, or repeat-purchase cohorts. New Market Pitch identifies shipped units, robot-hours, uptime, repeat orders, and deployment sites as the operating proof still needed. The journey exhibit is therefore an evidence-status map, not a demonstrated conversion funnel."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
