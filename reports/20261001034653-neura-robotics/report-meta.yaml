companyProfile:
  summary: >-
    NEURA Robotics is a Metzingen-based Physical AI company founded by David Reger in 2019. It builds a broad robotics
    stack spanning cognitive robots, collaborative platforms, humanoids, autonomous mobile robots, and service
    assistants, with Neuraverse positioned as the shared software and learning layer. Public evidence now includes a
    June 2026 Series C announcement of up to $1.4 billion and a reported valuation near $7 billion, but the financing is
    milestone-dependent, revenue and profitability remain undisclosed, and public workforce counts and funding totals
    conflict across sources.
