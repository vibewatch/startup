evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A current executive roster, supervisory-board composition, founder ownership, investor board rights, and
      succession plan.
    whyItMatters: >-
      Leadership depth, control, oversight, and key-person exposure cannot be assessed from founder-centered public
      materials.
    diligencePath: >-
      Request the organization chart, executive biographies, cap table, shareholder agreement, board minutes, and
      reserved-matters schedule.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financing-conditions
    missingEvidence: >-
      Series C funded-at-close proceeds, remaining tranche amounts, performance triggers, instrument types, and closing
      timetable.
    whyItMatters: >-
      The up-to round size cannot be converted into cash availability, runway, dilution, or debt capacity without the
      financing documents.
    diligencePath: >-
      Review the signed term sheet, subscription documents, cap table, bank receipts, covenants, and milestone
      certification process.
    relatedQuestionRefs:
      - QO003
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Audited revenue, profitability, cash burn, customer count, firm backlog, cancellation terms, unit shipments, and
      cash collections.
    whyItMatters: >-
      The company-issued orderbook and pipeline cannot establish realized demand, recurring economics, margins, or
      runway.
    diligencePath: >-
      Request audited financial statements, customer-level backlog aging, purchase orders, invoices, collections,
      cancellations, and cohort revenue.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Authoritative litigation, regulatory, safety, recall, outage, and material-incident checks beyond the empty
      assigned adverse result set.
    whyItMatters: >-
      An absence of retained adverse search results cannot establish an absence of legal, regulatory, safety, or
      operating incidents.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, product-safety, insurance-claim, and customer-reference checks in a
      later authorized evidence pass.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: company-specific-market-size
    missingEvidence: A bottom-up SAM and SOM by product, geography, buyer budget, price, and realistic annual deployment volume.
    whyItMatters: >-
      Without a company-specific denominator, broad robotics forecasts cannot support an attainable revenue or valuation
      case.
    diligencePath: >-
      Obtain management's market model and reconcile it to product pricing, qualified pipeline, site counts, production
      capacity, and independently sourced buyer budgets.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: deployment-economics
    missingEvidence: >-
      Named production deployments with paid units, uptime, intervention rates, measured labor savings, support cost,
      gross margin, and repeat orders.
    whyItMatters: >-
      These metrics determine whether demand converts into scalable platform economics or remains integration-heavy
      hardware revenue.
    diligencePath: >-
      Review customer contracts, invoices, deployment logs, service tickets, cohort-level renewal or reorder data, and
      reference calls under NDA.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: pricing-and-software-monetization
    missingEvidence: >-
      Audited list pricing, volume discount schedules, and recurring Neuraverse skill licensing fees across Neura
      Robotics' hardware lines.
    whyItMatters: >-
      Without disclosed unit pricing and software margin structure, customer total cost of ownership and margin
      durability against low-cost entrants cannot be independently underwritten.
    diligencePath: >-
      Request customer procurement contracts, master services agreements with Schaeffler, and Neuraverse app store
      developer monetization schedules.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-run-rate
    missingEvidence: Audited financial statements showing annual recognized revenue, ARR breakdown, and customer gross margins.
    whyItMatters: >-
      Without recognized revenue figures, institutional investors cannot evaluate burn sustainability, gross margin
      viability, or true revenue quality.
    diligencePath: >-
      Obtain audited historical income statements and GAAP/IFRS revenue bridge directly from company management under
      NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: order-backlog-definition
    missingEvidence: >-
      Contractual breakdown of the €1B pipeline separating legally binding purchase orders from non-binding letters of
      intent and deployment expressions of interest.
    whyItMatters: >-
      Headline order books that primarily consist of conditional MOUs or non-binding customer pilots overstate forward
      revenue visibility.
    diligencePath: >-
      Request an audited backlog schedule detailing counterparty names, unit quantities, delivery milestones, and
      cancellation clauses.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: series-c-milestone-terms
    missingEvidence: >-
      Specific performance benchmarks, tranche schedule, and milestone definitions governing the disbursement of the
      $1.4B Series C facility.
    whyItMatters: >-
      If initial disbursements are modest and subsequent tranches depend on aggressive technical hurdles, cash runway
      may be substantially shorter than headline financing implies.
    diligencePath: Review the Series C investment agreement, milestone schedule, and capital call notice terms with lead investors.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: hardware-reliability-and-mtbf
    missingEvidence: >-
      Third-party audited field reliability, MTBF data, and long-term joint torque sensor calibration records for 4NE1
      and MAiRA fleets.
    whyItMatters: >-
      Without independent reliability data, long-term maintenance costs and operational availability under continuous
      industrial duty cycles cannot be verified.
    diligencePath: >-
      Request customer pilot telemetry logs, warranty failure statistics, and internal accelerated life testing (ALT)
      test reports from NEURA engineering.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: compute-module-yield-and-costs
    missingEvidence: >-
      Bill of materials (BOM) cost breakdown and manufacturing yield rates for SECO-manufactured Dragonwing compute
      modules.
    whyItMatters: >-
      Compute module production yields and supply chain commitments directly impact gross margins and series production
      delivery timelines.
    diligencePath: >-
      Review the master supply agreement and production volume pricing tiers established between NEURA, SECO, and
      Qualcomm.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-durability
    missingEvidence: >-
      Customer cohorts with NRR, GRR, churn, renewals, contract length, satisfaction, support burden, and repeat-order
      outcomes.
    whyItMatters: >-
      Pipeline and first-order signals do not show whether deployed systems remain in service, renew, or expand
      economically.
    diligencePath: >-
      Review anonymized customer cohorts, renewal schedules, service tickets, warranty claims, and repeat-purchase
      invoices under NDA.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer-level revenue and backlog shares, including the largest customer and aggregate exposure to strategic
      investors or partners.
    whyItMatters: >-
      A concentrated pipeline may be vulnerable to one counterparty delaying acceptance, reducing scope, or cancelling a
      framework commitment.
    diligencePath: >-
      Reconcile the top 20 customers to signed contracts, backlog, recognized revenue, payment history, cancellation
      rights, and deployment milestones.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: named-production-deployments
    missingEvidence: >-
      A complete customer list with direct customer confirmation, product, site, paid-unit count, deployment status,
      operating outcome, and renewal state.
    whyItMatters: Partner announcements and secondary customer links cannot establish production adoption or diversification.
    diligencePath: >-
      Obtain customer references and verify contracts and operating metrics directly with plant or automation leaders at
      named sites.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-safety
    missingEvidence: >-
      Product-specific certifications, conformity files, regulator records, court records, privacy assessments, and
      deployment approvals.
    whyItMatters: >-
      Human-adjacent and hospital deployment could be delayed or impaired by unverified safety, privacy, or legal
      posture.
    diligencePath: >-
      Obtain primary regulator and certification records plus counsel review for each product and deployment
      jurisdiction.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incidents-reliability
    missingEvidence: Complete incident, recall, outage, vulnerability, warranty, near-miss, uptime, and field-failure history.
    whyItMatters: Absence of an allocated incident source cannot establish that no incident occurred or quantify reliability.
    diligencePath: >-
      Review insurer loss runs, customer incident logs, service tickets, recall databases, post-market records, and
      independent tests.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financing-runway
    missingEvidence: >-
      Funded cash, binding commitments, tranche conditions, burn, runway, gross margin, working capital, and downside
      liquidity plan.
    whyItMatters: Funding raised or announced is not the same as cash available for operating and manufacturing commitments.
    diligencePath: >-
      Reconcile bank statements, signed financing documents, board cash forecasts, covenants, and monthly operating
      plans.
    relatedQuestionRefs:
      - QR005
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A dated legal-entity and site bridge reconciling payroll employees, acquired personnel, contractors, and
      platform-profile counts.
    whyItMatters: Workforce scale drives payroll, integration capacity, productivity, and runway assumptions.
    diligencePath: Reconcile HRIS and payroll exports to the consolidated legal-entity chart and monthly management reporting.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Counterparty concentration, supplier alternatives, service levels, pricing, customer ownership, termination
      rights, and substitution costs.
    whyItMatters: Public partnership announcements do not establish durable access, favorable economics, or operational continuity.
    diligencePath: >-
      Review material partner contracts, spend and revenue concentration schedules, architecture portability tests, and
      contingency plans.
    relatedQuestionRefs:
      - QR004
      - QR009
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Signed financing documents establishing post-money valuation, fully diluted capitalization, funded-at-close
      proceeds, remaining commitments, tranche milestones, liquidation preferences, anti-dilution terms, and governance
      rights.
    whyItMatters: >-
      The reported valuation is anonymous and the maximum financing is contingent, so entry price, dilution, available
      liquidity, and downside protection cannot be underwritten.
    diligencePath: >-
      Review the executed share-purchase, shareholder, and side-letter documents and reconcile them to bank statements
      and the fully diluted cap table.
    relatedQuestionRefs:
      - QV002
      - QV006
  - type: missing-source
    severity: material
    topic: valuation-inputs
    missingEvidence: >-
      Audited revenue, product-level gross margin, customer deployments, backlog definitions, burn, runway, retention,
      and working-capital requirements.
    whyItMatters: >-
      These inputs are necessary to select a stage-appropriate valuation method, calculate a supportable range, and
      distinguish booked demand from profitable commercialization.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, customer and deployment cohorts, backlog
      contracts, bill-of-materials data, and a board-approved operating plan.
    relatedQuestionRefs:
      - QV005
  - type: conflicting-data
    severity: material
    topic: funding-scope
    missingEvidence: >-
      A reconciled schedule explaining why public providers report $86 million of disclosed equity funding, $1.68
      billion of total funding, and an up-to-$1.4-billion latest round.
    whyItMatters: >-
      The figures use different scopes and cannot be treated interchangeably as funding raised, cash funded, or cash
      available.
    diligencePath: >-
      Reconcile every financing round by date, security, committed amount, funded amount, and provider definition
      against company records.
    relatedQuestionRefs:
      - QV009
