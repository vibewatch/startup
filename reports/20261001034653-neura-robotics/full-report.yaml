          to: milestone-gate
        - from: milestone-gate
          to: operating-proof
        - from: operating-proof
          to: terms-proof
        - from: terms-proof
          to: decision
    approximationNotes: The flow is qualitative and does not imply a numerical conversion rate, probability, or valuation range.
