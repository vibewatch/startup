          NEURA describes a broad cognitive-robotics portfolio, while its jobs site signals continuing investment across
          technical and central functions.
        - Show repeatable paid deployments, product-level margins, and hiring productivity.
      - - Anti-thesis
        - >-
          The reported valuation is anonymous and unconfirmed by the company, while the maximum round amount is
          milestone-contingent.
        - Provide the signed post-money capitalization and complete tranche schedule.
      - - Anti-thesis
        - Available peer data compare total funding rather than revenue, profitability, or transaction valuation.
        - Supply a comparable analysis normalized for revenue, gross margin, growth, and security terms.
    notes: >-
      Sources mix independent reporting, transaction counsel, company pages, and market-data providers; strategic
      participation validates interest but does not independently validate product claims, revenue, or fair value.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: Bull, base, and bear decision scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Milestones unlock the committed capital; scaled deployments produce repeatable gross profit; platform breadth
          converts into durable demand.
        - A premium could become supportable only after audited growth, margin, and retention evidence permits a model.
        - Signed funded tranches plus independently verifiable customer expansion.
        - Milestone slippage or deployments that do not convert to recurring, profitable demand.
      - - Base
        - Strategic support continues, but commercialization and unit economics remain privately evidenced.
        - Treat the reported mark as unverified and require price protection or a lower entry basis.
        - Complete financing documents and cohort-level deployment economics.
        - Insufficient funded runway or preference terms that impair new-money returns.
      - - Bear
        - Later tranches do not fund, product breadth increases execution cost, and commercial proof remains weak.
        - Value is materially below the reported mark, but no defensible public-evidence floor can be calculated.
        - Missed performance milestones, weak gross profit conversion, or a down round.
        - Any one of those signals should suspend investment until recapitalization terms are known.
    notes: >-
      These are conditional decision scenarios, not probability-weighted forecasts; precise valuation ranges and
      probabilities are withheld because revenue, margins, burn, runway, tranche terms, and preference terms are not
      public in the assigned evidence.
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
