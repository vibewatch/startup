  - id: FV001
    title: Recommendation logic from headline financing to decision
    type: flow
    summary: >-
      The reported valuation and maximum commitment pass through funding-condition and commercial proof gates before
      they can support an investment recommendation.
    data:
      nodes:
        - id: reported-mark
          label: Reported approximately $7B valuation
          detail: Anonymous-source report; company declined comment.
        - id: maximum-commitment
          label: Up to $1.4B Series C
          detail: Headline maximum, not evidence of cash already available.
        - id: milestone-gate
          label: Performance milestone gate
          detail: Full funding is contingent on undisclosed company-performance milestones.
        - id: operating-proof
          label: Commercial proof gate
          detail: Revenue, margins, deployments, burn, and runway require diligence.
        - id: terms-proof
          label: Security terms gate
          detail: Dilution, preferences, funded-at-close proceeds, and tranche schedule require diligence.
        - id: decision
          label: Track; do not underwrite yet
          detail: Reassess only after operating proof, financing terms, and entry price are verified.
