  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: >-
        Signed financing documents establishing post-money valuation, fully diluted capitalization,
        funded-at-close proceeds, remaining commitments, tranche milestones, liquidation
        preferences, anti-dilution terms, and governance rights.
      whyItMatters: >-
        The reported valuation is anonymous and the maximum financing is contingent, so entry
        price, dilution, available liquidity, and downside protection cannot be underwritten.
      diligencePath: >-
        Review the executed share-purchase, shareholder, and side-letter documents and reconcile
        them to bank statements and the fully diluted cap table.
      relatedQuestionRefs:
        - QV002
        - QV006
    - type: missing-source
      severity: material
      topic: valuation-inputs
      missingEvidence: >-
        Audited revenue, product-level gross margin, customer deployments, backlog definitions,
        burn, runway, retention, and working-capital requirements.
      whyItMatters: >-
        These inputs are necessary to select a stage-appropriate valuation method, calculate a
        supportable range, and distinguish booked demand from profitable commercialization.
      diligencePath: >-
        Obtain audited financial statements, monthly management accounts, customer and deployment
        cohorts, backlog contracts, bill-of-materials data, and a board-approved operating plan.
      relatedQuestionRefs:
        - QV005
    - type: conflicting-data
      severity: material
      topic: funding-scope
      missingEvidence: >-
        A reconciled schedule explaining why public providers report $86 million of disclosed
        equity funding, $1.68 billion of total funding, and an up-to-$1.4-billion latest round.
      whyItMatters: >-
        The figures use different scopes and cannot be treated interchangeably as funding raised,
        cash funded, or cash available.
      diligencePath: >-
        Reconcile every financing round by date, security, committed amount, funded amount, and
        provider definition against company records.
      relatedQuestionRefs:
        - QV009
