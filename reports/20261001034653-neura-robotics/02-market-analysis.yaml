figures:
  - id: FM001
    title: Market-sizing evidence ladder
    type: pyramid
    summary: "The evidence becomes more decision-useful as it moves from broad category scale toward verified deployment economics."
    data:
      items:
        - label: Established automation base
          value: "542,000 installations"
          detail: "Industrial robots installed globally in 2024, as IFR is cited by a secondary source."
          tone: positive
        - label: Long-range category forecasts
          value: "$38B by 2035; $5T by 2050"
          detail: "Different publishers, horizons, and category scopes; not directly comparable."
          tone: neutral
        - label: Company demand signal
          value: ">$1B order book"
          detail: "Company-reported pipeline; conversion into revenue and deliveries is undisclosed."
          tone: neutral
        - label: Workflow-level ROI hypothesis
          value: ">1,300 hours annually"
          detail: "NEURA estimate based on about 20 empty-bed moves per day at one facility."
          tone: neutral
        - label: Independent deployment proof
          value: "Not available"
          detail: "No named hospital trial with measured savings was present in the assigned evidence."
          tone: warning
        - label: Repeatable unit economics
          value: "Undisclosed"
          detail: "Gross margin, support cost, uptime, intervention rates, and repeat-purchase evidence remain gaps."
          tone: warning
    approximationNotes: "The layers are an evidence hierarchy, not proportional market sizes; monetary values, unit counts, and time savings must not be compared arithmetically."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015, CM016]
callouts:
  - calloutType: risk
    title: Headline forecasts are not a company-specific SAM
    body: >-
      The $38 billion and $5 trillion forecasts use different horizons and category boundaries.
      Neither establishes NEURA's serviceable market, attainable share, pricing, or deployment margin.
    claimRefs: [CM008, CM009, CM010]
  - calloutType: recommendation
    title: Underwrite conversion evidence, not category enthusiasm
    body: >-
      Request order-book conversion, shipped and paid units, repeat orders, uptime, intervention
      rates, gross margin, and field-support cost by product and workflow before assigning platform economics.
    claimRefs: [CM006, CM015, CM016]
