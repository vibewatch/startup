      - [Material handling and intralogistics, "Logistics or facility operations", "Warehouse and plant teams", "Automation or logistics budget", "Autonomous movement of goods and equipment", "Repetitive transport workload and site fit"]
      - [Quality inspection and machine tending, "Manufacturing engineering", "Operators and quality teams", "Plant automation budget", "Perception-led inspection or machine interaction", "Need for adaptable sensing and reduced manual handling"]
      - [Hospital bed logistics, "Hospital operations or facilities", "Clinical staff benefit; logistics teams operate", "Monthly operating budget through an integration partner", "Movement of empty beds between wards and floors", "Verified corridor, door, elevator, hygiene, and safety fit"]
