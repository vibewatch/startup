      - number: '4.2'
        title: 成本结构、单机经济模型与毛利率驱动因素
        blocks:
          - type: paragraph
            body: >-
              Neura Robotics 的成本底盘来自三项重投入：全栈硬件工程、传感器集成和实体训练基础设施。纯 AI 基础模型开发商只做操作软件，Neura 则自行设计、制造并集成专有硬件、多模态传感器阵列（包括专利
              NEURA Omnisensor）和嵌入式边缘计算栈。2024 年初，Neura 把核心制造业务从中国迁回德国
              Metzingen。回迁满足了欧洲客户严格的采购要求、供应链可见性要求和西方数据驻留标准，却也使单机人工成本、机械加工费用和初始物料清单（BOM）门槛高于亚洲人形机器人同行。早期协作机器人出货的毛利率仍不透明，原因是非经常性工程（NRE）成本尚未摊销，还要承担定制集成服务成本。实体
              AI 训练环境则继续吞噬运营和资本开支：例如慕尼黑机场占地 2,300 平方米的 TUM RoboGym 和各地 Neura Gym，都用于采集非结构化真实世界训练轨迹；在规模量产前，这些设施会持续占用现金。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
