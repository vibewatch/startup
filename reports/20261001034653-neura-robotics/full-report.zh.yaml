      - number: '6.4'
        title: 客户赋能、收入韧性与扩张潜力
        blocks:
          - type: paragraph
            body: >-
              NEURA 勾勒了一条从实机演示走向人员培训与场景验证的赋能闭环：设立 NEURA Gym 旨在让合作伙伴在全面工业部署前训练并验证落地场景，NEURA Academy 则称面向客户及集成商提供 LARA 与
              MAiRA 的专业实操培训。这些举措或有助于降低现场集成摩擦，而规划中的美国 Gym
              站点有望拓展海外地域触达。然而，掌握的所有材料均未给出净留存率（NRR）、总留存率（GRR）、客户流失率、续约表现、合约周期、满意度评分、技术支持开销、单一大客户集中度或按季度/年度切分的复购队列数据。New
              Market Pitch 指出，实际出货量、机器人运行工时、正常开机时间、复购订单以及实测部署网点，仍是当下亟待补齐的硬核运营凭证。因此，后续客户旅程图谱本质上是一张证据完备度梳理表，而非已经走通的商业转化漏斗。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
