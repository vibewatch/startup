              - CU013
      - number: '6.5'
        title: 支撑展品
        blocks:
          - type: callout
            title: 意向管线不等于留存收入
            body: >-
              对外宣传的亮眼数字将储备订单与战略部署管线混为一谈，而公开材料未披露任何具法律约束力状态、收入确认节点、客户留存率或客户集中度。在将该指标视作真实的客户长期接纳前，投资尽调必须调阅合同条款、交付验收单、已付款发票与追加复购记录，逐笔核实各项重大商业承诺。
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU014
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险优先级全景与投资启示
        blocks:
          - type: paragraph
            body: >-
              排在首位的核心风险，是在庞杂的全栈机器人产品线、多家并购标的以及不断扩大的外部合作生态之间，能否保持高效协同的组织执行力。NEURA 既展示了认知机器人、协作平台与 AI 助手，同时宣称核心 AI
              算法、控制系统、传感器及机械结构件均由内部自主研发。第三方梳理还列出了其在移动机器人、汽车电子、仓储物流及清洁设备等领域的多次并购。这种多头并进或许带来了产品与分销的灵活性，但在量产良品率与可复用商业经济模型尚未获得公开证据验证之前，也极大地加剧了系统集成、品控与资金链的重压。最新一轮融资据报道最高达
              $1.4 billion
              而非已到账的确凿现金，且有独立研报指出注资以达成里程碑为前提、分期发放。这对投资的启示在于：绝不能仅凭宣称的融资体量盲目下注，必须将投资判断建立在注资款项可支取性、并购业务整合掌控度、独立安全合规凭证以及经核验的实际运营指标之上。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR012
              - CR013
              - CR015
              - CR016
