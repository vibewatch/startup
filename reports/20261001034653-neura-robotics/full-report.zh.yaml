      - number: '6.3'
        title: 具名客户凭证与部署现况
        blocks:
          - type: paragraph
            body: >-
              具名客户的实际凭证明显弱于总体管线口径的宣称。New Market Pitch 报道称，Schaeffler 已签署承购协议，并计划在 2035 年前于其制造网络中部署数千台 NEURA
              机器人，德国媒体报道称该笔订单金额接近 EUR 300 million。同份资料还将早前需求与 Kawasaki Heavy Industries 及 Omron
              联系在一起，但未提供有关付费交付台数、厂区点位、正常运行时间或追加复购的任何具体数据。Max Robotics 在 2026 年 6
              月的研究档案中明确指出，在其梳理的公开记录中，没有任何一家具名客户曾公开确认过实际生产部署。这些信源只能证实存在商务合作信号，并不支持任何具名大客户已在规模型产线中批量运行机队的结论。
            claimRefs:
