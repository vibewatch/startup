            body: >-
              2026 年 6 月公布的 $1.4B Series C 融资在财经媒体报道中常被简单视作已承诺注资，但彭博社（Bloomberg）报道证实，款项能否全额发放严格取决于未披露的商业与技术里程碑。截至 2026 年
