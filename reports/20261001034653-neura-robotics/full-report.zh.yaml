  - id: TV002
    title: 核心投资逻辑与反向逻辑
    columns:
      - 立场
      - 基于证据的论点
      - 转向条件
    rows:
      - - 投资逻辑
        - 规模可观的 Series C 轮融资吸引了战略科技、半导体、工业以及机构投资方参与。
        - 需通过签署文件核实交割时已到账的投资人出资额及治理权利。
      - - 投资逻辑
        - NEURA 呈现出覆盖广泛的具身认知机器人产品矩阵，其招聘官网亦显示技术与职能部门持续投入。
        - 需出示可复制的付费交付案例、产品级毛利率以及人员招聘产出效率。
      - - 反向逻辑
        - 据报道的估值来自匿名信源且未经公司证实，本轮最高融资金额亦取决于里程碑进展。
        - 需提供签署生效的投后股权结构表及完整的分期注资时间表。
      - - 反向逻辑
        - 现有可比公司数据仅对比了累计融资额，而非营业收入、盈利能力或实际交易估值。
        - 需提供经过收入、毛利率、增速以及证券条款标准化调整后的可比分析。
    notes: 信息来源融合了独立报道、交易法律顾问、公司官网及市场数据机构；产业方的战略参与证实了市场兴趣，但无法独立验证公司的产品主张、营业收入或公允价值。
