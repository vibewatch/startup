  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 目标客群与采购决策中心
        blocks:
          - type: paragraph
            body: >-
              NEURA 触达多个异构客群，绝非面对单一同质化买家。公司官方宣传将产品定位于工业、生产作业及日常生活三大场景；而一份联合新闻稿则将买方进一步细分为工业企业、系统集成商、开发者与 OEM 厂商。Tracxn
              将其实际工业工序梳理为装配、物料搬运、质检、焊接、涂胶和机床上下料；Venture Capital Tracker
              则补充了商业服务护理、物流及非结构化环境作业等场景。因此，公开证据足以支撑其客群赛道宽度的叙事，却无法证实各细分赛道的客户数量、出资方结构、实际部署台数或收入贡献。在拿到合同文本与装机量明细以区分活跃客户与泛生态参与者之前，投资人应将这份客户画像视为商业定位，而非落地实绩。
            claimRefs:
