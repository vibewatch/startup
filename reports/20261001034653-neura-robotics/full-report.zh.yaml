      - number: '4.3'
        title: 资金充裕度、融资依赖与后续尽调关卡
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月，Neura Robotics 宣布完成一笔最高达 $1.4B 的空前 Series C 轮融资，由加密稳定币发行方 Tether 领投，科技巨头
              Amazon、NVIDIA、Qualcomm，工业供应商 Bosch、Schaeffler 以及公共政策金融机构欧洲投资银行（EIB）跟投。CNBC 报道引述其投后估值约为 $7B，较 2025 年 1 月
              Series B 轮报道的 $800M 估值跳涨 8.8 倍。从投资评估角度看，关键在于彭博社（Bloomberg）与行业尽调指数的独立报道证实：这笔标称 $1.4B 的融资并非一次性全额到账，而是严格取决于
              Neura 是否达成未披露的技术与商业化里程碑。此外，尽管公司频频宣称其积压订单与部署意向金额超过 €1B，但独立尽调指数显示，截至 2026 年年中，NEURA
              尚无任何公开可验证的产线客户部署或试点记录，4NE1 仍处于 Tier 3（演示验证）阶段。鉴于实际账面现金、净运营烧钱速度及里程碑触发条件均未对公众披露，若不直接调阅 Series C
              投资条款清单与保密财务报表，机构投资者便无法确立其后续现金跑道与独立造血能力。
            claimRefs:
