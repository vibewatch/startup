              展会上的现场演示与生态伙伴联合应用，虽展现出商业拓展力度以及产品具备送测条件，但这并不证明已经用于付费生产。Max Robotics
              同样报道称，公司营收数据从未对外公开，且无法从公开资料中拆解出订单储备的具体构成。
            claimRefs:
