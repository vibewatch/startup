              最亮眼的商业接纳指标来自公司自述：NEURA 称其现有储备订单与战略部署管线超过 $1
              billion。这一表述将两类不同性质的指标混为一谈，并未公开具约束力订单、框架协议、试点意向、期权或其它非正式承诺的各自金额。New Market Pitch
