      - number: '7.2'
        title: 监管合规、法律纠纷、安全隐患与数据暴露
        blocks:
          - type: paragraph
            body: >-
              现有归档材料中并未包含监管部门通报、法院涉诉记录、强制认证登记、产品召回公告或独立安全评估报告。这种信息的缺失，并不等同于不存在任何事故或合规风险。公司强调其机器人旨在与人类并肩作业，且据报道其医疗平台在经医院平面布局验证后用于搬运病床与无菌物资。这些特性使得功能安全、准入许可、隐私保护、产品质量责任以及工程变更控制等凭证，成为投资决策的生死线。公司官方发帖声称采用端侧就地处理，且作业产生的数据完全由合作伙伴自主掌控；但留存材料中没有一份对上述承诺做过测试，也未公开关于数据权属的合同约定细节。最严密的风控举措在于查阅一手文件：在将规模化商业运营计入估值前，必须获取各产品的合格符合性声明、危害分析、事故与未遂故障台账、渗透测试报告、商业保险保单、隐私合规条款，以及各司法管辖区签发的商业部署批文。
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR005
              - CR006
      - number: '7.3'
        title: 运营落地、财务表现与组织执行风险
        blocks:
          - type: paragraph
            body: >-
              公开的各项运营数据在内部口径上难以对齐。公司在 LinkedIn 主页宣称团队逾 1,500 人，而 Tracxn 记录截至 2026 年 8 月 31 日员工数为 688
              人；不同信源可能采用了不同的统计口径、日期或纳统规则，但均未提供足以对齐该差距的详细底层数据。与此同时，招聘页面涵盖从 AI
              算法到财务的全职能岗位，表明组织仍在持续扩张，但具体空缺编制、薪酬支出、人员流失率或驻地分布均未公布。从破产重组程序中抄底的资产，加上后续纳入的 ACTIVE Shuttle 与
              ADLATUS，都增加了业务整合的接触面，但现有证据池未包含任何分部财务报表、重组拨备、量产良品率、售后保修数据、烧钱速度或现金跑道。投资方应当要求公司提供法人实体人员编制对齐表、并购整合记分卡、月度现金流量表、已承诺与附带条件注资进度表，以及产品维度的品控看板。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: 伙伴依赖、监测指标与一票否决标准
        blocks:
          - type: paragraph
            body: >-
              NEURA 的底层架构与商业化通路高度依赖外部生态伙伴，这一点必须逐项核对合同文本。公司官方发文指出其“智能肢体”搭载了 Qualcomm 处理器；维基百科记录其依托 AWS 进行 Neuraverse
              托管与云端训练；据报道医疗场景则以机器人即服务（RaaS）形式由合作伙伴铺开，但未披露具体分成定价。这些战略同盟或能加速商业化破局，但公开材料未对供应商集中度、替代切换成本、SLA
              履约责任、客户归属权或毛利分成机制做任何量化披露。融资端同样存在重大隐患，因为“最高达”的总额与挂钩里程碑的分期拨款，根本不能等同于可用账面现金。触发核心投资逻辑证伪（thesis-break）的指标包括：未达成阶段目标导致后续注资无法提款、核心战略伙伴退出且未能引入等量级替代方、在大规模近人作业落地前缺乏独立安全认证，或无法理清并购资产实际运营与员工人数差异。只要触发上述任一红线，就应暂停后续投资决策，直至一手凭证完全补齐相关缺口。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
