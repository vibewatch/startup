chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              NEURA Robotics 于 2019 年由 David Reger 创立，总部位于德国 Metzingen [CO001, CO002]。公司自述为全栈具身智能（Physical
              AI）研发商，将认知机器人、传感器、边缘计算、AI 以及基于 Neuraverse 的共享学习基础设施结合在一起
              [CO003]。据报道，其产品组合并未局限于单一硬件形态，而是覆盖协作机械臂、人形机器人、自主移动机器人及服务助手 [CO015]。官方招聘网站还介绍了 NEURA Academy
              模块化培训，面向客户、系统集成商及新员工提供针对 LARA 与 MAiRA 的培训课程
              [CO004]。上述证据表明公司采取硬件加平台赋能服务的商业模式，但公开材料未披露具体定价、经常性软件业务收益，以及产品、服务与平台收入的各自占比。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
              - CO009
              - CO011
              - CO015
              - CO016
      - number: '1.2'
        title: 融资规模与据报体量
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 10 日，NEURA 宣布完成总额最高达 $1.4 billion 的 Series C 融资 [CO005]。独立报道称其估值约为 $7 billion，同时指出公司并未出面确认该数字
              [CO006]。更关键的是，两份独立报道均指出，该轮全额注资取决于尚未披露的业绩里程碑，因此公开宣称的融资总额既不能证明现金已实际到账，也不代表当前的流动性水平
              [CO007]。公司还表示其订单储备与战略部署意向储备超过 $1 billion，但这项公司口径指标并非营业收入，且现有证据未提供任何订单转化、取消或回款数据 [CO009,
              CO016]。一份第三方机构资料报道称员工人数超过 1,400 人，但该统计口径未经独立审计 [CO011]。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO008
              - CO012
      - number: '1.3'
        title: 核心管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              现有证据一致将 David Reger 列为创始人兼首席执行官，这也是目前唯一能在公司官方与独立信源间交叉印证的高管职位
              [CO001]。这并不意味着管理权限完全集中于一人，而是说明现有的公开证据高度聚焦在他身上。留存的 8
              份信源均未给出完整的高管名册、监事会成员构成、表决权结构、创始人持股比例，或是本轮最新融资附带的董事会席位。融资公告虽然列出了阵容庞大的战略投资方，但出资参股本身并不等同于掌握治理控制权
              [CO008]。因此，管理团队梯队、接班人计划、保留审批事项与投资人权利仍属重大尽调缺口，而非推断得出的固有缺陷。
            claimRefs:
              - CO001
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO008
      - number: '1.4'
        title: 发展历程与尽调基准
        blocks:
          - type: paragraph
            body: >-
              现有证据梳理出一条清晰的发展脉络：2019 年创立，2021 年与 2023 年录得 Series A 轮融资记录，2025 年 1 月完成 EUR 120 million 的 Series B 轮，随后于
              2026 年 6 月公布 Series C 轮融资 [CO001, CO005, CO012, CO013]。专业创投资料显示，Neuraverse 生态在 Automatica 2025
              展会正式发布；公司目前的远期目标是在 2030 年实现数百万台规模的量产 [CO014,
              CO010]。时间线上将既往事件与远期规划严格区分，因为生产愿景绝不等于已实现的出货里程碑。本次针对负面舆情的检索未发现有效留存记录，但这并不足以证明诉讼、监管处罚、安全隐患、召回、停机或治理事故完全不存在。更稳妥的反向结论是：资金实际到位取决于尚未披露的里程碑，且商业化订单转化尚未得到验证
              [CO007, CO009, CO016]。
