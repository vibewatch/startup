  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业变现架构
        blocks:
          - type: paragraph
            body: >-
              Neura Robotics 采取混合型工业变现模式，覆盖机器人硬件直销、经常性机器人即服务（RaaS）订阅合约，以及尚处起步阶段的 Neuraverse 软件生态。硬件目录包括认知协作机械臂（MAiRA 与
              LARA）、自主移动运输单元（MAV），以及旗舰产品 4NE1 人形机器人。标准工业协作机器人与移动作业平台主要采用一对一企业报价，而非公开固定价目表，以涵盖末端执行器非标定制、安全认证及现场工程改造等环节。针对
              4NE1 人形机器人，据报道单台商用起售价约为 €98,000，订购 20 台及以上的批量采购单价可降至 €60,000，个人预订则通过收取 €100 的可退还意向金锁定。在医疗领域，Neura 将其 Neura
              HealthTech 病床物流方案设计为纯经营性租赁的 RaaS
              模式，将硬件、交付工程、全天候运维与常规软件升级打包为可预期的月度运营费用。然而，实际达成的平均销售单价（ASP）、软件净收入留存率（NRR）及平台抽成比例均为未披露的私密数据，无法据此开展传统软件维度的投资评估。
