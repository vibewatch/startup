      - number: '5.3'
        title: 软件中间件、接口架构与集成工作流
        blocks:
          - type: paragraph
            body: >-
              NEURA 的软件堆栈依托多层通信基础设施，打通了上层抽象 AI 指令与底层实时物理执行之间的断层。核心机器人中间件基于数据分发服务（DDS）协议（包括 FastDDS），并结合 ROS 与 ROS2
              框架集成，统一管理自主子系统、边缘计算节点与上层机队调度控制器之间的分布式发布订阅消息通信。面向客户交付，NEURA 搭建了融合统一用户 API、REST 与 gRPC 服务，以及 OPC
              UA、MQTT、ZeroMQ 等工业总线协议的接口架构。专用分发机制（dispatcher）将模块化软件配置与功能集精准映射到特定机器人型号及硬件版本上。软件开发与仿真流程依托 RoboGym 与
              NeuraGym 仿真平台加持，在物理机队落地前即可完成算法快速验证、模型训练与持续集成。
            claimRefs:
              - CE005
