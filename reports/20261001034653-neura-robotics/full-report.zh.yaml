  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流交付
        blocks:
          - type: paragraph
            body: >-
              NEURA Robotics 将其产品矩阵锚定在具备自主思考、持续学习并能与工人在工业、医疗及商业环境中直接协作的认知机器人上。公司没有走传统围栏式自动化的老路，而是推出 MAiRA 和 LARA
              协作机械臂、MAV 自主移动平台，以及 4NE1 认知人形机器人。这些系统将环境感知与自适应力控直接融入操作工序，旨在彻底摆脱笨重的硬隔离围栏。在商业化场景中，硬件充当标准化的执行层，统一受 Neuraverse
              应用程序生态管控；该生态为跨行业复杂环境提供模块化机器人应用与可复用技能。然而，尽管对外宣传描摹了跨行业的广泛适用性，但规模化车间部署案例与客户侧反馈的实际可靠性指标，依然属于严格保密的非公开数据。
            claimRefs:
              - CE001
