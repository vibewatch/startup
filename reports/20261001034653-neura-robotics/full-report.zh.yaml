  - id: FV001
    title: 从头条融资信息到投资决策的推导逻辑
    type: flow
    summary: 报道提及的估值与最高融资金额，须先后通过注资先决条件与商业化凭证两道检验关卡，方能作为投资建议的支撑依据。
    data:
      nodes:
        - id: reported-mark
          label: 据报道约 $7B 估值
          detail: 报道来自匿名信源；公司对此拒绝置评。
        - id: maximum-commitment
          label: 最高 $1.4B 的 Series C 轮融资
          detail: 仅为名义最高额度，并不代表资金已经实际到位。
        - id: milestone-gate
          label: 业绩里程碑检验关卡
          detail: 资金全额到账取决于未公开披露的公司业绩里程碑。
        - id: operating-proof
          label: 商业化凭证检验关卡
          detail: 营业收入、利润率、实际交付、烧钱速度及现金跑道均需深入尽调。
        - id: terms-proof
          label: 证券条款检验关卡
          detail: 股权稀释、清算优先权、交割到账资金与分期注资安排均需深入尽调。
        - id: decision
          label: 列入观察；暂不作出投资判断
          detail: 唯有在运营凭证、融资条款与入场价格得到全面核实后，方可重新评估。
      edges:
        - from: reported-mark
          to: maximum-commitment
        - from: maximum-commitment
          to: milestone-gate
        - from: milestone-gate
          to: operating-proof
        - from: operating-proof
          to: terms-proof
        - from: terms-proof
          to: decision
    approximationNotes: 该流程图仅用于定性推演，并不暗示任何量化转化率、发生概率或估值区间。
    claimRefs:
      - CV002
      - CV004
      - CV013
      - CV016
