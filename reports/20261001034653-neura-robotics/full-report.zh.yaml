      - number: '5.4'
        title: 技术壁垒、安全合规与尽调风险
        blocks:
          - type: paragraph
            body: >-
              NEURA
              机器人系统的差异化壁垒源于其自研机电一体化设计，将各关节就地力矩传感与认知视觉、声学感知深度融合。系统架构把控由专设的系统工程部负责，专司将法规合规要求拆解转化为结构化、可追溯的系统工程模型。工程落地严格遵循欧盟机械指令（Machinery
              Directive）和 VDI 规范等欧洲工业标准，并辅以现代文档代码化（Docs-as-Code）工具链与严谨的模块化文档。尽管有这些架构基础，但在投资尽调中仍暴露出不容忽视的技术与运营风险。串联
              Qualcomm 芯片、SECO 代工与 NEURA
              组装的多方硬件供应链，让量产爬坡极易受到半导体产能调配与跨国物流波动的制约。此外，评估全系统平均无故障工作时间（MTBF）以及在持续工业高强度负荷下关节长期耐用性的独立第三方基准测试，尚未见公开发表。
            claimRefs:
              - CE004
              - CE011
