      - number: '5.2'
        title: 分布式具身智能架构与硬件堆栈
        blocks:
          - type: paragraph
            body: >-
              NEURA 差异化技术核心在于其自研的具身智能（Physical AI）架构，采用分布式“大脑加神经系统”设计。该架构摒弃了将所有传感器原始遥测数据回传至中央工控机的传统做法，引入“智能肢体”（Smart
              Limbs）理念，将感知与算力直接分散布置在机器人末端与各关节中。为推动分布式计算模式产业化落地，NEURA 携手意大利嵌入式电子制造商 SECO，联合设计并制造车规级加固计算模块。这些模块将 Qualcomm
              Dragonwing 处理器直接集成到机器人肢体内部，以极低延迟提供高性能、低功耗的边缘推理与确定性控制回路。这种去中心化计算架构让 4NE1
              人形机器人等认知平台能够在关节级就地处理多模态环境反馈，从而实现毫秒级快速条件反射与安全的人机物理交互。
            claimRefs:
              - CE003
              - CE008
              - CE012
              - CE013
              - CE014
