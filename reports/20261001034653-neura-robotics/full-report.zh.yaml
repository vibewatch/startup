              - CR008
      - number: '7.5'
        title: 支撑展品
        blocks:
          - type: callout
            title: 公告融资额不等于可用现金
            body: 公开资料将 Series C 描述为“最高达”$1.4 billion 且分期挂钩里程碑。投资评估必须以实际到账现金、具备法律约束力的出资承诺和各期解锁条件为准，绝不可轻信宣传总额。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: 规模化落地必须以一手核心凭证把关
            body: 在将公开宣称的防范措施视作有效风控手段前，必须查验各型号的安全认证卷宗、事故记录、合作方主协议、集成推进节点以及核验一致的注资排期表。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决断与入场纪律
        blocks:
          - type: paragraph
            body: >-
              基于目前的公开证据，最审慎的投资决断是观察（track）而非买入。CNBC 援引匿名信源报道称其估值约为 $7 billion，并指出 NEURA 对此拒绝置评；报道还提到 Series C
              全额注资取决于未披露的业绩里程碑。这些限定条件让公司估值与当前立即可用的现金均存在极大不确定性。阵容豪华的战略投资方固然是一记强有力的背书信号，但这绝不能替代经独立审计验证的营业收入、毛利率、客户实际交付、烧钱速度、现金跑道或优先清算条款。因此，置信度评定为中，风险评级为高。进场仍须以深度尽调为前提；在发行证券类型、交割实际到账金额与真实运营底盘获得确凿凭据前，不宜建立任何预期回报率或持有期限模型。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 融资背景与可比公司信号
        blocks:
          - type: paragraph
            body: >-
              横向对比已有的机器人企业标杆，2026 年 6 月公布的这一轮融资规模堪称巨量：CNBC 与交易顾问律师均指出，该笔 Series C 融资额最高达 $1.4
              billion，资方银团横跨科技巨头、半导体厂商、工业集团与公共政策资本机构。Tracxn 统计其历经 6 轮融资累计融得 $1.68
              billion，累计融资金额高居多家具名机器人同行之上；但融资额不等于公司估值、营收或在手可用现金。各数据机构的统计口径同样严重打架：Venture Capital Tracker 记录其已披露的股权融资总额仅为
              $86 million，同时单列出最高达 $1.4 billion 的最新一轮。因此，这一可比样本组只能反映赛道的资本密集度与投资人追捧热度，无法推导出一个站得住脚的市销率（P/S）倍数或投后估值基准。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: 拒绝虚假精确的情景分析框架
        blocks:
          - type: paragraph
            body: >-
              硬给出一组现金流折现（DCF）数值或市销率估值区间，纯属虚假精确，因为公开信源均未披露营收、毛利率、烧钱速度、现金跑道、优先股堆叠结构或分期拨款明细。乐观情景的前提，是已获资金支持的里程碑能够顺利转化为
              NEURA
              多元产品线在产业端的大规模、可复用落地。基准情景假定公司在技术研发与人才招募上持续投入，但商业化真凭实据依然秘而不宣，使得据报估值仍处于未经验证状态，绝不代表估值合理。悲观情景则是未能解锁后续分期注资、多品类难以转化为真金白银的付费订单，或是融资条款对新进资本设置了劣后清算条件。现有证据无法划定下行底线，因此情景表采用决策前置条件而非凭空臆造的估值终值来界定。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出就绪度、尽调清单与逻辑证伪红线
        blocks:
          - type: paragraph
            body: >-
              手头证据无法证实公司已具备退出就绪度。宽广的机器人平台布局、活跃的招募势头与战略投资方支持，或许能为工业并购或后续轮次融资铺路，但目前尚无公开的营收体量、经审计单机经济模型、明确流动性时间表或可比交易，能为当下的退出估值提供实据。最终尽调必须调阅完全稀释后的股权结构表（cap
              table）、证券类型与清算优先条款、分期注资里程碑、交割时实际到账现金、剩余出资承诺、经审计营收与在手订单口径定义、客户级实际部署、毛利率、烧钱速度及现金跑道。投资逻辑证伪触发条件包括：严重错失关键分期里程碑、无法将产线部署转化为可持续的毛利润，或是投资条款要求的回报预期在当前据报估值下无法实现。在上述核查完全过关前，融资成局只能证明其具备资本撬动能力，绝非估值公允的凭证。
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV010
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV013
              - CV016
      - number: '8.5'
        title: 支撑展品
        blocks:
          - type: callout
            title: 估值敏感型投资决断
            body: 建议观察（track）NEURA Robotics，但切不可将据报道的估值或最高出资承诺，视作公允价值或可用现金的充分证据。
            calloutType: recommendation
            claimRefs:
              - CV002
