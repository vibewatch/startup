  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 决策情景
      - 前提假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 里程碑顺利达成并解锁认诺资金；规模化交付带来可复制的毛利；丰富的产品平台转化为持久需求。
        - 唯有经过审计的增速、利润率与留存数据能够支撑建模后，估值溢价才具备合理性。
        - 附有签署凭证的已到账注资款项，加之经独立核实的客户增购扩张。
        - 里程碑进度延期，或交付未能转化为具有持续盈利能力的常态需求。
      - - 基准
        - 战略方支持仍在延续，但商业化落地与单机经济模型仍仅存于非公开证据中。
        - 将报道提及的估值标杆视为未经证实，要求提供估值保护条款或更低的入场基准。
        - 完整的融资法律文件及客户队列维度的交付经济模型。
        - 实际到账资金不足以支撑预期跑道，或优先清偿条款削弱新进资金回报。
      - - 悲观
        - 后续各期款项未能到账，产品线过宽推高执行成本，且商业化佐证依然薄弱。
        - 实际价值显著低于报道标杆，但公开证据不足以测算任何具备防守性的估值底部。
        - 业绩里程碑落空、毛利转化乏力，或出现降估值融资轮次。
        - 出现上述任一信号均应暂缓投资，直至资本重组条款彻底明朗。
    notes: 上述内容属于条件化决策情景，而非经概率加权的财务预测；鉴于在既定证据中，营业收入、利润率、烧钱速度、现金跑道、分期注资条款及优先权条款均未公开，报告不给出精确的估值区间与发生概率。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
