      - number: '1.5'
        title: 支撑展品
        blocks:
          - type: callout
            title: 融资头条金额不等于账面现金
            body: >-
              官方公布的 Series C 轮融资最高达 $1.4 billion，且独立报道指出全额出资取决于未披露的业绩考核指标 [CO005,
              CO007]。因此，评估流动性与资金跑道必须以分批注资（tranche）的具体凭据为准。
            calloutType: insight
            claimRefs:
              - CO005
              - CO007
          - type: callout
            title: 储备订单不等于实际营收
            body: NEURA 声称其订单储备与部署管线超过 $1 billion，但现有证据均未披露经审计的营收、利润率、订单转化率及实际回款情况 [CO009, CO016]。未经客户级证据核验，该指标仍只能视作公司单方口径。
            calloutType: risk
            claimRefs:
              - CO009
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采购预算池
        blocks:
          - type: paragraph
            body: >-
              评估 NEURA
              的投资价值，不能简单套用概念未分化的“人形机器人”单一市场。其实际可触达的边界始于现有的工业自动化：用于装配、物料搬运、质检、机床上下料、焊接及涂胶的认知机械臂与移动平台。随后延伸至商业服务自动化（包括医院物流），最外围才是通用人形机器人及共享机器人软件生态。纳入统计的支出可包含机器人硬件、系统集成、日常运维、软件更新及技术支持。剔除的支出则包括无关的工厂设备、临床诊疗、病患转运，以及尚无明确采购流程的概念性消费级家务劳动力。现有替代方案仍是人工劳动力、传统固定式自动化装备、存量工业机器人及专用移动设备。划清这道边界至关重要，因为各细分领域的采购决策人、落地风险与经济模型截然不同。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: 基于扎实证据的市场测算
        blocks:
          - type: paragraph
            body: >-
              当前市场最硬的凭据来自已安装的工业存量运转，而非口径宽泛的远期预测。一份援引国际机器人联合会（IFR）数据的二级分析指出，2024 年全球新安装工业机器人达 542,000
              台，是十年前的两倍以上。相比之下，同份材料提到 Goldman Sachs 预计 2035 年人形机器人市场规模将达 $38 billion，Morgan Stanley 则描绘了 2050 年规模达 $5
              trillion 的生态远景。这些数字不可简单相加：测算年份、品类定义及所含配套经济规模均有重大差异。NEURA 宣称超过 $1 billion
              的订单储备仅为公司单方释放的需求信号，既非确认收入，也不能证实最终能转化多少份额。站得住脚的结论是：相邻采购预算池体量庞大，但属于该公司的可服务市场（SAM）与可获取市场（SOM）尚未得到验证，无法自上而下给出确切的市场份额。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.3'
        title: 采购方、使用者、出资方与落地路径
        blocks:
          - type: paragraph
            body: >-
              工业场景的买方通常是运营、自动化、总务工程或物流主管；一线工人使用设备，硬件与集成费用则由资本支出或自动化专项预算支付。医疗场景则是另一套路径：医院运营或后勤团队可由集成伙伴提供按月付费的机器人即服务（RaaS）方案，医护人员则受益于非临床转运负担的减轻。NEURA
              的医疗方案已细化至空床转运、场地验证、日常维保、软件升级及待命支持，但目前尚未获得任何具体具名医院的临床试验作为证据支撑。公司面向客户与集成商开设的培训课程也说明，客户接纳依赖于深度赋能，绝非交钥匙即可。因此，落地过程应建模为工序筛选、场地验证、系统集成、人员培训、试运行监控，随后才可能迎来大规模推广或复购。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              用工荒、生产安全、柔性自动化以及降低机器人使用门槛，是现有材料中最明确的需求驱动力。医疗场景提供了一个可量化的工作流假设：NEURA 估计每天转运约 20 张空病床，每年可为医护团队省下 1,300
              多个工时。但这仍属于公司单方估算，并非医院独立发布的实际运营结果。商业化落地的核心制约在于：集成与培训成本、安全与卫生达标认证、设备正常运行时间、人工干预率、现场技术支持支出、非标定制工程量，以及复购需求的不确定性。竞争面同样广泛；Tracxn
              将 NEURA 置于包含 1,254
              家活跃竞争对手的竞争版图中，尽管该数据库的收录品类远宽于直接的人形机器人同行。估值溢价应奖励已转化的真实订单、规模化复购及经常性平台经济模型，而非脱离交付的宏大预测。一旦试点项目停留在小批量验证，或收入主要被硬件售后运维吞噬，实际可攫取的利润池将远小于公开宣称的市场规模。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 支撑展品
        blocks:
          - type: callout
            title: 宏观预测不等于公司专属的 SAM
            body: $38 billion 与 $5 trillion 的预测在测算周期和品类边界上截然不同。二者都无法作为推算 NEURA 可服务市场、可获取份额、定价能力或交付毛利的有效依据。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: callout
            title: 依据订单转化做投资评估，切忌盲从赛道热度
            body: 在将平台经济模型计入估值之前，应重点核实各产品和工作流的订单转化率、实际交付与收款台数、复购订单、正常运行时间、人工干预率、毛利率以及现场支持成本。
            calloutType: recommendation
            claimRefs:
              - CM006
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、人形新势力与工业传统巨头
        blocks:
          - type: paragraph
            body: >-
              围绕 Neura Robotics
              的竞争格局由三股结构性力量共同塑造：直接的具身智能与人形机器人同行、根基深厚的传统工业自动化巨头，以及快速崛起的高性价比硬件制造商。与专攻双足通用劳动力形态的单一人形机器人初创公司不同，Neura
              采取多元化产品组合策略，整合了 MAiRA 和 LARA 等认知协作机械臂、MAV 等自主移动平台，以及 4NE1 人形机器人平台。这一技术矩阵让 Neura
              得以切入工业装配、厂内物流以及人机协作机床上下料，直接迎战 ABB、FANUC、KUKA 等传统自动化巨头，以及协作机器人领军企业 Universal
              Robots。传统巨头虽然坐拥根深蒂固的制造分销网络与数十年产线积淀，但在原生认知感知与自适应基础模型智能上落后明显，这为 Neura 的传感器集成硬件生态提供了清晰的突破口。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 认知架构与公开工厂部署验证
        blocks:
          - type: paragraph
            body: >-
              具身智能（Physical AI）的技术差异化，本质上取决于原生感知、仿真模拟与真实物理训练环境的闭环融合。Neura Robotics 的技术特色在于将 3D
              视觉、力矩传感、声学感知及语音交互直接嵌入机器人关节，依托 Neuraverse 开放软件生态连接，并借助实体 NEURA Gym 以及与慕尼黑工业大学联合设立的 TUM RoboGym
              开展训练。然而，商业化验证必须将战略合作势头与经审计的车间落地执行严格区分开来。尽管 Neura 与 Schaeffler、Bosch 建立了高规格工业合作，并拥有据报道超过 $1 billion
              的储备订单，但其美国正面对手 Figure AI 展现出更扎实的实测车间部署证据，典型代表就是 BMW Spartanburg 装配厂的商用试点，以及公开透明的 BotQ 制造指标（产能超过每小时 1
              台机器人）。能否弥合这一落地执行差距，是 Neura 捍卫其欧洲认知机器人领头羊地位的首要关卡。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 定价体系、打包模式与商业现实
        blocks:
          - type: paragraph
            body: >-
              具身智能的商业定价逻辑，折射出硬件物料清单（BOM）成本、目标客户工作流及软件变现模式的巨大分歧。在协作机器人领域，Universal Robots 树立了行业基准，单台硬件官方指导价在 $25,000 至
              $50,000 之间，若算上定制末端执行器、安全围栏及系统集成，总造价往往翻倍。反观中国机器人制造商 Unitree Robotics 则采取激进的价格破坏策略，将 G1 人形机器人起售价定在约
              $16,000，以抢占科研机构、开发者社群与教学实验室。Neura Robotics 主打高端工业客户，其认知协作机械臂与人形机器人平台的单台指导价、批量折扣以及 Neuraverse
              技能经常性订阅条款，皆属未公开的企业内部机密。缺乏透明的单机毛利与总体拥有成本（TCO）基准，使得评估客户回本周期以及面对低成本硬件同质化竞争时的长期毛利率防守能力，成为悬而未决的尽调硬约束。
            claimRefs:
              - CP008
              - CP009
              - CP010
