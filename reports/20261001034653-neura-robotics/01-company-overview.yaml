company:
  name: "Neura Robotics"
chapter:
  number: 1
  title: "Company Overview"
  summary: "NEURA Robotics is a Metzingen-based Physical AI company founded in 2019 by David Reger, with a broad cognitive-robotics portfolio and an ecosystem strategy centered on the Neuraverse. Its June 2026 Series C was announced at up to $1.4 billion and a reported valuation of about $7 billion, but the full amount is milestone-dependent and should not be treated as cash received."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      NEURA Robotics was founded in 2019 by David Reger and is headquartered in
      Metzingen, Germany [CO001, CO002]. The company describes itself as a
      full-stack Physical AI developer combining cognitive robots, sensors, edge
      computing, AI, and shared learning infrastructure through the Neuraverse
      [CO003]. Its reported portfolio spans collaborative robot arms, humanoids,
      autonomous mobile robots, and service assistants rather than a single
      hardware form factor [CO015]. The official careers site also describes
      modular NEURA Academy training for customers, integrators, and new team
      members on LARA and MAiRA [CO004]. This evidence supports a hardware-plus-
      platform model with enablement services, but it does not disclose pricing,
      recurring software economics, or the mix of product, service, and platform
      revenue.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "financing-and-scale"
    title: "Financing and Reported Scale"
    body: >-
      On June 10, 2026, NEURA announced a Series C with a total round size of up
      to $1.4 billion [CO005]. Independent reporting placed the valuation at
      approximately $7 billion while noting that the company did not confirm the
      figure [CO006]. More importantly, two independent reports say the full
      financing is contingent on undisclosed performance milestones, so the
      headline round size is neither proof of cash received nor a measure of
      current liquidity [CO007]. The company also says its orderbook and strategic
      deployment pipeline exceed $1 billion, but that company-issued metric is not
      revenue and the assigned evidence provides no conversion, cancellation, or
      collection data [CO009, CO016]. A third-party profile reports more than
      1,400 employees, yet the underlying reporting basis is not independently
      audited [CO011].
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and Governance Coverage"
    body: >-
      The assigned evidence consistently identifies David Reger as founder and
      chief executive, making his role the only current NEURA executive position
      that can be corroborated across company and independent sources [CO001].
      That does not establish that leadership is actually concentrated in one
      person; it establishes that the available public evidence is concentrated
      on him. None of the eight retained sources provides a complete current
      executive roster, supervisory-board composition, voting rights, founder
      ownership, or board seats attached to the latest financing. The financing
      announcement names a broad strategic investor group, but participation does
      not by itself establish governance control [CO008]. Leadership depth,
      succession, reserved matters, and investor rights therefore remain material
      diligence gaps rather than inferred weaknesses.
    claimRefs:
      - "CO001"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "milestones-and-diligence-frame"
    title: "Milestones and Diligence Frame"
    body: >-
      The evidence traces a progression from the 2019 founding through recorded
      Series A entries in 2021 and 2023, a EUR 120 million Series B in January
      2025, and the June 2026 Series C announcement [CO001, CO005, CO012, CO013].
      A specialist funding profile reports that the Neuraverse ecosystem launched
      at Automatica 2025, while the company now targets serial production at
      multi-million-robot scale by 2030 [CO014, CO010]. Historical events and
      forward targets are separated in the timeline because a production ambition
      is not an achieved shipment milestone. The assigned adverse search produced
      no retained result, which is not evidence that litigation, regulatory,
      safety, recall, outage, or governance incidents are absent. The adverse
      conclusion that is supportable is narrower: financing availability depends
      on undisclosed milestones, and commercial conversion remains unverified
      [CO007, CO009, CO016].
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
    figureRefs:
      - "FO001"
