    title: "Orderbook is not revenue"
    body: "NEURA says its orderbook and deployment pipeline exceed $1 billion, while the assigned evidence does not disclose audited revenue, profitability, order conversion, or collections [CO009, CO016]. The metric should remain company-claimed until customer-level evidence is reviewed."
    claimRefs:
