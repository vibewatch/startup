    body: "The announced Series C is up to $1.4 billion, and independent reports say full disbursement depends on undisclosed performance benchmarks [CO005, CO007]. Liquidity and runway therefore require tranche-level evidence."
    claimRefs:
      - "CO005"
      - "CO007"
