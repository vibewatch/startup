callouts:
  - calloutType: risk
    title: Announced financing is not cash available
    body: >-
      Public profiles describe the Series C as “up to” $1.4 billion and milestone-based. Underwriting should use funded cash, documented commitments, and tranche conditions rather than the headline amount.
    claimRefs:
      - CR007
      - CR008
  - calloutType: recommendation
    title: Gate scaled deployment on primary evidence
    body: >-
      Require product-specific safety files, incident records, partner contracts, integration milestones, and a reconciled financing schedule before treating public mitigation claims as mature controls.
    claimRefs:
      - CR003
      - CR006
      - CR011
      - CR016
