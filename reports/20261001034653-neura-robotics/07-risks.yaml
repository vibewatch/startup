company:
  name: Neura Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest-evidence risks are executional rather than proven legal events: NEURA is widening its product, acquisition, partner, and hiring footprint while financing is described as milestone-based. Public evidence does not establish certification coverage, incident history, cash burn, runway, customer concentration, or fully funded Series C proceeds, so those items remain diligence gates rather than assumed protections.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implications
    body: >-
      The leading risk is coordinated execution across a broad full-stack robotics portfolio, several acquired businesses, and a growing external-partner surface. NEURA presents cognitive robots, collaborative platforms, and AI assistants while also saying that key AI, controls, sensors, and mechanical components are developed internally. Independent summaries add acquisitions in mobile robots, automotive electronics, logistics, and cleaning systems. That breadth may create product and distribution optionality, but it also expands integration, quality, and capital requirements before public evidence establishes manufacturing yield or repeatable commercial economics. Financing is reported as up to $1.4 billion rather than a confirmed cash balance, and one independent profile describes milestone-based tranches. The investment implication is to condition conviction on tranche availability, integration ownership, independent safety evidence, and reconciled operating metrics rather than on announced scale alone.
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR008
      - CR012
      - CR013
      - CR015
      - CR016
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-legal-safety
    title: Regulatory, legal, safety, and data exposure
    body: >-
      The allocated evidence does not include a regulator record, court record, certification register, recall notice, or independent security assessment. That absence is not evidence that no incident or compliance issue exists. The company says robots are designed to work alongside people, and the healthcare platform is reported to move empty beds and sterile goods after validation against hospital layouts. Those facts make functional safety, deployment authorization, privacy, product liability, and change-control evidence decision-critical. Company posts also claim on-device processing and partner control over generated data, but no retained source tests those assurances or discloses contractual allocation of data rights. The appropriate mitigation is documentary: obtain product-specific conformity files, hazard analyses, incident and near-miss logs, penetration tests, insurance coverage, privacy terms, and jurisdiction-by-jurisdiction deployment approvals before underwriting scaled operation.
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR016
    tableRefs:
      - TR001
    figureRefs: []
  - id: operational-financial-execution
    title: Operational, financial, and organizational execution
    body: >-
      Public operating signals are internally difficult to reconcile. The company-authored LinkedIn description says more than 1,500 team members, while Tracxn reports 688 employees as of August 31, 2026; the sources may use different populations, dates, or inclusion rules, but neither supplies enough denominator detail to reconcile the gap. The careers site simultaneously recruits across functions from AI through Finance, indicating continuing organizational build-out without disclosing vacancies, payroll, attrition, or site allocation. Acquisitions from insolvency proceedings and the later addition of ACTIVE Shuttle and ADLATUS add integration surfaces, yet the pool contains no segment financials, restructuring provisions, manufacturing yields, warranty data, burn, or runway. Investors should require a legal-entity headcount bridge, integration scorecard, monthly cash plan, committed-versus-conditional financing schedule, and product-level quality dashboard.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
    tableRefs: []
    figureRefs: []
  - id: partner-dependencies-and-kill-criteria
    title: Partner dependencies, monitoring indicators, and kill criteria
    body: >-
      NEURA's architecture and routes to market include dependencies that must be tested contractually. Company posts identify Qualcomm processors in Smart Limbs; Wikipedia reports an AWS relationship for Neuraverse hosting and cloud-based training; and healthcare distribution is reported as robotics-as-a-service delivered through partners with undisclosed pricing. These relationships may accelerate commercialization, but the public record does not quantify supplier concentration, substitution costs, service-level obligations, customer ownership, or gross-margin sharing. Financing adds another dependency because “up to” proceeds and milestone-based tranches are not equivalent to cash available. Thesis-break indicators should include missed tranche availability, a material strategic-partner exit without a qualified substitute, absent independent safety validation before scaled human-adjacent deployment, or failure to reconcile acquired operations and workforce reporting. Each trigger should pause additional underwriting until primary documents close the gap.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR011
      - CR016
    tableRefs:
      - TR003
    figureRefs: []
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk area
      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Human-adjacent robot safety and conformity
        - Product- and deployment-specific
        - Company describes safe collaboration; no certification or regulator file was allocated
        - Unverified
        - High if evidence is absent
        - Not publicly evidenced
        - Injury, recall, deployment delay, or liability exposure
        - Obtain product-specific conformity files, hazard analyses, test reports, and incident logs
      - - Healthcare deployment, privacy, and workflow authorization
        - Hospitals and applicable local regimes
        - Empty-bed and sterile-goods scope is reported; approvals and privacy documentation are not
        - Unverified
        - High if deployment controls fail
        - Layout validation is reported
        - Operational disruption, data exposure, or blocked rollout
        - Review hospital approvals, data flows, DPIAs, SLAs, insurance, and pilot incident records
      - - Partner data rights and intellectual-property allocation
        - Neuraverse partners and customer sites
        - Company claims on-device processing and partner control; contracts and audits are unavailable
        - Unverified
        - Medium to high
        - Company-described architecture only
        - Disputes over training data, process know-how, access, or model outputs
        - Inspect DPAs, IP clauses, retention controls, access logs, and independent security tests
    notes: "Sample register limited to the allocated public sources; likelihood is marked unverified where no primary legal or regulatory record was available."
    enumerationScope:
      coverage: sample
      basis: Publicly evidenced regulatory and legal risk areas in the assigned source pool as of 2026-10-01.
    claimRefs:
      - CR003
      - CR005
      - CR006
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Full-stack portfolio and in-house component execution fragments engineering focus
        - Medium
        - High
        - Company claims broad internal capability
        - Schedule slippage, duplicated platforms, and quality variance
        - Product-level roadmap, staffing, yield, and reliability data
      - - Acquired businesses fail to integrate into one operating and technical model
        - Medium
        - High
        - Not publicly evidenced
        - Restructuring cost, delayed synergies, and management distraction
        - Integration owners, budgets, milestones, liabilities, and segment performance
      - - Human-adjacent deployment experiences a safety or reliability failure
        - Unverified
        - High
        - Company safety assertions and reported site validation
        - Recall, customer pause, liability, and reputational damage
        - Independent certifications, incident history, uptime, and failure-rate data
      - - Workforce scale is misread because public employee measures use different populations
        - High evidence of measurement conflict
        - Medium
        - No public reconciliation
        - Incorrect payroll, capacity, and integration assumptions
        - Legal-entity and site bridge from payroll to contractor and platform counts
    notes: "Analyst likelihood and severity labels are qualitative; they preserve the public evidence gaps and do not assert that a failure has occurred."
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Embedded compute
        - Qualcomm Technologies
        - Company says Dragonwing processors power Smart Limbs
        - Not disclosed
        - Component access, pricing, or roadmap changes delay products
        - High
        - Qualify alternates and document redesign lead times
        - Substitution cost and qualification schedule are unknown
      - - Neuraverse hosting and cloud training
        - Amazon Web Services
        - Reported hosting and cloud-training partner
        - Not disclosed
        - Cost, availability, policy, or strategic changes impair platform delivery
        - Medium to high
        - Test portability, edge continuity, backups, and exit rights
        - Workload mix, SLAs, and switching cost are unknown
      - - Healthcare integration and service delivery
        - Integration partners
        - Robotics-as-a-service deployment, maintenance, updates, and support
        - Not disclosed
        - Partner underperformance blocks deployments or erodes unit economics
        - High
        - Set service levels, step-in rights, pricing controls, and customer ownership
        - Partner economics, pricing, and pipeline conversion are undisclosed
      - - Growth financing
        - Series C investors
        - Up-to financing described as milestone-based tranches
        - Not disclosed
        - Missed milestones delay proceeds required for scaling
        - High
        - Maintain a tranche calendar, covenant headroom, and downside cash plan
        - Committed, funded, and conditional amounts are not publicly reconciled
    notes: "Dependency concentration is reported as not disclosed where the assigned sources provide no denominator, contract term, or substitution analysis."
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
