      - number: '1.5'
        title: 负面背景、监管与承销边界
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是 Galbot
              是否有意思，而是证据基础是否成熟到足以支撑其估值和战略叙事。公开报道支持强劲投资者需求、国家背书和可见试点，但公司仍未发布详细收入、毛利率、盈利能力或员工数指标，已审阅材料中也没有经审计财务包。因此，估值主要靠订单、部署、战略股东和对具身
              AI
              采用的预期来支撑。外部风险也真实存在。中国监管标准可能帮助人形机器人市场规范化，但医疗健康和零售部署会带来责任、安全与合规问题；与此同时，公司以中国为中心的资本和供应链暴露，在与全球知名汽车品牌合作时会产生地缘政治敏感性。投资者可以合理把
              Galbot 视作动能上的品类领导者，但在把隐含估值视为充分承销之前，仍需要更深的治理、经济性和法律韧性尽调。
