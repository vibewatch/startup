      - number: '6.4'
        title: 留存代理指标、扩张动作与渠道动态
        blocks:
          - type: paragraph
            body: >-
              Galbot 不披露 NRR、GRR、logo 留存、流失率或合同期限数据，客户黏性只能从结构性信号推断。最正面的代理指标是运营连续性：官方材料提到仓库 24/7
              使用超过一年，药房部署也在继续，说明至少部分客户没有在试点后撤掉机器人，而是把它们留在工作流里。第二个代理指标是战略绑定。CATL
              既是投资方又是客户，关系横跨资本、背书和工厂使用场景，可能加深锁定；但这种亲近也带来关联方风险。扩张动作看起来走三条渠道：直接向标杆工业和医疗客户做企业销售；借 Bosch 和 UAES
              进入制造业；自营零售业态，先验证自身经济性、积累数据，再把模板向外销售。药房从 10 多个点位推向 100
              多个点位的目标，也暗示了“先落地、再复制”的打法，只要每个已验证工作流能复制到更多地点。仍然缺失的是商业质量披露：公开信息没有说明续约时点、机队增购率、软件附加销售，或已安装基数中有多少是付费生产、有多少是补贴性的战略铺设。
