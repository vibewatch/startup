  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              评估 Galbot 的正确起点是当前融资标记，而不是传统的贴现现金流。公开证据给出一个强头条：2026 年 3 月，以约 $3 billion 估值融资超过 $300
              million；此前融资看起来已把累计资本推到 $1.15 billion 以上。这足以把 Galbot
              视为资本最充足的中国人形机器人公司之一，但不足以说明当前价格显然公允。公开来源仍未披露经审计收入、毛利率、烧钱速度，或决定头条投后估值能否转化为有吸引力普通股入场价格的详细股权结构。因此，入场纪律比品类热度更重要。新投资者应假设，结构、集中度和商业化时点至少与市场规模叙事同样重要。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV015
              - CV030
              - CV035
