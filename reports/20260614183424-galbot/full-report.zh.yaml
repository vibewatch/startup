      - number: '7.3'
        title: 运营可靠性与产品化风险
        blocks:
          - type: paragraph
            body: >-
              运营风险仍是亮眼原型叙事和韧性业务之间最大的桥。公开来源支持一个判断：人形机器人系统正在快速变好；但这些来源也显示，买方要看到可重复节省，前面必须有太多环节不出错。工厂部署需要极高准确率和正常运行时间，而具身
              AI 的错误不会只是悄悄拉低仪表盘指标，可能直接变成物理事故。Deloitte 关于物理 AI
              的警告在这里比在纯软件里更关键，因为幻觉和感知错误会让执行器在人周围移动。电池完整性、触觉感知和网络加固又增加更多层。TechXplore 和 Associated Press
              的报道同样有价值，因为它们把当下商业瓶颈框定为需求与信任，而不是原始生产速度；这正是那种在大量资本花掉之后才会暴露的风险。
            claimRefs:
