            body: >-
              Galbot
              的护城河不是经典软件网络效应，而是一组运营包：数据集深度、现场集成、客户工作流调校和采购通道入口。客户一旦在真实门店、医院或工厂验证部署，这能形成有意义的切换成本，但并不意味着多供应商并行不可能。如果人形本体逐渐收敛到相似
              VLA 架构和任务 API，客户可能同时测试不止一家供应商，再按可靠性、支持质量和经济性分配任务。因此，分销变得异常重要。Galbot
              的国家背景投资者组合以及与工业冠军的关系，可能改善其进入中国试点项目、建立采购可信度和获得伙伴引荐的能力，这些是小型纯风险资本创业公司难以匹配的。但不对称也有反面：XPENG
              或其他大型制造商这类拥有汽车或电子供应链的既有玩家，如果人形品类变得更由规模驱动而非模型驱动，可能在制造杠杆上追平甚至超过 Galbot。
