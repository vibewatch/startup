        title: 具名客户证据与证据质量
        blocks:
          - type: paragraph
            body: >-
              当 Galbot 或高可信融资报道明确把客户 logo 与真实工作流相连时，具名客户证据最强。CATL 是最清晰的工业锚点，因为它被描述为领投方和客户，并且关系中包含工厂常规运营和大规模累计订单。Xuanwu
              Hospital 是最清晰的医疗健康锚点，因为公司公开把病房、药房和医院导诊纳入这项合作。BAIC、SAIC 和 Toyota 是有意义的
              logo，但证据权重并不相同；它们主要出现在融资或画像报道中，被列为具名下单或对齐的工业客户，而非深度案例研究。Mercedes-Benz 和 Zeekr 出现在 TechNode
              关于本地工厂轮式机器人的报道中，但缺少详细运营说明。Bosch 和 UAES 最适合被视为混合伙伴-客户通道：合资合作验证了市场需求和工厂入口，但公开材料尚未证明这些实体已形成常态化机队采购。零售证据很特殊，因为
              Galbot 自有门店既是部署证据，也是部分自运营渠道；这改善了运营反馈闭环，但在集中度分析上弱于独立客户 logo。
