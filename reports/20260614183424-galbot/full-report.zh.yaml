  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与公开足迹
        blocks:
          - type: paragraph
            body: >-
              与其用经典 SaaS 客户列表理解 Galbot，不如用买方、用户和付款方角色来拆。工业制造中，买方和付款方是大型企业或战略伙伴，例如 CATL、Bosch 关联实体、BAIC、SAIC、Toyota 相关客户和
              UAES；日常用户是工厂操作员、生产团队和自动化工程师。医疗健康中，医院或药房运营商是买方，药剂师和支持人员是用户，直接运营受益者是患者工作流。零售中，Galbot 通过 Galbot Store 和
              Galaxy Space Capsule
              式自主便利业态，部分扮演自己的标杆客户，在一些点位既是供应商也是运营方。公开证据显示，所有垂直领域都集中在中国：具名部署、国家背书报道、监管语境和城市级铺设引用都以中国为中心。这给了 Galbot
              一条连贯的本土市场切入点，但也意味着当前客户基础在地理和政策制度上比垂直列表乍看起来更集中。
            claimRefs:
