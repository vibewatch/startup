      - number: '1.2'
        title: 创始人、领导层集中度与机构网络
        blocks:
          - type: paragraph
            body: >-
              创始人集中度既是 Galbot 最大优势之一，也是最清晰的风险之一。公开材料把公司归于 He Wang 和 Zhang Zhizheng，这两位创始人在官方与媒体报道中仍是主要具名运营者。集中度之所以重要，是因为
              Galbot 的产品故事取决于高速整合机器人、具身 AI 数据和垂直部署关系的能力；反过来，外部观察者也难看清管理层冗余或接班安排。公司伙伴页面和第三方报道提供了一些安慰：Galbot 与 Peking
              University、BAAI、Xuanwu Hospital
              等重要研究和临床机构，以及工业和汽车利益方都有联系。即便如此，公开记录对独立董事构成、正式治理和创始人之外的高管厚度仍着墨很少。从尽调角度看，Galbot
              机构连接强、技术可信，但仍高度创始人主导，关键人物依赖被放大。
