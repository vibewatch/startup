      - number: '8.5'
        title: 建议、退出逻辑与最终尽调
        blocks:
          - type: paragraph
            body: >-
              本章结论是继续研究。这不是否定 Galbot 的战略位置，而是判断当前公开记录仍留下太多未解问题，无法把 $3 billion
              标记称为有吸引力。公司有真实优势，包括资本厚度、可信的本土市场位置和可见部署；但缺失项正是入场质量最关键的部分：经审计经济性、股权结构条款、交易对手集中度、出货真实性数据集和详细合规姿态。合理持有期是四到六年，因为商业化成熟度和
              IPO
              准备大概率滞后于融资故事。建立信念的最佳路径不是更多叙事，而是更窄、更硬的证据。如果经审计财务、重复客户扩张、更干净的集中度调整后单位经济性出现，估值立场可能从偏贵走向公允。在那之前，最终尽调应承担大部分工作。
