      - number: '2.4'
        title: 增长驱动因素与为什么中国先重要
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动因素在中国比多数其他市场更早汇合。政策支持很明确，从标准化工作到地方产业基金，再到把具身 AI
              视为战略产业。供应链深度同样重要：随着零部件生态、电池、执行器和制造能力提升，单位经济性应当下降，商业化也会更少依赖展示性试点。TrendForce 认为 2026
              年下半年是市场重心从基础能力转向用户价值的节点，这与 IDC 式证据一致：出货量已经大到足以形成真实装机基础。需求侧拉力也在上升，来自老龄化、劳动力短缺，以及制造、物流和服务工作流中的企业自动化兴趣。对
              Galbot 来说，中国不只是方便的本土市场；它是技术进步、政策支持和买方试验最早同时发生的大型地理市场。
            claimRefs:
              - CM009
