              Galbot 的融资轨迹是本章最强的外部验证点。公司早期资本路径据称从 2023 年 6 月种子轮开始，随后在当年完成天使轮和天使+轮，2024 年 3 月又完成数亿元人民币融资。到 2025
              年中，多家媒体描述了一笔约人民币 11 亿元或约 $151-153M 的融资，并与 CATL 关联资本和 Bosch 相关战略合作挂钩。2025 年底融资节奏再次加快，公司关联和独立报道均称其新增融资超过
              $300M，估值约 $3B，累计融资约 $800M。2026 年 3 月，国家背景投资者据称又领投人民币 25 亿元融资，把 Galbot
              从纯风险资本背书推入国家战略资本通道。这套资本栈很亮眼，但估值逻辑仍重度依赖预期，因为收入、利润率和员工数仍未向公众详细披露。
