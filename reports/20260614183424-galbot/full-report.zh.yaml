      - number: '5.2'
        title: 硬件平台与运行架构
        blocks:
          - type: paragraph
            body: >-
              Galbot 官方材料给出了异常具体的 G1 硬件边界。平台标准姿态高 1730 mm，躯干可升降 650 mm，垂直工作空间覆盖 0–2100 mm，手臂长 710 mm、臂展约 190
              cm，可覆盖标准人类腰部上下的货架和柜台。双臂载荷列为 5 kg，足够搬运药盘、零食袋、瓶子和轻型工业零件，而非重型制造负载。电力来自 48V 30Ah 锂电池，宣称最长运行 10 小时，并配套
              WiFi、Ethernet、USB 和云集成，用于机队监督。最影响部署经济性的设计选择是轮足移动结构：Galbot 似乎在优化稳定室内导航和更长续航，同时通过躯干升降和长臂几何保留人类空间触达能力。6.25
              英寸触摸屏提供本地操作员交互，多模态视觉、触觉和深度感知则支撑硬件之上的具身控制栈。仍有一个规格冲突：官方套件引用约 92.5 kg 机身重量，而二级评测有时引用 85 kg。
