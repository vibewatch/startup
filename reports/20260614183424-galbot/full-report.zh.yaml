      - number: '7.5'
        title: 缓释因素、监测项与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Galbot
              并非没有保护。全栈架构可以降低产品最战略部分对外部供应商的依赖；国资背景投资者，加上工业、零售和医疗场景中的参考部署，也比许多更早期人形机器人创业公司打下了更强基础。监管框架也有有利的一体两面：清晰标准和数字身份工作流一旦内化，资本更充足的供应商可能受益于小竞争对手跨不过去的门槛。但这些缓释因素抹不掉核心尽调问题。投资者仍需要证据证明：合规工作流已经可运营；CATL
              集中度没有压倒性；正常运行时间和服务成本能支撑替代劳动力叙事；一场严重现场事故不会级联成召回和融资问题。因此，正确姿态是带监测的信念，而不是一概怀疑。
