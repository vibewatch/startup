      - number: '2.5'
        title: 约束、监管与剩余不确定性
        blocks:
          - type: paragraph
            body: >-
              市场大到值得重视，但也仍不成熟，标题式 TAM
              容易遮住运营风险。高单价和资本强度让许多部署停留在试点阶段。更重要的是，行业仍卡在任务泛化、真实世界数据收集、灵巧操作、安全验证以及接入客户工作流等问题上。这些不是表面问题；它们正是决定需求能否跟上当前制造产能建设速度的因素。监管影响双向。中国
              2026 年 3 月标准和 2026 年 5 月数字 ID 制度，可能通过改善可追溯性和召回纪律来降低买方犹豫，但也抬高合规预期。关于 Galbot
              自身可获得份额的公开证据仍不完整：公司披露了订单和目标行业，却没有足够独立数据说明各细分的转化、利用率或留存。因此，投资者应把当前市场证据视为足以证明值得关注，但噪音仍太大，无法在没有额外尽调的情况下支撑单一精确的
              TAM-to-SOM 桥。
