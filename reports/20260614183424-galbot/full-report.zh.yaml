          - type: callout
            title: 估值折价既是警告，也是机会
            body: Galbot 的 $3B 基准与 Figure 的 $39B 形成对比，显示资本市场对中国人形机器人公司的折价有多剧烈；这既可能反映执行被低估，也可能是对较低透明度和变现证据不足的理性惩罚。
