  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Galbot 的相关市场比“所有机器人”窄，也比“人形硬件出货”宽。实际边界是部署到物理工作流中的企业级人形系统，以及让这些系统真正有用所需的具身 AI
              软件、训练数据、集成和服务。因此，本章纳入工业制造、仓储物流、零售服务和医疗健康部署，因为这些细分领域反复出现在当前市场报道和 Galbot
              自身商业化口径中。除非人形形态是买方用例的核心，否则通用工业自动化、AGV、协作机器人和纯软件 AI
              类别不纳入。由此，现状竞争不只是其他人形机器人创业公司，还包括人工、固定自动化、特定工作流机器人和被推迟的自动化支出。这个定义很重要：一个万亿美元级广义 TAM 可以方向上成立，却仍可能夸大 Galbot
              近期可服务市场。
