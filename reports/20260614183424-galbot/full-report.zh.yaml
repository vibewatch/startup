      - number: '8.2'
        title: 投资论点：为什么 Galbot 仍可能重要
        blocks:
          - type: paragraph
            body: >-
              Galbot 的多头逻辑相当强。中国正在成为人形机器人制造和出货规模中心，这会给能整合软件、硬件和客户入口的公司带来自然本土优势。Galbot 自身定位与这个机会一致。公司声称拥有全栈具身 AI
              架构、大量自有数据资产和多层模型，而不是只有一台演示机器人。工业、零售和医疗场景中的公开部署证据也说明 Galbot 已越过纯原型阶段。再加上国资背景投资者、高知名度创始人和 CATL
              相关工业验证，公司有理由主张，自己正在搭建通向中国企业采用人形机器人的内侧通道。如果这些要素在未来两到三年转化为可衡量的重复收入，当前估值最终可能比今天看起来更站得住。
            claimRefs:
