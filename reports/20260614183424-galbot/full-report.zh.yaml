companyProfile:
  summary: >
    Galbot（Beijing Galbot AI Co., Ltd.）是一家北京具身人工智能公司，2023 年 5 月 19 日由 He Wang（一位 Stanford 训练背景的 Peking University AI
    教授）和 Zhang Zhizheng 创立。公司打造 G1，这是一款采用轮足混合移动结构的通用人形机器人，同时自研完整技术栈——数据集（100 亿+
    数据点）、具身基础模型（GraspVLA、TrackVLA、GroceryVLA）和机器人硬件。Galbot 已将 G1 部署到工业制造（CATL、Mercedes-Benz、Zeekr）、智慧零售（Galbot Store、30+
    城市）和医疗健康（Xuanwu Hospital、北京药房）。公司累计融资超过 $1.15B，其中包括 2026 年 3 月由国家背景资金参与的人民币 25 亿元融资；截至 2025 年 12 月，Galbot 估值
    $3B，巩固了中国估值最高未上市人形机器人公司的位置。
  foundedDate: '2023-05-19'
  founders:
    - name: He Wang
      role: 创始人兼 CEO
      background: Stanford 计算机科学 / 机器人学博士；Peking University 助理教授；具身 AI 与灵巧操作专家。
