  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入与单位 P&L
        - 季度收入、毛利率、支持成本和现金消耗
        - 估值纪律取决于证明业务本身，而不只是证明品类。
        - 与管理层和审计师做财务尽调。
      - - CATL 合同结构
        - 期限、定价、排他性和终止权
        - 客户集中会同时扭曲上行和下行。
        - 审查已签协议的商业与法律条款。
      - - 交付真实底表
        - 各站点实际出货与已宣布部署的对照
        - 投资逻辑需要真实规模，而不只是高曝光试点。
        - 运营尽调加客户访谈。
      - - 毛利率结构
        - 硬件毛利与软件或服务贡献
        - 决定规模会提升价值，还是只放大支持负担。
        - 财务与产品尽调。
      - - 员工数与烧钱速度
        - 按职能划分的员工数和月度现金消耗
        - 用于判断现金跑道和未来稀释压力。
        - HR 与 CFO 尽调。
      - - IP 与隐私状态
        - 专利地图、FTO 意见、医疗隐私控制
        - 两者若薄弱，都可能制造不易察觉的下行。
        - 法务与安全尽调。
    notes: 把一个具备战略吸引力的私募轮次转化为可完整承销的投资决策，这些问题是最低证据包。
    claimRefs:
      - CV011
      - CV015
      - CV018
      - CV019
      - CV030
      - CV038
