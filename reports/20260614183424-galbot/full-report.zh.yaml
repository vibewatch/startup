      - number: '7.4'
        title: 伙伴依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              公司最强的外部证明点，也同时是集中度风险。CATL 给了 Galbot 一个有分量的工业参考客户和融资信号，但也把需求可信度和投资者信心集中到一段关系上。Bosch 相关合作、国资背景资本和 NVIDIA
              相关工具，让公司看起来战略连接紧密；但一旦条款变化、政治风向转变或平台访问收紧，每条关系都会压缩自由度。财务上，公司仍难以干净承销，因为公开证据给出了估值和融资数字，却没有可比的收入、烧钱速度或支持成本披露。这种组合会制造一个具体下行情形：如果买方需求比头条部署集合所暗示的更窄，Galbot
              仍可能显得很突出，却需要在不确定条款下继续融资。因此，Galbot 的 $3 billion 估值与美国同行 Figure 更高标记之间的差距，应部分理解为风险折价，而不只是可选上行。
