  - id: TE002
    title: AI / 软件栈
    columns:
      - 组件
      - 描述
      - 宣称能力
      - 差异化
      - 证据质量
    rows:
      - - GraspVLA
        - 端到端具身抓取基础模型
        - 无需额外训练即可 zero-shot 泛化到新物体和新任务
        - 把大规模仿真预训练与自有机器人执行闭环配在一起
        - 中高：官方和行业媒体相互印证，但没有公开 benchmark 套件
      - - TrackVLA
        - 导航和目标跟踪模型
        - 跟随人或物，接受语音指令，遮挡后恢复跟踪
        - 在复杂空间里把移动能力和意图跟随接起来
        - 中：公司材料有描述，但外部技术细节有限
      - - GroceryVLA
        - 零售专用操控模型
        - 无需逐件重编程即可处理柔性、刚性和易碎商品
        - 针对真实门店库存做垂直专门化，而非泛化机器人 demo
        - 中高：官方描述和部署报道支撑
      - - Brain-cerebellum-neural control architecture（脑-小脑-神经控制架构）
        - 感知、决策、控制一体化栈
        - 把多模态输入转成低延迟动作闭环
        - 相比传统模块化机器人栈，声称端到端控制程度更高
        - 中：架构停留在营销层描述，没有系统论文
      - - 开发者平台
        - 公开开发者门户和手册
        - 提供集成和二次开发界面
        - 表明 Galbot 想做伙伴可扩展性，而不是只卖封闭设备
        - 中：门户存在是公开事实，API 深度仍不清晰
      - - Sim2Real 数据引擎
        - 合成预训练加少量真实世界微调
        - 减少人工重标注，加快迁移到新场景
        - 若仿真质量足够高，可能形成数据飞轮优势
        - 中高：有独立报道，但未 benchmark
    notes: 证据质量取决于每项声明有多少一手技术细节支撑、多少来自二级报道。目前没有公开 benchmark 仓库或可复现实验框架评估这些模型。
