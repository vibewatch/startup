  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与真正重要的玩家
        blocks:
          - type: paragraph
            body: >-
              评估 Galbot，不能只对标一小撮知名人形机器人品牌。真实格局包括直接的全栈人形机器人同行、车企背景或上市公司入局者、可能抽象掉硬件差异的模型层竞争者、固定自动化和人工零售 /
              工厂劳动力等替代品，以及可借汽车或电子生态供应链规模进入的理论新玩家。在直接具身 AI 竞争中，AgiBot 和 Unitree 因当前中国出货证据最重要，Figure
              因资本强度和全球叙事能力最重要，Physical Intelligence 则重要在于：如果通用机器人基础模型能跨硬件移植，它可能在模型层压缩产品差异化。相邻压力来自 XPENG、UBTech、Boston
              Dynamics 和 1X，它们分别进攻工业、商业或家庭机器人不同切片。实际的现状替代品仍是人工加特定任务自动化，这让买方审查聚焦可靠性和劳动力替代，而不是单纯奖励人形新奇感。
