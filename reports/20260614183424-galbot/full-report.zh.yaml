  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与确认问题
        blocks:
          - type: paragraph
            body: >-
              虽然 Galbot 没有发布完整财务拆分，但其公开商业故事暗示了几条收入流。最可见的是 G1
              平台硬件销售，不过这些销售很可能与集成工作、部署配置和支持承诺绑定，模糊了设备收入与实施服务之间的边界。第二条收入流出现在零售和药房运营中，Galbot Store
              和药房部署说明其更像运营商或托管服务模式，而不是一次性产品销售。与 CATL、Mercedes-Benz 和 Bosch
              相关伙伴的工业项目，意味着更大的企业合同和更长验收周期；医疗健康部署则带来服务质量和可靠性义务，可能让收入确认时点更复杂。同样重要的是缺失项：Galbot 未披露
              ASP、合同期限、门店经济性是否基于收入分成，或软件 / 模型授权是否与硬件分开入账。因此，收入模型的形状可读，但真实组合和会计处理仍不透明。
