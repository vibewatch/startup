      - number: '2.3'
        title: 买方分层、预算所有者与 Galbot 相关性
        blocks:
          - type: paragraph
            body: >-
              最可信的近期买方，是拥有重复性物理工作流、且面临劳动力短缺或强烈自动化试验意愿的企业。工业制造是最清晰的滩头阵地：工作流结构化，安全边界可管理，预算通常在工厂运营、工业工程或自动化团队手里。仓储物流类似，但
              ROI 审查更严，因为买方已经会拿人形机器人与输送线、AMR
              和其他专用系统比较。零售和服务部署能制造可见证据，但许多仍属于品牌或体验预算，而非硬生产力预算。医疗健康和养老长期拉力很强，因为人口老龄化是结构性需求驱动，但认证、责任和工作流敏感性会让规模化更慢。Galbot
              公开的工业制造、零售和医疗健康部署说明，它真正的近期市场是逐个垂直行业推进的企业采用路径，而不是泛泛的消费机器人故事。
