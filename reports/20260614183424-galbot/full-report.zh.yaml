      - number: '4.6'
        title: 财务结论与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Galbot 的财务图景是强资产负债表代理指标与弱披露质量的组合。多头案例很直接：公司融到足够重要的钱，在多个垂直领域有可信部署案例，并且看起来是在战略支持而非绝望中为制造和具身 AI
              研发供血。空头案例同样清楚：投资者还无法验证收入、毛利率、烧钱、回本、客户集中度，甚至无法看清硬件、服务和运营商收入之间的拆分。这一点很关键，因为该品类已经面临真实买方需求质疑，并且相较 Figure
              等美国同行存在严重估值差。财务结论因此是：资本充足性谨慎正面，透明度中性偏负，收入质量未解决。核心尽调要求不是再看一个愿景演示，而是一条带日期的财务桥：从订单到已交付单元再到已确认收入，并按业务线披露利润率和现金消耗。
            claimRefs:
              - CI026
              - CI030
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
              - CI036
      - number: '4.7'
        title: 图表
        blocks:
          - type: callout
            title: 资本不是眼前瓶颈
            body: 2026 年 3 月融资后，Galbot 看起来有足够资本继续扩大模型、制造和部署，近期没有明显融资悬崖。
            calloutType: strength
            claimRefs:
