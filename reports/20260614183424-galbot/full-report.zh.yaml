      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              监管图景对 Galbot 异常重要，因为中国政府不只是旁观人形机器人，而是在围绕它们建立可执行框架。2026 年 3 月国家标准体系和 2026 年 5 月数字 ID
              制度，让人形机器人更接近一个受治理的工业产品类别；这有利于长期市场发展，但会让准备不足的供应商付出高成本。法律风险比合规清单更宽。Hill Dickinson
              的分析有说服力，因为它把责任、隐私和问责视为未解问题，即使在完全自主到来之前也是如此。如果机器人在药房或医院弄伤员工、误识别人、误处理敏感数据，责任可能横跨制造商、运营方和软件栈。也就是说，一起重大事故可以同时触发商业犹豫、监管审查和直接成本。
            claimRefs:
