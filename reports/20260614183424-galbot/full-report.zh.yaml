  productSummary: >
    Galbot G1 是一款通用人形机器人（轮足混合，标准姿态 173 cm，约 92.5 kg，IP54，48V 30Ah 电池，10 小时运行时间），由端到端具身 AI 平台驱动。G1
    服务于工业装配与物流、自主零售门店运营（Galbot Store）和医疗健康辅助（药房发药、医院导诊）。
  customerFocus: |
    企业客户集中在工业制造（汽车、电池、电子）、智慧零售运营商和医院 / 医疗健康机构，目前重点放在中国市场部署。
  businessModel: |
    硬件整机销售和企业部署合同（工业、医疗健康）；通过 Galbot Store 开展自主零售运营（可能采用收入分成或 RaaS）；潜在的软件 / AI 模型授权。公司未公开披露收入。
  stage: Series C-equivalent private
