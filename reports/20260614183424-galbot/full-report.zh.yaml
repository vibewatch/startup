        - 当前
        - 让许多部署停留在试点或展示阶段
        - 按垂直行业和任务询问回本周期
      - - 任务泛化受限
        - 约束
        - 当前
        - 把机器人限制在狭窄、脚本化的工作流里
        - 要求提供跨场地、跨任务迁移证据
