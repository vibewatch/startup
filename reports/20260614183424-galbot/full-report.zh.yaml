    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立版图与当前产品位置
        blocks:
          - type: paragraph
            body: >-
              Galbot 的公开身份比许多快速崛起的机器人创业公司更清楚。公司把自己定义为一家具身 AI 机器人公司，2023 年 5
              月创立于北京；核心叙事不是把人形或移动操作机器人停留在实验室演示，而是让它们进入真实商业环境。官方页面指向北京总部，也显示其研发版图延伸到深圳、苏州和香港；这符合一家试图同时拼前沿模型、硬件集成和商业部署支持的公司画像。旗舰
              G1 平台面向工业、零售和医疗健康工作流，开发者门户和应用套件也表明 Galbot 想围绕机器人搭软件和生态层，而不是把它当作一次性硬件展示。结果是，Galbot
              更像一套全栈商业化工程，而非单纯研究项目；不过不少产品和财务细节仍来自公司自控渠道。
