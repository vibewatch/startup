        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从资本充足性看，Galbot 按私营创业公司标准很强。融资路径从未披露金额的 2023 年种子轮和天使轮，升级到 2025 年 6 月人民币 11 亿元机构轮，再到 2025 年 12 月估值 $3B、金额超过
              $300M 的融资，随后是 2026 年 3 月人民币 25 亿元融资，使累计披露资本达到约 $1.15B+。这个资本规模应能给 Galbot
              留出有意义空间，用于扩大制造、商业部署和模型训练，短期不至于碰到融资悬崖。两个但书是烧钱和融资依赖。烧钱速度未披露；对一家研发和现场运营都很重的人形机器人公司来说，消耗可能相当大。融资依赖也不仅是数字问题，而是战略问题：Galbot
              因国家和产业资本已经入局，看起来比许多创业公司暴露更低；但同一支持也可能把预期锁向国内战略目标。总体看，资本充足性不错，但在现金和烧钱披露前，跑道仍只能估算。
