      - number: '5.3'
        title: AI 栈、数据引擎与开发者界面
        blocks:
          - type: paragraph
            body: >-
              Galbot 的软件故事围绕垂直化视觉-语言-动作模型展开，而不是单一通用基础模型。GraspVLA 被定位为核心具身抓取模型，训练基础是数十亿次模拟交互，并由 DexGraspNet
              规模抓取数据支撑；商业承诺是对未见过的物体和任务实现零样本处理。TrackVLA 把技术栈延伸到导航和跟随行为：通过视觉跟踪人或物体、接受语音指令，并在目标短暂丢失后重新捕获。GroceryVLA
              则把抽象收窄到零售操作，声称可在杂乱门店中处理可变形零食袋、刚性瓶子和易碎罐子，无需逐 SKU 重新编程。跨这些模块，Galbot
              描述了一套“大脑-小脑-神经控制”架构，把感知、决策和低延迟反馈控制压缩进比传统机器人栈更端到端的管线。数据护城河主张建立在 100 亿+ 数据点和 Sim2Real
              闭环之上；该闭环大量依赖合成数据生成，据称使用 NVIDIA Isaac Sim，随后进行有限真实世界微调。公开开发者平台说明真实集成界面存在，但公开文档仍比全球领先具身 AI 同行更薄。
