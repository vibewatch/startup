  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >-
              Galbot
              的风险画像并非由某一个生死缺陷主导。公司融资可信、部署可见，又站在国家市场顺风上；但这些正面因素也会遮住一个事实：人形机器人经济性要真正站稳，许多依赖项必须同时跑通。最严重的风险落在政策、商业化和集中度的交叉处。中国的标准体系和数字
              ID 制度长期可能帮助可信供应商，但短期会制造具体的合规关口和召回义务。与此同时，公开报道仍显示，赢下买方比造出机器人更难，因此即使技术演示好看，规模假设也可能落空。再叠加 CATL
              集中度、硬件资本强度高、收入指标不披露，下行情形就是累积式的，而不是孤立风险。
