      - number: '8.4'
        title: 可比公司组与情景区间
        blocks:
          - type: paragraph
            body: >-
              Galbot 需要一个混合估值框架。一端，Figure AI 官方 $39 billion Series C
              显示，全球资本市场仍愿意给感知中的品类领导者分配多大资本。另一端，中国同行和上市公司可比对象显示，定价压力、市场折价和披露差异可以很快压缩这种乐观。因此，情景框架比单点估计更重要。多头情形假设 Galbot
              成为清晰的国内工业领导者，拥有真实收入规模和更丰富的战略可选性。基准情形假设公司取得有意义进展，但集中度、披露和政策风险仍带来折价。空头情形假设商业化滑坡，或集中度和监管显著削弱未来融资杠杆。这些区间很宽，但宽度反映现实：今天的公开证据对方向的支持强于对精度的支持。
