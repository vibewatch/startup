      - number: '6.2'
        title: 采用轨迹与部署台账
        blocks:
          - type: paragraph
            body: >-
              Galbot 的采用轨迹通过部署数量可见，而不是通过已披露收入或 cohort 指标可见。最重要的商业信号是 2025 年 12 月融资稿称，来自 CATL、Toyota 和 BAIC Group
              领衔工业客户的累计订单达到数千台。这个说法足够大，意味着真实管线，而不是少数试点；不过约束性订单、框架协议和分阶段铺设的组合并未公开。零售方面，公司称 Galbot Store 到 2025 年底已扩展至 30
              多个城市，之后报道又指出到 2026 年 3 月，20 多个城市已有 100 多台。医疗健康方面，北京至少 10 家药房投入运营，并引用了 99.5% 药品处理成功率和 24/7
              运行。仓储又提供了另一个耐久性代理指标：官方融资表述称已稳定全天候运行超过一年。合在一起，这些信号显示公司正从展示性安装走向可重复部署模板；但公开采用情况仍需谨慎解读，因为 Galbot
              没有披露利用率、单机器人经常性收入，或从试点转向扩展机队的转化。
