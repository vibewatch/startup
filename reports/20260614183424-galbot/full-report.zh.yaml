      - number: '5.4'
        title: 部署成熟度、可靠性与支持信号
        blocks:
          - type: paragraph
            body: >-
              公开部署证据显示 Galbot 已走出实验室演示，但还没有发布能证明工厂级可靠性的机队运营台账。最强量化证据来自医疗健康：北京药房部署的媒体报道提到 10 多个运营点、24/7 运行模式和 99.5%
              药品处理成功率；零售报道则称单台 G1 可自主运营 50 平方米门店，铺设目标扩展到 100 多个药房或门店点位。这些是有用的成熟度信号，因为它们意味着机器人反复接入有货架、SKU
              和员工工作流的真实环境。工业成熟度更像有潜力，而非已被证明。Bosch 和 UAES 合资公告表明，流程制造和汽车伙伴认真看待
              Galbot，但公开文件仍未发布产线级吞吐、MTBF、恢复时间或服务人员配比。竞争含义是，Galbot 今天在半结构化室内运营中看起来可信；但 99.9%+
              工业准确率的路线图可信度，仍取决于围绕正常运行时间、异常处理和部署支持工具的私下尽调。
