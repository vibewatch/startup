      - number: '2.2'
        title: 多视角测算与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              已发布的市场数字分歧很大，因为它们衡量的东西不同。基于 IDC 的报道描述了 2025 年已实现硬件市场：约 18,000 台、约 $440M
              收入，这锚定了商业化仍处早期的现实。MarketsandMarkets 和 SkyQuest 给出更宽的人形机器人品类前瞻收入预测，而 People's Daily 引用的具身 AI 预测范围更宽。Morgan
              Stanley 和 UBS 把时间线拉到 2050 年，并把机会描述为数万亿美元级，但这些长期 TAM 视角情景假设很重，不能当作近期市场出清需求。中国本土规模也不确定：CCID 相关报道称国内人形市场到
              2026 年可能超过人民币 200 亿元，但公开方法论比标题更薄。尽调结论不该是一项估计正确、其他都错误；正确结论是，Galbot 的可触达市场会随着视角从硬件收入、全栈人形系统扩展到更广义具身 AI
              栈而急剧放大。
