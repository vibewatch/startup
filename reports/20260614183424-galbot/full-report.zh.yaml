        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Galbot 的 GTM
              看起来由企业销售和标杆客户驱动，而非自助式增长。公开牵引力体现在具名部署、战略投资者关系，以及工厂、医院和零售环境中的类案例叙事，这意味着高接触销售、更长试点和比软件式产品驱动增长更复杂的实施。大工业和医疗健康
              logo 能建立信任和可复制性，这是优势；但销售效率只能从代理指标推断。公开证据显示 Galbot 围绕劳动力替代或吞吐经济性优化：据称一台机器人可以运营 50
              平方米门店，并在三年内替代三个班次劳动力；医院药房工作流则引用 99.5% 处理成功率。这些数据点支持价值创造，却没有披露 CAC、回本周期、留存或扩张。GTM 含义是，Galbot 可能赢下高 ACV
              客户，但投资者仍缺少判断获客是否高效、可重复且资本足够轻的指标，无法据此完全支撑当前融资规模。
