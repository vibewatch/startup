    title: G1 硬件规格
    columns:
      - 参数
      - 数值
      - 备注
      - 对比背景
    rows:
      - - 高度（标准姿态）
        - 1730 mm
        - 官方产品 bundle 和产品页都指向约 173 cm 站立高度。
        - 人形尺度服务机器人，尺寸适配标准货架和柜台。
      - - 躯干升降
        - 650 mm
        - 大行程躯干升降扩大了高低货架触达，不改变底盘占地。
        - 室内零售和药房工作更看重这一点，而不是腿部表现力。
      - - 臂长
        - 710 mm
        - 官方 bundle 已披露。
        - 长臂双臂几何弥补了稳定轮式底盘的触达不足。
      - - 垂直工作空间
        - 0–2100 mm
        - 官方 bundle 给出标准范围，并称部分姿态可触达更高位置。
        - 覆盖地面料箱到高位零售货架。
      - - 双臂负载
        - 5 kg
        - 负载看起来针对物品搬运，而非重型装配。
        - 适合 SKU、托盘、瓶装物和轻型零件。
      - - 电池
        - 48V 30Ah 锂电池
        - 电池规格来自官方；循环寿命和热插拔设计未披露。
        - 支撑最长 10 小时的标称运行时间。
      - - 运行时长
        - 最长 10 小时
        - 公司宣称的续航；未披露 duty-cycle 假设。
        - 单班次室内运营具备竞争力。
      - - 防护等级
        - IP54
        - 仅提供基础防尘和防溅水能力。
        - 低于更严苛工业或临床清洁制度常要求的认证深度。
      - - 传感器
        - 视觉、触觉、深度
        - 模态已经公开，但传感器供应商和冗余层未披露。
        - 足以支撑抓取、跟踪和避障感知操控。
      - - 连接
        - WiFi、Ethernet、USB、云集成
        - 指向车队管理定位和本地接口选项。
        - 降低接入联网零售和企业网络的 rollout 难度。
      - - 机身重量
        - 官方约 92.5 kg；部分评测约 85 kg
        - 建模楼面载荷或运输前，需要先解决不同来源的重量冲突。
        - 影响搬运、移动能耗和安全规划。
    notes: 各行只汇总截至本次报告日期已公开披露的规格。二级来源与官方 bundle 不一致时，先列官方数值，并在备注中披露差异。
