      - number: '6.5'
        title: 集中度风险与负面信号
        blocks:
          - type: paragraph
            body: >-
              客户故事仍有吸引力，但风险还没有完全出清。CATL 同时是 Galbot
              最具战略意义的投资关系，也是最清晰的工业客户锚点，这带来集中度和治理问题；对一家私营公司来说，公开记录还回答不了。公开部署也高度偏向中国，Galbot
              因此暴露在单一监管环境、单一人才生态和单一人形机器人早期采用市场里。独立负面报道让这种谨慎更尖锐：TechXplore 认为，可用生产场景仍然有限，人形机器人供给可能跑在真实买方需求前面；CNBC
              也把这个行业描述为投资热、商业化尚不成熟。这些批评与 Galbot
              的证据形态相吻合：公开客户标识和铺设数量真实存在，但详细机队经济性、续约、经第三方验证的生产率结果仍然稀疏。多垂直场景和伙伴渠道确实降低了一部分单一市场风险；但相对于 Galbot
              融资轮次和制造叙事隐含的规模野心，数千台订单说法仍显早期。简言之，采用动能真实存在，但集中度和商业化质量还没有达到后期工业平台投资者想看到的证明水平。
