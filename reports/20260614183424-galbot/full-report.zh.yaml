              反对 Galbot 的理由不是没有竞争者，而是强竞争者太多，并且 VLA 叙事重叠、广泛买方付费意愿尚未充分证明。外部批评仍很尖锐。TechXplore
              引用观察者称，许多人形机器人仍然表演性强于功能性，真实用例仍很窄。市场领导权说法也有噪音：AgiBot 在一些 2025 年出货数据集中排名第一，但 Unitree
              用自己的出货说法质疑这种领先。最后，中国估值基准仍大幅低于 Figure 等美国同行，这说明即便部署叙事看起来可比，资本市场仍在折价中国人形玩家的耐久性或全球变现能力。最稳妥的判断是，Galbot
              在中国特定部署入口和垂直栈所有权上拥有真实近期护城河；但若要长期护城河超过中等耐久度，它还必须证明比那些正冲向同一架构的对手拥有更好经济性、更快学习闭环和更高真实世界利用率。
