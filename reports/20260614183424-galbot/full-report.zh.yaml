              Galbot 的公开牵引力在运营层面亮眼，在财务层面偏弱。运营侧，来源指向截至 2025 年底覆盖 30 多个城市的零售存在、截至 2026 年初 100
              多个药房或门店部署、累计数千台工业订单，以及药房工作流中高度具体的任务成功率声明。这足以说明 Galbot
              不是只待在实验室的创业公司。但若没有订单到交付的转化、合同金额、验收时点或服务绑定细节，上述指标无法干净转化为已确认收入。公司未披露收入、ARR、EBITDA、毛利率、烧钱速度或客户集中度。即便利用率或劳动力替代叙事很强，也仍是代理指标，而非已确认财务结果。因此，正确框架是不对称的：部署证据有意义，但公开材料呈现运营远多于会计，收入质量仍未验证。
