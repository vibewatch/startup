      - number: '8.3'
        title: 反论点：为什么当前价格仍可能过高
        blocks:
          - type: paragraph
            body: >-
              反论点的重点，不在于人形机器人是否重要，而在于投资者是否被要求过早为一个仍不透明的故事付钱。Galbot 的 $3 billion
              估值没有公开收入或单位经济性披露支撑。品类中的需求形成仍是真实风险，TechXplore 的报道尤其强调这一点；而 CATL
              周围的伙伴集中意味着，一个被高调庆祝的证明点也是单点脆弱性。合规、责任、网络安全和隐私问题也并不抽象；收紧的标准和数字身份系统最终可能帮助强供应商，但首先会抬高证明准备就绪的成本。竞争强度进一步削弱了清晰溢价论。Unitree
              的定价、AgiBot 的存在、XPENG 的机器人野心，以及 Physical Intelligence 等软件优先平台，都说明战略稀缺性可能比私募估值所暗示的更快收窄。按今天的入场点，这足以让建议保持谨慎。
