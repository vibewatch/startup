      - number: '5.5'
        title: 差异化、安全、合规与路线图可信度
        blocks:
          - type: paragraph
            body: >-
              Galbot 的主要差异化主张不是单一组件，而是栈级组合：自有数据、具身基础模型、机器人硬件，以及进入零售、医疗健康和制造部署环境的通道。与 Peking University、BAAI、Bosch 和 UAES
              的伙伴关系强化了这样一种判断：Galbot 在搭建数据与制造飞轮，而非一次性产品。2025 World Humanoid Robot Games
              和药品分拣挑战的第三方验证，增加了一些信号，说明该技术栈能泛化到基准任务。尽管如此，安全与合规只被部分去风险。IP54 有用，但只是有限防尘防水，并不能替代详细医疗、工厂或隐私认证。中国 2026 年 3
              月人形机器人标准和 2026 年 5 月机器人数字 ID 制度会抬高基础合规义务；法律评论也指出责任、自主性和数据处理仍有未解决问题。最尖锐的信任缺口是隐私：一份负面报告明确指出，Galbot
              没有解释药房场景中的患者个人可识别健康信息如何被保护。这个遗漏不否定产品，但意味着更广泛医疗健康渗透的路线图可信度，仍取决于尚未公开的治理和安全披露。
