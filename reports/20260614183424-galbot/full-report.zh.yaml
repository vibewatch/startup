  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Galbot 的产品更应被理解为具身劳动自动化，而不是通用人形机器人展示。放到客户工作流里，G1
              替代的是结构化室内环境中的重复性取放搬运、扫描分拣配送和导引服务任务；这些场景里，触达灵活性和连续运行时间比富有表现力的双足行走更重要。在药房，工作流是货架扫描、药品识别、取回和交接；在自主便利零售中，是 50
              平方米紧凑门店里的补货、拣单、无人收银支持和夜间运营；在工厂中，是常规搬运、零部件移动，最终走向精密装配。因此，这台机器人位于移动操作臂与人形服务工之间：双臂、躯干升降和大垂直工作空间让它能操作为人类设计的货架和柜台，轮足底盘则优先保证稳定性和续航。这个框架很重要，因为
              Galbot 的公开部署强调的是狭窄但经济性可读的工作，而不是无约束家庭自主。
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE026
              - CE027
