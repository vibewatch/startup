- id: I505
  title: Capital adequacy and financing dependency
  body: 'On capital adequacy, Galbot is strong by private-startup standards. The funding path escalated from undisclosed 2023 seed and angel rounds into a June 2025 RMB 1.1B institutional round, then a December 2025 round of more than $300M at a $3B valuation, then a March 2026 RMB 2.5B round that brought cumulative disclosed capital to roughly $1.15B+. That scale of capital should give Galbot meaningful room to expand manufacturing, commercial deployment, and model training without an immediate financing cliff. The two caveats are burn and financing dependency. Burn is not disclosed and could be substantial for a humanoid company with heavy R&D and field operations. Financing dependency is also strategic rather than purely numeric: Galbot appears less exposed than many startups because national and industrial capital are already involved, but that same support may also lock expectations toward domestic strategic goals. Net, capital adequacy looks good, yet runway remains an estimate until
    cash and burn are disclosed.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI026
  - CI027
  - CI028
  - CI029
