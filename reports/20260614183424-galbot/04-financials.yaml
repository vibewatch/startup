- id: I506
  title: Financial verdict and diligence asks
  body: 'Galbot''s financial picture combines a strong balance-sheet proxy with weak disclosure quality. The bullish case is straightforward: the company has raised enough money to matter, has credible deployment references across multiple verticals, and appears to be funding both manufacturing and embodied-AI R&D from a position of strategic support rather than desperation. The bearish case is equally clear: investors cannot yet verify revenue, gross margin, burn, payback, customer concentration, or even the split between hardware, service, and operator revenue. That matters because the category is already facing skepticism on real buyer demand and a severe valuation gap versus US peers such as Figure. The financial verdict is therefore cautiously positive on capital adequacy, neutral to negative on transparency, and unresolved on revenue quality. The central diligence ask is not another vision demo; it is a dated financial bridge from orders to delivered units to recognized revenue, plus
    margin and cash-burn disclosure by business line.'
  claimRefs:
  - CI026
  - CI030
  - CI031
  - CI032
