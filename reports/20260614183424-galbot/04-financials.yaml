- id: I503
  title: Cost structure, margin drivers, and capital intensity
  body: 'Galbot''s cost structure is almost certainly more hardware-heavy than software investors may instinctively assume. A humanoid deployment embeds bill-of-materials costs, electromechanical components, batteries, sensors, compute, factory labor, field installation, and ongoing service support. That means gross margin will be governed not only by pricing power but also by yield, utilization, warranty burden, and service efficiency. Public sources do not disclose a Galbot gross margin, yet broader physical-AI and robotics context suggests the margin band is likely far below pure SaaS and dependent on manufacturing maturity. Working capital is another likely drag: robots and parts must be financed through inventory and deployment cycles before cash is fully recovered, especially if enterprise buyers negotiate milestone-based payments. The March 2026 financing likely funds exactly these pressures—manufacturing scale-up, model development, and field deployment expansion—which is why Galbot
    should be underwritten as a capital-intensive physical-AI company, not as an asset-light AI software vendor.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI036
  figureRefs:
  - FI002
- id: I504
  title: Public traction is real, but financial disclosure is thin
  body: 'Galbot''s public traction picture is impressive at the operational level and weak at the financial level. On the operational side, sources point to 30-plus-city retail presence by late 2025, 100-plus pharmacy or store deployments by early 2026, several thousand cumulative industrial orders, and highly specific task success claims in pharmacy workflows. That is enough to conclude that Galbot is not a lab-only startup. But none of those metrics translates cleanly into booked revenue without order-to-delivery conversion, contract value, acceptance timing, or service-attach detail. The company does not publish revenue, ARR, EBITDA, gross margin, burn, or customer concentration. Even strong utilization or labor-replacement narratives remain proxies rather than recognized financial outcomes. The right framing is therefore asymmetrical: deployment proof is meaningful, yet revenue quality remains unverified because the public chapter shows operations far more clearly than accounting.'
  claimRefs:
  - CI017
  - CI019
  - CI020
  - CI021
  - CI032
  - CI033
  - CI035
  tableRefs:
  - TI003
  figureRefs:
