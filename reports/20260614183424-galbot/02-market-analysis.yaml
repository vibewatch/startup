- id: growth-drivers
  title: Growth drivers and why China matters first
  body: 'The strongest growth drivers are converging in China earlier than in most other markets. Policy support is explicit, from standardization work to local industrial funds and the treatment of embodied AI as a strategic industry. Supply-chain depth also matters: as component ecosystems, batteries, actuators, and manufacturing capacity improve, unit economics should fall and commercialization should become less dependent on showcase pilots. TrendForce argues that the second half of 2026 is the point where the market''s emphasis shifts from foundational capability to user value, which is consistent with IDC-style evidence that shipment volume is now material enough to create a real installed base. Demand-side pull is also rising from aging populations, labor shortages, and enterprise interest in automation across manufacturing, logistics, and service workflows. For Galbot, that means China is not just a convenient home market; it is the earliest large geography where technical progress,
    policy support, and buyer experimentation are all happening at once.'
