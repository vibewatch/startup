- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Aging populations and labor shortages
    - driver
    - 2026-2035
    - Sustains demand for automation in care, logistics, and service roles
    - Quantify which Galbot segments face the sharpest labor pain today
  - - Government support and local funds
    - driver
    - 2025-2026
    - Lowers commercialization friction in China
    - Verify which provincial programs directly benefit Galbot customers
  - - Falling unit costs and scale
    - driver
    - 2026-2030
    - Improves ROI and expands buyer pool
    - Track BOM, actuator, battery, and integration cost curves
  - - Embodied-AI and LLM progress
    - driver
    - 2026 onward
    - Broadens useful task set and deployment flexibility
    - Separate demo progress from production robustness
  - - Supply-chain maturity in China
    - driver
    - current
    - Helps domestic vendors move faster on volume
    - Test whether supply-chain scale also improves field reliability
  - - High unit costs and capital intensity
    - constraint
    - current
    - Keeps many deployments in pilot or showcase stage
    - Ask for payback periods by vertical and task
  - - Task generalization limits
    - constraint
    - current
    - Restricts robots to narrow, scripted workflows
    - Request evidence of transfer across sites and tasks
  - - Data scarcity and limited real-world training
    - constraint
    - current
    - Slows reliability gains for embodied models
    - Audit data collection, teleoperation, and sim-to-real loop
  - - Tactile sensing and hand dexterity bottleneck
    - constraint
    - current
    - Caps economically useful manipulation breadth
    - Inspect grasp success, recovery, and fragile-object performance
  - - Safety, liability, and compliance uncertainty
    - constraint
    - 2026 onward
    - Raises buyer diligence and deployment overhead
    - Review certification path, recalls, and traceability process
  - - Demand lagging manufacturing capacity
    - constraint
    - 2026-2027
    - Creates risk that output scales faster than paying buyers
    - Compare order backlog, utilization, and renewal data
  notes: Rows mix structural growth drivers with execution constraints; the main diligence issue is not whether the market exists, but how quickly each constraint clears by buyer segment.
