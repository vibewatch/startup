tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Galbot
  rows:
  - - Enterprise humanoid systems
    - Humanoid hardware plus on-robot software for physical workflows
    - Non-humanoid robotics and generic enterprise AI
    - Factory, logistics, retail, healthcare operators
    - Core addressable category
  - - Embodied-AI software and services
    - Data collection, training, integration, fleet operations, maintenance
    - Software-only copilots with no robot deployment
    - Automation, IT, and operations budgets
    - Necessary to make hardware productive
  - - Industrial manufacturing
    - Workcell assistance, material handling, inspection, repetitive physical tasks
    - Fixed automation that does not require a humanoid form factor
    - Plant operations and automation teams
    - Strongest near-term beachhead
  - - Warehouse logistics
    - Picking, internal movement, sortation-adjacent labor substitution
    - AMRs or conveyors that solve the task without humanoids
    - Logistics operations and warehouse engineering
    - Important but ROI-compared against many substitutes
  - - Retail, service, and healthcare
    - Customer-facing assistance, reception, shelf or floor workflows, eldercare support
    - Pure kiosk software or telepresence-only systems
    - Store operations, service innovation, hospital or care administrators
    - Useful proof-point segments, but often slower to scale
  - - Consumer / household robots
    - Long-run household assistance use cases
    - Near-term enterprise productivity workflows
    - Consumers
    - Mostly outside Galbot's near-term serviceable market
  notes: Boundary uses enterprise humanoid deployments as the center of gravity; it includes software and services only when attached to robot productivity rather than generic AI spend.
