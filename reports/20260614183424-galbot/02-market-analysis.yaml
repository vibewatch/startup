company:
  name: Galbot
chapter:
  number: 2
  title: Market Analysis
  summary: 'Galbot sits inside a fast-scaling but still definition-sensitive humanoid robotics market: realized 2025 hardware revenue was only about $440 million on roughly 18,000 global shipments, while long-run TAM claims range from tens of billions by 2030 to trillions by 2050. China is the most important near-term geography because it combines shipment scale, policy support, and regulatory standardization, but buyer readiness, task generalization, safety governance, and real ROI evidence remain the main constraints on how much of that headline market becomes serviceable for Galbot.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: Galbot's relevant market is narrower than "all robotics" and broader than "humanoid hardware shipments." The practical boundary is enterprise humanoid systems deployed into physical workflows, together with the embodied-AI software, training data, integration, and services needed to make those systems useful. That means the chapter includes industrial manufacturing, warehouse logistics, retail-service, and healthcare deployments, because those are the segments repeatedly cited in current market coverage and in Galbot's own commercialization messaging. It excludes generic industrial automation, AGVs, cobots, and software-only AI categories unless a humanoid form factor is central to the buyer's use case. The status-quo competition is therefore not just other humanoid startups; it is also human labor, fixed automation, workflow-specific robots, and delayed automation spending. That definition matters because a broad trillion-dollar TAM can be directionally true while still overstating
    Galbot's near-term serviceable market.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM028
  - CM029
  - CM030
