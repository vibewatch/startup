- id: sizing-lenses
  title: Multi-lens sizing and contradictory estimates
  body: 'Published market numbers diverge because they measure different things. IDC-based reporting describes a realized 2025 hardware market of roughly 18,000 units and about $440 million of revenue, which anchors how early commercialization still is. MarketsandMarkets and SkyQuest publish broader forward revenue forecasts for the humanoid robot category, while People''s Daily cites an embodied-AI forecast that is broader still. Morgan Stanley and UBS extend the horizon to 2050 and frame the opportunity in the trillions, but those long-run TAM lenses are scenario-heavy and should not be treated as near-term market-clearing demand. China-specific sizing is also uncertain: CCID-linked coverage says the domestic humanoid market could exceed 20 billion yuan by 2026, but the public methodology is thinner than the headline implies. For diligence purposes, the right conclusion is not that one estimate is correct and the rest are wrong; it is that Galbot''s addressable market expands sharply depending
    on whether the lens is hardware revenue, full-stack humanoid systems, or the broader embodied-AI stack.'
