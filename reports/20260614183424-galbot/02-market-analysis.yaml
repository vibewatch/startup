  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: china-market-size
    missingEvidence: Public methodology behind the >20 billion yuan 2026 China market figure, including whether it counts hardware only or a broader embodied-AI stack.
    whyItMatters: China is Galbot's most relevant near-term geography, so a poorly specified domestic SAM can distort every TAM-to-SOM bridge in the chapter.
    diligencePath: Obtain the underlying CCID report or a more detailed Chinese-language summary that specifies scope, time base, and component inclusion.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: galbot-obtainable-share
    missingEvidence: Independent segment-level data on Galbot's order conversion, paid deployments, utilization, retention, and revenue mix by vertical.
    whyItMatters: Company order claims alone do not show whether Galbot can turn pilot demand into durable share in manufacturing, retail, or healthcare.
    diligencePath: Request customer references, booked-versus-delivered units, paid pilot conversion rates, and by-segment revenue or backlog disclosures from management.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM003
  - type: access-blocked
    severity: minor
    topic: buyer-demand
    missingEvidence: Full accessible text from buyer-skeptical coverage on whether humanoid output is scaling faster than paying demand.
    whyItMatters: The market's most important near-term risk is a mismatch between shipment capacity and genuine enterprise willingness to buy beyond pilots.
    diligencePath: Re-fetch or source equivalent buyer-side reporting with post-pilot retention data, especially for China factory and logistics deployments.
    relatedQuestionRefs:
    - QM023
    - QM025
  - type: conflicting-data
    severity: minor
    topic: regional-share
    missingEvidence: A normalized comparison reconciling North America 2025 market-share claims with IDC-style statements that Chinese firms dominated shipments.
    whyItMatters: Without a common denominator, regional leadership claims can be misread as contradictions instead of boundary differences.
    diligencePath: Build a side-by-side table separating revenue share, shipment share, and company domicile by source and year.
    relatedQuestionRefs:
    - QM006
    relatedTableRefs:
    - TM002
acknowledgedWarnings:
- dimension: fetchTrailMissing
  reason: User-supplied DirectIndustry, TechXplore, UBS, EEWorld, and Robotics & Automation News URLs were partly blocked or redirected, but their retained facts were triangulated against accessible Xinhua, CCTV, CNBC, and TechNode coverage.
- dimension: unverifiedSource
  reason: A small set of access-blocked sources is retained because they sharpen uncertainty around China market sizing, buyer demand, and safety standards; the chapter explicitly downgrades confidence where those sources are not independently verifiable.
