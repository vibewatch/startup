  topStrengths:
    - >-
      Full-stack proprietary platform: 10B+ data point dataset, GraspVLA/TrackVLA/GroceryVLA models, and G1 hardware
      differentiate Galbot from pure-hardware peers.
    - >-
      State-backed capital base: National AI Fund, Sinopec, CITIC, Bank of China, and SAIC investment provides policy
      access and procurement advantage at scale.
    - >-
      Proven industrial deployments: CATL, Mercedes-Benz, Zeekr, Bosch JV, and thousands of units in orders validate
      real commercial traction beyond pilot stage.
    - >-
      Academic founder credibility: He Wang's Stanford PhD and PKU professorship, plus BAAI/PKU joint labs, signal deep
      research-to-product pipeline.
  topRisks:
    - >-
      Financial opacity: No disclosed revenue, gross margin, or unit economics; current $3B valuation rests entirely on
      narrative and investor expectations.
    - >-
      CATL concentration: Largest investor is also the largest disclosed customer, a related-party dynamic that creates
      governance and concentration risk.
    - 'Key-person dependency: He Wang''s dual role as academic and CEO creates succession and leadership bandwidth risk.'
    - >-
      Regulatory and geopolitical exposure: Chinese tech hardware faces export control and data-localization risks in
      Western markets; new national standards impose compliance costs.
    - >-
      Technology commoditization: Multiple Chinese and US firms converging on similar VLA architectures; moat durability
      depends on proprietary data and customer lock-in.
  unresolvedGaps:
    - Audited revenue, ARR, and gross margin for any period
    - Unit-level P&L and payback period for G1 deployments
    - CATL contract terms, duration, and exclusivity provisions
    - Employee headcount and burn rate trajectory
    - IP portfolio scope and freedom-to-operate analysis
    - Data privacy compliance posture for healthcare (patient PII) deployments
    - Cap table structure, liquidation preference stack, and dilution path
