- id: regulatory-legal-and-safety-risk
  title: Regulatory, legal, and safety risk
  body: The regulatory picture for Galbot is unusually important because the Chinese state is not just observing humanoid robots; it is now creating enforceable frameworks around them. The March 2026 national standards system and the May 2026 digital-ID regime move humanoids closer to a governed industrial product category, which is constructive for long-term market development but expensive for underprepared vendors. The legal risk is wider than compliance checklists. Hill Dickinson’s analysis is persuasive because it treats liability, privacy, and accountability as unresolved even before full autonomy arrives. If a robot injures a worker, misidentifies a person, or mishandles sensitive data in a pharmacy or hospital, responsibility may cut across maker, operator, and software stack. That means one material incident can trigger commercial hesitation, regulatory review, and direct cost at the same time.
  claimRefs:
