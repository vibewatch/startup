tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Jurisdiction / issue
  - Current status
  - Requirement / exposure
  - Galbot compliance posture
  - Gap
  - Severity
  rows:
  - - China national humanoid standard system
    - Framework announced in March 2026
    - Manufacturers must align with safety, ethics, testing, and interoperability expectations
    - Galbot benefits from domestic alignment but still faces implementation work
    - No public certification packet or compliance roadmap disclosed
    - High
  - - China robot digital ID regime
    - Operational from May 2026
    - Registration becomes a market-access and traceability requirement
    - Galbot operates in China and should eventually register deployed units
    - No public proof of unit-level registration or recall workflow yet
    - High
  - - Defect recall and resale restrictions
    - Embedded in digital-ID regime
    - Defective units may need recall; refurbishment or resale is constrained
    - Raises cost of hardware defects and service mistakes
    - No public defect reserve or recall-readiness disclosure
    - High
  - - Liability allocation after incidents
    - Legal analysis still unsettled
    - Harm can trigger claims against manufacturer, operator, and software provider
    - Galbot’s mixed B2B environments complicate operator versus maker liability
    - No public indemnity or insurance framework disclosed
    - Medium-High
  - - Privacy / biometric handling
    - Humanoids can process workplace and customer data
    - Cross-border privacy and biometric rules are not harmonized
    - Healthcare and retail deployments make data minimization important
    - No public privacy architecture for healthcare deployments disclosed
    - Medium-High
  - - Geopolitical technology controls
    - Chip and market access remain politically sensitive
    - Restrictions can slow advanced compute access or export growth
    - Galbot has discussed diversified supply chains but remains exposed
    - No public multi-supplier mitigation detail at the model-training layer
    - Medium
  notes: Register focuses on the policy and legal constraints that can stop deployment even when the robot itself appears technically capable.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main China regulatory and cross-border legal constraints visible in the reviewed 2024-2026 source set, but not every provincial enforcement interpretation or every private contract term.
