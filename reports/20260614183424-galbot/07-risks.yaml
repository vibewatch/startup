- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable indicator
  - Trigger / threshold
  - Why it matters
  - Action implication
  rows:
  - - Regulatory compliance drag
    - Public evidence of digital-ID registration and standards certification
    - No clear compliance proof as commercial deployments expand through 2026-2027
    - Would imply policy risk is gating scale rather than enabling it
    - Treat as a major diligence blocker
  - - CATL concentration
    - Share of visible deployments or revenue tied to CATL
    - CATL materially reduces orders, pilot scope, or investor support
    - Would hit revenue proof and financing signal at once
    - Lower valuation tolerance sharply
  - - Buyer demand weakness
    - Named repeat customers beyond flagship references
    - Robots remain showcase deployments without broad renewal or expansion
    - Would show that demand is not compounding
    - Underwrite as pilot-heavy hardware, not a scalable platform
  - - Safety / cyber incident
    - Material field failure, recall, or security breach
    - One serious incident under the new digital-ID regime
    - Can trigger liability, recall cost, and demand hesitation simultaneously
    - Pause investment until root cause and response are clear
  - - Unit-economics disappointment
    - Evidence that robots cannot reliably replace targeted labor shifts
    - Support cost or uptime shortfall erodes customer ROI
    - Would weaken both demand and margin assumptions
    - Move to bear-case framing
  - - Political / export shock
    - Restricted access to key compute or export channels
    - New export-control friction affecting performance roadmaps
    - Can slow model iteration and international optionality
    - Reduce confidence in long-term multiple expansion
  notes: These triggers are written to be observable so the chapter can feed directly into an invest, wait, or walk decision rather than ending as generic caution.
