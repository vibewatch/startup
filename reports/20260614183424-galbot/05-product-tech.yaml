- id: TE002
  title: AI/software stack
  columns:
  - component
  - description
  - claimed capability
  - differentiation
  - evidence quality
  rows:
  - - GraspVLA
    - End-to-end embodied grasping foundation model
    - Zero-shot generalization to new objects and tasks without extra training
    - Pairs large-scale simulated pretraining with in-house robot execution loop
    - 'Medium-high: official and trade-media corroborated, but no public benchmark suite'
  - - TrackVLA
    - Navigation and target-tracking model
    - Follows people or objects, takes voice commands, resumes tracking after occlusion
    - Connects mobility with intent following in cluttered spaces
    - 'Medium: described in company materials with limited external technical detail'
  - - GroceryVLA
    - Retail-specific manipulation model
    - Handles deformable, rigid, and fragile items without per-item reprogramming
    - Vertical specialization for real store inventories rather than generic robot demos
    - 'Medium-high: supported by official descriptions and deployment coverage'
  - - Brain-cerebellum-neural control architecture
    - Integrated perception-decision-control stack
    - Transforms multimodal input into low-latency action loops
    - Claims more end-to-end control than legacy modular robotics stacks
    - 'Medium: architecture is described at marketing level, not in a system paper'
  - - Developer platform
    - Public developer portal and manuals
    - Provides integration and secondary-development surface
    - Suggests Galbot intends partner extensibility, not closed appliance-only sales
    - 'Medium: portal existence is public, API depth remains unclear'
  - - Sim2Real data engine
    - Synthetic pretraining plus limited real-world fine-tuning
    - Reduces manual relabeling and speeds transfer into novel contexts
    - Potential data-flywheel advantage if simulation quality is high
    - 'Medium-high: independently reported but not benchmarked'
  notes: Evidence quality reflects how much of each claim is backed by first-party technical detail versus secondary reporting. No public benchmark repository or reproducible evaluation harness is available for these models.
