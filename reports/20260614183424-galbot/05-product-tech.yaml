tables:
- id: TE001
  title: G1 hardware specifications
  columns:
  - parameter
  - value
  - notes
  - comparison context
  rows:
  - - Height (standard posture)
    - 1730 mm
    - Official product bundle and product page align on roughly 173 cm standing height.
    - Human-scale service robot sized for standard shelving and counters.
  - - Torso lift
    - 650 mm
    - Large torso travel expands high and low shelf access without changing base footprint.
    - More relevant than leg expressiveness for indoor retail and pharmacy work.
  - - Arm length
    - 710 mm
    - Published in official bundle.
    - Long-reach dual-arm geometry compensates for a stable wheeled base.
  - - Vertical workspace
    - 0–2100 mm
    - Official bundle says standard range with potential for higher reach in some postures.
    - Covers floor bins through high retail shelving.
  - - Dual-arm payload
    - 5 kg
    - Payload appears tuned for item handling, not heavy assembly.
    - Suitable for SKUs, trays, bottles, and light parts.
  - - Battery
    - 48V 30Ah lithium
    - Battery spec is official; cycle life and hot-swap design are undisclosed.
    - Supports up to 10-hour claimed run time.
  - - Operating duration
    - Up to 10 hours
    - Company-claimed endurance; duty-cycle assumptions are not disclosed.
    - Competitive for single-shift indoor operations.
  - - Ingress rating
    - IP54
    - Confers basic dust and splash resistance only.
    - Below the certification depth often demanded for harsher industrial or clinical cleaning regimes.
  - - Sensors
    - Vision, tactile, depth
    - Modalities are public, but sensor vendors and redundancy layers are not.
    - Enough to support grasping, tracking, and obstacle-aware manipulation.
  - - Connectivity
    - WiFi, Ethernet, USB, cloud integration
    - Indicates fleet-management posture and local interface options.
    - Eases rollout into connected retail and enterprise networks.
  - - Body weight
    - ~92.5 kg official; ~85 kg in some reviews
    - Weight conflict across sources should be resolved before modeling floor loading or transport.
    - Impacts handling, mobility energy use, and safety planning.
  notes: Rows compile only publicly disclosed specifications as of the run date. Where secondary sources diverge from the official bundle, the official value is shown first and the discrepancy is disclosed in notes.
