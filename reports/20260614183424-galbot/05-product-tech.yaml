chapter:
  number: 5
  title: Product & Technology
  summary: Galbot sells a full-stack embodied-AI robot platform anchored by the G1 robot and a family of task-specific VLA models for retail, pharmacy, warehouse, and factory workflows. Official materials support a concrete hardware baseline—1730 mm height, 650 mm torso lift, 710 mm arm length, 5 kg dual-arm payload, 48V 30Ah battery, IP54 protection, and hybrid wheel-foot mobility—while third-party coverage corroborates pharmacy and industrial deployment momentum. The strongest moat signals are the in-house data/model/hardware stack, GraspVLA/TrackVLA/GroceryVLA specialization, and manufacturing partnerships with Bosch and UAES; the largest gaps are independent reliability data, published privacy controls for healthcare, and proof that roadmap claims can scale from pilots to repeatable factory operations.
