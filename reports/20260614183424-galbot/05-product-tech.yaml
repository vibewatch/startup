sections:
- id: section-E1
  title: Product Definition in Customer Workflow Terms
  body: 'Galbot''s product is best understood as embodied labor automation rather than as a general-purpose humanoid showcase. In customer workflow terms, G1 replaces repetitive pick-carry-place, scan-sort-deliver, and guided-service tasks in structured indoor environments where reach flexibility and continuous uptime matter more than expressive bipedal walking. In pharmacies the workflow is shelf scanning, medication identification, retrieval, and handoff; in autonomous convenience retail it is restocking, order picking, cashierless support, and after-hours operation inside compact 50 square meter stores; in factories it is routine handling, parts movement, and eventually precision assembly. The robot therefore sits between a mobile manipulator and a humanoid service worker: dual arms, torso lift, and a large vertical workspace let it operate shelves and counters built for humans, while the wheel-foot base prioritizes stability and runtime. This framing matters because Galbot''s public
    deployments emphasize narrow but economically legible jobs rather than unconstrained household autonomy.'
  claimRefs:
  - CE001
  - CE002
  - CE008
  - CE026
  - CE027
  - CE030
  tableRefs: []
  figureRefs:
  - FE001
- id: section-E2
  title: Hardware Platform and Operating Architecture
  body: 'Official Galbot materials provide an unusually concrete hardware envelope for G1. The platform stands 1730 mm tall in standard posture, lifts its torso 650 mm, extends to a 0–2100 mm vertical workspace, and uses 710 mm arms with roughly 190 cm span to cover shelving and counters above and below standard human waist height. Dual-arm payload is listed at 5 kg, enough for medication trays, snack bags, bottles, and light industrial parts rather than heavy manufacturing loads. Power comes from a 48V 30Ah lithium battery with claimed operating duration up to 10 hours, paired with WiFi, Ethernet, USB, and cloud integration for fleet supervision. The design choice that most affects deployment economics is the wheel-foot mobility structure: Galbot appears to optimize for stable indoor navigation and longer runtime while preserving human-space reach through a torso lift and long arm geometry. The six-and-a-quarter-inch touchscreen gives local operator interaction, while multimodal vision,
    tactile, and depth sensing support the embodied-control stack above the hardware. One specification conflict remains: the official bundle cites roughly 92.5 kg body weight, while secondary reviews sometimes quote 85 kg.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE001
  figureRefs:
  - FE002
- id: section-E3
  title: AI Stack, Data Engine, and Developer Surface
  body: Galbot's software story is built around verticalized vision-language-action models rather than a single generic foundation model. GraspVLA is positioned as the core embodied grasping model, trained on billions of simulated interactions and supported by DexGraspNet-scale grasp data, with the commercial promise of zero-shot handling of unseen objects and tasks. TrackVLA extends the stack into navigation and following behaviors by visually tracking people or objects, accepting voice commands, and re-acquiring the target after temporary visual loss. GroceryVLA narrows the abstraction to retail manipulation by claiming it can handle deformable snack bags, rigid bottles, and fragile jars in cluttered stores without per-SKU reprogramming. Across these modules Galbot describes a brain-cerebellum-neural-control architecture that compresses perception, decision, and low-latency feedback control into a more end-to-end pipeline than legacy robotics stacks. The data-moat claim rests on 10 billion-plus
    data points and a Sim2Real loop that leans heavily on synthetic data generation, reportedly using NVIDIA Isaac Sim, followed by limited real-world fine-tuning. The public developer platform suggests a real integration surface exists, but public documentation remains thinner than what leading global embodied-AI peers expose.
  claimRefs:
