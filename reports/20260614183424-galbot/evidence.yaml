evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public board composition, independent director information, and a clearer internal executive roster.
    whyItMatters: Without governance detail, investors cannot assess oversight quality, succession depth, or control concentration.
    diligencePath: Request a current board deck or corporate governance summary and reconcile it with shareholder-rights documents.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, gross margin, burn, runway, and headcount detail for 2025 and 2026.
    whyItMatters: >-
      These metrics are required to test whether the $3B valuation and state-backed expansion are economically
      justified.
    diligencePath: Obtain management financial statements, KPI dashboards, and monthly board reporting for the last 12 months.
    relatedQuestionRefs:
      - QO011
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap table and round terms
    missingEvidence: >-
      Exact investor allocations, liquidation preferences, board rights, and whether late-2025 and 2026 rounds included
      secondary components.
    whyItMatters: Round structure can materially change ownership, governance, and true enterprise-value interpretation.
    diligencePath: Review the latest cap table, financing documents, and side letters for the 2025 and 2026 rounds.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial conversion
    missingEvidence: >-
      Order-to-revenue conversion, deployment retention, and paid versus pilot mix across pharmacy, retail, and
      industrial accounts.
    whyItMatters: >-
      Several thousand unit orders and 30-plus-city presence are valuable only if they convert into durable paid
      programs.
    diligencePath: Request cohort data for customer pilots, signed production contracts, unit economics, and renewal performance.
    relatedQuestionRefs:
      - QO012
      - QO020
      - QO021
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: china-market-size
    missingEvidence: >-
      Public methodology behind the >20 billion yuan 2026 China market figure, including whether it counts hardware only
      or a broader embodied-AI stack.
    whyItMatters: >-
      China is Galbot's most relevant near-term geography, so a poorly specified domestic SAM can distort every
      TAM-to-SOM bridge in the chapter.
    diligencePath: >-
      Obtain the underlying CCID report or a more detailed Chinese-language summary that specifies scope, time base, and
      component inclusion.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: galbot-obtainable-share
    missingEvidence: >-
      Independent segment-level data on Galbot's order conversion, paid deployments, utilization, retention, and revenue
      mix by vertical.
    whyItMatters: >-
      Company order claims alone do not show whether Galbot can turn pilot demand into durable share in manufacturing,
      retail, or healthcare.
    diligencePath: >-
      Request customer references, booked-versus-delivered units, paid pilot conversion rates, and by-segment revenue or
      backlog disclosures from management.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: buyer-demand
    missingEvidence: >-
      Full accessible text from buyer-skeptical coverage on whether humanoid output is scaling faster than paying
      demand.
    whyItMatters: >-
      The market's most important near-term risk is a mismatch between shipment capacity and genuine enterprise
      willingness to buy beyond pilots.
    diligencePath: >-
      Re-fetch or source equivalent buyer-side reporting with post-pilot retention data, especially for China factory
      and logistics deployments.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: conflicting-data
    severity: minor
    topic: regional-share
    missingEvidence: >-
      A normalized comparison reconciling North America 2025 market-share claims with IDC-style statements that Chinese
      firms dominated shipments.
    whyItMatters: >-
      Without a common denominator, regional leadership claims can be misread as contradictions instead of boundary
      differences.
    diligencePath: Build a side-by-side table separating revenue share, shipment share, and company domicile by source and year.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Galbot pricing and unit economics
    missingEvidence: Public ASP, gross margin, maintenance attach rate, and contract terms for Galbot deployments are not disclosed.
    whyItMatters: >-
      Without price and service economics, it is hard to judge whether deployment breadth translates into durable margin
      advantage.
    diligencePath: Request customer proposals, realized invoices, and hardware-versus-service revenue mix by vertical.
    relatedQuestionRefs:
      - QP014
      - QP024
  - type: conflicting-data
    severity: material
    topic: shipment leadership
    missingEvidence: A harmonized third-party shipment table that resolves AgiBot versus Unitree 2025 leadership claims.
    whyItMatters: Competitive ranking affects how much weight investors should place on scale advantage versus marketing narrative.
    diligencePath: Obtain the underlying Omdia or equivalent shipment methodology and compare company claims to delivered units.
    relatedQuestionRefs:
      - QP002
      - QP020
  - type: missing-source
    severity: material
    topic: win-loss and switching costs
    missingEvidence: Public win-loss data and repeat-customer expansion data versus AgiBot, Unitree, and Figure are absent.
    whyItMatters: Moat durability ultimately depends on conversion and retention, not just named pilots.
    diligencePath: Ask management for competitive win-loss by vertical, deployment size, and follow-on order history.
    relatedQuestionRefs:
      - QP018
      - QP024
