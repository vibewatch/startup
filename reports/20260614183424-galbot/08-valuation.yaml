- id: anti-thesis-and-valuation-overhang
  title: 'Anti-thesis: why the current price can still be too rich'
  body: The anti-thesis is less about whether humanoids matter and more about whether investors are being asked to pay too early for a still-opaque story. Galbot’s $3 billion valuation is not supported by public revenue or unit-economics disclosure. Demand formation remains a real risk in the category, as TechXplore’s reporting emphasizes, and partner concentration around CATL means that a celebrated proof point is also a single-point vulnerability. Compliance, liability, cybersecurity, and privacy issues are not abstract either; tightening standards and digital identity systems may eventually help strong vendors, but first they increase the cost of proving readiness. Competitive intensity further weakens the clean-premium argument. Unitree’s pricing, AgiBot’s presence, XPENG’s robotics ambition, and software-first platforms such as Physical Intelligence all suggest that strategic scarcity may narrow faster than private marks imply. At today’s entry point, that is enough to keep the recommendation
    cautious.
