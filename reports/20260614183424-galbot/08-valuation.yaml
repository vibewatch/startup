  figureRefs: []
- id: investment-thesis
  title: 'Investment thesis: why Galbot could still matter'
  body: The bull case for Galbot is substantial. China is emerging as the center of humanoid manufacturing and shipment scale, which creates a natural domestic advantage for companies that can combine software, hardware, and customer access. Galbot’s own positioning is coherent with that opportunity. The company claims a full-stack embodied-AI architecture, large proprietary data assets, and multiple model layers rather than a single demo robot. Public deployment evidence across industrial, retail, and healthcare settings also suggests that Galbot is beyond the pure prototype stage. Add state-backed investors, a high-profile founder, and CATL-linked industrial validation, and the company can plausibly argue that it is building the inside track to Chinese enterprise humanoid adoption. If those ingredients convert into measurable repeat revenue over the next two to three years, the current valuation could ultimately look more defensible than it does today.
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV006
