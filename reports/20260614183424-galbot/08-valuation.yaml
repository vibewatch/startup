company:
  name: Galbot
chapter:
  number: 8
  title: Valuation
  summary: 'Galbot deserves attention because it appears to be one of the best-capitalized Chinese humanoid companies, with real deployment references and a full-stack embodied-AI narrative. But the current $3 billion mark remains difficult to underwrite cleanly because public revenue, margin, burn, and cap-table terms are still absent, while concentration and regulatory risks remain live. Net: strategically interesting, but still stretched enough to warrant a research-more stance until harder operating evidence arrives.'
sections:
- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: 'The right starting point for Galbot is the current financing mark, not a conventional discounted cash-flow exercise. Public evidence gives a strong headline: more than $300 million raised at roughly a $3 billion valuation in March 2026, following earlier financing that appears to push cumulative capital above $1.15 billion. That is enough to treat Galbot as one of the best-capitalized Chinese humanoid companies. It is not enough to treat the current price as obviously fair. Public sources still do not disclose audited revenue, gross margin, burn rate, or the detailed cap-table stack that determines whether the headline post-money translates into attractive common-equity entry. This is why entry discipline matters more than category excitement. A new investor should assume that structure, concentration, and commercialization timing are at least as important as the market-size narrative.'
  claimRefs:
