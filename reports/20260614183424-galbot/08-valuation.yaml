- id: recommendation-exit-and-final-diligence
  title: Recommendation, exit logic, and final diligence
  body: 'The chapter lands on research-more. That is not a dismissal of Galbot’s strategic position; it is a judgment that the current public record still leaves too much unresolved to call the $3 billion mark attractive. The company has real strengths, including capital depth, a credible domestic market position, and visible deployments, but the missing pieces are exactly the ones that matter most for entry quality: audited economics, cap-table terms, counterparty concentration, shipment truth sets, and detailed compliance posture. A plausible hold period is four to six years, because commercialization maturity and IPO readiness are likely to lag the financing story. The best path to conviction is not more narrative; it is narrower, harder evidence. If audited financials, repeat customer expansion, and cleaner concentration-adjusted unit economics arrive, the valuation stance could move from stretched toward fair. Until then, final diligence should do most of the work.'
