- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue and unit P&L
    - Quarterly revenue, gross margin, support cost, and cash burn
    - Valuation discipline depends on proving the business, not just the category.
    - Finance diligence with management and auditors.
  - - CATL contract structure
    - Duration, pricing, exclusivity, and termination rights
    - Concentration can distort both upside and downside.
    - Commercial and legal review of executed agreements.
  - - Delivery truth set
    - Actual shipments versus announced deployments by site
    - The thesis requires real scale, not just high-visibility pilots.
    - Ops diligence plus customer reference calls.
  - - Gross margin mix
    - Hardware margin versus software or services contribution
    - Determines whether scale improves value or simply expands support burden.
    - Finance and product diligence.
  - - Employee count and burn
    - Headcount by function and monthly cash consumption
    - Needed to judge runway and future dilution pressure.
    - HR and CFO diligence.
  - - IP and privacy posture
    - Patent map, FTO opinion, healthcare privacy controls
    - Both can create non-obvious downside if weak.
    - Legal and security diligence.
  notes: These asks are the minimum package required to convert a strategically interesting private round into a fully underwritten investment decision.
