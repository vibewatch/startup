company:
  name: Galbot
chapter:
  number: 1
  title: Company Overview
  summary: Galbot presents as a Beijing-founded embodied-AI robotics company that moved unusually quickly from 2023 formation to unicorn-scale financing, state-backed capital, and public deployment claims across industrial, retail, and healthcare settings. Public evidence strongly supports the founding identity, flagship G1 robot, partner network, and major 2025-2026 financing events, but commercial economics, governance detail, and audited operating metrics remain materially under-disclosed.
sections:
- id: identity-and-positioning
  title: Identity, founding footprint, and current product position
  body: Galbot’s public identity is clearer than that of many fast-rising robotics startups. The company describes itself as an embodied-AI robotics builder founded in Beijing in May 2023, with its core narrative centered on bringing humanoid or mobile-manipulator robots into real commercial environments rather than limiting them to lab demonstrations. Its official surfaces point to Beijing headquarters and a broader R&D footprint spanning Shenzhen, Suzhou, and Hong Kong, which is consistent with a company trying to combine frontier model work, hardware integration, and commercial deployment support. The flagship G1 platform is positioned for industrial, retail, and healthcare workflows, while the developer portal and application bundle indicate Galbot is trying to build a software and ecosystem layer around the robot rather than treating it as a one-off hardware showcase. The result is a company that looks more like a full-stack commercialization effort than a research project, even though
    many product and financial details still come from company-controlled channels.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO036
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: founders-leadership-and-network
  title: Founders, leadership concentration, and institutional network
  body: Founding concentration is one of Galbot’s biggest strengths and one of its clearest risks. Public materials attribute the company to He Wang and Zhang Zhizheng, and those founders remain the main named operators across official and media coverage. That concentration matters because Galbot’s product story depends on the ability to integrate robotics, embodied-AI data, and vertical deployment relationships at high speed; it also means outside observers have limited visibility into management redundancy or succession planning. The company’s partner page and third-party reporting provide some comfort by showing links with major research and clinical institutions including Peking University, BAAI, and Xuanwu Hospital, alongside industrial and automotive stakeholders. Even so, the public record remains thin on independent board composition, formal governance, and executive depth beyond the founders. For diligence purposes, Galbot appears institutionally connected and technically credible,
    but still founder-led in a way that heightens key-person dependency.
  claimRefs:
  - CO002
  - CO008
  - CO009
  - CO010
  - CO021
  - CO032
  - CO035
  tableRefs:
  - TO002
- id: capital-formation-and-stakeholders
  title: Funding history, valuation step-up, and stakeholder map
  body: Galbot’s financing trajectory is the strongest external validation point in the chapter. The company’s early capital path reportedly moved from seed in June 2023 to angel and angel-plus rounds later that year, then to a several-hundred-million-RMB round in March 2024. By mid-2025, multiple outlets described a roughly RMB1.1 billion or approximately $151-153 million financing tied to CATL-linked capital and Bosch-related strategic cooperation. The fundraising pace accelerated again in late 2025, when company-linked and independent reports described more than $300 million of new funding at roughly a $3 billion valuation and about $800 million of total capital raised. In March 2026, state-backed investors reportedly led an additional RMB2.5 billion round, pushing Galbot beyond pure venture sponsorship into nationally strategic capital channels. That capital stack is impressive, but the valuation logic remains expectation-heavy because revenue, margins, and headcount are still not publicly
    disclosed in detail.
  claimRefs:
