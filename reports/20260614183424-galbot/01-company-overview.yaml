- id: commercialization-and-milestones
  title: Commercialization proof points and operating milestones
  body: 'Galbot’s public commercialization case rests on deployment proof rather than disclosed financial metrics. Sources across 2025 and 2026 tie the company to CATL, Mercedes-Benz, Zeekr, Bosch, Toyota, BAIC, SAIC, Xuanwu Hospital, and pharmacy-chain contexts, which suggests its commercial footprint spans both industrial and service settings. The clearest vertical proof point is healthcare and pharmacy automation, where reporting on the G1 robot places Galbot in real dispensing or retail-assist environments in Beijing. Other sources describe several thousand unit orders, presence across more than 30 cities, and a 10-billion-plus embodied-AI data asset, although those scale metrics remain closer to company-claimed than independently audited. The milestone sequence still matters: founding, early financing, 2025 industrial backing, late-2025 unicorn valuation, 2026 healthcare deployment, and the parallel emergence of national humanoid-robot standards together show that Galbot is operating
    inside a favorable commercialization window, not just a hype cycle built on demo videos.'
  claimRefs:
