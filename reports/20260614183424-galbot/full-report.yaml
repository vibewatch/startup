      - number: '3.5'
        title: Moat durability and the adverse case
        blocks:
          - type: paragraph
            body: >-
              The adverse case against Galbot is not that competitors do not exist; it is that too many strong
              competitors exist at once, with overlapping VLA narratives and incomplete proof of broad buyer willingness
              to pay. Outside criticism remains sharp. TechXplore quotes observers arguing that many humanoid robots are
              still more performative than functional and that real use cases remain narrow. Market leadership claims
              are also noisy: AgiBot is ranked first in some 2025 shipment datasets, yet Unitree disputes that
              leadership with its own shipment claims. Finally, Chinese valuation benchmarks remain dramatically below
              US peers such as Figure, implying that capital markets still discount the durability or global
              monetization of Chinese humanoid players even when deployment narratives look comparable. The most
              defensible verdict is that Galbot has a real near-term moat in China-specific deployment access and
              vertical stack ownership, but its long-run moat is only medium durability unless it can prove better
              economics, faster learning loops, and higher real-world utilization than rivals that are racing toward the
              same architecture.
