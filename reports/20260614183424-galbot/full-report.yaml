  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and who actually matters
        blocks:
          - type: paragraph
            body: >-
              Galbot should be benchmarked against more than a short list of famous humanoid brands. The real landscape
              includes direct full-stack humanoid peers, auto-backed or public-company entrants, model-layer competitors
              that could abstract away hardware differentiation, substitutes such as fixed automation and manual retail
              or factory labor, and theoretical entrants that can leverage supply-chain scale from automotive or
              electronics ecosystems. In direct embodied-AI competition, AgiBot and Unitree matter most on current
              Chinese shipment evidence, Figure matters most on capital intensity and global narrative power, and
              Physical Intelligence matters because it could compress product differentiation at the model layer if
              generalist robot foundation models become portable across hardware. Adjacent pressure comes from XPENG,
              UBTech, Boston Dynamics, and 1X, each attacking a different slice of industrial, commercial, or household
              robotics. The practical status quo substitute remains human labor plus task-specific automation, which
              keeps buyer scrutiny focused on reliability and labor replacement rather than on humanoid novelty alone.
            claimRefs:
