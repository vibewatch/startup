      - number: '2.5'
        title: Constraints, regulation, and remaining uncertainty
        blocks:
          - type: paragraph
            body: >-
              The market is large enough to matter but still immature enough that headline TAMs can obscure operational
              risk. High unit costs and capital intensity keep many deployments in pilot mode. More importantly, the
              industry still struggles with task generalization, real-world data collection, dexterous manipulation,
              safety validation, and integration into customer workflows. Those are not cosmetic issues; they are
              exactly what determine whether demand keeps pace with the manufacturing capacity now being built.
              Regulation cuts both ways. China's March 2026 standards and May 2026 digital ID regime may reduce buyer
              hesitation by improving traceability and recall discipline, but they also raise compliance expectations.
              Public evidence on Galbot's own obtainable share remains incomplete because the company has disclosed
              orders and target sectors, but not enough independent data on conversion, utilization, or retention by
              segment. Investors should therefore treat current market evidence as strong enough to justify attention,
              yet still too noisy to support a single precise TAM-to-SOM bridge without additional diligence.
