    title: Thesis-break and kill triggers table
    columns:
      - Item
      - Description
      - Urgency
      - Thesis-break if unresolved
    rows:
      - - Audited revenue proof
        - Provide audited or board-level revenue, gross margin, and burn disclosures.
        - Immediate
        - Yes, because price cannot be underwritten cleanly without economics.
      - - CATL concentration
        - Disclose contract terms, duration, and dependency mix.
        - Immediate
        - Yes, if one counterparty effectively anchors both revenue and financing confidence.
      - - Actual delivery schedule
        - Show real versus promised unit delivery timing by major deployment.
        - High
        - Yes, if shipments slip materially versus the commercialization narrative.
      - - Cap table and preferences
        - Disclose liquidation stack, participation, and seniority.
        - High
        - Yes, if the structure meaningfully subordinates new money at the headline mark.
      - - Compliance posture
        - Show digital-ID, privacy, and healthcare-control readiness.
        - High
        - Yes, if regulation can interrupt key deployments.
