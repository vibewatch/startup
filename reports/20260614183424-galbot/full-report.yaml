              - CU038
      - number: '6.5'
        title: Concentration Risk and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The customer story remains promising but not fully de-risked. CATL is simultaneously Galbot's most
              strategic investor relationship and its clearest industrial customer anchor, which creates a concentration
              and governance question that public records for a private company cannot yet answer. Public deployments
              are also heavily China-centric, leaving Galbot exposed to one regulatory environment, one talent
              ecosystem, and one early-adopter market for humanoid systems. Independent adverse coverage sharpens the
              caution: TechXplore argues that humanoid supply may outpace real buyer demand because usable production
              cases are still limited, and CNBC similarly frames the sector as investor-hot but commercially immature.
              Those critiques fit Galbot's evidence pattern: public logos and rollout counts are real, but detailed
              fleet economics, renewals, and third-party validated productivity outcomes remain sparse. Multiple
              verticals and partner channels do reduce some single-market risk, yet the several-thousand-unit order
              claim still looks early relative to the scale ambitions implied by Galbot's financing rounds and
              manufacturing narrative. In short, adoption momentum is genuine, but concentration and commercialization
              quality are not yet proven at the level a later-stage industrial platform investor would want.
            claimRefs:
              - CU017
