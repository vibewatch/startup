      - number: '6.4'
        title: Retention Proxies, Expansion Motion, and Channel Dynamics
        blocks:
          - type: paragraph
            body: >-
              Galbot does not publish NRR, GRR, logo retention, churn, or contract-length data, so customer durability
              must be inferred from structural signals. The most positive proxy is operational continuity: official
              materials mention 24/7 warehouse use for over a year and continuing pharmacy deployments, which implies at
              least some customers chose to keep robots in workflow instead of removing them after pilots. A second
              proxy is strategic entanglement. CATL's dual role as investor and customer likely deepens lock-in because
              the relationship spans capital, credibility, and factory use, though that same closeness introduces
              related-party risk. Expansion motion appears to run through three channels: direct enterprise sales into
              flagship industrial and healthcare accounts, partner-mediated expansion through Bosch and UAES into
              manufacturing, and self-operated retail formats that let Galbot prove its own economics and gather data
              before selling the template outward. The pharmacy rollout target from 10-plus sites toward 100-plus also
              suggests a land-and-expand playbook if each validated workflow can be copied across additional locations.
              What remains missing is commercial quality disclosure: no public information clarifies renewal timing,
              fleet upsell rates, software attach, or how much of the installed base is paid production versus
              subsidized strategic rollout.
            claimRefs:
              - CU018
              - CU019
              - CU026
              - CU027
              - CU028
              - CU029
              - CU034
              - CU039
