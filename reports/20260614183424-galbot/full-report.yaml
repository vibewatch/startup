      - number: '1.5'
        title: Adverse context, regulation, and underwriting limits
        blocks:
          - type: paragraph
            body: >-
              The main underwriting problem is not whether Galbot is interesting; it is whether the evidence base is
              mature enough to justify its valuation and strategic narrative. Public reporting supports strong investor
              demand, state sponsorship, and visible pilots, but the company still does not publish detailed revenue,
              gross margin, profitability, or headcount metrics, and no audited financial package appears in the
              reviewed materials. That means valuation is being justified mostly through orders, deployments, strategic
              backers, and expectations about embodied-AI adoption. There are also real external risks. Regulatory
              standards in China may help formalize the humanoid-robot market, but healthcare and retail deployments
              raise liability, safety, and compliance questions, while the company’s China-centric capital and
              supply-chain exposure create geopolitical sensitivity as it works with globally recognized automotive
              brands. Investors can reasonably view Galbot as a category leader in momentum, yet still require deeper
              diligence on governance, economics, and legal resilience before treating the implied valuation as fully
              underwritten.
