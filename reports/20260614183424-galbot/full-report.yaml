      - number: '1.2'
        title: Founders, leadership concentration, and institutional network
        blocks:
          - type: paragraph
            body: >-
              Founding concentration is one of Galbot’s biggest strengths and one of its clearest risks. Public
              materials attribute the company to He Wang and Zhang Zhizheng, and those founders remain the main named
              operators across official and media coverage. That concentration matters because Galbot’s product story
              depends on the ability to integrate robotics, embodied-AI data, and vertical deployment relationships at
              high speed; it also means outside observers have limited visibility into management redundancy or
              succession planning. The company’s partner page and third-party reporting provide some comfort by showing
              links with major research and clinical institutions including Peking University, BAAI, and Xuanwu
              Hospital, alongside industrial and automotive stakeholders. Even so, the public record remains thin on
              independent board composition, formal governance, and executive depth beyond the founders. For diligence
              purposes, Galbot appears institutionally connected and technically credible, but still founder-led in a
              way that heightens key-person dependency.
