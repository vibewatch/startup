  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Galbot's product is best understood as embodied labor automation rather than as a general-purpose humanoid
              showcase. In customer workflow terms, G1 replaces repetitive pick-carry-place, scan-sort-deliver, and
              guided-service tasks in structured indoor environments where reach flexibility and continuous uptime
              matter more than expressive bipedal walking. In pharmacies the workflow is shelf scanning, medication
              identification, retrieval, and handoff; in autonomous convenience retail it is restocking, order picking,
              cashierless support, and after-hours operation inside compact 50 square meter stores; in factories it is
              routine handling, parts movement, and eventually precision assembly. The robot therefore sits between a
              mobile manipulator and a humanoid service worker: dual arms, torso lift, and a large vertical workspace
              let it operate shelves and counters built for humans, while the wheel-foot base prioritizes stability and
              runtime. This framing matters because Galbot's public deployments emphasize narrow but economically
              legible jobs rather than unconstrained household autonomy.
