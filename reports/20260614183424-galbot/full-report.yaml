companyProfile:
  summary: >
    Galbot (Beijing Galbot AI Co., Ltd.) is a Beijing-based embodied artificial intelligence company founded on 19 May
    2023 by He Wang (a Stanford-trained Peking University AI professor) and Zhang Zhizheng. The company builds the G1, a
    general-purpose humanoid robot with a wheel-foot hybrid mobility structure, and a full proprietary stack — dataset
    (10B+ data points), embodied foundation models (GraspVLA, TrackVLA, GroceryVLA), and robot hardware. Galbot has
    deployed G1 in industrial manufacturing (CATL, Mercedes-Benz, Zeekr), smart retail (Galbot Store, 30+ cities), and
    healthcare (Xuanwu Hospital, Beijing pharmacies). The company has raised over $1.15B cumulatively including a
    state-backed RMB 2.5B round in March 2026, cementing its status as China's highest-valued unlisted humanoid robotics
    company at a $3B valuation as of December 2025.
  foundedDate: '2023-05-19'
  founders:
    - name: He Wang
      role: Founder & CEO
      background: >-
        Stanford PhD in computer science / robotics; assistant professor at Peking University; expert in embodied AI and
        dexterous manipulation.
      claimRefs:
        - CO002
        - CO009
    - name: Zhang Zhizheng
      role: Co-founder & CTO
      background: >-
        Robotic systems engineer; developed Galbot's Sim2Real synthetic data methodology enabling zero-shot
        generalization to novel tasks.
      claimRefs:
        - CO002
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >
    The Galbot G1 is a general-purpose humanoid robot (wheel-foot hybrid, 173 cm standard posture, ~92.5 kg, IP54, 48V
    30Ah battery, 10-hour run time) powered by an end-to-end embodied AI platform. The G1 serves industrial assembly and
    logistics, autonomous retail store operation (Galbot Store), and healthcare assistance (pharmacy dispensing,
    hospital guidance).
  customerFocus: >
    Enterprise customers in industrial manufacturing (automotive, battery, electronics), smart retail operators, and
    hospital/healthcare institutions, with a current focus on Chinese-market deployments.
  businessModel: >
    Hardware unit sales and enterprise deployment contracts (industrial, healthcare); autonomous retail operations via
    Galbot Store (likely revenue-share or RaaS); potential software/AI model licensing. Revenue is not publicly
    disclosed.
  stage: Series C-equivalent private
  fundingStatus: >
