    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding footprint, and current product position
        blocks:
          - type: paragraph
            body: >-
              Galbot’s public identity is clearer than that of many fast-rising robotics startups. The company describes
              itself as an embodied-AI robotics builder founded in Beijing in May 2023, with its core narrative centered
              on bringing humanoid or mobile-manipulator robots into real commercial environments rather than limiting
              them to lab demonstrations. Its official surfaces point to Beijing headquarters and a broader R&D
              footprint spanning Shenzhen, Suzhou, and Hong Kong, which is consistent with a company trying to combine
              frontier model work, hardware integration, and commercial deployment support. The flagship G1 platform is
              positioned for industrial, retail, and healthcare workflows, while the developer portal and application
              bundle indicate Galbot is trying to build a software and ecosystem layer around the robot rather than
              treating it as a one-off hardware showcase. The result is a company that looks more like a full-stack
              commercialization effort than a research project, even though many product and financial details still
              come from company-controlled channels.
