      - number: '3.3'
        title: Capability, pricing, GTM, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Capability comparison is less about raw demo theatrics and more about which company can combine
              manipulation, navigation, deployment maturity, and enterprise integration in the same package. Galbot's
              published stack is unusually vertical: it claims in-house data, models, hardware, and a named family of
              VLAs for grasping, navigation, and retail workflows. AgiBot and Figure look most similar in trying to own
              both body and intelligence layers, while Unitree is more transparent on public entry pricing and Physical
              Intelligence is strongest as a generalist software abstraction. On go-to-market, Galbot's named
              deployments with CATL, Mercedes-Benz, Zeekr, hospitals, and a multi-city retail footprint suggest
              enterprise-led selling through reference accounts and policy access rather than a consumer or research-led
              funnel. Trust posture also matters: buyers will weigh named deployments, safety signaling, and standards
              alignment more heavily than headline benchmark videos, especially as regulation and liability frameworks
