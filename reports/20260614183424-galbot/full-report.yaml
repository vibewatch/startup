appendices:
  - id: A
    title: Methodology and Source Coverage
    blocks:
      - type: paragraph
        body: >
          This report is based entirely on publicly available sources reviewed between 2025-06-01 and 2026-06-14.
          Primary sources include Galbot's official website (www.galbot.com and developer.galbot.com), PRNewswire press
          releases, and regulatory statements from China's MIIT/SCIO/Xinhua. Secondary sources include TechNode, The
          Robot Report, CnTechPost, Yicai Global, China Daily, TechXplore, CNBC, TrendForce, Deloitte, and Hill
          Dickinson. Competitor data is drawn from official company pages (Figure.ai, AgiBot.com, Unitree.com, XPENG,
          Physical Intelligence). No non-public documents, data rooms, or management interviews were used.
        claimRefs: []
      - type: paragraph
        body: >
          Key gaps: Galbot does not publish financial statements, revenue, headcount, gross margin, or unit economics.
          Orders are reported as "several thousand units" without delivery timelines. Healthcare privacy compliance
          posture is not publicly documented. All financial estimates are analyst and media inferences; no audited data
          is available.
        claimRefs: []
