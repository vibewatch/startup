      - number: '7.3'
        title: Operational reliability and productization risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is still the biggest bridge between an impressive prototype narrative and a resilient
              business. Public sources support the view that humanoid systems are getting better quickly, but they also
              show how much has to go right before a buyer sees repeatable savings. Factory deployments need very high
              accuracy and uptime, while embodied-AI mistakes can spill into physical incidents instead of quietly
              degrading a dashboard metric. Deloitte’s physical-AI warning matters more in this category than in pure
              software because hallucination and perception errors can move actuators around people. Battery integrity,
              tactile sensing, and cyber hardening add more layers. TechXplore and Associated Press coverage are also
              valuable because they frame the current commercial bottleneck as demand and trust rather than raw
              production speed, which is exactly the kind of risk that can remain hidden until after large amounts of
              capital have been spent.
