      - number: '1.3'
        title: Funding history, valuation step-up, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Galbot’s financing trajectory is the strongest external validation point in the chapter. The company’s
              early capital path reportedly moved from seed in June 2023 to angel and angel-plus rounds later that year,
              then to a several-hundred-million-RMB round in March 2024. By mid-2025, multiple outlets described a
              roughly RMB1.1 billion or approximately $151-153 million financing tied to CATL-linked capital and
              Bosch-related strategic cooperation. The fundraising pace accelerated again in late 2025, when
              company-linked and independent reports described more than $300 million of new funding at roughly a $3
              billion valuation and about $800 million of total capital raised. In March 2026, state-backed investors
              reportedly led an additional RMB2.5 billion round, pushing Galbot beyond pure venture sponsorship into
              nationally strategic capital channels. That capital stack is impressive, but the valuation logic remains
              expectation-heavy because revenue, margins, and headcount are still not publicly disclosed in detail.
