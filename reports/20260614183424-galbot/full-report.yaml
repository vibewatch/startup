  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Bull case
      - Bear case
      - Resolution needed
    rows:
      - - Market position
        - China’s shipment leadership and manufacturing depth can let Galbot compound faster than many foreign peers.
        - A crowded domestic market and lower China multiples can cap upside despite scale.
        - Need evidence of durable share in priority verticals.
      - - Product moat
        - Full-stack models, data, and hardware can create integrated learning loops.
        - VLA convergence can shrink differentiation faster than management expects.
        - Need external proof that data and model advantages translate into superior field outcomes.
      - - Commercial proof
        - CATL and other deployments show Galbot is beyond pure prototype stage.
        - A few reference logos can still hide concentration and weak repeat buying.
        - Need repeat-order and multi-customer expansion evidence.
      - - Capital base
        - State-backed investors provide durability and policy access.
        - Unknown preferences and concentration could leave junior investors under-protected.
        - Need cap table, terms, and governance detail.
      - - Team quality
        - He Wang’s technical profile supports the embodied-AI narrative.
        - Founder concentration raises execution load as commercialization broadens.
        - Need org depth and operating cadence evidence.
      - - Regulatory context
        - Standards can raise barriers to weaker competitors over time.
        - Compliance, recall, and privacy obligations can slow value realization first.
        - Need practical evidence of compliance readiness and healthcare/privacy controls.
    notes: >-
      The table frames each thesis pillar against the anti-thesis investors must resolve before underwriting the current
      price aggressively.
