      - number: '2.3'
        title: Buyer segmentation, budget owners, and Galbot relevance
        blocks:
          - type: paragraph
            body: >-
              The most credible near-term buyers are enterprises with repetitive physical workflows and either labor
              scarcity or a strong willingness to trial automation. Industrial manufacturing is the clearest beachhead
              because the workflow is structured, safety boundaries can be managed, and budget ownership usually sits
              with plant operations, industrial engineering, or automation teams. Warehouse logistics is similar but has
              harsher ROI scrutiny because buyers already compare humanoids against conveyors, AMRs, and other
              specialized systems. Retail and service deployments create visible proof points, yet many remain brand or
              experience budgets rather than hard productivity budgets. Healthcare and eldercare have strong long-run
              pull because aging populations are a structural demand driver, but certification, liability, and workflow
              sensitivity make scaling slower. Galbot's publicized deployments in industrial manufacturing, retail, and
              healthcare suggest its real near-term market is a vertical-by-vertical enterprise adoption path, not a
              generic consumer-robot story.
