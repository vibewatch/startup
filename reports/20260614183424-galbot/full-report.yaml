  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Galbot's relevant market is narrower than "all robotics" and broader than "humanoid hardware shipments."
              The practical boundary is enterprise humanoid systems deployed into physical workflows, together with the
              embodied-AI software, training data, integration, and services needed to make those systems useful. That
              means the chapter includes industrial manufacturing, warehouse logistics, retail-service, and healthcare
              deployments, because those are the segments repeatedly cited in current market coverage and in Galbot's
              own commercialization messaging. It excludes generic industrial automation, AGVs, cobots, and
              software-only AI categories unless a humanoid form factor is central to the buyer's use case. The
              status-quo competition is therefore not just other humanoid startups; it is also human labor, fixed
              automation, workflow-specific robots, and delayed automation spending. That definition matters because a
              broad trillion-dollar TAM can be directionally true while still overstating Galbot's near-term serviceable
              market.
