      - number: '7.5'
        title: Mitigations, monitoring, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Galbot is not unprotected. Its full-stack architecture can reduce dependence on outside vendors for the
              most strategic parts of the product, and state-backed investors plus reference deployments across
              industrial, retail, and healthcare settings provide a stronger foundation than many earlier humanoid
              startups enjoyed. The regulatory framework is also double-edged in a helpful way: once clear standards and
              digital identity workflows are internalized, better-capitalized vendors may benefit from barriers that
              smaller competitors cannot clear. But those mitigants do not erase the central diligence asks. Investors
              still need proof that compliance workflows are operational, that CATL concentration is not overwhelming,
              that uptime and service costs support the labor-replacement story, and that one serious field incident
              would not cascade into a recall and financing problem. The right stance is therefore monitored conviction
              rather than blanket skepticism.
