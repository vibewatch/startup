  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and ranking
        blocks:
          - type: paragraph
            body: >-
              Galbot’s risk profile is not dominated by a single existential flaw. The company has credible financing,
              visible deployments, and a national-market tailwind, but those positives can mask how many dependencies
              must all work together before humanoid economics become durable. The most severe risks sit where policy,
              commercialization, and concentration intersect. China’s standards and digital-ID regime can ultimately
              help trusted vendors, yet in the near term they create concrete compliance gates and recall obligations.
              At the same time, public reporting still shows that buyers are harder to win than robots are to build, so
              scale assumptions can fail even if the technology demos well. Add CATL concentration, high hardware
              capital intensity, and undisclosed revenue metrics, and the downside case becomes cumulative rather than
              isolated.
