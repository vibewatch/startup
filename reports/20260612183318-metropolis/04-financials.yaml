  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Revenue by stream, gross margin, EBITDA, and cash flow.
    whyItMatters: Without these core metrics the financial chapter cannot graduate from directional to underwritten.
    diligencePath: Request management financial package with monthly bridge and cohort cuts.
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
    relatedQuestionRefs:
    - QI011
    - QI021
    - QI025
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, runway, debt covenant package, and refinancing calendar.
    whyItMatters: Capital-market dependency is central to the model, so liquidity detail materially affects risk.
    diligencePath: Request treasury snapshot and debt documents.
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-partner, and top-segment revenue concentration.
    whyItMatters: Revenue quality and resilience cannot be judged from aggregate transaction volume alone.
    diligencePath: Request concentration and retention cohort data.
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: Public contract examples or third-party pricing disclosures for enterprise deployments.
    whyItMatters: Public surfaces show monetization modes but not realized economics.
    diligencePath: Collect contract samples, procurement awards, or customer-quoted economics.
    relatedTableRefs:
    - TI002
