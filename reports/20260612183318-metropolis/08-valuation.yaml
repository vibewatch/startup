  - CV035
  - CV036
  - CV037
  - CV041

- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - EBITDA quality and bridge
    - Detailed bridge from $29.5M reported to $209M run-rate adjusted EBITDA
    - Entire valuation rests on this adjustment; credit markets already rejected it as unsupported
    - Management/CFO presentation; lender information package from JPMorgan syndication
  - - Software subscription penetration
    - Number and percentage of locations on Vision-tier ($15/space/month) subscription
    - Determines whether SaaS platform premium is justified; key to margin expansion thesis
    - Request from investor relations or Series D investor update deck
  - - Non-parking vertical revenue
    - Actual revenue or signed contracts from drive-thrus, fueling, hospitality verticals
    - Platform TAM expansion is the primary bull case; no disclosed evidence of traction
    - Customer references; press releases; Series D investor update
  - - Regulatory compliance cost
    - Post-Tennessee settlement compliance technology and legal cost run-rate
    - Tennessee set a national template; incremental AG actions add to this cost base
    - Legal counsel; AG settlement terms; privacy policy change log
  - - Leverage covenant headroom
    - Actual leverage ratio as of Q1 2026 and distance to covenant thresholds
    - 12.4x leverage with B3/B- rating; covenant breach risk is a near-term threat
    - Lender information agent; credit agreement filed or summarized in financing docs
  - - Cap table and preference stack
    - Full cap table detailing Series A through D preference amounts and liquidation waterfall
    - $342M Series D preferred plus $1.05B Series C preferred creates layered overhang
    - Legal counsel; secondary market transaction data; investor data room
  notes: >-
    Diligence asks prioritize EBITDA quality verification as the single most material open question;
    items ranked by materiality to investment decision, not likelihood of resolution.
