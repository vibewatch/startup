    - See quarterly EBITDA disclosures; validate synergy capture pace
  - - Regulatory resilience
    - Settlement resolved Tennessee; national scale provides lobbying leverage
    - Tennessee precedent cited by other AGs; DPPA class action pending certification
    - Class certification decision; multi-state AG coordination signals
  notes: >-
