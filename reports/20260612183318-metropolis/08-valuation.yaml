- id: recommendation-and-final-diligence-asks
  title: Recommendation and final diligence asks
  body: >
    Metropolis is a genuinely exceptional business by network scale, technological differentiation, and
    market-position metrics. The Recognition Economy thesis is coherent and the platform optionality is real.
    However, the $5 billion valuation demands a level of evidence—specifically, sustained EBITDA expansion
    from $29.5 million actual toward the $209 million run-rate marketed figure—that is not yet available in
    public sources. Until that trajectory is confirmed through at least two fiscal quarters of disclosed
    results, underwriting a $5 billion mark is speculation on a single optimistic scenario.
    The appropriate recommendation is research-more. The primary diligence unlock is access to actual EBITDA
    and free cash flow disclosures for Q1–Q2 2026. Secondary unlocks are: the pace of software subscription
    penetration within the SP+ location portfolio; actual regulatory compliance cost structure following the
    Tennessee settlement; and confirmation of the term loan covenant headroom. A clean resolution of the DPPA
    class action would be a significant positive catalyst. If those unlocks confirm the run-rate trajectory
    and leverage falls to 8–9x by mid-2026, the valuation stance would move from stretched to fair and the
    recommendation would upgrade to track with a path to buy pending IPO price discovery.
    Confidence is medium because the underlying operating assets are real, the network position is defensible,
    and multiple credible institutional investors have committed capital at or near the $5 billion mark. But
    the EBITDA quality gap and leverage level mean that downside scenarios, while less likely, carry severe
    magnitude. The risk rating is high.
  claimRefs:
  - CV001
