- id: exit-readiness-and-thesis-break-triggers
  title: Exit readiness and thesis-break triggers
  body: >
    Metropolis's potential exit paths include IPO, strategic acquisition, or secondary sale. The IPO path
    requires demonstrable EBITDA margin expansion, leverage reduction toward 5–6x, and preferably two to
    three quarters of forward guidance visibility. Given the current 12.4x leverage and the gap between
    reported and run-rate EBITDA, an IPO before 2027–2028 appears unlikely unless the adjusted EBITDA
    trajectory is validated through quarterly disclosures. The 2026 CNBC Disruptor 50 listing and TIME100
    Most Influential Companies designation reinforce brand equity that would support a public offering, but
    brand equity alone does not resolve the debt-to-EBITDA overhang.
    Strategic acquirers could include large commercial real estate technology platforms (CoStar, JLL, CBRE),
    payment infrastructure companies seeking physical-world transaction data, or mobility data aggregators.
    A strategic premium of 15–20% above market valuation is historically standard for control transactions
    in this sector, but a strategic buyer would apply leverage discount similar to credit markets, moderating
    the expected exit multiple.
    Six thesis-break triggers warrant active monitoring: (1) If reported EBITDA does not progress toward $100
    million by end of FY2026, the run-rate adjustment story is failing. (2) Multi-state regulatory coordination
    following the Tennessee AG precedent that forces material operational changes is a kill criterion for the
    data flywheel. (3) DPPA class certification would materially elevate cash exposure and restrict enforcement
    practices. (4) Any term loan covenant breach would precipitate a credit crisis given the refinancing
    environment. (5) Departure of Alex Israel or Courtney Fukuda without a succession plan creates an
    execution vacuum in an operationally complex company. (6) Platform extension revenue below $50 million
    ARR by end of 2026 signals the vertical expansion thesis is not converting.
  claimRefs:
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
  - CV037
