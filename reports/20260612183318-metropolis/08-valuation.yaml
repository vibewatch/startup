- id: TV005
  title: Thesis-break and kill triggers
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - EBITDA stagnation
    - Reported EBITDA remains below $100M by December 2026
    - Invalidates run-rate adjusted EBITDA narrative; $5B valuation unsupported
    - Exit or avoid; no path to debt service without EBITDA improvement
  - - Multi-state AG coordination
    - Two or more state AG investigations opened within 12 months of Tennessee settlement
    - Compliance cost escalation; operational constraint on LPR data practices
    - Material negative; reduces data flywheel asset value and expands litigation liability
  - - DPPA class certification
    - Federal court grants class action status in DPPA lawsuit
    - Per-violation statutory damages at scale could be hundreds of millions
    - Existential risk to enforcement model; triggers settlement negotiations
  - - Term loan covenant breach
    - Any interest-coverage or leverage covenant violation flagged in lender communications
    - Forces costly waiver or amendment; signals EBITDA-to-plan gap becoming critical
    - Credit downgrade; refinancing risk at significantly worse terms
  - - Key-person departure
    - CEO Alex Israel or CIO Courtney Fukuda departing the company
    - Founder-controlled culture; no disclosed succession plan; integration depends on leadership
    - Discretionary negative; pause commitments until succession plan articulated
  - - Platform extension failure
    - Non-parking vertical revenue below $50M ARR by end of 2026
    - Platform TAM narrative unsupported; company remains a parking operator, not a platform
    - Downgrade valuation to parking-operator comps (~$1.5B); avoid new investment
  notes: >-
    Kill triggers reflect known risk dimensions; probabilities not assigned due to private information
    constraints; each trigger includes a specific observable threshold enabling ongoing monitoring.
