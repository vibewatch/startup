  figureRefs:
  - FE002
  - FE004
- id: deployment-reliability-and-trust
  title: Deployment, reliability, and trust controls
  body: Metropolis appears to ship through a deployment model that is as operational as it is technical. Launch stories and
    live-operations content suggest that each rollout depends on site readiness, partner coordination, and repeatable playbooks,
    not just configuration in the cloud. Support, privacy, and terms pages reinforce that the system must manage identity
    data, billing exceptions, and customer trust continuously after go-live. This is both a moat and a risk. When the workflow
    works, it produces frictionless movement; when it fails, the customer notices immediately because access, billing, or
    support is affected. Public materials document policies and product flows, but they do not disclose uptime, false-read
    rates, or support resolution metrics. That leaves reliability as one of the most important unresolved technical diligence
    questions. It also means technical diligence should include live-site edge cases, not only architecture reviews or product
    demos.
  claimRefs:
  - CE008
  - CE015
  - CE016
  - CE017
  - CE018
  - CE022
  - CE023
  - CE026
  - CE028
  - CE031
  - CE034
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: differentiation-and-roadmap-verdict
  title: Differentiation and roadmap verdict
  body: "Metropolis\u2019 public differentiation case rests on integrated control. The company is not merely promising payment\
    \ convenience; it is arguing that recognition, data feedback loops, facility integrations, and operational execution together\
    \ create a better movement experience. The recognition-economy language and the Oosto acquisition both support a thesis\
    \ that management wants broader identity infrastructure, not only parking software. Still, evidence of maturity is uneven\
    \ across the roadmap. Parking is clearly live, adjacent airport and venue flows are credible, and cross-vertical ambition\
    \ is visible, but public proof is thin on fully scaled non-parking deployments. The best product judgment is that Metropolis\
    \ has a real technical and workflow edge, yet its moat likely comes from combining software, data, and operations rather\
    \ than from a standalone algorithmic breakthrough. The roadmap is believable, but investors should weight proven parking\
    \ execution far more heavily than future category narrative. The most defensible product thesis today is therefore depth\
    \ in one core workflow, not breadth across every promised vertical."
