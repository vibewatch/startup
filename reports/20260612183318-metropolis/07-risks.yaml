  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: loan-covenants
    missingEvidence: Full covenant package, maintenance tests, EBITDA definition, and cure rights for the 2025 $1.1B term loan.
    whyItMatters: Covenant breach is the fastest path to a distressed event; without the package, financial fragility cannot be quantified.
    diligencePath: Request credit agreement directly from Metropolis CFO or arrange direct lender review.
    relatedQuestionRefs:
    - QR008
    - QR019
  - type: private-evidence-only
    severity: material
    topic: labor-costs
    missingEvidence: SP+ unionized workforce share, active CBAs, and total fixed labor cost obligation post-acquisition.
    whyItMatters: Unionized labor creates fixed cost that cannot be reduced quickly, materially affecting EBITDA sensitivity.
    diligencePath: Request SP+ HR integration summary and any CBA inventory from operations leadership.
    relatedQuestionRefs:
    - QR020
