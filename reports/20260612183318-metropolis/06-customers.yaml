company:
  name: Metropolis
chapter:
  number: 6
  title: Customers
  summary: Metropolis has real public customer proof across airports, hospitality, mixed-use, transit, and event venues, with
    airport evidence standing out as the strongest and most corroborated. Public member and location metrics support broad
    adoption, but they do not answer the harder customer questions around retention, concentration, and renewal quality. The
    visible customer base looks diversified by use case, while durability still requires management-only contract and cohort
    data.
sections:
- id: customer-segmentation-and-use-cases
  title: Customer segmentation and use cases
  body: Metropolis serves more than one customer at once. The enterprise relationship usually appears to sit with a property
    owner, operator, airport, or venue manager, while the day-to-day user is the driver and the payer can be either the parker
    or an enterprise sponsor through validation or bundled access. Public customer proof also shows that use cases stretch
    well beyond ordinary commuter lots. Airports, resorts, mixed-use districts, transit hubs, and event environments all appear
    in the visible source pack. That breadth matters because it suggests Metropolis can apply the same recognition and payment
    workflow across several high-traffic physical contexts. The caveat is that public materials do not disclose which segments
    contribute the most revenue or which buyer personas close fastest. Segmentation breadth is proven; segment economics are
    not. Diversity of visible references should therefore be treated as fit evidence rather than as a proxy for balanced revenue
    mix.
  claimRefs:
  - CU001
  - CU002
  - CU014
  - CU015
  - CU023
  - CU027
  - CU031
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption trajectory
  body: The clearest customer proof comes from airports and named venue deployments. Airport evidence is unusually strong
    because it includes company-authored material, a partner proof source in AeroParker, and a third-party customer release
    from El Paso. Additional examples from San Antonio, Miami Worldcenter, Philadelphia Amtrak, La Cantera, Hyatt, Super Bowl
    operations, 915 La Brea, Frost Tower, and UCHealth show that Metropolis is not limited to one narrow environment. Member
    counts and location counts further support real adoption at scale, but those metrics describe the breadth of the network
    more than the depth of enterprise account penetration. In other words, the public record supports widespread usage and
    credible production deployments, yet it still leaves the precise account base and customer-level outcomes opaque. It is
    safer to say adoption is proven directionally than to claim customer outcome evidence is complete. The evidence stack
    is broad enough to prove presence, but not yet deep enough to prove customer economics.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU012
  - CU013
  - CU018
  - CU019
  - CU023
  - CU024
  - CU025
  - CU031
  - CU033
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
- id: durability-satisfaction-and-concentration
  title: Durability, satisfaction, and concentration
  body: 'Durability is where the customer evidence becomes thinner. App stores, support pages, BBB complaints, Trustpilot
    reviews, and recent settlement-related consumer coverage show an active user layer and visible support burden, but they
    do not translate directly into enterprise renewal health. Public materials do not disclose NRR, GRR, contract length,
    top-customer exposure, or renewal cadence. That means the largest unresolved customer questions are concentration and
    retention, not whether the product has found real users. The anti-thesis is straightforward: a very large member base
    could still sit on top of a relatively concentrated set of operator relationships. The positive counterpoint is that the
    diversity of vertical references makes a single-use-case story unlikely. Even so, without contract and cohort data, durability
    remains only partially underwritten. Complaint evidence should be treated as signal, not as a quantified churn proxy.
    Direct customer interviews and contract samples would matter far more here than additional marketing case studies.'
  claimRefs:
  - CU016
  - CU017
  - CU020
  - CU026
  - CU029
  - CU030
  - CU032
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: channels-partners-and-expansion
  title: Channels, partners, and expansion
  body: 'The customer chapter also points to a channel and expansion story. AeroParker adds airport ecommerce and reservation
    value, while Joby points to a more speculative advanced-mobility future. Contact and travel-facing content imply that
    enterprise selling and ecosystem partnerships matter at least as much as consumer self-serve acquisition in the highest-value
    segments. The likely pattern is land-and-expand: win a facility or operator, prove throughput and customer experience
    gains, then add more locations or adjacent services. Public evidence supports that thesis indirectly through network scale
    and multiple vertical references, but not through disclosed cohort expansion metrics. The practical takeaway is that Metropolis
    appears commercially repeatable, though still under-documented where investors care most: procurement friction, win rates,
    and renewal behavior. Investors should treat the partner layer as both an accelerator and a dependency that needs direct
    diligence. In customer diligence terms, channel quality and contract structure may matter almost as much as raw demand
    generation.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU021
  - CU022
  - CU028
  - CU033
  - CU034
  tableRefs:
  - TU005
  figureRefs:
  - FU004
