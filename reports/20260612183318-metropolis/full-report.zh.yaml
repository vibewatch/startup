  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与可见界面
        blocks:
          - type: paragraph
            body: >-
              Metropolis 不只是一个停车
              App。公开产品和支持页面展示了一套流程：车辆到达时开始，经过识别和支付，在出现例外时以自助支持或订阅管理收尾。因此，交付出来的产品是实体场地自动化、身份解析、支付捕获和消费者账户管理的组合。可见界面包括临时停车、月租订阅、支持和争议处理，以及活动或场馆运营场景。公司叙事还把同样流程延展到机场和其他现实世界流动类别。因此，合适框架是一个拥有多个入口点的产品系统，而不是单一
              SKU。公开证据对用户体验最强，对各界面背后的商业包装弱得多。它还提示，同一核心流程可针对机场、度假村或场馆运营方进行不同包装，而无需改变识别主干。这种包装灵活性具有战略价值，因为它扩大了公司可瞄准的实体环境数量。
