        - Verra 为 FCF 正且政府合同确定性更强；Metropolis 风险更高
      - - REEF Technology（私有，2021 年 Series D）
        - 最新已知估值
        - ~$1.35B（2021 年）；此后经历重大重组
        - 大型停车科技平台；未能守住估值
        - 负面可比信号；REEF 收缩削弱牛市情景的同业集合
      - - Amazon Just Walk Out（可比技术）
        - 战略方向
        - 从 Fresh 杂货店收缩（2024 年）；继续授权许可
        - 说明无感结账技术规模化时的现实摩擦
        - Amazon 资源远超 Metropolis；更适合衡量垂直扩张风险，而非估值
      - - 停车管理市场（MarketsandMarkets 2025）
        - 2025 至 2030 年市场规模
        - $7.22B 增至 $12.41B，CAGR 11.4%
        - 定义 Metropolis 核心垂直领域的目标市场增长率
        - 总市场包括硬件、软件和服务；Metropolis 只能拿到其中一部分
    enumerationScope:
      coverage: partial
      basis: >
        Selected comparables from public filings, analyst market reports, and credible press coverage; covers the most
        directly relevant public company peers, private market comparables, and technology analogies available given
        Metropolis's private status and limited financial disclosure as of June 2026.
    notes: 倍数反映截至 2026 年 6 月的公开可得数据；Metropolis 没有公开财务数据，因此 EBITDA 倍数采用 Octus 报道的运行率调整后数据（$209M）作为最佳可得代理。
    claimRefs:
