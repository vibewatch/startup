      - number: '3.3'
        title: 切换成本、多归属与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Metropolis 最可信的公开护城河不是某个单一算法功能，而是版图、会员规模、运营肌肉和可复用需求渠道的组合。超过 20 million 会员、每月 1 million
              新会员，以及庞大的现场服务队伍，可以形成更轻量对手难以匹配的分发和执行优势。但这些优势并非绝对。司机仍可在多个 App
              间多归属，业主仍可在运营商栈之上叠加市场平台，传统运营商仍可通过关系和服务防守客户。因此，风险章节应把护城河耐久性视为真实但不完整。Metropolis
              在整合执行上似乎强于许多同行，但尚未对预订、支付或低资本替代方案免疫。最强反方论点是，即使 Metropolis 提供更丰富的长期平台，买方也可能偏好模块化采用路径。
