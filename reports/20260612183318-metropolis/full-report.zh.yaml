      - number: '2.2'
        title: 买方、用户、付款方与预算所有者
        blocks:
          - type: paragraph
            body: >-
              买方结构因细分市场而变。机场通常有最清晰的机构买方逻辑，因为停车既关乎旅客体验，也是重要的非航空收入来源。办公和综合地产通常由物业管理方、业主或外包运营商决策，而司机、租户和访客才是实际用户。酒店、医疗和活动场景也遵循同样模式：物业或场馆运营方选择系统，终端用户是客人或访客，付款方往往是司机。因此，Metropolis
              的价值主张异常跨职能。它必须同时满足收入管理者、运营团队、财务负责人和客户体验利益方。好处是，在所有这些环境和多类买方角色中，停车是少数今天仍共同存在的高频实体触点之一。
