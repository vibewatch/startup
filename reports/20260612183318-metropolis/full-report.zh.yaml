      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              公开证据中最强的采用驱动因素是收入改善、摩擦降低和运营复杂度下降。机场关心非航空收入和更顺畅的旅客旅程。地产业主关心在不投入重大资本开支的情况下快速上线。Metropolis 还试图把用户体验做得无缝，再与
              Bilt、AeroParker
              等忠诚度和预订生态连接起来，制造需求侧拉力。这些驱动因素真实存在，但采用并非无摩擦。买方仍要面对标识、支持、核销、车道运营和数据治理上的变更管理风险。基于识别的系统也会引入隐私和消费者保护考量。Tennessee
              和解不是对整个品类的市场级否定，但它证明实施质量和合规足以影响买方信任和采用速度。
