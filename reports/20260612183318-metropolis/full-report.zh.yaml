            body: >-
              公开材料中可见的架构像一个混合栈。停车流程意味着摄像头或其他场地硬件、识别逻辑、身份和账户匹配、支付以及支持工具。工程文章进一步强化了这一解读，描述了机器学习工作和横跨数十亿边缘事件的近实时监控。招聘和团队内容显示，公司内部工程组织已有足够规模，可以维护专门岗位和职业阶梯。合在一起，这些来源暗示
              Metropolis
              已不再是第三方工具外面的一层薄封装。与此同时，公开证据没有披露基准准确率、模型治理指标或精确系统边界。投资人可以推断其技术深度有意义，但无法判断专有模型优势、运营调优和普通软件工程卓越之间的精确拆分。机场和 SP
              Plus 材料还暗示，这套栈必须扛住远大于创业公司试点的运营环境。
