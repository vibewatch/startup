  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现界面
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是交易型、与运营商挂钩的收入模式，而不是纯软件订阅故事。Metropolis
              在自有或托管地点直接从停车场次变现，支持预订和月租停车，如今还谈到把同样的识别和支付自动化带入酒店、加油和快餐餐厅。因此，合适框架是分层模型：停车带来的运营收入、预订和核销带来的渠道经济性，以及新垂直中潜在的类软件变现。公开记录没有给出的是实际定价。消费者界面和支持页面展示用户如何交易，但不披露抽佣率、合同条款或实际伙伴经济性。这家公司有许多变现杠杆，但公开披露只揭示界面，没有揭示详细拆分。它也提示会计呈现可能很乱，因为停车总收款、净留存费用和伙伴结算流可能因地点和合同结构而有实质差异。没有细分披露，投资人无法判断哪些界面真正贡献收入，哪些只是改善转化。
