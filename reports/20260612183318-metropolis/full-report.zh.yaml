      - number: '6.4'
        title: 渠道、伙伴与扩张
        blocks:
          - type: paragraph
            body: >-
              客户章节也指向一个渠道和扩张故事。AeroParker 增加机场电商和预订价值，Joby
              则指向更具猜想性的先进出行未来。联系和面向出行的内容暗示，在最高价值细分市场中，企业销售和生态伙伴关系至少与消费者自助获客同样重要。可能模式是
              land-and-expand：先赢下一个设施或运营商，证明吞吐量和客户体验收益，再增加更多地点或相邻服务。公开证据通过网络规模和多个垂直引用间接支持这一论点，但没有披露队列扩张指标。实际结论是，Metropolis
              看起来商业上可重复，但在投资人最关心的采购摩擦、胜率和续约行为上仍记录不足。投资人应把伙伴层既视为加速器，也视为需要直接尽调的依赖。在客户尽调语境中，渠道质量和合同结构可能几乎与原始需求生成同样重要。
