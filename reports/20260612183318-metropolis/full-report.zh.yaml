            body: >-
              最强的公开牵引力标记是会员数、地点数、交易量和增长节奏。Metropolis 在 2025 年 11 月引用近 20 million 会员和超过 $5 billion
              年交易额，之后公司材料又提高了会员数，并描述每月 18 million 次车辆事件。这些都是有意义的规模信号，但不能替代 ARR 年经常性收入（ARR）、收入或队列经济性。盈利叙事也一样。Reuters 称
              Metropolis 已盈利，CNBC
              称毛利率在改善，但两家媒体都没有提供投资人检验利润质量所需的数字桥。正确结论是，规模已被证明，单位经济性只是被暗示而非披露。重要的是，这种模糊性同时留下了非常有吸引力的利润率故事，以及一个运营负担重得多的故事。
