    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与总部信号
        blocks:
          - type: paragraph
            body: >-
              更准确地说，Metropolis 是一家创始人主导的 AI 基础设施公司，起点是停车，眼下试图把基于识别的结账能力推广到更广义的现实世界商业。最强的身份来源包括公司关于页面、停车产品页，以及 CNBC 和
              Reuters 的融资报道。合在一起，这些材料支持 2017 年创立、Alex Israel
              是反复出现的高管面孔，以及围绕计算机视觉、自动通行和无摩擦支付搭建的核心主张。公开总部信号没有用户简报中那么干净：已审阅来源反复指向 Los Angeles 或 Santa Monica，而不是
              Chicago；公司网站也更强调使命和平台，而非详细企业档案。因此，本章应把 Southern California 视为证据最扎实的运营身份，同时承认多次收购之后，Metropolis
              已管理一支全国分布的员工队伍和资产版图。
