      - number: '7.4'
        title: 运营、伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Metropolis 的运营风险集中在三处。第一，传统 SP+ 技术迁移制造了一个近期阶段：两套支付栈并行运行，提高计费错误、定价不一致和消费者投诉概率，可能触发新的执法兴趣。TN
              和解本身就把技术故障列为意外费用的贡献因素，BBB 投诉和 Trustpilot 评价也记录了持续的计费争议和退款困难模式；这一模式早于和解，并延续到 2026 年。第二，公司的摄像头支付模式依赖 LPR
              准确率和正常运行时间。高流量场馆或机场任何重大宕机都会直接损害企业关系，并制造消费者责任。公开材料尚未确认 SLA、正常运行时间承诺或 SOC 2
              审计报告，网络安全和可用性姿态对尽调仍不透明。第三，对少数战略伙伴的依赖造成集中度风险。AeroParker 处理机场电商和预订整合；其对 Metropolis
              机场细分的价值与自身规模不成比例，因此任何伙伴关系恶化都会形成收入风险。Joby Aviation 合作引入了具有愿景色彩的 vertiport 依赖，最早也不太可能在 2028
              年前规模化兑现。云基础设施集中度和单一大型债务交易对手方（JPMorgan）补齐了依赖图谱。Bilt Rewards
              集成在忠诚度层制造金融服务依赖，增加间接信用敞口。单个依赖孤立来看都不致命，但合在一起，Metropolis 在技术、渠道和资本维度的冗余有限。
