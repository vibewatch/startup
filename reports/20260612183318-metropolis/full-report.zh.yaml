      - number: '8.2'
        title: 融资背景、资本结构与估值纪律
        blocks:
          - type: paragraph
            body: >
              Metropolis 当前资本结构，是 SP+ 收购之上连续叠加三轮融资的结果。2024 年 5 月，公司完成 SP+ 私有化交易，资金包括 $1.05 billion Series C 优先股和 $550
              million 定期贷款，出资方包括 Eldridge Industries、BDT & MSD Partners、Vista Credit Partners 和 Temasek。2025 年 11
              月，JPMorgan 牵头一笔 $1.1 billion 定期贷款，定价 SOFR+425–450 个基点，用于再融资上述私募信贷债务；同时公司完成 $500 million Series D 股权融资，投后估值
              $5 billion，由 LionTree 领投，Eldridge、SoftBank、DFJ、Tekne Capital、Vista 和 BDT & MSD 参投。其中 $342 million 被设计为
              Series D 优先股，在清算优先顺位上高于普通股，实际上抬高了清算优先权堆栈。关键估值纪律问题在于，$5 billion 估值是否有可融资的证据支撑。S&P 的稳定展望预计杠杆率从 2025 年的 12.4x
              降至 2026 年的 8.1x，前提是 EBITDA 从 2025 年实际 $29.5 million 扩张到 $209 million run-rate adjusted EBITDA；这意味着 609%
              改善，而信用市场给出的 SOFR+425–450 bps 利差正是在定价这种风险。债务投资人不愿按营销价格承诺出资，机构还预期定价会走阔至 SOFR+500 bps，
              说明市场对调整口径持怀疑态度。公司累计融资总额超过 $3.5 billion。Metropolis 的定价页确认 Vision 档订阅产品按每车位每月 $15 收费，为经常性收入提供了可验证锚点；
              但有多少安装基数从交易型收费转向软件订阅收费，公司没有披露。投资人的进入纪律，需要在停车运营商估值锚（SP+ 以约 0.84x 2023 年收入被收购，意味着常规运营资产价值远低于 $5 billion）
              与平台溢价之间交叉验证；后者只有在 Metropolis 成功把 50 million 客户货币化为软件生态后才会兑现。清算优先权堆栈也意味着，即使中等退出场景下，普通股持有人仍会面对实质稀释。
            claimRefs:
