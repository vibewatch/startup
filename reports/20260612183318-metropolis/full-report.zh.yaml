  - id: TV005
    title: 论点破裂与终止触发因素
    columns:
      - 触发因素
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - EBITDA 停滞
        - 到 2026 年 12 月，已报告 EBITDA 仍低于 $100M
        - 推翻运行率调整后 EBITDA 叙事；$5B 估值缺乏支撑
        - 退出或回避；没有 EBITDA 改善，就没有偿债路径
      - - 多州总检察长协同
        - Tennessee 和解后 12 个月内，两个或更多州总检察长启动调查
        - 合规成本上升；LPR 数据实践受到运营约束
        - 实质负面；降低数据飞轮资产价值，并扩大诉讼责任
      - - DPPA 集体认证
        - 联邦法院批准 DPPA 诉讼的集体诉讼资格
        - 按次违法法定赔偿放大后可能达到数亿美元
        - 对执法模式构成生存风险；触发和解谈判
      - - 定期贷款违反契约
        - 贷款人沟通中标出任何利息覆盖率或杠杆契约违约
        - 迫使公司付出高成本取得豁免或修订；说明 EBITDA 与计划的缺口正在变得关键
        - 信用评级下调；再融资条件显著恶化
      - - 关键人离职
        - CEO Alex Israel 或 CIO Courtney Fukuda 离开公司
        - 创始人控制文化；未披露接班计划；整合依赖领导层
        - 自由裁量的负面信号；在接班计划说清前暂停承诺
      - - 平台延伸失败
        - 到 2026 年底，非停车垂直领域收入低于 $50M 年经常性收入（ARR）
        - 平台 TAM 叙事缺乏支撑；公司仍是停车运营商，而非平台
        - 将估值下调至停车运营商可比水平（~$1.5B）；避免新增投资
    notes: 终止触发因素对应已知风险维度；受私有信息限制，不分配概率；每个触发因素都有可观察的具体阈值，便于持续监测。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV041
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - EBITDA 质量与桥接
        - 从 $29.5M 已报告 EBITDA 到 $209M 运行率调整后 EBITDA 的详细桥接
        - 整个估值都压在这项调整上；信用市场已经认为支撑不足
        - 管理层 / CFO 演示；JPMorgan 银团贷款信息包
      - - 软件订阅渗透率
        - 使用 Vision 层（$15/车位/月）订阅的点位数量及占比
        - 决定 SaaS 平台溢价是否成立；也是利润率扩张论点的关键
        - 向投资者关系或 Series D 投资人更新材料索取
      - - 非停车垂直领域收入
        - 来自得来速、加油、酒店垂直领域的实际收入或已签合同
        - 平台 TAM 扩张是核心牛市情景；未披露任何牵引力证据
        - 客户证明；新闻稿；Series D 投资人更新
      - - 监管合规成本
        - Tennessee 和解后的合规技术与法律成本运行率
        - Tennessee 立下全国模板；后续州总检察长行动会继续抬高成本基础
        - 法律顾问；州总检察长和解条款；隐私政策变更日志
      - - 杠杆契约余量
        - 2026 年 Q1 实际杠杆率，以及距离契约阈值的空间
        - 12.4x 杠杆叠加 B3/B- 评级；契约违约风险是近期威胁
        - 贷款信息代理；已备案或在融资文件中摘要的信贷协议
      - - 股本结构与优先权栈
        - 完整股本结构，列明 Series A 至 D 优先金额及清算瀑布
        - $342M Series D 优先股叠加 $1.05B Series C 优先股，形成多层悬置
        - 法律顾问；二级市场交易数据；投资人数据室
    notes: 尽调问题把 EBITDA 质量验证排在首位，这是最重要的开放问题；排序依据是对投资决策的重要性，而不是解决概率。
    claimRefs:
      - CV003
      - CV013
      - CV016
      - CV031
      - CV039
      - CV040
