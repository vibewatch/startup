      - number: '8.6'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              按网络规模、技术差异化和市场位置指标看，Metropolis 确实是一家非常特殊的公司。Recognition Economy 论点自洽，平台期权也真实存在。但 $5 billion 估值要求更强证据——尤其是
              EBITDA 从实际 $29.5 million 持续扩张到营销口径的 $209 million run-rate——而公开信息里还看不到。除非至少两个财季的披露结果确认这条轨迹，否则按 $5 billion
              估值承销，本质上是在押注单一乐观情景。合适建议是 research-more。最关键的尽调解锁项，是获取 2026 年 Q1–Q2 的实际 EBITDA 和自由现金流披露。次级解锁项包括：SP+
              场点组合内软件订阅渗透速度；Tennessee 和解后的实际监管合规成本结构；以及定期贷款契约余量确认。DPPA 集体诉讼若干净解决，将是重要正向催化。如果这些解锁项确认 run-rate 轨迹，且杠杆率到
              2026 年中降至 8–9x，估值判断会从偏高转向合理，建议也会升级为 track，并在 IPO 定价发现后具备通向 buy
              的路径。信心为中等，因为底层运营资产真实存在、网络位置有防御性，多家可信机构投资人已经按接近 $5 billion 的估值投入资本。但 EBITDA
              质量缺口和杠杆水平意味着，下行情景虽然概率较低，损失幅度会很大。风险评级为高。
            claimRefs:
              - CV001
