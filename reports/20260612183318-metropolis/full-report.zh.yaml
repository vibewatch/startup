        blocks:
          - type: paragraph
            body: >-
              Metropolis 的核心差异是垂直整合。公司把自有或运营的实体资产、计算机视觉结账、大型会员图谱，以及如今超过 20,000 名员工的现场运营队伍结合起来。这与预订市场或简单支付 App
              是明显不同的姿态。业主需要完整运营答案时，这可能是优势；但它也带来更高资本强度和整合负担。市场型平台仍有更轻的采用路径，也能在不承担完整运营责任的情况下引导消费者需求。停车任务主要是交易结算，而非端到端场地改造时，支付
              App 仍然好用。结果不是赢家通吃市场，而是分层市场：Metropolis 的整合模式在更大、对体验敏感的资产组合中最强。公开工程和招聘表面也显示，Metropolis
              在投入内部技术深度，而不只是给收购资产重新贴牌；这可能在更长竞争周期中重要。
