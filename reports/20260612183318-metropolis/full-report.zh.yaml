            body: >-
              Metropolis
              同时服务不止一种客户。企业关系通常落在业主、运营商、机场或场馆经理身上，而日常用户是司机，付款方既可能是停车者，也可能通过核销或捆绑通行由企业赞助方承担。公开客户证据还显示，使用场景远超普通通勤停车场。机场、度假村、综合片区、交通枢纽和活动环境都出现在可见来源包中。这种广度很重要，因为它表明
              Metropolis
              可以把同样的识别和支付流程用于多个高流量实体语境。限制在于，公开材料没有披露哪些细分市场贡献最多收入，或哪些买方角色成交最快。分群广度已被证明；细分经济性尚未证明。因此，可见引用的多样性应被视为适配证据，而不是收入结构均衡的代理。
