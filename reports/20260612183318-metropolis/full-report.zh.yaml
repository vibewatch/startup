companyProfile:
  summary: >-
    Metropolis 是一家后期私营停车与实体商业平台，2017 年由 Alex Israel
    和其他联合创始人创立。公司把停车运营与计算机视觉、身份解析和自动支付结合起来，在数千个地点替代票据和自助缴费机流程。其最强的公开验证点包括收购 SP Plus、网络规模广、机场和场馆部署，以及 2025 年 11 月 $1.6B
    融资；核心承销问题在于，这一真实运营版图能否足够快地转化为类软件经济性，从而支撑当前资本结构和估值。
