      - number: '5.3'
        title: 部署、可靠性与信任控制
        blocks:
          - type: paragraph
            body: >-
              Metropolis
              的交付模式看起来既是运营性的，也是技术性的。上线故事和实时运营内容显示，每次铺设都取决于场地准备、伙伴协调和可重复打法，而不只是云端配置。支持、隐私和条款页面进一步说明，系统上线后必须持续管理身份数据、计费例外和客户信任。这既是护城河，也是风险。流程跑通时，它带来无摩擦移动；流程失败时，客户会立刻感知，因为通行、计费或支持受到影响。公开材料记录了政策和产品流程，但没有披露正常运行时间、误读率或支持解决指标。这使可靠性成为最重要的未解技术尽调问题之一。它也意味着技术尽调应包括现场边缘案例，而不只是架构审查或产品演示。
