  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              Metropolis 位于三个重叠市场的交叉点：停车运营、停车软件与支付，以及可能外溢到相邻实体交易的更广义识别基础设施层。第一步是避免把这些市场压成一个
              TAM。行业和分析师来源支持一个庞大、耐久的停车经济，而智能停车市场研究机构把自动化层定义为更小但增长更快的软件与系统机会。这个区分很重要，因为 Metropolis 不是纯软件外挂。SP Plus
              交易之后，公司拥有或运营大量停车版图，因此既能以运营商身份进攻市场，也能以技术升级者身份进攻市场。可信的市场故事因此不是「所有城市商业」，而是分层 TAM：停车收入池、自动化 /
              控制系统，以及公司在停车之外证明可重复性之后的精选相邻收入。
