      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: EBITDA 质量缺口是首要估值风险
            body: >
              已披露 EBITDA（$29.5M）与面向信用投资人营销的 run-rate adjusted EBITDA（$209M）之间有 $179.5 million 缺口，这是 Metropolis
              投资案例中最重要、仍未解决的问题。 S&P 给公司 B- 评级，并预计 2026 年杠杆率降至 8.1x；但这个预测完全取决于 EBITDA 向 run-rate
              追踪。机构贷款投资人的怀疑，是目前最清晰的公开市场信号：他们不愿按营销价格承诺出资， 还预期条款需要走阔到 SOFR+500bps，说明调整缺口尚不可信。任何按或接近 $5B EV
              作出的投资承诺，都必须在交割前验证这座桥。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: callout
            title: 无可匹敌的实体网络密度构成耐久平台基础
            body: >
              Metropolis 拥有 4,200+ 个场点、50 million 客户，每年处理 $5 billion 交易额。这张实体分销网络，不是竞争者十年内从零能搭出来的。SP+ 收购是 2024 年最大一笔 VC
              支持的 M&A 交易，把 Metropolis 从实体存在有限的科技创业公司，变成美国城市环境中最大基础设施类别的主导运营商。这种网络密度是 Recognition Economy 论点不可替代的根基；
              短期内，监管或财务逆风还不会动摇它。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV005
          - type: callout
            title: 若参与，优先股是信心最高的进入点
            body: >
              鉴于清算优先权堆栈，必须按当前估值部署资金的投资人，应争取与 Series D 结构相同或更优先的优先股条款，而不是普通股。基准和空头情景下，普通股会明显受损，优先股持有人则有保护。
              对收益导向投资人而言，通过定期贷款参与也有防御性，SOFR+425–450 bps 利差提供收益；但 B3/B- 评级和高杠杆结构带来信用风险。$5B EV 的普通股应等待 EBITDA 轨迹被证明、
              杠杆率降至低于 8x，并且管理层至少给出一个季度的前瞻指引。
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV017
              - CV039
          - type: callout
            title: 垂直扩张时点是关键期权价值事件
            body: >
              基准与多头情景的差异，几乎完全取决于 Metropolis 能否在 2027
              年前，把实体世界数据足迹转化为停车以外的经常性平台收入。首次出现有实质意义的转化证据——例如与得来速连锁、加油站网络或酒店集团签下规模化企业合同——将是重要正向催化，
              足以支撑估值重估。对跟踪这家公司的投资人而言，近期最可执行的监控动作，是关注 Metropolis 新闻稿、合作公告，以及任何 SEC 邻近披露（如果未来提交 IPO 文件）中非停车垂直合同里程碑。
            calloutType: insight
            claimRefs:
              - CV004
              - CV007
              - CV030
              - CV032
