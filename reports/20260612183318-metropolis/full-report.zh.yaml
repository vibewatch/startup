      - number: '6.3'
        title: 耐久性、满意度与集中度
        blocks:
          - type: paragraph
            body: >-
              客户证据在耐久性上变薄。App 商店、支持页面、BBB 投诉、Trustpilot 评价和近期与和解相关的消费者报道，显示活跃用户层和可见支持负担，但无法直接转化为企业续约健康度。公开材料不披露 NRR
              净留存率（NRR）、GRR 总留存率（GRR）、合同期限、头部客户敞口或续约节奏。这意味着最大的未解客户问题是集中度和留存，而不是产品是否找到了真实用户。反向 thesis
              很直接：一个非常庞大的会员基础，仍可能架在一组相对集中的运营商关系之上。正面反驳是，垂直引用的多样性让单一使用场景故事不太可能成立。即便如此，没有合同和队列数据，耐久性仍只能部分承销。投诉证据应被视为信号，而不是量化流失代理。直接客户访谈和合同样本在这里远比更多营销案例重要。
