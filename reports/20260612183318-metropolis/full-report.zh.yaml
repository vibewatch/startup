  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按竞争类型而非 Logo 清单看格局
        blocks:
          - type: paragraph
            body: >-
              最有用的竞争框架，是按买方任务和资产模式划分。Metropolis 不只是另一个停车 App，SpotHero 也不只是另一个停车运营商。真正有意义的类别是综合运营商、预订市场、支付优先
              App，以及传统通行控制或设备栈。LAZ 和传统 SP Plus 体系围绕运营关系和版图竞争。SpotHero、ParkWhiz、Way 和 AeroParker 围绕发现和提前预订竞争。ParkMobile
              围绕 App 主导的支付行为竞争，尤其是在城市或市政风格场景中。FLASH 代表更传统的技术栈竞争者。这种分层很重要，因为 Metropolis
              在一个类别里可能显得占优，但在另一个类别里仍面对强替代品。也就是说，采购讨论的起点会很不一样，取决于买方要的是流量、支付、劳动力，还是完整操作系统。实践中，许多真实交易很可能同时涉及不止一类竞争，因此生态框架在战略上非常重要。
