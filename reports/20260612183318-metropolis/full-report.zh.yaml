              - CR043
      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Metropolis 运营的技术处在面向消费者的支付、自动车辆监控和个人数据访问交叉点，结构上暴露于多层监管风险。Tennessee Attorney General 在 2026 年 1 月达成的和解要求支付
              $8.75M 的赔偿、退款和免费停车抵扣，用于解决误导性定价、标识不足、技术驱动的意外费用，以及设计得像政府罚单的通知等指控。和解已经最终生效，但其他辖区的消费者保护律师和州 AG 已把 Tennessee
              当作模板，多州协调是现实的近期场景。并行的 DPPA 集体诉讼指控 Metropolis 非法访问州机动车记录，以识别车主并邮寄类似罚单的通知；诉讼称这种做法违反联邦 Driver's Privacy
              Protection Act。若获得集体认证，财务敞口会实质上升，并使所有发生过类似执法做法的州的运营更复杂。监管方面，Virginia 在 2025 年颁布 ALPR 法，要求在 30
              天内删除采集到的车牌数据；Arkansas 和 Idaho 也通过了限制。Metropolis 在隐私政策中承认其运营 License Plate Recognition
              系统，并采集车辆和接近生物识别的数据。2025 年只有三个州颁布 LPR 专项法律，但立法动能和缺乏联邦优先适用，使监管地图可能快速变化。Illinois 的 Biometric Information
              Privacy Act (BIPA) 使任何未经书面同意采集生物识别标识符的公司面临法定赔偿。2025 年，使用摄像头和识别技术的各行业出现超过 100 起 BIPA 集体诉讼。Metropolis 尚未确认
              Illinois 部署中有 BIPA 专项同意框架，因此留下潜在敞口。
