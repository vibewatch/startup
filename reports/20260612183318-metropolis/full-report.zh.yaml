      - number: '3.4'
        title: 各模式可能取胜的场景与未知项
        blocks:
          - type: paragraph
            body: >-
              不同细分市场很可能选择不同工具。机场和大型托管资产组合在结构上有利于 Metropolis，因为它们奖励深度运营整合、高吞吐量，以及可复用的预订或忠诚度渠道。更简单的城市支付任务可能仍偏向 App
              优先或市场优先替代品。商业地产尤其微妙，因为只要经济性可接受，许多业主会容忍传统摩擦；这意味着 Metropolis
              不仅要证明便利，还要证明可衡量的物业层面价值。因此，公开证据对格局形态最强，对已实现经济性较弱。缺失项包括定价透明度、按细分市场的留存，以及直接正面对比胜率数据。在这些浮出水面之前，合适结论是：Metropolis
              有严肃的护城河案例，但尚未结案。这足以认可差异化定位，但不足以假设长期品类主导。投资人应按细分市场层面的竞争胜利来思考，而不是套用单一普遍市场份额叙事。
