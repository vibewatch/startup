      - number: '7.3'
        title: 财务与资本结构风险
        blocks:
          - type: paragraph
            body: >
              SP+ 收购把 Metropolis 变成了一家高杠杆实体。S&P 给出 B- 评级，并预计 2025 年杠杆约 12.4x；若整合目标达成，2026 年降至 8.1x。Moody's 对公司和 2025
              年定期贷款均给出 B3 评级。这些评级反映显著信用风险，也表明投资人对公司 EBITDA 质量的信心仍有限。2025 年，Metropolis 通过 JPMorgan 寻求 $1.1 billion
              定期贷款，为早前私人信贷债务再融资，价格谈判为 SOFR+425-450 基点。投资人明显怀疑，因为 Metropolis 用约 $209 million 的 run-rate 调整后 EBITDA
              推介贷款，而实际报告 EBITDA 为 $29.5 million；这一调整比例让信用市场难以承销。贷款还带有 $342 million Series D
              优先股部分，增加普通股持有人的稀释风险和悬顶压力。高杠杆制造三条相互连接的风险向量：第一，即使 EBITDA
              相对计划只是中等幅度低于预期，也可能触发利息覆盖契约，从而限制运营灵活性；第二，如果没有外部资本，公司投资技术现代化、合规基础设施或收购的能力受限；第三，如果 SP+
              整合协同延迟或小于预期，杠杆率就不会像模型假设那样快速下降，困境再融资概率会上升。未确认自由现金流生成，加上细分行业定位，也把再融资市场限制在少数专门信用投资人中。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR038
              - CR039
