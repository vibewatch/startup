          label: 异常 / 支持
      edges:
        - from: partner
          to: install
        - from: install
          to: launch
        - from: launch
          to: go-live
        - from: go-live
          to: exceptions
    claimRefs:
      - CE008
      - CE018
      - CE023
      - CE028
  - id: FE004
    title: 差异化阶梯
    type: range
    layout: wide
    summary: 停车执行的公开证据最强，更广垂直场景的触达还缺少充分验证。
    data:
      items:
        - label: 核心停车产品验证
          low: 8
          mid: 9
          high: 10
        - label: 技术深度可见度
          low: 6
          mid: 7
          high: 8
        - label: 跨垂直场景成熟度
          low: 3
          mid: 4
          high: 6
    claimRefs:
      - CE012
      - CE014
      - CE024
      - CE025
      - CE035
  - id: FU001
    title: 买方—用户—付款方图谱
    type: flow
    layout: wide
    summary: Metropolis 的客户关系是多边结构，不是单一买方 SaaS。
    data:
      nodes:
        - id: buyer
          label: 企业买方
        - id: user
          label: 司机 / 旅客
        - id: payer
          label: 付款方
        - id: site
          label: 物理场点
        - id: platform
          label: Metropolis 平台
      edges:
        - from: buyer
          to: site
        - from: user
          to: site
        - from: payer
          to: platform
        - from: site
          to: platform
    claimRefs:
      - CU001
      - CU002
      - CU027
  - id: FU002
    title: 采用漏斗
    type: flow
    layout: wide
    summary: 公开证据从具名部署一路放大到大型会员网络。
    data:
      nodes:
        - id: named
          label: 具名部署
        - id: locations
          label: 场点
        - id: members
          label: 会员
        - id: events
          label: 车辆事件
        - id: network
          label: 网络效应
      edges:
        - from: named
          to: locations
        - from: locations
          to: members
        - from: members
          to: events
        - from: events
          to: network
    claimRefs:
      - CU006
      - CU007
      - CU024
  - id: FU003
    title: 垂直场景验证平衡
    type: range
    layout: wide
    summary: 机场验证最强；其他垂直场景可信，但外部佐证较少。
    data:
      items:
        - label: 机场验证强度
          low: 8
          mid: 9
          high: 10
        - label: 酒店场景验证强度
          low: 5
          mid: 6
          high: 7
        - label: 综合体 / 交通验证强度
          low: 5
          mid: 6
          high: 7
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU018
      - CU020
      - CU033
  - id: FU004
    title: 登陆并扩张图谱
    type: flow
    layout: wide
    summary: 商业逻辑很可能从一个工作流胜利起步，再扩到更多场点或相邻服务。
    data:
      nodes:
        - id: win
          label: 初始客户拿下
        - id: deploy
          label: 运营部署
        - id: usage
          label: 司机使用
        - id: expand
          label: 更多场点 / 服务
        - id: partner
          label: 合作伙伴渠道
      edges:
        - from: win
          to: deploy
        - from: deploy
          to: usage
        - from: usage
          to: expand
        - from: partner
          to: win
    claimRefs:
      - CU008
      - CU021
      - CU022
      - CU028
  - id: FR001
    title: 风险评估矩阵——按类别划分的严重度
    type: matrix
    layout: wide
    summary: |
      财务杠杆和监管 / 法律敞口主导剩余严重度评估；运营和人员风险可以修复，但需要主动管理。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 监管 / 法律
          values:
            - 高
            - 高
            - 部分
            - 高
        - label: 财务 / 杠杆
          values:
            - 中高
            - 关键
            - 早期
            - 关键
        - label: 运营 / 整合
          values:
            - 中高
            - 高
            - 部分
            - 中高
        - label: 合作伙伴 / 依赖
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: 人员 / 执行
          values:
            - 中
            - 高
            - 早期
            - 中
    approximationNotes: |
      可能性和影响评级是基于公开证据的定性判断；它们反映研究团队的知情判断，不是精算打分。缓释成熟度只基于公开披露行动。
    claimRefs:
      - CR001
      - CR011
      - CR015
      - CR043
  - id: FR002
    title: 风险传导图——风险如何层层压到估值
    type: dag
    layout: wide
    summary: |
      监管执法推高成本，进而压迫杠杆；整合延误拖慢协同兑现，而协同是主要去杠杆路径；两条路径最终都指向估值受损。
    data:
      nodes:
        - id: reg_enforcement
          label: 监管执法行动
        - id: litigation
          label: 进行中的 DPPA 诉讼
        - id: high_leverage
          label: 12.4x 杠杆率
        - id: integration_delay
          label: SP+ 整合延误
        - id: ebitda_miss
          label: EBITDA 低于计划
        - id: refi_risk
          label: 再融资风险扩大
        - id: ops_cost
          label: 合规成本抬升
        - id: biz_model_change
          label: 商业模式约束
        - id: valuation
          label: 估值受损
      edges:
        - from: reg_enforcement
          to: ops_cost
        - from: reg_enforcement
          to: biz_model_change
        - from: litigation
          to: ops_cost
        - from: ops_cost
          to: ebitda_miss
        - from: integration_delay
          to: ebitda_miss
        - from: ebitda_miss
          to: high_leverage
        - from: high_leverage
          to: refi_risk
        - from: refi_risk
          to: valuation
        - from: biz_model_change
          to: valuation
        - from: ebitda_miss
          to: valuation
    claimRefs:
      - CR016
      - CR038
      - CR022
      - CR044
  - id: FR003
    title: 依赖图谱——关键外部依赖
    type: dag
    layout: wide
    summary: |
      Metropolis 的运营模型依赖少数高度集中的外部参与方，覆盖资本、基础设施、场点准入和渠道层。
    data:
      nodes:
        - id: metropolis
          label: Metropolis 核心平台
        - id: debt_provider
          label: JPMorgan / 私募信贷（$1.1B）
        - id: cloud
          label: 云 / 边缘基础设施
        - id: property_owners
          label: 企业物业业主
        - id: aeroparker
          label: AeroParker（机场层）
        - id: joby
          label: Joby Aviation（未来 AAM）
        - id: bilt
          label: Bilt Rewards（忠诚度层）
        - id: sp_workforce
          label: SP+ 员工队伍（~20K 名员工）
      edges:
        - from: debt_provider
          to: metropolis
        - from: cloud
          to: metropolis
        - from: property_owners
          to: metropolis
        - from: aeroparker
          to: metropolis
        - from: joby
          to: metropolis
        - from: bilt
          to: metropolis
        - from: sp_workforce
          to: metropolis
    claimRefs:
      - CR027
      - CR028
      - CR041
      - CR045
  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: wide
    summary: 从证据输入，经风险和估值评估，最终落到 research-more 建议。
    data:
      nodes:
        - id: scale
          label: 市场规模已确认：4,200+ 个场点，$5B 交易额，50M 客户
        - id: platform
          label: 平台可选性：$15/车位 SaaS、Recognition Economy 论点、垂直场景扩张
        - id: ebitda_gap
          label: EBITDA 缺口：实际 $29.5M vs. 运行率 $209M（差异 609%）
        - id: leverage
          label: 杠杆：12.4x（2025），评级 B3/B-，$1.1B 定期贷款，利率 SOFR+425-450bps
        - id: regulatory
          label: 监管：TN AG 和解、DPPA 集体诉讼、LPR 法规扩散
        - id: valuation
          label: 估值：$5B 标记（实际 EBITDA 的 169x；运行率 EBITDA 的 24x）
        - id: preferred
          label: 优先股层级：$342M Series D 优先股 + $1.05B Series C 优先股
        - id: rec
          label: 建议：research-more（信心：中；风险：高；立场：偏紧）
      edges:
        - from: scale
          to: platform
          label: 支撑
        - from: ebitda_gap
          to: valuation
          label: 推高
        - from: leverage
          to: valuation
          label: 压缩
        - from: regulatory
          to: ebitda_gap
          label: 威胁
        - from: preferred
          to: valuation
          label: 稀释股权价值
        - from: platform
          to: rec
          label: 正向输入
        - from: valuation
          to: rec
          label: 偏紧约束
        - from: leverage
          to: rec
          label: 高风险约束
        - from: regulatory
          to: rec
          label: 重大风险
    approximationNotes: 逻辑流代表定性判断链，不是机械打分模型。
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV038
  - id: FV002
    title: 估值对 EBITDA 倍数和运行率的敏感性
    type: bar
    layout: wide
    summary: 三种 EBITDA 情景（实际、部分调整、运行率）和两个倍数区间（运营商与平台）下的隐含企业价值。
    data:
      items:
        - label: 实际 EBITDA $29.5M × 7x（运营商）
          value: 207
          unit: USD millions
        - label: 实际 EBITDA $29.5M × 12x（中位）
          value: 354
          unit: USD millions
        - label: 部分调整 EBITDA $100M × 10x
          value: 1000
          unit: USD millions
        - label: 部分调整 EBITDA $100M × 15x
          value: 1500
          unit: USD millions
        - label: 运行率 EBITDA $209M × 12x
          value: 2508
          unit: USD millions
        - label: 运行率 EBITDA $209M × 18x
          value: 3762
          unit: USD millions
        - label: 平台 EBITDA $600M × 15x
          value: 9000
          unit: USD millions
        - label: 当前 $5B 标记（参考）
          value: 5000
          unit: USD millions
    approximationNotes: EBITDA 数字来自 Octus 报道（实际 $29.5M、运行率 $209M）和情景建模；倍数基于 Verra Mobility 和可比平台交易区间。
    claimRefs:
      - CV012
      - CV013
      - CV019
      - CV021
  - id: FV003
    title: 各情景下的估值和回报区间
    type: range
    layout: standard
    summary: 低、中、高三种企业价值估算，以及按 $5B Series D 进入估值推算的投资人回报倍数。
    data:
      items:
        - label: 熊市情景 EV（2028 年视角）
          low: 420
          mid: 560
          high: 700
          unit: USD millions
        - label: 基准情景 EV（2028 年视角）
          low: 2400
          mid: 2700
          high: 3000
          unit: USD millions
        - label: 牛市情景 EV（2028–2029 年视角）
          low: 9000
          mid: 10500
          high: 12000
          unit: USD millions
        - label: 当前标记（2025 年 11 月 Series D）
          low: 5000
          mid: 5000
          high: 5000
          unit: USD millions
    approximationNotes: >
      熊市情景假设停车运营商可比公司按 $60–100M EBITDA 的 7x 估值；基准情景假设整合成功，2027 年达到 $200–250M EBITDA、12x 倍数；牛市情景假设平台成熟，2028 年达到 $600–800M
      EBITDA、15x 倍数。所有数字都是示意性估算；Metropolis 未披露前瞻指引。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 面向 IC 的七维评分；规模优秀，但经济模型和估值压低总分。
    data:
      items:
        - label: 市场规模和地位
          value: 9
          max: 10
          note: 美国最大停车网络；4,200+ 个场点；主要大都市区密度接近垄断
        - label: 产品和技术验证
          value: 7
          max: 10
          note: 停车场景已规模化上线；垂直场景扩张尚未验证；收购 Oosto 增强能力
        - label: 竞争护城河
          value: 7
          max: 10
          note: 网络密度和数据飞轮是真护城河；LPR 监管风险威胁护城河耐久度
        - label: 经济模型和财务健康
          value: 3
          max: 10
          note: 12.4x 杠杆；实际 EBITDA $29.5M；评级 B3/B-；优先股包袱
        - label: 客户和收入质量
          value: 6
          max: 10
          note: $5B 交易额；50M 客户；SaaS 渗透率未披露；TN 和解释放信任风险信号
        - label: 风险画像
          value: 3
          max: 10
          note: 监管、法律、财务和整合风险高；存在多个尾部情景
        - label: 估值吸引力
          value: 2
          max: 10
          note: 实际 EBITDA 的 169x；即便按运行率也偏紧；信贷市场已验证怀疑
    approximationNotes: 评分是基于第 1–8 章证据的定性评估；不是定量模型。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV038
      - CV040
