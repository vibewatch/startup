      - number: '8.5'
        title: 退出准备度与论点失效触发项
        blocks:
          - type: paragraph
            body: >
              Metropolis 的潜在退出路径包括 IPO、战略收购或二级市场出售。IPO 路径需要可证明的 EBITDA 利润率扩张、杠杆率降至 5–6x，并且最好有两个到三个季度的前瞻指引可见度。 考虑到当前
              12.4x 杠杆率，以及披露 EBITDA 与 run-rate EBITDA 之间的差距，除非 quarterly disclosures 验证 adjusted EBITDA 轨迹，否则 2027–2028
              年之前 IPO 的可能性不高。2026 CNBC Disruptor 50 入选和 TIME100 Most Influential Companies
              认定强化了品牌资产，有助于支撑公开发行；但品牌资产本身解决不了债务 / EBITDA
              压力。潜在战略收购方可能包括大型商业地产科技平台（CoStar、JLL、CBRE）、希望获取实体世界交易数据的支付基础设施公司，或出行数据聚合商。该行业控制权交易中，战略溢价通常比市场估值高 15–20%；
              但战略买家会像信用市场一样施加杠杆折价，从而压低预期退出倍数。六个论点失效触发项需要持续监控：（1）如果 FY2026 年底 reported EBITDA 没有向 $100 million
              推进，run-rate 调整叙事就正在失效。（2）Tennessee AG 先例之后出现多州监管协同，并迫使公司作出重大运营调整，将成为数据飞轮的致命条件。（3）DPPA
              集体诉讼获得认证，会显著提高现金风险敞口并限制执法做法。 （4）任何定期贷款契约违约，都会在当前再融资环境下引发信用危机。（5）Alex Israel 或 Courtney Fukuda
              离职且没有接班方案，会在运营复杂的公司里制造执行真空。（6）到 2026 年底， 平台延伸收入低于 $50 million ARR，说明垂直扩张论点没有转化。
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
