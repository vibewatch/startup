      - number: '2.4'
        title: 相邻机会、现状替代品与未解规模缺口
        blocks:
          - type: paragraph
            body: >-
              Metropolis 最有意思的市场主张是，停车只是更广义出行和识别网络中的第一个节点。Joby
              合作、机场预订栈，以及公司围绕酒店、加油和零售的扩张叙事，都支持这一雄心。但公开来源包仍更擅长证明第一个节点，而不是完整相邻机会图谱。现状选择很多：有些买方使用传统闸机系统，有些使用基于 App
              的停车支付，有些依赖预订市场，也有些只是容忍匿名现金收款或徽章驱动流程。这种多样性扩大了机会，也让精确 SAM 和 SOM
              计算更复杂。它还意味着竞争语境会随细分市场改变：机场关心预订和收入管理，办公与综合资产关心租户便利和运营杠杆，酒店买方关心高端抵达体验。进一步的复杂性在于，公开证据没有清晰拆分交易处理收入、类软件订阅经济性以及纯运营费用捕获在各细分市场中的占比，所以即使战略故事成立，仍缺少完整分段变现模型。尽调中合适的结论是：市场显然大且有吸引力，但
              Metropolis 特定的渗透上限、细分市场利润率和相邻垂直经济性披露不足，无法精确承销。
