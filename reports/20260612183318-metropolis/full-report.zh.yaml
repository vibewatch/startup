              Moody's 或 S&P 将评级下调至 B3/Caa1 以下，并且无法以非困境利差为 $1.1B 定期贷款再融资，代表投资人最快进入二元结果的路径。在 2025 年 12.4x 杠杆率下，任何超过 10-15%
