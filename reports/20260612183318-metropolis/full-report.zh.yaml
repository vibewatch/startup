      - number: '8.3'
        title: 多头、基准与空头情景
        blocks:
          - type: paragraph
            body: >
              各情景之间的估值区间很宽，反映平台论点的二元性。多头情景假设识别经济扩张成功：到 2028 年，Metropolis 把技术部署到得来速、加油站、酒店和零售场景，年交易额从 $5 billion 增长到
              $12–15 billion，软件订阅收入从零起步爬升到 $400–600 million 年经常性收入（ARR）。达到这个规模后，$600–800 million adjusted EBITDA
              具备合理性；若按 15x EBITDA（与规模化交通科技平台一致），企业价值可达 $9–12 billion。此时，当前以 $5 billion 进入的 Series D 投资人可获得 1.8–2.4x
              总倍数。基准情景假设 SP+ 整合兑现预计协同，杠杆率到 2026 年降至 S&P 预测的 8.1x，EBITDA 到 2027 年逼近 $209 million run-rate 口径。
              平台延伸收入会出现，但明显慢于多头时间表。若 2027 年 $250 million EBITDA 按 12x 估值，隐含企业价值为 $3 billion——低于当前 Series D
              进入价格；普通股持有人回报持平到为负， 优先股堆栈中的投资人则可基本回本。$5 billion 估值意味着市场已经计入了相当部分多头期权。空头情景把信用风险、监管逆风和平台失败叠加起来。如果 EBITDA
              扩张停滞——原因可能是监管合规成本、 Tennessee 和解后客户信任继续受损，或整合执行失败——公司到 2027 年仍可能维持 10x+ 杠杆。任何信贷契约违约或评级下调，都会触发 $1.1 billion
              定期贷款的再融资风险。如果平台论点没有兑现，Metropolis 按停车运营商可比公司估值，以 $80–100 million 实际 EBITDA 乘 7–8x，企业价值会降至 $560–800 million，
              意味着股权几乎全损，优先股投资人也只能部分收回。空头情景下，下一轮融资的 down-round 风险很大。
            claimRefs:
