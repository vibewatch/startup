      - number: '7.5'
        title: 执行、人员风险与否决标准
        blocks:
          - type: paragraph
            body: >
              人员风险锚定在创始人关键人物依赖上。CEO 兼联合创始人 Alex Israel 没有已确认的公开继任计划，公司战略、投资人关系和公开叙事都与其个人定位紧密相连。WARN Act 申报和裁员追踪数据确认，SP+
              整合涉及人员缩减。一家公司同时处理杠杆收购整合、多州监管审视和活跃集体诉讼，至少需要在五个职能上拥有强且稳定的高层领导：法律、技术、财务、运营和企业销售。CEO 层级以下的相关领导职位均未公开确认。整合 SP+
              约 20,000
              人员工队伍会引入劳资关系风险。停车行业历史上在主要城市市场存在工会化员工队伍，整合劳动合同可能抬高固定运营成本。任何公开公司披露都没有处理这一风险。四项否决标准可衡量，并应主动跟踪。第一，第二次多州 AG
              协同行动将说明 TN 和解未能在全国建立足够运营纠偏，迫使更根本的商业模式改变。第二，Moody's 或 S&P 下调至 B3/Caa1 以下，会显著收窄再融资市场并提高违约概率。第三，DPPA
              案件获得集体认证会触发重大责任事件。第四，CEO 或 CTO 离职将要求暂停投资论点，直到继任领导清晰。
