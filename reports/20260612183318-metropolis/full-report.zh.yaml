      - number: '1.5'
        title: 负面信号与开放尽调项
        blocks:
          - type: paragraph
            body: >-
              Metropolis 的增长故事很强，但负面来源包也很实质，不能轻描淡写。Tennessee 和解和总检察长行动显示，真实消费者伤害指控一路推进到获批赔付，尽管 Metropolis 否认不当行为。和解范围覆盖
              Tennessee 多年间的超额收费、开罚单和锁车，说明即使产品愿景明确要消除摩擦，运营摩擦仍可能持续。集体诉讼指控、BBB 投诉和 Trustpilot 评价都从另一个角度强化了这一风险。在此之上，SP
              Plus 整合带来劳动力和组织复杂度，2025 年 WARN
              通知以及大规模协调技术、现场运营和客服的一般难度都反映了这一点。最大的未解承销缺口仍是财务：没有公开收入数字，没有精确员工数，也没有干净的董事会或资本结构可见度。
