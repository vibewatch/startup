      - number: '8.4'
        title: 可比公司与估值基准
        blocks:
          - type: paragraph
            body: >
              Metropolis 很难简单归类：它同时是停车运营商（资产重、低利润率）、平台业务（网络效应、订阅收入）和 AI 基础设施公司（自有计算机视觉栈）。每个视角都会导出不同估值框架。 在停车运营商维度，SP+ 以约
              $1.5 billion 企业价值被收购，对应 FY2023 服务收入约 $1.78 billion，收入倍数低于 1x，反映传统停车业务资产重、人力密集的特点。 SP+ adjusted EBITDA
              利润率只有中个位数百分比。Metropolis 的 $5 billion 估值，仅按 SP+ 收入基数计算就意味着 2.8x 收入倍数，还没计入 Metropolis
              的技术溢价。这个溢价需要靠已验证的软件订阅渗透率和利润率扩张来证明。在出行科技维度，Verra Mobility（Nasdaq: VRM）为市政机构和租车公司运营自动收费与停车执法技术， 截至 2025 年中约按
              10–12x EBITDA 和 4–5x 收入交易。Verra Mobility 已明确实现正现金流，并拥有经常性的政府合同收入基底，风险特征不同于 Metropolis。 私有停车与出行平台 REEF
              Technology 在 2021 年 Series D 的最后估值约为 $1.35 billion，之后经历大幅运营重组并缩减版图。这个对比凸显大规模停车科技转型的执行风险。 Amazon 从 Fresh
              杂货店收缩 Just Walk Out，说明无摩擦商业技术从受控环境迁移到碎片化真实世界部署并不容易；这与 Metropolis 的垂直扩张计划风险直接相似。在 AI/SaaS 维度， 大型工业市场中的领先垂直
              SaaS 平台，在增长阶段曾按 15–30x ARR 交易，但 Metropolis 的软件 ARR 并未公开披露。停车管理市场预计从 2025 年 $7.22 billion 增长到 2030 年 $12.41
              billion，CAGR 为 11.4%。按 $5 billion 估值倒推，Metropolis 在该市场中的隐含份额很大；但公司同时竞争托管服务层和软件层，纯 SaaS 倍数因此更难直接套用。
