  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图谱与严重性排序
        blocks:
          - type: paragraph
            body: >
              Metropolis 的风险画像由四个相互咬合的维度塑造：基于摄像头、数据密集型停车执法模式带来的监管和法律敞口；高杠杆 SP+
              收购带来的财务脆弱性；整合一支地域分散的大型传统员工队伍和基础设施带来的运营复杂度；以及跨云厂商、资本来源和渠道伙伴的伙伴或依赖集中度。这些维度并不独立。一项迫使运营改变的监管行动会抬高成本、压低
              EBITDA，直接挤压本已较高的杠杆率并提高再融资风险。整合延迟若拖慢成本协同兑现，也会叠加同一问题。风险严重性排序把财务和资本结构风险放在最高，因为它传导到威胁偿付能力结果的速度最快、最不可逆。监管和法律风险紧随其后，因为活跃诉讼和具备多州先例的执法可能同时迫使运营改变、产生现金和解，并限制最大市场中的增长。运营和技术风险排第三；其失败可修复，但如果管理不好会变成慢性问题。依赖和伙伴风险对信用和资本层很实质，对技术层为中等。人员和执行风险集中在关键人物依赖和
              SP+ 整合 PMO 能力。五个维度都需要监控。下方提示列出会迫使二元投资决策的否决标准。
            claimRefs:
              - CR001
              - CR011
              - CR017
              - CR036
              - CR037
              - CR039
              - CR043
