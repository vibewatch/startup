        title: Product definition and visible surfaces
        blocks:
          - type: paragraph
            body: >-
              Metropolis is not just a parking app. Public product and support pages show a workflow that begins when a
              vehicle arrives, continues through recognition and payment, and ends with self-service support or
              subscription management when exceptions occur. That makes the delivered product a combination of
              physical-site automation, identity resolution, payment capture, and consumer account management. The
              visible surfaces include transient parking, monthly subscriptions, support and dispute handling, and event
              or venue operating contexts. Company narrative also stretches the same workflow toward airports and other
              real-world movement categories. The right framing is therefore a product system with multiple entry
              points, not a single SKU. Public evidence is strongest on what users experience and much weaker on the
              commercial packaging behind each surface. It also suggests the same core workflow can be packaged
              differently for airports, resorts, or venue operators without changing the recognition backbone. That
              packaging flexibility is strategically useful because it widens the number of physical environments the
