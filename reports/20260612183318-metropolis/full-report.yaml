      - number: '2.4'
        title: Adjacencies, status-quo substitutes, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Metropolis’ most interesting market claim is that parking is only the first node in a broader mobility and
              recognition network. The Joby partnership, the airport reservation stack, and the company’s expansion
              narrative around hospitality, fueling, and retail all support that ambition. But the public source pack is
              still better at proving the first node than the full adjacency map. The status quo remains varied: some
              buyers use legacy gate systems, some use app-based parking payments, some rely on reservation
              marketplaces, and some simply tolerate anonymous cash-collection or badge-driven workflows. That diversity
              widens the opportunity but complicates precise SAM and SOM math. It also means competitive context changes
              by segment: airports care about reservations and revenue management, office and mixed-use assets care
              about tenant convenience and operating leverage, and hospitality buyers care about premium arrival
              experience. A further complication is that the public evidence does not cleanly split
              transaction-processing revenue, software-like subscription economics, and pure operating fee capture by
              segment, so even a sound strategic story still lacks a fully segmented monetization model. The appropriate
              conclusion for diligence is that the market is clearly large and attractive, while exact
              Metropolis-specific penetration ceilings, segment margins, and adjacent-vertical economics remain
              insufficiently disclosed for precision underwriting.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM031
