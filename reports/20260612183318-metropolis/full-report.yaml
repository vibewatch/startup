      - number: '2.2'
        title: Buyers, users, payers, and budget owners
        blocks:
          - type: paragraph
            body: >-
              The buyer structure changes by segment. Airports tend to have the cleanest institutional buyer logic
              because parking is both a traveler-experience issue and a major non-aeronautical revenue stream. Office
              and mixed-use real estate usually involve property managers, owners, or outsourced operators making the
              decision, while drivers, tenants, and visitors are the actual users. Hospitality, healthcare, and events
              follow the same pattern: the property or venue operator chooses the system, but the end user is the guest
              or visitor and the payer is often the driver. This makes Metropolis’ value proposition unusually
              cross-functional. It must satisfy revenue managers, operations teams, finance owners, and
              customer-experience stakeholders at the same time. The upside is that parking is one of the few recurring
              physical touchpoints common across all of these environments and across many buyer personas today.
            claimRefs:
