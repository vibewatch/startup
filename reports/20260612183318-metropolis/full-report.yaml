companyProfile:
  summary: >-
    Metropolis is a late-stage private parking and physical-commerce platform founded in 2017 by Alex Israel and other
    co-founders. The company combines parking operations with computer vision, identity resolution, and automatic
    payments to replace ticket-and-kiosk workflows across thousands of locations. Its strongest public proof points are
    the SP Plus acquisition, broad network scale, airport and venue deployments, and the November 2025 $1.6B financing
    round; the core underwriting question is whether that real operating footprint can translate into software-like
    economics quickly enough to justify the current capital structure and valuation.
  founders:
    - name: Alex Israel
      role: Co-founder, CEO
      background: Publicly identified co-founder and chief executive leading Metropolis through financing and expansion.
      claimRefs:
        - CO004
    - name: Courtney Fukuda
      role: Co-founder, Chief Integration Officer
      background: Co-founder publicly tied to integration leadership around the SP Plus combination.
      claimRefs:
        - CO005
  headquarters: Los Angeles / Santa Monica, CA, USA
  productSummary: >-
    Metropolis sells a recognition-driven parking workflow that links site hardware, computer vision, identity,
    payments, and support into frictionless access for drivers and operators. The company increasingly frames that stack
    as a broader physical-commerce platform that can extend into airports and other real-world movement categories.
  customerFocus: >-
    Parking operators, airports, hospitality venues, mixed-use properties, transit-adjacent sites, and large-volume
    event or venue operators, with drivers as the end-user layer.
  businessModel: >-
    Hybrid operator-and-platform model monetizing parking transactions, subscriptions, reservations, and adjacent
    software-like services layered on top of owned or managed parking infrastructure.
  stage: Series D
  fundingStatus: >-
    November 2025 $1.6B financing round, including roughly $500M of Series D equity and a $1.1B term loan, at an
    approximately $5B valuation.
