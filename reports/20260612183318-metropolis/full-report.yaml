      - number: '1.4'
        title: Milestones from parking proof to broader recognition infrastructure
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company broadening from parking proof points into a general-purpose
              recognition and payments platform. Premier Parking gave Metropolis a materially larger operating base in
              2022. SP Plus transformed the footprint again in 2024, adding a 20,000-person team and making Metropolis
              the largest parking operator in North America. By late 2025, the company was marketing itself around the
              Recognition Economy, 20 million members, more than 100 airports, and expanding demand channels such as
              Bilt. The engineering evidence reinforces that this is not just a marketing layer on top of generic LPR.
              Metropolis describes a multi-layered recognition stack, vehicle fingerprinting, continuous MLOps, and a
              data platform that monitors more than 10,000 devices and billions of events. The 2025 Oosto acquisition
              further suggests the company is investing to move from parking-specific vehicle recognition toward broader
              vision and identity infrastructure.
