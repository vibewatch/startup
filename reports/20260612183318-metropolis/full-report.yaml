              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: EBITDA quality gap is the primary valuation risk
            body: >
              The $179.5 million gap between reported EBITDA ($29.5M) and the run-rate adjusted EBITDA ($209M) marketed
              to credit investors is the single most important unresolved question in the Metropolis investment case.
              S&P rates the company B- and projects leverage falling to 8.1x in 2026—but that projection is entirely
              conditional on EBITDA tracking toward run-rate. Institutional loan investors' skepticism, evidenced by
              reluctance to commit at marketed prices and expectations that terms would need to widen to SOFR+500bps, is
              the clearest public market signal that the adjustment gap is not yet credible. Any investment commitment
              at or near $5B EV must have a verified view on this bridge before closing.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: callout
            title: Unrivaled physical-world network density creates a durable platform foundation
            body: >
              Metropolis's 4,200+ locations, 50 million customers, and $5 billion in annual transactions processed
              represent a physical distribution network that a competitor could not assemble from scratch in under a
              decade. The SP+ acquisition—the largest venture-backed M&A deal of 2024—transformed Metropolis from a
              technology startup with limited physical presence into the dominant operator of the largest infrastructure
              category in the US urban environment. That network density is the irreplaceable foundation of the
              Recognition Economy thesis, and it is not at risk from regulatory or financial headwinds in the near term.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV005
          - type: callout
            title: Preferred equity is the highest-conviction entry point if participating
            body: >
              Given the preference stack, investors who must deploy capital at the current valuation should negotiate
              for preferred equity terms matching or senior to the Series D structure, not common equity. Preferred
              holders are protected in the base and bear cases where common equity is significantly impaired. Debt
              participation via the term loan is also a defensible entry for yield-oriented investors given the
              SOFR+425–450 bps spread, though the B3/B- rating and leveraged structure impose credit risk. Common equity
              at $5B EV should await demonstrated EBITDA trajectory, leverage reduction to sub-8x, and at least one
              quarter of forward guidance from management.
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV017
              - CV039
          - type: callout
            title: Timing of vertical expansion is the key option value event
            body: >
              The difference between the base and bull cases is almost entirely driven by whether Metropolis
              successfully converts its physical-world data footprint into recurring platform revenue outside parking by
              2027. The first material evidence of that conversion—signed enterprise contracts at drive-thru chains, gas
              station networks, or hotel groups at scale—would be a significant positive catalyst that would support
              valuation re-rating. Monitoring Metropolis's press releases, partnership announcements, and any
              SEC-adjacent disclosures (if a future IPO is filed) for non-parking vertical contract milestones is the
              most actionable near-term monitoring activity for investors tracking this company.
            calloutType: insight
            claimRefs:
              - CV004
              - CV007
              - CV030
              - CV032
