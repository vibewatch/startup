  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing logic
        blocks:
          - type: paragraph
            body: >-
              Metropolis sits at the intersection of three overlapping markets: parking operations, parking software and
              payments, and a broader recognition-enabled infrastructure layer that could spill into adjacent
              physical-world transactions. The first step is to avoid collapsing these into a single TAM. Industry and
              analyst sources support a large, durable parking economy, while smart-parking market researchers frame the
              automation layer as a smaller but faster-growing software and systems opportunity. That distinction
              matters because Metropolis is not a pure software overlay. By owning or operating much of the parking
              footprint itself after the SP Plus transaction, it can attack the market both as an operator and as a
              technology upgrader. The credible market story is therefore not “all urban commerce,” but a layered TAM
              made up of parking revenue pools, automation/control systems, and selected adjacency revenue once the
              company proves repeatability outside parking.
