        title: Traction and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction markers are member count, locations, transactions, and growth cadence.
              Metropolis cited nearly 20 million members and more than $5 billion in annual transactions in November
              2025, while later company materials raised the member count and described 18 million vehicle events per
              month. Those are meaningful scale signals, but they are not substitutes for ARR, revenue, or cohort
              economics. The same is true for the profitability narrative. Reuters says Metropolis is profitable and
              CNBC says gross margins are improving, but neither outlet provides the numeric bridges an investor would
              need to test quality of earnings. The correct conclusion is that scale is proven, while unit economics are
              suggested rather than disclosed. Importantly, this ambiguity leaves open both a very attractive margin
              story and a much more operationally burdened one.
