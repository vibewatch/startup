      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the public evidence are revenue improvement, lower friction, and reduced
              operational complexity. Airports care about non-aero revenue and smoother passenger journeys. Real-estate
              owners care about getting live quickly without major capital expenditure. Metropolis also tries to create
              demand-side pull by making the user experience seamless, then linking it to loyalty and reservation
              ecosystems such as Bilt and AeroParker. Those drivers are real, but adoption is not frictionless. Buyers
              still face change-management risk around signage, support, validations, lane operations, and data
              governance. Recognition-based systems also introduce privacy and consumer-protection considerations. The
              Tennessee settlement is not a market-wide indictment of the category, but it is proof that implementation
              quality and compliance matter enough to affect the pace of buyer trust and adoption.
