      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical kill criterion — financial leverage
            body: >
              A Moody's or S&P downgrade below B3/Caa1, combined with the inability to refinance the $1.1B term loan at
              non-distressed spreads, represents the fastest path to a binary outcome for investors. At 12.4x 2025
              leverage, any EBITDA miss of more than 10-15% could trip interest-coverage covenants. Monitor rating
              actions, term-loan trading prices, and quarterly EBITDA vs. plan disclosures.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR037
              - CR039
          - type: callout
            title: Regulatory risk — multi-state enforcement precedent
            body: >
              The Tennessee settlement establishes a detailed playbook for state AG consumer protection actions against
              Metropolis's core parking enforcement model. Other state AGs, particularly in California, Florida, and
              Texas, are natural follow-on risks given the size of Metropolis's footprint. A second coordinated action
              before the operational changes from the TN settlement have fully propagated would signal systemic
              non-compliance and force a more fundamental model review.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR042
          - type: callout
            title: BIPA and LPR regulation — a slow-moving but material risk
            body: >
              Metropolis's privacy policy confirms it collects license plate and potentially biometric-adjacent data.
              Neither a BIPA-specific consent framework nor a state-by-state ALPR compliance map has been publicly
              disclosed. With more than 100 BIPA class actions filed in 2025 and three states enacting LPR laws in the
              same year, the regulatory trajectory is directionally clear. Investors should require a jurisdiction-by-
              jurisdiction compliance audit before committing capital to markets where BIPA or LPR laws apply.
            calloutType: insight
