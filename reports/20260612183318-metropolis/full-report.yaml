              - CR024
      - number: '7.4'
        title: Operational, partner, and dependency risks
        blocks:
          - type: paragraph
            body: >
              Operational risk at Metropolis is concentrated in three areas. First, the legacy SP+ technology migration
              creates a near-term period where two payment stacks operate in parallel, raising the probability of
              billing errors, pricing inconsistencies, and consumer complaints that could trigger new enforcement
              interest. The TN settlement itself cited technology glitches as a contributing factor to surprise fees,
              and BBB complaints and Trustpilot reviews document a sustained pattern of billing disputes and refund
              difficulties that predates the settlement and continues into 2026. Second, the company's camera-based
              payment model depends on LPR accuracy and uptime. Any significant outage at a high-traffic venue or
              airport would directly damage the enterprise relationship and create consumer liability. No public SLA,
              uptime commitment, or SOC 2 audit report has been confirmed, leaving cybersecurity and availability
              posture opaque to diligence. Third, dependence on a small set of strategic partners creates concentration
              risk. AeroParker handles airport ecommerce and reservation integration; its value to the Metropolis
              airport segment is disproportionate to its scale, making any partnership deterioration a revenue risk. The
              Joby Aviation partnership introduces aspirational vertiport dependency that is unlikely to materialize at
              scale before 2028 at the earliest. Cloud infrastructure concentration and a single large debt counterparty
              (JPMorgan) round out the dependency map. The Bilt Rewards integration creates a financial-services
              dependency in the loyalty layer that adds indirect credit exposure. None of these individual dependencies
              is fatal in isolation, but together they leave Metropolis with limited redundancy across its technology,
              channel, and capital dimensions.
