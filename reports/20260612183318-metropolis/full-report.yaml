  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a transactional and operator-linked revenue model, not a pure software
              subscription story. Metropolis monetizes parking sessions directly at owned or managed locations, supports
              reservations and monthly parking, and now talks about taking the same recognition and payment automation
              into hospitality, fueling, and quick-service restaurants. That means the right framing is a layered model:
              operating revenue from parking, channel economics from reservations and validations, and potential
              software-like monetization in newer verticals. What the public record does not provide is realized
              pricing. Consumer surfaces and support pages show how users transact, but they do not reveal take rates,
              contract terms, or realized partner economics. This is a business with many monetization levers, but
              public disclosure only reveals the surfaces, not the detailed split. It also suggests that accounting
              presentation could be messy, because gross parking collections, net retained fees, and partner-settlement
              flows may differ materially by location and contract structure. Without segment disclosure, investors
              cannot tell which surfaces are actually driving dollars versus only improving conversion.
