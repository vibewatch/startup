chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and headquarters signal
        blocks:
          - type: paragraph
            body: >-
              Metropolis is best understood as a founder-led AI infrastructure company that started in parking and is
              now trying to generalize recognition-based checkout into broader real-world commerce. The strongest
              identity sources are the company about page, the parking product page, and financing coverage from CNBC
              and Reuters. Together they support a 2017 founding date, Alex Israel as the recurring executive face, and
              a core proposition built around computer vision, automatic access, and frictionless payment. The public
              headquarters signal is less clean than the user brief: reviewed sources repeatedly point to Los Angeles or
              Santa Monica rather than Chicago, while the company’s website emphasizes mission and platform rather than
              a detailed corporate profile. That means the chapter should treat Southern California as the
              best-supported operating identity while also acknowledging that Metropolis now manages a nationally
              distributed workforce and asset footprint after multiple acquisitions.
