  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class, not by logo list
        blocks:
          - type: paragraph
            body: >-
              The most useful way to frame competition is by buyer job and asset model. Metropolis is not just another
              parking app, and SpotHero is not just another parking operator. The meaningful classes are integrated
              operators, reservation marketplaces, payment-first apps, and legacy access-control or equipment stacks.
              LAZ and the legacy SP Plus complex compete around operating relationships and footprint. SpotHero,
              ParkWhiz, Way, and AeroParker compete around discovery and pre-booking. ParkMobile competes around app-led
              payment behavior, especially in urban or municipal-style contexts. FLASH represents the more traditional
              technology-stack competitor. That segmentation matters because Metropolis can appear dominant in one class
              while still facing strong substitutes in another. It also means procurement discussions can start from
              very different baseline expectations depending on whether the buyer wants traffic, payments, labor, or a
              full operating system. In practice, many real deals likely involve more than one class at once, which is
              why ecosystem framing matters a great deal strategically.
            claimRefs:
