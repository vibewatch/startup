          label: 'EBITDA gap: $29.5M actual vs. $209M run-rate (609% difference)'
        - id: leverage
          label: 'Leverage: 12.4x (2025), B3/B- rated, $1.1B term loan at SOFR+425-450bps'
        - id: regulatory
          label: 'Regulatory: TN AG settlement, DPPA class action, LPR law proliferation'
        - id: valuation
          label: 'Valuation: $5B mark (169x actual EBITDA; 24x run-rate EBITDA)'
        - id: preferred
          label: 'Preference stack: $342M Series D preferred + $1.05B Series C preferred'
        - id: rec
          label: 'Recommendation: research-more (confidence: medium; risk: high; stance: stretched)'
      edges:
