  - id: FV002
    title: Valuation sensitivity to EBITDA multiple and run-rate
    type: bar
    layout: wide
    summary: >-
      Implied enterprise value across three EBITDA scenarios (actual, partial-adjustment, run-rate) and two multiple
      ranges (operator and platform).
    data:
      items:
        - label: Actual EBITDA $29.5M × 7x (operator)
          value: 207
          unit: USD millions
        - label: Actual EBITDA $29.5M × 12x (mid)
          value: 354
          unit: USD millions
        - label: Partial adj. EBITDA $100M × 10x
          value: 1000
          unit: USD millions
        - label: Partial adj. EBITDA $100M × 15x
          value: 1500
          unit: USD millions
        - label: Run-rate EBITDA $209M × 12x
          value: 2508
          unit: USD millions
        - label: Run-rate EBITDA $209M × 18x
          value: 3762
          unit: USD millions
        - label: Platform EBITDA $600M × 15x
          value: 9000
          unit: USD millions
        - label: Current $5B mark (reference)
          value: 5000
          unit: USD millions
    approximationNotes: >-
      EBITDA figures derived from Octus reporting ($29.5M actual, $209M run-rate) and scenario modeling; multiples based
      on Verra Mobility and comparable platform trading ranges.
    claimRefs:
      - CV012
      - CV013
      - CV019
      - CV021
  - id: FV003
    title: Valuation and return range across scenarios
    type: range
    layout: standard
    summary: Low, base, and high enterprise value estimates with implied investor return multiples from $5B Series D entry.
    data:
      items:
        - label: Bear case EV (2028 horizon)
          low: 420
          mid: 560
          high: 700
          unit: USD millions
        - label: Base case EV (2028 horizon)
          low: 2400
          mid: 2700
          high: 3000
          unit: USD millions
        - label: Bull case EV (2028–2029 horizon)
          low: 9000
          mid: 10500
          high: 12000
          unit: USD millions
        - label: Current mark (Nov 2025 Series D)
          low: 5000
          mid: 5000
          high: 5000
          unit: USD millions
    approximationNotes: >
      Bear case assumes parking-operator comp at 7x EBITDA on $60–100M; base assumes integration success with 12x EBITDA
      on $200–250M by 2027; bull assumes platform maturity with 15x EBITDA on $600–800M by 2028. All figures are
      illustrative estimates; Metropolis has not disclosed forward guidance.
