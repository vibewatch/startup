      - number: '1.5'
        title: Adverse signals and open diligence items
        blocks:
          - type: paragraph
            body: >-
              Metropolis’ growth story is strong, but the adverse source pack is material and should not be waved away.
              The Tennessee settlement and attorney-general action show that real consumer-harm allegations made it all
              the way to approved restitution, even though Metropolis denies wrongdoing. The settlement scope —
              overcharges, ticketing, and booting in Tennessee over multiple years — indicates that operational friction
              can persist even when the product vision is explicitly about eliminating friction. Class-action
              allegations, BBB complaints, and Trustpilot reviews all reinforce that risk from a different angle. On top
              of that, the SP Plus integration introduces labor and organizational complexity, reflected in a 2025 WARN
              notice and in the general difficulty of harmonizing tech, field operations, and customer service at
              massive scale. The biggest unresolved underwriting gaps remain financial: no public revenue figure, no
              precise headcount, and no clean board or cap-table visibility.
            claimRefs:
