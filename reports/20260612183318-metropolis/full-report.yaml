      - number: '7.5'
        title: Execution, people risks, and kill criteria
        blocks:
          - type: paragraph
            body: >
              People risk is anchored in founder key-person dependence. Alex Israel, the CEO and co-founder, does not
              have a confirmed public successor plan, and the company's strategy, investor relationships, and public
              narrative are closely tied to his personal positioning. WARN Act filings and layoff tracker data confirm
              that the SP+ integration has involved workforce reductions. A company that is simultaneously navigating a
              leveraged acquisition integration, multi-state regulatory scrutiny, and an active class action requires
              strong and stable senior leadership across at least five functional areas: legal, technology, finance,
              operations, and enterprise sales. None of the relevant leadership positions below the CEO layer have been
              publicly confirmed. The integration of a roughly 20,000-person workforce from SP+ introduces labor
              relations risk. The parking industry has historically had unionized workforces in major urban markets, and
              integration of labor contracts could increase fixed operating costs. This risk has not been addressed in
              any public company disclosure. Four kill criteria are measurable and should be actively tracked. First, a
              second coordinated multi-state AG action would signal that the TN settlement failed to establish
              sufficient operational correction nationwide, forcing a more fundamental business model change. Second, a
              Moody's or S&P downgrade below B3/Caa1 would sharply narrow the refinancing market and increase default
              probability. Third, class certification in the DPPA case would trigger a material liability event. Fourth,
              CEO or CTO departure would require an investment thesis pause pending clarity on successor leadership.
