      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >
              The valuation range across scenarios is wide, reflecting the binary nature of the platform thesis. The
              bull case assumes that the recognition-economy expansion succeeds: by 2028, Metropolis deploys its
              technology into drive-thrus, gas stations, hotels, and retail, growing annual transactions from $5 billion
              to $12–15 billion and software subscription revenue from a standing start toward $400–600 million in
              annual recurring revenue. At that scale, adjusted EBITDA of $600–800 million is plausible, and at 15x
              EBITDA (consistent with scaled transportation-tech platforms), enterprise value would range from $9–12
              billion. In this case, current Series D investors at $5 billion would earn a 1.8–2.4x gross multiple. The
              base case holds that SP+ integration delivers projected synergies, leverage falls to the S&P-projected
              8.1x by 2026, and EBITDA trends toward the $209 million run-rate figure by 2027. Platform extension
              revenue develops but meaningfully lags the bull timeline. At 12x EBITDA on $250 million by 2027, an
              enterprise value of $3 billion is implied—below the current Series D entry—meaning common equity holders
              receive a flat-to-negative return while preferred-stack investors are made whole. The $5 billion valuation
              implies the market has already priced in meaningful bull-case optionality. The bear case compounds credit
              risk, regulatory headwinds, and platform failure. If EBITDA expansion stalls—due to regulatory compliance
              costs, persistent customer trust erosion following the Tennessee settlement, or integration execution
              failures—the company may remain at 10x+ leverage through 2027. Any credit covenant breach or rating
              downgrade would trigger refinancing risk on the $1.1 billion term loan. If the platform thesis fails to
              materialize and Metropolis is valued on parking-operator comps at 7–8x EBITDA on $80–100 million actual
              EBITDA, enterprise value falls to $560–800 million, implying nearly full loss of equity with preferred
              investors recoverable only partially. Down-round risk for the next capital raise is material in the bear
              case.
            claimRefs:
              - CV004
              - CV012
              - CV013
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
