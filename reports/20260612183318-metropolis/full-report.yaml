      - number: '4.4'
        title: Financial verdict and remaining blockers
        blocks:
          - type: paragraph
            body: >-
              Metropolis looks scaled enough to matter and still opaque enough to block a clean underwrite. The
              operator-first model likely creates more durable revenue control than a thin marketplace, but it also
              creates labor, integration, and dispute-resolution costs that a software-only peer would not carry. The
              public source pack supports a thesis of improving gross-margin direction, high transaction scale, and
              active capital-market access. It does not support a precise view on revenue quality, cash conversion,
              customer concentration, or debt tolerance under stress. That is why the financial verdict should remain
              conditional. The company may be building an economically powerful platform, but outside investors still
              need management data to prove whether the economics are attractive enough at the current valuation and
              leverage profile. In practice, the next diligence step is not another press search; it is a controlled
