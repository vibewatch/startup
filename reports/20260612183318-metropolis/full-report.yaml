      - number: '1.3'
        title: Capital history, scale metrics, and disclosure boundaries
        blocks:
          - type: paragraph
            body: >-
              The public capital story is unusually well documented for a private infrastructure-technology company.
              Metropolis disclosed a $167 million Series B in 2021, announced the SP Plus take-private with $1.7 billion
              of committed financing in 2023, closed that deal with a layered Series C plus debt package in 2024, and
              then raised another $1.6 billion at an approximate $5 billion valuation in November 2025. The scale
              metrics are strong but not perfectly consistent across company materials, which is itself informative.
              Depending on the source and date, Metropolis cites 20 million, 21 million, or 23 million-plus members,
              more than 4,000, 4,200-plus, or 4,600-plus locations, and over $5 billion of annual transactions. Those
              differences look more like fast-growth timing drift than a broken story, but they still warrant caution
              when using any single number as a canonical benchmark. Revenue, precise run-date headcount, and detailed
              profitability remain largely undisclosed.
