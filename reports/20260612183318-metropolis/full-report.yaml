              - CR015
              - CR043
      - number: '7.2'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >
              Metropolis operates a technology that sits at the intersection of consumer-facing payments, automated
              vehicle surveillance, and personal data access, making it structurally exposed to multi-layered regulatory
              risk. The Tennessee Attorney General's January 2026 settlement imposed $8.75M in combined restitution,
              refunds, and free-parking credits to resolve allegations of misleading pricing, inadequate signage,
              technology-driven surprise fees, and notices designed to look like government-issued citations. The
              settlement is final and operative, but consumer protection attorneys and state AGs in other jurisdictions
              have used Tennessee as a blueprint, and multi-state coordination is a real near-term scenario. The
              parallel DPPA class action alleges that Metropolis illegally accessed state motor vehicle records to
              identify vehicle owners and mail citation-like notices, a practice that the lawsuit claims violates the
              federal Driver's Privacy Protection Act. Class certification, if granted, would materially raise the
              financial exposure and complicate operations in every state where similar enforcement practices have
              occurred. On the regulatory front, Virginia enacted an ALPR law in 2025 requiring deletion of captured
              plate data within 30 days, and Arkansas and Idaho also passed restrictions. Metropolis acknowledges in its
              privacy policy that it operates a License Plate Recognition system and collects vehicle and
              biometric-adjacent data. Only three states enacted LPR-specific laws in 2025, but legislative momentum and
              lack of federal preemption leave the regulatory map subject to rapid change. Illinois's Biometric
              Information Privacy Act (BIPA) exposes any company that collects biometric identifiers without written
              consent to statutory damages. More than 100 BIPA class actions were filed in 2025 across industries using
              camera and recognition technology. Metropolis has not confirmed a BIPA-specific consent framework for
              Illinois deployments, leaving potential exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
