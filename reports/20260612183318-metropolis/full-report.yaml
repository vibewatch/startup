      - CV020
      - CV021
      - CV022
      - CV023
  - id: FV004
    title: Investment KPI scorecard
    type: kpi
    layout: wide
    summary: IC-ready scoring across seven dimensions; scale excellent but economics and valuation suppress overall score.
    data:
      items:
        - label: Market scale and position
          value: 9
          max: 10
          note: Largest US parking network; 4,200+ locations; near-monopoly density in major metros
        - label: Product and technology proof
          value: 7
          max: 10
          note: Live at scale in parking; vertical expansion unproven; Oosto acquisition adds capability
        - label: Competitive moat
          value: 7
          max: 10
          note: Network density and data flywheel are real moats; LPR regulatory risk threatens moat durability
        - label: Economics and financial health
          value: 3
          max: 10
          note: 12.4x leverage; $29.5M actual EBITDA; B3/B- rated; preferred overhang
        - label: Customer and revenue quality
          value: 6
          max: 10
          note: $5B transactions; 50M customers; SaaS penetration undisclosed; TN settlement signals trust risk
        - label: Risk profile
          value: 3
          max: 10
          note: High regulatory, legal, financial, and integration risk; multiple tail scenarios
        - label: Valuation attractiveness
          value: 2
          max: 10
          note: 169x actual EBITDA; stretched even on run-rate; credit market validated skepticism
    approximationNotes: Scores are qualitative assessments based on evidence gathered across chapters 1–8; not a quantitative model.
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV038
      - CV040
