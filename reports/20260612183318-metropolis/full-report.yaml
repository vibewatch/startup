      - number: '7.3'
        title: Financial and capital-structure risks
        blocks:
          - type: paragraph
            body: >
              The SP+ acquisition transformed Metropolis into a highly leveraged entity. S&P assigned a B- rating and
              projected leverage of approximately 12.4x in 2025, declining to 8.1x in 2026 if integration targets are
              met. Moody's assigned a B3 rating for both the company and the 2025 term loan. These ratings reflect
              substantial credit risk and signal that investor confidence in the company's EBITDA quality remains
              limited. In 2025, Metropolis sought a $1.1 billion term loan through JPMorgan to refinance earlier private
              credit debt, at price talk of SOFR+425-450 basis points. Investors expressed pronounced skepticism because
              Metropolis marketed the loan on a run-rate adjusted EBITDA of approximately $209 million against an actual
              reported EBITDA of $29.5 million, an adjustment ratio that the credit markets found difficult to
              underwrite. The loan also carried a $342 million Series D preferred stock tranche that increases dilution
              risk and overhang for common equity holders. High leverage creates three interconnected risk vectors:
              first, it constrains operational flexibility since even moderate EBITDA shortfalls relative to plan can
              trip interest-coverage covenants; second, it limits the company's ability to invest in technology
              modernization, compliance infrastructure, or acquisitions without external capital; third, if synergies
              from the SP+ integration are delayed or smaller than projected, the leverage ratio will not decline as
              fast as the model assumes, increasing the probability of a distressed refinancing. The absence of
              confirmed free cash flow generation and the niche-sector positioning further limit the refinancing market
              to a small set of specialized credit investors.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR038
              - CR039
