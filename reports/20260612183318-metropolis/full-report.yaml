      - number: '3.2'
        title: Metropolis versus operator and marketplace rivals
        blocks:
          - type: paragraph
            body: >-
              Metropolis’ core difference is vertical integration. The company combines owned or operated physical
              assets, computer-vision checkout, a large member graph, and a field operations bench that now exceeds
              20,000 employees. That is a meaningfully different posture from reservation marketplaces or simple payment
              apps. It can be a strength when a property owner wants a full operating answer, but it also comes with
              more capital intensity and integration burden. Marketplaces still have a lighter-weight adoption path and
              can direct consumer demand without taking full operational responsibility. Payment apps still work well
              when the parking job is mostly transaction settlement rather than end-to-end site transformation. The
              result is not a winner-take-all market but a layered one where Metropolis’ integrated model is strongest
              in larger, experience-sensitive portfolios. Public engineering and hiring surfaces also suggest Metropolis
              is investing in internal technical depth rather than only rebranding acquired assets, which may matter in
              longer competitive cycles.
