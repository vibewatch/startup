  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk landscape and severity ranking
        blocks:
          - type: paragraph
            body: >
              Metropolis's risk profile is shaped by four interlocking dimensions: regulatory and legal exposure from
              its camera-based, data-intensive parking enforcement model; financial fragility from the highly leveraged
              SP+ acquisition; operational complexity from integrating a large, geographically dispersed legacy
              workforce and infrastructure; and partner or dependency concentration across cloud providers, capital
              sources, and channel partners. These dimensions are not independent. A regulatory action that compels
              operational changes elevates cost and reduces EBITDA, which directly stresses an already-high leverage
              ratio and increases refinancing risk. Integration delays that slow cost-synergy capture compound the same
              problem. The risk severity ranking places financial and capital-structure risk at the top because its
              potential transmission to an insolvency-threatening outcome is the fastest and most irreversible.
              Regulatory and legal risk is a close second because active litigation and enforcement with multi-state
              precedent could simultaneously force operational changes, generate cash settlements, and constrain growth
              in the largest markets. Operational and technical risk is ranked third; its failures are recoverable but
              chronic if not managed. Dependency and partner risk is material for the credit and capital layer, moderate
              for the technology layer. People and execution risk centers on key-person concentration and SP+
              integration PMO capacity. All five dimensions require monitoring. Callouts below identify the kill
              criteria that would force a binary investment decision.
            claimRefs:
              - CR001
              - CR011
              - CR017
              - CR036
              - CR037
              - CR039
              - CR043
          - type: figure
            figureRef: FR001
            claimRefs:
