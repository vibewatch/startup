      - number: '4.3'
        title: Capital structure and adequacy
        blocks:
          - type: paragraph
            body: >-
              Capital structure is the clearest part of the financial picture. The SP Plus take-private required a
              large, layered financing package, and the November 2025 round added another $1.6 billion split between
              equity and debt. The SEC filing stack around the SP Plus merger adds precision about the structure, while
              CNBC and Reuters make clear that access to capital remains central to Metropolis’ playbook. This has two
              implications. First, financial flexibility matters as much as revenue growth because the company is
              carrying a more complex balance-sheet story than a light SaaS business. Second, repeated large raises
              imply that management still sees large market-opening investments ahead. Public materials do not disclose
              cash on hand, runway, or covenant headroom, so capital adequacy can only be judged directionally. The
              practical underwriting consequence is that solvency risk probably sits less in near-term fundraising
              access and more in whether the company can integrate acquisitions fast enough to earn strong returns on
              this capital base.
