      - number: '3.3'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The most credible public moat for Metropolis is not any single algorithmic feature; it is the combination
              of footprint, member scale, operations muscle, and reusable demand channels. More than 20 million members,
              one million new members per month, and a large field-service bench can create a distribution and execution
              advantage that lighter rivals may struggle to match. But those advantages are not absolute. Drivers can
              still multi-home across apps, owners can still layer marketplaces on top of an operator stack, and legacy
              operators can still defend accounts through relationships and service. The risk chapter should therefore
              treat moat durability as real but incomplete. Metropolis appears stronger than many peers in integrated
              execution, but not yet invulnerable to reservation, payment, or lower-capital alternatives. The strongest
              counterargument is that buyers may prefer modular adoption paths even when Metropolis offers the richer
              long-term platform.
