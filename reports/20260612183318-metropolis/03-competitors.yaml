- id: segment-by-segment-winners-and-unknowns
  title: Where each model likely wins and what remains unknown
  body: Different segments likely choose different tools. Airports and large managed portfolios look structurally favorable
    to Metropolis because they reward deep operational integration, high throughput, and reusable reservation or loyalty channels.
    Simpler urban payment jobs may still favor app-first or marketplace-first substitutes. Commercial real estate remains
    especially nuanced because many owners will tolerate legacy friction if the economics are acceptable, which means Metropolis
    has to prove not just convenience but measurable property-level value. Public evidence is therefore strongest on the shape
    of the landscape and weaker on realized economics. The missing pieces are pricing transparency, retention by segment,
    and direct head-to-head win-rate data. Until those are surfaced, the right conclusion is that Metropolis has a serious
    moat case, but not yet a closed case. That is enough to credit differentiated positioning, but not enough to assume enduring
    category dominance. Investors should therefore think in terms of segment-level competitive wins, not a single universal
    market-share narrative.
