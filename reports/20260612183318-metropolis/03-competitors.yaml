  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Head-to-head contract economics, take rates, and realized pricing by competitor class.
    whyItMatters: Competitive positioning is highly sensitive to whether Metropolis wins through revenue uplift, lower cost,
      or better user experience.
    diligencePath: Request competitive bake-offs, contract terms, and win/loss notes by segment.
    relatedTableRefs:
    - TP003
    relatedQuestionRefs:
    - QP009
    - QP025
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Segmented retention and renewal data versus competitors.
    whyItMatters: A moat case requires more than logos and scale; it needs proof that partners stay and expand.
    diligencePath: Request renewal rates, churn reasons, and expansion data by airport, mixed-use, hospitality, and event
      cohorts.
    relatedQuestionRefs:
    - QP012
    - QP025
  - type: private-evidence-only
    severity: material
    topic: win-rate
    missingEvidence: Direct win-loss and displacement data against SpotHero, ParkMobile, LAZ, FLASH, and incumbent status
      quo.
    whyItMatters: Without win-rate data, the moat conclusion rests on structural logic rather than observed market share capture.
    diligencePath: Request CRM-coded win/loss reports and top-deal debriefs by competitor.
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: consumer-ux
    missingEvidence: Normalized consumer satisfaction or app-rating comparisons across parking competitors.
    whyItMatters: Consumer preference is part of the thesis, but the public pack is too thin for a rigorous comparative score.
    diligencePath: Gather app-store review exports, NPS, and dispute-rate comparisons across the major consumer-facing tools.
    relatedQuestionRefs:
    - QP022
