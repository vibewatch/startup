tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Metropolis
    - Integrated operator + recognition platform
    - 4,000+ locations; 20M+ members; 20,000+ ops staff
    - Commercial real estate, airports, hospitality, events, adjacencies
    - Owns or operates assets and controls on-site transaction flow
    - Capital-intensive and more operationally complex
  - - SpotHero
    - Reservation marketplace
    - Large consumer parking marketplace
    - Urban and event parking discovery
    - Strong demand aggregation and pre-booking behavior
    - Does not inherently control on-site operations
  - - ParkMobile
    - Payment app / mobile parking network
    - Large mobile parking payment footprint
    - On-street, municipal, and app-first off-street payment
    - Simple app-led payment behavior
    - Less differentiated when owners want full asset transformation
  - - LAZ Parking
    - Operator incumbent
    - National operator scale
    - Commercial, municipal, airports, hospitality
    - Deep operating relationships and service history
    - Less public emphasis on a recognition-member network
  - - SP Plus / Parking.com
    - Operator / brand complex now inside Metropolis
    - Large operator footprint and consumer brand
    - Airports, urban parking, reservations
    - Embedded operating assets and channels
    - No longer a clean external comparator post acquisition
  - - REEF
    - Urban real-estate / parking adjacency platform
    - Urban mixed-use and curb / asset repurposing
    - Mixed urban real estate
    - Broader asset-activation framing
    - Only partially comparable to parking-only workflows
  - - FLASH
    - Legacy / equipment-centric parking tech
    - Known parking-technology brand
    - Parking operators and access-control buyers
    - Represents traditional technology-stack alternative
    - Public moat signal is less about consumer network effects
  - - ParkWhiz / Way
    - Consumer reservation alternatives
    - Marketplace or super-app parking discovery
    - Event and consumer booking use cases
    - Low-friction discovery and pre-booking
    - Less control over full operating stack
  notes: Profile rows use public homepage-level evidence and should be read as directional strategic positioning, not private-company
    financial disclosure.
