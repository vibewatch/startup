- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or threat
  - Why it matters
  - Severity
  - Mitigation / offset
  - Diligence ask
  rows:
  - - Member network and repeat preference
    - Demand-side scale can compound across locations
    - medium
    - Loyalty and ecosystem partnerships reinforce usage
    - Measure repeat-location conversion and multi-home behavior
  - - 20,000+ operations workforce
    - Execution advantage for launches and support
    - medium
    - Large bench supports complex rollouts
    - Quantify productivity and fixed-cost burden
  - - Marketplaces can still multi-home demand
    - Owners may use Metropolis plus SpotHero / ParkWhiz simultaneously
    - high
    - Metropolis can internalize some channels via AeroParker and owned brands
    - Request attach-rate and cannibalization data by channel
  - - Payment apps remain sufficient for simpler jobs
    - Not every buyer needs full operational transformation
    - medium
    - Target the segments where integrated operations matter most
    - Map segment win rates against app-led alternatives
  - - Capital intensity of operator-first model
    - Can compress returns or slow flexibility versus lighter rivals
    - high
    - Leverage scale and revenue uplift to justify ownership model
    - Review cash returns and integration discipline by acquisition cohort
  - - Technology commoditization risk
    - Recognition alone may not be a permanent moat
    - medium
    - Footprint and operations create layered defensibility
    - Request head-to-head displacement data versus legacy stacks
  notes: The best public case is layered moat rather than single-feature moat.
