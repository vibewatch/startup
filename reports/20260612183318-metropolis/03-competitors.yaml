- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor class
  - Public pricing visibility
  - Commercial model
  - Included capabilities
  - Unknowns / implication
  rows:
  - - Metropolis
    - Low
    - Operator contracts, revenue share, or enterprise pricing likely dominate
    - Recognition, payments, operations, analytics
    - List pricing is not public, so buyer ROI matters more than sticker price
  - - Reservation marketplaces
    - Low to medium
    - Consumer booking fees / operator demand fees
    - Discovery, pre-booking, demand aggregation
    - Actual take rates and net economics vary by partner
  - - Payment apps
    - Low to medium
    - Transaction-based app payment economics
    - App-led payment and user identity
    - May be easier to adopt where workflow stays simple
  - - Operator incumbents
    - Low
    - Management contracts and operating fees
    - Labor, management, local relationships
    - Economic comparison depends on scope of services
  - - Legacy stacks
    - Low
    - Equipment, software, and maintenance mix
    - Access control and core parking workflows
    - Can appear cheaper until downtime and upgrade costs accumulate
  notes: Unknown pricing is an analytical result, not an omission; the competitive lens is packaging and adoption burden.
