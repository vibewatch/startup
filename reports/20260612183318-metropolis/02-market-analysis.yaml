  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: A bottoms-up public estimate of Metropolis-specific SAM by segment and geography.
    whyItMatters: Without a constrained SAM, it is easy to over-credit parking-adjacent rhetoric in valuation work.
    diligencePath: Request internal segment TAM/SAM/SOM deck with assumptions by vertical, geography, and monetization layer.
    relatedTableRefs:
    - TM002
    relatedQuestionRefs:
    - QM020
    - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Location-level ROI data on revenue uplift, staffing reduction, and deployment payback by segment.
    whyItMatters: Buyer conversion and long-term market penetration depend on proven economics, not just large abstract TAM.
    diligencePath: Request before/after cohort data for airports, offices, hospitality, and mixed-use deployments.
    relatedTableRefs:
    - TM003
    - TM004
