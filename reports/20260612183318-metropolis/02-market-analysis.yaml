tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Parking operations
    - Off-street fee collection, reservations, validations, access and field operations
    - Unrelated roadway tolls or traffic enforcement
    - Property owners, operators, airport authorities / parkers
    - Current proven wedge and revenue base
  - - Parking software and control
    - Recognition, payment automation, reservations, analytics, validations
    - General-purpose CRE software not tied to parking workflows
    - Operators and property managers / owners
    - Core software and workflow layer
  - - Airport landside mobility
    - Parking, reservations, curb access, traveler arrival flows
    - In-terminal security and airline operations
    - Airport authority / travelers
    - High-value, revenue-centric early-adopter segment
  - - Hospitality and venue arrival
    - Valet, self-park, guest arrival, event ingress
    - Non-parking hotel PMS or ticketing systems
    - Hotels, resorts, venues / guests
    - Extends parking to premium CX use cases
  - - Recognition infrastructure adjacencies
    - Fueling, drive-thru, vertiports, access-linked commerce
    - General retail checkout without location-based identity relevance
    - Enterprise operators / end customers
    - Potential upside but less proven than parking
  - - Reservation marketplaces
    - Advance booking demand channels
    - Physical lot ownership economics
    - Marketplaces, operators / parkers
    - Important substitute and distribution layer
  notes: The market boundary is layered rather than singular; Metropolis competes across parking operations, software, and
    selected adjacencies.
