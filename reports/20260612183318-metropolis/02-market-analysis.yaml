company:
  name: Metropolis
chapter:
  number: 2
  title: Market Analysis
  summary: Metropolis competes in a layered market that starts with off-street parking operations and parking software, then
    extends into reservations, loyalty, airport mobility, and selected recognition-based adjacencies. Public analyst sources
    support a multi-billion-dollar smart-parking opportunity, while airport and property evidence shows parking can be a strategically
    important revenue and customer-experience layer rather than a commodity afterthought. The strongest diligence conclusion
    is that the market is clearly large and attractive, but precise Metropolis-specific SAM and adjacency economics remain
    under-disclosed.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing logic
  body: "Metropolis sits at the intersection of three overlapping markets: parking operations, parking software and payments,\
    \ and a broader recognition-enabled infrastructure layer that could spill into adjacent physical-world transactions. The\
    \ first step is to avoid collapsing these into a single TAM. Industry and analyst sources support a large, durable parking\
    \ economy, while smart-parking market researchers frame the automation layer as a smaller but faster-growing software\
    \ and systems opportunity. That distinction matters because Metropolis is not a pure software overlay. By owning or operating\
    \ much of the parking footprint itself after the SP Plus transaction, it can attack the market both as an operator and\
    \ as a technology upgrader. The credible market story is therefore not \u201Call urban commerce,\u201D but a layered TAM\
    \ made up of parking revenue pools, automation/control systems, and selected adjacency revenue once the company proves\
    \ repeatability outside parking."
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
  - TM002
