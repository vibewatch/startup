- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Airport non-aero revenue dependence
    - Positive
    - Current
    - Parking modernization can be justified as a revenue lever, not just a tech upgrade
    - Quantify revenue uplift and capex avoidance by airport cohort
  - - Zero-CapEx / 30-day launch promise
    - Positive
    - Current
    - Low perceived switching cost can speed top-of-funnel conversion
    - Verify realized deployment timelines and commercial terms
  - - Member preference and loyalty loops
    - Positive
    - Current
    - Seamless experiences may create demand pull across partner locations
    - Measure actual repeat behavior and location-level uplift
  - - Reservation and loyalty channels
    - Positive
    - Current
    - Bilt and AeroParker can enlarge demand and conversion surfaces
    - Measure incremental demand versus cannibalization
  - - Legacy hardware and ops inertia
    - Negative
    - Current
    - Process redesign and signage changes still create deployment friction
    - Map true implementation burden by property type
  - - Privacy / consumer-protection concerns
    - Negative
    - Current
    - Recognition-based parking requires trust and compliant data handling
    - Review complaint rates, disclosures, and market-level exception handling
  - - Adjacency overreach risk
    - Negative
    - Forward
    - Hotels, fueling, and retail expand TAM but may outrun proof
    - Demand vertical-by-vertical proof before crediting full adjacency TAM
  notes: "The same features that create upside \u2014 recognition, identity-linked payments, and ecosystem connectivity \u2014\
    \ also create trust and implementation obligations."
