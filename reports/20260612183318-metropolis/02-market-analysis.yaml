- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: The strongest adoption drivers in the public evidence are revenue improvement, lower friction, and reduced operational
    complexity. Airports care about non-aero revenue and smoother passenger journeys. Real-estate owners care about getting
    live quickly without major capital expenditure. Metropolis also tries to create demand-side pull by making the user experience
    seamless, then linking it to loyalty and reservation ecosystems such as Bilt and AeroParker. Those drivers are real, but
    adoption is not frictionless. Buyers still face change-management risk around signage, support, validations, lane operations,
    and data governance. Recognition-based systems also introduce privacy and consumer-protection considerations. The Tennessee
    settlement is not a market-wide indictment of the category, but it is proof that implementation quality and compliance
    matter enough to affect the pace of buyer trust and adoption.
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM027
  - CM028
  - CM029
  - CM030
  tableRefs:
  - TM004
  figureRefs:
  - FM004
- id: adjacencies-and-evidence-gaps
  title: Adjacencies, status-quo substitutes, and unresolved sizing gaps
  body: "Metropolis\u2019 most interesting market claim is that parking is only the first node in a broader mobility and recognition\
    \ network. The Joby partnership, the airport reservation stack, and the company\u2019s expansion narrative around hospitality,\
    \ fueling, and retail all support that ambition. But the public source pack is still better at proving the first node\
    \ than the full adjacency map. The status quo remains varied: some buyers use legacy gate systems, some use app-based\
    \ parking payments, some rely on reservation marketplaces, and some simply tolerate anonymous cash-collection or badge-driven\
    \ workflows. That diversity widens the opportunity but complicates precise SAM and SOM math. It also means competitive\
    \ context changes by segment: airports care about reservations and revenue management, office and mixed-use assets care\
    \ about tenant convenience and operating leverage, and hospitality buyers care about premium arrival experience. A further\
    \ complication is that the public evidence does not cleanly split transaction-processing revenue, software-like subscription\
    \ economics, and pure operating fee capture by segment, so even a sound strategic story still lacks a fully segmented\
    \ monetization model. The appropriate conclusion for diligence is that the market is clearly large and attractive, while\
    \ exact Metropolis-specific penetration ceilings, segment margins, and adjacent-vertical economics remain insufficiently\
    \ disclosed for precision underwriting."
