company:
  name: Prime Intellect
chapter:
  number: 7
  title: Risks
  summary: >-
    Prime Intellect's highest underwriting risks are operating reliability across heterogeneous
    compute, evaluation integrity, cross-border policy exposure, and unproven unit economics.
    Public evidence shows substantial activity and financing, but usage is not an outcome
    denominator, funding is not cash available, and no assigned source closes the security,
    concentration, margin, or incident-history gaps.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >-
      The leading residual risk is execution across a technically demanding stack rather than a
      demonstrated company-specific legal event. An independent profile places distributed
      training at a research-to-pilot stage and says its iso-cost, iso-time ceiling is roughly an
      order of magnitude behind centralized frontier training. Other sources identify sample
      inefficiency, reward-design difficulty, heterogeneous-cluster latency, and immature
      integration support. Prime Intellect's reported beta volume is encouraging, but one review
      correctly distinguishes more than 10,000 jobs from production-grade outcomes. The risk
      register therefore assigns high residual exposure until run success, recovery, reproducibility,
      security, and deployment-outcome denominators are supplied. Severity is an underwriting
      assessment tied to these disclosed limitations, not evidence of a recorded outage or breach.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      The assigned evidence does not establish a Prime Intellect lawsuit, enforcement action,
      certification, or security incident, and that evidentiary absence cannot establish that none
      exists. The strongest public warning is sector-level: Al Jazeera reports a US directive that
      required Anthropic to suspend foreign-national access to two advanced models, illustrating
      how national-security policy can abruptly change access to AI technology. Prime Intellect's
      own reposted role describes programs in regulated industries and the public sector, which
      expands the importance of export screening, data residency, privacy terms, sandbox isolation,
      and auditability. Legal diligence should therefore obtain primary registry searches, the trust
      package, DPA and subprocessor list, incident and claims history, IP allocation, and counsel's
      current export-control analysis.
    claimRefs: [CR008, CR015]
    tableRefs: [TR001]
  - id: dependencies-and-economics
    title: Partner, infrastructure, and financial-model risk
    body: >-
      Prime Intellect aggregates compute across its own and partner capacity, making provider
      diversity part of the product while also creating exposure to capacity, topology, network,
      and price variance. Dell Technologies Capital says compute supply and frontier RL talent remain
      scarce; as an investor, it is a partner source rather than independent verification. Tracxn
      reports 80 employees in September 2026 and $150 million raised across three rounds, but funding
      raised is not cash available and headcount does not prove sufficient delivery capacity. Dell
      also reports more than $100 million in annualized revenue reached in under a year; annualized
      revenue is not ARR, audited revenue, gross margin, or cash flow. Live pricing is similarly
      unresolved because the assigned comparison page warns that automated prices may omit regional,
      commitment, reservation, or negotiated terms.
    claimRefs: [CR001, CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break criteria
    body: >-
      Mitigation should be proved through telemetry and contracts rather than architecture claims.
      Require provider-level capacity concentration, measured failover and recovery objectives,
      training-run failure causes, reproducibility tests, sandbox penetration results, customer
      deployment outcomes, and cohort renewal data. Monitor realized compute cost per successful
      training outcome, customer-specific services load, gross margin, and price concessions.
      Gartner's 2025 forecast expected GenAI spending above $600 billion while also expecting fewer
      ambitious projects after past failures, so a growing market does not remove execution risk.
      Open-model commoditization is another pressure: one independent analysis cites a narrowing
      Chatbot Arena gap from 8% to 1.7% in one year. Re-underwrite if a material provider cannot fail
      over, regulated deployment is blocked, security evidence reveals unresolved high-severity
      findings, or audited cohort economics do not support repeatable positive contribution margin.
    claimRefs: [CR014, CR015, CR016]
