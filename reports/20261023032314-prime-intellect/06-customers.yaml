company:
  name: Prime Intellect
chapter:
  number: 6
  title: Customers
  summary: Prime Intellect has credible named-customer evidence from Ramp and Zapier, plus reported repeat usage by technically sophisticated teams, but public evidence still does not establish customer count, retention, revenue concentration, or contract durability. The strongest proof is workflow-specific production use and measurable task outcomes; broad platform-usage metrics remain company- or partner-reported.
sections:
  - id: buyer-segments-and-adoption
    title: Buyer segments and adoption surfaces
    body: Prime Intellect appears to sell primarily to engineering, applied-AI, and research teams that need task-specific agents while retaining control of data, models, and improvement loops. The reported use cases span finance operations, workflow automation, browser automation, customer support, coding, and other enterprise workflows, which suggests a horizontal platform with verticalized environments rather than a single application. Its customer value proposition is the combination of compute, environments, evaluation, reinforcement learning, and deployment; this can reduce the integration burden for teams that otherwise need several internal systems. The available evidence supports active experimentation and some production-oriented use, but not a verified total customer base or a clean distinction between paying customers, beta users, research collaborators, and platform visitors. Customer segmentation is therefore best treated as an evidence-backed operating hypothesis, not a complete market census.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: named-deployments-and-outcomes
    title: Named deployments and outcome evidence
    body: >-
      Ramp is the clearest named customer proof in the assigned evidence. Ramp described Fast Ask, a small reinforcement-learning subagent built with Prime Intellect, as improving spreadsheet retrieval: the customer reported a four-percentage-point exact-match advantage over Claude Opus at a Claude Haiku latency profile and a ten-percentage-point improvement over its base model. Those are customer-reported evaluation results, not an independent benchmark, but they connect Prime Intellect to a concrete production workflow and a measurable outcome. Zapier provides a second customer-side signal through a joint webinar describing reinforcement-learning environments tailored to real-world automation data and agents handling production workloads. Radical Ventures also reports that Ramp and Zapier use the platform, while its own diligence narrative says technically sophisticated teams returned to run more workloads. These signals support real adoption and repeat use, but they do not disclose contract size, deployment breadth, renewal status, or customer-level economics.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Retention, expansion, and concentration
    body: >-
      Public evidence is materially thinner on durability than on initial adoption. Radical Ventures describes repeat workloads and more than $100 million in annualized revenue reached in under a year, but that is an investor statement and does not provide NRR, GRR, churn, cohort retention, contract length, or the denominator behind repeat behavior. Venture Capital Tracker labels approximately $100 million ARR as a company claim and specifically cautions that retention and gross margin still need underwriting. The product architecture creates plausible expansion paths: a team can start with environments or hosted training, then add evaluations, inference, and additional workflows. However, the assigned sources do not show how often that path occurs or whether a small number of large accounts drive revenue. Customer concentration, renewal, pricing, and channel dependence remain material diligence gaps, especially because named proof is concentrated in a small set of high-profile technology companies.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
callouts:
  - calloutType: strength
    title: Named workflow proof is stronger than logo proof
    body: Ramp's disclosed spreadsheet-retrieval results and Zapier's production-environment discussion connect Prime Intellect to specific workflows and evaluation practices rather than unactionable logo claims.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Retention and concentration are not publicly underwritten
    body: The evidence does not disclose NRR, churn, renewal terms, top-customer share, or the number of paying customers; these gaps limit confidence in durability and revenue quality.
    claimRefs: [CU010, CU011, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer or user, Use case, Evidence of scale or value, Strategic value, Diligence gap]
    rows:
      - [Enterprise applied-AI teams, Engineering and applied-AI leads, Task-specific agents and private improvement loops, Dell reports sophisticated teams chose Prime Intellect and returned to run more, Own model and data loop, Paying-account count and contract terms]
      - [Finance and operations teams, Product or automation engineering, Spreadsheet retrieval and finance workflows, Ramp reports Fast Ask deployed for spreadsheet questions, Measurable workflow efficiency, Production volume and renewal status]
      - [Workflow automation teams, Applied AI engineers, Real-world automation agents and RL environments, Zapier describes environments for production workloads, Reference-quality workflow proof, Scope of deployment and spend]
      - [Research and frontier teams, ML researchers, "Post-training, evaluations, and RL experiments", PlanetTools reports more than 10000 beta training jobs across task categories, Usage breadth and technical feedback, Paid versus experimental job mix]
    notes: Evidence is a partial, source-bounded segmentation from named use cases and investor descriptions; it is not an exhaustive customer census and does not equate activity with paid production adoption.
    claimRefs: [CU001, CU002, CU005, CU007, CU008]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source and confidence, Implication, Missing denominator]
    rows:
      - [Beta training jobs, "More than 10,000", Before May 7 2026 GA, The Planet Tools; medium confidence, Broad platform experimentation signal, Jobs per customer and paid share]
      - [Reported annualized revenue, "More than $100M", Within under one year of launch, Dell Technologies Capital; medium confidence, Investor-reported commercial traction, Customer count and revenue recognition basis]
      - [Reported ARR, "~$100M", 2026, Venture Capital Tracker citing company materials; medium confidence, Company-reported scale claim, ARR definition and retention]
      - [Ramp exact-match lift versus base model, "10 percentage points", May 7 2026 report, Analytics India Magazine quoting Ramp; medium confidence, Concrete workflow outcome, Evaluation set size and production conversion]
      - [Ramp advantage versus Claude Opus, "4 percentage points", May 7 2026 report, Analytics India Magazine quoting Ramp; medium confidence, Competitive task signal, Comparable test protocol and sample size]
      - [Zapier production workload signal, "Production workloads", December 2 event listing, Zapier; medium confidence, Named customer-side deployment context, Number of workflows and paid status]
    notes: Values preserve each source's terminology and period. Revenue and ARR are not treated as interchangeable, and customer-side performance figures are reported claims rather than independently replicated benchmarks.
    claimRefs: [CU004, CU006, CU007, CU008, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Ramp, Fintech and finance operations, Fast Ask spreadsheet retrieval subagent, Production-oriented customer report, 10 percentage-point gain over base model and 4-point advantage over Claude Opus at lower latency profile, Customer-reported evaluation; no sample size]
      - [Zapier, Workflow automation, RL environments and verifier-driven optimization for automation agents, Production workloads described in customer webinar, Environment design and evaluation for agent performance, Webinar does not quantify deployment or commercial terms]
      - [Perplexity, AI-native product team, Frontier AI research using Prime Intellect stack, Usage reported by investor, Named sophisticated user of the stack, "No public workload, spend, or renewal detail"]
      - [Unnamed technically sophisticated teams, Enterprise or research teams, Demanding workloads and repeat runs, Repeat usage reported by investor, Suggests repeat utility, "No names, cohort size, or independent corroboration"]
    enumerationScope:
      coverage: sample
      basis: Publicly named or specifically described customer and user evidence available in the assigned 2026 source pool; not a complete customer list.
    notes: Named-customer evidence is deliberately separated from logos and broad platform-usage claims; production status is retained only where the source explicitly describes production workloads or customer deployment.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from environment to expansion
    type: journey-map
    summary: Evidence supports a workflow-led path from task definition and evaluation to training, deployment, and possible repeat use, while later-stage retention remains unverified.
    data:
      items:
        - label: Define workflow
          detail: Customer brings a task, environment, harness, and reward or evaluation objective.
          touchpoints: [Customer workflow, environment design]
        - label: Evaluate and train
          detail: Hosted evaluations and reinforcement-learning training turn the workflow into an iterative model-improvement loop.
          touchpoints: [Baseline evaluation, RL training, rollout inspection]
        - label: Deploy outcome
          detail: Improved adapters or models can be served through an OpenAI-compatible inference surface.
          touchpoints: [Inference, production integration]
        - label: Repeat and expand
          detail: Investor evidence describes technically sophisticated teams returning to run more workloads; NRR, renewal, and account expansion are not disclosed.
          touchpoints: [Repeat workloads, additional environments, unresolved retention]
        - label: Renew
          detail: No public source reports renewal, churn, GRR, or NRR for a Prime Intellect customer cohort.
          touchpoints: [Renewal, retention gap]
        - label: Concentration check
          detail: Named evidence is concentrated in a small set of technology companies, with no disclosed top-customer share.
          touchpoints: [Customer concentration, spend bands]
    claimRefs: [CU002, CU003, CU009, CU012]
