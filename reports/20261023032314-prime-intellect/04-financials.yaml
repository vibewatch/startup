    title: Revenue model bridge
    type: flow
    summary: Prime Intellect's described product layers can convert customer workloads into usage and subscription revenue, but public evidence does not quantify the mix or gross-profit conversion.
    data:
      nodes:
        - id: customer-workload
          label: Customer AI workload
          detail: "Agent training, evaluation, deployment, or inference demand"
        - id: contract-scope
          label: Contract scope
          detail: "Usage, subscription, or reserved-capacity terms; not publicly disclosed"
        - id: platform-layers
          label: Platform layers
          detail: "Compute, RL environments, evals, hosted training, and inference"
        - id: delivery-costs
          label: Delivery costs
          detail: "GPU, orchestration, storage, support, and reliability costs"
        - id: billable-usage
          label: Billable usage and subscriptions
          detail: "Usage-based and subscription model described; prices not disclosed"
        - id: gross-profit
          label: Gross profit
          detail: "Not publicly quantified; depends on GPU, support, and delivery costs"
      edges:
        - from: customer-workload
          to: contract-scope
        - from: contract-scope
          to: platform-layers
        - from: platform-layers
          to: billable-usage
        - from: platform-layers
          to: delivery-costs
        - from: delivery-costs
          to: gross-profit
        - from: billable-usage
          to: gross-profit
    approximationNotes: "Ordered mechanism from public product descriptions; no revenue, conversion, or margin values are inferred."
    claimRefs: [CI001, CI003, CI007]

callouts:
  - calloutType: strength
    title: Reported scale with customer proof
    body: "Sources repeatedly report more than $100 million in annualized revenue, and Ramp describes measurable task-level improvement from a Prime Intellect collaboration."
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Margin and runway are not disclosed
    body: "No assigned source provides gross margin, burn, cash, debt, utilization, customer concentration, or realized pricing, leaving capital adequacy and valuation highly sensitive to private data."
    claimRefs: [CI007, CI012, CI016]
  - calloutType: recommendation
    title: Require a product-level financial data room
    body: "Underwriting should wait for a revenue bridge, workload gross margins, cohort retention, customer concentration, cash bridge, and infrastructure obligations."
    claimRefs: [CI003, CI007, CI012, CI016]

