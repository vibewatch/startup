      - [Inference, OpenAI-compatible model serving, Tokens / deployed workload, "Deployment capability described; price not disclosed", "Independent product coverage", "Provide realized price, utilization, and gross margin by serving mode"]
    notes: "Public sources describe multiple monetization surfaces, but no source discloses revenue mix, realized pricing, take rate, or gross margin; null-like status means not publicly quantified."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Dimension, Public evidence, List versus realized, Underwriting implication, Required evidence]
    rows:
      - [Platform access, "Multiples labels the model usage-based and subscription", "No list price or realized price disclosed", "Recurring software contribution cannot be isolated", "Price book and customer contract sample"]
      - [Compute, "Global GPU compute marketplace and hosted training are described", "Usage unit and discounts unavailable", "Pass-through exposure may compress gross margin", "GPU cost, markup, and utilization schedule"]
      - [Inference, "OpenAI-compatible inference is described", "No list or realized price disclosed", "Capacity mix and commitment risk are unknown", "Tariffs, credits, and reserved-capacity terms"]
      - [Enterprise contracts, "Enterprise and startup customers are referenced", "No ACV, term, renewal, or discount data", "Sales efficiency and concentration cannot be tested", "Bookings, ARR bridge, cohort retention, and top-10 concentration"]
    notes: "This is a disclosure map, not a pricing benchmark; official or company-adjacent descriptions do not establish realized revenue or margin."
    claimRefs: [CI003, CI004, CI013, CI015]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annualized revenue, "> $100M", medium, "Indicates meaningful reported scale", "Reconcile run-rate definition to booked revenue and invoices"]
      - [Customers, "6,000 reported", low, "Shows breadth but not quality or spend", "Define denominator, active period, paying share, and spend bands"]
      - [Gross margin, null, low, "Determines whether growth funds infrastructure or consumes cash", "Monthly gross margin by product and workload"]
      - [CAC and payback, null, low, "Tests repeatability of enterprise growth", "Fully loaded CAC, sales cycle, payback, and cohort retention"]
      - [Cash and runway, null, low, "Determines financing dependency", "Cash bridge, monthly burn, committed GPU spend, and runway"]
    notes: "Null fields are unavailable public inputs, not zero values or estimates; the reported revenue and customer figures remain company-reported or repeated from company materials."
    claimRefs: [CI005, CI013, CI014, CI016]

