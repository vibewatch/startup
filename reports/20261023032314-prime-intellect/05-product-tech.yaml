  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Independent security assessment, certification status, data-retention terms, and incident-response record.
      whyItMatters: Customers executing proprietary code and model data need assurance beyond a feature description.
      diligencePath: Request current SOC 2 or ISO reports, penetration-test summary, subprocessors, retention schedule, and incident register under NDA.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Service-level uptime, GPU capacity, failure recovery, latency, and support metrics.
      whyItMatters: Distributed infrastructure economics and customer trust depend on predictable execution.
      diligencePath: Obtain 12-month availability and incident data by product, region, provider, and severity.
      relatedQuestionRefs: [QE006, QE008]
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: Independent production outcomes, retention, deployment counts, and repeat-use cohorts for Lab.
      whyItMatters: Beta job volume and one customer anecdote do not establish durable product-market fit.
      diligencePath: Request anonymized cohort, production conversion, repeat-job, and outcome data with denominators.
      relatedQuestionRefs: [QE003, QE005]
    - type: missing-source
      severity: minor
      topic: architecture
      missingEvidence: Current technical documentation covering service boundaries, versioning, and backward compatibility.
      whyItMatters: A broad modular surface can create integration and migration risk as components evolve.
      diligencePath: Review current API schemas, changelog, deprecation policy, and reference deployment diagrams.
      relatedQuestionRefs: [QE002, QE004]
