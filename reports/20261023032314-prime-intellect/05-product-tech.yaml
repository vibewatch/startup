callouts:
  - calloutType: strength
    title: Integrated improvement loop
    body: The combination of environments, evaluation, RL training, adapter deployment, and inference is a more specific differentiation claim than generic GPU access.
    claimRefs: [CE002, CE005, CE010]
  - calloutType: risk
    title: Assurance evidence lags product breadth
    body: Public evidence describes many technical components but does not establish independent security certification, uptime, or production outcome quality.
    claimRefs: [CE011, CE013]
