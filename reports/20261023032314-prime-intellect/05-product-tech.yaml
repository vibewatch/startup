    title: Product module / asset matrix
    columns: [Module or asset, User, Public maturity signal, Differentiation, Diligence gap]
    rows:
      - [GPU compute marketplace, ML teams and researchers, "API catalog documents 50+ providers and 1–256 GPU clusters", Heterogeneous supply behind one provisioning surface, "Provider-level uptime, capacity guarantees, and effective margin"]
      - [Lab hosted training, Applied-AI and research teams, "Generally available after beta; beta reportedly exceeded 10,000 jobs", Task-specific RL loop rather than fine-tuning alone, "Independent production outcomes and repeat usage"]
      - [Environments Hub, Agent builders, "Catalog described as 2,500+ environments", Reusable task and reward context, "Coverage, licensing, maintenance, and reward quality"]
      - [Secure sandboxes, Agent developers, "Python sandboxes, ports, SSH, errors, and tunnels documented in catalog", Isolates agent execution from customer workflows, "Isolation testing, abuse controls, and incident disclosure"]
      - [Inference and LoRA adapters, Product teams, "OpenAI-compatible inference and adapter deployments described", Short path from training output to serving, "Latency, retention, model isolation, and uptime"]
    notes: "Public descriptions and third-party profiles; maturity is not equivalent to audited production readiness, and unavailable controls remain diligence gaps."
    claimRefs: [CE001, CE005, CE006, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Prime Intellect solution, Measurable benefit, Limitation]
    rows:
      - ["Train a task-specific agent", "Assemble compute, harness, rewards, and training code", "Lab combines environments, evaluations, RL, and deployment", "Workflow is consolidated into one platform", "No independent conversion or quality metric"]
      - ["Benchmark a candidate model", "Build evaluation infrastructure", "Hosted evaluations and public leaderboards", "Comparable task testing before deployment", "Benchmark methodology and coverage are not independently audited"]
      - ["Run agent code safely", "Execute code in ad hoc infrastructure", "Remote Python sandboxes with ports and tunnels", "Dedicated execution boundary", "Security controls and abuse-response evidence are not public here"]
      - ["Serve an improved model", "Export weights and build a serving layer", "OpenAI-compatible inference with LoRA support", "Existing OpenAI-client integrations can be reused", "No independent latency or availability series"]
      - ["Iterate from production traces", "Convert failures into environments or evals", "Production-to-training loop described by product profiles", "Potential feedback flywheel", "Trace governance, privacy, and retention terms are unverified"]
      - ["Retrieve exact spreadsheet answers", "General agent scans tabs and ranges before answering", "RL-trained Fast Ask subagent", "+10 percentage points versus its base model and +4 points versus Claude Opus at a Claude Haiku 4.5 latency profile", "Customer-reported benchmark using synthetic business datasets; no independent replication"]
    notes: "Workflow benefits describe the product architecture; reported benchmark deltas preserve the stated comparators but are not independently replicated."
    claimRefs: [CE002, CE003, CE004, CE010, CE014, CE015]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Compute supply, Aggregate and provision GPUs, External providers and regional capacity, "Capacity, pricing, and failure variance"]
      - [Task and environment layer, Define agent tasks and reward context, Customer code plus environment catalog, "Reward misspecification and environment maintenance"]
      - [Evaluation layer, Measure baseline and trained behavior, Task-specific evaluators and leaderboards, "Reward hacking or non-comparable tests"]
      - [Distributed training, Run asynchronous or decentralized RL, Heterogeneous network and GPU topology, "Coordination overhead and stragglers"]
      - [Serving layer, Deploy adapters and expose inference, Model serving and API compatibility, "Latency, isolation, and data-retention controls"]
    notes: "Architecture is synthesized from retained technical descriptions; dependencies and risks are analytical interpretations, not claimed certifications."
    claimRefs: [CE005, CE006, CE007, CE011, CE012]
