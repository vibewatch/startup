company:
  name: Prime Intellect
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Prime Intellect is a private San Francisco AI-infrastructure company whose public
    identity centers on distributed compute and a full model-improvement stack. Evidence
    supports a $130 million Series A announced in July 2026 at a reported $1 billion
    valuation, while founding chronology, financing dates, governance, and operating-quality
    metrics still require primary-document reconciliation.
sections:
  - id: identity-and-platform
    title: Identity, stage, and platform scope
    body: >-
      Prime Intellect is consistently described as a San Francisco AI-infrastructure
      company, although public sources place its founding in either 2023 or January 2024.
      Tracxn classifies it as a Series A company; Wikipedia identifies Vincent Weisser and
      Johannes Hagemann as co-founders. Product descriptions converge on a platform that
      combines distributed GPU access with reinforcement-learning environments, evaluation,
      training, deployment, and inference. That breadth makes the business closer to an
      integrated model-development platform than a simple compute reseller, but public
      materials do not disclose the revenue mix among compute, software, and inference.
      The date discrepancy should remain explicit until incorporation records or a dated
      founder record reconcile formation with commercial launch.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: founders-and-governance
    title: Founders, leadership, and governance dependence
    body: >-
      The visible leadership structure remains founder-led. Public profiles identify
      Weisser as chief executive and Hagemann as chief technology officer. Weisser's prior
      work spans VitaDAO, Molecule, and Zuzalu, while Hagemann is reported to have brought
      distributed-training experience from Aleph Alpha. Those backgrounds offer complementary
      ecosystem and technical coverage for an open, distributed-AI thesis. However, the
      assigned evidence does not establish a complete executive roster, board composition,
      succession plan, or investor control rights. The absence of those documents is not
      evidence of weak governance, but it prevents an independent assessment of oversight
      and creates a material diligence requirement around founder concentration and technical
      continuity.
    claimRefs: [CO002, CO012, CO013]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and reported scale
    body: >-
      Contemporary coverage reports a $130 million Series A led by Radical Ventures, with
      participation from NVIDIA Ventures, Intel Capital, Dell Technologies Capital, Iconiq,
      and others. Multiple sources report a $1 billion valuation and more than $150 million
      of total funding. Earlier rounds are reported as a $5.5 million seed in April 2024 and
      a $15 million round in February 2025. The operating picture is more provisional:
      SiliconANGLE reported company claims of more than $100 million in annualized revenue
      and about 6,000 customers, while Tracxn reported 80 employees as of September 30,
      2026. Annualized revenue is not established as ARR, and none of those operating metrics
      is audited in the assigned pool.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO014]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones, contradictions, and diligence implications
    body: >-
      The public chronology shows rapid expansion from seed financing into a broader
      training-and-inference platform. Prime Intellect Lab was reported generally available
      on May 7, 2026 after more than 10,000 beta training jobs, although that is a usage
      count rather than an outcome measure. In October 2026 the company announced the
      acquisition of Moondream, extending its inference capabilities; the critical source
      notes undisclosed deal terms and a customer migration from Moondream Cloud, creating
      an observable integration test. Financing chronology also needs reconciliation:
      Tracxn lists the Series A on December 1, 2025, whereas contemporaneous reports date
      its announcement to July 8, 2026. Governance documents, audited KPIs, security evidence,
      customer concentration, and acquisition migration outcomes remain open.
    claimRefs: [CO010, CO011, CO015, CO016]
    figureRefs: [FO001]
