      - number: '1.2'
        title: Founders, leadership, and governance dependence
        blocks:
          - type: paragraph
            body: >-
              The visible leadership structure remains founder-led. Public profiles identify Weisser as chief executive
              and Hagemann as chief technology officer. Weisser's prior work spans VitaDAO, Molecule, and Zuzalu, while
              Hagemann is reported to have brought distributed-training experience from Aleph Alpha. Those backgrounds
              offer complementary ecosystem and technical coverage for an open, distributed-AI thesis. However, the
              assigned evidence does not establish a complete executive roster, board composition, succession plan, or
              investor control rights. The absence of those documents is not evidence of weak governance, but it
              prevents an independent assessment of oversight and creates a material diligence requirement around
              founder concentration and technical continuity.
