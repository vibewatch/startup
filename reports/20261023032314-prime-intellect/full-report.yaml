  - id: FU001
    title: Customer journey from environment to expansion
    type: journey-map
    summary: >-
      Evidence supports a workflow-led path from task definition and evaluation to training, deployment, and possible
      repeat use, while later-stage retention remains unverified.
    data:
      items:
        - label: Define workflow
          detail: Customer brings a task, environment, harness, and reward or evaluation objective.
          touchpoints:
            - Customer workflow
            - environment design
        - label: Evaluate and train
          detail: >-
            Hosted evaluations and reinforcement-learning training turn the workflow into an iterative model-improvement
            loop.
          touchpoints:
            - Baseline evaluation
            - RL training
            - rollout inspection
        - label: Deploy outcome
          detail: Improved adapters or models can be served through an OpenAI-compatible inference surface.
          touchpoints:
            - Inference
            - production integration
        - label: Repeat and expand
          detail: >-
            Investor evidence describes technically sophisticated teams returning to run more workloads; NRR, renewal,
            and account expansion are not disclosed.
          touchpoints:
            - Repeat workloads
            - additional environments
            - unresolved retention
        - label: Renew
          detail: No public source reports renewal, churn, GRR, or NRR for a Prime Intellect customer cohort.
          touchpoints:
            - Renewal
            - retention gap
        - label: Concentration check
          detail: Named evidence is concentrated in a small set of technology companies, with no disclosed top-customer share.
          touchpoints:
            - Customer concentration
            - spend bands
