      - number: '1.3'
        title: Financing, valuation, and reported scale
        blocks:
          - type: paragraph
            body: >-
              Contemporary coverage reports a $130 million Series A led by Radical Ventures, with participation from
              NVIDIA Ventures, Intel Capital, Dell Technologies Capital, Iconiq, and others. Multiple sources report a
              $1 billion valuation and more than $150 million of total funding. Earlier rounds are reported as a $5.5
              million seed in April 2024 and a $15 million round in February 2025. The operating picture is more
              provisional: SiliconANGLE reported company claims of more than $100 million in annualized revenue and
              about 6,000 customers, while Tracxn reported 80 employees as of September 30, 2026. Annualized revenue is
              not established as ARR, and none of those operating metrics is audited in the assigned pool.
            claimRefs:
