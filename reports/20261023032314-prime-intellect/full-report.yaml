  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Prime Intellect is positioned as higher on workflow integration and ownership orientation than generic compute or
      closed APIs, while the exact ordinal placement remains an analytical comparison rather than a benchmark.
    xAxis: Ownership orientation (closed to customer-controlled)
    yAxis: Workflow integration (specialized layer to connected stack)
    data:
      points:
        - id: prime-intellect
          label: Prime Intellect
          x: 4
          'y': 4
          note: Reported full stack, open-model orientation, and OpenAI-compatible inference.
        - id: frontier-apis
          label: Frontier APIs
          x: 1
          'y': 2
          note: TechCrunch describes them as the closed-lab dependency Prime Intellect helps customers avoid.
        - id: neoclouds
          label: Neocloud compute
          x: 3
          'y': 2
          note: Compute and infrastructure alternatives; full-loop integration is not established here.
        - id: internal-build
          label: Internal build
          x: 5
          'y': 3
          note: Maximum potential control, with integration and talent burden described as a constraint.
        - id: specialized-inference
          label: Specialized inference
          x: 3
          'y': 3
          note: Remio identifies vLLM and SGLang as reference points for inference competition.
        - id: together-ai
          label: Together AI
          x: 3
          'y': 2
          note: Adjacent neocloud competitor with reported capital and customer scale.
