            body: >-
              The public chronology shows rapid expansion from seed financing into a broader training-and-inference
              platform. Prime Intellect Lab was reported generally available on May 7, 2026 after more than 10,000 beta
              training jobs, although that is a usage count rather than an outcome measure. In October 2026 the company
              announced the acquisition of Moondream, extending its inference capabilities; the critical source notes
              undisclosed deal terms and a customer migration from Moondream Cloud, creating an observable integration
              test. Financing chronology also needs reconciliation: Tracxn lists the Series A on December 1, 2025,
              whereas contemporaneous reports date its announcement to July 8, 2026. Governance documents, audited KPIs,
