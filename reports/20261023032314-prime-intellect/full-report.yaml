  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect is consistently described as a San Francisco AI-infrastructure company, although public
              sources place its founding in either 2023 or January 2024. Tracxn classifies it as a Series A company;
              Wikipedia identifies Vincent Weisser and Johannes Hagemann as co-founders. Product descriptions converge
              on a platform that combines distributed GPU access with reinforcement-learning environments, evaluation,
              training, deployment, and inference. That breadth makes the business closer to an integrated
              model-development platform than a simple compute reseller, but public materials do not disclose the
              revenue mix among compute, software, and inference. The date discrepancy should remain explicit until
              incorporation records or a dated founder record reconcile formation with commercial launch.
            claimRefs:
              - CO001
              - CO002
              - CO003
