callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: The financing and adoption signals are substantial, but the public record cannot reconcile price to recurring, margin-bearing revenue or investor protections.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV013, CV014, CV015, CV016]
  - calloutType: risk
    title: Missing economics are valuation-critical
    body: Absence of public gross margin, retention, concentration, burn, and preference data prevents a reliable numeric return case.
    claimRefs: [CV013, CV014, CV015, CV016]
  - calloutType: insight
    title: Financing evidence is not cash available
    body: The Form D snapshot describes securities sold and convertible securities; it does not establish unrestricted cash, runway, or the complete capitalization table.
    claimRefs: [CV005, CV006]
