      - [Enterprise applied-AI teams, "Applied-AI or platform leader", "Engineers and domain operators", "Enterprise AI/platform budget", "Train, evaluate and deploy internal workflow agents", "Central AI or platform engineering", "Data control and reduced dependence on closed APIs."]
      - [Finance operations, "Finance/operations technology leader", "Analysts and automation teams", "Workflow automation budget", "Spreadsheet and finance-ops agents", "Business function plus AI platform", "Measured task accuracy, speed and cost."]
      - [Internal tools teams, "Product or engineering leader", "Developers and internal users", "Productivity or developer-tools budget", "Custom agents with production feedback loops", "Engineering/product", "Convert proprietary traces into evals and adapters."]
      - [AI research organizations, "Research director", "Researchers", "Research infrastructure budget", "Distributed RL and model evaluation", "Research/compute", "Experiment affordability and heterogeneous compute access."]
      - [Regulated or sovereignty-sensitive enterprises, "CIO/CISO/GC stakeholders", "Approved AI engineering teams", "Risk-adjusted infrastructure budget", "Controlled training and inference with portability requirements", "Enterprise platform and risk", "Data-residency, exit, incident and concentration diligence."]
    notes: "Buyer and payer roles are evidence-backed market hypotheses from source-described use cases; public evidence does not disclose Prime Intellect conversion rates or segment revenue mix."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]

