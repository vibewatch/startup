      - [Portability and open-model access, "Open-model positioning and OpenAI-compatible API reported", "Vendor-model dependency risk is the stated contrast", "Varies by provider; not established here", "Potentially high if interfaces and artifacts are controlled"]
      - [Production reliability and incident transparency, "Not independently established in assigned evidence", "Unknown in this chapter", "CIO identifies operational-maturity and exit gaps across neoclouds", "Depends on internal SRE and governance"]
    notes: >-
      Cells marked unknown are deliberately not scored. The matrix separates reported
      product scope from independently verified performance and reliability; no cell implies
      parity or superiority without matched evidence.
    claimRefs: [CP005, CP006, CP010, CP011, CP012]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Alternative, Price or contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - [Prime Intellect Lab, Per-token model movement rather than cluster-hour reservation, "RL loop, evaluations, rollout inspection, adapter deployment, and inference are reported", "Realized price, margins, and discounts unknown", Lower upfront commitment for some task-specific workloads]
      - [Dedicated centralized cluster, Cluster-hour reservation, Compute capacity with customer-managed software stack, Utilization and contract terms unknown, Can win for very large latency-sensitive runs]
      - [Closed frontier-model API, Token-based API usage is the relevant model described by the comparison, General-purpose frontier model access, Realized rates and enterprise discounts unknown, Convenience and capability may trade against control and dependency]
      - [Internal build / separate tools, Internal labor plus infrastructure and vendor contracts, Component-level control, "Total cost, maintenance, and opportunity cost unknown", Avoids one vendor but increases integration burden]
    notes: >-
      Assigned sources describe Prime Intellect's per-token model and the tradeoff with
      dedicated clusters, but do not provide a complete current price card for every
      competitor. “Unknown” means not disclosed in the retained evidence, not zero.
    claimRefs: [CP006, CP007, CP009]
