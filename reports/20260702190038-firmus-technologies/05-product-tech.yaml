- id: differentiation-roadmap-and-open-risks
  title: Differentiation, roadmap, and open risks
  body: 'Firmus’s differentiation claim is most compelling when it is described as systems integration rather than as a single
    benchmark result. The company is combining liquid cooling, HyperCube modularity, model-to-grid orchestration, a disaggregated
    VAST data layer, and heavy NVIDIA alignment into one operating model. That architecture can matter if the company really
    converts power, cooling, and data-layer coordination into lower cost per token. The roadmap is also concrete enough to
    be meaningful: Lepton distribution, VAST adoption, and the Batam DSX campus are all public. But those same facts create
    risk. The most ambitious capacity expansion is still future-dated, the public roadmap does not spell out customer-visible
    release dates for AIFactoryOS or storage tiers, and the fetched materials do not disclose patent numbers that would let
    an investor distinguish protected know-how from hard-to-audit tradecraft. Execution quality, partner dependency, and evidence
    depth remain the main underwriting questions.'
  claimRefs:
  - CE041
  - CE042
  - CE043
  - CE044
  - CE045
  - CE046
  - CE047
  - CE048
