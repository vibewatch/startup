- id: TE002
  title: Workflow and use-case table
  columns:
  - User job
  - Current workflow pain
  - Firmus product path
  - Stated benefit
  - Limitation
  rows:
  - - Train multi-node LLMs
    - Scarce clusters and complex interconnect setup
    - Cloud Compute or Bare Metal plus Slurm and InfiniBand
    - Distributed training on H200-backed clusters
    - No public workload-specific price or throughput curve
  - - Deploy agentic AI
    - Fragmented runtimes and inference packaging
    - Cloud Applications plus NIM APIs on GPU Cloud
    - Faster path from prototype to production
    - On-request kits are not fully specified
  - - Operate enterprise ML pipelines
    - Hybrid integration and ops burden
    - AIFactoryOS, observability, and hybrid connectivity
    - Governance and visibility across workloads
    - No public control mapping or admin screenshots
  - - Manage large datasets and checkpoints
    - Storage bottlenecks during training
    - AI Storage with RDMA or NVMe acceleration
    - Feeds GPUs at cluster scale without storage slowdown
    - No published durability or replication targets
  - - Run sovereign or public-sector AI
    - Land, power, and cooling constraints
    - HyperCube concepts plus HTX or MPA-linked designs
    - Lower land and energy narrative for constrained sites
    - Public evidence still centers on studies, not production case studies
  notes: Benefits are stated or inferred from product copy and partner materials; the gaps show where diligence still needs
