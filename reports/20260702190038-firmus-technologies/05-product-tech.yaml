- id: architecture-and-operating-model
  title: 'Architecture: cooling, networking, GPUs, orchestration, and data layer'
  body: 'The public architecture story is unusually specific for a private infrastructure company. Compute pages disclose
    an H200-led node design with eight GPUs, large HBM3e memory pools, NVLink and NVSwitch inside the node, and either InfiniBand
    or high-speed Ethernet for scale-out. Bare Metal then extends the same architecture toward reserved single-tenant clusters,
    while AI Storage describes RDMA-accelerated NVMe and checkpoint-heavy workflows. Above the hardware, Slurm is consistently
    named as the scheduler and AIFactoryOS is positioned as the orchestration and telemetry layer. The VAST partnership adds
    a separate data-plane clue: Firmus is trying to make storage and metadata management scale in lockstep with compute and
    energy. The net result is a stack that is deliberately optimized for distributed training rather than for generic virtual-machine
    hosting.'
  claimRefs:
