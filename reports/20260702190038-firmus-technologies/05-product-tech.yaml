- id: deployment-reliability-and-trust
  title: Deployment, reliability, support, and trust controls
  body: 'Deployment is framed around reducing operational friction: Firmus advertises managed operations, observability, hybrid
    connectivity, and a toolchain that runs from Jupyter and CLI workflows to NIM-backed inference. That makes the product
    more usable than raw leased capacity, but the reliability evidence is still mixed. The strongest public proof comes from
    the MLPerf work, where Firmus exposes node-level power measurement methodology and an efficiency comparison against air-cooled
    H100 systems; however, the company also acknowledges that facility-level PUE claims were outside MLCommons verification
    scope. Trust controls are similarly visible but incomplete. Cloud Services claims ISO 27001, SOC-2, and encryption at
    rest and in transit, and the cyber-security leadership hire suggests the company is formalizing a real control function.
    What is not visible yet is a public SLA surface, customer-ready control pack, or public incident-history mechanism.'
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE033
