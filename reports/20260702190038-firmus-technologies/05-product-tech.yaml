company:
  name: Firmus Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Firmus markets a layered AI-infrastructure stack that combines GPU cloud, bare metal, storage, orchestration, and
    AI application surfaces on top of dense factory-style assets. The strongest public differentiation is the integration
    of liquid cooling, HyperCube modularity, model-to-grid orchestration, and a VAST-backed data layer, while the main open
    risks are partner concentration, thin public reliability evidence, and limited patent disclosure.
sections:
- id: solution-definition-in-workflow
  title: Solution definition in customer workflow terms
  body: Firmus is not presenting a single monolithic product; it is marketing a layered AI-infrastructure workflow that begins
    with access to GPU compute and then adds the storage, orchestration, and application surfaces required to move a team
    into production. The practical user journey starts with either on-demand or reserved GPU access, depending on how bursty
    or committed the workload is, then attaches checkpoint and dataset storage, and finally layers on managed operations,
    developer kits, and inference endpoints. That structure matters because it makes Firmus look more like a vertically integrated
    AI factory operator than a generic GPU reseller. The company is also explicit that the stack is aimed at several buyer
    classes—from developers and enterprise platform teams to education and government users—so the workflow is meant to absorb
    both experimentation and more controlled production use.
  claimRefs:
