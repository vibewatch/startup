  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-slos
    missingEvidence: Public SLA, uptime history, RTO/RPO commitments, or a named status and incident surface for AI Cloud
      and Bare Metal.
    whyItMatters: Operational reliability is central to underwriting an AI infrastructure provider, and marketing copy is
      not enough to evaluate production readiness.
    diligencePath: Request a redacted customer MSA or SLA pack, incident retrospectives, and any public or private status
      reporting used for enterprise accounts.
    relatedQuestionRefs:
    - QE015
  - type: missing-source
    severity: material
    topic: software-roadmap-granularity
    missingEvidence: A dated release calendar for AIFactoryOS features, storage classes, support tiers, and GA versus on-request
      application stacks.
    whyItMatters: The public roadmap is strong on partnerships and campuses but weak on what customers can buy on what date.
    diligencePath: Request a product roadmap with committed release windows, current GA matrix, and deprecation policy for
      orchestration and application layers.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: patents-and-ip
    missingEvidence: Patent numbers, filed applications, or another concrete inventory of protectable IP covering cooling,
      HyperCube design, or orchestration software.
    whyItMatters: Differentiation claims are more investable when protectable know-how can be separated from marketing language
      and partner dependency.
    diligencePath: Request the patent schedule, application numbers, jurisdictions, and a narrative separating patent-backed
      IP from trade secrets.
    relatedQuestionRefs:
    - QE020
  - type: private-evidence-only
    severity: material
    topic: end-to-end-efficiency-validation
    missingEvidence: Independent facility-level efficiency validation beyond the node-level MLPerf power method, including
      site-level PUE or tokens-per-watt measurements.
    whyItMatters: The investment case depends on total-system efficiency, but the most visible public benchmark stops short
      of validating end-to-end facility performance.
    diligencePath: Request audited telemetry, engineering reports, or customer case studies that tie site-level power and
      cooling outcomes to live workload performance.
    relatedQuestionRefs:
    - QE015
    - QE019
    relatedTableRefs:
    - TE004
