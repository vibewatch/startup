- id: module-and-asset-map
  title: Module and asset map across AI Cloud and AI factories
  body: 'The marketed module set now covers Cloud Compute, AI Storage, Bare Metal, Cloud Services, and Cloud Applications,
    with those software and service surfaces tied back to physical AI-factory assets. Engineering Principles is useful because
    it connects the commercial interfaces to the company’s deeper infrastructure abstractions: HyperCubes are described as
    the core physical building block, not just a branding wrapper, and the same page links current Singapore assets, the Southgate
    program, and the announced Batam expansion. In other words, the product map spans both service modules and the facilities
    that are meant to host them. That is important for diligence because it means the quality of the customer experience depends
    not only on APIs or cluster specifications but also on Firmus’s ability to commission dense, liquid-cooled infrastructure
    and keep those assets synchronized with the cloud services layer.'
  claimRefs:
