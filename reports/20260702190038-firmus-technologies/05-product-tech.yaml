callouts:
- calloutType: strength
  title: Differentiation is system-level, not just GPU resale
  body: The strongest product argument is the way Firmus links liquid cooling, HyperCube modularity, model-to-grid orchestration,
    Slurm-led scheduling, and a VAST-backed data layer into one workflow rather than selling raw GPU instances alone.
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE042
- calloutType: risk
  title: Scale-up remains partner-locked and future-dated
  body: The most ambitious upside depends on NVIDIA ecosystem access, VAST integration, and Batam delivery. Those are credible
    partners, but the public roadmap is still more concrete on ecosystem announcements than on customer-visible software release
    timing or current shipped scale.
  claimRefs:
  - CE029
  - CE043
  - CE044
  - CE045
  - CE047
  - CE048
- calloutType: risk
  title: Trust controls are visible but still thinly evidenced
  body: Firmus publicly claims ISO 27001, SOC-2, encryption, and an expanding cyber-security function, yet the fetched surfaces
    did not expose a public SLA package, incident history, or product-specific data-processing controls that would let an
    enterprise buyer validate those claims deeply.
