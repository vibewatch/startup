  rows:
  - - AI Cloud Compute
    - Model builders, researchers, platform teams
    - Public product page live; on-demand and reserved options
    - H200-led liquid-cooled nodes with Slurm and InfiniBand
    - Need public pricing, region list, and SLA terms
  - - Bare Metal
    - Enterprises and committed training users
    - Public product page live; reservation-led
    - Single-tenant 4x-8x H200 clusters with 24/7 ops support
    - Need current live capacity and provisioning lead times
  - - AI Storage
    - Teams running multi-node training and checkpoints
    - Public product page live
    - RDMA-accelerated NVMe and distributed storage for AI pipelines
    - Need throughput, durability, and vendor-scope detail
  - - Cloud Services / AIFactoryOS
    - Platform engineering and operations teams
    - Public product page live
    - Governance, telemetry, managed Slurm, and hybrid connectivity
    - Need API docs, release cadence, and named customer references
  - - Cloud Applications
    - Developers and data scientists
    - Public product page live; some kits on request
    - CUDA, Jupyter, AI Workbench, and NIM inference surfaces
    - Need GA matrix, support boundaries, and compatibility details
  - - HyperCube / AI Factory assets
    - Anchor tenants, sovereign workloads, cloud ops
    - Singapore and Australia assets plus Batam roadmap
    - Multi-petascale modular unit co-designed around dense AI infrastructure
    - Need current live MW and deployed GPU counts by site
  notes: Rows summarize public module surfaces and the physical asset layer underneath them; status means public web evidence,
    not necessarily broad commercial availability.
