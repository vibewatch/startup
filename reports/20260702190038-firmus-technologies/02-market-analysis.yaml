company:
  name: Firmus Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: 'Firmus participates in several overlapping but non-additive markets: AI-factory campuses, neocloud GPU
    capacity, and sovereign compute. The strongest evidence points to an APAC market defined less by abstract TAM
    and more by scarce approved power, rising inference demand, and policy screens that favor efficient regional
    operators. Public sources support the category tailwind, but they still do not provide enough commercial detail
    to defend a Firmus-specific SOM.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: >-
    Firmus sits at the intersection of several adjacent markets, which is why a loose "AI infrastructure" label
    is not good enough for valuation work. The core included market is high-density AI-factory capacity: purpose-built
    campuses and cloud-delivered GPU capacity optimized for AI training and inference, plus the sovereign-compute
    programs that need those workloads to stay inside a jurisdiction. That boundary includes physical campuses,
    liquid-cooling and orchestration capability, and the AI-cloud or GPUaaS layer when it is tightly coupled to
    the underlying capacity. It excludes generic enterprise colocation, ordinary SaaS spend, and merchant semiconductor
    revenue because those pools do not directly measure what Firmus is trying to sell.


    The most important substitutes are not tiny startups; they are incumbent hyperscalers and conventional colocation
    providers that already control scarce land, utility access, and customer procurement paths. Hyperscalers can
    lease, self-build, or offer sovereign variants of their own services, while classic colocation remains the default
    shell for many workloads that do not need AI-factory-grade density. The practical analytical distinction is
    therefore architectural rather than semantic: in an AI factory, compute density, liquid cooling, orchestration,
    and grid behavior are part of the product, not afterthoughts. That distinction matters because Firmus only benefits
    from the broader market expansion when buyers value those traits enough to leave the status quo.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM045
