- id: diligence-gaps-and-contradictions
  title: Diligence Gaps and Definition-Sensitive Contradictions
  body: >-
    The biggest unresolved issue is not whether the category exists; it is whether Firmus can capture enough of
    it. Public evidence supports the direction of travel—power-constrained AI demand, APAC spillover, sovereign-compute
    interest, and a policy preference for efficient builds—but it does not disclose the commercial details needed
    for a bottoms-up SOM. Customer mix, contract duration, live utilization, effective pricing, and expansion rights
    remain private. Without those inputs, market-analysis work can bound opportunity but not prove share.


    There is also no single accepted market definition. Some sources measure electricity or MW demand, some focus
    on cloud-service revenue, some on sovereign IaaS, and others on cumulative infrastructure capex. That is not
    a bug in the chapter; it is the real analytical condition of the market. The correct diligence response is to
    preserve the contradictory lenses, ask for internal pipeline and utilization data, and avoid treating a broad
    global AI-infrastructure headline as if it were Firmus’s addressable revenue pool.
  claimRefs:
  - CM022
  - CM037
  - CM039
  - CM040
tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Firmus
  rows:
  - - AI factories / AI data centers
    - High-density AI campuses, reserved capacity, liquid-cooling and orchestration tied to training and inference
      workloads
    - Generic enterprise colo shell capacity and non-AI compute halls
    - Sovereign programs, neoclouds, model builders, regulated buyers
    - Core physical market where Firmus claims differentiated design and grid behavior
  - - Neocloud / GPUaaS
    - Cloud-delivered GPU capacity optimized for AI training and especially inference
    - Commodity IaaS and unrelated developer tooling
    - AI-native startups, model builders, enterprise AI teams
    - Important adjacent revenue layer because it monetizes scarce capacity faster than direct enterprise campus
      sales
  - - Sovereign compute / sovereign cloud
    - Jurisdiction-bound AI and cloud infrastructure with local control over data, operations, and governance
    - Cross-border standard cloud that lacks sovereignty guarantees
    - Governments, public research, critical infrastructure, regulated sectors
    - High strategic fit because Firmus explicitly markets onshore and policy-aligned infrastructure
  - - Hyperscale cloud and conventional colo
    - Leased or self-built capacity already controlled by major cloud and infrastructure incumbents
    - Specialized AI-factory value-add that a basic shell does not provide
    - Hyperscalers, major landlords, enterprise cloud buyers
    - Primary substitute and benchmark rather than Firmus’s clean addressable market
  - - Enterprise on-prem / status quo
    - In-house clusters and incremental expansion inside existing IT estates
    - Regional shared infrastructure and external sovereign capacity
    - Enterprise IT, research groups, line-of-business budgets
    - Relevant mainly as a slower-adoption fallback when buyers cannot justify a move to external AI-factory capacity
  notes: Boundary logic separates physical AI-factory capacity, cloud monetization layers, and sovereignty programs
    from broad colocation or semiconductor pools so the chapter does not overstate addressable spend.
