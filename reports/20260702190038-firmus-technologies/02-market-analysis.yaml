callouts:
- calloutType: insight
  title: The real premium is approved, policy-compatible capacity
  body: The market evidence supports scarcity, but not a universal green price uplift. In APAC, efficient AI capacity
    increasingly wins by clearing approval, grid, and sovereignty hurdles that weaker projects fail to clear at
    all.
  claimRefs:
  - CM031
  - CM034
  - CM035
  - CM037
- calloutType: risk
  title: A huge category does not automatically become Firmus’s SOM
  body: The public file is strong on macro demand and weak on contract-level commercialization. Without customer
    mix, utilization, and realized pricing, market breadth should raise curiosity more than certainty.
  claimRefs:
