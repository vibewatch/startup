  evidenceGaps:
  - type: missing-source
    severity: material
    topic: green-premium-pricing
    missingEvidence: Comparable pricing or win-loss data showing whether efficient AI capacity commands higher realized
      price or mainly wins access and approvals.
    whyItMatters: The chapter finds strong evidence for a green-access premium but weak evidence for direct pricing
      power, which changes valuation framing materially.
    diligencePath: Request bid-level comparisons, quote conversion data, or contract pricing differentials between
      sustainable AI-factory capacity and standard alternatives in APAC.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: firmus-som-gap
    missingEvidence: Customer mix, contract duration, utilization, effective pricing, and live workload mix for
      Firmus deployments.
    whyItMatters: Without those private commercial inputs the report can frame market opportunity but cannot defend
      a bottoms-up SOM or valuation-quality share estimate.
    diligencePath: Ask management for cohort-level pipeline and live-contract data broken out by buyer type, geography,
      workload, and utilization ramp.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: market-definition-drift
    missingEvidence: A normalized taxonomy separating electricity demand, physical MW buildout, cloud-service revenue,
      sovereign IaaS spending, and cumulative infrastructure capex.
    whyItMatters: Without normalized definitions, broad AI-infrastructure headlines are easy to misuse as if they
      described one additive TAM for Firmus.
    diligencePath: Rebuild the sizing stack in the model using one unit per layer and require each external source
      to state scope before inclusion.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM002
