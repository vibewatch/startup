    statement: The most defensible included spend for Firmus covers AI-factory capacity, AI-cloud or GPUaaS delivery,
      and sovereign-compute programs, while excluding commodity enterprise colocation, generic SaaS, and merchant
      semiconductor revenue.
    type: inferred
    topic: market-boundary
    sourceRefs:
