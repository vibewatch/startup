- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI implementation, cloud adoption, and digitalisation across APAC
    - positive
    - current / mid-term
    - Expands the total opportunity beyond one country or one buyer class
    - Separate real committed demand from broad digital-transformation rhetoric in each target geography
  - - Inference-heavy production AI workloads
    - positive
    - current / mid-term
    - Rewards operators that can deliver dense, latency-sensitive, always-on capacity rather than one-off training
      clusters
    - Request actual production workload mix and attach rates from early customers
  - - Sovereign-cloud and localization requirements
    - positive
    - current / mid-term
    - Creates demand for in-jurisdiction infrastructure and local governance guarantees
    - Identify whether buyer demand comes from law, procurement policy, or internal risk preference
  - - Power availability and grid-connection delays
    - negative
    - current / structural
    - Shifts value toward sites and operators that already have approved power pathways
    - Obtain site-by-site power timelines, queue position, and contingency plans
  - - Cooling density and water scrutiny
    - negative
    - current / structural
    - Raises build complexity and makes efficiency claims commercially material
    - Verify measured PUE, water usage, and cooling performance under live load
  - - Supply-chain bottlenecks in transformers, turbines, chips, and equipment
    - negative
    - current / 2027
    - Can delay delivery even when demand and permits exist
    - Map long-lead items and supplier concentration before underwriting deployment timing
  - - Green policy and national-interest screens
    - positive for aligned players / negative for misaligned players
    - current / structural
    - Turns efficiency and community fit into approval leverage rather than optional branding
    - Test whether Firmus’s commitments are contractually embedded or only marketing
  - - Rising rents, low vacancy, and capex intensity
    - negative
    - current / structural
    - Buyers still need utilization confidence before accepting bespoke capacity economics
    - Ask for cohort-level utilization, contract term, and renewal data
  notes: The market is demand-rich but execution-constrained. Drivers and constraints operate simultaneously, so
    access to approved MW and proof of utilization matter more than broad category excitement.
