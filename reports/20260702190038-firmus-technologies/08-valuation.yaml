- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Public valuation / scale signal
  - Why it matters
  - Relevance to Firmus
  - Limitation
  rows:
  - - AirTrunk
    - A$24b acquisition; >800MW committed; >1GW future growth; A$16b refinancing
    - Best private APAC scarcity-value anchor for a data-centre platform
    - Shows what visible scale, customer commitments, and financing depth can support
    - Far later-stage and already institutionally financed
  - - CoreWeave
    - $5.1b revenue; $60.7b RPO; $1.2b net loss
    - Shows that AI-native infra can scale explosively while still remaining balance-sheet hungry
    - Useful analog for upside and capital hunger in AI infrastructure
    - Much stronger disclosure and a different customer profile
  - - Equinix
    - 280 data centers; 10,500+ customers; $9.2b revenue
    - Public benchmark for transparency, repeatability, and global platform value
    - Illustrates the disclosure bar public investors expect
    - Mature interconnection and colo platform, not a greenfield AI-factory build story
  - - Digital Realty
    - AI-specific sovereign offer plus public quarterly and SEC reporting cadence
    - Shows incumbents already market AI-ready, jurisdiction-bound infrastructure
    - Relevant for competitive positioning and buyer alternatives
    - Mature REIT economics differ from Firmus’ build-and-ramp profile
  - - NEXTDC
    - A$427.2m revenue; A$2.2b capital plan; A$2.9b debt platform
    - Regional public comp for AI-ready expansion with visible financing
    - Closer APAC public-market analogue for capex and funding optics
    - Still a more established colo operator
  - - GDS / Keppel DC REIT
    - US$1.63b revenue or ~$6.2b AUM with public reporting
    - Shows listed APAC platform value emerges after reporting scale becomes visible
    - Helpful transparency and financing barometers for Asia
    - Different geographies, structures, and customer mixes
  notes: The table intentionally mixes private transactions, public operating companies, and listed platform vehicles because Firmus sits between a neocloud growth story and a data-centre infrastructure buildout.
