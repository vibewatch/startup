company:
  name: Firmus Technologies
chapter:
  number: 8
  title: Valuation
  summary: 'Firmus has credible strategic validation and strong market tailwinds, but the A$1.85 billion post-money round already prices in successful multi-campus execution before public revenue and cap-structure disclosure are adequate for conviction underwriting. Comparable AI-infrastructure winners show that very large values can be earned, yet they also show the prerequisites: visible customer commitments, repeat financing access, and transparent reporting. On the evidence available, the right call is Track rather than Buy: medium confidence, high risk, and a fair-to-stretched entry posture at the current mark.'
sections:
- id: current-price-anchor-and-what-is-proven
  title: Current price anchor and what is actually proven
  body: 'The cleanest valuation fact in the file is the round itself: Firmus officially closed a A$330 million placement at a A$1.85 billion post-money valuation with Ellerston Capital and NVIDIA in the syndicate. That price funds something tangible rather than a generic AI story. Project Southgate is documented as a flagship Tasmania campus with a 36,000-GPU build plan, while the project page adds 84 MW critical IT load, sub-1.10 PUE, and heavy water-efficiency claims. The file also shows a real investor-relations surface through a shareholder-communications page, and SmartCompany reported an ambition to list in 2026. But the valuation file is still missing the evidence investors usually need to underwrite rather than merely admire a headline mark: revenue, gross margin, utilization, customer concentration, and the preference or seniority terms attached to the new money are not publicly disclosed. That means the A$1.85 billion number is credible as a market-clearing event, but still incomplete
    as a common-equity underwriting package.'
