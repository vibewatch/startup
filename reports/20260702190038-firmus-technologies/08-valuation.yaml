- id: comparable-framework-and-scenario-ranges
  title: Comparable framework and scenario ranges
  body: 'Comparable work matters here mainly as a discipline tool. AirTrunk shows that an APAC data-centre platform can justify a very large private valuation, but only after making committed capacity, future land bank, and a huge financing platform visible. CoreWeave shows the upside of AI-native infrastructure even more starkly: billions of revenue and tens of billions of remaining performance obligations can coexist with billion-dollar losses. Mature public platforms such as Equinix, Digital Realty, NEXTDC, GDS, and Keppel DC REIT add the other lesson: public investors reward transparency, repeat reporting, and financing resilience. Against that backdrop, Firmus does not look absurdly valued, but it does look early. The base case therefore treats the current round as roughly fair if commercialization follows quickly and capital remains available. The bull case requires multiple things to go right at once, especially Southgate execution and Batam conversion. The bear case does not require
    demand to disappear; it only requires financing, permitting, or disclosed monetization to disappoint before Firmus reaches the scale and transparency public or quasi-public comparables already show.'
