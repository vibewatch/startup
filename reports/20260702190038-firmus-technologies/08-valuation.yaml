- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Neocloud and sovereign AI demand are expanding rapidly and power scarcity rewards early capacity holders.
    - Fast market growth can still coexist with valuation recalibration if power, policy, or financing tighten.
    - Signed customer demand and market-specific power access
  - - Product
    - Energy-efficient, liquid-cooled AI-factory design fits the cost and sustainability narrative.
    - The market may view Firmus as a capital-heavy build program rather than differentiated software-like infrastructure.
    - Measured cost, uptime, and utilization advantages
  - - Customers
    - DGX Cloud Lepton and AI Singapore indicate real partner-led demand formation.
    - Public customer proof is still thin relative to the size of the valuation and future capex burden.
    - Named revenue-bearing counterparties and concentration data
  - - Competition
    - Sovereign APAC execution can open a wedge that incumbents have not fully localized.
    - Equinix, Digital Realty, and other incumbents already market sovereignty and AI-ready infrastructure globally.
    - Evidence that Firmus wins on speed, price, and locality
  - - Capital stack
    - Fresh equity and partner structures can accelerate buildout faster than balance-sheet-only financing.
    - Revenue-sharing, preferred capital, or project debt can subordinate common economics before profitability appears.
    - Full term sheets, security ranking, and project-level funding plan
  - - Regulation
    - Australian policy explicitly values sovereignty, local capability, and energy discipline.
    - The same policy framework can slow or reprice projects that do not meet social-license and infrastructure expectations.
    - Permitting status and regulator alignment by site
  notes: Each anti-thesis line is valuation-relevant rather than merely operational; the question is how quickly it can change common-equity outcomes.
