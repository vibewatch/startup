- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Explicit assumptions
  - Indicative fair value (A$bn)
  - What must be true in the next 12–24 months
  - Probability signal
  rows:
  - - Bull
    - Southgate ramps on time, Batam committed offtake converts, sovereign demand stays scarce, and future capital remains plain-vanilla enough for common to participate.
    - 2.4–3.0
    - Commercial delivery milestones hit, counterparties are high quality, and no punitive senior capital appears.
    - Needs multiple green lights simultaneously
  - - Base
    - Southgate proves commercialization, Batam upside remains partly unproven, and more capital is needed but on manageable terms.
    - 1.5–2.0
    - Operational proof arrives before the next major financing event and disclosure improves materially.
    - Most defensible on current evidence
  - - Bear
    - Commercialization lags, disclosed economics stay thin, and capital arrives through more expensive or more senior structures.
    - 0.8–1.2
    - Timeline slips, financing spreads widen, or customer evidence remains narrative-heavy.
    - Plausible without demand collapse
  - - Financing-stress case
    - Demand exists, but project debt, preferred equity, or partner economics absorb more of the upside than common investors expect.
    - 0.6–0.9
    - Round terms or project-level documents reveal heavy leakage above common equity.
    - Key overhang to watch
  notes: Ranges are scenario anchors rather than precision targets; they are driven by disclosed proof, capital-structure risk, and milestone delivery rather than a point estimate of undisclosed revenue.
