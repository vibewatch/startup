- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR / revenue run-rate
    - Current recurring revenue, recognized revenue, and growth bridge by business line
    - Without this, the current mark cannot be benchmarked to any public or private comp set rigorously
    - Management pack plus audited or board-level KPI extract
  - - Utilization and unit economics
    - Campus utilization, gross margin, power cost assumptions, and cost per token or equivalent workload economics
    - Determines whether efficiency claims actually translate into equity value
    - Operating model review and site walkthrough
  - - Signed offtake counterparties
    - Names, credit quality, duration, and pricing of Southgate and Batam counterparties
    - Separates narrative demand from financeable, bankable demand
    - Contract review with counterparty concentration table
  - - Cap table and round terms
    - A$330m term sheet, liquidation preferences, security ranking, board rights, and any secondary component
    - Determines common-equity downside and dilution overhang
    - Legal diligence and full cap-table roll-forward
  - - Future funding plan
    - Project-level capex schedule and funding sources for Southgate, Batam, and South Australia
    - Shows whether growth can be financed without punitive structures
    - Financing plan with site-by-site uses and sources
  - - Customer concentration and renewal
    - Top customer share, renewal profile, and pipeline conversion by cohort
    - Tests whether partner logos translate into durable recurring value
    - Revenue concentration schedule and cohort retention deck
  - - Permitting and grid milestones
    - Timeline, dependencies, and contingency plans for power, transmission, and local approvals
    - Execution slippage is one of the fastest paths to valuation compression
    - Regulatory tracker and utility correspondence
  notes: These asks are the minimum package required to move from track-mode interest to an underwritten investment view.
