- id: thesis-vs-anti-thesis
  title: Thesis versus anti-thesis across market, product, customers, and regulation
  body: 'The thesis is not hard to articulate. Firmus sits in a market where sovereign AI infrastructure, power-constrained capacity, and high-density cooling are all gaining value at the same time. Official pages show that the company is not standing still on one Tasmania campus: it has a 360 MW Batam partnership with NVIDIA, claims up to 170,000 accelerators, cites a revenue-sharing and credit-support structure, and says committed offtake could reach US$25 billion to US$30 billion over six years. The South Australia energy agreement adds a second layer of scale, tying 600 MW of supply to 1.2 GW of renewables, battery storage, and 2.7 GW of planned capacity. DGX Cloud Lepton participation and the AI Singapore partnership strengthen the product and partner proof. The anti-thesis is equally clear. Sector research says power, capital structure, and enterprise monetization separate winners from GPU brokers. Australian policy adds real obligations around sovereignty, energy, skills, and social
    license. Independent coverage also hints that local job claims may be less durable than promotional framing suggests. The business may be directionally right and still prove too capital-intensive for common equity at the current price.'
