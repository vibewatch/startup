  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercialization-metrics
    missingEvidence: Current ARR or revenue run-rate, utilization, and gross margin by major deployment or business line.
    whyItMatters: Without current operating metrics, the existing valuation can be framed but not properly underwritten against private or public comp sets.
    diligencePath: Request board-level KPI pack or audited management accounts covering revenue, utilization, and gross margin.
    relatedQuestionRefs:
    - QV020
    - QV022
    - QV024
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Full term sheet for the A$330 million round plus current cap table, liquidation preferences, security ranking, and any secondary mix.
    whyItMatters: Common-equity value can be materially different from headline post-money if seniority, ratchets, or structured protections sit above the new investor.
    diligencePath: Obtain legal diligence room access to financing documents and cap-table roll-forward.
    relatedQuestionRefs:
    - QV021
    - QV025
    - QV028
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Named offtake counterparties, revenue concentration, renewal profile, and the bridge from partner logos to contracted revenue.
    whyItMatters: Demand quality matters more than narrative demand for a capital-intensive platform that will likely need repeat financing.
    diligencePath: Request top-customer schedule, counterparty credit profile, and cohort retention or expansion data.
    relatedQuestionRefs:
    - QV007
    - QV021
    - QV028
  - type: conflicting-data
    severity: material
    topic: southgate-scope
    missingEvidence: A normalized milestone pack reconciling 45 MW first-stage framing, 84 MW critical IT load, and the 36,000-GPU two-stage plan.
    whyItMatters: Underwriting capex, time to revenue, and valuation milestones requires consistent scope definitions across internal and external materials.
    diligencePath: Ask management to reconcile all public Southgate numbers in a single staged-capacity plan.
    relatedQuestionRefs:
    - QV002
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable-set coverage
    missingEvidence: A fuller comp workbook covering additional AI-infrastructure and listed data-centre references beyond the six headline rows in TV004.
    whyItMatters: The chapter uses a representative rather than exhaustive comp set, so investors should not read TV004 as a complete universe or a full screening model.
    diligencePath: Build a broader comp workbook after obtaining more private operating metrics and selecting the final valuation lens.
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: minor
    topic: exit-timeline
    missingEvidence: A current formal source confirming whether 2026 public-listing intent remains active, delayed, or replaced by another exit plan.
    whyItMatters: Exit aspiration exists in the public file, but timing and route affect how much liquidity optionality should be credited today.
    diligencePath: Request updated board-approved financing and exit roadmap or any formal listing preparation materials.
