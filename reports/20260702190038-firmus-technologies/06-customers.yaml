- id: adoption-trajectory-and-deployment-proof
  title: Adoption trajectory and deployment proof
  body: 'The strongest public adoption evidence is concentrated in one reference account: AI Singapore’s SEA-LION work on Firmus infrastructure. Firmus says AISG used its platform for rapid experimentation, large-scale training, and evaluation, while the case study discloses 32 nodes, 256 H200 GPUs, more than 200 experiments, and concrete model-training timelines. That is materially better proof than a logo wall because it shows what was run and at what scale. Outside that reference, the trajectory becomes less commercial and more developmental. HTX describes joint research into liquid-cooled AI infrastructure for public safety and sovereign mission-compute goals, while MPA describes a study of seawater-cooled modular AI factories subject to planning, pollution-control, and environmental review. The Lepton partnership then broadens access through a channel surface, but it proves marketplace participation more than customer stickiness. Publicly, Firmus therefore has evidence of demand formation
    and deployment capability, but only one named reference with detailed operating metrics.'
