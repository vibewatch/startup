tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public use case
  - Public proof / scale
  - Strategic value / gap
  rows:
  - - AI-native startups
    - Founders, ML engineers, platform leads; often usage-funded buyers
    - Training, inference, and agentic-app workloads that need flexible cloud capacity
    - Batam and Reuters materials explicitly target AI-native customers, but no named startup logo is public
    - Large upside segment, but current evidence is mostly future-looking demand language rather than disclosed live accounts
  - - Enterprise AI teams and ISVs
    - Enterprise platform teams, software vendors, and internal model builders
    - Prototype-to-production compute, regional deployment, and multi-cloud portability
    - Lepton and Batam materials mention enterprise and ISV users; no named Fortune-500 or ISV production reference found
    - Commercial TAM is broad, but enterprise proof quality is materially weaker than research or government proof
  - - Research institutions
    - Researchers, model developers, and public AI programs
    - SEA-LION training, model evaluation, benchmarking, and hosting
    - AI Singapore / SEA-LION is the strongest named reference, with 32 nodes and 256 H200 GPUs disclosed
    - High-quality credibility signal, but one flagship institution can overstate breadth if not followed by more labs
  - - Government / public sector
    - Agency sponsors, mission operators, and public-safety leaders
    - Public-safety compute design, sustainability-led infrastructure studies, and sovereign AI capability planning
    - HTX and MPA are both named Singapore public bodies, but both references remain research or study stage
    - Valid government engagement proof, but not yet proof of repeat procurement or live revenue at scale
  - - Sovereign / regulated compute users
    - Governments, regulated industries, and locality-sensitive workloads
    - In-country hosting, low-latency deployment, and data-sovereignty alignment
    - NVIDIA, VAST, and policy sources all frame sovereign demand as real, but Firmus does not publish a named regulated-industry customer
    - Narrative fit is strong; concrete account-level disclosure is still thin
  - - Channels / partners
    - Marketplace operators, data-centre hosts, storage/platform vendors
    - Distribution, hosting, and ecosystem credibility rather than direct workload consumption
    - NVIDIA Lepton, STT GDC, and VAST materially expand reach, but they are partner surfaces rather than retained end customers
    - Useful route-to-market leverage, but it raises dependence on partner economics and execution
  notes: Rows separate end-customer demand segments from partner-led access routes; public proof is strongest for research and public-sector segments and weakest for named enterprise buyers.
