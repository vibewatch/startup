- id: named-reference-quality
  title: Named reference quality by segment
  body: 'Reference quality varies sharply by segment. AI Singapore is high-quality customer proof because the engagement is named, the workload is described, a customer voice is quoted, and the outputs are linked to the SEA-LION program. HTX and MPA are still meaningful references because both are official Singapore institutions and both describe explicit use cases, but they do not yet demonstrate signed production consumption, disclosed contract values, or repeat purchasing. On the commercial side, public proof is much weaker. DGX Cloud Lepton shows that Firmus is inside a curated NVIDIA ecosystem, and STT GDC plus VAST show infrastructure partners are willing to build with it, yet none of those sources names a live enterprise end customer using Firmus in production. This is the central tension in the chapter: the company looks increasingly legitimate as a sovereign and research infrastructure provider, but the public record still does not show a broad, named enterprise customer base with
    durable commercial spend.'
