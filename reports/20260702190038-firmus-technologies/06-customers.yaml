callouts:
- calloutType: strength
  title: AI Singapore is materially better proof than a logo or generic partner quote
  body: The AI Singapore / SEA-LION case study is the chapter’s anchor reference because it identifies the user, the model family, the infrastructure scale, the experimentation volume, and the intended path from research toward production hosting. That is much stronger evidence than a generic partner page or a silent logo wall, and it shows Firmus can support a real model-building workflow instead of only selling infrastructure concepts.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
- calloutType: risk
  title: Most public-sector proof is still pre-revenue or pre-renewal in character
  body: HTX and MPA validate sovereign interest, but both references are still framed as research, study, or design-stage work rather than disclosed production consumption. Combined with the absence of customer-count and renewal metrics, that means investors cannot yet separate strategic relevance from durable public-sector monetization.
  claimRefs:
  - CU011
  - CU015
  - CU016
  - CU029
  - CU032
  - CU034
- calloutType: insight
  title: Partner-led expansion broadens reach while simultaneously obscuring economics
  body: NVIDIA Lepton, STT GDC, VAST, and the Batam ecosystem all make Firmus more plausible as a regional compute platform, but they also shift more of the commercial story into partner channels, shared economics, and undeclared counterparties. Publicly, reach is improving faster than transparency.
  claimRefs:
  - CU020
