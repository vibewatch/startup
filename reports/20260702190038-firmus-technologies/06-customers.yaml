company:
  name: Firmus Technologies
chapter:
  number: 6
  title: Customers
  summary: 'Firmus has credible public proof that research and public-sector institutions are willing to work with its infrastructure, with AI Singapore / SEA-LION providing the strongest workload-level reference and HTX plus MPA providing sovereign-compute validation. The weak point is durability: public materials still do not disclose customer counts, renewals, named enterprise logos, or concentration data, so most expansion claims remain partner-led or forward-looking rather than retention-proven.'
sections:
- id: segment-map-and-reference-footprint
  title: Segment map and current public reference footprint
  body: Firmus is publicly targeting a broader buyer set than its named reference list might suggest. The marketed footprint spans AI-native startups, enterprise AI teams, research institutions, government and public-sector users, sovereign or regulated workloads, and channel-led access through NVIDIA and other partners. The problem is that the segment map is much richer than the named-customer list. AI Singapore is the clearest public proof point because it gives a concrete institutional user, a specific model family, and measurable workload scale. HTX and MPA show that Singapore public bodies are willing to engage Firmus on sovereign and sustainable infrastructure questions, but those references are still study or design oriented. NVIDIA, STT GDC, and VAST widen access and credibility, yet they are still partner surfaces rather than end-customer retention proof. The result is a customer story that is strongest in research, public-sector interest, and channel validation, but much thinner
    in independently verifiable enterprise production adoption.
  claimRefs:
