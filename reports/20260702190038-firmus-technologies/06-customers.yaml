  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-opacity
    missingEvidence: Customer count, active-account count, NRR, GRR, churn, contract length, and renewal history by segment.
    whyItMatters: Without retention data, the public record cannot distinguish durable account expansion from fresh pilot generation.
    diligencePath: Request a cohort deck showing logo retention, revenue retention, and renewal cadence across research, sovereign, and marketplace accounts.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: enterprise-proof-gap
    missingEvidence: Named enterprise AI-team or ISV customer references with workload, spend, or outcome detail.
    whyItMatters: Firmus positions itself for enterprise and ISV demand, but public evidence still over-indexes to research and public-sector references.
    diligencePath: Request two to three named commercial customer references or redacted case studies showing production workloads and renewal status.
    relatedQuestionRefs:
    - QU015
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: offtake-opacity
    missingEvidence: Names, credit support, contract tenure, and minimum-commit mechanics behind Batam and other committed offtake agreements.
    whyItMatters: Future capacity economics may depend on a small number of anchor tenants, but the public record cannot size or diversify that dependence.
    diligencePath: Request customer names or redacted term sheets for the top Batam offtake commitments and reconcile them to the announced revenue expectations.
    relatedQuestionRefs:
    - QU016
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: public-sector-conversion
    missingEvidence: Commercial milestones, paid pilot terms, or production go-live criteria for HTX and MPA engagements.
    whyItMatters: Government proof is meaningful only if institutional studies can convert into ongoing compute consumption or repeat programs.
    diligencePath: Ask management to map each public-sector reference to stage, commercial value, conversion hurdle, and expected procurement timeline.
    relatedQuestionRefs:
    - QU006
    - QU009
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: partner-dependence
    missingEvidence: Revenue-share terms, reserved-capacity obligations, termination rights, and substitution plans across NVIDIA, STT GDC, VAST, and DayOne relationships.
    whyItMatters: Channel leverage can accelerate adoption, but hidden partner economics can also compress margins or expose customers to third-party execution risk.
    diligencePath: Request the partner dependency map used internally for go-to-market, supply, and capacity planning, including customer-facing fallback plans.
    relatedQuestionRefs:
    - QU020
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration-opacity
    missingEvidence: Top-customer share, top-five share, and segment or geography revenue mix.
    whyItMatters: Customer concentration is one of the most important downside variables for a capital-intensive infrastructure provider, yet it is not publicly disclosed.
    diligencePath: Request current revenue concentration tables and pipeline concentration by named opportunity, then compare them with public flagship references.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
