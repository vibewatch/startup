- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - AI Singapore success can seed more research references
    - One flagship case study can dominate the narrative if other labs are not named
    - Could overstate breadth and hide weak multi-account penetration
    - Ask for additional named research or university users and their active GPU consumption
  - - HTX and MPA can open sovereign/public-sector demand
    - Both are still study-stage relationships with long procurement and regulatory cycles
    - Public-sector conversion could take longer than investors expect
    - Ask for commercial milestones, procurement status, and conversion criteria for each government engagement
  - - DGX Cloud Lepton expands developer and enterprise reach
    - Customer acquisition may become dependent on NVIDIA marketplace economics and policies
    - Route-to-market leverage rises, but margin visibility may fall
    - Request revenue-share terms, reserved-capacity economics, and customer-acquisition mix from Lepton
  - - Batam offtake commitments imply scale demand
    - Counterparty names and concentration are private
    - Anchor-tenant or top-customer failure could materially impair the campus ramp
    - Request customer list, contract tenure, credit support, and minimum-commit structure behind committed offtake
  - - STT GDC, VAST, and DayOne widen capacity and operating scope
    - Execution depends on multiple external infrastructure partners
    - Operational or commercial slippage at partners can weaken service delivery and customer retention
    - Map each partner to customer-facing dependency, termination right, and substitution plan
  - - Australia and Singapore sovereign positioning benefits from policy tailwinds
    - Power, water, community, and environmental friction can delay deployments
    - Delayed capacity can defer customer onboarding or expansion for sovereign and hyperscale users
    - Review grid connection status, environmental approvals, and social-license plans by major campus
  notes: This table focuses on growth and concentration mechanics rather than pure risk severity; the most important blind spot is that public sources do not quantify customer or offtake concentration.
