- id: public-traction-gaps-and-capital-adequacy
  title: Public traction gaps and capital adequacy
  body: The strongest public traction signal is technical, not financial. AI Singapore publicly describes 256 H200 GPUs, 200-plus experiments, and rapid model-training cycles on Firmus infrastructure. NVIDIA lists Firmus in DGX Cloud Lepton, and multiple public materials position the company in Singapore cloud and sovereign-compute contexts. Those are credible proof points that the service exists and that some sophisticated buyers are willing to use it. They are not substitutes for financial KPIs. No reviewed source discloses current revenue, ARR, booked capacity, customer count, logo concentration, utilization, gross margin, cash, burn, or the debt stack. The September 2025 A$330 million raise is real and strategically meaningful, but public obligations have grown faster than disclosure. Southgate alone is described as a multibillion-dollar asset, while the South Australia platform adds long-duration power, storage, and grid responsibilities. SmartCompany's report that Firmus is expected
    to keep raising capital ahead of a proposed 2026 listing is therefore directionally plausible even if the exact path is unconfirmed. The public record supports “funded enough to keep building” more than “fully funded against the disclosed pipeline.”
