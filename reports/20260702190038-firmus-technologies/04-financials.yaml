- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Evidence quality
  - Financing implication
  - Diligence ask
  rows:
  - - Latest disclosed equity raise
    - A$330m
    - Latest hard equity fact and immediate capital buffer
    - High
    - Meaningful capital, but small relative to multi-campus ambitions
    - Provide pro forma cash balance after transaction fees and near-term uses
  - - Latest disclosed valuation
    - A$1.85b official; ~A$1.9b rounded in independent AFR-derived coverage
    - Sets fundraising context and indicates some rounding noise in public record
    - Medium
    - Exact financing documents should govern any valuation work
    - Provide signed placement documentation and cap table post-close
  - - Official use of proceeds
    - Accelerate Project Southgate
    - Confirms capital is directed to campus buildout rather than general narrative only
    - Medium
    - Suggests equity is being consumed by capex, not held as excess cash
    - Provide site-by-site use-of-proceeds schedule
  - - Tasmania project cost signal
    - About A$2.1bn in ABC reporting
    - External scale signal for flagship-campus capex
    - Medium
    - Single-project capex can exceed latest equity by multiples
    - Provide board-approved capex budget and draw schedule for Tasmania
  - - South Australia power commitment
    - 12-year, 600MW wholesale agreement
    - Creates long-duration operating and financing obligations before full revenue disclosure
    - High
    - Implies project-style underwriting requirements and demand-risk management
    - Provide offtake terms, collateral, and step-in/default provisions
  - - Renewables / storage linkage
    - 1.2GW new renewables plus 1.5GWh battery storage by 2032; 220 hours/year load flexibility
    - Shows Firmus is underwriting more than compute hardware
    - High
    - Links growth to third-party infrastructure buildout and power-market conditions
    - Disclose who funds each linked asset and what happens if delivery slips
  - - Grid / transmission policy
    - Firmus says it funds transmission and network infrastructure needed for connection
    - Connection capex can materially change cash need and timing
    - High
    - Raises the probability of additional debt, project finance, or new equity
    - Provide connection agreements, capitalized grid spend, and payment milestones
  notes: Table focuses on forward capital adequacy, not historical round chronology. Values stay in Australian dollars where disclosed; no synthetic USD conversion is used.
