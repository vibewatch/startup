- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric or document
  - Why it matters
  - Current public substitute
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue / ARR by stream
    - Needed to judge scale and mix
    - Only product surfaces and technical case studies are public
    - Cannot value growth or quality of revenue
    - Request trailing 12-month revenue by AI cloud, bare metal, and services
  - - Realized pricing, discounts, and channel take rates
    - Needed to convert workloads into gross profit
    - On-demand / reserved / marketplace mechanics are visible, but price is not
    - Cannot judge monetization efficiency
    - Request price books, standard contract forms, and actual net price waterfalls
  - - Customer concentration and contract duration
    - Needed to measure churn risk and bargaining power
    - AI Singapore and NVIDIA validate demand access but not mix
    - Cannot assess revenue durability or concentration risk
    - Request top-20 customer mix, committed capacity, and renewal schedule
  - - Utilization / booked capacity by site
    - Needed to determine absorption of fixed cost
    - Technical case-study usage is public, commercial utilization is not
    - Cannot distinguish credible demand from idle infrastructure
    - Request monthly utilization, backlog, and booked-capacity dashboards by campus
  - - Gross margin and power-cost pass-through
    - Needed to underwrite the unit economics of energy-intensive AI infrastructure
    - Peer disclosures only provide comparator context
    - Cannot determine whether efficiency claims survive into profit
    - Request gross-margin bridge by workload, including power and support allocation
  - - Cash, burn, debt, and project-finance stack
    - Needed to test runway and financing dependency
    - Only the 2025 equity raise and peer financing analogues are public
    - Cannot validate capital adequacy
    - Request current balance sheet, debt schedule, LOCs, and any project-finance term sheets
  - - Site-by-site capex, connection costs, and draw schedules
    - Needed to reconcile build ambition with funding sources
    - ABC and company policy give only directional scale signals
    - Cannot evaluate whether more equity or debt is imminent
    - Request board-approved capex model for Tasmania, South Australia, and any follow-on campuses
  notes: This table intentionally catalogs what is still private. Each row names the minimum document or dataset needed to move from narrative diligence to underwriting diligence.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most financially material private inputs still missing after reviewing official, regulatory, filing, and independent public sources for this chapter.
