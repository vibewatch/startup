tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit / basis
  - Current public status
  - Revenue-quality read
  - Diligence ask
  rows:
  - - AI Cloud Compute
    - On-demand instances and reserved clusters for AI/HPC workloads
    - Per instance, cluster reservation, or workload consumption
    - Offer is public; realized pricing undisclosed
    - Demand surface looks real but yield is opaque
    - Provide per-GPU-hour pricing, reservation minimums, and realized blended ASPs
  - - Dedicated bare metal clusters
    - Reserved single-tenant or multi-rack GPU clusters
    - Per reserved node / cluster term
    - Reservation language is public; contract economics are private
    - Likely higher ACV but longer sales cycle and heavier delivery burden
    - Provide contract lengths, setup fees, and cancellation terms
  - - Managed cloud services
    - AIFactoryOS, managed Slurm, CUDA stacks, observability, hybrid connectivity
    - Per managed environment, support tier, or bundled service
    - Capabilities are public; monetization terms are not
    - Potential recurring support/service layer, but attach rate unknown
    - Disclose managed-service pricing and attach rate to infrastructure deals
  - - Marketplace-mediated capacity
    - DGX Cloud Lepton routes buyers to Firmus regional GPU capacity
    - On-demand or long-term capacity via marketplace path
    - Distribution path is public; economics between NVIDIA and Firmus are private
    - Can widen pipeline, but marketplace take rate and mix are unknown
    - Clarify channel economics, revenue share, and who owns the customer relationship
  - - Reference-led sovereign / public-sector workloads
    - Research, enterprise, and government workloads sourced through reference partnerships
    - Contract or program basis
    - Use cases are public, but contract values are not
    - Can improve credibility; may require customization and longer procurement cycles
    - Provide revenue split by research, enterprise, government, and partner channels
  notes: Rows enumerate visible monetization paths only. “Current public status” means disclosure status, not revenue performance; realized pricing, discounts, and channel economics remain private.
