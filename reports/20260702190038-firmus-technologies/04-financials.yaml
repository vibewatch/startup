- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current revenue / ARR
    - null
    - Medium
    - Without current revenue, no growth, multiple, or payback analysis is investable
    - Provide trailing 12-month revenue and any run-rate / ARR bridge by stream
  - - Current customer count
    - null
    - Medium
    - Customer concentration and land-and-expand math cannot be measured without active-account counts
    - Provide active customers, top-10 revenue mix, and account counts by segment
  - - Utilization / booked capacity
    - null
    - Medium
    - GPU utilization determines margin absorption and validates whether campuses are filling efficiently
    - Provide utilization by Singapore cloud, Tasmania ramp, and reserved clusters
  - - Technical traction proxy
    - 256 H200 GPUs, 200+ experiments, 27B model in 10 days for AI Singapore
    - Medium
    - Shows credible usage intensity, but not willingness to pay or retention
    - Translate flagship technical usage into revenue and gross-profit contribution
  - - Sales-efficiency metrics
    - null
    - Medium
    - CAC, payback, NRR, and support burden drive whether high-touch GTM can scale
    - Provide CAC, payback, win rate, pipeline conversion, and support FTE by workload type
  - - Peer cost-structure context
    - Equinix cost of revenue led by depreciation, leases, utilities, bandwidth, staff, maintenance, and security
    - Medium
    - Frames the likely fixed-cost profile of a scaled AI-infrastructure operator
    - Map Firmus site-level power, lease, labor, and support cost buckets against peer disclosures
  - - Financing-intensity context
    - 'CoreWeave: $12.9bn debt commitments and $2.6bn operating lease liabilities; AirTrunk: A$16bn refinancing'
    - Medium
    - Comparable AI and hyperscale operators routinely use very large financing stacks
    - Provide current debt, letters of credit, supplier finance, and project-finance plans
  notes: Null values mean the metric was not publicly disclosed. Peer rows are context for underwriting pressure points, not estimates of Firmus performance.
