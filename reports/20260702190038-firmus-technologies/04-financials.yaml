- id: cost-structure-and-capital-intensity
  title: Cost structure, capex intensity, and operating obligations
  body: 'Public evidence strongly suggests a capital-heavy cost base. Southgate''s site page and the company''s commitments page show the operating model is built around dense GPU infrastructure, liquid cooling, firm power, network connections, orchestration software, and continuous support. The June 2026 South Australia agreement makes that cost posture concrete rather than aspirational: 12 years of contracted power, 600MW of firm electricity, 1.2GW of linked renewables, 1.5GWh of storage, and up to 220 hours per year of demand-response obligations. Firmus also says it will pay commercial power prices and fund its own transmission or connection upgrades. Those are economic obligations, not just ESG rhetoric. External reporting sharpens the scale question. ABC reports roughly A$2.1 billion for the Launceston project and quotes the company saying the first stage requires 90MW. Comparable disclosures from CoreWeave, Equinix, NEXTDC, and AirTrunk point in the same direction: AI and hyperscale
    infrastructure economics are dominated by fixed capital, power, leases, financing, and support burdens. That makes Firmus look much closer to a data-center or project-finance business than to conventional software.'
