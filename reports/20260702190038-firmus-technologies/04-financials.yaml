chapter:
  number: 4
  title: Financials
  summary: Public evidence is strong enough to map Firmus' revenue surfaces, energy obligations, and capital intensity, but not strong enough to underwrite revenue quality or capital adequacy. The company shows credible technical demand signals and unusually concrete power commitments, yet still withholds the commercial and balance-sheet metrics investors would need to judge pricing, margins, concentration, and runway.
sections:
- id: revenue-model-and-pricing-opacity
  title: Revenue model and pricing opacity
  body: 'Public evidence is sufficient to map Firmus'' revenue surfaces, but not sufficient to price them. AI Cloud Compute offers on-demand instances and reserved clusters around H200-class systems; Bare Metal adds dedicated single-tenant or multi-rack GPU clusters by reservation; Cloud Services layers orchestration, managed Slurm, CUDA stacks, observability, and hybrid connectivity on top. This is not one SKU. It is at least a three-layer commercial stack: cloud access, reserved infrastructure, and managed operations. The critical missing layer is commercial specificity. None of the reviewed Firmus pages publish per-GPU-hour, per-cluster, or managed-service list prices, and all of them route the buyer through enquiry or reservation language. That means the chapter can describe how activity should turn into revenue, but cannot determine actual mix between usage revenue, minimum-commit reserved capacity, professional services, or support. The healthiest interpretation is enterprise infrastructure
    revenue with some marketplace distribution through NVIDIA DGX Cloud Lepton. The conservative interpretation is that product packaging is farther ahead than public commercial disclosure. For underwriting, the right stance is neither “no business model” nor “clear SaaS pricing,” but “credible monetization surface with unresolved realized pricing.”'
