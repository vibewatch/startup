  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-transparency
    missingEvidence: Current revenue, ARR or usage-to-revenue bridge by AI cloud, bare metal, and services.
    whyItMatters: Without stream-level revenue data, neither growth quality nor channel mix can be underwritten.
    diligencePath: Request monthly revenue bridge, recognized revenue policy, and bookings/backlog by stream for the last 12 months.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI003
    - QI022
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-sales-efficiency
    missingEvidence: Active customer count, top-10 revenue mix, contract duration, win-rate, CAC, payback, and NRR.
    whyItMatters: High-touch infrastructure GTM can look healthy in references while still being economically fragile if customer concentration or CAC is extreme.
    diligencePath: Request customer cohort file, top-account concentration schedule, sales-cycle funnel, and post-sale support staffing plan.
    relatedQuestionRefs:
    - QI007
    - QI009
    - QI011
    - QI016
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-utilization
    missingEvidence: Site-level utilization, realized pricing, gross margin by workload type, and power-cost pass-through mechanics.
    whyItMatters: Efficiency claims do not prove profit if campuses run below utilization targets or if power and support costs overwhelm realized pricing.
    diligencePath: Request monthly utilization dashboard, price realization by SKU/channel, and gross-margin bridge for Singapore plus Tasmania ramp assumptions.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI022
    - QI025
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-stack-and-project-finance
    missingEvidence: Current cash balance, burn, debt schedule, letters of credit, supplier finance, and any project-finance or collateral arrangements linked to campuses or power contracts.
    whyItMatters: The company’s public obligations are too large to evaluate capital adequacy without the full financing stack.
    diligencePath: Request latest management balance sheet, 13-week cash forecast, debt and LOC schedule, and any power/offtake collateral documentation.
    relatedQuestionRefs:
    - QI017
    - QI023
    - QI024
    - QI026
    - QI027
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: enumeration-incomplete
    severity: material
    topic: site-by-site-capex-and-connection-costs
    missingEvidence: Board-approved capex budgets, transmission-connection payments, and construction draw schedules for Tasmania, South Australia, and any follow-on campuses.
    whyItMatters: Campus-scale AI infrastructure can consume capital in lumpy tranches that are invisible from headline raise amounts alone.
    diligencePath: Request project-model workbook for each live or announced site, including equity, debt, customer pre-commitments, and connection milestones.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI019
    - QI021
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
