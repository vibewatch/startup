      - number: '7.4'
        title: Partner, grid, and platform dependency risk
        blocks:
          - type: paragraph
            body: >-
              Firmus's commercial architecture is still visibly counterparty-heavy. The Tasmania story starts with
              Aurora and Hydro for initial power, extends to TasNetworks and AEMO for connection and transmission
              economics, and then leans on public policy acceptance that three sites should consume more than 400 MW in
              aggregate. Bell Bay's own FAQ still says final energy arrangements are being negotiated, which is a
              reminder that the company has more narrative than contract disclosure for the broader rollout. South
              Australia provides a more concrete mitigation example through the Gunvor agreement, but that also
              highlights dependence on supplier execution: the value only materialises if the promised renewable
              generation, battery storage, and curtailment mechanics arrive on time. On the technology side, NVIDIA is
              both supplier and channel via DGX Cloud Lepton, while VAST is the only publicly disclosed foundational
              data-layer partner. That makes the dependency map clear: Firmus controls integration and branding, but
              several critical throughput, price, and reliability levers still sit outside its direct control.
