            body: >-
              The AI Singapore / SEA-LION case study is the chapter’s anchor reference because it identifies the user,
              the model family, the infrastructure scale, the experimentation volume, and the intended path from
              research toward production hosting. That is much stronger evidence than a generic partner page or a silent
