      - number: '6.5'
        title: Concentration, partner dependence, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              The main customer risks are opacity and dependency rather than an obvious lack of demand. Public
              disclosures do not quantify top-customer share or segment mix, which means concentration risk cannot be
              sized from open sources. The Batam program is marketed against committed offtake agreements and AI-native
              demand, yet customer names and contract structures remain private, so anchor-tenant risk is real. Partner
              dependence is also substantial because the public route to market depends on NVIDIA hardware and Lepton
              distribution, STT GDC hosting history, VAST’s data layer, and DayOne’s Indonesian campus build-out.
              Procurement and permitting friction are particularly relevant for sovereign users: MPA explicitly inserts
              environmental and maritime review into any waterfront cooling path, Singapore’s AI strategy emphasizes
              efficiency-governed compute growth, and Australia’s expectations document links AI-factory approvals to
              sovereignty, energy, community, and clean-infrastructure tests. Independent Australian coverage adds a
              second warning that power, water, and social-license questions can delay large projects. In short, public
              demand signals are promising, but customer quality remains vulnerable to partner concentration, government
              conversion cycles, and sparse disclosure on who the anchor buyers actually are.
