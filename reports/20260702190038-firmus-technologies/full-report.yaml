      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Firmus is easier to believe than to underwrite. The company has credible revenue surfaces,
              real technical demand validation, and unusually concrete power and cooling architecture for a private
              AI-infrastructure operator. But the same evidence base shows a business whose success depends on turning
              power, cooling, and financing commitments into high-utilization recurring revenue before capital needs
              outrun disclosed equity. Revenue quality is therefore unproven, not disproven. Public evidence cannot yet
              tell an investor what realized pricing looks like, how concentrated the revenue base is, how much margin
              survives after power and support costs, or whether customer pre-commitments meaningfully offset the capex
              curve. The right verdict is that Firmus has credible technical traction, high capital intensity, and
              serious public-disclosure gaps. The core diligence asks are current revenue by stream, realized pricing
              and discount policy, contract duration and renewal terms, utilization by site, gross margin by workload
              type, current cash and burn, site-by-site capex and grid-connection draw schedules, and the exact
              financing structure for Tasmania, South Australia, and any follow-on campuses. Without those, conventional
              underwriting remains blocked.
            claimRefs:
