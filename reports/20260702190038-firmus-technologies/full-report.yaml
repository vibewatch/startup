      - number: '3.2'
        title: Hyperscalers Set the Outer Competitive Boundary
        blocks:
          - type: paragraph
            body: >-
              AWS, Google Cloud, and Azure define the outer competitive boundary because they already expose
              cluster-scale GPU infrastructure, broad regional presence, and procurement relationships that most buyers
              trust by default. AWS markets H100 and H200 P5 families with UltraClusters and liquid-cooling efficiency
              claims; Google combines accelerator-optimized A-series machines with global regions and commitment-based
              pricing; Azure pairs ND H100 and A100 families with a wide geography map and explicit sovereignty options.
              Microsoft's own AI-factory narrative matters because it shows the largest clouds are no longer offering
              only generic compute—they are building purpose-built AI campuses with huge capex behind them. For Firmus,
              that means the reachable market is the subset of workloads that care enough about physical sovereignty,
              local energy posture, or tailored deployment to leave these defaults. Without that wedge, the hyperscalers
              bundle too much adjacent value to displace.
