      - number: '8.4'
        title: Entry discipline, dilution overhang, exit readiness, and final asks
        blocks:
          - type: paragraph
            body: >-
              The real valuation debate is not whether Firmus is interesting. It is whether a new investor should accept
              today’s price before the capital stack and revenue engine are better exposed. Reviewed sources suggest the
              company is likely to need more external capital as it pursues Southgate, Batam, and South Australian
              expansion in parallel. Sector sources also show where that capital is now coming from: preferred equity,
              project finance, ABS, CMBS, private credit, and other structures that can sit above or dilute common. That
              makes entry discipline central. A new check should be staged, documentation-heavy, and explicit about
              dilution, downside protection, and information rights. Exit aspiration exists because the company already
              has shareholder-communications infrastructure and media-reported listing intent, but exit readiness still
              trails the disclosure bar visible in mature public comparables. The practical recommendation is therefore
              Track, not Buy: stay engaged, demand a tighter underwriting pack, and move only if commercialization,
              counterparties, and financing terms improve faster than the valuation does.
