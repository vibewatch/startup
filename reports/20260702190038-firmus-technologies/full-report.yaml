            body: >-
              Durability is the weakest part of the public customer record. No reviewed source discloses customer count,
              net revenue retention, gross retention, churn, contract length, or renewal cadence, so investors cannot
              tell whether Firmus is retaining accounts or mainly generating fresh pilot attention. The best publicly
              visible durability proxy is qualitative: the AI Singapore case study describes a formalized long-term
              partnership, quotes satisfaction with the engineering team, and frames the relationship as moving research
              toward production. Expansion logic is more visible than retention math. Lepton lowers distribution
              friction for developers, AI-native teams, and enterprise builders that need prototype-to-production
