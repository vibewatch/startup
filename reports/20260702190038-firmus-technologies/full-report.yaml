      - number: '1.2'
        title: Founders, Leadership, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              The public record identifies Tim Rosenfield and Oliver Curtis as the two most visible executives and
              repeatedly refers to them as co-CEOs, while third-party reporting also names Jonathan Levee as a
              co-founder. SmartCompany and Data Center Dynamics both place the founding year in 2019, and SmartCompany
              adds detail on the company's earlier bitcoin-mining cooling roots before the pivot into AI infrastructure.
              Leadership signaling is strong in operating and technical domains but weaker in classical governance
              disclosure. Investor-communications materials confirm a Sydney registered office and shareholder-document
              process, and SmartCompany reports that Ellerston investment director David Leslie is set to join the board
              after the 2025 raise. Beyond that, board composition, voting control, and protective rights are not
              publicly described in enough detail to support a full governance map. An important diligence wrinkle is
              reputational: SmartCompany notes that Curtis was found guilty of insider trading in 2016, years before
              Firmus was founded. That does not negate the infrastructure thesis, but it means governance diligence
              should go deeper than standard founder-market-fit questions.
