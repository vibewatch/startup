      - number: '2.5'
        title: Diligence Gaps and Definition-Sensitive Contradictions
        blocks:
          - type: paragraph
            body: >-
              The biggest unresolved issue is not whether the category exists; it is whether Firmus can capture enough
              of it. Public evidence supports the direction of travel—power-constrained AI demand, APAC spillover,
              sovereign-compute interest, and a policy preference for efficient builds—but it does not disclose the
              commercial details needed for a bottoms-up SOM. Customer mix, contract duration, live utilization,
              effective pricing, and expansion rights remain private. Without those inputs, market-analysis work can
              bound opportunity but not prove share.


              There is also no single accepted market definition. Some sources measure electricity or MW demand, some
              focus on cloud-service revenue, some on sovereign IaaS, and others on cumulative infrastructure capex.
              That is not a bug in the chapter; it is the real analytical condition of the market. The correct diligence
              response is to preserve the contradictory lenses, ask for internal pipeline and utilization data, and
              avoid treating a broad global AI-infrastructure headline as if it were Firmus’s addressable revenue pool.
            claimRefs:
              - CM022
              - CM037
              - CM039
              - CM040
