  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              Firmus's risk profile is dominated less by whether AI compute demand exists and more by whether the
              company can convert that demand into permitted, powered, and financeable capacity quickly enough. The
              strongest public proof today is narrow: St Leonards has a 104 MW retail service agreement and active
              construction, Bell Bay has a detailed FAQ and transmission story, and the Commonwealth now has explicit
              expectations for energy-intensive AI infrastructure. The weakest public proof is exactly where investors
              need underwriting confidence: final approvals beyond St Leonards, customer or offtake disclosure, and
              executed long-dated Tasmanian energy arrangements. That combination makes the severity stack clear. First
              are power, approvals, and social licence because those can directly stop sites from going live. Second are
              partner and platform dependencies on Aurora or Hydro, NVIDIA, and VAST because Firmus's product and route
              to market remain tightly coupled to external counterparties. Third are financing, governance, and
              utilization opacity, because the public record is still far thinner on demand quality than on project
              ambition.
            claimRefs:
              - CR001
