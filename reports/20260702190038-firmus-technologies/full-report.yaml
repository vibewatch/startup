            title: The real premium is approved, policy-compatible capacity
            body: >-
              The market evidence supports scarcity, but not a universal green price uplift. In APAC, efficient AI
              capacity increasingly wins by clearing approval, grid, and sovereignty hurdles that weaker projects fail
              to clear at all.
