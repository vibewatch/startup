      - number: '3.4'
        title: AI-Specialized Neoclouds and Full-Stack Peers
        blocks:
          - type: paragraph
            body: >-
              If the question is who looks most like a scaled version of Firmus's integrated ambition, the answer is not
              Equinix or AirTrunk; it is CoreWeave, Lambda, and Crusoe. CoreWeave combines AI-native cloud delivery with
              customer commitments large enough to reshape supply and financing decisions, but its 10-K also shows the
              trade-off: scale arrives with heavy customer concentration and direct exposure to hyperscaler bundling.
              Lambda is smaller but informative because it exposes public hourly pricing, modular AI-factory language,
              and explicit liquid-cooling and compliance claims that make comparison easier than with quote-based campus
              operators. Crusoe is different again: its edge is power orchestration and vertical integration across
              cloud, data-center construction, and electrical manufacturing. Together these companies show what a
              full-stack AI-infrastructure competitor looks like when it tries to solve supply access, packaging, and
              deployment speed at the same time.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
