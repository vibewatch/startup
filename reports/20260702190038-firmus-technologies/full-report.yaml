  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price anchor and what is actually proven
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation fact in the file is the round itself: Firmus officially closed a A$330 million
              placement at a A$1.85 billion post-money valuation with Ellerston Capital and NVIDIA in the syndicate.
              That price funds something tangible rather than a generic AI story. Project Southgate is documented as a
              flagship Tasmania campus with a 36,000-GPU build plan, while the project page adds 84 MW critical IT load,
              sub-1.10 PUE, and heavy water-efficiency claims. The file also shows a real investor-relations surface
              through a shareholder-communications page, and SmartCompany reported an ambition to list in 2026. But the
              valuation file is still missing the evidence investors usually need to underwrite rather than merely
              admire a headline mark: revenue, gross margin, utilization, customer concentration, and the preference or
              seniority terms attached to the new money are not publicly disclosed. That means the A$1.85 billion number
              is credible as a market-clearing event, but still incomplete as a common-equity underwriting package.
            claimRefs:
              - CV001
