    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Firmus should be understood as an AI infrastructure operator rather than a generic colocation provider.
              Across its homepage, infrastructure pages, and AI cloud materials, the company consistently describes
              itself as a vertically integrated developer and operator of AI factories that designs the stack from chip
              to grid. The operating proposition blends modular high-density facilities, liquid cooling, orchestration
              software, and cloud services for AI training, inference, and HPC workloads. Geography matters to that
              thesis. Official materials tie the company to Singapore for current cloud operations and developer access,
              while also anchoring its corporate registration and capital-markets activity in Sydney and its flagship
              sovereign build-out in Tasmania. That mix is coherent if read as an Australian-founded,
              Singapore-headquartered regional platform, but public descriptions still vary by source, so the report
              should preserve the nuance rather than force one clean jurisdictional label. Tasmania is the core
              sovereign-compute story because renewable power, cool climate, and government support line up there;
              Singapore remains the proof point for live services, reference workloads, and regulated regional demand.
