    rows:
      - - AI factories / AI data centers
        - >-
          High-density AI campuses, reserved capacity, liquid-cooling and orchestration tied to training and inference
          workloads
        - Generic enterprise colo shell capacity and non-AI compute halls
        - Sovereign programs, neoclouds, model builders, regulated buyers
        - Core physical market where Firmus claims differentiated design and grid behavior
      - - Neocloud / GPUaaS
        - Cloud-delivered GPU capacity optimized for AI training and especially inference
        - Commodity IaaS and unrelated developer tooling
        - AI-native startups, model builders, enterprise AI teams
        - >-
          Important adjacent revenue layer because it monetizes scarce capacity faster than direct enterprise campus
          sales
      - - Sovereign compute / sovereign cloud
        - Jurisdiction-bound AI and cloud infrastructure with local control over data, operations, and governance
        - Cross-border standard cloud that lacks sovereignty guarantees
        - Governments, public research, critical infrastructure, regulated sectors
        - High strategic fit because Firmus explicitly markets onshore and policy-aligned infrastructure
      - - Hyperscale cloud and conventional colo
        - Leased or self-built capacity already controlled by major cloud and infrastructure incumbents
        - Specialized AI-factory value-add that a basic shell does not provide
        - Hyperscalers, major landlords, enterprise cloud buyers
        - Primary substitute and benchmark rather than Firmus’s clean addressable market
      - - Enterprise on-prem / status quo
        - In-house clusters and incremental expansion inside existing IT estates
        - Regional shared infrastructure and external sovereign capacity
        - Enterprise IT, research groups, line-of-business budgets
        - >-
          Relevant mainly as a slower-adoption fallback when buyers cannot justify a move to external AI-factory
          capacity
