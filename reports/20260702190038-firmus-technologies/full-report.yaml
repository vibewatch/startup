        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Firmus looks like a hybrid of direct enterprise sales and marketplace-assisted distribution. The product
              pages repeatedly emphasize enquiry-led procurement, reservations, hybrid deployment, observability, and
              operational support. That points toward high-touch selling, not mass self-serve conversion. AI Singapore
              and the MPA-related Singapore materials reinforce that reading: the public proof points are reference
              workloads, sovereign or public-sector relevance, and high-performance technical delivery, not broad logo
              counts or transactional web sign-ups. NVIDIA's DGX Cloud Lepton changes the top of funnel by giving
              developers a common marketplace and regional capacity discovery layer, but it does not make the underlying
              service low-touch. Reserved clusters, public-sector buyers, and 24/7 support still imply account-level
              qualification and implementation work. Because the company publishes none of the conventional efficiency
              metrics—CAC, payback, pipeline conversion, NRR, or support headcount—the best public proxies are indirect.
              Live Singapore workloads, NVIDIA ecosystem inclusion, and reference-led partner channels suggest buyer
              interest. They do not yet prove efficient monetization. Investors should therefore treat sales efficiency
              as an unanswered execution question rather than as a hidden strength.
