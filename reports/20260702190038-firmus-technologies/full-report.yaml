      - number: '7.2'
        title: Regulatory, legal, and social-licence risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory burden is not a single permit; it is a layered stack. At the Commonwealth level, the new
              expectations for data centres and AI infrastructure give government a basis to prioritise aligned
              proposals and deprioritise misaligned ones, especially where energy, resilience, or community benefit are
              weak. At the same time, the legal landscape for AI already pulls in privacy, directors' duties,
              negligence, and consumer-law exposure, while cyber reforms under SOCI now speak directly to data-storage
              systems and risk-management programs. None of that proves Firmus is non-compliant, but it raises the
              diligence bar for a company trying to serve sovereign and public-sector workloads. The more immediate
              issue is social licence. ABC and ABC Listen reporting show community pushback on consultation, water,
              noise, and public benefit, while the most current public planning status for Bell Bay and Wesley Vale
              still depends on municipal processes the company does not fully control. The Singapore MPA and HTX
              relationships help strategic positioning, but they are research MoUs, not substitutes for operating
              approvals.
            claimRefs:
