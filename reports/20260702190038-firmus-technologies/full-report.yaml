      - number: '2.4'
        title: Growth Drivers, Constraints, and the Green-Access Premium
        blocks:
          - type: paragraph
            body: >-
              The growth case is strong. AI implementation, cloud adoption, and digitalisation are expanding the
              category across APAC; inference-heavy production workloads are becoming the dominant design point; and
              sovereign-cloud demand is rising fastest in regions that want more digital independence. Those drivers
              favor operators that can bring new capacity to market quickly and make it acceptable to utilities and
              regulators. Firmus’s regional thesis therefore makes sense at the level of market direction.


              The problem is that adoption is constrained by physical bottlenecks rather than by weak interest. Power
              availability is the first screen, with reported grid waits ranging from about two years in some emerging
              markets to more than eight years in core ones. AI racks around 100 kW force liquid-cooling and heavier
              mechanical design, while transformers, turbines, advanced chips, and related components remain tight.
              Meanwhile, rents are rising, vacancy is low, and buyers still need utilization confidence before locking
              in bespoke capacity. That is why the market’s so-called green premium should not be read as a universal
              price uplift. Singapore and Australia are explicitly treating efficiency, grid behavior, water use, and
              community fit as part of approval or prioritization. For a company like Firmus, the premium is more
              plausibly queue access and policy compatibility than immediate pricing power, and that distinction matters
              for valuation.
