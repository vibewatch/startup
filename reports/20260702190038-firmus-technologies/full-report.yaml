      - number: '2.2'
        title: Multiple Sizing Lenses Instead of One Headline TAM
        blocks:
          - type: paragraph
            body: >-
              No single public market number cleanly describes Firmus. The most physical lens is electricity: IEA
              analysis puts data-center demand around 415 to 460 TWh in 2024 and roughly 945 to more than 1,000 TWh by
              2030, with AI-focused facilities growing even faster than the category average. The next lens is capacity
              and capex. JLL expects roughly 97 to 100 GW of new global data-center capacity between 2026 and 2030 and
              frames the buildout as up to $3 trillion of combined real-estate and tenant investment by 2030, while
              McKinsey’s broader industrial lens reaches about $7 trillion. Those figures are directionally consistent
              on scale but not directly comparable.


              APAC matters more than the global headline because Firmus is a regional operator. JLL’s Asia-Pacific
              report points to 4.8 GW of new supply by 2027 with 78% already preleased, while DatacenterDynamics reports
              a 19.4 GW regional development pipeline in 2025 and roughly $116 billion of APAC colocation buildout capex
              over the next five to seven years. Neocloud and sovereign-compute lenses are different again. Gartner’s
              narrower framing implies roughly $53 billion of neocloud revenue by 2030 from a 20% share of a $267
              billion AI cloud market, while ABI’s broader GPUaaS framing reaches $250 billion by 2030 and Gartner’s
              sovereign-cloud IaaS view reaches $80 billion already in 2026. These should be preserved as parallel
              lenses, not summed into one false-precision TAM.
