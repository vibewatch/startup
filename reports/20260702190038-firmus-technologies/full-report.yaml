  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Substitution Layers
        blocks:
          - type: paragraph
            body: >-
              Firmus is not competing against a single clean peer set. Buyers can solve the same job through hyperscaler
              GPU clouds, AI-ready landlords that host or stitch private AI environments, specialist neoclouds that
              package GPU access with software, or internal build for the very largest programs. The implication is that
              competitive pressure comes from whichever alternative removes the most pain around time-to-capacity,
              jurisdictional control, and operational certainty. Hyperscalers win when the customer is happy to stay
              inside an existing cloud relationship; Equinix, Digital Realty, AirTrunk, NEXTDC, Keppel, and GDS matter
              when land, power, and interconnection are the scarce inputs; CoreWeave, Lambda, and Crusoe matter when the
              buyer wants an AI-native stack without waiting for a bespoke campus. This is why Firmus should be judged
              less as a standalone colo and more as a regional AI-infrastructure integrator trying to defend a narrower
              sovereignty wedge against much larger classes of substitute.
            claimRefs:
              - CP001
              - CP002
              - CP015
              - CP036
