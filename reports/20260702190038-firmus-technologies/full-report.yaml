            body: >-
              Firmus has cleared the hardest narrative hurdle by raising a very large round at unicorn-plus valuation
              with NVIDIA involved. The remaining debate is not whether the company matters, but whether the
              common-equity economics at this price are visible enough yet.
            calloutType: insight
