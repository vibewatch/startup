      - number: '3.5'
        title: Pricing, Lock-in, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Competitive economics are unusually uneven. Public price discovery is best in cloud-like offers—Lambda
              publishes list rates, Google documents Spot and commitment mechanics, and AWS publishes performance and
              relative cost claims—while most neocloud committed deals and almost all sovereign campus or landlord
              offers remain quote-based. That opacity helps incumbents with experienced procurement teams more than it
              helps a newer operator. Lock-in also accumulates asymmetrically: hyperscalers benefit from billing,
              security, and data-gravity ties; Equinix and Digital Realty benefit from ecosystems; AirTrunk benefits
              from capital and customer reach; CoreWeave shows how multi-year take-or-pay contracts can entrench an AI
              cloud. Firmus therefore has a real but narrow moat. It is strongest where buyers need APAC physical
              control, tailored energy or cooling design, and local execution; it is weakest where buyers mainly want
              GPU supply, a fast contract, and a familiar procurement path. The displacement risk is not hypothetical—it
              is embedded in the capital intensity and distribution advantages of the rivals already in market.
