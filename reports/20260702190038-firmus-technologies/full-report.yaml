  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Southgate delivery slips
        - Commercial delivery or energization misses the next externally visible milestone window
        - Delays proof of monetization and raises financing needs
        - Pause or widen valuation haircut
      - - Commercial metrics stay undisclosed
        - No credible ARR, utilization, or customer concentration disclosure before the next financing step
        - Keeps the mark narrative-led rather than underwritten
        - Do not add fresh capital
      - - Senior capital appears
        - Preferred, secured, or project-level structures take a large share of economics or control
        - Common-equity upside leaks before scale is proven
        - Re-underwrite cap table from scratch
      - - Batam commitments weaken
        - Counterparties, volumes, or offtake economics fail to convert into visible contracts
        - Removes the main bull-case scale driver
        - Shift to base or bear case
      - - Regulatory or community friction rises
        - Policy alignment, power access, or local social license meaningfully deteriorates
        - Extends time-to-revenue and raises execution risk
        - Increase discount rate and reduce fair value
      - - Incumbents localize sovereignty faster
        - Hyperscalers or mature landlords offer similar in-region AI capacity with stronger balance sheets
        - Compresses differentiation and pricing power
        - Reduce strategic premium assumption
    notes: >-
      These are the few variables that most directly move Firmus from an interesting strategic asset to an unattractive
      common-equity entry at the current mark.
