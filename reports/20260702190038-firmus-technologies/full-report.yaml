              AI-native, enterprise, ISV, sovereign, and hyperscale demand. But these are still channel and roadmap
              signals. Without named renewals, customer cohorts, or multi-account expansion metrics, the public record
              proves addressable demand and some deployment success more clearly than durable commercial compounding.
