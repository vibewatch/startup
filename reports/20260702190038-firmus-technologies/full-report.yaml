      - number: '3.3'
        title: Landlords and Sovereign-Capacity Incumbents
        blocks:
          - type: paragraph
            body: >-
              The landlord class is structurally different from the hyperscalers but still dangerous to Firmus. Equinix
              and Digital Realty pair AI-ready facilities with large interconnection ecosystems, letting customers
              assemble private, hybrid, or sovereign AI without relying on a smaller regional operator. AirTrunk and
              NEXTDC are even closer on physical thesis: both are leaning into high-density APAC capacity and both can
              sell the language of sovereign or regionally controlled infrastructure with bigger balance sheets and more
              established customer access. Keppel DC REIT and GDS are less developer-centric, yet they still matter
              because they own or finance a large installed base of data-center capacity in markets that could otherwise
              feed regional entrants. In practice, this means Firmus is competing not just on cooling design but on the
              right to control scarce land, power, and interconnection in markets where incumbents are already very
              large and increasingly AI-aware.
