company:
  name: Firmus Technologies
chapter:
  number: 3
  title: Competitors
  summary: 'Firmus is squeezed by three stronger competitor classes: hyperscalers that already bundle GPU supply and residency, incumbent landlords that control land, power, and interconnection, and AI-specialized neoclouds that package capacity faster than bespoke campuses. The company''s most defensible wedge is narrow—APAC sovereign deployments that need physical control and tailored energy or cooling design—while pricing transparency, hardware allocation, and customer-overlap evidence remain thin.'
sections:
- id: landscape-and-substitution-layers
  title: Landscape and Substitution Layers
  body: Firmus is not competing against a single clean peer set. Buyers can solve the same job through hyperscaler GPU clouds, AI-ready landlords that host or stitch private AI environments, specialist neoclouds that package GPU access with software, or internal build for the very largest programs. The implication is that competitive pressure comes from whichever alternative removes the most pain around time-to-capacity, jurisdictional control, and operational certainty. Hyperscalers win when the customer is happy to stay inside an existing cloud relationship; Equinix, Digital Realty, AirTrunk, NEXTDC, Keppel, and GDS matter when land, power, and interconnection are the scarce inputs; CoreWeave, Lambda, and Crusoe matter when the buyer wants an AI-native stack without waiting for a bespoke campus. This is why Firmus should be judged less as a standalone colo and more as a regional AI-infrastructure integrator trying to defend a narrower sovereignty wedge against much larger classes of substitute.
  claimRefs:
  - CP001
  - CP002
  - CP015
  - CP036
  - CP037
  - CP042
  - CP043
  - CP044
  figureRefs:
  - FP001
- id: hyperscalers-set-the-outer-boundary
  title: Hyperscalers Set the Outer Competitive Boundary
  body: AWS, Google Cloud, and Azure define the outer competitive boundary because they already expose cluster-scale GPU infrastructure, broad regional presence, and procurement relationships that most buyers trust by default. AWS markets H100 and H200 P5 families with UltraClusters and liquid-cooling efficiency claims; Google combines accelerator-optimized A-series machines with global regions and commitment-based pricing; Azure pairs ND H100 and A100 families with a wide geography map and explicit sovereignty options. Microsoft's own AI-factory narrative matters because it shows the largest clouds are no longer offering only generic compute—they are building purpose-built AI campuses with huge capex behind them. For Firmus, that means the reachable market is the subset of workloads that care enough about physical sovereignty, local energy posture, or tailored deployment to leave these defaults. Without that wedge, the hyperscalers bundle too much adjacent value to displace.
  claimRefs:
