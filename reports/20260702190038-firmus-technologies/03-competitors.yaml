tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / capital signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - AWS
    - Hyperscaler
    - 39 regions / 123 AZs; H100/H200 UltraClusters
    - Global enterprise, model builders, regulated buyers
    - Deep cloud bundle plus AI-specific GPU fleet
    - Physical sovereignty is cloud-centric rather than campus-centric
  - - Google Cloud
    - Hyperscaler
    - 43 regions / 130 zones; A4/A3 accelerator family
    - Global AI builders and enterprises
    - Strong global network plus public pricing tools
    - Physical-site customization is less visible than cloud packaging
  - - Microsoft Azure
    - Hyperscaler
    - Broad geography map plus dedicated AI-datacenter capex
    - Large enterprise, OpenAI-adjacent ecosystem, regulated workloads
    - Strong procurement, residency options, H100 scale-out
    - Defaulting into Azure reduces room for regional operators
  - - Equinix
    - AI-ready landlord / interconnection incumbent
    - 280 data centers; 10,500+ customers; 507,000+ interconnections
    - Hybrid multicloud, private AI, global enterprises
    - Interconnection marketplace and AI-ready density
    - Not an AI-native cloud product itself
  - - Digital Realty
    - AI-ready landlord / private AI platform
    - 300+ data centers across 55+ metros
    - Private, hybrid, and sovereign AI buyers
    - PlatformDIGITAL and partner-validated AI offers
    - Pricing and exact AI package economics are mostly quote-based
  - - AirTrunk
    - APAC hyperscale landlord
    - Blackstone-led A$24b deal; hyperscale platform across APME
    - Global cloud and hyperscale customers in APAC/ME
    - Regional scale plus deep capital backing
    - Public software, pricing, and workload tooling are opaque
  - - NEXTDC
    - Australian sovereign-AI landlord
    - FY25 revenue A$427m; S4 350MW; S7 550+MW
    - Australia sovereign AI, hyperscalers, enterprises
    - Domestic sovereign narrative plus dense liquid-cooled designs
    - Still quote-based and more landlord than AI cloud
  - - Keppel DC REIT
    - Regional portfolio owner
    - 25 data centres in 10 countries; AUM ~US$6.3b equivalent
    - Long-duration hyperscale and enterprise demand
    - Balance-sheet reach across APAC/Europe hubs
    - Less evidence of integrated cloud or developer motion
  - - GDS Holdings
    - China incumbent operator
    - FY2025 revenue RMB11.43b; utilization 75.5%
    - China enterprise, hyperscale, managed-cloud buyers
    - Installed base and China presence
    - Not positioned publicly as an AI-native cloud
  - - CoreWeave
    - AI-specialized neocloud
    - US$60.7b RPO; large OpenAI/Meta commitments
    - AI labs, frontier-model builders, large enterprise AI
    - AI-native cloud with scale and anchor contracts
    - Heavy customer concentration and exposure to hyperscaler bundling
  - - Lambda
    - AI-specialized neocloud
    - Public list pricing and 16 to 2,000+ GPU cluster packaging
    - Developers, research teams, enterprise AI builders
    - Transparent packaging plus modular AI-factory design
    - Smaller ecosystem and geographic footprint than hyperscalers
  - - Crusoe
    - Power-first AI infrastructure cloud
    - 1.2GW Abilene first phase; 3.0GW active projects
    - Energy-intensive AI builds and fast-deployment customers
    - Power orchestration and vertical integration
    - Geographic coverage is narrower than global clouds
  notes: Rows focus on the most decision-relevant competitors and substitutes for Firmus rather than every possible data-center owner; limitations are the public-evidence constraint, not a full product teardown.
