  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized price cards, discount ladders, minimum commits, and term lengths for sovereign-campus and committed neocloud deals.
    whyItMatters: Public list pricing mostly covers cloud-style offers, not the bespoke campus contracts where Firmus is trying to win.
    diligencePath: Request anonymized customer proposals from Firmus plus at least one competitive quote from a hyperscaler, landlord, and neocloud.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-overlap
    missingEvidence: Named overlapping customers, workloads, or procurement processes showing where Firmus actually wins against AirTrunk, NEXTDC, hyperscalers, or neoclouds.
    whyItMatters: Without customer-level overlap, the chapter can bound substitutes but cannot prove where Firmus is winning competitively.
    diligencePath: Ask Firmus for three recent competitive-deal narratives with competitor names, decision criteria, and signed scope.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: blocking
    topic: gpu-allocation
    missingEvidence: Allocation letters, reservation agreements, or hardware-commit schedules that show Firmus's secured GPU access relative to hyperscaler and neocloud rivals.
    whyItMatters: Supply access can dominate competitive outcomes in AI infrastructure; without it, design advantages may not translate into delivered capacity.
    diligencePath: Request firm hardware-allocation documents from NVIDIA or cloud partners and reconcile them against project timelines and customer commitments.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: operating-benchmarks
    missingEvidence: Firmus utilization, uptime, realized gross margin, and backlog metrics on the same basis as public rivals.
    whyItMatters: The public benchmark set is increasingly rich; without Firmus operating metrics, moat-durability judgment stays directional rather than underwritten.
    diligencePath: Request a cohort of site-level and cloud-level operating KPIs and compare them against the public metrics cited for NEXTDC, Equinix, CoreWeave, and Lambda.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: apac-campus-pricing
    missingEvidence: Consistent public pricing or term disclosures for APAC AI-ready campus operators such as AirTrunk, NEXTDC, Keppel, and GDS.
    whyItMatters: The quote-based nature of incumbent campus supply makes pricing comparison noisier than the capability comparison.
    diligencePath: Collect three live market quotes or broker indications for comparable MW commitments in Singapore, Sydney, and Tasmania.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
