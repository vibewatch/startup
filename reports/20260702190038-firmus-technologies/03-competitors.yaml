- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat vector
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - APAC sovereign siting
    - Hyperscalers already offer in-region cloud and broad residency maps
    - High
    - AWS, Google, and Azure footprints are much broader than Firmus's disclosed footprint
    - Ask for specific workloads that require physical control, not just in-region cloud
  - - Energy-efficient AI campuses
    - Larger rivals are also disclosing liquid cooling and efficiency programs
    - High
    - AWS, NEXTDC, Lambda, and Crusoe all market liquid-cooled AI capacity
    - Get evidence that Firmus lands materially better energy economics or permitting outcomes
  - - Integrated stack from chip to grid
    - Neocloud peers already combine cloud packaging with infrastructure
    - High
    - CoreWeave, Lambda, and Crusoe all sell integrated AI-infrastructure stories
    - Test whether Firmus owns enough software control to avoid being just a landlord
  - - Capital access through marquee backers
    - Rivals have even larger balance sheets or contract backlogs
    - High
    - AirTrunk has Blackstone/CPP; CoreWeave reports US$60.7b RPO
    - Request Firmus hardware-allocation rights and committed financing documents
  - - Distribution through partnerships
    - Incumbents own procurement rails and interconnection ecosystems
    - High
    - Hyperscalers, Equinix, and DLR each sit closer to existing enterprise buying paths
    - Identify whether Firmus can piggyback partner channels without losing economics
  - - Quote-based custom deployments
    - Opaque pricing can hide weakness as well as strength
    - Medium
    - Most campus and committed-deal pricing is not public
    - Obtain real customer proposals and discount ladders
  - - Sovereign-compute narrative
    - Policy language is increasingly generic across competitors
    - Medium
    - NEXTDC, DLR, and clouds all use sovereignty or in-region control language
    - Seek proof of signed sovereign contracts rather than marketing copy
  - - Supplier and entrant distance
    - NVIDIA and hyperscalers can move further down the stack
    - High
    - Microsoft AI factories, AWS UltraClusters, and NVIDIA reference stacks are already public
    - Pressure-test Firmus's differentiation if suppliers become direct alternatives
  notes: Severity is the author's judgment based on scale, distribution, and supply asymmetry, not a public company risk rating.
