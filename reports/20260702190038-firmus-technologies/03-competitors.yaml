- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider / class
  - Public package
  - Public price signal
  - Contract model
  - What remains opaque
  - Implication for Firmus
  rows:
  - - AWS P5 / P5e / P5en
    - On-demand GPU instances inside EC2 and SageMaker
    - Publishes relative savings and capabilities, not simple universal cluster list price on cited page
    - Usage-based cloud plus enterprise commits
    - Realized discounts, reserved-capacity economics, and sovereign packaging
    - Hard to underwrite direct price parity without private quotes
  - - Google Cloud Compute Engine
    - GPU VMs, Spot, sustained-use, and 1- or 3-year commitments
    - Explicit pricing framework and discount mechanics on public page
    - Usage-based with optional commitments
    - Region-specific realized prices and GPU reservation economics
    - Sets a public benchmark for buyers comparing cloud alternatives
  - - Azure ND family
    - GPU VMs with scale sets and InfiniBand clustering
    - No clean list price on retained sources
    - Usage-based and enterprise contracting
    - Realized H100 economics by region and term
    - Lets Azure win on bundling even when price transparency is weaker
  - - Lambda
    - Instances, 1-Click Clusters, and Superclusters
    - B200 at $6.69/hr; H100 at $3.99/hr
    - Self-serve plus reserved capacity
    - Regional availability and enterprise discounts
    - Most transparent AI-cloud price signal in the peer set
  - - CoreWeave / Crusoe committed deals
    - AI-native cloud plus long-term capacity contracts
    - Public scale signals, but not list pricing
    - Multi-year take-or-pay and on-demand mix
    - Unit pricing, minimum commits, and margin profile
    - Closer analogue to Firmus economics, but still mostly private
  - - AI-ready landlords / sovereign campuses
    - Private AI, colocation, and bespoke campuses
    - Mostly quote-based
    - Custom contracts, MW commitments, and partner-led packaging
    - Price per MW, minimum term, included cloud software, and utilization assumptions
    - Firmus competes in the least transparent pricing tier
  notes: This table separates list-price evidence from contract economics. Publicly visible prices are mostly cloud-style offers, while sovereign campuses and many neocloud committed deals remain opaque.
