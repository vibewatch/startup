companyProfile:
  summary: Firmus Technologies is an Australian-founded, Singapore-headquartered AI infrastructure company building and operating modular, liquid-cooled “AI factories” and associated cloud services for AI training, inference, and HPC workloads. Its strategy is to align sovereign compute demand with renewable-aware locations and vertically integrated infrastructure design spanning cooling, power, orchestration, and GPU cloud delivery.
