  topStrengths:
    - NVIDIA and Ellerston provide unusually strong strategic and institutional validation for a private APAC AI-infrastructure startup.
    - Tasmania, Singapore, and Batam together create a plausible sovereign-compute footprint matched to renewable-aware or strategically relevant locations.
    - The product story is differentiated by liquid cooling, modular AI-factory design, and model-to-grid efficiency positioning rather than generic colocation alone.
  topRisks:
    - Revenue, utilization, gross margin, customer concentration, and cap-table terms remain undisclosed despite the unicorn valuation.
    - Multi-campus expansion depends on power delivery, permits, and future financing structures that could subordinate common-equity economics.
    - Incumbents and well-capitalized neocloud competitors can attack the same AI-infrastructure opportunity with deeper balance sheets and larger installed bases.
  unresolvedGaps:
    - Full cap-table terms, liquidation preferences, and any project-level senior financing remain unavailable.
    - Current revenue, utilization, and customer concentration data are not public.
    - Southgate stage definitions and later-stage expansion economics need a normalized milestone and capex pack.
