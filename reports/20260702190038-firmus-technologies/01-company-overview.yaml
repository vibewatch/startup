company:
  name: Firmus Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Firmus Technologies is an Australian-founded, Singapore-headquartered AI infrastructure company that designs and operates energy-efficient "AI factories" and cloud compute across Asia-Pacific. Public evidence shows a step-change in September 2025, when Firmus closed an A$330 million equity placement backed by Ellerston Capital and NVIDIA at a A$1.85 billion post-money valuation, funding the 36,000-GPU Project Southgate campus in northern Tasmania. The file is unusually strong on infrastructure vision, policy positioning, and strategic partnerships, but still thin on board disclosure, revenue, customer concentration, and even brand/domain consistency.
sections:
- id: identity-and-geographic-footprint
  title: Identity, Product, and Geographic Footprint
  body: Firmus should be understood as an AI infrastructure operator rather than a generic colocation provider. Across its homepage, infrastructure pages, and AI cloud materials, the company consistently describes itself as a vertically integrated developer and operator of AI factories that designs the stack from chip to grid. The operating proposition blends modular high-density facilities, liquid cooling, orchestration software, and cloud services for AI training, inference, and HPC workloads. Geography matters to that thesis. Official materials tie the company to Singapore for current cloud operations and developer access, while also anchoring its corporate registration and capital-markets activity in Sydney and its flagship sovereign build-out in Tasmania. That mix is coherent if read as an Australian-founded, Singapore-headquartered regional platform, but public descriptions still vary by source, so the report should preserve the nuance rather than force one clean jurisdictional label.
    Tasmania is the core sovereign-compute story because renewable power, cool climate, and government support line up there; Singapore remains the proof point for live services, reference workloads, and regulated regional demand.
