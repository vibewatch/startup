  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Full board roster, board committee structure, major investor rights, and cap-table ownership percentages.
    whyItMatters: Control rights and governance quality affect downside protection, future financing leverage, and founder-risk assessment.
    diligencePath: Request the current cap table, shareholder agreement summary, board materials, and any side-letter rights from management.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-disclosure
    missingEvidence: A current employee count by function and geography.
    whyItMatters: Hiring breadth suggests scale, but without actual headcount it is hard to judge execution capacity, opex burden, or post-raise maturity.
    diligencePath: Request an org chart, headcount roll-forward, and recruiting plan tied to Southgate and Singapore operations.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Revenue, customer count, utilization, top accounts, contract duration, and gross-margin disclosure.
    whyItMatters: The company has strong infrastructure ambitions, but valuation quality cannot be judged without evidence of monetization and customer durability.
    diligencePath: Request monthly recurring revenue, booked/consumed GPU capacity, top-customer concentration, and contract summaries.
    relatedQuestionRefs:
    - QO014
    - QO025
  - type: conflicting-data
    severity: minor
    topic: headquarters-label
    missingEvidence: One consistent description of the legal parent, operating headquarters, and major subsidiaries.
    whyItMatters: Different public descriptions are not fatal, but can create diligence friction for jurisdiction, regulatory, and tax analysis.
    diligencePath: Request legal-entity structure and a simple geographic map covering Singapore, Sydney, Tasmania, and any other operating hubs.
    relatedQuestionRefs:
    - QO003
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: brand-confusion
    missingEvidence: Management confirmation on whether firmus.ai remains associated with the company or should be treated as an unrelated third-party brand.
    whyItMatters: Counterparty confusion can affect vendor diligence, customer trust, and source verification in public materials.
    diligencePath: Confirm the official brand and domain portfolio with investor relations and update website/press materials if necessary.
    relatedQuestionRefs:
    - QO024
