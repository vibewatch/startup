- id: disclosure-gaps-and-identity-friction
  title: Disclosure Gaps, Identity Friction, and What Later Chapters Must Pressure-Test
  body: 'The overview chapter leaves several important gaps for downstream diligence. Public materials do not disclose revenue, ARR, customer count, utilization, gross margin, burn, or debt structure; even employment scale must be inferred indirectly from the breadth of current hiring. There is also some reporting inconsistency on headquarters wording and future capital-markets plans, which reinforces the need to treat investor storytelling and hard disclosure separately. The sharpest identity issue is digital rather than financial: the user-supplied domain firmus.ai currently resolves to a different construction-document AI product now part of Bluebeam, while the AI-infrastructure company''s active public presence is on firmus.co and related SMC properties. That mismatch raises avoidable confusion for counterparties and underlines why source validation matters in this report. Finally, the ABC report usefully injects skepticism around power sufficiency and long-run employment intensity in
    Tasmania. The company''s energy and water policies are directionally aligned with the Australian Government''s 2026 expectations for AI infrastructure developers, but those policies now create a measurable standard against which execution can be judged.'
