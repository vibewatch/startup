- id: capital-base-strategic-validation-and-milestones
  title: Capital Base, Strategic Validation, and Milestones
  body: 'Firmus'' best-documented milestone is the September 2025 financing. Official company materials and multiple independent outlets align that the company closed an upsized A$330 million equity placement with Ellerston Capital as cornerstone investor and NVIDIA participating, at a A$1.85 billion post-money valuation. The use of funds is concrete rather than abstract: Project Southgate in northern Tasmania is framed as a 36,000-GPU flagship campus built in two stages, with first-stage delivery targets around 90MW by 2026 and larger follow-on expansion subject to approvals. Strategic validation extends beyond the round itself. NVIDIA appears not only as an investor but as a cloud and platform partner through DGX Cloud Lepton, Spectrum-X-based architectures, and a later Batam campus announcement; AI Singapore, HTX, MPA, STT GDC, and VAST each validate different pieces of the product stack or demand story. The result is a stronger-than-average partner set for a still-private infrastructure
    company. At the same time, the chronology is moving quickly enough that investors should separate validated current milestones from forward-looking campus claims that depend on execution, permits, and power delivery.'
