callouts:
- calloutType: strength
  title: Strategic validation is unusually strong for a private AI-infrastructure startup
  body: Few private regional infrastructure platforms can point simultaneously to NVIDIA as investor and marketplace partner, Ellerston as cornerstone institutional backer, AI Singapore as a quantified research reference, and public-sector MoUs with HTX and MPA. Those signals do not eliminate execution risk, but they meaningfully de-risk the question of whether Firmus is a purely conceptual story.
  claimRefs:
  - CO008
  - CO009
  - CO019
  - CO020
  - CO021
  - CO024
- calloutType: risk
  title: The biggest gaps are not on vision but on disclosure discipline
  body: Revenue, customer concentration, headcount, board control, and detailed power-connection economics all remain outside the public file. The fact that firmus.ai currently points to an unrelated construction-AI product while the infrastructure company operates on firmus.co is a smaller issue economically, but it is a useful proxy for why diligence on identity, counterparties, and public communications should remain strict.
  claimRefs:
  - CO030
  - CO031
  - CO036
  - CO038
