- id: financing-governance-and-kill-criteria
  title: Financing, governance, and thesis-break criteria
  body: 'The final risk layer is financial and governance quality. Treasury''s RTI release shows that even a single connection upgrade can qualify as a major capital investment and still reach ministers without a published business case. Publicly, the government has also withheld contract detail on commercial-in-confidence grounds. That opacity matters because public materials remain much richer on megawatts, water, and sustainability claims than on demand visibility or project-level economics. The reviewed sources do not identify anchor tenants, contracted offtakers, or utilisation commitments for the Tasmanian sites, which means customer concentration and margin durability cannot yet be tested from public evidence. Governance disclosure is similarly thin: the co-CEOs are prominent across announcements, but no CFO or independent-board detail appeared in the reviewed materials. The right underwriting response is to focus on observable kill criteria: final approvals, executed energy and connection
    documents, evidence of new generation backfill, customer or offtake disclosure, and any sign that state politics hardens from scrutiny into tighter regulation or moratoria.'
