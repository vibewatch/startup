tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / process
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Power-and-approval alignment under Commonwealth expectations
    - Australia
    - Expectations published; prioritisation tool rather than direct permit
    - High
    - Critical
    - Firmus publishes renewable, dispatchability, and grid-support commitments
    - Still exposed if approvals view the project as misaligned on power or community benefit
    - Ask management to map each site explicitly against the Commonwealth expectations and state approval requirements
  - - Bell Bay and Wesley Vale planning approvals
    - Tasmania
    - Applications lodged, final outcomes not publicly evidenced in reviewed sources
    - High
    - Critical
    - Existing industrial land, pre-existing infrastructure, and new community sessions
    - Municipal timing and local resistance remain outside Firmus control
    - Obtain the current DA docket, public submissions, and expected decision timetable for both sites
  - - Privacy Act and OAIC AI guidance
    - Australia
    - Existing law and regulator guidance already apply
    - Medium
    - High
    - Privacy-policy disclosures, contract controls, and workload governance
    - Public record does not yet show customer-ready control packs or AI-specific privacy operating procedures
    - Request privacy impact assessments, DPA templates, and public-sector control mappings
  - - SOCI and Cyber Security Act obligations
    - Australia
    - Reforms effective; applicability depends on asset and workload scope
    - Medium
    - High
    - Risk-management program, incident processes, and protected-information controls
    - No public evidence yet shows how Firmus has operationalised these obligations
    - Request critical-infrastructure legal analysis, CIRMP status, and incident-governance artifacts
  - - Singapore government collaborations
    - Singapore
    - MoUs signed with MPA and HTX
    - Medium
    - Medium
    - Use projects as R&D and credibility channels instead of treating them as approvals
    - Study-phase collaborations can be mistaken for commercial or regulatory clearance
    - Request statement of work, deliverables, and any path from study to production deployment
  - - Public disclosure reliance and litigation visibility
    - Australia
    - Website terms limit reliance; official litigation record not surfaced in reviewed sources
    - Medium
    - Medium
    - Use only fetched primary and high-quality independent sources for underwriting
    - Investors still lack direct court, cap-table, or board-process documents
    - Request litigation, cap-table, and board-governance representations from counsel and management
  notes: Rows are severity-ranked and limited to the public regulatory and legal processes visible on 2026-07-02; municipal portals were not directly usable during fetch review, so status relies on reviewed company, media, and RTI materials rather than a verified live docket export.
  enumerationScope:
    coverage: partial
    basis: Covers the publicly disclosed regulatory, privacy, planning, and government-process risks visible across Commonwealth, Tasmanian, and Singapore sources as of 2026-07-02; live council portals were access-blocked during review so final DA completeness could not be independently enumerated.
