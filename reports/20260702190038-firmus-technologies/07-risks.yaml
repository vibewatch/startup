- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration
  - Failure scenario
  - Severity
  - Mitigation
  - Residual exposure
  rows:
  - - Initial Tasmania power supply
    - Aurora Energy / Hydro Tasmania
    - Retail and generation path for St Leonards
    - High at the flagship site
    - Pricing, timing, or political scrutiny forces slower ramp or worse unit economics
    - Critical
    - Initial 104 MW agreement is public and Firmus says it will pay market rates
    - Longer-dated Tasmania terms and economics remain only partly disclosed
  - - Bell Bay transmission and energy arrangements
    - TasNetworks / future suppliers
    - Connection, studies, and negotiated energy path
    - High for second-site rollout
    - Connection approvals or commercial negotiations slip past construction readiness
    - Critical
    - Firmus says it will self-fund transmission and manage demand dispatchably
    - Final arrangements were still under negotiation in the Bell Bay FAQ
  - - South Australia renewable backfill
    - Gunvor Group
    - Long-dated firm supply plus renewable and battery buildout
    - Medium
    - Renewable or storage delivery lags while Firmus load still ramps
    - High
    - 12-year contract plus explicit generation and storage commitments
    - Mitigation only works if supplier execution and curtailment mechanics are real on schedule
  - - GPU and channel ecosystem
    - NVIDIA
    - Hardware roadmap, Lepton marketplace access, and buyer trust
    - High
    - GPU allocation, pricing, or marketplace economics deteriorate
    - High
    - Firmus is already listed as a Lepton cloud partner and promotes multi-generational readiness
    - The public route to market still tracks the NVIDIA ecosystem closely
  - - Foundational data layer
    - VAST Data
    - AI operating system and data plane
    - Medium to High
    - Data-layer roadmap or economics misalign with Firmus workload model
    - High
    - Public selection of a named platform reduces ambiguity on current architecture
    - No public replacement path, migration rights, or multi-vendor data-plane strategy is visible
  - - Demand side / offtake base
    - Undisclosed anchor tenants
    - Load utilisation and revenue conversion
    - High
    - Capacity lands before durable contracted demand is visible
    - High
    - None visible publicly beyond general market demand and partner signals
    - Customer concentration and utilisation cannot be stress-tested from public sources
  notes: This register isolates external chokepoints rather than restating internal execution risk; the final row is intentionally framed around undisclosed offtake because customer visibility is itself a material dependency risk.
