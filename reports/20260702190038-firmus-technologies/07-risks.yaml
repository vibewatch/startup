  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: tasmania-development-application-status
    missingEvidence: A directly accessible and current municipal docket export for the Bell Bay and Wesley Vale development applications, including submissions, current status, and expected decision dates.
    whyItMatters: The rollout risk is heavily path-dependent on later-site approvals, and current public reporting does not substitute for the authoritative council record.
    diligencePath: Request the latest DA registers and planners' reports from George Town and Latrobe councils, plus any public-submission summaries and hearing timetables.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: critical-infrastructure-applicability
    missingEvidence: A company-specific legal analysis showing whether current or planned Firmus assets fall inside the relevant SOCI and Cyber Security Act obligation set, and what controls are already live.
    whyItMatters: The public legal framework is clear, but the investment risk depends on asset-level applicability and implementation maturity, not only on the text of the law.
    diligencePath: Request external counsel advice, any CIRMP or equivalent program artifacts, and an incident-governance summary tied to the Tasmanian and Singapore assets.
    relatedQuestionRefs:
    - QR003
  - type: missing-source
    severity: material
    topic: tasmania-renewable-backfill-and-transmission
    missingEvidence: Executed Hydro, Aurora, TasNetworks, or other supplier documents showing how load growth beyond the initial St Leonards agreement will be matched with transmission and new generation.
    whyItMatters: Firmus's mitigation story depends on proving that later-site load can be financed and supplied without simply leaning on scarce existing renewable capacity.
    diligencePath: Request executed term sheets, milestone schedules for transmission works, and the company's Tasmania-specific renewable-build plan.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: vast-replaceability-and-data-plane-lock-in
    missingEvidence: Contract scope, exit rights, and any alternative data-layer or migration plan covering the VAST relationship.
    whyItMatters: A single disclosed foundational data-layer partner can become a margin, roadmap, and switching-cost issue if the relationship proves less flexible than public press releases imply.
    diligencePath: Request the data-platform architecture note, commercial scope, renewal terms, and any internal contingency plan for multi-vendor storage or metadata services.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: litigation-and-governance-record
    missingEvidence: Direct court, cap-table, board, and officer-disclosure records sufficient to confirm or dismiss material litigation and governance issues.
    whyItMatters: Power, financing, and public-sector credibility can all be impaired by unresolved governance or cap-table disputes, and the reviewed public evidence does not close that question confidently.
    diligencePath: Request litigation schedules, board roster, cap-table certifications, and representations from counsel covering pending disputes and officer suitability.
    relatedQuestionRefs:
    - QR006
    - QR025
