  - CR053
- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Approvals and social licence
    - Planning process hardens
    - Bell Bay or Wesley Vale approvals slip, consultation windows keep extending, or parliamentary scrutiny turns into state-specific restrictions
    - Do not underwrite full Tasmania buildout until the new critical path is re-based
  - - Power availability
    - Initial and second-site energy path weakens
    - St Leonards misses the public 104 MW ramp or Bell Bay stays in negotiated-energy limbo past construction readiness
    - Move the case from scale-up thesis to first-site proof only
  - - Renewable backfill credibility
    - New generation does not follow load growth
    - Company cannot evidence Hydro or other Tasmania backfill arrangements while load commitments rise
    - Treat sustainability claims as narrative rather than cost or policy protection
  - - NVIDIA dependence
    - GPU and marketplace leverage worsens
    - Allocation, pricing, or commercial terms deteriorate without an alternate channel
    - Assume margin compression and slower customer acquisition
  - - Data-layer concentration
    - VAST roadmap or economics misalign
    - Firmus cannot articulate an exit path, migration path, or dual-vendor strategy
    - Apply a platform-lock-in discount to the operating model
  - - Customer / utilisation opacity
    - No anchor-tenant evidence arrives
    - Management still cannot disclose contracted demand, offtake quality, or utilisation assumptions in diligence
    - Do not underwrite project-level cash flows
  - - Privacy and cyber controls
    - Control-pack evidence is absent
    - No privacy impact assessments, incident governance, or customer-ready control mapping is produced
    - Assume sovereign and public-sector sales cycles remain constrained
  - - Governance and disclosure
    - Opacity persists despite scale
    - No business-case visibility, board clarity, or regular build-versus-plan reporting emerges as projects multiply
    - Escalate risk rating and require stronger financing covenants or avoid
  notes: 'The trigger table is intentionally forward-looking: each row converts a risk into a monitorable event that can change underwriting posture instead of merely restating the static register.'
