- id: TR004
  title: People / execution risk register
  columns:
  - Role / function
  - Dependency or gap
  - Likelihood
  - Severity
  - Mitigation
  - Diligence path
  rows:
  - - Senior leadership / external face
    - Public disclosure is concentrated on the two co-CEOs
    - Medium
    - High
    - Management is visibly engaged in community and government dialogue
    - Request succession plan, delegated operating authority, and named site leaders
  - - Finance and board governance
    - No CFO or independent-board detail appeared in reviewed public sources
    - Medium
    - High
    - Not visible publicly
    - Request board composition, audit oversight, and project-finance governance materials
  - - Community relations capability
    - Engagement became more visible only after backlash
    - Medium
    - Medium
    - Drop-in sessions and webinars are now in motion
    - Request community-engagement plan, escalation log, and post-approval reporting commitments
  - - Operations and maintenance staffing
    - Bell Bay assumes 24/7 operations with >100 local FTEs
    - Medium
    - Medium
    - Large industrial labour pool and transferable trades are cited by the company
    - Request staffing ramp, outsourcing mix, and maintenance KPI targets
  - - Disclosure discipline
    - Commercial-in-confidence and partial public evidence limit investor visibility
    - High
    - High
    - RTI and media scrutiny are creating external pressure to disclose more
    - Request executed contract summaries, project dashboards, and quarterly build-versus-plan reporting
  notes: Execution risk here is defined as the people and disclosure system required to convert project ambition into dependable delivery, not as a generic hiring challenge.
