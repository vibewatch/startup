- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Failure mode
  - Likelihood
  - Severity
  - Mitigation maturity
  - Residual exposure
  - Unresolved gap
  rows:
  - - St Leonards ramp misses August-November 2026 load timetable
    - Medium
    - High
    - 'Moderate: retail supply and site construction are public, but no independent commissioning proof exists'
    - Revenue timing and credibility slip if the first factory misses ramp
    - Need commissioning milestones, live capacity data, and customer onboarding schedule
  - - Bell Bay dry-cooling assumptions understate real electricity or water intensity
    - Medium
    - High
    - 'Moderate: FAQ and management disclosed assumptions, but public third-party validation is thin'
    - Hot-weather performance or backup cooling could materially change cost and community reaction
    - Need engineering review of cooling mode, design weather basis, and worst-case water draw
  - - AI data-integrity or privacy control failures affect customer workloads
    - Medium
    - High
    - 'Early: government guidance is clear, but public proof of Firmus control implementation is limited'
    - A control failure could hit public-sector trust and sovereign workload demand simultaneously
    - Need control-pack evidence, pen-test cadence, encryption details, and AI data-governance procedures
  - - Grid, equipment, or construction bottlenecks delay later Tasmania sites
    - High
    - High
    - 'Low to Moderate: industry studies explain the risk, not Firmus-specific buffers'
    - Site sequencing and capex draw can stretch before revenue is proven
    - Need procurement timetable for transformers, switchgear, and major electrical packages
  - - Round-the-clock Bell Bay operations strain hiring, maintenance, and shift coverage
    - Medium
    - Medium
    - 'Low: job claims exist, but operating-model detail is sparse'
    - Labour gaps can become uptime and safety issues once multiple sites are live
    - Need org chart, shift design, maintenance staffing plan, and contractor strategy
  - - Community concerns about noise and vibration persist after construction
    - Medium
    - Medium
    - 'Reactive: Firmus added drop-in sessions and webinars after backlash'
    - Protracted complaints can feed approval conditions, monitoring, or operating restrictions
    - Need noise-monitoring plan, escalation process, and post-commissioning community reporting
  notes: Severity reflects potential impact on time-to-revenue and public-sector credibility, not only engineering difficulty; several rows rely on published assumptions rather than verified operating telemetry.
