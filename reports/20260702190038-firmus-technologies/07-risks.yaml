- id: operational-delivery-security
  title: Operational, delivery, water, and security risk
  body: 'Operationally, Firmus is asking investors to believe several difficult things at once: that dense liquid-cooled AI factories can ramp on compressed timelines, that dry-cooling assumptions will hold under real Tasmanian conditions, and that site-level operating complexity can be managed across round-the-clock facilities. Public evidence is mixed. Firmus has offered concrete water numbers and says Bell Bay only needs cooling water on roughly ten hot days a year, but the same public dialogue shows why that does not eliminate risk; residents are challenging the assumptions, and independent researchers note that dry cooling can trade water savings for extra electricity consumption. Security adds a different operational burden. Cyber.gov guidance treats data integrity, encryption, provenance, and lifecycle controls as central to AI system reliability, and those expectations become more important when the business model depends on hosting sovereign or enterprise AI workloads. Global studies
    from AEMO, IEA, JLL, WEF, and Deloitte reinforce that construction lead times, grid bottlenecks, and electrical-equipment scarcity are now structural rather than one-off constraints.'
