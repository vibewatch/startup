company:
  name: Firmus Technologies
chapter:
  number: 7
  title: Risks
  summary: Firmus's highest underwriting risks are concentrated in power, approvals, and partner dependence rather than in market demand alone. Public evidence supports the first St Leonards ramp and a credible mitigation narrative, but the broader Tasmania rollout still depends on final approvals, negotiated energy and transmission arrangements, and customer-demand visibility that remain only partly disclosed.
sections:
- id: risk-stack-overview
  title: Severity-ranked risk stack
  body: 'Firmus''s risk profile is dominated less by whether AI compute demand exists and more by whether the company can convert that demand into permitted, powered, and financeable capacity quickly enough. The strongest public proof today is narrow: St Leonards has a 104 MW retail service agreement and active construction, Bell Bay has a detailed FAQ and transmission story, and the Commonwealth now has explicit expectations for energy-intensive AI infrastructure. The weakest public proof is exactly where investors need underwriting confidence: final approvals beyond St Leonards, customer or offtake disclosure, and executed long-dated Tasmanian energy arrangements. That combination makes the severity stack clear. First are power, approvals, and social licence because those can directly stop sites from going live. Second are partner and platform dependencies on Aurora or Hydro, NVIDIA, and VAST because Firmus''s product and route to market remain tightly coupled to external counterparties.
    Third are financing, governance, and utilization opacity, because the public record is still far thinner on demand quality than on project ambition.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR015
  - CR029
  - CR030
  - CR049
  - CR050
  figureRefs:
  - FR001
- id: regulatory-legal-social-licence
  title: Regulatory, legal, and social-licence risk
  body: The regulatory burden is not a single permit; it is a layered stack. At the Commonwealth level, the new expectations for data centres and AI infrastructure give government a basis to prioritise aligned proposals and deprioritise misaligned ones, especially where energy, resilience, or community benefit are weak. At the same time, the legal landscape for AI already pulls in privacy, directors' duties, negligence, and consumer-law exposure, while cyber reforms under SOCI now speak directly to data-storage systems and risk-management programs. None of that proves Firmus is non-compliant, but it raises the diligence bar for a company trying to serve sovereign and public-sector workloads. The more immediate issue is social licence. ABC and ABC Listen reporting show community pushback on consultation, water, noise, and public benefit, while the most current public planning status for Bell Bay and Wesley Vale still depends on municipal processes the company does not fully control. The Singapore
    MPA and HTX relationships help strategic positioning, but they are research MoUs, not substitutes for operating approvals.
  claimRefs:
