      - number: '8.4'
        title: 入场纪律、摊薄悬顶、退出准备度和最后问题
        blocks:
          - type: paragraph
            body: >-
              真正的估值争论不是 Firmus 是否有意思，而是新投资人是否应该在资本结构和收入引擎更清楚之前接受今天的价格。审阅来源显示，公司在并行推进 Southgate、Batam
              和南澳大利亚州扩张时，可能还需要更多外部资本。行业来源也说明，这些资本现在来自哪里：优先股、项目融资、ABS、CMBS、私人信贷，以及其他可能排在普通股之上或稀释普通股的结构。因此，入场纪律是核心。一笔新投资应分阶段投入、以文件为先，并明确摊薄、下行保护和信息权。退出愿景存在，因为公司已经有股东沟通基础设施，媒体也报道了上市意图；但退出准备度仍落后于成熟上市可比公司展现的披露门槛。因此，实际建议是
              Track，而不是 Buy：保持接触，要求更严密的承保包，只有当商业化、交易对手和融资条款改善速度快于估值时才行动。
