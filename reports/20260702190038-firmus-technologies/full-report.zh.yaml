            title: 真正的溢价，是获批且与政策兼容的容量
            body: 市场证据支持稀缺性，但不支持普遍的绿色价格上浮。在 APAC，高效 AI 容量越来越靠拿到审批、打通电网和主权门槛取胜；弱项目甚至过不了这些门槛。
