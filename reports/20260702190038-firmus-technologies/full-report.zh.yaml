      - number: '2.2'
        title: 用多重测算视角取代单一标题式 TAM
        blocks:
          - type: paragraph
            body: >-
              没有一个公开市场数字能干净描述 Firmus。最偏物理层的视角是用电量：IEA 分析把 2024 年数据中心需求放在约 415 至 460 TWh，到 2030 年约 945 至超过 1,000 TWh，且以
              AI 为核心的设施增速快于品类平均。下一个视角是容量和 capex。JLL 预计 2026 至 2030 年全球将新增约 97 至 100 GW 数据中心容量，并把这轮建设定义为到 2030 年最高 $3
              trillion 的房地产和租户合计投资；McKinsey 更宽的工业视角则达到约 $7 trillion。这些数字在规模方向上相互印证，但不能直接相互比较。


              APAC 比全球总量数字更重要，因为 Firmus 是区域运营商。JLL 的亚太报告指出，到 2027 年将新增 4.8 GW 供给，其中 78% 已预租；DatacenterDynamics 报道称，2025
              年区域开发管线为 19.4 GW，未来五到七年 APAC 托管机房建设 capex 约 $116 billion。Neocloud 和主权算力视角又不同。Gartner 较窄的口径意味着，到 2030
              年，neocloud 将从 $267 billion 的 AI 云市场中拿到 20% 份额，对应约 $53 billion 收入；ABI 更宽的 GPUaaS 口径到 2030 年达到 $250
              billion，Gartner 的主权云 IaaS 视角则在 2026 年已经达到 $80 billion。应把这些作为并行视角保留，而不是相加成一个虚假精确的 TAM。
