  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发器
      - 门槛 / 事件
      - 行动含义
    rows:
      - - 审批与社会许可
        - 规划流程收紧
        - Bell Bay 或 Wesley Vale 审批延迟、咨询窗口不断延长，或议会审查转化为州层面的限制
        - 新的关键路径重设前，不要把完整塔斯马尼亚建设纳入投资测算
      - - 电力可得性
        - 初始站点和第二站点能源路径变弱
        - St Leonards 错过公开的 104 MW 爬坡，或 Bell Bay 建设已就绪后仍卡在能源谈判中
        - 把案例从扩张论证下调为只验证首站点
      - - 可再生能源补位可信度
        - 新发电能力跟不上负载增长
        - 负载承诺上升时，公司无法证明 Hydro 或其他塔斯马尼亚补位安排
        - 把可持续性主张视为叙事，而不是成本或政策保护
      - - NVIDIA 依赖
        - GPU 和市场议价能力恶化
        - 没有替代渠道时，分配、定价或商业条款恶化
        - 假设利润率被压缩、获客变慢
      - - 数据层集中
        - VAST 路线图或经济性错配
        - Firmus 无法说明退出路径、迁移路径或双供应商策略
        - 在运营模型中加入平台锁定折价
      - - 客户 / 利用率不透明
        - 没有锚定租户证据
        - 尽调中，管理层仍无法披露合同需求、承购质量或利用率假设
        - 不要把项目级现金流纳入投资测算
      - - 隐私与网络安全控制
        - 缺少控制包证据
        - 未提供隐私影响评估、事件治理或可交付客户的控制映射
        - 假设主权和公共部门销售周期仍受约束
      - - 治理与披露
        - 规模扩大但不透明持续
        - 项目增加后，仍没有商业案例可见度、董事会清晰度或定期建设进度与计划对比报告
        - 上调风险评级，要求更强融资契约，或回避
    notes: 触发器表有意前瞻：每一行都把风险转成可监测事件，能够改变投资判断姿态，而不是只重复静态登记表。
