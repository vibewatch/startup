        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引信号是技术性的，不是财务性的。AI Singapore 公开描述了在 Firmus 基础设施上使用 256 块 H200 GPU、超过 200 次实验，以及快速模型训练周期。NVIDIA 将
              Firmus 列入 DGX Cloud Lepton，多份公开材料也把公司放在新加坡云和主权算力语境中。这些都是可信证明点，说明服务存在，也说明一些成熟买方愿意使用。它们不能替代财务
              KPI。受审阅来源没有披露当前收入、ARR、已预订容量、客户数量、客户标识集中度、利用率、毛利率、现金、烧钱速度或债务栈。2025 年 9 月 A$330 million
              融资真实且具有战略意义，但公开义务增长快于披露。单是 Southgate 就被描述为数十亿美元级资产，南澳平台又增加了长期电力、储能和电网责任。因此，SmartCompany 报道称 Firmus 预计会在拟议的
              2026 年上市前继续融资，即便确切路径未确认，也方向上可信。公开记录更支持“资金足以继续建设”，而不是“相对已披露管线已经全额融资”。
