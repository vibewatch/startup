      - number: '4.5'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Firmus 比较容易相信，但很难承销。公司有可信的收入触点、真实的技术需求验证；以私有 AI
              基础设施运营商标准看，电力和冷却架构也异常具体。但同一组证据也显示，业务成败取决于能否在资本需求跑赢已披露股权之前，把电力、冷却和融资承诺转化为高利用率经常性收入。因此，收入质量是未证明，不是已证伪。公开证据还无法告诉投资者实际定价是什么样、收入基础有多集中、扣除电力和支持成本后还能留下多少利润，或客户预承诺能否显著抵消
              capex 曲线。正确结论是：Firmus
              有可信技术牵引，资本强度高，公开披露缺口严重。核心尽调问题包括按收入流划分的当前收入、实际定价和折扣政策、合同期限和续约条款、按站点划分的利用率、按工作负载类型划分的毛利率、当前现金和烧钱速度、各站点 capex
              与电网接入提款计划，以及塔斯马尼亚、南澳和任何后续园区的确切融资结构。没有这些，常规承销仍然卡住。
            claimRefs:
              - CI037
              - CI039
              - CI040
              - CI041
