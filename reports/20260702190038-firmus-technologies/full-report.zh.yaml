companyProfile:
  summary: >-
    Firmus Technologies 是一家创立于澳大利亚、总部位于新加坡的 AI 基础设施公司，建设并运营模块化、液冷的“AI 工厂”及配套云服务，服务 AI 训练、推理和 HPC
    工作负载。公司的策略，是把主权算力需求同顾及可再生能源的选址、垂直整合的基础设施设计对齐；设计范围覆盖冷却、电力、编排和 GPU 云交付。
