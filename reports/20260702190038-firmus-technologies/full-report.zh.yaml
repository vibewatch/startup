      - number: '7.2'
        title: 监管、法律和社会许可风险
        blocks:
          - type: paragraph
            body: >-
              监管负担不是一张许可证，而是一层叠一层的要求。在澳联邦层面，针对数据中心和 AI 基础设施的新期待让政府有理由优先支持对齐的提案、搁置不对齐的提案，尤其是能源、韧性或社区收益偏弱时。与此同时，AI
              的法律环境已经牵涉隐私、董事义务、过失和消费者法风险；SOCI 下的网络改革也已经直接指向数据存储系统和风险管理计划。这些都不能证明 Firmus
              不合规，但会抬高一家服务主权和公共部门工作负载公司的尽调门槛。更直接的问题是社会许可。ABC 和 ABC Listen 的报道显示，社区在咨询、水、噪声和公共收益上反弹；Bell Bay 和 Wesley
              Vale 最新公开规划状态仍取决于公司无法完全控制的市政流程。新加坡 MPA 和 HTX 关系有利于战略定位，但它们是研究 MoU，不是运营审批的替代品。
