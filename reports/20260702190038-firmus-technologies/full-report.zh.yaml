            body: >-
              公开证据强烈显示，Firmus 的成本基础很重资本。Southgate 站点页面和公司承诺页面显示，运营模式围绕高密度 GPU 基础设施、液冷、确定性电力、网络连接、编排软件和持续支持搭建。2026 年 6
              月的南澳协议把这种成本姿态从愿景变成具体义务：12 年合同电力、600MW 确定性电力、1.2GW 关联可再生能源、1.5GWh 储能，以及每年最高 220 小时需求响应义务。Firmus
              还称，将支付商业电价，并自费建设输电或连接升级。这些是经济义务，不只是 ESG 修辞。外部报道让规模问题更尖锐。ABC 报道 Launceston 项目约 A$2.1 billion，并引用公司说法称第一阶段需要
              90MW。CoreWeave、Equinix、NEXTDC 和 AirTrunk 的可比披露指向同一方向：AI 和超大规模基础设施经济性由固定资本、电力、租赁、融资和支持负担主导。这使 Firmus
              更像数据中心或项目融资业务，而不是传统软件公司。
