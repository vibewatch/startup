      - number: '7.4'
        title: 伙伴、电网和平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Firmus 的商业架构仍明显依赖交易对手。塔斯马尼亚故事从 Aurora 和 Hydro 的初始电力开始，延伸到 TasNetworks 和 AEMO 的接入与输电经济性，再押注公共政策接受三处站点合计消耗超过
              400 MW。Bell Bay 自己的 FAQ 仍称最终能源安排还在谈判，这提醒投资人：在更大规模铺开上，公司叙事多于合同披露。南澳大利亚州的 Gunvor
              协议给出更具体的缓释样本，但也凸显对供应商执行的依赖：只有承诺的可再生发电、电池储能和限发机制按时到位，价值才会兑现。技术侧，NVIDIA 既是供应商，也通过 DGX Cloud Lepton 成为渠道；VAST
              则是唯一公开披露的基础数据层伙伴。依赖图谱很清楚：Firmus 控制集成和品牌，但几个关键的吞吐、价格和可靠性杠杆仍不在它直接控制之下。
