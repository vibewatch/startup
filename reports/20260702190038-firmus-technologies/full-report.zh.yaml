              NVSwitch，以及用于横向扩展的 InfiniBand 或高速 Ethernet。Bare Metal 随后把同一架构延伸到预留单租户集群，AI Storage 则描述了 RDMA 加速的 NVMe
              和检查点密集型工作流。硬件之上，Slurm 被持续点名为调度器，AIFactoryOS 被定位为编排和遥测层。VAST 伙伴关系补充了一个独立的数据平面线索：Firmus
              试图让存储和元数据管理随算力与能源同步扩展。净结果是，这套栈有意为分布式训练优化，而不是面向普通虚拟机托管。
