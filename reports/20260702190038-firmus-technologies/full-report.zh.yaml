            body: >-
              主要客户风险是透明度不足和依赖，而不是需求明显不足。公开披露没有量化头部客户占比或细分组合，因此无法用开放来源给集中度风险定量。Batam 项目以已承诺承购协议和 AI
              原生需求来营销，但客户名称和合同结构仍是私有信息，因此锚定租户 风险真实存在。伙伴依赖也很重，因为公开的市场路径依赖 NVIDIA 硬件和 Lepton 分销、STT GDC 托管历史、VAST 数据层，以及
