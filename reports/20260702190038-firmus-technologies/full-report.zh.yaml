  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据足以勾勒 Firmus 的收入入口，但不足以给它们定价。AI Cloud Compute 围绕 H200 级系统提供按需实例和预留集群；Bare Metal 增加可预留的专用单租户或多机架 GPU
              集群；Cloud Services 在其上叠加编排、托管 Slurm、CUDA 栈、可观测性和混合连接。这不是一个 SKU。它至少是三层商业栈：云访问、预留基础设施和托管运营。缺失的关键层是商业具体性。受审阅的
              Firmus 页面都没有发布每
              GPU-hour、每集群或托管服务标价，所有页面都把买方导向询价或预留表述。这意味着本章可以描述活动应如何转化为收入，但无法判断实际组合：使用量收入、最低承诺预留容量、专业服务或支持。健康的解读是，这是一种借
              NVIDIA DGX Cloud Lepton 获得部分市场分销的企业基础设施收入。保守解读则是，产品包装领先于公开商业披露。承销时，正确姿态既不是“没有商业模式”，也不是“清晰的 SaaS
              定价”，而是“可信的变现入口，但实际定价未解”。
