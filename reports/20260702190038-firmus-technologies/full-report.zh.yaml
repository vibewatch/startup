      - number: '1.3'
        title: 资本基础、战略验证与里程碑
        blocks:
          - type: paragraph
            body: >-
              Firmus 记录最充分的里程碑，是 2025 年 9 月的融资。公司官方材料和多家独立媒体口径一致：公司完成了扩容后的 A$330 million 股权配售，Ellerston Capital
              担任基石投资者，NVIDIA 参与，投后估值为 A$1.85 billion。资金用途不是抽象表述，而相当具体：位于塔斯马尼亚北部的 Project Southgate 被描述为一个 36,000-GPU
              旗舰园区，分两个阶段建设，第一阶段目标是在 2026 年前后交付约 90MW，更大规模的后续扩建取决于审批。战略验证不止来自这轮融资。NVIDIA 不仅是投资者，还通过 DGX Cloud Lepton、基于
              Spectrum-X 的架构，以及之后的 Batam 园区公告，成为云和平台伙伴；AI Singapore、HTX、MPA、STT GDC 和 VAST
              则分别验证了产品栈或需求故事的不同部分。结果是，对于一家仍为私有的基础设施公司，Firmus
              的伙伴阵容强于平均水平。与此同时，时间线推进很快，投资者应把已经验证的当前里程碑，同依赖执行、许可和供电交付的前瞻性园区主张分开看。
