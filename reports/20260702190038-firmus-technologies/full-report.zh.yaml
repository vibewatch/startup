  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 看多论点
      - 反论点
      - 改变观点的证据
    rows:
      - - 市场
        - Neocloud 和主权 AI 需求快速扩张，电力稀缺会奖励早期持有容量的人。
        - 即便市场快速增长，只要电力、政策或融资收紧，估值仍可能重校。
        - 已签客户需求和特定市场电力准入
      - - 产品
        - 高能效、液冷 AI 工厂设计贴合成本和可持续性叙事。
        - 市场可能把 Firmus 看成资本密集型建设项目，而不是差异化的软件式基础设施。
        - 经测量的成本、正常运行时间和利用率优势
      - - 客户
        - DGX Cloud Lepton 和 AI Singapore 显示，合作伙伴牵引的需求正在形成。
        - 相较估值规模和未来资本开支负担，公开客户证据仍薄。
        - 具名创收交易对手和集中度数据
      - - 竞争
        - 在 APAC 落地主权能力，可能打开现有厂商尚未完全本地化的切口。
        - Equinix、Digital Realty 等现有厂商已在全球销售主权和适配 AI 的基础设施。
        - Firmus 在速度、价格和本地性上胜出的证据
      - - 资本结构
        - 新股本和合作伙伴结构能比纯资产负债表融资更快推动建设。
        - 盈利出现前，收入分成、优先资本或项目债可能让普通股经济性让位。
        - 完整条款清单、担保排序和项目级资金计划
      - - 监管
        - 澳大利亚政策明确重视主权、本地能力和能源纪律。
        - 同一套政策框架也会放慢或重定价不满足社会许可和基础设施预期的项目。
        - 各站点许可状态和监管一致性
    notes: 每条反论点都与估值相关，而不只是运营问题；关键是它多快会改变普通股结果。
