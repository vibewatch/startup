  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局与替代层
        blocks:
          - type: paragraph
            body: >-
              Firmus 面对的不是一个干净的单一同业集合。买方可以用超大规模云厂商的 GPU 云、能托管或拼接私有 AI 环境的 AI 就绪机房业主、把 GPU 访问和软件打包的专业
              neocloud，或由最大型项目自行建设，来完成同一项任务。因此，竞争压力来自任何最能缓解获得容量时间、司法辖区控制和运营确定性痛点的替代方案。客户愿意留在既有云关系里时，超大规模云厂商会赢；土地、电力和互联成为稀缺输入时，Equinix、Digital
              Realty、AirTrunk、NEXTDC、Keppel 和 GDS 很重要；买方想要不必等待定制园区的 AI 原生栈时，CoreWeave、Lambda 和 Crusoe 很重要。因此，评判 Firmus
              时，不应把它看成独立托管机房，而应把它看成一个区域性 AI 基础设施整合商，试图在更大类别的替代品面前守住更窄的主权楔子。
