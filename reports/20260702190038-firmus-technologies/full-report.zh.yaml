              工厂审批同主权、能源、社区和清洁基础设施测试挂钩。澳大利亚独立报道又补充了第二重警示：电力、水和社会许可问题可能拖慢大型项目。简言之，公开需求信号有希望，但客户质量仍容易受到伙伴集中、政府转化周期，以及锚定买方真实身份披露稀疏的影响。
