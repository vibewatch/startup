              AI Singapore / SEA-LION 案例研究是本章的锚定参考，因为它点明了用户、模型家族、基础设施规模、实验量，以及从研究走向生产托管的预期路径。这比普通伙伴页面或沉默的 客户标识墙强得多，也显示
              Firmus 能支持真实模型构建工作流，而不只是销售基础设施概念。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: callout
            title: 大多数公共部门证据仍处于收入前或续约前阶段
            body: HTX 和 MPA 证明主权侧确有兴趣，但两项案例仍停留在研究、评估或设计阶段的表述里，并非已披露的生产级消耗。再加上客户数量和续约指标缺位，投资人目前还无法区分战略相关性和可持续的公共部门变现。
