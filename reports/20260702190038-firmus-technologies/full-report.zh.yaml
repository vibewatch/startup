      - number: '7.5'
        title: 融资、治理和论点失效标准
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是财务和治理质量。Treasury 的 RTI
              披露显示，即使单一接入升级也可能被认定为重大资本投资，并在没有公开商业论证的情况下送达部长。公开层面，政府也以商业保密为由拒绝披露合同细节。这种不透明很重要，因为公开材料在兆瓦、水和可持续性承诺上远比需求可见度或项目级经济性丰满。所审阅来源没有指出塔斯马尼亚站点的锚定租户、已签约包销方或利用率承诺，意味着客户集中度和利润率韧性还无法用公开证据检验。治理披露同样薄：联席
              CEO 在公告中很突出，但审阅材料没有出现 CFO
              或独立董事会细节。正确的承保反应应聚焦可观察的否决条件：最终审批、已签署的能源和接入文件、新增发电回补证据、客户或包销披露，以及任何州政治从审视转向更严格监管或暂停审批的信号。
