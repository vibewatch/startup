  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚与真正已证明的内容
        blocks:
          - type: paragraph
            body: >-
              文件里最干净的估值事实就是本轮融资本身：Firmus 官方完成 A$330 million 股权配售，投后估值 A$1.85 billion，Ellerston Capital 和 NVIDIA
              在投资团内。这个价格买到的是有形项目，而不是泛泛的 AI 故事。Project Southgate 被记录为塔斯马尼亚旗舰园区，建设计划为 36,000 张 GPU；项目页还补充了 84 MW 关键 IT
              负载、低于 1.10 的 PUE 和强用水效率主张。文件也显示公司已有面向投资者关系的股东沟通页面，SmartCompany 还报道其有 2026
              年上市意图。但估值文件仍缺少投资人从“欣赏醒目估值”进入承保所需的证据：收入、毛利率、利用率、客户集中度，以及本轮新资金所附的清算优先或优先级条款均未公开披露。因此，A$1.85 billion
              可以作为市场出清事件成立，但作为普通股承保包仍不完整。
            claimRefs:
              - CV001
