              和其他伙伴牵头的渠道访问。问题在于，分层地图远比具名客户名单丰富。AI Singapore 是最清楚的公开证明点，因为它给出了具体机构用户、特定模型家族和可衡量的工作负载规模。HTX 和 MPA
              说明新加坡公共机构愿意围绕主权和可持续基础设施问题同 Firmus 接触，但这些参考仍偏研究或设计导向。NVIDIA、STT GDC 和 VAST
