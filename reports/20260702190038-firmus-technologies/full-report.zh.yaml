  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 年化收入
        - 按业务线拆分的当前经常性收入、已确认收入和增长桥
        - 没有这组数据，当前估值无法严谨对标任何公开或私有可比组
        - 管理层材料，以及经审计或董事会口径 KPI 摘要
      - - 利用率和单位经济性
        - 园区利用率、毛利率、电力成本假设，以及每 token 成本或等效工作负载经济性
        - 决定效率主张能否真正转成股权价值
        - 运营模型审阅和现场走访
      - - 已签约承购交易对手
        - Southgate 和 Batam 交易对手的名称、信用质量、期限和定价
        - 区分叙事需求和可融资、可银行化需求
        - 合同审阅，附交易对手集中度表
      - - 股权结构表和轮次条款
        - A$330m 条款清单、清算优先权、担保顺位、董事会权利，以及任何老股转让部分
        - 决定普通股下行和稀释悬念
        - 法律尽调和完整股权结构表滚动更新
      - - 未来融资计划
        - Southgate、Batam 和南澳大利亚的项目层资本开支计划与资金来源
        - 说明增长能否在不采用惩罚性结构的情况下融资
        - 按站点列出的资金用途与来源计划
      - - 客户集中度和续约
        - 头部客户占比、续约画像，以及按同期群拆分的销售管线转化
        - 检验合作伙伴标识能否转成持久经常性价值
        - 收入集中度明细和同期群留存材料
      - - 许可和电网里程碑
        - 电力、输电和本地审批的时间线、依赖项和应急方案
        - 执行滑坡是估值压缩最快路径之一
        - 监管事项追踪表和公用事业方往来函件
    notes: 这些问题是从跟踪观察推进到可承销投资观点所需的最低资料包。
