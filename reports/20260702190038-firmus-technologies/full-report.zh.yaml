        - HTX 和 MPA 均为具名的新加坡公共机构，但两个参考仍处于研究或课题阶段
        - 能证明政府参与有效，但还不能证明重复采购或规模化实时收入
      - - 主权 / 受监管算力用户
        - 政府、受监管行业和对本地性敏感的工作负载
        - 本国托管、低延迟部署和数据主权匹配
