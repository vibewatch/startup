      - number: '8.3'
        title: 可比框架和情景区间
        blocks:
          - type: paragraph
            body: >-
              可比分析在这里主要是纪律工具。AirTrunk 说明，APAC 数据中心平台可以支撑很高的私募估值，但前提是已承诺容量、未来土地储备和庞大融资平台都能看见。CoreWeave 更鲜明地展示了 AI
              原生基础设施的上行空间：数十亿美元收入和数百亿美元剩余履约义务，可以与十亿美元级亏损同时存在。Equinix、Digital Realty、NEXTDC、GDS 和 Keppel DC REIT
              等成熟上市平台给出另一条经验：公开市场奖励透明度、持续披露和融资韧性。在这个背景下，Firmus
              的估值不算荒唐，但确实偏早。因此，基准情景把当前轮次视为大致合理，前提是商业化快速跟上且资本持续可得。乐观情景要求多件事同时顺利，尤其是 Southgate 执行和 Batam
              转化。悲观情景不需要需求消失；只要融资、许可或已披露变现低于预期，且发生在 Firmus 达到公开或准公开可比公司已展示的规模和透明度之前，就足够了。
