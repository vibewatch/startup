      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Tim Rosenfield 和 Oliver Curtis 是最常露面的两位高管，材料反复称二人为联合 CEO；第三方报道还把 Jonathan Levee
              列为联合创始人。SmartCompany 和 Data Center Dynamics 都把成立年份写作 2019，SmartCompany 还补充了公司早期围绕比特币挖矿散热起步、后来转向 AI
              基础设施的背景。领导层在运营和技术领域释放的信号很强，但传统治理披露较弱。投资者沟通材料确认了悉尼注册办公室和股东文件流程，SmartCompany 报道称 Ellerston 投资总监 David Leslie
              将在 2025 年融资后加入董事会。除此之外，董事会构成、投票控制权和保护性权利并未公开到足以绘制完整治理图的程度。尽调中还有一个声誉层面的细节：SmartCompany 提到 Curtis 曾在 2016
              年被判内幕交易罪，时间早于 Firmus 成立多年。这并不否定基础设施论点，但意味着治理尽调不能停留在标准的创始人—市场匹配问题上。
