      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图很碎片化。AI 原生初创公司和模型开发者往往先像紧迫用户，再像纪律严明的付款方：他们要的是稀缺 GPU 访问、低摩擦部署，以及愿意比超大规模云厂商动作更快的供应商。企业 AI
              团队是大算力消费者，但通常通过中央云或 IT 预算采购，这意味着像 Firmus 这样的园区运营商，往往要通过 neocloud
              或基础设施伙伴间接触达。政府、公共研究机构和关键基础设施组织又是另一类买方，因为主权、司法辖区和可审计性可以和原始吞吐量同样重要。


              超大规模云厂商扮演着不寻常的双重角色。它们通过吸收巨额
              capex、教育客户把算力当作战略投入，验证了这个品类；但它们也会压缩可触达市场，因为它们预租容量、自建园区，并推出自有主权版本。区域运营商由此留下一个现实的早期采用走廊：主权项目、需要本地控制的受监管买方、服务
              AI 原生需求的 neocloud 或基础设施伙伴，以及那些更看重 APAC 已批准容量、而不是超大规模云区域最低单位成本的工作负载。Firmus
              符合这条走廊，但前提是它能把基础设施设计优势转化为合同，而不只是叙事上的相邻性。
