        - 面向训练和推理工作负载的高密度 AI 园区、预留容量、液冷与编排
        - 通用企业托管空壳容量和非 AI 算力机房
        - 主权项目、neocloud 厂商、模型开发商、受监管买方
        - Firmus 宣称设计和电网行为有差异化，这是其核心实体市场
      - - Neocloud / GPUaaS
        - 面向 AI 训练、尤其推理优化的云端 GPU 容量
        - 大宗化 IaaS 和无关开发者工具
        - AI 原生初创、模型开发商、企业 AI 团队
        - 重要相邻收入层：比直接销售企业园区更快变现稀缺容量
      - - 主权算力 / 主权云
        - 绑定司法辖区的 AI 与云基础设施，本地控制数据、运营和治理
        - 缺少主权保障的跨境标准云
        - 政府、公共研究、关键基础设施、受监管行业
        - Firmus 明确主打本土、政策对齐基础设施，战略契合度高
      - - 超大规模云和传统托管
        - 主要云和基础设施既有厂商已租用或自建的容量
        - 基础机房壳无法提供的专用 AI 工厂增值
        - 超大规模云厂商、大型业主、企业云买家
        - 更像主要替代品和对标对象，不是 Firmus 干净的可服务市场
      - - 企业本地部署 / 现状
        - 既有 IT 资产内的自建集群和渐进扩容
        - 区域共享基础设施和外部主权容量
        - 企业 IT、研究团队、业务线预算
        - 主要是买方无法证明迁移到外部 AI 工厂容量合理时的慢采用备选
    notes: 边界逻辑把实体 AI 工厂容量、云变现层和主权项目，同宽泛托管或半导体池区分开，避免章节夸大可服务支出。
