    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与地理足迹
        blocks:
          - type: paragraph
            body: >-
              Firmus 应被理解为 AI 基础设施运营商，而不是普通托管机房提供商。从官网首页、基础设施页面到 AI 云材料，公司都反复把自己描述成 AI
              工厂的垂直整合开发商和运营商，设计范围从芯片延伸到电网。它的运营主张把模块化高密度设施、液冷、编排软件，以及面向 AI 训练、推理和 HPC
              工作负载的云服务放在一起。地理位置对这个论点很关键。官方材料把当前云运营和开发者访问放在新加坡，同时把公司注册和资本市场活动锚定在悉尼，把旗舰主权建设项目锚定在塔斯马尼亚。若把它读作一家创立于澳大利亚、总部位于新加坡的区域平台，这种组合是自洽的；但公开描述在不同来源之间仍有差异，因此报告应保留这种细微差别，而不是强行贴上单一司法辖区标签。塔斯马尼亚是主权算力叙事的核心，因为可再生电力、凉爽气候和政府支持在那里能够对齐；新加坡则是在线服务、参考工作负载和受监管区域需求的证明点。
