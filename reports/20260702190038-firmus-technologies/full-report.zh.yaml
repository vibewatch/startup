  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              Firmus 的风险不主要在 AI 算力需求是否存在，而在公司能否足够快地把需求转成获批、通电、可融资的容量。今天最强的公开证据很窄：St Leonards 有 104 MW 零售服务协议并已开工，Bell
              Bay 有详细 FAQ 和输电叙事，澳联邦也已明确对高耗能 AI 基础设施的期待。最弱的证据，恰好落在投资人需要形成承保信心的地方：St Leonards
              之外的最终审批、客户或包销披露，以及已签署的长期塔斯马尼亚能源安排。这个组合使风险排序很清楚。第一层是电力、审批和社会许可，因为它们可以直接让站点无法上线。第二层是对 Aurora、Hydro、NVIDIA 和
              VAST 的伙伴与平台依赖，因为 Firmus 的产品和市场路径仍与外部交易对手高度绑定。第三层是融资、治理和利用率不透明，因为公开记录对需求质量的披露仍远薄于项目野心。
