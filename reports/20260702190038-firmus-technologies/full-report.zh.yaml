  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Firmus 位于几个相邻市场的交叉处，因此宽泛的“AI 基础设施”标签不足以支撑估值工作。真正纳入的核心市场，是高密度 AI 工厂容量：为 AI 训练和推理优化的专用园区与云端交付的 GPU
              容量，以及要求工作负载留在本辖区内的主权算力项目。这个边界包括实体园区、液冷和编排能力，以及与底层容量紧密绑定的 AI 云或 GPUaaS 层。它不包括普通企业托管机房、常规 SaaS
              支出和商用半导体收入，因为这些资金池不能直接衡量 Firmus 正在试图销售的东西。


              最重要的替代品不是小型初创公司，而是已经控制稀缺土地、公用事业接入和客户采购路径的既有超大规模云厂商和传统托管机房提供商。超大规模云厂商可以租赁、自建，或推出自有服务的主权版本；经典托管机房仍是许多不需要 AI
              工厂级密度工作负载的默认外壳。因此，实际分析差异不在语义，而在架构：在 AI
              工厂里，算力密度、液冷、编排和电网行为都是产品的一部分，而不是事后补丁。这个差异很重要，因为只有当买方足够重视这些特征、愿意离开现状时，Firmus 才能从更大市场扩张中受益。
