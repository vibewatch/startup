      - number: '3.5'
        title: 定价、锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              竞争经济性异常不均衡。公开价格发现最清楚的是云式产品——Lambda 发布标价，Google 记录 Spot 和承诺机制，AWS 发布性能和相对成本主张——而大多数 neocloud
              承诺交易，以及几乎所有主权园区或机房业主报价，都仍基于报价。这种不透明更有利于拥有成熟采购团队的既有玩家，而不是新运营商。锁定也会非对称累积：超大规模云厂商受益于账单、安全和数据重力关系；Equinix 和
              Digital Realty 受益于生态；AirTrunk 受益于资本和客户覆盖；CoreWeave 展示了多年照付不议 合同如何把 AI 云嵌进去。因此，Firmus 有真实但狭窄的护城河。当买方需要 APAC
              物理控制、定制能源或冷却设计，以及本地执行时，护城河最强；当买方主要想要 GPU 供给、快速签约和熟悉的采购路径时，护城河最弱。被替代的风险不是假设——它已经嵌在市场内竞争对手的资本密度和分销优势里。
