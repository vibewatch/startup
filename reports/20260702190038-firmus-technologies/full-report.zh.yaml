  - id: TV005
    title: 论点破裂与退出触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何传导到投资论点
      - 行动含义
    rows:
      - - Southgate 交付延误
        - 商业交付或送电错过下一个外部可见里程碑窗口
        - 推迟货币化证明，并抬高融资需求
        - 暂停，或扩大估值折扣
      - - 商业指标继续不披露
        - 下一轮融资步骤前，仍没有可信的 ARR、利用率或客户集中度披露
        - 当前估值仍靠叙事支撑，无法扎实承销
        - 不追加新资金
      - - 优先资本出现
        - 优先股、担保或项目层结构拿走大量经济利益或控制权
        - 规模尚未证实，普通股上行已先被抽走
        - 从零重做股权结构承销
      - - Batam 承诺弱化
        - 交易对手、量或承购经济性未能转成可见合同
        - 拿掉牛市情景的主要规模驱动
        - 切换到基准或熊市情景
      - - 监管或社区摩擦上升
        - 政策匹配、电力接入或本地社会许可明显恶化
        - 拉长收入兑现周期，抬高执行风险
        - 提高折现率，下调公允价值
      - - 在位者更快完成主权本地化
        - 超大云厂商或成熟业主凭更强资产负债表，提供类似的区域内 AI 容量
        - 压缩差异化和定价权
        - 下调战略溢价假设
    notes: 这几个变量最直接决定 Firmus 是有意思的战略资产，还是在当前估值下缺乏吸引力的普通股入口。
