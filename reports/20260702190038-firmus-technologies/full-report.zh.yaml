  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开估值 / 规模信号
      - 重要性
      - Firmus 参考价值
      - 局限
    rows:
      - - AirTrunk
        - A$24b 收购；>800MW 已承诺；>1GW 未来增长；A$16b 再融资
        - APAC 私有数据中心平台稀缺价值的最佳锚点
        - 说明可见规模、客户承诺和融资深度能撑起什么估值
        - 阶段远更成熟，且已获机构化融资
      - - CoreWeave
        - $5.1b 收入；$60.7b RPO；$1.2b 净亏损
        - 说明 AI 原生基础设施可以爆发式放大，同时仍极度吃资产负债表
        - 可类比 AI 基础设施的上行空间和资金胃口
        - 披露强得多，客户画像也不同
      - - Equinix
        - 280 个数据中心；10,500+ 客户；$9.2b 收入
        - 透明度、可复制性和全球平台价值的公开标尺
        - 说明公开市场投资者期待的披露门槛
        - 成熟互联与托管平台，不是从零建设 AI 工厂的故事
      - - Digital Realty
        - AI 专用主权方案，加上公开季报和 SEC 报告节奏
        - 说明在位者已经在销售可支撑 AI、受司法辖区约束的基础设施
        - 可参考竞争定位和买方替代方案
        - 成熟 REIT 经济性不同于 Firmus 的建设与爬坡曲线
      - - NEXTDC
        - A$427.2m 收入；A$2.2b 资本计划；A$2.9b 债务平台
        - 区域公开可比：有可见融资支撑面向 AI 的扩张
        - 更接近 Firmus 的 APAC 公开市场参照，可看资本开支和融资观感
        - 仍是更成熟的托管运营商
      - - GDS / Keppel DC REIT
        - US$1.63b 收入，或 ~$6.2b AUM，且有公开报告
        - 说明 APAC 上市平台价值通常在报告规模可见后显现
        - 可作为亚洲市场透明度和融资能力的晴雨表
        - 地域、结构和客户组合不同
    notes: 本表有意混合私有交易、上市运营公司和上市平台载体，因为 Firmus 介于 neocloud 增长故事和数据中心基础设施建设之间。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the main transaction and public-platform reference points that matter for Firmus valuation rather
        than every global data-centre or neocloud comp.
