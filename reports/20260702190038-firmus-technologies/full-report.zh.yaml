      - number: '7.3'
        title: 运营、交付、用水和安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Firmus 要投资人同时相信几件难事：高密度液冷 AI 工厂能在压缩时间表内爬坡，干冷假设经得起塔斯马尼亚真实条件，站点级运营复杂度能在 24 小时设施里管住。公开证据有利有弊。Firmus
              给出过具体用水数字，并称 Bell Bay 每年大约只有 10
              个炎热日需要冷却水；但同一轮公共讨论也说明，风险并没有因此消失——居民在质疑假设，独立研究者也指出，干冷可能用额外耗电换取节水。安全带来另一种运营负担。Cyber.gov
              指引把数据完整性、加密、来源和生命周期控制视为 AI 系统可靠性的核心；商业模式一旦依赖托管主权或企业 AI 工作负载，这些期待就更重要。AEMO、IEA、JLL、WEF 和 Deloitte
              的全球研究进一步说明，建设周期、电网瓶颈和电气设备短缺已经是结构性约束，不再是一次性问题。
