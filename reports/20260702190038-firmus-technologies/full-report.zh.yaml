      - number: '2.5'
        title: 尽调缺口与定义敏感的矛盾
        blocks:
          - type: paragraph
            body: >-
              最大的未解问题不是品类是否存在，而是 Firmus 能否捕获足够份额。公开证据支持方向——电力受限的 AI 需求、APAC 外溢、主权算力兴趣，以及政策对高效建设的偏好——但没有披露自下而上测算 SOM
              所需的商业细节。客户组合、合同期限、在线利用率、实际定价和扩张权仍是私有信息。缺少这些输入，市场分析只能界定机会边界，不能证明份额。


              市场也没有一个被普遍接受的定义。有些来源衡量用电量或 MW 需求，有些关注云服务收入，有些看主权 IaaS，还有些看累计基础设施
              capex。这不是本章的缺陷，而是市场真实的分析状态。正确的尽调反应，是保留彼此矛盾的视角，要求公司提供内部管线和利用率数据，并避免把宽泛的全球 AI 基础设施大标题当成 Firmus 可触达收入池。
            claimRefs:
              - CM022
              - CM037
              - CM039
              - CM040
      - number: '2.6'
        title: 图表
        blocks:
