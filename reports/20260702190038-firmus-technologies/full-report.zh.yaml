      - number: '1.4'
        title: 披露缺口、身份摩擦，以及后续章节需要压测的事项
        blocks:
          - type: paragraph
            body: >-
              概览章节给下游尽调留下了几处重要缺口。公开材料没有披露收入、ARR、客户数量、利用率、毛利率、烧钱速度或债务结构；甚至员工规模也只能从当前招聘广度间接推断。总部措辞和未来资本市场计划也存在一些报道不一致，这进一步说明，投资者叙事必须和硬披露分开处理。最尖锐的身份问题并非财务，而是数字入口：用户提供的
              firmus.ai 域名目前指向一个无关的施工文档 AI 产品，该产品现已归入 Bluebeam；AI 基础设施公司的活跃公开阵地则在 firmus.co 及相关 SMC
              资产上。这种错配会给交易对手带来本可避免的混淆，也凸显了本报告为何必须做来源验证。最后，ABC 的报道有价值地注入了对塔斯马尼亚电力充足性和长期就业密度的怀疑。公司的能源和用水政策，方向上符合澳大利亚政府对
              2026 年 AI 基础设施开发商的预期；但这些政策也已经形成一套可衡量的标准，执行表现将据此被检验。
