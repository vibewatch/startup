        - 上行空间大的客群，但现有证据多是面向未来的需求语言，而不是已披露的活跃账户
      - - 企业 AI 团队与 ISV
        - 企业平台团队、软件厂商和内部模型构建者
        - 从原型到生产的算力、区域部署和多云可移植性
        - Lepton 与 Batam 材料提到企业和 ISV 用户；未找到具名 Fortune 500 或 ISV 生产参考
        - 商业 TAM 很宽，但企业证据质量明显弱于研究或政府证据
      - - 研究机构
