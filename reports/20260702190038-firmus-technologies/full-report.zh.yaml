            body: >-
              AWS、Google Cloud 和 Azure 划定了外层竞争边界，因为它们已经提供集群级 GPU 基础设施、广泛区域覆盖，以及大多数买方默认信任的采购关系。AWS 推出带 UltraClusters
              和液冷效率主张的 H100、H200 P5 系列；Google 把加速器优化的 A-series 机器、全球区域和基于承诺的定价结合起来；Azure 将 ND H100 和 A100
              系列同广泛地理版图和明确主权选项配套。Microsoft 自己的 AI 工厂叙事也很重要，因为它表明最大的云厂商不再只提供通用算力，而是在用巨额 capex 建设专用 AI 园区。这意味着 Firmus
              的可触达市场只剩那些足够看重物理主权、本地能源姿态或定制部署、愿意离开默认选项的工作负载。没有这块楔子，超大规模云厂商捆绑的相邻价值太多，难以撼动。
