      - number: '8.2'
        title: 正反论点：市场、产品、客户和监管
        blocks:
          - type: paragraph
            body: >-
              正向逻辑不难讲清。Firmus 所在市场里，主权 AI 基础设施、受电力约束的容量和高密度冷却正在同时增值。官方页面显示，公司没有停在一个塔斯马尼亚园区：它与 NVIDIA 拥有 360 MW Batam
              合作，声称最多 170,000 个加速器，引用收入分成和信用支持结构，并称已承诺包销 6 年可达 US$25 billion 至 US$30 billion。南澳大利亚州能源协议又叠加一层规模，把 600 MW
              供电与 1.2 GW 可再生能源、电池储能和 2.7 GW 规划容量绑定。参与 DGX Cloud Lepton 以及与 AI Singapore
              合作，强化了产品和伙伴证据。反向逻辑同样清楚。行业研究称，电力、资本结构和企业变现能力会把赢家和 GPU
              经纪人分开。澳大利亚政策也在主权、能源、技能和社会许可上加入真实义务。独立报道还暗示，本地就业承诺可能没有宣传口径那么持久。业务方向可能是对的，但在当前价格下，对普通股而言仍可能过于资本密集。
