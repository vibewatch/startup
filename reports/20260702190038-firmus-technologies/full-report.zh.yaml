  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 参考公允价值（A$bn）
      - 未来 12–24 个月必须成立的条件
      - 概率信号
    rows:
      - - 牛市情景
        - Southgate 按期爬坡，Batam 已承诺承购转成合约，主权需求仍然稀缺，后续资本结构足够标准化，普通股也能分享上行。
        - 2.4–3.0
        - 商业交付里程碑兑现，交易对手质量高，也没有惩罚性优先资本出现。
        - 需要多项绿灯同时亮起
      - - 基准情景
        - Southgate 证明商业化可行，Batam 上行仍有一部分未被证实，还需要更多资本，但条款可控。
        - 1.5–2.0
        - 下一次重大融资前，运营证明先到位，披露也明显改善。
        - 按现有证据最站得住脚
      - - 熊市情景
        - 商业化落后，已披露经济性仍然偏薄，资本以成本更高或级别更优先的结构进入。
        - 0.8–1.2
        - 时间线滑坡，融资利差走阔，或客户证据仍以叙事为主。
        - 无需需求崩塌也说得通
      - - 融资压力情景
        - 需求存在，但项目债、优先股或伙伴经济性吸收的上行，超过普通股投资者预期。
        - 0.6–0.9
        - 轮次条款或项目层文件显示，普通股之上存在严重价值渗漏。
        - 最需要盯住的悬念
    notes: 区间是情景锚点，不是精确目标；驱动因素是已披露证明、资本结构风险和里程碑交付，而非对未披露收入的点估计。
    claimRefs:
