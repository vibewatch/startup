            body: >-
              Firmus 看起来像直接企业销售和市场辅助分销的混合体。产品页面反复强调询价式采购、预留、混合部署、可观测性和运营支持。这指向高接触销售，而不是大规模自助转化。AI Singapore 以及 MPA
              相关的新加坡材料也强化了这个判断：公开证明点是参考工作负载、主权或公共部门相关性，以及高性能技术交付，而不是广泛的客户标识 数量或交易式网页注册。NVIDIA 的 DGX Cloud Lepton
              通过提供共同市场和区域容量发现层，改变了漏斗顶部，但没有让底层服务变成低接触。预留集群、公共部门买方和 24/7
              支持仍意味着账户级资格评估和实施工作。公司没有发布任何常规效率指标——CAC、回收期、管线转化率、NRR 或支持人员数——因此最好的公开代理指标只能是间接的。新加坡在线工作负载、进入 NVIDIA
              生态以及以参考为主的伙伴渠道，都说明买方有兴趣；它们还不能证明变现有效率。投资者应把销售效率视为未回答的执行问题，而不是隐藏强项。
