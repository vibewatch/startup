      - number: '2.4'
        title: 增长驱动、约束与绿色准入溢价
        blocks:
          - type: paragraph
            body: >-
              增长逻辑很强。AI 落地、云采用和数字化正在扩大 APAC
              整个品类；以推理为主的生产工作负载正在成为主导设计点；主权云需求在希望获得更多数字独立性的地区增长最快。这些驱动因素有利于能快速把新容量推向市场、又能让公用事业公司和监管机构接受的运营商。因此，从市场方向看，Firmus
              的区域论点说得通。


              问题在于，采用受制于物理瓶颈，而不是兴趣不足。电力可得性是第一道筛选，报道中的电网等待时间从一些新兴市场约两年，到核心市场超过八年不等。约 100 kW 的 AI
              机架迫使液冷和更重的机械设计成为必要条件；变压器、涡轮机、先进芯片和相关组件仍然紧缺。与此同时，租金上涨、空置率低，买方在锁定定制容量前仍需要对利用率有信心。因此，市场所谓的绿色溢价不应被理解成普遍涨价。新加坡和澳大利亚都明确把效率、电网行为、用水和社区匹配纳入审批或优先排序。对
              Firmus 这类公司而言，溢价更可能体现为排队准入和政策兼容性，而不是立刻获得定价权；这一区别对估值很关键。
