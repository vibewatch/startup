              - CI045
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义方案
        blocks:
          - type: paragraph
            body: >-
              Firmus 没有把自己包装成单一的一体化产品，而是在销售一个分层 AI 基础设施工作流：先提供 GPU 算力访问，再叠加把团队推向生产所需的存储、编排和应用入口。实际用户旅程从按需或预留 GPU
              访问开始，取决于工作负载是突发型还是承诺型；随后接上检查点和数据集存储，最后叠加托管运营、开发者工具包和推理端点。这个结构很重要，因为它让 Firmus 更像垂直整合的 AI 工厂运营商，而不是普通 GPU
              转售商。公司也明确表示，技术栈面向多类买方——从开发者和企业平台团队，到教育和政府用户——因此这个工作流既要吸收实验，也要承接更受控的生产使用。
