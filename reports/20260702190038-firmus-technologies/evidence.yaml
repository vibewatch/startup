      and GDS.
    whyItMatters: The quote-based nature of incumbent campus supply makes pricing comparison noisier than the capability comparison.
    diligencePath: >-
      Collect three live market quotes or broker indications for comparable MW commitments in Singapore, Sydney, and
      Tasmania.
