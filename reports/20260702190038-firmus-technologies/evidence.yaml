evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Full board roster, board committee structure, major investor rights, and cap-table ownership percentages.
    whyItMatters: >-
      Control rights and governance quality affect downside protection, future financing leverage, and founder-risk
      assessment.
    diligencePath: >-
      Request the current cap table, shareholder agreement summary, board materials, and any side-letter rights from
      management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-disclosure
    missingEvidence: A current employee count by function and geography.
    whyItMatters: >-
      Hiring breadth suggests scale, but without actual headcount it is hard to judge execution capacity, opex burden,
      or post-raise maturity.
    diligencePath: Request an org chart, headcount roll-forward, and recruiting plan tied to Southgate and Singapore operations.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Revenue, customer count, utilization, top accounts, contract duration, and gross-margin disclosure.
    whyItMatters: >-
      The company has strong infrastructure ambitions, but valuation quality cannot be judged without evidence of
      monetization and customer durability.
    diligencePath: >-
      Request monthly recurring revenue, booked/consumed GPU capacity, top-customer concentration, and contract
      summaries.
    relatedQuestionRefs:
      - QO014
      - QO025
  - type: conflicting-data
    severity: minor
    topic: headquarters-label
    missingEvidence: One consistent description of the legal parent, operating headquarters, and major subsidiaries.
    whyItMatters: >-
      Different public descriptions are not fatal, but can create diligence friction for jurisdiction, regulatory, and
      tax analysis.
    diligencePath: >-
      Request legal-entity structure and a simple geographic map covering Singapore, Sydney, Tasmania, and any other
      operating hubs.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: brand-confusion
    missingEvidence: >-
      Management confirmation on whether firmus.ai remains associated with the company or should be treated as an
      unrelated third-party brand.
    whyItMatters: Counterparty confusion can affect vendor diligence, customer trust, and source verification in public materials.
    diligencePath: >-
      Confirm the official brand and domain portfolio with investor relations and update website/press materials if
      necessary.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: green-premium-pricing
    missingEvidence: >-
      Comparable pricing or win-loss data showing whether efficient AI capacity commands higher realized price or mainly
      wins access and approvals.
    whyItMatters: >-
      The chapter finds strong evidence for a green-access premium but weak evidence for direct pricing power, which
      changes valuation framing materially.
    diligencePath: >-
      Request bid-level comparisons, quote conversion data, or contract pricing differentials between sustainable
      AI-factory capacity and standard alternatives in APAC.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: firmus-som-gap
    missingEvidence: Customer mix, contract duration, utilization, effective pricing, and live workload mix for Firmus deployments.
    whyItMatters: >-
      Without those private commercial inputs the report can frame market opportunity but cannot defend a bottoms-up SOM
      or valuation-quality share estimate.
    diligencePath: >-
      Ask management for cohort-level pipeline and live-contract data broken out by buyer type, geography, workload, and
      utilization ramp.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-definition-drift
    missingEvidence: >-
      A normalized taxonomy separating electricity demand, physical MW buildout, cloud-service revenue, sovereign IaaS
      spending, and cumulative infrastructure capex.
    whyItMatters: >-
      Without normalized definitions, broad AI-infrastructure headlines are easy to misuse as if they described one
      additive TAM for Firmus.
    diligencePath: >-
      Rebuild the sizing stack in the model using one unit per layer and require each external source to state scope
      before inclusion.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized price cards, discount ladders, minimum commits, and term lengths for sovereign-campus and committed
      neocloud deals.
    whyItMatters: >-
      Public list pricing mostly covers cloud-style offers, not the bespoke campus contracts where Firmus is trying to
      win.
    diligencePath: >-
      Request anonymized customer proposals from Firmus plus at least one competitive quote from a hyperscaler,
      landlord, and neocloud.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-overlap
    missingEvidence: >-
      Named overlapping customers, workloads, or procurement processes showing where Firmus actually wins against
      AirTrunk, NEXTDC, hyperscalers, or neoclouds.
    whyItMatters: >-
      Without customer-level overlap, the chapter can bound substitutes but cannot prove where Firmus is winning
      competitively.
    diligencePath: >-
      Ask Firmus for three recent competitive-deal narratives with competitor names, decision criteria, and signed
      scope.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: gpu-allocation
    missingEvidence: >-
      Allocation letters, reservation agreements, or hardware-commit schedules that show Firmus's secured GPU access
      relative to hyperscaler and neocloud rivals.
    whyItMatters: >-
      Supply access can dominate competitive outcomes in AI infrastructure; without it, design advantages may not
      translate into delivered capacity.
    diligencePath: >-
      Request firm hardware-allocation documents from NVIDIA or cloud partners and reconcile them against project
      timelines and customer commitments.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: operating-benchmarks
    missingEvidence: Firmus utilization, uptime, realized gross margin, and backlog metrics on the same basis as public rivals.
    whyItMatters: >-
      The public benchmark set is increasingly rich; without Firmus operating metrics, moat-durability judgment stays
      directional rather than underwritten.
    diligencePath: >-
      Request a cohort of site-level and cloud-level operating KPIs and compare them against the public metrics cited
      for NEXTDC, Equinix, CoreWeave, and Lambda.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: apac-campus-pricing
    missingEvidence: >-
