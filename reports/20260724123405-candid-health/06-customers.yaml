  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Retention cohorts
    missingEvidence: No public GRR, logo churn, contract length, renewal cadence, or time-bucketed retention cohort was found.
    whyItMatters: The 180% NDR signal could be driven by a small number of expansions and does not by itself prove broad durability.
    diligencePath: Request annual ARR cohorts with beginning ARR, upsell, contraction, churn, reactivation, customer count,
      and segment tags.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: Customer concentration
    missingEvidence: Public materials do not disclose top-customer revenue share, largest customer identity, or segment concentration.
    whyItMatters: A 200-plus customer count can still hide high ARR concentration in a few provider groups, MSOs, or digital-health
      platforms.
    diligencePath: Request top-10 and top-20 customer ARR, claims volume, gross margin, and renewal dates under NDA.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: Named customer proof table
    missingEvidence: The table covers verified public names, but Candid reports more than 200 organizations and likely has
      many undisclosed customers.
    whyItMatters: Public reference quality may overrepresent happy or marquee accounts and underrepresent churned or stalled
      implementations.
    diligencePath: Ask management for a full anonymized customer roster, reference-call sampling frame, and churned-customer
      list.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: Bridge PDF text layer
    missingEvidence: The Bridge PDF fetched successfully but exposed no extractable text in the local fetch output.
    whyItMatters: Search and HTML evidence support Bridge outcomes, but detailed PDF statements should be manually reviewed
      before quoting exact figures.
    diligencePath: Obtain the PDF directly from Candid or request the underlying Bridge reference materials.
    relatedQuestionRefs:
    - QU011
    - QU027
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: NDR methodology
    missingEvidence: The public NDR figure does not include cohort definition, gross churn, expansion, contraction, or auditor
      support.
    whyItMatters: Unaudited private-company NDR can overstate durable retention if expansions from a few accounts offset churn
      elsewhere.
    diligencePath: Tie NDR to billing exports, contracts, revenue-recognition policy, and customer-level ARR bridges.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
    - TU005
