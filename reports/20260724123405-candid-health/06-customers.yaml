company:
  name: Candid Health
chapter:
  number: 6
  title: Customers
  summary: 'Candid has credible production-scale customer evidence: 200+ healthcare organizations, about $7 billion of annual
    claim volume, 180% reported NDR, investor calls with nearly 40 customers, and named public references including Bridge,
    Nourish, Tia, Talkiatry, Ophelia, and Elation. The main diligence caveat is that detailed references are few relative
    to the stated base, retention/cohort data are private, and concentration plus fast-growing digital-health customer risk
    remain opaque.'
sections:
- id: s601
  title: 'Customer segmentation: Candid sells into complex provider revenue workflows, not generic SMB billing'
  body: 'Candid’s public customer base is best understood by workflow complexity rather than by a simple logo count. The company
    says it is trusted by more than 200 healthcare organizations and handles about $7 billion of annual claim volume, but
    the public record only partially decomposes that base. The strongest verified segments are digital health providers such
    as Bridge, Nourish, and Tia; MSOs and nationwide provider groups named by the Elation partner page; medical groups and
    billing-services customers served directly by Candid; and an EHR-adjacent channel through Elation. Buyer, user, and payer
    are not identical: a provider or MSO typically buys the platform, billing and finance teams use it, and commercial or
    government payers ultimately determine cash collection. Geography is U.S.-centric, vertical breadth spans dozens of specialties,
    and disclosed size ranges from fast-growing telehealth businesses to 10-to-1,000-plus physician groups. What is not public
    is revenue by segment, logo churn by vertical, or top-customer share.'
