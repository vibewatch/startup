- id: s604
  title: Expansion upside is paired with concentration, channel, and customer-quality risks
  body: 'Candid’s expansion loop is plausible because RCM is mission-critical: once a customer routes claims, eligibility
    data, payer rules, and reporting through the platform, the switching cost can rise quickly. The same fact creates concentration
    and operational-risk questions. A few large provider groups, MSOs, or high-growth digital-health customers could drive
    a disproportionate share of NDR; the public 200-plus customer count does not reveal the top-10 customer share. Digital-health
    customers can also be volatile, and adverse reporting about Tia underscores that Candid’s customer base may include rapidly
    scaling care models with their own clinical, billing, or patient-experience risks. Sector evidence from Change Healthcare
    shows how deeply RCM infrastructure disruptions can affect claims and reimbursements, making Candid’s reliability and
    vendor-governance posture a customer-diligence item. The chapter therefore reads customer traction as a strength, but
    customer concentration, public-reference scarcity, and unaudited NDR as material diligence gaps.'
