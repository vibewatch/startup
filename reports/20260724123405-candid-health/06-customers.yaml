- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Land-and-expand inside existing provider organizations
    - A few large provider groups or MSOs could drive a disproportionate share of 180% NDR
    - High NDR may mask concentration or one-time expansion from a small base
    - Request top-10 customer revenue and expansion by cohort
  - - Digital-health hypergrowth customers
    - Fast-growing digital-health customers can scale claims quickly but may face funding, quality, or patient-experience
      volatility
    - Customer churn or volume contraction could hit usage-based or service revenue
    - Map revenue by customer funding profile and customer clinical/regulatory risk
  - - Elation / EHR integration channel
    - Native integration can accelerate adoption but may concentrate lead flow or implementation patterns around one EHR ecosystem
    - Partner economics or roadmap changes could affect acquisition and deployment
    - Request channel-sourced ARR, attach rates, and revenue-share obligations
  - - Operational outsourcing depth
    - Candid becomes embedded in cash collection and reimbursement workflows
    - High switching costs support retention, but outages or implementation failures become mission-critical
    - Review SLAs, incident history, support staffing, and business-continuity controls
  - - Named public references remain sparse
    - Few detailed public case studies relative to 200+ reported customers
    - Reference opacity weakens underwriting of satisfaction and expansion quality
    - Run direct calls across won, lost, churned, and stalled customers
  - - Unaudited private-company metrics
    - NDR, customer count, and ARR growth are company-reported in funding coverage
    - Metric definitions could overstate durability if gross churn is hidden by expansion
    - Request board pack, billing system exports, and revenue-recognition policy
  notes: The risk table treats strong reported NDR as a positive signal and a diligence target because public sources do not
    disclose concentration mechanics.
