  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - geography / vertical / size
  - channel / use case
  - revenue or strategic value
  - gap
  rows:
  - - Digital health organizations
    - Provider company buys; RCM and finance teams use; payer collections fund the value
    - U.S.; virtual-first and multi-state care models; fast-growing SMB-to-enterprise
    - Direct Candid platform or case-study-led sale for automated billing and claim operations
    - High strategic value because rapid visit and claim growth stresses billing infrastructure
    - Revenue band and churn by digital-health cohort are not public
  - - MSOs and nationwide provider groups
    - MSO or provider group buys; central billing teams use; physician practices and payers are economic endpoints
    - U.S.; multi-location practices and groups from 10 to 1,000+ physicians per Elation
    - Elation channel plus direct enterprise RCM automation
    - Potentially large deployments across multiple TINs, contracts, locations, and specialties
    - No disclosed concentration, contract length, or top-account economics
  - - Named telehealth infrastructure customer
    - Bridge buys and uses RCM infrastructure for telehealth insurance billing; partners depend on payout performance
    - U.S. telehealth infrastructure; 20x claim-volume growth in 2025
    - Direct customer case study; claims submission, reporting, partner performance tracking
    - Strong proof of deployment under hypergrowth and tight payout requirements
    - Case evidence is Candid-published; PDF text extraction was limited
  - - Named nutrition care provider
    - Nourish buys and uses RCM automation; patients and insurers are workflow participants
    - U.S. telehealth nutrition; insurance-covered dietitian care
    - Direct customer case study; eligibility checks, denials prevention, data visibility
    - Shows Candid in a care-delivery model with complex coverage verification
    - Outcome magnitudes beyond qualitative efficiency and access are limited publicly
  - - Named women’s health provider
    - Tia buys and uses billing automation; patients, insurers, and clinic teams are workflow participants
    - U.S. women’s health clinics and digital health; multiple markets
    - Direct customer case study; automated billing and predictable payments
    - Shows Candid supporting patient-facing billing workflows in a complex specialty model
    - Adverse patient-experience coverage at Tia creates customer-quality diligence questions
  - - EHR / partner ecosystem
    - Elation practices are buyer/user surface; Candid is preferred integration partner; payers adjudicate claims
    - Elation customer base; multi-location practices and provider groups
    - Partner marketplace / native integration channel
    - Channel can lower deployment friction and reach groups already using Elation
    - Partner dependence, attach rate, and revenue share are not disclosed
  notes: Segmentation is public-evidence based; no source disclosed Candid revenue by segment or customer size band.
