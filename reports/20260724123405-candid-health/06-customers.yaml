- id: s602
  title: Named customer proof is real but still curated by Candid and partners
  body: 'The best named proof comes from Bridge, Nourish, Tia, and the Elation partner page. Bridge is the most quantitatively
    interesting because its case page describes 20x claim-volume growth in 2025 and the retained search evidence points to
    a more-than-half reduction in net denials. Nourish and Tia provide richer workflow proof: both were scaling care models
    where claim visibility, eligibility, billing rules, and patient payment design mattered operationally. Elation adds partner-channel
    proof and names Talkiatry, Tia, Nourish, and Ophelia, with a CEO testimonial from Talkiatry. That evidence is materially
    stronger than anonymous logo wallpaper, but it is still mostly Candid- or partner-published. It does not establish an
    exhaustive customer list, a random reference sample, or live customer satisfaction distribution. Sixth Street’s nearly
    40 customer calls are therefore valuable corroboration, yet selection bias remains because investors and companies rarely
    publish negative reference calls.'
