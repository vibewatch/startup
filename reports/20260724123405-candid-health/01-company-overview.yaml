  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Leadership and founder table lacks public board and control-rights disclosure
    missingEvidence: Current board roster, observer seats, investor consent rights, committees, founder voting control, and
      succession materials.
    whyItMatters: Company Overview must anchor governance and key-person risk for later chapters, but public sources only
      identify founders and financing stakeholders.
    diligencePath: Request the latest cap table, investor rights agreement, board deck, board minutes index, and management
      succession plan.
    relatedQuestionRefs:
    - QO005
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: Exact Series D and Series C valuations are undisclosed
    missingEvidence: Series D post-money valuation, Series C post-money valuation, share price, option 409A, and any secondary
      pricing.
    whyItMatters: The public 3x statement is directionally useful but insufficient to underwrite entry price or dilution.
    diligencePath: Obtain Series C and Series D term sheets, capitalization table, 409A reports, and any secondary transaction
      memos.
    relatedQuestionRefs:
    - QO010
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: Revenue, ARR dollars, gross margin, and headcount are not publicly disclosed
    missingEvidence: Current ARR, recognized revenue, gross margin, burn, runway, active headcount, and hiring plan.
    whyItMatters: Growth percentages and NDR are strong, but investment underwriting requires dollar scale and cost structure.
    diligencePath: Request management KPI pack with ARR bridge, revenue recognition policy, cohort NDR, gross margin, burn,
      cash, runway, and headcount by function.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: Debt, credit facilities, secondaries, and liquidation preferences are not public
    missingEvidence: Debt agreements, venture debt terms, secondary-sale notices, liquidation stack, pro-rata rights, and
      side letters.
    whyItMatters: Capital structure affects downside protection, next-round behavior, and investor-control analysis.
    diligencePath: Request financing documents, debt schedules, side letters, and investor-rights summaries from counsel.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: SOC 2, HIPAA trust center, and security posture require primary evidence
    missingEvidence: SOC 2 report, HIPAA policies, security certifications, penetration-test summaries, and business-associate
      agreement template.
    whyItMatters: Candid operates in RCM infrastructure where Change Healthcare demonstrates the severity of cyber and operational
      resilience risk.
    diligencePath: Request trust-center access, SOC 2 Type II report, HIPAA risk assessment, BAA template, incident response
      plan, and uptime history.
    relatedQuestionRefs:
    - QO020
    - QO021
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table omits private board actions, internal product launches, and undisclosed customer contracts
    missingEvidence: Internal milestone tracker with board approvals, all customer contract signatures, product GA dates,
      compliance audits, and office-opening dates.
    whyItMatters: The public chronology is useful for orientation but should not be mistaken for a complete operating history.
    diligencePath: Ask management for internal milestone, product-release, customer-signing, compliance-audit, and office-expansion
      records.
    relatedQuestionRefs:
    - QO017
    - QO026
    - QO028
    relatedTableRefs:
    - TO004
