company:
  name: Candid Health
chapter:
  number: 1
  title: Company Overview
  summary: Candid Health is a San Francisco-based, Series D-stage autonomous RCM platform founded in 2019 by Palantir alumni
    Nick Perry and Doug Proctor. Public sources support a July 2026 $120M Series D, more than $219M raised, 190% 2025 annual
    contracted run-rate growth, 180% NDR, 200+ healthcare organizations, and about $7B of annual claims volume, while exact
    valuation, ARR dollars, headcount, debt, secondaries, and governance rights remain private.
sections:
- id: section-1
  title: Identity, product scope, and operating footprint
  body: 'Candid Health is best described as a private, Series D-stage healthcare infrastructure company selling autonomous
    revenue cycle management software to provider organizations, not as a generic billing-services vendor. The strongest current
    identity evidence comes from the July 2026 Sixth Street announcement and independent health-tech coverage: both frame
    the company as an AI-first RCM platform that unifies clinical, billing, and provider data, then uses rules and AI agents
    to automate manual claims work. The canonical founding year is 2019, and public accelerator evidence ties the company
    to Y Combinator W20. Headquarters evidence points to San Francisco, with San Francisco, New York, and Denver repeatedly
    appearing as offices or hiring locations. The one-line business model is therefore: Candid sells an API-first RCM automation
    platform that lowers cost-to-collect and improves collections for healthcare providers by automating claims submission,
    denial management, and related billing workflows.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO033
  - CO034
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: section-2
  title: Founders, leadership, governance visibility, and key-person risk
  body: 'The public leadership record is unusually founder-centric. Candid repeatedly foregrounds Nick Perry as co-founder
    and CEO and Doug Proctor as co-founder and COO, with independent reporting noting that the two worked together at Palantir
    for about five years on data engineering and automation problems. That background is directly relevant to Candid’s thesis
    that RCM is fundamentally a data-engineering problem rather than a staffing or workflow-queue problem. The upside is strong
    founder-market fit: Perry and Proctor can credibly connect enterprise data systems, healthcare operations, and automation.
    The risk is also clear: retained sources disclose much less about a broader executive bench, board composition, committees,
    investor control rights, or formal succession depth. No public source reviewed here identifies a current board roster
    or recent leadership-change log, so governance diligence should request the cap-table rights schedule, board list, observer
    rights, and executive succession plan rather than infer stability from press quotes.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO048
  tableRefs:
  - TO002
- id: section-3
  title: Funding history, valuation posture, and stakeholder map
  body: Candid’s financing path has accelerated sharply. Public sources support a September 2024 Series B of $29 million led
    by 8VC, a February 2025 Series C of $52.5 million led by Oak HC/FT, and a July 2026 Series D of $120 million led by Sixth
    Street Growth with Oak HC/FT, 8VC, and Y Combinator participating. The Series B sources state that Candid had raised $47
    million to date at that point; the Series D coverage states that total capital raised is now more than $219 million. This
    chapter uses the task-specified $219.5 million as the canonical total-raised figure, while preserving the public language
    of “more than $219 million.” Valuation requires more caution. The Series D is said to triple the Series C valuation, but
    the exact Series C and Series D valuations are not disclosed. A unicorn-level valuation may be inferred, but should not
    be presented as a confirmed public post-money price.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
