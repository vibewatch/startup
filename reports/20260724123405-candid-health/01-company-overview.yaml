- id: section-4
  title: Scale metrics, customers, product proof, and explicit metric gaps
  body: 'The strongest current scale signals are growth rates, customer count, and claims volume rather than audited revenue
    dollars. Candid reports 190% year-over-year annual contracted run-rate revenue growth and 180% year-over-year net dollar
    retention in 2025, serves more than 200 healthcare organizations, and processes about $7 billion in annual claim volume.
    The customer base is described as spanning digital health startups, large national MSOs, and EMR/EHR companies. Product
    proof is also visible outside company press: Candid documentation describes API-based claim submission, and Elation Health
    lists Candid as a preferred partner with a native integration. The major public gaps are equally important. Exact ARR
    dollars, recognized revenue, gross margin, current headcount, signed customer roster, debt, secondaries, and exact valuation
    are private. A Seedtable employee estimate is useful context but not a company-confirmed headcount, so the KPI table keeps
    headcount null and gives a diligence path.'
  claimRefs:
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
  - CO031
  - CO032
  - CO036
  - CO037
  - CO038
  - CO039
