  - FO003
- id: section-5
  title: Milestones, adverse sector context, and chronology reuse
  body: 'The chronology of record is strong enough to reuse across later chapters, but it is not an internal operating history.
    The dated public record starts with 2019 founding and YC W20, then runs through Series B, Series C, the July 2026 Series
    D, API/integration proof, 200-plus customers, $7 billion of annual claims volume, and disclosed 2025 growth metrics. It
    also needs a non-company-specific adverse entry because Candid is infrastructure in a sector where outages and cyber incidents
    can quickly become provider cash-flow crises. The 2024 Change Healthcare attack, HHS OCR investigations, and hospital-sector
    disruption coverage are the clearest adverse precedent: they do not allege misconduct by Candid, but they show the operational
    blast radius of RCM infrastructure failure. The milestone table therefore mixes founding, financing, product, scale, partnership,
    governance, regulatory, and adverse entries while explicitly marking private gaps around board actions, compliance artifacts,
    and undisclosed financing terms.'
