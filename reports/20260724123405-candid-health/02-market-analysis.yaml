      - FM003
      - FM004
  - id: drivers-constraints-gaps
    title: Growth drivers, constraints, and diligence gaps
    body: >-
      The structural drivers are strong: payer rules are more volatile, denial pressure is material, prior
      authorization remains a workflow bottleneck, cloud and AI adoption are mainstream board topics, and
      provider consolidation increases the need for standardized financial operating systems. Black Book,
      McKinsey, Adonis, Experian, and Auxis all show RCM moving from back-office billing to strategic cash
      control. At the same time, constraints are unusually high because Candid touches PHI, reimbursement cash
      flow, payer connectivity, and clinical documentation. Buyers must trust automation, tolerate
      implementation disruption, meet HIPAA and security obligations, and justify switching away from legacy
      systems or outsourced vendors. The Change Healthcare attack is an adverse market reminder that central
      RCM infrastructure can become systemic risk. Diligence should therefore preserve contradictory sizing
      estimates, request private segment pipeline and win-rate data, test denial and net-collection ROI by
      segment, and verify integration burden, cybersecurity posture, and payback period before treating the
      headline market as near-term accessible revenue. In practice, the adoption funnel should be underwritten
      as a staged cash-control transformation rather than a simple point-solution replacement.
    claimRefs:
