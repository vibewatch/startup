          Claims submission, eligibility, prior authorization, denial management, payment posting, rules
          engine, analytics
        - Clinical EHR charting, payer core systems, general finance software
        - Providers paying from revenue cycle, finance, or operations budgets
        - Core
      - - Managed RCM services and outsourcing
        - Service labor and managed workflows that can be automated or replaced over time
        - General staffing unrelated to billing or collections
        - Hospitals, physician groups, MSOs
        - Core substitute / conversion pool
      - - Legacy RCM modules in EHR / PM systems
        - Embedded billing, claims, coding, and collections tools already in provider stack
        - Unrelated EHR clinical modules
        - Health systems and practices through enterprise IT budgets
        - Status-quo substitute
      - - Clearinghouse and payer connectivity
        - Transaction routing, claim status, remittance, payer portal automation
        - Payer insurance administration not sold to providers
        - Provider RCM teams and platform vendors
        - Adjacent infrastructure
      - - Broad administrative RCM spend
        - Manual labor, outsourced operations, software, appeals, and revenue integrity overhead
        - Non-RCM clinical administration and payer-only administrative spend
        - Healthcare providers and their operating budgets
        - Broad TAM lens, not all purchasable software
    notes: >-
      Boundary separates Candid’s broad $280B spend problem from narrower analyst market estimates for vendor
      software/services.
