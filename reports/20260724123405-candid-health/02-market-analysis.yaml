company:
  name: Candid Health
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Candid Health sells into a large but confusingly defined RCM opportunity: public analyst pages size the
    U.S. healthcare RCM software/services market around $73 billion in 2026, while Candid frames the broader
    administrative spend problem as roughly $280 billion per year. The investable wedge is narrower than
    either headline number: AI-first automation for claim submission, denial prevention, eligibility, prior
    authorization, payment posting, and revenue analytics sold to provider organizations and adjacent platform
    partners that can tolerate a high-trust system-of-record migration.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      Candid’s valuation-relevant market is best defined as healthcare provider revenue cycle infrastructure,
      not all healthcare administration and not only point billing software. Included spend is the software,
      services, workflow automation, clearinghouse connectivity, analytics, and managed-process work that
      helps providers turn encounters into reimbursed cash. Excluded spend should include unrelated clinical
      EHR modules, pure patient engagement, payer core administration, general consulting, and manual
      back-office labor that will not migrate to software. The boundary matters because Candid’s own $280
      billion problem statement is a broad annual U.S. RCM spend lens, whereas market-research pages typically
      measure a narrower software-and-services market. Status-quo substitutes remain powerful: legacy RCM
      modules embedded in Epic, Oracle Health, athenahealth, and practice-management systems; outsourced RCM
      service vendors; clearinghouses; internal billing teams; and payer portals. The market is therefore
      large, but adoption depends on replacing trusted operational plumbing, not just selling another SaaS
      seat.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: sizing-lenses
    title: Sizing lenses and why estimates conflict
    body: >-
      The sizing record supports multiple lenses rather than a single clean TAM/SAM/SOM. Towards Healthcare
      reports the U.S. healthcare RCM market growing from about $72.96 billion in 2026 to $195.92 billion by
      2035 at an 11.6% CAGR, while Precedence Research reports a similar but not identical U.S. lens of $73.14
      billion in 2026, $191.67 billion by 2035, and an 11.35% CAGR. The same source family also reports a
      global market of $169.7 billion in 2025 and $505.8 billion by 2035. Candid’s $280 billion annual U.S.
      RCM spend claim is therefore not contradictory if treated as broader administrative spend, but it would
      overstate the purchasable vendor market if used directly as software TAM. A practical
      evidence-constrained stack is: broad U.S. RCM spend, analyst-measured U.S. RCM vendor market, the subset
      addressable by cloud/API automation, and Candid’s currently evidenced wedge among more than 200 provider
      organizations and platform partners.
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
    tableRefs:
      - TM002
    figureRefs:
      - FM002
  - id: buyers-users-payers
    title: Buyer, user, payer segmentation and adoption path
    body: >-
      The buyer set is segmented by care-delivery complexity and platform leverage. Hospitals and health
      systems have board-level cash-protection needs, payer-friction exposure, denial-prevention priorities,
      and integration-heavy environments, making them high-ACV but slower-cycle buyers. Physician groups and
      specialty practices own the same jobs at smaller scale: eligibility checks, coding, claim submission,
      payment posting, denial worklists, and patient collections. Digital health companies and MSOs are
      attractive because they often scale claims volume faster than back-office teams and can adopt API-first
      infrastructure earlier. EMR/EHR vendors and partners such as Elation represent a channel or
      embedded-workflow path rather than only direct-provider sales. The economic buyer is usually the CFO,
      revenue cycle leader, COO, or platform product owner; users are billing teams, coders, front-desk
      eligibility staff, denial specialists, and finance analysts. Adoption typically moves from data
      integration and workflow validation to selected RCM modules, then broader system-of-record consolidation
      when trust and ROI are proven.
    claimRefs:
      - CM011
      - CM012
      - CM014
      - CM015
      - CM016
      - CM023
