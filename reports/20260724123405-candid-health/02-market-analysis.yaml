  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: RCM market definition and sizing
      missingEvidence: >-
        Public estimates use different boundaries for software, services, outsourcing, and broad
        administrative spend, including Candid’s $280B problem framing versus analyst estimates near $73B for
        2026 U.S. RCM.
      whyItMatters: >-
        Valuation can be materially overstated if broad administrative spend is treated as near-term software
        TAM.
      diligencePath: >-
        Build a bottom-up model by segment using Candid pipeline, ACV, attach rate, services displacement, and
        claims volume rather than a single headline TAM.
      relatedQuestionRefs:
        - QM006
        - QM007
        - QM021
        - QM025
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: Candid-specific SAM and SOM
      missingEvidence: >-
        Public sources do not disclose Candid’s qualified pipeline, segment-level ARR, win rate, wallet share,
        implementation capacity, or expected penetration of hospitals, MSOs, digital health companies, and EHR
        partners.
      whyItMatters: >-
        The difference between a large market and an investable growth case depends on Candid-specific
        conversion and expansion evidence.
      diligencePath: >-
        Request data-room pipeline by buyer segment, current ARR and NRR by cohort, specialty-level claim
        volume, implementation backlog, and competitive win/loss records.
      relatedQuestionRefs:
        - QM007
        - QM022
      relatedTableRefs:
        - TM002
        - TM003
    - type: missing-source
      severity: material
      topic: ROI proof by segment
      missingEvidence: >-
        Public customer snippets show denial and net-collection improvement, but do not provide statistically
        comparable before/after ROI across specialties, payer mixes, and implementation types.
      whyItMatters: >-
        Candid’s ability to overcome switching cost depends on verified payback, not only product breadth or
        market pain.
      diligencePath: >-
        Obtain anonymized cohort metrics for initial denial rate, final denial rate, net collection, A/R days,
        cost-to-collect, manual touches per claim, and implementation duration.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM004
    - type: missing-source
      severity: material
      topic: Budget ownership and procurement path
      missingEvidence: >-
        Public sources identify RCM as CFO- and board-visible, but do not disclose Candid’s actual buyer
        champion, procurement committee, sales cycle, or security-review duration by segment.
      whyItMatters: >-
        The market can be large while sales cycles remain long if approval spans finance, IT, compliance, and
        operations.
      diligencePath: >-
        Interview recent customers and inspect CRM stage history, procurement timelines, security
        questionnaires, and reasons for closed-lost opportunities.
      relatedQuestionRefs:
        - QM010
        - QM013
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: minor
      topic: Regulatory implementation timing
      missingEvidence: >-
        CMS prior authorization and interoperability rules create a demand signal, but payer and provider
        implementation details will evolve through 2027 and 2028.
      whyItMatters: Rule timing may shift urgency for automation modules and payer connectivity features.
      diligencePath: >-
        Refresh rulemaking, payer implementation guides, and provider readiness surveys before final
        investment committee.
      relatedQuestionRefs:
        - QM016
      relatedTableRefs:
        - TM004
