callouts:
  - calloutType: insight
    title: Treat $280B as problem spend, not immediate software TAM
    body: >-
      Candid’s broad problem framing is useful for strategic ambition, but underwriting should anchor on the
      roughly $73B 2026 U.S. RCM vendor market and then haircut to segments where API-first automation can
      displace legacy systems or services.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM006
      - CM040
  - calloutType: strength
    title: Denial pain maps directly to Candid’s product wedge
    body: >-
      Multiple sources identify denials, payer friction, prior authorization, and cash predictability as top
      provider problems, while Candid’s public customer examples emphasize lower denials, higher net
      collections, and reduced manual billing work.
    claimRefs:
      - CM018
      - CM020
      - CM021
      - CM022
      - CM023
      - CM031
      - CM032
  - calloutType: risk
    title: Trust and switching friction are the adoption governor
    body: >-
      The market is not constrained by lack of pain; it is constrained by whether providers will entrust
      cash-critical, PHI-bearing workflows to a newer AI-first platform and absorb integration risk.
    claimRefs:
      - CM027
      - CM028
      - CM029
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
