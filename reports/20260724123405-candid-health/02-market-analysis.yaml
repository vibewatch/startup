  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Claims and denial management pain
        - driver
        - Current
        - Denial prevention is a top RCM priority and validates Candid’s workflow focus
        - Request cohort-level initial denial, final denial, and appeal yield data
      - - Prior authorization and payer-rule volatility
        - driver
        - 2026 through 2028
        - Creates demand for automated eligibility, documentation, authorization, and payer communication
        - Map Candid workflows to CMS rule deadlines and payer-specific edge cases
      - - AI and cloud automation adoption
        - driver
        - Current
        - Provider leaders are budgeting for automation, analytics, and governed AI in RCM
        - Verify human-in-the-loop controls, model monitoring, and realized labor savings
      - - Provider consolidation and MSO growth
        - driver
        - Current
        - Larger provider platforms need standardized RCM infrastructure across specialties
        - Inspect pipeline by enterprise, MSO, and digital health segment
      - - Legacy-system switching cost
        - constraint
        - Current
        - Replacing EHR/PM-embedded RCM requires migration, interfaces, retraining, and cash-flow risk
        - Review implementation duration, defect rates, and parallel-run requirements
      - - Trust, HIPAA, and cybersecurity burden
        - constraint
        - Current
        - RCM platforms handle PHI and cash-critical transactions; outages or breaches can be systemic
        - Request SOC 2, HIPAA controls, incident history, and vendor-resilience architecture
      - - ROI proof and payback variability
        - constraint
        - Current
        - Buyers need credible yield improvement, lower cost-to-collect, and denial reduction by specialty
        - Validate customer before/after performance net of case-mix and payer changes
      - - Contradictory TAM definitions
        - constraint
        - Current
        - Broad spend estimates can inflate valuation if not reconciled with purchasable vendor market
        - Build underwriting cases from bottom-up pipeline rather than headline TAM
    notes: >-
      Drivers and constraints are paired because adoption is gated by trust, integration burden, and
      measurable reimbursement ROI.
