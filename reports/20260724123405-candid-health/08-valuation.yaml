- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - explicit assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - bull
    - ARR-equivalent revenue is already $120M-$160M or grows there quickly; NDR remains near 180%; gross margin is software-like;
      implementation is repeatable; security posture is enterprise-grade.
    - $900M-$1.6B illustrative value using 7.5x-10.0x scarce-platform revenue multiples; invest only if entry allows at least
      3x expected return after dilution.
    - Execution, payer connectivity, and competition still matter; downside rises sharply if the company is services-heavy.
    - Possible but requires private proof not present in public evidence.
  - - base
    - Claims-volume monetization lands around $60M-$100M ARR-equivalent; growth remains high but normalizes; multiples stay
      around 4.7x-6.0x health-IT/RCM references.
    - $280M-$700M illustrative value range; track only if entry is below the latest implied mark or terms protect downside.
    - Dilution, preference overhang, and revenue-quality uncertainty can erode returns.
    - 'Best match for current public record: strong momentum, weak price evidence.'
  - - bear
    - ARR-equivalent revenue is $30M-$50M; gross margin is mixed with services; NDR normalizes; sector multiples compress
      toward public Waystar levels or below.
    - $150M-$350M illustrative value range; avoid premium secondary purchases and any round priced only on headline growth.
    - Multiple compression, security incident, payer failure, customer churn, or weak automation ROI.
    - Material because the exact valuation and current revenue are undisclosed.
  notes: Scenario ranges are estimates derived from $7B claims volume and 2026 health-IT/RCM multiple references; they are
    not company-disclosed valuations.
