chapter:
  number: 8
  title: Valuation
  summary: 'Candid Health has strong public momentum: a $120M Series D, valuation tripling versus Series C, 190% ARR growth,
    180% NDR, about $7B of claims volume, and 200+ customers. But exact valuation, ARR dollars, margins, and preference terms
    remain undisclosed, so the evidence-sensitive call is research-more with medium confidence, high risk, and a stretched
    valuation stance if investors are underwriting an inferred $1B-plus price.'
sections:
- id: s801
  title: 'Recommendation: strong business proof, not enough price proof'
  body: 'Candid Health has many ingredients an investor wants in a late-stage vertical software winner: a large RCM market,
    an AI-first product narrative, more than 200 healthcare organizations, about $7 billion of annual claims volume, 190%
    annual contracted run-rate revenue growth in 2025, 180% net dollar retention, and a July 2026 Series D led by Sixth Street
    Growth. The thesis is that Candid is rebuilding a broken financial workflow with a platform that can expand inside provider
    groups and eventually look more like a mission-critical healthcare payment system than a services vendor. The anti-thesis
    is valuation discipline. The Series D tripled the Series C valuation, but no retained public source discloses exact post-money
    valuation, current ARR, gross margin, price per share, liquidation preferences, or whether the markup is supported by
    software-like economics rather than claim-volume optics. The public-evidence recommendation is research-more with medium
    confidence, high risk, and a stretched valuation stance if the entry price is $1 billion-plus without private diligence.'
