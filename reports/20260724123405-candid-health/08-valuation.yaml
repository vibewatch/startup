  title: Thesis / anti-thesis table
  columns:
  - side
  - argument
  - what would change the view
  rows:
  - - thesis
    - Large RCM market with 2026 U.S. market size estimated near $72.96B and double-digit growth.
    - Weakens if provider RCM budgets slow or if AI automation fails to reduce cost-to-collect.
  - - thesis
    - 'Candid has exceptional disclosed momentum: 190% ARR growth, 180% NDR, more than 200 customers, and about $7B of annual
      claims volume.'
    - Strengthens if management provides cohort ARR, gross margin, and retention calculations that reconcile to the public
      growth claims.
  - - thesis
    - Product is API-oriented and integrated into provider workflows, including public docs and Elation Health partner proof.
    - Strengthens if integrations expand beyond early digital-health and multi-site provider segments into scaled enterprise
      systems.
  - - anti-thesis
    - Exact Series D valuation, price per share, preference terms, and current ARR are not publicly disclosed.
    - Risk falls if Candid shares the financing memo, cap table, 409A or secondary marks, and a clean ARR bridge.
  - - anti-thesis
    - If the Series D implies $1B-plus, investors may be paying a rich multiple before knowing whether revenue is software-like
      or services-heavy.
    - Risk falls if ARR is already above the base estimate with strong gross margins and low implementation burden.
  - - anti-thesis
    - Sector risk includes powerful incumbents, AI-native peers, payer connectivity complexity, and Change Healthcare-style
      cybersecurity exposure.
    - Risk falls with audited security posture, redundancy, payer-network resilience, and referenceable enterprise deployments.
  notes: The table separates business attractiveness from investability at a particular price.
