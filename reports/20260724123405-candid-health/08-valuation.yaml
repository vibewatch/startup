- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Latest valuation
    - Exact Series D post-money, price per share, 409A, secondary marks, and any structured equity terms.
    - Without a price, the recommendation cannot become buy or track with return math.
    - Request financing memo, board consents, term sheet, and cap table from management or lead investor.
  - - Cap table and preferences
    - Liquidation preferences, participation, senior securities, option-pool refresh, and pro forma dilution.
    - Preference overhang can wipe out common upside even if operations improve.
    - Review charter amendments, investor rights, and cap-table waterfall.
  - - Revenue quality
    - Current ARR, annual contracted run-rate definition, cohort revenue, booked pipeline, and customer concentration.
    - The $7B claims-volume metric is not a substitute for monetized revenue.
    - Obtain revenue bridge by customer cohort and claim type.
  - - Margin and automation economics
    - Gross margin, implementation cost, manual-touch rate, denial-management ROI, and cost-to-collect improvement.
    - Determines whether Candid deserves software multiples or services-style valuation.
    - Review management model, customer case studies, and support-labor analytics.
  - - Retention methodology
    - NDR cohort definition, expansion/contraction split, logo churn, and payer/provider mix.
    - A 180% NDR claim is powerful only if calculated on a durable cohort.
    - Request cohort waterfall and customer-level renewal history.
  - - Security and compliance
    - SOC 2/HIPAA evidence, incident history, BAA coverage, payer connectivity redundancy, and disaster-recovery tests.
    - RCM platforms handle sensitive data and claims workflows; a breach can impair valuation.
    - Review audits, pen tests, incident logs, and insurer questionnaires.
  - - Competitive win/loss
    - Head-to-head outcomes against Waystar, Optum/Change, Adonis, Enter, and EHR-native modules.
    - Multiple depends on durable differentiation, not generic AI billing language.
    - Run customer calls and pipeline win/loss review.
  - - Exit path
    - Public-company readiness, strategic acquirer map, antitrust issues, and revenue threshold for IPO.
    - Exit readiness determines whether a Series D investor can reach target return.
    - Ask bankers and strategics for exit comps and minimum scale thresholds.
  notes: These asks are the minimum package needed to convert the chapter from public-evidence research-more to a price-sensitive
    underwriting memo.
