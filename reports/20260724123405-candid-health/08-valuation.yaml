- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Waystar
    - Public RCM software company; FY2025 revenue, FY2026 guide, NRR, EBITDA margin, July 2026 market data
    - FY2025 revenue $1.099B; FY2026 guide $1.274B-$1.294B; NRR 112%; adjusted EBITDA margin 42%; market cap about $4.1B-$4.2B;
      EV/revenue about 4.6x.
    - Best public RCM software valuation anchor for a scaled healthcare payments platform.
    - Much larger, public, profitable, and more mature than Candid; not a growth-stage AI-native comp.
  - - Change Healthcare / Optum
    - Strategic RCM infrastructure M&A precedent
    - UnitedHealth/Optum completed a $13B deal; rough EV/sales math around 3.7x using public revenue references.
    - Shows strategic value of scaled claims infrastructure and payer/provider connectivity.
    - Acquired asset was larger and later suffered a massive cybersecurity incident that underscores downside risk.
  - - athenahealth
    - Private health IT platform / PE outcome reference
    - UpsideList frames athenahealth around a $17B current valuation scenario with upside to $29.75B; used only as a platform-scale
      reference.
    - Demonstrates that embedded health IT workflow platforms can command strategic values.
    - Not a pure RCM comp; retained source is secondary and lower-confidence.
  - - Adonis
    - AI-native RCM private funding peer
    - $40M Series C in March 2026; total funding over $95M; company claims 4x 2025 revenue growth and >130% net retention.
    - Shows continued venture appetite for AI-native RCM and denial-management automation.
    - Exact valuation and revenue base are undisclosed; smaller and likely earlier than Candid.
  - - Enter Health
    - AI-powered RCM private peer
    - Tracxn describes Enter as AI-powered RCM with limited public funding detail; Enter markets an AI layer for RCM operations.
    - Useful competitive signal that agentic RCM is crowded and not unique to Candid.
    - No current valuation or recent round detail publicly disclosed in retained sources.
  - - Health IT market multiples
    - HGP / HIT Consultant July 2026 market review
    - HGP Health IT Revenue Multiple recovered to 4.7x; RCM Tech median revenue multiple reported at 6.0x.
    - Provides a current broad-market guardrail for private valuation discipline.
    - Broad category mixes scale, margins, growth, and business models.
  - - Healthcare software valuation guides
    - Auxo 2026 healthcare software guide
    - Low-single-digit to high-single-digit EV/revenue or EV/ARR indications are common; scarce high-growth platforms can
      reach double digits.
    - Supports using a wide but disciplined multiple range rather than assuming a premium.
    - Advisory guide, not transaction-specific evidence for Candid.
  notes: This is a sampled comparable set spanning public RCM software, strategic M&A, private AI-RCM rounds, and broad health-IT
    multiple references; Candid revenue is not disclosed, so rows bracket possible valuation logic rather than prove a price.
  enumerationScope:
    coverage: sample
    basis: Representative valuation references available on the public web as of 2026-07-24 across public companies, M&A,
