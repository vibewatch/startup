  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: Exact Candid Series D valuation is undisclosed
    missingEvidence: Series D post-money valuation, share price, 409A mark, secondary prices, and valuation waterfall.
    whyItMatters: The chapter cannot convert company quality into a buy recommendation without an entry price and dilution
      context.
    diligencePath: Obtain financing memo, term sheet, board approvals, 409A summary, secondary transaction references, and
      pro forma capitalization.
    relatedQuestionRefs:
    - QV006
    - QV029
    - QV032
    relatedTableRefs: []
  - type: private-evidence-only
    severity: blocking
    topic: Cap table and preference overhang are not public
    missingEvidence: Liquidation preference, participation, seniority, option-pool refresh, debt or structured equity, and
      investor-rights terms.
    whyItMatters: Preference and dilution can determine actual returns even when headline valuation and revenue growth look
      attractive.
    diligencePath: Review cap table, charter amendments, investor-rights agreement, and management waterfall model.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: Revenue and margin evidence needed for valuation range
    missingEvidence: Current ARR, annual contracted run-rate definition, gross margin, implementation cost, manual-touch rate,
      and customer cohort revenue.
    whyItMatters: The chapter estimates ARR from claims volume; actual monetization could be materially lower or higher.
    diligencePath: Request management model, customer-level revenue bridge, cohort retention report, and gross-margin proof.
    relatedQuestionRefs:
    - QV008
    - QV009
    - QV010
    - QV011
    relatedTableRefs:
    - TV003
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table is a sampled set
    missingEvidence: Exhaustive private-market database exports for AI-RCM rounds, secondary marks, and undisclosed M&A multiples.
    whyItMatters: Private comps would better calibrate Candid than public-web references but are not fully available without
      paid databases or banker materials.
    diligencePath: Supplement with PitchBook, Carta secondary marks, banker comp books, and investor references under NDA.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV004
