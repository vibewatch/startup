- id: s803
  title: Comparable valuation set and downside signals
  body: 'The comparable set argues for discipline rather than a mechanical premium. Waystar is the cleanest public RCM software
    anchor: it has over $1 billion of revenue, 112% NRR, a 42% adjusted EBITDA margin, and July 2026 market data that imply
    roughly mid-single-digit EV/revenue multiples. That is a very different scale and profitability profile from a private
    company whose revenue dollars are not public. Change Healthcare’s $13 billion Optum acquisition supplies a strategic infrastructure
    precedent, but the later cybersecurity incident is also an adverse reminder that clearinghouse and RCM platforms can create
    systemic operational and compliance exposure. Adonis and Enter Health show that AI-native RCM remains fundable and competitive,
    while broad 2026 health-IT multiple data cluster around mid-single-digit revenue multiples. Athenahealth-style platform
    outcomes show upside exists, but the evidence does not justify treating every AI-RCM platform as a double-digit revenue
    multiple by default.'
