- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Valuation remains opaque
    - No term sheet, post-money, share price, 409A, secondary marks, or liquidation preferences are shared in diligence.
    - Prevents entry discipline and makes target-return math unverifiable.
    - Do not invest; keep research-more or move to avoid.
  - - ARR below claims-volume estimate
    - Current ARR or annual contracted run-rate is materially below the $35M-$140M illustrative range.
    - Implies the claims-volume headline is not converting into software revenue.
    - Reprice to bear case or avoid premium rounds.
  - - Gross margin / services mix disappoints
    - Gross margin is services-heavy or implementation costs consume the automation benefit.
    - Turns the model from software comp to labor-enabled RCM services.
    - Avoid double-digit revenue multiples.
  - - NDR weakens materially
    - Net dollar retention normalizes far below the disclosed 180% without a credible expansion bridge.
    - Weakens the strongest growth-quality claim.
    - Downgrade from research-more to avoid at premium pricing.
  - - Security or payer-network incident
    - Material outage, breach, claims-routing failure, or unresolved HIPAA/security audit issue.
    - Change Healthcare precedent shows RCM infrastructure failures can be systemic and costly.
    - Pause investment until remediation and customer impact are proven.
  - - Competition changes buyer economics
    - Waystar, Adonis, Enter, Optum/Change, or EHR vendors bundle automation enough to compress Candid’s win rate or pricing.
    - Weakens growth, retention, and exit optionality.
    - Require lower entry multiple or abandon deal.
  notes: Each trigger links a diligence or monitorable operating event to the investment action.
