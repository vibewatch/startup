- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Current public substitute
  - Why substitute is insufficient
  - Exact diligence path
  rows:
  - - ARR / revenue run-rate dollars
    - Blocks valuation and scale analysis
    - 190% contracted run-rate growth
    - Growth percentage without base dollars can hide small starting scale
    - Request ARR by month for 2024-2026 and contracted versus recognized revenue
  - - Revenue mix
    - Blocks quality-of-revenue view
    - Product/API and billing-services surfaces
    - Does not separate recurring software from implementation or services
    - Request GAAP revenue by subscription, usage, implementation, and services
  - - Realized pricing / take rate
    - Blocks conversion from $7B claims volume to revenue
    - Personalized quote and claim-volume disclosure
    - No per-claim, percentage, or subscription-unit pricing disclosed
    - Request customer contract summaries and weighted-average realized pricing
  - - Gross margin and cost of revenue
    - Blocks margin-path analysis
    - Waystar public comp and customer ROI benchmarks
    - Comp margins do not reveal Candid service-delivery or AI-inference cost
    - Request gross margin bridge by product line and customer cohort
  - - CAC / payback / sales cycle
    - Blocks sales-efficiency analysis
    - NDR, customer count, and investor customer diligence
    - Expansion is visible but new-logo acquisition cost is not
    - Request CAC, payback, sales cycle, win rate, and partner fees
  - - Cash / burn / runway / debt
    - Blocks capital adequacy
    - Series D size and total raised
    - Capital raised is not remaining cash and says nothing about monthly burn
    - Request latest balance sheet, cash-flow statement, budget, and debt schedule
  notes: The public record is strong on traction signals and weak on actual financial statements; each null is intentional
    rather than omitted.
