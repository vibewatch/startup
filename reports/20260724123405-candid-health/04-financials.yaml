    - SoftwareFinder says buyers should request a personalized quote
    - List price not public
    - RCM platform and implementation
    - Discounts, minimums, and term length undisclosed
    - Supports negotiated enterprise pricing, not self-serve pricing
  - - Subscription/platform fee
    - Inferred from enterprise RCM software platform model and Waystar comp
    - Realized subscription fee not public
    - Platform access, workflow automation, analytics
    - Seat, provider, location, or volume metric unknown
    - ARR quality cannot be confirmed without contract schedule
  - - Usage-based fee
    - Inferred from claim volume and API transaction surface
    - Realized per-claim fee not public
    - Claims, eligibility, submissions, financials endpoints
    - Overage pricing and volume tiers undisclosed
    - $7B claim volume does not directly equal revenue
  - - Implementation fee
    - Integration guide requires minimum API integration
    - Fee existence and amount not official
    - Create Encounter integration and delivery support
    - Third-party implementation estimate is not official Candid pricing
    - Recognition may be upfront, deferred, or bundled
  - - Performance or collections upside
    - Value prop includes net collection and cost-to-collect improvements
    - Take rate not public
    - Denial prevention and revenue recovery
    - No percentage-of-collections disclosure
    - Do not model Candid as a pure contingency RCM vendor without private proof
