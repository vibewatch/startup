  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Candid Health realized pricing and revenue mix
    missingEvidence: Public sources do not disclose list pricing, realized contract pricing, take rate, discounting, subscription
      versus usage mix, implementation fees, or revenue-recognition policy.
    whyItMatters: Revenue quality and ARR conversion cannot be underwritten without knowing how contracted growth converts
      into recognized revenue and gross profit.
    diligencePath: Request customer contract schedule, pricing waterfall, revenue-recognition memo, and 2024-2026 revenue
      by subscription, usage, implementation, and services.
    relatedQuestionRefs:
    - QI003
    - QI004
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Candid Health sales efficiency
    missingEvidence: No reviewed source disclosed CAC, payback period, sales cycle, quota attainment, partner fees, or channel
      revenue share.
    whyItMatters: High NDR and growth may still be expensive if enterprise sales and implementation costs are high.
    diligencePath: Request CAC/payback by cohort, sales-cycle distribution, partner economics, win/loss analysis, and customer
      implementation cost.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Candid Health ARR dollars and revenue run-rate
    missingEvidence: Public sources disclose growth percentage and contracted run-rate growth but not ARR or current revenue-run-rate
      dollars.
    whyItMatters: Valuation, scale, and efficiency cannot be benchmarked from growth percentages alone.
    diligencePath: Request monthly ARR, contracted ARR, recognized revenue, and bookings by product line for 2024 through
      latest 2026 month.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Candid Health cash, burn, runway, and debt
    missingEvidence: No reviewed public source disclosed unrestricted cash, monthly burn, runway months, debt, receivables
      financing, or covenants.
    whyItMatters: Capital adequacy depends on remaining liquidity and burn, not on the headline Series D alone.
    diligencePath: Request latest balance sheet, cash-flow statement, monthly burn, debt schedule, covenants, and board-approved
      runway scenarios.
    relatedQuestionRefs:
    - QI020
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: Candid Health headcount and service-delivery leverage
    missingEvidence: No reviewed public source disclosed current headcount or headcount by function.
    whyItMatters: Headcount mix is necessary to test whether AI automation is reducing implementation and support labor intensity.
    diligencePath: Request headcount by function, revenue per employee, implementation hours per customer, and automation-rate
      trend.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
