chapter:
  number: 4
  title: Financials
  summary: Candid Health shows high-quality public traction signals—190% contracted run-rate growth, 180% NDR, more than 200
    customers, and about $7B of annual claim volume—but not the private financial statements needed to underwrite ARR, gross
    margin, burn, runway, or realized pricing.
sections:
- id: SEC401
  title: Revenue model, pricing, and recognition architecture
  body: 'Candid’s public financial story is stronger on mechanism than on reported dollars. The company sells an autonomous
    healthcare revenue-cycle-management platform to providers, and the visible product surface spans API-based claim creation,
    claim submission, eligibility checks, financials data, billing services, and AI automation that is meant to reduce manual
    work while improving collection outcomes. That supports the briefing’s business-model framing: enterprise SaaS subscription
    plus usage-based economics tied to claims volume is the right diligence hypothesis, but public sources still do not disclose
    the actual contract form, list price, discounting, minimums, revenue share, or percentage-of-collections take rate. The
    recognition issue is therefore material. Investors should separate recurring platform access, usage-based claim volume,
    implementation / integration services, and any outsourced billing-services revenue before treating the disclosed 190%
    contracted run-rate growth as ARR quality. Public evidence also shows a request-a-quote buying motion rather than transparent
    list pricing, so realized gross revenue per claim and net revenue retained by Candid remain private.'
  claimRefs:
