- id: SEC402
  title: GTM motion and sales-efficiency proxies
  body: 'The GTM motion looks enterprise/provider-led rather than self-serve. Candid and third-party sources describe customers
    across digital-health startups, MSOs, and provider groups, while Elation’s partner listing points to multi-location practices
    and groups with 10 to 1,000+ physicians. That implies consultative sales, implementation work, and integration-led expansion,
    not a low-touch SMB SaaS funnel. The strongest sales-efficiency proxy is not CAC or payback disclosure; it is Candid’s
    180% net dollar retention in 2025, 190% contracted run-rate growth, and Sixth Street’s claim that it spoke with roughly
    40 customers before leading the Series D. Those are unusually strong demand and expansion signals. However, they still
    do not answer whether growth is efficient, how much partner revenue share is paid, how long implementations take, or whether
    AI automation is reducing service-delivery cost fast enough to expand gross margin. Waystar’s public filings are a useful
    caution: channel partner fees and deferred commission amortization can scale with RCM revenue even in a mature platform
    business.'
  claimRefs:
