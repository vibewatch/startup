- id: SEC403
  title: Cost structure, unit economics, and public comp lens
  body: 'Candid has not disclosed gross margin, cost of revenue, hosting cost, implementation cost, support staffing, denial-management
    labor, or human-in-the-loop review burden. Public sources nevertheless show the main cost drivers to diligence: implementation
    and delivery teams, API integration, claims-quality operations, AI/automation tooling, security and compliance, support,
    and any outsourced billing-services labor. The customer ROI target is clear—reduce cost to collect and improve net collection—because
    HFMA-style RCM KPIs, CAQH/DataSpring automation-savings commentary, and cost-to-collect benchmarks all point to provider
    administrative waste as a large budget pool. The comp lens is Waystar, not because Candid is public or equally mature,
    but because Waystar shows what scaled RCM software economics can look like: $1.099 billion of 2025 revenue, 42% adjusted
    EBITDA margin, recurring or predictable-volume revenue, and risk factors around pricing pressure. That benchmark is favorable
    for the category but adverse for underwriting Candid: high category margins are possible, yet Candid’s own gross margin
    remains unproven.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
