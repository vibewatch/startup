    - 'null'
    - Low
    - Core capital-adequacy output
    - Request base, downside, and aggressive-growth runway scenarios
  - - Debt / credit facilities
    - No public Candid disclosure reviewed
    - Low
    - Debt covenants could change equity risk
    - Request debt schedule, receivables financing, covenants, and liens
