  rows:
  - - Core RCM platform
    - Enterprise platform automating claims, eligibility, financials, and denial workflows
    - Subscription / platform access
    - Visible in official product and API materials
    - 'Medium-high: product mechanism is public, contract unit is private'
    - Request contract templates separating platform fees, usage, implementation, and services
  - - Usage tied to claims volume
    - Claims submitted, checked, corrected, and tracked through Candid APIs and workflows
    - Claim / encounter / transaction volume
    - About $7B in annual claim volume disclosed
    - 'Medium: volume disclosed, monetization per claim not disclosed'
    - Request billed revenue by claim volume tier and customer cohort
  - - Implementation and integration
    - Delivery teams help customers integrate encounter, claim, and financial APIs
    - Implementation project
    - Docs say Create Encounter API is minimum integration path
    - 'Medium: implementation work is explicit, fee treatment unknown'
    - Request implementation fee schedule and revenue-recognition policy
  - - Billing services / human operations
    - Billing-services surface suggests Candid may combine software with service delivery
    - Service bundle
    - Public billing-services page exists; staffing intensity not quantified
    - 'Low-medium: service component may dilute software gross margin'
    - Request revenue and gross margin split for software versus managed services
  - - Automation / AI agents
    - Rules engine and AI agents automate repetitive RCM work and edge cases
    - Automation module / included capability
    - Series D proceeds target agentic RCM deployments
    - 'Medium: value proposition clear, standalone pricing not public'
    - Request whether AI modules are separate SKUs, usage overages, or bundled features
  notes: Public sources support the revenue mechanisms, but Candid does not disclose the actual unit price, contract minimums,
    realized take rate, or revenue mix.
