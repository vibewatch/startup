- id: SEC404
  title: Traction versus private-metric gaps and estimate ranges
  body: 'Candid discloses multiple public traction metrics: more than 200 healthcare organizations, about $7 billion of annual
    claim volume, 190% annual contracted run-rate revenue growth, and 180% NDR. Those are relevant and directionally strong,
    but they are not substitutes for ARR, revenue run-rate dollars, gross margin, cash burn, or customer concentration. The
    financial-estimate range in this chapter is therefore deliberately labeled as an approximation rather than a valuation
    input. Applying a broad 2% to 6% RCM fee-pool heuristic to $7 billion of processed claims creates an illustrative $140
    million to $420 million annual monetization pool, not Candid ARR. Candid’s actual revenue could be far lower or higher
    depending on whether contracts are subscription, transaction, percentage-of-collections, services-heavy, or hybrid. The
    main diligence output is thus a gap map: ask management for revenue bridge by customer cohort, contract type, claim volume,
    net collection lift, implementation fees, and renewal / expansion behavior.'
  claimRefs:
