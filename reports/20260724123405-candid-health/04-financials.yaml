    - About $7B processed per year
    - High
    - Volume base for usage-based monetization estimates
    - Request claims, collections, and net collection lift by customer cohort
  - - Public Candid gross margin
    - 'null'
    - Low
    - Core proof of whether AI automation improves service delivery cost
    - Request gross margin by software, implementation, and managed-service line
  - - CAC / payback
    - 'null'
    - Low
    - Needed to translate growth into efficient growth
    - Request CAC, sales cycle, payback, quota attainment, and channel share
  - - Waystar 2025 adjusted EBITDA margin
    - 42%
    - Medium
    - Shows scaled RCM software can be highly profitable
    - Benchmark Candid margin path against Waystar after normalizing maturity
  - - Waystar implied gross margin before D&A
    - ~68% estimated from $1.099B revenue and $348.2M cost of revenue
    - Medium
    - Useful comp lens but not Candid-specific
    - Request Candid cost-of-revenue bridge and hosted/operations cost per claim
  - - Cost-to-collect benchmark
    - Top performers target <=2% of net collections
    - Medium
    - Frames customer ROI and willingness to pay
    - Quantify Candid customer cost-to-collect before/after implementation
  notes: Unit economics are mostly proxy-based; Candid publishes growth and volume but not gross margin, CAC, or payback.
