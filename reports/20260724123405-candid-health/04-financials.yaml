- id: SEC405
  title: Capital adequacy, financing dependency, and verdict
  body: 'The July 2026 Series D materially improves near-term capital adequacy, but public evidence still does not support
    a runway calculation. Candid raised $120 million, reported more than $219 million of total capital raised, and disclosed
    use of proceeds for team growth, automation/tooling, and agentic RCM deployment. That is consistent with an aggressive
    growth plan in a large RCM automation market. It is not the same as cash on hand, burn, debt, or next-round trigger disclosure.
    The adverse lens is twofold. First, the Change Healthcare attack showed that claims infrastructure can create systemic
    operational and provider-cash-flow risk, so resilience and trust investment may be non-negotiable costs. Second, Waystar’s
    public filing warns that pricing pressure can compress margins in the category. The verdict is therefore “promising but
    under-disclosed”: revenue quality appears high because retention and contracted growth are strong, but underwriting remains
    blocked until Candid provides ARR dollars, realized pricing, gross margin, burn, cash, runway, headcount, and debt detail.'
