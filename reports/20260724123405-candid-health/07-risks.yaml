- id: s703
  title: Dependencies cluster around cloud, EHR integrations, payer rails, and a customer base exposed to digital-health volatility
  body: 'Candid’s public materials position the company as API-first and interoperable, which is strategically attractive but dependency-heavy. The platform needs stable cloud infrastructure, reliable internal data operations, functioning EHR integrations such as Elation, payer and clearinghouse connectivity, and customer-side implementation discipline. This means risk is not confined to Candid’s own codebase. A payer policy update, clearinghouse disruption, EHR integration change, customer data-quality problem, or cloud incident can all be experienced by the customer as a Candid failure. Customer concentration is another unresolved dependency: public sources state more than 200 organizations and highlight digital-health startups, MSOs, EHR companies, and complex provider groups, but do not disclose revenue concentration, customer renewal distribution, or whether the largest accounts carry unusual service burdens. The dependency map therefore treats platform and customer concentration as
    investment risks until diligence proves redundancy, contract quality, and top-account resilience.'
  claimRefs:
  - CR003
  - CR004
  - CR007
  - CR008
  - CR027
  - CR028
  - CR029
  - CR041
  - CR044
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: s704
  title: Financial and people risk is the valuation of execution perfection before private metrics are visible
  body: 'The financial risk is mostly opacity plus expectations. Candid has strong public growth claims, a $120 million Series D, and investor validation from Sixth Street, but the exact dollar valuation, burn, runway, gross margin, net revenue retention methodology, implementation margin, take rate, and customer concentration are not disclosed. That creates a classic late-private-round underwriting problem: the company may be excellent, but the public evidence cannot prove whether the price already capitalizes flawless execution. Waystar’s public scale shows the reward for winning RCM can be large and profitable, but it also sets a high operating benchmark and gives incumbents room to bundle, copy, or price aggressively. People risk is similar. Nick Perry and Doug Proctor are credible ex-Palantir founders and remain central to the story, while Candid’s geographic hiring footprint signals a scaling organization. The residual exposure is whether the company can scale implementation, support,
    compliance, security, and AI model operations without losing the execution intensity of a founder-led company.'
  claimRefs:
  - CR005
  - CR006
  - CR030
  - CR031
