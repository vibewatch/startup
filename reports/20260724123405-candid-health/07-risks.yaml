- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Cyber / PHI exposure
    - Security or privacy incident
    - Material breach, OCR/state AG inquiry, or inability to produce current SOC report and pen-test summary
    - Pause investment until root cause, remediation, insurance, and customer notice exposure are closed
  - - AI billing accuracy
    - Claims QA and payer denial metrics
    - Model-driven error, miscoding pattern, high refund exposure, or weak audit trail
    - Treat automation moat as unproven and haircut growth and margin assumptions
  - - Connectivity / outage risk
    - Uptime and transaction availability
    - Repeated payer, clearinghouse, API, or cloud outage without robust failover
    - Downgrade reliability and require SLA, redundancy, and incident-response proof
  - - Customer concentration
    - Top-account and segment disclosure
    - Top five customers, one segment, or one partner channel dominates revenue or claim volume
    - Widen churn downside and require retention / concentration covenants in underwriting
  - - Valuation / private metrics opacity
    - Series D valuation, burn, and margin evidence
    - Company cannot disclose valuation, runway, gross margin, take rate, NRR methodology, or cohort data under NDA
    - Defer price-sensitive recommendation or demand valuation discount
  - - Execution scaling
    - Implementation and support metrics
    - Go-live times lengthen, manual-touch rate remains high, or support backlog grows faster than revenue
    - Lower automation scalability and margin assumptions
  - - Regulatory / payer-rule change
    - Payer-rule and CMS change-management cadence
    - Major CMS or payer rule change cannot be implemented without customer disruption
    - Require stronger regulatory ops and payer-change monitoring before underwriting
  notes: Kill criteria are intentionally observable through diligence documents, operating dashboards, or public adverse events.
