- id: s702
  title: Regulatory and legal risk is mainly HIPAA, payer-rule change, AI uncertainty, and billing-accuracy liability
  body: 'The regulatory/legal register should be read as a severity-ranked risk map rather than a list of known Candid violations. Retained public sources do not show a Candid-specific enforcement action, lawsuit, or sanction, but that absence is not proof of no private disputes. The legal burden comes from the business model itself: healthcare RCM platforms can touch PHI, influence claim coding, route prior authorization or denial workflows, and operate under customer-specific BAAs, DPAs, indemnities, and payer rules that are rarely visible publicly. HHS makes business associates directly liable for selected HIPAA obligations, while HIPAA guidance around AI and healthcare data suggests that automated tools handling PHI need disciplined governance. CMS prior-authorization and No Surprises Act materials show that payer-provider transaction rules continue to change. The investment implication is not to reject Candid solely on legal risk, but to demand customer contract packs, audit logs, claims-error
    reserves, security reports, and counsel-confirmed litigation/enforcement searches before underwriting a premium valuation.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR018
  - CR019
  - CR038
  - CR043
  tableRefs:
