  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Uptime, incident history, and operational resilience for TR002
    missingEvidence: Public sources do not disclose uptime, incident history, SLA credits, cloud redundancy, or clearinghouse failover performance.
    whyItMatters: RCM downtime can transmit quickly into delayed cash, manual workarounds, and customer churn.
    diligencePath: Request status history, incident postmortems, SLA terms, DR tests, cloud architecture, and payer/clearinghouse failover evidence.
    relatedQuestionRefs:
    - QR013
    - QR019
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: Customer and revenue concentration for TR003
    missingEvidence: Public sources state more than 200 healthcare organizations but do not disclose top-customer revenue, claim-volume concentration, churn, or segment-level retention.
    whyItMatters: Fast-growing digital-health and MSO customers can mask concentration or churn risk that affects revenue durability.
    diligencePath: Request top-10 customer revenue and claims volume, segment churn, cohort NRR/GRR, contract term, and exposure to failing or venture-backed customers.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: Model accuracy and claims compliance for TR002 and TR005
    missingEvidence: Public sources do not provide payer-by-payer first-pass resolution, model error rates, hallucination controls, audit samples, or refund reserves.
    whyItMatters: AI billing errors can create denials, rework, customer churn, or legal exposure.
    diligencePath: Review evaluation datasets, QA scorecards, audit logs, human escalation thresholds, payer dispute history, and refund/error reserves.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: Candid-specific litigation and enforcement confirmation
    missingEvidence: Retained public searches did not identify a definitive Candid-specific litigation, OCR, state AG, payer audit, or enforcement record.
    whyItMatters: The absence of public evidence does not exclude private disputes, arbitrations, customer claims, or non-public investigations.
    diligencePath: Run counsel-led docket searches, OCR/state AG inquiries, payer audit request list, insurance loss runs, and management representation.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: Financial model inputs and valuation support
    missingEvidence: Exact valuation, burn, runway, gross margin, implementation margin, take rate, and audited financials are not publicly disclosed.
    whyItMatters: A 3x valuation step-up can be reasonable or expensive depending on private metrics and margin durability.
    diligencePath: Request board-approved financials, ARR bridge, revenue recognition policy, gross margin by segment, runway, valuation terms, and liquidation preferences.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR005
