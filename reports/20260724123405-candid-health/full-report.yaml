      - number: '7.3'
        title: >-
          Dependencies cluster around cloud, EHR integrations, payer rails, and a customer base exposed to
          digital-health volatility
        blocks:
          - type: paragraph
            body: >-
              Candid’s public materials position the company as API-first and interoperable, which is strategically
              attractive but dependency-heavy. The platform needs stable cloud infrastructure, reliable internal data
              operations, functioning EHR integrations such as Elation, payer and clearinghouse connectivity, and
              customer-side implementation discipline. This means risk is not confined to Candid’s own codebase. A payer
              policy update, clearinghouse disruption, EHR integration change, customer data-quality problem, or cloud
              incident can all be experienced by the customer as a Candid failure. Customer concentration is another
              unresolved dependency: public sources state more than 200 organizations and highlight digital-health
              startups, MSOs, EHR companies, and complex provider groups, but do not disclose revenue concentration,
              customer renewal distribution, or whether the largest accounts carry unusual service burdens. The
              dependency map therefore treats platform and customer concentration as investment risks until diligence
              proves redundancy, contract quality, and top-account resilience.
