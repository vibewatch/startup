figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Candid moved from 2019 founding and YC W20 into rapid 2024-2026 financing, strong company-claimed growth, and a
      sector context where RCM infrastructure resilience matters.
    data:
      items:
        - date: '2019-01-01'
          label: Founded
          detail: Candid Health founded by Nick Perry and Doug Proctor.
          tone: positive
        - date: '2020-01-01'
          label: YC W20
          detail: Y Combinator company profile ties Candid to the W20 batch.
          tone: positive
        - date: '2024-09-11'
          label: $29M Series B
          detail: 8VC-led round with First Round, BoxGroup, and YC participation.
          tone: positive
        - date: '2025-02-12'
          label: $52.5M Series C
          detail: Oak HC/FT-led Series C follows six months after Series B.
          tone: positive
        - date: '2025-03-14'
          label: Change Healthcare risk precedent
          detail: HHS OCR incident FAQ underlines RCM-sector cyber and HIPAA exposure.
          tone: negative
        - date: '2026-02-17'
          label: Waystar public comp
          detail: Waystar reports $1.099B FY2025 revenue and 112% NRR.
          tone: neutral
