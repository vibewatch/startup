  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity ranking: the downside tree starts with HIPAA/cyber, AI billing accuracy, and transaction reliability'
        blocks:
          - type: paragraph
            body: >-
              Candid Health’s top risks are not generic SaaS risks; they sit at the intersection of PHI, payer
              transactions, AI-driven claim logic, and an extremely high-growth private valuation reset. The
              highest-severity exposure is cyber/privacy because Candid operates in a healthcare data flow where
              business-associate obligations, PHI handling, SOC controls, and customer trust all matter at the same
              time. The second risk is AI billing accuracy: Candid’s promise is to automate workflows that historically
              required human billing teams, but miscoding, hallucinated rules, or poor edge-case handling can transmit
              into payer denials, refunds, customer churn, or even fraud-related scrutiny. The third risk is reliability
              and connectivity across APIs, EHRs, payers, and clearinghouses. Change Healthcare proved that an RCM
              intermediary can become a systemic single point of failure; Candid is smaller, but the same
              architecture-dependent transmission path is relevant. Public mitigations are real—SOC 2, technical docs,
              named Elation integration, and fresh Series D capital—but residual exposure remains high because uptime,
              claims accuracy, concentration, and model-quality evidence are not public.
            claimRefs:
              - CR001
