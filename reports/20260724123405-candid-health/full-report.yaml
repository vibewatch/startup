        title: Modules, APIs, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The public architecture is best read as a workflow platform with four product layers. First, Candid
              ingests and normalizes encounter, patient, coverage, payer, and provider context from customer systems.
              Second, it applies rules and automation to claim creation, pre-submission corrections, eligibility, and
              task routing. Third, it connects to external rails such as clearinghouses, payer identifiers, Elation,
              customer BI stacks, and SDK-supported developer environments. Fourth, it exposes reporting and data
              products, especially Candid Data Share, for transactional claim histories and analytics. The integration
              guide is unusually specific for a private company: minimum claim submission requires the Create Encounter
              API, service-line updates are recommended, additional patient and coverage endpoints are available for
              practice-management use cases, and eligibility can be checked through a synchronous passthrough endpoint.
              That operating model still leaves a diligence gap: the public stack reveals API surfaces and integration
              patterns, but not model-evaluation harnesses, payer-routing contracts, clearinghouse redundancy, or how
              Candid prevents AI-driven billing errors from reaching payers.
