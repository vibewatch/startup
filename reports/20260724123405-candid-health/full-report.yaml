      - number: '1.2'
        title: Founders, leadership, governance visibility, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              The public leadership record is unusually founder-centric. Candid repeatedly foregrounds Nick Perry as
              co-founder and CEO and Doug Proctor as co-founder and COO, with independent reporting noting that the two
              worked together at Palantir for about five years on data engineering and automation problems. That
              background is directly relevant to Candid’s thesis that RCM is fundamentally a data-engineering problem
              rather than a staffing or workflow-queue problem. The upside is strong founder-market fit: Perry and
              Proctor can credibly connect enterprise data systems, healthcare operations, and automation. The risk is
              also clear: retained sources disclose much less about a broader executive bench, board composition,
              committees, investor control rights, or formal succession depth. No public source reviewed here identifies
              a current board roster or recent leadership-change log, so governance diligence should request the
              cap-table rights schedule, board list, observer rights, and executive succession plan rather than infer
              stability from press quotes.
