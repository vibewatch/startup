      - number: '2.2'
        title: Sizing lenses and why estimates conflict
        blocks:
          - type: paragraph
            body: >-
              The sizing record supports multiple lenses rather than a single clean TAM/SAM/SOM. Towards Healthcare
              reports the U.S. healthcare RCM market growing from about $72.96 billion in 2026 to $195.92 billion by
              2035 at an 11.6% CAGR, while Precedence Research reports a similar but not identical U.S. lens of $73.14
              billion in 2026, $191.67 billion by 2035, and an 11.35% CAGR. The same source family also reports a global
              market of $169.7 billion in 2025 and $505.8 billion by 2035. Candid’s $280 billion annual U.S. RCM spend
              claim is therefore not contradictory if treated as broader administrative spend, but it would overstate
              the purchasable vendor market if used directly as software TAM. A practical evidence-constrained stack is:
              broad U.S. RCM spend, analyst-measured U.S. RCM vendor market, the subset addressable by cloud/API
              automation, and Candid’s currently evidenced wedge among more than 200 provider organizations and platform
              partners.
