  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Candid’s valuation-relevant market is best defined as healthcare provider revenue cycle infrastructure,
              not all healthcare administration and not only point billing software. Included spend is the software,
              services, workflow automation, clearinghouse connectivity, analytics, and managed-process work that helps
              providers turn encounters into reimbursed cash. Excluded spend should include unrelated clinical EHR
              modules, pure patient engagement, payer core administration, general consulting, and manual back-office
              labor that will not migrate to software. The boundary matters because Candid’s own $280 billion problem
              statement is a broad annual U.S. RCM spend lens, whereas market-research pages typically measure a
              narrower software-and-services market. Status-quo substitutes remain powerful: legacy RCM modules embedded
              in Epic, Oracle Health, athenahealth, and practice-management systems; outsourced RCM service vendors;
              clearinghouses; internal billing teams; and payer portals. The market is therefore large, but adoption
              depends on replacing trusted operational plumbing, not just selling another SaaS seat.
