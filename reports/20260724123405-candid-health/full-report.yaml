        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Candid sells revenue-cycle automation for provider organizations that need to turn clinical encounters
              into collectible claims with fewer manual billing touches. The clearest definition comes from the Series D
              release: Candid calls itself an AI-first RCM platform and financial system of record that unifies
              clinical, billing, and provider data into a single model, then uses a configurable rules engine, AI
              agents, and touch tracking to automate work historically handled by billing teams. In customer workflow
              terms, that means Candid sits between EHR / practice-management systems, payer connectivity, claims
              operations, denial follow-up, patient billing, and reporting. Public pages emphasize claims submitted and
              finalized without human intervention, reductions in manual work, lower denials, and automation that
              prevents claim issues before they become costly. The API documentation supports this workflow framing
              because it starts with creating encounters and then expands into practice-management data, eligibility,
              payer information, claims data exports, and downstream task visibility.
