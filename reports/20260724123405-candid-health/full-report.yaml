      - number: '7.4'
        title: Financial and people risk is the valuation of execution perfection before private metrics are visible
        blocks:
          - type: paragraph
            body: >-
              The financial risk is mostly opacity plus expectations. Candid has strong public growth claims, a $120
              million Series D, and investor validation from Sixth Street, but the exact dollar valuation, burn, runway,
              gross margin, net revenue retention methodology, implementation margin, take rate, and customer
              concentration are not disclosed. That creates a classic late-private-round underwriting problem: the
              company may be excellent, but the public evidence cannot prove whether the price already capitalizes
              flawless execution. Waystar’s public scale shows the reward for winning RCM can be large and profitable,
              but it also sets a high operating benchmark and gives incumbents room to bundle, copy, or price
              aggressively. People risk is similar. Nick Perry and Doug Proctor are credible ex-Palantir founders and
              remain central to the story, while Candid’s geographic hiring footprint signals a scaling organization.
              The residual exposure is whether the company can scale implementation, support, compliance, security, and
              AI model operations without losing the execution intensity of a founder-led company.
