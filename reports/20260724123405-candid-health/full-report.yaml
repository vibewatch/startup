            body: >-
              Waystar is the clearest adverse scale benchmark. It is public, generated $1.099 billion of fiscal 2025
              revenue, disclosed 112% net revenue retention, and is explicitly positioning around autonomous RCM and an
              end-to-end AI-powered platform. Availity is different but just as strategically important: it claims more
              than half of U.S. healthcare transactions run on its network and says its portal reaches 3 million
              credentialed providers and 170 million covered lives. FinThrive, Optum, athenahealth, Veradigm, and
              Ensemble widen the field through revenue-integrity analytics, end-to-end services, EHR adjacency, EDI
              connectivity, or outsourced operations. AI-native peers Adonis and ENTER matter because they attack the
              same software automation wedge from below. Candid’s product story remains differentiated, but the evidence
              does not support a simple winner-take-all narrative.
