  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Candid should not be benchmarked only against other venture-backed AI billing startups. The buyer’s job is
              to get paid accurately, quickly, and compliantly, which means the practical alternatives include direct
              AI-native RCM peers, public and private RCM suites, payer-provider networks, clearinghouses, outsourced
              RCM firms, EHR-adjacent platforms, point workflow automators, internal billing teams, and home-grown
              scripts. Candid’s most favorable wedge is with digital health, specialty groups, MSOs, and tech-forward
              provider organizations that value APIs, a unified data model, and automation over hospital-suite breadth.
              The least favorable wedge is against incumbents that already own transaction networks, payer
              relationships, enterprise procurement trust, or EHR workflow depth. Likely entrants are not hypothetical;
              Availity, athenahealth, Cohere, and Infinitus already sit on adjacent administrative workflows that can
              expand into revenue-cycle automation.
