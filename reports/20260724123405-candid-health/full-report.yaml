      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record supports momentum but not a fully underwritable price. Candid’s $52.5 million Series
              C in February 2025 was followed roughly seventeen months later by a $120 million Series D that public
              sources describe as a 3X increase in valuation. That is an important direction-of-travel signal, but it is
              not the same as a verified valuation. A disciplined entry should therefore anchor on observable operating
              drivers, not on a headline markup. Using $7 billion of annual claims volume as the denominator, an
              illustrative 0.5% to 2.0% RCM take-rate yields a rough $35 million to $140 million ARR-equivalent band.
              Applying 2026 health-IT and RCM multiples around 4.0x to 7.0x gives a wide value bracket before any
              scarcity premium. This is an approximation, not a company-disclosed revenue figure. The cap table also
              remains opaque: preference stack, option-pool refresh, senior securities, and secondary marks could
              materially change common-equity returns.
