  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Strong growth and market proof flow to research-more because valuation and unit-economics evidence are still
      missing.
    data:
      nodes:
        - id: n1
          label: Large RCM market
          detail: U.S. RCM market estimated at $72.96B in 2026 with double-digit CAGR.
          tone: positive
        - id: n2
          label: Candid growth proof
          detail: 190% ARR growth, 180% NDR, 200+ customers, and $7B annual claims volume.
          tone: positive
        - id: n3
          label: Product / workflow depth
          detail: Financial system of record, API docs, and EHR integration support workflow embed.
          tone: positive
        - id: n4
          label: Valuation opacity
          detail: Series D tripled Series C valuation, but exact price and terms are not public.
          tone: negative
        - id: n5
          label: Sector and comp risk
          detail: Waystar multiples, Change Healthcare breach, and AI-RCM competition constrain premium assumptions.
          tone: warning
        - id: n6
          label: Recommendation
          detail: Research-more; medium confidence; high risk; stretched valuation stance at undisclosed premium pricing.
          tone: warning
      edges:
        - to: n6
          from: n1
        - to: n6
          from: n2
        - to: n6
          from: n3
        - to: n6
          from: n4
        - to: n6
          from: n5
    approximationNotes: null
