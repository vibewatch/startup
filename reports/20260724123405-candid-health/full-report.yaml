      - number: '3.3'
        title: Pricing, packaging, GTM, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Pricing is the weakest public comparison dimension. Candid has a third-party per-provider estimate, but
              the estimate is not a contract benchmark and does not reveal realized discounts, implementation economics,
              gross margin, or win rates. HealthSystemCIO’s KLAS coverage reinforces the broader issue: even deep
              adopters of RCM suites do not see true all-inclusive pricing, and added modules can carry extra charges.
              That opacity favors incumbents with procurement familiarity because buyers can rationalize the risk of
              paying for known suites, networks, or services even if a startup’s automation is technically better. Trust
              posture also cuts both ways. Candid can argue that cloud-native architecture and focused automation avoid
              brittle legacy layers, but the Change Healthcare cyberattack shows how mission-critical RCM infrastructure
              can become systemic operational risk when providers depend on a dominant third-party network.
