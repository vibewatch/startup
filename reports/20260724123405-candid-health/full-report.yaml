              billion of annual claim volume, 190% annual contracted run-rate growth, and 180% NDR in 2025. The PR
              Newswire recognition item adds operating outcome claims: over 95% touchless claim rates and payer net
              collection rates above 97%. Elation’s page says top customers reach 95% to 99% payer net collection rates,
              which aligns with HFMA’s benchmark that 97% to 99% is optimal. These are strong signals of production
              usage rather than pilots. However, all of the most valuable durability metrics remain opaque: gross
              retention, logo churn, contract duration, renewal cadence, customer-level NDR distribution, and cohort
              curves are not public. For underwriting, the right stance is that Candid has credible land-and-expand
              evidence, but investors should not treat NDR as a substitute for a cohort retention file and top-customer
              bridge. The diligence implication is to verify whether reported expansion is broad-based across cohorts or
