              million as the canonical total-raised figure, while preserving the public language of “more than $219
              million.” Valuation requires more caution. The Series D is said to triple the Series C valuation, but the
              exact Series C and Series D valuations are not disclosed. A unicorn-level valuation may be inferred, but
