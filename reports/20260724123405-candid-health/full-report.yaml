      - number: '7.5'
        title: >-
          Mitigation maturity is moderate, but the diligence bar should be explicit and kill criteria should be
          observable
        blocks:
          - type: paragraph
            body: >-
              The visible mitigation stack is meaningful but incomplete. SOC 2 Type 1 and Type 2 announcements,
              HIPAA/business-associate posture, technical documentation, named integrations, and new financing all lower
              the probability that risk is unmanaged. They do not answer the questions that should decide an investment:
              uptime and incident history; payer-by-payer first-pass resolution and denial outcomes; manual-touch rates;
              model monitoring; quality assurance; top-customer concentration; cloud redundancy; security findings;
              cyber insurance; and customer contract limitations. The monitoring approach should therefore be
              event-driven. A material security incident, repeated payer-connectivity failure, inability to show claims
              accuracy, unexpectedly high manual work, adverse enforcement or billing-integrity allegations, a
              down-round, or refusal to share concentration data should break or pause the thesis. Conversely, clean
              diligence on SOC reports, BAAs, DPAs, top customers, model QA, and transaction resilience would move the
              residual risk from high toward moderate.
