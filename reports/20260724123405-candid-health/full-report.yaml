  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Candid’s customer journey moves from pain recognition to integration, automated claims production,
      customer-operations tuning, and expansion into more payers, sites, or workflows.
    data:
      nodes:
        - id: j1
          label: RCM pain recognized
          detail: >-
            Provider, digital-health, or MSO leader faces denials, delayed payments, manual billing work, or weak
            reporting.
          tone: warning
        - id: j2
          label: Segment/channel entry
          detail: Buyer arrives through direct enterprise sales, case-study proof, Elation integration, or partner ecosystem.
          tone: neutral
        - id: j3
          label: Integration design
          detail: >-
            Customer decides source-of-truth boundaries across EHR, practice-management, Candid, eligibility, and claims
            data.
          tone: warning
        - id: j4
          label: Production claims workflow
          detail: Candid automates eligibility, claim submission, payer rules, reporting, and denial prevention.
          tone: positive
        - id: j5
          label: Customer strategy tuning
          detail: Candid customer-operations teams diagnose issues and propose operational or product fixes.
          tone: neutral
        - id: j6
          label: Expansion / optimization
          detail: More payers, specialties, TINs, locations, or patient billing workflows can be added if outcomes hold.
          tone: positive
    approximationNotes: >-
      Generic journey synthesized from product, integration, partner, and job-post evidence; individual customers may
      skip steps.
