    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Candid Health is best described as a private, Series D-stage healthcare infrastructure company selling
              autonomous revenue cycle management software to provider organizations, not as a generic billing-services
              vendor. The strongest current identity evidence comes from the July 2026 Sixth Street announcement and
              independent health-tech coverage: both frame the company as an AI-first RCM platform that unifies
              clinical, billing, and provider data, then uses rules and AI agents to automate manual claims work. The
              canonical founding year is 2019, and public accelerator evidence ties the company to Y Combinator W20.
              Headquarters evidence points to San Francisco, with San Francisco, New York, and Denver repeatedly
              appearing as offices or hiring locations. The one-line business model is therefore: Candid sells an
              API-first RCM automation platform that lowers cost-to-collect and improves collections for healthcare
              providers by automating claims submission, denial management, and related billing workflows.
