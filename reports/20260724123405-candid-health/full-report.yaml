  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: strong business proof, not enough price proof'
        blocks:
          - type: paragraph
            body: >-
              Candid Health has many ingredients an investor wants in a late-stage vertical software winner: a large RCM
              market, an AI-first product narrative, more than 200 healthcare organizations, about $7 billion of annual
              claims volume, 190% annual contracted run-rate revenue growth in 2025, 180% net dollar retention, and a
              July 2026 Series D led by Sixth Street Growth. The thesis is that Candid is rebuilding a broken financial
              workflow with a platform that can expand inside provider groups and eventually look more like a
              mission-critical healthcare payment system than a services vendor. The anti-thesis is valuation
              discipline. The Series D tripled the Series C valuation, but no retained public source discloses exact
              post-money valuation, current ARR, gross margin, price per share, liquidation preferences, or whether the
              markup is supported by software-like economics rather than claim-volume optics. The public-evidence
              recommendation is research-more with medium confidence, high risk, and a stretched valuation stance if the
              entry price is $1 billion-plus without private diligence.
