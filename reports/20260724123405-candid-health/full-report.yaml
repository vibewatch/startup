    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: The call is most sensitive to revenue conversion, price opacity, and margin quality.
    data:
      items:
        - label: Exact entry valuation / terms
          value: 10
          detail: No public post-money, share price, or preference stack.
        - label: ARR from $7B claims volume
          value: 9
          detail: Revenue is estimated, not disclosed.
        - label: Gross margin and services mix
          value: 9
          detail: Software multiple depends on automation economics.
        - label: Retention durability
          value: 8
          detail: 180% NDR is powerful but needs cohort proof.
        - label: Public comp multiple compression
          value: 7
          detail: Waystar trades around mid-single-digit EV/revenue.
        - label: Security and claims-network risk
          value: 7
          detail: Change Healthcare shows systemic downside.
        - label: Competitive displacement
          value: 6
          detail: Adonis, Enter, Waystar, and Optum all pressure differentiation.
        - label: Market growth
          value: 5
          detail: Large market is less uncertain than Candid-specific economics.
