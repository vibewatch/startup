      - number: '8.4'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Candid is more exit-relevant than a typical early-stage healthcare AI company because it has Series D
              sponsorship, rapid growth, high reported retention, claimed scale through claim volume, and an end-to-end
              workflow position in a large administrative spend pool. Still, exit readiness is only plausible, not
              proven. A public-market path would require audited revenue quality, margin visibility, implementation
              repeatability, security posture, and a story that maps to Waystar-like durability rather than
              services-heavy RCM labor arbitrage. A strategic exit would require a buyer to accept concentration, data,
              payer-connectivity, HIPAA, and antitrust-adjacent risks after the Change Healthcare precedent. The
              decisive diligence asks are therefore valuation and unit economics: actual ARR, net revenue retention
              methodology, gross margin by cohort, customer concentration, claim-volume monetization, denial improvement
              proof, security controls, and cap-table terms. Failure on these items should hold the recommendation at
              research-more or move it to avoid. Investors should treat that missing package as valuation-critical
              rather than procedural.
