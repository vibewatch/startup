  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job
      - current workflow
      - company solution
      - measurable benefit
      - limitation
    rows:
      - - Submit clean claims after a patient visit
        - Staff translate encounter data into payer-ready claims and manually correct issues
        - Create encounters through API and apply Candid rules / automation pre-submission
        - Company and partner materials cite higher touchless claim rates and fewer manual touches
        - Public sources do not provide audited clean-claim-rate cohorts
      - - Verify eligibility before appointments
        - Staff check payer portals or clearinghouse tools manually
        - Use Candid eligibility endpoint or automated checks when appointments are stored in Candid
        - Eligibility can be checked before the appointment through the Candid workflow
        - Sandbox uses sample eligibility data and Change Healthcare is named in docs
      - - Fix and resubmit denied claims
        - Billers identify denials, correct data, and resubmit claims by hand
        - Candid identifies and automates preventable claim issues before they become costly
        - Home page cites Bridge cutting net denials by more than half
        - Public sources do not disclose denial-code mix or independent attribution
      - - Manage patient and payer data across systems
        - EHR / PM data, payer identifiers, coverages, and billing data live in multiple systems
        - Pre-encounter endpoints manage patients and coverages and propagate data to claims
        - Reduces duplicated data entry and supports deeper practice-management integration
        - Data-quality controls and reconciliation workflows are not public
      - - Report collections and claim outcomes
        - Finance teams build custom exports from billing tools and clearinghouses
        - Data Share exports claim datasets and transactional history into BI / data lakes
        - Enables configurable reporting and analytics on RCM performance
        - Latency, completeness, and field-level lineage are not publicly benchmarked
      - - Integrate with Elation practices
        - Practices rely on EHR-native workflows and separate billing infrastructure
        - Native Elation integration plus open API-driven framework
        - Elation page claims higher net collections, lower days outstanding, and lower operating costs
        - Partner page is a sales listing rather than an audited customer case study
    notes: >-
      Use cases are mapped from Candid official pages, API documentation, Elation marketplace language, and third-party review descriptions; quantitative outcomes remain largely company or partner claimed.
