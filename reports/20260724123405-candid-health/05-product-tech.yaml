  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Model accuracy and hallucination controls
      missingEvidence: Public sources do not disclose audited model accuracy, hallucination controls, or claim-correction acceptance thresholds for Candid AI agents.
      whyItMatters: Incorrect automated claim corrections could cause denials, compliance exposure, delayed cash, or customer trust loss.
      diligencePath: Request model-evaluation reports, QA sampling methods, denial-code false-positive analysis, human review thresholds, and customer-specific accuracy cohorts.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: Payer and clearinghouse resilience
      missingEvidence: Public sources do not disclose Candid-specific clearinghouse redundancy, payer-coverage uptime, production incident history, or recovery-time objectives.
      whyItMatters: RCM platforms depend on external claims, eligibility, remittance, and payment rails that can materially disrupt provider cash flow.
      diligencePath: Request payer-connectivity architecture, clearinghouse contracts, incident logs, RTO/RPO targets, and customer communications from any degraded claims periods.
      relatedQuestionRefs:
        - QE023
      relatedTableRefs:
        - TE003
        - TE004
    - type: missing-source
      severity: material
      topic: Independent automation efficacy
      missingEvidence: Public sources do not provide independent audited cohorts for touchless claim rate, denial reduction, payment speed, or manual-work reduction.
      whyItMatters: The investment case depends on automation efficacy rather than merely replacing one billing workflow with another.
      diligencePath: Request blinded customer cohorts, before/after denial data, manual-touch logs, and payer-mix normalized collections analyses.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE002
    - type: missing-source
      severity: minor
      topic: SDK release governance
      missingEvidence: Public SDK repositories show developer surfaces but do not disclose enterprise support SLAs, release cadence commitments, or backward-compatibility policy.
      whyItMatters: API-first customers need confidence that billing integrations will not break during Candid releases.
      diligencePath: Review SDK release notes, semantic-versioning policy, support SLAs, and customer migration communications.
      relatedQuestionRefs:
        - QE009
        - QE025
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: minor
      topic: Full product-line coverage
      missingEvidence: Candid does not publish a complete SKU catalog, module-level pricing, or full list of supported EHR / PM integrations beyond selected partner and API materials.
      whyItMatters: Product breadth and packaging affect implementation scope, attach rates, and competitive differentiation.
      diligencePath: Request module-level product packaging, integration catalog, roadmap backlog, and customer deployment mix by integration type.
      relatedQuestionRefs:
        - QE003
      relatedTableRefs:
        - TE001
