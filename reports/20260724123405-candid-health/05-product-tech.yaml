  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - control / quality marker
      - status
      - scope
      - gap
    rows:
      - - Type 2 SOC 2 examination
        - Completed according to Candid and PRNewswire release
        - Security, availability, and confidentiality controls for the RCM automation platform
        - Report details, exception testing, and latest bridge letter are not public
      - - HIPAA / PHI handling posture
        - HIPAA-sensitive workflow is implied by healthcare RCM data handling and docs warn against PHI in sandbox
        - Production and staging data handling; PHI must not be sent to staging
        - Full HIPAA policies and BAAs require customer diligence
      - - Production / sandbox environment separation
        - Documented
        - API traffic separates production and staging credentials / URLs
        - Sandbox does not exercise all production rules or adjudication behavior
      - - Payer information controls
        - Documented payer IDs and payer-name guidance
        - Claim submission and subscriber insurance-card fields
        - Payer IDs are not one-to-one, creating mapping-risk diligence needs
      - - SDK error handling and OAuth
        - Documented in SDK pages and docs
        - Customer developer integration and token management
        - Security review of SDK release provenance and dependency chain is private
      - - Cyber resilience and claims-infrastructure dependency
        - Sector risk demonstrated by Change Healthcare incident
        - External clearinghouses, payment systems, and claims workflows
        - Candid-specific redundancy, incident history, and recovery time objectives are not public
      - - Automation accuracy controls
        - Not independently disclosed
        - Claim autocorrection, rules engine, and AI agents
        - No public precision / recall, hallucination testing, or audited savings attribution located
    notes: >-
      Trust evidence is credible but incomplete: SOC 2 and environment controls are public, while model-safety controls, HIPAA contract artifacts, incident history, and clearinghouse resilience are private diligence items.
