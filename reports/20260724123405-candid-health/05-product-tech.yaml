company:
  name: Candid Health
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Candid Health’s public product evidence supports a concrete API-first RCM platform rather than a generic billing-service wrapper: official materials describe a unified clinical, billing, and provider-data model, configurable rules engine, AI agents, and tracked manual work loops, while the API docs expose encounter, eligibility, patient, payer, task, data-share, SDK, and environment surfaces. The strongest gaps are not whether a product exists, but whether Candid can independently prove automation accuracy, payer/clearinghouse resilience, model controls, and edge-case performance at enterprise scale.
sections:
  - id: s501
    title: Product definition and customer workflow
    body: >-
      Candid sells revenue-cycle automation for provider organizations that need to turn clinical encounters into collectible claims with fewer manual billing touches. The clearest definition comes from the Series D release: Candid calls itself an AI-first RCM platform and financial system of record that unifies clinical, billing, and provider data into a single model, then uses a configurable rules engine, AI agents, and touch tracking to automate work historically handled by billing teams. In customer workflow terms, that means Candid sits between EHR / practice-management systems, payer connectivity, claims operations, denial follow-up, patient billing, and reporting. Public pages emphasize claims submitted and finalized without human intervention, reductions in manual work, lower denials, and automation that prevents claim issues before they become costly. The API documentation supports this workflow framing because it starts with creating encounters and then expands into practice-management data, eligibility, payer information, claims data exports, and downstream task visibility.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
    tableRefs:
      - TE002
    figureRefs:
      - FE002
  - id: s502
    title: Modules, APIs, and operating architecture
    body: >-
      The public architecture is best read as a workflow platform with four product layers. First, Candid ingests and normalizes encounter, patient, coverage, payer, and provider context from customer systems. Second, it applies rules and automation to claim creation, pre-submission corrections, eligibility, and task routing. Third, it connects to external rails such as clearinghouses, payer identifiers, Elation, customer BI stacks, and SDK-supported developer environments. Fourth, it exposes reporting and data products, especially Candid Data Share, for transactional claim histories and analytics. The integration guide is unusually specific for a private company: minimum claim submission requires the Create Encounter API, service-line updates are recommended, additional patient and coverage endpoints are available for practice-management use cases, and eligibility can be checked through a synchronous passthrough endpoint. That operating model still leaves a diligence gap: the public stack reveals API surfaces and integration patterns, but not model-evaluation harnesses, payer-routing contracts, clearinghouse redundancy, or how Candid prevents AI-driven billing errors from reaching payers.
