tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - module / asset
      - primary user
      - status / maturity
      - differentiation
      - diligence gap
    rows:
      - - Unified RCM data model
        - Billing operations, revenue leaders, implementation teams
        - Company-claimed platform core in 2026 Series D materials
        - Brings clinical, billing, and provider data into one automation context
        - Public materials do not disclose schema governance, model lineage, or data-quality SLAs
      - - Configurable rules engine
        - Billing teams and operations admins
        - Marketed as a live automation layer and cited by partner / review pages
        - Autocorrects claim issues before submission and adapts to contracts / TINs
        - Rule authoring controls, testing harnesses, and rollback processes are not public
      - - AI agents and manual-touch loop
        - Candid automation and operations teams
        - Roadmap focus after Series D; public proof is company-claimed
        - Remaining manual touches are tracked so repetitive tasks can be eliminated
        - No independent model-accuracy, hallucination, or exception-resolution benchmarks located
      - - Encounter / claims API
        - Customer engineering teams and EHR / PM vendors
        - Documented and operational in API reference
        - Create Encounter is the minimum claim-submission integration surface
        - Public docs show endpoints, not customer-specific implementation failure rates
      - - Pre-encounter patient, coverage, and eligibility APIs
        - Front-desk, scheduling, eligibility, and product teams
        - Documented in integration guide and API reference
        - Can support eligibility checks before appointments and patient / coverage propagation
        - Sandbox eligibility is sample data only and depends on Change Healthcare in docs
      - - Candid Data Share and reporting exports
        - Finance, analytics, BI, and data platform teams
        - Documented as open data platform for datasets and transactional claim history
        - Lets customers sync RCM data into BI or data-lake infrastructure
        - Public docs do not disclose complete table coverage, latency, or data-quality guarantees
      - - Native Elation integration
        - Elation customers, provider groups, implementation teams
        - Preferred-partner marketplace listing with native integration
        - Gives an out-of-box EHR integration path beyond custom APIs
        - Native partner proof is strongest for Elation; breadth across other EHRs is less public
      - - SDKs and OpenAPI
        - Customer developers and partner engineers
        - Public Node, Python, Ruby, C# SDK repos and OpenAPI page
        - Lowers integration friction and exposes typed API clients
        - SDK repo activity and backward-compatibility policy require direct diligence
    notes: >-
      The matrix is a partial public product map; Candid does not publish a complete SKU catalog, internal model architecture, or payer-connectivity contract map.
