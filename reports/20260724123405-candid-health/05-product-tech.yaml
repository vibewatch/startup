  - id: s504
    title: Differentiation, trust controls, and diligence risks
    body: >-
      Candid’s most defensible differentiation is not a single feature; it is the combination of a unified revenue-cycle data model, rules engine, agentic automation, API-first integration surface, and Palantir-influenced data-engineering heritage. The contrast the company draws with incumbents is explicit: legacy players are described as failing to keep pace and some competitors are characterized as lightly sprinkling AI on legacy services. That is a useful wedge, but it is also the adverse diligence question. If automation accuracy is not measured rigorously, the same AI-first positioning could produce hallucinated coding suggestions, false-positive claim corrections, or opaque denial workflows. Trust evidence is partial but real: Candid publicly announced a Type 2 SOC 2 examination covering security, availability, and confidentiality, and the docs warn not to send PHI to sandbox. Sector sources around Change Healthcare and CAQH show why this matters: claims automation creates real efficiency upside, but payer connectivity and cyber resilience are mission-critical infrastructure dependencies.
    claimRefs:
