  - id: s503
    title: Deployment, integration, support, and roadmap
    body: >-
      Candid’s deployment story is stronger than a marketing-only product because the docs and partner pages show multiple implementation patterns. Customers can run a narrower claim-submission integration, push deeper patient and scheduling data into Candid, use the API directly, use SDKs, and connect reporting exports into BI or data lakes. The Elation marketplace page adds partner proof by describing Candid as a preferred partner with a native integration, open API-driven framework, and claims automation for multi-location practices and provider groups. The SDK record reinforces that Candid expects customer engineering teams to integrate directly: public Node, Python, Ruby, and C# SDK repositories exist, and the docs describe staging and production environments, OAuth, error handling, and OpenAPI access. The roadmap evidence is mostly investor and company claimed. Series D proceeds are framed around faster development and deployment of agentic RCM solutions that can handle edge cases once requiring humans, but no public benchmark shows the release cadence, precision / recall, or safety acceptance criteria for those agents.
