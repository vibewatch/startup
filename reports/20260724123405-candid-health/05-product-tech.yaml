  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / process / component
      - role
      - dependency
      - risk
    rows:
      - - Customer source systems
        - Supply encounter, patient, scheduling, coverage, and provider data
        - EHR / PM integrations, API payload quality, mapping work
        - Bad upstream data can automate bad claims faster
      - - API ingestion layer
        - Creates encounters and receives patient / coverage context
        - REST API, SDKs, OAuth, typed request / response models
        - Endpoint changes or versioning errors can disrupt billing operations
      - - Rules and AI automation layer
        - Applies pre-submission checks, corrections, and task automation
        - Configured rules, claim context, payer policies, model evaluation
        - Hallucination or false correction risk if controls are weak
      - - Payer and clearinghouse connectivity
        - Routes eligibility, claims, remittance, and payer identifiers
        - Payer CSVs, clearinghouse IDs, Change Healthcare / Availity-style rails
        - Outages or payer coverage gaps can block claims flow
      - - Manual exception / task layer
        - Captures remaining human touches and work queues
        - Task APIs, operational staffing, customer support playbooks
        - Edge cases may remain labor intensive and underreported
      - - Data Share / analytics layer
        - Exports claims data and transaction history for reporting
        - BigQuery connector, BI tools, data-lake syncs
        - Public docs do not quantify export completeness or latency
    notes: >-
      The architecture is inferred from public docs and product pages; Candid does not publish an internal model architecture, production incident history, or clearinghouse redundancy design.
