  topStrengths:
    - >-
      Exceptional company-reported traction: 190% YoY run-rate revenue growth and 180% net dollar
      retention in 2025 signal strong land-and-expand within provider organizations.
    - >-
      Differentiated AI-first, API-first architecture that unifies clinical, billing, and provider data
      into a single model, contrasting with legacy incumbents "sprinkling AI" on old systems.
    - >-
      Credible founder-market fit (two ex-Palantir operators) and a top-tier Series D lead (Sixth
      Street Growth) after ~40 customer reference calls with "off the charts" feedback.
    - >-
      Large, structurally growing market — U.S. RCM software/services ~$73B in 2026 with ~11-12% CAGR —
      and a persistent denials/administrative-cost problem that automation directly addresses.
  topRisks:
    - >-
      Undisclosed valuation and opaque absolute financials (no public revenue, ARR, gross margin, burn,
      or runway) make entry-price discipline and unit-economics assessment difficult.
    - >-
      Systemic RCM/cyber and HIPAA exposure — the 2024 Change Healthcare attack shows RCM vendors are
      high-value single points of failure — plus AI billing-accuracy/compliance liability risk.
    - >-
      Intense competition from scaled incumbents (Waystar, Change Healthcare/Optum, Availity, FinThrive)
      with large installed bases and switching costs, and AI-native peers (Adonis, Enter Health).
    - >-
      Customer concentration/opacity skewed toward fast-growing digital-health firms and MSOs, and
      two-founder key-person dependence.
  unresolvedGaps:
    - Exact Series D post-money valuation and share price (only "3x Series C" is disclosed).
    - Absolute revenue, ARR, gross margin, burn, runway, cash on hand, and headcount.
    - Named, verifiable production customer references and true customer/revenue concentration.
    - Independent verification of automation efficacy, denial-reduction, and net-collection-rate claims.
