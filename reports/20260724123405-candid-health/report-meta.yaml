companyProfile:
  summary: >-
    Candid Health is a San Francisco-based, AI-first healthcare revenue cycle management (RCM) platform
    founded in 2019 by two former Palantir operators, Nick Perry (CEO) and Doug Proctor (COO). The
    company unifies clinical, billing, and provider data into a single model and uses a configurable
    rules engine plus AI agents to automate the claims lifecycle — eligibility verification, claims
    submission, denial management, prior authorization, and payment posting — for more than 200
    healthcare organizations. In July 2026 it raised a $120M Series D led by Sixth Street Growth,
    lifting total funding above $219 million and tripling its February 2025 Series C valuation.
  foundedDate: '2019-01-01'
  founders:
    - name: Nick Perry
      role: Co-founder & CEO
      background: >-
        Led healthcare commercial operations at Palantir Technologies; worked with co-founder Doug
        Proctor at Palantir for about five years before founding Candid Health.
      claimRefs:
        - CO007
        - CO009
        - CO010
    - name: Doug Proctor
      role: Co-founder & COO
      background: >-
        Former Palantir enterprise/government lead focused on large-scale data engineering and
        automation; co-founded Candid Health with Nick Perry in 2019.
      claimRefs:
        - CO008
        - CO009
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >-
    Cloud-native, API-first RCM automation platform that unifies clinical, billing, and provider data
    into a single model and applies a configurable rules engine and AI agents to automate claims
    submission, eligibility verification, denial management, prior authorization, and payment posting,
    with native EHR integrations (e.g., Elation Health) and real-time revenue analytics.
  customerFocus: >-
    Digital health companies, large national management services organizations (MSOs), physician and
    specialty medical groups, and EMR/EHR companies across dozens of medical specialties.
  businessModel: >-
    Enterprise SaaS subscription with usage-based components tied to claim volume; value proposition is
    lowering cost to collect and raising net collection rates.
  stage: Series D
  fundingStatus: >-
    $120M Series D (July 2026) led by Sixth Street Growth with Oak HC/FT, 8VC, and Y Combinator;
    more than $219 million raised to date; Series D tripled the February 2025 Series C valuation.
