  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / model
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Competitive implication
    rows:
      - - Candid Health
        - Third-party estimate of $300-$800/provider/month; company-realized pricing not public
        - RCM automation, APIs, claims workflows, partner integration
        - Discounts, implementation costs, win rates, and gross margins not public
        - Pricing can support budgeting conversations but not underwriting-quality margin analysis
      - - Waystar
        - Enterprise suite pricing not public
        - End-to-end RCM, AI-powered platform, payments and workflow breadth
        - Module-level realized pricing and discounts not disclosed
        - Scale and suite breadth may matter more than transparent unit price
      - - FinThrive
        - Enterprise software / analytics packaging not public
        - Revenue integrity, optimization, Fusion data platform, agentic AI
        - Module bundling and service costs not public
        - Health-system buyers may consolidate analytics and RCM workflows
      - - Availity
        - Network / portal / clearinghouse economics not public
        - Provider portal, claims, eligibility, authorization, remits, APIs
        - Payer/provider contract terms and network fees not public
        - Distribution power can lower adoption friction even if pricing is opaque
      - - Optum / Change
        - Enterprise RCM and advisory pricing not public
        - Payer transparency, AI tools, denial reduction, end-to-end RCM
        - Post-breach resilience and redundancy costs not transparent
        - Scale is compelling but trust diligence is mandatory
      - - Ensemble
        - Fixed rate on collections with tiered incentives per company page
        - Outsourced labor, process improvement, RCM operations
        - Exact collection percentage and performance tiers not public
        - Clearer model than software suites, but less software-margin-like
      - - Adonis / ENTER
        - No public list price retained
        - AI agents, workflow automation, API-driven RCM, revenue-risk analytics
        - Realized ARR, gross margin, and implementation cost unknown
        - AI-native peers can pressure Candid feature pricing
    notes: >-
