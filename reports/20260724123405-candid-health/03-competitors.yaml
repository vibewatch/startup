  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Unified data model plus API-first automation
        - Waystar, Adonis, ENTER, and FinThrive can add or market similar AI workflows
        - high
        - >-
          Request customer-level proof of automation depth, error reduction, and payback versus named
          alternatives
      - - Digital-health and specialty-provider focus
        - athenahealth, EHRs, and vertical-specific vendors can defend workflow adjacency
        - medium
        - Segment win rates by specialty, EHR, and customer size
      - - Agentic RCM execution
        - Waystar has public scale and Black Book recognition for RCM-native agentic AI
        - high
        - Benchmark Candid against Waystar on autonomous resolution rate, denials, and implementation time
      - - Developer-friendly integration
        - ENTER also markets a 100% API-driven RCM platform
        - medium
        - Review API adoption, SDK usage, implementation cycle, and developer NPS
      - - Clearinghouse and payer connectivity through partners
        - Availity and Change have direct network and transaction scale
        - high
        - Map dependencies, payer coverage, redundancy, and economics by route
      - - Better automation than internal billing teams
        - Customers can continue in-house teams or automate scripts internally
        - medium
        - Require before/after FTE, denial-rate, and net-collection evidence by customer cohort
      - - Trust and compliance posture
        - Change Healthcare breach increased buyer focus on third-party concentration and cyber resilience
        - high
        - >-
          Diligence SOC 2, incident response, redundancy, payer-routing contingency, and concentration
          exposure
      - - Superior net collections and touchless claim rates
        - Public data does not disclose realized win rates or gross margin by competitor
        - high
        - Request data-room win-loss, gross-margin bridge, NCR/TCR cohort data, and churn reasons
    notes: >-
      Risk severity reflects competitive impact, not company-specific failure probability; each row maps to a
      diligence path rather than a resolved underwriting conclusion.
