  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Realized pricing and win-loss
      missingEvidence: >-
        Public sources do not disclose Candid’s realized price, discounting, gross margin, win rate, or
        deal-by-deal competitor comparisons.
      whyItMatters: >-
        Without this evidence, the chapter can compare positioning and distribution power but cannot prove
        Candid wins on normalized economics.
      diligencePath: >-
        Request CRM win-loss exports, pricing schedules, implementation fees, gross-margin cohorts, and named
        competitive displacement examples from management.
      relatedQuestionRefs:
        - QP014
        - QP027
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: Switching economics by segment
      missingEvidence: >-
        No retained public source quantifies switching cost, migration time, payer-route disruption, or staff
        retraining by customer segment.
      whyItMatters: >-
        Switching friction determines whether incumbent installed bases are a temporary obstacle or a durable
        moat.
      diligencePath: >-
        Interview churned prospects, review implementation plans, and compare migration timelines against
        Waystar, Availity, athenahealth, and internal billing teams.
      relatedQuestionRefs:
        - QP017
        - QP018
      relatedTableRefs:
        - TP004
    - type: conflicting-data
      severity: material
      topic: AI commoditization versus data-model moat
      missingEvidence: >-
        Public evidence supports Candid’s API/data-model wedge, but incumbents and AI-native peers also market
        agentic or AI-driven RCM capabilities.
      whyItMatters: >-
        If AI features commoditize, Candid’s moat must come from data quality, workflow depth, and customer
        outcomes rather than generic automation claims.
      diligencePath: >-
        Benchmark autonomous-resolution rate, denial recovery, implementation cycle, and net collection uplift
        by customer cohort against named competitors.
      relatedQuestionRefs:
        - QP004
        - QP023
        - QP024
      relatedTableRefs:
        - TP004
    - type: stale
      severity: minor
      topic: Fast-moving competitor AI launches and 2026 guidance
      missingEvidence: >-
        Competitor AI positioning, market-cap data, and RCM suite rankings can change quickly after the
        runDate.
      whyItMatters: >-
        The competitive map should be refreshed before term-sheet decisions because public incumbents can
        alter guidance or launch bundles quarterly.
      diligencePath: >-
        Refresh Waystar quarterly filings, Black Book/KLAS coverage, and AI-native peer product pages
        immediately before investment committee.
      relatedQuestionRefs:
        - QP021
        - QP028
      relatedTableRefs:
        - TP001
