callouts:
  - calloutType: strength
    title: Candid’s wedge is real where developers and modern provider operators matter
    body: >-
      The best evidence for differentiation is Candid’s API documentation, integration guide, and Elation
      partner proof. Those sources support a cloud-native, developer-friendly workflow story that legacy
      outsourced RCM firms are less likely to match quickly.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP042
  - calloutType: risk
    title: Waystar and Availity are not sleepy incumbents
    body: >-
      Waystar is already public, above $1 billion of annual revenue, and externally named in agentic RCM
      rankings, while Availity claims national-scale transaction reach. Their distribution can turn comparable
      AI features into buyer defaults.
    claimRefs:
      - CP010
      - CP016
      - CP019
      - CP020
      - CP037
      - CP044
  - calloutType: assumption
    title: Pricing and win-rate proof remain private-evidence gates
    body: >-
      Public sources do not prove realized Candid pricing, gross margin, win rates, or customer switching
      economics. Any investment case that assumes superior economics needs data-room validation rather than
      public-source inference.
    claimRefs:
