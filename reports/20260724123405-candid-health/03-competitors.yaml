      - FP002
  - id: pricing-packaging-and-buyer-trust
    title: Pricing, packaging, GTM, and trust posture
    body: >-
      Pricing is the weakest public comparison dimension. Candid has a third-party per-provider estimate, but
      the estimate is not a contract benchmark and does not reveal realized discounts, implementation
      economics, gross margin, or win rates. HealthSystemCIO’s KLAS coverage reinforces the broader issue:
      even deep adopters of RCM suites do not see true all-inclusive pricing, and added modules can carry
      extra charges. That opacity favors incumbents with procurement familiarity because buyers can
      rationalize the risk of paying for known suites, networks, or services even if a startup’s automation is
      technically better. Trust posture also cuts both ways. Candid can argue that cloud-native architecture
      and focused automation avoid brittle legacy layers, but the Change Healthcare cyberattack shows how
      mission-critical RCM infrastructure can become systemic operational risk when providers depend on a
      dominant third-party network.
    claimRefs:
      - CP008
      - CP023
      - CP024
      - CP025
      - CP038
      - CP039
      - CP048
    tableRefs:
      - TP003
  - id: switching-costs-lock-in-and-distribution-power
    title: Switching costs, lock-in, multi-homing, and distribution power
    body: >-
      Candid’s customers can multi-home. A provider could use Candid for claims automation, Availity for
      clearinghouse or payer portal workflows, Cohere for prior authorization, athenahealth or an EHR for
      practice management, and an outsourced partner for overflow labor. That flexibility reduces hard lock-in
      for Candid, but it also reduces the switching burden away from any single point solution. Incumbents
      have softer but powerful lock-in through transaction history, payer connectivity, enterprise procurement
      approvals, compliance reviews, and staff training. Availity’s network reach and Waystar’s installed base
      are especially important because distribution power can convert incremental AI features into broad
      adoption faster than a startup can win each account one by one. Candid’s defensibility therefore depends
      on becoming a financial system of record, not merely a claims-workflow optimizer.
    claimRefs:
      - CP013
      - CP019
      - CP020
      - CP021
      - CP029
      - CP035
      - CP036
      - CP044
      - CP049
    tableRefs:
      - TP004
  - id: moat-durability-and-verdict
    title: Moat durability, commoditization risk, and verdict
    body: >-
      The retained evidence supports a real but not yet impregnable Candid moat. The positive case is that
      Candid is purpose-built for modern provider organizations, has API-level depth, presents a unified data
      model, and uses agentic automation to remove manual billing work. The adverse case is equally concrete.
      Waystar already has public-company scale and independent recognition for agentic RCM; Availity controls
      a national transaction network; Optum and Change demonstrate the scale and systemic importance of
      incumbent infrastructure; Adonis and ENTER show that AI-native feature competition is already forming;
      and KLAS coverage suggests suite vendors can keep customers despite integration and pricing
      imperfections. The competitive verdict is that Candid can win where buyers value automation depth and
      developer-friendly integration, but must prove that those advantages survive bundled AI from incumbents
      and rapid feature imitation by peers.
    claimRefs:
      - CP016
      - CP025
      - CP031
      - CP033
      - CP038
      - CP039
      - CP042
      - CP043
      - CP044
      - CP045
      - CP050
    figureRefs:
      - FP003
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target customer
      - Product scope / pricing
      - Strategic direction / limitation
    rows:
      - - Candid Health
        - AI-first RCM platform
        - Series D; more than $219M raised; >200 organizations and about $7B annual claim volume reported
        - Digital health, specialty groups, MSOs, EHR partners
        - API-first RCM automation; third-party estimate $300-$800/provider/month is not realized pricing
        - Best wedge in modern provider workflows; public win-rate and margin data unavailable
      - - Waystar
        - Scaled RCM suite incumbent
        - Public; FY2025 revenue $1.099B; 112% NRR; ~$4.14B market cap on runDate
        - Hospitals, health systems, provider organizations, payment workflows
        - End-to-end RCM platform; pricing not transparent
        - Agentic AI plus installed base is the most direct adverse scale threat
      - - FinThrive
        - Health-system RCM analytics / revenue integrity
        - Private / PE-owned incumbent with Fusion platform positioning
        - Health systems and revenue integrity teams
        - Revenue integrity, optimization, learning content, agentic AI; pricing not public
        - Can bundle analytics and compliance depth for enterprise buyers
      - - Availity
        - Clearinghouse / payer-provider network
        - Claims more than half of U.S. healthcare transactions; 13B annual portal transactions
        - Payers, providers, health IT partners
        - Eligibility, authorizations, claims, remits, portal and APIs; network-priced packaging undisclosed
        - Distribution power and payer connectivity create lock-in
      - - Optum / Change Healthcare
        - Mega-incumbent RCM / transaction infrastructure
        - Change processes about 15B transactions annually; Optum markets end-to-end RCM
        - Large providers and payers
        - RCM, payer transparency, AI tools, advisory; pricing not public
        - Scale and trust offset by ransomware-concentration risk
      - - Ensemble Health Partners
        - Outsourced RCM services
        - Private outsourced RCM firm with Best-in-KLAS positioning
        - Hospitals and health systems that want managed operations
        - Fixed rate on collections plus tiered incentives
        - Labor-plus-process model substitutes for software-led automation
      - - athenahealth
        - EHR-adjacent enterprise RCM
        - athenaIDX trusted by 200,000+ providers; 375M+ claim/remit transactions yearly
        - Enterprise healthcare, specialty networks, large provider groups
        - athenaIDX RCM plus EDI and APIs; pricing not public
        - Workflow adjacency can defend against standalone RCM entrants
      - - Veradigm
        - Practice-management / EDI adjacency
        - Publicly visible Payerpath EDI / claims workflow surface
        - Provider organizations needing EDI and practice workflow connectivity
        - Payerpath clearinghouse and claims workflow; pricing not public
        - Adjacent route through existing practice-management and EDI relationships
      - - Adonis
        - AI-native RCM peer
        - Private; public customer proof and AI-agent positioning but scale undisclosed
        - Providers and hospitals optimizing denials, delays, payer friction
        - AI orchestration and agents; pricing not public
        - Feature overlap with Candid’s AI automation wedge
      - - ENTER Health
        - AI-native RCM peer
        - Private; claims >98.5% contract value collected and API-driven platform
        - Provider organizations wanting API-driven RCM and AI assistant layer
        - ENTER RCM plus CTRL ENTER AI layer; pricing not public
        - Strong API-native positioning but public scale evidence is limited
    notes: >-
      Rows cover the material direct, incumbent, adjacent, substitute, status-quo, and likely-entry categories
      supported by retained public sources; scale fields mix public reported metrics and vendor claims.
