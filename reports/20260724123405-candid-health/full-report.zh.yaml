      - number: '2.3'
        title: 买方、用户、付费方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方集合按医疗交付复杂度和平台杠杆切分。医院和医疗系统有董事会层面的现金保护需求，暴露在支付方摩擦中，重视拒付预防，集成环境也重，因此 ACV
              高但采购周期慢。医生集团和专科诊所承担同样的工作，只是规模较小：资格核验、编码、理赔提交、回款入账、拒付工作清单和患者收款。数字医疗公司和 MSO 有吸引力，因为它们的理赔量往往比后台团队扩张更快，也更早采用
              API 优先基础设施。EMR/EHR 供应商以及 Elation 这类合作伙伴，代表渠道或嵌入式工作流路径，而不只是直销医疗服务提供方。经济买方通常是 CFO、收入周期负责人、COO
              或平台产品负责人；用户是账单团队、编码员、前台资格核验人员、拒付专员和财务分析师。采用通常先从数据集成和工作流验证开始，推进到选定 RCM 模块；当信任和 ROI 被证明后，才会进入更广泛的记录系统整合。
