  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 强增长和市场证明导向继续研究，因为估值和单位经济性证据仍缺失。
    data:
      nodes:
        - id: n1
          label: 大型 RCM 市场
          detail: 美国 RCM 市场 2026 年估计为 $72.96B，CAGR 为两位数。
          tone: positive
        - id: n2
          label: Candid 增长证明
          detail: 190% ARR 增长、180% NDR、200+ 客户和 $7B 年理赔规模。
          tone: positive
        - id: n3
          label: 产品 / 工作流深度
          detail: 财务记录系统、API 文档和 EHR 集成支撑工作流嵌入。
          tone: positive
        - id: n4
          label: 估值不透明
          detail: Series D 估值较 Series C 翻了三倍，但确切价格和条款未公开。
          tone: negative
        - id: n5
          label: 行业和可比公司风险
          detail: Waystar 倍数、Change Healthcare 数据泄露和 AI-RCM 竞争压制溢价假设。
          tone: warning
        - id: n6
          label: 建议
          detail: 继续研究；中等置信度；高风险；在未披露的溢价定价下，估值立场偏紧。
          tone: warning
      edges:
        - to: n6
          from: n1
        - to: n6
          from: n2
        - to: n6
          from: n3
        - to: n6
          from: n4
        - to: n6
          from: n5
