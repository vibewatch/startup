      - number: '1.1'
        title: 身份定位、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Candid Health 最准确的定位，是一家私营、Series D 阶段医疗基础设施公司，向医疗服务提供方销售自主式收入周期管理软件，而不是泛化的账单服务商。当前最强的身份依据来自 2026 年 7 月
              Sixth Street 公告和独立医疗科技报道：两者都把公司描述为 AI 优先 RCM 平台，先统一临床、账单和提供方数据，再用规则与 AI 智能体自动化手工理赔工作。规范成立年份为 2019
              年，公开加速器证据将公司与 Y Combinator W20 关联。总部证据指向旧金山；旧金山、纽约和丹佛也反复作为办公室或招聘地点出现。因此，一句话商业模式是：Candid 销售 API 优先的 RCM
              自动化平台，通过自动化理赔提交、拒付管理和相关账单流程，帮助医疗服务提供方降低收款成本、提高回款。
