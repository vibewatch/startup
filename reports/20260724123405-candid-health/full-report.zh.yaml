  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Waystar
        - 上市 RCM 软件公司；FY2025 收入、FY2026 指引、NRR、EBITDA 利润率、2026 年 7 月市场数据
        - FY2025 收入 $1.099B；FY2026 指引 $1.274B-$1.294B；NRR 112%；调整后 EBITDA 利润率 42%；市值约 $4.1B-$4.2B；EV/收入约 4.6x。
        - Waystar 是规模化医疗支付平台的最佳公开 RCM 软件估值锚。
        - 规模远大于 Candid，且已上市、盈利、更成熟；不是成长阶段 AI 原生可比公司。
      - - Change Healthcare / Optum
        - 战略性 RCM 基础设施 M&A 先例
        - UnitedHealth/Optum 完成 $13B 交易；用公开收入参照粗算，EV/sales 约 3.7x。
        - 显示规模化理赔基础设施和支付方 / 医疗机构连接的战略价值。
        - 被收购资产规模更大，之后遭遇重大网络安全事件，凸显下行风险。
      - - athenahealth
        - 私有医疗 IT 平台 / PE 结果参考
        - UpsideList 将 athenahealth 描述为当前估值 $17B、上行至 $29.75B 的情景；这里只作为平台规模参考。
        - 说明嵌入式医疗 IT 工作流平台可获得战略估值。
        - 不是纯 RCM 可比公司；保留来源为二级来源，置信度较低。
      - - Adonis
        - AI 原生 RCM 私募融资可比公司
        - $40M Series C 轮于 2026 年 3 月完成；累计融资超过 $95M；公司称 2025 年收入增长 4x，净留存 >130%。
        - 显示创投资本仍愿意押注 AI 原生 RCM 和拒付管理自动化。
        - 确切估值和收入基数未披露；规模更小，阶段也可能早于 Candid。
      - - Enter Health
        - AI 驱动 RCM 私募可比公司
        - Tracxn 将 Enter 定位为 AI 驱动的 RCM，公开融资信息有限；Enter 自身主打服务 RCM 运营的 AI 层。
        - 竞争信号很明确：智能体式 RCM 已经拥挤，并非 Candid 独有。
        - 保留来源中未公开当前估值或近期融资轮次细节。
      - - 医疗 IT 市场倍数
        - HGP / HIT Consultant 2026 年 7 月市场回顾
        - HGP 医疗 IT 收入倍数回升至 4.7x；RCM Tech 收入倍数中位数为 6.0x。
        - 为私有估值纪律提供当前大盘护栏。
        - 大类口径混合了规模、利润率、增长和商业模式。
      - - 医疗软件估值指南
        - Auxo 2026 年医疗软件指南
        - 低个位数到高个位数 EV/revenue 或 EV/ARR 倍数较常见；稀缺高增长平台可达到两位数。
        - 支持采用宽但有纪律的倍数区间，而不是直接假定溢价。
        - 咨询类指南，不是 Candid 专属交易证据。
    notes: 这个抽样可比集横跨上市 RCM 软件、战略并购、私有 AI-RCM 轮次和广义医疗 IT 倍数参考；Candid 未披露收入，因此各行只是框定可能的估值逻辑，而不是证明某个价格。
