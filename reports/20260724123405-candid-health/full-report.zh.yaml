      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              结构性驱动很强：支付方规则更易变，拒付压力实质存在，事前授权仍是工作流瓶颈，云和 AI 采用已成为董事会主议题，医疗服务提供方整合也提高了对标准化财务操作系统的需求。Black
              Book、McKinsey、Adonis、Experian 和 Auxis 都显示，RCM 正从后台账单转为战略性现金控制。与此同时，约束异常高，因为 Candid 触及
              PHI、报销现金流、支付方连接和临床文档。买方必须信任自动化，承受实施扰动，满足 HIPAA 和安全义务，并证明从旧系统或外包供应商切换有合理性。Change Healthcare 攻击是一个不利市场提醒：中心化
              RCM 基础设施可能变成系统性风险。因此，尽调应保留相互冲突的规模估计，要求私有的分部管线和胜率数据，按分部测试拒付和净回款
              ROI，并在把头部市场视为近期可获得收入之前，验证集成负担、网络安全姿态和回本周期。实践中，采用漏斗应按分阶段的现金控制转型来承销，而不是简单的点状方案替换。
