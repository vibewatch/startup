  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 网络 / PHI 敞口
        - 安全或隐私事件
        - 重大泄露、OCR / 州总检察长问询，或无法提供最新 SOC 报告和渗透测试摘要
        - 暂停投资，直到根因、整改、保险和客户通知敞口全部闭环
      - - AI 计费准确性
        - 理赔 QA 和支付方拒付指标
        - 模型驱动错误、错编码模式、高退款敞口或审计轨迹薄弱
        - 将自动化护城河视为未证实，并下调增长和利润率假设
      - - 连接 / 宕机风险
        - 正常运行时间和交易可用性
        - 支付方、清算所、API 或云反复宕机，且没有稳健故障切换
        - 下调可靠性判断，并要求 SLA、冗余和事故响应证明
      - - 客户集中度
        - 头部账户和细分披露
        - 前五大客户、单一细分或单一合作渠道主导收入或理赔量
        - 扩大流失下行情景，并在承销中要求留存 / 集中度约束
      - - 估值 / 私有指标不透明
        - Series D 估值、烧钱和利润率证据
        - 公司在 NDA 下仍无法披露估值、资金续航、毛利率、抽成率、NRR 方法或队列数据
        - 延后价格敏感型建议，或要求估值折扣
      - - 执行扩张
        - 实施和支持指标
        - 上线时间拉长、人工触点率居高不下，或支持积压增长快于收入
        - 下调自动化可扩展性和利润率假设
      - - 监管 / 支付方规则变更
        - 支付方规则和 CMS 变更管理节奏
        - 重大 CMS 或支付方规则变更无法在不扰动客户的情况下落地
        - 承销前要求更强的监管运营和支付方变更监控
    notes: 否决标准特意设为可通过尽调文件、运营仪表盘或公开不利事件观察。
