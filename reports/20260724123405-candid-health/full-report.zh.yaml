  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Candid 向医疗服务提供方销售收入周期自动化，帮助它们用更少手工账单触点把临床就诊转化为可回款理赔。最清晰的定义来自 Series D 新闻稿：Candid 称自己是 AI 优先 RCM
              平台和财务记录系统，把临床、账单和提供方数据统一为单一模型，再用可配置规则引擎、AI 智能体和触点追踪，自动化过去由账单团队处理的工作。放在客户工作流里，Candid 位于 EHR /
              诊所管理系统、支付方连接、理赔运营、拒付跟进、患者账单和报告之间。公开页面强调无需人工介入即可提交并结案理赔、减少手工工作、降低拒付，以及在理赔问题变得昂贵之前预防问题的自动化。API
              文档支撑了这种工作流框架，因为它从创建就诊开始，随后扩展到诊所管理数据、资格核验、支付方信息、理赔数据导出和下游任务可见性。
