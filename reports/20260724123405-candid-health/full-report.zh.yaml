            body: >-
              Candid Health 有很多后期垂直软件赢家该有的要素：庞大的 RCM 市场、AI 优先的产品叙事、200 多家医疗组织、约 $7B 年理赔量、2025 年年化合约收入增长 190%、净美元留存
              180%，以及 2026 年 7 月由 Sixth Street Growth 领投的 Series D。投资假设是，Candid
              正在用一个平台重建破损的财务流程；该平台可以在提供方集团内扩张，最终更像关键任务型医疗支付系统，而不是服务供应商。反方观点是估值纪律。Series D 估值是 Series C
              的三倍，但保留的公开来源没有披露准确投后估值、当前
              ARR、毛利率、每股价格、清算优先权，也没有证明这次涨价由软件式经济性支撑，而不是由理赔量观感支撑。基于公开证据的建议是继续研究，信心中等、风险高；如果入场价超过 $1B 且没有私有尽调，估值立场应视为偏紧。
