      - CV034
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - 最新估值
        - Series D 轮投后估值、每股价格、409A、二级交易价格以及任何结构化股权条款。
        - 没有价格，建议就无法升级为买入，也无法用回报测算跟踪。
        - 向管理层或领投方索取融资备忘录、董事会同意书、条款清单和股权结构表。
      - - 股权结构和优先权
        - 清算优先权、参与权、高级证券、期权池补充和备考稀释。
        - 即使经营改善，优先权包袱也可能抹掉普通股上行。
        - 审阅章程修订、投资者权利和股权结构分配瀑布。
      - - 收入质量
        - 当前 ARR、年度合同年化收入定义、队列收入、已签管线和客户集中度。
        - $7B 索赔量指标不能替代已经货币化的收入。
        - 按客户队列和索赔类型获取收入桥。
      - - 毛利率与自动化经济性
        - 毛利率、实施成本、人工触达率、拒付管理 ROI 和收款成本改善。
        - 决定 Candid 值不值得给软件倍数，还是应按服务型估值。
        - 审阅管理层模型、客户案例和支持人力分析。
      - - 留存方法
        - NDR 队列定义、扩张 / 收缩拆分、客户数流失，以及支付方 / 提供方组合。
        - 180% NDR 只有建立在耐久队列上才有分量。
        - 索取队列瀑布和客户级续约历史。
      - - 安全与合规
        - SOC 2 / HIPAA 证据、事件历史、BAA 覆盖、支付方连接冗余和灾备测试。
        - RCM 平台处理敏感数据和索赔工作流；泄露会压低估值。
        - 审阅审计、渗透测试、事件日志和保险公司问卷。
      - - 竞争胜负
        - 与 Waystar、Optum / Change、Adonis、Enter 和 EHR 原生模块的正面对比结果。
        - 倍数取决于可持续差异化，而不是泛泛的 AI 账单语言。
        - 开展客户访谈，复盘销售管线胜负。
      - - 退出路径
        - 上市公司准备度、战略收购方地图、反垄断问题和 IPO 收入门槛。
        - 退出准备度决定 Series D 投资人能否达到目标回报。
        - 向投行和战略方询问退出可比交易与最低规模门槛。
    notes: 这些问题是把本章从基于公开证据的继续研究，转成价格敏感承销备忘录所需的最低材料包。
    claimRefs:
      - CV004
      - CV008
