              Candid 的公开财务故事，机制强于披露金额。公司向医疗服务提供方销售自主式医疗收入周期管理平台；可见产品表面覆盖基于 API
              的理赔创建、理赔提交、资格核验、财务数据、账单服务，以及旨在减少手工工作、改善回款结果的 AI 自动化。这支持简报中的商业模式框架：企业 SaaS
              订阅加与理赔量挂钩的用量经济，是正确的尽调假设；但公开来源仍未披露实际合同形式、标价、折扣、最低消费、收入分成或按回款比例抽成。收入确认问题因此很重要。投资人应把经常性平台访问、基于理赔量的用量收入、实施 /
              集成服务和任何外包账单服务收入拆开，再评估披露的 190% 合同 run-rate 增长是否具备 ARR 质量。公开证据也显示购买动作是询价式，而不是透明标价，因此每笔理赔的实际总收入和 Candid
              留存的净收入仍属私密。
