  - id: TV005
    title: 推翻投资假设与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 估值仍不透明
        - 尽调中未共享条款清单、投后估值、每股价格、409A、二级交易价格或清算优先权。
        - 入场纪律无从建立，目标回报测算也无法验证。
        - 不投资；维持继续研究，或下调为回避。
      - - ARR 低于索赔量估算
        - 当前 ARR 或年度合同年化收入明显低于 $35M-$140M 示例区间。
        - 说明索赔量头条指标没有转化为软件收入。
        - 按悲观情景重新定价，或回避高溢价轮次。
      - - 毛利率 / 服务占比不及预期
        - 毛利率服务成分重，或实施成本吃掉自动化收益。
        - 模型从软件可比公司变成劳动力驱动的 RCM 服务。
        - 避免给两位数收入倍数。
      - - NDR 明显走弱
        - 净美元留存大幅低于已披露的 180%，且缺乏可信扩张桥。
        - 削弱最强的增长质量主张。
        - 若定价有溢价，从继续研究下调为回避。
      - - 安全或支付方网络事件
        - 重大停摆、泄露、索赔路由故障，或未解决的 HIPAA / 安全审计问题。
        - Change Healthcare 先例显示，RCM 基础设施故障可能具有系统性且代价高昂。
        - 暂停投资，直到修复结果和客户影响得到证明。
      - - 竞争改变买方经济性
        - Waystar、Adonis、Enter、Optum / Change 或 EHR 厂商将自动化打包到足以压缩 Candid 胜率或定价的程度。
        - 削弱增长、留存和退出可选性。
        - 要求更低入场倍数，或放弃交易。
    notes: 每个触发器都把尽调或可监测的经营事件连接到投资动作。
    claimRefs:
