            body: >-
              2026 年 7 月 Series D 明显改善了近期资本充足性，但公开证据仍不足以支撑跑道测算。Candid 融资 $120 million，报告累计融资超过 $219
              million，并披露资金用途包括团队扩张、自动化 / 工具建设和智能体式 RCM 部署。这与在大型 RCM
              自动化市场中的激进增长计划一致，但不等同于手头现金、烧钱速度、债务或下一轮触发条件披露。反向视角有两层。第一，Change Healthcare
              攻击显示，理赔基础设施可能制造系统性运营和医疗服务提供方现金流风险，因此韧性和信任投入可能是不可谈判的成本。第二，Waystar
              公开文件警示，定价压力可能压缩该品类利润率。因此结论是“有前景但披露不足”：留存和合同增长强劲，使收入质量看起来较高；但在 Candid 提供 ARR
              金额、实际定价、毛利率、烧钱、现金、跑道、员工数和债务细节之前，承销仍被卡住。
