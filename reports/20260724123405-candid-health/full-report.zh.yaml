      - number: '7.4'
        title: 财务与人员风险，本质是在私有指标可见前为完美执行定价
        blocks:
          - type: paragraph
            body: >-
              财务风险主要来自不透明和预期。Candid 有强劲的公开增长说法、$120M Series D，以及 Sixth Street
              背书，但具体美元估值、烧钱速度、跑道、毛利率、净收入留存口径、实施毛利、抽成率和客户集中度都未披露。这就形成典型的后期私募轮承销难题：公司可能很优秀，但公开证据无法证明价格是否已把无瑕执行全部资本化。Waystar
              的公开规模说明，赢下 RCM 的回报可以很大且可盈利，但也设下很高的运营标尺，并给既有厂商留下捆绑、复制或激进定价的空间。人员风险类似。Nick Perry 和 Doug Proctor 是可信的前
              Palantir 创始人，仍是叙事核心；Candid 的地域招聘版图也显示公司在扩张。剩余暴露在于，公司能否扩展实施、支持、合规、安全和 AI 模型运营，同时不丢掉创始人主导公司的执行强度。
