      - number: '7.5'
        title: 缓释成熟度中等，但尽调门槛和否决标准必须清晰可观察
        blocks:
          - type: paragraph
            body: >-
              可见的缓释栈有意义但不完整。SOC 2 Type 1 和 Type 2
              公告、HIPAA/商业伙伴姿态、技术文档、具名集成和新融资，都降低了风险无人管理的概率。它们没有回答真正决定投资的问题：正常运行时间和事故记录；逐支付方的一次通过率和拒付结果；人工介入率；模型监控；质量保证；头部客户集中度；云冗余；安全发现；网络保险；以及客户合同限制。因此，监控应由事件驱动。重大安全事件、反复支付方连接失败、无法证明理赔准确率、人工工作量意外偏高、负面执法或账单完整性指控、下调估值融资，或拒绝分享集中度数据，都应打断或暂停投资假设。反过来，若
              SOC 报告、BAA、DPA、头部客户、模型 QA 和交易韧性尽调干净，剩余风险可从高降至中等。
