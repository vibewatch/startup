  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 等效收入已达 $120M-$160M，或很快增长到该区间；NDR 维持在 180% 附近；毛利率接近软件；实施可复制；安全姿态达到企业级。
        - 采用 7.5x-10.0x 稀缺平台收入倍数，示意估值为 $900M-$1.6B；只有入场价格在稀释后仍支持至少 3x 预期回报时才投资。
        - 执行、支付方连接和竞争仍关键；如果公司服务占比高，下行会急剧放大。
        - 有可能，但需要公开证据中没有的私有证明。
      - - 基准
        - 理赔量变现落在约 $60M-$100M ARR 等效收入；增长仍高但回归常态；倍数维持在医疗 IT / RCM 参照的 4.7x-6.0x 左右。
        - 示意估值区间为 $280M-$700M；只有入场低于最新隐含估值，或条款能保护下行时才跟踪。
        - 稀释、优先权悬置和收入质量不确定性会侵蚀回报。
        - 最贴近当前公开记录：势头强，价格证据弱。
      - - 悲观
        - ARR 等效收入为 $30M-$50M；毛利率受服务业务拖累；NDR 回归常态；行业倍数压缩到公开 Waystar 水平或更低。
        - 示意估值区间为 $150M-$350M；避免溢价二级市场买入，以及任何只按表观增长定价的轮次。
        - 倍数压缩、安全事件、支付方故障、客户流失，或自动化 ROI 疲弱。
        - 该情景重要，因为确切估值和当前收入均未披露。
    notes: 情景区间根据 $7B 理赔量和 2026 年医疗 IT / RCM 倍数参照估算；并非公司披露估值。
