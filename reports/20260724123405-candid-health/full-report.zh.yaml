  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Candid 的收入和定价均未披露，示意价值区间差异很大。
    data:
      items:
        - label: 悲观 / 倍数压缩情景
          low: 150
          mid: 250
          high: 350
          detail: 估算 ARR 等值为 $30M-$50M，对应约 3x-7x 收入。
        - label: 基准 / 审慎情景
          low: 280
          mid: 500
          high: 700
          detail: 估算 ARR 等值为 $60M-$100M，对应约 4.7x-7x 收入。
        - label: 乐观 / 稀缺平台情景
          low: 900
          mid: 1250
          high: 1600
          detail: 估算 ARR 等值为 $120M-$160M，对应约 7.5x-10x 收入。
    approximationNotes: 美元数值单位为百万美元。收入由 $7B 理赔处理额和示意性 RCM 抽成率假设估算；区间并非公司披露的估值。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Candid 在增长和市场上得分高，在估值可见度和下行控制上得分较低。
    data:
      items:
        - label: 市场吸引力
          score: 8.5
          detail: RCM 支出池大，叠加 2026 年市场增长顺风。
        - label: 增长验证
          score: 9
          detail: 如果队列定义成立，190% ARR 增长和 180% NDR 属于异常强劲。
        - label: 客户验证
          score: 8
          detail: 200+ 家机构，另有近 40 通投资人客户访谈。
        - label: 产品差异化
          score: 7.5
          detail: AI 优先的财务记录系统，以及 API/EHR 工作流证据。
        - label: 可比公司支撑
          score: 6
          detail: 上市和私募可比公司能支撑投资兴趣，但不能锚定精确定价。
        - label: 经济性可见度
          score: 3
          detail: 收入金额、毛利率和抽成率均未公开。
        - label: 估值透明度
          score: 2
          detail: Series D 估值方向已公开；确切估值和条款未公开。
        - label: 风险控制
          score: 4.5
          detail: 网络安全、支付方网络、竞争和优先权风险都要尽调。
    approximationNotes: 评分是基于留存证据给出的 0-10 序数投资委员会判断。
