      - number: '7.2'
        title: 监管和法律风险主要来自 HIPAA、支付方规则变化、AI 不确定性和账单准确性责任
        blocks:
          - type: paragraph
            body: >-
              监管 / 法律清单应当按严重度读成一张风险地图，而不是 Candid 已知违规事项列表。保留的公开来源没有显示针对 Candid
              的执法、诉讼或制裁，但没有公开记录不等于没有私下争议。法律负担来自商业模式本身：医疗 RCM 平台可能接触 PHI、影响理赔编码、串起预授权或拒付流程，并在客户各自的
              BAA、DPA、赔偿条款和支付方规则下运转，而这些条款很少公开。HHS 让商业伙伴对部分 HIPAA 义务承担直接责任；HIPAA 关于 AI 和医疗数据的指引也意味着，处理 PHI
              的自动化工具需要严谨治理。CMS 的预授权和 No Surprises Act 材料显示，支付方—提供方交易规则仍在变化。投资含义不是只因法律风险否决
              Candid，而是在按溢价估值承销前，要求提供客户合同包、审计日志、理赔错误准备金、安全报告，以及律师确认的诉讼 / 执法检索结果。
