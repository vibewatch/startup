              Candid 没有披露毛利率、收入成本、托管成本、实施成本、支持人员配置、拒付管理劳动力或人工复核负担。公开来源仍然指出了需要尽调的主要成本驱动：实施和交付团队、API
              集成、理赔质量运营、AI/自动化工具、安全与合规、支持，以及任何外包账单服务劳动力。客户 ROI 目标很清楚——降低收款成本、提高净回款——因为 HFMA 式 RCM KPI、CAQH/DataSpring
              自动化节省评论和收款成本基准都指向医疗服务提供方行政浪费这一大预算池。可比视角应看 Waystar，不是因为 Candid 已上市或同样成熟，而是 Waystar 展示了规模化 RCM
