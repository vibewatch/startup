            body: >-
              可比组支持纪律，而不是机械加溢价。Waystar 是最干净的公开 RCM 软件锚点：收入超过 $1B，NRR 为 112%，调整后 EBITDA 利润率 42%；2026 年 7 月市场数据隐含
              EV/收入倍数大致在中个位数。这与一家收入金额未公开的私营公司，在规模和盈利能力上差异很大。Change Healthcare 被 Optum 以 $13B
              收购，提供了战略基础设施先例；但之后的网络安全事件也反向提醒，清算所和 RCM 平台会制造系统性运营和合规暴露。Adonis 和 Enter Health 表明，AI 原生 RCM 仍能融资、竞争仍活跃；更广泛的
              2026 年 医疗 IT 倍数数据集中在中个位数收入倍数。Athenahealth 式平台结果说明上行存在，但证据不足以默认每个 AI-RCM 平台都该拿两位数收入倍数。
