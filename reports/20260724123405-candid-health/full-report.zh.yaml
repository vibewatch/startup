      - number: '8.4'
        title: 退出就绪、最终尽调问题和投资假设破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Candid 比典型早期医疗 AI 公司更接近退出语境，因为它有 Series D
              赞助、快速增长、报告的高留存、由理赔量体现的规模，以及在大型行政开支池里端到端工作流位置。尽管如此，退出就绪只是可想象，而非已证实。上市路径需要经审计的收入质量、利润率可见性、实施可复制性、安全姿态，以及能映射到
              Waystar 式耐久性、而非服务密集型 RCM 人力套利的故事。战略退出则要求买方在 Change Healthcare 先例之后，仍愿意接受集中度、数据、支付方连接、HIPAA
              和反垄断相邻风险。因此，决定性的尽调问题是估值和单位经济：实际 ARR、净收入留存口径、按 客户群的毛利率、客户集中度、理赔量货币化、拒付改善证明、安全控制和股权结构
              条款。这些项目不过关，应让建议停留在继续研究，或转为规避。投资者应把这套缺失材料视为估值关键，而不是流程性事项。
