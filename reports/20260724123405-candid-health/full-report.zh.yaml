companyProfile:
  summary: >-
    Candid Health 是一家总部位于旧金山、AI 优先的医疗收入周期管理（RCM）平台，2019 年由两位 Palantir 前运营者 Nick Perry（CEO）和 Doug
    Proctor（COO）创立。公司把临床、账单和提供方数据统一进单一模型，叠加可配置规则引擎和 AI 智能体，自动化理赔生命周期——资格核验、理赔提交、拒付管理、事前授权和回款入账——服务超过 200 家医疗机构。2026 年 7
    月，公司完成 Sixth Street Growth 领投的 $120M Series D，累计融资超过 $219 million，估值较 2025 年 2 月 Series C 增至 3 倍。
  foundedDate: '2019-01-01'
  founders:
    - name: Nick Perry
      role: 联合创始人兼 CEO
      background: 曾在 Palantir Technologies 负责医疗商业运营；创立 Candid Health 前，与联合创始人 Doug Proctor 在 Palantir 共事约五年。
      claimRefs:
        - CO007
        - CO009
        - CO010
    - name: Doug Proctor
      role: 联合创始人兼 COO
      background: Palantir 前企业 / 政府业务负责人，专注大规模数据工程和自动化；2019 年与 Nick Perry 共同创立 Candid Health。
      claimRefs:
        - CO008
        - CO009
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >-
    云原生、API 优先的 RCM 自动化平台，将临床、账单和提供方数据统一为单一模型，并用可配置规则引擎和 AI 智能体自动化理赔提交、资格核验、拒付管理、事前授权和回款入账；同时具备原生 EHR 集成（如 Elation
    Health）和实时收入分析。
  customerFocus: 数字医疗公司、大型全国性管理服务组织（MSO）、医生与专科医疗集团，以及横跨数十个专科的 EMR/EHR 公司。
