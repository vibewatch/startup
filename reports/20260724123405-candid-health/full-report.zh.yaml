              套件、支付方-医疗服务提供方网络、清算所、外包 RCM 公司、EHR 相邻平台、点状工作流自动化工具、内部账单团队和自研脚本。Candid 最有利的切入场景，是数字医疗、专科集团、MSO
              和技术前置型医疗服务机构；这些买方相较医院套件广度，更重视 API、统一数据模型和自动化。最不利的切入点，是对抗已经拥有交易网络、支付方关系、企业采购信任或 EHR
