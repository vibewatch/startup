      - number: '2.2'
        title: 市场规模口径及估算冲突原因
        blocks:
          - type: paragraph
            body: >-
              市场规模记录支持多种口径，而不是一条干净的 TAM/SAM/SOM。Towards Healthcare 报告美国医疗 RCM 市场将从 2026 年约 $72.96 billion 增至 2035 年
              $195.92 billion，CAGR 为 11.6%；Precedence Research 给出相近但不完全相同的美国口径：2026 年 $73.14 billion，2035 年 $191.67
              billion，CAGR 为 11.35%。同一来源体系还报告全球市场 2025 年为 $169.7 billion，到 2035 年为 $505.8 billion。因此，如果把 Candid 的美国年度
              $280 billion RCM 支出主张视为更宽的行政支出，它并不矛盾；但若直接拿来当软件 TAM，会高估可购买的供应商市场。更实用、受证据约束的分层是：美国广义 RCM 支出、分析师衡量的美国 RCM
              供应商市场、其中可被云/API 自动化触达的子集，以及 Candid 当前在 200+ 医疗服务机构和平台合作伙伴中已被证明的切入点。
