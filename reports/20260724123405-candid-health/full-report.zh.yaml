      - number: '7.3'
        title: 云、EHR 集成、支付方通道和数字健康客户波动构成依赖集群
        blocks:
          - type: paragraph
            body: >-
              Candid 的公开材料把公司定位为 API 优先、可互操作；战略上有吸引力，也意味着依赖链很重。平台需要稳定的云基础设施、可靠的内部数据运营、Elation 等 EHR
              集成、支付方和清算所连接，以及客户侧的实施纪律。因此，风险并不只在 Candid 自己的代码库里。支付方政策更新、清算所中断、EHR 集成变化、客户数据质量问题或云事故，都可能被客户感知为 Candid
              失败。客户集中度是另一项未解依赖：公开来源称公司服务 200 多家组织，并突出数字健康创业公司、MSO、EHR
              公司和复杂提供方集团，但没有披露收入集中度、续约分布，或最大客户是否带来异常服务负担。因此，在尽调证明冗余、合同质量和头部客户韧性之前，依赖图把平台依赖和客户集中都视为投资风险。
