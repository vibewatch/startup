            body: >-
              融资记录证明势能，但不足以承销完整价格。Candid 2025 年 2 月完成 $52.5M Series C，约 17 个月后又完成 $120M Series D；公开来源称估值提升 3
              倍。这是重要的方向信号，但不等于经验证估值。因此，纪律化入场应锚定可观察的运营驱动，而不是头条涨价。以 $7B 年理赔量作分母，示例性的 0.5% 到 2.0% RCM 抽成率，对应粗略 $35M 到 $140M
              ARR 等价区间。套用 2026 年医疗 IT 和 RCM 约 4.0x 到 7.0x
              的倍数，在稀缺性溢价前会得到很宽的价值区间。这是近似估算，不是公司披露的收入数字。资本结构同样不透明：优先权堆栈、期权池刷新、优先证券和二级市场标记，都可能显著改变普通股回报。
