  - id: TV002
    title: 投资论点 / 反方论点表
    columns:
      - 立场
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 投资论点
        - RCM 市场巨大，2026 年美国市场规模估计接近 $72.96B，增速为双位数。
        - 如果医疗机构 RCM 预算放缓，或 AI 自动化未能降低收款成本，该论点会削弱。
      - - 投资论点
        - Candid 披露的势头很强：ARR 增长 190%、NDR 180%、客户超过 200 家，年理赔量约 $7B。
        - 如果管理层提供队列 ARR、毛利率和留存计算，并能与公开增长说法对齐，该论点会增强。
      - - 投资论点
        - 产品以 API 为导向，并嵌入医疗机构工作流；公开文档和 Elation Health 合作伙伴证据可印证。
        - 如果集成从早期数字医疗和多站点医疗机构客群扩展到规模化企业系统，该论点会增强。
      - - 反方论点
        - Series D 的确切估值、每股价格、优先权条款和当前 ARR 均未公开。
        - 如果 Candid 分享融资备忘录、股权结构表、409A 或二级市场标记，以及清晰的 ARR 桥，风险会下降。
      - - 反方论点
        - 如果 Series D 隐含 $1B+ 估值，投资人在尚不清楚收入是软件型还是服务占比高之前，可能已经支付了高倍数。
        - 如果 ARR 已高于基础估算，且毛利率强、实施负担低，风险会下降。
      - - 反方论点
        - 行业风险包括强势既有巨头、AI 原生同行、支付方连接复杂度，以及 Change Healthcare 式网络安全敞口。
        - 若具备经审计的安全姿态、冗余、支付方网络韧性，以及可背书的企业级部署，风险会下降。
    notes: 表格把业务吸引力与特定价格下的可投资性分开。
