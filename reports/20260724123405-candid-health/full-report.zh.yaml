  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 该判断对收入转化、价格不透明和利润率质量最敏感。
    data:
      items:
        - label: 确切入场估值 / 条款
          value: 10
          detail: 未公开投后估值、股价或清算优先权结构。
        - label: 由 $7B 理赔处理额推算的 ARR
          value: 9
          detail: 收入是估算值，公司未披露。
        - label: 毛利率与服务占比
          value: 9
          detail: 软件估值倍数要看自动化经济账能否跑通。
        - label: 留存韧性
          value: 8
          detail: 180% NDR 很强，但还需要队列证据。
        - label: 上市可比公司倍数压缩
          value: 7
          detail: Waystar 的 EV/revenue 交易倍数约为中个位数。
        - label: 安全与理赔网络风险
          value: 7
          detail: Change Healthcare 的案例说明系统性下行风险。
        - label: 竞争替代
          value: 6
          detail: Adonis、Enter、Waystar 和 Optum 都会挤压差异化。
        - label: 市场增长
          value: 5
          detail: 大市场的不确定性低于 Candid 自身经济性。
    approximationNotes: 数值是基于留存证据给出的 0-10 序数敏感度评分，并非外部评级。
    claimRefs:
