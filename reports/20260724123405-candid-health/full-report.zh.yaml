  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              与 Candid
              估值相关的市场，最好定义为医疗服务提供方收入周期基础设施，而不是整个医疗行政市场，也不只是点状账单软件。纳入的支出包括软件、服务、工作流自动化、清算所连接、分析和托管流程工作，目的都是帮助医疗服务提供方把就诊转化为可报销现金。排除项应包括无关的临床
              EHR 模块、纯患者互动、支付方核心行政系统、通用咨询，以及不会迁移到软件上的手工后台劳动。边界很重要，因为 Candid 自己的 $280 billion 问题陈述用的是美国年度 RCM
              支出的宽口径，而市场研究页面通常衡量更窄的软件与服务市场。现状替代方案仍然强大：嵌在 Epic、Oracle Health、athenahealth 和诊所管理系统里的传统 RCM 模块；外包 RCM
              服务商；清算所；内部账单团队；以及支付方门户。因此，市场很大，但采用取决于替换可信的运营管线，而不只是再卖一个 SaaS 席位。
