            body: >-
              Candid Health 的首要风险不是通用 SaaS 风险；它们落在 PHI、支付方交易、AI 驱动的理赔逻辑和极高增长私有估值重置的交汇处。最高严重性的暴露是网络安全 / 隐私，因为 Candid
              运行在医疗数据流中，业务伙伴义务、PHI 处理、SOC 控制和客户信任必须同时成立。第二个风险是 AI 账单准确性：Candid
              承诺自动化过去需要人工账单团队处理的工作流，但编码错误、幻觉式规则或边缘案例处理不佳，可能传导为支付方拒付、退款、客户流失，甚至与欺诈有关的审查。第三个风险是跨
              API、EHR、支付方和清算所的可靠性与连接性。Change Healthcare 证明，RCM 中介可能成为系统性单点故障；Candid
              规模更小，但同样依赖架构的传导路径仍然相关。公开缓释措施真实存在——SOC 2、技术文档、具名 Elation 集成和新近 Series D
              资本——但剩余暴露仍高，因为正常运行时间、理赔准确性、集中度和模型质量证据并未公开。
