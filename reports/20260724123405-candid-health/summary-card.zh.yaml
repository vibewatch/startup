  topStrengths:
    - 公司披露的牵引力很强：2025 年收入运行率同比增长 190%，净美元留存率 180%，说明它在医疗服务机构里能先落地再扩张。
    - AI 优先、API 优先的架构有差异化，把临床、账单和服务方数据统一到一个模型里，不同于传统厂商只是在旧系统上「撒一点 AI」。
    - 创始人与市场匹配度可信：两位创始人都来自 Palantir；Sixth Street Growth 在约 40 次客户背调后领投 Series D，并称反馈「off the charts」。
    - 市场大且结构性增长：美国 RCM 软件 / 服务 2026 年约 $73B，CAGR 约 11-12%；拒付和行政成本问题长期存在，自动化正面击中痛点。
  topRisks:
    - 估值未披露，绝对财务不透明：收入、ARR、毛利率、烧钱速度、现金跑道都没有公开，入场价格纪律和单位经济评估都难做。
    - 系统性 RCM / 网络安全和 HIPAA 暴露较高：2024 年 Change Healthcare 攻击说明 RCM 厂商是高价值单点故障；AI 账单准确性和合规责任也是风险。
    - 竞争很重：Waystar、Change Healthcare/Optum、Availity、FinThrive 等规模化传统厂商有庞大装机量和切换成本，Adonis、Enter Health 等 AI 原生同业也在追赶。
    - 客户集中度和透明度仍是问题，样本偏向高增长数字健康公司和 MSO；公司也依赖两位创始人这两个关键人。
  unresolvedGaps:
    - Series D 准确投后估值和股价（目前只披露「Series C 的 3 倍」）。
    - 绝对收入、ARR、毛利率、烧钱速度、现金跑道、账上现金和员工数。
    - 可点名、可验证的生产环境客户背调，以及真实客户 / 收入集中度。
    - 自动化效果、拒付降低和净回款率主张的独立验证。
