callouts:
  - calloutType: insight
    title: Integrated systems expand the wallet but also expand execution risk
    body: Fox ESS can address more than battery hardware because its catalog links storage with inverters, EV charging, heat pumps, and cloud management. That increases potential system value, but adoption depends on installers' ability to deploy and explain a more complex stack.
    claimRefs: [CM002, CM012]
  - calloutType: risk
    title: Market leadership does not establish Fox-specific market size
    body: Reported rankings and market-growth figures support momentum, not a defensible currency TAM, serviceable market, or attainable share. The valuation case therefore needs country-level revenue, channel sell-through, pricing, and unit-economics evidence.
    claimRefs: [CM006, CM009, CM014, CM015]
