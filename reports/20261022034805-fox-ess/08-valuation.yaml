callouts:
  - calloutType: recommendation
    title: Price discipline overrides company quality
    body: >-
      Reported growth and shipment leadership justify continued diligence, but they do not
      establish an investable price. The decision should remain track / research more until a
      current capitalization and audited return model can be built.
    claimRefs: [CV003, CV006, CV009, CV015, CV016]
  - calloutType: risk
    title: Concentration is the central downside lens
    body: >-
      Near-total overseas revenue and more than 60% of sales from Germany, the UK, and Poland make
      policy, channel, service, and residential-demand shocks central to valuation.
    claimRefs: [CV004, CV011, CV012]
