  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Fox ESS presents a broad energy-management surface rather than a single battery SKU. Its official product
              catalogue lists PV and hybrid inverters, residential lithium batteries, C&I all-in-one systems, EV
              chargers, heat pumps, and the FoxCloud 2.0 monitoring layer. The customer workflow is an integrated loop:
              solar generation is converted by the inverter, household demand is served, surplus can charge the battery,
              and the app exposes generation, load, state of charge, imports, and exports. This supports a residential
              buyer seeking self-consumption and an installer seeking one ecosystem, but the official catalogue does not
              quantify attach rates, service-level performance, or realized customer savings. Independent Solar Choice
              evidence describes Fox batteries as DC-coupled stacks that normally require a compatible Fox hybrid
              inverter, making system design and future expansion more dependent on the Fox ecosystem than an AC-coupled
              retrofit.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
