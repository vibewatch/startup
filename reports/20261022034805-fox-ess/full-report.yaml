  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Commercial scale with reported profitability
        - RMB3.392bn 2024 revenue and RMB267m parent-attributable net profit were reported from the prospectus
        - Audited cash conversion and margin durability would strengthen the thesis
      - - Thesis
        - Residential-storage market leadership
        - Company-supplied releases cite leading 2025 and H1 2026 shipment rankings
        - Independent shipment data and sustained share would increase confidence
      - - Anti-thesis
        - Geographic and policy concentration
        - >-
          Overseas revenue was reported at 99.16% in H1 2025 and three European markets contributed more than 60% of
          sales
        - Broader geographic profit contribution would reduce the risk
      - - Anti-thesis
        - Service strain and product commoditization
        - A low-tier market analysis flags support delays and low-margin competition in entry-level string inverters
        - Verified service-level performance and segment margins would rebut the concern
    notes: >-
      Shipment rankings are company-issued or company-supplied claims; the adverse service evidence is low-tier and
      requires primary customer validation.
