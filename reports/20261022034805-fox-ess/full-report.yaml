            title: Liquidity and service economics remain opaque
            body: >-
              No current cash, burn, debt, gross-margin, warranty-reserve, or realized-pricing disclosure was found in
              the assigned evidence, while customer reviews raise a service-cost and retention concern.
            calloutType: risk
            claimRefs:
