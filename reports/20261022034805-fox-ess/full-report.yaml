        title: Identity and product system
        blocks:
          - type: paragraph
            body: >-
              Fox ESS presents a vertically oriented clean-energy equipment portfolio rather than a single inverter
              product. Its official product surface lists PV and hybrid inverters, residential batteries, commercial and
              industrial all-in-one systems, EV chargers, heat pumps, and the FoxCloud monitoring system. A third-party
              corporate profile reports that the company was founded in 2019 and is headquartered in Wenzhou, China, but
              that profile is an aggregator rather than a filing. The more defensible identity anchor is therefore the
              official product scope combined with the prospectus coverage reported by Energy Storage News. Fox ESS is
              best characterized as a private Chinese manufacturer with international, especially European,
              residential-storage exposure; the chapter does not treat the aggregator's employee count or unicorn labels
