  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Scenario
      - Operating assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or confirmation trigger
    rows:
      - - Bull
        - >-
          Shipment leadership persists; audited margins and cash conversion are strong; IPO proceeds fund productive
          capacity
        - No defensible public range; underwrite only after verified cap table and peer-adjusted multiples
        - Independent share confirmation and clean audited filing
        - Bull case fails if growth requires sustained price compression or weak cash conversion
      - - Base
        - Profitable growth continues but Europe concentration and disclosure gaps remain
        - Track until transaction price, dilution, and preference terms permit a target-return model
        - Listing progresses with complete financial supplements
        - Remain uninvested if ownership and cash-flow evidence stay unavailable
      - - Bear
        - Listing stalls; European demand weakens; service burden and commoditization compress margins
        - Downside cannot be quantified without balance-sheet and capitalization data
        - Repeated filing delays, falling shipment rank, or worsening support evidence
        - Exit or reject if offering terms cannot compensate for concentration and execution risk
    notes: >-
      Scenario ranges are intentionally unavailable because the retained evidence lacks a current valuation, fully
      diluted capitalization, and comparable transaction set.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV015
