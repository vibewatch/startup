        title: Exhibits
        blocks:
          - type: callout
            title: Demand evidence is tangible but non-financial
            body: >-
              H1 2026 shipment leadership, 3.1 GWh of reported Australian installations, and the Origin integration
              support a real operating footprint, but none is a substitute for audited revenue or cash conversion.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
              - CI009
