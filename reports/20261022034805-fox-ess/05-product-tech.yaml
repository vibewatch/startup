    notes: "Architecture is a source-bounded operating model, not a claimed complete software or hardware bill of materials; missing controls and test evidence are retained as diligence gaps."
    claimRefs: [CE001, CE003, CE006, CE010, CE011, CE012, CE013, CE014]
