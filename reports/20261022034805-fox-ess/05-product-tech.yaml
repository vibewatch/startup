      - [Hybrid power control, "Coordinates inverter, battery, household load, backup, and operating modes", "Compatible Fox high-voltage battery and firmware", "Interoperability, safe fallback, and update policy"]
      - [Battery and BMS, "Stores energy in modular or fixed LiFePO4 systems and manages battery operation", "Cell suppliers, thermal conditions, installation configuration", "Degradation, throughput, cold-weather behavior, and warranty realization"]
      - [Safety and thermal management, "C&I catalogue describes preventive safety and heat dissipation; product families carry ingress protection claims", "Enclosure, installation, and site conditions", "Portfolio-wide fire testing and incident statistics"]
      - [Cloud monitoring and control, "Displays energy flows and exposes charging or operating settings", "Internet, data logger, account role, meter/CT configuration", "Cybersecurity, data privacy, uptime, and ownership transfer"]
