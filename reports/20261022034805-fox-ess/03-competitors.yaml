callouts:
  - calloutType: strength
    title: Observable competitive traction
    body: Fox ESS has a broad product ecosystem and recent period-specific shipment and performance signals, giving it credible consideration in residential storage even though those signals do not establish durable pricing power.
    claimRefs: [CP001, CP005, CP007]
  - calloutType: risk
    title: The moat is not yet demonstrated
    body: Europe and overseas concentration, tariff exposure, channel dependence and an expected Australian market contraction could pressure growth; peer pricing, support and retention data are not available in the assigned evidence.
    claimRefs: [CP013, CP014, CP015, CP016]
