    notes: "Public evidence in the assigned pool supports concentration and IPO-process monitoring but does not establish a complete litigation, certification, privacy, or environmental inventory; unknown is not treated as no risk."
    claimRefs: [CR001, CR002, CR003, CR014, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Warranty or field-performance failure across inverters, batteries, EV chargers, heat pumps, and C&I systems", medium, high, partial, medium-high, "Obtain cohort failure rates, warranty reserves, return rates, and recall history by product family."]
      - [Technical-support or installer-response delays during rapid expansion, medium, medium-high, partial, medium, "Measure regional first-response and resolution times against service-level commitments."]
      - ["Firmware, monitoring, or cybersecurity failure in FoxCloud and integrated systems", medium, high, low, high, "Review security architecture, update policy, incident history, penetration testing, and customer notification procedures."]
      - [Supply or logistics disruption affecting battery and inverter availability, medium, high, partial, medium-high, "Map supplier capacity, inventory buffers, alternate-cell qualification, and lead times by region."]
    notes: "The 97% SPI result is a product-performance datapoint for one tested system, not proof of fleet-wide reliability, service quality, or cybersecurity readiness."
    claimRefs: [CR005, CR006, CR007, CR008, CR011]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [European distributor and installer network, "Local distributors / installers", "Nearly 30 agreements described at one 2026 event; share by partner not disclosed", "Partner churn, poor installation, or channel conflict slows deployments and raises warranty costs.", high, "Build region-level partner scorecards and enforce training, service, and warranty SLAs.", medium-high]
      - [Battery-cell supply, "Rept Battero; Xingheng Power; HiTHIUM; Great Power", "Named suppliers disclosed; purchase shares and alternatives not disclosed", "Cell shortage, quality variance, or supplier failure constrains delivery or increases working capital.", high, "Validate dual sourcing, qualification time, capacity reservations, and supplier financial health.", medium-high]
      - [European policy and demand ecosystem, "Subsidies, grid rules, installers, homeowners", "Germany, UK, and Poland together over 60% of sales", "Policy reversal or market contraction produces a sharp regional revenue shock.", high, "Run country-level downside scenarios and expand non-European channel mix.", high]
      - [IPO proceeds and planned capacity/service investment, "SZSE process; proposed industrial park and service system", "RMB1.661 billion target; timing and completion remain execution-dependent", "Listing delay or underfunding slows capacity, support, and working-capital plans.", high, "Track filing milestones, funding sources, capex schedule, and liquidity runway.", medium-high]
    notes: "Counterparty concentration and mitigation maturity are partly undisclosed; the register preserves those gaps rather than inferring diversification from the existence of multiple named suppliers or partners."
    claimRefs: [CR002, CR009, CR010, CR011, CR015]

