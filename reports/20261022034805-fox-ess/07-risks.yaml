callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: "Europe concentration is the clearest evidence-backed exposure: overseas revenue was above 95% in each reported period and Germany, the UK, and Poland contributed over 60% of total sales. A policy or demand shock therefore has an outsized potential effect on the thesis."
    claimRefs: [CR001, CR002]
  - calloutType: assumption
    title: Evidence limitation
    body: No assigned source provides a complete litigation, incident, warranty-reserve, cybersecurity, cash-conversion, or customer-concentration record. These are diligence gaps, not implied clean bills of health.
    claimRefs: [CR008, CR013, CR016]
  - calloutType: recommendation
    title: Monitoring trigger
    body: Maintain a risk-sensitive stance until Fox ESS can demonstrate regional diversification, measurable support and failure-rate performance, supplier substitution readiness, and a stable IPO and liquidity path.
    claimRefs: [CR002, CR007, CR011, CR014]

