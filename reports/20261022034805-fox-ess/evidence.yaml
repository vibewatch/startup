evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current ChiNext prospectus sections covering shareholders, board composition, related parties, and executive
      biographies.
    whyItMatters: Founder concentration and listing governance cannot be assessed from the single named leader in the assigned pool.
    diligencePath: >-
      Obtain the current SZSE prospectus and reconcile its ownership and governance schedules to corporate registry
      records.
    relatedQuestionRefs:
      - QO003
      - QO010
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current offer price, share count, post-money capitalization, valuation, cash, and debt schedules.
    whyItMatters: >-
      The reported RMB1.661 billion fundraising target is not a valuation and cannot support a dilution or return
      analysis.
    diligencePath: Retrieve the latest ChiNext filing and build a fully diluted capitalization table from primary documents.
    relatedQuestionRefs:
      - QO005
      - QO010
  - type: stale
    severity: material
    topic: IPO
    missingEvidence: Primary ChiNext application status and exchange correspondence current to the 2026-10-22 run date.
    whyItMatters: >-
      The retained independent report describes the process as of January 2026 and cannot establish the application
      outcome nine months later.
    diligencePath: >-
      Retrieve the current Shenzhen Stock Exchange application page, latest prospectus, and all subsequent exchange
      inquiries or issuer responses.
    relatedQuestionRefs:
      - QO007
      - QO010
  - type: missing-source
    severity: material
    topic: financial-quality
    missingEvidence: Audited gross margin, free cash flow, working capital, warranty reserves, and country-level profitability.
    whyItMatters: High overseas concentration and positive reported profit do not reveal cash conversion or after-sales liability.
    diligencePath: >-
      Request audited financial statements, management accounts, warranty cohorts, and country-level revenue and margin
      schedules.
    relatedQuestionRefs:
      - QO005
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-stakeholder-tables
    missingEvidence: Complete current leadership, board, shareholder, and committee roster.
    whyItMatters: The table is a partial evidence map and should not be read as a complete governance enumeration.
    diligencePath: Reconcile the current prospectus, company leadership pages, and corporate registry extracts.
    relatedQuestionRefs:
      - QO003
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: Independent records of lawsuits, recalls, outages, sanctions, regulatory actions, and warranty complaints.
    whyItMatters: >-
      The assigned adverse search result did not provide a substantive incident record, and absence in this pool is not
      proof of absence.
    diligencePath: >-
      Run a source-controlled legal, regulator, recall, and customer-complaint search against current registries and
      major markets.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      A country-by-country bottom-up market model with annual system spend, installed base, replacement cycle, and Fox
      ESS serviceable channel coverage.
    whyItMatters: >-
      Capacity and shipment lenses cannot establish a currency SAM, attainable share, or valuation-relevant revenue
      pool.
    diligencePath: >-
      Obtain management's country-level revenue, ASP, channel sell-through, installed-base, and market-share schedules
      and reconcile them to independent market datasets.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: Installer funnel, homeowner payback, attachment, churn, and support-performance data by market and product bundle.
    whyItMatters: >-
      A growing market can still produce weak economics if conversion, service costs, or installer capacity constrain
      deployment.
    diligencePath: >-
      Request cohort-level lead-to-install conversion, system ASP, gross margin, warranty/service cost, payback
      assumptions, and installer retention by country.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      A reconciled methodological bridge between European capacity projections, global H1 shipments, and global 2025
      market estimates.
    whyItMatters: >-
      The reported figures use different units, periods, and populations and could otherwise be misread as additive
      layers.
    diligencePath: >-
      Ask each publisher or management to provide definitions, shipment-versus-installation treatment, geography, and
      period bridges before using a consolidated market model.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Country-specific realized prices, discounts, warranty costs and installer margin data for Fox ESS and named peers.
    whyItMatters: Wholesale observations cannot establish pricing power or customer value versus competitors.
    diligencePath: Collect comparable distributor and installer quotes for H3, AIO and peer systems in Germany, the UK and Australia.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: switching
    missingEvidence: Measured installer retention, support response times, compatibility constraints and replacement rates.
