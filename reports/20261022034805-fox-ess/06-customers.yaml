callouts:
  - calloutType: strength
    title: Channel reach is more evidenced than end-customer retention
    body: >-
      Shipment rankings, installer-program references, Australian deployments, and a 300-customer event support real channel traction. They do not substitute for named production customers, active-account counts, or cohort retention.
    claimRefs: [CU003, CU005, CU006, CU008]
  - calloutType: risk
    title: Customer durability and support economics remain unverified
    body: >-
      No assigned source discloses NRR, GRR, churn, renewal, contract duration, largest-customer concentration, or customer-level revenue. A market synthesis also flags concerns about technical-support speed, so regional service records should be obtained before treating shipment leadership as durable retention.
    claimRefs: [CU012, CU013]
