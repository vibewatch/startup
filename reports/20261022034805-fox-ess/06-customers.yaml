    enumerationScope:
      coverage: partial
      basis: "Four publicly described customer or deployment references in the assigned 2025-2026 source pool, not a complete customer population"
    notes: "The table enumerates the assigned pool's usable proof, including unnamed references; lack of customer names or production status is an evidence limitation, not an inferred pilot or production classification."
    claimRefs: [CU002, CU003]
