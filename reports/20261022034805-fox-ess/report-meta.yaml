companyProfile:
  summary: >-
    Fox ESS is a Wenzhou-based manufacturer of solar inverters and energy-storage systems. Its portfolio spans PV and
    hybrid inverters, residential batteries, commercial and industrial systems, EV chargers, heat pumps, and cloud
    monitoring. The evidence supports meaningful commercial scale and an active ChiNext listing process, while
    ownership, governance depth, current valuation, and audited operating metrics remain incompletely disclosed.
