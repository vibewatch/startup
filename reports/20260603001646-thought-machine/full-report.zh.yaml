      - number: '3.2'
        title: 能力广度、定价不透明与买方匹配
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 最强的产品论点仍是智能合约可配置性，以及统一的核心加支付架构。这让它在产品制造叙事上比许多既有供应商
              更锋利，尤其适合那些希望推出新功能、又不想被供应商锁定产品逻辑的银行。Mambu 在现代架构和速度上最接近；Temenos、Oracle、Finacle、TCS、Finastra 和 FIS
              则凭更广的功能覆盖、更深的本地化、更大的已披露装机基础和更成熟的伙伴生态竞争。实践中，买方匹配按机构类型分裂：追求快速转型时，云原生厂商更强；监管舒适度、区域覆盖或既有关系主导决策时，既有供应商 仍更强。


              定价是整个类别公开证据中的弱点。SaaSworthy 将 Mambu 列为报价制；SDK.finance 明确称 Temenos 定价大多不公开、以咨询式销售为主；Oracle FLEXCUBE 在
              TrustRadius 上没有公开价格方案；Thought Machine
              自己被审阅的材料也没有披露清单价或标准套餐。这种不透明本身就是竞争事实：企业买方不走一轮销售流程，就无法干净地基准比较供应商；这往往有利于更大的既有供应商和嵌入更深的顾问生态。它也意味着任何公开定价比较都必须聚焦透明度和结构，而不是假装知道真实的全包经济性。
