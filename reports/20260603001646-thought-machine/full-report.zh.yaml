      - number: '8.4'
        title: 最后尽调问题和否决触发器
        blocks:
          - type: paragraph
            body: >-
              剩余工作很清楚。投资人需要 2025 年 7 月轮次条款、经审计的 2025 年 ARR 或收入桥接、软件与服务收入占比、毛利率、留存和集中度。没有这些文件，承销问题就不是“Thought Machine
              是不是真公司？”，而是“投资人到底在为什么付钱？”如果管理层披露相较 2022 年峰值的明确下调，如果可见效率改善前又融资，或者公开迁移失败或高管继续流失损害交付可信度，投资逻辑会很快破裂。


              FinTech Futures 关于 COO
              过渡的报道让这种敏感性更具体：高溢价私有软件倍数既依赖执行连续性，也依赖产品优雅度。价格敏感的建议因此是保持跟进，但要有纪律。公开证据支持战略相关性和真实客户证明，却不支持追逐过时的 2022
              年估值。只有在管理层证明 2025 年融资守住了估值质量，且业务经济性远比公开记录显示得更像软件时，结论才能转为买入。
                       
