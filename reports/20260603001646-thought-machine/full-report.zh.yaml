      - number: '3.4'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Thought Machine
              的护城河真实存在，但比热情产品话术暗示的更窄。银行如果看重深度可配置性、实时账本、统一的核心加支付逻辑，以及不等待单体供应商路线图也能制造差异化产品的能力，公司看起来最强。相对于仍更强调广度和本地化、而不是可编程性的更大套件，这些都是有意义的优势。


              风险在于，许多竞争对手现在已经营销出足够的模块化、可组合性或分步现代化，在务实买方眼中压窄了 Thought Machine 的差异化。Mambu 用速度和可组合性从下方挑战 Thought
              Machine；Temenos、FIS、Finastra、Oracle、TCS 和 Finacle 则用已披露规模、成熟参考客户和更长期的监管舒适度从上方挑战。公开证据也无法证明今天哪家厂商赢下最多 Tier 1
              选型比拼，因此不能过度声称 Thought Machine 正在拿份额，而不是赢下一部分绿地或渐进式项目。后续估值工作的正确结论不是 Thought Machine
              没有护城河；护城河取决于它能否比更大对手更快把架构优雅转化为可重复、可由伙伴放大、且经济上有吸引力的实施。
