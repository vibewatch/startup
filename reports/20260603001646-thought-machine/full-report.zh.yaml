              Thought Machine 给出了实施时间线，Shawbrook 自己的产品页显示 buy-to-let 按揭面向专业房东，是真实商业产品。


              Bpifrance 和 Judo 也是强参考，但强点略有不同。Bpifrance 的 Thought Machine 公告提供了本组最好的扩张证据，因为它把 2022
              年核心系统决策和后续支付生产环境联系起来。Judo 的公开页面证明它是可信的 SME 银行和上市机构，Thought Machine 则提供了迁移顺序。相比之下，USSFCU 和 GBC 是有意义的
