          description: 大型既有厂商提供风险更低的现代化路径。
        - id: n7
          label: 收入延迟 / 利润率拖累
          description: 项目滑期、服务负荷上升，或胜率下降。
        - id: n8
          label: 融资重置 / 估值压缩
