      - number: '2.3'
        title: 增长驱动因素与监管催化
        blocks:
          - type: paragraph
            body: >-
              核心系统现代化需求被几股力量提前拉动：遗留系统老化、实时客户体验预期、以及硬性的支付系统截止日期。公开市场报告认为，多数银行仍运行在超过 20 年的系统上，维护吞噬了过高的 IT
              预算，并挤出创新。仅凭这一点，就足以支撑一条长尾替换周期。真正加速时间线的是支付层：ISO 20022 截止日期、即时支付采用、以及更广泛的运营韧性要求，迫使银行升级的不只是报文格式，还有底层架构。


              Bank of England 的 ISO 20022 材料尤其有用，因为它把现代化从厂商营销翻译成基础设施政策。监管方强调，更丰富的报文直接带来合规、韧性、直通式处理、分析和创新收益。KPMG
              调查则增加了一个高管需求信号：多数回应的美国银行已经在现代化或计划现代化多种支付类型，其中即时支付和大额电汇排在前列。Deloitte 进一步明确指出，参与其中的机构不能把这些变化当成可选项；CHIPS 和
              Fedwire 截止日期以及延后迁移的运营风险都摆在那里。


              这组驱动因素把 Thought Machine 的可触达需求状态从“替换核心系统”扩展为“搭建一个始终在线、ISO 就绪、产品可配置的银行技术栈”。Vault Payments、USSFCU 分阶段
              FedWire/FedNow 计划，以及 Bpifrance 的 SEPA 即时支付项目，都显示即使银行并不一次性替换所有遗留系统，支付现代化也可以成为进入向量或预算放大器。
