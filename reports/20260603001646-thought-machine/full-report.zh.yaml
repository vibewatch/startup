      - number: '1.3'
        title: 融资历程、战略股东与市场验证
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的资本历程是公司概况中最强的一块，因为它显示银行、风险投资者和全球金融基础设施伙伴反复给出验证。最早的证据点是 Lloyds Banking Group：公司称 Lloyds 在
              2018 年 Series A 中投资，这是商业关系的一部分；Lloyds 自己的投资者电话会文字稿也单独确认了这笔投资。到 2021 和 2022 年，融资栈已包括 JPMorgan
              Chase、Standard Chartered Ventures、ING Ventures、Temasek、Intesa Sanpaolo 和 Morgan
              Stanley。这一点并不常见，因为它意味着几家有战略意义的银行不仅是客户或潜在客户，也直接提供资本。


              顺序很重要。公开证据支持一轮 $25m 的 Series A，一轮 2020 年 Series B——最终以 $125m 收官，而不是最初宣布的 $83m——一轮 2021 年 $200m 的 Series
              C，以及 2022 年以 $2.7bn 估值完成的 $160m Series D。Companies House 随后记录了 2025 年 7 月的进一步股份配发，City AM 则报道该轮约为现有投资者出资
              £45m。只采用这些来源中披露或可直接推断的金额，到 2025 年中累计融资约为 $560m 或更多；这与用户提供的背景一致，也与合作伙伴材料中“公司已融资超过 $500m”的表述一致。


              战略验证不只来自投资者。Thought Machine 已围绕 Mastercard、HCLTech 和 DXC 搭建起可识别的生态，并用 Gartner 认可和 JPMorgan Hall of
              Innovation 提及来强化企业可信度。风险在于顶级客户背书可能掩盖薄弱经济性；但在公司概况章节，更重要的结论是 Thought Machine
              已远远越过金融科技试点阶段，进入了大型银行愿意在合同和资本两端支持的基础设施厂商队列。
