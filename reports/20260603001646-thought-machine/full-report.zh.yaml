  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本风险与领导层过渡相互绑定，并非两件事
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 最直接的风险，是融资依赖和执行连续性相互强化。公开记录仍显示公司有真实产品需求和可信客户，但尚未清楚跨入可自我供血的软件经济性。City AM 和 Tech.eu 都描述
              FY2024 收入约 £47.6 million、营收同比持平、亏损扩大、员工数下降。2025 年 7 月的股份配发及相关报道随后显示，公司仍需要现有投资人大约 £45 million
              追加资金。这不是困境证明；许多基础设施公司需要穿越漫长实施周期来融资。但它确实证明，在管理层把产品强度转化为更干净的经营杠杆时，模型仍依赖外部资本。


              资本图景之所以更重要，是因为高管角色同时发生变化。Thought Machine 通过 Andy Maguire 增加了董事长经验，并在 2025 年末刷新董事席位，治理方向上是正面的。但 FinTech
              Futures 还报道，COO Gareth Richardson 在搭建交付、客户成功和合作伙伴团队后离任，并指出 CRO 已在 4
              月离开。在受监管的企业软件业务里，这些不是表面变化。交付领导力、客户成功、企业销售和董事会监督，共同决定大型迁移能否按时落地，以及新管线能否在不让交付成本失控的情况下转化。因此，风险不只是“需要资金”或“领导层变动”；而是下一次融资需求如果在新领导配置自证之前到来，战略灵活性会迅速被压缩。
