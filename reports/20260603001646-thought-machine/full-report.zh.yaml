chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与产品逻辑
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 是一家总部位于伦敦的银行基础设施厂商，由 Paul Taylor 于 2014 年创立；他此前创办的语音技术公司 Phonetic Arts 被 Google
              收购。用于申报的公司主体是 Thought Machine Group Limited，成立于 2017 年末；公司官网的运营叙事则把业务描述为一个服务欧洲、亚洲、北美、澳新地区和中东银行的全球团队。New
              Street Square 的注册地址和 Herbrand Street 的公开总部并不矛盾，但对尽调有意义：它标出法律住所和前台商业存在之间的分工。


              公司销售两款紧密相连的产品：面向核心银行的 Vault Core，以及面向支付处理的 Vault Payments。官网、产品页和合作伙伴公告中，Thought Machine
              始终把两套系统描述为从零写起的云原生平台，不含遗留代码，具备高可用特性，并由银行掌握配置权。证据集中最反复出现的差异点，是 Vault Core
              的智能合约层：产品逻辑放在硬编码平台行为之外，银行因此可以定义或迁移产品，不必承受封闭盒子核心系统带来的锁定效应和发布周期拖累。Vault Payments
              把同一逻辑延伸到卡支付和账户到账户处理，把自己定位成实时、原生支持 ISO 20022 的引擎，既能独立对接遗留核心系统，也能与 Vault Core 预集成。


              地理版图很关键，因为 Thought Machine 的销售动作依赖跨多个地区服务大型受监管银行。HCLTech 和 DXC 在 2025
              年分别发布的合作伙伴新闻稿，都独立提到公司在伦敦、纽约、新加坡和悉尼设有办公室；Thought Machine 的 2022 年 Series D
              新闻稿也提到悉尼和迈阿密扩张计划。这些证据支撑了可信的国际化销售版图，但仍未披露各地区员工数或交付集中度，因此后续尽调应验证公司的交付模式是否像营销口径那样分散。
