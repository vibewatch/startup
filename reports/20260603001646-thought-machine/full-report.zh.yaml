        title: 信任、质量、合规与剩余尽调风险
        blocks:
          - type: paragraph
            body: >-
              信任和质量控制是本章最清晰的混合信号。积极一面，Thought Machine 公开把支付故事锚定在 ISO
              20022、实时处理，以及为可靠性、可扩展性和灾难恢复而建的伙伴生态上。较早的工程材料也显示，公司在补丁、网络策略、基于证书的访问和密钥管理上有严肃的内部实践；赋能材料则显示，公司把客户和伙伴能力作为正式认证问题，而不是临场支持。这些都能实质降低实施风险。较弱的一面是披露深度。在已抓取表面中，没有清晰的公开信任中心、具名
              SOC 或 ISO 认证、公开正常运行时间或 SLA
              指标，也没有当前基准包能让外部尽调团队以承销深度独立评分韧性。因此，产品故事看起来技术上连贯、商业上成熟；要把它当作完全风险出清，仍需要对安全保证、运营指标和生产规模性能做私下尽调。
