      - CV028
      - CV029
      - CV031
      - CV043
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 标杆客户扩张，管理层证明 ARR 桥接强于法定记录，利润率呈现软件式特征，且 2025 年融资没有实质性重置估值。
        - $1.6B-$2.4B 当前公允价值区间；只有尽调强力验证了今天公开层面看不到的隐含质量，接近旧估值支付才说得通。
        - 过时股权结构表、服务占比过重的经济性，或领导层扰动，会很快击穿这一情景。
        - 需要干净的私人数据室，并明确确认 2025 年没有向下重定价公司。
      - - 基准
        - Thought Machine 仍具战略价值，也有真实客户证明，但公开经济性仍显得依赖资本，且只部分像软件公司。
        - $0.9B-$1.6B 区间；仍有上行空间，但前提是入场价显著低于过时的 2022 年估值标记，或有更强私人证据支撑。
        - 再次融资需求、集中度意外或偏弱利润率画像，都会阻止该情景重估。
        - 最符合已审阅的公开记录。
      - - 悲观
        - 法定收入和亏损趋势才是更好的指引，2025 年融资最终价格偏弱或结构很重，公开可比公司压力占主导。
        - $0.4B-$0.9B 区间；若以更差条款进行新钱融资，按过时估值标记入场的目标回报很可能被摧毁。
        - 执行受挫、领导层流失和公开迁移问题会强化降估值路径。
        - 如果管理层继续封闭关键经济性和条款文件，这一情景概率会上升。
    notes: 这些是基于情景的估值区间，不是 DCF；区间刻意拉宽，因为公开记录没有披露关键收入质量和股权结构表输入。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值状态
      - 参考价值
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public and quasi-public valuation anchors actually used in this chapter: the stale Thought Machine
        private mark, the 2025 insider top-up, and four public banking-software read-throughs. Recent private
        core-banking rounds with clean disclosed multiples are sparse in the reviewed public record.
    rows:
      - - Thought Machine（2022 年 5 月披露估值标记）
        - $2.7B 披露估值，对比 $70.6M 的 2024 年数据库收入代理指标
        - 以过时估值标记 / 后续收入视角看为 ~38x
        - 直接提供标的公司峰值私募定价锚点
        - 估值和收入来自不同时间点，且均来自非申报的第三方来源。
      - - Thought Machine（2025 年 7 月内部投资人追加融资）
        - 现有投资人参与的 £44.8M-£45M 轮融资
        - 新的融资信号，但没有公开价格更新
        - 说明内部投资人在 2025 年仍愿意为业务出资
        - 没有公开估值、每股价格或优先权披露。
      - - Temenos
        - $6.15B 市值，对比 $1.09B 收入 / $804.2M ARR
        - ~5.6x 市值 / 收入，~7.6x 市值 / ARR
        - 具备规模和披露的现有厂商，可作为公开市场上限参照
        - 装机基础远大于 Thought Machine，披露也更全面。
      - - nCino
        - $2.05B EV，对比 $610.06M TTM 收入
        - ~3.35x EV / 销售额
        - 云银行软件公开可比公司，披露利润率并接受投资人审视
        - 美国贷款软件组合并非核心银行的直接类比。
      - - Alkami
        - $2.18B EV，对比 $471.94M TTM 收入
        - ~4.63x EV / 销售额
        - 增速更高的数字银行软件可比公司，也是公开市场溢价案例
        - 其偏美国零售银行和信用合作社，与 Thought Machine 的企业核心银行定位不同。
      - - Q2
        - $3.02B EV，对比 $821.58M TTM 收入
        - ~3.68x EV / 销售额
        - 具规模的数字银行平台可比公司，有助于界定公开市场区间中部
        - 更宽的数字银行技术栈和客户组合，使其无法与 Thought Machine 完全同类对比。
    notes: 倍数是基于已审阅公开市值、企业价值、收入和 ARR 数据得出的近似参照；列入 Thought Machine 两行是为了呈现私募估值标记的张力，并不意味着这些私募估值标记仍完全有效。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV013
      - CV015
      - CV017
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 2025 年融资向下重定价或结构很重
        - 管理层披露重大降估值、反稀释棘轮或与旧公开估值标记不一致的优先股堆叠。
        - 直接推翻 2022 年估值仍然成立的假设。
        - 立即按基准到悲观区间重新测算。
      - - 未见效率改善前再次融资
        - 管理层还没证明收入质量增强或亏损收窄，就先拿到新一轮融资。
        - 证实资本依赖仍是估值的主导变量。
        - 除非融资明显是在更强条款下机会型完成，否则视为投资逻辑破裂。
      - - 公开迁移失败或严重宕机
        - 旗舰客户上线发生重大回滚、宕机，或监管层看得见的失败。
        - 执行溢价和合理私募倍数都会被压缩。
        - 除非问题范围明确受控，否则把判断推向回避。
      - - 运营领导层继续流失
        - 交付、商业或客户成功负责人继续更替，且没有清晰的继任梯队。
        - 削弱支撑任何溢价倍数的执行论据。
        - 暂停投资测算，直到运营连续性和团队梯队得到证明。
      - - 大型银行买方继续选择低风险存量厂商
        - 公开可见的核心现代化采购周期里反复输单，买方因风险或本地化原因更偏向披露更充分的存量厂商。
        - 可触达的高价值赢单集合收缩，乐观情景的支点变弱。
        - 下调私募溢价，并按上市可比公司的纪律重测基准情景。
    notes: 这些触发项是为了改变价格判断，而不是简单重述通用风险类别。
    claimRefs:
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 2025 年融资条款
        - 2025 年 7 月融资的每股价格、投资人名单、投前或投后估值，以及清算优先权。
        - 这是检验 2022 年旧估值是否仍有真实支撑的最快办法。
        - CFO、首席法律顾问和股权结构表模型。
      - - 经审计 ARR / 收入桥
        - 2025 年收入、ARR、队列桥，以及法定收入与任何经常性收入口径之间的勾稽。
        - 需要据此判断 Thought Machine 应该享受软件型估值倍数，还是按实施占比高的业务定价。
        - 财务团队、审计包和董事会汇报材料。
      - - 毛利率与服务收入组合
        - 软件与服务收入结构、实施绑定率、支持负担和毛利率趋势。
        - 这是任何溢价倍数背后最关键的收入质量问题。
        - 财务和交付运营复核。
      - - 留存与集中度
        - NRR、GRR、头部客户占比、头部合作伙伴占比，以及云 / 服务商集中度。
        - 如果集中度被隐藏，少数大型项目会扭曲价值判断。
        - 商业运营和客户队列分析。
      - - 赢单 / 输单与管线质量
        - 近期企业核心系统项目按竞争对手拆分的赢单和输单，以及参考客户随时间扩张的证据。
        - 在竞争激烈的市场里，把真实护城河和靠 logo 讲故事区分开。
        - 销售运营、董事会管线包和参考客户访谈。
      - - 交付可靠性与领导层连续性
        - 事故历史、迁移 KPI、继任计划，以及 COO 交接后的运营模型。
        - 执行连续性会直接影响投资人能够辩护的溢价。
        - CTO、COO 继任者、CISO 和客户成功负责人。
    notes: 这些是把 Thought Machine 从战略上有意思，转成能够按具体价格清晰投资测算所需的最低尽调文件。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
