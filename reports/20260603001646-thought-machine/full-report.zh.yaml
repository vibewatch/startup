      - number: '4.3'
        title: 成本结构、资本强度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              成本结构上最强的公开信号是间接的：亏损相对收入仍然很大，而且公司在完成大量历史融资之后，2025 年 7 月仍需要进一步追加融资。单凭这一点不能说明公司陷入困境——企业银行软件厂商在利润率拐点前，常常要在
              R&D、合规和全球交付上重投入——但它确实表明资本强度仍然可观。Thought Machine
              自己的资金用途表述指向持续产品开发和增长投入，交付模式也意味着成本基础包括资深客户服务、迁移专家、培训资源和区域支持。


              2025 年 7 月股份配发在财务上也很重要，因为它证明融资不只是叙事，而是一次真实的、多类别资本事件。SH01
              申报记录了多类有投票权、无投票权、普通股和优先股工具，这让股权结构表更复杂，也让外部更难判断经济稀释或下行保护。Companies House 还显示，2025 全年账目要到 2026 年 9
              月才能看到；而投资者恰恰会在当前年度想知道 2025 年融资是稳定了烧钱速度，还是只是延长了现金跑道。


              尽调层面，缺少现金和现金跑道数据是最大的单一阻碍。公开来源可以告诉你公司发生过融资、亏损很高；它们不能告诉你公司现在是否有足够资本进入下一阶段，还是已经在走向下一次融资触发点。
