      - number: '2.2'
        title: 买方分层、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方范围比“Tier 1 银行一步替换整个核心系统”的经典想象更广。Juniper 明确把市场分为社区银行、中型银行和大型机构；Thought Machine 自己的证据集也显示，信用合作社、聚焦 SME
              的挑战者银行、持牌银行和公共部门支付项目都有上线用例。DXC 2025 年发布的方案用托管服务包装，把 Thought Machine 推向中小机构；UST FinX
              则把产品面向缺少内部能力或意愿来承接复杂转型的美国中型银行和信用合作社。Judo Bank、USSFCU 和 General Bank of Canada
              进一步说明，真实买方地图按商业模式切分，而不只是资产规模。


              在银行内部，用户栈也比单纯软件采购更复杂。Oliver Wyman 和 Deloitte 都暗示，核心系统项目由跨职能团队治理，涉及业务、运营、技术、风险和供应商管理。Thought Machine
              的交付页也指向同一方向：它强调自助服务、专家协助和认证交付伙伴，而不是纯许可证销售。这说明经济买方通常是拥有企业级权限的现代化发起人，而产品、架构和支付团队是深度运营用户。


              最重要的商业含义是，采用路径和交付模式无法分开。Thought Machine 卖的不只是软件；它卖的是银行相信迁移风险可以靠分阶段执行、伙伴支持和可配置产品制造来控住。因此，市场既包括 Tier 1
              转型，也包括寻求一条可控、模块化路径摆脱遗留系统的较小机构。
