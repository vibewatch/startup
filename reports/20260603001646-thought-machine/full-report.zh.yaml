            body: >-
              可比口径应把公开可比公司和私募估值现实校验结合起来，而不是假装某一个倍数“正确”。Temenos、nCino、Alkami 和 Q2 展示了 2026
              年市场愿意为那些披露收入、接受投资者审视且利润率结构已知的银行软件公司支付什么价格。基于这组证据，公开区间大约聚在 3.35x 到 4.63x EV / sales；Temenos 在 ARR
              口径上略高，因为有规模、存量客户基础和客户广度。这个区间并不完全贴合 Thought Machine；公司更小、私有化，且可说更云原生。但它仍是最干净的可观察市场锚。


              私募口径上，缺口变得难以忽视。GetLatka 和 CB Insights 仍都指向 $2.7 billion 已披露估值，而 2025 年内部轮没有公开重新标价。使用 GetLatka 的 2024
              年收入代理值，这个过时估值意味着约 38x 收入，远高于当前公开银行软件倍数。这不能证明公司只值公开区间；但它确实证明，任何为旧价格辩护的论点，都需要增长质量、利润率质量或战略稀缺性的私下证据，而这些目前不可见。
                       
