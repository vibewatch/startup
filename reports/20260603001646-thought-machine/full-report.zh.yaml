    title: 风险传导图
    type: dag
    summary: 多数下行情景沿同一条链条传导：实施或领导层压力削弱客户结果，进而带来利润率压力、融资需求和估值风险。
    data:
      nodes:
        - id: n1
          label: 资本依赖
          description: 收入持平、大额亏损，以及 2025 年补充融资。
        - id: n2
          label: 领导层流失
          description: COO/CRO 离任，董事会也换血。
        - id: n3
          label: 实施失误
          description: 迁移延迟、宕机或测试失败。
        - id: n4
          label: 监管外溢
          description: 客户韧性或外包审查加强。
        - id: n5
          label: 伙伴依赖
          description: 系统集成商、支付轨道和云伙伴提供关键支持。
        - id: n6
