    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public regulatory and legal frameworks most directly relevant to Thought Machine's bank-customer
        delivery risk as of 2026-06-03; it excludes customer-specific contract clauses and private supervisory findings.
    rows:
      - - FCA 运营韧性
        - 英国
        - 银行和支付公司必须在 31 Mar 2025 前，将重要业务服务运行在影响容忍度内
        - 中
        - 重大
        - Thought Machine 对外主打韧性的云原生架构和合作伙伴支持的交付
        - 客户宕机或迁移失败，可能在银行韧性审查中触发对供应商的审查
        - 索取面向客户的韧性问卷、审计材料，以及已通过韧性审查的案例
      - - DORA 数字运营韧性与 ICT 第三方监管
        - 欧盟
        - 云和其他 ICT 提供商被明确纳入金融业韧性监管
        - 中
        - 高
        - Thought Machine 支持云部署和合作伙伴主导的运营模式
        - 跨境银行客户可能要求更深入的控制、测试和集中度证据，超过 Thought Machine 公开披露的范围
        - 审阅 DORA 准备材料、分包商图谱，以及客户合同里关于 ICT 第三方控制的承诺
      - - EBA 外包监管预期
        - 欧洲
        - 外包仍是银行采购和供应商管理里的活跃监管议题
        - 中
        - 高
        - Delivery Partner Programme 和托管服务联盟拓宽实施选项
        - 如果责任切得太碎，合作伙伴主导交付会放大依赖和审计范围
        - 索取标准客户合同模型、分包商条款和审计权矩阵
      - - CHAPS / RTGS / ISO 20022 迁移义务
        - 英国支付
        - RT2 已在 2025 年上线，CHAPS 的增强数据要求也已生效
        - 中
        - 高
        - Thought Machine 销售原生 ISO 20022 报文和支付现代化能力
        - 迁移中，测试、切换、数据质量和对账一旦失败，仍会拖累客户项目
        - 审阅项目计划、缺陷日志、对账证据和客户侧测试签字确认
      - - 安全与保障披露缺口
        - 跨境
        - 公开材料讲了韧性理念，但没有给出经审计的保障结果
        - 中
        - 高
        - 安全岗位招聘和工程设计可见
        - 公开认证和事故指标缺位，剩余保障风险仍高
        - 索取 SOC/ISO 状态、渗透测试摘要和事故复盘
      - - 云 / 第三方集中度监管
        - 英国和欧盟
        - 监管机构越来越关注云集中度和关键第三方韧性
        - 中
        - 高
        - Thought Machine 可在多云部署，并披露了具名生态伙伴
        - 公开来源没有披露实际供应商集中度或客户部署组合
        - 按供应商、地区、客户和故障切换设计索取生产部署足迹
    notes: 严重性衡量的不是单纯软件缺陷，而是供应商问题多快会演变成客户合规、韧性或声誉事件。
