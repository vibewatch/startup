  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 在战略上仍然相关，但价格问题现在已经和公司质量问题分离。最强公开正面因素不是理论：公司继续发布与 Zopa、Shawbrook 和 Bpifrance
              的上线参考工作，显示其在存款、贷款和支付上的真实交付能力。最弱环节是估值支撑。公开来源仍回到 2022 年 5 月 $2.7 billion 估值，而 2025 年 7
              月现有投资人追加融资披露了金额，却没有披露估值。这意味着投资人无法从公开证据判断，内部人是重申旧价格、接受持平轮，还是通过条款悄悄下调价格。


              在这个背景下，FY2024 收入和亏损披露比增长市场话术更重要。City AM 和 Tech.eu
              都报道营业额大致持平、亏损扩大，这与仅凭信任支付溢价倍数不一致。因此，有纪律的结论是继续研究，而不是买入。公司可能仍值得给战略溢价，因为产品和参考客户组合是真实的，但今天的公开记录不足以让投资人区分耐久软件经济性和实施较重的增长。价格支撑要么来自低得多的入场点，要么来自私下尽调，证明
              ARR、利润率和股权结构情况比公开记录更干净。
                       
