      - number: '5.3'
        title: 部署、伙伴触达与路线图信号
        blocks:
          - type: paragraph
            body: >-
              差异化来自可配置性、迁移灵活性和伙伴杠杆的组合。Thought Machine 并不声称拥有专有支付网络；它声称的是一个通用编排层，可以放在遗留核心系统、Vault
              Core、外部清算体系和伙伴服务之间。Form3 和 Mastercard 合作以具体方式延伸了这个故事，增加实时账户到账户支付轨道、卡处理触达和原生 ISO-20022 连接。DXC 和 HCLTech
              进一步扩大交付边界，为需要项目化支持、而不是纯自助采用的银行增加托管服务和 DevSecOps 密集型实施能力。支持工具并非事后补丁：Delivery Partner Programme、Enablement
              Portal、路线图、发布说明和认证路径都是产品运营模型的一部分，因为它们决定一家银行能否随着时间降低对供应商的依赖。公开可见的路线图信号有意义，但仍只是发布说明级信号，而不是一份透明、带日期、并对不同清算体系或地理区域给出公开
              ETA 承诺的产品路线图。
