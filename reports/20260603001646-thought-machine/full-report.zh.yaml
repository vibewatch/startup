  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 资本依赖
        - 外部融资需求
        - 在运营效率明显改善前再次融资，或融资条款明显转弱
        - 除非管理层能证明这是主动加速而非被迫融资，否则视为投资逻辑破裂
      - - 迁移 / 宕机风险
        - 公开客户事故或重大切换失败
        - 具名客户项目发生重大宕机、回滚或监管可见的中断
        - 升级对事故处理、客户留存风险和合同责任的尽调
      - - 领导层连续性
        - 高级运营人员流失
        - COO、CRO、客户成功或安全领导层继续流失，且没有清晰继任梯队
        - 假设交付和管线执行风险已经上升，并重新审视销售与实施假设
      - - 合作伙伴集中度
        - 依赖事件
        - Mastercard、HCLTech、DXC 或关键云关系出现重大恶化、不续约或表现不佳
        - 重新测试在受影响伙伴缺位时的独立市场拓展能力和实施产能
      - - 竞争压力
        - 企业核心银行胜率
        - 近期在大型银行现代化周期中，因风险或本地化原因多次输给 Temenos、FIS、Finastra、TCS、Finacle 或 Mambu
        - 下调增长假设，并审查定价或服务让步
      - - 集中度不透明
        - 管理层披露质量
        - 管理层在尽调中无法提供最大客户、最大合作伙伴、续约和供应商依赖的分母
        - 维持信心上限，因为剩余集中度仍无法判断
    notes: 这些触发项要能通过公开事件或标准私募尽调请求监测，而不是停留在抽象风险标签。
    claimRefs:
      - CR007
      - CR028
      - CR033
      - CR041
      - CR048
      - CR049
      - CR050
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 信心
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究
        - 中
        - 高
        - 偏高
        - 若没有重大折价或完整私人数据室，不要按已过时的 2022 年估值标记做投资测算。
    notes: 这是截至 2026-06-03 基于公开证据的判断；该结论明确对价格敏感，而不是泛泛的公司质量评分。
