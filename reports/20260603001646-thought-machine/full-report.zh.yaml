      - number: '7.4'
        title: 剩余风险只有靠硬触发器和私下尽调才能承销
        blocks:
          - type: paragraph
            body: >-
              公开反向记录并非灾难性，但有意义。Finextra 和 UKTN 都报道了 2023
              年裁员，并同意管理层进行过成本削减。两家对被裁职能说法不同：一方强调销售和营销，另一方则包括质量保证和用户体验。这个分歧不只是脚注，因为它会改变投资人从重组中推断出的交付风险。2026
              年招聘页证明运营和安全岗位仍在招聘，但不能证明相对于客户需求，运营人员板凳已经完全重建。


              把本章合起来看，可投资问题不是 Thought Machine
              是否有真实产品或真实客户；前文已经回答。问题是，在下一次外部冲击到来前，资本强度、实施复杂度、领导层连续性和合作伙伴依赖能否一起改善。最干净的打破投资逻辑触发器可以监控：可见效率改善前再次融资；与重要客户项目相关的重大事故或公开迁移失败；交付或商业领导层进一步流失；或者在企业核心系统交易中反复输给销售低风险现代化的大型在位厂商。如果管理层能回答关于现金跑道、可靠性证据、合作伙伴集中度和赢输质量的私下尽调问题，这组风险可管理。否则，下行不是产品不相关，而是执行导致估值压缩。
