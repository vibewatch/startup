  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 核心银行现代化需求真实存在，仍受云和支付结构性顺风支撑。
        - 需要证明品类增长能转化为 Thought Machine 的高质量收入，而不只是一个大 TAM 叙事。
      - - Zopa、Shawbrook、Bpifrance 等已上线客户背书，显示真实交付可信度。
        - 需要留存、集中度和续约数据，证明这些客户背书能转化为耐久经济性。
      - - 产品和交付故事可能支撑其相对普通公开可比公司的部分溢价。
        - 需要经审计的毛利率和服务组合证据，证明溢价应当显著，而不是小幅溢价。
      - - 2025 年追加融资说明内部投资人仍愿意出钱支持公司。
        - 在把该轮视为估值支撑前，需要拿到 2025 年实际每股价格和优先权条款。
      - - 如果管理层能证明软件式经济性，公开可比公司仍给私募溢价留出空间。
        - 需要证据证明 Thought Machine 值得高于当前大约 3x 到 5x 的公开市场区间。
      - - 反向逻辑是，2022 年估值标记属于周期顶部估值，如今缺乏公开证据支撑。
        - 只有管理层证明 2025 年融资接近旧估值，且 2025 或 2026 年运营指标远强于公开记录，这一反向逻辑才会软化。
    notes: 每一行都被表述为会推动价格的论点，而不是对公司质量的静态判断。
    claimRefs:
      - CV006
      - CV018
      - CV021
      - CV022
      - CV025
