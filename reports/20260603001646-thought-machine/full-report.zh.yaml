      - number: '4.2'
        title: 公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的公开牵引力图景好坏参半。一方面，公司已有有意义的收入基础：City AM、Tech.eu 和 Tracxn 都支持 FY2024 收入约为 £47.6m。GetLatka 又给出
              2024 年 $70.6m 的 ARR 式估计，虽然不能与法定收入直接比较，但确实暗示外界认为它已有经常性企业软件规模。另一方面，报道中的收入线相对 2023
              年基本持平，而亏损扩大、员工数下降。这组组合不会拖垮一家私营基础设施公司，但它削弱了“规模自然带来更好经济性”的简单叙事。


              公开单位经济可见度极薄。被审阅来源没有披露毛利率、CAC、回本周期、流失率、NRR
              或实施利润率数据。因此，销售获客效率只能从业务结构中推断：长周期银行转型、重迁移工作、以及对实施伙伴依赖增加，都意味着收入机器摩擦比典型中端市场 SaaS
              厂商更高。这并不等于模式差；它意味着公开数据不足以证明效率。


              主要结论是，Thought Machine
              有足够的收入和客户证据，值得做财务深潜；但公开运营细节不足，无法支撑干净的软件式承销模型。后续尽调必须聚焦收入基础是否经常性且在扩张，还是服务尾巴和实施负担正在压住经济性。
