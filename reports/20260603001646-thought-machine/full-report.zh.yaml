  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的可触达市场，不能负责任地用一个 TAM
              数字概括。公开来源至少描述了三个相互重叠但并不相同的类别：广义核心银行软件市场、云原生核心银行平台市场，以及更窄的核心银行现代化市场。最宽的类别覆盖用于日常银行运营的软件和服务，涵盖存款、贷款、企业客户解决方案和配套功能。这个口径有助于理解类别的最终规模，但会夸大一家私营云原生厂商可直接争夺的池子。最窄的口径——现代化项目——更接近真实预算决策，但也可能低估长期机会，因为它把市场本身看成转型项目，而不是持续平台经济。


              因此，本章层面的最佳结论必须带边界意识：用广义市场作为外层 TAM 背景，用云原生平台市场作为最贴近的类别口径，用现代化支出作为眼前进入预算的楔子。The Business Research Company
              估计广义核心银行软件市场在 2025 年为 $14.35B、2026 年为 $16.06B；DataIntelo 则把 2025 年云原生平台市场放在 $12.4B。Market.us 随后把实际现代化池子收窄到
              2025 年 $1.9B、2026 年 $2.4B。这些数字与其说相互矛盾，不如说是在用不同方式框定同一波战略迁移。


              从地区看，即使绝对值不同，公开证据的方向也一致。北美在广义和云原生两个口径下都是当前最大的支出池，亚太则是增长最快的地区。重要的是，Thought Machine
              的现有客户证据已覆盖欧洲、APAC、北美和公共部门支付项目；在估值语境下，公司机会更应理解为现代化份额和云原生平台份额问题，而不是所有曾用于核心系统的银行 IT 美元中的份额。
