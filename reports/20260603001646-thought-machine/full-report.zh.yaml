      - number: '6.4'
        title: 渠道杠杆有助扩张，但集中度和执行风险仍然重要
        blocks:
          - type: paragraph
            body: >-
              公开客户故事受到合作伙伴显著加持。Mastercard 扩大支付可信度，HCLTech 把 Thought Machine 打包进全球转型项目，DXC 为小型银行提供托管服务路径，ClearPoint
              则体现亚太的本地服务杠杆。合作伙伴层在战略上是正面的，因为它能扩大触达，而不要求 Thought Machine 独自扛下每一项交付动作。不过，它也意味着市场某些部分可能仍依赖合作伙伴，而不是由 Thought
              Machine 自身销售和交付组织直接打穿。


              这很重要，因为反向记录虽然很少涉及失败客户，但并非完全无风险。UKTN 和 Finextra 都记录了 2023 年裁员，对受影响职能有一些分歧，但合起来仍说明，在 Thought Machine
              试图扩大标杆转型项目的同一时期，交付能力和成本纪律一直是现实议题。结论因此是平衡的：参考质量和部署新鲜度足以让人认真看待客户故事，但在管理层披露集中度、留存和续约数据，把 logo
              证据转化为收入质量证据之前，客户质量承销仍只能给中等置信度。
