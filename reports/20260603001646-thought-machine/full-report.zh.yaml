      - number: '2.4'
        title: 采用约束及其给 Thought Machine 的启示
        blocks:
          - type: paragraph
            body: >-
              创造需求的同一批力量，也解释了为什么这个市场仍然难做。核心系统迁移在银行内部昂贵、缓慢，而且政治风险高。公开报告提到成本困难、维护费用上升、韧性担忧、测试负担、供应商协调、数据质量问题，以及让员工同时跨旧新基础设施工作所需的培训挑战。Oliver
              Wyman 的框架尤其贴近真实买方行为：渐进共存通常优于大爆炸式切换，大爆炸式切换会招来监管阻力，选型必须在灵活性、性能和地理可靠性之间平衡。Finantrix
              则把支付侧的技术含义说得很清楚：银行不能简单把即时支付轨道拴到遗留枢纽上，就期待获得 24/7/365 韧性。


              这些约束给 Thought Machine 带来双重战略含义。它们拖慢决策周期、拉长实施时间，但也偏向那些能把云原生架构、伙伴交付和分阶段现代化路径结合起来的厂商。因此，Thought Machine
              的伙伴计划、HCLTech 和 DXC 渠道、以及灵活部署叙事并非边缘事项，而是产品市场契合的一部分。公开数据最大的剩余弱点是商业不透明。公开来源没有给出标准化定价、实施经济性或干净的 Thought
              Machine SAM/SOM，因此后续估值不能从宽泛市场数字过度外推。


              市场章节的底线是，Thought Machine
              所处的类别确实大且在增长，但实际市场受迁移复杂度支配，而不只是软件需求。赢家不只是功能领先者；买方真正信任的是那些能把银行从遗留系统带到上线状态、又不打坏运营模式的厂商。
