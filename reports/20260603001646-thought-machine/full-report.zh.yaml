      - number: '7.2'
        title: 客户监管和支付期限会放大实施风险
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 自身材料讲得很清楚：这不是轻触式 SaaS 部署。公司提供自助服务、专家支持和长期支持；还运行 Delivery Partner
              Programme，因为采纳往往需要经过认证的外部帮助。招聘页仍显示客户成功、前置部署工程、云支持、SRE、威胁检测和安全等岗位开放，这与一个即便更产品化仍然实施较重的运营模型一致。Thought Machine
              的工程叙事在方向上能让人安心：公司用微服务隔离、Kubernetes 式自愈、蓝绿部署和内建加密解释云原生韧性。但公开记录仍没有给出机构投资人想看的内容：经审计的可用性、事故历史、RTO/RPO 或具名安全认证。


              这个披露缺口放在任何企业软件公司都重要；在这里更重要，因为终端客户是受监管金融机构，正处在更严格的韧性制度下。FCA 称，纳入范围的机构必须在 2025 年 3 月 31
              日前，让重要业务服务运行在自身影响容忍度内；其 CrowdStrike 事后经验还称，第三方问题是 2022 至 2023 年间上报运营事故的首要原因。DORA 称，金融业更加依赖 ICT
              第三方，并明确把监管延伸到关键 ICT 第三方提供商，包括云提供商。EBA 继续维护外包指南。除此之外，Bank of England 的 RTGS 更新和 ISO 20022 变化，加上 KPMG 与
              Deloitte 对支付现代化期限的分析，都说明许多银行正在硬期限和测试负担下实施复杂支付改造。对 Thought Machine 来说，这意味着一旦错过迁移里程碑或发生严重宕机，就不会被视为普通供应商
              bug，而会同时冲击客户的韧性项目、采购姿态和面向监管的叙事。
