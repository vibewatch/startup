    summary: 门槛从任一公开标识提高到清晰上线证明、再到扩张证据后，具名参考集迅速收窄。
    data:
      items:
        - label: 已审查的具名公开案例
          value: 7
          detail: Zopa、Trust、Shawbrook、Bpifrance、Judo、USSFCU、GBC 等客户
