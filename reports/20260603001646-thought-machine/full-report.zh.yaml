      - - 广义核心银行软件
        - 核心软件，加上用于存款、贷款、企业客户解决方案、云部署和本地部署的相关专业 / 托管服务
        - 不触及核心账本或核心产品引擎的外围银行 IT
        - 银行、金融机构以及其他通过 IT 和运营预算采购的终端用户
        - 可作为外围 TAM，但过宽，不适合直接假设份额。
      - - 云原生核心银行平台
        - 面向云原生部署、API 优先架构和实时处理打造的现代核心平台
        - 遗留系统包装中间件和无关银行软件服务
        - 正在现代化产品制造、渠道和账本的银行
        - 最适合观察 Thought Machine 产品组合的类别口径。
      - - 核心银行现代化项目
        - 替换或掏空遗留核心以及相邻运营模式的项目预算
        - 上线后的稳态软件收入
        - 银行和信用合作社内的转型负责人
        - 最适合观察短期预算入口。
      - - 支付现代化增量层
        - FedWire、即时支付、SEPA instant、卡和 ISO 20022 相关平台工作
        - 不涉及平台改造的纯网络费用
        - 支付负责人、COO/CIO 发起人、运营团队
        - 重要，因为 Vault Payments 扩大了预算口径。
      - - 现状替代方案
        - 内部自建、双核心、重中间件现代化，以及现有遗留系统升级
        - 仅限绿地挑战者银行的用例
        - 避免整体替换的银行
        - 关键，因为买方常拿部分修补方案来比较，而不只比较直接竞争对手。
