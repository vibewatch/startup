      - number: '7.3'
        title: 合作伙伴杠杆有帮助，但也掩盖集中度并加剧竞争风险
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的合作伙伴生态是真正的缓释因素。Mastercard 延展支付和卡能力；HCLTech 增加认证转型产能和 DevSecOps 框架；DXC 把 Vault
              打包成面向小型银行的托管现代化方案；Lloyds 仍是重要历史证据，说明大型在位银行愿意投资并协作。生态之所以重要，是因为它扩大商业触达，不用逼 Thought Machine
              独自承担每个地域、集成和服务动作。但同一批关系也会制造依赖。如果由合作伙伴主导的渠道对订单或实施变得重要，公司就把收入转化和客户结果都部分外包出去了。公开来源没有披露合作伙伴相关收入是多元还是集中，也没有披露是否有某个单一云、支付或
              SI 关系卡在大部分交付的关键路径上。


              竞争把剩余风险进一步抬高。Temenos、TCS、Finastra、FIS、Finacle 和 Mambu 都在营销可信替代方案，其中几家还公布了 Thought Machine
              目前在披露上无法匹配的规模或更低风险迁移故事。Temenos 报告约 $804 million ARR，以及约 1,550 家机构，涵盖 950 多个核心客户和 600 多个数字客户。TCS 称 BaNCS
              服务超过 100 个市场的 500 多家机构。Finastra 和 FIS 明确营销分阶段现代化和低风险增量迁移。Oliver Wyman 另行认为，渐进式共存通常更受青睐，而 big-bang
              替换风险更高、监管阻力更大。结果是，市场时点并不只是“现代化顺风”。这是一场银行想改变、但往往想用最低风险形态改变的竞赛。Thought Machine
              仍必须证明，它能赢下足够多的交易，同时不过度依赖合作伙伴，也不低估交付负担的定价。
