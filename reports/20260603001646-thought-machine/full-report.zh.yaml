      - number: '3.3'
        title: 分销力量、切换成本与替代方案
        blocks:
          - type: paragraph
            body: >-
              核心银行系统的分销力量仍高度依赖伙伴生态，以及银行对实施能力的信心。因此，即使新厂商架构更干净，拥有长期客户基础的既有供应商也能保持竞争力。FIS、Finastra 和 Temenos
              都在营销模块化或分阶段现代化，让银行不用承担完整替换的跳跃，也能改进技术栈。TCS 和 Finacle 则靠规模、市场覆盖和广泛解决方案套件强化同一逻辑。实际上，Thought Machine
              最强的替代方案不总是另一家新核心系统厂商——往往是使用既有供应商、抽象层或部分自建的低扰动现代化路径。


              Thought Machine 并没有忽视这个市场逻辑。它与 HCLTech 和 DXC
              的联盟很重要，因为这些联盟把公司的触达范围延伸到伙伴主导的转型项目，以及可能不会直接购买纯软件项目的较小机构。即便如此，公司仍缺少许多
              既有供应商能拿出来的公开装机基础和经济透明度。结果是，一个由切换成本、共存设计和伙伴杠杆共同发挥作用的竞争市场。买方实际上是在选择风险包，而不只是功能集。
