      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开财务结论对透明度谨慎偏负面，而不是否定战略潜力。Thought Machine
              看起来已经搭建了真实的企业产品组合、有意义的客户基础，并且仍有足够融资渠道支撑规模化运营。但公开记录还不足以证明收入质量、利润率路径或资本充足性。最近一个已申报年度收入真实但持平；公开摘要中的亏损重大且仍在扩大；2025
              年又需要进一步融资。这些信号不会让一家仍在扩张的基础设施厂商失去价值，但会抬高支撑高估值的门槛。


              核心尽调问题不是 Thought Machine
              能不能卖出去——头部客户、伙伴渠道和生态扩张的组合说明它能。问题是每增加一美元收入，究竟会复利成更高质量的软件经济性，还是只是资助更多实施和支持负担。因为毛利率、现金、现金跑道和 CAC
              都缺失，最安全的结论是公司仍有融资能力，但只能有条件地承销。


              后续估值工作应把本章读成一个反对简单 ARR 倍数思维的警告。如果经常性软件经济性占主导、伙伴渠道正在降低交付拖累，Thought Machine
              可能配得上基础设施溢价倍数。但如果服务组合、烧钱速度或股权结构表复杂度比公开记录暗示的更重，同一个估值叙事会很快变脆。
