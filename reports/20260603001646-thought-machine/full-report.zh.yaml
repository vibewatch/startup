      - number: '8.3'
        title: 情景区间与倍数压缩
        blocks:
          - type: paragraph
            body: >-
              因此，情景框架应该从倍数压缩出发，而不是忽略它。乐观情景不是 Thought Machine 只因曾按旧水平融资，就自然保住旧估值。乐观情景应是参考客户继续扩张，管理层能拿出比财报收入更强的 ARR 桥接，并且
              2025 年融资要么验证了 2022 年价格，要么只是小幅折价。在这种结果下，当前约 $1.6 billion 到 $2.4 billion
              的区间可以成立。基准情景承认公司有真实产品和客户证据，但仍惩罚过时估值、资本依赖和单位经济性缺失，因此落在约 $0.9 billion 到 $1.6 billion。


              悲观情景把当前公开可比公司的压力套到一家公开记录仍显示 2024 年收入持平、亏损扩大的公司上，得出约 $0.4 billion 到 $0.9 billion。换句话说，在管理层证明相反情况前，2022 年
              $2.7 billion 估值应被视为上行天花板。更干净的入场区间应更接近约 $0.8 billion 到 $1.2 billion，除非私下尽调发现收入质量显著强于当前公开来源显示。
                       
