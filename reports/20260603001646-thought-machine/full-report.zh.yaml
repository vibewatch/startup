  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 面对的不是单一竞争者原型。在直接云原生一端，Mambu 是最清晰的正面对手，因为它向希望快速推出产品、降低扰动的银行、金融科技公司、贷款机构和信用合作社销售模块化、API
              优先的现代化方案。在企业套件一端，Temenos、Oracle FLEXCUBE、Finacle、TCS BaNCS、Finastra 和 FIS
              则在产品广度、存量客户信任、本地化，以及满足受监管银行多业务线需求的能力上竞争。这些厂商的架构现代化程度并不相同，但仍有竞争力，因为买方常常选择自己认为能安全落地的平台，而不是纸面上最优雅的平台。


              也就是说，Thought Machine 真正的竞争问题是多线作战。它必须在可配置性和银行复杂度上打赢 Mambu，同时还要说服大型机构不要继续留在或扩大
              Temenos、Oracle、FIS、TCS、Finacle 或 Finastra 的既有栈。Juniper 的 18 家厂商排行榜和 SDK.finance 的 2026
              年厂商列表都强化了一点：市场足够拥挤，买方可以选择分阶段、部分替换或多供应商路线，而不是干净地做单一供应商替换。因此，市场结构偏向那些既有可信产品差异化、又有可信交付和信任信号的厂商。
