      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              架构层面，公开材料始终描述的是一个解耦运营模型。智能合约和配置位于共享平台层之上；账本本身与产品逻辑分离；平台把支付旅程作为可独立配置的流程，而不是硬编码的清算体系连接器。核心平台开放多组
              API，用于记账、迁移和实时流式传输；集成目录则显示，Thought Machine
              预期客户把平台接入开户、CRM、KYC、报表、总账和数据平台，而不是把它作为封闭技术栈运行。共存部署模式很重要，因为它意味着公司预期的是分阶段迁移、共享渠道和逐步替换遗留组件，而不是一次大爆炸式切换。公开开发者信号强化了云原生故事：Thought
              Machine 曾写过自己如何运行基于 Kubernetes 的 monorepo
              环境，并明确监控、日志、密钥和访问控制模式。这有利于技术可信度，但最强的技术细节偏历史，因此当前生产规模吞吐量和故障切换证据仍需客户或 NDA 支持。
