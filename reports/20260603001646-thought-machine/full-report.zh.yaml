companyProfile:
  summary: >-
    Thought Machine 由 Paul Taylor 于 2014 年创立，已成长为云原生核心银行系统领域最知名的私营厂商之一。产品组合以 Vault Core
    为核心，这是一个可配置、实时的核心银行平台，围绕智能合约产品逻辑搭建；Vault Payments 则是云原生支付引擎，面向卡支付和账户到账户支付轨道。公开客户证据覆盖贷款、数字银行、即时支付等用例，客户包括 Tier 1
    和区域性金融机构；合作伙伴生态已包括 Mastercard、Form3、HCLTech 和 DXC。战略逻辑最强的地方在产品架构和现代化适配度；最弱的仍是财务透明度，尤其是毛利率、现金跑道和 2025 年老股东追加融资的估值条款。
