      - number: '1.4'
        title: 里程碑、动能与主要反向背景
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足以支撑一条连贯的公司弧线。Thought Machine 自己的时间线显示，公司从 2014 年创立，到 2018 年与 Lloyds 建立商业关系，再到 2019 年亚太扩张和 Mox
              带来的牵引，2021 年客户和投资者质量跃升，2022 年 Series D 将估值翻倍至 $2.7bn。2024–2025 年期间，故事又从单纯核心系统替换扩展成更完整的平台叙事：Vault Payments
              成为信息中的战略部分，Mastercard 加深合作，HCLTech 和 DXC 把 Thought Machine 定位为更广泛银行现代化方案中的锚定技术。


              同一时间线也浮出最值得注意的警示信号。公开财务报道指向一家仍在大规模亏损的公司：City AM 报道称，2024 年营业额持平、亏损显著扩大、员工数下降。文章还提到 Molten Ventures
              对私募市场账面价值下调，凸显 2022 年醒目估值不应被视为今天的价格。运营上，2025 年报道的 COO 交接很重要，因为核心银行转型是实施密集型项目，不只是软件销售故事。


              合在一起，公司概况支持一个清晰的初步判断。Thought Machine
              具备真实的产品差异化、蓝筹背书和强大的历史融资基础，但还不是一个风险已充分出清的基础设施复利标的。下一层尽调应聚焦近期合作伙伴关系和招牌客户背书是否正在转化为改善的利润率、可重复实施，以及一条从产品声誉走向持久财务表现的可信路径。
