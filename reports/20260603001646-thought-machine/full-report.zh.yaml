  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这样一个判断：公司变现的不止银行技术栈的一层。Thought Machine 销售 Vault Core 和 Vault
              Payments，但被审阅材料也强调交付服务、培训、认证、专家迁移支持和伙伴主导实施。这在财务上很重要，因为它说明公司不是一个简单的自助式 SaaS 故事，软件毛利率不会从第一天起就主导
              P&L。更可能的模式，是平台订阅或许可证收入、实施和迁移服务、支持，以及客户采用支付、即时支付轨道或伙伴集成后由生态带动的扩张。


              这种结构的变现上行在于广度：一家银行上了平台之后，可以靠新产品、支付和伙伴主导的转型工作，用多种方式扩张账户价值。下行是不透明。这里审阅的 Thought Machine
              官方页面，没有披露清单价、合同结构或标准包装。因此，公开记录能说明公司卖什么，但不能说明客户实际付多少钱、经常性收入和项目型收入各占多少、服务组合到底稀释利润率还是具有战略价值。


              因此，本章把定价和收入构成视为尽调缺口，而不是假装公开层面有干净答案。现有合作伙伴和产品公告确实支持支付和生态渠道中的真实变现潜力，但还没有回答更重要的承销问题：每个客户的终身价值中，高质量软件收入占多少，实施密集型交付工作又占多少。
