  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 公开证据下的判断，取决于真实客户证明能否压过过时定价、披露经济性偏弱和公开可比公司约束。
    data:
      nodes:
        - id: A
          label: 战略相关性
          detail: 核心银行现代化仍重要，Thought Machine 仍在活跃备选集合内。
          tone: positive
        - id: B
          label: 真实客户证明
          detail: Zopa、Shawbrook 和 Bpifrance 展示了实际上线产品采用。
          tone: positive
        - id: C
          label: 过时的 2022 年估值标记
          detail: 公开估值支撑仍回指 2022 年 5 月峰值。
          tone: risk
        - id: D
          label: 披露经济性偏弱
          detail: FY2024 收入持平、亏损扩大，2025 年条款披露缺失。
          tone: risk
        - id: E
          label: 公开可比公司区间
          detail: 观察到的 2026 年公开银行软件倍数，大致集中在 3x-5x EV/sales。
          tone: neutral
        - id: F
          label: 继续研究 / 偏高
          detail: 保持跟踪，但如果没有更好的私有尽调资料室或明显更低的入场价格，不要追价。
          tone: risk
      edges:
        - to: B
          label: 支撑相关性
          from: A
        - to: F
          label: 维持投资案
          from: B
        - to: D
          label: 需要验证
          from: C
        - to: E
          label: 触发可比校验
          from: D
        - to: F
          label: 限制价格支撑
          from: E
    claimRefs:
      - CV006
      - CV018
      - CV025
      - CV031
      - CV046
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 相对于 $1.25B 中点基准情景的示意性公允价值变化显示，条款披露和经济性比 TAM 叙事更重要。
    approximationNotes: 美元影响是相对于名义 $1.25B 中点基准情景的示意性变化；它们展示方向性敏感度，不是模型审计。
    data:
      items:
        - label: 2025 年融资轮验证旧估值标记
          value: 0.7
          detail: 如果管理层证明 2025 年 7 月融资在干净条款下基本守住旧价格。
          tone: positive
        - label: 软件式利润率证明
          value: 0.4
          detail: 如果审计数据展示的软件与服务组合，远比公开来源暗示的更干净。
          tone: positive
        - label: 公开可比倍数压缩至 3x
          value: -0.5
          detail: 如果投资人按更接近当前公开软件区间低端的水平做投资假设。
          tone: risk
        - label: 结构化降价融资证据
          value: -0.7
          detail: 如果 2025 年融资最终显示为重定价，或对内部人提供了很强保护。
          tone: risk
        - label: 交付或领导层冲击
          value: -0.4
          detail: 如果公开事故或进一步高管流失削弱迁移可信度。
          tone: risk
    claimRefs:
      - CV029
      - CV031
      - CV035
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公允价值区间仍很宽，因为公开记录还未厘清收入质量、2025 年融资条款或集中度。
    approximationNotes: 区间是情景化投资假设区间，不是 DCF 输出；数值为当前公允价值估计，单位为十亿美元。
    data:
      items:
        - label: 悲观
          low: 0.4
          mid: 0.65
          high: 0.9
          displayValue: $0.4B-$0.9B
          detail: 公开可比倍数压力主导，下一轮融资可能下调价格。
          tone: risk
        - label: 基准
          low: 0.9
          mid: 1.25
          high: 1.6
          displayValue: $0.9B-$1.6B
          detail: Thought Machine 保持战略相关性，但经济性仍只得到部分证明。
          tone: neutral
        - label: 乐观
          low: 1.6
          mid: 2
          high: 2.4
          displayValue: $1.6B-$2.4B
          detail: 管理层证明 ARR、利润率和 2025 年融资质量比公开记录更干净。
          tone: positive
        - label: 优先入场区间
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: $0.8B-$1.2B
          detail: 公开披露缺口在这个区间能得到更好补偿，不需要过度乐观假设。
          tone: positive
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 这些投委会可用评分总结了：Thought Machine 强到值得继续看，也弱到不该追价。
    data:
      items:
        - label: 市场相关性
          value: '7'
          unit: / 10
          detail: 核心银行现代化仍具战略重要性。
          tone: positive
        - label: 客户证明
          value: '7'
          unit: / 10
          detail: 存款、贷款和支付场景都有已上线参考客户。
          tone: positive
        - label: 产品 / 交付证明
          value: '6'
          unit: / 10
          detail: 公开上线案例支撑其相关性，但执行仍成本高、敏感度高。
          tone: neutral
        - label: 经济性透明度
          value: '3'
          unit: / 10
          detail: ARR 桥接、毛利率、服务组合和留存大多仍未公开。
          tone: risk
        - label: 执行韧性
          value: '4'
          unit: / 10
          detail: 领导层流失和迁移风险让下行情景敏感度保持高位。
          tone: risk
        - label: 估值支撑
          value: '2'
          unit: / 10
          detail: 过时的 2022 年估值标记远高于当前公开可比公司区间。
          tone: risk
        - label: 证据质量
          value: '5'
          unit: / 10
          detail: 公开证据足以框定投资案，但不足以打穿价格。
          tone: neutral
    claimRefs:
      - CV021
      - CV027
      - CV030
      - CV043
      - CV046
      - CV047
      - CV048
      - CV049
