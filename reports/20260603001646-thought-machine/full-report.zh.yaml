  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的产品应被理解为银行运营层，而不只是替换核心系统。银行产品团队的工作流从在 Vault Core 中克隆或编写基于智能合约的产品开始，从 Product Library
              选择预配置模式，并在不重新打开供应商代码的情况下调整功能级参数。支付团队的工作流从在 Vault Payments
              中选择支付流、规则、路由和清算体系连接开始，然后让平台实时处理、重试、调查并流式输出生命周期数据。因此，公开模块地图比“核心系统对支付”更宽：它包括产品制造工具、实时账本、API
              和事件表面、集成资产，以及帮助客户把系统立起来的赋能和交付层。这种广度具有战略意义，因为 Thought Machine
              卖给银行的是控制权和变化速度，而不只是交易处理。限制在于，公开材料很好地解释了构件，但没有披露定价、基准转化率或可比较的产品发布生产率数据。
