  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户类型很广，但公开样本分母仍窄
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的公开客户证据显示，它不是只能打一个狭窄细分的供应商，而是能在多类买方中赢单。可见组合里有 Zopa、Trust 这类挑战者银行和数字消费银行，也有 Shawbrook、Judo
              这类专门贷款机构，还有 Bpifrance、USSFCU 这类公共或使命驱动机构，以及通过 General Bank of Canada
              呈现的区域银行兼产品制造商模式。这在战略上有吸引力：产品似乎能横跨存款、贷款和支付，而不是被锁在单一产品线里。


              但问题在于，可见组合仍然是按 logo 展示，而不是有分母支撑。Thought Machine 称自己服务 Tier 1
              银行、小型区域银行和金融科技挑战者，但没有披露客户数、队列结构或按细分拆分的收入。因此，这组客户不应解读为“庞大的存量客户基础”，而应读作“参考客户覆盖面可信，但组合披露不完整”。客户质量问题也就不是
              Thought Machine 能否卖进多个细分，而是这些胜单能否复利成一个耐久、多元的上线客户基础。
