      - number: '6.3'
        title: 耐久性来自扩张和使用信号推断，而不是已披露留存指标
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的公开记录在采纳里程碑上强得多，在耐久经济性上弱得多。证据支持上线、模块扩展和活跃客户机构，但没有披露投资人真正需要的客户质量指标：NRR、GRR、流失率、续约率、合同期限，或
              ARR 大客户集中度。公司确实称有多个上线参考站点和较高客户满意度，也有 Trust 公开谈到客户咨询量下降等零散使用信号。这些信号方向上有帮助，但不能替代组合留存数据。


              公开记录真正显示的是，一些账户会随时间加深。Bpifrance 从核心系统扩展到支付。Zopa 在一家已有规模化客户基础的银行内使用 Vault
              Core，之后又增加了旗舰活期账户。这些都是实在的先落地再扩张信号。但公开可见的耐久性仍是推断，不是测量。因此，本章应把扩张案例视为正面轶事，而不是证明整个客户基础会按高溢价软件估值假设那样续约、扩张并复利。
