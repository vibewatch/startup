tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / dependency
  - Jurisdiction
  - Current trigger
  - Likelihood
  - Severity
  - Mitigation today
  - Residual exposure
  - Diligence path
  enumerationScope:
    coverage: partial
    basis: Covers the public regulatory and legal frameworks most directly relevant to Thought Machine's bank-customer delivery risk as of 2026-06-03; it excludes customer-specific contract clauses and private supervisory findings.
  rows:
  - - FCA operational resilience
    - United Kingdom
    - Banks and payment firms had to operate important business services within impact tolerances by 31 Mar 2025
    - Medium
    - Critical
    - Thought Machine markets resilient cloud-native architecture and partner-supported delivery
    - A customer outage or failed migration can trigger vendor scrutiny during bank resilience reviews
    - Request customer-facing resilience questionnaires, audit artifacts, and examples of passed resilience reviews
  - - DORA digital operational resilience and ICT third-party oversight
    - European Union
    - Cloud and other ICT providers are explicitly relevant to financial-sector resilience oversight
    - Medium
    - High
    - Thought Machine supports cloud deployment and partner-led operating models
    - Cross-border bank customers can demand deeper controls, testing, and concentration evidence than Thought Machine discloses publicly
    - Review DORA readiness pack, subcontractor map, and any customer contractual commitments on ICT third-party controls
  - - EBA outsourcing expectations
    - Europe
    - Outsourcing remains an active supervisory topic in bank procurement and vendor management
    - Medium
    - High
    - Delivery Partner Programme and managed-service alliances widen implementation options
    - Partner-led delivery can increase dependency and audit scope if responsibilities are fragmented
    - Request standard customer contracting model, subcontractor language, and audit-rights matrix
  - - CHAPS / RTGS / ISO 20022 transition obligations
    - United Kingdom payments
    - RT2 went live in 2025 and richer data mandates are now live in CHAPS
    - Medium
    - High
    - Thought Machine sells native ISO 20022 messaging and payments modernization capability
    - Testing, cutover, data quality, and reconciliation failures can still impair customer programs during migration
    - Review program plans, defect logs, reconciliation evidence, and customer-side testing sign-off
  - - Security and assurance disclosure gap
    - Cross-border
    - Public materials describe resilience concepts but not audited assurance outcomes
    - Medium
    - High
    - Security hiring and engineering design are visible
    - Absence of public certifications or incident metrics keeps residual assurance risk high
    - Request SOC/ISO status, pen-test summaries, and incident postmortems
  - - Cloud / third-party concentration oversight
    - UK and EU
    - Regulators increasingly care about cloud concentration and critical third-party resilience
    - Medium
    - High
    - Thought Machine can deploy on multiple clouds and has named ecosystem partners
    - Public sources do not reveal actual provider concentration or customer deployment mix
    - Request production footprint by provider, region, customer, and failover design
  notes: Severity reflects how quickly a vendor issue could become a customer compliance, resilience, or reputational event rather than a standalone software defect.
