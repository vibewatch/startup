  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, 12-18 month runway, covenant headroom, and board-approved financing plan after the July 2025 top-up.
    whyItMatters: Capital dependency is the clearest residual risk in the public record, but the public sources stop before actual runway or downside financing terms.
    diligencePath: Request monthly cash bridge, forecast burn, financing plan, and downside case assumptions through the next 18 months.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: reliability-and-security-assurance
    missingEvidence: Audited uptime history, incident log, RTO/RPO, pen-test results, named certifications, and evidence of customer resilience reviews.
    whyItMatters: The company explains why cloud-native architecture should be resilient, but investors still need proof that the live operating model meets regulated-bank standards.
    diligencePath: Request incident register, SLA pack, audit or certification letters, resilience testing results, and customer security questionnaires.
    relatedQuestionRefs:
    - QR009
    - QR031
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by top customer, top partner, top cloud or rail dependency, renewal dates, and revenue-at-risk if a flagship account slips.
    whyItMatters: Without denominator data, partner leverage could be additive or dangerously concentrated and the public record cannot distinguish the two.
    diligencePath: Request ARR bridge by top ten customers and partners, dependency mapping by provider, and contract renewal calendar.
    relatedQuestionRefs:
    - QR018
    - QR020
    - QR032
    relatedTableRefs:
    - TR003
  - type: conflicting-data
    severity: minor
    topic: layoff-scope
    missingEvidence: A reconciled internal summary of the 2023 cost reduction by function and geography.
    whyItMatters: Finextra and UKTN agree layoffs happened but disagree on which functions were cut, which changes how much delivery risk investors should infer.
    diligencePath: Ask management for the 2023 restructuring scope, impacted functions, and whether delivery or QA capacity was rebuilt.
    relatedQuestionRefs:
    - QR027
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-pipeline-quality
    missingEvidence: Recent enterprise win-loss data, competitive displacement reasons, implementation duration by project phase, and services margin by delivery model.
    whyItMatters: Competition and partner risk can only be underwritten properly if investors can see whether the company is winning, at what pace, and at what delivery cost.
    diligencePath: Request 24-month win-loss log, pipeline conversion by segment, project timeline variance, and gross margin by direct versus partner-led delivery.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: TR001 regulatory-contract-detail
    missingEvidence: Customer-specific outsourcing clauses, supervisory findings, audit-rights schedules, and any remediation items linked to resilience or third-party oversight.
    whyItMatters: The public sources establish that the regulatory burden exists, but they do not show how Thought Machine actually clears customer-specific control reviews in practice.
    diligencePath: Request anonymised customer diligence packs, audit-rights language, resilience questionnaires, and any findings or remediation logs from recent enterprise reviews.
    relatedQuestionRefs:
    - QR011
    - QR030
    relatedTableRefs:
    - TR001
