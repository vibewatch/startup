- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Capital dependency
    - External financing need
    - Another capital raise before visible operating-efficiency improvement or with clearly weaker terms
    - Treat as thesis break unless management can show deliberate acceleration rather than forced funding
  - - Migration / outage risk
    - Public customer incident or major cutover failure
    - A named customer program suffers a material outage, rollback, or regulator-visible disruption
    - Escalate diligence on incident handling, customer retention risk, and contractual liability
  - - Leadership continuity
    - Senior operating churn
    - Further turnover across COO, CRO, client success, or security leadership without a clear successor bench
    - Assume delivery and pipeline execution risk has risen and re-underwrite sales and implementation assumptions
  - - Partner concentration
    - Dependency event
    - Material deterioration, non-renewal, or underperformance in Mastercard, HCLTech, DXC, or key cloud relationships
    - Re-test go-to-market independence and implementation capacity without the affected partner
  - - Competitive pressure
    - Enterprise-core win rate
    - Multiple recent losses in large-bank modernization cycles to Temenos, FIS, Finastra, TCS, Finacle, or Mambu on risk or localization grounds
    - Lower growth assumptions and scrutinize pricing or services concessions
  - - Concentration opacity
    - Management disclosure quality
    - Management cannot provide top-customer, top-partner, renewal, and provider-dependency denominators in diligence
    - Keep confidence capped because residual concentration remains unknowable
  notes: These triggers are designed to be monitorable with either public events or standard private-diligence requests rather than abstract risk labels.
