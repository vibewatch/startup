  topStrengths:
    - >-
      Product architecture is genuinely differentiated through smart-contract configurability, real-time ledgering, and
      a unified core-plus-payments stack.
    - >-
      Public customer proof is stronger than for many private infrastructure vendors, with visible references across
      Zopa, Shawbrook, Bpifrance, Judo, Trust, and other institutions.
    - >-
      Structural market tailwinds remain favorable as banks face legacy-core replacement, ISO 20022 deadlines, and
      instant-payments modernization pressure.
    - >-
      Partner channels with Mastercard, Form3, HCLTech, and DXC broaden go-to-market reach beyond Thought Machine’s
      direct delivery footprint.
  topRisks:
    - >-
      Financial transparency is still below underwriting grade: no public gross margin, runway, CAC, payback, retention,
      or concentration disclosure.
    - >-
      Capital dependence remains material after flat FY2024 revenue, large losses, and a further 2025 insider financing
      round.
    - >-
      Implementation and resilience risk are amplified because customers are regulated banks running complex migrations
      under strict operational-resilience expectations.
    - >-
      Competitive pressure from Temenos, FIS, Finastra, Oracle, Finacle, TCS, and Mambu can compress pricing and make
      phased coexistence more attractive than displacement.
  unresolvedGaps:
    - 2025/2026 cash balance, burn, runway, and debt obligations remain undisclosed publicly.
    - >-
      Gross margin, services mix, and retention metrics are missing, preventing a clean view of software-quality
      economics.
    - The July 2025 round amount is public, but its valuation, terms, and preference-stack implications are not.
    - >-
      Customer concentration, renewal behavior, and pricing architecture are not disclosed well enough to support
      premium private-software multiples.
