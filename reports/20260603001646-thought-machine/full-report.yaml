      - number: '8.2'
        title: Public versus private comparable lens
        blocks:
          - type: paragraph
            body: >-
              The comparable lens should combine public comps and a private-mark reality check rather than pretending a
              single multiple is “correct.” Temenos, nCino, Alkami, and Q2 all show what the 2026 market will pay for
              banking-software businesses with disclosed revenue, investor scrutiny, and known margin structures. On
              this evidence set, the public band clusters around about 3.35x to 4.63x EV to sales, with Temenos somewhat
              richer on an ARR lens because of scale, installed base, and client breadth. That band is not a perfect fit
              for Thought Machine; the company is smaller, private, and arguably more cloud-native. But it is still the
              cleanest observable market anchor.


              The private lens is where the gap becomes hard to ignore. GetLatka and CB Insights both still point to a
              $2.7 billion disclosed valuation, while the 2025 insider round lacked a public re-mark. Using GetLatka’s
              2024 revenue proxy, that stale mark implies roughly 38x revenue, far above current public banking-software
              multiples. That does not prove the company is worth only the public band; it does prove that any defense
              of the old price requires private evidence of growth quality, margin quality, or strategic scarcity that
              is not currently visible.
                      
