          detail: If audited data shows a much cleaner software-versus-services mix than public sources imply.
          tone: positive
        - label: Public comp compression to 3x
          value: -0.5
          detail: If investors underwrite closer to the low end of today’s public software band.
          tone: risk
        - label: Structured down-round evidence
          value: -0.7
          detail: If the 2025 financing turns out to have repriced or protected insiders heavily.
          tone: risk
        - label: Delivery or leadership shock
          value: -0.4
          detail: If migration credibility weakens after a public incident or further executive churn.
          tone: risk
    claimRefs:
      - CV029
      - CV031
      - CV035
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The fair-value range remains wide because the public record does not yet resolve revenue quality, 2025 financing
      terms, or concentration.
    approximationNotes: Ranges are scenario underwriting bands, not DCF outputs; values are current fair-value estimates in USD billions.
    data:
      items:
        - label: Bear
          low: 0.4
          mid: 0.65
          high: 0.9
          displayValue: $0.4B-$0.9B
          detail: Public comp pressure dominates and the next financing would likely reset price lower.
          tone: risk
        - label: Base
          low: 0.9
          mid: 1.25
          high: 1.6
          displayValue: $0.9B-$1.6B
          detail: Thought Machine keeps strategic relevance but remains only partially proven economically.
          tone: neutral
        - label: Bull
          low: 1.6
          mid: 2
          high: 2.4
          displayValue: $1.6B-$2.4B
          detail: Management proves cleaner ARR, margins, and 2025 round quality than the public record shows.
          tone: positive
        - label: Preferred entry zone
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: $0.8B-$1.2B
          detail: Range where the public disclosure gaps are better compensated without heroic assumptions.
          tone: positive
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      These IC-ready scores summarize where Thought Machine is strong enough to keep watching and weak enough to avoid
      chasing price.
    data:
      items:
        - label: Market relevance
          value: '7'
          unit: / 10
          detail: Core-banking modernization remains strategically important.
          tone: positive
        - label: Customer proof
          value: '7'
          unit: / 10
          detail: Live reference customers exist across deposits, lending, and payments.
          tone: positive
        - label: Product / delivery proof
          value: '6'
          unit: / 10
          detail: Public launches support relevance, but execution remains costly and sensitive.
          tone: neutral
        - label: Economics transparency
          value: '3'
          unit: / 10
          detail: ARR bridge, gross margin, services mix, and retention remain mostly private.
          tone: risk
        - label: Execution resilience
          value: '4'
          unit: / 10
          detail: Leadership churn and migration risk keep downside sensitivity high.
          tone: risk
        - label: Valuation support
          value: '2'
          unit: / 10
          detail: The stale 2022 mark is far above today’s public comp band.
          tone: risk
        - label: Evidence quality
          value: '5'
          unit: / 10
          detail: Enough public evidence exists to bound the case, but not to clear the price.
          tone: neutral
    claimRefs:
