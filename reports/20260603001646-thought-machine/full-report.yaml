      - number: '2.3'
        title: Growth drivers and regulatory catalysts
        blocks:
          - type: paragraph
            body: >-
              Demand for core modernization is being pulled forward by a combination of legacy decay, real-time customer
              expectations, and hard payment-system deadlines. Public market reports argue that a majority of banks
              still run on systems more than 20 years old, while maintenance consumes disproportionate amounts of IT
              budget and crowds out innovation. That alone would support a long-tail replacement cycle. What accelerates
              the timeline is the payments layer: ISO 20022 deadlines, instant-payment adoption, and broader
              operational-resilience expectations force banks to upgrade not just messaging formats but the architecture
              underneath them.


              The Bank of England’s ISO 20022 materials are especially useful because they translate modernization from
              vendor marketing into infrastructure policy. The regulator highlights compliance, resilience,
              straight-through processing, analytics, and innovation as direct benefits of richer messaging. KPMG’s
              survey adds an executive-demand signal: most responding US banks are already modernizing or planning to
              modernize multiple payment types, with instant payments and high-value wires near the front of the queue.
              Deloitte further makes clear that these are not optional changes for relevant participants, noting the
              CHIPS and Fedwire deadlines and the operational risk of delaying migration.


              For Thought Machine, this driver stack matters because it expands the company’s addressable need state
              beyond “replace a core” to “build an always-on, ISO-ready, product-configurable bank stack.” Vault
              Payments, USSFCU’s phased FedWire/FedNow plan, and Bpifrance’s SEPA instant program all show how payments
              modernization can be an entry vector or budget amplifier even when a bank is not replacing every legacy
              system at once.
