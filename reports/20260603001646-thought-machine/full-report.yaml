  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Thought Machine's product should be read as a bank-operations layer, not just a replacement core. For a
              bank product team, the workflow starts with cloning or authoring smart-contract-based products inside
              Vault Core, selecting preconfigured patterns from the Product Library, and adjusting feature-level
              parameters without reopening vendor code. For a payments team, the workflow starts with choosing payment
              flows, rules, routing and scheme connections inside Vault Payments, then letting the platform process,
              retry, investigate and stream lifecycle data in real time. The public module map is therefore broader than
              "core versus payments": it includes product manufacturing tooling, the real-time ledger, API and event
              surfaces, integration assets, and the enablement and delivery layer that helps clients stand the system
              up. This breadth is strategically important because Thought Machine is selling control and change velocity
              to banks, not only transaction processing. The limitation is that publicly available materials explain the
              building blocks well, but do not disclose pricing, benchmark conversion rates, or comparable
              product-launch productivity data.
