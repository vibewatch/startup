      - number: '3.3'
        title: Distribution power, switching costs, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Distribution power in core banking still rests heavily with partner ecosystems and bank confidence in
              implementation capacity. That is why incumbents with long-standing customer bases can remain competitive
              even when newer vendors offer cleaner architectures. FIS, Finastra, and Temenos all market modular or
              phased modernization, allowing banks to improve the stack without taking a full rip-and-replace leap. TCS
              and Finacle reinforce the same logic through scale, market coverage, and broad solution suites. In effect,
              the strongest substitute to Thought Machine is not always another new core vendor — it is often a less
              disruptive modernization path using an incumbent, an abstraction layer, or partial internal build.


              Thought Machine is not ignoring this dynamic. Its alliances with HCLTech and DXC matter because they
              extend the company’s reach into partner-led transformation programs and smaller institutions that might
              not buy a pure software project directly. Even so, the company still lacks the publicly disclosed
              installed base and economic transparency that many incumbents can point to. The result is a competitive
              market where switching cost, coexistence design, and partner leverage do as much work as architecture.
              Buyers are effectively choosing risk packages, not only feature sets.
