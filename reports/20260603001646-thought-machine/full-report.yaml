      - number: '1.2'
        title: Leadership, board, and control signals
        blocks:
          - type: paragraph
            body: >-
              Thought Machine remains founder-led, with Paul Taylor still central to both product vision and
              capital-markets narrative. Independent interviews describe him as the product-minded architect of the
              company’s anti-lock-in thesis, while external reporting on IPO ambitions shows he is also the public voice
              on whether and where the business may eventually list. That concentration is a double-edged sword: it
              helps preserve strategic coherence in a long-cycle infrastructure company, but it also creates key-person
              dependence at a time when the organization is balancing product expansion, global delivery, and eventual
              public-market readiness.


              Governance has broadened over time. Companies House shows a multi-director board including long-standing
              chair Andy Maguire, investor-linked directors such as Hala Fadel and John Marsh, and more recent additions
              like Michael Ashworth. Thought Machine’s 2020 chair announcement is important because it marked a pivot
              from startup-era software oversight toward more bank-scale operating experience via Maguire’s HSBC
              background. The July 2025 allotment and December 2025 director appointments also indicate that the
              financing story and board composition evolved after the headline 2022 Series D, even though the company
              did not publish a fresh valuation alongside those changes.


              The main recent negative signal is executive churn. FinTech Futures reported that COO Gareth Richardson
              planned to step down in summer 2025 after building delivery and client-success capabilities for more than
              six years, and it also noted the departure of CRO Liam Leahy in April. Neither departure invalidates the
              business model, but both matter because large-bank transformations depend heavily on senior delivery
              continuity. The combination of founder centrality, new board appointments, and operational leadership
              change is enough to warrant a follow-up diligence workstream on succession depth and governance rights
              tied to the 2025 financing.
