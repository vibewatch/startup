      - number: '6.3'
        title: Durability is inferred from expansion and usage signals, not reported retention metrics
        blocks:
          - type: paragraph
            body: >-
              Thought Machine’s public record is much stronger on adoption milestones than on durable economics. The
              evidence supports live launches, module expansions, and active customer institutions, but it does not
              disclose the metrics an investor would actually want for customer quality: NRR, GRR, churn, renewal rate,
              contract duration, or top-customer share of ARR. The company does say it has multiple live reference sites
              and high measures of client satisfaction, and there are scattered usage signals such as Trust publicly
              discussing lower customer-query volume. Those are directionally helpful, but they are not substitutes for
              portfolio retention data.


              What the record does show is that some accounts deepen over time. Bpifrance moved from core to payments.
              Zopa used Vault Core inside a bank that already had a scaled customer base and then added a flagship
              current account. Those are real land-and-expand signals. But public durability is still inferred rather
              than measured. That means the chapter should treat expansion examples as positive anecdotes, not as proof
              that the whole customer base renews, expands, and compounds the way a premium software valuation would
              assume.
