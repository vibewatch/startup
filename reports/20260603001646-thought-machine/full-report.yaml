      - number: '7.2'
        title: Implementation risk is amplified by customer regulation and payments deadlines
        blocks:
          - type: paragraph
            body: >-
              Thought Machine’s own materials make clear that this is not a light-touch SaaS deployment. The company
              offers self-service, expert support, and long-term support; it also runs a Delivery Partner Programme
              because adoption often requires certified external help. The careers page still shows open roles across
              client success, forward deployed engineering, cloud support, SRE, threat detection, and security, which is
              consistent with an operating model that remains implementation heavy even as the company productizes more
              of the stack. Thought Machine’s engineering narrative is directionally reassuring: the firm explains
              cloud-native resilience through microservice isolation, Kubernetes-style self-healing, blue-green
              deployment, and encryption-by-design. But the public record still stops short of what institutional
              investors would want: audited uptime, incident history, RTO/RPO, or named security certifications.


              That disclosure gap would matter in any enterprise-software company; here it matters more because the end
              customers are regulated financial institutions operating under tougher resilience regimes. The FCA says
              in-scope firms had until 31 March 2025 to operate important business services within their impact
              tolerances, and its post-CrowdStrike lessons say third-party issues were the leading cause of operational
              incidents reported between 2022 and 2023. DORA says finance has become more dependent on ICT third parties
              and explicitly extends oversight to critical ICT third-party providers, including cloud providers. The EBA
              continues to maintain outsourcing guidelines. On top of that, the Bank of England’s RTGS renewal and ISO
              20022 changes, plus KPMG and Deloitte’s analysis of payment-modernization deadlines, show that many banks
              are implementing complex payments changes under hard timelines and testing burdens. For Thought Machine,
              that means a missed migration milestone or severe outage would not read like an ordinary vendor bug. It
              would hit the customer’s resilience program, procurement posture, and regulator-facing narrative at the
              same time.
