            body: >-
              On architecture, the public materials consistently describe a decoupled operating model. Smart contracts
              and configuration sit above a shared platform layer; the ledger itself is separated from product logic;
              and payment journeys are treated as independently configurable flows rather than hard-coded scheme
              connectors. The core platform exposes multiple APIs for postings, migration and real-time streaming, while
