      - number: '6.4'
        title: Channel leverage helps expansion, but concentration and execution risk stay material
        blocks:
          - type: paragraph
            body: >-
              The public customer story is helped materially by partners. Mastercard broadens payments credibility,
              HCLTech packages Thought Machine into global transformation programs, DXC creates a managed-service route
              for smaller banks, and ClearPoint shows local services leverage in APAC. That partner layer is
              strategically positive because it can widen reach without requiring Thought Machine to carry every
              delivery motion alone. It also implies, however, that some parts of the market may remain
              partner-dependent rather than directly penetrated by Thought Machine’s own sales and delivery
              organization.


              That matters because the adverse record is light on failed customers but not completely risk-free. UKTN
              and Finextra both documented 2023 layoffs, with some disagreement over which functions were most affected,
              but together they still show that delivery capacity and cost discipline have been active issues during the
              period when Thought Machine was also trying to scale marquee transformations. The result is a balanced
              verdict: reference quality and deployment freshness are strong enough to take the customer story
              seriously, but customer-quality underwriting remains medium confidence until management discloses
              concentration, retention, and renewal data that turns logo proof into revenue-quality proof.
