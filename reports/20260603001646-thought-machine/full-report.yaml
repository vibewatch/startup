      - number: '8.4'
        title: Final diligence asks and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is clear. Investors need the July 2025 round terms, an audited 2025 ARR or revenue
              bridge, software-versus-services mix, gross margin, retention, and concentration. Without those files, the
              underwriting question is not “is Thought Machine a real company?” but “what exactly are investors paying
              for?” The thesis breaks quickly if management discloses a clear markdown from the 2022 peak, if another
              raise arrives before visible efficiency improvement, or if a public migration failure or further executive
              churn damages delivery credibility.


              FinTech Futures’ report on the COO transition makes that sensitivity more concrete: premium private
              software multiples depend on execution continuity as much as on product elegance. The price-sensitive
              recommendation is therefore to stay engaged but disciplined. Public evidence supports strategic relevance
              and real customer proof, yet it does not support chasing the stale 2022 mark. The call can move to buy
              only if management proves that the 2025 financing held valuation quality and that the business economics
              are far more software-like than the public record currently discloses.
                      
