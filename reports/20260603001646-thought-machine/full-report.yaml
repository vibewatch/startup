  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation status
      - Relevance
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public and quasi-public valuation anchors actually used in this chapter: the stale Thought Machine
        private mark, the 2025 insider top-up, and four public banking-software read-throughs. Recent private
        core-banking rounds with clean disclosed multiples are sparse in the reviewed public record.
    rows:
      - - Thought Machine (May 2022 disclosed mark)
        - $2.7B disclosed valuation versus $70.6M 2024 database revenue proxy
        - ~38x on a stale mark / later revenue lens
        - Direct subject-company anchor for peak private pricing
        - Valuation and revenue come from different vintages and non-filing third-party sources.
      - - Thought Machine (July 2025 insider top-up)
        - £44.8M-£45M round from existing investors
        - Fresh financing signal, but no public price update
        - Shows insiders were still willing to fund the business in 2025
        - No public valuation, price per share, or preference disclosure.
      - - Temenos
        - $6.15B market cap versus $1.09B revenue / $804.2M ARR
        - ~5.6x market-cap-to-revenue and ~7.6x market-cap-to-ARR
        - Incumbent upper-bound public read-through with scale and disclosure
        - Much larger installed base and broader disclosure than Thought Machine.
      - - nCino
        - $2.05B EV versus $610.06M TTM revenue
        - ~3.35x EV / sales
        - Cloud-banking software public comp with disclosed margins and investor scrutiny
        - US lending-software mix is not a direct core-banking analogue.
      - - Alkami
        - $2.18B EV versus $471.94M TTM revenue
        - ~4.63x EV / sales
        - Higher-growth digital-banking software comp and public premium case
        - US retail-bank and credit-union skew differs from Thought Machine’s enterprise-core positioning.
      - - Q2
        - $3.02B EV versus $821.58M TTM revenue
        - ~3.68x EV / sales
        - Scaled digital-banking platform comp that helps bound the middle of the public band
        - Broader digital-banking stack and customer mix make it an imperfect like-for-like comparison.
    notes: >-
      Multiples are approximate read-throughs using the reviewed public market-cap, enterprise-value, revenue, and ARR
      data; the Thought Machine rows are included to show private-mark tension, not to imply those private marks are
      fully current.
