      - number: '2.4'
        title: Adoption constraints and implications for Thought Machine
        blocks:
          - type: paragraph
            body: >-
              The same forces that create demand also explain why the market stays hard. Core migration is expensive,
              slow, and politically risky inside a bank. Public reports cite cost difficulties, rising maintenance
              expense, resilience concerns, testing burdens, vendor coordination, data-quality problems, and the
              challenge of training staff across old and new infrastructures. Oliver Wyman’s framework is especially
              aligned with real buyer behavior: progressive coexistence is usually preferred, big-bang cutovers invite
              regulatory pushback, and vendor selection must balance flexibility with performance and geographic
              reliability. Finantrix makes the technology implication explicit for payments: banks cannot simply bolt
              instant rails onto legacy hubs and expect 24/7/365 resilience.


              For Thought Machine, these constraints are strategically double-edged. They slow decision cycles and
              lengthen implementation timelines, but they also favor vendors that can combine cloud-native architecture
              with partner-enabled delivery and phased modernization paths. Thought Machine’s partner program, HCLTech
              and DXC channels, and flexible deployment narrative are therefore not peripheral—they are part of the
              product-market fit. The biggest remaining public-data weakness is commercial opacity. Public sources do
              not reveal standardized pricing, implementation economics, or a clean Thought Machine SAM/SOM, which means
              later valuation work must be careful not to over-extrapolate from broad market numbers.


              The market chapter’s bottom line is that Thought Machine sits in a genuinely large and growing category,
              but the practical market is governed by migration complexity rather than software demand alone. The
              winning vendors are not just feature leaders; they are the ones buyers trust to get from legacy to live
              without breaking the bank’s operating model.
