      - number: '7.3'
        title: Partner leverage helps, but it also hides concentration and intensifies competitive risk
        blocks:
          - type: paragraph
            body: >-
              Thought Machine’s partner ecosystem is a genuine mitigant. Mastercard extends payments and card
              capability; HCLTech adds certified transformation capacity and DevSecOps framing; DXC packages Vault into
              a managed modernization offer for smaller banks; Lloyds remains an important historical proof point that a
              major incumbent was willing to invest and collaborate. That ecosystem matters because it broadens
              go-to-market reach and avoids forcing Thought Machine to carry every geography, integration, and services
              motion alone. But those same relationships create dependency. If partner-led channels become material to
              bookings or implementation, the company is partially outsourcing both revenue conversion and customer
              outcomes. Public sources do not disclose whether partner-linked revenue is diversified or concentrated,
              nor whether any single cloud, payments, or SI relationship sits on the critical path for a large share of
              delivery.


              Competition raises the residual risk further. Temenos, TCS, Finastra, FIS, Finacle, and Mambu all market
              credible alternatives, and several publish scale or lower-risk migration stories that Thought Machine
              cannot yet match on disclosure. Temenos reported about $804 million of ARR and about 1,550 institutions
              across 950-plus core and 600-plus digital clients. TCS says BaNCS serves more than 500 institutions in
              more than 100 markets. Finastra and FIS explicitly market phased modernization and lower-risk incremental
              migration. Oliver Wyman separately argues progressive coexistence is usually preferred while big-bang
              replacements face higher risk and regulatory pushback. The result is that market timing is not simply
              ‘tailwind from modernization.’ It is a race where banks want change, but often in the least risky form
              possible. Thought Machine still has to prove it can win enough of those deals without over-relying on
              partners or underpricing the delivery burden.
