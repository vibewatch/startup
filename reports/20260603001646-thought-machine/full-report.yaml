  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Thought Machine does not face a single competitor archetype. At the direct cloud-native end, Mambu is the
              clearest head-to-head peer because it sells modular, API-first modernization to banks, fintechs, lenders,
              and credit unions that want rapid product launch and lower disruption. At the enterprise-suite end,
              Temenos, Oracle FLEXCUBE, Finacle, TCS BaNCS, Finastra, and FIS compete on breadth, installed-base trust,
              localization, and the ability to meet the needs of regulated banks across multiple business lines. These
              vendors are not all equally modern in architecture, but they remain competitive because buyers often
              choose a platform they believe they can implement safely over the platform that is most elegant on paper.


              This means Thought Machine’s real competitive problem is multi-front. It must beat Mambu on
              configurability and bank complexity, while also persuading large institutions not to stay with or expand
              incumbent stacks from Temenos, Oracle, FIS, TCS, Finacle, or Finastra. Juniper’s 18-vendor leaderboard and
              SDK.finance’s 2026 vendor list both reinforce that the market is crowded enough for buyers to take phased,
              partial, or multi-vendor routes rather than make a clean single-vendor replacement decision. The market’s
