  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital risk and leadership transition are linked, not separate
        blocks:
          - type: paragraph
            body: >-
              Thought Machine’s most immediate risk is that financing dependency and execution continuity reinforce one
              another. The public record still shows a business with real product demand and credible customers, but not
              one that has clearly crossed into self-funding software economics. City AM and Tech.eu both describe
              FY2024 revenue of about £47.6 million, a flat year on year top line, wider losses, and lower headcount.
              The July 2025 share allotment and related reporting then show that the company still required a roughly
              £45 million top-up from existing investors. That is not proof of distress; many infrastructure companies
              fund through long implementation cycles. It is, however, proof that the model still depends on external
              capital while management tries to convert product strength into cleaner operating leverage.


              That capital picture matters more because senior roles moved at the same time. Thought Machine added chair
              experience through Andy Maguire and refreshed board seats in late 2025, which is directionally positive
              for governance. But FinTech Futures also reported COO Gareth Richardson’s departure after building
              delivery, client success, and partnership teams, and noted the CRO had already left in April. In a
              regulated-enterprise software business, those are not cosmetic changes. Delivery leadership, customer
              success, enterprise selling, and board oversight all shape whether large migrations land on time and
              whether new pipeline converts without margin blowouts. The risk is therefore not simply ‘needs capital’ or
              ‘had leadership change’; it is that another financing need arriving before the new leadership
              configuration proves itself would compress strategic flexibility quickly.
            claimRefs:
              - CR001
              - CR002
              - CR003
