              Machine supplies the implementation timeline and Shawbrook’s own product page shows the buy-to-let
              mortgage offer is a real commercial product for professional landlords.


              Bpifrance and Judo are also strong references, but in a slightly different way. Bpifrance’s Thought
              Machine release offers the best expansion proof in the set because it ties a 2022 core decision to later
              payments production. Judo’s public pages prove it is a serious SME bank and listed institution, while
              Thought Machine provides the migration sequence. By contrast, USSFCU and GBC are meaningful logos but
              still read as signed, ongoing transformations rather than publicly corroborated live deployments. That
