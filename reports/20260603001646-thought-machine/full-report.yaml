      - number: '7.4'
        title: Residual risk is underwritable only with hard triggers and private diligence
        blocks:
          - type: paragraph
            body: >-
              The public adverse record is not catastrophic, but it is meaningful. Finextra and UKTN both reported 2023
              layoffs and agree that management ran a cost reduction exercise. They disagree on which functions were
              cut, with one source emphasizing sales and marketing while the other includes quality assurance and user
              experience. That disagreement is more than a footnote because it changes how much delivery risk an
              investor should infer from the restructuring. The 2026 careers page proves hiring continued across
              operations and security, but it does not prove the operating bench is now fully rebuilt relative to
              customer demand.


              Putting the chapter together, the investable question is not whether Thought Machine has a real product or
              real customers; earlier chapters already answer that. The question is whether capital intensity,
              implementation complexity, leadership continuity, and partner dependency can all improve together before
              another external shock arrives. The cleanest thesis-break triggers are monitorable: another capital raise
              before visible efficiency improvement; a major incident or public migration failure tied to an important
              customer program; further executive churn across delivery or commercial leadership; or repeated losses in
              enterprise core deals to larger incumbents selling lower-risk modernization. If management can answer the
              private diligence asks on runway, reliability evidence, partner concentration, and win-loss quality, the
              risk set is manageable. If not, the downside is valuation compression driven by execution rather than by
              product irrelevance.
            claimRefs:
              - CR044
              - CR045
              - CR046
