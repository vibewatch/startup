  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - 2025 round repriced down or heavily structured
        - Management discloses a material markdown, ratchet, or preference stack inconsistent with the old public mark.
        - Directly invalidates the idea that the 2022 valuation still holds.
        - Re-underwrite toward the base-to-bear range immediately.
      - - Another capital raise before visible efficiency improvement
        - A new round arrives before management shows stronger revenue quality or loss improvement.
        - Confirms capital dependency remains the dominant valuation driver.
        - Treat as a thesis break unless the raise is clearly opportunistic on stronger terms.
      - - Public migration failure or serious outage
        - A flagship customer launch suffers a material rollback, outage, or regulator-visible failure.
        - Compresses both the execution premium and the right private multiple.
        - Move the case toward avoid unless issue scope is clearly contained.
      - - Further operating leadership churn
        - Additional turnover hits delivery, commercial, or client-success leadership without a clear successor bench.
        - Weakens the execution case that supports any premium multiple.
        - Pause underwriting until continuity and bench strength are proven.
      - - Large-bank buyers keep choosing lower-risk incumbents
        - >-
          Repeated losses in visible core-modernization cycles favor better-disclosed incumbents on risk or localization
          grounds.
        - Shrinks the addressable high-value win set that underpins the bull case.
        - Lower the private premium and re-test the base case against public comp discipline.
    notes: These triggers are designed to change price, not simply to restate generic risk categories.
    claimRefs:
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - 2025 round terms
        - >-
          Price per share, investor list, pre-money or post-money valuation, and liquidation preferences for the July
          2025 financing.
        - This is the fastest way to test whether the stale 2022 mark still has any real support.
        - CFO, lead counsel, and cap-table model.
      - - Audited ARR / revenue bridge
        - >-
          2025 revenue, ARR, cohort bridge, and reconciliation between statutory revenue and any recurring-revenue
          presentation.
        - Needed to know whether Thought Machine deserves software-like or implementation-heavy multiples.
        - Finance team, auditor pack, and board reporting deck.
      - - Gross margin and services mix
        - Software versus services revenue mix, implementation attachment, support burden, and gross-margin trend.
        - This is the key quality-of-revenue question behind any premium multiple.
        - Finance and delivery-operations review.
      - - Retention and concentration
        - NRR, GRR, top-customer share, top-partner share, and cloud/provider concentration.
        - A few large programs can distort value if concentration is hidden.
        - Commercial operations and customer cohort analysis.
      - - Win-loss and pipeline quality
        - Recent enterprise-core wins and losses by competitor, plus proof that reference customers expand over time.
        - Separates real moat from logo-led storytelling in a competitive market.
        - Sales operations, board pipeline pack, and reference-customer interviews.
      - - Delivery reliability and leadership continuity
        - Incident history, migration KPIs, succession plan, and post-COO transition operating model.
        - Execution continuity is a direct input into the premium investors can justify.
        - CTO, COO successor, CISO, and customer success leadership.
    notes: >-
      These are the minimum diligence files needed to convert Thought Machine from strategically interesting to clearly
      underwritable at a specific price.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
