companyProfile:
  summary: >-
    Thought Machine was founded in 2014 by Paul Taylor and has grown into one of the best-known private vendors in
    cloud-native core banking. Its product set centers on Vault Core, a configurable real-time core banking platform
    built around smart-contract product logic, and Vault Payments, a cloud-native payments engine designed for cards and
    account-to-account rails. Public customer proof spans Tier 1 and regional institutions across lending, digital
    banking, and instant payments use cases, while the company’s partner ecosystem now includes Mastercard, Form3,
    HCLTech, and DXC. The strategic case is strongest on product architecture and modernization relevance; the weakest
    area remains financial transparency, particularly around gross margin, cash runway, and the valuation terms of the
    2025 insider top-up.
  founders:
