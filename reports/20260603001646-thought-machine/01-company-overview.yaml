sections:
- id: identity-and-product
  title: Identity, footprint, and product thesis
  body: |-
    Thought Machine is a London-headquartered banking infrastructure vendor that was founded in 2014 by Paul Taylor, whose earlier speech-technology company Phonetic Arts was acquired by Google. The public-company shell used for filings is Thought Machine Group Limited, incorporated in late 2017, while the operating narrative on the company website frames the business as a global team serving banks across Europe, Asia, North America, Australasia, and the Middle East. The distinction between the registered office at New Street Square and the public headquarters at Herbrand Street is not problematic by itself, but it is relevant for diligence because it signals the split between legal domicile and front-door commercial presence.

    The company sells two tightly linked products: Vault Core for core banking and Vault Payments for payment processing. Across its homepage, product pages, and partner announcements, Thought Machine consistently presents both systems as cloud-native platforms written from scratch, with no legacy code, high-availability characteristics, and bank-controlled configurability. Vault Core’s smart-contract layer is the most repeated differentiator in the evidence set: product logic sits outside hard-coded platform behavior, which lets banks define or migrate products without the lock-in and release-cycle drag associated with closed-box incumbent cores. Vault Payments extends the same thesis into card and account-to-account processing, positioning itself as a real-time, ISO 20022-native engine that can run standalone against a legacy core or pre-integrated with Vault Core.

    The geographic footprint is material because Thought Machine’s sales motion depends on serving large regulated banks across multiple regions. Third-party partner releases from HCLTech and DXC independently described offices in London, New York, Singapore, and Sydney in 2025, while Thought Machine’s 2022 Series D release referenced Sydney and Miami expansion plans. That evidence supports a credible international go-to-market footprint, but it still does not disclose region-by-region headcount or delivery concentration, so later diligence should test whether the company’s delivery model is as distributed as its marketing suggests.
