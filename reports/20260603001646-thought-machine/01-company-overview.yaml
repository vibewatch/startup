- id: milestones-and-adverse-context
  title: Milestones, momentum, and the main adverse context
  body: |-
    The milestone record is strong enough to support a coherent company arc. Thought Machine’s own chronology shows early progress from founding in 2014 to a 2018 Lloyds commercial relationship, 2019 Asia-Pacific expansion and Mox-related traction, a 2021 step-up in customer and investor quality, and a 2022 Series D that doubled valuation to $2.7bn. The 2024-2025 period then broadened the story from pure core replacement into a more comprehensive platform narrative: Vault Payments became a strategic part of the message, Mastercard deepened its relationship, and HCLTech and DXC positioned Thought Machine as an anchor technology in broader bank-modernization offerings.

    The same timeline also surfaces the most relevant caution flags. Publicly available financial reporting points to a company that is still loss-making at scale: City AM reported flat 2024 turnover, materially wider losses, and lower headcount. The article also noted a private-market mark-down by Molten Ventures, underscoring that the 2022 headline valuation should not be treated as today’s price. Operationally, the reported COO transition in 2025 matters because core-banking transformations are implementation-heavy, not just software-sales stories.

    Taken together, the overview supports a clear preliminary judgment. Thought Machine has genuine product differentiation, blue-chip validation, and a strong historical funding base, but it is not yet a de-risked infrastructure compounder. The next diligence layers should focus on whether recent partnerships and marquee logos are converting into improving margins, repeatable implementations, and a credible path from product prestige to durable financial performance.
