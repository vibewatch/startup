chapter:
  number: 1
  title: Company Overview
  summary: Thought Machine is a London-headquartered cloud-native banking infrastructure vendor founded by former Google engineer Paul Taylor in 2014. Its Vault Core and Vault Payments products are positioned as configurable, cloud-native replacements for legacy bank cores and payment hubs, with strong Tier 1 reference names and partner validation across Lloyds, JPMorgan, Mastercard, HCLTech, and DXC. The company has raised roughly $560M+ cumulatively through the closed $125M Series B, $200M Series C, $160M Series D, and a further approximately £45M existing-investor round disclosed via July 2025 filings, but 2024 filings also showed flat revenue, wider losses, and lower headcount.
