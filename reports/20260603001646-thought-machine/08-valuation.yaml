- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Core-banking modernization demand is real and still benefits from structural cloud and payments tailwinds.
    - Need proof that category growth converts into high-quality revenue for Thought Machine rather than only a large TAM narrative.
  - - Live references such as Zopa, Shawbrook, and Bpifrance show real delivery credibility.
    - Need retention, concentration, and renewal data to prove those logos translate into durable economics.
  - - The product and delivery story likely justify some premium to plain public comps.
    - Need audited gross margin and services-mix evidence to show the premium should be material rather than modest.
  - - The 2025 top-up shows insiders were still willing to fund the company.
    - Need the actual 2025 price per share and preference terms before treating that round as valuation support.
  - - Public comps leave room for a private premium if management can prove software-like economics.
    - Need evidence that Thought Machine deserves more than the current roughly 3x to 5x public band.
  - - The anti-thesis is that the 2022 mark was a peak-cycle valuation now unsupported by public evidence.
    - This softens only if management shows the 2025 round held near the old mark and that 2025 or 2026 operating metrics are much stronger than the public record.
  notes: Each row is framed as a price-moving argument rather than a static view on company quality.
