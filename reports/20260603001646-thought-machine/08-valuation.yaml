  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: 2025-round-valuation
    missingEvidence: Price per share, investor names, pre-money or post-money valuation, and liquidation preference terms for the July 2025 financing.
    whyItMatters: Without these terms, investors cannot tell whether the 2025 round validated the old mark, hid a flat round, or repriced the company through structure.
    diligencePath: Request the signed 2025 term sheet, cap table, and board materials that approved the allotment.
    relatedQuestionRefs:
    - QV005
    - QV015
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited 2025 ARR or revenue bridge, software-versus-services mix, gross margin, and cohort retention data.
    whyItMatters: These are the core inputs needed to decide whether Thought Machine deserves a software-like premium or a lower implementation-heavy multiple.
    diligencePath: Request audited management accounts, ARR bridge, cohort retention deck, and segment-level revenue mix.
    relatedQuestionRefs:
    - QV023
    - QV026
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-partner, and cloud-provider concentration plus renewal data for flagship programs.
    whyItMatters: A premium multiple is hard to underwrite if a few programs or partners dominate outcomes but are invisible in public reporting.
    diligencePath: Request customer concentration tables, renewal cohorts, and partner-attributed bookings by year.
    relatedQuestionRefs:
    - QV023
  - type: enumeration-incomplete
    severity: material
    topic: comparable-table
    missingEvidence: Recent private core-banking software rounds with disclosed post-money valuations and clean revenue multiples.
    whyItMatters: The comparable valuation table necessarily leans public because fresh private disclosures in this niche are thin and often omit price per share or revenue.
    diligencePath: Supplement public comps with banker secondary data or signed private financing comparables before setting a hard price.
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: delivery-margin-proof
    missingEvidence: Implementation cost, support burden, and delivery margin evidence by deployment model and customer type.
    whyItMatters: Delivery intensity is a direct driver of durability for any premium valuation in regulated bank migrations.
    diligencePath: Request project-margin cohorts, implementation timelines, and services attachment rates by customer segment.
    relatedQuestionRefs:
    - QV026
