slug: thought-machine
runDate: '2026-06-03'
company:
  name: Thought Machine
chapter:
  number: 8
  title: Valuation
  summary: Public evidence still supports Thought Machine as a strategically relevant cloud-core vendor with credible live customer proof, but it does not support paying the stale May 2022 $2.7B mark without major private diligence. Flat FY2024 revenue, wider losses, an undisclosed-value 2025 insider top-up, and a 2026 public comp band around roughly 3x-5x EV/sales make the current stance research-more with medium confidence, high risk, and a stretched valuation view.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: "Thought Machine still looks strategically relevant, but the price question is now divorced from the company-quality question. The strongest public positives are not theoretical: the company continues to publish live reference work with Zopa, Shawbrook, and Bpifrance, which shows real delivery capability in deposits, lending, and payments. The weakest area is valuation support. Public sources still point back to the $2.7 billion May 2022 mark, while the July 2025 top-up from existing investors disclosed amount but not valuation. That means investors cannot tell from public evidence whether insiders reaffirmed the old price, accepted a flat round, or quietly repriced downward through terms.\n\nAgainst that backdrop, FY2024 revenue and loss disclosure matter more than growth-market rhetoric. City AM and Tech.eu both report roughly flat turnover and wider losses, which is inconsistent with paying a premium multiple on trust alone. The disciplined conclusion is therefore research-more,\
    \ not buy. The company may still deserve a strategic premium because the product and reference set are real, but today’s public record does not let investors separate durable software economics from implementation-heavy growth. Price support must come from either a much lower entry point or from private diligence that proves a cleaner ARR, margin, and cap-table story than the public record shows.\n        "
