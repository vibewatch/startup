- id: scenario-ranges-and-multiple-compression
  title: Scenario ranges and multiple compression
  body: "The scenario framework should therefore start with multiple compression, not ignore it. The bull case is not that Thought Machine simply keeps the old mark because it once raised capital at that level. The bull case is that reference customers continue to expand, management can show a stronger ARR bridge than statutory revenue suggests, and the 2025 financing either validated or only lightly discounted the 2022 price. Under that outcome, a roughly $1.6 billion to $2.4 billion current range is plausible. The base case gives the company credit for real product and customer proof but still penalizes the stale mark, capital dependence, and absent unit economics, yielding about $0.9 billion to $1.6 billion.\n\nThe bear case applies current public comp pressure to a business whose public record still shows flat 2024 revenue and wider losses, producing roughly $0.4 billion to $0.9 billion. Put differently, the 2022 $2.7 billion mark should be treated as an upside ceiling until management\
    \ proves otherwise. A cleaner entry zone would sit closer to about $0.8 billion to $1.2 billion unless private diligence uncovers materially stronger revenue quality than the public sources currently show.\n        "
