- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Reference customers expand, management proves a stronger ARR bridge than the statutory record, margins look software-like, and the 2025 financing did not materially reset valuation.
    - $1.6B-$2.4B current fair-value range; paying near the old mark only works if diligence strongly validates hidden quality not visible publicly today.
    - A stale cap table, services-heavy economics, or leadership disruption would collapse this case quickly.
    - Requires a clean private data room and explicit confirmation that 2025 did not reprice the company downward.
  - - Base
    - Thought Machine remains strategically relevant with real customer proof, but public economics still look capital dependent and only partially software-like.
    - $0.9B-$1.6B range; upside exists, but only if entry is well below the stale 2022 mark or supported by stronger private evidence.
    - Another financing need, concentration surprise, or weak margin profile keeps this case from re-rating.
    - Most consistent with the reviewed public record.
  - - Bear
    - Statutory revenue and loss trends are the better guide, the 2025 round turns out to have been weakly priced or highly structured, and public comp pressure dominates.
    - $0.4B-$0.9B range; a new-money raise on worse terms likely destroys target returns from a stale-mark entry.
    - Execution setbacks, leadership churn, and public migration problems would reinforce the markdown path.
    - Becomes more likely if management keeps the key economics and term files closed.
  notes: These are scenario-based valuation bands, not a DCF; the ranges are intentionally wide because the public record does not disclose the key revenue-quality and cap-table inputs.
