sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing lenses
  body: |-
    Thought Machine’s relevant market cannot be captured responsibly with a single TAM figure. Public sources describe at least three overlapping but non-identical categories: a broad core banking software market, a cloud-native core banking platform market, and a much narrower core banking modernization market. The broadest category captures software plus services used to run day-to-day banking across deposits, loans, enterprise customer solutions, and related functions. That lens is useful for understanding the eventual size of the category, but it overstates the directly contestable pool for a private cloud-native vendor. The narrowest lens — modernization programs — gets closer to real budget decisions, but it can understate the long-term opportunity because it treats transformation projects rather than ongoing platform economics as the market itself.

    The best chapter-level conclusion is therefore boundary-aware: use the broad market as outer TAM context, the cloud-native platform market as the most relevant category lens, and modernization spend as the immediate budget-entry wedge. The Business Research Company estimates broad core banking software at $14.35B in 2025 and $16.06B in 2026, while DataIntelo places cloud-native platforms at $12.4B in 2025. Market.us then narrows the actual modernization pool to $1.9B in 2025 and $2.4B in 2026. Those numbers are not contradictions so much as different ways of framing the same strategic migration wave.

    Regionally, the public evidence is directionally aligned even when absolute values differ. North America is the largest current spend pool across both broad and cloud-native lenses, while Asia-Pacific is the fastest-growth region. For Thought Machine, that matters because its current customer evidence already spans Europe, APAC, North America, and public-sector payment programs; in valuation terms, the company’s opportunity is better understood as a share-of-modernization and share-of-cloud-native-platform problem, not a share of every banking-IT dollar ever spent on a core.
