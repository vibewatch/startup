- id: TM005
  title: Adoption constraints and risk register
  columns:
  - Constraint / risk
  - Severity
  - Evidence
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Boundary-sensitive TAM inflation
    - High
    - Broad, cloud-native, and modernization estimates differ materially
    - Bad boundary choice can distort valuation and market-share narratives
    - Use multiple lenses and bottoms-up bank counts rather than one headline TAM.
  - - Migration execution risk
    - High
    - Deloitte and Oliver Wyman emphasize testing, cutover, and coordination risk
    - Failed migrations create reputational and regulatory damage
    - Prioritize phased migration evidence and post-go-live reference checks.
  - - Pricing opacity
    - Medium
    - Public pricing and packaging remain unavailable
    - Prevents robust comparison of affordability by segment
    - Request sample contracts and implementation budgets.
  - - Partner dependence
    - Medium
    - Thought Machine’s route to smaller buyers leans on partners
    - Channel quality becomes part of product-market fit
    - Assess certified-partner depth by geography and vertical.
  - - Resilience requirements
    - High
    - Instant payments and ISO 20022 require 24/7/365 operations
    - Raises bar for infrastructure maturity and support model
    - Review uptime SLAs, runbooks, and incident history.
  - - Data and integration complexity
    - High
    - Legacy and new cores often need coexistence
    - Can elongate projects and reduce realized ROI
    - Inspect migration tooling, abstraction layer design, and data-quality controls.
  notes: Risk register focuses on why market demand does not immediately translate into frictionless vendor revenue.
