callouts:
- calloutType: insight
  title: Boundary discipline matters more than TAM size theater
  body: The public market can look anywhere from sub-$2B to mid-teens billions depending on whether the analyst is measuring modernization budgets, cloud-native platforms, or the whole core software stack. That does not mean the market is unknowable; it means the diligence lens must match the decision being made.
  claimRefs:
  - CM002
  - CM006
  - CM012
  - CM043
  - CM046
- calloutType: strength
  title: Thought Machine can sell into multiple bank archetypes
  body: Evidence now spans Tier 1 institutions, mid-sized and regional banks, challenger lenders, chartered banks, credit unions, and public-sector payment programs, especially when partner delivery is available.
  claimRefs:
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
- calloutType: risk
  title: Migration complexity is the real market governor
  body: The practical ceiling on adoption is not demand for modernization; it is whether banks believe they can migrate core and payments safely enough, quickly enough, and cheaply enough to justify the switch.
  claimRefs:
  - CM018
  - CM035
  - CM036
  - CM038
  - CM040
  - CM048
