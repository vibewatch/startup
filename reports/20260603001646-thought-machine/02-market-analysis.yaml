- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Thought Machine
  rows:
  - - Broad core banking software
    - Core software plus related professional/managed services for deposits, loans, enterprise customer solutions, cloud and on-prem deployments
    - Peripheral bank IT that does not touch the core ledger or core product engine
    - Banks, FIs, and other end users via IT and operations budgets
    - Useful outer TAM but too broad for direct share assumptions.
  - - Cloud-native core banking platforms
    - Modern core platforms built for cloud-native deployment, API-first architecture, and real-time processing
    - Legacy wrapper middleware and unrelated bank software services
    - Banks modernizing product manufacturing, channels, and ledgers
    - Best category lens for Thought Machine’s product set.
  - - Core banking modernization programs
    - Project budgets for replacing or hollowing out legacy cores and adjacent operating models
    - Steady-state software revenue after go-live
    - Transformation sponsors at banks and credit unions
    - Best near-term budget-entry lens.
  - - Payments modernization overlay
    - FedWire, instant payments, SEPA instant, cards, and ISO 20022-related platform work
    - Pure network fees without platform change
    - Payments leaders, COO/CIO sponsors, operations teams
    - Important because Vault Payments expands the budget envelope.
  - - Status quo substitutes
    - Internal build, dual-core, middleware-heavy modernization, and incumbent legacy upgrades
    - Greenfield challenger-bank only use cases
    - Banks avoiding wholesale replacement
    - Critical because buyers often compare against partial fixes, not only direct competitors.
  notes: The relevant market is boundary-sensitive; later sizing uses multiple lenses instead of one single TAM.
