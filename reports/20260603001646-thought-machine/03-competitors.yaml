- id: capability-and-pricing
  title: Capability breadth, pricing opacity, and buyer fit
  body: |-
    Thought Machine’s strongest product argument remains its smart-contract configurability and unified core-plus-payments architecture. That gives it a sharper product-manufacturing narrative than many incumbents, especially for banks that want new features without vendor-locked product logic. Mambu competes closest on modern architecture and speed, while Temenos, Oracle, Finacle, TCS, Finastra, and FIS compete by offering broader functional coverage, deeper localization, larger disclosed installed bases, and more mature partner ecosystems. In practice, the buyer fit splits by institution type: cloud-native vendors look stronger for fast-moving transformation, while incumbents still look stronger where regulatory comfort, regional coverage, or existing relationships dominate the decision.

    Pricing is a weak point in the public evidence set across the entire category. Mambu is listed as quotation-based on SaaSworthy, Temenos pricing is explicitly described by SDK.finance as mostly non-public and consultative, Oracle FLEXCUBE has no public price plan on TrustRadius, and Thought Machine’s own reviewed materials disclose no list pricing or standard package. That opacity is itself a competitive fact: enterprise buyers cannot benchmark vendors cleanly without going through a sales cycle, which tends to favor larger incumbents and well-embedded advisory ecosystems. It also means any public pricing comparison must focus on transparency and structure rather than pretending to know true all-in economics.
  claimRefs:
  - CP002
  - CP003
  - CP005
  - CP008
  - CP011
  - CP013
  - CP015
