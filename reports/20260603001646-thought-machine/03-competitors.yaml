- id: distribution-and-switching
  title: Distribution power, switching costs, and substitutes
  body: |-
    Distribution power in core banking still rests heavily with partner ecosystems and bank confidence in implementation capacity. That is why incumbents with long-standing customer bases can remain competitive even when newer vendors offer cleaner architectures. FIS, Finastra, and Temenos all market modular or phased modernization, allowing banks to improve the stack without taking a full rip-and-replace leap. TCS and Finacle reinforce the same logic through scale, market coverage, and broad solution suites. In effect, the strongest substitute to Thought Machine is not always another new core vendor — it is often a less disruptive modernization path using an incumbent, an abstraction layer, or partial internal build.

    Thought Machine is not ignoring this dynamic. Its alliances with HCLTech and DXC matter because they extend the company’s reach into partner-led transformation programs and smaller institutions that might not buy a pure software project directly. Even so, the company still lacks the publicly disclosed installed base and economic transparency that many incumbents can point to. The result is a competitive market where switching cost, coexistence design, and partner leverage do as much work as architecture. Buyers are effectively choosing risk packages, not only feature sets.
  claimRefs:
  - CP018
  - CP019
  - CP021
  - CP026
  - CP032
  - CP033
  - CP034
  - CP035
  - CP036
  - CP038
  tableRefs:
  - TP004
- id: moat-and-durability
  title: Moat durability and displacement risk
  body: |-
    Thought Machine’s moat is real but narrower than enthusiastic product messaging can imply. The company appears strongest where a bank values deep configurability, a real-time ledger, unified core-plus-payments logic, and the ability to manufacture differentiated products without waiting on a monolithic vendor roadmap. Those are meaningful strengths against larger suites that still emphasize breadth and localization over programmability.

    The risk is that many rivals now market enough modularity, composability, or stepwise modernization to narrow Thought Machine’s differentiation in the eyes of practical buyers. Mambu’s speed and composability challenge Thought Machine from below; Temenos, FIS, Finastra, Oracle, TCS, and Finacle challenge it from above with disclosed scale, mature references, and longer regulatory comfort. Public evidence also cannot prove which vendor wins most Tier 1 bake-offs today, which limits how strongly one can claim that Thought Machine is taking share rather than winning a subset of greenfield or progressive programs. For later valuation work, the correct takeaway is not that Thought Machine lacks a moat; it is that the moat depends on converting architectural elegance into repeatable, partner-scaled, economically attractive implementations faster than larger rivals can modernize their own narratives.
  claimRefs:
  - CP023
  - CP024
  - CP032
  - CP033
  - CP037
  - CP038
  - CP039
  - CP040
  figureRefs:
  - FP003
