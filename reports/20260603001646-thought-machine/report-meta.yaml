disclaimer: This diligence report is based only on publicly available information as of 2026-06-03 and does not constitute investment advice. Thought Machine is a private company, and several of the most important underwriting inputs — including margin structure, cash runway, retention, pricing, and 2025 financing terms — are not publicly disclosed. All investment conclusions should therefore be validated against primary documents and management data-room materials before any transaction or commitment.
