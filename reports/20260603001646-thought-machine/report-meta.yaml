companyProfile:
  summary: Thought Machine was founded in 2014 by Paul Taylor and has grown into one of the best-known private vendors in cloud-native core banking. Its product set centers on Vault Core, a configurable real-time core banking platform built around smart-contract product logic, and Vault Payments, a cloud-native payments engine designed for cards and account-to-account rails. Public customer proof spans Tier 1 and regional institutions across lending, digital banking, and instant payments use cases, while the company’s partner ecosystem now includes Mastercard, Form3, HCLTech, and DXC. The strategic case is strongest on product architecture and modernization relevance; the weakest area remains financial transparency, particularly around gross margin, cash runway, and the valuation terms of the 2025 insider top-up.
  founders:
  - name: Paul Taylor
    role: Founder & CEO
    background: Former Google engineer and prior founder of Phonetic Arts, later acquired by Google.
    claimRefs:
    - CO001
    - CO002
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: Vault Core provides a cloud-native, API-driven core banking platform built around a real-time ledger and smart-contract product logic; Vault Payments extends the stack into cards, instant payments, and payment orchestration. Together, the products aim to let banks modernize in phases, build differentiated products faster, and integrate with external services without relying on a monolithic closed-box core.
  customerFocus: Target customers include Tier 1 multinational banks, regional and specialist banks, digital banks, SME lenders, public institutions, and credit unions pursuing core and/or payments modernization.
  businessModel: Enterprise banking software and payments infrastructure sold through a mix of direct platform contracts, implementation and migration services, long-term support, and partner-enabled delivery. The public record suggests a software-plus-services model, but does not disclose the precise mix of recurring software versus implementation-heavy revenue.
  stage: Late-stage private
  fundingStatus: Last publicly confirmed valuation remains the May 2022 $2.7B Series D mark. Public evidence supports cumulative funding above $560M by July 2025, including a roughly £45M existing-investor top-up in 2025, but the valuation terms of that round were not disclosed publicly.
