- id: capital-and-cost
  title: Cost structure, capital intensity, and financing dependence
  body: |-
    The strongest public signal on cost structure is indirect: losses remained very large relative to revenue, and the company still needed a further top-up financing in July 2025 even after significant historical fundraising. That does not by itself imply distress — enterprise banking software vendors often spend heavily on R&D, compliance, and global delivery before margins inflect — but it does show that capital intensity remains material. Thought Machine’s own use-of-funds language points to continued product development and growth investment, while the delivery model suggests a cost base that includes senior client services, migration experts, training resources, and regional support.

    The July 2025 share allotment is also financially important because it demonstrates that financing was not merely narrative; it involved a real, multi-class capital event. The SH01 filing records multiple voting, non-voting, ordinary, and preference instruments, which adds complexity to the cap table and makes it harder to reason about economic dilution or downside protection from outside. Companies House also shows that 2025 full-year accounts will not be available until September 2026, leaving a current-year visibility gap precisely when investors would want to know whether the 2025 funding stabilized burn or merely extended runway.

    From a diligence perspective, the absence of cash and runway data is the single biggest blocker. Public sources can tell you that funding happened and losses were high; they cannot tell you whether the company is now adequately capitalized for its next phase or already marching toward another financing trigger.
  claimRefs:
  - CI013
  - CI017
  - CI018
