- id: public-traction
  title: Public traction and unit-economics proxies
  body: |-
    Thought Machine’s public traction picture is mixed. On one hand, the company has a meaningful revenue base: City AM, Tech.eu, and Tracxn all support roughly £47.6m of FY2024 revenue. GetLatka adds an ARR-style estimate of $70.6m for 2024, which is not directly comparable to statutory revenue but does suggest a perception of recurring enterprise software scale. On the other hand, the reported top line appears essentially flat versus 2023, while losses widened and headcount fell. That combination is not fatal for a private infrastructure company, but it weakens any simple narrative that scale is automatically driving better economics.

    Public unit-economics visibility is extremely thin. The reviewed sources disclose no gross margin, CAC, payback, churn, NRR, or implementation-margin data. GTM efficiency must therefore be inferred from the structure of the business: long-cycle bank transformations, heavy migration work, and increased reliance on implementation partners all imply a higher-friction revenue machine than a typical mid-market SaaS vendor. That does not mean the model is poor; it means the public data is insufficient to prove efficiency.

    The main takeaway is that Thought Machine has enough top-line and customer-proof evidence to justify a financial deep dive, but not enough public operating detail to support a clean software-style underwriting model. Later diligence must focus on whether the revenue base is recurring and expanding, or whether the services tail and implementation burden are muting the economics.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
