chapter:
  number: 4
  title: Financials
  summary: Thought Machine’s public financial picture remains directionally informative but incomplete. Official and registry-linked evidence supports a business model built around cloud-native core and payments software, implementation/support services, and partner-enabled delivery, yet the public record does not disclose standard pricing, gross margin, cash balance, or CAC/payback. Reported FY2024 revenue was roughly flat at £47.6m versus £47.8m in 2023 while losses widened to roughly £69.3m–£71.2m and headcount fell to about 518–523, followed by a further approximately £44.8m–£45m funding round in July 2025 to support growth and product development. The financial verdict is that product demand appears real, but underwriting confidence is constrained by opaque revenue mix, absent margin data, and continued financing dependency.
