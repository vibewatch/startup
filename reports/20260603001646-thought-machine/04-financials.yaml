sections:
- id: revenue-model
  title: Revenue model and monetization visibility
  body: |-
    The public evidence supports a business that monetizes more than one layer of the banking stack. Thought Machine sells Vault Core and Vault Payments, but the reviewed materials also emphasize delivery services, training, certification, expert migration support, and partner-led implementation. That matters financially because it suggests the company is not a simple self-serve SaaS story where software gross margins dominate the P&L from day one. Instead, the likely model is a mix of platform subscription or license revenue, implementation and migration services, support, and potentially ecosystem-driven expansion as customers adopt payments, instant rails, or partner integrations.

    The monetization upside of that structure is breadth: once a bank is on the platform, there are multiple ways to expand account value through new products, payments, and partner-led transformation work. The downside is opacity. None of the official Thought Machine pages reviewed here disclose list pricing, contract structure, or standard packaging. As a result, the public record can show what the company sells, but not what customers actually pay, what portion is recurring versus project-based, or whether services mix is margin-dilutive or strategic.

    This chapter therefore treats pricing and revenue composition as diligence gaps rather than pretending there is a clean public answer. The available partner and product announcements do support real monetization potential in payments and ecosystem channels, but they do not yet answer the more important underwriting question: how much of each customer’s lifetime value is high-quality software revenue versus implementation-heavy delivery work.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI032
  - CI033
  - CI034
  - CI035
  tableRefs:
  - TI001
