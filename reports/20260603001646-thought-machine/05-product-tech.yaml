  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "public-security-assurance"
      missingEvidence: "Named public SOC 2, ISO 27001, PCI DSS or equivalent assurance documentation tied to Vault Core or Vault Payments."
      whyItMatters: "Implementation diligence cannot independently score security assurance from public sources alone without formal attestations."
      diligencePath: "Request the current trust pack, certifications, questionnaire responses and any customer-sharable audit summaries under NDA."
      relatedQuestionRefs: [QE023]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: "public-reliability-metrics"
      missingEvidence: "Current SLA commitments, public status page history, uptime metrics, and stated RTO or RPO targets for production deployments."
      whyItMatters: "Operational-resilience underwriting needs outcome metrics, not only architecture descriptions or partner claims about reliability."
      diligencePath: "Request customer-facing SLA documents, incident-history summaries, and production operations metrics from client services or the trust team."
      relatedQuestionRefs: [QE024]
      relatedTableRefs: [TE004]
    - type: stale
      severity: material
      topic: "performance-benchmarks"
      missingEvidence: "Current transaction-per-second, latency and failover benchmark packs for Vault Core and Vault Payments at production-like scale."
      whyItMatters: "The strongest public engineering detail is historical, and the public content hub still lacks underwriting-grade benchmark detail."
      diligencePath: "Request the latest benchmark deck, recent performance testing methodology, and named customer references running comparable scale."
      relatedQuestionRefs: [QE025]
    - type: private-evidence-only
      severity: minor
      topic: "public-developer-surface"
      missingEvidence: "Public SDK docs, public repo or package telemetry, and customer-community usage metrics beyond blogs, jobs and portal descriptions."
      whyItMatters: "Developer-signal is present, but it is mostly inferred from company-operated surfaces rather than open community telemetry."
      diligencePath: "Ask for Enablement Portal usage metrics, community-forum participation data, and any public developer-facing release or package statistics."
      relatedQuestionRefs: [QE012, QE013]
