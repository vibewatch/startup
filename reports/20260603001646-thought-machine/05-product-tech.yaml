callouts:
  - calloutType: "strength"
    title: "Configuration is the core product moat"
    body: >-
      The strongest product signal is not a single banking feature, but the repeated public claim
      that banks can own product logic, parameters and change velocity without waiting for vendor
      code releases.
    claimRefs:
      - CE006
      - CE007
      - CE033
  - calloutType: "insight"
    title: "Payments differentiation is partner-amplified"
    body: >-
      Vault Payments looks differentiated because it combines orchestration with partner rails and
      delivery reach, not because Thought Machine owns the underlying networks itself.
    claimRefs:
      - CE034
      - CE036
      - CE037
      - CE038
      - CE042
  - calloutType: "risk"
    title: "Public trust evidence lags product detail"
    body: >-
      The public story is rich on architecture and enablement but noticeably thinner on named audit
      attestations, uptime disclosure and current performance benchmarks.
    claimRefs:
      - CE030
      - CE035
      - CE043
