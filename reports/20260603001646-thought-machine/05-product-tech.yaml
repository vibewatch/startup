chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Thought Machine sells a two-part banking platform centered on Vault Core and Vault Payments,
    with public materials framing the product as a configurable operating layer rather than a
    shrink-wrapped core replacement. The evidence is strongest on product breadth, migration and
    enablement scaffolding, and ISO-20022-native payments orchestration; the main remaining
    diligence gaps are public security attestations, uptime disclosure, and current benchmark data.
sections:
  - id: "product-definition-and-workflows"
    title: "Product definition in customer workflow terms"
    body: >-
      Thought Machine's product should be read as a bank-operations layer, not just a replacement
      core. For a bank product team, the workflow starts with cloning or authoring smart-contract-based
      products inside Vault Core, selecting preconfigured patterns from the Product Library, and
      adjusting feature-level parameters without reopening vendor code. For a payments team, the
      workflow starts with choosing payment flows, rules, routing and scheme connections inside Vault
      Payments, then letting the platform process, retry, investigate and stream lifecycle data in
      real time. The public module map is therefore broader than "core versus payments": it includes
      product manufacturing tooling, the real-time ledger, API and event surfaces, integration
      assets, and the enablement and delivery layer that helps clients stand the system up. This
      breadth is strategically important because Thought Machine is selling control and change
      velocity to banks, not only transaction processing. The limitation is that publicly available
      materials explain the building blocks well, but do not disclose pricing, benchmark conversion
      rates, or comparable product-launch productivity data.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE011
      - CE012
      - CE014
      - CE016
      - CE017
      - CE019
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: "architecture-and-operating-model"
    title: "Architecture and operating model"
    body: >-
      On architecture, the public materials consistently describe a decoupled operating model.
      Smart contracts and configuration sit above a shared platform layer; the ledger itself is
      separated from product logic; and payment journeys are treated as independently configurable
      flows rather than hard-coded scheme connectors. The core platform exposes multiple APIs for
      postings, migration and real-time streaming, while the integrations catalog shows Thought
      Machine expects clients to wire the platform into onboarding, CRM, KYC, reporting, general
      ledger and data platforms rather than run as a closed stack. The coexistence deployment
      pattern matters because it implies the company expects phased migration, shared channels and
      incremental replacement of legacy components, not a single big-bang cutover. Public developer
      signal reinforces the cloud-native story: Thought Machine has written about running a
      Kubernetes-based monorepo environment with explicit monitoring, logging, secrets and
      access-control patterns. That is positive for technical credibility, but the strongest
      technical detail is historical, so current production-scale throughput and failover evidence
      still needs customer or NDA support.
    claimRefs:
      - CE006
      - CE008
      - CE009
      - CE010
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE029
      - CE030
      - CE031
      - CE032
      - CE044
      - CE045
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003
  - id: "deployment-partners-and-roadmap"
    title: "Deployment, partner reach, and roadmap signals"
    body: >-
      Differentiation comes from the combination of configurability, migration flexibility and
      partner leverage. Thought Machine is not claiming proprietary payment-network ownership;
      instead it is claiming a universal orchestration layer that can sit between legacy cores,
      Vault Core, external schemes and partner services. The Form3 and Mastercard partnerships
      extend that story in concrete ways by adding real-time account-to-account rails,
      card-processing reach and ISO-20022-native connectivity. DXC and HCLTech widen the delivery
      envelope further by adding managed-service and DevSecOps-heavy implementation capacity for
      banks that need programmatic support rather than pure self-service adoption. Support tooling
      is not an afterthought: the Delivery Partner Programme, Enablement Portal, roadmaps, release
      notes and certification paths are part of the product operating model because they determine
      whether a bank can become less vendor-dependent over time. The roadmap signals visible
      publicly are meaningful, but they are still release-note-level signals rather than a
      transparent, dated product roadmap with public ETA commitments across schemes or geographies.
    claimRefs:
      - CE024
      - CE025
      - CE026
      - CE027
      - CE034
      - CE035
      - CE036
      - CE037
      - CE038
      - CE039
      - CE041
      - CE042
    tableRefs:
      - TE005
    figureRefs:
      - FE004
  - id: "trust-quality-and-open-risks"
    title: "Trust, quality, compliance, and residual diligence risk"
    body: >-
      Trust and quality controls are the chapter's clearest mixed signal. On the positive side,
      Thought Machine publicly anchors its payments story to ISO 20022, real-time processing and
      partner ecosystems built for reliability, scalability and disaster recovery. The older
      engineering material also shows serious internal practices around patching, network policy,
      certificate-based access and secret management, while the enablement materials show that
      client and partner competence is treated as a formal certification problem rather than
      improvised support. Those are real positives for implementation risk. The weaker side is
      disclosure depth. Across the fetched surfaces, there is no clear public trust centre, named
      SOC or ISO attestation, public uptime or SLA metric, or current benchmark pack that would let
      an external diligence team independently score resilience at underwriting depth. The result is
      a product story that looks technically coherent and commercially mature, but still requires
      private diligence on security assurance, operational metrics and production-scale performance
      before it can be treated as fully de-risked.
    claimRefs:
      - CE018
      - CE026
      - CE027
      - CE028
      - CE030
      - CE032
      - CE035
      - CE040
      - CE043
    tableRefs:
      - TE004
