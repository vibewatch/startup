  rows:
  - - Digital consumer banks
    - Zopa; Trust
    - Buyer and payer = bank leadership / tech budget; user = product and ops teams
    - Current-account and retail-banking product build
    - Medium
    - Shows consumer-bank relevance and fast-launch appeal
    - No portfolio-wide revenue split by digital-bank segment
  - - Specialist lenders / SME banks
    - Shawbrook; Judo
    - Buyer and payer = lending-bank modernization budget; user = lending and servicing teams
    - Specialist lending and SME-bank modernization
    - Medium
    - Proves fit for credit-heavy, workflow-rich institutions
    - No disclosed renewal or multi-product economics
  - - Public / mission-led institutions
    - Bpifrance; USSFCU
    - Buyer and payer = institution transformation budget; user = payments/core operations
    - Payments modernization and full-stack replatforming
    - Medium
    - Validates regulated, service-oriented institutions beyond private banks
    - One account is live, one is only publicly announced
  - - Regional product manufacturers
    - General Bank of Canada
    - Buyer and payer = bank transformation budget; user = product-manufacturing teams
    - B2B2C product manufacturing on a modern core
    - Low to medium
    - Expands story beyond retail-bank direct distribution
    - Public evidence stops at selection, not live proof
  - - Partner-enabled bank pipeline
    - Banks reached through Mastercard, HCLTech, DXC, ClearPoint
    - Buyer may enter through SI or network partner, but payer remains the financial institution
    - Managed modernization, packaged core-plus-payments, or regional delivery
    - Medium
    - Improves reach into enterprise and mid-market programs
    - Commercial conversion and revenue share remain undisclosed
  notes: Segment rows summarize the clearest public buyer clusters; they are not a full customer census because Thought Machine does not disclose its portfolio denominator.
