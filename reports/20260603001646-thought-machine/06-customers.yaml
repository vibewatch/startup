chapter:
  number: 6
  title: Customers
  summary: Thought Machine has credible public customer proof across challengers, specialist lenders, public institutions, and regional banks, with the strongest live references coming from Zopa, Shawbrook, Bpifrance, Judo, and Trust. The customer-quality verdict is positive on deployment freshness and reference quality but only medium-confidence on durability, because public sources do not disclose portfolio retention, renewal, customer count, or concentration data.
sections:
- id: customer-mix
  title: Customer mix is broad, but the public denominator is still narrow
  body: |-
    Thought Machine’s public customer evidence shows a vendor that can win across several buyer categories, not just one narrow niche. The visible mix includes challenger and digital-consumer banks such as Zopa and Trust, specialist lenders such as Shawbrook and Judo, public or mission-led institutions such as Bpifrance and USSFCU, and a regional bank-manufacturer model through General Bank of Canada. That is strategically attractive because it suggests the product can stretch across deposits, lending, and payments rather than being trapped inside a single product line.

    The catch is that the visible portfolio is still logo-based rather than denominator-based. Thought Machine says it serves Tier 1 banks, smaller regional banks, and fintech challengers, but it does not publish a customer count, cohort mix, or revenue split by segment. So the right way to read the mix is not “huge installed base” but “credible breadth of reference accounts with incomplete portfolio disclosure.” The customer-quality question is therefore less about whether Thought Machine can sell into multiple segments and more about whether those wins compound into a durable, diversified live base.
