  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Portfolio-level NRR, GRR, churn, renewal rate, and contract-duration data by cohort or customer segment.
    whyItMatters: Without retention metrics, the chapter cannot distinguish sticky compounding software revenue from one-off implementation wins.
    diligencePath: Request customer cohort tables, renewal calendars, churn logs, and revenue-at-risk by contract anniversary.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-satisfaction-quantification
    missingEvidence: Named reference-call output, NPS or CSAT statistics, implementation SLAs, and any independent peer-review detail that quantifies satisfaction.
    whyItMatters: The public record has testimonials and reference-site claims but not enough quantified customer-love evidence to underwrite durability confidently.
    diligencePath: Collect recent reference calls from a live Tier 1 account, a challenger bank, and a specialist lender; request support-ticket trends and SLA attainment.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Portfolio-wide customer count, ARR by top account, top-10 revenue share, and backlog split between live customers and newly signed programs.
    whyItMatters: Without concentration disclosure, marquee logos can mask a narrow revenue base and make customer-quality judgment look broader than the economics really are.
    diligencePath: Request customer ledger exports showing ARR by account, implementation status, and top-customer contribution to bookings and live revenue.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU003
    - TU005
    - TU006
