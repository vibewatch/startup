- id: named-proof
  title: Named proof is strongest where customer-side pages corroborate live products
  body: |-
    The best public customer proof in this chapter comes from accounts where Thought Machine’s own announcement is paired with something observable on the customer’s own domain. Zopa is the cleanest example: Thought Machine lays out the beta-to-full-launch sequence for Biscuit, while Zopa’s own page shows the account live, marketed, and embedded inside a retail bank that says it serves more than 1.5 million users and holds more than £5.5 billion of savings. Shawbrook is similarly useful because Thought Machine supplies the implementation timeline and Shawbrook’s own product page shows the buy-to-let mortgage offer is a real commercial product for professional landlords.

    Bpifrance and Judo are also strong references, but in a slightly different way. Bpifrance’s Thought Machine release offers the best expansion proof in the set because it ties a 2022 core decision to later payments production. Judo’s public pages prove it is a serious SME bank and listed institution, while Thought Machine provides the migration sequence. By contrast, USSFCU and GBC are meaningful logos but still read as signed, ongoing transformations rather than publicly corroborated live deployments. That distinction matters because customer logos alone can hide the difference between reference accounts and future pipeline.
