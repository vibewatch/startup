            body: >-
              LINE MAN 的竞争位置是真实的，但负面证据不支持把它称为不可攻破。Bangkok Post 份额数据支持 2025
              年双寡头判断，但同一报道把增长与可负担性推动、激烈竞争和政府补贴支持相连，而不是结构性轻松需求。另一篇 Bangkok Post 报道称，泰国四大玩家过去三年亏损 20.7 billion
              baht；Robinhood 的经济性和 Foodpanda 退出也说明，次规模挑战者在这个品类里承压极重。因此，护城河主要在本地密度与商户工作流交叉处显得耐久；在竞争者能用跨品类流量、公开资本或中立 POS
              控制替代的地方，耐久性弱得多。Grab 目前在这条轴上位置最好，因为它把公开融资通道与配送、出行和商户工具结合起来。ShopeeFood 仍是活跃邻近威胁，因为即使当前泰国配送指标不透明，它也能借 Shopee
              App 的钱包和信贷触点。剩余开放风险是外部可选性：Globe 报道 Grab 和 Meituan 此前曾研究 Foodpanda 资产，这提醒我们，集中市场在资产可得时仍会吸引战略进入者或整合尝试。
