            body: >-
              公开采用证据中，最有力的是 LINE MAN Wongnai 给出具体交易或部署指标的场景，而不是泛泛的品牌声量。 Half-Half Plus 报道是最近最清晰的例子：LINE MAN 称，参与餐厅中 65%
              选择其平台，项目销售额中 63% 经由该平台流转， 三周内产生超过 8 million 笔外卖订单，新客数和下单频次都明显上升。Thai Help Thai Plus 又给了消费者侧信号： 前两周有 1.2
              million 用户，人均消费 THB450。Fun Facts 2025 随后显示了大众规模的订单和搜索强度： 单一道菜订单超过 8 million 笔，抹茶订单 6.5 million 笔，米饭配咖喱订单
              65 million 笔。


              具名客户证明不那么均衡，但仍有分量。EVEANDBOY 提供了一个可见的 MART 部署，覆盖 69 家门店和 100,000+ 个 SKU； Lotus’s go fresh 把这类商户证明扩展到全国 77
              个府的 1,400+ 家门店。Hawker Center Lumpini 则展示了市政小商户部署： 超过 100 家摊贩接入 QR / 支付基础设施。Café Amazon 通过泰国首家 Digital
              Store 给出直接的软件部署样本， 使用 Wongnai POS Order & Pay 和 Pick & Go；管理层称，关联 LINE MAN 的外卖订单同比增长超过 35%。 JERA Cloud
              又带来多门店美容和牙科客户，例如 Aura Bangkok Clinic 和 Teeth Talk。官方营销页还点名 Lotus’s、GSB、 Knorr、Coke、MALI
              等品牌，说明变现不止来自外卖佣金，也延伸到活动和商户增长工具。薄弱处在于餐厅软件客户缺少完整具名名单： 公开引用能证明市场相关性和部分连锁邻近性，但还不足以形成适合投委会审阅的分层在用 POS 客户清单。
