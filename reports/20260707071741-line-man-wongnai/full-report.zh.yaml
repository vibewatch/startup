      - number: '2.2'
        title: 多重测算视角、矛盾估计与受约束的 TAM 逻辑
        blocks:
          - type: paragraph
            body: >
              泰国外卖的公开市场规模证据在量级上方向一致，但方法、单位和时间点并不一致。LINE MAN Wongnai 的 2H2023 业务更新引用 KResearch 预期：2023 年外卖市场将下降
              0.8-6.5%，至 THB 81-86 billion。Bangkok Post 2026 年 6 月双寡头报道援引 Momentum Works 称，泰国外卖 GMV 从 2024 年 US$4.2
              billion 增至 2025 年 US$5.1 billion；同篇文章还引用 e-Conomy SEA 2025 表述，指向 2025 年约 US$5.0 billion。Iconic Research
              2025 年综合分析把 2025 年市场放在约 THB 100 billion；Yod 另行主张，该品类仍有空间达到 THB 120-150 billion，因为相对泰国 THB 800-900 billion
              总食品市场，渗透率只有 15%。


              这些数字不应被硬归一成假的共识。有的数字描述以美元计的年度 GMV，有的描述以泰铢计的「市场价值」口径，有的是近期观察到的规模，有的是管理层式上行空间。正确的尽调动作因此是搭一套受约束的 TAM
              栈：泰国食品总支出设外框，观察到的线上外卖 GMV 锚定当前服务市场，商户软件加支付提供邻近上行，不必假设配送本身会拿下全部餐厅支出。由于 抽佣率、活跃下单频次或支付 TPV 未披露，仅靠公开证据无法把 SOM
              干净压缩成单一泰铢数字。
