      - number: '8.4'
        title: 情景区间、建议和尽调关口
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的基准情景是：这家公司值得高于 2022 年独角兽底线交易，但还不到高溢价软件倍数。今天合理的边界大约是 THB40 billion 到 THB55 billion；它承认 2025
              年首次盈利、真实的商户软件覆盖，以及拥有生态宽度的双寡头市场领导者不应按结构性弱势的小规模 app 定价。 THB55 billion 到 THB74 billion 的乐观情景有可能成立，但前提是经审计的
              FY2025 至 FY2026 数字证明： 外卖盈利不依赖补贴，商户和 fintech 贡献实质抬高收益质量，最终 IPO 结构也不会让少数股东背上控制权过重的治理和不透明优先条款。


              因此，建议是继续研究，置信度中等、风险高；估值立场随入场价在合理到偏高之间。接近独角兽底线时，风险回报开始值得密切跟踪。 但高于约 THB55 billion
              后，举证责任会明显转向管理层。下行情景不是公司弱，而是投资人为尚未发布的收益质量付了钱。 最终尽调应聚焦经审计财务、完全摊薄股权结构表、补贴正常化后的队列，以及 fintech 单位经济性。在这些资料出现之前，
              公开证据足以划出估值纪律，但不足以支撑买入建议。
