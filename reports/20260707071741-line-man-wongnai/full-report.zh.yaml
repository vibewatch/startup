      - number: '2.5'
        title: 应保持未解的尽调缺口与冲突
        blocks:
          - type: paragraph
            body: >
              这个市场最重要的尽调纪律，是拒绝抹平分歧。可信公开来源之间的市场份额快照差异很大：Bangkok Post 2025 年 Foodpanda 退出报道援引 Momentum Works，把 2024 年份额列为
              Grab 46%、LINE MAN Wongnai 40%、ShopeeFood 7%、Foodpanda 5%、Robinhood 2%；Globe 2025 年 4 月退出文章称，Foodpanda
              份额略低于 15%，LINE MAN Wongnai 为 44%、Grab 为 39.4%；Iconic Research 2025 年综合分析则引用 Grab 35%、LINE MAN
              33%、Robinhood 13%、Foodpanda 19%。这些不是四舍五入差异。更可能反映不同调查窗口、用户份额与 GMV 份额方法差异，以及退出前后的时间差。本报告因此明确保留矛盾。


              几个关键变量也仍属私有。LINE MAN Wongnai 没有公开披露配送抽佣率、活跃交易用户、支付 TPV、按队列的商户留存，或 Rabbit LINE Pay 收购并更名后 LINE Pay
              的收入贡献。公开证据足以说明公司围绕外卖搭出了真实邻近触点，但不足以把这些触点转换成精确 SOM。因此，本章结论有意受证据约束：TAM
              比餐食配送更宽，当前服务市场已经有意义，双寡头结构正在加强，但估值工作若要声称精确，仍需要私有队列、支付和商户变现数据。
