  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的 FY2025-2026 数据显示盈利可重复；商户和金融科技显著提高盈利质量；IPO 地点和流通盘得到市场认可。
        - THB55bn-74bn（约 US$1.5bn-US$2.0bn）
        - 20%
        - 分部披露薄弱、治理遇到反弹，或 2026 年同期群弱于预期。
      - - 基准
        - 业务证明自己强于 2022 年独角兽估值底线，但还不足以享受 DoorDash 式倍数。
        - THB40bn-55bn（约 US$1.1bn-US$1.5bn）
        - 55%
        - 招股书延后、补贴后增长持平，或商户 / 金融科技结构改善有限。
      - - 悲观
        - 2025 年盈利被证明底子浅，IPO 再次推迟，或投资者因控制权集中和条款不透明而打折。
        - THB30bn-40bn（约 US$0.8bn-US$1.1bn）
        - 25%
        - 补贴退坡、曼谷需求疲软，或资本市场环境不利。
    notes: 这些区间是证据驱动的估算，不是 DCF 输出；公开披露不足以支撑高置信度预测模型。
    claimRefs:
