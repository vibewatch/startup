      - number: '8.3'
        title: 公开可比公司筛选和价格纪律
        blocks:
          - type: paragraph
            body: >-
              公司仍是私有公司，最新详细财务披露也依然很薄，因此最有用的公开市场练习不是假精确目标价，而是划边界的可比公司筛选。 选出的篮子有意混合了区域外卖和超级 app 暴露，以及商户技术：Grab
              是最接近的东南亚上市类比，Delivery Hero 是低倍数全球外卖基准， DoorDash 是质量最高的公开外卖可比，Toast 则作为商户软件和支付参照。Toast 自己的投资者关系简介称，
              它面向餐厅和零售企业提供覆盖软件、支付、fintech 和硬件的全球平台，因此比纯外卖公司更适合作为商户技术参照。 使用 2026 年 7 月市值和收入快照，这个篮子大致从 Delivery Hero 的
              1.0x 收入，到 Toast 的 2.7x、 Grab 的 4.4x、DoorDash 的 5.6x。Multiples.vc 还把 Grab 放在约 3.1x EV/revenue、且 EBITDA
              为正的位置， 这比单看头条市值更适合作为区域基准。


              把这张筛选表与 LINE MAN Wongnai 有限披露的数字放在一起，就很有约束力。如果最后一个干净的独角兽锚点约为 THB37 billion， 2023 年收入为 THB18 billion，那么
              2022 年估值已经约等于 2.1x 收入。THB55 billion 的入场价约为 3.1x， THB60 billion 约为 3.3x，开始与 Grab 这样的盈利区域平台或 Toast
              这样的商户技术平台重叠。THB74 billion 的 headline， 即约 US$2 billion 估值，会在已披露 2023 年基数上把倍数推到 4x 以上，因此需要强得多的证据证明 2025 至
              2026 年收益质量已经实质跃升。 因此正确姿态是价格纪律：为公开证据能支持的东西付钱，而不是在数字公开前为公司最强的“软件 + fintech”未来买单。
