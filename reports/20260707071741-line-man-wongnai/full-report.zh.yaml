        blocks:
          - type: paragraph
            body: >-
              公开领导层图景在最高层清楚，往下则不完整。Yod Chinsupakul 始终被列为 CEO，In Young Chung 在融资和 Rabbit LINE Pay 交易记录中以 CFO
              身份出现。创始人连续性也可见：Ekaluck Viriyakovithya 多年后以商户解决方案高管身份再次出现，而此前他曾被介绍为 Wongnai
              原始联合创始人之一。公开材料没有给出的是控制权转移后控股公司的完整董事会名单或委员会结构。这个缺口重要，因为本章最关键的治理事件不是创始人更替，而是 SoftBank 披露的 2025-2026 年收购序列：LY
              通过直接购股、修改股东协议和 MIRAI 投票代理寻求实质控制；SoftBank 随后称，到 2025 年 9 月 LY 已经合并公司报表，并预计额外步骤完成后投票权约达
              60.9%。因此，保留下来的公开来源支持「LY / SoftBank 控制力上升」这一治理叙事，但无法拼出在该控制权旁还有谁共同治理的完整图。
