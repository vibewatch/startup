  - id: TV005
    title: 推翻投资逻辑与止损触发因素表
    columns:
      - 触发因素
      - 门槛 / 事件
      - 为什么推翻投资逻辑
      - 行动含义
    rows:
      - - 盈利质量
        - 经审计的 FY2025 或 1H2026 结果显示，利润来自一次性因素、补贴拉动，或没有产生现金。
        - 溢价逻辑取决于首个盈利年度能否持续。
        - 估值转向悲观情景，避免以溢价入场。
      - - 控制权压力
        - 发行文件显示少数股东权利偏弱，或 LY 控制下流通盘过紧。
        - 即便经营改善，治理权集中也会压低可实现上行空间。
        - 要求更低入场价，否则放弃。
      - - 补贴后同期群
        - Half-Half Plus 之后，下单频率、留存或 AOV 明显回落。
        - 近期经营动能会暴露为刺激政策辅助，而非结构性改善。
        - 把模型重置到接近独角兽估值底线，甚至更低。
      - - 商户 / 金融科技结构
        - 商户数字化和金融科技未能贡献有意义的毛利或 EBITDA。
        - 业务更应按接近纯配送公司的倍数定价。
        - 采用可比区间低端，收紧价格纪律。
      - - IPO 地点和时间
        - IPO 推迟到 2027 年之后，或在泰国及区域发行窗口再次疲弱时启动。
        - 私募估值不确定性仍在，退出时间和流动性支撑会变差。
        - 先持有、跟踪，或要求二级转让折扣后再介入。
    notes: 每个触发因素都可监测，并绑定估值桥，而不是抽象的公司质量判断。
    claimRefs:
      - CV011
      - CV021
      - CV022
      - CV041
      - CV042
      - CV045
      - CV047
      - CV050
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 责任方 / 尽调路径
    rows:
      - - 经审计财务
        - FY2025 和 1H2026 收入、毛利、EBITDA、现金流和分部结构。
        - 要把区间判断转成可定价承销判断，必须先拿到这些数据。
        - 财务团队 / 外部审计师。
      - - 股权结构和优先权
        - 2022 和 2025 年证券的完全稀释持股、清算优先权、反稀释和董事会权利。
        - 决定真实下行保护和少数股东经济权益。
        - 法律顾问 / 股东协议审阅。
      - - 金融科技经济模型
        - 支付抽佣率、信贷敞口、资金成本、损失和监管资本。
        - 这是主要上行叙事，也可能是最大的隐藏风险。
        - 金融科技业务负责人 / 监管沟通文件。
      - - 商户软件质量
        - 商户数字化收入、流失率、附加率、毛利率和同期群留存。
        - 验证 Toast 式或软件式可比估值是否站得住。
        - Merchant Solutions 总经理 / 董事会材料。
      - - 补贴正常化同期群
        - Half-Half Plus 前、中、后的月度贡献利润率和留存。
        - 检验 2025 年盈利在刺激窗口之外能否守住。
        - 运营分析 / 同期群材料。
      - - IPO 结构
        - 上市地备忘录、承销商状态、预期流通盘、治理安排和募资用途。
        - 用于判断流动性、控制权压力和退出现实性。
        - 投行材料 / 董事会批准。
    notes: 这些问题按最可能改变估值的变量排序，而不是按泛泛好奇心排序。
    claimRefs:
      - CV008
      - CV037
      - CV041
      - CV047
