      - number: '3.3'
        title: 商户工作流、多平台经营与切换成本
        blocks:
          - type: paragraph
            body: >-
              泰国商户行为看起来比双寡头标题暗示的更倾向多平台经营。消费者侧，主要 App 让辅助使用成本很低：LINE MAN 推折扣和低起送配送费，Grab 推自取、预约订单和钱包绑定结账，foodpanda
              残存的应用商店页面仍宣传自取和会员节省。也就是说，下载第二个 App 很容易。更难的切换问题在商户侧。LINE MAN 和 Grab 都在派单之外推工作流工具，包括菜单控制、商户运营、广告和融资；LINE MAN
              还把市场平台绑定到 Wongnai POS 与 FoodStory POS。一旦商户的订单历史、促销、融资和门店运营都放进同一套栈，市场关系就比一个简单列表位更黏。StoreHub
              重要，是因为它提供了相反的战略价值主张：保持工作流独立，让配送平台变成可互换的需求渠道。因此，战场不只是用户下载量或促销烧钱，而是商户会把业务系统锚进聚合平台控制的栈里，还是用中立软件和自配送选项保留议价能力。
