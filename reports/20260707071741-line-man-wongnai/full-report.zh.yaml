        title: 融资历史、公开财务与规模指标
        blocks:
          - type: paragraph
            body: >-
              最后一次明确披露的估值事件仍是 2022 年 Series B。官方材料称公司以超过 USD1 billion 的估值融资 USD265 million，TechCrunch 后来总结累计融资超过 USD372
              million——这个数字与公开的 2020 年 USD110 million 合并融资加 Series B 在方向上吻合，但仍不完美，因为更早的 Wongnai
              融资金额没有完全披露。此后的更重要变化是：公开财务可见度不是靠公司年报提高，而是来自 SoftBank 的控制权通知，以及后续伙伴或媒体访谈。SoftBank 2025 年 9 月文件披露 2024 年合并收入
              JPY71.3 billion 且录得净亏损；2026 年 Bangkok Post 和 LY 材料均称公司在 2025 年首次实现盈利。规模说法很大，但对定义敏感：保留来源支持约或超过 10 million
              用户、500,000 商户、700,000 合作餐厅、250,000 骑手、70,000 家使用商户软件的企业，以及 1,300
              名员工，但这些数字并不都测量同一人群。正确读法因此是「规模大、多边、刚转盈利」，而不是「一套完全勾稽的 KPI」。
