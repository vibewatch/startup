  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与集群
        blocks:
          - type: paragraph
            body: >-
              泰国外卖领域的集中度高于消费者界面初看所示。保留下来的最新 Bangkok Post 报道称，2025 年 Grab 和 LINE MAN 合计控制了接近 90% 的泰国外卖份额；Foodpanda
              收缩、Robinhood 淡出后，ShopeeFood 成为主要但距离很远的挑战者。但买方和商户实际购买的工作并不止「送餐」。LINE MAN 把自己定位为泰国即时需求栈，覆盖外卖、网约车、杂货、跑腿、商户工具和
              POS；伙伴材料声称有 10M+ 月用户和 700K+ 商户或餐厅。Grab
              是最接近的结构性对手，因为它把外卖、交通、支付、商户工具和公开市场资本组合在一起。其余格局则分散成较弱但仍具战略相关性的类别：ShopeeFood 等商业主导的邻近业务，Robinhood
              等资本承压的本地替代者，StoreHub 等中立商户软件替代品，以及自取或自配送等平台外行为。这个更宽框架很重要，因为单看外卖集中度，无法完整捕捉谁拥有消费者流量、商户工作流，或各环节的切换摩擦。
