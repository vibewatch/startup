figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      LINE MAN Wongnai 的公开记录显示：Wongnai 在创始人带领下长期建设，2020 年合并，2022 年获独角兽轮融资， 2023-2025 年靠 M&A 扩张商户和支付业务，2025-2026 年转向
      SoftBank 支持的控制权结构和 IPO 前定位。
    data:
      items:
        - label: Wongnai 创立
          date: '2010-07-12'
          detail: 五名 Chulalongkorn 工程学院同学创办 Wongnai，定位泰国餐厅发现平台。
          tone: positive
        - label: LINE MAN 上线
          date: '2016'
          detail: LINE Thailand 推出 LINE MAN，定位本地按需服务。
          tone: positive
        - label: POS 合作
          date: '2018'
          detail: Wongnai 与 FoodStory 开始共同建设商户软件。
          tone: positive
        - label: 合并与 BRV 融资
          date: '2020'
          detail: BRV 支持的 USD110 million 合并交易催生 LINE MAN Wongnai。
          tone: positive
        - label: 全国食品配送
          date: 2021-11
          detail: 食品配送覆盖泰国全部 77 个府。
          tone: positive
        - label: Series B 轮独角兽融资
          date: 2022-09
          detail: GIC 和 LINE 领投 USD265 million 融资，公司估值超过 USD1 billion。
          tone: positive
        - label: FoodStory + RLP
          date: '2023'
          detail: 公司通过 FoodStory 和 Rabbit LINE Pay 交易扩张商户 POS 与支付业务。
          tone: positive
        - label: One Bangkok + AI 转向
          date: 2024-2025
          detail: 公司搬迁总部，称首次实现盈利，并宣布转向 AI 驱动运营模式。
          tone: neutral
        - label: SoftBank / LY 控制权
          date: 2025-09 to 2026-08
          detail: SoftBank 公告显示，LY 获得实质控制权，并有路径拿到约 61% 表决权。
          tone: neutral
        - label: 远程药房与 2027 年 IPO 目标
          date: '2026'
          detail: 远程药房获得 FDA 认证，管理层将 2027 年设为下一个 IPO 目标年。
          tone: positive
