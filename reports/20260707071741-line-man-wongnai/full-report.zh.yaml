companyProfile:
  summary: >-
    LINE MAN Wongnai 是总部位于曼谷的泰国本地生活平台，由 Wongnai 的餐厅发现网络与 LINE MAN 的即时物流服务在 2020 年合并而成。公司如今经营更宽的生态：外卖、网约车、杂货与跑腿、商户 POS
    和后台软件、餐厅发现，以及相邻的支付或金融科技 产品。公开证据支持其全国规模真实、经济性在改善，但发行人披露仍远低于公开市场投资者在支付 IPO 溢价前所需的水准。
