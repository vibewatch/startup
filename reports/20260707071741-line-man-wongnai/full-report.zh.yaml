  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与变现
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个多层变现模型，而不是单一外卖佣金业务。外卖似乎仍主导损益表，因为 Bangkok Post 引用管理层称其在 2025 年约占收入 80%，但官方公司叙事早已大幅超出外卖。商户数字解决方案现在覆盖
              POS、商户 App、餐厅软件、美容与健康软件、广告库存、优惠券、试用派样、商户公告，甚至商户融资工具。Rabbit LINE Pay
              收购后，支付和金融服务成为独立支柱；管理层后来也把借贷描述为该栈的一部分。非餐饮即时需求加入
              杂货、跑腿、网约车和远程药房服务，即便公开收入披露缺失，也可能加深钱包份额和订单频次。承销约束在定价。官方页面显示面向消费者的促销，如 0 baht 起送配送费和最高 60%
              折扣码，但不公布商户软件费率、支付抽佣率 或融资收益率。抓取语料中唯一明确的商户佣金代理来自一个低信誉市场分析页面，因此只能视为方向性，不应当成真实挂牌价格。
