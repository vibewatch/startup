      - number: '7.2'
        title: 监管、法律和信任风险
        blocks:
          - type: paragraph
            body: >-
              监管既能给 LMWN 筑护城河，也会集中风险。远程药房最清楚：FDA 认证让服务更可防守，但也把公司绑定到持牌药房工作流、 药师覆盖、可追踪药品配送，以及围绕患者记录的更高隐私预期。叫车也类似。ETDA
              和交通主管部门仍在明确合规的 app 叫车应如何运作； LINE MAN 自己的页面之所以强调合法牌照、公共雇佣注册和安全标准，正是因为这些条件在行业规模上尚未普遍解决。 隐私又叠加一层。面向合作伙伴的隐私政策和
              Apple 的 app-store 披露合在一起，显示其身份和数据足迹很宽： 银行信息、官方文件、位置、标识符、使用数据和金融信息都在其中。这些披露不是不当行为证据，但意味着一旦发生泄露、
              同意失效或越界使用，事件会落在多监管方、多利益相关者的高敏感场景里。
