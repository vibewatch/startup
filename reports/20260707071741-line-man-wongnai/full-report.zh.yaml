        title: 里程碑、IPO 路径与负面或警示信号
        blocks:
          - type: paragraph
            body: >-
              合并后的里程碑显示，公司在扩大范围，但泰国外卖经济性仍然艰难。2021 年，运营足迹扩展到全国；2022 年，独角兽融资落地；2023 年，FoodStory 和 Rabbit LINE Pay
              交易强化了商户软件与支付。管理层随后在 2024-2026 年推入新层次：总部迁至 One Bangkok、运营转向 AI 驱动、获得远程药房认证，以及通过 JERA Cloud
              进入美容与健康。同时，上市路径不断后移。TechCrunch 2024 年访谈仍把 2025 年框定为可行 IPO 年份，但 2026 年 2 月媒体报道称，国内上市计划已经暂停，转向香港或美国场地；LY
              2026 年 6 月简介则把 2027
              年设为目标年份。负面一侧更偏经济性而非生存问题：公开报道和公司自己的餐厅展望都描述了一个成熟、对补贴敏感、费率压力持续、行业历史亏损的市场。题设中的一个冲突也被保留来源清楚化解：OR 只作为 2022
