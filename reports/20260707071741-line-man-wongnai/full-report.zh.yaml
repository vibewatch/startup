  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、合并脉络、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              理解 LINE MAN Wongnai，首先应把它看作合并后的泰国平台，而不是单一起源的创业公司。Wongnai 这条线始于 2010 年 7 月：五位朱拉隆功工程学院同学，在后来的 CEO Yod
              Chinsupakul 带领下，推出了受 Yelp 启发的餐厅发现产品。LINE MAN 这条线则始于 2016 年，是 LINE Thailand 内部孵化的泰国即时服务。2020 年，两项业务在 BRV
              支持的 USD110 million 交易后合并，形成如今以「Digitalize
              Thailand」为更大使命叙事的公司。公司和伙伴材料现在用三个相连支柱描述业务：即时服务、商户数字解决方案，以及支付或金融服务。公司的公开运营总部如今位于 One
              Bangkok，法律足迹则横跨泰国经营实体和新加坡控股公司。创始人主导的本地产品 DNA、LINE 生态，以及后来以新加坡为中心的公司结构，三者共同构成身份基础；后续章节应将其视为基准。
