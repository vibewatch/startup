  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察定价锚、控制权转移和 IPO 背景
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai 最干净的已披露估值锚仍是 2022 年 9 月 Series B，而不是任何完整发布的 2025 或 2026 年上修估值。 公司材料和一份转载稿都称，该轮由 GIC 和
              LINE 领投，融资 US$265 million，估值超过 US$1 billion； 公司自己也把它表述为约 THB37 billion。此后，公开记录不是更清楚，而是更杂。CB Insights 记录了一项
              2025 年 9 月涉及 LY、 金额 US$272.78 million 的“Corporate Majority”事件，但没有给出可用的投后估值，其累计融资摘要本身也让这笔交易很难被解读为纯新股融资。
              这种模糊性很重要，因为控制权转移不等同于新的少数股东市场出清价格。


              2026 年退出背景又加了一层谨慎。管理层公开讨论过 2027 年 IPO，并研究过泰国、香港、新加坡和 Nasdaq 等可能上市地点； Bangkok Post 和 The Straits Times
              把场地转向与泰国 IPO 市场疲弱联系起来，而不是与已完全去风险的估值叙事联系起来。 SoftBank 2026 年 5 月披露还显示，LY 已在 2025 年合并 LINE MAN
              Wongnai，并预计在追加收购后投票控制权达到 60.9%。 这在战略上有支持作用，但也给任何新投资人带来治理集中和潜在自由流通盘压力。简言之，公开证据证明发生了控制权事件、IPO 准备正在推进，
              但还没有证明新的少数股东应该付什么价格。
