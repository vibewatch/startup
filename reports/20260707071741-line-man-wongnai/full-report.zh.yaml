      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 控制权既是特征，也是压力
            body: LY 和 SoftBank 的支持强化了资本可及性和支付整合，但预期 60.9% 投票控制权可能压缩自由流通盘吸引力； 如果 IPO 沿着集中治理条款推进，少数股东杠杆也会下降。
            calloutType: risk
            claimRefs:
              - CV007
              - CV047
          - type: callout
            title: 正确问题是价格，不只是质量
            body: 公开证据支持 LINE MAN Wongnai 明显优于纯泰国外卖 app，但在没有经审计的 2025 至 2026 年披露前， 还不足以支持在约 THB55 billion 以上支付高溢价市场倍数。
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV043
              - CV046
          - type: callout
            title: 商户和 fintech 上行是重估来源
            body: 乐观情景少看外卖份额，多看商户软件和支付能否真正改善毛利率、留存和收益耐久性。
            calloutType: assumption
            claimRefs:
              - CV018
