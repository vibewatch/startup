      - number: '5.5'
        title: 差异化、依赖与产品风险
        blocks:
          - type: paragraph
            body: >-
              理解 LINE MAN Wongnai 的最佳方式，是把它看作拥有多个入口的本地商业操作系统，而不是单一明星
              App。其公开护城河叙事建立在三项相连资产上：大型餐厅和商户图谱、可推向线上线下的支付轨道，以及在泰国物流、监管和商户工作流里的本地执行。这种组合与纯网约车或外卖竞争者明显不同，也解释了为什么管理层强调商户不亚于消费者。但同一架构也制造依赖。支付依赖
              LINE Pay 集成和外部合规体系；网约车依赖司机供给和交通监管；远程药房依赖 FDA
              批准的运营规则和持牌伙伴；商户金融依赖第三方银行和会计集成。负面证据也真实存在：独立报道仍把泰国外卖描述为重促销、成熟、单独经营难盈利。因此，平台论点可信，但只有当交叉销售和软件
              附着率足够强、能抵消配送结构性强度时，它才成立。
