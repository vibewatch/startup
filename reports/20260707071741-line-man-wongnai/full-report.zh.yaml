      - number: '6.3'
        title: 耐久性、复用代理指标和摩擦
        blocks:
          - type: paragraph
            body: >-
              公开记录更能证明习惯形成，不能充分证明真正留存。大规模订单和搜索量、政府项目带来的频次提升、品类层面的调研数据， 都指向一个会反复使用外卖、而不是偶发使用的泰国消费者群体。这对 LINE MAN
              有利，因为底层品类天然具备复购行为。 但这些代理指标都不能替代队列留存。公开来源没有披露按服务划分的 MAU 或 DAU、按队列的复购曲线， 也没有披露 Merchant App 和 POS 客户的商户续约率。


              客户满意度证据也并非一边倒强。访问时 Apple 泰国 App Store 页面显示 4.9 的高分和 825,000 个评分， 但 Google Play 只有 4.0 分、353,000
              条评论，并能看到本地化不佳、订单延迟或取消、优惠券摩擦、叫车爽约等投诉。 JustUseApp 偏低的 NLP 安全评分又增加了反向信息，即便这个聚合平台声誉不高。实际结论是，LINE MAN
              的效用显然足以支撑大规模交易， 但耐久性证据仍不充分：公开来源能看到触达和使用强度，却没有给出能证明长期质量的流失、续约、GRR、NRR 或客服解决 KPI。
