        title: 直接同行、邻近玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              在保留来源中，Grab 是唯一明确具备规模的全栈同行。官方产品和商户页面显示，它不只在餐饮订单上竞争，还覆盖交通、杂货、支付、商户运营和借贷；官方业绩也提供了区域配送
              GMV、商户增长和资产负债表能力的公开证据，这些是泰国私营同行难以匹配的。Foodpanda 现在主要作为警示信号仍有意义：Delivery Hero 官方通知称，泰国消费者业务已于 2025 年 5 月 23
              日停止，但公司品牌页和应用商店列表仍暴露更广亚洲足迹，以及 pandapro、pandago、自取等打包杠杆。ShopeeFood 的战略差异又不同。它更应被理解为嵌入更大电商 - 金融科技 App
              的配送功能，钱包、信贷、物流和限时抢购 流量可以补贴配送行为。Robinhood 最难干净承销：其 2026 年官方网站仍宣传外卖、网约车、购物、包裹、EV 租赁和贷款服务，并打出餐厅 no-GP 口号；而此前
              Bangkok Post 报道描述了 2024 年停运路径和大额历史亏损。配送 App 之外，中立 POS 平台和餐厅直接自取仍是真实替代品，会影响商户决定把多少运营依赖放在任何市场平台上。
