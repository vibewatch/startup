  - id: TR005
    title: 缓释与推翻投资假设的信号
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 网约车合规
        - 已持牌且完成车辆登记的活跃司机覆盖率
        - 明显低于管理层目标，或监管对不合规运营作出任何处罚
        - 暂停出行业务上行假设，并提高法律和安全风险权重。
      - - 远程药房安全与合规
        - FDA 警告、严重药品投诉集中爆发，或药师 SLA 违约
        - 任何认证暂停、警告信，或反复出现的不良事件模式
        - 停止给医疗扩张计入上行，重新评估信任风险。
      - - 非补贴需求质量
        - 刺激到期后的下单频次、平均客单价和同店销售
        - 连续两个季度双位数下滑，且没有清晰复苏计划
        - 下调配送增长假设，并提高对营销效率的审查强度。
      - - 竞争与利润率压缩
        - 激励占 GMV 比例、抽佣率让步，或商户不满
        - 促销强度升高，但留存持平或贡献利润率恶化
        - 下调稳态利润率预期，并扩大下行情景。
      - - 金融科技损失显性化
        - 核销、欺诈损失、拒付或消费者投诉
        - 损失显著高于计划，或产品扩张跑在可见控制之前
        - 在控制和经济性得到证据前，把金融科技视为估值拖累。
      - - 治理与流动性时间表
        - IPO 延期、关联方冲突，或没有对冲保护的进一步控制权集中
        - 2027 年上市目标推迟，且没有替代融资和治理计划
        - 要求更强股东保护，并施加更大的治理折价。
    notes: 这些否决标准刻意设计成可监测指标，让投资观点随证据变化，而不是只随叙事变化。
    claimRefs:
      - CR017
      - CR020
      - CR021
      - CR025
      - CR031
      - CR032
      - CR040
      - CR041
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前评估
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 建议
        - 继续研究
        - 公开证据支持公司质地，但 2026 年价格未披露，精确承销还做不了。
        - 经审计的 FY2025–1H2026 财务数据，以及披露的发行区间。
      - - 置信度
        - 中
        - 规模、2023 年收入、2025 年盈利和控制权都有可信锚点，但关键承销细节仍缺失。
        - 招股书级数据集和清晰股权结构披露。
      - - 风险评级
        - 高
        - 治理集中、上市地点不确定性和补贴正常化后的需求风险，比动能标题更能左右实际回报。
        - 可持续盈利证据和对少数股东友好的交易条款。
      - - 估值立场
        - THB37bn 附近合理；高于 ~THB55bn 偏贵
        - 独角兽估值底线意味着约 2.1x 2023 年收入；>THB55bn 已经要求投资者按接近 Grab / Toast 的质量水平付价。
        - 披露的收入和利润率跃升，足以支撑 >3x 收入倍数。
      - - 决策含义
        - 按纪律价格跟踪；不要为动能型 IPO 追高
        - 公司看起来强于单纯外卖应用，但当前公开记录只能给出估值区间，不能落到一个点。
        - 已提交的招股书、完整摊薄时间表和补贴调整后的队列证据。
    notes: 评估明确对价格敏感，并区分可观察锚点与仍未公开的 IPO 或二级清算价格。
    claimRefs:
      - CV002
      - CV003
      - CV009
      - CV010
      - CV011
      - CV037
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV002
    title: 正方 / 反方投资假设表
    columns:
      - 主题
      - 正方假设
      - 反方假设
      - 什么会改变判断
    rows:
      - - 市场地位
        - Grab 和 Line MAN 合计接近 90% 份额的双寡头市场，支撑长期相关性。
        - 成熟的泰国市场可能仍要靠促销和生态补贴增长。
        - 2026 年补贴后增长和留存数据仍然健康。
      - - 商户软件
        - POS、FoodStory 和 JERA Cloud 表明，公司比纯配送平台多了一层更高质量的软件能力。
        - 公开证据仍未披露商户数字化的分部收入、利润率和流失率。
        - 能显示类似 SaaS 的经常性贡献利润率的分部财务。
      - - 盈利拐点
        - 2025 年首次盈利说明模型正在跨过一个重要门槛。
        - 公开记录还看不出利润有多少来自补贴、业务结构或一次性因素。
        - 经审计的 FY2025 和 1H2026 报表，以及同期群经济性。
      - - 控股方支持
        - LY 和 SoftBank 背书可增强融资渠道、支付整合和 IPO 准备。
        - 预期 60.9% 表决权控制可能压低流通盘吸引力，也削弱少数股东影响力。
        - 发行文件中的少数股东保护条款和治理安排。
      - - 估值上行
        - 更宽的生态可支撑相对低倍数配送公司的溢价。
        - 在披露商户和金融科技盈利质量之前，很难承销这部分溢价。
        - 证明软件和金融科技贡献了足够比例的毛利与 EBITDA。
    notes: 该表把公司质量和价格支撑拆开看；最强的正面因素来自战略和经营，最大的负面因素则与披露和控制权有关。
    claimRefs:
