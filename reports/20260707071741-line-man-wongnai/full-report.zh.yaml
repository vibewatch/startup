  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除支出
        blocks:
          - type: paragraph
            body: >
              LINE MAN Wongnai 已不再只经营单一外卖细分。当前平台范围包括即时外卖、杂货 / 商超、跑腿、网约车、餐厅发现、商户 POS
              软件和支付基础设施。因此，对估值真正重要的边界有两层。窄层是泰国平台撮合的外卖：通过消费者餐饮订单流动的订单价值、配送物流、商户佣金、配送费、促销，以及与点餐绑定的广告库存。更宽一层，则加入 LINE MAN
              Wongnai 围绕这条需求流有意搭建的商户和支付触点：用于餐厅运营的 Wongnai POS 与 FoodStory、用于交易捕获的 Rabbit LINE Pay / LINE
              Pay，以及面向非餐饮商户软件邻近场景的 JERA Cloud。


              本章明确列出排除支出，因为宽泛的「超级 App TAM」叙事会掩盖 LINE MAN Wongnai
              尚未变现的部分。核心外卖市场不包括从未触达平台的堂食餐厅销售、大部分线下餐厅消费、未数字化的街边小吃现金交易，以及仍在配送渗透之外的更广泛泰国食品饮料支出。Bangkok Post 2025 年 4 月报道引用
              CEO Yod Chinsupakul 的说法：在线外卖仍仅占泰国 THB 800-900 billion 总食品市场的
              15%，这意味着即便经历疫情期采用，大多数食品支出仍在线下。这个区分很关键：公司可以用商户软件和支付触达更多线下支出，但公开证据仍支持受约束的 SAM，而不是覆盖全部消费的 TAM。
