      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              泰国仍有结构性因素支撑平台撮合型商业增长。Trade.gov 称，移动设备贡献泰国线上销售超过 80%，移动钱包占全部交易的 23%，移动钱包采用率预计在 2025 年达到 63%。DataReportal
              2024 年泰国数字报告显示，泰国有 63.21 million 互联网用户、97.81 million 移动连接和 53.9% 城市化率，均强化了一个庞大的移动优先可触达人群。Bank of Thailand
              数据还提供了能降低结账摩擦的支付骨架：仅 2026 年 4 月，PromptPay 交易额就达到 THB 4.46 trillion；BOT 官方指引也持续把数字支付定位为国家层面的去现金推动。公司侧，LINE
              MAN Wongnai 2023 和 2025 年更新显示，省域扩张、杂货 / 网约车邻近业务和支付整合是明确增长杠杆，不是边缘实验。


              增长逻辑真实，但约束同样真实。Bangkok Post 2024 年「市场成熟」文章指出，行业主要玩家过去三年累计亏损 THB 20.7 billion，尽管收入达到 THB 110 billion；其 2026
              年双寡头文章引用 Kasikorn Research Center 称，如无促销压力或政府支持，市场将几乎没有增长。商户采用也受残酷餐厅底层经济性约束：LINE MAN Wongnai 称，50%
              新餐厅一年内关闭，65% 三年内关闭，这一方面创造了 POS 和分析需求，另一方面也限制了商户付费意愿。公司自己的 2025
              年展望进一步说明成熟度并不均衡：省域市场比曼谷恢复更快，而核心城市热点仍偏软。换句话说，市场已不再证明「有没有需求」，而是在证明更高频习惯和更深商户变现，能否抵消促销、竞争和脆弱单店经济性。
