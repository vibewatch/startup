        title: 消费者界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai 已不再像一个单一服务外卖 App。公开界面现在呈现为分层消费者旅程：发现可以从 Wongnai 的餐厅与生活方式内容图谱开始，主 LINE MAN App
              再把用户导入四个核心交易服务之一——外卖、网约车、杂货 或跑腿——同一生态还越来越多叠加支付、点评、促销，最终延伸到受监管健康。这很重要，因为公司的差异化不只是「一个 App
              里有很多标签页」；它试图把客户意图、商户库存、骑手供给和支付捕获留在一个本地运营闭环中。官方页面显示，外卖、杂货
              和跑腿已经覆盖全国；网约车仍处在较早铺开阶段，远程药房则是新近受监管的延伸，还不是大众规模品类。因此，工作流宽但不均衡：配送和发现栈已经成熟，网约车、金融科技 和健康仍在从功能可用走向更深运营密度。
