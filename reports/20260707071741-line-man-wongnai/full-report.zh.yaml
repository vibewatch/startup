      - number: '8.2'
        title: 业务证明真实存在，但收益质量只部分可见
        blocks:
          - type: paragraph
            body: >-
              故事里偏多的部分并非假设。LY 2026 年 6 月资料描述了一家公司：用户超过 1000 万、商户 500,000、骑手 250,000； 公司披露也指向超过 1000
              万用户，以及一个与外卖、餐厅软件和支付绑定的庞大商户基础。因此，这个 franchise 明显大于一个单一服务的泰国外卖 app。 商户软件对估值尤其重要，因为它能把收益质量抬到纯交易市场之上。官方材料描述了
              55,000 家餐厅的 POS 覆盖、2023 年约 40% 份额、 通过 Wongnai POS 和 FoodStory POS 合并网络实现的 THB180 billion GMV，并通过 JERA
              Cloud 继续扩进美容和健康软件。 如果这些业务真的盈利且有黏性，它们应获得比商品化外卖倍数更高的认可。


              但空头情景同样有公开证据支撑。Bangkok Post 报道 2023 年收入 THB18 billion、亏损 THB563 million； 即便 2025
              年看到了利润拐点，公开材料也没有随附经审计收入、EBITDA 或现金流细节。餐厅反弹叙事还与政府 Half-Half Plus 补贴交织在一起； LINE MAN 称该项目三周内产生超过 8 million
              笔订单，并在项目窗口期推高下单频次、客户数和客单价。这证明平台能在需求被刺激时变现需求； 但还不能完全证明新的盈利能力在正常化基础上已经耐久。核心结论是，LINE MAN Wongnai 已经值得相对无差异外卖
              app 享有溢价， 但在披露更多之前，还不能无条件给予软件式估值。
