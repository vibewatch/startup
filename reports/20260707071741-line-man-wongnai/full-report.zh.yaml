      - number: '4.3'
        title: 成本结构、利润率驱动与获客效率
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一家利润率路径在改善、但仍暴露于沉重市场摩擦的公司。第三方报道显示，泰国经营实体层面的亏损从 2022 年到 2023 年明显收窄；伙伴报道则称公司在 2025
              年实现盈利，或至少预计当年打平。但同一公开语料也说明，投资者不能假设各处都有软件式利润率。消费者定价仍重度依赖促销，商户获客显然依赖折扣和活动参与；2026 年 Grab
              基准也说明了这点为何重要：这家上市区域同行即使产生的配送 EBITDA 仅为 GMV 的 2.3%，仍投入了相当于即时需求 GMV 10.5% 的激励。这个视角对 LINE MAN Wongnai
              有用，因为它最强的市场拓展证明来自 Half-Half Plus、广告产品、优惠券、产品试用派样和商户公告等拉动量的项目；这些项目可以有效，但也昂贵。商户软件可能拥有最干净的利润率画像——LY
              明确称该业务高度盈利——但公开来源没有披露这块利润池相对更大的外卖引擎到底有多大。餐厅生态的成本压力也真实存在，年关闭率 50%，经营者对费率、人工和食材通胀持续敏感。
