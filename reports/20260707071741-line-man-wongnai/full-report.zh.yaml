        title: 支付、信任、安全与受监管健康
        blocks:
          - type: paragraph
            body: >-
              信任控制可见，但分散在几个子系统里，而不是汇总在一个安全中心。Rabbit LINE Pay 收购并更名后，支付实质性靠近核心产品，让 LINE MAN Wongnai
              有路径统一线上结账、线下受理、转账、交通场景和商户赋能。公开 LINE Pay 材料提供了比核心 App 界面更强的技术证据，包括 PCI DSS 和 ISO/IEC 27001 引用。消费者 App
              本身通过隐私政策和 App Store 隐私标签披露大量数据类别、欺诈监控和海外传输，但也明确指出互联网传输无法做到完全安全。网约车有不同的信任画像：安全通过司机检查、行程追踪、保险和 Department of
              Land Transport 监管来表述。远程药房是最新、监管最重的信任层，涉及 FDA 认证、持牌药房匹配、患者记录处理和 15-kilometer
              服务边界。结论：合规存在，但按产品线碎片化；支付和远程药房的公开披露强于核心市场平台栈。
