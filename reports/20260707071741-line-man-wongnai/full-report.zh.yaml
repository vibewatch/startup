      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >
              泰国外卖和超级 App 市场包含多个经济属性不同的群体。消费者侧由 App 用户锚定：他们浏览餐厅、比较促销、选择支付方式，并产生复购；Wongnai 关于页面称平台服务超过 10 million
              月活用户，并维护全国最大餐厅数据库，覆盖 900,000 多家餐馆；LINE MAN 应用商店页面目前宣传可触达全国约 700,000
              家餐厅。商户侧用户是餐厅经营者，他们需要获客、订单管理、CRM，以及越来越多的 POS 和支付工具。LINE MAN Wongnai 的商户软件论点并非猜想：公司称 Wongnai POS 与 FoodStory
              POS 合计服务 55,000 家餐厅，约占泰国餐厅 POS 市场 40%。


              付费责任也因工作流而异。消费者支付餐篮、配送费和钱包充值；商户支付佣金、折扣、广告参与和软件订阅；骑手提供时间与运力；国家也可通过 Half-Half Plus 等补贴计划短暂成为需求催化剂。LINE MAN
              Wongnai 2025 年底餐厅展望显示，激励会实质改变采用曲线：三周内产生超过 8 million 笔 Half-Half Plus 配送订单，新客增长 22%，下单频次增长 30%，平均客单价增长
              15%。实际采用路径因此不只是「下载 App、点外卖」。它先通过内容和搜索完成发现，再借促销或便利完成首购，通过卡 / 现金 / 钱包选择形成支付习惯，随后再靠网约车、杂货、商户工具或支付加深生态绑定。
