  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险版图
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai 最强的公开上行信号——规模、生态宽度和新的受监管相邻业务——也带来了最重要的下行暴露。
              公开记录显示，最高的残余风险不是某一桩诉讼或某一个对手，而是一组相互牵连的脆弱点：需求质量仍倚赖平价活动和政府刺激，
              竞争强度让行业激励居高不下，业务扩进叫车和远程药房等受监管领域，支付和信贷执行越来越重要，资本市场故事仍在寻找合适场地和可持续盈利证明。 规模会放大一切。公司拥有数百万用户、数十万商户和骑手，一个 app
              横跨外卖、叫车、mart、消息、支付和现在的远程药房； 任何信任、安全、监管或利润率失误，传播范围都会比单一产品创业公司更广。因此正确框架是残余暴露，而不是表面增长。
