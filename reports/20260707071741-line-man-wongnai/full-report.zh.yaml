  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值
      - 为什么重要
      - 核心局限
    rows:
      - - LINE MAN Wongnai 2022 年独角兽估值底线（按 2023 年收入）
        - THB37bn 估值，对比 2023 年收入 THB18bn
        - ~2.1x 收入
        - 说明最后一个干净的公开锚点，相比疲弱的配送经济性已嵌入明显溢价。
        - 用 2022 年估值对比 2023 年收入，未纳入 2025 年盈利。
      - - Grab
        - US$15.74bn 市值，对比 US$3.55bn TTM 收入；Multiples.vc 显示 3.1x EV/收入
        - ~4.4x 市值 / 收入；~3.1x EV/收入
        - 最接近的东南亚上市超级 App，覆盖配送、出行、广告和金融科技相邻业务。
        - 地理覆盖更大，公开披露也比 LINE MAN Wongnai 更成熟。
      - - Delivery Hero
        - US$12.71bn 市值，对比 2024 年收入 US$12.79bn
        - ~1.0x 市值 / 收入
        - 资本密集型全球运营商的低端配送估值基准。
        - 地域不同，且投资逻辑里的商户软件上行空间小得多。
      - - DoorDash
        - US$82.11bn 市值，对比 US$14.72bn TTM 收入
        - ~5.6x 市值 / 收入
        - 优质上市配送标杆，用来观察投资者愿意为强执行支付多少价格。
        - 美国市场结构和盈利画像目前明显好于泰国。
      - - Toast
        - US$17.09bn 市值，对比 US$6.44bn TTM 收入
        - ~2.7x 市值 / 收入
        - Toast 自称是面向餐厅的平台，覆盖软件、支付、金融科技和硬件，因此可作为商户科技和支付参照。
        - 餐厅软件收入结构比 LINE MAN Wongnai 的混合模式更纯，披露也更充分。
    notes: 样本式可比对象集合混合了区域配送和商户科技参照，因为 LINE MAN Wongnai 已不再是纯食品配送业务。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample covers the most relevant public delivery, super-app, and merchant-tech references available in the
        fetched pack and is intentionally not exhaustive because directly comparable SEA private marks remain sparse.
