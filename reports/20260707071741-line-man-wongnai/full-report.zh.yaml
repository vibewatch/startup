  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分群
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai 服务的是双边生态，而不是单一客户群。需求侧，公司公开称月活用户超过 1000 万、合作餐厅达 700,000 家；Wongnai
              仍在宣传自己既有的大规模发现流量和餐厅数据库。供给侧，官方材料又分别强调 700,000+ 活跃商户、55,000+ 家接入 POS 栈的餐厅，以及越来越多使用营销解决方案的品牌。这个拆分很关键：
              不同分群里的买方、用户、付款方差异很大。外卖消费者通常三者合一；餐厅老板购买软件，真正使用的是门店经理和员工； 品牌购买广告或优惠券分发，终端用户负责核销；政府补贴项目又会改变复购订单实际由谁买单。


              地域覆盖和渠道宽度是实打实的优势。官方页面称外卖和 MART 覆盖全国 77 个府；公司同时在餐厅及相邻商户场景里加深 门店管理、QR、POS
              和远程药房工作流。客户版图因此横跨消费者外卖、商户运营、品牌活动，以及美容、健康、医疗可及性等相邻服务品类。
              主要分群缺口不是触达，而是分母质量：公开来源仍未披露所称用户里有多少按服务划分的活跃用户、多少商户定期交易， 以及支出有多少集中在少数餐厅、品牌或渠道上。
