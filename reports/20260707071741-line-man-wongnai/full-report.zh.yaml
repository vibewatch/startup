        - 餐饮、出行、商超、跑腿、POS、商户 App
        - 实际抽佣率和订阅机制未公开
        - 竞争靠本地密度加工作流，不只是配送费
      - - Grab
        - 按距离计配送费；自提、Dine Out Deals 和 GrabUnlimited 公开可见
        - 商户页面显示无预付注册费；保留的官方资料未公布标准佣金
        - 餐饮、出行、支付、商户 App、贷款、广告
        - 需要实际合同费率表和返利机制
        - 对商户和用户而言，是公开信息中最强的全栈替代
      - - Foodpanda
        - 每日优惠、自提、pandapro 和 pandago 仍在 App 界面可见
        - 泰国消费者业务于 2025 年 5 月 23 日停止
        - 餐饮、杂货、包裹、会员
        - 应用商店地域文案滞后于退出公告
        - 除非用户或资产在其他地方重新激活，否则对泰国直接威胁很小
      - - ShopeeFood / Shopee
        - 重促销商业 App，带 ShopeePay 和信贷产品
        - 未保留公开的泰国佣金披露
        - 餐饮邻近、钱包、先买后付、物流
        - 泰国独立页面已失效，规模未披露
        - 可借电商流量低成本重新加速
      - - Robinhood
        - 面向餐厅合作伙伴的 No-GP 主张
        - 商户经济账对餐厅更友好，但变现模型不清楚
        - 餐饮、出行、旅行、包裹、贷款
        - 2024 年停运报道后，当前运营规模仍不明
        - 商户友好切口，但耐久性未证实
      - - StoreHub
        - 保留的落地页未披露软件定价
        - 以 POS 软件变现，而不是配送佣金
        - POS、集成、多门店运营
        - 没有消费者发现层
        - 提高商户相对聚合平台的议价能力
    notes: 官方泰国外卖页面很少发布标准商户佣金表；只有保留来源集支持时，才展示第三方费率区间。
