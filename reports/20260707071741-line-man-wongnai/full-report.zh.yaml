  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销的影响
      - 精确尽调路径
    rows:
      - - 已审计合并收入和按分部拆分的毛利
        - 缺少合并分部报告，2023 年公开收入 / 亏损代理值无法支撑真实利润率模型
        - 要求提供已审计 FY2024-FY2025 报表，以及按月拆分管理账，细分为外卖、非餐即时履约、商户软件、广告和支付
      - - 总额到净额收入桥和激励负担
        - GMV 和订单增长无法说明佣金能否扛过补贴、退款和骑手支持
        - 要求提供各垂直从 GMV 到净收入和贡献利润率的月度瀑布图
      - - POS / 商户软件定价、流失率和服务组合
        - 商户数字解决方案可能是最干净的利润池，但公开数据看不出规模或耐久性
        - 审查当前价格卡、续约率、服务附加、实施工时以及按产品拆分的毛利率
      - - 支付和贷款变现
        - 金融科技可能是上行空间，也可能因抽佣率、信贷损失和融资结构变成资产负债表风险
        - 要求提供 TPV、活跃付款用户、抽佣率、贷款余额、不良贷款、核销和资金成本
      - - 现金余额、烧钱、债务和资金续航
        - 战略背书不能替代偿付能力分析
        - 获取资金管理看板、债务期限表、集团内融资条款和董事会资金续航情景
      - - 2025 年控制权交易中的所有权转让经济
        - 如果多数股权交易主要是老股，公开“融资额”可能高估可用于增长的现金
        - 要求提供交割备忘录，列出新股融资款、老股转让款、卖方名单和交割后股权结构表
      - - 可比上市同业的 IPO 级周期报告包
        - 上市同业会发布集中披露页面和季度公告，披露订单、GOV 或 GMV、收入、利润以及已审计年报包；LINE MAN Wongnai 不披露
