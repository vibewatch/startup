      - number: '6.4'
        title: 扩张、集中度和渠道摩擦
        blocks:
          - type: paragraph
            body: >-
              最可信的扩张故事不只是“更多外卖订单”，而是公司能否把流量转成价值更高的商户关系。公开证据显示了一条阶梯： 从消费者外卖进入 Merchant App、广告和促销、POS 软件、QR 和支付工作流，再通过
              JERA Cloud 进入相邻软件。 这是典型的先落地再扩张。FoodStory 加强了连锁和高端餐厅触达；Café Amazon 提供了 Order & Pay 加 Pick & Go 进入门店运营的在用
              Digital Store 样本； JERA 把栈延伸到美容和健康；活动合作伙伴又在品牌需求生成上叠加了一层变现。


              反面是集中度和渠道依赖。外部市场报道一直把泰国描述为 Grab 和 LINE MAN 主导的双寡头市场，哪怕不同方法得出的份额估计并不一致。
              近期增长看起来也和补贴项目、促销强度交织在一起，说明部分获客和复用行为可能靠政策或折扣助推，而不完全是自然需求。 此外，TechCrunch 提到公司依赖 LINE
              分发；公开来源仍未披露头部商户、头部品牌或头部渠道集中度。公司也在投入骑手和司机福利， 这能降低供给侧流失，但不等于终端客户耐久性。投资人因此看到了真实的宽度和扩张面，但公开数据还不足以排除对少数项目、
              渠道或大商户队列的隐性依赖。
