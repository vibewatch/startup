      - number: '7.4'
        title: 合作方、依赖、竞争和财务模型风险
        blocks:
          - type: paragraph
            body: >-
              LMWN 的生态看起来可以自我强化，但仍依赖它无法完全控制的参与方。公司现在更深嵌入 LINE 和 LY 生态；SoftBank 披露又显示所有权集中度进一步上升。
              这能帮助分发和融资，但如果上市地点、资本结构或关联方优先事项上利益分歧，也会削弱战略独立性并引发少数股东治理问题。
              竞争背景同样艰难。公开来源一致认为泰国如今实际上是双头部市场，但也一致认为该品类促销很重、结构上难以变现。 Grab 的 2026
              年业绩显示，这个基准对手仍在大力投放激励，同时比大多数本土玩家更快扩张金融服务。LMWN 的应对是加深支付、
              商户软件和信贷。这在战略上或许正确，但会提高模型风险，因为未来逻辑取决于监管和损失画像都不如外卖核心透明的业务。
