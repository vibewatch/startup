      - number: '4.2'
        title: 需求规模与单元经济代理指标
        blocks:
          - type: paragraph
            body: >-
              规模比经济性更容易公开验证。官方和伙伴来源中，LINE MAN Wongnai 始终指向超过 10 million 的用户基础、超过 500,000 的商户基础、LINE MAN 上 700,000 多家餐厅和
              Wongnai 更宽数据库中 900,000 多家餐厅，以及一个按来源和定义在超过 100,000 至 250,000 之间变化的骑手网络。对一家私营公司而言，公开需求代理指标也异常具体：2023 年更新引用
              GMV 增长 33%；Fun Facts 2025 提到 65 million 份米饭咖喱订单和 8 million 份最受欢迎菜品；Half-Half Plus 计划在短短三周内带来 8 million
              笔订单，并把下单频次拉升 30%、平均客单价拉升 15%。商户软件给出另一条需求读数：据称合并 POS 产品处理了 180 billion baht GMV 和 636 million
              笔订单。问题在于，这些是活动指标，不是毛利指标。公开投资者能看到规模、频次和销售速度，却看不到抽佣率、退款、激励或服务负担，而这些才会把活动转换成可靠贡献利润率。
