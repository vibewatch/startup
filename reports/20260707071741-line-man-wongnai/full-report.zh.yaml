      - number: '4.4'
        title: 资本充足性、融资依赖与财务结论
        blocks:
          - type: paragraph
            body: >-
              资本支持看起来充足，但资本充足性仍只能部分承销。公司公开披露 2020 年 USD 110 million 和 2022 年 Series B 的 USD 265 million；TechCrunch
              称累计融资超过 USD 372 million，CB Insights 列出 USD 375 million。CB Insights 还把 2025 年 9 月企业多数股权轮描述为 USD 272.78
              million；SoftBank 后来确认，LY 到 2025 年 9 月已经把 LINE MAN Wongnai 合并为子公司，并预计额外收购后间接投票权升至
              60.9%。这条控制权路径可能改善战略资本和生态支持的可得性，但也让新注入公司的一手现金与二级股权转让之间的比例变得模糊。与此同时，管理层在谈一个五年 10 billion baht 的技术计划——约每年 2
              billion
              baht——外加更多收购。即便对一个有规模的平台，这也是有意义的资本强度。由于抓取来源没有披露现金、烧钱、现金可支撑期限、债务或详细支付经济性，结论应保持平衡：收入质量有希望，因为多元化真实存在，商户软件可能盈利；但承销仍取决于私有披露，包括合并报表、总收入到净收入的调节表、流动性，以及支付和商户金融的实际经济性。与上市同行相比，披露缺口很刺眼：Grab
              已在本章提供 6-K 和 20-F 文件，DoorDash 在一份业绩新闻稿中发布 Q1 2026 订单、GOV、收入、GAAP 净利润和 adjusted EBITDA，DoorDash 与 Uber
              也都有专门公开申报 通道，可作为私募投资者评估 IPO 准备度的基准。
