callouts:
  - calloutType: risk
    title: Duopoly does not equal easy profits
    body: |
      Thailand's food-delivery market is consolidating toward two leaders, but Bangkok Post's reporting on industry losses and KResearch's maturity comments show that scale has not removed the need for promotions or solved merchant-margin pressure. A tighter market structure may improve discipline, but it does not automatically prove sustainable unit economics.
    claimRefs:
      - CM033
      - CM034
      - CM042
      - CM045

  - calloutType: insight
    title: Merchant software and payments are the real TAM expansion levers
    body: |
      The strongest market-expansion evidence in this chapter does not come from a heroic food-delivery growth assumption. It comes from LINE MAN Wongnai assembling recurring merchant software and payments layers around an already-scaled consumer network: 55,000 POS restaurants, Rabbit LINE Pay / LINE Pay integration, and 1,700 beauty-and-wellness outlets via JERA Cloud.
    claimRefs:
      - CM004
      - CM021
      - CM023
      - CM029

  - calloutType: assumption
    title: Use a constrained SOM until private metrics arrive
    body: |
      Public evidence is strong enough to size the category and map adjacencies, but it is not strong enough to produce a precise revenue SOM for LINE MAN Wongnai. Investors should treat public market-size and market-share numbers as boundary conditions, then request private data on take rate, MAU-to-order conversion, merchant retention, and payments TPV before using a precise valuation model.
    claimRefs:
      - CM016
      - CM017
      - CM046
      - CM047

