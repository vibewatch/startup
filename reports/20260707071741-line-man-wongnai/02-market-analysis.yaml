  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: line-man-wongnai-som
      missingEvidence: "Delivery GMV, take rate, and monthly transacting user data for LINE MAN Wongnai by major city and province."
      whyItMatters: "Without these inputs, public market size cannot be converted into a precise revenue SOM or cohort-based valuation model."
      diligencePath: "Request internal KPI packs showing GMV, orders, MAUs, take rate, and merchant cohort retention for food delivery and adjacent services."
      relatedQuestionRefs: [QM023]
    - type: private-evidence-only
      severity: material
      topic: line-pay-tpv
      missingEvidence: "LINE Pay Thailand TPV, active-wallet count, merchant acceptance coverage, and in-app checkout penetration after the Rabbit LINE Pay acquisition."
      whyItMatters: "Payments are a core TAM-expansion surface, but public materials only describe integration intent and not actual transaction scale or monetization."
      diligencePath: "Request post-acquisition payments dashboards, TPV bridge, merchant-attach metrics, and wallet share-of-checkout within LINE MAN orders."
      relatedQuestionRefs: [QM025]
    - type: conflicting-data
      severity: material
      topic: thailand-food-delivery-market-share
      missingEvidence: "A source-level methodology reconciliation for Thai food-delivery market share across GMV, order count, and user-based snapshots."
      whyItMatters: "The public share estimates vary too widely to support a single defensible market-share assumption without understanding each publisher's basis and timing."
      diligencePath: "Ask management for the third-party market-share studies it relies on, including sample window, unit of measure, and whether shares are GMV-, order-, or active-user-based."
      relatedQuestionRefs: [QM017, QM026]
    - type: missing-source
      severity: minor
      topic: cross-vertical-merchant-tam
