  - id: diligence-gaps-and-preserved-conflicts
    title: Diligence Gaps and Conflicts That Should Stay Unresolved
    body: |
      The most important diligence discipline in this market is refusing to smooth over disagreement. Market-share snapshots conflict materially across credible public sources: Bangkok Post's 2025 Foodpanda-exit coverage, citing Momentum Works, put 2024 shares at Grab 46%, LINE MAN Wongnai 40%, ShopeeFood 7%, Foodpanda 5%, and Robinhood 2%; Globe's April 2025 exit article said Foodpanda had just under 15% share against LINE MAN Wongnai at 44% and Grab at 39.4%; Iconic Research's 2025 synthesis instead cited Grab 35%, LINE MAN 33%, Robinhood 13%, and Foodpanda 19%. These are not rounding differences. They likely reflect different survey windows, user-share versus GMV-share approaches, and pre- versus post-exit timing. The report therefore preserves the contradiction explicitly.

      Several critical variables also remain private. LINE MAN Wongnai does not publicly disclose delivery take rate, active transacting users, payments TPV, merchant retention by cohort, or the revenue contribution of LINE Pay after the Rabbit LINE Pay acquisition and rebrand. Public evidence is strong enough to say the company has built real adjacency surfaces around food delivery, but not strong enough to convert those surfaces into a precise SOM. That is why the chapter's conclusion is intentionally evidence-constrained: the TAM is broader than meal delivery, the current served market is already meaningful, and the duopoly structure is strengthening, but valuation work still needs private cohort, payments, and merchant-monetization data before it can claim precision.
    claimRefs:
      - CM016
      - CM017
      - CM042
      - CM043
      - CM044
      - CM045
      - CM046
      - CM047

