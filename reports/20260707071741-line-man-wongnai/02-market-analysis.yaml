runDate: '2026-07-07'
company:
  name: LINE MAN Wongnai
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Thailand food delivery is large but not cleanly measurable: published figures range from
    KResearch's THB 81-86 billion 2023 market view to roughly THB 100 billion by 2025 and
    Momentum Works-cited GMV of US$4.2 billion in 2024 rising to US$5.1 billion in 2025.
    For LINE MAN Wongnai, the investable market is broader than meal commissions because the
    company spans food delivery, adjacent on-demand services, merchant software, and payments,
    but public disclosures still do not reveal take rates, active-user intensity, or payments TPV.
sections:
  - id: market-boundary-and-included-spend
    title: Market Boundary, Included Spend, and Excluded Spend
    body: |
      LINE MAN Wongnai does not operate in a single-product food delivery niche anymore. Its current platform scope combines on-demand food delivery, grocery/mart, messenger, ride-hailing, restaurant discovery, merchant POS software, and payments infrastructure. The boundary that matters for valuation therefore has two layers. The narrow layer is Thailand platform-mediated food delivery: order value flowing through consumer food orders, delivery logistics, merchant commissions, delivery fees, promotions, and ad inventory tied to food ordering. The broader layer adds the merchant and payment surfaces that LINE MAN Wongnai has intentionally been assembling around that demand stream: Wongnai POS and FoodStory for restaurant operations, Rabbit LINE Pay / LINE Pay for transaction capture, and JERA Cloud for non-restaurant merchant software adjacency.

      The chapter keeps excluded spend explicit because broad “super-app TAM” narratives can hide what LINE MAN Wongnai does not yet monetize. Excluded from the core food-delivery market are dine-in restaurant sales that never touch the platform, most offline restaurant spending, non-digitized street-food cash transactions, and broader Thai food-and-beverage spending that remains outside delivery penetration. Bangkok Post's April 2025 reporting quoted CEO Yod Chinsupakul saying online food delivery still represented only 15% of Thailand's THB 800-900 billion total food market, which means the majority of food spend remains offline even after pandemic-era adoption. That distinction matters: the company can use merchant software and payments to reach more of that offline spend, but public evidence still supports a constrained SAM rather than an all-of-consumption TAM.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001

  - id: sizing-lenses-and-conflicting-estimates
    title: Multiple Sizing Lenses, Contradictory Estimates, and Constrained TAM Logic
    body: |
      Public market-size evidence for Thai food delivery is directionally consistent on scale but inconsistent on methodology, unit, and timing. LINE MAN Wongnai's 2H2023 business update cited KResearch's expectation that the 2023 food delivery market would decline 0.8-6.5% to THB 81-86 billion. Bangkok Post's June 2026 duopoly report, citing Momentum Works, said Thai food-delivery GMV rose from US$4.2 billion in 2024 to US$5.1 billion in 2025, while the same article referenced e-Conomy SEA 2025 language pointing to about US$5.0 billion in 2025. Iconic Research's 2025 synthesis placed the market at roughly THB 100 billion by 2025, and Yod separately argued that the category still had room to reach THB 120-150 billion because it was only 15% penetrated versus Thailand's THB 800-900 billion total food market.

      These figures should not be normalized into a fake consensus. Some numbers describe annual GMV in U.S. dollars, some describe a baht-denominated “market value” view, some are near-term observed size, and some are management-style upside lenses. The correct diligence move is therefore a constrained TAM stack: total Thai food spend sets the outer bound, observed online food-delivery GMV anchors the current served market, and merchant software plus payments provide adjacency upside that can expand monetization without assuming that delivery itself captures all restaurant spend. The absence of disclosed take rate, active-order frequency, or payments TPV means SOM cannot be cleanly reduced to a single baht figure from public evidence alone.
    claimRefs:
      - CM003
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002

  - id: buyer-user-payer-segmentation
    title: Buyer, User, Payer, and Adoption Path
    body: |
      The food-delivery and super-app market in Thailand has multiple economically distinct constituencies. The consumer side is anchored by app users who browse restaurants, compare promotions, choose payment methods, and generate repeat orders; Wongnai's about page says the platform serves more than 10 million monthly active users and maintains the country's largest restaurant database with more than 900,000 eateries, while the LINE MAN app store pages currently market access to roughly 700,000 restaurants nationwide. Merchant-side users are restaurant operators who need demand generation, order management, CRM, and increasingly POS and payment tools. LINE MAN Wongnai's merchant-software argument is not speculative: the company says Wongnai POS and FoodStory POS together serve 55,000 restaurants and about 40% of the Thai restaurant POS market.

      Payer responsibility also differs by workflow. Consumers fund baskets, delivery fees, and wallet top-ups; merchants fund commissions, discounts, advertising participation, and software subscriptions; riders supply time and fleet capacity; and the state can temporarily become a demand catalyst through subsidy schemes such as Half-Half Plus. LINE MAN Wongnai's late-2025 restaurant outlook shows that incentives can materially change the adoption curve: over 8 million Half-Half Plus delivery orders were placed within three weeks, new customers rose 22%, order frequency rose 30%, and average basket size rose 15%. The practical adoption path is therefore not just “download app, order food.” It is discovery through content and search, first purchase via promotions or convenience, payment habit formation via card/cash/wallet choice, and then deeper ecosystem attachment through ride, mart, merchant tools, or payments.
    claimRefs:
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
    tableRefs:
      - TM003
