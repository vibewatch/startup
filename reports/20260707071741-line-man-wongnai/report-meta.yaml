  topStrengths:
    - >-
      LINE MAN Wongnai has visible Thai scale, with roughly 10 million users, about 700,000
      partnered restaurants, nationwide 77-province coverage, and duopoly relevance in food delivery.
    - >-
      Product breadth is wider than a single delivery app: the platform spans delivery, ride,
      grocery, restaurant discovery, merchant software, and adjacent payments or fintech workflows.
    - >-
      Merchant software looks strategically meaningful, with public evidence for more than 70,000
      business users and a 55,000-restaurant POS footprint tied to roughly 40% market share.
    - >-
      2025 profitability and continued IPO optionality suggest the company is maturing beyond a
      purely subsidy-fueled growth story, even if detailed quality-of-earnings disclosure is missing.
  topRisks:
    - >-
      Public disclosure is still insufficient for premium underwriting: no retained audited FY2025-FY2026
      financial pack, segment margins, cash-flow statement, or subsidy-normalised cohort disclosure surfaced.
    - >-
      Control concentration shifted toward LY and SoftBank-backed ownership, but minority-rights,
      preference, and final control-transaction economics remain only partly visible in public sources.
    - >-
      Thai food delivery appears mature and promotion-sensitive, so durable profitability may prove
      weaker than headline 2025 profit signals if subsidies or government stimulus fade.
    - >-
      Fintech and LINE Pay expansion widen the regulatory, execution, and credit-risk surface beyond
      the original delivery marketplace.
    - >-
      Grab remains a formidable peer in a near-duopoly market, while low-cost re-entry or adjacent
      attacks from ShopeeFood and other commerce platforms cannot be ruled out.
  unresolvedGaps:
    - Audited FY2025-FY2026 standalone financial statements, including segment revenue, EBITDA, and cash flow.
    - Fully diluted cap table, preference stack, and minority-rights terms for the 2025 control transaction.
    - Cohort retention, repeat-frequency, subsidy-normalised order economics, and active-user definitions.
    - Fintech and LINE Pay unit economics, credit-loss metrics, and regulatory capital or licensing detail.
    - Prospectus-grade governance, float, and venue timing disclosures for any eventual IPO.
disclaimer: >-
  This report is a public-information diligence snapshot prepared as of 2026-07-07. It is not
  investment advice. Several underwriting-critical inputs remain undisclosed by LINE MAN Wongnai,
  especially audited current financial statements, cap-table terms, and subsidy-normalised cohort
  economics. Any investment decision should be conditioned on direct management diligence and
  prospectus-grade disclosure.
