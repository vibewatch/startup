- id: TR005
  title: Mitigation and Thesis-Break Signals
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Ride-hailing compliance
    - Licensed and vehicle-registered active-driver coverage
    - A material miss versus management targets or any regulator sanction on non-compliant operations
    - Pause mobility upside assumptions and increase legal and safety risk weighting.
  - - Telepharmacy safety and compliance
    - FDA warning, severe medication complaint cluster, or pharmacist-SLA breach
    - Any certification suspension, warning letter, or repeated adverse-event pattern
    - Freeze healthcare-expansion credit in the model and re-underwrite trust risk.
  - - Non-subsidized demand quality
    - Order frequency, average basket, and same-store sales after stimulus expiry
    - Sustained double-digit decline over two quarters without a clear recovery plan
    - Cut delivery growth assumptions and raise marketing-efficiency scrutiny.
  - - Competition and margin compression
    - Incentives as a share of GMV, take-rate concessions, or merchant dissatisfaction
    - Higher promo intensity with flat retention or worsening contribution margins
    - Lower steady-state margin expectations and widen downside case.
  - - Fintech loss emergence
    - Chargeoffs, fraud losses, chargebacks, or consumer complaints
    - Losses materially above plan or product expansion ahead of visible controls
    - Treat fintech as a drag on valuation until controls and economics are evidenced.
  - - Governance and liquidity timeline
    - IPO slippage, related-party conflict, or further control consolidation without offsetting protections
    - 2027 listing target slips without a replacement financing and governance plan
    - Demand stronger shareholder protections and apply a wider governance discount.
  notes: These kill criteria are intentionally monitorable so the investment view can change on evidence rather than on narrative shifts alone.
