  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-share-methodology
    missingEvidence: A reconciled third-party methodology showing whether Thai market-share claims are measured by GMV, orders, MAU, or daily transactions across the same time window.
    whyItMatters: Concentration and competitive durability matter to both margin expectations and regulatory leverage, and public share figures do not line up cleanly.
    diligencePath: Request the underlying Redseer, Momentum Works, and Statista definitions and rebuild the market-share bridge on one basis.
    relatedQuestionRefs:
    - QR012
  - type: private-evidence-only
    severity: material
    topic: profitability-disclosure
    missingEvidence: Audited 2025-2026 segment EBITDA, cash-flow, and incentive-accounting detail by delivery, merchant solutions, and fintech.
    whyItMatters: Management says profitability arrived in 2025, but public evidence does not yet show how durable, diversified, or cash-convertible that profit is.
    diligencePath: Request audited annual and interim statements, segment bridges, and reconciliation from reported profit to cash generation.
    relatedQuestionRefs:
    - QR027
    - QR032
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: ride-hailing-compliance
    missingEvidence: A verified percentage of active drivers holding public licences and vehicles registered under the new ride-hailing rules, ideally by geography and service type.
    whyItMatters: The company can describe intent and policy alignment, but underwriting regulatory and safety risk requires proof that compliance has actually happened at platform scale.
    diligencePath: Ask management and the Department of Land Transport for compliance ratios, audit cadence, insurance coverage, and enforcement history.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: telepharmacy-safety
    missingEvidence: Public audit or incident data on pharmacist response times, medication complaints, adverse events, and delivery-chain controls for LINE MAN telepharmacy orders.
    whyItMatters: Telepharmacy adds higher-liability workflows than food delivery, so certification alone is not enough to prove operational safety.
    diligencePath: Request FDA audit findings, internal incident logs, partner-pharmacy SOPs, and complaint-resolution metrics.
    relatedQuestionRefs:
    - QR003
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: credit-risk
    missingEvidence: Chargeback rates, default curves, fraud losses, funding structure, and complaint metrics for LINE Pay and any lending products distributed through the ecosystem.
    whyItMatters: Fintech is being framed as a major earnings driver, but investors cannot underwrite its risk-adjusted value without visibility into loss formation and compliance controls.
    diligencePath: Request cohort-level underwriting and charge-off data, fraud reporting, and the licensing map for every payment and lending product.
    relatedQuestionRefs:
    - QR014
    - QR018
    - QR032
    relatedTableRefs:
    - TR004
  - type: stale
    severity: minor
    topic: post-subsidy-demand
    missingEvidence: Current non-subsidized repeat-order, basket-size, and same-store-sales cohorts after Half-Half Plus ended.
    whyItMatters: Recent growth can look healthier than it really is if the strongest public data point is a state-supported promotion period.
    diligencePath: Request monthly post-program cohorts by city, order frequency band, merchant size, and subsidy exposure.
    relatedQuestionRefs:
    - QR007
    - QR028
    relatedTableRefs:
    - TR005
