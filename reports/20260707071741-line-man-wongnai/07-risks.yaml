- id: TR002
  title: Operational / Quality / Safety Risk Register
  columns:
  - Risk
  - Trigger / mechanism
  - Public evidence
  - Residual severity
  - Mitigation / diligence ask
  rows:
  - - Subsidy withdrawal and promo fatigue
    - Recent demand growth was amplified by affordability campaigns and a state-supported subsidy program rather than solely by organic repeat behavior.
    - Restaurant Outlook 2025 and Bangkok Post duopoly coverage
    - High
    - Model post-subsidy cohorts, order elasticity, and merchant retention with and without funded promotions.
  - - Merchant churn and weak store economics
    - Restaurant sales fell sharply in Q2 2025 and closures remained high even after recovery began.
    - Restaurant Outlook 2025
    - High
    - Request cohort churn, reactivation, same-store sales, and merchant take-rate satisfaction by city and segment.
  - - Rider supply and fuel-cost shock
    - Rider incomes moved with subsidy-driven order volumes and management says fuel-price spikes directly hurt rider livelihoods.
    - Restaurant Outlook 2025, LY interview, rider scholarship page, and Grab results
    - Medium-High
    - Verify rider retention, insurance, earnings-support budgets, and supply fill-rate by service category.
  - - Telepharmacy service failure
    - Medication delivery, pharmacist response quality, record accuracy, and complaint handling create a higher-liability last-mile workflow than food delivery.
    - LINE MAN telepharmacy page plus FDA telepharmacy sources
    - High
    - Obtain response-time metrics, medication-complaint rates, pharmacist staffing ratios, and escalation procedures.
  - - Multi-service execution stretch
    - Ride, mart, POS, payments, and healthcare all add distinct operational logic that has to work inside one platform brand.
    - About-us page, 2H2023 business update, LY interview, and Google Play listing
    - Medium-High
    - Review service ownership, incident escalation design, shared infrastructure dependencies, and launch sequencing discipline.
  - - Reputation shock at ecosystem scale
    - The platform spans millions of users and hundreds of thousands of merchants and drivers, so any visible trust failure travels fast.
    - Fun Facts 2025, partner page, and Apple App Store scale signals
    - Medium-High
    - Test crisis communications, refund and remediation playbooks, and customer-service response under a severe incident scenario.
  notes: Severity here reflects transmission into service quality, trust, and cost-to-serve rather than just the probability that an operational incident occurs.
