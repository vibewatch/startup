- id: TR004
  title: People / Execution Risk Register
  columns:
  - Execution node
  - Dependency or gap
  - Public evidence
  - Residual severity
  - Mitigation / diligence ask
  rows:
  - - Fintech underwriting and collections
    - Lending is presented as a growth pillar, but public loss, default, and chargeback data are absent.
    - LY interview, BOT license context, and Bangkok Post fintech comments
    - High
    - Request vintage curves, fraud losses, collections policy, funding mix, and consumer-complaint dashboards.
  - - IPO readiness and governance build-out
    - A 2027 target exists, but venue and timing remain open and the domestic IPO plan was already paused once.
    - LY interview, Bangkok Post, and Straits Times
    - High
    - Review audit readiness, internal-control timeline, independent-director plans, and contingency financing.
  - - Management bandwidth across adjacencies
    - The company is scaling AI, payments, health, POS, ride, and non-restaurant merchant solutions at once.
    - About-us page and LY interview
    - High
    - Ask for org charts, owner-level KPIs, capital-allocation discipline, and launch-postmortem examples.
  - - Partner support and compliance staffing
    - Hundreds of thousands of merchants and riders require training, dispute handling, and operational policy enforcement.
    - Partner page, rider scholarship page, and LY interview
    - Medium-High
    - Request support SLAs, compliance headcount, appeal backlog, and rider/merchant incident triage metrics.
  - - Profit-quality visibility
    - Public reporting confirms direction of travel but not yet the audited durability of segment profit or cash conversion.
    - Bangkok Post profit comments and LY interview
    - Medium-High
    - Obtain audited segment EBITDA, cash-flow conversion, and incentive-accounting bridges before underwriting margin durability.
  notes: Residual severity is driven by the possibility that ambitious scope expansion outpaces governance, staffing, or risk-control depth.
