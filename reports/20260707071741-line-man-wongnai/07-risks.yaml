chapter:
  number: 7
  title: Risks
  summary: LMWN’s public file points to a risk stack dominated by promo-sensitive demand, competition-led margin compression, regulated expansion into ride-hailing and telepharmacy, increasing dependence on payments and lending execution, and unresolved capital-market and control uncertainty. The company has credible mitigants—FDA certification, platform-scale distribution, rider-support initiatives, and formal whistleblowing channels—but the residual exposure remains high because the platform now touches transport, healthcare, payments, and millions of daily consumer interactions at once.
sections:
- id: severity-ranked-risk-landscape
  title: Severity-Ranked Risk Landscape
  body: 'LINE MAN Wongnai’s strongest public upside signals—scale, ecosystem breadth, and new regulated adjacencies—also create its most important downside exposures. The public record suggests the highest-residual risks are not one single lawsuit or one single rival, but a stack of linked fragilities: demand quality that still leans on affordability campaigns and government stimulus, competitive intensity that keeps industry incentives high, regulated expansion into ride-hailing and telepharmacy, increasingly material payment and lending execution, and a capital-markets story that is still searching for the right venue and proof of durable profitability. Scale amplifies everything. With millions of users, hundreds of thousands of merchants and riders, and one app spanning food, ride, mart, messaging, payments, and now telepharmacy, any trust, safety, regulatory, or margin mistake travels farther than it would for a single-product startup. The right frame is therefore residual exposure,
    not surface growth.'
