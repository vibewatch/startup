- id: operational-labor-and-safety-risk
  title: Operational, Labor, and Safety Risk
  body: Operationally, the biggest issue is that LMWN’s public proof of traction often sits next to public proof of fragility. Restaurant Outlook 2025 shows demand rebounding, but it also shows how hard the first half was and how dependent the second-half snapback was on the Half-Half Plus program. A 50% closure rate despite renewed openings suggests merchants remain under pressure, which matters because merchant instability feeds assortment, order frequency, and user satisfaction. The rider side is also exposed. Management openly acknowledges that fuel-price spikes hit rider livelihoods, and the subsidy program temporarily lifted rider incomes, meaning supply quality can still be shaped by external affordability conditions rather than only by platform loyalty. Telepharmacy adds another operational edge case because delivery accuracy, pharmacist response quality, and medication handling now sit alongside the ordinary service-level expectations of food, mart, and ride. That is a materially
    harder last-mile operating problem than generic parcel delivery.
