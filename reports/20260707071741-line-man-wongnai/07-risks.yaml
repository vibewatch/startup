tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  columns:
  - Risk
  - Rule / exposure
  - Public evidence
  - Residual severity
  - Mitigation / diligence ask
  rows:
  - - Ride-hailing driver and vehicle compliance
    - ETDA and transport rules still require public-driver licensing, public-hire registration, and sector-wide normalization.
    - ETDA 2026 roadmap plus LINE MAN ride-hailing standards and ride-hailing act pages
    - High
    - Request the percentage of active drivers who are fully licensed, insured, and vehicle-registered by region and service type.
  - - Telepharmacy clinical and process compliance
    - Only licensed pharmacies, licensed pharmacists, FDA-certified applications, and traceable delivery processes are allowed.
    - FDA telepharmacy news, FDA telepharmacy criteria, and LINE MAN telepharmacy page
    - High
    - Review SOPs, pharmacist coverage, adverse-event logs, audit findings, and temperature-controlled or traceability controls.
  - - Privacy, consent, and data-transfer exposure
    - Policies and app-store disclosures show broad identity, financial, location, and usage-data handling across multiple stakeholder groups.
    - LMWN privacy policy and Apple App Store privacy label
    - High
    - Map data retention, processor/controller boundaries, vendor transfers, breach-notification workflows, and consent capture.
  - - Payments and lending regulatory perimeter
    - E-money and consumer-finance activity sits inside BOT oversight and will be more material if fintech becomes a core earnings pillar.
    - BOT License Check, RLP acquisition disclosure, and LY interview
    - Medium-High
    - Verify licensed entities, AML/KYC processes, complaint handling, underwriting controls, and collections governance.
  - - Capital-market and control uncertainty
    - Thailand IPO plans paused while LY and SoftBank control increased and foreign venues are under review.
    - Bangkok Post / Straits Times IPO reporting, SoftBank update, and LY interview
    - High
    - Review minority protections, related-party agreements, board independence, listing readiness, and fallback financing options.
  notes: Residual severity reflects how quickly the issue could impair growth, trust, or valuation even if current management intent is constructive.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most visible public legal and regulatory risk buckets tied to ride-hailing, telepharmacy, privacy, payments, and listing/governance, but they are not a complete Thai legal memo on every product flow or entity.
