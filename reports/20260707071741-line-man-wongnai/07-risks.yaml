- id: regulatory-legal-and-trust-risk
  title: Regulatory, Legal, and Trust Risk
  body: 'Regulation is simultaneously a moat builder and a risk concentrator for LMWN. Telepharmacy is the clearest example: FDA certification makes the service more defensible, but it also binds the company to licensed-pharmacy workflows, pharmacist coverage, traceable medicine delivery, and heightened privacy expectations around patient records. Ride-hailing shows a similar pattern. ETDA and transport authorities are still formalizing what compliant app-based transport looks like, while LINE MAN’s own pages stress legal licences, public-hire registration, and safety standards precisely because those conditions are not yet universally solved at sector scale. Privacy adds another layer. The partner-facing privacy policy and Apple’s app-store disclosures together show a broad identity and data footprint that spans bank details, official documents, location, identifiers, usage data, and financial information. Those disclosures are not evidence of wrongdoing, but they do mean any breach, consent
    failure, or overreach would land in a high-sensitivity context with multiple regulators and stakeholder groups.'
