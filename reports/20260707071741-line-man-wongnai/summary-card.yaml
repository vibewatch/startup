summary:
  headline: >-
    Research more: LINE MAN Wongnai has real Thai scale, credible ecosystem breadth, and signs of improving
    profitability, but the current public record is still too thin on audited financial quality, control-transaction
    terms, and subsidy-normalised cohorts to justify a premium-priced IPO or private entry above roughly THB55 billion.
