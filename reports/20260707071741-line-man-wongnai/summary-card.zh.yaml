summary:
  headline: >-
    继续研究：LINE MAN Wongnai 在泰国确有规模，生态宽度可信，盈利也露出改善迹象；但公开资料仍不足以支撑按高价 IPO 或以高于约 THB55 billion
    的私募价格入场，核心缺口在经审计财务质量、控制权交易条款和剔除补贴后的队列经济。
