  topStrengths:
    - LINE MAN Wongnai 在泰国的规模可见：约 10 million 用户、约 700,000 家合作餐厅、覆盖全国 77 个府，在外卖双寡头格局中有存在感。
    - 产品宽度不止一款配送 app：平台横跨外卖、出行、生鲜杂货、餐厅发现、商户软件，以及相邻支付或 fintech 工作流。
    - 商户软件有战略分量：公开证据显示商业用户超过 70,000，POS 覆盖 55,000 家餐厅，约对应 40% 市场份额。
    - 2025 年盈利和 IPO 可选性延续，说明公司正在走出纯补贴增长叙事；只是盈利质量的细项披露仍缺失。
  topRisks:
    - 公开披露仍不够支撑高价承销：未看到留存的经审计 FY2025-FY2026 财务包、分部利润率、现金流量表，或剔除补贴后的队列披露。
    - 控制权向 LY 和 SoftBank 支持的股东集中，但少数股东权利、优先权和最终控制权交易经济条款，在公开资料中仍只露出一部分。
    - 泰国外卖看起来已进入成熟、促销敏感阶段；如果补贴或政府刺激退潮，持续盈利能力可能弱于 2025 年盈利信号。
    - fintech 和 LINE Pay 扩张把监管、执行和信用风险面拉宽，已超出原本的配送市场。
    - Grab 仍是近双寡头市场里的强对手；ShopeeFood 及其他 commerce 平台低成本回归或从相邻场景进攻，也不能排除。
  unresolvedGaps:
    - 经审计 FY2025-FY2026 独立财务报表，包括分部收入、EBITDA 和现金流。
    - 2025 年控制权交易的完全摊薄股权结构表、优先股堆叠和少数股东权利条款。
    - 队列留存、复购频次、剔除补贴后的订单经济性，以及活跃用户定义。
    - fintech 和 LINE Pay 的单位经济性、信用损失指标，以及监管资本或牌照细节。
    - 任何最终 IPO 所需的招股书级治理、流通股比例和上市地点时间表披露。
