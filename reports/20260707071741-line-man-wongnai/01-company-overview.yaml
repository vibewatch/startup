  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current full board roster, committee structure, independent-director list, and any public governance charter for the LMWN holdco or core Thai operating entities.
    whyItMatters: SoftBank’s control notices prove that governance rights changed materially in 2025, but public sources still do not show who else sits on the board or how oversight is structured.
    diligencePath: Request the latest board deck or corporate profile from management, plus any shareholder-agreement summary that names directors, observers, and committee chairs.
    relatedQuestionRefs:
    - QO006
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metric-definitions
    missingEvidence: A reconciled metric glossary explaining how LINE MAN Wongnai defines users, monthly active users, merchants, partnered restaurants, and businesses using merchant solutions.
    whyItMatters: The overview source set mixes over-10-million users, about-10-million MAUs, 500,000 merchants, 700,000 partnered restaurants, 700,000 restaurants on-platform, and 900,000 Wongnai database entries; without definitions, the figures are not interchangeable.
    diligencePath: Ask management for the KPI dictionary used in board reporting and for a dated operating dashboard that ties each count to one exact definition.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO026
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A disclosed post-2022 valuation, transaction-cap-table schedule, or investor mark showing what the 2025-2026 control transactions imply for enterprise or equity value.
    whyItMatters: The last clearly published valuation is the 2022 unicorn round; IPO venue discussions and SoftBank control steps suggest value creation, but public sources do not provide a clean current mark.
    diligencePath: Request the most recent financing memo, 409A or equivalent valuation work, and any board materials discussing IPO valuation range assumptions.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-reconciliation
    missingEvidence: A current cap table mapping 2022 investors such as GIC, OR, Taiwan Mobile, and BRV to the 2025 holder vehicles named in the SoftBank notices, plus the related control or veto rights.
    whyItMatters: Public sources show both a historical investor syndicate and later holder vehicles such as Commercial Alliance, Apfarm, and MIRAI Fund, but they do not fully reconcile who beneficially owns what after the LY control shift.
    diligencePath: Obtain the latest capitalization table and shareholder agreement summary, including any proxies, drag-along rights, board-designation rights, and reserved matters.
    relatedQuestionRefs:
    - QO011
    - QO012
    - QO013
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: profitability-detail
    missingEvidence: The full 2025 audited income statement and a 2026 run-rate bridge that reconciles SoftBank’s 2024 loss figures to the later claims of first-time profitability.
    whyItMatters: The chapter can verify that profitability was reached in 2025, but not what drove it, how durable it is, or how much came from core delivery versus merchant or payments businesses.
    diligencePath: Request 2024-2026 monthly management accounts segmented by on-demand, merchant solutions, and payments, plus notes on promotional expense and take-rate changes.
    relatedQuestionRefs:
    - QO014
    - QO026
    relatedTableRefs:
    - TO001
