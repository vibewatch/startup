- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Control / economic importance
  - Latest public evidence
  - Diligence ask
  rows:
  - - LY Corporation / SoftBank / LSEA
    - Strategic parent and control acquirer
    - Public notices show the path from minority strategic investor to consolidated control
    - SoftBank notices describe 49.9% immediate voting rights, a 60.9%-61.1% path after add-ons, and consolidation from 2025-09-30
    - Confirm final post-August-2026 cap table, reserved matters, and whether control sits through voting proxies or direct equity alone
  - - GIC
    - 2022 Series B lead investor
    - Blue-chip sovereign-capital validation at the unicorn round
    - Official Series B materials identify GIC as co-lead of the USD265 million round
    - Confirm whether GIC still holds directly or through later holding vehicles
  - - LINE Corporation / LY lineage
    - Strategic distribution and ecosystem partner
    - Anchored both the 2022 funding round and the later control path through LY and LINE SEA vehicles
    - Series B materials name LINE as co-lead; SoftBank notices show LSEA and LY taking control later
    - Reconcile how the original LINE stake rolled into the current LY/LSEA ownership chain
  - - BRV Capital Management / Commercial Alliance
    - Early merger financier and still-visible holder family
    - BRV funded the 2020 merger, while Commercial Alliance appears as a 22.2% 2025 holder vehicle in SoftBank's notice
    - About-us cites BRV in the 2020 combination; SoftBank later lists Commercial Alliance without fully mapping legacy ownership
    - Request a cap-table bridge linking 2020 and 2025 holder entities
  - - OR (PTT Oil and Retail Business) and other 2022 syndicate investors
    - Minority financial investors from the 2022 unicorn round
    - Publicly important because their continued presence is often assumed in market gossip
    - Official 2022 materials list OR, Bualuang Ventures, and Taiwan Mobile as participants, but later control notices do not present OR as the buyer taking control
    - Confirm whether OR still owns shares, through what vehicle, and with what rights
  - - Apfarm / MIRAI Fund and other minority vehicles
    - Transaction counterparties in the 2025 control shift
    - Important because their share sales, rights changes, and proxy arrangements are what enabled LY’s substantial control
    - SoftBank notices explicitly name Apfarm and MIRAI Fund in the control package
    - Identify beneficial owners, remaining stakes, and any continuing governance rights after the LY control shift
  notes: This table deliberately mixes historical investors and later holding vehicles because the public record never fully reconciles them. Qualitative wording is used wherever public sources do not disclose exact current percentage ownership.
  enumerationScope:
    coverage: partial
    basis: Covers the historically named funding investors plus the holder vehicles explicitly named in SoftBank's 2025-2026 control notices; exact beneficial ownership and current stake percentages remain private for parts of the cap table.
