- calloutType: strength
  title: The strongest public evidence is on ecosystem breadth and strategic durability, not on a single flashy metric
  body: 'The merged company now has supportable public evidence for a rare combination: national logistics reach, merchant software, payments, and a large user and merchant graph that strategic parents still want to control more tightly. The shift from 2024 losses in SoftBank’s disclosed historicals to claimed 2025 profitability also suggests the business may finally have crossed an important maturity threshold before any IPO.'
