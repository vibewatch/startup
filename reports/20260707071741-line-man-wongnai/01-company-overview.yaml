- calloutType: risk
  title: Public disclosure still lags the company’s strategic importance
  body: 'The core overview risks are not that the company lacks scale or capital, but that the market still cannot see a fully reconciled cap table, current valuation, board structure, or one clean dictionary for users, merchants, and restaurants. Even the OR-versus-LY ownership confusion in the prompt is a symptom of that opacity: the retained source set can resolve the control direction, but not the full rights and holder map underneath it.'
