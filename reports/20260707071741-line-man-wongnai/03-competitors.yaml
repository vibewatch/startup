- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public price / fee signal
  - Merchant monetization signal
  - Included capabilities
  - Caveat / unknown
  - Competitive implication
  rows:
  - - LINE MAN Wongnai
    - Delivery fee starts at 0 baht; up to 60% discounts in app-store text
    - Official retained pages do not show standard Thai commission; partner page adds ads, finance, and POS
    - Food, ride, mart, messenger, POS, merchant app
    - Realized take rate and subscription mechanics are private
    - Competes on local density plus workflow, not just delivery fees
  - - Grab
    - Distance-based delivery fee; pickup, Dine Out Deals, and GrabUnlimited are public
    - No upfront signup fee on merchant page; standard commission not posted in retained official set
    - Food, mobility, payments, merchant app, lending, ads
    - Need actual contract schedules and rebate mechanics
