  - - Foodpanda
    - Daily deals, pickup, pandapro, and pandago remain visible on app surfaces
    - Thailand consumer operations ceased 23 May 2025
    - Food, groceries, parcel, membership
    - App-store geography text lags exit notice
    - Little direct Thai threat unless users or assets reactivate elsewhere
  - - ShopeeFood / Shopee
    - Promo-heavy commerce app with ShopeePay and credit products
    - No retained public Thai commission disclosure
    - Food adjacency, wallet, pay-later, logistics
    - Standalone Thai page expired and scale is undisclosed
    - Can re-accelerate cheaply through e-commerce traffic
