- id: TP001
  title: Competitor profile table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: Thai food-delivery peers, substitutes, and likely entrants referenced in retained 2024-2026 public sources.
  columns:
  - Competitor
  - Category
