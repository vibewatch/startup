  - Limitation
  rows:
  - - LINE MAN Wongnai
    - Local on-demand super-app + merchant OS
    - 10M+ monthly users; 700K+ merchants/restaurants
    - Thai mass-market consumers and SME restaurants
    - Deep Thai restaurant density, LINE distribution, Wongnai/FoodStory POS
    - Private financials and standard fee cards undisclosed
  - - Grab
    - Regional super-app
    - $15.74B market cap; $3.55B TTM revenue; Q1 2026 deliveries GMV $3.9B
    - Mass-market consumers, merchants, drivers
    - Ride + food + pay + merchant bundle with public capital
    - Thailand leadership does not equal local exclusivity
  - - Foodpanda / Delivery Hero
    - Regional delivery + quick commerce
    - Official Thailand exit on 23 May 2025; broader Asian brand remains live
    - Price-sensitive delivery and grocery users
    - pandamart, pandapro, pandago, pickup
    - Thailand consumer operations exited and app surfaces lag official status
  - - ShopeeFood
    - E-commerce-adjacent delivery
    - ~10% Thai share in 2025 by Bangkok Post
    - Promo-led Shopee shoppers and merchants
    - ShopeePay, SPayLater, logistics bundle
    - Thai delivery scale and merchant count not publicly disclosed
  - - Robinhood
    - Local lifestyle app / restaurant-friendly marketplace
    - Official 2026 site live; 2024 cessation report and THB5.56B losses complicate read-through
    - SMEs and local-brand restaurants
    - No-GP merchant pitch and local-brand positioning
    - Current operator scale and ownership unresolved
  - - StoreHub
    - Neutral POS / merchant software substitute
    - 18,000+ businesses across Southeast Asia
    - Multi-branch restaurants and retailers
    - Independent workflow layer and integrations
    - No consumer-demand marketplace
  - - Restaurant self-delivery / pickup
    - Status-quo substitute
    - Still meaningful beyond aggregators in regional evidence
    - Chains and merchants with their own traffic
    - Lower commission burden and direct customer relationship
    - Weaker discovery and rider density
  - - Offshore consolidator / likely entrant
    - Potential entrant
    - Reported prior interest in Foodpanda assets from large regional players
    - Large chains and metro users if entry occurs
    - External capital and operating know-how
    - No active Thailand operating surface in retained sources
  notes: 'Sources: official company pages, app-store pages, and independent market reporting retained on 2026-07-07; rows are intentionally partial where current operator metrics stay private.'
