- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat / risk factor
  - Evidence today
  - Threat vector
  - Severity
  - Diligence ask
  rows:
  - - Local restaurant density
    - LINE MAN claims 700K+ merchants/restaurants and 10M+ monthly users
    - Rivals can still buy share with promos or acquisitions
    - Medium
    - Request active-restaurants, transacting-user, and repeat-order cohorts by city
  - - Super-app adjacency
    - Grab bundles ride, pay, groceries, and public capital; Shopee bundles food with commerce-fintech
    - Cross-category traffic reduces standalone delivery CAC
    - High
    - Compare cross-sell conversion and paid-marketing share of orders
  - - Merchant workflow lock-in
    - LINE MAN and Grab pitch merchant software; StoreHub offers a neutral POS fallback
    - If merchants export ops to neutral systems, demand share matters less
    - High
    - Review POS penetration, loan attach rate, and merchant ad spend retention
  - - Promotion and subsidy dependence
    - 2025 growth was tied to affordability pushes and government subsidy support
    - Mature demand can flatten once subsidies or promos ease
    - High
    - Stress-test order retention after promotions are removed
  - - Capital intensity
    - Major players lost THB20.7B over three years while only Grab was reported profitable
    - Private players may face funding constraints relative to Grab’s public balance sheet
    - High
    - Request burn, contribution margin, and funding-runway data
  - - Entrant / consolidation optionality
    - Globe cited prior Grab and Meituan interest in Foodpanda assets
    - Asset deals or new entrants can reset shares even after duopoly narratives
    - Medium
    - Monitor M&A chatter, licensing, and large-chain exclusivity deals
  notes: Severity reflects competitive durability risk to LINE MAN Wongnai rather than a credit or legal rating.
