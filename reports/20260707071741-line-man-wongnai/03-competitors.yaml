- id: moat-durability-and-adverse-competitive-evidence
  title: Moat durability and adverse competitive evidence
  body: 'LINE MAN’s competitive position is real, but the adverse evidence argues against calling it unassailable. Bangkok Post’s share data supports a 2025 duopoly view, yet the same reporting links growth to affordability pushes, heavy competition, and government subsidy support rather than to structurally effortless demand. Separate Bangkok Post reporting says the four major Thai players lost 20.7 billion baht over the prior three years, while Robinhood’s economics and Foodpanda’s exit show how punishing the category remains for subscale challengers. The moat therefore looks durable mainly where local density intersects with merchant workflow. It looks less durable where rivals can substitute with cross-category traffic, public capital, or neutral POS control. Grab is best positioned on that axis today because it combines public funding access with deliveries, mobility, and merchant tooling. ShopeeFood remains a live adjacency because it can ride the Shopee app’s wallet and credit surfaces
    even if current Thai delivery metrics stay opaque. The remaining open risk is external optionality: Globe’s reporting that Grab and Meituan had previously looked at Foodpanda assets is a reminder that a concentrated market can still attract strategic entrants or consolidation attempts when assets become available.'
