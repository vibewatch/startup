- id: merchant-workflow-multi-homing-and-switching-costs
  title: Merchant workflow, multi-homing, and switching costs
  body: 'Merchant behavior in Thailand looks more multi-homed than the duopoly headline implies. On the consumer side, major apps make secondary usage cheap: LINE MAN pushes discounts and low starting delivery fees, Grab promotes pickup, scheduled orders, and wallet-linked checkout, and foodpanda’s surviving app-store surfaces still advertise pickup and membership savings. That means downloading a second app is easy. The harder switching question sits on the merchant side. Both LINE MAN and Grab pitch workflow tools beyond dispatch, including menu control, merchant operations, ads, and financing; LINE MAN also ties the marketplace to Wongnai POS and FoodStory POS. Once a merchant’s order history, promotions, financing, and branch operations sit inside one stack, the marketplace relationship becomes stickier than a simple listing slot. StoreHub matters because it offers the opposite strategic value proposition: keep workflow independent and let delivery platforms become interchangeable demand
    channels. That is why the battle is not merely over user downloads or promotional burn. It is over whether merchants anchor their business systems inside an aggregator-controlled stack or preserve bargaining power with neutral software and self-delivery options.'
