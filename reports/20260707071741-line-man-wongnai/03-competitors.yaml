    - No-GP pitch to restaurant partners
    - Merchant economics are favorable to restaurants, but monetization model is unclear
    - Food, ride, travel, parcel, loans
    - Current operating scale unresolved after 2024 cessation report
    - Merchant-friendly wedge, but durability is unproven
  - - StoreHub
    - Software pricing not disclosed on retained landing page
    - Monetizes as POS software rather than delivery commission
    - POS, integrations, multi-branch operations
    - No consumer discovery layer
    - Raises merchant bargaining power versus aggregators
