- id: durability-repeat-use-and-friction
  title: Durability, Repeat-use Proxies, and Friction
  body: |-
    The public record supports habit formation better than it supports true retention. Large order and search counts, government-program frequency lifts, and category-level survey data all point to a Thai consumer base that uses delivery repeatedly rather than sporadically. That is directionally favorable for LINE MAN because it suggests the underlying category has natural repeat behavior. But none of those proxies are substitutes for cohort retention. Public sources do not disclose service-level MAU or DAU, repeat-order curves by cohort, or merchant renewal rates for Merchant App and POS customers.

    Customer-satisfaction evidence is also mixed rather than uniformly strong. Apple’s Thai App Store page showed a very high 4.9 score with 825,000 ratings at access time, but Google Play showed a lower 4.0 score with 353,000 reviews and visible complaints about poor localization, delayed or canceled orders, coupon friction, and ride no-shows. JustUseApp’s low NLP safety score adds more adverse color, even if it is a low-reputation aggregator. The practical conclusion is that LINE MAN clearly has enough utility to sustain large volumes, but durability remains under-evidenced: public sources show reach and usage intensity, yet still stop short of disclosing churn, renewal, GRR, NRR, or support-resolution KPIs that would prove long-term quality.
