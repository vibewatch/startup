  title: Customers
  summary: 'Public customer proof for LINE MAN Wongnai is broad across both demand and merchant sides: official sources show 10M-plus monthly users, 700K partnered restaurants, 700K-plus active merchants, 55K-plus restaurants on the POS stack, and adjacent-vertical expansion through JERA Cloud’s 1,700 outlets. Named proof exists for MART, hawker-vendor digitization, beauty and dental software customers, and brand-campaign monetization, but durability remains under-disclosed because public sources still omit cohort retention, merchant renewals, and concentration schedules. The result is a strong adoption story with only moderate public proof of long-term customer quality.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: |-
    LINE MAN Wongnai serves a two-sided ecosystem rather than a single customer base. On the demand side, the company publicly claims more than 10 million monthly users and 700,000 partnered restaurants, while Wongnai still markets a large legacy discovery audience and restaurant database of its own. On the supply side, official materials separately market 700,000-plus active merchants, 55,000-plus restaurants on the POS stack, and a growing set of brands using marketing solutions. That distinction matters because buyer, user, and payer roles vary sharply across segments: a delivery consumer is usually all three; a restaurant owner buys software that branch managers and staff actually use; a brand buys advertising or coupon distribution that end-users redeem; and public subsidy programs can change who effectively pays for repeat orders.

    Geography and channel breadth are real strengths. Official surfaces say food delivery and MART have national coverage across all 77 provinces, while the company is simultaneously deepening branch-management, QR, POS, and telepharmacy workflows for restaurants and adjacent merchants. The customer map is therefore broad across consumer delivery, merchant operations, brand campaigns, and adjacent service categories such as beauty, wellness, and healthcare access. The main segmentation gap is not reach but denominator quality: public sources still do not disclose how many of the claimed users are active by service, how many merchants transact regularly, or how much spend sits with a small number of restaurants, brands, or channels.
