  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consumer-retention-cohorts
    missingEvidence: Service-level MAU, DAU, and 30/90/180-day retention cohorts for food, MART, ride, and messenger.
    whyItMatters: Large user and order totals do not prove durability if activity is concentrated in a subset of users or boosted mainly by promotions.
    diligencePath: Request cohort dashboards or billing/event tables split by service, geography, and acquisition cohort.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: merchant-retention-and-nrr
    missingEvidence: Merchant App and POS logo-retention, GRR, NRR, churn, and renewal cadence by merchant tier and product.
    whyItMatters: The merchant-software expansion thesis is hard to value without knowing whether restaurants renew and deepen usage after onboarding.
    diligencePath: Request cohort retention tables, renewal schedules, and revenue bridges for Merchant App, Wongnai POS, FoodStory POS, and JERA Cloud.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-concentration
    missingEvidence: Top-10 merchant, brand, program, and LINE-channel concentration by revenue, GMV, and traffic share.
    whyItMatters: A broad public surface can still hide dependence on a few channels, subsidy programs, or large accounts that weaken durability.
    diligencePath: Request concentration schedules, traffic-source mix, and sales concentration by customer type from management and finance systems.
    relatedQuestionRefs:
    - QU029
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-roster
    missingEvidence: An exhaustive public or management-provided roster of live restaurant-software customers by segment, tier, and deployment status.
    whyItMatters: Current named proof shows selected examples, but not enough coverage to assess whether merchant concentration is broad or dependent on a narrow set of reference accounts.
    diligencePath: Request a current customer roster with chain counts, branch counts, product modules, and revenue bands; reconcile it against the curated public proof set.
    relatedQuestionRefs:
    - QU011
    - QU030
    relatedTableRefs:
    - TU003
