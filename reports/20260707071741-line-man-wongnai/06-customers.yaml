- id: expansion-concentration-and-channel-friction
  title: Expansion, Concentration, and Channel Friction
  body: |-
    The most credible expansion story is not “more food orders” alone; it is the company’s ability to move from traffic to higher-value merchant relationships. Public evidence shows a ladder from consumer delivery into Merchant App, ads and promos, POS software, QR and payment workflows, and then adjacent software via JERA Cloud. That is classic land-and-expand. FoodStory strengthens chain and premium restaurant reach, Café Amazon provides a live digital-store example of Order & Pay plus Pick & Go moving into store operations, JERA extends the stack into beauty and wellness, and campaign partners show another monetization layer around branded demand generation.

    The flip side is concentration and channel dependence. External market reporting consistently describes Thailand as a top-two market dominated by Grab and LINE MAN, even if exact share estimates differ by methodology. Recent growth also looks intertwined with subsidy programs and promotional intensity, suggesting some acquisition and repeat behavior is policy- or discount-assisted rather than purely organic. In addition, TechCrunch highlighted dependence on LINE distribution, while public sources still do not disclose top-merchant, top-brand, or top-channel concentration. The company is also investing in rider and driver welfare, which can reduce supply-side churn but is not the same thing as end-customer durability. Investors therefore have real proof of breadth and expansion surfaces, but not enough public data to rule out hidden dependence on a few programs, channels, or large merchant cohorts.
