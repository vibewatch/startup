- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / friction
  - Impact
  - Diligence path
  rows:
  - - LINE ecosystem distribution
    - Traffic and payments may depend heavily on LINE channel access and integration priorities
    - Low-CAC growth can look stronger than standalone brand pull
    - Request traffic, conversion, and payment-share split sourced from LINE surfaces
  - - Government subsidy programs
    - Customer acquisition and repeat rate can spike during subsidy windows and normalize after
    - Program lifts may overstate durable baseline retention
    - Compare cohorts before, during, and after Half-Half Plus
  - - Top-two market structure
    - Merchant and consumer multi-homing plus promo wars can cap profitability and loyalty
    - Scale is real, but market leadership may still be promotion-intensive
    - Provide cohort behavior by discount depth and merchant commission tier
  - - Merchant software expansion via JERA
    - Adjacent-vertical upside is visible, but cross-sell economics remain unproven
    - Could expand TAM while distracting focus if integration underdelivers
    - Request conversion funnel from JERA outlets into payments or on-demand services
  - - Brand and campaign monetization
    - A few large advertisers could dominate non-take-rate revenue
    - Revenue quality could be cyclical and concentrated
    - Provide top-10 brand spend, renewal, and vertical mix
  - - Public-sector site deployments
    - Municipal or program channels add proof but can be slow to replicate
    - Scaling may depend on external approvals and operating partners
    - Request live-site count, GMV, and retention of participating merchants
  notes: This table focuses on where the land-and-expand thesis overlaps with hidden dependence on channels, partners, or subsidy-assisted demand.
