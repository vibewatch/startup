- id: adoption-and-named-proof
  title: Adoption Trajectory and Named Customer Proof
  body: |-
    Public adoption proof is strongest where LINE MAN Wongnai exposes concrete transactional or deployment metrics rather than generic brand claims. The Half-Half Plus reporting is the clearest recent example: LINE MAN said 65% of participating restaurants chose its platform, 63% of program sales flowed through it, more than 8 million delivery orders were placed in three weeks, and both new-customer counts and order frequency rose materially. Thai Help Thai Plus added another consumer-side signal, reporting 1.2 million users in the first two weeks and average spend of THB450 per person. Fun Facts 2025 then showed order and search intensity at mass scale, with eight million-plus orders for one dish, 6.5 million matcha orders, and 65 million rice-and-curry orders.

    Named customer proof is more uneven but still meaningful. EVEANDBOY adds a visible MART deployment with 69 branches and 100,000-plus SKUs, while Lotus’s go fresh extends that merchant proof to more than 1,400 branches across all 77 provinces. Hawker Center Lumpini shows a municipal small-merchant deployment with more than 100 vendors and QR/payment infrastructure. Café Amazon adds a direct software-deployment example through Thailand’s first Digital Store using Wongnai POS Order & Pay and Pick & Go, with management saying LINE MAN-linked delivery orders rose more than 35% year over year. JERA Cloud adds multi-branch beauty and dental customers such as Aura Bangkok Clinic and Teeth Talk. Official marketing pages also name brands such as Lotus’s, GSB, Knorr, Coke, and MALI, showing that monetization extends beyond delivery commissions into campaigns and merchant-growth tools. What remains thin is an exhaustive named roster for restaurant software customers: public references show market relevance and some chain adjacency, but not a committee-grade list of live POS clients by tier.
