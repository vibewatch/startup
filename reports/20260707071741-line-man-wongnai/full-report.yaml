  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Profitability quality
        - Audited FY2025 or 1H2026 results show profit was one-off, subsidy-led, or not cash generative.
        - The premium case depends on the first profitable year being durable.
        - Move toward bear-case valuation and avoid any premium entry.
      - - Control overhang
        - Offering documents show weak minority rights or excessively tight float under LY control.
        - Governance concentration would reduce realised upside even if operations improve.
        - Demand a lower entry price or pass.
      - - Post-subsidy cohorts
        - Order frequency, retention, or AOV fade materially after Half-Half Plus.
        - Recent operating momentum would be revealed as stimulus-assisted rather than structural.
        - Reset the model closer to the unicorn floor or below.
      - - Merchant / fintech mix
        - Merchant DX and fintech fail to contribute meaningful gross profit or EBITDA.
        - The business would deserve more pure-delivery-like multiples.
        - Use lower-end comp range and tighten price discipline.
      - - IPO venue and timing
        - IPO slips beyond 2027 or launches into another weak Thai or regional issuance window.
        - Exit timing and liquidity support would deteriorate while private-mark uncertainty persists.
        - Hold, track, or demand secondary discount before engaging.
    notes: Every trigger is monitorable and tied to the valuation bridge rather than to company quality in the abstract.
    claimRefs:
      - CV011
