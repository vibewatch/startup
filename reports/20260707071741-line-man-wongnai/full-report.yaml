      - number: '4.3'
        title: Cost Structure, Margin Drivers, and GTM Efficiency
        blocks:
          - type: paragraph
            body: >-
              Public evidence implies a business whose margin path is improving but still exposed to heavy marketplace
              frictions. Third-party reporting suggests losses narrowed sharply at the Thai operating-entity level from
              2022 to 2023, and partner reporting says the company reached profitability in 2025 or at least expected
              break-even that year. Yet the same public corpus shows why investors should not assume software-like
              margins everywhere. Consumer pricing remains promotion-heavy, merchant acquisition clearly depends on
              discounts and campaign participation, and the 2026 Grab benchmark shows why this matters: a listed
              regional peer still spent incentives equal to 10.5% of on-demand GMV even while producing deliveries
              EBITDA of only 2.3% of GMV. That is a useful lens for LINE MAN Wongnai because its strongest GTM proof
              comes from volume-driving programs such as Half-Half Plus, ad products, coupons, product sampling, and
              merchant announcements, all of which can be effective but costly. Merchant software likely carries the
              cleanest margin profile—LY explicitly said that business is highly profitable—but public sources do not
              reveal how large that margin pool is relative to the far bigger food-delivery engine. Cost pressure in the
              restaurant ecosystem also remains real, with 50% annual closure rates and continued operator sensitivity
              to fees, labor, and ingredient inflation.
