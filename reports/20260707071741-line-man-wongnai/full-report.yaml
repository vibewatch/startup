      - number: '2.2'
        title: Multiple Sizing Lenses, Contradictory Estimates, and Constrained TAM Logic
        blocks:
          - type: paragraph
            body: >
              Public market-size evidence for Thai food delivery is directionally consistent on scale but inconsistent
              on methodology, unit, and timing. LINE MAN Wongnai's 2H2023 business update cited KResearch's expectation
              that the 2023 food delivery market would decline 0.8-6.5% to THB 81-86 billion. Bangkok Post's June 2026
              duopoly report, citing Momentum Works, said Thai food-delivery GMV rose from US$4.2 billion in 2024 to
              US$5.1 billion in 2025, while the same article referenced e-Conomy SEA 2025 language pointing to about
              US$5.0 billion in 2025. Iconic Research's 2025 synthesis placed the market at roughly THB 100 billion by
              2025, and Yod separately argued that the category still had room to reach THB 120-150 billion because it
              was only 15% penetrated versus Thailand's THB 800-900 billion total food market.


              These figures should not be normalized into a fake consensus. Some numbers describe annual GMV in U.S.
              dollars, some describe a baht-denominated “market value” view, some are near-term observed size, and some
              are management-style upside lenses. The correct diligence move is therefore a constrained TAM stack: total
              Thai food spend sets the outer bound, observed online food-delivery GMV anchors the current served market,
              and merchant software plus payments provide adjacency upside that can expand monetization without assuming
              that delivery itself captures all restaurant spend. The absence of disclosed take rate, active-order
              frequency, or payments TPV means SOM cannot be cleanly reduced to a single baht figure from public
              evidence alone.
            claimRefs:
