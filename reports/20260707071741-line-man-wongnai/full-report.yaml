  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Topic
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market position
        - A duopoly market with close to 90% share split between Grab and Line MAN supports durable relevance.
        - A mature Thai market may still need promotions and ecosystem subsidies to grow.
        - Post-subsidy growth and retention data that stays healthy in 2026.
      - - Merchant software
        - POS, FoodStory, and JERA Cloud suggest a higher-quality software layer than a pure delivery marketplace.
        - Public evidence still lacks segment revenue, margin, and churn disclosure for merchant DX.
        - Segment financials showing recurring SaaS-like contribution margins.
      - - Profitability inflection
        - First profitability in 2025 suggests the model is crossing an important threshold.
        - The public record does not yet show how much of that profit came from subsidies, mix, or one-offs.
        - Audited FY2025 and 1H2026 statements plus cohort economics.
      - - Control support
        - LY and SoftBank backing can strengthen capital access, payments integration, and IPO preparation.
        - Expected 60.9% voting control can compress float appeal and minority influence.
        - Minority-protection terms and governance package in offering documents.
      - - Valuation upside
        - A broader ecosystem can justify a premium to low-multiple delivery names.
        - A premium is hard to underwrite before merchant and fintech earnings quality are disclosed.
        - Proof that software and fintech drive meaningful share of gross profit and EBITDA.
    notes: >-
      The table separates company quality from price support; the strongest positives are strategic and operating, while
