  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai serves a two-sided ecosystem rather than a single customer base. On the demand side, the
              company publicly claims more than 10 million monthly users and 700,000 partnered restaurants, while
              Wongnai still markets a large legacy discovery audience and restaurant database of its own. On the supply
              side, official materials separately market 700,000-plus active merchants, 55,000-plus restaurants on the
              POS stack, and a growing set of brands using marketing solutions. That distinction matters because buyer,
              user, and payer roles vary sharply across segments: a delivery consumer is usually all three; a restaurant
              owner buys software that branch managers and staff actually use; a brand buys advertising or coupon
              distribution that end-users redeem; and public subsidy programs can change who effectively pays for repeat
              orders.


              Geography and channel breadth are real strengths. Official surfaces say food delivery and MART have
              national coverage across all 77 provinces, while the company is simultaneously deepening
              branch-management, QR, POS, and telepharmacy workflows for restaurants and adjacent merchants. The
              customer map is therefore broad across consumer delivery, merchant operations, brand campaigns, and
              adjacent service categories such as beauty, wellness, and healthcare access. The main segmentation gap is
              not reach but denominator quality: public sources still do not disclose how many of the claimed users are
              active by service, how many merchants transact regularly, or how much spend sits with a small number of
              restaurants, brands, or channels.
