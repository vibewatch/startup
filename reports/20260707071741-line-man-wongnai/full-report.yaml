companyProfile:
  summary: >-
    LINE MAN Wongnai is a Bangkok-based Thai local-commerce platform created by the 2020 merger of Wongnai’s
    restaurant-discovery network and LINE MAN’s on-demand logistics services. The company now operates a broader
    ecosystem across food delivery, ride-hailing, grocery and messenger, merchant POS and back-office software,
    restaurant discovery, and adjacent payments or fintech products. Public evidence supports real national scale and
    improving economics, but issuer disclosure remains well short of what public-market investors would want before
    paying a premium IPO price.
