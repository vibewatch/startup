  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, merger lineage, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai is best understood as a merged Thai platform rather than a single-origin startup. The
              Wongnai side of the story starts in July 2010, when five Chulalongkorn engineering classmates — led by
              future CEO Yod Chinsupakul — launched a restaurant-discovery product inspired by Yelp. The LINE MAN side
              began in 2016 as an in-house Thai on-demand service under LINE Thailand. In 2020 the two businesses
              combined after a USD110 million BRV-backed transaction, creating the merged company that now frames itself
              around the broader mission to “Digitalize Thailand.” Public company and partner materials now describe the
              business through three connected pillars: on-demand services, merchant digital solutions, and pay or
              financial services. The company’s public operating headquarters is now at One Bangkok, while the legal
              footprint spans both Thai operating entities and a Singapore holdco. That combination of founder-led local
              product DNA, the LINE ecosystem, and a later Singapore-centered corporate structure is the identity
              foundation that later chapters should treat as canonical.
