        title: Funding history, public financials, and scale metrics
        blocks:
          - type: paragraph
            body: >-
              The last unambiguously disclosed valuation event remains the 2022 Series B. Official materials say the
              company raised USD265 million at a valuation above USD1 billion, while TechCrunch later summarized total
              capital raised at more than USD372 million — a figure directionally consistent with the public USD110
              million 2020 merger financing plus the Series B, but still imperfect because older Wongnai funding amounts
              were not fully disclosed. The more interesting shift since then is that public financial visibility
              improved not through a company annual report but through SoftBank’s control notices and later partner or
              press interviews. SoftBank’s September 2025 filing disclosed 2024 consolidated revenue of JPY71.3 billion
              and a net loss, while 2026 Bangkok Post and LY materials both said profitability was reached for the first
              time in 2025. Scale claims are large but definition-sensitive: retained sources support roughly or above
              10 million users, 500,000 merchants, 700,000 partnered restaurants, 250,000 riders, 70,000 businesses
              using merchant software, and 1,300 employees, but those figures are not all measuring the same population.
              The right reading is therefore “large, multi-sided, and newly profitable,” not “one perfectly reconciled
              KPI set.”
