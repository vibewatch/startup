      - number: '8.3'
        title: Public comp screen and price discipline
        blocks:
          - type: paragraph
            body: >-
              Because the company remains private and its latest detailed financial disclosure is still thin, the most
              useful public-market exercise is a boundary-setting comp screen rather than a fake-precision target price.
              The selected basket deliberately mixes regional delivery and super-app exposure with merchant technology:
              Grab as the closest Southeast Asian listed analog, Delivery Hero as a lower-multiple global delivery
              benchmark, DoorDash as the highest-quality public delivery comp, and Toast as a merchant-software and
              payments reference. Toast’s own investor-relations overview describes a global platform for restaurant and
              retail businesses spanning software, payments, fintech, and hardware, which makes it a useful
              merchant-tech reference rather than a pure delivery comp. Using July 2026 market-cap and revenue
              snapshots, the basket spans roughly 1.0x revenue for Delivery Hero, 2.7x for Toast, 4.4x for Grab, and
              5.6x for DoorDash. Multiples.vc further places Grab at about 3.1x EV/revenue with positive EBITDA, which
              is a cleaner regional benchmark than pure headline market cap.


              That screen is powerful when combined with the limited disclosed LINE MAN Wongnai numbers. If the last
              clean unicorn anchor was about THB37 billion and 2023 revenue was THB18 billion, the 2022 mark already
              equates to about 2.1x revenue. A THB55 billion entry price would be about 3.1x, and THB60 billion about
              3.3x, which starts to overlap with a profitable regional platform like Grab or a merchant-tech platform
              like Toast. A THB74 billion headline, roughly a US$2 billion valuation, would push the multiple above 4x
              on the disclosed 2023 base and therefore requires much stronger evidence that 2025 to 2026 earnings
              quality has stepped up materially. That is why the right posture is price discipline: pay for what public
              evidence supports, not for the company’s strongest conceivable software-and-fintech future before the
              numbers are public.
            claimRefs:
