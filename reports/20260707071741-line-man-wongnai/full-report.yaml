            body: >-
              Scale is easier to verify publicly than economics. Across official and partner sources, LINE MAN Wongnai
              consistently points to a user base above 10 million, a merchant base above 500,000, a restaurant footprint
              of 700,000-plus on LINE MAN and 900,000-plus in Wongnai’s broader database, and a rider network that
              ranges from more than 100,000 to 250,000 depending on the source and definition. Public demand proxies are
              also unusually concrete for a private company: the 2023 update cited GMV growth of 33%, Fun Facts 2025
              cited 65 million rice-and-curry orders and 8 million servings of the top dish, and the Half-Half Plus
              program produced 8 million orders in just three weeks while lifting order frequency 30% and average basket
              size 15%. Merchant software gives another demand read-through: combined POS products reportedly handled
              180 billion baht of GMV and 636 million orders. The problem is that these are activity metrics, not gross
              profit metrics. Public investors can see scale, frequency, and sales velocity, but not the take rate,
              refunds, incentives, or services burden that would translate this activity into a dependable contribution
              margin.
