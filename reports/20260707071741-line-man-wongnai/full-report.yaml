      - number: '7.4'
        title: Partner, Dependency, Competition, and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >-
              LMWN’s ecosystem can look self-reinforcing, but it is still dependent on actors it does not fully control.
              The company is now more tightly embedded in the LINE and LY ecosystem, while SoftBank’s disclosure shows
              ownership concentration increasing further. That can help distribution and financing, yet it can also
              reduce strategic independence and raise minority-governance questions if interests diverge around listing
              venue, capital structure, or related-party priorities. The competitive backdrop is equally tough. Public
              sources agree that Thailand is now effectively a two-leader market, but they also agree that the category
              remains promo-heavy and structurally difficult to monetize. Grab’s 2026 results show the benchmark rival
              still spending aggressively on incentives while scaling financial services faster than most local players.
              LMWN’s answer is to deepen payments, merchant software, and lending. That may be strategically right, but
              it increases model risk because the future thesis depends on businesses whose regulatory and loss profiles
