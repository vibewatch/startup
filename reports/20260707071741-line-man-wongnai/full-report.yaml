      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Thailand still has structural reasons to support growth in platform-mediated commerce. Trade.gov says
              mobile devices account for more than 80% of online sales in Thailand, mobile wallets account for 23% of
              all transactions, and mobile-wallet adoption is expected to reach 63% in 2025. DataReportal's 2024
              Thailand digital report shows 63.21 million internet users, 97.81 million mobile connections, and 53.9%
              urbanization, all of which reinforce a large mobile-first addressable population. Bank of Thailand data
              adds a payments backbone that can reduce checkout friction: PromptPay transaction value reached THB 4.46
              trillion in April 2026 alone, and official BOT guidance continues to frame digital payments as a national
              anti-cash push. On the company side, LINE MAN Wongnai's 2023 and 2025 updates show that provincial
              expansion, mart/ride adjacencies, and payments integration are explicit growth levers rather than side
              experiments.


              The growth case is real, but so are the constraints. Bangkok Post's 2024 “market maturing” article noted
              that the industry's major players had accumulated THB 20.7 billion of losses over the prior three years
              even as revenue reached THB 110 billion, and its 2026 duopoly article quoted Kasikorn Research Center
              saying the market would show little-to-no growth without promotional pressure or government support.
              Merchant adoption is also constrained by brutal underlying restaurant economics: LINE MAN Wongnai says 50%
              of new restaurants close within one year and 65% within three years, which creates demand for POS and
              analytics but also caps merchants' willingness to pay. The company's own 2025 outlook reinforces that
              maturity is uneven: provincial markets recovered faster than Bangkok, while core city hotspots stayed
              soft. In other words, the market is no longer proving existence; it is proving whether higher-frequency
              habits and deeper merchant monetization can offset promotions, competition, and fragile unit economics.
            claimRefs:
