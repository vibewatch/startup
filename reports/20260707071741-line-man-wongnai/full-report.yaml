      - number: '1.2'
        title: Leadership, governance surfaces, and the LY / SoftBank control shift
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is clear at the top but incomplete below it. Yod Chinsupakul is consistently
              named as CEO, and In Young Chung appears as CFO in the fundraising and Rabbit LINE Pay transaction record.
              Founder continuity is also visible in Ekaluck Viriyakovithya’s reappearance as a merchant-solutions
              executive years after he was introduced as one of Wongnai’s original co-founders. What public materials do
              not provide is a clean board roster or committee structure for the holdco now that control has shifted.
              That omission matters because the most material governance event in this chapter is not a founder change
              but the 2025-2026 acquisition sequence disclosed by SoftBank: LY sought substantial control through direct
              share purchases, shareholder-agreement amendments, and a MIRAI voting proxy; SoftBank then said LY had
              already consolidated the company by September 2025 and expected roughly 60.9% voting rights once
              additional steps closed. Retained public sources therefore support a governance narrative of increasing LY
              / SoftBank control, but not a complete picture of who else governs alongside that control.
