  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited financials
        - FY2025 and 1H2026 revenue, gross profit, EBITDA, cash flow, and segment mix.
        - Needed to convert a range view into a priced underwriting view.
        - Finance team / external auditors.
      - - Cap table and preferences
        - >-
          Fully diluted ownership, liquidation preferences, anti-dilution, and board rights for 2022 and 2025
          securities.
        - Determines real downside protection and minority economics.
        - Legal counsel / shareholder-agreement review.
      - - Fintech economics
        - Payments take rate, lending exposure, funding cost, losses, and regulatory capital.
        - This is the main upside narrative and could also be the biggest hidden risk.
        - Fintech unit leadership / regulator correspondence.
      - - Merchant-software quality
        - Merchant DX revenue, churn, attach rate, gross margin, and cohort retention.
        - Validates whether Toast-like or software-like comp support is justified.
        - Merchant Solutions GM / board pack.
      - - Subsidy-normalised cohorts
        - Monthly contribution margin and retention before, during, and after Half-Half Plus.
        - Tests whether 2025 profitability survives outside stimulus windows.
        - Operations analytics / cohort deck.
      - - IPO structure
        - Venue memo, underwriter status, expected float, governance package, and use of proceeds.
        - Needed to judge liquidity, control overhang, and exit realism.
        - Banker materials / board approvals.
    notes: These asks are ordered around the variables most likely to change valuation rather than around general curiosity.
