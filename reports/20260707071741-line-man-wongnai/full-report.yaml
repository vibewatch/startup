      - number: '1.4'
        title: Milestones, IPO path, and adverse or cautionary signals
        blocks:
          - type: paragraph
            body: >-
              The post-merger milestone record shows a company broadening its scope while the economics of Thai food
              delivery remained difficult. The operating footprint became national in 2021, unicorn funding arrived in
              2022, and 2023 brought the FoodStory and Rabbit LINE Pay transactions that strengthened merchant software
              and payments. Management then used 2024-2026 to push into new layers: a headquarters move to One Bangkok,
              an AI-driven operating shift, telepharmacy certification, and the JERA Cloud move into beauty and
              wellness. At the same time, the path to a public listing kept moving. TechCrunch’s 2024 interview still
              framed 2025 as a plausible IPO year, but February 2026 press coverage said the domestic plan had been
              paused in favor of Hong Kong or U.S. venues, and LY’s June 2026 profile framed 2027 as the target year.
              The adverse side of the picture is economic rather than existential: public reporting and the company’s
              own restaurant outlook describe a maturing, subsidy-sensitive market, sustained fee pressure, and
              historical sector losses. One prompt-level conflict also resolves clearly in the retained sources: OR
              appears only as a 2022 minority investor, while the later control record points to LY / SoftBank, not OR,
              as the buyer gaining control.
