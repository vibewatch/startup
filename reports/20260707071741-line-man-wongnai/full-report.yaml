      - number: '3.2'
        title: Direct peers, adjacents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Grab is the only clearly scaled full-stack peer in the retained set. Official product and merchant pages
              show it competes not just on food orders, but on transport, grocery, payments, merchant operations, and
              lending; official results add public evidence of regional deliveries GMV, merchant growth, and
              balance-sheet access that private Thai peers cannot match. Foodpanda remains relevant mostly as a
              cautionary signal: Delivery Hero’s official notice says Thailand consumer operations stopped on 23 May
              2025, yet corporate brand pages and app-store listings still expose a broader Asian footprint and
              packaging levers such as pandapro, pandago, and pickup. ShopeeFood is strategically different again. It is
              best understood as a delivery feature embedded in a much larger commerce-fintech app, where wallet,
              credit, logistics, and flash-sale traffic can subsidize delivery behavior. Robinhood is the hardest
              profile to underwrite cleanly: its official 2026 site still markets food, ride, shopping, parcel,
              EV-rental, and loan services with a no-GP restaurant pitch, while prior Bangkok Post reporting described a
              2024 cessation path and large historical losses. Outside the delivery apps, neutral POS platforms and
              direct restaurant pickup remain real substitutes for merchants deciding how much operating dependence to
              place on any marketplace.
