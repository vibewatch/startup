  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Excluded Spend
        blocks:
          - type: paragraph
            body: >
              LINE MAN Wongnai does not operate in a single-product food delivery niche anymore. Its current platform
              scope combines on-demand food delivery, grocery/mart, messenger, ride-hailing, restaurant discovery,
              merchant POS software, and payments infrastructure. The boundary that matters for valuation therefore has
              two layers. The narrow layer is Thailand platform-mediated food delivery: order value flowing through
              consumer food orders, delivery logistics, merchant commissions, delivery fees, promotions, and ad
              inventory tied to food ordering. The broader layer adds the merchant and payment surfaces that LINE MAN
              Wongnai has intentionally been assembling around that demand stream: Wongnai POS and FoodStory for
              restaurant operations, Rabbit LINE Pay / LINE Pay for transaction capture, and JERA Cloud for
              non-restaurant merchant software adjacency.


              The chapter keeps excluded spend explicit because broad “super-app TAM” narratives can hide what LINE MAN
              Wongnai does not yet monetize. Excluded from the core food-delivery market are dine-in restaurant sales
              that never touch the platform, most offline restaurant spending, non-digitized street-food cash
              transactions, and broader Thai food-and-beverage spending that remains outside delivery penetration.
              Bangkok Post's April 2025 reporting quoted CEO Yod Chinsupakul saying online food delivery still
              represented only 15% of Thailand's THB 800-900 billion total food market, which means the majority of food
              spend remains offline even after pandemic-era adoption. That distinction matters: the company can use
              merchant software and payments to reach more of that offline spend, but public evidence still supports a
              constrained SAM rather than an all-of-consumption TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
