      - number: '2.5'
        title: Diligence Gaps and Conflicts That Should Stay Unresolved
        blocks:
          - type: paragraph
            body: >
              The most important diligence discipline in this market is refusing to smooth over disagreement.
              Market-share snapshots conflict materially across credible public sources: Bangkok Post's 2025
              Foodpanda-exit coverage, citing Momentum Works, put 2024 shares at Grab 46%, LINE MAN Wongnai 40%,
              ShopeeFood 7%, Foodpanda 5%, and Robinhood 2%; Globe's April 2025 exit article said Foodpanda had just
              under 15% share against LINE MAN Wongnai at 44% and Grab at 39.4%; Iconic Research's 2025 synthesis
              instead cited Grab 35%, LINE MAN 33%, Robinhood 13%, and Foodpanda 19%. These are not rounding
              differences. They likely reflect different survey windows, user-share versus GMV-share approaches, and
              pre- versus post-exit timing. The report therefore preserves the contradiction explicitly.


              Several critical variables also remain private. LINE MAN Wongnai does not publicly disclose delivery take
              rate, active transacting users, payments TPV, merchant retention by cohort, or the revenue contribution of
              LINE Pay after the Rabbit LINE Pay acquisition and rebrand. Public evidence is strong enough to say the
              company has built real adjacency surfaces around food delivery, but not strong enough to convert those
              surfaces into a precise SOM. That is why the chapter's conclusion is intentionally evidence-constrained:
              the TAM is broader than meal delivery, the current served market is already meaningful, and the duopoly
              structure is strengthening, but valuation work still needs private cohort, payments, and
              merchant-monetization data before it can claim precision.
            claimRefs:
              - CM016
              - CM017
              - CM042
              - CM043
              - CM044
              - CM045
              - CM046
              - CM047
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Duopoly does not equal easy profits
            body: >
              Thailand's food-delivery market is consolidating toward two leaders, but Bangkok Post's reporting on
              industry losses and KResearch's maturity comments show that scale has not removed the need for promotions
              or solved merchant-margin pressure. A tighter market structure may improve discipline, but it does not
              automatically prove sustainable unit economics.
            calloutType: risk
            claimRefs:
              - CM033
              - CM034
              - CM042
              - CM045
          - type: callout
            title: Merchant software and payments are the real TAM expansion levers
            body: >
              The strongest market-expansion evidence in this chapter does not come from a heroic food-delivery growth
              assumption. It comes from LINE MAN Wongnai assembling recurring merchant software and payments layers
              around an already-scaled consumer network: 55,000 POS restaurants, Rabbit LINE Pay / LINE Pay integration,
              and 1,700 beauty-and-wellness outlets via JERA Cloud.
            calloutType: insight
            claimRefs:
              - CM004
              - CM021
              - CM023
              - CM029
          - type: callout
            title: Use a constrained SOM until private metrics arrive
            body: >
              Public evidence is strong enough to size the category and map adjacencies, but it is not strong enough to
              produce a precise revenue SOM for LINE MAN Wongnai. Investors should treat public market-size and
              market-share numbers as boundary conditions, then request private data on take rate, MAU-to-order
              conversion, merchant retention, and payments TPV before using a precise valuation model.
            calloutType: assumption
            claimRefs:
              - CM016
              - CM017
