      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              The food-delivery and super-app market in Thailand has multiple economically distinct constituencies. The
              consumer side is anchored by app users who browse restaurants, compare promotions, choose payment methods,
              and generate repeat orders; Wongnai's about page says the platform serves more than 10 million monthly
              active users and maintains the country's largest restaurant database with more than 900,000 eateries,
              while the LINE MAN app store pages currently market access to roughly 700,000 restaurants nationwide.
              Merchant-side users are restaurant operators who need demand generation, order management, CRM, and
              increasingly POS and payment tools. LINE MAN Wongnai's merchant-software argument is not speculative: the
              company says Wongnai POS and FoodStory POS together serve 55,000 restaurants and about 40% of the Thai
              restaurant POS market.


              Payer responsibility also differs by workflow. Consumers fund baskets, delivery fees, and wallet top-ups;
              merchants fund commissions, discounts, advertising participation, and software subscriptions; riders
              supply time and fleet capacity; and the state can temporarily become a demand catalyst through subsidy
              schemes such as Half-Half Plus. LINE MAN Wongnai's late-2025 restaurant outlook shows that incentives can
              materially change the adoption curve: over 8 million Half-Half Plus delivery orders were placed within
              three weeks, new customers rose 22%, order frequency rose 30%, and average basket size rose 15%. The
              practical adoption path is therefore not just “download app, order food.” It is discovery through content
              and search, first purchase via promotions or convenience, payment habit formation via card/cash/wallet
              choice, and then deeper ecosystem attachment through ride, mart, merchant tools, or payments.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
