            body: >-
              LINE MAN Wongnai no longer looks like a single-service food app. The public surface now resolves into a
              layered consumer journey: discovery can start from Wongnai’s restaurant-and-lifestyle content graph, the
              main LINE MAN app then routes the user into one of four core transactional services—food delivery, ride,
              mart, or messenger—and the same ecosystem increasingly overlays payments, reviews, promotions, and
              eventually regulated health. That matters because the company’s differentiation is not just “many tabs in
              one app”; it is the attempt to keep customer intent, merchant inventory, rider supply, and payment capture
              inside one local operating loop. Official pages show national food, mart, and messenger coverage, while
              ride is still earlier in rollout and telepharmacy remains a newly regulated extension rather than a
              mass-scale category. The workflow is therefore broad but uneven: the delivery and discovery stack is
              mature, while ride, fintech, and health are still moving from feature availability toward deeper
              operational density.
