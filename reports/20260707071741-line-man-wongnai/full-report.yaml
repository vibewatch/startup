      - number: '8.2'
        title: Franchise proof is real, but quality of earnings is only partly visible
        blocks:
          - type: paragraph
            body: >-
              The bullish part of the story is not hypothetical. LY’s June 2026 profile describes a business with more
              than 10 million users, 500,000 merchants, and 250,000 riders, while company disclosures also point to more
              than 10 million users and a very large merchant base tied to delivery, restaurant software, and payments.
              The franchise is therefore meaningfully larger than a single-service Thai delivery app. Merchant software
              is especially important for valuation because it can lift quality of earnings above pure transaction
              marketplaces. Official materials describe a 55,000-restaurant POS footprint, roughly 40% share in 2023,
              THB180 billion of GMV through the combined Wongnai POS and FoodStory POS estate, and further expansion
              into beauty and wellness software via JERA Cloud. If those businesses are genuinely profitable and sticky,
              they deserve more credit than a commodity-delivery multiple.


              But the bear case is also grounded in public evidence. Bangkok Post reported THB18 billion of 2023 revenue
              and a THB563 million loss, and even the visible profit inflection in 2025 is not accompanied by audited
              revenue, EBITDA, or cash-flow detail. The restaurant rebound narrative is also intertwined with the
              government’s Half-Half Plus subsidy, which LINE MAN says generated more than 8 million orders in three
              weeks and pushed order frequency, customer counts, and basket size higher during the programme window.
              That proves the platform can monetise demand when demand is stimulated; it does not fully prove that the
              new profitability is already durable on a normalised basis. The core conclusion is that LINE MAN Wongnai
              has earned a premium to an undifferentiated delivery app, but not yet a free pass to software-style
              valuation without more disclosure.
