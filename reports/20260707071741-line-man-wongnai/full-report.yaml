  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and clusters
        blocks:
          - type: paragraph
            body: >-
              Thailand’s food-delivery field is more concentrated than the consumer surface first suggests. The latest
              retained Bangkok Post reporting says Grab and LINE MAN together controlled close to 90% of Thai
              food-delivery share in 2025, while ShopeeFood emerged as the main distant challenger after Foodpanda’s
              retreat and Robinhood’s fade. But the practical job buyers and merchants purchase is broader than “deliver
              food.” LINE MAN markets itself as a Thai on-demand stack that spans food, ride, mart, messenger, merchant
              tooling, and POS, with partner materials claiming 10M+ monthly users and 700K+ merchants or restaurants.
              Grab is the closest structural peer because it combines food, transport, payments, merchant tooling, and
              public-market capital. The rest of the landscape fragments into weaker but still strategically relevant
              classes: commerce-led adjacencies such as ShopeeFood, capital-stressed local alternatives such as
              Robinhood, neutral merchant software substitutes such as StoreHub, and off-platform behaviors such as
