- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Signal
  - Price / unit / contract
  - List vs realized
  - What is included
  - Unknowns / caveats
  - Implication
  rows:
  - - Consumer delivery pricing
    - Delivery fee starts at 0 baht; discounts can reach 60%
    - Promotional list signal only
    - Food delivery orders in the consumer app
    - Does not reveal underlying merchant commission or net realized revenue after subsidies
    - Public pricing is demand-acquisition oriented and cannot be mistaken for unit economics
  - - LINE MAN merchant commission proxy
    - About 25-30% according to one low-reputation market-analysis page
    - Unofficial proxy
    - Marketplace commission charged to restaurants
    - Not confirmed by LINE MAN; may omit promo obligations or category differences
    - Useful only as a rough guardrail for diligence questions
  - - Half-Half Plus program economics
    - 63% of total program sales on LINE MAN; 65% of participating restaurants chose LINE MAN
    - Program share, not tariff
    - Government co-pay demand routed through LINE MAN
    - Does not show contribution margin or subsidy burden
    - Strong GTM signal, weak standalone margin signal
  - - POS and merchant software
    - null
    - No public list price found
    - POS, merchant app, mobile order, inventory, master data, and restaurant operating tools
    - Public pages emphasize adoption, not price, term, or services split
    - High-margin narrative is plausible but still unpriced publicly
  - - Advertising / merchant marketing
    - null
    - No public rate card found
    - In-app banners, announcements, product sampling, offline events, and content marketing
    - Campaign pricing, take rate, and renewal behavior are private
    - Ads may be a valuable incremental margin layer but cannot be modeled publicly
  - - Payments / merchant finance
    - null
    - No public list price found
    - LINE Pay, merchant finance, lending, and planned BNPL-like products
    - No TPV, take rate, loan yield, or delinquency metrics
    - Fintech upside is real strategically but unmodelled financially
  - - Telepharmacy
    - null
    - No public tariff found
    - Licensed pharmacy chat, medicine delivery, and pharmacist-assessed products
    - Regulatory approval is public; consumer fees and compliance cost are not
    - Healthcare expands TAM but not yet public monetization
  notes: The table distinguishes official promotional pricing from unofficial commission proxies and from strategic surfaces that still lack a public tariff.
