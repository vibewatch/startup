  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consolidated-financial-statements
    missingEvidence: Audited consolidated income statement, balance sheet, and cash-flow statement for LINE MAN Wongnai with segment notes.
    whyItMatters: Without consolidated audited statements, the public 2023 revenue/loss proxy cannot be converted into a dependable view of margins, leverage, or liquidity.
    diligencePath: Request audited FY2024-FY2025 financial statements and management accounts that reconcile Line Man Thailand, Wongnai Media, merchant software, and payments into one consolidation scope.
    relatedQuestionRefs:
    - QI016
    - QI019
    - QI026
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: take-rate-and-incentives
    missingEvidence: Gross-to-net revenue bridge by vertical showing merchant commission, delivery fees, promotions, rider incentives, and refunds.
    whyItMatters: Public GMV and order growth do not reveal whether marketplace economics improve after discounts, subsidies, and rider support.
    diligencePath: Request monthly cohort waterfalls for food delivery, mart, ride, and messenger showing GMV, gross revenue, contra-revenue, incentives, and contribution margin.
    relatedQuestionRefs:
    - QI008
    - QI014
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: merchant-software-pricing
    missingEvidence: POS, ads, merchant-app, and telepharmacy pricing schedules plus attach, churn, and ARPU by merchant cohort.
    whyItMatters: Merchant solutions look strategically attractive, but public scale metrics do not show whether this layer is meaningfully monetizing beyond adoption.
    diligencePath: Request current pricing cards, top-20 merchant contracts, and a segment KPI pack with MRR/ARR, churn, NDR, and services margin for Merchant Digital Solutions.
    relatedQuestionRefs:
    - QI002
    - QI005
    - QI006
    - QI022
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: fintech-credit-risk
    missingEvidence: LINE Pay transaction volume, take rate, loan-book size, delinquency metrics, merchant-financing yield, and any BNPL underwriting metrics.
    whyItMatters: Payments and financial services may be a major upside vector, but without monetization and credit metrics investors cannot judge whether it is revenue-accretive or risk-accretive.
    diligencePath: Request monthly TPV, take rate, active payer count, active merchant count, loan balances, NPL ratios, charge-offs, and unit economics for merchant financing or consumer credit.
    relatedQuestionRefs:
    - QI007
    - QI023
    - QI026
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, net burn, committed capex/opex, debt, and runway assumptions after the control transaction and AI investment plan.
    whyItMatters: The company may have strong strategic backing, but investors still cannot underwrite solvency or financing dependency without liquidity and obligation data.
    diligencePath: Request cash waterfall, burn forecast, debt schedule, parent support arrangements, and board-approved operating plan covering the next 24 months.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI021
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: market-share-proxies
    missingEvidence: One reconciled, methodology-backed market-share series for Thailand food delivery covering 2023-2026.
    whyItMatters: Public share estimates range from 33% to 44% for LINE MAN, which changes how aggressively one should interpret scale, network effects, and pricing power.
    diligencePath: Ask management for monthly internal GMV share, order share, and active-user share against each major competitor, with definitions and any third-party benchmarking used internally.
    relatedQuestionRefs:
    - QI008
    - QI012
    - QI024
    relatedTableRefs:
