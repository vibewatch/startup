chapter:
  number: 4
  title: Financials
  summary: LINE MAN Wongnai’s public financial record is unusually rich on ecosystem scale, merchant-software expansion, and capital history, but still thin on the audited metrics needed for underwriting. Food delivery appears to remain the core revenue engine, while merchant software, ads, payments, and non-food services offer real diversification upside; the missing pieces are consolidated statements, gross-to-net revenue bridges, and liquidity disclosure.
sections:
- id: revenue-model-pricing-and-monetization
  title: Revenue Model, Pricing, and Monetization
  body: The public record supports a multi-layer monetization model rather than a single food-delivery commission business. Food delivery still appears to dominate the P&L, because Bangkok Post quoted management saying it represented about 80% of revenue in 2025, but the official company narrative has widened far beyond food. Merchant Digital Solutions now spans POS, merchant apps, restaurant software, beauty-and-wellness software, advertising inventory, coupons, sampling, merchant announcements, and even merchant financing tools. Payments and financial services became a separate pillar after the Rabbit LINE Pay acquisition, and management later described lending as part of that stack. Non-food on-demand adds mart, messenger, ride, and telepharmacy services, which may deepen wallet share and order frequency even if public revenue disclosure is absent. The underwriting constraint is pricing. Official pages show consumer-facing promotions such as 0-baht starting delivery fees and up to 60%
    discount codes, but they do not publish merchant software tariffs, payments take rates, or financing yields. The only explicit merchant commission proxy in the fetched corpus comes from a low-reputation market-analysis page, so it should be treated as directional rather than factual list pricing.
