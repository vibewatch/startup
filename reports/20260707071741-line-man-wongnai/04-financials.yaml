- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Food delivery marketplace
    - Merchant commissions, delivery fees, promotions, and order flow across 700k+ restaurants
    - Orders / GMV / gross revenue
    - Still about 80% of total revenue by 2025 management commentary
    - Medium
    - Provide gross-to-net bridge showing commission, delivery fees, refunds, promotions, and rider incentives by month
  - - Merchant Digital Solutions / POS
    - POS software, merchant app, restaurant operating tools, and adjacent vertical software
    - Subscription / SaaS / services
    - 50k+ restaurant operators in 2023, 55k restaurants and 180bn baht GMV across POS + FoodStory, later 70k+ businesses and claimed high profitability
    - Medium
    - Provide price book, MRR/ARR, churn, services mix, and gross margin by product line
  - - Advertising and merchant marketing
    - In-app banners, coupons, product sampling, merchant announcements, offline events, and self-serve merchant promotion tools
    - Campaign spend / advertiser budget
    - Officially marketed but no public revenue disclosure
    - Medium
    - Break out advertiser count, annualized ads revenue, repeat spend, and gross margin
  - - Payments and financial services
    - LINE Pay transactions, merchant finance, lending, and planned BNPL-style services
    - TPV / take rate / net interest yield
    - Strategic pillar with high-growth language, but no public monetization detail
    - Low
    - Provide TPV, take rate, active payers, active merchants, loan book, delinquency, and charge-off metrics
  - - Mart, messenger, and ride
    - Non-food order flow and logistics services that deepen frequency and utilization
    - Orders / trips / stores
    - Mart 50k+ stores, messenger in 77 provinces, ride demand doubled in 2022; revenue share undisclosed
    - Medium
    - Break out revenue, GMV, and contribution margin by non-food service
  - - Telepharmacy and healthcare
    - Regulated medicine and pharmacy delivery through LINE MAN MART
    - Orders / pharmacies / healthcare GMV
    - FDA-certified in 2026 and expanding pharmacy network, but no pricing disclosed
    - Low
    - Show telepharmacy order count, pharmacy attach rate, take rate, and compliance costs
  - - Discovery and content inventory
    - Wongnai reviews, search, and local content that feed consumer demand and merchant lead generation
    - Traffic / MAU / merchant leads
    - 10M+ MAU and 900k+ restaurant database create demand-generation value, but direct monetization is unclear
    - Low
    - Quantify lead generation, referral conversion, and ad monetization from content surfaces
  notes: Rows separate confirmed monetization surfaces from still-unquantified strategic pillars; they are not a management-approved segment revenue bridge.
