- id: TI004
  title: Capital Adequacy Table
  columns:
  - Capital item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2020 merger financing
    - USD 110m raised around the LINE MAN / Wongnai merger
    - High
    - Established the initial capital base for the combined platform
    - Confirm post-close cash received by the merged entity and any escrow or secondary components
  - - 2022 Series B
    - USD 265m raised at a valuation above USD 1bn
    - High
    - Large growth round that funded food-delivery defense and expansion into new categories
    - Provide post-money ownership, liquidation preferences, and cash remaining from the round
  - - 2025 control transaction
    - CB Insights lists a USD 272.78m Corporate Majority round dated 2025-09-11
    - Low
    - Could represent major new capital or mostly an ownership transfer; public detail is insufficient
    - Clarify how much cash went onto the balance sheet versus to selling shareholders
  - - Strategic parent support
    - SoftBank said LY consolidated LMWN in Sep 2025 and expected indirect voting rights of 60.9% after the additional acquisition
    - High
    - Strategic control can reduce financing risk but may also change minority economics and IPO path
    - Provide parent-support framework, intercompany facilities, and governance rights
  - - Profitability / break-even signals
    - LY says profitable in 2025; Bangkok Post says break-even in 2025 and IPO targeted for 2026
    - Medium
    - Improving economics may reduce dependence on fresh capital, but the evidence is not yet audited
    - Define profitability metric and show monthly bridge into sustained profitability
  - - AI and technology investment plan
    - 10bn baht over five years, or about 2bn baht annually
    - Medium
    - Suggests meaningful ongoing cash needs for growth, AI, and infrastructure
    - Split the plan into opex, capex, M&A, and cloud spend with timing by year
  - - Cash, burn, runway, and debt
    - null
    - Low
    - Without this stack, capital adequacy remains unverified even with strong strategic backing
    - Provide current liquidity, debt schedule, covenant exposures, and 24-month runway model
  notes: Funding chronology is included only where it changes forward capital adequacy; the key missing issue is still cash visibility, not fundraising history.
