- id: capital-adequacy-financing-dependency-and-verdict
  title: Capital Adequacy, Financing Dependency, and Financial Verdict
  body: 'Capital support looks substantial, but capital adequacy is still only partially underwritten. The company publicly disclosed USD 110 million in 2020 and USD 265 million in the 2022 Series B, while TechCrunch said total funds raised exceeded USD 372 million and CB Insights lists USD 375 million. CB Insights also characterizes a September 2025 corporate-majority round of USD 272.78 million, and SoftBank later confirmed that LY had already consolidated LINE MAN Wongnai as a subsidiary by September 2025 and expected indirect voting rights to rise to 60.9% after an additional acquisition. That control path likely improves access to strategic capital and ecosystem support, but it also muddies how much fresh primary cash versus secondary ownership transfer actually reached the company. Meanwhile, management is talking about a 10-billion-baht technology program over five years—roughly 2 billion baht per year—plus more acquisitions. That is meaningful capital intensity even for a scaled
    platform. Because no fetched source discloses cash, burn, runway, debt, or detailed payments economics, the verdict should be balanced: revenue quality is promising because diversification is real and merchant software may be profitable, but underwriting still hinges on private disclosures for consolidated statements, gross-to-net revenue bridges, liquidity, and the actual economics of payments and merchant finance. The disclosure gap is stark versus listed peers: Grab already supplies 6-K and 20-F filings in this chapter, DoorDash published Q1 2026 orders, GOV, revenue, GAAP net income, and adjusted EBITDA in one earnings release, and both DoorDash and Uber maintain dedicated public filings rails that private investors can use as an IPO-readiness benchmark.'
