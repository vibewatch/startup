- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited consolidated revenue and gross profit by segment
    - Without consolidated segment reporting, the 2023 public revenue/loss proxy cannot support a real margin model
    - Request audited FY2024-FY2025 statements plus monthly management accounts broken out by food delivery, non-food on-demand, merchant software, ads, and payments
  - - Gross-to-net revenue bridge and incentive burden
    - GMV and order growth do not show whether commissions survive subsidies, refunds, and rider support
    - Request monthly waterfalls from GMV to net revenue and contribution margin for each vertical
  - - POS / merchant-software pricing, churn, and services mix
    - Merchant Digital Solutions may be the cleanest profit pool, but no public data says how large or durable it is
    - Review current price cards, renewal rates, services attach, implementation hours, and gross margin by product
  - - Payments and lending monetization
    - Fintech could be upside or balance-sheet risk depending on take rate, credit losses, and funding structure
    - Request TPV, active payers, take rate, loan balances, NPLs, charge-offs, and funding costs
  - - Cash balance, burn, debt, and runway
    - Strategic backing cannot substitute for solvency analysis
    - Obtain treasury dashboard, debt schedule, intercompany funding terms, and board runway scenarios
  - - Ownership-transfer economics from the 2025 control deal
    - If the majority transaction was mostly secondary, public “capital raised” figures may overstate available cash for growth
    - Request closing memo showing primary proceeds, secondary proceeds, seller list, and post-close capitalization table
  - - IPO-grade recurring reporting pack comparable to listed peers
    - Listed peers publish centralized filings pages plus quarterly releases that expose orders, GOV or GMV, revenue, earnings, and audited annual-report packages; LINE MAN Wongnai does not
    - Ask management to produce a mock quarterly and annual disclosure pack using Grab, DoorDash, and Uber as the minimum benchmark for KPIs, audited statements, liquidity, and segment bridges
  - - One reconciled market-share series
    - Public estimates range from 33% to 44% for LINE MAN, which affects moat and pricing interpretations
    - Provide internal share data by GMV, orders, and MAU with the methodology behind each measure
  notes: These are the minimum missing fields needed to move from directional diligence to a finance model that can be defended in underwriting committee.
