- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Food delivery revenue mix
    - About 80% of total revenue in 2025 according to CEO quote in Bangkok Post
    - Medium
    - Shows the company is still primarily a delivery marketplace despite diversification
    - Provide audited segment revenue mix for food delivery, non-food on-demand, merchant software, ads, and payments
  - - GMV growth
    - +33% from Jan 2022 to Apr 2023
    - Medium
    - Shows strong demand growth even during an industry slowdown
    - Provide quarterly GMV series by business line and geography
  - - Public revenue / loss proxy
    - 18bn baht revenue and 563m baht loss in 2023 for proxy entities; Line Man Thailand alone at 11.6bn revenue and 253m loss
    - Medium
    - Useful directional evidence, but entity scope is not the full consolidated company
    - Reconcile public Thai entities to full group consolidation and disclose audited EBITDA or EBIT
  - - Merchant software activity
    - 55k restaurants, 180bn baht POS GMV, 636m orders in combined POS data; later 70k+ businesses and “high profitability” claim
    - Medium
    - Suggests a real software layer that may lift blended margin
    - Provide software ARR/MRR, customer count, churn, gross margin, and implementation burden
  - - Order-frequency / basket proxy
    - Half-Half Plus frequency +30%, basket +15%; rice-and-curry 65m orders
    - High
    - Shows consumer repeat behavior and elasticity under promotions
    - Provide organic order frequency and basket size excluding stimulus or co-pay periods
  - - Market-share proxy
    - Conflicting public estimates put LINE MAN roughly between 33% and 44%
    - Low
    - Scale and pricing power depend on whether the company is merely large or clearly dominant
    - Provide internal GMV share, order share, and active-user share with methodology
  - - Comparable delivery contribution margin
    - Grab reported 2.3% deliveries adjusted EBITDA on GMV with incentives at 10.5% of on-demand GMV
    - High
    - Illustrates how thin marketplace margins can remain even at listed regional scale
    - Show LINE MAN Wongnai contribution margin before and after incentives by vertical
  - - Cash efficiency / runway
    - null
    - Low
    - The most important missing solvency metric for underwriting
    - Provide current cash, burn, debt, and base/downside runway assumptions
  notes: Nulls are genuine public-data gaps. Directional proxies are helpful only when their scope and caveats are kept explicit.
