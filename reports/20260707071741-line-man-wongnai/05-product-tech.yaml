- id: merchant-operating-system-and-integrations
  title: Merchant operating system and integrations
  body: 'The merchant side is the clearest evidence that LINE MAN Wongnai is building something broader than a demand app. Public sources show a stack that starts with merchant storefront management inside LINE MAN, extends into Wongnai POS and FoodStory POS, and then connects into accounting, finance, payments, and operator education. The company has deliberately split restaurant software by segment: Wongnai POS historically served a broad base, while FoodStory deepens chain and premium workflows. Restaurant 2023 and FoodStory’s own site reveal enough feature depth to call this a real operating system rather than a promo dashboard: QR self-order, inventory, branch master data, staff apps, CRM, EDC-linked payments, and omnichannel menu management all appear on the record. The newest integration wave goes a step further by piping POS data into FlowAccount and ttb credit workflows, which suggests LINE MAN Wongnai wants merchant software to become the spine for commerce, bookkeeping, and eventually
    embedded finance.'
