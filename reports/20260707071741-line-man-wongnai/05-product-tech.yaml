- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable or structural benefit
  - Known limitation
  rows:
  - - Choose a meal quickly
    - Browse reviews, promos, or categories, then place an order in the LINE MAN app
    - Wongnai discovery plus LINE MAN food ordering, Group Ordering, LINE MAN Only, and personalization
    - One ecosystem links discovery, checkout, promotions, and delivery
    - No public benchmark for search relevance, ETA accuracy, or conversion uplift
  - - Book local transport
    - Open LINE MAN RIDE and choose car, bike, or taxi
    - Ride launch plus safety controls and Thai-local UI features
    - Adds another high-frequency demand surface to the same app and identity
    - Coverage still trails food and mart and is not yet fully national
  - - Restock groceries or pharmacy-adjacent goods
    - Select household or health products inside MART
    - MART extends the consumer app into groceries and regulated telepharmacy handoff
    - Cross-category basket building and reuse of existing app familiarity
    - Mart-specific operational detail is thinner than food or POS detail
  - - Send documents or parcels urgently
    - Trigger messenger dispatch and optionally ask the rider to perform tasks like signatures or invoice submission
    - Messenger turns the rider network into a broader logistics utility
    - Useful for SMB documents and non-food errands
    - No public enterprise tooling, tracking detail, or SLA tier disclosure
  - - Run a restaurant day-to-day
    - Manage menus, POS, staff, inventory, payments, and delivery channels
    - Merchant App plus Wongnai POS / FoodStory POS with branch and QR-order tooling
    - Makes the merchant relationship deeper than simple marketplace listing
    - Public evidence is strong on features but not on retention or realized ROI
  - - Consult a pharmacist remotely
    - Chat with a licensed pharmacist, complete assessment, order products, and receive home delivery
    - Telepharmacy inside LINE MAN MART with credential checks and record handling
    - Brings regulated healthcare into an existing consumer habit loop
    - Public data on service hours, order volume, and geographic coverage is limited
  notes: The workflow rows synthesize official consumer and merchant narratives into concrete jobs-to-be-done; most outcome metrics remain undisclosed publicly.
