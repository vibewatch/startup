- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy
    - Live public disclosure
    - Data collection, fraud monitoring, payment dispute handling, overseas transfers
    - No simple reader-friendly trust center tying policies to each product module
  - - App Store privacy labels
    - Live public disclosure
    - Tracking categories and data linked to identity for the iOS app
    - Labels show categories but not retention windows or internal access controls
  - - LINE Pay payment security
    - Publicly claimed compliant
    - PCI DSS and ISO/IEC 27001 plus five-step security messaging
    - Evidence is stronger for payment rail than for the broader consumer app stack
  - - Ride safety controls
    - Publicly claimed active
    - Trip tracking, driver checks, insurance, ratings, and DLT oversight
    - No public safety-incident rate, claims process detail, or response SLA
  - - Telepharmacy compliance
    - Publicly claimed certified
    - FDA certification, licensed pharmacy matching, patient records, privacy safeguards
    - No public external audit or quality KPI set for consultations and delivery
  - - Public support route
    - Visible but thin
    - Support email and headquarters are public
    - No public status page, uptime history, or issue-severity framework was found
  notes: The table separates product-line-specific controls from broad privacy and support disclosures because the company does not publish one unified trust portal.
