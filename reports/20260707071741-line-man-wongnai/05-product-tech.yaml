- id: ai-operations-support-and-public-quality-signals
  title: AI, operations, support, and public quality signals
  body: 'The most important 2025–2026 product signal is that LINE MAN Wongnai is trying to operationalize AI across both internal throughput and external product experience. The public record is unusually concrete for an emerging initiative: management says all tech teams use AI coding tools, a VP of AI and 30-plus specialists were appointed, and a company-wide hackathon pushed AI experiments into customer service and other high-volume teams. LY’s 2026 interview adds the most operationally meaningful datapoint: AI already handles 40% of customer-service volume and runs continuously, while merchant-facing AI features include menu image enhancement, multilingual support, and promotion optimization. That suggests AI is being used first as workflow acceleration and merchant uplift rather than as a flashy standalone chatbot. Public app-store signals are directionally positive as well—very high ratings and fresh release activity—but they are not substitutes for formal reliability disclosures.
    Support is publicly reachable, and customer-service automation is clearly live, yet no public status page, SLO set, or independent core-app audit packet was found.'
