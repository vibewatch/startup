  evidenceGaps:
  - type: missing-source
    severity: material
    topic: platform-reliability
    missingEvidence: A public status page, uptime history, SLA pack, or independently attested reliability summary for the core LINE MAN app.
    whyItMatters: Breadth across food, ride, mart, messenger, and payments means reliability is strategically important, but the public record stays almost entirely qualitative.
    diligencePath: Request internal reliability dashboards, incident review samples, customer-service severity taxonomy, and any public/private status tooling.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: telepharmacy-scale
    missingEvidence: Order volume, consultation-hours coverage, pharmacist utilization, and service-area penetration for telepharmacy.
    whyItMatters: The regulatory approval is important, but without operating volume the product could still be pilot-scale rather than strategically material.
    diligencePath: Ask management for monthly telepharmacy orders, active partner pharmacies, city coverage, consultation hours, and repeat-use metrics since launch.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE001
    - TE002
  - type: private-evidence-only
    severity: material
    topic: ride-coverage-depth
    missingEvidence: Exact live-city count, average ETA, cancel rate, driver supply depth, and attach rate between ride and the broader LINE MAN app.
    whyItMatters: Ride is strategically important for super-app frequency, but the public record mostly proves launch and growth rather than mature operating quality.
    diligencePath: Request a current city list, wait-time distributions, trip growth by city, and rider/driver crossover metrics with food and messenger.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: core-app-security-audit
    missingEvidence: Independent security or privacy audit evidence for the broader consumer app beyond LINE Pay’s payment-specific compliance claims.
    whyItMatters: The company handles payments, location, messaging, and now regulated health, so a fragmented trust narrative leaves a material diligence gap.
    diligencePath: Request any SOC 2, ISO, penetration-test summary, secure-development policy, or appsec posture documentation that covers the core consumer platform.
    relatedQuestionRefs:
    - QE011
    - QE029
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: fintech-attach-rate
    missingEvidence: Merchant and consumer attach rates for LINE Pay, merchant lending conversion, and how often POS, payments, and delivery are used together by the same merchant.
    whyItMatters: The strategic thesis depends on cross-sell, but public materials only prove product availability, not actual financial-service penetration.
    diligencePath: Ask for wallet attach, merchant payment adoption, lending approval rate, and POS-to-payment cross-sell cohorts.
    relatedQuestionRefs:
    - QE030
    relatedTableRefs:
    - TE003
