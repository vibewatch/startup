- id: payments-trust-safety-and-regulated-health
  title: Payments, trust, safety, and regulated health
  body: 'Trust controls are visible, but they are distributed across several subsystems instead of being summarized in one security center. Payments moved materially closer to the core product after the Rabbit LINE Pay acquisition and rebrand, giving LINE MAN Wongnai a route to unify online checkout, offline acceptance, transfers, transit use cases, and merchant enablement. Public LINE Pay materials add stronger technical proof than the core app surfaces do, including PCI DSS and ISO/IEC 27001 references. The consumer app itself discloses large data categories, fraud monitoring, and overseas transfers through the privacy policy and App Store privacy labels, but it also explicitly notes that internet transmission cannot be made completely secure. Ride has a different trust profile: safety is framed through driver checks, trip tracking, insurance, and Department of Land Transport oversight. Telepharmacy is the newest and most regulated trust layer, with FDA certification, licensed-pharmacy
    matching, patient-record handling, and a 15-kilometer service boundary. Net: compliance exists, but it is fragmented by product line and public disclosure remains stronger for payments and telepharmacy than for the core marketplace stack.'
