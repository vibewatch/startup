- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Identity and app shell
    - Provides the main consumer entry point and uses LINE ID login
    - LINE app identity, mobile release cadence, app-store distribution
    - User friction or platform-policy changes at the identity or app-store layer would affect multiple services
  - - Wongnai content graph
    - Forms local discovery and review context for restaurants and lifestyle categories
    - Continued content freshness, moderation, and ranking quality
    - Public moderation, anti-spam, and ranking systems are not documented
  - - Dispatch and fulfillment network
    - Matches orders or trips to riders and drivers across food, mart, messenger, and ride
    - Rider supply, driver onboarding, incentives, transport rules
    - Quality and economics remain sensitive to promotions, fuel, and labor conditions
  - - Merchant operating system
    - Runs menus, ordering, staff, inventory, branch data, and omnichannel merchant workflows
    - Wongnai POS, FoodStory POS, Merchant App, hardware and integration partners
    - Attach rates and reliability across modules are not publicly disclosed
  - - Payment and financial rail
    - Supports checkout, transfers, offline acceptance, transit, and merchant onboarding
    - LINE Pay integration, compliance regimes, bank and merchant networks
    - Public lending and payment-take-rate detail remains sparse
  - - AI and support layer
    - Automates customer service and improves merchant and user workflows
    - Internal AI talent, data quality, model operations, and policy controls
    - No public core-model architecture, eval process, or rollback standards were found
  - - Regulated health extension
    - Enables telepharmacy assessment and medicine delivery inside MART
    - FDA certification, licensed pharmacies, pharmacist availability, patient-record handling
    - Highly sensitive to regulatory interpretation and partner quality
  notes: This architecture map reflects the visible operating model, not a disclosed microservice or cloud diagram.
