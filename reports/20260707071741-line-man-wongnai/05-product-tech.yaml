tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Product line
  - Primary user
  - Current public scope
  - Differentiation
  - Key gap
  rows:
  - - Food delivery
    - Consumers and restaurant merchants
    - National food-ordering marketplace with 500k+ restaurant selection signal and personalization features
    - Combines local review/discovery graph, promotions, and a very broad merchant base inside one Thai-first app
    - No public SLA, dispatch metrics, or attach-rate breakdown by region
  - - Ride
    - Consumers and drivers
    - LINE MAN Eco, Bike, and Taxi launched from Bangkok base and are expanding toward major-city coverage
    - Thai-local features such as toll selection, chat stickers, QR payment roadmap, and regulatory positioning
    - Public evidence still lags on exact city count, wait times, and driver density
  - - Mart / grocery
    - Consumers and retail merchants
    - Nationwide grocery and household-goods delivery through LINE MAN MART
    - Lets the same consumer identity and payment context extend from meals into household replenishment
    - Public product detail is thinner than for food and POS
  - - Messenger
    - Consumers and SME senders
    - Nationwide package, document, and invoicing delivery with tasking features for riders
    - Extends the rider network into urgent document and errand use cases instead of only meals
    - No public data on routing quality, SLA tiers, or enterprise tooling
  - - Wongnai discovery and reviews
    - Consumers and local businesses
    - Restaurant, recipe, beauty, and travel discovery with 10M+ MAU and 900k+ eatery database
    - Acts as proprietary local-demand formation and merchant-discovery layer upstream of transactions
    - Legacy app pages look older than current LINE MAN surfaces and do not expose moderation or ranking internals
  - - Merchant OS (Merchant App, Wongnai POS, FoodStory POS)
    - Restaurant owners and staff
    - 55k+ restaurant POS footprint historically, expanding toward 70k+ businesses across adjacent verticals
    - Unifies online menus, in-store ordering, inventory, branch ops, CRM, staff workflows, and LINE MAN demand
    - Public disclosures still omit retention, attach rates, and exact module penetration
  - - Payments and financial services
    - Consumers, merchants, riders
    - LINE Pay wallet plus offline acceptance, transfers, transit, and merchant onboarding
    - Potential to capture checkout online and offline while feeding merchant finance and ecosystem stickiness
    - Public evidence for lending economics and payment attach rates is sparse
  - - Telepharmacy / health
    - Consumers, pharmacies, pharmacists
    - FDA-certified 2026 service inside LINE MAN MART with licensed-pharmacy matching and home delivery
    - Extends the app into regulated healthcare without forcing users into a separate pharmacy app
    - No public order-volume, uptime, or pharmacist-availability disclosure yet
  - - Beauty and wellness merchant software
    - Clinics, salons, spas, dental practices
    - JERA Cloud and JERA Dent broaden Merchant Digital Solutions beyond restaurants
    - Shows platform ambition to reuse POS, payments, and merchant workflows in adjacent local-service verticals
    - Cross-sell between beauty software and the core consumer app is still largely roadmap-level publicly
  notes: Rows describe only publicly visible service lines and software modules; unpublished internal tools, data infrastructure, and economics are excluded.
