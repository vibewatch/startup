    "number": 8,
    "title": "Valuation",
    "summary": "Public evidence supports LINE MAN Wongnai as a stronger business than the 2022 unicorn floor alone suggests, but not yet as a clean premium-priced IPO candidate above roughly THB55 billion because audited FY2025-2026 financials, cap-table terms, and subsidy-normalised cohort data remain undisclosed. The evidence-based base case is about THB40 billion to THB55 billion, with upside only if merchant software, fintech, and first-time profitability prove durable under prospectus-grade disclosure. Recommendation: research-more with medium confidence, high risk, and strict price discipline."
  },
  "sections": [
    {
      "id": "observable-pricing-and-control-anchors",
      "title": "Observable pricing anchors, control shift, and IPO context",
      "body": "The cleanest disclosed valuation anchor for LINE MAN Wongnai is still the September 2022 Series B, not any fully published 2025 or 2026 step-up. Company materials and a syndication copy both describe a US$265 million round led by GIC and LINE at a valuation above US$1 billion, which the company itself also frames as roughly THB37 billion. Since then, the public record has become messier rather than cleaner. CB Insights logs a September 2025 “Corporate Majority” event for US$272.78 million involving LY, but it does not expose a usable post-money figure and its own total-raised summary makes the classification hard to interpret as a pure primary round. That ambiguity matters because control transfers are not the same as fresh market-clearing minority prices.\n\nThe 2026 exit context adds another layer of caution. Management has openly discussed a 2027 IPO and has explored Thailand, Hong Kong, Singapore, and Nasdaq as possible venues, while Bangkok Post and The Straits Times tie the venue shift to a weak Thai IPO market rather than to a fully de-risked valuation narrative. SoftBank’s May 2026 disclosure further shows that LY already consolidated LINE MAN Wongnai in 2025 and expects voting control to reach 60.9% after an additional acquisition. That is strategically supportive, but it also creates governance concentration and potential free-float overhang for any new investor. In short, public evidence proves that a control event happened and that IPO preparation is active, but it does not yet prove what price a new minority investor should pay.",
