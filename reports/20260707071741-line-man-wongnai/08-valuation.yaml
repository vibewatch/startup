    {
      "id": "scenarios-recommendation-and-diligence-gates",
      "title": "Scenario ranges, recommendation, and diligence gates",
      "body": "The public-evidence base case is a business that deserves to trade above the raw 2022 unicorn floor, but not yet at a premium software multiple. A reasonable boundary today is roughly THB40 billion to THB55 billion, which recognises the move to first profitability in 2025, the very real merchant-software footprint, and the fact that a duopoly market leader with ecosystem breadth should not be priced like a structurally weak subscale app. The bull case of THB55 billion to THB74 billion is possible, but only if audited FY2025 to FY2026 numbers show that delivery profitability is not subsidy-dependent, that merchant and fintech contributions materially raise quality of earnings, and that the eventual IPO structure does not saddle minorities with control-heavy governance and opaque preference terms.\n\nThe recommendation, therefore, is research-more with medium confidence, high risk, and a fair-to-stretched valuation stance depending on entry price. Near the unicorn floor, the risk-reward begins to look interesting enough to track closely. Above roughly THB55 billion, however, the burden of proof shifts sharply to management. The downside case is not that the company is weak; it is that investors pay for a quality of earnings that has not yet been published. Final diligence should focus on audited financials, the fully diluted cap table, subsidy-normalised cohorts, and fintech unit economics. Until those arrive, public evidence is strong enough to define valuation discipline but not strong enough to clear a buy recommendation.",
