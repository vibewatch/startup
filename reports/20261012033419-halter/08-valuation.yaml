callouts:
  - calloutType: recommendation
    title: 'Investment Recommendation: Research-More at $2.0B'
    body: While Halter has demonstrated extraordinary hardware-enabled SaaS product velocity and secured premier backing from Founders Fund, the $2.0B post-money valuation prices in flawless execution at a 20x-28x revenue multiple against a total addressable market still nascent in scale. Diligence should focus on verifying private cohort retention and gross margin durability before participating.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV015
  - calloutType: risk
    title: Downside Valuation and Multiple Compression Risk
    body: Should annual recurring revenue growth decelerate below the $130M-$200M target range or collar maintenance costs compress gross margins below standard software benchmarks, the implied valuation multiple could compress toward broader agricultural equipment or agtech averages (2x-6x revenue), creating down-round risk.
    claimRefs:
      - CV010
      - CV014
      - CV015
