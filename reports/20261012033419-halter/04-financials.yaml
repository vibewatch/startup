    title: "Hardware-as-a-Service Working Capital Dynamics"
    body: "While bundled per-cow subscriptions eliminate farmer adoption hurdles and produce predictable recurring revenue, Halter must finance collar manufacturing costs upfront. Working capital absorption scales directly with collar deployment volume, requiring substantial equity funding until subscription inflows achieve self-sustaining cash amortisation."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI009"
      - "CI012"
  - calloutType: "risk"
    title: "Valuation Vulnerability to Growth and Margin Realization"
    body: "At a US$2 billion post-money valuation against estimated ARR of US$70M to US$100M, Halter trades at a rich 20x+ revenue multiple. Any deceleration in international expansion or margin compression from hardware replacement cycles could trigger severe valuation re-rating."
