chapter:
  number: 5
  title: "Product & Technology"
  summary: "Halter combines solar-powered cattle collars, a mobile application, cloud processing, and animal-guidance software for virtual fencing, herd movement, monitoring, and pasture management. Its April 2026 direct-to-satellite release removed the prior need for Halter radio towers, but the assigned public evidence does not independently establish reliability, security, welfare outcomes, or failure rates."
sections:
  - id: "system-definition-and-workflow"
    title: "System Definition and Customer Operational Workflow"
    body: "Halter's customer-facing system pairs a solar-powered cattle collar with a mobile application. The app lets an operator create virtual fences, initiate herd shifts, review animal locations, and use pasture and animal information in daily decisions. Halter says its Cowgorithm trains cattle to respond to directional audio cues, while independent coverage also describes collars using sound and vibration signals. This creates a closed operating workflow: the user defines an intended movement or grazing boundary, the collar supplies guidance, collar data returns to Halter's platform, and the app presents current conditions. Public sources establish the advertised workflow, not comparative containment performance, labor savings across representative farms, or the frequency with which a person must intervene."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "hardware-architecture-and-connectivity"
    title: "Hardware Architecture and Satellite Connectivity Model"
    body: "The physical layer is a solar-powered collar that Halter describes as weather-resistant, dust-sealed, ergonomic, and capable of delivering audio and vibration cues. The public material does not specify battery capacity, component suppliers, sensor bill of materials, satellite constellation, or service-level targets. Halter's April 2026 release says earlier collars depended on proprietary long-range radio towers; direct-to-satellite collars instead communicate with the cloud without on-ranch towers or cellular coverage where the sky is visible. That is a material deployment simplification, especially for remote land, but the stated 2.5-times expansion in U.S. beef-market coverage is Halter's internal model rather than an independent benchmark. Terrain-level packet delivery, latency, outage behavior, and fallback procedures remain diligence items."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE015"
    figureRefs:
      - "FE001"
  - id: "applied-ai-and-herd-intelligence"
    title: "Applied AI, The Cowgorithm, and Herd Intelligence"
    body: "Halter describes a cloud data platform and machine-learning layer behind the collars and app. Its technology page says each collar sends more than 6,000 data points per minute and that the company has collected more than 7 billion hours of animal-behavior data. Those are company-reported scale metrics; the assigned evidence does not disclose the denominator, storage convention, training-set composition, validation method, or model error rates. The current product surface includes heat detection, behavior monitoring, grazing and rumination indicators, pasture features, and location tracking. A company-authored job listing adds a useful practitioner signal: Halter is building shared mobile and web design foundations, including code-based component libraries and a Figma-to-code connection, with legibility and target sizing shaped by field conditions. It does not reveal the production stack or security architecture."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "commercial-deployment-and-technical-risks"
    title: "Commercial Deployment, Field Validation, and Technical Risks"
    body: "Commercial maturity is supported by multiple public indicators, though most underlying counts originate with Halter. Two independent agriculture publications report more than 2,000 farmers or ranchers and about one million collars across New Zealand, Australia, and the United States; Halter repeats those figures in its satellite release. Wikipedia's sourced chronology records commercial operation in Tasmania from 2022 and a U.S. launch in 2024. Halter's release also presents High Lonesome Ranch as an early satellite deployment across 225,000 acres, which demonstrates deployment scope but remains company-selected customer proof. The evidence set contains no independent fleet reliability statistics, incident history, animal-welfare assessment, security or privacy documentation, uptime record, recall data, or support-service levels. Scale therefore supports product maturity, while production resilience and control quality remain unverified."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
