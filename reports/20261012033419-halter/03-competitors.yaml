callouts:
  - calloutType: "insight"
    title: "Convergence from Passive Monitoring Toward Closed-Loop Actuation"
    body: "While incumbent PLF providers like CowManager and smaXtec offer deep physiological insights into individual cow rumination and temperature, their utility remains contingent on human intervention. Halter's defining architectural advantage is closing the control loop: collapsing observation, pasture boundary enforcement, and directional herd shifting into a single automated system."
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP014"
  - calloutType: "risk"
    title: "Distribution Moats of Corporate Fencing Incumbents"
    body: "Although Halter holds an early lead in collar scale and satellite connectivity, established livestock hardware players such as Gallagher possess entrenched global farm dealer networks and brand trust spanning decades. Overcoming dealer inertia in North America and Australia requires sustained ground sales investment."
    claimRefs:
      - "CP003"
      - "CP010"
      - "CP012"
