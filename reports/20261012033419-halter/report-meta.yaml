companyProfile:
  summary: >-
    Halter is an Auckland-based agricultural technology company founded in 2016 that sells solar-powered GPS cattle
    collars and companion software for virtual fencing, herd movement, pasture management, and animal monitoring. The
    company reports one million collars sold, more than 2,000 customer farms and ranches across New Zealand, Australia,
    and the United States, and a 2026 direct-to-satellite release that removed the need for on-ranch radio towers.
    Public evidence still leaves private unit economics, governance, durability, and welfare validation unresolved.
