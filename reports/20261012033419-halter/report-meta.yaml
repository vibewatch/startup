  topStrengths:
    - Category-leading livestock operating platform with one million collars and 2,000+ public customer disclosures.
    - Direct-to-satellite connectivity removes on-ranch tower dependency and expands remote deployment reach.
    - Strong capital backing from premier investors gives Halter meaningful runway for product and geographic expansion.
  topRisks:
    - Private ARR, gross margin, retention, and cap table economics remain undisclosed.
    - Reliability, incident history, security, and welfare durability are still not independently underwritten.
    - The $2B valuation leaves little margin of safety if expansion or margin realization slows.
  unresolvedGaps:
    - Audited ARR, revenue mix, gross margin, and retention by cohort.
    - Cap table, preference stack, dilution, and waterfall detail.
    - Independent long-duration welfare, incident-rate, and complaint data across production environments.
