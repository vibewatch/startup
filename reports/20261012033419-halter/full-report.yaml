              - CO007
              - CO008
      - number: '1.4'
        title: Operational Scale, Strategic Milestones, and Regulatory Horizon
        blocks:
          - type: paragraph
            body: >-
              Since its commercial launch in 2021, Halter has scaled its operational footprint across New Zealand,
              Australia, and the United States, surpassing one million smart collars sold to more than 2,000 pasture
              farmers and ranchers. Global headcount has expanded to exceed 500 personnel, supported by engineering
              facilities in Auckland and commercial field offices in Melbourne, Australia and Boulder, Colorado. In
              April 2026, Halter achieved a major technological milestone by introducing direct-to-satellite collar
              connectivity powered by SpaceX's Starlink network, eliminating the dependency on ground-based radio
              communication towers and expanding addressable beef cattle rangeland in the western United States.
              Nevertheless, international expansion faces jurisdictional regulatory dynamics. While state regulators in
              Victoria and New South Wales recently approved virtual fencing using electrical collar cues, animal
              welfare legislation in Europe and prospective markets like the United Kingdom and Ireland requires
              localized validation, representing a critical operational dependency as Halter deploys Series E growth
              capital.
            claimRefs:
              - CO009
              - CO010
              - CO013
              - CO014
              - CO015
