chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Operating Model
        blocks:
          - type: paragraph
            body: >-
              Founded in Auckland, New Zealand in 2016 by former Rocket Lab engineer Craig Piggott, Halter operates as
              an agricultural technology company transforming livestock pasture management through digital hardware and
              automation. The company is registered under the corporate entity HALTER LIMITED and maintains primary
              corporate headquarters on Sale Street in Auckland. Halter's core product architecture replaces traditional
              physical fencing infrastructure with solar-powered smart GPS collars worn by cattle, combined with mobile
              and cloud software. By issuing automated acoustic and vibration guidance cues—paired with low-energy
              electrical pulses only when an animal attempts to cross a virtual perimeter—the system trains livestock to
              respect dynamic grazing boundaries drawn on a smartphone app. This enables dairy farmers and beef ranchers
              to execute precision rotational grazing, shift herds remotely between paddocks without physical labour or
              farm dogs, and maintain 24/7 pasture visibility. In March 2026, Halter achieved unicorn status following a
              Series E financing round that valued the business at US$2.0 billion, establishing it as one of New
              Zealand's highest-valued deeptech startups.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Dynamics
        blocks:
          - type: paragraph
            body: >-
              Halter was conceived and is led by founder and chief executive officer Craig Piggott, who grew up on a
              Waikato dairy farm before earning a first-class honours degree in mechanical engineering from the
              University of Auckland. Piggott's early career at Rocket Lab under founder Peter Beck provided the
              operational blueprint for building complex, mission-critical hardware systems in New Zealand. Beck became
              an essential early mentor, seed investor, and board member, helping broker Halter's initial US$8 million
              Series A financing in 2018 with Silicon Valley venture capital firm Founders Fund. Governance remains
              closely held between founders, key technical leadership, and representatives from leading institutional
              investment firms, including Founders Fund partner Amin Mirzadegan. Because Halter remains a privately held
              corporation, statutory reporting obligations are limited, and comprehensive cap table mechanics and
              executive committee compositions are not publicly disclosed. Piggott remains the primary public face and
              key-person operational driver of the company's product trajectory, international expansion strategy, and
              fundraising momentum.
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO007
      - number: '1.3'
        title: Capitalization History, Valuation Progression, and Cap Table Syndicate
        blocks:
          - type: paragraph
            body: >-
              Halter's capital structure has expanded through five institutional financing rounds since 2018,
              accumulating more than US$401 million in total equity funding. In June 2025, Bond Capital led a US$100
              million Series D round that established Halter's initial US$1.0 billion unicorn valuation. Just nine
              months later, in March 2026, Founders Fund returned to lead a landmark US$220 million Series E round
              (denominated as NZ$377 million in domestic press and A$314.5 million in Australia), doubling Halter's
              post-money valuation to US$2.0 billion. The round featured continued backing from long-term syndicate
              partners, including Bessemer Venture Partners, Blackbird Ventures, DCVC, NewView Capital, Promus Ventures,
              and Icehouse Ventures. Halter commercializes its technology through a recurring subscription model,
              charging between US$5 and US$8 per cow per month alongside upfront capital fees for on-farm base station
              towers. While third-party investment newsletters estimate annualized recurring revenue in the range of
              US$70 million to US$100 million based on collar deployment volumes, audited income statements, gross
              margins, and retention figures remain undisclosed.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
