  - id: TV002
    title: Thesis / Anti-Thesis Comparison Table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Thesis-Break / View-Change Trigger
    rows:
      - - Market & Category Creation
        - >-
          Direct-to-satellite smart collars unlock vast pasture ranches without terrestrial cellular towers, expanding
          the addressable ranching market
        - >-
          The global virtual fencing market ($1.8B in 2025) is currently smaller than Halter's $2.0B post-money private
          valuation
        - >-
          Acceleration of global market adoption beyond $3B or entrant commoditization by established farm equipment
          incumbents
      - - Unit Economics & Pricing
        - >-
          Hardware-enabled SaaS model with subscription pricing from NZ$9.90/cow/month generates high-margin recurring
          software revenue
        - >-
          Capital intensity of manufacturing and replacing solar GPS collars across 1M+ animals may suppress blended
          gross margins below software norms
        - >-
          Independent proof of sustained >70% software gross margin and net retention >120% across multi-year dairy/beef
          cohorts
      - - US Expansion Traction
        - >-
          Rapid US adoption with 60,000 miles of virtual fencing built and 150+ ranchers across 18 states demonstrates
          American product-market fit
        - >-
          US operations lean predominantly on extensive beef ranching, whereas Halter's mature high-margin
          product-market fit was established in intensive New Zealand dairy
        - >-
          Failure to successfully introduce and scale high-value dairy health and fertility features in North American
          operations
      - - Competitive Moat & Capitalization
        - >-
          Deep tech AI cowgorithm and $421M cumulative funding create an insurmountable capital barrier against
          sub-scale competitors like Nofence
        - >-
          Large agricultural conglomerates (Merck/Vence, Gallagher) possess entrenched global distribution networks and
          aggressive bundled pricing
        - >-
          Substantial market share loss or pricing erosion triggered by competing satellite-enabled virtual fencing
          collars
    notes: >-
      Comparison of core investment pillars against operational and valuation counterarguments evaluated during
      diligence.
