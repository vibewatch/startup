      - number: '5.2'
        title: Hardware Architecture and Satellite Connectivity Model
        blocks:
          - type: paragraph
            body: >-
              The physical layer is a solar-powered collar that Halter describes as weather-resistant, dust-sealed,
              ergonomic, and capable of delivering audio and vibration cues. The public material does not specify
              battery capacity, component suppliers, sensor bill of materials, satellite constellation, or service-level
              targets. Halter's April 2026 release says earlier collars depended on proprietary long-range radio towers;
              direct-to-satellite collars instead communicate with the cloud without on-ranch towers or cellular
              coverage where the sky is visible. That is a material deployment simplification, especially for remote
              land, but the stated 2.5-times expansion in U.S. beef-market coverage is Halter's internal model rather
              than an independent benchmark. Terrain-level packet delivery, latency, outage behavior, and fallback
              procedures remain diligence items.
