      - number: '6.3'
        title: Named Customer Deployments and Operating Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer deployments provide concrete operational validation of Halter's technology in
              commercial production environments. In the United States, High Lonesome Ranch in western Colorado deployed
              Halter's direct-to-satellite virtual fencing collars across 225,000 acres of remote, complex mountain
              rangeland, validating that cattle can be contained and monitored without ground infrastructure, cell
              towers, or constant manual horseback supervision. In New Zealand dairy farming, an independent farm study
              conducted by AgFirst and Transform Agri across 10 commercial dairy operations using Halter demonstrated
              measurable agronomic and economic benefits, including an average 13.2% increase in farm profit before tax,
              an 8.9% increase in total pasture harvested, and a 9.5% improvement in milk solids produced per hectare.
              Additionally, Halter's technology integration with AWS IoT Core and FreeRTOS illustrates enterprise-scale
              IoT telemetry processing for large-scale herd movements and over-the-air firmware deployments. Despite
              these compelling deployment case studies, reference customer evidence remains concentrated among
              progressive early adopters, and comprehensive long-term data regarding device attrition or collar
              replacement costs under severe weather conditions remains undisclosed.
            claimRefs:
              - CU009
              - CU010
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
