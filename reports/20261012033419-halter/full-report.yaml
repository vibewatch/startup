      - number: '5.4'
        title: Commercial Deployment, Field Validation, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Commercial maturity is supported by multiple public indicators, though most underlying counts originate
              with Halter. Two independent agriculture publications report more than 2,000 farmers or ranchers and about
              one million collars across New Zealand, Australia, and the United States; Halter repeats those figures in
              its satellite release. Wikipedia's sourced chronology records commercial operation in Tasmania from 2022
              and a U.S. launch in 2024. Halter's release also presents High Lonesome Ranch as an early satellite
              deployment across 225,000 acres, which demonstrates deployment scope but remains company-selected customer
              proof. The evidence set contains no independent fleet reliability statistics, incident history,
              animal-welfare assessment, security or privacy documentation, uptime record, recall data, or
              support-service levels. Scale therefore supports product maturity, while production resilience and control
              quality remain unverified.
