      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Forward Funding Requirements
        blocks:
          - type: paragraph
            body: >-
              In March 2026, Halter secured US$220 million (approximately NZ$377 million) in Series E venture financing
              led by Founders Fund, with participation from major institutional backers including Blackbird, DCVC, Bond,
              and Bessemer Venture Partners. The round established a post-money valuation of US$2.0 billion, doubling
              the company's valuation from its US$1.0 billion Series D round completed in June 2025. Cumulative equity
              capital raised now stands at approximately US$401 million. Halter has earmarked this capital balance to
              fund commercial geographic expansion into the United Kingdom, Ireland, and South American pastoral
              markets, alongside an aggressive hiring campaign exceeding 200 new engineering, product, and customer
              support roles centered at its Auckland headquarters. Given that Halter must manufacture hardware units
              ahead of revenue recognition across more than 2,000 customer ranches, the Series E proceeds provide
              critical balance-sheet insulation against the working capital demands of accelerating global collar
              deployments.
            claimRefs:
              - CI005
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial Verdict, Revenue Quality, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Halter demonstrates category-defining commercial traction within pasture-based agriculture, backed by
              impressive customer retention and defensible switching costs once physical fences are removed. Outside
              analyst estimates place annualized recurring revenue between US$70 million and US$100 million based on one
              million deployed collars. However, from an underwriting perspective, entry at a US$2 billion valuation
              implies a premium multiple exceeding 20x ARR. This multiple leaves minimal margin of safety if
              international regulatory approvals face delays or if agricultural commodity downcycles in milk payouts and
              beef prices pressure farm operating budgets. Furthermore, because Halter operates as a private company
              without published financial statements, critical underwriting parameters remain obscured. Confirmatory
              financial diligence must prioritize obtaining audited income statements, cohort-level net revenue
              retention schedules, hardware unit payback horizons, and the full capital structure waterfall.
            claimRefs:
              - CI006
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware-as-a-Service Working Capital Dynamics
            body: >-
              While bundled per-cow subscriptions eliminate farmer adoption hurdles and produce predictable recurring
              revenue, Halter must finance collar manufacturing costs upfront. Working capital absorption scales
              directly with collar deployment volume, requiring substantial equity funding until subscription inflows
              achieve self-sustaining cash amortisation.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI012
          - type: callout
            title: Valuation Vulnerability to Growth and Margin Realization
