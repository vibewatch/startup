      - number: '6.2'
        title: Adoption Trajectory and Geographic Deployment Velocity
        blocks:
          - type: paragraph
            body: >-
              Halter's commercial adoption metrics demonstrate accelerating physical deployment velocity across its core
              operational markets. The company reports serving over 2,000 commercial ranchers and dairy farmers across
              New Zealand, Australia, and the United States, representing a cumulative total of one million
              solar-powered smart cattle collars sold globally. In the United States market, where Halter established
              commercial operations in 2024, adoption velocity has accelerated sharply: American beef ranchers
              constructed over 60,000 miles of virtual fencing using Halter's software platform by March 2026, expanding
              rapidly from 11,000 miles reported in November 2025. This steep adoption curve reflects the rapid
              transition of beef operators from initial pasture pilots to whole-herd deployments. To expand its
              addressable footprint across expansive Western rangelands that lack cellular coverage, Halter introduced
              direct-to-satellite collar connectivity, which company internal modeling estimates expands addressable
              coverage of the U.S. beef cattle market by 2.5x. Nevertheless, outside the aggregate collar unit
              milestone, Halter does not report active collar utilization rates, collar deactivations, or seasonal churn
              figures, leaving the net active paying animal base unverified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU008
              - CU011
          - type: table
