  - id: TV003
    title: Bull / Base / Bear Valuation Scenarios
    columns:
      - Scenario
      - Key Operating Assumptions
      - Valuation & Multiple Logic
      - Downside & Execution Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Direct-to-satellite collars drive rapid US beef and dairy adoption; ARR expands to $200M+ with sustained 75%
          gross margins and low churn
        - $3.5B-$4.0B valuation at 18x-20x ARR multiple; attractive path to high-multiple agtech IPO or strategic buyout
        - Collar hardware failure rates or Starlink connectivity bottlenecks in remote pastures
        - 20% probability (requires flawless US execution and category expansion)
      - - Base Case
        - >-
          Steady international adoption reaches $120M-$140M ARR; subscription pricing holds across New Zealand,
          Australia, and selected US regions
        - >-
          $1.8B-$2.2B valuation at 14x-16x ARR multiple; valuation remains flat to slightly positive relative to Series
          E mark
        - Lengthened sales cycles among conservative ranchers and moderating livestock commodity prices
        - 55% probability (reflects solid core momentum offset by rich entry multiple)
      - - Bear Case
        - >-
          US beef expansion stalls; collar replacement costs and high rural support overhead compress gross margins; ARR
          stagnates at $80M-$90M
        - >-
          $900M-$1.1B valuation at 10x-12x ARR multiple; down-round risk or structured liquidation preference overhang
          for junior investors
        - >-
          Severe multiple compression to agricultural machinery norms (2x-4x revenue) and customer churn during farm
          downturns
        - 25% probability (underscores vulnerability of 22x multiple to execution slips)
      - - Downside Threshold
        - >-
          Catastrophic hardware recall, regulatory ban on shock/audio training collars, or major herd containment
          failure
        - <$500M salvage/asset sale; severe capital loss across Series D and Series E preferred equity
        - Regulatory interventions on animal welfare grounds or irreversible farmer trust deficit
        - Low tail-risk (<5%), but constitutes primary kill criterion for diligence monitoring
    notes: >-
      Probability-weighted scenario analysis projecting exit valuations and ARR multiple sensitivities across operating
      outcomes.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV010
      - CV014
      - CV015
