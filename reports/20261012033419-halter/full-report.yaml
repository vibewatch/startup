  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: System Definition and Customer Operational Workflow
        blocks:
          - type: paragraph
            body: >-
              Halter's customer-facing system pairs a solar-powered cattle collar with a mobile application. The app
              lets an operator create virtual fences, initiate herd shifts, review animal locations, and use pasture and
              animal information in daily decisions. Halter says its Cowgorithm trains cattle to respond to directional
              audio cues, while independent coverage also describes collars using sound and vibration signals. This
              creates a closed operating workflow: the user defines an intended movement or grazing boundary, the collar
              supplies guidance, collar data returns to Halter's platform, and the app presents current conditions.
              Public sources establish the advertised workflow, not comparative containment performance, labor savings
              across representative farms, or the frequency with which a person must intervene.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE010
