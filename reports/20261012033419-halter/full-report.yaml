  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Substituted Spend
        blocks:
          - type: paragraph
            body: >-
              Halter operates at the intersection of precision agricultural IoT hardware and recurring livestock
              operating software. The addressable market boundary is fundamentally defined by pasture-based bovine
              grazing systems, encompassing intensive dairy farming and extensive beef cattle ranching operations. In
              these operational environments, farmers and ranchers allocate forage acreage, establish rotational grazing
              breaks, muster herds to milking parlours or handling facilities, and monitor animal reproductive and
              physical health. Halter's value proposition substitutes for significant categories of legacy operational
              spend, including the physical construction and ongoing maintenance of permanent post-and-wire fencing,
              temporary electric tape reels, dedicated all-terrain vehicle mustering fuel, and seasonal agricultural
              labour. Conversely, the market boundary strictly excludes intensive indoor feedlot operations and
              non-bovine confined livestock facilities, where animals remain stationary in pens and pasture allocation
              technology provides no functional utility.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM011
      - number: '2.2'
        title: Addressable Market Sizing Across Multiple Operational Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Halter's addressable market requires decomposing broad macro cattle aggregates into
              economically serviceable pasture cohorts. Worldwide, the bovine inventory stands at approximately 1.5
              billion head, representing a theoretical top-down expenditure pool exceeding $100 billion if evaluated
              against Halter's prevailing $5 to $8 monthly per-cow subscription fee. However, commercial diligence
              demands narrowing this theoretical total into accessible commercial herds. In Halter's initial launch
              markets across New Zealand, Australia, and the United States, as well as announced expansion targets in
              the United Kingdom and Ireland, the addressable commercial pasture herd totals approximately 120 million
              head, yielding a serviceable addressable market of roughly $8.6 billion annually. Within New Zealand,
              Halter has already achieved notable commercial density, capturing approximately one in ten cattle farms.
              The commercial rollout of direct-to-satellite smart collars in 2026 expands Halter's accessible US beef
              cattle TAM by 2.5 times by eliminating on-ranch communications infrastructure barriers. With 1.0 million
              cumulative collars sold across more than 2,000 customers, Halter has established an initial foothold
              representing under one percent of global cattle inventories.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
