      - number: '5.3'
        title: Applied AI, The Cowgorithm, and Herd Intelligence
        blocks:
          - type: paragraph
            body: >-
              Halter describes a cloud data platform and machine-learning layer behind the collars and app. Its
              technology page says each collar sends more than 6,000 data points per minute and that the company has
              collected more than 7 billion hours of animal-behavior data. Those are company-reported scale metrics; the
              assigned evidence does not disclose the denominator, storage convention, training-set composition,
              validation method, or model error rates. The current product surface includes heat detection, behavior
              monitoring, grazing and rumination indicators, pasture features, and location tracking. A company-authored
              job listing adds a useful practitioner signal: Halter is building shared mobile and web design
              foundations, including code-based component libraries and a Figma-to-code connection, with legibility and
              target sizing shaped by field conditions. It does not reveal the production stack or security
