      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Service Delivery
        blocks:
          - type: paragraph
            body: >-
              The economics of Halter's hardware-enabled subscription model differ substantially from pure-play
              enterprise software. Because Halter finances collar manufacturing upfront, rapid expansion absorbs
              substantial working capital that must be recovered across multi-year customer subscription lifecycles.
              Customer adoption is primarily catalyzed by acute labor scarcity across dairy and beef operations, where
              farmers report labor savings equivalent to one full-time employee per 400 cows and pasture utilization
              improvements of 15% to 20%. Field distribution is executed through direct regional sales representatives
              and customer success teams who oversee onboarding, collar fitting, and boundary mapping. While
              direct-to-satellite collars eliminate radio tower manufacturing and installation labor, they introduce
              recurring satellite bandwidth carrier fees. Halter does not publicly disclose its gross margin breakdown,
              bill-of-materials manufacturing costs, or customer acquisition payback periods, leaving these core
              unit-economic variables as vital diligence items for institutional underwriters.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
