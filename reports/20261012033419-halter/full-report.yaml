  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Operating Economics
        blocks:
          - type: paragraph
            body: >-
              Halter's customer base divides into two distinct operational segments: intensive pasture-based dairy
              operations primarily in New Zealand and Tasmania, and extensive rangeland beef cattle ranches across the
              western United States and Australia. In the dairy segment, the primary buyer and user is the
              owner-operator or herd manager seeking to automate daily pasture allocation, eliminate physical break
              fencing, detect lameness and heat events, and maximize pasture harvest efficiency per hectare. In
              contrast, extensive beef ranchers operate across vast, rugged acreages—often spanning hundreds of
              thousands of acres—where installing and maintaining physical post-and-wire fencing is cost-prohibitive or
              physically impossible. For beef producers, Halter's economic value proposition centers on labor savings,
              remote herd movement across topographically complex terrain, enhanced pasture utilization, and drought or
              rotational grazing management without requiring on-farm cellular or radio tower infrastructure. However,
              while commercial messaging highlights transformational operational productivity, Halter does not disclose
              audited contract lengths, annual recurring revenue (ARR) breakdown by customer tier, or gross revenue
              retention (GRR) metrics across these distinct operating profiles.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
