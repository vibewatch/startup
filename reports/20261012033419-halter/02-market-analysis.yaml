callouts:
  - calloutType: insight
    title: Direct-to-Satellite Connectivity Unlocks Rangeland Beef TAM
    body: The April 2026 introduction of direct-to-satellite smart collar connectivity via Starlink represents a pivotal inflection for Halter's addressable market. While dairy adoption was enabled by on-farm LoRaWAN gateway towers across compact paddocks, extensive beef cattle operations across hundreds of thousands of rangeland acres were previously unserviceable due to terrain and line-of-sight constraints. Management's 2.5x expansion of accessible US beef cattle demonstrates how satellite integration converts previously stranded rangeland acreage into active virtual grazing territory.
    claimRefs:
      - CM002
      - CM005
      - CM008
  - calloutType: risk
    title: Working Capital Drag and Incomplete Activation Disclosures
    body: Halter's hardware-enabled software-as-a-service model provides operational stickiness and strong retention once deployed, but imposes high upfront capital expenditure for manufacturing and deploying collars ahead of multi-year subscription payback. Furthermore, company disclosures report 1.0 million cumulative collars sold and 2,000 customer operations, leaving investors to estimate active herd utilization versus unactivated inventory. Until audited active collar cohorts are verified, top-line revenue estimates remain subject to material activation uncertainty.
    claimRefs:
      - CM008
      - CM009
      - CM012
      - CM015
