  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: collar-activation-vs-shipments
      missingEvidence: Audited breakdown distinguishing cumulative manufactured or sold collars (1 million claimed) from active, billing on-cow collar subscriptions and monthly churn.
      whyItMatters: Without active collar retention and utilization data, annual recurring revenue and effective addressable penetration cannot be independently validated.
      diligencePath: Request company management cohort retention schedules, active device telemetry reports, and billing ARR schedules by operating geography.
      relatedQuestionRefs:
        - QM009
    - type: missing-source
      severity: minor
      topic: pastoral-beef-addressable-herd-census
      missingEvidence: Standardized regional census isolating rangeland beef cattle grazing on extensive unfenced pasture from feedlot finished cattle in target export markets.
      whyItMatters: Broad national cattle inventory statistics overstate immediate virtual fencing SAM by including cattle held in confined animal feeding operations.
      diligencePath: Examine USDA NASS grazing cattle census tables and Australian ABARES livestock farm survey data for rangeland herd breakdowns.
