      secondary transaction terms across Series A through Series E rounds.
    whyItMatters: >-
      Disclosed filings reveal lead institutional investors but omit precise equity percentages, voting control, and
      preferred share rights.
    diligencePath: >-
      Inspect New Zealand Companies Office statutory filings and request Halter's cap table waterfall model from
      management.
    relatedQuestionRefs:
