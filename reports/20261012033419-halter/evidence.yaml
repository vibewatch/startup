  - type: private-evidence-only
    severity: material
    topic: private-financial-metrics
    missingEvidence: >-
      Audited financial statements confirming Halter's recognized ARR, subscription gross margin, customer cohort
      retention, and cash burn.
    whyItMatters: >-
      A US$2 billion valuation implies a rich 20x-28x multiple on estimated $70M-$100M ARR; without audited figures,
      unit economics and margin durability cannot be confirmed.
    diligencePath: >-
      Request confidential management financial disclosures, audited revenue by geography, and cohort churn reports
      under NDA during formal diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
