figures:
- id: FU001
  title: Pastoral Customer Journey and Value Expansion Loop
  type: journey-map
  summary: Customer lifecycle across pasture-based operations from pain point identification and virtual fence pilot to whole-herd
    satellite automation and data expansion.
  data:
    items:
    - label: Operational Friction
      touchpoints:
      - Labor shortage and rising fencing materials expense
      - Topographical barriers to physical fencing across remote pasture
    - label: Pilot Adoption
      touchpoints:
      - Initial herd collar deployment on high-value paddock
      - Farmer training on mobile application and virtual boundary mapping
    - label: Core Production Use
      touchpoints:
      - Automated daily grazing shifts and elimination of reels/standards
      - Direct-to-satellite connectivity eliminating on-farm base station maintenance
    - label: Expansion & Data Integration
      touchpoints:
      - Whole-herd collaring across entire operational land base
      - Integration of pasture dry-matter analytics and heat/health detection
    - label: Renewal & Durability
      touchpoints:
      - Annual recurring hardware-software fee evaluation against farm margins
      - Retention risks tied to agricultural commodity price cycles and hardware wear
    - label: Ecosystem Lock-In
      touchpoints:
      - Permanent transition of grazing records and herd habits to Halter OS
      - Operational dependency creating substantial switching friction
  approximationNotes: Journey stages synthesized from customer workflow case studies, AWS implementation architectures, and
    investment diligence analysis.
