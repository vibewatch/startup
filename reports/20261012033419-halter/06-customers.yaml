company:
  name: Halter
chapter:
  number: 6
  title: Customers
  summary: Halter has achieved demonstrable commercial adoption across pasture-based dairy and extensive beef grazing operations,
    deploying over one million solar-powered collars across more than 2,000 ranches and farms in New Zealand, Australia, and
    the United States. While U.S. ranchers have deployed 60,000 miles of virtual fencing and independent New Zealand studies
    indicate farm operating profit gains of 13.2%, the customer base faces significant diligence gaps regarding audited cohort
    retention, contract duration, customer concentration, and economic durability under agricultural commodity cycles.
sections:
- id: customer-segmentation-and-buyer-economics
  title: Customer Base Segmentation and Operating Economics
  body: 'Halter''s customer base divides into two distinct operational segments: intensive pasture-based dairy operations
    primarily in New Zealand and Tasmania, and extensive rangeland beef cattle ranches across the western United States and
    Australia. In the dairy segment, the primary buyer and user is the owner-operator or herd manager seeking to automate
    daily pasture allocation, eliminate physical break fencing, detect lameness and heat events, and maximize pasture harvest
    efficiency per hectare. In contrast, extensive beef ranchers operate across vast, rugged acreages—often spanning hundreds
    of thousands of acres—where installing and maintaining physical post-and-wire fencing is cost-prohibitive or physically
    impossible. For beef producers, Halter''s economic value proposition centers on labor savings, remote herd movement across
    topographically complex terrain, enhanced pasture utilization, and drought or rotational grazing management without requiring
    on-farm cellular or radio tower infrastructure. However, while commercial messaging highlights transformational operational
    productivity, Halter does not disclose audited contract lengths, annual recurring revenue (ARR) breakdown by customer
    tier, or gross revenue retention (GRR) metrics across these distinct operating profiles.'
  claimRefs:
  - CU001
  - CU004
  - CU005
  - CU006
  - CU012
  - CU013
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-deployment-scale
  title: Adoption Trajectory and Geographic Deployment Velocity
  body: 'Halter''s commercial adoption metrics demonstrate accelerating physical deployment velocity across its core operational
    markets. The company reports serving over 2,000 commercial ranchers and dairy farmers across New Zealand, Australia, and
    the United States, representing a cumulative total of one million solar-powered smart cattle collars sold globally. In
    the United States market, where Halter established commercial operations in 2024, adoption velocity has accelerated sharply:
    American beef ranchers constructed over 60,000 miles of virtual fencing using Halter''s software platform by March 2026,
    expanding rapidly from 11,000 miles reported in November 2025. This steep adoption curve reflects the rapid transition
    of beef operators from initial pasture pilots to whole-herd deployments. To expand its addressable footprint across expansive
    Western rangelands that lack cellular coverage, Halter introduced direct-to-satellite collar connectivity, which company
    internal modeling estimates expands addressable coverage of the U.S. beef cattle market by 2.5x. Nevertheless, outside
    the aggregate collar unit milestone, Halter does not report active collar utilization rates, collar deactivations, or
    seasonal churn figures, leaving the net active paying animal base unverified.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU007
  - CU008
  - CU011
  tableRefs:
  - TU002
- id: named-customer-proof-and-operating-outcomes
  title: Named Customer Deployments and Operating Outcomes
  body: Publicly verifiable customer deployments provide concrete operational validation of Halter's technology in commercial
    production environments. In the United States, High Lonesome Ranch in western Colorado deployed Halter's direct-to-satellite
    virtual fencing collars across 225,000 acres of remote, complex mountain rangeland, validating that cattle can be contained
    and monitored without ground infrastructure, cell towers, or constant manual horseback supervision. In New Zealand dairy
    farming, an independent farm study conducted by AgFirst and Transform Agri across 10 commercial dairy operations using
    Halter demonstrated measurable agronomic and economic benefits, including an average 13.2% increase in farm profit before
    tax, an 8.9% increase in total pasture harvested, and a 9.5% improvement in milk solids produced per hectare. Additionally,
    Halter's technology integration with AWS IoT Core and FreeRTOS illustrates enterprise-scale IoT telemetry processing for
    large-scale herd movements and over-the-air firmware deployments. Despite these compelling deployment case studies, reference
    customer evidence remains concentrated among progressive early adopters, and comprehensive long-term data regarding device
    attrition or collar replacement costs under severe weather conditions remains undisclosed.
  claimRefs:
  - CU009
  - CU010
  - CU014
  - CU015
  tableRefs:
  - TU003
- id: retention-concentration-and-commercial-durability
  title: Customer Retention, Concentration, and Durability Risks
  body: Underwriting the long-term durability of Halter's customer relationships reveals material diligence vulnerabilities
    typical of high-growth agtech platforms. While early investor commentary highlighted seven consecutive months of zero
    customer churn during initial rollouts, Halter does not publish standardized SaaS durability metrics such as net revenue
    retention (NRR), gross revenue retention (GRR), customer acquisition cost (CAC) payback periods, or cohort-level renewal
    schedules. Furthermore, customer concentration risks and agricultural macro cycles present unhedged headwinds. Pasture-based
    livestock operations are exposed to cyclical beef and dairy commodity price shocks, severe drought events, and regional
    climatic pressures, which could prompt highly leveraged farming operations to reduce discretionary per-cow subscription
    overhead. Because Halter bundles hardware access and cloud management into recurring monthly per-animal fees ranging between
    US$5 and US$10 per cow, prolonged agricultural downturns could test farmer willingness to sustain ongoing software expenditures,
    especially if physical fences remain available as zero-marginal-cost legacy infrastructure.
  claimRefs:
  - CU006
  - CU012
  - CU013
  - CU016
