callouts:
- calloutType: insight
  title: Adoption Velocity Outpaces Underwriting Visibility
  body: Halter has demonstrated rare commercial adoption in the traditionally conservative agriculture sector, scaling from
    11,000 to 60,000 miles of virtual fencing in the U.S. in five months and selling one million collars. However, because
    Halter remains private and does not report audited retention cohorts or net active paying cows, investors must distinguish
    between cumulative hardware shipments and durable recurring software revenue.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU006
  - CU011
- calloutType: risk
  title: Durability Headwinds in Cyclical Livestock Markets
  body: Livestock producers operate under volatile cyclical commodity margins. With Halter charging recurring monthly subscription
    fees of $5 to $10 per cow, severe downturns in beef or dairy payout prices could pressure farm cash flows and trigger
    collar deactivations, representing an unhedged customer concentration and durability risk for the business model.
  claimRefs:
  - CU006
  - CU012
  - CU013
  - CU016
