callouts:
  - calloutType: insight
    title: Aerospace Systems Rigor Applied to Livestock Operations
    body: >-
      Halter's hardware design and operating culture trace directly to founder Craig Piggott's early tenure at Rocket
      Lab under Peter Beck, establishing high engineering tolerances for solar-powered ruggedized devices that must
      endure multi-year outdoor farm conditions without battery degradation.
    claimRefs:
      - CO002
      - CO003
      - CO013
  - calloutType: risk
    title: Jurisdictional Regulatory Fragmentation Across Pasture Markets
    body: >-
      Although market openings in New South Wales and Victoria validate commercial appetite for virtual fencing,
      animal-welfare statutory scrutiny regarding electrical cues across European jurisdictions like the United Kingdom
      and Ireland remains an unresolved hurdle for global deployment.
    claimRefs:
      - CO014
      - CO015
