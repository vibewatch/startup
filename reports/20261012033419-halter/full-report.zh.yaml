        title: 客户群分层与运营经济
        blocks:
          - type: paragraph
            body: >-
              Halter
              的客户群分为两个不同的运营细分：主要位于新西兰和塔斯马尼亚的集约化牧场奶牛业务，以及遍布美国西部和澳大利亚的粗放式牧区肉牛牧场。在奶牛细分中，主要买方和使用者是农场主兼经营者或牛群经理，他们希望自动化每日牧场分配、取消实体分隔围栏、发现跛行和发情事件，并最大化每公顷牧草收获效率。相比之下，粗放式肉牛牧场经营者在广阔崎岖的土地上运营，面积常达数十万英亩，安装和维护木桩铁丝围栏的成本过高，甚至在物理上不可行。对肉牛生产者而言，Halter
              的经济价值集中在节省劳动力、让牛群远程穿越复杂地形、提高牧草利用率，以及无需现场蜂窝或无线电塔即可进行抗旱或轮牧管理。不过，尽管商业宣传强调生产力的改变，Halter 并未披露经审计的合同期限、按客户层级划分的
