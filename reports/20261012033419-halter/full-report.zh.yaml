        - 硬件赋能的 SaaS 模式按 NZ$9.90/头牛/月订阅，产生高毛利经常性软件收入
        - 为超过 1M+ 头牲畜制造和更换太阳能 GPS 项圈的资本密集度，可能把综合毛利率压低到软件行业常态以下
        - 独立证据证明多年乳业 / 肉牛队列的软件毛利率持续超过 70%，净留存率超过 120%
      - - 美国扩张进展
        - 美国采用迅速，已建成 60,000 英里的虚拟围栏，覆盖 18 个州的 150 多名牧场主，证明了美国市场的产品契合度
        - 美国业务主要依赖粗放型肉牛牧场，而 Halter 成熟的高毛利产品契合度是在新西兰集约化乳业中建立的
        - 未能在北美业务中成功引入并扩大高价值乳业健康和繁殖功能
      - - 竞争壁垒与资本化
        - 深度科技 AI cowgorithm 和累计 $421M 融资，为 Nofence 等规模不足的竞争者筑起难以逾越的资本壁垒
        - 大型农业集团（Merck/Vence、Gallagher）拥有根深蒂固的全球分销网络和激进的捆绑定价
        - 竞争对手推出卫星赋能虚拟围栏项圈，导致市场份额大幅流失或价格下滑
    notes: 对比尽调中评估的核心投资支柱与运营和估值反论。
    claimRefs:
