              网络推出直连卫星的项圈通信，摆脱地面无线电通信塔，并扩大了美国西部肉牛牧区的可服务市场。不过，国际扩张仍受各司法辖区监管环境影响。维多利亚州和新南威尔士州监管机构近期批准了使用电脉冲项圈的虚拟围栏，但欧洲以及英国、爱尔兰等潜在市场的动物福利法规要求本地化验证；随着
              Halter 投入 Series E 增长资本，这成为关键运营依赖。
