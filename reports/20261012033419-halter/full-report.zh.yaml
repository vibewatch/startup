        title: 管理层、治理与关键人物动态
        blocks:
          - type: paragraph
            body: >-
              Halter 由创始人兼 CEO Craig Piggott 创建并领导。Piggott 在 Waikato 奶牛场长大，之后以机械工程一等荣誉学位毕业于奥克兰大学。他早年在创始人 Peter Beck 领导的
              Rocket Lab 工作，那里为他在新西兰打造复杂、任务关键型硬件系统提供了运营范本。Beck 后来成为 Halter 早期的重要导师、种子投资人和董事，并帮助公司在 2018 年与硅谷风投 Founders
              Fund 撮合了首轮 $8M 的 Series A 融资。公司治理仍集中在创始人、技术核心管理层和领先机构投资者代表手中，其中包括 Founders Fund 合伙人 Amin Mirzadegan。由于
              Halter 仍是私有公司，其法定披露义务有限，完整的股权结构表机制和执行委员会构成没有公开披露。Piggott 仍是公司的主要公开代表，也是产品路线、国际扩张策略和融资势头的关键运营驱动者。
