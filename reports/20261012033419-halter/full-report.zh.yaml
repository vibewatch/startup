      - number: '3.2'
        title: 核心能力差异化与架构
        blocks:
          - type: paragraph
            body: >-
              Halter 的核心产品差异化在于闭环控制系统：它把引导和自主执行与被动观察彻底分开。传统精准畜牧设备观察动物行为，依靠人工执行干预；Halter 的太阳能智能项圈则持续感知动物位置，并利用名为
              Cowgorithm 的行为机器学习模型，主动引导牛群沿虚拟牧场分界移动。系统用定向立体声音和确认振动训练动物移动，只有在动物忽略定向提示时，才升级为低能量电脉冲。更关键的是，Halter 于 2026 年 4
              月推出由 Starlink 驱动的直连卫星通信，解决了偏远牧区的主要基础设施瓶颈，免去了牧场 LoRaWAN 无线电塔的资本投入。部分农业企业希望掌握原始数据主权，可能会选择定制 DIY
              部署和开源农业软件；但全年太阳能采集、承受半吨动物冲击，以及边缘分类模型等物理工程难题，使内部自建系统对实际畜牧经营者并不现实。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
