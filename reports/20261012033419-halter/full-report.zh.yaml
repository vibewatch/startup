      - number: '2.2'
        title: 从多种运营视角测算可服务市场
        blocks:
          - type: paragraph
            body: >-
              评估 Halter 的可服务市场，不能只看宏观牛群总量，还要拆出经济上真正可服务的牧场客户群。全球牛存栏量约为 1.5 billion 头；按 Halter 当前每头牛每月 $5 至 $8
              的订阅费计算，理论支出池超过 $100 billion。但商业尽调必须把这一总量收窄到可触达的商业牛群。Halter 已进入新西兰、澳大利亚和美国，并宣布向英国和爱尔兰扩张；这些市场约有 120 million
              头可服务的商业牧场牛，对应约 $8.6 billion 的年可服务市场。Halter 在新西兰已形成相当的商业密度，覆盖约十分之一的养牛场。2026
              年直连卫星智能项圈商业化后，牧场不再受通信基础设施掣肘，Halter 可触达的美国肉牛 TAM 扩大 2.5 times。Halter 已向超过 2,000 个客户累计售出 1.0 million
              个项圈，初步站稳脚跟，但在全球牛存栏中的占比尚不足百分之一。
            claimRefs:
