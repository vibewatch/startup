      - number: '4.3'
        title: 资本充足性、现金消耗与未来融资需求
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月，Halter 获得由 Founders Fund 领投的 $220M（约 NZ$377M）Series E 风险融资，Blackbird、DCVC、Bond 和 Bessemer
              Venture Partners 等主要机构投资者参与。本轮融资将投后估值定为 $2.0B，是 2025 年 6 月完成的 $1.0B Series D 估值的两倍。累计股权融资现约为 $401M。Halter
              已预留这笔资本，用于向英国、爱尔兰和南美牧场市场扩张，同时在奥克兰总部大举招聘超过 200 名工程、产品和客户支持人员。由于公司必须在超过 2,000 家客户牧场实现收入确认前先制造硬件，Series E
              资金为加速全球项圈部署所需的营运资金提供了关键资产负债表缓冲。
            claimRefs:
              - CI005
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 财务判断、收入质量与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Halter 在牧场农业中展现了定义品类的商业进展，客户留存出色，实体围栏拆除后也形成了可防御的切换成本。外部分析师根据 100 万个已部署项圈估算，年化经常性收入为 $70M 至
              $100M。不过，从投资判断看，以 $2B 估值进入意味着超过 20x ARR 的高估值倍数。如果国际监管批准延迟，或牛奶支付和牛肉价格下行压缩农场运营预算，这一倍数几乎没有安全边际。此外，Halter
              是没有公开财务报表的私有公司，关键投资判断参数仍不透明。确认性财务尽调应优先获取经审计损益表、按队列划分的净收入留存表、硬件单位回本周期，以及完整资本结构瀑布表。
