              Halter 的商业采用指标显示，其核心运营市场的实体部署速度正在加快。公司称在新西兰、澳大利亚和美国服务超过 2,000 家商业牧场和奶牛场，全球累计售出 100 万个太阳能智能牛项圈。在美国市场，Halter
              于 2024 年开始商业运营，采用速度明显加快：截至 2026 年 3 月，美国肉牛牧场主使用 Halter 软件平台建成了超过 60,000 英里的虚拟围栏，较 2025 年 11 月披露的 11,000
