              - CM011
      - number: '2.4'
        title: 增长顺风、营运资金拖累与司法辖区瓶颈
        blocks:
          - type: paragraph
            body: >-
              Halter 的商业推进受到强劲宏观经济和监管长期顺风支持，但也受运营和资产负债表约束。农业工资上涨、生产者老龄化，以及对氮径流、过度放牧和河岸水道保护的环境审查趋严，推动了增长。Halter
              的项圈软件无需永久围栏即可设置动态牧场禁入区，帮助农场主向乳制品加工商和土地监管机构证明环境合规。不过，硬件订阅模式规模化会给资产负债表带来很大压力。Halter 先承担复杂太阳能 GPS
              项圈的制造和部署成本，再通过多年期月度订阅回收现金，因此需要包括 2026 年 3 月 $220M Series E
              在内的大额风险股权注入。此外，虚拟围栏面对碎片化的动物福利法规环境；虽然新西兰和北美的商业使用正在扩大，但澳大利亚大陆各州等司法辖区围绕电脉冲提示和动物训练规程的监管批准经历了漫长立法审查。
            claimRefs:
              - CM005
              - CM006
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 直连卫星连接打开牧场肉牛 TAM
            body: >-
              2026 年 4 月通过 Starlink 引入直连卫星智能项圈连接，是 Halter 可服务市场的关键拐点。奶牛养殖可以依靠紧凑牧区内的现场 LoRaWAN
              网关塔使用虚拟围栏，但此前分布在数十万英亩牧区的粗放式肉牛业务受地形和视距限制，无法获得服务。管理层称可触达的美国肉牛市场扩大 2.5 倍，说明卫星连接如何把此前闲置的牧区转化为可使用虚拟放牧的区域。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM008
          - type: callout
            title: 营运资金拖累与激活数据不完整
            body: >-
              Halter 的硬件赋能软件即服务模式一旦部署便具备运营粘性和较强留存，但在多年订阅回本前，公司必须先承担项圈制造和部署的大额资本支出。公司披露累计售出 100 万个项圈、覆盖 2,000
              个客户运营点，投资者因此只能估算实际牛群使用量与未激活库存之间的差额。在经审计的活跃项圈队列得到验证前，收入上限估算仍存在重大激活不确定性。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Halter 所处的畜牧管理解决方案市场分为三类：直接虚拟围栏开发商、相邻的精准监测供应商，以及根深蒂固的实体围栏现状。在直接虚拟围栏领域，Halter 的主要同业竞争者包括挪威的
              Nofence、Gallagher 的 eShepherd 系统和 Merck Animal Health 的 Vence。Nofence 率先在欧洲牧场为小型反刍动物和绵羊开发虚拟围栏；Gallagher
              则基于澳大利亚研究开发 eShepherd，服务粗放式牧场，并依靠百年品牌积累和全球农业设备分销渠道。与此同时，Merck Animal Health 收购
              Vence，向北美肉牛牧场提供牧区控制项圈。在相邻的精准畜牧领域，CowManager（Agis Automatisering）和 smaXtec
              等供应商通过耳部传感器或网胃胶囊监测牛的生理指标、体温和反刍情况，并接入超过 40
              个第三方牛群管理系统，但不提供定向移动或围栏能力。在所有细分市场中，木桩、高张力铁丝和临时电围栏卷盘构成的实体围栏仍是普遍的现状替代方案，尽管它带来繁重的人工劳动需求，并限制了灵活轮牧。
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
              - CP014
          - type: table
