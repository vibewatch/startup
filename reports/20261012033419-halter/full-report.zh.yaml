      - number: '3.3'
        title: 定价模式、产品打包与切换壁垒
        blocks:
          - type: paragraph
            body: >-
              Halter 与传统农场设备供应商差异明显：它把商业模式设计成纯经常性订阅，而不是一次性出售硬件。传统围栏和竞品虚拟围栏系统通常要求客户预先为项圈、基站和安装支付大额资本支出；Halter 则按每头牛每月预估
              $6 至 $10 收费。费用包含软件使用权、蜂窝或卫星连接，以及终身硬件保修；项圈或通信塔损坏、故障时，公司免费更换。这种硬件即服务模式明显降低了客户初始采用阻力，但牛群快速部署时会加重 Halter
              的营运资金压力。从客户角度看，部署后切换壁垒会迅速升高：奶牛场或肉牛牧场一旦拆除内部实体围栏，把牧场划成动态的两公顷小区，并将运营劳动力从人工赶牛中抽离，再回到铁丝围栏或同时使用多家项圈供应商，都要承担高昂的过渡劳动力和基础设施成本。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP012
      - number: '3.4'
        title: 护城河耐久性与结构性反向风险
        blocks:
          - type: paragraph
            body: >-
              Halter 的防御力主要来自专有行为训练数据集和积累的运营规模：公司已在新西兰、澳大利亚和美国超过 2,000 家商业农场部署约 100 万个项圈。Halter 已收集超过 70
              亿小时的动物行为遥测数据，算法据此优化声音训练时长并降低电脉冲发送率，形成后来者难以复制的经验数据护城河。不过，持久的结构性风险仍可能威胁其品类主导地位。Gallagher 和 Merck Animal
              Health
              等资本充足的老牌公司，与农场经销商合作社和兽医渠道保持数十年关系，可以在粗放式肉牛市场打包销售并施加价格压力。此外，虚拟围栏扩张仍易受监管碎片化影响：澳大利亚各州、欧盟和北美的动物福利机构按不同法规评估电脉冲控制，因此公司必须逐一游说，也会面临立法延迟。
            claimRefs:
              - CP008
              - CP010
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从被动监测走向闭环执行
            body: >-
              CowManager 和 smaXtec 等现有精准畜牧供应商可以深入分析单头牛的反刍和体温，但其价值仍取决于人工干预。Halter
              的架构优势在于闭合控制回路：把观察、牧场边界执行和牛群定向移动合并进一个自动化系统。
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP014
          - type: callout
            title: 企业围栏巨头的分销护城河
            body: 项圈规模和卫星连接是 Halter 的早期优势，但 Gallagher 等成熟畜牧硬件企业拥有根深蒂固的全球农场经销网络和数十年积累的品牌信任。要在北美和澳大利亚克服经销商惯性，公司需要持续投入地面销售。
            calloutType: risk
            claimRefs:
              - CP003
              - CP010
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Halter
              通过纯经常性硬件即服务模式将农业自动化平台变现：专有项圈硬件、固件和云端牧场管理软件打包成按每头佩戴项圈的动物收取的月费。公司保留实体项圈所有权，并在基础合同中提供持续维护、电池更换和软件更新。商业定价通常为每头动物每月
              $5 至 $10（每年 $60 至 $120），取决于牛群规模和套餐；外部行业分析师称，按每头动物计算的全包年订阅承诺为 $100 至 $150。除虚拟围栏和牛群移动外，Halter
              还对精准放牧、牧场产量分析和繁殖健康监测等高级功能分层收费。过去，偏远农场还需为地面无线电基站预先投入约 $10,000；但 Halter 于 2026
              年推出直连卫星项圈通信后，现场基础设施需求被取消，初始采用门槛降低，可触达的肉牛牧区也明显扩大。
