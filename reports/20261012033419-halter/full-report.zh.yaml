      - number: '4.2'
        title: 成本结构、毛利率动态与服务交付
        blocks:
          - type: paragraph
            body: >-
              Halter 的硬件订阅模式与纯企业软件的经济模型差异很大。公司先承担项圈制造成本，快速扩张会吸收大量营运资金，之后需在多年客户订阅周期内收回。奶牛和肉牛业务普遍面临严重劳动力短缺，客户报告每 400
              头牛可节省相当于一名全职员工的劳动力，牧草利用率提高 15% 至
              20%，这主要推动了客户采用。现场交付由区域直销代表和客户成功团队负责，他们监督客户上线、项圈安装和边界绘制。直连卫星项圈免去了无线电塔制造和安装人工，却带来持续性的卫星带宽运营商费用。Halter
              没有公开披露毛利率拆分、物料清单制造成本或客户获取回本周期，因此这些核心单位经济变量仍是机构投资者必须核实的尽调事项。
            claimRefs:
