  - id: TV003
    title: 乐观 / 基准 / 悲观估值情景
    columns:
      - 情景
      - 关键运营假设
      - 估值与倍数逻辑
      - 下行与执行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 直连卫星项圈推动美国肉牛和乳业快速采用；ARR 增长至 $200M+，毛利率持续为 75%，流失率低
        - 估值 $3.5B-$4.0B，对应 18x-20x ARR 倍数；有望以高倍数农业科技 IPO 或战略收购退出
        - 偏远牧场的项圈硬件故障率或 Starlink 连接瓶颈
        - 20% 概率（需要美国执行无误并扩展品类）
      - - 基准情景
        - 国际采用稳步推进，ARR 达到 $120M-$140M；新西兰、澳大利亚和美国部分地区维持订阅定价
        - 估值 $1.8B-$2.2B，对应 14x-16x ARR 倍数；相较 Series E 定价，估值持平或略有上升
        - 保守牧场主的销售周期拉长，畜牧业大宗商品价格趋于温和
        - 55% 概率（核心动能稳健，但被较高入场倍数抵消）
      - - 悲观情景
        - 美国肉牛扩张停滞；项圈更换成本和高昂的农村支持开销压缩毛利率；ARR 停留在 $80M-$90M
        - 估值 $900M-$1.1B，对应 10x-12x ARR 倍数；下轮融资风险或结构化清算优先权令次级投资者承压
        - 倍数大幅压缩至农机行业常态（收入的 2x-4x），农场低迷期客户流失
        - 25% 概率（凸显 22x 倍数对执行偏差的脆弱性）
      - - 下行阈值
        - 灾难性硬件召回、监管禁止电击 / 声音训练项圈，或牧群围控重大失败
        - <$500M 清算 / 资产出售价值；Series D 和 Series E 优先股遭受严重资本损失
        - 以动物福利为由的监管干预，或农民信任不可逆转地流失
        - 尾部风险低于 5%，但构成尽调监测的首要致命标准
    notes: 按概率加权的情景分析，推演不同运营结果下的退出估值和 ARR 倍数敏感性。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV010
      - CV014
      - CV015
