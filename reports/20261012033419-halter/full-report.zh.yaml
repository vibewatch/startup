      - number: '1.3'
        title: 资本化历史、估值演进与股权结构表投资者
        blocks:
          - type: paragraph
            body: >-
              自 2018 年以来，Halter 通过五轮机构融资扩充资本结构，累计获得超过 $401M 的股权融资。2025 年 6 月，Bond Capital 领投 $100M 的 Series D，使 Halter
              首次达到 $1.0B 独角兽估值。仅 9 个月后，2026 年 3 月，Founders Fund 再次领投 $220M 的 Series E（新西兰本地媒体记为 NZ$377M，澳大利亚媒体记为
              A$314.5M），将 Halter 的投后估值翻倍至 $2.0B。本轮继续获得长期投资者支持，包括 Bessemer Venture Partners、Blackbird
              Ventures、DCVC、NewView Capital、Promus Ventures 和 Icehouse Ventures。Halter 通过经常性订阅模式商业化，每头牛每月收费 $5 至
              $8，另收牧场基站的前期资本费用。第三方投资通讯根据项圈部署量估算年化经常性收入约为 $70M 至 $100M，但经审计的损益表、毛利率和留存数据仍未披露。
