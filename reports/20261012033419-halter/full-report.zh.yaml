chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心运营模式
        blocks:
          - type: paragraph
            body: >-
              Halter 由前 Rocket Lab 工程师 Craig Piggott 于 2016 年在新西兰奥克兰创立，是一家用数字硬件和自动化改造牲畜牧场管理的农业科技公司。公司注册实体为 HALTER
              LIMITED，主要总部位于奥克兰 Sale Street。Halter 的核心产品用太阳能智能 GPS
              项圈替代传统实体围栏，项圈佩戴在牛身上，并配套移动端和云端软件。系统在牛试图越过手机应用绘制的虚拟边界时，先发出自动声音和振动引导，只有在动物仍要越界时才施加低能量电脉冲，由此训练牲畜遵守动态放牧边界。奶农和肉牛牧场主因此可以精细化轮牧、远程在牧区间转移牛群，无需人工搬运实体围栏或使用牧羊犬，还能全天候掌握牧场情况。2026
              年 3 月，Halter 完成 Series E 融资并达到独角兽地位，估值 $2.0B，成为新西兰估值最高的深科技初创公司之一。
