  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与被替代支出
        blocks:
          - type: paragraph
            body: >-
              Halter 位于精准农业 IoT
              硬件与经常性牲畜运营软件的交汇处。其可服务市场边界由基于牧场的牛类放牧系统界定，覆盖集约化奶牛养殖和粗放式肉牛牧场。在这些运营环境中，农场主和牧场主需要分配饲草面积、划定轮牧区、将牛群赶往挤奶厅或处理设施，并监测动物繁殖和身体健康。Halter
              的价值主张替代了多类传统运营支出，包括永久木桩铁丝围栏的建设和维护、临时电围栏卷盘、全地形车赶牛燃油，以及季节性农业劳动力。相反，市场边界严格排除集约化室内饲养场和非牛类圈养设施，因为动物留在圈舍内，牧场分配技术无法发挥作用。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
