  - id: FV001
    title: 基于证据到建议的决策逻辑流程
    type: flow
    summary: 从客户验证和市场规模，逐步推导至估值倍数和投资建议。
    data:
      nodes:
        - id: proof-scale
          label: 1. 运营规模与牵引力
          detail: 已售出超过 1M 个智能项圈，2,000 多名农户分布在 NZ、澳大利亚和美国 22 个州并在使用。
        - id: tech-moat
          label: 2. 技术与直连卫星
          detail: 直连卫星的 Starlink 连接无需地面基站，打开了偏远美国牧场市场。
        - id: capital-base
          label: 3. 资本充足的资产负债表
          detail: Founders Fund 领投的 $220M E 轮融资，加上总计 $421M 融资，为公司提供了充足的资金续航。
        - id: revenue-multiple
          label: 4. 估值倍数张力
          detail: 按预计 $70M-$100M 收入计算，$2.0B 估值对应 20x 至 28x 倍数。
        - id: tam-overhang
          label: 5. 可服务市场错位
          detail: 公司当前的私募估值超过了 2025 年全球总计 $1.8B 的虚拟围栏市场。
        - id: final-stance
          label: 6. 尽调立场：继续研究
          detail: 保持继续研究的立场，在将 $2B 估值计入投资判断前，跟踪各批次客户的经济性。
    approximationNotes: 将各条尽调证据流映射为投资立场的逻辑推演。
