      - number: '2.3'
        title: 买方画像、预算归属与采用触发因素
        blocks:
          - type: paragraph
            body: >-
              Halter
              主要客户群的采用动力和采购流程差异很大。在牧场奶牛养殖中，经济买方通常是农场主兼经营者、股权分成挤奶工或农场总经理，他们的财务表现直接取决于牧草干物质收获效率和每日挤奶安排。奶牛养殖的主要运营催化因素，是农业劳动力短缺，以及每天两次移动电围栏和赶牛到挤奶棚的重复负担。在肉牛牧场，牛群分布在广阔牧区，以本地饲草为食，日常处理很少。这里的决策者是牧场主或肉牛业务经理，希望监测牛群在偏远牧场的分布，并减少燃油和直升机赶牛费用。对于此前因蜂窝网络盲区而无法考虑联网项圈的牧场经营者，卫星连接是决定性采购触发因素。此外，公共土地合作项目（例如与联邦保护机构签订的防火带放牧协议）展示了新生的机构采用场景：遵守生态放牧要求会推动项圈部署。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
