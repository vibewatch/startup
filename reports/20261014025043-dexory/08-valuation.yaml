      - "Implied Valuation Logic"
      - "Key Downside Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Rapid US and European expansion; ARR reaches $45M+ by 2027; gross margins exceed 75%; successful software monetization"
        - "$550M - $700M valuation based on premium 12x-15x ARR multiple reflecting physical AI leadership and fast growth"
        - "High customer acquisition costs and potential hardware deployment delays in complex facilities"
        - "25% - High market demand but requires flawless execution and unhindered enterprise scaling"
      - - "Base Case"
        - "Steady multi-site expansion across existing 3PL accounts; ARR reaches $25M - $30M; blended gross margins stabilize near 60%"
        - "$250M - $350M valuation based on 10x-12x ARR multiple balancing software margins with robotics hardware overhead"
        - "Longer sales cycles and modest churn among tier-2 logistics operators"
        - "55% - Most consistent with observed deployment cadence and Series C capital scale"
      - - "Bear Case"
        - "Pilot churn and slow site rollouts; ARR stalls below $15M; heavy debt service on $65M facility drains cash reserves"
        - "$100M - $150M distressed valuation or recapitalization; liquidation preference wipes out common equity upside"
        - "Severe liquidity crunch requiring down-round financing or emergency asset sale"
        - "20% - Mitigated by reputable tier-1 sponsors (Eurazeo, Atomico) but elevated by debt overhang"
    notes: "Valuation framework models hypothetical 2027 performance given undisclosed current ARR and gross margin baseline."
