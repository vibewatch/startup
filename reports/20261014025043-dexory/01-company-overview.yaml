chapter:
  number: 1
  title: "Company Overview"
  summary: "Dexory develops autonomous inventory-scanning mobile robotics and the DexoryView digital-twin AI analytics platform for enterprise logistics and warehousing. Founded in the United Kingdom in 2022 and led by CEO Andrei Danescu, the company has raised over $280 million in cumulative equity financing—capped by a $165 million Series C in late 2025—to expand across North America and Europe while deploying with tier-one logistics and manufacturing operators."
sections:
  - id: "identity-and-operating-model"
    title: "Corporate Identity and Full-Stack Operating Model"
    body: "Dexory is an industrial automation and logistics intelligence company established in 2022, headquartered in Wallingford, Oxfordshire, United Kingdom, with a North American operational headquarters established in Nashville, Tennessee. The company operates at the convergence of autonomous mobile robotics (AMRs), computer vision, and enterprise cloud software. Its core commercial product, the DexoryView platform, addresses the persistent visibility gap between warehouse management system (WMS) records and physical warehouse floor reality. Rather than selling hardware as an upfront capital expenditure item, Dexory delivers its solution through a full-stack subscription service that bundles autonomous daily robotic scanning, sensor data ingestion, digital-twin mapping, and ongoing maintenance into an operational expense model."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Structure"
    body: "Dexory was co-founded by Chief Executive Officer Andrei Danescu, Chief Technology Officer Adrian Negoita, and Chief Commercial and Product Officer Oana Jinga. Danescu brings specialized technical domain expertise from high-performance systems engineering, having previously developed real-time control architectures for the Sahara Force India Formula One Team and Jaguar Land Rover. Negoita leads software and digital-twin engineering following senior technical roles at IBM, Just Eat, and Endava, while Jinga directs commercialization and enterprise partnerships following strategic product leadership at Google and Telefonica. The founding team represents strong founder-market fit across robotics hardware, scalable cloud systems, and enterprise commercial execution. Key-person dependency remains concentrated in Danescu and Negoita regarding proprietary autonomous robotic controls and digital-twin software architecture."
    claimRefs:
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Financing Trajectory and Institutional Investor Syndicate"
    body: "Dexory has secured over $280 million in cumulative venture and growth financing across multiple institutional rounds. Following an $80 million Series B funding round in October 2024 led by DTCP with participation from Atomico, Lakestar, Latitude Ventures, and Wave-X, the company accelerated international commercial expansion. In October 2025, Dexory closed a $165 million Series C round led by Eurazeo's Growth team, alongside LTS Growth, Endeavor Catalyst, and reinvestment from existing backers DTCP, Atomico, and Lakestar. Capitalization was further augmented in March 2026 by an £8.5 million Series C follow-on commitment from the British Business Bank. While institutional syndication is top-tier, private ownership limits disclosure around exact post-money valuation multiples, liquidation preferences, and software gross margin performance."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "operating-scale-and-milestones"
    title: "Operational Scale, Technology Milestones, and Competitive Dynamics"
    body: "Dexory's operational scale centers on its custom autonomous tower robots, which feature telescoping structures capable of reaching up to 40 to 60 feet high to capture full-height pallet racking in a single pass while collapsing to navigate standard warehouse doors. The autonomous mobile robots scan up to 15,000 pallets per hour and over 150,000 pallets daily, achieving company-reported inventory accuracy of 99.9% while automating repetitive manual cycle counts. Headcount has scaled into the 201 to 500 employee bracket across the UK and US offices. As the business expands, it contends with active competition from autonomous inventory robotics and drone inspection providers including Verity, Gather AI, and Doks Automation. Recent product milestones, such as the unveiling of the DexoryView Adapt reasoning layer at MODEX 2026, highlight an ongoing strategic pivot toward agentic decision automation."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
