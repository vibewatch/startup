              note: Delays adapting AMRs to local safety rules
            - value: Storage Health AI Gaps
              score: 3
              note: False negatives on defective pallets and shrink wrap
            - value: WMS/ERP Integration Lag
              score: 3
              note: Legacy software API mismatch slowing onboarding
        - id: low-impact
          label: Low Impact
          values:
            - value: Minor Sensor Calibration
              score: 1
              note: Routine optical recalibration during scheduled maintenance
            - value: Non-Critical Telemetry Glitch
              score: 2
              note: Transient dashboard latency in DexoryView cloud
            - value: Packaging Barcode Smudging
              score: 2
              note: Unreadable barcodes requiring manual operator scan
        - id: negligible-impact
          label: Negligible Impact
          values:
