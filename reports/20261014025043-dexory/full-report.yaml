            title: Venture Debt Obligations and Capital Intensity of RaaS Fleet
            body: >-
              Dexory's $165M financing package combined $100M of Series C equity with growth debt facilities from
              Bootstrap Europe. While RaaS eliminates upfront capex for warehouse operators, it concentrates asset
              financing, maintenance liabilities, and working capital burden onto Dexory's balance sheet.
            calloutType: risk
            claimRefs:
              - CI010
              - CI012
          - type: callout
            title: Customer Payback Dynamics vs Software Revenue Multiples
            body: >-
              Independent analysis by Forrester indicates a 219% three-year ROI and sub-six-month customer payback for
              DexoryView deployments. However, institutional underwriters must verify whether Dexory captures
              high-margin software multiples or lower blended hardware-service gross margins.
            calloutType: insight
            claimRefs:
              - CI007
              - CI008
