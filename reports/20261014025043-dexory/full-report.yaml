      - number: '6.3'
        title: Outcomes are promising but not portfolio benchmarks
        blocks:
          - type: paragraph
            body: >-
              The best named outcome is Iron Mountain's reported improvement from 97.8% to 99.9% inventory accuracy and
              a 27.35% reduction in stock-related errors. Romark and ODW provide operational corroboration through
              customer quotations about faster cycle counts, fewer discrepancies, and faster problem resolution, but
              neither source gives a controlled baseline or a complete denominator. Forrester's April 2025 study adds
              interview-based evidence from four users and models 219% three-year ROI for a composite organization. That
              model should not be read as observed customer-average economics: Dexory commissioned it, Forrester
              aggregated the interviewees into a composite, and the study expressly cautions against assuming that other
              organizations will realize the modeled return.
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion signals exist; retention and concentration remain private
        blocks:
          - type: paragraph
            body: >-
              Expansion is supported by two distinct signals: Iron Mountain expanded after an initial four-site
              deployment, and all four Forrester interviewees expressed interest in adding sites, including one
              organization planning five more European warehouses. Dexory's subscription model and common deployment
              workflow could facilitate land-and-expand, but vendor statements about easy scaling are not substitutes
              for cohort data. No retained source reports NRR, GRR, churn, renewal timing, average contract length,
              paid-site cohorts, or top-customer revenue concentration. The Forrester interview table also shows that
              the sampled customers had Dexory in only one to three warehouses despite operating networks of seven to
              400 sites. The investment case therefore depends on private evidence that pilots convert, renew, and
              expand without customer or channel concentration.
            claimRefs:
              - CU003
              - CU013
              - CU014
              - CU015
              - CU016
