      - number: '5.2'
        title: DexoryView Platform and Core Intelligence Modules
        blocks:
          - type: paragraph
            body: >-
              At the software layer, the company delivers DexoryView, a cloud-native warehouse intelligence and digital
              twin platform first commercialized in 2023. DexoryView aggregates the high-density spatial point clouds
              and visual imagery captured during autonomous robot runs, converting raw physical scans into a
              synchronized virtual replica of facility inventory. The platform structures functionality across two
              primary software modules: Integrity and Optimise. The Integrity module applies machine learning computer
              vision models to perform continuous stock validation and compliance audits, identifying misplaced pallets,
              phantom inventory, and discrepancy gaps against host warehouse management records. In February 2026,
              Dexory expanded this layer with 'Storage Health', a specialized inspection feature that analyzes
              high-resolution imagery to detect damaged upright racking, crushed goods, defective pallets, and hanging
              shrink wrap that present structural collapse or fire hazards. The complementary Optimise module focuses on
              space efficiency, analyzing historical occupancy patterns, slotting logic, and pallet consolidation
              opportunities to guide replenishment decisions and elevate overall facility throughput.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.3'
        title: Customer Workflow, WMS Integration, and Deployment Model
        blocks:
          - type: paragraph
            body: >-
              Dexory positions its solution directly against manual cycle counting, which traditionally requires
              labor-intensive scissor lift operations, barcode scanning guns, and scheduled facility downtime. By
              conducting autonomous scans—typically scheduled during night shifts to avoid peak operational traffic—the
              robot scans up to 10,000 pallet locations per hour, enabling full facility audits in a single operational
              window. Dexory claims customer deployments achieve 99.9% inventory tracking accuracy and experience an 80%
              reduction in audit labor time alongside a 20% throughput improvement. Crucially, DexoryView does not
              operate as an isolated silo; it functions as an operational data reconciliation layer that interfaces
              bi-directionally with existing enterprise warehouse management systems, including SAP, Manhattan
              Associates, and Blue Yonder. Commercial distribution follows a monthly subscription model that packages
              robot hardware, software licenses, maintenance, and monitoring into operating expenditures without upfront
              capital expenditure. Integration partner Actel Robotics indicates that end-to-end site onboarding and WMS
              connector integration typically achieve operational go-live within one to two weeks.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Technical Differentiation, Verification Gaps, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Dexory’s primary technical moat stems from its combination of high-bay physical data acquisition with
              real-time digital twin reconstruction, bypassing the infrastructure lock-in and high installation costs
              associated with fixed sensor grids. However, rigorous technical diligence reveals several material
              verification gaps. First, Dexory maintains a strictly proprietary, closed ecosystem with zero public
              developer documentation, open APIs, or community developer signals, preventing independent assessment of
              middleware extensibility, codebase maintainability, or integration debt. Second, while the hardware
              achieves vertical reach up to 60 feet, the absence of public battery degradation benchmarks, thermal
              operating thresholds for cold-storage facilities, or published mean time between failures (MTBF) limits
              underwriting visibility into lifecycle maintenance costs. Third, independent robotics reviewers emphasize
              that regulatory certifications and European product security compliances remain unconfirmed in public
              filings. Investors must request detailed API integration contracts, historical robot maintenance records,
              and false-positive defect rates for Storage Health before underwriting long-term software margins.
            claimRefs:
              - CE004
              - CE008
              - CE012
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid Zero-Infrastructure Deployment Model
            body: >-
              Dexory's autonomous scanning architecture eliminates the requirement for fixed infrastructure such as RFID
              tags, rack sensors, or ceiling-mounted cameras, enabling customers to achieve live operational deployment
              within one to two weeks on a subscription basis.
            calloutType: strength
            claimRefs:
              - CE001
              - CE008
              - CE014
          - type: callout
            title: Unverified Product Security and Environmental Operating Limits
            body: >-
              While Dexory reports impressive scan velocity and scanning heights up to 60 feet, detailed technical
              specifications regarding battery runtime, EU Cyber Resilience Act compliance, and performance in extreme
              temperature-controlled or block-storage environments remain undisclosed.
            calloutType: risk
            claimRefs:
              - CE004
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and operating contexts
        blocks:
          - type: paragraph
            body: >-
              Dexory sells a warehouse-operations outcome rather than a stand-alone robot: the economic buyer is
              typically an operations, inventory, automation, or supply-chain leader, while daily users include
              inventory managers, WMS teams, cycle counters, and site operators. The company's own customer examples
              span 3PL and contract logistics, air cargo, retail and e-commerce, manufacturing and automotive, food and
              beverage, and regulated or high-value inventory settings. That breadth is plausible because the recurring
              job is consistent across verticals: reconcile physical stock with system records without stopping live
              operations. Public proof is strongest in large, racked warehouses where inventory accuracy, labor
              intensity, and audit readiness are material; it is weaker for smaller facilities and channel-led
              deployments where the payer and end user may differ.
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU013
      - number: '6.2'
        title: Adoption trajectory and named production proof
        blocks:
          - type: paragraph
            body: >-
              Recent evidence shows deployments moving beyond isolated demonstrations. Iron Mountain began with four UK
              sites in 2024 and in September 2026 became the first customer reported to deploy Dexory's next-generation
              18-meter robot. Romark's Hazleton deployment is described as operating between shifts alongside existing
              automation, while ODW's Columbus deployment performs repeated autonomous scans and gives inventory teams
              visual confirmation and discrepancy workflows. These are meaningful production signals because they
              identify sites, operating conditions, and users rather than presenting logos alone. Even so, the evidence
              does not disclose contracted fleet size, paid seats, utilization by site, or how many announced
              deployments have progressed from initial installation to durable renewal.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
