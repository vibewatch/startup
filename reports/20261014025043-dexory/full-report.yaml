            title: Named production evidence is stronger than a logo wall
            body: >-
              Iron Mountain, Romark, and ODW evidence identifies operating sites, users, and workflows, while Iron
              Mountain supplies a measurable accuracy baseline and an expansion event.
            calloutType: strength
            claimRefs:
