  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The warehouse intelligence category occupies a defined operational boundary between enterprise software
              systems of record and physical material handling automation. Traditional warehouse operations rely on
              Warehouse Management Systems to track inventory records, but these transactional databases record what
              inventory should be in a location rather than verified physical floor reality. Physical inventory
              verification historically required disruptive manual cycle counts using handheld barcode guns or periodic
              facility-wide shutdowns. Dexory addresses this discrepancy by deploying autonomous mobile robots equipped
              with 3D optical cameras and LiDAR to capture continuous inventory ground truth without interrupting
              existing facility workflows. The addressable spend encompasses automated inventory verification, optical
              rack scanning, and spatial digital twin analytics, while excluding heavy material transport machinery such
              as automated guided vehicles, pallet conveyors, and automated storage and retrieval systems.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Addressable Spend'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Dexory’s addressable market requires decomposing broad logistics automation forecasts into
              defensible operational layers. The broader global warehouse automation and material handling industry
              represents a $45 billion to $55 billion annual market, but the vast majority of this capital flows to
              fixed structural equipment and physical pallet transport systems. The autonomous mobile robotics and
              logistics inspection segment comprises an estimated $8 billion to $12 billion market, within which
              specialized inventory intelligence and digital twin software represents approximately $3.5 billion to $5.0
              billion in addressable spend. Constraining the opportunity further to high-bay racked distribution centers
              yields a serviceable addressable market of $1.2 billion to $2.0 billion across North America and Europe.
              For Dexory, the serviceable obtainable market is anchored on enterprise third-party logistics networks and
              high-throughput manufacturing distributors capable of supporting recurring multi-site software
              subscriptions.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and RaaS Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Procurement authority for warehouse intelligence solutions is distributed across enterprise supply chain
              executives and on-site distribution center leadership. Economic buyers typically include Vice Presidents
              of Supply Chain, Operations Directors, and Logistics General Managers who seek to eliminate audit labor
              and reduce inventory write-offs. To minimize commercial friction in margin-constrained logistics
              environments, Dexory operates under a subscription-based Robotics-as-a-Service commercial model where
              monthly fees scale with facility square footage and total pallet storage locations. This pricing
              architecture allows distribution centers to fund deployments entirely from operating expenditure budgets
              without requiring corporate capital expenditure approvals. Standard subscriptions bundle hardware
              maintenance, continuous remote monitoring, software upgrades, and customer success management into a
              single recurring service package.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption Drivers, Operational Constraints, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Adoption of autonomous inventory scanning is accelerated by acute warehouse labor shortages, rising hourly
              wages, and stringent fulfillment service level agreements that penalize stock discrepancies. Regulatory
              and safety standards are also reshaping facility inspection, prompting the introduction of specialized
              software features such as Dexory Storage Health to detect damaged racks, defective pallets, and hazardous
              obstructions in real time. Nevertheless, enterprise scaling faces concrete operational and technical
              constraints. Facilities must maintain adequate wireless coverage throughout high-density racking aisles
              and ensure clear pathways for autonomous navigation. Furthermore, third-party logistics providers
              operating on tight operating margins subject multi-site software rollouts to rigorous payback scrutiny,
              creating a gap between vendor-sponsored economic models and independent fleet-wide operational
              verification.
            claimRefs:
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Divergence Between WMS Systems of Record and Physical Floor Ground Truth
            body: >-
              While enterprise warehouses universally deploy Warehouse Management Systems, these transactional databases
              record what inventory ought to be in location rather than actual physical placement. Dexory positions its
              combination of autonomous scanning and digital twin software as an operational ground-truth layer that
              bridges this divergence without requiring warehouse layout changes.
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
          - type: callout
            title: Commercial Friction from Recurring RaaS Overhead in Low-Margin 3PL Operations
            body: >-
              Third-party logistics providers operate under thin operating margins (often 3% to 6%) and contractual
              customer pass-through constraints. While Dexory's RaaS model eliminates upfront CapEx, securing multi-year
              subscription commitments across entire distribution networks requires clear, independently auditable ROI
              and rapid payback periods.
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: From Passive WMS Logs to Autonomous Ground Truth'
        blocks:
          - type: paragraph
            body: >
              The automated warehouse intelligence ecosystem encompasses a diverse spectrum of alternatives ranging from
              status-quo manual cycle counting to flying drones, fulfillment mobile robots, and enterprise software
              systems of record. Historically, warehouse operations have relied on legacy warehouse management systems
              (WMS) provided by incumbents such as SAP, Manhattan Associates, and Blue Yonder. While these enterprise
              platforms maintain digital transaction logs recording expected inventory movements, they function
              fundamentally as systems of record rather than real-time observers of physical reality. Discrepancies
              between digital inventory records and actual floor reality accumulate continuously due to mispicks,
              damaged items, unauthorized pallet movements, and shrinkage.


              To bridge this visibility gap, distribution facilities have traditionally performed periodic manual audits
              and cycle counts. However, manual audits require significant human labor, specialized equipment such as
              cherry pickers for high-bay racking, and frequent operational disruption or aisle shutdowns. In response,
              modern autonomous solutions have bifurcated into two primary approaches: aerial inventory drones,
              pioneered by startups like Gather AI and Verity, and ground-based autonomous mobile robots (AMRs). Within
              the ground robotics segment, vendors such as Locus Robotics, Geek+, and GreyOrange focus primarily on
              horizontal goods-to-person transport and order fulfillment rather than comprehensive high-bay inventory
              auditing. Dexory addresses the vertical inventory intelligence gap directly by deploying autonomous tall
              mobile robots paired with its proprietary DexoryView digital twin platform, creating an operational data
              layer that bridges physical reality and enterprise software.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 'Feature and Architecture Comparison: Telescopic AMRs vs. Drones and Fulfillment Bots'
        blocks:
          - type: paragraph
            body: >
              Dexory's primary technological differentiation stems from its proprietary physical robot architecture and
              integrated computer vision software stack. Unlike standard industrial AMRs that operate solely at floor
              level, Dexory's robots feature an automated telescoping tower equipped with high-resolution optical
              cameras, barcode scanners, and depth sensors that extend upwards to scan racking up to 18 meters (nearly
              60 feet) in height. Crucially, this telescopic mast can retract into a compact form factor, enabling the
              robot to navigate through standard warehouse fire doors and transit between distinct storage chambers
              without manual intervention or overhead obstruction.


              This ground-based telescopic architecture provides significant operational advantages over aerial drone
              alternatives like Gather AI and Verity. While inventory drones can reach high racking, their flight
              endurance is fundamentally constrained by battery weight and power draw, typically restricting active
              flight sessions. Furthermore, drones generate rotor downwash that can disturb warehouse dust, present
              safety netting requirements in shared aisles, and struggle to lift heavy LiDAR sensors or multi-sensor
              environmental inspection payloads. Dexory's AMRs, by contrast, navigate safely alongside human warehouse
              personnel and forklift machinery at floor level without requiring aisle closures. Beyond barcode
              identification, Dexory incorporates automated Storage Health computer vision models to flag defective
              pallets, rack structural damage, and hanging wrap hazards, while DexoryView Adapt converts real-time
              discrepancy maps into proactive operational instructions.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Commercial Models, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              In commercial packaging, Dexory has adopted a software-centric monthly subscription model that eliminates
              upfront capital expenditure barriers for enterprise logistics operators. By packaging robot hardware,
              continuous sensor maintenance, cloud analytics, and the DexoryView digital twin interface into a unified
              operational expense (OPEX) agreement, Dexory accelerates customer procurement cycles compared to
              traditional multi-million-dollar fixed automation projects. Deployments typically reach operational
              readiness within two weeks, requiring minimal changes to existing warehouse physical infrastructure or
              aisle configurations.


              Customer evidence demonstrates substantial operational return on investment, with enterprise operators
              reporting audit cycle time reductions of up to 80% and direct daily labor savings exceeding 16 hours per
              automated facility. Over time, these operational integrations create formidable switching barriers. As
              DexoryView amasses historical inventory scans, slotting patterns, and spatial digital twins across
              multiple logistics hubs within a customer's supply chain, the platform transitions from an inspection tool
              to an indispensable operational layer. Because warehouse operators require uniform visibility across their
              multi-site networks, enterprises strongly favor standardizing on a single inventory ground-truth vendor
              rather than managing disjointed point solutions across different regional distribution centers.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
              - CP015
      - number: '3.4'
        title: Displacement Risks, Commoditization Threats, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              Despite Dexory's strong early differentiation, the company faces strategic and competitive headwinds as
              the warehouse robotics market matures. A primary long-term threat is the potential response from incumbent
              enterprise WMS vendors. Software giants like SAP, Manhattan Associates, and Oracle possess deep customer
              relationships, entrenched ERP integrations, and immense distribution power. If incumbent WMS platforms
              develop standardized interfaces for off-the-shelf vision sensors or acquire commoditized robotics
              providers, they could capture software reasoning margins while relegating specialized hardware vendors to
              lower-margin equipment suppliers.


              Furthermore, direct competitors in the drone space are aggressively optimizing payload weights and
              autonomous flight controllers, which could narrow the capability gap in facilities with wide aisles and
              standard pallet configurations. Additionally, hardware scaling across diverse global warehouse
              environments exposes Dexory to operational risks, including uneven floor grading, varying lighting
              conditions, and unpredictable network connectivity across older logistics sites. While Dexory's rapid
              Series C expansion and high customer adoption provide a solid commercial buffer, maintaining long-term
              defensibility will require expanding proprietary AI reasoning layers like DexoryView Adapt that deliver
              proven ROI well beyond basic optical scanning.
            claimRefs:
              - CP004
              - CP010
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Moat in Closed-Loop Physical Ground Truth
            body: >-
              Dexory's defensibility lies in uniting hardware ground-truth collection with software reasoning. Unlike
              software-only overlays that inherit bad WMS data or hardware point solutions that stop at image
              collection, Dexory captures live 18-meter ground truth and feeds it into DexoryView Adapt to drive
              automated warehouse decisions.
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
          - type: callout
            title: Adverse Threat of Incumbent WMS Integration and Hardware Commoditization
            body: >-
              A critical long-term competitive vulnerability is the risk that incumbent enterprise WMS providers build
              direct integrations with commoditized computer vision sensors. If legacy platforms absorb automated
              discrepancy detection, specialized scanning hardware risks margin compression unless proprietary software
              reasoning provides indispensable workflow value.
            calloutType: risk
            claimRefs:
              - CP004
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Structure, and Commercial Contracts
        blocks:
          - type: paragraph
            body: >-
              Dexory monetizes its warehouse intelligence platform exclusively through a subscription-based
              Robots-as-a-Service (RaaS) commercial model. Rather than requiring warehouse operators to commit upfront
              capital expenditures (CapEx) to purchase physical robots, Dexory packages autonomous mobile scanning
              hardware, ongoing 24/7 telemetry monitoring, scheduled maintenance, and the DexoryView digital-twin
              analytics layer into a recurring monthly fee. Commercial contract pricing is customized according to
              warehouse facility characteristics, specifically total square footage, racking height up to 18 meters, and
              total pallet storage capacity. Customers contract on multi-year terms that ensure predictable recurring
              revenue while eliminating hardware technology obsolescence risks for customers. In addition to core
              inventory tracking, Dexory layers higher-margin software capabilities such as the Integrity and Optimise
              modules, as well as the DexoryView Adapt reasoning engine, creating clear pathways for account expansion
              and average contract value growth across tier-one logistics and manufacturing accounts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
