  - id: FU001
    title: Evidence-backed customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports the path from an inventory-control problem to live site use and some multisite expansion,
      while renewal and concentration remain unverified.
    data:
      nodes:
        - id: need
          label: Operational need
          detail: >-
            Manual counts, inventory discrepancies, audit interruption, or missing-pallet investigations create the
            initial buying trigger.
          touchpoints:
            - Inventory review
            - Audit preparation
            - Service-level failures
        - id: evaluation
          label: Site evaluation
          detail: Operations, automation, inventory, and WMS leaders assess workflow fit and deployment requirements.
          touchpoints:
            - Site survey
            - Workflow review
            - Buyer approval
        - id: deployment
          label: Initial deployment
          detail: A subscription combines the robot, analytics platform, maintenance, and implementation at a warehouse site.
          touchpoints:
            - Mapping
            - Integration
            - Training
        - id: daily-use
          label: Daily operating use
          detail: Automated scans feed inventory comparisons, visual confirmation, and discrepancy-resolution workflows.
          touchpoints:
