  - id: FE001
    title: Dexory Product and Technology Architecture Stack
    type: stack
    summary: >-
      Six-layer architectural representation of the Dexory robotics and warehouse intelligence platform from physical
      AMR hardware to enterprise WMS integration.
    data:
      layers:
        - label: Enterprise Application & WMS Integration Layer
          detail: >-
            Bi-directional synchronization connectors linking DexoryView ground truth directly into enterprise WMS
            platforms including SAP, Manhattan Associates, and Blue Yonder.
        - label: DexoryView Cloud Intelligence & Analytics
          detail: >-
            Cloud-hosted digital twin engine, space occupancy heatmaps, slotting analytics, and executive dashboards for
            multi-site logistics visibility.
        - label: AI Computer Vision & Storage Health Engine
          detail: >-
            Machine learning inference pipeline performing automated barcode decoding, inventory discrepancy detection,
            and rack structural damage inspection.
        - label: Data Ingestion & Point-Cloud Processing
          detail: >-
            Secure data pipeline processing multi-layer LiDAR point clouds, 3D spatial mapping, and high-resolution
            camera feeds captured during facility scans.
        - label: Onboard Autonomous Robotics Navigation Stack
          detail: >-
            SLAM navigation, real-time dynamic obstacle detection, autonomous path planning, and safe coexistence
            alongside warehouse personnel and forklifts.
        - label: Physical Hardware & Sensor Payload Layer
          detail: >-
            Autonomous mobile base, telescoping sensor tower extending up to 60 ft (18m), multi-layer LiDAR, optical
            cameras, and automated 2 sqm charging dock.
