      - number: '1.4'
        title: Operational Scale, Technology Milestones, and Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              Dexory's operational scale centers on its custom autonomous tower robots, which feature telescoping
              structures capable of reaching up to 40 to 60 feet high to capture full-height pallet racking in a single
              pass while collapsing to navigate standard warehouse doors. The autonomous mobile robots scan up to 15,000
              pallets per hour and over 150,000 pallets daily, achieving company-reported inventory accuracy of 99.9%
              while automating repetitive manual cycle counts. Headcount has scaled into the 201 to 500 employee bracket
              across the UK and US offices. As the business expands, it contends with active competition from autonomous
              inventory robotics and drone inspection providers including Verity, Gather AI, and Doks Automation. Recent
              product milestones, such as the unveiling of the DexoryView Adapt reasoning layer at MODEX 2026, highlight
              an ongoing strategic pivot toward agentic decision automation.
