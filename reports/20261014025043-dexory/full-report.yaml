chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Full-Stack Operating Model
        blocks:
          - type: paragraph
            body: >-
              Dexory is an industrial automation and logistics intelligence company established in 2022, headquartered
              in Wallingford, Oxfordshire, United Kingdom, with a North American operational headquarters established in
              Nashville, Tennessee. The company operates at the convergence of autonomous mobile robotics (AMRs),
              computer vision, and enterprise cloud software. Its core commercial product, the DexoryView platform,
              addresses the persistent visibility gap between warehouse management system (WMS) records and physical
              warehouse floor reality. Rather than selling hardware as an upfront capital expenditure item, Dexory
              delivers its solution through a full-stack subscription service that bundles autonomous daily robotic
              scanning, sensor data ingestion, digital-twin mapping, and ongoing maintenance into an operational expense
              model.
            claimRefs:
              - CO001
              - CO004
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
