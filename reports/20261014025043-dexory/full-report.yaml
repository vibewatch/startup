      - number: '4.2'
        title: Unit Economics, Gross Margin Drivers, and Service-Delivery Costs
        blocks:
          - type: paragraph
            body: >-
              The economic viability of Dexory's RaaS model depends on long-term hardware durability and rapid customer
              time-to-value. Dexory engineers its autonomous tower scanning robots to operate maintenance-free for up to
              eight years, enabling the company to amortize initial bill-of-materials and assembly costs across multiple
              customer renewal cycles. Deployments are executed rapidly within one to two weeks without requiring floor
              beacons, magnetic tracks, or facility layout alterations, minimizing upfront deployment engineering
              expenses. On the customer side, an independent Total Economic Impact analysis conducted by Forrester
              established a 219% return on investment over three years with a payback period under six months, driven by
              cycle count labor reductions of over 70% and a 75% reduction in error incidents. However, because Dexory
              assumes continuous hardware support obligations, including a 24-to-72-hour on-site remediation SLA and
              edge sensor maintenance, its blended gross margins are fundamentally constrained by physical service
              delivery compared to pure-play software vendors.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Capital Adequacy, Financing Structure, and Cash Runway
        blocks:
          - type: paragraph
            body: >-
              Dexory has secured substantial capitalization to underwrite its global commercialization and asset-heavy
              fleet expansion. In October 2025, the company completed a $165 million financing transaction anchored by a
              $100 million Series C equity round led by Eurazeo Growth, alongside participation from LTS Growth,
              Endeavor Catalyst, DTCP, Atomico, and Lakestar. Crucially, the transaction included an extended growth
              debt facility from Bootstrap Europe, signaling that Dexory leverages venture debt to finance robot fleet
              manufacturing and working capital without excessive equity dilution. These proceeds have supported rapid
              geographic expansion, including the establishment of a 50,000 square foot North American operational
              headquarters in Nashville, Tennessee, and team growth beyond 150 employees. While the capital infusion
              provides multi-year operating runway, the incorporation of structured growth debt introduces ongoing debt
              service commitments and covenant obligations that require disciplined fleet utilization and consistent
              cash collection across enterprise customer accounts.
            claimRefs:
              - CI010
              - CI012
              - CI013
      - number: '4.4'
        title: Financial Verdict, Revenue Quality, and Underwriting Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, Dexory exhibits high commercial velocity and validated
              customer ROI across marquee global accounts including Maersk, GXO, and DHL. The subscription RaaS model
              generates recurring revenue streams that benefit from deep operational integration into client WMS
              workflows. However, as a private venture-backed growth entity, Dexory does not publicly disclose core
              financial metrics including annual recurring revenue (ARR), revenue run-rate, net revenue retention (NRR),
              customer churn, or gross margin split between software and hardware delivery. Institutional underwriters
              cannot determine whether Dexory's financial performance warrants a premium enterprise software valuation
              multiple or reflects the lower operating leverage of a specialized robotics service provider. Access to
              confidential management accounts, customer cohort retention schedules, and unit-level hardware
              depreciation figures remains an essential diligence requirement before underwriting capital commitments.
            claimRefs:
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
