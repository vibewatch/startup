      - number: '1.3'
        title: Financing Trajectory and Institutional Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Dexory has secured over $280 million in cumulative venture and growth financing across multiple
              institutional rounds. Following an $80 million Series B funding round in October 2024 led by DTCP with
              participation from Atomico, Lakestar, Latitude Ventures, and Wave-X, the company accelerated international
              commercial expansion. In October 2025, Dexory closed a $165 million Series C round led by Eurazeo's Growth
              team, alongside LTS Growth, Endeavor Catalyst, and reinvestment from existing backers DTCP, Atomico, and
              Lakestar. Capitalization was further augmented in March 2026 by an £8.5 million Series C follow-on
              commitment from the British Business Bank. While institutional syndication is top-tier, private ownership
              limits disclosure around exact post-money valuation multiples, liquidation preferences, and software gross
              margin performance.
            claimRefs:
              - CO007
              - CO008
              - CO009
