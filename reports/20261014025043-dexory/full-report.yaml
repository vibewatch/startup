  - id: TV002
    title: Dexory Investment Thesis and Anti-Thesis Balance
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Technology & Product
        - >-
          Proprietary telescoping autonomous robot paired with DexoryView digital twin provides continuous ground truth
          and >500M scans
        - >-
          Robotics hardware introduces maintenance overhead, site wear, and physical deployment bottlenecks across
          diverse warehouse layouts
        - Verified 99.9% uptime and autonomous multi-year operation across >50 customer sites
      - - Commercial Traction
        - Top-tier logistics operators (GXO, Maersk, DHL) and manufacturers (Stellantis, GE) validate enterprise demand
        - >-
          Enterprise multi-site rollouts can suffer long procurement cycles, pilot stagnation, or limited fleet
          expansion per site
        - Audited net revenue retention exceeding 125% and documented expansion to >5 sites per client
      - - Business Model
        - >-
          Zero-CapEx subscription model accelerates customer adoption and promises sticky, high-margin recurring
          software revenues
        - >-
          Field maintenance, hardware amortization, and customer success costs may depress blended gross margins below
          software levels
        - Disclosed gross margin breakdown demonstrating software-level gross margins above 70%
      - - Capital Structure
        - >-
          $165M Series C led by Eurazeo Growth provides substantial runway for global market expansion and US
          headquarters growth
        - >-
          $65M growth debt facility from Bootstrap Europe creates heavy debt service obligations and senior liquidation
          overhang
        - Audited cash runway extending past 2027 and positive operating cash flow generation
    notes: Compares core value creation arguments against operational and financial vulnerabilities identified in diligence.
