            - Dashboard review
            - Corrective action
        - id: outcome
          label: Outcome validation
          detail: Customers evaluate accuracy, error reduction, labor reallocation, audit readiness, and fulfillment effects.
          touchpoints:
            - Accuracy review
            - Error analysis
            - ROI assessment
        - id: expansion
          label: Multisite expansion
          detail: >-
            Named evidence shows some customers adding sites or capabilities, but public renewal cohorts and
            concentration data are absent.
          touchpoints:
