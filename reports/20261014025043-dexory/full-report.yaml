              note: Minor facility floor realignment for robot charger
            - value: Cosmetic Robot Wear
              score: 1
              note: Superficial chassis scuffing from warehouse dust
            - value: User Dashboard Theme Preference
              score: 1
              note: Operator customization of visual layout settings
        - id: informational-impact
          label: Informational Impact
          values:
            - value: Routine Firmware Notification
              score: 1
              note: Scheduled over-the-air software version updates
            - value: Off-Peak Cycle Rescheduling
              score: 1
              note: Adjusting autonomous scan window to match shift breaks
            - value: Space Utilization Metric Shift
              score: 1
              note: Expected seasonal fluctuations in pallet storage counts
