      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Dexory was co-founded by Chief Executive Officer Andrei Danescu, Chief Technology Officer Adrian Negoita,
              and Chief Commercial and Product Officer Oana Jinga. Danescu brings specialized technical domain expertise
              from high-performance systems engineering, having previously developed real-time control architectures for
              the Sahara Force India Formula One Team and Jaguar Land Rover. Negoita leads software and digital-twin
              engineering following senior technical roles at IBM, Just Eat, and Endava, while Jinga directs
              commercialization and enterprise partnerships following strategic product leadership at Google and
              Telefonica. The founding team represents strong founder-market fit across robotics hardware, scalable
              cloud systems, and enterprise commercial execution. Key-person dependency remains concentrated in Danescu
              and Negoita regarding proprietary autonomous robotic controls and digital-twin software architecture.
            claimRefs:
              - CO002
              - CO003
