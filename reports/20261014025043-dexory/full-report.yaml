  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Machinery Safety, and Data Governance Risks
        blocks:
          - type: paragraph
            body: >-
              Dexory deploys autonomous mobile robots equipped with mechanical telescoping towers extending up to 18
              meters (and newly announced 60-foot ranges) across multi-shift logistics environments. Operating tall
              robotic structures alongside human warehouse pickers, active forklifts, and industrial machinery creates
              tangible physical safety exposure. Under UK and European machinery directives (including the EU Machinery
              Regulation) and US OSHA occupational standards, autonomous mobile equipment must adhere to strict
              functional safety and obstacle avoidance protocols. A collision between an extending tower and overhead
              infrastructure, lighting, or warehouse racking—or failure to yield to high-speed industrial
              forklifts—could precipitate catastrophic structural collapse, regulatory halt orders, or employer
              liability lawsuits. Furthermore, Dexory’s daily capture of up to 250 TB of high-resolution images and 2 TB
              of 3D point cloud data per site presents regulatory friction under GDPR and biometric privacy statutes if
              employee movements or facial likenesses are captured during continuous scanning passes. While Dexory has
              achieved SOC 1, SOC 2 Type I, and ISO 27001 certifications to address enterprise IT and data control
              standards, cross-border deployments across Europe, North America, and APAC require ongoing compliance
              reviews with local safety inspectorates.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
      - number: '7.2'
        title: Operational Failure Modes, Maintenance SLA, and Hardware Scaling
        blocks:
          - type: paragraph
            body: >-
              Dexory operates under a full-stack Robotics-as-a-Service (RaaS) model where hardware maintenance, remote
              monitoring, and on-site repair obligations remain entirely with the company. The company asserts that its
              newest robots are maintenance-free for up to eight years, relying on 24/7 remote monitoring and cloud
              diagnostics. However, when critical hardware breakdowns occur—such as optical camera degradation, LiDAR
              sensor blinding from airborne warehouse dust, or mechanical actuator failures on the telescoping
              tower—Dexory’s contractual response commitment specifies on-site arrival within 24 to 72 hours. In
              mission-critical logistics facilities where operators rely on daily scans to reconcile inventory and
              prevent downstream stockouts, a multi-day hardware outage disrupts warehouse workflows and undermines the
              core software value proposition. While Dexory’s recently launched Storage Health software module uses
              computer vision and machine learning to proactively detect damaged racking, defective pallets, hanging
              shrink wrap, and obstruction risks, continuous physical robot operations across diverse warehouse
              conditions remain exposed to harsh operating environments.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner Ecosystem and Key Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Dexory’s commercial go-to-market and field scaling rely heavily on a concentrated cohort of tier-1 global
              3PL operators and enterprise manufacturing leaders, including DHL, GXO, Maersk, and Stellantis, alongside
              system integration partners such as C5MI, Infios, and Raymond Storage Concepts. Commercial concentration
              among massive 3PL conglomerates creates distinct pricing power asymmetry: multi-site enterprise rollouts
              often involve elongated procurement cycles, stringent pilot-to-production conversion criteria, and volume
              discount pressure. Furthermore, Dexory depends on third-party hardware supply chains for precision LiDAR
              sensors, high-resolution optical cameras, industrial mechanical lifts, and cloud compute infrastructure. A
              supply disruption in specialized optical sensors or an API communication failure connecting DexoryView
              with heterogeneous customer Warehouse Management Systems (WMS) and ERP stacks can stall site onboarding,
              which currently targets a 1-to-2 week deployment window.
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Financial Model Sustainability, Debt Service, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Dexory’s financial profile is shaped by the high capital intensity inherent in manufacturing, owning, and
              depreciating fleet assets on its own balance sheet under the RaaS model. In its USD 165M Series C round
              closed in October 2025 (supplemented by an £8.5M follow-on from the British Business Bank in March 2026),
              Dexory raised USD 100M in venture equity led by Eurazeo alongside USD 65M in venture debt from Bootstrap
              Europe. Servicing $65M in structured debt requires consistent, high-margin software-like recurring cash
              flows; however, Dexory’s hardware assembly, field technician staffing, and international expansion across
              Wallingford, Nashville, and Australia generate substantial operating cash burn. If fleet utilization dips,
              customer churn accelerates among key 3PL accounts, or hardware gross margins compress due to replacement
              costs, debt covenants could trigger severe equity dilution. Concrete thesis-break triggers for investors
              include: (1) any fatal or high-severity workplace safety incident resulting in an OSHA/HSE operational
              shutdown; (2) default or restrictive covenant enforcement under the $65M Bootstrap Europe debt facility;
              (3) public contract cancellation or non-renewal by two or more anchor accounts (DHL, Maersk, or GXO); and
              (4) persistent failure to achieve software-like gross margins above 60% across the RaaS fleet.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Venture Debt Leverage Under RaaS Capital Intensity
            body: >-
              Dexory carries $65M in venture debt from Bootstrap Europe alongside its $100M Series C equity tranche.
              Because Dexory finances physical robot hardware on a RaaS model rather than recognizing upfront hardware
              sales, delayed multi-site rollouts or unexpected field maintenance costs could jeopardize debt service
              coverage before operating cash flow reaches breakeven.
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
          - type: callout
            title: Key Diligence Asks for Confirmatory Review
            body: >-
              Investors must demand full disclosure of: (1) historical safety and near-miss logs across all live
              warehouse deployments; (2) detailed debt covenants, interest rates, and repayment schedules for the $65M
              Bootstrap Europe facility; (3) SLA compliance records for the 24-72 hour on-site maintenance guarantee;
              and (4) gross margin breakdown separating DexoryView software subscriptions from robotic hardware
              depreciation and field servicing.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Dexory has established a differentiated position at the intersection of autonomous mobile robotics and
              enterprise warehouse intelligence. Through its proprietary tall-mast autonomous robots and the DexoryView
              digital twin platform, the company delivers continuous, real-time inventory visibility across full-height
              warehouse racking without requiring infrastructure modifications. Commercial validation from global
              logistics giants including GXO, DHL, and Maersk, alongside industrial leaders Stellantis and GE
              Appliances, confirms clear product-market fit and operational utility. However, because Dexory operates as
              a private business with undisclosed revenues, margins, and churn rates, the public evidence does not yet
              support an outright buy recommendation. We assign an overall recommendation of research-more, accompanied
              by a medium confidence rating and a high risk rating. While the technological moat and customer roster are
              compelling, the valuation stance remains stretched given that private funding rounds price the business at
              premium software multiples despite the physical capital requirements of robotics deployment.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
      - number: '8.2'
        title: Capital Structure and Financing Context
        blocks:
          - type: paragraph
            body: >-
              Dexory's capital structure expanded substantially with its $165 million Series C round announced in late
              2025, led by Eurazeo Growth with a $100 million lead ticket, alongside participation from LTS Growth,
              Endeavor Catalyst, DTCP, Atomico, and Lakestar. In March 2026, the British Business Bank contributed an
              additional 9.8 million euros. Crucially, Dexory's balance sheet also carries a $65 million growth debt
              facility provided by Bootstrap Europe. This dual equity-and-debt financing structure reflects both the
              capital intensity of scaling hardware-enabled warehouse operations and an aggressive strategy to capture
              global market share following the establishment of its North American headquarters in Nashville. While the
              debt facility preserves founder equity dilution, it introduces senior claims and debt service obligations
              that create significant overhang for junior equity holders if enterprise adoption slows or hardware
              depreciation accelerates.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario Analysis and Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Valuing Dexory requires balancing its high-margin software aspirations against the operational reality of
              managing physical robotic scanning fleets. Under our base-case scenario, assuming steady site expansions
              across contracted 3PL networks yield $25 million to $30 million in annual recurring revenue by 2027 with
              blended gross margins of 60%, an enterprise valuation range of $250 million to $350 million is supportable
              at a 10x to 12x forward revenue multiple. A bull-case scenario where rapid adoption in North America
              drives ARR toward $45 million could command upwards of $550 million to $700 million at software-grade
              multiples. Conversely, our bear-case scenario accounts for customer concentration, extended enterprise
              procurement cycles, and senior debt service burdens, which could compress the valuation to $100 million to
              $150 million and trigger recapitalization friction.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit Readiness and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Dexory's eventual liquidity path likely centers on an acquisition by a major supply-chain management
              software provider or an initial public offering once warehouse automation fleets mature. However, exit
              readiness is currently constrained by the absence of transparent unit economics and audited financial
              track records. Prospective investors must prioritize confidential data room diligence on three critical
              areas: first, cohort-level net revenue retention and site expansion velocity within marquee accounts such
              as GXO and Maersk; second, the exact gross margin separation between recurring DexoryView software
              subscriptions and robotic maintenance overhead; and third, the covenants and maturity schedules attached
              to the Bootstrap Europe debt facility. Until these metrics are confirmed through private discovery,
              investment discipline demands maintaining a research-more stance.
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More Under Stretched Valuation'
            body: >-
              While Dexory demonstrates genuine enterprise validation across global 3PLs and tier-1 manufacturers, the
              absence of public ARR, gross margin disclosure, and capital return terms warrants a research-more stance
              rather than a premature buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
          - type: callout
            title: Senior Debt Overhang and Capital Structure Friction
            body: >-
              Bootstrap Europe's $65 million debt facility alongside preferred equity tiers establishes substantial
              liquidation preferences that constrain common equity returns in any valuation down-round or acquisition
              below peak expectations.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV014
