          label: Critical Impact
          values:
            - value: Telescoping Mast Failure
              score: 3
              note: Mechanical failure of 18m tower in live warehouse aisle
            - value: Debt Default / OSHA Halt
              score: 5
              note: $65M debt default or major AMR collision halt
            - value: Anchor 3PL Churn
              score: 4
              note: Cancellation of fleet rollout by DHL or Maersk
        - id: high-impact
          label: High Impact
          values:
            - value: IP Infringement Action
              score: 2
              note: Patent challenge against autonomous scanning methods
            - value: Hardware Breakdown / 72h SLA
              score: 4
