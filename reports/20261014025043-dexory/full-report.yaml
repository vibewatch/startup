  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Autonomous Robot Hardware and Sensing Architecture
        blocks:
          - type: paragraph
            body: >-
              Dexory’s physical platform centers on an autonomous mobile robot (AMR) designed specifically for dense
              warehouse environments. Rather than requiring pre-installed fixed infrastructure such as RFID tags,
              magnetic guide strips, or overhead camera grids, the robot relies on an onboard sensor payload comprising
              multi-layer LiDAR, high-definition optical cameras, and autonomous SLAM navigation algorithms to traverse
              warehouse aisles. In February 2026, Dexory announced its next-generation hardware platform, extending its
              vertical scanning range from 40 feet to 60 feet (approximately 18 meters) to accommodate modern high-bay
              racking and double-deep configurations. The mobile unit operates safely alongside active warehouse
              personnel and material handling machinery, navigating autonomously without aisle shutdowns. Operational
              facility requirements remain minimal, demanding only an accessible 2-square-meter charging dock footprint
              with dedicated power supply. However, independent robotics assessments highlight that Dexory has not
              publicly disclosed critical hardware engineering specifications, including robot curb weight, battery
              chemistry, continuous runtime per charge, or compliance filings under the European Union Cyber Resilience
              Act.
