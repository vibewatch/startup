      - [Romark Logistics, 3PL, "Hazleton site cycle counts between shifts", "Active deployment described", "Faster counts within the existing shift and more time for discrepancy resolution", "No numeric baseline, duration, contract value, or renewal evidence"]
      - [ODW Logistics, 3PL, "Columbus distribution center automated scans and discrepancy workflows", "Deployed system described", "Customer reports fewer discrepancies and faster problem resolution", "Syndicated company-issued story; no independent measurement"]
      - ["GXO", "Contract logistics", "Inventory control and digital-twin workflow", "Customer testimonial on company site", "Reported removal of manual stock checks and cycle counts", "Company-selected testimonial without site count or measurement period"]
