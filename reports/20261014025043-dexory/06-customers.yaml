schemaVersion: "report-v2"
artifact: customers
slug: dexory
runDate: 2026-10-14
company:
  name: Dexory
chapter:
  number: 6
  title: Customers
  summary: >-
    Dexory has credible production-use evidence across 3PL, warehousing, air-cargo,
    retail, and industrial settings, with recent named deployments at Iron Mountain,
    Romark Logistics, and ODW Logistics. The evidence supports operational value and
    some multisite expansion, but retention, concentration, contract-duration, and
    fleet-wide deployment data remain undisclosed.
sections:
  - id: customer-segments
    title: Buyers, users, and operating contexts
    body: >-
      Dexory sells a warehouse-operations outcome rather than a stand-alone robot: the
      economic buyer is typically an operations, inventory, automation, or supply-chain
      leader, while daily users include inventory managers, WMS teams, cycle counters,
      and site operators. The company's own customer examples span 3PL and contract
      logistics, air cargo, retail and e-commerce, manufacturing and automotive, food
      and beverage, and regulated or high-value inventory settings. That breadth is
      plausible because the recurring job is consistent across verticals: reconcile
      physical stock with system records without stopping live operations. Public proof
      is strongest in large, racked warehouses where inventory accuracy, labor
      intensity, and audit readiness are material; it is weaker for smaller facilities
      and channel-led deployments where the payer and end user may differ.
    claimRefs: [CU001, CU002, CU010]
    tableRefs: [TU001]
  - id: deployment-proof
    title: Adoption trajectory and named production proof
    body: >-
      Recent evidence shows deployments moving beyond isolated demonstrations. Iron
      Mountain began with four UK sites in 2024 and in September 2026 became the first
      customer reported to deploy Dexory's next-generation 18-meter robot. Romark's
      Hazleton deployment is described as operating between shifts alongside existing
      automation, while ODW's Columbus deployment performs repeated autonomous scans
      and gives inventory teams visual confirmation and discrepancy workflows. These
      are meaningful production signals because they identify sites, operating
      conditions, and users rather than presenting logos alone. Even so, the evidence
      does not disclose contracted fleet size, paid seats, utilization by site, or how
      many announced deployments have progressed from initial installation to durable
      renewal.
    claimRefs: [CU003, CU004, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: outcomes-and-proof-quality
    title: Outcomes are promising but not portfolio benchmarks
    body: >-
      The best named outcome is Iron Mountain's reported improvement from 97.8% to
      99.9% inventory accuracy and a 27.35% reduction in stock-related errors. Romark
      and ODW provide operational corroboration through customer quotations about
      faster cycle counts, fewer discrepancies, and faster problem resolution, but
      neither source gives a controlled baseline or a complete denominator. Forrester's
      April 2025 study adds interview-based evidence from four users and models 219%
      three-year ROI for a composite organization. That model should not be read as
      observed customer-average economics: Dexory commissioned it, Forrester aggregated
      the interviewees into a composite, and the study expressly cautions against
      assuming that other organizations will realize the modeled return.
    claimRefs: [CU005, CU007, CU009, CU010, CU011, CU012, CU013]
  - id: durability-and-expansion
    title: Expansion signals exist; retention and concentration remain private
    body: >-
      Expansion is supported by two distinct signals: Iron Mountain expanded after an
      initial four-site deployment, and all four Forrester interviewees expressed
      interest in adding sites, including one organization planning five more European
      warehouses. Dexory's subscription model and common deployment workflow could
      facilitate land-and-expand, but vendor statements about easy scaling are not
      substitutes for cohort data. No retained source reports NRR, GRR, churn, renewal
      timing, average contract length, paid-site cohorts, or top-customer revenue
      concentration. The Forrester interview table also shows that the sampled customers
      had Dexory in only one to three warehouses despite operating networks of seven to
      400 sites. The investment case therefore depends on private evidence that pilots
      convert, renew, and expand without customer or channel concentration.
    claimRefs: [CU003, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
