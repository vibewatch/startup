  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Customer-level cohorts showing NRR, GRR, logo churn, renewal timing, contract
        duration, paid sites, and top-customer revenue concentration.
      whyItMatters: >-
        Deployment announcements do not establish durable recurring revenue or show
        whether Dexory depends on a small number of large logistics accounts.
      diligencePath: >-
        Request the customer ledger and contract cohort export, reconcile it to invoiced
        revenue, and sample renewal documents for the ten largest accounts.
      relatedQuestionRefs: [QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A complete roster separating paid production deployments, pilots, inactive sites,
        channel-led installations, and customer-approved references.
      whyItMatters: >-
        The named examples are credible but cannot establish the size, conversion rate,
        or composition of the installed customer base.
      diligencePath: >-
        Obtain a dated CRM and deployment export with customer, site, start date, status,
        robot count, subscription value, and renewal date, then verify a sample directly.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: >-
        Independently audited before-and-after outcomes across multiple customers using
        consistent definitions, periods, sites, and denominators.
      whyItMatters: >-
        Current outcomes mix company-selected testimonials, customer quotations, and a
        commissioned composite model, limiting portfolio-wide comparability.
      diligencePath: >-
        Request raw baseline and post-deployment KPI files for representative sites and
        validate inventory accuracy, error, labor, audit, and fulfillment calculations.
      relatedQuestionRefs: [QU004, QU007]
