figures:
  - id: FU001
    title: Evidence-backed customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports the path from an inventory-control problem to live site
      use and some multisite expansion, while renewal and concentration remain unverified.
    data:
      nodes:
        - id: need
          label: Operational need
          detail: Manual counts, inventory discrepancies, audit interruption, or missing-pallet investigations create the initial buying trigger.
          touchpoints: [Inventory review, Audit preparation, Service-level failures]
        - id: evaluation
          label: Site evaluation
          detail: Operations, automation, inventory, and WMS leaders assess workflow fit and deployment requirements.
          touchpoints: [Site survey, Workflow review, Buyer approval]
        - id: deployment
          label: Initial deployment
          detail: A subscription combines the robot, analytics platform, maintenance, and implementation at a warehouse site.
          touchpoints: [Mapping, Integration, Training]
        - id: daily-use
          label: Daily operating use
          detail: Automated scans feed inventory comparisons, visual confirmation, and discrepancy-resolution workflows.
          touchpoints: [Cycle count, Dashboard review, Corrective action]
        - id: outcome
          label: Outcome validation
          detail: Customers evaluate accuracy, error reduction, labor reallocation, audit readiness, and fulfillment effects.
          touchpoints: [Accuracy review, Error analysis, ROI assessment]
        - id: expansion
          label: Multisite expansion
          detail: Named evidence shows some customers adding sites or capabilities, but public renewal cohorts and concentration data are absent.
          touchpoints: [Renewal, Additional sites, New robot generation]
    approximationNotes: >-
      The sequence synthesizes documented customer workflows; it does not imply
      disclosed conversion rates, uniform stage timing, or a complete customer funnel.
    claimRefs: [CU010, CU014, CU016]
callouts:
  - calloutType: strength
    title: Named production evidence is stronger than a logo wall
    body: >-
      Iron Mountain, Romark, and ODW evidence identifies operating sites, users, and
      workflows, while Iron Mountain supplies a measurable accuracy baseline and an
      expansion event.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009]
  - calloutType: risk
    title: The durability layer is still private
    body: >-
      Public sources do not disclose renewal cohorts, NRR, churn, contract duration, or
      customer concentration, so reported deployment breadth cannot yet be translated
      into revenue durability.
    claimRefs: [CU013, CU015]
