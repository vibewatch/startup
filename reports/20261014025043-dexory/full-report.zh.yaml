chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与全栈运营模式
        blocks:
          - type: paragraph
            body: >-
              Dexory 是一家成立于 2022 年的工业自动化和物流智能公司，总部位于英国 Oxfordshire 的 Wallingford，并在 Tennessee 州 Nashville
              设立北美运营总部。公司处在自主移动机器人（AMR）、计算机视觉和企业云软件的交汇处。核心商业产品 DexoryView 平台解决仓储管理系统（WMS）记录与仓库现场实物之间长期存在的可见性缺口。Dexory
              不把硬件作为一次性资本开支出售，而是提供全栈订阅服务，把每日自主机器人扫描、传感器数据接入、数字孪生建模和持续维护打包进运营费用模式。
            claimRefs:
              - CO001
              - CO004
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 管理层、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Dexory 由 CEO Andrei Danescu、CTO Adrian Negoita 以及首席商务与产品官 Oana Jinga 共同创立。Danescu 擅长高性能系统工程，曾为 Sahara
              Force India Formula One Team 和 Jaguar Land Rover 开发实时控制架构；Negoita 曾在 IBM、Just Eat 和 Endava
              担任高级技术职务，负责软件与数字孪生工程；Jinga 曾在 Google 和 Telefonica
              负责战略产品，现主管商业化与企业合作。创始团队覆盖机器人硬件、可扩展云系统和企业商业执行，创始人与市场匹配度较强。Danescu 和 Negoita
              掌握自主机器人专有控制及数字孪生软件架构，关键人物依赖仍然集中。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.3'
        title: 融资轨迹与机构投资人联合体
        blocks:
          - type: paragraph
            body: >-
              Dexory 通过多轮机构融资累计获得超过 $280 million 的风险资本和成长资本。2024 年 10 月，公司完成由 DTCP 领投、Atomico、Lakestar、Latitude Ventures
              和 Wave-X 参与的 $80 million Series B，随后加快国际商业扩张。2025 年 10 月，Dexory 完成由 Eurazeo Growth 团队领投的 $165 million
              Series C，LTS Growth 和 Endeavor Catalyst 参与，DTCP、Atomico、Lakestar 等老股东继续投资。2026 年 3 月，British Business Bank
              又承诺 £8.5 million 的 Series C 追加融资。机构投资人阵容一流，但私人所有权限制了对准确投后估值倍数、清算优先权和软件毛利率表现的披露。
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: 运营规模、技术里程碑与竞争态势
        blocks:
          - type: paragraph
            body: >-
              Dexory 的运营规模建立在定制自主塔式机器人之上：伸缩结构最高可达 40 至 60 feet，一次扫描即可覆盖整层托盘货架，收起后又能通过标准仓库门。自主移动机器人每小时最多扫描 15,000
              个托盘、每天超过 150,000 个托盘，公司报告的库存准确率达到 99.9%，并自动完成重复性人工盘点。英国和美国办公室员工规模已进入 201 至 500 人区间。随着业务扩张，公司面对
              Verity、Gather AI 和 Doks Automation 等自主库存机器人及无人机巡检供应商的竞争。MODEX 2026 发布 DexoryView Adapt
              推理层等产品里程碑，显示公司正持续转向智能体式决策自动化。
