      - number: '5.2'
        title: DexoryView 平台与核心智能模块
        blocks:
          - type: paragraph
            body: >-
              在软件层，公司提供 2023 年首次商业化的云原生仓储智能和数字孪生平台
              DexoryView。平台汇总自主机器人运行时采集的高密度空间点云和视觉图像，把原始实物扫描转成设施库存的同步虚拟副本。功能分为两个主要软件模块：Integrity 和 Optimise。Integrity
              运用机器学习计算机视觉模型持续核验库存并做合规审计，识别错放托盘、幽灵库存以及相对仓储管理记录的差异。2026 年 2 月，Dexory 为该层增加 Storage Health
              专用巡检功能，分析高分辨率图像，发现可能造成结构坍塌或火灾的损坏立式货架、压碎货物、缺陷托盘和悬挂缠膜。Optimise
              则聚焦空间效率，分析历史占用模式、库位逻辑和托盘合并机会，为补货决策提供依据并提升设施整体吞吐量。
