      - number: '5.4'
        title: 技术差异化、验证缺口与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Dexory
              的主要技术护城河来自高位仓储实体数据采集与实时数字孪生重建的结合，绕开固定传感器网格带来的基础设施锁定和高昂安装成本。但严格技术尽调发现多个重大验证缺口。第一，公司维持严格专有的封闭生态，完全没有公开开发者文档、开放
              API 或社区开发者信号，外部无法评估中间件可扩展性、代码库可维护性和集成债务。第二，虽然硬件可达 60 feet
