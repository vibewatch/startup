  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              仓储智能类别位于企业软件记录系统与实物搬运自动化之间的明确运营边界。传统仓储运营依靠 Warehouse Management Systems
              记录库存，但这类交易数据库记录的是某地点应该有多少库存，而非现场经过核验的实物。过去核验库存通常要用手持条码枪人工盘点，或定期关闭整个设施。Dexory 通过部署搭载 3D 光学摄像头和 LiDAR
              的自主移动机器人，持续采集库存真实情况而不中断现有流程。可服务支出包括自动库存核验、光学货架扫描和空间数字孪生分析，但不包括自动导引车、托盘输送机和自动存取系统等重型物料运输设备。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与可服务支出
        blocks:
          - type: paragraph
            body: >-
              评估 Dexory 的可服务市场，需要把宽泛的物流自动化预测拆成可验证的运营层级。全球仓储自动化与物料搬运行业年市场规模为 $45 billion 至 $55
              billion，但其中绝大多数资本流向固定结构设备和实体托盘运输系统。自主移动机器人和物流巡检细分市场估计为 $8 billion 至 $12 billion，其中专业库存智能与数字孪生软件的可服务支出约为
              $3.5 billion 至 $5.0 billion。进一步限定到高位货架配送中心后，北美和欧洲的可服务市场为 $1.2 billion 至 $2.0 billion。对 Dexory
              而言，可获得市场集中在企业级第三方物流网络和高吞吐制造分销商，这些客户能够支持多站点经常性软件订阅。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
      - number: '2.3'
        title: 买方细分、预算归属与 RaaS 商业模式
        blocks:
          - type: paragraph
            body: >-
              仓储智能解决方案的采购权分散在企业供应链高管和现场配送中心负责人之间。经济买方通常包括供应链副总裁、运营总监和物流总经理，他们希望减少审计人工并降低库存核销。为了降低利润受限物流环境中的商业摩擦，Dexory
              采用订阅式 Robotics-as-a-Service
              模式，月费随设施面积和托盘存储位置总数变化。这种定价让配送中心可以完全用运营费用预算支付部署，无需企业资本开支审批。标准订阅把硬件维护、持续远程监控、软件升级和客户成功管理打包成一项经常性服务。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动因素、运营约束与尽调现实
        blocks:
          - type: paragraph
            body: >-
              仓库劳动力严重短缺、时薪上涨以及会因库存差异而处罚运营方的严格履约服务协议，正在加快自主库存扫描的采用。监管和安全标准也在重塑设施检查，推动 Dexory Storage Health
              等专用软件功能上线，以实时发现损坏货架、缺陷托盘和危险障碍物。不过，企业扩张仍受具体运营和技术约束：设施必须在高密度货架通道保持足够无线覆盖，并为自主导航留出清晰通道。此外，利润微薄的第三方物流商会严格审查多站点软件部署的回本周期，导致供应商支持的经济模型与独立的全车队运营验证之间出现缺口。
            claimRefs:
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: WMS 记录系统与现场实物真实情况的分歧
            body: >-
              企业仓库普遍部署 Warehouse Management Systems，但交易数据库记录的是某地点应有的库存，而非实物实际位置。Dexory
              将自主扫描与数字孪生软件结合为运营真实层，在不改变仓库布局的情况下弥合这道分歧。
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
          - type: callout
            title: 低利润 3PL 运营中经常性 RaaS 开支带来的商业摩擦
            body: >-
              第三方物流商的运营利润率很薄，通常为 3% 至 6%，还受到合同客户转嫁约束。Dexory 的 RaaS 模式虽然消除了前期 CapEx，但要让整个配送网络签下多年订阅，仍需清晰、可独立审计的 ROI
              和快速回本。
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：从被动 WMS 日志到自主真实情况
        blocks:
          - type: paragraph
            body: >-
              自动化仓储智能生态涵盖从现状人工盘点、飞行无人机、履约移动机器人到企业记录系统的广泛替代方案。过去仓储运营依赖 SAP、Manhattan Associates 和 Blue Yonder 等 incumbent
              提供的传统仓储管理系统（WMS）。这些企业平台保留预期库存移动的数字交易日志，本质上是记录系统，而不是实时观察实物的工具。错拣、损坏、未经授权的托盘移动和损耗会让数字库存记录与现场实物之间的差异持续累积。为弥合可见性缺口，配送设施传统上进行定期人工审计和盘点，但这需要大量人工、高位货架使用的高空拣选车，以及频繁中断运营或关闭通道。现代自主方案分成两类：Gather
              AI 和 Verity 等初创公司开创的空中库存无人机，以及地面自主移动机器人（AMR）。在地面机器人细分市场，Locus Robotics、Geek+ 和 GreyOrange
              主要做水平货到人运输和订单履约，而非全面高位库存审计。Dexory 通过部署高大的自主移动机器人，并配套专有 DexoryView 数字孪生平台，直接解决垂直库存智能缺口，搭建连接现场实物与企业软件的运营数据层。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 功能与架构比较：伸缩式 AMR、无人机与履约机器人
        blocks:
          - type: paragraph
            body: >-
              Dexory 的技术差异化主要来自专有实体机器人架构和一体化计算机视觉软件栈。不同于只能在地面作业的标准工业 AMR，Dexory 机器人搭载高分辨率光学摄像头、条码扫描器和深度传感器，自动伸缩塔可升高扫描最高
              18 meters（近 60 feet）的货架。伸缩桅杆可收回成紧凑形态，使机器人无需人工、也不会被上方障碍物阻挡，就能通过标准仓库防火门并在不同储存区域间移动。这种地面伸缩架构相较 Gather AI 和
              Verity 等空中无人机具有明显运营优势：无人机虽能到达高位货架，但飞行续航受电池重量和功耗限制；旋翼下洗气流会扰动仓库粉尘，共用通道还需要安全网，无人机也难以携带重型 LiDAR
              或多传感器环境巡检载荷。相比之下，Dexory 的 AMR 可在地面安全地与仓库人员和叉车并行，无需关闭通道。除条码识别外，Dexory 还用 Storage Health
              视觉模型发现缺陷托盘、货架结构损坏和悬挂缠膜风险，并由 DexoryView Adapt 将实时差异地图转成主动运营指令。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 商业模式、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              在商业包装上，Dexory 采用软件导向的月度订阅模式，消除企业物流运营商的前期资本开支门槛。公司把机器人硬件、持续传感器维护、云分析和 DexoryView 数字孪生界面打包进统一 OPEX
              协议，相比传统数百万美元固定自动化项目能加快采购周期。部署通常两周内达到运营准备状态，对现有仓库实体基础设施和通道配置的改动很少。客户证据显示运营回报可观：企业运营商称审计周期最多缩短
              80%，每个自动化设施每天直接节省的人工超过 16 小时。随着 DexoryView
              在客户供应链多个物流枢纽积累历史库存扫描、库位模式和空间数字孪生，平台会从巡检工具变成不可或缺的运营层。仓储运营商需要多站点网络的统一可见性，因此企业更倾向于统一使用一家库存真实情况供应商，而不是在不同区域配送中心管理彼此割裂的点状方案。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
