  - id: TV003
    title: Dexory 估值情景（乐观、基准、悲观框架）
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 美国和欧洲快速扩张；ARR 到 2027 年达到 $45M+；毛利率超过 75%；软件成功变现
        - 基于 12x–15x ARR 溢价倍数，估值为 $550M–$700M，反映实体 AI 领先地位和快速增长
        - 客户获取成本高，复杂设施中可能出现硬件部署延迟
        - 25% - 市场需求高，但需要执行无瑕且企业扩张不受阻
      - - 基准情景
        - 现有 3PL 客户持续稳步扩展多站点；ARR 达到 $25M–$30M；综合毛利率稳定在约 60%
        - 基于 10x–12x ARR 倍数，估值为 $250M–$350M，在软件利润率与机器人硬件开销之间取得平衡
        - 销售周期更长，二线物流运营商出现适度流失
        - 55% - 与观察到的部署节奏和 C 轮资本规模最一致
      - - 悲观情景
        - 试点流失、站点铺开缓慢；ARR 停留在 $15M 以下；$65M 工具的沉重偿债负担耗尽现金储备
        - $100M–$150M 困境估值或资本重组；清算优先权抹去普通股上行空间
        - 严重流动性紧张，需要下轮融资或紧急出售资产
        - 20% - Eurazeo、Atomico 等信誉良好的一级投资者可缓解部分风险，但债务压力仍使风险上升
    notes: 估值框架基于当前 ARR 和毛利率基准未披露这一前提，对 2027 年表现进行假设建模。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Dexory 自 2022 年成立至 2026 年的公司、产品、资本和地域关键里程碑。
    approximationNotes: 日期来自公开新闻稿、公司公告和行业报道，并四舍五入到公告月份。
    data:
      items:
        - label: 公司成立
          date: 2022-01
          detail: Dexory 由 Andrei Danescu、Adrian Negoita 和 Oana Jinga 在英国创立，旨在解决仓库实体数据盲区。
          tone: positive
        - label: DexoryView 平台商业化发布
          date: 2023-01
          detail: DexoryView 商业发布，将自主移动机器人与实时数字孪生制图结合起来。
          tone: positive
        - label: 宣布进入北美市场
          date: 2024-02
          detail: Dexory 在 Manifest 2024 宣布进入北美物流市场。
          tone: positive
        - label: B 轮融资（$80M）
          date: 2024-10
          detail: 获得由 DTCP 领投的 $80M B 轮融资，Atomico、Lakestar 和 Latitude Ventures 参投。
          tone: positive
        - label: C 轮融资（$165M）
          date: 2025-10
          detail: 完成由 Eurazeo Growth 团队领投的 $165M C 轮融资，用于扩大全球运营和智能体 AI。
          tone: positive
        - label: 新一代机器人与仓储健康功能
          date: 2026-02
          detail: 发布新一代自主机器人，扫描范围扩展至 60ft，并加入计算机视觉仓储健康检测。
          tone: positive
        - label: 北美总部设于 Nashville
          date: 2026-03
          detail: 在田纳西州 Nashville 开设 50,000 sq ft 美国运营总部，加快美国客户接入。
          tone: positive
        - label: British Business Bank 后续融资（£8.5M）
          date: 2026-03
          detail: 获得 British Business Bank 提供的 £8.5M C 轮后续支持。
          tone: positive
        - label: DexoryView Adapt 在 MODEX 2026 发布
          date: 2026-04
          detail: 发布 DexoryView Adapt 推理 AI 层，用于自主仓储运营决策。
          tone: positive
    claimRefs:
      - CO001
      - CO004
      - CO007
      - CO008
      - CO009
      - CO010
      - CO014
  - id: FM001
    title: 仓储智能的约束型市场规模金字塔
    type: pyramid
    summary: 从广义仓库物料搬运自动化到 Dexory 可触达 RaaS 部署的分层市场规模。
    data:
      items:
        - label: 全球仓库自动化与物料搬运
          value: $45B-$55B
          details:
            - >-
              Broadest category including AS/RS, conveyor systems, sorters, and high-bay cranes; largely excluded
              hardware.
          tone: neutral
        - label: 自主移动机器人（AMR）与 AGV 物流
          value: $8B-$12B
          details:
            - Autonomous transport, goods-to-person mobile robots, and robotic floor equipment.
          tone: neutral
        - label: 仓库库存管理与可视化软件
          value: $3.5B-$5.0B
          details:
            - Specialized inventory tracking, yard management, digital twin, and inventory reconciliation modules.
          tone: positive
        - label: 可服务可触达市场（高位托盘设施）
          value: $1.2B-$2.0B
          details:
            - Warehouses with tall vertical racking (>20 ft) requiring automated high-frequency cycle counting.
          tone: positive
        - label: 可服务可获得市场（一级 3PL 与企业配送中心）
          value: $350M-$600M
          details:
            - 3PL networks (DHL, GXO, Maersk, ODW) and Fortune 500 manufacturing distribution centers ready for RaaS.
          tone: positive
        - label: 即期试点与初始扩张管线
          value: $50M-$120M
          details:
            - >-
              Contracted customer multi-site rollouts and active pipeline deployments across North America and Western
              Europe.
          tone: positive
    approximationNotes: 估算的类别规模综合行业仓库自动化基准与 Dexory RaaS 单位经济性；私营公司的 SAM 和 SOM 边界为分析性近似。
    claimRefs:
      - CM005
      - CM008
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 从实时实体真实数据的准确度和自主推理深度两个维度，评估仓库自动化替代方案的战略定位图。
    data:
      points:
        - label: Dexory（自主 AMR + AI 孪生）
          x: 8.5
          'y': 8.5
        - label: Gather AI（自主库存无人机）
          x: 6.5
          'y': 5.5
        - label: Verity（高位自动化无人机）
          x: 6
          'y': 6
        - label: Locus Robotics / Geek+（履约 AMR）
          x: 4
          'y': 8
        - label: 固定 RFID 与货架内传感器
          x: 7.5
          'y': 3.5
        - label: 人工扫描与旧版 WMS 日志
          x: 2
          'y': 2
    approximationNotes: 分数是 1–10 相对序数定位，依据公开能力披露、传感器配置和软件自动化深度得出。
    claimRefs:
      - CP014
      - CP015
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 从仓库实体活动到 RaaS 经常性收入和毛利率的端到端商业转化。
    data:
      nodes:
        - id: facility-onboarding
          label: 设施勘测与接入
          detail: 勘测 3m x 3m 码头和货架；零 CapEx 部署目标为 1–2 周
        - id: data-capture
          label: 自主每日扫描
          detail: 机器人每小时最多扫描 10k 个位置，采集 3D 点云和托盘条码
        - id: dexoryview-twin
          label: DexoryView 数字孪生
          detail: 云平台更新实时库存，并与客户 WMS 对账
        - id: value-realization
          label: 客户价值交付
          detail: 库存准确率超过 99.9%，节省劳动力，3 年 ROI 达 219%
        - id: raas-subscription
          label: 月度 RaaS 订阅
          detail: 经常性订阅费按设施面积和托盘数量计价
        - id: gross-margin
          label: 毛利转化
          detail: 扣除硬件折旧、云计算和现场支持后的综合毛利率
      edges:
        - from: facility-onboarding
          to: data-capture
          label: 部署机器人
        - from: data-capture
          to: dexoryview-twin
          label: 传输遥测数据
        - from: dexoryview-twin
          to: value-realization
          label: 生成洞察
        - from: value-realization
          to: raas-subscription
          label: 推动留存
        - from: raas-subscription
          to: gross-margin
          label: 吸收交付成本
    approximationNotes: 展示 Dexory 的商业订阅模式和交付成本结构；底层利润率和单位成本为非公开信息。
    claimRefs:
      - CI001
      - CI003
      - CI007
      - CI011
  - id: FE001
    title: Dexory 产品与技术架构栈
    type: stack
    summary: 从实体 AMR 硬件到企业 WMS 集成的 Dexory 机器人与仓储智能平台六层架构。
    data:
      layers:
        - label: 企业应用与 WMS 集成层
          detail: 双向同步连接器将 DexoryView 真实数据直接接入 SAP、Manhattan Associates 和 Blue Yonder 等企业 WMS 平台。
        - label: DexoryView 云智能与分析
          detail: 云端数字孪生引擎、空间占用热力图、库位分析和多站点物流可视化高管仪表盘。
        - label: AI 计算机视觉与仓储健康引擎
          detail: 机器学习推理流水线，执行自动条码解码、库存差异检测和货架结构损伤检查。
        - label: 数据摄取与点云处理
          detail: 安全数据流水线处理多层 LiDAR 点云、3D 空间制图，以及设施扫描时采集的高分辨率摄像头数据流。
        - label: 车载自主机器人导航栈
          detail: SLAM 导航、实时动态障碍物检测、自主路径规划，并与仓库人员和叉车安全共存。
        - label: 实体硬件与传感器载荷层
          detail: 自主移动底座、最高伸展至 60 ft（18m）的伸缩传感器塔、多层 LiDAR、光学摄像头和自动化 2 sqm 充电底座。
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE010
      - CE013
  - id: FU001
    title: 有证据支持的客户采用与扩张路径
    type: journey-map
    summary: 公开证据支持从库存控制问题到现场使用及部分多站点扩张的路径，但续约和集中度仍未验证。
    data:
      nodes:
        - id: need
          label: 运营需求
          detail: 人工盘点、库存差异、审计中断或托盘缺失调查构成最初的采购触发点。
          touchpoints:
            - Inventory review
            - Audit preparation
            - Service-level failures
        - id: evaluation
          label: 站点评估
          detail: 运营、自动化、库存和 WMS 负责人评估工作流匹配度与部署要求。
          touchpoints:
            - Site survey
            - Workflow review
            - Buyer approval
        - id: deployment
          label: 初始部署
          detail: 订阅将机器人、分析平台、维护和实施打包，在仓库站点落地。
          touchpoints:
            - Mapping
            - Integration
            - Training
        - id: daily-use
          label: 日常运营使用
          detail: 自动扫描为库存比对、视觉确认和差异解决工作流提供数据。
          touchpoints:
            - Cycle count
            - Dashboard review
            - Corrective action
        - id: outcome
          label: 结果验证
          detail: 客户评估准确性、错误减少、劳动力重新配置、审计准备度和履约影响。
          touchpoints:
            - Accuracy review
            - Error analysis
            - ROI assessment
        - id: expansion
          label: 多站点扩张
          detail: 已点名的证据显示部分客户增加站点或能力，但公开续约队列和集中度数据缺失。
          touchpoints:
            - Renewal
            - Additional sites
            - New robot generation
    approximationNotes: 该序列综合有记录的客户工作流；不代表已披露转化率、统一阶段耗时或完整客户漏斗。
    claimRefs:
      - CU010
      - CU014
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 映射 Dexory 关键技术、财务、运营和监管风险敞口领域的可能性与影响的风险矩阵。
    data:
      columns:
        - id: low-likelihood
          label: 低可能性
        - id: med-likelihood
          label: 中可能性
        - id: high-likelihood
          label: 高可能性
      rows:
        - id: critical-impact
          label: 严重影响
          values:
            - value: Telescoping Mast Failure
              score: 3
              note: 现场仓库通道内 18m 伸缩塔发生机械故障
            - value: Debt Default / OSHA Halt
              score: 5
              note: $65M 债务违约或重大 AMR 碰撞导致停运
            - value: Anchor 3PL Churn
              score: 4
              note: DHL 或 Maersk 取消车队铺开
        - id: high-impact
          label: 高影响
          values:
            - value: IP Infringement Action
              score: 2
              note: 针对自主扫描方法的专利挑战
            - value: Hardware Breakdown / 72h SLA
              score: 4
              note: 传感器失明或现场维修长期延迟
            - value: RaaS Margin Compression
              score: 4
              note: 车队维护成本上升压低毛利率
        - id: medium-impact
          label: 中影响
          values:
            - value: Regional Homologation
              score: 2
              note: AMR 适配当地安全规则延迟
            - value: Storage Health AI Gaps
              score: 3
              note: 漏报有缺陷托盘和缠绕膜
            - value: WMS/ERP Integration Lag
              score: 3
              note: 旧软件 API 不匹配，接入速度变慢
        - id: low-impact
          label: 低影响
          values:
            - value: Minor Sensor Calibration
              score: 1
              note: 计划维护期间的例行光学重新校准
            - value: Non-Critical Telemetry Glitch
              score: 2
              note: DexoryView 云端仪表盘短暂延迟
            - value: Packaging Barcode Smudging
              score: 2
              note: 条码无法读取，需要操作员手动扫描
        - id: negligible-impact
          label: 可忽略影响
          values:
            - value: Docking Station Relocation
              score: 1
              note: 为机器人充电器略微调整设施地面
            - value: Cosmetic Robot Wear
              score: 1
              note: 仓库粉尘造成的底盘表面擦痕
            - value: User Dashboard Theme Preference
              score: 1
              note: 操作员自定义可视化布局设置
        - id: informational-impact
          label: 信息性影响
          values:
            - value: Routine Firmware Notification
              score: 1
              note: 计划中的无线软件版本更新
            - value: Off-Peak Cycle Rescheduling
              score: 1
              note: 调整自主扫描窗口以匹配班次休息时间
            - value: Space Utilization Metric Shift
              score: 1
              note: 预计托盘存储数量出现季节性波动
    approximationNotes: 评估反映根据已报告运营、财务和技术参数得出的定性严重程度与可能性判断。
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR010
      - CR012
      - CR013
  - id: FV001
    title: 估值立场与投资建议决策流程
    type: flow
    summary: 将实体机器人验证和 C 轮融资与财务不透明、债务压力及最终继续研究立场串联起来的逻辑评估序列。
    data:
      nodes:
        - id: commercial-proof
          label: 运营牵引力
          description: 已在多个国家部署 GXO、DHL、Maersk，扫描位置超过 5 亿个
        - id: capital-scale
          label: 资本支持
          description: Eurazeo Growth 领投、Atomico 和 Lakestar 参投的 $165M C 轮融资
        - id: financial-opacity
          label: 信息不对称
          description: 公开 ARR、毛利率拆分、客户留存和单位经济性均未披露
        - id: preference-overhang
          label: 资本结构
          description: Bootstrap Europe 提供的 $65M 优先级债务工具和多层清算优先权
        - id: valuation-stance
          label: 估值立场
          description: 按纯 SaaS 倍数为硬件支持型运营定价，估值偏高
        - id: final-recommendation
          label: 投资建议
          description: 等待机密数据室验证单位经济性后再决定，当前建议继续研究
      edges:
        - from: commercial-proof
          to: capital-scale
        - from: capital-scale
          to: financial-opacity
        - from: financial-opacity
          to: preference-overhang
        - from: preference-overhang
          to: valuation-stance
        - from: valuation-stance
          to: final-recommendation
    approximationNotes: 图示展示导向建议的定性依赖架构；节点权重为非数值。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV010
