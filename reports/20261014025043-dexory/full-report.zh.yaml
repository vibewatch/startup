  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 自主机器人硬件与感知架构
        blocks:
          - type: paragraph
            body: >-
              Dexory 的实体平台以一款专为密集仓储环境设计的自主移动机器人（AMR）为核心。机器人不需要预装 RFID 标签、磁性导引条或顶置摄像头网格等固定基础设施，而是依靠多层 LiDAR、高清光学摄像头和自主
              SLAM 导航算法穿行仓库通道。2026 年 2 月，Dexory 发布下一代硬件平台，将垂直扫描范围从 40 feet 扩大到 60 feet（约 18
              meters），以适应现代高位货架和双深式配置。移动单元能与作业中的仓库人员及物料搬运设备安全并行，无需关闭通道即可自主导航。设施要求很少，只需一个可接入、占地 2-square-meter
              并配专用电源的充电位。然而，独立机器人评估指出，Dexory 尚未公开机器人整备重量、电池化学体系、单次充电连续运行时间，或依据 European Union Cyber Resilience Act
              的合规申报等关键工程规格。
