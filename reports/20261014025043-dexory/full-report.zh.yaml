    title: 风险
    sections:
      - number: '7.1'
        title: 监管、机械安全与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              Dexory 在多班次物流环境部署配有机械伸缩塔的自主移动机器人，塔高最高 18 meters（新公布范围为 60
              feet）。高大机器人结构与仓库拣货员、运行中的叉车和工业设备并行，会带来实际人身安全暴露。在英国和欧洲机械指令（包括 EU Machinery Regulation）及美国 OSHA
              职业标准下，自主移动设备必须遵守严格的功能安全和障碍规避协议。伸缩塔撞击上方基础设施、照明或货架，或未能避让高速工业叉车，可能导致灾难性结构坍塌、监管停工令或雇主责任诉讼。Dexory 每日还会为每个站点采集最高
              250 TB 高清图像和 2 TB 3D 点云；若连续扫描捕捉员工行动或面部特征，可能触发 GDPR 和生物识别隐私法规摩擦。Dexory 已取得 SOC 1、SOC 2 Type I 和 ISO 27001
              认证，以满足企业 IT 与数据控制标准，但欧洲、北美和 APAC 的跨境部署仍需持续接受当地安全监管机构合规审查。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
      - number: '7.2'
        title: 运营故障模式、维护 SLA 与硬件扩张
        blocks:
          - type: paragraph
            body: >-
              Dexory 采用全栈 Robotics-as-a-Service（RaaS）模式，硬件维护、远程监控和现场维修义务全部由公司承担。公司声称最新机器人最长八年免维护，依靠 24/7
              远程监控和云诊断。但当光学摄像头老化、空中仓尘使 LiDAR 传感器失明，或伸缩塔机械执行器故障等关键硬件问题发生时，Dexory 合同承诺 24 至 72
              小时内到场。在依靠每日扫描核对库存、避免下游缺货的关键物流设施中，硬件停机数日会打乱仓库工作流，削弱核心软件价值。Storage Health
              软件模块虽运用计算机视觉和机器学习主动发现损坏货架、缺陷托盘、悬挂缠膜及障碍风险，但实体机器人在多样仓库条件下持续运行，仍暴露于严苛环境。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 合作伙伴生态与关键客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Dexory 的商业拓展和现场扩张高度依赖由 DHL、GXO、Maersk、Stellantis 等一级全球 3PL 运营商和企业制造业负责人组成的集中客户群，以及 C5MI、Infios、Raymond
              Storage Concepts 等系统集成伙伴。大型 3PL 集团的商业集中会造成明显议价权不对称：多站点企业部署通常有漫长采购周期、严格的试点转生产标准和批量折扣压力。此外，Dexory
              依赖第三方供应链提供精密 LiDAR 传感器、高清光学摄像头、工业机械升降机和云计算基础设施。专用光学传感器供应中断，或 DexoryView 与客户异构 Warehouse Management
              Systems（WMS）及 ERP 栈之间的 API 通信故障，都可能拖慢站点上线；公司当前目标部署窗口为 1-to-2 week。
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 财务模型可持续性、偿债与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Dexory 的财务画像受到 RaaS 模式下在自身资产负债表上制造、持有并折旧车队资产的高资本密集度影响。在 2025 年 10 月完成的 USD 165M Series C（2026 年 3 月又获得
              British Business Bank £8.5M 追加融资）中，Dexory 获得 Eurazeo 领投的 USD 100M 风险股权，以及 Bootstrap Europe 提供的 USD 65M
              风险债务。偿还 $65M 结构化债务需要稳定、高毛利、类似软件的经常性现金流；但硬件组装、现场技术人员和 Wallingford、Nashville、Australia
              的国际扩张都会产生大量运营现金消耗。若车队利用率下滑、关键 3PL 客户流失加速，或替换成本挤压硬件毛利，债务契约可能触发严重股权稀释。投资人的具体论点失效触发器包括：(1) 任何导致 OSHA/HSE
              停工的致命或高严重度工作场所安全事故；(2) Bootstrap Europe $65M 债务额度违约或限制性契约执行；(3) DHL、Maersk 或 GXO 中两家或更多锚定客户公开取消合同或不续约；(4)
              RaaS 车队持续无法实现超过 60% 的软件式毛利率。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: RaaS 资本密集度下的风险债务杠杆
            body: >-
              Dexory 除 $100M Series C 股权份额外，还背负 Bootstrap Europe 提供的 $65M 风险债务。公司采用 RaaS
              模式为实体机器人硬件融资，而不是确认前期硬件销售；如果多站点部署延迟或现场维护成本意外上升，运营现金流达到盈亏平衡前的偿债覆盖可能受到威胁。
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
          - type: callout
            title: 用于确认性复核的关键尽调要求
            body: >-
              投资人必须要求完整披露：(1) 所有运营仓库部署的历史安全和险些发生事故日志；(2) Bootstrap Europe $65M 额度的详细债务契约、利率和还款计划；(3) 24-72 小时现场维护保证的 SLA
              履约记录；(4) 将 DexoryView 软件订阅与机器人硬件折旧及现场服务分开的毛利率拆分。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR012
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Dexory 已在自主移动机器人与企业仓库智能的交汇处建立差异化定位。公司依靠自研高桅杆自主机器人和 DexoryView
              数字孪生平台，在无需改造基础设施的情况下，持续实时地看清整层仓储货架的库存。GXO、DHL、Maersk 等全球物流巨头， 以及 Stellantis、GE Appliances
              等工业龙头的商业验证，说明产品确实找到了市场，也能解决实际运营问题。然而， Dexory 仍是私营公司，收入、利润率和客户流失率均未披露，公开证据尚不足以支持直接买入。我们的总体建议为
              继续研究，置信度中等、风险高。技术护城河和客户名单都很有吸引力，但机器人部署需要大量实体资本；私募轮次 却按高溢价软件倍数给公司定价，因此当前估值立场仍偏激进。
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
      - number: '8.2'
        title: 资本结构与融资背景
        blocks:
          - type: paragraph
            body: >-
              Dexory 在 2025 年末宣布完成 $165 million 的 Series C 轮融资，资本结构随之显著扩张。该轮由 Eurazeo Growth 领投， 主投金额为 $100 million，LTS
              Growth、Endeavor Catalyst、DTCP、Atomico 和 Lakestar 参与。2026 年 3 月，British Business Bank 又投入 9.8 million
              euros。更关键的是，Dexory 资产负债表上还有 Bootstrap Europe 提供的 $65 million
              增长债务额度。这种股权加债务的融资结构，既反映出扩张硬件驱动仓储运营的资本密集度，也反映出公司在纳什维尔设立
              北美总部后、抢占全球市场份额的激进策略。债务融资虽能减少创始人股权稀释，却带来优先受偿权和偿债义务；如果企业 采用速度放缓，或硬件折旧加快，初级股权持有人将面临显著的估值压顶。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 情景分析与估值框架
        blocks:
          - type: paragraph
            body: >-
              给 Dexory 估值，必须在高毛利软件业务的想象空间与实际管理实体机器人扫描车队的运营现实之间取平衡。基准情景假设已签约 3PL 网络持续扩站，到 2027 年带来 $25 million 到 $30
              million 的年度经常性收入，综合毛利率为 60%；按 10x 到 12x 的远期收入倍数，企业估值可支撑在 $250 million 到 $350 million。乐观情景下，北美快速采用推动 ARR 接近
              $45 million， 按软件级倍数，估值可能达到 $550 million 到 $700 million。悲观情景则计入客户集中、企业采购周期拉长以及优先债务偿付 压力，估值可能压缩至 $100
              million 到 $150 million，并引发资本重组摩擦。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 退出准备度与尽调重点
        blocks:
          - type: paragraph
            body: >-
              Dexory 未来的流动性路径，可能是被大型供应链管理软件商收购，或等仓库自动化车队成熟后 IPO。但目前缺乏透明的单位经济
              和经审计的财务记录，退出准备度因此受限。潜在投资人应优先在保密数据室核查三件事：第一，GXO、Maersk 等标杆客户的 客户群组级净收入留存率和扩站速度；第二，持续性 DexoryView
              软件订阅与机器人维护成本之间的准确毛利率拆分；第三， Bootstrap Europe 债务额度附带的契约和到期安排。在经过私下尽调确认这些指标之前，投资纪律要求继续维持 继续研究的立场。
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议立场：估值偏高，继续研究
            body: Dexory 已在全球 3PL 和一线制造商中获得真实的企业客户验证，但公开 ARR、毛利率和资本回报条款均未披露，因此应继续 研究，而不是过早买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
          - type: callout
            title: 优先债务压顶与资本结构摩擦
            body: Bootstrap Europe 的 $65 million 债务额度叠加优先股层级，形成较高的清算优先权；一旦估值下调融资，或公司以低于峰值 预期的价格被收购，普通股回报都会受到压制。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV014
