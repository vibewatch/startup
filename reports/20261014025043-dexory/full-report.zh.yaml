      - number: '3.4'
        title: 替代风险、商品化威胁与负面信号
        blocks:
          - type: paragraph
            body: >-
              尽管 Dexory 早期差异化明显，随着仓储机器人市场成熟，公司仍面临战略和竞争逆风。首要长期威胁来自现有企业 WMS 厂商的潜在反击。SAP、Manhattan Associates 和 Oracle
              等软件巨头拥有深厚客户关系、根深蒂固的 ERP 集成和庞大分销能力。若现有 WMS
              平台为现成视觉传感器开发标准接口，或收购商品化机器人供应商，它们就可能拿走软件推理利润，把专用硬件厂商降为低毛利设备供应商。无人机领域的直接竞争者也在积极优化载荷重量和自主飞控，这可能缩小其在宽通道、标准托盘设施中的能力差距。硬件在全球不同仓库环境扩张，还会暴露于地面不平、光照变化和老旧物流站点网络连接不稳定等运营风险。Dexory
              快速完成 Series C 扩张、客户采用率高，形成了坚实商业缓冲，但长期防御力仍取决于能否扩展 DexoryView Adapt 等专有 AI 推理层，在基础光学扫描之外交付经验证的 ROI。
            claimRefs:
              - CP004
              - CP010
              - CP016
