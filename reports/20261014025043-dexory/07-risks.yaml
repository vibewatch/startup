chapter:
  number: 7
  title: "Risks"
  summary: "Dexory operates capital-intensive autonomous robotics across live warehouse floors, where severe technical, operational, and regulatory failure modes intersect with heavy debt service and high customer concentration. While SOC 1, SOC 2 Type I, and ISO 27001 certifications mitigate enterprise infosec concerns, physical safety compliance in mixed human-AMR environments, 24-72 hour on-site service latency, and debt repayment on $65M in venture debt represent critical thesis risks."
sections:
  - id: "regulatory-legal-exposure"
    title: "Regulatory, Machinery Safety, and Data Governance Risks"
    body: "Dexory deploys autonomous mobile robots equipped with mechanical telescoping towers extending up to 18 meters (and newly announced 60-foot ranges) across multi-shift logistics environments. Operating tall robotic structures alongside human warehouse pickers, active forklifts, and industrial machinery creates tangible physical safety exposure. Under UK and European machinery directives (including the EU Machinery Regulation) and US OSHA occupational standards, autonomous mobile equipment must adhere to strict functional safety and obstacle avoidance protocols. A collision between an extending tower and overhead infrastructure, lighting, or warehouse racking—or failure to yield to high-speed industrial forklifts—could precipitate catastrophic structural collapse, regulatory halt orders, or employer liability lawsuits. Furthermore, Dexory’s daily capture of up to 250 TB of high-resolution images and 2 TB of 3D point cloud data per site presents regulatory friction under GDPR and biometric privacy statutes if employee movements or facial likenesses are captured during continuous scanning passes. While Dexory has achieved SOC 1, SOC 2 Type I, and ISO 27001 certifications to address enterprise IT and data control standards, cross-border deployments across Europe, North America, and APAC require ongoing compliance reviews with local safety inspectorates."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-hardware-reliability"
    title: "Operational Failure Modes, Maintenance SLA, and Hardware Scaling"
    body: "Dexory operates under a full-stack Robotics-as-a-Service (RaaS) model where hardware maintenance, remote monitoring, and on-site repair obligations remain entirely with the company. The company asserts that its newest robots are maintenance-free for up to eight years, relying on 24/7 remote monitoring and cloud diagnostics. However, when critical hardware breakdowns occur—such as optical camera degradation, LiDAR sensor blinding from airborne warehouse dust, or mechanical actuator failures on the telescoping tower—Dexory’s contractual response commitment specifies on-site arrival within 24 to 72 hours. In mission-critical logistics facilities where operators rely on daily scans to reconcile inventory and prevent downstream stockouts, a multi-day hardware outage disrupts warehouse workflows and undermines the core software value proposition. While Dexory’s recently launched Storage Health software module uses computer vision and machine learning to proactively detect damaged racking, defective pallets, hanging shrink wrap, and obstruction risks, continuous physical robot operations across diverse warehouse conditions remain exposed to harsh operating environments."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR002"
  - id: "partner-customer-dependencies"
    title: "Partner Ecosystem and Key Customer Concentration Risks"
    body: "Dexory’s commercial go-to-market and field scaling rely heavily on a concentrated cohort of tier-1 global 3PL operators and enterprise manufacturing leaders, including DHL, GXO, Maersk, and Stellantis, alongside system integration partners such as C5MI, Infios, and Raymond Storage Concepts. Commercial concentration among massive 3PL conglomerates creates distinct pricing power asymmetry: multi-site enterprise rollouts often involve elongated procurement cycles, stringent pilot-to-production conversion criteria, and volume discount pressure. Furthermore, Dexory depends on third-party hardware supply chains for precision LiDAR sensors, high-resolution optical cameras, industrial mechanical lifts, and cloud compute infrastructure. A supply disruption in specialized optical sensors or an API communication failure connecting DexoryView with heterogeneous customer Warehouse Management Systems (WMS) and ERP stacks can stall site onboarding, which currently targets a 1-to-2 week deployment window."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR003"
  - id: "financial-model-capital-intensity"
    title: "Financial Model Sustainability, Debt Service, and Thesis-Break Triggers"
    body: "Dexory’s financial profile is shaped by the high capital intensity inherent in manufacturing, owning, and depreciating fleet assets on its own balance sheet under the RaaS model. In its USD 165M Series C round closed in October 2025 (supplemented by an £8.5M follow-on from the British Business Bank in March 2026), Dexory raised USD 100M in venture equity led by Eurazeo alongside USD 65M in venture debt from Bootstrap Europe. Servicing $65M in structured debt requires consistent, high-margin software-like recurring cash flows; however, Dexory’s hardware assembly, field technician staffing, and international expansion across Wallingford, Nashville, and Australia generate substantial operating cash burn. If fleet utilization dips, customer churn accelerates among key 3PL accounts, or hardware gross margins compress due to replacement costs, debt covenants could trigger severe equity dilution. Concrete thesis-break triggers for investors include: (1) any fatal or high-severity workplace safety incident resulting in an OSHA/HSE operational shutdown; (2) default or restrictive covenant enforcement under the $65M Bootstrap Europe debt facility; (3) public contract cancellation or non-renewal by two or more anchor accounts (DHL, Maersk, or GXO); and (4) persistent failure to achieve software-like gross margins above 60% across the RaaS fleet."
    claimRefs:
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
callouts:
  - calloutType: "risk"
    title: "Venture Debt Leverage Under RaaS Capital Intensity"
    body: "Dexory carries $65M in venture debt from Bootstrap Europe alongside its $100M Series C equity tranche. Because Dexory finances physical robot hardware on a RaaS model rather than recognizing upfront hardware sales, delayed multi-site rollouts or unexpected field maintenance costs could jeopardize debt service coverage before operating cash flow reaches breakeven."
    claimRefs:
      - "CR012"
      - "CR013"
  - calloutType: "recommendation"
    title: "Key Diligence Asks for Confirmatory Review"
    body: "Investors must demand full disclosure of: (1) historical safety and near-miss logs across all live warehouse deployments; (2) detailed debt covenants, interest rates, and repayment schedules for the $65M Bootstrap Europe facility; (3) SLA compliance records for the 24-72 hour on-site maintenance guarantee; and (4) gross margin breakdown separating DexoryView software subscriptions from robotic hardware depreciation and field servicing."
    claimRefs:
      - "CR006"
      - "CR012"
      - "CR015"
