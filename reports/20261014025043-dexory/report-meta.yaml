companyProfile:
  summary: >-
    Dexory is a privately held warehouse-intelligence company that combines autonomous inventory-scanning robots with
    the DexoryView analytics layer to help large logistics and industrial operators reconcile physical stock with
    warehouse-system records. The business is headquartered in Wallingford, Oxfordshire, with North American operations
    in Nashville, and it has scaled through a subscription-style robots-as-a-service model backed by a large venture
    investor syndicate.
