chapter:
  number: 5
  title: "Product & Technology"
  summary: "Dexory combines autonomous mobile scanning robots with its DexoryView digital twin platform to deliver real-time warehouse inventory visibility and automated rack health inspections without fixed facility infrastructure."
sections:
  - id: "hardware-sensing-architecture"
    title: "Autonomous Robot Hardware and Sensing Architecture"
    body: "Dexory’s physical platform centers on an autonomous mobile robot (AMR) designed specifically for dense warehouse environments. Rather than requiring pre-installed fixed infrastructure such as RFID tags, magnetic guide strips, or overhead camera grids, the robot relies on an onboard sensor payload comprising multi-layer LiDAR, high-definition optical cameras, and autonomous SLAM navigation algorithms to traverse warehouse aisles. In February 2026, Dexory announced its next-generation hardware platform, extending its vertical scanning range from 40 feet to 60 feet (approximately 18 meters) to accommodate modern high-bay racking and double-deep configurations. The mobile unit operates safely alongside active warehouse personnel and material handling machinery, navigating autonomously without aisle shutdowns. Operational facility requirements remain minimal, demanding only an accessible 2-square-meter charging dock footprint with dedicated power supply. However, independent robotics assessments highlight that Dexory has not publicly disclosed critical hardware engineering specifications, including robot curb weight, battery chemistry, continuous runtime per charge, or compliance filings under the European Union Cyber Resilience Act."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE010"
      - "CE012"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "dexoryview-intelligence-modules"
    title: "DexoryView Platform and Core Intelligence Modules"
    body: "At the software layer, the company delivers DexoryView, a cloud-native warehouse intelligence and digital twin platform first commercialized in 2023. DexoryView aggregates the high-density spatial point clouds and visual imagery captured during autonomous robot runs, converting raw physical scans into a synchronized virtual replica of facility inventory. The platform structures functionality across two primary software modules: Integrity and Optimise. The Integrity module applies machine learning computer vision models to perform continuous stock validation and compliance audits, identifying misplaced pallets, phantom inventory, and discrepancy gaps against host warehouse management records. In February 2026, Dexory expanded this layer with 'Storage Health', a specialized inspection feature that analyzes high-resolution imagery to detect damaged upright racking, crushed goods, defective pallets, and hanging shrink wrap that present structural collapse or fire hazards. The complementary Optimise module focuses on space efficiency, analyzing historical occupancy patterns, slotting logic, and pallet consolidation opportunities to guide replenishment decisions and elevate overall facility throughput."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE005"
      - "CE007"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "workflow-integration-deployment"
    title: "Customer Workflow, WMS Integration, and Deployment Model"
    body: "Dexory positions its solution directly against manual cycle counting, which traditionally requires labor-intensive scissor lift operations, barcode scanning guns, and scheduled facility downtime. By conducting autonomous scans—typically scheduled during night shifts to avoid peak operational traffic—the robot scans up to 10,000 pallet locations per hour, enabling full facility audits in a single operational window. Dexory claims customer deployments achieve 99.9% inventory tracking accuracy and experience an 80% reduction in audit labor time alongside a 20% throughput improvement. Crucially, DexoryView does not operate as an isolated silo; it functions as an operational data reconciliation layer that interfaces bi-directionally with existing enterprise warehouse management systems, including SAP, Manhattan Associates, and Blue Yonder. Commercial distribution follows a monthly subscription model that packages robot hardware, software licenses, maintenance, and monitoring into operating expenditures without upfront capital expenditure. Integration partner Actel Robotics indicates that end-to-end site onboarding and WMS connector integration typically achieve operational go-live within one to two weeks."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "differentiation-technical-risks"
    title: "Technical Differentiation, Verification Gaps, and Diligence Risks"
    body: "Dexory’s primary technical moat stems from its combination of high-bay physical data acquisition with real-time digital twin reconstruction, bypassing the infrastructure lock-in and high installation costs associated with fixed sensor grids. However, rigorous technical diligence reveals several material verification gaps. First, Dexory maintains a strictly proprietary, closed ecosystem with zero public developer documentation, open APIs, or community developer signals, preventing independent assessment of middleware extensibility, codebase maintainability, or integration debt. Second, while the hardware achieves vertical reach up to 60 feet, the absence of public battery degradation benchmarks, thermal operating thresholds for cold-storage facilities, or published mean time between failures (MTBF) limits underwriting visibility into lifecycle maintenance costs. Third, independent robotics reviewers emphasize that regulatory certifications and European product security compliances remain unconfirmed in public filings. Investors must request detailed API integration contracts, historical robot maintenance records, and false-positive defect rates for Storage Health before underwriting long-term software margins."
    claimRefs:
      - "CE004"
      - "CE008"
      - "CE012"
      - "CE015"
