evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-burn
    missingEvidence: >-
      Audited financial statements confirming Dexory's exact post-Series C post-money equity valuation, annual recurring
      revenue (ARR), gross margins, and monthly cash burn rate.
    whyItMatters: >-
      Without disclosed valuation terms or software margin splits, assessing enterprise valuation multiples and capital
      efficiency relies on unconfirmed venture financing totals rather than audited operational economics.
    diligencePath: >-
      Obtain management financial disclosures, subscription ARR breakdown, and statutory filing accounts from UK
      Companies House upon publication.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-cap-table
    missingEvidence: >-
      Complete cap table ownership percentages, voting rights, and liquidation preferences across seed, Series A, B, and
      C institutional share classes.
    whyItMatters: >-
      Partial reporting enumerates lead institutional syndicate members but leaves exact cap table distribution, founder
      dilution, and governance control thresholds undisclosed.
    diligencePath: >-
      Review shareholder register filings at UK Companies House and inspect Series C investment agreements and articles
      of association.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: roi-generalizability
    missingEvidence: >-
      Audited multi-site customer financial data isolating net savings, RaaS subscription expense, and payback duration
      across non-composite operational deployments.
    whyItMatters: >-
      Marketing materials cite a composite Forrester study claiming 219% ROI over three years, but multi-facility
      enterprise rollouts may experience lower net returns in low-margin 3PL contracts.
    diligencePath: >-
      Request customer-level ROI case evaluations and renewal cohort payback data directly from Dexory commercial
      leadership.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: roi-payback-timeline
    missingEvidence: >-
      Clarification on whether the 219% ROI figure represents a 6-month realization period or a 3-year cumulative net
      present value calculation.
    whyItMatters: >-
      Dexory FAQ documentation references 219% ROI in under 6 months, whereas solutions disclosures cite 219% average
      ROI over 3 years with payback under 6 months.
    diligencePath: >-
      Inspect the full Forrester Consulting Total Economic Impact study documentation to verify the exact cash flow
      horizon and discount rate.
  - type: missing-source
    severity: material
    topic: competitor-displacement-metrics
    missingEvidence: >-
      Independent third-party churn and displacement head-to-head data comparing Dexory against Gather AI, Verity, and
      legacy WMS audits across multi-facility enterprise deployments.
    whyItMatters: >-
      Understanding whether enterprise customers multi-home or churn between drone-based scanners and telescopic AMRs
      determines long-term moat durability and pricing power.
    diligencePath: >-
      Request customer reference calls from joint deployments (e.g. DHL, Maersk) to inspect renewal retention rates and
      comparative pilot conversion data.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited income statements, broken-out annual recurring revenue (ARR), gross margin split between software and
      hardware service delivery, and net revenue retention (NRR) cohorts.
    whyItMatters: >-
      Without segmented gross margins and disclosed ARR, investors cannot evaluate whether Dexory operates with
      high-margin software SaaS economics or capital-intensive robotic hardware-leasing unit economics.
    diligencePath: >-
      Request confidential management accounts, historical cohort retention tables, customer contract ARR waterfalls,
      and equipment depreciation schedules under NDA in a formal data room.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signals
    missingEvidence: >-
      Public developer SDK, GitHub repository activity, technical API reference documentation, or practitioner community
      discussions for DexoryView integration.
    whyItMatters: >-
      Dexory operates as a vertically integrated proprietary hardware and software platform, preventing independent
      software engineering evaluation of API reliability, connector extensibility, or technical debt.
    diligencePath: >-
      Request architecture design documents, API OpenAPI specifications, and developer integration guidelines during
      technical management diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: technical-specifications
    missingEvidence: >-
      Complete hardware specification sheet detailing robot curb weight, battery chemistry, runtime per charge, recharge
      duration, and EU Cyber Resilience Act compliance.
    whyItMatters: >-
      Without battery runtime and weight data, underwriters cannot independently verify whether a single AMR can sustain
      full facility coverage across high-throughput 24/7 multi-shift operations without requiring redundant robot units.
    diligencePath: >-
      Obtain manufacturer hardware engineering specification sheets and safety compliance test reports directly from
      Dexory during diligence.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer-level cohorts showing NRR, GRR, logo churn, renewal timing, contract duration, paid sites, and
      top-customer revenue concentration.
    whyItMatters: >-
      Deployment announcements do not establish durable recurring revenue or show whether Dexory depends on a small
      number of large logistics accounts.
    diligencePath: >-
      Request the customer ledger and contract cohort export, reconcile it to invoiced revenue, and sample renewal
      documents for the ten largest accounts.
    relatedQuestionRefs:
      - QU005
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster separating paid production deployments, pilots, inactive sites, channel-led installations, and
      customer-approved references.
    whyItMatters: >-
      The named examples are credible but cannot establish the size, conversion rate, or composition of the installed
      customer base.
    diligencePath: >-
      Obtain a dated CRM and deployment export with customer, site, start date, status, robot count, subscription value,
      and renewal date, then verify a sample directly.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Independently audited before-and-after outcomes across multiple customers using consistent definitions, periods,
      sites, and denominators.
    whyItMatters: >-
      Current outcomes mix company-selected testimonials, customer quotations, and a commissioned composite model,
      limiting portfolio-wide comparability.
    diligencePath: >-
      Request raw baseline and post-deployment KPI files for representative sites and validate inventory accuracy,
      error, labor, audit, and fulfillment calculations.
    relatedQuestionRefs:
      - QU004
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-compliance-tr001
    missingEvidence: >-
      Comprehensive regulatory compliance filing audits across global jurisdictions, expanding upon the sample
      evaluation in TR001.
    whyItMatters: >-
      Table TR001 operates on a sample enumeration scope; exhaustive multi-jurisdictional homologation and safety audits
      remain unconfirmed.
    diligencePath: >-
      Obtain machinery safety compliance dossiers, CE declaration of conformity documents, and UL certification reports
      from legal counsel.
    relatedTableRefs:
      - TR001
    relatedQuestionRefs:
      - QR001
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Covenant terms, amortization schedules, and interest rates for the $65M Bootstrap Europe debt facility.
    whyItMatters: >-
      Debt service requirements under capital-intensive RaaS hardware models constrain operating runway and risk equity
      dilution.
    diligencePath: >-
      Review debt facility credit agreement, covenant thresholds, and security liens on robotic hardware assets during
      confirmatory diligence.
    relatedQuestionRefs:
      - QR006
  - type: missing-source
    severity: material
    topic: field-uptime-mtbf
    missingEvidence: >-
      Mean time between failures (MTBF) and fleet-wide on-site maintenance response time distributions across live 3PL
      customer facilities.
    whyItMatters: >-
      A 24-72 hour on-site SLA risk can cause critical inventory reconciliation outages in continuous 24/7 supply chain
      environments.
    diligencePath: >-
      Request audited customer SLA ticket logs, hardware replacement rates, and mean time to repair (MTTR) figures from
      Dexory customer operations.
    relatedQuestionRefs:
      - QR003
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration-metrics
    missingEvidence: >-
      Detailed revenue concentration percentages and annual recurring revenue breakdown across top accounts (DHL,
      Maersk, GXO, Stellantis).
    whyItMatters: >-
      High concentration among a few 3PL accounts exposes Dexory to contract renegotiation risk and contract termination
      shocks.
    diligencePath: Examine customer revenue cohorts and Master Services Agreement (MSA) renewal schedules in the virtual data room.
    relatedQuestionRefs:
      - QR005
  - type: private-evidence-only
    severity: material
    topic: undisclosed-financials
    missingEvidence: >-
      Audited financial statements detailing Dexory's current ARR, software-versus-hardware gross margins, cash burn
      rate, and contract renewal rates.
    whyItMatters: >-
      Without audited ARR and margin splits, public valuation models rely on head-count and peer heuristics rather than
      verified cash generation.
    diligencePath: >-
      Obtain management accounts and confidential data room access under NDA covering trailing twelve months revenue,
      customer cohorts, and gross margin waterfalls.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: minor
    topic: debt-covenants
    missingEvidence: >-
      Detailed terms, interest rates, conversion rights, and restrictive covenants governing the $65 million Bootstrap
      Europe debt facility.
    whyItMatters: >-
      Senior debt covenants can impose minimum cash balances or growth milestones that constrain strategic flexibility
      and common equity upside.
    diligencePath: >-
      Review debt facility documentation and cap table liquidation waterfall schedules in the Series C investment
      agreement.
    relatedQuestionRefs:
      - QV001
      - QV009
