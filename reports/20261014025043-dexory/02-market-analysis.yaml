callouts:
- calloutType: insight
  title: Divergence Between WMS Systems of Record and Physical Floor Ground Truth
  body: While enterprise warehouses universally deploy Warehouse Management Systems, these transactional databases record what inventory ought to be in location rather than actual physical placement. Dexory positions its combination of autonomous scanning and digital twin software as an operational ground-truth layer that bridges this divergence without requiring warehouse layout changes.
  claimRefs:
  - CM002
  - CM004
- calloutType: risk
  title: Commercial Friction from Recurring RaaS Overhead in Low-Margin 3PL Operations
  body: Third-party logistics providers operate under thin operating margins (often 3% to 6%) and contractual customer pass-through constraints. While Dexory's RaaS model eliminates upfront CapEx, securing multi-year subscription commitments across entire distribution networks requires clear, independently auditable ROI and rapid payback periods.
  claimRefs:
  - CM009
  - CM014
