chapter:
  number: 4
  title: "Financials"
  summary: "Dexory operates a Robots-as-a-Service (RaaS) subscription model that bundles autonomous scanning robots with its DexoryView cloud digital-twin intelligence platform. The company has raised $165 million in equity and debt financing, led by a $100 million Series C and Bootstrap Europe debt facility, while demonstrating rapid deployment and compelling customer ROI, though detailed ARR, gross margin splits, and net retention remain confidential private data."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model, Pricing Structure, and Commercial Contracts"
    body: "Dexory monetizes its warehouse intelligence platform exclusively through a subscription-based Robots-as-a-Service (RaaS) commercial model. Rather than requiring warehouse operators to commit upfront capital expenditures (CapEx) to purchase physical robots, Dexory packages autonomous mobile scanning hardware, ongoing 24/7 telemetry monitoring, scheduled maintenance, and the DexoryView digital-twin analytics layer into a recurring monthly fee. Commercial contract pricing is customized according to warehouse facility characteristics, specifically total square footage, racking height up to 18 meters, and total pallet storage capacity. Customers contract on multi-year terms that ensure predictable recurring revenue while eliminating hardware technology obsolescence risks for customers. In addition to core inventory tracking, Dexory layers higher-margin software capabilities such as the Integrity and Optimise modules, as well as the DexoryView Adapt reasoning engine, creating clear pathways for account expansion and average contract value growth across tier-one logistics and manufacturing accounts."
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI011
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Gross Margin Drivers, and Service-Delivery Costs"
    body: "The economic viability of Dexory's RaaS model depends on long-term hardware durability and rapid customer time-to-value. Dexory engineers its autonomous tower scanning robots to operate maintenance-free for up to eight years, enabling the company to amortize initial bill-of-materials and assembly costs across multiple customer renewal cycles. Deployments are executed rapidly within one to two weeks without requiring floor beacons, magnetic tracks, or facility layout alterations, minimizing upfront deployment engineering expenses. On the customer side, an independent Total Economic Impact analysis conducted by Forrester established a 219% return on investment over three years with a payback period under six months, driven by cycle count labor reductions of over 70% and a 75% reduction in error incidents. However, because Dexory assumes continuous hardware support obligations, including a 24-to-72-hour on-site remediation SLA and edge sensor maintenance, its blended gross margins are fundamentally constrained by physical service delivery compared to pure-play software vendors."
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI003
  - id: "capital-adequacy-and-funding"
    title: "Capital Adequacy, Financing Structure, and Cash Runway"
    body: "Dexory has secured substantial capitalization to underwrite its global commercialization and asset-heavy fleet expansion. In October 2025, the company completed a $165 million financing transaction anchored by a $100 million Series C equity round led by Eurazeo Growth, alongside participation from LTS Growth, Endeavor Catalyst, DTCP, Atomico, and Lakestar. Crucially, the transaction included an extended growth debt facility from Bootstrap Europe, signaling that Dexory leverages venture debt to finance robot fleet manufacturing and working capital without excessive equity dilution. These proceeds have supported rapid geographic expansion, including the establishment of a 50,000 square foot North American operational headquarters in Nashville, Tennessee, and team growth beyond 150 employees. While the capital infusion provides multi-year operating runway, the incorporation of structured growth debt introduces ongoing debt service commitments and covenant obligations that require disciplined fleet utilization and consistent cash collection across enterprise customer accounts."
    claimRefs:
      - CI010
      - CI012
      - CI013
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Verdict, Revenue Quality, and Underwriting Diligence Gaps"
    body: "From an institutional diligence perspective, Dexory exhibits high commercial velocity and validated customer ROI across marquee global accounts including Maersk, GXO, and DHL. The subscription RaaS model generates recurring revenue streams that benefit from deep operational integration into client WMS workflows. However, as a private venture-backed growth entity, Dexory does not publicly disclose core financial metrics including annual recurring revenue (ARR), revenue run-rate, net revenue retention (NRR), customer churn, or gross margin split between software and hardware delivery. Institutional underwriters cannot determine whether Dexory's financial performance warrants a premium enterprise software valuation multiple or reflects the lower operating leverage of a specialized robotics service provider. Access to confidential management accounts, customer cohort retention schedules, and unit-level hardware depreciation figures remains an essential diligence requirement before underwriting capital commitments."
    claimRefs:
      - CI013
      - CI014
