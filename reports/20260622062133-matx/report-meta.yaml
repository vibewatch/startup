companyProfile:
  summary: MatX is a fabless AI chip startup headquartered in Mountain View, California, founded in 2023 by former Google TPU engineers Reiner Pope (CEO) and Mike Gunter (CTO). The company is designing the MatX One, an AI accelerator chip purpose-built for large language model (LLM) training, reinforcement learning from human feedback, and inference prefill/decode workloads. MatX claims its architecture will deliver more than 10x better performance than Nvidia GPUs for these workloads by combining a splittable systolic array, SRAM-first memory hierarchy supplemented by HBM, and a large-scale interconnect for simultaneous scale-up and scale-out. In February 2026, MatX closed a $500M Series B led by Jane Street and Situational Awareness LP, bringing total disclosed capital to approximately $625M. With approximately 100 employees and a tapeout underway (targeted <1 year from February 2026), MatX is a pre-revenue company targeting first chip shipments in 2027.
  foundedDate: '2023-01-01'
  founders:
    - name: Reiner Pope
      role: CEO and Co-founder
      background: Led PaLM model efficiency at Google; co-architect of TPU v5e; served as Compiler Lead for Google's LLM training infrastructure.
      claimRefs: [CO001, CO003]
    - name: Mike Gunter
      role: CTO and Co-founder
      background: 28 years in hardware architecture and 12 years in ML hardware at Google; Chief Architect of Google's largest ML chip; designed 11 chips to high-volume manufacturing.
      claimRefs: [CO001, CO004]
  foundingLocation: Mountain View, California, USA
  headquarters: Mountain View, California
  productSummary: "The MatX One AI accelerator chip (pre-production) features a splittable systolic array enabling simultaneous scale-up and scale-out parallelism; SRAM-first memory hierarchy supplemented by HBM for high bandwidth without compute sacrifice; and a rack-level interconnect for cluster-scale training. The company targets LLM training, RL fine-tuning, and inference prefill/decode — and explicitly excludes small-model, convolution, and recommender workloads. The company also builds racks for full-system deployment."
  customerFocus: Frontier AI labs (OpenAI-tier), well-funded AI startups, and sovereign AI programs requiring independence from Nvidia and hyperscaler-captive chips.
  businessModel: Hardware sales (chips and racks); no cloud service layer or subscription pricing disclosed. Pre-revenue as of June 2026.
  stage: Series B
  fundingStatus: "$500M Series B closed February 24, 2026, led by Jane Street and Situational Awareness LP; prior rounds: ~$25M seed (2023-2024) and ~$80M Series A (November 2024, Spark Capital lead, ~$300M valuation). Total ~$625M raised."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007, CO010, CO016, CO019]
