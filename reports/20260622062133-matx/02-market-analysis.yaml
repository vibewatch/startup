        - label: "Bring-up and Validation"
          detail: "Customer receives first silicon; runs own models; validates performance vs. claims"
          value: 20
        - label: "Scale Test"
          detail: "Customer tests at cluster scale (thousands of chips); validates reliability, interconnect, and power"
