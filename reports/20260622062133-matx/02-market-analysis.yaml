    claimRefs: [CM019, CM020, CM027]

callouts:
  - calloutType: insight
    title: "SAM is Narrower Than the Headline $100B AI Chip Market"
    body: "The AI chip market as a whole is enormous, but MatX's actual SAM is the sub-segment for large-model LLM training and inference—estimated at $9-15B in 2026. This is still substantial and growing, but investors should not confuse the broad AI chip TAM with the narrower segment MatX targets. MatX has explicitly excluded small models, recommenders, and convolutions."
    claimRefs: [CM001, CM002, CM006, CM007]

  - calloutType: strength
    title: "Hyperscaler Diversification Creates a Real Market Opening"
    body: "Hyperscalers collectively committed over $600B in capex in 2026, with 60-75% AI-focused. Their multi-source strategy—building own chips AND buying from Nvidia AND evaluating startups—means a real market exists for a credible alternative. MatX's 10x performance claim, if validated, directly addresses the ROI-per-dollar metric that drives hyperscaler procurement decisions."
    claimRefs: [CM014, CM022, CM023]

  - calloutType: risk
    title: "Software Ecosystem Constraint Limits Accessible Market"
    body: "CUDA's dominance is the single most important constraint on MatX's addressable market. MatX's model of giving users 'direct control over hardware' is a technical differentiator but also a significant commercial constraint—only customers with deep compiler and kernel engineering capabilities can deploy MatX. This limits adoption to the most sophisticated 5-10% of the potential market."
    claimRefs: [CM026, CM027]

