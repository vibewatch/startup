  - id: FM004
    title: Adoption Funnel for New AI Chip Vendor
    type: funnel
    layout: standard
    summary: "Steps a frontier AI lab must complete before committing to volume MatX One deployment."
    data:
      items:
        - label: "Awareness & Benchmark Access"
          detail: "Customer learns of MatX One; receives pre-production benchmark data"
          value: 100
        - label: "Pre-Silicon Evaluation"
          detail: "Customer reviews architectural specs, compiler/toolchain, and roadmap; signs NDA"
