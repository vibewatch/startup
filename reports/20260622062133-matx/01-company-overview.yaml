callouts:
  - calloutType: strength
    title: "Google TPU Pedigree Provides Credibility"
    body: "Both founders built and shipped Google's highest-performing ML chips. This is not a team with theoretical chip experience—they have taped out and deployed chips at hyperscale. The investor syndicate including Jane Street and Situational Awareness LP reflects a bet on this rare combination of LLM software and hardware depth."
    claimRefs: [CO003, CO004, CO005, CO013, CO014, CO015]

  - calloutType: risk
    title: "Pre-Revenue with 2027 Chip Delivery Dependency"
    body: "MatX has not shipped chips and has no disclosed revenue as of June 2026. The entire value proposition depends on a tapeout completing within approximately 12 months and initial production shipments from TSMC beginning in 2027. Any slip in TSMC allocation, process node yields, or design validation would materially delay revenue and force the company to raise additional capital."
    claimRefs: [CO025, CO026, CO034]

  - calloutType: risk
    title: "Valuation Gap Limits Diligence Precision"
    body: "The company did not disclose its post-Series B valuation, creating uncertainty for any investment or partnership decision. The closest comparable data point is Etched's $5B valuation on a similar round, but MatX's stage, disclosed technology, and customer pipeline differ meaningfully."
    claimRefs: [CO009, CO032]

  - calloutType: insight
    title: "Strategic Investors Signal Supply-Chain Access"
    body: "The inclusion of Alchip and Marvell as Series B investors is unusual and strategically important. Both are key players in the ASIC design and packaging supply chain. Their investment suggests MatX may have preferential access to manufacturing capacity and packaging expertise that pure software/VC investors cannot provide."
    claimRefs: [CO027, CO031]

