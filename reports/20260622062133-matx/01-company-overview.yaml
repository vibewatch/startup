company:
  name: MatX
chapter:
  number: 1
  title: Company Overview
  summary: MatX is a Mountain View-based AI chip startup founded in 2023 by Google TPU veterans Reiner Pope and Mike Gunter that is designing the MatX One, a chip purpose-built for large language model training and inference. The company raised $500M in a February 2026 Series B led by Jane Street and Situational Awareness LP, bringing total disclosed capital to approximately $600-625M, with no revenue yet and first chip shipments targeted for 2027.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      MatX is a fabless AI chip startup headquartered in Mountain View, California, incorporated in 2023 by former Google Tensor Processing Unit (TPU) engineers Reiner Pope and Mike Gunter. The company's mission is to design what it describes as "the best chips physically possible for the large model needs of frontier labs." Its sole disclosed product is the MatX One AI accelerator chip, targeting large language model (LLM) training, reinforcement learning from human feedback (RLHF), inference prefill, and inference decode workloads. MatX generates revenue through hardware sales of chips and racks; no cloud service layer or subscription pricing has been disclosed publicly. The company explicitly excludes small-model, recommender-system, and convolution workloads from its target market, placing it in a narrower but more defensible niche than general-purpose GPU vendors. The corporate structure is a Delaware C-Corporation at Series B stage, backed by institutional and strategic investors. As of early 2026, MatX remains pre-revenue with first chip delivery to customers targeted for 2027.
    claimRefs: [CO001, CO002, CO016, CO018, CO019, CO020, CO021, CO025, CO026, CO034, CO035, CO036]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founders-and-leadership
    title: Founders and Leadership Team
    body: >
      Reiner Pope co-founded MatX and serves as CEO. At Google, Pope served as Efficiency Lead for PaLM, where he designed what the company describes as the world's fastest LLM inference software, and also helped conceive the TPU v5e chip as Architect and Compiler Lead for Google's ML chips. He brings over a decade of experience in high-performance software and hardware development. His co-founder Mike Gunter serves as CTO and brings 28 years of hardware architecture experience, including 12 years focused on machine learning silicon. At Google, Gunter was Chief Architect for one of Google's ML chips, leading the design of Google's then-fastest ML chip, and has personally designed and implemented 11 chips across processors, wireless, graphics, and ML. The founding duo is complemented by Avinash Mani as Chief Development Officer (Silicon), who brings over 25 years building products and leading engineering teams in silicon and software. Mani has taken more than 12 chip products from concept to high-volume deployment and was a founding team member of Innovium, which was acquired for $1.1 billion. The leadership team reflects deep domain expertise in both the software and hardware dimensions of AI chip design. MatX has approximately 100 employees as of the Series B announcement in February 2026, working primarily from the Mountain View office three days per week.
    claimRefs: [CO003, CO004, CO005, CO013, CO014, CO015, CO017, CO030]
    tableRefs: [TO002]
    figureRefs: []

  - id: funding-and-investors
    title: Funding History and Capital Structure
    body: >
      MatX has raised approximately $600-625M across all disclosed rounds. The company began with a seed round of approximately $25M in late 2023 to early 2024, with early investors including Nat Friedman (former GitHub CEO) and Daniel Gross. The Series A of approximately $80-100M closed on November 22, 2024, led by Spark Capital at an approximately $300M post-money valuation; this round was reported by TechCrunch at the time as valuing the startup at "more than $300 million." The $500M Series B announced on February 24, 2026 was led by Jane Street, described as "one of the most tech-savvy Wall Street firms," and Situational Awareness LP (co-led), whose founder Leopold Aschenbrenner is a former OpenAI researcher known for his influential writing on AGI timelines and compute requirements. Additional Series B participants include Spark Capital (returning), Marvell Technology, NFDG (Nat Friedman and Daniel Gross's fund), Patrick and John Collison (Stripe co-founders), Triatomic Capital, Harpoon Ventures, Andrej Karpathy, Dwarkesh Patel, and Alchip. The strategic inclusion of Alchip and Marvell—both deep in the semiconductor supply chain—is notable and suggests MatX may benefit from preferential manufacturing and packaging access. MatX did not disclose a post-Series B valuation. For comparison, competitor Etched raised $500M at a $5B valuation around the same timeframe. No debt financing or secondary transactions have been publicly disclosed.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO022, CO023, CO027, CO028, CO029, CO031, CO032]
    tableRefs: [TO003]
    figureRefs: []

  - id: milestones-and-trajectory
    title: Key Milestones and Company Trajectory
    body: >
      MatX's trajectory from founding through mid-2026 spans three phases: stealth research and team-building (2023), public disclosure and Series A fundraise (2024), and product launch and large-scale capital raise (2025-2026). In the research phase (2023-2024), the company published foundational technical work including seqax, a simple and efficient LLM research codebase (May 2024), and built the engineering team to roughly several dozen employees. The Series A in November 2024 provided public validation of the company's direction and thesis at a $300M valuation. Through 2025, MatX accelerated its research output, publishing SPIRe (speculative decoding for inference throughput, April 2025), blockwise sparse attention work (July 2025), and an article on optimizing for inference in addition to training FLOPs (January 2025). The Series A announcement post in March 2025 provided the first significant public disclosure of the company's strategy. The pivotal milestone was the February 24, 2026 announcement of both the MatX One chip concept and the $500M Series B, which together established MatX as a serious challenger to Nvidia in the LLM training market. The company has publicly committed to a tapeout in under one year from the Series B announcement, implying tapeout by approximately Q1 2027 and shipments in 2027. No chips have shipped as of June 2026 and the company is pre-revenue.
    claimRefs: [CO018, CO024, CO025, CO026, CO033, CO034, CO037, CO038]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: cover-metrics-and-evidence-gaps
    title: Cover Metrics and Evidence Gaps
    body: >
      Public evidence supports several key metrics with reasonable confidence: total capital raised (~$600-625M), headcount (~100 at Series B), founding date (2023), headquarters (Mountain View, CA), and TSMC as the manufacturing partner. The company's stated performance targets—over 2,000 tokens per second on large MoE models and the "highest FLOPS/mm2" claims—are company-claimed and cannot be independently verified without access to silicon benchmarks. The post-Series B valuation is a material evidence gap: MatX has not disclosed it, though a multibillion-dollar valuation is estimated based on the $500M raise and comparable company data points (Etched at $5B). Revenue is zero or undisclosed, with no customer contracts announced. The company's manufacturing plan depends on TSMC capacity allocation, which is currently heavily constrained across the semiconductor industry. MatX's programming model is described as giving "direct control over the hardware," suggesting a narrower addressable customer base among sophisticated frontier AI labs rather than enterprise deployments. Key diligence gaps include: pre-money Series B valuation, TSMC node and capacity allocation, customer LOIs or pilot agreements, chip performance benchmarks, and organizational depth below the three publicly named leaders.
    claimRefs: [CO009, CO022, CO023, CO024, CO025, CO026, CO033, CO034]
    tableRefs: []
    figureRefs: [FO003]

