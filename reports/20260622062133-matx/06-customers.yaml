company:
  name: MatX
chapter:
  number: 6
  title: Customers
  summary: >
    MatX has no publicly disclosed paying customers as of June 2026: the company is pre-revenue and its first chip is not expected to
    ship until 2027. The clearest demand signals come from its strategic investor roster — Jane Street (lead), NFDG (Daniel Gross
    runs compute for Meta and co-founded SSI), Marvell Technology, Situational Awareness LP, and Harpoon Ventures — which proxy the
    frontier AI lab, sovereign AI, and defense segments MatX has explicitly targeted. Early customer concentration risk is likely
    severe, as fewer than 15 frontier labs globally can procure custom AI chips at this scale, and NVIDIA's CUDA ecosystem and
    full-stack platform counter-strategy create high switching costs for any first mover.

sections:
  - id: customer-status-overview
    title: "Customer Status: Pre-Revenue, Pre-Shipment"
    body: >
      As of June 2026, MatX has no disclosed paying customers, no signed contracts or letters of intent in the public record, and has
      not shipped any chips. The company was founded in 2023, completed its $500M Series B in February 2026, and has publicly committed
      to a chip tapeout within one year of that raise — targeting first shipments in 2027. MatX's founding blog post and investor
      materials explicitly identify "frontier labs" — organizations developing and deploying the world's largest language models — as
      its primary customer segment, deliberately excluding small-model, recommender-system, and convolution workloads from scope. The
      company's programming model is described as giving users "direct control over the hardware," which presupposes sophisticated ML
      engineering teams and aligns with frontier lab procurement profiles rather than broad enterprise deployments. This highly focused
      targeting reduces the addressable customer pool to fewer than fifteen organizations globally but increases the strategic value of
      each potential design win. No revenue metrics, customer pipeline size, or win/loss data have been disclosed. The company is best
      characterized as a deep-hardware startup in the pre-customer phase, with its current capital structure (~$600-625M raised)
      providing runway to reach first silicon delivery before needing to demonstrate commercial traction. The absence of any customer
      proof is not unusual at this stage for custom silicon startups — Groq and Cerebras both operated for years without disclosed
      customers — but it is a material diligence gap nonetheless.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU037]
    tableRefs: [TU001]
    figureRefs: []

  - id: strategic-investors-proxy-pipeline
    title: Strategic Investors as Proxy Customer Pipeline
    body: >
      MatX's most tangible customer evidence derives from its strategic investor roster rather than traditional customer proof points.
      Jane Street, the quantitative trading firm that led the $500M Series B, builds proprietary systems handling billions of dollars
      of daily transactions and employs deep specialists in compilers, distributed systems, and low-latency networking — a buyer profile
      highly aligned with the frontier compute class MatX is targeting. While Jane Street is an investor and not a disclosed customer,
      its technical sophistication and willingness to lead at this scale signals genuine conviction about MatX's compute value
      proposition. NFDG, the fund run by Nat Friedman (former GitHub CEO) and Daniel Gross, invested at seed and again in the Series B.
      Gross publicly states on his personal website that he "runs compute for Meta," connecting him simultaneously to Meta's AI compute
      procurement decisions and to Safe Superintelligence Inc. (SSI), which he co-founded. SSI raised $1B in September 2024 at a $5B
      valuation — with NFDG among its investors — and is explicitly oriented toward frontier-scale compute demand. Marvell Technology,
      the semiconductor company that designs custom AI chips for AWS (Trainium) and Microsoft (Maia), invested strategically in MatX's
      Series B: this structural signal suggests Marvell sees MatX as an ecosystem complement rather than a pure competitor, potentially
      enabling design-service integration pathways. Harpoon Ventures, a defense-focused VC whose mandate centers on "American
      technological leadership" and "strategic advantage for future generations," provides a further signal of potential
      government and defense-adjacent customer interest. Alchip Technologies, a Taiwan-based ASIC design house generating over 83% of
      revenue from HPC and AI programs, rounds out the investor-as-proxy-pipeline picture with manufacturing access. Together these
      relationships constitute the clearest available proxy for MatX's go-to-market absent any confirmed purchase agreements.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017]
    tableRefs: [TU002]
    figureRefs: [FU001]

  - id: probable-target-customers
    title: Probable Target Customer Segments
    body: >
      Based on MatX's own public statements and its investor relationships, three primary customer segments emerge. First and most
      explicitly targeted: frontier AI labs pursuing AGI-scale training runs, including OpenAI, Anthropic, Google DeepMind, Meta AI,
      and newer entrants such as SSI. Leopold Aschenbrenner's Situational Awareness essays — authored by the co-lead investor of
      MatX's Series B — argue that these labs will build individual training clusters costing hundreds of billions of dollars by 2028,
      generating extraordinary demand for high-throughput AI silicon beyond what NVIDIA alone can supply. The trillion-dollar cluster
      projection implies a per-lab compute procurement cycle that could sustain a dedicated hardware partner like MatX for years.
      Second: US government and sovereign AI programs. Aschenbrenner's "The Project" essay argues that US government involvement in
      AGI compute infrastructure is inevitable by 2027-2028, which would create a large-scale procurement channel for domestically
      produced AI chips. Harpoon Ventures' defense focus reinforces this thesis and suggests MatX has at least one investor with
      the right network to facilitate introductions. Third: strategic semiconductor partners who might white-label or integrate MatX
      chips into their design-service offerings — a pathway for which Marvell's strategic investment is an enabling signal. Geography:
      all likely early customers are US-based, reflecting MatX's Mountain View headquarters and the domestic orientation of its
      investor base. The sovereign and government segment is longer-dated but potentially larger and stickier than the frontier lab
      segment, where government procurement timelines of 18-36 months are typical for new hardware categories entering critical
      national security infrastructure.
    claimRefs: [CU018, CU019, CU020, CU021, CU022, CU027]
    tableRefs: []
    figureRefs: [FU002]

  - id: customer-proof-and-adoption
    title: Named Customer Proof and Adoption Signals
    body: >
      The available named-customer evidence for MatX consists entirely of proxy signals rather than confirmed purchase agreements.
      SSI (Safe Superintelligence Inc.) is the most structurally connected potential customer: its co-founder Daniel Gross is also a
      co-investor in MatX via NFDG, SSI explicitly requires frontier-scale compute infrastructure for its safety research mission,
      and its $1B fundraise at a $5B valuation — with NFDG co-participating — creates organizational proximity between SSI's compute
      needs and MatX's supply chain. SSI states its business model is "insulated from short-term commercial pressures," implying
      sustained demand without revenue-timing constraints that might delay chip procurement. Meta's AI infrastructure procurement,
      where Daniel Gross publicly states he holds a compute leadership role, represents another warm channel, though no
      Meta-MatX commercial engagement has been disclosed. Marvell's strategic investment creates a potential second-order customer
      path: Marvell designs chips for AWS and Microsoft, and its financial interest in MatX could enable future integration of MatX
      intellectual property into Marvell's design-services offering for those hyperscalers. Harpoon Ventures' investment provides a
      potential signal of defense-adjacent customer introductions, though no specific program or contract has been named. None of
      these represents a traditional customer proof point — no named case study, purchase order, design win, conference talk by a
      named user, or government procurement record has been produced. The named customer proof table below documents these proxy
      signals with explicit coverage limitations, and the associated evidence gaps reflect what diligence would need to close before
      any customer claim can be elevated from proxy to confirmed.
    claimRefs: [CU008, CU010, CU011, CU014, CU015, CU016, CU017, CU037]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: concentration-competition-retention-risks
    title: Concentration, Competition, and Retention Risks
    body: >
      MatX faces a tripartite customer risk: concentration, competition, and retention. On concentration: with fewer than 15
      organizations globally capable of purchasing custom AI chips at the scale MatX targets, the loss of any single early customer
      would represent a potentially fatal setback. Comparable hardware startups that achieved their first 1-2 design wins often
      derived over 80% of Year 1 revenue from those initial accounts. Broadcom's structural reliance on Alphabet for a large share of
      its AI ASIC revenue illustrates how design-partner businesses in the AI chip market are systematically exposed to top-customer
      concentration risk. On competition: NVIDIA commands approximately 85-86% of the AI silicon market as of mid-2026 and is
      executing a full-stack counter-strategy — NVLink Fusion (which allows hyperscalers to connect custom ASICs to NVIDIA's fabric,
      reducing the architectural isolation benefit for MatX), the Groq acquisition (plugging NVIDIA's ultra-low-latency inference gap
      before MatX can win it), and a $5B partnership with Intel targeting x86 CPU integration. Each of these moves narrows the
      competitive window for independent chip vendors. Hyperscaler captive chips (Google TPU, AWS Trainium, Microsoft Maia, Meta MTIA)
      serve internal workloads and do not directly compete for the frontier lab merchant market, but their existence means that
      several frontier labs may already be invested in in-house silicon trajectories. On retention: the absence of shipped silicon
      means there is no empirical retention data; comparables from Groq and Cerebras suggest 70-90% effective retention after a
      successful first deployment, driven by custom software stack lock-in, but CUDA-based switching costs create a high initial
      threshold MatX must clear before any retention dynamic applies. The envisioned land-and-expand mechanism — winning a frontier
      lab's first specialized workload (such as RLHF or inference decode), then expanding to full training clusters — requires
      sustained multi-generation technical credibility, which is itself a multi-year execution risk and the central thesis-break
      condition investors and diligence teams should monitor.
    claimRefs: [CU023, CU024, CU025, CU026, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]

