callouts:
  - calloutType: risk
    title: Zero Confirmed Customers with 2027 Target Shipment
    body: >
      MatX is simultaneously developing breakthrough silicon, raising capital, and building a customer pipeline — all before having
      demonstrated commercial traction. This is the canonical risk of deep-hardware startups: customers want proven silicon before
      committing, but proving silicon requires early customer co-investment. The investor roster provides warm pipeline signals but
      no committed revenue, and the 2027 shipment target remains contingent on TSMC capacity allocation and tapeout success. If
      tapeout slips or first silicon underperforms benchmarks, the customer acquisition timeline shifts by at least one full chip
      generation cycle — typically 18-24 months.
    claimRefs: [CU001, CU002, CU005, CU037]

  - calloutType: insight
    title: Investor Network as Proxy Pipeline — Unusual Density for a Hardware Startup
    body: >
      The density of investor-to-customer proximity in MatX's Series B is unusual among hardware startups. NFDG (Daniel Gross +
      Nat Friedman) connects MatX to both Meta AI compute decisions and SSI's frontier-scale compute needs. Situational Awareness LP
      connects to frontier lab thinking on compute scale requirements. Harpoon Ventures connects to defense computing procurement
      networks. Marvell connects to hyperscaler design-services pipelines. Jane Street connects to sophisticated technical compute
      buyers. If even one of these relationships converts to a paying customer before first silicon ships, MatX's customer
      concentration problem is partially addressed before revenue recognition begins.
    claimRefs: [CU006, CU007, CU008, CU010, CU011, CU012, CU017]

