      - number: '7.3'
        title: IP、专利薄弱与人才风险
        blocks:
          - type: paragraph
            body: >-
              基于 Google Patents 对 2023 至 2026 年 MatX Inc. priority filings 的搜索，MatX
              专利组合相对于融资规模和其声称的技术差异化广度而言偏薄。NVIDIA、AMD 和 Google 合计持有数千项 GPU、accelerator 和 compiler
              相关专利，覆盖微架构、互连协议、软硬件接口、量化和稀疏技术。稀疏且防御不足的专利资产，既会带来自由实施约束，也会让 MatX 在规模扩大时容易遭到 incumbent
              为保护市场地位而提出的侵权主张。IPWatchdog 2026 年 6 月分析强调，AI 军备竞赛正在加剧超大规模云厂商的专利申请活动，缺少稳固 IP 组合的小型芯片初创公司面临更高诉讼敞口。IPWatchdog
              对美国专利制度的第一性原理分析指出，Inter Partes Review 程序、Alice 下的 subject-matter eligibility 挑战以及资金不平等，都会让较小技术公司在构建和防御 AI
              半导体 IP 时承受不成比例的负担。美国地区法院中半导体 IP 纠纷的专利防御成本通常为每案 $5–20M，对收入前初创公司是重大拖累。人才方面，SIA 的「Chipping Away」报告预测，到 2030
              年美国还需要额外 67,000–100,000 名半导体工程师。SIA workforce policy 页面确认，硬件工程师——RTL 设计师、physical design 专家、compiler
              作者——的竞争正在超大规模云厂商、NVIDIA、AMD 和 AI 芯片初创公司之间加剧。MatX 作为收入前实体，与资金充足的 incumbent
              争夺同一稀缺人才池，但薪酬杠杆和工作安全性都明显更弱。技术领导集中在小型创始团队中，形成关键人依赖。
