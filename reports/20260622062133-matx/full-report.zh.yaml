      - number: '8.2'
        title: 可比估值分析与公开市场背景
        blocks:
          - type: paragraph
            body: >-
              MatX 仍处在无收入、无首片硅验证阶段，标准 DCF 或收入倍数估值都不适用。现在能站得住的估值框架只有三类：（a）期权价值与里程碑概率模型，（b）对照同阶段 AI
              芯片公司的融资轮次，（c）用已规模化定制硅公司的公开市场倍数作锚。

              在 AI 芯片创业公司里，最有参考价值的可比路径是 Cerebras Systems。Cerebras 2025 年 9 月以 $8.1B 投后估值完成 $1.1B Series G，2026 年 2 月又以
              $23B 完成 $1B Series H，并在 2026 年 5 月提交 IPO，目标市值约 ~$26.6B。这轮跃升靠的是与 OpenAI 的大型商业合同（$10B+ 多年算力协议）以及已验证的收入。MatX
              两者都没有，因此今天不能拿到 Cerebras 同等倍数；但 Cerebras 路径说明，一个超大规模云厂商锚定客户就可能打开快速重估。Groq 2024 年 8 月以 $2.8B 估值融资 $640M，2025
              年 9 月又以 $6.9B 估值融资 $750M，估值上行 2.5×，与商业化规模（2M+ 开发者账户）同步。Tenstorrent 完成约 $693M Series D，投后估值约 $2.6B，由
              Samsung 与 Jeff Bezos 的投资工具领投。

              反面样本是 SambaNova。SambaNova 累计融资 $1.1B+，2021 年最后估值为 $5B。之后 BlackRock 将其 SambaNova 持仓下调 17%，隐含估值约
              ~$2.4B；公司在新一轮融资未能完成后，于 2025 年 10 月开始探索出售。与 Intel 的收购谈判搁浅后，公司目前寻求从战略投资者处融资 $500M。SambaNova 的经历说明，即使资本充足的 AI
              芯片创业公司，如果在融资高峰后约四年内没有跑出商业动能，也会面临严重估值压缩与流动性风险。

              Marvell Technology 是一家公开上市半导体公司，为超大规模云厂商提供大规模定制硅与 AI 加速器业务，可作为稳态公开市场锚点：规模化定制硅公司在公开市场约按 10–15× EV/Revenue
              交易。分析师数据也显示，AI 基础设施公司在 2025 年 Q1 的 EV/Revenue 中位数约为 23×，LLM 厂商则达到 44×。若 MatX 要用 Marvell 级别倍数支撑 $2.5B
              估值，需要约 $170–250M 收入运行率——这道门槛要到首片硅出货很久之后才可能跨过。下一节的情景框架会拆解关键假设。
