          - type: callout
            title: 软件生态约束限制可触达市场
            body: >-
              CUDA 的主导地位是 MatX 可服务市场最重要的单一约束。MatX 让用户「直接控制硬件」的模式，是技术差异点，也是显著商业约束——只有具备深厚编译器和 kernel 工程能力的客户才能部署
              MatX。这把采用范围限制在潜在市场中最成熟的 5-10%。
