          label: 前沿 AI 实验室需求
          detail: LLM 训练和推理算力需求；目标客户：拥有大规模算力预算的前沿实验室和 hyperscaler
        - id: procurement
          label: 芯片采购
          detail: 直接采购 MatX One 芯片硬件；定价未披露；主要基准是 Nvidia B200，$30–40K/chip
        - id: rack_sys
          label: 机架系统集成
          detail: 芯片 + HBM 存储堆栈 + 互连 + 散热封装；系统 ASP 高于单芯片，但 BOM 也按比例上升
        - id: revenue_recog
          label: 收入确认
          detail: 硬件模式：交付时确认；没有按期确认的 SaaS 组件；首批交付目标 2027 年；收入确认政策未披露
        - id: gross_profit
          label: 毛利（估算）
          detail: COGS 驱动因素：TSMC 晶圆约 $30K/wafer（N2）、HBM3E 堆栈（同比 +20%）、CoWoS 封装；行业毛利率基准 40–70%
      edges:
        - from: demand
          to: procurement
          label: 客户下单
        - from: procurement
          to: rack_sys
          label: 芯片集成进系统
        - from: rack_sys
          to: revenue_recog
          label: 系统交付给客户
        - from: revenue_recog
          to: gross_profit
          label: 扣除 COGS
    approximationNotes: 收入确认政策未披露；毛利率估计基于 fabless 行业基准（40–70%）；MatX One 芯片 ASP 未公开。该流程代表公司公告中描述的目标商业模式。
