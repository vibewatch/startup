  - id: FU004
    title: 留存 / 复购 cohort
    type: cohort
    layout: standard
    summary: 基于可比 AI ASIC 厂商设计导入模式估算的首批客户 cohort 留存模型——预测值，不存在 MatX 实际数据
    data:
      columns:
        - 第 1 个月
        - 第 6 个月
        - 第 12 个月
        - 第 18 个月
      rows:
        - label: 前沿实验室 Cohort A（估计）
          values:
            - 100
            - 95
            - 88
            - 85
        - label: ASIC 同业类比（Groq/Cerebras 模式）
          values:
            - 100
            - 85
            - 75
            - 70
        - label: 国防 / 主权项目（预测）
          values:
            - 100
            - 98
            - 95
            - 93
    approximationNotes: >
      所有数值都是估算预测，依据可比 AI ASIC 厂商的设计导入留存模式（Groq、Cerebras、自研 hyperscaler ASIC 项目）。MatX 目前没有客户且尚未出货，因此不存在实际客户留存数据。国防 / 主权
      cohort 因多年期政府采购锁定机制，模型假设留存更高。2027 年出货里程碑之后，一旦有真实首批 cohort 数据，应放弃这些估计。
    claimRefs:
      - CU028
      - CU029
      - CU030
      - CU031
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 风险热力图按发生可能性（x 轴）和影响严重性（y 轴）映射 MatX 的头部风险，帮助投资人尽调时排序优先级。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 致命影响
          values:
            - null
            - TSMC N2/N3 产能分配被拒
            - 台海供应中断
        - label: 高影响
          values:
            - 意外落入 ITAR 覆盖
            - 触发 CFIUS 强制申报
            - BIS 出口管制升级
        - label: 中等影响
          values:
            - HBM 现货短缺（短期）
            - 编译器栈不成熟（阻断收入）
            - 联合创始人 / 首席架构师离职
        - label: 低影响
          values:
            - 融资轮条款谈判延长
            - 来自 incumbent 的 IP / 专利诉讼
            - AI 需求降速（hyperscaler 转向自研）
        - label: 可忽略影响
          values:
            - 初级人才流失
            - 客户集中度的二元风险
            - Tapeout 良率失败（单个周期）
    approximationNotes: 可能性和严重性位置反映基于行业类比和公开证据的定性判断；未使用定量概率模型。
    claimRefs:
      - CR015
      - CR020
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 有向无环图展示上游风险事件（出口管制、TSMC 产能分配、HBM 短缺）如何向下游商业结果（收入受阻、客户流失）层层传导。
    data:
      nodes:
        - id: export-ctrl
          label: BIS/EAR 出口管制升级
        - id: tsmc-alloc
          label: TSMC N2/N3 产能分配受阻
        - id: taiwan-event
          label: 台海地缘政治事件
        - id: hbm-shortage
          label: HBM 内存供应短缺
        - id: tapeout-delay
          label: Tapeout / 生产延期
        - id: sw-stack-miss
          label: 软件栈成熟度未达标
        - id: revenue-block
          label: 收入受阻
        - id: customer-loss
          label: 客户流失 / 转投竞品
      edges:
        - from: export-ctrl
          to: revenue-block
        - from: tsmc-alloc
          to: tapeout-delay
        - from: taiwan-event
          to: tsmc-alloc
        - from: taiwan-event
          to: hbm-shortage
        - from: hbm-shortage
          to: tapeout-delay
        - from: tapeout-delay
          to: revenue-block
        - from: sw-stack-miss
          to: revenue-block
        - from: revenue-block
          to: customer-loss
        - from: export-ctrl
          to: customer-loss
        - from: tsmc-alloc
          to: revenue-block
        - from: hbm-shortage
          to: revenue-block
        - from: tapeout-delay
          to: customer-loss
    approximationNotes: null
    claimRefs:
      - CR013
      - CR014
      - CR016
      - CR015
      - CR034
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 依赖图梳理 MatX 在供应链、IP 和监管上的关键依赖，突出单一来源和高度集中节点。
    data:
      nodes:
        - id: matx
          label: MatX（AI 芯片设计商）
        - id: tsmc
          label: TSMC（唯一先进制程代工厂）
        - id: sk-hynix
          label: SK Hynix / Samsung / Micron（HBM 供应商）
        - id: asml
