      - number: '4.3'
        title: 资本充足性与资金跑道
        blocks:
          - type: paragraph
            body: >
              MatX 通过三轮融资累计募集约 $625M：2023 年末或 2024 年初约 $25M 种子轮、2024 年 11 月宣布的约 $80–100M Series A，以及 Jane Street 和
              Situational Awareness LP 领投、2026 年 2 月 24 日完成的 $500M Series B。公司未披露债务融资、授信额度或老股交易。Series B
              是迄今占比最高的一轮，也提供了主要资金跑道。

              Series B 时公司约 100 名员工；若假设全口径人力成本为每人每月 $50,000–$100,000（包括薪酬、股权激励、福利、办公室和设备），仅员工层面的 burn 就约为每月 $5M–$10M。再加上
              TSMC 设计服务费、EDA 软件许可、IP 授权、原型晶圆流片和基础设施成本，总月 burn 估计为 $5M–$15M。以估算现金头寸 $500M–$600M（计入 Series A
              完成后的支出）计算，Series B 后资金跑道约为 33–83 个月，即大约 3 到 7 年。

              不过，这一区间没有捕捉 MatX One 流片这一集中资本事件。一次 TSMC 先进节点流片，NRE、光罩组和工程成本合计可能消耗 $50M–$150M。MatX 已公开承诺在 2026 年 2 月 Series
              B 公告后一年内完成流片，意味着 2026 年中到 2027 年 Q1 将出现集中资本支出。为良率表征而进行的初始量产晶圆运行，若按每片 $30,000（N2）计算，需要数百片晶圆，会增加进一步资本敞口。如果
              MatX 的流片和初始制造承诺合计为 $100M–$200M，实际资金跑道将从 2026 年 2 月起缩短至约 20–50 个月——基准情形下仍然足够，但应对排期延误的余地有限。

              Series B 投资财团的战略构成提供了一定风险缓释。Marvell Technology 的参与可能带来供应链关系，通过设计服务支持降低 TSMC NRE 敞口；Alchip 的加入则释放潜在一站式 ASIC
              制造支持信号。不过，公司未披露正式供货协议，上述关系仍属于推测性优势。MatX 下一轮融资触发点最可能是成功流片和首片硅表征——这些事件预计不会早于 2027
              年发生。如果流片滑坡或首片硅表现不达标，公司可能在实现收入前需要桥接资本。
