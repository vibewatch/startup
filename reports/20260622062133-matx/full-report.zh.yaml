  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: MatX One：芯片架构与内存层级
        blocks:
          - type: paragraph
            body: >-
              MatX One 是一颗应用专用集成电路（ASIC），从第一性原理出发，为大语言模型工作负载设计。它最关键的架构创新是可拆分 systolic array：既保留大型 systolic array
              的能效和面积效率——这也是 Google TPU 系列背后的同一架构原则，两位创始人都曾参与其中——又能在形状灵活的小矩阵上维持高利用率。该设计去掉了 GPU 的通用开销，包括 geometry
              shading、video decode、rasterisation、raster order groups；这些功能占用 die 面积和功耗预算，却与 LLM
              无关。内存层级体现出有意设计的两层哲学：模型权重主要放在片上 SRAM，以实现低延迟权重访问，使大型 100 层 mixture-of-experts（MoE）模型每秒输出超过 2,000 个
              token；KV-cache 条目存放在高带宽内存（HBM）中，支持长上下文，同时避免纯 SRAM 设计在序列长度超过数千 token 后遇到的带宽惩罚。该芯片只面向训练、RL、推理 prefill 和
              decode 工作负载，覆盖大型 dense 与 MoE 模型，且未声明模型尺寸上限。scale-up interconnect 被描述为所有已发布产品中最高，可支持横跨数十万颗芯片的集群配置；这正是前沿 AI
              实验室客户运行 >100B 参数训练任务的前提。
