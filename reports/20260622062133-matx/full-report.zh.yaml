      - number: '4.2'
        title: 成本结构与 COGS 基准
        blocks:
          - type: paragraph
            body: >
              MatX 是无晶圆厂半导体公司：它不拥有晶圆制造设备，因此降低了直接 capex 义务，但也把自己完全暴露在代工厂定价、产能分配和排期风险之下。TSMC 是已披露制造伙伴，而 MatX One
              的工艺节点尚未公开确认。考虑到公司强调最大化 LLM 性能、目标是最高 FLOPS/mm2，该设计最可能瞄准 TSMC N2（2nm）或 N3（3nm）节点，这两者的晶圆成本都高且持续上升。

              TSMC N2 晶圆定价已确认约为每片 $30,000，比 N3 溢价 10–20%。即将推出的 A16（1.6nm）节点传闻每片最高 $45,000，约比 N2 高 50%。此外，TrendForce 报道
              TSMC 正考虑在 2026 年下半年把 3nm 价格最高上调 15%，并预计 2027 年再上调 5–10%，背后是 Nvidia、AMD、Broadcom 和 hyperscaler 自研 ASIC 项目对
              AI 芯片的持续需求。这些定价动态直接决定 MatX 在考虑良率或封装前的 COGS 底线。

              高带宽内存是第二大 COGS 驱动。AI 训练加速器每颗芯片需要多个 HBM 堆叠。由于 Nvidia H200 和 ASIC-based 芯片项目需求强劲，HBM3E 2026 年合约供货价格上涨约
              20%；12-layer HBM4 单元预计每颗超过 $600。内存如今预计占 2026 年 hyperscaler AI 数据中心 capex 总额约 30%，高于 2023 年约
              8%——这是一条结构性成本通胀趋势，会传导至任何采购 HBM 供应商的物料清单。Samsung 和 SK Hynix 的长期供货协议越来越多要求预付合同价值的 10–30%，进一步压紧内存采购所需营运资本。

              对一家达到量产成熟期的典型无晶圆厂 AI 芯片公司而言，晶圆和内存合计约占 COGS 的 40–60%，对应规模化毛利率约 40–60%。Broadcom 等一流运营商在 AI 芯片收入上实现约 65%
              毛利率，Marvell 年报也确认 AI/数据中心是其最赚钱、增长最快的收入细分。MatX 作为没有 TSMC 批量承诺的新进入者，初期量产时每片晶圆的标准报价将高于优先客户；先进节点流片的 NRE
              成本通常在第一颗芯片出货前就达到 $50M 到 $150M。
