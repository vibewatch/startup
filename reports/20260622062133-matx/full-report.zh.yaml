      - number: '3.3'
        title: 直接创业竞争对手深潜
        blocks:
          - type: paragraph
            body: >
              Groq（成立于 2016 年）设计 Language Processing Units（LPUs），为推理吞吐和低延迟优化。其 SRAM-only 架构消除了 decode 的 HBM
              带宽瓶颈，但也限制了超大模型的内存容量。Groq 融资 $640M+，估值约 $2.8B。它瞄准不同负载（仅推理，尤其是 streaming decode），不在训练上与 MatX 竞争。不过，对于推理客户，如果
              MatX 的 decode 速度主张未在基准测试中证实，Groq 就是替代方案。


              Cerebras Systems（成立于 2016 年）走相反路线——其 Wafer-Scale Engine 3（WSE-3）把 900,000
              个处理核心集成在单片晶圆上，使超大模型训练和推理无需芯片间通信开销即可线性扩展。Cerebras 于 2026 年上市，IPO 首日上涨 68%，融资约 $1B，估值约 $23B。Cerebras
              瞄准训练极大模型（1T+ 参数）的客户，以及重视全模型片上部署带来的低延迟推理的客户。晶圆级制造复杂度和定价限制了其可触达范围。


              Tenstorrent（成立于 2016 年）由 CPU 设计传奇 Jim Keller 领导。其 Wormhole 和 Blackhole 芯片采用 mesh-based NPU，并通过 PyBuda 和
              RISC-V 处理器提供开源软件。Tenstorrent 至今融资 $693M（包括 2024 年 AFW Partners 领投的 $350M），估值
              $2.6B。开源定位和授权模式使其区别于闭源堆栈供应商；它瞄准需要软件控制权的企业和政府客户。Tenstorrent 更直接竞争 Nvidia 的训练版图，但在推理 decode 上缺少 MatX 的
              SRAM-first 架构优势。


              Etched（成立于 2022 年）构建 transformer-only ASIC——Sohu 芯片——在硬件中原生执行 transformer 运算。Etched 声称推理吞吐比 H100 高
              20×。按架构哲学看，它是与 MatX 最接近的创业押注（强观点、负载专用），并以约 $5B 估值融资。关键差异是：Etched 只做推理（不做训练），而 MatX 同时瞄准训练和推理。潜在风险在于，如果
              Etched 客户不愿分别采购训练和推理芯片，Etched 对 decode 的聚焦可能蚕食 MatX 的推理价值主张。


              SambaNova（成立于 2017 年）构建 DataScale 系统，面向需要本地 AI 基础设施的企业部署。公司融资 $1.1B+，估值 $5B+。SambaNova
              竞争的是企业层（银行、医疗、政府），而非前沿 AI 实验室。D-Matrix（成立于 2019 年）把 in-memory compute 用于推理。Positron AI 完成 $230M Series
              B，瞄准高能效推理。Lightmatter 构建光子互连，更像赋能平台，而不是直接芯片竞争对手。
