        - hyperscaler 资本开支指引电话会；公开 CAPEX 跟踪报告；AI 工作负载经济性的分析师覆盖
        - 两家或以上 hyperscaler 公开表示，自研芯片成本达到 parity 是其减少采购第三方加速器的主要原因
        - 重估 TAM 和近期 pipeline；把 go-to-market 收窄至仅推理场景或小众模型服务；评估与更大芯片公司的合作或 OEM 路径
