  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              MatX 切入 AI 芯片市场，目标是大模型 LLM 训练、RL 微调和推理 prefill/decode。这一细分由 Nvidia GPU 主导，同时 hyperscaler 自研芯片和一批资金充足的 AI
              芯片创业公司正不断加码。竞争场分为五层：（1）现任商用芯片供应商（Nvidia、AMD），（2）hyperscaler 内部 ASIC（Google TPU、Amazon Trainium、Microsoft
              Maia、Meta MTIA），（3）直接竞争的训练/推理 AI
              芯片创业公司（Groq、Cerebras、Tenstorrent、SambaNova、Etched、Positron），（4）相邻计算平台（D-Matrix、Lightmatter），以及（5）现状替代方案（云
              GPU 租赁、学术集群）。


              Nvidia 的主导地位是结构性的，也极深。2026 年 AI 加速器收入份额估计为 70–90%，数据中心季度收入年化口径达 $51.2 billion，CUDA 软件生态构建超过 15 年，Nvidia
              定义了 MatX 必须超越的基准。H100/H200 与 Blackwell B200/B300 Ultra 代表现任者的当代防线。Nvidia 即将推出的 Vera Rubin
              架构（2026–27）明确为同时守住训练吞吐和推理 decode 领先而设计，正好覆盖 MatX 瞄准的负载。


              AMD MI300X/MI325X 是主要商用 GPU 替代方案。ROCm 已显著改善，但生态深度仍落后 CUDA，因此 AMD 更吸引成本敏感型负载和混合 CPU-GPU 任务。Google TPU
              Trillium（v6e）以 100,000+ 芯片部署规模领先总装机量，但只向 GCP 客户开放。Amazon Trainium3（2.52 PFLOP FP8，144 GB HBM3e）正在
              Anthropic 和 OpenAI 训练场景中取得进展。Microsoft Maia 200 声称 FP4 性能达到 Trainium3 的 3×，并面向 Azure 内部负载。这些 hyperscaler
              芯片不对外销售，因此服务的是内部需求，而不是与 MatX 的目标客户——需要购买或自建算力的前沿 AI 实验室——正面竞争。


              在创业公司中，竞争动态因负载专精不同而差异很大。Groq 聚焦推理，采用 SRAM-only LPU 架构，瞄准低延迟 decode。Cerebras 通过 Wafer-Scale Engine 3
              面向超大模型训练和推理。由 Jim Keller 领导的 Tenstorrent 用 RISC-V 和 NPU-based Wormhole 芯片推进开源软件。SambaNova 竞争企业部署。Etched 是与
              MatX 最相似的押注——一款 transformer-only ASIC，估值 $5B——但其芯片设计只做推理。MatX 同时明确瞄准训练和推理，再叠加 SRAM-first
              架构和大规模互连，形成差异化位置；但这个市场拥挤且资本充足。
