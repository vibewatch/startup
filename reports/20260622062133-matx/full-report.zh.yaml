  - id: TV005
    title: 论点破坏与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 流片延迟
        - MGXONE 流片确认晚于 2028 年 Q2
        - 收入时间线延后 12–18 个月；bear case 概率上升；竞争窗口可能关闭
        - 暂停后续投资；要求详细技术复盘；重估资本跑道
      - - 关键人员离职
        - CEO Reiner Pope 或 CTO Mike Gunter 离职
        - 主要可信度信号消失；创始人主导的技术执行风险显著上升；投资财团很可能重新评估
        - 立即 hold；与剩余管理层沟通继任计划和技术风险复盘
      - - 2028 年中仍无 design win
        - 流片后 18 个月，与前沿 AI 实验室或 hyperscaler 签署的 LOI 或试点协议为零
        - 当前时间线下收入爬坡不可行；资本效率坍塌；迫使稀释性 down-round 或战略出售
        - 考虑二级退出或减记；关注是否出现 SambaNova 式出售流程
      - - hyperscaler ASIC 替代
        - Google TPU、Amazon Trainium 或 Microsoft Maia 公开替代面向 frontier-lab 客户的第三方推理硅片
        - MatX 目标市场中最大的分部被切掉；机会收窄到二线客户或 sovereign-AI 客户
        - 降低持仓；重估可寻址市场；评估尾部市场（国防、sovereign AI）是否足够支撑
      - - 基准失败
        - 独立基准显示，代表性 LLM 工作负载上 MGXONE throughput per dollar 不到 Nvidia H100 的 2×
        - 核心产品差异化主张失效；估值重定价向 bear case 靠拢；后续融资条款恶化
        - 寻求独立第三方复测；若确认，考虑退出持仓
    notes: 否决触发项是会单独显著推动场景概率分布向 bear case 倾斜的阈值事件。它们由作者依据第 2–7 章记录的关键风险和依赖识别。并非所有触发项都要求立即退出；部分只要求更密切监控和跟进尽调。
    claimRefs:
      - CV025
      - CV026
      - CV038
      - CV039
      - CV041
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - post-money 估值
        - MatX 未披露 Series B post-money 估值或任何二级市场定价数据
        - 没有确认估值，无法建模入场价格、稀释或回报画像；当前估算范围横跨 $1.0–5.0B
        - 直接向 MatX CFO 索取；核查 Caplight 和 PitchBook 二级市场数据
      - - 股权结构和优先权条款
        - Series B 清算优先权、参与权、反稀释条款和股权结构均未披露
        - 优先股条款直接决定普通股实际回报；多层优先权堆栈即使在成功退出时也可能抹掉创始人和员工收益
        - 向 MatX 法律顾问索取；这是投资前标准尽调项
      - - 流片状态和 TSMC 产能分配
        - 除 2026 年 2 月 Series B 后“不到一年”之外，没有公开确认 TSMC 产能预留、节点选择或流片时间表
        - 制造准入是最二元的技术风险；TSMC 节点稀缺可能导致 12–24 个月延迟
        - 索取 TSMC 供应协议或产能预留文件；借助 Alchip 投资人作为供应链尽调路径
      - - 客户 LOI 或试点协议
        - 前沿 AI 实验室或 hyperscaler 没有公开证据显示已进入有约束力合同或 LOI 阶段商业承诺
        - 硬件公司需要锚定客户，才能支撑 Series C 和 IPO 准备；缺少 LOI 表明商业管线可能尚未搭起来
        - 向 MatX BD / 商业团队索取；联系战略投资方 Marvell 和 Alchip，做客户参考核查
      - - 独立芯片基准测试
        - 所有性能主张（100B MoE 上 >2000 tokens/s、10× 吞吐）都来自公司口径，尚未被独立第三方验证
        - 预流片硬件常见基准夸大；独立验证会把信心从低提高到中，并支撑更高估值
        - 聘请第三方芯片评估机构；把流片后六个月的独立基准测试作为后续投资条件
    notes: 这些尽调问题，是把建议从继续研究上调到跟踪或买入所需的最低证据集。每项都能在标准预承诺尽调流程中完成，也不需要获取竞争性或第三方专有数据。
    claimRefs:
      - CV003
      - CV026
      - CV036
      - CV037
      - CV041
