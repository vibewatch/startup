      - number: '6.3'
        title: 可能的目标客户细分
        blocks:
          - type: paragraph
            body: >
              根据 MatX 自身公开表述和投资方关系，可以看到三类主要客户。第一，也是最明确瞄准的一类：推进 AGI 规模训练任务的前沿 AI 实验室，包括 OpenAI、Anthropic、Google
              DeepMind、Meta AI，以及 SSI 等新进入者。MatX Series B 共同领投方 Leopold Aschenbrenner 的 Situational Awareness 文章认为，到
              2028 年，这些实验室将建设单个成本达数千亿美元的训练集群，从而产生远超 NVIDIA 单独供给能力的高吞吐 AI silicon 需求。万亿美元集群预测意味着，每家实验室的计算采购周期都可能支撑像 MatX
              这样的专用硬件伙伴多年。第二类：美国政府与主权 AI 项目。Aschenbrenner 的「The Project」文章认为，美国政府到 2027-2028 年必然介入 AGI 计算基础设施，这会为国产 AI
              芯片创造大规模采购通道。Harpoon Ventures 的防务焦点强化了这一论点，也说明 MatX 至少有一位具备相应网络、可促成介绍的投资方。第三类：可能把 MatX
              芯片贴牌或整合进自身设计服务产品的战略半导体伙伴——Marvell 的战略投资正是这一路径的促成信号。地理上，所有可能的早期客户都在美国，这反映 MatX 位于 Mountain View
              的总部以及投资方基础的本土导向。主权与政府细分更偏长期，但潜在规模更大、粘性也高于前沿 AI 实验室细分；新硬件品类进入关键国家安全基础设施时，政府采购周期通常为 18-36 个月。
