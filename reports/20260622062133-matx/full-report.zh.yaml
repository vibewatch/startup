      - number: '7.5'
        title: 缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              MatX 最强的风险缓释来自创始团队直接参与 Google TPU 的经验，这提供可信度、技术深度和对芯片开发流程的制度知识。其 $500M Series B war chest 若管理严格，可支撑 5
              年以上持续 R&D。不过，供应链缓释仍然有限：公开信息尚未确认替代 foundry 关系、dual-source HBM 协议或 TSMC 产能预留协议。公司可以通过 Federal Register
              notices 监控 BIS 监管动态，通过 earnings call disclosures 跟踪 TSMC 产能分配信号，通过每月 USPTO 与 EPO filings 观察专利格局变化，并利用公开
              capex 报告预判 AI 需求趋势。建议缓释行动包括：立即开展 BIS ECCN 分类审查并聘请出口管制律师；每次新融资前做 CFIUS 投资方筛查；首次商业 tape-out 前开展自由实施专利分析；围绕
              MatX 关键架构差异点（dataflow microarchitecture、quantization、compiler
              techniques）推进有针对性的防御性专利申请计划。终止标准应正式监控，并按季度向董事会报告。五个主要终止触发点——出口管制阻断超过 20% TAM，TSMC 分配拒绝超过 12
              个月，两个或更多联合创始人离职，第一代芯片 benchmark 偏离承诺超过 30%，或两家超大规模云厂商以自研芯片成本 parity 为理由退出第三方 accelerator 采购——都代表
              thesis-break 事件，需要启动战略复盘或退出。
