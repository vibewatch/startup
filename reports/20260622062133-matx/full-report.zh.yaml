      - number: '6.5'
        title: 集中度、竞争与留存风险
        blocks:
          - type: paragraph
            body: >
              MatX 面临三重客户风险：集中度、竞争和留存。集中度方面：全球能按 MatX 目标规模采购 custom AI chips 的组织少于 15 家，失去任何一个早期客户都可能造成致命挫折。可比硬件初创公司拿下最初
              1–2 个 design win 后，第一年收入往往有超过 80% 来自这些初始账户。Broadcom AI ASIC 收入很大一部分结构性依赖 Alphabet，说明 AI 芯片市场里的
              design-partner 生意系统性暴露于头部客户集中风险。竞争方面：截至 2026 年中，NVIDIA 掌握约 85–86% 的 AI silicon 市场，并在执行全栈反制策略——NVLink
              Fusion（允许超大规模云厂商将 custom ASIC 接入 NVIDIA fabric，削弱 MatX 的架构隔离收益）、收购 Groq（在 MatX 能赢得超低延迟推理场景前补上 NVIDIA
              的缺口），以及与 Intel 达成 $5B 合作以瞄准 x86 CPU 集成。这些动作都压缩了独立芯片供应商的竞争窗口。超大规模云厂商自有芯片（Google TPU、AWS Trainium、Microsoft
              Maia、Meta MTIA）服务内部工作负载，并不直接争夺前沿 AI 实验室 merchant 市场，但它们的存在意味着若干前沿 AI 实验室可能已经投入自研 silicon
              路线。留存方面：由于尚未出货硅，没有经验性留存数据；Groq 和 Cerebras 的可比案例显示，成功首次部署后有效留存可达 70–90%，由 custom software stack 锁定推动，但 CUDA
              形成的切换成本给 MatX 设下很高的初始门槛，只有跨过后才谈得上留存动态。设想中的 land-and-expand 机制——先赢下前沿 AI 实验室的第一个专用工作负载（如 RLHF 或 inference
              decode），再扩展到完整训练集群——需要公司持续数代保持技术可信度；这本身就是多年执行风险，也是投资者和尽调团队应监控的核心 thesis-break 条件。
