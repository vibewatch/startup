      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Reiner Pope 共同创立 MatX 并担任 CEO。在 Google，Pope 曾任 PaLM 效率负责人，设计了公司所称全球最快的 LLM 推理软件；他还作为 Google ML
              芯片的架构师与编译器负责人，参与构思 TPU v5e 芯片。他在高性能软件和硬件开发上积累超过十年经验。联合创始人 Mike Gunter 担任 CTO，拥有 28 年硬件架构经验，其中 12
              年聚焦机器学习芯片。在 Google，Gunter 曾任一款 Google ML 芯片的首席架构师，主导设计当时 Google 速度最快的 ML 芯片，并亲自设计和实现过 11 款处理器、无线、图形和 ML
              芯片。创始双人组之外，Avinash Mani 担任首席开发官（Silicon），拥有 25 年以上构建产品、领导芯片与软件工程团队的经验。Mani 曾把 12 款以上芯片产品从概念带到大规模部署，也是
              Innovium 创始团队成员，后者以 $1.1 billion 被收购。领导团队同时具备 AI 芯片设计的软件与硬件深度经验。MatX 在 2026 年 2 月 Series B 公告时约有 100
              名员工，主要在 Mountain View 办公室每周工作三天。
