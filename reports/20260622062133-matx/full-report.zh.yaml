    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              MatX 是一家总部位于加州 Mountain View 的无晶圆厂 AI 芯片创业公司，2023 年由 Google Tensor Processing Unit（TPU）前工程师 Reiner Pope 和
              Mike Gunter 创立。公司的使命是设计其所称「面向前沿实验室大模型需求、物理上可做到最好的芯片」。唯一披露产品是 MatX One AI
              加速器芯片，瞄准大语言模型（LLM）训练、基于人类反馈的强化学习（RLHF）、推理 prefill 和推理 decode 负载。MatX
              靠销售芯片和机架硬件获得收入；公司尚未公开披露云服务层或订阅定价。公司明确把小模型、推荐系统和卷积负载排除在目标市场外，因此比通用 GPU 厂商处在更窄、但防守性更强的细分市场。公司结构为 Delaware
              C-Corporation，处于 Series B 阶段，背后是机构与战略投资人。截至 2026 年初，MatX 仍未产生收入，目标 2027 年向客户交付首批芯片。
