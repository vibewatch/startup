      - number: '4.4'
        title: 公开财务牵引与披露缺口
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，MatX 的财务披露极其有限，这符合一家尚未出货、收入前 Series B
              私营公司的状态。公司未公开披露收入、ARR、GMV、单位经济、毛利率、客户数或利用率指标。已确认的财务数据点包括：累计融资（约 $625M）、Series B 规模（$500M）、Series B
              完成日期（2026 年 2 月 24 日）、领投方（Jane Street、Situational Awareness LP）、战略投资人（Marvell Technology、Alchip）、员工数（约
              100）和流片时间线（Series B 后一年内）。Series B 后估值尚未披露。

              可比上市公司的财务基准因规模差异，只能提供有限类比。Broadcom FY2026 Q1 AI 芯片收入达到 $8.4 billion，毛利率约 65%，并预计 FY2027 AI 收入超过 $100
              billion。Marvell Technology 向 SEC 提交的年报确认，AI 和数据中心是其最大且增长最快的收入细分，显示一旦客户基础建立，定制 AI 芯片可达到的变现规模。BofA 预计 2026 年
              HBM 市场为 $54.6 billion，同比增长 58%；Goldman Sachs 预计 ASIC-based 芯片带来的 HBM 需求增长 82%。这些数据说明更广义市场的规模，但不能提供 MatX
              专属证据。

              MatX 的财务证据缺口严重且结构性存在。没有直接获得管理层提供的财务预测、定价条款清单、TSMC NRE
              协议和客户管线数据，投资人无法承销芯片定价、毛利率、CAC、营运资本周期、客户集中度或收入确认方法。公开证据无法补齐这道缺口——这完全是私有信息问题。本章财务缺口表列出的尽调要求，构成任何投资决策前必须获得的最低信息集。
