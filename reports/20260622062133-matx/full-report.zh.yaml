      - number: '7.4'
        title: 执行、Tapeout 与财务风险
        blocks:
          - type: paragraph
            body: >-
              芯片设计执行是科技行业里资本最密集、时间最敏感的流程之一；MatX 正以收入前初创公司的身份推进，既没有生产硅，也没有被验证的软件生态。TSMC 先进节点的一次完整 tapeout，mask 和 NRE
              成本估计为每轮 $15–$30M；post-silicon validation、良率提升和软件栈成熟，还会在商业可用前增加 12–18 个月。若 benchmark 性能低于 NVIDIA H100/B200
              基线，收入会延迟，并很可能需要在潜在不利条款下重新融资。MatX 2026 年 2 月 $500M Series B 提供了厚但有限的 runway：按半导体初创公司每年 $50–100M 的烧钱速度，公司必须在
              3–5 年内产生收入或跨过明确商业里程碑，否则会面临再融资压力。MatX 产品路线图瞄准 LLM 推理中 NVIDIA throughput-per-dollar 的 10×——这是雄心很高的主张；若
              post-silicon 未兑现，将损害客户信心和融资能力。软件栈（compiler、runtime、model-serving framework）是关键依赖：没有模型覆盖和与 CUDA-based
              alternatives 的性能 parity，硬件本身无法产生收入。超大规模云厂商自研 AI 芯片项目（Google TPU v5/v6、AWS Trainium 2/3、Microsoft Maia
              2）正在成熟；即便 MatX 推出首批产品，它们也可能压缩第三方 accelerator 市场。Arstechnica 2025 年 10 月分析引用分析师担忧称，AI
              基础设施投资速度超过需求兑现速度，持续的超大规模云厂商 capex 削减会对尚未收入多元化的新兴芯片供应商造成不成比例的冲击。客户集中风险——5–10 家前沿 AI
              实验室或超大规模云厂商买方几乎代表近期全部收入潜力——会造成二元化商业结果，从而放大执行风险。若创始团队关键人物离职，将抽走支撑投资者和客户信念的技术可信度。
