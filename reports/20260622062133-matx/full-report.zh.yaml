      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              首要增长驱动来自 LLM 参数量指数级扩张：前沿模型两年内从数百亿参数扩到数千亿参数，下一代预计进入万亿参数级。这种扩张直接推高对高吞吐训练芯片的需求。第二个驱动是成本效率：用当前 GPU 基础设施训练大型
              LLM 可能耗资数亿到数十亿美元，即便 10-20% 的效率提升，在规模化场景也有巨大经济价值。Hyperscaler 因供应集中风险和成本双重因素而转向分散 Nvidia 依赖，为新进入者打开窗口。CHIPS
              Act（$33.7 billion 拨款）正在加速美国本土半导体制造，也为美国芯片设计公司带来政策顺风。约束侧，MatX 最大采用障碍是软件生态锁定：Nvidia CUDA 生态根深蒂固，AI 研究人员和
              MLOps 团队切换成本很高。MatX 明确选择提供「对硬件的直接控制」，而非 CUDA 兼容抽象层，这把可服务客户缩窄到拥有自有编译器/kernel 工程师的高成熟度客户。TSMC
              先进节点产能紧张构成第二大障碍：新进入者必须与 Apple、Nvidia 和 AMD 争夺 TSMC 3nm 与 2nm 节点产能。第三个约束是客户验证时间线：hyperscaler 通常需要 12-18
              个月芯片验证，才会进入生产部署。MatX 制造爬坡的资本强度，又在技术风险之上叠加财务风险。
