  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              MatX 的收入模式以硬件为中心：公司计划通过向前沿 AI 实验室和 hyperscaler 直接销售 AI 加速器芯片与机架级系统获得收入。公司未公开描述软件订阅层、云服务产品或授权费结构。这使 MatX 与
              Nvidia 计算业务同属直接硬件收入类别，收入在芯片和系统交付时确认，而不是在合同期内按比例确认。

              MatX One 芯片或任何机架配置都未公开披露定价。对于收入前、正与前沿实验室谈判定制供应协议的 AI 芯片创业公司，缺少标价是常态。对比来看，Nvidia B200 GPU 在公开市场每颗约
              $30,000–$40,000；Broadcom 报告其 FY2026 Q1 AI 芯片收入 $8.4 billion，毛利率约 65%。这说明定制 AI 芯片在规模化后可获得高溢价经济性。MatX 把自己定位为
              Nvidia 的「为 LLM 物理上可做到最好芯片」竞争者，暗示目标 ASP 至少处于同一或更高区间，但没有披露定价表就无法验证。

              公司每笔客户销售的总可寻址收入，取决于裸片良率、系统封装（HBM 堆叠、互连、散热）和机架集成成本。在前沿实验室部署规模下——每个客户数百到数千颗芯片——即便保守假设 ASP 为每颗
              $20,000，单客户合同价值也可达到数亿美元。不过，公司尚未公开宣布 LOI、试点协议或客户合同。MatX 的收入确认要等到 2027 年芯片出货才会触发，因此 2026 年承销期内任何收入预测都带有投机性。

              GTM 路径聚焦直销，目标是少数拥有大额算力采购预算的前沿 AI 实验室。定制 AI 芯片销售周期通常从设计接洽到首批交付需要 12–24 个月。MatX 未披露客户关系，因此 CAC
              代理指标不可得。投资人名单包括 Andrej Karpathy（OpenAI/Tesla 前成员）、Nat Friedman 和 Daniel Gross（NFDG，与前沿 AI 实验室有连接）以及
              Collison 兄弟（Stripe），可提供潜在引荐渠道，但不构成已披露客户管线。
