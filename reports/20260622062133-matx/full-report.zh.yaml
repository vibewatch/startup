      - number: '3.2'
        title: 现任者与 Hyperscaler 分析
        blocks:
          - type: paragraph
            body: >
              Nvidia 的竞争护城河由三根互锁支柱支撑：（1）CUDA 生态锁定——15 年工具、库、框架和开发者流程；（2）供应链优先级——NVLink、HBM 供货协议和 TSMC
              先进节点产能分配；（3）持续硬件速度——18 个月内从 H100 到 H200 到 B100/B200 再到 Blackwell Ultra，压缩挑战者在下一代出货前建立同等能力的窗口。B300 Ultra
              系统（288 GB HBM3e，15 PFLOP dense FP4）是当前大规模训练基准。


              AMD MI300X 配备 192 GB HBM3，匹配或超过 H100 内存容量，并受益于开放 ROCm 生态，可在无需重写代码的情况下运行 PyTorch 负载。不过，ROCm 的长尾兼容性和工具链深度仍低于
              CUDA，使 AMD 主要面向愿意接受 10–20% 工具开销的客户。AMD 在训练集群建设用例上并不与 MatX 直接竞争。


              在 hyperscaler ASIC 中，Google Trillium TPU 是最成熟的替代方案。Trillium 相比 TPU v5e 提供 4.7× 峰值计算，每芯片 32 GB HBM，并在 GCP
              上以 100,000+ 规模部署。Amazon Trainium2/3 被 Anthropic 和 OpenAI 同时用于训练和推理。Microsoft Maia 200 采用 TSMC 3nm，拥有 140B+
              晶体管和 216 GB HBM3e，声称 FP4 性能为 Trainium3 的 3×。Meta MTIA 300–500 系列（2026 年 3 月宣布，基于 RISC-V）声称整个产品线计算增益最高 25×。


              关键差异点：这些 hyperscaler 芯片都是内部自用，不对外销售。Google/Amazon/Microsoft/Meta 之外的任何前沿 AI 实验室，要么自研芯片（昂贵），要么购买 Nvidia，要么从
              MatX 这样的创业公司采购。这种封闭格局，为越来越多希望摆脱 hyperscaler 和 Nvidia 依赖的资金充足 AI 实验室与主权 AI 项目创造了真实商业机会。


              云服务商自研 ASIC 出货预计 2026 年增长 44.6%，同期 Nvidia GPU 为 16.1%；ASIC 预计将达到 AI 服务器市场的 27.8%。这说明需求正在结构性转向专用芯片。MatX
              作为聚焦 LLM 训练的外部芯片制造商，正处在这场迁移的交汇点。
