  - id: FV001
    title: 推荐逻辑流
    type: flow
    layout: standard
    summary: 从证据输入（团队、资本、市场、产品、竞争风险、估值）到分析关卡，再到“继续研究”建议的链条。
    data:
      nodes:
        - id: team
          label: 团队履历
          detail: Pope + Gunter：TPU 架构师，11 款芯片进入 HVM——早期阶段最强信号
        - id: capital
          label: 资本厚度
          detail: 融资 $600–625M；Jane Street + Marvell + Alchip 财团；2–3 年 runway
        - id: market
          label: 市场顺风
          detail: LLM 推理需求加速；2026 年 Q1 AI 资本投入 $289B；宏观环境强力支撑
        - id: product-risk
          label: 产品 / 执行风险
          detail: 尚未产生收入、尚未流片；目标 Q1 2027 tapeout；TSMC 制程节点未确认；无 benchmark
        - id: valuation-uncertainty
          label: 估值不确定
          detail: 投后估值未披露；基准情形估计 $1.5–2.5B；没有收入可支撑倍数
        - id: competitive-risk
          label: 竞争风险
          detail: Groq $6.9B、Cerebras $26.6B IPO、Tenstorrent $2.6B、hyperscaler 自研 ASIC——赛道拥挤
        - id: recommendation
          label: 建议：继续研究
          detail: 条件：确认 tapeout + ≥1 个 LOI + 独立 benchmark
      edges:
        - from: team
          to: recommendation
          label: 支持
        - from: capital
          to: recommendation
          label: 支持
        - from: market
          to: recommendation
          label: 支持
        - from: product-risk
          to: recommendation
          label: 约束
        - from: valuation-uncertainty
          to: recommendation
          label: 约束
        - from: competitive-risk
          to: recommendation
          label: 约束
    claimRefs:
      - CV035
      - CV034
      - CV042
      - CV026
      - CV039
  - id: FV002
    title: 估值对收入倍数和收入 run rate 的敏感性
    type: bar
    layout: wide
    summary: 在不同 EV/Revenue 倍数和收入 run rate 下推算 MatX 企业价值；展示 MatX 距离用市场倍数覆盖其估计投后估值还有多远。
    data:
      items:
        - label: $50M 收入 × 15×（AI 基础设施中位数）
          value: 750
          detail: 低于基准情形投后估值（$1.5B）；只有在相对 Marvell 水平倍数享有溢价时才可能成立
        - label: $100M 收入 × 15×（AI 基础设施中位数）
          value: 1500
          detail: 匹配熊市情形投后估值下限；Series B 回报有限
        - label: $170M 收入 × 15×（AI 基础设施中位数）
          value: 2550
          detail: Series B 投资人在 $2.5B 投后估值下大致打平的基准情形
        - label: $200M 收入 × 20×（增长溢价）
          value: 4000
          detail: 接近牛市情形估值下限；需要 $200M+ 收入和增长率溢价
        - label: $300M 收入 × 20×（增长溢价）
          value: 6000
          detail: 牛市情形退出区间；需要 3–4 年内跑到 Groq 规模商业部署
    approximationNotes: >-
      收入数字是作者构建的情景，不是 MatX 预测。EV/Revenue 倍数来自 Finrofca Q1 2025 和 Q1 2026 关于 AI 基础设施与 AI 芯片类别的分析师数据。截至 2026 年 6 月，MatX
      尚未产生收入。
    claimRefs:
      - CV021
      - CV022
      - CV027
      - CV028
      - CV043
  - id: FV003
    title: 跨情景估值与回报区间
    type: range
    layout: standard
    summary: MatX Series B 轮投后估值的低（熊市）、中（基准）、高（牛市）估计，以及隐含退出区间；情景假设均明确标注为作者估计。
    data:
      items:
        - label: Series B 后（熊市情形）
          low: 1000
          mid: 1250
          high: 1500
          unit: $M (est.)
          source: 'Author estimate; comparable: SambaNova mark-down trajectory; assumes tapeout delay or no design wins'
        - label: Series B 后（基准情形）
          low: 1500
          mid: 2000
          high: 2500
          unit: $M (est.)
          source: 'Author estimate; comparable: Tenstorrent Series D stage; assumes tapeout 2027, 1 design win by 2028'
        - label: Series B 后（牛市情形）
          low: 3000
          mid: 4000
          high: 5000
          unit: $M (est.)
          source: >-
            Author estimate; comparable: Groq Sep-2025 step-up, Cerebras Series H; assumes 2+ hyperscaler wins and
            $200M+ revenue
        - label: Series C / 战略轮（基准）
          low: 2500
          mid: 3000
          high: 3500
          unit: $M (est.)
          source: Author estimate; assumes ~18-month post-tapeout milestone clearance and moderate commercial traction
        - label: IPO / M&A 退出（牛市）
          low: 5000
          mid: 6500
          high: 8000
          unit: $M (est.)
          source: >-
            Author estimate; comparable: Cerebras IPO range; requires $200M+ revenue and IPO-ready governance by
            2029–2030
    approximationNotes: >-
      所有数字都是作者构建的情景估计，不是已确认估值或公司预测。MatX 没有披露 Series B 后投后估值。估计来自可比 AI 芯片公司私募轮先例（Groq、Cerebras、Tenstorrent、SambaNova）和 AI
      基础设施倍数分析师数据。熊市 / 基准 / 牛市情形对应 TV003 中的三种案例。
    claimRefs:
      - CV006
      - CV028
      - CV029
      - CV030
      - CV027
      - CV031
      - CV033
  - id: FV004
    title: 投资就绪度 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的七维评分：市场、团队证明、产品证明、经济模型、竞争护城河、估值支撑和证据质量。
    data:
      items:
        - label: 市场机会
          value: 5
          detail: LLM 推理芯片市场：规模大、仍在增长，2028 年年规模 >$50B；需求明显跑赢供给
          status: confirmed
        - label: 团队履历
          value: 5
          detail: Google TPU 共同架构师；11 款芯片进入 HVM；创业生态里最深的领域专长
          status: confirmed
        - label: 产品证明
          value: 1
          detail: 没有已出货硅片、没有 benchmark、没有收入；所有性能主张均来自公司，未经验证
          status: gap
        - label: 商业牵引
          value: 1
          detail: 客户 LOI、设计导入或收入均为零披露；仍处商业化前阶段
          status: gap
        - label: 竞争差异化
          value: 3
          detail: 架构新意真实存在（SRAM-first、训练 + 推理）；但尚未与 Nvidia 和资金充足的同业正面验证
          status: planned
        - label: 估值支撑
          value: 2
          detail: 投后估值未披露；估计 $1.5–2.5B 缺少收入锚点，只能依赖期权价值和可比公司分析
          status: gap
        - label: 证据质量
          value: 2
          detail: 资本和团队证据质量高；产品 / 商业证据几乎为零；本章置信度：低
          status: gap
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV034
      - CV037
      - CV038
