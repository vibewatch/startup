      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              MatX 在已披露各轮融资中累计募集约 $600-625M。公司在 2023 年末至 2024 年初完成约 $25M 种子轮，早期投资人包括 Nat Friedman（GitHub 前 CEO）和 Daniel
              Gross。约 $80-100M 的 Series A 于 2024 年 11 月 22 日完成，由 Spark Capital 领投，投后估值约 $300M；TechCrunch
              当时报道称该轮使这家创业公司的估值「超过 $300 million」。2026 年 2 月 24 日宣布的 $500M Series B 由 Jane Street 和 Situational Awareness
              LP（共同领投）领投，Jane Street 被称为「华尔街最懂技术的公司之一」，Situational Awareness LP 创始人 Leopold Aschenbrenner 是 OpenAI
              前研究员，以关于 AGI 时间线和算力需求的有影响力文章闻名。其他 Series B 参与方包括 Spark Capital（跟投）、Marvell Technology、NFDG（Nat Friedman 和
              Daniel Gross 的基金）、Patrick 和 John Collison（Stripe 联合创始人）、Triatomic Capital、Harpoon Ventures、Andrej
              Karpathy、Dwarkesh Patel 和 Alchip。Alchip 与 Marvell 都深处半导体供应链，二者作为战略投资人加入值得注意，意味着 MatX 可能获得更优先的制造和封装资源。MatX
              未披露 Series B 后估值。作为对照，竞争对手 Etched 在相近时间以 $5B 估值融资 $500M。公司未公开披露债务融资或老股交易。
