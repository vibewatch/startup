      - number: '5.4'
        title: 信任、合规与软件生态缺口
        blocks:
          - type: paragraph
            body: >-
              MatX 没有公开说明软件安全态势、固件验证流程、出口管制合规，或客户工作负载隔离。公司宣称的目标客户是训练并服务超过 1000 亿参数模型的前沿 AI 实验室，这类客户有严格安全要求；但 MatX
              尚未宣布针对其芯片或软件取得 SOC 2、ISO 27001 或同等认证。软件栈（seqax）被明确描述为研究代码库，而非生产编译器：公开信息中没有 CUDA 等价驱动栈、MLIR backend、PyTorch
              front-end 集成或模型可移植层。该缺口具有结构性意义，因为前沿 AI 实验室已花多年围绕 NVIDIA CUDA 生态优化训练和服务管线；迁移到新的硬件目标，需要 CUDA 兼容编译路径，或愿意用 JAX
              重写生产代码。出口合规方面，先进 AI 芯片受美国 Bureau of Industry and Security Export Administration Regulations 管辖；MatX
              的芯片能力目标——最大化 LLM 训练和推理的 FLOPS 与内存带宽——与已触发出口管制的芯片规格一致，但公开信息中没有合规声明。MatX 对单一 TSMC 级先进节点 foundry
              的制造依赖——这一点由行业惯例、Alchip 伙伴关系以及没有公开第二 foundry 关系推断而来——把供应风险集中到一个没有披露缓释方案的点上。
