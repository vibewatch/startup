      - number: '8.3'
        title: 情景、估值区间与回报画像
        blocks:
          - type: paragraph
            body: >-
              三个情景框定 MatX 作为 Series B 投资的可能结果。以下所有估值均为作者构建，不是 MatX 公司预测，也未获公开文件确认。

              牛市情景需要同时满足：（i）MGXONE 按计划在 2027 年 Q1 完成 tapeout，（ii）独立基准验证显示相对 Nvidia H100 每美元吞吐提升 ≥5×，（iii）到 2028
              年签下两个或以上超大规模云厂商或前沿实验室设计赢单，带来 $200M+ 年收入，（iv）未被超大规模云厂商自研 ASIC 显著挤出。在这些条件下，Series C 或战略交易投后估值 $3–5B，并在
              2029–2030 年以 $5–8B IPO 或被收购，是有可能的。Cerebras 路径证明，单一大型锚定客户就能打开这一级跃升。概率信号：低（高度竞争赛道里，需要多个正向结果同时发生）。

              基准情景假设 2027 年首次 tapeout 一次成功，签下一个早期访问设计赢单，初始收入有限（$20–60M 运行率），并以 $2–3B 估值完成 Series C。对按估算基准入场价（$1.5–2.5B
              投后）进入的 Series B 投资者来说，隐含回报约为四到五年持有期内 1.2–2×，且后续融资会带来明显稀释。如果牛市情景没有兑现，这只是平庸的硬件风险投资回报。概率信号：中（更多取决于执行，而非市场环境）。

              熊市情景来自 Q1 2028 之后才 tapeout、无法充分区分于 Nvidia 的软件护城河，或客户采用速度显著低于预期。在这一情景下，MatX 将面临平轮或下轮，估值约 $1.0–1.5B，Series B
              投资者在稀释后可能被减记至成本以下。SambaNova 从 $5B 到 $2.4B
              的路径说明，价值流失可以非常快。如果公司无法完成下一轮融资，全部资本损失风险并非零。概率信号：中低（团队与资本基础带来真实期权，但硬件执行风险天然很高）。

              若 Series B 投资者按 $1.5–2.5B 基准入场价进入，概率调整后的回报画像并不轻松。当前入场价格下，只有在 12–18
              个月内出现独立技术验证时，上行不对称才偏向牛市情景；届时在已确认估值上追加仓位，比今天承诺完整 Series B 价格更站得住脚。
