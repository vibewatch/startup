  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、出口管制与法律风险
        blocks:
          - type: paragraph
            body: >-
              MatX 处在先进半导体设计与人工智能的交汇处，而这两个领域都面临不断升级的美国监管和法律约束。Bureau of Industry and Security（BIS）依据 15 C.F.R. Parts
              730–774 执行 Export Administration Regulations（EAR），监管包括 AI accelerator 在内的双用途物项。2023 年 10 月 BIS
              规则（2023-22714）及 2024 年 1 月配套规则，为出口至关注国家——中国、俄罗斯以及不断扩大的 Tier D
              名单——的先进计算芯片引入了新的性能阈值；一旦芯片设计方产品可能超过这些阈值，就会形成持续合规义务。MatX 的目标客户包括前沿 AI 实验室和超大规模云厂商，其中部分在全球运营；若 distributor 或
              reseller 发生第三国转移，MatX 可能暴露于 EAR 责任。CHIPS and Science Act 对联邦资金接受方施加 10 年 guardrail 条款，限制其在地缘政治敏感地区扩产。若
              MatX 未来获得 CHIPS grants 或 loans，其供应链策略将受到有约束力的限制。CFIUS 审查涉及关键技术公司的收购和若干投资，AI 芯片敞口会提高敏感度；未来任何带外国连接的投资方都可能触发
              Part 800/802 规则下的强制 filing 义务，增加融资轮复杂度并造成延迟。由 DDTC 管理的 ITAR，若 MatX 芯片用于防务邻近应用，也可能适用。EFF
              强调，出口管制制度施加的合规负担演进速度快于初创公司法律基础设施适应能力，从而形成潜在诉讼敞口。相对其技术雄心，MatX 披露的法律团队很薄，这会放大合规风险。同业 AI
              芯片初创公司（Groq、Cerebras、Tenstorrent）作为美国 AI accelerator 设计方，大体面临类似 EAR 敞口；但这一合规风险对它们全部都很重大。
