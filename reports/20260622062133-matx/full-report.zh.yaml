      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 有条件的继续研究立场：需要三道里程碑闸门
            body: >-
              截至 2026 年 6 月，对 MatX 的建议立场是继续研究。若要上调为跟踪，需要通过三道里程碑闸门：（1）MGXONE 按 2027 年 Q1 计划完成 TSMC tapeout；（2）至少一个来自前沿 AI
              实验室或超大规模云厂商的已签 LOI 或试点协议；（3）独立基准验证显示相对 Nvidia H100 每美元吞吐提升 ≥3×。这三项都不要求承诺下一轮跟投；它们是未来 12–18
              个月内可以完成的尽调检查点。若三项全部达成，基准情景就具备可投资性；若两项或更多落空，熊市情景概率会显著上升。
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV025
              - CV026
              - CV038
          - type: callout
            title: SambaNova 先例：AI 芯片创业公司一旦失手，估值缩水 50%+ 是基准率
            body: >-
              SambaNova 累计融资 $1.1B+，2021 年估值为 $5B。到 2025 年，BlackRock 已将其 SambaNova 持仓下调 17%（隐含约 ~$2.4B），而公司在未能完成新一轮融资且
              Intel 收购谈判搁浅后，正积极探索出售。这是 MatX 最直接的反面可比：一家资金充足、团队成熟的 AI 芯片公司，却没有按商业时间表交付。这里的教训不是 MatX
              必然走上这条路，而是如果商业里程碑落空，估值较峰值压缩 40–60% 是现实下行。在估算 $1.5–2.5B Series B 入场价下，熊市底部 $1.0–1.5B 意味着稀释前就可能出现 30–50%
              资本减值。投资者必须明确为这种二元风险定价。
            calloutType: risk
            claimRefs:
              - CV016
              - CV017
              - CV019
              - CV020
              - CV040
          - type: callout
            title: Cerebras 路径展示上行：一个超大规模云厂商锚定客户推动数十亿美元重估
            body: >-
              Cerebras 从 $8.1B Series G（2025 年 9 月）到 $23B Series H（2026 年 2 月），再到目标市值约 ~$26.6B 的 IPO（2026 年 5
              月）——这些很大程度上都由与 OpenAI 的一份大型商业合同驱动——说明 AI 芯片公司一旦拿下锚定超大规模云厂商或前沿实验室客户，就有不对称上行。MatX 创始团队里，有人曾打造支撑 Google
              模型训练基础设施的芯片。如果 MatX 哪怕只复制 Cerebras
              商业突破的一部分，估值从基准到牛市的跃升也可以实现。最简化的牛市论点就是：一个客户、已验证硅、数十亿美元重估。尽调必须判断这条客户管线是否存在，还是公司仍完全处在商业化前阶段。
            calloutType: strength
            claimRefs:
