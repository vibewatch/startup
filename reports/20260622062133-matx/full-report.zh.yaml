            title: SAM 窄于标题里的 $100B AI 芯片市场
            body: >-
              整体 AI 芯片市场庞大，但 MatX 实际 SAM 是大模型 LLM 训练和推理子市场——2026 年估计为 $9-15B。这个市场仍然可观且在增长，但投资人不应把宽口径 AI 芯片 TAM 与 MatX
              瞄准的较窄细分混为一谈。MatX 已明确排除小模型、推荐和卷积。
