      - number: '2.5'
        title: 规模估算缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              AI 芯片领域的市场规模估算极度碎片化。公开的 2026 年估算从 $9.72 billion 到超过 $120 billion
              不等，名义上说的是同一市场，实则反映了根本不同的范围定义：有的只纳入训练芯片，有的加入推理，有的加入边缘和嵌入式，还有的把相邻的内存与互连硬件也算进去。没有任何单一分析师发布过严谨的、自下而上的 MatX 专属
              SAM 估算，把 LLM 训练细分作为独立单元，并与推理、边缘和传统 GPU 负载分开。被广泛引用的「hyperscaler 占 60%」说法，无法用一级披露验证，因为 hyperscaler 在公开文件中不把
              AI 芯片采购从更广义基础设施 capex 中拆出。此外，工作负载正在快速从训练主导转向推理主导（基础模型训练一次，却推理数十亿次），因此任何静态「LLM 训练芯片」TAM 估算，都可能在 2-3
              年内被推理芯片需求部分替代。MatX 的可服务市场——一款未经验证、没有 CUDA 兼容、只瞄准大模型的芯片——必然只是任何分析师公开 TAM 的子集；仅凭公开来源，无法可靠估算 2027-2028
              年期间的实际可获得市场。
            claimRefs:
              - CM006
              - CM007
              - CM008
