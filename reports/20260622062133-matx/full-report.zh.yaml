      - number: '8.4'
        title: 入场纪律、论点破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，对 MatX 的建议投资立场是继续研究：团队履历、资本厚度与市场机会都有吸引力，但 tapeout 确认、客户 LOI 与独立基准测试均缺位，在估算 $1.5–2.5B
              投后估值下，不确定性仍过高，尚不适合投入资本。有条件的投资纪律需要在出资前通过三道里程碑闸门：（1）MGXONE 按 2027 年计划完成 TSMC tapeout，并获得独立晶圆厂验证；（2）至少一个来自前沿
              AI 实验室或超大规模云厂商的已签 LOI 或试点协议；（3）独立基准结果证明，在代表性 LLM 工作负载上，相对 Nvidia H100 的每美元推理吞吐提升 ≥3×。

              硬件投资里，入场价格纪律非常关键。若投后估值为 $1.5B，投资者要拿到 3× 回报，需要 $4.5B 退出——可能，但不确定。若投后估值为 $2.5B，3× 回报需要 $7.5B 退出，已进入 Cerebras
              IPO 区间，并要求 MatX 成为全球前两大专注 LLM 推理芯片供应商之一。优先权栈与稀释压力也是重大未知：没有披露 cap table，投资者无法建模普通股股东与带参与权或反稀释权优先股类别的实际实现回报。

              论点破裂触发器包括：tapeout 延迟至 2028 年 Q2 之后；TSMC 节点产能配额让位给优先级更高客户；任一联合创始人离职；到 2028 年中仍未拿下任何设计赢单；或某个超大规模云厂商自研
              ASIC（Google TPU、Amazon Trainium、Microsoft Maia）明确取代前沿实验室细分市场中的第三方硅。任一事件都会显著降低基准情景概率，并把概率推向熊市情景，需要重新评估。

              最终尽调优先清单聚焦：（a）经验证的 tapeout 状态与 TSMC 产能预留文件；（b）Series B 条款（参与权、清算优先权、反稀释条款）与 cap table 清晰度；（c）至少一个前沿 AI
              实验室的有约束力或 LOI 阶段客户承诺；（d）独立硅性能验证，即使只来自早期测试芯片；（e）MGXONE 定价、功耗包络以及相对 Nvidia 替代方案的总拥有成本清晰度。拿到这些信息后，独立 DCF
              锚点才可能取代当前期权价值框架。
