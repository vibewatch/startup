companyProfile:
  summary: >-
    MatX 是一家总部位于加州 Mountain View 的无晶圆厂 AI 芯片创业公司，2023 年由 Google TPU 前工程师 Reiner Pope（CEO）和 Mike Gunter（CTO）创立。公司正在设计
    MatX One，这是一款面向大语言模型（LLM）训练、基于人类反馈的强化学习，以及推理 prefill/decode 工作负载的 AI 加速器芯片。MatX 称，其架构把可拆分脉动阵列、以 SRAM 为先且由 HBM
    补充的内存层级，以及支持同时 scale-up 与 scale-out 的大规模互连结合起来，在上述负载上可比 Nvidia GPU 提供超过 10x 的性能。2026 年 2 月，MatX 完成由 Jane Street 和
    Situational Awareness LP 领投的 $500M Series B，使已披露总融资约达 $625M。公司约有 100 名员工，流片正在推进（目标是自 2026 年 2 月起 <1 年），仍处于收入前阶段，目标
    2027 年交付首批芯片。
