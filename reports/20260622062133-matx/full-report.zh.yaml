      - number: '5.2'
        title: 软件栈与研究节奏
        blocks:
          - type: paragraph
            body: >-
              MatX 持续发布 ML 系统研究，一方面记录其算法理念，另一方面提前展示芯片设计优先级。seqax 代码库（2024 年 5 月发布）是一套开源、500 行的 JAX
              训练循环，把所有数学、内存张量和芯片间通信都显式写在源码里；这与把细节埋进抽象层的生产框架形成鲜明对比。seqax 在约 100 个加速器以内的研究规模上，在 GPU 和 TPU 上实现 30–50% 模型
              FLOPS 利用率（MFU）；GitHub benchmark 显示，在单主机 A100×8 集群上，540M 参数模型达到 35% MFU。leaky quantization 论文（2026 年 1 月）指出
              MXFP4 block-quantized causal attention 中一个隐蔽训练失败模式：一个 block 的量化 scale 由 block 内所有元素决定——包括未来 token——因此单靠标准
              causal masking 无法阻止训练与推理边界之间的信息泄露。论文给出修复方案，使 MXFP4 可用于 attention forward 和梯度计算两个 pass。SMVA（Sparse
              Multi-Value Attention，2025 年 4 月）将 K-head 数量与 V-head 数量解耦，并引入稀疏 value 加载；在典型模型架构中，相比 grouped-query
              attention，attention 内存带宽最多降低 8×。SPIRe（SD speculative-decoding 论文，2025 年 4 月）借助静态稀疏 attention、剪枝初始化和反馈内存，将
              speculative decoding 扩展到大 batch 场景；相较更小 draft model，建模吞吐提升超过 100%。SD_NSA（2025 年 7 月）把 blockwise sparse
              attention 与 speculative decoding 结合，并强制所有 draft token 关注同一上下文子集，在 SD verification 步骤中最高实现 3.5× 更高
              operational intensity。这一研究组合直接承接 Pope 等人 2022 年 Google 关于高效 TPU 推理的论文（arXiv:2211.05102），该论文在 PaLM 540B 上用
              int8 量化实现每 token 29 ms，并在 TPU v4 上达到 76% MFU。OCP Microscaling Formats 规范（MX v1.0，2023 年 9 月）由
              Microsoft、AMD、Arm、Intel、Meta、NVIDIA 和 Qualcomm 共同撰写，定义了 MatX leaky quantization 工作直接针对的 MXFP4 与 MXFP8
              block-quantized 数值格式。rules_derive Rust 库（2025 年 7 月）已开源，并在 MatX 内部用于 20 多个
              trait，显示这支团队会把软件工程严谨性用到系统级编译器和工具链工作上。
