  - id: TV002
    title: 正向论点与反向论点
    columns:
      - 支柱
      - 论点
      - 权重
      - 什么会改变这一判断
    rows:
      - - 正向论点：团队履历
        - Reiner Pope（TPU v5e 共同架构师、PaLM 效率负责人）+ Mike Gunter（11 颗芯片进入 HVM，28 年 ML silicon 经验）是市场上履历最强的一批 AI 芯片创始人。
        - 高
        - 出现关键人员离职证据，或创始三人组以下存在明显组织缺口
      - - 正向论点：资本深度
        - 公司累计融资 $600–625M，来自 Jane Street、Situational Awareness、Marvell、Alchip 等成熟投资人，可支撑 2–3 年 R&D 跑道和供应链准入；近期没有融资悬崖。
        - 高
        - burn rate 明显高于已披露人数或范围扩张，需要以更差条款再融资一大轮
      - - 正向论点：市场时点
        - LLM 推理市场增长快于 GPU 供应承载能力；若 10× throughput-per-dollar 改善得到验证，会立刻吸引 hyperscaler 兴趣。
        - 中
        - Nvidia 的 Rubin 或 Blackwell 后继产品给出同等改善；hyperscaler 自研 ASIC 追平差距
      - - 反向论点：没有商业证明
        - 截至 2026 年 6 月，收入为零、未披露 LOI、没有已出货硅片。$500M 融资押注的是未来执行，而非当前业绩。
        - 高
        - 与前沿 AI 实验室签署 LOI 或试点协议；测试硅片上出现独立基准
      - - 反向论点：竞争者密度
        - >-
          Groq（$6.9B、200 万开发者）、Cerebras（$26.6B IPO 目标、OpenAI 锚定客户）、Tenstorrent（$2.6B、Jim Keller）、Etched（$5B），再加上
          Nvidia、Google TPU、Amazon Trainium、Microsoft Maia，留给 MatX 的空白有限。
        - 高
        - MatX 在训练 + 推理混合工作负载上证明架构优势，而这是当前竞争对手尚未覆盖的场景
