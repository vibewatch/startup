      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              LLM 训练芯片买方集中在三类：hyperscaler、前沿 AI 实验室和大型企业 AI 团队。Hyperscaler（Google Cloud、AWS、Azure、Meta）按 capex
              看是最大买方，并且越来越多在从 Nvidia 采购商用芯片的同时自研芯片。2026 年其总基础设施 capex 承诺从 $60B（Meta）到 $200B（Amazon）不等，其中 60-75% 聚焦
              AI。采购流程通常是 12-24 个月评估周期；新芯片供应商必须证明软件工具链兼容性、规模化可靠性和支持基础设施，才能赢得产能分配。前沿 AI
              实验室（OpenAI、Anthropic、xAI、Cohere、Mistral）硬件胃口最激进，也最愿意评估新芯片，但同时高度依赖现有云/hyperscaler 伙伴关系。OpenAI 在 2025 年前 9
              个月仅推理支出就超过 $8.6 billion，并通过 Azure/Stargate 关系承担承诺。Anthropic 主要部署在 AWS Trainium
              上。由于有动力降低硬件集中度、提升每美元性能，这些实验室可能是 MatX 最早的客户目标。第三类买方——构建基础模型或大规模微调集群的大型企业 AI
              团队——成熟度较低但在增长；其评估周期更长，对未经验证芯片的风险容忍度更低。所有细分里，硬件预算归基础设施/工程领导层而非业务部门所有，因此销售过程更偏技术，需要深度工程参与。
