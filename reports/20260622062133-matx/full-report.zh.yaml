      - number: '7.2'
        title: 供应链、制造与单一来源风险
        blocks:
          - type: paragraph
            body: >-
              MatX 整条生产路径都穿过一条紧绷的单一来源依赖链，风险不对称。TSMC 制造全球 90% 以上 5nm 及以下芯片；MatX 的 LLM 训练和推理 accelerator 所需 N2 或 N3
              节点，没有商业可行替代方案。TSMC 最先进节点主要分配给 Apple（iPhone SoC）、NVIDIA（Blackwell series）、AMD（EPYC/Instinct）和超大规模云厂商 custom
              chips，留给初创级客户的产能窗口有限且不可预测。CSET 分析把台湾在先进半导体生产中的主导地位列为全球供应链首要地缘政治 chokepoint；任何 Taiwan Strait
              中断都会让全行业几乎所有有竞争力的 AI 芯片生产停摆。高吞吐 AI accelerator 必需的 HBM memory，只由 SK Hynix、Samsung 和 Micron 生产，其中 SK Hynix
              占据超过半数市场。Micron 的 HBM3E product brief 确认，HBM 需要专门的 3D stacking 与 through-silicon-via 技术，三家 incumbent
              之外无法获得，因此 1–2 年窗口内替代不现实。ASML 的 EUV lithography equipment——其本身也受荷兰和美国出口管制——是制造 sub-5nm 芯片唯一可用工具；ASML
              集中生产和出口限制进一步收紧 foundry 可用性。CSET 对中国 semiconductor manufacturing equipment 进展的分析指出，中国仍落后 EUV 前沿 5–10 年，这维持了
              TSMC 的战略地位，也维持了台湾脆弱性。N2 先进节点晶圆成本估计为每片 $30,000–$35,000，而 N5 约为 $20,000；在计入良率损失前，就已经压缩初创公司的单位经济性。SIA
              确认，leading-edge logic 或 HBM 生产近期没有可行替代台湾（TSMC）和韩国（SK Hynix）的方案。
