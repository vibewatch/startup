      - number: '1.4'
        title: 关键里程碑与公司轨迹
        blocks:
          - type: paragraph
            body: >
              从创立到 2026 年中，MatX 的轨迹分三段：隐身研发和组建团队（2023 年）、公开亮相并完成 Series A（2024 年）、产品发布和大额融资（2025-2026 年）。在研发阶段（2023-2024
              年），公司发布了包括 seqax 在内的基础技术成果；seqax 是一个简单高效的 LLM 研究代码库（2024 年 5 月），同时公司把工程团队扩到约数十人。2024 年 11 月 Series A 以
              $300M 估值为公司方向和论点提供了公开验证。进入 2025 年，MatX 加快研究产出，发布 SPIRe（用于提升推理吞吐的 speculative decoding，2025 年 4
              月）、blockwise sparse attention 工作（2025 年 7 月），以及一篇关于在训练 FLOPs 之外优化推理的文章（2025 年 1 月）。2025 年 3 月的 Series A
              公告文章首次较完整地公开公司战略。关键节点是 2026 年 2 月 24 日，公司同时宣布 MatX One 芯片概念和 $500M Series B，这两件事把 MatX 推成 LLM 训练市场里 Nvidia
              的严肃挑战者。公司公开承诺在 Series B 公告后不到一年内完成流片，意味着约在 2027 年 Q1 前后流片，并在 2027 年出货。截至 2026 年 6 月，公司尚未出货芯片，也仍未产生收入。
