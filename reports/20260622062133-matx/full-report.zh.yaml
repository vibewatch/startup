  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >
              MatX 所处的是 AI 加速器芯片市场，具体是面向大语言模型（LLM）训练、强化学习，以及大型参数 transformer 模型推理的细分市场。该市场包括
              hyperscaler（Google、AWS/Amazon、Microsoft、Meta、Oracle）、前沿 AI 实验室（OpenAI、Anthropic、xAI、Cohere、Mistral），以及构建自有
              LLM 应用的大型企业支出。市场明确排除小模型推理、边缘 AI 芯片、为卷积优化的硬件（如视觉芯片）和推荐系统加速器。现状替代品包括 NVIDIA H100/H200/B200 GPU
              产品线（主导型现任者）、AMD MI300X/MI350 系列、hyperscaler 自研芯片（Google TPU、Amazon Trainium、Meta MTIA、Microsoft
              Maia），以及在部分负载中使用 FPGA 加速。狭义定义下，AI 训练芯片子市场指专门为数据中心规模训练优化的芯片，一位分析师估算 2026 年规模为 $9.72 billion；更广义的数据中心 AI
              加速器芯片市场（训练和推理合计）根据分析师方法、范围以及是否纳入边缘/嵌入式负载，介于 $15-56 billion。最宽泛的「所有 AI 芯片」定义，包括 CPU 和边缘推理，超过 $100 billion。就
              MatX 尽调而言，相关可服务市场是数据中心 AI 训练和大模型推理，保守估计 2026 年为 $15-22 billion，并在 2030-2032 年向 $51-100 billion 增长。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM 分析
        blocks:
          - type: paragraph
            body: >
              多家分析机构估算过 2026 年全球 AI 加速器芯片市场。IntelMarketResearch 估算 AI 训练芯片市场 2026 年为 $9.72 billion，到 2034 年增至 $31.89
              billion，CAGR 为 16.3%。更广义的 AI 加速器芯片市场，视范围不同，2026 年估算分别为 $15.3 billion（IntelMarketResearch）、$22.8
              billion（360iResearch）和 $51.7 billion（StrategyMRC）。最宽口径的市场定义——所有 AI 芯片，包括用于训练和推理的 GPU、ASIC、FPGA——2026 年估计为
              $56.5 billion（Business Research Company）到超过 $100 billion。Hyperscaler 在 2026 年合计承诺投入超过 $600-725 billion
              基础设施，其中约 60-75% 面向 AI 计算；若加速器芯片规模为 $15 billion，AI 芯片约占 AI capex 总额的
              2-3%，说明硬件供应商必须在一个巨大但高度集中的预算池中激烈争夺份额。MatX 的可服务可获得市场（SAM）估计 2026 年约为 $9-15 billion，对应数据中心规模的大模型 LLM 训练和
              prefill/decode 推理细分。MatX 在 2027-2028 年（首个出货年份）的 SOM（serviceable obtainable market）高度取决于有多少前沿实验室和
              hyperscaler 愿意评估首次造芯供应商的新芯片；考虑切换成本和生态成熟度风险，保守建模为 SAM 的 1-5%。多家分析机构估计，AI 芯片市场到 2030 年 CAGR 为
              23-31%。随着模型复杂度扩张，训练专用细分预计会比推理增长更快。
