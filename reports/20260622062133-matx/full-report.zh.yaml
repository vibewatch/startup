    title: 单位经济模型桥（估算）
    type: flow
    layout: standard
    summary: MatX One 芯片估算单位经济模型由关键成本驱动因素和收入输入拼成；缺少一手数据处采用分析估计。
    data:
      nodes:
        - id: asp
          label: 芯片 ASP（未披露）
          detail: 目标定价与 Nvidia B200（$30–40K/chip）相当或更高；实际 ASP 未披露；决定单颗收入
        - id: wafer_cost
          label: TSMC 晶圆成本
          detail: N2 节点：约 $30,000/wafer；N3 节点：2026 年下半年涨价后约 $20–23,000/wafer；MatX 节点未确认；主导 COGS
        - id: hbm_cost
          label: HBM 存储成本
          detail: HBM3E：2026 年价格约上涨 20%；HBM4 >$600/unit；每颗芯片需要多组堆栈；SK Hynix 以 62% 市占率主导供应
        - id: packaging
          label: 封装与互连
          detail: 先进 2.5D / 3D 封装（通过 TSMC 的 CoWoS / SoIC）；额外 COGS 项；封装产能在 TSMC 也受限
        - id: gm_target
          label: 目标毛利率
          detail: 行业基准：规模化 fabless 40–70%；Broadcom 约 65%；MatX 第一年因新进入者晶圆定价，可能低于基准
      edges:
        - from: asp
          to: gm_target
          label: 净收入
        - from: wafer_cost
          to: gm_target
          label: COGS：晶圆
        - from: hbm_cost
          to: gm_target
          label: COGS：存储
        - from: packaging
          to: gm_target
          label: COGS：封装
    approximationNotes: 所有成本输入都是市场层面估计；MatX One 裸片面积、良率、HBM 堆栈数量和实际晶圆定价均未公开披露。毛利率目标是基于 Broadcom 和 Marvell 公开数据推导出的分析基准。
    claimRefs:
