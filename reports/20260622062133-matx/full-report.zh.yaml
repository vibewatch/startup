            body: >
              公开证据较有把握地支持几个关键指标：累计融资（约 $600-625M）、员工数（Series B 时约 100 人）、成立时间（2023 年）、总部（加州 Mountain View）和制造伙伴
              TSMC。公司提出的性能目标——在大型 MoE 模型上超过 2,000 tokens per second，以及「最高 FLOPS/mm2」——均为公司口径；没有芯片基准测试，就无法独立验证。Series B
              后估值是重大证据缺口：MatX 未披露该数字，尽管可基于 $500M 融资额和可比公司数据点（Etched 估值 $5B）估计为数十亿美元。收入为零或未披露，未宣布客户合同。公司的制造计划依赖 TSMC
              产能分配，而当前整个半导体行业的产能高度紧张。MatX 的编程模型被描述为提供「对硬件的直接控制」，说明其可服务客户更可能是技术成熟的前沿 AI 实验室，而非企业部署。关键尽调缺口包括：Series B
