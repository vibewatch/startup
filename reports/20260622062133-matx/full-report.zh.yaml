  - id: TV003
    title: Bull / Base / Bear 场景摘要
    columns:
      - 场景
      - 核心假设
      - 隐含估值（估算）
      - 概率信号
      - 下行触发项
    rows:
      - - Bull
        - 2027 年 Q1 按期流片；拿到 ≥2 个 hyperscaler / frontier-lab design win；到 2028 年收入 $200M+；没有 hyperscaler ASIC 替代
        - Series C 估值 $3–5B；2029–2030 年 IPO/M&A 估值 $5–8B
        - 低至中（需要多个胜利同时发生）
        - 基准失败、流片滑坡，或 Nvidia 反制
      - - Base
        - 2027 年成功流片；1 个 early-access design win；收入 run rate $20–60M；Series C 以 $2–3B 估值融资
        - Series B 后估值 $1.5–2.5B（估算）；Series B 投资人 4–5 年获得 1.2–2× 回报
        - 中（取决于执行）
        - 失去 TSMC 产能；未能拿到第二个 design win
      - - Bear
        - 流片延迟到 2028 年 Q1 之后；没有签署 design win；收入爬坡前资本吃紧；被迫 down-round 或战略出售
        - $1.0–1.5B 平轮 / 下轮；Series B 经稀释后可能低于成本回报
        - 中低（团队质量提供底部支撑）
        - 关键人员离职；hyperscaler ASIC 追平性能差距；SambaNova 式融资冻结
    notes: 本表所有估值数字均为作者基于可比私募轮次先例构建的估算。它们不代表 MatX 的预测或已确认交易价值。场景概率为定性信号，不是定量概率估计。
    enumerationScope:
      coverage: sample
      basis: >-
        Three canonical scenario cases derived from comparable AI chip startup trajectories (Cerebras, Groq, SambaNova,
        Tenstorrent) and author milestone-probability framework, covering the range of plausible outcomes as of June
        2026
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV027
      - CV031
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 最近已知估值
      - 关键轮次 / 事件
      - 收入阶段
      - 与 MatX 的相关性
      - 局限
    rows:
      - - Cerebras Systems
        - ~$23–26.6B（2026 年 2–5 月）
        - Series H 融资 $1B，估值 $23B（2026 年 2 月）；2026 年 5 月 IPO 文件目标市值 ~$26.6B
        - 收入（锚定客户：OpenAI $10B+ 合同）
        - AI 芯片创业公司 IPO 中最高确定性的基准；晶圆级 vs. 标准芯片；两者都瞄准 LLM 推理
        - 已有规模收入（$10B 客户）；MatX 收入为零——估值差距很大
      - - Groq
        - ~$6.9B（2025 年 9 月）
        - 2025 年 9 月以 $6.9B 融资 $750M；2024 年 8 月以 $2.8B 融资 $640M
        - 收入（200 万+ 开发者；LPU 推理云）
        - LPU 推理专门玩家；创始人履历可比（前 Google TPU）；同样主打推理速度优势
        - 有在线产品、收入和开发者基础；MatX 仍处于硅片前
      - - Tenstorrent
        - ~$2.6B post-money（2024 年 12 月）
        - $693M Series D；Crunchbase 显示 pre-money $2B
        - 收入（芯片销售、授权、云）
        - 开源软件角度；Series D 规模可比 MatX 的 Series B 融资额；两者都瞄准训练 + 推理
        - Jim Keller 品牌溢价；已有芯片出货；MatX 尚未流片
      - - SambaNova Systems
        - ~$2.4B（BlackRock 估值标记，2025 年）
        - 2021 年峰值 $5B；2025 年 BlackRock 下调至 ~$2.4B；2025 年 10 月启动出售流程
        - 收入（承压；从训练转向推理云）
        - 反面可比：AI 芯片商业化停滞时，估值会被压缩；融资规模与 MatX 相近
        - 出售流程进行中；峰谷压缩显示二元风险；不是正面类比
      - - Etched AI
        - ~$5B（2024–2025 年估算）
        - 以约 $5B 估值融资；面向 transformer 的专用 ASIC（Sohu 芯片）
        - 收入前（仅推理，不做训练）
        - 最接近的架构类比（transformer-only ASIC）；融资阶段相近；投资人为 AI 芯片期权定价
        - 仅推理（不做训练）；为无已出货产品的架构押注提供市场交叉验证
      - - Marvell Technology (MRVL)
        - ~$50–70B 市值（上市公司，2026 年）
        - 上市公司；为 Google、Amazon、Microsoft hyperscaler 定制 AI 加速器硅片
        - 规模收入（定制硅片、网络 IC）
        - 定制硅片稳态倍数的公开市场锚（约 10–15× EV/Rev）；hyperscaler ASIC 设计服务模式
        - 上市公司；稳态倍数不适用于早期创业公司；风险画像不同
    notes: >-
      估值来自截至 2026 年 6 月的 SEC 文件、TechCrunch、Crunchbase 和 DataCenter Dynamics 报道。SambaNova 估值反映 BlackRock
      下调标记，不是峰值。Marvell 是上市公司，仅作为公开市场倍数锚。所有私营公司估值均为最近披露轮次标记；二级市场价值可能不同。MatX 估值为作者估算，未获确认。
    enumerationScope:
