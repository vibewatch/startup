      - number: '3.4'
        title: 差异化、护城河与竞争风险
        blocks:
          - type: paragraph
            body: >
              MatX 声称的差异化集中在四根支柱：（1）可拆分脉动阵列架构，无需重新编程即可同时 scale-up 与 scale-out；（2）SRAM-first 内存层级，并由 HBM
              补充，在不牺牲计算利用率的情况下提供高内存带宽；（3）明确把 LLM 训练与推理 prefill/decode 循环作为统一负载优化，而非只做训练或只做推理；（4）创始团队拥有直接 TPU
              设计经验和量产芯片履历。


              这些差异点的耐久性面临多重威胁。Nvidia 没有停下——B300 Ultra 和 Vera Rubin 路线图直接用 288 GB HBM3e 应对内存带宽缺口。Groq、Cerebras 和 Etched
              都证明，硬件专用化可以在目标负载上比 GPU 获得 10–20× 效率提升。关键风险是，MatX 关于在 100 层 MoE 模型上实现 >2,000 tokens/second
              的主张，目前无法独立验证，因为量产芯片尚不存在。流片预计在 2027 年中前后完成；在此之前，MatX 的竞争位置靠的是投资人和伙伴对创始人履历及架构论文的信任，而不是已交付芯片。


              软件是第二个护城河风险。CUDA 生态深度意味着，即便 MatX 实现 10× 吞吐主张，客户从 Nvidia 硬件切换也要承担不小的移植成本和工作流扰动。MatX 要么需要强健的兼容层（支持
              PyTorch/JAX 工作流），要么需要愿意共同投入软件的客户——通常是运行定制训练栈的前沿 AI 实验室。Google 前 TPU 工程师从编译器侧从零构建 MatX 软件栈（Reiner Pope
              曾任编译器负责人），这提供了一定可信度；但生产级软件比架构层面的验证复杂几个数量级。


              供应链方面，MatX 依赖 TSMC，与大多数竞争对手一致，并不形成差异。风险在于共同稀缺：TSMC 先进节点产能（3nm/2nm）被 Nvidia、Apple、AMD 和 hyperscaler
              激烈争夺。流片延误会压缩 MatX 的先发窗口，尤其 Nvidia Vera Rubin 预计在 2026–27 年使用同类节点。


              竞争定位图把 MatX 放在一个独特象限：训练专用性高，同时覆盖训练+推理，并拥有在架构论文中最佳的 scale-up/scale-out 网络架构。纸面优势能否撑到芯片阶段，关键取决于未来 12–18
              个月的流片执行。
