      - number: '6.2'
        title: 战略投资方作为客户管线代理信号
        blocks:
          - type: paragraph
            body: >
              MatX 最实在的客户证据来自战略投资方名单，而不是传统客户证明点。领投 $500M Series B 的量化交易公司 Jane
              Street，构建处理每日数十亿美元交易的自有系统，并雇佣编译器、分布式系统和低延迟网络方面的深度专家——这一买方画像与 MatX 瞄准的前沿计算类别高度吻合。Jane Street
              是投资方，不是已披露客户；但其技术成熟度和愿意以这一规模领投，传递出对 MatX 计算价值主张的真实信念。由 Nat Friedman（前 GitHub CEO）和 Daniel Gross 管理的
              NFDG，在种子轮和 Series B 都有投资。Gross 在个人网站上公开称自己「负责 Meta 的计算」，让他同时连接到 Meta 的 AI 计算采购决策以及他共同创立的 Safe
              Superintelligence Inc.（SSI）。SSI 2024 年 9 月以 $5B 估值融资 $1B——NFDG 也参与其中——并明确面向前沿规模计算需求。为 AWS（Trainium）和
              Microsoft（Maia）设计 custom AI chips 的半导体公司 Marvell，战略投资了 MatX 的 Series B：这一结构性信号说明 Marvell 可能把 MatX
              视为生态补充，而非纯竞争对手，并可能打开设计服务集成路径。Harpoon Ventures 是一家防务导向 VC，其 mandate
              聚焦「美国技术领导力」和「面向未来世代的战略优势」，进一步释放潜在政府和防务邻近客户兴趣信号。总部在台湾、超过 83% 收入来自 HPC 与 AI 项目的 ASIC 设计公司 Alchip
              Technologies，则用制造入口补全了「投资方即代理管线」的图景。合在一起，在没有确认采购协议的情况下，这些关系构成 MatX 当前最清晰的 go-to-market 代理信号。
