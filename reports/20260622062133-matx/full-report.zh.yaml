      - number: '5.3'
        title: 制造依赖与产品路线图
        blocks:
          - type: paragraph
            body: >-
              MatX 于 2026 年 2 月完成 $500M Series B，明确被定义为制造加速轮：公司目标是在公告后「不到一年」内完成 tapeout，把首片硅落在 2026–2027 年初窗口。Alchip 与
              Marvell 作为供应链投资方进入，是带有运营含义的战略信号。Alchip 是领先的 fabless ASIC 设计服务公司，拥有强 TSMC
              关系和先进封装能力（高密度互连、chiplets）；其股权参与很可能把优先设计服务和封装条款与资本一起嵌入。Marvell 的相关性在于高速计算互连，这与 MatX 声称拥有所有已发布产品中最高 scale-up
              interconnect 带宽相一致。公开信息尚未确认制程节点、晶圆供给分配或良率风险缓释策略；这些都是判断 tapeout 时间表能否实现的关键变量。创始团队（CEO Reiner Pope，前 Google
              软件；硬件负责人 Mike Gunter，前 Google 芯片设计师）于 2023 年 8 月从 Google TPU 项目出来，并获得 $25M 种子资金。MatX 在 2024 年 5 月发布
              seqax，作为首个开源交付物。2024 年末，公司完成 Series A，据报道估值 $300M。到 2026 年 2 月，团队已扩至约 100 人。公司 2023 年启动时的原始预测是 2025
              年可拿到首批芯片；2026 年 2 月的 Series B 公告事实上把这一里程碑修订为最早 2026–2027 年。MatX
              的编程模型明确给用户提供硬件直接控制权，意味着公司有意牺牲易用性换取原始效率——除非后续出现更高层抽象层，否则这一取舍会缩小可触达开发者池。
