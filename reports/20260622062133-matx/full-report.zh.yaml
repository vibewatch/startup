          description: 首个在线集群在规模化场景验证吞吐、成本和可靠性；为后续扩张建立参考案例
        - label: 扩张 — 追加工作负载和机架
          description: 随着可靠性信心建立，RLHF、推理 prefill 和更多训练工作负载迁移到 MatX 机架
    claimRefs:
      - CU003
      - CU012
      - CU017
      - CU030
      - CU035
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 截至 2026 年中，前沿 AI 实验室潜在客户从发现到承诺的估算漏斗
    data:
      items:
        - label: 前沿实验室可服务总量
          value: 15
          description: 估算全球具备在 2027-2028 年窗口大规模采购定制 AI 芯片能力的前沿 AI 实验室总数
        - label: 已知晓 MatX
          value: 12
          description: 通过 Series B 媒体报道、研究论文或投资人网络引荐知晓 MatX 的实验室（估算）
        - label: 正在主动技术评估
          value: 4
          description: 正在根据训练工作负载需求评估 MatX 芯片规格的实验室（估算；无公开披露）
        - label: 深度洽谈 / LOI 阶段
          value: 2
          description: 实验室处在深度采购洽谈中（估计值；截至 2026 年 6 月，没有公开披露 LOI）
        - label: 已签约承诺
          value: 0
          description: 截至 2026 年 6 月，MatX 未披露已签署采购协议、设计导入或公开 LOI
    approximationNotes: 所有数值都是粗略估计，依据公开投资人网络信号和可比 AI 芯片厂商采用模式。MatX 没有公开披露任何管线数据。实际管线阶段和数量未知。
    claimRefs:
      - CU001
      - CU003
      - CU018
      - CU037
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: MatX 四类最可能客户或代理客群的证据质量与证明强度
    data:
      columns:
        - 前沿 AI 实验室（泛指）
        - SSI / 安全实验室
        - 国防 / 主权 AI
        - Marvell / 设计合作伙伴
      rows:
        - label: 已披露具名客户
          values:
            - 未披露
            - 无——仅有 NFDG 投资人重叠
            - 未披露
            - 战略投资人，不是客户
        - label: 采购承诺或 LOI
          values:
            - 未披露
            - 未披露
            - 未披露
            - 未披露
        - label: 技术评估证据
          values:
            - 可能未披露
            - 可能经由 NFDG 渠道
            - 可能存在——未披露
            - 可能通过设计服务对话
        - label: 投资人接近度信号强度
          values:
            - 高——Situational Awareness LP 共同领投
            - 很高——NFDG 共同投资；Daniel Gross 是 SSI 联合创始人
            - 中——Harpoon Ventures 有国防投资 mandate
            - 很高——Marvell 是 Series B 战略投资人
        - label: 预计首轮采购窗口
          values:
            - 2027 年，tapeout 和出货之后
            - 2027 年，出货之后
            - 2027–2028 年，采购周期更长
            - 2027 年，前提是纳入 Marvell 设计服务
    approximationNotes: 证据质量评级仅基于投资人重叠接近度分析，不基于已披露采购承诺或评估。实际评估状态没有公开信息。
    claimRefs:
      - CU006
