        title: 客户状态：收入前、出货前
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，MatX 没有披露付费客户，公开记录中没有已签合同或意向书，也尚未出货任何芯片。公司成立于 2023 年，2026 年 2 月完成 $500M Series
              B，并公开承诺在本轮融资后一年内完成芯片 tapeout，目标 2027 年首批出货。MatX 的创始博客和投资方材料明确把「前沿 AI
              实验室」——开发并部署全球最大语言模型的组织——列为主要客户群体，并有意排除小模型、推荐系统和卷积工作负载。公司的编程模型被描述为让用户「直接控制硬件」，这预设了成熟的 ML 工程团队，更符合前沿 AI
              实验室的采购画像，而非广泛企业部署。高度聚焦的定位把可触达客户池压缩到全球少于 15 家组织，但也提高了每个潜在 design win 的战略价值。公司未披露收入指标、客户管线规模或 win/loss
              数据。更准确地说，MatX 是一家处在客户前阶段的深硬件初创公司，目前资本结构（约 $600-625M 已融资）提供 runway，可在需要证明商业牵引前先交付首片硅。没有任何客户证明，对于这一阶段的
              custom silicon 初创公司并不反常——Groq 和 Cerebras 都曾多年没有披露客户——但这仍是重大尽调缺口。
