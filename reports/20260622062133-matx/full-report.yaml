              - CR040
      - number: '7.5'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              MatX's strongest risk mitigation is its founding team's direct Google TPU experience, which provides
              credibility, technical depth, and institutional knowledge of the chip development process. Its $500M
              Series B war chest enables 5+ years of sustained R&D if tightly managed. However, supply-chain mitigations
              remain limited: no alternative-foundry relationships, no dual-source HBM agreements, and no disclosed TSMC
              capacity reservation agreements have been publicly confirmed. The company can monitor BIS regulatory
              developments via Federal Register notices, track TSMC capacity allocation signals through earnings call
              disclosures, watch patent landscape changes via monthly USPTO and EPO filings, and use public capex
              reporting to anticipate AI demand trends. Recommended mitigation actions include: immediate BIS ECCN
              classification review and export-control counsel engagement; CFIUS investor screening before each new
              fundraising round; freedom-to-operate patent analysis prior to first commercial tape-out; and a targeted
              defensive patent prosecution program in MatX's key architectural differentiators (dataflow
              microarchitecture, quantization, compiler techniques). Kill criteria should be formally monitored and
              reported to the board on a quarterly basis. The five primary kill triggers—export control blocking more
              than 20% of TAM, TSMC allocation denial beyond 12 months, two or more co-founder departures,
              first-generation chip benchmark miss beyond 30% of claim, or two hyperscalers citing in-house chip cost
              parity as reason to exit third-party accelerator purchasing—each represent thesis-break events warranting
              strategic review or divestment.
            claimRefs:
              - CR020
              - CR040
          - type: table
            tableRef: TR005
