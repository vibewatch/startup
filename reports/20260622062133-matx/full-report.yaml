  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >
              MatX's revenue model is hardware-centric: the company intends to generate revenue through direct sales of
              AI accelerator chips and rack-level systems to frontier AI laboratories and hyperscalers. No software
              subscription layer, cloud-services offering, or licensing fee structure has been publicly described. This
              places MatX in the same direct-hardware revenue category as Nvidia's compute business, where revenue is
              recognized upon delivery of chips and systems rather than ratably over a contract term.

              No pricing has been publicly disclosed for the MatX One chip or any rack configuration. The absence of
              list pricing is standard for pre-revenue AI chip startups negotiating bespoke supply agreements with
              frontier labs. By comparison, Nvidia's B200 GPU is priced at approximately $30,000–$40,000 per chip in the
              open market, while Broadcom reported approximately 65% gross margin on its Q1 FY2026 AI chip revenue of
              $8.4 billion—illustrating the premium economics achievable in custom AI silicon at scale. MatX's
              positioning as a "best chips physically possible for LLM" rival to Nvidia implies a target average selling
              price in the same or higher range, but this cannot be verified without a disclosed pricing schedule.

              The company's total addressable revenue per customer sale depends on die yield, system packaging (HBM
              stacks, interconnects, thermal), and rack integration costs. At frontier lab deployment scales—hundreds to
              thousands of chips per customer—even a conservative ASP assumption of $20,000 per chip implies
              single-customer contract values in the hundreds of millions of dollars. However, no letter of intent,
              pilot agreement, or customer contract has been publicly announced. Revenue recognition for MatX will not
              be triggered until chips ship in 2027, making any revenue projection speculative for the 2026 underwriting
              period.

              GTM motion is direct-sales focused, targeting a small number of frontier AI labs with large compute
              procurement budgets. Sales cycles for custom AI silicon typically run 12–24 months from design engagement
              to first delivery. CAC proxies are unavailable since MatX has not disclosed customer relationships. The
              investor base includes Andrej Karpathy (former OpenAI/Tesla), Nat Friedman and Daniel Gross (NFDG,
              connected to frontier AI labs), and the Collison brothers (Stripe)—providing potential introductory
              channels but not constituting a disclosed customer pipeline.
