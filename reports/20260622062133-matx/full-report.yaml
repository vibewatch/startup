      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              The LLM training chip buyer universe is concentrated among three segments: hyperscalers, frontier AI labs,
              and large enterprise AI teams. Hyperscalers (Google Cloud, AWS, Azure, Meta) represent the largest buyers
              by capex and are increasingly building proprietary chips alongside merchant silicon purchases from Nvidia.
              Their capital commitment in 2026 ranges from $60B (Meta) to $200B (Amazon) in total infrastructure capex,
              with 60-75% AI-focused. Their procurement processes are typically 12-24 month evaluation cycles; a new
              chip vendor must demonstrate software toolchain compatibility, reliability at scale, and support
              infrastructure before winning allocation. Frontier AI labs (OpenAI, Anthropic, xAI, Cohere, Mistral) have
              the most aggressive hardware appetite and the most willingness to evaluate new silicon, but are also
              heavily dependent on their existing cloud/hyperscaler partnerships. OpenAI spent over $8.6 billion on
              inference alone in the first 9 months of 2025 and has commitments through its Azure/Stargate relationship.
              Anthropic is deployed primarily on AWS Trainium. These labs may be MatX's earliest customer target given
              their incentive to reduce hardware concentration and improve performance-per-dollar. The third buyer
              segment—large enterprise AI teams building foundation models or large-scale fine-tuning clusters—is less
              developed but growing; their evaluation cycles are longer and their risk tolerance for unproven silicon is
              lower. Budget ownership for hardware in all segments sits with infrastructure/engineering leadership
              rather than business units, creating a technical sales process that requires deep engineering engagement.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
