    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Status: Pre-Revenue, Pre-Shipment'
        blocks:
          - type: paragraph
            body: >
              As of June 2026, MatX has no disclosed paying customers, no signed contracts or letters of intent in the
              public record, and has not shipped any chips. The company was founded in 2023, completed its $500M Series
              B in February 2026, and has publicly committed to a chip tapeout within one year of that raise — targeting
              first shipments in 2027. MatX's founding blog post and investor materials explicitly identify "frontier
              labs" — organizations developing and deploying the world's largest language models — as its primary
              customer segment, deliberately excluding small-model, recommender-system, and convolution workloads from
              scope. The company's programming model is described as giving users "direct control over the hardware,"
              which presupposes sophisticated ML engineering teams and aligns with frontier lab procurement profiles
              rather than broad enterprise deployments. This highly focused targeting reduces the addressable customer
              pool to fewer than fifteen organizations globally but increases the strategic value of each potential
              design win. No revenue metrics, customer pipeline size, or win/loss data have been disclosed. The company
              is best characterized as a deep-hardware startup in the pre-customer phase, with its current capital
              structure (~$600-625M raised) providing runway to reach first silicon delivery before needing to
              demonstrate commercial traction. The absence of any customer proof is not unusual at this stage for custom
              silicon startups — Groq and Cerebras both operated for years without disclosed customers — but it is a
              material diligence gap nonetheless.
