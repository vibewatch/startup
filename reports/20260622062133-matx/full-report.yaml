              participation likely embeds preferential design-services and packaging terms alongside capital. Marvell's
              relevance aligns with high-speed compute interconnect, consistent with MatX's claim of the highest
              scale-up interconnect bandwidth of any announced product. No public disclosure confirms the fabrication
              process node, wafer-supply allocation, or yield-risk mitigation strategy—all of which are material for
              evaluating whether the tapeout timeline is achievable. The founding team (Reiner Pope, CEO, former Google
              software; Mike Gunter, hardware lead, former Google chip designer) came out of Google's TPU programme in
              August 2023 with $25M in seed capital. MatX released seqax as its first open-source deliverable in May
