              will build individual training clusters costing hundreds of billions of dollars by 2028, generating
              extraordinary demand for high-throughput AI silicon beyond what NVIDIA alone can supply. The
              trillion-dollar cluster projection implies a per-lab compute procurement cycle that could sustain a
              dedicated hardware partner like MatX for years. Second: US government and sovereign AI programs.
              Aschenbrenner's "The Project" essay argues that US government involvement in AGI compute infrastructure is
              inevitable by 2027-2028, which would create a large-scale procurement channel for domestically produced AI
              chips. Harpoon Ventures' defense focus reinforces this thesis and suggests MatX has at least one investor
              with the right network to facilitate introductions. Third: strategic semiconductor partners who might
              white-label or integrate MatX chips into their design-service offerings — a pathway for which Marvell's
              strategic investment is an enabling signal. Geography: all likely early customers are US-based, reflecting
              MatX's Mountain View headquarters and the domestic orientation of its investor base. The sovereign and
              government segment is longer-dated but potentially larger and stickier than the frontier lab segment,
              where government procurement timelines of 18-36 months are typical for new hardware categories entering
