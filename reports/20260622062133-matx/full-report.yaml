      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              MatX has raised approximately $600-625M across all disclosed rounds. The company began with a seed round
              of approximately $25M in late 2023 to early 2024, with early investors including Nat Friedman (former
              GitHub CEO) and Daniel Gross. The Series A of approximately $80-100M closed on November 22, 2024, led by
              Spark Capital at an approximately $300M post-money valuation; this round was reported by TechCrunch at the
              time as valuing the startup at "more than $300 million." The $500M Series B announced on February 24, 2026
              was led by Jane Street, described as "one of the most tech-savvy Wall Street firms," and Situational
              Awareness LP (co-led), whose founder Leopold Aschenbrenner is a former OpenAI researcher known for his
              influential writing on AGI timelines and compute requirements. Additional Series B participants include
              Spark Capital (returning), Marvell Technology, NFDG (Nat Friedman and Daniel Gross's fund), Patrick and
              John Collison (Stripe co-founders), Triatomic Capital, Harpoon Ventures, Andrej Karpathy, Dwarkesh Patel,
              and Alchip. The strategic inclusion of Alchip and Marvell—both deep in the semiconductor supply chain—is
              notable and suggests MatX may benefit from preferential manufacturing and packaging access. MatX did not
              disclose a post-Series B valuation. For comparison, competitor Etched raised $500M at a $5B valuation
              around the same timeframe. No debt financing or secondary transactions have been publicly disclosed.
