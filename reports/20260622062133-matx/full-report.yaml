      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary growth driver is the exponential scaling of LLM parameters: frontier models have scaled from
              tens of billions to hundreds of billions of parameters in two years, and the next generation is expected
              at the trillion-parameter range. This scaling directly increases demand for high-throughput training
              silicon. A second driver is the cost efficiency motive: training a large LLM can cost hundreds of millions
              to billions of dollars using current GPU infrastructure, and even a 10-20% efficiency improvement has
              enormous economic value at scale. Hyperscalers' shift to diversify away from Nvidia—driven by both supply
              concentration risk and cost—creates an opening for new entrants. The CHIPS Act ($33.7 billion allocation)
              is accelerating domestic semiconductor manufacturing and creating policy tailwinds for US-based chip
              design companies. On the constraint side, the primary adoption barrier for MatX is software ecosystem
              lock-in: Nvidia's CUDA ecosystem is deeply entrenched, and AI researchers and MLOps teams have significant
              switching costs. MatX's explicit choice to provide "direct control over hardware" rather than a
              CUDA-compatible abstraction layer narrows its addressable base to sophisticated customers with their own
              compiler/kernel engineers. Supply constraints at TSMC for advanced nodes create a second major barrier:
              new entrants must compete with Apple, Nvidia, and AMD for capacity allocation at TSMC's 3nm and 2nm nodes.
              A third constraint is customer validation timelines: hyperscalers typically require 12-18 months of
              silicon validation before production deployment. Capital intensity for MatX's manufacturing ramp adds
              financial risk on top of technology risk.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
          - type: table
            tableRef: TM004
            claimRefs: []
          - type: figure
            figureRef: FM004
            claimRefs:
              - CM019
              - CM020
              - CM027
      - number: '2.5'
        title: Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              Market sizing in the AI chip sector is severely fragmented. The range of published 2026 estimates spans
              $9.72 billion to over $120 billion for what is nominally the same market, reflecting fundamentally
              different scope definitions: some include only training chips, others add inference, others add edge and
              embedded, and some include adjacent memory and interconnect hardware. No single analyst has published a
              rigorous bottoms-up MatX-specific SAM sizing that accounts for the LLM training segment as a discrete unit
              separated from inference, edge, and legacy GPU workloads. The "60% hyperscaler share" figure, while widely
              cited, cannot be verified against primary filings because hyperscalers do not break out AI chip purchasing
              from broader infrastructure capex in public disclosures. Additionally, the rapid shift from
              training-dominated workloads to inference-dominated workloads (as foundation models are trained once but
              inferred billions of times) means that any static TAM estimate for "LLM training chips" may be partially
              supplanted by inference-chip demand within 2-3 years. The addressable market for MatX—an unproven chip
              without CUDA compatibility, targeting only large models—is necessarily a subset of any analyst's published
              TAM, and the actual obtainable market for the 2027-2028 timeframe cannot be reliably sized from public
              sources alone.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM029
              - CM030
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: SAM is Narrower Than the Headline $100B AI Chip Market
            body: >-
              The AI chip market as a whole is enormous, but MatX's actual SAM is the sub-segment for large-model LLM
              training and inference—estimated at $9-15B in 2026. This is still substantial and growing, but investors
              should not confuse the broad AI chip TAM with the narrower segment MatX targets. MatX has explicitly
              excluded small models, recommenders, and convolutions.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: callout
            title: Hyperscaler Diversification Creates a Real Market Opening
            body: >-
              Hyperscalers collectively committed over $600B in capex in 2026, with 60-75% AI-focused. Their
              multi-source strategy—building own chips AND buying from Nvidia AND evaluating startups—means a real
              market exists for a credible alternative. MatX's 10x performance claim, if validated, directly addresses
              the ROI-per-dollar metric that drives hyperscaler procurement decisions.
            calloutType: strength
            claimRefs:
              - CM014
              - CM022
              - CM023
          - type: callout
            title: Software Ecosystem Constraint Limits Accessible Market
            body: >-
              CUDA's dominance is the single most important constraint on MatX's addressable market. MatX's model of
              giving users 'direct control over hardware' is a technical differentiator but also a significant
              commercial constraint—only customers with deep compiler and kernel engineering capabilities can deploy
              MatX. This limits adoption to the most sophisticated 5-10% of the potential market.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              MatX enters the AI chip market targeting large-model LLM training, RL fine-tuning, and inference
              prefill/decode — a segment dominated by Nvidia GPUs and increasingly contested by hyperscaler custom
              silicon and a growing cohort of well-funded AI chip startups. The competitive field divides into five
              distinct tiers: (1) incumbent merchant silicon vendors (Nvidia, AMD), (2) hyperscaler internal ASICs
              (Google TPU, Amazon Trainium, Microsoft Maia, Meta MTIA), (3) directly competing AI chip startups
              targeting training/inference (Groq, Cerebras, Tenstorrent, SambaNova, Etched, Positron), (4) adjacent
              compute platforms (D-Matrix, Lightmatter), and (5) status-quo alternatives (cloud GPU rental, academic
              clusters).


              Nvidia's dominance is structural and deeply entrenched. With an estimated 70–90% share of AI accelerator
              revenue in 2026, a $51.2 billion quarterly data-center revenue run rate, and the CUDA software ecosystem
              built over more than 15 years, Nvidia defines the benchmark MatX must surpass. The H100/H200 and Blackwell
              B200/B300 Ultra represent the incumbent's current-generation defense. Nvidia's upcoming Vera Rubin
              architecture (2026–27) is explicitly designed to maintain leadership in both training throughput and
              inference decode — the precise workloads MatX targets.


              AMD's MI300X/MI325X is the primary merchant GPU alternative. ROCm has improved materially but still trails
              CUDA in ecosystem depth, limiting AMD's appeal to cost-sensitive workloads and hybrid CPU-GPU tasks.
              Google's TPU Trillium (v6e) leads in total installed base with 100,000+ chips deployed, but availability
              is restricted to GCP customers. Amazon's Trainium3 (2.52 PFLOP FP8, 144 GB HBM3e) is gaining traction at
              Anthropic and OpenAI for training. Microsoft's Maia 200 claims 3× the FP4 performance of Trainium3 and
              targets internal Azure workloads. These hyperscaler chips are not sold externally, so they address captive
              demand rather than competing head-on for MatX's target customer — frontier AI labs that need to buy or
              build compute.


              Among startups, the competitive dynamics vary significantly by workload specialization. Groq focuses on
              inference with SRAM-only LPU architecture, targeting latency-sensitive decode. Cerebras targets
              ultra-large model training and inference with its Wafer-Scale Engine 3. Tenstorrent, led by Jim Keller,
              pursues open-source software with RISC-V and NPU-based Wormhole chips. SambaNova competes in enterprise
              deployments. Etched is the most comparable bet to MatX — a transformer-only ASIC with a $5B valuation —
              though its chip design is inference-only. MatX's explicit training-and-inference dual targeting, combined
              with its SRAM-first architecture and large-scale interconnect, creates a differentiated position, but the
              field is crowded and capital-rich.
