chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              MatX is a fabless AI chip startup headquartered in Mountain View, California, incorporated in 2023 by
              former Google Tensor Processing Unit (TPU) engineers Reiner Pope and Mike Gunter. The company's mission is
              to design what it describes as "the best chips physically possible for the large model needs of frontier
              labs." Its sole disclosed product is the MatX One AI accelerator chip, targeting large language model
              (LLM) training, reinforcement learning from human feedback (RLHF), inference prefill, and inference decode
              workloads. MatX generates revenue through hardware sales of chips and racks; no cloud service layer or
              subscription pricing has been disclosed publicly. The company explicitly excludes small-model,
              recommender-system, and convolution workloads from its target market, placing it in a narrower but more
              defensible niche than general-purpose GPU vendors. The corporate structure is a Delaware C-Corporation at
              Series B stage, backed by institutional and strategic investors. As of early 2026, MatX remains
              pre-revenue with first chip delivery to customers targeted for 2027.
