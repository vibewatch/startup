      - number: '3.3'
        title: Direct Startup Competitor Deep Dives
        blocks:
          - type: paragraph
            body: >
              Groq (founded 2016) designs Language Processing Units (LPUs) optimized for inference throughput and low
              latency. Its SRAM-only architecture eliminates HBM bandwidth bottlenecks for decode but constrains memory
              capacity for very large models. Groq raised $640M+ and is valued at approximately $2.8B. It targets a
              different workload (inference-only, especially streaming decode) and does not compete with MatX on
              training. However, for inference customers, Groq represents an alternative if MatX's decode speed claims
              are not confirmed in benchmarks.


              Cerebras Systems (founded 2016) takes the opposite approach — its Wafer-Scale Engine 3 (WSE-3) integrates
              900,000 processing cores on a single wafer, enabling linear scaling for very large model training and
              inference without inter-chip communication overhead. Cerebras went public in 2026 at approximately $23B
              valuation following an IPO that jumped 68% on debut, raising ~$1B. Cerebras targets customers who train
              extremely large models (1T+ parameters) and value low-latency inference with full-model in-chip
              deployment. Its addressable footprint is constrained by wafer-scale manufacturing complexity and pricing.


              Tenstorrent (founded 2016) is led by CPU design legend Jim Keller. Its Wormhole and Blackhole chips use a
              mesh-based NPU with open-source software via PyBuda and RISC-V processors. Tenstorrent raised $693M to
              date (including $350M in 2024 led by AFW Partners) at a $2.6B valuation. Its open-source positioning and
              licensing model differentiate it from closed-stack vendors; it targets enterprises and government
              customers who demand software control. Tenstorrent competes more directly with Nvidia's training footprint
              but lacks MatX's SRAM-first architecture advantage for inference decode.


              Etched (founded 2022) builds a transformer-only ASIC — the Sohu chip — that executes the transformer
              operation natively in hardware. Etched claims 20× throughput over H100 for inference. It is the most
              closely analogous startup bet to MatX in architecture philosophy (opinionated, workload-specific), and it
              raised at a ~$5B valuation. The key distinction: Etched is inference-only (no training), while MatX
              targets training AND inference. A potential risk is that Etched's focus on decode could cannibalize MatX's
              inference value proposition if Etched's customers prove reluctant to have separate training and inference
              chips.


              SambaNova (founded 2017) builds the DataScale system for enterprise deployments, targeting organizations
              that need on-premise AI infrastructure. Raised $1.1B+ at a $5B+ valuation. SambaNova competes at the
              enterprise tier (banks, healthcare, government) rather than frontier AI labs. D-Matrix (founded 2019) uses
              in-memory compute for inference. Positron AI raised $230M Series B targeting power-efficient inference.
              Lightmatter builds photonic interconnect and is more of an enabling platform than a direct chip
              competitor.
