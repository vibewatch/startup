      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >
              Reiner Pope co-founded MatX and serves as CEO. At Google, Pope served as Efficiency Lead for PaLM, where
              he designed what the company describes as the world's fastest LLM inference software, and also helped
              conceive the TPU v5e chip as Architect and Compiler Lead for Google's ML chips. He brings over a decade of
              experience in high-performance software and hardware development. His co-founder Mike Gunter serves as CTO
              and brings 28 years of hardware architecture experience, including 12 years focused on machine learning
              silicon. At Google, Gunter was Chief Architect for one of Google's ML chips, leading the design of
              Google's then-fastest ML chip, and has personally designed and implemented 11 chips across processors,
              wireless, graphics, and ML. The founding duo is complemented by Avinash Mani as Chief Development Officer
              (Silicon), who brings over 25 years building products and leading engineering teams in silicon and
              software. Mani has taken more than 12 chip products from concept to high-volume deployment and was a
              founding team member of Innovium, which was acquired for $1.1 billion. The leadership team reflects deep
              domain expertise in both the software and hardware dimensions of AI chip design. MatX has approximately
              100 employees as of the Series B announcement in February 2026, working primarily from the Mountain View
              office three days per week.
