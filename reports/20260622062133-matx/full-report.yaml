      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Conditional Research-More Stance: Three Milestone Gates Required'
            body: >-
              The recommended stance on MatX is research-more as of June 2026. The three milestone gates that would
              upgrade this to track are: (1) confirmed TSMC tapeout of MGXONE on the Q1 2027 schedule, (2) at least one
              signed LOI or pilot agreement from a frontier AI lab or hyperscaler, and (3) independent benchmark
              validation showing ≥3× throughput per dollar vs. Nvidia H100. None of these require a follow-on round
              commitment; they are due-diligence checkpoints achievable within the next 12–18 months. If all three are
              met, the base-case scenario becomes investable; if two or more are missed, the bear case probability rises
              materially.
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV025
              - CV026
              - CV038
          - type: callout
            title: 'SambaNova Precedent: 50%+ Valuation Erosion Is the AI Chip Startup Base Rate for Misses'
            body: >-
              SambaNova raised $1.1B+ and was valued at $5B in 2021. By 2025, BlackRock had marked down its SambaNova
              stake by 17% (implying ~$2.4B) and the company was actively exploring a sale after failing to close a new
              funding round and after Intel acquisition talks stalled. This is the most direct adverse comparable for
              MatX: a well-funded, sophisticated-team AI chip company that underdelivered on commercial timelines. The
              lesson is not that MatX will follow this path, but that valuation compression of 40–60% from peak is a
              realistic downside if commercial milestones are missed. At an estimated $1.5–2.5B Series B entry, the bear
              case floor of $1.0–1.5B implies potential 30–50% capital impairment before dilution. Investors must
              explicitly price this binary risk.
            calloutType: risk
            claimRefs:
              - CV016
              - CV017
              - CV019
              - CV020
              - CV040
          - type: callout
            title: 'Cerebras Trajectory Shows the Upside: A Single Hyperscaler Anchor Drives Multibillion Re-Rating'
            body: >-
              Cerebras' journey from a $8.1B Series G (September 2025) to a $23B Series H (February 2026) to an IPO
              targeting ~$26.6B market cap (May 2026)—all driven substantially by one major commercial contract with
              OpenAI—illustrates the asymmetric upside available to AI chip companies that land an anchor hyperscaler or
              frontier-lab customer. MatX's founding team includes some of the individuals who built the chips that
              power Google's model training infrastructure. If MatX can replicate even a fraction of Cerebras'
              commercial breakthrough, the valuation step-up from base to bull case is achievable. This is the bull-case
              thesis in its simplest form: one customer, proven silicon, multibillion re-rating. The diligence
              imperative is to determine whether that customer pipeline exists, or whether the company is still entirely
              pre-commercial.
            calloutType: strength
            claimRefs:
              - CV008
              - CV009
              - CV033
              - CV034
