      - number: '6.5'
        title: Concentration, Competition, and Retention Risks
        blocks:
          - type: paragraph
            body: >
              MatX faces a tripartite customer risk: concentration, competition, and retention. On concentration: with
              fewer than 15 organizations globally capable of purchasing custom AI chips at the scale MatX targets, the
              loss of any single early customer would represent a potentially fatal setback. Comparable hardware
              startups that achieved their first 1-2 design wins often derived over 80% of Year 1 revenue from those
              initial accounts. Broadcom's structural reliance on Alphabet for a large share of its AI ASIC revenue
              illustrates how design-partner businesses in the AI chip market are systematically exposed to top-customer
              concentration risk. On competition: NVIDIA commands approximately 85-86% of the AI silicon market as of
              mid-2026 and is executing a full-stack counter-strategy — NVLink Fusion (which allows hyperscalers to
              connect custom ASICs to NVIDIA's fabric, reducing the architectural isolation benefit for MatX), the Groq
              acquisition (plugging NVIDIA's ultra-low-latency inference gap before MatX can win it), and a $5B
              partnership with Intel targeting x86 CPU integration. Each of these moves narrows the competitive window
              for independent chip vendors. Hyperscaler captive chips (Google TPU, AWS Trainium, Microsoft Maia, Meta
              MTIA) serve internal workloads and do not directly compete for the frontier lab merchant market, but their
              existence means that several frontier labs may already be invested in in-house silicon trajectories. On
              retention: the absence of shipped silicon means there is no empirical retention data; comparables from
              Groq and Cerebras suggest 70-90% effective retention after a successful first deployment, driven by custom
              software stack lock-in, but CUDA-based switching costs create a high initial threshold MatX must clear
              before any retention dynamic applies. The envisioned land-and-expand mechanism — winning a frontier lab's
              first specialized workload (such as RLHF or inference decode), then expanding to full training clusters —
              requires sustained multi-generation technical credibility, which is itself a multi-year execution risk and
              the central thesis-break condition investors and diligence teams should monitor.
