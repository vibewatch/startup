        - Strong tailwind
        - Now
        - MatX's 10x performance claim directly addresses the top hyperscaler ROI driver
        - Verify performance claims with independent benchmarks
      - - Hyperscaler silicon diversification (away from Nvidia)
        - Moderate tailwind
        - 2026-2028
        - Creates market opening; hyperscalers actively seek alternatives
        - Has MatX secured any hyperscaler pilot conversations?
      - - CHIPS Act / domestic semiconductor policy
        - Moderate tailwind
        - 2026-2028
        - Policy incentives favor US chip design companies; Harpoon Ventures investor signals defense interest
        - Any government contract or grant activity?
      - - CUDA/Nvidia software ecosystem lock-in
        - Strong headwind
        - Persistent
        - >-
          MatX's "direct hardware control" model requires customers to build their own toolchain; limits addressable
          base
        - What software maturity level does MatX commit to by 2027?
      - - TSMC advanced node capacity constraints
        - Strong headwind
        - 2026-2027
        - Competing with Apple, Nvidia, AMD for 3nm/2nm wafer allocation; startup leverage is limited
        - Has MatX secured TSMC capacity? What node?
