      - number: '4.3'
        title: Capital Adequacy and Runway
        blocks:
          - type: paragraph
            body: >
              MatX has raised approximately $625M across three financing rounds: a seed round of approximately $25M in
              late 2023 or early 2024, a Series A of approximately $80–100M announced in November 2024, and a $500M
              Series B led by Jane Street and Situational Awareness LP, closed on February 24, 2026. No debt financing,
              credit facilities, or secondary transactions have been disclosed. The Series B represents by far the
              dominant tranche and provides the primary capital runway.

              With approximately 100 employees as of the Series B, and assuming all-in employment costs of
              $50,000–$100,000 per person per month (inclusive of salaries, equity compensation, benefits, office, and
              equipment), the employee-level burn component alone is approximately $5M–$10M per month. Adding TSMC
              design service fees, EDA software licenses, IP licensing, prototype wafer runs, and infrastructure costs
              brings total estimated monthly burn to $5M–$15M. Against an estimated cash position of $500M–$600M
              (accounting for spending since the Series A close), this implies a runway of approximately 33–83 months
              from the Series B—roughly 3 to 7 years.

              However, this range does not capture the concentrated capital event represented by the MatX One tapeout. A
              single advanced-node tapeout at TSMC can consume $50M–$150M in NRE, mask sets, and engineering costs. MatX
              has publicly committed to completing tapeout within one year of the February 2026 Series B announcement,
              implying a concentrated capital draw between mid-2026 and Q1 2027. Initial production wafer runs at
              $30,000 per wafer (N2) for yield characterization would require hundreds of wafers, adding further capital
              exposure. If MatX's tapeout and initial manufacturing commitment totals $100M–$200M, actual runway narrows
              to approximately 20–50 months from February 2026—still adequate in the base case, but with limited margin
              for schedule delays.

              The strategic composition of the Series B syndicate provides some risk mitigation. Marvell Technology's
              participation may confer supply-chain relationships that reduce TSMC NRE exposure through design services
              support, and Alchip's inclusion signals potential turnkey ASIC manufacturing assistance. No formal supply
              agreements have been disclosed, however, and these relationships remain speculative advantages. The
              next-round trigger for MatX is most plausibly successful tapeout and first silicon characterization—events
              not expected before 2027. If tapeout slips or first silicon underperforms, the company may require bridge
              capital before achieving revenue.
