      - number: '1.4'
        title: Key Milestones and Company Trajectory
        blocks:
          - type: paragraph
            body: >
              MatX's trajectory from founding through mid-2026 spans three phases: stealth research and team-building
              (2023), public disclosure and Series A fundraise (2024), and product launch and large-scale capital raise
              (2025-2026). In the research phase (2023-2024), the company published foundational technical work
              including seqax, a simple and efficient LLM research codebase (May 2024), and built the engineering team
              to roughly several dozen employees. The Series A in November 2024 provided public validation of the
              company's direction and thesis at a $300M valuation. Through 2025, MatX accelerated its research output,
              publishing SPIRe (speculative decoding for inference throughput, April 2025), blockwise sparse attention
              work (July 2025), and an article on optimizing for inference in addition to training FLOPs (January 2025).
              The Series A announcement post in March 2025 provided the first significant public disclosure of the
              company's strategy. The pivotal milestone was the February 24, 2026 announcement of both the MatX One chip
              concept and the $500M Series B, which together established MatX as a serious challenger to Nvidia in the
              LLM training market. The company has publicly committed to a tapeout in under one year from the Series B
              announcement, implying tapeout by approximately Q1 2027 and shipments in 2027. No chips have shipped as of
              June 2026 and the company is pre-revenue.
