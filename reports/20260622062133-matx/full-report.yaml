      - number: '3.2'
        title: Incumbent and Hyperscaler Analysis
        blocks:
          - type: paragraph
            body: >
              Nvidia's competitive moat rests on three interlocking pillars: (1) CUDA ecosystem lock-in — 15 years of
              tools, libraries, frameworks, and developer workflows; (2) supply chain priority — NVLink, HBM supply
              agreements, and TSMC advanced-node allocation; and (3) continuous hardware velocity — from H100 to H200 to
              B100/B200 to Blackwell Ultra in 18 months, compressing the window for challengers to establish parity
              before the next generation ships. The B300 Ultra system (288 GB HBM3e, 15 PFLOP dense FP4) is the current
              benchmark for large-scale training.


              AMD's MI300X positions at 192 GB HBM3 — matching or exceeding H100 memory capacity — and benefits from an
              open ROCm ecosystem that can run PyTorch workloads without code rewrites. However, ROCm's long-tail
              compatibility and toolchain depth remain below CUDA, limiting AMD to customers willing to accept 10–20%
              tooling overhead. AMD does not directly compete with MatX on the training cluster build-out use case.


              Among hyperscaler ASICs, Google's Trillium TPU is the most mature alternative. Trillium delivers 4.7× peak
              compute over TPU v5e with 32 GB HBM per chip and is deployed at 100,000+ scale across GCP. Amazon's
              Trainium2/3 is used by Anthropic and OpenAI for both training and inference. Microsoft's Maia 200 on TSMC
              3nm with 140B+ transistors and 216 GB HBM3e claims 3× FP4 performance of Trainium3. Meta's MTIA 300–500
              series (announced March 2026, RISC-V-based) claims up to 25× compute gains across the lineup.


              Key differentiator: these hyperscaler chips are captive — not sold externally. Any frontier AI lab outside
              Google/Amazon/Microsoft/Meta must either build custom silicon (expensive), buy Nvidia, or source from a
              startup like MatX. This captive dynamic creates a genuine commercial opportunity for MatX among the
              growing number of well-funded AI labs and sovereign AI programs that want independence from hyperscalers
              and Nvidia.


              Custom ASIC shipments from cloud providers are forecast to grow 44.6% in 2026 versus 16.1% for Nvidia
              GPUs, and ASICs are projected to reach 27.8% of the AI server market — indicating demand is structurally
              shifting toward purpose-built silicon. MatX, as an external chipmaker focused on LLM training, sits at the
              intersection of that shift.
