        title: Strategic Investors as Proxy Customer Pipeline
        blocks:
          - type: paragraph
            body: >
              MatX's most tangible customer evidence derives from its strategic investor roster rather than traditional
              customer proof points. Jane Street, the quantitative trading firm that led the $500M Series B, builds
              proprietary systems handling billions of dollars of daily transactions and employs deep specialists in
              compilers, distributed systems, and low-latency networking — a buyer profile highly aligned with the
              frontier compute class MatX is targeting. While Jane Street is an investor and not a disclosed customer,
              its technical sophistication and willingness to lead at this scale signals genuine conviction about MatX's
              compute value proposition. NFDG, the fund run by Nat Friedman (former GitHub CEO) and Daniel Gross,
              invested at seed and again in the Series B. Gross publicly states on his personal website that he "runs
              compute for Meta," connecting him simultaneously to Meta's AI compute procurement decisions and to Safe
              Superintelligence Inc. (SSI), which he co-founded. SSI raised $1B in September 2024 at a $5B valuation —
              with NFDG among its investors — and is explicitly oriented toward frontier-scale compute demand. Marvell
              Technology, the semiconductor company that designs custom AI chips for AWS (Trainium) and Microsoft
              (Maia), invested strategically in MatX's Series B: this structural signal suggests Marvell sees MatX as an
              ecosystem complement rather than a pure competitor, potentially enabling design-service integration
              pathways. Harpoon Ventures, a defense-focused VC whose mandate centers on "American technological
              leadership" and "strategic advantage for future generations," provides a further signal of potential
              government and defense-adjacent customer interest. Alchip Technologies, a Taiwan-based ASIC design house
