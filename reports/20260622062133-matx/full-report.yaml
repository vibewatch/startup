      - number: '5.2'
        title: Software Stack and Research Cadence
        blocks:
          - type: paragraph
            body: >-
              MatX has released a steady cadence of ML systems research that simultaneously documents its algorithmic
              philosophy and serves as advance evidence of chip design priorities. The seqax codebase (released May
              2024) is an open-source 500-line JAX training loop that makes all mathematics, memory tensors, and
              inter-chip communication explicit in source code—contrasting sharply with production frameworks that bury
              these details behind abstraction layers. Seqax achieves 30–50% model FLOPS utilisation (MFU) on GPUs and
              TPUs at research scale up to approximately 100 accelerators; GitHub benchmarks show 35% MFU on
              540M-parameter models on single-host A100×8 clusters. The leaky quantization paper (January 2026)
              identifies a subtle training failure mode in MXFP4 block-quantized causal attention: because a block's
              quantization scale is a function of all elements in the block—including future tokens—standard causal
              masking alone does not prevent information leakage across the training and inference boundary. The paper
              presents a fix enabling MXFP4 use in both attention forward and gradient computation passes. SMVA (Sparse
              Multi-Value Attention, April 2025) decouples the K-head count from V-head count and introduces sparse
              value loading, reducing attention memory bandwidth by up to 8× versus grouped-query attention for typical
              model architectures. SPIRe (the SD speculative-decoding paper, April 2025) extends speculative decoding to
              large-batch settings via static sparse attention, pruned initialisation, and feedback memory, increasing
              modelled throughput by over 100% versus smaller draft models. SD_NSA (July 2025) combines blockwise sparse
              attention with speculative decoding and forces all draft tokens to attend to the same context subset,
              achieving up to 3.5× higher operational intensity during the SD verification step. This research portfolio
              draws directly on Pope et al.'s 2022 Google paper on efficient TPU inference (arXiv:2211.05102), which
              achieved 29 ms per token on PaLM 540B with int8 quantisation and 76% MFU on TPU v4. The OCP Microscaling
              Formats specification (MX v1.0, September 2023), co-authored by Microsoft, AMD, Arm, Intel, Meta, NVIDIA,
              and Qualcomm, defines the MXFP4 and MXFP8 block-quantized numerical formats that MatX's leaky quantization
              work directly targets. The rules_derive Rust library (July 2025), open-sourced and used internally at MatX
              for more than 20 traits, signals a team that applies software engineering rigour to systems-level compiler
              and toolchain work.
