      - number: '4.2'
        title: Cost Structure and COGS Benchmarks
        blocks:
          - type: paragraph
            body: >
              MatX is a fabless semiconductor company: it does not own wafer fabrication equipment, reducing direct
              capex obligations but exposing it entirely to foundry pricing, capacity allocation, and scheduling risk.
              TSMC is the disclosed manufacturing partner, and the MatX One's process node has not been publicly
              confirmed. Given the company's emphasis on maximum LLM performance—targeting the highest FLOPS/mm2—the
              design is most likely targeting TSMC's N2 (2nm) or N3 (3nm) node, both of which carry significant and
              rising wafer costs.

              TSMC N2 wafer pricing is confirmed at approximately $30,000 per wafer, representing a 10–20% premium over
              N3 pricing. The forthcoming A16 (1.6nm) node is rumored at up to $45,000 per wafer, a roughly 50% premium
              over N2. Additionally, TrendForce reported that TSMC is eyeing a 3nm price hike of up to 15% in 2H 2026,
              with a further 5–10% increase expected in 2027, driven by sustained AI chip demand from Nvidia, AMD,
              Broadcom, and hyperscaler in-house ASIC programs. These pricing dynamics directly determine MatX's floor
              COGS before any yield or packaging considerations.

              High-bandwidth memory is the second major COGS driver. AI training accelerators require multiple HBM
              stacks per chip. HBM3E supply prices rose approximately 20% for 2026 contracts due to strong demand from
              Nvidia H200 and ASIC-based chip programs, and 12-layer HBM4 units are expected to exceed $600 each. Memory
              is now estimated to represent approximately 30% of total hyperscaler AI data center capex in 2026, up from
              roughly 8% in 2023—a structural cost inflation trend that will flow through to the bill of materials for
              any vendor sourcing HBM. Long-term supply agreements from Samsung and SK Hynix increasingly require
              advance payments of 10–30% of contract value, tightening working capital for memory procurement.

              For a typical fabless AI chip company at production maturity, wafer and memory together represent
              approximately 40–60% of COGS, implying gross margins of 40–60% at volume. Best-in-class operators like
              Broadcom achieve approximately 65% gross margin on AI chip revenue, while Marvell's annual reports confirm
              AI/data center as its most profitable growth segment. MatX, as a new entrant without TSMC volume
              commitments, will face higher per-wafer rack rates than preferred customers in initial production runs,
              and NRE costs for tapeout at advanced nodes typically range from $50M to $150M before a single chip ships.
