      - number: '4.4'
        title: Public Financial Traction and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >
              MatX's financial disclosure as of June 2026 is extremely limited, consistent with a pre-revenue private
              company at Series B stage that has not yet shipped product. No revenue, ARR, GMV, unit economics, gross
              margin, customer count, or utilization metric has been publicly disclosed. The confirmed financial data
              points are: total capital raised (~$625M), Series B size ($500M), Series B close date (February 24, 2026),
              lead investors (Jane Street, Situational Awareness LP), strategic investors (Marvell Technology, Alchip),
              headcount (~100), and the tapeout timeline (within one year of Series B). The post-Series B valuation has
              not been disclosed.

              Financial benchmarks from comparable public companies provide limited analogy due to scale differences.
              Broadcom's AI chip revenue reached $8.4 billion in Q1 FY2026 at approximately 65% gross margin, and the
              company projects AI revenue exceeding $100 billion in FY2027. Marvell Technology's SEC-filed annual
              reports confirm AI and data center as its largest and fastest-growing revenue segment, demonstrating the
              monetization scale achievable in custom AI silicon once a customer base is established. The 2026 HBM
              market is projected at $54.6 billion by BofA, up 58% year-over-year, with Goldman Sachs forecasting 82%
              HBM demand growth from ASIC-based chips—illustrating the broader market's scale but not providing
              MatX-specific evidence.

              The financial evidence gap for MatX is severe and structural. An investor cannot underwrite chip pricing,
              gross margin, CAC, working capital cycle, customer concentration, or revenue recognition methodology
              without direct access to management-provided financial projections, pricing term sheets, TSMC NRE
              agreements, and customer pipeline data. Public evidence cannot bridge this gap—it is entirely a private
              information exercise. The diligence requirements detailed in the financial gaps table in this chapter
              define the minimum information set necessary before any investment decision.
