  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'MatX One: Chip Architecture and Memory Hierarchy'
        blocks:
          - type: paragraph
            body: >-
              The MatX One is an application-specific integrated circuit (ASIC) engineered from first principles for
              large language model workloads. Its defining architectural innovation is the splittable systolic array,
              which preserves the energy and area efficiency of large systolic arrays—the same architectural principle
              underlying Google's TPU lineage, where both founders worked—while extending high utilization to smaller
              matrices with flexible shapes. This design eliminates the GPU's general-purpose overhead (geometry
              shading, video decode, rasterisation, raster order groups) that occupies die area and power budget
              irrelevant to LLMs. The memory hierarchy reflects a deliberate two-tier philosophy: model weights reside
              primarily in on-chip SRAM for low-latency weight access, enabling more than 2,000 output tokens per second
              on large 100-layer mixture-of-experts (MoE) models; KV-cache entries are stored in high-bandwidth memory
              (HBM), providing long-context support without the bandwidth penalty that SRAM-only designs face at
              sequence lengths beyond a few thousand tokens. The chip targets training, RL, inference prefill, and
              decode workloads exclusively, covering large dense and MoE models with no stated upper limit on model
              size. The scale-up interconnect—described as the highest of any announced product—supports cluster
              configurations spanning hundreds of thousands of chips, which is a prerequisite for frontier-lab customers
              running >100B-parameter training runs.
