      - number: '8.4'
        title: Entry Discipline, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommended investment stance for MatX as of June 2026 is research-more: the team pedigree, capital
              depth, and market opportunity are attractive, but the absence of tapeout confirmation, customer LOIs, and
              independent benchmarks creates too much uncertainty to commit at an estimated $1.5–2.5B post-money. A
              conditional investment discipline would require three milestone gates before deploying capital: (1)
              confirmed TSMC tapeout of MGXONE on the 2027 schedule with independent foundry verification, (2) at least
              one signed LOI or pilot agreement from a frontier AI lab or hyperscaler, and (3) independent benchmark
              results demonstrating ≥3× inference throughput improvement per dollar versus Nvidia H100 on representative
              LLM workloads.

              Entry price discipline matters significantly in hardware ventures. At a $1.5B post-money, a 3× investor
              return requires a $4.5B exit—plausible but not certain. At a $2.5B post-money, a 3× return requires a
              $7.5B exit, which is in Cerebras IPO territory and would require MatX to become one of the top two
              dedicated LLM inference chip vendors globally. The preference stack and dilution overhang are also
              material unknowns: without a disclosed cap table, investors cannot model the actual realized return for
              common shareholders vs. preferred classes with participation or anti-dilution rights.

              Thesis-break triggers include tapeout delay beyond Q2 2028, loss of TSMC node allocation to a
              higher-priority customer, departure of either co-founder, failure to secure a single design win by
              mid-2028, or emergence of a hyperscaler-developed ASIC (Google TPU, Amazon Trainium, Microsoft Maia) that
              definitively displaces third-party silicon for the frontier-lab segment. Any of these events would
              materially reduce the probability of the base case and shift probabilities toward the bear scenario,
              warranting reassessment.

              The final diligence priority list centers on: (a) verified tapeout status and TSMC capacity reservation
              documentation; (b) terms of the Series B (participation rights, liquidation preference, anti-dilution
              provisions) and cap table clarity; (c) binding or LOI-stage customer commitments from at least one
              frontier AI lab; (d) independent silicon performance validation, even on early test chips; and (e) clarity
              on MGXONE pricing, power envelope, and total cost of ownership relative to Nvidia alternatives, which
              would allow an independent DCF anchor to replace the current option-value framework.
            claimRefs:
