  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >
              MatX operates in the AI accelerator chip market, specifically the sub-segment targeting large language
              model (LLM) training, reinforcement learning, and inference for large-parameter transformer models. The
              market includes spending by hyperscalers (Google, AWS/Amazon, Microsoft, Meta, Oracle), frontier AI labs
              (OpenAI, Anthropic, xAI, Cohere, Mistral), and large enterprises building proprietary LLM-based
              applications. The market explicitly excludes small-model inference, edge AI chips, convolution-optimized
              hardware (like vision chips), and recommender-system accelerators. Status-quo substitutes include NVIDIA's
              H100/H200/B200 GPU line (dominant incumbent), AMD's MI300X/MI350 series, hyperscaler-proprietary chips
              (Google TPU, Amazon Trainium, Meta MTIA, Microsoft Maia), and to a lesser degree, FPGA-based acceleration
              for select workloads. The AI training chip sub-market, defined narrowly as chips specifically optimized
              for training at data center scale, was estimated at $9.72 billion in 2026 by one analyst, while the
              broader AI accelerator chip market (training and inference combined at data center scale) ranges from
              $15-56 billion depending on analyst methodology, scope, and inclusion of edge/embedded workloads. The
              broadest "all AI chips" definition, including CPUs and inference at edge, exceeds $100 billion. For MatX's
              diligence purposes, the relevant addressable market is data center AI training and large-model inference,
              estimated conservatively at $15-22 billion in 2026 and growing toward $51-100 billion by 2030-2032.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: Market Sizing and TAM/SAM/SOM Analysis
        blocks:
          - type: paragraph
            body: >
              Multiple analyst firms have estimated the global AI accelerator chip market in 2026. IntelMarketResearch
              estimates the AI training chip market at $9.72 billion in 2026, growing to $31.89 billion by 2034 at a
              16.3% CAGR. The broader AI accelerator chip market is estimated at $15.3 billion (IntelMarketResearch),
              $22.8 billion (360iResearch), and $51.7 billion (StrategyMRC) in 2026 depending on scope. The widest
              market definition—all AI chips including GPUs, ASICs, FPGAs for both training and inference—was estimated
              at $56.5 billion (Business Research Company) to over $100 billion in 2026. Hyperscalers collectively
              committed over $600-725 billion to infrastructure in 2026, with approximately 60-75% targeting AI compute;
              at $15 billion for accelerator chips, AI chips represent roughly 2-3% of total AI capex, suggesting that
              hardware vendors must compete intensely for a share of a large but concentrated budget. MatX's serviceable
              addressable market (SAM) is estimated at approximately $9-15 billion in 2026, representing the large-model
              LLM training and prefill/decode inference segments at data center scale. The SOM (serviceable obtainable
              market) for MatX in 2027-2028 (first ship year) is highly dependent on how many frontier labs and
              hyperscalers evaluate new silicon from a first-time chip vendor—conservatively modeled at 1-5% of SAM
              given switching costs and ecosystem maturity risk. The AI chip market was growing at 23-31% CAGR through
              2030 per multiple analyst estimates. The training-specific segment is expected to grow faster than
              inference as model complexity scales.
