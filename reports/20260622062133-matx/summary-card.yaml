summary:
  headline: >-
    MatX is a technically credible but pre-de-risked bet on a frontier LLM training chip: exceptional founding team,
    $625M runway, and a differentiated architecture, but no silicon, no customers, and an undisclosed valuation make
    this a high-conviction speculative position contingent on 2027 tapeout execution.
