  - id: scenarios-and-return-profile
    title: Scenarios, Valuation Ranges, and Return Profile
    body: >-
      Three scenarios frame the plausible outcomes for MatX as a Series B investment. All valuation estimates below are author-constructed; they are not MatX company projections or confirmed by public filings.

      The bull case requires (i) MGXONE tapeout by Q1 2027 on schedule, (ii) independent benchmark validation of ≥5× throughput per dollar versus Nvidia H100, (iii) two or more signed hyperscaler or frontier-lab design wins generating $200M+ in annual revenue by 2028, and (iv) no significant competitive displacement from hyperscaler in-house ASICs. Under these conditions, a $3–5B post-money valuation in a Series C or strategic transaction, and a potential IPO or acquisition at $5–8B by 2029–2030, is plausible. The Cerebras trajectory demonstrates that a single major anchor customer can unlock this step-up. Probability signal: low (requires multiple concurrent positive outcomes in a highly competitive segment).

      The base case assumes a successful first-pass tapeout in 2027 with one signed early-access design win, modest initial revenue ($20–60M run rate), and a Series C raise at a $2–3B valuation. The implied return for a Series B investor at the estimated base-case entry ($1.5–2.5B post-money) would be approximately 1.2–2× over a four-to-five-year hold, with meaningful dilution from future rounds. This is a pedestrian hardware venture return without the bull-case scenario materializing. Probability signal: medium (depends on execution rather than market conditions).

      The bear case results from tapeout delay beyond Q1 2028, inability to differentiate sufficiently from Nvidia's software moat, or customer adoption significantly slower than expected. In this scenario, MatX faces a flat or down round at approximately $1.0–1.5B, potentially writing down Series B investors to below cost basis after dilution. SambaNova's trajectory from $5B to $2.4B mark illustrates how quickly value can erode. The risk of full capital loss is non-zero if the company fails to raise its next round. Probability signal: medium-low (the team and capital base provide real optionality, but hardware execution risk is structurally high).

      The probability-adjusted return profile for a Series B investor at the $1.5–2.5B base-case entry looks challenged at current entry prices. The asymmetry favors the bull case only if independent technical validation emerges within 12–18 months, at which point a follow-on position at a confirmed valuation becomes more defensible than committing to the full Series B price today.
