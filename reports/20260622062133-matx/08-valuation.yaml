  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis and Public Market Context
    body: >-
      No standard DCF or revenue-multiple methodology is applicable to MatX at this stage because the company is pre-revenue and pre-silicon. The only defensible valuation frameworks are (a) option-value and milestone-probability models, (b) comparable-round analysis against similar-stage AI chip peers, and (c) public-market anchor multiples for custom silicon at scale.

      Among AI chip startups, the most instructive comparable trajectory is Cerebras Systems. Cerebras raised a $1.1B Series G at an $8.1B post-money valuation in September 2025, then raised a $1B Series H at $23B in February 2026, and filed for an IPO in May 2026 targeting a ~$26.6B market cap. This step-up was driven by a large commercial contract with OpenAI (a $10B+ multi-year compute agreement) and demonstrated revenue. MatX has neither, which means it cannot command a Cerebras-equivalent multiple today; however, the Cerebras trajectory shows that a single hyperscaler anchor customer can unlock rapid valuation re-rating. Groq raised $640M at $2.8B in August 2024 and $750M at $6.9B in September 2025—a 2.5× step-up correlated with commercial scale (2M+ developer accounts). Tenstorrent raised $693M in a Series D at approximately $2.6B post-money, led by Samsung and Jeff Bezos's investment vehicle.

      At the adverse end, SambaNova raised $1.1B+ and was last valued at $5B in 2021. BlackRock subsequently marked down its SambaNova stake by 17%, implying a ~$2.4B value, and the company began exploring a sale in October 2025 after failing to close a new funding round. Acquisition talks with Intel stalled, and the company is now seeking $500M from strategic investors. SambaNova's experience shows that even well-capitalized AI chip startups can face severe valuation compression and liquidity risk if commercial momentum does not develop within approximately four years of peak funding.

      Marvell Technology, a public semiconductor company with a large custom-silicon and AI accelerator business for hyperscalers, provides a steady-state public anchor: custom silicon companies at scale trade at approximately 10–15× EV/Revenue in the public markets. AI infrastructure companies broadly traded at a median of approximately 23× EV/Revenue in Q1 2025 per analyst data, while LLM vendors commanded 44×. For MatX to justify a $2.5B valuation at Marvell-level multiples, it would need approximately $170–250M in revenue run rate—a bar it cannot clear until well after first silicon ships. The scenario framework in the next section maps the key assumptions.
