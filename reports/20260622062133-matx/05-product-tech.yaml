  - id: trust-compliance-gaps
    title: "Trust, Compliance, and Software Ecosystem Gaps"
    body: >-
      MatX has made no public statements about software security posture, firmware validation
      procedures, export-control compliance, or customer workload isolation. The company's stated
      target customers—frontier AI labs training and serving models with more than 100 billion
      parameters—operate under stringent security requirements, yet MatX has announced no SOC 2,
      ISO 27001, or equivalent certifications for its chip or software. The software stack (seqax) is
      explicitly described as a research codebase, not a production compiler: no CUDA-equivalent
      driver stack, MLIR backend, PyTorch front-end integration, or model-portability layer has been
      publicly announced. This gap is structurally significant because frontier labs have invested
      years optimising training and serving pipelines for NVIDIA's CUDA ecosystem; migrating to a
      new hardware target requires either a CUDA-compatible compilation path or a willingness to
      rewrite production code in JAX. On export compliance, advanced AI chips are subject to U.S.
      Bureau of Industry and Security Export Administration Regulations; MatX's chip capability
      targets—maximising FLOPS and memory bandwidth for LLM training and inference—align with the
      chip specifications that have triggered export controls, yet no public compliance statement
      exists. MatX's manufacturing dependency on a single TSMC-class advanced-node foundry—
      inferred from industry norms, the Alchip partnership, and the absence of any public secondary
      foundry relationship—concentrates supply risk in a way that has no disclosed mitigation.
    claimRefs:
      - CE036
      - CE037
      - CE038
      - CE039
      - CE040
