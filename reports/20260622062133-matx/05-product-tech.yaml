company:
  name: MatX
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    MatX One is a pre-production ASIC built around a novel splittable systolic array that combines
    SRAM-first weight storage for ultra-low decode latency with HBM for long-context KV-cache support.
    The company's software co-design thesis—evidenced by seqax, leaky quantization, SMVA, SPIRe, and
    SD_NSA research publications—reflects deep TPU-lineage expertise, but no production compiler stack
    has been announced, leaving software ecosystem maturity as the decisive adoption risk. Tapeout is
    targeted within one year of the February 2026 Series B, with Alchip and Marvell as supply-chain
    investors; fabrication node and yield risk disclosures remain absent from public record.

sections:
  - id: chip-architecture
    title: "MatX One: Chip Architecture and Memory Hierarchy"
    body: >-
      The MatX One is an application-specific integrated circuit (ASIC) engineered from first
      principles for large language model workloads. Its defining architectural innovation is the
      splittable systolic array, which preserves the energy and area efficiency of large systolic
      arrays—the same architectural principle underlying Google's TPU lineage, where both founders
      worked—while extending high utilization to smaller matrices with flexible shapes. This design
      eliminates the GPU's general-purpose overhead (geometry shading, video decode, rasterisation,
      raster order groups) that occupies die area and power budget irrelevant to LLMs. The memory
      hierarchy reflects a deliberate two-tier philosophy: model weights reside primarily in on-chip
      SRAM for low-latency weight access, enabling more than 2,000 output tokens per second on large
      100-layer mixture-of-experts (MoE) models; KV-cache entries are stored in high-bandwidth memory
      (HBM), providing long-context support without the bandwidth penalty that SRAM-only designs face
      at sequence lengths beyond a few thousand tokens. The chip targets training, RL, inference
      prefill, and decode workloads exclusively, covering large dense and MoE models with no stated
      upper limit on model size. The scale-up interconnect—described as the highest of any announced
      product—supports cluster configurations spanning hundreds of thousands of chips, which is a
      prerequisite for frontier-lab customers running >100B-parameter training runs.
    claimRefs:
      - CE001
      - CE002
