  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Post-Series B valuation has not been publicly disclosed by MatX or any authorized source.
    whyItMatters: >-
      Without a disclosed valuation, any investment analysis must rely on comparable-company estimates with high
      uncertainty, potentially understating or overstating dilution and return potential.
    diligencePath: >-
      Request cap table and term sheet directly from company; cross-reference with secondary market data from Caplight,
      PitchBook, or Forge.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: blocking
    topic: customers
    missingEvidence: No customer contracts, LOIs, or pilot agreements with AI labs or hyperscalers have been disclosed.
    whyItMatters: >-
      A chip company that reaches tapeout with no customer pipeline faces a severe go-to-market risk; customers need
      long lead times to validate new silicon.
    diligencePath: >-
      Ask management directly about customer engagements; monitor press releases for customer announcements in H2 2026
      or 2027.
    relatedQuestionRefs:
      - QO023
