company:
  name: MatX
chapter:
  number: 7
  title: Risks
  summary: "MatX faces compounding regulatory (BIS/EAR, CHIPS guardrails, CFIUS), supply-chain (TSMC single-source, HBM concentration, Taiwan geopolitical), IP/patent (thin portfolio vs. incumbent prior art), talent (key-person risk, semiconductor workforce shortage), and execution (tapeout, software-stack, capital re-raise) risks. Each risk domain has identifiable mitigations and monitorable kill criteria, but most remain partially or fully unhedged for a pre-revenue startup."
sections:
  - id: regulatory-export-legal
    title: Regulatory, Export-Control, and Legal Risk
    body: "MatX operates at the intersection of advanced semiconductor design and artificial intelligence—two domains facing escalating U.S. regulatory and legal constraints. The Bureau of Industry and Security (BIS) administers the Export Administration Regulations (EAR) under 15 C.F.R. Parts 730–774, governing dual-use items including AI accelerators. The October 2023 BIS rule (2023-22714) and January 2024 companion rule introduced new performance thresholds for advanced computing chips destined for countries of concern—China, Russia, and a growing Tier D list—creating ongoing compliance obligations for chip designers whose products can exceed these thresholds. MatX's target customers include frontier AI labs and hyperscalers, some of which operate globally; any third-country diversion by a distributor or reseller could expose MatX to EAR liability. The CHIPS and Science Act imposes 10-year guardrail provisions on recipients of federal funding, restricting capacity expansion in geopolitically sensitive regions. Should MatX ever access CHIPS grants or loans, it would face binding restrictions on its supply-chain strategy. CFIUS reviews acquisitions and certain investments in critical-technology companies with AI chip exposure; any future foreign-connected investor could trigger mandatory filing obligations under the Part 800/802 rules, adding complexity and delay to fundraising rounds. ITAR, administered by DDTC, could apply if MatX's chips are used in defense-adjacent applications. The EFF underscores that export-control regimes impose compliance burdens that evolve faster than startup legal infrastructure can adapt, creating latent litigation exposure. MatX's thin disclosed legal team relative to its technical ambition amplifies compliance risk. Peer AI chip startups (Groq, Cerebras, Tenstorrent) face broadly comparable EAR exposure as U.S.-based AI accelerator designers, but the compliance risk is material to all of them."
    claimRefs:
