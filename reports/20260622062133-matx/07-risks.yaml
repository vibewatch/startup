  - id: supply-chain-manufacturing
    title: Supply-Chain, Manufacturing, and Single-Source Risk
    body: "MatX's entire production pathway runs through a tight chain of single-source dependencies that present asymmetric risk. TSMC manufactures over 90% of chips at 5nm and below globally; there is no commercially viable alternative for the N2 or N3 nodes MatX requires for its LLM training and inference accelerators. TSMC's most advanced nodes are allocated predominantly to Apple (iPhone SoC), NVIDIA (Blackwell series), AMD (EPYC/Instinct), and hyperscaler custom chips—leaving startup-tier customers with limited and unpredictable capacity windows. CSET analysis identifies Taiwan's dominant role in advanced semiconductor production as the foremost geopolitical chokepoint in the global supply chain; any Taiwan Strait disruption would halt production of essentially all competitive AI chips industry-wide. HBM memory—required for high-throughput AI accelerators—is produced exclusively by SK Hynix, Samsung, and Micron, with SK Hynix holding over half the market. Micron's HBM3E product brief confirms that HBM requires specialized 3D stacking and through-silicon-via technology unavailable outside these three incumbents, making substitution impractical within a 1–2 year horizon. ASML's EUV lithography equipment—itself subject to Dutch and U.S. export controls—is the sole tool capable of manufacturing sub-5nm chips; ASML's concentrated production and export restrictions further tighten the foundry availability picture. CSET's analysis of China's semiconductor manufacturing equipment progress notes that China remains 5–10 years behind the EUV frontier, sustaining TSMC's strategic position but also sustaining Taiwan's vulnerability. Advanced-node wafer costs at N2 are estimated at $30,000–$35,000 per wafer versus ~$20,000 for N5, compressing startup unit economics before yield losses are factored in. The SIA confirms no viable near-term alternative to Taiwan (TSMC) and South Korea (SK Hynix) for leading-edge logic or HBM production."
    claimRefs:
      - CR013
