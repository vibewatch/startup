callouts:
  - calloutType: risk
    title: "TSMC Single-Source Dependency Is the Highest-Severity Supply Chain Risk"
    body: "There is no commercially viable alternative foundry for TSMC's N2/N3 advanced nodes. A Taiwan Strait disruption, TSMC capacity denial, or yield crisis would halt MatX's production entirely, with no near-term fallback. This risk is shared across the AI chip industry but is acutely severe for a startup with no pre-production silicon and no alternative process-node qualification."
    claimRefs:
      - CR013
      - CR015
      - CR020

  - calloutType: risk
    title: "Patent Portfolio Thinness Creates Material IP Litigation Exposure"
    body: "MatX's thin disclosed patent portfolio leaves it exposed to freedom-to-operate challenges and litigation from NVIDIA, AMD, or Google as it enters commercial markets. AI chip design involves highly contested IP territory across dataflow, quantization, sparsity, and compiler techniques. Defensive patent prosecution and independent FTO analysis should be treated as pre-launch requirements, not post-launch remediation."
    claimRefs:
      - CR023
      - CR026

  - calloutType: recommendation
    title: "Pre-Investment Legal Audit Should Cover BIS, CFIUS, and Patent FTO"
    body: "Investors should require a pre-investment legal audit covering: (1) BIS ECCN classification and export license requirements for MatX's chip specifications; (2) CFIUS investor screening for existing and prospective foreign-connected limited partners; (3) freedom-to-operate analysis of MatX's key architectural claims against NVIDIA, AMD, and Google patent portfolios. These diligence steps cannot be deferred post-close without creating material undisclosed liability."
    claimRefs:
      - CR003
      - CR006
      - CR007

