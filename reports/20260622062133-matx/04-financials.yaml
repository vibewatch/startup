  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "pricing"
      missingEvidence: "MatX One chip ASP and rack system pricing; pricing schedule or indicative term sheet from management."
      whyItMatters: "Without pricing data, no revenue model, gross profit estimate, or unit economics analysis is possible. This is the single most critical missing financial input for underwriting."
      diligencePath: "Request pricing term sheet, LOI, or indicative ASP from MatX management through existing VC relationships or direct investor relations contact."
      relatedQuestionRefs: [QI004, QI006]

    - type: private-evidence-only
      severity: blocking
      topic: "gross margin"
      missingEvidence: "Gross margin target or COGS model; TSMC node selection and negotiated wafer pricing; HBM specification and procurement cost; yield and packaging assumptions."
      whyItMatters: "Without a COGS model, gross margin path is entirely speculative and investors cannot assess capital adequacy against revenue targets."
      diligencePath: "Obtain COGS model from management: TSMC node, negotiated wafer price vs. rack rate, HBM stacks per chip, yield assumptions, and advanced packaging cost structure."
      relatedQuestionRefs: [QI003, QI005, QI015]

    - type: private-evidence-only
      severity: material
      topic: "valuation"
      missingEvidence: "Post-Series B valuation, cap table structure, preference stack, liquidation preferences, and anti-dilution provisions."
      whyItMatters: "Without valuation, entry-price assessment and dilution modeling are impossible; comparable transaction analysis provides only a wide range ($2B–$10B+)."
      diligencePath: "Request cap table and Series B term sheet from company; cross-check against comparable rounds such as Etched at $5B."
      relatedQuestionRefs: [QI007]

    - type: private-evidence-only
      severity: blocking
      topic: "customer pipeline"
      missingEvidence: "Customer pipeline, signed LOIs, pilot agreements, or any indication of demand at the target ASP; no public evidence of customer relationships exists."
      whyItMatters: "Without customer evidence, revenue quality cannot be assessed and the risk of a demand gap at first delivery is unquantifiable."
      diligencePath: "Request anonymized pipeline report with deal stage, indicative volume, and pricing context from MatX management."
      relatedQuestionRefs: [QI006, QI016]

    - type: private-evidence-only
      severity: material
      topic: "nre cost"
      missingEvidence: "TSMC NRE agreement terms, mask cost, first-wafer volume commitment, and tapeout schedule; public estimates span $50M–$150M."
      whyItMatters: "The magnitude of the NRE commitment determines whether runway estimates are conservative or optimistic; it is the largest single uncertainty in capital adequacy analysis."
      diligencePath: "Obtain TSMC NRE agreement or LOI; confirm node selection, negotiated wafer price, volume commitment, and tapeout schedule milestone."
      relatedQuestionRefs: [QI003, QI025]
