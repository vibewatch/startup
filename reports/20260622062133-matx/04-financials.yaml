          to: revenue_recog
          label: "System delivered to customer"
        - from: revenue_recog
          to: gross_profit
          label: "Net of COGS"
    approximationNotes: "Revenue recognition policy undisclosed; gross margin estimate based on fabless industry benchmarks (40–70%); MatX One chip ASP is not public. Flow represents intended business model as described in company announcements."
