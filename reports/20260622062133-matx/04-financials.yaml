    title: MatX Revenue Model Bridge
    type: flow
    layout: standard
    summary: "How frontier AI lab demand flows through MatX's hardware sales model to revenue recognition and estimated gross profit."
    data:
      nodes:
        - id: demand
          label: "Frontier AI Lab Demand"
          detail: "LLM training and inference compute requirements; target: frontier labs and hyperscalers with large compute budgets"
        - id: procurement
          label: "Chip Procurement"
          detail: "Direct hardware purchase of MatX One chips; pricing undisclosed; primary benchmark is Nvidia B200 at $30–40K/chip"
        - id: rack_sys
          label: "Rack System Integration"
          detail: "Chips + HBM memory stacks + interconnects + thermal packaging; system ASP higher than chip-only but BOM increases proportionally"
        - id: revenue_recog
          label: "Revenue Recognition"
          detail: "Hardware-model: recognized upon delivery; no ratable SaaS component; first delivery targeted 2027; recognition policy undisclosed"
        - id: gross_profit
          label: "Gross Profit (Estimated)"
