company:
  name: MatX
chapter:
  number: 4
  title: Financials
  summary: >
    MatX is a pre-revenue fabless AI chip startup that has raised approximately $625M in total capital, including a $500M Series B in February 2026, with no disclosed revenue, pricing, or unit economics. The company's financial profile is dominated by structural unknowns: pricing relative to Nvidia B200's $30,000–$40,000 per chip is undisclosed, COGS will be driven by TSMC wafer costs (~$30,000/wafer at 2nm) and rising HBM3E/HBM4 memory prices (up ~20% for 2026), and monthly burn is estimated at $5M–$15M based on headcount proxies. The $625M capital base implies a runway of roughly 3–7 years pre-revenue, but this estimate narrows materially under realistic TSMC NRE and first-batch wafer commitments that could consume $50M–$150M in a concentrated 12-month window around the 2027 tapeout.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >
      MatX's revenue model is hardware-centric: the company intends to generate revenue through direct sales of AI accelerator chips and rack-level systems to frontier AI laboratories and hyperscalers. No software subscription layer, cloud-services offering, or licensing fee structure has been publicly described. This places MatX in the same direct-hardware revenue category as Nvidia's compute business, where revenue is recognized upon delivery of chips and systems rather than ratably over a contract term.

      No pricing has been publicly disclosed for the MatX One chip or any rack configuration. The absence of list pricing is standard for pre-revenue AI chip startups negotiating bespoke supply agreements with frontier labs. By comparison, Nvidia's B200 GPU is priced at approximately $30,000–$40,000 per chip in the open market, while Broadcom reported approximately 65% gross margin on its Q1 FY2026 AI chip revenue of $8.4 billion—illustrating the premium economics achievable in custom AI silicon at scale. MatX's positioning as a "best chips physically possible for LLM" rival to Nvidia implies a target average selling price in the same or higher range, but this cannot be verified without a disclosed pricing schedule.

      The company's total addressable revenue per customer sale depends on die yield, system packaging (HBM stacks, interconnects, thermal), and rack integration costs. At frontier lab deployment scales—hundreds to thousands of chips per customer—even a conservative ASP assumption of $20,000 per chip implies single-customer contract values in the hundreds of millions of dollars. However, no letter of intent, pilot agreement, or customer contract has been publicly announced. Revenue recognition for MatX will not be triggered until chips ship in 2027, making any revenue projection speculative for the 2026 underwriting period.

      GTM motion is direct-sales focused, targeting a small number of frontier AI labs with large compute procurement budgets. Sales cycles for custom AI silicon typically run 12–24 months from design engagement to first delivery. CAC proxies are unavailable since MatX has not disclosed customer relationships. The investor base includes Andrej Karpathy (former OpenAI/Tesla), Nat Friedman and Daniel Gross (NFDG, connected to frontier AI labs), and the Collison brothers (Stripe)—providing potential introductory channels but not constituting a disclosed customer pipeline.
    claimRefs: [CI001, CI002, CI006, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: cost-structure-and-cogs
    title: Cost Structure and COGS Benchmarks
    body: >
      MatX is a fabless semiconductor company: it does not own wafer fabrication equipment, reducing direct capex obligations but exposing it entirely to foundry pricing, capacity allocation, and scheduling risk. TSMC is the disclosed manufacturing partner, and the MatX One's process node has not been publicly confirmed. Given the company's emphasis on maximum LLM performance—targeting the highest FLOPS/mm2—the design is most likely targeting TSMC's N2 (2nm) or N3 (3nm) node, both of which carry significant and rising wafer costs.

      TSMC N2 wafer pricing is confirmed at approximately $30,000 per wafer, representing a 10–20% premium over N3 pricing. The forthcoming A16 (1.6nm) node is rumored at up to $45,000 per wafer, a roughly 50% premium over N2. Additionally, TrendForce reported that TSMC is eyeing a 3nm price hike of up to 15% in 2H 2026, with a further 5–10% increase expected in 2027, driven by sustained AI chip demand from Nvidia, AMD, Broadcom, and hyperscaler in-house ASIC programs. These pricing dynamics directly determine MatX's floor COGS before any yield or packaging considerations.

      High-bandwidth memory is the second major COGS driver. AI training accelerators require multiple HBM stacks per chip. HBM3E supply prices rose approximately 20% for 2026 contracts due to strong demand from Nvidia H200 and ASIC-based chip programs, and 12-layer HBM4 units are expected to exceed $600 each. Memory is now estimated to represent approximately 30% of total hyperscaler AI data center capex in 2026, up from roughly 8% in 2023—a structural cost inflation trend that will flow through to the bill of materials for any vendor sourcing HBM. Long-term supply agreements from Samsung and SK Hynix increasingly require advance payments of 10–30% of contract value, tightening working capital for memory procurement.

      For a typical fabless AI chip company at production maturity, wafer and memory together represent approximately 40–60% of COGS, implying gross margins of 40–60% at volume. Best-in-class operators like Broadcom achieve approximately 65% gross margin on AI chip revenue, while Marvell's annual reports confirm AI/data center as its most profitable growth segment. MatX, as a new entrant without TSMC volume commitments, will face higher per-wafer rack rates than preferred customers in initial production runs, and NRE costs for tapeout at advanced nodes typically range from $50M to $150M before a single chip ships.
    claimRefs: [CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI029, CI030]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: capital-adequacy-and-runway
    title: Capital Adequacy and Runway
    body: >
      MatX has raised approximately $625M across three financing rounds: a seed round of approximately $25M in late 2023 or early 2024, a Series A of approximately $80–100M announced in November 2024, and a $500M Series B led by Jane Street and Situational Awareness LP, closed on February 24, 2026. No debt financing, credit facilities, or secondary transactions have been disclosed. The Series B represents by far the dominant tranche and provides the primary capital runway.

      With approximately 100 employees as of the Series B, and assuming all-in employment costs of $50,000–$100,000 per person per month (inclusive of salaries, equity compensation, benefits, office, and equipment), the employee-level burn component alone is approximately $5M–$10M per month. Adding TSMC design service fees, EDA software licenses, IP licensing, prototype wafer runs, and infrastructure costs brings total estimated monthly burn to $5M–$15M. Against an estimated cash position of $500M–$600M (accounting for spending since the Series A close), this implies a runway of approximately 33–83 months from the Series B—roughly 3 to 7 years.

      However, this range does not capture the concentrated capital event represented by the MatX One tapeout. A single advanced-node tapeout at TSMC can consume $50M–$150M in NRE, mask sets, and engineering costs. MatX has publicly committed to completing tapeout within one year of the February 2026 Series B announcement, implying a concentrated capital draw between mid-2026 and Q1 2027. Initial production wafer runs at $30,000 per wafer (N2) for yield characterization would require hundreds of wafers, adding further capital exposure. If MatX's tapeout and initial manufacturing commitment totals $100M–$200M, actual runway narrows to approximately 20–50 months from February 2026—still adequate in the base case, but with limited margin for schedule delays.

      The strategic composition of the Series B syndicate provides some risk mitigation. Marvell Technology's participation may confer supply-chain relationships that reduce TSMC NRE exposure through design services support, and Alchip's inclusion signals potential turnkey ASIC manufacturing assistance. No formal supply agreements have been disclosed, however, and these relationships remain speculative advantages. The next-round trigger for MatX is most plausibly successful tapeout and first silicon characterization—events not expected before 2027. If tapeout slips or first silicon underperforms, the company may require bridge capital before achieving revenue.
    claimRefs: [CI002, CI003, CI004, CI005, CI025, CI026, CI027, CI028, CI029, CI030, CI031, CI038]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: public-traction-and-financial-gaps
    title: Public Financial Traction and Disclosure Gaps
    body: >
      MatX's financial disclosure as of June 2026 is extremely limited, consistent with a pre-revenue private company at Series B stage that has not yet shipped product. No revenue, ARR, GMV, unit economics, gross margin, customer count, or utilization metric has been publicly disclosed. The confirmed financial data points are: total capital raised (~$625M), Series B size ($500M), Series B close date (February 24, 2026), lead investors (Jane Street, Situational Awareness LP), strategic investors (Marvell Technology, Alchip), headcount (~100), and the tapeout timeline (within one year of Series B). The post-Series B valuation has not been disclosed.

      Financial benchmarks from comparable public companies provide limited analogy due to scale differences. Broadcom's AI chip revenue reached $8.4 billion in Q1 FY2026 at approximately 65% gross margin, and the company projects AI revenue exceeding $100 billion in FY2027. Marvell Technology's SEC-filed annual reports confirm AI and data center as its largest and fastest-growing revenue segment, demonstrating the monetization scale achievable in custom AI silicon once a customer base is established. The 2026 HBM market is projected at $54.6 billion by BofA, up 58% year-over-year, with Goldman Sachs forecasting 82% HBM demand growth from ASIC-based chips—illustrating the broader market's scale but not providing MatX-specific evidence.

      The financial evidence gap for MatX is severe and structural. An investor cannot underwrite chip pricing, gross margin, CAC, working capital cycle, customer concentration, or revenue recognition methodology without direct access to management-provided financial projections, pricing term sheets, TSMC NRE agreements, and customer pipeline data. Public evidence cannot bridge this gap—it is entirely a private information exercise. The diligence requirements detailed in the financial gaps table in this chapter define the minimum information set necessary before any investment decision.
    claimRefs: [CI006, CI007, CI008, CI009, CI023, CI024, CI034, CI035, CI036, CI037, CI039, CI040]
    tableRefs: [TI005]
    figureRefs: [FI003]

  - id: financial-verdict
    title: Financial Verdict
    body: >
      MatX presents an unusual financial risk profile for a hardware startup: $625M has been raised against zero public evidence of revenue, pricing, or customer traction. The financial verdict is therefore necessarily contingent—the Series B syndicate quality (Jane Street, Situational Awareness LP, Marvell, Alchip) provides institutional validation of the technology and business thesis, but no disclosed metric allows an independent financial underwriting.

      On the positive side, the capital base is substantial by AI chip startup standards. At estimated base burn of $5M–$15M per month, the available capital supports completion of the MatX One tapeout, first silicon characterization, and initial customer deployments without requiring a bridge round—provided TSMC NRE and first-batch costs stay within the $50M–$150M range. The strategic investor composition suggests potential preferential access to TSMC capacity and advanced packaging, which are the two most significant COGS risk factors.

      On the negative side, the financial risks are structural and compounding. Rising TSMC wafer costs (N3 up 15% in 2H 2026, N2 at $30,000/wafer), HBM memory inflation (HBM3E up ~20% for 2026, HBM4 exceeding $600 per unit), and TSMC capacity constraints (Chairman Wei: capacity "three times short" of AI demand) all increase the cost basis MatX will face in its first production run. These are market-level headwinds that no individual new-entrant startup can fully negotiate around without extraordinary purchasing scale or an established TSMC relationship. Broadcom and Marvell's participation may help at the margins, but year-one batch economics for MatX One will almost certainly be less favorable than the steady-state fabless benchmarks suggest.

      The minimum financial diligence requirement before underwriting is clear: MatX One chip ASP, TSMC node and NRE terms, COGS model with HBM specification, gross margin target, customer pipeline stage, and management's 18-month burn forecast. None of this is available from public sources; direct engagement with MatX management is necessary before any investment decision.
    claimRefs: [CI001, CI002, CI006, CI011, CI015, CI022, CI026, CI027, CI029, CI036, CI038, CI039, CI040]
    tableRefs: []
    figureRefs: []

