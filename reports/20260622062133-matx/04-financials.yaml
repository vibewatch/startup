callouts:
  - calloutType: risk
    title: Rising TSMC and HBM Costs Are Structural COGS Headwinds
    body: >
      TSMC wafer costs are increasing at every node MatX is likely to use: N3 up to 15% in 2H 2026, N2 at $30,000/wafer, and A16 potentially reaching $45,000. HBM3E prices have already risen approximately 20% for 2026 supply contracts, and 12-layer HBM4 units exceed $600. Memory now represents roughly 30% of total hyperscaler AI capex in 2026, up from 8% in 2023. These are market-level cost pressures that MatX, as a new entrant without volume commitments, cannot negotiate away. Year-one production economics are likely to reflect gross margins materially below the 40–60% fabless benchmarks, compressing the financial upside until volume scale is established.
    claimRefs: [CI012, CI013, CI015, CI017, CI019, CI039]

  - calloutType: risk
    title: TSMC Capacity Constraints Create Real Wafer Allocation Risk
    body: >
      TSMC Chairman C.C. Wei stated publicly that advanced-node capacity is approximately three times short of what major AI chip customers plan to consume. With Nvidia, AMD, Apple, Broadcom, and hyperscaler in-house ASIC programs all competing for constrained N2 and N3 capacity, MatX as a new-entrant startup without an established TSMC volume relationship faces genuine allocation risk. A wafer allocation delay would push the 2027 first-chip shipment target later, extending cash burn before any revenue is generated. Marvell's strategic investment may provide some relationship leverage with TSMC, but no formal wafer supply agreement has been publicly disclosed.
    claimRefs: [CI013, CI016, CI029, CI038]

  - calloutType: strength
    title: $625M Capital Base Provides Substantial Pre-Revenue Buffer
    body: >
      The $625M total raised gives MatX a long runway relative to most AI chip startups. At estimated base burn of $5M–$15M per month, the capital base supports approximately 3–7 years of operations before revenue is required. This runway is sufficient to complete the MatX One tapeout by Q1 2027, receive first silicon, characterize performance, and execute initial customer deployments—all without requiring a bridge round in the base case. The Series B syndicate quality (Jane Street, Situational Awareness LP) signals strong potential for follow-on support if needed, and the strategic participation of Marvell and Alchip reduces supply-chain risk at the margins.
    claimRefs: [CI002, CI004, CI025, CI026, CI027]

  - calloutType: assumption
    title: All Financial Projections Are Based on Industry Proxies, Not Disclosed Data
    body: >
      MatX has disclosed no pricing, no revenue, no burn rate, no cash position, and no unit economics. Every quantitative estimate in this chapter is based on: (a) headcount-based burn proxies, (b) TSMC and HBM pricing data from industry sources, (c) gross margin benchmarks from Broadcom and Marvell public filings, and (d) comparable transaction data. Estimates should be treated as order-of-magnitude analytical references only. Any investment decision requires direct engagement with MatX management and access to non-public financial information, including TSMC NRE terms, pricing schedules, customer pipeline, and board-level financial projections.
    claimRefs: [CI036, CI037, CI040]

