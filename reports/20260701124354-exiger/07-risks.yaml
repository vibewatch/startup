- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Escalation path
  - Action implication
  rows:
  - - Government concentration / procurement delay
    - Federal bookings mix, slipped task orders, delayed agency conversions
    - '>35% of new bookings tied to top three public-sector accounts or two consecutive quarters of material slippage'
    - CRO -> CFO -> board -> investment committee
    - Lower growth assumptions, demand concentration disclosure, or pause conviction until mix is transparent.
  - - AI / data accuracy liability
    - Customer escalation volume, adverse audit results, regulator inquiry
    - Any material enforcement inquiry or more than one major customer challenge to screening accuracy
    - CPO / CISO / GC -> CEO -> investment committee
    - Require QA metrics, indemnity posture, and remediation evidence before underwriting premium multiples.
  - - Acquisition integration drag
    - Missed integration milestones, duplicated SKUs, release regressions
    - Two missed roadmap milestones or a major rollback tied to acquired capability integration
    - CTO / COO -> CEO -> board
    - Haircut synergy assumptions and increase execution discount in valuation.
  - - Cyber/privacy control failure
    - Notifiable breach, FedRAMP impairment, DPA breach notice
    - Any customer-notifiable incident or change in FedRAMP standing
    - CISO / GC / CEO -> board -> investment committee
    - Stop process until RCA, remediation plan, and customer impact assessment are complete.
  - - Public-market / sponsor exit risk
    - Recap activity, financing delay, or weak public issue conditions
    - Sponsor-led liquidity action before disclosure readiness or soft growth into financing window
    - CFO / board -> investment committee
    - Widen required return, favor structured terms, or avoid if disclosure remains opaque.
  notes: Kill criteria are framed as monitorable events rather than broad concerns so the chapter distinguishes probability, severity, mitigation, and escalation responsibility.
