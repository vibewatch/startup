chapter:
  number: 7
  title: Risks
  summary: 'Exiger’s public file points to a real but evidence-conditioned risk profile: the top concerns are government and procurement concentration, AI/data accuracy liability under sanctions and forced-labor workflows, cyber/privacy control depth, and execution drag from integrating multiple acquisitions under sponsor ownership. FedRAMP authorization, contract vehicles, a public DPA, and channel breadth are meaningful mitigants, but they do not remove the need for concentration, quality-metrics, incident, and exit-readiness disclosure. The correct posture is to treat Exiger as commercially credible yet still vulnerable to timing, accuracy, and integration mistakes that could compress valuation support quickly.'
sections:
- id: risk-overview-and-prioritization
  title: Risk Overview and Prioritization
  body: 'Exiger’s public risk stack is not dominated by a single existential problem but by a cluster of linked exposures that can compound. The highest-probability commercial risks are competitive bundle pressure from larger platforms, procurement slippage in government and regulated enterprise accounts, and integration drag as multiple acquired data or mapping assets are absorbed into one operating platform. The highest-severity risks are different: a material error in sanctions, export-control, forced-labor, or privacy-sensitive screening can create direct customer liability and reputational damage, while hidden government concentration could make growth look more diversified than it really is. The retained sources also show real mitigation. FedRAMP authorization, a public DPA, contract-vehicle access, AWS Marketplace availability, and sponsor capital all indicate Exiger is not improvising its way through regulated markets. But those same signals show why the file needs caution: federal
    channels lengthen sales cycles, AI-led claims raise precision expectations, and sponsor ownership makes timing and exit conditions relevant before public metrics are fully disclosed.'
