  evidenceGaps:
  - type: missing-source
    severity: material
    topic: government concentration / partner dependency risk register
    missingEvidence: Audited revenue, bookings, and renewal concentration by federal agency, DIB account, and top customer.
    whyItMatters: The public record proves meaningful government footprint but does not quantify what share of growth or retention depends on it.
    diligencePath: Request customer and bookings concentration by sector, top-10 account mix, and federal vs commercial ARR split from management.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR003
  - type: access-blocked
    severity: material
    topic: regulatory / legal risk register and litigation diligence
    missingEvidence: PACER and key state-court docket results, outside counsel confirmation, and management representation on pending claims or investigations.
    whyItMatters: Free-web discovery does not clear legal-overhang risk where authoritative court records require dedicated searches and paid access.
    diligencePath: Run PACER party-name searches, check key state-court dockets, and obtain counsel representation letters before underwriting a clean legal file.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: operational / quality / security risk register
    missingEvidence: Current security incident history, audit certifications beyond FedRAMP, model QA metrics, and documented false-positive or false-negative review rates.
    whyItMatters: Without control evidence or quality metrics, investors cannot determine whether Exiger’s AI and data claims translate into defensible operational precision.
    diligencePath: Request SOC reports, incident logs, red-team or penetration-test summaries, and product-level precision or exception-review metrics.
    relatedQuestionRefs:
    - QR012
    - QR024
    relatedTableRefs:
    - TR002
