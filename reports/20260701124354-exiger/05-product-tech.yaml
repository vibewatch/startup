tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - 1Exiger supply-chain workspace
    - Procurement, supply chain, compliance teams
    - Clearly merchandised and broadly evidenced
    - Unifies supplier, part, material, and risk views in one workspace rather than a point alert feed
    - Need public module-by-module architecture and SLA evidence
  - - DDIQ due diligence engine
    - Risk, compliance, onboarding, KYC analysts
    - Mature legacy product surface
    - AI/NLP-driven diligence profiles aggregate watchlists, premium news, open web, and proprietary lists with configurable risk rules
    - Need public precision/recall and workflow-level benchmark disclosure
  - - 1ExigerAI agentic execution layer
    - Supply chain, procurement, and operations leaders
    - Newer 2026 flagship narrative
    - Moves from insight to execution with human-plus-AI routing, centralized workflows, and quantified use-case claims
    - Need transparent governance metrics for explainability, drift, and approval thresholds
  - - WorldCompliance-backed screening data
    - Compliance and sanctions teams
    - External data asset, not Exiger-owned IP
    - Structured sanctions, enforcement, adverse-media, and ownership data expands Exiger’s compliance breadth and lowers manual screening friction
    - Need contract-level visibility into how much workflow quality depends on external data freshness and licensing
  - - XSB / Digital Thread & Parts Intelligence
    - Engineering, logistics, acquisition, sustainment teams
    - Strategic differentiator with specific data assets
    - Adds part-level and document-to-data intelligence, SWISS API potential, and 100M+ part coverage beyond entity-only risk tools
    - Need evidence of how deeply XSB stack is integrated into the core UI and data model
  - - Supply Dynamics / SDX multi-tier mapping
    - Manufacturing, sourcing, and industrial-base teams
    - Strategic differentiator with older but concrete integration story
    - Adds real-time item-level visibility, tier-n mapping, and raw-material detail that strengthens Exiger’s digital-thread claim
    - Need current proof of commercial availability, performance, and adoption after the 2022 acquisition
  - - Versed AI multi-tier visibility
    - Supply-chain strategy and resilience teams
    - Added capability with thinner public operational evidence
    - Adds AI-driven mapping of complex n-tier networks and automated BOM creation from public and open-source content
    - Need public benchmarks on mapping accuracy, refresh cadence, and false-positive rates
  - - ORCA-branded surface
    - Current and prospective Exiger buyers
    - Publicly ambiguous in the 2026 file
    - If ORCA still exists, it is not surfaced as a clearly separate public product page in the reviewed materials, which suggests branding consolidation into broader 1Exiger language
    - Need product taxonomy clarification from Exiger to avoid over-claiming standalone capability
  notes: Status reflects public evidence depth and commercialization clarity, not a private architecture review or customer-satisfaction audit.
