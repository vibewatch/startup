- id: differentiation-maturity-and-technical-risks
  title: Differentiation, Maturity, and Technical Risks
  body: 'The moat case is strongest where incumbents stop at entity screening or generic supplier scores. Exiger now has a more granular story: engineering-document extraction, part-attribute intelligence, multi-tier mapping, embedded Snowflake workflows, and procurement-oriented execution paths such as alternative sourcing or directed-buy. That is a materially different technical proposition from a sanctions database or adverse-media feed alone. The risk is that Exiger’s public ambition around agentic and explainable AI outpaces the level of public engineering proof available for underwriting. The reviewed file does not publish precision and recall, false-negative rates, drift monitoring, fairness testing, or detailed override and audit logs for AI decisions. Pricing remains opaque, ORCA nomenclature is unresolved in public packaging, and the company does not publish the kind of reference architecture or SLA history that would simplify diligence on deployment effort. Exiger therefore looks
    like a differentiated, data-rich workflow platform, but one that still needs deeper diligence on black-box risk, upstream data quality, and implementation complexity before buyers should assume low-friction adoption.'
