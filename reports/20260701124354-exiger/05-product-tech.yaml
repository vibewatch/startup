- id: deployment-trust-and-developer-signal
  title: Deployment, Trust, and Developer Signal
  body: 'Exiger’s deployment evidence is stronger than its public model-governance evidence. The company has concrete channel and control markers: 1Exiger is generally available in AWS Marketplace, Exiger Federal Cloud appears as FedRAMP Certified Class C (Moderate) in the FedRAMP Marketplace, and Exiger says regulated integrations run in that authorized environment alongside ISO 27001 and SOC 2 Type II controls. Carahsoft gives additional public-sector distribution support. The developer signal is not open-source in the usual sense, but the hiring surface is still informative. Current roles point to Snowflake architecture, AWS, APIs and data pipelines, CI/CD, Kubernetes, AI and ML analytics, and implementation managers who coordinate complex client deployments. A Built In role tied to Exiger’s XSB surface adds Java web apps, RESTful services, relational databases, Docker, and NIST or FedRAMP experience. Taken together, that suggests a real secure SaaS and data-platform footprint—but also
    a product that is unlikely to be frictionless for buyers to deploy, tune, and govern without meaningful services and customer-operating alignment.'
