  evidenceGaps:
  - type: missing-source
    severity: minor
    topic: orca-branding
    missingEvidence: A current official ORCA module page, archived product taxonomy, or product-management clarification that explains whether ORCA still exists as a distinct surface or has been folded into 1Exiger branding.
    whyItMatters: Outside buyers and investors can misread breadth and roadmap maturity when legacy or internal product names no longer map cleanly to public packaging.
    diligencePath: Ask Exiger product leadership for a current module taxonomy and a crosswalk from legacy names to the 2026 commercial surface.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: model-governance-metrics
    missingEvidence: Precision, recall, false-negative, hallucination, fairness, drift, and override-rate metrics for the AI workflows that Exiger markets as agentic or explainable.
    whyItMatters: These metrics determine whether Exiger’s public AI narrative is operationally trustworthy in regulated and high-stakes workflows, especially where false negatives or opaque recommendations can create compliance exposure.
    diligencePath: Request model-governance dashboards, validation reports, red-team results, and customer-facing explainability screenshots for representative workflows.
    relatedQuestionRefs:
    - QE022
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: implementation-observability
    missingEvidence: Reference architectures, integration playbooks, deployment-time benchmarks, uptime history, and customer examples showing how much implementation work is required per module.
    whyItMatters: Implementation burden can determine time-to-value, services intensity, and margin quality as much as raw product capability in enterprise and government software.
    diligencePath: Request solution-architecture documentation, standard deployment plans, incident summaries, and post-implementation case studies segmented by module and customer type.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
