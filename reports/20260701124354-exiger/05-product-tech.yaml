- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - What it supports
  - Gap
  rows:
  - - FedRAMP Moderate / FedRAMP Certified listing
    - Concrete and independently listed
    - Exiger Federal Cloud for government and DIB workflows
    - Secure deployment and interoperability claims for regulated programs
    - Need module-level boundary documentation and inherited-control detail
  - - ISO 27001 and SOC 2 Type II claims
    - Company-claimed and current in public materials
    - Company-wide trust posture referenced in supply-chain and FedRAMP materials
    - Supports baseline security and control maturity narrative
    - Need public certificates, dates, and service-scope mapping per module
  - - OpenCorporates provenance and audit trail
    - Concrete partner case-study evidence
    - Entity verification inside DDIQ with links back to official company registers
    - Reduces manual verification burden and supports defensible audit trails
    - Need current scale disclosure and regional coverage exceptions in 2026
  - - WorldCompliance structured profiles and update cadence
    - Concrete external technical-doc evidence
    - Sanctions, enforcement, ownership, PEP, and adverse-media data used in screening workflows
    - Improves structured screening breadth and timeliness for compliance use cases
    - Need clarity on how Exiger handles upstream source errors or conflicting records
  - - Roles, permissions, and human-plus-AI routing
    - Company-claimed and visible in 1ExigerAI messaging
    - Workflow execution, case handling, and reviewer assignment
    - Suggests governance hooks exist beyond pure black-box automation
    - Need public evidence on explainability UX, override logging, and approval policies
  - - Model governance metrics
    - Publicly incomplete
    - Would cover precision, recall, drift, fairness, and hallucination controls
    - Most important missing trust layer for underwriting agentic AI claims
    - Public materials reviewed do not disclose benchmark, red-team, or fairness dashboards
  notes: 'Trust evidence is asymmetrical: deployment controls are more visible than model-governance metrics. The last row intentionally records that asymmetry as a diligence gap, not as a hidden assumption.'
