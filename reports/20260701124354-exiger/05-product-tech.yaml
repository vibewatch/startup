chapter:
  number: 5
  title: Product & Technology
  summary: 'Exiger’s product stack looks more like a workflow platform than a screening point tool: the public file supports real breadth across DDIQ, 1Exiger, 1ExigerAI, world-class supply-chain data assets, and regulated deployment pathways such as FedRAMP and AWS Marketplace. The clearest differentiation is the data moat created by Supply Dynamics, XSB, Versed AI, and external verification or sanctions feeds, while the biggest technical diligence gaps remain explainability metrics, API and SLA transparency, ORCA nomenclature clarity, and the implementation burden implied by the current hiring and deployment surfaces.'
sections:
- id: platform-surface-modules-and-workflow
  title: Platform Surface, Modules, and Workflow
  body: 'Exiger’s product file now reads as a platform family rather than a single diligence database. The public packaging clusters around 1Exiger and 1ExigerAI for supply-chain execution, DDIQ for due diligence and compliance, and adjacent surfaces such as software supply chain security. DDIQ is still the cleanest evidence-backed workflow: it ingests watchlists, premium news, open web, and proprietary lists, then organizes the result with configurable risk rules and audit-ready profiles. 1ExigerAI pushes the story from analysis toward action by claiming human-plus-AI workflow routing, centralized case activity, and quantified operating outcomes such as signal-noise reduction, parts normalization, and country-of-origin mapping. OpenCorporates and WorldCompliance matter here because they show that Exiger is not only surfacing proprietary graphs; it also plugs external verification and sanctions data into the same motion. What the public file does not cleanly do is explain ORCA as a standalone
    surface, which leaves one branding thread unresolved for outside buyers.'
