- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Exiger solution
  - Measurable benefit
  - Limitation
  rows:
  - - Third-party onboarding and counterparty due diligence
    - Verify entity identity, screen adverse information, and document risk rationale
    - DDIQ plus OpenCorporates-backed verification and configurable risk rules
    - More consistent diligence files and an Exiger-claimed >80% reduction in downstream false positives from better verification
    - Public evidence is stronger on workflow narrative than on audited precision or recall
  - - Continuous supplier and sanctions monitoring
    - Batch screen suppliers, customers, or agents against sanctions, enforcement, and adverse media
    - WorldCompliance-backed screening combined with Exiger monitoring and case workflows
    - Faster updates, more structured profiles, and lower manual review for large populations
    - Output quality still depends on third-party data quality and customer triage policy
  - - Multi-tier supplier mapping and disruption response
    - Map dependencies, identify critical sub-tiers, and find alternates when disruption hits
    - 1Exiger plus Supply Dynamics, Versed AI, and XSB-derived data assets
    - Richer part-, material-, and supplier-level visibility with directed-buy or alternative-sourcing paths
    - Public materials do not disclose production latency, coverage error rates, or customer onboarding effort
  - - Engineering-document and parts analysis
    - Extract part requirements from static PDFs and compare alternatives or obsolescence risk
    - Digital Thread and Parts Intelligence plus XSB graph assets
    - Turns dead-text engineering files into machine-readable data exportable to downstream systems
    - Need proof on throughput, accuracy, and how often humans must correct extracted data
  - - Regulated public-sector supply-chain operations
    - Operate inside security-constrained federal workflows with procurement and compliance needs
    - FedRAMP-authorized Exiger Federal Cloud, Carahsoft channel, and AWS-enabled distribution
    - Supports secure deployment paths and broader federal interoperability claims
    - Public file does not provide agency-specific implementation timelines or reliability metrics
  notes: Benefits combine official outcome claims with third-party corroboration; they should be read as workflow potential rather than audited ROI for every customer.
