- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Data ingestion and integration layer
    - Ingest ERP, PLM, S2P, watchlist, news, and proprietary customer data through open APIs and AI-driven ETL
    - Customer system quality, connector coverage, and identity resolution across source systems
    - Messy source data or narrow connector coverage can raise implementation time and weaken output quality
  - - Entity and compliance intelligence layer
    - Verify subjects and enrich them with company, sanctions, enforcement, ownership, and adverse-media records
    - OpenCorporates, WorldCompliance, and other external data providers
    - Incomplete, stale, or mis-matched external records can create false positives or false negatives
  - - Supply-chain graph and parts-intelligence layer
    - Map suppliers, parts, materials, documents, and multi-tier relationships across engineering and procurement contexts
    - Exiger’s proprietary graph plus XSB, Supply Dynamics, and Versed AI data assets
    - Graph scale is a moat, but deep dependency on proprietary data curation can obscure explainability and refresh mechanics
  - - Decisioning and workflow layer
    - Prioritize risks, recommend actions, route cases, and coordinate human or AI execution
    - 1ExigerAI rules, permissions, case activity, and customer operating playbooks
    - Agentic workflow claims outpace public governance detail on thresholds, override logic, and model monitoring
  - - Deployment and security layer
    - Run commercial and public-sector environments across AWS, FedRAMP cloud, and embedded Snowflake contexts
    - AWS distribution, FedRAMP controls, customer cloud architecture, and secure interoperability
    - Secure deployment evidence is real, but public materials still lack detailed reference architectures and SLA history
  notes: This is an operating-model reconstruction from public materials, not a packet capture or architecture review. It highlights where third-party dependencies and governance risk likely concentrate.
