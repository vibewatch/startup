evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-branding-opacity
    missingEvidence: >-
      A current Exiger product map or roadmap that explicitly states whether ORCA and WorldCompliance remain active
      standalone brands, are sunset, or have been fully folded into 1Exiger.
    whyItMatters: >-
      The user specifically asked to test those product names, and public-facing materials reviewed here do not cleanly
      answer that question.
    diligencePath: >-
      Ask product leadership for a current product taxonomy and customer migration map covering legacy compliance and
      screening modules.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-control
    missingEvidence: >-
      A current board roster, cap table summary, and investor-rights overview after the 2023 Carlyle/Insight majority
      investment.
    whyItMatters: >-
      Control, board composition, and consent rights shape decision-making, exit optionality, and founder-management
      autonomy.
    diligencePath: >-
      Request the latest board list, investor rights agreement summary, and ownership table from management or the data
      room.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: goldman-customer-proof
    missingEvidence: >-
      A direct customer announcement, case study, or customer-reference permission that confirms Goldman Sachs is a
      current Exiger customer.
    whyItMatters: >-
      Named-tier-one financial-institution validation can materially affect confidence in Exiger’s bank penetration, but
      unsupported logo inflation would degrade diligence quality.
    diligencePath: >-
      Ask management for named bank references, redacted MSA evidence, or customer-reference call availability beyond
      SMBC and anonymized bank case studies.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: arr-disclosure
    missingEvidence: >-
      A board deck, investor update, or audited metric pack that states current ARR and reconciles it to any reported
      revenue run rate.
    whyItMatters: >-
      The company’s valuation story is easier to assess with a current recurring-revenue base than with one
      interview-based revenue estimate.
    diligencePath: Request monthly recurring revenue and ARR bridge data, ideally with historical cohorts and by-segment composition.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      A fuller internal chronology showing every major product, hiring, partnership, and contract milestone so the
      public timeline can be checked for omissions.
    whyItMatters: >-
      The milestone table is intentionally selective, and a more complete chronology would help confirm whether
      important commercial or governance events are absent from the public record.
    diligencePath: >-
      Request a board-approved company timeline or investor-history deck and reconcile it against the public press
      archive.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: exiger-serviceable-market-sizing
    missingEvidence: >-
      A management-quality breakout showing how Exiger overlaps TPRM, SCRM, sanctions screening, and defense visibility
      without double counting.
    whyItMatters: >-
      Without overlap-adjusted category data, any public TAM or SAM becomes either too broad or falsely additive, which
      directly weakens valuation precision.
    diligencePath: >-
      Request management segmentation by product module, buyer vertical, and workflow, then reconcile it against the
      public category lenses used in TM002.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: defense-visibility-tam
    missingEvidence: >-
      A public or customer-backed standalone market size for defense-industrial supply-chain visibility and provenance
      software.
    whyItMatters: >-
      The defense wedge looks strategically important, but public policy sources describe demand drivers without
      isolating monetizable software spend.
    diligencePath: >-
      Ask management for federal and defense-prime pipeline data, contract examples, and win rates tied specifically to
      DIB visibility use cases.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-segment-mix
    missingEvidence: >-
      Current pricing architecture, contract values, and revenue mix by compliance, supply-chain, financial-institution,
      and defense customer segment.
    whyItMatters: >-
      Public market growth only matters to valuation if Exiger can monetize the relevant workflows at acceptable ACV and
      renewal economics.
    diligencePath: >-
      Request price books, sample MSAs or order forms, segment revenue mix, and cohort retention or expansion data from
      management.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: classified-and-sensitive-deployment-patterns
    missingEvidence: >-
      Customer-validated evidence on how Exiger deploys into classified or otherwise highly sensitive defense and
      government environments.
    whyItMatters: >-
      Sensitive deployments can slow implementation, alter architecture, and cap how much of the defense wedge is
      immediately serviceable.
    diligencePath: >-
      Request cleared-customer references, architecture diagrams, and the controls used for evidence handling in
      sensitive programs.
    relatedQuestionRefs:
      - QM024
      - QM022
  - type: private-evidence-only
    severity: material
    topic: exiger-pricing
    missingEvidence: Current Exiger contract metric, price bands, and standard packaging terms for commercial versus federal accounts.
    whyItMatters: >-
      Bundle pressure is partly an economic question, and public materials do not reveal whether Exiger wins on ACV,
      usage logic, or ROI framing.
    diligencePath: Request a current pricing deck, sample order form, and at least one recent federal and one commercial proposal.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-win-rates
    missingEvidence: Independent named-account win and loss history versus D&B, LSEG, Coupa, Ivalua, Sayari, and Interos.
    whyItMatters: >-
      Public positioning explains where Exiger should win or lose, but underwriting needs actual proof of displacement
      and renewal behavior.
    diligencePath: >-
