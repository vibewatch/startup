      - number: '1.3'
        title: Capital Base, Scale Signals, and Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Exiger’s capital and scale story is credible, but it is not equally transparent on every point. Public
              disclosures confirm an $80 million Carrick growth investment in 2018 and a Carlyle/Insight majority
              investment in December 2023. Independent coverage later described the latter transaction at roughly a $1.2
              billion valuation, which is directionally consistent with Exiger’s current “unicorn” framing even though
              the company itself did not publicly spell out the exact valuation or investment amount. Customer traction
              is more supportable than economic detail. Current official materials repeatedly cite roughly 550-plus
              customers, 150 Fortune 500 relationships, and 60-plus government or Defense Industrial Base organizations.
              Named proof is also available: Oshkosh appears in supply-chain case work, SMBC is a documented bank
              customer for DDIQ, and the U.S. Army provides marquee federal validation. Scale metrics still require
              caution. Employee count lands in an 850-to-1000 range across official and independent sources, while a
              Forbes interview supplied a greater-than-$150 million revenue estimate for 2024 but not ARR. That means
              scale is real, but the economic precision still falls short of what a full underwriting process should
              demand.
