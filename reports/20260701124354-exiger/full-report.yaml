      - number: '7.3'
        title: AI/Data Accuracy, Compliance, Cyber, and Geopolitical Risks
        blocks:
          - type: paragraph
            body: >-
              This is the chapter’s core skeptical lens. Exiger markets predictive, AI-enabled mapping and risk
              detection, which is commercially powerful but also raises the cost of being wrong. The public DPA
              allocates some responsibility back to customers by requiring them to provide accurate data, yet Exiger
              still accepts processor, security, sub-processor, and breach-response obligations. That means contractual
              drafting does not eliminate operational liability. The regulatory stack that customers rely on is also
              dynamic rather than static. OFAC distributes continuously updated sanctions datasets, BIS pushes exporters
              toward EAR and screening resources while warning users to confirm legal research against official
              publications, and CBP’s UFLPA regime can detain shipments based on entity-list and origin evidence. In
              other words, Exiger’s value proposition depends on handling data that changes, crosses jurisdictions, and
              can become legally consequential when stale or incomplete. Add FTC privacy expectations, GDPR obligations,
              the AI Act’s staged compliance timeline, and rising cyber or product-assurance scrutiny, and the result is
              a business where model quality, entity resolution, source provenance, and security controls deserve the
              same diligence weight as top-line growth.
