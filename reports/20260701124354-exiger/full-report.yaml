              software-led positioning that could justify a premium analytics multiple if margins and retention are
              strong. Public comps show the spread investors should keep in mind. Dun & Bradstreet's public data implies
              a much lower-growth data-and-analytics floor at roughly 3.2x revenue based on the reported Clearlake
              take-private, while Verisk's public market profile implies roughly 7.6x trailing revenue for a scaled,
              higher-quality analytics platform. Applying that public comp frame to Forbes's reported >$150 million
              revenue floor yields a rough implied support band of about $480 million to $1.14 billion. That is
              directionally useful but not conclusive because Exiger does not disclose margin profile, net retention,
              segment mix, burn, runway, or the entry valuation for Carlyle and Insight. Investor return expectations
              are therefore conditional, not verified: upside requires Exiger to look economically more like a
