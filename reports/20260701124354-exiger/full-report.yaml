        - label: Disclosed Fortune 500 customers
          value: 150
        - label: Disclosed government / DIB organizations
          value: 60
        - label: Clearly named external accounts in retained corpus
          value: 4
        - label: Named federal accounts with explicit operational contract scope
          value: 2
