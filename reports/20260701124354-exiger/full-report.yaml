  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Directed map showing how concentration, accuracy, integration, and exit risks flow into bookings quality,
      compliance cost, and valuation pressure.
    approximationNotes: >-
      Edges represent likely causal pathways based on the retained evidence set; they are directional rather than
      quantified elasticities.
    claimRefs:
      - CR020
      - CR022
      - CR024
      - CR026
      - CR032
      - CR042
      - CR043
      - CR044
      - CR046
      - CR047
    data:
      nodes:
        - id: gov_conc
          label: Government concentration
          tier: risk-source
          detail: Public footprint is visible; revenue mix is not.
        - id: accuracy
          label: AI / data accuracy liability
          tier: risk-source
          detail: Wrong screening or mapping outputs can create customer harm.
        - id: integration
          label: Acquisition integration drag
          tier: risk-source
          detail: Supply Dynamics, XSB, and Versed AI raise execution load.
        - id: exit_env
          label: Sponsor / exit timing risk
          tier: risk-source
          detail: PE ownership meets a still-frictional public-market window.
        - id: bookings
          label: Bookings timing pressure
          tier: intermediate
          detail: Procurement cycles lengthen or concentrate.
        - id: compliance_cost
          label: Compliance cost and remediation
          tier: intermediate
          detail: Legal review, QA, and customer assurance costs rise.
        - id: margin
          label: Margin pressure
          tier: consequence
          detail: More services, audit, and support work compress economics.
        - id: valuation
          label: Valuation compression
          tier: consequence
          detail: Opaque concentration and weaker efficiency reduce multiple support.
      edges:
        - from: gov_conc
          to: bookings
          label: Agency budgets and task-order timing drive close dates
        - from: accuracy
          to: compliance_cost
          label: Customer disputes or regulator scrutiny trigger remediation
        - from: integration
          to: bookings
          label: Roadmap noise slows sales confidence and deployment
        - from: exit_env
          to: valuation
          label: Sponsor monetization meets disclosure friction
        - from: bookings
          to: margin
          label: Delayed growth forces heavier selling and support effort
        - from: compliance_cost
          to: margin
          label: QA, audit, and legal work raise cost to serve
        - from: margin
          to: valuation
          label: Lower software-quality profile weakens multiple support
        - from: bookings
          to: valuation
          label: Growth volatility undermines exit narrative
