      - number: '8.2'
        title: Public and Private Comparable Frame
        blocks:
          - type: paragraph
            body: >-
              Public comps provide a usable range, but they are imperfect and should be read as valuation anchors rather
              than literal peers. Dun & Bradstreet, NICE, and TransUnion sit in the lower band of adjacent data or
              workflow vendors at roughly 1.7x to 3.0x trailing revenue on public market-cap-to-revenue proxies. Verisk
              and Moody's occupy the premium end at roughly 7.8x and 10.1x respectively, reflecting stronger disclosure,
              high-margin analytics economics, and more mature data-network advantages. Exiger's implied 8.0x floor
              multiple therefore lands much closer to premium analytics names than to the lower-growth or workflow-heavy
              names. That can be defensible only if current revenue is already comfortably above the 2024 floor and if
              Exiger's economics look more like scaled software and analytics than like a services-heavy compliance
              platform. Private and M&A references reinforce strategic appetite for intelligence assets, but they do not
              cleanly solve valuation support. Chainalysis reached an $8.6 billion valuation, Interos crossed $1
              billion, Sayari attracted a $235 million strategic majority investment, and Mastercard agreed to buy
              Recorded Future for $2.65 billion. Those examples show sponsor and strategic demand for networked
              risk-data assets, but each sits in a different end market, disclosure regime, and margin profile. The comp
              set is therefore helpful, but only with explicit caveats.
