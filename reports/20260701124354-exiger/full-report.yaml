      - number: '2.4'
        title: Regulatory drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Exiger’s market is being pulled forward by hard regulation, industrial policy, and the availability of
              AI-based automation. In defense, CMMC and DFARS contract clauses turn cybersecurity assurance into a
              contract-gating requirement, while the DoD’s industrial strategy and proposed ownership-disclosure
              expansion deepen demand for sub-tier visibility. In trade and human-rights compliance, UFLPA enforcement
              has become more transaction-specific and data-intensive, and OFAC plus BIS rules keep sanctions and
              export-control screening continuously current rather than episodic. EO 14017 and CHIPS-related policy
              extend the logic beyond compliance into national-security resilience and upstream component traceability.
              The constraints are just as real. Buyers still face integration and data-quality burdens, false-positive
              review load, slow budget cycles, and incumbent workflows that are hard to replace. Defense use cases add
              sensitive-data and auditability constraints that limit simple plug-and-play deployment assumptions. The
              practical takeaway is that Exiger’s market has strong external drivers, but monetization depends on
              whether customers can operationalize the data with acceptable implementation effort and enough precision
              to avoid drowning analysts in noise.
