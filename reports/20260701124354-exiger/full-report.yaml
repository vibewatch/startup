  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price Support Versus Disclosure Quality
        blocks:
          - type: paragraph
            body: >-
              The public record establishes that Carlyle and Insight bought into Exiger in late 2023 and that
              independent deal coverage put the valuation at about $1.2 billion, but the official sponsor and company
              releases still do not disclose the price, ownership split, leverage, or preference structure. That matters
              because the most important denominator is still a third-party-reported management claim: Forbes wrote in
              March 2024 that Exiger expected revenue to exceed $150 million by the end of 2024 and had compounded above
              80% annually over the prior five years. Against that floor, the reported $1.2 billion value implies about
              8.0x revenue, which is not obviously unreasonable for a differentiated risk-data platform but is clearly
              not cheap either. The 2026 AWS and Hackett materials strengthen the quality story by showing 550+
              customers, 150 Fortune 500 relationships, 60+ government and Defense Industrial Base organizations, and
              procurement relevance. But they still leave ARR, gross margin, retention, services mix, cash-flow profile,
              and public-sector concentration unreported. So the core valuation judgment is evidence-sensitive rather
              than company-quality-sensitive: Exiger may deserve a premium mark, but the current public file does not
              prove it.
            claimRefs:
              - CV001
