  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue and ARR
        - Audited 2025 revenue, current TTM revenue, current ARR, and segment bridge
        - This is the denominator for every valuation and return conclusion.
        - CFO pack and quality-of-revenue bridge.
      - - Gross margin and software mix
        - Gross margin by segment plus software versus services revenue and gross profit mix
        - Determines whether premium analytics comps are appropriate.
        - Finance diligence and product-line P&L review.
      - - Retention and concentration
        - Gross and net retention, top-20 customer concentration, and public-sector concentration
        - Clarifies durability and whether government depth is moat or concentration risk.
        - Revenue-operations pack and cohort analysis.
      - - Sponsor terms and cap table
        - Entry valuation, ownership split, leverage, liquidation preferences, and employee option overhang
        - Gross value support can still fail to produce acceptable equity returns.
        - Legal and cap-table diligence with sponsor side letter review.
      - - Acquisition integration
        - Revenue retention and synergy realization for Supply Dynamics, XSB, and Versed AI
        - Integration success determines whether scale translates into durable economics.
        - M&A diligence with acquired product and customer bridge.
      - - Exit path evidence
        - Strategic-buyer map, IPO readiness view, and likely buyer objections
        - Sponsor return expectations depend on a credible liquidity path, not just growth.
        - Board materials, banker perspectives, and buyer-call plan.
    notes: >-
      Each ask is aimed at moving a valuation decision, not just enriching the narrative. The public record is already
      strong enough on market relevance and weak exactly where underwriting needs precision.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV046
