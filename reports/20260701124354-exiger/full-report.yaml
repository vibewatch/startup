  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue denominator disappoints
        - Current TTM revenue is still near the >$150M 2024 floor
        - The reported $1.2B mark stays near an 8x floor multiple rather than compressing into a fairer range.
        - Treat valuation as stretched and require repricing or a stronger structured upside case.
      - - Software mix disappoints
        - Services or analyst-led support account for a material share of gross profit
        - Exiger starts to look more like a tech-enabled services platform than a premium analytics platform.
        - Lower the comparable band toward workflow or services-heavy vendors.
      - - Government concentration is high
        - Public sector or a few federal programs make up a large share of ARR or gross profit
        - Renewal volatility and procurement timing become first-order valuation drivers.
        - Apply concentration discount and require contract-level renewal visibility.
      - - Sponsor terms cap upside
        - Leverage, liquidation preferences, or ownership structure skew economics away from new-money equity
        - Gross enterprise value can look acceptable while equity returns still disappoint.
        - Rework return math on a fully diluted equity basis before advancing.
      - - Exit market remains selective
        - Buyers still prefer profitability and discount generic growth in 2026-2027
        - Even a solid business can miss sponsor return targets if exit multiples stay compressed.
        - Underwrite longer hold periods and a lower exit multiple range.
    notes: >-
      Kill triggers focus on valuation transmission rather than operating noise; each one can break return math without
      disproving that Exiger has a relevant product.
    claimRefs:
      - CV031
