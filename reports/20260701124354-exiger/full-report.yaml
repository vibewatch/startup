      - number: '3.4'
        title: Moat Durability and Adverse View
        blocks:
          - type: paragraph
            body: >-
              The durable part of Exiger's moat is the unusual combination of graph-driven supply-chain intelligence,
              workflow execution, and public federal credibility. Very few public peers market all three together. The
              adverse case is that each piece can still be attacked separately. D&B, LSEG, and Lexis can deepen workflow
              around data franchises that already sit inside compliance budgets. Coupa and Ivalua can deepen monitoring
              and decisioning from inside procurement suites that already own the user and approval layer. Sayari and
              Interos can outflank Exiger on the graph side by making sub-tier visibility or resilience mapping the main
