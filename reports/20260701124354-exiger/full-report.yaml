      - number: '7.2'
        title: Government Concentration, Procurement, and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Exiger’s public-sector credibility is simultaneously a moat and a concentration risk. The evidence set
              shows a meaningful federal footprint: FedRAMP Moderate authorization, contract-vehicle access, Carahsoft
              channel distribution, and a multi-million Army Materiel Command deployment. That profile should help
              Exiger win in defense, public-sector, and critical-supply-chain use cases, but it also means a non-trivial
              portion of pipeline quality is likely tied to budget timing, task-order mechanics, contracting officers,
              reseller throughput, and compliance sign-off. AWS Marketplace improves discoverability and may shorten
              some buying steps, yet it does not convert Exiger into a frictionless self-serve product. SAM.gov and
              USAspending both reinforce that federal procurement remains a formal, searchable, multi-step process. The
              underwriting problem is that none of the retained public sources disclose what share of revenue, bookings,
              or retention comes from public-sector or government-adjacent customers. That pushes the probability of
              concentration risk into the medium-to-high range even without proof of a current problem, because
              investors can verify footprint but not revenue mix. Any slowdown in agency budgets, reseller execution, or
              contracting throughput would transmit first into bookings timing and then into valuation.
