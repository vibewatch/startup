      - number: '1.2'
        title: Leadership, Founder Attribution, and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership is clearer than founder attribution, and that distinction matters. Current public materials
              plainly identify Brandon Daniels as CEO and the main public voice for Exiger’s AI, defense, and growth
              agenda. But reviewed sources do not support the idea that Daniels co-founded the business in 2013.
              Instead, the strongest official record shows Michael Cherkasky and Michael Beber as founders, with Daniels
              joining in 2017 and taking the CEO role in 2022. That transition is important because it explains why
              current brand messaging can feel founder-light even though founder influence still appears to matter.
              Publicly visible operators such as Carrie Wibben, Cameron Holt, and Eli Cherkasky show that Exiger now
              runs with a more mature bench across product integration, federal delivery, and operations. What remains
              conspicuously thin is the current post-2023 governance file: public materials do not provide a full board
              roster, voting-right summary, or detailed control map after Carlyle and Insight’s majority investment. For
              diligence purposes, management quality looks strong, but the control structure behind that management team
              is still only partially visible.
            claimRefs:
