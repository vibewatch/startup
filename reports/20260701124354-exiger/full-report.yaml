          label: External lists and rules shape screening obligations
        - from: acquired_assets
          to: exiger_platform
          label: Integrated data and mapping capabilities
        - from: exiger_platform
          to: revenue_realization
          label: Product performance must sustain renewals and expansion
        - from: federal_buyers
          to: revenue_realization
