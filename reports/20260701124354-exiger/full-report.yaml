        title: Exhibits
        blocks:
          - type: callout
            title: $1.2 billion is supportable only conditionally
            body: >-
              Exiger's current public file can support a premium narrative, but not a premium conclusion, unless
              management shows that current revenue is already well above the last reported floor and that the business
              is economically software-like rather than services-heavy.
