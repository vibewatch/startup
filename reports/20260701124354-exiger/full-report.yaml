      - number: '8.4'
        title: Decision, Kill Triggers, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The right call on the public record is research-more rather than buy. Exiger has enough scale, sponsor
              quality, and category relevance to stay investable, but not enough disclosed economics to underwrite a
              $1.2 billion entry with conviction. The cleanest anti-thesis is not that demand is fake; it is that
              valuation support depends on opaque private revenue, unknown software-versus- services mix, unclear
              government concentration, and sponsor ownership dynamics that remain hidden from the public file. That
              means the diligence plan should focus less on broad market validation and more on denominator proof:
              current TTM revenue, ARR, growth by segment, gross margin, NRR, federal concentration, customer
              concentration, and exact sponsor terms. Kill triggers are also concrete. If current revenue is still near
              the 2024 floor, if public-sector revenue is highly concentrated, if services make up a meaningful share of
              gross profit, or if the capital structure gives new money limited upside, the valuation quickly looks
              stretched. If the company can instead prove materially higher current revenue, premium software-like
              economics, and a credible strategic or IPO path, the same public evidence can move from stretched to fair.
            claimRefs:
              - CV040
              - CV041
              - CV042
              - CV043
