  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Prioritization
        blocks:
          - type: paragraph
            body: >-
              Exiger’s public risk stack is not dominated by a single existential problem but by a cluster of linked
              exposures that can compound. The highest-probability commercial risks are competitive bundle pressure from
              larger platforms, procurement slippage in government and regulated enterprise accounts, and integration
              drag as multiple acquired data or mapping assets are absorbed into one operating platform. The
              highest-severity risks are different: a material error in sanctions, export-control, forced-labor, or
              privacy-sensitive screening can create direct customer liability and reputational damage, while hidden
              government concentration could make growth look more diversified than it really is. The retained sources
              also show real mitigation. FedRAMP authorization, a public DPA, contract-vehicle access, AWS Marketplace
              availability, and sponsor capital all indicate Exiger is not improvising its way through regulated
              markets. But those same signals show why the file needs caution: federal channels lengthen sales cycles,
              AI-led claims raise precision expectations, and sponsor ownership makes timing and exit conditions
              relevant before public metrics are fully disclosed.
