        - from: contract_routes
          to: revenue_realization
          label: Channel throughput influences close speed and execution
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Exiger's public valuation case is a chain in which real scale and category proof are partially offset by economics
      opacity and a higher 2026 exit hurdle.
    data:
      nodes:
        - id: scale
          label: Verified scale
          detail: >-
            550+ customers, 150 Fortune 500 relationships, and 60+ government / DIB organizations are public in 2026
            materials.
        - id: proof
          label: Premium signals
          detail: AWS Marketplace availability, Hackett recognition, and sponsor backing support strategic relevance.
        - id: denominator
          label: Reported denominator
          detail: Forbes reported >$150M 2024 revenue and >80% five-year CAGR.
        - id: opacity
          label: Economics opacity
          detail: ARR, gross margin, NRR, services mix, and sponsor terms remain undisclosed.
        - id: exit
          label: 2026 exit bar
          detail: Private equity exits are slower and buyers are more selective on software valuations.
        - id: call
          label: Recommendation
          detail: Research-more with a stretched valuation stance until management closes the denominator gap.
      edges:
        - from: scale
          to: proof
          label: supports
        - from: proof
          to: denominator
          label: helps justify
        - from: denominator
          to: opacity
          label: still depends on
        - from: opacity
          to: exit
          label: collides with
        - from: exit
          to: call
          label: drives
    approximationNotes: >-
      This figure is decision logic, not a process map; it visualizes the evidence chain that moves the recommendation
      from investable company to conditional valuation support.
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV031
      - CV039
      - CV040
      - CV041
      - CV050
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: The biggest underwriting sensitivities are denominator and mix, not top-of-funnel demand.
    data:
      items:
        - label: Current revenue proof
          value: 10
        - label: Gross margin / services mix
          value: 9
        - label: Sponsor terms / leverage
          value: 9
        - label: Public-sector concentration
          value: 8
        - label: Retention and cohort quality
          value: 8
        - label: Exit multiple climate
          value: 7
    approximationNotes: >-
      Bars are ordinal 0-10 sensitivity scores synthesized from the retained evidence set. They show which missing facts
      move valuation most, not measured operating KPIs.
    claimRefs:
      - CV031
      - CV032
      - CV039
      - CV040
      - CV041
      - CV046
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Sponsor return math becomes acceptable only if Exiger exits from a meaningfully larger revenue base and still
      holds a premium multiple.
    data:
      items:
        - label: Bear
          low: 600
          mid: 700
          high: 850
          note: 200M revenue with roughly 3.0x to 4.25x exit valuation outcomes.
        - label: Base
          low: 1350
          mid: 1513
          high: 1700
          note: 275M revenue with roughly 4.9x to 6.2x outcomes.
        - label: Bull
          low: 2350
          mid: 2625
          high: 3000
          note: 350M revenue with roughly 6.7x to 8.6x outcomes.
    approximationNotes: >-
      Ranges are illustrative exit-value bands tied to the bull, base, and bear cases rather than point estimates. They
      are meant to show how little room there is for error around a $1.2B starting point.
    claimRefs:
      - CV031
      - CV032
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      Exiger scores well on market need and proof, but poorly on the public evidence quality required to defend a
      premium valuation.
    data:
      items:
        - label: Market need
          value: 8
          unit: /10
          note: Regulatory, geopolitical, and procurement complexity clearly support demand.
        - label: Product proof
          value: 7
          unit: /10
          note: AWS, Hackett, and customer-scale signals support relevance and maturity.
        - label: Distribution moat
          value: 7
          unit: /10
          note: Federal depth and channel expansion are strengths, though not yet proof of durable pricing power.
        - label: Revenue visibility
          value: 4
          unit: /10
          note: The best public denominator is still a third-party-reported 2024 floor.
        - label: Unit-economics visibility
          value: 3
          unit: /10
          note: ARR, gross margin, NRR, and services mix remain undisclosed.
        - label: Valuation support
          value: 4
          unit: /10
          note: The reported mark can be fair, but only with evidence the public file does not yet contain.
        - label: Exitability
          value: 5
          unit: /10
          note: Strategic appetite exists, but 2026 software-exit conditions are selective.
    approximationNotes: >-
      These are underwriting-readiness scores synthesized from retained public evidence, not management or board
      metrics.
    claimRefs:
      - CV009
      - CV010
      - CV031
      - CV039
      - CV040
      - CV041
      - CV050
