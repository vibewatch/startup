  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Exiger’s market is not “all compliance software” or “all supply chain
              software,” but the narrower set of workflows where an organization must know who a supplier, counterparty,
              product, part, component, or software dependency really is; what legal or operational risk it creates; and
              what action should follow. Exiger’s own platform positioning is unusually broad across that problem set:
              it joins supplier, product, part, component, and risk data; explicitly spans both physical and software
              supply chains; and sells risk-and-compliance modules for trade compliance, supplier risk management,
              enhanced due diligence, third-party risk management, and know-your-customer work. That means the included
              spend starts with third-party and supplier diligence, sanctions and trade screening, multi-tier
              supply-chain mapping, and software provenance or SBOM-informed visibility. It does not extend to generic
              ERP, payments processing, standalone cybersecurity point tools, or logistics execution software when those
              tools are not resolving supplier, ownership, provenance, or compliance risk. The serviceable wedge is
              therefore the overlap between regulated compliance work and high-stakes procurement visibility, not every
              dollar touching procurement or risk.
            claimRefs:
              - CM001
