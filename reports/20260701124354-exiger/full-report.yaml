      - CU013
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Government and named enterprise cases score highest on deployment specificity, while financial-services proof is
      real but structurally less referenceable because it stays anonymous.
    data:
      columns:
        - Deployment maturity
        - Outcome specificity
        - Reference quality
        - Retention visibility
      rows:
        - label: U.S. Army AMC
          values:
            - High — live licensed software with mission workflow detail
            - High — sustainment categories and integration targets are explicit
            - High — named account with third-party corroboration
            - Low — no public renewal or user-count data
        - label: CBP
          values:
            - High — live awarded trade-enforcement deployment
            - Medium-high — use case is explicit but spend detail is not
            - High — named account
            - Low — no renewal or contract-duration disclosure
        - label: Northwell Health
          values:
            - High — production enterprise deployment
            - Medium-high — integration detail and buyer pain are explicit
            - High — named enterprise reference
            - Low — no contract term or expansion economics disclosed
        - label: Oshkosh / JLG
          values:
            - High — embedded multi-tier workflow with supplier participation
            - High — quantified operational outcomes and expansion path
            - High — named industrial reference
            - Medium — visible expansion but no renewal metrics
        - label: Anonymous bank / fintech cohort
          values:
            - Medium — repeated use cases across multiple institutions
            - Medium — good project detail, weak account naming
            - Low — anonymized references only
            - Medium — one case shows extension, but portfolio-level renewal is absent
        - label: Anonymous government / SBOM cases
          values:
            - Medium — repeatable workflow proof across agencies and software buyers
            - Medium — clear use cases, limited customer identity
            - Low — customer names withheld
            - Low — no disclosed renewals or follow-on scope
    approximationNotes: >-
      Matrix scores are analytical judgments based on whether the retained public evidence names the account, explains
      the workflow, and discloses follow-through beyond the initial deployment story.
