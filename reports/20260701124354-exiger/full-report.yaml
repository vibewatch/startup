chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Roots, and Platform Shift
        blocks:
          - type: paragraph
            body: >-
              Exiger’s company-overview story is strongest when read as a progression, not as a clean-sheet AI startup.
              Older official releases and partner case studies show a company built around regulatory, financial-crime,
              and due-diligence workflows for banks, corporations, and government agencies. DDIQ, Insight 3PM, and
              adjacent risk products created the data-ingestion, entity-resolution, and analyst-guided operating muscle
              that later made a supply-chain pivot believable. By September 2023, management had consolidated the public
              narrative around 1Exiger, and by 2026 the current website framed the business even more explicitly as an
              AI-native operating system for supply-chain execution, procurement acceleration, and compliance
              automation. That repositioning does not erase the company’s roots; it repackages them. The supportable
              through-line is that Exiger used compliance-grade information handling and risk judgment as the foundation
              for a broader platform that now promises multi-tier visibility, decision support, and workflow
              orchestration across supplier, product, and part data. The result is a business that still carries regtech
              DNA, but whose present-day go-to-market language is centered on supply-chain AI.
