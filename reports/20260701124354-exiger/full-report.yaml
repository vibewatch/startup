  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Exiger does not compete in one neat software box. Buyers can solve overlapping pieces of the job with
              data-led screening vendors, workflow-first TPRM suites, or graph-driven supply-chain intelligence
              platforms. Dun & Bradstreet, LSEG, LexisNexis Risk Solutions, Sayari, and K2 Integrity matter when the
              buying center wants sanctions, KYC, AML, or due-diligence intelligence. Coupa, ProcessUnity, Aravo,
              Ivalua, and Supply Wisdom matter when the buyer primarily needs onboarding, questionnaires, approvals, and
              continuous supplier monitoring inside an operating workflow. Sayari and Interos matter most when the buyer
              believes the real risk sits below tier 1 and wants network mapping, ownership resolution, or critical-node
              visibility. That split is why Exiger's pitch is broader than classic vendor-risk software. Its public
              materials frame one platform that mixes supply-chain intelligence with workflow execution and a federal or
              defense-grade deployment story. The competing substitute is not only another standalone vendor. It is also
              a composable stack where a buyer pairs a screening dataset with a procurement suite and accepts a
              narrower, but cheaper, operating model.
