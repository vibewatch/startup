      - number: '2.3'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real and growing market around Exiger’s workflows, but not a clean
              single-number TAM. The third-party risk management category alone ranges from about $8.09 billion to $9.34
              billion in retained 2026 estimates, while a broader Grand View lens emphasizes North American
              concentration and long-run growth rather than a directly comparable 2026 point. Supply-chain risk
              management is even more dispersed: retained 2026 values run from $3.73 billion to $6.91 billion depending
              on whether the publisher emphasizes core software-and-services spend or a wider solution perimeter.
              Sanctions screening is the clearest warning against false precision, because the retained 2026 market can
              be as small as roughly $587 million for software-only screening or as large as $4.2 billion for broader
              screening solutions. Those numbers are useful only if they stay separate. They should not be summed into a
              single Exiger TAM because categories overlap in buyer, workflow, and product scope. The most defensible
              conclusion is that Exiger sits at the intersection of several mid-sized and fast-growing categories, with
              the defense-industrial visibility wedge especially important strategically but not cleanly isolated in
              public market-size data.
