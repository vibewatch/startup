            body: >-
              The customer-risk picture is less about whether Exiger has customers and more about where the economic
              weight sits. Public proof strongly suggests defense and government matter disproportionately: the company
              highlights Army, CBP, federal contract vehicles, Platform One, SCRIPTS, and 60+ government/DIB
              organizations far more than it discloses enterprise renewal cohorts or top-bank references. That asymmetry
              creates two diligence risks. First, concentration could be higher than investors expect if public-sector
              bookings and renewals are a large share of the business. Second, reference inflation is possible because
              headline customer counts are supported by only a small set of named external accounts in the retained
              corpus. Financial-services concentration is plausible, but without named Goldman Sachs or JPMorgan proof,
              it is not underwritten. The sales-cycle implication is also important: long, regulated procurement paths
              can be sticky once won, but they can also slow net-new growth and make implementations resource intensive.
              Exiger therefore looks more like a high-touch, workflow-embedded platform vendor than a low-friction
