      - number: '2.2'
        title: Buyers, workflows, and budget owners
        blocks:
          - type: paragraph
            body: >-
              Exiger’s buyer map is broader than a classic bank-compliance story, but the spending logic is still
              concentrated in teams that own procurement, compliance, legal exposure, supply continuity, and mission
              assurance. In financial institutions, the relevant buyers are compliance, financial-crime, legal, and risk
              teams that need KYC, sanctions screening, investigations, and third-party controls in one auditable
              workflow. In large industrials and critical-infrastructure companies, the economic buyer shifts toward
              procurement, supply-chain risk, supplier-quality, and trade-compliance leaders who need visibility below
              tier-one suppliers and across parts, materials, and jurisdictions. In defense, acquisition, program,
              cyber, and industrial-base teams are buying against contract eligibility, adversarial supplier exposure,
              and provenance risk rather than only against generic efficiency goals. The adoption path is therefore
              workflow-led: onboarding and screening first, then continuous monitoring, then remediation, re-sourcing,
              and resilience management. This multi-function ownership matters for valuation because it makes Exiger’s
              revenue opportunity depend on whether risk tools can embed into operational decision-making, not just
              whether a compliance department budgets for another watchlist feed.
            claimRefs:
              - CM003
