      - number: '8.3'
        title: Bull, Base, Bear, and Exit Math
        blocks:
          - type: paragraph
            body: >-
              The scenario work argues for discipline. In the bull case, Exiger is already materially above the reported
              2024 revenue floor, sustains software-led growth, shows strong retention, and exits into a market that
              still pays premium analytics multiples for defensible risk data. That can produce a sponsor-acceptable
              2x-plus outcome. In the base case, however, Exiger grows well enough to be valuable but not well enough to
              overcome today's entry price with robust excess return; a mid-single-digit exit multiple on a sub-$300
              million revenue base only produces a modest uplift over the reported mark. In the bear case, a combination
              of public-sector concentration, acquisition-integration drag, services mix, or multiple compression can
              leave the company worth below cost. The 2026 private-equity exit backdrop raises the hurdle further,
              because buyers are more selective, software multiples have compressed versus peak years, and longer hold
              periods reduce sponsor IRR even when gross MOIC remains positive. Put simply, Exiger does not need to be a
              bad business for the valuation to disappoint; it only needs to be a good business that is not quite
              premium enough.
            claimRefs:
              - CV031
