- id: milestones-acquisitions-and-risk-signals
  title: Milestones, Acquisitions, and Risk Signals
  body: 'The milestone sequence is one of the clearest ways to understand Exiger’s current identity. After building its early compliance and diligence footprint, the company spent 2022 through 2024 stitching together a broader operating stack: Daniels’ CEO elevation in 2022, the 1Exiger launch in 2023, and the Versed AI and XSB acquisitions in 2024 all pushed the business toward deeper product-aware supply-chain intelligence. The 2025 Army award and 2026 Platform One marketplace status then reinforced that Exiger had crossed from compliance-adjacent tooling into mission-grade government supply-chain infrastructure. Those are real positives, but this chapter should not treat the public file as spotless. The most visible negative signal in the reviewed set is a 2026 Gartner Peer Insights review that praised visibility yet criticized workflow tuning, which implies implementation complexity at least some users feel. More importantly, the public file still leaves unresolved questions around ARR,
    board structure, exact 2023 economics, and whether legacy brands such as ORCA and WorldCompliance remain active products or are simply absorbed into broader platform messaging. That is not thesis-breaking opacity, but it is enough to keep diligence pressure on product clarity and governance.'
