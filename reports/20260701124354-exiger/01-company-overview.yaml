    severity: material
    topic: product-branding-opacity
    missingEvidence: A current Exiger product map or roadmap that explicitly states whether ORCA and WorldCompliance remain active standalone brands, are sunset, or have been fully folded into 1Exiger.
    whyItMatters: The user specifically asked to test those product names, and public-facing materials reviewed here do not cleanly answer that question.
    diligencePath: Ask product leadership for a current product taxonomy and customer migration map covering legacy compliance and screening modules.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-control
    missingEvidence: A current board roster, cap table summary, and investor-rights overview after the 2023 Carlyle/Insight majority investment.
    whyItMatters: Control, board composition, and consent rights shape decision-making, exit optionality, and founder-management autonomy.
    diligencePath: Request the latest board list, investor rights agreement summary, and ownership table from management or the data room.
    relatedQuestionRefs:
