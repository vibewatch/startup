callouts:
- calloutType: strength
  title: Compliance-rooted data credibility made the supply-chain pivot believable
  body: Exiger did not start as a generic supply-chain dashboard company. Public materials show a long due-diligence and financial-crime lineage, with DDIQ, Insight 3PM, and bank/regulator workflows preceding the 1Exiger launch. That history matters because the current AI and supply-chain pitch is grounded in years of entity-resolution, risk scoring, and analyst-led compliance operations rather than in a single recent rebrand.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO031
  - CO039
- calloutType: risk
  title: Scale is credible, but founder attribution, economics, and product-branding transparency remain imperfect
  body: The broad growth story is real, but investors still have to work through material blind spots. Reviewed sources do not support Daniels as a co-founder even though he now dominates the public narrative; the post-2023 board and ownership split are not disclosed; ARR is absent; and the public status of ORCA and WorldCompliance is unclear in current materials. Gartner also surfaces a critical workflow-tuning complaint, which means implementation friction should be tested in customer calls rather than ignored.
  claimRefs:
  - CO003
  - CO032
  - CO036
  - CO040
