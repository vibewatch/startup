company:
  name: Exiger
chapter:
  number: 1
  title: Company Overview
  summary: Exiger is a McLean, Virginia-based private software company founded in 2013 that began in due diligence, financial-crime, and compliance workflows before repositioning around the 1Exiger / 1ExigerAI supply-chain intelligence platform. Public evidence supports Brandon Daniels as CEO since 2022, a December 2023 Carlyle/Insight majority investment reported at roughly a $1.2 billion valuation, and meaningful government plus enterprise traction including the U.S. Army, Oshkosh, and SMBC. The same record still leaves material opacity around founder attribution in the current brand narrative, current board/control details, ARR, and the exact present status of some legacy product brands.
sections:
- id: identity-roots-and-platform-shift
  title: Identity, Roots, and Platform Shift
  body: Exiger’s company-overview story is strongest when read as a progression, not as a clean-sheet AI startup. Older official releases and partner case studies show a company built around regulatory, financial-crime, and due-diligence workflows for banks, corporations, and government agencies. DDIQ, Insight 3PM, and adjacent risk products created the data-ingestion, entity-resolution, and analyst-guided operating muscle that later made a supply-chain pivot believable. By September 2023, management had consolidated the public narrative around 1Exiger, and by 2026 the current website framed the business even more explicitly as an AI-native operating system for supply-chain execution, procurement acceleration, and compliance automation. That repositioning does not erase the company’s roots; it repackages them. The supportable through-line is that Exiger used compliance-grade information handling and risk judgment as the foundation for a broader platform that now promises multi-tier visibility,
    decision support, and workflow orchestration across supplier, product, and part data. The result is a business that still carries regtech DNA, but whose present-day go-to-market language is centered on supply-chain AI.
