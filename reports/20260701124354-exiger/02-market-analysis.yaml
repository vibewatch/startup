      to: n2
      label: match data
    - from: n2
      to: n3
      label: apply rules
    - from: n3
      to: n4
      label: trace exposure
    - from: n4
      to: n5
      label: take action
  approximationNotes: The funnel is qualitative. It shows why buyer ROI depends on implementation quality, alert precision, and integration, not just on owning a list of regulations to screen against.
