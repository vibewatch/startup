company:
  name: Exiger
chapter:
  number: 2
  title: Market Analysis
  summary: Exiger’s most defensible market is the intersection of supplier and third-party risk intelligence, trade and sanctions compliance, multi-tier supply-chain visibility, and software or defense provenance workflows. Public 2026 market estimates show several attractive adjacent categories, but they conflict too much—and overlap too much—to justify a single additive TAM; the monetizable wedge is narrower and concentrated in regulated, high-consequence buying centers such as procurement, compliance, legal, financial institutions, industrials, and the defense industrial base.
sections:
- id: market-boundary-and-included-spend
  title: Market boundary and included spend
  body: 'The cleanest way to define Exiger’s market is not “all compliance software” or “all supply chain software,” but the narrower set of workflows where an organization must know who a supplier, counterparty, product, part, component, or software dependency really is; what legal or operational risk it creates; and what action should follow. Exiger’s own platform positioning is unusually broad across that problem set: it joins supplier, product, part, component, and risk data; explicitly spans both physical and software supply chains; and sells risk-and-compliance modules for trade compliance, supplier risk management, enhanced due diligence, third-party risk management, and know-your-customer work. That means the included spend starts with third-party and supplier diligence, sanctions and trade screening, multi-tier supply-chain mapping, and software provenance or SBOM-informed visibility. It does not extend to generic ERP, payments processing, standalone cybersecurity point tools, or
    logistics execution software when those tools are not resolving supplier, ownership, provenance, or compliance risk. The serviceable wedge is therefore the overlap between regulated compliance work and high-stakes procurement visibility, not every dollar touching procurement or risk.'
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM005
  - CM007
  - CM008
  - CM010
  tableRefs:
  - TM001
- id: buyers-workflows-and-budget-owners
  title: Buyers, workflows, and budget owners
  body: 'Exiger’s buyer map is broader than a classic bank-compliance story, but the spending logic is still concentrated in teams that own procurement, compliance, legal exposure, supply continuity, and mission assurance. In financial institutions, the relevant buyers are compliance, financial-crime, legal, and risk teams that need KYC, sanctions screening, investigations, and third-party controls in one auditable workflow. In large industrials and critical-infrastructure companies, the economic buyer shifts toward procurement, supply-chain risk, supplier-quality, and trade-compliance leaders who need visibility below tier-one suppliers and across parts, materials, and jurisdictions. In defense, acquisition, program, cyber, and industrial-base teams are buying against contract eligibility, adversarial supplier exposure, and provenance risk rather than only against generic efficiency goals. The adoption path is therefore workflow-led: onboarding and screening first, then continuous monitoring,
    then remediation, re-sourcing, and resilience management. This multi-function ownership matters for valuation because it makes Exiger’s revenue opportunity depend on whether risk tools can embed into operational decision-making, not just whether a compliance department budgets for another watchlist feed.'
  claimRefs:
  - CM003
  - CM006
  - CM007
  - CM041
