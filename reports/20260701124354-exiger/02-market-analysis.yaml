  - CM015
  - CM016
  - CM017
  - CM018
- id: FM003
  title: Buyer / workflow adoption map
  type: flow
  summary: 'Exiger’s buyer map is multi-functional: distinct verticals route different pain points into one visibility-and-compliance operating layer.'
  data:
    nodes:
    - id: n1
      label: Financial institutions
      description: Need KYC, sanctions, investigations, and third-party controls in one auditable workflow.
    - id: n2
      label: Industrials and critical infrastructure
      description: Need multi-tier supplier mapping, origin visibility, and resilience actions.
    - id: n3
      label: Defense agencies and DIB
      description: Need provenance, ownership, cyber, and contract-eligibility visibility.
    - id: n4
      label: Legal and compliance centers
      description: Need enhanced due diligence, anti-bribery, and screening evidence.
    - id: n5
      label: 1Exiger operating layer
      description: Unifies onboarding, screening, mapping, monitoring, and remediation across buyer types.
    edges:
    - from: n1
      to: n5
      label: KYC + sanctions + TPRM
    - from: n2
      to: n5
      label: supplier mapping + resilience
    - from: n3
      to: n5
      label: provenance + DIB compliance
    - from: n4
      to: n5
      label: EDD + auditability
  approximationNotes: This is a workflow-ownership map rather than a revenue-share chart. It emphasizes why Exiger is bought by mixed buying centers, not one isolated risk function.
  claimRefs:
  - CM041
  - CM042
  - CM043
  - CM044
