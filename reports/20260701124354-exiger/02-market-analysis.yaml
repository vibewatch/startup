- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  summary: The market expands when buyers move from static screening into a continuous loop of data enrichment, regulatory checks, sub-tier mapping, and remediation.
  data:
    nodes:
    - id: n1
      label: Supplier or counterparty enters workflow
      description: A vendor, customer, product, part, or software dependency must be vetted before or after engagement.
    - id: n2
      label: Normalize and enrich data
      description: Entity matching, ownership resolution, and part or component context are required before meaningful screening.
    - id: n3
      label: Screen against dynamic rules
      description: Sanctions, export controls, UFLPA, cybersecurity clauses, and ownership restrictions create changing rule sets.
    - id: n4
      label: Map sub-tier and provenance risk
      description: Multi-tier supplier, part, and software-dependency visibility determines whether hidden exposure exists.
    - id: n5
      label: Remediate, re-source, approve, or block
      description: Economic value comes from auditable action, not just a red-flag list.
    edges:
