  evidenceGaps:
  - type: missing-source
    severity: material
    topic: exiger-serviceable-market-sizing
    missingEvidence: A management-quality breakout showing how Exiger overlaps TPRM, SCRM, sanctions screening, and defense visibility without double counting.
    whyItMatters: Without overlap-adjusted category data, any public TAM or SAM becomes either too broad or falsely additive, which directly weakens valuation precision.
    diligencePath: Request management segmentation by product module, buyer vertical, and workflow, then reconcile it against the public category lenses used in TM002.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: defense-visibility-tam
    missingEvidence: A public or customer-backed standalone market size for defense-industrial supply-chain visibility and provenance software.
    whyItMatters: The defense wedge looks strategically important, but public policy sources describe demand drivers without isolating monetizable software spend.
    diligencePath: Ask management for federal and defense-prime pipeline data, contract examples, and win rates tied specifically to DIB visibility use cases.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-segment-mix
    missingEvidence: Current pricing architecture, contract values, and revenue mix by compliance, supply-chain, financial-institution, and defense customer segment.
    whyItMatters: Public market growth only matters to valuation if Exiger can monetize the relevant workflows at acceptable ACV and renewal economics.
    diligencePath: Request price books, sample MSAs or order forms, segment revenue mix, and cohort retention or expansion data from management.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: minor
    topic: classified-and-sensitive-deployment-patterns
    missingEvidence: Customer-validated evidence on how Exiger deploys into classified or otherwise highly sensitive defense and government environments.
    whyItMatters: Sensitive deployments can slow implementation, alter architecture, and cap how much of the defense wedge is immediately serviceable.
    diligencePath: Request cleared-customer references, architecture diagrams, and the controls used for evidence handling in sensitive programs.
    relatedQuestionRefs:
    - QM024
    - QM022
