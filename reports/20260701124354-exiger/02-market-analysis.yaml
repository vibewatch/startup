- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - CMMC Phase 1 and DFARS contract clauses
    - Driver
    - Current / multi-year
    - Turns cybersecurity assurance into a contract-gating requirement for DIB participants and their suppliers
    - Ask management what share of pipeline is directly tied to CMMC or DFARS-driven demand
  - - UFLPA enforcement and dashboard granularity
    - Driver
    - Current
    - Raises the value of item-level provenance, country-of-origin detail, and supplier traceability in import-heavy sectors
    - Request customer examples where CBP detention risk changed product demand or budget size
  - - OFAC and BIS screening volatility
    - Driver
    - Current / structural
    - Pushes buyers from one-time onboarding checks toward continuous sanctions and export-control monitoring
    - Ask how often Exiger customers rerun screening and how remediation workflows are staffed
  - - EO 14017, CHIPS, and national-security industrial policy
    - Driver
    - Structural
    - Legitimizes resilience, redundancy, and upstream component visibility as budget-worthy capabilities
    - Ask how much demand is traceable to resilience or reshoring programs versus pure compliance
  - - NDIS priorities and FOCI-disclosure expansion
    - Driver
    - Current / near-term
    - Strengthens the defense-visibility wedge by requiring deeper supplier and ownership transparency
    - Request evidence of federal and prime-contractor adoption tied to ownership or sub-tier disclosures
  - - AI-native automation and knowledge-graph workflows
    - Driver
    - Current / structural
    - Supports larger analyst throughput and faster remediation if accuracy is good enough
    - Ask for false-positive rates, analyst productivity lift, and time-to-remediation metrics
  - - Integration and data-quality burden
    - Constraint
    - Current / structural
    - Value depends on normalizing supplier, party, and part data across messy internal systems
    - Request implementation timelines, customer data-prep effort, and system-integration dependencies
  - - False positives and noisy screening outputs
    - Constraint
    - Current / structural
    - Manual review load can overwhelm compliance teams and reduce ROI even when coverage is broad
    - Request alert volumes, precision metrics, and tuning processes by workflow
  - - Budget cycles and incumbent workflows
    - Constraint
    - Current / structural
    - Procurement, compliance, and defense buyers often buy only after a trigger and can move slowly across functions
    - Request sales-cycle length by vertical and replacement versus greenfield mix
  - - Sensitive or classified defense data constraints
    - Constraint
    - Current / structural
    - Some deployment environments require auditable and carefully controlled data handling rather than simple SaaS rollout assumptions
    - Request architecture patterns, cleared-environment references, and evidence-handling controls
  notes: 'The strongest drivers are rule changes that force ongoing evidence collection, while the hardest constraints are operational: integrating data, suppressing noise, and fitting into long enterprise or federal buying cycles.'
