tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Third-party risk intelligence and due diligence
    - Vendor onboarding, due diligence, continuous monitoring, adverse media, ownership and relationship checks
    - Generic GRC modules with no third-party data or monitoring depth
    - Compliance, legal, risk, internal audit
    - Core Exiger wedge through TPRM, EDD, and supplier risk
  - - Trade compliance, sanctions, and KYC screening
    - Sanctions screening, export-control and debarment checks, KYC/KYB, transaction and counterparty screening
    - Payments processing, core banking, or transaction systems that do not provide compliance intelligence
    - Compliance, financial-crime, legal, trade-compliance teams
    - Important because Exiger explicitly packages screening and network analysis for regulated buyers
  - - Physical supply-chain risk management
    - Multi-tier supplier mapping, part and component provenance, disruption alerts, alternative sourcing, supplier resilience analysis
    - Pure logistics execution, warehouse management, freight marketplaces
    - Procurement, supply chain, operations, supplier quality
    - Important because Exiger sells part-level and supplier-level visibility rather than only entity scoring
  - - Defense-industrial supply-chain visibility
    - Adversarial supplier exposure, FOCI-related diligence, cyber and provenance checks for defense suppliers and components
    - General defense IT modernization spend with no supplier or provenance lens
    - Defense acquisition, program, cyber, industrial-base leaders
    - Strategic wedge because regulations and national-security policy make visibility mission-critical
  - - Software supply-chain security
    - SBOM analysis, provenance, open-source and firmware dependency visibility, software supplier assurance
    - Standalone application-security testing with no upstream component or supplier visibility
    - Cybersecurity, engineering, platform security
    - Included because Exiger markets software-supply-chain security as part of the same visibility problem
  - - Excluded adjacencies and status quo substitutes
    - N/A
    - ERP, payments, generic cybersecurity tools, logistics execution, manual spreadsheets, and one-time consultative reviews with no monitoring layer
    - Existing internal operations or incumbent point vendors
    - These are substitutes or neighboring budgets, not additive TAM unless they overlap with Exiger’s risk workflow
  notes: Boundary is intentionally workflow-based rather than category-label based. Spend is included only when it resolves supplier, counterparty, provenance, or compliance risk inside an auditable operating workflow.
