figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  summary: Exiger’s monetizable wedge narrows from several adjacent risk categories into a regulated visibility layer where supplier, compliance, and national-security workflows overlap.
  data:
    nodes:
    - id: n1
      label: Adjacent public categories
      description: Public sources size TPRM, SCRM, sanctions screening, and software or defense visibility as separate categories rather than one integrated market.
    - id: n2
      label: Regulated enterprise workflows
      description: The serviceable spend concentrates in buyers that face sanctions, forced-labor, cyber, and supplier-governance requirements rather than generic procurement digitization.
    - id: n3
      label: Multi-tier and provenance-heavy decisions
      description: Exiger’s differentiation depends on mapping below tier one, connecting ownership and part-level data, and turning screening into action.
    - id: n4
      label: Exiger serviceable wedge
      description: 'The tightest wedge is high-consequence procurement and compliance: banks, industrials, federal agencies, and defense programs with auditable visibility needs.'
  approximationNotes: This figure is qualitative by design. Retained public sources do not provide a clean, non-overlapping TAM/SAM/SOM stack for Exiger, so the layers represent narrowing serviceability rather than additive dollar buckets.
  claimRefs:
  - CM001
  - CM008
  - CM031
  - CM032
  - CM045
  - CM046
- id: FM002
  title: Market estimate range
  type: range
  summary: Supply-chain risk management is the only retained adjacent category with three directly comparable 2026 estimates, making it the best public range visualization for Exiger’s market context.
  data:
    items:
    - label: Supply-chain risk management market (2026, USD billions)
      low: 3.73
      mid: 5.85
      high: 6.9126
      note: Low = TBRC; mid = Fortune Business Insights; high = Coherent Market Insights.
  approximationNotes: The figure visualizes only the SCRM range because it has three directly retained 2026 values in one unit. TPRM and sanctions estimates remain in the table because their retained public lenses are less directly comparable.
