      - number: '2.2'
        title: 买方、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              Exiger 的买方图谱比经典银行合规故事更宽，但支出逻辑仍集中在掌握采购、合规、法律暴露、供应连续性和任务保障的团队。在金融机构，买方包括合规、金融犯罪、法律和风险团队，它们需要把
              KYC、制裁筛查、调查和第三方控制放进一个可审计工作流。大型工业和关键基础设施公司里，经济买方转向采购、供应链风险、供应商质量和贸易合规负责人，他们需要看到一级供应商以下，以及零部件、材料和司法辖区之间的风险。国防领域，采购、项目、网络和工业基础团队购买的是合同资格、对抗性供应商暴露和来源风险，而不只是通用效率目标。因此采用路径由工作流牵引：先准入和筛查，再持续监控，然后是补救、重新寻源和韧性管理。多职能归属会影响估值，因为
              Exiger 的收入机会取决于风险工具能否嵌入运营决策，而不只是合规部门是否为另一条观察名单数据流编预算。
