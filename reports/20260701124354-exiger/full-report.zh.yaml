      - CE018
      - CE020
      - CE022
      - CE034
  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Exiger 方案
      - 可衡量收益
      - 限制
    rows:
      - - 第三方准入与交易对手尽调
        - 核验实体身份、筛查负面信息，并记录风险判断依据
        - DDIQ 加上 OpenCorporates 支撑的核验和可配置风险规则
        - 尽调档案更一致；Exiger 称，更好的核验可使下游误报减少 >80%
        - 公开证据在工作流叙事上强于经审计的精确率或召回率
      - - 持续供应商与制裁监控
        - 批量筛查供应商、客户或代理，覆盖制裁、执法和负面媒体
        - WorldCompliance 支撑的筛查，结合 Exiger 监控和案件工作流
        - 更新更快、画像更结构化，大规模对象的人工复核更少
        - 输出质量仍取决于第三方数据质量和客户分流政策
      - - 多层级供应商映射与中断响应
        - 映射依赖、识别关键下级供应商，并在中断发生时寻找替代方
        - 1Exiger 加上 Supply Dynamics、Versed AI 和 XSB 衍生数据资产
        - 提供更丰富的零件、材料和供应商级可见度，并支持指向性采购或替代寻源路径
        - 公开材料未披露生产延迟、覆盖错误率或客户上线投入
      - - 工程文档与零件分析
        - 从静态 PDF 提取零件需求，并比较替代件或淘汰风险
        - Digital Thread 和 Parts Intelligence 加上 XSB 图谱资产
        - 将死文本工程文件转成机器可读数据，并可导出到下游系统
        - 需要吞吐量、准确率以及人工纠正抽取数据频率的证据
      - - 受监管公共部门供应链运营
        - 在安全约束严格的联邦工作流中运转，同时满足采购和合规需求
        - 获 FedRAMP 授权的 Exiger Federal Cloud、Carahsoft 渠道和 AWS 分发
        - 支撑安全部署路径和更广的联邦互操作主张
        - 公开材料未提供按机构划分的实施时间线或可靠性指标
    notes: 收益结合官方结果主张与第三方佐证；应理解为工作流潜力，而不是每个客户都经过审计的 ROI。
