            body: >-
              Exiger
              的公开估值支撑只是一段基于不完整输入的区间。正面看，公司有真实规模说法、反复出现的产品认可、主要赞助方背书，以及软件主导定位；如果利润率和留存强，可能支撑更高的分析平台估值倍数。公开可比公司展示了投资者应记住的离散度。Dun
              & Bradstreet 的公开数据基于 Clearlake 私有化收购报道，隐含较低增长的数据与分析底部，约为 3.2x 营收；Verisk 的公开市场画像则显示，一个规模化、更高质量分析平台约为 7.6x
              过去 12 个月营收。把这一公开可比框架套到 Forbes 报道的 >$150M 收入下限上，可得到约 $480M 到 $1.14B 的粗略隐含支撑区间。方向上有用，但不具决定性，因为 Exiger
              未披露利润率画像、净留存、分部组合、现金消耗、资金续航期，或 Carlyle 和 Insight 的进入估值。因此投资者回报预期是有条件的，而非已验证的：上行要求 Exiger 的经济性更像软件 /
              分析平台，而不是服务占比高的合规并购整合体；如果政府集中度或收购整合比当前公开资料显示的更重大，下行仍然可能。
