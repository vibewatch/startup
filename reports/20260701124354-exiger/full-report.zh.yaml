      - number: '1.5'
        title: 展项
        blocks:
          - type: callout
            title: 合规根基带来的数据可信度，让供应链转向更可信
            body: >-
              Exiger 并非从通用供应链仪表盘公司起步。公开材料显示，其长期脉络来自尽调和金融犯罪，DDIQ、Insight 3PM 以及银行 / 监管工作流都早于 1Exiger 发布。这段历史很重要，因为当前 AI
              与供应链卖点并不是一次近期改名撑起来的，而是建立在多年实体解析、风险评分和分析师主导的合规运营之上。
