      - number: '2.3'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Exiger 所处工作流周围存在真实且增长中的市场，但不支持一个干净的单一 TAM 数字。仅第三方风险管理类别，在保留的 2026 年估计中就介于约 $8.09B 到 $9.34B；更宽的
              Grand View 视角强调北美集中度和长期增长，而不是可直接比较的 2026 年点值。供应链风险管理更分散：保留的 2026 年数值从 $3.73B 到 $6.91B
              不等，取决于发布方强调核心软件与服务支出，还是更宽的解决方案边界。制裁筛查是反对虚假精确的最清晰警告，因为保留的 2026 年市场既可能小到仅软件筛查约 $587M，也可能大到更宽筛查方案
              $4.2B。这些数字只有分开看才有用。不能把它们相加成一个 Exiger TAM，因为类别在买方、工作流和产品范围上重叠。最站得住脚的结论是：Exiger
              处在几个中等规模、快速增长类别的交汇处，其中国防工业可视性楔子在战略上尤其重要，但在公开市场规模数据中无法干净剥离。
