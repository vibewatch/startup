  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与优先级
        blocks:
          - type: paragraph
            body: >-
              Exiger
              的公开风险栈不是由单一生死问题主导，而是一组可能相互叠加的关联暴露。概率最高的商业风险，是更大平台带来的竞争性打包压力、政府和受监管企业账户中的采购滑坡，以及多个被收购数据或映射资产并入一个运营平台时的集成拖累。严重度最高的风险则不同：制裁、出口管制、强迫劳动或涉及隐私的筛查若出现重大错误，可能直接给客户带来责任和声誉损害；隐藏的政府集中度也可能让增长看起来比实际更多元。保留来源也显示了真实缓释因素。FedRAMP
              授权、公开 DPA、合同载体入口、AWS Marketplace 可用性和赞助方资本，都表明 Exiger 并非在受监管市场里临场摸索。但同一组信号也说明为何资料需要谨慎：联邦渠道拉长销售周期，AI
              主导主张抬高精度预期，赞助方所有权让时间表和退出条件在公开指标完全披露前就变得重要。
