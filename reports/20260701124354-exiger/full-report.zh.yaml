          detail: 更多服务、审计和支持工作压缩经济性。
        - id: valuation
          label: 估值压缩
          tier: consequence
          detail: 集中度不透明和效率走弱降低倍数支撑。
      edges:
        - from: gov_conc
          to: bookings
          label: 机构预算和任务订单时点决定成交日期
        - from: accuracy
          to: compliance_cost
          label: 客户争议或监管审查触发补救
        - from: integration
          to: bookings
          label: 路线图噪音拖慢销售信心和部署
        - from: exit_env
          to: valuation
          label: 财务赞助方变现遭遇披露摩擦
        - from: bookings
          to: margin
          label: 增长延迟迫使销售和支持投入加重
        - from: compliance_cost
          to: margin
          label: QA、审计和法律工作抬高服务成本
        - from: margin
          to: valuation
          label: 软件质量画像下降削弱倍数支撑
        - from: bookings
          to: valuation
          label: 增长波动削弱退出叙事
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 这张图展示外部渠道、监管方和并购资产如何位于 Exiger 平台与收入实现之间。
    approximationNotes: 该图显示公开材料中有证据支撑的结构性依赖；它不意味着排他性，也不量化合同敞口。
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR007
      - CR011
      - CR024
      - CR026
      - CR028
      - CR029
      - CR030
      - CR042
      - CR043
      - CR044
    data:
      nodes:
        - id: exiger_platform
          label: Exiger 平台
          tier: core
          detail: 1Exiger 加上并购来的数据和工作流层。
        - id: federal_buyers
          label: 联邦 / DIB 买家
          tier: customer
          detail: 政府和国防相邻用户。
        - id: contract_routes
          label: 合同工具 + Carahsoft
          tier: channel
          detail: 公共部门正式采购路径。
        - id: aws_route
          label: AWS Marketplace
          tier: channel
          detail: 云采购和发现路径。
        - id: fedramp
          label: FedRAMP 资质
          tier: control
          detail: 支撑公共部门信任的安全资质。
        - id: reg_rules
          label: OFAC / BIS / CBP 规则
          tier: control
          detail: 动态外部合规输入。
        - id: acquired_assets
          label: Supply Dynamics + XSB + Versed AI 资产
          tier: asset
          detail: 并购来的映射和数据层。
        - id: revenue_realization
          label: 收入实现
          tier: outcome
          detail: 订单额转化为可部署的经常性收入。
      edges:
        - from: contract_routes
          to: federal_buyers
          label: 合同工具和转售渠道支持采购
        - from: aws_route
          to: federal_buyers
          label: Marketplace 可缩短部分步骤，但不能缩短全部
        - from: fedramp
          to: federal_buyers
          label: 安全资质支撑信任和准入资格
        - from: reg_rules
          to: exiger_platform
          label: 外部名单和规则塑造筛查义务
        - from: acquired_assets
          to: exiger_platform
          label: 数据与映射能力完成整合
        - from: exiger_platform
          to: revenue_realization
          label: 产品表现必须撑住续约和扩张
        - from: federal_buyers
          to: revenue_realization
          label: 预算和任务订单时点影响回款
        - from: contract_routes
          to: revenue_realization
          label: 渠道吞吐影响成交速度和执行
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Exiger 的公开估值案例是一条证据链：真实规模和品类证明存在，但被经济性不透明和更高的 2026 年退出门槛部分抵消。
    data:
      nodes:
        - id: scale
          label: 已验证规模
          detail: 2026 年材料公开了 550+ 客户、150 家 Fortune 500 关系和 60+ 政府 / DIB 机构。
        - id: proof
          label: 溢价信号
          detail: AWS Marketplace 可用性、Hackett 认可和财务赞助方支持，支撑其战略相关性。
        - id: denominator
          label: 报道中的分母
          detail: Forbes 报道 2024 年收入 >$150M、五年 CAGR >80%。
        - id: opacity
          label: 经济性不透明
          detail: ARR、毛利率、NRR、服务占比和财务赞助方条款仍未披露。
        - id: exit
          label: 2026 年退出门槛
          detail: 私募股权退出更慢，买家对软件估值更挑剔。
        - id: call
          label: 推荐
          detail: 在管理层补上分母缺口之前，建议继续研究，估值立场保持收紧。
      edges:
        - from: scale
          to: proof
          label: 支撑
        - from: proof
          to: denominator
          label: 有助证明
        - from: denominator
          to: opacity
          label: 仍取决于
        - from: opacity
          to: exit
          label: 撞上
        - from: exit
          to: call
          label: 推动
    approximationNotes: 该图是决策逻辑，不是流程图；它把证据链可视化：公司具备可投性，但估值支撑仍有条件。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV031
      - CV039
      - CV040
      - CV041
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值测算最敏感的不是漏斗顶端需求，而是收入底数和业务组合。
    data:
      items:
        - label: 当前收入证据
          value: 10
        - label: 毛利率 / 服务收入占比
          value: 9
        - label: 财务赞助方条款 / 杠杆
          value: 9
        - label: 公共部门集中度
          value: 8
        - label: 留存与 cohort 质量
          value: 8
        - label: 退出倍数环境
          value: 7
    approximationNotes: 柱形是基于保留证据集综合出的 0-10 序数敏感度评分。它们展示哪些缺失事实最能撬动估值，而不是已量化的经营 KPI。
    claimRefs:
      - CV031
      - CV032
      - CV039
      - CV040
      - CV041
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 只有当 Exiger 退出时收入底数显著扩大、且仍守住溢价倍数，财务赞助方的回报账才说得通。
    data:
      items:
        - label: 悲观
          low: 600
          mid: 700
          high: 850
          note: 收入 200M，退出估值约落在 3.0x 到 4.25x。
        - label: 基准
          low: 1350
          mid: 1513
          high: 1700
          note: 收入 275M，结果约落在 4.9x 到 6.2x。
        - label: 乐观
          low: 2350
          mid: 2625
          high: 3000
          note: 收入 350M，结果约落在 6.7x 到 8.6x。
    approximationNotes: 区间是与乐观、基准、悲观情景绑定的示意性退出价值带，不是点估计。目的在于说明，以 $1.2B 为起点，容错空间有多小。
    claimRefs:
      - CV031
      - CV032
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Exiger 在市场需求和产品验证上得分不错，但公开证据质量不足，难以支撑溢价估值。
    data:
      items:
        - label: 市场需求
          value: 8
          unit: /10
          note: 监管、地缘政治和采购复杂性明确支撑需求。
        - label: 产品验证
          value: 7
          unit: /10
          note: AWS、Hackett 和客户规模信号支撑其适配度和成熟度。
        - label: 渠道护城河
          value: 7
          unit: /10
          note: 联邦业务深度和渠道扩张是优势，但还不能证明定价权可长期守住。
        - label: 收入可见性
          value: 4
          unit: /10
          note: 公开可得的最佳收入分母仍是第三方报道的 2024 年下限。
        - label: 单位经济可见性
          value: 3
          unit: /10
          note: ARR、毛利率、NRR 和服务收入占比仍未披露。
        - label: 估值支撑
          value: 4
          unit: /10
          note: 报道中的估值可能合理，但必须有公开材料尚未提供的证据来支撑。
        - label: 退出可行性
          value: 5
          unit: /10
          note: 战略买家有胃口，但 2026 年软件退出环境会挑项目。
    approximationNotes: 这些是基于保留公开证据综合出的投资测算就绪度评分，不是管理层或董事会指标。
    claimRefs:
      - CV009
      - CV010
      - CV031
      - CV039
      - CV040
      - CV041
      - CV050
