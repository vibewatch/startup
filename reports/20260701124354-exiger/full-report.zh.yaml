  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              定义 Exiger
              市场的最干净方式，不是“所有合规软件”或“所有供应链软件”，而是更窄的一组工作流：组织必须知道供应商、交易对手、产品、零部件、组件或软件依赖到底是谁；它带来什么法律或运营风险；以及下一步该采取什么行动。Exiger
              自身的平台定位在这组问题上异常宽：它把供应商、产品、零部件、组件和风险数据接在一起；明确横跨实体与软件供应链；并销售面向贸易合规、供应商风险管理、增强尽调、第三方风险管理和 KYC
              工作的风险与合规模块。因此，纳入支出从第三方和供应商尽调、制裁与贸易筛查、多层级供应链映射，以及软件来源或 SBOM 驱动的可视性开始。如果通用
              ERP、支付处理、独立网络安全点工具或物流执行软件没有在解决供应商、所有权、来源或合规风险，就不应纳入。可服务的楔子因此是受监管合规工作与高风险采购可视性的交集，而不是触及采购或风险的每一美元。
