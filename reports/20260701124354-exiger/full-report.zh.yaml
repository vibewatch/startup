    rows:
      - - Dun & Bradstreet
        - 上市公司，直至 2025 年 8 月私有化
        - 最后已知市值 $4.08B，TTM 收入 $2.40B
        - ~1.7x 市值 / 收入代理倍数
        - 大型风险和商业数据平台，为数据分析估值提供低增长下限。
        - 资产成熟、增长较慢，利润率和服务画像不同；私有化机制也不等同于资方成长型交易。
      - - NICE
        - 上市
        - 市值 $5.58B，TTM 收入 $2.94B
        - ~1.9x 市值 / 收入代理倍数
        - 相邻工作流与合规软件厂商，显示低区间工作流定价。
        - 客户体验和联络中心敞口使其只具备部分可比性。
      - - TransUnion
        - 上市
        - 市值 $14.06B，TTM 收入 $4.72B
        - ~3.0x 市值 / 收入代理倍数
        - 有规模的数据与风险决策厂商，提供中区间公开市场基准。
        - 征信局经济性和消费者数据组合不同于 Exiger 的供应链工作流取向。
      - - Verisk
        - 上市
        - 市值 $24.06B，TTM 收入 $3.10B
        - ~7.8x 市值 / 收入代理倍数
        - 高端分析和风险数据公司，是最清晰的公开高端类比。
        - 披露更充分、利润率质量更高、保险数据积累更久，当前相对 Exiger 可能应有溢价。
      - - Moody's
        - 上市
        - 市值 $79.76B，TTM 收入 $7.87B
        - ~10.1x 市值 / 收入代理倍数
        - 展示市场会为顶级信息服务经济性和持久数据护城河支付什么价格。
        - 评级和基准数据在结构上更根深蒂固，也比 Exiger 当前披露的画像更赚钱。
      - - Chainalysis
        - 私有
        - $170M F 轮融资
        - 2022 年估值 $8.6B
        - 显示投资人愿意追捧合规属性重、与政府和金融机构相关的数据平台。
        - 加密货币敞口、品类热度和不同客户组合，使该估值不能不打折就迁移。
      - - Interos
        - 私有
        - $100M C 轮融资
        - 2021 年估值 >$1B
        - 这是图谱驱动韧性平台的有用供应链风险邻接样本。
        - 时间较久、规模较小，且没有保留公开收入披露。
      - - Sayari
        - 私有
        - TPG 战略性多数股权投资 $235M
        - 保留的公开新闻稿未披露估值
        - 证实资方对政府相关交易对手和供应链风险情报有兴趣。
        - 保留材料没有公开估值或收入分母。
      - - Recorded Future
        - 并购
        - Mastercard 收购公告
        - 2024 年约定收购价值 $2.65B
        - 表明战略买家愿意为有规模、与政府和企业相关的情报资产付费。
        - 网络威胁情报终端市场不同，保留收入未披露，限制直接倍数迁移。
    notes: 公开公司行使用保留市场数据页面里的市值 / 往绩收入简化代理倍数，不是完全调整后的企业价值。私有和并购行即便保留公开来源未披露收入，也作为战略参照纳入。
