        - OpenCorporates、WorldCompliance 和其他外部数据供应商
        - 外部记录不完整、过期或匹配错误，可能制造误报或漏报
      - - 供应链图谱与零件情报层
        - 在工程和采购场景中映射供应商、零件、材料、文档和多层级关系
        - Exiger 自有图谱，加上 XSB、Supply Dynamics 和 Versed AI 数据资产
