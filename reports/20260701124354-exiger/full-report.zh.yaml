      - number: '1.2'
        title: 领导层、创始人归属与治理
        blocks:
          - type: paragraph
            body: >-
              领导层比创始人归属更清楚，而这一区分很重要。当前公开材料明确把 Brandon Daniels 标为 CEO，也是 Exiger 在 AI、国防和增长议程上的主要公开声音。但已审阅来源不支持 Daniels 在
              2013 年共同创办公司的说法。相反，最强官方记录显示 Michael Cherkasky 和 Michael Beber 是创始人，Daniels 于 2017 年加入，并在 2022 年接任
              CEO。这次交接重要，因为它解释了为什么当前品牌信息虽然创始人色彩较弱，创始人影响力似乎仍然重要。Carrie Wibben、Cameron Holt 和 Eli Cherkasky
              等公开可见的运营者显示，Exiger 现在在产品整合、联邦交付和运营上已有更成熟的班底。明显偏薄的是 2023 年之后的当前治理资料：公开材料没有提供 Carlyle 和 Insight
              多数股权投资之后的完整董事名单、投票权摘要或详细控制图。尽调视角下，管理质量看起来强，但管理团队背后的控制结构仍只露出一部分。
