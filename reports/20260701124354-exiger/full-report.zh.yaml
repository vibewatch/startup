        - CISO / GC / CEO -> 董事会 -> 投资委员会
        - 暂停流程，直到 RCA、补救计划和客户影响评估完成。
      - - 公开市场 / 赞助方退出风险
        - 资本重组动作、融资延迟或公开发行环境疲软
