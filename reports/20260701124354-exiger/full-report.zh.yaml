        - 重要性在于，Exiger 明确为受监管买方打包筛查和网络分析
      - - 实体供应链风险管理
        - 多层级供应商映射、零部件和组件来源、扰动预警、替代采购、供应商韧性分析
        - 纯物流执行、仓库管理、货运市场
        - 采购、供应链、运营、供应商质量
        - 重要性在于，Exiger 销售零部件级和供应商级可见性，而不只是实体评分
      - - 国防工业供应链可见性
        - 对抗性供应商暴露、涉 FOCI 尽调、面向防务供应商和组件的网络与来源核查
        - 没有供应商或来源视角的通用防务 IT 现代化支出
        - 防务采购、项目、网络、工业基础负责人
        - 战略楔子，因为法规和国家安全政策让可见性成为任务关键
      - - 软件供应链安全
        - SBOM 分析、来源、开源和固件依赖可见性、软件供应商保证
        - 没有上游组件或供应商可见性的独立应用安全测试
        - 网络安全、工程、平台安全
        - 纳入原因是 Exiger 将软件供应链安全作为同一个可见性问题来营销
      - - 排除的相邻领域和现状替代方案
        - N/A
        - ERP、支付、通用网络安全工具、物流执行、手工电子表格，以及没有监控层的一次性咨询审查
        - 现有内部运营或在位点状供应商
