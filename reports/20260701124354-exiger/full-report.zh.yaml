      - number: '5.4'
        title: 差异化、成熟度与技术风险
        blocks:
          - type: paragraph
            body: >-
              护城河论点在既有厂商止步于实体筛查或通用供应商评分的地方最强。Exiger 如今有一个更颗粒化的故事：工程文档抽取、零部件属性情报、多层级映射、嵌入式 Snowflake
              工作流，以及替代寻源或定向采购等采购导向执行路径。与单纯制裁数据库或负面媒体数据流 相比，这是明显不同的技术命题。风险在于，Exiger 围绕智能代理式和可解释 AI
              的公开雄心，跑在可供承销的公开工程证据之前。已审阅资料没有公布准确率与召回率、假阴性率、漂移监控、公平性测试，或 AI 决策的详细覆盖与审计日志。定价仍不透明，ORCA
              命名在公开包装中未解，公司也没有发布参考架构或 SLA 历史，无法简化对部署投入的尽调。因此 Exiger
              像一个差异化、数据丰富的工作流平台，但买方在假设低摩擦采用之前，仍需对黑箱风险、上游数据质量和实施复杂度做更深尽调。
