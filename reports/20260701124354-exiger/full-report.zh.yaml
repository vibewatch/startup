        - 采购渠道于 2026 年 3 月公开
        - 渠道可用性，不是列表价
        - SKU 定价、私有报价和 Marketplace 抽成都未披露
        - Marketplace 可降低采购摩擦，但不会让实际成交价透明
        - Exiger AWS Marketplace 发布
      - - 1ExigerAI 成果示例
        - ROI 以运营成果呈现，而非披露费用
        - 成果证明，不是价格
        - 无法判断 Exiger 能从节省额中拿到多少经济收益
        - 价值销售可能强于可见的价格透明度
