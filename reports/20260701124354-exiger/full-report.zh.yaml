      - number: '8.3'
        title: 乐观、基准、悲观与退出算术
        blocks:
          - type: paragraph
            body: >-
              情景测算指向纪律。在乐观情形下，Exiger 当前收入已显著高于报道的 2024 年收入底线，维持软件驱动增长，展现强留存，并在市场仍愿意为可防守风险数据支付高溢价分析倍数时退出。这样可能产生资方可接受的 2x
              以上结果。但在基准情形下，Exiger 增长足以证明业务有价值，却不足以在今天入场价格上拿到扎实超额收益；低于 $300 million
              的收入基数上给一个中个位数退出倍数，只会较报道估值带来温和上行。在悲观情形下，公共部门集中、收购整合拖累、服务占比或倍数压缩叠加，可能让公司价值低于成本。2026
              年私募股权退出背景进一步抬高门槛，因为买方更挑剔，软件倍数较高峰年份压缩，持有期拉长会压低资方 IRR，即便总 MOIC 仍为正。简单说，估值令人失望并不要求 Exiger
              是坏业务；它只需要是一门好业务，但还不够高溢价。
