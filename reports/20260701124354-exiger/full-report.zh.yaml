chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、根基与平台转向
        blocks:
          - type: paragraph
            body: >-
              把 Exiger 的公司概览当作一段演进来看，而不是一张白纸上的 AI
              创业公司，叙事最有说服力。更早的官方公告和伙伴案例显示，公司最初围绕银行、企业和政府机构的监管、金融犯罪和尽调工作流搭建。DDIQ、Insight 3PM
              以及相邻风险产品，打下了数据摄取、实体解析和分析师引导运营能力，后来供应链转向才显得可信。到 2023 年 9 月，管理层已把公开叙事收拢到 1Exiger；到 2026
              年，当前网站更明确地把公司定义为面向供应链执行、采购加速和合规自动化的 AI 原生操作系统。重新定位没有抹去公司根基，而是重新包装了这些能力。能被证据支撑的主线是：Exiger
              以合规级信息处理和风险判断为地基，搭出一个更宽的平台，如今承诺在供应商、产品和零部件数据上提供多层级可视性、决策支持和工作流编排。结果是一家公司仍带着监管科技 DNA，但当下市场打法已经围绕供应链 AI 展开。
