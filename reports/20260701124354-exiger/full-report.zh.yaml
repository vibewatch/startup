  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格支撑与披露质量
        blocks:
          - type: paragraph
            body: >-
              公开记录能确认的是，Carlyle 和 Insight 在 2023 年末入股 Exiger，独立交易报道给出的估值约为 $1.2
              billion；但资方和公司官方公告仍未披露价格、持股比例、杠杆或优先权结构。关键在于，最重要的分母仍是一项第三方报道的管理层说法：Forbes 2024 年 3 月写道，Exiger 预期 2024
              年底收入超过 $150 million，且此前五年年复合增长超过 80%。以此为底线，报道的 $1.2 billion 估值约等于 8.0x
              收入；差异化风险数据平台拿这个价格并非明显不合理，但也绝不便宜。2026 年 AWS 和 Hackett 材料显示 550+ 客户、150 家 Fortune 500 关系、60+ 政府和 DIB
              机构，以及采购场景，强化了质量叙事。但 ARR、毛利率、留存、服务占比、现金流画像和公共部门集中度仍未披露。因此，核心估值判断取决于证据，而不是公司质量本身：Exiger
              也许配得上溢价估值，但当前公开材料还没有证明。
