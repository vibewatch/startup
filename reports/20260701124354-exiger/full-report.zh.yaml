  - id: TV005
    title: 论点失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入分母不及预期
        - 当前 TTM 收入仍接近 2024 年 >$150M 下限
        - 报告中的 $1.2B 估值仍接近 8x 下限倍数，而不是压缩到更合理区间。
        - 把估值视为偏高，要求重新定价，或拿出更强的结构化上行案例。
      - - 软件占比不及预期
        - 服务或分析师主导支持占毛利很大一部分
        - Exiger 看起来更像技术赋能服务平台，而不是高端分析平台。
        - 把可比区间下调至工作流或服务占比较高的厂商。
      - - 政府集中度较高
        - 公共部门或少数联邦项目占 ARR 或毛利很大份额
        - 续约波动和采购时点成为一阶估值驱动因素。
        - 施加集中度折价，并要求看到合同级续约可见性。
      - - 资方条款限制上行
        - 杠杆、清算优先权或股权结构把经济性从新资金股权一侧挪走
        - 总企业价值看起来可以接受，但股权回报仍可能令人失望。
        - 推进前按完全稀释股权口径重做回报测算。
      - - 退出市场仍挑剔
        - 2026-2027 年，买方仍偏好盈利能力，并给普通增长打折
        - 如果退出倍数持续压缩，即便业务稳健，也可能达不到资方回报目标。
        - 按更长持有期和更低退出倍数区间承销。
    notes: 终止触发因素聚焦估值传导，而不是运营噪音；每一项都可能击穿回报测算，即使 Exiger 的产品相关性并未被证伪。
    claimRefs:
      - CV031
      - CV039
      - CV040
      - CV041
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入和 ARR
        - 经审计的 2025 年收入、当前 TTM 收入、当前 ARR，以及分部桥接
        - 这是每个估值和回报结论的分母。
        - CFO 数据包和收入质量桥接。
      - - 毛利率和软件占比
        - 按分部拆分的毛利率，以及软件与服务的收入和毛利组合
        - 决定高端分析可比公司是否适用。
        - 财务尽调和产品线 P&L 审查。
      - - 留存和集中度
        - 毛留存和净留存、前 20 大客户集中度、公共部门集中度
        - 厘清耐久性，也判断政府深度到底是护城河还是集中度风险。
        - 收入运营数据包和队列分析。
      - - 资方条款和股权结构表
        - 入场估值、所有权拆分、杠杆、清算优先权和员工期权摊薄
        - 总价值支撑仍可能无法带来可接受的股权回报。
        - 法律和股权结构尽调，并审阅资方附函。
      - - 收购整合
        - Supply Dynamics、XSB 和 Versed AI 的收入留存与协同兑现
        - 整合成败决定规模能否转化为持久经济性。
        - M&A 尽调，附被收购产品和客户桥接。
      - - 退出路径证据
        - 战略买家图谱、IPO 准备度视图和潜在买家异议
        - 资方回报预期依赖可信流动性路径，不只靠增长。
        - 董事会材料、投行视角和买家访谈计划。
    notes: 每项要求都瞄准估值决策，而不只是丰富叙事。公开记录已经足以证明市场相关性，却恰好在承销需要精确的地方偏弱。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV046
