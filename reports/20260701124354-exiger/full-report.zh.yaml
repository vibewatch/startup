      - number: '5.2'
        title: 数据引擎、集成与运营架构
        blocks:
          - type: paragraph
            body: >-
              Exiger 最清楚的技术差异化，是把图谱级数据资产与企业工作流集成结合起来。供应链产品页称公司 API 优先，并把开放 API、AI 驱动 ETL，以及双向 ERP 和 PLM
              互操作性，与一个懂产品的知识图谱结合起来；该图谱覆盖 10B 条记录、400M 个零部件属性和 6.5M 条映射关系。收购路径让这一说法更可信。Supply Dynamics 增加物料级和第 n 层可视性；XSB
              增加零部件情报、知识图谱和 API 溯源；Versed AI 增加自动 n 层映射和 BOM 生成表述，服务那些还没有干净技术包的客户。Snowflake 嵌入和 AWS Marketplace
              分销又给出一个重要线索：Exiger 想坐进既有企业数据底座，而不是留作断开的仪表盘。因此技术图景是一层数据很重的编排层，不是一条简单筛查 数据流；但其表现仍取决于数据质量、连接器覆盖和可解释决策。
