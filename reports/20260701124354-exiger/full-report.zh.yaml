  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Exiger 并不在一个整齐的软件盒子里竞争。买方可以用数据驱动的筛查供应商、工作流优先的 TPRM 套件，或图谱驱动的供应链情报平台，解决这项工作中彼此重叠的部分。当采购中心想要制裁、KYC、AML
              或尽调情报时，Dun & Bradstreet、LSEG、LexisNexis Risk Solutions、Sayari 和 K2 Integrity
              重要。买方主要需要在运营工作流里完成准入、问卷、审批和持续供应商监控时，Coupa、ProcessUnity、Aravo、Ivalua 和 Supply Wisdom
              重要。当买方相信真正风险藏在一级供应商以下，希望做网络映射、所有权解析或关键节点可视性时，Sayari 和 Interos 最重要。这种分裂解释了为什么 Exiger
              的卖点比经典供应商风险软件更宽。它的公开材料把一套平台描述成供应链情报、工作流执行以及联邦或国防级部署叙事的组合。替代竞争者不只是另一家独立供应商，也可能是一套可组合栈：买方把筛查数据集与采购套件配在一起，接受更窄但更便宜的运营模型。
