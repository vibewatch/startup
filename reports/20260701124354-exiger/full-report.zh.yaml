      - number: '8.4'
        title: 决策、否决触发项与最终尽调
        blocks:
          - type: paragraph
            body: >-
              基于公开记录，正确结论是继续研究，而不是买入。Exiger 的规模、资方质量和品类契合度足以让它仍具可投性，但披露的经济性不足以支撑对 $1.2 billion
              入场价的高确信度承销。最干净的反命题不是需求造假，而是估值支撑依赖不透明的私人收入、未知的软件与服务占比、不清楚的政府集中度，以及公开材料看不见的资方控股动态。因此，尽调计划应少做宽泛市场验证，多做分母证明：当前
              TTM 收入、ARR、分部增长、毛利率、NRR、联邦集中度、客户集中度和确切资方条款。否决触发项也很具体。如果当前收入仍接近 2024
              年底线，公共部门收入高度集中，服务贡献了相当比例的毛利，或资本结构给新资金留下的上行有限，估值很快就会显得过高。相反，如果公司能证明当前收入显著更高、具备高溢价软件式经济性，并有可信的战略出售或 IPO
              路径，同一组公开证据就能从偏贵转为合理。
