  - number: 4
    title: 财务状况
    sections:
      - number: '4.1'
        title: 收入模型、定价不透明与分销
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个软件主导的企业收入模型，但不支持透明的定价模型。Exiger
              的首页、产品页面和公共部门材料都描述了一套统一平台，为企业和政府买方映射供应商、产品、零部件、组件和风险数据。公司还在多篇公告中把自己描述为 SaaS 或供应链 AI 公司，而不是咨询驱动的外包商；2023 年向
              Capgemini 剥离业务进一步强化了这一定位，把旧 FCC 咨询部门 与核心第三方风险和供应链技术业务分开。与此同时，已审阅的每一个商业入口仍由销售驱动。核心平台没有公开标价、自助席位
              模型或披露的使用量计费。2026 年 3 月 AWS Marketplace 上线重要，因为它缩短采购摩擦，可能扩大渠道驱动扩张，但仍不披露实际 SKU 定价或已实现合同条款。因此正确的财务解读不是 Exiger
              缺乏货币化纪律；而是公开资料只展示收入引擎的形状——企业合同、政府采购和模块扩张——没有展示这些动作如何转化为耐久收入质量的真实经济性。
