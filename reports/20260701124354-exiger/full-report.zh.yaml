  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - 1Exiger 供应链工作台
        - 采购、供应链、合规团队
        - 产品化呈现清晰，公开证据较充分
        - 在一个工作台里打通供应商、零件、材料和风险视图，而不是只给点状警报流
        - 需要公开的逐模块架构和 SLA 证据
      - - DDIQ 尽调引擎
        - 风险、合规、入职审核、KYC 分析师
        - 成熟的传统产品界面
        - AI/NLP 驱动的尽调画像聚合观察名单、付费新闻、开放网络和专有名单，并用可配置风险规则串起来
        - 需要公开精确率 / 召回率和工作流级基准披露
      - - 1ExigerAI 智能体执行层
        - 供应链、采购和运营负责人
        - 较新的 2026 年旗舰叙事
        - 从洞察走向执行：人机协同分流、集中式工作流和量化用例主张把动作串起来
        - 需要透明的治理指标，覆盖可解释性、漂移和审批阈值
      - - WorldCompliance 支撑的筛查数据
        - 合规与制裁团队
        - 外部数据资产，并非 Exiger 自有 IP
        - 结构化制裁、执法、负面媒体和所有权数据拓宽 Exiger 的合规覆盖，也降低人工筛查摩擦
        - 需要合同级可见度，判断工作流质量有多依赖外部数据新鲜度和授权
      - - XSB / Digital Thread 与 Parts Intelligence
        - 工程、物流、采办、保障团队
        - 具备具体数据资产的战略差异化点
        - 增加零件级和文档转数据智能、SWISS API 潜力，以及 100M+ 零件覆盖，超出只看实体的风险工具
        - 需要证据说明 XSB 技术栈深入整合到核心 UI 和数据模型的程度
      - - Supply Dynamics / SDX 多层级映射
        - 制造、寻源和工业基础团队
        - 战略差异化点，整合故事较早但具体
        - 增加实时项目级可见度、N 层映射和原材料细节，强化 Exiger 的数字线程主张
        - 需要 2022 年收购后商业可用性、性能和采用情况的最新证据
      - - Versed AI 多层级可见性
        - 供应链战略与韧性团队
        - 新增能力，但公开运营证据较薄
        - 增加 AI 驱动的复杂 N 层网络映射，并可基于公开和开源内容自动生成 BOM
        - 需要公开映射准确率、刷新频率和误报率基准
      - - ORCA 品牌界面
        - 现有和潜在 Exiger 买家
        - 2026 年公开材料中定位不清
        - 如果 ORCA 仍然存在，已审阅材料中没有把它作为独立产品页清楚展示；这暗示品牌可能已并入更宽的 1Exiger 话语
        - 需要 Exiger 澄清产品分类，避免夸大其独立能力
    notes: 状态反映公开证据深度和商业化清晰度，不等同于私人架构评审或客户满意度审计。
