      - number: '7.3'
        title: AI / 数据准确性、合规、网络安全与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              这是本章的核心怀疑视角。Exiger 对外卖的是预测式、AI 驱动的风险图谱和风险识别；商业价值很强，但一旦出错，代价也更高。公开的 DPA 要求客户提供准确数据，把部分责任压回客户侧；但 Exiger
              仍承接处理方、安全、子处理方和泄露响应义务。也就是说，合同措辞消不掉运营责任。客户依赖的监管栈也不是静态的。OFAC 持续发布更新的制裁数据集，BIS 一边把出口商导向 EAR
              和筛查资源，一边提醒用户要用官方出版物核对法律研究；CBP 的 UFLPA 机制可以根据实体清单和原产地证据扣留货物。换句话说，Exiger
              的价值主张取决于能否处理不断变化、跨司法辖区、且在陈旧或不完整时会产生法律后果的数据。再叠加 FTC 隐私预期、GDPR 义务、AI Act
              分阶段合规时间表，以及上升的网络或产品保证审查，结论是：模型质量、实体解析、来源溯源和安全控制，应当和收入增长拿到同等尽调权重。
