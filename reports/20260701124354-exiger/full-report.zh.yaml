      - number: '2.4'
        title: 监管驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              硬监管、产业政策和 AI 自动化可用性正在把 Exiger 的市场往前拉。国防领域，CMMC 和 DFARS 合同条款把网络安全保障变成合同准入要求；DoD
              工业战略和拟议的所有权披露扩展，又加深了对下级供应商可视性的需求。贸易与人权合规中，UFLPA 执法变得更按交易、更吃数据，OFAC 加 BIS 规则让制裁和出口管制筛查保持持续更新，而非阶段性动作。EO
              14017 和 CHIPS
              政策把逻辑从合规延伸到国家安全韧性和上游组件可追溯。约束同样真实。买方仍面对集成和数据质量负担、误报复核量、缓慢预算周期，以及难以替换的既有工作流。国防用例还增加敏感数据和可审计性约束，限制了简单
              即插即用部署假设。实际结论是，Exiger 的市场外部驱动强，但货币化取决于客户能否用可接受的实施投入把数据运营起来，并有足够精度避免让分析师淹没在噪音中。
