companyProfile:
  summary: >-
    Exiger 是一家总部位于 Virginia 州 McLean 的私营软件与工作流公司，早期从合规和尽调业务起步，随后扩展到 AI 驱动的供应链可视化、采购情报和软件供应链风险管理。公司当前产品叙事围绕
    1ExigerAI、多层级供应商与零部件情报，以及受监管企业和政府部署展开，并已在联邦、国防工业、金融服务和大型企业账户中取得有意义牵引。
