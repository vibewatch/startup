      - number: '7.4'
        title: 收购整合、资方控股与退出风险
        blocks:
          - type: paragraph
            body: >-
              Exiger 的收购历史强化了产品叙事，也让执行更复杂。Supply Dynamics 带来物料级可见性和多层级图谱，XSB 带来大型零部件和属性数据集，Versed AI
              带来产品拆解和多层级可见性工具。每项资产都让平台更难被替代，但也带来整合、路线图和 GTM 协同工作，公开材料没有量化。资方控股又叠加一层。Carlyle 和 Insight
              的多数股权投资在战略上有支撑，但也意味着在投资者看清客户集中度、利润率或质量指标之前，退出纪律很重要。SEC 2026
              年发行改革提案可作背景：如果监管者仍在试图简化公开市场发行路径，实际信号就是退出窗口仍然对披露质量和市场结构敏感。法律尽调也类似。免费网络搜索包没有发现不利的联邦案件，但 PACER
              和法院书记员办公室核查才是权威路径。因此，正确的缓释姿态应由升级机制驱动：把客户集中度、准确性、网络安全、整合和资方时点信号，视为董事会或投委会触发项，而不是背景噪音。
