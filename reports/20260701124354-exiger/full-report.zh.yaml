      - number: '4.2'
        title: 增长信号与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司来说，Exiger 的公开牵引信号很可观，但仍停留在代理指标层面。最干净的 2026 年规模说法来自公司自己的 Gartner 和 Hackett 公告：Exiger 服务 550+ 全球客户，包括
              150 家 Fortune 500 和 60+ 政府及国防工业基础 组织。World Economic Forum 组织档案大体印证了这一规模，1ExigerAI 页面还加入了可量化运营结果，比如发现
              20,000+ 隐藏实体、信噪比降低 45%、规范化 40,000+ 零部件、预测准确率提升 10-20%，以及一个联邦用例中原产国覆盖率 80%+。最重要的收入端信号仍来自第三方而非审计：Forbes
              报道管理层预期 2024 年底营收超过 $150M，并称五年 CAGR 超过 80%。这些数字方向很强，也与 800 多名员工规模相符，但不能替代 ARR、毛利率、CAC 回收期或留存。因此承销时应把
              Exiger 视为一家客户密度和价值证明信号异常可见、但单位经济性仍不透明的公司。
