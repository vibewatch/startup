  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - CMMC 第一阶段和 DFARS 合同条款
        - 驱动因素
        - 当前 / 多年期
        - 把网络安全保障变成 DIB 参与方及其供应商拿合同的门槛要求
        - 向管理层询问，管线中有多大比例直接来自 CMMC 或 DFARS 驱动的需求
      - - UFLPA 执法和仪表盘颗粒度
        - 驱动因素
        - 当前
        - 进口依赖重的行业更看重单品级来源、原产国细节和供应商可追溯性
        - 要求提供客户案例，说明 CBP 扣留风险如何改变产品需求或预算规模
      - - OFAC 和 BIS 筛查波动
        - 驱动因素
        - 当前 / 结构性
        - 推动买方从一次性准入检查转向持续的制裁和出口管制监控
        - 询问 Exiger 客户多久重跑一次筛查，以及补救工作流如何配人
      - - EO 14017、CHIPS 和国家安全工业政策
        - 驱动因素
        - 结构性
        - 让韧性、冗余和上游部件可视性成为值得投入预算的能力
        - 询问需求中有多少可追溯到韧性或回流项目，而不是单纯合规
      - - NDIS 优先事项和 FOCI 披露扩围
        - 驱动因素
        - 当前 / 近期
        - 要求更深的供应商和所有权透明度，从而强化国防领域可视化切入点
        - 要求提供联邦机构和主承包商采用的证据，且与所有权或次级供应商披露挂钩
      - - AI 原生自动化和知识图谱工作流
        - 驱动因素
        - 当前 / 结构性
        - 如果准确率足够好，可提升分析师吞吐量，加快补救
        - 要求提供误报率、分析师产能提升和补救时间指标
      - - 集成和数据质量负担
        - 约束
        - 当前 / 结构性
        - 价值取决于能否把杂乱内部系统里的供应商、交易方和零部件数据标准化
        - 要求提供实施周期、客户数据准备投入和系统集成依赖
      - - 误报和嘈杂的筛查输出
        - 约束
        - 当前 / 结构性
        - 即使覆盖面很广，人工复核负担也可能压垮合规团队，拖低 ROI
        - 按工作流要求提供告警量、精准率指标和调优流程
      - - 预算周期和既有工作流
        - 约束
        - 当前 / 结构性
        - 采购、合规和国防买方往往要等触发事件才采购，跨职能推进也可能很慢
        - 按垂直行业要求提供销售周期，以及替换单与新建项目的构成
      - - 敏感或涉密国防数据约束
        - 约束
        - 当前 / 结构性
        - 部分部署环境需要可审计、严控的数据处理，不能按简单 SaaS 推出假设来做
        - 要求提供架构模式、涉密环境参考案例和证据处理控制
    notes: 最强驱动因素来自迫使持续收集证据的规则变化；最难的约束在运营层面：数据集成、噪声压制，以及适配漫长的企业或联邦采购周期。
