  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 框架
      - 证据
      - 为何支撑或施压 $1.2B
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 2026 年材料显示，550+ 客户、150 家 Fortune 500 关系，以及 60+ 政府和 DIB 组织
        - 规模已经足够真实，Exiger 不是概念阶段的 AI 故事。
        - 给出付费客户定义、logo 留存，以及头部账户收入集中度。
      - - 投资逻辑
        - AWS Marketplace 上线和 Hackett 认可强化采购相关性与产品成熟度
        - 平台购买门槛下降并获得分析师认可后，溢价定位更容易站住。
        - 给出当前有多少管线或签约额来自渠道，以及认可如何映射到 ACV 扩张。
      - - 投资逻辑
        - Forbes 报道的 >$150M 收入底线和 >80% 五年 CAGR，意味着历史复利可观
        - 如果当前收入已远高于该底线，入场倍数可压缩到更能支撑的区间。
        - 提供经审计的 2025 年和 TTM 收入，以及 ARR 桥。
      - - 反向论点
        - 官方来源仍未披露估值、ARR、毛利率、NRR、服务收入占比、烧钱速度或资方条款
        - 高倍数缺少高质量披露支撑，会放大承销误判风险。
        - 披露一套管理层数据包，包含当前经济性和股权结构条款。
      - - 反向论点
        - Exiger 隐含的 8.0x 下限倍数已高于 D&B、NICE、TransUnion，接近 Verisk
        - 价格先把高质量计入估值，但公开记录尚未证明其经济性足够优质。
        - 证明 Exiger 当前收入和利润率更接近高端分析同业，而不是低区间工作流厂商。
      - - 反向论点
        - 政府业务足迹明显很大，但公共部门收入集中度仍未量化
        - 联邦优势可以是护城河，也可能放大预算、采购和续约波动。
        - 提供公共部门在 ARR、订单、毛利中的占比，以及重点项目续约排期。
    notes: 支持论点行拆出有利于估值案例的因素；反向论点行拆出可能击穿案例的因素。本表有意把业务质量与估值支撑分开。
