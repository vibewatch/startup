            body: >-
              Exiger 的资本故事在里程碑中可见，但当前资产负债表细节不可见。已审阅材料中最早明确披露的融资标记，是 2018 年 7 月 Carrick Capital Partners 的 $80M
              少数股权成长资本投资。公开来源随后跳到 2023 年 12 月与 Carlyle 和 Insight Partners 的多数股权投资协议，以及 Carrick 的再投资，但在保留材料中，公司和 Carlyle
              都没有公开披露交易规模或估值。这种不透明重要，因为 Exiger 同时在重塑平台。2022 到 2024 年间，它收购 Supply Dynamics、XSB 和 Versed AI，同时把 FCC 咨询部门卖给
              Capgemini，将业务聚焦到技术上。战略上，这看起来连贯：Supply Dynamics 增加物料级映射，XSB 增加 100M 零部件和 400M 联邦政府属性，Versed AI
              增加多层级可视性。但财务上，公开资料没有说明被收购收入、集成成本、重叠或协同兑现。政府足迹是另一项双刃剑事实。Exiger 的 2026 年材料强调 60+ 政府和国防工业基础组织、FedRAMP
              授权和联邦领导力，商业上有吸引力，但也抬高了集中度风险，因为没有公开来源拆出公共部门究竟贡献多少收入。
