      - number: '1.4'
        title: 里程碑、收购与风险信号
        blocks:
          - type: paragraph
            body: >-
              里程碑顺序是理解 Exiger 当前身份最清楚的路径之一。公司早期打出合规和尽调版图之后，在 2022 到 2024 年把更宽的运营栈缝合起来：Daniels 于 2022 年升任 CEO，2023 年推出
              1Exiger，2024 年收购 Versed AI 和 XSB，都把公司推向更深的、懂产品的供应链情报。2025 年陆军授标和 2026 年 Platform One Marketplace
              状态随后强化了一个事实：Exiger 已从合规相邻工具跨入任务级政府供应链基础设施。这些都是实打实的正面因素，但本章不应把公开资料当成毫无瑕疵。已审阅材料中最明显的负面信号，是 2026 年一条 Gartner
              Peer Insights 评论：它肯定可视性，却批评工作流调校，说明至少部分用户感受到实施复杂度。更重要的是，公开资料仍留下 ARR、董事会结构、2023 年具体经济条款，以及 ORCA 和
              WorldCompliance 等旧品牌仍是活跃产品还是已被吸收进更宽平台叙事等问题。这种不透明还不到推翻投资论点的程度，但足以让尽调继续压在产品清晰度和治理上。
