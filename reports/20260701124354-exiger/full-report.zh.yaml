      - number: '2.5'
        title: 展项
        blocks:
          - type: callout
            title: 相邻市场很宽，可货币化楔子很窄
            body: 公开市场标签让 Exiger 看起来同时处在多个大市场中，但真正能货币化的楔子更窄：买方需要在同一工作流中完成可审计的供应商、合规和来源决策。
