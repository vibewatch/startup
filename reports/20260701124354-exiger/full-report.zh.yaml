        title: 资本基础、规模信号与客户证明
        blocks:
          - type: paragraph
            body: >-
              Exiger 的资本和规模叙事可信，但并非每一点都同样透明。公开披露确认 2018 年 Carrick $80M 成长投资，以及 2023 年 12 月 Carlyle/Insight
              多数股权投资。后续独立报道把后者描述为约 $1.2B 估值，这与 Exiger 当前“独角兽”表述方向一致，尽管公司本身没有公开列明准确估值或投资金额。客户牵引比经济细节更有支撑。当前官方材料反复提到约 550+
              客户、150 家 Fortune 500 关系，以及 60+ 政府或国防工业基础组织。具名证明也存在：Oshkosh 出现在供应链案例中，SMBC 是 DDIQ
              的有记录银行客户，美国陆军提供标志性的联邦验证。规模指标仍需谨慎。员工数在官方和独立来源之间落在 850 到 1000 区间，Forbes 访谈给出 2024 年营收超过 $150M 的估计，但没有
              ARR。因此规模是真实的，但经济精确度仍低于完整承销流程应要求的水平。
