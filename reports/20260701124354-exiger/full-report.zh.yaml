      - number: '8.2'
        title: 公开市场与私募可比框架
        blocks:
          - type: paragraph
            body: >-
              上市可比公司给出可用区间，但并不完美，应当作为估值锚，而不是逐字可比对象。Dun & Bradstreet、NICE 和 TransUnion 位于相邻数据或流程供应商的低位区间，以公开市值 /
              收入代理口径看，TTM 收入约 1.7x 到 3.0x。Verisk 和 Moody's 位于高端，分别约 7.8x 和 10.1x，反映更强披露、高利润率分析经济性和更成熟的数据网络优势。因此，Exiger
              隐含的 8.0x 底部倍数，更接近高溢价分析公司，而不是低增长或流程属性更重的公司。只有当前收入已经明显高于 2024 年底线，且 Exiger
              的经济性更像规模化软件和分析业务，而不是服务占比重的合规平台，这一估值才站得住。私募和 M&A 参照也证明市场对情报资产有战略胃口，但不能干净地解决估值支撑问题。Chainalysis 估值达到 $8.6
              billion，Interos 跨过 $1 billion，Sayari 获得 $235 million 战略多数股权投资，Mastercard 同意以 $2.65 billion 收购 Recorded
              Future。这些案例显示资方和战略买家需要网络化风险数据资产，但各自处在不同终端市场、披露制度和利润率画像中。因此，可比组有用，但必须带着明确保留使用。
