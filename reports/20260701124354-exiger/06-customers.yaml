- id: named-proof-and-procurement-path
  title: Named proof and procurement path
  body: The strongest customer proof is public-sector procurement, not generic logo placement. Exiger’s retained corpus includes direct, operationally specific evidence for Army Materiel Command, CBP, Northwell Health, and Oshkosh/JLG. The Army and CBP wins matter because they are not just “strategic partnerships”; they are described as multi-million-dollar software or AI contracts with mission-specific workflows, while the Northwell and Oshkosh cases show enterprise deployments that touched ERP flows, supplier-monitoring processes, technical data packages, and large supplier networks. Procurement access is also unusually visible. Exiger has an OUSD-linked DDIQ contract history, the SCRIPTS BPA, Platform One marketplace exposure, and an AWS Marketplace route meant to reduce commercial friction. That combination suggests a company that can sell through both bespoke federal procurement and workflow-heavy enterprise evaluations. It also implies that customer acquisition is often tied to implementation
    depth and procurement infrastructure rather than lightweight self-serve software motion.
