- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Federal procurement lattice
    - DDIQ, SCRIPTS, Army, CBP, and Platform One together create multiple paths into government accounts
    - Positive for expansion; also raises public-sector concentration sensitivity
    - Request bookings, renewal, and revenue split by federal customer and contract vehicle
  - - AWS Marketplace channel
    - 2026 launch explicitly aims to cut procurement friction for commercial and international customers
    - Positive for top-of-funnel and channel-led conversion
    - Request marketplace-originated pipeline, win rate, and average discounting
  - - Named bank-reference gap
    - Financial-services case studies are anonymous and do not support Goldman Sachs or JPMorgan specifically
    - Adverse for referenceability in a thesis that depends on marquee banks
    - Request named reference customers or blind calls with large-bank users
  - - Reference inflation risk
    - Customer stories page showcases many themes but only a small number of clearly named external accounts in the retained corpus
    - Adverse because counts and logos can overstate usable proof
    - Request a customer-reference matrix sorted by segment, maturity, and outcome specificity
  - - Implementation heaviness
    - Gartner critical review plus Northwell/Oshkosh integration detail imply non-trivial onboarding and workflow tuning
    - Adverse for sales-cycle length and deployment cost
    - Request median time-to-go-live, services attach, and implementation FTE burden
  - - Embedded-workflow switching cost
    - ERP/API/PLM/technical-data integration and supplier onboarding make displacement harder once deployed
    - Positive for durability if customer satisfaction stays high
    - Request module attach, renewal rates, and migration-loss reasons
  - - Segment-mix opacity
    - Public sources disclose customer counts but not revenue concentration by government, enterprise, or financial services
    - Adverse because concentration cannot be sized from the public file
    - Request segment ARR, top-customer share, and public-sector share of renewals
  notes: The same evidence can drive upside and risk. Expansion drivers are visible, but the missing denominator is always economic concentration and renewal behavior.
