company:
  name: Exiger
chapter:
  number: 6
  title: Customers
  summary: Exiger has real customer traction, but the public proof is uneven. The strongest evidence is in government and defense procurement—Army, CBP, broad federal contract vehicles, and 60+ government/DIB organizations—while enterprise proof is thinner and financial-services references are mostly anonymized. Reviews and case studies suggest sticky, workflow-embedded deployments with meaningful switching costs, but public renewal, concentration, and segment-mix data remain opaque.
sections:
- id: customer-footprint-and-segment-mix
  title: Customer footprint and segment mix
  body: Exiger’s customer base is broad in category but uneven in proof quality. Official and independent profile surfaces consistently describe a business that serves corporations, government agencies, and banks, with the sharpest documented use cases in procurement-led supply-chain intelligence, federal mission assurance, compliance, and third-party risk. The company’s repeated 2026 scale claims—550+ customers, 150+ Fortune 500 customers, and 60+ government or Defense Industrial Base organizations—show that Exiger is not a niche pilot vendor. But those counts say little about mix. Publicly named proof is strongest in defense, government, healthcare, and industrial manufacturing. Financial-services coverage is strategically important, yet the visible case studies stay anonymous, which weakens referenceability for marquee-bank claims. The practical read is that Exiger likely has a meaningful regulated-enterprise and government installed base, but the buyer surfaces most clearly where procurement,
    compliance, and mission readiness intersect.
  claimRefs:
