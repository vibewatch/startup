  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Customer revenue mix by government vs enterprise, financial services vs other verticals, and top-customer share.
    whyItMatters: Without segment mix and concentration data, customer-quality underwriting stays directional and public-sector concentration could be either modest or thesis-changing.
    diligencePath: Request top-20 customer concentration, public-sector ARR share, and segment bookings/renewals split from management.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, contract length, renewal rates, and cohort expansion by segment.
    whyItMatters: Review quotes and case-study outcomes are not substitutes for hard durability metrics.
    diligencePath: Request retention dashboard by segment and the last eight quarters of renewal outcomes.
