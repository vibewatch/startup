  - - Defense Industrial Base organizations
    - Prime contractors or mission-linked procurement groups
    - Supplier-risk, provenance, or compliance operators
    - Multi-tier risk, parts intelligence, SBOM, and mission-assurance workflows
    - Official materials cite 60+ government and DIB organizations but do not name most of them
    - Suggests defense adjacency, but customer-level concentration is opaque
  - - Fortune 500 regulated enterprises
    - Procurement, compliance, legal, and risk leaders
    - Third-party risk, supplier-risk, and remediation teams
    - Large-enterprise supplier and third-party risk management
    - 150+ Fortune 500 customer claim is repeated across official 2026 surfaces
