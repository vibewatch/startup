  - - Financial institutions and fintechs
    - Compliance, legal, investigations, and financial-crime budgets
    - Transaction-monitoring, EDD, sanctions, and KYC operators
    - Alert lookbacks, new-product controls, and KYC remediation
    - Public proof is real but anonymized across a major investment bank, a top-10 regional bank, and a European fintech
    - No supportable named 2026 proof for Goldman Sachs or JPMorgan
  - - Healthcare providers
    - Supply-chain leadership and vendor-risk ownership
    - Vendor-risk managers and supplier-monitoring teams
    - Northwell vendor-risk management and supply-chain monitoring
    - Northwell is a named enterprise healthcare reference with integration detail
    - Public corpus does not show broader healthcare account depth
  - - Industrial / manufacturing OEMs
    - Supply-chain, sourcing, and operations leadership
