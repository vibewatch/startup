figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Exiger wins when a high-consequence buyer moves from compliance or supply-chain pain into a workflow-embedded deployment that is hard to unwind once data, integrations, and monitoring rules are live.
  data:
    nodes:
    - label: 1. Trigger / mandate
      detail: A buyer faces sanctions, supplier, mission-readiness, or SBOM pressure that a spreadsheet or fragmented point-tool stack cannot handle.
      tone: neutral
    - label: 2. Evaluation and proof
      detail: The account tests whether Exiger’s data and AI can prioritize risk, reduce false positives, or illuminate deeper supplier or customer networks.
      tone: neutral
    - label: 3. Integration and workflow design
      detail: Custom APIs, ERP or PLM links, technical-data-package ingestion, and workflow tuning turn the platform into an operating system rather than a report.
      tone: positive
    - label: 4. Live monitoring and decision support
      detail: Users rely on the platform for ongoing supplier vetting, trade enforcement, remediation, or mission-assurance workflows.
      tone: positive
    - label: 5. Expansion or renewal decision
      detail: Durability depends on whether the customer broadens scope, reuses a contract vehicle, or extends work instead of reverting to lighter tools.
      tone: risk
  approximationNotes: This is a structural journey derived from customer stories and review evidence, not a measured conversion funnel with account counts at each stage.
  claimRefs:
  - CU010
  - CU015
  - CU016
  - CU018
  - CU019
  - CU034
  - CU035
  - CU036
