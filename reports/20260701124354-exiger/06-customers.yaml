- id: durability-switching-costs-and-referenceability
  title: Durability, switching costs, and referenceability
  body: 'Public durability evidence is directionally positive but incomplete. The best retention proxies are structural: Oshkosh expanded from one business unit into another, the regional-bank client extended Exiger’s engagement beyond the original alert lookback, and Northwell replaced a multi-tool setup with a single Exiger-led ecosystem. Independent sentiment is also better than average for a private vendor. Gartner’s accessible product page shows a meaningful visible review corpus and a favorable manufacturing review that praised implementation support and reduced false positives. But the same page also surfaces a critical review that says the platform can be complex to tune and heavier than needed for simple use cases. That combination matters: Exiger appears most durable when customers need deep workflow integration, not when they want a light monitoring overlay. Public satisfaction and switching-cost signals are therefore real, yet still weaker than a disclosed NRR or renewal cohort.
    Referenceability is similarly mixed because large sectors, especially financial services, are represented more by anonymous cases than by named customer champions.'
