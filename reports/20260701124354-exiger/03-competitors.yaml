  rows:
  - - Exiger
    - Full-stack supply-chain intelligence + TPRM
    - 1/3 of Fortune 500; 60+ federal agencies and DIB members; FedRAMP authorized
    - Regulated enterprises, federal buyers, defense and critical supply chains
    - One platform spanning workflow, graph intelligence, critical-node analysis, and federal credibility
    - Public pricing and independent win-rate evidence are sparse
  - - Dun & Bradstreet
    - Compliance data + due-diligence workflow
    - 10,000+ sources; 550M+ entities; 2026 agentic AI release
    - Compliance, onboarding, supplier and third-party risk teams
    - Verified business data plus automation for onboarding, screening, and due diligence
    - Less explicit public emphasis on component-level or multi-tier supply-chain mapping
  - - LSEG Risk Intelligence
    - KYC and sanctions screening data
    - World-Check brand; API-first On Demand; points-based self-service packages
    - Financial-crime, onboarding, and sanctions-screening teams
    - Structured screening data with multiple delivery modes and transparent online package model
    - Narrower procurement workflow and weaker public supply-chain mapping story
  - - LexisNexis Risk Solutions
    - Financial crime and customer-lifecycle compliance
    - Broad customer-lifecycle risk suite in retained set
    - Financial institutions, fintechs, insurers, retailers, and regulated enterprises
    - Layered financial-crime perspective across the customer lifecycle
    - Less explicit public evidence of deep multi-tier supplier mapping
  - - Sayari
    - Trade and ownership intelligence for supply chains
    - 4B+ trade transactions; 500M+ entity profiles; 250+ jurisdictions
    - Compliance, procurement, trade, and supply-chain teams needing tier-N evidence
    - Combines trade, ownership, sanctions, export controls, and UFLPA or ESG workflows
    - Less full public TPRM workflow depth than broad supplier-risk suites
  - - K2 Integrity
    - Expert-led financial-crime compliance
    - Global AML and sanctions advisory footprint across 100 countries in cited service page
    - Banks, fintechs, and regulated entities with complex program needs
    - Deep expert-led AML, sanctions, and regulatory remediation capability
    - Service-led positioning is less procurement-native and less graph-productized
  - - Coupa
    - Procurement-native supplier risk workflow
    - Risk module embedded in a larger source-to-pay platform
    - Procurement organizations standardizing inside spend workflows
    - Onboarding, AI-driven monitoring, and alternative-supplier actions without leaving Coupa
    - Less public evidence of deep ownership, trade, or component-level intelligence
  - - ProcessUnity
    - Configurable TPRM workflow platform
    - Forrester-recognized 2026 TPRM Leader in retained set
    - Enterprises prioritizing workflow maturity and questionnaire automation
    - Configurable workflows, real-time dashboards, external ratings, and AI-enabled scoping
    - Less public federal or graph-driven supply-chain differentiation
  - - Aravo
    - Multi-domain TPRM platform
    - Enterprise TPRM platform with AI-enabled intelligence messaging
    - Large enterprises needing many third-party risk domains in one program
    - Centralized applications spanning multiple compliance and risk domains
    - Public materials emphasize workflow over trade or sanctions-data depth
  - - Ivalua
    - Supplier risk inside procurement suite
    - Integrated supplier platform with sub-tier scorecards
    - Procurement-led enterprises wanting risk in supplier operations
    - 360-degree supplier view with external risk data and scorecards
    - Less explicit public AML or sanctions-data differentiation
  - - Supply Wisdom
    - Continuous monitoring specialist
    - Supplier and location monitoring across many risk domains
    - Teams focused on real-time alerts and location-aware supplier exposure
    - Continuous monitoring, location risk, and look-back reporting
    - Public materials emphasize alerts more than ownership or trade provenance
  - - Interos
    - Supplier resilience and mapping
    - Automated mapping platform plus ERP-linked iQ expansion
    - Enterprises and government buyers focused on resilience and disruption
    - Multi-tier mapping, predictive exposure, and alternative supplier suggestions
    - Less explicit AML, KYC, and onboarding workflow language than Exiger or screening incumbents
