- id: TP004
  title: Win / loss logic by buyer job
  columns:
  - Buyer job
  - Exiger likely wins when…
  - Exiger likely loses to…
  - Why the outcome tilts that way
  - Evidence caveat
  rows:
  - - Federal or defense supply-chain risk
    - The account wants FedRAMP, defense relevance, and agentic multi-tier mapping in one platform
    - Sayari or Interos if the buyer wants a narrower graph or resilience specialist
    - Exiger's federal footprint and component-level analysis matter most here
    - Public sources do not disclose actual bid win rates
  - - Pure sanctions or onboarding screening
    - The buyer still wants workflow and supply-chain context around screening
    - LSEG, D&B, or LexisNexis
    - Screening incumbents offer narrower entry points and stronger data-brand recognition
    - No public cost comparison is available for apples-to-apples deployments
  - - Procurement-native supplier risk
    - The buyer accepts a separate risk platform to get deeper intelligence and federal or graph depth
    - Coupa or Ivalua
    - Installed procurement suites can satisfy many supplier-risk requirements inside existing approval flows
    - Public materials show capability overlap but not displacement rates
  - - Multi-tier forced-labor or sanctions mapping
    - The buyer values workflow execution after graph discovery, not just map output
    - Sayari or Interos
    - Sayari and Interos both center the sale on tier-N visibility and data depth
    - Comparative precision and freshness benchmarks are not public
  - - Configurable TPRM backlog relief
    - The buyer wants workflow plus supply-chain intelligence rather than workflow alone
    - ProcessUnity or Aravo
    - Workflow specialists market configurable questionnaires, dashboards, and program design depth
    - Public sources are richer on feature claims than on customer satisfaction data
  - - Continuous monitoring only
    - The buyer wants risk context tied to broader procurement or federal workflows
    - Supply Wisdom or D&B
    - Monitoring specialists can be cheaper and simpler when graph depth is not required
    - No public commercial metric shows when Exiger becomes over-scoped
  - - Expert-led AML remediation
    - The buyer still wants software and supply-chain intelligence as part of the answer
    - K2 Integrity
    - K2 is more naturally a services-led compliance partner than a platform-led procurement tool
    - Service attach rates and blended software-services terms are private
  notes: Win and loss logic is inferred from public product positioning, partner material, and analyst-style commentary in the retained corpus. It should be treated as directional until validated by customer references or RFP history.
