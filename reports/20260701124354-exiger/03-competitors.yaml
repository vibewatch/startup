- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Why the threat is real
  - Mitigation / diligence ask
  rows:
  - - Unified intelligence + workflow stack
    - Suite bundling by D&B, LSEG, Coupa, and Ivalua
    - High
    - Each incumbent already owns an adjacent budget line and can deepen the missing piece
    - Request actual displacement stories where Exiger replaced a suite incumbent end to end
  - - Federal / defense deployment credibility
    - Graph specialists extend government relevance
    - Medium
    - Sayari and Interos both market government or defense-adjacent relevance from the graph side
    - Verify current federal renewal rates and relative authorization scope
  - - Component-level supply-chain analysis
    - Peers extend graph depth downward into parts and facilities
    - Medium
    - Hackett called this an Exiger differentiator, but it is still a product feature that others can chase
    - Ask for customer examples where component-level analysis changed the buying decision
  - - Agentic workflows tied to graph data
    - Data incumbents add workflow automation and AI agents
    - High
    - D&B's 2026 release shows the data side is already moving into execution
    - Benchmark analyst productivity and false positives against D&B and LSEG in live bake-offs
  - - Procurement interoperability without losing depth
    - Procurement suites become good enough for supplier-risk operations
    - High
    - Coupa and Ivalua can meet many workflow needs without another platform sponsor
    - Test whether Exiger materially improves outcomes beyond what procurement teams can get in-suite
  - - Multi-tier mapping as a core wedge
    - Sayari and Interos become the default graph specialists
    - High
    - Both rivals make tier-N visibility the main buying event rather than a supporting feature
    - Compare graph freshness, explainability, and actionability across the three platforms
  notes: Severity is an author judgment from the retained public record rather than a numeric risk model. The diligence asks are the practical follow-ups needed to move from positioning claims to underwriting confidence.
