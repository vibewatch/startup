  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exiger-pricing
    missingEvidence: Current Exiger contract metric, price bands, and standard packaging terms for commercial versus federal accounts.
    whyItMatters: Bundle pressure is partly an economic question, and public materials do not reveal whether Exiger wins on ACV, usage logic, or ROI framing.
    diligencePath: Request a current pricing deck, sample order form, and at least one recent federal and one commercial proposal.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: competitive-win-rates
    missingEvidence: Independent named-account win and loss history versus D&B, LSEG, Coupa, Ivalua, Sayari, and Interos.
    whyItMatters: Public positioning explains where Exiger should win or lose, but underwriting needs actual proof of displacement and renewal behavior.
    diligencePath: Collect customer references, RFP summaries, and lost-deal postmortems from sales leadership for the last four quarters.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: screening-precision-benchmarks
    missingEvidence: Side-by-side benchmark of false positives, analyst productivity, and alert precision across Exiger, D&B, LSEG, and Sayari.
    whyItMatters: The public corpus offers vendor-claimed speed improvements, but not a normalized quality benchmark that would prove durable differentiation.
    diligencePath: Run a controlled bake-off on common supplier and sanctions cases, then compare alert volumes, adjudication time, and hit quality.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
