company:
  name: Exiger
chapter:
  number: 4
  title: Financials
  summary: Exiger's public financial file is strong on scale proxies, product breadth, sponsor backing, and acquisition history, but weak on the core operating metrics needed for underwriting. The supportable public record shows a software-led enterprise and government risk-intelligence business with 550+ customers, 150 Fortune 500 relationships, 60+ government and Defense Industrial Base organizations, and a third-party-reported revenue floor above $150 million by the end of 2024. However, list pricing, ARR, revenue mix, gross margin, burn, runway, and the size or valuation of the 2023 Carlyle/Insight transaction all remain undisclosed, so valuation support is directional rather than conviction-grade.
sections:
- id: revenue-model-pricing-and-distribution
  title: Revenue Model, Pricing Opacity, and Distribution
  body: The public evidence supports a software-led enterprise revenue model, but not a transparent pricing model. Exiger's homepage, products surface, and public-sector materials all describe a unified platform that maps supplier, product, part, component, and risk data for enterprise and government buyers. The company also describes itself in multiple releases as a SaaS or supply chain AI company rather than a consulting-led outsourcer, and the 2023 Capgemini divestiture sharpened that positioning by separating the legacy FCC advisory division from the core third-party risk and supply-chain technology business. At the same time, every reviewed commercial surface remains sales-led. There is no public list price, self-serve seat model, or disclosed usage meter for the core platform. The March 2026 AWS Marketplace launch matters because it shortens procurement friction and could widen channel-driven expansion, but it still does not reveal actual SKU pricing or realized contract terms. So
    the right financial reading is not that Exiger lacks monetization discipline; it is that the public file only shows the shape of the revenue engine—enterprise contracts, government procurement, and module expansion—not the realized economics that convert those motions into durable revenue quality.
