- id: growth-signals-and-unit-economics-proxies
  title: Growth Signals and Unit-Economics Proxies
  body: 'Exiger''s public traction signals are substantial for a private company, but still proxy-level. The cleanest 2026 scale claims come from the company''s own Gartner and Hackett announcements, which say Exiger serves 550+ global customers, including 150 Fortune 500 and 60+ government and Defense Industrial Base organizations. The World Economic Forum organization profile broadly corroborates that scale, while the 1ExigerAI page adds quantified operational outcomes such as 20,000+ hidden entities found, 45% signal-noise reduction, 40,000+ parts normalized, 10-20% forecasting accuracy improvement, and 80%+ country-of-origin coverage in a federal use case. The single most important top-line signal is still third-party rather than audited: Forbes reported management expected revenue to exceed $150 million by the end of 2024 and claimed a five-year CAGR above 80%. Those numbers are directionally strong and consistent with high-800s employee scale, but they are not substitutes for ARR,
    gross margin, CAC payback, or retention. Underwriting should therefore treat Exiger as a company with unusually visible customer-density and proof-of-value signals, yet still an opaque unit-economics file.'
