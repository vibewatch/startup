  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-and-arr
    missingEvidence: Current ARR, TTM revenue, and revenue mix by public sector, commercial, and acquired modules.
    whyItMatters: Without a segmented top-line bridge, valuation and concentration underwriting remain speculative even if the public revenue floor is directionally encouraging.
    diligencePath: Request monthly revenue bridge, bookings waterfall, and segment mix by product family and customer type.
    relatedQuestionRefs:
    - QI013
    - QI019
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-burn-and-runway
    missingEvidence: GAAP gross margin, burn rate, cash balance, debt obligations, and 12-24 month runway assumptions.
    whyItMatters: These are the core variables that determine whether Exiger deserves an analytics-style valuation or should be treated more conservatively.
    diligencePath: Request current balance sheet, debt schedule, monthly burn trend, and GAAP P&L with COGS detail.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Representative contracts, ACV distribution, contract terms, discount ladders, and services-versus-software billing treatment.
    whyItMatters: Sales-led enterprise software can have strong economics or weak ones depending on realized pricing, support burden, and renewal structure.
    diligencePath: Review recent enterprise and public-sector contracts plus marketplace private-offer examples across customer segments.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI020
    relatedTableRefs:
    - TI001
    - TI002
  - type: missing-source
    severity: material
    topic: government-mix-concentration
    missingEvidence: Revenue and renewal split between public-sector, Defense Industrial Base, and commercial customers.
    whyItMatters: Exiger’s government depth could be a durable moat or a meaningful concentration risk, and the public file does not reveal which is more true.
    diligencePath: Request customer and revenue concentration tables, including top agencies, top enterprises, and renewal timing.
    relatedQuestionRefs:
    - QI006
    - QI018
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: acquisition-integration-economics
    missingEvidence: Purchase prices, acquired revenue, overlap, integration cost, and synergy realization for Supply Dynamics, XSB, and Versed AI.
    whyItMatters: An acquisition-led platform story can create real operating leverage or hide material execution drag; public sources only prove the deals happened.
    diligencePath: Request acquisition memos, synergy tracking, and post-close retention metrics for each transaction.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: sponsor-entry-valuation
    missingEvidence: Transaction size, enterprise value, cap table, and preference stack for the 2023 Carlyle and Insight investment.
    whyItMatters: Investor return expectations cannot be benchmarked responsibly without knowing the sponsor entry mark and ownership structure.
    diligencePath: Request board materials or transaction documents covering the 2023 control investment and current cap table.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
