- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric / adverse check
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR and revenue mix by product / segment
    - Blocks clean valuation, growth-quality, and mix underwriting
    - Request monthly revenue bridge split across supply chain, TPRM, public sector, and acquired modules
  - - Gross margin and cost structure
    - Prevents judgment on software-like economics versus labor/data-heavy delivery
    - Request GAAP gross margin and COGS split across data, cloud, labor, and support
  - - Burn, cash, debt, and runway
    - Makes sponsor-return timing and dilution risk unknowable
    - Request current balance sheet, debt schedule, and 24-month operating plan
  - - Realized pricing, ACV, and contract duration
    - Obscures revenue quality and sales efficiency
    - Review representative contracts, price books, and discount ladders across segments
  - - Government versus commercial revenue concentration
    - Large federal footprint could be strength or concentration risk
    - Provide revenue, bookings, and renewal mix by public sector versus commercial customers
  - - Acquisition integration economics
    - Roll-up strategy may add growth or hidden integration drag
    - Provide acquired ARR, overlap analysis, integration costs, and realized synergies for Supply Dynamics, XSB, and Versed AI
  - - 2023 sponsor entry valuation and ownership
    - Without a public valuation mark, investor return expectations cannot be benchmarked
    - Disclose transaction enterprise value, sponsor ownership, option pool, and preference stack
  notes: These are the minimum missing disclosures required to move from directional enthusiasm to an investable financial model and valuation view.
