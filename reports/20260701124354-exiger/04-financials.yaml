- id: capital-stack-acquisitions-and-government-mix
  title: Capital Stack, Acquisitions, and Government Mix
  body: 'Exiger''s capital story is visible in milestones but not in current balance-sheet detail. The earliest clearly disclosed financing marker in the reviewed set is the July 2018 $80 million minority growth-capital investment from Carrick Capital Partners. Public sources then jump to the December 2023 majority investment agreement with Carlyle and Insight Partners, plus Carrick''s reinvestment, but the company and Carlyle do not publicly disclose the size or valuation of that transaction in the retained materials. That opacity matters because Exiger was simultaneously reshaping its platform. Between 2022 and 2024 it acquired Supply Dynamics, XSB, and Versed AI, while selling the FCC advisory division to Capgemini to focus the business on technology. Strategically, that looks coherent: Supply Dynamics added item-level mapping, XSB added 100 million parts and 400 million federal-government attributes, and Versed AI added multi-tier visibility. Financially, however, the public file says
    nothing about acquired revenue, integration cost, overlap, or synergy capture. Government footprint is another dual-use fact. Exiger''s 2026 materials emphasize 60+ government and Defense Industrial Base organizations plus FedRAMP authorization and federal leadership, which is commercially attractive but also raises concentration risk because no public source breaks out how much revenue actually comes from the public sector.'
