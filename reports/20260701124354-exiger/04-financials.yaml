  - - Fortune 500 penetration
    - 150 customers
    - High
    - Supports enterprise relevance and potential expansion density
    - Provide top-20 account mix and average wallet share
  - - Government / DIB organizations
    - 60+ in 2026 materials; over 50 in earlier profiles
    - High
    - Useful proxy for public-sector depth but also for concentration risk
    - Break out government revenue, backlog, and renewal concentration
  - - Operational proof points
    - 20,000+ entities found; 45% signal-noise reduction; 40,000+ parts normalized; 10-20% forecasting accuracy improvement; 80%+ origin coverage in one federal use case
    - Medium
    - Outcome proof can support pricing power and expansion even without published ACV
    - Provide cohort-level ROI and attach-rate data by module
  - - Gross margin
    - null
    - Low
    - Core determinant of whether Exiger behaves like software, services, or a hybrid
    - Provide GAAP gross margin with cost buckets for data, labor, and cloud
  - - CAC payback / sales efficiency
    - null
    - Low
    - Needed to judge sponsor-backed growth efficiency
    - Provide fully loaded CAC, payback, and channel mix
  - - Net revenue retention / churn
    - null
    - Low
    - Determines whether customer breadth converts into durable compounding
    - Provide NRR, gross retention, churn, and upsell by segment
  notes: Nulls reflect genuine public-data gaps; the usable public proxies are customer density, outcome metrics, and one third-party-reported revenue floor rather than audited unit economics.
