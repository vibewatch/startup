  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Public/private status
      - Revenue or valuation metric
      - Implied multiple / valuation / status
      - Relevance to Exiger
      - Key limitation
    rows:
      - - Dun & Bradstreet
        - Public through Aug. 2025 take-private
        - $4.08B last known market cap on $2.40B TTM revenue
        - ~1.7x market-cap / revenue proxy
        - Large-scale risk and business-data platform provides a lower-growth floor for data-analytics valuation.
        - Mature, slower-growth asset with different margin and services profile; take-private mechanics are not identical to a sponsor growth deal.
      - - NICE
        - Public
        - $5.58B market cap on $2.94B TTM revenue
        - ~1.9x market-cap / revenue proxy
        - Adjacent workflow and compliance software vendor illustrates lower-band workflow pricing.
        - Customer-experience and contact-center exposure makes it only partially comparable.
      - - TransUnion
        - Public
        - $14.06B market cap on $4.72B TTM revenue
        - ~3.0x market-cap / revenue proxy
        - Scaled data and risk decisioning vendor offers a middle-band public benchmark.
        - Credit-bureau economics and consumer-data mix differ from Exiger's supply-chain workflow orientation.
      - - Verisk
        - Public
        - $24.06B market cap on $3.10B TTM revenue
        - ~7.8x market-cap / revenue proxy
        - Premium analytics and risk-data company is the clearest public premium-end analogue.
        - Stronger disclosure, margin quality, and insurance-data history likely deserve a premium versus Exiger today.
      - - Moody's
        - Public
        - $79.76B market cap on $7.87B TTM revenue
        - ~10.1x market-cap / revenue proxy
        - Demonstrates what markets pay for elite information-services economics and durable data moats.
        - Ratings and benchmark data are structurally more entrenched and profitable than Exiger's current disclosed profile.
      - - Chainalysis
        - Private
        - $170M Series F financing
        - $8.6B valuation in 2022
        - Shows investor appetite for compliance-heavy data platforms with government and financial-institution relevance.
        - Crypto exposure, category heat, and different customer mix make the valuation non-transferable without a discount.
      - - Interos
        - Private
        - $100M Series C financing
        - '>$1B valuation in 2021'
        - Useful supply-chain-risk adjacency for a graph-centric resilience platform.
        - Dated, smaller scale, and no retained public revenue disclosure.
      - - Sayari
        - Private
        - $235M strategic majority investment from TPG
        - Valuation undisclosed in retained public release
        - Confirms sponsor appetite for government-linked counterparty and supply-chain risk intelligence.
        - No public valuation or revenue denominator in the retained materials.
      - - Recorded Future
        - M&A
        - Mastercard acquisition announcement
        - $2.65B agreed acquisition value in 2024
        - Demonstrates strategic willingness to pay for scaled intelligence assets with government and enterprise relevance.
        - Cyber threat-intelligence end market and undisclosed retained revenue limit direct multiple transfer.
    notes: >-
      Public company rows use simple market-cap-to-trailing-revenue proxies from retained market-data pages, not fully adjusted enterprise
      values. Private and M&A rows are included as strategic reference points even when retained public sources do not disclose revenue.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most relevant retained public and private valuation anchors found for adjacent risk, compliance, data, and workflow
        vendors as of the 2026 run date rather than an exhaustive peer universe.
