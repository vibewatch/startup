  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Frame
      - Evidence
      - Why it supports or pressures $1.2B
      - What would change the view
    rows:
      - - Thesis
        - 550+ customers, 150 Fortune 500 relationships, and 60+ government and DIB organizations in 2026 materials
        - Scale is real enough that Exiger is not a concept-stage AI story.
        - Show paying-customer definition, logo retention, and revenue concentration by top accounts.
      - - Thesis
        - AWS Marketplace launch and Hackett recognition reinforce procurement relevance and product maturity
        - Premium positioning is easier to defend when the platform is becoming easier to buy and is analyst-recognized.
        - Show how much of pipeline or bookings now flow through channels and how recognition maps to ACV expansion.
      - - Thesis
        - Forbes-reported >$150M revenue floor and >80% five-year CAGR imply meaningful historic compounding
        - If current revenue is already far above that floor, the entry multiple can compress into a more supportable range.
        - Provide audited 2025 and TTM revenue plus ARR bridge.
      - - Anti-thesis
        - Official sources still do not disclose valuation, ARR, gross margin, NRR, services mix, burn, or sponsor terms
        - Premium multiples without premium disclosure raise underwriting error risk.
        - Release a management data pack with current economics and cap-table terms.
      - - Anti-thesis
        - Exiger's implied 8.0x floor multiple is already above D&B, NICE, and TransUnion and near Verisk
        - The price assumes premium quality before the public record proves premium economics.
        - Prove that Exiger's current revenue and margins sit much closer to premium analytics peers than to lower-band workflow vendors.
      - - Anti-thesis
        - Government footprint is clearly large, but public-sector revenue concentration is still unquantified
        - Federal strength can be a moat, but it can also amplify budget, procurement, and renewal volatility.
        - Provide public-sector share of ARR, bookings, gross profit, and top-program renewal schedule.
    notes: >-
      Thesis rows isolate what helps the valuation case; anti-thesis rows isolate what can break it. The table intentionally separates
      business quality from valuation support.
