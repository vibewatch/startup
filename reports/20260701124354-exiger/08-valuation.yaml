  - id: scenario-returns-and-exit-paths
    title: Bull, Base, Bear, and Exit Math
    body: >-
      The scenario work argues for discipline. In the bull case, Exiger is already materially above the reported 2024 revenue floor,
      sustains software-led growth, shows strong retention, and exits into a market that still pays premium analytics multiples for
      defensible risk data. That can produce a sponsor-acceptable 2x-plus outcome. In the base case, however, Exiger grows well enough to
      be valuable but not well enough to overcome today's entry price with robust excess return; a mid-single-digit exit multiple on a
      sub-$300 million revenue base only produces a modest uplift over the reported mark. In the bear case, a combination of public-sector
      concentration, acquisition-integration drag, services mix, or multiple compression can leave the company worth below cost. The 2026
      private-equity exit backdrop raises the hurdle further, because buyers are more selective, software multiples have compressed versus
      peak years, and longer hold periods reduce sponsor IRR even when gross MOIC remains positive. Put simply, Exiger does not need to be
      a bad business for the valuation to disappoint; it only needs to be a good business that is not quite premium enough.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV039
      - CV042
      - CV043
      - CV044
      - CV045
    tableRefs:
      - TV003
    figureRefs:
      - FV002
      - FV003
  - id: decision-kill-triggers-and-diligence
    title: Decision, Kill Triggers, and Final Diligence
    body: >-
      The right call on the public record is research-more rather than buy. Exiger has enough scale, sponsor quality, and category
      relevance to stay investable, but not enough disclosed economics to underwrite a $1.2 billion entry with conviction. The cleanest
      anti-thesis is not that demand is fake; it is that valuation support depends on opaque private revenue, unknown software-versus-
      services mix, unclear government concentration, and sponsor ownership dynamics that remain hidden from the public file. That means
      the diligence plan should focus less on broad market validation and more on denominator proof: current TTM revenue, ARR, growth by
      segment, gross margin, NRR, federal concentration, customer concentration, and exact sponsor terms. Kill triggers are also concrete.
      If current revenue is still near the 2024 floor, if public-sector revenue is highly concentrated, if services make up a meaningful
      share of gross profit, or if the capital structure gives new money limited upside, the valuation quickly looks stretched. If the
      company can instead prove materially higher current revenue, premium software-like economics, and a credible strategic or IPO path,
      the same public evidence can move from stretched to fair.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
    tableRefs:
      - TV005
      - TV006
callouts:
  - calloutType: recommendation
    title: $1.2 billion is supportable only conditionally
    body: >-
      Exiger's current public file can support a premium narrative, but not a premium conclusion, unless management shows that current
      revenue is already well above the last reported floor and that the business is economically software-like rather than services-heavy.
    claimRefs:
      - CV031
      - CV032
      - CV034
      - CV040
      - CV042
      - CV050
  - calloutType: risk
    title: Opaque sponsor terms are as important as market size
    body: >-
      The biggest blocker is not category relevance; it is that the public record still hides ARR, margin, retention, cap-table terms,
      and government revenue concentration, which are exactly the variables that determine whether a premium multiple is deserved.
    claimRefs:
      - CV040
      - CV041
      - CV046
      - CV050
