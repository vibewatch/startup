  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue denominator disappoints
        - Current TTM revenue is still near the >$150M 2024 floor
        - The reported $1.2B mark stays near an 8x floor multiple rather than compressing into a fairer range.
        - Treat valuation as stretched and require repricing or a stronger structured upside case.
      - - Software mix disappoints
        - Services or analyst-led support account for a material share of gross profit
        - Exiger starts to look more like a tech-enabled services platform than a premium analytics platform.
        - Lower the comparable band toward workflow or services-heavy vendors.
      - - Government concentration is high
        - Public sector or a few federal programs make up a large share of ARR or gross profit
        - Renewal volatility and procurement timing become first-order valuation drivers.
        - Apply concentration discount and require contract-level renewal visibility.
      - - Sponsor terms cap upside
        - Leverage, liquidation preferences, or ownership structure skew economics away from new-money equity
        - Gross enterprise value can look acceptable while equity returns still disappoint.
        - Rework return math on a fully diluted equity basis before advancing.
      - - Exit market remains selective
        - Buyers still prefer profitability and discount generic growth in 2026-2027
        - Even a solid business can miss sponsor return targets if exit multiples stay compressed.
        - Underwrite longer hold periods and a lower exit multiple range.
    notes: >-
      Kill triggers focus on valuation transmission rather than operating noise; each one can break return math without disproving that
      Exiger has a relevant product.
    claimRefs:
      - CV031
      - CV039
      - CV040
      - CV041
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue and ARR
        - Audited 2025 revenue, current TTM revenue, current ARR, and segment bridge
        - This is the denominator for every valuation and return conclusion.
        - CFO pack and quality-of-revenue bridge.
      - - Gross margin and software mix
        - Gross margin by segment plus software versus services revenue and gross profit mix
        - Determines whether premium analytics comps are appropriate.
        - Finance diligence and product-line P&L review.
      - - Retention and concentration
        - Gross and net retention, top-20 customer concentration, and public-sector concentration
        - Clarifies durability and whether government depth is moat or concentration risk.
        - Revenue-operations pack and cohort analysis.
      - - Sponsor terms and cap table
        - Entry valuation, ownership split, leverage, liquidation preferences, and employee option overhang
        - Gross value support can still fail to produce acceptable equity returns.
        - Legal and cap-table diligence with sponsor side letter review.
      - - Acquisition integration
        - Revenue retention and synergy realization for Supply Dynamics, XSB, and Versed AI
        - Integration success determines whether scale translates into durable economics.
        - M&A diligence with acquired product and customer bridge.
      - - Exit path evidence
        - Strategic-buyer map, IPO readiness view, and likely buyer objections
        - Sponsor return expectations depend on a credible liquidity path, not just growth.
        - Board materials, banker perspectives, and buyer-call plan.
    notes: >-
      Each ask is aimed at moving a valuation decision, not just enriching the narrative. The public record is already strong enough on
      market relevance and weak exactly where underwriting needs precision.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV046
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Exiger's public valuation case is a chain in which real scale and category proof are partially offset by economics opacity and a
      higher 2026 exit hurdle.
    data:
      nodes:
        - id: scale
          label: Verified scale
          detail: 550+ customers, 150 Fortune 500 relationships, and 60+ government / DIB organizations are public in 2026 materials.
        - id: proof
          label: Premium signals
          detail: AWS Marketplace availability, Hackett recognition, and sponsor backing support strategic relevance.
        - id: denominator
          label: Reported denominator
          detail: Forbes reported >$150M 2024 revenue and >80% five-year CAGR.
        - id: opacity
          label: Economics opacity
          detail: ARR, gross margin, NRR, services mix, and sponsor terms remain undisclosed.
        - id: exit
          label: 2026 exit bar
          detail: Private equity exits are slower and buyers are more selective on software valuations.
        - id: call
          label: Recommendation
          detail: Research-more with a stretched valuation stance until management closes the denominator gap.
      edges:
        - from: scale
          to: proof
          label: supports
        - from: proof
          to: denominator
          label: helps justify
        - from: denominator
          to: opacity
          label: still depends on
        - from: opacity
          to: exit
          label: collides with
        - from: exit
          to: call
          label: drives
    approximationNotes: >-
      This figure is decision logic, not a process map; it visualizes the evidence chain that moves the recommendation from investable
      company to conditional valuation support.
