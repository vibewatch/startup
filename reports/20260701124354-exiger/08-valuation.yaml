  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current-revenue-and-arr
      missingEvidence: Audited 2025 revenue, current TTM revenue, current ARR, and a segment bridge for commercial, government, and acquired product lines.
      whyItMatters: The denominator determines whether the reported $1.2 billion mark is an 8x floor multiple or a fairer mid-single-digit entry.
      diligencePath: Request a CFO-quality revenue bridge, ARR reconciliation, and 24-month bookings history by segment.
      relatedQuestionRefs:
        - QV007
        - QV009
        - QV010
        - QV019
        - QV021
        - QV022
      relatedTableRefs:
        - TV003
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics-and-mix
      missingEvidence: Gross margin, NRR, gross retention, services versus software mix, and contribution margin by major product line.
      whyItMatters: Public comp selection changes materially depending on whether Exiger behaves like premium analytics software or tech-enabled services.
      diligencePath: Request cohort retention analysis, gross-margin bridge, and product-line P&L by software and services categories.
      relatedQuestionRefs:
        - QV021
        - QV022
        - QV024
        - QV027
      relatedTableRefs:
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: sponsor-terms-and-cap-table
      missingEvidence: Entry valuation mechanics, leverage, liquidation preferences, ownership split, employee option overhang, and any structured downside protections.
      whyItMatters: Enterprise-value support can still fail to translate into acceptable equity returns if sponsor terms are unfavorable to new investors.
      diligencePath: Review cap table, debt schedule, transaction memo, and sponsor-side letter terms with counsel and finance.
      relatedQuestionRefs:
        - QV024
        - QV025
        - QV028
        - QV030
      relatedTableRefs:
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: government-concentration
      missingEvidence: Revenue, ARR, gross profit, and renewal schedule by federal, DIB, and commercial cohorts.
      whyItMatters: Government depth can be either a moat or a concentration discount depending on its share of economic value and renewal timing.
      diligencePath: Request customer-concentration schedules, top-program renewal calendars, and public-sector pipeline conversion data.
      relatedQuestionRefs:
        - QV020
        - QV029
        - QV030
      relatedTableRefs:
        - TV005
        - TV006
    - type: missing-source
      severity: material
      topic: TV004 comparable valuation coverage
      missingEvidence: Exact enterprise values, margin profiles, and public revenue denominators for several private and M&A comparables in TV004.
      whyItMatters: The comparable table is directionally useful, but missing denominator detail limits precise multiple transfer into Exiger's underwriting range.
      diligencePath: Supplement TV004 with banker comps, sponsor memos, or private-company financial snapshots for Chainalysis, Sayari, Interos, and Recorded Future.
      relatedQuestionRefs:
        - QV015
        - QV016
        - QV017
        - QV019
      relatedTableRefs:
        - TV004
