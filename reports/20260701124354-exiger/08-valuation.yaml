company:
  name: Exiger
chapter:
  number: 8
  title: Valuation
  summary: >-
    Exiger is supportable as a real, scaled supply-chain risk software asset, but the public record only conditionally supports the
    reported $1.2 billion mark. On Forbes's reported >$150 million 2024 revenue floor, the price implies roughly 8.0x revenue, so the
    current public file supports a research-more recommendation with a stretched valuation stance until management proves materially
    higher current revenue, software-like margins, and manageable government concentration.
sections:
  - id: price-support-versus-disclosure
    title: Price Support Versus Disclosure Quality
    body: >-
      The public record establishes that Carlyle and Insight bought into Exiger in late 2023 and that independent deal coverage put the
      valuation at about $1.2 billion, but the official sponsor and company releases still do not disclose the price, ownership split,
      leverage, or preference structure. That matters because the most important denominator is still a third-party-reported management
      claim: Forbes wrote in March 2024 that Exiger expected revenue to exceed $150 million by the end of 2024 and had compounded above
      80% annually over the prior five years. Against that floor, the reported $1.2 billion value implies about 8.0x revenue, which is
      not obviously unreasonable for a differentiated risk-data platform but is clearly not cheap either. The 2026 AWS and Hackett
      materials strengthen the quality story by showing 550+ customers, 150 Fortune 500 relationships, 60+ government and Defense
      Industrial Base organizations, and procurement relevance. But they still leave ARR, gross margin, retention, services mix,
      cash-flow profile, and public-sector concentration unreported. So the core valuation judgment is evidence-sensitive rather than
      company-quality-sensitive: Exiger may deserve a premium mark, but the current public file does not prove it.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV031
      - CV032
      - CV040
      - CV041
      - CV050
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
      - FV004
  - id: public-and-private-comparable-frame
    title: Public and Private Comparable Frame
    body: >-
      Public comps provide a usable range, but they are imperfect and should be read as valuation anchors rather than literal peers.
      Dun & Bradstreet, NICE, and TransUnion sit in the lower band of adjacent data or workflow vendors at roughly 1.7x to 3.0x trailing
      revenue on public market-cap-to-revenue proxies. Verisk and Moody's occupy the premium end at roughly 7.8x and 10.1x respectively,
      reflecting stronger disclosure, high-margin analytics economics, and more mature data-network advantages. Exiger's implied 8.0x
      floor multiple therefore lands much closer to premium analytics names than to the lower-growth or workflow-heavy names. That can be
      defensible only if current revenue is already comfortably above the 2024 floor and if Exiger's economics look more like scaled
      software and analytics than like a services-heavy compliance platform. Private and M&A references reinforce strategic appetite for
      intelligence assets, but they do not cleanly solve valuation support. Chainalysis reached an $8.6 billion valuation, Interos crossed
      $1 billion, Sayari attracted a $235 million strategic majority investment, and Mastercard agreed to buy Recorded Future for $2.65
      billion. Those examples show sponsor and strategic demand for networked risk-data assets, but each sits in a different end market,
      disclosure regime, and margin profile. The comp set is therefore helpful, but only with explicit caveats.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
