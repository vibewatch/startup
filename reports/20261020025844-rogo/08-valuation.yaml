company:
  name: Rogo
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rogo has demonstrated rapid reported growth, substantial institutional adoption, and access to
    capital, but the retained public evidence does not disclose the Series D valuation, gross margin,
    retention, cash balance, burn, or preference terms. The appropriate decision is research-more:
    historical financing and estimated operating metrics are useful anchors, not a supportable current
    fair-value range or target-return underwriting.
sections:
  - id: investment-call
    title: Investment call and decision logic
    body: >-
      The recommendation is research-more with medium confidence, high underwriting risk, and an
      indeterminate valuation stance. Rogo announced a $160 million Series D and said total funding
      exceeded $300 million, while the company reported more than 35,000 users across over 250
      institutions. Those signals support product demand and financing capacity, but funding raised is
      not cash available and reported adoption is not revenue quality. The retained evidence provides
      no Series D price, preference stack, gross margin, net retention, cash balance, or burn rate.
      Without both entry price and verified recurring economics, a target return, hold period, or exit
      value would be false precision rather than underwriting.
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-and-economics
    title: Financing context and operating anchors
    body: >-
      The strongest historical price anchor is the January 2026 Series C: Forbes and Sacra report a
      $75 million round at a $750 million post-money valuation. Forbes separately reports that revenue
      rose from $2 million in 2024 to more than $15 million in 2025, implying that the Series C was
      priced at less than 50 times the disclosed prior-year revenue. Sacra later estimates $53 million
      of ARR in August 2026 and approximately $3,300 per seat annually, but ARR is not accounting
      revenue and the estimate is not company-confirmed. These figures indicate rapid expansion while
      leaving revenue recognition, contract value, gross margin, retention, and the Series D valuation
      unresolved.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV014
  - id: thesis-and-scenarios
    title: Thesis, anti-thesis, and scenarios
    body: >-
      The thesis is that domain-specific workflows, financial-data integrations, and reported
      institutional usage can support a durable vertical software franchise. Rogo says Felix can
      automate multi-step work from screening through diligence, and its team emphasizes experience
      across banking, investing, and AI. The anti-thesis is equally material: Sacra identifies reliance
      on third-party model providers and tightening AI governance, while the public evidence does not
      establish durable margins, retention, or pricing power. The bull, base, and bear cases therefore
      use observable proof points and diligence triggers rather than invented valuation ranges. A
      higher price is defensible only after the estimated ARR and contract economics are verified.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV002
      - TV003
  - id: exit-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Public evidence is insufficient to call Rogo exit-ready or to select a defensible public-company,
      M&A, or private-round multiple. The Series C is a historical transaction, not a current fair-value
      opinion; Sacra's ARR estimate is an analytical input, not audited performance; and competitor
      valuations are not independent benchmarks for Rogo. Before an investment decision, diligence
      should obtain the Series D cap table and preference waterfall, audited or board-approved ARR and
      revenue bridges, gross margin, cohort retention, cash and burn, customer concentration, contract
      duration, and renewal data. Thesis breaks include materially lower verified ARR, weak retention,
      uneconomic data or model costs, regulatory limits on core workflows, or an entry price that
      cannot produce the required return under a conservative exit case.
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV012
      - CV013
      - CV014
      - CV015
