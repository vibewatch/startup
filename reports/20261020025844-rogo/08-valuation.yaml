  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Institutional adoption can create expansion and workflow depth
        - "Company-reported scale exceeds 35,000 professionals at more than 250 institutions"
        - "Verified cohorts showing durable renewals, seat expansion, and low concentration"
      - - Thesis
        - Domain workflows may differentiate Rogo from generic assistants
        - "Felix is described as executing screening, CIM generation, outreach, and diligence"
        - "Independent accuracy, productivity, and switching-cost evidence"
      - - Anti-thesis
        - Economics may not justify the financing trajectory
        - "Series C was $750M post-money against more than $15M of reported 2025 revenue"
        - "Verified ARR, margin, retention, and a disclosed Series D price"
      - - Anti-thesis
        - External models and regulation can compress margins or limit deployment
        - "Sacra identifies model-provider and AI-governance dependencies"
        - "Contractual model access, stable data costs, and regulator-accepted controls"
    notes: "Adoption figures are company-reported; the historical financing-to-revenue comparison uses revenue, not ARR, and does not establish a current market multiple."
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Trigger
    rows:
      - - Bull
        - "Sacra's $53M ARR estimate is verified; growth, retention, and gross margin support premium vertical-software economics"
        - "Underwrite from verified forward ARR and cash generation only after the Series D price and preferences are disclosed"
        - "Possible, but unproven by public evidence"
        - "Independent customer cohorts and audited economics meet or exceed the estimate"
      - - Base
        - "Adoption continues, but implementation and data costs moderate margin and growth"
        - "Use the $750M Series C only as a historical reference; no current range is supportable"
        - "Most consistent with the mixed evidence"
        - "Verified ARR is below the estimate or retention and margin are merely adequate"
      - - Bear
        - "Reported adoption does not convert into durable high-margin recurring revenue"
        - "Down-round or impaired-return risk rises because the entry price cannot be reconciled to verified economics"
        - "Material downside remains open"
        - "Weak retention, concentrated customers, regulatory limits, or uneconomic model and data costs"
    notes: "Qualitative scenarios replace unsupported point probabilities and valuation ranges; the cited ARR is Sacra's estimate and is not interchangeable with accounting revenue."
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
