callouts:
  - calloutType: recommendation
    title: Price and proof must move together
    body: >-
      Advance only if the Series D price and preference stack are disclosed and verified ARR,
      retention, gross margin, and cash burn support a conservative return case; otherwise keep the
      company on a research-more track.
    claimRefs:
