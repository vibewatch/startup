  topStrengths:
    - Rogo reports more than 35,000 financial professionals using the platform across over 250 institutions.
    - >-
      A $160 million Series D and more than $300 million of reported cumulative funding provide substantial financing
      capacity.
    - >-
      Domain-specific data integrations and multi-step finance workflows create a more specialized proposition than a
      general-purpose assistant.
    - Rapid financing, product milestones, and repeat institutional backing indicate strong market interest.
  topRisks:
    - >-
      The Series D valuation, preference stack, and current entry price are not disclosed, preventing target-return
      underwriting.
    - Company-confirmed revenue, realized pricing, gross margin, retention, cash, burn, and runway remain unavailable.
    - >-
      Tenant permission isolation, certification scope, and production error rates are principally vendor-described
      rather than independently verified.
    - Third-party model and licensed-data dependencies can affect availability, product quality, and gross margin.
  unresolvedGaps:
    - Obtain the Series D valuation, cap table, liquidation preferences, and ownership and governance rights.
    - >-
      Reconcile company-confirmed ARR to revenue, bookings, deferred revenue, gross margin, retention cohorts, cash,
      burn, and runway.
    - >-
      Verify current SOC 2 and ISO certificates, control scope, exceptions, and tenant-specific permission isolation
      through adversarial testing.
    - >-
      Review model-provider and financial-data contracts for pricing, concentration, renewal, portability, and
      redistribution rights.
    - Obtain customer concentration, contract duration, active-seat definitions, renewal, churn, and expansion data.
