companyProfile:
  summary: >-
    Rogo is a private, New York-founded vertical AI company serving institutional finance. Its platform combines firms'
    internal information with licensed and public financial data to automate research, analysis, presentations, models,
    and agentic deal workflows. Rogo reported more than 35,000 users across over 250 institutions after raising a $160
    million Series D in April 2026.
