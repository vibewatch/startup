  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Independent certification records, penetration-test results, incident history, and a current control-scope statement.
      whyItMatters: Company-reported controls do not establish operating effectiveness or the boundaries of protected customer data.
      diligencePath: Request SOC and ISO reports, penetration-test executive summaries, incident logs, and a control-to-product-scope mapping from Rogo.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: product-performance
      missingEvidence: Customer-level accuracy, latency, completion-rate, uptime, support-response, and workflow outcome benchmarks.
      whyItMatters: Adoption counts show distribution but do not establish reliability, quality, or measurable customer benefit.
      diligencePath: Review production telemetry and three customer references using common task definitions and matched pre-deployment baselines.
      relatedQuestionRefs: [QE004, QE007]
    - type: private-evidence-only
      severity: material
      topic: architecture-risk
      missingEvidence: Internal architecture, model-provider mix, retrieval evaluations, isolation design, approval gates, and external data-provider contract terms.
      whyItMatters: These details determine error propagation, switching costs, data risk, and resilience to provider changes.
      diligencePath: Conduct an architecture review and inspect model cards, evaluation suites, entitlement contracts, lineage controls, and recovery procedures.
      relatedQuestionRefs: [QE003, QE005]
    - type: missing-source
      severity: minor
      topic: developer-signal
