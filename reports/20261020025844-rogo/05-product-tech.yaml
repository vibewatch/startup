artifact: product-tech
slug: rogo
runDate: 2026-10-20
company:
  name: Rogo
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Rogo's public product surface centers on a finance-specific workspace and the Felix agent,
    which are reported to produce research, financial models, presentations, and multi-step deal
    workflows using internal institutional data and licensed external feeds. The evidence supports
    broad production adoption and a meaningful workflow-integration thesis, but independent
    benchmarks, architecture detail, reliability history, certification records, and public
    developer signals remain material diligence gaps.
sections:
  - id: product-and-workflow
    title: Product surface and user workflow
    body: >-
      Rogo is positioned as a workflow system for investment bankers, private-equity investors,
      hedge funds, and other financial professionals rather than as a general-purpose chatbot.
      Public reporting describes a chat-first workspace, reusable Quick Actions, a spreadsheet
      agent, and Felix, an email-accessible agent intended to carry work from research through
      deliverable creation. The supported jobs include company research, investment memos,
      financial-model construction and updating, presentation drafting, deal screening, CIM
      generation, buyer outreach, and data-room diligence. This breadth is strategically
      important because the product can sit across multiple steps of a deal team's existing
      process, but most detailed capability descriptions ultimately originate with Rogo or
      secondary publications repeating its claims. The available material does not establish
      independently measured accuracy, completion time, or error rates for these workflows.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE008]
    tableRefs: [TE001, TE002]
  - id: architecture-and-data
    title: Architecture, grounding, and integration
    body: >-
      The disclosed operating model has four observable layers: user interfaces, an agent or
      workflow-orchestration layer, finance-oriented language-model processing, and data
      grounding across institutional systems and licensed financial sources. SiliconANGLE reports
      that custom-trained large language models use CRM and other internal-system data and can
      ingest FactSet, while Sacra describes connections to deal-room documents, Excel,
      PowerPoint, Word, data warehouses, LSEG, PitchBook, Quartr, and international filings.
      Outputs are designed to return to the tools bankers already use, which can improve adoption
      and auditability. This architecture also creates dependencies on data entitlements,
      integration quality, model providers, and the correctness of retrieved source material.
      Public evidence does not disclose model evaluation methodology, isolation design, retrieval
      accuracy, or contractual resilience of the external data feeds.
    claimRefs: [CE002, CE005, CE006, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-support
    title: Maturity, deployment, and support model
    body: >-
      Reported adoption is consistent with a product beyond an early pilot stage, although the
      exact denominator changes across sources. Forbes reported more than 25,000 daily users at
      150 firms in April 2026, while Rogo's April 29 announcement said more than 35,000
      professionals at over 250 institutions used the platform in daily workflows. The difference
      may reflect rapid growth, reporting cutoffs, or differing definitions of firms and
      institutions; no audited cohort reconciles the two figures. Rogo also says it uses
      forward-deployed engineers and bankers to help customers adopt the system. That service
      model can reduce implementation friction in complex banks, but it may make deployment
      quality dependent on scarce expert labor. No reviewed source provides implementation time,
      support response targets, uptime history, retention, or a dated product roadmap.
    claimRefs: [CE009, CE010, CE011, CE012, CE014]
  - id: controls-differentiation-and-risk
    title: Differentiation, controls, and technical risk
    body: >-
      Rogo's defensibility appears to come from finance-specific workflow design, integration with
      proprietary institutional context, licensed market data, and the ability to write outputs
      into familiar office and deal tools. Those are potentially stronger switching costs than
      model access alone, particularly where audit trails and permissions matter. SiliconANGLE
      reports that the platform includes audit trails, access controls, and a Rogo-developed tool
      called Sisyphus that scans infrastructure daily for vulnerabilities. These are relevant
      controls, but they remain company claims relayed by a publication; the assigned evidence
      contains no independent certification record, penetration-test result, incident history,
      service-level disclosure, or model-risk assessment. It also contains no public repository,
      package, API forum, engineering talk, or practitioner-community signal from which to assess
      developer maturity. The technical thesis is therefore credible at the product-workflow
      level but not independently validated at the security, reliability, or architecture level.
    claimRefs: [CE005, CE007, CE013]
callouts:
  - calloutType: risk
    title: Technical diligence priority
    body: >-
      Obtain architecture diagrams, model and retrieval evaluations, data-entitlement terms,
      security certifications, penetration-test results, incident history, and customer-level
      uptime and support evidence before treating the reported control layer as independently
      verified.
    claimRefs: [CE007, CE013]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or product line
      - Primary user
      - Publicly evidenced maturity
      - Differentiation
      - Principal diligence gap
    rows:
      - - Finance workspace
        - Investment bankers, private-equity investors, and asset managers
        - Reported in daily use across more than 250 institutions
        - Finance-specific interface grounded in institutional and external data
        - No public version history, release cadence, or independent usability benchmark
      - - Felix agent
        - Deal teams and financial analysts
        - Company says it executes multi-step workflows in production
        - Moves from question answering to deal screening, CIM generation, outreach, and diligence
        - Autonomy boundaries, approval gates, error rates, and liability allocation are undisclosed
      - - Spreadsheet and modeling agent
        - Analysts building and reviewing financial models
        - Sacra describes read, explain, audit, edit, and model-refresh functions
        - Writes results back into Excel and works with complex finance models
        - No independent formula-accuracy, audit, or model-corruption testing
      - - Quick Actions and deliverable tools
        - Bankers preparing profiles, memos, comparisons, and decks
        - Sacra reports pre-built workflows in the product workspace
        - Reduces prompt-engineering needs and produces familiar deliverables
        - No verified cycle-time or quality improvement by task
      - - Control and implementation layer
        - Bank risk teams, administrators, and deployment teams
        - Audit trails, access controls, daily scanning, and forward-deployed support are reported
        - Finance-aware implementation and controls can lower adoption friction
        - Certifications, uptime, incident history, and service-level performance are not evidenced
    notes: >-
      Maturity and functionality reflect public reporting and company claims; no row should be
      read as an independently verified performance, security, or certification assessment.
    claimRefs: [CE001, CE003, CE004, CE006, CE007, CE008, CE009, CE014]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Prior workflow
      - Rogo solution
      - Publicly supportable benefit
      - Limitation
    rows:
      - - Research and memo preparation
        - Search internal and external sources, synthesize findings, and draft a deliverable
        - Chat-first workspace and Quick Actions return reports, memos, and decks with source context
        - Public sources support broader workflow coverage, not a verified time or accuracy gain
        - No task-level benchmark or independent output-quality review
      - - Financial-model construction and update
        - Pull data, trace formulas, refresh comparables, and roll models forward in Excel
        - Spreadsheet agent reads, explains, audits, edits, and writes results back to the workbook
        - Integration preserves the familiar Excel work surface
        - No disclosed hallucination, formula-error, or audit-pass rate
      - - Deal screening and CIM generation
        - Review opportunities, gather evidence, analyze fit, and draft transaction materials
        - Felix is described as executing the multi-step process autonomously
        - Scope is documented across multiple publications and a company announcement
        - Human approval boundaries and production error data are undisclosed
      - - Buyer outreach and data-room diligence
        - Build buyer lists, coordinate outreach, inspect documents, and summarize issues
        - Felix is described as supporting outreach and diligence across the deal process
        - Extends the platform from research toward execution workflows
        - No independent deployment study, outcome metric, or liability framework
    notes: >-
      The assigned evidence does not provide comparable before-and-after performance measurements;
      benefit cells therefore state only what the public record supports.
    claimRefs: [CE002, CE003, CE004, CE006, CE008, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Reported role
      - Key dependency
      - Technical or operating risk
    rows:
      - - Interaction layer
        - Chat-first workspace, email access to Felix, and familiar office-tool surfaces
        - Email, Excel, PowerPoint, Word, and institutional access controls
        - Interface convenience does not prove workflow correctness or secure configuration
      - - Agent orchestration
        - Plans and executes multi-step finance tasks and recurring role-specific work
        - Reliable tool use, approval gates, and workflow state management
        - Public evidence does not disclose orchestration design, failure recovery, or autonomy limits
      - - Finance reasoning
        - Custom-trained language models process finance prompts and generate analysis
        - Model quality, evaluation data, and possibly third-party model availability
        - No independent finance-reasoning benchmark or model-change control evidence
      - - Data grounding
        - Combines internal CRM, data-room, and warehouse context with licensed external sources
        - Data entitlements, connector reliability, retrieval quality, and source freshness
        - Provider terms, lineage controls, and retrieval-error rates are not public
      - - Deliverables and controls
        - Produces reports, decks, and spreadsheets with audit trails and access controls
        - Output-tool integrations, permission mapping, scanning, and implementation support
        - No independent certification, uptime history, incident disclosure, or service-level evidence
    notes: >-
      This is a synthesis of disclosed product behavior, not a verified internal architecture
      diagram; undocumented components and dependencies are intentionally treated as gaps.
    claimRefs: [CE002, CE005, CE006, CE007, CE013, CE014]
figures:
  - id: FE001
    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
      A six-layer view of the interfaces, orchestration, reasoning, data, deliverables, and controls
      described in the assigned public evidence.
    data:
      layers:
        - label: User interfaces
          detail: Entry points embedded in finance professionals' existing work patterns
          items:
            - Chat-first workspace
            - Email access to Felix
        - label: Workflow orchestration
          detail: Reusable and multi-step task execution
          items:
            - Felix agent
            - Quick Actions
        - label: Finance reasoning
          detail: Domain-oriented processing for financial analysis
          items:
            - Custom-trained language models
            - Spreadsheet and modeling agent
        - label: Data grounding
          detail: Institution-specific context plus entitled external sources
          items:
            - Internal CRM, files, and data rooms
            - FactSet, LSEG, PitchBook, Quartr, and filings
        - label: Deliverables
          detail: Outputs returned to familiar finance tools
          items:
            - Reports, memos, and presentation decks
            - Excel financial models
        - label: Controls and adoption
          detail: Publicly reported governance and implementation mechanisms
          items:
            - Audit trails and access controls
            - Sisyphus scanning and forward-deployed support
    approximationNotes: >-
      Layer ordering is an analytical synthesis of public descriptions; it does not represent a
      company-published systems diagram or independently verified component boundary.
    claimRefs: [CE002, CE005, CE007, CE008, CE013, CE014]
