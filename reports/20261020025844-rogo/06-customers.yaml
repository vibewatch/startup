company:
  name: "Rogo"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Rogo reports more than 35,000 financial professionals across more than 250
    institutions, with named adoption at major investment banks, but the public
    record does not disclose retention, concentration, or customer-level
    production outcomes. The evidence supports broad institutional traction
    while leaving durability and expansion economics dependent on private
    diligence.
sections:
  - id: "customer-footprint"
    title: "Institutional footprint and customer segments"
    body: >-
      Rogo's disclosed footprint is enterprise-first: the company reported more
      than 35,000 financial professionals and more than 250 institutions in
      April 2026. The named set is concentrated in global investment banking and
      advisory, while independent workflow analysis also identifies private-
      market and public-market investment teams as intended users. Buyers are
      therefore likely to include technology, operations, compliance, and
      business leadership, while day-to-day users include bankers, investors,
      and analysts. The platform is positioned across origination, execution,
      advisory, and portfolio intelligence rather than as a single research
      utility. That breadth expands potential seat and workflow penetration, but
      neither the user count nor institution count discloses geography, paid
      seats, active-user methodology, or revenue contribution by segment.
    claimRefs: [CU001, CU002, CU003, CU004, CU006]
    tableRefs: [TU001]
  - id: "adoption-proof"
    title: "Adoption scale and named customer proof"
    body: >-
      The strongest public adoption evidence is the company's current scale
      disclosure, repeated by independent publishers, plus named institutions
      including Rothschild & Co, Jefferies, Lazard, Moelis, and Nomura. A
      separate platform testimonial attributes a successful integration,
      productivity improvement, lower risk, and added banker capacity to Truist
      Securities chief executive Tom Hackett. These references are meaningful
      enterprise proof, but they do not establish comparable deployment scope:
      public materials do not state paid seats, contract value, rollout dates,
      renewal status, or measured outcomes for each named institution. Felix
      use cases such as deal screening, CIM generation, buyer outreach, and data
      room diligence indicate production-oriented workflows, yet most named
      customer evidence remains vendor-published rather than customer-issued.
    claimRefs: [CU001, CU002, CU003, CU005, CU011]
    tableRefs: [TU002, TU003]
  - id: "durability-expansion"
    title: "Commercial durability and expansion motion"
    body: >-
      Sacra characterizes Rogo as an enterprise subscription sold through
      multi-year contracts and estimates pricing at about $3,300 per seat per
      year, with additional revenue from specialized data access and paid
      features. Sacra also estimates $53 million of ARR in August 2026 versus
      $15 million at year-end 2025; these are analyst estimates, not company-
      confirmed revenue or cash metrics. The reported model implies expansion
      through seat growth and additional workflows, while Rogo's broad workflow
      catalog creates multiple adoption surfaces within one institution.
      However, Felix has a separate request-access route, and financial-data
      entitlements may require separate commercial rights. Expansion therefore
      depends on product access, implementation, permission mapping, data
      licensing, and sustained human review rather than on seat availability
      alone.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU014]
    figureRefs: [FU001]
  - id: "retention-and-concentration-gaps"
    title: "Retention, concentration, and procurement risk"
    body: >-
      None of the eight reviewed sources discloses NRR, GRR, churn, renewal
      rate, contract renewal outcomes, or top-customer revenue share. The public
      customer count therefore cannot establish durability, and the five named
      banks do not reveal whether revenue is diversified or concentrated.
      Public pricing is also incomplete: an independent review found no
      numerical tariff on the sales route, while Sacra's per-seat figure remains
      an estimate. Adoption carries review friction because financial work must
      preserve source periods, units, permissions, and human approval; one
      independent source explicitly warns that hallucination or data inaccuracy
      has an extreme cost in finance. Underwriting should require cohort
      retention, institution-level ARR bands, paid-versus-active seats,
      expansion by vintage, and references issued directly by customers.
    claimRefs: [CU003, CU008, CU013, CU014, CU015, CU016]
