  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "market-sizing"
      missingEvidence: >-
        A current, independent category-spend series for institutional-finance AI workflow
        software with geography, buyer segment, methodology, and comparable periods.
      whyItMatters: >-
        Without a common spending denominator, the fee pool and company-scale indicators
        cannot be converted into TAM, SAM, SOM, penetration, or market share.
      diligencePath: >-
        Commission or obtain analyst market data and triangulate it against procurement
        budgets and contract values from a representative customer sample.
      relatedQuestionRefs:
        - "QM002"
        - "QM009"
      relatedTableRefs:
        - "TM002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing"
      missingEvidence: >-
        Actual contract values, minimum commitments, module and data charges, discounts,
        implementation fees, renewal terms, and paid-seat definitions by customer cohort.
      whyItMatters: >-
        Public pricing estimates cannot establish willingness to pay, revenue expansion, or
        the buyer's fully loaded cost.
      diligencePath: >-
        Review anonymized contracts, renewal schedules, invoices, and cohort-level ARR with
        management and selected customers.
      relatedQuestionRefs:
        - "QM003"
        - "QM008"
    - type: "private-evidence-only"
      severity: "material"
      topic: "adoption-economics"
      missingEvidence: >-
        Gross and net retention, active and paid seats, query definitions, utilization
        distributions, implementation time, measured labor savings, and expansion by cohort.
      whyItMatters: >-
        Company-reported users, institutions, and queries do not reveal durable adoption,
        realized ROI, or efficient revenue expansion.
      diligencePath: >-
        Obtain cohort exports and independently reference customers across investment banking,
        private markets, and public markets.
      relatedQuestionRefs:
        - "QM004"
        - "QM006"
    - type: "private-evidence-only"
      severity: "material"
      topic: "data-entitlements"
      missingEvidence: >-
        Data-provider contract terms, entitlement mapping, pass-through economics,
        redistribution rights, exclusivity, renewal dates, and termination exposure.
      whyItMatters: >-
        Licensed data affects product coverage, gross margin, procurement complexity, and the
        durability of Rogo's workflow advantage.
      diligencePath: >-
        Review supplier agreements, entitlement architecture, gross-margin bridges, renewal
        calendars, and contingency plans for each material data provider.
      relatedQuestionRefs:
        - "QM004"
        - "QM005"
