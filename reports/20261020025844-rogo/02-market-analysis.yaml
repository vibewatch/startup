callouts:
  - calloutType: "risk"
    title: "Do not capitalize the fee pool as software TAM"
    body: >-
      The $117 billion figure is global investment-banking fee revenue, while Rogo's revenue
      comes from enterprise software, features, data access, and deployment. Applying a
      software share to that fee pool without customer budgets, contract values, and retention
      would create false precision.
    claimRefs:
      - "CM004"
      - "CM007"
      - "CM016"
  - calloutType: "recommendation"
    title: "Underwrite from contracts and cohorts"
    body: >-
      Request ARR by customer segment, paid and active seats, gross and net retention, contract
      duration, implementation cost, data-license pass-through, query intensity, and realized
      workflow savings before assigning a market-share or terminal-growth assumption.
    claimRefs:
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM016"
