          note: "Current company homepage claim; cohort mix unavailable"
        - label: "Daily queries"
          value: 200000
          unit: "queries/day"
          note: "Current company homepage claim; query definition unavailable"
    approximationNotes: >-
      No interpolation or market-share conversion is applied. The pyramid is an evidence
      ladder with mixed units, periods, and denominators; layer order does not imply numerical
      containment or a value-proportional scale.
    claimRefs:
