company:
  name: "Rogo"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Rogo addresses institutional-finance research and deliverable workflows rather than the
    entire financial-services software market. Public evidence shows meaningful adoption and
    a large adjacent investment-banking fee pool, but it does not support a defensible
    TAM/SAM/SOM conversion because the available fee, ARR, seat, institution, user, and query
    measures have different denominators.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      Rogo's defensible core market is institutional-finance knowledge work: recurring
      research, financial analysis, and production of models, reports, presentations, and
      transaction materials for investment banks and investment firms. The boundary excludes
      the underlying market-data terminals and licensed datasets, core banking systems,
      general-purpose productivity software, and unrelated finance functions such as close,
      audit, and broad FP&A. Private-markets and public-markets teams are credible adjacencies,
      but their workflows and willingness to pay should not be assumed identical to
      investment banking. Status-quo substitutes include analyst labor coordinated through
      spreadsheets, documents, email, and data terminals; internal AI builds; horizontal
      copilots; and specialist research or modeling products. Partner data access expands
      utility while also exposing Rogo to licensing and entitlement constraints.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM014"
    tableRefs:
      - "TM001"
  - id: "sizing-without-false-precision"
    title: "Sizing lenses without false precision"
    body: >-
      The strongest public top-down proxy is Sacra's report of a $117 billion global
      investment-banking fee pool in 2024, with 45% generated outside the Americas and Asia
      representing about 35% of historical deal value. Those figures describe banking
      economics and geographic activity, not software spend or Rogo's addressable revenue.
      Bottom-up observables are also incomplete: Sacra estimates $53 million of ARR in August
      2026 and roughly $3,300 per seat annually, while Rogo's current homepage claims 60,000
      users, 450 institutions, and 200,000 daily queries. April company-issued coverage cited
      35,000 professionals at 250 institutions. The later figures may indicate expansion, but
      no common measurement date, paid-seat definition, institution definition, retention
      rate, or independently verified contract value supports a growth calculation. The
      evidence therefore supports several sizing lenses, not a single TAM.
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-user-and-payer"
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The economic buyer is likely an institution rather than an individual analyst because
      the product is sold through negotiated enterprise deployments, requires firm data and
      licensed-content entitlements, and has no self-serve tier. Bankers and investors are the
      users; operating, technology, data, security, and business-unit leaders are likely
      participants in purchase approval and budget ownership. Adoption should begin with a
      bounded, repetitive workflow whose source set and final output can be reviewed, then
      expand only after the institution validates accuracy, permission propagation, review
      burden, and realized time savings. This makes implementation and governance part of the
      product, not merely post-sale services. Smaller boutiques face a higher hurdle because
      opaque enterprise pricing and integration costs must be spread across fewer users.
    claimRefs:
      - "CM002"
      - "CM008"
      - "CM009"
      - "CM014"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation"
    title: "Growth drivers, constraints, and valuation relevance"
    body: >-
      Adoption is driven by expensive recurring analyst work, demand for auditable outputs,
      the ability to combine internal records with external financial data, and agents that
      can produce complete work products rather than isolated answers. The same design creates
      constraints: enterprise procurement is slow, private data permissions must survive into
      generated artifacts, third-party content licenses may limit access or redistribution,
      and human reviewers must preserve period, currency, unit, and source meaning. Pricing
      opacity also makes ROI difficult to benchmark before a pilot. For valuation, reported
      adoption and Sacra's ARR estimate are useful scale indicators, but the $117 billion fee
      pool is not a revenue multiple denominator. Underwriting requires contract-level ARR,
      retention, seat utilization, gross margin, data costs, and deployment economics before
      translating workflow breadth into a market-share or terminal-value assumption.
    claimRefs:
      - "CM003"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM012"
      - "CM015"
      - "CM016"
