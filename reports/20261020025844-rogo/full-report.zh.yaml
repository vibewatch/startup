chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Rogo 于 2021 年在纽约市由 Gabriel Stengel 和 John Willett 创立；另一份资料称 Tumas Rackaitis 是普林斯顿起源创始团队的第三位成员。公司是一家私营、处于
              Series D 阶段的垂直 AI
              厂商，服务投资银行、私募股权机构、资产管理公司及其他相关金融机构。其产品把企业内部信息与授权及公开金融数据结合，再自动完成研究、公司画像、投资备忘录、演示文稿和财务模型。这是一款企业工作流产品，而非通用聊天机器人：部署依赖数据集成、可审计性、访问控制，以及与
              Excel、PowerPoint、Word 和机构专用模板的适配。Sacra 将其商业模式描述为多年期企业订阅，按席位扩张并销售付费数据或功能附加项，但在审阅证据中，Rogo 尚未披露合同价格。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: 领导层、创始人与市场匹配及治理
        blocks:
          - type: paragraph
            body: >-
              创始团队直接接触过金融工作流：一份独立资料称 Stengel、Willett 和 Rackaitis 在普林斯顿相识，随后从事包括 J.P. Morgan 和 Lazard 在内的金融工作，并在获得 GPT-3
              开发者权限后扩展计量经济学聊天机器人项目。Gabriel Stengel 是公开点名的 CEO 和公司发言人；产品与工程资料还列出了创始人以下层级的职能负责人。这种组合支持创始人与市场的匹配，但也显露出对
              Stengel 客户叙事和创始人领域知识的关键人物依赖。在指定证据中，只有 Keith Rabois
              被确认是董事；完整董事会、观察员权利、持股、保护性条款和继任深度尚未通过公开资料得到确认。因此，领导层表只是部分列举，并非完整的管理或治理名单。
            claimRefs:
              - CO002
              - CO003
              - CO015
              - CO016
