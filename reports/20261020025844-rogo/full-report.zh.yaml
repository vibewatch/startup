              的价格，以及专业数据访问和付费功能带来的额外变现；这些是第三方估计，不是公司价目表，也不是实际合同价值证据。因此，该模式具备经常性收入和扩张收入特征，但保留证据没有披露折扣、最低承诺、实施费、收入确认方式，或席位、数据和功能之间的收入结构。Rogo
              的平台广度和引导式实施可能加强采用，但没有公开依据把实施工作视为单独定价的收入流。下方收入桥接图是机制图，而不是量化毛利桥。
