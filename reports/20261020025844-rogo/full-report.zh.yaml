      - number: '1.4'
        title: 里程碑与尽调判断
        blocks:
          - type: paragraph
            body: >-
              融资次序显示出异常迅速的资本形成：2024 年有种子轮和 Series A 记录，2025 年 4 月完成 Series B，2026 年 1 月完成 Series C，三个月后又完成 Series
              D。确切的种子轮时间线并不一致：Sacra 将种子融资放在 2024 年 2 月，而 Lex 称 2023 年末完成首笔 $7 million 种子轮；Lex 还称 Series A 为 $18.5
              million，而 Sacra 记为 $18 million。2026 年 3 月和 4 月，Offset 收购及 Felix 发布扩大了产品范围，将叙事推向自主、多步骤工作。投资人和公司来源展现出强劲采用度，但
              Lex 明确指出授权成本未知，并以假设为基础讨论收入。因此，核心尽调结论具有不对称性：客户覆盖和融资可见，但单位经济、留存、治理权利和公司确认收入仍不可得。仅凭本章信息，无法可靠评估资本效率或经营杠杆。
