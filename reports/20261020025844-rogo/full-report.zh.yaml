      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方很可能是机构而非单个分析师，因为产品通过协商式企业部署销售，需要公司数据和授权内容使用权，也没有自助服务层。银行家和投资人是用户；运营、技术、数据、安全和业务单元负责人可能参与采购审批和预算归属。采用应从范围受限、重复性高、来源集和最终产出可复核的工作流开始；只有机构验证准确性、权限传递、复核负担和实际节省时间后，才应扩展。这使实施和治理成为产品的一部分，而不只是售后服务。较小精品机构面临更高门槛，因为不透明的企业定价和集成成本要分摊给更少用户。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用由昂贵且重复的分析师工作、对可审计产出的需求、把内部记录与外部金融数据结合的能力，以及能够生成完整工作成果而非孤立答案的智能体推动。同一设计也带来约束：企业采购缓慢，私有数据权限必须延伸到生成的材料中，第三方内容许可可能限制访问或再分发，人工复核者还必须保留期间、币种、单位和来源含义。定价不透明也使试点前难以基准化
              ROI。估值时，已披露采用度和 Sacra 的 ARR 估计可作为规模指标，但 $117 billion 手续费池不是收入倍数分母。投资判断需要合同级
              ARR、留存、席位利用率、毛利率、数据成本和部署经济数据，才能把工作流广度转化为市场份额或终值假设。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 不要把手续费池资本化为软件 TAM
            body: $117 billion 是全球投行手续费收入，而 Rogo 的收入来自企业软件、功能、数据访问和部署。在没有客户预算、合同价值和留存数据的情况下，直接把软件份额套到该手续费池上会制造虚假精确。
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
              - CM016
          - type: callout
            title: 从合同和客户队列开始评估
            body: 在设定市场份额或终值增长假设前，应索取按客户分部拆分的 ARR、付费和活跃席位、总留存和净留存、合同期限、实施成本、数据许可转嫁、查询强度以及实际工作流节省。
            calloutType: recommendation
            claimRefs:
              - CM008
