      - number: '8.2'
        title: 融资背景与经营锚点
        blocks:
          - type: paragraph
            body: >-
              最强的历史价格锚点是 2026 年 1 月的 Series C：Forbes 和 Sacra 报道该轮融资 $75 million，投后估值 $750 million。Forbes 另称，收入从 2024 年的
              $2 million 增至 2025 年超过 $15 million，据此 Series C 定价低于已披露上一年度收入的五十倍。Sacra 后来估计 2026 年 8 月 ARR 为 $53
              million、年均每席位约 $3,300，但 ARR 不是会计收入，且该估计未经公司确认。这些数字显示扩张迅速，但收入确认、合同价值、毛利率、留存和 Series D 估值仍未解决。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV014
      - number: '8.3'
        title: 投资逻辑、反向逻辑与情景
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是：垂直领域工作流、金融数据集成和已披露的机构采用度，可以支撑持久的垂直软件业务。Rogo 称 Felix 能把从筛选到尽调的多步骤工作自动化，其团队强调在银行、投资和 AI
              领域的经验。反向逻辑同样重要：Sacra 指出对第三方模型供应商的依赖和趋严的 AI
              治理，而公开证据没有确认持久利润率、留存或定价权。因此，乐观、基准和悲观情景使用可观察的证明点和尽调触发条件，而不是凭空编造估值区间。只有在 ARR 估计和合同经济得到验证后，更高价格才有依据。
            claimRefs:
              - CV007
              - CV009
