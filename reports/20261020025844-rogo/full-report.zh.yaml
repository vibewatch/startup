      - number: '1.3'
        title: 资本结构与已披露规模
        blocks:
          - type: paragraph
            body: >-
              Rogo 于 2026 年 4 月 29 日宣布由 Kleiner Perkins 领投 $160 million Series D，并称本轮融资将累计融资推高至 $300 million 以上。该轮还包括
              Sequoia、Thrive Capital、Khosla Ventures、J.P. Morgan Growth Equity Partners、BoxGroup、Mantis VC、Jack
              Altman、Evantic 和 Positive Sum。公司还称，超过 250 家机构的 35,000 多名金融专业人士正在使用该平台。这些采用数据虽被独立媒体重复报道，但源头仍是
              Rogo，不应视为经审计的使用量。Sacra 另行估计，2026 年 8 月 ARR 为 $53 million，高于 2025 年末的 $15
              million；这是分析师估计，并非公司确认的收入。指定公开证据未确认当前员工数、毛利率、净留存率、现金余额、烧钱速度、债务或 Series D 投后估值，因此这些指标保持 null，而不是根据融资额推算。
