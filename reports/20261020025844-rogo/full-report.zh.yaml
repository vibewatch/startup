      - number: '8.4'
        title: 退出准备度、尽调要求与逻辑失效
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以判断 Rogo 已具备退出准备度，也不足以选择有依据的上市公司、并购或私募轮倍数。Series C 是历史交易，不是当前公允价值意见；Sacra 的 ARR
              估计是分析输入，不是经审计表现；竞争对手估值也不是 Rogo 的独立基准。投资决策前，尽调应取得 Series D 股权结构表和优先权瀑布、经审计或董事会批准的 ARR
              与收入桥接、毛利率、客户队列留存、现金与烧钱速度、客户集中度、合同期限和续约数据。逻辑失效包括经验证 ARR
              明显更低、留存疲弱、数据或模型成本不经济、核心工作流受监管限制，或进入价格在保守退出情景下无法产生所需回报。
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 价格与证据必须同步推进
            body: 只有在 Series D 价格和优先股堆叠得到披露，且经验证 ARR、留存、毛利率和现金烧钱速度支持保守回报情景时，才应推进；否则继续把公司放在继续研究轨道上。
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
