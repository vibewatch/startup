  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合比垂直 AI 同行更广
        blocks:
          - type: paragraph
            body: >-
              买方的替代集合从专业产品开始，但并不止于此。Rogo 围绕金融专用工作流和完成品定位；AlphaSense 从市场情报发现切入，Hebbia 则从大型文档集合的结构化分析切入。S&P Capital IQ 和
              Bloomberg 带来成熟的数据广度和既有分销；不过 Sacra 将其取舍描述为界面或合同复杂、定制能力较弱。内部开发以及人工研究加 Office
              的工作流仍是替代方案，因为银行可以不购买新应用而保留机构专属控制，尽管指定证据没有量化其成本、质量或见效速度。因此，真正的竞争是争夺完整的研究到交付工作流，而不只是最好的聊天回复。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
