  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Rogo
              可守住的核心市场是机构金融知识工作：为投资银行和投资机构提供持续研究、金融分析，以及模型、报告、演示文稿和交易材料制作。市场边界不包括底层市场数据终端和授权数据集、核心银行系统、通用生产力软件，以及结账、审计和广义
              FP&A 等无关金融职能。私募市场和公开市场团队是可信的相邻市场，但不应假定其工作流和支付意愿与投行完全相同。现有替代方案包括由电子表格、文档、邮件和数据终端协同完成的分析师劳动；内部 AI
              开发；横向副驾驶工具；以及专业研究或建模产品。合作伙伴的数据接入扩大了效用，也让 Rogo 暴露于授权和使用权限制。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
      - number: '2.2'
        title: 避免虚假精确的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              最有力的公开自上而下代理指标，是 Sacra 报告的 2024 年全球投行业务手续费池 $117 billion，其中 45% 来自美洲以外，亚洲约占历史交易价值的
              35%。这些数据描述的是银行业经济和地域活动，而不是软件支出或 Rogo 可获取的收入。自下而上的可观测数据同样不完整：Sacra 估计 2026 年 8 月 ARR 为 $53 million、年均每席位约
              $3,300；Rogo 当前主页则称有 60,000 名用户、450 家机构和 200,000 次日查询。4 月公司口径报道的是 35,000 名专业人士和 250
              家机构。后续数字可能意味着扩张，但没有统一测量日期、付费席位定义、机构定义、留存率或独立验证的合同价值来支持增长计算。因此，证据支持多个测算视角，而不是单一 TAM。
