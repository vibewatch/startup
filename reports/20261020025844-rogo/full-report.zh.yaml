  - id: FP001
    title: 定性竞争定位：工作流掌控度与金融专业化
    type: quadrant
    summary: X 轴表示从研究到最终交付成果的掌控范围；Y 轴表示金融专属数据和工作流专业化程度，均按 1-5 的序数尺度评分。
    data:
      points:
        - label: Rogo
          x: 5
          'y': 5
          note: 最终交付成果范围广，并有明确的金融专业化定位。
        - label: AlphaSense
          x: 2
          'y': 4
          note: 有金融研究发现能力的证据；但此处无法确认下游交付成果。
        - label: Hebbia
          x: 3
          'y': 3
          note: 有结构化文档分析能力的证据；但此处无法确认金融专属覆盖范围。
        - label: S&P Capital IQ Pro
          x: 3
          'y': 5
          note: 有金融数据覆盖广度的证据；但此处无法确认完整交付编排能力。
        - label: Bloomberg
          x: 3
          'y': 5
          note: 深耕资本市场并拥有既有分销渠道；据描述，其定制能力受限。
        - label: 内部自建
          x: 4
          'y': 3
          note: 理论上覆盖广且可定制，但实际范围取决于各家机构。
    approximationNotes: 分数是分析师根据指定公开描述作出的序数定位，不代表实测市场份额、产品表现或独立基准。分数只表达相对位置，未对未知能力作假设。
    claimRefs:
      - CP005
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: 收入机制与毛利依赖
    type: flow
    summary: 企业合同可以靠席位、数据访问和付费功能扩张，但云、模型、数据和实施成本使利润率桥接无法量化。
    data:
      nodes:
        - id: institutional-contract
          label: 多年期机构合同
          detail: 直接向金融机构销售的企业订阅。
        - id: seat-deployment
          label: 席位部署
          detail: 专业人士获得访问权限；实际席位条款未公开。
        - id: workflow-usage
          label: 工作流使用
          detail: 研究、建模和智能体工作流驱动平台活动。
        - id: expansion
          label: 数据与功能扩展
          detail: 专业数据访问和付费功能可以增加收入。
        - id: recurring-revenue
          label: 订阅与增值收入
          detail: Sacra 将该模式归类为经常性 B2B SaaS。
        - id: gross-profit
          label: 毛利，未量化
          detail: 云、模型、数据授权和支持成本会从收入中扣除。
      edges:
        - source: institutional-contract
          target: seat-deployment
        - source: seat-deployment
          target: workflow-usage
        - source: workflow-usage
          target: expansion
        - source: expansion
          target: recurring-revenue
        - source: recurring-revenue
          target: gross-profit
    approximationNotes: 这是定性机制图，不估算收入、转化率、毛利率或任何节点的相对规模。
    claimRefs:
      - CI001
      - CI008
      - CI015
  - id: FE001
    title: 有公开证据支持的产品架构图
    type: stack
    summary: 根据指定公开证据，对其中描述的界面、编排、推理、数据、交付成果和控制措施作六层拆解。
    data:
      layers:
        - label: 用户界面
          detail: 嵌入金融专业人士既有工作模式的入口
          items:
            - 聊天优先的工作区
            - 通过电子邮件访问 Felix
        - label: 工作流编排
          detail: 可复用的多步骤任务执行
          items:
            - Felix 智能体
            - Quick Actions
        - label: 金融推理
          detail: 面向金融分析的领域处理
          items:
            - 定制训练的语言模型
            - 电子表格与建模智能体
        - label: 数据落地
          detail: 机构专属上下文加上已获授权的外部来源
          items:
            - 内部 CRM、文件和数据室
            - FactSet、LSEG、PitchBook、Quartr 及监管文件
        - label: 交付成果
          detail: 输出回到熟悉的金融工具
          items:
            - 报告、备忘录和演示文稿
            - Excel 财务模型
        - label: 控制与采用
          detail: 公开报道的治理和实施机制
          items:
            - 审计轨迹和访问控制
            - Sisyphus 扫描与前置部署支持
    approximationNotes: 层级顺序是对公开描述的分析性综合，不代表公司发布的系统图，也没有经过独立验证的组件边界。
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE008
      - CE013
      - CE014
  - id: FU001
    title: 机构客户旅程与扩张循环
    type: journey-map
    summary: Rogo 的潜在扩张路径从范围明确的企业访问开始，经过受治理的部署和人工审阅，再延伸到更多席位或工作流。
    data:
      nodes:
        - id: enterprise-scope
          label: 企业评估
          detail: 明确用户、工作流、实施服务、商业计量单位和 Felix 适用资格。
          touchpoints:
            - Sales consultation
            - Felix request access
        - id: data-rights
          label: 数据与权限范围
          detail: 确认授权数据集、内部来源、再分发权和权限映射。
          touchpoints:
            - Data entitlements
            - Security and compliance review
        - id: workflow-configuration
          label: 公司定制配置
          detail: 围绕机构的流程、模板和控制措施塑造金融工作流。
          touchpoints:
            - Guided implementation
            - Workflow library
        - id: analyst-use
          label: 分析师采用
          detail: 使用研究、建模、项目开发、执行、咨询和投资组合情报工作流。
          touchpoints:
            - Rogo platform
            - Felix deliverables
        - id: human-review
          label: 人工验证
          detail: 检查来源、期间、单位、权限、假设和面向客户的材料。
          touchpoints:
            - Audit trail
            - Human approval
        - id: account-expansion
          label: 席位与工作流扩张
          detail: 如果审阅后的价值持续存在，就增加用户、付费功能、专业数据和相邻工作流。
          touchpoints:
            - Additional seats
            - Additional workflows
    approximationNotes: 该顺序是基于证据的运营模型，不是实测漏斗；转化率、阶段时长和队列结果均未公开。
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU012
      - CU014
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 基于指定公开证据，对可能性、影响、缓解措施成熟度和剩余严重程度作定性排序；没有事故分母时保留未知可能性。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余严重程度
      rows:
        - label: 权限隔离
          values:
            - Unknown
            - 严重
            - 厂商声称
            - 高
        - label: 输出准确性
          values:
            - 中
            - 高
            - 部分有证据支持
            - 高
        - label: 监管保证范围
          values:
            - 中
            - 高
            - 厂商声称
            - 中高
        - label: 模型供应商依赖
          values:
            - 中
            - 高
            - 部分缓解
            - 高
        - label: 金融数据授权
          values:
            - 中
            - 高
            - 取决于合同
            - 高
        - label: 融资与扩张执行
          values:
            - 中
            - 高
            - 资金充足
            - 中高
    approximationNotes: 定性类别是分析判断，不是实测概率；指定来源没有提供事故频率、损失规模、供应商集中度或控制测试结果。
    claimRefs:
      - CR003
      - CR006
      - CR009
      - CR011
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将已披露的规模和融资情况放进商业经济性、风险及缺失的定价证据中筛选，最终得出“继续研究”的结论。
    data:
      nodes:
        - id: reported-growth
          label: 已披露增长
          detail: Forbes 报道称，2025 年收入超过 $15M；Sacra 估算 2026 年 8 月 ARR 为 $53M。
        - id: institutional-proof
          label: 机构验证
          detail: Rogo 报告称，覆盖超过 250 家机构的专业人士超过 35,000 名。
        - id: monetization
          label: 变现证据
          detail: Sacra 估算其订阅周期跨越多年，年费约为每席位 $3,300。
        - id: execution-risks
          label: 执行风险
          detail: 对第三方模型的依赖，以及 AI 治理风险敞口，仍然不容忽视。
        - id: valuation-gaps
          label: 估值缺口
          detail: Series D 价格、利润率、留存率、现金、烧钱速度和优先权条款均未披露。
        - id: decision
          label: 继续研究
          detail: 在评估回报或退出价值前，先核实入场价格和经常性业务的经济性。
    approximationNotes: 这条流程是定性的决策链，不是按概率加权的估值模型。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
      - CV016
