  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断与决策逻辑
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等，投资判断风险高，估值立场不确定。Rogo 宣布 $160 million Series D，并称累计融资超过 $300 million；公司还称平台覆盖超过 250 家机构的
              35,000 多名用户。这些信号支持产品需求和融资能力，但已融资金额不等于可用现金，已披露采用也不等于收入质量。保留证据没有提供 Series D
              价格、优先股堆叠、毛利率、净留存、现金余额或烧钱速度。没有进入价格和经验证的经常性经济数据，目标回报、持有期或退出价值都将是假精确，而非投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
              - CV015
