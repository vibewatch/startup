              - CP010
              - CP011
      - number: '3.2'
        title: 工作流深度与部署支持是可见差异化
        blocks:
          - type: paragraph
            body: >-
              Rogo 2026 年 5 月的发布扩大了 Felix 对
              PowerPoint、Excel、Word、仪表盘、带来源研究、邮件、定时监控、自定义智能体、记忆和更多连接器的覆盖。因此，产品竞争点是编排、产出保真度和带权限的上下文，而不只是专有基础模型。邮件和原生
              Excel 接入减少了界面切换；机构模板、可复用智能体、记忆和版本化修订则能把产品嵌入重复性工作。分销也是产品的一部分：Rogo
              称前银行家和投资人会驻场支持客户，其融资公告将资金投向前线部署团队和全球扩张。这些因素可能加快采用，但公开证据没有把可重复的软件价值与实施强度分开，也没有证明其准确性优于竞争产品。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: 商业不透明与数据权利使价格难以直接比较
        blocks:
          - type: paragraph
            body: >-
              Rogo 审阅过的公开销售路径没有公布数值资费、计费周期、最低席位数或用量额度。Sacra 估计年均每席位约
              $3,300，并称合同为多年期企业合同，但这是分析师估计，不是公司价目表或实际合同证据。买方还必须把软件订阅与授权金融数据及部署工作分开。供应商标志不代表普遍使用权，权限也可能限制生成材料可包含或再分发的内容。因此，可靠的比较应是方案级总成本和工作流测试：软件、数据权利、实施、复核负担和导出权限应一并测量。指定证据没有披露同业价格和折扣结构。
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河在配置与分销，但成熟厂商和上游模型仍是威胁
        blocks:
          - type: paragraph
            body: >-
              最可能持久的层次是 Rogo
              的工具外壳：金融专用评测、连接器、审计控制、机构风格输出、可复用智能体和嵌入式部署知识，即使底层模型变化也可能保留。机构模板、记忆、权限和重复性智能体能形成运营切换成本，因为替换产品需要重建上下文和治理，而不仅是更换聊天界面。这一护城河尚未获独立证明。成熟厂商可以把
              AI 打包进既有数据资产，专业竞争者可以收敛到从文档到交付的工作流，大型机构也可以内部开发。Sacra
              还指出，若价格、访问权限或性能发生变化，依赖第三方模型供应商会构成风险。指定来源没有提供准确性、实施成本、留存或多归属的受控基准，因此差异化应视为有希望，但尚未证明具有持久性。
