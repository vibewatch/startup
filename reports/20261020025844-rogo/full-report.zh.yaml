      - number: '7.4'
        title: 财务暴露、监测指标与逻辑失效触发条件
        blocks:
          - type: paragraph
            body: >-
              Rogo 宣布 $160 million Series D，累计融资超过 $300 million；FinTech Futures 报道称，该轮融资约在 $75 million Series C
              后四个月完成。这支持其融资渠道较强，但已融资金额不等于可用现金，也未披露烧钱速度、现金跑道、毛利率或营运资金需求。Sacra 的 2026 年 8 月 $53 million ARR 明确是估计，Vantaige
              则称价格未公开。因此，投资判断应监测经独立核对的
              ARR、总留存、模型和数据成本占收入比例、生产错误率、一级安全事件及实施时间。逻辑失效触发条件包括重大权限隔离失败、无法复现带引用的金融产出、失去关键数据权利，或在持久单位经济得到证明前就出现融资需求。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资条件
            body: 不要把供应商列出的认证、已融资金额或用户规模转化为低风险结论。在投资剩余风险前，要求租户范围的保证证据、对抗式工作流试点、数据和模型可迁移条款，以及经核对的运营指标。
            calloutType: risk
