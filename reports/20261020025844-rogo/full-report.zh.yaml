            body: >-
              Rogo 的定位是面向投资银行家、私募股权投资人、对冲基金和其他金融专业人士的工作流系统，而非通用聊天机器人。公开报道描述了聊天优先工作区、可复用 Quick
              Actions、电子表格智能体，以及可通过邮件访问、旨在把工作从研究推进到交付产出的 Felix。支持的工作包括公司研究、投资备忘录、财务模型构建与更新、演示文稿起草、交易筛选、CIM
              生成、买方触达和数据室尽调。这种广度具有战略意义，因为产品可以覆盖交易团队现有流程的多个步骤，但大多数详细能力描述最终来自 Rogo
              或重复其说法的二手出版物。现有材料没有确认这些工作流经独立测量的准确性、完成时间或错误率。
