chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Rogo was founded in New York City in 2021 by Gabriel Stengel and John Willett; a separate account
              identifies Tumas Rackaitis as the third member of the Princeton-origin founding group. The company is a
              private, Series D-stage vertical AI vendor for investment banks, private-equity firms, asset managers, and
              related financial institutions. Its product combines firms' internal information with licensed and public
              financial data, then automates research, company profiles, investment memos, slide decks, and financial
              models. This is an enterprise workflow product rather than a general-purpose chatbot: deployment depends
              on data integrations, auditability, access controls, and fit with Excel, PowerPoint, Word, and
              institution-specific templates. The business model is described by Sacra as multi-year enterprise
              subscriptions with seat-based expansion and paid data or feature add-ons, but contract pricing has not
              been disclosed by Rogo in the reviewed evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Leadership, founder-market fit, and governance
        blocks:
          - type: paragraph
            body: >-
              The founding team has direct finance-workflow exposure: an independent account says Stengel, Willett, and
              Rackaitis met at Princeton, pursued finance careers including work at J.P. Morgan and Lazard, and expanded
              an econometrics-chatbot project after developer access to GPT-3. Gabriel Stengel is the named chief
              executive and public spokesperson, while product and engineering evidence also names functional leaders
              below the founder level. That combination supports founder-market fit, but it also leaves visible
              key-person dependence around Stengel's customer narrative and the founders' domain knowledge. Only Keith
              Rabois is identified as a board member in the assigned evidence; the complete board, observer rights,
              ownership, protective provisions, and succession depth are not publicly established here. The leadership
              table is therefore a partial enumeration, not a complete management or governance roster.
            claimRefs:
              - CO002
              - CO003
              - CO015
              - CO016
