              - CP010
              - CP011
      - number: '3.2'
        title: Workflow depth and deployment support are the visible differentiation
        blocks:
          - type: paragraph
            body: >-
              Rogo's May 2026 release expanded Felix across PowerPoint, Excel, Word, dashboards, sourced research,
              email, scheduled monitoring, custom agents, memory, and additional connectors. The product therefore
              competes on orchestration, output fidelity, and permissioned context rather than on a proprietary
              foundation model alone. Email and native Excel access reduce interface switching, while firm templates,
              reusable agents, memory, and versioned revisions can embed the product in recurring work. Distribution is
              also part of the product: Rogo says former bankers and investors embed with customers, and its funding
              announcement directs capital toward forward-deployed teams and global expansion. Those elements can
              accelerate adoption, but public evidence does not separate repeatable software value from implementation
              intensity or prove superior accuracy against competing products.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Commercial opacity and data rights complicate a clean price comparison
        blocks:
          - type: paragraph
            body: >-
              Rogo's reviewed public sales route did not publish a numerical tariff, billing period, seat minimum, or
              usage allowance. Sacra estimates approximately $3,300 per seat annually and describes multi-year
              enterprise contracts, but this is an analyst estimate rather than a company price list or realized
              contract evidence. Buyers must also separate the software subscription from licensed financial data and
              deployment work. Provider logos do not establish universal entitlements, and permissions may constrain
              what generated materials can contain or redistribute. Consequently, the defensible comparison is a
              proposal-level total-cost and workflow test: software, data rights, implementation, review burden, and
              export permissions should be measured together. Peer pricing and discount structures are not disclosed in
              the assigned evidence.
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: The moat resides in configuration and distribution, but incumbents and upstream models remain threats
        blocks:
          - type: paragraph
            body: >-
              The most plausible durable layer is Rogo's harness: finance-specific evaluations, connectors, audit
              controls, house-style output, reusable agents, and embedded deployment knowledge that can persist when the
              underlying model changes. Firm-specific templates, memory, permissions, and recurring agents can create
              operational switching costs because replacement requires reconstructing context and governance, not merely
              changing a chat interface. That moat is not proven independently. Incumbents can bundle AI into existing
              data estates, specialist rivals can converge on document-to-deliverable workflows, and large institutions
              can build internally. Sacra also identifies dependence on third-party model providers as a risk if
              pricing, access, or performance changes. No assigned source provides a controlled benchmark of accuracy,
              implementation cost, retention, or multi-homing, so differentiation should be treated as promising but not
              yet demonstrated as durable.
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No public benchmark proves the moat
            body: >-
              The assigned evidence does not compare accuracy, review time, retention, implementation cost, or realized
              pricing across Rogo, specialists, incumbents, and internal builds.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              The clearest public description is a B2B SaaS model sold to financial institutions through multi-year
              enterprise contracts. Sacra describes a roughly $3,300 annual per-seat price and additional monetization
              from specialized data access and paid features; these are third-party estimates, not a company price sheet
              or evidence of realized contract value. The model therefore has recurring and expansion-revenue
              characteristics, but the retained evidence does not disclose discounting, minimum commitments,
              implementation fees, revenue recognition, or the mix among seats, data, and features. Rogo's platform
              breadth and guided implementation may strengthen adoption, yet there is no public basis for treating
              implementation work as a separately priced revenue stream. The revenue bridge below is a mechanism map,
              not a quantified gross-profit bridge.
            claimRefs:
              - CI001
