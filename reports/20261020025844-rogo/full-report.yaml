          values:
            - Medium
            - High
            - Vendor-stated
            - Medium-high
        - label: Model-provider dependency
          values:
            - Medium
            - High
            - Partially mitigated
            - High
        - label: Financial-data entitlements
          values:
            - Medium
            - High
            - Contract-dependent
            - High
        - label: Financing and scaling execution
          values:
