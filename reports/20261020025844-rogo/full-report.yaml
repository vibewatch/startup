      - number: '5.2'
        title: Architecture, grounding, and integration
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model has four observable layers: user interfaces, an agent or
              workflow-orchestration layer, finance-oriented language-model processing, and data grounding across
              institutional systems and licensed financial sources. SiliconANGLE reports that custom-trained large
              language models use CRM and other internal-system data and can ingest FactSet, while Sacra describes
              connections to deal-room documents, Excel, PowerPoint, Word, data warehouses, LSEG, PitchBook, Quartr, and
              international filings. Outputs are designed to return to the tools bankers already use, which can improve
              adoption and auditability. This architecture also creates dependencies on data entitlements, integration
              quality, model providers, and the correctness of retrieved source material. Public evidence does not
              disclose model evaluation methodology, isolation design, retrieval accuracy, or contractual resilience of
              the external data feeds.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE013
          - type: table
