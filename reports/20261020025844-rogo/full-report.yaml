      - number: '4.2'
        title: Traction and sales-efficiency signals
        blocks:
          - type: paragraph
            body: >-
              Public traction is meaningful but unevenly verified. Rogo says more than 35,000 professionals at over 250
              institutions use the platform, a claim repeated by independent reporting but still originating with the
              company. Sacra estimates $53 million of ARR in August 2026 versus $15 million at the end of 2025, while AI
              Wiki reports that the company reached seven-figure ARR within five months using one sales representative.
              These datapoints suggest rapid adoption and potentially efficient early selling, but they do not
              substitute for audited revenue, bookings, cohort retention, sales-and-marketing spend, or CAC payback.
              User counts also cannot be converted into revenue by multiplying them by the reported seat price because
              deployment terms, active-seat definitions, discounts, and bundled access are unknown.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The visible cost structure combines cloud infrastructure, third-party model usage, licensed financial
              data, product development, and forward-deployed implementation teams. Sacra specifically identifies cloud
              and data-licensing costs and flags dependence on OpenAI and Google as exposure to price or access changes.
              Those drivers make gross margin sensitive to workload intensity, model routing, data entitlements, and the
              amount of human support bundled into deployments. No retained source quantifies gross margin, inference
              cost per workflow, data cost per customer, CAC, payback, NRR, logo churn, or implementation utilization.
              Consequently, the recurring subscription structure is visible, but neither contribution margin nor
              operating leverage is. The appropriate diligence focus is contract-level revenue and cost reconciliation
              rather than a speculative SaaS benchmark.
            claimRefs:
              - CI008
              - CI009
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI008
              - CI009
              - CI013
              - CI014
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Rogo announced a $160 million Series D in April 2026 and said the round brought total funding above $300
              million. Sacra's page instead states $165 million of total funding, an internally stale-looking figure
              that conflicts with the later financing and should not be silently reconciled. The company says proceeds
              will fund international expansion, institutional partnerships, forward-deployed teams, and Felix. Funding
              raised is not cash available: no retained source provides cash on hand, monthly burn, debt, runway, or a
              next-round trigger. The financial verdict is therefore balanced: disclosed adoption and financing reduce
              near-term capital-access concern, but revenue quality, margin path, retention, and capital efficiency
              remain unobservable. Investor underwriting should remain conditional on management accounts, customer
              cohorts, contract economics, and a current cash-to-runway bridge.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
