      - CM005
      - CM006
      - CM007
      - CM010
      - CM011
      - CM012
      - CM016
  - id: FP001
    title: 'Qualitative competitive positioning: workflow ownership versus finance specialization'
    type: quadrant
    summary: >-
      X-axis is breadth of ownership from research through finished deliverables; Y-axis is finance-specific data and
      workflow specialization, each scored on a 1-5 ordinal scale.
    data:
      points:
        - label: Rogo
          x: 5
          'y': 5
          note: Broad finished-deliverable scope and explicit finance specialization.
        - label: AlphaSense
          x: 2
          'y': 4
          note: Finance research discovery is evidenced; downstream deliverables are not established here.
        - label: Hebbia
          x: 3
          'y': 3
          note: Structured document analysis is evidenced; finance-specific breadth is not established here.
        - label: S&P Capital IQ Pro
          x: 3
          'y': 5
          note: Financial-data breadth is evidenced; full deliverable orchestration is not established here.
        - label: Bloomberg
          x: 3
          'y': 5
          note: Deep capital-markets positioning and installed distribution; customization is described as constrained.
        - label: Internal build
          x: 4
          'y': 3
          note: Potentially broad and customizable, but actual scope depends on each institution.
    approximationNotes: >-
      Analyst-authored ordinal placement from the assigned public descriptions, not measured market share, product
      performance, or an independent benchmark. Scores express relative positioning only; unknown capabilities were not
      assumed.
    claimRefs:
      - CP005
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: Revenue mechanism and gross-profit dependency
    type: flow
    summary: >-
      Enterprise contracts can expand through seats, data access, and paid features, but cloud, model, data, and
      implementation costs prevent a quantified margin bridge.
    data:
      nodes:
        - id: institutional-contract
          label: Multi-year institutional contract
          detail: Direct enterprise subscription sold to a financial institution.
        - id: seat-deployment
          label: Seat deployment
          detail: Professionals receive access; realized seat terms are not public.
        - id: workflow-usage
          label: Workflow usage
          detail: Research, modeling, and agent workflows drive platform activity.
        - id: expansion
          label: Data and feature expansion
          detail: Specialized data access and paid features can add revenue.
        - id: recurring-revenue
          label: Subscription and add-on revenue
          detail: Sacra characterizes the model as recurring B2B SaaS.
        - id: gross-profit
          label: Gross profit, unquantified
          detail: Revenue is reduced by cloud, model, data-licensing, and support costs.
      edges:
        - source: institutional-contract
          target: seat-deployment
        - source: seat-deployment
          target: workflow-usage
        - source: workflow-usage
          target: expansion
        - source: expansion
          target: recurring-revenue
        - source: recurring-revenue
          target: gross-profit
    approximationNotes: >-
      This is a qualitative mechanism map. It does not estimate revenue, conversion, gross margin, or the relative
      magnitude of any node.
    claimRefs:
      - CI001
      - CI008
      - CI015
  - id: FE001
    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
      A six-layer view of the interfaces, orchestration, reasoning, data, deliverables, and controls described in the
      assigned public evidence.
    data:
      layers:
        - label: User interfaces
          detail: Entry points embedded in finance professionals' existing work patterns
          items:
            - Chat-first workspace
            - Email access to Felix
        - label: Workflow orchestration
          detail: Reusable and multi-step task execution
          items:
            - Felix agent
            - Quick Actions
        - label: Finance reasoning
          detail: Domain-oriented processing for financial analysis
          items:
            - Custom-trained language models
            - Spreadsheet and modeling agent
        - label: Data grounding
          detail: Institution-specific context plus entitled external sources
          items:
            - Internal CRM, files, and data rooms
            - FactSet, LSEG, PitchBook, Quartr, and filings
        - label: Deliverables
          detail: Outputs returned to familiar finance tools
          items:
            - Reports, memos, and presentation decks
            - Excel financial models
        - label: Controls and adoption
          detail: Publicly reported governance and implementation mechanisms
          items:
            - Audit trails and access controls
            - Sisyphus scanning and forward-deployed support
    approximationNotes: >-
      Layer ordering is an analytical synthesis of public descriptions; it does not represent a company-published
      systems diagram or independently verified component boundary.
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE008
      - CE013
      - CE014
  - id: FU001
    title: Institutional customer journey and expansion loop
    type: journey-map
    summary: >-
      Rogo's potential expansion path runs from scoped enterprise access through governed deployment, human review, and
      additional seats or workflows.
    data:
      nodes:
        - id: enterprise-scope
          label: Enterprise evaluation
          detail: Define users, workflows, implementation services, commercial unit, and Felix eligibility.
          touchpoints:
            - Sales consultation
            - Felix request access
        - id: data-rights
          label: Data and permission scoping
          detail: Confirm licensed datasets, internal sources, redistribution rights, and permission mapping.
          touchpoints:
            - Data entitlements
            - Security and compliance review
        - id: workflow-configuration
          label: Firm-specific configuration
          detail: Shape finance workflows around the institution's processes, templates, and controls.
          touchpoints:
            - Guided implementation
            - Workflow library
        - id: analyst-use
          label: Analyst adoption
          detail: Use research, modeling, origination, execution, advisory, and portfolio-intelligence workflows.
          touchpoints:
            - Rogo platform
            - Felix deliverables
        - id: human-review
          label: Human validation
          detail: Check sources, periods, units, permissions, assumptions, and client-facing materials.
          touchpoints:
            - Audit trail
            - Human approval
        - id: account-expansion
          label: Seat and workflow expansion
          detail: Add users, paid features, specialized data, and adjacent workflows if reviewed value persists.
          touchpoints:
            - Additional seats
            - Additional workflows
    approximationNotes: >-
      The sequence is an evidence-based operating model, not a measured funnel; no conversion rates, stage durations, or
      cohort outcomes are public.
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU012
      - CU014
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative ranking of likelihood, impact, mitigation maturity, and residual severity based on the assigned public
      evidence, with unknown likelihood retained where no incident denominator exists.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
