              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is likely an institution rather than an individual analyst because the product is sold
              through negotiated enterprise deployments, requires firm data and licensed-content entitlements, and has
              no self-serve tier. Bankers and investors are the users; operating, technology, data, security, and
              business-unit leaders are likely participants in purchase approval and budget ownership. Adoption should
              begin with a bounded, repetitive workflow whose source set and final output can be reviewed, then expand
              only after the institution validates accuracy, permission propagation, review burden, and realized time
              savings. This makes implementation and governance part of the product, not merely post-sale services.
              Smaller boutiques face a higher hurdle because opaque enterprise pricing and integration costs must be
              spread across fewer users.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by expensive recurring analyst work, demand for auditable outputs, the ability to
              combine internal records with external financial data, and agents that can produce complete work products
              rather than isolated answers. The same design creates constraints: enterprise procurement is slow, private
              data permissions must survive into generated artifacts, third-party content licenses may limit access or
              redistribution, and human reviewers must preserve period, currency, unit, and source meaning. Pricing
              opacity also makes ROI difficult to benchmark before a pilot. For valuation, reported adoption and Sacra's
              ARR estimate are useful scale indicators, but the $117 billion fee pool is not a revenue multiple
              denominator. Underwriting requires contract-level ARR, retention, seat utilization, gross margin, data
              costs, and deployment economics before translating workflow breadth into a market-share or terminal-value
              assumption.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize the fee pool as software TAM
            body: >-
              The $117 billion figure is global investment-banking fee revenue, while Rogo's revenue comes from
              enterprise software, features, data access, and deployment. Applying a software share to that fee pool
              without customer budgets, contract values, and retention would create false precision.
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
              - CM016
          - type: callout
            title: Underwrite from contracts and cohorts
            body: >-
              Request ARR by customer segment, paid and active seats, gross and net retention, contract duration,
              implementation cost, data-license pass-through, query intensity, and realized workflow savings before
              assigning a market-share or terminal-growth assumption.
            calloutType: recommendation
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than vertical AI peers
        blocks:
          - type: paragraph
            body: >-
              The buyer's alternative set begins with specialist products but does not end there. Rogo is positioned
              around finance-specific workflows and finished work products, while AlphaSense is described as starting
              from market-intelligence discovery and Hebbia from structured analysis of large document collections. S&P
              Capital IQ and Bloomberg bring incumbent data breadth and installed distribution; Sacra, however,
              characterizes their trade-offs as interface or contract complexity and reduced customization. Internal
              development and manual research-plus-Office workflows remain substitutes because a bank can preserve
              firm-specific controls without buying another application, although the assigned evidence does not
              quantify their cost, quality, or time-to-value. This means the relevant contest is for ownership of the
              complete research-to-deliverable workflow, not simply for the best chat response.
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
