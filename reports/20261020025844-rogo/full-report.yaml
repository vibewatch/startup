              - CE007
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE005
              - CE007
              - CE008
              - CE013
              - CE014
      - number: '5.3'
        title: Maturity, deployment, and support model
        blocks:
          - type: paragraph
            body: >-
              Reported adoption is consistent with a product beyond an early pilot stage, although the exact denominator
              changes across sources. Forbes reported more than 25,000 daily users at 150 firms in April 2026, while
              Rogo's April 29 announcement said more than 35,000 professionals at over 250 institutions used the
              platform in daily workflows. The difference may reflect rapid growth, reporting cutoffs, or differing
              definitions of firms and institutions; no audited cohort reconciles the two figures. Rogo also says it
              uses forward-deployed engineers and bankers to help customers adopt the system. That service model can
              reduce implementation friction in complex banks, but it may make deployment quality dependent on scarce
              expert labor. No reviewed source provides implementation time, support response targets, uptime history,
              retention, or a dated product roadmap.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Differentiation, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Rogo's defensibility appears to come from finance-specific workflow design, integration with proprietary
              institutional context, licensed market data, and the ability to write outputs into familiar office and
              deal tools. Those are potentially stronger switching costs than model access alone, particularly where
              audit trails and permissions matter. SiliconANGLE reports that the platform includes audit trails, access
              controls, and a Rogo-developed tool called Sisyphus that scans infrastructure daily for vulnerabilities.
              These are relevant controls, but they remain company claims relayed by a publication; the assigned
              evidence contains no independent certification record, penetration-test result, incident history,
              service-level disclosure, or model-risk assessment. It also contains no public repository, package, API
              forum, engineering talk, or practitioner-community signal from which to assess developer maturity. The
              technical thesis is therefore credible at the product-workflow level but not independently validated at
              the security, reliability, or architecture level.
            claimRefs:
              - CE005
              - CE007
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical diligence priority
            body: >-
              Obtain architecture diagrams, model and retrieval evaluations, data-entitlement terms, security
              certifications, penetration-test results, incident history, and customer-level uptime and support evidence
              before treating the reported control layer as independently verified.
            calloutType: risk
            claimRefs:
              - CE007
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Institutional footprint and customer segments
        blocks:
          - type: paragraph
            body: >-
              Rogo's disclosed footprint is enterprise-first: the company reported more than 35,000 financial
              professionals and more than 250 institutions in April 2026. The named set is concentrated in global
              investment banking and advisory, while independent workflow analysis also identifies private- market and
              public-market investment teams as intended users. Buyers are therefore likely to include technology,
              operations, compliance, and business leadership, while day-to-day users include bankers, investors, and
              analysts. The platform is positioned across origination, execution, advisory, and portfolio intelligence
              rather than as a single research utility. That breadth expands potential seat and workflow penetration,
              but neither the user count nor institution count discloses geography, paid seats, active-user methodology,
              or revenue contribution by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU011
      - number: '6.2'
        title: Adoption scale and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is the company's current scale disclosure, repeated by independent
              publishers, plus named institutions including Rothschild & Co, Jefferies, Lazard, Moelis, and Nomura. A
              separate platform testimonial attributes a successful integration, productivity improvement, lower risk,
              and added banker capacity to Truist Securities chief executive Tom Hackett. These references are
              meaningful enterprise proof, but they do not establish comparable deployment scope: public materials do
              not state paid seats, contract value, rollout dates, renewal status, or measured outcomes for each named
              institution. Felix use cases such as deal screening, CIM generation, buyer outreach, and data room
              diligence indicate production-oriented workflows, yet most named customer evidence remains
              vendor-published rather than customer-issued.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
      - number: '6.3'
        title: Commercial durability and expansion motion
        blocks:
          - type: paragraph
            body: >-
              Sacra characterizes Rogo as an enterprise subscription sold through multi-year contracts and estimates
              pricing at about $3,300 per seat per year, with additional revenue from specialized data access and paid
              features. Sacra also estimates $53 million of ARR in August 2026 versus $15 million at year-end 2025;
              these are analyst estimates, not company- confirmed revenue or cash metrics. The reported model implies
              expansion through seat growth and additional workflows, while Rogo's broad workflow catalog creates
              multiple adoption surfaces within one institution. However, Felix has a separate request-access route, and
              financial-data entitlements may require separate commercial rights. Expansion therefore depends on product
              access, implementation, permission mapping, data licensing, and sustained human review rather than on seat
              availability alone.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU009
              - CU011
              - CU012
              - CU014
              - CU015
      - number: '6.4'
        title: Retention, concentration, and procurement risk
        blocks:
          - type: paragraph
            body: >-
              None of the eight reviewed sources discloses NRR, GRR, churn, renewal rate, contract renewal outcomes, or
              top-customer revenue share. The public customer count therefore cannot establish durability, and the five
              named banks do not reveal whether revenue is diversified or concentrated. Public pricing is also
              incomplete: an independent review found no numerical tariff on the sales route, while Sacra's per-seat
              figure remains an estimate. Adoption carries review friction because financial work must preserve source
              periods, units, permissions, and human approval; one independent source explicitly warns that
              hallucination or data inaccuracy has an extreme cost in finance. Underwriting should require cohort
              retention, institution-level ARR bands, paid-versus-active seats, expansion by vintage, and references
              issued directly by customers.
            claimRefs:
              - CU003
              - CU008
              - CU013
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is cross-deal confidentiality and entitlement enforcement. Rogo says
              existing entitlements carry through to agents, while independent reviews emphasize that a deployment must
              prove that inaccessible source material cannot leak through generated tables or reusable workflows. The
              second cluster is output integrity: Felix is described as autonomously executing multi-step deal
              workflows, so a wrong assumption can travel farther than in a single-answer research tool before a human
              catches it. Third-party model and financial-data dependencies add both availability and gross-margin
              sensitivity. The heatmap therefore ranks residual risk from evidence strength and workflow consequence,
              not from an asserted incident history; no reviewed source establishes incident frequency or loss rates.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR009
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory, legal, privacy, and assurance risk
        blocks:
          - type: paragraph
            body: >-
              Rogo publicly lists SOC 2 Type II, ISO 27001, ISO 42001, GDPR, CCPA, and EU AI Act credentials or
              alignment. Those are meaningful mitigation signals, but the assigned evidence does not include
              certificates, auditor reports, control scope, test periods, legal opinions, or jurisdiction-specific
              deployment assessments. Vantaige explicitly recommends obtaining current attestation letters and scope,
              while Sequenced states that it did not inspect private assurance reports or verify a particular
              deployment. The investment implication is a conditions-precedent approach: verify certificate issuers and
              scope, map data residency and retention to each customer entity, and test permission inheritance before
              treating the compliance posture as mature. Public-source silence on litigation, enforcement, or incidents
              remains an evidence gap, not evidence that none exist.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
      - number: '7.3'
        title: Operational, quality, security, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The mitigation architecture is directionally appropriate: SiliconANGLE reports audit trails, access
              controls, and daily infrastructure vulnerability scanning, and Rogo says source permissions carry into
              agents. However, these controls are predominantly vendor-described and do not quantify false outputs,
              review effort, availability, recovery objectives, or isolation failures. Operational diligence should use
              adversarial production-like tests: conflicting source documents, broken spreadsheet links, stale market
              data, and two segregated mock deal rooms. Dependency risk is also structural. External model providers,
              licensed financial-data feeds, and firm-specific implementation support are integral to the offering, so
              adverse pricing, access, or service changes can affect quality, availability, or economics even if Rogo's
              own application layer performs as designed.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Financial exposure, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Rogo announced a $160 million Series D and more than $300 million of total funding, while FinTech Futures
              reported that the round followed a $75 million Series C by roughly four months. This supports substantial
              financing access, but funding raised is not cash available and does not disclose burn, runway, gross
              margin, or working-capital needs. Sacra's $53 million August 2026 ARR figure is explicitly an estimate,
              and Vantaige reports that pricing is not public. Underwriting should therefore monitor independently
              reconciled ARR, gross retention, model and data costs as a share of revenue, production error rates,
              severity-one security events, and implementation time. Thesis-break triggers are a material
              permission-isolation failure, inability to reproduce cited financial outputs, loss of critical data
              rights, or financing needs that arrive before durable unit economics are demonstrated.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment condition
            body: >-
              Do not convert vendor-listed certifications, funding raised, or user scale into a low-risk conclusion.
              Require tenant-scoped assurance evidence, an adversarial workflow pilot, data and model portability terms,
              and reconciled operating metrics before underwriting residual risk.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR009
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and decision logic
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high underwriting risk, and an indeterminate
              valuation stance. Rogo announced a $160 million Series D and said total funding exceeded $300 million,
              while the company reported more than 35,000 users across over 250 institutions. Those signals support
              product demand and financing capacity, but funding raised is not cash available and reported adoption is
              not revenue quality. The retained evidence provides no Series D price, preference stack, gross margin, net
              retention, cash balance, or burn rate. Without both entry price and verified recurring economics, a target
              return, hold period, or exit value would be false precision rather than underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context and operating anchors
        blocks:
          - type: paragraph
            body: >-
              The strongest historical price anchor is the January 2026 Series C: Forbes and Sacra report a $75 million
              round at a $750 million post-money valuation. Forbes separately reports that revenue rose from $2 million
              in 2024 to more than $15 million in 2025, implying that the Series C was priced at less than 50 times the
              disclosed prior-year revenue. Sacra later estimates $53 million of ARR in August 2026 and approximately
              $3,300 per seat annually, but ARR is not accounting revenue and the estimate is not company-confirmed.
              These figures indicate rapid expansion while leaving revenue recognition, contract value, gross margin,
              retention, and the Series D valuation unresolved.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV014
      - number: '8.3'
        title: Thesis, anti-thesis, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The thesis is that domain-specific workflows, financial-data integrations, and reported institutional
              usage can support a durable vertical software franchise. Rogo says Felix can automate multi-step work from
              screening through diligence, and its team emphasizes experience across banking, investing, and AI. The
              anti-thesis is equally material: Sacra identifies reliance on third-party model providers and tightening
              AI governance, while the public evidence does not establish durable margins, retention, or pricing power.
              The bull, base, and bear cases therefore use observable proof points and diligence triggers rather than
              invented valuation ranges. A higher price is defensible only after the estimated ARR and contract
              economics are verified.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient to call Rogo exit-ready or to select a defensible public-company, M&A, or
              private-round multiple. The Series C is a historical transaction, not a current fair-value opinion;
              Sacra's ARR estimate is an analytical input, not audited performance; and competitor valuations are not
              independent benchmarks for Rogo. Before an investment decision, diligence should obtain the Series D cap
              table and preference waterfall, audited or board-approved ARR and revenue bridges, gross margin, cohort
              retention, cash and burn, customer concentration, contract duration, and renewal data. Thesis breaks
              include materially lower verified ARR, weak retention, uneconomic data or model costs, regulatory limits
              on core workflows, or an entry price that cannot produce the required return under a conservative exit
              case.
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price and proof must move together
            body: >-
              Advance only if the Series D price and preference stack are disclosed and verified ARR, retention, gross
              margin, and cash burn support a conservative return case; otherwise keep the company on a research-more
              track.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
              - CV016
