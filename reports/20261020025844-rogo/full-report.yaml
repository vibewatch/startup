      Adoption figures are company-reported; the historical financing-to-revenue comparison uses revenue, not ARR, and
      does not establish a current market multiple.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Trigger
    rows:
      - - Bull
        - >-
          Sacra's $53M ARR estimate is verified; growth, retention, and gross margin support premium vertical-software
          economics
        - >-
          Underwrite from verified forward ARR and cash generation only after the Series D price and preferences are
          disclosed
        - Possible, but unproven by public evidence
        - Independent customer cohorts and audited economics meet or exceed the estimate
      - - Base
        - Adoption continues, but implementation and data costs moderate margin and growth
        - Use the $750M Series C only as a historical reference; no current range is supportable
        - Most consistent with the mixed evidence
        - Verified ARR is below the estimate or retention and margin are merely adequate
      - - Bear
        - Reported adoption does not convert into durable high-margin recurring revenue
        - Down-round or impaired-return risk rises because the entry price cannot be reconciled to verified economics
        - Material downside remains open
        - Weak retention, concentrated customers, regulatory limits, or uneconomic model and data costs
    notes: >-
      Qualitative scenarios replace unsupported point probabilities and valuation ranges; the cited ARR is Sacra's
      estimate and is not interchangeable with accounting revenue.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Rogo moved from a 2021 founding to four disclosed institutional rounds and an agentic-product push by April 2026,
      followed by a third-party ARR estimate.
    data:
      items:
        - date: '2021'
          label: Company founded
          detail: Google Cloud reports that Gabriel Stengel and John Willett founded Rogo in New York City.
          tone: neutral
          claimRefs:
            - CO001
        - date: 2022-01
          label: Founding project expanded
          detail: Método Viral reports that the Princeton founding group left finance roles to expand an econometrics chatbot.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2024-02
          label: Seed financing
          detail: Sacra places the AlleyCorp-led seed in February 2024; Lex instead reports a late-2023 first seed.
          tone: warning
          claimRefs:
            - CO011
            - CO012
        - date: 2024-10
          label: Series A
          detail: Sacra reports an $18 million Khosla-led Series A; Lex reports $18.5 million at an $80 million valuation.
          tone: warning
          claimRefs:
            - CO011
            - CO012
        - date: 2025-04
          label: Series B
          detail: Sacra reports a $50 million Thrive-led Series B at a $350 million post-money valuation.
          tone: positive
          claimRefs:
            - CO010
        - date: 2026-01
          label: Series C
          detail: Sacra reports a $75 million Sequoia-led Series C at a $750 million post-money valuation.
          tone: positive
          claimRefs:
            - CO009
        - date: 2026-03
          label: Offset acquired
          detail: >-
            SiliconANGLE reported on April 29 that Rogo acquired Offset in the prior month to strengthen financial
            modeling.
          tone: neutral
          claimRefs:
            - CO013
        - date: '2026-04-29'
          label: Series D and Felix expansion
          detail: >-
            Rogo announced a $160 million Kleiner Perkins-led round and described Felix as its multi-step
            financial-workflow agent.
          tone: positive
          claimRefs:
            - CO005
            - CO014
        - date: 2026-08
          label: ARR estimate
          detail: Sacra estimates $53 million of ARR, up from $15 million at the end of 2025.
          tone: warning
          claimRefs:
            - CO008
    approximationNotes: >-
      Month-only dates are displayed at monthly precision; the March 2026 acquisition date is derived from
      SiliconANGLE's April 29 reference to "last month," and the August ARR value is a Sacra estimate.
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
  - id: FM001
    title: Public sizing observables, not a TAM/SAM/SOM stack
    type: pyramid
    summary: >-
      The available evidence moves from a broad banking-economics proxy to company adoption and activity indicators, but
      the layers are not additive or directly comparable.
    data:
      items:
        - label: Global investment-banking fee pool (2024)
          value: 117
          unit: $B
          note: Industry revenue proxy, not AI software spend
        - label: Fees generated outside the Americas (2024)
          value: 45
          unit: '%'
          note: Share of the global fee pool
        - label: Asia share of historical deal value
          value: 35
          unit: '%'
          note: Approximate and based on a different denominator
        - label: Sacra-estimated Rogo ARR (August 2026)
          value: 53
          unit: $M ARR
          note: Third-party estimate, not company-confirmed
        - label: Bankers and investors using Rogo
          value: 60000
          unit: users
          note: Current company homepage claim; active-user definition unavailable
        - label: Institutions served
          value: 450
          unit: institutions
          note: Current company homepage claim; cohort mix unavailable
        - label: Daily queries
          value: 200000
          unit: queries/day
          note: Current company homepage claim; query definition unavailable
    approximationNotes: >-
      No interpolation or market-share conversion is applied. The pyramid is an evidence ladder with mixed units,
      periods, and denominators; layer order does not imply numerical containment or a value-proportional scale.
    claimRefs:
