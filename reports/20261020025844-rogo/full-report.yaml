      - number: '1.3'
        title: Capitalization and reported scale
        blocks:
          - type: paragraph
            body: >-
              Rogo announced a $160 million Series D led by Kleiner Perkins on April 29, 2026 and said the financing
              lifted cumulative funding above $300 million. The round included Sequoia, Thrive Capital, Khosla Ventures,
              J.P. Morgan Growth Equity Partners, BoxGroup, Mantis VC, Jack Altman, Evantic, and Positive Sum. The
              company also reported more than 35,000 financial professionals using the platform at over 250
              institutions. These adoption figures are repeated by independent outlets but originate with Rogo and
              should not be treated as audited usage. Sacra separately estimates $53 million of ARR in August 2026, up
              from $15 million at year-end 2025; that is an analyst estimate, not company-confirmed revenue. Publicly
              assigned evidence does not establish current headcount, gross margin, net revenue retention, cash balance,
              burn, debt, or the Series D post-money valuation, so those metrics remain null rather than being inferred
              from funding.
