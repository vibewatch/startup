    claimRefs:
      - CR003
      - CR006
      - CR009
      - CR011
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and financing are filtered through economics, risk, and missing-price evidence to reach a
      research-more decision.
    data:
      nodes:
        - id: reported-growth
          label: Reported growth
          detail: Forbes reports revenue above $15M in 2025; Sacra estimates $53M ARR in August 2026.
        - id: institutional-proof
          label: Institutional proof
          detail: Rogo reports more than 35,000 professionals across over 250 institutions.
        - id: monetization
          label: Monetization evidence
          detail: Sacra estimates multi-year subscriptions and about $3,300 per seat annually.
        - id: execution-risks
          label: Execution risks
          detail: Third-party model dependency and AI-governance exposure remain material.
        - id: valuation-gaps
          label: Valuation gaps
          detail: Series D price, margin, retention, cash, burn, and preference terms are not disclosed.
        - id: decision
          label: Research-more
          detail: Verify entry price and recurring economics before underwriting return or exit value.
    approximationNotes: The flow is a qualitative decision chain, not a probability-weighted valuation model.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
      - CV016
