  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Rogo is positioned as a workflow system for investment bankers, private-equity investors, hedge funds, and
              other financial professionals rather than as a general-purpose chatbot. Public reporting describes a
              chat-first workspace, reusable Quick Actions, a spreadsheet agent, and Felix, an email-accessible agent
              intended to carry work from research through deliverable creation. The supported jobs include company
              research, investment memos, financial-model construction and updating, presentation drafting, deal
              screening, CIM generation, buyer outreach, and data-room diligence. This breadth is strategically
              important because the product can sit across multiple steps of a deal team's existing process, but most
              detailed capability descriptions ultimately originate with Rogo or secondary publications repeating its
              claims. The available material does not establish independently measured accuracy, completion time, or
              error rates for these workflows.
            claimRefs:
