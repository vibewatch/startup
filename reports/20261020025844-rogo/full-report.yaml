  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Rogo's defensible core market is institutional-finance knowledge work: recurring research, financial
              analysis, and production of models, reports, presentations, and transaction materials for investment banks
              and investment firms. The boundary excludes the underlying market-data terminals and licensed datasets,
              core banking systems, general-purpose productivity software, and unrelated finance functions such as
              close, audit, and broad FP&A. Private-markets and public-markets teams are credible adjacencies, but their
              workflows and willingness to pay should not be assumed identical to investment banking. Status-quo
              substitutes include analyst labor coordinated through spreadsheets, documents, email, and data terminals;
              internal AI builds; horizontal copilots; and specialist research or modeling products. Partner data access
              expands utility while also exposing Rogo to licensing and entitlement constraints.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
      - number: '2.2'
        title: Sizing lenses without false precision
        blocks:
          - type: paragraph
            body: >-
              The strongest public top-down proxy is Sacra's report of a $117 billion global investment-banking fee pool
              in 2024, with 45% generated outside the Americas and Asia representing about 35% of historical deal value.
              Those figures describe banking economics and geographic activity, not software spend or Rogo's addressable
              revenue. Bottom-up observables are also incomplete: Sacra estimates $53 million of ARR in August 2026 and
              roughly $3,300 per seat annually, while Rogo's current homepage claims 60,000 users, 450 institutions, and
              200,000 daily queries. April company-issued coverage cited 35,000 professionals at 250 institutions. The
              later figures may indicate expansion, but no common measurement date, paid-seat definition, institution
              definition, retention rate, or independently verified contract value supports a growth calculation. The
              evidence therefore supports several sizing lenses, not a single TAM.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
