      - number: '1.4'
        title: Milestones and diligence view
        blocks:
          - type: paragraph
            body: >-
              The financing sequence shows unusually rapid capital formation: seed and Series A records in 2024, a
              Series B in April 2025, a Series C in January 2026, and the Series D three months later. The exact seed
              chronology is not clean: Sacra places seed funding in February 2024, while Lex reports a $7 million first
              seed in late 2023; Lex also reports $18.5 million for the Series A versus Sacra's $18 million. Product
              scope expanded in March and April 2026 through the Offset acquisition and Felix launch, which moved the
              narrative toward autonomous, multi-step work. Investor and company sources present strong adoption, while
              Lex explicitly notes unknown licensing costs and grounds its revenue discussion in assumptions. The
              central diligence conclusion is therefore asymmetric: customer reach and funding are visible, but unit
              economics, retention, governance rights, and company-confirmed revenue remain unavailable. Those omissions
              prevent a reliable assessment of capital efficiency or operating leverage from this chapter alone.
