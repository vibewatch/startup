evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Company-confirmed current ARR or revenue, gross margin, net retention, headcount, cash balance, burn, debt, and
      Series D post-money valuation.
    whyItMatters: >-
      Funding and user counts cannot establish capital efficiency, runway, revenue quality, or the price paid in the
      latest round.
    diligencePath: >-
      Request the board-approved monthly KPI pack, audited revenue bridge, current capitalization table, debt schedule,
      and cash/runway forecast.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board roster, observer rights, founder vesting, ownership percentages, protective
      provisions, and succession coverage.
    whyItMatters: >-
      The public founder narrative does not reveal decision control, governance balance, or resilience to founder
      departure.
    diligencePath: >-
      Obtain the current capitalization table, voting agreement, investor rights agreement, board minutes, organization
      chart, and succession plan.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-map
    missingEvidence: >-
      Full capitalization table, ownership percentages, secondary transactions, option-pool dilution, and any debt or
      credit facilities.
    whyItMatters: >-
      Named round participants do not establish economic ownership, control, liquidation preferences, or financing
      seniority.
    diligencePath: >-
      Reconcile the signed financing documents and post-Series D fully diluted capitalization table to bank statements
      and the general ledger.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      Primary financing documents resolving whether the first seed closed in late 2023 or February 2024 and whether
      Series A was $18 million or $18.5 million.
    whyItMatters: The differences are not thesis-changing but prevent an exact historical financing reconstruction.
    diligencePath: Review closing binders, wire confirmations, and amended certificates for the seed and Series A transactions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, independent category-spend series for institutional-finance AI workflow software with geography, buyer
      segment, methodology, and comparable periods.
    whyItMatters: >-
      Without a common spending denominator, the fee pool and company-scale indicators cannot be converted into TAM,
      SAM, SOM, penetration, or market share.
    diligencePath: >-
      Commission or obtain analyst market data and triangulate it against procurement budgets and contract values from a
      representative customer sample.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Actual contract values, minimum commitments, module and data charges, discounts, implementation fees, renewal
      terms, and paid-seat definitions by customer cohort.
    whyItMatters: Public pricing estimates cannot establish willingness to pay, revenue expansion, or the buyer's fully loaded cost.
    diligencePath: >-
      Review anonymized contracts, renewal schedules, invoices, and cohort-level ARR with management and selected
      customers.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Gross and net retention, active and paid seats, query definitions, utilization distributions, implementation time,
      measured labor savings, and expansion by cohort.
    whyItMatters: >-
      Company-reported users, institutions, and queries do not reveal durable adoption, realized ROI, or efficient
      revenue expansion.
    diligencePath: >-
      Obtain cohort exports and independently reference customers across investment banking, private markets, and public
      markets.
    relatedQuestionRefs:
      - QM004
      - QM006
  - type: private-evidence-only
    severity: material
    topic: data-entitlements
    missingEvidence: >-
      Data-provider contract terms, entitlement mapping, pass-through economics, redistribution rights, exclusivity,
      renewal dates, and termination exposure.
    whyItMatters: >-
      Licensed data affects product coverage, gross margin, procurement complexity, and the durability of Rogo's
      workflow advantage.
    diligencePath: >-
      Review supplier agreements, entitlement architecture, gross-margin bridges, renewal calendars, and contingency
      plans for each material data provider.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Binding Rogo and competitor proposals on a common user count and workflow scope, including data entitlements,
      implementation, usage limits, discounts, and renewal terms.
    whyItMatters: >-
      Public list-price comparisons cannot establish total cost, switching economics, or whether Rogo's workflow breadth
      offsets a higher effective contract price.
    diligencePath: >-
      Run a structured request for proposal and a paid pilot using the same workflow, source set, review standard, and
      user cohort across shortlisted vendors and internal build.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-benchmark
    missingEvidence: >-
      Controlled comparisons of factual accuracy, model and spreadsheet error rates, reviewer time, implementation cost,
      user retention, and multi-homing across the competitor set.
    whyItMatters: >-
      Feature availability and vendor adoption claims do not establish superior workflow performance or durable
      differentiation.
    diligencePath: >-
      Require benchmark tasks with blinded outputs, documented source cutoffs, identical entitlements, and measured
      review-and-revision effort.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized contract pricing, discount schedules, revenue mix, and revenue-recognition policies.
    whyItMatters: >-
      These inputs determine revenue quality and whether seat and feature expansion convert into durable recognized
      revenue.
    diligencePath: Request the contract register, invoices, ARR bridge, pricing approvals, and revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, infrastructure cost, data-licensing cost, CAC, payback, GRR, NRR, and churn by cohort.
    whyItMatters: Without these metrics, recurring revenue cannot be translated into contribution margin or capital efficiency.
    diligencePath: >-
      Obtain monthly management accounts and customer cohorts reconciled to billing, cloud, model, data, sales, and
      support ledgers.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current unrestricted cash, debt, commitments, monthly burn, runway, and next-financing trigger.
    whyItMatters: Funding raised does not reveal liquidity remaining or the timing and terms of future capital needs.
    diligencePath: Request a current balance sheet, 24-month cash forecast, debt schedule, hiring plan, and downside runway case.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      A current company capitalization table reconciling the more-than-$300-million funding claim with Sacra's
