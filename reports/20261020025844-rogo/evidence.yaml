    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Independent certification records, penetration-test results, incident history, and a current control-scope
      statement.
    whyItMatters: Company-reported controls do not establish operating effectiveness or the boundaries of protected customer data.
