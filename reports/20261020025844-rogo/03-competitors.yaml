      - "Key unknown"
      - "Diligence implication"
    rows:
      - ["Rogo public route", "None shown", "Sales-assisted institutional deployment", "Platform consultation and tailored deployment", "Users, usage, minimums, implementation, and discounting", "Obtain a binding proposal for a defined workflow and user cohort"]
      - ["Rogo Sacra estimate", "About $3,300 per seat annually", "Estimated multi-year enterprise subscription", "Core seat plus possible paid data and features", "Realized price, date, cohort, and discount structure", "Treat as a directional estimate, not a price quote"]
      - ["Third-party financial data", "Not disclosed", "Separate provider entitlements may apply", "Dataset access depends on customer licenses", "Redistribution rights, renewal terms, and incremental fees", "Price software and data rights separately"]
      - ["AlphaSense, Hebbia, S&P, and Bloomberg", "Not disclosed in assigned evidence", "Unknown in this evidence set", "Product positioning only", "Price, unit, terms, and included usage", "Do not rank total cost without proposals on a common scope"]
      - ["Internal build", "No comparable public price", "Internal engineering and operating cost", "Firm-controlled implementation", "Build time, ongoing support, model and data fees, and governance cost", "Compare full lifecycle cost and review burden, not license price alone"]
    notes: >-
      Pricing coverage is partial. The only numerical Rogo figure is Sacra's estimate; no
      assigned source provides realized Rogo contracts or numerical peer pricing.
    claimRefs: [CP012, CP013, CP014]
