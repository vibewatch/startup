company:
  name: "Rogo"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Rogo competes across vertical finance AI, research discovery, document analysis,
    incumbent data terminals, internal builds, and manual Office workflows. Its strongest
    visible differentiation is the combination of finance-specific agents, governed data
    connections, native deliverables, and forward-deployed adoption support, while pricing,
    comparative accuracy, data-entitlement economics, and the durability of those advantages
    remain insufficiently disclosed.
sections:
  - id: "competitive-set"
    title: "The competitive set is broader than vertical AI peers"
    body: >-
      The buyer's alternative set begins with specialist products but does not end there.
      Rogo is positioned around finance-specific workflows and finished work products, while
      AlphaSense is described as starting from market-intelligence discovery and Hebbia from
      structured analysis of large document collections. S&P Capital IQ and Bloomberg bring
      incumbent data breadth and installed distribution; Sacra, however, characterizes their
      trade-offs as interface or contract complexity and reduced customization. Internal
      development and manual research-plus-Office workflows remain substitutes because a bank
      can preserve firm-specific controls without buying another application, although the
      assigned evidence does not quantify their cost, quality, or time-to-value. This means the
      relevant contest is for ownership of the complete research-to-deliverable workflow, not
      simply for the best chat response.
    claimRefs: [CP009, CP010, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "capability-and-distribution"
    title: "Workflow depth and deployment support are the visible differentiation"
    body: >-
      Rogo's May 2026 release expanded Felix across PowerPoint, Excel, Word, dashboards,
      sourced research, email, scheduled monitoring, custom agents, memory, and additional
      connectors. The product therefore competes on orchestration, output fidelity, and
      permissioned context rather than on a proprietary foundation model alone. Email and
      native Excel access reduce interface switching, while firm templates, reusable agents,
      memory, and versioned revisions can embed the product in recurring work. Distribution is
      also part of the product: Rogo says former bankers and investors embed with customers,
      and its funding announcement directs capital toward forward-deployed teams and global
      expansion. Those elements can accelerate adoption, but public evidence does not separate
      repeatable software value from implementation intensity or prove superior accuracy
      against competing products.
    claimRefs: [CP002, CP005, CP006, CP007, CP008, CP015]
    tableRefs: [TP002]
  - id: "pricing-and-lock-in"
    title: "Commercial opacity and data rights complicate a clean price comparison"
    body: >-
      Rogo's reviewed public sales route did not publish a numerical tariff, billing period,
      seat minimum, or usage allowance. Sacra estimates approximately $3,300 per seat annually
      and describes multi-year enterprise contracts, but this is an analyst estimate rather
      than a company price list or realized contract evidence. Buyers must also separate the
      software subscription from licensed financial data and deployment work. Provider logos
      do not establish universal entitlements, and permissions may constrain what generated
      materials can contain or redistribute. Consequently, the defensible comparison is a
      proposal-level total-cost and workflow test: software, data rights, implementation,
      review burden, and export permissions should be measured together. Peer pricing and
      discount structures are not disclosed in the assigned evidence.
    claimRefs: [CP012, CP013, CP014]
    tableRefs: [TP003]
  - id: "moat-and-displacement"
    title: "The moat resides in configuration and distribution, but incumbents and upstream models remain threats"
    body: >-
      The most plausible durable layer is Rogo's harness: finance-specific evaluations,
      connectors, audit controls, house-style output, reusable agents, and embedded deployment
      knowledge that can persist when the underlying model changes. Firm-specific templates,
      memory, permissions, and recurring agents can create operational switching costs because
      replacement requires reconstructing context and governance, not merely changing a chat
      interface. That moat is not proven independently. Incumbents can bundle AI into existing
      data estates, specialist rivals can converge on document-to-deliverable workflows, and
      large institutions can build internally. Sacra also identifies dependence on third-party
      model providers as a risk if pricing, access, or performance changes. No assigned source
      provides a controlled benchmark of accuracy, implementation cost, retention, or
      multi-homing, so differentiation should be treated as promising but not yet demonstrated
      as durable.
    claimRefs: [CP005, CP008, CP009, CP010, CP011, CP014]
