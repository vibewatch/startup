  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Realized contract pricing, discount schedules, revenue mix, and revenue-recognition policies.
      whyItMatters: These inputs determine revenue quality and whether seat and feature expansion convert into durable recognized revenue.
      diligencePath: Request the contract register, invoices, ARR bridge, pricing approvals, and revenue-recognition memorandum.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, infrastructure cost, data-licensing cost, CAC, payback, GRR, NRR, and churn by cohort.
      whyItMatters: Without these metrics, recurring revenue cannot be translated into contribution margin or capital efficiency.
      diligencePath: Obtain monthly management accounts and customer cohorts reconciled to billing, cloud, model, data, sales, and support ledgers.
      relatedQuestionRefs: [QI004, QI005, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current unrestricted cash, debt, commitments, monthly burn, runway, and next-financing trigger.
      whyItMatters: Funding raised does not reveal liquidity remaining or the timing and terms of future capital needs.
      diligencePath: Request a current balance sheet, 24-month cash forecast, debt schedule, hiring plan, and downside runway case.
      relatedQuestionRefs: [QI006, QI007]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: minor
      topic: funding
      missingEvidence: A current company capitalization table reconciling the more-than-$300-million funding claim with Sacra's $165-million total.
      whyItMatters: The discrepancy can distort estimates of primary capital raised and financing available to the business.
      diligencePath: Reconcile all primary proceeds, secondary transactions, and round closes to board-approved financing documents.
      relatedQuestionRefs: [QI006]
