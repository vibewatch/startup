schemaVersion: "report-v2"
artifact: financials
slug: rogo
runDate: 2026-10-20
company:
  name: Rogo
chapter:
  number: 4
  title: Financials
  summary: >-
    Rogo appears to monetize through multi-year enterprise subscriptions, seat expansion,
    specialized data access, and paid features, while a third-party estimate places ARR at
    $53 million in August 2026. The $160 million Series D provides substantial financing,
    but public evidence still does not disclose realized pricing, revenue mix, gross margin,
    retention, burn, cash on hand, or runway, preventing a complete financial underwriting.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      The clearest public description is a B2B SaaS model sold to financial institutions
      through multi-year enterprise contracts. Sacra describes a roughly $3,300 annual
      per-seat price and additional monetization from specialized data access and paid
      features; these are third-party estimates, not a company price sheet or evidence of
      realized contract value. The model therefore has recurring and expansion-revenue
      characteristics, but the retained evidence does not disclose discounting, minimum
      commitments, implementation fees, revenue recognition, or the mix among seats, data,
      and features. Rogo's platform breadth and guided implementation may strengthen
      adoption, yet there is no public basis for treating implementation work as a
      separately priced revenue stream. The revenue bridge below is a mechanism map, not
      a quantified gross-profit bridge.
    claimRefs: [CI001, CI002, CI007, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency signals
    body: >-
      Public traction is meaningful but unevenly verified. Rogo says more than 35,000
      professionals at over 250 institutions use the platform, a claim repeated by
      independent reporting but still originating with the company. Sacra estimates
      $53 million of ARR in August 2026 versus $15 million at the end of 2025, while AI
      Wiki reports that the company reached seven-figure ARR within five months using one
      sales representative. These datapoints suggest rapid adoption and potentially
      efficient early selling, but they do not substitute for audited revenue, bookings,
      cohort retention, sales-and-marketing spend, or CAC payback. User counts also cannot
      be converted into revenue by multiplying them by the reported seat price because
      deployment terms, active-seat definitions, discounts, and bundled access are unknown.
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The visible cost structure combines cloud infrastructure, third-party model usage,
      licensed financial data, product development, and forward-deployed implementation
      teams. Sacra specifically identifies cloud and data-licensing costs and flags
      dependence on OpenAI and Google as exposure to price or access changes. Those drivers
      make gross margin sensitive to workload intensity, model routing, data entitlements,
      and the amount of human support bundled into deployments. No retained source
      quantifies gross margin, inference cost per workflow, data cost per customer, CAC,
      payback, NRR, logo churn, or implementation utilization. Consequently, the recurring
      subscription structure is visible, but neither contribution margin nor operating
      leverage is. The appropriate diligence focus is contract-level revenue and cost
      reconciliation rather than a speculative SaaS benchmark.
    claimRefs: [CI008, CI009, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Rogo announced a $160 million Series D in April 2026 and said the round brought total
      funding above $300 million. Sacra's page instead states $165 million of total funding,
      an internally stale-looking figure that conflicts with the later financing and should
      not be silently reconciled. The company says proceeds will fund international
      expansion, institutional partnerships, forward-deployed teams, and Felix. Funding
      raised is not cash available: no retained source provides cash on hand, monthly burn,
      debt, runway, or a next-round trigger. The financial verdict is therefore balanced:
      disclosed adoption and financing reduce near-term capital-access concern, but revenue
      quality, margin path, retention, and capital efficiency remain unobservable. Investor
      underwriting should remain conditional on management accounts, customer cohorts,
      contract economics, and a current cash-to-runway bridge.
    claimRefs: [CI010, CI011, CI012, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public value or status
      - Revenue quality
      - Diligence ask
    rows:
      - ["Enterprise subscription", "Multi-year institutional contract", "Contract", "Disclosed mechanism; value undisclosed", "Recurring, subject to renewal and deployment terms", "Provide ARR by contract, term, renewal date, and recognized-revenue policy"]
      - ["Seat access", "Professionals deployed within customer firms", "Seat per year", "About $3,300 per seat per year, per Sacra", "Potential expansion revenue; realized price is unknown", "Provide contracted, provisioned, and monthly active seats plus realized price"]
      - ["Specialized data access", "Paid access to licensed financial datasets", "Dataset or entitlement", "Price and mix undisclosed", "Expansion revenue with possible pass-through cost exposure", "Provide attach rate, gross revenue, licensing cost, and renewal terms"]
      - ["Paid features", "Additional workflow or capability purchases", "Feature or module", "Price and mix undisclosed", "Potential expansion revenue; packaging is not public", "Provide SKU-level bookings, discounts, and gross margin"]
    notes: >-
      Mechanisms and the approximately $3,300 seat price come from Sacra; realized pricing,
      revenue mix, discounts, and recognition treatment are not publicly disclosed.
    claimRefs: [CI001, CI002, CI007]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Pricing element
      - Public evidence
      - List versus realized
      - Key uncertainty
    rows:
      - ["Enterprise contract", "Multi-year subscriptions sold directly to financial institutions", "Contract structure only", "Minimum commitments, renewal uplifts, and termination rights"]
      - ["Seat price", "Approximately $3,300 per seat annually, per Sacra", "Third-party estimate, not an official list price", "Volume discounts, bundled seats, and active-seat definitions"]
      - ["Specialized data", "Additional revenue from specialized data access", "No public price", "Whether data is marked up, passed through, or bundled"]
      - ["Paid features", "Additional revenue from paid features", "No public price", "SKU packaging, attach rate, and realized expansion"]
    notes: >-
      This table distinguishes Sacra's estimated pricing and described mechanisms from
      company-confirmed realized contract economics, which remain unavailable.
    claimRefs: [CI001, CI002, CI007]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR", "$53M in August 2026, Sacra estimate", "Medium-low", "Anchors scale but is not company-confirmed revenue", "Reconcile ARR to GAAP revenue, bookings, and deferred revenue"]
      - ["Prior ARR", "$15M at end-2025, Sacra estimate", "Medium-low", "Suggests rapid growth if measured consistently", "Provide monthly ARR bridge and acquisition/FX effects"]
      - ["Gross margin", null, "Unavailable", "Tests whether model, data, and support costs permit software-like economics", "Provide gross margin by product and a cloud/data/support cost bridge"]
      - ["CAC and payback", null, "Unavailable", "Tests whether apparent growth is capital efficient", "Provide fully loaded CAC, sales cycle, win rate, and payback by segment"]
      - ["NRR and churn", null, "Unavailable", "Tests durability of seat and feature expansion", "Provide logo retention, GRR, NRR, downsell, and cohort expansion"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines financing dependency despite the Series D", "Provide current cash, restricted cash, debt, monthly burn, and runway"]
      - ["Variable cost drivers", "Cloud, model, and licensed-data costs are indicated but unquantified", "Medium", "These inputs govern contribution margin as usage scales", "Provide unit cost per query/workflow and data cost per deployed seat"]
    notes: >-
      ARR values are Sacra estimates; null means the metric was not disclosed in the assigned
      public evidence, not zero. Financing raised is shown separately from cash availability.
    claimRefs: [CI003, CI004, CI005, CI008, CI009, CI013, CI014]
figures:
  - id: FI001
    title: Revenue mechanism and gross-profit dependency
    type: flow
    summary: >-
      Enterprise contracts can expand through seats, data access, and paid features, but
      cloud, model, data, and implementation costs prevent a quantified margin bridge.
    data:
      nodes:
        - id: institutional-contract
          label: Multi-year institutional contract
          detail: Direct enterprise subscription sold to a financial institution.
        - id: seat-deployment
          label: Seat deployment
          detail: Professionals receive access; realized seat terms are not public.
        - id: workflow-usage
          label: Workflow usage
          detail: Research, modeling, and agent workflows drive platform activity.
        - id: expansion
          label: Data and feature expansion
          detail: Specialized data access and paid features can add revenue.
        - id: recurring-revenue
          label: Subscription and add-on revenue
          detail: Sacra characterizes the model as recurring B2B SaaS.
        - id: gross-profit
          label: Gross profit, unquantified
          detail: Revenue is reduced by cloud, model, data-licensing, and support costs.
      edges:
        - source: institutional-contract
          target: seat-deployment
        - source: seat-deployment
          target: workflow-usage
        - source: workflow-usage
          target: expansion
        - source: expansion
          target: recurring-revenue
        - source: recurring-revenue
          target: gross-profit
    approximationNotes: >-
      This is a qualitative mechanism map. It does not estimate revenue, conversion,
      gross margin, or the relative magnitude of any node.
    claimRefs: [CI001, CI008, CI015]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $160 million Series D indicates financing access, but without current cash, burn,
      debt, and obligations it cannot establish cash available or months of runway.
    claimRefs: [CI010, CI013]
  - calloutType: recommendation
    title: Underwrite from contracts and cohorts
    body: >-
      Request contract-level ARR, realized pricing, retention cohorts, direct delivery costs,
      and a cash bridge before assigning software-like margins or capital efficiency.
    claimRefs: [CI007, CI009, CI016]
