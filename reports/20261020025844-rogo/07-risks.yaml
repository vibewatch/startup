schemaVersion: "report-v2"
artifact: risks
slug: rogo
runDate: 2026-10-20
company:
  name: Rogo
chapter:
  number: 7
  title: Risks
  summary: >-
    Rogo's principal underwriting risks are not a documented enforcement action or outage, but the
    gap between broad company-stated governance controls and independently verified, tenant-specific
    assurance; the propagation of errors or permissions failures through autonomous financial
    workflows; and dependence on frontier-model and licensed-data providers. A large 2026 financing
    improves capacity to mitigate these issues, but public evidence does not establish cash runway,
    unit economics, contractual portability, or production error rates.
sections:
  - id: ranked-risk-posture
    title: Ranked residual risk posture
    body: >-
      The highest residual exposure is cross-deal confidentiality and entitlement enforcement.
      Rogo says existing entitlements carry through to agents, while independent reviews emphasize
      that a deployment must prove that inaccessible source material cannot leak through generated
      tables or reusable workflows. The second cluster is output integrity: Felix is described as
      autonomously executing multi-step deal workflows, so a wrong assumption can travel farther
      than in a single-answer research tool before a human catches it. Third-party model and
      financial-data dependencies add both availability and gross-margin sensitivity. The heatmap
      therefore ranks residual risk from evidence strength and workflow consequence, not from an
      asserted incident history; no reviewed source establishes incident frequency or loss rates.
    claimRefs: [CR001, CR006, CR007, CR009, CR011, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-governance
    title: Regulatory, legal, privacy, and assurance risk
    body: >-
      Rogo publicly lists SOC 2 Type II, ISO 27001, ISO 42001, GDPR, CCPA, and EU AI Act credentials
      or alignment. Those are meaningful mitigation signals, but the assigned evidence does not
      include certificates, auditor reports, control scope, test periods, legal opinions, or
      jurisdiction-specific deployment assessments. Vantaige explicitly recommends obtaining
      current attestation letters and scope, while Sequenced states that it did not inspect private
      assurance reports or verify a particular deployment. The investment implication is a
      conditions-precedent approach: verify certificate issuers and scope, map data residency and
      retention to each customer entity, and test permission inheritance before treating the
      compliance posture as mature. Public-source silence on litigation, enforcement, or incidents
      remains an evidence gap, not evidence that none exist.
    claimRefs: [CR001, CR002, CR003, CR004, CR007]
    tableRefs: [TR001]
  - id: operational-quality-security
    title: Operational, quality, security, and dependency risk
    body: >-
      The mitigation architecture is directionally appropriate: SiliconANGLE reports audit trails,
      access controls, and daily infrastructure vulnerability scanning, and Rogo says source
      permissions carry into agents. However, these controls are predominantly vendor-described and
      do not quantify false outputs, review effort, availability, recovery objectives, or isolation
      failures. Operational diligence should use adversarial production-like tests: conflicting
      source documents, broken spreadsheet links, stale market data, and two segregated mock deal
      rooms. Dependency risk is also structural. External model providers, licensed financial-data
      feeds, and firm-specific implementation support are integral to the offering, so adverse
      pricing, access, or service changes can affect quality, availability, or economics even if
      Rogo's own application layer performs as designed.
    claimRefs: [CR001, CR005, CR006, CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002, TR003]
  - id: financial-execution-triggers
    title: Financial exposure, monitoring indicators, and thesis-break triggers
    body: >-
      Rogo announced a $160 million Series D and more than $300 million of total funding, while
      FinTech Futures reported that the round followed a $75 million Series C by roughly four months.
      This supports substantial financing access, but funding raised is not cash available and does
      not disclose burn, runway, gross margin, or working-capital needs. Sacra's $53 million August
      2026 ARR figure is explicitly an estimate, and Vantaige reports that pricing is not public.
      Underwriting should therefore monitor independently reconciled ARR, gross retention, model and
      data costs as a share of revenue, production error rates, severity-one security events, and
      implementation time. Thesis-break triggers are a material permission-isolation failure,
      inability to reproduce cited financial outputs, loss of critical data rights, or financing
      needs that arrive before durable unit economics are demonstrated.
    claimRefs: [CR012, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Investment condition
    body: >-
      Do not convert vendor-listed certifications, funding raised, or user scale into a low-risk
      conclusion. Require tenant-scoped assurance evidence, an adversarial workflow pilot, data and
      model portability terms, and reconciled operating metrics before underwriting residual risk.
    claimRefs: [CR002, CR003, CR006, CR009, CR012, CR014]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Jurisdiction / surface
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Cross-deal confidentiality and entitlement enforcement
        - Financial institutions / each customer tenant
        - Company states entitlements carry through to agents; no tenant test is in the assigned evidence
        - Unknown
        - Critical
        - Vendor-stated controls
        - High
        - Run two-deal-room isolation tests and inspect permission, audit, and export logs
      - - Security and AI-management certifications
        - Enterprise and regulated-customer procurement
        - SOC 2 Type II, ISO 27001, and ISO 42001 are listed by Rogo; certificates and scope were not reviewed
        - Medium
        - High
        - Claimed certification set
        - Medium-high
        - Obtain current certificates, auditor letters, exceptions, subservice scope, and remediation records
      - - Privacy and AI-regulation alignment
        - United States, European Union, and customer booking entities
        - GDPR, CCPA, and EU AI Act are listed; deployment-specific legal analysis is not public
        - Medium
        - High
        - Policy-level claim
        - High
        - Map controller and processor roles, retention, residency, model use, and human-oversight obligations
    notes: >-
      Partial public-source register as of 2026-10-20; likelihood reflects evidence availability
      rather than observed incident frequency, and no assigned source provides a regulator or court record.
    enumerationScope:
      coverage: partial
      basis: >-
        Public regulatory, legal, privacy, and assurance risks identifiable in the eight assigned
        prefetched sources through 2026-10-20.
    claimRefs: [CR001, CR002, CR003, CR004, CR007]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap or kill criterion
    rows:
      - - Permission or memory leakage between deal teams
        - Unknown
        - Critical
        - Vendor-stated access controls
        - High
        - Any reproducible cross-tenant or cross-deal disclosure is a thesis-break event
      - - Incorrect financial output propagates through a multi-step deliverable
        - Medium
        - High
        - Citations and audit trails are claimed
        - High
        - Require measured error, reviewer rework, and citation-reproduction rates on live workflows
      - - Security control scope differs from the customer's deployed configuration
        - Medium
        - High
        - Daily scanning and certifications are reported
        - Medium-high
        - Block rollout if tenant scope, exceptions, or recovery evidence cannot be produced
      - - Autonomous workflow obscures a missing dataset or unresolved assumption
        - Medium
        - High
        - Human review remains necessary
        - High
        - Pilot must surface missing inputs rather than produce a success-shaped final artifact
    notes: >-
      Severity is based on potential workflow consequence; assigned sources do not quantify
      production error rates, outages, recovery performance, or incident frequency.
    claimRefs: [CR001, CR005, CR006, CR007, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or layer
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Frontier models
        - OpenAI, Google, and other model providers
        - Core model capability
        - No provider mix or spend share disclosed
        - Price, access, or quality changes degrade product economics or output
        - High
        - Model-routing and substitution testing
        - High
      - - Licensed financial data
        - FactSet, PitchBook, LSEG, and other entitlement providers
        - Inputs to finance workflows
        - Contract terms and renewal concentration are not public
        - Lost rights or changed redistribution terms break workflows
        - High
        - Contract audit, alternate-source mapping, and export rights
        - High
      - - Firm-specific implementation
        - Rogo forward-deployed bankers and engineers
        - Workflow encoding and adoption
        - Staffing ratios and post-launch support are not disclosed
        - Scaling demand lengthens implementation or raises service cost
        - Medium-high
        - Measure implementation hours, backlog, and customer-owned maintainability
        - Medium-high
      - - External financing
        - Venture investors
        - Funds expansion and product development
        - Large 2026 financing disclosed; cash balance and burn are not
        - Expansion outruns durable unit economics
        - High
        - Board reporting on runway, margin, retention, and hiring pace
        - Medium-high
    notes: >-
      Concentration values are unavailable in the assigned evidence; named counterparties indicate
      dependency surfaces but do not establish spend share, exclusivity, renewal timing, or portability.
    claimRefs: [CR008, CR009, CR010, CR011, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative ranking of likelihood, impact, mitigation maturity, and residual severity based on
      the assigned public evidence, with unknown likelihood retained where no incident denominator exists.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Permission isolation
          values: [Unknown, Critical, Vendor-stated, High]
        - label: Output accuracy
          values: [Medium, High, Partially evidenced, High]
        - label: Regulatory assurance scope
          values: [Medium, High, Vendor-stated, Medium-high]
        - label: Model-provider dependency
          values: [Medium, High, Partially mitigated, High]
        - label: Financial-data entitlements
          values: [Medium, High, Contract-dependent, High]
        - label: Financing and scaling execution
          values: [Medium, High, Well-funded, Medium-high]
    approximationNotes: >-
      Qualitative categories are analytical judgments, not measured probabilities; no assigned source
      supplies incident frequency, loss magnitude, provider concentration, or control-test results.
    claimRefs: [CR003, CR006, CR009, CR011, CR013, CR014, CR016]
