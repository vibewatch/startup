    title: Scale is reported more clearly than economics
    body: >-
      Rogo reports more than 35,000 professionals at over 250 institutions, but
      company-confirmed ARR, margins, retention, cash, burn, and current
      headcount are absent from the assigned evidence; Sacra's $53 million ARR
      figure remains an estimate.
    claimRefs: [CO007, CO008]
