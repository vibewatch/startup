artifact: company-overview
slug: rogo
runDate: 2026-10-20
company:
  name: Rogo
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Rogo is a New York-founded vertical AI platform for institutional finance that
    reported more than 35,000 users across over 250 institutions after an April 2026
    $160 million Series D. The operating scale is meaningful, but the strongest
    current revenue figure is a third-party ARR estimate and the reviewed evidence
    does not establish current headcount, cash position, full governance, or the
    Series D valuation.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Rogo was founded in New York City in 2021 by Gabriel Stengel and John
      Willett; a separate account identifies Tumas Rackaitis as the third member
      of the Princeton-origin founding group. The company is a private,
      Series D-stage vertical AI vendor for investment banks, private-equity
      firms, asset managers, and related financial institutions. Its product
      combines firms' internal information with licensed and public financial
      data, then automates research, company profiles, investment memos, slide
      decks, and financial models. This is an enterprise workflow product rather
      than a general-purpose chatbot: deployment depends on data integrations,
      auditability, access controls, and fit with Excel, PowerPoint, Word, and
      institution-specific templates. The business model is described by Sacra
      as multi-year enterprise subscriptions with seat-based expansion and paid
      data or feature add-ons, but contract pricing has not been disclosed by
      Rogo in the reviewed evidence.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder-market fit, and governance
    body: >-
      The founding team has direct finance-workflow exposure: an independent
      account says Stengel, Willett, and Rackaitis met at Princeton, pursued
      finance careers including work at J.P. Morgan and Lazard, and expanded an
      econometrics-chatbot project after developer access to GPT-3. Gabriel
      Stengel is the named chief executive and public spokesperson, while
      product and engineering evidence also names functional leaders below the
      founder level. That combination supports founder-market fit, but it also
      leaves visible key-person dependence around Stengel's customer narrative
      and the founders' domain knowledge. Only Keith Rabois is identified as a
      board member in the assigned evidence; the complete board, observer
      rights, ownership, protective provisions, and succession depth are not
      publicly established here. The leadership table is therefore a partial
      enumeration, not a complete management or governance roster.
    claimRefs: [CO002, CO003, CO015, CO016]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capitalization and reported scale
    body: >-
      Rogo announced a $160 million Series D led by Kleiner Perkins on April 29,
      2026 and said the financing lifted cumulative funding above $300 million.
      The round included Sequoia, Thrive Capital, Khosla Ventures, J.P. Morgan
      Growth Equity Partners, BoxGroup, Mantis VC, Jack Altman, Evantic, and
      Positive Sum. The company also reported more than 35,000 financial
      professionals using the platform at over 250 institutions. These adoption
      figures are repeated by independent outlets but originate with Rogo and
      should not be treated as audited usage. Sacra separately estimates $53
      million of ARR in August 2026, up from $15 million at year-end 2025; that
      is an analyst estimate, not company-confirmed revenue. Publicly assigned
      evidence does not establish current headcount, gross margin, net revenue
      retention, cash balance, burn, debt, or the Series D post-money valuation,
      so those metrics remain null rather than being inferred from funding.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-diligence-view
    title: Milestones and diligence view
    body: >-
      The financing sequence shows unusually rapid capital formation: seed and
      Series A records in 2024, a Series B in April 2025, a Series C in January
      2026, and the Series D three months later. The exact seed chronology is not
      clean: Sacra places seed funding in February 2024, while Lex reports a $7
      million first seed in late 2023; Lex also reports $18.5 million for the
      Series A versus Sacra's $18 million. Product scope expanded in March and
      April 2026 through the Offset acquisition and Felix launch, which moved the
      narrative toward autonomous, multi-step work. Investor and company sources
      present strong adoption, while Lex explicitly notes unknown licensing
      costs and grounds its revenue discussion in assumptions. The central
      diligence conclusion is therefore asymmetric: customer reach and funding
      are visible, but unit economics, retention, governance rights, and
      company-confirmed revenue remain unavailable. Those omissions prevent a
      reliable assessment of capital efficiency or operating leverage from this
      chapter alone.
    claimRefs: [CO005, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
