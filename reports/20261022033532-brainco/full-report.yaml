      - number: '1.4'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              BrainCo's chronology shows repeated product expansion: early Focus headbands, a 2020 BrainRobotics
              prosthetic-hand launch, later wellness and sleep products, and a claimed brain-to-robot platform in 2026.
              The same history contains an important trust warning. A Chinese school stopped a FocusEDU trial after
              public privacy backlash, and VICE reported concerns from students and parents about attention monitoring.
              BrainFutures described the product's classroom monitoring mechanics but listed no available research,
              limiting the strength of public efficacy evidence. These events do not prove that current products have
              the same controls or risk profile, but they make consent, neural-data handling, product-level validation,
              and school deployment governance mandatory diligence areas. Market estimates also vary widely by
              definition, reinforcing that broad category growth cannot substitute for BrainCo-specific commercial
