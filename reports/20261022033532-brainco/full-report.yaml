      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a high-level operating model rather than a disclosed technical
              architecture. For prosthetics, the observable chain is biosignal capture, signal interpretation, actuation
              and user-facing hand control; for FocusEDU, it is EEG collection, software interpretation, teacher-facing
              feedback, and optional neurofeedback exercises. The Robot Report says Revo 2 includes a 3D tactile sensing
              system and a software development kit supporting EtherCAT and wide-voltage features, while the iF Design
              entry attributes the product to Zhejiang Qiangnao Technology and describes self-developed micro-actuation
              and optimized joint transmissions. These are product-level disclosures, not a complete bill of materials,
              model architecture, validation protocol, or service-level design. Deployment dependencies, calibration,
              battery, connectivity, data retention, and integration interfaces remain diligence items.
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
