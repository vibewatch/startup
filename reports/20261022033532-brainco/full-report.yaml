        - medium
        - Product and market evidence is available; valuation evidence is incomplete.
      - - Risk rating
        - high
        - Commercial, regulatory, privacy, reimbursement, and financing risks remain material.
      - - Valuation stance
        - unknown
        - No current BrainCo price, revenue, margin, or cap-table basis is disclosed in retained sources.
    notes: >-
      Assessment is based on the assigned prefetched evidence as of 2026-10-22; unknown valuation is not a zero or an
      estimate.
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV011
      - CV014
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Platform optionality
        - EEG engagement studies and a robot-control demonstration show multiple technical applications.
        - Product-level revenue, paid deployment counts, and shared-platform economics.
      - - Market tailwind
        - Third-party forecasts project growth in BCI and bionic prosthetics.
        - BrainCo segment revenue growth and serviceable market conversion.
      - - Commercialization risk
        - Education deployment faced privacy backlash and an official stop order.
        - Independent evidence of compliant deployments, consent controls, and renewal rates.
      - - Financing opacity
        - Retained sources do not disclose BrainCo's current round, valuation, or preferences.
        - Signed term sheet, cap table, liquidation preferences, debt, and cash runway.
    notes: Market forecasts are category context and are not BrainCo operating results or valuation comparables.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Evidence-based assumptions
      - Valuation / return logic
      - Trigger
    rows:
      - - Bull
        - >-
          Repeatable paid adoption across at least one product line; regulatory and privacy controls verified; margins
          and retention disclosed.
        - Premium only if verified growth and unit economics support a comparable multiple.
        - Audited or diligence-verified cohort, margin, and financing data.
      - - Base
        - Technical breadth converts unevenly; one or more products progress while capital needs remain high.
        - Research-more until price is anchored to segment economics and dilution terms.
        - Current round terms, cash runway, and product-level revenue.
      - - Bear
        - Privacy or regulatory friction, high cost, weak reimbursement, or low pilot conversion blocks scale.
        - Avoid or require a substantial price reset and downside protection.
        - Regulatory block, down round, missed financing, or failed paid conversion.
      - - Unresolved
        - Company-specific valuation, revenue, retention, and cap-table evidence remains unavailable publicly.
        - No numerical valuation range should be asserted.
        - Independent diligence closes the named data gaps.
    notes: >-
      Scenarios are qualitative because the assigned evidence does not support a company-specific valuation range or
      return calculation.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: BrainCo company and product milestones
    type: timeline
    summary: >-
      Publicly reported milestones show a decade-long expansion from EEG attention products into prosthetics and broader
      brain-to-machine systems, alongside recurring privacy and evidence-quality questions.
    data:
      items:
        - date: '2015'
          label: Founded
          detail: Bicheng Han founded BrainCo in Somerville while affiliated with Harvard's brain-science ecosystem.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2016'
          label: Focus 1 and seed financing
          detail: The public chronology dates the first Focus headband and a US$5.5M seed round to 2016.
          tone: positive
          claimRefs:
            - CO004
        - date: '2018'
          label: Hangzhou headquarters
          detail: BrainCo established its Hangzhou headquarters while retaining a Somerville office.
          tone: neutral
          claimRefs:
            - CO003
        - date: '2019'
          label: School trial backlash
          detail: A Chinese primary school stopped using FocusEDU after privacy and monitoring concerns drew public criticism.
          tone: adverse
          claimRefs:
            - CO012
            - CO013
        - date: '2020'
          label: Prosthetic hand market launch
          detail: The BrainRobotics prosthetic hand was publicly described as launching to market in 2020.
          tone: positive
          claimRefs:
            - CO004
        - date: '2022'
          label: Sleep product expansion
          detail: The public product chronology dates the Eassleep headband release to November 2022.
          tone: neutral
          claimRefs:
            - CO004
        - date: '2024'
          label: OxyZen released
          detail: OxyZen added heart-rate, blood-oxygen, and brain-wave monitoring to the wellness portfolio.
          tone: neutral
          claimRefs:
            - CO004
        - date: '2025'
          label: Hong Kong expansion
          detail: BrainCo opened an Asia-Pacific headquarters at Hong Kong Cyberport.
          tone: positive
          claimRefs:
            - CO003
        - date: 2026-01
          label: Major financing and IPO filing reported
          detail: Reporting cited an approximately CNY2B / US$280M round and a confidential Hong Kong IPO filing.
          tone: positive
          claimRefs:
            - CO005
            - CO006
        - date: 2026-07
          label: Brain-to-robot platform presented
          detail: >-
            BrainCo presented a platform it claimed could translate EEG signals into robot commands in under 200
            milliseconds.
          tone: neutral
          claimRefs:
            - CO014
    approximationNotes: >-
