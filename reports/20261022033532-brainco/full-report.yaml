  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              BrainCo's investable market should be bounded by the products and workflows it can actually commercialize,
              not by all spending labeled neurotechnology. CNBC describes BrainCo as a maker of prosthetics and wearable
              BCI devices, while Mordor defines BCI revenue as systems that capture brain signals, translate them into
              digital commands, and control devices or software. That definition includes hardware, software and related
              services, but excludes neurostimulation devices that do not decode signals and ordinary AR or VR headsets
              without neural sensors. For BrainCo, the near-term boundary therefore includes non-invasive signal
              acquisition and decoding, clinical or rehabilitation neuroprosthetics, education and wellness products,
              and any validated platform licensing. It excludes the full humanoid-robot market, unrelated clinical
              neurostimulation, and speculative augmentation use cases. Status-quo substitutes remain important:
              conventional prosthetics, rehabilitation without neural interfaces, teacher observation, non-neural
              attention software, and standard human-machine inputs can absorb the same buyer budgets without purchasing
              a BrainCo product.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Sizing lenses, not a single TAM
        blocks:
          - type: paragraph
            body: >-
              Published BCI estimates are directionally useful but not interchangeable. Mordor estimates USD 1.40
              billion of global BCI revenue in 2026 and USD 2.26 billion in 2031, representing 10.10% CAGR. Precedence
              estimates USD 3.33 billion in 2026 and USD 13.86 billion in 2035, representing 16.77% CAGR. The two 2026
              estimates differ by USD 1.93 billion and a factor of about 2.38, before any adjustment for BrainCo's
              products, geographies or channels. Coherent Market Insights supplies a narrower adjacency: global bionic
              prosthetics at USD 1.96 billion in 2026, rising to USD 3.70 billion in 2033 at 9.5% CAGR. These estimates
              preserve different definitions, periods and methodologies; they are benchmarks, not additive TAM layers.
              Research and Markets' public outline further shows that BCI analysis commonly spans hospitals,
              rehabilitation centers, research institutions, defense organizations and assistive technology providers. A
              company-level SAM or SOM cannot be isolated without BrainCo's segment revenue, pricing, eligible accounts,
              reimbursement access, deployment capacity and observed win rates.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: Buyers, users, payers and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer changes by segment. Hospitals, clinics, rehabilitation centers and prosthetics
              practices can select a clinical device, while an amputee is the user and an insurer, public program or
              patient may fund it. Mordor reports that hospitals and clinics represented 45.10% of BCI revenue in 2025,
              while research and academic institutes were projected to grow fastest among its end-user segments.
              Education has a different chain: a school or district buys, teachers use the dashboard, students wear the
              device, and parents or regulators can determine acceptability. Consumer wellness compresses buyer, payer
              and user into one person or an employer program. CNBC reports BrainCo's stated adoption sequence as
              insured amputee applications first, then medical conditions, then consumer electronics, with eventual
              licensing to other brain-tech companies. China-specific policy could accelerate the clinical path: CNBC
              reports that health authorities created a separate insurance category for BCI. This sequence makes
              clinical outcomes and reimbursement the critical bridge from technology to recurring demand; consumer and
              licensing upside remains contingent on evidence of willingness to pay and repeat use.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption risk is substantial even when category growth is real. CNBC describes the central non-invasive
              technical challenge as acquiring and decoding signals that are subtle and noisy outside the skull.
              Coherent identifies high device cost, limited insurance coverage, limited reimbursement and technological
              limitations as constraints in bionic prosthetics. Institutional trust adds another hurdle. A BrainCo
              executive told CNBC that customer data remains on devices and is erased after each use, but Hunterbrook
              reports contrary evidence from a customer, privacy materials and a patent application indicating cloud or
              server transmission. The contradiction is unresolved in the assigned evidence. Education also carries
              outcome and consent risk: BrainFutures' Focus EDU page lists no available research, while VICE reported
              that officials ordered one Chinese primary school to stop using the headgear after public backlash. These
              constraints affect timing, sales cycles and discount rates. Category CAGR should not be translated into
              BrainCo revenue until diligence verifies product efficacy, regulatory status, reimbursement, privacy
              controls, contract conversion, retention and unit economics by segment.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A market range is more defensible than a point TAM
            body: >-
              The two published 2026 BCI estimates differ by about 2.38 times, so valuation should rely on a bottom-up
              BrainCo segment model rather than a single category forecast.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: Trust and reimbursement can dominate technical demand
            body: >-
              Signal quality, cost, reimbursement, education backlash and unresolved neural-data handling can slow
              adoption even if the underlying categories expand.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category boundaries
        blocks:
          - type: paragraph
            body: >-
              BrainCo's competitive set is heterogeneous because the company spans consumer neurofeedback, education,
              applied BCI, and prosthetics. A public company profile lists Neuralink, Synchron, Paradromics, Blackrock
              Neurotech, Emotiv, Muse, NextMind, Kernel, NeuroSky, and OpenBCI as a ten-company landscape, but those
              companies do not all sell the same product or serve the same buyer. Invasive implant developers compete
              for high-acuity clinical and research applications, while Emotiv and Muse compete more directly for
              portable EEG, neurofeedback, education, and developer use cases. BrainCo's non-invasive, product-first
              posture can shorten the path to deployment relative to surgical systems, but it also exposes the company
              to lower switching costs and consumer trust scrutiny. The relevant comparison is therefore by
              job-to-be-done: attention and neurofeedback, portable EEG/BCI development, classroom deployment, and
              prosthetic control. The market should not be treated as a single comparable revenue pool or a single
              technical benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP013
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP016
      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The directly observable product surfaces show different buying propositions. Muse publishes a $249.99 sale
              price for Muse 2 and bundles a headband with an app, cognitive-performance tracking, and biofeedback
              features. Emotiv positions Insight as a five-channel portable EEG headband for research, education,
              developers, and enterprise users, with a claimed one-to-two-minute setup and software/SDK connectivity.
              BrainCo's public profile describes FocusCalm, NeuroMaker STEM, Easleep, and BrainRobotics, while
              BrainFutures describes Focus EDU as a classroom platform that reports attention states from EEG headbands.
              These surfaces suggest BrainCo can differentiate through integrated classroom workflows and prosthetic
              applications, but the available pool does not provide comparable BrainCo list prices, contract terms,
              signal-quality benchmarks, or audited customer outcomes. Unknown cells are therefore material: a broad
              product catalog is not evidence of superior performance or pricing power.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability, trust, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              BrainCo's potential moat is execution across hardware, software, education workflows, and
              clinical-adjacent applications, reinforced by distribution and partnerships rather than by a single
              disclosed algorithmic advantage. The independent reporting in the pool describes a global race in which
              commercial scale, regulatory navigation, and consumer trust around brain-data privacy matter alongside
              neural read-write capability. The FocusEDU episode is a concrete adverse signal: a Chinese school was
              ordered to stop requiring brainwave-detecting headgear after public backlash about student privacy, even
              though the school and company described parental consent and classroom-level feedback. Emotiv's own
              disclosure that its products are not medical devices and that some software requires cloud connectivity
              illustrates how product claims, data handling, and intended use constrain deployment. BrainCo can benefit
              from a wearable commercialization path, but adoption durability depends on evidence of safety, consent,
              outcomes, and repeatable procurement—not just technical novelty or a large competitor list.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust and evidence are competitive variables
            body: >-
              The FocusEDU backlash and the absence of public comparative outcome, price, and regulatory evidence make
              trust and procurement proof central displacement risks.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Underwrite by use case, not headline category
            body: >-
              Compare BrainCo separately with consumer EEG, developer/research EEG, classroom analytics, invasive BCI,
              and prosthetics suppliers before assigning a moat or market-share assumption.
            calloutType: recommendation
            claimRefs:
              - CP001
              - CP005
              - CP013
          - type: callout
            title: Distribution may be the near-term battleground
            body: >-
              The assigned sources point to a market where deployment, software integration, trust, and regulatory
              navigation can matter as much as neural-signal sophistication.
            calloutType: insight
            claimRefs:
              - CP003
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              BrainCo appears to monetize several distinct product lines rather than one uniform recurring-revenue
              model. Public descriptions cover EEG headbands and software for attention, relaxation, training, and
              education; rehabilitation and assistive devices such as myoelectric prosthetics; and consumer sleep and
              relaxation products. The available evidence establishes mechanisms and use cases, not recognized revenue.
              Focus EDU is described as a headband-plus-software platform sold into education, with classroom
              monitoring, reporting, and neurofeedback exercises, while FocusCalm uses a device and application to
              generate meditation scores and training history. The product mix therefore spans institutional
              deployments, clinical or quasi-clinical rehabilitation, and consumer hardware/software, each with
              different sales cycles, support burdens, refund exposure, and revenue-recognition questions. Public
              traction is also uneven - a 2026 profile reports broad deployment language and a large financing round,
              but does not provide audited segment revenue, active users, bookings, or retention. BrainCo's own privacy
              notice confirms data processing architecture, not commercial performance. Underwriting should treat the
              portfolio as evidence of operating breadth, not proof of recurring revenue quality.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No assigned source supplies a public BrainCo price list, realized average selling price, contract value,
              discount schedule, customer acquisition cost, payback period, gross margin, service cost, or contribution
              margin. That absence matters because the economics are likely hardware-intensive - the financing coverage
              describes industrial partners tied to optics and electronics manufacturing, and BrainCo's public product
              descriptions span sensors, signal processing, software, fitting, training, and rehabilitation support.
              Official pricing would still represent list pricing rather than realized revenue or margin, so diligence
              needs contracts, channel terms, bill of materials, warranty and replacement rates, installation and
              clinician support costs, and cohort-level retention. The bionic-prosthetics market source identifies high
              device cost, limited insurance coverage, and limited reimbursement as adoption constraints; these are not
              BrainCo-specific measurements, but they are relevant external pressure points for the prosthetics line.
              Likewise, classroom attention products face consent and governance requirements that can lengthen sales
              cycles and raise implementation costs. The resulting financial view is a set of testable drivers, not a
              modeled unit-economic conclusion.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI010
              - CI015
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest public capital signal is an independently published estimate that BrainCo raised roughly RMB
              2 billion, or approximately $280 million to $286 million, in a recent financing round. The same account
              says the capital is expected to support research and development, production capacity, and commercial
              rollout, and describes a hardware-intensive company embedded in domestic supply chains. A separate 2026
              institutional profile reports about 2.9 billion yuan invested in R&D to date, but this is a company
              profile and should not be treated as audited cumulative spend or cash available. Neither source discloses
              cash on hand, monthly burn, debt, covenants, runway, use-of-funds schedule, or the trigger for a next
              round. The raise could extend strategic flexibility, but it does not establish capital adequacy because
              cash may be committed to inventory, manufacturing scale-up, regulatory work, or multiple product lines.
              External market reports suggest expanding BCI and bionic-prosthetics demand, while also highlighting high
              cost and reimbursement barriers. Financially, BrainCo merits further research rather than a positive
              underwriting conclusion until management provides segment revenue, gross margin, liquidity, and
              financing-obligation evidence.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI009
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Private-metric opacity is the central financial blocker
            body: >-
              Public evidence supports product breadth and financing scale, but not revenue quality, margin path,
              liquidity, or customer concentration. Treat the financing figure as capital raised, not cash available,
              and request primary financial statements before underwriting.
            calloutType: risk
            claimRefs:
              - CI004
              - CI011
              - CI012
              - CI015
          - type: callout
            title: Request a product-level operating bridge
            body: >-
              The highest-value diligence package is a product-by-product bridge from units shipped and recognized
              revenue to gross profit and cash consumption, with pricing, channel discounts, warranty, support,
              reimbursement, and inventory assumptions shown separately.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              BrainCo is described as a non-invasive brain-computer-interface company serving consumer, educational, and
              medical applications. The clearest public product surfaces are the BrainRobotics intelligent bionic hand
              and FocusEDU classroom headbands. Inside BCI describes the prosthetic as using EMG and EEG signals for
              dexterous motor control, while BrainFutures describes Focus EDU as an EEG headband and software platform
              that reports classroom and individual attention states. These sources establish product categories and
              intended users, not revenue, adoption, or clinical effectiveness. The product map therefore separates
              delivered or publicly described capabilities from unverified scale and outcome claims.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
