        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is clear; governance depth is not. Bicheng Han is the only consistently named current
              executive across the retained company profiles. The historical record also names James Edward Ryan as an
              adviser in 2017, but it does not establish that he holds a current role. No allocated source provides a
