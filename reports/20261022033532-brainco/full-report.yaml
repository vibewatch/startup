  - id: FP001
    title: Evidence-backed competitive positioning map
    type: quadrant
    summary: >-
      BrainCo is positioned as a broad, non-invasive commercialization platform, while peers concentrate on consumer,
      developer/research, or invasive clinical niches.
    data:
      points:
        - label: BrainCo
          x: 4
          'y': 5
          detail: >-
            Broad product breadth and non-invasive commercialization; comparative outcomes and pricing remain
            incomplete.
        - label: Emotiv
          x: 4
          'y': 4
          detail: Portable research/developer EEG with software and SDK ecosystem.
        - label: Muse
          x: 5
          'y': 2
          detail: Transparent consumer headband and neurofeedback proposition.
        - label: Neuralink
          x: 1
          'y': 2
          detail: Invasive BCI category; not a like-for-like wearable comparison.
        - label: OpenBCI
          x: 3
          'y': 3
          detail: Open-source biosensing and EEG platform positioning.
        - label: Synchron
          x: 1
          'y': 2
          detail: Endovascular BCI category that avoids open-brain surgery; not a like-for-like wearable comparison.
      xAxis:
        label: Commercial accessibility (ordinal, 1-5)
        min: 0
        max: 5
      yAxis:
        label: Documented product and workflow breadth (ordinal, 1-5)
        min: 0
        max: 5
    approximationNotes: >-
      Coordinates are ordinal analyst scores based on the cited product and category descriptions, not measured market
      shares, technical benchmarks, or clinical rankings. The map is a directional synthesis and should not be read as a
      quantitative performance claim.
