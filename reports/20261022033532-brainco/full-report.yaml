chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              BrainCo was founded in 2015 by Bicheng Han, who remains its publicly identified chief executive. The
              retained sources describe a cross-border operating footprint: Hangzhou is identified as headquarters,
              Somerville remains a U.S. office or registered location, and a Hong Kong Asia-Pacific headquarters was
              reported in 2025. Its commercial identity is broader than a single device. Public descriptions span
              non-invasive EEG headbands and software for education, attention, relaxation, and sleep, plus
              neuro-controlled prosthetic products. That breadth gives BrainCo exposure to both consumer or
              institutional neurotechnology and medical-device economics, but it also makes one blended market-size or
              revenue multiple analytically misleading. The company remains private; public reporting of a confidential
              Hong Kong IPO filing indicates a pre-IPO posture rather than completed public-company status.
