companyProfile:
  summary: >-
    BrainCo is a private neurotechnology company founded in 2015 and led by Bicheng Han. Its public product footprint
    spans non-invasive EEG headbands and software for education, attention, relaxation, and sleep, as well as
    neuro-controlled prosthetics and robotics. The company has meaningful financing and technical optionality, but
    public evidence does not establish current company-level operating economics or financing terms.
