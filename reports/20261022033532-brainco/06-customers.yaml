company:
  name: BrainCo
chapter:
  number: 6
  title: Customers
  summary: BrainCo serves distinct education, wellness, and assistive-device audiences, but public evidence is much stronger for product positioning and historical pilots than for current paid adoption, retention, or revenue concentration. Named school use and an app-store subscription establish customer-facing surfaces, while the public record leaves production deployment, renewal, and unit economics unresolved.
sections:
  - id: customer-segments
    title: Customer segments and buying jobs
    body: >-
      BrainCo's public product surface separates at least three customer motions. FocusCalm is aimed at individual wellness users, athletes, and stressed employees, with a consumer iPhone app, a separately sold EEG headband, and monthly or annual subscriptions. FocusEDU is an institutional education motion in which schools and teachers use classroom attention feedback and neurofeedback exercises; the available evidence describes school trials and a school-level donor relationship rather than a disclosed recurring contract base. The bionic-hand line addresses people with limb loss or impairment, but the public material in this pool does not identify BrainCo customers, reimbursement pathways, or production deployments for Revo. Category research places hospitals, rehabilitation centers, and specialty clinics among relevant end users for bionic prosthetics, but that is market context, not proof that BrainCo has won those accounts. The resulting segmentation is strategically broad but commercially difficult to underwrite because the payer, buyer, user, and deployment decision-maker differ by product.
    claimRefs: [CU001, CU002, CU003, CU004, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest adoption evidence is historical and bounded. Tech in Asia reported that BrainCo said its Focus headbands had been used in school trials, that it had not sold them to a public school at that time, and that it was working with schools in Mexico, Spain, Brazil, and the United States; the same report described a claimed two-year manufacturing contract and targeted shipments of 600,000 units, without customer detail.       A separate account of the Xiaoshun Central Primary School described use beginning after an alumnus donated units; officials later ordered the school to stop using the headgear after privacy backlash. BrainFutures describes Focus EDU's workflow as headbands feeding EEG-derived attention states to teacher software and reports no available research on its page. The Apple listing gives FocusCalm a consumer distribution and subscription surface, but its 3.9/5 score from 54 ratings is a small public sample and does not establish paid retention. These sources support customer exposure and experimentation, not durable commercial scale.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU016]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-and-concentration
    title: Retention, expansion, and concentration risk
    body: >-
      Public evidence does not disclose BrainCo's net revenue retention, gross retention, churn, renewal rates, contract lengths, cohort behavior, active-account count, or product-level revenue mix. The consumer app lists measurable in-product scores and a subscription price, but the listing does not provide subscriber counts or renewal performance. The education evidence is concentrated in pilots and one highly visible school controversy; the historical report also says the company did not provide customer details for its shipment target. This creates two separate concentration questions: whether institutional education deployments depend on a small number of schools or donors, and whether the business relies on a narrow set of consumer hardware-plus-subscription buyers. The prosthetics opportunity has a different procurement and reimbursement chain, with high cost, limited insurance coverage, and specialized fitting identified as category constraints. Expansion therefore cannot be assumed across BrainCo's product families. The practical diligence priority is product-by-product cohort and contract data, with named deployments verified as production rather than pilot.
    claimRefs: [CU010, CU011, CU012, CU013]
callouts:
  - calloutType: strength
    title: Multiple customer motions are visible
    body: BrainCo has customer-facing surfaces spanning consumer wellness, school-based education, and assistive devices, which broadens the addressable buyer set but also increases the burden of proving repeatable go-to-market execution.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Adoption quality remains unproven
    body: Historical pilots, a donated school deployment, and an app listing show access to users, but public sources do not establish current paid production deployments, retention, or concentration-adjusted revenue.
    claimRefs: [CU006, CU008, CU010, CU011]
