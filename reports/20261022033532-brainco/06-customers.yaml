    notes: >-
      Dates and denominators are preserved as reported. The historical shipment figure is a target, not a verified delivery count; the App Store rating is a small review sample; and the 21% result is presented by the app listing without the study methods needed to validate it.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU016]
