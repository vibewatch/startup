    columns: [Customer or deployment, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Xiaoshun Central Primary School", "Education", "FocusEDU headbands and classroom engagement feedback", "Pilot / donated deployment", "School officials said class efficiency and concentration improved; teachers saw class-average feedback", "Officials ordered use to stop after privacy backlash; student-level consent and durable continuation remain unclear"]
      - ["Unnamed Chinese school", "Education", "Focus 1 headbands for classroom focus monitoring and training", "Trial", "Tech in Asia reported a trial involving schoolchildren and described BrainCo's response", "Customer identity, contract terms, measured learning outcomes, and current status are undisclosed"]
