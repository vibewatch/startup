    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU016]
figures:
  - id: FU001
    title: Customer journey from trial to durable expansion
    type: journey-map
    summary: Public evidence is strongest at product exposure and pilot use, while paid production, renewal, and cross-product expansion remain diligence steps.
    data:
      items:
        - label: Discover
          title: Product exposure
          detail: BrainCo markets FocusCalm to individuals, athletes, and stressed employees and presents education and bionic products.
          touchpoints: [Consumer app listing, official product surface, category awareness]
        - label: Trial
          title: Bounded pilots
          detail: Historical school trials and a donated school deployment show classroom experimentation.
          touchpoints: [School pilots, FocusEDU sessions, teacher feedback]
        - label: Deploy
          title: Workflow integration
          detail: Education workflows place headbands and software in classrooms; consumer users pair the app with optional hardware.
          touchpoints: [Class-average feedback, 15-minute exercises, EEG headband]
        - label: Pay
          title: Commercial conversion
          detail: FocusCalm lists monthly and annual subscriptions; institutional pricing and prosthetics procurement terms are not disclosed.
          touchpoints: [$9.99 monthly plan, $69.99 annual plan, undisclosed institutional terms]
        - label: Retain
          title: Repeat usage
          detail: Public sources do not disclose active users, renewal, churn, or cohort retention.
          touchpoints: [In-app progress metrics, no public renewal denominator]
        - label: Expand
          title: Cross-product or account growth
          detail: Expansion from wellness to education or prosthetics is strategically possible but not evidenced by named account data.
          touchpoints: [Different buyers and payers, no disclosed cross-sell evidence]
    approximationNotes: >-
      The journey is an evidence map, not a measured conversion funnel; stages are ordered by customer process and do not imply conversion rates.
    claimRefs: [CU001, CU005, CU006, CU010, CU011, CU012]
