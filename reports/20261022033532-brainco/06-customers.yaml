  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Product-level active users, paid subscribers, gross retention, net retention, churn, renewal, and cohort data split across FocusCalm, education, and prosthetics.
      whyItMatters: Without retention and cohort denominators, public pilots and app ratings cannot distinguish durable customer value from trial activity.
      diligencePath: Request monthly cohort tables, subscription and renewal exports, contract registers, churn bridge, and product-level revenue reconciliation for the last 24 months.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A current, customer-approved list of named deployments identifying production versus pilot status, buyer, payer, geography, contract value, and measured outcome.
      whyItMatters: Historical sources name few customers and mix donated equipment, pilots, and marketing claims, preventing concentration and reference-quality analysis.
