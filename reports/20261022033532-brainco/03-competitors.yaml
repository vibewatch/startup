      diligencePath: "Request current price books, customer contracts, channel terms, renewal data, and maintenance or consumables schedules by product line."
      relatedQuestionRefs: [QP004, QP008]
    - type: missing-source
      severity: material
      topic: switching-costs
      missingEvidence: "Customer-level evidence on implementation time, data portability, integration depth, multi-homing, and renewal behavior."
      whyItMatters: "The durability of BrainCo's moat depends on workflow and distribution lock-in rather than a category label."
      diligencePath: "Interview customers and channel partners; collect deployment timelines, churn, renewal, API usage, and replacement-product records."
      relatedQuestionRefs: [QP005, QP008]
    - type: conflicting-data
      severity: material
      topic: regulatory-posture
      missingEvidence: "Product-by-product regulatory classification and market-access evidence for education, wellness, and prosthetics offerings."
      whyItMatters: "Different intended uses can change buyer eligibility, claims, reimbursement, and the set of credible competitors."
      diligencePath: "Obtain product claims matrices, registrations or clearances, jurisdictional counsel memoranda, and post-market or safety records."
      relatedQuestionRefs: [QP006, QP008]
