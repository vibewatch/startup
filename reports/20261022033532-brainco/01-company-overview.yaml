artifact: company-overview
slug: brainco
runDate: 2026-10-22
company:
  name: BrainCo
chapter:
  number: 1
  title: Company Overview
  summary: >-
    BrainCo is a 2015-founded neurotechnology company led by founder and CEO
    Bicheng Han, with a product portfolio spanning non-invasive EEG systems and
    bionic prosthetics. Public sources indicate late-stage financing and
    pre-IPO activity, but current valuation, revenue, customer count, board
    composition, and consistently scoped headcount remain unverified.
sections:
  - id: identity-and-operating-footprint
    title: Identity, footprint, and business model
    body: >-
      BrainCo was founded in 2015 by Bicheng Han, who remains its publicly
      identified chief executive. The retained sources describe a cross-border
      operating footprint: Hangzhou is identified as headquarters, Somerville
      remains a U.S. office or registered location, and a Hong Kong
      Asia-Pacific headquarters was reported in 2025. Its commercial identity
      is broader than a single device. Public descriptions span non-invasive
      EEG headbands and software for education, attention, relaxation, and
      sleep, plus neuro-controlled prosthetic products. That breadth gives
      BrainCo exposure to both consumer or institutional neurotechnology and
      medical-device economics, but it also makes one blended market-size or
      revenue multiple analytically misleading. The company remains private;
      public reporting of a confidential Hong Kong IPO filing indicates a
      pre-IPO posture rather than completed public-company status.
    claimRefs: [CO001, CO002, CO003, CO004, CO015]
    tableRefs: [TO001]
  - id: financing-and-scale
    title: Financing, stage, and observable scale
    body: >-
      Financing evidence is substantial but not equivalent to cash available.
      Wikipedia's cited chronology reports an approximately CNY 2 billion
      (US$280 million) January 2026 round co-led by IDG Capital, while Tracxn
      reports US$292 million of total funding across three rounds and labels
      BrainCo Series B. These figures have different definitions and should not
      be summed. Tracxn also reports 113 employees as of September 2026, while
      its legal-entity panel shows 37 employees for Brainco Inc. as of December
      2024; the dates and organizational scopes differ, so neither proves a
      consolidated current headcount. No retained source establishes audited
      revenue, ARR, customer count, gross margin, cash balance, or a confirmed
      current valuation. A reported 2025 financing discussion above US$1.3
      billion is historical deal-talk context, not a present valuation mark.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder continuity is clear; governance depth is not. Bicheng Han is the
      only consistently named current executive across the retained company
      profiles. The historical record also names James Edward Ryan as an
      adviser in 2017, but it does not establish that he holds a current role.
      No allocated source provides a current board roster, committee structure,
      voting-control map, complete cap table, or the legal relationship among
      the U.S., Hangzhou, and Hong Kong operations. This creates material
      key-person and oversight uncertainty even though the investor list
      indicates institutional backing. Diligence should therefore distinguish
      the public founder narrative from actual decision rights, reserved
      matters, information rights, and cross-border data or intellectual
      property governance.
    claimRefs: [CO001, CO002, CO003, CO006, CO010]
    tableRefs: [TO002]
  - id: milestones-and-adverse-signals
    title: Milestones and adverse signals
    body: >-
      BrainCo's chronology shows repeated product expansion: early Focus
      headbands, a 2020 BrainRobotics prosthetic-hand launch, later wellness and
      sleep products, and a claimed brain-to-robot platform in 2026. The same
      history contains an important trust warning. A Chinese school stopped a
      FocusEDU trial after public privacy backlash, and VICE reported concerns
      from students and parents about attention monitoring. BrainFutures
      described the product's classroom monitoring mechanics but listed no
      available research, limiting the strength of public efficacy evidence.
      These events do not prove that current products have the same controls or
      risk profile, but they make consent, neural-data handling, product-level
      validation, and school deployment governance mandatory diligence areas.
      Market estimates also vary widely by definition, reinforcing that broad
      category growth cannot substitute for BrainCo-specific commercial proof.
    claimRefs: [CO004, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
