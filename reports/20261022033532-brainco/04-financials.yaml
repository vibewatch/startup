      edges:
        - from: product-lines
          to: customer-activity
        - from: customer-activity
          to: monetization
        - from: monetization
          to: gross-profit
        - from: gross-profit
          to: cash
        - from: cash
          to: diligence
    approximationNotes: "This is an evidence-backed operating bridge, not a quantified forecast; the final two stages are explicitly unavailable in public evidence."
    claimRefs: [CI001, CI002, CI006, CI009, CI015]
