company:
  name: BrainCo
chapter:
  number: 4
  title: Financials
  summary: BrainCo's public materials show a diversified hardware-and-software portfolio and substantial disclosed R&D investment, but they do not disclose product revenue, realized pricing, gross margin, cash, burn, or runway. The latest reported financing scale may support continued manufacturing and commercialization, while reimbursement, affordability, privacy, and governance evidence remain material underwriting constraints.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: BrainCo appears to monetize several distinct product lines rather than one uniform recurring-revenue model. Public descriptions cover EEG headbands and software for attention, relaxation, training, and education; rehabilitation and assistive devices such as myoelectric prosthetics; and consumer sleep and relaxation products. The available evidence establishes mechanisms and use cases, not recognized revenue. Focus EDU is described as a headband-plus-software platform sold into education, with classroom monitoring, reporting, and neurofeedback exercises, while FocusCalm uses a device and application to generate meditation scores and training history. The product mix therefore spans institutional deployments, clinical or quasi-clinical rehabilitation, and consumer hardware/software, each with different sales cycles, support burdens, refund exposure, and revenue-recognition questions. Public traction is also uneven - a 2026 profile reports broad deployment language and a large financing round, but does not provide audited segment revenue, active users, bookings, or retention. BrainCo's own privacy notice confirms data processing architecture, not commercial performance. Underwriting should treat the portfolio as evidence of operating breadth, not proof of recurring revenue quality.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: pricing-costs-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: No assigned source supplies a public BrainCo price list, realized average selling price, contract value, discount schedule, customer acquisition cost, payback period, gross margin, service cost, or contribution margin. That absence matters because the economics are likely hardware-intensive - the financing coverage describes industrial partners tied to optics and electronics manufacturing, and BrainCo's public product descriptions span sensors, signal processing, software, fitting, training, and rehabilitation support. Official pricing would still represent list pricing rather than realized revenue or margin, so diligence needs contracts, channel terms, bill of materials, warranty and replacement rates, installation and clinician support costs, and cohort-level retention. The bionic-prosthetics market source identifies high device cost, limited insurance coverage, and limited reimbursement as adoption constraints; these are not BrainCo-specific measurements, but they are relevant external pressure points for the prosthetics line. Likewise, classroom attention products face consent and governance requirements that can lengthen sales cycles and raise implementation costs. The resulting financial view is a set of testable drivers, not a modeled unit-economic conclusion.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: The strongest public capital signal is an independently published estimate that BrainCo raised roughly RMB 2 billion, or approximately $280 million to $286 million, in a recent financing round. The same account says the capital is expected to support research and development, production capacity, and commercial rollout, and describes a hardware-intensive company embedded in domestic supply chains. A separate 2026 institutional profile reports about 2.9 billion yuan invested in R&D to date, but this is a company profile and should not be treated as audited cumulative spend or cash available. Neither source discloses cash on hand, monthly burn, debt, covenants, runway, use-of-funds schedule, or the trigger for a next round. The raise could extend strategic flexibility, but it does not establish capital adequacy because cash may be committed to inventory, manufacturing scale-up, regulatory work, or multiple product lines. External market reports suggest expanding BCI and bionic-prosthetics demand, while also highlighting high cost and reimbursement barriers. Financially, BrainCo merits further research rather than a positive underwriting conclusion until management provides segment revenue, gross margin, liquidity, and financing-obligation evidence.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
    figureRefs: [FI001]
callouts:
  - calloutType: risk
    title: Private-metric opacity is the central financial blocker
    body: Public evidence supports product breadth and financing scale, but not revenue quality, margin path, liquidity, or customer concentration. Treat the financing figure as capital raised, not cash available, and request primary financial statements before underwriting.
    claimRefs: [CI004, CI011, CI012, CI015]
  - calloutType: recommendation
    title: Request a product-level operating bridge
    body: The highest-value diligence package is a product-by-product bridge from units shipped and recognized revenue to gross profit and cash consumption, with pricing, channel discounts, warranty, support, reimbursement, and inventory assumptions shown separately.
    claimRefs: [CI006, CI007, CI009, CI015]
