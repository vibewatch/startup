      - [FocusCalm, null, unknown, "Privacy policy describes processing but not price or subscription", "FocusCalm privacy policy", "Hardware/software split and retention remain open"]
      - [Bionic hand, null, unknown, "No public BrainCo ASP, payer, or reimbursement evidence in pool", "WIC profile", "Affordability and reimbursement may constrain volume"]
      - [Bionic leg, null, unknown, "No public ASP, fitting fee, or service contract evidence", "WIC profile", "Need clinic and after-sale support economics"]
      - [Consumer sleep and relaxation SKUs, null, unknown, "Named but not priced in assigned evidence", "WIC profile", "Cannot distinguish one-time device from recurring software revenue"]
      - [Institutional or channel deployment, null, unknown, "Donation-funded school deployment is not evidence of repeatable commercial pricing", "Vice report", "Separate pilot access from paid demand"]
    notes: "A null price means unavailable in the assigned evidence, not free or zero. Any official list price found later must be separated from realized net revenue."
    claimRefs: [CI002, CI003, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and operating drivers
    columns: [metric, value, confidence, why_it_matters, diligence_ask]
    rows:
      - [Revenue by product line, null, low, "Portfolio breadth can conceal loss-making or subsidized lines", "Monthly management P&L by SKU and geography"]
      - [Gross margin, null, low, "Hardware, fitting, warranty, and support costs may dominate economics", "COGS bridge including bill of materials and service labor"]
      - [CAC and payback, null, low, "Institutional and clinical motions may require long sales cycles", "Cohort CAC, sales cycle, conversion, and payback by channel"]
      - [Retention or renewal, null, low, "Software and training value depends on repeat use and renewals", "12/24-month cohort retention and contract renewal data"]
      - [Inventory turns and working capital, null, low, "Manufacturing scale can consume cash before revenue recognition", "Inventory aging, purchase commitments, and cash conversion cycle"]
      - [Warranty and replacement rate, null, low, "Wearable and prosthetic hardware creates after-sale obligations", "Claims history, reserve policy, and replacement economics"]
      - [Recent financing, "Roughly RMB 2 billion / $280m-$286m reported", medium, "May fund R&D, production, and rollout but is not cash-on-hand proof", "Term sheet, closing date, proceeds, investor rights, and remaining cash"]
      - [Cumulative R&D investment, "About 2.9 billion yuan reported", medium, "Signals sustained investment; not audited spend or available liquidity", "Audited R&D expense, capitalization, grants, and allocation by product"]
      - [Cash balance, null, low, "Cannot calculate runway or solvency", "Latest balance sheet and restricted-cash schedule"]
      - [Burn rate, null, low, "Cannot test financing dependency", "24-month monthly cash-flow bridge and forecast"]
      - [Debt and project obligations, null, low, "Debt service and purchase commitments could reduce runway", "Debt agreements, covenants, leases, and supplier commitments"]
      - [Market demand context, "BCI and bionic-prosthetics market reports forecast growth but cite affordability and reimbursement constraints", medium, "Supports opportunity context, not BrainCo revenue forecast", "Validate serviceable demand, payer coverage, and realized customer willingness to pay"]
    notes: "Null values are unavailable in the assigned public evidence, while reported financing and R&D figures are not audited liquidity measures. Each null has a specific diligence request; no estimate is substituted."
    claimRefs: [CI006, CI007, CI009, CI010, CI015]
