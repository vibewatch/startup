  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: SKU-level validation, field-failure, return, uptime, battery, calibration, and maintenance data for BrainCo products.
      whyItMatters: Product breadth does not demonstrate repeatable performance or economically supportable service delivery across prosthetics, education, and consumer devices.
      diligencePath: Request product validation dossiers, post-market surveillance, warranty and return cohorts, service tickets, uptime definitions, and current production volumes by SKU.
      relatedQuestionRefs: [QE005, QE007, QE008]
    - type: private-evidence-only
      severity: material
      topic: security-and-privacy
      missingEvidence: Publicly reviewable privacy, cybersecurity, data-retention, consent, access-control, and algorithm-governance documentation.
      whyItMatters: Neurotechnology products process sensitive biosignal data and the classroom episode shows that deployment legitimacy can fail even where consent is asserted.
      diligencePath: Obtain data-flow diagrams, retention schedules, security assessments, incident history, consent UX, model validation, and regulatory quality-system records by product.
      relatedQuestionRefs: [QE006, QE007, QE008]
    - type: missing-source
      severity: minor
      topic: roadmap
      missingEvidence: A dated public roadmap with shipped-versus-planned features, integration support, and regulatory milestones by product line.
      whyItMatters: Current product descriptions do not show whether the portfolio is converging on a repeatable platform or remaining a collection of optionality.
      diligencePath: Request the current product roadmap, release notes, SKU retirement history, integration compatibility matrix, and milestone ownership.
      relatedQuestionRefs: [QE007, QE008]
