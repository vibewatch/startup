company:
  name: BrainCo
chapter:
  number: 5
  title: Product & Technology
  summary: BrainCo's public product evidence shows a multi-line non-invasive BCI portfolio spanning myoelectric/EEG-enabled prosthetics and classroom EEG tools. The evidence is strongest for product descriptions, selected design specifications, and one documented classroom deployment; public proof remains thin on reliability, security, privacy controls, production scale, and roadmap execution.
sections:
  - id: product-portfolio
    title: Product portfolio and customer workflow
    body: >-
      BrainCo is described as a non-invasive brain-computer-interface company serving consumer,
      educational, and medical applications. The clearest public product surfaces are the
      BrainRobotics intelligent bionic hand and FocusEDU classroom headbands. Inside BCI describes
      the prosthetic as using EMG and EEG signals for dexterous motor control, while BrainFutures
      describes Focus EDU as an EEG headband and software platform that reports classroom and
      individual attention states. These sources establish product categories and intended users,
      not revenue, adoption, or clinical effectiveness. The product map therefore separates
      delivered or publicly described capabilities from unverified scale and outcome claims.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      The available evidence supports a high-level operating model rather than a disclosed
      technical architecture. For prosthetics, the observable chain is biosignal capture,
      signal interpretation, actuation and user-facing hand control; for FocusEDU, it is EEG
      collection, software interpretation, teacher-facing feedback, and optional neurofeedback
      exercises. The Robot Report says Revo 2 includes a 3D tactile sensing system and a software
      development kit supporting EtherCAT and wide-voltage features, while the iF Design entry
      attributes the product to Zhejiang Qiangnao Technology and describes self-developed
      micro-actuation and optimized joint transmissions. These are product-level disclosures,
      not a complete bill of materials, model architecture, validation protocol, or service-level
      design. Deployment dependencies, calibration, battery, connectivity, data retention, and
      integration interfaces remain diligence items.
    claimRefs: [CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment
    title: Maturity, deployment, and differentiation
    body: >-
      Public evidence indicates that BrainCo has moved beyond a laboratory-only posture: the
      portfolio includes mass-produced products in a 2026 industry report, a 2022 FDA 510(k)
      clearance is reported for the BrainRobotics hand, and a 2025 Revo 2 design entry provides
      a named launch year and target regions. A Robot Report case describes a user deploying the
      intelligent hand in climbing and piano-related activities, but the article attributes
      performance and outcome details partly to company material and one user story. The
      classroom product has stronger evidence of actual use than of durable educational impact:
      reporting on a Jinhua school says the school used the headgear, while officials later
      ordered the practice stopped after privacy backlash. Differentiation is therefore plausible
      at the product-feature level, but comparative efficacy, repeatability, reimbursement,
      installation burden, and broad production maturity are not publicly demonstrated here.
    claimRefs: [CE008, CE009, CE010, CE011]
  - id: trust-risks-and-gaps
    title: Trust, safety, and technical diligence
    body: >-
      The main product risk is not that BrainCo lacks a product concept; it is that public
      evidence does not yet close the controls needed for sensitive neurotechnology. The
      FocusEDU episode documents concern about student privacy and discomfort, even though the
      company and school described parental consent and classroom-level visibility. The sources
      do not establish data minimization, retention, access controls, security testing, model
      bias monitoring, adverse-event rates, or post-market surveillance for either education or
      prosthetics. Cost and specialized fitting or maintenance are also recognized constraints
      in the bionic-prosthetics market evidence. A diligence process should request product
      validation reports, cybersecurity and privacy documentation, regulatory files by SKU,
      field-failure and return data, service workflows, and evidence separating pilot use from
      recurring production deployment.
    claimRefs: [CE012, CE013, CE014]
callouts:
  - calloutType: strength
    title: Product breadth with tangible hardware
    body: BrainCo has public evidence of shipped or publicly presented hardware in both prosthetics and EEG education, rather than only a research-stage interface concept.
    claimRefs: [CE001, CE003, CE008]
  - calloutType: risk
    title: Sensitive-data controls remain unverified
    body: The classroom deployment controversy makes privacy, consent, retention, and governance a product-readiness issue, not merely a marketing or policy question.
    claimRefs: [CE012, CE013]
  - calloutType: recommendation
    title: Underwrite by SKU and deployment evidence
    body: Request SKU-level regulatory, reliability, security, service, and production data before treating the portfolio as a mature platform.
    claimRefs: [CE010, CE014]
