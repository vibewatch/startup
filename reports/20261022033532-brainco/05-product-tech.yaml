  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Control a prosthetic hand", "User operates an upper-limb prosthesis through biosignal input", "BrainRobotics hand interprets EMG/EEG signals for motor control", "Dexterous control is described; one user story reports climbing and piano-related use", "Single-user narrative and company-linked claims do not establish population-level outcomes"]
      - ["Monitor classroom engagement", "Teacher receives attention-state feedback during lessons", "FocusEDU collects EEG data and displays classroom or individual attention states", "Feedback may inform teaching adjustments", "Privacy backlash, discomfort, and lack of controlled efficacy evidence"]
      - ["Train attention before learning", "Student completes exercises before or around a lesson", "Neurofeedback games and visualization exercises are described", "Concentration training is the stated intended benefit", "No public denominator, validated effect size, or durability data in the assigned evidence"]
      - ["Integrate dexterous hand into custom applications", "Developer or integrator connects a hand to an external control environment", "Revo 2 SDK is reported to support EtherCAT and wide-voltage features", "May reduce custom-scenario development friction", "No public API documentation, compatibility matrix, or support SLA reviewed"]
    notes: Evidence describes intended workflows and selected reported use; measurable benefits are not uniformly independently validated.
    claimRefs: [CE002, CE004, CE005, CE006, CE007, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Biosignal capture, "Collect EMG/EEG inputs from a user", "Sensors, fit, signal quality, calibration", "Noise, variability, comfort, and data governance"]
      - [Signal interpretation, "Translate biosignals into attention states or control commands", "Algorithms, training data, validation and latency", "False positives, generalization, explainability and safety"]
      - [Actuation and tactile sensing, "Execute hand movement and provide object interaction signals", "Micro-actuation, transmission, sensors, power", "Mechanical failure, battery limits, calibration and maintenance"]
      - [Software and integration, "Present feedback or connect device to external systems", "Teacher dashboard, SDK, EtherCAT/wide-voltage interfaces", "Cybersecurity, interoperability, versioning and support"]
      - [Deployment and service, "Fit, train, monitor, and maintain products", "Clinicians, schools, installers, partners and reimbursement", "Specialized expertise, cost, procurement and post-market monitoring"]
    notes: This is an evidence-bounded operating model synthesized from disclosed product functions; BrainCo has not publicly disclosed a complete architecture or control stack in the assigned sources.
    claimRefs: [CE002, CE004, CE005, CE006, CE007, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Publicly evidenced product layers from biosignal capture through device or classroom output.
    data:
      layers:
        - label: User and context
          detail: Amputee or robotics operator; student and teacher
        - label: Signal capture
          detail: EMG and EEG inputs; classroom EEG headband
        - label: Interpretation
          detail: Motor-control interpretation; attention-state reporting and neurofeedback
        - label: Output and integration
          detail: Bionic-hand actuation and tactile sensing; teacher dashboard and reported SDK integration
        - label: Deployment and service
          detail: Fitting, maintenance and reimbursement; school procurement and support
        - label: Governance
          detail: Consent, privacy, retention, security, and quality controls
    approximationNotes: The layers are an evidence-bounded analytical model, not a disclosed BrainCo system diagram; governance and deployment layers are diligence requirements.
    claimRefs: [CE002, CE004, CE005, CE006, CE012, CE014]
