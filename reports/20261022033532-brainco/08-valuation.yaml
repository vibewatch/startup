company:
  name: BrainCo
chapter:
  number: 8
  title: Valuation
  summary: BrainCo has credible technical and product optionality across non-invasive BCI, neurofeedback, robotics, and prosthetics, but public evidence does not disclose the company-specific revenue, margin, retention, cap-table, or current price inputs needed for a defensible valuation. The appropriate public-evidence stance is research-more, with entry discipline tied to verified commercialization and financing terms.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that BrainCo has assembled a differentiated platform rather than a single
      application. BrainCo's technology page describes an EEG headband paired with haptic feedback and
      reports two AttentivU studies involving 48 adults, while independent trade coverage describes a
      2026 demonstration that decoded neural intent into robot commands in under 200 milliseconds.
      The same coverage says BrainCo has three robotic products, including a dexterous hand and two
      prosthetic products. This breadth can create multiple commercialization paths, but it also makes
      the investment case dependent on evidence that the businesses share technology, distribution,
      regulatory work, and economics rather than merely sharing a narrative. The anti-thesis is that
      public evidence is mostly product description, demonstrations, and market-level forecasts: it
      does not establish company revenue, gross margin, recurring revenue, retention, customer
      concentration, or cash runway. The 2018 education reference also records that no research was
      available on the Focus EDU page, limiting public proof of outcomes. Until those gaps are closed,
      platform breadth should be treated as an option set, not as a basis for a premium multiple.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: valuation-context
    title: Market and financing context
    body: >-
      Market references indicate that BCI and bionic-prosthetics categories are expanding, but they
      are not company valuation comparables. Precedence Research estimates the global BCI market at
      USD 3.33 billion in 2026 and USD 13.86 billion in 2035, with a 16.77% CAGR; Coherent Market
      Insights estimates the bionic-prosthetics market at USD 1.96 billion in 2026 and USD 3.70 billion
      in 2033, with a 9.5% CAGR. These are directional TAM signals, not BrainCo revenue or serviceable
      obtainable market. A separate MedTech Dive report says competitor Synchron raised USD 200 million
      in a Series D to support pivotal trials and commercial launch, illustrating that clinical BCI
      commercialization can be capital intensive. BrainCo's own public materials do not provide a
      current financing round, valuation, liquidation preference, debt balance, or dilution schedule
      in the assigned evidence. Consequently, no defensible company-specific price-to-revenue,
      venture-capital, or precedent-round multiple can be calculated from the retained sources.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: scenarios-and-decision
    title: Scenarios, recommendation, and diligence
    body: >-
      The scenario framework should be milestone-based rather than a fabricated numerical valuation.
      In the bull case, BrainCo converts its technical demonstrations and product breadth into
      repeatable, regulated or reimbursed revenue with disclosed retention and margin evidence. In
      the base case, one or more products gain commercial traction but the portfolio remains
      capital-intensive and private-market price discovery remains opaque. In the bear case, privacy
      or regulatory friction, high device costs, weak reimbursement, or insufficient customer proof
      prevent scale and force a down round or extended financing cycle. Public reporting that a Chinese
      school was ordered to stop requiring FocusEDU headgear after privacy backlash demonstrates a
      commercialization and trust risk; it is not evidence of a company-wide failure, but it is
      material to adoption assumptions in education. Entry should remain conditional on current
      financing terms, product-level revenue and gross margin, customer cohorts, regulatory status,
      cash runway, and cap-table preferences. A thesis break would be a financing that materially
      reprices the company without operating improvement, a product-specific regulatory block, or
      evidence that pilots do not convert into paid and retained deployments.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: []
    figureRefs: []
