  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Platform optionality, "EEG engagement studies and a robot-control demonstration show multiple technical applications.", "Product-level revenue, paid deployment counts, and shared-platform economics."]
      - [Market tailwind, "Third-party forecasts project growth in BCI and bionic prosthetics.", "BrainCo segment revenue growth and serviceable market conversion."]
      - [Commercialization risk, "Education deployment faced privacy backlash and an official stop order.", "Independent evidence of compliant deployments, consent controls, and renewal rates."]
      - [Financing opacity, "Retained sources do not disclose BrainCo's current round, valuation, or preferences.", "Signed term sheet, cap table, liquidation preferences, debt, and cash runway."]
    notes: "Market forecasts are category context and are not BrainCo operating results or valuation comparables."
    claimRefs: [CV001, CV006, CV007, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Evidence-based assumptions, Valuation / return logic, Trigger]
    rows:
      - [Bull, "Repeatable paid adoption across at least one product line; regulatory and privacy controls verified; margins and retention disclosed.", "Premium only if verified growth and unit economics support a comparable multiple.", "Audited or diligence-verified cohort, margin, and financing data."]
      - [Base, "Technical breadth converts unevenly; one or more products progress while capital needs remain high.", "Research-more until price is anchored to segment economics and dilution terms.", "Current round terms, cash runway, and product-level revenue."]
      - [Bear, "Privacy or regulatory friction, high cost, weak reimbursement, or low pilot conversion blocks scale.", "Avoid or require a substantial price reset and downside protection.", "Regulatory block, down round, missed financing, or failed paid conversion."]
      - [Unresolved, "Company-specific valuation, revenue, retention, and cap-table evidence remains unavailable publicly.", "No numerical valuation range should be asserted.", "Independent diligence closes the named data gaps."]
    notes: "Scenarios are qualitative because the assigned evidence does not support a company-specific valuation range or return calculation."
    claimRefs: [CV009, CV010, CV011, CV013, CV014]
