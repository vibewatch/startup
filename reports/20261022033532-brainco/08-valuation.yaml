callouts:
  - calloutType: recommendation
    title: Keep entry conditional
    body: "BrainCo's public evidence supports continued diligence, not a buy recommendation: the company-specific price and operating denominator needed for valuation are not disclosed in the retained sources."
    claimRefs: [CV009, CV014]
  - calloutType: risk
    title: Treat adoption friction as valuation-relevant
    body: "The FocusEDU school controversy shows that privacy and consent can affect adoption, particularly where products measure attention or brain signals in classrooms."
    claimRefs: [CV011, CV012]
