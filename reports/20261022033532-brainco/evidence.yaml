evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board and committee roster, cap table, voting rights, reserved matters, related-party register, and
      entity-level ownership map.
    whyItMatters: >-
      Founder dependence and cross-border operations cannot be assessed without knowing actual control, oversight, and
      conflict-management rights.
    diligencePath: >-
      Obtain the latest cap table, constitutional documents, board minutes, committee charters, investor-rights
      agreements, and organization chart, then reconcile them with legal-entity registries.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Audited revenue, ARR where applicable, segment gross margin, customer counts with definitions, retention, cash
      balance, debt, and consistently scoped current headcount.
    whyItMatters: >-
      Funding raised and category growth cannot establish commercial quality, runway, customer adoption, or operating
      leverage.
    diligencePath: >-
      Request audited financial statements, bank and debt schedules, product-level revenue cohorts, customer contracts,
      CRM exports, payroll rosters, and a reconciliation from legal entities to consolidated totals.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      A current transaction document or cap-table record establishing post-money valuation, security type, preferences,
      and fully diluted share count.
    whyItMatters: >-
      A reported 2025 financing discussion above US$1.3 billion does not establish BrainCo's present valuation or
      investor economics.
    diligencePath: >-
      Review the January and September 2026 financing documents, latest 409A-equivalent or board valuation materials,
      and any Hong Kong listing filing with the fully diluted capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: product-validation
    missingEvidence: >-
      Product-level clinical or educational validation, regulatory status, consent controls, neural-data retention
      policy, and current deployment outcomes for FocusEDU and prosthetic products.
    whyItMatters: >-
      Historical privacy controversy and a source explicitly listing no available Focus EDU research limit confidence in
      efficacy and safe institutional deployment.
    diligencePath: >-
      Obtain protocols, ethics approvals, regulatory correspondence, peer-reviewed results, data-protection impact
      assessments, consent records, and customer outcome datasets for each product.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      BrainCo segment revenue, pricing, eligible account counts, win rates, deployment capacity and retention by
      geography.
    whyItMatters: >-
      External category estimates cannot establish BrainCo's serviceable or obtainable revenue without company-specific
      commercial inputs.
    diligencePath: >-
      Build a bottom-up model from contract-level revenue, named target accounts, product pricing, observed conversion
      and deployment constraints.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: Product-by-product regulatory and payer status across target countries.
    whyItMatters: Clinical adoption depends on clearance and payment pathways that broad market reports do not isolate for BrainCo.
    diligencePath: >-
      Review regulatory dossiers, coverage decisions, billing codes, paid claims and fitment records for each marketed
      clinical product.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
  - type: conflicting-data
    severity: material
    topic: data-governance
    missingEvidence: Independent technical evidence resolving neural-data storage, deletion, transfer and consent practices.
    whyItMatters: Institutional buyers may delay or reject adoption if privacy and cross-border data controls are unclear.
    diligencePath: >-
      Audit system architecture, deletion logs, consent records, data-processing agreements and customer security
      reviews.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: missing-source
    severity: material
    topic: education-evidence
    missingEvidence: Independent controlled evidence linking Focus EDU use to durable learning or attention outcomes.
    whyItMatters: A monitoring workflow and anecdotal engagement do not establish educational efficacy or repeat-purchase value.
    diligencePath: Request preregistered studies, school renewal data, consent records and outcome analyses with control groups.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable BrainCo, Emotiv, Muse, and prosthetics realized pricing, contract terms, discounts, and service costs.
    whyItMatters: >-
      Without realized economics, product breadth cannot be translated into pricing power, gross margin, or share
      potential.
    diligencePath: >-
      Request current price books, customer contracts, channel terms, renewal data, and maintenance or consumables
      schedules by product line.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level evidence on implementation time, data portability, integration depth, multi-homing, and renewal
      behavior.
    whyItMatters: The durability of BrainCo's moat depends on workflow and distribution lock-in rather than a category label.
    diligencePath: >-
      Interview customers and channel partners; collect deployment timelines, churn, renewal, API usage, and
      replacement-product records.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: conflicting-data
    severity: material
    topic: regulatory-posture
    missingEvidence: >-
      Product-by-product regulatory classification and market-access evidence for education, wellness, and prosthetics
      offerings.
    whyItMatters: Different intended uses can change buyer eligibility, claims, reimbursement, and the set of credible competitors.
    diligencePath: >-
      Obtain product claims matrices, registrations or clearances, jurisdictional counsel memoranda, and post-market or
      safety records.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: access-blocked
    severity: minor
    topic: competitor-pricing
    missingEvidence: Public or customer-verified prices for Emotiv Insight and competing research/developer platforms.
    whyItMatters: A single consumer list price is insufficient for enterprise or research pricing comparison.
    diligencePath: Request quotes from vendors using matched hardware, software, support, and data-access requirements.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: blocking
    topic: financial-statements
    missingEvidence: Audited or management financial statements with product-level revenue, gross margin, cash, burn, and debt.
    whyItMatters: Without these data, revenue quality, liquidity, and financing dependency cannot be underwritten.
    diligencePath: >-
