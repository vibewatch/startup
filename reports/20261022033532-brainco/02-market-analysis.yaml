callouts:
  - calloutType: insight
    title: "A market range is more defensible than a point TAM"
    body: "The two published 2026 BCI estimates differ by about 2.38 times, so valuation should rely on a bottom-up BrainCo segment model rather than a single category forecast."
    claimRefs: [CM003, CM004, CM005]
  - calloutType: risk
    title: "Trust and reimbursement can dominate technical demand"
    body: "Signal quality, cost, reimbursement, education backlash and unresolved neural-data handling can slow adoption even if the underlying categories expand."
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]

