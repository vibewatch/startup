  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Enterprise Spend Inclusions, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs operates at the structural boundary where frontier artificial intelligence models converge
              with physical-science materials research and development. The addressable market is bounded by enterprise
              spend dedicated to closing the loop between AI-generated hypotheses and automated physical synthesis.
              Included enterprise expenditure spans advanced materials discovery, closed-loop robotic synthesis
              infrastructure, computational physics simulation, and custom diagnostic agents deployed into specialized
              industrial workflows. Conversely, the market definition explicitly excludes commodity laboratory
              information management systems (LIMS), traditional wet-lab reagent procurement, generic manual test
              benches, and broad consumer enterprise software licenses. Status-quo substitutes comprise manual
              trial-and-error experimental chemistry conducted by specialized scientific staff, external contract
              research organizations (CROs), and purely computational screening pipelines such as Google DeepMind's
              GNoME or Microsoft's MatterGen that predict crystal structures but rely on disconnected third-party
              laboratories for physical validation. By directly integrating robotic experimentation with generative
              models, Periodic Labs targets the severe data bottleneck created by finite internet text and unrecorded
              negative physical results.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Addressable Market Sizing via Multi-Lens TAM, SAM, and Constrained SOM
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial potential of Periodic Labs requires disciplined, multi-layered sizing lenses
              rather than unconstrained top-line market assertions. Under a top-down enterprise R&D lens, total global
              corporate and institutional expenditure across physical sciences, specialty materials, chemicals, and
              electronics reaches approximately $180 billion annually, with targeted discovery, formulation, and
              characterization representing an addressable total addressable market (TAM) of $45 billion. A narrower
              technology platform lens isolates computational materials modeling, physics-informed machine learning, and
              high-throughput simulation at $12 billion, flanked by closed-loop robotic laboratory automation equipment
              at $4.5 billion. When constrained to Periodic Labs's initial commercial targets—specifically semiconductor
              packaging thermal dissipation and exploratory superconducting materials synthesis—the serviceable
              addressable market (SAM) narrows to $1.8 billion. Given that Periodic Labs functions as an enterprise
              research partner rather than a self-serve software vendor, its near-term serviceable obtainable market
              (SOM) is realistically constrained to $250 million, bounded by bespoke integration cycles, multi-quarter
              enterprise sales motions, and high physical laboratory deployment overhead.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
