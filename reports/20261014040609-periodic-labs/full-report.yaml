  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Structural sequence showing how enterprise R&D problem formulation progresses through autonomous lab synthesis
      into commercial monetization and margin realization.
    data:
      nodes:
        - id: demand-intake
          label: Industrial R&D Problem Formulation
          description: >-
            Industrial partner presents acute materials constraint such as semiconductor thermal dissipation or
            superconductor design.
        - id: ai-simulation
          label: AI Scientist Candidate Generation
          description: >-
            Foundation models and physical simulations screen millions of theoretical crystal configurations and predict
            properties.
        - id: robotic-synthesis
          label: Autonomous Physical Experimentation
          description: >-
            Robotic laboratories in Gardena and SF execute powder synthesis, physical measurement, and closed-loop data
            generation.
        - id: candidate-validation
          label: Material Verification & IP Creation
          description: >-
            Validating experimental outcome against physical reality yields novel patentable materials data and trained
            custom agents.
        - id: commercial-contract
          label: Enterprise Monetization & Retainers
          description: Partner remits custom engineering retainers, platform licensing fees, and milestone completion payments.
        - id: margin-realization
          label: Gross Margin & Cash Conversion
          description: >-
            Net contribution realized after absorbing lab technician headcount, robotic equipment maintenance, compute,
            and reagent costs.
      edges:
        - from: demand-intake
          to: ai-simulation
        - from: ai-simulation
          to: robotic-synthesis
        - from: robotic-synthesis
          to: candidate-validation
        - from: candidate-validation
          to: commercial-contract
        - from: commercial-contract
          to: margin-realization
    approximationNotes: >-
      Represents qualitative commercial operating architecture based on reported partner workflows; dollar conversion
      percentages and unit margin yields remain private.
    claimRefs:
