  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision chain moves from confirmed capital and differentiated architecture through missing proof and
      valuation support to a track / research-more recommendation.
    data:
      nodes:
        - id: confirmed-capital
          label: $300M seed consistently reported
          detail: Capital raised is not treated as cash currently available.
        - id: platform-architecture
          label: AI + simulation + autonomous labs
          detail: Potential proprietary experimental-data loop.
        - id: commercial-proof
          label: Revenue and customer metrics undisclosed
          detail: No public basis for revenue multiples or unit-economics underwriting.
        - id: outcome-proof
          label: Independent reproducibility still required
          detail: Technical demonstrations do not establish durable industrial deployment.
        - id: valuation-support
          label: $7.5B mark reported, not confirmed
          detail: Terms, dilution, and preference overhang remain unknown.
        - id: recommendation
          label: Track / research more
          detail: Reprice only after financing, commercial, and scientific milestones.
    approximationNotes: This is a qualitative evidence chain; node order does not imply numeric conversion rates or probabilities.
