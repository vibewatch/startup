  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Closed-Loop Operating Model
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs defines its product platform as an autonomous artificial intelligence scientist paired with
              real automated physical laboratories. Unlike conventional digital foundation models trained solely on
              internet-scale text and public code repositories, Periodic Labs operates on the core premise that internet
              text has been exhausted as a viable source for net-new physical discoveries. To overcome this limitation,
              the company builds closed-loop robotic laboratories that directly generate novel empirical data across
              materials science, physics, and chemistry. The operational cycle begins with AI agents formulating
              chemical and structural hypotheses, continues through automated recipe compilation and physical synthesis
              on robotic workcells, and closes with high-throughput characterization that feeds measurement signals back
              into model fine-tuning. This loop explicitly prioritizes the systematic capture of negative experimental
              results, which are almost universally omitted from published scientific literature but provide essential
              gradient signals to prevent models from repeatedly exploring unviable thermodynamic states.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
