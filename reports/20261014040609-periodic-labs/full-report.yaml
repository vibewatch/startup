              - CM008
              - CM009
      - number: '2.4'
        title: Structural Growth Drivers, Adoption Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The expansion of AI-driven materials discovery is propelled by fundamental technological catalysts
              alongside severe operational adoption constraints. The primary macro driver is the exhaustion of public
              internet text for frontier model scaling, establishing physical experimentation as the only remaining
              pathway to generate proprietary, high-signal pretraining data. Simultaneously, commercial urgency is
              heightened by physical scaling limits in computing hardware, where microchip heat dissipation demands
              novel thermal materials, and by the multitrillion-dollar industrial potential of higher-temperature
              superconductors. However, adoption is heavily constrained by extreme capital intensity required to build
              robotic laboratories, long multi-year validation cycles in industrial materials qualification, customer
              sensitivities regarding proprietary experimental IP, and epistemological critiques questioning whether AI
              puzzle-solving within known paradigms can produce genuine scientific breakthroughs. Furthermore, critical
              diligence gaps remain unresolved: Periodic Labs has disclosed no public pricing schedules, customer
              counts, or revenue metrics, precluding independent verification of its unit economics or commercial
              traction.
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Experimental Data Bottleneck in Physical Sciences
            body: >-
              Unlike software and language models where web text provided vast pretraining corpora, materials science
              discovery is severely bottlenecked by scarce, non-standardized physical experimentation and unpublished
              negative results. Autonomous robotic laboratories act as high-signal data generation engines rather than
              mere operational conveniences.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: Commercialization Lag and Long Industrial Adoption Cycles
            body: >-
              While frontier AI credentials and closed-loop synthesis attract substantial venture backing, industrial
              buyers in semiconductors and materials require extensive physical reproducibility and clear intellectual
              property attribution before moving beyond exploratory proof-of-concept engagements.
            calloutType: risk
            claimRefs:
