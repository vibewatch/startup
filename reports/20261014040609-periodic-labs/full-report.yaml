              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing context, thesis, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Financing evidence has two distinct tiers. The $300 million seed is repeated across several independent
              summaries and launch coverage, while the reported follow-on of at least $500 million at $7.5 billion is
              described as in talks or not confirmed closed. Even the earlier valuation basis is inconsistent: one
              source reports roughly $1.3 billion post-money, while another reports up to $1.5 billion pre-money. These
              are not interchangeable denominators and should not be averaged. Cap-table ownership, board rights,
              liquidation preferences, participation, anti-dilution protection, and strategic terms are also
              undisclosed. Entry discipline should therefore be milestone-based: no price acceptance at the reported
              mark without signed closing evidence, a fully diluted capitalization table, preference stack, and
              commercial proof sufficient to distinguish scalable product economics from bespoke research services.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Bull, base, and bear decision bands
        blocks:
          - type: paragraph
            body: >-
              The scenario framework uses reported financing marks as decision bands, not as estimates of intrinsic
              value. The bear case anchors at or below the reported 2025 seed mark if customer proof remains absent, the
              2026 financing does not close, or autonomous-lab results fail reproducibility tests. The base case spans
              above the seed mark but below the reported $7.5 billion level only after credible contracts, retention,
              margins, and validated industrial outcomes emerge. The bull case can justify consideration of the reported
              mark or higher only after the financing is documented and the platform demonstrates repeatable, high-value
              discoveries with scalable economics. No numeric probability is assigned because the public record lacks
              the operating data needed to calibrate one; the table instead identifies observable probability signals
              and downside triggers.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is low: Periodic Labs is private, no IPO filing is reported, and the available sources do
              not disclose the operating metrics normally needed to support a public-market or strategic-acquisition
              case. Scientific upside may be large, but commercialization risk is amplified by capital-intensive
              laboratories, bespoke customer work, and the possibility that useful deployment lags technical
              demonstrations. Governance and knowledge-control questions add another diligence layer when privately
              owned systems generate or mediate scientific results. Before investment, obtain closing documents for
              every round, a fully diluted cap table and preference waterfall, monthly cash use and committed
              infrastructure spend, customer-level contract and retention evidence, reproducibility packages for claimed
              outcomes, and an IP/data-rights schedule. Thesis breaks include a failed financing close, inability to
              reproduce discoveries independently, persistent custom services without improving margins, or material
              customer and data-rights concentration.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              The public record supports continued diligence on the company, but not acceptance of the reported $7.5
              billion mark without primary financing documents and measurable commercial and scientific proof.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV013
              - CV014
          - type: callout
            title: Do not convert disclosure gaps into false precision
            body: >-
              Funding raised is not cash available, a reported valuation is not a closed financing, and missing revenue
              or customer metrics cannot be replaced with a precise fair-value estimate.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
