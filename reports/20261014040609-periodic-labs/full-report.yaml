      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Physical Verification Advantage
            body: >-
              Unlike pure LLM architectures bounded by finite internet text tokens (~10T tokens), Periodic Labs
              leverages autonomous robotic laboratories to generate proprietary physical experimental data. In physics
              and materials science, nature serves as the definitive reinforcement learning verifier, providing high
              signal-to-noise feedback and capturing critical negative results that traditional scientific literature
              omits.
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
          - type: callout
            title: Capital Intensity and Commercial Verification Void
            body: >-
              Securing $300M at seed stage gives Periodic Labs massive runway to build robotic lab infrastructure, but
              also sets unprecedented expectations. With zero disclosed revenue, no named commercial reference
              customers, and media valuation chatter reaching $7.5B, the company faces extreme execution risk in
              bridging the gap between automated laboratory demos and durable industrial revenue.
            calloutType: risk
