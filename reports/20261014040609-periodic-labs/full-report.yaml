  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence today
      - What would change the view
    rows:
      - - Thesis
        - Closed-loop AI, simulation, and robotic labs can generate proprietary experimental data
        - Partner and independent descriptions consistently identify this architecture
        - Reproducible discoveries and customer productivity gains verified by independent parties
      - - Thesis
        - Large seed financing can fund talent, compute, and physical laboratory build-out
        - $300M September 2025 seed is consistently reported
        - Audited use-of-proceeds and milestone delivery within an approved capital plan
      - - Anti-thesis
        - Bespoke scientific services may scale more slowly than a standardized software product
        - Public descriptions emphasize custom agents and customer-specific experimental data
        - Repeatable product revenue, retention, gross margin, and declining deployment effort
      - - Anti-thesis
        - The reported valuation prices substantial success before commercial and scientific proof is public
        - The $7.5B financing remains unconfirmed and operating metrics are undisclosed
        - Closed financing plus independently validated outcomes and durable unit economics
    notes: >-
      The table separates architecture and funding evidence from unverified commercial outcomes; no row implies that
      funding raised equals cash available.
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
  - id: TV003
    title: Bull, base, and bear decision bands
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or thesis-break trigger
    rows:
      - - Bull
        - Closed 2026 financing; repeatable discoveries; scalable customer economics; defensible data and IP rights
        - >-
          Consider the reported $7.5B mark or higher only after milestones are evidenced; not a current fair-value
          estimate
        - Strengthens with primary closing documents, audited growth, retention, margins, and independent replication
        - >-
          Discovery fails replication, customer economics remain bespoke, or financing terms create unacceptable
          preference overhang
      - - Base
        - >-
          Seed capital remains available; limited commercial proof emerges; platform integration works but scaling is
          unproven
        - >-
          Decision band above the reported seed mark but below $7.5B, negotiated against milestones and dilution; no
          point estimate
        - Strengthens with named reference customers, repeat use, improving margins, and documented runway
        - No credible customer cohort, rising capital intensity, or follow-on financing remains unclosed
      - - Bear
        - No verified commercial traction; autonomous outcomes do not generalize; capital needs rise
        - >-
          At or below the reported 2025 seed valuation context, with downside protection; not an intrinsic-value
          calculation
        - Current public gaps make this case impossible to dismiss
        - Failed round, inability to reproduce results, adverse IP/data terms, or persistent services-heavy economics
    notes: >-
      Bands reference reported financing context only. No probabilities or target returns are quantified because
      revenue, margins, cash use, dilution, preferences, and exit timing are not public.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of Periodic Labs from academic foundations to autonomous lab deployment and prospective
      growth rounds.
    data:
      items:
        - date: '2023-11-27'
          label: Academic & Lab Precedents
          detail: >-
            DeepMind publishes GNoME predicting millions of crystal structures, demonstrating computational potential
            for materials discovery.
          tone: neutral
        - date: '2025-01-15'
          label: Periodic Labs Formation
          detail: >-
            Liam Fedus and Ekin Dogus Cubuk incorporate Periodic Labs in San Francisco, uniting OpenAI and DeepMind
            research veterans.
          tone: positive
        - date: '2025-09-30'
          label: Stealth Emergence & $300M Seed
          detail: >-
            Company emerges from stealth announcing a record $300M seed round led by a16z with NVentures, Accel, DST,
            and high-profile tech angels.
          tone: positive
        - date: '2025-10-01'
          label: Scientific Advisory Board Announced
          detail: >-
            Periodic Labs establishes Scientific Advisory Board with prominent chemistry and physics faculty from
            Stanford and Northwestern.
          tone: positive
        - date: '2025-10-15'
          label: Academic Grant Program Launch
          detail: >-
            Launches academic grant initiative to collaborate with external university researchers on automated
            experimentation.
          tone: neutral
        - date: '2025-12-16'
          label: Pilot Industrial Deployment
          detail: >-
            Deploys custom AI agents with an unnamed semiconductor manufacturer to assist engineers with chip heat
            dissipation analysis.
          tone: positive
        - date: '2026-05-15'
          label: Prospective Financing Chatter
          detail: >-
            Market reports and research notes indicate discussions for a ≥$500M financing round at valuations up to
            $7.5B, though unconfirmed by filings.
          tone: warning
        - date: '2026-10-14'
          label: Ongoing Autonomous Lab Scaling
          detail: >-
            Autonomous laboratory operations expand toward closed-loop physical synthesis in superconductors while
            public commercial metrics remain zero.
          tone: neutral
