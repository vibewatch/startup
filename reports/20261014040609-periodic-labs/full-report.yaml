        title: The proposed moat is a proprietary experimental feedback loop
        blocks:
          - type: paragraph
            body: >-
              Periodic's claimed differentiation is vertical integration. Investor and portfolio descriptions say its
              system joins frontier AI models, physics-based simulation, robotic synthesis, characterization, and
              learning from experimental outcomes. That architecture could create proprietary positive and negative
              experimental data that model-only competitors cannot scrape from published literature. The same
