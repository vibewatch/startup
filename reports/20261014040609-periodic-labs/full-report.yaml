        title: Commercial evidence exists, but pricing, switching costs, and proof remain opaque
        blocks:
          - type: paragraph
            body: >-
              A16z reported in September 2025 that Periodic was working with customers in space, defense, and
              semiconductors, including heat-dissipation and simulation-automation work. Because this is an
              investor-issued account rather than independent customer testimony, it establishes a partner-reported
