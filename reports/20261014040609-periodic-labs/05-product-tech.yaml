  - id: TE002
    title: Workflow and Use-Case Comparison Table
    columns:
      - User Job
      - Conventional Workflow
      - Periodic Labs Solution
      - Measurable Target Benefit
      - Known Practical Limitation
    rows:
      - - Novel Superconductor Screening
        - Manual literature review, heuristic synthesis, and low-throughput cryo testing
        - Autonomous conjecture, simulation filtering, and robotic crystal synthesis
        - Orders-of-magnitude faster candidate screening cycle time
        - Physical synthesis kinetics and crystal quality still require physical validation
      - - Semiconductor Heat Dissipation Optimization
        - Ad-hoc thermal modeling and fragmented physical testing by design teams
        - Custom scientific agents interpreting high-dimensional experimental telemetry
        - Rapid iteration and identification of thermal packaging bottlenecks
        - Requires integration with proprietary partner manufacturing and testing data
      - - Negative Experimental Result Utilization
        - Unpublished failed experiments discarded in researcher notebooks
        - Systematic ingestion of failure telemetry to steer model exploration away from dead ends
        - Elimination of duplicative failed trials across research teams
        - Requires standardized automated protocol logging across all physical instruments
      - - Candidate Formulation Filtering
        - Static DFT (Density Functional Theory) simulation runs with long compute queues
        - Coupled foundation model predictions with fast physics-based screening proxies
        - Compression of candidate prioritization from weeks to hours
        - Surrogate models risk compounding systematic simulation approximation errors
    notes: Compares conventional industrial R&D workflows against Periodic Labs autonomous loop based on company disclosures.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
  - id: TE003
    title: Technology and Operating Architecture Table
    columns:
      - Architecture Layer / Process
      - System Role
      - Core Dependencies
      - Technical & Operational Risk
    rows:
      - - Hypothesis & Planning Agent Layer
        - Formulates chemical conjectures, designs experiments, and compiles robotic steps
        - Frontier multimodal foundation models & domain fine-tuning
        - Hallucination of unphysical synthesis steps or thermodynamically unstable phases
      - - Physics Simulation & Verification Layer
        - Pre-screens candidate stability and electronic properties prior to physical execution
        - High-performance compute clusters & materials physics simulation packages
        - Computational cost bottlenecks and simulation fidelity limits in complex systems
      - - Robotic Synthesis Workcell Layer
        - Automated dispensing, solid-state heating, and chemical compounding
        - Laboratory robotics, automated liquid/solid handlers, environmental chambers
        - Hardware jams, precursor contamination, calibration drift, and physical maintenance downtime
      - - Characterization & Telemetry Feedback Layer
        - Measures electrical, thermal, and structural properties and streams data back to models
        - Automated physical sensor suites, data ingestion pipelines, and ML feature extractors
        - Measurement noise, instrument calibration errors, and high data ingestion overhead
    notes: Synthesized architectural breakdown of the software and hardware stack from technical venture profiles.
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
