callouts:
  - calloutType: strength
    title: Closed-Loop Experimental Moat and Negative Data Capture
    body: >-
      Periodic Labs addresses the core bottleneck of materials AI—the exhaustion of public internet data—by generating
      proprietary, physical-world experimental telemetry in owned automated facilities. By systematically capturing
      failed synthesis attempts as training signals, the company establishes a data moat that competitors relying on web
      scrapes or published academic papers cannot easily replicate.
    claimRefs:
      - CE001
      - CE003
  - calloutType: risk
    title: High Capital Intensity and Undisclosed Commercial IP Terms
    body: >-
      Building and maintaining automated physical laboratories requires substantial capital expenditure, specialized
      robotics hardware, and manual maintenance, exposing the company to equipment downtime and physical scaling
      hurdles. Moreover, the lack of public disclosure regarding IP assignment, pricing, and customer commercial terms
      creates underwriting friction for enterprise adopters.
    claimRefs:
      - CE011
      - CE013
      - CE014
