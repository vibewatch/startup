      - ["Lila Sciences", "Broad autonomous-science platform", "$550M total funding and $1.3B+ valuation reported in the March 2026 David Song analysis", "Multiple scientific domains and science-factory infrastructure", "Broader domain scope and larger disclosed physical footprint", "Figures and positioning rely on one independent analyst in the assigned pool"]
