callouts:
  - calloutType: "insight"
    title: "The defensible asset is the loop, not the model alone"
    body: "Periodic's proposed advantage is proprietary experimental feedback joining models to physical infrastructure; model-only differentiation would be easier for well-resourced incumbents to challenge."
    claimRefs: [CP001, CP002, CP004, CP005]
  - calloutType: "risk"
    title: "Public proof trails the integration thesis"
    body: "The assigned evidence does not independently demonstrate scaled autonomous discovery-to-synthesis operation, comparable pricing, or repeatable customer economics."
    claimRefs: [CP010, CP012, CP013, CP014]
