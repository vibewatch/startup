      - ["Proprietary data loop", "Designed to learn from positive and negative physical outcomes", "Autonomous-loop ambition reported; comparative data volume unknown", "Customer-specification workflow reported; owned experimental loop not established", "Internal data can remain proprietary, but iteration speed is not compared"]
      - ["Public customer evidence", "Investor reports space, defense, and semiconductor deployments", "First-customer activity reported by one analyst", "Hyundai and Kemira partnerships reported by one analyst", "Not comparable across internal programs"]
      - ["Scaled autonomous-cycle proof", "Unknown; no public at-scale proof identified in the assigned evidence", "Unknown; no public at-scale proof identified by the independent analyst", "Not established in the assigned evidence", "Program results exist, but no like-for-like commercial benchmark is retained here"]
    notes: "Cells summarize only the eight assigned prefetched sources; 'unknown' means the evidence set does not establish the criterion, not that the capability is absent."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP010]
  - id: "TP003"
    title: "Pricing, packaging, and lock-in evidence"
    columns: ["Alternative", "Public price or unit", "Packaging evidence", "Potential lock-in mechanism", "Diligence implication"]
    rows:
      - ["Periodic Labs", "Not disclosed in assigned evidence", "Partner-reported customer work; contract form and included capabilities unknown", "Experimental data, instrument integration, workflow history, and tuned agents", "Request contracts, realized pricing, renewal data, data rights, and switching terms"]
      - ["Lila Sciences", "Not disclosed in assigned evidence", "Broad science-factory positioning; commercial package unknown", "Physical infrastructure and accumulated experiment data", "Request comparable project scope, throughput, and customer reference evidence"]
      - ["CuspAI", "Not disclosed in assigned evidence", "Customer-specification design with partner validation reported", "Model IP, customer design history, and partner-lab workflow", "Test whether partner dependence lowers capital intensity or weakens feedback speed"]
      - ["Orbital Materials", "Not disclosed in assigned evidence", "Downstream products and AWS-linked distribution reported", "Product qualification and deployment integration", "Compare product economics separately from discovery-platform economics"]
      - ["Citrine Informatics", "Not disclosed in assigned evidence", "Data and analytics SaaS positioning", "Embedded datasets, workflows, and organizational adoption", "Obtain current list and realized pricing plus migration evidence"]
    notes: "This is a disclosure-gap table, not proof that private pricing or contracts do not exist; no assigned source supplies comparable list prices or realized contract economics."
    claimRefs: [CP003, CP004, CP007, CP008, CP009, CP013, CP014]
