callouts:
  - calloutType: "recommendation"
    title: "Price is the gating variable"
    body: "The public record supports continued diligence on the company, but not acceptance of the reported $7.5 billion mark without primary financing documents and measurable commercial and scientific proof."
    claimRefs: [CV002, CV006, CV007, CV013, CV014]
  - calloutType: "risk"
    title: "Do not convert disclosure gaps into false precision"
    body: "Funding raised is not cash available, a reported valuation is not a closed financing, and missing revenue or customer metrics cannot be replaced with a precise fair-value estimate."
    claimRefs: [CV001, CV002, CV003, CV006, CV007]
