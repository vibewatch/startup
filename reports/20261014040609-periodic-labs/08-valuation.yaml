company:
  name: "Periodic Labs"
chapter:
  number: 8
  title: "Valuation"
  summary: "Periodic Labs has a consistently reported $300 million seed financing, but the later $7.5 billion valuation remains a secondary-reported, unconfirmed mark and public evidence does not disclose revenue, customer count, margins, or financing terms. The appropriate stance is track / research more: do not underwrite the reported price until the round closes and repeatable commercial and scientific outcomes are independently evidenced."
sections:
  - id: "recommendation-and-evidence"
    title: "Recommendation and evidence threshold"
    body: >-
      The recommendation is track / research more, with high investment risk and a stretched-to-indeterminate
      valuation stance at the reported $7.5 billion level. The company has an unusually large confirmed capital
      base and a differentiated closed-loop architecture spanning AI models, simulations, and robotic laboratories,
      but company quality and entry price must be separated. Public sources consistently support a $300 million
      September 2025 seed; they do not establish a closed 2026 round, audited revenue, customer count, retention,
      gross margin, or repeatable commercial discovery outcomes. Consequently, neither a conventional revenue
      multiple nor a probability-weighted breakthrough value can be responsibly calculated. A diligence-ready
      recommendation requires primary financing documents, customer economics, and independently reproducible
      outcome evidence rather than another narrative or secondary-market mark.
    claimRefs: [CV001, CV002, CV006, CV007, CV010, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "financing-and-entry-discipline"
    title: "Financing context, thesis, and entry discipline"
    body: >-
      Financing evidence has two distinct tiers. The $300 million seed is repeated across several independent
      summaries and launch coverage, while the reported follow-on of at least $500 million at $7.5 billion is
      described as in talks or not confirmed closed. Even the earlier valuation basis is inconsistent: one source
      reports roughly $1.3 billion post-money, while another reports up to $1.5 billion pre-money. These are not
      interchangeable denominators and should not be averaged. Cap-table ownership, board rights, liquidation
      preferences, participation, anti-dilution protection, and strategic terms are also undisclosed. Entry
      discipline should therefore be milestone-based: no price acceptance at the reported mark without signed
      closing evidence, a fully diluted capitalization table, preference stack, and commercial proof sufficient
      to distinguish scalable product economics from bespoke research services.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV009, CV016]
    tableRefs: [TV002]
  - id: "scenario-framework"
    title: "Bull, base, and bear decision bands"
    body: >-
      The scenario framework uses reported financing marks as decision bands, not as estimates of intrinsic value.
      The bear case anchors at or below the reported 2025 seed mark if customer proof remains absent, the 2026
      financing does not close, or autonomous-lab results fail reproducibility tests. The base case spans above the
      seed mark but below the reported $7.5 billion level only after credible contracts, retention, margins, and
      validated industrial outcomes emerge. The bull case can justify consideration of the reported mark or higher
      only after the financing is documented and the platform demonstrates repeatable, high-value discoveries with
      scalable economics. No numeric probability is assigned because the public record lacks the operating data
      needed to calibrate one; the table instead identifies observable probability signals and downside triggers.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV011, CV013, CV014]
    tableRefs: [TV003]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness, diligence asks, and thesis-break triggers"
    body: >-
      Exit readiness is low: Periodic Labs is private, no IPO filing is reported, and the available sources do not
      disclose the operating metrics normally needed to support a public-market or strategic-acquisition case.
      Scientific upside may be large, but commercialization risk is amplified by capital-intensive laboratories,
      bespoke customer work, and the possibility that useful deployment lags technical demonstrations. Governance
      and knowledge-control questions add another diligence layer when privately owned systems generate or mediate
      scientific results. Before investment, obtain closing documents for every round, a fully diluted cap table
      and preference waterfall, monthly cash use and committed infrastructure spend, customer-level contract and
      retention evidence, reproducibility packages for claimed outcomes, and an IP/data-rights schedule. Thesis
      breaks include a failed financing close, inability to reproduce discoveries independently, persistent custom
      services without improving margins, or material customer and data-rights concentration.
    claimRefs: [CV008, CV009, CV011, CV012, CV015, CV016]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Dimension", "Current view", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Track / research more", "Confirmed seed but unconfirmed later financing and missing commercial metrics", "Do not issue a buy recommendation on public evidence"]
      - ["Confidence", "Medium on the evidence gap; low on fair value", "Multiple sources agree on the seed, but valuation and operating disclosures are incomplete", "Require primary documents before pricing"]
      - ["Risk rating", "High", "Capital intensity, commercialization uncertainty, and limited independent outcome validation", "Use milestone-based exposure and downside protections"]
      - ["Valuation stance", "Stretched-to-indeterminate at the reported $7.5B mark", "The reported price lacks disclosed revenue, customer, margin, and financing-term support", "No entry at the reported mark without proof milestones"]
    notes: "Views are analytical judgments based only on the cited public evidence; reported financing marks are not treated as fair-value estimates."
    claimRefs: [CV002, CV006, CV007, CV013, CV014, CV016]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence today", "What would change the view"]
    rows:
      - ["Thesis", "Closed-loop AI, simulation, and robotic labs can generate proprietary experimental data", "Partner and independent descriptions consistently identify this architecture", "Reproducible discoveries and customer productivity gains verified by independent parties"]
      - ["Thesis", "Large seed financing can fund talent, compute, and physical laboratory build-out", "$300M September 2025 seed is consistently reported", "Audited use-of-proceeds and milestone delivery within an approved capital plan"]
      - ["Anti-thesis", "Bespoke scientific services may scale more slowly than a standardized software product", "Public descriptions emphasize custom agents and customer-specific experimental data", "Repeatable product revenue, retention, gross margin, and declining deployment effort"]
      - ["Anti-thesis", "The reported valuation prices substantial success before commercial and scientific proof is public", "The $7.5B financing remains unconfirmed and operating metrics are undisclosed", "Closed financing plus independently validated outcomes and durable unit economics"]
    notes: "The table separates architecture and funding evidence from unverified commercial outcomes; no row implies that funding raised equals cash available."
    claimRefs: [CV001, CV008, CV009, CV010, CV011, CV014]
  - id: "TV003"
    title: "Bull, base, and bear decision bands"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Probability signal", "Downside or thesis-break trigger"]
    rows:
      - ["Bull", "Closed 2026 financing; repeatable discoveries; scalable customer economics; defensible data and IP rights", "Consider the reported $7.5B mark or higher only after milestones are evidenced; not a current fair-value estimate", "Strengthens with primary closing documents, audited growth, retention, margins, and independent replication", "Discovery fails replication, customer economics remain bespoke, or financing terms create unacceptable preference overhang"]
      - ["Base", "Seed capital remains available; limited commercial proof emerges; platform integration works but scaling is unproven", "Decision band above the reported seed mark but below $7.5B, negotiated against milestones and dilution; no point estimate", "Strengthens with named reference customers, repeat use, improving margins, and documented runway", "No credible customer cohort, rising capital intensity, or follow-on financing remains unclosed"]
      - ["Bear", "No verified commercial traction; autonomous outcomes do not generalize; capital needs rise", "At or below the reported 2025 seed valuation context, with downside protection; not an intrinsic-value calculation", "Current public gaps make this case impossible to dismiss", "Failed round, inability to reproduce results, adverse IP/data terms, or persistent services-heavy economics"]
    notes: "Bands reference reported financing context only. No probabilities or target returns are quantified because revenue, margins, cash use, dilution, preferences, and exit timing are not public."
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV011, CV013, CV014]
