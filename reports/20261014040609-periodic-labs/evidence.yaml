    severity: material
    topic: ip-ownership-and-commercial-terms
    missingEvidence: >-
      Public disclosure of contractual IP ownership, licensing terms, and patent assignment protocols for novel
      materials discovered using customer data and Periodic Labs automated labs.
    whyItMatters: >-
      Enterprise customers and investors cannot underwrite whether Periodic Labs retains foundational IP rights to
      discovered compounds or merely acts as an automated fee-for-service R&D contractor.
    diligencePath: >-
      Request standard master services agreements (MSAs), joint development agreements (JDAs), and IP assignment
      covenants during private diligence sessions with management.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: developer-surface-and-api-telemetry
    missingEvidence: >-
