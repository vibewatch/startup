evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Verified revenue run-rate, ARR, customer contract counts, pricing structure, and audited income statement data.
    whyItMatters: Without financial disclosures, valuation multiples and commercial viability cannot be rigorously underwritten.
    diligencePath: Request confidential management presentations, audited financials, or customer contract schedules under NDA.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: commercial-contracts
    missingEvidence: Named commercial customer contracts, SLA performance metrics, and IP ownership terms for co-discovered materials.
    whyItMatters: >-
      Determines whether autonomous lab outputs translate into proprietary enterprise software contracts or
      royalty-bearing patent assets.
    diligencePath: >-
      Conduct expert interviews with semiconductor and materials R&D executives and inspect patent assignment
      registries.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-and-unit-economics
    missingEvidence: >-
      Public disclosure of Periodic Labs commercial pricing tiers, contract sizes, or customer counts across its
      autonomous lab and custom agent offerings.
    whyItMatters: >-
      Without public contract values or customer disclosure, bottom-up SOM sizing and revenue run-rate cannot be
      underwritten independently.
    diligencePath: >-
      Request customer contract schedules, average annual contract values (ACVs), and pilot conversion metrics under NDA
      during technical due diligence.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: superconducting-materials-validation
    missingEvidence: >-
      Peer-reviewed publications or independent experimental benchmarks confirming reproducible high-temperature
      superconductor synthesis from Periodic Labs's autonomous facility.
    whyItMatters: >-
      Superconducting discovery is the primary publicized commercial moonshot; absence of verified synthesis leaves
      technical feasibility unproven.
    diligencePath: >-
      Review physical sample characterization data, XRD spectra, and magnetic susceptibility measurements with an
      independent materials physics expert.
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: >-
      Comparable list and realized pricing, contract units, discounts, renewal terms, and included service scope for
      Periodic and named peers.
    whyItMatters: >-
      Without buyer economics, the analysis cannot compare procurement friction, pricing power, or the cost of
      multi-homing.
    diligencePath: >-
      Request current customer contracts, pricing schedules, renewal cohorts, discount approvals, and two competitor
      displacement examples.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: autonomy-proof
    missingEvidence: >-
      Independent, reproducible evidence of closed-loop experiments operating at scale with measured throughput, success
      rate, and human intervention.
    whyItMatters: The autonomous feedback loop is the central claimed moat and capital-efficiency justification.
    diligencePath: >-
      Conduct a laboratory visit and inspect run logs for a representative campaign, including failed experiments and
      manual overrides.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Independent customer references covering deployment scope, realized outcomes, renewal intent, data rights, and
      switching costs.
    whyItMatters: Investor-issued customer claims do not establish repeatability, retention, trust posture, or distribution power.
    diligencePath: >-
      Interview at least three customers across semiconductor, defense, and space use cases without company management
      present.
    relatedQuestionRefs:
      - QP002
      - QP005
  - type: private-evidence-only
    severity: material
    topic: customer-contracts-and-revenue-terms
    missingEvidence: >-
      Audited financial statements, ARR breakdown, contract sizes (ACV), and realized revenue metrics from early
      semiconductor customer engagements.
    whyItMatters: >-
      Without disclosed contract terms or revenue run-rate, underwriters cannot confirm revenue predictability,
      recurrence, or gross margins.
    diligencePath: >-
      Request management presentation of customer contract commitments, master services agreements, and revenue
      recognition schedules.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics-and-lab-operating-costs
    missingEvidence: >-
      Detailed breakdown of physical experiment synthesis costs, robotic equipment maintenance expenses, and facility
      lease costs across San Francisco and Gardena.
    whyItMatters: >-
      Autonomous laboratory unit economics remain unverified; heavy capital expenditure and hardware maintenance could
      depress gross margins below software benchmarks.
    diligencePath: >-
      Inspect laboratory cost-per-experiment accounting logs, robotics vendor capex schedules, and power/materials
      consumption records.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: seed-valuation-and-forward-financing-terms
    missingEvidence: >-
      Final executed term sheets reconciling reported seed post-money valuations ($1.0B vs. $1.3B vs. $1.5B) and terms
      for the reported 2026 $500M+ extension round.
    whyItMatters: >-
      Media reports diverge on historical seed valuation markers, while 2026 financing rounds remain in evolving
      negotiations without officially filed closing documents.
    diligencePath: >-
      Review certificate of incorporation filings and Series Seed preferred stock purchase agreements for exact share
      price and liquidation preference.
    relatedQuestionRefs:
      - QI001
      - QI005
