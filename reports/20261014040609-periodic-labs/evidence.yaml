    whyItMatters: >-
      These inputs determine whether the business can scale beyond bespoke research and whether any revenue-based
      valuation method is appropriate.
    diligencePath: >-
      Review audited financials, monthly management accounts, customer-level cohorts, signed contracts, invoices,
