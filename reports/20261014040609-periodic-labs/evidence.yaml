    whyItMatters: >-
      Repeatability and industrial usefulness are required to distinguish a defensible discovery platform from
      demonstrations and custom research services.
    diligencePath: >-
      Commission expert review of experiment logs, blinded replication, baseline comparisons, negative results, and
