        title: 展示项
        blocks:
          - type: callout
            title: 商业化断崖与时间窗口脆弱性
            body: >-
              Periodic Labs 面临关键的商业化窗口：如果其自主实验室到 2027 年仍无法把计算生成的候选预测转化为可重复、经过工业验证的材料合成，在其传闻中的 $7.5B
              估值目标下，公司将面临估值倍数大幅收缩和融资阻力。
