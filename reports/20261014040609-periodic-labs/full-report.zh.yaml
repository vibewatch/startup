      - - 乐观
        - 2026 年融资完成；发现可重复；客户经济效益可规模化；数据和 IP 权利具备防御性
        - 只有在里程碑得到证据支持后，才考虑按报道的 $7.5B 或更高估值；这不是当前公允价值估计
        - 有一手交割文件、经审计增长、留存、利润率和独立复现时，信号增强
        - 发现无法复现，客户经济效益仍高度定制化，或融资条款造成无法接受的优先权悬垂
      - - 基准
        - 种子资本仍可用；出现有限的商业证据；平台集成可行，但规模化尚未得到验证
        - 决策区间高于报道的种子轮估值、低于 $7.5B，并围绕里程碑和稀释进行谈判；不提供点估计
        - 有具名标杆客户、重复使用、利润率改善和有文件支持的现金跑道时，信号增强
        - 没有可信客户队列、资本密集度上升，或后续融资仍未完成
      - - 悲观
        - 没有经过验证的商业牵引力；自主成果无法泛化；资本需求上升
        - 处于或低于报道的 2025 年种子轮估值背景，并设置下行保护；不是内在价值计算
        - 当前公开缺口使这一情景无法排除
        - 融资失败、无法复现结果、不利的 IP / 数据条款，或服务占比长期过高的经济模式
    notes: 区间仅参考报道的融资背景。由于收入、利润率、现金使用、稀释、优先权和退出时点均未公开，因此不量化概率或目标回报。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示 Periodic Labs 从学术基础到自主实验室部署及潜在后续融资轮次的时间顺序演进。
    data:
      items:
        - date: '2023-11-27'
          label: 学术与实验室先例
          detail: DeepMind 发布 GNoME，预测数百万种晶体结构，展示计算方法在材料发现上的潜力。
          tone: neutral
        - date: '2025-01-15'
          label: Periodic Labs 成立
          detail: Liam Fedus 和 Ekin Dogus Cubuk 在旧金山注册 Periodic Labs，汇聚 OpenAI 与 DeepMind 的资深研究人员。
          tone: positive
        - date: '2025-09-30'
          label: 走出隐身期与 $300M 种子轮
          detail: 公司结束隐身期，宣布由 a16z 领投、NVentures、Accel、DST 及知名科技天使参与的创纪录 $300M 种子轮。
          tone: positive
        - date: '2025-10-01'
          label: 科学顾问委员会公布
          detail: Periodic Labs 成立科学顾问委员会，成员包括 Stanford 和 Northwestern 的知名化学与物理学教师。
          tone: positive
        - date: '2025-10-15'
          label: 学术资助项目启动
          detail: 启动学术资助计划，与外部大学研究人员合作开展自动化实验。
          tone: neutral
        - date: '2025-12-16'
          label: 工业试点部署
          detail: 与一家未具名半导体制造商部署定制 AI 智能体，协助工程师分析芯片散热。
          tone: positive
        - date: '2026-05-15'
          label: 潜在融资传闻
          detail: 市场报道和研究笔记显示，公司正在讨论一轮 ≥$500M 融资，估值最高可达 $7.5B，但监管文件尚未确认。
          tone: warning
        - date: '2026-10-14'
          label: 持续扩张自主实验室
          detail: 自主实验室运营向超导体闭环物理合成扩展，但公开商业指标仍为零。
          tone: neutral
    approximationNotes: 里程碑日期来自公开公告和已确认报道；公司注册前的研究日期代表其基础沿革。
    claimRefs:
      - CO001
      - CO004
      - CO008
      - CO012
      - CO013
      - CO014
      - CO015
