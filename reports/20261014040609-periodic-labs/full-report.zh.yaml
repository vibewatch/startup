      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 物理验证优势
            body: >-
              与受有限互联网文本 token（~10T tokens）约束的纯 LLM 架构不同，Periodic Labs
              借助自主机器人实验室生成专有的物理实验数据。在物理学和材料科学中，自然是最终的强化学习验证器，能够提供高信噪比反馈，并捕捉传统科学文献遗漏的关键负面结果。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
          - type: callout
            title: 资本密集度与商业验证空白
            body: >-
              Periodic Labs 在种子阶段获得 $300M，为建设机器人实验室基础设施提供了充足运营缓冲期，但也设定了前所未有的预期。在收入为零、没有点名的商业参考客户、媒体估值讨论达到 $7.5B
              的情况下，公司要跨越自动化实验室演示与持久工业收入之间的鸿沟，面临极高的执行风险。
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、企业支出范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 位于前沿人工智能模型与物理科学材料研发交汇的结构性边界。其可服务市场由企业为打通 AI
              生成假设与自动化物理合成闭环而投入的支出界定，涵盖先进材料发现、闭环机器人合成基础设施、计算物理模拟，以及部署在专业工业流程中的定制诊断
              agent。相反，市场定义明确排除商品化实验室信息管理系统（LIMS）、传统湿实验室试剂采购、通用手工测试台，以及面向大众的企业软件许可。现状替代方案包括专业科学人员开展的手工试错实验化学、外部合同研究组织（CRO），以及纯计算筛选流程，例如
              Google DeepMind 的 GNoME 或 Microsoft 的 MatterGen；这些流程能够预测晶体结构，却依赖彼此脱节的第三方实验室完成物理验证。Periodic Labs
              将机器人实验与生成模型直接结合，瞄准有限互联网文本和未记录的物理负面结果造成的严重数据瓶颈。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 通过多重视角测算 TAM、SAM 与受约束 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Periodic Labs 的商业潜力，需要采用纪律严明的多层次测算视角，而不是不受约束地宣称一个总市场规模。从自上而下的企业研发视角看，全球企业和机构在物理科学、特种材料、化工及电子领域的年度总支出约为
              $180 billion，其中目标发现、配方和表征对应的可寻址总市场（TAM）为 $45 billion。更窄的技术平台视角将计算材料建模、物理信息机器学习和高通量模拟单列为 $12
              billion，闭环机器人实验室自动化设备则为 $4.5 billion。若限定在 Periodic Labs 的初始商业目标——半导体封装热耗散和探索性超导材料合成——可服务可寻址市场（SAM）缩小至 $1.8
              billion。由于 Periodic Labs 是企业研发合作伙伴，而非自助式软件供应商，其近期可获取可服务市场（SOM）现实上受限于 $250
              million，受定制集成周期、跨多个季度的企业销售流程以及物理实验室部署高开销所约束。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
