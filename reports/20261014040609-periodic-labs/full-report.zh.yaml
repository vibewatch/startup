      - number: '2.3'
        title: 企业买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              企业对自主实验室智能的需求集中在四个主要工业领域：半导体制造商、先进特种化学品和材料生产商、下一代储能制造商，以及顶尖机构研究院。这些客户组织中的买方角色，在采购和日常工作流执行中承担不同责任。经济采购决策通常由高级研发副总裁、技术战略负责人或
              CTO 掌握，他们控制着集中的企业创新资金或先进技术开发预算。相较之下，一线日常用户是负责解决具体运营瓶颈的首席材料科学家、计算化学家和半导体封装工程师。企业采用路径从狭窄的定制概念验证 agent
              开始——例如分析半导体原型热遥测数据和热耗散的模型——最终走向多年期共同开发合作，由 Periodic Labs 在专用机器人设施内开展自主合成与表征。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 结构性增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              AI
              驱动材料发现的扩张，一方面由根本性技术催化剂推动，另一方面受严重运营采用约束限制。首要宏观驱动因素是用于前沿模型扩展的公共互联网文本已经耗尽，使物理实验成为生成专有高信噪比预训练数据的唯一剩余路径。同时，计算硬件的物理扩展上限进一步提高了商业紧迫性：微芯片热耗散需要新的热材料，而更高温超导体拥有数万亿美元级的工业潜力。然而，采用受到多重因素严重约束，包括建设机器人实验室所需的极高资本投入、工业材料认证漫长的多年验证周期、客户对专有实验
              IP 的敏感性，以及对 AI 在已知范式内解题能否产生真正科学突破的认识论质疑。此外，关键尽调缺口仍未解决：Periodic Labs
              没有公开披露定价表、客户数量或收入指标，因此无法独立验证其单位经济效益或商业进展。
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 物理科学中的实验数据瓶颈
            body: 软件和语言模型可以依赖网络文本获得庞大预训练语料，而材料科学发现则受到稀缺、非标准化物理实验和未发表负面结果的严重瓶颈制约。自主机器人实验室不是单纯的运营便利工具，而是高信噪比数据生成引擎。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: 商业化滞后与漫长工业采用周期
            body: 尽管前沿 AI 背景和闭环合成能吸引大量风险投资，半导体和材料领域的工业买方仍要求充分的物理可重复性和清晰的知识产权归属，之后才会超越探索性概念验证合作。
            calloutType: risk
            claimRefs:
              - CM008
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 广泛的竞争集合覆盖实验室、模型、产品与既有厂商
        blocks:
          - type: paragraph
            body: >-
              Periodic 面对的不是一个整齐的同类竞争群，而是多种解决同一材料研发任务的方式。在已分配证据中，Lila Sciences 是最接近的广义自主科学平台；CuspAI
              则强调具备合成意识的计算材料设计，但没有披露同等的自有实验室模式。Orbital Materials 代表下游替代方案，把 AI 设计的材料转化为产品；Citrine Informatics
              则代表成熟的材料信息学软件类别。Google DeepMind 的 GNoME、Microsoft 的 MatterGen 和 MatterSim
              仍是大型实验室替代方案，而内部科学团队和传统合同实验室维持着现状。竞争集合如此广泛很重要，因为买方可以选择更窄的工具、由合作伙伴主导的工作流或内部自建，而不必采用端到端外部平台。公开规模比较并不均衡：本证据集中的大多数详细同行数据来自一名独立分析师，因此应视为方向性快照，而不是经过审计的基准。
            claimRefs:
