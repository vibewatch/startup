        blocks:
          - type: paragraph
            body: >-
              情景框架把报道中的融资估值作为决策区间，而不是内在价值估计。如果客户证明仍然缺失、2026 年融资未完成，或自主实验室结果未通过可重复性测试，悲观情景锚定在报道的 2025
              年种子轮估值或更低。基准情景只有在可信合同、留存率、利润率和经验证的工业成果出现后，才位于种子轮估值之上、报道的 $7.5 billion
              之下。乐观情景只有在融资得到文件证明，且平台展示出可重复的高价值发现与可规模化经济性后，才足以支持考虑该报道估值或更高水平。由于公开记录缺乏校准概率所需的经营数据，不赋予任何数字概率；表格改为列出可观察的概率信号和下行触发点。
