              的核心前提是：互联网文本已耗尽，不再是产生全新物理发现的可行来源。为克服这一限制，公司搭建闭环机器人实验室，直接在材料科学、物理学和化学领域生成新经验数据。运营周期从 AI agent
              提出化学和结构假设开始，经由自动化配方编译和机器人工作单元中的物理合成，最后以高通量表征收尾，再把测量信号反馈给模型微调。该闭环明确优先系统性捕捉负面实验结果；这些结果几乎总被发表的科学文献遗漏，却能提供关键梯度信号，防止模型反复探索不可行的热力学状态。
