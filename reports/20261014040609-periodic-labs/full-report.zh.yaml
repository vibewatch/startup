  - id: FP001
    title: 序数竞争定位：集成度与范围
    type: quadrant
    summary: Periodic 的垂直集成度似乎很高，但相比广泛的科学平台更聚焦材料；这些分数是有证据支持的序数判断，不是实测表现。
    data:
      xAxis:
        label: 从模型到物理实验的垂直集成度
        min: 1
        max: 5
      yAxis:
        label: 科学或产品范围的广度
        min: 1
        max: 5
      points:
        - label: Periodic Labs
          x: 5
          'y': 3
          detail: 初期聚焦物理科学和材料，具备模型、仿真及自有自主实验室雄心。
        - label: Lila Sciences
          x: 5
          'y': 5
          detail: 定位为广泛的科学工厂，据报道拥有大量实体基础设施。
        - label: CuspAI
          x: 2
          'y': 3
          detail: 计算材料设计，物理验证据称依赖合作伙伴。
        - label: Orbital Materials
          x: 3
          'y': 2
          detail: 相比通用发现平台，更偏下游且更聚焦具体产品。
        - label: Citrine Informatics
          x: 1
          'y': 2
          detail: 成熟的材料信息学软件，而非自有自主实验室。
        - label: 内部研发或大型实验室项目
          x: 3
          'y': 4
          detail: 可能拥有广泛的模型和实验室资源，但集成方式和商业包装各不相同。
    approximationNotes: 分析师根据保留的来源描述分配 1-5 序数分数；这些分数不是市场份额、表现或赢得客户的衡量指标。
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP007
      - CP008
      - CP009
      - CP011
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 展示企业研发问题如何经由自主实验室合成，推进至商业变现和利润率兑现的结构化路径。
    data:
      nodes:
        - id: demand-intake
          label: 工业研发问题定义
          description: 工业合作伙伴提出紧迫的材料约束，例如半导体散热或超导体设计。
        - id: ai-simulation
          label: AI 科学家候选生成
          description: 基础模型和物理仿真筛选数百万种理论晶体配置，并预测其性质。
        - id: robotic-synthesis
          label: 自主物理实验
          description: Gardena 和 SF 的机器人实验室执行粉末合成、物理测量和闭环数据生成。
        - id: candidate-validation
          label: 材料验证与 IP 创造
          description: 将实验结果与物理现实对照验证后，产生新颖的可申请专利材料数据和训练后的定制智能体。
        - id: commercial-contract
          label: 企业变现与长期服务合同
          description: 合作伙伴支付定制工程长期服务费、平台许可费和里程碑完成付款。
        - id: margin-realization
          label: 毛利率与现金转化
          description: 扣除实验室技术人员编制、机器人设备维护、算力和试剂成本后实现净贡献。
      edges:
        - from: demand-intake
          to: ai-simulation
        - from: ai-simulation
          to: robotic-synthesis
        - from: robotic-synthesis
          to: candidate-validation
        - from: candidate-validation
          to: commercial-contract
        - from: commercial-contract
          to: margin-realization
    approximationNotes: 这是基于报道的合作伙伴工作流对商业运营架构的定性呈现；美元转化比例和单位利润率仍属私有信息。
    claimRefs:
      - CI005
      - CI006
      - CI008
      - CI011
      - CI013
  - id: FE001
    title: 产品架构堆栈图
    type: stack
    summary: 展示覆盖生成式智能、物理机器人和闭环数据反馈的六层运营与技术架构。
    approximationNotes: 架构分层基于公开投资者分析和技术画像报道；内部专有分层边界未披露。
    data:
      layers:
        - label: 自主科学智能体层
          name: Autonomous Scientific Agent Layer
          detail: 驱动假设生成、实验设计并依据物理定律推理的前沿 LLM 智能体
        - label: 基于物理的仿真与筛选层
          name: Physics-Based Simulation & Filtering Layer
          detail: 计算材料筛选、热力学稳定性估算和分子动力学筛选
        - label: 实验编译与编排层
          name: Experiment Compilation & Orchestration Layer
          detail: 将抽象实验方案转化为确定性的机器可执行机器人指令
        - label: 物理实验室机器人与合成层
          name: Physical Laboratory Robotics & Synthesis Layer
          detail: 自动化工作单元执行前体处理、化学混合、加热和晶体生长
        - label: 高通量表征层
          name: High-Throughput Characterization Layer
          detail: 自动化传感器套件测量合成样品的结构、电气和热学性质
        - label: 闭环反馈与遥测引擎
          name: Closed-Loop Feedback & Telemetry Engine
          detail: 将正向结果和负向实验结果回传至模型训练和实验改进环节
    claimRefs:
      - CE001
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 企业客户采用旅程与扩张循环
    type: journey-map
    summary: 展示企业研发客户从探索性材料仿真、到自主合成试点、再到闭环发现的生命周期。
    data:
      items:
        - label: 启动与问题界定
          stage: 启动与问题界定
          actor: 企业研发副总裁
          action: Identify intractable materials bottlenecks such as thermal dissipation or energy loss
          touchpoints:
            - 技术范围界定咨询
            - 领域文献与仿真评审
        - label: 定制智能体部署
          stage: 定制智能体部署
          actor: 材料研究工程师
          action: Deploy custom AI agents to analyze complex experimental and diffraction datasets
          touchpoints:
            - 与现有仪器集成数据
            - 衍射分析基准测试
        - label: 闭环机器人合成
          stage: 闭环机器人合成
          actor: Periodic 自主实验室
          action: Execute 24/7 automated synthesis and measurement in Menlo Park facilities
          touchpoints:
            - 自动化机器人工作单元调度
            - 专有物理反馈闭环
        - label: 结果验证与基准测试
          stage: 结果验证与基准测试
          actor: 合作伙伴研发团队与科学研究员
          action: Verify synthesized material physical properties against baseline diffraction and thermal metrics
          touchpoints:
            - 实证测量评审
            - 负面结果归档记录
        - label: 商业验证与 IP 转让
          stage: 商业验证与 IP 转让
          actor: 企业法务与管理层
          action: Validate real-world material properties and resolve IP ownership terms
          touchpoints:
            - 试点结果评估
            - 长期生产许可协议
        - label: 生产扩张与机群规模化
          stage: 生产扩张与机群规模化
          actor: 企业采购与运营团队
          action: Scale multi-workcell automated synthesis allocations across additional material discovery pipelines
          touchpoints:
            - 企业产能预留
            - 多年期发现服务协议
    approximationNotes: 旅程图阶段反映与半导体制造商合作中观察到的参与工作流，以及规划中的自主平台架构。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 风险矩阵按影响和可能性维度映射 Periodic Labs 的关键运营、技术、商业和监管脆弱性。
    approximationNotes: 风险定位是对截至 2026 年 10 月的公开披露、技术招聘信息和创投生态报道的定性综合。
