  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与证据门槛
        blocks:
          - type: paragraph
            body: >-
              建议为持续跟踪 / 继续研究，投资风险高；按报道的 $7.5 billion 水平看，估值立场偏高且无法确定。公司已确认的资本基础异常庞大，并拥有一套贯穿 AI
              模型、仿真和机器人实验室的差异化闭环架构，但必须把公司质量与进入价格分开评估。公开来源一贯支持 2025 年 9 月 $300 million 的种子轮融资；但它们无法证明 2026
              年融资已经完成，也无法证明经审计的收入、客户数、留存率、毛利率或可重复的商业发现结果。因此，既不能负责任地计算传统收入倍数，也不能计算按概率加权的突破性价值。要形成可直接用于尽调的建议，需要一手融资文件、客户经济性和可独立复现的结果证据，而不是另一套叙事或二级市场估值标记。
