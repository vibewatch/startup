      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发点
        blocks:
          - type: paragraph
            body: >-
              退出准备度低：Periodic Labs 是一家非上市公司，没有 IPO
              申报记录，现有来源也没有披露支撑公开市场或战略收购案例通常所需的经营指标。科学上行空间可能很大，但高资本密度实验室、定制客户工作，以及有用部署落后于技术演示的可能性，都会放大商业化风险。私有系统生成或调解科学结果时，治理和知识控制问题又增加了一层尽调要求。投资前应取得每一轮融资的交割文件、完全摊薄股权结构表及优先权瀑布表、月度现金使用和已承诺基础设施支出、客户层面的合同与留存证据、已主张成果的可复现性材料包，以及
              IP / 数据权利清单。论点破坏点包括融资交割失败、无法独立复现发现、定制服务长期存在且利润率没有改善，或客户与数据权利高度集中。
            claimRefs:
              - CV008
