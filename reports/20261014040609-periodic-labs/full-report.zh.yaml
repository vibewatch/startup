  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策链条从已确认的资本和差异化架构出发，经由尚缺的证明与估值支撑，最终给出跟踪 / 继续研究的建议。
    data:
      nodes:
        - id: confirmed-capital
          label: 多次报道的 $300M 种子轮融资
          detail: 已募集资本不等于当前可用现金。
        - id: platform-architecture
          label: AI + 仿真 + 自动化实验室
          detail: 可能形成专有实验数据闭环。
        - id: commercial-proof
          label: 收入和客户指标未披露
          detail: 没有公开依据支持收入倍数或单位经济性的评估。
        - id: outcome-proof
          label: 仍需独立复现
          detail: 技术演示不足以证明可持续的工业部署。
        - id: valuation-support
          label: 据报道估值为 $7.5B，但尚未确认
          detail: 条款、稀释情况和优先权负担仍未知。
        - id: recommendation
          label: 跟踪 / 继续研究
          detail: 只有融资、商业化和科学里程碑落地后才重新定价。
    approximationNotes: 这是定性证据链；节点顺序不代表数值转化率或概率。
