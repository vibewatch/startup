      - number: '8.2'
        title: 融资背景、投资论点与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资证据分为两个层级。$300 million 种子轮融资在多份独立摘要和发布报道中反复出现；而报道中的后续融资为至少 $500 million、估值 $7.5
              billion，目前仍被描述为洽谈中或尚未确认完成。就连早期估值基准也不一致：一个来源称投后约 $1.3 billion，另一个称投前最高达 $1.5
              billion。这些分母不能互换，也不应取平均。股权结构、董事会权利、清算优先权、跟投权、反稀释保护和战略条款也都未披露。因此，入场纪律应以里程碑为基础：在没有签署的交割证据、完全摊薄股权结构表、优先股堆叠，以及足以区分可规模化产品经济性与定制研究服务的商业证明之前，不接受该报道估值。
            claimRefs:
              - CV001
