      - number: '6.2'
        title: 商业进展、已点名部署与生产成熟度
        blocks:
          - type: paragraph
            body: >
              评估 Periodic Labs 的商业采用，需要把未经验证的企业估值动能与经审计的生产收入区分开来。在公开科技报道和行业数据库中，Periodic Labs
              没有披露付费客户数量、签约年度经常性收入（ARR）、净收入留存（NRR）或合同续约基准。公司于 2025 年 9 月下旬结束隐身状态并完成 $300 million 种子轮融资；据报道，2026 年年中公司正以
              $7.5 billion 估值寻求 Series A 融资，但其商业版图仍处于早期且未经证明。


              多家独立出版物提到的唯一已确认工业部署，是与一家正为芯片热耗散问题挣扎的未具名半导体制造商开展合作。在这次部署中，Periodic Labs 将定制 AI agent
              与物理实验室基础设施配套，协助半导体工程师解读实验衍射和热数据，加快候选热耗散材料的迭代。除这家未具名半导体企业外，公开领域没有任何点名的商业生产合同、正式企业案例研究或可供引用的客户 logo。Periodic
              Labs 在加州 Menlo Park 运营主要机器人实验室，全天候运行自动化合成实验；但目前这些运营产生的主要是专有训练数据和试点验证，而不是多租户商业 SaaS 收入。
            claimRefs:
