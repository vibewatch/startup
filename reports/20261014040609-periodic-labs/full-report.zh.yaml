    title: 市场规模视角
    type: pyramid
    summary: 展示从全球工业材料研发总额到可获取的自主实验室发现支出的分层市场规模。
    approximationNotes: 这些层级估算来自已披露的工业研发支出类别和分析师共识区间。
    claimRefs:
      - CM010
      - CM011
    data:
      items:
        - label: 全球物理科学与材料企业研发
          value: 180
          unit: USD B
          note: 材料、化学品和电子领域所有企业及机构的年度研究支出
        - label: 可服务的先进材料发现与合成 TAM
          value: 45
