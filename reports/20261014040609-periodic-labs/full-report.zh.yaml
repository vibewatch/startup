      - number: '3.2'
        title: 拟议护城河是专有实验反馈闭环
        blocks:
          - type: paragraph
            body: >-
              Periodic 声称的差异化在于垂直整合。投资者和投资组合描述称，其系统把前沿 AI
              模型、基于物理的模拟、机器人合成、表征和从实验结果中学习连接起来。这种架构可能产生专有的正面和负面实验数据，而只做模型的竞争者无法从已发表文献中抓取同样的数据。但这种整合也提高了执行要求：Periodic
              必须运营物理基础设施、连接仪器与模型，并足够快地完成有用实验，让反馈闭环不断复利。证据对其预期架构和人才建设信号支持最强，而非对比较性能支持最强。一项 2026 年 3 月的招聘分析统计了 18
