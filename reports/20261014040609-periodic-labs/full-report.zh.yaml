      - number: '1.3'
        title: 资本结构、投资者联合体与估值变化
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 于 2025 年 9 月下旬结束隐身状态，并宣布完成 $300 million 种子轮融资，成为风险投资史上规模最大的首轮融资事件之一。该轮融资由 Andreessen
              Horowitz (a16z) 领投，参与者包括 NVentures（NVIDIA 的风险投资部门）、Accel、DST Global 和 Felicis Ventures
              等知名机构及企业风险投资者。个人天使投资者阵容包括 Amazon 创始人 Jeff Bezos、前 Google CEO Eric Schmidt、Google 首席科学家 Jeff Dean 以及知名科技投资人
              Elad Gil。融资完成后，市场情报数据库估计公司估值最高达 $1.5 billion。到 2026 年年中，风险投资研究机构和二级市场追踪机构注意到，公司可能以超过 $500 million
              的规模进行后续融资，潜在估值最高达 $7.5 billion，反映出投资者对物理 AI
              基础设施的强烈兴趣。不过，这些高估值仍未获监管申报文件验证，与公司完全没有公开披露收入或客户合同金额形成鲜明对比。Periodic Labs 的主要总部位于旧金山，据报道在加州 Gardena 设有补充研究设施。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
      - number: '1.4'
        title: 运营里程碑与关键困境
        blocks:
          - type: paragraph
            body: >-
              自 2025 年成立以来，Periodic Labs 已迅速从基础研究概念推进到软硬件一体化的实验室部署。关键里程碑包括组建核心跨学科团队、完成创纪录的 $300 million
              种子轮融资、与顶尖大学教授建立正式学术治理机制，以及启动活跃的工业合作。值得注意的是，公司已与一家未具名半导体制造商开展试点合作，部署定制 AI
              agent，协助工程团队诊断并解决芯片封装中的热耗散问题。尽管取得了这些早期技术成果，Periodic Labs
              仍面临重大的战略与商业困境。独立分析师指出，从自动化实验室演示走向可重复、经商业验证的材料发现充满执行风险，因为物理机器人实验室基础设施需要高额资本和运营支出。此外，私有化自主平台是否会把科学发现能力集中到风险资本支持的私有实体，而非开放的公共机构，也引发了重要的治理和知识主权问题。最后，由于商业收入、客户账户和单位经济效益仍完全属于未披露的私有指标，要评估公司的商业轨迹，就必须严格核查未来里程碑的交付情况。
            claimRefs:
              - CO013
              - CO014
              - CO015
