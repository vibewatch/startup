chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与科学论点
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 是一家总部位于旧金山、于 2025 年成立的人工智能企业，致力于开发与自主物理实验室配套的 AI 科学家。公司基于一个根本判断创立：当代基础模型已经耗尽了有限的互联网文本 token
              语料，估计总量约为 10 万亿 tokens，前沿推理与发现因此面临尖锐的数据瓶颈。Periodic Labs
              不只依赖计算预测或基于既有数据集的合成模拟，而是搭建自动化机器人实验室，在材料科学和化学领域开展物理测试。在这些闭环环境中，AI
              系统提出科学假设、规划物理实验、操作实验室仪器并分析测量结果，持续迭代内部世界模型。物理科学是高度可验证的领域：自然本身就是最终的强化学习奖励函数，可产生大量高信噪比的专有实验数据，并记录传统学术文献系统性遗漏的关键负面结果。公司初期重点瞄准高温超导体，以改造输电和交通电网，同时开发面向工业芯片制造的半导体热耗散方案。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 创始团队、领导层与科学治理
        blocks:
          - type: paragraph
            body: >-
              Periodic Labs 的创始领导层和技术团队汇聚了罕见的顶尖机器学习与材料科学人才。联合创始人兼 CEO Liam Fedus 曾任 OpenAI 研究副总裁，负责后训练研究，并领导了 ChatGPT 和
              GPT-4 背后的关键研究项目。联合创始人 Ekin Dogus Cubuk 曾在 Google Brain 和 DeepMind 负责材料 AI 项目，并共同创作 GNoME（Graph Networks
              for Materials Exploration），这一 AI 系统预测了数百万种候选稳定晶体结构。更广泛的创始团队还包括 MatterGen、OpenAI Operator
              (Agent)、transformer 神经注意力机制和可扩展自主机器人平台的共同创作者。为确保科学方向和方法严谨，Periodic Labs 设立了由 5 名顶尖学者组成的科学顾问委员会：诺贝尔奖得主
              Carolyn Bertozzi 教授（Stanford Chemistry）、Steve Kivelson 教授（Stanford Physics）、Zhi-Xun Shen 教授（Stanford
              Physics）、Mercouri Kanatzidis 教授（Northwestern Chemistry）以及 Chris Wolverton 教授（Northwestern Materials
              Science）。公司还通过学术资助计划支持外部自动化实验探索研究，进一步扩大其学术网络。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
