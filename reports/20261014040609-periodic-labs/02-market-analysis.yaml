callouts:
  - calloutType: "insight"
    title: "The Experimental Data Bottleneck in Physical Sciences"
    body: "Unlike software and language models where web text provided vast pretraining corpora, materials science discovery is severely bottlenecked by scarce, non-standardized physical experimentation and unpublished negative results. Autonomous robotic laboratories act as high-signal data generation engines rather than mere operational conveniences."
    claimRefs:
      - "CM001"
      - "CM003"
  - calloutType: "risk"
    title: "Commercialization Lag and Long Industrial Adoption Cycles"
    body: "While frontier AI credentials and closed-loop synthesis attract substantial venture backing, industrial buyers in semiconductors and materials require extensive physical reproducibility and clear intellectual property attribution before moving beyond exploratory proof-of-concept engagements."
    claimRefs:
      - "CM008"
      - "CM012"
