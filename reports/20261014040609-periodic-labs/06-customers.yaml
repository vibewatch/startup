callouts:
  - calloutType: "insight"
    title: "The Laboratory Bench as the Ultimate Enterprise Moat"
    body: "Periodic Labs' strategic positioning diverges from conventional generative AI vendors by treating physical laboratory benches—not internet scraping—as the primary data generation engine. For enterprise R&D buyers, access to proprietary experimental negative results and verified physical measurements represents a differentiated value proposition that pure software foundation models cannot replicate."
    claimRefs:
      - "CU003"
      - "CU007"
  - calloutType: "risk"
    title: "Severe Commercial Oopacification and Concentration Exposure"
    body: "With a single unnamed semiconductor pilot cited across all public records and zero disclosed paying customers, Periodic Labs exhibits acute commercial concentration risk. The multi-billion-dollar valuation reported in 2026 reflects frontier AI talent and venture enthusiasm rather than validated enterprise customer durability or diversified revenue streams."
    claimRefs:
      - "CU004"
      - "CU009"
      - "CU014"
