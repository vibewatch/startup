  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 高收入口径准确；美国以外增长和农业规模抵消美国限制；安全 / 法律证据改善。
        - US$22-30B 区间，以 US$25B 附近为中心；上行主要来自倍数信心和退出重启。
        - 政策反转可能不会发生；私人财务可能低于预期。
        - 需要经审计的 2025-2026 P&L，以及可见的豁免或法院进展。
      - - 基准
        - DJI 仍保持全球主导地位并盈利，但美国新机型准入继续受限，退出继续延后。
        - US$15-22B 区间，以 US$18B 附近为中心；合理价值在锚点附近，至小幅老股溢价。
        - 流动性折价、地缘政治和股权结构表未知项持续存在。
        - 与当前公开证据和观察建议一致。
      - - 悲观
        - 收入更接近较早的低口径；美国限制加深；买家对中国敞口和退出路径打折。
        - US$10-14B 区间，以 US$12B 附近为中心；即便产品质量强，下行仍低于锚点。
        - 美国新品发布受阻、企业替代加速、老股条款缺乏吸引力。
        - 触发条件是没有豁免路径且经审计财务偏弱。
    notes: 情景估值是以 US$B 计的估计企业价值区间；不是经审计估值标记或交易价格。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV006
      - CV007
      - CV012
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - DJI 锚点和老股交易
        - 私募估值 / EV
        - US$15B 锚点；2026 年老股线索约 US$20-22B EV
        - 直接来自标的公司的价格纪律参考。
        - 锚点不是新的经审计新股轮；老股出售条款信息很薄。
      - - Skydio
        - 私营无人机融资轮
        - US$110M Series F，估值约 US$4.4B-4.5B
        - 最接近的美国无人机公司，受政策偏好的防务 / 公共安全需求支撑。
        - 规模远小于 DJI，且受益于美国对中国竞争对手的限制。
      - - Parrot SA
        - 上市无人机聚焦公司
        - Euronext 上市、聚焦无人机、规模小得多
        - 提供公开市场治理和无人机市场可比性。
        - 规模太小且欧洲属性太强，不能用来确定 DJI 估值倍数。
      - - Mobileye
        - 上市自主硬件先例
        - 首日交易市值约在低 US$20B 区间
        - 显示公开市场投资人可以把自主硬件平台估到接近 DJI 老股线索的水平。
        - 汽车 ADAS 半导体 / 软件平台，不是无人机硬件。
      - - 广义无人机市场
        - 市场规模背景
        - 定义从仅硬件到包含软件 / 服务 / 防务不等
        - 用来界定高份额平台背后的 TAM 敏感性。
        - 市场估计差异很大，不能直接换算为 DJI 收入。
    notes: 这里只列出部分公开 / 私营参照；没有任何同行能在无人机规模、地域和披露上与 DJI 完全匹配。
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable list limited to public cached sources and one web-search verified Mobileye reference available for
        this valuation chapter.
