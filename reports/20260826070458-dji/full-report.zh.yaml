  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管悬崖是约束性风险
        blocks:
          - type: paragraph
            body: >-
              DJI 的风险结构主要由美国法律和监管排除主导，而不是普通硬件执行问题。D.C. Circuit 部分发回后，Section 1260H Chinese Military Company
              列名仍然有效；在下级法院审查机密理由期间，联邦采购污名和承包商回避仍会持续。更直接的商业悬崖是 2025 年 12 月 FCC Covered List 更新：新的外国生产 UAS 和 UAS
              关键组件无法获得设备授权，这会阻止新 DJI 机型进入，即使既有已授权设备仍可使用。OnDefend 审计给了 DJI 更强的技术反驳，但它本身无法回答围绕外国制造、军民两用载荷和战略依赖的政策顾虑。因此，在
              DJI 取得缩窄救济、有条件批准，或拿出美国机构可接受且可验证的供应链路径之前，剩余暴露仍然关键。
