            body: >-
              牵引力通过外部规模指标更容易观察，而不是通过 DJI 自身财务报表。DJI 披露约 400,000 架农业无人机由 400,000 名受训运营者在 100 个国家使用，市场追踪仍显示 DJI 持有约 70–80%
              的民用无人机份额，或 2025 年被探测无人机中的 83.48%。中国财经媒体还报道 Osmo Pocket 3 累计销量超过 10 million 台、收入约
              CN¥20B；如果准确，这是一个有意义的产品集中度数据点。这些事实说明已安装基数巨大、替换周期可变现，但不披露队列留存、付费软件 加购、利用率、真实企业 ACV 或渠道级盈利能力。这个缺口尤其重要，因为 DJI
              的相邻影像市场正在吸引 Insta360、智能手机 OEM 和云台竞争者，而美国限制可能封顶其在高端市场的新机型可得性。因此，公开牵引力很强；私有指标可见度仍是尽调阻塞点。
