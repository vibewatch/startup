          tone: neutral
        - label: 购买硬件套装
          detail: 买家通过商店或经销商选择无人机、载荷、遥控器、电池、配件或 Agras 套装
          tone: positive
        - label: 培训并作业
          detail: 公共安全飞手、农场操作员和企业团队把 FAA 规则、培训和任务工作流纳入日常作业
          tone: positive
        - label: 增加软件或自动化
          detail: FlightHub 2、Terra、Dock、本地部署、测绘和服务中心，让使用不止于首架飞机
          tone: positive
        - label: 评估是否替换
          detail: 美国客户评估 FCC / DoD 限制、零部件可得性，以及是继续留用 DJI，还是转向获批替代方案
          tone: warning
    approximationNotes: 旅程阶段综合了现存公开材料；不是测得的转化率。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU011
      - CU023
      - CU027
      - CU036
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据在广泛采用和 El Paso 具体部署上最强，到了留存和账户级经济性就薄得多。
    data:
      items:
        - label: 细分需求可见
          value: 5
          displayValue: 5/5
          detail: 消费级、企业、公共安全和农业用例呈现充分
          tone: positive
        - label: 保有量已量化
          value: 4
          displayValue: 4/5
          detail: 农业无人机 / 操作员数据和美国公共安全机队估计值提供规模锚点
          tone: positive
        - label: 具名生产级证明
          value: 3
          displayValue: 3/5
          detail: El Paso 证据强，但更广泛的具名客户覆盖不完整
          tone: warning
        - label: 复购与留存证明
          value: 1
          displayValue: 1/5
          detail: 支持、服务中心和政策依赖只是代理指标，不是续约指标
          tone: risk
        - label: 客户集中度经济性
          value: 0
          displayValue: 0/5
          detail: 细分收入、头部账户和渠道库存未公开
          tone: risk
    approximationNotes: 数值是 0 到 5 的公开证据有序评分，不是漏斗转化率或客户数量。
    claimRefs:
      - CU004
      - CU006
      - CU013
      - CU014
      - CU015
      - CU022
      - CU024
      - CU039
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 客户证明高度不均；El Paso 和农业规模证据强于留存或企业账户经济性。
    data:
      columns:
        - 具名背书质量
        - 结果具体性
        - 生产成熟度
        - 留存可见度
      rows:
        - label: El Paso 公共安全
          values:
            - label: 高
              tone: positive
              detail: 独立来源和 DJI 关联来源都点名了市政官员
            - label: 高
              tone: positive
              detail: 22 个 Dock，响应时间从约 45 分钟缩至数分钟
            - label: 高
              tone: positive
              detail: 全市跨机构 DFR 部署
            - label: 低
              tone: risk
              detail: 未披露续约、机队替换或合同期限
        - label: Spring Valley 消防
          values:
            - label: 中
              tone: warning
              detail: 在 DJI 发布的访谈中具名
            - label: 中
              tone: warning
              detail: 描述了搜救、野火和地形场景，但未量化
            - label: 中
              tone: warning
              detail: 描述了专门项目，但缺少机队规模
            - label: 低
              tone: risk
              detail: 没有支出、期限或复购数据
        - label: 农业生态系统
          values:
            - label: 低
              tone: warning
              detail: 用例研究很多，但客户名称很少
            - label: 高
              tone: positive
              detail: 400,000 架无人机 / 操作员、作物案例和效率案例
            - label: 高
              tone: positive
              detail: 声称已在 100 个国家田间部署
            - label: 中
              tone: warning
              detail: 服务和教员网络暗示耐久性，但不是留存百分比
        - label: 工业企业
          values:
            - label: 低
              tone: risk
              detail: Deutsche Bahn 参考证据薄，且未确认仍然有效
            - label: 低
              tone: risk
              detail: 企业页面描述了工作流，但量化客户结果很少
            - label: 中
              tone: warning
              detail: Matrice、Dock、Terra 和 FlightHub 都是面向生产的产品
            - label: 低
              tone: risk
              detail: 缺少账户续约和扩张证明
    approximationNotes: 定性矩阵评分概括的是证据质量，不是客户满意度。
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU030
      - CU032
      - CU033
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 尽管没有公开续约队列，代理留存分数仍显示哪些场景最可能具备耐久性。
    data:
      columns:
        - 购后留用
        - 第 1 年活跃
        - 第 2 年活跃
        - 续约可见度
      rows:
        - label: 农业操作员生态代理
          values:
            - 90
            - 80
            - 65
            - 35
        - label: 公共安全存量机队代理
          values:
            - 88
            - 82
            - 55
            - 25
        - label: 消费级创作者配件代理
          values:
            - 70
            - 45
            - 30
            - 15
    approximationNotes: 代理百分比是尽调辅助框架，根据对支持 / 服务的依赖和切换成本推断；DJI 不公布队列留存。
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU034
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 在公开缓释措施之后，按发生可能性和影响定位 DJI 剩余风险。
    data:
      columns:
        - 致命影响
        - 高影响
        - 中等影响
      rows:
        - label: 高可能性
          values:
            - tone: negative
              label: FCC 阻断美国新机型授权
            - tone: negative
              label: DoD 定性让采购污名延续
            - tone: neutral
              label: 美国现有机队仍可使用，但持续老化
        - label: 中等可能性
          values:
            - tone: negative
              label: Blue UAS 替代品拿下受限细分市场
            - tone: negative
              label: OnDefend 审计之后，安全疑虑仍在
            - tone: neutral
              label: 经销商库存和支持摩擦上升
        - label: 低可能性
          values:
            - tone: negative
              label: 不利发回重审扩大黑名单理由
            - tone: neutral
              label: 专利赔偿扰乱某个产品系列
            - tone: neutral
              label: 农业事故触发地方限制
    approximationNotes: 定性位置基于公开法院记录、FCC、市场份额和技术审计证据，不是统计损失模型。
    claimRefs:
      - CR007
      - CR010
      - CR011
      - CR016
      - CR017
      - CR019
      - CR021
      - CR029
      - CR032
      - CR040
      - CR041
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 政策和认知风险如何传导到 DJI 的收入、客户、利润率、融资和估值。
    data:
      nodes:
        - id: regulatory
          label: 美国监管排除
          description: FCC Covered List 加 Section 1260H 定性
        - id: legal
          label: 诉讼发回重审
          description: D.C. Circuit 部分胜诉，但定性仍然成立
        - id: security
          label: 安全认知
          description: OnDefend 有帮助，但供应链担忧仍在
        - id: channel
          label: 美国渠道可得性
          description: 新机型授权和进口路径
        - id: customers
          label: 客户替换决策
          description: 公共安全、企业、创作者和农业买家
        - id: competitors
          label: 获批替代品
          description: Skydio 和通过 Blue UAS 认证的美国本土选项
        - id: financials
          label: 收入和利润率下行
          description: 美国收入占比和渠道经济性仍未披露
        - id: valuation
          label: 退出和估值折价
          description: 非公开财务数据不透明叠加高风险评级
      edges:
        - from: regulatory
          to: channel
        - from: regulatory
          to: competitors
        - from: legal
          to: regulatory
        - from: security
          to: regulatory
        - from: channel
          to: customers
        - from: competitors
          to: customers
        - from: customers
          to: financials
        - from: channel
          to: financials
        - from: financials
          to: valuation
        - from: legal
          to: valuation
    approximationNotes: 有向连线展示风险评级采用的主要因果路径；边权重为定性判断。
    claimRefs:
      - CR006
      - CR010
      - CR014
      - CR016
      - CR019
      - CR021
      - CR022
      - CR034
      - CR036
      - CR040
      - CR043
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 关键依赖决定 DJI 能否守住美国准入和全球运营韧性。
    data:
      nodes:
        - id: dji
          label: DJI 运营核心
          description: 产品、软件、支持、农业和企业平台
        - id: fcc
          label: FCC 授权路径
          description: Covered List、新设备授权、豁免
        - id: dod
          label: DoD / Section 1260H
          description: 采购和定性状态
        - id: auditors
          label: 独立安全审计方
          description: OnDefend 和未来定期评估
        - id: dealers
          label: 商店和经销商
          description: 库存、支持、保修、维修履约
        - id: supply
          label: 零部件供应链
          description: 产地、认证、本地化和韧性
        - id: management
          label: 创始人主导的管理层
          description: 治理、接班和法律执行
        - id: buyers
          label: 企业和公共安全买家
          description: 采购信心和更新决策
        - id: rivals
          label: Blue UAS / 美国本土对手
          description: Skydio 和其他获批供应商
      edges:
        - from: fcc
          to: dji
        - from: dod
          to: dji
        - from: auditors
          to: fcc
        - from: supply
          to: fcc
        - from: dealers
          to: buyers
        - from: dji
          to: dealers
        - from: dji
          to: buyers
        - from: management
          to: dod
        - from: management
          to: fcc
        - from: rivals
          to: buyers
        - from: supply
          to: dealers
    approximationNotes: 依赖项是公开证据节点；供应商、股权结构表和组织架构的非公开数据仍未验证。
    claimRefs:
      - CR018
      - CR021
      - CR023
      - CR027
      - CR028
      - CR033
      - CR036
      - CR039
      - CR042
      - CR044
      - CR045
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从规模和估值证据走向观察建议的决策链。
    data:
      nodes:
        - id: scale
          label: 领先份额和产品生态
        - id: financials
          label: 收入口径冲突，且没有审计报表
        - id: valuation
          label: US$15B 锚点对比 US$20-22B 老股交易线索
        - id: regulation
          label: 美国 Covered List 和 DoD 定性压住溢价市场
        - id: scenarios
          label: 悲观 / 基准 / 乐观区间：US$12B / US$18B / US$25B
        - id: decision
          label: 观察，中等信心，高风险，估值合理
      edges:
        - from: scale
          to: valuation
        - from: financials
          to: valuation
        - from: regulation
          to: scenarios
        - from: valuation
          to: scenarios
        - from: scenarios
          to: decision
    approximationNotes: null
    claimRefs:
      - CV011
      - CV012
      - CV027
      - CV028
      - CV031
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 简单敏感性指标显示哪些证据缺口最能推动估值变化。
    data:
      items:
        - label: 基于 US$11.5B 收入的锚定倍数
          value: 1.3
        - label: 基于 US$4B 收入的锚定倍数
          value: 3.75
        - label: 老股交易中点对锚点溢价 (%)
          value: 40
        - label: Skydio 价值占锚点比例 (%)
          value: 30
        - label: 美国授权悬顶严重度 (1-10)
          value: 9
        - label: 安全审计缓释价值 (1-10)
          value: 3
    approximationNotes: 收入倍数和百分比是基于公开估值标记四舍五入得到的方向性敏感性，不是审计计算。
    claimRefs:
      - CV008
      - CV009
      - CV017
      - CV020
      - CV028
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 用于投资讨论的悲观、基准和乐观企业价值区间，单位 US$B。
    data:
      items:
        - label: 悲观情景 EV (US$B)
          low: 10
          base: 12
          high: 14
        - label: 基准情景 EV (US$B)
          low: 15
          base: 18
          high: 22
        - label: 乐观情景 EV (US$B)
          low: 22
          base: 25
          high: 30
    approximationNotes: 区间由公开估值锚点、老股交易线索、收入视角和监管结果交叉校准；没有可用的私下交易条款。
    claimRefs:
      - CV001
      - CV002
      - CV030
      - CV031
      - CV032
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 供 IC 使用的数字指标，覆盖评分、风险、估值锚点和尽调优先级。
    data:
      items:
        - label: 核心估值锚点 (US$M)
          value: 15000
        - label: 总体评分 (0-10)
          value: 6
        - label: 风险严重度 (1-10)
          value: 8
        - label: 全球民用无人机份额 (%)
          value: 70
        - label: 证据可信度 (1-10)
          value: 5
        - label: 监管悬顶 (1-10)
          value: 9
        - label: 尽调关键性 (1-10)
          value: 9
    approximationNotes: 估值和市场份额 KPI 使用报告规范值；其他分数是作者按 1-10 尺度作出的判断。
    claimRefs:
      - CV001
      - CV012
      - CV018
      - CV046
      - CV047
