      - number: '1.5'
        title: 封面指标与证据缺口
        blocks:
          - type: paragraph
            body: >-
              将身份层压缩成头部指标后，得到的是一家定性容易、定量困难的公司。较有把握的指标包括成立日期（2006）、创始人与总部、约 70% 的民用无人机份额和产品线；估计指标包括约 US$15 billion
              的估值锚点和约 14,000 名员工；真正未解决的指标是经审计收入、毛利率与净利率、精确累计融资，这些都仍属私有信息，且不同来源口径不一。无法支撑的数字应以 null
              保留，并配上具体尽调路径——收入需要索取经审计报表或监管文件，融资需要用一手股权结构表核对 Forge、媒体和 Wikipedia 口径。DJI 的规模远超 Skydio 等西方同业（2026 年私募估值约
              US$4.4 billion），这也奠定了后续竞争和估值章节的框架。读者需要记住的核心限定是：DJI 的披露画像是私营且未公开披露；产品和市场证据强，经审计经济数据与治理细节弱。
