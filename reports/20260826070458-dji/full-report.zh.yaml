      - number: '8.5'
        title: 尽调要求和投资路径
        blocks:
          - type: paragraph
            body: >-
              投资路径很直接：继续跟踪资产，索取一手证明，让证据而不是品牌主导地位推动建议。纪律化入场需要经审计收入、产品线利润率、现金转化、地域结构、股权结构条款、老股定价机制、股东转让权利，以及法律 /
              监管应急计划。如果买方能承受中美政策风险，显著低于锚点的价格值得启动工作；若价格接近或高于 2026
              年老股交易迹象，就需要证明高收入视角和非美国增长引擎真实存在。反过来，如果无法证明收入、美国敞口或豁免策略，即使产品护城河仍然突出，立场也应转为回避。这样才能在不确定性下守住纪律。
