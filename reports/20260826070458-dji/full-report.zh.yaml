            body: >-
              部署成熟度因细分而异。消费者和手持产品以零售为主，通过 DJI Store、产品支持、保障计划、配件和固件 / 软件更新获得支持。企业部署更像集成商项目：买方选择机体、载荷、控制器、Dock 和软件工作流，再按
