  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              围绕 DJI 的可投资市场，应界定为民用和商用无人航空系统，而不是所有提到无人机的国防
              UAV、反无人机或机器人机会。应纳入的支出包括飞行器、载荷、电池、地面控制软件、飞行管理工作流、培训、配件，以及影像、巡检、公共安全、制图、建筑、农业和创作者使用中的服务型部署。应排除大型军用项目、反 UAS
              系统、无关相机配件和无人机配送基础设施，除非买方实际采购的是与 DJI 兼容的飞行器或软件。这条边界让分析聚焦 DJI 能变现的部分：机队周期性更新需求、企业工作流软件、农业喷洒 /
              撒播系统和零售准专业硬件。现状替代方案仍然很强：人工巡检队、直升机、固定摄像头、拖拉机和地面喷雾机、外包测绘人员；在美国公共部门采购中，还包括因政策而非产品优势被替换上来的 Blue UAS 合规竞争者。
