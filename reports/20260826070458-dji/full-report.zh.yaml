        - 中
        - 高
        - 合理
        - 维持覆盖和尽调准备，但在缺少一手财务和监管清晰度前，不支持买入。
      - - 上调路径
        - 中
        - 高
        - 只有低于锚点或有证据时才有吸引力
        - 若经审计经营数据支持高收入口径，且美国限制风险收窄，则上调。
      - - 下调路径
        - 中
        - 极高
        - 偏高
        - 若收入更接近低口径，且美国新机型准入仍受阻，则转为回避。
      - - 持有 / 退出框架
        - 低
        - 高
        - 合理
        - 老股流动性可能存在，但公司整体 IPO 可选性看起来较弱，时间也不确定。
    notes: 建议行反映按证据加权后的判断，不是正式投资要约或经审计估值意见。
