      - number: '8.3'
        title: 可比参考点
        blocks:
          - type: paragraph
            body: >-
              可比对象刻意不是完美匹配。Skydio 是最接近的私人无人机可比公司，因为美国国防和公共安全政策优势推高了其 2026 年数十亿美元估值，但它规模明显小于 DJI，并且受益于伤害 DJI
              的同一套政策。Parrot 提供公开市场治理和无人机聚焦度，但规模太小，无法为 DJI 定价。Mobileye 提供了自动驾驶硬件先例，公开投资者曾将其估值放在 US$20B 出头区间，但它是汽车半导体 /
              软件公司，不是无人机制造商。因此，可比分析支持的是公平性校验，而不是公式：DJI 相对多数无人机同行应有规模溢价，相对不受地缘政治限制的自主硬件则应有地缘政治折价。
