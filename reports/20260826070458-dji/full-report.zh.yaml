      - number: '8.4'
        title: 监管、退出和投资逻辑失效
        blocks:
          - type: paragraph
            body: >-
              美国监管记录，是一家主导型公司仍拿不到买入判断的主要原因。Covered List 框架阻断受覆盖的外国制造 UAS
              新授权，同时保留大量既有使用；这意味着近期装机基础价值和长期新机型价值开始分化。诉讼记录也只是部分改善：D.C. Circuit 发回重审带来程序性筹码，但没有移除 DoD
              指定，也没有解决涉密证据。安全审计证据有助于 DJI
              反驳技术指控，但两套系统的一次性干净审计，无法单独逆转基于原产国的政策。终止触发点因此是法律和商业因素，而不是产品质量：没有豁免路径、没有经审计经济数据，也没有按假设价格退出的可信路径。
