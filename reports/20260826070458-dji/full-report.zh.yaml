        - 需要可重复且能被持怀疑态度监管方接受的技术证据
        - 高
        - 高
        - OnDefend 审计以及公司声称对低风险观察项的整改
        - 审查审计范围、SBOM、漏洞管理和变更控制计划
      - - 财务和控制
        - 经审计 P&L、美国收入拆分、股权结构表和采购控制未公开
        - 高
        - 高
        - 据报道的组织改革和历史规模
        - 获取经审计财务、渠道拆分、准备金、控制测试和内部审计报告
      - - 人才留存和资深技术深度
        - 报道称人才密度高，但也存在人才流动争议
        - 中
        - 中
        - 高密度人才储备和雇主品牌主张
        - 索取组织架构图、离职率、关键岗位覆盖和激励计划
    notes: 人员和执行风险仅基于公开来源评估；要下调剩余敞口，仍需私人管理材料。
