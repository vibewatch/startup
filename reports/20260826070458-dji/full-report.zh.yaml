  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 哪些因素会改变判断
    rows:
      - - 投资逻辑：DJI 是占据全球份额的主导无人机和影像平台，产品节奏和农业装机基础扎实。
        - 若经审计财务确认收入规模、利润率和地域多元性，信心会提高。
      - - 投资逻辑：按高收入口径看，US$15B 锚点可能不贵。
        - 数据室 P&L 若证实 CN¥80B 收入和 CN¥20B 利润，将支持上调。
      - - 反向逻辑：美国限制压住高端市场增长和退出可选性。
        - 稳定的 FCC/DoD/DHS 豁免，或法院结果撤销认定，将降低折价。
      - - 反向逻辑：私营披露和股权结构表条款不透明。
        - 一手股权结构表、优先股堆叠和老股条款，会决定入场价是否可投。
      - - 反向逻辑：老股标价可能反映卖方流动性，而非公司认可的价格发现。
        - 大额、独立交易、经公司批准且条款透明的老股交易，将提高可靠性。
    notes: 论点综合公开来源；“哪些因素会改变判断”列是尽调触发点，不是已验证的当前证据。
    claimRefs:
