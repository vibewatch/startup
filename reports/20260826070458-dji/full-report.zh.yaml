        - Matrice 级飞行器、Dock 自动化、载荷、Terra / FlightHub 工作流软件、经销商服务
        - 无人机工作流之外的完整资产管理套件和工程劳务
        - 公用事业、建筑、能源、测绘、矿业、设施团队
        - ASP 更高、机队反复换新，但买方信任和合规比消费级参数更重要
      - - 公共安全和政府行动
        - 飞行器、热成像载荷、停机坪、培训、维护、应急响应工作流
        - 调度软件、无线电、巡逻车、直升机和非 UAS 指挥系统
        - 警察、消防、应急管理、市政采购部门
        - 运营 ROI 强，但最受美国国家安全采购政策约束
      - - 农业无人机和服务
        - Agras 喷洒 / 撒播机、载荷、电池、任务软件、经销商服务、DaaS 喷洒
        - 拖拉机、农化品、灌溉设备、与无人机作业无关的农艺服务
        - 农户、合作社、农业服务商、政府补贴项目
        - 快速增长的切入点，DJI 拥有专用产品和据报道的全球部署规模
      - - 无人机配送和 UAM 邻近领域
        - 仅纳入 DJI 类民用无人机平台参与的飞行器和空域技术
        - 垂直起降机场、物流网络、载人 eVTOL、医疗配送运营网络
        - 物流运营商、医院、城市项目、航空监管机构
        - 有用的增长信号；除非硬件 / 服务范围改变，否则大多不在 DJI 当前核心内
      - - 反 UAS 和防务系统
        - 除负面背景外，不纳入 DJI 可投资民用市场边界
        - 雷达、干扰、动能拦截器、军用 UAV 项目、导弹
        - 各国国防部、关键基础设施安全买家
        - 排除在 DJI TAM 之外；但仍会影响认知、限制和美国政策风险
    notes: 边界基于公开 UAV 定义、DJI 产品界面、市场报告范围和美国监管语言；它有意将防务和反 UAS 收入排除在 DJI 民用市场规模之外。
