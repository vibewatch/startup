  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与相互冲突的规模信号
        blocks:
          - type: paragraph
            body: >-
              DJI 的公开收入模式仍然高度硬件驱动：消费级和准专业无人机、手持相机、稳定器、企业无人机和 Dock、农业飞行器、电池、配件、质保 / 服务计划，通过 DJI
              自有门店、授权零售商和经销商主导的企业渠道销售。部分产品的官方标价可见，例如欧洲的 Mavic 4 Pro 套装、US$439 的
              Flip，以及低端门店优惠；但实际平均售价（ASP）、折扣、区域结构和收入确认并不公开。最大的规模输入不是确定值，而是冲突值。较早外部估计集中在年收入约 US$3.5–5.0B；中国财经媒体和 Wikipedia
              信息框则引用 2025 年收入约 CN¥80B，约 US$11.5–11.8B，净利润超过 CN¥20B。经审计报表调和这些数字之前，尽调应把报告收入作为区间处理，并把经审计收入运行率、ARR、毛利率、NRR
              和客户数保留为 null。
