      - number: '7.4'
        title: 依赖集中在监管、创始人控制和证据不透明上
        blocks:
          - type: paragraph
            body: >-
              作为一家盈利的硬件龙头，DJI 的依赖图异常偏政策。美国监管机构、DoD/FCC 法律程序、Blue UAS
              豁免渠道、经销商、支持基础设施和独立安全评估机构，如今决定公司能否继续服务高价值美国需求。公司内部，公开证据指向以创始人为中心的工程文化、高管接班透明度有限，以及一桩与组件成本虚高相关的历史内控事件。DJI
              保持私人公司披露边界，避开上市公司审视；同一披露画像也削弱尽调：经审计收入、利润率、美国收入占比、精确组件来源和当前资本结构，都无法从监管文件取得。这些缺口不能证明运营模型脆弱，但会推高剩余风险评级，因为投资者无法独立量化下行、治理韧性，或管理层适应美国排除制度的速度。
