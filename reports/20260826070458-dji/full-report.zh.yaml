            body: >-
              DJI 的依赖项异常互锁。OcuSync/O4+ 无线设计、云台控制、相机传感器、电池、飞控、应用、云服务和制造规模相互强化产品护城河，但也制造集中的监管、供应链和验证风险。围绕 FCC
              无线指纹和替代品牌的实务来源证据显示，专有传输硬件足够独特，可以暴露重新贴牌的 DJI 关联产品；当公司销售高性能生态时，这是护城河；当政策制定者瞄准组件而非标识时，它又是弱点。Anzu、Autel 和
              Skydio 等替代方案在特定工作流中可信，但公开比较仍把 DJI 的 Mavic Enterprise
              产品线描述为飞行时间、相机、软件成熟度和用户熟悉度上的基准。待解尽调问题很具体：获取产品线毛利率和质保数据、软件正常运行时间和事故日志、完整 SBOM
              与固件更新政策、超出两款产品的安全审计范围，以及无线、电池、传感器、相机和控制器的供应链暴露。
