            body: >-
              产品架构是一套栈：机体或手持机身、推进与电池、相机或专用载荷、稳定云台、无线链路、自主软件、机队软件和售后支持。DJI 的公开证据在硬件和载荷层最强：Mavic 4 Pro 结合 100MP Hasselblad
              相机、双长焦相机、360 度云台、升级的全向避障、标称 51 分钟续航和 O4+ 传输；Zenmuse P1 结合 45MP 全画幅传感器、稳定云台、机械快门和 TimeSync；Dock 2
              加入带云端功能的耐候远程部署；Agras T100/T70P/T25P 加入
              LiDAR、雷达、视觉系统、大载荷和自动航线。较不透明的层是封闭固件、芯片组、数据处理和机队云可靠性，因此尽调负担要从产品手册转向独立技术审计、FCC 文件、客户遥测和私有工程文档。
