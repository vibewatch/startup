      - number: '7.3'
        title: 安全证据有帮助，但运营风险仍在
        blocks:
          - type: paragraph
            body: >-
              文件中最有利的风险证据是技术性的：据报道，OnDefend 对 Air 3S 和 Matrice 4E 进行了五个月审查，没有发现严重、高危或中危漏洞，没有隐藏后门，没有无法解释的 RF
              发射，也没有测试到数据流出美国。这显著收窄了数据安全指控的一种版本，但不能为每一款机型、每一次固件发布、每个 Dock 部署、每条云路径、每个供应商组件或未来更新提供一揽子放行。DJI
              自身产品路线图通过更远距离传输、更丰富传感器、远程 Dock
              作业、农业喷洒和联网企业软件扩大了运营暴露面。支持和官方服务渠道可以缓解普通可靠性风险，但尽调仍应要求持续审计、固件变更控制、漏洞修复证据、安全事故历史，以及按司法辖区核验运营合规，然后才能把这次审计视为耐久的风险缓释因素。
