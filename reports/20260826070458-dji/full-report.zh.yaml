      - number: '5.4'
        title: 信任、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任是产品技术中的决定性问题，因为 DJI 的性能优势嵌在飞行器、控制器、无线链路、应用、载荷、Dock、电池和云软件里，而美国监管者越来越把这些视为安全敏感的 UAS 组件。DJI 最强的反证是 2026 年
              5 月 OnDefend 对 Air 3S 和 Matrice 4E 系统的评估：测试单元中严重、高、中风险发现均为零，没有隐藏后门，没有向美国境外传输数据，没有无法解释的 RF
              辐射，也没有供应链篡改。限制同样清楚：这是一次由 DJI 授权、针对特定消费级和企业配置的时点评估，同一来源还建议在软件、固件和硬件版本变化时持续验证。因此，即使技术证据有利，FCC Covered List
              政策仍是产品约束，因为除非获得豁免，新的外国制造 UAS 和关键组件无法取得美国设备授权。
            claimRefs:
