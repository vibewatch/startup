      - number: '8.2'
        title: 估值视角和情景
        blocks:
          - type: paragraph
            body: >-
              收入冲突是估值支点。如果中国财经报道和 IPO 前摘要方向正确，US$15B 锚点接近 1.3x 收入，对一家盈利的全球市场龙头并不贵。如果较早 US$3.5-5B 估计更接近事实，同一锚点约为 US$4B
              中点收入的 3.75x，而 2026 年老股交易迹象就需要对利润率、增长和最终退出抱有更多信心。因此基准情景采用比上市公司可比模型更宽的区间：悲观约 US$12B，基准约 US$18B，乐观约
