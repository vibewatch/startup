              如果中国媒体关于 2025 年高利润的说法属实，DJI 大概率不像一家依赖融资的公司；但没有现金、债务和营运资本明细，这个结论不能直接采信。公开资本历史只提供背景：广泛引用的媒体和数据库来源指向大额历史私募轮，而
              Forge 显示的可追踪融资总额小得多，并提醒私营公司指标依赖有限输入。当前手头现金、月度烧钱、现金跑道月数、库存融资、供应商应付款、资本开支承诺，以及债务或项目融资义务，在公开证据中全部为
