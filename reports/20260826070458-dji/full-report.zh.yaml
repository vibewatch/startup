          - type: callout
            title: 美国市场准入是 SAM 约束，不只是法律脚注
            body: FCC Covered List 和相关外国无人机限制阻止被列管的外国生产 UAS 获得新授权，同时允许既有设备继续使用，因此美国与非美国客户的替换周期和新机型发布可能大幅分化。
