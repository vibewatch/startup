      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              DJI 的身份与创始人 Frank Wang（Wang Tao，汪滔）分不开。Wang 1980 年生于杭州，在 Hong Kong University of Science and Technology
              读书时做出公司最早的飞控原型，2006 年迁至深圳招聘第一批员工。Wang 仍是控股股东，也是技术和文化上的核心人物；公开资料估计他 2026 年净资产约 US$4.8–5.1 billion，这一数字基本跟随
              DJI 的私募市场价值。治理信息本来披露得很少：除 Wang 之外，DJI
              对董事会、高管梯队或接班计划披露极少，过往报道还描绘过一种强度很高、由创始人驱动的内部文化。对投资者而言，这形成了清晰的关键人物依赖和治理透明度缺口——公司方向、资本配置和地缘政治应对都看起来系于一人；缺少可见的独立董事会或经审计控制，不是中性遗漏，而是实质尽调红旗。2019
              年内部舞弊披露是历史上最清楚的信号：DJI 估计员工抬高成本造成最高 CN¥1 billion（~US$147 million）损失，内部控制需要重点核查。
            claimRefs:
