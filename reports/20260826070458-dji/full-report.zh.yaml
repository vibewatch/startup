  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监控触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - FCC Covered List / 进口封锁
        - FCC 或 DoW/DHS 对 UAS 授权的决定
        - 下次评审前，DJI 新机型仍无条件批准或豁免路径
        - 维持观察；避免新增资金暴露在依赖美国市场的上行空间
      - - DoD CMC 认定
        - 地区法院发回重审及后续任何上诉
        - 认定凭保密理由延续，且没有缩窄性救济
        - 将美国公共部门上行空间视为结构性受损
      - - 安全观感
        - 独立审计频率和监管回应
        - 没有按机型持续审计，或出现重大且未被反驳的发现
        - 下调企业 / 公共安全采纳假设，并提高尽调负担
      - - 美国收入集中度
        - 经审计地域 / 渠道拆分
        - 美国收入或高利润率敞口高且未缓释
        - 要求更低入场价；若下行无法量化则回避
      - - Blue UAS 替代
        - 公共安全和企业采购份额
        - 买家在换新周期标准化采购 Skydio 或其他获批供应商
        - 下调长期美国份额假设
      - - IP / 专利诉讼
        - 案件卷宗、损害准备金或和解
        - 重大禁令、反复赔偿，或没有自由实施方案
        - 要求法律准备金和产品线应急方案
      - - 创始人 / 治理
        - 接班和授权控制证据
        - 尽调中未出现可信接班计划或独立监督证据
        - 对控制敏感型投资结构不予推进
      - - 披露不透明
        - 数据室质量
        - 经审计财务、股权结构表和控制资料仍不可得
        - 建议维持观察或继续研究，不买入
    notes: 否决标准是可监控事件或数据室结果；它们不是预测，应在法院或 FCC 流程推进时刷新。
