              主站和经销商购买相机无人机、手持相机、云台、电源产品和配件；最终用户和付款方常常是同一个人或小型创作团队，因此证明来自产品广度和市场可见度代理指标，而不是具名账户。企业买方更机构化：警察、消防、机场、巡检、测绘、建筑、采矿、公用事业和安保团队，会通过企业经销商和解决方案页面评估
