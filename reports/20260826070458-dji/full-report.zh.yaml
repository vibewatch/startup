      - number: '1.4'
        title: 里程碑与发展轨迹
        blocks:
          - type: paragraph
            body: >-
              DJI 二十年的轨迹，从深圳宿舍里的飞控生意，走到定义品类的消费级无人机品牌，又进一步成为中美技术争端的中心。产品主线有清晰时间点：开箱即飞的 Phantom（2013）打开消费市场，可折叠的 Mavic
              Pro（2016）定义便携相机无人机；2024–2025 年推出 US$199 的 Neo、US$439 的 Flip，以及旗舰 Mavic 4 Pro（2025 年 5 月 13 日发布，搭载 100MP
              Hasselblad 传感器），说明即便美国可得性收紧，硬件领先仍在延续。融资和反向事件主线同样重要：2015 年和 2018 年融资、2019 年舞弊披露、2022 年 10 月 U.S. Department
              of Defense 将 DJI 列入「Chinese Military Company」名单、DJI 2024 年 10 月起诉该列名、2025 年 9 月地区法院败诉、2025 年 12 月 FCC
              Covered List 新增 DJI 并限制进口，以及 2026 年 8 月部分上诉胜诉、案件被发回重审。后续每章讨论身份、资本、规模和监管背景时，都应以这条统一时间线为参照。
