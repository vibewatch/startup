      - number: '2.5'
        title: 尽调含义与未解决缺口
        blocks:
          - type: paragraph
            body: >-
              市场尽调应保留三类缺口，而不是强行给出虚假精度。第一，分析师使用的单位彼此不兼容：只算硬件、民用 / 商用硬件加软件、无人机服务、国防、配送网络，会得出显著不同的
              TAM，因此估值应在多个市场定义下做敏感性分析。第二，DJI 的份额估计方向性很强，但未经审计；70% 民用份额、80%+ 美国消费者份额和 Dedrone 83.48%
              的探测份额描述的是相关但并不相同的人群。第三，监管结果可以把本来可服务的市场变成不可进入市场，尤其是 FCC Covered List
              和外国无人机限制之后的美国新机型。这个市场因此有吸引力，但并不顺滑：上行情景依赖非美国需求、农业、巡检和自主运营放量；下行情景则是美国高端 SAM 收缩，采购被拉向本土或 Blue UAS 替代方案。
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 用多个 TAM 口径，而不是一个头部市场数字
            body: 无人机市场估计差异很大，因为分析师纳入的硬件、软件、服务、国防、配送和区域活动组合不同。DJI 的估值工作应围绕窄口径民用硬件、商业系统和更宽的无人机经济情景做敏感性分析，而不是机械锚定最大的公开 TAM。
            calloutType: insight
            claimRefs:
