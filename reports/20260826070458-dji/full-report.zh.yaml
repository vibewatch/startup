      - number: '2.4'
        title: 增长驱动、约束与采用节奏
        blocks:
          - type: paragraph
            body: >-
              市场驱动因素是结构性的：无人机自主能力、传感器载荷、BVLOS 规则制定、劳动力短缺、精准农业经济性、巡检安全收益和自动机场式部署，都会把买方从试点拉向重复机队采购。DJI
              受益，是因为许多驱动因素更利好一体化硬件、软件、电池、载荷和经销商支持，而这些正是公司已积累规模的栈层。约束同样实质。FAA 和各国规则仍决定谁能商业飞行；FCC Covered List
              现在阻止被列管的外国生产无人机在美国获得新的授权；处理公共安全或关键基础设施任务的买方，即使既有无人机仍可运行，也会面对信任与数据安全审查。农业还有另一种瓶颈：购置和维护成本高，使无人机即服务和补贴成为小农户市场采用的核心。
