chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、结构与产品版图
        blocks:
          - type: paragraph
            body: >-
              DJI 的法定主体为 SZ DJI Technology Co., Ltd.（深圳市大疆创新科技有限公司），品牌源自「Da-Jiang Innovations」。公司成立于 2006 年 1 月 18
              日，总部位于中国广东深圳南山区 DJI Sky City。DJI 是一家私营机器人与影像公司，产品版图覆盖消费级相机无人机（Mini、Air、Mavic、Neo、Flip）、企业平台（Matrice、Dock
              自动化机库、Zenmuse 载荷）、农业喷洒无人机（Agras）和手持影像设备（Osmo 相机、Ronin 云台）。公司从未完成 IPO，至今由创始人控制；DJI 称国家关联投资者持股不足 6%、投票权不足
              1%。这套结构对尽调很关键：经济上行和治理控制都集中在一处，同时公司也不必像上市同业一样披露经审计的公开信息。后续章节可复用的一句话是：DJI
              销售垂直整合的飞行相机与机器人硬件，加上企业软件，收入主要来自通过自有门店和经销商在全球销售硬件。
