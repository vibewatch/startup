        title: 切换成本、锁定效应与渠道力量
        blocks:
          - type: paragraph
            body: >-
              DJI 的护城河不只是机体。运营方围绕平台购买电池、控制器、载荷、云端和制图工作流、维护流程、飞手培训、备件和经销商支持。即便监管者或采购官想走非 DJI 路线，这也会形成实际锁定。FCC
              关于继续使用的表述强化了这种动态，因为既有 DJI 机队可继续服役，新采购则缓慢迁移到 Blue UAS 或本土替代方案。在公共安全领域，这鼓励多栖部署：机构保留 DJI 以支撑已安装工作流，为新预算测试
              Skydio 或其他合规系统，并把美国制造的专用平台留给采购信任重于性价比的任务。因此，竞争者先赢下切入口账户，之后才谈整队替换；这个切口大小更多取决于采购规则，而不只是产品偏好。
