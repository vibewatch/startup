            body: >-
              不利政策动作之所以重要，是因为 DJI
              不是失去一个小众渠道的小供应商；在消费、商用、公共安全、农业、巡检和创作者等大量场景里，它都是默认供应商。平常市场中，这种主导地位是优势；但一旦某个高端市场对新机型关门，冲击也会被放大。美国现有用户仍可继续使用获批设备，这会放慢眼前流失，也保住配件和服务的装机基础；但如果
              DJI 新机型持续受阻，产品迭代、维修、企业换新和公共部门采购会逐步转向获准替代品。传导路径很直接：失去 FCC 授权会拖慢发布节奏，渠道合作伙伴缺少高端库存，客户面临更高替换成本或采购摩擦，Skydio
              等竞争对手则在急救响应、巡检、场地安防和国家安全工作流中拿到政策支撑的机会。
