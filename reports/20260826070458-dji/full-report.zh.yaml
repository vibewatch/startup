      - number: '1.3'
        title: 融资历史、估值与规模
        blocks:
          - type: paragraph
            body: >-
              DJI 的资本历史真实存在，但披露很薄。媒体和 Wikipedia 记录了 2015 年约 US$500 million 的一轮融资（被提及的投资方包括
              Accel、Sequoia/HongShan、GIC、New China Life Insurance 和 New Horizon Capital），以及 2018 年为香港上市募集的约 US$1 billion
              IPO 前融资，但上市最终没有发生；Forge 等私募市场数据库记录的金额小得多（约 US$108 million、三轮），因此真实累计融资确实无法确定。估值上，最常用的锚点约为 US$15
              billion——Forge 引用截至 2025 年 4 月的「最后已知估值」，Hurun Global Unicorn Index 2025 也将 DJI 列入 1,523 家独角兽之一——而 2026
              年二级市场报道指向更接近 US$20–22 billion 的隐含企业价值，部分股东以小幅折价出售股份。规模比估值更容易举证：DJI 约占全球民用无人机市场 70%，员工约 14,000 人（部分估计到
              ~17,000 人），中国财经媒体报道 2025 年收入接近 CN¥80 billion（~US$11.5 billion）、净利润超过 CN¥20 billion。若这些数字准确，DJI
              既很大，也对硬件公司而言异常赚钱；但它们与较早的 US$3.5–5 billion 分析师估计冲突。
