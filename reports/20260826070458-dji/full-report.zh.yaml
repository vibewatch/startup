        blocks:
          - type: paragraph
            body: >-
              公开单位经济方向上有吸引力，但没有资料室就无法真正落入投资模型。正面证据是结构性的：DJI
              位于深圳密集电子生态中，采用垂直整合的工程和制造；官方产品规格展示的高端相机、云台、电池、传感器、传输和充电系统，可以支撑高 ASP 和差异化。分析师评论估计经营利润率约 15–20%，中国媒体隐含的 2025
              年净利率约 25%；毛利率最好视作估计的 40–50% 区间，而不是已报告事实。负面证据在于，硬件单位经济可能因组件通胀、库存减记、质保 /
              服务成本、折扣或美国渠道冲击而迅速恶化。因此，正确模型应拆分标价毛利率、实际渠道利润率、R&D 强度、质保准备金和营运资本周转，并在验证前将不可得的经审计输入设为 null。
