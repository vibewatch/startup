      - number: '4.2'
        title: GTM 节奏与渠道效率代理指标
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是分裂的 GTM 节奏，而不是单一销售模式。消费者和创作者产品通过自助电商与零售渠道购买，标价和配件加购可见，但获客成本（CAC）、退货、渠道利润和促销强度不可见。企业、公共安全、巡检、采矿和
              Dock 部署更像销售驱动，因为 DJI 引导买方联系销售或经销商，这意味着更长周期和更重的实施 / 支持负担。农业也依赖运营方、经销商和本地监管许可。Anzu 的 DJI
              授权变通方案展示了另一条变现向量：即便美国市场的信任或原产地限制要求非 DJI 软件、组装和品牌，DJI
              的硬件平台仍可能有价值。尽调要把总预订额按渠道和细分拆开，再从标价桥接到扣除返利、零售商利润、质保准备金和任何区域合规成本后的实际净收入。
