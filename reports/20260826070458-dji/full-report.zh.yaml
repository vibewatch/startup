      - number: '7.5'
        title: 监测计划和投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              在首要风险从有争议叙事变成可衡量结果之前，投资姿态应是观察，而不是买入。眼前监测清单很短：FCC 对 DJI 新机型的有条件批准或豁免；Section 1260H 案的发回重审结果；Covered List
              设备授权规则的任何变化；监管机构接受的持续独立安全审计；以及美国收入敞口的硬证据。如果法院缩窄 DoD 理由、DJI 拿到可执行的授权路径，且 OnDefend
              结果变成可重复审计计划，正面情景可以成立。下行情景同样具体：发回重审失败、没有 FCC 路径、进口限制持续，或公共安全和企业买家被迫迁往 Blue UAS
              认可的竞争对手。这些结果会压缩增长、降低退出可选性，并让估值证据更不可靠。
