              DJI 的扩张动作看起来像硬件驱动的先落地后扩张：创作者增加配件和更高端相机系统，公共安全团队增加
              Dock、安全部署模式、飞手和相邻部门，农场增加更大载荷、培训、服务和作物工作流。风险在于，同样的产品强度制造了政策依赖。美国公共安全机构围绕便宜、可靠的 DJI 设备建立机队，但 FCC Covered
