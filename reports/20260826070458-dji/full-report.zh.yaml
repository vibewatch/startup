  - id: TV005
    title: 投资逻辑失效和否决触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 美国授权封锁持续
        - 下一个旗舰周期前，没有可信的 FCC/DoD/DHS 豁免或救济路径
        - 压住高端市场新品发布、企业升级和战略买家范围。
        - 不在锚点以上买入；若敞口重大，考虑回避。
      - - DoD 认定在发回重审后仍保留
        - 保密记录或发回重审结果让认定实质上保持不变
        - 声誉、签约和退出折价继续嵌入。
        - 要求更大折价和法律准备金。
      - - 收入证实为低口径
        - 经审计收入更接近 US$3.5-5B，而非 US$11.5B
        - 按 US$4B 中点计算，锚点倍数升至约 3.75x。
        - 避免支付老股市场溢价。
      - - 股权结构表对投资人不友好
        - 优先权、ROFR、转让限制或国资关联老股兴趣损害经济性
        - 即便企业价值合理，可实现回报也会降低。
        - 暂停，直到条款重新定价或澄清。
      - - 安全证据未能推动机构改变态度
        - OnDefend 类型发现被忽视，或被非公开证据反驳
        - 技术反驳没有转化为监管缓解。
        - 仅保持观察；不因审计给予估值上调。
    notes: 否决触发点按尽调阈值设定；公开来源证明的是风险类别，不是私人阈值。
    claimRefs:
      - CV036
      - CV037
      - CV040
      - CV047
      - CV048
      - CV050
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 按分部和地域拆分的收入、毛利率、净利润和现金转化。
        - 判断 1.3x 或 3.75x 收入口径哪一个更接近事实。
        - CFO / 数据室；核对 BigGo、UpMarket 和较早估计。
      - - 美国敞口
        - 与新机型、存量机队、企业、创作者和公共安全绑定的收入和利润率。
        - 判断 FCC Covered List 下行幅度。
        - 销售运营和区域财务；关联到产品级订单。
      - - 股权结构表和老股条款
        - 股东名册、优先权、转让权、ROFR、估值方法、卖方身份。
        - 判断老股价格是否可投，还是结构性受损。
        - 法律顾问和公司秘书；审阅交易文件。
      - - 监管路径
        - FCC/DoD/DHS 豁免方案、诉讼里程碑、机构反馈、机密记录策略。
        - 决定美国限制是暂时、永久，还是继续恶化。
        - 监管法律顾问；跟踪发回重审和 FCC 申请记录。
      - - 安全审计跟进
        - 持续测试计划、修复证据、监管机构对 OnDefend 发现的回应。
        - 决定技术证据能否收窄政策风险。
        - CISO / 工程团队和外部审计方；检查复测节奏。
      - - 退出准备度
        - 上市主体、审计准备度、红筹限制、子公司拆分候选、战略买家范围。
        - 决定买家能否实现回报，而不是持有缺乏流动性的股份。
        - 董事会、投行和法律顾问；要求形成书面退出计划。
    notes: 所有要求都需要私下证据；仅靠公开来源无法完全解决。
    claimRefs:
      - CV029
      - CV033
      - CV034
      - CV047
      - CV048
      - CV049
      - CV050
