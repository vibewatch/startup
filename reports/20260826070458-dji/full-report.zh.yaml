        - 授权 DJI 绕行方案
        - Raptor 系列在 2026 年 2 月停产前定价 $5,100 / $7,600
        - 寻找 DJI 式硬件和美国软件的企业及公共安全买家
        - 与 Mavic 3 Enterprise 可比的硬件和数据安全叙事
        - 零部件短缺，且不自动符合 NDAA
      - - Freefly / Inspired Flight / WISPR / Teledyne FLIR 等厂商
        - 符合 NDAA 的美国及盟友厂商集合
        - 较小供应商集合；不含全部载荷前，产品价格常在 $10K-$30K 左右
        - 政府、测绘、巡检、公共安全、防务
        - 合规、载荷专精、Blue UAS 或本土来源匹配
        - 格局分散、价格更高，且很少能完整替代 DJI 生态
      - - AeroVironment 和防务主承包商
        - 防务在位厂商 / 相邻玩家
        - SkyWatch 将 AeroVironment 列为大型防务 UAS 制造商
        - 军方和政府项目
        - 战场验证过的防务采购可信度
        - 与消费 / 准专业和许多企业相机无人机工作流关联较弱
      - - 现状方案 / 内部自建 / DIY
        - 替代方案而非品牌 OEM
        - DIY 组装在 2025 年 Dedrone 跟踪探测中占 9.82%
        - 预算受限团队、爱好者、任务特定操作方
        - 避开供应商锁定；可按任务定制载荷
        - 支持、合规、可靠性和保险负担分散
    notes: 竞争对手规模和定价来自公开估计或供应商 / 标价数据；私营同行收入和装机基数并不完全可比。
