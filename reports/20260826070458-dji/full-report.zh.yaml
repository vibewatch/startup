  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流映射的产品线
        blocks:
          - type: paragraph
            body: >-
              尽调 DJI 时，应把它看成一组面向具体工作流的系统，而不是单一无人机 SKU。消费者购买 Mini、Air、Mavic、Neo、Flip 等紧凑相机无人机，用于拍摄、旅行、社交视频和准专业航拍；企业用户购买
              Matrice、Dock、Zenmuse、FlightHub 2 和 DJI Terra，用于采集外业数据，并自动化重复巡检、制图、公共安全和采矿任务；农场购买 Agras
              系统，用于喷洒、撒播、制图和按路线执行田间作业；创作者在任务是手持而非空中拍摄时，也会购买 Osmo Pocket、Osmo Action 和 Ronin/RS
              稳定器。这种广度在技术上很重要，因为同一组核心能力会在产品组合中反复出现：小型化飞控、相机稳定、图传、嵌入式自主、载荷集成和经销商主导服务。下方矩阵区分哪些能力已成熟、哪些有差异化、哪些仍需要私有尽调证明。
