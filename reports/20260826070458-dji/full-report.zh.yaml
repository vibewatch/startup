  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最终判断和价格纪律
        blocks:
          - type: paragraph
            body: >-
              估值判断刻意对价格敏感：DJI
              值得持续观察，不是可以盲目买入的标的。对一家私人硬件平台来说，正面理由异常扎实：产品迭代速度、农业落地、消费者忠诚度和全球份额，都指向一家垂直整合、具备真实运营规模的品类龙头。反向逻辑同样足以影响投资：公司仍是私人公司，没有经审计财务；收入区间宽到足以让收入倍数相差好几个倍数点；美国政策也已从标题风险变成新授权的现实约束。基于这些证据，判断应是合理，而不是有吸引力。买方应把
              US$15B 锚点当作唯一保守的公开标记来承销，把 US$20-22B 老股交易迹象视为流动性信号；只有当经审计财务和美国市场准入路径，对评估权利、时点和下行保护的外部投资者明显更清楚时，才应上调观点。
