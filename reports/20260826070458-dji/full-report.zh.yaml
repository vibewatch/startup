      - number: '2.2'
        title: 市场规模口径与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              这个市场对 DJI 来说无疑足够大，但精确 TAM 对定义高度敏感。标准商业无人机口径是 2024 年约 US$14 billion，2030 年约 US$57 billion，CAGR 约 13.9%；但缓存的
              ResearchAndMarkets/Grand View 记录主要展示报告结构而非完整模型，因此只能当作锚点，而不是经审计数据集。Mordor 更窄的无人机报告小得多，从 2025 年 US$8.44
              billion 增至 2031 年 US$14.52 billion，CAGR 为 9.34%；VoxBooster 总结的 Grand View 整体无人机市场则宽得多，2025 年 US$83.8
              billion、2033 年 US$182.4 billion；CompaniesHistory 引用 2026 年 US$63.6 billion 至 2032 年 US$127 billion。因此，DJI
              的实际可服务市场（SAM）是其产品有资格销售的民用硬件 / 软件 / 服务切片；可获取市场（SOM）则在美国受到新的外国生产系统授权限制的压制。
