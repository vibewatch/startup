      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              DJI
              面向几套不同采购体系销售，每套体系的预算所有者和证明门槛都不同。消费级创作者自掏腰包买相机无人机，关注价格、相机质量、续航、便携性和软件易用性；测绘、能源、建筑、巡检等企业买方，会在无人机替代人工外业或昂贵飞行器时间时采购机队能力；公共安全买方看重响应速度和态势感知，但现在受到美国采购和授权规则约束；农业客户则常常把用户和付款方拆开，因为农户可能购买喷洒或制图服务，而不是自己拥有无人机。DJI
              的采用优势在于，产品目录已经通过门店、经销商、Enterprise 产品、Dock 自动化、Terra/FlightHub 式软件和 Agras
              服务生态覆盖这些工作流。投资尽调要问的是这些渠道在各地区是否仍能使用，而不是产品能否解决现场任务。
