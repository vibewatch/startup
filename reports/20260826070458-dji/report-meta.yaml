companyProfile:
  summary: >-
    DJI is the world's dominant civilian drone company, holding roughly 70% of the global
    civilian drone market with a vertically integrated Shenzhen manufacturing base and a broad
    product line spanning consumer camera drones (Mini, Air, Mavic, Neo, Flip), enterprise
    platforms (Matrice, Dock, Zenmuse), agricultural spraying drones (Agras) and handheld
    imaging (Osmo, Ronin). It is privately held, founder-controlled, apparently profitable, and
    increasingly constrained in the United States by an escalating national-security exclusion.
  foundedDate: '2006-01-18'
  founders:
    - name: Frank Wang (Wang Tao, 汪滔)
      role: Founder, CEO and controlling shareholder
      background: >-
        Built DJI's first flight-control prototypes as a student at HKUST before moving to
        Shenzhen in 2006; remains the central technical and cultural figure.
      claimRefs:
        - CO002
        - CO027
  foundingLocation: Shenzhen, Guangdong, China
  headquarters: DJI Sky City, Nanshan District, Shenzhen, Guangdong, China
  productSummary: >-
    Vertically integrated flying-camera and robotics hardware plus enterprise software:
    consumer drones, enterprise and agricultural drone systems, camera gimbals and action/
    pocket cameras, sold worldwide through DJI stores, dealers and online channels.
  customerFocus: >-
    Consumer creators and hobbyists; enterprise public safety, inspection, survey/mapping and
    energy; agricultural operators in 100+ countries; historically ~90% of US public-safety drones.
  businessModel: >-
    Primarily hardware sales (drones, cameras, gimbals, payloads) and accessories, plus enterprise
    software and an agricultural drone ecosystem, with margins supported by Shenzhen vertical
    integration.
  stage: Private, late-stage; never completed an IPO
  fundingStatus: >-
    ~$500M raised in 2015 and ~$1B pre-IPO in 2018 per press (databases track less); anchor
    valuation ~$15B (2024–2025), with 2026 secondary-market marks near $20–22B.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO001
    - CO003
    - CO014
    - CO026
summary:
  headline: >-
    DJI is the profitable, category-defining global drone leader, but a private, opaque Chinese
    company whose largest premium market and exit optionality are capped by US regulatory exclusion.
  overallScore: 6
  recommendation: track
