evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: DJI revenue and profitability
    missingEvidence: Audited income statement or a regulated filing confirming DJI's revenue, gross margin and net profit.
    whyItMatters: >-
      Revenue estimates range from US$3.5 billion to US$11.5 billion, which materially changes every downstream
      valuation.
    diligencePath: >-
      Seek audited statements, bank/lender materials, or a data-room P&L; reconcile CN press figures against primary
      records.
    relatedQuestionRefs:
      - QO010
      - QO023
  - type: conflicting-data
    severity: material
    topic: DJI cumulative funding and cap table
    missingEvidence: A primary shareholder register or cap table reconciling Forge, press and Wikipedia funding figures.
    whyItMatters: Total raised is cited anywhere from ~US$108 million to ~US$1.5 billion, obscuring ownership and dilution.
    diligencePath: Obtain the cap table and round documents; confirm investor stakes, voting rights and secondary transactions.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: Leadership and founder table governance detail
    missingEvidence: Public disclosure of DJI's board, wider C-suite and succession plan beyond founder Frank Wang.
    whyItMatters: Key-person dependence and governance opacity cannot be fully assessed without leadership detail.
    diligencePath: Request an org chart, board roster and succession policy during management diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table private events
    missingEvidence: Internal financing and product milestones DJI has not publicly dated.
    whyItMatters: The public chronology may omit material private events affecting scale and control.
    diligencePath: Cross-check internal records and investor updates against the public milestone list.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: DJI TAM/SAM/SOM conversion
    missingEvidence: >-
      DJI product-line revenue by geography, market segment, and channel sell-through that maps actual DJI sales to each
      TAM definition.
    whyItMatters: >-
      Without segment revenue, a broad drone-market estimate may overstate the market DJI can actually monetize,
      especially in restricted U.S. categories.
    diligencePath: >-
      Request management revenue bridge by geography and product line, then reconcile it against sell-through data from
      dealers and distributors.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: Precedence Research cached source usability
    missingEvidence: >-
      A current retrieved copy of the Precedence Research drone-market page exposing the actual drone-market values and
      definitions.
    whyItMatters: >-
      The dossier URL was mandatory, but the cached text showed unrelated market teasers rather than the drone data
      needed for sizing corroboration.
    diligencePath: >-
      Re-fetch the page manually or replace it with an accessible analyst summary that preserves publisher, date, scope,
      values and forecast assumptions.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: material
    topic: Market sizing estimate ranges
    missingEvidence: >-
      Comparable, same-scope market models separating consumer hardware, commercial hardware, services, software,
      defense and delivery networks.
    whyItMatters: >-
      Published estimates range from narrow single-digit billions to broad drone-economy totals above US$90 billion,
      which can move valuation sensitivity by orders of magnitude.
    diligencePath: >-
      Build a normalized sizing bridge with identical inclusions, exclusions, base year, forecast year, geography and
      currency treatment.
    relatedQuestionRefs:
      - QM009
      - QM024
  - type: private-evidence-only
    severity: material
    topic: U.S. market access impact
    missingEvidence: >-
      DJI's U.S. revenue exposure by model family, channel, installed fleet, and replacement cycle after FCC and
      foreign-drone restrictions.
    whyItMatters: >-
      Existing devices can continue operating but new-model restrictions can sharply reduce future SAM and channel
      economics in the premium U.S. market.
    diligencePath: >-
      Obtain management U.S. sell-in and sell-through, dealer backlog, inventory age, authorization status and
      post-restriction replacement-rate data.
    relatedQuestionRefs:
      - QM017
      - QM018
      - QM026
  - type: private-evidence-only
    severity: minor
    topic: Agricultural drone economics
    missingEvidence: >-
      Crop-level payback, service-provider utilization, chemical savings and maintenance cost by region for DJI Agras
      deployments.
    whyItMatters: >-
      Public sources show strong installed-base growth but do not prove farm-level unit economics across all geographies
      and crop types.
    diligencePath: >-
      Sample dealer invoices, service-provider utilization logs, maintenance records and customer ROI calculations
      across China, Brazil, India and the U.S.
    relatedQuestionRefs:
      - QM019
      - QM022
  - type: private-evidence-only
    severity: material
    topic: Competitor unit economics and realized pricing
    missingEvidence: >-
      Actual realized ASPs, discounts, gross margins, support costs, and public-safety or enterprise contract terms for
      DJI, Skydio, Autel, Parrot, and U.S. alternatives.
    whyItMatters: >-
      List prices do not prove economic competitiveness, and realized discounting could change the price-performance
      ranking.
    diligencePath: Request channel invoices, enterprise quotes, warranty/service terms, and procurement award data by product family.
    relatedQuestionRefs:
      - QP005
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: XAG competitive scale
    missingEvidence: Primary XAG shipment, revenue, and geographic mix disclosures that are comparable with DJI Agriculture metrics.
    whyItMatters: >-
      XAG may be a serious agricultural rival, but public sources do not allow a clean share or profitability
      comparison.
    diligencePath: >-
      Collect XAG filings, distributor data, farm-service channel checks, and product-level quotes in top agricultural
      drone markets.
    relatedQuestionRefs:
      - QP012
      - QP025
  - type: conflicting-data
    severity: material
    topic: U.S. share-shift under FCC and DoD restrictions
    missingEvidence: >-
      Post-December-2025 procurement data showing which agencies replaced, retained, or multi-homed DJI and Autel
      fleets.
    whyItMatters: >-
      Policy intent does not directly translate into competitor revenue unless replacement budgets and operational
      acceptance appear.
    diligencePath: Track public RFPs, Blue UAS awards, agency fleet disclosures, and waiver determinations through 2026.
