      - number: '7.3'
        title: Security evidence is helpful but does not retire operational risk
        blocks:
          - type: paragraph
            body: >-
              The most favorable risk evidence in the file is technical: OnDefend’s five-month review of the Air 3S and
              Matrice 4E reportedly found no critical, high, or medium-risk vulnerabilities, no hidden backdoors, no
              unexplained RF emissions, and no tested data flows leaving the United States. That meaningfully narrows
              one version of the data-security allegation, but it is not a blanket clearance for every model, firmware
              release, dock deployment, cloud path, supplier component, or future update. DJI’s own product roadmap
              increases the operational surface area through longer-range transmission, richer sensors, remote dock
              operations, agricultural spraying, and connected enterprise software. Support and official service
              channels mitigate ordinary reliability risk, but diligence should still demand recurring audits,
              firmware-change controls, vulnerability remediation evidence, safety incident history, and
              jurisdiction-by-jurisdiction operating compliance before treating the audit as a durable risk reducer.
