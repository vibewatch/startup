      - number: '7.4'
        title: Dependencies cluster around regulators, founder control, and opaque evidence
        blocks:
          - type: paragraph
            body: >-
              DJI’s dependency map is unusually policy-heavy for a profitable hardware leader. U.S. regulators, DoD/FCC
              legal processes, Blue UAS exemption channels, dealers, support infrastructure, and independent security
              evaluators now determine whether the company can keep serving high-value American demand. Inside the
              company, public evidence points to founder-centric engineering culture, limited visibility into senior
              leadership succession, and a historical internal-control incident tied to inflated component costs. The
              same private disclosure profile that lets DJI avoid public-company scrutiny also weakens diligence:
              audited revenue, margin, U.S. revenue split, precise component origin, and current capital structure are
              not available from filings. These gaps do not prove the operating model is weak, but they force the
              residual-risk rating higher because investors cannot independently quantify downside, governance
              resilience, or the speed with which management can adapt to a U.S. exclusion regime.
