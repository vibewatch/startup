              Consumer users buy compact camera drones such as Mini, Air, Mavic, Neo, and Flip for capture, travel,
              social video, and prosumer aerial imaging; enterprise users buy Matrice, Dock, Zenmuse, FlightHub 2, and
              DJI Terra to collect field data and automate recurring inspection, mapping, public-safety, and mining
