        title: Exhibits
        blocks:
          - type: callout
            title: Use multiple TAM lenses instead of one headline market number
            body: >-
              Drone market estimates differ because analysts count different mixtures of hardware, software, services,
              defense, delivery, and regional activity. DJI valuation work should sensitize around narrow civilian
              hardware, commercial systems, and broader drone-economy cases rather than anchor mechanically on the
              largest published TAM.
            calloutType: insight
            claimRefs:
