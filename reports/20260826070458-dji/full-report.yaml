              creators also buy Osmo Pocket, Osmo Action, and Ronin/RS stabilizers when the job is handheld rather than
              airborne. This breadth is technically important because the same core competencies recur across the
              portfolio: miniaturized flight controllers, camera stabilization, image transmission, embedded autonomy,
              payload integration, and dealer-led service. The matrix below separates what is mature, what is
