      - number: '4.3'
        title: Unit economics, margin drivers, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Public unit economics are directionally attractive but not underwritable without a data room. The positive
              evidence is structural: DJI sits in Shenzhen's dense electronics ecosystem, uses vertically integrated
              engineering and manufacturing, and official product specifications reveal premium camera, gimbal, battery,
              sensor, transmission, and charging systems that can support high ASPs and differentiation. Analyst
              commentary estimates operating margin around 15-20%, and Chinese press-implied 2025 net margin is roughly
              25%; gross margin is best treated as an estimated 40-50% range, not a reported fact. The negative evidence
              is that hardware unit economics can deteriorate quickly through component inflation, inventory
              write-downs, warranty/service costs, discounting, or a U.S. channel shock. The correct model therefore
              separates list-price gross margin, realized channel margin, R&D intensity, warranty reserve, and
              working-capital turns, while setting unavailable audited inputs to null until verified.
