            figureRef: FO002
            claimRefs:
              - CO024
              - CO025
              - CO026
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              DJI's identity is inseparable from founder Frank Wang (Wang Tao, 汪滔), born in Hangzhou in 1980, who built
              the company's first flight-control prototypes as a student at the Hong Kong University of Science and
              Technology and moved to Shenzhen to hire his first staff in 2006. Wang remains the controlling shareholder
              and central technical and cultural figure, and public profiles estimate his net worth at roughly
              US$4.8–5.1 billion in 2026, a figure that tracks DJI's private-market value. The governance picture is
              thin by design: beyond Wang, DJI discloses very little about its board, C-suite depth, or succession
              planning, and reporting has historically described an intense, founder-driven internal culture. For an
              investor this creates a clear key-person dependency and a governance-opacity gap — the company's
              direction, capital-allocation, and geopolitical navigation all appear to hinge on one individual, and the
              absence of a visible independent board or audited controls is a material diligence flag rather than a
              neutral omission. A 2019 internal-fraud disclosure, in which DJI estimated losses of up to CN¥1 billion
              (~US$147 million) from employee cost inflation, is the clearest historical signal that internal controls
              warrant scrutiny.
            claimRefs:
              - CO002
              - CO007
              - CO008
              - CO009
              - CO027
              - CO028
              - CO040
          - type: table
            tableRef: TO002
            claimRefs:
