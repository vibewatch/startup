      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              DJI sells into several buyer systems with different budget owners and proof thresholds. Consumer creators
              self-fund camera drones and care about price, camera quality, flight time, portability, and software
              simplicity; enterprise buyers such as survey, energy, construction, and inspection teams buy fleet
              capability when it replaces manual field work or expensive aircraft time; public safety buyers value speed
              of response and situational awareness but are now constrained by U.S. procurement and authorization rules;
              and agricultural customers often separate the user from the payer because farmers may consume spraying or
              mapping as a service rather than own the drone. DJI's adoption advantage is that its catalog already spans
              those workflows through stores, dealers, Enterprise products, Dock automation, Terra/FlightHub-style
              software, and Agras service ecosystems. The investor diligence question is whether those channels remain
              available in each geography, not whether the product solves the field job.
            claimRefs:
