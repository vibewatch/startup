            body: >-
              The product architecture is a stack of airframes or handheld bodies, propulsion and batteries, cameras or
              specialized payloads, stabilized gimbals, radio links, autonomy software, fleet software, and after-sales
              support. DJI's public evidence is strongest at the hardware and payload layers: Mavic 4 Pro combines a
              100MP Hasselblad camera, dual tele cameras, a 360-degree gimbal, improved omnidirectional obstacle
              sensing, 51 minutes of stated flight time, and O4+ transmission; Zenmuse P1 combines a 45MP full-frame
              sensor, stabilized gimbal, mechanical shutter, and TimeSync; Dock 2 adds weatherized remote deployment
              with cloud-based functions; and Agras T100/T70P/T25P add LiDAR, radar, vision systems, large payloads, and
              automated routes. The less visible layer is closed firmware, chipsets, data handling, and fleet-cloud
              reliability, so the diligence burden moves from product brochures to independent technical audits, FCC
              filings, customer telemetry, and private engineering documentation.
