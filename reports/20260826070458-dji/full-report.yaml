      - number: '7.5'
        title: Monitoring plan and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investment posture should be track, not buy, until the top risks move from contested narratives to
              measurable outcomes. The immediate monitoring list is short: FCC conditional approvals or exemptions for
              new DJI models; remand results in the Section 1260H case; any change in the Covered List
              equipment-authorization rule; recurring independent security audits accepted by regulators; and hard
              evidence of U.S. revenue exposure. A positive scenario is possible if the courts narrow the DoD rationale,
              DJI wins a workable authorization route, and the OnDefend results become a repeatable audit program. The
              downside scenario is also concrete: a failed remand, no FCC pathway, continued import restrictions, or a
              forced migration of public-safety and enterprise buyers to Blue UAS-approved rivals. Those outcomes would
              compress growth, reduce exit optionality, and make valuation evidence even less reliable.
