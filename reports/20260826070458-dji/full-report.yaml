            title: U.S. market access is a SAM constraint, not just a legal footnote
            body: >-
              The FCC Covered List and related foreign-drone restrictions block new authorizations for covered
              foreign-produced UAS while allowing existing devices to continue, so replacement cycles and new model
              launches may diverge sharply between U.S. and non-U.S. customers.
            calloutType: risk
            claimRefs:
