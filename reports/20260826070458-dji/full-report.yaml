      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase secondary marks
            body: >-
              The public evidence supports continued coverage and prepared diligence, but not a blind buy at the 2026
              secondary indication without audited financials and U.S. market-access clarity.
            calloutType: recommendation
            claimRefs:
              - CV011
