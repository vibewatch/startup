      - number: '8.2'
        title: Valuation lenses and scenarios
        blocks:
          - type: paragraph
            body: >-
              The revenue conflict is the fulcrum of valuation. If Chinese finance reporting and pre-IPO summaries are
              directionally right, a US$15B anchor sits near 1.3x revenue and looks modest for a profitable global
              market leader. If the older US$3.5-5B estimates are closer to truth, the same anchor sits around 3.75x a
              US$4B midpoint and the 2026 secondary indication requires much more faith in margin, growth, and eventual
              exit. The base case therefore uses a wider range than a public comp model would: bear around US$12B, base
              around US$18B, bull around US$25B. The goal is not false precision; it is entry discipline around what
              must be proven before paying through the anchor.
            claimRefs:
