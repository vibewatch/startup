      - number: '6.5'
        title: Expansion loops, concentration risk, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              DJI's expansion motion looks like hardware-led land-and-expand: creators add accessories and higher-end
              camera systems, public-safety teams add docks, secure deployment modes, pilots, and adjacent departments,
              and farms add larger payloads, training, service, and crop workflows. The risk is that the same product
              strength creates policy dependence. U.S. public-safety agencies built fleets around affordable, reliable
              DJI equipment, but FCC Covered List rules, federal procurement limits, Texas purchasing restrictions, and
              the continuing DoD designation case complicate replacements and new purchases even when existing drones
              can keep flying. DJI also faces competitor substitution pressure in DFR and inspection from U.S. suppliers
              such as Skydio, although The Drone Girl's Dedrone analysis suggests alternatives still trail DJI in
              observed global operational usage. The central diligence ask is therefore not whether DJI has customers;
              it is how much revenue, repeat demand, and channel inventory are exposed to U.S. replacement-cycle
              disruption.
