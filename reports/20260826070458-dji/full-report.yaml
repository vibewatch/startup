  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Final view and price discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation call is deliberately price-sensitive: DJI is a company to track, not a name to buy blindly.
              The positive case is unusually strong for a private hardware platform because product velocity,
              agricultural deployment, consumer loyalty, and global share all point to a vertically integrated category
              leader with real operating scale. The anti-thesis is equally investable: the company is private, audited
              financials are unavailable, the revenue range is wide enough to move the multiple by several turns, and
              U.S. policy has shifted from headline risk to a working constraint on new authorizations. On that
              evidence, the stance is fair rather than attractive. A buyer should underwrite the US$15B anchor as the
              only conservative public mark, treat the US$20-22B secondary indication as liquidity color, and reserve an
              upgrade until audited financials and U.S. market-access paths are demonstrably clearer for an outside
              investor assessing rights, timing, and downside protections.
            claimRefs:
