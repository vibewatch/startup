            body: >-
              DJI reaches customers through three different buying systems rather than one enterprise sales motion. The
              consumer and creator segment buys camera drones, handheld cameras, gimbals, power products, and
              accessories through DJI Store, the main DJI site, and resellers; the end user and payer are often the same
              individual or small creative team, so proof comes from product breadth and market-presence proxies rather
              than named accounts. Enterprise buyers are more institutional: police, fire, airport, inspection,
              surveying, construction, mining, utilities, and security teams evaluate Matrice, Dock, FlightHub, Terra,
              and payload bundles through enterprise dealers and solution pages. Agriculture is a third system in which
              farms, contractors, dealers, instructors, and service centers jointly create demand for Agras equipment
              across crop protection, spreading, mapping, and orchard work. The pattern is powerful but hard to
              diligence because DJI rarely discloses customer lists, account revenue, or top-customer concentration.
