  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and conflicting scale signals
        blocks:
          - type: paragraph
            body: >-
              DJI's public revenue model is still overwhelmingly hardware-led: consumer and prosumer drones, handheld
              cameras, stabilizers, enterprise drones and docks, agricultural aircraft, batteries, accessories, and
              warranty/service plans are sold through DJI's own store, authorized retailers, and dealer-led enterprise
              channels. Official list pricing is observable for some products, such as Mavic 4 Pro bundles in Europe,
              the US$439 Flip, and lower-end store offers, but realized average selling price, discounts, regional mix,
              and revenue recognition are not public. The largest scale input is conflicting rather than settled. Older
              outside estimates cluster around roughly US$3.5-5.0B of annual revenue, while Chinese finance press and
              the Wikipedia infobox cite 2025 revenue around CN¥80B, or roughly US$11.5-11.8B, with net profit above
              CN¥20B. Until audited statements reconcile those figures, diligence should carry reported revenue as a
              range and keep audited revenue run-rate, ARR, gross margin, NRR, and customer count as null.
