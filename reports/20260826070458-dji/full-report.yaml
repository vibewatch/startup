companyProfile:
  summary: >-
    DJI is the world's dominant civilian drone company, holding roughly 70% of the global civilian drone market with a
    vertically integrated Shenzhen manufacturing base and a broad product line spanning consumer camera drones (Mini,
    Air, Mavic, Neo, Flip), enterprise platforms (Matrice, Dock, Zenmuse), agricultural spraying drones (Agras) and
    handheld imaging (Osmo, Ronin). It is privately held, founder-controlled, apparently profitable, and increasingly
    constrained in the United States by an escalating national-security exclusion.
  foundedDate: '2006-01-18'
  founders:
    - name: Frank Wang (Wang Tao, 汪滔)
      role: Founder, CEO and controlling shareholder
      background: >-
        Built DJI's first flight-control prototypes as a student at HKUST before moving to Shenzhen in 2006; remains the
        central technical and cultural figure.
