              - CO008
              - CO009
      - number: '1.3'
        title: Funding history, valuation, and scale
        blocks:
          - type: paragraph
            body: >-
              DJI's capital history is real but poorly disclosed. Press and Wikipedia record a roughly US$500 million
              round in 2015 (investors cited include Accel, Sequoia/HongShan, GIC, New China Life Insurance and New
              Horizon Capital) and about US$1 billion of pre-IPO financing raised in 2018 for a Hong Kong listing that
              never happened; private-market databases such as Forge track far less (about US$108 million across three
              rounds), so the true cumulative raise is genuinely uncertain. On valuation, the widely used anchor is
              roughly US$15 billion — Forge cites a "last known valuation" as of April 2025 and the Hurun Global Unicorn
              Index 2025 lists DJI among its 1,523 unicorns — while 2026 secondary-market reporting points to an implied
              enterprise value nearer US$20–22 billion, with some shareholders selling stakes at a modest discount.
              Scale is easier to evidence than valuation: DJI holds roughly 70% of the global civilian drone market,
              employs on the order of 14,000 people (some estimates run to ~17,000), and Chinese financial press reports
              2025 revenue near CN¥80 billion (~US$11.5 billion) with net profit above CN¥20 billion — figures that, if
              accurate, make DJI both large and unusually profitable for a hardware company, though they conflict with
              older analyst estimates of US$3.5–5 billion.
