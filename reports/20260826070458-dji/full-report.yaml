      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The market is unquestionably large enough for DJI, but the exact TAM is definition-sensitive. The
              canonical commercial-drone lens is roughly US$14 billion in 2024 growing to about US$57 billion by 2030 at
              roughly 13.9% CAGR, but the cached ResearchAndMarkets/Grand View record exposes mostly report structure
              rather than the full model, so this should be treated as an anchor rather than an audited dataset.
              Mordor's narrower drones report is much smaller, moving from US$8.44 billion in 2025 to US$14.52 billion
              in 2031 at 9.34% CAGR; VoxBooster summarizes a far broader Grand View total-drone market at US$83.8
              billion in 2025 and US$182.4 billion by 2033; and CompaniesHistory cites US$63.6 billion in 2026 to US$127
              billion in 2032. The practical SAM for DJI is therefore the civilian hardware/software/service slice where
              its products are eligible to sell, while the SOM is damped in the U.S. by authorization restrictions on
              new foreign-produced systems.
