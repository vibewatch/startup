      - number: '5.4'
        title: Trust, security, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Trust is the decisive product-technology issue because DJI's performance edge is embedded in aircraft,
              controllers, radio links, applications, payloads, docks, batteries, and cloud software that U.S.
              regulators increasingly treat as security-sensitive UAS components. DJI's strongest counter-evidence is
              the May 2026 OnDefend assessment of Air 3S and Matrice 4E systems, which reported zero critical, high, or
              medium-risk findings, no hidden backdoors, no data transmissions outside the United States, no unexplained
              RF emissions, and no supply-chain tampering in the tested units. The limitation is equally clear: it was a
              point-in-time, DJI-authorized assessment of specific consumer and enterprise configurations, and the same
              source recommends continuous validation as software, firmware, and hardware versions change. FCC Covered
              List policy therefore remains a product constraint even where technical evidence is favorable, because new
              foreign-made UAS and critical components cannot receive U.S. equipment authorization absent exemptions.
