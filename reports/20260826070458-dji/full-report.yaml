      - number: '1.5'
        title: Cover metrics and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Consolidating the identity layer into headline metrics shows a company that is easy to describe
              qualitatively and hard to pin down numerically. The confident metrics are the founding date (2006), the
              founder and headquarters, the ~70% civilian-drone share, and the product line; the estimated metrics are
              the ~US$15 billion valuation anchor and the ~14,000 headcount; and the genuinely unresolved metrics are
              audited revenue, gross and net margin, and precise cumulative funding, all of which remain private and are
              reported inconsistently across sources. Where a number cannot be supported it should be carried as null
              with a concrete diligence path — for revenue that means seeking audited statements or a regulated filing,
              and for funding it means reconciling the conflicting Forge, press, and Wikipedia figures against a primary
              cap table. DJI's scale dwarfs Western peers such as Skydio (a roughly US$4.4 billion private valuation in
              2026), which frames the later competitive and valuation chapters. The overriding caveat for readers is
              that DJI's disclosure profile is private-undisclosed: strong on product and market evidence, weak on
              audited economics and governance detail.
