      - number: '1.4'
        title: Milestones and trajectory
        blocks:
          - type: paragraph
            body: >-
              DJI's twenty-year arc runs from a Shenzhen dorm-room flight-controller business to the category-defining
              consumer drone brand and, more recently, to the center of a U.S.-China technology dispute. The product
              spine is well dated: the ready-to-fly Phantom (2013) opened the consumer market, the foldable Mavic Pro
              (2016) defined portable camera drones, and the 2024–2025 cadence of the US$199 Neo, the US$439 Flip, and
              the flagship Mavic 4 Pro (launched 13 May 2025 with a 100MP Hasselblad sensor) shows continued hardware
              leadership even as U.S. availability tightened. The financing and adverse spine is equally important: the
              2015 and 2018 raises, the 2019 fraud disclosure, the October 2022 U.S. Department of Defense "Chinese
              Military Company" listing, DJI's October 2024 lawsuit against that listing, the September 2025
              district-court loss, the December 2025 FCC Covered-List addition and import restriction, and an August
              2026 partial appellate win that remanded the case. This single chronology of record is the reference every
              later chapter draws on for identity, capital, scale, and regulatory context.
