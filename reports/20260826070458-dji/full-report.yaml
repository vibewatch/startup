      - number: '2.5'
        title: Diligence implications and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Market diligence should preserve three gaps rather than forcing false precision. First, analysts use
              incompatible units: hardware-only, civil/commercial hardware plus software, drone services, defense, and
              delivery networks produce materially different TAMs, so valuation should sensitize outcomes across
              multiple market definitions. Second, DJI's share estimate is strong directionally but not audited; a 70%
              civilian share, 80%+ U.S. consumer share, and Dedrone's 83.48% detection share describe related but
              non-identical populations. Third, regulatory outcomes can transform a serviceable market into an
              inaccessible one, especially for new U.S. models after the FCC Covered List and foreign-drone
              restrictions. The market is therefore attractive but not frictionless: the upside case relies on non-U.S.
              demand, agriculture, inspection, and autonomous operations scaling; the downside case is a shrinking
              premium U.S. SAM with procurement pulled toward domestic or Blue UAS alternatives.
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
