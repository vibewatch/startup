  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              DJI’s competitor set is broader than a simple brand-versus-brand consumer-drone comparison. A buyer can
              choose another Chinese OEM such as Autel, a U.S. autonomy specialist such as Skydio, a European incumbent
              such as Parrot, a legacy player such as Yuneec, an agricultural specialist such as XAG, a compliant
              government supplier such as Freefly, Inspired Flight, WISPR, AeroVironment or Teledyne FLIR, a
              licensed-DJI workaround such as Anzu, or no packaged replacement at all. The latter includes manual
              inspection, crewed aircraft, rented services, and internal or DIY builds. That breadth matters because DJI
              can lose U.S. government procurement while still retaining consumer and global enterprise leadership: each
              competitor attacks a slice of the job-to-be-done, but few match DJI’s combined camera, flight-control,
              payload, software, accessory, support, and dealer surface.
            claimRefs:
