  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market around DJI should be bounded as civilian and commercial uncrewed aircraft systems,
              not as every defense UAV, counter-drone, or robotics opportunity that mentions drones. The included spend
              is aircraft, payloads, batteries, ground-control software, flight-management workflow, training,
              accessories, and service-led deployments for imaging, inspection, public safety, mapping, construction,
              agriculture, and creator use. The excluded spend is large military programs, counter-UAS systems,
              unrelated camera accessories, and drone-delivery infrastructure unless the buyer is actually procuring
              DJI-compatible aircraft or software. That boundary keeps the analysis focused on what DJI can monetize:
              recurring refresh demand for fleets, enterprise workflow software, agricultural spraying/spreading
              systems, and retail prosumer hardware. Status quo substitutes remain strong: manual inspection crews,
              helicopters, fixed cameras, tractors and ground sprayers, outsourced surveyors, and, in U.S. public-sector
              procurement, Blue UAS-compliant competitors substituted for policy reasons rather than product
              superiority.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
