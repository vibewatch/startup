  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory cliff is the binding risk
        blocks:
          - type: paragraph
            body: >-
              DJI’s risk stack is dominated by U.S. legal and regulatory exclusion rather than by ordinary hardware
              execution. The Section 1260H Chinese Military Company listing remains live after the D.C. Circuit’s
              partial remand, so federal procurement stigma and contractor avoidance still apply while the lower court
              reviews classified rationale. The more direct commercial cliff is the December 2025 FCC Covered List
              update: new foreign-produced UAS and UAS critical components cannot receive equipment authorization, which
              blocks new DJI model entry even though existing authorized devices remain usable. The OnDefend audit gives
              DJI a stronger technical rebuttal, but it does not itself answer the policy concern about foreign
              manufacturing, dual-use payloads, and strategic dependence. Residual exposure is therefore critical until
              DJI obtains a narrowing remedy, a conditional approval, or a verifiable supply-chain path acceptable to
              U.S. agencies.
            claimRefs:
