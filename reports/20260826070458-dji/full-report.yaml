      - number: '8.3'
        title: Comparable reference points
        blocks:
          - type: paragraph
            body: >-
              The comparable set is intentionally imperfect. Skydio is the closest private drone comp because U.S.
              defense and public-safety policy advantages drove a multibillion-dollar 2026 mark, but it is materially
              smaller than DJI and benefits from the very policy regime that hurts DJI. Parrot gives public-market
              governance and drone focus, yet its scale is too small to set DJI’s value. Mobileye provides an
              autonomy-hardware precedent that public investors have valued in the low-US$20B range, but it is an
              automotive semiconductor/software business, not a drone manufacturer. The comp exercise therefore supports
              a fairness check, not a formula: DJI deserves a scale premium to most drone peers and a geopolitical
              discount to unconstrained autonomy hardware.
            claimRefs:
              - CV020
              - CV021
