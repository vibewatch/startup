      - number: '3.2'
        title: Peer profiles and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Skydio is the clearest strategic foil because it has fresh capital, U.S. manufacturing ambition, DoD pull,
              and a product story centered on autonomy rather than camera-drone breadth. Its 2026 Series F and Army X10D
              order show genuine momentum, but the same evidence shows a narrower, higher-priced public-safety and
              defense orientation after the company left consumer drones. Parrot remains useful as a listed European
              benchmark, but its employee base and ANAFI-centered franchise are small relative to DJI. Autel overlaps
              DJI most directly in consumer and enterprise airframes, yet its China origin makes it a poor answer for
              buyers whose problem is U.S. trust or procurement compliance. Yuneec and Anzu illustrate the long tail:
              older or licensed-hardware alternatives can fill gaps, but product continuity and compliance remain
              unresolved.
            claimRefs:
              - CP006
