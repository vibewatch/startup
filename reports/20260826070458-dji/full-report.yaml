chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, structure, and product footprint
        blocks:
          - type: paragraph
            body: >-
              DJI, legally SZ DJI Technology Co., Ltd. (深圳市大疆创新科技有限公司) and branded from "Da-Jiang Innovations," was
              founded on 18 January 2006 and is headquartered at DJI Sky City in the Nanshan District of Shenzhen,
              Guangdong, China. It is a privately held robotics and imaging company whose product footprint spans
              consumer camera drones (Mini, Air, Mavic, Neo, Flip), enterprise platforms (Matrice, Dock drone-in-a-box,
              Zenmuse payloads), agricultural spraying drones (Agras), and handheld imaging (Osmo cameras, Ronin
              gimbals). The company has never completed an IPO and remains controlled by its founder, with DJI asserting
              that state-affiliated investors hold under 6% of equity and under 1% of voting rights. That structure
              matters for diligence because it concentrates both economic upside and governance control, and because it
              leaves the company free of the audited public disclosure that a listed peer would provide. The one-line
              description that later chapters can reuse: DJI sells vertically integrated flying-camera and robotics
              hardware plus enterprise software, and earns money primarily from selling that hardware worldwide through
              its own stores and dealers.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO024
              - CO025
              - CO026
