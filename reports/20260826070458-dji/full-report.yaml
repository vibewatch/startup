      - number: '3.4'
        title: Switching costs, lock-in, and channel power
        blocks:
          - type: paragraph
            body: >-
              DJI’s moat is not only the airframe. Operators buy batteries, controllers, payloads, cloud and mapping
              workflows, maintenance routines, pilot training, spare parts, and dealer support around the platform. That
              creates a practical lock-in even when a regulator or procurement officer wants a non-DJI path. The FCC’s
              continued-use language reinforces this dynamic because existing DJI fleets can remain in service while new
              purchases migrate slowly to Blue UAS or domestic alternatives. In public safety, this encourages
              multi-homing: agencies keep DJI for installed workflows, test Skydio or other compliant systems for new
              budgets, and reserve specialized U.S.-made platforms for missions where procurement trust outweighs
              price-performance. Competitors therefore win wedge accounts before they win full fleet replacement, and
              the size of that wedge depends on procurement rules more than product preference alone.
            claimRefs:
              - CP034
              - CP037
              - CP038
              - CP039
              - CP043
              - CP044
      - number: '3.5'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The durable part of DJI’s edge is global scale plus integrated engineering; the vulnerable part is the
              U.S. channel. Share evidence, product cadence, and the difficulty of matching DJI’s performance-price
              bundle point to continued global strength. Yet U.S. government and public-safety buyers can be forced
              toward compliant alternatives even if they prefer DJI hardware, and Blue UAS exemptions make that policy
              channel valuable. Commodity pressure is real at the low end because Autel, DIY builds, and rebranded
              DJI-derived hardware can imitate pieces of the proposition. It is weaker in full-stack enterprise
              workflows where docks, payloads, mapping, support, and installed accessories compound. The diligence
              answer is therefore barbell-shaped: expect DJI to remain the global reference platform, but underwrite
              U.S. share loss and lower strategic optionality where regulation is binding.
