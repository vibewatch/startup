      - number: '2.4'
        title: Growth drivers, constraints, and adoption timing
        blocks:
          - type: paragraph
            body: >-
              The market's drivers are structural: drone autonomy, sensor payloads, BVLOS rulemaking, labor scarcity,
              precision-agriculture economics, safety gains in inspection, and drone-in-a-box automation all pull buyers
              from pilots into repeat fleet purchases. DJI benefits because many of those drivers reward integrated
              hardware, software, batteries, payloads, and dealer support, which are the parts of the stack where the
              company has accumulated scale. The constraints are just as material. FAA and national rules still control
              who can fly commercially, the FCC Covered List now blocks new authorizations for covered foreign-produced
              drones in the U.S., and buyers handling public-safety or critical-infrastructure missions face trust and
              data-security reviews even where existing drones can still operate. Agriculture adds a different
              bottleneck: high acquisition and maintenance costs make drone-as-a-service and subsidies central to
              adoption in smallholder markets.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
