      - number: '8.4'
        title: Regulatory, exit, and thesis-break logic
        blocks:
          - type: paragraph
            body: >-
              The U.S. regulatory record is the main reason a dominant company does not receive a buy call. The Covered
              List framework blocks new authorizations for covered foreign-made UAS while preserving much existing use,
              which means near-term installed-base value and long-term new-model value diverge. The litigation record
              has also improved only partially: a D.C. Circuit remand creates procedural leverage, but it does not
              remove the DoD designation or resolve classified evidence. Security-audit evidence helps DJI rebut
              technical claims, yet a clean point-in-time audit of two systems cannot by itself reverse a
              country-of-origin policy. The kill triggers are therefore legal and commercial, not product-quality
              triggers: no exemption route, no audited economics, and no credible exit path at the assumed price.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV036
              - CV037
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
