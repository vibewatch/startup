          - type: callout
            title: The U.S. cap is now a valuation input
            body: >-
              Covered List treatment blocks new authorizations for covered foreign-made UAS while leaving existing
              lawful products largely usable, creating a split between installed-base value and future launch value.
            calloutType: risk
            claimRefs:
