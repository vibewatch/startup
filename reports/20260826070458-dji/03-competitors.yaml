- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criteria
  - Company
  - Competitors
  - Unsupported cells marked clearly
  rows:
  - - Consumer camera-drone breadth
    - DJI strong across Mini, Air, Mavic, Neo, and flagship Mavic 4 Pro
    - Autel overlaps; Skydio exited consumer; Parrot/Yuneec narrower
    - Exact model-by-model sell-through unknown
  - - Enterprise payload and mapping stack
    - DJI strong across Matrice, Zenmuse, Dock, FlightHub/Terra-style software
    - Skydio, Freefly, Inspired Flight, WISPR, Teledyne FLIR cover subsets
    - Payload-level price and margin unknown
  - - Autonomy / obstacle avoidance
    - DJI strong; Skydio strongest independently evidenced around AI autonomy
    - Skydio X10/X10D differentiated; Autel claims autonomy in EVO Max
    - Benchmark results not public across all vendors
  - - Thermal / public safety
    - DJI strong via enterprise payloads; Skydio and Autel also credible
    - Skydio X10, Autel EVO Max, Teledyne FLIR, WISPR, Freefly options
    - Agency deployment volumes by model incomplete
  - - Agricultural spraying/spreading
    - DJI strong with 400,000 agriculture drones/operators and 100-country footprint
    - XAG is the principal agri specialist rival
    - XAG revenue and share unavailable in dossier sources
  - - U.S. procurement trust
    - DJI weak for new authorizations; Autel also weak
    - Skydio, Parrot, Freefly, Inspired Flight, WISPR, AeroVironment advantaged
    - Actual agency waiver rates unknown
  - - Price-performance bundle
    - DJI strongest qualitative evidence; Anzu showed demand for DJI-like hardware
    - Skydio and U.S. alternatives often materially higher priced
    - Realized discounts and lifecycle support cost unknown
  notes: Matrix cells combine official product surfaces, review comparisons, and regulatory sources; unknowns are explicitly marked where source evidence is not complete.
