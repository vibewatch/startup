- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Scale and price-performance
    - U.S. policy can reroute procurement even where DJI remains cheaper or better
    - High
    - Segment revenue by U.S. government, public-safety, and consumer exposure
  - - Integrated ecosystem and accessories
    - Multi-homing with Skydio or Blue UAS vendors can slowly erode installed-base expansion
    - Medium
    - Request cohort-level retention, fleet expansion, and accessory attach data
  - - Product breadth and refresh velocity
    - Specialists can beat DJI in autonomy, mapping payloads, or agricultural workflows
    - Medium
    - Benchmark Mavic/Matrice/Agras against Skydio X10, Freefly, Inspired Flight, and XAG by workflow
  - - Agricultural installed base
    - XAG can win crop-specific service networks and regional farm channels
    - Medium
    - Verify Agras repeat purchase, dealer density, and country-level service coverage
  - - Regulatory trust
    - FCC Covered List and DoD designation reduce new U.S. model optionality
    - High
    - Track appeal/remand outcome, waivers, and new model authorization decisions
  - - Supply-chain control
    - Anzu shows rebranded DJI hardware can fail if component supply breaks
    - Medium
    - Diligence suppliers, export controls, and non-China component alternatives
  - - Competitor under-scale
    - Skydio, Parrot, and U.S. alternatives remain smaller or narrower than DJI
    - Low
    - Monitor Skydio production ramp, Parrot filings, and Blue UAS procurement volumes
  notes: Risk severity reflects competitive impact on DJI’s moat, not probability; several mitigations require private company or agency procurement data.
