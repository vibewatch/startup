- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / package
  - Price / unit / contract model
  - Included capabilities
  - Discount or unknowns
  - Implication
  rows:
  - - DJI Mavic 4 Pro
    - From about $2,199 at launch
    - Flagship consumer camera drone with 100MP Hasselblad and long flight-time claim
    - U.S. availability and realized channel pricing vary under restrictions
    - Sets the price-performance anchor rivals must explain
  - - DJI enterprise / Dock stack
    - List pricing not captured in dossier sources
    - Matrice, Zenmuse payloads, Dock 2, software, support ecosystem
    - Enterprise discounting, service terms, and realized margins unknown
    - Strong bundle creates switching costs beyond the airframe
  - - Skydio X10
    - About $11.5K-$25K depending on sensor package
    - Autonomy, thermal/telephoto options, public-safety and inspection workflows
    - Package contents and discounts vary by agency deal
    - Regulatory trust comes at premium unit pricing
  - - Freefly Astro
    - About $20K-$30K with 61MP payload in the review sample
    - High-end mapping payloads, multispectral, thermal, LiDAR options
    - Payload and support bundles sold separately in many cases
    - Credible for professional mapping but not a cheap DJI substitute
  - - WISPR SkyScout Pro
    - About $10K drone only; sensors sold separately
    - Modular U.S.-made platform for mapping, inspection, SAR
    - Payload cost and service bundle unknown
    - Potentially flexible but not fully priced without sensors
  - - Inspired Flight IF800 Tomcat
    - About $21.5K without payload in the review sample
    - Rugged U.S.-made heavy enterprise platform with Blue UAS positioning
    - Payloads and integration costs extra
    - Strong compliance fit but premium compared with DJI prosumer options
  - - Anzu Raptor / Raptor T
    - About $5,100 / $7,600 before discontinuation
    - Licensed DJI Mavic 3 Enterprise hardware with U.S. software/data-security pitch
    - No longer for sale after February 2026 component shortages
    - Workaround demand existed, but continuity risk was decisive
  - - Status quo / internal build
    - Labor, aircraft rental, or bespoke engineering cost rather than list price
    - Manual inspection, crewed aircraft, DIY FPV, or outsourced service provider
    - Quality, compliance, training, and insurance costs hard to compare
    - Acts as a budget backstop when compliant packaged drones are scarce
  notes: Prices are list or review-observed estimates, not audited realized transaction prices; some rows are intentionally qualitative where public pricing was unavailable.
