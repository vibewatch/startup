- id: moat-durability-and-displacement-risk
  title: Moat durability and displacement risk
  body: 'The durable part of DJI’s edge is global scale plus integrated engineering; the vulnerable part is the U.S. channel. Share evidence, product cadence, and the difficulty of matching DJI’s performance-price bundle point to continued global strength. Yet U.S. government and public-safety buyers can be forced toward compliant alternatives even if they prefer DJI hardware, and Blue UAS exemptions make that policy channel valuable. Commodity pressure is real at the low end because Autel, DIY builds, and rebranded DJI-derived hardware can imitate pieces of the proposition. It is weaker in full-stack enterprise workflows where docks, payloads, mapping, support, and installed accessories compound. The diligence answer is therefore barbell-shaped: expect DJI to remain the global reference platform, but underwrite U.S. share loss and lower strategic optionality where regulation is binding.'
