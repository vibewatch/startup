tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - DJI
    - Global incumbent / reference platform
    - Canonical 70% civilian share; broad consumer, enterprise, dock, and agricultural footprint
    - Creators, enterprise inspection, public safety, agriculture, mapping
    - Best evidenced price-performance, product breadth, ecosystem, and support depth
    - U.S. geopolitical exclusion and private disclosure opacity
  - - Skydio
    - U.S. autonomy and defense challenger
    - $110M Series F in 2026 at about $4.4B-$4.5B; 60,000+ drones and 3,800+ customers reported
    - Defense, public safety, utilities, critical infrastructure
    - AI autonomy, Blue UAS, DoD pull, domestic manufacturing narrative
    - Premium price and narrower consumer/global breadth; range/payload criticism
  - - Parrot
    - European listed incumbent
    - Euronext-listed; 542 employees reported for 2022
    - Government, defense, mapping, inspection
    - ANAFI USA, European trust posture, public-company visibility
    - Small scale and governance blemish from 2024 AMF sanction
  - - Autel Robotics
    - Chinese direct product rival
    - Private Shenzhen-linked maker; 7% U.S. UAV share reported in 2021
    - Consumer, prosumer, public safety, inspection
    - EVO and Dragonfish breadth, thermal and long-endurance options
    - Shares China-origin regulatory risk with DJI in U.S. procurement
  - - Yuneec
    - Legacy Chinese/Hong Kong drone maker
    - Founded 1999; 1,800 employees listed; supplier-payment issues reported in 2017
    - Commercial mapping, search and rescue, public-safety niches
    - Typhoon, H520, H850 history and PX4/open-source links
    - Weak current momentum and limited evidence of scale resurgence
  - - XAG
    - Agricultural specialist
    - Prominent agriculture-drone player; demand tied to precision agriculture
    - Spraying, spreading, crop monitoring, farm-service networks
    - Deep agricultural workflow focus and field-oriented product positioning
    - Narrower scope outside agriculture; public scale data less comparable
  - - Anzu Robotics
    - Licensed-DJI workaround
    - Raptor line priced at $5,100 / $7,600 before February 2026 discontinuation
    - Enterprise and public-safety buyers seeking DJI-like hardware with U.S. software
    - Comparable Mavic 3 Enterprise hardware and data-security story
    - Component shortages and not automatically NDAA-compliant
  - - Freefly / Inspired Flight / WISPR / Teledyne FLIR
    - NDAA-compliant U.S. and allied set
    - Smaller vendor set; product prices often around $10K-$30K before all payloads
    - Government, mapping, inspection, public safety, defense
    - Compliance, payload specialization, Blue UAS or domestic-source alignment
    - Fragmented, more expensive, and rarely a full DJI ecosystem substitute
  - - AeroVironment and defense primes
    - Defense incumbent / adjacent
    - SkyWatch cites AeroVironment as a large defense UAS manufacturer
    - Military and government programs
    - Battlefield-proven defense procurement credibility
    - Less relevant to consumer/prosumer and many enterprise camera-drone workflows
  - - Status quo / internal build / DIY
    - Substitute rather than branded OEM
    - DIY builds reached 9.82% of 2025 Dedrone-tracked detections
    - Budget-constrained teams, hobbyists, mission-specific operators
    - Avoids vendor lock-in; can tailor mission payloads
    - Fragmented support, compliance, reliability, and insurance burden
  notes: Competitor scale and pricing are public-source estimates or vendor/list data; private peer revenue and installed-base figures are not fully comparable.
