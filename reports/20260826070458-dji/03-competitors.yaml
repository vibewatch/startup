- id: capability-pricing-and-regulatory-posture
  title: Capability, pricing, and regulatory posture
  body: 'Capability parity is uneven by workflow. DJI remains strongest where buyers want a complete, relatively affordable bundle: flight hardware, stabilized imaging, enterprise payloads, docked operations, software, accessories, and support. Skydio can lead on AI autonomy, night or contested navigation, and U.S. trust, but its X10 price band sits in enterprise-budget territory. Freefly, Inspired Flight, WISPR, Teledyne FLIR, and similar vendors cover mapping, public safety, thermal and government missions, often at much higher platform prices or with payloads sold separately. Anzu briefly proved that a DJI-like airframe plus U.S. software was commercially attractive, but its discontinuation demonstrates that component access and NDAA compliance cannot be assumed. The FCC rule makes regulatory posture a buying criterion rather than a footnote: existing equipment may keep flying, but new foreign-made authorizations are restricted.'
