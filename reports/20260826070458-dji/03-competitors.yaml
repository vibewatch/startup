  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Competitor unit economics and realized pricing
    missingEvidence: Actual realized ASPs, discounts, gross margins, support costs, and public-safety or enterprise contract terms for DJI, Skydio, Autel, Parrot, and U.S. alternatives.
    whyItMatters: List prices do not prove economic competitiveness, and realized discounting could change the price-performance ranking.
    diligencePath: Request channel invoices, enterprise quotes, warranty/service terms, and procurement award data by product family.
    relatedQuestionRefs:
    - QP005
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: XAG competitive scale
    missingEvidence: Primary XAG shipment, revenue, and geographic mix disclosures that are comparable with DJI Agriculture metrics.
    whyItMatters: XAG may be a serious agricultural rival, but public sources do not allow a clean share or profitability comparison.
    diligencePath: Collect XAG filings, distributor data, farm-service channel checks, and product-level quotes in top agricultural drone markets.
    relatedQuestionRefs:
    - QP012
    - QP025
  - type: conflicting-data
    severity: material
    topic: U.S. share-shift under FCC and DoD restrictions
    missingEvidence: Post-December-2025 procurement data showing which agencies replaced, retained, or multi-homed DJI and Autel fleets.
    whyItMatters: Policy intent does not directly translate into competitor revenue unless replacement budgets and operational acceptance appear.
    diligencePath: Track public RFPs, Blue UAS awards, agency fleet disclosures, and waiver determinations through 2026.
    relatedQuestionRefs:
    - QP018
    - QP019
    - QP020
    - QP025
    relatedTableRefs:
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: Long-tail NDAA alternatives
    missingEvidence: Complete Blue UAS and NDAA-compliant product roster with up-to-date pricing, payloads, and availability.
    whyItMatters: The U.S. alternative set is fragmented and changes quickly, so a sample can miss a mission-specific substitute.
    diligencePath: Refresh against Blue UAS lists, distributor catalogs, and agency award records before making share forecasts.
    relatedQuestionRefs:
    - QP015
    - QP025
    relatedTableRefs:
    - TP001
    - TP002
