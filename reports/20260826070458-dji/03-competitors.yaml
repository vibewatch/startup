- id: switching-costs-and-channel-power
  title: Switching costs, lock-in, and channel power
  body: 'DJI’s moat is not only the airframe. Operators buy batteries, controllers, payloads, cloud and mapping workflows, maintenance routines, pilot training, spare parts, and dealer support around the platform. That creates a practical lock-in even when a regulator or procurement officer wants a non-DJI path. The FCC’s continued-use language reinforces this dynamic because existing DJI fleets can remain in service while new purchases migrate slowly to Blue UAS or domestic alternatives. In public safety, this encourages multi-homing: agencies keep DJI for installed workflows, test Skydio or other compliant systems for new budgets, and reserve specialized U.S.-made platforms for missions where procurement trust outweighs price-performance. Competitors therefore win wedge accounts before they win full fleet replacement, and the size of that wedge depends on procurement rules more than product preference alone.'
  claimRefs:
  - CP034
  - CP037
  - CP038
  - CP039
  - CP043
  - CP044
