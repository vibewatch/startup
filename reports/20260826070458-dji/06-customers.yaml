callouts:
  - calloutType: strength
    title: El Paso and Agriculture prove production usage
    body: >-
      The customer story is not merely speculative: El Paso's 22-dock deployment and DJI Agriculture's 400,000-drone/operator base show real field usage across public safety and farms. Those proof points are much stronger than typical logo-only evidence.
    claimRefs:
      - CU004
      - CU017
      - CU018
  - calloutType: risk
    title: Retention and concentration are the missing customer diligence files
    body: >-
      DJI does not publish NRR, GRR, churn, segment revenue, top-account concentration, or dealer sell-through. Treat customer durability as plausible but unproven until management provides cohort, channel, and replacement-cycle data.
    claimRefs:
      - CU022
      - CU037
      - CU039
