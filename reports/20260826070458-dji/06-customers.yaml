schemaVersion: report-v2
artifact: customers
slug: dji
runDate: '2026-08-26'
company:
  name: DJI
chapter:
  number: 6
  title: Customers
  summary: >-
    DJI's customer base spans mass-market creators, enterprise/public-safety operators, and agriculture users, with the strongest hard proof in public safety and agriculture rather than in logo-rich enterprise references. El Paso's 22-dock citywide deployment and DJI Agriculture's 400,000-plus drone/operator scale show real usage, while retention, account concentration, and named-customer breadth remain largely private or inferential.
sections:
  - id: segment-map
    title: Customer segments, users, payers, and channels
    body: >-
      DJI reaches customers through three different buying systems rather than one enterprise sales motion. The consumer and creator segment buys camera drones, handheld cameras, gimbals, power products, and accessories through DJI Store, the main DJI site, and resellers; the end user and payer are often the same individual or small creative team, so proof comes from product breadth and market-presence proxies rather than named accounts. Enterprise buyers are more institutional: police, fire, airport, inspection, surveying, construction, mining, utilities, and security teams evaluate Matrice, Dock, FlightHub, Terra, and payload bundles through enterprise dealers and solution pages. Agriculture is a third system in which farms, contractors, dealers, instructors, and service centers jointly create demand for Agras equipment across crop protection, spreading, mapping, and orchard work. The pattern is powerful but hard to diligence because DJI rarely discloses customer lists, account revenue, or top-customer concentration.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU010
      - CU011
      - CU012
      - CU029
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption trajectory and deployment signals
    body: >-
      Adoption evidence is strongest where deployment leaves countable footprints. DJI Agriculture discloses a global installed base of about 400,000 agricultural drones at the end of 2024, 400,000 trained operators, 300 crop types, and usage across 100 countries; the same program says the drone count was up 90% from 2020 and newer third-party coverage says DJI later claimed more than 600,000 agricultural drones in use. Public safety shows a similar pattern of broad dependence without complete account disclosure: legacy reporting and later trade coverage point to DJI having supplied roughly 90% of U.S. public-safety drone fleets historically and about 25,000 DJI drones in U.S. public safety by 2025. The consumer creator base is larger but less transparent, so the chapter treats Dedrone detections, official store breadth, and product refreshes as adoption proxies rather than customer-count proof. Regulatory constraints now interrupt that funnel in the United States, especially for future device authorizations and replacement cycles.
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU009
      - CU013
      - CU014
      - CU015
      - CU016
      - CU031
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-proof
    title: Named customer proof and reference quality
    body: >-
      DJI publishes some named proof, but it is selective and heavily weighted toward public-safety stories. El Paso is the highest-quality reference because it is corroborated by independent local reporting, trade coverage, and DJI-distributed case-study material: the city operates 22 DJI Dock stations across police, fire, and airport operations, has about 40 licensed pilots, and moved emergency-drone response from roughly 45 minutes or an hour to minutes. Spring Valley Volunteer Fire Department is named in DJI's public-safety content as using drones for search, wildfire, and law-enforcement support, but the source is company-published and does not disclose fleet size or contract terms. Deutsche Bahn appears as a Matrice user in public encyclopedia material, supporting industrial inspection adoption but not current activity, payer, or repeat purchase. Those gaps are the point: named logos validate real work, yet they do not prove retention, share of wallet, or account concentration.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU030
      - CU032
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: durability-and-retention
    title: Durability, repeat usage, and satisfaction visibility
    body: >-
      Public durability evidence is more operational than financial. Agriculture usage implies replacement, training, consumables, repairs, and dealer/service-center engagement because DJI cites 3,500 service and repair centers, thousands of certified instructors, and a dealer-led availability model for new Agras products. Enterprise and public-safety durability is visible through support surfaces, FlightHub 2/Dock workflows, and the operational pain agencies face if parts, batteries, or new models become constrained, but there is no disclosed NRR, GRR, churn, renewal term, cohort retention, or satisfaction score. Consumer durability is also inferential: DJI Store and Support expose a wide service surface, but they do not disclose repeat purchase or active-device cohorts. For this reason the cohort figure is explicitly a diligence scaffold, not a retention curve, and the table carries nulls where a SaaS-style report would normally show renewal metrics.
    claimRefs:
      - CU005
      - CU008
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU033
      - CU034
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-and-concentration-risk
    title: Expansion loops, concentration risk, and procurement friction
    body: >-
      DJI's expansion motion looks like hardware-led land-and-expand: creators add accessories and higher-end camera systems, public-safety teams add docks, secure deployment modes, pilots, and adjacent departments, and farms add larger payloads, training, service, and crop workflows. The risk is that the same product strength creates policy dependence. U.S. public-safety agencies built fleets around affordable, reliable DJI equipment, but FCC Covered List rules, federal procurement limits, Texas purchasing restrictions, and the continuing DoD designation case complicate replacements and new purchases even when existing drones can keep flying. DJI also faces competitor substitution pressure in DFR and inspection from U.S. suppliers such as Skydio, although The Drone Girl's Dedrone analysis suggests alternatives still trail DJI in observed global operational usage. The central diligence ask is therefore not whether DJI has customers; it is how much revenue, repeat demand, and channel inventory are exposed to U.S. replacement-cycle disruption.
    claimRefs:
      - CU027
      - CU028
      - CU035
      - CU036
      - CU037
