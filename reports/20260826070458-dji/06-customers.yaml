      - Limitation
    rows:
      - - City of El Paso, Texas police/fire/airport
        - Public safety / municipal DFR
        - 22 DJI Dock stations, FlightHub 2 On-Premises, police/fire/airport coordination
        - Production citywide deployment
        - Response moved from roughly 45 minutes or an hour to minutes; about 40 licensed pilots reported
