  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Retention / repeat usage / satisfaction table null metrics
      missingEvidence: DJI's NRR, GRR, churn, renewal terms, fleet replacement cohorts, customer satisfaction scores, and service attach by segment.
      whyItMatters: Without retention evidence, the diligence case cannot separate durable repeat use from one-time hardware sales and replacement-cycle pull-forward.
      diligencePath: Request cohort revenue, device activation, service renewal, DJI Care, dealer sell-through, and repair-frequency data from management by segment and geography.
      relatedQuestionRefs:
        - QU011
        - QU023
        - QU025
      relatedTableRefs:
        - TU004
    - type: enumeration-incomplete
      severity: material
      topic: Named customer proof table public customer sample
      missingEvidence: A complete named customer registry with deployment dates, production status, outcomes, spend, and authorization to cite references.
      whyItMatters: DJI's public proof shows real deployments but not enough named accounts to verify breadth, concentration, or repeat buying patterns.
      diligencePath: Ask management for top customers, signed reference calls, public-sector procurement records, and renewal history behind each named deployment.
      relatedQuestionRefs:
        - QU007
        - QU010
        - QU024
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: Segment revenue and customer concentration
      missingEvidence: Revenue split by consumer, enterprise, agriculture, geography, dealer/channel, and top accounts, including U.S. exposure.
      whyItMatters: Regulatory restrictions affect the U.S. replacement cycle differently by segment, so concentration cannot be assessed from public usage proof alone.
      diligencePath: Obtain management revenue bridge, channel inventory, top-20 customer schedule, and U.S. authorized-model replacement plan.
