tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer/user/payer
      - Use case
      - Scale
      - Revenue/strategic value
      - Gap
    rows:
      - - Consumer creators and hobbyists
        - Individual creators, hobbyists, prosumers, small media teams
        - Aerial photography, vlogging, action footage, travel content, accessories
        - Millions of units implied by consumer dominance and store breadth; precise active device count undisclosed
        - High-volume brand and accessory funnel; likely broadest customer base
        - No active consumer account count, cohort retention, or geography split
      - - Enterprise public safety
        - Police, fire, airport, emergency-management, and municipal agencies
        - Drone-as-first-responder, search and rescue, firefighting, situational awareness, forensics
        - Historically about 90% of U.S. public-safety drones were DJI; about 25,000 DJI drones estimated in U.S. public safety
        - Strategic proof segment with high switching cost and public visibility
        - Fleet ages, renewal cycles, grants, and post-FCC replacement plans are not disclosed
      - - Industrial inspection, mapping, and construction
        - Utilities, rail, mining, surveying, construction, and asset owners
        - Inspection, geospatial mapping, digital twins, site automation, mining workflows
        - Enterprise pages show broad vertical coverage; named account proof is sparse
        - Higher ASP and software/payload attach through Matrice, Dock, Terra, FlightHub 2, and Zenmuse
        - No top-account list, usage frequency, or segment revenue contribution
      - - Agriculture contractors and farms
        - Smallholders, larger farms, spray-service operators, dealers, instructors, service centers
        - Spraying, spreading, crop protection, orchard management, mapping, training, and repair
        - About 400,000 agricultural drones and 400,000 operators across 100 countries at end-2024
        - Durable ecosystem with training, dealer, service, and crop-workflow repeat demand
        - Dealer sell-through, farm-level repeat purchase, and profitability by geography are private
    notes: >-
      Segments combine official DJI surfaces, independent summaries, and user-specific proof; scale is directional except where DJI Agriculture or public-safety sources disclose counts.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU010
      - CU011
      - CU012
