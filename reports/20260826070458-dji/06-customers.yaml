  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Consumer product ladder from Mini/Air/Mavic/Osmo/Ronin to accessories and services
        - Demand can be broad but opaque by geography and SKU
        - Large top-of-funnel and replacement opportunity, but no revenue concentration disclosed
        - Request sell-through by region, channel, SKU family, and repeat buyer cohort
      - - Public-safety DFR expansion from manual aircraft to docks and FlightHub 2
        - U.S. agencies are heavily exposed to DJI fleets and future procurement restrictions
        - High switching cost could protect installed base yet slow new U.S. deployments
        - Map installed fleet age, battery/parts inventory, grants, and FCC authorization exposure
      - - Agriculture dealer and service-center ecosystem
        - Dealer/channel dependence and local aviation rules drive adoption unevenly
        - Training and service can compound usage if regulatory and service coverage holds
        - Verify dealer contracts, service-center economics, and operator productivity by country
      - - Enterprise inspection and mapping bundles
        - Named customer proof and deployment counts are sparse outside public safety
        - Matrice/Dock/Terra/FlightHub attach may improve ASP but is hard to quantify
        - Request pipeline, installed accounts, expansion ARR/software attach, and renewal terms
      - - Substitution by U.S.-approved alternatives
        - Skydio and Blue UAS options can win government-sensitive accounts
        - Could cap DJI share in U.S. public-sector replacement cycles despite global preference
        - Compare bid win/loss, price-performance, autonomy needs, and compliance requirements
    notes: >-
      Risk rows reflect expansion mechanisms visible in public sources; no top-customer list, segment revenue split, or channel inventory data is public.
