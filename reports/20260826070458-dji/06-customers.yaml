figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: DJI's journey begins in direct or dealer discovery and expands through accessories, software, docks, training, and service.
    data:
      items:
        - label: Discover segment fit
          detail: Creators find store/product pages; agencies and farms begin with enterprise, public-safety, or Agriculture surfaces
          tone: neutral
        - label: Buy hardware bundle
          detail: Buyer selects drone, payload, controller, batteries, accessories, or Agras package through store or dealers
          tone: positive
        - label: Train and operate
          detail: Public-safety pilots, farm operators, and enterprise teams integrate FAA rules, training, and mission workflows
          tone: positive
        - label: Add software or automation
          detail: FlightHub 2, Terra, Dock, on-prem deployment, mapping, and service centers deepen usage beyond the first aircraft
          tone: positive
        - label: Face replacement decision
          detail: U.S. customers assess FCC/DoD restrictions, parts availability, and whether to retain DJI or shift to approved alternatives
          tone: warning
    approximationNotes: Journey stages synthesize retained public materials; they are not measured conversion percentages.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU011
      - CU023
      - CU027
      - CU036
