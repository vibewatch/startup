        - Case-study production examples
        - Brazil coffee operational costs down 70% versus manual spraying; Romania vineyard spray time down from 3-4 days to 2.5 hours
        - Named farm or operator identities and repeat economics are not disclosed
    notes: >-
      Partial enumeration: DJI rarely publishes customer names, so this table keeps named deployments separate from broad installed-base claims and flags every missing commercial detail.
