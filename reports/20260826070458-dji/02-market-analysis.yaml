  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Consumer / prosumer imaging
        - Creator, hobbyist, small production buyer
        - Pilot / content creator
        - Individual or small business
        - Capture aerial photo/video, creator content, travel and events
        - Personal electronics or production equipment budget
        - Better camera, portability, price, social-media content needs
      - - Enterprise inspection and mapping
        - Operations, survey, maintenance or asset manager
        - Field pilot, surveyor, analyst
        - Utility, construction, energy, mining or facilities organization
        - Inspect, map, model, document assets and terrain
        - Operations, engineering, safety or capital-equipment budget
        - Lower truck rolls, safer inspection, faster site data and 3D models
      - - Public safety / first responder
        - Police, fire, emergency management command
        - Drone-as-first-responder pilot or tactical operator
        - Municipal agency, grant program or department procurement office
        - Situational awareness, search, fire overwatch, emergency response
        - Public safety procurement, grants or city technology budget
        - Faster response and lower helicopter dependence, tempered by compliance requirements
      - - Agriculture equipment ownership
        - Farmer, cooperative or large agribusiness
        - Certified operator or farm staff
        - Farm capex, dealer financing or subsidy program
        - Spraying, spreading, seeding, scouting and field mapping
        - Farm equipment / precision-agriculture budget
        - Labor scarcity, input savings, crop yield protection and subsidy availability
      - - Agriculture service model
        - Agricultural service provider or drone contractor
        - Contract pilot and agronomist
        - Farmer customer via per-acre service fee
        - DaaS spraying, mapping, data analytics and prescription services
        - Service-provider fleet capex and farmer operating expense
        - Converts upfront hardware cost into variable operating cost
      - - Drone-in-a-box autonomous sites
        - Security, utility, mining, construction or municipal operations leader
        - Remote operations center and automated dock manager
        - Enterprise automation / security budget
        - Scheduled patrols, incident response, mapping and repeat inspection
        - Operations automation or critical-infrastructure budget
        - Repeatable route, remote site, and labor-cost justification
    notes: >-
      Buyer map is synthesized from DJI Enterprise, Dock 2, agriculture, FAA and market-report sources; budget-owner labels are inferred from the workflow and should be checked in customer diligence.
