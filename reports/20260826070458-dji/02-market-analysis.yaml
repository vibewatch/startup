  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: DJI TAM/SAM/SOM conversion
      missingEvidence: DJI product-line revenue by geography, market segment, and channel sell-through that maps actual DJI sales to each TAM definition.
      whyItMatters: Without segment revenue, a broad drone-market estimate may overstate the market DJI can actually monetize, especially in restricted U.S. categories.
      diligencePath: Request management revenue bridge by geography and product line, then reconcile it against sell-through data from dealers and distributors.
      relatedQuestionRefs:
        - QM024
    - type: missing-source
      severity: material
      topic: Precedence Research cached source usability
      missingEvidence: A current retrieved copy of the Precedence Research drone-market page exposing the actual drone-market values and definitions.
      whyItMatters: The dossier URL was mandatory, but the cached text showed unrelated market teasers rather than the drone data needed for sizing corroboration.
      diligencePath: Re-fetch the page manually or replace it with an accessible analyst summary that preserves publisher, date, scope, values and forecast assumptions.
      relatedQuestionRefs:
        - QM023
    - type: conflicting-data
      severity: material
      topic: Market sizing estimate ranges
      missingEvidence: Comparable, same-scope market models separating consumer hardware, commercial hardware, services, software, defense and delivery networks.
      whyItMatters: Published estimates range from narrow single-digit billions to broad drone-economy totals above US$90 billion, which can move valuation sensitivity by orders of magnitude.
      diligencePath: Build a normalized sizing bridge with identical inclusions, exclusions, base year, forecast year, geography and currency treatment.
      relatedQuestionRefs:
        - QM009
        - QM024
    - type: private-evidence-only
      severity: material
      topic: U.S. market access impact
      missingEvidence: DJI's U.S. revenue exposure by model family, channel, installed fleet, and replacement cycle after FCC and foreign-drone restrictions.
      whyItMatters: Existing devices can continue operating but new-model restrictions can sharply reduce future SAM and channel economics in the premium U.S. market.
      diligencePath: Obtain management U.S. sell-in and sell-through, dealer backlog, inventory age, authorization status and post-restriction replacement-rate data.
      relatedQuestionRefs:
        - QM017
        - QM018
        - QM026
    - type: private-evidence-only
      severity: minor
      topic: Agricultural drone economics
      missingEvidence: Crop-level payback, service-provider utilization, chemical savings and maintenance cost by region for DJI Agras deployments.
      whyItMatters: Public sources show strong installed-base growth but do not prove farm-level unit economics across all geographies and crop types.
      diligencePath: Sample dealer invoices, service-provider utilization logs, maintenance records and customer ROI calculations across China, Brazil, India and the U.S.
      relatedQuestionRefs:
        - QM019
        - QM022
