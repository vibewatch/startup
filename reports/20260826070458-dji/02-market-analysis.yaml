callouts:
  - calloutType: insight
    title: Use multiple TAM lenses instead of one headline market number
    body: >-
      Drone market estimates differ because analysts count different mixtures of hardware, software,
      services, defense, delivery, and regional activity. DJI valuation work should sensitize around
      narrow civilian hardware, commercial systems, and broader drone-economy cases rather than anchor
      mechanically on the largest published TAM.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM035
  - calloutType: risk
    title: U.S. market access is a SAM constraint, not just a legal footnote
    body: >-
      The FCC Covered List and related foreign-drone restrictions block new authorizations for covered
      foreign-produced UAS while allowing existing devices to continue, so replacement cycles and new
      model launches may diverge sharply between U.S. and non-U.S. customers.
    claimRefs:
      - CM030
      - CM031
      - CM032
