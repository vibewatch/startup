  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - BVLOS / U-space / Part 107 regulatory maturation
        - driver
        - 2026-2031
        - Expands routine enterprise operations and reduces waiver friction where regulators normalize drone flights
        - Confirm which regions permit the exact DJI workflows under current aviation rules
      - - Drone-in-a-box automation
        - driver
        - 2026-2030
        - Moves inspection and public safety from ad hoc pilot flights to repeatable site automation
        - Verify Dock attach rate, remote operations approvals and recurring software revenue
      - - Precision agriculture economics
        - driver
        - 2025-2035
        - Labor scarcity and input savings support Agras demand and DaaS service fleets
        - Quantify payback by crop, farm size, chemical savings and service-provider utilization
      - - AI, sensors and payload proliferation
        - driver
        - 2026-2033
        - Supports higher-value mapping, crop intelligence, inspection and autonomous workflows
        - Separate sensor/software margin from hardware margin in customer invoices
      - - U.S. FCC Covered List / foreign-produced UAS rules
        - constraint
        - 2025 onward
        - Blocks new equipment authorizations for covered foreign-produced drones while allowing existing devices to continue
        - Determine U.S. revenue at risk by product generation and replacement cycle
      - - Trust and national-security perception
        - constraint
        - current
        - Pushes public safety, critical infrastructure and federal buyers toward non-DJI alternatives
        - Test buyer willingness to use DJI in each regulated mission profile
      - - High acquisition and maintenance cost
        - constraint
        - current
        - Limits ownership by small farmers and increases reliance on DaaS or subsidies
        - Validate installed-base utilization, maintenance cost and financing/subsidy availability
      - - Conflicting market definitions
        - constraint
        - current
        - Makes TAM-dependent valuation fragile if broad drone-service pools are mistaken for DJI-addressable revenue
        - Build valuation sensitivity around narrow hardware, commercial systems and broader services cases
    notes: >-
      Timing and implications combine market-report drivers with official regulatory constraints; several rows are directional judgments rather than audited forecasts.
