  topStrengths:
    - Dominant ~70% global civilian drone market share with unmatched price-performance and ecosystem breadth.
    - >-
      Vertically integrated Shenzhen manufacturing and rapid R&D cadence across consumer, enterprise and agricultural
      lines.
    - Apparent strong profitability (2025 CN press cites ~25% net margin) despite being a hardware business.
    - Deep, hard-to-replicate installed base in agriculture (~400k Agras units) and non-US public safety.
  topRisks:
    - >-
      US "Chinese Military Company" designation and December 2025 FCC Covered-List / import restrictions cutting off the
      largest premium market.
    - Revenue concentration and geopolitical escalation risk amid an unresolved, remanded federal case.
    - Disclosure opacity — no audited financials — leaving valuation, revenue and funding unverifiable.
    - Key-person dependence on founder Frank Wang and thin public governance.
  unresolvedGaps:
    - Audited revenue, margin and profitability figures (estimates span $3.5B–$11.5B).
    - Primary cap table reconciling conflicting cumulative-funding figures ($108M vs ~$1.5B).
    - A current, priced primary valuation versus the secondary-market marks near $20–22B.
    - Named enterprise customer economics and US revenue exposure under the import ban.
