callouts:
  - calloutType: risk
    title: Key-person and disclosure risk sit at the identity layer
    body: >-
      DJI's control, culture, and strategy concentrate in founder Frank Wang, and the company
      publishes no audited financials or board detail. Treat the ~$15B valuation, ~$11.5B revenue,
      and cumulative-funding figures as estimates requiring primary-source verification.
    claimRefs:
      - CO008
      - CO010
      - CO040
  - calloutType: strength
    title: Verified market leadership anchors every later chapter
    body: >-
      Even with thin financial disclosure, DJI's ~70% civilian-drone share, broad product line, and
      vertically integrated Shenzhen manufacturing are well evidenced and make it the reference
      point for the market, competitor, and valuation analysis.
    claimRefs:
      - CO014
      - CO026
      - CO029
