  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: DJI revenue and profitability
      missingEvidence: Audited income statement or a regulated filing confirming DJI's revenue, gross margin and net profit.
      whyItMatters: Revenue estimates range from US$3.5 billion to US$11.5 billion, which materially changes every downstream valuation.
      diligencePath: Seek audited statements, bank/lender materials, or a data-room P&L; reconcile CN press figures against primary records.
      relatedQuestionRefs:
        - QO010
        - QO023
    - type: conflicting-data
      severity: material
      topic: DJI cumulative funding and cap table
      missingEvidence: A primary shareholder register or cap table reconciling Forge, press and Wikipedia funding figures.
      whyItMatters: Total raised is cited anywhere from ~US$108 million to ~US$1.5 billion, obscuring ownership and dilution.
      diligencePath: Obtain the cap table and round documents; confirm investor stakes, voting rights and secondary transactions.
      relatedQuestionRefs:
        - QO025
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: minor
      topic: Leadership and founder table governance detail
      missingEvidence: Public disclosure of DJI's board, wider C-suite and succession plan beyond founder Frank Wang.
      whyItMatters: Key-person dependence and governance opacity cannot be fully assessed without leadership detail.
      diligencePath: Request an org chart, board roster and succession policy during management diligence.
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: Milestone table private events
