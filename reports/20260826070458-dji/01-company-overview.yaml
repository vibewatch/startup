      - TO003
    figureRefs: []
  - id: milestones-and-trajectory
    title: Milestones and trajectory
    body: >-
      DJI's twenty-year arc runs from a Shenzhen dorm-room flight-controller business to the
      category-defining consumer drone brand and, more recently, to the center of a U.S.-China
      technology dispute. The product spine is well dated: the ready-to-fly Phantom (2013) opened
      the consumer market, the foldable Mavic Pro (2016) defined portable camera drones, and the
      2024–2025 cadence of the US$199 Neo, the US$439 Flip, and the flagship Mavic 4 Pro (launched
      13 May 2025 with a 100MP Hasselblad sensor) shows continued hardware leadership even as U.S.
      availability tightened. The financing and adverse spine is equally important: the 2015 and
      2018 raises, the 2019 fraud disclosure, the October 2022 U.S. Department of Defense "Chinese
      Military Company" listing, DJI's October 2024 lawsuit against that listing, the September 2025
      district-court loss, the December 2025 FCC Covered-List addition and import restriction, and an
      August 2026 partial appellate win that remanded the case. This single chronology of record is
      the reference every later chapter draws on for identity, capital, scale, and regulatory
      context.
    claimRefs:
      - CO004
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO031
      - CO032
      - CO033
      - CO043
    tableRefs:
      - TO004
    figureRefs:
      - FO001
  - id: cover-metrics-and-gaps
    title: Cover metrics and evidence gaps
    body: >-
      Consolidating the identity layer into headline metrics shows a company that is easy to
      describe qualitatively and hard to pin down numerically. The confident metrics are the
      founding date (2006), the founder and headquarters, the ~70% civilian-drone share, and the
      product line; the estimated metrics are the ~US$15 billion valuation anchor and the ~14,000
      headcount; and the genuinely unresolved metrics are audited revenue, gross and net margin,
      and precise cumulative funding, all of which remain private and are reported inconsistently
      across sources. Where a number cannot be supported it should be carried as null with a
      concrete diligence path — for revenue that means seeking audited statements or a regulated
      filing, and for funding it means reconciling the conflicting Forge, press, and Wikipedia
      figures against a primary cap table. DJI's scale dwarfs Western peers such as Skydio (a
      roughly US$4.4 billion private valuation in 2026), which frames the later competitive and
      valuation chapters. The overriding caveat for readers is that DJI's disclosure profile is
      private-undisclosed: strong on product and market evidence, weak on audited economics and
      governance detail.
    claimRefs:
      - CO001
      - CO010
      - CO014
      - CO034
      - CO035
      - CO036
      - CO037
      - CO044
