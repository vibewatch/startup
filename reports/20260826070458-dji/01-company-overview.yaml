company:
  name: DJI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    DJI (SZ DJI Technology Co., Ltd.) is the dominant, privately held Shenzhen drone and
    imaging manufacturer founded in 2006 by Frank Wang, controlling roughly 70% of the global
    civilian drone market and generating large, apparently profitable revenue. The strongest
    verified facts are its founding, headquarters, product breadth, and market leadership; the
    weakest are audited financials, precise cumulative funding, and a formal current valuation,
    which sit behind a $15B anchor mark (2024–2025) and 2026 secondary-market talk near $20–22B.
    The identity-layer diligence issues are disclosure opacity, key-person dependence on Frank
    Wang, and an escalating U.S. regulatory exclusion that shadows every later chapter.
sections:
  - id: identity-and-structure
    title: Identity, structure, and product footprint
    body: >-
      DJI, legally SZ DJI Technology Co., Ltd. (深圳市大疆创新科技有限公司) and branded from "Da-Jiang
      Innovations," was founded on 18 January 2006 and is headquartered at DJI Sky City in the
      Nanshan District of Shenzhen, Guangdong, China. It is a privately held robotics and imaging
      company whose product footprint spans consumer camera drones (Mini, Air, Mavic, Neo, Flip),
      enterprise platforms (Matrice, Dock drone-in-a-box, Zenmuse payloads), agricultural spraying
      drones (Agras), and handheld imaging (Osmo cameras, Ronin gimbals). The company has never
      completed an IPO and remains controlled by its founder, with DJI asserting that
      state-affiliated investors hold under 6% of equity and under 1% of voting rights. That
      structure matters for diligence because it concentrates both economic upside and governance
      control, and because it leaves the company free of the audited public disclosure that a
      listed peer would provide. The one-line description that later chapters can reuse: DJI sells
      vertically integrated flying-camera and robotics hardware plus enterprise software, and earns
      money primarily from selling that hardware worldwide through its own stores and dealers.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO024
      - CO025
      - CO026
    tableRefs: []
    figureRefs:
      - FO002
  - id: leadership-and-key-person
    title: Leadership, governance, and key-person dependence
    body: >-
      DJI's identity is inseparable from founder Frank Wang (Wang Tao, 汪滔), born in Hangzhou in
      1980, who built the company's first flight-control prototypes as a student at the Hong Kong
      University of Science and Technology and moved to Shenzhen to hire his first staff in 2006.
      Wang remains the controlling shareholder and central technical and cultural figure, and public
      profiles estimate his net worth at roughly US$4.8–5.1 billion in 2026, a figure that tracks
      DJI's private-market value. The governance picture is thin by design: beyond Wang, DJI
      discloses very little about its board, C-suite depth, or succession planning, and reporting
      has historically described an intense, founder-driven internal culture. For an investor this
      creates a clear key-person dependency and a governance-opacity gap — the company's direction,
      capital-allocation, and geopolitical navigation all appear to hinge on one individual, and the
      absence of a visible independent board or audited controls is a material diligence flag rather
      than a neutral omission. A 2019 internal-fraud disclosure, in which DJI estimated losses of up
      to CN¥1 billion (~US$147 million) from employee cost inflation, is the clearest historical
      signal that internal controls warrant scrutiny.
    claimRefs:
      - CO002
      - CO007
      - CO008
      - CO009
      - CO027
      - CO028
      - CO040
    tableRefs:
      - TO002
    figureRefs: []
  - id: funding-valuation-scale
    title: Funding history, valuation, and scale
    body: >-
      DJI's capital history is real but poorly disclosed. Press and Wikipedia record a roughly
      US$500 million round in 2015 (investors cited include Accel, Sequoia/HongShan, GIC, New China
      Life Insurance and New Horizon Capital) and about US$1 billion of pre-IPO financing raised in
      2018 for a Hong Kong listing that never happened; private-market databases such as Forge track
      far less (about US$108 million across three rounds), so the true cumulative raise is genuinely
      uncertain. On valuation, the widely used anchor is roughly US$15 billion — Forge cites a "last
      known valuation" as of April 2025 and the Hurun Global Unicorn Index 2025 lists DJI among its
      1,523 unicorns — while 2026 secondary-market reporting points to an implied enterprise value
      nearer US$20–22 billion, with some shareholders selling stakes at a modest discount. Scale is
      easier to evidence than valuation: DJI holds roughly 70% of the global civilian drone market,
      employs on the order of 14,000 people (some estimates run to ~17,000), and Chinese financial
      press reports 2025 revenue near CN¥80 billion (~US$11.5 billion) with net profit above CN¥20
      billion — figures that, if accurate, make DJI both large and unusually profitable for a
      hardware company, though they conflict with older analyst estimates of US$3.5–5 billion.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO029
      - CO030
      - CO041
      - CO042
