  topStrengths:
    - 全球民用无人机市占率约 70%，价格性能比和生态广度难有对手。
    - 深圳垂直整合制造能力叠加快速研发节奏，覆盖消费、企业和农业产品线。
    - 硬件公司仍显现强盈利能力（2025 年中文媒体称净利率约 25%）。
    - 农业（约 400k 台 Agras）和美国以外公共安全场景装机基础深，难复制。
  topRisks:
    - 美国「Chinese Military Company」认定，以及 2025 年 12 月 FCC Covered List / 进口限制，切断最大高端市场。
    - 联邦案件发回重审且悬而未决，收入集中和地缘升级风险仍压着公司。
    - 披露不透明，没有经审计财务，估值、收入和融资都无法核验。
    - 对创始人 Frank Wang 依赖高，公开治理信息薄。
  unresolvedGaps:
    - 经审计收入、利润率和盈利数据（估计跨度 $3.5B–$11.5B）。
    - 原始股权结构表，需要调和相互冲突的累计融资口径（$108M 与 ~$1.5B）。
    - 当前有定价的新股估值，以及接近 $20–22B 的二级市场标记。
    - 具名企业客户经济性，以及进口禁令下的美国收入敞口。
