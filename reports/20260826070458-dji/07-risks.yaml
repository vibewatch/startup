company:
  name: DJI
chapter:
  number: 7
  title: Risks
  summary: DJI’s investability is gated by U.S. national-security, FCC authorization, and procurement exclusions more than
    by product quality. The risk posture is high because a favorable security audit and partial appellate win have not yet
    restored new-model U.S. access or removed the Section 1260H designation.
sections:
- id: regulatory-cliff
  title: Regulatory cliff is the binding risk
  body: 'DJI’s risk stack is dominated by U.S. legal and regulatory exclusion rather than by ordinary hardware execution.
    The Section 1260H Chinese Military Company listing remains live after the D.C. Circuit’s partial remand, so federal procurement
    stigma and contractor avoidance still apply while the lower court reviews classified rationale. The more direct commercial
    cliff is the December 2025 FCC Covered List update: new foreign-produced UAS and UAS critical components cannot receive
    equipment authorization, which blocks new DJI model entry even though existing authorized devices remain usable. The OnDefend
    audit gives DJI a stronger technical rebuttal, but it does not itself answer the policy concern about foreign manufacturing,
    dual-use payloads, and strategic dependence. Residual exposure is therefore critical until DJI obtains a narrowing remedy,
    a conditional approval, or a verifiable supply-chain path acceptable to U.S. agencies.'
  claimRefs:
