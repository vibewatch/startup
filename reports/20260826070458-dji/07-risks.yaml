  - - DoD CMC designation
    - District court remand and any subsequent appeal
    - Designation survives with classified rationale and no narrowing remedy
    - Treat U.S. public-sector upside as structurally impaired
  - - Security perception
    - Independent audit cadence and regulator response
    - No recurring model-by-model audit or material unrebutted finding emerges
