  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / legal risk register completeness
    missingEvidence: Full legal docket inventory, agency correspondence, sealed classified record, patent schedules, privacy
      claims, and jurisdiction-by-jurisdiction operating approvals.
    whyItMatters: The table intentionally covers the material public risks, but private or sealed legal materials could change
      severity and mitigation maturity.
    diligencePath: Have counsel reconcile the table against data-room litigation schedules, agency letters, customs records,
      insurance claims, and sealed-court access where available.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR004
    - QR015
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: U.S. revenue and channel exposure
    missingEvidence: Audited geographic revenue, U.S. SKU-level sell-through, margin by channel, dealer inventory, service-parts
      origin, and replacement-cycle data.
    whyItMatters: The regulatory shock cannot be valued without knowing how much profit depends on new U.S. model availability.
    diligencePath: Request audited financials, management geographic split, dealer reports, U.S. inventory aging, and service-parts
      bill of materials.
    relatedQuestionRefs:
    - QR009
    - QR014
    - QR021
    - QR028
  - type: missing-source
    severity: material
    topic: Security audit durability
    missingEvidence: Full OnDefend report appendices, raw test artifacts, remediation evidence for low-risk findings, SBOM
      details, and audit plan for future firmware releases.
    whyItMatters: A point-in-time audit narrows backdoor allegations but cannot prove future software, app, RF, and supply-chain
      posture remains clean.
    diligencePath: Review the complete report under NDA, require recurring model-by-model tests, and verify regulator acceptance
      of the methodology.
    relatedQuestionRefs:
    - QR007
    - QR013
    - QR029
  - type: private-evidence-only
    severity: material
    topic: Supply-chain localization and Blue UAS eligibility
    missingEvidence: Component-origin bill of materials, alternate supplier qualifications, onshoring plan, and legal analysis
      of Blue UAS or domestic end-product eligibility.
    whyItMatters: FCC exemption pathways and procurement eligibility may hinge on component origin, not just corporate nationality
      or security testing.
    diligencePath: Request BOM, supplier audit reports, localization costs, and written counsel memo on conditional-approval
      paths.
    relatedQuestionRefs:
    - QR011
    - QR025
    - QR029
  - type: private-evidence-only
    severity: material
    topic: Governance, succession, and controls
    missingEvidence: Board roster, management org chart, succession plan, internal audit results, procurement controls, and
      legal/compliance reporting lines.
    whyItMatters: Founder concentration and historical procurement-control issues increase the chance that regulatory response
      and internal execution bottleneck under stress.
    diligencePath: Interview management, inspect board materials, review internal-control testing, and confirm who owns U.S.
      regulatory response authority.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR022
    - QR030
