    - Reduce long-term U.S. share assumptions
  - - IP / patent litigation
    - Case docket, damages reserve, or settlement
    - Material injunction, recurring damages, or no freedom-to-operate plan
    - Demand legal reserve and product-line contingency
  - - Founder / governance
    - Succession and delegated-controls evidence
    - No credible succession plan or independent oversight surfaced in diligence
    - No-go for control-sensitive investment structure
  - - Disclosure opacity
    - Data-room quality
    - Audited financials, cap table, and controls remain unavailable
