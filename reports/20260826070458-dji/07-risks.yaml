- id: market-and-customer-transmission
  title: Market-access risk transmits into customers and channel economics
  body: 'The adverse policy actions matter because DJI is not a small vendor losing a niche channel; it is the default supplier
    for a large share of consumer, commercial, public-safety, agriculture, inspection, and creator use cases. That dominance
    is a strength in normal markets, yet it amplifies the shock when one premium market closes to new models. Existing U.S.
    owners can keep using authorized devices, which slows immediate churn and preserves an installed base for accessories
    and service, but product cycles, repairs, enterprise refreshes, and public-sector procurement will gradually move toward
    approved alternatives if new DJI models remain blocked. The transmission path is straightforward: FCC authorization loss
    reduces launch cadence, channel partners lose premium inventory, customers face higher replacement costs or procurement
    friction, and competitors such as Skydio gain policy-supported opportunities in first-responder, inspection, site-security,
    and national-security workflows.'
  claimRefs:
  - CR012
  - CR019
  - CR020
  - CR021
  - CR022
  - CR036
