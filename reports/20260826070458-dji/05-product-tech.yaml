  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Airframe, propulsion and battery
        - Defines endurance, payload, safety envelope and portability
        - In-house design, batteries, motors, controlled-condition test data
        - Real-world endurance, parts availability and U.S. import exposure
      - - Camera and sensor payloads
        - Converts drones into imaging, mapping, thermal or agriculture instruments
        - Hasselblad cameras, Zenmuse payloads, thermal and multispectral sensors
        - Sensor sourcing, calibration drift and payload-specific compliance
      - - Gimbal and stabilization
        - Enables stable imagery on drones and handheld devices
        - In-house gimbals across Mavic, Osmo, Ronin and Zenmuse
        - Mechanical durability and repair cost are not publicly quantified
      - - Radio transmission and control link
        - Maintains command, HD video and telemetry connection
        - OcuSync/O4+ proprietary radio hardware and algorithms
        - Fingerprintability, FCC authorization, jamming and component scrutiny
      - - Autonomy and perception
        - Supports obstacle avoidance, tracking, return-to-home and automated routes
        - Vision sensors, LiDAR, millimeter-wave radar, ActiveTrack and route planning
        - Edge cases, low-light performance, safety incidents and liability
      - - Fleet software and data processing
        - Manages mapping, cloud modeling, sites, missions and enterprise workflows
        - DJI Fly, Pilot 2, FlightHub 2, DJI Terra, cloud or private deployment
        - Data sovereignty, uptime, API openness and auditability
      - - Dealer, support and service layer
        - Delivers product, training, repairs, care plans and regional adoption
        - DJI Store, authorized dealers, DJI Academy, product support categories
        - Service-level consistency, regional approvals and channel concentration
    notes: >-
      Architecture rows are synthesized from product pages, technical-source descriptions and third-party
