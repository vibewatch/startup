  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / certification / quality metric
      - Status
      - Scope
      - Gap
    rows:
      - - OnDefend independent security assessment
        - Favorable point-in-time result
        - DJI Air 3S with RC 2 and Matrice 4E with RC Plus 2 Enterprise, tested across software, hardware and RF
        - Needs recurring independent validation across more SKUs and firmware releases
      - - No critical, high, or medium-risk findings
        - Company-published audit result
        - Five-month adversarial testing window ending March 2026
        - Full raw test plan, exploit attempts and remediation tickets are not public
      - - No data transmission outside the United States observed
        - Company-published audit result
        - Tested applications and controllers in standard and local data mode
        - Needs validation under enterprise cloud, private deployment and non-U.S. configurations
      - - FCC Covered List UAS restriction
        - Binding U.S. equipment-authorization constraint
        - New foreign-made UAS and critical components, including docks and control links
        - Exemptions or onshoring evidence must be evaluated by product and component
      - - FAA operating framework
        - Operating-law layer for U.S. drone users
        - Recreational, Part 107, public-safety and advanced-operation resources
        - Product capability does not substitute for airspace authorization or Remote ID compliance
      - - DJI support and care surface
        - Public support channel exists
        - Camera drones, handheld, enterprise, agriculture, payloads, software and service requests
        - Public pages do not disclose mean repair time, crash rate or firmware incident metrics
    notes: >-
      Security controls are strongest for the tested OnDefend configurations; regulatory controls are
      summarized from FCC and FAA public guidance as of the run date.
