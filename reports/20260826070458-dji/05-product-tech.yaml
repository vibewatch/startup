  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - User
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - 'Consumer camera drones: Mini, Air, Mavic, Neo, Flip'
        - Creators, travelers, hobbyists, prosumers
        - Mature broad portfolio with frequent refreshes
        - Portability, image quality, obstacle sensing, O4/O4+ transmission, price-performance
        - Unit economics, warranty rates, and U.S. availability by SKU are not public
      - - Flagship Mavic 4 Pro
        - Prosumer and professional aerial creators
        - Fresh 2025 flagship outside constrained U.S. channel
        - 100MP Hasselblad camera, dual tele cameras, 360-degree gimbal, 51-minute stated flight time
        - Independent flight-time and reliability benchmarks by environment
      - - Enterprise Matrice, Mavic Enterprise, Dock, Zenmuse
        - Public safety, inspection, surveying, mining, utilities
        - Mature enterprise stack with payload and dock ecosystem
        - Airframe, payload, dock, Terra, and FlightHub 2 workflow integration
        - Deployment uptime, fleet-management SLAs, and payload attachment margins
      - - DJI Dock 2 / Dock 3 workflow
        - Remote inspection, DFR, mine and site automation teams
        - Commercially available remote operations surface
        - IP55 Dock 2, 10km max effective operating radius, cloud-based modeling, private deployment option
        - Site-level maintenance burden, weather reliability, and U.S. Covered List eligibility
      - - Zenmuse payloads, including P1
        - Surveyors, mapping teams, geospatial operators
        - Mature payload family for photogrammetry and sensing
        - Full-frame sensor, 3-axis gimbal, mechanical shutter, TimeSync and dealer channel
        - Calibration history, sensor supply chain, and payload attach rate
      - - Agras T50/T100/T70P/T25P agriculture
        - Farms, service providers, dealer-trained operators
        - Scaled commercial agriculture line across 100 countries
        - High payloads, LiDAR/radar/vision safety, automated spraying and spreading
        - Regional approvals, chemical-drift proof, service economics, and crop-specific outcomes
      - - Osmo Pocket, Osmo Action, Ronin/RS stabilizers
        - Creators, vloggers, action-camera buyers, cinematographers
        - Mature adjacent imaging portfolio
        - In-house gimbal control and imaging know-how extend beyond drones
        - Product concentration, channel sell-through, and activation/privacy issues
      - - Support, care plans, software and accessories
        - Retail buyers, enterprise admins, dealers
        - Broad public support surface but opaque service metrics
        - Category-specific support, DJI Care, accessories, dealer ordering and store channel
        - Repair turnaround, firmware defect rate, and support NPS by product family
    notes: >-
      Product maturity is inferred from public product pages, support surfaces, and dated releases;
      private SKU revenue, warranty, and margin evidence remains a diligence request.
