  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Product-line economics and reliability
      missingEvidence: SKU-level revenue, gross margin, warranty claims, repair turnaround, return rates and crash or defect statistics by product family.
      whyItMatters: Public product breadth is strong, but underwriting needs proof that hardware scale translates into durable product margins and manageable support cost.
      diligencePath: Request product-line P&L, warranty cohorts, dealer service metrics and anonymized repair-ticket exports from management.
      relatedQuestionRefs:
        - QE015
        - QE025
      relatedTableRefs:
        - TE001
    - type: missing-source
      severity: material
      topic: Security and firmware validation scope
      missingEvidence: Full raw OnDefend workpapers, firmware SBOMs, update signing policies, vulnerability-remediation tickets and repeated testing across more SKUs.
      whyItMatters: The public OnDefend summary is favorable but point-in-time and limited to Air 3S and Matrice 4E configurations.
      diligencePath: Obtain the full audit under NDA, commission recurring independent testing and map every product family to its firmware, app and cloud dependencies.
      relatedQuestionRefs:
        - QE013
        - QE021
        - QE025
      relatedTableRefs:
        - TE004
    - type: conflicting-data
      severity: material
      topic: U.S. market access by model and component
      missingEvidence: Product-by-product FCC authorization status, exemption strategy, inventory levels and supply-chain origin for UAS critical components.
      whyItMatters: Existing devices can continue operating, but new-model authorization limits could shift roadmap, revenue mix and customer substitution behavior.
      diligencePath: Build a SKU authorization matrix with counsel, customs brokers, dealers and FCC counsel, then stress-test U.S. channel revenue under ban scenarios.
      relatedQuestionRefs:
        - QE014
        - QE019
        - QE024
      relatedTableRefs:
        - TE004
        - TE005
    - type: private-evidence-only
      severity: minor
      topic: Enterprise software reliability
      missingEvidence: FlightHub 2, DJI Terra and cloud/private-deployment uptime, incident history, API documentation depth and customer support SLAs.
      whyItMatters: Enterprise workflow value depends on software reliability as much as aircraft and payload specifications.
      diligencePath: Request uptime logs, customer SLA templates, API docs, incident postmortems and named customer references for multi-site deployments.
      relatedQuestionRefs:
        - QE010
        - QE023
        - QE025
      relatedTableRefs:
        - TE003
