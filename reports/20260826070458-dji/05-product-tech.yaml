callouts:
  - calloutType: strength
    title: Product depth creates a reusable engineering moat
    body: >-
      The same control, stabilization, imaging, transmission and workflow software capabilities show up in
      DJI's Mavic, Matrice, Agras, Zenmuse, Osmo and Ronin families, creating scale benefits that narrow
      single-product competitors struggle to match.
    claimRefs:
      - CE001
      - CE004
      - CE010
      - CE015
      - CE018
  - calloutType: risk
    title: U.S. trust gates can override technical performance
    body: >-
      Even favorable security-audit findings do not eliminate the U.S. Covered List and equipment-authorization
      constraints, so product diligence must model regional availability and component-level authorization risk.
    claimRefs:
      - CE024
      - CE027
      - CE028
      - CE029
