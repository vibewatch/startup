  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - Aerial creator captures professional video
        - Scout, fly, frame, film, transfer, edit
        - Mavic 4 Pro with triple camera, 360-degree gimbal, O4+ transmission, QuickTransfer
        - 51-minute stated flight time and 30km stated HD transmission expand shot planning
        - Controlled-condition specs need independent field validation
      - - Compact creator needs everyday vlogging camera
        - Shoot handheld or action footage, stabilize, transfer to mobile workflow
        - Osmo Pocket, Osmo Action, Osmo Mobile and Ronin/RS products
        - 1-inch Pocket 3 sensor and gimbal lineage support low-light and stabilized capture
        - Public sources do not disclose defect rates or attach economics
      - - Surveyor maps a site
        - Fly repeatable path, collect images, process model, deliver map
        - Mavic Enterprise or Matrice plus Zenmuse P1, Terra, FlightHub 2
        - Mechanical shutter, RTK/multispectral options, TimeSync and Terra integration improve data quality
        - Accuracy depends on configuration, GCPs, terrain, firmware and operator practice
      - - Utility or city automates recurring inspection
        - Dispatch crew, inspect asset, document defects, archive data
        - Dock 2 or Dock 3 with Matrice-class drone and FlightHub 2
        - Remote deployment and cloud functions reduce travel and enable repeat missions
        - Requires airspace approvals, site power/connectivity, maintenance, and security acceptance
      - - Farmer sprays or spreads inputs
        - Plan field, map terrain, load chemical or seed, fly route, document application
        - Agras T100/T70P/T25P/T50 series with safety sensors and training
        - Reported cases include lower water use, chemical reductions, and major time savings
        - Crop-specific proof and drift liability vary by country and chemical label
      - - Public-safety operator seeks rapid situational awareness
        - Launch aircraft, stream video, search, inspect, document incident
        - DJI enterprise drones and Docks where allowed; alternatives where compliance forbids DJI
        - DJI remains familiar and capable, but regulatory access can determine procurement
        - U.S. public agencies face DoD/FCC and local procurement constraints
    notes: >-
      Benefits mix company-stated capabilities, official agriculture case studies and third-party
      workflow descriptions; customer-specific productivity and ROI require buyer interviews.
