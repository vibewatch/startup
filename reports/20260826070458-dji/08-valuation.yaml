- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation/return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - High-revenue lens is accurate; non-U.S. growth and agriculture scale offset U.S. restrictions; security/legal evidence
      improves.
    - US$22-30B range centered near US$25B; upside mainly from multiple confidence and exit reopening.
    - Policy reversal may not happen; private financials may disappoint.
    - Requires audited 2025-2026 P&L plus visible exemption or court progress.
  - - Base
    - DJI remains globally dominant and profitable, but U.S. new-model access stays constrained and exit remains delayed.
    - US$15-22B range centered near US$18B; fair value around anchor to modest secondary premium.
    - Liquidity discount, geopolitics, and cap-table unknowns persist.
    - Consistent with current public evidence and the track recommendation.
  - - Bear
    - Revenue closer to older low lens; U.S. restrictions deepen; buyers discount China exposure and exit path.
    - US$10-14B range centered near US$12B; downside below anchor despite product quality.
    - Blocked U.S. launches, enterprise replacement, and unattractive secondary terms.
    - Triggered by no exemption path and weak audited financials.
  notes: Scenario values are estimated enterprise-value ranges in US$B; they are not audited marks or transaction prices.
