- id: diligence-asks-and-investment-path
  title: Diligence asks and investment path
  body: 'The investment path is straightforward: continue tracking the asset, request primary proof, and let evidence rather
    than brand dominance move the recommendation. A disciplined entry would require audited revenue, product-line margin,
    cash conversion, geographic mix, cap-table terms, secondary pricing mechanics, shareholder transfer rights, and legal-regulatory
    contingency planning. A price materially below the anchor could justify work if the buyer can tolerate China/U.S. policy
    risk; a price around or above the 2026 secondary indication needs proof that the high-revenue lens and non-U.S. growth
    engine are real. Conversely, failure to document revenue, U.S. exposure, or exemption strategy should move the stance
    to avoid even if the product moat remains outstanding. This preserves discipline under uncertainty.'
