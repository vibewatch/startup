- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - U.S. authorization blockade persists
    - No credible FCC/DoD/DHS exemption or relief path before next flagship cycle
    - Caps premium-market launches, enterprise upgrades, and strategic-buyer universe.
    - Do not buy above anchor; consider avoid if exposure is material.
  - - DoD designation survives remand
    - Classified record or remand outcome leaves designation substantively intact
    - Keeps reputational, contracting, and exit discount embedded.
    - Require larger discount and legal reserve.
  - - Revenue proves low-lens
    - Audited revenue closer to US$3.5-5B than US$11.5B
    - Raises anchor multiple to about 3.75x a US$4B midpoint.
    - Avoid paying secondary-market premium.
  - - Cap table is investor-unfriendly
    - Preferences, ROFR, transfer limits, or state-linked secondary interest impair economics
    - Reduces realizable return even if enterprise value is fair.
    - Pause until terms are repriced or clarified.
  - - Security evidence fails to move agencies
    - OnDefend-type findings are ignored or rebutted by nonpublic evidence
    - Technical rebuttal does not translate into regulatory relief.
    - Keep track only; no valuation uplift for audit.
  notes: Kill triggers are framed as diligence thresholds; public sources prove the risk categories, not the private thresholds.
  claimRefs:
  - CV036
  - CV037
  - CV040
  - CV047
  - CV048
  - CV050
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials
    - Revenue, gross margin, net income, cash conversion by segment and geography.
    - Determines whether the 1.3x or 3.75x revenue lens is closer to truth.
    - CFO/data room; reconcile BigGo, UpMarket, and older estimates.
  - - U.S. exposure
    - Revenue and margin tied to new models, existing fleet, enterprise, creators, and public safety.
    - Determines magnitude of FCC Covered List downside.
    - Sales ops and regional finance; tie to product-level bookings.
  - - Cap table and secondary terms
    - Shareholder register, preferences, transfer rights, ROFR, valuation methodology, seller identity.
    - Determines whether secondary price is investable or structurally impaired.
    - Legal counsel and company secretary; review transaction documents.
  - - Regulatory pathway
    - FCC/DoD/DHS exemption plans, litigation milestones, agency feedback, classified-record strategy.
    - Determines whether the U.S. cap is temporary, permanent, or worsening.
    - Regulatory counsel; track remand and FCC petition record.
  - - Security audit follow-through
    - Continuous testing plan, remediation evidence, agency response to OnDefend findings.
    - Determines whether technical evidence narrows policy risk.
    - CISO/engineering and outside auditor; inspect retest cadence.
  - - Exit readiness
    - Listing entity, audit readiness, red-chip constraints, subsidiary spinout candidates, strategic-buyer universe.
    - Determines whether a buyer can realize return rather than hold illiquid shares.
    - Board, bankers, and counsel; require documented exit plan.
  notes: All asks require private evidence; none can be fully resolved from public sources alone.
