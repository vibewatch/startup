company:
  name: DJI
chapter:
  number: 8
  title: Valuation
  summary: DJI merits a track recommendation with medium confidence, high risk, and a fair valuation stance. The US$15B anchor
    is defensible only when balanced against revenue uncertainty, 2026 secondary-market color near US$20-22B, and a U.S. regulatory
    overhang that limits the largest premium market and exit optionality.
sections:
- id: final-view-and-price-discipline
  title: Final view and price discipline
  body: 'The valuation call is deliberately price-sensitive: DJI is a company to track, not a name to buy blindly. The positive
    case is unusually strong for a private hardware platform because product velocity, agricultural deployment, consumer loyalty,
    and global share all point to a vertically integrated category leader with real operating scale. The anti-thesis is equally
    investable: the company is private, audited financials are unavailable, the revenue range is wide enough to move the multiple
    by several turns, and U.S. policy has shifted from headline risk to a working constraint on new authorizations. On that
    evidence, the stance is fair rather than attractive. A buyer should underwrite the US$15B anchor as the only conservative
    public mark, treat the US$20-22B secondary indication as liquidity color, and reserve an upgrade until audited financials
    and U.S. market-access paths are demonstrably clearer for an outside investor assessing rights, timing, and downside protections.'
  claimRefs:
  - CV001
  - CV002
  - CV010
  - CV011
  - CV027
  - CV028
  - CV046
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
  - FV004
- id: valuation-lenses-and-scenarios
  title: Valuation lenses and scenarios
  body: 'The revenue conflict is the fulcrum of valuation. If Chinese finance reporting and pre-IPO summaries are directionally
    right, a US$15B anchor sits near 1.3x revenue and looks modest for a profitable global market leader. If the older US$3.5-5B
    estimates are closer to truth, the same anchor sits around 3.75x a US$4B midpoint and the 2026 secondary indication requires
    much more faith in margin, growth, and eventual exit. The base case therefore uses a wider range than a public comp model
    would: bear around US$12B, base around US$18B, bull around US$25B. The goal is not false precision; it is entry discipline
    around what must be proven before paying through the anchor.'
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV030
  - CV031
  - CV032
  - CV043
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV003
- id: comparables-and-market-reference-points
  title: Comparable reference points
  body: 'The comparable set is intentionally imperfect. Skydio is the closest private drone comp because U.S. defense and
    public-safety policy advantages drove a multibillion-dollar 2026 mark, but it is materially smaller than DJI and benefits
    from the very policy regime that hurts DJI. Parrot gives public-market governance and drone focus, yet its scale is too
    small to set DJI’s value. Mobileye provides an autonomy-hardware precedent that public investors have valued in the low-US$20B
    range, but it is an automotive semiconductor/software business, not a drone manufacturer. The comp exercise therefore
    supports a fairness check, not a formula: DJI deserves a scale premium to most drone peers and a geopolitical discount
    to unconstrained autonomy hardware.'
  claimRefs:
  - CV020
  - CV021
  - CV022
  - CV023
  - CV045
  - CV019
  tableRefs:
  - TV004
  figureRefs: []
- id: regulatory-exit-and-thesis-breaks
  title: Regulatory, exit, and thesis-break logic
  body: 'The U.S. regulatory record is the main reason a dominant company does not receive a buy call. The Covered List framework
    blocks new authorizations for covered foreign-made UAS while preserving much existing use, which means near-term installed-base
    value and long-term new-model value diverge. The litigation record has also improved only partially: a D.C. Circuit remand
    creates procedural leverage, but it does not remove the DoD designation or resolve classified evidence. Security-audit
    evidence helps DJI rebut technical claims, yet a clean point-in-time audit of two systems cannot by itself reverse a country-of-origin
    policy. The kill triggers are therefore legal and commercial, not product-quality triggers: no exemption route, no audited
    economics, and no credible exit path at the assumed price.'
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV036
