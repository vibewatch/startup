- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: dominant drone and imaging platform with global share, product cadence, and agricultural installed base.'
    - Audited financials confirming revenue scale, margins, and geographic diversity would increase conviction.
  - - 'Thesis: US$15B anchor can look inexpensive on the high-revenue lens.'
    - A data-room P&L proving the CN¥80B revenue and CN¥20B profit figures would support an upgrade.
  - - 'Anti-thesis: U.S. restrictions cap premium-market growth and exit optionality.'
    - A durable FCC/DoD/DHS exemption or court outcome removing the designation would reduce the discount.
  - - 'Anti-thesis: private disclosure and cap-table terms are opaque.'
    - Primary cap table, preference stack, and secondary terms would make entry price investable.
  - - 'Anti-thesis: secondary marks may reflect seller liquidity rather than company-approved price discovery.'
    - Large, arm’s-length, company-approved secondary trades with transparent terms would improve reliability.
  notes: Arguments synthesize public sources; the what-would-change column is a diligence trigger rather than verified current
    evidence.
