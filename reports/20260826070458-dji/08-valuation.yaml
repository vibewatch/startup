  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: DJI revenue lens
    missingEvidence: Audited 2025 and 2026 income statements by product family and geography.
    whyItMatters: The valuation multiple changes from about 1.3x to about 3.75x depending on which public revenue lens is
      correct.
    diligencePath: Request audited financials, bank materials, tax filings, or investor updates and reconcile them to Chinese
      press and older analyst estimates.
    relatedQuestionRefs:
    - QV021
    - QV007
    - QV008
  - type: private-evidence-only
    severity: material
    topic: DJI cap table and secondary terms
    missingEvidence: Shareholder register, liquidation preferences, transfer restrictions, ROFR terms, and 2026 secondary
      trade documents.
    whyItMatters: Secondary price may not equal investable company value if rights, preferences, or seller motivations impair
      realizable return.
    diligencePath: Review cap table, company approvals, side letters, and broker memoranda before setting an entry price.
    relatedQuestionRefs:
    - QV022
    - QV023
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table
    missingEvidence: A complete set of drone, robotics, autonomy-hardware, and dual-use hardware public trading multiples
      with current market data.
    whyItMatters: The table is a reference set rather than an exhaustive valuation comp universe, limiting precision of the
      fairness check.
    diligencePath: Build a banker-quality comp set with live market caps, revenue, gross margin, growth, and geography adjustments.
    relatedQuestionRefs:
    - QV013
    - QV016
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: U.S. revenue exposure
    missingEvidence: Revenue and gross profit split for U.S. new-model sales, existing fleet support, enterprise, public safety,
      creators, and agriculture.
    whyItMatters: The regulatory overhang only becomes quantifiable when the affected revenue and margin pool is known.
    diligencePath: Request regional bookings, channel sell-through, support revenue, and product-launch allocation by country.
    relatedQuestionRefs:
    - QV017
    - QV023
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: Regulatory classified record
    missingEvidence: Nonpublic national-security rationale and agency response to the OnDefend audit.
    whyItMatters: A clean public audit does not resolve undisclosed evidence that may sustain the Covered List and DoD designation.
    diligencePath: Use regulatory counsel to track remand filings, FCC petition status, and any agency technical rebuttal
      or exemption criteria.
    relatedQuestionRefs:
    - QV006
    - QV020
    - QV030
