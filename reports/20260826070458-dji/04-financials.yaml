    {
      "id": "capital-adequacy-and-financial-verdict",
      "title": "Capital adequacy and financial verdict",
      "body": "DJI probably does not look financing-dependent if the high 2025 Chinese press profit claim is true, but that conclusion cannot be banked without cash, debt, and working-capital schedules. The public capital history only provides context: widely cited press and database sources point to large historical private rounds, while Forge displays a much smaller tracked funding total and warns that private-company metrics rely on limited inputs. Current cash on hand, monthly burn, runway months, inventory financing, supplier payables, capex commitments, and debt or project-finance obligations are all null from public evidence. Financially, DJI is a high-quality but opaque hardware platform: the upside is scale, pricing power, integrated manufacturing, and product breadth; the underwriting blockers are conflicting revenue, unaudited margins, unknown cash conversion, and adverse U.S. regulatory exposure that directly threatens new equipment authorizations and future premium-market revenue.",
