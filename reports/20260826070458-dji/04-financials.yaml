    {
      "id": "traction-versus-private-gaps",
      "title": "Public traction versus private-metric gaps",
      "body": "Traction is easier to observe through external scale indicators than through DJI's own financial statements. DJI reports about 400,000 agricultural drones in use by 400,000 trained operators across 100 countries, and market trackers still show DJI holding roughly 70-80% civilian drone share or 83.48% of detected drones in 2025. Chinese finance press also reports Osmo Pocket 3 cumulative sales above 10 million units and about CN¥20B in revenue, a meaningful product-concentration data point if accurate. Those facts suggest massive installed base and monetizable replacement cycles, but they do not disclose cohort retention, paid software attach, utilization, true enterprise ACV, or channel-level profitability. The gap is especially important because DJI's adjacent imaging markets are attracting Insta360, smartphone OEMs, and gimbal competitors, while U.S. restrictions could cap new-model availability in a premium market. Public traction is therefore strong; private metric visibility remains a diligence blocker.",
