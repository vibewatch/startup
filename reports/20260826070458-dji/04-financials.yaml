    {
      "id": "gtm-and-channel-economics",
      "title": "GTM motion and channel-efficiency proxies",
      "body": "The available evidence supports a split GTM motion rather than a single sales model. Consumer and creator products are bought through self-service e-commerce and retail channels, where list pricing and accessory attach are visible but CAC, returns, channel margin, and promotion intensity are not. Enterprise, public-safety, inspection, mining, and Dock deployments look more sales-led because DJI directs buyers to contact sales or dealers, which implies longer cycles and more implementation/support burden. Agriculture also depends on operators, dealers, and local regulatory permission. Anzu's licensed-DJI workaround illustrates a separate monetization vector: DJI's hardware platform can have value even when U.S.-market trust or country-of-origin restrictions require non-DJI software, assembly, and branding. The diligence ask is to split gross bookings by channel and segment, then bridge list price to realized net revenue after rebates, retailer margins, warranty reserves, and any regional compliance costs.",
      "claimRefs": [
        "CI011",
        "CI012",
        "CI013",
