      "id": "funding-contracts-and-scale",
      "title": "Contract scale, financing, and electrification pushed Zum into late-stage territory",
      "body": "Zum\u2019s public milestones now look like those of a late-stage private platform, not an early marketplace. SFUSD board materials show that the company was already winning formal district procurements by early 2021, and TechCrunch later reported large contract wins with San Francisco Unified, Seattle Public Schools, and LAUSD. The capital story accelerated in two visible steps. First, Zum announced a $130 million Series D led by SoftBank Vision Fund 2, with Sequoia and BMW i Ventures participating, taking total funding above $200 million at the time. Second, in 2026 the company announced a $100 million strategic investment from TPG that it said lifted total funding to $430 million and implied a $1.7 billion valuation. Zum\u2019s own 2025 financial highlights then filled in enough operating detail to make the scale harder to dismiss: $333 million of revenue, 35% year-over-year growth, more than $2 billion of TCV, adjusted EBITDA breakeven, long-term district contracts, and 68.5 million student rides completed in the year. Electrification has become part of the same scale narrative. Oakland\u2019s 2024 all-electric fleet and SFUSD\u2019s planned 2026 deployment show that Zum is trying to combine software-led operations with grid-linked fleet infrastructure rather than remain only a routing and notifications layer.",
