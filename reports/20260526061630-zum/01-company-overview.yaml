      "id": "leadership-and-governance",
      "title": "Leadership bench is visible, but governance rights remain only partly public",
      "body": "Founder continuity is clear. Official sources consistently identify Ritu Narayan as founder and chief executive, while the current leadership page names a broader bench including Vivek Garg as COO, Abhishek Garg as CTO, Dan Berenbaum as CFO, JoAnn Covington as general counsel, and other operating leaders across people, partnerships, marketing, and communications. Public evidence also shows that the executive team has evolved. In mid-2022, Zum announced the arrival of Jay Kim as CFO, Rohit Jain as first CPO, and Shiva Nagabushanaswamy as VP of engineering, while later company materials and the current leadership page show a different finance lead. That does not imply dysfunction, but it does mean later diligence should treat finance-leadership continuity as a timeline, not a static fact. Governance visibility is good enough for an overview but not good enough for control analysis. The leadership page publicly names board members linked to Sequoia, Spark Capital, TPG, and former RingCentral finance leadership, and the 2026 TPG announcement adds Steve Ellis to the board. What remains missing are the specifics that matter for underwriting control: ownership percentages, board committees, investor vetoes, and how much practical influence any one financing sponsor holds today.",
