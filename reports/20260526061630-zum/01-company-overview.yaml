    "number": 1,
    "title": "Company Overview",
    "summary": "Zum entered 2026 as a late-stage private student transportation platform whose public story now combines large district contracts, meaningful disclosed revenue, and an increasingly explicit electrification strategy. The strongest retained evidence supports a Redwood City-based company founded and led by Ritu Narayan, scaled through major school-district awards, lifted by a $130 million SoftBank-led Series D and a $100 million TPG investment, and willing to publish unusually concrete\u2014but still unaudited\u20142025 financial metrics. The same public record also shows governance opacity, inconsistent current-footprint reporting, and at least one labor-organizing episode, which means later chapters should reuse the scale facts but preserve the disclosure caveats."
  },
  "sections": [
    {
      "id": "identity-mission-and-platform",
      "title": "Identity, mission, and platform logic",
      "body": "Zum\u2019s current public identity is much broader than a niche routing vendor or a legacy yellow-bus contractor. The company presents itself as a student transportation platform that coordinates school districts, parents, drivers, and vehicles through one cloud-based operating system. That framing is consistent across the homepage, product pages, CMX launch materials, and parent workflow pages, all of which emphasize real-time tracking, notifications, route optimization, and a shared system of record. The company\u2019s own origin story matters because it explains why the product is designed around family anxiety rather than just fleet utilization. Narayan says the business began when she could not find reliable transportation for her own children, and company materials explicitly note that Zum first served parents directly before scaling into district-wide transportation. The result is a hybrid identity: a software-and-operations platform that still owns the daily ride experience. Public legal pages and regulatory records consistently anchor the company in Redwood City, California, and official materials describe parent, student, and driver apps as well as district dashboards, which gives later chapters enough confidence to treat Zum as a vertically integrated student mobility platform rather than a thin scheduling layer.",
