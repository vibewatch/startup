  topStrengths:
    - >-
      Real scale: public 2025 disclosures include $333M revenue, >$2B TCV, EBITDA breakeven, and tens of millions of
      rides.
    - >-
      Hybrid product model: Zum can sell software, full-service operations, and increasingly EV/V2G-enabled
      transportation rather than one narrow feature set.
    - >-
      Institutional customer proof is broad and unusually concrete for a private company, spanning flagship districts
      plus special-education, charter, and private-school use cases.
    - >-
      Electrification and grid-linked deployments in Oakland, SFUSD, and Branford create strategic upside beyond
      ordinary bus-route management.
  topRisks:
    - Audited financials, gross margin, cash balance, and customer concentration remain undisclosed publicly.
    - >-
      The business is still labor- and operations-heavy, so route coverage, training quality, and district launches
      remain existential execution variables.
    - >-
      EV/V2G optionality is attractive but could stay capital-intensive and grant-dependent for longer than the bull
      case assumes.
    - >-
      Several public company materials use slightly different footprint and funding figures, reinforcing the need for a
      cleaner diligence package.
  unresolvedGaps:
    - Audited financial statements and gross-margin bridge
    - Top-customer concentration and renewal cohorts
    - Software-versus-service revenue mix
    - District-level EV deployment economics and V2G monetization assumptions
