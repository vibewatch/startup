    {
      "id": "market-sizing-lenses",
      "title": "The category is unquestionably large, but public sizing still depends on multiple imperfect lenses",
      "body": "The strongest public sizing conclusion is not one precise TAM number but a set of converging operational and budget anchors. Official and company-authored materials agree that the category moves more than 25 million students per school day and sits on a roughly 500,000-bus installed base that remains overwhelmingly diesel-powered. Where the public record becomes less tidy is annual spend. Zum\u2019s 2022 report card cited about $28 billion of annual nationwide spend, while later company materials described a $50 billion student mobility market. Those figures may reflect different scopes\u2014traditional transportation budgets versus a broader mobility framing\u2014but they are not interchangeable. Additional lenses help. EPA\u2019s Clean School Bus Program alone commits $5 billion over FY 2022-2026, while BusRight\u2019s category framing points to 13,000 transportation leaders moving more than 20 million students daily inside the much larger K-12 system. School Bus Fleet\u2019s annual state-by-state report is also useful because it shows exactly why national sizing remains messy: the industry is measured in buses, contractor-owned buses, drivers, students transported, route miles, and state aid, and many states do not report every category completely. The most defensible market-analysis stance is therefore that student transportation is a large, mission-critical, under-digitized category with real budget scale, but that exact TAM math still needs multiple lenses rather than one authoritative third-party figure.",
