      - number: '8.2'
        title: 只有尊重可比公司集合的边界，当前公开估值才算合理
        blocks:
          - type: paragraph
            body: >-
              最清晰的单一量化锚点，是公司当前公开估值 $1.7 billion，对应 2025 年收入 $333 million，约 5.1x 收入倍数。对于一家声称增长 35%、收入合约期限长、EBITDA
              盈亏平衡的公司，这不明显便宜，也不明显离谱。难点在于选择正确的可比视角。First Student 和 Durham
              证明，校车交通品类可以支撑巨大运营规模，但它们结构上资产更重，也处在不同所有权或披露框架里。Blue Bird 是有用的公开 EV 校车参考，因为它提供真实申报收入和经营利润数据，但它是
              OEM，不是学区出行平台。HopSkipDrive 和 BusRight 可作为软件或工作流参考，但规模更小，运营可比性也弱。公开资料下合理的结论是，Zum
              夹在多个品类之间，因此估值也应落在纯软件亢奋和纯校车运营商谨慎之间。这也是为什么当前估值更像合理价，而不是明确便宜。
