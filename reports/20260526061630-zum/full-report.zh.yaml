      - number: '2.4'
        title: 可视化、劳动力和空气质量拉动采用，采购和 EV 资本开支拖慢速度
        blocks:
          - type: paragraph
            body: >-
              这个市场的增长驱动因素异常具体。家长对可视化的需求很强：Zum 自己的调研称，83% 的家长会使用到达时间 app，67% 认为校车应当像包裹一样可追踪；基于 NORC
              的公司研究也指向更广泛的交通焦虑问题，并带来真实的出勤和学习成本。运营痛点同样清晰。BusRight 称，一些车队早晨开工时司机短缺 15% 到 30%；Rockford
              的公开信息把缓解司机短缺视为现代化的主要理由。政策和气候因素也重要。EPA 的 Clean School Bus Program、学区对空气质量的担忧，以及面向公用事业的 V2G
              经济性，都在把市场推向电动化。但采用并非没有摩擦。采购流程可能很慢，并且由董事会驱动；SFUSD 的买方要求显示，一个学区会同时评估很多利益相关方和能力。电动化仍面临核心成本问题，因为 EPA
              称新电动校车成本可能是柴油校车的两到三倍，尽管 NREL 和 EPA
              都指出资产生命周期内运营成本更低、闲置时间更灵活。最后，公开数据本身碎片化，也让基准比较和采购对比更难。净效果是：市场具备强现代化顺风，但采用节奏取决于运营商能否像技术论证推进那样快地清掉劳动力、预算和实施障碍。
            claimRefs:
              - CM020
