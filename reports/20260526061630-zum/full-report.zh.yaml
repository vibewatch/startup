    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与平台逻辑
        blocks:
          - type: paragraph
            body: >-
              Zum 现在的公开定位，已经不只是小众路线软件商或传统黄校车承包商。公司把自己定义为学生交通平台，用一套云端操作系统协调学区、家长、司机和车辆。这个叙事贯穿官网、产品页、CMX
              发布材料和家长工作流页面，重点都落在实时追踪、通知、路线优化和共享记录系统。公司自己的起源故事也重要，因为它解释了产品为什么围绕家庭焦虑设计，而不只是追求车队利用率。Narayan
              称，业务起点是她无法为自己的孩子找到可靠交通；公司材料也明确写到，Zum
              最早直接服务家长，之后才扩展到全学区交通。结果是一种混合身份：软件加运营的平台，同时仍掌握每天的乘车体验。公开法律页面和监管记录都把公司锚定在 California 的 Redwood
              City，官方材料也描述了家长、学生、司机 app 和学区仪表盘；这些证据足以让后续章节把 Zum 视为垂直整合的学生出行平台，而不是一层很薄的排班工具。
