  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: Zum 的公开财务故事，是合同化运营与软件式控制层的混合体
        blocks:
          - type: paragraph
            body: >-
              最清楚的财务结论是，不能把 Zum 建模成单一产品供应商。公开材料描述的是一种混合业务：长期全托管学区合同，与可在接管运营之前或替代接管运营落地的独立技术平台并行。Fresno 的推进顺序尤其有用：Zum
              先卖技术，之后扩展到全托管特殊教育交通。定价看起来也是逐份合同谈判，而不是公开、干净的按座位 SaaS 费率。SFUSD 董事会材料显示，学区采购同时比较价值和日价格；Zum
              在该项目中的投标把更低的综合日价格和更高价值评分配在一起。客户案例和学区公告支持同样模式。Zum
              对外销售的经济结果，是成本节省、路线效率和可视化，而不是一张价目表。这符合学校交通作为企业级运营销售的特征：学区购买的是可靠性、家长信任和劳动力覆盖，也同时购买车辆或软件。财务含义是，收入质量更少取决于交易量，更取决于合同能否保持长期、续约，并从软件切入口扩展到更宽运营范围。
