      - number: '5.2'
        title: 公开架构围绕路线智能、实时数据和学生个性化工作流
        blocks:
          - type: paragraph
            body: >-
              Zum 的公开架构更偏运营，而不是深入到具体基础设施。保留证据反复展示同一组功能核心：实时数据驱动路线设计，学区团队使用仪表盘，家庭使用 GPS
              和地图视图，司机平板呈现学生需求，事故工作流回流到运营中心。路线引擎并没有被描述为通用优化软件；管理层明确表示，它会考虑分层铃声时间表和学生定制需求。2021 年 SFUSD 材料已经提到
              DriveCam、学生乘车读取器、司机平板和路线分析，说明这一工作流已经产品化多年。后续安全和增强功能文章又补充了 RFID、SIS
              集成、数字化安全检查、事件捕捉和末站数字标签。换句话说，今天公开可见的架构，是一张连接学区规划、司机执行、家庭沟通和事后可追溯性的工作流网络。看不见的是更深的技术实现细节——云栈、可用性工程、数据模型或 API
              设计——所以架构故事在功能范围上很强，但基础设施细节仍偏薄。
