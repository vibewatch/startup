          - type: paragraph
            body: >-
              Zum 最有差异化的战略动作，也制造了最清晰的依赖风险。电动化车队和 V2G 部署就是例子：价值主张更深，但 Zum 也更依赖公用事业公司关系、充电硬件、拨款支持和学区场地准备度。EPA 对 Clean
              School Bus Program 的 2026 年评估，在本就高昂的资本开支之上又叠加政策不确定性；EPA 自己的解释也说清楚，电动巴士相较柴油车仍有 2-to-3x 的前期成本溢价。Oakland
              的经验同时展示上行空间和依赖性：公用事业协调和 EPA 资金支持帮助项目落地。数据侧，Zum 平台越来越依赖学生信息、签到 /
              签出系统、事故数据和家庭端应用使用。战略上这很有力，但也意味着学区数据质量差、车载远程信息弱，或家庭端应用采用率低，都会拉低服务质量。更广义的合作伙伴依赖结论是，Zum
              不再只依赖司机和巴士；它越来越依赖数据质量、公用事业公司、拨款、充电桩，以及学区把更互联的系统真正运营起来的意愿。
            claimRefs:
