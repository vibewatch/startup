        - 补助支持团队和电动校车产品线
        - 购买校车和充电桩的学区与运营商
        - 车辆硬件加资金支持
        - 即便不是直接路线运营对手，在 EV 采购中也很重要
    notes: 本表混合了运营商、软件平台和 EV 相邻 OEM，因为学区越来越会把它们放进同一个 现代化决策里比较。
