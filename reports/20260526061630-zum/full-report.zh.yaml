  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Zum 面对的不是单一竞品类别，而是分层竞争格局
        blocks:
          - type: paragraph
            body: >-
              最重要的竞品洞察是结构性的：Zum 所在的是分层品类，而不是一个由同类产品正面对比的单一市场。First Student 和 Durham
              代表传统或在位全托管运营商，拥有庞大既有车队、劳动力深度、维护系统和长期学区关系。HopSkipDrive 代表现代补充模式，围绕小型车辆、灵活司机供给和 AI
              辅助路线，服务固定校车路线难覆盖的行程。BusRight 代表软件优先的路线和通信层，卖给学校交通组织，但不一定拥有车队。Blue Bird 不是直接的路线或运营竞品，但它很重要，因为电动校车 OEM
              和补助支持组织会影响学区如何思考车队转型和资本开支。Zum 位于这些类别之间：比 BusRight 或 HopSkipDrive 更垂直整合，比 First Student 或 Durham
              更偏软件、更重电动化，也比 Blue Bird 这样的 OEM 更偏服务运营。这个混合位置具有战略吸引力，但也意味着 Zum 必须证明自己能跨更多职能执行，而许多单层竞争对手不需要这样。
