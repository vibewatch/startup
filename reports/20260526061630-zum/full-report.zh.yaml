  - id: TV001
    title: 投资建议汇总表
    columns:
      - 维度
      - 公开证据
      - 评估
      - 含义
    rows:
      - - 规模
        - 收入、TCV、乘车次数、数千所学校
        - 强
        - 这是一家真实的后期运营型公司
      - - 盈利方向
        - 调整后 EBITDA 打平，贡献利润率改善
        - 令人鼓舞
        - 支撑合理到偏正面的基准情景
      - - 披露质量
        - 仍没有审计报表、现金余额、集中度或毛利率细节
        - 弱
        - 阻碍给出有把握的买入判断
      - - 资本结构
        - $430M 累计融资，$1.7B 估值
        - 足够，但不完全透明
        - 足以支持扩张，不足以支撑完整尽调定价
      - - 差异化
