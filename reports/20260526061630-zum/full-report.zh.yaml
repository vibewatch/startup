  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 目标市场大于黄校车，但小于全部 K-12 支出
        blocks:
          - type: paragraph
            body: >-
              如果把全部教育支出都当成可触达市场，Zum 所在市场很容易被高估；如果只把它看成外包黄校车，市场又会被低估。保留下来的证据显示，至少有四层关键市场。第一层是传统全托管运营，First Student
              等服务商在一份外包合同里出售车辆、司机、维护、路线和特殊需求交通。第二层是补充性小型车辆网络，HopSkipDrive
              等公司处理溢出需求、替代安置，或固定巴士路线难以服务的学生需求。第三层是软件和操作系统，BusRight 和 Zum 等平台向学校交通组织出售路线、实时
              GPS、通信、乘车可视化和司机工作流。第四层是电动化和公用事业整合，校车车队变成与充电基础设施、联邦补助甚至 V2G 服务绑定的资本资产。因此，市场范围包括家校交通运营、特殊教育、路线、调度、家庭沟通和 EV
              转型工作流，但不包括课堂教学、泛 K-12 预算类别，或不由学区交通团队控制的公共交通。
