  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险从公开信息看可控，但并非不存在
        blocks:
          - type: paragraph
            body: >-
              Zum 的公开法律和监管图景并不令人警惕，但足够实质，应留在风险章节中。最清晰的公司特定法律信号不是消费者诉讼，而是劳工：NLRB 案卷显示，2023 年有一起涉及 Maryland
              司机、厢式车司机和随车人员的工会组织案。该案不能证明劳工不稳定普遍存在，但确实说明公司的劳动力模式可能进入正式劳工流程。监管侧，学校交通本身是高度治理的品类。NHTSA
              强调，校车属于道路上最安全、监管最严的车辆之一，这意味着运营商在严格安全基线下竞争，一旦上车、下车或停车臂合规失败，暴露会尤其大。Zum 自己的条款和隐私页面也清楚表明，公司处理由 app
              驱动的家长、学生和司机数据，因此承担有意义的隐私和数据处理义务。公开结论因此需要平衡：保留来源没有显示 Zum 遭遇广泛执法浪潮，但劳工组织、校车监管和基于 app
              的学生数据叠加起来，使法律风险底线显著高于普通企业 SaaS 产品。
