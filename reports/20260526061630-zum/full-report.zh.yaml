  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 风险 / 上行触发因素
      - 示意估值区间
      - 推演结论
    rows:
      - - 乐观
        - 增长保持 30%+，EBITDA 杠杆改善，EV/V2G 可以变现，披露质量提升
        - 审计数字和更强队列证据
        - ~$2.2B-$2.6B
        - 当前估值还有更多上行空间
      - - 基准
        - 增长放缓但仍健康，合同保持耐久，披露仅部分改善
        - 当前的动能与不透明组合延续
        - ~$1.5B-$1.9B
        - 当前公布估值看起来合理
      - - 悲观
        - 集中度、资本开支或利润率不透明，促使投资人把 Zum 更像复杂运营商、而非平台来估值
        - 政策或执行挫折打击信心
        - ~$0.9B-$1.2B
        - 当前估值可能明显压缩
    notes: 情景区间只是示意估计，依据来自公开规模、增长和风险证据，而不是完整 DCF 或经审计的可比公司组。
