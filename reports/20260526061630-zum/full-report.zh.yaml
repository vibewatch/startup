      - number: '1.2'
        title: 管理层阵容清晰，但治理权利仍只部分公开
        blocks:
          - type: paragraph
            body: >-
              创始人延续性很清楚。官方来源持续把 Ritu Narayan 列为创始人兼 CEO；当前领导团队页面还列出更宽的管理层，包括 COO Vivek Garg、CTO Abhishek Garg、CFO Dan
              Berenbaum、总法律顾问 JoAnn Covington，以及负责人事、合作伙伴、营销和传播的运营高管。公开证据也显示，高管团队一直在变化。2022 年中，Zum 宣布 Jay Kim 加入担任
              CFO、Rohit Jain 担任首任 CPO、Shiva Nagabushanaswamy
              担任工程副总裁；但后续公司材料和当前领导团队页面又显示财务负责人已经不同。这不代表公司失序，但意味着后续尽调应把财务领导连续性看成一条时间线，而不是一个静态事实。治理可见度足够支撑概览，却不足以做控制权分析。领导团队页面公开列出与
              Sequoia、Spark Capital、TPG 和前 RingCentral 财务领导层相关的董事，2026 年 TPG 公告又写到 Steve Ellis
              加入董事会。缺口仍在投资核查最关心的细节：持股比例、董事会委员会、投资人否决权，以及今天任一融资方到底拥有多少实际影响力。
