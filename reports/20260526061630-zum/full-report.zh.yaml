      - number: '8.4'
        title: 建议：继续研究；若披露质量追上运营动能，则有上行空间
        blocks:
          - type: paragraph
            body: >-
              有纪律的投资者读完保留的公开记录，应一边认可 Zum 的进展，一边谨慎看待仍无法了解的部分。公司规模、合同深度和产品野心都足以让人把它视为重要的后期出行平台。与此同时，利润率、集中度、准备金和 EV
              部署经济性仍有足够不透明，仅靠公开证据就给出清晰「买入」还太早。因此最合适的建议是继续研究，置信度为中，估值立场为合理。如果经审计披露改善、客户质量指标守住，上行情景可信；如果市场最终认定这家公司比收入叙事显示的更脆弱、更依赖资本，下行情景也同样可信。因此，最终尽调应先聚焦经审计报表、客户集中度、续约质量和
              EV 项目经济性，再判断当前估值是否便宜。
