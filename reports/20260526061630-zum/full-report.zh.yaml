  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 乐观逻辑
      - 反向逻辑
      - 决定因素
    rows:
      - - 收入质量
        - 长周期学区合同叠加软件层，可以复利式积累可预测收入
        - 合同质量可能掩盖客户集中度，或服务密集型经济性
        - 审计报表和客户结构
      - - 利润率路径
        - 打平和利用率改善暗示单元经济有扩展性
        - 劳动力和 EV 复杂度可能把利润率压在软件预期之下
        - 按业务线披露毛利率，以及成熟客户队列
      - - 竞争位置
        - 混合产品可以同时打赢传统公司和纯软件同行
        - 混合范围也可能比任何单层竞争对手承担更多执行负担
        - 续约赢 / 输数据和实施表现
      - - EV 可选性
        - V2G 和电动化可以加深客户价值，并创造战略上行空间
        - EV 资本开支可能继续依赖补助，且执行负担重
        - 学区级项目经济性
      - - 退出潜力
        - 如果披露改善，增长叠加规模可支撑 IPO 或溢价战略兴趣
        - 没有审计透明度，公开市场准备度仍弱
        - 准备度材料包和治理细节
    notes: 按当前记录，投资逻辑和反向逻辑都说得通，所以建议仍保持克制。
