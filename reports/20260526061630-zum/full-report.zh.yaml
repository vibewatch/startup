      - number: '2.2'
        title: 品类规模毋庸置疑，但公开测算仍依赖多个不完美视角
        blocks:
          - type: paragraph
            body: >-
              最强的公开市场规模结论，不是一个精确 TAM 数字，而是一组彼此靠近的运营和预算锚点。官方与公司自有材料都认为，这个品类每个上学日运送超过 25 million 名学生，存量校车约 500,000
              辆，并且仍以柴油车为主。公开记录真正变得不整齐的地方，是年度支出。Zum 2022 年报告卡引用了全国年度支出约 $28 billion 的数字；后续公司材料又称学生出行市场规模为 $50
              billion。这些数字可能对应不同范围——传统交通预算与更宽的出行口径——但不能互换。其他视角也有帮助。EPA 的 Clean School Bus Program 在 FY 2022-2026 期间单独承诺
              $5 billion；BusRight 的品类叙事则指向 13,000 名交通负责人，在更大的 K-12 系统内每天运送超过 20 million 名学生。School Bus Fleet
              的年度州别报告同样有用，因为它准确展示了全国测算为什么混乱：行业用车辆数、承包商拥有车辆数、司机数、运送学生数、路线英里和州补助来衡量，而且许多州并不完整报告每一类数据。因此，最可辩护的市场分析立场是：学生交通是一个规模大、任务关键、数字化不足且预算真实的品类，但精确
              TAM 计算仍需要多个视角，而不是一个权威第三方数字。
