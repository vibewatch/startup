      - 监控事项
      - 终止标准
      - 下一步尽调
    rows:
      - - 司机质量
        - SafeGuard、背景调查、培训、DVIR
        - 司机配置、事故、辅导节奏
        - 路线持续漏接，或事故严重度上升
        - 索取司机流失率、培训完成率和事故率历史
      - - 学生可追溯性
        - RFID、签到 / 签退、摄像头集成、事故流程
        - 扫描失败、漏接、家长投诉
        - 反复无法核验儿童位置或交接
        - 索取事故响应 SLA 和扫描失败率
      - - 启动执行
        - 启动文章强调暑期准备和路线演练
        - 准点率、路线覆盖、启动投诉
        - 标杆学区启动后无法持续维持完整覆盖
        - 按学区索取启动准备度评分卡
      - - EV 经济性
        - 补助支持、公用事业合作、V2G 设计
        - 净资本开支、充电桩延误、政策变化
        - EV 项目必须持续依赖补贴才算得过账
        - 索取学区级 EV TCO 模型
      - - 客户集中
        - 大型公开学区案例主导公开叙事
        - 大客户收入结构和续约日历
        - 一两个学区主导收入或续约风险
        - 索取集中度和续约时间表
      - - 披露质量
        - 条款、隐私和安全文章细节充分，但财务 / 法律细节更薄
        - 正常运行时间、准备金、网络安全披露、留存队列
        - 管理层开放后，关键尽调项仍不可得
        - 最终承诺前索取完整尽调材料包
    notes: 终止标准是实用观察点，不是预测。它们聚焦公开成功主张最可见、也最脆弱的具体领域。
