            body: >-
              运营风险是最重要的品类风险，因为 Zum
              的承诺每天早晨和下午都被实际体验。保留证据中最强的反向来源都指向同一组脆弱点：车队老化、维护负担、司机短缺、通勤时间长、霸凌和看护空档、硬件现代化不足，以及柴油暴露。Zum
              自己的品类风险文章坦率写到，校车常常服役 15 年或更久，技师能力有限，摄像头或停车臂覆盖在行业内仍不一致。司机侧同样关键。BusRight 的市场叙事称，一些车队每天开始时司机短缺 15% 到 30%；而
              Zum
              自己的上线文章反复强调路线覆盖和富余司机——这间接说明管理层知道覆盖失败会摧毁信任。长通勤和信息分散又制造了另一类运营风险，因为它们影响睡眠、运动和课堂准备，不只是物流。风险章节的结论很直接：路线覆盖、车辆就绪、事故处理和劳动力可得性，不是
