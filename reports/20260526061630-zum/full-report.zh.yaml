      - number: '8.3'
        title: 公开情景支持合理的基准情景，同时保留真实上行和下行
        blocks:
          - type: paragraph
            body: >-
              情景逻辑最好由公开证据驱动，而不是假装精确。乐观情景下，Zum 继续作为混合平台复合增长：收入延续近期增速，EBITDA 杠杆改善，客户结果保持可见，EV/V2G
              可选性变成可变现优势，而不是资本负担。这种情景可以支撑高于当前标记的估值。基准情景下，公司执行足够好，能维持当前溢价，但还不足以抹平披露缺口；在这个世界里，已公布的 $1.7 billion
              估值已经吸收了大部分合理上行。悲观情景下，最大风险不是需求消失，而是市场认为公司应该拿更低倍数：集中度、资本开支或利润率不透明，让它看起来更像复杂运营商，而不是可扩展软件平台。公开证据支撑三种情景，因此建议应保持纪律，而不是宣传口吻。
