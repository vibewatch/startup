  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Zum 的产品是学生出行操作系统，不只是家长 app
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，Zum 的产品应被理解为横跨学区、家长、司机和车辆的操作系统，而不是单个面向乘客的 app。公司自己的表述强调，CMX 是连接学生、司机和学区的底层。支持页面又把它拆成具体模块：家长
              app、学生和司机 app、学区仪表盘、路线规划工具、调度工作流和乘车验证功能。这一点重要，因为产品定义会改变后续章节对收入和竞争的看法。面向家长的追踪 app
              容易模仿；一个能协调路线、学生个性化指令、劳动力工作流和车辆状态感知的集成系统更难复制。产品也不限于全托管运营。公开部署语言和其他章节证据显示，Zum
              可以先单独销售技术层，再扩展到更深运营。因此，这个产品既是软件界面，也是运营框架；正确的产品视角应是“出行系统”，而不是“校车追踪 app”。
