  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 乐观情景在于真实规模叠加软件杠杆；反向逻辑在于不透明叠加资本密集
        blocks:
          - type: paragraph
            body: >-
              公开记录足以支撑一个真实的投资逻辑。Zum 已不再是投机性的出行概念。公司公开披露了 $333 million 收入、超过 $2 billion 的 TCV、调整后 EBITDA
              盈亏平衡，以及一串大型公立学区案例。核心乐观逻辑是：这是一家后期私营公司，合同规模可见，靠软件控制工作流，客户结果也比泛泛的「智能巴士」叙事更扎实。反向逻辑同样清楚。Zum
              仍未披露经审计财务、客户集中度、软件与服务收入结构，或 EV 项目经济性，细节不足以按成熟上市发行人的标准做投资判断。EV 和 V2G
              战略有吸引力，但也叠加了对拨款、公用事业公司、充电桩和具体学区经济性的依赖。因此，基本投资逻辑本身并非争议点；真正有争议的是尽调底稿的质量。
