        - 真实
        - 证明其相对纯校车运营商框架应有溢价
      - - 建议
        - 继续研究
        - 最终判断
        - 好公司；但基于公开证据，还不是干净的便宜标的
    notes: 这是对公开记录的最高层综合，并有意把披露质量与增长、规模放在同等权重。
