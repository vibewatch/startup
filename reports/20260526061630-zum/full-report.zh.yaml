companyProfile:
  summary: >-
    Zum 是一家总部位于 Redwood City 的学生出行平台，由 Ritu Narayan 创立并担任
    CEO。公司把路线优化、家长与学区可视化、司机工作流和面向学区的全托管运营整合在一起。业务从家庭用车起步，已经演进为面向学区规模的交通平台，服务数千所学校，拿下标杆学区合同，并继续叠加电动化 / V2G
    层。公开披露显示，公司已有可观的后期规模，也多次获得机构客户采用；但若要完整投资核查，审计财务和客户集中度等细节仍不够。
