      - number: '3.4'
        title: 切换成本真实存在，但品类仍足够碎片化，难以形成垄断控制
        blocks:
          - type: paragraph
            body: >-
              学生交通的护城河问题，不在于切换成本是否存在——它显然存在——而在于这些成本能否带来持久排他性。学区上线一个交通供应商时，买的不只是路线计划。它们会嵌入家长沟通、司机工作流、安全手册、车队分配、校历、异常处理，有时还包括停车场或充电基础设施。这会给替换带来明显摩擦，也赋予在位者分销力量。但同一批公开记录也显示，多宿主是可能的。一个学区可以保留核心校车运营商，叠加一层软件，并继续为小众行程使用补充性小型车辆供应商。这种碎片化限制了任何单一竞争者的力量。First
              Student 的规模构成强护城河，但当传统运营商在可视化或特殊需求敏捷性上交付不足时，软件驱动的新进入者仍能切入。NASDPTS 也显示，周边生态非常宽，州级负责人、管理员、OEM
              和供应商都会影响学区眼中的“市场标准”。因此，Zum 的护城河更多来自整合质量，而不是任何单一维度上的不可战胜。若它能持续比同业更好地结合学区执行、家长信任和 EV
              基础设施，防守位置就成立。若路线、追踪和通信在供应商之间商品化，差异化会迅速收窄。
