      - number: '1.4'
        title: 劳工信号和披露边界，让概览不能只讲增长
        blocks:
          - type: paragraph
            body: >-
              公开记录足以证明公司有真实规模，但还没有干净到可以放下尽调警惕。第一，Zum 现有材料对覆盖范围并不完全一致。一份 2025 年新闻稿称，公司在 15 个州服务超过 4,000 所学校；2026 年 CMX
              材料则称平台在 17 个州、超过 4,500
              所学校被采用。这些数字可能本来就衡量不同口径——合同服务覆盖范围与平台采用范围——但后续章节不能把它们互换使用。第二，公开治理披露远未达到股权结构表或控制权透明。公开页面列出高管和若干董事，却没有披露持股比例、委员会结构或投资人权利。第三，NLRB
              记录显示，Zum 在 Maryland 的司机和随车人员中也经历过正式劳工组织流程。该案没有产生最终集体谈判结果，但仍然相关，因为 Zum
              的模式依赖大规模、纪律性强的运营劳动力。因此，公司概览的结论需要平衡：Zum 显然已经越过概念验证阶段，但后续章节最需要的若干输入——准确的当前覆盖范围、控制权利和劳工韧性——从公开证据看仍只部分可见。
