              Zum 2025 年披露强于大多数私营市场运营商更新，因为它把收入规模与 TCV、EBITDA、贡献利润率表述和一组学区效率结果放在一起。公司称收入来自 5 到 10 年长期合同，留存强劲，并实现 EBITDA
              收支平衡；这比抽象增长叙事强得多。同时，成本结构仍只部分公开。TechCrunch
              访谈暗示，公司比传统校车运营商更轻资产，因为它租赁车辆，而不是把车辆放在资产负债表上；用工上则混合了受雇校车司机和服务小型车辆路线的承包商池。公开结果数据指向利润率改善机制：每个学区所需资产更少，路线优化减少耗时，利用率更高。Garvey、Duarte
              和 SFUSD 的客户证据也强化同一论点。即便如此，公开市场仍没有审计毛利率、CAC、回本周期或学区集中度数字，因此后续投资核查应把当前单位经济图景视为令人鼓舞但不完整，而不是已经完全去风险。
