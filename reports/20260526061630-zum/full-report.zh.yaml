      - number: '3.2'
        title: 在位者仍掌握绝对物理规模，新进入者靠工作流设计和灵活性取胜
        blocks:
          - type: paragraph
            body: >-
              单看物理覆盖范围，在位者的公开规模仍很难匹敌。First Student 一家公司就称每天承运 4.8 million 次学生行程，拥有超过 48,000 辆车、530 多个网点和 66,400
              名员工。Durham 没有在官网披露同等运营数字，但其公开母公司结构仍指向成熟企业规模和融资能力。相比之下，Zum
              最强的公开规模信号是收入、TCV、学区合同和服务数千所学校；它显然已经达到后期运营规模，但还没有传统巨头的资产深度。更现代的挑战者用不同方式竞争。HopSkipDrive 声称覆盖 10,000
              多所学校，说明市场触达真实，但它的卖点不是拥有车队，而是灵活小型车辆覆盖，加上 RouteWise AI 和安全工具。BusRight
              的价值主张更软件原生，围绕路线、GPS、家长沟通和行政减负。实际比较因此不是“谁的车最多？”，而是“哪种运营模式能用最少摩擦解决学区痛点？”在学区需要一个把承包商式执行、软件级透明度和清晰电动化路线图结合起来的系统时，Zum
              的优势看起来最强。
