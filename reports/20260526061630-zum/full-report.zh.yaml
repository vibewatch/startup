      - - Durham School Services / Mobico
        - 存量全服务运营商
        - 通过 Mobico 拥有上市母公司披露结构
        - 重视安全和成熟承包商运营的学区
        - 存量运营模式，有上市母公司披露
        - 买方若看重披露透明度，可作为另一家全国型存量承包商
      - - HopSkipDrive
        - 补充小型车辆网络 + 路线 AI
        - 10,000+ 所学校
        - 需要溢出运力、替代安置和路线灵活性的学区
        - CareDriver 网络、RouteWise AI、Safe Ride Technology
        - 小型车辆优于固定路线时，是强替代方案
      - - BusRight
        - 软件优先平台
