      - number: '4.3'
        title: 资本充足度足以支撑近期扩张，但电动化让模式持续受资本约束
        blocks:
          - type: paragraph
            body: >-
              Zum 的资本结构公开到足以显示公司反复为增长融资，但还不足以完整判断现金跑道。公司在 2021 年宣布 $130 million Series D，2026 年又以 $1.7 billion 估值获得 TPG
              $100 million 投资。这足以支撑后期私营融资叙事。更难的问题是资金必须投向哪里。Zum
              不只是在扩张软件和运营团队；它也在推进电动化战略，需要车辆、充电基础设施、公用事业协调，最终还需要双向电网能力。公开材料显示，补助和合作伙伴能抵消部分负担。PG&E 提到 Zum 为 California
              学区获得超过 $35 million EPA 资金；NREL 认为优化充电和 DER 可以降低成本；EPA 也强调生命周期维护优势和 V2G 价值。但 EPA
              同时表示，电动校车前期价格仍可能是柴油替代方案的两到三倍。Branford 的 10 年合同、Oakland 的 V2G 车队和 SFUSD 计划部署的 104
              辆车，都说明这项战略为什么有吸引力，也说明它为什么仍然资本密集。近期结论偏正面：Zum 已筹到足够资金继续推进。长期结论更谨慎：电动化经济性仍因学区而异，也可能把公司拉回比纯软件故事更重的资本需求中。
