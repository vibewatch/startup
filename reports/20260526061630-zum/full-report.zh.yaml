              公开记录现在已经足以说明，Zum 不只是一个“大合同、无经济性”的故事。收入、TCV、增长和 EBITDA
              收支平衡都由管理层明确提出，多份学区案例也指向同一方向：当服务能省钱或解决人手痛点时，学区愿意从技术试点扩展到更完整的运营合同。这比单纯融资规模更能说明财务质量。不过，披露边界仍重要。保留证据中没有任何公开来源提供审计报表、现金余额、毛利率、契约细节，或独立软件收入与全托管交通收入之间的清晰拆分。因此，财务结论是有利但不完整。后续估值工作可以合理依赖已披露的收入规模、合同期限和效率结果，但不应因为收入增长叙事强，就假设公司已经解决资本强度、客户集中度或利润率耐久性问题。
