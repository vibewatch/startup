      - number: '2.3'
        title: 学区负责购买，交通办公室负责运营，家长往往制造紧迫感
        blocks:
          - type: paragraph
            body: >-
              学生交通的买方地图，比标准 SaaS
              销售更细。学区和学校系统通常是经济买方，因为交通预算在公立学校财务和运营体系内，董事会或采购流程也常常把购买正式化。在这一结构下，交通主管、路线团队、调度员和承包商经理是核心运营用户。家长和学生通常不是付款方，但他们是关键采用影响者，因为准点率、可视化和接送可靠性直接影响信任和出勤。BusRight
              自己的营销材料明确把学校管理员、家长和校车运营者拆成不同用户群；Zum 案例研究和学区公告也显示，特殊教育、特许学校网络和大型城市学校系统都可能带着不同痛点进入市场。Garvey 和 Duarte
              展示的是特殊教育切入口，合适尺寸的车辆可以降成本、缩短乘车时间。LEAD Public Schools 展示的是特许学校网络角度，交通被定义为教育可及性。Shawnee Mission、Fresno 和
              Rockford 展示的是主流学区买方路径，重点是替换传统工作流、平滑路线并缓解司机短缺。因此，市场按服务模式、学生需求、学区规模和运营复杂度分层，而不只按地理位置分层。
