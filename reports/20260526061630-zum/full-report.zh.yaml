      - number: '1.3'
        title: 合同规模、融资和电动化把 Zum 推入后期公司区间
        blocks:
          - type: paragraph
            body: >-
              Zum 公开里程碑现在更像后期私营平台，而不是早期市场。SFUSD 董事会材料显示，公司到 2021 年初已经在赢得正式学区采购；TechCrunch 后来报道了它与 San Francisco
              Unified、Seattle Public Schools 和 LAUSD 的大型合同。资本故事分两步明显加速。第一，Zum 宣布由 SoftBank Vision Fund 2 领投、Sequoia 和
              BMW i Ventures 参投的 $130 million Series D，当时累计融资超过 $200 million。第二，2026 年公司宣布获得 TPG $100 million
              战略投资，并称累计融资升至 $430 million，对应 $1.7 billion 估值。Zum 自己的 2025 年财务亮点又补上足够运营细节，让规模更难被忽视：收入 $333 million，同比增长
              35%，TCV 超过 $2 billion，调整后 EBITDA 收支平衡，长期学区合同，并在当年完成 68.5 million 次学生乘车。电动化已经成为同一套规模叙事的一部分。Oakland 2024
              年全电动车队和 SFUSD 计划在 2026 年部署，说明 Zum 正试图把软件驱动运营和接入电网的车队基础设施结合起来，而不是停留在路线与通知层。
