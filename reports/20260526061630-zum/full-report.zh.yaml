      - number: '7.4'
        title: 公开缓释措施确实存在，但大多是流程性措施，成败取决于执行
        blocks:
          - type: paragraph
            body: >-
              公开风险记录中积极的一面，是 Zum 建了一套可见的缓释工具，而不是假装这个品类风险低。SafeGuard、SPED Safe、司机审查、数字化检查、事故报告、摄像头集成、末站标签、六语种入职、签到 /
              签出和路线绩效报告，都显示公司认真把安全和可追溯性落到运营里。不太令人安心的是，这些缓释措施几乎都靠流程。它们依赖受训人员正确使用工具、硬件在现场正常工作，也依赖学区启动时人员到位、监督到位。人的风险因此和缓释质量绑在一起。Howard、Seattle、St.
              Louis、Roanoke 和 Omaha
              的上线帖都强调准备、路线练习和员工培训；这是正面证据，也是线索：这个模式仍然吃人力。实际投资结论是，缓释叙事应被视为必要但不充分。如果路线覆盖滑坡、培训质量下降，或公立学区信任削弱，帮助 Zum
              扩张的同一套运营杠杆，可能很快把失败而非可靠性放大。
