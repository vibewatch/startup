          detail: 覆盖缺口和上线更难。
        - id: route_failure
          label: 路线覆盖失败
          detail: 漏跑或晚点路线会立刻可见。
        - id: parent_trust
          label: 家长信任侵蚀
          detail: App 可视化无法抵消反复失败。
        - id: district_sat
          label: 学区不满
          detail: 运营问题会变成续约和声誉风险。
        - id: renewal
          label: 续约 / 集中风险
          detail: 大型学区经济权重让失败代价变高。
        - id: ev_policy
          label: EV 政策或补助冲击
          detail: 推高电动化计划成本。
        - id: capex
          label: 更高 EV 资本负担
          detail: 可能削弱价值主张或推迟铺开。
