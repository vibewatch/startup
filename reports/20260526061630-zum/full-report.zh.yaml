      - number: '3.3'
        title: 公开定价不透明，因此价值主张比价目表更重要
        blocks:
          - type: paragraph
            body: >-
              这个竞争格局的一个突出特点，是几乎看不到真正的公开标价。全托管运营商和软件供应商都通过学区合同、节省叙事和绩效承诺销售，而不是公布按座位或按路线收费。First Student
              引用行业组织称，外包可为学区节省最高 30%。HopSkipDrive 称，在适用场景下，它比利用率不足的校车路线便宜 40%。BusRight 依靠一条学区客户证言，声称首年节省近 $1 million。Zum
              自己的客户证据也沿用同一模式：Garvey 降费 30%，Duarte 节省 10% 且黄校车减少 35%，SFUSD 或 Rockford
              信息则围绕透明度、准点率和路线效率展开。这意味着公开经济性只能支持方向性结论。学区买方似乎愿意为可视化、特殊教育适配和劳动力覆盖付费，但市场没有暴露足够可横向比较的价格卡，无法断言某个供应商在所有用例中最便宜。最稳妥的分析姿态是：交通仍是一个靠
              ROI 销售的市场，经济性主张只有放在细分场景、学区复杂度和合同范围里才可信。
