      "id": "scale-and-capability-comparison",
      "title": "Incumbents still dominate sheer physical scale, while newer entrants win on workflow design and flexibility",
      "body": "On physical footprint, the incumbents remain hard to match publicly. First Student alone claims 4.8 million student journeys a day, more than 48,000 vehicles, 530-plus locations, and 66,400 employees. Durham does not expose equivalent operating numbers on its homepage, but its public-parent structure still signals mature enterprise scale and financing access. By contrast, Zum\u2019s strongest public scale signals are revenue, TCV, district contracts, and thousands of schools served; it has clearly reached late-stage operating scale, but not the asset depth of the legacy giants. The more modern challengers compete differently. HopSkipDrive\u2019s claim of 10,000-plus schools shows real market reach, but its pitch is not fleet ownership; it is flexible small-vehicle coverage plus RouteWise AI and safety tooling. BusRight\u2019s value proposition is even more software-native, centered on routing, GPS, parent communication, and administrative relief. The practical comparison is therefore not \u201cwho has the most buses?\u201d but \u201cwhich operating model solves the district\u2019s pain with the least friction?\u201d Zum\u2019s edge appears strongest where districts want an integrated system that combines contractor-like execution with software-grade transparency and a visible electrification roadmap.",
