    {
      "id": "unit-economics-and-cost-structure",
      "title": "Unit-economics evidence is unusually concrete for a private operator, but still incomplete",
      "body": "Zum\u2019s 2025 disclosure is stronger than most private-market operator updates because it pairs top-line revenue with TCV, EBITDA, contribution-margin language, and a set of district efficiency outcomes. The business claims long-term contracted revenue from 5-to-10-year agreements, strong retention, and EBITDA breakeven, which is a far better signal than abstract growth talk alone. At the same time, the cost structure remains only partially public. TechCrunch\u2019s interview suggests the company is more asset-light than a legacy bus operator because it leases vehicles instead of carrying them on balance sheet, and it uses a mixed labor model with employed school-bus drivers plus a contractor pool on smaller-vehicle routes. Public outcome data points toward the mechanics of margin improvement: fewer assets per district, less time spent through route optimization, and higher utilization. Customer proof from Garvey, Duarte, and SFUSD reinforces the same thesis. Even so, no audited gross margin, CAC, payback, or district concentration figures are public, so later underwriting must treat the current unit-economics picture as encouraging but incomplete rather than fully de-risked.",
