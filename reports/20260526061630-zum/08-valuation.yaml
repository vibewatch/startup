    {
      "id": "recommendation-and-diligence-asks",
      "title": "Recommendation: research-more, with upside if disclosure quality catches up to operating momentum",
      "body": "A disciplined investor should come away from the retained public record with respect for Zum\u2019s progress and caution about what still is not knowable. The company has enough scale, contract depth, and product ambition to be taken seriously as a major late-stage mobility platform. It also has enough opacity on margins, concentration, reserves, and EV deployment economics to make a clean \u201cbuy\u201d call premature on public evidence alone. The most appropriate recommendation is therefore research-more with medium confidence and a fair valuation stance. The upside case is believable if audited disclosure improves and customer-quality metrics hold. The downside case is equally believable if the market eventually decides the business is more operationally fragile and capital-dependent than the top-line narrative suggests. Final diligence should therefore focus on audited statements, customer concentration, renewal quality, and EV project economics before anyone treats the current valuation as a bargain.",
