      - number: '4.3'
        title: Capital adequacy looks good for near-term scaling, but electrification keeps the model capital sensitive
        blocks:
          - type: paragraph
            body: >-
              Zum’s capital stack is publicly visible enough to show that the company has repeatedly funded growth, but
              not visible enough to fully underwrite runway. The company announced a $130 million Series D in 2021, then
              another $100 million from TPG in 2026 at a $1.7 billion valuation. That is enough to support a late-stage
              private financing narrative. The harder question is what the money must fund. Zum is not only scaling
              software and operating teams; it is also pursuing an electrification strategy that requires buses,
              charging infrastructure, utility coordination, and eventually bidirectional-grid capabilities. Public
              materials show that grants and partnerships offset some of this burden. PG&E cites over $35 million of EPA
              funding to Zum for California districts, NREL argues that optimized charging and DER can reduce costs, and
              EPA highlights lifecycle maintenance advantages alongside V2G value. But EPA also says the upfront price
              of electric buses can still be two to three times that of diesel alternatives. Branford’s 10-year
              contract, Oakland’s V2G fleet, and SFUSD’s planned 104-bus deployment all show why the strategy could be
              attractive and why it remains capital intensive. The near-term conclusion is positive: Zum has raised
              enough money to keep pushing. The longer-term conclusion is more cautious: electrification economics
              remain district-specific and could still pull the company back into heavier capital needs than a pure
              software story would imply.
