            body: >-
              Founder continuity is clear. Official sources consistently identify Ritu Narayan as founder and chief
              executive, while the current leadership page names a broader bench including Vivek Garg as COO, Abhishek
              Garg as CTO, Dan Berenbaum as CFO, JoAnn Covington as general counsel, and other operating leaders across
              people, partnerships, marketing, and communications. Public evidence also shows that the executive team
              has evolved. In mid-2022, Zum announced the arrival of Jay Kim as CFO, Rohit Jain as first CPO, and Shiva
