      - number: '1.4'
        title: Labor signals and disclosure limits keep the overview from becoming a pure growth story
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to establish real company scale, but it is still not clean enough to
              remove diligence caution. First, Zum’s own current materials do not fully agree on footprint. One 2025
              release says the company serves more than 4,000 schools across 15 states, while 2026 CMX materials
              describe adoption in 17 states across more than 4,500 schools. Those figures may not actually measure the
              same thing—contracted-service footprint versus platform adoption—but later chapters should not treat them
              as interchangeable. Second, public governance disclosure stops well short of cap-table or control
              transparency. Public pages name executives and several board members, yet they do not disclose ownership
              percentages, committee structure, or investor rights. Third, the NLRB record shows that Zum has also faced
              a formal labor-organizing process among drivers and attendants in Maryland. That case did not produce a
              final bargaining outcome, but it is still relevant because Zum’s model depends on scaling a large and
              operationally disciplined workforce. The company overview conclusion is therefore balanced: Zum is plainly
              past proof-of-concept, but some of the inputs later chapters need most—exact current footprint, control
              rights, and labor durability—remain only partly visible from public evidence.
