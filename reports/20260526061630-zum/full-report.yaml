  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The relevant market is broader than yellow buses but narrower than all K-12 spend
        blocks:
          - type: paragraph
            body: >-
              Zum participates in a market that is easy to overstate if all education spend is treated as addressable,
              and easy to understate if it is framed as nothing more than outsourced yellow buses. The retained evidence
              shows at least four layers that matter. First is the legacy full-service operating layer, where providers
              such as First Student sell buses, drivers, maintenance, routing, and special-needs transportation under
              one outsourced contract. Second is the supplemental small-vehicle layer, where networks such as
              HopSkipDrive address overflow, alternative placements, or student needs that fixed bus routes handle
              poorly. Third is the software and operating-system layer, where platforms such as BusRight and Zum sell
              routing, live GPS, communications, ridership visibility, and driver workflows. Fourth is the
              electrification and utility-integration layer, where school-bus fleets become capital assets tied to
              charging infrastructure, federal grants, and even vehicle-to-grid services. That means the relevant market
              includes home-to-school operations, special education, routing, dispatch, family communications, and EV
              transition workflows, but excludes classroom instruction, generic K-12 budget categories, and public
              transit not controlled by district transportation teams.
