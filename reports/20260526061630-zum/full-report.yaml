      - number: '7.3'
        title: Zum’s EV and data ambitions create partner dependency beyond normal bus operations
        blocks:
          - type: paragraph
            body: >-
              Zum’s most differentiated strategic moves also create its clearest dependency risks. Electric-fleet and
              V2G deployments are a good example. They deepen the value proposition, but they also make Zum dependent on
              utility relationships, charging hardware, grant support, and district site readiness. EPA’s 2026 review of
              the Clean School Bus Program adds policy uncertainty on top of an already expensive capex profile, and
              EPA’s own explainer makes clear that electric buses still carry a 2-to-3x upfront cost premium versus
              diesel. Oakland’s experience shows the upside and the dependency simultaneously: utility coordination and
              EPA funding support helped unlock the deployment. On the data side, Zum’s platform increasingly depends on
              student information, check-in/out systems, incident data, and family app usage. That is strategically
              powerful, but it also means poor district data hygiene, weak telematics, or low family app adoption can
              degrade service quality. The broader partner-dependency conclusion is that Zum is no longer just dependent
              on drivers and buses. It is increasingly dependent on data quality, utilities, grants, chargers, and
              district willingness to operationalize a more connected system.
            claimRefs:
              - CR006
