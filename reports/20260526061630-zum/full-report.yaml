  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Zum’s public financial story is a hybrid of contracted operations and software-like control layers
        blocks:
          - type: paragraph
            body: >-
              The clearest financial takeaway is that Zum should not be modeled as a single-product vendor. Public
              materials describe a hybrid business that combines long-term full-service district contracts with a
              standalone technology platform that can be implemented before or instead of operations takeover. The
              Fresno sequence is especially useful here: Zum first sold technology, then expanded into full-service
              special-education transportation. Pricing also appears to be negotiated contract-by-contract rather than
              published as a clean per-seat SaaS tariff. SFUSD board materials show district procurement comparing value
              and daily price together; Zum’s bid there paired a lower combined daily price with stronger value scoring.
              Customer case studies and district announcements support the same pattern. Zum markets cost savings, route
              efficiency, and visibility as the economic outcome, not a list price. That is consistent with school
              transportation as an enterprise operations sale, where districts buy reliability, parent trust, and labor
              coverage alongside buses or software. The financial implication is that revenue quality depends less on
              transactional volume and more on whether contracts stay long, renew, and expand from software-led entry
              points into broader operational scope.
