  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is manageable publicly, but not invisible
        blocks:
          - type: paragraph
            body: >-
              Zum’s public legal and regulatory picture is not alarming, but it is substantial enough to stay in the
              risk chapter. The clearest company-specific legal signal is labor rather than consumer litigation: the
              NLRB docket shows a 2023 union-organizing case involving drivers, van drivers, and attendants in Maryland.
              That case does not prove pervasive labor instability, but it does demonstrate that the company’s workforce
              model can enter formal labor processes. On the regulatory side, school transportation itself is a heavily
              governed category. NHTSA emphasizes that school buses are among the safest and most regulated vehicles on
              the road, which means operators compete under a demanding safety baseline and are especially exposed when
              boarding, exiting, or stop-arm compliance fails. Zum’s own terms and privacy pages also make clear that
              the business handles app-driven parent, student, and driver data, which creates meaningful privacy and
              data-handling obligations. The public conclusion is therefore balanced: no retained source shows a broad
              enforcement wave against Zum, but the combination of labor organization, school-bus regulation, and
              app-based student data means the legal-risk floor is materially higher than for a generic enterprise SaaS
              product.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR043
