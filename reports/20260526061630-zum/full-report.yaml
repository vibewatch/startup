  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Zum’s institutional customer journey typically moves from procurement or problem discovery through launch, daily
      operations, family visibility, and then broader expansion into new routes or services.
    approximationNotes: >-
      Journey stages are synthesized from public district launches, case studies, and technology-only deployment posts;
      no internal CRM funnel is disclosed.
    data:
      items:
        - label: District pain or procurement reset
          phase: discovery
          detail: Legacy operators, poor visibility, long commutes, or driver shortages trigger search.
        - label: Board / district selection
          phase: onboarding
          detail: SFUSD, Shawnee Mission, LEAD, and Rockford show explicit award or selection moments.
        - label: Go-live and route coverage
          phase: activation
          detail: Howard, Seattle, St. Louis, San Francisco, and Oakland launch posts emphasize day-one readiness.
        - label: Parent app and daily ride status
          phase: engagement
          detail: Families use tracking, alerts, and feedback as daily trust surfaces.
        - label: Operational outcome proof
          phase: engagement
          detail: Commute-time, cost, attendance, and route-coverage claims accumulate over time.
        - label: Expansion into more routes or services
          phase: expansion
          detail: Fresno technology-to-service move and Branford EV contract show deeper wallet share.
    claimRefs:
