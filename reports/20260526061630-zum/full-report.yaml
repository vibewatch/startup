      - number: '3.4'
        title: Switching costs are real, but the category is still fragmented enough to prevent monopoly control
        blocks:
          - type: paragraph
            body: >-
              The moat question in student transportation is not whether switching costs exist—they clearly do—but
              whether those costs create durable exclusivity. Districts that go live with a transportation vendor do not
              just buy a route plan. They embed parent communications, driver workflows, safety playbooks, fleet
              assignments, school calendars, exception handling, and sometimes yard or charging infrastructure. That
              creates meaningful friction for replacement and gives incumbents distribution power. Yet the same public
              record also shows multi-homing is possible. A district can retain a core bus operator, add a software
              layer, and still use a supplemental small-vehicle provider for niche trips. That fragmentation limits the
              power of any one competitor. First Student’s scale is a serious moat, but software-led entrants can still
              wedge in where legacy operators underdeliver on visibility or special-needs agility. NASDPTS also shows
              how broad the surrounding ecosystem is, with state leaders, administrators, OEMs, and suppliers all
              influencing what districts see as “market standard.” Zum’s moat is therefore more about integration
              quality than about being unbeatable on any single dimension. If it can keep combining district execution,
              parent trust, and EV infrastructure better than peers, it has a defensible position. If routing, tracking,
              and communications become commoditized across vendors, differentiation will narrow fast.
