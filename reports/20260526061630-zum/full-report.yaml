              software; management explicitly says it accounts for tiered bell schedules and custom student
              requirements. The 2021 SFUSD materials already referenced DriveCam, student ridership readers, driver
              tablets, and route analytics, suggesting that the workflow has been productized for several years. Later
              safety and enhancement posts deepen that picture with RFID, SIS integrations, digitized safety checks,
