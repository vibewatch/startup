              a different finance lead. That does not imply dysfunction, but it does mean later diligence should treat
              finance-leadership continuity as a timeline, not a static fact. Governance visibility is good enough for
              an overview but not good enough for control analysis. The leadership page publicly names board members
              linked to Sequoia, Spark Capital, TPG, and former RingCentral finance leadership, and the 2026 TPG
              announcement adds Steve Ellis to the board. What remains missing are the specifics that matter for
              underwriting control: ownership percentages, board committees, investor vetoes, and how much practical
              influence any one financing sponsor holds today.
