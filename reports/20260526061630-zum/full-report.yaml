        title: Zum’s product is an operating system for student mobility, not just a parent app
        blocks:
          - type: paragraph
            body: >-
              The public materials show that Zum’s product should be understood as an operating system spanning
              districts, parents, drivers, and vehicles rather than as a single rider-facing app. The company’s own
              language emphasizes CMX as the connective layer across students, drivers, and school districts. Supporting
              pages then break that into concrete modules: a parent app, student and driver apps, district dashboards,
              route-planning tools, dispatch workflows, and ride-verification features. This matters because the product
              definition changes how later chapters should think about revenue and competition. A parent-facing tracking
              app is easy to imitate; an integrated system that coordinates routing, student-specific instructions,
              workforce workflows, and vehicle-state awareness is harder. The product is also not confined to
              full-service operations. Public deployment language and other chapter evidence show that Zum can sell the
              technology layer standalone and then expand into deeper operations. That makes the product both a software
              surface and an operating framework, which is why the right product lens is “mobility system” rather than
