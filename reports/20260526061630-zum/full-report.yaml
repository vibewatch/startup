companyProfile:
  summary: >-
    Zum is a Redwood City-based student mobility platform founded and led by Ritu Narayan that combines route
    optimization, parent and district visibility, driver workflows, and full-service operations for school districts.
    The business has evolved from a family-rides origin into a district-scale transportation platform with thousands of
    schools served, marquee district contracts, and a growing electrification / vehicle-to-grid layer. Public
    disclosures show meaningful late-stage scale and repeated institutional adoption, but they still stop short of the
    audited financial and concentration detail needed for full underwriting.
