  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest-risk cluster combines labor availability, route execution, customer concentration, and EV-policy
      economics; pure legal risk appears lower but still material.
    approximationNotes: Heatmap is a qualitative synthesis from retained evidence, not an actuarial model.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Driver shortage / route coverage
          values:
            - label: High
              tone: negative
              detail: Visible across category and launch posts
            - label: High
              tone: negative
              detail: Daily failure is immediately customer-facing
            - label: Medium
              tone: neutral
              detail: Training and hiring mitigations exist
            - label: High
              tone: negative
              detail: Still labor intensive
        - label: EV policy + capex volatility
          values:
            - label: Medium
              tone: neutral
              detail: Depends on grants and utility support
            - label: High
              tone: negative
              detail: Could weaken differentiation and economics
            - label: Medium
              tone: neutral
              detail: Partners and grants help
            - label: High
              tone: negative
              detail: Economics remain district-specific
        - label: Customer concentration
          values:
            - label: Medium
              tone: neutral
              detail: Plausible from visible account mix
            - label: High
              tone: negative
              detail: Large districts likely economically important
            - label: Low
              tone: neutral
              detail: No public mitigation beyond breadth narrative
            - label: High
              tone: negative
              detail: Renewal data not public
        - label: Privacy / cyber disclosure gap
          values:
            - label: Medium
              tone: neutral
              detail: Apps and student data clearly involved
            - label: High
              tone: negative
              detail: Would be severe if controls fail
            - label: Low-Medium
              tone: neutral
              detail: Legal pages exist, deep proof absent
            - label: Medium-High
              tone: negative
              detail: Architecture and uptime are undisclosed
        - label: Fleet age / maintenance burden
          values:
            - label: Medium-High
              tone: negative
              detail: Systemic category issue
            - label: Medium-High
              tone: negative
              detail: Directly hits service quality and safety
            - label: Medium
              tone: neutral
              detail: Modern-fleet claims help where implemented
            - label: Medium
              tone: neutral
              detail: Public maintenance data still thin
    claimRefs:
      - CR006
      - CR008
      - CR024
      - CR025
      - CR038
      - CR041
      - CR043
      - CR044
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main transmission path runs from labor or EV-economics shocks into route coverage, parent trust, district
      satisfaction, and ultimately renewal risk.
    approximationNotes: Graph shows causal logic inferred from retained evidence rather than incident-forensic data.
    data:
      nodes:
        - id: driver_gap
          label: Driver shortage / labor strain
          detail: Coverage gaps and harder launches.
        - id: route_failure
          label: Route coverage failure
          detail: Missed or late routes become immediately visible.
        - id: parent_trust
          label: Parent trust erosion
          detail: App visibility cannot offset repeated failures.
        - id: district_sat
          label: District dissatisfaction
          detail: Operational issues become renewal and reputational risk.
        - id: renewal
          label: Renewal / concentration risk
          detail: Large district economics make failures costly.
        - id: ev_policy
          label: EV policy or grant shock
          detail: Raises cost of electrification plans.
        - id: capex
          label: Higher EV capital burden
          detail: Can weaken value proposition or delay rollouts.
      edges:
        - from: driver_gap
          to: route_failure
          label: Coverage and quality drop
        - from: route_failure
          to: parent_trust
          label: Daily customer pain
        - from: parent_trust
          to: district_sat
          label: Escalations and pressure
        - from: district_sat
          to: renewal
          label: Commercial consequence
        - from: ev_policy
          to: capex
          label: Less support
        - from: capex
          to: district_sat
          label: Harder ROI case
        - from: capex
          to: renewal
          label: Differentiation weakens
    claimRefs:
      - CR006
      - CR015
      - CR038
      - CR040
      - CR041
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: >-
      Zum depends on district data, telematics hardware, trained drivers, regulators, utilities, and family app usage at
      the same time; no single dependency explains the whole risk picture.
    approximationNotes: Dependency graph is functional rather than contractual; it represents what the retained sources make visible.
    data:
      nodes:
        - id: district
          label: District partner
          detail: Provides routes, rosters, and the commercial relationship.
        - id: data
          label: Student data / onboarding
          detail: Profiles, preferences, and check-in logic.
        - id: drivers
          label: Driver workforce
          detail: Daily execution and compliance.
        - id: hardware
          label: Cameras / tablets / RFID
          detail: Field traceability and verification.
        - id: apps
          label: Parent and staff apps
          detail: Trust surface and communication channel.
        - id: utilities
          label: Utilities / grants / chargers
          detail: Critical for EV and V2G economics.
        - id: regulators
          label: Regulators and safety rules
          detail: NHTSA, FMCSA, labor and privacy obligations.
      edges:
        - from: district
          to: data
          label: Supplies rosters and rules
        - from: data
          to: apps
          label: Enables visibility
        - from: drivers
          to: hardware
          label: Operational use
        - from: hardware
          to: apps
          label: Feeds ride status
        - from: utilities
          to: hardware
          label: EV / charger layer
        - from: regulators
          to: drivers
          label: Training and conduct baseline
        - from: regulators
          to: apps
          label: Data and communications obligations
    claimRefs:
      - CR003
      - CR009
      - CR013
      - CR020
      - CR022
      - CR023
      - CR040
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from real revenue scale and contract depth through disclosure gaps and EV risk into a
      research-more / fair valuation stance.
    approximationNotes: Logic flow is a synthesis of retained evidence, not a formal investment committee rubric.
    data:
      nodes:
        - id: scale
          label: Revenue + TCV + breakeven
          detail: Zum has real late-stage scale signals.
        - id: customer
          label: Customer outcomes + flagship districts
          detail: Public customer proof is unusually strong.
        - id: risk
          label: Opacity + concentration + EV capex
          detail: Key gaps still block a clean buy call.
        - id: comp
          label: Imperfect comp set
          detail: Neither pure software nor pure operator fits cleanly.
        - id: stance
          label: Fair / research-more
          detail: Public evidence supports respect, not overreach.
      edges:
        - from: scale
          to: stance
          label: Supports premium
        - from: customer
          to: stance
          label: Supports conviction
        - from: risk
          to: stance
          label: Caps conviction
        - from: comp
          to: stance
          label: Keeps framing disciplined
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV031
      - CV038
      - CV039
      - CV041
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative valuation sensitivity shows how modest changes in public-market framing can move the equity story
      materially around the current $1.7B anchor.
    approximationNotes: Bars are scenario-based estimates, not target prices or a DCF output.
    data:
      items:
        - label: Bear framing
          value: 1050
          detail: ~$0.9B-$1.2B range midpoint
          tone: negative
        - label: Current / base framing
          value: 1700
          detail: Current announced valuation and fair-value anchor
          tone: neutral
        - label: Bull framing
          value: 2400
          detail: ~$2.2B-$2.6B range midpoint
          tone: positive
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Illustrative valuation bands around the current public valuation show a fair base case with both meaningful upside
      and meaningful downside depending on disclosure quality and EV execution.
    approximationNotes: Units are USD millions; low/mid/high are estimated scenario anchors derived from public evidence.
    data:
      items:
        - label: Bear case
          low: 900
          mid: 1050
          high: 1200
          displayValue: $0.9B-$1.2B
          detail: Multiple compresses if concentration, capex, or margin opacity dominate.
          tone: negative
        - label: Base case
          low: 1500
          mid: 1700
          high: 1900
          displayValue: $1.5B-$1.9B
          detail: Current public valuation looks fair if growth and contract quality hold.
          tone: neutral
        - label: Bull case
          low: 2200
          mid: 2400
          high: 2600
          displayValue: $2.2B-$2.6B
          detail: Requires sustained growth, stronger disclosure, and EV optionality to create premium.
          tone: positive
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      The KPI strip captures the public anchors that matter most for valuation framing: revenue, valuation, implied
      multiple, funding, and contract depth.
    approximationNotes: Implied multiple is a simple estimate from the current announced valuation divided by disclosed 2025 revenue.
    data:
      items:
        - label: Valuation
          value: $1.7B
          detail: Latest public TPG-announced valuation.
        - label: 2025 revenue
          value: $333M
          detail: Public company-issued revenue anchor.
        - label: Implied rev multiple
          value: ~5.1x
          detail: Estimated from valuation / revenue.
        - label: Total funding
          value: $430M
          detail: Latest public cumulative funding figure.
        - label: TCV
          value: '>$2B'
          detail: Public contract-value anchor.
        - label: Risk stance
          value: High
          detail: Public disclosure still incomplete for a buy call.
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV010
      - CV005
      - CV040
