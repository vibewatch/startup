  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The bull case is real scale plus software leverage; the anti-thesis is opacity plus capital intensity
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to support a real investment thesis. Zum is not a speculative mobility
              concept anymore. The company has publicly disclosed $333 million of revenue, more than $2 billion of TCV,
              adjusted EBITDA breakeven, and a sequence of large public district references. That is the core bull case:
              a late-stage private business with visible contract scale, software-led workflow control, and customer
              outcomes that look better than a generic “smart buses” narrative. The anti-thesis is equally clear. Zum
              still does not disclose audited financials, customer concentration, software-versus-service revenue mix,
              or EV project economics in enough detail to underwrite the business like a mature public issuer. The EV
              and V2G strategy is strategically attractive, but it also adds dependency on grants, utilities, chargers,
              and district-specific economics. The basic thesis, then, is not disputed; the quality of the underwriting
              file is.
            claimRefs:
              - CV001
