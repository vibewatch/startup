      - number: '7.2'
        title: Operational risk sits at the heart of the thesis because daily service quality is the product
        blocks:
          - type: paragraph
            body: >-
              Operational risk is the single most important category risk because Zum’s promise is experienced every
              school morning and every school afternoon. The strongest adverse sources in the retained set all point to
              the same cluster of vulnerabilities: aging fleets, maintenance burden, driver shortages, long commutes,
              bullying and supervision gaps, limited hardware modernization, and diesel exposure. Zum’s own
              category-risk posts are candid that school buses often remain in service for 15 years or more, that
              technician capacity is limited, and that camera or stop-arm coverage is still inconsistent across the
              industry. The driver side is equally material. BusRight’s market framing says some fleets begin the day
              15% to 30% short of drivers, while Zum’s own launch posts repeatedly emphasize route coverage and surplus
              drivers—an indirect sign that management knows coverage failure is existential to trust. Long commutes and
              scattered information create another operational hazard because they affect sleep, exercise, and classroom
              readiness, not just logistics. The risk chapter conclusion is therefore blunt: route coverage, vehicle
              readiness, incident handling, and labor availability are not secondary risks for Zum; they are the product
              risk.
