      - number: '3.3'
        title: Public pricing is opaque, so value claims matter more than rate cards
        blocks:
          - type: paragraph
            body: >-
              One of the striking features of this landscape is how little true list pricing is visible. Full-service
              operators and software vendors alike sell through district contracts, savings narratives, and performance
              promises rather than published per-seat or per-route prices. First Student cites an industry body to say
              contracting can save districts up to 30%. HopSkipDrive says it can be 40% more affordable than
              underutilized bus routes for relevant use cases. BusRight leans on a district testimonial claiming nearly
              $1 million in first-year savings. Zum’s own customer proof follows the same pattern: 30% expense reduction
              at Garvey, 10% savings and 35% fewer yellow buses at Duarte, and SFUSD or Rockford messaging built around
              transparency, on-time performance, and route efficiency. This means public economics support only
              directional conclusions. District buyers appear willing to pay for visibility, special-education fit, and
              labor coverage, but the market does not expose enough apples-to-apples price cards to declare one vendor
              the cheapest across all use cases. The safest analytic posture is that transportation remains an ROI-sold
              market where economic claims are credible only in the context of segment, district complexity, and
              contract scope.
