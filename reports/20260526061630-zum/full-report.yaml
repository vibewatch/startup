  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Zum does not face one competitor class; it faces a layered landscape
        blocks:
          - type: paragraph
            body: >-
              The most important competitor insight is structural: Zum is competing inside a layered category rather
              than a single market with like-for-like products. First Student and Durham represent legacy or incumbent
              full-service operators with large installed fleets, workforce depth, maintenance systems, and
              long-standing district relationships. HopSkipDrive represents a modern supplemental model built around
              small vehicles, flexible driver availability, and AI-assisted routing for trips that are hard to serve
              with fixed-route buses. BusRight represents a software-first routing and communications layer sold into
              school transportation organizations without necessarily owning the fleet. Blue Bird is not a direct
              routing or operations competitor, but it matters because electric-bus OEMs and grant-support organizations
              influence how districts think about fleet transition and capex. Zum sits between these categories: more
              vertically integrated than BusRight or HopSkipDrive, more software-forward and electrification-heavy than
              First Student or Durham, and more service-operational than an OEM such as Blue Bird. That hybrid position
              is strategically attractive, but it also means Zum must prove it can execute across more functions than
              many single-layer rivals.
