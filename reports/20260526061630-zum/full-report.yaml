      - number: '2.3'
        title: The district buys, the transportation office operates, and parents often force the urgency
        blocks:
          - type: paragraph
            body: >-
              The buyer map in student transportation is more nuanced than a standard SaaS sale. Districts and school
              systems are usually the economic buyer because transportation budgets sit inside public-school finance and
              operations, and board or procurement processes often formalize the purchase. Within that structure,
              transportation directors, routing teams, dispatchers, and contractor managers are the core operational
              users. Parents and students are not usually the payer, but they are essential adoption influencers because
              on-time performance, visibility, and pickup reliability directly affect trust and attendance. BusRight’s
              own marketing explicitly separates school administrators, parents, and bus operators as distinct user
              groups, while Zum case studies and district announcements show that special education, charter networks,
              and large urban systems can all enter the market with different pain points. Garvey and Duarte show the
              special-education wedge, where right-sized vehicles can lower cost and cut ride times. LEAD Public Schools
              shows the charter-network angle, where transportation is framed as educational access. Shawnee Mission,
              Fresno, and Rockford show a mainstream district-buyer path focused on replacing legacy workflows,
              smoothing routing, and addressing driver shortages. The market is therefore segmented by service model,
              student need, district size, and operational complexity, not only by geography.
            claimRefs:
