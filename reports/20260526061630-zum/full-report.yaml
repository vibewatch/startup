  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: standard
    summary: >-
      Zum’s strongest visible maturity lies in rider visibility, route orchestration, and safety workflows; the least
      visible maturity lies in externally disclosed infrastructure and security detail.
    approximationNotes: >-
      Maturity ratings are qualitative judgments from retained public evidence rather than internal SLAs or engineering
      metrics.
    data:
      columns:
        - Workflow maturity
        - Public proof depth
        - Differentiation depth
        - Disclosure quality
      rows:
        - label: Parent visibility and notifications
          values:
            - label: High
              tone: positive
              detail: Live app, Google Play surface, multiple official workflow pages
            - label: High
              tone: positive
              detail: Strong public feature detail
            - label: Medium
              tone: neutral
              detail: Competitors also market similar tracking features
            - label: Medium
              tone: neutral
              detail: Feature detail good, usage metrics limited
        - label: Routing and dispatch intelligence
          values:
            - label: High
              tone: positive
              detail: Repeatedly described across CMX, services, and engineering materials
            - label: Medium-High
              tone: positive
              detail: Public references to AI and custom-need routing
            - label: Medium-High
              tone: positive
              detail: Integrated with operations rather than standalone only
            - label: Low-Medium
              tone: neutral
              detail: No deep infrastructure or algorithm disclosure
        - label: Safety and compliance workflows
          values:
            - label: High
              tone: positive
              detail: Detailed posts on checks, incident capture, SPED Safe, and inspections
            - label: High
              tone: positive
              detail: Strong procedural public detail
            - label: Medium
              tone: neutral
              detail: Category competitors also emphasize safety tech
            - label: Medium
