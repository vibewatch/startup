      - number: '8.3'
        title: Public scenarios support a fair base case with both real upside and real downside
        blocks:
          - type: paragraph
            body: >-
              The scenario logic is best driven by public evidence, not precision. In the bull case, Zum keeps
              compounding as a hybrid platform: revenue continues to grow around recent rates, EBITDA leverage improves,
              customer outcomes remain visible, and EV/V2G optionality becomes a monetizable advantage instead of a
              capital burden. That case can justify a valuation above the current mark. In the base case, the company
              executes well enough to sustain its current premium but not well enough to erase disclosure gaps; in that
              world, the announced $1.7 billion valuation already captures much of the fair upside. In the bear case,
              the biggest risk is not demand disappearing. It is the market deciding the business deserves a lower
              multiple because concentration, capex, or margin opacity look more like a complex operator than a scalable
              software platform. Public evidence supports all three scenarios, which is exactly why the recommendation
              should stay disciplined rather than promotional.
            claimRefs:
              - CV018
              - CV019
              - CV032
              - CV035
