    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and platform logic
        blocks:
          - type: paragraph
            body: >-
              Zum’s current public identity is much broader than a niche routing vendor or a legacy yellow-bus
              contractor. The company presents itself as a student transportation platform that coordinates school
              districts, parents, drivers, and vehicles through one cloud-based operating system. That framing is
              consistent across the homepage, product pages, CMX launch materials, and parent workflow pages, all of
              which emphasize real-time tracking, notifications, route optimization, and a shared system of record. The
              company’s own origin story matters because it explains why the product is designed around family anxiety
              rather than just fleet utilization. Narayan says the business began when she could not find reliable
              transportation for her own children, and company materials explicitly note that Zum first served parents
              directly before scaling into district-wide transportation. The result is a hybrid identity: a
              software-and-operations platform that still owns the daily ride experience. Public legal pages and
              regulatory records consistently anchor the company in Redwood City, California, and official materials
              describe parent, student, and driver apps as well as district dashboards, which gives later chapters
              enough confidence to treat Zum as a vertically integrated student mobility platform rather than a thin
              scheduling layer.
