    {
      "id": "people-execution-and-mitigations",
      "title": "Public mitigations are real, but they are mostly procedural and therefore execution-dependent",
      "body": "The encouraging part of the public risk record is that Zum has built a visible mitigation toolkit rather than pretending the category is low risk. SafeGuard, SPED Safe, driver vetting, digital inspections, incident reporting, camera integration, last-stop tags, six-language onboarding, check-in/check-out, and route-performance reporting all show a serious effort to operationalize safety and traceability. The less comforting part is that nearly all of these mitigations are procedural. They depend on trained humans using the tools correctly, on hardware working in the field, and on district launches being staffed and supervised well. That makes people risk inseparable from mitigation quality. Launch posts from Howard, Seattle, St. Louis, Roanoke, and Omaha all emphasize preparation, route practice, and staff training, which is positive evidence, but also a clue: this model remains labor-intensive. The practical investment takeaway is that the mitigation story should be viewed as necessary but not sufficient. If route coverage slips, if training quality erodes, or if public district trust weakens, the same operating leverage that helps Zum scale could quickly amplify failure instead of reliability.",
