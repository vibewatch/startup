    {
      "id": "durability-expansion-and-concentration-risks",
      "title": "Retention looks plausible, but concentration and cohort quality remain mostly private",
      "body": "The encouraging customer-quality signal is that several public references are multi-year, not one-time. Howard County is in year three, Seattle is in year four, and Oakland\u2019s EV fleet is now in year two. That kind of public continuity is better than a stack of undated logo slides. But it is not the same as a full retention dataset. No retained public source provides NRR, GRR, district-level churn, renewal dates, or top-customer revenue mix. That matters because the visible customer set is skewed toward flagship public districts that likely represent large revenue blocks. SFUSD, LAUSD, Seattle, Oakland, and Howard County are exactly the kinds of customers that can be strategically validating and economically concentrating at the same time. The safest customer conclusion is therefore mixed: Zum has genuine customer breadth and credible repeat deployment evidence, but public materials still do not tell us whether the economic base is balanced or whether a handful of large districts dominate revenue and renewal risk.",
