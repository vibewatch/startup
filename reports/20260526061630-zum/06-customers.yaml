    {
      "id": "named-customer-proof-and-outcomes",
      "title": "Named customer proof is strongest when a district voice or quantified outcome accompanies the reference",
      "body": "The best customer proof in the retained set does not come from generic logo lists; it comes from references with either a district voice or a quantified outcome. SFUSD\u2019s public record is strongest because it spans board documents, a district transportation page, and 2026 electrification announcements that cite 100% route coverage with zero driver shortages. Oakland\u2019s proof is similarly strong because district leadership and PG&E tie Zum to concrete commute-time, grid, and electrification outcomes. The special-education case studies are also valuable because they quantify the benefit: Garvey cites 30% expense reduction, while Duarte cites 10% savings and 35% fewer yellow buses. St. Louis provides unusually fresh satisfaction proof through 2,200 early app ratings with 88% five stars. Kansas City\u2019s attendance outcome and Fresno\u2019s route-improvement testimony add another layer by connecting transport quality to educational experience. Where proof is weaker, it is usually because the evidence relies almost entirely on company framing without an equivalent district-authored KPI sheet or renewal disclosure.",
