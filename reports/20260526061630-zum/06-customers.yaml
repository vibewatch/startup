    {
      "id": "adoption-trajectory-and-expansion",
      "title": "The strongest adoption pattern is land-and-expand rather than one-shot customer acquisition",
      "body": "Zum\u2019s adoption trajectory is best understood as a mix of network scale plus district-specific expansion paths. At the top level, the company claims 68.5 million rides in 2025 and service to more than 4,000 schools across 15 states, though some 2026 materials widen that footprint to more than 4,500 schools across 17 states. At the account level, Fresno is the clearest land-and-expand signal: the district first implemented Zum\u2019s technology, then expanded into 172 full-service special-education routes. The 2025-26 Boston/Salt Lake/Virginia Beach/Fresno post adds another useful pattern by making explicit that Zum can begin as software-only and later deepen into service. New wins in Shawnee Mission, LEAD, Rockford, and Branford show the company still adding logos and geographies, while public launch posts in San Francisco, Oakland, Howard County, Seattle, and St. Louis suggest that go-live readiness is itself part of the company\u2019s customer proof. The practical conclusion is that Zum\u2019s adoption arc is not just logo acquisition; it is deployment maturity plus scope expansion after the first foothold is established.",
