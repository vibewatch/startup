  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Zum\u2019s retained public customer record is stronger than a typical private transportation company\u2019s because it spans large public districts, special-education programs, charter networks, private schools, and standalone-technology deployments rather than a small cluster of logo mentions. The best proof comes from named accounts with quantified outcomes or visible multi-year continuity\u2014especially SFUSD, Oakland, Howard County, Seattle, Fresno, Garvey, and Duarte. The open problem is not whether Zum has real customers\u2014it clearly does\u2014but whether the economic quality of that base is balanced, because public sources still do not disclose exact district count, retention cohorts, or top-customer concentration."
  },
  "sections": [
    {
      "id": "customer-base-and-segmentation",
      "title": "Zum\u2019s public customer base spans several buyer types, but public districts remain the center of gravity",
      "body": "The public customer record shows meaningful breadth, but it is not random breadth. Public districts remain the center of gravity, with flagship references across SFUSD, Seattle, LAUSD, Oakland, Howard County, St. Louis, Branford, Shawnee Mission, Fresno, and Rockford. Those are the most important names because they prove Zum can operate in large, operationally demanding public-school systems. At the same time, the retained evidence shows Zum is not confined to one district archetype. LEAD Public Schools adds a charter-network customer type. Garvey and Duarte show special-education transportation as a distinct wedge. St. Ignatius and Marin Catholic show private-school and athletics use cases where flexibility, right-sized vehicles, or scheduling speed matter more than a classic district-wide bus contract. The customer base is therefore broad across buyer type, use case, and geography, but still coheres around one core theme: institutions that are dissatisfied with inflexible legacy transportation and willing to buy a more transparent, technology-led alternative.",
