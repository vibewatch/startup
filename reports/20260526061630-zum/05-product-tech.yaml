    {
      "id": "deployment-and-maturity",
      "title": "Deployment maturity is visible in product releases, district launches, and hiring signals",
      "body": "The strongest maturity signal is that Zum\u2019s product does not appear frozen or merely aspirational. The evidence spans several layers. First, district launch materials and financial disclosures show the system operating across many schools and districts, with the product already deployed in standalone-technology contexts as well as full-service transport environments. Second, the company has continued to add functionality in public: incident reporting, camera-to-fleet mapping, digitized safety checks, SIS integration, and digital last-stop tags. Third, the organizational signal is strong. The 2022 executive expansion added dedicated product and engineering leadership, and later profiles of the CPO and VP of engineering show explicit focus on scaling reliable, mission-critical products. Careers pages reinforce the same point: Zum is hiring for HQ and yard roles simultaneously, marketing both cash-and-equity HQ roles and operationally sophisticated modern yards. That combination matters because it suggests the product is maturing in tandem with the operational infrastructure required to deliver it. The real caveat is not lack of evidence of activity; it is that public evidence is much better at describing features than proving uptime, defect rates, or data-security resilience.",
