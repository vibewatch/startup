    "number": 5,
    "title": "Product & Tech",
    "summary": "Zum\u2019s retained public product record supports a real operating platform rather than a thin rider app: CMX spans routing, dispatch, family notifications, driver workflows, student-specific data handling, and increasingly an EV/V2G operating layer. Public evidence is strongest on workflow depth and safety instrumentation, with repeated references to RFID, tablets, incident capture, SIS integration, inspections, and specialized driver training. The main product-tech caveat is not lack of visible functionality but lack of deeper infrastructure disclosure\u2014competitors increasingly market similar surface features, while Zum still does not publicly expose enough security, uptime, and integration detail to fully underwrite the stack."
  },
  "sections": [
    {
      "id": "product-definition-and-modules",
      "title": "Zum\u2019s product is an operating system for student mobility, not just a parent app",
      "body": "The public materials show that Zum\u2019s product should be understood as an operating system spanning districts, parents, drivers, and vehicles rather than as a single rider-facing app. The company\u2019s own language emphasizes CMX as the connective layer across students, drivers, and school districts. Supporting pages then break that into concrete modules: a parent app, student and driver apps, district dashboards, route-planning tools, dispatch workflows, and ride-verification features. This matters because the product definition changes how later chapters should think about revenue and competition. A parent-facing tracking app is easy to imitate; an integrated system that coordinates routing, student-specific instructions, workforce workflows, and vehicle-state awareness is harder. The product is also not confined to full-service operations. Public deployment language and other chapter evidence show that Zum can sell the technology layer standalone and then expand into deeper operations. That makes the product both a software surface and an operating framework, which is why the right product lens is \u201cmobility system\u201d rather than \u201cbus tracking app.\u201d",
