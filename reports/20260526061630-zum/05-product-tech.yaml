    {
      "id": "architecture-and-operating-workflow",
      "title": "The public architecture centers on routing intelligence, real-time data, and student-specific workflows",
      "body": "Zum\u2019s public architecture is operational rather than deeply infrastructure-specific. The retained evidence repeatedly shows the same functional core: route design driven by real-time data, dashboards for district teams, GPS and map views for families, driver tablets that surface student needs, and incident workflows that feed back into the operating center. The route engine is not described as generic optimization software; management explicitly says it accounts for tiered bell schedules and custom student requirements. The 2021 SFUSD materials already referenced DriveCam, student ridership readers, driver tablets, and route analytics, suggesting that the workflow has been productized for several years. Later safety and enhancement posts deepen that picture with RFID, SIS integrations, digitized safety checks, incident capture, and last-stop digital tags. In other words, the architecture publicly visible today is a connected workflow fabric linking district planning, driver execution, family communication, and post-incident traceability. What is not visible are the deeper technical implementation details\u2014cloud stack, uptime engineering, data model, or API design\u2014which is why the architecture story is strong on functional scope but still thin on infrastructure specificity.",
