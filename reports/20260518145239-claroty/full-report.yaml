  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary — CPS / XIoT / OT Security
        blocks:
          - type: paragraph
            body: >
              The addressable market for Claroty is best defined as Cyber-Physical Systems (CPS) security, the category
              formalised by Gartner's CPS Protection Platforms Magic Quadrant (2025). It spans three converging
              segments: Operational Technology (OT) / Industrial Control Systems (ICS) security — protecting PLCs, RTUs,
              DCS, SCADA, and field devices in energy, manufacturing, water, and transportation; Healthcare OT (HTM)
              security — securing medical devices, clinical networks, and building management systems in hospital
              settings; and Extended IoT (XIoT) — enterprise-grade IoT devices that sit at the intersection of IT and
              OT, including smart building controllers, logistics sensors, and connected industrial equipment.

              Excluded from this definition is generic enterprise IT security (endpoint detection, SIEM for IT traffic,
              traditional firewalls without OT protocol awareness) and consumer IoT. The status-quo substitute for
              dedicated OT security tooling is manual inventory spreadsheets, periodic physical audits, and standard IT
              security tools applied without OT-specific protocol intelligence — all of which leave critical
              infrastructure systematically blind to active asset exposures.

              CISA oversees 16 critical infrastructure sectors, almost all of which include OT or CPS components. NIST
              SP 800-82 Rev.3 (2023) is the authoritative federal guide for securing these environments, and ISA/IEC
              62443 provides the global consensus standard for industrial automation cybersecurity, endorsed by the
              United Nations and applied across 20+ industries. This regulatory scaffolding is a primary demand signal,
              not just a compliance checkbox: organisations that lack an ISA/IEC 62443-aligned security programme face
              increasing procurement, insurance, and regulatory risk.
            claimRefs:
              - CM001
              - CM007
