      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Two-Tier Competitive Landscape
            body: >
              The OT security market is effectively bifurcated: pure-play CPS vendors (Claroty, Dragos, Nozomi) compete
              on OT depth and threat intelligence, while large-platform vendors (PANW, Cisco, Tenable) compete on
              bundled convenience and enterprise procurement efficiency. Claroty occupies the strongest position in the
              pure-play tier by platform breadth, but must defend against the lower-friction bundling strategy of
              incumbents in IT-led enterprises.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP035
              - CP037
          - type: callout
            title: Bundle-and-Displace Risk from PANW and Cisco
            body: >
              Palo Alto Networks and Cisco can offer OT security as incremental capability within existing renewal
              cycles, reducing the need for a standalone OT security RFP. In mid-market enterprises with strong PANW or
              Cisco security stacks, the path-of-least-resistance may be to expand existing vendor relationships rather
              than procure a dedicated CPS security platform. This risk intensifies as PANW's SASE and Strata platforms
              gain traction in manufacturing sectors.
            calloutType: risk
            claimRefs:
              - CP022
              - CP024
              - CP037
              - CP039
          - type: callout
            title: XIoT Breadth Creates Multi-Layer Switching Cost
            body: >
              Claroty's unique advantage is spanning OT, IoT, BAS, and medical devices in one platform. Replacing
              Claroty in a large healthcare system or multi-site manufacturer would require re-deploying discovery and
              monitoring across all four asset domains simultaneously. No single competitor currently matches this
              breadth—Dragos and Nozomi are OT-centric, Armis is strong in IT/IoT/medical but shallower in ICS, and
              Cisco/PANW lack medical device and BAS depth. This switching cost is Claroty's most durable structural
              moat.
            calloutType: strength
            claimRefs:
              - CP035
              - CP036
              - CP040
              - CP042
          - type: callout
            title: Rising Ransomware Tide Lifts All OT Security Vendors
            body: >
              The 64% year-over-year increase in ransomware targeting industrial entities and the growth from 80 to 119
              active ransomware groups in 2025 (Dragos data) creates urgency that benefits all OT security vendors, not
              just Claroty. In an expanding market, Dragos and Nozomi are equally positioned to capture new budget
              allocation. Claroty's ability to grow market share—not just revenue—depends on winning competitive
              displacement deals rather than riding greenfield budget creation.
            calloutType: risk
