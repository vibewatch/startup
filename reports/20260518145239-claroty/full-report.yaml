  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The OT/CPS security market presents Claroty with a layered competitive field. At the core, three pure-play
              CPS security vendors—Claroty, Dragos, and Nozomi Networks—compete directly in asset discovery, threat
              detection, and vulnerability management for industrial control systems and OT environments. A second tier
              of adjacent-platform players—Armis (IT/OT/IoT/medical convergence), Tenable (exposure management), and
              Palo Alto Networks (network security + OT)—brings broader multi-domain coverage but typically shallower OT
              protocol depth. A third tier of niche and automation-embedded players—Cisco Industrial Threat Defense
              (network-native), Verve/SecureOT by Rockwell Automation (manufacturer-for-manufacturers), and Radiflow
              (MSSP/SIEM integration focus)—addresses specific buyer segments or channel motions. Buyers evaluating a
              CPS security platform must also weigh the status-quo alternative of managed OT security services from
              consultancies (Accenture, Deloitte, EY) and the build-versus-buy calculus of deploying SIEM or IT XDR
              tools extended to OT assets. The overall competitive intensity is rising as the Gartner Magic Quadrant for
              CPS Protection Platforms formalized in 2024 and now names multiple leaders, legitimizing enterprise budget
              allocation and accelerating RFP activity.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Pure-Play OT/ICS Security Leaders — Dragos and Nozomi
        blocks:
          - type: paragraph
            body: >
              Dragos is Claroty's most technically credible direct rival. Founded by ex-NSA ICS security practitioners
              and headquartered in the Washington DC metro area, Dragos has built its reputation on threat
              intelligence—its WorldView feed tracks 26 industrial threat groups (11 active in 2025), produces the
              annual OT Cybersecurity Year in Review report, and operates the free OT-CERT resource program and the
              Community Defense Program for small utilities. Dragos was named a Gartner Magic Quadrant Leader for CPS
              Protection Platforms for the second consecutive year in March 2026. The Dragos Platform centers on passive
              asset visibility, a proprietary "Now, Next, Never" vulnerability prioritization model that claims only
              3–6% of ICS vulnerabilities require immediate action, and contextual response playbooks. Dragos's OT Watch
              managed detection and response service extends the platform as a managed offering. Dragos's principal
              weakness relative to Claroty is its narrower asset coverage—it focuses heavily on pure ICS/OT environments
              and does not match Claroty's XIoT breadth across BAS, medical devices, and enterprise IoT. Nozomi Networks
              is the other pillar of the pure-play OT/ICS tier. Founded in 2013 and Swiss in origin, Nozomi reports
              monitoring over 115 million OT, IoT, and IT devices across more than 12,000 worldwide installations, and
              claims 100% customer retention. Nozomi's differentiation rests on AI-powered analysis, a particularly deep
              partner ecosystem (Schneider Electric, ABB, Siemens, Mandiant, GE, Honeywell, IBM Security, Hitachi), and
              endpoint-to-network visibility combining wired and wireless sensors. Nozomi targets critical
              infrastructure at scale and is regularly certified by strategic industrial partners to deliver security
              alongside their OT automation products, giving it a distinctive co-sell channel. Nozomi's weakness versus
              Claroty is a comparatively thinner medical-device and BAS coverage and historically less aggressive
              analyst recognition in the CPS Protection Platform category.
