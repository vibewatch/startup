      - number: '5.5'
        title: Key Strengths and Differentiators
        blocks:
          - type: paragraph
            body: >-
              Claroty's primary technical differentiators are protocol depth, research investment, and platform breadth.
              The 450+ protocol library — built over a decade and continuously extended through Team82's
              reverse-engineering work — is the most consistently cited moat in analyst and customer evaluations.
              Gartner Peer Insights for the CPS Protection Platforms market showed a score of 4.9/5 based on 119 ratings
              with a 97% "Would Recommend" score as of March 2026, reflecting strong implementation satisfaction. The
              company was named a Leader in the 2026 Gartner Magic Quadrant for CPS Protection platforms (second
              consecutive year) and a Representative Vendor in the 2026 Gartner Market Guide for CPS Secure Remote
              Access. The Forrester Wave for IoT Security Solutions Q3 2025 similarly placed Claroty in the Leader band.


              The CPS Library and AI-powered asset identification pipeline represent the most differentiated recent
              product investments. By embedding LLM-RAG and statistical inference modeling, Claroty converts fragmented
              OT protocol broadcasts into deterministic, vendor-verified device identities at scale — solving a problem
              that has historically required weeks of manual reconciliation per site. The platform's coverage of all
              four major CPS verticals (industrial, healthcare, commercial, public sector) with vertical-specific
              compliance mappings and partner integrations is also difficult for point-solution vendors to replicate
              quickly. Team82's open-source toolchain and coordinated disclosure discipline reinforces the technical
              credibility of the platform's detection capabilities.
            claimRefs:
              - CE027
              - CE028
              - CE029
              - CE030
      - number: '5.6'
        title: Technical Risks and Limitations
        blocks:
          - type: paragraph
            body: >-
              Several technical risks merit scrutiny. First, the SRA authentication bypass CVE (patched October 2025 per
              Dark Reading reporting) demonstrated that the most critical access-control component of the platform had a
              high-severity vulnerability. While patched, SRA's position as a gateway into OT networks means any future
              SRA vulnerability could become a highly attractive attack vector; continuous security assurance processes
              for SRA are a key diligence item. Second, the passive-first discovery philosophy — while operationally
              safe — means that assets not broadcasting on monitored segments, air-gapped equipment, and firmware-only
              devices may remain invisible without supplementary Safe Queries or Edge deployments. Customers managing
              heterogeneous, multi-site environments frequently find that achieving complete asset inventory requires
              combining all four discovery methods, adding deployment complexity.


              Third, the platform's SaaS (xDome) mode requires cloud connectivity that some OT environments with strict
              data residency requirements cannot accommodate; CTD on-premises fills this gap but has higher TCO. Fourth,
              Claroty's CPS Library AI accuracy depends heavily on OEM partnership coverage — devices from vendors
              outside the Rockwell/Schneider/Siemens-Healthineers consortium may receive lower-quality attribute
              resolution until additional partnerships are onboarded. Fifth, the breadth of the integration catalog
              (SIEM, SOAR, EDR, NAC, vulnerability management) is technically sound but requires dedicated
              implementation effort; customers without mature IT security operations teams may find the integration
              surface overwhelming rather than additive. Finally, with 145 GitHub followers and niche tool engagement,
              the broader developer community is smaller than IT-native security vendors, limiting crowd-sourced
              feedback loops that could accelerate feature roadmap validation.
            claimRefs:
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
