      - number: '5.3'
        title: Team82 Threat Research and Developer Surface
        blocks:
          - type: paragraph
            body: >-
              Team82 is Claroty's in-house cybersecurity research unit and is positioned as a proprietary competitive
              moat. The team has disclosed more than 750 ICS vulnerabilities — more than any other OT security vendor or
              research group — and publishes coordinated disclosures under a formal Coordinated Disclosure Policy with a
              public PGP key for secure vendor communication. Recent disclosures include multiple CVEs in Trane Tracer
              SC/SC+/Concierge building controllers (March 2026) and Schneider Electric Modicon M241/M251/M262 PLCs
              (March 2026). In its March 2026 report "Analyzing CPS Attack Trends," Team82 analyzed 200+ verified
              incidents over 12 months and found that 82% of attacks leveraged remote access protocols and 66% targeted
              HMIs and SCADA systems — research that directly supports Claroty's product messaging around SRA and
              monitoring.


              Team82 maintains a GitHub organization at github.com/claroty with 10+ public open-source research tools
              including: Arya (pseudo-malicious file generator for YARA testing), EtherNet/IP & CIP Stack Detector
              (identifies specific vendor firmware stacks in OT networks), OPC UA Fuzzer and OPC UA Exploit Framework,
              MMS Stack Detector, BusyBox AFL fuzzing harnesses, netunnel (HTTP/S network tunnel tool), WinCE-Debugger,
              and PCOM-Tools. The organization has 145 GitHub followers, reflecting niche but genuine practitioner
              engagement within the OT/ICS security research community. These tools are used by defenders and other
              researchers, establishing Claroty as an upstream contributor to open OT security tooling.


              The dual role of Team82 — generating threat intelligence that feeds back into the platform's detection
              rules and providing public-good vulnerability research that builds brand credibility — is a differentiated
              investment few OT vendors can replicate at scale. Team82's research directly accelerates the protocol
              library and detection engine updates; the EtherNet/IP stack detector and protocol-specific fuzzers have
              driven new coverage for protocols that would otherwise require months of reverse-engineering. The
              Vulnerability Disclosure Dashboard (publicly accessible on claroty.com/team82) provides real-time tracking
              of all Team82 CVEs, with vendor attribution and CVSS scores.
            claimRefs:
