  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Scope and Deployment Architecture
        blocks:
          - type: paragraph
            body: >-
              The Claroty Platform is an enterprise cyber-physical systems (CPS) protection suite organized around six
              pillars: asset inventory, exposure management, network protection, secure access, threat detection, and
              operational efficiency. It is delivered through two primary products: Claroty xDome, a cloud-native SaaS
              offering targeting organizations that prioritize fast deployment and low infrastructure overhead; and
              Claroty Continuous Threat Detection (CTD), a robust on-premises deployment built for air-gapped industrial
              environments with strict data residency or latency requirements. Both products share the same detection
              engine, analytics framework, and CPS Library integration, so customers choosing either path receive
              functionally equivalent coverage. A third component, Claroty xDome Secure Access (formerly branded Claroty
              SRA), provides zero-trust remote access for internal and third-party OT personnel without requiring
              traditional VPN infrastructure or shared credentials.


              Claroty Edge extends the platform's reach as a zero-infrastructure edge-data collector. It runs on
              existing Windows-based infrastructure — on-premises or in the cloud — with no network sensors or physical
              footprint, allowing organizations to discover assets in remote sites, air-gapped zones, and distributed
              environments that cannot support full CTD deployments. The platform supports four discovery methods:
              passive monitoring (non-intrusive traffic inspection), Safe Queries (low-impact active queries tuned for
              fragile OT systems), Project File Analysis (offline PLC/DCS project file parsing), and Ecosystem
              Enrichment (ingesting data from firewall, switch, and CMMS integrations). Across these methods the
              platform claims coverage of 450+ industrial protocols, which Claroty presents as the deepest protocol
              library in the industry.


              The CPS Library, launched in November 2025, is an AI-powered asset catalog that uses LLMs and statistical
              inference modeling to resolve fragmented device identifiers into a canonical, vendor-verified record. The
              library addresses a systemic OT data-quality problem: Claroty's own Team82 research found that 88% of CPS
              assets do not transmit an exact product code and 76% transmit product names that differ from the vendor's
              official record. OEM partnerships with Rockwell Automation and Schneider Electric underpin the accuracy of
              the repository. An MCP Server layer allows generative AI tools to query the CPS asset inventory,
              accelerating incident response and enabling teams to use their preferred AI assistant on top of CPS
              security data.
