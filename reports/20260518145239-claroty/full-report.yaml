            title: OT Skills Shortage Creates Adoption Ceiling Without Managed Services
            body: >
              The 2026 SANS Institute survey of 947 global respondents finds 60% of organisations cite OT cybersecurity
              skills gaps as their primary workforce challenge, and 27% report breaches linked to those gaps. For
              self-operated OT security platforms, this is a structural adoption constraint: buyers may be unable to
              operationalise the technology even after procurement. Claroty's long-term growth thesis requires either a
              managed OT SOC offering, a simplified operational workflow, or heavy partner ecosystem enablement to
              convert compliance urgency into realised platform value.
