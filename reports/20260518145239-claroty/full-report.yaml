            - BMS, HVAC, physical access (commercial)
        - label: Discovery & Visibility Layer
          modules:
            - Passive monitoring (SPAN/TAP) — 450+ protocol parsers
            - Claroty Edge (agent; zero-infrastructure)
            - Safe Queries (low-impact active)
            - Project File Analysis (offline PLC/DCS)
            - Ecosystem Enrichment (CMMS, AD, EDR feeds)
        - label: CPS Intelligence Layer
          modules:
            - 'CPS Library: LLM-RAG + statistical inference → deterministic device IDs'
            - CVE attribution engine (750+ Team82 disclosures)
            - Behavioral baseline engine (30-90 day learning period)
        - label: Control Plane
          modules:
