      - number: '3.3'
        title: Adjacent Platform Competitors — Armis, Tenable OT, Palo Alto Networks
        blocks:
          - type: paragraph
            body: >
              Armis competes with Claroty primarily in the IoT, BAS, and medical-device security segments, and
              increasingly in broader CPS exposure management. Armis Centrix™ is an agentless, cloud-delivered cyber
              exposure management platform spanning IT, OT, IoT, and medical device security. Armis's named customer
              base is notably diversified—Colgate-Palmolive, United Airlines, Takeda Pharmaceuticals, Mondelēz,
              DocuSign—demonstrating strong enterprise IT-adjacent penetration, but its OT depth and ICS protocol
              coverage are shallower than Claroty's or Dragos's. Armis is positioned more as a CAASM (cyber asset attack
              surface management) vendor than a pure OT security platform, which reduces head-to-head overlap in energy
              and water utility accounts but creates real competition in connected-enterprise and healthcare
              environments. Tenable, via Tenable One OT Exposure, brings its vulnerability management leadership into
              the OT space by unifying IT and OT asset inventories under a single exposure management platform.
              Tenable's differentiating elements include "Safe Active Query" (non-disruptive OT device interrogation in
              native protocols), AI-powered remediation guidance, and its industry-leading Vulnerability Priority Rating
              (VPR) scoring that contextualizes CVSS scores with real-world exploitability. Tenable supports cloud,
              on-premises, and hybrid deployments and maps compliance automatically to NERC CIP, IEC 62443, NIST, and
              PCI DSS. However, Tenable is weaker in OT-specific threat intelligence and response playbooks compared to
              Dragos and Claroty. Palo Alto Networks competes through its Industrial OT Security product line, which
              uses NGFW-based OT protocol inspection to provide real-time asset inventory and risk management embedded
              within existing Palo Alto network infrastructure. Named enterprise customers include BorgWarner and Grupo
              Bimbo. PANW's key competitive advantage is bundles into an existing Palo Alto enterprise security
              spend—buyers that are already Palo Alto customers can activate OT security at marginal incremental cost,
              creating a powerful displacement vector in mid-market and enterprise accounts with mature IT security
              stacks.
