  - id: FE001
    title: Claroty Platform Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Product layers from physical asset layer up through detection/analytics and management plane, showing how xDome,
      CTD, SRA, and the CPS Library relate.
    data:
      layers:
        - label: Physical / OT Layer
          modules:
