            body: >-
              The comparable set is informative but imperfect. Armis is the clearest upside anchor because the announced
              $7.75 billion sale to ServiceNow shows what a strategic buyer will pay for a broad digital-and-physical
              risk platform. It is not a clean one-for-one comparable, however, because Armis spans a broader IT, OT,
              IoT, and cloud footprint than Claroty. Nozomi sits at the other end of the range: its roughly $1 billion
              sale to Mitsubishi Electric is highly relevant as a pure-play OT transaction, but likely understates
              Claroty's broader healthcare and public-sector reach.


              Tenable is the best public-market floor because it provides primary-filed revenue and customer metrics. At
              about $999 million of FY2025 revenue and roughly a $4.1 billion market value in mid-2025, Tenable traded
              near a 4x revenue multiple, which is far below the 25x-plus ARR math implied by a $3 billion Claroty mark
              on a $120 million working ARR case. That gap is not automatically a red flag because Claroty could still
              be growing faster and commanding scarcity value. But it does show that Claroty needs
              better-than-public-comp growth and disclosure quality to defend a premium entry. Dragos remains
