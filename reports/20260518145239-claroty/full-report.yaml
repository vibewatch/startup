      - number: '2.4'
        title: Buyer, User, and Payer Landscape
        blocks:
          - type: paragraph
            body: >
              Buying authority for OT security platforms varies by vertical and by the maturity of the buyer's security
              organisation. In energy and utilities, the CISO and VP of Operations jointly evaluate solutions, with
              procurement typically routed through an IT security or technology capital budget. In manufacturing, the
              plant manager or IT manager often drives the evaluation, with the CFO or CTO approving spend. Healthcare
              buyers are typically CISOs working alongside Biomedical Engineering or Healthcare Technology Management
              (HTM) teams, with hospital CFOs controlling approval. Water utilities and municipalities often have a
              single IT director wearing security responsibility, with funding tied to infrastructure grants and utility
              board approval cycles.

              Users of OT security platforms are OT security analysts, plant engineers, or SOC operators — staff who may
              have limited cybersecurity background but deep process-domain expertise. The tension between OT domain
              knowledge and security expertise is a structural adoption constraint: the same SANS 2026 survey found that
              60% of organisations cite skills gaps as the primary OT cybersecurity challenge, and 42% say those gaps
              prevent adoption of new security technologies.

              Payers are therefore not purely motivated by security ROI. Compliance mandates, cyber insurance
              requirements, and operational resilience objectives are the dominant budget justifications. Professional
              services revenue — integration, deployment, and managed detection — often exceeds software licence value
              in early-stage OT security engagements, reflecting the brownfield complexity of the environments.
            claimRefs:
              - CM019
              - CM020
              - CM035
              - CM036
              - CM037
              - CM039
      - number: '2.5'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary growth driver is the accelerating frequency and severity of attacks on critical
              infrastructure. Google's Cybersecurity Forecast 2026 warns that ICS/OT risks are escalating from both
              cybercrime and nation-state actors. Maritime OT cyberattacks surged 150% in 2025 per Cydome research.
              CISA's Known Exploited Vulnerabilities catalog regularly includes OT/ICS product CVEs, driving urgency in
              asset owners.

              Regulatory tailwind is a compounding driver: NERC CIP, the EU NIS2 Directive, TSA cybersecurity
              directives, FDA medical device guidance, and CISA's Secure by Demand guidance for OT asset procurement are
              collectively raising the compliance floor for every critical infrastructure vertical. SANS 2026 data shows
              regulatory influence on OT security hiring surged from 40% to 95% of organisations in one year — a leading
              indicator of budget allocation.

              IT/OT convergence is the structural driver: as industrial environments adopt IIoT, cloud analytics, and
              remote access for maintenance, the OT attack surface expands dramatically, requiring purpose-built
              security rather than IT tools adapted for OT protocols.

              The dominant constraint is a structural OT security skills shortage. SANS 2026 reports 27% of
              organisations have experienced breaches directly linked to capability gaps, and 42% say those gaps prevent
              adoption of new security technologies. This simultaneously creates demand for managed OT SOC services and
              slows self-operated platform deployments. Long procurement cycles (12–36 months in critical
              infrastructure), operational risk aversion during deployment, and budget competition between IT and OT
              security programmes further constrain adoption velocity.
