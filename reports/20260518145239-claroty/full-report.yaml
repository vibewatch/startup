      - number: '8.3'
        title: Scenario analysis and return math
        blocks:
          - type: paragraph
            body: >-
              The scenario range is driven less by debate about market demand and more by uncertainty around current
              revenue scale. Public evidence can support a base case in which Claroty has progressed beyond the >$100
              million ARR milestone to something closer to $150 million to $160 million by 2027, allowing a $4 billion
              to $5 billion IPO or strategic value. That case works, but it does not make a $3 billion entry obviously
              cheap; it only makes it reasonable if current ARR is already moving above the stale public anchor.


              The bull case requires stronger evidence than is presently available. To support a $6 billion to $8
              billion exit, Claroty would need premium growth, public-market timing, and a buyer or IPO audience willing
              to pay far above mature cyber-platform multiples. The bear case is easier to see from public evidence
              because it only needs one of three things to happen: ARR fails to inflect, the IPO window stays shut, or
              the preference stack proves heavy enough that common-equity returns remain poor even at a headline
              valuation close to today's reported mark. For that reason the return range is skewed: downside can be flat
              to negative at a $3 billion entry, while attractive upside still depends on disclosures the company has
              not yet made.
