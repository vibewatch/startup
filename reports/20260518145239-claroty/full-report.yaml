      - number: '3.5'
        title: Competitive Moats and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              Claroty's most durable competitive advantages are its XIoT platform breadth and the depth of its asset
              knowledge graph. By covering OT, IoT, BAS, and medical devices in a unified platform, Claroty creates
              switching costs that are higher than single-domain vendors: a healthcare organization that has mapped its
              IV pumps, building automation, and industrial process equipment through Claroty faces multi-layer
              re-deployment complexity to replace it. The Team82 threat research function and the Global CPS Research
              Report serve as continuous brand reinforcement with security practitioners, operating analogously to
              Dragos's WorldView and annual year-in-review as earned-media and analyst currency. Claroty's partner
              program (MSSPs, SIs, technology partners) and healthcare-sector depth also represent distribution
              advantages that pure-play rivals Dragos and Nozomi have not yet fully replicated. The most credible
              displacement risk comes not from direct OT security rivals but from large-platform security vendors. Palo
              Alto Networks and Cisco can offer OT security as a bundled capability within enterprise security renewal
              conversations, where CISOs can solve OT visibility with existing vendor relationships and reduce
              procurement complexity. Tenable's cross-sell to its existing vulnerability management install
              base—especially in regulated industries already running Tenable for IT scanning—poses a real upsell risk
              in accounts where OT security is treated as an extension of vulnerability management rather than a
              distinct program. Multi-homing risk is moderate: buyers with Dragos or Nozomi for OT threat detection may
              add Claroty specifically for medical device or BAS coverage without full replacement, generating
              co-deployment scenarios rather than zero-sum competition. The 2026 Dragos Year in Review confirmed a 64%
              year-over-year increase in ransomware attacks against industrial entities, intensifying urgency for
              dedicated OT security budgets and benefiting all vendors in the segment.
            claimRefs:
