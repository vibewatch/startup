  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment thesis
        blocks:
          - type: paragraph
            body: >-
              Claroty is investable on strategic importance but not yet on evidence completeness. The bull thesis is
              straightforward: the OT and broader cyber-physical security category is still growing at a double-digit
              rate, Claroty retains third-party analyst leadership, and the company now reports more than 1,000
              customers including 24 Fortune 100 accounts. The Series F lead by Golub Growth also matters because it
              looks like late-stage positioning for a public-market process rather than an emergency rescue round. Those
              points support continued tracking and can justify a premium to slower, mature cyber platforms.


              The anti-thesis is just as important. Claroty still has not published a current ARR figure, any
              gross-margin or retention data, or the absolute valuation attached to its January 2026 financing. That
              means the valuation story depends on secondary reporting and inference. The recommendation is therefore
              conditional rather than enthusiastic: public evidence supports monitoring and potentially buying only with
              strict entry discipline, not paying any reported price as if it were fully verified. The right stance is
              research more, verify the cap table and ARR bridge, and only underwrite upside once valuation opacity
              narrows materially.
