      - number: '7.3'
        title: Regulatory & Legal Compliance Risks
        blocks:
          - type: paragraph
            body: >
              Claroty's primary verticals—energy, manufacturing, healthcare, and government—are all subject to evolving
              OT cybersecurity mandates that create both demand and compliance overhead. The regulatory landscape is
              characterised by simultaneous tailwinds (mandates that incentivize OT security investment) and headwinds
              (compliance burden that diverts customer budgets and introduces certification friction into Claroty's
              sales cycles).


              The most significant near-term regulatory development is CIRCIA. The Cyber Incident Reporting for Critical
              Infrastructure Act of 2022 mandates 72-hour incident reporting and 24-hour ransomware payment reporting
              for covered critical-infrastructure entities. As of May 2026, CISA's proposed rulemaking is pending final
              promulgation; the scope of covered entities, exact reporting thresholds, and the technical requirements
              for the reporting interface remain under NPRM review. The final rule is expected to expand covered-entity
              scope beyond the statutory minimum, potentially requiring Claroty's customers to build or procure
              reporting-automation capabilities. This could either benefit Claroty if it embeds CIRCIA-compliance
              reporting into its platform, or divert customer security budgets toward point-solution reporting tools if
              Claroty does not move quickly.


              NERC CIP standards provide the regulatory demand floor for Claroty's energy-sector business. The currently
              enforced CIP v5/v6 standards require BES Cyber System asset inventory, network segmentation, and
              patch-management controls that map directly to Claroty's platform capabilities. An upgrade to CIP v7 could
              require customers to re-demonstrate compliance against tightened asset-visibility and incident-detection
              requirements—creating a replacement-evaluation cycle in which Claroty's competitors can challenge
              incumbents.


              In Europe, the NIS2 Directive's October 2024 effective date elevated supply-chain risk management as a
              board-level obligation for essential entities. This creates an asymmetric dynamic for Claroty: as an OT
              security vendor, it benefits from NIS2-driven customer procurement activity, but it is also subject to
              NIS2 scrutiny as a supply-chain component within regulated operators' environments. EU customers may
              require Claroty to provide evidence of its own NIS2-compliant security practices, creating an additional
              certification and compliance overhead for European market expansion.


              On the legal side, the Export Administration Regulations administered by BIS present a latent but
              potentially material risk given Claroty's Israeli corporate domicile and the dual-use classification of
              cybersecurity software for critical-infrastructure protection. While no enforcement action has been
              publicly disclosed, the combination of Israeli origin, government-market focus, and intelligence-grade OT
              vulnerability research creates a fact pattern that warrants ongoing BIS counsel review.
