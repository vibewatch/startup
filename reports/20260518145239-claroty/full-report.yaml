      - number: '4.3'
        title: Unit economics, cost structure, and financial opacity
        blocks:
          - type: paragraph
            body: >
              Claroty has not publicly disclosed any of the core unit economics metrics that would be required for a
              complete financial diligence assessment: gross margins, net revenue retention, gross churn, customer
              acquisition cost, payback period, average contract value trend, or average revenue per account. This is
              consistent with the company being a late-stage private company in the 12–24 months before a contemplated
              IPO, during which disclosure is typically deferred to the S-1 filing.


              Industry benchmarks for comparable enterprise SaaS cybersecurity companies provide rough context: software
              gross margins for established SaaS security platforms typically range from 70 to 85 percent, with
              on-premise software deployments typically 5 to 10 points lower. If Claroty achieves margins in this range
              and has approximately $150–200 million in ARR (blending the 2023 milestone and CB Insights estimate), the
              implied gross profit pool would be approximately $105–170 million annually. This is a rough estimate
              without verifiable backing and should not be treated as authoritative.


              Employee count is approximately 700+ across 27 countries as of mid-2025, per company press releases. At
              approximately $200 million ARR, this implies roughly $285,000 in ARR per employee — a reasonable
              productivity metric for an enterprise SaaS company, though headcount mix between R&D, sales, and services
              is not disclosed. The Medigate acquisition in early 2022, which nearly doubled company headcount at the
              time, was completed at an undisclosed price, preventing any analysis of acquisition multiples or goodwill
              impact on the balance sheet.


              Capital intensity is notable: Claroty has consumed approximately $882 million in disclosed fundraising to
              produce $100+ million in ARR (2023 milestone), implying a capital-to-ARR ratio of approximately 8–9x at
              the time of the Series E-II. While common for security platforms that invest heavily in R&D and enterprise
              sales prior to reaching scale, this ratio is elevated compared to more capital-efficient peers and
              underscores the need for post-IPO operating leverage improvement. The absence of any profitability
              disclosure — no EBITDA, no operating cash flow, no burn rate guidance — means that burn analysis is
              entirely speculative.
            claimRefs:
