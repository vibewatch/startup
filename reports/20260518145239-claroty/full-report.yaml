      - number: '2.2'
        title: Market Sizing — Multiple Lenses with Explicit Caveats
        blocks:
          - type: paragraph
            body: >
              Third-party analysts project the OT/ICS/CPS security market with materially different numbers depending on
              scope definition. MarketsandMarkets (April 2025 report) estimates the global OT Security market at
              approximately $25 billion in 2025, growing to $50.29 billion by 2030 at a CAGR of 16.5%. This covers
              network security, asset discovery, vulnerability management, IAM, data security, and managed services for
              OT environments across all verticals. The US sub-market is sized at $4.64 billion in 2025 growing to $9.37
              billion by 2030 (CAGR 15.1%); Europe at $5.70 billion growing to $11.93 billion (CAGR 15.9%).

              SNS Insider (cited via news aggregator) puts the ICS Security market at $41.82 billion by 2033, implying a
              tighter product scope than the OT Security umbrella but still a double-digit CAGR. Precedence Research
              projects "OT Security" at $122.22 billion by 2034 using a broader definition that likely captures adjacent
              network and cloud security spend for OT environments. Analysts do not consistently include or exclude
              managed detection and response, IT/OT converged platforms, or government-sector spend, making direct
              comparison unreliable.

              A bottom-up SAM construction for Claroty would narrow from the global TAM to: (1) sectors where CPS
              platforms have meaningful penetration — energy, manufacturing, healthcare, water, transportation; (2)
              geographies where Claroty has regulatory and channel reach; and (3) organisations large enough to justify
              a platform purchase. This author-estimated SAM is approximately $10–15 billion by 2030, with a SOM in the
              $3–5 billion range depending on competitive share and expansion of the XIoT platform. These estimates
              carry low confidence and should be validated against Claroty's ARR trajectory and vertical win data.
