      - number: '8.2'
        title: Financing context, valuation discipline, and entry price
        blocks:
          - type: paragraph
            body: >-
              Claroty's disclosed financing history shows both strength and complexity. The 2021 Series D raised $140
              million and took cumulative capital to roughly $235 million, while the March 2024 strategic financing
              added another $100 million and lifted cumulative disclosed capital to $635 million. The January 2026
              Series F then added $150 million led by Golub Growth and brought disclosed funding to roughly $885 million
              to $900 million. That scale of capital can be interpreted positively, because it allowed Claroty to build
              a broad CPS platform and reach meaningful enterprise scale. It also creates a likely preference overhang,
              especially because the 2024 financing included private-credit participation rather than appearing as clean
              common equity.


              Entry discipline therefore matters more than the headline valuation. Independent coverage placed the
              Series F around $3 billion, yet Claroty only confirmed an 80% uplift from the prior round and never
              published the absolute mark. If the prior 2024 mark was really $2.5 billion, then the 80% math implies
              about $4.5 billion. That inconsistency means the public evidence does not support treating $3 billion as a
              verified clearing price. A disciplined investor should instead treat the reported mark as a diligence
              anchor, require proof of current ARR, and underwrite downside from the possibility that preferences and
              structured capital absorb more value than the headline enterprise number suggests.
            claimRefs:
