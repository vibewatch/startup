      - number: '2.3'
        title: Vertical Segments — Threat Exposure and Regulatory Pressure by Industry
        blocks:
          - type: paragraph
            body: >
              Energy and utilities represent the most mature and heavily regulated OT security segment. NERC CIP
              standards mandate cybersecurity protections for bulk electric system (BES) assets across North America,
              creating a compliance-driven budget floor. Nation-state threat actors — including Russian APT groups
              flagged by Latvia's SAB and documented by CISA advisories — actively target grid infrastructure,
              transforming compliance spend into genuine security investment. MarketsandMarkets covers this sector with
              a dedicated ICS Security in Energy and Power report, indicating analyst recognition of sector-specific
              market dynamics.

              Manufacturing faces a different threat profile dominated by ransomware: operational disruption,
              supply-chain extortion, and insurance requirements are the dominant adoption triggers. The Purdue model of
              network segmentation is increasingly inadequate as OT environments connect to ERP systems and cloud
              analytics.

              Healthcare OT is the fastest-growing regulated segment. HHS has issued HIPAA-aligned cybersecurity
              guidance requiring covered entities to address medical device and clinical network security. FDA's medical
              device security guidance further strengthens the compliance driver, while patient-safety consequences of a
              compromised infusion pump or MRI controller elevate organisational willingness to pay.

              Water and wastewater operators, despite smaller individual budgets, face active threats documented by
              WaterISAC (Water Information Sharing and Analysis Center) and EPA guidance. Transportation, including
              maritime and rail OT, is subject to TSA cybersecurity directives: the US Coast Guard mandated
              cybersecurity training for all IT/OT personnel by January 2026.
