      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Wide Analyst Range Reflects Scope Ambiguity, Not Market Immaturity
            body: >
              OT/ICS/CPS security market estimates span $41.82 billion (SNS Insider by 2033) to $122 billion (Precedence
              Research by 2034) — a 3x range. This divergence reflects definitional ambiguity: narrower estimates count
              only OT-specific tools while broader ones include general network and cloud security products layered onto
              OT environments. Investors should demand that any cited TAM include an explicit scope definition before
              comparing estimates. Claroty's SAM is better anchored to Gartner's CPS Protection Platforms category
              (validated by Magic Quadrant existence) than to any single analyst's headline number.
            calloutType: insight
            claimRefs:
              - CM031
              - CM001
              - CM005
              - CM006
          - type: callout
            title: Multi-Sector Regulatory Tailwind Creates Durable Demand Floor
            body: >
              NERC CIP (electric utilities), NIS2 (EU critical infrastructure), TSA cybersecurity directives (pipelines
              and transportation), FDA medical device guidance, and CISA's Secure by Demand OT procurement guidance
              collectively mandate or strongly incentivise OT security investment across all five of Claroty's priority
              verticals. SANS 2026 data shows regulatory influence on OT security hiring surged from 40% to 95% of
              organisations in one year. This compliance-driven demand is structurally different from discretionary
              security spending: it persists through budget cycles.
            calloutType: strength
            claimRefs:
