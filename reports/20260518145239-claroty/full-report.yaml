      - number: '3.4'
        title: Niche and Industrial Automation Players — Cisco, Verve/SecureOT, Radiflow
        blocks:
          - type: paragraph
            body: >
              Cisco competes via Cisco Industrial Threat Defense, a suite anchored by Cisco Cyber Vision (OT/ICS asset
              visibility and behavioral analysis), Cisco Secure Equipment Access (zero-trust remote access for OT),
              Cisco Secure Firewall for industrial DMZ, and Cisco Identity Services Engine for zone and conduit
              enforcement under ISA/IEC 62443. Cisco's competitive advantage is its installed base of industrial network
              switches and routers, which become passive sensors for Cyber Vision without additional hardware
              deployments. This "network as sensor and enforcer" approach dramatically lowers the deployment friction
              for Cisco-centric industrial environments—Cisco Validated Designs provide reference architectures and
              bill-of-materials reducing implementation risk. Cisco integrates with Cisco XDR and Splunk for unified
              IT/OT threat correlation. Its weakness is limited OT-specific threat intelligence and a less specialized
              OT security go-to-market motion than Dragos or Claroty. Verve Industrial Protection, now rebranded as
              SecureOT by Rockwell Automation, positions itself as "built by a manufacturer for manufacturers." The
              SecureOT solution suite combines a vendor-neutral OT-specific asset inventory and risk management platform
              (the former Verve Security Center) with professional and managed security services including 24/7 OT SOC
              and NOC capabilities. Rockwell's ownership adds significant manufacturing-sector credibility and a deep
              relationship with Rockwell Automation's installed control-system base. SecureOT's strategy is end-to-end
              services rather than competing on platform technology alone, differentiating through deployment support,
              NIST CSF maturity uplift case studies, and operational integration with Rockwell equipment. Radiflow is an
              Israeli OT security vendor serving over 20,000 sites globally, with particular strength in MSSP and SIEM
              integration contexts. Radiflow offers non-intrusive, non-destructive OT network monitoring with Smart
              Collectors enabling bandwidth-efficient telemetry from remote sites to a central SOC. Radiflow integrates
              with IBM security products and targets industries where IEC 62443 compliance and MSSP-delivered security
              are the preferred delivery model. Its market footprint is significantly smaller than the top three
              pure-play players, and it lacks the platform breadth and threat-intelligence depth of Claroty, Dragos, or
              Nozomi, but it remains a reference vendor in SIEM-centric OT security architectures.
