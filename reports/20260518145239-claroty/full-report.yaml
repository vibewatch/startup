      - number: '1.5'
        title: Milestones, competitive context, and adverse events
        blocks:
          - type: paragraph
            body: >
              Claroty's milestone chronology shows a company that has scaled rapidly from a Team8 incubator spin-out in
              2015 to a late-stage pre-IPO market leader in 2026. The acquisition of Medigate in 2021 was the single
              most consequential structural move: it nearly doubled headcount, added healthcare IoT as a distinct
              market, and enabled the xDome SaaS platform that now anchors the company's cloud deployment strategy. The
              FOCUS partner program, expanded in 2024 to include a global integrator and reseller ecosystem, and the
              xCelerate partner program reinforce the company's channel-driven GTM.


              The competitive landscape shifted materially in 2025. Nozomi Networks, previously Claroty's closest peer
              in pure OT security, agreed to be acquired by Mitsubishi Electric for approximately $1 billion in
              September 2025. ServiceNow announced plans to acquire Armis, a broader IoT security platform, for $7.75
              billion in December 2025. These exits represent both validation of the CPS security category and a
              reduction in Claroty's publicly traded comparable set — a double-edged dynamic for IPO valuation. Claroty
              management has characterized the consolidation as an opportunity to take market share from customers who
              may not want their OT security embedded inside a larger industrial or enterprise vendor.


              Adverse and risk items identifiable from public sources include: (1) valuation opacity — Claroty has never
              publicly confirmed a valuation, and the 80% increase claim from the company is mathematically inconsistent
              with the $3 billion third-party estimate if the March 2024 baseline was $2.5 billion; (2) ARR ambiguity —
              the company last confirmed ARR above $100 million as of 2023, and more recent figures are not publicly
              disclosed; (3) IPO dependency — the IPO narrative assumes 2027 market conditions that cannot be
              guaranteed; and (4) leadership transition risk in the CPO function, with Yoram Gronich and Gil Gur Arie
              both holding the CPO title simultaneously in early 2026. None of these items are individually
              disqualifying, but each represents a diligence ask for later chapters.
