      - number: '4.4'
        title: Capital adequacy, valuation context, and IPO trajectory
        blocks:
          - type: paragraph
            body: >
              The January 2026 Series F provides Claroty with fresh capital for global expansion. Golub Growth's lead
              role is significant for interpreting strategic intent: Golub Capital is a late-stage growth credit and
              equity platform that has historically positioned itself in the 12–36 month window before portfolio company
              IPOs, using flexible debt and equity structures to provide pre-IPO capital while managing dilution for
              existing shareholders. The Series F being structured as equity (rather than revenue-based financing or
              convertible debt) suggests the company's governance and cap table are being prepared for public market
              standards.


              CEO Yaniv Vardi stated publicly, via Calcalist and reported by CRN, that Claroty could pursue an initial
              public offering as early as 2027, conditional on market conditions. This places the company in a 12–18
              month IPO preparation window from the Series F close. For context, Armis raised its last private round (at
              a $4.6 billion valuation) in 2022 before being acquired by ServiceNow for $7.75 billion in 2025; Nozomi
              Networks raised capital before being acquired by Mitsubishi Electric for approximately $1 billion in 2025.
              Claroty is currently the primary large-scale, independent pure-play CPS/OT security company in the market.


              On valuation, the company confirmed an 80% increase from its March 2024 baseline. The March 2024 round was
              widely reported to have valued the company at approximately $2.5 billion post-money (per CRN, which cited
              "previous reports"). An 80% increase from $2.5 billion implies a current valuation of approximately $4.5
              billion. However, Calcalist reported the Series F valuation at approximately $3 billion — a figure that
              SecurityWeek explicitly identified as mathematically inconsistent with the 80% growth and $2.5 billion
              baseline combination. This discrepancy requires direct verification with the company; it suggests either
              that the March 2024 $2.5 billion figure was overstated, that Calcalist's $3 billion is underestimated, or
              that the 80% growth figure applies to a lower baseline than $2.5 billion.


              No SEC Form D filings have been identified for either the 2024 Series E-II or the 2026 Series F. This
              absence is consistent with use of Cayman Islands or other non-U.S. fund structures (as seen in the 2022
              Form D filings for Team8-Claroty II and Marker-Claroty), or with debt/structured credit instruments that
              do not constitute equity securities subject to Form D filing requirements under Regulation D. The
              AllianceBernstein private credit participation in the Series E-II supports the hypothesis that at least a
              portion of these rounds involve structured instruments.
            claimRefs:
