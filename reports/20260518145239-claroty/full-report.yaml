            body: >
              The primary customer risk is the opacity of NRR and churn data. Claroty's private status means formal
              retention metrics are unavailable, forcing reliance on proxy signals (KLAS, case study expansion, KLAS
              three-year rolling metric). G2 reviewers—albeit a small panel (4.7/5, 6 reviews as of October 2024) —flag
              meaningful deployment friction: "a significant amount of fine-tuning is required to deploy," "software
              bugs, which can make incident handling cumbersome," "complexity of the initial setup might be
              challenging," and "needs an expert team to install." These signals suggest that time-to-value can be
              longer than marketed, that deployment requires skilled OT security personnel (a scarce resource), and that
              customers without in-house expertise may face higher total cost of ownership. Customer concentration is
              unknown at the revenue level: the 24 Fortune 100 accounts likely represent disproportionate ARR, and loss
              of even one large account could be material. Public-sector sales cycles are long and procurement-gated,
              making the Carahsoft and Mission IT partnerships necessary but not sufficient for rapid government revenue
              ramp. Healthcare vertical concentration, while validated, could become a liability if hospital M&A
              consolidates the customer base or if reimbursement pressures reduce cybersecurity spending. No public
              churn incidents, failed deployments, or major customer complaints have been identified in this research;
              however, the absence of adverse public evidence is partly explained by Claroty's non-disclosure norms and
