            - Claroty CTD (on-prem) — local management server
            - xDome Secure Access — zero-trust remote access gateway
        - label: Integration / Output Layer
          modules:
            - SIEM export (Splunk, QRadar, Sentinel, ArcSight)
            - SOAR/ticketing (ServiceNow, PagerDuty, Jira)
            - NAC/firewall policy push (Palo Alto, Fortinet, Cisco)
            - EDR enrichment (CrowdStrike Falcon, MS Defender)
