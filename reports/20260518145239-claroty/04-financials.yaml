- id: section-2
  title: Revenue model, pricing architecture, and ARR disclosure
  body: 'Claroty''s revenue model is centered on recurring software subscriptions delivered through two primary product lines:
    Claroty xDome, a cloud-native SaaS platform, and Claroty Continuous Threat Detection (CTD), an on-premise software deployment.
    Both products cover the same four functional pillars — exposure management, network protection, secure access, and threat
    detection — but target different customer IT/OT architecture preferences. The SaaS (xDome) product is expected to command
    a higher gross margin and longer-term net revenue retention, while the on-premise CTD product provides access to air-gapped
    environments where cloud connectivity is not permitted.


    Claroty added a third distinct offering in early 2026: the CPS Library, an AI-powered asset catalogue billed as the "first
    in the industry" to provide cross-vendor visibility into cyber-physical assets and vulnerability attribution. The CPS
    Library represents a potential new subscription revenue stream layered on top of the core platform, targeting enterprise
    security teams that need aggregated OT/IoT asset intelligence beyond their own deployed Claroty sensors.


    Revenue is primarily enterprise-contracted, typically multi-year agreements negotiated with Fortune 500 and critical infrastructure
    operators. Pricing is believed to be asset-based (per-device or per-site subscription) with professional services for
    deployment and ongoing support at list. No published pricing exists; Claroty competes on platform breadth and OT-specific
    domain expertise rather than price, consistent with the company''s positioning as a premium enterprise vendor.


    The only publicly disclosed ARR milestone is that the company surpassed $100 million in annual recurring revenue during
    2023, announced in the March 6, 2024 Series E-II press release. CB Insights estimates 2026 ARR at approximately $200 million
    based on secondary market data. A Forbes profile references $300 million in ARR "over the past three years," which appears
    to be cumulative or may reference a different metric from the company''s own $100 million 2023 milestone — this figure
    is conflicting and unreliable as a point-in-time ARR reference. The current ARR and revenue growth rate are not disclosed.
    Geographic revenue breakdown, channel mix, and revenue concentration by vertical are all undisclosed.

    '
