  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin data for Claroty xDome and Claroty CTD product lines; segment-level income statement or
      investor deck.
    whyItMatters: Without gross margin, it is impossible to assess unit economics quality, profitability trajectory, or the
      capital requirements for scaling revenue.
    diligencePath: Request segment-level financials via NDA process; review S-1 when filed or consult secondary investors
      who have investor-level disclosure.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: net-revenue-retention
    missingEvidence: Net revenue retention rate, gross churn, expansion revenue, and cohort-level ARR data.
    whyItMatters: NRR is the primary quality metric for enterprise SaaS valuation. Without it, revenue durability and expansion
      potential cannot be assessed.
    diligencePath: Request CRM data or investor deck with cohort analysis; may appear in S-1 filing.
    relatedQuestionRefs:
    - QI010
    - QI002
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Annual operating cash burn, cash on hand post-Series F, and estimated runway to cash flow breakeven or
      next capital event.
    whyItMatters: Runway determines whether the 2027 IPO aspiration is achievable or if a bridge raise will be required; it
      is a primary risk factor in assessing the Series F investment.
    diligencePath: Request audited financials, board-level financial summary, or investor deck via NDA; or wait for S-1 filing
      if IPO proceeds.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: undisclosed-series-e
    missingEvidence: 'Documentation of the implied Series E round circa December 2021: amount raised, lead investor(s), valuation,
      investors, and use of proceeds including the Medigate acquisition.'
    whyItMatters: This $400M gap represents the largest unverified segment of Claroty's financing history, and its terms may
      affect cap table seniority and liquidation preference stack.
    diligencePath: Request cap table and complete financing history via NDA; search CB Insights and Crunchbase for Series
      E investors; contact Marker Management Group directly regarding the Marker-Claroty Series E LP.
    relatedQuestionRefs:
    - QI004
    - QI016
    relatedTableRefs:
    - TI001
  - type: conflicting-data
    severity: material
    topic: valuation-inconsistency
    missingEvidence: Authoritative confirmation of Claroty's post-Series F valuation from either the company, a primary transaction
      document, or a credible investment bank disclosure.
    whyItMatters: The $3B Calcalist estimate and the implied $4.5B from 80% growth on a $2.5B base cannot both be correct;
      the true valuation affects acquisition multiples and IPO pricing benchmarks.
    diligencePath: Request the term sheet or board resolution from Series F; contact Golub Capital IR; verify the March 2024
      $2.5B baseline with the company directly.
    relatedQuestionRefs:
    - QI003
    - QI006
    - QI007
    relatedTableRefs:
    - TI005
