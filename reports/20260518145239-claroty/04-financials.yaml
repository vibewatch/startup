  name: Claroty
chapter:
  number: 4
  title: Financials
  summary: Claroty has raised approximately $885–900 million in total disclosed capital across six institutional rounds since
    its 2015 founding, with the January 2026 Series F of $150 million led by Golub Growth representing the most recent close.
    The company confirmed an 80% increase in valuation since its March 2024 Series E-II, though it has never publicly disclosed
    an absolute valuation figure; third-party estimates range from approximately $3 billion (Calcalist) to a mathematically
    implied $4.5 billion based on the 80% growth factor applied to the reported $2.5 billion March 2024 mark. ARR surpassed
    $100 million during 2023 per company disclosure; current ARR is not publicly reported. Gross margins, net revenue retention,
    burn rate, and unit economics are not disclosed. The participation of Golub Growth — a pre-IPO growth equity affiliate
    of Golub Capital — and CEO Yaniv Vardi's public commentary indicate an IPO target as early as 2027, conditional on market
    conditions.
sections:
- id: section-1
  title: Capital formation history and round-by-round chronology
  body: 'Claroty has assembled approximately $885–900 million in total disclosed institutional capital since its 2015 founding
    inside the Team8 cyber foundry. The capital formation trajectory spans six publicly acknowledged rounds, though the company
    has never published a complete financing timeline, and SEC EDGAR records indicate the existence of special-purpose vehicles
    around a December 2021 funding event that the company did not announce independently.


    The earliest identifiable institutional capital traces to the company''s incubation within Team8, documented by an SEC
    Form D filing for Team8 – Claroty, L.P. (CIK 0001754014) dated October 2018. That filing registers a $5 million exempt
    offering by a Cayman Islands fund, confirming Team8''s structured equity holding dating to the founding era. The Series
    D, closed in June 2021, raised $140 million co-led by Bessemer Venture Partners and Standard Industries'' 40 North platform,
    and at that time represented the largest single investment ever made in the industrial cybersecurity sector. The cumulative
    total at Series D close was approximately $235 million.


    Between June 2021 and March 2024, Claroty raised an additional approximately $400 million that was never publicly announced
    as a standalone round. SEC EDGAR records two Form D filings in early 2022: Team8 – Claroty II, L.P. (CIK 0001903605, filed
    January 2022) and Marker-Claroty Series E LP (CIK 0001908673, filed February 2022, initial offering amount $7.3 million
    for an SPV). CB Insights records a December 2021 institutional round on this basis. The cumulative funding reported at
    the March 2024 Series E-II close was $635 million, implying a Series E of approximately $400 million between mid-2021
    and early 2024. This is the largest disclosure gap in Claroty''s financing history and a primary diligence item.


    The March 6, 2024 Series E-II raised $100 million in "strategic growth financing" led by equity investor Delta-v Capital,
    with participation from AB Private Credit Investors at AllianceBernstein, Standard Investments, Toshiba Digital Solutions,
    SE Ventures, Rockwell Automation, and SVB. The structure included both equity and private credit, as indicated by the
    AllianceBernstein private credit participation — an unusual feature for a pure venture round that may affect cap table
    seniority. No SEC Form D was filed for this round.


    The January 22, 2026 Series F raised $150 million led by Golub Growth, an affiliate of Golub Capital, with up to $50 million
    of additional confirmed participation from existing investors, bringing the total to as much as $200 million at full close
    and cumulative disclosed capital to approximately $885–900 million. Golub Growth specializes in flexible debt and equity
    capital for B2B SaaS companies in the pre-IPO phase. No SEC Form D was filed for the Series F. The company confirmed an
    80% increase in valuation since the March 2024 round but declined to disclose an absolute figure. CRN reported total funding
    as "at least $885 million"; SecurityWeek reported "approximately $900 million."

    '
