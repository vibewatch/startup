company:
  name: Claroty

chapter:
  number: 3
  title: Competitors
  summary: >
    Claroty competes in a crowded OT/CPS security market against pure-play rivals Dragos and Nozomi Networks, broad-platform adjacent players Armis, Tenable, and Palo Alto Networks, and niche industrial-automation vendors Cisco, Verve/SecureOT (Rockwell Automation), and Radiflow. Dragos and Nozomi are the most structurally similar and analytically credible rivals, but Claroty's XIoT platform breadth—spanning OT, IoT, BAS, and medical devices—gives it the widest asset coverage of any pure-play CPS vendor. The displacement risk most worth watching is from large-platform incumbents (Palo Alto Networks, Cisco) that bundle OT visibility into existing enterprise security stacks at lower marginal cost to buyers with mature IT security programs.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >
      The OT/CPS security market presents Claroty with a layered competitive field. At the core, three pure-play CPS security vendors—Claroty, Dragos, and Nozomi Networks—compete directly in asset discovery, threat detection, and vulnerability management for industrial control systems and OT environments. A second tier of adjacent-platform players—Armis (IT/OT/IoT/medical convergence), Tenable (exposure management), and Palo Alto Networks (network security + OT)—brings broader multi-domain coverage but typically shallower OT protocol depth. A third tier of niche and automation-embedded players—Cisco Industrial Threat Defense (network-native), Verve/SecureOT by Rockwell Automation (manufacturer-for-manufacturers), and Radiflow (MSSP/SIEM integration focus)—addresses specific buyer segments or channel motions. Buyers evaluating a CPS security platform must also weigh the status-quo alternative of managed OT security services from consultancies (Accenture, Deloitte, EY) and the build-versus-buy calculus of deploying SIEM or IT XDR tools extended to OT assets. The overall competitive intensity is rising as the Gartner Magic Quadrant for CPS Protection Platforms formalized in 2024 and now names multiple leaders, legitimizing enterprise budget allocation and accelerating RFP activity.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]

  - id: pure-play-ot-ics-leaders
    title: Pure-Play OT/ICS Security Leaders — Dragos and Nozomi
    body: >
      Dragos is Claroty's most technically credible direct rival. Founded by ex-NSA ICS security practitioners and headquartered in the Washington DC metro area, Dragos has built its reputation on threat intelligence—its WorldView feed tracks 26 industrial threat groups (11 active in 2025), produces the annual OT Cybersecurity Year in Review report, and operates the free OT-CERT resource program and the Community Defense Program for small utilities. Dragos was named a Gartner Magic Quadrant Leader for CPS Protection Platforms for the second consecutive year in March 2026. The Dragos Platform centers on passive asset visibility, a proprietary "Now, Next, Never" vulnerability prioritization model that claims only 3–6% of ICS vulnerabilities require immediate action, and contextual response playbooks. Dragos's OT Watch managed detection and response service extends the platform as a managed offering. Dragos's principal weakness relative to Claroty is its narrower asset coverage—it focuses heavily on pure ICS/OT environments and does not match Claroty's XIoT breadth across BAS, medical devices, and enterprise IoT.
      Nozomi Networks is the other pillar of the pure-play OT/ICS tier. Founded in 2013 and Swiss in origin, Nozomi reports monitoring over 115 million OT, IoT, and IT devices across more than 12,000 worldwide installations, and claims 100% customer retention. Nozomi's differentiation rests on AI-powered analysis, a particularly deep partner ecosystem (Schneider Electric, ABB, Siemens, Mandiant, GE, Honeywell, IBM Security, Hitachi), and endpoint-to-network visibility combining wired and wireless sensors. Nozomi targets critical infrastructure at scale and is regularly certified by strategic industrial partners to deliver security alongside their OT automation products, giving it a distinctive co-sell channel. Nozomi's weakness versus Claroty is a comparatively thinner medical-device and BAS coverage and historically less aggressive analyst recognition in the CPS Protection Platform category.
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: adjacent-platform-competitors
    title: Adjacent Platform Competitors — Armis, Tenable OT, Palo Alto Networks
    body: >
      Armis competes with Claroty primarily in the IoT, BAS, and medical-device security segments, and increasingly in broader CPS exposure management. Armis Centrix™ is an agentless, cloud-delivered cyber exposure management platform spanning IT, OT, IoT, and medical device security. Armis's named customer base is notably diversified—Colgate-Palmolive, United Airlines, Takeda Pharmaceuticals, Mondelēz, DocuSign—demonstrating strong enterprise IT-adjacent penetration, but its OT depth and ICS protocol coverage are shallower than Claroty's or Dragos's. Armis is positioned more as a CAASM (cyber asset attack surface management) vendor than a pure OT security platform, which reduces head-to-head overlap in energy and water utility accounts but creates real competition in connected-enterprise and healthcare environments.
      Tenable, via Tenable One OT Exposure, brings its vulnerability management leadership into the OT space by unifying IT and OT asset inventories under a single exposure management platform. Tenable's differentiating elements include "Safe Active Query" (non-disruptive OT device interrogation in native protocols), AI-powered remediation guidance, and its industry-leading Vulnerability Priority Rating (VPR) scoring that contextualizes CVSS scores with real-world exploitability. Tenable supports cloud, on-premises, and hybrid deployments and maps compliance automatically to NERC CIP, IEC 62443, NIST, and PCI DSS. However, Tenable is weaker in OT-specific threat intelligence and response playbooks compared to Dragos and Claroty.
      Palo Alto Networks competes through its Industrial OT Security product line, which uses NGFW-based OT protocol inspection to provide real-time asset inventory and risk management embedded within existing Palo Alto network infrastructure. Named enterprise customers include BorgWarner and Grupo Bimbo. PANW's key competitive advantage is bundles into an existing Palo Alto enterprise security spend—buyers that are already Palo Alto customers can activate OT security at marginal incremental cost, creating a powerful displacement vector in mid-market and enterprise accounts with mature IT security stacks.
    claimRefs: [CP016, CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025]
    tableRefs: [TP002]
    figureRefs: [FP002]

  - id: niche-industrial-automation
    title: Niche and Industrial Automation Players — Cisco, Verve/SecureOT, Radiflow
    body: >
      Cisco competes via Cisco Industrial Threat Defense, a suite anchored by Cisco Cyber Vision (OT/ICS asset visibility and behavioral analysis), Cisco Secure Equipment Access (zero-trust remote access for OT), Cisco Secure Firewall for industrial DMZ, and Cisco Identity Services Engine for zone and conduit enforcement under ISA/IEC 62443. Cisco's competitive advantage is its installed base of industrial network switches and routers, which become passive sensors for Cyber Vision without additional hardware deployments. This "network as sensor and enforcer" approach dramatically lowers the deployment friction for Cisco-centric industrial environments—Cisco Validated Designs provide reference architectures and bill-of-materials reducing implementation risk. Cisco integrates with Cisco XDR and Splunk for unified IT/OT threat correlation. Its weakness is limited OT-specific threat intelligence and a less specialized OT security go-to-market motion than Dragos or Claroty.
      Verve Industrial Protection, now rebranded as SecureOT by Rockwell Automation, positions itself as "built by a manufacturer for manufacturers." The SecureOT solution suite combines a vendor-neutral OT-specific asset inventory and risk management platform (the former Verve Security Center) with professional and managed security services including 24/7 OT SOC and NOC capabilities. Rockwell's ownership adds significant manufacturing-sector credibility and a deep relationship with Rockwell Automation's installed control-system base. SecureOT's strategy is end-to-end services rather than competing on platform technology alone, differentiating through deployment support, NIST CSF maturity uplift case studies, and operational integration with Rockwell equipment.
      Radiflow is an Israeli OT security vendor serving over 20,000 sites globally, with particular strength in MSSP and SIEM integration contexts. Radiflow offers non-intrusive, non-destructive OT network monitoring with Smart Collectors enabling bandwidth-efficient telemetry from remote sites to a central SOC. Radiflow integrates with IBM security products and targets industries where IEC 62443 compliance and MSSP-delivered security are the preferred delivery model. Its market footprint is significantly smaller than the top three pure-play players, and it lacks the platform breadth and threat-intelligence depth of Claroty, Dragos, or Nozomi, but it remains a reference vendor in SIEM-centric OT security architectures.
    claimRefs: [CP026, CP027, CP028, CP029, CP030, CP031, CP032, CP033, CP034]
    tableRefs: [TP003]

  - id: moat-and-displacement-risk
    title: Competitive Moats and Displacement Risk
    body: >
      Claroty's most durable competitive advantages are its XIoT platform breadth and the depth of its asset knowledge graph. By covering OT, IoT, BAS, and medical devices in a unified platform, Claroty creates switching costs that are higher than single-domain vendors: a healthcare organization that has mapped its IV pumps, building automation, and industrial process equipment through Claroty faces multi-layer re-deployment complexity to replace it. The Team82 threat research function and the Global CPS Research Report serve as continuous brand reinforcement with security practitioners, operating analogously to Dragos's WorldView and annual year-in-review as earned-media and analyst currency. Claroty's partner program (MSSPs, SIs, technology partners) and healthcare-sector depth also represent distribution advantages that pure-play rivals Dragos and Nozomi have not yet fully replicated.
      The most credible displacement risk comes not from direct OT security rivals but from large-platform security vendors. Palo Alto Networks and Cisco can offer OT security as a bundled capability within enterprise security renewal conversations, where CISOs can solve OT visibility with existing vendor relationships and reduce procurement complexity. Tenable's cross-sell to its existing vulnerability management install base—especially in regulated industries already running Tenable for IT scanning—poses a real upsell risk in accounts where OT security is treated as an extension of vulnerability management rather than a distinct program. Multi-homing risk is moderate: buyers with Dragos or Nozomi for OT threat detection may add Claroty specifically for medical device or BAS coverage without full replacement, generating co-deployment scenarios rather than zero-sum competition. The 2026 Dragos Year in Review confirmed a 64% year-over-year increase in ransomware attacks against industrial entities, intensifying urgency for dedicated OT security budgets and benefiting all vendors in the segment.
    claimRefs: [CP035, CP036, CP037, CP038, CP039, CP040, CP041, CP042]
    tableRefs: [TP004]
    figureRefs: [FP003]

