  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics-gap
      missingEvidence: >
        Formal NRR, GRR, logo churn, and per-cohort retention rate data from Claroty's internal
        finance and customer success systems.
      whyItMatters: >
        Without NRR and GRR, it is impossible to quantitatively assess whether growth is driven by
        new customer acquisition, expansion of existing accounts, or both. The absence also prevents
        assessing the risk of net ARR decline if new customer growth slows.
      diligencePath: >
        Request NRR, GRR, and churn cohort data directly from Claroty management in a structured
        diligence call; request normalized cohort data for year-1, year-2, year-3+ customer vintages.
      relatedQuestionRefs:
        - QU014
        - QU020

    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: >
        Revenue breakdown by top-10 customer accounts (% of total ARR), top vertical (healthcare vs.
        industrial vs. public sector), and top geography.
      whyItMatters: >
        Revenue concentration at the account or vertical level represents a material downside risk to
        the investment thesis if Claroty's ARR is driven by a few large deployments that could
        consolidate (hospital M&A), reprocure on competition, or reduce scope.
      diligencePath: >
        Request top-10 customer revenue concentration, vertical ARR split, and geographic ARR split
        from Claroty finance. Verify whether any single customer exceeds 5–10% of ARR.
      relatedQuestionRefs:
        - QU015
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: competitive-customer-proof-comparison
      missingEvidence: >
        Comparable named customer lists and KLAS/analyst scores for Dragos, Nozomi Networks, and
        Armis in the healthcare and industrial verticals to benchmark Claroty's proof quality.
      whyItMatters: >
        Without competitive comparison data, assessing whether Claroty's 1,000+ customer count and
        KLAS standing translate to durable market leadership versus a transient positioning advantage
        is difficult.
      diligencePath: >
        Review Dragos OT-CERT public disclosures, Nozomi Networks case study library, and Armis
        KLAS/Gartner Peer Insights scores; compile comparative named-customer table.
      relatedQuestionRefs:
        - QU016

