callouts:
  - calloutType: strength
    title: KLAS Healthcare Leadership — Five-Year Streak Is Durable Signal
    body: >
      Five consecutive Best in KLAS awards (2021–2025) plus a 2026 Top Performer designation with the
      most evaluating organizations (35) in the healthcare IoT security category are the strongest
      independent retention signals available for a private-company vendor. The KLAS "Consistent High
      Performers 2025" inclusion—the only healthcare IoT vendor—reinforces that high satisfaction is
      not a one-year artifact. This makes healthcare the clearest anchor vertical for ARR durability.
    claimRefs:
      - CU019
      - CU020
      - CU021

  - calloutType: strength
    title: Named Fortune 100 and Multi-Site Production Proof
    body: >
      Twenty-four Fortune 100 accounts and 8,000+ global sites confirm large-enterprise production
      adoption at scale. The Port Authority PANYNJ, South Tees NHS, and Coop Switzerland case studies
      demonstrate 2+ year production tenures with documented expansion, constituting premium reference
      proof material for enterprise sales cycles and analyst validation.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU015

  - calloutType: risk
    title: NRR Opacity and Deployment Complexity Create Due-Diligence Gaps
    body: >
      Claroty's refusal to disclose NRR, GRR, or churn rates is standard for private companies approaching
      IPO but prevents quantitative retention analysis. G2 reviewer feedback—small sample, but consistent
      —cites significant deployment fine-tuning, software bugs, and expert-team requirements that could
      suppress retention in under-resourced customer environments. Any investment thesis must obtain
      formal NRR cohort data in diligence.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034

  - calloutType: insight
    title: Government Channel Now Formalized — ATO Pipeline Is the Watch Metric
    body: >
      The Carahsoft NASPO ValuePoint partnership (May 2026) and the Mission IT defense/IC ATOs
      (December 2025) represent a step-function increase in US government acquisition velocity. NASPO
      eliminates most SLED procurement friction; defense ATOs signal Claroty is FedRAMP-equivalent
      for OT. The number of active ATO applications and Carahsoft reseller activations in H2 2026
      will determine whether government becomes a material revenue line before a potential 2027 IPO.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU036

