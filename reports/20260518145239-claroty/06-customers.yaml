  - id: healthcare-vertical-depth
    title: Healthcare Vertical Depth and KLAS Validation
    body: >
      Healthcare is Claroty's deepest, most independently validated vertical. The company has been recognized
      as Best in KLAS for Healthcare IoT Security by KLAS Research for five consecutive years (2021–2025) and
      received a Top Performer designation in the 2026 Best in KLAS Awards with an overall score of 92.5 out
      of 100—the second-highest score among all evaluated vendors and the highest number of customer reviews
      (35 unique healthcare organizations) in its category. KLAS also selected Claroty as one of only 30
      vendors included in its "Consistent High Performers 2025" report measuring three-year rolling customer
      satisfaction—the only healthcare IoT security vendor on the list. Customer quotes published by KLAS
      indicate strong loyalty: a hospital CTO (December 2025) stated "We would absolutely purchase Claroty's
      system again"; a hospital manager (May 2025) described xDome as "our backbone when it comes to creating
      segmentation around medical devices… Claroty was the only answer for us." Named healthcare case studies
      include South Tees Hospitals NHS Foundation Trust (UK), Yale New Haven Health System (US), and Ohio State
      University Wexner Medical Center (US). Claroty's healthcare platform addresses regulatory pressures from
      HHS Section 405(d), HIPAA Security Rule, EU NIS2, and NHS Data Security and Protection Toolkit (DSPT),
      giving it compliance-driven stickiness. The breadth of healthcare customer evidence—five independently
      scored KLAS surveys, 35 evaluating organizations, named production deployments, and multi-year renewal
      signals—positions healthcare as Claroty's anchor vertical for revenue durability.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU035
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: channel-partner-public-sector
    title: Channel, Partner, and Public Sector Reach
    body: >
      Claroty's go-to-market relies heavily on a channel-partner model through its xCelerate Partner Program,
      which enables resellers, value-added resellers (VARs), managed security service providers (MSSPs),
      technology alliances, and distributors to sell, deploy, and support the platform. In April 2026, Claroty
      appointed John Ryan—formerly VP Worldwide Channel at Orca Security and Illumio—as Vice President of
      Worldwide Partner Ecosystem to accelerate this strategy. The CRN Security 100 and CRN IoT 50
      designations in 2026 underscore channel credibility. For the US public sector, Claroty and Carahsoft
      Technology Corp. announced a distribution partnership in May 2026, making the Claroty platform available
      through Carahsoft's NASPO ValuePoint Master Agreement (#AR2472) to Federal, state, local, education,
      and healthcare (SLED) agencies. Carahsoft's extensive reseller network provides Claroty with coverage
      across agencies it would struggle to reach directly. The partnership with Mission IT (December 2025)
      resulted in Claroty CTD achieving an Authority to Operate (ATO) at multiple military missile defense
      sites under the Department of War (DoW) and an ATO for a classified Intelligence Community (IC) Facility
      Related Control System (FRCS), enabling ICD 503 and UFGS-25 05 11 compliance. At the missile defense
      site, Mission IT discovered a device footprint several times larger than previously documented—
      demonstrating Claroty's core value proposition of asset discovery in classified environments. With 40+
      partners in its ecosystem and dedicated public sector general manager Jen Sovada leading government
      expansion, Claroty's channel reach substantially extends its direct sales capacity. The Carahsoft NASPO
      ValuePoint contract removes procurement friction that historically slowed government adoption.
    claimRefs:
