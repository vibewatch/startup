        - label: "Awareness"
          description: "Team82 vulnerability research, Gartner/Forrester MQ Leader designation, KLAS recognition drive inbound demand across healthcare, industrial, public sector, and commercial segments"
        - label: "Evaluation / PoC"
          description: "Competitive RFP (PANYNJ ran 265-question evaluation); typically 1–3 vendors in final proof-of-concept; passive asset discovery reveals undocumented device footprint"
        - label: "Initial Deployment"
          description: "CTD or xDome deployed at pilot site; integration with SIEM, NAC, CMDB, and EDR; IBM, Fortinet, Cisco, ServiceNow alliances extend value immediately"
