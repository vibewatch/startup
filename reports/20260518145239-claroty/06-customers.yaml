chapter:
  number: 6
  title: Customers
  summary: >
    Claroty has surpassed 1,000 customers globally—including 24 of the Fortune 100—with the platform deployed
    at 8,000+ sites across healthcare, industrial/OT, public sector, and commercial verticals. Named production
    deployments span Port Authority of New York and New Jersey, South Tees Hospitals NHS Foundation Trust, Yale
    New Haven Health System, Britvic, Coop Switzerland, Phlow Corp., a major European airport, and US military
    missile defense sites. Five consecutive years as KLAS Best in KLAS for Healthcare IoT Security (2021–2025),
    and Top Performer in 2026 with a 92.5/100 score from 35 unique healthcare evaluators, corroborate durable
    retention in the highest-compliance vertical. Channel expansion via Carahsoft (US public sector, NASPO
    ValuePoint, May 2026) and Mission IT (defense/intelligence ATOs, December 2025) opens new government
    acquisition pathways. NRR and churn remain undisclosed; G2 reviewers flag significant deployment complexity
    and fine-tuning requirements as potential expansion drags.

sections:
  - id: customer-base-vertical-mix
    title: Customer Base and Vertical Mix
    body: >
      Claroty serves over 1,000 customers globally—a milestone reached in 2023—with its Claroty xDome SaaS
      platform and on-premises Continuous Threat Detection (CTD) deployed at more than 8,000 sites worldwide.
      Twenty-four of the Fortune 100 are named customers, establishing Claroty as the dominant vendor in the
      largest-enterprise tier of the cyber-physical systems (CPS) protection market. Operations span North
      America, EMEA, and Asia-Pacific, supported by more than 700 employees in 27 countries. The company
      addresses four primary verticals: (1) Healthcare—led by Claroty xDome for Healthcare, covering IoMT,
      connected medical devices, and OT building management systems in hospital environments; (2) Industrial/OT—
      serving energy, oil and gas, utilities, manufacturing, food and beverage, and chemicals; (3) Public Sector
      —covering federal civilian, Department of War (DoW), intelligence community, SLED agencies, and critical
      infrastructure operators; and (4) Commercial/Retail—targeting retailers, logistics companies, warehousing,
      and data center operators. The vertical diversity limits concentration risk compared to OT-only vendors
      such as Dragos, though the healthcare vertical appears the deepest given the five-year KLAS recognition
      streak. Each vertical has a dedicated web presence, solution set, and partner ecosystem. Claroty's
      commercial page reports 40+ verticals supported, 450+ OT/IoT protocols covered, and 8,000+ sites
      protected—signaling broad protocol coverage as a competitive moat against narrower rivals.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU006
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-customer-proof-case-studies
    title: Named Customer Proof and Case Studies
    body: >
      Claroty publishes more than 40 named and anonymized case studies across verticals, with production
      deployments confirmed for eight publicly named customers examined in this chapter. The Port Authority of
      New York and New Jersey (PANYNJ)—one of the largest US transportation agencies managing major airports,
      bridges, tunnels, the World Trade Center complex, and a major bus terminal—deployed Claroty CTD and
      Enterprise Management Console (EMC) after an exhaustive 265-question technical evaluation in which only
      three vendors responded and none matched Claroty's depth of coverage. The initial implementation for
      hundreds of ICS composed of thousands of assets took approximately two years, with the bulk of the most
      critical systems onboarded within the first 8–10 months. South Tees Hospitals NHS Foundation Trust
      deployed all xDome modules across 6 facilities serving 1.5 million people in the UK, integrating with
      Fortinet FortiNAC for network access control and leveraging AWS cloud for scalability. Britvic
      (beverages, UK) deployed CTD hybrid with SRA, demonstrated compliance and OT visibility, then expanded
      to xDome with new sites in France and Brazil—an explicit land-and-expand pattern. Coop Switzerland
      (retail/wholesale) achieved 100% OT/ICS/IoT asset visibility across logistics, warehousing, and
      production sites, with network segmentation enforced and retail store rollout underway. In pharma,
      Phlow Corp.—a US pharmaceutical CDMO with Virginia-based cGMP facilities—deployed xDome for real-time
      monitoring, microsegmentation, and lab/manufacturing/warehouse visibility. A major European airport
      (50M+ passengers/year) deployed CTD, Secure Access, and EMC across cargo systems and building
      infrastructure, enabling managed third-party vendor access and full OT profiling. Yale New Haven Health
      System, Connecticut's largest healthcare provider, uses Claroty for enterprise-wide IoMT and IoT asset
      risk scoring with a Cisco ISE network segmentation project underway. The diversity of sectors and
      geographies in publicly named case studies, combined with multi-year production tenure, constitutes
      high-quality reference proof by industry standards.
