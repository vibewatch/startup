  - id: retention-expansion-signals
    title: Retention, Expansion, and Customer Satisfaction Signals
    body: >
      While Claroty does not publicly disclose its Net Revenue Retention (NRR) or gross churn rate—a gap
      that limits quantitative diligence—multiple qualitative signals point to high retention and meaningful
      expansion. The KLAS 2026 score of 92.5/100 from 35 evaluating organizations, the KLAS three-year
      "Consistent High Performers" inclusion, and multi-year KLAS Best in KLAS designations are proxy
      retention indicators for the healthcare segment. Expansion is documented in case studies: Britvic
      migrated from on-premises CTD to cloud xDome and extended the deployment to new manufacturing sites in
      France and Brazil; Coop Switzerland completed core logistics/warehousing deployments and is expanding
      Claroty to in-store retail locations. South Tees NHS deployed all xDome modules and added Fortinet
      integration, increasing platform depth and switching costs. The typical land-and-expand motion starts
      with a single-site CTD or xDome deployment for asset visibility, then expands to secure access, threat
      detection, exposure management, and network protection modules as customer confidence grows. The average
      of 8 sites per customer (8,000+ sites / 1,000+ customers) suggests meaningful multi-site adoption.
      The 24 Fortune 100 accounts represent high-value, difficult-to-churn relationships given the depth of
      OT network integration required. Missing evidence: no public disclosure of NRR, contract length, cohort
      retention, or specific ARR per cohort—all are standard private-company withholding. Investors and
      prospective acquirers should request these metrics in any due-diligence process.
    claimRefs:
      - CU003
      - CU014
      - CU015
      - CU022
      - CU023
      - CU034
      - CU035
      - CU042

  - id: customer-concentration-adverse-risk
    title: Customer Concentration, Adverse Evidence, and Deployment Risk
    body: >
      The primary customer risk is the opacity of NRR and churn data. Claroty's private status means formal
      retention metrics are unavailable, forcing reliance on proxy signals (KLAS, case study expansion, KLAS
      three-year rolling metric). G2 reviewers—albeit a small panel (4.7/5, 6 reviews as of October 2024)
      —flag meaningful deployment friction: "a significant amount of fine-tuning is required to deploy,"
      "software bugs, which can make incident handling cumbersome," "complexity of the initial setup might
      be challenging," and "needs an expert team to install." These signals suggest that time-to-value can be
      longer than marketed, that deployment requires skilled OT security personnel (a scarce resource), and
      that customers without in-house expertise may face higher total cost of ownership. Customer concentration
      is unknown at the revenue level: the 24 Fortune 100 accounts likely represent disproportionate ARR,
      and loss of even one large account could be material. Public-sector sales cycles are long and
      procurement-gated, making the Carahsoft and Mission IT partnerships necessary but not sufficient for
      rapid government revenue ramp. Healthcare vertical concentration, while validated, could become a
      liability if hospital M&A consolidates the customer base or if reimbursement pressures reduce
      cybersecurity spending. No public churn incidents, failed deployments, or major customer complaints
      have been identified in this research; however, the absence of adverse public evidence is partly
      explained by Claroty's non-disclosure norms and the sensitivity of OT customer incidents.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU043
      - CU044
    tableRefs:
      - TU005

