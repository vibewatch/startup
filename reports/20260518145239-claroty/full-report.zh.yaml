  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 影响
      - 需观察信号
    rows:
      - - 估值下调融资
        - 新融资低于 $2.5B
        - 打破溢价倍数逻辑，并意味着 2024-2026 价值被毁。
        - 融资传闻、老股交易或正式融资。
      - - ARR 停滞
        - 到 2026-2027，公开或私下数据仍接近 $100-120M ARR
        - 让 $3B+ 入场难以成立，并压缩 IPO 可选性。
        - 董事会材料、S-1 泄露或贷款方尽调材料。
      - - IPO 窗口关闭
        - 网络安全 IPO 市场到 2027 仍关闭
        - 拉长持有期，并抬高过桥融资风险。
        - 同业 IPO 日程、公开网络安全公司倍数趋势、宏观利率。
      - - 优先权悬顶
        - 分配瀑布显示，低于 ~$4B 退出时普通股获得价值有限
        - 即使企业价值看起来稳定，真实回报也会下降。
        - 股权结构表、清算优先权、债务契约。
      - - 竞争性重定价
        - 战略买家将 OT 退出锚定在接近 Nozomi 的水平
        - 降低 Claroty 战略退出上限。
        - 更多 OT 安全 M&A 交易定价和买方评论。
