  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              OT/CPS 安全市场给 Claroty 呈现的是分层竞争场。核心层是三家纯 CPS 安全厂商——Claroty、Dragos 和 Nozomi Networks——在工业控制系统和 OT
              环境的资产发现、威胁检测和漏洞管理上直接竞争。第二层是相邻平台玩家——Armis（IT/OT/IoT/医疗融合）、Tenable（暴露面管理）和 Palo Alto Networks（网络安全 +
              OT）——覆盖多个域，但 OT 协议深度通常更浅。第三层是细分和嵌入工业自动化的玩家——Cisco Industrial Threat Defense（网络原生）、Rockwell Automation 旗下
              Verve/SecureOT（制造商服务制造商）和 Radiflow（聚焦 MSSP/SIEM 集成）——服务特定买方细分或渠道动作。评估 CPS 安全平台的买方，还必须权衡维持现状的替代方案：由
              Accenture、Deloitte、EY 等咨询机构提供托管 OT 安全服务，或把 SIEM、IT XDR 工具扩展到 OT 资产的自建路径。随着 Gartner Magic Quadrant for CPS
              Protection Platforms 在 2024 年正式成形并纳入多家领导者，企业预算分配更具合法性，RFP 活动加速，整体竞争强度正在上升。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 纯 OT/ICS 安全领导者 — Dragos 与 Nozomi
        blocks:
          - type: paragraph
            body: >
              Dragos 是 Claroty 最具技术可信度的直接对手。Dragos 由前 NSA ICS 安全从业者创立，总部位于 Washington DC 都市区，声誉来自威胁情报：其 WorldView 情报源跟踪
              26 个工业威胁组织（2025 年有 11 个活跃），发布年度 OT Cybersecurity Year in Review 报告，并运营免费的 OT-CERT 资源项目和面向小型公用事业的 Community
              Defense Program。Gartner 在 March 2026 连续第二年将 Dragos 评为 CPS Protection Platforms Magic Quadrant 领导者。Dragos
              Platform 以被动资产可视化为核心，配套自有 “Now, Next, Never” 漏洞优先级模型；该模型称只有 3–6% 的 ICS 漏洞需要立即处理，并提供带上下文的响应剧本。Dragos 的 OT
              Watch 托管检测与响应服务把平台延伸为托管方案。相对 Claroty，Dragos 的主要弱点是资产覆盖更窄——它重心高度放在纯 ICS/OT 环境，无法匹配 Claroty 在 BAS、医疗设备和企业
              IoT 上的 XIoT 广度。Nozomi Networks 是纯 OT/ICS 层的另一根支柱。Nozomi 创立于 2013 年，源自瑞士，披露监控超过 115 million 台 OT、IoT 和 IT
              设备，覆盖全球 12,000 多个安装点，并声称客户留存率 100%。Nozomi 的差异化来自 AI 驱动分析、极深的伙伴生态（Schneider
              Electric、ABB、Siemens、Mandiant、GE、Honeywell、IBM Security、Hitachi），以及把有线和无线传感器结合起来的端点到网络可视化。Nozomi
              面向大规模关键基础设施，常获战略工业伙伴认证，可与其 OT 自动化产品一起交付安全能力，形成独特的联合销售渠道。相对 Claroty，Nozomi 的弱点是医疗设备和 BAS 覆盖较薄，在 CPS
              Protection Platforms 品类中的分析师认可历史上也不够激进。
