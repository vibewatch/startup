      - number: '7.5'
        title: 合作伙伴、渠道与集中度风险
        blocks:
          - type: paragraph
            body: >
              Claroty 的市场拓展模式高度依赖渠道中介、技术联盟，以及少数高价值分销关系。与直接销售型 SaaS 同行不同，销售组织中的 ARR
              集中度通常可见；渠道驱动收入的集中度更难从公开披露中识别，一旦关键伙伴关系变化，也可能迅速结晶为风险。


              最实质的渠道集中度风险，是 Claroty 与 Carahsoft Technology 的美国政府分销关系。Carahsoft 是 Claroty 的主要联邦及 SLED 分销伙伴，提供 GSA
              schedule 定价和邻近 DOD 的采购工具。Carahsoft 在美国公共部门市场拥有很强杠杆，同时有文件记录其与数十家网络安全供应商并行合作。如果出现合同争议、GSA schedule 审计，或
              Carahsoft 战略转向竞争性 OT 平台，Claroty 的政府垂直行业 ARR 可能在没有提前披露的情况下立刻出现不可预见的缺口。


              与 Rockwell Automation 的技术联盟集中度构成第二类渠道依赖。Rockwell 联合销售联盟把 Claroty 带进制造业账户，而 Rockwell 在这些账户里已有 PLC、SCADA
              和工业自动化关系。这是一个有价值但非排他的安排。如果 Rockwell 收购竞争性 OT 安全供应商，或者为其工业平台自研安全产品，合作伙伴投入会被重定向，共同销售伙伴也可能变成竞争渠道。


              在 APAC 和 EMEA，Claroty 依赖区域增值经销商和 MSSP
              开发市场。这些关系的具体经济条款——伙伴利润率、配额承诺义务、竞争排他条款——没有公开披露。区域分销商技术赋能投入不足，会让高增长市场的销售管线停滞；而巨头供应商提供更完整合作伙伴计划带来的竞争压力，也可能诱发伙伴流失。


              “市场风险”部分讨论的更广泛平台捆绑趋势，直接延伸到渠道：Cisco、Palo Alto 和通过 Armis 扩展 OT 能力的 ServiceNow，可以把这些能力推入规模大得多的合作伙伴生态，并向经销商和
              MSSP 提供更宽产品组合上的更高利润率。这会给渠道伙伴形成结构性激励压力，把 OT 安全交易来源从 Claroty 这类需要专门技术赋能投入的专业供应商，转向巨头供应商平台。
