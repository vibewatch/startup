      - number: '3.3'
        title: 相邻平台竞争者 — Armis、Tenable OT、Palo Alto Networks
        blocks:
          - type: paragraph
            body: >
              Armis 主要在 IoT、BAS 和医疗设备安全细分市场与 Claroty 竞争，也越来越多进入更广义的 CPS 暴露面管理。Armis Centrix™ 是一个无代理、云交付的网络暴露面管理平台，覆盖
              IT、OT、IoT 和医疗设备安全。Armis 点名客户高度多元——Colgate-Palmolive、United Airlines、Takeda
              Pharmaceuticals、Mondelēz、DocuSign——显示其在企业 IT 相邻场景渗透强，但 OT 深度和 ICS 协议覆盖浅于 Claroty 或 Dragos。Armis 更像
              CAASM（网络资产攻击面管理）厂商，而不是纯 OT 安全平台；这降低了它在能源和水务账户中的正面重叠，但在联网企业和医疗环境中构成真实竞争。Tenable 通过 Tenable One OT Exposure
              把漏洞管理领导地位带入 OT，用单一暴露面管理平台统一 IT 和 OT 资产清单。Tenable 的差异化元素包括 “Safe Active Query”（用原生协议对 OT 设备做非破坏性询问）、AI
              驱动的修复建议，以及业内领先的 Vulnerability Priority Rating（VPR）评分，用真实世界可利用性为 CVSS 打分提供上下文。Tenable 支持云、本地和混合部署，并自动映射
              NERC CIP、IEC 62443、NIST 和 PCI DSS 合规要求。但与 Dragos 和 Claroty 相比，Tenable 在 OT 专属威胁情报和响应剧本上更弱。Palo Alto
              Networks 通过 Industrial OT Security 产品线竞争，该产品使用基于 NGFW 的 OT 协议检查，在既有 Palo Alto
              网络基础设施中嵌入实时资产清单和风险管理。点名企业客户包括 BorgWarner 和 Grupo Bimbo。PANW 的关键竞争优势，是能把 OT 安全打包进既有 Palo Alto 企业安全支出；已经使用
              Palo Alto 的买方可以用边际增量成本激活 OT 安全，从而在 IT 安全栈成熟的中型市场和企业账户中形成强替代路径。
