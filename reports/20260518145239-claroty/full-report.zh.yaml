  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场、竞争与商业风险
        blocks:
          - type: paragraph
            body: >
              Claroty 最尖锐的近期商业风险，是 OT 安全市场正在快速围绕大型平台厂商整合。ServiceNow 于 2024 年 12 月以 $7.75 billion 收购 Armis，把 Claroty
              的主要竞争对手之一——一家在 CPS 和 OT 资产管理能力上高度重叠的平台——嵌入全球最大 ITSM 厂商体系内。Mitsubishi Electric 于 2025 年 9 月以约 $1 billion 收购
              Nozomi Networks，带来第二起整合事件，让一家大型工业自动化集团拥有了垂直整合的 OT 安全产品，可与既有工业关系中的 SCADA、DCS 和 ICS 硬件一起销售。这两笔交易已经实质改变了
              Claroty 执行 2027 年 IPO 逻辑时所处的竞争格局。


              结构性销售周期摩擦进一步放大竞争风险。OT 买方——工厂工程师、过程控制经理和运营副总裁——把生产连续运行置于安全态势之上。典型企业 OT 安全采购从初始筛选到合同签署需要 9–18 个月，这要求 Claroty
              维持大型交易管线，才能实现可预测的季度收入确认。这一动态会持续制造在险收入，并使 Claroty 的 ARR 增长对能源、制造和水务客户群中的宏观预算冻结敏感。


              Cisco、Palo Alto Networks，以及如今通过 Armis 切入的 ServiceNow 所带来的平台捆绑压力，正在挤压独立 OT 专家的大企业账户定位。随着这些厂商把原生 OT
              能力延伸进既有安全和 IT 管理产品组合，它们可以向 IT 和安全买方提出单一供应商简化论证；Claroty
              作为专注的同类最佳专家，即便保有技术深度优势，也难以在采购简便性上匹配。这一风险在医疗和政府账户中尤其高，因为供应商整合本就是明确的采购目标。


              估值背景还带来具体执行压力。据报道，Claroty 的 Series F 后估值约为 $3 billion，对应未披露 ARR 的倍数与高端 SaaS 估值一致，但进入 IPO 窗口前 18
              个月的增长减速容错空间有限。如果新交易胜率因竞争替代而恶化，或现有客户在续约时整合到大型平台厂商，IPO 可实现倍数可能显著压缩。
