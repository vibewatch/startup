  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑
        blocks:
          - type: paragraph
            body: >-
              从战略重要性看，Claroty 值得投资；但从证据完整性看，还不到位。乐观逻辑很直接：OT 及更广义的 CPS 安全品类仍在以双位数增长，Claroty 保持第三方分析师认可的领先地位，公司现在披露拥有超过
              1,000 家客户，其中包括 24 个 Fortune 100 账户。Golub Growth 领投 F
              轮也很重要，因为这更像是为公开市场进程做后期站位，而不是紧急救援轮。这些因素支持继续跟踪，也可以支撑相对增速更慢的成熟网络安全平台给出溢价。


              反向逻辑同样重要。Claroty 仍未公布当前 ARR、任何毛利率或留存数据，也没有披露 2026 年 1
              月融资对应的绝对估值。这意味着估值叙事依赖二级报道和推断。因此，本报告的建议是有条件的，而不是热情买入：公开证据支持监测，并且只有在严格入场纪律下才可能买入；不能把任何报道价格当成已经完全验证后照单支付。正确立场是继续研究，核实股权结构表和
              ARR 衔接表，只有当估值不透明度明显收窄后，才承销上行空间。
