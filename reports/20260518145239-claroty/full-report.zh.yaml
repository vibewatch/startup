      - number: '1.5'
        title: 里程碑、竞争背景与反向事件
        blocks:
          - type: paragraph
            body: >
              Claroty 的里程碑显示，公司从 2015 年 Team8 孵化器拆分出来，到 2026 年已快速扩张为后期、IPO 前的市场领导者。2021 年收购 Medigate
              是最关键的结构性动作：它几乎让员工规模翻倍，新增医疗 IoT 这一独立市场，也让 xDome SaaS 平台得以成形，成为公司云部署战略的锚点。2024 年扩展的 FOCUS
              伙伴计划纳入全球集成商和经销商生态；xCelerate 伙伴计划则进一步强化公司的渠道驱动型 GTM。

              2025 年，竞争格局发生实质变化。此前 Claroty 在纯 OT 安全领域最接近的同业 Nozomi Networks 于 2025 年 9 月同意以约 $1 billion 被 Mitsubishi
              Electric 收购。ServiceNow 于 2025 年 12 月宣布计划以 $7.75 billion 收购更广义的 IoT 安全平台 Armis。这些退出既验证了 CPS 安全品类，也减少了
              Claroty IPO 时可参考的独立上市可比公司——对估值是双刃剑。Claroty 管理层把整合描述成抢份额机会，尤其是面向那些不希望 OT 安全嵌入更大工业或企业级供应商的客户。

              公开资料能识别的反向与风险事项包括：（1）估值不透明——Claroty 从未公开确认估值；如果 March 2024 基准是 $2.5 billion，公司称估值上升 80% 与第三方 $3 billion
              估计在数学上不一致；（2）ARR 模糊——公司最后一次确认 ARR 超过 $100 million 是 2023 年，更新数字未公开披露；（3）IPO 依赖——IPO 叙事假设 2027
              年市场条件配合，但这一点无法保证；（4）CPO 职能的领导层过渡风险，Yoram Gronich 和 Gil Gur Arie 在 2026 年初同时持有 CPO
              头衔。单看每项都不足以否决投资，但每项都是后续章节必须追问的尽调问题。
