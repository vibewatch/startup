  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - IPO 执行失败
        - CEO 对 IPO 时间表的公开指引；董事会公告；SEC S-1 申报活动
        - 公开推迟 IPO，或保密 S-1 提交后撤回
        - 重估投资逻辑；重置资本回收时间表；评估老股流动性选项
      - - 被平台捆绑打法替代
        - 企业交易胜率数据；渠道伙伴 Claroty 签约额趋势；CRN 和 SecurityWeek 的客户赢单报道
        - 行业渠道数据显示，新企业交易胜率连续两个季度低于 50%
        - 下调收入增长假设；提高估值模型中竞争替代情景权重
      - - 客户现场产品安全事件
        - CISA ICS 公告或 CVE 将 Claroty 传感器或管理控制台列为活跃攻击载体
        - CISA 或主流安全媒体确认，在具名关键基础设施客户处，Claroty 平台组件遭主动利用
        - 暂停投资；就合同责任和监管披露义务聘请法律顾问；重做平台安全尽调
      - - 对以色列来源软件的监管限制
        - BIS EAR 规则制定更新；影响以色列技术出口的行政令；政府合同授予数据库变化
        - 美国政府采购清单移除 Claroty 平台，或 BIS 在政府 / 国防场景下拒发许可证
        - 下调政府分部 ARR 估计；重估可服务市场；取得律师对合规路径的意见
      - - 关键人物离职
        - CEO、联合创始人或 CRO 辞任公告；董事会构成变动但未披露继任安排
        - CEO 或两位联合创始人意外离职，且 30 天内未发布已确认继任计划
        - 将投资转入复核；要求召开董事会会议；重新评级前评估离职后的销售管线和客户留存数据
    claimRefs:
      - CR004
      - CR005
      - CR009
      - CR022
      - CR027
      - CR029
      - CR030
    notes: 否决标准是监控阈值，不是法律触发项。所有行动含义均需投资者法律顾问审查，并受基金治理要求约束。阈值定义应按单个投资者授权调整。
