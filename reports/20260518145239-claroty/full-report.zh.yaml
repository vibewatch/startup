      - number: '6.2'
        title: 具名客户证明与案例研究
        blocks:
          - type: paragraph
            body: >
              Claroty 发布了 40 多个具名和匿名案例研究，覆盖多个垂直行业；本章审视的公开具名客户中，有 8 家确认已进入生产部署。The Port Authority of New York and New
              Jersey（PANYNJ）——美国最大的交通机构之一，管理主要机场、桥梁、隧道、World Trade Center 综合体和一个大型巴士总站——在一次详尽的 265 问技术评估后部署了 Claroty CTD
              和 Enterprise Management Console（EMC）；当时只有三家厂商回应，且没有一家能匹配 Claroty 的覆盖深度。面向数百套
              ICS、包含数千资产的初始实施约耗时两年，其中最关键系统的大部分在前 8–10 个月内完成上线。South Tees Hospitals NHS Foundation Trust 在英国 6 家设施部署了全部
              xDome 模块，服务 1.5 million 人，并与 Fortinet FortiNAC 集成做网络访问控制，同时利用 AWS 云实现可扩展性。Britvic（英国饮料）先混合部署 CTD 和
              SRA，验证合规与 OT 可见性，然后扩展到 xDome，并在法国和巴西新增站点——这是明确的先落地再扩张模式。Coop Switzerland（零售 / 批发）在物流、仓储和生产站点实现 100%
              OT/ICS/IoT 资产可见性，已执行网络分段，并正在推进零售门店铺开。制药领域，Phlow Corp.——一家美国医药 CDMO，在 Virginia 拥有 cGMP 设施——部署 xDome
              做实时监测、微分段，以及实验室 / 制造 / 仓库可见性。一家欧洲大型机场（年客流 50M+）在货运系统和楼宇基础设施中部署 CTD、Secure Access 和 EMC，实现受管第三方供应商访问和完整 OT
              画像。Connecticut 最大医疗服务提供者 Yale New Haven Health System 使用 Claroty 进行全企业 IoMT 和 IoT 资产风险评分，并正在推进 Cisco ISE
              网络分段项目。公开具名案例研究中的行业与地理多样性，再叠加多年生产运行时间，按行业标准构成了高质量参考证明。
