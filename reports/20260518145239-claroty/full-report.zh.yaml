    approximationNotes: 依赖边为作者根据 Team82 产出和平台文档的公开描述推断。内部 R&D 流程细节未公开披露。
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
  - id: FE004
    title: 产品能力成熟度矩阵
    type: matrix
    layout: wide
    summary: 根据产品页面深度、分析师认可和专用功能证据，估算 Claroty 核心平台能力在四个垂直行业的成熟度。
    data:
      columns:
        - 工业 OT
        - 医疗（IoMT）
        - 商业 BMS
        - 公共部门
      rows:
        - label: 资产可视性
          values:
            - 高
            - 高
            - 中
            - 中
        - label: 漏洞管理
          values:
            - 高
            - 高
            - 中
            - 中
        - label: 威胁检测
          values:
            - 高
            - 高
            - 中
            - 中
        - label: 安全远程访问
          values:
            - 高
            - 中
            - 低
            - 中
        - label: 合规报告
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 集成广度
          values:
            - 高
            - 中
            - 低
            - 中
    approximationNotes: 成熟度评级（高 / 中 / 低）是分析师依据产品文档深度、垂直行业合作伙伴关系以及分析师认可度做出的推断， 不基于客户调研数据或独立技术基准。
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE028
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: |
      展示四个垂直行业的买家如何从认知推进到客户背书，并标出每个阶段的产品 / 渠道触点和扩张触发因素。
    data:
      items:
        - label: 认知
          description: Team82 漏洞研究、Gartner/Forrester MQ 领导者认定、KLAS 认可，在医疗、工业、公共部门和商业细分市场 带来主动找上门的需求
        - label: 评估 / PoC
          description: 竞争性 RFP（PANYNJ 做了 265 问评估）；最终 PoC 通常剩 1–3 家供应商；被动资产发现会暴露未建档的设备版图
        - label: 初始部署
          description: 在试点站点部署 CTD 或 xDome；接入 SIEM、NAC、CMDB、EDR；IBM、Fortinet、Cisco、ServiceNow 联盟立即放大价值
        - label: 模块扩展
          description: >-
            从可见性向 Secure Access、Exposure Management、Threat Detection 模块加购；South Tees NHS 增加所有 xDome 模块； Britvic 增加
            Secure Remote Access
        - label: 站点扩展
          description: 从落地站点扩到更多站点和地区：Britvic（法国和巴西）、Coop Switzerland（零售门店）、全球制造商（新业务单元）
        - label: 合规锚点
          description: 监管合规（HHS 405(d)、HIPAA、NERC-CIP、DSPT、CMMC、ICD 503）锁定多年续约；PANYNJ 和 South Tees NHS 将合规列为首要驱动因素
        - label: 客户背书 / 倡导
          description: KLAS 评估、公开案例、参加 Nexus Conference、Fortune 100 客户背书销售；连续 5 年获得 KLAS 认可，给医疗渠道形成复利动能
    approximationNotes: |
      阶段推进来自现有案例研究和新闻稿的泛化；单个客户旅程会随垂直行业和起点成熟度变化。节点到阶段的映射代表主导模式。
    claimRefs:
      - CU005
      - CU007
      - CU014
      - CU024
      - CU035
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: |
      基于 2023–2026 年里程碑，估算从全球可触达市场到活跃客户、多站点部署和 Fortune 100 渗透的转化漏斗。
    data:
      items:
        - label: 全球 ICS/OT/医疗可服务机构（估算）
          value: 50000
        - label: 评估过 Claroty 的机构（按竞争胜率数据估算）
          value: 3000
        - label: 活跃客户（按 2023 年里程碑为 1,000+）
          value: 1000
        - label: Fortune 100 客户
          value: 24
    approximationNotes: |
      全球可触达机构数和评估机构数只是用于提供背景的粗略估算；只有「活跃客户（1,000+）」和「Fortune 100 客户（24）」是公司披露数字。 评估机构数按企业 CPS 安全供应商常见竞争胜率推断。
    claimRefs:
      - CU001
      - CU002
      - CU003
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: |
      基于有来源的案例研究和独立验证，横向评估各垂直行业的证据质量、公开案例可得性、生产环境确认和扩张信号强度。
    data:
      columns:
        - 证据质量
        - 具名 / 公开案例
        - 生产环境确认
        - 扩张信号
      rows:
        - label: 医疗
          values:
            - 高（KLAS 5 年 + 35 名评估者）
            - 客户：South Tees NHS、Yale YNHHS、Ohio State
            - 是 — 已使用所有 xDome 模块
            - 强 — 多模块，KLAS 忠诚度
        - label: 工业 / OT
          values:
            - 中高（多个案例研究）
            - Britvic、Phlow、全球制造商（匿名）
            - 是 — CTD/xDome 多年部署
            - 强 — 新站点 / 地区扩张（法国、巴西）
        - label: 公共部门
          values:
            - 高（ATO，官方新闻稿）
            - PANYNJ、DoW 导弹防御站点、IC 机构
            - 是 — 已取得 ATO
            - 中 — Carahsoft 渠道新近启动；管线开始成形
        - label: 商业 / 零售
          values:
            - 中（案例研究有限）
            - Coop Switzerland、欧洲机场（匿名）
            - 是 — 核心站点
            - 中 — 零售门店铺开计划已定，但尚未完成
    claimRefs:
      - CU007
      - CU010
      - CU015
      - CU016
      - CU019
      - CU024
      - CU026
  - id: FU004
    title: 留存 / 续约队列
    type: cohort
    layout: standard
    summary: |
      在正式 NRR 和流失数据未公开的情况下，用 KLAS 满意度分数作为代理，估算 Claroty 医疗垂直的留存队列。
    data:
      columns:
        - 第 1 年
        - 第 2 年
        - 第 3 年+
      rows:
        - label: 保守留存估算（%）
          values:
            - 88
            - 84
            - 80
        - label: 乐观留存估算（%）
          values:
            - 90
            - 87
            - 85
    approximationNotes: >
      留存百分比按 KLAS 平均满意度 92.5/100、连续三年入选「Consistent High Performers」以及案例研究中的扩张模式（Britvic、South Tees）推算。
      上排代表保守估算；下排代表乐观估算，反映 KLAS 忠诚度指标。正式 NRR/GRR 数据未公开；这些数字仅用于情景规划近似。
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU034
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    description: 按可能性（纵轴）和业务影响（横轴）映射 Claroty 的重大风险。每个单元格包含该严重度—可能性交叉点的主要风险标签。 单元格代表每个位置最紧迫的风险；多个风险可能落在同一单元格。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 监管合规负担（CIRCIA）
            - OT 销售周期阻力
            - 竞争替代（捆绑）
            - 产品零日漏洞遭利用
        - label: 中等可能性
          values:
            - 云依赖宕机
            - 关键人员离职（CRO / CSO）
            - IPO 窗口关闭
            - 大客户勒索软件事件
        - label: 低可能性
          values:
            - 出口管制限制（BIS/EAR）
            - 研发受以色列地缘政治扰动
            - 认证绕过复发
            - 重大伙伴终止合作（Carahsoft）
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR013
      - CR016
      - CR022
      - CR025
      - CR027
    notes: 可能性和影响分配是作者截至 2026 年 5 月基于公开信息作出的判断。热力图单元格并不穷尽所有风险； 每个位置展示最具代表性的风险。
  - id: FR002
    title: 风险传导图
    type: dag
    description: 有向图显示 Claroty 主要风险如何传导到商业和财务结果。节点代表风险来源或影响域；边代表因果传导路径。
    data:
      nodes:
        - label: OT 销售周期阻力
        - label: 竞争替代
        - label: 监管负担
        - label: 产品漏洞
        - label: 以色列地缘政治风险
        - label: 渠道伙伴流失
        - label: IPO 市场失效
        - label: 收入不及预期
        - label: 利润率压缩
        - label: 投资者信心下滑
      edges:
        - from: OT Sales Cycle Friction
          to: Revenue Shortfall
        - from: Competitive Displacement
          to: Revenue Shortfall
        - from: Regulatory Burden
          to: OT Sales Cycle Friction
        - from: Product Vulnerability
          to: Revenue Shortfall
        - from: Product Vulnerability
          to: Investor Confidence Drop
        - from: Israeli Geopolitical Risk
          to: Channel Partner Loss
        - from: Channel Partner Loss
          to: Revenue Shortfall
        - from: Revenue Shortfall
          to: Margin Compression
        - from: Margin Compression
          to: IPO Market Failure
        - from: IPO Market Failure
          to: Investor Confidence Drop
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR013
      - CR021
      - CR024
      - CR029
      - CR034
    notes: 图中的边代表基于研究发现的合理因果传导路径；不展示边强度（概率）。该图用于说明，并不穷尽所有情况。
  - id: FR003
    title: 依赖关系图
    type: dag
    description: 有向图显示 Claroty 的关键外部依赖。边从外部依赖指向依赖它的实体或职能。Claroty 向外的边代表合规依赖。
    data:
      nodes:
        - label: Claroty 平台
        - label: Golub Growth（融资）
        - label: Carahsoft（美国政府渠道）
        - label: Rockwell Automation（联盟）
        - label: AWS / Azure（云基础设施）
        - label: CISA（监管锚点）
        - label: ISA/IEC 62443 标准组织
        - label: Team82（以色列研发）
      edges:
        - from: Golub Growth (Financing)
          to: Claroty Platform
        - from: Carahsoft (US Gov Channel)
          to: Claroty Platform
        - from: Rockwell Automation (Alliance)
          to: Claroty Platform
        - from: AWS / Azure (Cloud Infra)
          to: Claroty Platform
        - from: CISA (Regulatory Anchor)
          to: Claroty Platform
        - from: ISA/IEC 62443 Standards Body
          to: CISA (Regulatory Anchor)
        - from: Team82 (Israel R&D)
          to: Claroty Platform
        - from: Claroty Platform
          to: CISA (Regulatory Anchor)
    claimRefs:
      - CR023
      - CR025
      - CR034
      - CR035
      - CR036
      - CR041
    notes: 依赖关系图反映截至 2026 年 5 月公开可见的伙伴、监管和组织关系。边的方向遵循「depends-on」关系： A→B 表示 A 是 B 依赖的对象，但 Claroty→CISA 这条边代表合规 / 报告义务。
  - id: FV001
    title: 建议逻辑
    type: flow
    description: 决策流把市场顺风、竞争证据、收入轨迹、估值进入点和 IPO 路径连到最终建议。
    data:
      nodes:
        - id: market_tailwind
          label: OT 市场顺风
          type: driver
        - id: competitive_position
          label: 分析师认可的产品位置
          type: driver
        - id: arr_trajectory
          label: ARR 轨迹大多陈旧
          type: constraint
        - id: valuation_entry
          label: 据报 ~$3B 入场
          type: decision
        - id: ipo_path
          label: 2027 年 IPO 路径仍可能
          type: driver
        - id: recommendation
          label: 有条件 / 继续研究
          type: outcome
      edges:
        - from: market_tailwind
          to: competitive_position
          label: 支撑溢价定位
        - from: competitive_position
          to: valuation_entry
          label: 只有拿出证据才能支撑溢价
        - from: arr_trajectory
          to: valuation_entry
          label: 限制信心
        - from: valuation_entry
          to: ipo_path
          label: 需要 IPO 或战略方支撑
        - from: ipo_path
          to: recommendation
          label: 保留上行空间
        - from: arr_trajectory
          to: recommendation
          label: 倒逼投资纪律
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV037
      - CV041
    notes: 流程强调：建议质量取决于证据质量，不只取决于公司质量。
  - id: FV002
    title: 估值敏感性
    type: bar
    description: 以 $120 million ARR 工作基准测算关键估值锚点对应的隐含 ARR 倍数。
    data:
      items:
        - label: $2.5B 时（基础先验）
          value: 21
          annotation: Approx. 20.8x on $120M ARR
        - label: $3.0B 时（据报）
          value: 25
          annotation: Approx. 25.0x on $120M ARR
        - label: $4.5B 时（80% 计算）
          value: 38
          annotation: Approx. 37.5x on $120M ARR
        - label: $5.0B 时（IPO 目标）
          value: 42
          annotation: Approx. 41.7x on $120M ARR
        - label: $7.75B 时（Armis 退出）
          value: 65
          annotation: Approx. 64.6x on $120M ARR
    claimRefs:
      - CV017
      - CV018
      - CV024
      - CV042
    notes: 敏感性测算采用公开证据下 $120 million ARR 的工作情景，而不是公司确认的 2026 年 ARR。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    description: 以 $3 billion 估值入场的投资人，在熊市、基准和牛市退出结果下的总回报区间。
    data:
      items:
        - label: 熊市（$2-3B 收购退出）
          low: -20
          base: -10
          high: 0
          annotation: Preference stack could make realized equity returns even worse.
        - label: 基准（$4-5B IPO）
          low: 20
          base: 45
          high: 65
          annotation: Assumes valuation appreciation without severe preference leakage.
        - label: 牛市（$6-8B 收购退出）
          low: 70
          base: 120
          high: 180
          annotation: Requires premium growth and strategic scarcity value.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV043
    notes: 回报为总额，未扣除稀释、清算优先权漏损或退出所需时间。
  - id: FV004
    title: 投资 KPI
    type: kpi
    description: IC 风格快照，覆盖资本、规模、市场背景和估值锚点。
    data:
      items:
        - label: 累计融资总额
          value: $885-900M
          annotation: Press releases and independent funding coverage
        - label: Series F 估值（据报）
          value: ~$3.0B
          annotation: Third-party reported; not company confirmed
        - label: ARR（最近确认）
          value: '>$100M'
          annotation: Company-confirmed milestone for 2023
        - label: ARR 倍数（隐含）
          value: ~25x
          annotation: Using $3B / $120M working ARR
        - label: Tenable FY2025 收入
          value: $999.4M
          annotation: Public comp is roughly 8x larger on revenue scale
        - label: IPO 目标年份
          value: '2027'
          annotation: CEO commentary reported by Reuters and CRN
        - label: 到 2030 年 OT 市场 CAGR
          value: 16.5%
          annotation: MarketsandMarkets category growth assumption
    claimRefs:
      - CV007
      - CV011
      - CV016
      - CV028
      - CV044
    notes: KPI 网格混合了一手和二手证据，应把它当作决策快照，而不是完全验证过的经营仪表盘。
