      - number: '5.5'
        title: 关键优势与差异化
        blocks:
          - type: paragraph
            body: >-
              Claroty 最核心的技术差异化在于协议深度、研究投入和平台广度。450+ 协议库——历时十年构建，并通过 Team82 的逆向工程持续扩展——是分析师和客户评估中最稳定被提及的护城河。截至 2026 年 3
              月，Gartner Peer Insights 的 CPS Protection Platforms 市场评分为 4.9/5，基于 119 条评分，且「愿意推荐」比例为 97%，反映实施满意度强。公司被评为
              2026 Gartner Magic Quadrant for CPS Protection platforms 的领导者（连续第二年），并成为 2026 Gartner Market Guide for CPS
              Secure Remote Access 的代表性厂商。Forrester Wave for IoT Security Solutions Q3 2025 同样将 Claroty 置于领导者区间。


              CPS Library 和 AI 驱动的资产识别流水线，是近期最具差异化的产品投入。Claroty 将 LLM-RAG 和统计推断建模嵌入平台，把碎片化 OT
              协议广播规模化转成确定性、经厂商验证的设备身份——这解决了过去每个站点往往需要数周人工核对的问题。平台覆盖四大 CPS
              垂直行业（工业、医疗、商业、公共部门），并提供垂直专属合规映射和合作伙伴集成，这也让点状方案厂商很难快速复制。Team82 的开源工具链和协调披露纪律进一步强化了平台检测能力的技术可信度。
            claimRefs:
              - CE027
              - CE028
              - CE029
              - CE030
      - number: '5.6'
        title: 技术风险与限制
        blocks:
          - type: paragraph
            body: >-
              有几类技术风险需要重点审视。第一，SRA 认证绕过 CVE（据 Dark Reading 报道，2025 年 10 月修补）显示，平台最关键的访问控制组件曾存在高严重性漏洞。虽然已修补，但 SRA 作为进入 OT
              网络的网关，意味着任何未来 SRA 漏洞都可能成为高度诱人的攻击向量；SRA
              的持续安全保证流程是关键尽调项。第二，被动优先的发现理念虽然在运营上安全，却意味着不在受监测网段广播的资产、气隙隔离设备以及仅固件可见的设备，如果没有补充 Safe Queries 或 Edge
              部署，可能仍然不可见。管理异构、多站点环境的客户经常会发现，要做到完整资产清单，必须组合全部四种发现方法，从而增加部署复杂度。


              第三，平台 SaaS（xDome）模式需要云连接，一些有严格数据驻留要求的 OT 环境无法接受；本地 CTD 填补了这一缺口，但 TCO 更高。第四，Claroty 的 CPS Library AI
              准确性高度依赖 OEM 合作覆盖——Rockwell/Schneider/Siemens-Healthineers
              联盟之外厂商的设备，在新增合作伙伴接入前，属性解析质量可能较低。第五，集成目录（SIEM、SOAR、EDR、NAC、漏洞管理）覆盖面广且技术上成立，但需要专门实施投入；没有成熟 IT
              安全运营团队的客户，可能会觉得集成面不是增益，而是负担。最后，Claroty 在 GitHub 上有 145 名关注者，工具参与度也偏小众；与 IT
              原生安全厂商相比，更广泛的开发者社区较小，限制了可加速功能路线验证的众包反馈循环。
            claimRefs:
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
