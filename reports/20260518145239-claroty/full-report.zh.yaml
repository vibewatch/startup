            body: >-
              2025 年 11 月推出的 CPS Library 直指一个系统性 OT 安全失效：88% 的 CPS 设备不传输精确产品代码，76% 传输的名称与厂商记录不同。LLM-RAG + OEM
              合作伙伴方法在技术上成立；如果覆盖范围扩展到 Rockwell/ Schneider/Siemens 之外，它可能成为持久的平台优势，并推动更快实现价值。
