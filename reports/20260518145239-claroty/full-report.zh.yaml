      - number: '1.4'
        title: 规模、牵引力与市场认可
        blocks:
          - type: paragraph
            body: >
              截至 January 2026，Claroty 披露全球客户超过 1,000 家，部署在数千个站点，其中包括 24 家 Fortune 100 公司；这一数字高于 March 2024 新闻稿提到的 20 家
              Fortune 100 客户，也延续了当时披露的自 2020 年以来客户增长 300%。10 周年新闻稿（June 2025）点名的客户包括 General Motors、BHP、Noble
              Energy、Britvic、Yale New Haven Health System、Boar's Head、South Tees Hospitals NHS Foundation Trust、BW
              Offshore、Port Authority of New York and New Jersey 和 Haleon。公司在 27 个国家拥有超过 700 名员工。March 2024 新闻稿称，2023 年
              ARR 超过 $100 million；当前 ARR 未公开确认。

              Team82 是 Claroty 内部威胁情报与漏洞研究团队。按 Series F 公告，截至 January 2026，Team82 已披露 650 多个 CPS
              漏洞。该团队是声誉资产，用自有威胁情报拉开平台差异，并推动企业决策和监管互动。

              第三方分析师和行业认可持续且更新。Gartner 在 2025 年（首版）和 2026 年（连续第二年）的 CPS Protection Platforms Magic Quadrant 中均将 Claroty
              评为领导者；2025 年报告中，Claroty 在执行能力上排名最高，在愿景完整性上位置最靠前。KLAS Research 连续五年（2021–2025）授予 Claroty Healthcare IoT
              Security 领域 Best in KLAS，评分 95.4/100。Forrester 在 The Forrester Wave: IoT Security Solutions, Q3 2025 中将
              Claroty 评为领导者。Forbes 在 2026 年连续第四年将 Claroty 纳入 Cloud 100。Deloitte 也连续三年把公司列入 Technology Fast 500。
