      - number: '7.2'
        title: 产品、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              Claroty 平台在关键基础设施 OT 环境中占据特权网络可见性位置。这个位置既是其竞争价值来源，也是主要产品安全责任：Claroty 传感器、管理服务器或云连接器中的任何漏洞，如果允许横向移动进入底层 OT
              网络，都将严重破坏客户信任，并引发尖锐监管事件。


              迄今最重要的已披露产品安全事件，是 Claroty Continuous Threat Detection 产品中的认证绕过漏洞。如果该漏洞在修补前被利用，将允许未认证的管理员访问客户 OT
              网络可见性数据。Claroty 通过负责任披露流程处理了该问题，但该事件说明任何 OT 安全平台都面临同一类风险：被设计来保护 OT 网络的产品，本身也必须能顶住它要检测的攻击者。


              Team82 的主动漏洞研究带来第二层风险面。该研究部门是有意义的品牌差异化，但其定期发布第三方 ICS 漏洞披露，也会吸引监控 CVE 发布、寻找老旧 OT 环境可利用窗口的国家级和犯罪攻击者。CISA
              Known Exploited Vulnerabilities 目录截至 2026 年 5 月列出 1,592 个正被主动利用的漏洞，说明已披露漏洞与客户修复能力之间的缺口被多么持续地利用。若 Claroty
              自有平台中广泛部署的组件出现零日漏洞，将考验负责任披露周期究竟是在保护客户，还是无意中扩大攻击面。


              存量旧环境部署复杂度，是被低估的运营风险。许多老旧 ICS 环境使用无法打补丁的过时操作系统，缺少加密或认证协议，并且需要数周专业服务投入，Claroty
              传感器才能可靠部署。复杂存量环境中的失败——例如传感器不兼容、误报告警风暴或局部覆盖缺口——会拉长销售周期、延迟 ARR 确认；如果部署失败发生在随后遭遇 OT
              安全事件的客户身上，还会带来声誉风险。Claroty 没有公开披露部署成功率、价值实现时间 SLA，或需要升级专业服务参与的部署占比。
