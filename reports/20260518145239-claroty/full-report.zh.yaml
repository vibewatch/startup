      - number: '2.3'
        title: 垂直行业 — 各行业的威胁暴露与监管压力
        blocks:
          - type: paragraph
            body: >
              能源和公用事业是最成熟、监管最重的 OT 安全细分市场。NERC CIP 标准要求北美大电力系统（BES）资产具备网络安全保护，形成由合规驱动的预算底线。国家级威胁行为体——包括 Latvia SAB 标记并由
              CISA 公告记录的俄罗斯 APT 组织——主动瞄准电网基础设施，把合规支出转化为真正的安全投资。MarketsandMarkets 用专门的 ICS Security in Energy and Power
              报告覆盖该行业，说明分析师认可其行业特定市场动态。

              制造业面对另一种威胁画像，核心是勒索软件：运营中断、供应链勒索和保险要求是主要采用触发点。OT 环境一旦连接 ERP 系统和云分析，Purdue 网络分段模型就越来越不够用。

              医疗 OT 是增长最快的受监管细分市场。HHS 已发布与 HIPAA 对齐的网络安全指南，要求受监管实体处理医疗设备和临床网络安全。FDA 医疗设备安全指南进一步强化合规驱动；输液泵或 MRI
              控制器被攻陷会牵动患者安全，也抬高了组织付费意愿。

              水务和污水运营方单体预算更小，但也面对 WaterISAC（Water Information Sharing and Analysis Center）和 EPA 指南记录的活跃威胁。交通行业，包括海事与铁路
              OT，受 TSA 网络安全指令约束：U.S. Coast Guard 要求到 January 2026，所有 IT/OT 人员必须接受网络安全培训。
