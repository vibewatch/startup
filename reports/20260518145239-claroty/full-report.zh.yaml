      - number: '7.3'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >
              Claroty 的核心垂直行业——能源、制造、医疗和政府——都在面对不断演进的 OT 网络安全监管要求。这些要求一边拉动需求，一边增加合规成本。监管环境同时有顺风和逆风：强制要求会刺激 OT
              安全投入，但合规负担也会分流客户预算，并把认证摩擦带进 Claroty 的销售周期。


              近期最重要的监管变化是 CIRCIA。2022 年《关键基础设施网络事件报告法》（CIRCIA）要求受覆盖的关键基础设施实体在 72 小时内报告事件，并在 24 小时内报告勒索软件付款。截至 2026 年 5
              月，CISA 的拟议规则仍待最终发布；覆盖实体范围、具体报告门槛，以及报告接口的技术要求仍在 NPRM 审查中。最终规则预计会把覆盖范围扩大到法定最低线之外，可能要求 Claroty
              的客户自建或采购报告自动化能力。如果 Claroty 把 CIRCIA 合规报告嵌入平台，规则会利好它；如果动作不够快，客户安全预算也可能转向单点报告工具。


              NERC CIP 标准为 Claroty 的能源行业业务提供了监管需求底座。当前执行的 CIP v5/v6 标准要求 BES Cyber System 资产清单、网络分段和补丁管理控制，这些要求能直接落到
              Claroty 的平台能力上。升级到 CIP v7 后，客户可能需要针对更严格的资产可视性和事件检测要求重新证明合规——这会打开一轮替换评估周期，Claroty 的竞争对手也能借机挑战既有供应商。


              在欧洲，NIS2 指令于 2024 年 10 月生效，把供应链风险管理提升为关键实体董事会层面的义务。这给 Claroty 带来不对称格局：作为 OT 安全供应商，它受益于 NIS2
              带动的客户采购；但作为受监管运营商环境中的供应链组件，它自身也会接受 NIS2 审视。欧盟客户可能要求 Claroty 提供自身安全实践符合 NIS2 的证据，这会给欧洲市场扩张再加一层认证和合规成本。


              法律层面，BIS 主管的《出口管理条例》（EAR）构成一个潜在但可能重大的风险点，原因是 Claroty
              注册地在以色列，且关键基础设施防护网络安全软件具备双用途属性。虽然公开信息中没有披露执法行动，但以色列来源、政府市场重点、以及情报级 OT 漏洞研究叠加在一起，足以支持持续接受 BIS 法律顾问审查。
