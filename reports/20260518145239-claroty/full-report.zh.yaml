  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 对 OT 安全支出的影响
      - 尽调要点
    rows:
      - - 针对关键基础设施的国家级攻击和勒索软件攻击
        - 驱动因素
        - 立即 / 持续
        - 提升高管层紧迫感；预算从被动响应转向主动防护
        - 跟踪 CISA ICS 通告频率和分行业事件率
      - - NERC CIP / NIS2 / TSA / FDA 强制要求扩展 OT 安全要求
        - 驱动因素
        - 2024–2027 年推进
        - 在公用事业、交通、医疗健康形成合规驱动的预算底线
        - 监测监管是否扩展到新兴 XIoT 和 BMS 领域
      - - IT/OT 融合和 IIoT 部署扩大攻击面
        - 驱动因素
        - 持续多年
        - IT-OT 边界消融，TAM 扩大；平台粘性上升
        - 评估 Claroty 客户群中的 IIoT / 工业 4.0 采用率
      - - 缺少加密或认证的老旧 ICS 系统
        - 约束（切换成本）
        - 存量场景多年迁移
        - 部署放慢；被动监测优先打法增加专业服务成本
        - 评估已安装基数中使用老旧协议（Modbus、DNP3、旧版 OPC）的比例
      - - OT 网络安全技能短缺（SANS 2026 称 60% 组织缺技能）
        - 约束
        - 结构性，2026 年以后
        - 托管 OT SOC 需求上升；自运营平台采用放慢
        - 跟踪 Claroty 收入结构中托管 OT SOC 相对平台 ARR 的增长
      - - IT 与 OT 安全项目争夺预算
        - 约束
        - 持续
        - 相比 IT，OT 安全常常投入不足；CISO 需要为独立 OT 投资做论证
        - 从行业调研中寻找分细分市场 OT 预算分配数据
      - - 采购和部署周期长（关键基础设施为 12–36 个月）
        - 约束
        - 单笔交易
        - 限制先落地再扩张速度；需要非扰动、被动优先的 POC
        - 跟踪平均销售周期、价值实现时间指标，并与 Claroty 指引对照
    notes: 时间与影响是基于监管文件、行业调查（SANS 2026）和新闻报道的定性判断。每个因素的量化预算影响没有独立可得数据。
