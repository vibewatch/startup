      - number: '2.2'
        title: 市场规模 — 多重口径与明确限制
        blocks:
          - type: paragraph
            body: >
              第三方分析师对 OT/ICS/CPS 安全市场的预测差异很大，核心原因是范围定义不同。MarketsandMarkets（April 2025 报告）估计，全球 OT 安全市场 2025 年约 $25
              billion，到 2030 年增长至 $50.29 billion，CAGR 为 16.5%。该口径覆盖 OT 环境中所有垂直行业的网络安全、资产发现、漏洞管理、IAM、数据安全和托管服务。美国子市场 2025
              年为 $4.64 billion，2030 年增至 $9.37 billion（CAGR 15.1%）；欧洲为 $5.70 billion，增至 $11.93 billion（CAGR 15.9%）。

              SNS Insider（经新闻聚合源引用）把 ICS 安全市场放在 2033 年 $41.82 billion，意味着产品范围比 OT 安全大伞更窄，但仍是双位数 CAGR。Precedence Research
              用更宽定义预测 “OT 安全” 到 2034 年达到 $122.22 billion，该口径很可能把 OT 环境中的相邻网络和云安全支出也算入。分析师并不一致地纳入或排除托管检测与响应、IT/OT
              融合平台或政府部门支出，因此直接比较并不可靠。

              自下而上构建 Claroty 的 SAM，应先从全球 TAM 收窄到：（1）CPS 平台已有实质渗透的行业——能源、制造、医疗、水务、交通；（2）Claroty
              具备监管触达和渠道触达的地区；（3）规模足以支撑平台采购的组织。作者估算的 SAM 到 2030 年约 $10–15 billion，SOM 约 $3–5 billion，取决于竞争份额和 XIoT
              平台扩张。这些估算置信度低，应结合 Claroty 的 ARR 轨迹和垂直行业赢单数据验证。
