    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 权重
    rows:
      - - 乐观情景
        - Claroty 是已具规模的 CPS 领导者，有分析师背书、>1,000 客户，以及为 IPO 路径铺路的后期投资方。
        - 规模说法属实，但仍没有告诉投资者当前 ARR、NRR 或烧钱速度。
        - 高
      - - 悲观情景
        - 行业整合验证了品类，也让 Claroty 成为少数仍独立的主要资产。
        - Nozomi 的结局说明，纯 OT 公司退出价可能只在 $1B 附近，远低于 Claroty 的报道估值。
        - 高
      - - 基准情景
        - 若 ARR 已显著超过 2023 里程碑，且 IPO 市场重开，$4-5B 退出有可能成立。
        - 若 ARR 只略高于 $100M 且优先权较重，$3B 入场价已经很吃力。
        - 高
      - - 上行催化
        - 经核实的 2026 ARR、利润率和 NRR 披露，可能支撑保住溢价倍数并推动 2027 IPO。
        - 没有披露，溢价倍数只能停留在叙事，算不上可承销的证据。
        - 中
      - - 下行触发
        - 即便战略买家稀缺，Claroty 的多垂直覆盖和公共部门可选性仍可能抵消部分压力。
        - 估值下调轮、ARR 停滞或 IPO 窗口延后，可能很快压缩价值。
        - 高
