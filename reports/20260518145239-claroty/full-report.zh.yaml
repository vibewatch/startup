companyProfile:
  summary: >
    Claroty 是一家总部位于纽约市的网络物理系统（CPS）安全公司，2015 年诞生于 Team8 网络安全孵化器。平台覆盖资产发现与可视化、暴露面与漏洞管理、网络防护、威胁检测、安全远程访问，以及面向医疗场景的 xDome
    工作流，服务工业、医疗、商业和公共部门环境。到 2026 年初，Claroty 披露客户超过 1,000 家，其中包括 24 家 Fortune 100 公司；2023 年 ARR 超过 $100 million；January
    2026 完成由 Golub Growth 领投的 $150 million Series F，此前还在 2024 年完成 $100 million 增长轮。运营层面看，公司已经具备 2027 IPO
    或战略退出的条件，但作为私营公司，它对当前 ARR、利润率、留存、烧钱速度和优先股堆叠仍披露有限。
