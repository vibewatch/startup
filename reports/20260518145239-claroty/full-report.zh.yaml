      - number: '5.4'
        title: 集成生态与技术联盟
        blocks:
          - type: paragraph
            body: >-
              Claroty 的集成策略遵循「CTAP」（Claroty Technology Alliance Program）认证框架。集成类别覆盖：SIEM/SYSLOG 导出（IBM QRadar、Microsoft
              Sentinel、Splunk、ArcSight）、SOAR/工单（ServiceNow、PagerDuty、Jira）、防火墙和 NAC（Palo Alto
              Networks、Fortinet、Cisco、Claroty 分段策略）、终端 / EDR（CrowdStrike Falcon、Microsoft Defender for Endpoint——用于 OT
              资产增强）、漏洞管理（Tenable、Rapid7）以及 OEM 级设备增强（Rockwell Automation AssetCentre、Schneider Electric、Siemens
              Healthineers）。xDome 平台内置 EDR、云和 SNMP 集成的应用内编排，并可在同一个用于可见性评分的建议页面配置。


              Rockwell Automation 集成是旗舰案例：Rockwell 客户可以在 Rockwell 的 FactoryTalk AssetCentre 中获得 Claroty 的漏洞和威胁情报增强，让 OT
              团队无需切换控制台就能执行安全建议。Schneider Electric 在 CPS Library 发布时贡献了设备数据。Siemens Healthineers 与医疗 xDome 的合作，为 xDome
              用户提供厂商整理的 MDS2、SBOM 和 VEX 修复指引。Claroty 将这些关系归类为 CTAP 认证，并注明集成「由 Claroty 或合作伙伴构建并支持」，从而明确支持归属。


              在发现和数据采集侧，xDome 集成医疗场景中的 CMMS 系统、用于用户身份归因的 Active Directory/LDAP，以及通过 EDR 集成（CrowdStrike Falcon、Microsoft
              Defender）接入的终端代理，用进程级语境增强 OT 资产画像。CPS Library 的 MCP Server 让生成式 AI 工具（客户自选的大语言模型）可以用自然语言接口查询 CPS 安全数据，使
              Claroty 在企业 AI 工作流集成上领先于多数 OT 同业。Claroty xDome 平台还与 Cisco 工业交换机和防火墙集成，用于主动网络流量可见性和策略执行点。
