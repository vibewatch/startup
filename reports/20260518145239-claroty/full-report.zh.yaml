chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              Claroty 自称是保护网络物理系统（CPS）的公司，使命是守住支撑社会关键运转的技术，从而保护任务关键型基础设施。公司平台有四个主要方案支柱：暴露面管理、网络防护、安全访问和威胁检测；交付形态既可以是云端
              SaaS（Claroty xDome），也可以是本地部署（Claroty Continuous Threat Detection，CTD）。两种部署都由 Claroty CPS Library 支撑。这套 AI
              驱动的资产目录与 Series F 同步推出，能够细粒度呈现 CPS 资产，并定位漏洞归属。

              公司瞄准四个垂直行业：工业（制造、油气、公用事业）、医疗（联网医疗设备）、商业楼宇和公共部门（关键基础设施与国防）。统一平台路线并非偶然。Claroty 认为，碎片化单点工具无法解决 IT 与 OT
              团队之间的归属缺口、网络物理安全人才短缺，也无法补上成熟度模型缺失。它用一个平台把 OT、IoT 和医疗 IoT 安全收拢到一起，把自己定位成市场整合者；Nozomi Networks（2025 年以约 $1
              billion 被 Mitsubishi Electric 收购）和 Armis（2025 年以 $7.75 billion 被 ServiceNow 收购）等同业已通过战略出售退出。截至 2026
              年初，Claroty 表示更倾向于独立 IPO，而不是战略出售。

              公司孵化于 Team8。Team8 是以色列网络安全孵化器，产出过多家企业级网络安全公司。Claroty 于 2015 年正式成立，总部位于纽约市；截至 2025 年中，员工超过 700
              人，分布在北美、欧洲、中东、非洲和亚太的 27 个国家。
