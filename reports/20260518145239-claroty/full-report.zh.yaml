      - number: '8.4'
        title: 可比估值锚点
        blocks:
          - type: paragraph
            body: >-
              可比公司集合有参考价值，但并不完美。Armis 是最清晰的上行锚点，因为 ServiceNow 宣布以 $7.75 billion
              收购它，显示战略买家愿意为广义数字与物理风险平台支付的价格。不过，这不是干净的一对一可比，因为 Armis 的覆盖范围比 Claroty 更宽，横跨 IT、OT、IoT 和云。Nozomi 位于区间另一端：其约
              $1 billion 出售给 Mitsubishi Electric，作为纯 OT 交易关联度很高，但可能低估 Claroty 在医疗和公共部门的更广覆盖。


              Tenable 是最好的公开市场底线，因为它提供经正式提交的收入和客户指标。Tenable FY2025 收入约 $999 million，2025 年中市场价值约 $4.1 billion，对应约 4x
              收入倍数；相比之下，若按 $120 million 工作 ARR 情景和 Claroty $3 billion 估值计算，隐含 ARR 倍数超过 25x。这个差距并不自动构成红旗，因为 Claroty
              可能增长更快，并享有稀缺性价值。但它确实说明，Claroty 需要优于公开可比公司的增长和披露质量，才能守住溢价入场。Dragos 仍具战略相关性，但其公开定价已经陈旧，因此可比表必然只是部分而非完整。
