      - number: '4.4'
        title: 资本充足性、估值背景与 IPO 路径
        blocks:
          - type: paragraph
            body: >
              2026 年 1 月的 Series F 为 Claroty 的全球扩张补充了新资金。Golub Growth 的领投角色，对判断战略意图很关键：Golub Capital
              是后期增长信贷和股权平台，过去常在被投公司 IPO 前 12–36 个月切入，用灵活的债务和股权结构提供 IPO 前资本，同时管理既有股东稀释。Series F
              采用股权结构（而不是收入分成融资或可转债），说明公司的治理和股权结构表正在向公开市场标准靠拢。


              CEO Yaniv Vardi 曾通过 Calcalist 公开表示，并由 CRN 报道，Claroty 最早可能在 2027 年寻求首次公开募股（IPO），前提是市场条件允许。这意味着从 Series F
              交割起，公司进入 12–18 个月 IPO 准备窗口。作为背景，Armis 在 2022 年完成最后一轮私募融资（估值 $4.6 billion），随后于 2025 年被 ServiceNow 以 $7.75
              billion 收购；Nozomi Networks 在 2025 年被 Mitsubishi Electric 以约 $1 billion 收购前也曾融资。Claroty 目前是市场上主要的大规模、独立纯
              CPS/OT 安全公司。


              估值方面，公司确认较 2024 年 3 月基线提高 80%。2024 年 3 月融资被广泛报道为投后估值约 $2.5 billion（据 CRN，引用「此前报道」）。从 $2.5 billion 提高
              80%，意味着当前估值约 $4.5 billion。不过 Calcalist 报道 Series F 估值约 $3 billion——SecurityWeek 明确指出，这一数字与 80% 增长和 $2.5
              billion 基线的组合在数学上不一致。这个差异需要向公司直接核验；它意味着至少存在三种可能：2024 年 3 月 $2.5 billion 数字被高估，Calcalist 的 $3 billion 被低估，或
              80% 增长所对应的基线低于 $2.5 billion。


              目前没有发现 2024 年 Series E-II 或 2026 年 Series F 的 SEC Form D 备案。这种缺失与使用 Cayman Islands 或其他非美国基金结构相符（2022 年
              Team8-Claroty II 和 Marker-Claroty 的 Form D 备案已有类似迹象），也可能说明使用的是根据 Regulation D 不构成需 Form D
              备案股权证券的债务或结构化信贷工具。AllianceBernstein 私募信贷参与 Series E-II，支持了这些轮次至少一部分涉及结构化工具的假设。
