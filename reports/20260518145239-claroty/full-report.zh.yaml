        title: 客户集中度、反向证据与部署风险
        blocks:
          - type: paragraph
            body: >
              主要客户风险在于 NRR 和流失数据不透明。Claroty 的私营状态意味着正式留存指标不可得，只能依赖替代信号（KLAS、案例研究扩张、KLAS 三年滚动指标）。G2 评论者——尽管样本很小（截至 2024 年
              10 月为 4.7/5，6
              条评论）——指出有意义的部署摩擦：「部署需要大量细致调优」「软件缺陷会让事件处理变得笨重」「初始设置的复杂度可能有挑战」以及「需要专家团队安装」。这些信号说明实际价值达成时间可能长于营销承诺，部署需要熟练 OT
              安全人员（稀缺资源），没有内部专业能力的客户可能面对更高总拥有成本。收入层面的客户集中度未知：24 家 Fortune 100 账户可能贡献了不成比例的
              ARR，失去任何一个大客户都可能产生重大影响。公共部门销售周期长，且受采购门槛约束，因此 Carahsoft 和 Mission IT 合作必要但不足以带来政府收入快速爬坡。医疗垂直集中度虽经验证，但如果医院
              M&A 整合客户基础，或报销压力压缩网络安全支出，也可能变成负担。本研究没有发现公开流失事件、失败部署或重大客户投诉；不过，公开反向证据缺失，一部分也可由 Claroty 的保密惯例和 OT 客户事件敏感性解释。
