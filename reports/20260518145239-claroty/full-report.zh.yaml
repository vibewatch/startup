  - id: TV006
    title: 最终尽调索取项表
    columns:
      - 主题
      - 索取项
      - 优先级
      - 理由
    rows:
      - - 当前 ARR
        - 提供从 FY2023 到当前季度的月度 ARR 变动桥表，以及销售管线转化情况。
        - 关键
        - 验证 $3B 入场价对应 20x、25x 还是 30x+ ARR。
      - - 股权结构表
        - 提供完整优先股堆叠、清算分配瀑布，以及任何结构化信贷优先级条款。
        - 关键
        - 累计融资接近 $900M 时，真实回报可能与企业价值大幅背离。
      - - 利润率与留存
        - 按产品线披露毛利率、NRR、流失率和回本周期。
        - 高
        - 决定 Claroty 应享有高端网络安全倍数，还是只能拿成熟平台倍数。
      - - IPO 就绪度
        - 分享董事会批准的 IPO 里程碑、所需审计工作，以及 2027 闸门假设。
        - 高
        - 厘清 Golub 的资本是真正 IPO 前资金，还是只是过桥资金。
      - - 隐性负债
        - 确认债务、契约、侧函、赎回权，以及任何与 Series F 绑定的投资者保护。
        - 高
        - 上述条款可能让新投资者居后，或限制退出时点。
