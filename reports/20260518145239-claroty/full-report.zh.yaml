          - type: callout
            title: 勒索软件浪潮抬高所有 OT 安全厂商
            body: >
              针对工业实体的勒索软件同比增加 64%，2025 年活跃勒索组织从 80 个增至 119 个（Dragos 数据），制造了利好所有 OT 安全厂商的紧迫感，并不只利好 Claroty。在扩张市场中，Dragos
              和 Nozomi 同样有位置拿到新增预算。Claroty 能否提升市场份额——而不只是收入——取决于赢得竞争性替换交易，而不是搭上绿地预算扩张。
