      - number: '4.3'
        title: 单位经济、成本结构与财务不透明度
        blocks:
          - type: paragraph
            body: >
              Claroty 尚未公开披露完整财务尽调所需的任何核心单位经济指标：毛利率、净留存率（NRR）、总流失率、获客成本（CAC）、回本周期、平均合同价值趋势，或每账户平均收入。公司处在考虑 IPO 前 12–24
              个月的后期私营阶段，通常会把披露推迟到 S-1 招股说明书阶段；这一做法与其状态一致。


              可比企业级 SaaS 网络安全公司能提供粗略参照：成熟 SaaS 安全平台的软件毛利率通常在 70% 到 85% 之间，本地部署软件通常低 5 到 10 个百分点。如果 Claroty 的毛利率落在这一区间，且
              ARR 约为 $150–200 million（综合 2023 年里程碑和 CB Insights 估计），隐含年度毛利润池约为 $105–170
              million。这只是没有可验证支撑的粗略估算，不应视为权威数字。


              根据公司新闻稿，截至 2025 年中，Claroty 在 27 个国家约有 700+ 名员工。若 ARR 约为 $200 million，则人均 ARR 约 $285,000——对企业级 SaaS
              公司而言是合理的生产率指标，但研发、销售和服务之间的员工结构未披露。2022 年初收购 Medigate 时，公司员工数几乎翻倍；交易价格未披露，因此无法分析收购倍数，也无法判断商誉对资产负债表的影响。


              资本消耗值得注意：Claroty 已消耗约 $882 million 公开披露融资，换来 $100+ million ARR（2023 年里程碑），意味着在 Series E-II 时资本 / ARR 比约为
              8–9x。安全平台在达到规模前重投研发和企业销售，这并不少见；但与资本效率更高的同业相比，该比率偏高，也凸显 IPO 后需要改善经营杠杆。公司没有任何盈利能力披露——没有
              EBITDA、经营现金流，也没有烧钱速度指引——因此烧钱分析完全是推测。
