      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Claroty 由 Galina Antova、Amir Zilberstein 和 Benny Porat 于 2015 年在 Team8 网络安全孵化器内共同创立。Antova 和 Zilberstein
              仍在董事会任职，在外部 CEO 带队的公司里延续创始人-市场匹配。Yaniv Vardi 从创始团队之外加入后担任 CEO，是 Series F、IPO 表态等战略公告的主要公开发言人。

              截至 2026 年 5 月，执行领导团队包括 Yaniv Vardi（CEO）、Udi Bar Sela（CFO/COO）、Grant Geyer（首席战略官，曾任 CPO）、Yoram
              Gronich（首席产品官，2024 年 6 月任命）、Gil Gur Arie（2026 年 1 月从 Ford Motor Company AI 职能加入并担任 CPO）、Upa Campbell（CMO）和
              James Love（CRO）。双 CPO 反映产品领导层正在过渡：Gronich 于 2024 年 6 月从 Tufin/Symantec/Check Point 背景加入；Gil Gur Arie 则负责
              AI 方向的 CPS Library 项目。Series F 新闻稿还提到，公司任命退役 U.S. Air Force Colonel Jen Sovada 领导公共部门团队。

              董事会由 NightDragon 创始人兼 CEO Dave DeWalt 担任主席，他在 2025 年 11 月接任该职。DeWalt 有超过 20 年网络安全运营经验，包括 Intel 以 $7.7
              billion 收购 McAfee。公开文件和新闻稿确认的其他董事包括联合创始人 Galina Antova 和 Amir Zilberstein、David Cowan（Bessemer Venture
              Partners）、Amit Lubovsky（SoftBank）、Yuval Shachar（Team8）、Robert Tuchscherer（Golub Capital）、Meir
              Ukeles（MoreVC）、Rossa Shanks（Istari）、Peter Marturano（Standard Investments）和 John Miller（Rockwell
              Automation）。董事会横跨国防 / 政府导向投资方（Istari）、工业自动化厂商（Rockwell）和后期成长股权机构（Golub），反映 Claroty 的多垂直行业战略和 IPO 前资本结构。
