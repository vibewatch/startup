      - number: '8.5'
        title: 退出准备度、投资逻辑破坏点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Claroty 从运营上看已具备退出准备度。它有后期资本、分析师认可、企业级标杆客户，管理团队也已经公开谈论 2027 年 IPO。它还没有准备好的，是公开市场披露。投资者仍缺少当前 ARR
              衔接表、当前增长率、毛利率画像、留存数据，以及把企业价值转化为实际股权回报所需的股权结构表细节。这个缺口正是最终尽调清单短但关键的原因：核实收入质量、核实分配瀑布、核实任何优先级或结构化工具，并核实董事会真实
              IPO 计划，而不是依赖媒体转述。


              最清晰的投资逻辑破坏点直接来自这些缺失项。融资价格低于 2024 年估值、ARR 仍接近 $100 million 的证据，或股权结构表显示低于 $4 billion
              退出时普通股拿不到多少价值，都会实质性削弱投资逻辑。若网络安全 IPO 市场到 2027 年仍实质关闭，也会产生同样影响。在这些问题得到回答前，最有证据支撑的结论不是 Claroty
              在任何价格下都被高估，而是公开记录过于不完整，不足以在没有更强尽调权的情况下支撑支付后期溢价。
