      - number: '3.4'
        title: 细分与工业自动化玩家 — Cisco、Verve/SecureOT、Radiflow
        blocks:
          - type: paragraph
            body: >
              Cisco 通过 Cisco Industrial Threat Defense 竞争，这是一套以 Cisco Cyber Vision（OT/ICS 资产可视化与行为分析）、Cisco Secure
              Equipment Access（OT 零信任远程访问）、Cisco Secure Firewall for industrial DMZ 和 Cisco Identity Services Engine（按
              ISA/IEC 62443 做区域与通道执行）为锚点的产品组合。Cisco 的竞争优势是既有工业网络交换机和路由器装机基础；这些设备无需额外硬件部署，就能成为 Cyber Vision
              的被动传感器。这种“网络即传感器和执行器”路线大幅降低 Cisco 中心型工业环境的部署摩擦——Cisco Validated Designs 提供参考架构和物料清单，压低实施风险。Cisco 与 Cisco
              XDR 和 Splunk 集成，实现统一 IT/OT 威胁关联。弱点是 OT 专属威胁情报有限，OT 安全 GTM 也不如 Dragos 或 Claroty 专门。Verve Industrial
              Protection 现在改名为 Rockwell Automation 旗下 SecureOT，定位是“由制造商打造，服务制造商”。SecureOT 方案组合把供应商中立的 OT 专属资产清单与风险管理平台（原
              Verve Security Center），同 24/7 OT SOC 和 NOC 等专业与托管安全服务结合起来。Rockwell 所有权带来显著制造业可信度，也带来与 Rockwell Automation
              既有控制系统客户的深厚关系。SecureOT 的策略是端到端服务，而不是只拼平台技术；其差异化来自部署支持、NIST CSF 成熟度提升案例，以及与 Rockwell 设备的运营集成。Radiflow
              是一家以色列 OT 安全厂商，全球服务超过 20,000 个站点，尤其擅长 MSSP 和 SIEM 集成场景。Radiflow 提供非侵入、非破坏性的 OT 网络监控，Smart Collectors
              可把远程站点遥测以带宽高效方式传到中央 SOC。Radiflow 与 IBM 安全产品集成，瞄准偏好 IEC 62443 合规和 MSSP 交付安全的行业。它的市场足迹明显小于前三家纯厂商，也缺少
              Claroty、Dragos 或 Nozomi 的平台广度和威胁情报深度，但仍是 SIEM 中心型 OT 安全架构中的参考厂商。
