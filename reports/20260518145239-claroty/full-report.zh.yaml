  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与部署架构
        blocks:
          - type: paragraph
            body: >-
              Claroty Platform 是一套企业级信息物理系统（CPS）保护套件，围绕六个支柱组织：资产清单、暴露面管理、网络防护、安全访问、威胁检测和运营效率。它通过两款主产品交付：Claroty
              xDome，一款云原生 SaaS 产品，面向重视快速部署和低基础设施负担的组织；Claroty Continuous Threat
              Detection（CTD），一套稳健的本地部署方案，面向有严格数据驻留或延迟要求的气隙隔离工业环境。两款产品共用同一检测引擎、分析框架和 CPS Library
              集成，因此客户选择任一路径都能获得功能上等价的覆盖。第三个组件 Claroty xDome Secure Access（原 Claroty SRA）为内部和第三方 OT 人员提供零信任远程访问，不需要传统 VPN
              基础设施或共享凭据。


              Claroty Edge 作为零基础设施边缘数据采集器，扩展了平台覆盖范围。它运行在现有 Windows
              基础设施上——本地或云端均可——不需要网络传感器或物理占位，让组织能够发现远程站点、气隙隔离区域以及无法支撑完整 CTD 部署的分布式环境中的资产。平台支持四种发现方法：被动监测（非侵入式流量检查）、Safe
              Queries（为脆弱 OT 系统调校的低影响主动查询）、Project File Analysis（离线 PLC/DCS 项目文件解析）和 Ecosystem Enrichment（摄取防火墙、交换机和
              CMMS 集成数据）。Claroty 声称这些方法合计覆盖 450+ 种工业协议，并将其称为业内最深的协议库。


              CPS Library 于 2025 年 11 月推出，是一个 AI 驱动的资产目录，使用 LLM 和统计推断建模，把碎片化设备标识符解析为规范、经厂商验证的记录。该库解决的是一个系统性 OT
              数据质量问题：Claroty 自有 Team82 研究发现，88% 的 CPS 资产不会传输精确产品代码，76% 传输的产品名称与厂商官方记录不同。与 Rockwell Automation 和
              Schneider Electric 的 OEM 合作支撑了资料库准确性。MCP Server 层允许生成式 AI 工具查询 CPS 资产清单，加快事件响应，也让团队能在 CPS 安全数据之上使用自己偏好的 AI
              助手。
