      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Claroty 的融资历史显示，自 2015 年成立以来，公司已披露累计融资约 $885 million 至 $900 million。2021 年 6 月完成的 $140 million Series D
              由既有投资者领投，使当时累计融资达到约 $235 million；同轮还伴随收购医疗 IoT 安全公司 Medigate，几乎让 Claroty 规模翻倍，并扩大了可服务市场。到 March 2024 完成
              $100 million 战略增长融资时，Claroty 披露累计融资 $635 million，意味着 2021 年中至 2024 年初之间发生过约 $400 million 的 Series E。

              January 2026 的 $150 million Series F 由 Golub Growth 领投，既有投资者还可追加最高 $50 million 参与。该轮把累计融资推至 CRN 口径下约 $885
              million，或 SecurityWeek 口径下约 $900 million。Golub Growth 隶属 Golub Capital，以后期 IPO 前贷款方闻名，它领投是 Claroty
              轨迹上的实质信号。公司从未公开确认估值。Calcalist 报道 Series F 后估值约 $3 billion，较 March 2024 报道的 $2.5 billion 投后估值高约
              20%。SecurityWeek 则指出，Claroty 确认估值较 March 2024 上升 80%；如果 March 2024 基准为 $2.5 billion，这与 $3 billion
              估计在数学上不一致，说明真实估值可能更高，也可能 March 2024 参考数字被高估。该差异尚未解决，是重要尽调事项。

              CEO Yaniv Vardi 告诉 Calcalist，Claroty 希望上市；如果市场条件配合，公司最早可在 2027 年推动 IPO。关键投资者包括 Bessemer Venture
              Partners（David Cowan）、SoftBank（Amit Lubovsky）、Team8（Yuval Shachar）、Golub Capital（Robert
              Tuchscherer）、NightDragon（Dave DeWalt）、Standard Investments（Peter Marturano）、MoreVC（Meir
              Ukeles）、Istari（Rossa Shanks）和 Rockwell Automation（John Miller）。投资者组合同时释放财务回报导向和战略协同信号，贴合 Claroty
              的工业与国防客户基础。
