      - number: '5.3'
        title: Team82 威胁研究与开发者触面
        blocks:
          - type: paragraph
            body: >-
              Team82 是 Claroty 内部网络安全研究部门，公司将其定位为自有竞争护城河。该团队披露了 750+ 个 ICS 漏洞——超过任何其他 OT 安全厂商或研究组织——并依据正式 Coordinated
              Disclosure Policy 发布协调披露，同时提供公共 PGP 密钥用于安全厂商沟通。近期披露包括 Trane Tracer SC/SC+/Concierge 楼宇控制器中的多个 CVE（2026 年 3
              月）以及 Schneider Electric Modicon M241/M251/M262 PLC 中的多个 CVE（2026 年 3 月）。在 2026 年 3 月报告「Analyzing CPS
              Attack Trends」中，Team82 分析了 12 个月内 200+ 起已验证事件，发现 82% 的攻击利用远程访问协议，66% 瞄准 HMI 和 SCADA 系统——这些研究直接支撑 Claroty
              围绕 SRA 和监测的产品叙事。


              Team82 在 github.com/claroty 维护 GitHub 组织，拥有 10+ 个公开开源研究工具，包括：Arya（用于 YARA 测试的伪恶意文件生成器）、EtherNet/IP & CIP
              Stack Detector（识别 OT 网络中特定厂商固件栈）、OPC UA Fuzzer 和 OPC UA Exploit Framework、MMS Stack Detector、BusyBox AFL
              模糊测试框架、netunnel（HTTP/S 网络隧道工具）、WinCE-Debugger 和 PCOM-Tools。该组织有 145 名 GitHub 关注者，反映出 OT/ICS
              安全研究社区里小众但真实的从业者参与。这些工具被防御方和其他研究者使用，使 Claroty 成为开放 OT 安全工具链的上游贡献者。


              Team82 扮演双重角色：一边生成威胁情报并反哺平台检测规则，一边提供公益型漏洞研究来建立品牌可信度。这种投入是差异化的，少数 OT 厂商能够按规模复制。Team82
              的研究直接加速协议库和检测引擎更新；EtherNet/IP 栈检测器和协议专属模糊测试器已经推动了新协议覆盖，否则这些协议可能需要数月逆向工程。Vulnerability Disclosure
              Dashboard（可在 claroty.com/team82 公开访问）实时追踪所有 Team82 CVE，并包含厂商归因和 CVSS 分数。
