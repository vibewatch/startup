  - id: FE001
    title: Claroty 平台架构栈
    type: stack
    layout: standard
    summary: 产品层级从物理资产层向上延伸到检测 / 分析和管理平面，展示 xDome、CTD、SRA 与 CPS Library 的关系。
    data:
      layers:
        - label: 物理 / OT 层
          modules:
            - PLCs、HMIs、RTUs、DCS（工业）
            - IoMT 设备：IV 泵、监护仪、输液系统（医疗）
            - BMS、HVAC、物理门禁（商业）
        - label: 发现与可视化层
          modules:
            - 被动监控（SPAN/TAP）——450+ 个协议解析器
            - Claroty Edge（代理；零基础设施）
            - Safe Queries（低影响主动查询）
            - Project File Analysis（离线 PLC/DCS）
            - 生态系统富集（CMMS、AD、EDR 数据源）
        - label: CPS 智能层
          modules:
            - CPS Library：LLM-RAG + 统计推断 → 确定性设备 ID
            - CVE 归因引擎（750+ 个 Team82 披露）
            - 行为基线引擎（30-90 天学习期）
        - label: 控制平面
          modules:
            - Claroty xDome（SaaS）——云管理控制台
            - Claroty CTD（本地部署）——本地管理服务器
            - xDome Secure Access——零信任远程访问网关
        - label: 集成 / 输出层
          modules:
            - SIEM 导出（Splunk、QRadar、Sentinel、ArcSight）
            - SOAR / 工单系统（ServiceNow、PagerDuty、Jira）
            - NAC / 防火墙策略下发（Palo Alto、Fortinet、Cisco）
            - EDR 富集（CrowdStrike Falcon、MS Defender）
            - MCP Server（生成式 AI 查询界面）
    approximationNotes: 层级结构来自 Claroty 官方产品页面和新闻稿；没有通过独立的平台架构审计验证。
    claimRefs:
