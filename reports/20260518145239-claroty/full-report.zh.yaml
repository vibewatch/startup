  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界 — CPS / XIoT / OT 安全
        blocks:
          - type: paragraph
            body: >
              Claroty 的可服务市场最好定义为网络物理系统（CPS）安全，这一品类由 Gartner 在 CPS Protection Platforms Magic
              Quadrant（2025）中正式化。它覆盖三个正在收敛的细分市场：运营技术（OT）/ 工业控制系统（ICS）安全——保护能源、制造、水务和交通中的 PLC、RTU、DCS、SCADA 和现场设备；医疗
              OT（HTM）安全——保护医院环境中的医疗设备、临床网络和楼宇管理系统；扩展 IoT（XIoT）——位于 IT 与 OT 交界处的企业级 IoT 设备，包括智能楼宇控制器、物流传感器和联网工业设备。

              这个定义排除通用企业 IT 安全（端点检测、面向 IT 流量的 SIEM、没有 OT 协议感知能力的传统防火墙）和消费级 IoT。专用 OT 安全工具的现状替代品，是手工资产清单、周期性现场盘点，以及套用没有
              OT 特定协议情报的标准 IT 安全工具；这些做法都会让关键基础设施系统性看不见活跃资产暴露。

              CISA 监管 16 个关键基础设施行业，其中几乎全部包含 OT 或 CPS 组件。NIST SP 800-82 Rev.3（2023）是保护这些环境的权威联邦指南；ISA/IEC 62443
              则是工业自动化网络安全的全球共识标准，得到 United Nations 背书，并应用于 20+ 个行业。监管脚手架不仅是合规勾选项，更是主要需求信号：缺少符合 ISA/IEC 62443
              的安全计划，组织会面临越来越高的采购、保险和监管风险。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
