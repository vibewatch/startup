              Claroty Secure Remote Access 方案中的一个关键认证绕过漏洞已在 2025 年 10 月修补，这凸显访问网关——Claroty 产品组合中价值最高的目标——本身曾是漏洞暴露面。买方在关键
              OT 网段部署 SRA 前，应要求获得补丁后的安全审计、渗透测试结果和公开 CVE 修复时间线。
            calloutType: risk
