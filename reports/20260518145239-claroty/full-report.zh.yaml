      - number: '4.2'
        title: 收入模式、定价架构与 ARR 披露
        blocks:
          - type: paragraph
            body: >
              Claroty 的收入模式围绕经常性软件订阅展开，主要由两条产品线交付：云原生 SaaS 平台 Claroty xDome，以及本地部署软件 Claroty Continuous Threat
              Detection（CTD）。两款产品覆盖同样四个功能支柱——暴露面管理、网络防护、安全访问和威胁检测——但面向客户不同的 IT/OT
              架构偏好。SaaS（xDome）产品预计毛利率更高，长期净收入留存也更强；本地部署的 CTD 则能进入不允许云连接的气隙隔离环境。


              Claroty 在 2026 年初增加了第三项独立产品：CPS Library。这是一个 AI 驱动的资产目录，号称业内首个能跨厂商呈现信息物理资产可见性并归因漏洞的产品。CPS Library
              可能在核心平台之上叠出新的订阅收入流，目标客户是需要汇总 OT/IoT 资产情报、且信息范围超出自有 Claroty 传感器部署的企业安全团队。


              收入主要来自企业合同，通常是与 Fortune 500 和关键基础设施运营商谈成的多年期协议。定价据信按资产计费（按设备或按站点订阅），部署和持续支持的专业服务另按标价收取。公司没有公布价格；Claroty
              竞争靠的是平台广度和 OT 专属领域经验，而不是价格，这也符合其高端企业级供应商的定位。


              唯一公开披露的年经常性收入（ARR）里程碑，是公司在 2023 年超过 $100 million ARR，这一点在 2024 年 3 月 6 日的 Series E-II 新闻稿中宣布。CB Insights
              根据二级市场数据估计 2026 年 ARR 约为 $200 million。一篇 Forbes 专访提到「过去三年」ARR 为 $300 million，这看起来是累计口径，或可能指代与公司自身 2023 年
              $100 million 里程碑不同的指标——这一数字相互冲突，不能可靠作为某一时点的 ARR 参考。当前 ARR 和收入增长率均未披露。按地区划分的收入、渠道结构以及按垂直行业划分的收入集中度也都未披露。
