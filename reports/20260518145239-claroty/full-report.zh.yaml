      - number: '3.5'
        title: 竞争护城河与替换风险
        blocks:
          - type: paragraph
            body: >
              Claroty 最持久的竞争优势，是 XIoT 平台广度和资产知识图谱深度。一个统一平台同时覆盖 OT、IoT、BAS 和医疗设备，使 Claroty 的切换成本高于单域厂商：一家医疗机构用 Claroty
              映射了输液泵、楼宇自动化和工业流程设备后，替换它就要跨多层重新部署。Team82 威胁研究职能和 Global CPS Research Report 持续在安全从业者中强化品牌，类似 Dragos 的
              WorldView 和年度回顾报告，既带来自然媒体声量，也成为分析师认可的素材。Claroty 的伙伴计划（MSSP、SI、技术伙伴）和医疗行业深度，也构成纯厂商对手 Dragos 与 Nozomi
              尚未完全复制的分销优势。最可信的替换风险并不来自直接 OT 安全对手，而是大型平台安全厂商。Palo Alto Networks 和 Cisco 可以在企业安全续约对话中，把 OT 安全作为打包能力提供；CISO
              可以借既有供应商关系解决 OT 可视化，并降低采购复杂度。Tenable 向既有漏洞管理装机基础交叉销售，尤其是在已经用 Tenable 做 IT 扫描的受监管行业账户中，会带来真实增购风险——这些账户可能把
              OT 安全视为漏洞管理延伸，而不是独立项目。多供应商共存风险为中等：已经使用 Dragos 或 Nozomi 做 OT 威胁检测的买方，可能为了医疗设备或 BAS 覆盖再加
              Claroty，而不是完全替换，形成共同部署而非零和竞争。2026 Dragos Year in Review 确认，针对工业实体的勒索软件攻击同比增加 64%，加剧专用 OT
              安全预算的紧迫性，并利好该细分市场所有厂商。
