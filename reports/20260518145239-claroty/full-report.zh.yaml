  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本形成历史与逐轮融资年表
        blocks:
          - type: paragraph
            body: >
              Claroty 自 2015 年在 Team8 网络安全孵化器内成立以来，已汇集约 $885–900 million 的已披露机构资本。资本形成轨迹覆盖六轮公开承认的融资；但公司从未发布完整融资时间线，SEC
              EDGAR 记录显示，围绕 2021 年 12 月融资事件存在特殊目的载体，而公司未单独公告该事件。

              最早可识别的机构资本，可追溯至公司在 Team8 内孵化时期。SEC Form D 文件显示，Team8 – Claroty, L.P.（CIK 0001754014）于 October 2018
              提交备案。该文件登记了一只 Cayman Islands 基金的 $5 million 豁免发行，确认 Team8 从创立时期就持有结构化股权。Series D 于 June 2021 完成，募资 $140
              million，由 Bessemer Venture Partners 和 Standard Industries 旗下 40 North
              平台共同领投；该轮当时是工业网络安全领域有史以来最大单笔投资。Series D 完成时，累计融资约 $235 million。

              June 2021 至 March 2024 之间，Claroty 又融资约 $400 million，但从未作为独立轮次公开宣布。SEC EDGAR 记录了 2022 年初两份 Form D：Team8 –
              Claroty II, L.P.（CIK 0001903605，January 2022 提交）和 Marker-Claroty Series E LP（CIK 0001908673，February 2022
              提交，SPV 初始发行金额 $7.3 million）。CB Insights 据此记录了一轮 December 2021 机构融资。March 2024 Series E-II 完成时披露的累计融资为 $635
              million，意味着 2021 年中至 2024 年初之间有约 $400 million 的 Series E。这是 Claroty 融资史上最大的披露缺口，也是首要尽调事项。

              March 6, 2024 的 Series E-II 募资 $100 million，被称为“战略增长融资”，由股权投资者 Delta-v Capital 领投，AllianceBernstein 旗下 AB
              Private Credit Investors、Standard Investments、Toshiba Digital Solutions、SE Ventures、Rockwell Automation 和
              SVB 参与。AllianceBernstein 私人信贷参与表明，该结构同时包含股权和私人信贷；纯风险投资轮很少出现这种安排，并可能影响股权结构表中的优先级。该轮未提交 SEC Form D。

              January 22, 2026 的 Series F 募资 $150 million，由 Golub Capital 关联方 Golub Growth 领投，并有既有投资者确认可追加最多 $50 million
              参与；若完全交割，总额最高可达 $200 million，累计已披露资本约 $885–900 million。Golub Growth 专注为 IPO 前 B2B SaaS
              公司提供灵活债权和股权资本。Series F 未提交 SEC Form D。公司确认估值较 March 2024 轮上升 80%，但拒绝披露绝对数字。CRN 报道总融资为“至少 $885
              million”；SecurityWeek 报道为“约 $900 million”。
