      - number: '8.2'
        title: 融资背景、估值纪律与入场价格
        blocks:
          - type: paragraph
            body: >-
              Claroty 披露的融资历史同时显示实力和复杂性。2021 年 D 轮融资 $140 million，将累计融资推至约 $235 million；2024 年 3 月的战略融资又增加 $100
              million，把披露的累计资本提高到 $635 million。2026 年 1 月 F 轮由 Golub Growth 领投，新增 $150 million，使披露融资总额达到约 $885 million 至
              $900 million。这样的资本规模可以正面解读，因为它让 Claroty 得以搭建宽口径 CPS 平台并达到有意义的企业级规模。但它也可能留下优先权负担，尤其是 2024
              年融资包含私募信贷参与，而不是干净的普通股融资。


              因此，入场纪律比标题估值更重要。独立报道把 F 轮估值放在约 $3 billion，但 Claroty 只确认较上一轮上升 80%，从未公布绝对估值。如果 2024 年上一轮估值确实为 $2.5
              billion，那么 80% 的数学结果约为 $4.5 billion。这个不一致意味着，公开证据不足以把 $3 billion 当作已经验证的清算价格。纪律严明的投资者应把报道估值只当作尽调锚点，要求提供当前
              ARR 证明，并在下行情景中承认：优先权和结构化资本可能比标题企业价值所暗示的那样吃掉更多价值。
