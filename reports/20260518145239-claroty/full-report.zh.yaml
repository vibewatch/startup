      - number: '8.3'
        title: 情景分析与回报测算
        blocks:
          - type: paragraph
            body: >-
              情景区间的驱动因素，与其说是市场需求争议，不如说是当前收入规模的不确定性。公开证据可以支持一个基准情景：到 2027 年，Claroty 已经从 >$100 million ARR 里程碑推进到更接近 $150
              million 至 $160 million，从而支撑 $4 billion 至 $5 billion 的 IPO 或战略价值。这个情景说得通，但并不说明 $3 billion 入场显然便宜；只有当前 ARR
              已经明显高于陈旧的公开锚点时，它才算合理。


              乐观情景需要比现有信息更强的证据。若要支撑 $6 billion 至 $8 billion 退出，Claroty 需要溢价增长、公开市场时点，以及愿意支付远高于成熟网络安全平台倍数的买家或 IPO
              投资者。悲观情景更容易从公开证据中看到，因为只需要三件事发生其一：ARR 未能拐点上行、IPO 窗口持续关闭，或优先权堆叠足够重，使得即使标题估值接近今天的报道水平，普通股回报仍然很差。因此，回报区间是偏斜的：以
              $3 billion 入场，下行可能持平到为负；有吸引力的上行仍取决于公司尚未披露的信息。
