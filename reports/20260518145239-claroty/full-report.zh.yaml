      - number: '2.4'
        title: 买方、用户与付款方格局
        blocks:
          - type: paragraph
            body: >
              OT 安全平台的购买权因垂直行业和买方安全组织成熟度而异。在能源和公用事业，CISO 与运营副总裁通常共同评估方案，采购一般走 IT 安全或技术资本预算。制造业里，工厂经理或 IT 经理常常推动评估，CFO 或
              CTO 批准支出。医疗买方通常是 CISO，并与 Biomedical Engineering 或 Healthcare Technology Management（HTM）团队协作，由医院 CFO
              控制审批。水务公司和市政机构往往只有一名 IT 主管兼负安全责任，资金则绑定基础设施补助和公用事业董事会审批周期。

              OT 安全平台的用户是 OT 安全分析师、工厂工程师或 SOC 运营人员——他们网络安全背景可能有限，但深懂工艺域。OT 域知识与安全专业能力之间的张力，是结构性采用约束：同一份 SANS 2026
              调查显示，60% 组织把技能缺口列为首要 OT 网络安全挑战，42% 表示这些缺口阻碍采用新安全技术。

              付款方并不只看安全 ROI。合规要求、网络保险要求和运营韧性目标，才是主导预算理由。早期 OT 安全项目中，专业服务收入——集成、部署和托管检测——往往超过软件许可价值，反映棕地环境的复杂度。
            claimRefs:
              - CM019
              - CM020
              - CM035
              - CM036
              - CM037
              - CM039
      - number: '2.5'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              首要增长驱动，是针对关键基础设施的攻击频率和严重程度加速上升。Google Cybersecurity Forecast 2026 警告，ICS/OT 风险正同时受到网络犯罪和国家级行为体推动而升级。按
              Cydome 研究，2025 年海事 OT 网络攻击激增 150%。CISA Known Exploited Vulnerabilities 目录经常纳入 OT/ICS 产品 CVE，推动资产所有者产生紧迫感。

              监管顺风会复合放大需求：NERC CIP、EU NIS2 Directive、TSA 网络安全指令、FDA 医疗设备指南，以及 CISA 面向 OT 资产采购的 Secure by Demand
              指南，正在共同抬高每个关键基础设施垂直行业的合规底线。SANS 2026 数据显示，监管对 OT 安全招聘的影响在一年内从 40% 组织跃升到 95%，这是预算分配的领先指标。

              IT/OT 融合是结构性驱动：工业环境采用 IIoT、云分析和远程维护访问后，OT 攻击面大幅扩张，需要专门为 OT 协议打造的安全能力，而不是把 IT 工具改装后套用。

              最大约束是结构性的 OT 安全人才短缺。SANS 2026 报告称，27% 组织经历过与能力缺口直接相关的入侵，42% 表示这些缺口阻碍采用新安全技术。这一约束一方面创造了托管 OT SOC
              服务需求，另一方面又放慢自营平台部署。关键基础设施中 12–36 个月的长采购周期、部署期间对运营风险的规避，以及 IT 与 OT 安全项目之间的预算竞争，也进一步压低采用速度。
