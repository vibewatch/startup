      - number: '5.2'
        title: 产品模块、用例与垂直行业
        blocks:
          - type: paragraph
            body: >-
              Claroty 的上市打法围绕四个垂直行业拆分——工业、医疗、商业建筑和公共部门——每个行业都在共用平台之上叠加定制化方案。工业垂直（制造、油气、公用事业、制药）是公司最大的垂直行业，依赖 CTD 或 xDome
              获得深度 OT 资产可见性，并用 xDome Secure Access 支撑工程师和供应商远程访问。医疗垂直通过 Claroty xDome for Healthcare 覆盖，这是一套模块化 SaaS
              方案，为 Internet of Medical Things（IoMT）设备增加临床语境增强：输液泵、患者监护仪、输注系统、智能 HVAC 以及其他联网临床资产。医疗专属差异化包括：与 Computerized
              Maintenance Management Systems（CMMS）集成；支持医疗设备 OEM 合作伙伴提供的 MDS2（Manufacturer Disclosure Statement for
              Medical Device Security）、SBOM 和 VEX（Vulnerability Exploitability eXchange）文件；以及 Siemens Healthineers
              技术合作，把厂商整理的漏洞和缓解指引直接嵌入 xDome 工作流。


              商业建筑垂直面向数据中心、零售、酒店和园区环境；这些场景里的 Building Management Systems（BMS）、HVAC 和物理访问控制器，构成了经常被低估的 CPS 攻击面。Claroty
              的公共部门叠加方案，为 NERC CIP（电力公用事业）、CISA BOD 26-02（联邦网络边缘设备替换）、NIST CSF 等联邦框架提供具体合规映射，并包含 xDome for Government
              版本。在所有垂直行业里，合规和报告模块都会自动收集证据，并为 NIS2、NERC CIP、IEC 62443、HHS Section 405(d) 和 NIST CSF 等框架生成可用于审计的报告。


              xDome Secure Access 模块（原 Claroty SRA）为 OT/ICS
              网络提供零信任远程访问。它强制执行细粒度按设备访问策略、会话录制、即时凭据托管和多因素认证——这些是补偿性控制，用来覆盖未打补丁的老旧 PLC 无法原生执行认证的环境。Gartner 2026 Market
              Guide for CPS Secure Remote Access 将 Claroty 列为代表性厂商，确认其在该细分市场的可见度。不过，SRA 产品曾被发现并修补一个关键认证绕过漏洞（CVE，2025 年
              10 月），凸显访问层本身就是目标，也需要严格的安全保证。
