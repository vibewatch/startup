      - number: '6.5'
        title: 留存、扩张与客户满意度信号
        blocks:
          - type: paragraph
            body: >
              Claroty 没有公开披露净留存率（NRR）或总流失率——这限制了定量尽调——但多项定性信号指向高留存和有意义扩张。35 家评估组织给出的 KLAS 2026 得分 92.5/100、KLAS
              三年「Consistent High Performers」入选、以及多年 Best in KLAS 认定，都是医疗细分市场的替代留存指标。案例研究记录了扩张：Britvic 从本地 CTD 迁移到云端
              xDome，并把部署延伸到法国和巴西的新制造站点；Coop Switzerland 完成核心物流 / 仓储部署，正在把 Claroty 扩展到门店零售场景。South Tees NHS 部署了所有 xDome
              模块，并增加 Fortinet 集成，提高了平台深度和切换成本。典型先落地再扩张动作从单站点 CTD 或 xDome
              部署做资产可见性开始，随后随着客户信任提升，扩展到安全访问、威胁检测、暴露面管理和网络防护模块。平均每客户 8 个站点（8,000+ 站点 / 1,000+ 客户）说明多站点采用有实质规模。24 家
              Fortune 100 账户是高价值且难以流失的关系，因为它们需要深度 OT 网络集成。缺失证据包括：没有公开披露 NRR、合同期限、队列留存或具体每队列
              ARR——这些都是私营公司标准保留信息。投资人和潜在收购方应在任何尽调流程中索取这些指标。
