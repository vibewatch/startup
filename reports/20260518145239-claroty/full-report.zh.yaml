      - number: '6.3'
        title: 医疗垂直深度与 KLAS 验证
        blocks:
          - type: paragraph
            body: >
              医疗是 Claroty 最深、也最经独立验证的垂直行业。公司连续五年（2021–2025）被 KLAS Research 评为医疗 IoT 安全的 Best in KLAS，并在 2026 Best in
              KLAS Awards 中获得 Top Performer，整体得分 92.5/100——在所有被评估厂商中位列第二，且在所属类别中客户评价数量最多（35 家独立医疗组织）。KLAS 还将 Claroty
              选为「Consistent High Performers 2025」报告中的 30 家厂商之一，该报告衡量三年滚动客户满意度；Claroty 是名单上唯一一家医疗 IoT 安全厂商。KLAS
              发布的客户引述显示强忠诚度：一位医院 CTO（2025 年 12 月）称「我们绝对会再次购买 Claroty 的系统」；一位医院经理（2025 年 5 月）形容 xDome
              是「我们围绕医疗设备做分段时的主干……Claroty 是我们的唯一答案。」具名医疗案例包括 South Tees Hospitals NHS Foundation Trust（英国）、Yale New Haven
              Health System（美国）和 Ohio State University Wexner Medical Center（美国）。Claroty 的医疗平台覆盖来自 HHS Section
              405(d)、HIPAA Security Rule、EU NIS2 和 NHS Data Security and Protection
              Toolkit（DSPT）的监管压力，带来合规驱动的粘性。医疗客户证据的广度——五次独立评分 KLAS 调研、35 家评估组织、具名生产部署和多年续约信号——使医疗成为 Claroty 收入耐久性的锚定垂直行业。
