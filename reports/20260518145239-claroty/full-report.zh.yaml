        blocks:
          - type: paragraph
            body: >
              Claroty 全球服务 1,000 多家客户——这一里程碑在 2023 年达成——其 Claroty xDome SaaS 平台和本地部署 Continuous Threat
              Detection（CTD）已在全球 8,000 多个站点部署。24 家 Fortune 100 是具名客户，使 Claroty
              在最大企业层级的信息物理系统（CPS）保护市场中确立了主导供应商地位。业务覆盖北美、EMEA 和亚太，并由 27 个国家的 700 多名员工支撑。公司覆盖四个主要垂直行业：（1）医疗——由 Claroty
              xDome for Healthcare 牵头，覆盖医院环境中的 IoMT、联网医疗设备和 OT 楼宇管理系统；（2）工业 /
              OT——服务能源、油气、公用事业、制造、食品饮料和化工；（3）公共部门——覆盖联邦文职、Department of War（DoW）、情报界、SLED 机构和关键基础设施运营商；（4）商业 /
