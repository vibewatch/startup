      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 双层竞争格局
            body: >
              OT 安全市场实际上分成两层：纯 CPS 厂商（Claroty、Dragos、Nozomi）在 OT
              深度和威胁情报上竞争，大型平台厂商（PANW、Cisco、Tenable）则靠打包便利和企业采购效率竞争。Claroty 凭平台广度在纯厂商层占据最强位置，但必须防守既有 IT 主导型企业中低摩擦的打包策略。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP035
              - CP037
          - type: callout
            title: PANW 与 Cisco 的打包替换风险
            body: >
              Palo Alto Networks 和 Cisco 可以在既有续约周期中把 OT 安全作为增量能力提供，降低客户发起独立 OT 安全 RFP 的必要性。在拥有强 PANW 或 Cisco
              安全栈的中型市场企业中，阻力最小的路径可能是扩展既有供应商关系，而不是采购专用 CPS 安全平台。随着 PANW 的 SASE 和 Strata 平台在制造业获得牵引，这一风险会加剧。
            calloutType: risk
            claimRefs:
              - CP022
              - CP024
              - CP037
              - CP039
          - type: callout
            title: XIoT 广度带来多层切换成本
            body: >
              Claroty 的独特优势，是用一个平台覆盖 OT、IoT、BAS 和医疗设备。大型医疗系统或多站点制造商若替换
              Claroty，就要在四个资产域同时重新部署发现和监控。当前没有单一竞争者能匹配这种广度——Dragos 和 Nozomi 以 OT 为中心，Armis 在 IT/IoT/医疗上强但 ICS
              更浅，Cisco/PANW 缺少医疗设备和 BAS 深度。这种切换成本是 Claroty 最持久的结构性护城河。
            calloutType: strength
            claimRefs:
              - CP035
              - CP036
              - CP040
