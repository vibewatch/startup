callouts:
  - calloutType: risk
    title: Valuation opacity is a material diligence gap
    body: >-
      Claroty has never publicly confirmed its valuation. SecurityWeek noted that the company's stated
      80% increase since March 2024 is mathematically inconsistent with the $3 billion estimate from Calcalist
      if the March 2024 baseline was $2.5 billion. This unresolved discrepancy makes any pre-IPO valuation
      analysis dependent on private-round data not yet in the public record.
    claimRefs:
      - CO025
      - CO038
      - CO039

  - calloutType: insight
    title: Market consolidation removes peers but validates the category
    body: >-
      The 2025 acquisitions of Nozomi Networks ($1B by Mitsubishi Electric) and Armis ($7.75B by ServiceNow)
      validate the CPS security category at large exit values while simultaneously reducing the pool of
      independent publicly traded comparables for a Claroty IPO. Claroty management frames this as a
      market-share opportunity, but the IPO valuation methodology becomes more complex with fewer pure-play comps.
    claimRefs:
      - CO034
      - CO035
      - CO036

  - calloutType: risk
    title: ARR and revenue are materially unconfirmed beyond 2023
    body: >-
      The last publicly confirmed ARR figure is ">$100 million" from 2023, cited in Claroty's March 2024
      press release. No subsequent ARR or revenue figure has been confirmed. The Series F announcement
      confirms strong growth conditions but does not disclose a current ARR. Later chapters requiring
      financial analysis will need to treat revenue as a private data gap.
    claimRefs:
      - CO027
      - CO040

