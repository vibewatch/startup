  - id: section-4
    title: Scale, traction, and market recognition
    body: >
      As of January 2026, Claroty reports more than 1,000 customers globally deployed at thousands of sites,
      including 24 Fortune 100 companies — up from 20 Fortune 100 customers cited in the March 2024 press
      release and from 300% customer growth since 2020 reported at that time. Named customers from the 10-year
      anniversary press release (June 2025) include General Motors, BHP, Noble Energy, Britvic, Yale New Haven
      Health System, Boar's Head, South Tees Hospitals NHS Foundation Trust, BW Offshore, Port Authority of
      New York and New Jersey, and Haleon. The company has over 700 employees across 27 countries. Annual
      recurring revenue exceeded $100 million in 2023 per the March 2024 press release; current ARR is not
      publicly confirmed.


      Team82, Claroty's in-house threat intelligence and vulnerability research team, had disclosed more than
      650 CPS vulnerabilities as of January 2026 per the Series F announcement. The team is a reputational
      asset that differentiates Claroty's platform with proprietary threat intelligence and drives enterprise
      decision-making and regulatory engagement.


      Third-party analyst and industry recognition is consistent and current. Gartner named Claroty a Leader
      in the Magic Quadrant for CPS Protection Platforms in both 2025 (the inaugural edition) and 2026 (second
      consecutive year), positioning highest for Ability to Execute and furthest for Completeness of Vision in
      the 2025 report. KLAS Research awarded Claroty Best in KLAS for Healthcare IoT Security for five
      consecutive years (2021–2025) with a score of 95.4 out of 100. Forrester named Claroty a Leader in
      The Forrester Wave: IoT Security Solutions, Q3 2025. Forbes named Claroty to the Cloud 100 list for
      the fourth consecutive year in 2026. Deloitte named the company to its Technology Fast 500 list for
      three consecutive years.
