  - id: section-3
    title: Funding history and capitalization
    body: >
      Claroty's funding history shows a company that has raised approximately $885 to $900 million in total
      disclosed capital since its 2015 founding. The Series D round of $140 million, closed in June 2021 and led
      by existing investors, brought the cumulative total to approximately $235 million at that point and was
      accompanied by the acquisition of Medigate, a healthcare IoT security company that nearly doubled
      Claroty's size and expanded its addressable market. By March 2024, at the time of a $100 million strategic
      growth financing, Claroty reported having raised $635 million cumulatively, implying a Series E of
      approximately $400 million occurred between mid-2021 and early 2024.


      The January 2026 Series F of $150 million, led by Golub Growth with up to $50 million of additional
      participation from existing investors, brought the cumulative total to approximately $885 million per CRN
      or roughly $900 million per SecurityWeek. Golub Growth is an affiliate of Golub Capital and is known as
      a late-stage pre-IPO lender, making its lead position a material signal about Claroty's trajectory.
      The company has never publicly confirmed its valuation. Calcalist reported a valuation of approximately
      $3 billion following the Series F, representing an approximately 20% increase from the previously reported
      $2.5 billion post-money mark from March 2024. SecurityWeek noted that Claroty confirmed an 80% increase
      in valuation since March 2024, which is mathematically inconsistent with a $3 billion estimate if the
      March 2024 baseline was $2.5 billion — suggesting either a higher actual valuation or that the March 2024
      reference figure was overstated. This discrepancy is unresolved and is a material diligence item.


      CEO Yaniv Vardi told Calcalist that Claroty aspires to go public and could pursue an IPO as early as 2027
      if market conditions align. Key investors include Bessemer Venture Partners (David Cowan), SoftBank
      (Amit Lubovsky), Team8 (Yuval Shachar), Golub Capital (Robert Tuchscherer), NightDragon (Dave DeWalt),
      Standard Investments (Peter Marturano), MoreVC (Meir Ukeles), Istari (Rossa Shanks), and Rockwell
      Automation (John Miller). The investor mix signals both financial return orientation and strategic
      alignment with Claroty's industrial and defense customer base.
