  - id: section-2
    title: Founders, leadership, and governance
    body: >
      Claroty was co-founded in 2015 by Galina Antova, Amir Zilberstein, and Benny Porat inside the Team8 cyber
      foundry. Antova and Zilberstein continue to serve on the board of directors, providing founder-market fit
      continuity in a company led by an external CEO. Yaniv Vardi has served as Chief Executive Officer since
      joining from outside the founding team and is the primary public face for strategic announcements including
      the Series F round and IPO commentary.


      The executive leadership team as of May 2026 includes Yaniv Vardi (CEO), Udi Bar Sela (CFO/COO), Grant Geyer
      (Chief Strategy Officer, previously CPO), Yoram Gronich (Chief Product Officer, appointed June 2024), Gil Gur
      Arie (CPO hired in January 2026 from Ford Motor Company's AI function), Upa Campbell (CMO), and James Love
      (CRO). The dual CPO appointment reflects a transition in product leadership: Gronich was hired in June 2024
      from Tufin/Symantec/Check Point backgrounds, while Gil Gur Arie joined to lead the AI-oriented CPS Library
      initiative. The press release announcing the Series F also notes the appointment of retired U.S. Air Force
      Colonel Jen Sovada to lead the public sector team.


      The board of directors is chaired by Dave DeWalt, founder and CEO of NightDragon, who assumed the chairman
      role in November 2025. DeWalt brings more than 20 years of cybersecurity operating experience including
      the Intel acquisition of McAfee for $7.7 billion. Additional board members confirmed in public filings and
      press releases include co-founders Galina Antova and Amir Zilberstein, David Cowan (Bessemer Venture
      Partners), Amit Lubovsky (SoftBank), Yuval Shachar (Team8), Robert Tuchscherer (Golub Capital), Meir
      Ukeles (MoreVC), Rossa Shanks (Istari), Peter Marturano (Standard Investments), and John Miller (Rockwell
      Automation). The breadth of strategic board members — a defense/government-oriented investor (Istari),
      an industrial automation vendor (Rockwell), and a late-stage growth equity firm (Golub) — reflects
      Claroty's multi-vertical strategy and pre-IPO capital structure.
