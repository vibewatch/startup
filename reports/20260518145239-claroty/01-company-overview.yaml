company:
  name: Claroty
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Claroty is a New York City-based cyber-physical systems (CPS) protection company founded in 2015 within the
    Team8 cyber foundry. The company provides an enterprise platform covering asset visibility, exposure management,
    network protection, secure access, and threat detection for operational technology, IoT, and connected medical
    devices across industrial, healthcare, commercial, and public-sector verticals. Following a January 2026 Series F
    round of $150 million led by Golub Growth — bringing total disclosed capital to roughly $885–900 million — Claroty
    reports more than 1,000 customers including 24 Fortune 100 companies, has been named a Gartner Magic Quadrant
    Leader for CPS Protection Platforms in 2025 and 2026, and is pursuing a potential IPO as early as 2027.

sections:
  - id: section-1
    title: Identity, mission, and operating model
    body: >
      Claroty describes itself as the cyber-physical systems (CPS) protection company. Its mission is to safeguard
      mission-critical infrastructure by securing the technology that underpins society's most important operations.
      The company's platform spans four principal solution pillars: exposure management, network protection, secure
      access, and threat detection, delivered either as a cloud-based SaaS offering (Claroty xDome) or as an
      on-premise deployment (Claroty Continuous Threat Detection, CTD). Both deployment modes are supported by the
      Claroty CPS Library, an AI-powered asset catalogue launched alongside the Series F round that provides
      granular visibility into CPS assets and vulnerability attribution.


      The company targets four verticals: industrial (manufacturing, oil and gas, utilities), healthcare
      (connected medical devices), commercial buildings, and public sector (critical infrastructure and defense).
      The unified platform approach is deliberate: Claroty argues that fragmented point solutions cannot address
      the ownership gap between IT and OT teams, the skills shortage in cyber-physical security, or the absence
      of a maturity model. By providing a single platform that converges OT, IoT, and medical IoT security,
      the company positions itself as the consolidating force in a market that peers such as Nozomi Networks
      (acquired by Mitsubishi Electric for roughly $1 billion in 2025) and Armis (acquired by ServiceNow
      for $7.75 billion in 2025) exited through strategic sale. Claroty's stated intention as of early 2026
      is to pursue an independent IPO rather than a strategic sale.


      The company was incubated inside Team8, the Israeli cyber foundry that has produced several enterprise
      cybersecurity companies. Claroty was formally founded in 2015, headquartered in New York City, and maintains
      a global footprint across North America, Europe, the Middle East, Africa, and Asia-Pacific with over 700
      employees in 27 countries as of mid-2025.
