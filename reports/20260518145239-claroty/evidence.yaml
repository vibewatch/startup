      provisions are not disclosed. The Series B, C, and E investor names are not individually confirmed in public
      sources.
    whyItMatters: >-
      Cap table structure determines preference overhang at IPO, potential dilution from anti-dilution provisions, and
      investor alignment around a public offering.
    diligencePath: >-
