evidenceGaps:
  - type: no-public-evidence
    severity: minor
    topic: Platform technical architecture depth — comparison to Nozomi and Armis not available
    missingEvidence: >-
      Detailed technical architecture documentation for the Claroty Platform (how asset visibility, threat detection,
      and secure access work mechanically) is not available publicly. No independent technical comparison to Nozomi
      Networks or Armis architectures exists in public sources.
    whyItMatters: >-
      Technical architecture determines deployment complexity, integration requirements, and the depth of vendor lock-in
      — all material factors in enterprise CPS security procurement decisions.
    diligencePath: >-
      Request technical architecture deep-dives and integration documentation under NDA. Obtain full Gartner or
      Forrester evaluation reports. Interview reference customers on deployment experience.
    relatedQuestionRefs:
      - QO008
      - QO019
  - type: private-evidence-only
    severity: major
    topic: ARR and revenue beyond 2023 are not publicly confirmed
    missingEvidence: >-
      Claroty's last publicly confirmed ARR figure is ">$100M in 2023" from the March 2024 press release. No 2024 or
      2025 ARR, revenue, or growth rate has been disclosed in public sources.
    whyItMatters: >-
      Without a current ARR figure, the Series F valuation of ~$3B cannot be benchmarked against a revenue multiple.
      Current growth rate is a primary input to any pre-IPO valuation model.
    diligencePath: >-
      Request audited or management-prepared financials for FY2023–FY2025 including ARR, net revenue retention, gross
      margin, and operating cash flow.
    relatedQuestionRefs:
      - QO013
  - type: no-public-evidence
    severity: minor
    topic: xCelerate partner program scope and channel economics not disclosed
    missingEvidence: >-
      Claroty does not publicly disclose the number of active partners in its xCelerate program, channel revenue as a
      percentage of total ARR, or partner tier economics. Only program existence and KLAS recognition are confirmed.
    whyItMatters: >-
      Channel economics and partner concentration matter for GTM scalability and ARR quality in a pre-IPO diligence
      context.
    diligencePath: >-
      Request partner program breakdown: number of MSSPs, VARs, SIs, and technology partners; channel ARR percentage;
      and top-10 channel partner revenue contribution.
    relatedQuestionRefs:
      - QO023
  - type: no-public-evidence
    severity: minor
    topic: Leadership and founder table — full executive roster partially public
    missingEvidence: >-
      While the senior executive team and board are largely documented through press releases, full VP-level management,
      compensation structures, equity holdings, and organizational depth below the C-suite are not publicly available.
    whyItMatters: >-
      Management depth and equity alignment are key-person risk factors; compensation and equity structure affects
      IPO-related vesting and lockup dynamics.
    diligencePath: >-
      Request management org chart, compensation structure, and equity cap table from the company under NDA. Supplement
      with LinkedIn research on VP-level and below.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO007
  - type: no-public-evidence
    severity: minor
    topic: Stakeholder or investor map — round-by-round ownership and cap table not public
