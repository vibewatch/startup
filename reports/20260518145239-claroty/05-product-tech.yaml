  - id: integrations-ecosystem
    title: Integration Ecosystem and Technology Alliances
    body: >-
      Claroty's integration strategy follows a "CTAP" (Claroty Technology Alliance Program) certification
      framework. Integration categories cover: SIEM/SYSLOG export (IBM QRadar, Microsoft Sentinel, Splunk,
      ArcSight), SOAR/ticketing (ServiceNow, PagerDuty, Jira), firewall and NAC (Palo Alto Networks,
      Fortinet, Cisco, Claroty segmentation policies), endpoint/EDR (CrowdStrike Falcon, Microsoft Defender
      for Endpoint — used for OT asset enrichment), vulnerability management (Tenable, Rapid7), and
      OEM-level device enrichment (Rockwell Automation AssetCentre, Schneider Electric, Siemens Healthineers).
      The xDome platform embeds in-app orchestration for EDR, cloud, and SNMP integrations, and is
      configurable from the same recommendations page used for visibility scoring.


      The Rockwell Automation integration is a flagship example: Rockwell customers gain Claroty's vulnerability
      and threat intelligence enrichment within Rockwell's FactoryTalk AssetCentre, enabling OT teams to act
      on security recommendations without switching consoles. Schneider Electric contributed device data to the
      CPS Library at launch. The Siemens Healthineers partnership for healthcare xDome gives xDome users
      access to manufacturer-curated MDS2, SBOM, and VEX remediation guidance. Claroty classifies these
      relationships as CTAP Certified and notes that the integration is "built and supported by" either Claroty
      or the partner, providing clarity on support ownership.


      On the discovery and data-collection side, xDome integrates with CMMS systems in healthcare, Active
      Directory/LDAP for user identity attribution, and endpoint agents via EDR integrations (CrowdStrike
      Falcon, Microsoft Defender) to enrich OT asset profiles with process-level context. The CPS Library's
      MCP Server enables generative AI tools (customer-selected large language models) to query CPS security
      data using natural-language interfaces, positioning Claroty ahead of most OT peers in enterprise AI
      workflow integration. The Claroty xDome platform also integrates with Cisco industrial switches and
      firewalls for active network traffic visibility and policy enforcement points.
