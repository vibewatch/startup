  - id: technical-risks
    title: Technical Risks and Limitations
    body: >-
      Several technical risks merit scrutiny. First, the SRA authentication bypass CVE (patched October 2025
      per Dark Reading reporting) demonstrated that the most critical access-control component of the platform
      had a high-severity vulnerability. While patched, SRA's position as a gateway into OT networks means
      any future SRA vulnerability could become a highly attractive attack vector; continuous security
      assurance processes for SRA are a key diligence item. Second, the passive-first discovery philosophy —
      while operationally safe — means that assets not broadcasting on monitored segments, air-gapped
      equipment, and firmware-only devices may remain invisible without supplementary Safe Queries or Edge
      deployments. Customers managing heterogeneous, multi-site environments frequently find that achieving
      complete asset inventory requires combining all four discovery methods, adding deployment complexity.


      Third, the platform's SaaS (xDome) mode requires cloud connectivity that some OT environments with
      strict data residency requirements cannot accommodate; CTD on-premises fills this gap but has higher
      TCO. Fourth, Claroty's CPS Library AI accuracy depends heavily on OEM partnership coverage — devices
      from vendors outside the Rockwell/Schneider/Siemens-Healthineers consortium may receive lower-quality
      attribute resolution until additional partnerships are onboarded. Fifth, the breadth of the integration
      catalog (SIEM, SOAR, EDR, NAC, vulnerability management) is technically sound but requires dedicated
      implementation effort; customers without mature IT security operations teams may find the integration
      surface overwhelming rather than additive. Finally, with 145 GitHub followers and niche tool engagement,
      the broader developer community is smaller than IT-native security vendors, limiting crowd-sourced
      feedback loops that could accelerate feature roadmap validation.
    claimRefs:
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035

