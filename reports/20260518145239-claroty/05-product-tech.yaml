  - id: product-modules
    title: Product Modules, Use Cases, and Verticals
    body: >-
      Claroty segments its go-to-market around four verticals — industrial, healthcare, commercial buildings, and
      public sector — each with a tailored solution overlay on the common platform. The industrial vertical
      (manufacturing, oil and gas, utilities, pharma) is the company's largest and relies on CTD or xDome for
      deep OT asset visibility plus xDome Secure Access for engineer and vendor remote access. The healthcare
      vertical is addressed via Claroty xDome for Healthcare, a modular SaaS solution that adds clinical-context
      enrichment for Internet of Medical Things (IoMT) devices: IV pumps, patient monitors, infusion systems,
      smart HVAC, and other connected clinical assets. Healthcare-specific differentiators include integration with
      Computerized Maintenance Management Systems (CMMS), support for MDS2 (Manufacturer Disclosure Statement for
      Medical Device Security), SBOM, and VEX (Vulnerability Exploitability eXchange) files from medical device
      OEM partners, and a Siemens Healthineers technology partnership that adds manufacturer-curated vulnerability
      and mitigation guidance directly within xDome workflows.


      The commercial buildings vertical targets data centers, retail, hospitality, and campus environments where
      Building Management Systems (BMS), HVAC, and physical access controllers create an often-overlooked CPS
      attack surface. Claroty's public sector overlay adds specific compliance mappings for NERC CIP (electric
      utilities), CISA BOD 26-02 (edge device replacement in federal networks), NIST CSF, and other federal
      frameworks, and includes an xDome for Government variant. In all verticals, the compliance and reporting
      module automates evidence collection and generates audit-ready reports for frameworks including NIS2,
      NERC CIP, IEC 62443, HHS Section 405(d), and NIST CSF.


      The xDome Secure Access module (formerly Claroty SRA) delivers zero-trust remote access into OT/ICS
      networks. It enforces granular per-device access policies, session recording, just-in-time credential
      vaulting, and multi-factor authentication — compensating controls for environments where unpatched legacy
      PLCs cannot natively enforce authentication. The Gartner 2026 Market Guide for CPS Secure Remote Access
      named Claroty a Representative Vendor, confirming market visibility in this segment. However, a critical
      authentication bypass vulnerability (CVE, October 2025) was discovered and patched in the SRA product,
      underscoring that the access layer itself has been a target and requires rigorous security assurance.
