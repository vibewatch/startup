callouts:
  - calloutType: strength
    title: Deep Protocol Library and Team82 Research Moat
    body: >-
      Claroty's 450+ protocol coverage and Team82's 750+ ICS CVE disclosures represent a multi-year,
      capital-intensive research investment that creates durable competitive differentiation. No peer
      OT vendor has matched this combination of in-house vulnerability research, open-source tools,
      and OEM-backed device enrichment.
    claimRefs:
      - CE016
      - CE017
      - CE021

  - calloutType: risk
    title: SRA Authentication Bypass CVE Signals Product Security Risk
    body: >-
      A critical authentication bypass vulnerability patched in Claroty's Secure Remote Access solution
      (October 2025) highlights that the access gateway — the highest-value target in Claroty's portfolio —
      has been a vulnerability surface. Buyers should require a post-patch security audit, penetration
      test results, and a published CVE remediation timeline before deploying SRA in critical OT segments.
    claimRefs:
      - CE031
      - CE032

  - calloutType: insight
    title: CPS Library AI Is a Meaningful Step-Change in Asset Identification Accuracy
    body: >-
      The November 2025 CPS Library launch addresses a systemic OT security failure: 88% of CPS devices
      not transmitting exact product codes and 76% transmitting names differing from vendor records. The
      LLM-RAG + OEM-partnership approach is technically sound and, if coverage expands beyond Rockwell/
      Schneider/Siemens, could become a durable platform advantage driving faster time-to-value.
    claimRefs:
      - CE004
      - CE006
      - CE034

