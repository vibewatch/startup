  - id: strengths-differentiators
    title: Key Strengths and Differentiators
    body: >-
      Claroty's primary technical differentiators are protocol depth, research investment, and platform
      breadth. The 450+ protocol library — built over a decade and continuously extended through Team82's
      reverse-engineering work — is the most consistently cited moat in analyst and customer evaluations.
      Gartner Peer Insights for the CPS Protection Platforms market showed a score of 4.9/5 based on 119
      ratings with a 97% "Would Recommend" score as of March 2026, reflecting strong implementation
      satisfaction. The company was named a Leader in the 2026 Gartner Magic Quadrant for CPS Protection
      platforms (second consecutive year) and a Representative Vendor in the 2026 Gartner Market Guide
      for CPS Secure Remote Access. The Forrester Wave for IoT Security Solutions Q3 2025 similarly placed
      Claroty in the Leader band.


      The CPS Library and AI-powered asset identification pipeline represent the most differentiated recent
      product investments. By embedding LLM-RAG and statistical inference modeling, Claroty converts
      fragmented OT protocol broadcasts into deterministic, vendor-verified device identities at scale —
      solving a problem that has historically required weeks of manual reconciliation per site. The platform's
      coverage of all four major CPS verticals (industrial, healthcare, commercial, public sector) with
      vertical-specific compliance mappings and partner integrations is also difficult for point-solution
      vendors to replicate quickly. Team82's open-source toolchain and coordinated disclosure discipline
      reinforces the technical credibility of the platform's detection capabilities.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
