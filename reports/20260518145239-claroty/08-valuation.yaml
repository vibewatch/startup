- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Ask
  - Priority
  - Rationale
  rows:
  - - Current ARR
    - Provide monthly ARR bridge from FY2023 through current quarter plus pipeline conversion.
    - Critical
    - Validates whether a $3B entry is 20x, 25x, or 30x+ ARR.
  - - Cap table
    - Deliver full preference stack, liquidation waterfall, and any structured-credit seniority terms.
    - Critical
    - Real return can diverge sharply from enterprise value when nearly $900M has been raised.
  - - Margins and retention
    - Disclose gross margin, NRR, churn, and payback by product line.
    - High
    - Determines whether Claroty deserves a premium cyber multiple or only a mature-platform multiple.
  - - IPO readiness
    - Share board-approved IPO milestones, required audit work, and 2027 gating assumptions.
    - High
    - Clarifies whether Golub's capital is truly pre-IPO or merely bridge capital.
  - - Hidden liabilities
    - Confirm debt, covenants, side letters, redemption rights, and any investor protections tied to Series F.
    - High
    - These can subordinate new investors or constrain exit timing.
