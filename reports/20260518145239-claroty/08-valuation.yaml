company:
  name: Claroty
chapter:
  number: 8
  title: Valuation
  summary: 'Claroty''s valuation case is credible only as a range, not as a confirmed price. Public evidence supports a conditional stance: category growth, analyst leadership, and >1,000-customer scale can justify premium outcomes, but the company still has not disclosed current ARR, the absolute Series F valuation, or the preference stack attached to nearly $900 million of cumulative capital. Using a $120 million working ARR case, the reported ~$3 billion mark implies roughly 25x ARR and the 80% uplift math implies roughly 38x, which is rich versus mature public comps unless 2026 growth is materially stronger than the stale public record shows.'
sections:
- id: VS01
  title: Recommendation and investment thesis
  body: 'Claroty is investable on strategic importance but not yet on evidence completeness. The bull thesis is straightforward: the OT and broader cyber-physical security category is still growing at a double-digit rate, Claroty retains third-party analyst leadership, and the company now reports more than 1,000 customers including 24 Fortune 100 accounts. The Series F lead by Golub Growth also matters because it looks like late-stage positioning for a public-market process rather than an emergency rescue round. Those points support continued tracking and can justify a premium to slower, mature cyber platforms.


    The anti-thesis is just as important. Claroty still has not published a current ARR figure, any gross-margin or retention data, or the absolute valuation attached to its January 2026 financing. That means the valuation story depends on secondary reporting and inference. The recommendation is therefore conditional rather than enthusiastic: public evidence supports monitoring and potentially buying only with strict entry discipline, not paying any reported price as if it were fully verified. The right stance is research more, verify the cap table and ARR bridge, and only underwrite upside once valuation opacity narrows materially.'
