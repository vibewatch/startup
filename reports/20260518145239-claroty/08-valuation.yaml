  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-f-absolute-valuation
    missingEvidence: Authoritative confirmation of Claroty's absolute post-Series-F valuation from a term sheet, board consent, investor letter, or company statement.
    whyItMatters: The chapter can frame a reasonable valuation range, but the difference between ~$3B and the implied ~$4.5B changes entry discipline materially.
    diligencePath: Request the executed Series F term sheet or board financing materials and confirm whether the 80% uplift was measured from a $2.5B, lower, or higher baseline.
    relatedQuestionRefs:
    - QV003
  - type: stale
    severity: material
    topic: current-arr
    missingEvidence: A monthly or quarterly ARR bridge from FY2023 through the most recent completed quarter, including net new ARR and churn.
    whyItMatters: Every multiple in the valuation chapter is highly sensitive to whether Claroty is a ~$120M, ~$150M, or ~$200M ARR business today.
    diligencePath: Request current management reporting or investor deck revenue tabs; if unavailable, wait for S-1 style disclosure or audited lender diligence materials.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV003
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack-and-waterfall
    missingEvidence: Complete cap table, liquidation preferences, anti-dilution terms, any private-credit seniority, and a waterfall model across $2B to $8B exits.
    whyItMatters: Without the waterfall, investors cannot translate enterprise value into actual equity proceeds, especially after nearly $900M of cumulative capital.
    diligencePath: Request cap-table export, financing documents, and legal summaries of side letters or redemption rights from the Series E-II and Series F rounds.
    relatedQuestionRefs:
    - QV022
    - QV023
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage gap
    missingEvidence: Refreshed public valuation and revenue references for Dragos and any additional late-2025 to 2026 OT security private transactions.
    whyItMatters: The comparable set is decision-useful today, but it is not exhaustive enough to pin a single-point valuation on Claroty.
    diligencePath: Expand the comp set with fresh Dragos transaction data, secondary marks, or additional strategic OT security M&A once public evidence becomes available.
