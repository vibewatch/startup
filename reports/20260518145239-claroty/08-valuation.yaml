- id: VS05
  title: Exit readiness, thesis-breaks, and final diligence asks
  body: 'Claroty looks operationally exit-ready. It has late-stage capital, analyst recognition, enterprise-scale customer logos, and a management team already talking publicly about a 2027 IPO. What it does not yet have is public-markets disclosure readiness. Investors still lack a current ARR bridge, current growth rate, gross-margin profile, retention data, and the cap-table details required to turn enterprise value into actual equity returns. That gap is exactly why the final diligence list is short but critical: verify revenue quality, verify the waterfall, verify any senior or structured instruments, and verify the board''s actual IPO plan rather than relying on media paraphrase.


    The clearest thesis-breaks follow directly from those missing items. A financing below the 2024 mark, evidence that ARR is still close to $100 million, or a cap table showing common equity receives little value below a $4 billion exit would each materially weaken the case. So would a cybersecurity IPO market that remains effectively shut through 2027. Until those questions are answered, the best-supported conclusion is not that Claroty is overvalued at any price, but that the public record is too incomplete to justify paying a late-stage premium without stronger diligence rights.'
