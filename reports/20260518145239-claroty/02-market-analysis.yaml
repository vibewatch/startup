chapter:
  number: 2
  title: Market Analysis
  summary: >
    The global OT/CPS security market is projected to reach approximately $50 billion by 2030 (CAGR ~16.5%), driven by
    rising nation-state and ransomware attacks on critical infrastructure, regulatory mandates (NERC CIP, NIS2, TSA
    directives), and IT/OT convergence expanding the attack surface. Claroty operates in a well-defined CPS Protection
    Platform segment validated by both Gartner and Forrester. Buyers sit across energy, manufacturing, healthcare, water,
    and transportation verticals, with compliance and operational-disruption risk as the dominant adoption triggers.
    A significant OT cybersecurity skills shortage constrains adoption speed and inflates professional-services demand.

sections:
  - id: market-boundary
    title: Market Boundary — CPS / XIoT / OT Security
    body: >
      The addressable market for Claroty is best defined as Cyber-Physical Systems (CPS) security, the category
      formalised by Gartner's CPS Protection Platforms Magic Quadrant (2025). It spans three converging segments:
      Operational Technology (OT) / Industrial Control Systems (ICS) security — protecting PLCs, RTUs, DCS,
      SCADA, and field devices in energy, manufacturing, water, and transportation; Healthcare OT (HTM) security —
      securing medical devices, clinical networks, and building management systems in hospital settings; and Extended
      IoT (XIoT) — enterprise-grade IoT devices that sit at the intersection of IT and OT, including smart building
      controllers, logistics sensors, and connected industrial equipment.

      Excluded from this definition is generic enterprise IT security (endpoint detection, SIEM for IT traffic,
      traditional firewalls without OT protocol awareness) and consumer IoT. The status-quo substitute for dedicated
      OT security tooling is manual inventory spreadsheets, periodic physical audits, and standard IT security
      tools applied without OT-specific protocol intelligence — all of which leave critical infrastructure
      systematically blind to active asset exposures.

      CISA oversees 16 critical infrastructure sectors, almost all of which include OT or CPS components. NIST
      SP 800-82 Rev.3 (2023) is the authoritative federal guide for securing these environments, and ISA/IEC 62443
      provides the global consensus standard for industrial automation cybersecurity, endorsed by the United Nations
      and applied across 20+ industries. This regulatory scaffolding is a primary demand signal, not just a
      compliance checkbox: organisations that lack an ISA/IEC 62443-aligned security programme face increasing
      procurement, insurance, and regulatory risk.
    claimRefs: [CM001, CM007, CM008, CM011, CM012, CM013]
    tableRefs: [TM001]

  - id: market-sizing
    title: Market Sizing — Multiple Lenses with Explicit Caveats
    body: >
      Third-party analysts project the OT/ICS/CPS security market with materially different numbers depending on
      scope definition. MarketsandMarkets (April 2025 report) estimates the global OT Security market at
      approximately $25 billion in 2025, growing to $50.29 billion by 2030 at a CAGR of 16.5%. This covers network
      security, asset discovery, vulnerability management, IAM, data security, and managed services for OT
      environments across all verticals. The US sub-market is sized at $4.64 billion in 2025 growing to
      $9.37 billion by 2030 (CAGR 15.1%); Europe at $5.70 billion growing to $11.93 billion (CAGR 15.9%).

      SNS Insider (cited via news aggregator) puts the ICS Security market at $41.82 billion by 2033, implying
      a tighter product scope than the OT Security umbrella but still a double-digit CAGR. Precedence Research
      projects "OT Security" at $122.22 billion by 2034 using a broader definition that likely captures adjacent
      network and cloud security spend for OT environments. Analysts do not consistently include or exclude
      managed detection and response, IT/OT converged platforms, or government-sector spend, making direct
      comparison unreliable.

      A bottom-up SAM construction for Claroty would narrow from the global TAM to: (1) sectors where CPS
      platforms have meaningful penetration — energy, manufacturing, healthcare, water, transportation; (2)
      geographies where Claroty has regulatory and channel reach; and (3) organisations large enough to justify
      a platform purchase. This author-estimated SAM is approximately $10–15 billion by 2030, with a SOM
      in the $3–5 billion range depending on competitive share and expansion of the XIoT platform. These
      estimates carry low confidence and should be validated against Claroty's ARR trajectory and vertical
      win data.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM031]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: vertical-segments
    title: Vertical Segments — Threat Exposure and Regulatory Pressure by Industry
    body: >
      Energy and utilities represent the most mature and heavily regulated OT security segment. NERC CIP standards
      mandate cybersecurity protections for bulk electric system (BES) assets across North America, creating a
      compliance-driven budget floor. Nation-state threat actors — including Russian APT groups flagged by Latvia's
      SAB and documented by CISA advisories — actively target grid infrastructure, transforming compliance spend
      into genuine security investment. MarketsandMarkets covers this sector with a dedicated ICS Security in
      Energy and Power report, indicating analyst recognition of sector-specific market dynamics.

      Manufacturing faces a different threat profile dominated by ransomware: operational disruption, supply-chain
      extortion, and insurance requirements are the dominant adoption triggers. The Purdue model of network
      segmentation is increasingly inadequate as OT environments connect to ERP systems and cloud analytics.

      Healthcare OT is the fastest-growing regulated segment. HHS has issued HIPAA-aligned cybersecurity guidance
      requiring covered entities to address medical device and clinical network security. FDA's medical device
      security guidance further strengthens the compliance driver, while patient-safety consequences of a
      compromised infusion pump or MRI controller elevate organisational willingness to pay.

      Water and wastewater operators, despite smaller individual budgets, face active threats documented by
      WaterISAC (Water Information Sharing and Analysis Center) and EPA guidance. Transportation, including
      maritime and rail OT, is subject to TSA cybersecurity directives: the US Coast Guard mandated
      cybersecurity training for all IT/OT personnel by January 2026.
    claimRefs: [CM014, CM015, CM016, CM024, CM025, CM026, CM027, CM028, CM029, CM030]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: buyer-landscape
    title: Buyer, User, and Payer Landscape
    body: >
      Buying authority for OT security platforms varies by vertical and by the maturity of the buyer's security
      organisation. In energy and utilities, the CISO and VP of Operations jointly evaluate solutions, with
      procurement typically routed through an IT security or technology capital budget. In manufacturing,
      the plant manager or IT manager often drives the evaluation, with the CFO or CTO approving spend. Healthcare
      buyers are typically CISOs working alongside Biomedical Engineering or Healthcare Technology Management
      (HTM) teams, with hospital CFOs controlling approval. Water utilities and municipalities often have a
      single IT director wearing security responsibility, with funding tied to infrastructure grants and utility
      board approval cycles.

      Users of OT security platforms are OT security analysts, plant engineers, or SOC operators — staff who
      may have limited cybersecurity background but deep process-domain expertise. The tension between OT
      domain knowledge and security expertise is a structural adoption constraint: the same SANS 2026 survey
      found that 60% of organisations cite skills gaps as the primary OT cybersecurity challenge, and 42% say
      those gaps prevent adoption of new security technologies.

      Payers are therefore not purely motivated by security ROI. Compliance mandates, cyber insurance
      requirements, and operational resilience objectives are the dominant budget justifications. Professional
      services revenue — integration, deployment, and managed detection — often exceeds software licence value
      in early-stage OT security engagements, reflecting the brownfield complexity of the environments.
    claimRefs: [CM019, CM020, CM035, CM036, CM037, CM039]
    tableRefs: []

  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The primary growth driver is the accelerating frequency and severity of attacks on critical infrastructure.
      Google's Cybersecurity Forecast 2026 warns that ICS/OT risks are escalating from both cybercrime and
      nation-state actors. Maritime OT cyberattacks surged 150% in 2025 per Cydome research. CISA's Known
      Exploited Vulnerabilities catalog regularly includes OT/ICS product CVEs, driving urgency in asset owners.

      Regulatory tailwind is a compounding driver: NERC CIP, the EU NIS2 Directive, TSA cybersecurity directives,
      FDA medical device guidance, and CISA's Secure by Demand guidance for OT asset procurement are collectively
      raising the compliance floor for every critical infrastructure vertical. SANS 2026 data shows regulatory
      influence on OT security hiring surged from 40% to 95% of organisations in one year — a leading indicator
      of budget allocation.

      IT/OT convergence is the structural driver: as industrial environments adopt IIoT, cloud analytics, and
      remote access for maintenance, the OT attack surface expands dramatically, requiring purpose-built security
      rather than IT tools adapted for OT protocols.

      The dominant constraint is a structural OT security skills shortage. SANS 2026 reports 27% of organisations
      have experienced breaches directly linked to capability gaps, and 42% say those gaps prevent adoption of
      new security technologies. This simultaneously creates demand for managed OT SOC services and slows
      self-operated platform deployments. Long procurement cycles (12–36 months in critical infrastructure),
      operational risk aversion during deployment, and budget competition between IT and OT security programmes
      further constrain adoption velocity.
    claimRefs: [CM019, CM020, CM021, CM023, CM024, CM025, CM032, CM033, CM034, CM038, CM039, CM040]
    tableRefs: [TM004]
    figureRefs: [FM004]

