callouts:
  - calloutType: insight
    title: Wide Analyst Range Reflects Scope Ambiguity, Not Market Immaturity
    body: >
      OT/ICS/CPS security market estimates span $41.82 billion (SNS Insider by 2033) to $122 billion (Precedence
      Research by 2034) — a 3x range. This divergence reflects definitional ambiguity: narrower estimates
      count only OT-specific tools while broader ones include general network and cloud security products layered
      onto OT environments. Investors should demand that any cited TAM include an explicit scope definition before
      comparing estimates. Claroty's SAM is better anchored to Gartner's CPS Protection Platforms category
      (validated by Magic Quadrant existence) than to any single analyst's headline number.
    claimRefs: [CM031, CM001, CM005, CM006]

  - calloutType: strength
    title: Multi-Sector Regulatory Tailwind Creates Durable Demand Floor
    body: >
      NERC CIP (electric utilities), NIS2 (EU critical infrastructure), TSA cybersecurity directives
      (pipelines and transportation), FDA medical device guidance, and CISA's Secure by Demand OT
      procurement guidance collectively mandate or strongly incentivise OT security investment across
      all five of Claroty's priority verticals. SANS 2026 data shows regulatory influence on OT security
      hiring surged from 40% to 95% of organisations in one year. This compliance-driven demand is
      structurally different from discretionary security spending: it persists through budget cycles.
    claimRefs: [CM014, CM015, CM016, CM020, CM029, CM030]

  - calloutType: risk
    title: OT Skills Shortage Creates Adoption Ceiling Without Managed Services
    body: >
      The 2026 SANS Institute survey of 947 global respondents finds 60% of organisations cite
      OT cybersecurity skills gaps as their primary workforce challenge, and 27% report breaches linked
      to those gaps. For self-operated OT security platforms, this is a structural adoption constraint:
      buyers may be unable to operationalise the technology even after procurement. Claroty's long-term
      growth thesis requires either a managed OT SOC offering, a simplified operational workflow, or
      heavy partner ecosystem enablement to convert compliance urgency into realised platform value.
    claimRefs: [CM019, CM020, CM021, CM039]

  - calloutType: assumption
    title: SAM and SOM Are Author-Estimated; Treat as Directional
    body: >
      The SAM (~$10–15 billion by 2030) and SOM (~$3–5 billion by 2030) estimates in this chapter
      are derived by the author from Claroty's stated vertical priorities, geographic presence, and
      Gartner/Forrester positioning. No primary analyst source has published a Claroty-specific
      addressable market figure. These estimates should be updated when Claroty provides segment-level
      ARR data or when Gartner publishes market share data for the CPS Protection Platforms category.
    claimRefs: [CM017, CM018]

