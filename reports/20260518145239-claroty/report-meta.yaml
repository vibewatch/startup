companyProfile:
  summary: >
    Claroty is a New York City-headquartered cyber-physical systems security company founded in 2015 inside the
    Team8 cyber foundry. Its platform spans asset discovery and visibility, exposure and vulnerability
    management, network protection, threat detection, secure remote access, and healthcare-focused xDome
    offerings for industrial, healthcare, commercial, and public-sector environments. Claroty reported more than
    1,000 customers and 24 Fortune 100 accounts by early 2026, reached more than $100 million in ARR during
    2023, and raised a $150 million Series F in January 2026 led by Golub Growth after a $100 million 2024
    growth round. The company appears operationally ready for a 2027 IPO or strategic exit, but private-company
    disclosure remains limited around current ARR, margins, retention, burn, and the cap-table preference stack.
