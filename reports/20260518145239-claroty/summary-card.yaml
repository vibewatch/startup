  topStrengths:
    - >-
      Claroty has achieved enterprise scale in OT/CPS security with more than 1,000 customers and 24 Fortune 100
      accounts across critical infrastructure and healthcare.
    - >-
      The platform spans visibility, vulnerability and exposure management, threat detection, secure remote access, and
      healthcare xDome workflows, supported by a strong partner ecosystem.
    - >-
      Recent Golub Growth-led Series F financing, analyst recognition, and broad vertical reach make a 2027 IPO or
      strategic-exit path credible.
  topRisks:
    - >-
      The company still does not disclose current ARR, growth, margins, retention, burn, or cap-table preference terms,
      making equity-return underwriting unusually opaque.
    - >-
      Reported valuation math is inconsistent: a commonly cited ~$3 billion mark does not reconcile with the company's
      statement that valuation rose 80% from the March 2024 round.
    - >-
      OT-security market consolidation and megavendor bundling can pressure Claroty's standalone multiple and lengthen
      already complex enterprise sales cycles.
  unresolvedGaps:
    - >-
      Current ARR, revenue growth, gross margin, net retention, and burn remain undisclosed; public evidence only
      confirms ARR exceeded $100 million in 2023.
    - >-
      The absolute Series F valuation and liquidation-preference stack are not public, so headline enterprise value may
      overstate common-equity value.
    - Customer concentration, renewal behavior, and vertical-level ARR mix are not publicly disclosed.
