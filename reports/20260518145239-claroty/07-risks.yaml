- id: product-technical-security-risks
  title: Product, Technical & Security Risks
  body: 'Claroty''s platform occupies a privileged network-visibility position inside critical-infrastructure OT environments. This positioning is both the source of its competitive value and its primary
    product-security liability: any vulnerability in Claroty''s sensors, management servers, or cloud connectors that permits lateral movement into the underlying OT network would represent a severe breach
    of customer trust and an acute regulatory event.


    The most significant disclosed product-security incident to date is the authentication-bypass vulnerability in Claroty''s Continuous Threat Detection product. This vulnerability, if exploited before
    patching, would have permitted unauthenticated administrative access to customer OT network visibility data. Claroty addressed the issue through its responsible-disclosure process, but the incident
    illustrates the category of risk that any OT security platform faces: the product designed to protect OT networks must itself be hardened against the adversaries it is designed to detect.


    Team82''s proactive vulnerability research creates a secondary risk surface. While the research unit is a meaningful brand differentiator, its regular publication of third-party ICS vulnerability disclosures
    attracts attention from nation-state and criminal actors who monitor CVE publications to identify exploitable windows in legacy OT environments. CISA''s Known Exploited Vulnerabilities catalog listed
    1,592 actively exploited vulnerabilities as of May 2026, illustrating how consistently the gap between disclosed vulnerabilities and customer remediation capacity is exploited. A zero-day in a widely
    deployed component of Claroty''s own platform would test whether the responsible-disclosure cycle protects customers or inadvertently expands the attack surface.


    Brownfield deployment complexity is an underappreciated operational risk. Many legacy ICS environments use outdated operating systems that cannot be patched, lack encryption or authentication protocols,
    and require weeks of professional-services effort before Claroty sensors can be deployed reliably. Failures in complex brownfield deployments—such as sensor incompatibilities, false-positive alert storms,
    or partial coverage gaps—extend sales cycles, delay ARR recognition, and create reputational exposure if the deployment failure occurs in a customer that subsequently experiences an OT security incident.
    Claroty has not publicly disclosed its deployment-success rate, time-to- value SLA, or the share of deployments that require escalated professional-services engagement.

    '
