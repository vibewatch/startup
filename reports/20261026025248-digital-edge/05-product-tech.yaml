chapter:
  number: 5
  title: Product & Technology
  summary: Digital Edge operates a pan-Asian data-center platform combining hyperscale campuses, enterprise colocation, interconnection, and regional operating expertise. Public evidence shows meaningful deployed and planned capacity, but detailed reliability, security, integration, and customer-performance evidence remains thin.
sections:
  - id: product-and-operating-model
    title: Product and operating model
    body: |
      Digital Edge sells infrastructure capacity rather than a software product: hyperscale customers receive multi-megawatt deployments, while enterprise customers can use individual cabinets or private cages. The company describes its facilities as carrier-neutral and connectivity-rich, with teams handling local regulatory and operational requirements across Asia-Pacific. Public reporting places the platform across Japan, South Korea, India, Malaysia, Indonesia, and the Philippines, while the current company surface also describes operations across the region. The operating model is therefore a distributed physical platform: acquire or develop sites, secure power, build or modernize facilities, then provide colocation and interconnection with local execution. The model's main product risk is not a single software release but whether power, construction, connectivity, and facility operations scale together without degrading customer service.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001]
  - id: capacity-and-maturity
    title: Capacity, maturity, and roadmap
    body: |
      The strongest public maturity signal is the combination of operating facilities and a visible construction pipeline. TelecomTV reported 21 data centers and more than 500MW of critical IT load in service, under construction, or in development, plus another 300MW planned; a later industry report described around 25 data centers in operation and under construction and more than 1.1GW of secured IT power. These figures are not directly comparable because they use different dates and capacity definitions, so they should not be combined into one point estimate. Specific milestones include the 36MW SEL2 facility as the first building in a planned 100MW Seoul campus, the 23MW EDGE2 opening in Jakarta, and a planned first facility in a 300MW Navi Mumbai campus. The evidence supports a substantial build-out, not proof that all secured or planned capacity is live, leased, or profitable.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-controls
    title: Differentiation, dependencies, and controls
    body: |
      Digital Edge's differentiation is principally regional execution and infrastructure access: the founding team brought experience from Equinix, Facebook, Tata Communications, and Macquarie, while the company emphasizes local expertise across diverse regulatory environments. The Japan acquisition illustrates the model: five facilities added 5,000 cabinets and 18.5MW, retained CTC as an anchor customer, and was paired with a stated plan to modernize sites and connect them through Cross Link. The company also markets AI-ready facilities and an NVIDIA partnership, plus a design PUE of 1.25 and EcoVadis Silver on its current site. Those are useful diligence leads, not independent proof of workload performance, uptime, security certification, or realized efficiency. Public sources do not establish incident history, service-level attainment, detailed cyber controls, or the economics of the interconnection layer.
      India provides another example of the dependency model: Digital Edge entered through a joint venture with NIIF and AGP for a phased 300MW Navi Mumbai facility, making local partners part of execution rather than a peripheral channel. This can accelerate access to land, power, and permitting, but also makes delivery quality dependent on partner governance and multi-party coordination.
    claimRefs: [CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE002]
callouts:
  - calloutType: strength
    title: Regional platform with tangible delivery evidence
    body: The combination of acquired facilities, new campus milestones, and multi-country operating coverage indicates a real infrastructure platform rather than an unbuilt development concept.
    claimRefs: [CE006, CE008, CE011]
  - calloutType: risk
    title: Secured capacity is not demonstrated operating performance
    body: Capacity counts vary by date and definition, while public evidence does not disclose uptime, utilization, contracted-versus-live MW, security attestations, or customer service outcomes at facility level.
    claimRefs: [CE007, CE009, CE014]
