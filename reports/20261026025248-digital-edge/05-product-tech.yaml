  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Facility-level uptime, outage history, SLA attainment, incident response, and disaster-recovery test results.
      whyItMatters: Physical infrastructure value depends on reliable service, but public marketing statements do not establish realized performance.
      diligencePath: Request the last 24 months of uptime and incident logs, SLA credits, root-cause analyses, and independent resilience test reports by facility.
      relatedQuestionRefs: [QE004, QE006, QE008]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Current security certifications, privacy controls, access-control standards, and third-party assurance reports.
      whyItMatters: Enterprise and AI customers require evidence of security and compliance, especially across multiple jurisdictions.
      diligencePath: Obtain current ISO/SOC attestations, penetration-test summaries, privacy policies, and customer security questionnaires.
      relatedQuestionRefs: [QE006]
    - type: conflicting-data
      severity: material
      topic: capacity
      missingEvidence: A dated asset register reconciling live, under-construction, in-development, planned, secured, and contracted IT load.
      whyItMatters: Public figures range from 500MW-plus critical IT load to more than 1.1GW secured IT power and are not directly comparable.
      diligencePath: Request a campus-by-campus schedule with power, construction stage, customer commitments, energization date, and utilization denominator.
      relatedQuestionRefs: [QE002, QE007]
    - type: missing-source
      severity: minor
      topic: performance
      missingEvidence: Independent evidence of realized PUE, AI workload density, network performance, and customer deployment outcomes.
      whyItMatters: Product differentiation currently rests largely on company positioning and disclosed infrastructure scale.
      diligencePath: Request third-party benchmark reports, anonymized customer references, and facility-level energy and network KPIs.
      relatedQuestionRefs: [QE003, QE005, QE010]
