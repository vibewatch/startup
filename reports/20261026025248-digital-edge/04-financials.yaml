company:
  name: Digital Edge
chapter:
  number: 4
  title: Financials
  summary: Digital Edge has assembled a capital-intensive APAC data-center platform with reported equity and debt support, but public sources do not disclose revenue, EBITDA, utilization, realized pricing, or cash runway. The underwriting case therefore rests on execution of phased capacity expansion and financing discipline rather than a demonstrated public earnings profile.
sections:
  - id: revenue-and-monetization
    title: Revenue model is capacity-led, but realized economics are private
    body: >-
      The evidence describes Digital Edge as a data-center owner and operator selling
      infrastructure for colocation, hyperscale deployments, cloud demand and
      interconnection. Its commercial engine is therefore the conversion of powered,
      connected capacity into customer contracts and recurring facility revenue, not a
      software subscription or disclosed ARR model. The 2021 Japan acquisition added
      5,000 cabinets and 18.5MW while retaining CTC as an anchor customer, and the
      India joint venture was designed around a phased 300MW hyperscale campus. These
      sources support the operating mechanism and capacity pipeline, but they do not
      establish billed revenue, occupancy, contract length, realized price per kW,
      gross margin, or cash collection. Official and media materials also use
      “committed capital,” financing, and capacity measures that must not be treated as
      revenue or cash available for distribution.
    claimRefs: [CI001, CI002, CI003, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: go-to-market-and-sales-efficiency
    title: Regional partnerships are the observable GTM proxy
    body: >-
      Public evidence points to a relationship-led, asset-backed go-to-market motion.
      Digital Edge combines local partners, existing financing relationships and
      anchor or hyperscale customers with acquisitions and greenfield development.
      CTC remained an anchor customer across the five acquired Japanese facilities,
      while NIIF and AGP contributed local investment, real-estate and construction
      capabilities for India. The financing announcement says most participating
      lenders were existing financing partners, which is evidence of capital-market
      relationship continuity rather than sales efficiency. No source provides CAC,
      sales cycle, backlog conversion, renewal, churn, customer concentration, or
      payback. Those missing denominators make a conventional SaaS funnel or
      efficiency ratio inappropriate; diligence should instead test signed MW,
      contracted versus billed capacity, customer-specific pricing, and the timing
      from land and power readiness to revenue commencement.
    claimRefs: [CI006, CI008, CI009]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Scale requires substantial capital and exposes financing dependencies
    body: >-
      The cost base is structurally dominated by land, power, construction, equipment,
      connectivity, energy and ongoing facility operations. The 2021 Japan transaction
      illustrates the asset intensity: approximately US$230 million purchased five
      facilities and underlying real property, adding 18.5MW. The India platform
      involves a 47-acre, multi-phase 300MW greenfield project, while later reporting
      describes more than US$1 billion of debt financing across campus expansions and
      a US$575 million HoldCo loan. These are financing and development facts, not
      proof of positive free cash flow. A sustainability-linked conversion feature may
      affect financing terms, but public sources do not disclose covenants, interest
      cost, maturity, refinancing exposure, capex per MW, operating margin, or cash
      balance. The key financial dependency is timely conversion of secured or planned
      power into contracted, operating capacity.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Digital Edge shows credible platform-building and access to institutional
      financing, including reported equity and debt capital and a current HoldCo
      facility. That supports a view that capital access is a strength, but not that
      the business is self-funding or that the equity is attractively priced. The
      adverse evidence is the same feature that creates upside: data centers require
      long-lived, phased commitments, and an independent market account notes that
      leases can exceed ten years while the tenant pool may be limited and risk
      higher. Underwriting should remain conditional until management supplies audited
      revenue and EBITDA, utilization by site, contracted and billed MW, customer
      concentration, capex and maintenance capex, debt terms, cash and burn, and
      project-level returns. At the current evidence level, valuation and margin path
      remain unknown, so the chapter supports research-more rather than a priced
      investment conclusion.
    claimRefs: [CI015, CI016, CI017, CI018]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Institutional capital access
    body: The reported US$575 million HoldCo loan and earlier equity-and-debt financing indicate access to lenders and investors, but the sources do not disclose the resulting cash balance or project-level returns.
    claimRefs: [CI013, CI014]
  - calloutType: risk
    title: Underwriting opacity
    body: Revenue, EBITDA, utilization, realized pricing, customer concentration, capex intensity and runway are not publicly disclosed in the retained sources, leaving capital adequacy and margin path unresolved.
    claimRefs: [CI015, CI016, CI017]
  - calloutType: recommendation
    title: Require project-level financial evidence
    body: Before assigning an equity valuation, request site-level contracted MW, billed MW, revenue, EBITDA, capex-to-date, remaining capex, debt service and customer concentration for each operating and development campus.
    claimRefs: [CI018]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or driver, Public value/status, Quality and diligence ask]
    rows:
      - [Colocation, "Recurring facility and connectivity services for enterprise or retail customers", "Cabinets, kW/MW, connectivity", "Operating model supported; realized revenue unavailable", "Primary operating evidence exists, but request billed MW, occupancy, contract term and realized price"]
      - [Hyperscale capacity, "Phased development and operation of large campuses for hyperscale deployments", "MW of critical IT load and power", "300MW Navi Mumbai project described; revenue unavailable", "Treat capacity as pipeline or asset scale, not revenue; request signed MW and revenue start dates"]
      - [Interconnection and cloud ecosystem, "Connectivity-rich facilities supporting cloud and interconnection requirements", "Cross-connects, network and customer ecosystem", "Strategic positioning described; price and mix unavailable", "Request cross-connect revenue, attach rates, churn and gross margin by service"]
      - [Development / expansion platform, "Acquisition and greenfield build-out across APAC markets", "Facilities, land, power and phased capex", "21 facilities and over 500MW reported by a 2025 source; current audited totals unavailable", "Reconcile operating, construction and development status to audited segment reporting"]
    notes: "Sources describe business mechanisms and capacity, not recognized revenue. Capacity, committed capital and financing are not interchangeable with revenue, ARR or cash generation."
    claimRefs: [CI001, CI002, CI003, CI005]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing element, List versus realized, Public evidence, Unknown or diligence request]
    rows:
      - [Colocation rent, "No public list or realized price retained", "Commercial model is implied by data-center operations", "Request price per kW, power pass-through, escalators, minimum commitments and discounts"]
      - [Hyperscale contract, "No customer contract economics retained", "Navi Mumbai is designed for hyperscale deployments", "Request signed MW, take-or-pay terms, commencement dates, termination rights and credit support"]
      - [Connectivity / interconnection, "No public price sheet retained", "Cross Link and connectivity-rich facilities are described", "Request cross-connect pricing, installation fees, attach rate and contribution margin"]
      - [Sustainability-linked debt feature, "Financing term, not customer pricing", "Borrower may convert the HoldCo facility subject to agreed targets", "Request pricing grid, targets, margin ratchet, covenants and impact on debt service"]
    notes: "No retained source provides a customer-facing price list or realized revenue. Null or unavailable fields are deliberate evidence gaps, not zero values."
    claimRefs: [CI006, CI009, CI013, CI014]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, "Unavailable", "Determines scale, growth and valuation basis", "Audited revenue by campus, country and service for 2024-2026"]
      - [Gross margin, null, "Unavailable", "Separates power and service pass-through from operating contribution", "Gross margin bridge by product, including energy, connectivity and maintenance"]
      - [Utilization / contracted MW, null, "Unavailable", "Tests whether capacity converts into recurring cash generation", "Signed, contracted, billed and live MW by site with customer concentration"]
      - [Cash runway and debt service, null, "Unavailable", "Tests financing dependency and refinancing risk", "Cash balance, monthly burn, debt maturities, covenants, interest cost and remaining capex"]
    notes: "Public sources support financing and capacity observations but do not disclose the private operating metrics required to calculate unit economics or runway. Null values require management evidence."
    claimRefs: [CI010, CI011, CI015, CI016, CI017, CI018]
