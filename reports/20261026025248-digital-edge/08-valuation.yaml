artifact: valuation
slug: digital-edge
runDate: 2026-10-26
company:
  name: Digital Edge
chapter:
  number: 8
  title: Valuation
  summary: >-
    Digital Edge has demonstrated access to large pools of equity and debt, but the public record
    still does not disclose the operating economics or capital-stack terms needed to underwrite
    common-equity value. A reported sale review around $10 billion is useful price discovery, not
    a completed transaction or a supportable entry price, so the evidence favors research-more.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more with medium confidence, high risk, and an unknown
      valuation stance. Independent reports in April and May 2026 said Digital Edge was exploring
      strategic alternatives around a possible $10 billion valuation, but neither report
      establishes a signed transaction, the basis of the valuation, or proceeds available to
      common equity. The platform's ability to attract institutional capital is encouraging, yet
      funding raised is not cash available to equity holders and reported capacity is not
      operating cash flow. A buy decision therefore requires a verified enterprise-value bridge,
      current cap table, debt and preference waterfall, audited earnings, and campus-level
      utilization. Until those inputs connect price to cash generation and downside protection,
      any precise return target would be false precision rather than valuation analysis.
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV016]
    tableRefs: [TV001, TV002]
  - id: financing-and-scale-context
    title: Financing, scale, and capital-structure context
    body: >-
      The disclosed financing history supports platform credibility while underscoring capital
      intensity. In January 2025, Digital Edge announced approximately $640 million of equity and
      $1 billion of debt across campus expansions; it also described the equity component as
      oversubscribed. The same announcement reported 21 data centers, more than 500 MW in service
      or in the development pipeline, and another 300 MW held for future development. In May 2026,
      Data Center Dynamics reported a separate inaugural $575 million HoldCo facility, while
      quoting management that more than $2 billion of green financings had supported the platform.
      These figures show financing access, not low leverage or durable equity returns. HoldCo debt
      can introduce refinancing and structural-subordination risk, and the public evidence does
      not allocate debt, capex, contracted load, or cash yield by campus.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV003]
  - id: scenarios-and-comparable-signals
    title: Scenarios and comparable signals
    body: >-
      The scenario framework is deliberately conditional because public inputs do not support
      probability-weighted valuation ranges. In a bull case, disclosed capacity converts into
      contracted, energized, cash-generating load and financing remains serviceable; only then
      could a price near the reported sale indication be tested against verified earnings and
      asset value. The base case assumes continued expansion but no investable valuation until
      audited economics and the equity bridge are produced. The bear case combines slower fill,
      construction delays, higher financing costs, or multiple compression. NEXTDC's reported
      October 2026 market capitalization of $2.93 billion, down 47.5% from its reported 2025
      year-end value, is a useful market-risk signal. It is not a direct comparable to a private
      transaction figure without enterprise value, leverage, geography, maturity, and operating
      normalization.
    claimRefs: [CV001, CV012, CV013, CV014, CV015, CV016]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      A reported strategic review suggests potential exit interest, and Digital Edge has a history
      of acquiring operating assets as well as developing capacity. Exit readiness nonetheless
      depends on whether buyers can verify contracted revenue, utilization, build costs, power
      availability, customer concentration, and debt-adjusted cash flow. The final diligence pack
      should include audited financials, a campus-level operating model, signed-versus-secured MW,
      customer concentration and renewals, project and HoldCo debt terms, security preferences,
      and an enterprise-value-to-common-equity reconciliation. Thesis-break triggers are delayed
      conversion of capacity into billed load, leverage rising without matching cash generation,
      refinancing stress, a down-round, or a strategic process that fails to validate the reported
      price. Strong contracted fill, transparent capital terms, and audited cash yield would move
      the recommendation toward an investable entry.
    claimRefs: [CV001, CV007, CV008, CV010, CV011, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based view, Decision implication]
    rows:
      - ["Recommendation", "research-more", "Do not set an entry price before private financial and capital-stack diligence"]
      - ["Confidence", "medium", "Financing and capacity evidence is credible, but value-critical economics remain undisclosed"]
      - ["Risk rating", "high", "Leverage, construction, fill, refinancing, and valuation-basis risks remain material"]
      - ["Valuation stance", "unknown", "The reported $10B indication is not a completed transaction or verified common-equity mark"]
      - ["Decision gate", "private evidence required", "Require audited economics and an enterprise-value-to-common-equity bridge"]
    notes: >-
      Qualitative decision summary based only on the assigned public evidence; funding amounts are
      not treated as cash available and the reported sale value is not treated as a transaction.
    claimRefs: [CV001, CV002, CV003, CV007, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Argument, What would change the view]
    rows:
      - ["Thesis", "Large equity and debt raises demonstrate institutional financing access", "Verify pricing, security class, debt terms, and project-level returns"]
      - ["Thesis", "Reported operating and development scale creates strategic scarcity value", "Show contracted fill, energization timing, utilization, and cash yield"]
      - ["Anti-thesis", "Capital intensity and HoldCo debt can weaken common-equity downside protection", "Demonstrate covenant headroom and self-funded growth"]
      - ["Anti-thesis", "The $10B report may be an asking indication rather than executable value", "Produce signed bids or completed transaction evidence with valuation basis"]
      - ["Anti-thesis", "Public-comparable repricing shows infrastructure equities can compress sharply", "Normalize enterprise value, leverage, growth, geography, and asset maturity"]
    notes: >-
      Arguments distinguish reported facts from underwriting implications; the NEXTDC reference is
      a market-sensitivity signal rather than a like-for-like valuation conclusion.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV012, CV013, CV015]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Trigger]
    rows:
      - ["Bull", "Capacity converts into contracted and energized load; audited cash flow supports debt service", "Test the reported sale indication only after normalizing debt, preferences, and campus economics", "Requires private verification", "Strong contracted fill and cash yield with controlled capex"]
      - ["Base", "Expansion continues, but audited earnings and capital-stack terms remain unavailable", "No responsible public valuation range or target return can be calculated", "Most defensible on current evidence", "Remain research-more until the equity bridge is complete"]
      - ["Bear", "Fill slows while capex, interest, or refinancing costs rise", "Common-equity value falls below the reported headline even if gross capacity grows", "Material downside", "Delayed energization, covenant pressure, or down-round financing"]
      - ["Exit case", "A strategic buyer validates contracts, power, operating performance, and liabilities", "Use signed consideration and net debt rather than an attributed asking value", "Possible but unconfirmed", "Binding bids and a disclosed transaction basis"]
    notes: >-
      Scenarios are qualitative because the retained sources do not provide audited revenue,
      EBITDA, utilization, a current cap table, or a preference waterfall.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV012, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and financing access support strategic value, while operating and capital-stack gaps
      prevent a price-sensitive investment recommendation.
    data:
      nodes:
        - id: scale
          label: Scale evidence
          detail: "21 data centers, more than 500 MW in service or development, and 300 MW held for future development were reported in 2025"
        - id: capital
          label: Capital access
          detail: "Approximately $640M equity and $1B debt were announced in 2025, followed by a reported $575M HoldCo facility in 2026"
        - id: price
          label: Price indication
          detail: "Independent reports described a possible strategic transaction around $10B"
        - id: economics
          label: Economics gap
          detail: "Audited earnings, utilization, contracted load, capex returns, and customer concentration are not disclosed in the retained sources"
        - id: equity
          label: Equity bridge gap
          detail: "Net debt, security preferences, dilution, and transaction-value basis remain unverified"
        - id: decision
          label: Research-more
          detail: "Set an entry price only after private evidence establishes cash generation and common-equity proceeds"
      edges:
        - [scale, capital]
        - [capital, price]
        - [scale, economics]
        - [price, equity]
        - [economics, decision]
        - [equity, decision]
    approximationNotes: >-
      Directed decision logic only; node order and links do not express probabilities, conversion
      rates, or comparable numeric magnitudes.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV007, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Research-more: financing access and reported scale support strategic credibility, but the
      available evidence cannot connect the reported price indication to common-equity returns.
    claimRefs: [CV001, CV002, CV003, CV005, CV016]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Treat refinancing stress, a down-round, or failure to convert developed capacity into
      contracted and billed load as a thesis break until economics and capital terms are verified.
    claimRefs: [CV007, CV008, CV015, CV016]
