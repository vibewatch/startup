company:
  name: Digital Edge
chapter:
  number: 1
  title: Company Overview
  summary: Digital Edge is a Stonepeak-backed, Singapore-headquartered APAC data-center and fiber platform formed in 2020 and built through acquisitions, campus development, and repeated debt and equity financing. Public evidence supports substantial scale and capital access, but current valuation, audited operating performance, customer concentration, and financing terms remain private.
sections:
  - id: identity-and-operating-model
    title: Identity, origin, and operating model
    body: Digital Edge was formed in August 2020 as a Singapore-headquartered platform focused on acquiring and developing carrier-neutral data centers and related digital infrastructure across Asia Pacific. Stonepeak, its investors, and management committed US$1 billion of equity at launch, while the initial operating team brought experience from Equinix, Facebook, Tata Communications, and Macquarie. The platform began with investments in Tokyo and Osaka rather than a single greenfield flagship. By May 2026, Digital Edge described its offering as data-center and fiber infrastructure for hyperscalers and enterprises across nine APAC countries. This combination of acquisitions, partnerships, and campus development defines an asset-heavy regional infrastructure model rather than a software-like recurring-revenue company.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership transition and governance coverage
    body: >-
      The founding thesis depended on executives with deep regional infrastructure experience, led by Samuel Lee after his tenure as Equinix's Asia-Pacific president. Digital Edge subsequently disclosed an orderly CEO transition: founding executive John Freeman succeeded Lee in the second quarter of 2025, while Lee became senior advisor to the board. The same announcement added Maile Kaiser and Eanna Murphy as non-executive directors and identified Stonepeak senior managing director Andrew Thomas as chairman. These changes broaden public evidence of commercial, operational, legal, and sponsor oversight, but they do not disclose board voting rights, committee mandates, management succession below the CEO, or the degree of sponsor control. Key-person and governance risk therefore remains a document-diligence question rather than a fully resolved public fact.
    claimRefs: [CO005, CO011, CO012]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital formation, stakeholders, and strategic optionality
    body: Digital Edge has repeatedly accessed institutional capital, but the instruments and denominators must remain distinct. The 2020 US$1 billion figure was an equity capital commitment, not reported revenue or unrestricted cash. In January 2025, reporting described more than US$1.6 billion of new capital, split between approximately US$640 million of equity and US$1 billion of debt across campus expansions. In May 2026, the company closed a separate US$575 million HoldCo financing supported by named global lenders. Data Center Dynamics also reported that Stonepeak was reviewing options including a partial or full sale, potentially at up to US$10 billion, while emphasizing that no final decision had been made. That reported ceiling is neither a completed valuation nor an investable transaction price.
    claimRefs: [CO003, CO006, CO008, CO013, CO015, CO016]
    tableRefs: [TO003]
  - id: scale-and-milestones
    title: Scale progression and unresolved operating metrics
    body: The evidence shows rapid physical expansion but uses different definitions of scale. January 2025 reporting described 21 data centers, more than 500MW of critical IT load in service, under construction, or development, and another 300MW held for future development across six countries. The May 2026 company description instead cited 1.8GW of secured IT power across nine countries. Those figures are not directly comparable because one mixes operating and development stages while the other measures secured power. The assigned evidence also does not disclose audited revenue, EBITDA, utilization, backlog conversion, customer count, headcount, or customer concentration. These omissions prevent a reliable bridge from portfolio scale and financing capacity to current earnings quality, cash generation, or equity value.
    claimRefs: [CO004, CO006, CO008, CO009, CO010, CO013, CO014, CO015]
    figureRefs: [FO001]
