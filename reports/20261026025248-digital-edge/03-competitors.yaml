company:
  name: Digital Edge
chapter:
  number: 3
  title: Competitors
  summary: >-
    Digital Edge competes in a capital-intensive APAC data-center market where scale,
    power access, connectivity, and local execution matter more than software-only
    differentiation. The evidence supports a credible acquisition-led platform, but
    public sources do not disclose comparable pricing, utilization, customer
    concentration, or realized economics against larger incumbents.
sections:
  - id: landscape
    title: Landscape and scale
    body: >-
      Digital Edge entered the market with Stonepeak backing and a management team
      drawn from established infrastructure operators, using acquisitions and
      partnerships to build a multi-country footprint. Its 2025 company disclosure
      described 21 data centers and more than 500 MW of critical IT load in service,
      under construction, and development, plus 300 MW held for future development.
      Independent coverage places that platform in a regional funding race rather than
      a protected niche: Mingtiandi described Equinix, Digital Realty, and GDS/DayOne
      as scaling in parallel, while Blackstone's AirTrunk transaction shows the
      strategic and financial scale of a direct APAC alternative. The comparison is
      directional because the sources use different dates and capacity definitions.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-comparison
    title: Buyer choice and capability trade-offs
    body: >-
      Buyers can solve the same underlying need through a regional platform such as
      Digital Edge, a scaled incumbent such as Equinix or AirTrunk, a local operator,
      a partner-led deployment, or an internal build. Digital Edge's evidence-backed
      advantages are APAC footprint expansion, local partnerships, interconnection,
      and access to institutional capital. Its Japan transaction with CTC retained
      CTC as an anchor customer and paired data-center infrastructure with IT and
      cloud services, illustrating a distribution and trust mechanism that an
      internal build would need to recreate. Conversely, competitor scale is
      material: AirTrunk reported more than 800 MW committed to customers and land
      supporting over 1 GW of future growth. The public record does not support a
      like-for-like superiority claim on uptime, pricing, utilization, or customer
      outcomes.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      The apparent moat is an execution system: capital availability, site and power
      access, local regulatory relationships, construction capability, and customer
      or channel partnerships. Digital Edge's initial Osaka and Tokyo investments,
      later CTC acquisition, and multi-country expansion provide evidence of that
      system, but they also expose the platform to capital intensity and financing
      competition. Mingtiandi reported that hyperscale facilities require substantial
      land, construction, and technology investment. Equinix separately claims 282
      data centers across six continents, 522,000 interconnections, and more than
      10,500 customers. Blackstone's AirTrunk acquisition at an implied enterprise
      value above A$24 billion and Equinix's reported $94.23 billion market
      capitalization further illustrate the resource asymmetry. Digital Edge may
      still win underserved markets, but the evidence does not establish durable
      switching costs or pricing power.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: diligence
    title: Competitive diligence conclusion
    body: >-
      Digital Edge appears positioned as a regional infrastructure consolidator with
      a credible capital and partnership playbook, not as a differentiated product
      vendor with transparent unit economics. Its customer-facing proposition is
      colocation and interconnection capacity across APAC, supported by energy
      efficiency and connectivity language in company materials. The key competitive
      question is therefore not whether demand exists, but whether Digital Edge can
      convert secured or planned capacity into contracted, profitable, and resilient
      workloads before larger platforms absorb the best sites and power. Public
      sources do not provide comparable list pricing, realized pricing, utilization,
      churn, SLA performance, or customer concentration. Those gaps limit confidence
      in any ranking and should keep the competitive assessment at research-more until
      customer contracts, campus-level economics, and renewal evidence are reviewed.
    claimRefs: [CP013, CP014, CP015, CP016]
callouts:
  - calloutType: strength
    title: Capital-backed regional execution
    body: >-
      The combination of Stonepeak sponsorship, a $640 million equity raise, $1
      billion of debt financing, acquisitions, and local anchor relationships gives
      Digital Edge a credible route to scale across multiple APAC markets.
    claimRefs: [CP001, CP005, CP009]
  - calloutType: risk
    title: Scale does not prove moat
    body: >-
      Larger competitors have disclosed materially greater customer commitments or
      public-market capital bases, while Digital Edge has not disclosed comparable
      pricing, utilization, retention, or campus-level returns.
    claimRefs: [CP007, CP011, CP012, CP016]
