schemaVersion: "report-v2"
artifact: market-analysis
slug: digital-edge
runDate: 2026-10-26
company:
  name: Digital Edge
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Digital Edge operates in an APAC digital-infrastructure market where AI, cloud and
    connectivity demand are expanding faster than power, grid and construction capacity.
    Independent outlooks support a large, capital-intensive opportunity, but public evidence
    does not isolate Digital Edge's serviceable market, utilization or customer economics.
sections:
  - id: market-boundary
    title: Market boundary and demand
    body: >-
      The relevant market is APAC data-center infrastructure: powered, connected facilities
      that provide colocation, hyperscale capacity, interconnection and related fiber services.
      It includes new-build and acquired facilities, campus expansion, power and cooling
      infrastructure, and the fit-out required to serve cloud, AI, enterprise and public-sector
      workloads. It excludes the broader cloud-application market, GPU hardware revenue,
      telecom services unrelated to facility connectivity, and customer-owned IT spend except
      where those budgets determine facility demand. The status quo is on-premise capacity,
      incumbent colocation, hyperscaler self-build, or a customer delaying deployment. Digital
      Edge's own description emphasizes energy-efficient facilities and connectivity, while its
      2026 interview describes AI-ready campuses, power, cooling and resilient connectivity as
      the requirements buyers increasingly seek. This boundary makes capacity, power access,
      delivery timing and contracted demand more decision-relevant than a generic software TAM.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market economics
    body: >-
      Multiple lenses point to substantial growth but measure different populations and should
      not be combined into one precise TAM. JLL projects 24 GW of APAC capacity additions from
      2025 to 2030 and estimates US$286 billion of real-estate value creation plus up to
      US$486 billion of data-center fit-out, while CBRE reports US$11.6 billion of 2025 direct
      investment and a 4.8 GW supply pipeline through 2027 with 78% preleased. Deloitte uses a
      broader ecosystem lens, estimating approximately US$800 billion of regional data-center
      investment by 2030 and up to five-fold growth in data-center electricity demand by the
      mid-2030s. These are investment, capacity, value-creation and energy-demand measures, not
      Digital Edge revenue or ARR. Digital Edge's disclosed 21 facilities and more than 500 MW
      in service, construction and development are evidence of participation, not a defensible
      SOM. A company-specific SAM/SOM remains open because public sources do not disclose
      contracted MW, utilization, pricing, margin or addressable-market exclusions.
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-constraints
    title: Buyers, adoption path and constraints
    body: >-
      The buyer map is multi-sided. Hyperscalers and AI-oriented cloud providers are the
      anchor demand sources; enterprises and digital-service providers buy colocation,
      interconnection and resilience; governments and utilities influence permits, land and
      power; lenders and institutional investors underwrite delivery and capital structure.
      Users need reliable capacity, connectivity and a credible expansion path, while the payer
      is typically the organization funding long-duration infrastructure or cloud operations.
      Adoption therefore starts with a power-and-site decision, proceeds through design,
      permitting, financing and construction, and ends with contracted capacity and operating
      reliability. JLL identifies grid-connection waits from 24 months in emerging markets to
      more than eight years in core markets. CBRE cites power availability and construction
      cost as leading constraints, while Deloitte warns that uncoordinated growth can worsen
      grid congestion and price volatility. Switching is consequently constrained by
      migration, continuity and local regulation, but the same constraints raise execution,
      capital-intensity and timing risk for Digital Edge.
    claimRefs: [CM009, CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: diligence-implications
    title: Valuation implications and unresolved sizing
    body: >-
      The market supports strategic relevance but not a precise valuation conclusion. Demand
      growth and preleasing can improve the value of scarce powered capacity, and Digital Edge
      reports financing and a multi-country pipeline that may provide platform scale. Yet
      market-level growth does not prove project-level returns. The public record does not show
      Digital Edge's revenue, EBITDA, utilization, signed-versus-billed MW, customer
      concentration, lease tenor, capex per MW, energy-cost pass-through or return thresholds.
      The reported possibility of a transaction at a valuation near US$10 billion is a media
      report, not a completed financing or audited valuation. The key diligence test is whether
      secured power and customer commitments convert into operating capacity on schedule and at
      attractive returns after construction, energy, financing and compliance costs. Until that
      bridge is available, the market case supports research-more rather than a market-size
      driven conviction entry.
    claimRefs: [CM014, CM015, CM016]
callouts:
  - calloutType: strength
    title: Scarce powered capacity is strategically valuable
    body: >-
      Independent outlooks consistently identify power availability, grid access and preleased
      capacity as binding variables, giving operators with executable sites a potential timing
      advantage.
    claimRefs: [CM005, CM010, CM011]
  - calloutType: risk
    title: Market growth is not company-level economics
    body: >-
      Capacity and investment forecasts cannot substitute for Digital Edge's utilization,
      pricing, customer concentration, capex and return disclosures.
    claimRefs: [CM007, CM014, CM015]
