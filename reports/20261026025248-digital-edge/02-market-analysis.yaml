      - [CBRE, 2026, Asia Pacific, "US$11.6B direct investment in 2025; 4.8 GW new supply by 2027", "78% of supply preleased", "Research outlook on demand, supply and investment", high, "Market-wide; not company-specific"]
      - [Deloitte, 2026, Asia Pacific, "Approximately US$800B data-center investment by 2030", "Electricity demand up to 5x by mid-2030s", "Ecosystem investment and energy-system analysis", high, "Broader investment lens and forecast uncertainty"]
    notes: >-
      Values use each publisher's stated units and populations; they are separate lenses and
      must not be summed into a single TAM. CAGR is shown only where the source provides a rate.
    claimRefs: [CM004, CM005, CM006, CM007]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Hyperscale cloud, Cloud infrastructure team, Cloud and AI workloads, Hyperscaler infrastructure budget, "Power/site selection to contracted campus capacity", "Need for scalable capacity and delivery certainty"]
      - [AI cloud or neocloud, AI infrastructure team, Training and inference workloads, AI-cloud capex and hosting budget, "High-density design, cooling, connectivity and expansion", "GPU and AI workload growth"]
      - [Enterprise, CIO or infrastructure procurement, Business applications and data, Enterprise IT or transformation budget, "Colocation/interconnection migration and resilience", "Digitalization, continuity or local latency requirement"]
      - [Carrier, content or digital service provider, Network and platform users, Network operations or platform budget, "Interconnection, fiber and distributed capacity", "Traffic growth and route diversity"]
      - [Government or regulated user, Public-sector or compliance buyer, Regulated workloads, Public budget or regulated-entity capex, "Residency, security, permitting and continuity review", "Digital public services and local compliance"]
    notes: >-
      This map synthesizes disclosed use cases and market constraints; public sources do not
      disclose Digital Edge's customer-level budget ownership or contract conversion rates.
    claimRefs: [CM002, CM009, CM010, CM013]
