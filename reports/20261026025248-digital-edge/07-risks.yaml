          values: [1, 3, 3]
        - label: Ownership or financing-process change
          values: [1, 3, 3]
    claimRefs: [CR001, CR005, CR010, CR012]
callouts:
  - calloutType: risk
    title: Investment implication
    body: >-
      Digital Edge has credible strategic assets and capital backing, but the public record leaves the key risk controls unquantified. Treat the opportunity as research-more until management supplies campus-level operating, customer, financing, cyber, and jurisdictional evidence.
    claimRefs: [CR006, CR008, CR010, CR013]
  - calloutType: assumption
    title: Thesis-break triggers
    body: >-
      A missed commissioning plan, an uncontained reportable cyber incident, loss of a material anchor or hyperscale tenant, inability to convert secured power into contracted live load, or financing that makes expansion uneconomic should trigger a thesis reset.
    claimRefs: [CR006, CR009, CR011, CR012]
