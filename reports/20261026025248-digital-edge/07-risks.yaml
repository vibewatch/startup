company:
  name: Digital Edge
chapter:
  number: 7
  title: Risks
  summary: Digital Edge's principal exposures are execution and capital risk from rapid APAC build-out, jurisdiction-specific data and cyber rules, and dependence on partners and large tenants. Public evidence identifies credible risk mechanisms, but does not disclose enough operating data to quantify residual exposure or establish company-specific incident history.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Digital Edge operates across jurisdictions where data residency and critical-infrastructure obligations can change the economics and operating design of a campus. Philippine Executive Order No. 119 classifies government data and generally requires Top Secret and Secret data to remain within Philippine territory; it also covers private entities handling government data in public-private partnerships, public services, public utilities, critical infrastructure, and strategic or sensitive projects. The same source notes that agencies remain responsible for provider safeguards and that foreign legal compulsion can remain relevant even when servers are local. Singapore's announced reporting rules add a separate operational duty for owners of critical information infrastructure: suspected advanced persistent threat incidents must be reported to the Cyber Security Agency. These rules are not proof that Digital Edge is currently non-compliant, but they make customer qualification, contracting, data location, incident response, and jurisdictional structure material diligence items. The legal register therefore ranks regulatory implementation and cross-border control above unverified litigation risk; no assigned source establishes a Digital Edge lawsuit, licence breach, or enforcement action.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operating-and-financial
    title: Operating, quality, security, and financial risk
    body: >-
      The platform's growth model compounds construction, commissioning, power, uptime, and financing risks. Public descriptions move from a 2020 US$1 billion equity commitment to 21 operating, under-construction, or development data centers and more than 500 MW of critical IT load in a 2025 account, while 2026 reporting describes approximately 25 facilities and more than 1.1 GW of secured IT power. These are different measures and periods, not a verified trajectory of revenue or utilization. The 2025 account also describes US$640 million of equity and US$1 billion of debt financing, while 2026 reporting says the company raised more than US$1.6 billion in new equity and debt in the prior year; neither establishes cash available, leverage, capex returns, or runway. Singapore's cyber threat environment is adverse context for any operator connected to critical infrastructure, but the assigned sources do not report a Digital Edge breach or outage. Diligence should test campus-level commissioning, contracted versus secured power, debt covenants, insurance, resilience testing, and incident records rather than infer safety from the absence of a public incident.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Partner, customer, and execution dependencies
    body: >-
      Digital Edge's model relies on local partners, anchor customers, lenders, utilities, and hyperscale or enterprise demand. Its Japan acquisition retained ITOCHU Techno-Solutions as an anchor customer across five facilities, while the initial platform was formed through partnerships with Japanese infrastructure companies and a Stonepeak-backed capital commitment. Those relationships can accelerate market entry, but they also create counterparty, concentration, renewal, and governance exposure that public evidence does not quantify. The 2026 sale-process reports are preliminary and describe no final decision; they should be treated as a financing and ownership uncertainty, not as evidence of a completed transaction or a company valuation. The practical kill criteria are measurable: a material loss or non-renewal of an anchor or hyperscale tenant; repeated commissioning or availability misses; inability to secure power or permits on planned campuses; a reportable cyber incident without timely containment; or financing terms that require uneconomic expansion. Management should provide customer concentration, contracted-versus-live MW, renewal, outage, capex, debt, and partner termination data before an investment decision.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or case, Jurisdiction, Status, Likelihood, Severity, Mitigation and diligence path, Residual exposure]
    rows:
      - ["EO 119 data classification and residency", Philippines, "In force from 2026; implementation phases described", medium, high, "Map every government or critical-infrastructure workload by classification and location; obtain customer contracts and compliance attestations", "High until campus and customer scope are verified"]
      - ["Foreign legal access to data held by US cloud providers", "Philippines / United States", "Identified legal tension in reporting", medium, high, "Obtain provider ownership, custody, encryption, warrant-response, and customer-control analysis", "High for sensitive workloads using foreign-controlled providers"]
      - ["Advanced persistent threat incident reporting for critical information infrastructure", Singapore, "New reporting rules announced to take effect later in 2025", medium, high, "Confirm whether any Digital Edge facility or customer service is in scope; test detection, escalation, and CSA reporting playbooks", "Medium-high until scope and controls are documented"]
    notes: Regulatory evidence is jurisdiction-specific and does not establish a Digital Edge violation; null or unverified company-specific status means diligence is required.
    enumerationScope:
      coverage: partial
      basis: Publicly documented 2026 Philippine and Singapore rules relevant to APAC data-center operations, not a complete legal inventory.
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security / financial risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Campus construction or commissioning delay", medium, high, "Partial public evidence of expansion milestones; no campus-level schedule or variance data", High, "Signed-versus-live MW and milestone variance by campus"]
      - ["Power, uptime, or capacity under-delivery", medium, high, "Secured-power and critical-load figures are publicly described but not reconciled to utilization or contracted load", High, "Availability history, contracted MW, live MW, and customer service credits"]
      - ["Cyber intrusion or delayed incident response", medium, high, "Regulatory reporting context exists; no Digital Edge incident-response evidence assigned", High, "Independent assurance, tabletop results, incident register, and reporting timelines"]
      - ["Debt and capital intensity compress returns", medium, high, "Capital raises are reported, but cash available, leverage, covenants, and campus returns are undisclosed", High, "Audited financials, debt schedule, capex by campus, liquidity, and downside cases"]
    notes: Risk ratings are evidence-linked prioritizations, not measured probabilities; public financing totals are not cash-on-hand or runway.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Anchor customer relationship", ITOCHU Techno-Solutions, "Material at the five acquired Japanese facilities; percentage undisclosed", "Anchor renewal or migration reduces occupancy and ecosystem value", high, "Obtain contract term, renewal, termination, service-level, and revenue share data", High]
      - ["Platform capital and ownership sponsor", "Stonepeak and co-investors", "Sponsor-backed; exact current ownership and preferences undisclosed", "Funding or ownership-process change slows expansion or alters governance", high, "Obtain cap table, preference stack, commitments, covenants, and change-of-control rights", High]
      - ["Local development and infrastructure partners", "Japanese and APAC utility, property, and operating partners", "Site-specific; aggregate dependency undisclosed", "Partner delay or termination blocks permits, power, or local execution", "medium-high", "Review partner agreements, termination rights, replacement options, and permitting responsibility", "Medium-high"]
      - ["Hyperscale and enterprise demand", "Large cloud and enterprise tenants", "Leasing acceleration reported but customer concentration and signed MW undisclosed", "Demand timing or tenant concentration leaves new capacity underutilized", high, "Obtain tenant-level contracted MW, renewal, backlog, and take-or-pay evidence", High]
    notes: The table distinguishes named relationships from quantified concentration; public sources do not disclose customer-level revenue, renewal, or counterparty concentration.
    claimRefs: [CR010, CR011, CR012, CR013]
