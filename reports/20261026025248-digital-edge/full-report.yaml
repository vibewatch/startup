chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and operating model
        blocks:
          - type: paragraph
            body: >-
              Digital Edge was formed in August 2020 as a Singapore-headquartered platform focused on acquiring and
              developing carrier-neutral data centers and related digital infrastructure across Asia Pacific. Stonepeak,
              its investors, and management committed US$1 billion of equity at launch, while the initial operating team
              brought experience from Equinix, Facebook, Tata Communications, and Macquarie. The platform began with
              investments in Tokyo and Osaka rather than a single greenfield flagship. By May 2026, Digital Edge
              described its offering as data-center and fiber infrastructure for hyperscalers and enterprises across
              nine APAC countries. This combination of acquisitions, partnerships, and campus development defines an
              asset-heavy regional infrastructure model rather than a software-like recurring-revenue company.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership transition and governance coverage
        blocks:
          - type: paragraph
            body: >-
              The founding thesis depended on executives with deep regional infrastructure experience, led by Samuel Lee
              after his tenure as Equinix's Asia-Pacific president. Digital Edge subsequently disclosed an orderly CEO
              transition: founding executive John Freeman succeeded Lee in the second quarter of 2025, while Lee became
              senior advisor to the board. The same announcement added Maile Kaiser and Eanna Murphy as non-executive
              directors and identified Stonepeak senior managing director Andrew Thomas as chairman. These changes
              broaden public evidence of commercial, operational, legal, and sponsor oversight, but they do not disclose
              board voting rights, committee mandates, management succession below the CEO, or the degree of sponsor
              control. Key-person and governance risk therefore remains a document-diligence question rather than a
              fully resolved public fact.
            claimRefs:
              - CO005
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO011
              - CO012
      - number: '1.3'
        title: Capital formation, stakeholders, and strategic optionality
        blocks:
          - type: paragraph
            body: >-
              Digital Edge has repeatedly accessed institutional capital, but the instruments and denominators must
              remain distinct. The 2020 US$1 billion figure was an equity capital commitment, not reported revenue or
              unrestricted cash. In January 2025, reporting described more than US$1.6 billion of new capital, split
              between approximately US$640 million of equity and US$1 billion of debt across campus expansions. In May
              2026, the company closed a separate US$575 million HoldCo financing supported by named global lenders.
              Data Center Dynamics also reported that Stonepeak was reviewing options including a partial or full sale,
              potentially at up to US$10 billion, while emphasizing that no final decision had been made. That reported
              ceiling is neither a completed valuation nor an investable transaction price.
            claimRefs:
              - CO003
              - CO006
              - CO008
              - CO013
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO006
              - CO008
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: Scale progression and unresolved operating metrics
        blocks:
          - type: paragraph
            body: >-
              The evidence shows rapid physical expansion but uses different definitions of scale. January 2025
              reporting described 21 data centers, more than 500MW of critical IT load in service, under construction,
              or development, and another 300MW held for future development across six countries. The May 2026 company
              description instead cited 1.8GW of secured IT power across nine countries. Those figures are not directly
              comparable because one mixes operating and development stages while the other measures secured power. The
              assigned evidence also does not disclose audited revenue, EBITDA, utilization, backlog conversion,
              customer count, headcount, or customer concentration. These omissions prevent a reliable bridge from
              portfolio scale and financing capacity to current earnings quality, cash generation, or equity value.
            claimRefs:
              - CO004
              - CO006
              - CO008
              - CO009
              - CO010
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
              - CO008
              - CO010
              - CO011
              - CO013
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeated institutional capital access
            body: >-
              Digital Edge has secured sponsor equity, new co-investment, campus debt, and HoldCo financing, supporting
              the view that it can fund large APAC infrastructure projects. These amounts do not establish revenue,
              profitability, or unrestricted cash.
            calloutType: strength
            claimRefs:
              - CO003
              - CO008
              - CO013
          - type: callout
            title: Public scale is not operating performance
            body: >-
              Secured power, assets in development, and financing commitments indicate platform ambition but cannot
              substitute for utilization, contracted backlog, customer concentration, audited earnings, or current
              equity pricing.
            calloutType: risk
            claimRefs:
              - CO009
              - CO014
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand
        blocks:
          - type: paragraph
            body: >-
              The relevant market is APAC data-center infrastructure: powered, connected facilities that provide
              colocation, hyperscale capacity, interconnection and related fiber services. It includes new-build and
              acquired facilities, campus expansion, power and cooling infrastructure, and the fit-out required to serve
              cloud, AI, enterprise and public-sector workloads. It excludes the broader cloud-application market, GPU
              hardware revenue, telecom services unrelated to facility connectivity, and customer-owned IT spend except
              where those budgets determine facility demand. The status quo is on-premise capacity, incumbent
              colocation, hyperscaler self-build, or a customer delaying deployment. Digital Edge's own description
              emphasizes energy-efficient facilities and connectivity, while its 2026 interview describes AI-ready
              campuses, power, cooling and resilient connectivity as the requirements buyers increasingly seek. This
              boundary makes capacity, power access, delivery timing and contracted demand more decision-relevant than a
              generic software TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Sizing lenses and market economics
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses point to substantial growth but measure different populations and should not be combined
              into one precise TAM. JLL projects 24 GW of APAC capacity additions from 2025 to 2030 and estimates US$286
              billion of real-estate value creation plus up to US$486 billion of data-center fit-out, while CBRE reports
              US$11.6 billion of 2025 direct investment and a 4.8 GW supply pipeline through 2027 with 78% preleased.
              Deloitte uses a broader ecosystem lens, estimating approximately US$800 billion of regional data-center
              investment by 2030 and up to five-fold growth in data-center electricity demand by the mid-2030s. These
              are investment, capacity, value-creation and energy-demand measures, not Digital Edge revenue or ARR.
              Digital Edge's disclosed 21 facilities and more than 500 MW in service, construction and development are
              evidence of participation, not a defensible SOM. A company-specific SAM/SOM remains open because public
              sources do not disclose contracted MW, utilization, pricing, margin or addressable-market exclusions.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, adoption path and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. Hyperscalers and AI-oriented cloud providers are the anchor demand sources;
              enterprises and digital-service providers buy colocation, interconnection and resilience; governments and
              utilities influence permits, land and power; lenders and institutional investors underwrite delivery and
              capital structure. Users need reliable capacity, connectivity and a credible expansion path, while the
              payer is typically the organization funding long-duration infrastructure or cloud operations. Adoption
              therefore starts with a power-and-site decision, proceeds through design, permitting, financing and
              construction, and ends with contracted capacity and operating reliability. JLL identifies grid-connection
              waits from 24 months in emerging markets to more than eight years in core markets. CBRE cites power
              availability and construction cost as leading constraints, while Deloitte warns that uncoordinated growth
              can worsen grid congestion and price volatility. Switching is consequently constrained by migration,
              continuity and local regulation, but the same constraints raise execution, capital-intensity and timing
              risk for Digital Edge.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: Valuation implications and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              The market supports strategic relevance but not a precise valuation conclusion. Demand growth and
              preleasing can improve the value of scarce powered capacity, and Digital Edge reports financing and a
              multi-country pipeline that may provide platform scale. Yet market-level growth does not prove
              project-level returns. The public record does not show Digital Edge's revenue, EBITDA, utilization,
              signed-versus-billed MW, customer concentration, lease tenor, capex per MW, energy-cost pass-through or
              return thresholds. The reported possibility of a transaction at a valuation near US$10 billion is a media
              report, not a completed financing or audited valuation. The key diligence test is whether secured power
              and customer commitments convert into operating capacity on schedule and at attractive returns after
              construction, energy, financing and compliance costs. Until that bridge is available, the market case
              supports research-more rather than a market-size driven conviction entry.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scarce powered capacity is strategically valuable
            body: >-
              Independent outlooks consistently identify power availability, grid access and preleased capacity as
              binding variables, giving operators with executable sites a potential timing advantage.
            calloutType: strength
            claimRefs:
              - CM005
              - CM010
              - CM011
          - type: callout
            title: Market growth is not company-level economics
            body: >-
              Capacity and investment forecasts cannot substitute for Digital Edge's utilization, pricing, customer
              concentration, capex and return disclosures.
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Digital Edge entered the market with Stonepeak backing and a management team drawn from established
              infrastructure operators, using acquisitions and partnerships to build a multi-country footprint. Its 2025
              company disclosure described 21 data centers and more than 500 MW of critical IT load in service, under
              construction, and development, plus 300 MW held for future development. Independent coverage places that
              platform in a regional funding race rather than a protected niche: Mingtiandi described Equinix, Digital
              Realty, and GDS/DayOne as scaling in parallel, while Blackstone's AirTrunk transaction shows the strategic
              and financial scale of a direct APAC alternative. The comparison is directional because the sources use
              different dates and capacity definitions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP011
              - CP013
      - number: '3.2'
        title: Buyer choice and capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the same underlying need through a regional platform such as Digital Edge, a scaled
              incumbent such as Equinix or AirTrunk, a local operator, a partner-led deployment, or an internal build.
              Digital Edge's evidence-backed advantages are APAC footprint expansion, local partnerships,
              interconnection, and access to institutional capital. Its Japan transaction with CTC retained CTC as an
              anchor customer and paired data-center infrastructure with IT and cloud services, illustrating a
              distribution and trust mechanism that an internal build would need to recreate. Conversely, competitor
              scale is material: AirTrunk reported more than 800 MW committed to customers and land supporting over 1 GW
              of future growth. The public record does not support a like-for-like superiority claim on uptime, pricing,
              utilization, or customer outcomes.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP013
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The apparent moat is an execution system: capital availability, site and power access, local regulatory
              relationships, construction capability, and customer or channel partnerships. Digital Edge's initial Osaka
              and Tokyo investments, later CTC acquisition, and multi-country expansion provide evidence of that system,
              but they also expose the platform to capital intensity and financing competition. Mingtiandi reported that
              hyperscale facilities require substantial land, construction, and technology investment. Equinix
              separately claims 282 data centers across six continents, 522,000 interconnections, and more than 10,500
              customers. Blackstone's AirTrunk acquisition at an implied enterprise value above A$24 billion and
              Equinix's reported $94.23 billion market capitalization further illustrate the resource asymmetry. Digital
              Edge may still win underserved markets, but the evidence does not establish durable switching costs or
              pricing power.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Competitive diligence conclusion
        blocks:
          - type: paragraph
            body: >-
              Digital Edge appears positioned as a regional infrastructure consolidator with a credible capital and
              partnership playbook, not as a differentiated product vendor with transparent unit economics. Its
              customer-facing proposition is colocation and interconnection capacity across APAC, supported by energy
              efficiency and connectivity language in company materials. The key competitive question is therefore not
              whether demand exists, but whether Digital Edge can convert secured or planned capacity into contracted,
              profitable, and resilient workloads before larger platforms absorb the best sites and power. Public
              sources do not provide comparable list pricing, realized pricing, utilization, churn, SLA performance, or
              customer concentration. Those gaps limit confidence in any ranking and should keep the competitive
              assessment at research-more until customer contracts, campus-level economics, and renewal evidence are
              reviewed.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital-backed regional execution
            body: >-
              The combination of Stonepeak sponsorship, a $640 million equity raise, $1 billion of debt financing,
              acquisitions, and local anchor relationships gives Digital Edge a credible route to scale across multiple
              APAC markets.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP009
          - type: callout
            title: Scale does not prove moat
            body: >-
              Larger competitors have disclosed materially greater customer commitments or public-market capital bases,
              while Digital Edge has not disclosed comparable pricing, utilization, retention, or campus-level returns.
            calloutType: risk
            claimRefs:
              - CP007
              - CP011
              - CP012
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is capacity-led, but realized economics are private
        blocks:
          - type: paragraph
            body: >-
              The evidence describes Digital Edge as a data-center owner and operator selling infrastructure for
              colocation, hyperscale deployments, cloud demand and interconnection. Its commercial engine is therefore
              the conversion of powered, connected capacity into customer contracts and recurring facility revenue, not
              a software subscription or disclosed ARR model. The 2021 Japan acquisition added 5,000 cabinets and 18.5MW
              while retaining CTC as an anchor customer, and the India joint venture was designed around a phased 300MW
              hyperscale campus. These sources support the operating mechanism and capacity pipeline, but they do not
              establish billed revenue, occupancy, contract length, realized price per kW, gross margin, or cash
              collection. Official and media materials also use “committed capital,” financing, and capacity measures
              that must not be treated as revenue or cash available for distribution.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI010
              - CI013
              - CI015
      - number: '4.2'
        title: Regional partnerships are the observable GTM proxy
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a relationship-led, asset-backed go-to-market motion. Digital Edge combines
              local partners, existing financing relationships and anchor or hyperscale customers with acquisitions and
              greenfield development. CTC remained an anchor customer across the five acquired Japanese facilities,
              while NIIF and AGP contributed local investment, real-estate and construction capabilities for India. The
              financing announcement says most participating lenders were existing financing partners, which is evidence
              of capital-market relationship continuity rather than sales efficiency. No source provides CAC, sales
              cycle, backlog conversion, renewal, churn, customer concentration, or payback. Those missing denominators
              make a conventional SaaS funnel or efficiency ratio inappropriate; diligence should instead test signed
              MW, contracted versus billed capacity, customer-specific pricing, and the timing from land and power
              readiness to revenue commencement.
            claimRefs:
              - CI006
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI009
              - CI013
              - CI014
      - number: '4.3'
        title: Scale requires substantial capital and exposes financing dependencies
        blocks:
          - type: paragraph
            body: >-
              The cost base is structurally dominated by land, power, construction, equipment, connectivity, energy and
              ongoing facility operations. The 2021 Japan transaction illustrates the asset intensity: approximately
              US$230 million purchased five facilities and underlying real property, adding 18.5MW. The India platform
              involves a 47-acre, multi-phase 300MW greenfield project, while later reporting describes more than US$1
              billion of debt financing across campus expansions and a US$575 million HoldCo loan. These are financing
              and development facts, not proof of positive free cash flow. A sustainability-linked conversion feature
              may affect financing terms, but public sources do not disclose covenants, interest cost, maturity,
              refinancing exposure, capex per MW, operating margin, or cash balance. The key financial dependency is
              timely conversion of secured or planned power into contracted, operating capacity.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI015
              - CI016
              - CI017
              - CI018
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Digital Edge shows credible platform-building and access to institutional financing, including reported
              equity and debt capital and a current HoldCo facility. That supports a view that capital access is a
              strength, but not that the business is self-funding or that the equity is attractively priced. The adverse
              evidence is the same feature that creates upside: data centers require long-lived, phased commitments, and
              an independent market account notes that leases can exceed ten years while the tenant pool may be limited
              and risk higher. Underwriting should remain conditional until management supplies audited revenue and
              EBITDA, utilization by site, contracted and billed MW, customer concentration, capex and maintenance
              capex, debt terms, cash and burn, and project-level returns. At the current evidence level, valuation and
              margin path remain unknown, so the chapter supports research-more rather than a priced investment
              conclusion.
            claimRefs:
              - CI015
              - CI016
              - CI017
              - CI018
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional capital access
            body: >-
              The reported US$575 million HoldCo loan and earlier equity-and-debt financing indicate access to lenders
              and investors, but the sources do not disclose the resulting cash balance or project-level returns.
            calloutType: strength
            claimRefs:
              - CI013
              - CI014
          - type: callout
            title: Underwriting opacity
            body: >-
              Revenue, EBITDA, utilization, realized pricing, customer concentration, capex intensity and runway are not
              publicly disclosed in the retained sources, leaving capital adequacy and margin path unresolved.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
              - CI017
          - type: callout
            title: Require project-level financial evidence
            body: >-
              Before assigning an equity valuation, request site-level contracted MW, billed MW, revenue, EBITDA,
              capex-to-date, remaining capex, debt service and customer concentration for each operating and development
              campus.
            calloutType: recommendation
            claimRefs:
              - CI018
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and operating model
        blocks:
          - type: paragraph
            body: >
              Digital Edge sells infrastructure capacity rather than a software product: hyperscale customers receive
              multi-megawatt deployments, while enterprise customers can use individual cabinets or private cages. The
              company describes its facilities as carrier-neutral and connectivity-rich, with teams handling local
              regulatory and operational requirements across Asia-Pacific. Public reporting places the platform across
              Japan, South Korea, India, Malaysia, Indonesia, and the Philippines, while the current company surface
              also describes operations across the region. The operating model is therefore a distributed physical
              platform: acquire or develop sites, secure power, build or modernize facilities, then provide colocation
              and interconnection with local execution. The model's main product risk is not a single software release
              but whether power, construction, connectivity, and facility operations scale together without degrading
              customer service.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE008
              - CE009
              - CE012
              - CE015
      - number: '5.2'
        title: Capacity, maturity, and roadmap
        blocks:
          - type: paragraph
            body: >
              The strongest public maturity signal is the combination of operating facilities and a visible construction
              pipeline. TelecomTV reported 21 data centers and more than 500MW of critical IT load in service, under
              construction, or in development, plus another 300MW planned; a later industry report described around 25
              data centers in operation and under construction and more than 1.1GW of secured IT power. These figures
              are not directly comparable because they use different dates and capacity definitions, so they should not
              be combined into one point estimate. Specific milestones include the 36MW SEL2 facility as the first
              building in a planned 100MW Seoul campus, the 23MW EDGE2 opening in Jakarta, and a planned first facility
              in a 300MW Navi Mumbai campus. The evidence supports a substantial build-out, not proof that all secured
              or planned capacity is live, leased, or profitable.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE011
              - CE012
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE011
              - CE012
              - CE015
      - number: '5.3'
        title: Differentiation, dependencies, and controls
        blocks:
          - type: paragraph
            body: >
              Digital Edge's differentiation is principally regional execution and infrastructure access: the founding
              team brought experience from Equinix, Facebook, Tata Communications, and Macquarie, while the company
              emphasizes local expertise across diverse regulatory environments. The Japan acquisition illustrates the
              model: five facilities added 5,000 cabinets and 18.5MW, retained CTC as an anchor customer, and was paired
              with a stated plan to modernize sites and connect them through Cross Link. The company also markets
              AI-ready facilities and an NVIDIA partnership, plus a design PUE of 1.25 and EcoVadis Silver on its
              current site. Those are useful diligence leads, not independent proof of workload performance, uptime,
              security certification, or realized efficiency. Public sources do not establish incident history,
              service-level attainment, detailed cyber controls, or the economics of the interconnection layer.

              India provides another example of the dependency model: Digital Edge entered through a joint venture with
              NIIF and AGP for a phased 300MW Navi Mumbai facility, making local partners part of execution rather than
              a peripheral channel. This can accelerate access to land, power, and permitting, but also makes delivery
              quality dependent on partner governance and multi-party coordination.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE011
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regional platform with tangible delivery evidence
            body: >-
              The combination of acquired facilities, new campus milestones, and multi-country operating coverage
              indicates a real infrastructure platform rather than an unbuilt development concept.
            calloutType: strength
            claimRefs:
              - CE006
              - CE008
              - CE011
          - type: callout
            title: Secured capacity is not demonstrated operating performance
            body: >-
              Capacity counts vary by date and definition, while public evidence does not disclose uptime, utilization,
              contracted-versus-live MW, security attestations, or customer service outcomes at facility level.
            calloutType: risk
            claimRefs:
              - CE007
              - CE009
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Digital Edge serves several distinct demand pools rather than one homogeneous customer segment. The public
              record identifies hyperscale and AI-ready infrastructure demand, enterprise and retail colocation, cloud
              and network users, digital-media users, and interconnection requirements. In Japan, the CTC transaction
              links infrastructure with outsourced IT and cloud services, while the Philippines launch describes cloud,
              network, digital-media, enterprise, and domestic internet-service-provider demand. India is framed around
              hyperscale deployments and a large greenfield campus. These are different buyer and user motions:
              hyperscalers and cloud providers may consume large blocks of power, enterprise and retail customers may
              value connectivity and managed services, and partners may contribute local access or anchor demand. Public
              sources establish the segments and route to market, but not the percentage of revenue or capacity
              attributable to each.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and capacity evidence
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest where a facility, capacity figure, and customer-facing status are stated
              together. The company and industry sources describe a platform expanding from initial Japan assets to 21
              data centers and more than 500 MW in service, construction, or development, with additional
              future-development capacity. The 2024 Philippines material says NARRA1 had already received bookings,
              including from multiple major domestic internet service providers, while the 2026 leasing report describes
              a material acceleration by US hyperscalers over the prior 18 months. These indicators support commercial
              traction, but they are not equivalent to active customer counts, billed utilization, contracted recurring
              revenue, or renewal performance. The same Philippines coverage explicitly says the next facility depended
              on filling the first one and securing financing, which is a useful constraint on extrapolating growth.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Named counterparties and deployment proof
        blocks:
          - type: paragraph
            body: >-
              Named counterparties provide better evidence than a logo list because the sources describe the role each
              party plays. Itochu Techno-Solutions (CTC) remained an anchor customer across five acquired Japanese data
              centers and was expected to help grow the business; the same transaction tied the assets to retail and
              hyperscale expansion. NARRA1 was built with Threadborne Group and had bookings from multiple domestic
              internet service providers, although the individual providers were not named. In India, NIIF and AGP
              joined Digital Edge in a hyperscale platform whose first project was a 300 MW Navi Mumbai facility. These
              examples show production assets, anchor relationships, joint ventures, and booked demand, but public
              evidence does not establish contract terms, customer tenure, realized outcomes, or whether the planned
              Indian capacity is operational.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU010
      - number: '6.4'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              There is no public disclosure in the assigned evidence of NRR, GRR, churn, renewal rates, average contract
              length, customer-level revenue, or campus-level utilization. Expansion is visible through repeat
              investment, partnerships, and additional facilities: CTC was described as a long-term partner,
              renewable-energy capacity is being pursued across existing and planned deployments, and the platform has
              expanded across six or nine Asian countries depending on the source and measurement date. However, the
              customer mix may be concentrated because the 2020 industry coverage warned that the tenant pool is
              limited, and the 2026 report attributes faster leasing to US hyperscalers without naming tenants or
              contract sizes. The Philippines source also documents financing and fill-rate dependencies for the next
              site. Investment underwriting should therefore treat capacity and bookings as leading indicators, not
              proof of durable diversified revenue.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Named deployments are more credible than logos
            body: >-
              CTC is identified as an anchor customer across five Japanese facilities, while NARRA1 bookings and the
              India JV tie customer demand to specific assets or counterparties.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Capacity is not retention
            body: >-
              The public evidence does not disclose active customers, utilization, churn, renewals, contract terms, or
              customer-level revenue; reported MW and bookings should not be treated as recurring revenue.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
          - type: callout
            title: Underwrite customer durability before scaling the thesis
            body: >-
              Request campus-level contracted and billed MW, top-10 customer concentration, renewal cohorts, churn,
              average contract length, and signed-versus-planned capacity before assigning value to the expansion
              pipeline.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Digital Edge operates across jurisdictions where data residency and critical-infrastructure obligations
              can change the economics and operating design of a campus. Philippine Executive Order No. 119 classifies
              government data and generally requires Top Secret and Secret data to remain within Philippine territory;
              it also covers private entities handling government data in public-private partnerships, public services,
              public utilities, critical infrastructure, and strategic or sensitive projects. The same source notes that
              agencies remain responsible for provider safeguards and that foreign legal compulsion can remain relevant
              even when servers are local. Singapore's announced reporting rules add a separate operational duty for
              owners of critical information infrastructure: suspected advanced persistent threat incidents must be
              reported to the Cyber Security Agency. These rules are not proof that Digital Edge is currently
              non-compliant, but they make customer qualification, contracting, data location, incident response, and
              jurisdictional structure material diligence items. The legal register therefore ranks regulatory
              implementation and cross-border control above unverified litigation risk; no assigned source establishes a
              Digital Edge lawsuit, licence breach, or enforcement action.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR012
      - number: '7.2'
        title: Operating, quality, security, and financial risk
        blocks:
          - type: paragraph
            body: >-
              The platform's growth model compounds construction, commissioning, power, uptime, and financing risks.
              Public descriptions move from a 2020 US$1 billion equity commitment to 21 operating, under-construction,
              or development data centers and more than 500 MW of critical IT load in a 2025 account, while 2026
              reporting describes approximately 25 facilities and more than 1.1 GW of secured IT power. These are
              different measures and periods, not a verified trajectory of revenue or utilization. The 2025 account also
              describes US$640 million of equity and US$1 billion of debt financing, while 2026 reporting says the
              company raised more than US$1.6 billion in new equity and debt in the prior year; neither establishes cash
              available, leverage, capex returns, or runway. Singapore's cyber threat environment is adverse context for
              any operator connected to critical infrastructure, but the assigned sources do not report a Digital Edge
              breach or outage. Diligence should test campus-level commissioning, contracted versus secured power, debt
              covenants, insurance, resilience testing, and incident records rather than infer safety from the absence
              of a public incident.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Partner, customer, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Digital Edge's model relies on local partners, anchor customers, lenders, utilities, and hyperscale or
              enterprise demand. Its Japan acquisition retained ITOCHU Techno-Solutions as an anchor customer across
              five facilities, while the initial platform was formed through partnerships with Japanese infrastructure
              companies and a Stonepeak-backed capital commitment. Those relationships can accelerate market entry, but
              they also create counterparty, concentration, renewal, and governance exposure that public evidence does
              not quantify. The 2026 sale-process reports are preliminary and describe no final decision; they should be
              treated as a financing and ownership uncertainty, not as evidence of a completed transaction or a company
              valuation. The practical kill criteria are measurable: a material loss or non-renewal of an anchor or
              hyperscale tenant; repeated commissioning or availability misses; inability to secure power or permits on
              planned campuses; a reportable cyber incident without timely containment; or financing terms that require
              uneconomic expansion. Management should provide customer concentration, contracted-versus-live MW,
              renewal, outage, capex, debt, and partner termination data before an investment decision.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment implication
            body: >-
              Digital Edge has credible strategic assets and capital backing, but the public record leaves the key risk
              controls unquantified. Treat the opportunity as research-more until management supplies campus-level
              operating, customer, financing, cyber, and jurisdictional evidence.
            calloutType: risk
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR013
          - type: callout
            title: Thesis-break triggers
            body: >-
              A missed commissioning plan, an uncontained reportable cyber incident, loss of a material anchor or
              hyperscale tenant, inability to convert secured power into contracted live load, or financing that makes
              expansion uneconomic should trigger a thesis reset.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR009
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high risk, and an unknown valuation stance.
              Independent reports in April and May 2026 said Digital Edge was exploring strategic alternatives around a
              possible $10 billion valuation, but neither report establishes a signed transaction, the basis of the
              valuation, or proceeds available to common equity. The platform's ability to attract institutional capital
              is encouraging, yet funding raised is not cash available to equity holders and reported capacity is not
              operating cash flow. A buy decision therefore requires a verified enterprise-value bridge, current cap
              table, debt and preference waterfall, audited earnings, and campus-level utilization. Until those inputs
              connect price to cash generation and downside protection, any precise return target would be false
              precision rather than valuation analysis.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: Financing, scale, and capital-structure context
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing history supports platform credibility while underscoring capital intensity. In
              January 2025, Digital Edge announced approximately $640 million of equity and $1 billion of debt across
              campus expansions; it also described the equity component as oversubscribed. The same announcement
              reported 21 data centers, more than 500 MW in service or in the development pipeline, and another 300 MW
              held for future development. In May 2026, Data Center Dynamics reported a separate inaugural $575 million
              HoldCo facility, while quoting management that more than $2 billion of green financings had supported the
              platform. These figures show financing access, not low leverage or durable equity returns. HoldCo debt can
              introduce refinancing and structural-subordination risk, and the public evidence does not allocate debt,
              capex, contracted load, or cash yield by campus.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately conditional because public inputs do not support
              probability-weighted valuation ranges. In a bull case, disclosed capacity converts into contracted,
              energized, cash-generating load and financing remains serviceable; only then could a price near the
              reported sale indication be tested against verified earnings and asset value. The base case assumes
              continued expansion but no investable valuation until audited economics and the equity bridge are
              produced. The bear case combines slower fill, construction delays, higher financing costs, or multiple
              compression. NEXTDC's reported October 2026 market capitalization of $2.93 billion, down 47.5% from its
              reported 2025 year-end value, is a useful market-risk signal. It is not a direct comparable to a private
              transaction figure without enterprise value, leverage, geography, maturity, and operating normalization.
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A reported strategic review suggests potential exit interest, and Digital Edge has a history of acquiring
              operating assets as well as developing capacity. Exit readiness nonetheless depends on whether buyers can
              verify contracted revenue, utilization, build costs, power availability, customer concentration, and
              debt-adjusted cash flow. The final diligence pack should include audited financials, a campus-level
              operating model, signed-versus-secured MW, customer concentration and renewals, project and HoldCo debt
              terms, security preferences, and an enterprise-value-to-common-equity reconciliation. Thesis-break
              triggers are delayed conversion of capacity into billed load, leverage rising without matching cash
              generation, refinancing stress, a down-round, or a strategic process that fails to validate the reported
              price. Strong contracted fill, transparent capital terms, and audited cash yield would move the
              recommendation toward an investable entry.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more: financing access and reported scale support strategic credibility, but the available
              evidence cannot connect the reported price indication to common-equity returns.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat refinancing stress, a down-round, or failure to convert developed capacity into contracted and
              billed load as a thesis break until economics and capital terms are verified.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV015
              - CV016
