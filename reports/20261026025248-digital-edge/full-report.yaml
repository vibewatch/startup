figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Digital Edge progressed from a 2020 sponsor-backed launch through acquisitions, campus openings, leadership
      succession, and additional financing, while a possible 2026 strategic review remained preliminary.
    data:
      items:
        - date: '2020-08-24'
          label: Platform formation
          details: >-
            Stonepeak, its investors, and management announced Digital Edge with a US$1 billion equity capital
            commitment.
          tone: positive
          claimRefs:
            - CO001
            - CO003
        - date: '2020-08-24'
          label: Initial Japan investments
          details: >-
            The launch included a 12MW Osaka development partnership and a strategic investment involving the Mejirozaka
            Data Center in Tokyo.
          tone: positive
          claimRefs:
            - CO004
        - date: '2021-12-02'
          label: Five-center Japan acquisition
          details: >-
            Digital Edge announced the approximately US$230 million acquisition of five CTC data centers, with CTC
            remaining an anchor customer.
          tone: positive
          claimRefs:
            - CO006
        - date: '2024'
          label: Jakarta expansion
          details: The company reported opening the 23MW EDGE2 facility in Jakarta during 2024.
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-10
          label: Incheon campus opening
          details: >-
            Digital Edge reported opening the 36MW SEL2 facility, the first building in its planned 100MW Incheon
            campus.
          tone: positive
          claimRefs:
            - CO010
        - date: '2025-01-06'
          label: Equity and debt financing
          details: >-
            Reporting described approximately US$640 million of equity and US$1 billion of debt financing for regional
            expansion.
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-Q2
          label: CEO succession
          details: John Freeman succeeded Samuel Lee as CEO, while Lee transitioned to senior advisor to the board.
          tone: neutral
          claimRefs:
            - CO011
        - date: '2026-04-29'
          label: Strategic review reported
          details: >-
            Data Center Dynamics reported options including a partial or full sale, while noting that no final decision
            had been made.
          tone: risk
          claimRefs:
            - CO015
            - CO016
        - date: '2026-05-22'
          label: HoldCo financing
          details: Digital Edge announced the closing of its inaugural US$575 million HoldCo financing.
          tone: positive
          claimRefs:
            - CO013
    approximationNotes: >-
      The timeline uses announcement or publication dates; the Jakarta entry is shown at year precision because the
      retained source specifies only that it opened earlier in 2024.
    claimRefs:
      - CO001
