    title: Recommendation logic
    type: flow
    summary: >-
      Scale and financing access support strategic value, while operating and capital-stack gaps prevent a
      price-sensitive investment recommendation.
    data:
      nodes:
        - id: scale
          label: Scale evidence
          detail: >-
            21 data centers, more than 500 MW in service or development, and 300 MW held for future development were
            reported in 2025
        - id: capital
          label: Capital access
          detail: >-
            Approximately $640M equity and $1B debt were announced in 2025, followed by a reported $575M HoldCo facility
            in 2026
        - id: price
          label: Price indication
          detail: Independent reports described a possible strategic transaction around $10B
        - id: economics
          label: Economics gap
          detail: >-
            Audited earnings, utilization, contracted load, capex returns, and customer concentration are not disclosed
            in the retained sources
        - id: equity
          label: Equity bridge gap
          detail: Net debt, security preferences, dilution, and transaction-value basis remain unverified
        - id: decision
          label: Research-more
          detail: Set an entry price only after private evidence establishes cash generation and common-equity proceeds
      edges:
