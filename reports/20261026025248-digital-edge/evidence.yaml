evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-performance
    missingEvidence: Audited revenue, EBITDA, utilization, contracted backlog, customer count, headcount, and customer concentration.
    whyItMatters: Portfolio scale and financing access do not establish earnings quality, demand concentration, or cash generation.
    diligencePath: >-
      Request audited financial statements, lender reporting, a campus operating schedule, contracted-versus-live MW,
      and top-customer concentration.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current cap table, executed equity terms, liquidation preferences, debt security, and any binding
      strategic-review offers.
    whyItMatters: A preliminary reported sale ceiling cannot establish investable pricing or common-equity value.
    diligencePath: >-
      Request the cap table, financing documents, lender term sheets, valuation materials, and any signed bids or
      strategic-review mandate.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A dated portfolio schedule reconciling secured power with live, under-construction, development, and reserved
      capacity by country.
    whyItMatters: >-
      The 2025 and 2026 disclosures use non-equivalent capacity denominators and cannot be combined into one current
      operating KPI.
    diligencePath: Obtain a management-certified asset, power, phase, utilization, and country roll-forward as of the latest quarter.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete board, committee, executive, voting-rights, and succession documentation.
    whyItMatters: >-
      Named leaders demonstrate senior coverage but do not establish governance independence, control, or succession
      depth.
    diligencePath: >-
      Request the current board register, committee charters, shareholder agreement, executive organization chart, and
      succession plan.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Complete investor, lender, customer, and adviser schedules with ownership, control, and economic exposure.
    whyItMatters: >-
      The partial public map cannot establish sponsor control, refinancing risk, investor preferences, or customer
      concentration.
    diligencePath: Request the cap table, debt schedule, material customer report, and current strategic-adviser mandates.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: company-economics
    missingEvidence: Audited revenue, EBITDA, utilization, pricing, customer concentration and signed-versus-billed MW by campus.
    whyItMatters: >-
      Market growth cannot be translated into Digital Edge cash generation or project returns without operating and
      commercial metrics.
    diligencePath: >-
      Request audited financials, campus-level operating schedules, customer concentration, contract abstracts and
      utilization bridges under NDA.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: market-size
    missingEvidence: A bounded Digital Edge SAM/SOM by country, customer segment, capacity type and delivery horizon.
    whyItMatters: >-
      Regional investment forecasts overlap and use different units, so they cannot support a company-specific market
      share or valuation.
    diligencePath: >-
      Reconcile a bottom-up pipeline model to addressable MW, target markets, contracted capacity, pricing and delivery
      dates.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: Project-level power rights, permits, construction budgets, energy-price exposure and return thresholds.
    whyItMatters: Grid and construction constraints can delay or impair the conversion of announced capacity into operating assets.
    diligencePath: >-
      Obtain site-by-site development schedules, interconnection agreements, capex budgets, financing terms and
      sensitivity cases.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list prices, realized prices, contract terms, discounts, and renewal economics for Digital Edge and
      named competitors.
    whyItMatters: >-
      Without price and contract evidence, capability comparisons cannot establish buyer savings, margin, or pricing
      power.
    diligencePath: >-
      Obtain anonymized customer quotes, executed contracts, renewal schedules, and campus-level price-to-power
      economics.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: Utilization, churn, SLA performance, customer concentration, and signed-versus-billed MW by campus.
    whyItMatters: Capacity and capital are not equivalent to contracted demand, retention, or returns.
    diligencePath: >-
      Request a campus-level operating pack with customer cohorts, contracted MW, utilization, uptime, churn, and
      renewal data.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: A complete current inventory of local operators, internal-build alternatives, and likely entrants by APAC market.
    whyItMatters: The assigned pool supports a directional comparison but cannot establish exhaustive competitor coverage.
    diligencePath: Refresh each target market with regulator, procurement, customer, and local-operator evidence before underwriting.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: private-financials
    missingEvidence: Audited revenue, EBITDA, utilization, gross margin and cash-flow statements by campus and country.
    whyItMatters: >-
      Without recognized revenue and margins, capacity and financing cannot be translated into earnings quality or
      valuation.
    diligencePath: Request audited FY2024-FY2026 financials, management accounts and a revenue bridge by service and geography.
    relatedQuestionRefs:
      - QI002
      - QI005
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, debt schedule, covenants, remaining project capex and committed funding.
    whyItMatters: The platform is capital-intensive and a financing headline does not show runway or refinancing risk.
    diligencePath: Obtain the latest liquidity report, debt agreements, maturity ladder, capex plan and downside funding plan.
    relatedQuestionRefs:
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: Customer-level contracted MW, billed MW, renewal, churn, price and concentration data.
    whyItMatters: A capacity-led platform can grow assets without converting them into durable, high-margin revenue.
    diligencePath: Request a customer and campus schedule reconciled to signed contracts, invoices and utilization reports.
    relatedQuestionRefs:
      - QI001
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: Current equity valuation, capitalization table and liquidation preferences as of 2026-10-26.
    whyItMatters: Reported financing is not an equity price and cannot establish whether the investment is attractive.
    diligencePath: Request the latest cap table, preferred-security terms, valuation memo and any current transaction indications.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Facility-level uptime, outage history, SLA attainment, incident response, and disaster-recovery test results.
    whyItMatters: >-
      Physical infrastructure value depends on reliable service, but public marketing statements do not establish
      realized performance.
    diligencePath: >-
      Request the last 24 months of uptime and incident logs, SLA credits, root-cause analyses, and independent
      resilience test reports by facility.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: Current security certifications, privacy controls, access-control standards, and third-party assurance reports.
    whyItMatters: Enterprise and AI customers require evidence of security and compliance, especially across multiple jurisdictions.
    diligencePath: >-
      Obtain current ISO/SOC attestations, penetration-test summaries, privacy policies, and customer security
      questionnaires.
    relatedQuestionRefs:
      - QE006
  - type: conflicting-data
    severity: material
    topic: capacity
    missingEvidence: >-
      A dated asset register reconciling live, under-construction, in-development, planned, secured, and contracted IT
      load.
    whyItMatters: >-
      Public figures range from 500MW-plus critical IT load to more than 1.1GW secured IT power and are not directly
      comparable.
    diligencePath: >-
      Request a campus-by-campus schedule with power, construction stage, customer commitments, energization date, and
      utilization denominator.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: missing-source
    severity: minor
    topic: performance
    missingEvidence: Independent evidence of realized PUE, AI workload density, network performance, and customer deployment outcomes.
    whyItMatters: Product differentiation currently rests largely on company positioning and disclosed infrastructure scale.
    diligencePath: Request third-party benchmark reports, anonymized customer references, and facility-level energy and network KPIs.
    relatedQuestionRefs:
      - QE003
      - QE005
      - QE010
  - type: private-evidence-only
    severity: blocking
    topic: retention
    missingEvidence: >-
      Customer-level cohorts showing active accounts, gross retention, net retention, churn, renewal terms, and
      expansion revenue.
    whyItMatters: >-
      Capacity, bookings, and reported leasing momentum do not establish recurring revenue durability or customer
      lifetime value.
    diligencePath: >-
      Request the last 24 months of cohort, renewal, churn, and expansion reports reconciled to billed revenue by campus
      and customer segment.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-10 customer identities or anonymized bands, contracted and billed MW, revenue share, and lease expiry
      schedule.
    whyItMatters: >-
      Hyperscale-led leasing and a potentially limited tenant pool can make demand, pricing, and refinancing outcomes
      sensitive to a small number of counterparties.
    diligencePath: >-
      Obtain a campus-by-campus customer concentration schedule with signed-versus-billed MW and renewal dates under
      NDA.
    relatedQuestionRefs:
      - QU006
      - QU008
    relatedTableRefs:
      - TU003
  - type: stale
    severity: material
    topic: planned-capacity
    missingEvidence: >-
      Current 2026 operating status and utilization for the Navi Mumbai, Indonesia, Philippines, and other announced
      expansion campuses.
    whyItMatters: >-
      Announced or under-construction capacity may not convert to operational, contracted, or cash-generating capacity
      on the expected timetable.
    diligencePath: >-
      Request a current project tracker with construction milestones, energization dates, contracted MW, billed MW, and
      remaining capex.
    relatedQuestionRefs:
      - QU002
      - QU007
  - type: private-evidence-only
    severity: material
    topic: operations
    missingEvidence: >-
      Campus-level contracted MW, live MW, utilization, availability, commissioning variance, and service-credit
      history.
    whyItMatters: Secured power and development capacity do not establish realized revenue, uptime, or economic fill.
    diligencePath: >-
      Request a campus-by-campus operating pack with signed contracts, energization dates, utilization, uptime, and
      customer credits.
    relatedQuestionRefs:
      - QR004
      - QR006
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: Audited revenue, EBITDA, capex, liquidity, debt maturity, covenants, preferences, and return hurdles.
    whyItMatters: Financing raised is not cash available and cannot establish runway, leverage tolerance, or returns.
    diligencePath: >-
      Obtain audited financial statements, debt documents, cap table, preference stack, liquidity forecast, and campus
      underwriting.
    relatedQuestionRefs:
      - QR005
      - QR009
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Customer and partner concentration, renewal, termination, take-or-pay, and replacement-right data.
    whyItMatters: A named anchor customer or leasing acceleration does not quantify dependence or durability.
    diligencePath: >-
      Request anonymized top-customer revenue and MW bands, renewal cohorts, partner termination rights, and replacement
      plans.
    relatedQuestionRefs:
      - QR007
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: cyber
    missingEvidence: >-
      Digital Edge-specific incident history, independent assurance, penetration tests, tabletop outcomes, and regulator
      communications.
    whyItMatters: Regional threat activity and reporting duties establish exposure, not the company's control effectiveness.
    diligencePath: >-
      Request SOC or equivalent assurance, incident register, material-event attestations, and facility-level response
      playbooks.
    relatedQuestionRefs:
      - QR003
      - QR006
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: blocking
    topic: valuation-gap
    missingEvidence: >-
      Current common-equity price, enterprise value, net debt, security classes, dilution, and liquidation-preference
      waterfall.
    whyItMatters: >-
      The reported sale indication cannot be converted into common-equity proceeds or a target return without the
      capital-stack bridge.
    diligencePath: >-
      Obtain the current cap table, financing term sheets, debt schedule, preferred rights, and an
      enterprise-value-to-common-equity reconciliation.
    relatedQuestionRefs:
      - QV007
      - QV010
  - type: private-evidence-only
    severity: blocking
    topic: operating-economics-gap
    missingEvidence: >-
      Audited revenue, EBITDA, utilization, contracted and billed MW, backlog, capex-to-complete, and campus-level
      returns.
    whyItMatters: >-
      Capacity and financing amounts do not establish cash generation, return on invested capital, or debt-service
      capacity.
    diligencePath: >-
      Request audited financial statements and a campus-by-campus operating model reconciled to signed customer
      contracts and energization milestones.
    relatedQuestionRefs:
      - QV006
      - QV007
      - QV009
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Binding bids, transaction perimeter, valuation basis, and buyer diligence conclusions for the reported strategic
      review.
    whyItMatters: An attributed sale indication does not establish executable liquidity or price discovery.
    diligencePath: Review adviser materials, signed indications of interest, transaction perimeter, and any binding bid under NDA.
