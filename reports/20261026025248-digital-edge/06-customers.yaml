chapter:
  number: 6
  title: Customers
  summary: Digital Edge has credible evidence of customer-facing deployments and expansion partnerships across Japan, the Philippines, India, and broader APAC, but public materials do not disclose customer counts, utilization, renewals, churn, or revenue concentration. The strongest proof is tied to named counterparties and specific facilities; the principal diligence risk is converting booked or planned capacity into durable, diversified cash-generating demand.
sections:
  - id: customer-segmentation
    title: Customer segments and buying motion
    body: >-
      Digital Edge serves several distinct demand pools rather than one homogeneous customer segment. The public record identifies hyperscale and AI-ready infrastructure demand, enterprise and retail colocation, cloud and network users, digital-media users, and interconnection requirements. In Japan, the CTC transaction links infrastructure with outsourced IT and cloud services, while the Philippines launch describes cloud, network, digital-media, enterprise, and domestic internet-service-provider demand. India is framed around hyperscale deployments and a large greenfield campus. These are different buyer and user motions: hyperscalers and cloud providers may consume large blocks of power, enterprise and retail customers may value connectivity and managed services, and partners may contribute local access or anchor demand. Public sources establish the segments and route to market, but not the percentage of revenue or capacity attributable to each.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and capacity evidence
    body: >-
      Adoption evidence is strongest where a facility, capacity figure, and customer-facing status are stated together. The company and industry sources describe a platform expanding from initial Japan assets to 21 data centers and more than 500 MW in service, construction, or development, with additional future-development capacity. The 2024 Philippines material says NARRA1 had already received bookings, including from multiple major domestic internet service providers, while the 2026 leasing report describes a material acceleration by US hyperscalers over the prior 18 months. These indicators support commercial traction, but they are not equivalent to active customer counts, billed utilization, contracted recurring revenue, or renewal performance. The same Philippines coverage explicitly says the next facility depended on filling the first one and securing financing, which is a useful constraint on extrapolating growth.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named counterparties and deployment proof
    body: >-
      Named counterparties provide better evidence than a logo list because the sources describe the role each party plays. Itochu Techno-Solutions (CTC) remained an anchor customer across five acquired Japanese data centers and was expected to help grow the business; the same transaction tied the assets to retail and hyperscale expansion. NARRA1 was built with Threadborne Group and had bookings from multiple domestic internet service providers, although the individual providers were not named. In India, NIIF and AGP joined Digital Edge in a hyperscale platform whose first project was a 300 MW Navi Mumbai facility. These examples show production assets, anchor relationships, joint ventures, and booked demand, but public evidence does not establish contract terms, customer tenure, realized outcomes, or whether the planned Indian capacity is operational.
    claimRefs: [CU006, CU007, CU008, CU010]
    tableRefs: [TU003]
  - id: retention-expansion-risk
    title: Retention, expansion, and concentration risk
    body: >-
      There is no public disclosure in the assigned evidence of NRR, GRR, churn, renewal rates, average contract length, customer-level revenue, or campus-level utilization. Expansion is visible through repeat investment, partnerships, and additional facilities: CTC was described as a long-term partner, renewable-energy capacity is being pursued across existing and planned deployments, and the platform has expanded across six or nine Asian countries depending on the source and measurement date. However, the customer mix may be concentrated because the 2020 industry coverage warned that the tenant pool is limited, and the 2026 report attributes faster leasing to US hyperscalers without naming tenants or contract sizes. The Philippines source also documents financing and fill-rate dependencies for the next site. Investment underwriting should therefore treat capacity and bookings as leading indicators, not proof of durable diversified revenue.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
    figureRefs: [FU001]
