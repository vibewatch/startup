      basis: "Publicly named customer and deployment references retained in the assigned pool, covering Japan, Philippines, and India announcements through 2026-10-26."
    rows:
      - [Itochu Techno-Solutions (CTC), "IT services / enterprise cloud", "Anchor customer across five acquired Japanese data centers", "Production asset and operating relationship", "CTC remained an anchor customer and would work with Digital Edge to grow each facility", "No contract duration, revenue, or renewal data"]
      - [Major domestic Philippine internet service providers, "Network / cloud", "Bookings for NARRA1, a 10 MW and 2,200-cabinet Manila facility", "Booked demand; customer names not disclosed", "Multiple major domestic ISPs had booked capacity", "No named provider, booked MW, commencement date, or realized utilization"]
      - [NIIF and AGP DC InvestCo, "Infrastructure partners for hyperscale tenants", "300 MW greenfield Navi Mumbai hyperscale platform", "Announced development partnership", "JV and site designed to support hyperscale deployments", "Not evidence of completed facility, signed tenant, or operating revenue"]
    notes: "This is a partial enumeration of publicly named proof points, not a complete customer list. Partner and counterparty rows are included because public evidence does not disclose the end tenants."
    claimRefs: [CU006, CU007, CU008, CU010]
