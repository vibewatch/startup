          detail: "Bookings and reported leasing momentum are not disclosed as revenue or utilization."
        - id: operate
          label: "Operate and expand"
          order: 5
          touchpoints: ["21 data centers reported in 2025", "Six-country footprint", "Renewable-energy pipeline"]
          detail: "Expansion is visible, but customer durability and concentration remain unverified."
        - id: retention
          label: "Retention and expansion proof"
          order: 6
          touchpoints: ["NRR", "GRR", "Churn", "Renewal term", "Customer concentration"]
          detail: "No assigned source discloses these metrics."
callouts:
  - calloutType: strength
    title: Named deployments are more credible than logos
    body: "CTC is identified as an anchor customer across five Japanese facilities, while NARRA1 bookings and the India JV tie customer demand to specific assets or counterparties."
    claimRefs: [CU006, CU007, CU008]
  - calloutType: risk
    title: Capacity is not retention
    body: "The public evidence does not disclose active customers, utilization, churn, renewals, contract terms, or customer-level revenue; reported MW and bookings should not be treated as recurring revenue."
    claimRefs: [CU011, CU012, CU013]
  - calloutType: recommendation
    title: Underwrite customer durability before scaling the thesis
    body: "Request campus-level contracted and billed MW, top-10 customer concentration, renewal cohorts, churn, average contract length, and signed-versus-planned capacity before assigning value to the expansion pipeline."
    claimRefs: [CU012, CU013, CU014]
