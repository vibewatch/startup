      - [FreshDirect, E-grocery, "Online sale of Oishii products", "Production availability reported in 2024", "Named as a retail channel", "Single company-release-derived source; no volume or retention"]
      - ["World-class / Michelin-starred restaurants (unnamed)", Foodservice, "Premium berry ingredient", "Company profile describes supply, but current deployment is unclear", "Brand-positioning reference", "No named current account, outcome, order volume, or contract"]
