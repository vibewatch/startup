figures:
  - id: FU001
    title: Evidence-bounded customer adoption and expansion loop
    type: journey-map
    summary: >-
      Observed discovery and distribution steps are separated from the unmeasured repeat-purchase
      step that would establish durability.
    data:
      items:
        - label: Premium discovery
          detail: "Consumers encounter differentiated berries through chefs, premium grocers, reviews, and brand storytelling."
          touchpoints: ["Restaurants", "Whole Foods Market", "Product reviews"]
        - label: Trial
          detail: "Entry occurs through fresh berry trays, lower-priced formats, preserves, e-grocery, or the Chelsea Market kiosk."
          touchpoints: ["Retail shelf", "FreshDirect", "Oishii kiosk"]
        - label: Product experience
          detail: "Management says taste and product quality, rather than vertical-farming technology itself, drive consumer value."
          touchpoints: ["Taste", "Consistency", "Year-round availability"]
        - label: Repeat purchase
          detail: "Public sources do not disclose repeat rate, cohorts, satisfaction, churn, or retailer sell-through."
          touchpoints: ["Unmeasured consumer repeat", "Unmeasured retailer renewal"]
        - label: Channel expansion
          detail: "Retail relationships extend access across more states, formats, and price points."
          touchpoints: ["Regional grocers", "E-grocery", "Owned retail"]
        - label: Geographic replication
          detail: "The public footprint progressed from Northeast clusters to Chicago, 18 states, and Toronto."
          touchpoints: ["United States", "Toronto", "Regional production constraint"]
    approximationNotes: "Conceptual sequence based on disclosed channels; it does not imply measured conversion rates or cohort continuity."
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU008, CU011, CU016]
callouts:
  - calloutType: risk
    title: Availability is not retention
    body: >-
      Public evidence demonstrates wider distribution and isolated positive product response,
      but it does not disclose repeat purchase, retailer renewal, sell-through, channel mix,
      or top-customer exposure.
    claimRefs: [CU001, CU003, CU004, CU015, CU016]
