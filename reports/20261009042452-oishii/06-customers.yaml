schemaVersion: "report-v2"
artifact: customers
slug: oishii
runDate: 2026-10-09
company:
  name: Oishii
chapter:
  number: 6
  title: Customers
  summary: >-
    Oishii has moved beyond a narrow luxury launch into a multi-channel retail footprint
    spanning 18 U.S. states and Toronto, but the public evidence remains much stronger on
    availability than on repeat purchase, retention, sell-through, or customer concentration.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying surfaces
    body: >-
      Oishii reaches consumers through several buying surfaces rather than a disclosed
      account-based customer base. Whole Foods Market is the strongest named retail proof:
      Oishii identifies the partnership and a four-market regional footprint, while trade
      coverage also names Whole Foods, FreshDirect, and specialty grocers. A company-supplied
      Built In profile adds food-loving consumers and restaurants, but does not quantify
      either segment or establish recurring demand. The current official site also shows a
      direct kiosk and limited reservation format, indicating that Oishii is testing owned
      retail alongside wholesale channels. These sources establish where buyers can encounter
      the brand, not who pays the most, how much each channel contributes, or whether the
      end user and economic buyer differ inside grocery accounts.
    claimRefs: [CU003, CU004, CU012, CU016]
    tableRefs: [TU001]
  - id: adoption-and-geographic-expansion
    title: Adoption is visible through distribution, not usage cohorts
    body: >-
      The clearest current adoption signal is distribution breadth. Oishii's May 2026 release
      states that distribution had reached 18 states and Toronto, its first international
      retail market. Earlier snapshots show the path: 2023 trade coverage named expansion
      from Washington, D.C. into Maryland, Massachusetts, Connecticut, and New Jersey, and
      late-2024 reporting described a predominantly Northeast and mid-Atlantic footprint plus
      a Chicago launch. Pricing also broadened from the nearly $50 Omakase launch tray to a
      company-stated current range of $4.99 to $15. This is credible evidence of wider access
      and price architecture, but distribution points and lower entry prices are not the same
      as active buyers, sell-through, repeat purchase, or profitable utilization.
    claimRefs: [CU001, CU002, CU010, CU011, CU016]
    tableRefs: [TU002]
  - id: reference-quality-and-durability
    title: Named proof is real but shallow
    body: >-
      Public reference quality is uneven. Whole Foods Market and FreshDirect are named
      production retail channels, while restaurants are described only as a cohort and not
      identified individually. An independent The Kitchn reviewer praised a premium preserve,
      but that is one product experience rather than cohort-level proof; the same review
      called out a $35 price for a 6.9-ounce jar. The available material contains no NRR, GRR,
      churn, renewal, contract-length, satisfaction, repeat-purchase, retailer sell-through,
      or cohort data. Consequently, the chapter can verify availability and isolated positive
      product response, but cannot infer durable consumer loyalty or retailer renewal. The
      named-proof table therefore treats the disclosed examples as a sample and makes each
      limitation explicit rather than converting logos or testimonials into retention claims.
    claimRefs: [CU003, CU004, CU012, CU014, CU015, CU016]
    tableRefs: [TU003]
  - id: expansion-loop-and-concentration-risk
    title: Expansion loop and commercial constraints
    body: >-
      Oishii's expansion model appears to pair premium product differentiation with regional
      retail relationships, then widen price points, formats, and geographies. Management told
      FoodNavigator that fresh, local production constrained selling distance, that retailer
      inbound interest was strong, and that partners needed flexibility while processes and
      timelines evolved. The same interview argued that consumers buy the product for quality,
      not vertical farming itself, placing repeat taste and value at the center of durability.
      Independent sector framing in that article also highlighted heavy losses, bankruptcies,
      and consolidation in vertical farming. A supplier case study claims faster annotation
      work for Oishii's harvesting model, but it does not prove customer demand. Without
      channel mix, retailer terms, top-account share, or repeat-purchase data, geographic
      expansion remains an encouraging but incomplete proxy for commercial resilience.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU013, CU016]
    figureRefs: [FU001]
