    title: "Thesis-Break Triggers: Unit Economics and Automation Execution"
    body: "The core investment thesis rests on Oishii demonstrating that high gross margins from premium berry cultivars can withstand price tier compression while Tortuga robotics lower harvest labor by 50%. A definitive thesis-break event would occur if automated harvest throughput fails to replace human picker economics, if pathogen contamination forces an Amatelas Farm depopulation, or if retail sell-through at $4.99–$15 stall out across non-metro distribution channels."
