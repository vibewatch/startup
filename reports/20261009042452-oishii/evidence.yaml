evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Post-money equity valuation and capitalization table details for Series B and Series C rounds
    whyItMatters: Prevents independent computation of enterprise value, share price trajectory, and investor dilution
    diligencePath: Obtain confidential term sheets or shareholder certificates from lead investors NTT and Resilience Reserve
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Annual run-rate revenue, retail SKU volume throughput, and gross farm margin
    whyItMatters: Cannot assess whether revenue growth covers high electricity and facility depreciation costs
    diligencePath: Review audited management financial statements and retailer POS sell-through reports
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: retail-velocity-and-margins
    missingEvidence: >-
      Audited SKU-level retail sell-through volumes, velocity per store per week, and grocer margin splits across Whole
      Foods divisions.
    whyItMatters: >-
      Needed to verify whether expanded everyday price tiers ($4.99-$15) achieve sustainable unit profitability and
      volume velocity without retailer subsidies.
    diligencePath: >-
      Request audited IRI or Nielsen scan data from retail partners, distributor settlement statements, and store-level
      reorder frequency reports.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited farm-level cost of goods sold, electricity consumption per kilogram of marketable fruit, and net realized
      price per pound across retail accounts.
    whyItMatters: >-
      Without farm-level unit economics, it is impossible to evaluate whether premium produce pricing generates positive
      contribution margins after accounting for indoor power, packaging, and depreciation.
    diligencePath: >-
      Require company management to furnish audited farm-level P&Ls, facility utility bills, and wholesale distributor
      net remittance statements under NDA.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-runway
    missingEvidence: >-
      Current cash on hand, monthly net burn rate, debt service covenants with Mizuho Bank, and Series C liquidation
      preferences.
    whyItMatters: >-
      Determines the precise operational runway provided by the $150 million Series C first close and the
      timing/triggers for subsequent financing tranches.
    diligencePath: >-
      Review the Series C stock purchase agreement, investor rights agreement, bank credit facility terms, and trailing
      12-month cash flow statements.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      Reconciliation between platform estimates showing 101-250 employees versus 310 employees reported on certain
      secondary trackers.
    whyItMatters: Directly impacts estimated monthly payroll burn and operating expense overhead.
    diligencePath: >-
      Request an authorized employee census distinguishing full-time headquarters staff, engineers, and seasonal or
      contract farm laborers.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: robotics-throughput
    missingEvidence: >-
      Private facility metrics detailing the exact pick-rate per minute, damage rate, and human picker substitution
      ratio of Oishii's automated harvesting robots.
    whyItMatters: >-
      Validating whether robotic harvesting lowers unit labor costs enough to offset the substantial capital
      depreciation of custom automation hardware.
    diligencePath: >-
      Request facility inspection logs and robotic vs. manual harvest labor cost breakdowns from the Phillipsburg and
      Jersey City operations.
    relatedQuestionRefs:
      - QE002
      - QE006
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: minor
    topic: facility-energy-intensity
    missingEvidence: >-
      Audited kWh per kilogram consumption metrics across lighting, cooling, and HVACD dehumidification at the Amatelas
      Farm.
    whyItMatters: >-
      High power intensity represents the single largest variable operating expense and carbon footprint driver in
      indoor vertical strawberry production.
    diligencePath: >-
      Obtain utility billing records, renewable power purchase agreements, and facility energy audits during technical
      diligence.
    relatedQuestionRefs:
      - QE003
      - QE006
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      SKU- and channel-level repeat purchase, cohort retention, retailer sell-through, renewal, satisfaction, and return
      data.
    whyItMatters: >-
      Distribution expansion cannot establish durable demand or customer lifetime value without repeat and renewal
      evidence.
    diligencePath: >-
      Request monthly cohorts by first purchase, SKU, channel, and geography plus retailer sell-through and renewal
      records for the last 24 months.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue and gross-profit concentration by retailer, channel, geography, SKU, and top end-customer cohort.
    whyItMatters: >-
      A broad footprint can still depend economically on a small number of retail accounts or premium metropolitan
      markets.
    diligencePath: >-
      Obtain trailing-24-month net sales and gross profit by account and channel, top-ten concentration, contract terms,
      and renewal calendar.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete current roster of named retail and foodservice accounts with production status, dates, outcomes, and
      reference contacts.
    whyItMatters: >-
      The public sample mixes named retailers, unnamed restaurant cohorts, and one consumer review, limiting reference
      quality.
    diligencePath: >-
      Request the active-account roster and permission to conduct reference calls with two retailers, two foodservice
      buyers, and a representative consumer cohort.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: farm-level-economics
    missingEvidence: >-
      Facility-level energy consumption per kilogram of berries, electricity kWh costs at the Phillipsburg facility, and
      exact gross margins by SKU tier.
    whyItMatters: >-
      Without farm-level utility and COGS data, investors cannot verify whether price reductions to $4.99 generate
      positive unit contribution margins.
    diligencePath: >-
      Request confidential farm management accounts, energy audit reports, and SKU contribution margin schedules under
      NDA.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: robotics-performance
    missingEvidence: >-
      Commercial pick rate per hour, fruit damage percentage, and uptime metrics for the integrated Tortuga-Yaskawa
      robotic harvesting fleet.
    whyItMatters: >-
      Proving a 50% labor reduction requires empirical automated throughput verification under peak fruit yield
      conditions.
    diligencePath: Review engineering telemetry data from the Phillipsburg and Jersey City automated harvest trials.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited farm-level income statements disclosing facility electricity consumption, robotics depreciation, labor
      costs, and crop yield per square foot.
    whyItMatters: >-
      Without farm-level unit economics, it is impossible to determine whether Oishii can achieve positive operating
      margins at $4.99 retail price points.
    diligencePath: >-
      Request confidential facility-level management accounting and unit margin bridge schedules during direct sponsor
      diligence.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Certified Series C capitalization table and investor rights agreement detailing liquidation preference
      seniorities, anti-dilution clauses, and redemption rights.
    whyItMatters: >-
      High cumulative funding creates substantial liquidation preference overhang that could impair common equity
      returns in sub-$1B exit scenarios.
    diligencePath: >-
      Obtain fully executed Series C charter amendments and cap table disclosures from company counsel or lead investor
      SPARX Group.
    relatedQuestionRefs:
      - QV004
