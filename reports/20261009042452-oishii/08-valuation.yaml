callouts:
  - calloutType: recommendation
    title: 'Recommendation Rationale: Track Pending Unit Margin Transparency'
    body: While Oishii stands out as an exceptionally disciplined survivor in indoor agriculture with strong Japanese strategic backing, private secondary valuation marks between $584 million and $1.6 billion are difficult to underwrite without audited farm-level operating margins. Investors should maintain a track posture until commercial sell-through velocity at everyday price points is independently verified.
    claimRefs:
      - CV001
      - CV004
      - CV011
  - calloutType: risk
    title: Valuation Down-Round and Liquidation Preference Overhang
    body: With cumulative funding reaching $370 million and Forge Global indicating a 1.0x liquidation preference structure across preferred share series, common shareholders and new secondary entrants face substantial preference overhang in any down-round or distressed exit scenario if macro indoor farming headwinds intensify.
    claimRefs:
      - CV001
      - CV005
      - CV013
