company:
  name: Oishii
chapter:
  number: 8
  title: Valuation
  summary: Oishii represents one of indoor agriculture's most resilient operators, but its implied valuation overhang, high capital intensity, and unresolved unit economics at mass price points warrant a disciplined track stance.
sections:
  - id: investment-thesis-and-valuation-context
    title: Investment Thesis, Capital Inflows, and Financing Structure
    body: Oishii has carved out a unique brand and operational profile within indoor vertical agriculture, surviving widespread industry restructuring that claimed high-profile operators like Plenty and Bowery. Through its initial closing of a $150 million Series C financing round in May 2026 led by SPARX Asset Management alongside Nomura Real Estate Development, MISUMI Group, and Mizuho Bank, Oishii expanded its cumulative funding to $370 million. The company previously raised a Series B round that closed at $150 million in November 2024 (expanding from an initial $134 million tranche announced in February 2024), anchored by NTT and supported by climate fund Resilience Reserve, Miyako Capital, and Japanese industrial partners. Private company database Multiples.vc recorded an interim post-money valuation mark of $584 million associated with the Series B completion in December 2024, whereas Forge Global recorded an unconfirmed indicative Series C-8 model valuation mark of $1.6 billion as of August 2026 alongside a $550.75 million cumulative funding calculation reflecting authorized share capital authorizations. However, secondary liquidity remains severely constrained, with Forge Global characterizing secondary trading as limited and warning that private company shares are highly illiquid. Because Oishii does not disclose certified audited revenue, gross margin, or farm-level operating cash burn, assessing the company's capital durability requires balancing patient Japanese strategic backing against substantial facility and robotics overhead.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-anti-thesis-and-comparable-benchmarks
    title: 'Core Dilemma: Premium Brand Moat Versus Commodity Agriculture Headwinds'
    body: 'The core bull case for Oishii centers on technological differentiation, premium retail brand power, and expanding multi-category shelf space. Operating automated facilities including its 237,500-square-foot Phillipsburg farm and deploying bee-pollinated indoor microclimates, Oishii has expanded retail strawberry distribution across 18 US states, entered Toronto as its first international grocery market, and rolled out new formats from $4.99 entry tiers up to $50 gift packs. The company has also expanded into shelf-stable pantry items such as premium preserves and its $35 Daifuku-Inspired Strawberry Spread reviewed by The Kitchn, while developing developer-facing storefront endpoints identified by APIs.io. Conversely, the anti-thesis highlights the persistent structural vulnerabilities of indoor agriculture: extreme facility capital intensity, high electricity demand, delicate bee biological sensitivity, and unproven margin sustainability when transitioning from luxury boutique gifts to everyday supermarket volume. Comparable public produce and grocery benchmarks trade at conservative enterprise-value multiples between 0.5x and 2.5x revenue, creating severe valuation compression risk if Oishii is forced to re-rate from a high-multiple agricultural robotics narrative to a traditional specialty food supplier multiple.'
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
    tableRefs:
      - TV002
  - id: scenario-analysis-and-diligence-roadmap
    title: Bull, Base, and Bear Scenarios and Actionable Diligence Roadmap
    body: Diligence on Oishii reveals a wide distribution of prospective outcomes governed by yield realization, harvest robotics productivity, and commercial price durability. In a bull scenario, automated indoor harvesting and expansion of everyday berry SKUs allow Oishii to establish durable positive operating cash flow while justifying an enterprise valuation between $1.0 billion and $1.5 billion in an eventual public offering or strategic acquisition by a global food conglomerate. In the base case, Oishii maintains premium category leadership in urban grocery markets but experiences slower retail unit velocity and margin compression at everyday price points, supporting an estimated private market fair value around $500 million to $650 million. In a bear case, persistent high energy and robotics maintenance costs, coupled with consumer resistance to premium price tags during economic downturns, lead to significant cash burn, triggering a down-round financing or structured recapitalization under its 1.0x liquidation preference overhang. Given these divergent paths and the absence of verified facility-level cost accounting, investors should maintain a track stance until management provides audited farm gross margins, facility-level unit economics, and official Series C cap table terms.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV003
