companyProfile:
  summary: >-
    Oishii is a New Jersey-based indoor agriculture company founded in 2016 by Hiroki Koga and Brendan Somerville. It
    grows premium pesticide-free strawberries and snacking tomatoes in robot-assisted Smart Farms, sells through premium
    grocery and direct-retail channels, and has expanded from its flagship Omakase Berry into broader strawberry SKUs,
    preserves, and a Chelsea Market kiosk. The company has raised substantial capital and continues to rely on strategic
    Japanese and industrial backers while keeping farm-level economics largely private.
