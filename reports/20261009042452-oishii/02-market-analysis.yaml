callouts:
  - calloutType: insight
    title: Differentiation Through Crop Complexity and Pricing Power
    body: >-
      While first-generation indoor farms collapsed under the commoditization of leafy greens where price premiums could not
      offset massive electricity and facility depreciation costs, Oishii's decision to commercialize bee-pollinated strawberries
      enabled gross retail price realization between $4.99 and $15 per pack, maintaining gross margins that cushion high CEA operating expenditures.
    claimRefs:
      - CM001
      - CM007
      - CM014
  - calloutType: risk
    title: Capital Intensity and Farm Replication Bottlenecks
    body: >-
      Scaling vertical agriculture beyond local urban hubs historically required expensive custom engineering for each facility.
      Oishii's transition to standardized modular hardware via its Open Innovation Center in Japan is critical to lowering unit capital expenditure
      before high-volume commoditization pressures compress retail produce price points.
    claimRefs:
      - CM010
      - CM014
      - CM015
