      - - Premium Supermarket Retail
        - Grocery Category Manager / Produce Buyer
        - Household grocery consumer
        - Retail Merchandising / Consumer Grocery Budget
        - Direct-store delivery (DSD) / regional distribution to Whole Foods Market
        - Year-round consistent brix flavor, zero pesticides, foot-traffic pull
      - - High-End Foodservice & Dining
        - Executive Chef / Pastry Chef / F&B Director
        - Michelin-starred restaurant patrons
        - Restaurant Operating Budget / Food Cost
        - Specialized culinary wholesale ordering / direct delivery in NYC metropolitan area
        - Visual uniformity, pristine aroma, eliminating kitchen trimming waste
      - - Direct-to-Consumer & Brand Flagship
        - Luxury retail shopper / E-commerce customer
        - Gift recipient or self-treating consumer
        - Personal discretionary entertainment / gift budget
        - Chelsea Market retail kiosk & Shopify DTC platform (/agents.md, UCP API)
        - Social media novelty, luxury Japanese fruit experience, gifting appeal
      - - International Expansion (Japan / Canada)
        - Regional importer / luxury produce distributor
        - Urban Toronto & Tokyo metropolitan consumers
        - Commercial distribution partner / affluent consumer
        - Cross-border cold chain / Open Innovation Center commercial launch in Japan
        - Off-season availability of prized strawberry varieties in fruit-conscious markets
    notes: >-
      Channel workflows reflect established partnerships with Whole Foods Market, FreshDirect, Michelin-starred dining rooms,
      and international retail launches documented in company filings and trade coverage.
