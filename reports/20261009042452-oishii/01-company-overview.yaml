company:
  name: "Oishii"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2016 by Hiroki Koga and Brendan Somerville, Oishii operates indoor vertical Smart Farms cultivating Japanese strawberry cultivars and snacking tomatoes using proprietary bee pollination and robotics. Headquartered in Jersey City with commercial operations in Phillipsburg, New Jersey, the company has raised over $189 million—including an expanded $150 million Series B round—to commercialize clean-label premium produce while navigating high capital intensity."
sections:
  - id: "corporate-identity-and-leadership"
    title: "Corporate Identity, Foundation, and Executive Leadership"
    body: "Oishii was founded in 2016 by Hiroki Koga and Brendan Somerville, who initially met while pursuing MBA degrees at UC Berkeley. Koga, who previously worked as an agriculture technology consultant in Japan, serves as Chief Executive Officer, while Somerville co-founded an avocado enterprise in Uganda prior to establishing Oishii. The company established its corporate headquarters in Jersey City, New Jersey, initially developing a northern New Jersey research facility in 2017 before scaling commercial indoor strawberry cultivation. The executive leadership team maintains significant operational and agronomic dependence on Koga's domain expertise and technical relationships with Japanese agricultural specialists and industrial automation conglomerates. Governance reflects heavy strategic alignment with international corporate backers, including Japan telecommunications leader NTT and industrial robotics pioneer Yaskawa Electric Corporation, alongside climate-focused venture capital funds. The business operates on a premium specialty produce model, targeting high-end grocery retail, direct-to-consumer digital channels, and Michelin-starred culinary accounts rather than commoditized mass-market leafy greens."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization Structure, Financing History, and Strategic Investors"
    body: "Oishii has raised cumulative equity financing of at least $189 million since inception through its Series B financing round. In early 2024, the company announced an initial $134 million Series B round led by Japanese telecommunications conglomerate NTT, which was subsequently upsized and officially closed at $150 million in November 2024 following expanded demand from climate-focused investors. Late additions to the Series B syndicate included Resilience Reserve—a climate investment vehicle co-founded by TED head Chris Anderson and author Rob Reid—as well as Kyoto-based venture firm Miyako Capital. Earlier institutional backers participating across financing tranches include Bloom8, McWin Capital Partners, Mizuho Bank, Mitsubishi Shokuhin Co., Ltd., Yaskawa Electric Corporation, and the state-backed Japan Green Investment Corporation for Carbon Neutrality (JICN) established by the Japanese Ministry of the Environment. While third-party aggregate venture databases such as Raising.fi report funding exceeding $100 million across single-round snapshots, verified primary trade announcements substantiate the full $189 million cumulative threshold. Material gaps persist regarding post-money valuation metrics, share classes, liquidation preferences, and secondary transaction volume, which remain undisclosed private corporate data."
    claimRefs:
      - "CO006"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "operational-footprint-and-milestones"
    title: "Operational Footprint, Commercial Milestones, and Scale Trajectory"
    body: "The company's commercial expansion has progressed through distinct technological and geographic phases. In 2018, Oishii commercially launched its inaugural product, the chef-favorite Omakase Berry, establishing brand equity across elite Manhattan restaurants including Atomix and Eleven Madison Park. In 2022, Oishii commissioned Mugen Farm in Jersey City, a 74,000-square-foot indoor strawberry vertical farm, followed by the launch of its second flagship cultivar, the Koyo Berry, in 2023. Operational capacity expanded substantially in 2024 with the commissioning of Amatelas Farm in Phillipsburg, New Jersey, spanning more than 237,000 square feet as the company's primary production mega-facility. Commercial distribution has broadened from initial New York boutique grocers to Whole Foods Market locations across New York, New Jersey, Connecticut, D.C., and Chicago, alongside regional retail distribution in Harris Teeter, FreshDirect, and specialty merchants. Product line diversification includes the Rubī snacking tomato, introduced in December 2023, and specialty value-added retail items such as the Daifuku-Inspired Strawberry Spread retailing at $35 per jar, as well as an experiential physical retail kiosk located at Chelsea Market in New York City."
    claimRefs:
      - "CO005"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
