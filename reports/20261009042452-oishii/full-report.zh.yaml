  - id: FI001
    title: 室内草莓单位经济效益转换桥
    type: flow
    summary: 展示室内智能农场的采收产量如何转化为总收入和运营利润池的连续运营流程。
    data:
      nodes:
        - id: indoor-cultivation
          label: 受控智能农场种植：环境 HVAC、LED 照明与蜜蜂授粉
        - id: harvest-grading
          label: 作物采收与分级：前 1% Connoisseur、商业浆果与果酱副产品
        - id: packaging-logistics
          label: 包装与冷链：保鲜顶封托盘与运往 18 个州的冷链物流
        - id: channel-monetization
          label: 渠道变现：高端杂货批发（$4.99-$15）与特色直销（$35）
        - id: retail-sell-through
          label: 零售售罄：Whole Foods 货架销售速度与 Chelsea Market 客流
        - id: margin-retention
          label: 运营利润池：扣除电力、自动化、物流和人工成本后的净利润
      edges:
        - from: indoor-cultivation
          to: harvest-grading
        - from: harvest-grading
          to: packaging-logistics
        - from: packaging-logistics
          to: channel-monetization
        - from: channel-monetization
          to: retail-sell-through
        - from: retail-sell-through
          to: margin-retention
    approximationNotes: 基于已披露的运营资产，展示从室内种植投入到实现收入流的结构化价值链流程。
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI008
  - id: FE001
    title: Oishii 一体化垂直农业架构栈
    type: stack
    summary: 六层运营与技术栈展示从实体种植基础设施到数字商务界面的递进关系。
    data:
      layers:
        - label: 种植环境与基础设施层
          detail: 多层垂直种植架、光谱 LED 阵列，以及闭环水培和气培营养液循环，实现 95% 节水。
        - label: 自动化与机器人层
          detail: 适应环境的机器人采收臂采用 Tortuga AgTech 视觉技术和 MISUMI 精密部件。
        - label: 生物与微气候层
          detail: 室内蜜蜂授粉管理、正压洁净室空气过滤，以及持续的 HVACD 温湿度调节。
        - label: 传感器与边缘遥测层
          detail: IoT 传感器网络持续测量水分、营养液电导率、叶片颜色、温度和二氧化碳水平。
        - label: AI 与优化平台层
          detail: TensorFlow 和 Python 计算机视觉流水线处理冠层图像，用于产量预测和自动参数调优。
        - label: 数字界面与商务层
          detail: 基于 AWS 和 Redshift 的云数据基础设施，配备适用于代理的 Model Context Protocol（MCP）和 UCP 店面接口。
    approximationNotes: 代表综合已发布专利、设施报告、招聘要求和技术分析得出的功能架构。
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE012
      - CE014
      - CE015
      - CE016
  - id: FU001
    title: 证据约束下的客户采用与扩张循环
    type: journey-map
    summary: 将已观察到的发现和分销步骤，与尚未测量、但能证明持续性的复购步骤分开。
    data:
      items:
        - label: 高端产品发现
          detail: 消费者通过厨师、高端杂货店、评测和品牌故事接触差异化浆果。
          touchpoints:
            - 餐厅
            - Whole Foods Market 超市
            - 产品评测
        - label: 试用
          detail: 消费者通过新鲜浆果托盘、低价规格、果酱、电子杂货或 Chelsea Market 售货亭进入。
          touchpoints:
            - 零售货架
            - FreshDirect
            - Oishii 售货亭
        - label: 产品体验
          detail: 管理层称，驱动消费者价值的是口味和产品质量，而不是垂直农业技术本身。
          touchpoints:
            - 口味
            - 一致性
            - 全年供应
        - label: 复购
          detail: 公开来源未披露复购率、队列、满意度、流失率或零售商售罄率。
          touchpoints:
            - 未测量的消费者复购
            - 未测量的零售商续约
        - label: 渠道扩张
          detail: 零售关系将触达范围扩展至更多州、更多规格和更多价位。
          touchpoints:
            - 区域杂货店
            - 电子杂货
            - 自有零售
        - label: 地理复制
          detail: 公开版图从东北部集群扩展至芝加哥、18 个州和多伦多。
          touchpoints:
            - 美国
            - 多伦多
            - 区域产能约束
    approximationNotes: 基于已披露渠道的概念序列；不代表已测量的转化率或队列连续性。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU011
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性和严重性维度分布运营、资本、生物和商业风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 灾难性影响
          values:
            - 宏观 CEA 流动性崩溃
            - 全设施作物病原体暴发
            - 批发渠道全面下架
        - label: 关键严重度
          values:
            - HVACD 故障 / 停电
            - 风投下轮融资 / 资本耗尽
            - 单一供应商机器人部件断供
        - label: 高严重度
          values:
            - 跨境植物检疫扣留
            - 机器人采收失败 / 蜜蜂系统受扰
            - 零售货架动销速度承压
        - label: 中等严重度
          values:
            - 商标与非转基因审查
            - 包装顶封运输失效
            - 消费者抗拒 $4.99 的价格
        - label: 低严重度
          values:
            - 数字门店无头架构延迟
            - 包装供应轻微延误
            - 本地配送物流瓶颈
        - label: 可忽略暴露
          values:
            - 公开 Agent API 抓取开销
            - 自助亭零售商品偏移
            - 临时本地运输绕行
    approximationNotes: 可能性与严重度分类是基于已报道的 CEA 行业破产案例和室内草莓运营模型综合得出的分析判断。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR010
  - id: FV001
    title: 估值逻辑与建议流程
    type: flow
    summary: 决策树将市场验证和资本支持的证据，沿着运营风险一路串联至最终的跟踪建议。
    data:
      nodes:
        - id: market-proof
          label: 市场规模与品牌：融资 $370M，覆盖 18 个州，品牌资产较强
        - id: capital-backing
          label: 战略支持：SPARX、MISUMI、Nomura、Mizuho 提供支持
        - id: operational-risks
          label: 运营逆风：高能耗、生物风险、资本密集
        - id: valuation-overhang
          label: 估值摩擦：$584M-$1.6B 的估值标记，对比缺乏流动性的私人二级市场
        - id: diligence-roadblock
          label: 信息缺口：未经审计的农场单位经济模型与运营利润率
        - id: recommendation
          label: 最终立场：跟踪（等待经审计的利润率和 C 轮优先权条款）
    approximationNotes: 流程图将定性与定量尽调证据综合为一套逻辑化的投资决策顺序。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV011
      - CV014
