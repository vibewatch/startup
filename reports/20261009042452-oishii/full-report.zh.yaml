      - number: '4.2'
        title: 成本结构、自动化经济性与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              室内草莓种植的运营经济性，与传统露天农业和大宗绿叶菜立体农场截然不同。露天草莓种植承担高额季节性变动人工和恶劣天气损失风险；Oishii
              的受控环境农业模式则用更高的固定电费、设施折旧和技术运营开销换取摆脱天气波动。COGS 的核心驱动因素包括照明和 HVAC
              环境控制耗电、基质材料、保鲜顶封膜等专用包装，以及采收人工。为降低人工采收成本，Oishii 于 2025 年收购机器人开发商 Tortuga AgTech，并与工业自动化供应商 MISUMI Group
              合作，整合采收机器人和视觉算法。不过，农场层面毛利率、设施层面 EBITDA、每公斤可售水果的千瓦时效率及分销运输中的损耗率仍是严格未披露的私有指标，也是尽调的核心障碍。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
