      - number: '5.2'
        title: CEA 架构、机器人集成与闭环系统
        blocks:
          - type: paragraph
            body: >-
              Oishii 生产模式的核心技术架构是受控环境农业（CEA），部署在新泽西州 Phillipsburg 的旗舰 Amatelas Farm
              等堆叠式立体设施中。公司没有把通用机器人硬改进多变的温室环境，而是专门设计立体种植环境来适配机器人自动化：各层作物高度统一，照明、气流和植株几何形态都可预测。这种结构让自动采收系统能够依据颜色、硬度和位置识别成熟度，同时不碰伤娇嫩水果。2025
              年收购 Tortuga AgTech、并与制造自动化龙头 MISUMI Group 建立战略合作后，Oishii
              已将机器人和自动化直接整合进采收流程，以达到商业化产量。种植依靠闭环循环水培和气培系统，用富含营养的水雾化根部；相比传统露天农业，淡水消耗最多可降低 90% 至
              95%，并完全消除农业径流。针对光合作用吸收曲线设计的光谱 LED 阵列，与实时 IoT 传感器配合，测量湿度、蒸汽压亏缺、温度和二氧化碳水平。
