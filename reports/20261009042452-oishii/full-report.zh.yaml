              累计融资达到 $370 million，且 Forge Global 表示各优先股系列采用 1.0x
              清算优先权结构；如果室内农业的宏观逆风加剧，普通股股东和新二级市场进入者在任何降轮或困境退出情景中都将面临巨大的优先权悬压。
            calloutType: risk
