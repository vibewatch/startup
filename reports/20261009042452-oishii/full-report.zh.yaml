            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM014
      - number: '2.3'
        title: 买家画像、零售经济性与结构性采用约束
        blocks:
          - type: paragraph
            body: >-
              Oishii 的商业分销依赖两层买家：机构批发采购方和终端消费者。批发层面，主要零售买家包括 Whole Foods Market、FreshDirect 和区域高端连锁店；Atomix、Eleven
              Madison Park 等米其林星级餐饮机构也使用 Connoisseur Grade
              草莓提升甜点菜单。零售品类经理把高端农产品视为吸引客流和提升客单价的重要品类，只要供应稳定、利润空间灵活，就愿意测试品牌农产品。个人消费者的购买由口味稳定、清晰的非转基因认证和全年供应驱动。但采用障碍依然很大：立体农场需要巨额资本支出并承担高能耗，必须持续推进自动化——例如收购
              Tortuga AgTech、与 MISUMI Group 合作——才能避免 Bowery 等竞争者因单位经济性亏损而清算。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 依靠作物复杂度与定价权实现差异化
            body: 第一代室内农场在绿叶菜大宗化后纷纷倒闭，价格溢价无法抵消巨额电费和设施折旧；Oishii 选择商业化蜜蜂授粉草莓，使每包零售实现 $4.99 至 $15 的价格，并以毛利率缓冲 CEA 高昂的运营支出。
            calloutType: insight
            claimRefs:
              - CM001
              - CM007
              - CM014
          - type: callout
            title: 资本密集度与农场复制瓶颈
            body: >-
              历史上，立体农业要走出本地城市中心，必须为每座设施进行昂贵的定制工程。Oishii 通过日本 Open Innovation Center
              转向标准化模块硬件，这对在大规模大宗化压力压低农产品零售价之前降低单位资本支出至关重要。
            calloutType: risk
            claimRefs:
              - CM010
              - CM014
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：高端特色作物与大宗 CEA 运营商
        blocks:
          - type: paragraph
            body: >-
              受控环境农业（CEA）行业出现明显分化。Plenty、Bowery Farming 和 AppHarvest
              等第一代立体农场运营商筹集数十亿美元种植大宗绿叶菜，却因相对露天农业缺乏定价权，承受严重财务压力、高能源和运营成本，最终破产。相比之下，Oishii
              有意绕开绿叶菜，种植技术要求高、价值更高的草莓和特色结果作物。公司打造融合室内蜜蜂授粉、环境控制系统和采收机器人的 Smart Farm 平台，建立了独特的高端护城河。不过，公司仍与 Caplight 跟踪的
              Plenty、AeroFarms 和 Gotham Greens 等上市可比对象及幸存的区域 CEA 运营商并存，同时直接争夺消费者在传统浆果供应商处的杂货支出。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 不同种植模式的能力矩阵与技术差异化
        blocks:
          - type: paragraph
            body: >-
              将室内立体农场与商业高科技温室和传统露天种植比较，可以看到农艺精度、资本密集度和零售定价灵活性上的结构性取舍。Oishii 在新泽西使用封闭式机器人辅助室内立体农场，实现全年生产稳定且零农药。收购 Tortuga
              AgTech（2025 年）并于 2026 年与 MISUMI Group
              开展制造合作后，公司已将采收、授粉和质量控制等核心流程自动化，系统性降低单位人工开销。工业化露天种植拥有巨大规模和最低单位成本，却受季节性、农药依赖和气候脆弱性影响。商业水培温室的资本成本介于两者之间，但难以达到
              Oishii 奢侈品牌定位所要求的高糖度 Brix 和无瑕外观。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
