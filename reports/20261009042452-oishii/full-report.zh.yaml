            body: >-
              与绿叶菜运营商不同，在室内种植草莓等开花结果作物会带来严重的生物和微气候失效模式。草莓生产需要活体室内蜜蜂授粉、精确管理 HVACD
              蒸汽压亏缺，并在不使用合成化学农药的情况下严格防虫。若虫害失控、真菌病原体感染或环境控制失灵，Amatelas Farm 等高密度设施可能整批损失。为降低采收人工成本，Oishii 于 2025 年 3 月收购
              Tortuga AgTech 的知识产权和工程资产，将机器视觉算法接入其 50 台 Yaskawa 机械臂。但娇嫩软果的自动采收仍技术难度很高；若无法实现目标中的 50%
              采收成本下降，电费和自动化维护开销将继续压缩运营利润率。
            claimRefs:
