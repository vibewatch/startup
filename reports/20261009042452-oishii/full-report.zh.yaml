      - number: '5.3'
        title: 软件基础设施、开发者接口与运营风险
        blocks:
          - type: paragraph
            body: >-
              在农业运营背后，Oishii 使用基于云原生基础设施、数据管道和面向开发者的商业协议构建的工程与数据平台。公司的软件和系统工程栈采用 Amazon Web Services（AWS）、AWS
              Redshift、PostgreSQL 和 Microsoft SQL Server 存储数据并接收遥测信息，容器化微服务则由 Docker 和 Kubernetes 管理。数据科学与机器学习流程使用
              Python 和 TensorFlow，支持植物健康诊断、产量预测和环境自动调节的计算机视觉模型。在数字商务端，Oishii 运营面向代理的直营商店，提供在线 Model Context
              Protocol（MCP）服务器、Universal Commerce Protocol（UCP）端点和结构化 llms.txt
              发现资源。尽管具备这些技术优势，运营模式仍面临技术和生物风险：草莓种植需要在室内微气候中进行复杂的天然蜜蜂授粉；维持密封正压生物安全需要可观的电力；自动采摘机器人必须在密集冠层中保持高吞吐，才能证明高额前期资本支出合理。
