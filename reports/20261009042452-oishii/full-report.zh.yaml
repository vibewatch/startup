  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 品种架构、产品组合与价值主张
        blocks:
          - type: paragraph
            body: >-
              Oishii 的商业产品围绕在密封立体农场环境中种植的高端特色水果展开。核心产品组合包括三种不同草莓品种和一种特色鲜食番茄，并辅以品牌零售延伸。旗舰 Omakase Berry 是日本手工培育品种，特点是高
              Brix 甜度和浓郁香气，最初在纽约市米其林星级餐厅推出，随后进入高端零售。Koyo Berry 口味甜且平衡，定位日常高端消费；Nikko Berry 则通过创新保鲜顶封包装（比传统透明盒少用 80%
              塑料）切入更广泛的家庭消费者。除草莓外，Oishii 还在立体农场种植宝石般的 Rubī Tomato，果皮细嫩、甜度集中，并将品牌资产延伸至 Daifuku-Inspired Strawberry Spread
              和 Strawberry Shishito Jelly 等食品储藏产品。公司将熟度峰值采收与无农药、Non-GMO Project Verified
              认证声明结合，目标是在保持全年供应稳定的同时，让消费者愿意为其支付高于露天有机农产品的溢价。
