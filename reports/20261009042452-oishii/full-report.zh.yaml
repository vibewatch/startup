      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 技术护城河与作物选择支撑 CEA 存活
            body: >-
              绿叶菜立体农场的历史性崩溃表明，CEA 无法靠高能耗的大宗作物成功。Oishii 聚焦结果型草莓，并以室内蜜蜂授粉和 Tortuga AgTech
              采收机器人为支撑，由此形成可防御的定价权，使单位经济性免受大宗商品价格下跌冲击。
            calloutType: insight
