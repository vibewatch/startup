      - number: '3.3'
        title: 定价架构、包装创新与替代品防御力
        blocks:
          - type: paragraph
            body: >-
              Oishii 最初采用超高端奢侈礼赠策略，2018 年推出的 Omakase Berry 每盘接近 $50。随着产能扩展到 18 个美国州和多伦多，公司将产品目录扩充至 Koyo Berry、Nikko
              Berry 和 Rubī Tomato，并推出 $4.99 至 $15 的日常杂货零售包装。为保持水果品质并延长货架期，公司引入保鲜顶封包装，相比传统透明盒减少 80% 的塑料用量。护城河的持久性依赖品牌资产、与
              Whole Foods Market 等客户的零售关系，以及室内蜜蜂授粉和采收机器人形成的专有技术壁垒。不过，公司仍面临传统有机 Driscoll's
              草莓替代、杂货消费者对价格的抵触和高昂设施电费带来的持续风险。
            claimRefs:
