      - number: '4.3'
        title: 资本密集度、历次融资与未来资本充足性
        blocks:
          - type: paragraph
            body: >-
              室内立体农业需要巨额前期和持续资本支出，用于设计、启用和维护多层自动化洁净室。Oishii 自成立以来累计筹得 $370 million 股权和债务资本，最终在 2026 年 5 月宣布完成 $150
              million C 轮融资的首次交割。该轮由 SPARX Asset Management 领投，Nomura Real Estate Development、MISUMI Group 和 Mizuho Bank
              参与；在行业风险投资收缩、Bowery 和 Plenty 等早期同行退出后，这笔融资提供了关键流动性。员工数据表明，Phillipsburg 和泽西市设施维持稳定运营基础：FundedIQ 记录员工数为
              101–250 人，招聘跟踪器显示 6 至 12 个月内基本持平。资金将用于扩大 Amatelas Farm 产能、推动 Tokyo Open Innovation Center
              的研发商业化以及扩展包装自动化。但由于东京仍有技术诉讼待决、设施扩建支出持续，公司要在现有储备需要再融资前实现经营现金流盈亏平衡，仍依赖消费者持续购买高价产品。
            claimRefs:
              - CI009
              - CI010
              - CI011
