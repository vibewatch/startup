companyProfile:
  summary: >-
    Oishii 是一家总部位于新泽西州的室内农业公司，由 Hiroki Koga 和 Brendan Somerville 于 2016 年创立。公司在机器人辅助的 Smart Farms
    中种植高端、无农药草莓和鲜食番茄，通过高端杂货零售及直营渠道销售，并已从旗舰产品 Omakase Berry 扩展至更多草莓 SKU、果酱和 Chelsea Market
    售货亭。公司已筹得大量资金，仍依靠日本战略投资者和工业领域支持者，同时基本不公开农场层面的经济数据。
