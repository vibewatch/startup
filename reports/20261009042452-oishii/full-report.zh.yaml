      - number: '8.2'
        title: 核心矛盾：高端品牌护城河与大宗农业逆风
        blocks:
          - type: paragraph
            body: >-
              Oishii 的乐观情景聚焦于技术差异化、高端零售品牌力和多品类货架空间扩张。公司运营包括 237,500 平方英尺 Phillipsburg 农场在内的自动化设施，部署蜜蜂授粉的室内微气候，将零售草莓分销扩展至
              18 个美国州，进入首个国际杂货市场多伦多，并推出从 $4.99 入门价到 $50 礼盒的新形式。公司还扩展到高端果酱和 The Kitchn 评测过的 $35 Daifuku-Inspired
              Strawberry Spread 等常温食品，同时开发 APIs.io
              识别的面向开发者的商店端点。反方论点则强调室内农业持续存在的结构性脆弱点：设施资本密集度极高、耗电量大、蜜蜂生物敏感性高，以及从奢侈精品礼赠转向日常超市销量后，利润率能否持续仍未证明。可比上市农产品和杂货公司的企业价值/收入倍数仅为
              0.5x 至 2.5x；若 Oishii 被迫从高倍数农业机器人叙事重估为传统特色食品供应商，估值压缩风险将十分严重。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: 乐观、基准与悲观情景及可执行尽调路线图
        blocks:
          - type: paragraph
            body: >-
              对 Oishii 的尽调显示，潜在结果分布很宽，取决于产量兑现、采收机器人生产率和商业价格的持久性。乐观情景下，室内自动采收和日常浆果 SKU 扩张让 Oishii
              建立持续为正的经营现金流，并支撑其在未来公开发行或被全球食品集团战略收购时达到 $1.0 billion 至 $1.5 billion
              的企业估值。基准情景下，公司维持城市杂货市场的高端品类领先地位，但日常价位的零售动销更慢、利润率承压，估计约为 $500 million 至 $650 million
              的私募市场公允价值。悲观情景下，持续高昂的能源和机器人维护成本，加上经济低迷时消费者抵触高价，导致现金大量消耗，并在 1.0x
              清算优先权悬压下触发降价轮融资或结构化资本重组。鉴于路径分化明显且缺少经核实的设施层面成本核算，投资者应继续跟踪，直到管理层提供经审计的农场毛利率、设施层面单位经济性和正式的 C 轮股权结构表及其条款。
            claimRefs:
