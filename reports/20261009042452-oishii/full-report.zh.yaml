        - $1.0B - $1.5B（规模化后的隐含收入为 7x-10x，可行的 IPO 路径）
        - 农业大宗商品宏观崩盘，严重作物病原体暴发
      - - 基准情景
        - 50%
        - 高端小众市场持续，零售适度扩张，估值标记稳定在 $500M-$650M
        - $500M - $650M（与 2024 年 12 月 B 轮 $584M 的估值标记一致）
        - 零售利润率受挤压，消费者降级购买普通有机浆果
      - - 悲观情景
        - 25%
        - 烧钱仍居高不下，消费者在零售端抵触，机器人 ROI 落后于预期
        - $200M - $350M（折价轮资本重组或困境出售）
        - 流动性耗尽，无法获得后续债务或股权分批融资
    notes: 概率和估值区间是基于私人融资估值标记及同行倍数基准的情景预测。
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Oishii 从学术背景创立、早期研发到商业化超级农场部署和资本扩张的时间演进。
    data:
      items:
        - label: 公司创立
          date: '2016'
          detail: Hiroki Koga 和 Brendan Somerville 在 UC Berkeley 相识后创立 Oishii。
        - label: 研发设施建设
          date: '2017'
          detail: 在新泽西州北部建设首个室内草莓种植学研究与测试设施。
        - label: Omakase Berry 上市
          date: '2018'
          detail: 旗舰 Omakase Berry 商业首发，进入包括 Eleven Madison Park 在内的曼哈顿高端餐厅。
        - label: Mugen Farm 投运
          date: '2022'
          detail: 在新泽西州泽西市启用 Mugen Farm，占地 74,000 平方英尺，当时是全球最大的室内垂直草莓农场。
        - label: Koyo Berry 推出
          date: 2023-02
          detail: Koyo Berry 商业上市，在区域杂货店推出酸度均衡的消费品种。
        - label: 中大西洋地区杂货扩张
          date: 2023-06
          detail: 将 Koyo Berry 的分销拓展至华盛顿特区、马里兰州、马萨诸塞州和康涅狄格州。
        - label: Rubī Tomato 推出
          date: 2023-12
          detail: Rubī Tomato 商业亮相，将室内垂直生产从草莓拓展至即食番茄。
        - label: B 轮首次公告
          date: 2024-02
          detail: 宣布由 NTT 领投的首轮 $134 million B 轮融资，用于加快太阳能设施和机器人自动化建设。
        - label: Amatelas 超级农场启用
          date: 2024-05
          detail: 在新泽西州 Phillipsburg 投运 Amatelas Farm，占地超过 237,000 平方英尺，配备先进自动化设施。
        - label: 扩大后的 B 轮交割
          date: 2024-11
          detail: B 轮融资以 $150 million 完成交割，新增 Resilience Reserve 和 Miyako Capital，使总资本达到 $189 million。
        - label: 中西部地区分销扩张
          date: 2024-11
          detail: 通过 Whole Foods Market 和芝加哥高端餐饮场所，在 Chicagoland 地区推出零售草莓分销。
        - label: Chelsea Market 售货亭与 Connoisseur 产品线
          date: 2026-05
          detail: 在纽约市 Chelsea Market 开设旗舰零售 kiosk，同时推出高端果酱和 Connoisseur Grade 浆果。
    approximationNotes: 日期反映企业公开发布的新闻稿、设施剪彩仪式和融资交易交割时间。
    claimRefs:
