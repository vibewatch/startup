              million。日本企业的耐心资本和 Mizuho Bank 的债务融资使 Oishii 有别于失败同行，但室内立体农业仍需持续资本支出，以扩建 Phillipsburg 和泽西市的设施。Tracxn 记录
              Oishii 截至 2026 年 8 月员工数增至 310 人，形成必须依靠持续高毛利售罄来覆盖的结构性薪资开销。如果消费者需求走弱或零售价格压缩加速，高设施运营成本和资本折旧可能危及盈利路径目标。
