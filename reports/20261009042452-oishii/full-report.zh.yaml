      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 超越大宗绿叶菜的技术差异化
            body: >-
              Bowery、Infarm 等破产的立体农业先行者把资本集中在利润微薄的大宗绿叶菜上，Oishii 则将农艺重点放在高价值开花和结果作物上。公司掌握室内蜜蜂授粉，并与 Yaskawa Electric
              共同开发定制采收机器人，因此每盘可维持 $10 至 $15 的零售价格，获得了足以消化室内能源和资本折旧的定价权。
            calloutType: insight
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO011
          - type: callout
            title: 资本密集度与设施规模负担
            body: >-
              Oishii 在 Mugen Farm 和 Amatelas Farm 合计运营超过 311,000 平方英尺的室内农业空间，因此承受较高的基础电价、设施摊销和设备维护成本。$189 million
              的股权融资帮助公司渡过行业宏观整合期，但长期商业偿付能力取决于能否把单位成本降至与露天有机浆果种植相当。
            calloutType: risk
            claimRefs:
