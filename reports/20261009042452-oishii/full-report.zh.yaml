chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立历程与管理层
        blocks:
          - type: paragraph
            body: >-
              Oishii 由 Hiroki Koga 和 Brendan Somerville 于 2016 年创立，两人最初在 UC Berkeley 攻读 MBA 时相识。Koga 此前曾在日本担任农业科技顾问，现任
              CEO；Somerville 则在创办 Oishii 前曾在乌干达共同创办牛油果企业。公司总部设于新泽西州泽西市，2017 年先在北新泽西建设研究设施，随后扩大商业化室内草莓种植。管理层的运营和农艺工作高度依赖
              Koga 的专业经验，以及他与日本农业专家和工业自动化集团建立的技术关系。公司治理与国际企业支持者保持紧密战略协同，包括日本电信龙头 NTT、工业机器人先驱 Yaskawa Electric
              Corporation，以及专注气候领域的风险投资基金。公司采取高端特色农产品模式，目标是高端杂货零售、直面消费者的数字渠道和米其林星级餐饮客户，而非大宗化的规模化绿叶菜市场。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
