      - number: '1.2'
        title: 资本结构、融资历程与战略投资者
        blocks:
          - type: paragraph
            body: >-
              Oishii 自成立至 B 轮融资累计筹得至少 $189 million 的股权融资。2024 年初，公司宣布由日本电信集团 NTT 领投的首笔 $134 million B
              轮融资；在气候投资者需求增加后，该轮扩大规模，并于 2024 年 11 月以 $150 million 正式交割。后期加入 B 轮银团的投资者包括由 TED 负责人 Chris Anderson 与作家 Rob
              Reid 共同创立的气候投资工具 Resilience Reserve，以及总部位于京都的风险投资公司 Miyako Capital。此前参与各融资批次的机构支持者包括 Bloom8、McWin Capital
              Partners、Mizuho Bank、Mitsubishi Shokuhin Co., Ltd.、Yaskawa Electric Corporation，以及由日本环境省设立、政府支持的 Japan
              Green Investment Corporation for Carbon Neutrality（JICN）。Raising.fi 等第三方融资数据库按单轮快照汇总的融资额虽超过 $100
              million，但经核实的一手行业公告支持累计融资达到 $189 million。投后估值、股份类别、清算优先权和二级交易规模等关键数据仍存在重大缺口，均属于未披露的公司私有数据。
            claimRefs:
