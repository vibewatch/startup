            body: >-
              Oishii 凭借强大的日本战略支持，成为室内农业中纪律性极强的幸存者；但在没有经审计的农场运营利润率前，$584 million 至 $1.6 billion
              的私募二级估值很难纳入投资判断。投资者应继续跟踪，直到日常价位的商业售罄速度得到独立核实。
