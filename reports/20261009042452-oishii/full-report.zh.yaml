  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、SKU 变现与直营和批发经济性
        blocks:
          - type: paragraph
            body: >-
              Oishii 通过高端杂货批发、特色高端直营零售和品牌常温食品，变现高密度室内立体种植。商业组合最初由旗舰 Omakase Berry 支撑，2018 年每盘接近 $50；如今已扩展至 Koyo
              Berry、Nikko Berry 和 Rubī Tomato，各种包装售价 $4.99 至 $15.00。覆盖 18 个州的杂货批发，以及纽约、新泽西、康涅狄格州和华盛顿特区的 Whole Foods
              Market 门店，是主要的销量渠道；区域特色门店和多伦多国际零售市场则进一步扩大覆盖。为获取直营利润和高端品牌礼赠需求，Oishii 在纽约市 Chelsea Market 售货亭等体验式直营渠道销售
              Connoisseur Grade 单莓托盘和 $35 的 Daifuku-Inspired Strawberry Spread
              等特色果酱。不过，批发分销需要让渡零售商利润并支付经销商上架费，各商业零售协议中的每磅采收产品实际净售价仍未披露。
