      - number: '1.3'
        title: 运营版图、商业里程碑与规模化路径
        blocks:
          - type: paragraph
            body: >-
              公司商业扩张经历了清晰的技术和地域阶段。2018 年，Oishii 商业化推出首款产品、深受厨师欢迎的 Omakase Berry，并在 Atomix、Eleven Madison Park
              等曼哈顿顶级餐厅建立品牌资产。2022 年，公司在泽西市启用 Mugen Farm，这是一座占地 74,000 平方英尺的室内草莓立体农场；2023 年又推出第二款旗舰品种 Koyo Berry。2024
              年，公司在新泽西州 Phillipsburg 启用 Amatelas Farm，运营产能大幅提升；该设施占地超过 237,000
              平方英尺，是公司的主力大型生产基地。商业分销已从最初的纽约精品杂货店，扩展到纽约州、新泽西州、康涅狄格州、华盛顿特区和芝加哥的 Whole Foods Market 门店，同时进入 Harris
              Teeter、FreshDirect 和特色零售商等区域渠道。产品线还包括 2023 年 12 月推出的 Rubī 鲜食番茄，以及每罐 $35 的 Daifuku-Inspired Strawberry
              Spread 等特色增值零售产品；公司还在纽约市 Chelsea Market 运营体验式实体售货亭。
