        title: 展示
        blocks:
          - type: callout
            title: 论点失效触发因素：单位经济性与自动化执行
            body: >-
              核心投资论点是：Oishii 需要证明高端浆果品种带来的高毛利能够抵御价格层级压缩，同时 Tortuga 机器人可将采收人工成本降低 50%。若自动采收吞吐量无法替代人工采摘的经济性、病原体污染迫使
              Amatelas Farm 清空作物，或 $4.99–$15 价位在非大都市分销渠道动销停滞，就会出现明确的论点失效事件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、资本流入与融资结构
        blocks:
          - type: paragraph
            body: >-
              Oishii 在室内立体农业中打造了独特的品牌和运营画像，挺过了席卷 Plenty、Bowery 等知名运营商的行业重组。2026 年 5 月，公司完成由 SPARX Asset Management
              领投、Nomura Real Estate Development、MISUMI Group 和 Mizuho Bank 参与的 $150 million C 轮融资首次交割，累计融资增至 $370
              million。此前，公司 B 轮融资于 2024 年 11 月以 $150 million 交割（从 2024 年 2 月宣布的首笔 $134 million 扩大而来），由 NTT 牵头，并获得气候基金
              Resilience Reserve、Miyako Capital 和日本工业合作伙伴支持。私营公司数据库 Multiples.vc 记录了与 2024 年 12 月 B 轮完成相关的 $584 million
              中间投后估值；Forge Global 则记录截至 2026 年 8 月未经确认的指示性 C-8 模型估值 $1.6 billion，并计算累计融资 $550.75
              million，该数字反映了授权股本授权。尽管如此，二级流动性仍极度有限，Forge Global 称二级交易受限，并警告私营公司股份高度缺乏流动性。由于 Oishii
              没有披露经认证审计的收入、毛利率或农场层面运营现金消耗，评估公司资本耐久性时，需要在日本战略投资者的耐心支持与高额设施、机器人开销之间权衡。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
