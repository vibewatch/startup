  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与替代关系
        blocks:
          - type: paragraph
            body: >-
              Oishii 所处市场交汇于高价值生鲜、受控环境农业（CEA）和奢华特色食品。第一批立体农业公司几乎只种植生菜、芝麻菜等大宗绿叶菜，而 Oishii
              则以鲜草莓为商业基础；这类作物需要复杂的蜜蜂授粉和精细采收，露天种植还面临明显的季节性品质波动。消费者对国产露天草莓的反季节口感、成熟度不一和农药残留普遍不满。Oishii 提供全年供应、无农药且经
              Non-GMO Project Verified 认证的日本品种，包括 Omakase、Koyo 和 Nikko 草莓，由此切入一个不包含低价大宗农产品、但直接与有机露天浆果、Cotton Candy 葡萄或
              Sumo 橙子等季节性特色水果，以及进口反季水果竞争的可服务细分市场。公司还把品牌边界扩展到 $35 的 Daifuku-Inspired Strawberry Spread
              和高端果酱等非易腐特色产品，争夺奢华礼赠和特色食品储藏预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
      - number: '2.2'
        title: 市场规模视角、价格弹性与受限需求
        blocks:
          - type: paragraph
            body: >-
              评估 Oishii 的可服务机会，需要把普通浆果总支出与价格不敏感的高端食品支出区分开。传统超市浆果每盒塑料透明盒约 $5，而 Oishii 2018 年推出旗舰 Omakase Berry 时每盘接近
              $50，之后才逐步为 Koyo 和 Nikko 包装引入 $4.99 至 $15 的日常价位。总农产品市场自上而下的估算（美国生鲜水果超过
              $60B）掩盖了高端价格倍数下销量的大幅下降，因此更适合从三个受限视角理解市场规模：更广泛的美国鲜草莓和浆果品类、高端/有机及品牌农产品层，以及超高端礼赠和美食市场。消费者愿意为稳定的 Brix
              甜度和干净标签农产品支付溢价，支持公司覆盖 18 个美国州及多伦多；但城市核心区之外的扩张受价格弹性限制，可服务可获取市场取决于农场距离和零售商展示高端品牌水果的意愿。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
