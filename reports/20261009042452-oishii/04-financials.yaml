  title: "Financials"
  summary: "Oishii pairs high gross selling prices ($4.99–$15 per berry tray and $35 specialty preserves) with acute capital intensity, having secured a $150 million Series C in May 2026 to fund robotics automation, facility buildouts, and international expansion while facing ongoing sector-wide margin and liquidity pressures."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Model, SKU Monetization, and Direct vs Wholesale Economics"
    body: "Oishii monetizes high-density vertical indoor farming through a mix of premium grocery wholesale, specialty high-end direct retail, and branded shelf-stable food products. Historically anchored by its flagship Omakase Berry which debuted at nearly $50 per tray in 2018, the commercial portfolio has broadened to include the Koyo Berry, Nikko Berry, and Rubī Tomato across pack sizes priced between $4.99 and $15.00. Wholesale grocery distribution across 18 states and Whole Foods Market locations in New York, New Jersey, Connecticut, and D.C. accounts for the primary volume channel, while regional specialty stores and the Toronto international retail market extend grocery reach. To capture direct-to-consumer margin and high-end brand gifting demand, Oishii operates dedicated experiential direct retail formats such as its Chelsea Market kiosk in New York City, selling Connoisseur Grade single-berry trays and $35 specialty spreads like the Daifuku-Inspired Strawberry Spread. However, wholesale distribution requires retailer margins and distributor slotting allowances, while realized net price realization per harvested pound remains undisclosed across commercial retail agreements."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "cost-structure-and-unit-economics-drivers"
    title: "Cost Structure, Automation Economics, and Margin Drivers"
    body: "The operating economics of indoor strawberry farming diverge sharply from conventional open-field agriculture and commodity leafy green vertical farms. While open-field strawberry production incurs high variable seasonal labor and severe weather loss risks, Oishii's controlled environment agriculture model trades field weather variance for elevated fixed electricity, facility depreciation, and technical operating overhead. Core cost of goods sold (COGS) drivers encompass lighting and HVAC environmental control power consumption, substrate materials, specialized packaging such as stay-fresh top-seal films, and harvesting labor. To alleviate high hand-harvest labor costs, Oishii acquired robotics developer Tortuga AgTech in 2025 and partnered with industrial automation supplier MISUMI Group to integrate robotic harvesters and vision algorithms. Nevertheless, farm-level gross margins, facility-level EBITDA, kilowatt-hour efficiency per kilogram of marketable fruit, and spoilage rates across distribution transit remain strictly undisclosed private metrics that represent central diligence hurdles."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Intensity, Lifetime Financing, and Forward Capital Adequacy"
    body: "Indoor vertical farming requires massive upfront and recurring capital expenditures to design, commission, and maintain multi-tier automated cleanrooms. Oishii has raised $370 million in cumulative equity and debt capital since founding, culminating in the first closing of a $150 million Series C financing announced in May 2026. The round was led by SPARX Asset Management alongside participation from Nomura Real Estate Development, MISUMI Group, and Mizuho Bank, providing essential liquidity following the sector-wide venture contraction that eliminated earlier peers like Bowery and Plenty. Headcount metrics indicate a stable operating baseline across Phillipsburg and Jersey City facilities, reported in the 101–250 employee band on FundedIQ and flat over 6- to 12-month periods on recruitment trackers. Proceed allocations are targeted toward scaling Amatelas Farm capacity, commercializing Tokyo Open Innovation Center R&D, and expanding packaging automation. However, with pending technology litigation in Tokyo and ongoing facility expansion outlays, Oishii remains dependent on sustained high-price consumer adoption to achieve operating cash flow breakeven before existing reserves require refinancing."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
