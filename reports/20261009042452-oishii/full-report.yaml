  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of Oishii from academic founding and early R&D to commercial mega-farm deployment and
      capital expansion.
    data:
      items:
        - label: Company Foundation
          date: '2016'
          detail: Hiroki Koga and Brendan Somerville establish Oishii after meeting at UC Berkeley.
        - label: R&D Facility Buildout
          date: '2017'
          detail: Construction of initial northern New Jersey research and testing facility for indoor strawberry agronomy.
        - label: Omakase Berry Launch
          date: '2018'
          detail: >-
            Commercial debut of the flagship Omakase Berry, entering high-end Manhattan restaurants including Eleven
            Madison Park.
        - label: Mugen Farm Commissioning
          date: '2022'
          detail: >-
            Opening of Mugen Farm in Jersey City, NJ, spanning 74,000 square feet as the world's largest indoor vertical
            strawberry farm at the time.
        - label: Koyo Berry Rollout
          date: 2023-02
          detail: >-
            Commercial launch of the Koyo Berry, introducing a balanced-acidity consumer cultivar across regional
            grocers.
        - label: Mid-Atlantic Grocery Expansion
          date: 2023-06
          detail: Distribution expansion of Koyo Berry into Washington D.C., Maryland, Massachusetts, and Connecticut.
        - label: Rubī Tomato Introduction
          date: 2023-12
          detail: >-
            Commercial unveiling of the Rubī Tomato, expanding indoor vertical production beyond strawberries into
            snacking tomatoes.
        - label: Series B Initial Announcement
          date: 2024-02
          detail: >-
            Announced initial $134 million Series B round led by NTT to accelerate solar facilities and robotics
            automation.
        - label: Amatelas Mega-Farm Opening
          date: 2024-05
          detail: Commissioning of Amatelas Farm in Phillipsburg, NJ, exceeding 237,000 square feet with advanced automation.
        - label: Expanded Series B Closing
          date: 2024-11
          detail: >-
            Series B round closes at $150 million with addition of Resilience Reserve and Miyako Capital, bringing total
            capital to $189 million.
        - label: Midwest Distribution Expansion
          date: 2024-11
          detail: >-
            Launch of retail strawberry distribution in the Chicagoland area via Whole Foods Market and Chicago
            fine-dining venues.
        - label: Chelsea Market Kiosk & Connoisseur Line
          date: 2026-05
