      - number: '4.2'
        title: Cost Structure, Automation Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The operating economics of indoor strawberry farming diverge sharply from conventional open-field
              agriculture and commodity leafy green vertical farms. While open-field strawberry production incurs high
              variable seasonal labor and severe weather loss risks, Oishii's controlled environment agriculture model
              trades field weather variance for elevated fixed electricity, facility depreciation, and technical
              operating overhead. Core cost of goods sold (COGS) drivers encompass lighting and HVAC environmental
              control power consumption, substrate materials, specialized packaging such as stay-fresh top-seal films,
              and harvesting labor. To alleviate high hand-harvest labor costs, Oishii acquired robotics developer
              Tortuga AgTech in 2025 and partnered with industrial automation supplier MISUMI Group to integrate robotic
              harvesters and vision algorithms. Nevertheless, farm-level gross margins, facility-level EBITDA,
              kilowatt-hour efficiency per kilogram of marketable fruit, and spoilage rates across distribution transit
              remain strictly undisclosed private metrics that represent central diligence hurdles.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
