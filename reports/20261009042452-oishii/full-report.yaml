      - number: '2.3'
        title: Buyer Personas, Retail Economics, and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Oishii's commercial distribution relies on a two-tier buyer model comprising institutional wholesale
              purchasers and end consumers. At the wholesale level, primary retail buyers include premium grocers like
              Whole Foods Market, FreshDirect, and regional high-end chains, alongside Michelin-starred culinary
              institutions such as Atomix and Eleven Madison Park that utilize Connoisseur Grade berries to elevate
              dessert menus. Retail category managers treat high-end produce as a critical foot-traffic driver and
              basket-builder, displaying high willingness to test branded produce concepts provided supply consistency
              and margin flexibility are maintained. For individual retail shoppers, the purchasing decision is driven
              by flavor consistency, clean non-GMO verification, and year-round availability. However, substantial
              adoption barriers persist: vertical farms face daunting capital expenditures and energy loads, requiring
              continuous automation advances—such as Oishii's acquisition of Tortuga AgTech and partnership with MISUMI
              Group—to prevent the crippling unit economic losses that drove competitors like Bowery into liquidation.
            claimRefs:
              - CM011
              - CM012
