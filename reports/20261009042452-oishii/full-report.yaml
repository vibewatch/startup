  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Substitute Dynamics
        blocks:
          - type: paragraph
            body: >-
              The market for Oishii sits at the intersection of high-value fresh produce, controlled-environment
              agriculture (CEA), and luxury specialty foods. Unlike the first wave of vertical farming entrants that
              concentrated almost exclusively on commodity leafy greens such as lettuce and arugula, Oishii deliberately
              established its commercial foundation in fresh strawberries—a crop characterized by complex bee
              pollination, delicate harvesting requirements, and pronounced seasonal quality fluctuations in field-grown
              counterparts. Field-grown domestic strawberries face extensive consumer dissatisfaction regarding
              off-season taste, irregular ripeness, and high pesticide residues. By offering year-round availability of
              pesticide-free, Non-GMO Project Verified Japanese cultivars including the Omakase, Koyo, and Nikko
              berries, Oishii defines an addressable segment that excludes commodity low-cost bulk produce and directly
              competes with organic field berries, seasonal specialty fruits like Cotton Candy grapes or Sumo oranges,
              and imported off-season fruit. Furthermore, the company has extended its brand boundary into
              non-perishable specialty items such as its $35 Daifuku-Inspired Strawberry Spread and premium preserves,
              capturing luxury gifting and specialty pantry budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
      - number: '2.2'
        title: Sizing Lenses, Price Elasticity, and Constrained Demand
        blocks:
          - type: paragraph
            body: >-
              Evaluating Oishii's addressable opportunity requires segmenting generic aggregate berry spend from
              price-insensitive premium food expenditures. Conventional supermarket berries trade around $5 per plastic
              clamshell, whereas Oishii initially debuted its flagship Omakase Berry at nearly $50 per tray in 2018
              before methodically introducing everyday-accessible price tiers spanning $4.99 to $15 for its Koyo and
              Nikko packs. Because top-down market sizing for total produce ($60B+ US fresh fruit) obscures the severe
              volume drop-off at premium price multiples, market sizing is best understood across three constrained
              lenses: the broader US fresh strawberry and berry category, the premium/organic and branded produce tier,
              and the ultra-premium gift and gourmet food market. While consumer willingness to pay a premium for
              consistent brix sweetness and clean label produce supports traction across 18 US states and Toronto,
              scaling beyond urban metropolitan pockets is constrained by consumer price elasticity, making the
              serviceable obtainable market dependent on farm proximity and retail willingness to feature premium
              branded fruit.
            claimRefs:
              - CM006
              - CM007
              - CM008
