      - number: '4.3'
        title: Capital Intensity, Lifetime Financing, and Forward Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Indoor vertical farming requires massive upfront and recurring capital expenditures to design, commission,
              and maintain multi-tier automated cleanrooms. Oishii has raised $370 million in cumulative equity and debt
              capital since founding, culminating in the first closing of a $150 million Series C financing announced in
              May 2026. The round was led by SPARX Asset Management alongside participation from Nomura Real Estate
              Development, MISUMI Group, and Mizuho Bank, providing essential liquidity following the sector-wide
              venture contraction that eliminated earlier peers like Bowery and Plenty. Headcount metrics indicate a
              stable operating baseline across Phillipsburg and Jersey City facilities, reported in the 101–250 employee
              band on FundedIQ and flat over 6- to 12-month periods on recruitment trackers. Proceed allocations are
              targeted toward scaling Amatelas Farm capacity, commercializing Tokyo Open Innovation Center R&D, and
              expanding packaging automation. However, with pending technology litigation in Tokyo and ongoing facility
              expansion outlays, Oishii remains dependent on sustained high-price consumer adoption to achieve operating
              cash flow breakeven before existing reserves require refinancing.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity vs Gross Margin Uncertainty in CEA Underwriting
            body: >-
              While Oishii has successfully distinguished itself from bankrupt vertical farming peers by commanding
              $4.99–$15 price points for delicate fruiting crops, its long-term viability requires demonstrating
              sustained positive unit economics at commercial scale. With $370 million in lifetime capital raised and
              high ongoing facility depreciation, institutional diligence must rigorously interrogate farm-level power
              consumption, robotic harvest cost reduction, and retail inventory sell-through before underwriting
              expansion capital.
            calloutType: risk
            claimRefs:
              - CI001
              - CI006
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Cultivar Architecture, Product Portfolio, and Value Proposition
        blocks:
          - type: paragraph
            body: >-
              Oishii defines its commercial offering around premium specialty fruit grown in hermetically sealed
              vertical farming environments. The company's core product portfolio spans three distinct strawberry
              cultivars and a specialty snacking tomato, complemented by branded retail extensions. Its flagship Omakase
              Berry is an artisanal Japanese cultivar characterized by high brix sweetness and intense aroma, which
              originally debuted across Michelin-starred dining rooms in New York City before expanding to high-end
              retail. The Koyo Berry provides an everyday premium sweet-and-balanced flavor profile, while the Nikko
              Berry was introduced to capture broad family consumers through innovative stay-fresh top-seal packaging
              that reduces plastic usage by 80% compared to traditional clamshell containers. In addition to
              strawberries, Oishii vertically cultivates the jewel-like Rubī Tomato, which features delicate skin and
              concentrated sweetness, and has extended brand equity into pantry staples including the Daifuku-Inspired
              Strawberry Spread and Strawberry Shishito Jelly. By pairing peak-ripeness harvesting with pesticide-free,
              Non-GMO Project Verified claims, Oishii targets consumer willingness to pay a premium over field-grown
              organic produce while maintaining year-round supply consistency.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
