  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital Intensity, Valuation Strains, and Sector Financing Reckoning
        blocks:
          - type: paragraph
            body: >-
              Controlled environment agriculture (CEA) has witnessed an industry-wide contraction, marked by the
              bankruptcy of Plenty and the cessation of operations at Bowery after venture capital dried up across the
              sector. Against this macro backdrop, Oishii closed a $150 million Series C round in May 2026 led by SPARX
              Asset Management alongside Nomura Real Estate Development, MISUMI Group, and Mizuho Bank, lifting
              cumulative equity and debt capital raised to $370 million. While patient Japanese corporate capital and
              debt facilities from Mizuho Bank distinguish Oishii from failed peer operators, indoor vertical farming
              remains exposed to continuous capital expenditure requirements for facility expansion across its
              Phillipsburg and Jersey City footprints. Tracxn records Oishii's headcount expanding to 310 employees by
              August 2026, creating structural payroll overhead that requires sustained high-margin sell-through. If
              consumer demand falters or retail price compression accelerates, high facility operating costs and capital
              depreciation could jeopardize path-to-profitability benchmarks.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR012
      - number: '7.2'
        title: Biological Vulnerability, Microclimate Control, and Robotics Integration
        blocks:
          - type: paragraph
            body: >-
              Unlike leafy green operators, cultivating flowering fruiting crops like strawberries indoors presents
              severe biological and microclimatic failure modes. Strawberry production requires live indoor bee
              pollination, precise HVACD vapor pressure deficit management, and strict pest prevention without synthetic
              chemical pesticides. An uncontained pest outbreak, fungal pathogen infection, or environmental control
              failure could wipe out entire production cycles within high-density facilities such as the Amatelas Farm.
              To address harvest labor costs, Oishii acquired the intellectual property and engineering assets of
              Tortuga AgTech in March 2025, integrating machine vision algorithms with its fleet of 50 Yaskawa robotic
              arms. However, automating the harvesting of delicate soft-flesh berries remains technically difficult, and
              failure to realize the targeted 50% harvest cost reduction would leave operating margins compressed under
              high electricity and automated maintenance overhead.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR010
      - number: '7.3'
        title: Counterparty Dependence, Distribution Friction, and Consumer Price Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Oishii's commercial scalability depends heavily on retail distribution partnerships and specialized
              component suppliers. While the company has expanded fresh berry retail distribution across 18 states and
              entered Toronto as its first international grocery market, shelf velocity remains anchored in premium
              grocers including Whole Foods Market and specialty regional accounts. Transitioning pricing from initial
              $50 Omakase gift packs down to $4.99 everyday entry tiers tests whether mass consumers will pay a
              persistent premium over outdoor organic fruit during inflationary cycles. Diversification into
              shelf-stable spreads such as the $35 Daifuku-Inspired Strawberry Spread remains an unproven volume driver.
              On the supply side, operational scaling relies on key component availability from automation partner
              MISUMI Group and commercial lease agreements with Nomura Real Estate, creating counterparty friction if
              expansion timelines slip.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR009
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Thesis-Break Triggers: Unit Economics and Automation Execution'
            body: >-
              The core investment thesis rests on Oishii demonstrating that high gross margins from premium berry
              cultivars can withstand price tier compression while Tortuga robotics lower harvest labor by 50%. A
              definitive thesis-break event would occur if automated harvest throughput fails to replace human picker
              economics, if pathogen contamination forces an Amatelas Farm depopulation, or if retail sell-through at
              $4.99–$15 stall out across non-metro distribution channels.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Capital Inflows, and Financing Structure
        blocks:
          - type: paragraph
            body: >-
              Oishii has carved out a unique brand and operational profile within indoor vertical agriculture, surviving
              widespread industry restructuring that claimed high-profile operators like Plenty and Bowery. Through its
              initial closing of a $150 million Series C financing round in May 2026 led by SPARX Asset Management
              alongside Nomura Real Estate Development, MISUMI Group, and Mizuho Bank, Oishii expanded its cumulative
              funding to $370 million. The company previously raised a Series B round that closed at $150 million in
              November 2024 (expanding from an initial $134 million tranche announced in February 2024), anchored by NTT
              and supported by climate fund Resilience Reserve, Miyako Capital, and Japanese industrial partners.
              Private company database Multiples.vc recorded an interim post-money valuation mark of $584 million
              associated with the Series B completion in December 2024, whereas Forge Global recorded an unconfirmed
              indicative Series C-8 model valuation mark of $1.6 billion as of August 2026 alongside a $550.75 million
              cumulative funding calculation reflecting authorized share capital authorizations. However, secondary
              liquidity remains severely constrained, with Forge Global characterizing secondary trading as limited and
              warning that private company shares are highly illiquid. Because Oishii does not disclose certified
              audited revenue, gross margin, or farm-level operating cash burn, assessing the company's capital
              durability requires balancing patient Japanese strategic backing against substantial facility and robotics
              overhead.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
              - CV014
      - number: '8.2'
        title: 'Core Dilemma: Premium Brand Moat Versus Commodity Agriculture Headwinds'
        blocks:
          - type: paragraph
            body: >-
              The core bull case for Oishii centers on technological differentiation, premium retail brand power, and
              expanding multi-category shelf space. Operating automated facilities including its 237,500-square-foot
              Phillipsburg farm and deploying bee-pollinated indoor microclimates, Oishii has expanded retail strawberry
              distribution across 18 US states, entered Toronto as its first international grocery market, and rolled
              out new formats from $4.99 entry tiers up to $50 gift packs. The company has also expanded into
              shelf-stable pantry items such as premium preserves and its $35 Daifuku-Inspired Strawberry Spread
              reviewed by The Kitchn, while developing developer-facing storefront endpoints identified by APIs.io.
              Conversely, the anti-thesis highlights the persistent structural vulnerabilities of indoor agriculture:
              extreme facility capital intensity, high electricity demand, delicate bee biological sensitivity, and
              unproven margin sustainability when transitioning from luxury boutique gifts to everyday supermarket
              volume. Comparable public produce and grocery benchmarks trade at conservative enterprise-value multiples
              between 0.5x and 2.5x revenue, creating severe valuation compression risk if Oishii is forced to re-rate
              from a high-multiple agricultural robotics narrative to a traditional specialty food supplier multiple.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Bull, Base, and Bear Scenarios and Actionable Diligence Roadmap
        blocks:
          - type: paragraph
            body: >-
              Diligence on Oishii reveals a wide distribution of prospective outcomes governed by yield realization,
              harvest robotics productivity, and commercial price durability. In a bull scenario, automated indoor
              harvesting and expansion of everyday berry SKUs allow Oishii to establish durable positive operating cash
              flow while justifying an enterprise valuation between $1.0 billion and $1.5 billion in an eventual public
              offering or strategic acquisition by a global food conglomerate. In the base case, Oishii maintains
              premium category leadership in urban grocery markets but experiences slower retail unit velocity and
              margin compression at everyday price points, supporting an estimated private market fair value around $500
              million to $650 million. In a bear case, persistent high energy and robotics maintenance costs, coupled
              with consumer resistance to premium price tags during economic downturns, lead to significant cash burn,
              triggering a down-round financing or structured recapitalization under its 1.0x liquidation preference
              overhang. Given these divergent paths and the absence of verified facility-level cost accounting,
              investors should maintain a track stance until management provides audited farm gross margins,
              facility-level unit economics, and official Series C cap table terms.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Rationale: Track Pending Unit Margin Transparency'
            body: >-
              While Oishii stands out as an exceptionally disciplined survivor in indoor agriculture with strong
              Japanese strategic backing, private secondary valuation marks between $584 million and $1.6 billion are
              difficult to underwrite without audited farm-level operating margins. Investors should maintain a track
              posture until commercial sell-through velocity at everyday price points is independently verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV011
          - type: callout
            title: Valuation Down-Round and Liquidation Preference Overhang
            body: >-
              With cumulative funding reaching $370 million and Forge Global indicating a 1.0x liquidation preference
              structure across preferred share series, common shareholders and new secondary entrants face substantial
              preference overhang in any down-round or distressed exit scenario if macro indoor farming headwinds
              intensify.
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV013
