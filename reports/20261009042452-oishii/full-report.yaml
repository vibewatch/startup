      - number: '6.3'
        title: Named proof is real but shallow
        blocks:
          - type: paragraph
            body: >-
              Public reference quality is uneven. Whole Foods Market and FreshDirect are named production retail
              channels, while restaurants are described only as a cohort and not identified individually. An independent
              The Kitchn reviewer praised a premium preserve, but that is one product experience rather than
              cohort-level proof; the same review called out a $35 price for a 6.9-ounce jar. The available material
              contains no NRR, GRR, churn, renewal, contract-length, satisfaction, repeat-purchase, retailer
              sell-through, or cohort data. Consequently, the chapter can verify availability and isolated positive
              product response, but cannot infer durable consumer loyalty or retailer renewal. The named-proof table
              therefore treats the disclosed examples as a sample and makes each limitation explicit rather than
              converting logos or testimonials into retention claims.
            claimRefs:
