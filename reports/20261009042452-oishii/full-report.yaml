      - number: '5.3'
        title: Software Infrastructure, Developer Surfaces, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Behind its agricultural operations, Oishii utilizes an engineering and data platform built on cloud-native
              infrastructure, data pipelines, and developer-facing commerce protocols. The company's software and
              systems engineering stack leverages Amazon Web Services (AWS), AWS Redshift, PostgreSQL, and Microsoft SQL
              Server for data storage and telemetry ingestion, with containerized microservices managed via Docker and
              Kubernetes. Data science and machine learning workflows are built with Python and TensorFlow, supporting
              computer vision models for plant health diagnostics, yield forecasting, and automated environmental
              adjustment. On the digital commerce surface, Oishii operates an agent-ready direct-to-consumer storefront
              providing a live Model Context Protocol (MCP) server, Universal Commerce Protocol (UCP) endpoints, and
              structured llms.txt discovery resources. Despite these technological advantages, the operating model faces
              technical and biological risks: strawberry cultivation requires complex natural bee pollination within
              indoor microclimates, maintaining hermetic positive-pressure biosecurity requires non-trivial electrical
              energy, and automated robotic picking must sustain high throughput across dense canopies to justify high
              upfront capital expenditures.
            claimRefs:
              - CE010
              - CE012
              - CE014
              - CE015
              - CE016
