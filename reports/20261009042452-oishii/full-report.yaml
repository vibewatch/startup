  - id: TV001
    title: Recommendation and Valuation Stance Summary
    columns:
      - Metric / Dimension
      - Stance / Assessment
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Capitalized through Series C ($150M) but unit economics remain unverified
        - Maintain active monitoring; defer direct investment pending margin proof
      - - Confidence Level
        - Medium
        - Verified primary funding records from SPARX and Hortidaily; private secondary marks conflict
        - Requires selective position sizing and deep technical audit of farm economics
      - - Risk Rating
        - High
        - Capital-intensive indoor agriculture, high facility overhead, and sector restructuring
        - Demand senior liquidation preference and protective governance covenants
      - - Valuation Stance
        - Stretched
        - Multiples.vc records $584M (Series B); Forge model indicates up to $1.6B without public revenue support
        - Risk of substantial multiple compression if benchmarked against specialty food peers
      - - Target Exit / Horizon
        - 4-6 Years (IPO / Strategic M&A)
        - Series C stage with expansion into 18 states and Tokyo R&D center
        - Track milestone progress toward sustainable facility-level operating profitability
    notes: >-
      Summary synthesized from reported Series B/C funding disclosures, private valuation marks, and CEA macro industry
      benchmarks.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV011
  - id: TV002
    title: Investment Thesis vs. Anti-Thesis Matrix
    columns:
      - Pillar
      - Thesis (Bull Argument)
      - Anti-Thesis (Bear Argument)
      - What Would Change the View
    rows:
      - - Technology & Automation
        - Bee pollination and proprietary robotics enable high-yield year-round strawberry cultivation
        - Robotics maintenance and high facility power consumption create persistent cost pressure
        - Verified farm-level harvest automation cost reductions exceeding 40%
      - - Product & Brand
        - Iconic brand commanding $50 gift packs down to $4.99 mass-market entry tiers across 18 states
        - Luxury berry elasticity untested at scale; consumer pushback against premium price tags
        - Demonstrated sustained retail re-order velocity in mainstream grocery channels
      - - Capital & Backing
        - Deep patient capital from top-tier Japanese strategics (SPARX, MISUMI, Nomura, Mizuho)
        - Extreme capital expenditure requirements; past vertical farming peers failed despite large backing
        - Demonstration of fully self-funding unit economics at Phillipsburg facility
      - - Category Expansion
        - Diversification into tomatoes, preserves ($35 spread), and international markets (Toronto)
        - Non-berry SKUs represent unproven volume; spread remains a niche premium specialty item
        - Material revenue contribution (>20%) from non-strawberry product categories
    notes: Comparative matrix contrasting commercial strengths against operational and capital headwinds.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Scenario Valuation Analysis
    columns:
      - Scenario
      - Probability
      - Core Operating Assumptions
      - Implied Valuation / Return Logic
      - Key Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - Successful automated scaling, everyday SKUs achieve mass adoption, international growth
        - $1.0B - $1.5B (7x-10x implied revenue at scale, viable IPO path)
        - Macro agricultural commodity crash, severe crop pathogen outbreak
      - - Base Case
        - 50%
        - Sustained premium niche, moderate retail expansion, steady $500M-$650M valuation mark
        - $500M - $650M (in line with Dec 2024 Series B mark of $584M)
        - Retail margin squeeze, consumer trade-down to standard organic berries
      - - Bear Case
        - 25%
        - Cash burn remains elevated, consumer resistance at retail, robotics ROI lags expectations
        - $200M - $350M (down-round recapitalization or distressed sale)
        - Liquidity exhaustion, failure to secure subsequent debt or equity tranches
    notes: >-
      Probabilities and valuation ranges represent scenario projections based on private funding marks and peer multiple
      benchmarks.
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
