chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              Oishii was founded in 2016 by Hiroki Koga and Brendan Somerville, who initially met while pursuing MBA
              degrees at UC Berkeley. Koga, who previously worked as an agriculture technology consultant in Japan,
              serves as Chief Executive Officer, while Somerville co-founded an avocado enterprise in Uganda prior to
              establishing Oishii. The company established its corporate headquarters in Jersey City, New Jersey,
              initially developing a northern New Jersey research facility in 2017 before scaling commercial indoor
              strawberry cultivation. The executive leadership team maintains significant operational and agronomic
              dependence on Koga's domain expertise and technical relationships with Japanese agricultural specialists
              and industrial automation conglomerates. Governance reflects heavy strategic alignment with international
              corporate backers, including Japan telecommunications leader NTT and industrial robotics pioneer Yaskawa
              Electric Corporation, alongside climate-focused venture capital funds. The business operates on a premium
              specialty produce model, targeting high-end grocery retail, direct-to-consumer digital channels, and
              Michelin-starred culinary accounts rather than commoditized mass-market leafy greens.
            claimRefs:
              - CO001
              - CO002
              - CO003
