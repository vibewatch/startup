      - number: '1.3'
        title: Operational Footprint, Commercial Milestones, and Scale Trajectory
        blocks:
          - type: paragraph
            body: >-
              The company's commercial expansion has progressed through distinct technological and geographic phases. In
              2018, Oishii commercially launched its inaugural product, the chef-favorite Omakase Berry, establishing
              brand equity across elite Manhattan restaurants including Atomix and Eleven Madison Park. In 2022, Oishii
              commissioned Mugen Farm in Jersey City, a 74,000-square-foot indoor strawberry vertical farm, followed by
              the launch of its second flagship cultivar, the Koyo Berry, in 2023. Operational capacity expanded
              substantially in 2024 with the commissioning of Amatelas Farm in Phillipsburg, New Jersey, spanning more
              than 237,000 square feet as the company's primary production mega-facility. Commercial distribution has
              broadened from initial New York boutique grocers to Whole Foods Market locations across New York, New
              Jersey, Connecticut, D.C., and Chicago, alongside regional retail distribution in Harris Teeter,
              FreshDirect, and specialty merchants. Product line diversification includes the Rubī snacking tomato,
              introduced in December 2023, and specialty value-added retail items such as the Daifuku-Inspired
              Strawberry Spread retailing at $35 per jar, as well as an experiential physical retail kiosk located at
              Chelsea Market in New York City.
