      - number: '6.2'
        title: Adoption is visible through distribution, not usage cohorts
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption signal is distribution breadth. Oishii's May 2026 release states that
              distribution had reached 18 states and Toronto, its first international retail market. Earlier snapshots
              show the path: 2023 trade coverage named expansion from Washington, D.C. into Maryland, Massachusetts,
              Connecticut, and New Jersey, and late-2024 reporting described a predominantly Northeast and mid-Atlantic
              footprint plus a Chicago launch. Pricing also broadened from the nearly $50 Omakase launch tray to a
              company-stated current range of $4.99 to $15. This is credible evidence of wider access and price
              architecture, but distribution points and lower entry prices are not the same as active buyers,
              sell-through, repeat purchase, or profitable utilization.
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU011
              - CU016
