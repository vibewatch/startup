      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technological Differentiation Beyond Commodity Leafy Greens
            body: >-
              Unlike bankrupt vertical farming predecessors such as Bowery and Infarm that concentrated capital on
              commoditized leafy greens with thin margins, Oishii positioned its agronomy on high-value flowering and
              fruiting crops. By mastering indoor bee pollination alongside custom harvesting robotics co-developed with
              Yaskawa Electric, Oishii commands retail price points of $10 to $15 per tray, establishing pricing power
              necessary to absorb indoor energy and capital depreciation.
            calloutType: insight
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO011
          - type: callout
            title: Capital Intensity and Facility Scale Burden
            body: >-
              Operating over 311,000 square feet of combined indoor agricultural space across Mugen Farm and Amatelas
              Farm exposes Oishii to substantial baseload electricity tariffs, facility amortization, and equipment
              maintenance. While $189 million in equity funding has shielded the company during the sector's
              macroeconomic consolidation, long-term commercial solvency hinges on achieving unit cost parity with
              outdoor organic berry agriculture.
            calloutType: risk
            claimRefs:
