      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Environment-First Design for Agricultural Robotics
            body: >-
              A pivotal engineering differentiator for Oishii is designing the physical cultivation environment
              specifically around robotic capabilities, rather than engineering general-purpose robots for variable
              agricultural settings. By standardizing plant heights, row spacing, and illumination in vertical racks,
              Oishii simplifies computer vision localization and mechanical picking, overcoming historical barriers that
              hindered previous vertical farming automation efforts.
            calloutType: insight
            claimRefs:
              - CE008
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Oishii reaches consumers through several buying surfaces rather than a disclosed account-based customer
              base. Whole Foods Market is the strongest named retail proof: Oishii identifies the partnership and a
              four-market regional footprint, while trade coverage also names Whole Foods, FreshDirect, and specialty
              grocers. A company-supplied Built In profile adds food-loving consumers and restaurants, but does not
              quantify either segment or establish recurring demand. The current official site also shows a direct kiosk
              and limited reservation format, indicating that Oishii is testing owned retail alongside wholesale
              channels. These sources establish where buyers can encounter the brand, not who pays the most, how much
              each channel contributes, or whether the end user and economic buyer differ inside grocery accounts.
            claimRefs:
              - CU003
              - CU004
              - CU012
