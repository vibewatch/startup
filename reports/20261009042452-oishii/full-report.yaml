      - number: '1.2'
        title: Capitalization Structure, Financing History, and Strategic Investors
        blocks:
          - type: paragraph
            body: >-
              Oishii has raised cumulative equity financing of at least $189 million since inception through its Series
              B financing round. In early 2024, the company announced an initial $134 million Series B round led by
              Japanese telecommunications conglomerate NTT, which was subsequently upsized and officially closed at $150
              million in November 2024 following expanded demand from climate-focused investors. Late additions to the
              Series B syndicate included Resilience Reserve—a climate investment vehicle co-founded by TED head Chris
              Anderson and author Rob Reid—as well as Kyoto-based venture firm Miyako Capital. Earlier institutional
              backers participating across financing tranches include Bloom8, McWin Capital Partners, Mizuho Bank,
              Mitsubishi Shokuhin Co., Ltd., Yaskawa Electric Corporation, and the state-backed Japan Green Investment
              Corporation for Carbon Neutrality (JICN) established by the Japanese Ministry of the Environment. While
              third-party aggregate venture databases such as Raising.fi report funding exceeding $100 million across
              single-round snapshots, verified primary trade announcements substantiate the full $189 million cumulative
              threshold. Material gaps persist regarding post-money valuation metrics, share classes, liquidation
              preferences, and secondary transaction volume, which remain undisclosed private corporate data.
            claimRefs:
              - CO006
              - CO008
