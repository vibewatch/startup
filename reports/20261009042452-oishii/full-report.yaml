      - number: '5.2'
        title: CEA Architecture, Robotics Integration, and Closed-Loop Systems
        blocks:
          - type: paragraph
            body: >-
              The core technical architecture powering Oishii's production model centers on Controlled Environment
              Agriculture (CEA) deployed within stacked vertical facilities such as its flagship Amatelas Farm in
              Phillipsburg, New Jersey. Rather than retrofitting general-purpose robotics into variable greenhouse
              settings, Oishii designed its vertical growing environment specifically to accommodate robotic automation,
              positioning crop tiers at uniform heights with predictable lighting, airflow, and plant geometry. This
              structured setup enables automated harvesting systems to identify ripeness using color, firmness, and
              positional cues without bruising fragile fruit. Following its acquisition of Tortuga AgTech in 2025 and a
              strategic partnership with manufacturing automation leader MISUMI Group, Oishii has integrated robotics
              and automation directly into its harvest workflows to achieve commercial production volumes. Cultivation
              relies on closed-loop recirculating hydroponic and aeroponic systems that mist roots with nutrient-rich
              water, reducing freshwater consumption by up to 90% to 95% compared to conventional open-field agriculture
              while completely eliminating agricultural runoff. Spectral LED arrays tailored to photosynthetic
              absorption curves are coupled with real-time IoT sensors measuring humidity, vapor pressure deficit,
              temperature, and carbon dioxide levels.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
