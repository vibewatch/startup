      - number: '6.4'
        title: Expansion loop and commercial constraints
        blocks:
          - type: paragraph
            body: >-
              Oishii's expansion model appears to pair premium product differentiation with regional retail
              relationships, then widen price points, formats, and geographies. Management told FoodNavigator that
              fresh, local production constrained selling distance, that retailer inbound interest was strong, and that
              partners needed flexibility while processes and timelines evolved. The same interview argued that
              consumers buy the product for quality, not vertical farming itself, placing repeat taste and value at the
              center of durability. Independent sector framing in that article also highlighted heavy losses,
              bankruptcies, and consolidation in vertical farming. A supplier case study claims faster annotation work
              for Oishii's harvesting model, but it does not prove customer demand. Without channel mix, retailer terms,
              top-account share, or repeat-purchase data, geographic expansion remains an encouraging but incomplete
              proxy for commercial resilience.
