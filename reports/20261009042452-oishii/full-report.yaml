      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation Through Crop Complexity and Pricing Power
            body: >-
              While first-generation indoor farms collapsed under the commoditization of leafy greens where price
              premiums could not offset massive electricity and facility depreciation costs, Oishii's decision to
              commercialize bee-pollinated strawberries enabled gross retail price realization between $4.99 and $15 per
              pack, maintaining gross margins that cushion high CEA operating expenditures.
            calloutType: insight
            claimRefs:
              - CM001
              - CM007
              - CM014
          - type: callout
            title: Capital Intensity and Farm Replication Bottlenecks
            body: >-
              Scaling vertical agriculture beyond local urban hubs historically required expensive custom engineering
              for each facility. Oishii's transition to standardized modular hardware via its Open Innovation Center in
              Japan is critical to lowering unit capital expenditure before high-volume commoditization pressures
              compress retail produce price points.
            calloutType: risk
            claimRefs:
              - CM010
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Premium Specialty Crops vs. Commodity CEA Operators'
        blocks:
          - type: paragraph
            body: >-
              The controlled environment agriculture (CEA) sector has experienced a profound divergence. While
              first-generation vertical farming operators such as Plenty, Bowery Farming, and AppHarvest raised billions
              of dollars to cultivate commodity leafy greens, they faced severe financial stress, high energy and
              operating expenses, and bankruptcies due to insufficient pricing power against field agriculture. In
              contrast, Oishii deliberately bypassed leafy greens to cultivate technically demanding, high-value
              strawberries and specialty fruiting crops. By building a Smart Farm platform that combines indoor bee
              pollination, environmental control systems, and harvesting robotics, Oishii establishes a distinct premium
              moat. However, it operates alongside public comparables and surviving regional CEA operators including
              Plenty, AeroFarms, and Gotham Greens tracked by Caplight, while competing directly for consumer grocery
              spend against status-quo conventional berry suppliers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Capability Matrix and Technological Differentiation Across Growing Models
        blocks:
          - type: paragraph
            body: >-
              Evaluating indoor vertical farms against commercial high-tech greenhouses and conventional field
              operations reveals distinct structural tradeoffs in agronomic precision, capital intensity, and retail
              pricing flexibility. Oishii achieves complete year-round production consistency and zero pesticide usage
              by utilizing enclosed, robot-assisted indoor vertical farming facilities in New Jersey. Following its 2025
              acquisition of Tortuga AgTech and its 2026 manufacturing partnership with MISUMI Group, Oishii has
              automated core harvesting, pollination, and quality control workflows to systematically lower unit labor
              overhead. Meanwhile, industrial field farming maintains immense volume and lowest unit cost but suffers
              from seasonality, pesticide reliance, and climate vulnerability. Commercial hydroponic greenhouses offer
              an intermediate capital-cost structure but struggle to achieve the high sugar Brix levels and pristine
              cosmetic perfection demanded by Oishii's luxury brand positioning.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
