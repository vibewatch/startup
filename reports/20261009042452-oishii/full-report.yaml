      - number: '3.3'
        title: Pricing Architecture, Packaging Innovation, and Defensibility Against Substitutes
        blocks:
          - type: paragraph
            body: >-
              Oishii's commercial model initially relied on an ultra-premium luxury gift strategy, launching the Omakase
              Berry at nearly $50 per tray in 2018. As production capacity expanded across 18 U.S. states and Toronto,
              Oishii broadened its catalog to include the Koyo Berry, Nikko Berry, and Rubī Tomato, introducing everyday
              grocery retail packs spanning $4.99 to $15. To safeguard fruit quality and improve shelf life, the company
              introduced stay-fresh top-seal packaging that reduces plastic consumption by 80% compared to traditional
              clamshells. Moat durability relies on brand equity, retail relationships with accounts such as Whole Foods
              Market, and a proprietary technological barrier across indoor bee pollination and harvesting robotics.
              Nevertheless, the brand faces ongoing displacement risks from conventional organic Driscoll's
              strawberries, price resistance among grocery shoppers, and high facility electricity costs.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technological Moats and Crop Selection Drive CEA Survival
            body: >-
              The historical collapse of leafy-green vertical farms demonstrates that CEA cannot succeed on
              energy-intensive commodity crops. Oishii's strategic focus on fruiting strawberries—supported by indoor
              bee pollination and Tortuga AgTech harvesting robotics—creates defensible pricing power that insulates
              unit economics from commodity price deflation.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, SKU Monetization, and Direct vs Wholesale Economics
        blocks:
          - type: paragraph
            body: >-
              Oishii monetizes high-density vertical indoor farming through a mix of premium grocery wholesale,
              specialty high-end direct retail, and branded shelf-stable food products. Historically anchored by its
              flagship Omakase Berry which debuted at nearly $50 per tray in 2018, the commercial portfolio has
              broadened to include the Koyo Berry, Nikko Berry, and Rubī Tomato across pack sizes priced between $4.99
              and $15.00. Wholesale grocery distribution across 18 states and Whole Foods Market locations in New York,
              New Jersey, Connecticut, and D.C. accounts for the primary volume channel, while regional specialty stores
              and the Toronto international retail market extend grocery reach. To capture direct-to-consumer margin and
              high-end brand gifting demand, Oishii operates dedicated experiential direct retail formats such as its
              Chelsea Market kiosk in New York City, selling Connoisseur Grade single-berry trays and $35 specialty
              spreads like the Daifuku-Inspired Strawberry Spread. However, wholesale distribution requires retailer
              margins and distributor slotting allowances, while realized net price realization per harvested pound
              remains undisclosed across commercial retail agreements.
