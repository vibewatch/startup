  title: "Product & Technology"
  summary: "Oishii operates an indoor vertical farming platform combining Controlled Environment Agriculture (CEA), robotics-ready stacked architecture, and artificial intelligence to produce pesticide-free Japanese strawberry cultivars and snacking tomatoes at commercial scale."
sections:
  - id: "cultivar-portfolio-and-product-line-architecture"
    title: "Cultivar Architecture, Product Portfolio, and Value Proposition"
    body: "Oishii defines its commercial offering around premium specialty fruit grown in hermetically sealed vertical farming environments. The company's core product portfolio spans three distinct strawberry cultivars and a specialty snacking tomato, complemented by branded retail extensions. Its flagship Omakase Berry is an artisanal Japanese cultivar characterized by high brix sweetness and intense aroma, which originally debuted across Michelin-starred dining rooms in New York City before expanding to high-end retail. The Koyo Berry provides an everyday premium sweet-and-balanced flavor profile, while the Nikko Berry was introduced to capture broad family consumers through innovative stay-fresh top-seal packaging that reduces plastic usage by 80% compared to traditional clamshell containers. In addition to strawberries, Oishii vertically cultivates the jewel-like Rubī Tomato, which features delicate skin and concentrated sweetness, and has extended brand equity into pantry staples including the Daifuku-Inspired Strawberry Spread and Strawberry Shishito Jelly. By pairing peak-ripeness harvesting with pesticide-free, Non-GMO Project Verified claims, Oishii targets consumer willingness to pay a premium over field-grown organic produce while maintaining year-round supply consistency."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
  - id: "indoor-vertical-farming-architecture-and-automation"
    title: "CEA Architecture, Robotics Integration, and Closed-Loop Systems"
    body: "The core technical architecture powering Oishii's production model centers on Controlled Environment Agriculture (CEA) deployed within stacked vertical facilities such as its flagship Amatelas Farm in Phillipsburg, New Jersey. Rather than retrofitting general-purpose robotics into variable greenhouse settings, Oishii designed its vertical growing environment specifically to accommodate robotic automation, positioning crop tiers at uniform heights with predictable lighting, airflow, and plant geometry. This structured setup enables automated harvesting systems to identify ripeness using color, firmness, and positional cues without bruising fragile fruit. Following its acquisition of Tortuga AgTech in 2025 and a strategic partnership with manufacturing automation leader MISUMI Group, Oishii has integrated robotics and automation directly into its harvest workflows to achieve commercial production volumes. Cultivation relies on closed-loop recirculating hydroponic and aeroponic systems that mist roots with nutrient-rich water, reducing freshwater consumption by up to 90% to 95% compared to conventional open-field agriculture while completely eliminating agricultural runoff. Spectral LED arrays tailored to photosynthetic absorption curves are coupled with real-time IoT sensors measuring humidity, vapor pressure deficit, temperature, and carbon dioxide levels."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "software-stack-operational-controls-and-technical-risks"
    title: "Software Infrastructure, Developer Surfaces, and Operational Risks"
    body: "Behind its agricultural operations, Oishii utilizes an engineering and data platform built on cloud-native infrastructure, data pipelines, and developer-facing commerce protocols. The company's software and systems engineering stack leverages Amazon Web Services (AWS), AWS Redshift, PostgreSQL, and Microsoft SQL Server for data storage and telemetry ingestion, with containerized microservices managed via Docker and Kubernetes. Data science and machine learning workflows are built with Python and TensorFlow, supporting computer vision models for plant health diagnostics, yield forecasting, and automated environmental adjustment. On the digital commerce surface, Oishii operates an agent-ready direct-to-consumer storefront providing a live Model Context Protocol (MCP) server, Universal Commerce Protocol (UCP) endpoints, and structured llms.txt discovery resources. Despite these technological advantages, the operating model faces technical and biological risks: strawberry cultivation requires complex natural bee pollination within indoor microclimates, maintaining hermetic positive-pressure biosecurity requires non-trivial electrical energy, and automated robotic picking must sustain high throughput across dense canopies to justify high upfront capital expenditures."
    claimRefs:
      - "CE010"
      - "CE012"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
