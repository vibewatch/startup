            body: >-
              本章最干净的公开规模代理来自应用商店评分和公司披露的用户数，而不是单一第三方流量面板。这些代理仍能拉开差距。ESPN 和 Yahoo
              在漏斗顶端触达上远大于其他玩家，因此即便它们强调免费玩法、赛季制管理和预测游戏，而非真金白银的选择单，对休闲球迷仍是危险替代品。在直接以 pick 为主的 App 中，PrizePicks
              的公开证明最强：官网宣称 20 million 玩家，App Store 评分约 463K。Sleeper 的评分落后，但把 picks、联赛管理、社交聊天和如今由 Kalshi
              支撑的预测市场组合起来，形成更强的参与闭环。Underdog 自家首页仍显示出实质规模和接近全国的覆盖，但公开证明点小于大型既有平台，也不如 PrizePicks 的 App 加首页叙事明确。Betr 和
              Dabble 在机制上明显重叠，但公开分发证明看起来显著小于 PrizePicks 或 Sleeper。
