      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              三个驱动最突出。第一，移动分发实质性扩大市场：Mordor 称 App 在 2025 年获取梦幻体育收入的 64.61%，其美国线上博彩模型则把移动端占比放在 2025 年活动的
              80.13%。第二，漏斗顶部大且文化韧性强：FSGA 称美国和 Canada 有 85 million 梦幻体育玩家，R Street 则把美国线上梦幻体育行业估为超过 50 million 玩家、年收入约
              $10 billion。第三，相邻投注常态化继续抬高天花板。Flutter 称预测市场会扩大 TAM，因为它们能触达约 40% 无法使用受监管线上体育博彩的美国人口；Flutter 和 CNBC 都把
              California、Texas 等非体育博彩州描述为尤其重要的入口。


              约束同样结构性。DFS 合法性仍按州变化，pick'em 产品也持续因类似 prop bet 而受到审查。Betting.us 记录了持续存在的州级限制，R Street 详述了既有运营商对 pick'em
              格式的游说，Mordor 也明确把 California 转向和碎片化合规成本列为阻力。在相邻体育博彩市场，高税率和广告限制压缩利润率，并偏向规模玩家。AGA
              也升级了对预测市场平台的批评，警告体育事件合约会模糊消费者理解并抽走州税收入。对 Underdog 而言，市场机会真实存在，但其耐久性更少取决于广泛体育迷需求，更多取决于监管者是否继续容忍梦幻体育加预测的混合栈。
