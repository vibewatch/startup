  - id: TV005
    title: 投资逻辑失效与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - California 执法从意见升级为大范围市场退出或事实停摆
        - 管理层称占收入 10% 的 California 敞口丧失或重做
        - 收入、增长和战略可选性同时压缩
        - 把估值区间重切到悲观情景，并暂停任何买入讨论
      - - New York 经济性无法通过获许可赛制或永久牌照恢复
        - 支付 $17.5M 退出成本后，没有可信路径恢复价值
        - 和解成为州层面摩擦反复拖累的证据，而非一次性事件
        - 将当前估值标记视为至多只能算充分定价
      - - 预测市场转向持续迫使公司收缩
        - North Carolina 之后出现更多裁员、更多产品退出或长期分心
        - 执行信心和战略倍数都走弱
        - 下调建议，并要求内部 KPI 证明
      - - 最新一轮融资后，公开披露仍然单薄
        - 下一次融资决策前，仍没有经审计 hold 率、利润率、股权结构表或流动性清晰度
        - 投资者无法判断名义价格在经济上是否干净
        - 不要从观察上调到买入
    notes: 触发因素定义为可监控事件，而非抽象风险，这样建议能在刷新时快速更新。
