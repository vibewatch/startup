      - number: '2.2'
        title: 市场规模：宽口径梦幻体育 TAM 与更窄 DFS 现实
        blocks:
          - type: paragraph
            body: >-
              “梦幻体育”的公开市场规模弹性很大，因为发布方会混合不同地域、变现模式和竞赛类型。Grand View 将全球梦幻体育市场估为 2024 年 $24.85 billion、2030 年 $56.38
              billion；Mordor 的起点更高，2026 年为 $42.37 billion，并预计 2031 年达到 $80.31 billion。另一组口径把范围收窄：Worldmetrics 报告 2023
              年梦幻体育总收入为 $24 billion，但美国 DFS 收入只有 $1.2 billion，2023 年美国活跃 DFS 用户为 24 million；全球 DFS 基数约为 2021 年 $1.1
              billion，并以 13.4% CAGR 增长至 2030 年。Mordor 还称每日梦幻体育格式在 2025 年占梦幻体育市场收入的 55.74%，这意味着 Underdog
              可触达的核心市场显著小于宽口径梦幻体育 TAM 材料暗示的规模。


              相邻市场大得多。AGA 称美国商业体育博彩收入 2025 年达到 $16.89 billion，iGaming 达到 $10.73 billion。Mordor 将 2026 年美国线上博彩市场估为 $6.89
              billion、全球线上体育博彩市场估为 $49.74 billion；Coherent 的口径更高，为 $59.46 billion。实际结论不是 Underdog
              可以把这些池子全部计入，而是公司的梦幻体育核心相对较小，但切入预测市场和类体育博彩行为会抬高天花板。公开数据仍无法按州、格式或留存队列拆出 Underdog 的 SAM 或 SOM。
