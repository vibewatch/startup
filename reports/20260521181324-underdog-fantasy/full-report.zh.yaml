  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              对 Underdog 而言，监管碎片化是核心投资判断问题，因为州级市场准入变化可能快于产品需求。最清楚的负面证据已经记录在案。New York 于 2025 年 3 月就所谓未获许可竞赛与 Underdog
              达成和解，公司称将停止在该州提供某些竞赛类型，除非这些类型获得许可。California 随后进一步抬高门槛：司法部长 2025 年 7 月意见称，实际位于 California 的玩家参与每日梦幻体育，均被
              Penal Code section 337a 禁止，无论运营商或技术位于何处；该意见明确覆盖选秀式和 pick'em 格式。Arizona 2025 年 cease-and-desist 措辞虽非专指
              Underdog，但显示另一监管者把未经授权的线上博彩描述为消费者保护和金融安全问题。联邦商品监管为预测产品创造了可选性，但不能抹去州级敌意。除公法风险外，California 集体诉讼如今指控 Underdog
              产品属于非法体育博彩，并寻求返还、损害赔偿和禁令救济。因此，关键风险不是抽象监管，而是在争议州突然撤回产品、更重的合规负担和法律支出。
