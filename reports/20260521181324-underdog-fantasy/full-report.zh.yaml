      - number: '4.3'
        title: 税费、监管拖累与反向经济性
        blocks:
          - type: paragraph
            body: >-
              对梦幻体育运营商而言，监管不只是法律背景，而是直接的损益表项目。New York 的 IFS 规则对州内总收入征收 15% 税，再加 0.5%
              费用，要求月度税务报告和年度活动报告，并强制运营商保存报名费、奖金和成功率分布的详细记录。2025 年 3 月和解随后说明，牌照或格式争议如何变成直接现金流失和市场退出：委员会称 Underdog
              将停止某些竞赛类型，除非它们获得许可；Legal Sports Report 称这次退出让公司付出与 New York 收入相关的 $17.5 million。California
              更开放但潜在规模更大。司法部长正式意见称，付费报名 DFS 在该州属于非法体育博彩；SportsHandle 报道 Underdog 曾在法庭上表示 California 占总收入 10%。Front
              Office Sports 随后记录了寻求消费者返还的集体诉讼，并称司法部长预计运营商会转入合规。财务上，这一组合意味着税费、罚款、准备金需求、市场退出、产品重做和法律支出都叠加在正常获客与派奖经济之上。
