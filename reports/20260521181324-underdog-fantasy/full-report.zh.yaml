  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前首次交割后的投后估值已接近可支撑基准情景上沿，并没有留出很宽的安全边际。
    data:
      items:
        - label: 悲观情景
          low: 650
          mid: 775
          high: 900
          displayValue: $650M-$900M
          detail: 法律摩擦和收入流失压低倍数。
        - label: 基准情景
          low: 1000
          mid: 1150
          high: 1300
          displayValue: $1.0B-$1.3B
          detail: 只有扰动保持可控，当前价格才跑得通。
        - label: 乐观情景
          low: 1500
          mid: 1700
          high: 2000
          displayValue: $1.5B-$2.0B
          detail: 收入韧性叠加更清晰的监管，支撑上行空间。
        - label: 当前首次交割后投后估值
          low: 1295
          mid: 1295
          high: 1295
          displayValue: $1.295B
          detail: 由 $1.225B 投前估值加上 $70M 首次交割推导。
    approximationNotes: 情景区间是投资委员会口径的范围，不是 DCF 输出，也不是管理层预测。
    claimRefs:
      - CV007
      - CV039
      - CV040
      - CV041
