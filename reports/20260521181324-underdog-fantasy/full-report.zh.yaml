  - id: FI001
    title: 收入模型桥接
    type: flow
    layout: wide
    summary: 概念上把客户报名费桥接到运营商净经济性，并标出公开披露在哪里止步、真实利润率仍缺哪一段。
    data:
      nodes:
        - id: wallet
          label: 充值钱包 / 支付报名费
          detail: 客户资金来自比赛报名费和钱包活动。
        - id: format
          label: 选择比赛形式
          detail: Standard Pick’em、Flex、组合参赛和 Drafts 的派彩逻辑不同。
        - id: settle
          label: 比赛结算
          detail: 派彩、作废、救援和退款决定玩家总回报。
        - id: gross
          label: 毛收入基础
          detail: 为报税，运营商记录报名费、已付奖金和毛收入。
        - id: drag
          label: 税费 / 合规 / 促销
          detail: 州税、促销抵扣和合规成本会压低贡献经济性。
        - id: net
          label: 净收入 / 毛利润
          detail: 最后一段桥接 Underdog 未公开披露。
      edges:
        - from: wallet
          to: format
        - from: format
          to: settle
        - from: settle
          to: gross
        - from: gross
          to: drag
        - from: drag
          to: net
