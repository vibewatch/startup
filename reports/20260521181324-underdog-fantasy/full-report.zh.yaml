      - number: '5.3'
        title: 信任、安全、合规与人在回路运营
        blocks:
          - type: paragraph
            body: >-
              信任和合规不是 Underdog 产品体验的旁注，而是核心运营层。帮助中心称用户必须共享精确位置，因为不同州允许的活动不同；VPN 或代理使用会在资格无法验证时阻止访问。账户验证页面要求有效的美国或加拿大政府
              ID，参与预测市场时可能要求
              SSN，并说明一人一户规则、重复账户审核，以及与安全或支付相关的文件请求。竞赛完整性文档随后展示了人在回路控制模型：选秀可能因合谋、故意摆烂、技术异常或罕见球员组合接受人工审核；如果竞赛被取消，报名费会退还。结算文档公布
              72 小时验证窗口，并在数据提供商或平台错误出现时保留分数反转权。在这套控制栈周围，Underdog 叠加了负责任博彩限额、自我排除、州热线、GuardDog fund，以及 Sportradar 的
              Bettor Sense 与 Birches Health 治疗转介。这些保障有意义，但它们与 New York、California 的严重监管敞口，以及围绕验证、提现和客服响应的公开用户摩擦信号同时存在。
