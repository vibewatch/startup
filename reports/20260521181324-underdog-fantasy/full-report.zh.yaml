      - number: '2.3'
        title: 买方、用户与付款人分层
        blocks:
          - type: paragraph
            body: >-
              Underdog 的买方、用户和付款人通常是同一个人：用个人娱乐预算出资的成年体育迷。官方应用商店文案强调简单的自助支付——Apple Pay、银行卡、PayPal
              和银行存款——产品设计围绕快速移动端决策，而不是委员会采购或年合同。在这个消费者基础内，至少出现四类行为上不同的细分。Best Ball 和选秀用户重视低维护的赛季制参与；Pick'em
              用户偏好快速、基于数据且频繁刷新的报名；更投入的 DFS 用户偏好多运动、高频玩法；预测市场用户更接近交易者，受让分、总分、独赢盘和合约组合吸引。Flutter 的 FanDuel
              披露还暗示存在第五个相邻细分：没有合法线上体育博彩州里的“娱乐优先”用户，他们可能先通过预测产品进入，然后才成为体育博彩客户。


              采用路径是移动端发现，随后资格与地理定位检查、钱包充值、首次竞赛报名，再到重复游玩或跨产品使用。预算所有者在这些阶段没有变化，但触发因素会变化。选秀和 Best Ball 产品吸引赛季制球迷；Pick'em
              降低认知负担和单次会话时间；预测市场则靠新鲜感、法律可用性，以及在受阻州里与体育博彩类结果的相似性吸引用户。仍不透明的是组合：公开来源没有披露 Underdog 付费用户中各细分占比，或每个细分的变现水平。
