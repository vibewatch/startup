  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Underdog 有足够公开估值支撑，可以继续保持可投状态，但还不足以给出干净的买入结论。支持性事实真实存在：公司披露一轮预计超过 $100 million 的融资已首次交割 $70 million，设定
              $1.225 billion 投前估值，称有近 400 万客户，随后又发布领导层引述称 2025 年收入将接近 $500 million。仅按这些公开锚点，当前估值约为收入的
              2.5x，与公开体育游戏可比公司集合并未明显脱节。反向逻辑是，收入以下几乎每个重要质量变量仍然缺失。公开记录没有显示经审计 hold、产品利润率、现金、债务，或 Series C
              创造的优先股堆叠。这意味着表面估值更容易描述，而不容易验证。正确框架不是“好公司还是坏公司”，而是“好资产，但当前价格已经需要几个未经证明的假设成立”。如果 California 和 New York
              压力加剧，或预测市场转向继续迫使运营变化，一个看似合理的倍数也会快速压缩。
