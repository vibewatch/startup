    type: bar
    layout: standard
    summary: 收入倍数小幅变化，就会让公允价值围绕当前私募估值出现明显摆动。
    data:
      items:
        - label: 基于 $500M 的 1.5x
          value: 750
          detail: USD M，偏悲观倍数
          tone: negative
        - label: 基于 $500M 的 2.0x
          value: 1000
          detail: USD M，基准情景低端
          tone: warning
        - label: 基于 $500M 的 2.5x
          value: 1250
          detail: USD M，大致接近当前投前估值区间
          tone: neutral
        - label: 基于 $500M 的 3.0x
          value: 1500
          detail: USD M，乐观情景低端
          tone: positive
        - label: 基于 $500M 的 4.0x
          value: 2000
          detail: USD M，乐观情景高端
          tone: positive
