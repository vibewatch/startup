      - number: '1.3'
        title: 融资、规模里程碑与监管压力
        blocks:
          - type: paragraph
            body: >-
              Underdog 的公开资本故事在方向上很清楚，尽管部分精确总额仍不完全透明。公司披露 2022 年以 $485 million 估值完成 $35 million Series B，BlackRock 和
              Acies 加入早期投资人阵容，后者还包括 Mark Cuban 和 Kevin Durant。到 2025 年 3 月，行业与公司来源把 Series C 区间放在约 $1.2 billion 至 $1.3
              billion，由 Spark Capital 领投，Sacra 列出的累计已披露融资为 $115 million。运营层面，公司还报告 2023 年达到 100 万付费用户，目标是 2025 年收入接近
              $500 million，并从 LinkedIn 2024 年初创榜第 15 位升至 2025 年第 3 位。产品里程碑也强化了同一条规模叙事：Best Ball Mania IV 奖池为 $15
              million，应用商店页面宣传用户奖金超过 $2 billion、评论超过 181,000 条，业务如今覆盖梦幻体育竞赛、体育博彩市场准入和预测市场。关键复杂性在监管。New York
              博彩监管机构因未获许可的竞赛类型推动 2025 年 3 月和解，Legal Sports Report 称该结果让 Underdog 付出 $17.5 million。与此同时，Underdog
              更重押持牌体育博彩准入、Missouri 的 Royals 市场准入合作、16 个州的 Crypto.com 预测市场交易，以及 2026 年 3 月收购 Aristotle
              的联邦监管交易所基础设施。结果是一家公司确有规模和动能，但未来上行也紧紧绑定于牌照、监管解释和相邻受监管产品的执行。
