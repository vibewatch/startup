      - number: '5.4'
        title: 成熟度、近期扩张与主要产品技术风险
        blocks:
          - type: paragraph
            body: >-
              公开路线图信号是扩张，而不是收缩。Champions 让公司超越普通倍数选择单，进入点对点锦标赛结构；Battle Royale、Sit N Go 和 Eliminator
              文档显示竞赛格式实验仍在继续；预测市场又增加了一条受监管相邻路径，外部报道称该路径如今通过 Crypto.com 衍生品合作覆盖 16
              个州。与此同时，成熟不等于低风险。产品可用性显然按司法辖区分割，预测产品依赖外部受监管市场基础设施，New York 和 California 的法律行动也显示功能组合可能按州被移除或挑战。公开投诉还提示，当
              KYC、欺诈或自我排除控制与真实用户冲突时，客服和派奖运营可能成为痛点。更大的尽调问题不是 Underdog
              是否在发货；它显然在发。问题是外部人士仍缺少事故日志、安全认证、具名数据供应商和产品级使用组合，因此很难高精度判断韧性或模块级耐久性。
