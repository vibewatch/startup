      - number: '8.4'
        title: 破坏投资论点的触发点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              放弃投资的标准很具体。若 California 的意见演变成广泛执法，且 10% 收入敞口大方向准确，估值标记可能同时受收入和倍数挤压。若 New York 经济性不能靠永久牌照或新的获准形态重建，$17.5M
              退出成本就会证明监管摩擦会直接毁掉价值，而不只是拖慢增长。若预测市场转向持续要求收缩——North Carolina 退出和 20%
              裁员已经给出信号——投资人应把该战略视为执行风险来源，而不只是可选性。尽调议程因此需要越过笼统乐观。最有价值的问题是逐州收入和毛利桥、经审计的 hold 率和利润率数据、Series C
              的准确优先权堆栈，以及真正的流动性路线图。在这些问题摆上台面前，公司可以继续保持有趣、值得跟踪，但举证责任仍在管理层，而不是试图证明当前名义估值合理的新投资人。
