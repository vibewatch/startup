      - number: '6.3'
        title: 耐久性、投诉模式与真正的客户风险
        blocks:
          - type: paragraph
            body: >-
              耐久性是 Underdog 客户故事中最不透明的部分。保留下来的公开来源没有披露
              NRR、GRR、流失、重复存款率或队列留存，因此本章只能从不完美的代理指标推断粘性。这些代理指标方向上有用：应用商店评分基数很大，评论摘录描述了跨运动和格式的重复使用，产品组合也足够宽，可支持从 Drafts 和
              Pick'em 交叉销售到更新产品。但同一证据基础也保留了不可忽视的服务摩擦。官方帮助承诺提现通常在 48-72 小时内处理，并通过聊天和 App 内联系流程提供支持；但 Trustpilot 评论、BBB
              投诉总数、ComplaintsBoard 帖子和投诉汇编不断浮现账号冻结、派奖延迟、身份争议和响应缓慢。这并不能证明中位数客户体验糟糕，却说明只要涉及提现或账户审核，运营痛点就会显性化。由于 Underdog
              服务的是数百万消费者，而不是少数企业，经典大客户集中风险看起来较低。更尖锐的集中风险在别处：州资格、逐格式合法性、创作者社区渠道，以及围绕派奖的客户信任。如果监管者收窄准入，如果获客伙伴表现不佳，或如果提现投诉恶化，即使没有任何单个“鲸鱼”客户重要，获客和复玩也可能快速恶化。
