      - number: '7.2'
        title: 运营与消费者保护风险
        blocks:
          - type: paragraph
            body: >-
              Underdog 的运营风险异常紧密地绑定于合规工作流，因为位置检查、KYC、派奖审核和负责任博彩控制都处在客户信任的关键路径上。官方帮助内容解释了为什么这很重要：法律资格要求精确设备位置，VPN
              或位置异常可能阻止访问，政府签发 ID 和 SSN 检查可能把账户推入审核，提现流程在银行时点或额外审核叠加前就可能需要 48 到 72
              小时。这些都不能证明运营坏掉，但当资金进入或离开平台时，会制造许多失败点。外部投诉记录强化了同一批压力点。BBB 显示绝对投诉数很大，案例触及自我排除、提现、拒付、计分和账户限制；归档的 Trustpilot 与
              ComplaintsBoard 帖子也呼应派奖延迟、账号冻结和支持体验弱。与此同时，Unit21 自家案例研究确认，在自动化提升吞吐前，AML 和负责任博彩运营一度高度依赖人工，每天背负超过 1000
              个未处理警报。剩余风险不是一次灾难性宕机，而是持续运营摩擦；它会侵蚀信任、触发投诉，并让监管检查更复杂。
