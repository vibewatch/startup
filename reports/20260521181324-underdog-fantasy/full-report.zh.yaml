  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 Underdog 实际服务的用户任务
        blocks:
          - type: paragraph
            body: >-
              已取得的官方界面显示，Underdog 如今在一个体育游戏伞下服务几类相邻用户任务。核心循环仍是基于数据的 Pick'em：选择两个到八个球员预测，判断高于或低于，可选择 flex
              选择单，为报名出资，然后等待结算。但周边目录已经显著宽于单一选择单生成器。Drafts 页面确认有活跃每日选秀、Best Ball 和锦标赛格式，帮助文章记录了 Best Ball Sit N Go
              竞赛、Battle Royale 和 Eliminator 变体，把同一球迷热情转化为不同的选秀和派奖结构。Champions 保留熟悉的预测工作流，但把计分改成点对点锦标赛积分模型；Streaks
              把预测玩法变成可连续最多 11 次预测正确的递进阶梯。Predict 在同一 App
              和网站上增加了一个仍然分离的事件合约层，因此产品地图最好理解为一组体育参与格式组合，不同格式有不同监管轨道、派奖模型和成熟度，而不是一个单体 DFS 游戏。
