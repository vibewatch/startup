      - number: '6.2'
        title: 采用证明、评论证据与渠道驱动增长
        blocks:
          - type: paragraph
            body: >-
              Underdog 的公开采用证明真实存在，但比成熟上市公司客户披露更依赖代理指标。最强的官方里程碑仍是 2023 年 9 月公告：Underdog 在第三年就达到 100 万付费用户。到 2025 年 3
              月，Series C 材料描述了接近 400 万客户，独立行业报道也把同一故事四舍五入为超过 400 万美国客户。App 分发界面进一步说明这不是轻度使用产品：保留下来的 App Store 页面显示 309K
              评分，Google Play 显示 181k 评论和 4.8 评分，并称有“数百万球迷”和数十亿美元奖金。获客看起来也有合作伙伴和产品辅助，而不只是纯自然流量。公司自有伙伴 FAQ
              把功劳归于创作者和营销伙伴；Snapback Sports 续约则显示，Underdog 愿意用七位数承诺、股权绑定和明确推荐粉丝促销积分来补贴创作者分发。产品侧，Crypto.com
              关系给现有梦幻体育用户一个留在生态内的理由，也给相邻事件合约交易者一个打开 App 的理由。主要限制是证据质量：与企业软件不同，Underdog 不发布具名 logo
              部署或量化案例研究。因此，客户证明来自应用商店评论、创作者渠道证据和投诉平台，而不是打磨过的生产参考。
