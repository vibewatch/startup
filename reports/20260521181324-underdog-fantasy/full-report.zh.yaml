  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 州收入结构
        - 各州净收入和毛利，尤其是 California 和 New York
        - 情景区间取决于争议州承载的价值份额是温和还是重大
        - 管理层 CFO 包和州级运营复盘
      - - 经审计单位经济性
        - hold 率、毛利率、促销强度、CAC 回本周期、现金和债务
        - 没有这些，当前估值标记无法与上市可比公司公平比较
        - 月度管理层报告，加经审计或审阅的财务报表
      - - Series C 优先股堆叠
        - 清算优先权、参与权、员工稀释和任何附函
        - 公允的名义估值仍可能带来较弱的普通股结果
        - 完整股权结构表、瀑布分配分析和已签署融资文件
      - - 流动性路径
        - 董事会对 IPO 时点、老股交易窗口或战略退出选项的看法
        - 只有存在现实的实现路径，私营估值才有意义
        - 董事会材料、投行材料和老股出售政策
    notes: 这些问题按其直接改变建议、信心或估值立场的程度排序，而不是按一般好奇心排序。
