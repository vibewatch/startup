  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与相邻类别
        blocks:
          - type: paragraph
            body: >-
              Underdog 能直接观察到的市场边界，比泛称“体育游戏”更窄。官方界面展示了一个消费者钱包，横跨 Pick'em、Best Ball
              和选秀竞赛、梦幻体育竞赛报名，以及相邻事件合约层；但公司自身条款把梦幻体育奖励资金与 Prediction Picks
              区分开来，并把用户导向不同的法律中心。因此，当前核心市场是面向成年消费者销售的付费线上梦幻体育竞赛，而不是企业客户或传统体育博彩下注者。核心口径纳入的支出包括消费者出资的竞赛报名费、平台抽成、促销奖励消耗和相关钱包充值。核心口径排除受监管体育博彩总博彩收入、线上
              casino/iGaming 支出，以及靠广告而非报名费变现的免费赛季制办公室联赛或媒体梦幻体育产品。


              相邻市场问题仍然重要，因为产品组合越来越像隔壁市场。首页和应用商店文案强调球队选择、球员选择、Best Ball 选秀，以及跨多项运动的真金白银报名；Underdog Predict 披露则称事件合约通过
              CFTC 监管结构交易。第三方法律追踪器和 R Street 都指出，pick'em 格式处在技能型梦幻体育与 prop 风格体育博彩的断层线上。估值时，正确边界应分层处理：首先是核心 DFS
              和选秀竞赛，其次是预测市场；体育博彩或 iGaming 是替代钱包份额市场，而不是自动纳入的 TAM。
