      - number: '7.3'
        title: 依赖、市场结构与季节性风险
        blocks:
          - type: paragraph
            body: >-
              Underdog 更新的增长叙事，比单纯梦幻体育故事暗示的更依赖外部基础设施。预测市场如今架在 CFTC 相关结构之上，无论是通过 Underdog 自己收购 Aristotle，还是通过 Predict 侧的
              FCM 和交易所披露。相对纯州级博彩法，这带来监管多元化，但如果州认为这些产品是变相博彩，也会引入另一层监督和新的适格性界面。依赖风险在其他地方也可见。最快提现路径依赖特定银行卡轨道，位置门控依赖设备和反 VPN
              控制，竞赛结算依赖第三方数据提供商，后者可能迫使分数修正。公开缓释部分通过 Unit21、Sportradar 和 Birches 等供应商完成，而不是完全自研。最后，季节性仍然重要。Best Ball
              仍是一个以 NFL 为中心的大格式，头奖达到七位数；Flutter 的同业文件也准确显示体育赛程和 NFL 结果如何影响美国博彩和 DFS 经济性。Underdog 可能随时间通过 Prediction
              Picks 和相邻产品分散风险，但截至报告日期，业务仍暴露于伙伴可靠性、不断变化的法律结构，以及全年变现并不均匀的体育日历。
