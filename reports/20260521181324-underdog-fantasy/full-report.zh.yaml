  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 消费者分层、可及性与真正购买单元
        blocks:
          - type: paragraph
            body: >-
              Underdog
              的客户模型是消费者，而不是企业：在大多数可观察旅程中，买方、用户和付款人都是同一个体育迷。因此，更有用的分层维度不是公司规模或采购角色，而是玩法风格、司法辖区、充值舒适度和用户来源。公开界面把这个基础拆成几个真实队列：被小额促销拉入的休闲新客、习惯性
              Pick'em 用户、季节性选秀和 Best Ball 玩家、愿意反复充值的高频用户、通过伙伴代码进入的创作者社区粉丝，以及更新的 Prediction Picks
              交易者。可及性很广，但并不均匀。州页面和帮助中心比首页主视觉文案更有信息量，合起来显示了广泛美国覆盖加 Ontario 以外的
              Canada，同时也清楚说明产品访问会随位置变化，不可用的标签会完全消失。进入并非无摩擦：年龄规则不同，身份和定位检查必需，支付方式兼容性因产品而异，负责任博彩限额可能早在经典企业式“集中度”重要之前就约束用户。这意味着
              Underdog 可触达客户集很宽，但客户体验仍高度取决于一个人在哪里、想玩什么，以及能否顺利通过平台的开户注册和充值关卡。
