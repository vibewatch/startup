      - number: '1.2'
        title: 创始人、领导梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              已取得的证据支持一个由创始人主导、且公开面孔非常集中的故事。官方材料一直把 Jeremy Levine 标为创始人，并在 2025-2026 年称其为 CEO；更早的 2023 年材料称他为创始人兼
              co-CEO，说明公司扩张后领导头衔可能有所集中。Sacra 还列出 Brandon Stakenborg 和 Trevor John 为联合创始人，因此最有支撑的创始人组合是 Levine 加
              Stakenborg 和 John，其中 Levine 显然是公开运营负责人。这种可见度既是资产，也是风险。它解释了为什么大量里程碑公告、外部访谈和雇主品牌成果都围绕 Levine
              展开，但也意味着战略、招聘和外部可信度存在关键人依赖。不过，领导梯队已经更机构化。公司在 2025 年宣布 Rishi Garg 出任 CFO、Kimberly Pointer Corbett 出任
              CMO，2026 年又任命 Nick Lundgren 为首席法务官，同时强调自身不断增长的 CFTC
              相关预测市场栈。这些招聘正好补强一家走向成熟的私人公司需要的财务、营销和监管能力。明显偏薄的仍是治理披露：已取得的公开材料披露了高管和投资人，却没有披露董事会名单或委员会结构。私人公司这样并不罕见，但尽调仍看不清创始人控制、独立监督，以及战略决策在多大程度上集中于小范围创始团队。
