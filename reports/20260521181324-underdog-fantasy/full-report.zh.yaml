      - number: '4.4'
        title: 资本充足性与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              资本可得，但公开尽调依据仍薄。已引用的融资轮显示方向清楚：2022 年以 $485 million 估值融资 $35 million，随后在 2025 年完成 $70 million 首次交割，预计总轮次超过
              $100 million，投前估值 $1.225 billion。管理层称最新资金将投向产品和人才，公司后来又表示预计 2025 年收入接近 $500
              million。这足以判断公司并非明显受需求约束，却不足以证明资产负债表安全。本章没有任何保留的公开来源披露账面现金、月度烧钱、现金跑道、产品收入组合、实际 take
              rate、毛利率或债务额度。这个缺口重要，因为 Underdog 的经济性可能同时受到促销、税费、市场准入成本、和解，以及争议州收入集中度的冲击。相邻公开基准只能框定问题，不能解决问题：New Jersey
              显示税费和收入分成结构可能快速变化，Flutter 则显示单是税费就能让销售成本移动超过两个百分点。投资决策的瓶颈是缺失经营报表，而不是缺少公众热度。
