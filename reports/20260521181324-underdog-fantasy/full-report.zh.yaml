  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 矩阵比较 Underdog 公开客户证据在正向、混合和反向证据来源中的质量与方向。
    data:
      columns:
        - 正向运营证据
        - 混合 / 带保留的证据
        - 反向服务摩擦
      rows:
        - label: 具名具体性
          values:
            - label: 应用商店摘录很具体，但大多匿名
              tone: positive
            - label: Mike Jones 只在投诉汇编中以姓名出现
              tone: neutral
            - label: Deyountay 和 SENILE404 是公开页面上的具名投诉身份
              tone: negative
        - label: 结果清晰度
          values:
            - label: 易用、实时追踪、提现顺畅
              tone: positive
            - label: 需要更好的说明和更深的小众体育覆盖
              tone: neutral
            - label: 中奖被拦、派彩延迟、身份和欺诈争议
              tone: negative
        - label: 新鲜度
          values:
            - label: 2026 年抓取的应用商店内容
              tone: positive
            - label: 评论网站上 2024-2025 年的混合评价
              tone: neutral
            - label: 反向页面把 2024-2025 年争议保留到了 2026 年评论界面
              tone: negative
        - label: 留存可见度
          values:
            - label: 大规模评分基数暗示重复使用，但不提供队列测算
              tone: positive
            - label: 专家评测从产品广度推断忠诚度
              tone: neutral
            - label: 投诉页面显示派彩和支持环节的流失风险
              tone: negative
