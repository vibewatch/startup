      - number: '3.4'
        title: 护城河耐久度、巨头回应与品类级反向压力
        blocks:
          - type: paragraph
            body: >-
              Underdog 最重要的竞争问题，不是另一款 App 能不能复制高低选择单；这已经在发生。更深的问题是哪些同业拥有更难复制的东西。Sleeper 有社区关系图谱和联赛产品。ESPN 和 Yahoo
              有习惯、品牌和庞大免费分发。DraftKings 和 FanDuel 有法律基础设施和更宽的受监管博彩语境。PrizePicks 有最强的直接同业规模代理，再加正式 Predict
              层。相比之下，单纯的派奖倍数、注册奖励和通用 pick 机制看起来已经商品化。最大的反向信号是监管，而不是功能平价。California
              司法部长意见和相关集体诉讼一次点名多个主要运营商，说明合法性冲击可以重置整个同业集合的竞争棋盘，而不只是惩罚一家公司。因此，监管韧性和可调整产品组合比促销驱动增长更耐久。Underdog
              仍可靠执行和品牌获胜，但其护城河是有条件的，不是结构性的。
