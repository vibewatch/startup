      - number: '7.4'
        title: 缓释、执行风险与终止标准
        blocks:
          - type: paragraph
            body: >-
              正面情景是，Underdog 并没有忽视风险。公开可见的控制包括负责任博彩限额、基于年龄的默认设置、州级上限、求助热线，以及用于检测和照护的更新伙伴工具。Unit21
              案例研究也说明，公司可以在不只是堆人头的情况下显著提升合规吞吐。但执行负担仍高，因为模式正在变化，公司也处在法律和监管审查下。SportsPro 2026 年 3 月报道称，Underdog
              在预测市场转向期间退出 North Carolina
              体育博彩运营，并裁掉约五分之一员工，这是战略底盘仍在变化的最清晰信号。因此，投资人应使用具体触发器检验缓释质量，而不是接受口号。如果争议州移除重要产品，如果投诉和派奖摩擦在所有公开工具上线后仍居高不下，如果合规自动化无法控制误报和积压，或如果预测市场基础设施从多元化来源变成法律拖累，投资逻辑就会破裂。正确的尽调姿态，是承认公开缓释真实存在但并不完整，并在给运营成熟度充分信用前坚持看到内部
              KPI 证据。
