      - number: '3.3'
        title: 包装、定价定位与多平台使用摩擦
        blocks:
          - type: paragraph
            body: >-
              对一个促销很重的品类来说，公开定价证据意外地浅。运营商披露消费者钩子——报名最低额、奖励积分、充值匹配、免费资金和派奖倍数——远比披露标准化抽水率清楚。DraftKings 称 Pick6 报名可从 $1
              起。PrizePicks 主推 Play $5/Get $50 式新人促销，并宣传最高 2000x 奖金。Dabble 提供免费注册资金，甚至使用更高的派奖表述；Sleeper 则为球员 picks
              提供免费报名和充值匹配话术。FanDuel、Yahoo 和 ESPN
              用不同方式解决问题，把消费者锚定在免费或接近订阅的梦幻体育体验里。竞争含义是切换成本低。一个球迷可以用小额本金试用几个产品，把免费赛季制联赛留在别处，再把付费玩法转到当周促销最好、UX 最顺，或州覆盖最宽松的
              App。仅靠高低选择机制，很难声称有耐久护城河。
