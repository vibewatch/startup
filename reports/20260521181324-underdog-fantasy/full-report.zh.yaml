      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Underdog 的真实市场比多数梦幻体育 TAM 幻灯片更窄
            body: >-
              宽口径梦幻体育市场材料描绘的是一个以数百亿美元计的品类，但与 Underdog 最相关的公开 DFS 专项口径要小得多。投资人应把宽口径梦幻体育参与、狭义付费 DFS
              收入，以及更大的体育博彩或预测市场相邻池分开看，而不是合并成一个头部 TAM 数字。
