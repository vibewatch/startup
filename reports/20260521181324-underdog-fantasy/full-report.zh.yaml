chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、总部与平台模式
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy
              是一家后期私人体育游戏公司，对外首先像消费产品品牌，其次才是受监管运营商。其实时首页把付费梦幻体育竞赛、球队选择、独赢盘、让分、总分和预测市场产品放在同一入口，这让公司的一句话定位比许多同类更清楚：它在为美国球迷打造真金白银的体育参与产品，而不是单纯媒体网络或单一玩法的梦幻体育
              App。公司的法律中心和商号登记都指向 New York 州 Brooklyn 的 150 Waterbury Street，招聘页面又同时称 Underdog
              远程优先。这种组合说明，公司有传统法律总部，也采用分布式运营模式。官方新闻稿反复使用同一句使命表述——打造让体育对球迷更好玩的新产品——这与平台今天展示的内容一致。截至本次报告日期，首页称 Underdog 覆盖
              49 个州、Washington, DC，以及 Ontario 以外的 Canada；当前产品界面混合了梦幻体育、类体育博彩入口和预测市场产品。后续章节需要重视这种宽度：Underdog 不再只是狭义 DFS
              垂类产品，而是一个更宽的体育游戏平台，身份横跨梦幻体育、类投注体验和受监管交易所基础设施。
