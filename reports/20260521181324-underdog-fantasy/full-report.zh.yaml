  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 截至运行日期，Underdog 主要公开风险的可能性—影响视图。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 极高影响
      rows:
        - label: 高可能性
          values:
            - —
            - 支付 / 支持摩擦
            - 预测市场依赖
            - 州市场准入 / 合法性
        - label: 中等可能性
          values:
            - —
            - 统计供应商计分错误
            - 合规能力跟不上
            - 监管执法升级
        - label: 低可能性
          values:
            - —
            - 仲裁流程失效
            - 集体诉讼赔偿
            - 联邦—州产品冲突迫使产品重做
    approximationNotes: 可能性和影响评级是由所引公开证据推导的分析判断，不是公司发布的风险评分。
