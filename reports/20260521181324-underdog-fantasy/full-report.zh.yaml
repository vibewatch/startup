  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合、相邻市场与真正的现状替代品
        blocks:
          - type: paragraph
            body: >-
              Underdog 现在不只是和其他选择单 App 竞争。保留下来的公开页面显示三类相互重叠的竞争者：第一，PrizePicks、Sleeper Picks、Betr Picks、Dabble 和
              DraftKings Pick6 等直接或近似的高低选择类运营商；第二，FanDuel、Yahoo Fantasy 和 ESPN Fantasy 等既有每日梦幻体育与赛季制平台；第三，如今并列于
              Underdog、PrizePicks 和 Sleeper 梦幻体育旁边的新事件合约层。这很关键，因为买方是自助决策消费者，而不是企业采购团队。想要体育参与钱包的终端用户没有有意义的内部自建选项；现状替代品是
              ESPN、Yahoo 或 FanDuel 上已经存在的免费梦幻体育或 pick'em 产品。从这个意义上说，市场竞争不是一对一功能平价，而是谁拥有球迷反复回来的体育习惯。PrizePicks
              是最接近的直接重叠者，Sleeper 是最强的社交混合体，ESPN 和 Yahoo 即使变现方式不同，仍是巨大的注意力黑洞。
