      - - 预测市场栈风险
        - 联邦—州冲突或交易所准备度问题
        - CFTC 流程放慢、联邦结构变化，或州在联邦外壳下仍挑战准入
        - 下调预测市场上行价值，转向关注传统梦幻体育业务的耐久性
      - - 季节性集中
        - NFL 驱动需求不及预期
        - Best Ball 和 NFL 中心比赛在完整赛季中显示参赛量或奖池经济性走弱
        - 折减收入质量，并按低于营收叙事暗示的多元化水平看待业务
    notes: 终止标准是绑定公开风险信号的分析阈值，不是公司指引。
