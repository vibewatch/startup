      - number: '8.2'
        title: 公开可比公司三角校验
        blocks:
          - type: paragraph
            body: >-
              公开可比公司分析给出的信号是保持纪律，而不是恐慌。按 2026 年 5 月市值 / 收入做一个简单筛选，结果跨度很大：PENN 约 0.32x，Flutter 0.99x，Genius Sports
              1.97x，DraftKings 2.08x，Sportradar 2.48x，Rush Street Interactive
              5.11x。这些公司业务差异很大，不能把区间直接当成公允价值模型，但它说明市场眼下如何给相邻体育博彩资产奖励或折价。Underdog 披露的投前估值约为收入的 2.45x，高于成熟或多元化运营商，大致贴近
              Sportradar，但仍低于这组样本中估值最高的成长型可比公司。关键估值结论是：Underdog
              没有按困境运营商定价，也没有被要求兑现超高溢价倍数。因此，可比公司表支持“执行守住则公允”的判断，而不是“明显便宜”。投资人也应要求私营公司折价，补偿股权结构和利润率细节缺失；不能在公司缺少季度审计披露时，仍支付上市公司才能拿到的同等倍数。
