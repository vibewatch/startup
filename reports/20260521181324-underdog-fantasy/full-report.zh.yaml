      - number: '4.2'
        title: 公开牵引力与单位经济代理
        blocks:
          - type: paragraph
            body: >-
              本章最强的公开牵引力信号，是管理层给出的收入标尺加客户规模，而不是经审计财务报表。经 Yahoo Finance 分发的付费公司稿称，Underdog 预计 2025 年收入接近 $500
              million；2025 年 3 月 Series C 公告称公司有近 400 万客户，并已成为美国第四大下载量体育游戏 App。这些都是营收规模相关性的有意义信号，但仍来自公司披露，而不是审计。最干净的 CAC
              代理也只是定性的：Acies 称典型体育博彩获客成本超过 $500，而 Underdog 的获客成本只是其一小部分。这说明 DFS
              式产品循环可能比体育博彩优先型获客更便宜地扩张，但没有披露回本周期、流失或奖励积分消耗。相邻基准解释了为什么这些缺失细节重要。New Jersey 官方报告会拆分促销积分、点对点 win
              和收入分成，Flutter 文件则显示，即便对规模化市场领导者，税费、产品组合和促销强度也能让利润率移动数百个基点。公开可比公司是有用背景，但终究只是 Underdog 缺失自家公司单位经济的替代材料。
