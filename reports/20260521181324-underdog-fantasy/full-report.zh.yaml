  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现机制与收入质量
        blocks:
          - type: paragraph
            body: >-
              Underdog 的公开变现仍从报名费开始，而不是订阅或已披露的广告模式。官方帮助页显示，标准 Pick'em 和 Flex 报名展示的派奖倍数明确包含返还本金，因此客户支出是押向不确定派奖的前置现金，而不是
              SaaS 式费用。Flex 用更低的名义倍数换取部分命中保护，组合报名则更进一步，允许一个获胜预测仓位把收益滚入梦幻体育报名费。Drafts 和 Best Ball
              在经济上保持不同，因为它们通过独立竞赛大厅运行，有自己的退款规则、奖金阶梯和报名上限，包括 The Bullpen、Best Ball Mania VII
              等旗舰赛事。财务问题在于，公开页面解释了消费者派奖数学，却没有解释 Underdog 在派奖、rescue 补偿、退款、boost 加成和税费之后的实际抽成。New York
              规则手册清楚说明，运营商出于税务目的会追踪报名费、已支付奖金和总收入，但 Underdog 没有公布这座桥。因此，公开奖池和派奖表证明的是交易量和参与度，不是净收入或毛利的干净证据。
