      - number: '8.3'
        title: 情景逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              情景分析把建议推向“跟踪”。牛市情景下，Underdog 守住接近 $500M 的收入锚，控制 California 和 New York
              的拖累，并证明预测市场扩张是在增厚业务，而不是分散注意力；该情景可支撑类似 3.0x-4.0x 的倍数，对应估值约 $1.5B 至
              $2.0B。基准情景下，当前收入锚大体守住，但法律摩擦、缺少审计后的经济性、股权结构细节缺位，把估值压在收入的 2.0x-2.6x，约 $1.0B 至 $1.3B。熊市情景下，California 执法或 New
              York 经济性长期受扰，会把收入拿掉，并把倍数推入 1.3x-1.8x 区间，只对应 $650M 至 $900M。披露的首关投后估值约
              $1.295B，落在基准情景上沿，而不是清晰的安全边际区。因此，基于公开证据的合适答案是跟踪：中等信心、高风险、估值公允。投资人不缺 Underdog
              能增长的证据；真正需要的是更多证据，证明当前价格足以补偿仍摆在台面上的监管和披露缺口。
