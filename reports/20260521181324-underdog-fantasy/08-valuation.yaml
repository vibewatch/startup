  - - Genius Sports
    - $0.66B TTM revenue
    - $1.30B market cap
    - 1.97x
    - Sports-data and betting-infrastructure comp near Underdog’s implied multiple.
    - Infrastructure economics are not the same as consumer gaming economics.
  - - Sportradar
    - $1.55B TTM revenue
    - $3.84B market cap
    - 2.48x
    - Another sports-tech and betting infrastructure anchor close to Underdog’s mark.
    - Enterprise mix and integrity-services exposure differ from consumer DFS.
  - - Rush Street Interactive
    - $1.24B TTM revenue
    - $6.34B market cap
    - 5.11x
    - High-growth online-gaming comp shows upside when public markets reward execution.
    - RSI sits at the rich end of the screen and may reflect different market structure or momentum.
  - - PENN Entertainment
    - $7.06B TTM revenue
    - $2.23B market cap
    - 0.32x
    - Low-end mature gaming reference keeps the downside band honest.
    - Casino-heavy portfolio and low growth make it a floor comp, not a close peer.
  notes: This is a simple market-cap-to-revenue screen using retained May 2026 public data. It is intentionally conservative about complexity and should not be mistaken for a full EV or NTM comp model.
