- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - State revenue mix
    - Net revenue and gross profit by state, especially California and New York
    - Scenario ranges depend on whether contested states carry a modest or material share of value
    - Management CFO pack and state-level operating review
  - - Audited unit economics
    - Hold, gross margin, promo intensity, CAC payback, cash, and debt
    - Without these, the current mark cannot be compared fairly with public comps
    - Monthly management reporting plus audited or reviewed financial statements
  - - Series C preference stack
    - Liquidation preferences, participation rights, employee dilution, and any side letters
    - A fair headline valuation can still produce weak common-equity outcomes
    - Full cap table, waterfall analysis, and executed financing documents
  - - Liquidity path
    - Board view on IPO timing, secondary windows, or strategic exit options
    - Private valuation only matters if there is a realistic realization path
    - Board materials, banker decks, and secondary-sale policy
  notes: These asks are ranked by how directly they would change recommendation, confidence, or valuation stance rather than by general curiosity.
