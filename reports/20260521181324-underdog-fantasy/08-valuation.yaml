- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Underdog has real scale support: nearly four million customers and a public $500 million 2025 revenue marker.'
    - Audited revenue quality, hold, and margin disclosure would make the growth argument materially stronger.
  - - The disclosed valuation is not wildly above public sports-gaming comps on a simple revenue multiple.
    - A cheaper entry or a cleaner cap table would turn fair value into an attractive setup.
  - - Prediction markets could widen the addressable footprint beyond classic DFS if execution succeeds.
    - Evidence that the pivot no longer requires retrenchment would improve confidence.
  - - 'Anti-thesis: legal and disclosure gaps mean the current mark already needs several things to go right.'
    - California and New York risk reduction, plus preference-stack disclosure, are required before the anti-thesis weakens.
  notes: Rows separate company-quality support from price support; the chapter recommendation is not a generic quality score.
