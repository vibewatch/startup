- id: public-comp-triangulation
  title: Public Comp Triangulation
  body: 'The public comp work argues for discipline rather than panic. A simple May 2026 market-cap-to-revenue screen produces a wide range: about 0.32x for PENN, 0.99x for Flutter, 1.97x for Genius Sports, 2.08x for DraftKings, 2.48x for Sportradar, and 5.11x for Rush Street Interactive. That range spans very different businesses, so it is not a plug-and-play fair-value model, but it does show where the market is currently rewarding or discounting adjacent sports-gaming assets. Underdog’s disclosed pre-money mark at roughly 2.45x revenue sits above the mature or diversified operators and roughly in line with Sportradar, while still below the most richly rated growth comp in this screen. That is the key valuation insight: Underdog is not priced like a distressed operator, but it is also not being asked to clear a hyper-premium multiple. The comp table therefore supports a “fair if execution holds” view, not an “obviously cheap” one. It also means investors should insist on a private-company
    discount for missing cap-table and margin detail rather than pay the same multiple public companies earn while providing audited reporting every quarter.'
