- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - California enforcement escalates from opinion to broad market exit or de facto shutdown
    - Loss or redesign of California exposure that management linked to 10% of revenue
    - Revenue, growth, and strategic optionality all compress at once
    - Re-cut the valuation band toward the bear case and halt any buy discussion
  - - New York economics do not recover through permitted formats or permanent licensing
    - No credible path to restore value after the $17.5M exit cost
    - Settlement becomes evidence of recurring state-friction drag, not a one-off
    - Treat the current mark as fully priced at best
  - - Prediction-market pivot keeps forcing retrenchment
    - More layoffs, more product exits, or prolonged distraction after North Carolina
    - Execution confidence and strategic multiple both weaken
    - Downgrade recommendation and require internal KPI proof
  - - Public disclosure remains shallow after the latest round
    - No audited hold, margin, cap-table, or liquidity clarity before next financing decision
    - Investors cannot tell whether the headline price is economically clean
    - Do not move from track to buy
  notes: Triggers are defined as monitorable events rather than abstract risks so the recommendation can be updated quickly in a refresh run.
