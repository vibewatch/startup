  evidenceGaps:
  - type: missing-source
    severity: material
    topic: comparable-set-coverage
    missingEvidence: Direct private-peer marks, net debt adjustments, and a fuller EV or NTM-revenue bridge for fantasy and gaming comps.
    whyItMatters: The public comp table is useful but still partial, so a committee should not mistake a simple market-cap-to-revenue screen for a complete valuation framework.
    diligencePath: Request management’s current comp set, net debt bridge, and any secondary or board-mark references for private peers such as PrizePicks or Sleeper.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Exact Series C preference stack, investor rights, employee-option dilution, and any participating or cumulative preference terms.
    whyItMatters: A private-company mark can look fair on revenue yet still offer weak upside to new money if preferences or cumulative dilution absorb downside protection or exit value.
    diligencePath: Obtain the latest cap table, term sheet, SAFEs or notes, and board-approved waterfall analysis before treating the headline valuation as economically clean.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: audited-unit-economics
    missingEvidence: Audited hold, gross margin, promotional intensity, cash balance, debt, and cash-burn data by product and state.
    whyItMatters: Recommendation and confidence both depend on whether the company can defend the current mark through durable economics instead of only through growth and product momentum.
    diligencePath: Request monthly management reporting for the last 24 months covering net revenue, contribution margin, cash, cash burn, and state-by-state exposure.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: state-revenue-mix
    missingEvidence: Verified state revenue mix beyond the California 10% court statement, plus gross profit and customer counts by contested jurisdiction.
    whyItMatters: Scenario downside depends on how much of total revenue and gross profit sit in states where rules, enforcement posture, or licensing remain unstable.
    diligencePath: Ask for state-level net revenue, gross margin, and active-user concentration with explicit exposure to California, New York, and any state tied to prediction-market expansion.
    relatedQuestionRefs:
    - QV017
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: liquidity-path
    missingEvidence: Board-level liquidity plan, investor lockups, planned secondary windows, and any IPO or M&A readiness timeline.
    whyItMatters: A private valuation is only investable if there is a realistic path to realization; without one, even a seemingly fair mark can trap capital at an unattractive time horizon.
    diligencePath: Request the current liquidity roadmap, banker materials, secondary-market policy, and management’s view on IPO, strategic sale, or long-term private compounding scenarios.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
