    - $1.5B-$2.0B using roughly 3.0x-4.0x on the public $500M revenue anchor.
    - Current disclosure still leaves downside if the assumptions are wrong.
    - Possible, but it needs cleaner regulation and better economics disclosure.
  - - Base
    - Public revenue anchor broadly holds, but California and New York remain frictional and private-company disclosure stays incomplete.
    - $1.0B-$1.3B using roughly 2.0x-2.6x revenue.
    - Current first-close post-money already sits near the top of the supported range.
    - Best fit with current public evidence.
  - - Bear
    - California enforcement bites, New York economics stay impaired, or the pivot keeps forcing operational disruption.
    - $0.65B-$0.9B using roughly 1.3x-1.8x revenue.
    - Revenue loss and multiple compression stack together.
    - Meaningful downside if adverse signals worsen.
