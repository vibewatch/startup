sections:
- id: identity-and-platform
  title: Identity, headquarters, and platform model
  body: 'Underdog Fantasy is a late-stage private sports-gaming company that still presents as a consumer product brand first and a regulated operator second. Its live homepage currently bundles paid fantasy contests, team picks, moneylines, spreads, totals, and prediction-market products under one roof, which makes the company''s one-line description clearer than many category peers: it is building real-money sports engagement products for U.S. fans rather than a pure media network or a single-format fantasy app. The company''s legal center and trade-name record both point to 150 Waterbury Street in Brooklyn, New York, while the careers page simultaneously describes Underdog as remote-first. That combination suggests a conventional legal headquarters with a distributed operating model. Official messaging across press releases keeps repeating the same mission language - build new products that make sports more fun for fans - and that message is consistent with what the platform itself shows
    today. As of the run date, the homepage says Underdog is available in 49 states, Washington, DC, and Canada except Ontario, while the company''s current product surface mixes fantasy, sportsbook-access, and prediction-market offerings. This breadth matters for the rest of the report because later chapters should treat Underdog not as a narrow DFS niche product but as a broader sports-gaming platform whose identity now spans fantasy, wagering-adjacent experiences, and regulated exchange infrastructure.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
