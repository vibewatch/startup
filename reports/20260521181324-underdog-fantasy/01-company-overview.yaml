- id: capital-scale-and-regulatory-overhang
  title: Funding, scale milestones, and regulatory overhang
  body: 'Underdog''s public capital story is straightforward on direction even if some exact totals remain partially opaque. The company disclosed a $35 million Series B at a $485 million valuation in 2022, with BlackRock and Acies joining a colorful earlier investor base that included Mark Cuban and Kevin Durant. By March 2025, trade and company sources were putting the Series C round in the roughly $1.2 billion to $1.3 billion range, with Spark Capital leading and Sacra listing cumulative disclosed funding at $115 million. Operationally, the company also reported that it hit one million paid users in 2023, is targeting nearly $500 million of 2025 revenue, and climbed from LinkedIn''s No. 15 startup in 2024 to No. 3 in 2025. Product milestones reinforce the same scale narrative: Best Ball Mania IV offered a $15 million prize pool, app-store listings advertise more than $2 billion of user winnings and 181,000-plus reviews, and the business now spans fantasy contests, sportsbook market access,
    and prediction markets. The key complication is regulatory. New York''s gaming regulator forced a March 2025 settlement over unpermitted contest types, and Legal Sports Report said the outcome cost Underdog $17.5 million. At the same time, Underdog was leaning harder into licensed sportsbook access, a Royals market-access partnership in Missouri, a Crypto.com prediction-markets deal in 16 states, and a March 2026 acquisition of Aristotle''s federally regulated exchange infrastructure. The result is a company with genuine scale and momentum, but also one whose future upside is tightly linked to licensing, regulatory interpretation, and execution in adjacent regulated products.'
