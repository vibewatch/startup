chapter:
  number: 1
  title: Company Overview
  summary: 'Underdog Fantasy is a Brooklyn-headquartered, remote-first private sports-gaming company founded in 2020. Retrieved sources show it scaled from a $485M Series B in 2022 to a roughly $1.2B-$1.3B valuation in 2025, with management guiding to nearly $500M of 2025 revenue and expanding into prediction markets by 2025-2026. The main company-overview overhang is regulatory: New York forced a March 2025 settlement and product pullback, underscoring how dependent the next leg of growth is on licensing and market-access execution.'
