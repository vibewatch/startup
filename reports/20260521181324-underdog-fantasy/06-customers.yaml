  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Monthly active funded users, repeat-entry rates, cohort retention curves, and any churn or reactivation views by product format.
    whyItMatters: Without these metrics, the chapter can only infer stickiness from ratings and complaint patterns rather than measure true durability.
    diligencePath: Request internal cohort dashboards by Pick’em, Drafts, Best Ball, and Prediction Picks showing funded-user retention and repeat-deposit frequency over 3, 6, and 12 months.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: payer-mix
    missingEvidence: Breakout of registered users, verified users, funded users, active payers, and repeat payers.
    whyItMatters: A headline customer-count claim can hide large differences between curiosity, funded conversion, and recurring monetization.
    diligencePath: Ask finance and growth teams for a funnel from registrations to verified, funded, and 90-day repeat-paying users for the trailing twelve months.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-sample-tu003
    missingEvidence: A broader and more systematically sampled set of named public customer references across app stores, complaints, and creator communities.
    whyItMatters: TU003 is intentionally a sample because consumer gaming apps do not publish enterprise-style customer rosters, so the retained rows cannot prove the full distribution of positive or negative user outcomes.
    diligencePath: Pull a larger stratified sample of recent app-store, Google Play, Trustpilot, and support-escalation cases, then tag them by issue type, product, and outcome.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Customer acquisition by creator partner, referral code, paid media, organic app-store discovery, and media/content channel.
    whyItMatters: Snapback and creator evidence shows channels matter, but public sources do not reveal which channels actually scale efficiently or how concentrated acquisition is.
    diligencePath: Request growth-marketing channel mix, CAC, payback, and retention by source code or acquisition campaign, including partner-code cohorts.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: state-revenue-concentration
    missingEvidence: Revenue, active users, and complaint incidence by state and by format.
    whyItMatters: The biggest visible customer risk is regulatory and geographic concentration, but public evidence does not show how much volume sits in any one state or product.
    diligencePath: Ask for state-by-state active-user, handle, revenue, and support-ticket dashboards, then map them against format eligibility and enforcement risk.
    relatedQuestionRefs:
    - QU022
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: service-resolution-quality
    missingEvidence: Internal support SLAs, withdrawal exception rates, and complaint resolution outcomes by ticket type.
    whyItMatters: Official help describes the intended process, but external complaint pages do not show whether adverse experiences are rare exceptions or a larger operational pattern.
    diligencePath: Request support-operation dashboards covering first-response times, payout exceptions, KYC false positives, and escalation outcomes over the last four quarters.
    relatedQuestionRefs:
    - QU018
    - QU024
    relatedTableRefs:
    - TU004
