- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from Pick’em / Drafts into Prediction Picks
    - Medium — product expansion depends on regulator-tolerated event-contract access
    - Can deepen share of wallet and create a new trader cohort
    - Request attach rate, repeat usage, and net revenue by Prediction Picks entrant cohort
  - - Creator-code and community distribution (Snapback, other partners)
    - Medium — acquisition quality could be concentrated in a few high-performing creators
    - Partner fans can lower friction and accelerate signups quickly
    - Request partner-code signups, CAC, retention, and concentration by top creator
  - - State-by-state format launches
    - High — access can disappear or narrow quickly by jurisdiction
    - Geographic expansion or contraction can instantly change addressable demand
    - Map active users and revenue by state against current legal exposure
  - - Canada ex Ontario availability
    - Low — incremental geography exists but appears secondary to the U.S.
    - Adds another accessible market without requiring U.S.-state approval
    - Request Canada user, deposit, and support-ticket mix
  - - Consumer-scale base vs enterprise-logo risk
    - Low for classic top-customer concentration; higher for trust and reputation concentration
    - Millions of consumers reduce whale-customer dependency, but payout friction can still hurt repeat usage broadly
    - Request top-state, top-channel, and top-format concentration instead of enterprise-account concentration
  - - Content + media ecosystem around the app
    - Medium — engagement and acquisition may lean on media/news differentiation
    - Can improve discovery and keep users inside the ecosystem between contests
    - Break down acquisition and retention for users exposed to the news/media layer vs pure gameplay users
  notes: The main concentration issue is not one giant customer; it is dependence on states, formats, and acquisition channels that can move together.
