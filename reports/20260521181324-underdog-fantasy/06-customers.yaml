- id: durability-complaints-and-concentration-risk
  title: Durability, Complaint Patterns, and the Actual Customer Risk
  body: 'Durability is the least transparent part of Underdog’s customer story. None of the retained public sources disclose NRR, GRR, churn, repeat-deposit rate, or cohort retention, so the chapter has to infer stickiness from imperfect proxies. Those proxies are directionally useful: app-store rating bases are very large, review excerpts describe repeat usage across sports and formats, and the portfolio is broad enough to support cross-sell from Drafts and Pick’em into newer products. But the same evidence base also preserves non-trivial service friction. Official help promises withdrawals are typically processed in 48-72 hours and routes support through chat and in-app contact flows, yet Trustpilot reviews, BBB complaint totals, ComplaintsBoard posts, and complaint roundups keep surfacing blocked accounts, delayed payouts, identity disputes, and slow responses. That does not prove the median customer experience is poor, but it does show that operational pain points are visible whenever
    money is being withdrawn or an account is being reviewed. Because Underdog serves millions of consumers instead of a few enterprises, classic top-customer concentration risk appears low. The sharper concentration risk is elsewhere: state eligibility, format-by-format legality, creator-community channels, and customer trust around payouts. If regulators narrow access, if an acquisition partner underperforms, or if withdrawal complaints worsen, acquisition and repeat play could deteriorate quickly even without any single “whale” customer mattering.'
