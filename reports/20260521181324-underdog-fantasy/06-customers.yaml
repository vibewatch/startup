- id: FU003
  title: Customer proof matrix
  type: matrix
  layout: wide
  summary: Matrix comparing the quality and direction of Underdog’s public customer proof across positive, mixed, and adverse evidence sources.
  data:
    columns:
    - Positive operational proof
    - Mixed / caveated proof
    - Adverse service friction
    rows:
    - label: Named specificity
      values:
      - label: App-store excerpts are specific but mostly anonymous
        tone: positive
      - label: Mike Jones appears by name only through a complaint roundup
        tone: neutral
      - label: Deyountay and SENILE404 are named complaint identities on public pages
        tone: negative
    - label: Outcome clarity
      values:
      - label: Ease of use, live tracking, and smooth withdrawals
        tone: positive
      - label: Needs better instructions and more niche sports depth
        tone: neutral
      - label: Blocked wins, payout delays, identity and fraud disputes
        tone: negative
    - label: Freshness
      values:
      - label: 2026 fetches on app stores
        tone: positive
      - label: Mixed 2024-2025 commentary on review sites
        tone: neutral
      - label: Adverse pages preserve 2024-2025 disputes into the 2026 review surface
        tone: negative
    - label: Retention visibility
      values:
      - label: Large rating bases imply repetition but not cohort math
        tone: positive
      - label: Expert reviews infer loyalty from product breadth
        tone: neutral
      - label: Complaint pages show churn risk around payouts and support
        tone: negative
