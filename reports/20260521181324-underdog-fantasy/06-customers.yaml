figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Journey from creator or app-store discovery through signup, verification, first contest, repeat play, and cross-sell into newer products.
  data:
    nodes:
    - id: discover
      label: Discovery
      detail: User encounters Underdog through creator content, app stores, sports media, or a low-ticket promo offer.
    - id: signup
      label: Signup and funding intent
      detail: Customer creates an account, sees bonus-entry economics, and decides whether to deposit or just browse.
    - id: verify
      label: Eligibility and verification
      detail: Identity, age, and location checks determine whether the user can actually participate and which products appear.
    - id: firstplay
      label: First live contest
      detail: User enters Pick’em, Drafts, or Best Ball and begins tracking outcomes in-app.
    - id: repeat
      label: Repeat play and support
      detail: User either repeats entries, tests withdrawals, and grows trust, or hits support, payout, or rules friction.
    - id: expand
      label: Expansion or exit
      detail: Satisfied users can cross-sell into additional formats like Prediction Picks, while dissatisfied users exit to complaints or competitors.
