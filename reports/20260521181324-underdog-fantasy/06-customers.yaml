tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Promo-led new customers
    - Same individual sports fan
    - Low-ticket first funded contest via play-$5-get-$50 hook
    - Homepage new-customer offer and app-store onboarding language
    - Efficient top-of-funnel conversion if promo economics hold
    - No public conversion rate from promo signup to repeat payer
  - - Pick’em regulars
    - Same individual sports fan
    - Daily or near-daily higher/lower entries and live slip tracking
    - App-store and Google Play review excerpts emphasize simple pick’em use and multipliers
    - Likely core monetization loop because of recurring slip creation
    - No public repeat-entry frequency or average funded balance
  - - Draft / Best Ball users
    - Same individual sports fan
    - Season-long and recurring draft contests with less day-to-day management
    - Google Play listing and review sites emphasize Best Ball and draft breadth
    - High-engagement cohort that can anchor repeat seasonal activity
    - No public split between draft-centric and Pick’em-centric revenue
  - - Prediction Picks traders
    - Same individual sports fan / trader
    - Event contracts across major leagues inside the broader Underdog app
    - Yahoo and official eligibility docs show a separate state footprint and cash-out rules
    - Expands TAM beyond classic DFS and creates cross-sell potential
    - No public attach rate, conversion, or revenue mix for Prediction Picks
  - - Creator / partner referrals
    - Same individual sports fan referred by a creator
    - Sign up through partner code or community promotion
    - Partner FAQ plus Snapback promo-credit evidence
    - Potentially important CAC lever and community-driven acquisition motion
    - No public channel-mix or CAC/payback data by creator code
  - - Canada ex Ontario users
    - Same individual sports fan
    - DFS access where allowed outside the U.S.
    - Dedicated states page explicitly includes Canadian provinces except Ontario
    - Incremental geography beyond the U.S. core
    - No public customer count or revenue split for Canada
  notes: Segmentation is behavioral and jurisdictional because Underdog is a consumer app, not an enterprise vendor with disclosed account tiers.
