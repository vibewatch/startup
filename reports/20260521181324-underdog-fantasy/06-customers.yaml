- id: TU006
  title: Customer accessibility / onboarding friction table
  columns:
  - Step
  - Official rule or tool
  - Customer benefit
  - Friction introduced
  - Source lens
  rows:
  - - Sign-up incentive
    - Play $5, get $50 bonus-entry offer
    - Low-cost trial for new customers
    - Bonus must be played through; offer availability varies
    - Homepage + review-site bonus coverage
  - - Identity verification
    - All customers must verify identity
    - Protects eligibility and account integrity
    - False positives or mismatches can block access and withdrawals
    - Account FAQ + complaint sources
  - - Location services
    - Users must enable location and only see eligible modes
    - Reduces accidental rule violations by state
    - Travel can remove product tabs or cash-out access
    - Eligibility help articles
  - - Funding account
    - Cards, bank rails, PayPal, Apple Pay, Google Pay, Venmo
    - Multiple familiar deposit paths
    - Some methods do not work for Prediction Picks and billing mismatches can fail
    - Deposit methods FAQ
  - - Withdrawal
    - Typical 48-72 hour processing plus fraud/security review
    - Predictable stated SLA for normal cases
    - Complaint sources describe delays and blocked accounts when reviews escalate
    - Withdrawal FAQ + Trustpilot / BBB / ComplaintsBoard
  - - Responsible-gaming limits
    - Deposit, spending, and contest-entry limits with waiting periods
    - Can protect at-risk customers and satisfy regulations
    - Can frustrate higher-value users and limit rapid reactivation
    - Limits help articles
  notes: This table focuses on the customer-facing operational journey rather than economics already covered in Financials.
