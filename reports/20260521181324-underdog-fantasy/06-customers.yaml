- id: TU003
  title: Named customer proof table
  columns:
  - Customer / public reviewer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Anonymous App Store reviewer switching from PrizePicks
    - Active Pick’em user / competitor switcher
    - Uses live slip tracking and multipliers for NFL and NBA entries
    - Production — live paying account
    - Says layout is preferred to PrizePicks and withdrawal process was smooth
    - Reviewer is anonymous and likely self-selected positive feedback
  - - Anonymous App Store reviewer using Streaks since 2024
    - Repeat consumer user
    - Cross-sport use with Streaks and standard fantasy play
    - Production — recurring live use
    - Says the app increases game excitement and that withdrawals have not been a problem
    - Anonymous and not externally verified
  - - Mike Jones (Google Play reviewer cited by Gambling911)
    - Casual draft / fantasy user
    - Google Play review discussing basic gameplay and draft instructions
    - Production — live account user
    - Calls the app easy to play but asks for clearer draft and injury-replacement instructions
    - Evidence is second-hand because the retained citation is a review roundup
  - - Deyountay (Trustpilot reviewer cited directly and by Gambling911)
    - Adverse high-friction winner / withdrawal claimant
    - Won on the app and sought support after account block
    - Production — live paying user
    - Says winnings were blocked and support responses took 30 business days
    - Complaint is one-sided and not adjudicated by a regulator
  - - SENILE404 (ComplaintsBoard complainant)
    - Identity / account-access dispute case
    - Reported unauthorized-account and withdrawal-access issues
    - Production — live account in dispute
    - Provides a concrete example of identity-linked access friction
    - Complaint forum quality is low and the operator response is not fully preserved
  notes: This enumeration is a representative sample of public consumer proof and complaint evidence, not an exhaustive list of Underdog users.
