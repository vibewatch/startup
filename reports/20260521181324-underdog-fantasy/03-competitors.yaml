- id: TP001
  title: Competitor profile table
  columns:
  - Platform
  - Category
  - Scale / public proof proxy
  - Target user
  - Strategic difference vs. Underdog
  - Main limitation
  rows:
  - - Underdog
    - Reference company / direct operator
    - 203K homepage review signal; 49-state + D.C. + Canada claim
    - Paid fantasy and prediction-curious sports fans
    - Blends pick'em, season-long fantasy, and Underdog Predict on one surface
    - Public scale proof is smaller than ESPN/Yahoo and less explicit than PrizePicks
  - - PrizePicks
    - Closest direct peer
    - 20M claimed players; ~463K App Store ratings
    - Mass-market sports-picks users across player, team, and culture picks
    - Most similar current product shape; strong direct scale proxy
    - Differentiation is narrowing as more peers add event-contract layers
  - - Sleeper
    - Direct / adjacent hybrid
    - 10M users in Business Wire release; ~249K App Store ratings
    - Fans who want picks, leagues, chat, and sports-feed utility in one app
    - Strongest social and league graph among direct peers
    - Still smaller public ratings base than Yahoo/ESPN and less pure scale than incumbents
  - - DraftKings Pick6
    - Direct incumbent extension
    - ~36K App Store ratings; DraftKings brand trust
    - Users who want low-minimum slips inside the DraftKings ecosystem
    - Low entry floor and strong mainstream brand
    - State availability remains constrained and product is narrower than full DraftKings sportsbook context
  - - FanDuel Fantasy
    - Incumbent DFS substitute
    - Large legacy brand; nationwide fantasy footprint but no retained app proxy
    - Lineup, contest, and league players who may also sample free prediction games
    - Deep DFS familiarity and legal/governance posture
    - Public fantasy surface is more contest-centric than slip-centric
  - - Yahoo Fantasy
    - Free/freemium incumbent substitute
    - ~862K App Store ratings
    - Free season-long, DFS, and pick’em users
    - Huge installed base with subscription upsell instead of entry-led monetization
    - Less direct overlap with real-money more/less slips
  - - ESPN Fantasy
    - Free incumbent substitute
    - ~1.9M App Store ratings
    - Mainstream fans who want free fantasy and prediction games
    - Largest public mobile-distribution proxy in this set
    - Free-to-play orientation means lower direct monetization overlap
  - - Betr Picks
    - Direct niche challenger
    - Own-site launch and state claims; no verified app proxy retained
    - Fans attracted to live entries, pick protection, and media personality brand
    - Live entries and simplified more/less framing
    - Public scale evidence is thinner than the leading direct peers
  - - Dabble
    - Direct social DFS challenger
    - 3M global users claimed; ~35K App Store ratings
    - Fans who want social copying and banter alongside picks
    - Most explicit social-DFS positioning among direct challengers
    - Smaller public reach proxy than PrizePicks or Sleeper
  notes: Rows mix app-store ratings, company-claimed users, and website review signals because no single public comparable
    source covers the entire peer set. Scale should be read as proxy, not audited MAU.
