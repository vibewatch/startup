  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: A comparable public rake or operator take-rate schedule for Underdog, PrizePicks, DraftKings Pick6, Sleeper,
      Betr, and Dabble across the same contest types and states.
    whyItMatters: Without an apples-to-apples rake disclosure, pricing competition has to be inferred from promos, minimum
      entry amounts, and payout marketing rather than from the true economics of each entry.
    diligencePath: Request current fee schedules or state-by-state prize-structure documentation from operators, then normalize
      by contest type and jurisdiction.
    relatedQuestionRefs:
    - QP018
  - type: access-blocked
    severity: material
    topic: traffic-proxies
    missingEvidence: Consistent third-party traffic or MAU data for Underdog, PrizePicks, Sleeper, DraftKings Pick6, Betr,
      and Dabble beyond app-store rating counts and company-claimed user totals.
    whyItMatters: The competitive-read on distribution strength would be sharper with one consistent web or app-analytics
      source rather than a mix of ratings counts and company claims.
    diligencePath: Pull a paid Similarweb, Sensor Tower, data.ai, or Apptopia export for monthly active users, downloads,
      and session depth across the peer set.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: minor
    topic: betr-scale
    missingEvidence: A verified current App Store or third-party mobile rating/download page for Betr Picks that matches the
      evidence quality available for PrizePicks, Sleeper, Yahoo, ESPN, and Dabble.
    whyItMatters: Betr's relative distribution ranking is directionally inferable from its own site, but a cleaner mobile
      proxy would improve precision in the scale table and positioning map.
    diligencePath: Locate a live iOS or Android store page for Betr Picks or obtain third-party app-intelligence data for
      ratings, installs, and update cadence.
    relatedQuestionRefs:
    - QP025
  - type: stale
    severity: material
    topic: regulatory-risk
    missingEvidence: A state-by-state 2026 enforcement tracker showing which California DFS defendants changed operations,
      complied, or settled after the 2025 opinion and class-action wave.
    whyItMatters: The chapter can show that risk is industry-wide, but it cannot yet quantify which operators will absorb
      the biggest near-term commercial damage from enforcement sequencing.
    diligencePath: Refresh California court dockets, state regulator notices, and operator legal centers before the next report
      cycle.
    relatedQuestionRefs:
    - QP022
    - QP023
