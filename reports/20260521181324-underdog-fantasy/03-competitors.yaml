company:
  name: Underdog Fantasy
chapter:
  number: 3
  title: Competitors
  summary: 'Underdog competes across three overlapping fronts: direct pick-slip apps led by PrizePicks and Sleeper, incumbent
    fantasy substitutes led by ESPN, Yahoo, FanDuel, and DraftKings, and a converging event-contract layer that now touches
    Underdog, PrizePicks, and Sleeper. The strongest public scale proxies sit with the free incumbents, the closest direct
    product overlap sits with PrizePicks and Sleeper, and the hardest category-wide risk is regulatory rather than purely
    feature-based.'
sections:
- id: competitive-set-and-substitutes
  title: Competitive Set, Adjacencies, and the Real Status-Quo Substitute
  body: 'Underdog is not just competing with other pick-slip apps anymore. The retained public pages show three overlapping
    competitor classes: first, direct more-or-less operators such as PrizePicks, Sleeper Picks, Betr Picks, Dabble, and DraftKings
    Pick6; second, incumbent daily fantasy and season-long platforms such as FanDuel, Yahoo Fantasy, and ESPN Fantasy; and
    third, the newer event-contract layer now sitting beside fantasy on Underdog, PrizePicks, and Sleeper. That matters because
    the buyer is a self-directed consumer, not an enterprise procurement team. There is no meaningful internal-build option
    for an end user who wants a sports-engagement wallet; the status quo is a free fantasy or pick’em substitute that already
    lives on ESPN, Yahoo, or FanDuel. In that sense, the market is less about one-to-one feature parity and more about who
    owns the fan’s recurring sports habit. PrizePicks is the closest direct overlap, Sleeper is the strongest social hybrid,
    and ESPN and Yahoo remain large attention sinks even when they monetize differently.'
