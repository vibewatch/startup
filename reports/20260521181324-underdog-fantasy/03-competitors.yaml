- id: packaging-pricing-and-multi-homing
  title: Packaging, Pricing Positioning, and Multi-Homing Friction
  body: Public pricing evidence is surprisingly shallow for such a promotional category. Operators disclose the consumer hook—entry
    minimums, bonus credits, deposit matches, free funds, and payout multipliers—far more clearly than they disclose standardized
    rake. DraftKings says Pick6 entries can start at $1. PrizePicks pushes a Play $5/Get $50 style onboarding promotion and
    advertises up to 2000x winnings. Dabble offers free signup funds and even larger payout language, while Sleeper gives
    free entry and deposit-match language for players picks. FanDuel, Yahoo, and ESPN attack the problem differently by keeping
    the consumer anchored in free or subscription-adjacent fantasy experiences. The competitive implication is that switching
    costs are low. A fan can sample several products with modest capital, keep free season-long leagues elsewhere, and move
    paid action to whichever app has the best promo, cleanest UX, or most permissive state footprint that week. That weakens
    any claim that more-or-less mechanics alone are a durable moat.
