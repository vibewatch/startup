- id: TP004
  title: Pricing and packaging comparison
  columns:
  - Platform
  - Public price / promo signal
  - Contest or entry model
  - Public payout positioning
  - What it implies
  rows:
  - - Underdog
    - Play $5 Get $50 bonus entries on homepage
    - Entry-led pick’em and fantasy contests
    - Large cash payouts; no single public rake table retained
    - Acquisition is promo-forward rather than fee-transparent
  - - PrizePicks
    - Play $5 Get $50 instantly in lineups
    - Pick 2-6 players, plus team and culture picks
    - Up to 2000x
    - Aggressive promo and multiplier messaging lowers trial friction
  - - Sleeper
    - Free players entry + up to $100 deposit match
    - Player picks plus team picks and free fantasy leagues
    - Up to 1000x
    - Strong onboarding package plus social retention loop
  - - DraftKings Pick6
    - As little as $1 entry fee
    - 2+ picks into peer contests
    - Minimum guaranteed cash multiplier plus extra prizing
    - Low minimum makes casual multi-homing easy
  - - FanDuel Fantasy
    - No standardized public rake retained; mostly contest rules and free-play framing
    - Salary-cap contests, leagues, and free prediction games
    - Win money in green zone / contest prizes
    - Packaging is contest-centric and less comparable to slip apps
  - - Yahoo Fantasy
    - Free core app plus Fantasy Plus subscription tiers
    - Season-long fantasy, DFS, pick’em, bracket games
    - Prizes in DFS; subscription value in tools
    - Competes with free habit and optional premium analytics, not only entry economics
  - - ESPN Fantasy
    - Free app with optional ESPN+ purchases
    - Season-long fantasy and prediction games
    - No real-money multiplier messaging retained
    - Very low switching friction because core use is free
  - - Betr Picks
    - $10 registration bonus in retained site copy
    - 3+ picks minimum with live entries
    - Up to 1000x with pick protection
    - Product sells excitement and live play more than transparent fees
  - - Dabble
    - $10 free on signup, no deposit necessary
    - More/less DFS entries plus copy-entry and chat
    - Up to 5000x
    - Very high upside marketing and social hooks target experimentation
  notes: Most operators disclose promos, entry minimums, and payout multiples more clearly than take rates. This table compares
