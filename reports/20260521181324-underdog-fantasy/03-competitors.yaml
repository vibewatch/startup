- id: TP005
  title: Moat durability and competitive risk register
  columns:
  - Claimed moat or edge
  - Primary threat
  - Severity
  - Why it can erode
  - Mitigation / diligence ask
  rows:
  - - Underdog's blended fantasy + predict stack
    - PrizePicks and Sleeper are adding comparable event-contract layers
    - High
    - Category structure is converging around the same expanded job to be done
    - Track separate attach rates for fantasy-only vs predict users to prove a unique cross-sell advantage
  - - Incumbent-free fantasy habit is weak substitute pressure
    - ESPN and Yahoo already own larger free mobile audiences
    - High
    - Fans can keep free leagues elsewhere and only move paid slips opportunistically
    - Measure paid conversion from free-content channels and compare with incumbent referral leakage
  - - Slip mechanics and payout marketing are defensible
    - Betr, Dabble, DraftKings Pick6, and PrizePicks all market similar more/less play with bonuses
    - High
    - Promos and multipliers are fast to copy and do not create durable lock-in
    - Request cohort retention by bonus-vs-organic user and by core game mode
  - - Regulatory hits are company-specific
    - California opinion and follow-on lawsuits targeted several leaders at once
    - Critical
    - An enforcement shock can reorder the entire peer set, not just Underdog
    - Maintain a state-by-state contingency view and quantify revenue exposure to contested jurisdictions
  - - Brand and trust are equal across peers
    - DraftKings/FanDuel have incumbent legal and consumer-recognition advantages; Sleeper/Yahoo/ESPN have different habit
      moats
    - Medium-High
    - Underdog may still be a challenger brand outside its strongest fan cohorts
    - Ask for aided and unaided brand data by state and by product type before underwriting a durable moat
  notes: This register intentionally mixes feature, distribution, and regulatory threats because those are the real durability
    variables in consumer fantasy. Severity reflects competitive underwriting impact, not only legal severity.
