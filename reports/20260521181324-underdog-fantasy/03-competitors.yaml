- id: moat-durability-and-adverse-pressure
  title: Moat Durability, Incumbent Response, and Category-Level Adverse Pressure
  body: Underdog’s most important competitive question is not whether another app can copy a more-or-less slip; that is already
    happening. The deeper issue is which peers own something harder to replicate. Sleeper has a community graph and league
    product. ESPN and Yahoo have habit, brand, and enormous free distribution. DraftKings and FanDuel have legal infrastructure
    and a broader regulated-gaming context. PrizePicks has the strongest direct peer scale proxy plus a formal Predict layer.
    By contrast, pure payout multipliers, signup bonuses, and generic pick mechanics look commoditized. The biggest adverse
    signal is regulatory, not feature parity. California’s attorney general opinion and the related class actions named multiple
    major operators at once, showing that a legality shock can reset the competitive board for an entire peer set rather than
    merely punish one company. That makes regulatory resilience and adaptable product mix more durable than promo-led growth.
    Underdog can still win on execution and brand, but its moat is conditional, not structural.
