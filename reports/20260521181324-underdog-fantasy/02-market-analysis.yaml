- id: market-sizing-and-contradictions
  title: 'Market Sizing: Broad Fantasy TAM vs. Narrower DFS Reality'
  body: 'Public market sizing for “fantasy sports” is highly elastic because publishers blend different geographies, monetization models, and contest types. Grand View puts the global fantasy market at $24.85 billion in 2024 and $56.38 billion by 2030, while Mordor starts from a higher $42.37 billion in 2026 and projects $80.31 billion by 2031. A second set of lenses narrows the frame: Worldmetrics reports $24 billion of total fantasy revenue in 2023, but only $1.2 billion of U.S. DFS revenue and 24 million active U.S. DFS users in 2023, with a global DFS base of roughly $1.1 billion in 2021 growing at 13.4% CAGR through 2030. Mordor also says daily fantasy formats represented 55.74% of fantasy-market revenue in 2025, implying that Underdog''s addressable core is meaningfully smaller than broad fantasy TAM decks suggest.


    Adjacent markets are much larger. AGA says U.S. commercial sports betting revenue reached $16.89 billion in 2025 and iGaming hit $10.73 billion. Mordor values the U.S. online gambling market at $6.89 billion in 2026 and the global online sports betting market at $49.74 billion, while Coherent is even higher at $59.46 billion. The practical conclusion is not that Underdog can claim all of those pools; it is that the company''s fantasy core is relatively small, but adjacency into prediction markets and sportsbook-like behavior expands the ceiling. Public data still cannot isolate Underdog''s SAM or SOM by state, format, or retention cohort.'
