company:
  name: Underdog Fantasy
chapter:
  number: 2
  title: Market Analysis
  summary: 'Underdog Fantasy''s observable core market is paid online fantasy sports contests sold to self-funded adult sports fans—mainly Pick''em, Best Ball, and draft formats—but the company now distributes an adjacent prediction-market layer that pushes it toward the much larger sports-betting opportunity set. Public market estimates vary sharply: broad fantasy sports runs from $24.85 billion in 2024 (Grand View) to $42.37 billion in 2026 (Mordor), while narrower public DFS evidence is closer to $1.2 billion of U.S. revenue and 24 million active U.S. users in 2023. The main gating issue is regulatory fragmentation: pick''em and other short-form fantasy products still face state-by-state scrutiny even as federal event-contract structures create a larger, but politically contested, expansion path.'
sections:
- id: market-boundary-and-adjacencies
  title: Market Boundary, Included Spend, and Adjacent Categories
  body: 'Underdog''s directly observable market boundary is narrower than generic “sports gaming.” Official surfaces show one consumer wallet spanning Pick''em, Best Ball and draft contests, fantasy contest entries, and an adjacent event-contract layer, but the company''s own terms distinguish fantasy bonus funds from prediction picks and direct users to separate legal centers. That makes the current core market paid online fantasy sports contests sold to adult consumers rather than enterprise customers or traditional sportsbook bettors. Spend included in the core lens is consumer-funded contest entry fees, platform take, promotional bonus burn, and related wallet funding. Excluded from the core lens are regulated sportsbook gross gaming revenue, online casino/iGaming spend, and free season-long office pools or media fantasy products that monetize through advertising rather than entry fees.


    The adjacency question still matters because the product set increasingly resembles next-door markets. Homepage and app-store copy emphasize team picks, player picks, Best Ball drafts, and real-money entries across many sports, while Underdog Predict disclosures say event contracts trade through a CFTC-regulated structure. Third-party legal trackers and R Street both highlight that pick''em formats sit on the fault line between skill-based fantasy and prop-style sports betting. For valuation purposes, the right boundary is therefore layered: core DFS and draft contests first, prediction markets second, and sportsbook or iGaming as substitute wallet-share markets rather than automatic TAM.'
