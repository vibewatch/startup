- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'Underdog''s buyer, user, and payer are usually the same person: an adult sports fan funding entries from a personal entertainment budget. Official app-store copy emphasizes simple self-serve payments—Apple Pay, cards, PayPal, and bank deposit—and product design built around quick mobile decisions rather than committee buying or annual contracts. Within that consumer base, at least four behaviorally distinct segments appear. Best Ball and draft users value low-maintenance season-long engagement; Pick''em users prefer fast, stat-based entries with frequent refresh; more committed DFS users skew toward multi-sport, high-frequency play; and prediction-market users are closer to traders attracted by spreads, totals, moneylines, and contract combinations. Flutter''s FanDuel disclosures imply there is also a fifth adjacent segment: “entertainment-first” users in states without legal online sportsbooks who may enter through prediction products before they ever become sportsbook customers.


    The adoption path is mobile discovery to eligibility and geolocation check, then wallet funding, first contest entry, and repeat play or product crossover. The budget owner does not change across those stages, but the trigger does. Draft and Best Ball products appeal to season-long fandom; Pick''em lowers cognitive load and session time; prediction markets appeal to novelty, legal availability, and parity with sportsbook-like outcomes in blocked states. What remains opaque is mix: public sources do not disclose what share of Underdog''s paying base sits in each segment or how much each segment monetizes.'
