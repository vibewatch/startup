callouts:
- calloutType: insight
  title: Underdog's real market is narrower than most fantasy TAM slides
  body: Broad fantasy-market decks describe a category measured in tens of billions of dollars, but the public DFS-specific lens most relevant to Underdog is much smaller. Investors should separate broad fantasy participation, narrow paid DFS revenue, and still-larger sportsbook or prediction-market adjacencies rather than roll them into one headline TAM.
  claimRefs:
  - CM008
  - CM009
  - CM012
  - CM014
  - CM019
- calloutType: risk
  title: Regulatory arbitrage is a growth lever and a fragility point
  body: Prediction markets expand reach into states where sportsbooks are blocked, but that same federal-versus-state structure is now politically contested. If regulators or courts narrow the availability of sports event contracts, Underdog could lose the adjacency that currently makes its market ceiling look much larger than DFS alone.
  claimRefs:
  - CM023
  - CM025
  - CM026
  - CM027
  - CM036
  - CM039
