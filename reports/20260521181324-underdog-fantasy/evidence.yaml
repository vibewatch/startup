evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: A current 2026 employee count from the company, LinkedIn, or another independently refreshed directory.
    whyItMatters: Headcount is a core scale metric for later cost-structure, hiring-efficiency, and operating-leverage analysis.
    diligencePath: >-
      Request a current org-size disclosure from management or refresh a live company profile that exposes employee
      count.
    relatedQuestionRefs:
      - QO005
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
