- id: mitigations-execution-and-kill-criteria
  title: Mitigations, Execution Risk, and Kill Criteria
  body: The positive case is that Underdog is not ignoring risk. Publicly visible controls include responsible-gaming limits, age-based defaults, state-specific caps, helplines, and newer partner tooling for detection and care. Unit21’s case study also suggests the company can materially improve compliance throughput without simply throwing headcount at the problem. But the execution burden remains high because the model is changing while the company is under legal and regulatory scrutiny. SportsPro’s March 2026 reporting that Underdog exited its North Carolina sportsbook operation and cut roughly one-fifth of staff during the prediction-market pivot is the clearest sign that strategy is still moving underneath the organization. That means investors should underwrite mitigation quality with concrete triggers, not slogans. The thesis breaks if contested states remove important products, if complaint and payout friction remain elevated after all the public tooling, if compliance automation
    cannot keep false positives and backlog under control, or if prediction-market infrastructure becomes a source of legal drag rather than diversification. The right diligence posture is therefore to treat public mitigations as real but incomplete, and to insist on internal KPI evidence before giving full credit for operational maturity.
