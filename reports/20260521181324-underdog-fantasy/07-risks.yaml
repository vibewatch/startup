  evidenceGaps:
  - type: missing-source
    severity: material
    topic: state-enforcement-records
    missingEvidence: Primary copies of every state notice, settlement exhibit, or suitability letter touching Underdog or adjacent pick’em operators beyond the New York and California materials already retained.
    whyItMatters: Market-access risk is the top residual risk, and second-order state actions can change availability faster than the company’s own state map updates.
    diligencePath: Pull regulator dockets or public-records responses from Arizona, Florida, Maryland, New Jersey, Ohio, and other contested states before underwriting forward market-access assumptions.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: vendor-concentration
    missingEvidence: Named payment processors, geolocation providers, fraud vendors, and official statistics suppliers together with concentration, SLAs, and outage history.
    whyItMatters: The public record shows real dependence on payment rails, location controls, compliance tooling, and stats feeds, but not whether any single vendor is a single point of failure.
    diligencePath: Request the top-vendor schedule, contract renewal dates, SLA reports, and incident logs for payments, location, stats, AML, and responsible-gaming tooling.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: customer-trust-metrics
    missingEvidence: Internal metrics for withdrawal turnaround, support backlog, verification review times, complaint escalation rates, and complaint volume normalized to active users.
    whyItMatters: Public complaint platforms are adverse but noisy, so investors still need denominator data before deciding whether trust friction is a manageable tail or a systemic drag.
    diligencePath: Ask management for monthly payout SLA dashboards, support queue aging, fraud false-positive rates, and regulator complaint logs by state and product.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: product-mix-seasonality
    missingEvidence: Revenue and contribution margin split by Drafts, Pick’em, Prediction Picks, sportsbook, and non-NFL months, plus retention by format.
    whyItMatters: Seasonality and model-shift risk depend on how much gross profit still comes from NFL-centered fantasy contests versus newer prediction-market activity.
    diligencePath: Request monthly gross revenue, net revenue, hold, and active-user cohorts by product and sport for the last 24 months, segmented around NFL seasonality.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: compliance-capacity
    missingEvidence: Headcount, exam findings, SAR volumes, and quality-review error rates for AML, fraud, responsible gaming, and customer-ops teams.
    whyItMatters: The Unit21 case study proves the function is scaling, but not whether staffing and control quality are strong enough for a larger prediction-market footprint.
    diligencePath: Review org charts, attrition by function, exam reports, and monthly KPI packs for AML, RG, payments, and support operations.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
