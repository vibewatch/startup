chapter:
  number: 7
  title: Risks
  summary: 'Underdog Fantasy’s dominant risk is regulatory patchwork: New York has already forced product pullback, California’s attorney general says both draft-style and pick’em DFS are illegal, and federal prediction-market optionality adds another compliance stack rather than replacing state exposure. Operationally, the sharpest recurring pain points are verification, withdrawals, and complaint-handling, while partner dependence on CFTC-linked infrastructure, payment rails, location controls, and scoring vendors creates additional failure points. Public mitigations exist and are improving, but the underwriting question is whether they are strong enough to offset market-access shocks, customer-trust friction, and NFL-centered seasonality.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: 'Regulatory patchwork is the central underwriting issue for Underdog because state market access can change faster than product demand. The clearest negative evidence is already on the record. New York settled with Underdog in March 2025 over allegedly unpermitted contests, and the company said it would stop offering certain contest types in the state unless they were permitted. California then raised the bar further: the attorney general’s July 2025 opinion said daily fantasy sports with players physically located in California are prohibited under Penal Code section 337a regardless of where the operator or technology sits, explicitly covering both draft-style and pick’em formats. Arizona’s 2025 cease-and-desist language, while not Underdog-specific, shows another regulator framing unauthorized online wagering as a consumer-protection and financial-security problem. Federal commodities oversight creates optionality for prediction products, but it does not erase state hostility.
    On top of the public-law risk, a California class action now alleges that Underdog’s products are illegal sports betting and seeks restitution, damages, and injunctive relief. The key risk is therefore not abstract regulation, but sudden product withdrawal, heavier compliance burden, and legal spend in contested states.'
