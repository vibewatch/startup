- id: operational-and-consumer-protection-risk
  title: Operational and Consumer-Protection Risk
  body: 'Operational risk at Underdog is unusually tied to compliance workflows because location checks, KYC, payout review, and responsible-gaming controls all sit on the critical path for customer trust. Official help content shows why this matters: precise device location is required for legal eligibility, VPNs or location anomalies can block access, government-issued ID and SSN checks can push accounts into review, and withdrawals run through a process that can take 48 to 72 hours before bank timing or additional review is layered on top. None of that proves a broken operation, but it creates many failure points when money is entering or leaving the platform. The external complaint record reinforces the same pressure points. BBB shows a large absolute complaint count and examples touching self-exclusion, withdrawals, chargebacks, scoring, and account restrictions; archived Trustpilot and ComplaintsBoard posts echo payout delays, blocked accounts, and weak support experiences. Meanwhile,
    Unit21’s own case study confirms that AML and responsible-gaming operations were once heavily manual and burdened by more than a thousand open alerts a day before automation improved throughput. The residual risk is not a single catastrophic outage; it is persistent operational friction that can erode trust, trigger complaints, and complicate regulatory exams.'
