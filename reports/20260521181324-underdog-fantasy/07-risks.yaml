- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - State market-access shock
    - Regulator action or product withdrawal
    - A top-revenue state removes or blocks a core format or event-contract path
    - Pause underwriting of growth assumptions until state-by-state revenue exposure and workaround plan are validated
  - - Customer-trust deterioration
    - Payout and support KPI slippage
    - Withdrawal SLA extends materially or complaint volumes stay elevated without denominator improvement
    - Treat retention and CAC assumptions as overstated and demand ops dashboard evidence
  - - Compliance-capacity failure
    - Alert backlog or exam pressure
    - AML / RG queue grows back toward pre-automation levels or exam findings rise
    - Assume margin drag from extra staffing and higher remediation spend
  - - Prediction-market stack risk
    - Federal-state conflict or exchange readiness issue
    - CFTC process slows, federal structure changes, or states challenge access despite the federal wrapper
    - Reduce value assigned to prediction-market upside and focus on legacy fantasy durability
  - - Seasonality concentration
    - NFL-driven demand misses
    - Best Ball and NFL-centered contests show weaker entry or prize-pool economics through a full season
    - Haircut revenue quality and treat the business as less diversified than top-line narratives imply
  notes: Kill criteria are analytical thresholds tied to public risk signals, not company guidance.
