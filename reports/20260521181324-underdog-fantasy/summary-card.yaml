  topStrengths:
    - >-
      Public traction is real: management-backed sources support nearly four million customers, nearly $500 million of
      2025 revenue, and strong mobile distribution signals.
    - >-
      Underdog now operates a broad sports-gaming product portfolio across Pick'em, drafts, Best Ball, tournaments, and
      prediction markets rather than a single-format fantasy app.
    - >-
      The disclosed Series C mark implies roughly a mid-range public-comp revenue multiple, so valuation looks
      supportable if growth holds and legal disruption stays contained.
  topRisks:
    - >-
      Regulatory patchwork is the dominant risk: New York already forced a rollback and settlement, while California
      legality pressure and class actions can remove revenue or compress the multiple.
    - >-
      Core underwriting inputs remain private, including audited hold, gross margin, cash, debt, retention, and the
      Series C preference stack.
    - >-
      Customer trust and operations still depend on verification, location controls, payout review, and third-party risk
      tooling, with recurring complaint signals around withdrawals and support.
  unresolvedGaps:
    - Audited revenue quality, realized take rate, gross margin, and state-by-state revenue mix remain undisclosed.
    - >-
      The full Series C preference stack, liquidation waterfall, and realistic liquidity path for common holders are not
      public.
    - Customer retention, repeat-deposit behavior, churn, and cohort durability are not publicly disclosed.
    - Current headcount and the full board or governance roster remain thinly disclosed in public sources.
