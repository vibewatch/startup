companyProfile:
  summary: >
    Underdog Fantasy is a Brooklyn-headquartered, remote-first private sports-gaming company founded in 2020. Public
    evidence supports a consumer platform that now spans paid fantasy contests, Pick'em and draft formats, Best Ball,
    Champions, Streaks, and a newer prediction-market layer, with management-disclosed scale of nearly four million
    customers and nearly $500 million of 2025 revenue. The company’s 2025 Series C financing moved the business into
    unicorn territory, but the investability debate still turns on legal execution because New York already forced a
    product rollback, California has challenged DFS legality, and key private-company economics remain undisclosed.
