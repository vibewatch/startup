      - number: '8.4'
        title: Thesis-Break Triggers and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The kill criteria are concrete. If California’s opinion turns into broad enforcement and the 10% revenue
              exposure is directionally accurate, the mark can compress on both revenue and multiple at once. If New
              York’s economics are not rebuilt through a permanent license or new permitted formats, the $17.5 million
              exit cost becomes evidence that regulatory friction directly destroys value rather than merely slowing
              growth. If the prediction-market pivot keeps requiring retrenchment—already visible in the North Carolina
              exit and 20% workforce reduction—investors should treat the strategy as a source of execution risk, not
              just optionality. The diligence agenda therefore needs to move beyond generic optimism. The highest-value
              asks are a state revenue and gross-profit bridge, audited hold and margin data, the exact Series C
              preference stack, and a real liquidity roadmap. Until those are on the table, the company can remain
              interesting and worth following, but the burden of proof stays with management rather than with a new
              investor trying to justify paying the current headline valuation.
