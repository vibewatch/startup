      - number: '7.3'
        title: Dependency, Market-Structure, and Seasonality Risk
        blocks:
          - type: paragraph
            body: >-
              Underdog’s newer growth narrative depends on more external infrastructure than the fantasy-only story
              implies. Prediction markets now sit on top of CFTC-linked structures, whether through Underdog’s own
              Aristotle acquisition or through FCM and exchange disclosures on the Predict side. That creates regulatory
              diversification versus pure state gaming law, but it also introduces another layer of oversight and a new
              suitability surface if states decide the products are back-door wagering. Dependency risk is visible
              elsewhere too. The fastest withdrawal path depends on specific card rails, location gating depends on
              device and anti-VPN controls, and contest settlement depends on third-party statistics providers that can
              force score revisions. Public mitigations are partly vendorized through Unit21, Sportradar, and Birches
              rather than fully proprietary. Finally, seasonality still matters. Best Ball remains a large, NFL-centered
              format with seven-figure top prizes, and a peer filing from Flutter shows exactly how sports calendars and
              NFL results can move U.S. betting and DFS economics. Underdog may diversify over time with Prediction
              Picks and adjacent products, but as of the run date the business still looks exposed to partner
              reliability, changing legal structure, and a sports calendar that is not evenly monetized across the year.
            claimRefs:
