  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and the User Jobs Underdog Actually Serves
        blocks:
          - type: paragraph
            body: >-
              Retained official surfaces show that Underdog now serves several adjacent user jobs under one
              sports-gaming umbrella. The core loop is still stat-based Pick'em: choose two to eight player projections,
              decide higher or lower, optionally flex the slip, fund the entry, and wait for settlement. But the
              surrounding catalog is materially broader than a single slip builder. Drafts pages confirm active daily
              drafts, Best Ball, and tournament formats, while help articles document Best Ball Sit N Go contests,
              Battle Royales, and Eliminator variants that translate the same fandom into different drafting and payout
              structures. Champions keeps the familiar projection workflow but changes scoring into a peer-to-peer
              tournament points model, and Streaks turns prediction play into a progressive ladder that can continue for
              up to eleven correct picks. Predict adds a still-separate event-contract layer on the same app and
              website, so the product map is best understood as a portfolio of sports-engagement formats with different
              regulatory rails, payout models, and maturity levels rather than one monolithic DFS game.
