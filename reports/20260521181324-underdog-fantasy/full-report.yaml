      - number: '1.2'
        title: Founders, leadership bench, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The retrieved evidence supports a founder-led story with one very visible public face. Official company
              materials consistently identify Jeremy Levine as founder and, by 2025-2026, CEO; earlier 2023 materials
              called him founder and co-CEO, which implies some leadership-title consolidation as the company scaled.
              Sacra additionally names Brandon Stakenborg and Trevor John as co-founders, so the best-supported founder
              set is Levine plus Stakenborg and John, with Levine clearly the public operating lead. That visibility
              creates both an asset and a risk. It helps explain why so many milestone announcements, external
              interviews, and employer-brand wins are framed through Levine, but it also indicates key-person dependence
              around strategy, recruiting, and external credibility. The leadership bench has nonetheless become more
              institutional. In 2025 the company announced Rishi Garg as CFO and Kimberly Pointer Corbett as CMO, and in
              2026 it added Nick Lundgren as chief legal officer while emphasizing its growing CFTC-linked
              prediction-market stack. Those hires improve finance, marketing, and regulatory capability exactly where a
              maturing private company would need reinforcement. What remains notably thin is governance disclosure: the
              retrieved public materials disclose executives and investors, but not a board roster or committee
              structure. That is not unusual for a private company, but it leaves diligence blind spots around founder
              control, independent oversight, and how much strategic decision-making is concentrated in a small founding
              circle.
