      - number: '3.2'
        title: Product Overlap, Scale Proxies, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              The cleanest public scale proxies in this chapter come from app-store ratings and company-stated user
              counts, not from a single third-party traffic panel. Those proxies still separate the field. ESPN and
              Yahoo dwarf everyone else on top-of-funnel reach, which is why they remain dangerous substitutes for
              casual fans even though they emphasize free play, season-long management, and prediction games rather than
              real-money slips. Among the direct pick-first apps, PrizePicks has the strongest public proof: 20 million
              claimed players on its site and roughly 463K App Store ratings. Sleeper sits behind it on ratings but adds
              a stronger engagement loop by combining picks, league management, social chat, and now Kalshi-powered
              prediction markets. Underdog’s own home page still signals material scale and near-national reach, but its
              public proof point is smaller than the large incumbents and less explicit than PrizePicks’
              app-plus-homepage story. Betr and Dabble clearly overlap on mechanics, but their public distribution proof
              reads meaningfully smaller than PrizePicks or Sleeper.
