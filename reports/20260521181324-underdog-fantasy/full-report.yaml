      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Three drivers stand out. First, mobile distribution materially enlarges the market: Mordor says apps
              captured 64.61% of fantasy revenue in 2025, while its U.S. online gambling model puts mobile at 80.13% of
              2025 activity. Second, the top of funnel is large and culturally durable: FSGA claims 85 million fantasy
              players across the U.S. and Canada, while R Street pegs the U.S. online fantasy industry at more than 50
              million players and roughly $10 billion of annual revenue. Third, adjacent wagering normalization keeps
              pushing the ceiling higher. Flutter describes prediction markets as TAM-expansive because they can reach
              roughly 40% of the U.S. population without access to regulated online sportsbooks, and both Flutter and
              CNBC frame non-sportsbook states like California and Texas as especially important openings.


              The constraints are just as structural. DFS legality remains state by state, and pick'em products keep
              attracting scrutiny as quasi-prop bets. Betting.us documents ongoing state restrictions, R Street details
              incumbent lobbying against pick'em formats, and Mordor explicitly cites California's reversal and
              patchwork compliance costs as a restraint. In the adjacent sportsbook market, high taxes and advertising
              restrictions compress margins and favor scale players. AGA has also escalated criticism of
              prediction-market platforms, warning that sports-event contracts blur consumer understanding and drain
              state tax revenue. For Underdog, the market opportunity is real, but its durability depends less on broad
              sports fan demand than on whether regulators continue to tolerate a mixed fantasy-plus-prediction stack.
