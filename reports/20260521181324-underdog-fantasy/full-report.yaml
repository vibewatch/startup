            body: >-
              The public roadmap signal is one of expansion, not consolidation. Champions moved the company beyond plain
              multiplier slips into a peer-to-peer tournament construct; Battle Royale, Sit N Go, and Eliminator
              documentation show continued contest-format experimentation; and prediction markets add a new
              regulated-adjacent path that external coverage says now runs in sixteen states through a Crypto.com
              derivatives partnership. At the same time, mature does not mean low-risk. Product availability is clearly
              segmented by jurisdiction, prediction products depend on external regulated market infrastructure, and
              legal actions in New York and California show that feature sets can be removed or challenged state by
              state. Public complaints also suggest that support and payout operations can become pain points when KYC,
              fraud, or self-exclusion controls collide with real users. The bigger diligence problem is not whether
              Underdog is shipping; it obviously is. The problem is that outsiders still lack incident logs, security
              attestations, named data vendors, and product-level usage mix, making it hard to underwrite resilience or
              module-level durability with high precision.
