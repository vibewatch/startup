  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis versus Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Underdog has enough public valuation support to stay investable, but not enough to earn a clean buy call.
              The supportive facts are real: the company disclosed a $70 million first close on a round expected to
              exceed $100 million, set a $1.225 billion pre-money valuation, said it had nearly four million customers,
              and later distributed a leadership quote saying 2025 revenue would reach nearly $500 million. On those
              public anchors alone, the current mark translates to roughly 2.5x revenue, which is not obviously
              disconnected from the public sports-gaming comp set. The anti-thesis is that nearly every important
              quality variable below revenue is still missing. The public record does not show audited hold, product
              margin, cash, debt, or the preference stack created by the Series C. That means the headline valuation is
              easier to describe than to underwrite. The correct framing is therefore not “great company or bad
              company,” but “good asset whose current price already needs several unproven assumptions to hold.” If
              California and New York pressure intensify, or if the prediction-market pivot keeps forcing operational
              change, a fair-looking multiple can compress quickly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
