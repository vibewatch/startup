              Broad fantasy-market decks describe a category measured in tens of billions of dollars, but the public
              DFS-specific lens most relevant to Underdog is much smaller. Investors should separate broad fantasy
              participation, narrow paid DFS revenue, and still-larger sportsbook or prediction-market adjacencies
