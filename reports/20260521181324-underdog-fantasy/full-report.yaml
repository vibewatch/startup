  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization Mechanics and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Underdog’s public monetization still starts with entry fees rather than subscriptions or a disclosed
              advertising model. Official help pages show standard Pick’em and Flex entries quote payout multipliers
              that explicitly include the returned stake, so customer spend is upfront cash against contingent payout
              rather than a SaaS-style fee. Flex reduces the headline multiplier in exchange for partial-win protection,
              while combo entries go further by allowing a winning prediction position to roll proceeds into a fantasy
              entry fee. Drafts and Best Ball stay economically distinct because they run through separate contest
              lobbies with their own refund rules, prize ladders, and entry caps, including marquee events such as The
              Bullpen and Best Ball Mania VII. The financial problem is that public pages explain consumer payout math
              but not Underdog’s realized take after payouts, rescues, refunds, boosts, and taxes. New York’s rulebook
              makes clear operators track entry fees, winnings paid, and gross revenue for tax purposes, but Underdog
              does not publish that bridge. That means public prize pools and payout tables are evidence of transaction
              volume and engagement, not clean evidence of net revenue or gross profit.
