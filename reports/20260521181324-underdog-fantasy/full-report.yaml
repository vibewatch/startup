      - number: '8.3'
        title: Scenario Logic and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The scenario analysis pushes the recommendation toward track. In the bull case, Underdog keeps the nearly
              $500 million revenue anchor, contains California and New York drag, and proves that the prediction-market
              expansion is additive rather than distracting; that can support something like a 3.0x-4.0x multiple and a
              valuation range of roughly $1.5 billion to $2.0 billion. In the base case, the current revenue anchor
              broadly holds but legal friction, missing audited economics, and absent cap-table detail keep the
              valuation closer to 2.0x-2.6x revenue, or about $1.0 billion to $1.3 billion. In the bear case, California
              enforcement or prolonged New York economic disruption takes revenue off the table and pushes the multiple
              into a 1.3x-1.8x zone, implying only $650 million to $900 million. The disclosed first-close post-money
              mark of about $1.295 billion sits at the top end of that base case rather than inside a clear
              margin-of-safety zone. That is why the right public-evidence answer is track with medium confidence, high
              risk, and a fair valuation stance. Investors do not need more proof that Underdog can grow; they need more
              proof that the current price compensates them for the regulatory and disclosure gaps still on the table.
            claimRefs:
