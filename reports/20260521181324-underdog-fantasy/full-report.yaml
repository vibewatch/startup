  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer Segments, Accessibility, and the Real Buying Unit
        blocks:
          - type: paragraph
            body: >-
              Underdog’s customer model is consumer rather than enterprise: in most observable journeys the buyer, user,
              and payer are the same sports fan. The more useful segmentation lens is therefore not company size or
              procurement role, but play style, jurisdiction, funding comfort, and how the user arrived. Public surfaces
              split that base into several real cohorts: casual new customers pulled in by a low-ticket promo, habitual
              Pick’em users, seasonal draft and Best Ball players, higher-frequency users willing to fund accounts
              repeatedly, creator-community fans arriving through partner codes, and newer Prediction Picks traders.
              Accessibility is broad but not uniform. The states page and help center are more informative than the
              homepage hero copy, and together they show a large U.S. footprint plus Canada ex Ontario, while also
              making clear that product access changes by location and that unavailable tabs disappear entirely. Entry
              is not frictionless: age rules vary, identity and location checks are required, payment method
              compatibility differs by product, and responsible-gaming limits can bind users long before classic
              enterprise-style “concentration” matters. That means Underdog’s addressable customer set is wide, but
              customer experience still depends heavily on where a person is, what they want to play, and how
              comfortably they can clear the platform’s onboarding and funding gates.
