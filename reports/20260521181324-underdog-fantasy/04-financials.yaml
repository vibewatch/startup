  rows:
  - - Standard Pick’em entries
    - Customer pays entry fee for fixed-multiplier player or team selections.
    - $ per entry
    - Active
    - 'Medium: high volume but realized take is not publicly disclosed.'
    - Provide realized hold, payout ratio, and refund rate by state and sport.
  - - Flex Pick’em entries
    - Lower headline multiplier in exchange for partial-win protection on misses or voids.
    - $ per entry
    - Active
    - 'Medium-Low: lower payout multiple may smooth outcomes but also changes consumer economics and operator exposure.'
    - Provide flex mix, average payout ratio, and share of rescued or voided entries.
  - - Combo entries with prediction rollovers
    - Fantasy reservation fee can be increased by winnings or cash-outs from a prediction-market leg.
    - $ reservation plus rolled-over proceeds
    - Active / experimental
    - 'Low-Medium: revenue attribution depends on interaction between fantasy and prediction settlement.'
    - Disclose how combo entries are accounted for across fantasy and prediction products.
  - - Drafts and Best Ball
    - Tournament or season-long entry fees fund prize pools and repeat engagement across the sports calendar.
    - $ per draft or contest
    - Active
    - 'Medium-High: recurring contest cadence appears durable, but overlay and payout ratios are not public.'
    - Provide entry counts, payout ratios, overlay history, and repeat-drafter cohorts.
  - - Promotions and bonus funds
    - Promos, boosters, and bonus terms are embedded around contest play and wallet funding.
    - $ promo credit or boosted payout
    - Active cost line
    - 'Low until quantified: promotions can support growth but also obscure realized unit economics.'
    - Disclose bonus-credit issuance, redemption, playthrough, and gross-to-net revenue impact.
  notes: Rows combine official consumer rules with analytical quality judgments. Underdog publishes contest mechanics, but it does not publish product-level net revenue or gross margin.
