- id: public-traction-and-unit-economics-proxies
  title: Public Traction and Unit-Economics Proxies
  body: 'The strongest public traction signal in this chapter is a management-guided revenue marker paired with customer scale, not audited financial statements. A paid company release distributed through Yahoo Finance said Underdog expects to reach nearly $500 million in 2025 revenue, while the March 2025 Series C announcement said the company had nearly four million customers and had become the fourth most downloaded sports-gaming app in the country. Those are meaningful signals of top-line relevance, but they remain company-stated rather than audited. The cleanest CAC proxy is also qualitative: Acies said a typical sportsbook spends more than $500 to acquire a customer while Underdog acquires users for a fraction of that. That suggests DFS-style product loops can be cheaper to scale than sportsbook-first acquisition, but it does not disclose payback, churn, or bonus-credit burn. Adjacent benchmarks explain why those missing details matter. New Jersey’s official reports separate promotional
    credits, peer-to-peer win, and revenue sharing, while Flutter’s filings show taxes, product mix, and promotional intensity can move margins by hundreds of basis points even for scaled market leaders. Public comparables are useful context, but they are still substitutes for Underdog’s missing own-company unit economics.'
