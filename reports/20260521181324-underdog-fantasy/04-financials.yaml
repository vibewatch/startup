- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Source basis
  - Underwriting read
  - Diligence ask
  rows:
  - - 2022 Series B
    - $35M at $485M valuation
    - Company press release
    - Useful historical baseline; proves earlier access to growth equity.
    - Confirm net proceeds after fees and what remains of 2022 capital.
  - - 2025 Series C first close
    - $70M first close on round expected to exceed $100M
    - Company funding announcement
    - Fresh external capital reduces immediate financing pressure but does not prove runway.
    - Provide cap table, close schedule, and any remaining committed capital.
  - - Latest valuation marker
    - $1.225B pre-money in Series C; later company release referenced $1.3B
    - Company statements and independent coverage
    - Valuation stepped up sharply, raising expectations for margin durability.
    - Provide board-approved valuation materials and performance milestones behind the step-up.
  - - Stated use of funds
    - Product investment and top-tier talent hiring
    - Company funding announcements
    - Growth capital appears earmarked for expansion rather than debt repayment.
    - Provide 18-24 month operating plan by product, headcount, and compliance spend.
  - - Cash on hand
    - Not publicly disclosed
    - No retained public source in chapter set
    - Liquidity cannot be underwritten from public evidence.
    - Provide latest balance sheet and unrestricted cash balance.
  - - Burn / runway / debt obligations
    - Not publicly disclosed
    - No retained public source in chapter set
    - Forward financing dependency remains opaque.
    - Provide monthly burn, runway model, debt schedule, and covenant summary.
  notes: This table deliberately separates disclosed round facts from undisclosed liquidity facts. Valuation and round size are public; solvency inputs are not.
