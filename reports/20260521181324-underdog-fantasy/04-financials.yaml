  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-liquidity
    missingEvidence: Cash balance, restricted cash, and any minimum liquidity covenant or reserve requirement.
    whyItMatters: Without cash-on-hand data, the company cannot be underwritten for solvency, resilience to fines, or capacity to self-fund product pivots.
    diligencePath: Request the latest monthly balance sheet, bank balance summary, and any board liquidity reporting package.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: Monthly net burn, operating cash flow, and management runway case under base and downside scenarios.
    whyItMatters: Runway is the key filter for whether the latest capital raise solved the financing problem or only delayed the next round.
    diligencePath: Request trailing-twelve-month cash-flow statements, current year budget, and board or investor runway model.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: product-mix-and-margin
    missingEvidence: Revenue mix by fantasy format, prediction products, sportsbook/media lines, plus realized take rate and gross margin by product.
    whyItMatters: Underdog’s public payout rules and prize pools do not reveal whether growth is coming from high-quality revenue or from low-margin, promotion-heavy lines.
    diligencePath: Request monthly product P&Ls with handle or entry volume, net revenue, promotional deductions, and gross profit by product and state.
    relatedQuestionRefs:
    - QI024
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC by channel, payback period, retention cohort curves, and bonus-credit redemption economics.
    whyItMatters: A quote that acquisition is cheaper than sportsbook peers is directionally useful but not enough to price marketing scalability or downside promo burn.
    diligencePath: Request paid-acquisition dashboard exports by channel, cohort retention files, and finance-approved CAC/LTV methodology.
    relatedQuestionRefs:
    - QI012
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: state-concentration-and-legal-reserves
    missingEvidence: State-by-state revenue concentration, legal reserve policy, and scenario plan for California or other market exits.
    whyItMatters: The New York settlement and California opinion show that geography can remove revenue quickly, but public sources do not quantify concentration outside one California estimate.
    diligencePath: Request a state revenue bridge, legal accrual memo, and management scenario analysis covering California, New York, and other contested markets.
    relatedQuestionRefs:
    - QI015
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
