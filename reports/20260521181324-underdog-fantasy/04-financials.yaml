  - - Current customer scale proxy
    - Nearly 4M customers nationwide
    - Medium
    - Shows large top-of-funnel reach and repeat engagement potential.
    - Provide active payers, monthly active users, and paying-to-funded conversion.
  - - Customer acquisition efficiency proxy
    - Typical sportsbook CAC >$500; Underdog reportedly far below that
    - Medium
    - Suggests structurally cheaper acquisition than sportsbook peers, but payback is unknown.
    - Provide channel CAC, payback period, and bonus-credit recovery by cohort.
  - - New York fantasy tax burden
    - 15% of in-state gross revenue + 0.5% fee capped at $50k
    - High
    - Shows fantasy economics can face material state-level tax drag even before settlements.
    - Provide state-by-state effective tax and regulatory-cost bridge.
  - - Adjacent New Jersey online wagering tax reference
    - 13% through June 2025, 19.75% after July 1, 2025
    - Medium
    - Shows that state tax burden can change abruptly and compress margins.
    - Provide management scenario modeling for tax-rate changes in core states.
  - - Public-company U.S. profitability benchmark
    - 'Flutter U.S. adjusted EBITDA margin: 13.2% in 2025, 6.7% in Q1 2026'
    - Medium
    - Highlights that even scaled operators can see sharp quarterly margin swings.
    - Provide Underdog monthly contribution margin and EBITDA bridge by product.
  - - Public-company sportsbook hold benchmark
    - 'Flutter U.S. sportsbook net revenue margin: 7.9% in 2024'
    - Medium
    - Useful context for adjacent sports-gaming economics, but not directly transferable to DFS.
    - Provide realized take rate and payout ratio for Pick’em and drafts.
  - - Underdog realized take rate / gross margin
    - Not publicly disclosed
    - Medium
    - This is the core missing input for underwriting revenue quality.
    - Provide product-level P&L with gross profit and promotional deductions.
