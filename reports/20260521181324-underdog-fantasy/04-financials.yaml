  title: Pricing / monetization table
  columns:
  - Offer
  - Public pricing unit
  - Public payout or fee mechanic
  - What it implies
  - Source status
  rows:
  - - 2-pick standard Pick’em
    - Entry fee
    - 3.5x payout including stake return
    - Published consumer pricing is multiplier-based, not fee-table based.
    - Official current rule
  - - 5-pick standard Pick’em
    - Entry fee
    - 20x payout including stake return
    - Operator economics depend on payout calibration, not just ticket volume.
    - Official current rule
  - - 6-8 pick Flex entry
    - Entry fee
    - Pays with up to two incorrect picks at reduced multiples
    - Flex can protect customer experience while altering margin profile.
    - Official current rule
  - - Combo entry
    - Fantasy reservation fee plus rolled-over prediction proceeds
    - Prediction winnings can increase fantasy entry fee; fantasy cancellation does not refund reservation fee
    - Cross-product accounting and take rate are likely more complex than pure fantasy entries.
    - Official current rule
  - - Private drafts / lobby pricing
    - Entry fee shown in lobby only
    - Users cannot customize draft size or entry fee in private drafts
    - Pricing is contest-specific and product-managed rather than user-configured.
    - Official current rule
