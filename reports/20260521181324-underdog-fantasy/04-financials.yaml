- id: taxes-regulatory-drag-and-adverse-economics
  title: Taxes, Regulatory Drag, and Adverse Economics
  body: 'For a fantasy operator, regulation is not just a legal backdrop; it is a direct P&L line item. New York’s IFS rules impose a 15% tax on in-state gross revenue plus another 0.5% fee, require monthly tax reporting and annual activity reporting, and force operators to maintain detailed records of entry fees, winnings, and success-rate distributions. The March 2025 settlement then shows how licensing or format disputes can turn into direct cash leakage and market exit: the commission said Underdog would stop certain contest types unless they became permitted, and Legal Sports Report said the exit cost the company $17.5 million tied to New York revenue. California is more open-ended but potentially larger. The attorney general’s formal opinion says paid-entry DFS is illegal sports wagering in the state, while SportsHandle reported that Underdog told court California represented 10% of total revenue. Front Office Sports then documented class actions seeking consumer restitution and said
    the attorney general expected operators to come into compliance. Financially, that combination means taxes, fines, reserve needs, market exits, product redesign, and legal spend all sit on top of normal customer-acquisition and payout economics.'
