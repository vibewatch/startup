- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Current public evidence
  - Severity
  - Exact diligence path
  rows:
  - - Cash on hand and restricted cash
    - Cannot judge near-term solvency or legal shock absorption.
    - Funding rounds disclosed; balance sheet absent.
    - Blocking
    - Request latest monthly balance sheet and bank balances.
  - - Monthly burn and runway
    - Cannot know whether Series C solved or only delayed financing dependence.
    - No public burn, cash-flow, or runway data retained.
    - Blocking
    - Request trailing cash-flow statements and board runway model.
  - - Revenue mix by fantasy, prediction, sportsbook, media
    - Cannot tell which line is driving growth or which line bears the most regulatory risk.
    - Rules and press releases show products exist but not their revenue shares.
    - Material
    - Request monthly product revenue bridge by state and channel.
  - - Realized take rate and gross margin
    - Cannot convert prize pools, entry fees, and user growth into durable economics.
    - Public payout mechanics exist; realized net economics do not.
    - Material
    - Request product P&Ls with payouts, promotions, taxes, and payment-processing costs.
  - - State revenue concentration and legal reserves
    - Cannot quantify downside from California, New York, or other contested jurisdictions.
    - One source says California is 10% of revenue; broader concentration is absent.
    - Material
    - Request state revenue mix, legal accrual policy, and market-exit scenario analysis.
  notes: Each row is a genuine diligence blocker rather than a formatting gap. The chapter can describe the risk shape publicly, but it cannot quantify solvency or margin durability without private operating data.
