- id: capital-adequacy-and-diligence-blockers
  title: Capital Adequacy and Diligence Blockers
  body: 'Capital is available, but public underwriting remains thin. The sourced rounds show clear direction of travel: $35 million at a $485 million valuation in 2022, then a $70 million first close on a round expected to exceed $100 million at a $1.225 billion pre-money valuation in 2025. Management said the latest money is earmarked for product and talent, and the company later stated it expected nearly $500 million of 2025 revenue. That is enough to conclude the company is not obviously demand-constrained. It is not enough to conclude the balance sheet is safe. No retained public source in this chapter discloses cash on hand, monthly burn, runway, product revenue mix, realized take rate, gross margin, or debt facilities. That omission matters because Underdog’s economics can be hit simultaneously by promotions, taxes, market-access costs, settlements, and revenue concentration in contested states. Adjacent public benchmarks help frame the problem rather than solve it: New Jersey shows
    that tax and revenue-sharing structures can shift quickly, and Flutter shows that taxes alone can move cost of sales by more than two percentage points. The investment decision bottleneck is missing operating statements, not lack of public excitement.'
