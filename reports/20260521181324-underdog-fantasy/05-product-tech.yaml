- id: operating-model-and-stack-signals
  title: Operating Model, Architecture, and Public Developer Signals
  body: 'Underdog''s public technical picture is incomplete, but it is more substantial than generic consumer marketing copy. The company discloses a mobile-and-web platform that uses location checks, identity verification, contest-integrity review, and a settlement process with explicit correction rights. The public platform-engineering role adds the clearest stack signal: Underdog says internal tools and APIs integrate with AWS, GCP, Kubernetes, DataDog, Helm, ArgoCD, GitHub, Jira, and Slack, while application work spans Typescript, Ruby, Go, Next.js, Rails, Express, Postgres, and Kafka. That does not prove a particular production architecture end to end, but it does support a view that Underdog runs a meaningful internal platform and compliance-tooling layer instead of merely skinning a third-party fantasy engine. The app-store listings reinforce that this is a continuously maintained mobile product with current release cadence, deep sports coverage, direct payment rails, and sizable
    rating bases. The key caveat is disclosure depth: retained sources explain workflows and controls, but they do not name scoring vendors, latency targets, uptime commitments, or formal security certifications.'
