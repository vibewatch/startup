- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or disclosure
  - Current status
  - Scope
  - What it helps
  - Gap or residual risk
  rows:
  - - Age and state gating
    - Explicitly disclosed
    - Fantasy and prediction products
    - Blocks ineligible users and routes products by jurisdiction
    - Rules vary by product and state, raising support complexity
  - - Precise location and VPN / proxy blocking
    - Explicitly disclosed
    - Account access and contest entry
    - Prevents masked-location play
    - False positives can block legitimate users while traveling or on unusual networks
  - - Government ID and SSN verification
    - Explicitly disclosed
    - Fantasy account security and prediction-market participation
    - Supports KYC, fraud control, and tax / regulatory compliance
    - Creates user friction when documents mismatch or are reviewed manually
  - - One-account / collusion enforcement
    - Explicitly disclosed
    - All contest formats
    - Protects fairness and blocks syndicate behavior
    - Can lead to prize holds or suspensions that users experience as opaque
  - - Draft integrity reviews and automatic refunds
    - Explicitly disclosed
    - Draft-based contests and tournaments
    - Provides a remedy when drafts are technically or competitively compromised
    - No public statistics on cancellation frequency or false positives
  - - 72-hour score verification and correction rights
    - Explicitly disclosed
    - Contest settlement
    - Creates a published settlement SLA and correction policy
    - Also reserves payment-reversal rights when errors emerge
  - - In-product responsible-gaming tools
    - Explicitly disclosed
    - Deposits, self-exclusion, cool-off, and state helplines
    - Lets users limit behavior without fully leaving the platform
    - No public efficacy metrics or intervention-rate data
  - - Sportradar Bettor Sense, Birches Health, and GuardDog
    - Recently expanded
    - Risk detection, treatment routing, and ecosystem investment
    - Strengthens player-protection narrative beyond static help copy
    - Public disclosures do not show measured ROI or coverage by product line
  notes: Controls listed here are reader-visible process and policy disclosures, not proof that every control performs perfectly in production.
