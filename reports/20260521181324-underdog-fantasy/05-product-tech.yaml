- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Underdog solution
  - Reader-visible benefit / promise
  - Limitation or friction
  rows:
  - - Become eligible to play
    - Create account, share location, verify identity, satisfy age/state rules
    - In-app onboarding tied to geolocation and KYC
    - Jurisdiction-aware access instead of generic sign-up
    - Travel, VPN, duplicate-account, or ID mismatches can halt play
  - - Build a classic Pick'em entry
    - Choose 2-8 athletes across at least two teams, decide higher/lower, optionally flex, set entry fee
    - Fast slip-builder in app and web
    - Low-friction stat opinion to cash-entry workflow
    - Availability is state-specific and payout logic varies by format
  - - Enter a peer-to-peer projection tournament
    - Build a 2-8 athlete Champions roster and score against other entrants
    - Champions tournament layer
    - Keeps the familiar projection UX but changes payout logic
    - Needs its own state eligibility and average-prize expectations
  - - Draft without managing weekly waivers
    - Join snake draft, complete roster, let product auto-start highest scorers
    - Best Ball / Sit N Go / tournament drafts
    - High-engagement drafting with low in-season maintenance
    - Scoring, advancement, and dispute processes remain operator-managed
  - - Trade prediction contracts
    - Choose eligible market, place trade on supported state map, optionally cash out
    - Prediction Picks through Underdog Predict
    - Adds sportsbook-adjacent product breadth on the same platform
    - Separate legal rails, state footprint, and external market dependency
  - - Withdraw winnings and get support
    - Request payout, monitor transaction history, contact support if flagged
    - Wallet, withdrawal, support, and responsible-gaming tooling
    - Direct payment methods plus published help guidance
    - Public complaints suggest this is a meaningful friction point when accounts are reviewed
  notes: This table focuses on the customer job flow rather than the internal economics already covered in Financials.
