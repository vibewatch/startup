- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Public role
  - Evidence signal
  - Dependency
  - Primary risk
  rows:
  - - Mobile and web clients
    - Primary entry, draft, prediction, and support surfaces
    - Current iOS and Android listings with active versions and large rating bases
    - Apple App Store and Google Play distribution
    - Mobile release issues or store-policy changes can directly affect access
  - - Contest and market experience layer
    - Hosts Pick'em, Champions, Drafts, Streaks, and Predict workflows
    - Official game pages and help docs define distinct rulesets under one brand
    - Internal product and rules orchestration
    - Cross-format complexity can raise QA and support burden
  - - Location and eligibility layer
    - Decides what products a user can access in a given jurisdiction
    - Location article plus state-eligibility docs
    - OS location permissions, compliance logic, state rules
    - False positives, travel blocks, or product-tab inconsistency can reduce conversion
  - - Identity, fraud, and payments controls
    - Verifies user identity, enforces one-account policy, supports withdrawals
    - Verification article and legal center terms
    - Document review, SSN collection, payment rails, fraud operations
    - KYC friction can delay deposits or withdrawals and trigger complaints
  - - Scoring and settlement pipeline
    - Grades contests, applies corrections, and finalizes results
    - Finalization SLA and contest-integrity articles
    - Unnamed scoring / data partners plus manual review teams
    - Vendor or grading errors can force reversals and support load
  - - Internal platform and developer tooling
    - Supports builds, deploys, observability, compliance automation, and internal APIs
    - Built In platform role references AWS, GCP, Kubernetes, DataDog, Helm, ArgoCD, Postgres, and Kafka
    - In-house engineering execution
    - Public stack signal comes from recruiting, not formal architecture docs
  - - Responsible-gaming and protection integrations
    - Runs limits, self-exclusion, high-risk detection, and care referrals
    - Responsible-gaming pages, GuardDog page, and Sportradar partnership
    - Third-party tooling and internal policy enforcement
    - Controls help trust, but do not remove legal or support risk
  notes: This is an operating-model reconstruction from official docs, legal terms, app-store metadata, and hiring signals. It is not a vendor-complete architecture diagram.
