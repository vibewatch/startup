- id: trust-safety-and-compliance-controls
  title: Trust, Safety, Compliance, and Human-in-the-Loop Operations
  body: 'Trust and compliance are not side notes in Underdog''s product experience; they are integral operating layers. The help center says users must share precise location because different states permit different activities, and VPN or proxy use can block access when eligibility cannot be verified. Account-verification pages require valid U.S. or Canadian government ID, can require SSNs for prediction-market participation, and describe one-account rules, duplicate-account reviews, and document requests tied to security or payments. Contest-integrity documentation then shows a human-in-the-loop control model: drafts can be manually reviewed for collusion, tanking, technical anomalies, or rare player combinations, with entry fees refunded if a contest is cancelled. Settlement docs publish a seventy-two-hour verification window and reserve score-reversal rights when data-provider or platform errors emerge. Around that control stack, Underdog layers responsible-gaming limits, self-exclusion,
    state helplines, the GuardDog fund, and Sportradar''s Bettor Sense with Birches Health treatment routing. These are meaningful safeguards, but they coexist with serious regulatory exposure in New York and California and with public user-friction signals around verification, withdrawals, and support responsiveness.'
