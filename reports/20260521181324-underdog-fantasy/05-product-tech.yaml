tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user job
  - Current status / maturity
  - Public differentiation signal
  - Main dependency or gate
  - Diligence gap
  rows:
  - - Classic Pick'em
    - Fast stat-based paid entry
    - Core and highly mature
    - Simple higher/lower workflow, flex option, broad sports coverage
    - State eligibility plus location and identity checks
    - No public take-rate, error-rate, or module-level usage data
  - - Pick'em Champions
    - Peer-to-peer tournament version of projection play
    - Live but more conditional by state
    - Leaderboard-style Champions Points instead of fixed slip payout
    - Separate eligibility map and tournament rules
    - No public attach-rate or retention data vs standard Pick'em
  - - Drafts & marquee Best Ball tournaments
    - Season-long or recurring snake-draft engagement
    - Core and highly mature
    - Daily drafts, Best Ball, and tournament cards with published entry ranges
    - Contest operations, scoring, and weekly advancement
    - No public overlay, fill-rate, or cohort data
  - - Best Ball Sit N Go
    - Small-group peer-to-peer drafting without lineup management
    - Mature sub-format
    - Auto-optimal scoring and no waivers/trades after draft
    - Contest-specific lobbies and pick-clock operations
    - No public data on usage share vs marquee contests
  - - Battle Royales
    - Single-slate snake-draft tournament play
    - Mature but format-specific
    - Compete against all groups, not only your local draft room
    - Integrity review on ultra-rare player combinations
    - No public cancellation-rate or dispute-rate statistics
  - - Eliminator variants
    - Large-field survivor-style tournament sweats
    - Current seasonal format
    - Published top prizes and advancement schedules
    - Sport-specific scoring and progression rules
    - No public data on repeat-entry behavior or cross-sell into other formats
  - - Streaks
    - Progressive pick ladder with escalating payout
    - Current but more novel
    - Up to eleven consecutive correct picks with cash-out / progression logic
    - In-game projections, void rules, and expiry rules
    - No public disclosure of completion rates or economics
  - - Prediction Picks / Underdog Predict
    - Event-contract trading on sports outcomes
    - Newest and most regulated layer
    - Same app surface but separate disclosures, age gates, and contract rails
    - CFTC-regulated market infrastructure plus state availability map
    - Regulatory durability and unit economics are both still externally opaque
  notes: Rows mix fully mature and newer modules because the product-tech question is portfolio breadth plus maturity, not only what is on the homepage hero today.
