  evidenceGaps:
  - type: missing-source
    severity: material
    topic: system-resilience
    missingEvidence: A public status page, incident history, or uptime/error-rate disclosure for contest entry, scoring, withdrawals, and support systems.
    whyItMatters: Public complaints and strong control language are not enough to separate isolated support incidents from systemic platform availability or settlement issues.
    diligencePath: Request monthly uptime/error dashboards, incident postmortems, and support escalation metrics for contests, wallet, KYC, and withdrawals.
    relatedQuestionRefs:
    - QE023
    - QE025
    relatedTableRefs:
    - TE003
    - TE006
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Independent security attestations such as SOC 2, penetration-test summaries, bug bounty policy, or external audit results for the wallet/KYC stack.
    whyItMatters: The platform handles identity documents, precise location, payments, and withdrawal workflows, so independent control assurance matters for underwriting trust.
    diligencePath: Request the latest security audit package, pen-test executive summary, vulnerability-response policy, and any certification roadmap.
    relatedQuestionRefs:
    - QE017
    - QE025
    relatedTableRefs:
    - TE004
    - TE006
  - type: private-evidence-only
    severity: material
    topic: product-mix
    missingEvidence: Product-level users, entries, handle, payout ratios, and revenue mix across Pick'em, Drafts, Champions, Streaks, Eliminators, and Predict.
    whyItMatters: Public module breadth does not reveal which formats truly drive economics, retention, operational load, or legal concentration.
    diligencePath: Request a weekly KPI dashboard or product P&L by module and by state, including active users, entries, hold, payout, and support-contact rates.
    relatedQuestionRefs:
    - QE018
    - QE019
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: scoring-vendors
    missingEvidence: Named data and scoring vendors, SLAs, correction rights by vendor, and dispute/error rates by product line.
    whyItMatters: Settlement speed and correction risk depend on third-party data quality, yet current retained sources only mention reputable partners in general terms.
    diligencePath: Request the vendor roster, data-flow diagram, service levels, and historical correction/dispute statistics for each major contest type.
    relatedQuestionRefs:
    - QE012
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
