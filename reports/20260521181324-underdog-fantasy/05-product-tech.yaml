    nodes:
    - id: discover
      label: Choose format
      detail: User enters Pick'em, Champions, Drafts, Streaks, or Predict based on interest and state availability.
    - id: account
      label: Create / open account
      detail: User accesses mobile or web surface and signs in.
    - id: gate
      label: Pass location + ID gates
      detail: Precise location, age, and identity checks determine what can be played.
    - id: build
      label: Build entry / trade
      detail: User creates slip, roster, draft team, streak, or prediction contract.
    - id: contest
      label: Contest or market runs
      detail: Live stats, drafts, and sporting events determine eventual outcome.
    - id: settle
      label: Settlement and correction window
      detail: Underdog grades results, may review integrity flags, and can apply corrections.
    - id: support
      label: Withdrawal / support / RG tools
      detail: Wallet, help center, limits, and support workflows handle the post-settlement experience.
    edges:
    - from: discover
      to: account
    - from: account
      to: gate
    - from: gate
      to: build
    - from: build
      to: contest
    - from: contest
      to: settle
    - from: settle
      to: support
  approximationNotes: Predict adds separate legal disclosures, but the user-facing sequence still runs through one broader Underdog account and support stack.
