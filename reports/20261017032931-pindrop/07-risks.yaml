callouts:
  - calloutType: risk
    title: Deepfake detection is a moving-target risk, not a solved-feature risk
    body: >-
      The assigned evidence supports real product depth, but it also shows the
      attack surface growing rapidly while current validation remains mostly
      company-authored. Without independent current benchmarking, investors are
      effectively underwriting model-evasion risk on management's word.
    claimRefs: [CR008, CR009, CR010, CR013]
  - calloutType: recommendation
    title: Minimum no-go criteria for diligence
    body: >-
      Pause an investment decision if Pindrop cannot produce current independent
      benchmark results, false-positive and false-negative data by workflow,
      executed warranty economics, and customer/revenue concentration by vertical
      and deployment type.
    claimRefs: [CR005, CR007, CR012, CR013, CR016]
