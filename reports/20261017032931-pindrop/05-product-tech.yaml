      - Limitation
    rows:
      - ["Authenticate a genuine caller quickly", "Passive verification during support or service calls", "Passport", "Company says average member authentication can drop by up to 50%", "Public pool does not show enrollment rates, false rejects, or sector-by-sector outcome ranges"]
      - ["Score live fraud risk during service interactions", "IVR plus live-agent call handling", "Protect", "Risk context persists across IVR and agent stages and can rescore prior calls", "No public precision, recall, or analyst-workflow timing benchmarks in the assigned evidence"]
      - ["Detect cloned or synthetic voices before a high-stakes action", "Inbound call, account recovery, or sensitive servicing workflow", "Pulse", "Company says deepfakes can be detected in about two seconds and cites 99% accuracy against known engines on ASVspoof5", "Benchmark is company-controlled and does not answer adversarial or low-audio edge cases"]
      - ["Verify remote interactions beyond the call center", "Remote meetings, interviews, and workforce helpdesk scenarios", "Pulse for Meetings plus BotStopper", "Company-issued materials tie the suite to meeting impersonation, AI-agent traffic, and 5000+ known AI voices", "Assigned evidence does not include public implementation docs, public pricing, or independent adoption proof for this newer surface"]
    notes: >-
      "Public proof / benefit" includes company-published claims and third-party comparison surfaces, not
      audited universal outcomes; buyers should request production metrics by workflow, channel, and model
      configuration.
    claimRefs: [CE003, CE004, CE005, CE007, CE010, CE012, CE016]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Channels and entry points", "Bring identity/risk checks into contact center, phone, helpdesk, IVR/IVA, and meeting workflows", "Customer telephony/meeting stack plus routing and case workflows", "Coverage may be uneven across newer non-call-center channels"]
      - ["Signal collection", "Capture acoustic, behavioral, network, device, metadata, and liveness cues", "Audio quality, metadata completeness, enrolled profiles, and upstream integrations", "Low-signal calls or missing metadata can degrade output and also narrow warranty coverage"]
      - ["Trust engines", "Pulse handles synthetic detection, Protect handles risk scoring, Passport handles known-identity authentication", "Cross-product deployment if buyer wants the full suite and warranty-backed posture", "Module boundaries may complicate packaging, procurement, and operational tuning"]
      - ["Shared intelligence and controls", "Use the intelligence network, bad-actor corpus, governance controls, APIs/SDKs, and SIEM/SOC workflows to operationalize decisions", "Ongoing data freshness, policy design, and customer response procedures", "Public evidence references the control plane at a high level but leaves implementation detail and self-serve maturity under-documented"]
    notes: >-
      This architecture is reconstructed from official product pages, the legacy datasheet, and the legal
      warranty statement; it is workflow-specific analysis, not a vendor-published reference architecture.
    claimRefs: [CE002, CE004, CE006, CE008, CE009, CE013, CE014, CE015]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Pindrop layers live interaction channels, multi-signal analysis, trust engines, shared intelligence, and enterprise controls into one operating model.
    data:
      layers:
        - label: Interaction channels
          detail: Contact center, phone, helpdesk, IVR/IVA, remote meetings, and AI-agent traffic are the surfaced entry points.
          modules:
            - Contact center calls
            - Helpdesk requests
            - Remote meetings
            - AI-agent traffic
        - label: Signal capture
          detail: Voice, liveness, behavioral, network, device, and metadata signals feed the decision stack during live interactions.
          modules:
            - Acoustic cues
            - Device and ANI
            - Behavior and cadence
            - Metadata and network context
        - label: Trust engines
          detail: Pulse asks whether identity is synthetic, Protect asks whether it is risky, and Passport asks whether it is known.
          modules:
            - Pulse
            - Protect
            - Passport
            - BotStopper
        - label: Shared intelligence
          detail: A consortium-style data layer adds historical interactions, known bad actors, and known AI voices to scoring.
          outputs:
            - 8+ billion interactions analyzed
            - 2.7M known bad actors
            - 5000+ AI known voices
        - label: Controls and integrations
          detail: Governance, policies, APIs, SDKs, and SIEM/SOC workflows operationalize decisions inside existing enterprise systems.
          modules:
            - Governance and policies
            - APIs and SDKs
            - SIEM/SOC workflows
            - Case management
        - label: Enterprise outcomes
          detail: Outputs are routed into authentication, routing, escalation, fraud review, and meeting-security decisions rather than fully autonomous adjudication.
          outputs:
            - Routing and escalation
            - Authentication context
            - Fraud review
            - Meeting-security alerts
    approximationNotes: >-
      This is an analytical stack synthesized from multiple public surfaces; it shows functional layers and
      dependencies, not a vendor-authored network topology or exhaustive data-flow diagram.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE007, CE010, CE014]
