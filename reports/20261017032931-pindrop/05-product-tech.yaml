  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public GitHub, package-registry, forum, or other practitioner-community signals showing implementation and adoption depth.
      whyItMatters: Without developer or practitioner evidence, implementation maturity is inferred mostly from marketing and competitor comparison pages.
      diligencePath: Request public or customer-shareable API docs, integration references, and any community or partner telemetry tied to production usage.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: benchmarkability
      missingEvidence: Independent red-team, false-positive, and evasion benchmark results for Pulse and Protect under real-world or adversarial conditions.
      whyItMatters: Company-controlled benchmark claims do not show how durable performance is when attackers adapt or when calls have low-quality audio and sparse metadata.
      diligencePath: Obtain third-party testing, red-team reports, and customer production scorecards segmented by workflow, channel, and escalation policy.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: implementation-transparency
      missingEvidence: Current pricing mechanics, self-serve technical documentation, deployment architecture, and the scope dates for security/compliance attestations.
      whyItMatters: These items determine integration cost, buyer friction, channel coverage, and whether the marketed control plane is mature enough for scaled rollout.
      diligencePath: Request solution architecture, API references, integration runbooks, certificate package, and a packaged quote for a representative enterprise deployment.
      relatedQuestionRefs: [QE006, QE008]
