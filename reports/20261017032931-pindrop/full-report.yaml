        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is where public disclosure is weakest. A third-party summary says near-term growth
              depends on converting migration-driven demand into recurring deployments while servicing a $100 million
              debt facility, and the Pulse warranty adds contingent obligations that are explicitly capped and heavily
              conditioned. Yet the reviewed public sources still do not disclose cash on hand, burn, runway, covenant
              headroom, or gross margin that would let an investor judge whether those obligations are easily absorbed.
              Owler's revenue, headcount, and funding estimates provide directional context but are not audited and are
              not directly comparable with Pindrop's own ARR claim. The chapter-level verdict is therefore positive on
              commercial relevance but blocked on revenue quality, margin path, and financing dependency.
