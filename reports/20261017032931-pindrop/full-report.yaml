chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current positioning
        blocks:
          - type: paragraph
            body: >-
              Current official materials position Pindrop as an enterprise platform for deepfake detection, identity
              verification, and fraud decisioning across real-time voice and video workflows rather than as a
              single-point call-center tool. The current product stack publicly spans Protect for fraud detection,
              Passport for passive authentication, Pulse for deepfake detection, and BotStopper for AI-agent detection,
              which indicates that the company is trying to own the broader "is this identity real, known, and safe"
              layer across customer, workforce, and agent interactions. Publicly assigned evidence still anchors the
              business in Atlanta and supports the view that Pindrop remains private, but several headline metrics that
              matter for later diligence work — current revenue, customer count, and employee base — are not supported
              in this chapter pool and should be treated as open diligence items rather than inferred from stale
              profiles.
