      - number: '5.2'
        title: Live operating model and architecture
        blocks:
          - type: paragraph
            body: >-
              The core operating pattern is real-time decision support layered into existing enterprise workflows. Pulse
              is presented as the synthetic-media and liveness engine, Protect as the fraud and risk engine, and
              Passport as the passive authentication layer. Public materials repeatedly emphasize that scoring starts
              before or at call connection, persists through IVR and live-agent stages, and is meant to inform routing,
              verification, review, and escalation rather than replace enterprise-owned decisions. The technical stack
              described publicly combines acoustic, behavioral, device, network, and metadata signals with a
              consortium-style intelligence layer. That is a stronger architecture story than generic "AI security"
              branding, although key implementation details such as public API docs, false-positive reporting, and
              customer-operational tuning requirements are not fully disclosed in the assigned evidence.
            claimRefs:
