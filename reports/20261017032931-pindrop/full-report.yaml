  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint skews enterprise and regulated
        blocks:
          - type: paragraph
            body: >-
              The reviewed customer evidence points to an enterprise-skewed customer base concentrated in regulated
              voice-heavy workflows rather than broad self-serve adoption. Public breadth claims are strongest in
              banking, insurance, healthcare-finance, and credit-union contact centers: a BankingNewsAI review says
              Pindrop serves 14 of the top 20 US banks, while a case-study aggregator says Pindrop has been implemented
              in 8 of the top 10 US banks, 5 of the top 7 US life insurers, and that 70% of Pindrop US customers are
              Fortune 500. The catch is that the named proof set is much thinner than the breadth claims. In the
              reviewed materials, FNBO and M&T Bank are the clearest named bank references, while Optum Financial sits
              adjacent to banking but is not itself the named bank entity. That mix supports a view that Pindrop can win
              large accounts, but not that public disclosure is deep enough to judge account count, segment mix by
              revenue, or concentration.
