    platform for contact-center calls, remote meetings, workforce helpdesk flows, and AI-agent interactions. The
    refreshed evidence supports the 2011 founding team, the ongoing CEO-founder role, a broad venture-backer roster, and
    commercial traction above $100 million of ARR, but it still does not substantiate a current equity valuation,
    audited operating economics, or refreshed headcount and customer-count disclosures.
