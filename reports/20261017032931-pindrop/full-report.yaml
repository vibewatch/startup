  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer map
        blocks:
          - type: paragraph
            body: >-
              The boundary that best fits the retained evidence is real-time identity trust for live enterprise
              interactions rather than a generic "deepfake" market. Pindrop's official platform language spans voice,
              video, digital channels, customers, workforce, and AI agents, but the workflow evidence still clusters
              around contact-center fraud detection, passive caller authentication, and high-stakes account actions.
              That matters because the relevant budget owner is usually the team accountable for call risk, account
              access, or service friction, not a broad media-forensics buyer. The company's expansion into remote
              hiring, helpdesk, and meetings widens the future user base, yet the historically anchored category remains
              phone-fraud detection and caller authentication, which keeps the present market definition narrower than
              the headline AI-security narrative.
