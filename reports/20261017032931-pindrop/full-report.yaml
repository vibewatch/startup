      - number: '2.2'
        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              Public sizing in this pool works only as a set of imperfect lenses. Faceoff repeats a combined
              deepfake-plus-identity-verification opportunity above $100 billion, while a Cyber Company Profiles
              analysis cites Deloitte's $40 billion GenAI-enabled fraud-loss forecast by 2027; both numbers indicate
              urgency, but neither is a direct budget line for Pindrop's product suite. The more useful adoption signals
              are workflow-specific: official pages say enterprises are seeing attack growth, lack purpose-built tools,
              and need detection while a call is still live; Faceoff adds an external but uncorroborated traction signal
              that Pindrop crossed $100 million ARR and serves eight of the world's top ten banks. A partner-hosted FNBO
              testimonial adds a customer outcome signal that fraud-loss cuts exceeded projection by 34%, but it is not
              independent market evidence. Taken together, the evidence supports a large and rising problem set, but
              only an evidence-constrained deployment wedge rather than a defendable public TAM/SAM/SOM stack.
