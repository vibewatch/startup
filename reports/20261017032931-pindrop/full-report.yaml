            body: >-
              The most stable ground-truth facts in the assigned pool are the 2011 founding date, the founder trio of
              Vijay Balasubramaniyan, Paul Judge, and Mustaque Ahamad, and Vijay's ongoing role as the public CEO and
              co-founder in 2025-2026 materials. The evidence also supports a venture-backed ownership profile that
              still names Andreessen Horowitz, Citi Ventures, Felicis, CapitalG, GV, IVP, and Vitruvian, but it does not
              show board composition, control rights, liquidation preferences, or any debt terms. Funding history is
              only partly refreshed: older public reporting still documents early rounds through the 2016 Series C and a
              then-disclosed $122 million cumulative total, while newer assigned sources name investors without updating
              the current cap table, most recent priced round, or any current valuation. That makes leadership
              continuity clear enough for chapter-one context, but governance and capitalization remain live diligence
