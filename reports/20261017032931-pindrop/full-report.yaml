  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The assigned source set shows a layered contact-center security platform rather than a single-point tool.
              Official pages present Protect, Passport, and Pulse as complementary modules, and the Pulse warranty
              states that the deepfake product is offered as part of a standard three-year subscription to Pulse plus
              the full Product Suite. That is enough to infer enterprise subscription packaging and module-based upsell
              potential, but not enough to underwrite revenue quality. The strongest corroborated traction datapoint is
              Pindrop's April 2025 announcement that it surpassed $100 million in ARR. By contrast, the reviewed public
              pages do not disclose list pricing, discounting, contract economics, or revenue mix by product, so
