  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Suite scope and customer job
        blocks:
          - type: paragraph
            body: >-
              Pindrop's current product story is broader than a point anti-fraud tool. The company describes "continuous
              identity verification" across voice, video, and digital interactions, then organizes the suite around
              three trust questions: whether an identity is synthetic, risky, or known. That framing matters because it
              positions Pindrop as an operating layer for real-time identity decisions, not just a call-center add-on.
              Still, the clearest public evidence remains concentrated in voice security, passive authentication, and
              meeting-security extensions rather than a fully documented end-to-end digital identity platform. The net
              read is that product scope is expanding materially, but public proof is deepest where Pindrop has
              long-standing contact-center roots and named enterprise workflow references.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
