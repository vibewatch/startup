      - number: '2.3'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The same sources that show urgency also narrow what investors should underwrite. Pindrop's legal warranty
              only applies to U.S. and Canada customers that deploy Pulse as part of the complete suite and follow
              process conditions such as recording retention and documented fraud controls, which implies that the most
              provable near-term wedge is bundle-led and operationally demanding. Public third-party scale metrics also
              remain too noisy for share math because ARR, revenue estimates, and threat-cost proxies are not
              interchangeable. For valuation, the important takeaway is not that the market is "large," but that the
              company appears to be selling into a real and growing call-risk budget while still needing private funnel,
              ACV, and renewal data to prove how much of that budget it can capture and retain.
            claimRefs:
              - CM011
              - CM012
