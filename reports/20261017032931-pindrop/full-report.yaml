        title: Public unit economics and delivery proxies
        blocks:
          - type: paragraph
            body: >-
              Official case-study style pages give a useful but incomplete view of customer value creation. Pindrop
              cites fraud reduction, investigation-time savings, and avoided loss outcomes, while an unrelated
              third-party page repeats customer quotes about fraud-loss improvement and better visibility. Those signals
              support that the product can produce enterprise ROI and that deployment value is measured in risk outcomes
              rather than pure seat expansion. They do not substitute for CAC, payback, implementation cost, support
              burden, gross margin, or services mix. The same evidence also indicates that the monetized workflow is
              concentrated in regulated voice interactions such as account recovery, claims, money movement, and caller
              authentication, which narrows comparability to broader identity platforms.
