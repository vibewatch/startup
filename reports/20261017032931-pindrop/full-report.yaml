  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Public milestones show a progression from voice-fraud origins into broader identity-trust and AI-agent workflows.
    data:
      items:
        - label: Telineage research project begins
          period: September 2010
          detail: >-
