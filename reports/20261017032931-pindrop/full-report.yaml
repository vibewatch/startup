        title: Exhibits
        blocks:
          - type: callout
            title: Real-time workflow depth is the core product advantage
            body: >-
              The strongest public evidence is not abstract AI detection accuracy; it is the way Pulse, Protect,
              Passport, and BotStopper are described as fitting into live enterprise workflows across call, meeting, and
              helpdesk decisions.
