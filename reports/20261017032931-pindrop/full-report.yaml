      - number: '3.1'
        title: 'Landscape: specialist suite versus broader platform substitutes'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not surface a same-shaped public peer that matches Pindrop feature-for-feature
              on passive authentication, live fraud scoring, and deepfake detection. Instead, the competitive set breaks
              into classes: contact-center incumbents such as NICE and Genesys, adjacent speech or workforce platforms
