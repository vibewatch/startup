  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows customer activity converting into layered subscription value, but not into a fully
      underwritable margin model.
    data:
      nodes:
        - id: demand
          label: Regulated inbound voice interactions
          note: Identity, fraud, and access decisions happen inside IVR and live-agent workflows.
        - id: protect
          label: Protect scores live fraud risk
          note: Official page positions Protect across the full caller journey from IVR through agent handling.
        - id: passport
          label: Passport passively authenticates callers
          note: Authentication is sold as a separate but complementary layer in the same platform.
        - id: pulse
          label: Pulse adds deepfake and liveness screening
          note: Official page claims ~2 seconds to detect a deepfake and 99% known-engine accuracy.
        - id: subscription
          label: Enterprise suite subscription
          note: Warranty ties Pulse to a standard 3-year subscription plus the full Product Suite.
        - id: outcomes
          label: Customer ROI evidence
          note: Pindrop cites >90% lower fraud, 35%-40% lower investigation time, and $2.57M+ reduced exposure.
        - id: gap
          label: Revenue quality still blocked
          note: Public sources do not disclose realized pricing, margin, CAC/payback, cash, or runway.
      edges:
        - from: demand
          to: protect
          label: risk scoring begins during the call
        - from: protect
          to: passport
          label: identity confidence can be layered on top
        - from: passport
          to: pulse
          label: synthetic-voice screening adds another risk signal
        - from: pulse
          to: subscription
          label: modules bundle into suite economics
        - from: subscription
          to: outcomes
          label: value proposition is expressed in avoided loss and handling efficiency
        - from: outcomes
          to: gap
          label: ROI proof exists, but unit economics remain undisclosed
    claimRefs:
      - CI003
      - CI004
      - CI006
      - CI007
      - CI008
      - CI009
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Pindrop layers live interaction channels, multi-signal analysis, trust engines, shared intelligence, and
      enterprise controls into one operating model.
    data:
      layers:
        - label: Interaction channels
          detail: >-
            Contact center, phone, helpdesk, IVR/IVA, remote meetings, and AI-agent traffic are the surfaced entry
            points.
          modules:
            - Contact center calls
            - Helpdesk requests
            - Remote meetings
            - AI-agent traffic
        - label: Signal capture
          detail: >-
            Voice, liveness, behavioral, network, device, and metadata signals feed the decision stack during live
            interactions.
          modules:
            - Acoustic cues
            - Device and ANI
            - Behavior and cadence
            - Metadata and network context
        - label: Trust engines
          detail: >-
            Pulse asks whether identity is synthetic, Protect asks whether it is risky, and Passport asks whether it is
            known.
          modules:
            - Pulse
            - Protect
            - Passport
            - BotStopper
        - label: Shared intelligence
          detail: >-
            A consortium-style data layer adds historical interactions, known bad actors, and known AI voices to
            scoring.
          outputs:
            - 8+ billion interactions analyzed
            - 2.7M known bad actors
            - 5000+ AI known voices
        - label: Controls and integrations
          detail: >-
            Governance, policies, APIs, SDKs, and SIEM/SOC workflows operationalize decisions inside existing enterprise
            systems.
          modules:
            - Governance and policies
            - APIs and SDKs
            - SIEM/SOC workflows
            - Case management
        - label: Enterprise outcomes
          detail: >-
            Outputs are routed into authentication, routing, escalation, fraud review, and meeting-security decisions
            rather than fully autonomous adjudication.
          outputs:
            - Routing and escalation
            - Authentication context
            - Fraud review
            - Meeting-security alerts
    approximationNotes: >-
      This is an analytical stack synthesized from multiple public surfaces; it shows functional layers and
      dependencies, not a vendor-authored network topology or exhaustive data-flow diagram.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE010
      - CE014
  - id: FU001
    title: Customer adoption surfaces and expansion path
    type: journey-map
    summary: >-
      Public proof implies an enterprise voice-security land-and-expand motion from fraud pain points into
      authentication, deepfake controls, and investigation workflows.
    data:
      items:
        - label: Enterprise voice-fraud entry point
          actor: Bank, insurer, or healthcare service leader
          phase: Initial wedge
          channels:
            - Direct enterprise sale
            - Partner-led sale through contact-center ecosystems
          touchpoints:
            - IVR fraud exposure
            - Live-agent risk context
          detail: Breadth claims are strongest in regulated, voice-heavy contact-center environments.
          tone: positive
        - label: Protect deployment
          actor: Fraud and contact-center operations teams
          phase: First production workflow
          touchpoints:
            - Real-time risk scoring
            - Look-back scoring after the call
          detail: Public customer stories most often start with fraud detection in IVR and agent workflows.
          tone: positive
        - label: Passport rollout
          actor: Authentication and CX owners
          phase: Workflow expansion
          touchpoints:
            - Replace KBAs and OTP-heavy flows
            - Passive caller authentication
          detail: M&T's public story emphasizes stronger authentication without sacrificing customer trust.
          tone: positive
        - label: Pulse and BotStopper add-on
          actor: Trust and fraud teams
          phase: Deepfake / bot layer
          touchpoints:
            - Synthetic voice screening
            - High-risk account recovery and claims calls
          detail: Pindrop's expansion story increasingly layers deepfake detection onto existing voice-security deployments.
          tone: neutral
        - label: Fraud Assist and analyst workflow
          actor: Fraud investigation teams
          phase: Post-call expansion
          touchpoints:
            - Case summaries
            - Investigation acceleration
          detail: >-
            FNBO evidence suggests product expansion can move from front-line controls into analyst productivity
            tooling.
          tone: positive
        - label: Multi-year bundle and channel dependence
          actor: Procurement, partner, and legal stakeholders
          phase: Commercial scaling
          channels:
            - NiCE
            - Zoom Contact Center
            - AWS Marketplace
            - FICO Marketplace
          touchpoints:
            - Three-year Pulse warranty bundle
            - Full-suite procurement
          detail: >-
            Expansion upside is visible, but public data does not show whether multi-product bundles translate into
            renewals or diversified revenue.
          tone: warning
    approximationNotes: >-
      Sequence shows the public adoption pattern implied by reviewed sources, not a universal customer lifecycle or
      measured conversion funnel.
    claimRefs:
      - CU005
      - CU011
      - CU013
