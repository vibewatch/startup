      - number: '1.3'
        title: Commercial proof points and current constraints
        blocks:
          - type: paragraph
            body: >-
              Assigned current proof points support real commercial traction, but mostly through company or partner
              surfaces rather than independent benchmarks. Pindrop's September 2026 BotStopper launch extends the
              platform into standalone AI-agent detection and pairs that launch with a managed registry of more than
              5,000 AI voices. A live Zoom Contact Center marketplace listing and Pindrop's own integration language
              both support a channel-and-platform distribution story, while company-issued case examples cite measurable
              customer outcomes at HealthEquity, First National Bank of Omaha, Michigan State University Federal Credit
              Union, and Optum Financial. The main offset is that the new Pulse Warranty should not be read as
              unconditional loss coverage: the legal terms limit eligibility to full-suite Pulse subscriptions in the
              U.S. and Canada, impose reimbursement caps, and carve out multiple scenarios outside Pindrop's control.
              Publicly visible momentum is therefore meaningful, but readers should separate deployment proof from
              independently verified economics or guaranteed liability transfer.
