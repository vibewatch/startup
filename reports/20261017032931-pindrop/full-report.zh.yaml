      - number: '2.2'
        title: 规模测算视角与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              这组公开规模测算只能作为一组不完美的视角。Faceoff 重复提到一个超过 $100 billion 的 deepfake 加身份验证综合机会；Cyber Company Profiles 的分析引用
              Deloitte 对 GenAI 驱动欺诈损失到 2027 年达到 $40 billion 的预测。两个数字都说明问题紧迫，但都不是 Pindrop
              产品套件的直接预算科目。更有用的采用信号来自具体工作流：官方页面称企业正看到攻击增长、缺少专用工具，并需要在通话仍进行时完成检测；Faceoff 还给出一个未经外部证实的牵引力信号，称 Pindrop ARR
              已超过 $100 million，并服务于全球前十大银行中的八家。合作伙伴托管的 FNBO 证言补充了客户结果信号，称欺诈损失降幅比预测高出
              34%，但这不是独立市场证据。合并来看，证据支持一个庞大且增长中的问题集合，但只支持受证据约束的部署切入口，而不是可有力辩护的公开 TAM/SAM/SOM 体系。
