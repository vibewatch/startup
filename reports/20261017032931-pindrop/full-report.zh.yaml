      - number: '7.2'
        title: 监管与合同风险敞口
        blocks:
          - type: paragraph
            body: >-
              公开法律材料显示，Pindrop 愿意承担部分合成语音损失，但只在狭窄的合同边界内。Pulse 保修适用于技术作为完整产品套件一部分部署、客户位于美国或加拿大的情形，并排除一长串 Pindrop
              无法控制的场景，包括服务中断、音频或元数据不足、缺少录音，以及客户在收到警报后误用。由此产生了“保修”营销信号与投资者关心的真实部署下下行经济性是否已封顶之间的明显差距。平台页面还提到法院认可的 BIPA
              豁免，适用于符合条件的生物识别认证；这有帮助，但只针对特定司法管辖区，不能作为对平台如今面向的所有认证、服务台、招聘或会议工作流的全面隐私许可。如果管理层无法提供当前法律顾问备忘录、DPA
              条款、留存控制及争议欺诈事件如何裁决的真实案例，这一法律合规层仍是重大尽调阻碍，而不是已关闭的风险。
