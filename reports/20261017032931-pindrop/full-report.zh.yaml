  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              严重性最高的风险是攻击速度可能超过模型更新和运营控制。Pindrop 自己的 2025 年报告称，deepfake 欺诈尝试在 2024 年增长超过 1,300%，并预计 2025 年 deepfake
              通话还会增加 155%；而当前产品页面仍将 Pulse 描述为更大控制栈中的一个信号，而不是自足的决策引擎。因此，可投资问题不再是“Pindrop 能否检测到一些
              deepfake？”，而是“客户能否让完整工作流、集成和模型治理保持足够新，从而领先于快速适应的攻击者？”二阶风险在于，公开缓解能力的声明大多由公司撰写或合作伙伴分发，分配证据池没有独立基准验证其面对对抗性、改动信号的规避时的表现。尽调中最可监测的否决条件，是无法提供当前独立基准证据、无法按工作流展示误报率和漏报率，或证明真实客户部署依赖人工绕行来弥补路由、录音或元数据覆盖不足。
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR013
