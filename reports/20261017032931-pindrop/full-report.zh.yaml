            body: >-
              核心运营模式是叠加在现有企业工作流上的实时决策支持。Pulse 被描述为合成媒体和活体检测引擎，Protect 是欺诈与风险引擎，Passport 是被动认证层。公开材料反复强调，评分在接通前或接通时开始，贯穿
