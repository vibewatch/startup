        title: 领导层、所有权与治理
        blocks:
          - type: paragraph
            body: >-
              分配证据池中最稳定的事实是 2011 年成立、创始人 Vijay Balasubramaniyan、Paul Judge 和 Mustaque Ahamad 三人，以及 Vijay 在 2025-2026
              年材料中继续担任公开 CEO 和联合创始人。证据还支持其风险资本支持的所有权背景，现有名单仍包括 Andreessen Horowitz、Citi Ventures、Felicis、CapitalG、GV、IVP
              和 Vitruvian；但没有披露董事会构成、控制权、清算优先权或任何债务条款。融资历史只得到部分更新：较早的公开报道仍记录截至 2016 年 Series C 的早期轮次，以及当时披露的累计 $122
              million；较新的分配来源虽列出投资人，却没有更新当前股权结构表、最近定价轮或当前估值。因此，就第一章背景而言，领导层延续性已经足够清楚，但治理和资本结构仍是待推进的尽调事项。
