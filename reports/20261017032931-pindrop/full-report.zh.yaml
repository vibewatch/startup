chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与当前定位
        blocks:
          - type: paragraph
            body: >-
              当前官方材料将 Pindrop 定位为面向企业的平台，服务于实时语音和视频流程中的 deepfake 检测、身份验证和欺诈决策，而不是单一的呼叫中心工具。当前公开产品栈包括用于反欺诈检测的
              Protect、用于被动认证的 Passport、用于 deepfake 检测的 Pulse，以及用于 AI agent 检测的 BotStopper。公司的目标，是占据客户、员工和 agent
              交互中“这个身份是否真实、已知且安全”的更广泛一层。公开分配的证据仍将业务锚定在 Atlanta，并支持 Pindrop
              仍为非上市公司的判断；但对后续尽调重要的若干核心指标——当前收入、客户数和员工规模——在本章证据池中没有得到支持，应视为待核实事项，而不是从过时的公司简介中推断。
