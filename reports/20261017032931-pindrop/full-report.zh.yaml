      - number: '1.3'
        title: 商业验证点与当前约束
        blocks:
          - type: paragraph
            body: >-
              当前分配的验证点支持真实的商业牵引力，但主要来自公司或合作伙伴渠道，而非独立基准。Pindrop 于 September 2026 发布 BotStopper，将平台扩展到独立的 AI agent
              检测，并配套一个收录超过 5,000 个 AI 语音的托管注册库。Zoom Contact Center 的在线 marketplace 列表和 Pindrop
              自身的集成表述共同支持渠道加平台的分销故事；公司发布的案例则列举了 HealthEquity、First National Bank of Omaha、Michigan State University
              Federal Credit Union 和 Optum Financial 的可量化客户结果。主要抵消因素是，新推出的 Pulse Warranty
              不应被理解为无条件的损失保障：法律条款将资格限制在美国和加拿大的完整套件 Pulse 订阅者，设置赔付上限，并排除多种 Pindrop
              无法控制的情形。因此，公开可见的动能确实有意义，但应把部署验证与独立核实的经济性或有保障的责任转移区分开。
