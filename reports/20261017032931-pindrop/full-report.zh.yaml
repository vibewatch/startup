      - number: '4.3'
        title: 资本充足性与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              资本充足性是公开披露最薄弱的部分。一份第三方摘要称，近期增长取决于将迁移驱动的需求转化为经常性部署，同时偿付 $100 million 债务融资工具；Pulse
              保修又增加了明确设有上限且附带大量条件的或有义务。然而，审阅的公开来源仍未披露现金余额、烧钱速度、现金跑道、契约余量或毛利率，投资者无法据此判断这些义务是否易于吸收。Owler
              的收入、员工数和融资估算只能提供方向性背景，未经审计，也不能直接与 Pindrop 自己的 ARR 声明比较。因此，本章结论是商业相关性为正，但收入质量、利润率路径和融资依赖仍构成阻碍。
