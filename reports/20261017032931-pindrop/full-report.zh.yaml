companyProfile:
  summary: >-
    Pindrop 是一家总部位于 Atlanta 的非上市语音安全公司，如今将自身定位为覆盖联络中心通话、远程会议、员工服务台流程及 AI agent 交互的身份信任平台。更新后的证据支持其 2011 年创始团队、创始人持续担任
    CEO、广泛的风险投资人名单，以及超过 $100 million ARR 的商业牵引力，但仍无法证实当前股权估值、经审计的经营经济性，或更新后的员工数与客户数披露。
