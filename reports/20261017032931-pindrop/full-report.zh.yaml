  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方图谱
        blocks:
          - type: paragraph
            body: >-
              最符合留存证据的市场边界，是面向实时企业互动的身份信任，而不是泛化的“deepfake”市场。Pindrop 官方平台表述覆盖语音、视频、数字渠道、客户、员工和 AI
              agents，但工作流证据仍集中在联络中心欺诈检测、被动呼叫者认证和高风险账户操作。关键在于，相关预算通常由负责通话风险、账户访问或服务摩擦的团队掌握，而不是由广义媒体取证买方掌握。公司向远程招聘、服务台和会议扩展，扩大了未来用户群，但历史上锚定的品类仍是电话欺诈检测和呼叫者认证，使当前市场定义窄于标题式的
              AI 安全叙事。
