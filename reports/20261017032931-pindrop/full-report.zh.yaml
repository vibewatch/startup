        - 品类紧迫性是真实的：保留的官方页面描述了 AI 驱动攻击压力的急剧上升，具名客户的个案也表明该平台能在生产工作流中发挥作用。
        - 独立基准或队列数据证明这些结果不只出现在少数具名参考客户中。
      - - 论点
        - 2024 年 Hercules 债务融资表明，外部资本提供方认为公司成熟度足以支持扩张融资，而无需立即进行明显的定价股权重置。
        - 契约、摊还和流动性细节证明该融资是在延长现金跑道，而不是掩盖压力。
      - - 反论点
        - 保留材料库仍未披露当前公开估值，因此投资者无法将入场价格锚定到可观察的市场出清轮次。
        - 当前定价轮、二级市场估值，或带条款背景的董事会 / 贷款方估值更新。
      - - 反论点
        - 公开财务输入在不同追踪器之间仍然稀疏且不一致，使基于倍数的承销判断很脆弱。
        - 经审计的收入、ARR、增长、毛利率、烧钱和留存披露。
      - - 反论点
        - 保修经济性受免责条款和上限约束，因此仅凭这项方案，商业或责任风险能降低多少是有限的。
        - 证明保修在商业上具有决定性作用的理赔历史、赔付行为和客户采用证据。
      - - 反命题
        - 保留的可比参考对象偏战略或产品邻近，而不是交易口径干净的估值可比案例。
        - 与同一语音安全和深度伪造检测赛道相关的公开 / 私募可比融资轮次、并购案例或估值标记。
