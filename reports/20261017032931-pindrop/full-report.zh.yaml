      - number: '2.3'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              显示紧迫性的同一批来源，也限制了投资者可以纳入投资判断的内容。Pindrop 的法律保修仅适用于在美国和加拿大部署 Pulse
              完整套件、并遵守录音留存和欺诈控制记录等流程条件的客户，因此近期最容易证明的切入口由套件销售驱动，且运营要求较高。公开的第三方规模指标也太嘈杂，无法用于份额计算，因为
              ARR、收入估算和威胁成本代理指标不可互换。对估值而言，关键结论不是市场“很大”，而是公司似乎在向真实且增长中的通话风险预算销售，同时仍需私有漏斗、ACV 和续约数据来证明自己能捕获并留住其中多少预算。
            claimRefs:
              - CM011
              - CM012
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：专业套件与更广泛的平台替代品
        blocks:
          - type: paragraph
            body: >-
              分配证据没有发现一家在被动认证、实时欺诈评分和 deepfake 检测上与 Pindrop 逐项匹配的公开同类公司。竞争集合可分为几类：NICE、Genesys
              等联络中心巨头；Nuance/Microsoft、Verint 等相邻语音或员工平台；Twilio、Vonage 等通信基础设施路径；以及安全问题加人工审核的现状。这一点很重要，因为 Pindrop
              销售的是比通用 CX 套件更窄但更专注安全的任务，因此其核心竞争往往是更广泛的平台或拼装式工作流，而不是直接的单点复制品。
