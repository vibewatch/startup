          'y': 1
          note: 现有替代方案几乎没有新增工作流广度，对复杂冒充的防护也较弱。
    approximationNotes: 坐标是基于指定证据集的序数判断，不是市场份额测量或独立基准得分。
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP008
      - CP011
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据显示，客户活动正在转化为分层订阅价值，但还不足以形成可纳入投资判断的完整利润率模型。
    data:
      nodes:
        - id: demand
          label: 受监管的呼入语音交互
          note: 身份、欺诈和访问决策发生在 IVR 与人工坐席工作流中。
        - id: protect
          label: Protect 评分实时欺诈风险
          note: 官方页面将 Protect 定位于覆盖从 IVR 到坐席处理的完整来电旅程。
        - id: passport
          label: Passport 被动认证来电者
          note: 认证在同一平台中作为独立但互补的层提供。
        - id: pulse
          label: Pulse 增加深度伪造和活体筛查
          note: 官方页面称其约 2 秒即可检测深度伪造，已知引擎准确率为 99%。
        - id: subscription
          label: 企业套件订阅
          note: 保修将 Pulse 与标准 3 年订阅及完整 Product Suite 绑定。
        - id: outcomes
          label: 客户 ROI 证据
          note: Pindrop 引用欺诈降低 >90%、调查时间降低 35%-40%，以及减少 $2.57M+ 风险敞口。
        - id: gap
          label: 收入质量仍受阻
          note: 公开来源未披露实际定价、利润率、CAC / 回本期、现金或现金跑道。
      edges:
        - from: demand
          to: protect
          label: 风险评分在通话中启动
        - from: protect
          to: passport
          label: 可叠加身份置信度
        - from: passport
          to: pulse
          label: 合成语音筛查增加另一项风险信号
        - from: pulse
          to: subscription
          label: 模块打包形成套件经济性
        - from: subscription
          to: outcomes
          label: 价值主张体现为避免损失和提升处理效率
        - from: outcomes
          to: gap
          label: 有 ROI 证明，但单位经济性仍未披露
    claimRefs:
      - CI003
      - CI004
      - CI006
      - CI007
      - CI008
      - CI009
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Pindrop 将实时交互渠道、多信号分析、信任引擎、共享智能和企业控制层叠进一套运营模型。
    data:
      layers:
        - label: 交互渠道
          detail: 联络中心、电话、服务台、IVR/IVA、远程会议和 AI 代理流量是呈现出来的入口。
          modules:
            - 联络中心来电
            - 服务台请求
            - 远程会议
            - AI 代理流量
        - label: 信号捕获
          detail: 语音、活体、行为、网络、设备和元数据等信号，在实时交互中输入决策栈。
          modules:
            - 声学特征
            - 设备和 ANI
            - 行为和节奏
            - 元数据和网络上下文
        - label: 信任引擎
          detail: Pulse 判断身份是否为合成身份，Protect 判断是否存在风险，Passport 判断是否为已知身份。
          modules:
            - Pulse
            - Protect
            - Passport
            - BotStopper
        - label: 共享智能
          detail: 联盟式数据层将历史交互、已知恶意行为者和已知 AI 声音加入评分。
          outputs:
            - 已分析 8+ billion 次交互
            - 2.7M 个已知恶意行为者
            - 5000+ 个已知 AI 声音
        - label: 控制与集成
          detail: 治理、政策、API、SDK 以及 SIEM/SOC 工作流，将决策落到现有企业系统中。
          modules:
            - 治理与政策
            - API 与 SDK
            - SIEM/SOC 工作流
            - 案件管理
        - label: 企业结果
          detail: 输出被送入认证、路由、升级、欺诈复核和会议安全决策，而不是完全自主裁决。
          outputs:
            - 路由与升级
            - 认证上下文
            - 欺诈复核
            - 会议安全警报
    approximationNotes: 这是综合多个公开页面形成的分析栈；它展示功能层和依赖关系，不是厂商撰写的网络拓扑或完整数据流图。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE010
      - CE014
  - id: FU001
    title: 客户采用场景与扩张路径
    type: journey-map
    summary: 公开证明暗示了一条企业语音安全“落地—扩张”路径：从欺诈痛点切入，延伸至认证、深度伪造控制和调查工作流。
    data:
      items:
        - label: 企业语音欺诈切入点
          actor: 银行、保险公司或医疗服务负责人
          phase: 初始切口
          channels:
            - 直接企业销售
            - 通过联络中心生态伙伴主导的销售
          touchpoints:
            - IVR 欺诈暴露
            - 人工坐席风险上下文
          detail: 广度主张在受监管、语音密集型联络中心环境中最有力。
          tone: positive
        - label: Protect 部署
          actor: 欺诈与联络中心运营团队
          phase: 首个生产工作流
          touchpoints:
            - 实时风险评分
            - 通话后回溯评分
          detail: 公开客户案例最常从 IVR 和坐席工作流中的欺诈检测开始。
          tone: positive
        - label: Passport 推广
          actor: 认证与客户体验负责人
          phase: 工作流扩张
          touchpoints:
            - 替代依赖 KBA 和 OTP 的流程
            - 被动来电者认证
          detail: M&T 的公开案例强调，在不牺牲客户信任的前提下增强认证。
          tone: positive
        - label: Pulse 和 BotStopper 加购
          actor: 信任与欺诈团队
          phase: 深度伪造 / 机器人层
          touchpoints:
            - 合成语音筛查
            - 高风险账户恢复和理赔通话
          detail: Pindrop 的扩张故事越来越多地是在现有语音安全部署上叠加深度伪造检测。
          tone: neutral
        - label: Fraud Assist 与分析师工作流
          actor: 欺诈调查团队
          phase: 通话后扩张
          touchpoints:
            - 案件摘要
            - 加快调查
          detail: FNBO 证据表明，产品扩张可以从一线控制延伸到提升分析师生产力的工具。
          tone: positive
        - label: 多年期捆绑与渠道依赖
          actor: 采购、合作伙伴和法务利益相关方
          phase: 商业规模化
          channels:
            - NiCE
            - Zoom Contact Center
            - AWS Marketplace
            - FICO Marketplace
          touchpoints:
            - 三年期 Pulse 保修捆绑
            - 全套件采购
          detail: 扩张上行空间可见，但公开数据没有显示多产品捆绑能否转化为续约或收入多元化。
          tone: warning
    approximationNotes: 该序列展示审阅来源所暗示的公开采用模式，不是普遍适用的客户生命周期或已测量的转化漏斗。
    claimRefs:
      - CU005
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据表明，模型规避速度、部署复杂度和狭窄的合同保护带来较高的剩余风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: 深度伪造军备竞赛
          note: 攻击增长由公司报告且为当前数据，但缺少独立基准证据。
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 工作流误报 / 漏报
          note: 路由、验证和升级仍由客户运营团队负责。
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 保修与法律覆盖缺口
          note: 保修范围确实存在，但狭窄且流程繁重。
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 隐私 / 劳动力场景扩张
          note: 使用场景已延伸到服务台、招聘、会议和 AI 代理交互。
          values:
            - 中
            - 中-高
            - 中
            - 中
        - label: 生态伙伴依赖
          note: Marketplace 和 AppFoundry 渠道扩大触达，但也增加集成和采购依赖。
          values:
            - 中
            - 中
            - 中
            - 中
        - label: 垂直领域集中度
          note: 指定证明集中在受监管服务的联络中心使用场景。
          values:
            - 中
            - 中
            - 中
            - 中
    approximationNotes: 热力图单元格是基于指定公开证据综合出的序数分析师标签，不是披露的统计概率。
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐的核心是价格纪律，而不是认为业务无关紧要。
    data:
      nodes:
        - id: demand
          label: AI 语音欺诈压力上升
          note: 官方页面描述了快速增长的 AI 驱动联络中心攻击。
        - id: proof
          label: 产品和客户证明存在
          note: 官方材料列出具体客户，并提出快速检测深度伪造的主张。
        - id: capital
          label: 2024 年债务延续了故事
          note: Hercules 融资支持增长，但债务不是股权价格信号。
        - id: opacity
          label: 估值和经营披露仍然稀薄
          note: 保留的追踪机构资料无法提供可靠的当前市场出清估值。
        - id: downside
          label: 下行条款仍然重要
          note: 保修免责条款和缺失的契约细节使投资判断风险维持高位。
        - id: call
          label: 推荐 = research-more
          note: 在形成投资判断前，等待更清晰的定价、条款和经营数据。
      edges:
        - from: demand
          to: proof
          label: 验证相关性
        - from: proof
          to: capital
          label: 支持融资渠道
        - from: capital
          to: opacity
          label: 但无法解决价格发现
        - from: opacity
          to: downside
          label: 提高投资判断敏感度
        - from: downside
          to: call
          label: 保持较高入场纪律
    approximationNotes: 该流程是定性的、面向读者的，不代表加权概率或量化评分模型。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV009
      - CV010
      - CV015
      - CV016
