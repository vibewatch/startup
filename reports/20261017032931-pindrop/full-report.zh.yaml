            body: >-
              乐观情景是，Pindrop 在 AI 欺诈技术栈中占据一条重要赛道：官方页面展示了具体客户轶事、关于快速 deepfake
              检测的产品主张，以及与攻击频率上升相连的品类故事。反论是，本证据池中大多数最有力的证明仍由公司撰写，而跟踪机构的财务输入嘈杂且不完整。Tracxn、Venture Capital Tracker 和 Owler
              无法拼出一幅关于融资、估值或收入规模的单一可靠图景，因此情景分析必须保持定性。最有依据的基准情景是公司在受监管联络中心持续保持相关性，同时等待价格；乐观情景需要更干净的经营指标和披露的轮次或估值标记，悲观情景则围绕商业化失速、倍数压缩，或硬指标经检验后出现下轮融资。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调问题与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              最终尽调议程很明确。在评估任何新股或老股入场前，投资者需要当前股权结构表、最近定价轮条款或内部估值、Hercules
              契约及再融资细节，以及管理层层面的收入、ARR、增长、毛利率、烧钱、留存和集中度披露。他们还需要了解 Pulse Warranty
              在实践中的表现：采用情况、索赔、拒赔，以及排除条款是否限制商业实用性。如果下一轮融资以结构性激进估值完成，却没有相应的持续增长和单位经济性证明，或者 deepfake
              检测效果在更广泛的真实攻击条件下弱化的速度超过公司维持溢价定价的能力，投资论点就会被破坏。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 公开结论
            body: 先继续研究，不要现在投资：留存证据显示品类相关性和部分证明，但公开定价或财务细节还不足以为入场倍数辩护。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV015
              - CV016
          - type: callout
            title: 价格解锁条件
            body: 当前定价轮或可信的内部估值标记可能显著改变判断，但前提是同时提供管理层级的收入、利润率、留存和契约细节。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV016
