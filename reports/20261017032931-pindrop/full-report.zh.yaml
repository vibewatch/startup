            body: >-
              分配来源显示的是分层的联络中心安全平台，而不是单一工具。官方页面将 Protect、Passport 和 Pulse 描述为互补模块；Pulse 保修则说明 deepfake 产品以标准三年订阅方式，连同
              Pulse 和完整 Product Suite 提供。这足以推断企业订阅打包和模块化增购潜力，但不足以评估收入质量。最强的经交叉验证的牵引力数据点，是 Pindrop 在 April 2025 宣布 ARR 超过
              $100 million。相比之下，审阅的公开页面没有披露标价、折扣、合同经济性或按产品划分的收入结构，因此实际变现仍不透明。
