      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 深度伪造需求持续加速，Pulse 的性能主张在更广泛部署中经得起检验，客户突破也能复制为可重复的扩张。
        - 只有尽调确认留存、利润率和融资轮条款都处于品类领先水平，溢价入场才可能成立。
        - 模型表现滑坡、多模态竞争，或吞噬超预期上行空间的债务条款。
        - 有可能，但仅凭公开证据无法支撑。
      - - 基准
        - Pindrop 在受监管联络中心仍具战略相关性，但融资继续私下协商，披露也仍然选择性进行。
        - 最好的应对是先跟踪；只有在出现可见的定价融资轮和管理层质量的经营数据后，才考虑谈判。
        - 商业化放缓、契约约束拖累，或限制回报不对称性的持平融资轮。
        - 最符合当前保留的证据。
      - - 悲观
        - 随着攻击方法演进，检测效果越来越难守住；披露稀疏也会迫使下一轮在结构性更弱的价格上完成。
        - 除非入场条款大幅补偿稀释、优先权和执行风险，否则下行风险占主导。
        - 下轮融资估值下调、倍数压缩、保修表现不及预期，或尽调中出现客户集中度问题。
        - 风险实质性偏高，因为当前证据池缺少硬财务证明。
    notes: 这些情景是方向性判断，不是模型输出；保留的公开证据无法提供可靠的收入基数、利润率画像或当前股权估值。
