evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: Latest priced round, secondary pricing, cap table, and liquidation-preference stack.
    whyItMatters: The overview cannot establish current ownership economics or valuation discipline without it.
    diligencePath: >-
      Request the latest financing documents, board deck cap-table tab, and any lender or auditor summary of current
      preferred terms.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: Current headcount, customer count, and geographic footprint broken out by enterprise segment.
    whyItMatters: These are core cover metrics that frame operating scale and concentration risk for later chapters.
    diligencePath: >-
      Request an as-of-date operating KPI pack with employee count, customer logos or counts, and regional revenue or
      customer mix.
  - type: missing-source
    severity: material
    topic: governance-and-board
    missingEvidence: Current board composition, committee structure, and any control-rights summary for lead investors.
    whyItMatters: >-
      Founder continuity is visible, but governance and sponsor control cannot be assessed from the assigned public
      pool.
    diligencePath: Request the board observer list, governance deck, and current investor-rights summary.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-disclosure
    missingEvidence: Audited revenue, ARR, growth, gross margin, burn, and any venture-debt terms.
    whyItMatters: Later judgment on scale quality and valuation cannot be grounded without current financial evidence.
    diligencePath: Request the latest audited or board-approved financial package, including debt schedules and covenant summaries.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som-bridge
    missingEvidence: A 2026 management bridge from broad market proxies to reachable spend by vertical, workflow, ACV, and win rate.
    whyItMatters: Without that bridge, the chapter can justify urgency but not a defendable market-share or penetration assumption.
    diligencePath: Request pipeline, win-rate, ACV, and deployment counts by banking, insurance, healthcare, and workforce workflows.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: public-scale-signals
    missingEvidence: >-
      Audited or board-level revenue, ARR, customer-count, and deployment disclosures that reconcile Faceoff and Owler
      scale signals.
    whyItMatters: >-
      Incomparable public figures can distort both market-share math and valuation benchmarks if treated as
      interchangeable.
    diligencePath: >-
      Ask management for audited revenue or ARR definitions, customer concentration, and any board-approved operating
      KPI pack.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Independent buyer-side procurement, RFP, or case-study evidence showing who owns deepfake-detection budget outside
      Pindrop-controlled materials.
    whyItMatters: >-
      Valuation depends on whether the product sells into a durable fraud budget, shared security tooling, or
      opportunistic pilot spend.
    diligencePath: >-
      Collect independent buyer references, procurement documents, or public RFPs that name the budget owner and
      workflow scope.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: Direct pricing, packaging, or contract-structure pages for NICE, Genesys, Nuance, Verint, Twilio, and Vonage.
    whyItMatters: >-
      Without competitor price signals, the public record cannot test whether Pindrop's specialist depth commands a
      premium or loses on total cost of ownership.
    diligencePath: >-
      Collect the current pricing or procurement pages for the named alternatives and normalize them to per-seat,
      per-call, or platform-commitment terms.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-switching
    missingEvidence: >-
      Public win-loss data, churn, multiyear retention, or customer migration detail showing whether Pindrop displaces
      or coexists with incumbent platforms.
    whyItMatters: >-
      The durability case depends on whether specialist depth creates real switching cost rather than merely a strong
      product narrative.
    diligencePath: >-
      Request customer cohort retention, competitive win/loss notes, and named reference calls from management and
      recent enterprise customers.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent benchmark or customer validation of Pindrop's deepfake-detection performance under zero-day or
      adversarial conditions.
    whyItMatters: >-
      The strongest moat claims are currently benchmarked mainly in company-controlled materials, which leaves room for
      incumbent catch-up or selective disclosure.
    diligencePath: >-
      Obtain third-party test reports, customer evaluation data, or procurement bake-off results covering unseen attack
      conditions and false-positive tradeoffs.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: pricing-opacity
    missingEvidence: >-
      Signed pricing schedules, ACV by product, discount bands, term lengths, renewal cohorts, and services attachment
      rates.
    whyItMatters: >-
      Revenue quality cannot be underwritten without knowing what customers actually pay and how much implementation
      revenue is mixed into recurring software.
    diligencePath: Request recent order forms, standard MSA exhibits, and a cohort view of booked ACV versus realized ARR by product.
    relatedQuestionRefs:
      - QI001
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
