    keyQuote: >-
      Pindrop’s products and services are designed to offer protection against various types of fraud attacks in the
      call center. With the introduction of the Pindrop Pulse® technology, as an add-on to the full Product Suite,
      Pindrop now offers its customers technology designed to detect and alert against synthetic voice fraud attacks in
