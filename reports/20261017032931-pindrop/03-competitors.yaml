figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The assigned evidence positions Pindrop above broader alternatives on voice-security
      specialization, but below full contact-center platforms on workflow breadth.
    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
        lowLabel: Point workflow
        highLabel: Multi-workflow platform
        description: Ordinal score from assigned evidence on how much adjacent workflow scope the category covers.
        scale: 1-5 ordinal
      yAxis:
        label: Voice-security specialization
        min: 1
        max: 5
        lowLabel: Generic
        highLabel: Specialist
        description: Ordinal score from assigned evidence on how explicitly the category focuses on passive authentication, fraud, and deepfake defense.
        scale: 1-5 ordinal
      points:
        - label: Pindrop
          x: 3
          y: 5
          note: Bundled specialist suite across passive auth, fraud scoring, deepfake detection, and AI-agent screening.
        - label: NICE class
          x: 5
          y: 2
          note: Broader contact-center platform breadth, but assigned evidence does not show equal voice-security specialization.
        - label: Genesys class
          x: 5
          y: 1
          note: Full cloud contact-center platform in assigned evidence, not a specialist fraud stack.
        - label: Nuance/Microsoft class
          x: 4
          y: 2
          note: Broader speech-recognition and NLP scope than the specialist voice-security job.
        - label: Verint
          x: 4
          y: 2
          note: Workforce and analytics adjacency broadens scope but not proven deepfake specialization in this pool.
        - label: Twilio/Vonage class
          x: 2
          y: 1
          note: Flexible communications infrastructure route, but no packaged passive-auth or deepfake workflow evidenced here.
        - label: Security questions/manual review
          x: 1
          y: 1
          note: Existing substitute with minimal new workflow breadth and weak protection against sophisticated impersonation.
    approximationNotes: >-
      Coordinates are ordinal judgments anchored to the assigned evidence set, not market-share
      measurements or independent benchmark scores.
    claimRefs: [CP001, CP003, CP005, CP006, CP008, CP011]
callouts:
  - calloutType: insight
    title: Pindrop's clearest differentiation is bundle depth, not broadest platform scope
    body: >-
      The assigned pool repeatedly positions Pindrop as the specialist that combines passive
      authentication, fraud scoring, and deepfake detection for real-time voice workflows,
      while most alternatives surface as broader CX, speech, or infrastructure platforms.
    claimRefs: [CP002, CP004, CP005, CP006]
  - calloutType: risk
    title: Public comparison data is too thin to call the moat fully proven
    body: >-
      Competitor pricing, direct win-loss data, and independent head-to-head benchmarks are
      mostly absent from the assigned evidence, so the market story is directionally strong
      but still under-instrumented for underwriting.
    claimRefs: [CP007, CP011, CP012, CP014]
