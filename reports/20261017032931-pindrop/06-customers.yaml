  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Public outcome
      - Limitation
    rows:
      - - FNBO
        - Large US bank
        - Protect and Passport in call-center fraud/authentication, Pulse before launch, Fraud Assist for investigations
        - Protect and Passport appear in production; Pulse was a beta use before February 2024 launch
        - 35%-40% faster investigations, 11-13 minutes saved per case, and partner-quoted 34% better-than-projected fraud-loss cuts
        - Quantified outcomes are vendor or partner mediated rather than independently audited
      - - M&T Bank
        - Regional US bank
        - Call-center authentication and fraud prevention
        - Public materials describe a live customer journey rather than a pilot
        - Presented as using Pindrop to stay ahead of fraudsters while maintaining customer experience and trust
        - No public KPI, contract value, or renewal disclosure
      - - HealthEquity
        - Healthcare-finance / benefits administrator
        - Contact-center risk analysis layered into existing ecosystem
        - Production customer story
        - More than 90% reduction in voice fraud
        - Baseline, time period, and independent audit are not public
      - - Michigan State University Federal Credit Union
        - Credit union
        - Protect deployment plus ongoing fraud detection and authentication workflows
        - Production customer story
        - More than $2.57 million in prevented losses, 220+ fraudulent calls identified, and customer/partner claims of faster authentication
        - Public proof is mostly vendor or partner distributed
    notes: >-
      Partial enumeration of customers explicitly named in reviewed sources;
      rows require direct deployment language or measurable outcome proof.
