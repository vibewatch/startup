figures:
  - id: FU001
    title: Customer adoption surfaces and expansion path
    type: journey-map
    summary: >-
      Public proof implies an enterprise voice-security land-and-expand motion
      from fraud pain points into authentication, deepfake controls, and
      investigation workflows.
    data:
      items:
        - label: Enterprise voice-fraud entry point
          actor: Bank, insurer, or healthcare service leader
          phase: Initial wedge
          channels:
            - Direct enterprise sale
            - Partner-led sale through contact-center ecosystems
          touchpoints:
            - IVR fraud exposure
            - Live-agent risk context
          detail: Breadth claims are strongest in regulated, voice-heavy contact-center environments.
          tone: positive
        - label: Protect deployment
          actor: Fraud and contact-center operations teams
          phase: First production workflow
          touchpoints:
            - Real-time risk scoring
            - Look-back scoring after the call
          detail: Public customer stories most often start with fraud detection in IVR and agent workflows.
          tone: positive
        - label: Passport rollout
          actor: Authentication and CX owners
          phase: Workflow expansion
          touchpoints:
            - Replace KBAs and OTP-heavy flows
            - Passive caller authentication
          detail: M&T's public story emphasizes stronger authentication without sacrificing customer trust.
          tone: positive
        - label: Pulse and BotStopper add-on
          actor: Trust and fraud teams
          phase: Deepfake / bot layer
          touchpoints:
            - Synthetic voice screening
            - High-risk account recovery and claims calls
          detail: Pindrop's expansion story increasingly layers deepfake detection onto existing voice-security deployments.
          tone: neutral
        - label: Fraud Assist and analyst workflow
          actor: Fraud investigation teams
          phase: Post-call expansion
          touchpoints:
            - Case summaries
            - Investigation acceleration
          detail: FNBO evidence suggests product expansion can move from front-line controls into analyst productivity tooling.
          tone: positive
        - label: Multi-year bundle and channel dependence
          actor: Procurement, partner, and legal stakeholders
          phase: Commercial scaling
          channels:
            - NiCE
            - Zoom Contact Center
            - AWS Marketplace
            - FICO Marketplace
          touchpoints:
            - Three-year Pulse warranty bundle
            - Full-suite procurement
          detail: Expansion upside is visible, but public data does not show whether multi-product bundles translate into renewals or diversified revenue.
          tone: warning
    approximationNotes: >-
      Sequence shows the public adoption pattern implied by reviewed sources,
      not a universal customer lifecycle or measured conversion funnel.
    claimRefs: [CU005, CU011, CU013]
callouts:
  - calloutType: strength
    title: Multi-product proof is stronger than logo proof
    body: >-
      FNBO, HealthEquity, and MSUFCU give Pindrop more than superficial logo
      evidence because public materials tie those accounts to production use
      cases and quantified outcomes, even if the metrics remain vendor-led.
    claimRefs: [CU005, CU007, CU008, CU009]
  - calloutType: risk
    title: Durability is still a black box
    body: >-
      Public breadth and outcome anecdotes do not answer the investor-grade
      questions about churn, renewals, cohort expansion, or top-customer
      concentration, so customer quality remains under-verified.
    claimRefs: [CU002, CU003, CU012, CU013]
