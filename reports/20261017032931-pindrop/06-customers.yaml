schemaVersion: "report-v2"
artifact: customers
slug: pindrop
runDate: 2026-10-17
company:
  name: Pindrop
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof shows Pindrop selling primarily into large regulated
    voice-heavy institutions - especially banks, insurers, healthcare finance,
    and credit unions - with the strongest named deployment evidence around
    FNBO, M&T Bank, HealthEquity, and MSUFCU. The commercial story appears to
    be land-and-expand across Protect, Passport, Pulse, and Fraud Assist, but
    durability evidence remains weak because public sources do not disclose
    churn, renewal, NRR, or customer concentration.
sections:
  - id: customer-footprint
    title: Customer footprint skews enterprise and regulated
    body: >-
      The reviewed customer evidence points to an enterprise-skewed customer
      base concentrated in regulated voice-heavy workflows rather than broad
      self-serve adoption. Public breadth claims are strongest in banking,
      insurance, healthcare-finance, and credit-union contact centers: a
      BankingNewsAI review says Pindrop serves 14 of the top 20 US banks, while
      a case-study aggregator says Pindrop has been implemented in 8 of the top
      10 US banks, 5 of the top 7 US life insurers, and that 70% of Pindrop US
      customers are Fortune 500. The catch is that the named proof set is much
      thinner than the breadth claims. In the reviewed materials, FNBO and M&T
      Bank are the clearest named bank references, while Optum Financial sits
      adjacent to banking but is not itself the named bank entity. That mix
      supports a view that Pindrop can win large accounts, but not that public
      disclosure is deep enough to judge account count, segment mix by revenue,
      or concentration.
    claimRefs: [CU001, CU002, CU003, CU012, CU014]
    tableRefs: [TU001, TU002]
  - id: named-deployments
    title: Named deployments show production usage and multi-product expansion
    body: >-
      The best public proof is not logo presence but customer stories that tie
      Pindrop to production workflows and measurable outcomes. FNBO appears to
      have expanded from Protect and Passport into Pulse and then Fraud Assist,
      which is stronger proof of adoption depth than a single use case. M&T
      Bank is positioned as an active customer using Pindrop to stay ahead of
      fraudsters in its call center while preserving customer experience. In
      adjacent regulated categories, HealthEquity and MSUFCU provide the most
      concrete outcome language: more than 90% voice-fraud reduction at
      HealthEquity, and more than $2.57 million in prevented losses plus more
      than 220 fraudulent calls identified at MSUFCU in its first year. The
      limitation is that the strongest quantified outcomes remain vendor- or
      partner-mediated rather than independently audited.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Expansion potential is visible, but durability and concentration are opaque
    body: >-
      Pindrop's customer motion looks compatible with a land-and-expand sale:
      initial fraud or authentication deployment, add-on deepfake detection,
      then workflow expansion into investigation tooling and adjacent channels.
      Public distribution paths through NiCE, Zoom Contact Center, AWS
      Marketplace, and FICO Marketplace also suggest that channel partners and
      bundled procurement matter to growth. The September 2026 Pulse Warranty
      makes that more explicit by tying reimbursement eligibility to a standard
      three-year Pulse subscription bundled with the full product suite and
      limited to US and Canadian customers. What remains missing is durability:
      the reviewed public sources do not disclose NRR, GRR, churn, renewal
      rates, contract length by cohort, customer count, or top-customer
      exposure, so investors can see adoption anecdotes and expansion pathways
      without being able to test whether the installed base is sticky or
      concentrated.
    claimRefs: [CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Revenue / strategic value signal
      - Diligence gap
    rows:
      - - Top-tier US banks
        - Fraud, identity, and contact-center leaders / agents and investigators / enterprise security budgets
        - Voice fraud detection, passive caller authentication, deepfake screening, and case investigation
        - Vendor-reported claim of 14 of the top 20 US banks; named bank proof centers on FNBO and M&T
        - Regulated flagship accounts create reference value and multi-product expansion potential
        - Named account list, contract values, and share of revenue are not public
      - - US life insurers
        - Fraud and servicing leaders / claims and service agents / enterprise software budgets
        - Authentication and fraud prevention in member or policyholder service centers
        - Case-study aggregator says 5 of the top 7 US life insurers use Pindrop
        - Suggests adjacency beyond banking into similar voice-risk workflows
        - Public sources do not name the insurers or describe deployment depth
      - - Healthcare-finance and payer workflows
        - Member-service, fraud, and trust teams / service agents and analysts / ops and risk budgets
        - Voice fraud reduction, bot detection, and account-protection workflows
        - Optum Financial and HealthEquity are the clearest named proofs
        - Supports thesis that Pindrop can cross into healthcare-sensitive workflows
        - Public evidence does not separate pilot from enterprise-wide deployment scope
      - - Credit unions and community financials
        - Fraud managers and call-center leaders / agents and fraud analysts / operating budgets
        - Authentication, fraud detection, and post-call investigation
        - Affinity Plus, CommunityAmerica, MSUFCU, and United Community Bank appear in case-story listings
        - Outcome-driven case stories suggest strong fit in mid-market financial institutions
        - Most proof is vendor or partner distributed rather than independently audited
      - - Broader enterprise and public-sector contact centers
        - Security and service leaders / service teams / department or program budgets
        - Voice trust in retail, telecom, benefits, and government service workflows
        - Case-story listings mention a large ecommerce retailer, Waystar, Next Caller, and the Virginia Employment Commission
        - Shows TAM beyond banks while still anchored to voice-risk workflows
        - Public evidence does not quantify how much revenue comes from non-financial segments
    notes: >-
      Sources mix vendor, partner, and aggregator evidence; scale signals are
      directional rather than audited customer-count disclosures.
    claimRefs: [CU001, CU002, CU003, CU014]
