  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: pricing-opacity
      missingEvidence: Signed pricing schedules, ACV by product, discount bands, term lengths, renewal cohorts, and services attachment rates.
      whyItMatters: Revenue quality cannot be underwritten without knowing what customers actually pay and how much implementation revenue is mixed into recurring software.
      diligencePath: Request recent order forms, standard MSA exhibits, and a cohort view of booked ACV versus realized ARR by product.
      relatedQuestionRefs: [QI001, QI005, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: CAC, payback, win rate, sales cycle, reseller economics, and gross-margin bridge by product.
      whyItMatters: Public ROI anecdotes do not show whether growth is efficient or whether services and support consume most of the gross profit pool.
      diligencePath: Ask for sales funnel, channel rebate, and gross-margin dashboards for the last four quarters.
      relatedQuestionRefs: [QI003, QI006, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Cash balance, monthly burn, runway, debt covenants, undrawn facilities, and refinancing timetable.
      whyItMatters: Financing dependency and warranty obligations cannot be judged without liquidity and covenant headroom.
      diligencePath: Obtain the latest board package, debt agreement summary, covenant calculations, and cash forecast.
      relatedQuestionRefs: [QI004, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: revenue-mix
      missingEvidence: Product-level ARR or revenue mix among Protect, Passport, Pulse, and adjacent meeting-security offerings.
      whyItMatters: Without mix data, investors cannot tell whether recent traction is concentrated in one transient workflow or spread across durable modules.
      diligencePath: Request product P&L and bookings mix for the last six quarters.
      relatedQuestionRefs: [QI001, QI002, QI003]
      relatedTableRefs: [TI001]
    - type: conflicting-data
      severity: material
      topic: external-estimates
