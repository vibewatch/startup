      - Diligence ask
    rows:
      - ["Protect fraud detection", "Enterprise subscription within the contact-center suite", "Account/workflow coverage", "Live fraud-risk scoring for IVR and agent workflows", "Official packaging visible; realized pricing unavailable", "Break out Protect ARR, attach rate, renewal, and services content by cohort."]
      - ["Passport passive authentication", "Enterprise subscription/module within the same platform", "Authenticated callers / covered interactions", "Passive caller authentication marketed alongside fraud detection", "Workflow role visible; contract economics unavailable", "Provide Passport ACV, gross margin, and penetration by installed base."]
      - ["Pulse audio deepfake detection", "Add-on module tied to full Product Suite subscription", "Protected calls / enabled accounts", "Warranty document ties Pulse to a standard 3-year subscription and full Product Suite", "Commercial structure partly visible; paid uptake and reserves opaque", "Disclose Pulse price, attach rate, warranty reserve policy, and paid conversion."]
      - ["Adjacent meeting-security offer", "Separate solution family on the same brand surface", "Protected meetings / enabled users", "Product presence visible but no revenue contribution disclosed", "Possible expansion vector but no monetization data", "Quantify bookings mix between contact-center security and meeting-security products."]
    notes: >-
      Public pages show packaging and workflow coverage, not realized pricing; "Current value/status"
      records only what the assigned source set actually discloses, and undisclosed economics remain a
      diligence blocker rather than an implied zero.
    claimRefs: [CI003, CI004, CI006, CI009]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / term
      - Public pricing signal
      - List vs realized
      - Source-backed note
      - Implication
    rows:
      - ["Full Product Suite + Pulse warranty term", null, "Only packaging term is public", "Pulse warranty is offered at no additional cost only with a standard 3-year Pulse subscription and the full Product Suite", "Suggests bundling/upsell logic, but not realized ASP or margin."]
      - ["Protect / Passport / Pulse operating stack", null, "List and discount schedules unavailable", "Official product pages describe outcomes and workflows, not price cards or contract ranges", "Cannot estimate ACV, discounting, or revenue mix from public materials."]
      - ["Customer ROI case studies", null, "Value proof rather than pricing proof", "Official and third-party pages cite fraud reduction and avoided-loss outcomes without quoting fees", "Demand signals exist, but monetization remains un-underwritable."]
    notes: >-
      Null values mean the reviewed public evidence did not disclose price points; they do not imply free
      usage except where the warranty explicitly says Pulse is included at no additional cost within a
      broader subscription structure.
    claimRefs: [CI004, CI007, CI009, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR", ">$100M as of 2025-04-24 announcement", "Medium-high", "Shows real scale and enterprise adoption momentum", "Provide audited ARR bridge, growth by product, and ARR-to-revenue conversion."]
      - ["Annual revenue", "$25M-$100M estimate on Owler", "Low", "Directional context only and not directly comparable to ARR", "Reconcile audited revenue with ARR and services mix."]
      - ["Headcount", "250-500 estimate on Owler", "Low", "Rough proxy for operating scale and burn footprint", "Provide current headcount by function and hiring plan."]
      - ["CAC / payback / sales efficiency", null, "Unavailable publicly", "Needed to judge whether growth is efficient or subsidy-driven", "Disclose CAC, payback, win rate, sales cycle, and channel take-rates."]
      - ["Gross margin / delivery cost", null, "Unavailable publicly", "Determines software quality, services intensity, and margin path", "Provide gross margin by product plus implementation and support burden."]
      - ["Cash / burn / runway / debt terms", "Debt-facility dependency cited; cash metrics undisclosed", "Low", "Critical to judge capital adequacy and financing dependency", "Provide cash balance, monthly burn, runway, debt covenant package, and refinancing schedule."]
    notes: >-
      Nulls mark private or undisclosed metrics. Low-confidence rows are third-party estimates rather than
      audited disclosures, and the debt-facility row records only what the assigned public source set states.
    claimRefs: [CI001, CI010, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows customer activity converting into layered subscription value, but not into a
      fully underwritable margin model.
    data:
      nodes:
        - id: demand
          label: Regulated inbound voice interactions
          note: Identity, fraud, and access decisions happen inside IVR and live-agent workflows.
        - id: protect
          label: Protect scores live fraud risk
          note: Official page positions Protect across the full caller journey from IVR through agent handling.
        - id: passport
          label: Passport passively authenticates callers
          note: Authentication is sold as a separate but complementary layer in the same platform.
        - id: pulse
          label: Pulse adds deepfake and liveness screening
          note: Official page claims ~2 seconds to detect a deepfake and 99% known-engine accuracy.
        - id: subscription
          label: Enterprise suite subscription
          note: Warranty ties Pulse to a standard 3-year subscription plus the full Product Suite.
        - id: outcomes
          label: Customer ROI evidence
          note: Pindrop cites >90% lower fraud, 35%-40% lower investigation time, and $2.57M+ reduced exposure.
        - id: gap
          label: Revenue quality still blocked
          note: Public sources do not disclose realized pricing, margin, CAC/payback, cash, or runway.
      edges:
        - from: demand
          to: protect
          label: risk scoring begins during the call
        - from: protect
          to: passport
          label: identity confidence can be layered on top
        - from: passport
          to: pulse
          label: synthetic-voice screening adds another risk signal
        - from: pulse
          to: subscription
          label: modules bundle into suite economics
        - from: subscription
          to: outcomes
          label: value proposition is expressed in avoided loss and handling efficiency
        - from: outcomes
          to: gap
          label: ROI proof exists, but unit economics remain undisclosed
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI009, CI013]
callouts:
  - calloutType: risk
    title: Public traction is real, but underwriting is not
    body: >-
      The assigned evidence supports product-market relevance and material enterprise demand, yet it still
      lacks the realized pricing, margin, CAC/payback, and liquidity disclosures required to underwrite
      quality of revenue or capital adequacy with conviction.
    claimRefs: [CI001, CI005, CI009, CI013]
