company:
  name: Pindrop
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pindrop remains a privately held Atlanta voice-security company now framing itself as an
    identity-trust platform for contact centers, meetings, and AI-agent interactions. Assigned
    evidence supports the 2011 founding team, a still-visible CEO founder, a broad venture roster,
    and current commercialization claims around BotStopper, Pulse, Protect, and Passport, but it
    does not substantiate a current valuation, total capital raised beyond older rounds, or current
    headcount and customer counts.
sections:
  - id: identity-and-positioning
    title: Identity and current positioning
    body: >-
      Current official materials position Pindrop as an enterprise platform for deepfake detection,
      identity verification, and fraud decisioning across real-time voice and video workflows rather
      than as a single-point call-center tool. The current product stack publicly spans Protect for
      fraud detection, Passport for passive authentication, Pulse for deepfake detection, and
      BotStopper for AI-agent detection, which indicates that the company is trying to own the
      broader "is this identity real, known, and safe" layer across customer, workforce, and agent
      interactions. Publicly assigned evidence still anchors the business in Atlanta and supports the
      view that Pindrop remains private, but several headline metrics that matter for later diligence
      work — current revenue, customer count, and employee base — are not supported in this chapter
      pool and should be treated as open diligence items rather than inferred from stale profiles.
    claimRefs: [CO001, CO002, CO003, CO008, CO009, CO011]
    tableRefs: [TO001]
  - id: leadership-ownership-and-governance
    title: Leadership, ownership, and governance
    body: >-
      The most stable ground-truth facts in the assigned pool are the 2011 founding date, the
      founder trio of Vijay Balasubramaniyan, Paul Judge, and Mustaque Ahamad, and Vijay's ongoing
      role as the public CEO and co-founder in 2025-2026 materials. The evidence also supports a
      venture-backed ownership profile that still names Andreessen Horowitz, Citi Ventures, Felicis,
      CapitalG, GV, IVP, and Vitruvian, but it does not show board composition, control rights,
      liquidation preferences, or any debt terms. Funding history is only partly refreshed: older
      public reporting still documents early rounds through the 2016 Series C and a then-disclosed
      $122 million cumulative total, while newer assigned sources name investors without updating the
      current cap table, most recent priced round, or any current valuation. That makes leadership
      continuity clear enough for chapter-one context, but governance and capitalization remain live
      diligence asks.
    claimRefs: [CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO002, TO003]
    figureRefs: [FO001]
  - id: commercialization-proof-and-current-constraints
    title: Commercial proof points and current constraints
    body: >-
      Assigned current proof points support real commercial traction, but mostly through company or
      partner surfaces rather than independent benchmarks. Pindrop's September 2026 BotStopper
      launch extends the platform into standalone AI-agent detection and pairs that launch with a
      managed registry of more than 5,000 AI voices. A live Zoom Contact Center marketplace listing
      and Pindrop's own integration language both support a channel-and-platform distribution story,
      while company-issued case examples cite measurable customer outcomes at HealthEquity, First
      National Bank of Omaha, Michigan State University Federal Credit Union, and Optum Financial.
      The main offset is that the new Pulse Warranty should not be read as unconditional loss
      coverage: the legal terms limit eligibility to full-suite Pulse subscriptions in the U.S. and
      Canada, impose reimbursement caps, and carve out multiple scenarios outside Pindrop's control.
      Publicly visible momentum is therefore meaningful, but readers should separate deployment proof
      from independently verified economics or guaranteed liability transfer.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
