  - id: scenario-analysis
    title: "Scenario Analysis: Bull, Base, and Bear Cases"
    body: >-
      The valuation outcome hinges on three macro variables: revenue growth rate through 2027, gross margin
      trajectory as the product mix shifts from agency/SMB toward enterprise, and net revenue retention in a
      market that has demonstrated NRR compression even at ZoomInfo (87% in FY2024). An exit multiple in the
      8–15× ARR range (consistent with premium-growth-stage SaaS acquisitions) applied to different scenario
      outcomes drives the range of investor returns from the current $5B entry.


      In the bull case, Clay sustains 3× ARR growth per year—reaching approximately $300M ARR by end 2026 and
      $900M ARR by end 2027—driven by rapid enterprise up-sell, Sequencer/Signals product adoption, and MCP
      integrations that embed Clay natively into agentic AI workflows. Gross margin expands to 70%+ as the
      enterprise mix grows. NRR is confirmed above 120% from a data room. A strategic acquirer (HubSpot,
      Salesforce, or a platform buyer) or IPO at 12–15× 2027 ARR yields a $10–14B exit. At $5B entry and
      25–30% dilution to new investors, the bull case delivers a 2–3× gross return over 3–4 years.


      In the base case, Clay grows ARR at 2.5× per year—reaching $250M ARR by end 2026 and $625M ARR by end
      2027. Gross margin stabilizes at 60–65%, NRR is confirmed at 105–115%, and enterprise expansion
      materializes but slower than the bull case. IPO or strategic exit at 9–11× 2027 ARR yields a $5.5–7B
      outcome. At $5B entry, the base case produces minimal to modest return (1.1–1.4×) over 4–5 years—
      insufficient for venture returns, adequate for secondary/crossover investors with a 5-year horizon and
      lower target multiples.


      In the bear case, ARR growth decelerates to 1.5× per year as the agency channel saturates and enterprise
      adoption stalls on compliance concerns. NRR is below 100% in the SMB segment. Gross margin remains below
      60% due to data-passthrough costs. A flat-to-down round or strategic exit at 4–6× ARR yields a $2–3B
      outcome, representing a 40–60% loss from the $5B entry.
