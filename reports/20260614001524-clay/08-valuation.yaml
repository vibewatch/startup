  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: NRR
      missingEvidence: "Net revenue retention rate by customer segment (enterprise, mid-market, agency, self-serve) with at least 4 quarters of cohort data; any public proxy or channel-survey data on churn rates"
      whyItMatters: "NRR is the single most critical input for valuing a consumption-based SaaS company; the difference between 90% and 120% NRR at $100M ARR produces a 3–5× difference in achievable exit valuation at a 10× ARR multiple"
      diligencePath: "Data room request; CFO or VP Finance interview; secondary research on Claygency attrition patterns as an NRR proxy"
      relatedQuestionRefs:
        - QV024
        - QV025

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
