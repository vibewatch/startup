  - id: exit-readiness-diligence
    title: "Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks"
    body: >-
      Clay's exit readiness is premature for an IPO on the current evidence base. The company has no
      audited public financials, no disclosed NRR or gross margin, and a privacy policy last updated before
      its current product suite existed. The tender-offer cadence—three valuation events in nine months—
      suggests deliberate founder management of liquidity rather than IPO preparation. The most likely
      exit pathway within a 3–5 year horizon is either a strategic acquisition (most plausibly by HubSpot,
      Salesforce, or a large enterprise platform that needs a GTM-data layer) or an IPO at $10B+ scale if
      ARR reaches $500M+.


      Several specific factors would break the investment thesis: (1) ARR growth decelerating below 2× YoY
      for two consecutive quarters; (2) NRR confirmed below 100% in any disclosed segment; (3) gross margin
      confirmed below 55%, implying the data-passthrough cost structure limits scalability; (4) a successful
      GDPR/CCPA enforcement action against Clay or a leading Claygency; (5) HubSpot or Salesforce launching
      a native enrichment waterfall product that commoditizes the core data-aggregation value proposition.


      The most critical final diligence asks are: (1) audited or reviewed financial statements for FY2024
      and Q1–Q3 2025 showing GAAP revenue, gross margin, and cash position; (2) NRR by segment (enterprise,
      mid-market, agency, self-serve) with cohort retention curves; (3) cap table and preference stack with
      liquidation waterfall at $2B, $3.1B, and $5B exit scenarios; (4) data processing agreements with top
      10 enrichment providers, evidence of GDPR lawful-basis documentation, and SOC2 Type II report; and
      (5) customer concentration disclosure (top 10 customers as % of ARR). Without these, the current
      $5B entry price cannot be underwritten with high confidence.
