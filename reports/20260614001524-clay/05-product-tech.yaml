chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Clay is a cloud-based GTM data-orchestration platform that integrates 150+ third-party data providers
    through a no-code, spreadsheet-style interface, enabling revenue teams to automate prospect research,
    enrichment waterfalls, AI-powered outreach, and CRM sync at scale. The platform's core IP lies in its
    waterfall orchestration engine, Claygent AI-agent layer, and MCP-based workflow packaging—not in the
    underlying contact databases, which are licensed from third parties. Trust and compliance controls are
    materially underdeveloped relative to enterprise expectations: the trust center is sparse, the privacy
    policy predates current product capabilities, and no SOC2 or GDPR certification is documented.

sections:
  - id: workflow-and-modules
    title: "Product Definition and Module Map"
    body: >-
      Clay operates as a GTM data-orchestration layer positioned between raw third-party data providers and
      revenue-team activation channels. In customer workflow terms, the platform spans five sequential stages:
      (1) data sourcing—pulling company and contact records from Clay's proprietary dataset and 150+ integrated
      providers; (2) waterfall enrichment—sequentially querying multiple providers and charging credits only on
      a successful match, pushing contact coverage from a typical single-provider ~30% to ~80% or higher;
      (3) AI research—Claygent agents browse the web, analyze public information, and generate personalized
      content, with Claygent Builder providing an IDE-style environment for authoring, testing, and deploying
      production-ready agents; (4) orchestration—Signals monitors trigger events (job changes, funding
      announcements, website visits, SOC2 certifications) and fires automated Clay workflows; and (5)
      activation—pushing enriched, scored records to CRM (Salesforce, HubSpot), outbound sequences (Clay
      Sequencer, Salesloft, Outreach), paid-media platforms (LinkedIn, Meta, Google via Clay Ads), and AI
      interfaces (Claude, ChatGPT, Codex via Clay MCP/Functions).

      Clay's product-line map spans nine distinct modules: the core table/workflow engine, waterfall enrichment,
      Claygent AI agents, Claygent Builder, Signals, Sequencer, Ads, MCP/Functions, and Clay University. The
      Audiences feature (enterprise, beta as of mid-2026) is a unified GTM data repository accessible across
      all modules. A-LIGN replaced $60K/year in manual research with Clay automated workflows in one month,
      achieving 450K insights versus 30K previously; Coverflex added 200+ demos per month by monitoring
      signals across 3M+ companies; Oyster saved 40 hours per month per sales rep through intent-based
      automation; and Sendoso attributed $1M in pipeline to Clay-driven outbound.
