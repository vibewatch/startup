  - id: architecture-and-operating-model
    title: "Architecture and Operating Model"
    body: >-
      Clay's architecture is a multi-layer cloud SaaS platform with no publicly documented self-hosted
      deployment option. The data acquisition layer calls third-party provider APIs on demand; the waterfall
      orchestration engine sequences these calls, routes retries, and triggers billing only when a match is
      found. Above that, the Claygent AI layer invokes large language models (OpenAI and selectable alternatives
      configurable in Claygent Builder) to execute web-research tasks, content generation, and ICP scoring.
      The workflow/automation layer runs asynchronous enrichment jobs, signal-detection routines, and
      sequence-enrollment logic. The integration layer performs bidirectional sync with CRM, sales-engagement,
      and data-warehouse targets including Salesforce, HubSpot, Salesloft, Outreach, Snowflake, and Dynamics 365.
      The MCP protocol layer exposes packaged GTM workflows (Functions) to external AI interfaces, with
      admin-controlled permissions and per-user credit budgets.

      The no-code interface abstracts all of this into a row-column table where each row is a prospect and each
      column is an enrichment action. Users build "waterfalls" by chaining providers in priority order; the engine
      stops querying once a match is found, avoiding duplicated cost. Claygent Builder (launched May 2026) adds
      version control, free-test mode against production data, model-switching, and a conversational "Sculptor"
      UI for iterative prompt refinement. A January 2026 changelog release noted 22x faster action runs and
      10x faster AI processing. The cloud infrastructure provider is not publicly disclosed; no SLA for
      platform uptime is published.
