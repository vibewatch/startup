  - id: deployment-integration-roadmap
    title: "Deployment, Integration, and Roadmap"
    body: >-
      Clay deploys exclusively as a multi-tenant cloud SaaS product with no on-premises or single-tenant
      option advertised on its enterprise page. Integrations span three categories: (a) CRM and data warehouse
      destinations—Salesforce (including SOQL-as-a-source added January 2026), HubSpot, Snowflake, Dynamics
      365, and Google BigQuery (coming soon); (b) sales-engagement platforms—Salesloft, Outreach, Smartlead,
      HubSpot Sequencer, and Gong; and (c) data-enrichment providers—150+ APIs covering contact data
      (Lusha, Apollo, FullEnrich), firmographics, technographics (HG Insights, BuyerCaddy), company
      intelligence (Beauhurst for UK/Germany, Ocean.io lookalike database of 2.5M+ companies), and intent
      data. All provider calls are routed through Clay's enrichment engine rather than direct customer-to-API
      contracts, simplifying procurement.

      Support is delivered through Clay University (structured courses, instructor-led cohorts), the Community
      platform (500K+ users sharing templates and workflows), and enterprise customer success. No self-serve
      SLA or uptime commitment is published. Product velocity is high: the changelog recorded eleven distinct
      feature releases between January and June 2026, including Functions (April 2026), Claygent Builder
      (May 2026), Clay MCP in OpenAI Codex (June 2026), Attio CRM integration (March 2026), Table Versioning
      and Changelog (March 2026), SOQL-as-a-source (January 2026), and a 22x performance improvement
      (January 2026). Audiences (enterprise beta) represents the forward roadmap anchor, converting Clay
      from a workflow tool into a persistent GTM data platform.
