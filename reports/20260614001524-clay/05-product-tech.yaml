  - id: trust-security-compliance
    title: "Trust, Security, Privacy, and Compliance"
    body: >-
      Clay's trust posture lags its product maturity. The trust center (trust.clay.com) is publicly accessible
      but contains only branding, with no documented security certifications (SOC2, ISO 27001), no published
      uptime history, and no subprocessor list. The privacy policy was last updated in September 2020—before
      Clay's current B2B data-enrichment, waterfall, Claygent, MCP, Signals, Sequencer, and Ads capabilities
      existed—creating a material gap between policy scope and product reality. Clay processes personal data
      from third-party providers to enable B2B prospecting; under the GDPR (EU), PECR (UK), and CCPA
      (California), this activity requires documented lawful bases, data-subject rights workflows, and in some
      jurisdictions explicit categorization as a data broker. None of these are publicly documented by Clay.

      For comparison, Cognism holds IAB Europe GDPR PECR Gold Champion certification and publishes a
      dedicated compliance page describing its legal basis, opt-out registry, and DPA framework. Apollo's
      privacy policy explicitly labels its practices under CCPA and describes how it classifies as a data
      broker. Clay's published materials address neither. Payment processing is delegated to Stripe (PCI
      scope), which is appropriate, but this is the only clearly documented third-party security delegation.
      Enterprise B2B customers operating under strict security and compliance requirements (financial services,
      healthcare, government) face a documentation gap that could stall procurement without Clay providing
      direct DPA, SOC2, or equivalent assurance on request. This is the most consequential diligence gap
      for an enterprise motion.
    claimRefs:
