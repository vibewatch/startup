  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: "trust-security"
      missingEvidence: "SOC2 Type II or ISO 27001 audit report, or official confirmation that Clay holds no such certification"
      whyItMatters: "Absence of SOC2 blocks enterprise procurement in financial services, healthcare, and government sectors; cannot distinguish non-certification from non-disclosure without direct vendor confirmation"
      diligencePath: "Request SOC2 report, ISO 27001 certificate, or enterprise DPA directly from Clay's security team; review NDA data room if available"
      relatedQuestionRefs: [QE004]

    - type: missing-source
      severity: material
      topic: "privacy-compliance"
      missingEvidence: "Updated privacy policy covering current B2B data processing activities including waterfall enrichment, Claygent AI research, Signals, Sequencer, Ads, and MCP"
      whyItMatters: "The 2020 policy does not cover GDPR lawful basis documentation, CCPA data-broker obligations, or data subject rights workflows for third-party contact data—all required for EU and California compliance"
      diligencePath: "Request a Data Processing Agreement (DPA) from Clay's legal team; check if an updated policy exists behind login or in enterprise contract terms"
      relatedQuestionRefs: [QE016, QE024]

    - type: enumeration-incomplete
      severity: minor
      topic: "integrations"
      missingEvidence: "A complete, structured list of all 150+ integration providers with their data categories, pricing tiers, and geographic coverage"
      whyItMatters: "Provider mix determines enrichment coverage quality and geographic depth; identifying concentration risk (e.g., dependency on ZoomInfo/Apollo for >50% of coverage) requires the full catalog"
      diligencePath: "Request the complete provider list from Clay's sales team; cross-reference with Clay's integrations page filtering by category"
      relatedQuestionRefs: [QE007, QE019]

    - type: private-evidence-only
      severity: material
      topic: "deployment-architecture"
      missingEvidence: "Clay's cloud infrastructure provider, uptime SLA, and data-residency policies for enterprise customers"
      whyItMatters: "IaaS provider choice determines geographic data residency (EU vs. US), disaster recovery posture, and subprocessor disclosure obligations under GDPR; none are publicly documented"
      diligencePath: "Request infrastructure disclosure, uptime history, and DPA subprocessor annex from Clay's enterprise sales team during due diligence"
      relatedQuestionRefs: [QE011]

