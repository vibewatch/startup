      - number: '6.3'
        title: 'Named Customer Proof: Production Deployments and Quantified Outcomes'
        blocks:
          - type: paragraph
            body: >-
              Clay's customer evidence is unusually rich in named, outcome-specific case studies sourced from the
              company's own customer portal, corroborated by independent press coverage. All major deployments described
              below appear to be in production operation rather than pilot, based on language in case study materials:
              customers reference "continuous enrichment flows," "ongoing workflows," "recurring sourcing," and
              "week-over-week" adoption patterns.

              OpenAI is Clay's marquee reference customer. The company deployed Clay to handle inbound lead enrichment
              for ChatGPT Enterprise—initially under-staffed for the demand spike—and doubled enrichment coverage from
              the low 40% range to the high 80% range. Clay is now embedded in OpenAI's Salesforce as a native
              enrichment package (dubbed "Enrichment Actions"), with consistent weekly use across the sales team and
              8,500+ total enrichments run via the Salesforce integration. The deployment has since expanded beyond
              RevOps to the data science team (estimating knowledge-worker counts across OpenAI's user base) and the
              recruiting team.

              Anthropic deployed Clay to triple its enrichment coverage from prior single-source levels, apply AI
              scoring to all inbound self-serve sign-ups, and flag fraudulent email domains. As of the Series B
              expansion announcement (January 2025), Anthropic was generating meeting-prep notes for sales calls using
              Clay's AI agents.

              Figma used Clay Audiences to import its entire Salesforce CRM, perform identity resolution across all
              records, build always-on enrichment flows, and connect Snowflake product data to Clay segments for
              signal-based sales outreach. Figma also adopted Clay Ads to replace manual quarterly ad-audience exports
              with dynamically updated LinkedIn audiences—the first documented full-platform enterprise deployment
              covering enrichment, signals, CRM sync, and ads simultaneously.

              Intercom ran a month-long pilot to prove ROI on Fin (its AI support agent), sourcing 4,000+ accounts and
              enriching 21,000 contacts, and reported nearly $1 million in pipeline generated from that initial project.
              The deployment subsequently expanded to serve the entire GTM organization on a recurring basis.

              A-LIGN replaced a $60,000/year manual research contract (30,000 data points, 6 months) with Clay automated
              workflows (450,000 data insights, 1 month, ~$10,000 less than the prior contract). A-LIGN attributed $3.3M
              in closed revenue directly to competitive-displacement data generated by Clay over 6.5 months, and
              reported total pipeline growing from $132M in 2024 to $185M in 2025 (+40%), with gross expansion to
              existing customers exceeding new logo sales—a significant retention proof.

              Sendoso generated $1M+ in pipeline from Clay-driven outbound, achieved a 10x outbound productivity
              improvement for its SDR team, and documented a 20% increase in email response rates. Vanta built a
              multi-signal inbound enrichment and sales automation system achieving 80%+ contact coverage and adding
              thousands of new enriched contacts monthly, with follow-up time compressed from 3–4 days to same-day.
              Coverflex automated outreach to 3,000,000+ company TAM, adding 200+ demos per month and 5x-ing team output
              versus prior tools. Oyster saved approximately 40 hours per month per sales representative through
              intent-based outbound automation. Hex achieved a +50% win-rate improvement by replacing three vendors with
