  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - YoY ARR growth falls below 2× for two consecutive quarters
        - Destroys the base case; $5B entry would imply >30× forward ARR at a sub-$100M CAGR
        - Exit position; re-evaluate at $1.5–2B fair value
      - - NRR below 100% in any segment
        - NRR confirmed < 100% in SMB or agency cohort
        - Indicates churn exceeds expansion; consumption model's bull case depends on retention-driven upsell
        - Downgrade to avoid; the bear case becomes the base case
      - - Gross margin below 55%
        - Disclosed GM < 55%
        - Data-passthrough model structurally limits margin; SaaS premium multiples require 65%+ GM
        - Valuation must rebase to 15–20× ARR maximum; current $5B entry is 50× − repricing required
      - - Regulatory enforcement action
        - GDPR or CCPA enforcement targeting Clay or a major Claygency
        - Triggers customer churn (enterprise compliance gating), operational costs, and ARR deceleration
        - Escalate diligence on legal exposure; exit unless injunction scope is narrow
      - - Incumbent bundling at low price
        - ZoomInfo, HubSpot, or Salesforce bundle comparable enrichment waterfall at $0 add-on for existing customers
        - Eliminates Clay's core pricing advantage for mid-market accounts; disrupts agency economics
        - Re-evaluate competitive moat; track displacement rates among current Claygencies
    notes: Triggers are evidence-based but threshold levels are analyst judgments, not company-disclosed KPI floors.
    claimRefs:
