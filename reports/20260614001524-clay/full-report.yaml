companyProfile:
  summary: >-
    Clay, Inc. is a New York City-based B2B SaaS company founded in 2017 by Kareem Amin and Nicolae Rusan (with Varun
    Anand joining as co-founder in 2021 after Rusan's departure). The company provides a GTM development environment
    that combines 150+ third-party data enrichment integrations, AI research agents (Claygent), and end-to-end workflow
    automation in a spreadsheet-like interface. After six years of iteration, Clay found product-market fit in 2022 and
    grew revenue 10×, 10×, and 6× in consecutive years, reaching ~$30M in FY2024 and $100M ARR by December 2025. The
    company raised a $100M Series C led by CapitalG (Alphabet) at a $3.1B valuation in August 2025, and a January 2026
    employee tender offer led by DST Global set an implied valuation of $5B. Total primary capital raised is
    approximately $203M, with burn of "a few million dollars per year." Key investors include Sequoia, Meritech,
    CapitalG, DST Global, and HubSpot Ventures. Governance is concentrated around CEO Kareem Amin, who has declined to
    sell shares in tender offers, with Alfred Lin of Sequoia on the board. The primary diligence limitation is financial
    opacity: gross margin, NRR, LTV/CAC, and cap-table economics remain undisclosed, making the $5B implied valuation
    unverifiable from public evidence.
