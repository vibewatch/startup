        title: Differentiation — Technology, IP, and Category Position
        blocks:
          - type: paragraph
            body: >-
              Clay's differentiation rests on four pillars. First, the waterfall orchestration engine is proprietary
              software IP: the routing logic, credits-on-match billing model, and provider-agnostic abstraction layer
              are not replicable from any single third-party service. Second, Claygent Builder provides a full agent
              development lifecycle (build, test, version, deploy) within the platform, enabling customers to encode GTM
              logic that compounds as IP rather than as repeatable manual work. Functions extend this by packaging
              workflows as callable, governed primitives accessible from AI interfaces—something no competitor currently
              offers at parity. Third, Clay coined and has actively built the "GTM engineering" category since 2023; the
              500K+ user community represents a data-network effect where shared templates and workflows increase
              platform value without Clay bearing incremental cost. Fourth, early MCP integration positions Clay as the
              operational context layer for the emerging AI-agent GTM stack, reaching ChatGPT, Claude, and Codex users
