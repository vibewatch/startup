  - id: TE003
    title: Clay Technology / Operating Architecture
    columns:
      - Layer / Component
      - Role
      - Key Dependencies
      - Risk
    rows:
      - - Data acquisition layer
        - Calls 150+ third-party provider APIs on demand to fetch contact, firmographic, technographic, and intent data
        - Third-party APIs (ZoomInfo, Apollo, Lusha, Clearbit, HG Insights, Beauhurst, Ocean.io, etc.)
        - >-
          Provider API quota limits, TOS changes, or service discontinuation disrupt coverage; no long-term data
          exclusivity
      - - Waterfall orchestration engine
        - Sequences provider calls in priority order; charges credits only on successful match; routes retry logic
        - Clay proprietary routing and billing software
        - >-
          Misconfigured waterfalls can generate unexpected credit spend; fallback logic is user-defined, not
          platform-enforced
      - - Claygent / AI agent layer
        - Executes web research, structured data extraction, content generation, and ICP scoring using LLMs
        - OpenAI GPT models (primary) and selectable alternatives (Builder UI); internet access for web research
        - >-
          Model deprecation, cost changes, or quality regressions require workflow updates; model selection introduces
          vendor dependency
      - - Workflow / automation layer
        - Runs async enrichment jobs, Signals event detection, sequence enrollment, and MCP Function execution
        - Clay cloud infrastructure (undisclosed IaaS provider)
        - >-
          No published uptime SLA; cloud provider dependency not disclosed; outage in 2024 (reported anecdotally in
          community)
      - - Integration layer
        - >-
          Bidirectional sync to CRM (Salesforce, HubSpot, Dynamics 365), SEP (Salesloft, Outreach, Gong), and warehouse
          (Snowflake)
        - Partner API stability and auth credential management by customer
        - >-
          Partner API changes or deprecation require Clay integration updates; credential rotation is customer
          responsibility
      - - MCP protocol layer
        - >-
          Exposes Clay Functions to AI interfaces (ChatGPT, Claude, Codex) with admin-controlled permissions and credit
          budgets
        - OpenAI ChatGPT, Anthropic Claude, OpenAI Codex; MCP protocol specification
        - >-
          MCP protocol is an emerging standard; breaking changes could require Clay-side adaptation; governance maturity
          for enterprise unproven
      - - Data storage / workspace
        - Stores tables, enrichment results, workflow configs, and audit logs within Clay's managed cloud environment
        - Clay's internal cloud storage and compute (IaaS undisclosed)
        - >-
          Data residency, portability, and retention controls not publicly documented; enterprise DPA requirements unmet
          by default
    notes: >-
      Architecture inferred from official Clay product pages, changelog, MCP documentation, and enterprise page.
      Infrastructure provider, SLAs, and internal architecture diagrams are not publicly disclosed.
