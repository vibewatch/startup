              approximately 5,000+ paying customers as of January 2025. The $5B implied valuation from the January 2026
              tender offer implies a 50× ARR multiple against $100M ARR—a historically elevated multiple that is
              defensible only with exceptional NRR and gross margin, neither of which is disclosed.


              Material undisclosed metrics include gross margin, NRR, logo churn, LTV/CAC, customer concentration by
              segment, cash balance, and outstanding debt. The consumption model creates particular uncertainty: at high
              volumes, top customers may achieve significant per-unit discounts that compress realized margin below
              list-price estimates. Meanwhile, free-to-paid conversion from the 300,000+ registered users is opaque—it
              is unknown what fraction are free-tier only versus paying, or what the upgrade funnel looks like.
              ZoomInfo's 87% NRR in a declining market highlights that even well- established GTM data platforms can
              face churn pressure; for Clay, whose customers are often SMB-adjacent agencies and growth practitioners
              who may not have committed to annual contracts, the churn risk in a sales-cycle downturn is a real
