      - number: '8.2'
        title: Financing History, Current Valuation Context, and Investor Structure
        blocks:
          - type: paragraph
            body: >-
              Clay's financing history traces a rapid and unusual arc. The company raised a $2.5M seed led by First
              Round Capital, followed by a $13.5M Series A led by Sequoia in 2019 that went unannounced for five years
              while the team searched for product-market fit. By June 2024, Clay announced its $46M Series B at a $500M
              valuation led by Meritech Capital—its first public funding disclosure—alongside 10× YoY revenue growth for
              both 2022 and 2023. The Series B capital remained untouched through January 2025, when Meritech
              pre-emptively led a $40M Series B expansion at a $1.25B valuation following 6× revenue growth in 2024.
              Total primary capital raised through the Series B expansion was approximately $102M.


              The pace of valuation appreciation then accelerated dramatically. A first employee tender offer in May
              2025, led by Sequoia purchasing up to $20M in employee stock, set an implied valuation of $1.5B. CapitalG
              (Alphabet's venture firm) then led a $100M Series C primary round in August 2025 at a $3.1B valuation—the
              first time any investor confirmed a value above $1B in a primary arm's-length transaction. In January
              2026, a second employee tender offer led by DST Global (with participation from Conviction, Avra, and
              angels including Claire Hughes Johnson, former Stripe COO) set the implied valuation at $5B. Total primary
              capital across all rounds reaches approximately $202M, against a few million dollars per year in
              burn—implying that most of the capital raised is still on the balance sheet.


              Entry discipline is critical at these levels. The preference stack and liquidation preferences across six
              financing events are not publicly disclosed; Series C investors at $3.1B have 1× liquidation rights
              against a $5B implied common-stock valuation, meaning a modest exit below $3.1B could return capital to
              Series C holders ahead of common. Dilution accumulation across Seed, Series A, Series B, B-expansion, and
              Series C is likely in the 40–55% range for founders/employees, but the actual cap table is private.
              HubSpot's strategic investment through its venture arm creates a conflict: HubSpot is simultaneously
              investor, customer (via OpenAI and other mutual clients), potential acquirer, and competitor via Breeze
              Intelligence.
