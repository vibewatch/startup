          - type: callout
            title: Clay MCP server pre-empts agentic AI displacement
            body: >-
              By launching an MCP server in 2026, Clay has positioned itself as the enrichment infrastructure layer for
              LLM agents (Claude, ChatGPT) rather than competing with them. This is the most forward-looking competitive
