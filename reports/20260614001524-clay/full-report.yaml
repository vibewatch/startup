  - id: FR001
    title: Clay Risk Heatmap — Residual Severity by Likelihood and Investment Impact
    type: matrix
    layout: wide
    summary: >-
      Eight headline risks plotted by likelihood (horizontal) and investment impact (vertical), with residual severity
      encoded as cell color. Critical risks appear in the top-right quadrant; Low risks in the bottom-left. Mitigation
      maturity is reflected in the residual placement (a well-mitigated high-likelihood/high-impact risk moves toward
      the center).
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Impact
          values:
            - Security breach (no known incidents)
            - Privacy / GDPR enforcement [unmitigated]; Platform bundling [partial mitigation]
            - Provider API restriction [partial mitigation]
        - label: High Impact
          values:
            - Founder departure
            - Valuation multiple compression; AI hallucination at scale; IPO path closure
            - Data-stitching inconsistency [structural]
        - label: Medium Impact
          values:
            - 'Regulatory: CAN-SPAM enforcement'
            - Enterprise concentration; Claygency channel exit
            - Deliverability degradation [active mitigations]
        - label: Low Impact
          values:
            - Near-term solvency (burn is low)
            - Model pricing increase
            - null
    approximationNotes: >-
      Likelihood and impact ratings are analyst estimates based on public evidence as of June 2026. Mitigation maturity
      reflects only publicly observable controls. Private representations, certifications, or legal engagements not
      visible in public evidence may improve residual severity.
    claimRefs:
      - CR001
      - CR003
      - CR009
      - CR013
      - CR021
      - CR025
      - CR043
      - CR044
  - id: FR002
    title: Clay Risk Transmission Map — How Structural Risks Flow to Revenue, Margin, and Valuation
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how Clay's five structural risks transmit into revenue, margin, and valuation
      outcomes. Key transmission paths: privacy enforcement → enterprise churn → ARR decline → valuation compression;
      provider restriction → coverage decline → competitive loss → ARR stall; platform bundling → SMB substitution → ARR
      growth deceleration → multiple compression.
    data:
      nodes:
        - id: privacy-risk
          label: Privacy / GDPR Risk
          detail: Stale privacy policy; GDPR lawful-basis gap; Trust Center unverifiable; CCPA broker registration unknown
        - id: provider-risk
          label: Provider API Dependency
          detail: Top data providers restrict access, raise prices, or launch competing products; no owned data
        - id: bundling-risk
          label: Platform Bundling
          detail: >-
            HubSpot Breeze Intelligence, ZoomInfo platform, Apollo full-stack, Salesloft intelligence converge on Clay's
            use case
        - id: ai-quality-risk
          label: AI / Data Quality
          detail: Claygent hallucination; waterfall inconsistency; G2 data-readiness constraint
        - id: valuation-risk
          label: Valuation Multiple Risk
          detail: 50× revenue entry multiple; three tender offers in 9 months; no IPO path confirmed
        - id: enterprise-churn
          label: Enterprise Churn
          detail: Regulated-industry enterprise buyers cannot complete procurement without DPA/SOC2
        - id: coverage-decline
          label: Coverage Advantage Narrows
          detail: Single-vendor enrichment tools reach 60%+ coverage; Clay's ~80% waterfall advantage shrinks
        - id: smb-substitution
          label: SMB / Growth-tier Substitution
          detail: HubSpot users adopt Breeze Intelligence for free; Clay's SMB growth decelerates
        - id: sender-rep
          label: Sender Reputation Events
          detail: Mass outbound campaigns trigger ISP blocks; deliverability degrades across user base
        - id: arr-decline
          label: ARR Growth Deceleration
          detail: Combined effect of enterprise churn, SMB substitution, and coverage-advantage erosion
        - id: margin-compression
          label: Margin Compression
          detail: Data provider cost increases + AI inference pass-through + headcount scaling
        - id: valuation-compression
          label: Valuation Compression
          detail: ARR deceleration + margin compression → multiple re-rates from 50× toward ZoomInfo comparables (3-4×)
      edges:
        - from: privacy-risk
          to: enterprise-churn
          label: procurement blocker
        - from: provider-risk
          to: coverage-decline
          label: reduced waterfall depth
        - from: bundling-risk
          to: smb-substitution
          label: free alternative emerges
        - from: bundling-risk
          to: coverage-decline
          label: competitor coverage parity
        - from: ai-quality-risk
          to: sender-rep
          label: inaccurate outreach content
        - from: ai-quality-risk
          to: enterprise-churn
          label: data quality complaints
        - from: enterprise-churn
          to: arr-decline
          label: NRR degradation
        - from: smb-substitution
          to: arr-decline
          label: new logo slowdown
        - from: coverage-decline
          to: arr-decline
          label: competitive displacement
        - from: sender-rep
          to: arr-decline
          label: customer churn from ISP blocks
        - from: provider-risk
          to: margin-compression
          label: data cost increase
        - from: arr-decline
          to: valuation-compression
          label: growth rate deceleration
        - from: margin-compression
          to: valuation-compression
          label: deteriorating economics
        - from: valuation-risk
          to: valuation-compression
          label: embedded premium unwinds
    claimRefs:
      - CR001
      - CR009
      - CR013
      - CR015
      - CR021
      - CR025
      - CR031
      - CR043
      - CR044
      - CR045
