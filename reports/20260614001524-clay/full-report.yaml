  - id: FU001
    title: Clay Customer Journey Map — Segments, Adoption Surfaces, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      Five customer segments enter Clay through distinct acquisition surfaces and expand through module adoption,
      community embedding, and credit-driven consumption growth.
    data:
      items:
        - label: Self-serve power user
          detail: >-
            Entry: Free tier via community / word-of-mouth / Clay University. Activation: first enrichment workflow.
            Expansion: Launch → Growth via credit top-ups. Retention anchor: skill investment, community ties.
            Conversion to Claygency possible.
        - label: Claygency (specialist agency)
          detail: >-
            Entry: Power-user graduate or direct outreach from Clay. Activation: first client workflow delivered on
            Clay. Expansion: multi-client platform dependency, co-marketing, Clay Cup. Risk: agency defection carries
            client workflows.
        - label: Growth-stage B2B software firm
          detail: >-
            Entry: Claygency referral or inbound community discovery. Activation: RevOps outbound pilot. Expansion:
            Growth tier → Enterprise as team adds Signals, Ads, Sequencer. Retention anchor: CRM integration depth.
        - label: Enterprise RevOps / GTM team
          detail: >-
            Entry: Direct sales or top-down from Claygency recommendation. Activation: CRM enrichment pilot with
            dedicated Growth Strategist. Expansion: multi-module (Signals + Ads + Audiences + MCP) + multi-team (sales →
            data science → recruiting). Annual commitment creates renewal checkpoint.
        - label: EU / EMEA market expander
          detail: >-
            Entry: Claygency with EU market expertise or inbound from multi-country GTM need. Activation: multi-country
            enrichment waterfall (no single-provider alternative). Expansion: local signal tracking + ad audiences for
            LinkedIn EU. Retention risk: GDPR compliance clarity required for enterprise contracts.
    approximationNotes: >-
      Journey stages are inferred from case study language and product documentation; no formally published customer
      lifecycle data is available.
    claimRefs:
      - CU001
      - CU004
      - CU028
      - CU035
      - CU036
  - id: FU002
    title: Clay Adoption Funnel — Discovery to Enterprise Deployment (2024–2026)
    type: funnel
    layout: standard
    summary: >-
      Clay's adoption funnel narrows from 500,000+ total sign-ups through 5,000+ paying business customers to an
      enterprise tier, with Claygencies and community acting as mid-funnel amplifiers.
    data:
      items:
        - label: Discovery & Sign-up (all tiers)
          value: 500000
          detail: 500,000+ 'GTM teams' per Clay homepage Jun 2026; inflated by free sign-ups and Claygency sub-accounts
        - label: Free tier activation
          value: 100000
          detail: >-
            ~100,000 users circa Jun 2024; free tier includes 100 credits / 500 Actions / 200 rows per table; first
            workflow run indicates activation
        - label: Paying business customer (all paid tiers)
          value: 5000
          detail: >-
            5,000+ as of Jan 2025 (company-claimed); includes Launch $185/mo, Growth $495/mo, and Enterprise custom;
            estimated 8–12K by mid-2026 based on revenue trajectory
        - label: Claygency / agency tier
          value: 90
          detail: >-
            90+ active agencies as of Jan 2025; several with 7-figure run rates; serve as indirect customer acquisition
            channel
        - label: Enterprise (annual contract)
          value: 150
          detail: >-
            Estimated ~150 enterprise accounts (custom pricing + annual commitment); includes OpenAI, Anthropic, Figma,
            Intercom, Vanta, Rippling, Verkada, Canva, Ramp, A-LIGN and others; exact count not disclosed — estimate
            based on named accounts and revenue trajectory
    approximationNotes: >-
      Funnel values are not fully comparable: the 500K figure is Jun 2026 top-of-funnel (inflated); the 5,000+ paying
      customer figure is Jan 2025. Enterprise count is estimated from named case studies and press references. Paid
      conversion rate (Free → paying) is not publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU008
