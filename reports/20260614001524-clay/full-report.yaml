  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Clay operates as a GTM data-orchestration layer positioned between raw third-party data providers and
              revenue-team activation channels. In customer workflow terms, the platform spans five sequential stages:
              (1) data sourcing—pulling company and contact records from Clay's proprietary dataset and 150+ integrated
              providers; (2) waterfall enrichment—sequentially querying multiple providers and charging credits only on
              a successful match, pushing contact coverage from a typical single-provider ~30% to ~80% or higher; (3) AI
              research—Claygent agents browse the web, analyze public information, and generate personalized content,
              with Claygent Builder providing an IDE-style environment for authoring, testing, and deploying
              production-ready agents; (4) orchestration—Signals monitors trigger events (job changes, funding
              announcements, website visits, SOC2 certifications) and fires automated Clay workflows; and (5)
              activation—pushing enriched, scored records to CRM (Salesforce, HubSpot), outbound sequences (Clay
              Sequencer, Salesloft, Outreach), paid-media platforms (LinkedIn, Meta, Google via Clay Ads), and AI
              interfaces (Claude, ChatGPT, Codex via Clay MCP/Functions).

              Clay's product-line map spans nine distinct modules: the core table/workflow engine, waterfall enrichment,
              Claygent AI agents, Claygent Builder, Signals, Sequencer, Ads, MCP/Functions, and Clay University. The
              Audiences feature (enterprise, beta as of mid-2026) is a unified GTM data repository accessible across all
              modules. A-LIGN replaced $60K/year in manual research with Clay automated workflows in one month,
              achieving 450K insights versus 30K previously; Coverflex added 200+ demos per month by monitoring signals
              across 3M+ companies; Oyster saved 40 hours per month per sales rep through intent-based automation; and
              Sendoso attributed $1M in pipeline to Clay-driven outbound.
