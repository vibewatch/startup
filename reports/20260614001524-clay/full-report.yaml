      - number: '6.4'
        title: 'Retention and Durability: NRR Gaps, Cohort Unknowns, and Proxy Signals'
        blocks:
          - type: paragraph
            body: >-
              Clay does not publicly disclose NRR, GRR, customer churn, cohort retention curves, contract renewal rates,
              or NPS/CSAT scores. This is a material diligence gap. As a private company, Clay has no obligation to
              publish these figures, and they are standard non-public data-room items.

              Despite the absence of direct retention metrics, several proxy signals suggest strong net revenue
              retention. Revenue grew 6× in 2024 to approximately $30M ARR. The January 2025 Series B expansion raised
              $40M at $1.25B valuation despite no capital deployment from the prior round— suggesting investors have
              data-room access to retention metrics that support the valuation. The January 2026 Series C raised $100M
              at $5B valuation led by CapitalG, implying continued conviction on retention quality. Anecdotally, Clay's
              consumption-based credit model creates natural NRR expansion: as teams grow, workflows multiply, and
              enrichment volume scales, customers organically consume more credits without requiring separate
              renegotiation. Enterprise customers renewing annual commitments are subject to custom pricing that likely
              reflects expanded usage, not just the original contract floor.

              Expansion within accounts is documented at multiple customers. OpenAI expanded from RevOps to data science
              and recruiting. Intercom expanded from a month-long outbound project to org-wide GTM infrastructure.
              A-LIGN noted that gross expansion from existing customers exceeds new logo sales revenue. Figma's
              deployment expanded from CRM enrichment to product-signal activation, to ad audiences, to self-serve
              demand gen team ownership—a four-stage expansion arc within roughly one year.

              The Claygency channel creates an unusual retention dynamic. Agencies that build client workflows on Clay
              become deeply invested in the platform's stability, creating strong platform-level stickiness. However, if
              a Claygency were to defect to a competitor or reduce usage, it could simultaneously take multiple
              end-client workflows with it—creating concentration risk within the channel even if individual end-client
              churn is low.

              Contract length is tier-dependent: Enterprise requires annual commitment; Launch and Growth are
              effectively monthly recurring. No information is available on early termination rates or renewal rates at
              any tier. The majority of the 5,000+ customers are believed to be on Launch or Growth (monthly) tiers,
              where churn dynamics are more similar to self-serve SaaS than to enterprise contract renewal. No customer
              satisfaction survey data, NPS score, or G2 review-panel rating is available to benchmark satisfaction.
            claimRefs:
