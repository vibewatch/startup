  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Clay's revenue model is consumption-based, structured around two parallel usage meters: Data Credits,
              which fund purchases from Clay's 150+ data-provider marketplace, and Actions, which fund platform
              orchestration work such as running enrichment workflows, calling AI models, pushing records to a CRM, or
              exporting data. This dual-meter design decouples data procurement cost from platform compute cost,
              allowing Clay to pass through data-provider wholesale rates directly to customers as Data Credits while
              retaining a platform margin on Actions. Data Credits start at $0.05 each and decrease with scale; Actions
              start at less than $0.01 each and also scale down. Customers who bring their own data-provider API keys
              skip Data Credits entirely, paying only Actions—a structural choice that keeps Clay competitive for
              high-volume enrichers while reducing Clay's gross revenue from data passthrough on those accounts.


              Published tiers run from Free (100 Data Credits / 500 Actions per month) to Launch ($185/mo, 2,500 Data
              Credits / 15,000 Actions) to Growth ($495/mo, 6,000 Data Credits / 40,000 Actions) to Enterprise (custom
              annual commitment, 100,000+ Data Credits / 200,000+ Actions). An Enterprise customer with a commitment
              comparable to Clay's disclosed contract example of "hundreds of thousands of dollars per year" would sit
              at a substantially higher ARR contribution than self-serve SMB accounts. Enterprise pricing adds dedicated
              Growth Strategist support, SSO, RBAC, data-warehouse sync, and unlimited Audiences, all of which create
              contractual stickiness absent from lower tiers.


              AI model usage adds a third revenue component: fixed-credit tasks for 80% of models and variable
              token-based pricing (at exact cost, no markup) for frontier models such as GPT-5.1 and Claude 4.6 Sonnet.
              Clay's decision to pass frontier model inference at zero markup is a deliberate design choice that lowers
              the marginal cost of AI-intensive workflows for customers—improving engagement and credit consumption
              volume—at the expense of capturing a margin on the AI component. Revenue from AI enrichment is therefore
              embedded in Actions and Data Credit consumption rather than separately itemized, making gross margin
              decomposition even more opaque from the outside. Contract sizes run into the hundreds of thousands of
              dollars per year at the enterprise level, and over 5,000 customers had active paying accounts as of
              January 2025, growing to 300,000+ registered GTM teams on the platform by 2026 (free and paid combined).
