      - number: '7.2'
        title: 'Regulatory and Legal Risk: Privacy, Data Brokerage, and Compliance Chain-of-Custody'
        blocks:
          - type: paragraph
            body: >-
              Clay operates at the intersection of three privacy regulatory regimes that apply to its enrichment and
              outreach use cases: the UK's Privacy and Electronic Communications Regulations (PECR) and GDPR; the
              California Consumer Privacy Act as amended by the CPRA (CCPA/CPRA); and the US CAN-SPAM Act. The
              regulatory risk is compounded because Clay does not merely collect data—it assembles a waterfall of 150+
              providers, each operating under its own data-collection terms and compliance posture, and delivers the
              assembled output to customers who use it to send cold outbound email, social outreach, and programmatic
              advertising. The chain of custody for GDPR lawful-basis documentation, DNC list screening, and
              right-to-erasure processing thus spans Clay, each third-party provider, and each end customer, creating
              three loci of potential non-compliance.

              Clay's privacy policy was last updated September 11, 2020. As of June 2026, it does not mention Clay's
              current products: Claygent (AI web scraper), Signals (job-change and web-visit monitoring), Clay Ads
              (first-party data pushed to LinkedIn/Meta/Google), Clay MCP (data surfaced inside ChatGPT and Claude), or
              the data-warehouse sync capabilities introduced in Enterprise tier. A privacy policy last updated before
              any of these products existed cannot constitute compliant GDPR or CCPA notice for the data processing that
              those products perform. Cognism explicitly cites this gap in its competitive positioning: "Cognism
              delivers guaranteed compliance… Each provider [in Clay's waterfall] applies different collection methods,
              refresh cycles and standards, increasing the likelihood of inconsistency, duplication and compliance
              exposure, particularly in Europe."

              Clay's Trust Center (trust.clay.com) returns near-empty content—the page is JavaScript-rendered with
              minimal text on direct access, revealing no published SOC2 report, no ISO 27001 certificate, no GDPR
              lawful-basis documentation, and no subprocessor list. Clay's pricing page claims SOC2 Type II, GDPR
              compliance, CCPA compliance, ISO 27001, and ISO 42001 certification, but none of these are linked to
              verifiable public artifacts. Apollo.io, by contrast, is publicly registered as a data broker in California
              as required by CCPA. It is not known whether Clay is similarly registered.

              The CCPA as amended by CPRA (effective January 1, 2023) requires businesses operating as data brokers to
              register with the California Attorney General. The regulation also grants consumers the right to correct
              inaccurate personal information—a significant operational obligation for a company whose waterfall model
              is explicitly built on multi-source data stitching that Cognism estimates delivers ~80% coverage (but does
              not disclose per-provider quality). The ICO's PECR guide requires that electronic marketing emails to
              individuals (as opposed to corporate addresses at limited companies) require prior consent—an obligation
              that Clay's customers may be breaching if they use Clay-enriched personal email addresses for cold
              outreach under the assumption that GDPR B2B legitimate-interest carve-outs cover all contact types. Clay's
              guidance on PECR compliance for its customer-use workflows is not publicly documented.

              ZoomInfo's 2024 10-K identifies data privacy regulatory changes as a key material risk factor, noting that
              "changes in laws, regulations, and public perception concerning data privacy… could impact our ability to
              efficiently gather, process, update, and/or provide some or all of the information we currently provide."
              As a less mature company with less public regulatory exposure history, Clay faces the same structural risk
              at an earlier stage of its regulatory engagement cycle.

              No public litigation, enforcement action, or regulatory investigation against Clay has been identified.
              This absence of adverse legal history is notable and positive, but it also reflects Clay's private status
              (litigation proceedings are not publicly filed until active) and its relatively short tenure at
              significant scale (post-2022 growth phase). Diligence asks on this topic are non-negotiable.
            claimRefs:
              - CR001
