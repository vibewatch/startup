            body: >-
              Clay's financial profile is compelling at the operating level and opaque at the underwriting level. The
              strengths are clear: exceptional capital efficiency ($30M FY2024 revenue on a few million dollars per year
              in burn), rapid ARR growth (10×/10×/6× in three consecutive fiscal years, reaching $100M by December
              2025), a consumption model that aligns revenue with customer value, and an investor-confirmed minimal-loss
              posture across Series B, B expansion, and Series C. The community and agency ecosystem amplifies
              distribution without increasing sales headcount, and enterprise case studies document strong ROI—implying
              that once an enterprise account activates at scale, the economic incentive to retain and expand the
              contract is high.


              The diligence blockers are equally clear. Gross margin is undisclosed and structurally complex: the dual
              passthrough of data-provider costs and AI inference costs makes it impossible to derive from outside. NRR
              is undisclosed; given ZoomInfo's 87% NRR in a declining market, even a materially higher figure for Clay
              would not automatically justify a 50× ARR multiple. Customer concentration and cohort data are
              unavailable. The consumption model creates meaningful revenue-per-account variability that makes even
              revenue forecasting difficult without visibility into usage behavior at the enterprise tier. Until a
              prospective investor obtains gross margin, NRR, customer- level cohort data, cash balance, and enterprise
              contract terms in a data-room setting, the $5B implied valuation cannot be independently
              corroborated—though the growth trajectory and burn efficiency represent the strongest possible case that a
              deep-dive would ultimately be warranted.
