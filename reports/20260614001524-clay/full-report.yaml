          - type: callout
            title: ZoomInfo revenue decline signals category pricing pressure
            body: >-
              ZoomInfo's −2% revenue decline in FY2024 and 87% NRR are the most concrete adverse evidence in the
              competitive context: the largest proprietary-database player is losing customers even while investing in
              AI. This validates Clay's differentiation thesis but signals that enterprise buyers are repricing
              enrichment downward, creating category-wide margin pressure including on Clay's credit economics.
            calloutType: risk
            claimRefs:
              - CP019
              - CP020
