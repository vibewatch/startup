      - number: '2.2'
        title: TAM, SAM, and SOM — Multiple Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Three independent sizing lenses are applied, all yielding different estimates that are preserved as
              contradictory rather than smoothed.

              Lens 1 — Analyst top-down (Mordor Intelligence, 2026): The global sales intelligence market is valued at
              $4.99B in 2026 and is forecast to reach $9.15B by 2031 at a 12.89% CAGR. North America accounts for 40.4%
              of 2025 revenue (~$1.78B at that year's base), and the data enrichment and workflow automation
              sub-component is the fastest-growing solutions sub-segment within this. SMEs are growing at 16.93% CAGR,
              outpacing large enterprises (61.6% of current revenue). Pay-as-you-go pricing—Clay's primary model—is
              growing at 18.51% CAGR within the market.

              Lens 2 — Older analyst estimate (MarketsandMarkets, November 2019): The sales intelligence market was
              projected to grow from $2.0B in 2019 to $3.4B by 2024 at 11.4% CAGR. Extrapolating this trajectory naively
              to 2026 implies approximately $3.8B—roughly 24% below the Mordor base estimate. This discrepancy is
              material: the AI acceleration since 2022 likely explains the upward revision, but the older model's lower
              ceiling illustrates forecast sensitivity to AI-adoption pace assumptions. Both estimates are preserved and
              neither is treated as authoritative.

              Lens 3 — Public-company revenue proxy: ZoomInfo (ticker: GTM), the market's largest independent public
              player, reported ~$1.1B revenue in 2024 before experiencing pricing pressure. Apollo.io reached ~$145M ARR
              as of 2025, suggesting a combined top-2 revenue pool of roughly $1.25B within a broader market that
              includes Cognism, Lusha, Hunter, 6sense, Demandbase, Salesforce Data Cloud, and HubSpot Breeze
              Intelligence. A rough bottom-up sum of disclosed player ARR (where available) suggests total named-player
              revenue of $2–3B in 2026, consistent with a market size of $4–5B when accounting for the long tail of
              smaller vendors and services revenue.

              Clay's SAM is narrower than the full sales intelligence market because Clay does not provide raw data
              directly—it orchestrates third-party providers. The SAM is estimated at $1.2–1.5B, representing the data
              enrichment orchestration, workflow automation, and AI research agent sub-segments. Clay's SOM at $100M ARR
              represents approximately 6–8% of estimated SAM. This is a meaningful share for a company at Series C, but
              requires monitoring as ZoomInfo and HubSpot bundle enrichment into existing relationships.
            claimRefs:
