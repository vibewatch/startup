            title: Apollo is the most immediate pricing and feature overlap threat
            body: >-
              Apollo.io competes with Clay on price, feature set (contact data + sequencer + AI email assist), and
              target buyer (SMB to commercial GTM teams). Apollo's freemium funnel is more permissive, and its pricing
              is transparent and lower at the entry tier. Clay's differentiation (waterfall breadth and Claygent)
