      - number: '6.2'
        title: 'Adoption Trajectory: User Count, Customer Growth, and Platform Utilization'
        blocks:
          - type: paragraph
            body: >-
              Clay's adoption trajectory across 2022–2026 is one of the most aggressive in B2B SaaS at its stage: 10×
              revenue growth in 2022, 10× in 2023, 6× in 2024, and an estimated continued strong growth in 2025
              consistent with the $100M ARR milestone cited in secondary coverage of the January 2026 Series C raise. On
              the basis of these revenue multiples and the company's own customer count disclosures, adoption across
              every metric has been accelerating.

              User-count milestones (all company-claimed): Clay hit 100,000 users and 2,500+ business customers at the
              time of its June 2024 Series B announcement. By January 2025, Series B expansion materials cited 5,000+
              customers—a 2× increase in six months. By June 2026, the Clay homepage claims 500,000+ "GTM teams" as
              users, though this broader figure likely conflates free-tier sign-ups, Claygency sub-accounts, and paying
              business customers in a single top-of-funnel metric. Active business customers are best proxied by the
              5,000+ figure from January 2025, with plausible growth to 8,000–12,000 by mid-2026 based on revenue
              trajectory—an estimate without disclosed basis.

              Platform utilization evidence is sparse but directional. Clay's AI agent (Claygent) executes 140 million
              runs per month, per the Clay homepage as of June 2026—a forward-looking utilization claim that implies
              high weekly active use across a large installed base. OpenAI's team runs enrichments on busy days at up to
              150 individual leads per seller with consistent week-over-week adoption. Intercom sourced 4,000+ accounts
              and enriched 21,000 contacts in a single month. A-LIGN processed 2,000 accounts through Clay in one month,
              delivering 450,000 data insights. Coverflex runs 3,000,000+ companies through Clay monthly for signal
              monitoring.

              Geographic spread remains US-primary. EU-headquartered customers (Coverflex, Oyster) and EU expansion
              deployments (Verkada's 28-country EMEA push) are documented but represent a minority of the disclosed
              customer list. The addition of Beauhurst (UK/Germany private company data) and Ocean.io (European
              lookalike prospecting) to Clay's integration catalog in early 2026 suggests deliberate European market
              investment.

              Community and ecosystem metrics reinforce adoption stickiness: 20,000+ Slack community members, 60+ Clay
              Club meetup groups across 30 cities, and a Clay University with structured coursework. These create
              network-effect-like dynamics where practitioner skill development directly increases platform utilization
              depth.
