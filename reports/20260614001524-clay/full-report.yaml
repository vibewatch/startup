      - number: '4.5'
        title: Capital Adequacy and Financing
        blocks:
          - type: paragraph
            body: >-
              Clay's capital structure as of mid-2026 reflects approximately $203M in cumulative primary capital raised
              across its full funding history. The most recent primary round, a $100M Series C led by CapitalG
              (Alphabet) at a $3.1B valuation in August 2025, added to an earlier $46M Series B and a $40M Series B
              expansion, both of which CEO Amin described as effectively undeployed as of January 2025. The company also
              raised a $1M community equity offering at the $1.25B Series B valuation in February 2025 to allow
              community members to co-invest. The two employee tender offers (May 2025 at $1.5B and January 2026 at $5B)
              provided secondary liquidity but did not change the primary capital structure.


              With an annual burn of "a few million dollars a year" as characterized by CapitalG partner Jane Alexander
              in March 2026, and over $100M raised in the Series C alone, runway is not a near-term concern. At $3–5M
              annual burn, $100M in primary capital implies in excess of 20 years of runway absent any revenue
              growth—effectively meaning Clay is not capital-constrained. The CapitalG investment was described as being
              made at a time when Clay "wasn't actively seeking investments," further confirming that capital raises
              have been demand-pull from investors rather than necessity-driven. No debt or credit facility has been
              publicly disclosed.


              The absence of debt and the substantial undeployed primary capital means Clay's near- term financial risk
              is strategic (market adoption, competitive response) rather than balance-sheet-driven. However, the gap
              between the $5B implied valuation and the approximately $100M ARR base creates a material dilution risk if
              growth decelerates before the next capital event (IPO or primary round), because a reset in the valuation
              multiple would harm secondary liquidity and employee morale without necessarily threatening the operating
              business.
