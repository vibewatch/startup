      - number: '8.4'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              Clay's peer set spans public data-intelligence companies and private GTM platforms at varying stages. The
              public comparables—ZoomInfo and HubSpot—trade at dramatically lower revenue multiples, but each has growth
              profiles and business model structures that differ from Clay's. ZoomInfo's $1.214B FY2024 revenue with -2%
              YoY growth and an 87% NRR trades at approximately 2.5–3× trailing revenue as of mid-2024 disclosure.
              HubSpot's $2.63B FY2024 revenue trades at approximately 9–10× trailing revenue, reflecting stronger NRR, a
              broader platform, and a CRM narrative that Clay does not yet own at scale.


              Among private comps, Apollo.io is the most direct analog—a sales intelligence platform with broadly
              similar GTM enrichment capabilities, estimated at $100M+ ARR and approximately $1.6B valuation from its
              2023 Series D, implying ~16× ARR at that mark. Salesloft, which merged with Drift and focuses on sales
              engagement rather than enrichment, was valued at ~$2.3B in its 2021 round; post-merger revenue estimates
              suggest a lower multiple at current run-rate. Lusha raised at $1.5B in 2022 at an estimated $50-100M ARR,
              implying a 3–5× multiple—compressed from 2022 levels given market conditions. Outreach.io, an engagement
              platform, last raised at ~$4–5B in 2022 but has faced market pressure since. No private comparable is
              currently marked at >20× ARR; Clay's implied 50× ARR multiple at $5B sits structurally above the
              observable private comp set.


              The relevant valuation framework for Clay at its current stage is a probability-weighted revenue multiple
              scenario model rather than a direct comparable, given the absence of any precedent for a sub-$150M-ARR
              company valued at $5B in the GTM intelligence category. Clearbit's acquisition by HubSpot at an
              undisclosed price provides an M&A data point suggesting strategic value creation in the enrichment
              category, but pricing is not public.
