chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Clay, Inc. is a New York City-based B2B software company founded in 2017 and operating at Series C stage
              as of mid-2026. The company provides a GTM development environment that enables sales and marketing teams
              to consolidate data from 150+ third-party enrichment providers, run AI-powered research agents (Claygent),
              and automate end-to-end outbound workflows—all within a spreadsheet-like interface. Clay's credit-based,
              consumption pricing aligns cost with data usage rather than fixed seats, differentiating it from legacy
              point-solution competitors such as ZoomInfo and Apollo. The platform serves a broad range of B2B buyers:
              solo GTM practitioners, specialist agencies ("Claygencies"), and enterprise companies including OpenAI,
              Anthropic, Canva, Ramp, and Rippling. Clay's business model combines self-serve subscription tiers with an
              enterprise sales motion, using a credit system where customers purchase credits to query enrichment
              providers via waterfall enrichment—sequentially sampling multiple providers to maximize contact data
              coverage. The product concept of the "GTM engineer"— a technical builder who designs scalable revenue
              systems—originated with Clay and has become a recognized job category, creating a sticky community moat
              that reinforces both retention and word-of-mouth growth. Clay's current product surface includes data
              enrichment, AI research agents, intent signals, CRM sync, email sequencer integrations, and, as of 2026,
              an MCP server enabling AI assistants such as Claude and ChatGPT to invoke Clay workflows directly.
