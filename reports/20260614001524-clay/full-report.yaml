            title: Unusually Deep Named-Customer Proof at Enterprise Scale
            body: >-
              Clay has published more than a dozen named, outcome-specific case studies from enterprise customers at
              category-leading companies (OpenAI, Anthropic, Figma, Intercom, Vanta, Rippling). Outcomes include
              quantified enrichment coverage improvements, documented pipeline generation, revenue attribution, and
