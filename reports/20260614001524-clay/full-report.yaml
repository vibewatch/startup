    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - NRR by segment
        - >-
          Net revenue retention broken down by enterprise, mid-market, agency, and self-serve cohorts with at least
          4-quarter history
        - >-
          NRR is the single most important driver of valuation at a consumption-based model; the difference between 90%
          and 120% NRR is the difference between a $2B and a $10B outcome
        - Data room; CFO/VP Finance interview
      - - Gross margin
        - >-
          Disclosed gross margin on GAAP revenue, broken down by data-credit pass-through costs, AI inference costs, and
          platform contribution
        - GM below 55% structurally limits achievable valuation multiples; GM above 70% confirms premium pricing power
        - Data room; audited or reviewed P&L
      - - Cap table and preference stack
        - >-
          Full cap table with liquidation preference waterfall at $2B, $3.1B, and $5B exit scenarios; anti-dilution
          provisions
        - >-
          Three tender events in nine months have created a complex preference structure; Series C at $3.1B liquidation
          preferences could subordinate common stock returns
        - Legal due diligence; cap-table management platform export
      - - Compliance documentation
        - >-
          SOC2 Type II report, GDPR DPA with top 10 enrichment providers, CCPA data-broker registration status,
          subprocessor list
        - >-
          Compliance gaps are the single most likely enterprise procurement blocker and the highest-risk regulatory
          exposure at scale
        - Legal due diligence; trust.clay.com content audit
      - - Customer concentration
        - Top 10 customers as % of ARR; top 10 Claygencies as % of ARR; churn history by cohort
        - >-
          Agency-channel dependence creates concentration risk; if Claygencies represent >30% of ARR, the business model
          is more fragile than direct-enterprise ARR
        - Data room; revenue analytics
    notes: >-
      Diligence asks ranked in order of valuation impact; all five are required before any investment decision at the
      current $5B implied entry price.
