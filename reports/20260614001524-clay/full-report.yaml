      - number: '4.3'
        title: Cost Structure and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Clay's cost structure has three primary components. First, data-provider fees: Clay pays wholesale rates
              to 150+ enrichment providers and charges customers Data Credits for each lookup. Because Clay has
              negotiated volume discounts, it retains a margin on Data Credits, but this margin is structurally thinner
              than pure-software margin because the underlying data commodity has a variable cost floor. Customers who
              bring their own API keys remove this revenue line entirely, paying only Actions—shifting the economics
              toward a pure platform model. Second, AI inference costs: Clay passes frontier model tokens at exact cost.
              This effectively makes AI compute a zero-margin line for the subset of customers using variable-priced
              models, though it drives higher overall engagement and credit consumption. Third, platform engineering and
              infrastructure: Actions revenue is intended to cover the compute costs of orchestrating enrichment
              workflows, calling providers, running waterfalls, and returning results to customers. Clay reported
              processing "hundreds of millions" of AI agent tasks in the year prior to January 2025, indicating
              meaningful infrastructure scale.


              For a comparable public-company margin profile, ZoomInfo's FY2024 adjusted operating margin was 35% on
              $1.214B revenue, with declining GAAP revenue (−2% YoY) and an 87% net revenue retention rate. ZoomInfo's
              higher data-license vs. platform-services mix supports structurally higher margins than Clay's
              pass-through-heavy model at comparable stages. HubSpot's $2.63B in 2024 revenue contextualizes the scale
              Clay must reach to justify the $5B implied valuation; even HubSpot operates at negative GAAP net income at
              that scale. Clay's gross margin is not publicly disclosed. Reasonable analogues— adjusting for data
              passthrough costs and AI inference expenses—suggest Clay's structural gross margin could fall in the
              50–70% range, but this is an estimate, not a corroborated figure, and is a blocking diligence gap for any
              valuation model.
