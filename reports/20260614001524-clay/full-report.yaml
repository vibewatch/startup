            body: >-
              Clay has been more open about revenue milestones and qualitative growth than about the unit-economic
              inputs that underpin a valuation model. Publicly available metrics include: FY2024 revenue of
              approximately $30M (Forbes, Jan 2025), 6× YoY growth in 2024, $100M ARR by December 2025 (referenced in
