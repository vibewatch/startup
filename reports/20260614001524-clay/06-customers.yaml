chapter:
  number: 6
  title: Customers
  summary: >-
    Clay's customer base spans five overlapping segments—self-serve GTM practitioners, a
    quasi-channel of 90+ specialist agencies ("Claygencies"), growth-stage B2B software
    firms, enterprise RevOps teams, and EU/EMEA expanders—united by four core use-case lanes:
    inbound enrichment, outbound prospecting, signal-based outreach, and ads audiences. Named
    production deployments at OpenAI, Anthropic, Figma, Intercom, Vanta, A-LIGN, Sendoso, and
    ten-plus others provide multi-outcome corroboration of real adoption. Revenue grew 6x in
    2024 to ~$30M ARR and an estimated ~$100M ARR by end-2025, implying strong net retention;
    however, NRR, GRR, churn rates, and cohort data remain undisclosed, constituting a material
    gap for evaluating long-term durability. Concentration risk is meaningful through the
    Claygency channel and the opaque enterprise customer mix, but the credit-based expansion
    model and multi-team platform breadth create structural upsell that partially offsets this.

sections:
  - id: customer-base-segmentation
    title: "Customer Base Segmentation: Buyer, User, Payer, and Use-Case Lanes"
    body: >-
      Clay's customer base is best understood through two orthogonal cuts: the organizational
      buyer/user/payer archetype and the primary use-case lane that drives initial adoption.

      Organizational segments fall into five groups. First, self-serve power users—solo GTM
      engineers, growth marketers, and RevOps practitioners—discover Clay through community,
      word-of-mouth, or the free tier, self-onboard via Clay University, and convert to Launch
      ($185/month) or Growth ($495/month) plans. These users are technically fluent, cost-sensitive
      on a per-seat basis, and often become community advocates or Claygency founders. Second,
      Claygencies (the 90+ specialist agencies that build client workflows on Clay) are simultaneously
      users, payers, and an informal distribution channel. As of January 2025 Clay reported 90+
      agencies, several with multi-million-dollar run rates. Claygencies create a quasi-channel
      model: they acquire clients Clay could not reach directly, standardize Clay workflows for
      entire verticals, and generate aggregate demand growth. Third, growth-stage B2B software
      firms (Hex, Rootly, Legora, Coverflex, Oyster, Sana) are typically RevOps-led buyers paying
      Growth-tier or early Enterprise contracts, deploying Clay primarily for outbound prospecting
      and CRM enrichment. Fourth, enterprise GTM teams at category-leading companies (OpenAI,
      Anthropic, Figma, Intercom, Vanta, Rippling, Verkada, Ramp, Canva, HubSpot, Mistral AI,
      A-LIGN) operate Clay at scale under annual Enterprise contracts, which carry custom pricing
      and dedicated Growth Strategist support. Typical enterprise contract sizes reportedly run into
      the hundreds of thousands of dollars per year. Fifth, EU/EMEA expanders (Coverflex in Portugal,
      Spain, and Italy; Oyster serving 180+ countries; Verkada GTM in 28 European countries) represent
      an underdeveloped but visible geography segment, with Clay providing multi-country data sourcing
      that legacy single-provider tools cannot replicate.

      Four use-case lanes drive initial purchase decisions. Inbound enrichment is the most common
      enterprise entry point: when a lead fills a form, Clay automatically enriches the record from
      150+ providers and pushes scored, segmented data to the CRM. Outbound prospecting covers list
      building, waterfall enrichment, AI-personalized copy, and sequencer delivery. Signal-based
      outreach uses Clay's Signals module to monitor trigger events (job changes, funding rounds, SOC2
      postings, web visits) and fire automated enrichment and outreach workflows. Ads audiences leverages
      Clay Ads to push dynamically updated, enriched segments directly to LinkedIn, Meta, and Google,
      replacing manual quarterly exports with always-current ICP-matched lists.

      The buyer is typically the VP Marketing, VP Sales, Director of Revenue Operations, or Head of
      Growth; the user is the GTM engineer, RevOps analyst, or growth marketer who builds workflows;
      and the payer is the GTM or marketing budget, occasionally ops or IT. At smaller firms all three
      roles collapse into one person. Enterprise deals carry additional procurement friction: SSO,
      RBAC, security review, and contract negotiation—features gated to Enterprise tier.
