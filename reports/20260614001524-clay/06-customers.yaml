  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "retention-metrics"
      missingEvidence: "NRR, GRR, logo churn rate, and cohort retention curves by customer tier (Free, Launch, Growth, Enterprise) for 2023–2025"
      whyItMatters: "Without NRR/GRR, it is impossible to determine whether Clay's revenue growth is primarily driven by new customer acquisition (reversible) or net dollar expansion (durable); this is the single most important data-room item for customer chapter judgment"
      diligencePath: "Request quarterly NRR/GRR cohort tables and churned-logo counts from Clay's CFO or investor relations; cross-reference with the $1.25B Series B expansion data room and $5B Series C data room"
      relatedQuestionRefs: [QU006, QU011]

    - type: missing-source
      severity: material
      topic: "claygency-concentration"
      missingEvidence: "Claygency revenue as a percentage of total ARR; count of active Claygency clients managed per agency; Claygency-specific churn or defection events"
      whyItMatters: "Without knowing what share of ARR is intermediated through Claygencies, the bilateral concentration risk (agency defection = correlated client churn) cannot be sized; this risk could be negligible (<5% ARR) or material (>20% ARR)"
      diligencePath: "Request Clay's internal breakdown of direct vs. agency-intermediated ARR; identify top-3 Claygencies by revenue contribution; review agency contract terms and non-compete provisions"
      relatedQuestionRefs: [QU004, QU026]

    - type: private-evidence-only
      severity: material
      topic: "customer-concentration"
      missingEvidence: "Top-10 customer revenue share as a percentage of total ARR; HHI index for the customer base; largest single customer as % of ARR"
      whyItMatters: "Without top-customer concentration data, it is impossible to assess revenue durability risk from a single large customer departure; especially important given that 5,000+ customers include a small number of high-ACV enterprise accounts"
      diligencePath: "Request customer HHI, top-10 customer ARR share, and names of any customers representing >2% of ARR from the data room"
      relatedQuestionRefs: [QU026]

    - type: missing-source
      severity: material
      topic: "eu-compliance"
      missingEvidence: "GDPR sub-processor list and data-processing agreements for Clay's 150+ enrichment provider waterfall; independent confirmation that Clay's enterprise customers in Europe have completed GDPR-compliant onboarding"
      whyItMatters: "EU expansion is documented but compliance posture is opaque; Cognism's adverse commentary highlights this as a structural risk; without sub-processor disclosure, EU enterprise procurement may be blocked in regulated industries"
      diligencePath: "Request Clay's DPA, GDPR sub-processor annex, and SOC2 Type II report from Clay's security team; review the Trust Center for updated certifications"
      relatedQuestionRefs: [QU007, QU013]

    - type: enumeration-incomplete
      severity: minor
      topic: "full-customer-list"
      missingEvidence: "A complete or representative enumeration of Clay's 5,000+ paying business customers by tier, vertical, geography, and ACV band"
      whyItMatters: "The 12 named case-study customers may not be representative of the full customer distribution; concentration in AI/SaaS early adopters could indicate limited mainstream enterprise penetration or vertical diversity"
      diligencePath: "Request a customer list with anonymized tier, vertical, ARR band, and tenure from Clay's data room; review the G2 review panel for a broader sample of buyer types"
      relatedQuestionRefs: [QU001, QU020, QU022]
      relatedTableRefs: [TU003]

    - type: missing-source
      severity: minor
      topic: "free-to-paid-conversion"
      missingEvidence: "Free-to-paid conversion rate from the Clay free tier (100K+ users) to any paying tier; average time-to-conversion"
      whyItMatters: "Free-tier conversion efficiency determines the unit economics of product-led growth; a very low conversion rate would indicate the PLG funnel is a brand-building exercise rather than a revenue engine"
      diligencePath: "Request free-to-paid conversion rate, average time-to-conversion, and free-tier DAU/WAU from Clay's growth team"
      relatedQuestionRefs: [QU016]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All five tables in this chapter contain notes fields with explicit data-source caveats,
      vintage disclosures, estimation methods, and partial-coverage acknowledgments as required.
      TU001 notes the absence of official segmentation taxonomy; TU002 notes the 500K figure's
      non-comparability to prior customer-count disclosures; TU003 notes all outcomes are
      company-claimed and not independently audited; TU004 notes the absence of direct retention
      metrics; TU005 notes ARR estimates are illustrative. No pure factual snapshot tables exist
      in this chapter that would warrant omitting notes.
  - dimension: unverifiedSource
    reason: >-
      SU032 (New York Times August 2025 article) was fetched via an access-token URL
      (unlocked_article_code parameter) that differs from the clean canonical URL cited in
      the YAML. The underlying article is the same; the token URL cannot be cited directly
      in a diligence report without embedding a session-specific unlock key. Source is rate-limited
      (403 status) and used only for ARR growth context corroborated by multiple other sources.
