figures:
  - id: FU001
    title: "Clay Customer Journey Map — Segments, Adoption Surfaces, and Expansion Loops"
    type: journey-map
    layout: wide
    summary: >-
      Five customer segments enter Clay through distinct acquisition surfaces and expand through
      module adoption, community embedding, and credit-driven consumption growth.
    data:
      items:
        - label: "Self-serve power user"
          detail: "Entry: Free tier via community / word-of-mouth / Clay University. Activation: first enrichment workflow. Expansion: Launch → Growth via credit top-ups. Retention anchor: skill investment, community ties. Conversion to Claygency possible."
        - label: "Claygency (specialist agency)"
          detail: "Entry: Power-user graduate or direct outreach from Clay. Activation: first client workflow delivered on Clay. Expansion: multi-client platform dependency, co-marketing, Clay Cup. Risk: agency defection carries client workflows."
        - label: "Growth-stage B2B software firm"
          detail: "Entry: Claygency referral or inbound community discovery. Activation: RevOps outbound pilot. Expansion: Growth tier → Enterprise as team adds Signals, Ads, Sequencer. Retention anchor: CRM integration depth."
        - label: "Enterprise RevOps / GTM team"
          detail: "Entry: Direct sales or top-down from Claygency recommendation. Activation: CRM enrichment pilot with dedicated Growth Strategist. Expansion: multi-module (Signals + Ads + Audiences + MCP) + multi-team (sales → data science → recruiting). Annual commitment creates renewal checkpoint."
        - label: "EU / EMEA market expander"
          detail: "Entry: Claygency with EU market expertise or inbound from multi-country GTM need. Activation: multi-country enrichment waterfall (no single-provider alternative). Expansion: local signal tracking + ad audiences for LinkedIn EU. Retention risk: GDPR compliance clarity required for enterprise contracts."
    approximationNotes: "Journey stages are inferred from case study language and product documentation; no formally published customer lifecycle data is available."
