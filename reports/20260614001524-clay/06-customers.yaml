callouts:
  - calloutType: strength
    title: "Unusually Deep Named-Customer Proof at Enterprise Scale"
    body: >-
      Clay has published more than a dozen named, outcome-specific case studies from enterprise
      customers at category-leading companies (OpenAI, Anthropic, Figma, Intercom, Vanta, Rippling).
      Outcomes include quantified enrichment coverage improvements, documented pipeline generation,
      revenue attribution, and multi-team deployment arcs—a level of customer evidence quality that is
      above average for a Series C B2B SaaS company. The A-LIGN case study, documenting $3.3M closed
      revenue and 40% pipeline growth, is particularly strong for specificity and recency.
    claimRefs:
      - CU009
      - CU013
      - CU014
      - CU017

  - calloutType: risk
    title: "Material Retention Opacity: No NRR, GRR, Cohort, or Churn Data Available"
    body: >-
      No net revenue retention rate, gross revenue retention rate, churn rate, cohort curve, or
      contract renewal rate has been publicly disclosed. This is the most significant customer-chapter
      diligence gap. The 6× revenue growth in 2024 and escalating investor valuations ($500M → $5B)
      provide circumstantial evidence of strong retention, but cannot substitute for direct cohort data.
      Without NRR disclosure, it is impossible to determine whether Clay's revenue growth is driven
      primarily by new customer acquisition (which reverses when growth slows) or by net dollar expansion
      from the existing base (which is more durable). This must be obtained from Clay's data room.
    claimRefs:
      - CU023
      - CU024

  - calloutType: risk
    title: "Claygency Channel Concentration: Bilateral Lock-In with Correlated Churn Risk"
    body: >-
      The 90+ Claygency agencies that build client workflows on Clay function as an unpaid sales force
      and retention anchor, but they also concentrate customer relationship ownership outside of Clay
      itself. A large Claygency managing dozens of client accounts could, in theory, migrate those
      workflows to a competing platform and take associated revenue simultaneously—a correlated-churn
      scenario that is structurally different from individual enterprise contract churn. Clay's community
      equity offering and co-marketing programs partially align agency incentives, but no exclusivity
      or binding agreements are documented publicly. The Claygency revenue contribution as a percentage
      of total ARR is not disclosed.
    claimRefs:
      - CU004
      - CU033
      - CU034

  - calloutType: insight
    title: "Credit-Based Consumption Model Creates Structural NRR Tailwind"
    body: >-
      Clay's credit-based pricing—where costs scale with enrichment volume, AI agent runs, and workflow
      Actions rather than fixed seats—creates a structural mechanism for NRR to exceed 100% without
      any active upsell motion. As a customer's GTM team grows, adds new data sources, deploys Signals,
      activates Ads audiences, or builds more Claygent agents, monthly credit consumption rises naturally,
      increasing ARR from that customer without a separate contract renewal event. Enterprise customers
      rolling over up to 15% of unused credits from prior year further reduces churn friction, as credits
      are a currency incentive to renew. This is architecturally similar to consumption-growth models at
      Snowflake or AWS, and is a meaningful retention-by-design differentiator versus per-seat GTM tools.
    claimRefs:
      - CU027
      - CU031

