  productSummary: >-
    Clay is a GTM data-orchestration platform that integrates 150+ third-party enrichment
    providers in a waterfall model, runs AI-powered research agents (Claygent), monitors
    trigger signals (job changes, funding rounds, website visits), automates CRM sync, and
    delivers outbound sequences, paid-media audiences, and MCP-based AI-assistant
    integrations—all from a no-code spreadsheet-like interface.
  customerFocus: >-
    B2B revenue teams—GTM engineers, RevOps operators, growth marketers, and enterprise
    sales leaders—across self-serve power users, specialist implementation agencies
    (Claygencies), growth-stage software companies, and enterprise organizations
    including OpenAI, Anthropic, Figma, Intercom, Vanta, Ramp, Rippling, and Canva.
  businessModel: >-
    Consumption-based SaaS with dual usage meters—Data Credits (charged per enrichment
    provider query at $0.05+ each) and Actions (platform orchestration at <$0.01 each).
    Four published tiers from Free to Enterprise (custom annual), plus consumption
    overage. Enterprise contracts run into hundreds of thousands of dollars per year and
    include SSO, RBAC, data-warehouse sync, and dedicated Growth Strategist support.
