acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      SR037 (ISO 42001:2023 standard page, iso.org/standard/81230.html) is the official
      ISO standard specification page. The ISO website was not included in the chapter's
      active fetch-url retrieval trail because the source is a well-known stable standards
      body document. The ISO 42001 standard itself is a published, publicly verifiable
      international standard (December 2023); the citation is used solely to define the
      standard Clay claims compliance with on its pricing page, which is corroborated by
      the primary clay.com/pricing source (SR003).
