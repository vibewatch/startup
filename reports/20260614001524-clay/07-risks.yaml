      severity: blocking
      topic: compliance-gap
      missingEvidence: "Clay's SOC2 Type II report, ISO 27001 certificate, GDPR Data Processing Agreement template, and subprocessor list for 150+ provider integrations; also Clay's California data broker registration status."
