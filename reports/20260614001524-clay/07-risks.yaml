callouts:
  - calloutType: risk
    title: "Privacy/Compliance Chain-of-Custody: Critical and Unverifiable from Public Evidence"
    body: >-
      Clay's privacy policy has not been updated since September 2020 and does not cover Claygent, Signals,
      Clay Ads, Clay MCP, or data-warehouse sync. Its Trust Center renders minimal content, providing no
      verifiable SOC2, ISO 27001, or GDPR artifacts. Cognism—a direct competitor—explicitly cites this
      gap as a reason to switch. For EU-regulated enterprise buyers, this is a procurement blocker.
      This risk cannot be resolved from public evidence alone; the diligence process must obtain the
      SOC2 report, GDPR DPA template, and subprocessor list directly from Clay management.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR009

  - calloutType: risk
    title: "Platform Bundling: HubSpot's Dual Role as Investor and Competitive Threat"
    body: >-
      HubSpot invested in Clay via its venture arm and is simultaneously launching Breeze Intelligence
      as a native CRM enrichment capability targeting Clay's core SMB and growth-tier use case.
      ZoomInfo rebranded to NASDAQ: GTM and positioned as a "Modern Revenue Operating System" in direct
      competition with Clay's orchestration layer. These are not theoretical future threats—HubSpot Breeze
      Intelligence exists, and ZoomInfo actively targets Clay's buyer archetype. A thesis-break scenario
      is any announcement that Breeze Intelligence is included at no incremental cost in HubSpot's
      Growth or Professional CRM tiers.
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR028

  - calloutType: risk
    title: "Valuation Multiple: 50× Revenue at $5B Embeds Assumptions ZoomInfo's Decline Challenges"
    body: >-
      Clay is valued at approximately $5B on ~$100M ARR (50× revenue). ZoomInfo—the most relevant public
      comparable—generated $1.21B in 2024 revenue with 87% NRR and trades at ~2-3× revenue. The premium
      is justified only if Clay sustains 70%+ ARR growth for 4+ years without retention deterioration.
      ZoomInfo's NRR trajectory provides the adverse case: a company in the same GTM intelligence category
      lost ground with existing customers at scale. Clay's NRR is undisclosed. This risk cannot be hedged;
      it can only be underwritten with explicit growth-rate assumptions.
    claimRefs:
      - CR043
      - CR044
      - CR045
      - CR046
      - CR047
      - CR048

  - calloutType: insight
    title: "Low Burn Is a Genuine Positive — But Does Not Offset Entry Multiple Risk"
    body: >-
      Clay's confirmed burn rate of "just a few million dollars a year" as of early 2025 is a meaningful
      operational positive. Combined with $140M in primary capital raised, Clay has effectively unlimited
      runway at current burn levels. This substantially de-risks the solvency scenario and gives management
      optionality on IPO timing. However, low burn does not offset the valuation multiple risk: a company
      that never goes bankrupt but grows at 40% instead of 80% compresses from 50× to 15× in three years,
      delivering negative returns to $5B-entry investors.
    claimRefs:
      - CR042
      - CR043
      - CR044
      - CR046

