  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation with Adoption Path
    body: >-
      Clay's market is characterized by three distinct roles in the purchase and adoption
      workflow: the budget owner (buyer), the hands-on operator (user), and the contract
      approver (payer). These do not always coincide, and misalignment among them is a key
      determinant of adoption pace and churn risk.

      Budget owners are typically senior revenue or marketing leaders—VP Sales, VP Marketing,
      CRO, or Head of Growth—who control the GTM technology budget. At smaller companies
      (sub-100-person), the CEO or a founder may hold this role. At enterprise-scale companies
      such as Intercom, Canva, and Ramp (all publicly named Clay customers), budget ownership
      has migrated to a dedicated GTM Engineering or GTM Operations function, sometimes
      reporting to the CRO and sometimes to the CFO or CTO, reflecting the engineering character
      of Clay's workflows.

      Users (hands-on operators) fall into five recognizable segments: (1) GTM engineers who
      build automated prospecting and enrichment workflows; (2) RevOps teams who maintain
      CRM data quality and build routing logic; (3) growth marketers running programmatic
      outbound campaigns; (4) sales development representatives who consume enriched records
      and trigger sequences; and (5) customer success managers monitoring expansion signals.
      Clay serves all five, but its product-led community growth originally anchored on GTM
      engineers and RevOps practitioners—technically fluent builders who are power users of
      the credit-based waterfall enrichment system.

      Payers (contract approvers) are procurement or finance functions at mid-market and
      enterprise accounts. Clay's credit-based pricing model—where Data Credits are consumed
      per enrichment lookup—is unusual because it directly maps cost to data consumption,
      making procurement conversations about ROI (cost per enriched record vs. alternative
      vendor contracts) rather than seat licenses. Enterprise payers sign annual commitments;
      self-serve users on Launch and Growth plans pay monthly via credit card, bypassing
      procurement entirely.

      Adoption path in concrete workflow terms: (1) Free tier—a practitioner discovers Clay
      via community, a Claygency referral, or the MCP integration in Claude/ChatGPT; 100 Data
      Credits and 500 Actions/month are enough to build a test enrichment workflow on up to 200
      rows. (2) Launch tier ($185/mo)—the practitioner scales their first prospecting workflow,
      adding phone number enrichment, job change signals, and email campaign integration.
      (3) Growth tier ($495/mo)—the team integrates CRM auto-sync, webhook automation, web
      intent tracking, and Ads audience pushes, evolving from a point tool to a data
      infrastructure layer. (4) Enterprise tier (custom annual contract)—the company deploys
      Clay as a full GTM data platform with SSO, RBAC, data warehouse syncs, and a dedicated
      Growth Strategist; this tier is typically triggered by internal scalability limits or
      compliance requirements. The median upgrade trigger is evidence of ROI in a prior tier
      (e.g., 2–3× enrichment coverage improvement vs. single-provider alternatives).
