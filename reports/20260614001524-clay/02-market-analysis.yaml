      whyItMatters: >-
        The Clay $5B valuation implies underwriting of a large orchestration-platform TAM;
        if the true market is closer to $3.8B and growth is slower than Mordor assumes,
        the valuation implies a substantially more aggressive share capture than at $4.99B.
      diligencePath: >-
