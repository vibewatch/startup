        covering 2026; triangulate with public-company ZoomInfo 10-K addressable-market
        disclosure language.
      relatedQuestionRefs:
        - QM001
        - QM004
        - QM023

    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        No independent sizing of the data enrichment orchestration sub-segment (Clay's SAM)
        exists; the $1.2–1.5B SAM estimate relies on circular reasoning from Clay's own ARR.
      whyItMatters: >-
        If the true SAM is $500M, Clay's 20% penetration suggests near-saturation; if SAM
        is $3B, substantial headroom remains. The investment thesis turns materially on this
        distinction and it cannot be resolved from public sources.
      diligencePath: >-
        Commission a custom analyst segmentation or request Clay's internal TAM/SAM analysis
        as part of Series C diligence data room; compare against ZoomInfo's 2024 10-K
        addressable market disclosures.
      relatedQuestionRefs:
        - QM005

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Clay's gross margin for the data-credit (enrichment) revenue stream is not publicly
        disclosed; understanding the margin impact of wholesale data-partner rates is critical
        for evaluating the credit model's sustainability at scale.
      whyItMatters: >-
        Consumption-based SaaS gross margins can deteriorate rapidly if wholesale data costs
        are sticky; if Clay's data partners raise rates (e.g., ZoomInfo, Bombora bulk
        contracts), credit margin compression could structurally reduce profitability as
        the business scales.
      diligencePath: >-
        Request gross margin breakdown by revenue stream (platform subscription vs. data
        credits vs. action credits) in the Series C diligence data room; benchmark against
        ZoomInfo's ~75–80% SaaS gross margin.
      relatedQuestionRefs:
        - QM022

    - type: missing-source
      severity: minor
      topic: gtm-engineering-durability
      missingEvidence: >-
        No independent labor-market study of GTM engineering role durability over a 3–5 year
        horizon exists in public sources; the ~100 GTME job postings per month figure is
        sourced from Clay itself (company-claimed).
      whyItMatters: >-
        Clay's community moat and word-of-mouth growth depend heavily on the GTME job
        category persisting as a recognized professional function; if the category is a
        temporary AI-hype artifact, the community flywheel and PLG growth loop could weaken.
      diligencePath: >-
        Monitor LinkedIn Talent Insights for GTME job posting trend data (Q3/Q4 2026);
        interview 5–10 RevOps practitioners at Clay customers to assess whether GTME is a
        permanent headcount function or a transitory role.
      relatedQuestionRefs:
        - QM017

