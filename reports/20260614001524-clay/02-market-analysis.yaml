callouts:
  - type: risk
    title: "Platform bundling substitution ceiling"
    body: >-
      HubSpot and Salesforce are adding AI enrichment natively to CRM contracts, creating a
      growing substitution ceiling on Clay's SAM. Clay must demonstrate superior enrichment
      coverage and orchestration depth—not just data access—to retain budget share as CRM
      giants commoditize the point-solution data layer.
    claimRefs:
      - CM027
      - CM031

  - type: insight
    title: "Contradictory TAM estimates preserved"
    body: >-
      Two analyst estimates diverge by ~24% ($4.99B vs ~$3.8B implied for 2026). The higher
      figure likely reflects AI acceleration since 2022. Investors should triangulate with an
      additional independent source before anchoring on either estimate for underwriting purposes.
    claimRefs:
      - CM006
      - CM007

  - type: strength
    title: "Consumption pricing aligns with fastest-growing pricing model"
    body: >-
      Mordor Intelligence identifies pay-as-you-go as the fastest-growing pricing model in the
      sales intelligence market at 18.51% CAGR through 2031—matching Clay's credit-based
      consumption model and validating its differentiated packaging vs. seat-license incumbents.
    claimRefs:
      - CM009
      - CM020

  - type: insight
    title: "Clay's SAM is narrower than the headline TAM"
    body: >-
      Clay does not own proprietary contact data; it orchestrates 150+ third-party providers.
      This means its SAM excludes the raw data-access revenue of ZoomInfo ($1.1B) and is limited
      to the orchestration and workflow layer—roughly $1.2–1.5B. At $100M ARR, Clay already
      holds ~7% of this narrower SAM, implying meaningful concentration risk if 1–2 large
      data-provider contracts shift (e.g., ZoomInfo or Bombora raising wholesale rates).
    claimRefs:
      - CM008
      - CM013

