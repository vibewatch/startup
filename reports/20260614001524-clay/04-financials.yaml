  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Clay's blended gross margin percentage broken down by revenue line (data credits,
        actions platform, AI inference, enterprise commitments).
      whyItMatters: >-
        Gross margin is the single most important input to a SaaS valuation model. Without
        it, the $5B implied valuation cannot be stress-tested against any reasonable scenario.
        The data-credit passthrough and AI inference passthrough create structural complexity
        that external analysts cannot resolve from price-list data alone.
      diligencePath: >-
        Request income statement with COGS separated into: data-provider wholesale fees,
        AI inference costs, hosting/infrastructure, and support. Compute gross margin by
        revenue line and blended.
      relatedQuestionRefs:
        - QI005
        - QI012
        - QI025
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: blocking
      topic: nrr
      missingEvidence: >-
        Net revenue retention rate by customer vintage and segment (enterprise vs. self-serve).
      whyItMatters: >-
        A 50× ARR multiple requires NRR well above 100% to be defensible. ZoomInfo's 87%
        NRR in a related market provides context: even a well-established GTM data product
        can face retention pressure. Without NRR, the durability of Clay's ARR base is
        unquantifiable.
      diligencePath: >-
        Request cohort-level NRR for the 2022–2024 customer vintages; separate enterprise
        (annual contract) from self-serve (monthly credit subscription); disclose gross
        revenue and net revenue per cohort at 12 and 24 months.
      relatedQuestionRefs:
        - QI025
        - QI012
        - QI022
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: >-
        Customer ARR concentration: share of total ARR attributable to top-5 and top-10 customers.
      whyItMatters: >-
        Clay's enterprise logos include OpenAI, Anthropic, Canva, Ramp, and Rippling. If a
        small number of enterprise accounts represent a disproportionate share of ARR, the
        revenue base is more fragile than the aggregate growth rate suggests.
      diligencePath: >-
        Request ARR distribution by decile; flag any single customer representing more than
        5% of total ARR; obtain NRR separately for the top-10 and rest-of-base cohorts.
      relatedQuestionRefs:
        - QI022
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: free-to-paid-conversion
      missingEvidence: >-
        Conversion rate from free-tier users to paying plans; monthly active user count for
        the free tier; time-to-paid distribution.
      whyItMatters: >-
        With 300,000+ registered teams and only 5,000+ confirmed paying customers (as of
        January 2025), the implied conversion rate is below 2%. Whether this reflects a
        large unfunded trial base (retention risk) or a deliberate free-layer strategy
        (future monetization opportunity) is unknown and material to growth forecasting.
      diligencePath: >-
        Request monthly active free users, 90-day cohort conversion from free to any paid
        tier, and median time-to-first-paid for PLG conversions.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: cash-balance
      missingEvidence: >-
        Clay's actual cash and cash-equivalent balance as of the most recent month-end.
      whyItMatters: >-
        While burn is low and primary capital raised is large, the actual treasury position
        affects financial flexibility, IPO optionality, and acquisition capacity. The
        characterization of the Series B as "untouched" is a point-in-time statement from
        January 2025; actual cash status as of June 2026 is unknown.
      diligencePath: >-
        Request the most recent unaudited balance sheet and bank statement supporting the
        cash line; confirm whether any escrowed, pledged, or restricted cash exists.
      relatedQuestionRefs:
        - QI006
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: minor
      topic: headcount-revenue-per-employee
      missingEvidence: >-
        Clay's current headcount as of 2025–2026 and the resulting revenue-per-employee
        metric at $100M ARR; only FY2024 data (~95 employees, ~$30M revenue) is available.
      whyItMatters: >-
        Revenue per employee is a key capital-efficiency proxy. At $100M ARR the FY2024
        ratio of ~$315K/employee would scale to ~$1M+/employee if headcount has grown
        modestly (e.g., to 150 employees), which would be an exceptionally lean cost
        structure for a SaaS company at this ARR. Without current headcount, this signal
        cannot be updated.
      diligencePath: >-
        Request current headcount from LinkedIn or IR update; reconcile with TechCrunch
        May 2025 report of "over 150" employees and confirm ARR-per-employee ratio.
      relatedQuestionRefs:
        - QI016

    - type: private-evidence-only
      severity: minor
      topic: realized-pricing
      missingEvidence: >-
        Effective realized price per Data Credit and per Action across volume tiers; impact
        of enterprise volume discounting on blended ARPU.
      whyItMatters: >-
        List prices set a ceiling; enterprise volume discounts set the realized floor.
        If top accounts pay substantially below list, reported ARR overstates the health of
        the revenue base relative to a model built on list pricing alone.
