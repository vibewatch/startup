  - id: TI005
    title: Public Financial Gaps and Diligence Blockers
    columns:
      - Missing Metric
      - Impact on Analysis
      - Severity
      - Exact Diligence Path
    rows:
      - - Gross margin %
        - Cannot model unit economics, margin expansion trajectory, or sustain a valuation model
        - Blocking
        - Request income statement with COGS broken out by data-provider fees, AI inference, hosting, and support
      - - Net revenue retention (NRR)
        - Cannot assess whether ARR base compounds or compresses; 50× ARR multiple unsupported without NRR
        - Blocking
        - Request cohort NRR by vintage, segment (enterprise vs. self-serve), and customer type
      - - Customer-level ARR concentration
        - Top-5 and top-10 customer concentration unknown; single-account dependency unquantifiable
        - Material
        - Request ARR distribution by decile and identify whether any single customer exceeds 5% of ARR
      - - Logo and dollar churn by cohort
        - Consumption model can mask partial churn as spend reduction rather than contract termination
