callouts:
  - calloutType: strength
    title: Exceptional Capital Efficiency
    body: >-
      Clay reached $100M ARR burning only a few million dollars per year, implying a burn
      multiple far below 1.0×—the strongest possible signal of product-led monetization
      efficiency. The Series B ($46M) remained undeployed as of January 2025, nearly eight
      months after closing, demonstrating that growth was outpacing the need for capital
      deployment, not the other way around.
    claimRefs:
      - CI003
      - CI004
      - CI005

  - calloutType: risk
    title: Undisclosed Gross Margin is a Blocking Underwriting Gap
    body: >-
      Clay's dual passthrough model—data provider costs embedded in Data Credits and
      AI inference costs passed at zero markup—creates a structurally complex COGS profile
      that cannot be reverse-engineered from public disclosures. Without gross margin,
      a valuation model anchored at $5B / 50× ARR cannot be stress-tested. ZoomInfo's
      87% NRR and -2% YoY revenue decline in FY2024 demonstrate that even at scale,
      GTM data products can face margin compression and retention challenges.
    claimRefs:
      - CI033
      - CI036
      - CI037

  - calloutType: risk
    title: 50× ARR Multiple Requires Exceptional NRR Evidence
    body: >-
      The January 2026 tender offer implied ~50× trailing ARR. Historical precedent for
      sustaining such multiples at IPO requires NRR above 130% and gross margin above 70%.
      Both figures are undisclosed for Clay. Absent a data-room access that confirms these
      thresholds, the current implied valuation represents a speculative premium on
      trajectory, not an independently supported intrinsic value estimate.
    claimRefs:
      - CI003
      - CI007
      - CI034
      - CI037

  - calloutType: recommendation
    title: Request Six Data-Room Items Before Pricing a Position
    body: >-
      Any prospective investor or acquirer should require: (1) audited or management-confirmed
      GAAP revenue and gross margin for FY2024 and FY2025; (2) NRR by customer cohort; (3) ARR
      distribution (top-10 customer concentration); (4) logo and dollar churn rates by segment;
      (5) month-end cash balance as of the most recent close; and (6) an enterprise contract
      sample showing the committed-term structure and renewal economics. These six items are
      the minimum necessary to corroborate the $5B valuation implied by the January 2026 tender.
    claimRefs:
      - CI036
      - CI037
      - CI038
      - CI039

