  - id: gtm-sales-efficiency
    title: GTM Motion and Sales Efficiency Proxies
    body: >-
      Clay's GTM motion is a hybrid of product-led growth (PLG), community-led distribution,
      and an emerging enterprise sales layer. The free tier functions as the PLG funnel: users
      enter at zero cost, experience the product, and graduate to paid tiers as usage volume
      triggers credit and Action limits. Clay's 20,000+ member Slack community and 90+ Clay
      Clubs globally serve as organic demand-generation and retention infrastructure at
      minimal direct cost. Beyond the community, Clay has cultivated more than 100 specialist
      agencies—Claygencies—who implement Clay for enterprise and mid-market clients; ColdIQ,
      one such agency, reached $3.5M in ARR with 21 employees by operating a fully Clay-native
      outbound practice. Claygencies create a distributed sales force that generates enterprise
      referrals and implementation demand without carrying on Clay's headcount.


      Direct sales efficiency proxies are limited by Clay's private status, but several
      signals support high efficiency. Forbes (January 2025) reported approximately $30M in
      FY2024 revenue with a 95-employee team, implying roughly $315K revenue per employee—
      a strong proxy for both product-led revenue capture and lean sales overhead. The Series B
      ($46M) remained untouched as of January 2025, and the subsequent $40M Series B expansion
      was raised pre-emptively without a formal process—indicating the growth was outpacing
      burn, not requiring new capital to fund CAC.


      Clay's enterprise cases illustrate the economics of expansion within accounts: OpenAI
      doubled enrichment coverage from ~40% to ~80% and runs 8,500+ enrichments per week
      from the Salesforce package alone; Intercom generated ~$1M in pipeline within one month;
      A-LIGN replaced a $60K annual contractor and reduced research costs by 83%. These
      outcomes suggest high dollar-weighted NRR potential, but the actual NRR figure is
      undisclosed and is a diligence requirement given the consumption model's inherent
      variability.
    claimRefs:
      - CI020
