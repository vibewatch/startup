summary:
  headline: Clay 已在 $100M ARR 规模证明了出色的产品市场契合、资本效率和社区壁垒，但 $5B 要约交易隐含估值押注了未经验证的 NRR 与毛利率假设；没有数据室资料，还不能给出确信买入判断。
