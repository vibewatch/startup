summary:
  headline: >-
    Clay has achieved exceptional product-market fit, capital efficiency, and community moat at $100M ARR, but the $5B
    tender-implied valuation embeds unverified NRR and gross-margin assumptions that prevent a conviction buy without
    data-room access.
