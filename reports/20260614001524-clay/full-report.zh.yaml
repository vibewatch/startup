  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览：发生概率、影响与剩余暴露
        blocks:
          - type: paragraph
            body: >-
              Clay 的十大核心风险按估计剩余严重度排序如下。排序反映了发生概率（三年期内发生的可能性）与投资影响（对收入、估值或投资逻辑连续性的潜在损害）的乘积，并按缓释成熟度折减（Clay
              已经处理该风险的程度）。风险严重度分为：Critical（剩余暴露高到足以挑战投资逻辑）、High（下行显著但可处理）、Medium（值得关注，但可通过监控管理）和
              Low（背景噪音）。所有严重度判断只基于公开证据；管理层非公开回复、法律陈述和未披露认证都可能改变任何评级。

              三个 Critical 级风险是：（1）隐私 / 合规链路托管——公开信号显示缓释成熟度低，欧盟和加州监管活动高，竞争对手也在合规上强化差异化；（2）平台捆绑导致商品化——HubSpot（Clay
              自己的投资人）正在推出 Breeze Intelligence，ZoomInfo 改名后瞄准 Clay 的精确用例，Salesloft 也把数据补全加入平台，形成三向竞争包围；（3）供应商 / API
              依赖——如果 Clay 前 5 大数据供应商中的任何一家限制访问或涨价，瀑布流覆盖优势会收窄，单位经济会直接受冲击。

              High 级风险包括 AI 幻觉和数据质量、送达率 / 垃圾邮件观感，以及二级交易中嵌入的估值倍数。Medium 级风险包括企业客户集中度、Claygency 渠道依赖和安全认证缺口。Low
              级风险包括烧钱速度（已确认较低）和创始人关键人风险（两位拥有深厚产品基因的创始人仍在一线）。

              投资含义：三个 Critical 风险可以通过尽调要求部分处理（DPA、SOC2 报告、子处理方清单、供应商合同条款），但单靠公开证据可能无法完全解决。估值风险内嵌在入场价格中，无法通过尽调消除。
