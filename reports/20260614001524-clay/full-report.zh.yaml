      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Clay 的 trust posture 落后于产品成熟度。Trust center（trust.clay.com）可公开访问，但只有品牌信息，没有记录 security
              certifications（SOC2、ISO 27001）、没有公开 uptime history，也没有 subprocessor list。Privacy policy 最后更新于 2020 年 9
              月——早于 Clay 当前的 B2B data-enrichment、waterfall、Claygent、MCP、Signals、Sequencer 和 Ads 能力——导致 policy scope
              与产品现实之间出现重大缺口。Clay 处理来自第三方 providers 的 personal data，以支持 B2B prospecting；在 GDPR（EU）、PECR（UK）和
              CCPA（California）下，这类活动需要记录 lawful bases、data-subject rights workflows，并在某些司法辖区明确归类为 data broker。Clay
              没有公开记录这些内容。

              对比来看，Cognism 持有 IAB Europe GDPR PECR Gold Champion certification，并发布专门 compliance page，说明其 legal
              basis、opt-out registry 和 DPA framework。Apollo 的 privacy policy 明确按 CCPA 标注其 practices，并说明自己如何归类为 data
              broker。Clay 的公开材料两者都没有覆盖。Payment processing 委托给 Stripe（PCI scope），这是合适的，但也是唯一清楚记录的第三方安全委托。处在严格 security 和
              compliance requirements 下的 enterprise B2B customers（financial services、healthcare、government），会遇到文档缺口；如果
              Clay 不能按要求直接提供 DPA、SOC2 或等价 assurance，采购可能停滞。这是企业化动作中最关键的尽调缺口。
