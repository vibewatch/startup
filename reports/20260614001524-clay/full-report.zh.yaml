  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              Clay 的收入模型基于用量，围绕两个并行用量表设计：Data Credits 用来购买 Clay 的 150+ data-provider marketplace 里的数据；Actions
              用来支付平台编排工作，例如运行 enrichment workflows、调用 AI models、把 records 推到 CRM，或导出数据。双计量设计把数据采购成本与平台计算成本拆开：Clay 可以把
              data-provider wholesale rates 作为 Data Credits 直接转嫁给客户，同时在 Actions 上保留平台利润。Data Credits 起价 $0.05 /
              个，随规模下降；Actions 起价低于 $0.01 / 个，也会随规模下降。客户如果自带 data-provider API keys，就完全跳过 Data Credits，只支付
              Actions——这个结构性选择让 Clay 对高量 enrichment 用户保持竞争力，但也降低这些账户上来自数据转售的 Clay gross revenue。


              公开层级从 Free（每月 100 Data Credits / 500 Actions）到 Launch（$185/mo，2,500 Data Credits / 15,000
              Actions）、Growth（$495/mo，6,000 Data Credits / 40,000 Actions），再到 Enterprise（定制年度承诺，100,000+ Data Credits /
              200,000+ Actions）。如果某个 Enterprise 客户的承诺金额接近 Clay 披露合同示例中的「每年数十万美元」，其 ARR 贡献会显著高于 self-serve SMB
              账户。Enterprise 定价加入 dedicated Growth Strategist support、SSO、RBAC、data-warehouse sync 和 unlimited
              Audiences，这些都会带来低层级没有的合同黏性。


              AI model 使用带来第三个收入组成：80% 的模型按固定 credits 计费，GPT-5.1 和 Claude 4.6 Sonnet 等 frontier models 按可变 token
              价格计费（按成本原价，无加价）。Clay 决定以零加价转嫁 frontier model inference，是一个有意为之的设计选择：它降低客户运行 AI-intensive workflows
              的边际成本——提升 engagement 和 credit consumption volume——代价是不在 AI 组件上赚取利润。因此，AI enrichment 收入嵌在 Actions 和 Data
              Credit 消耗中，而非单独列示，使外部更难拆解 gross margin。企业层面的合同规模达到每年数十万美元；截至 2025 年 1 月，超过 5,000 个客户拥有活跃付费账户，到 2026
              年平台上注册的 GTM teams 增至 300,000+（免费和付费合计）。
