      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 隐私 / 合规链路托管：Critical，且无法从公开证据核验
            body: >-
              Clay 的隐私政策自 2020 年 9 月以来没有更新，未覆盖 Claygent、Signals、Clay Ads、Clay MCP 或数据仓库同步。它的 Trust Center
              只渲染极少内容，没有提供可核验的 SOC2、ISO 27001 或 GDPR 材料。Cognism
              这个直接竞争对手明确把这个缺口列为切换理由。对欧盟受监管企业买家来说，这是采购阻断点。该风险无法仅靠公开证据解决；尽调必须直接从 Clay 管理层取得 SOC2 报告、GDPR DPA 模板和子处理方清单。
