        - 多团队 / 模块扩张
        - 反向 / 限制标记
      rows:
        - label: OpenAI
          values:
            - 强——完整案例研究
            - 是——每周采用，Salesforce 软件包
            - 间接：仅丰富指标（2× 覆盖）
            - 是——RevOps + 数据科学 + 招聘
            - 自报；无第三方审计
        - label: Anthropic
          values:
            - 中等——简短案例研究 + Series B 提及
            - 是——生产环境入站打分
            - 3× 丰富覆盖（无 $ 数字）
            - 部分——丰富后加入会议准备
            - 公司声称；细节有限
        - label: Figma
          values:
            - 强——完整案例研究（2026）
            - 是——持续 CRM 丰富 + Ads 已上线
            - 未量化（战略基础设施）
            - 是——丰富 + 信号 + 广告 + 需求生成
            - Beta Audiences 功能；ROI 未披露
        - label: Intercom
          values:
            - 强——完整案例研究 + Forbes 提及
            - 是——全组织 GTM 获客
            - $1M 管道（首个项目）
            - 是——从项目扩张到全组织
            - 仅管道；无已成交收入数字
        - label: Vanta
          values:
            - 强——完整案例研究
            - 是——实时入站 + 信号自动化
            - 未量化（生产率 + 覆盖）
            - 部分——计划招聘专职 GTME
            - 满意度 / 留存未披露
        - label: Sendoso
          values:
            - 强——完整案例研究 + Clay 主页
            - 是——生产环境出站 + 礼品集成
            - $1M+ 管道；回复率提升 20%
            - 部分——单一团队
            - 归因方法为内部口径
        - label: A-LIGN
          values:
            - 强——完整案例研究（2025）
            - 是——竞争替换已在 Salesforce 上线
            - $3.3M 已成交收入；较 2024 年管道 +40%
            - 是——竞争研究 + 活动 + CRM 运营
            - 通过内部 SPIFF 标签做收入归因
        - label: Coverflex
          values:
            - 中等——完整案例研究
            - 是——生产环境信号监控（3M+ 公司）
            - 200+ 演示/月（无 $ 数字）
            - 部分验证——营销 + MDR 团队
            - EU 市场；无独立验证
        - label: Oyster
          values:
            - 中等——完整案例研究
            - 是——仍在使用（但案例较旧，2023–2024）
            - 每名销售代表每月节省 40 小时（无金额）
            - 部分验证——BDR + 营销
            - 最早的案例研究；当前留存未确认
    approximationNotes: 证据质量评估（强 / 中等）看的是公开案例材料的深度和具体程度，并非独立审计。所有财务数字都是 Clay 案例研究中的管理层估算。「生产部署」分类依据案例材料里的表述。
