  - id: FU004
    title: 关键客户指标——截至 2026 年 6 月的时点证据快照
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，公开来源可获得四项关键客户指标；这些指标均来自公司声称或媒体报道，缺少独立验证，置信度为中低。
