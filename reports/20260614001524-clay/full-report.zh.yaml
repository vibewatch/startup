      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Clay 的架构是多层 cloud SaaS platform，公开资料中没有 self-hosted deployment option。Data acquisition layer 按需调用第三方
              provider APIs；waterfall orchestration engine 对这些 calls 排序、路由 retries，并只在找到匹配时触发 billing。在其上，Claygent AI
              layer 调用 large language models（OpenAI 以及可在 Claygent Builder 中配置选择的替代模型）执行 web-research tasks、content
              generation 和 ICP scoring。Workflow/automation layer 运行异步 enrichment jobs、signal-detection routines 和
              sequence-enrollment logic。Integration layer 与 CRM、sales-engagement 和 data-warehouse targets 做双向同步，包括
              Salesforce、HubSpot、Salesloft、Outreach、Snowflake 和 Dynamics 365。MCP protocol layer 把打包的 GTM
              workflows（Functions）暴露给外部 AI interfaces，并带有 admin-controlled permissions 和 per-user credit budgets。

              No-code interface 把这一切抽象成行列表格：每一行是一个 prospect，每一列是一个 enrichment action。用户按优先顺序串联 providers
              来搭建「waterfalls」；engine 一旦找到匹配就停止查询，避免重复成本。Claygent Builder（2026 年 5 月推出）加入 version control、针对 production
              data 的 free-test mode、model-switching，以及用于迭代 prompt refinement 的对话式「Sculptor」UI。2026 年 1 月 changelog
              release 提到 action runs 加快 22x，AI processing 加快 10x。Cloud infrastructure provider 未公开披露；也没有发布 platform
              uptime 的 SLA。
