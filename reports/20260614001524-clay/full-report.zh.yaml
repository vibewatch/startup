  - id: TV005
    title: 论点破裂与退出触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 增长放缓
        - YoY ARR 增长连续两个季度低于 2×
        - 击穿基准情景；若 CAGR 低于 $100M，$5B 入场价意味着 >30× forward ARR
        - 退出持仓；按 $1.5–2B 公允价值重新评估
      - - 任一分部 NRR 低于 100%
        - SMB 或代理 cohort 确认 NRR < 100%
        - 说明流失超过扩张；消耗型模式的牛市情景靠留存驱动 upsell 撑住
        - 下调为回避；熊市情景变成基准情景
      - - 毛利率低于 55%
        - 披露 GM < 55%
        - 数据转嫁模式结构性压低利润率；SaaS 溢价倍数需要 65%+ GM
        - 估值上限必须重置到 15–20× ARR；当前 $5B 入场价是 50×，需要重新定价
      - - 监管执法行动
        - GDPR 或 CCPA 执法指向 Clay 或主要 Claygency
        - 触发客户流失（企业合规门槛）、运营成本上升和 ARR 放缓
        - 升级法律风险尽调；除非禁令范围很窄，否则退出
      - - 在位厂商低价捆绑
        - ZoomInfo、HubSpot 或 Salesforce 向现有客户以 $0 加购价捆绑可比 enrichment waterfall
        - 抹掉 Clay 在中端市场账户的核心价格优势；冲击代理经济模型
        - 重新评估竞争护城河；跟踪当前 Claygencies 的替换率
    notes: 触发项有证据支撑，但阈值是分析师判断，不是公司披露的 KPI 底线。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按分部拆分的 NRR
        - 净收入留存按企业、中端市场、代理和自助 cohort 拆分，至少提供 4 个季度历史
        - 在消耗型模型里，NRR 是估值最关键的单一驱动；90% 与 120% NRR 的差距，就是 $2B 与 $10B 结果的差距
        - 数据室；CFO/VP Finance 访谈
      - - 毛利率
        - 披露 GAAP 收入口径毛利率，并拆分 data-credit 转嫁成本、AI 推理成本和平台贡献
        - GM 低于 55% 会结构性限制可实现估值倍数；GM 高于 70% 才能确认溢价定价权
        - 数据室；经审计或审阅的 P&L
      - - 股权结构和优先权堆栈
        - 完整 cap table，包含 $2B、$3.1B 和 $5B 退出情景下的清算优先权 waterfall；反稀释条款
        - 九个月内三次 tender 事件已形成复杂优先权结构；$3.1B 估值的 Series C 清算优先权可能压低普通股回报
        - 法律尽调；cap-table 管理平台导出
      - - 合规文件
        - SOC2 Type II 报告、与前 10 大 enrichment 提供商的 GDPR DPA、CCPA 数据经纪人注册状态、subprocessor 清单
        - 合规缺口最可能卡住企业采购，也是规模化后风险最高的监管敞口
        - 法律尽调；trust.clay.com 内容审计
      - - 客户集中度
        - 前 10 大客户占 ARR 比例；前 10 大 Claygencies 占 ARR 比例；按 cohort 拆分的流失历史
        - 依赖代理渠道会带来集中度风险；如果 Claygencies 占 ARR >30%，商业模式会比直接企业 ARR 更脆弱
        - 数据室；收入分析
    notes: 尽调问题按估值影响排序；若按当前 $5B 隐含入场价投资，五项都必须先拿到答案。
    claimRefs:
      - CV040
      - CV044
