  - id: TE003
    title: Clay 技术 / 运营架构
    columns:
      - 层级 / 组件
      - 作用
      - 关键依赖
      - 风险
    rows:
      - - 数据采集层
        - 按需调用 150+ 第三方供应商 API，获取联系人、企业画像、技术栈和意图数据
        - 第三方 API（ZoomInfo、Apollo、Lusha、Clearbit、HG Insights、Beauhurst、Ocean.io 等）
        - 供应商 API 配额限制、TOS 变化或服务停运会打断覆盖；没有长期数据独占性
      - - Waterfall 编排引擎
        - 按优先级顺序调用供应商；仅成功匹配时收取 credits；路由重试逻辑
        - Clay 自有路由和计费软件
        - waterfall 配置错误可能产生意外 credit 消耗；兜底逻辑由用户定义，并非平台强制
      - - Claygent / AI agent 层
        - 用 LLM 执行网页研究、结构化数据抽取、内容生成和 ICP 评分
        - OpenAI GPT 模型（主力）和可选替代模型（Builder UI）；网页研究需要互联网访问
        - 模型废弃、成本变化或质量回退都要求更新工作流；模型选择引入供应商依赖
      - - 工作流 / 自动化层
        - 运行异步数据补全任务、Signals 事件检测、sequence enrollment 和 MCP Function 执行
        - Clay 云基础设施（IaaS 供应商未披露）
        - 未发布可用性 SLA；云供应商依赖未披露；2024 年曾出现宕机（社区轶事报告）
      - - 集成层
        - 双向同步到 CRM（Salesforce、HubSpot、Dynamics 365）、SEP（Salesloft、Outreach、Gong）和数据仓库（Snowflake）
        - 合作伙伴 API 稳定性，以及客户侧认证凭据管理
        - 合作伙伴 API 变更或弃用会逼 Clay 更新集成；凭证轮换由客户负责
      - - MCP 协议层
        - 把 Clay Functions 暴露给 AI 界面（ChatGPT、Claude、Codex），权限和 credit 预算由管理员控制
        - OpenAI ChatGPT、Anthropic Claude、OpenAI Codex；MCP 协议规范
        - MCP 仍是新兴标准；破坏性变更可能要求 Clay 侧适配；企业级治理成熟度尚未验证
      - - 数据存储 / 工作区
        - 在 Clay 托管云环境中存储表格、enrichment 结果、工作流配置和审计日志
        - Clay 内部云存储与计算（IaaS 未披露）
        - 数据驻留、可移植性和保留控制没有公开文档；默认不能满足企业 DPA 要求
    notes: 架构判断来自 Clay 官方产品页、changelog、MCP 文档和企业版页面。基础设施供应商、SLA 和内部架构图均未公开披露。
