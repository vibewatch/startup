      - number: '3.2'
        title: 竞争对手画像——规模、融资、产品范围与战略方向
        blocks:
          - type: paragraph
            body: >-
              六个竞争对手因战略接近度高、对 Clay 定位影响实质，需要单独画像。

              Apollo.io：2015 年成立于 San Francisco。Apollo 是领先的 SMB 到 commercial B2B 销售情报平台，也是 Clay 最直接的价格威胁。其基于 credit
              的模型（年度 $49–$119/用户/月）与 Clay 的 Launch 和 Growth 档重叠，面向需要联系人数据加基础序列器、但不需要多来源编排的买方。Apollo 的数据库作为单一自有来源，覆盖
              275M+ 联系人和 65M+ 公司。Apollo 历史上发生过两次数据泄露（2018 年和 2021 年），暴露 130M+ 记录——这是持续的合规负担。Apollo 处于 Series D，估计 ARR 为
              $145M+；它是 Clay 入门市场漏斗最激进的挑战者。

              ZoomInfo Technologies（NASDAQ:GTM）：2007 年以 DiscoverOrg 名义成立，2020 年 IPO，总部 Vancouver WA。ZoomInfo 是最大的自有 B2B
              数据平台，FY2024 GAAP 收入 $1.21B（同比 −2%）、NRR 87%，截至 2024 年 Q4 拥有 1,867 个 ≥$100K ACV 客户。ZoomInfo 于 2024 年推出
              Copilot（AI 账户优先级排序、谈资生成、自动序列），并在 2025 年更名为「GTM Intelligence Platform」。定价只做年度合同，不透明，据报每年
              $15K–$45K+。其战略方向转向全套平台整合，使其与 Clay（数据增强）和 Salesloft（互动）都越来越竞争。收入收缩和 87% NRR 表明它正在防守份额。

              Cognism：2016 年成立于 London。Cognism 是欧洲领先的合规优先 B2B 联系人数据供应商。它运营自有数据集，经过 15+ DNC 登记库筛查，具备 ISO 27001/27701 和
              SOC2 Type II 认证，在合法利益框架下符合 GDPR，并明确把 Clay 的瀑布式数据增强模型定位为合规风险。Standard 方案：$12,750/年（5
              席）；Pro：$17,000/年（增加电话验证和意图数据）。Cognism 不原生提供多来源编排、AI 工作流自动化或序列器，限制了它对 GTM engineering 用例的吸引力。

              Lusha：2016 年成立于 Tel Aviv/New York。Lusha 已扩展到 280,000+ 用户，覆盖 NA/EMEA/APAC/LATAM 的 300M+ 数据点，邮件可送达率
              95–98%，直拨准确率 90%+。它每周处理 7M 条新信号。定价基于 credit：每封邮件 1 credit，每个电话 10 credits；免费档每月提供 40 credits。Lusha 于 2026
              年增加「Deep Intel」，用于基于 ICP 的账户优先级排序。具备 ISO 27701/27001 和 SOC2 Type II 认证，符合 GDPR/CCPA。它主要在 SMB 个人潜客开发者层级与
              Clay 竞争。

              Hunter.io：2015 年成立于 Paris。Hunter 是小团队领先的邮件发现单点解决方案，拥有 7M+ 用户。基于 credit 定价：从 Free（50 credits/月）到
              Enterprise（定制）。Hunter 不提供电话号码、AI agents 或工作流自动化；它只争夺 Clay 的邮件发现 credit 支出，并包含基础序列器（免费方案最多每个序列 500
              名收件人，随档位扩展）。

              Salesloft：2011 年成立，2022 年被 Vista Equity 收购，总部 Atlanta。Salesloft 是收入编排平台，拥有 4,000+ 客户，每月处理 100M+ 封邮件和通话。其
              Cadence（序列器）、Rhythm（AI signal-to-action）、Conversations 和 Deals 模块与 Clay 的 Sequencer 和 Signals
              表面竞争。Salesloft 没有自有数据增强，从包括 Clay 在内的外部供应商获取联系人数据。定价未公开。Forrester 将其评为 2024 年 Q3 Revenue Orchestration
              Platforms Leader。

              HubSpot / Breeze Intelligence：HubSpot 的 Breeze AI 层，包括 Breeze Intelligence（前身 Clearbit），是 Clay 在 SMB
              到中端市场最具存在感的长期替代品。任何 HubSpot CRM 客户都能以现有合同中的边际成本访问 AI 数据增强。HubSpot Sales Hub 包含线索管理、AI 引导销售、Sales
              Automation 和 CPQ——这些能力正在与 Clay 的外呼表面收敛。HubSpot 2024 年拥有 237,000+ 客户和 $2.6B+ 收入。它不提供 Clay 的 100+ 供应商瀑布编排。
