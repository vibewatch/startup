  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 合规责任链
        - 隐私政策更新时间；SOC2 报告可用性；欧盟 DPA 投诉
        - 新产品发布后 12 个月内隐私政策未更新；尽调中无法取得 SOC2 报告；首个欧盟 DPA 执法通知
        - 若 DPA 执法落地则打破投资论点；若交割时缺少 SOC2/DPA，则构成重大尽调障碍
      - - 平台捆绑 / 商品化
        - HubSpot Breeze Intelligence 定价；ZoomInfo 覆盖率基准；Apollo.io 功能对等
        - HubSpot 面向 Growth+ CRM 方案免费提供原生 enrichment；或任何单一竞争对手在独立基准中达到 >65% 邮箱覆盖率
        - 下调估值倍数假设；建模 30-40% SMB 流失至捆绑替代方案的情景
      - - 供应商 / API 依赖
        - ZoomInfo 或 Apollo 关于 API 合作伙伴计划变化的公开公告；Clay 定价页面信用点成本变化
        - 主要供应商（占 Clay 信用点量 >10%）宣布 API 限制或 >30% 涨价；Clay 未能在 90 天内加入可比替代供应商
        - 发起供应商合同披露请求；在数据成本 +30% 情景下压力测试毛利率
      - - 估值 / 回报风险
        - ARR 增长率；NRR 披露；新要约定价
        - ARR 增长率同比降至 50% 以下；首次披露 NRR 低于 110%；下一轮要约对公司的估值持平或低于 $5B
        - 投资论点断裂：按 15-20x 收入退出倍数重写回报假设
      - - AI 幻觉 / 数据质量
        - 关于 Claygent 输出质量的社区投诉；ESP/ISP 送达率事故报告
        - 有记录的社区模式显示 Claygent 不准确影响 >5% enrichment 运行；或 ISP 封锁影响 Clay 的 Sequencer 发件基础设施
        - 加速尽调 AI 质量控制；向管理层索取 Claygent 错误率数据
      - - 企业集中度 / 留存不透明
        - NRR / GRR 披露；前十大客户收入集中度
        - 企业 NRR 低于 115%；前三大客户占总 ARR >20%
        - 修正 DCF 假设；在估值中加入集中度风险折价
      - - 二级市场 / IPO 可选性
        - IPO S-1 申报；额外要约公告；DST 或领投方退出信号
        - 2027 年底前未提交 IPO S-1；第四次要约公布；DST 出售其 Clay 持仓的 >50%
        - 标记为潜在流动性陷阱；将退出路径清晰度列为交割条件
    notes: 触发阈值是分析师估计，设计目标是可通过公开信号监测；私下管理层陈述和董事会沟通会更早预警。否决标准阈值应根据投资时的具体入场估值校准。
