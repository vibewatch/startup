  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层：买家、用户、付款方与用例通道
        blocks:
          - type: paragraph
            body: >-
              理解 Clay 的客户群，最好用两条相互正交的切面：组织内 buyer/user/payer archetype，以及驱动初始采用的主要 use-case lane。

              组织 segments 分为五组。第一，self-serve power users——solo GTM engineers、growth marketers 和 RevOps
              practitioners——通过社区、口碑或免费层发现 Clay，经 Clay University 自助上手，并转化为 Launch（$185/month）或
              Growth（$495/month）计划。这些用户技术流畅、对 per-seat 成本敏感，常成为社区倡导者或 Claygency founders。第二，Claygencies（90+ specialist
              agencies，围绕 Clay 搭建客户工作流）同时是用户、付款方和非正式分发渠道。截至 2025 年 1 月，Clay 报告 90+ agencies，其中多家 run rate
              达数百万美元。Claygencies 创造了准渠道模型：它们获取 Clay 无法直接触达的客户，把 Clay workflows 标准化到整个 verticals，并带来 aggregate demand
              growth。第三，growth-stage B2B software firms（Hex、Rootly、Legora、Coverflex、Oyster、Sana）通常由 RevOps 牵头购买，支付
              Growth-tier 或早期 Enterprise contracts，主要用 Clay 做 outbound prospecting 和 CRM enrichment。第四，category-leading
              companies 的 enterprise GTM
              teams（OpenAI、Anthropic、Figma、Intercom、Vanta、Rippling、Verkada、Ramp、Canva、HubSpot、Mistral AI、A-LIGN）在 annual
              Enterprise contracts 下大规模使用 Clay，合同包含 custom pricing 和 dedicated Growth Strategist support。典型 enterprise
              contract sizes 据称达到每年数十万美元。第五，EU/EMEA expanders（Coverflex 在 Portugal、Spain 和 Italy；Oyster 服务 180+
              countries；Verkada GTM 在 28 个 European countries）是尚未充分开发但已经可见的地理 segment，Clay 提供 legacy single-provider
              tools 无法复制的多国家 data sourcing。

              四条 use-case lanes 推动初始购买决策。Inbound enrichment 是最常见的企业入口：lead 填表后，Clay 自动从 150+ providers enrichment 记录，并把
              scored、segmented data 推到 CRM。Outbound prospecting 覆盖 list building、waterfall enrichment、AI-personalized
              copy 和 sequencer delivery。Signal-based outreach 使用 Clay 的 Signals module 监控 trigger events（job
              changes、funding rounds、SOC2 postings、web visits），并触发自动 enrichment 和 outreach workflows。Ads audiences 借助
              Clay Ads 把动态更新、enriched segments 直接推到 LinkedIn、Meta 和 Google，用始终最新的 ICP-matched lists 替代人工季度导出。

              买家通常是 VP Marketing、VP Sales、Director of Revenue Operations 或 Head of Growth；用户是搭建 workflows 的 GTM
              engineer、RevOps analyst 或 growth marketer；付款方是 GTM 或 marketing budget，偶尔是 ops 或
              IT。小公司里三种角色会合并到一个人。Enterprise deals 会带来额外采购摩擦：SSO、RBAC、security review 和 contract negotiation——这些功能只在
              Enterprise tier 开放。
