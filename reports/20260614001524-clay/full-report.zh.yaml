  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Clay 2017 年在纽约创立，随后经历六年产品迭代、2022 年围绕 product-market fit 重新发布，并在融资上快速加速，到 2026 年 1 月达到 $5B 隐含估值。
    data:
      items:
        - label: Clay 创立
