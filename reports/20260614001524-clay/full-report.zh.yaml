      - number: '6.4'
        title: 留存与耐久性：NRR 缺口、Cohort 未知数与代理信号
        blocks:
          - type: paragraph
            body: >-
              Clay 没有公开披露 NRR、GRR、客户流失率、队列留存曲线、合同续约率或 NPS/CSAT 分数。这是一个实质性尽调缺口。作为一家私营公司，Clay
              没有义务公布这些数字；这些指标通常也只会出现在非公开数据室里。

              虽然缺少直接留存指标，几个代理信号仍指向较强的净收入留存。2024 年收入增长 6 倍，ARR 约 $30M。2025 年 1 月 Series B 扩展轮在上一轮资金尚未动用的情况下，以 $1.25B 估值融资
              $40M——这表明投资人可能在数据室看到了足以支撑该估值的留存指标。2026 年 1 月 Series C 由 CapitalG 领投，以 $5B 估值融资
              $100M，意味着市场对留存质量的信心仍在延续。从机制看，Clay 的按积分消耗计费天然拉动 NRR
              扩张：团队扩大、工作流增多、补全量放大后，客户会自然消耗更多积分，无需另行重谈合同。企业客户续签年度承诺时采用定制定价，很可能反映了扩大的使用量，而不只是原合同底价。

              多个客户案例记录了账户内扩张。OpenAI 从 RevOps 扩到数据科学和招聘。Intercom 从一个持续一个月的 outbound 项目，扩成全组织 GTM 基础设施。A-LIGN
              提到，来自既有客户的总扩张收入超过了新 logo 销售收入。Figma 的部署从 CRM 补全扩到产品信号激活，再到广告受众，最后由自助式需求生成团队接手——约一年内走完四阶段扩张。

              Claygency 渠道带来一种少见的留存动态。把客户工作流搭在 Clay 上的机构，会深度押注平台稳定性，从平台层面形成很强粘性。但如果某个 Claygency
              转向竞争对手或减少用量，可能会同时带走多个终端客户工作流——即便单个终端客户流失率较低，渠道内部仍会形成集中度风险。

              合同期限取决于套餐层级：Enterprise 要求年度承诺；Launch 和 Growth 实际上是月度经常性付费。任何层级的提前终止率或续约率都没有公开信息。外界普遍认为，5,000+ 客户中的大多数在
              Launch 或 Growth（月付）层级，这里的流失动态更接近自助 SaaS，而不是企业合同续约。也没有客户满意度调查、NPS 分数或 G2 评价面板评分可用于衡量满意度。
