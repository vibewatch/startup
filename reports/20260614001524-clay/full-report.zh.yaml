  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Clay 是一层 GTM data-orchestration layer，位于原始第三方数据 providers 与收入团队 activation channels
              之间。从客户工作流看，平台覆盖五个连续阶段：(1) data sourcing——从 Clay proprietary dataset 和 150+ integrated providers
              拉取公司与联系人记录；(2) waterfall enrichment——按顺序查询多个 providers，只在成功匹配时收 credits，把联系人覆盖率从典型单 provider 的 ~30% 推到
              ~80% 或更高；(3) AI research——Claygent agents 浏览网页、分析公开信息并生成个性化内容，Claygent Builder 则提供 IDE-style 环境，用于编写、测试和部署
              production-ready agents；(4) orchestration——Signals 监控触发事件（job changes、funding announcements、website
              visits、SOC2 certifications），并触发自动化 Clay workflows；(5) activation——把 enrichment 和 scoring 后的 records 推到
              CRM（Salesforce、HubSpot）、outbound sequences（Clay Sequencer、Salesloft、Outreach）、paid-media
              platforms（LinkedIn、Meta、Google via Clay Ads）以及 AI interfaces（Claude、ChatGPT、Codex via Clay MCP/Functions）。

              Clay 的 product-line map 覆盖九个不同模块：core table/workflow engine、waterfall enrichment、Claygent AI
              agents、Claygent Builder、Signals、Sequencer、Ads、MCP/Functions 和 Clay University。Audiences 功能（企业版，2026 年中仍为
              beta）是跨所有模块访问的统一 GTM data repository。A-LIGN 在一个月内用 Clay 自动化工作流替换 $60K/年的人工研究，产出 450K insights，而此前只有
              30K；Coverflex 通过监控 3M+ companies 的 signals，每月新增 200+ demos；Oyster 通过 intent-based automation 为每名 sales rep
              每月节省 40 小时；Sendoso 将 $1M pipeline 归因于 Clay-driven outbound。
