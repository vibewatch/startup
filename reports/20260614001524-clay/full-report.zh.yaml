              付费客户。2026 年 1 月 tender offer 隐含 $5B 估值，对 $100M ARR 意味着 50× ARR multiple——这是历史上偏高的倍数，只有在 NRR 和 gross margin
              极其出色时才说得通，而两者均未披露。


              重大未披露指标包括 gross margin、NRR、logo churn、LTV/CAC、按 segment 的 customer concentration、cash balance 和
              outstanding debt。Consumption model 带来特殊不确定性：高用量下，头部客户可能获得显著 per-unit discounts，使实际利润率低于 list-price
