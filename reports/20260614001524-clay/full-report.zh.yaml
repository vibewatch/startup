      - number: '4.5'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Clay 的资本结构反映其完整融资历史中累计募集 primary capital 约 $203M。最近一轮 primary round 是 2025 年 8 月由
              CapitalG（Alphabet）领投的 $100M Series C，估值 $3.1B；此前还有 $46M Series B 和 $40M Series B expansion，CEO Amin 称二者截至
              2025 年 1 月基本未动用。公司还在 2025 年 2 月按 $1.25B Series B 估值募集 $1M community equity offering，让社区成员共同投资。两次员工 tender
              offers（2025 年 5 月 $1.5B、2026 年 1 月 $5B）提供了二级流动性，但没有改变 primary capital structure。


              按 CapitalG partner Jane Alexander 2026 年 3 月所说「每年几百万美元」的 annual burn，再加上仅 Series C 就募集超过 $100M，runway
              近期不是问题。如果 annual burn 为 $3–5M，$100M primary capital 意味着在没有任何收入增长的情况下，runway 超过 20 年——实际上说明 Clay
              不受资本约束。CapitalG 投资被描述为发生在 Clay「wasn't actively seeking investments」时，进一步确认融资由投资人需求拉动，而不是必要性驱动。没有公开披露 debt
              或 credit facility。


              没有债务、且 primary capital 大量未动用，意味着 Clay 的 near-term financial risk 来自战略（市场采用、竞争响应），而不是资产负债表。但 $5B implied
              valuation 与约 $100M ARR base 之间的差距，带来实质 dilution risk：如果下一次资本事件（IPO 或 primary
              round）之前增长放缓，估值倍数重置会伤害二级流动性和员工士气，未必威胁经营业务。
