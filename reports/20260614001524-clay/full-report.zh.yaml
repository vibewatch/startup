        title: 规模、指标与里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2022 年重新发布并跑通产品市场契合以来，Clay 的财务和运营指标爆发式增长。收入在 2022 年和 2023 年均增长 10×，2024 年增长 6×，全年收入约 $30M（CEO 言论，经
              Forbes 2025 年 1 月报道）。公司在 2025 年 12 月达到 $100M ARR。客户数从 2,500（2024 年 6 月）增至 5,000（2025 年 1 月），按官网声明，用户基数在
              2024 年中超过 100,000，并在 2026 年中达到约 500,000。员工数从 2022 年 2 月 Product Hunt 重新发布时不足 10 人，扩张到 2024 年 6 月 50+、2025
              年 5 月 150+。超过 100 家专业机构（「Claygencies」）通过为客户实施 Clay 创收；其中数家年收入超过 $1M。Slack 社区到 2025 年初超过 20,000 名成员，全球城市中已有
              90 多个 Clay Clubs。2026 年 1 月员工要约给出的 $5B 隐含估值约为 2024 年收入（约 $30M）的 50×；投资人用快速 ARR 增长、低烧钱和 GTM engineering
              品类定义者定位来解释这一定价。尚未公开披露的核心指标包括 2025 全年收入、毛利率、净收入留存，以及截至 2026 年 6 月的当前员工数。2026 年 1
              月员工要约结构——九个月内第二次——显示二级市场需求强劲，也凸显公司仍保持私有状态，且近期没有 IPO 时间表。
