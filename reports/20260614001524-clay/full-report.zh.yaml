  - id: FR001
    title: Clay 风险热力图——按可能性和投资影响划分的剩余严重性
    type: matrix
    layout: wide
    summary: 八项核心风险按可能性（横轴）和投资影响（纵轴）绘制，单元格颜色表示剩余严重性。严重风险位于右上象限；低风险位于左下象限。剩余位置体现缓释成熟度（若一项高可能性 / 高影响风险缓释充分，会向中心移动）。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重影响
          values:
            - 安全事件（无已知事件）
            - 隐私 / GDPR 执法［未缓释］；平台捆绑［部分缓释］
            - 供应商 API 限制［部分缓释］
        - label: 高影响
          values:
            - 创始人离职
            - 估值倍数压缩；AI 大规模幻觉；IPO 路径关闭
            - 数据拼接不一致［结构性］
        - label: 中等影响
          values:
            - 监管：CAN-SPAM 执法
            - 企业客户集中；Claygency 渠道退出
            - 送达率恶化［主动缓释］
        - label: 低影响
          values:
            - 近期偿付能力（burn 很低）
            - 模型价格上涨
            - null
    approximationNotes: 可能性和影响评级是分析师基于截至 2026 年 6 月的公开证据估算。缓释成熟度只反映公开可见的控制措施。若存在公开证据不可见的私下陈述、认证或法律聘用，剩余严重性可能改善。
    claimRefs:
      - CR001
      - CR003
      - CR009
      - CR013
      - CR021
      - CR025
      - CR043
      - CR044
  - id: FR002
    title: Clay 风险传导图——结构性风险如何传导至收入、利润率和估值
    type: dag
    layout: wide
    summary: >-
      有向无环图展示 Clay 的五项结构性风险如何传导到收入、利润率和估值结果。关键传导路径：隐私执法 → 企业客户流失 → ARR 下滑 → 估值压缩；供应商限制 → 覆盖率下降 → 竞争流失 → ARR 停滞；平台捆绑 →
      SMB 替代 → ARR 增长放缓 → 倍数压缩。
    data:
      nodes:
        - id: privacy-risk
          label: 隐私 / GDPR 风险
          detail: 隐私政策陈旧；GDPR 合法依据缺口；Trust Center 无法验证；CCPA broker 注册未知
        - id: provider-risk
          label: 供应商 API 依赖
          detail: 头部数据供应商限制访问、涨价或推出竞争产品；没有自有数据
        - id: bundling-risk
          label: 平台捆绑
          detail: HubSpot Breeze Intelligence、ZoomInfo platform、Apollo full-stack、Salesloft intelligence 都在向 Clay 的用例收敛
        - id: ai-quality-risk
          label: AI / 数据质量
          detail: Claygent 幻觉；瀑布流不一致；G2 数据就绪度约束
        - id: valuation-risk
          label: 估值倍数风险
          detail: 入场倍数为收入的 50×；9 个月内三次 tender offer；IPO 路径未确认
        - id: enterprise-churn
          label: 企业客户流失
          detail: 受监管行业的企业买家没有 DPA/SOC2 就无法完成采购
        - id: coverage-decline
          label: 覆盖优势收窄
          detail: 单一供应商的数据补全工具达到 60%+ 覆盖率；Clay 约 80% 的瀑布流优势缩小
        - id: smb-substitution
          label: SMB / 增长层替代
          detail: HubSpot 用户免费采用 Breeze Intelligence；Clay 的 SMB 增长放缓
        - id: sender-rep
          label: 发件人声誉事件
          detail: 大规模外联活动触发 ISP 封锁；用户群体的送达率恶化
        - id: arr-decline
          label: ARR 增长放缓
          detail: 企业客户流失、SMB 替代和覆盖优势侵蚀共同作用
        - id: margin-compression
          label: 利润率压缩
          detail: 数据供应商成本上涨 + AI inference 成本转嫁 + 员工规模扩大
        - id: valuation-compression
          label: 估值压缩
          detail: ARR 放缓 + 利润率压缩 → 倍数从 50× 向 ZoomInfo 可比公司（3-4×）重估
      edges:
        - from: privacy-risk
          to: enterprise-churn
          label: 采购阻塞点
        - from: provider-risk
          to: coverage-decline
          label: 瀑布流深度下降
        - from: bundling-risk
          to: smb-substitution
          label: 免费替代品出现
        - from: bundling-risk
          to: coverage-decline
          label: 竞品覆盖率追平
        - from: ai-quality-risk
          to: sender-rep
          label: 外联内容不准确
        - from: ai-quality-risk
          to: enterprise-churn
          label: 数据质量投诉
        - from: enterprise-churn
          to: arr-decline
          label: NRR 恶化
        - from: smb-substitution
          to: arr-decline
          label: 新客户获取放缓
        - from: coverage-decline
          to: arr-decline
          label: 竞争替代
        - from: sender-rep
          to: arr-decline
          label: ISP 封锁导致客户流失
        - from: provider-risk
          to: margin-compression
          label: 数据成本上升
        - from: arr-decline
          to: valuation-compression
          label: 增长率放缓
        - from: margin-compression
          to: valuation-compression
          label: 经济性恶化
        - from: valuation-risk
          to: valuation-compression
          label: 内含溢价消退
    claimRefs:
      - CR001
      - CR009
      - CR013
      - CR015
      - CR021
      - CR025
      - CR031
      - CR043
      - CR044
      - CR045
  - id: FR003
    title: Clay 依赖图——关键外部依赖与风险向量
    type: dag
    layout: standard
    summary: Clay 在数据供应、AI 推理、CRM 激活、广告平台激活和支付处理上的关键外部依赖，以及每项依赖对应的风险向量和缓释状态。
    data:
      nodes:
        - id: clay-core
          label: Clay 平台
          detail: 云端 SaaS 编排；IaaS 供应商未披露；声称拥有 SOC2
        - id: data-providers
          label: 150+ 个数据供应商 API
