chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Clay, Inc. 是一家总部位于 New York City 的 B2B 软件公司，成立于 2017 年；截至 2026 年中，公司处于 Series C 阶段。公司提供 GTM
              开发环境，让销售和营销团队把来自 150+ 第三方数据增强供应商的数据汇总起来，运行 AI 驱动的研究代理（Claygent），并自动化端到端外呼工作流——全部在类电子表格界面中完成。Clay 采用基于
              credit 的用量定价，把成本与数据使用量而非固定席位绑定，从而区别于 ZoomInfo 和 Apollo 等传统单点解决方案竞争对手。平台服务广泛的 B2B 买家：个人 GTM
              从业者、专业机构（「Claygencies」），以及 OpenAI、Anthropic、Canva、Ramp、Rippling 等企业。Clay 的商业模式把自助订阅档位与企业销售动作结合起来，客户购买
              credits 后，通过瀑布式数据增强查询供应商——按顺序抽样多个供应商，以最大化联系人数据覆盖率。「GTM engineer」这一产品概念——设计可扩展收入系统的技术型构建者——源自
              Clay，并已成为被认可的岗位类别，形成高黏性的社区护城河，同时强化留存和口碑增长。Clay 当前产品表面覆盖数据增强、AI 研究代理、意图信号、CRM 同步、邮件序列器集成；截至 2026 年，还包括 MCP
              server，使 Claude 和 ChatGPT 等 AI 助手可以直接调用 Clay 工作流。
