      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              Clay 的同业集合横跨上市数据 intelligence 公司和不同阶段的私有 GTM 平台。上市可比公司 ZoomInfo 和 HubSpot 的收入倍数显著更低，但它们的增长画像和商业模式结构都不同于
              Clay。ZoomInfo FY2024 收入 $1.214B、同比增长 -2%、NRR 87%，按 2024 年中披露时点约以 2.5–3× trailing revenue 交易。HubSpot FY2024
              收入 $2.63B，约以 9–10× trailing revenue 交易，反映出更强 NRR、更宽平台，以及 Clay 尚未在规模上拥有的 CRM 叙事。


              私有可比中，Apollo.io 是最直接类比——一个销售 intelligence 平台，GTM 补全能力大体相似，估计 ARR $100M+，2023 年 Series D 估值约 $1.6B，意味着该轮约
              16× ARR。Salesloft 与 Drift 合并，重点是销售互动而非补全，2021 年融资估值约 $2.3B；合并后收入估计显示，按当前 run-rate 倍数更低。Lusha 2022 年以 $1.5B
              估值融资，估计 ARR $50-100M，意味着 3–5× 倍数——受市场条件影响，已较 2022 年水平压缩。Outreach.io 这个 engagement 平台上一次融资在 2022 年估值约
              $4–5B，但此后承受市场压力。当前没有私有可比公司估值超过 20× ARR；Clay 在 $5B 下隐含 50× ARR，结构上高于可观察私有可比集合。


              对当前阶段的 Clay 来说，更合适的估值框架是概率加权收入倍数情景模型，而不是直接可比，因为在 GTM intelligence 品类中，没有任何先例显示一家 ARR 低于 $150M 的公司可以估值
              $5B。Clearbit 被 HubSpot 收购且价格未披露，提供了一个 M&A 数据点，说明补全品类有战略价值创造，但价格不公开。
