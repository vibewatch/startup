  - id: TE002
    title: Clay 工作流 / 用例表
    columns:
      - 用户任务
      - 使用 Clay 前的工作流
      - Clay 方案
      - 可衡量收益（客户报告）
      - 局限
    rows:
      - - 搭建合格潜客名单
        - 在 ZoomInfo、LinkedIn、Apollo 间手工研究——覆盖率低，还要签年度合同
        - 基于表格的人 / 公司搜索 + 来自 150+ 供应商的瀑布式数据补全
        - 数据补全率比此前单一供应商高 3×（Rippling 客户报告）
        - 供应商宕机可能卡住数据补全任务；没有内置重试 SLA
      - - 为 inbound leads 评分并分流
        - SDR 团队手工审核并分配注册用户；触达慢
        - Claygent ICP 评分 + 自动分流工作流；从 Salesforce 导入 SOQL
        - action 运行快 22×（2026 年 1 月版本）；自动生成会议纪要和跟进
        - 评分标准必须按客户定制；没有开箱即用的 ICP 模型
      - - 执行基于意图的 outbound
        - 从意图工具（G2、Clearbit）手工导出 / 导入到 Salesforce/HubSpot
        - 信号触发的 Clay 自动化：发现意图 → 数据补全 → 排入 sequence
        - 每名销售代表每月节省 40 小时（Oyster 案例研究）
        - 信号延迟可能降低对快速变化事件的外呼及时性
      - - 将补全后的数据同步到 CRM
        - 研究完成后手工更新 CRM；导出和导入 CSV
        - Salesforce/HubSpot 双向同步；SOQL 可作为来源直接导入记录
        - Salesforce 数据更新快 24×（A-LIGN 案例研究）
        - SOQL 查询需要运营知识；终端用户还不能完全自助
      - - 个性化广告受众
        - 手工上传 CSV 到 LinkedIn/Meta；没有动态排除名单
        - 与 CRM 同步的 Ads audiences，带动态排除名单；同时支持 LinkedIn 和 Meta
        - 省去数小时的手工上传流程（Clay changelog，2026 年 2 月）
        - 广告与 outbound 组合后的归因未在一个报告视图中统一
      - - 用 AI 研究赋能销售代表
        - 每次通话前在 Gong、Salesforce、LinkedIn 和数据供应商之间切换标签页
        - ChatGPT/Claude/Codex 中的 Clay MCP：Functions 在聊天里暴露数据补全 + 账户研究
        - 销售代表数秒内访问已充分补全且完成 ICP 评分的画像；新用户获 500 个免费 credits
        - 免费层封顶 500 credits；企业 Audiences（完整销售代表数据访问）仍在测试版
    notes: 收益来自 Clay 案例研究和 changelog 中的客户报告，未经独立审计。覆盖率和速度数字是具名客户的示例性声明，应通过客户访谈验证。
