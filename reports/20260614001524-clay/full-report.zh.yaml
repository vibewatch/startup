      - number: '3.3'
        title: 能力、定价与 GTM 分销对比
        blocks:
          - type: paragraph
            body: >-
              Clay 在四个关键采购维度上与每个具名竞争对手都有实质差异：数据增强模型、定价结构、工作流深度和 AI/agent 能力。

              数据增强模型：Clay 是唯一通过瀑布式数据增强、用 100+ 数据供应商运作纯聚合器 -
              编排器的平台。每个直接竞争对手——Apollo、ZoomInfo、Cognism、Lusha、Hunter——都运营自有单一来源数据库。按公司声明，Clay 的多来源方法实现的联系人填充率比任何单一供应商高
              2–3×（未独立验证）。Cognism 直接挑战这一模型，认为瀑布式数据增强会造成合规不可预测性（「合规强度只取决于链条中最薄弱的一环」）以及失败 API 调用带来的隐藏成本。

              定价对比：Clay 使用基于用量的 credit 档位。Apollo 使用每用户 / 每月加 credit 模型。ZoomInfo 不透明，只做年度合同（$15K–$45K+）。Cognism
              使用固定席位固定费用（5 席每年 $12,750–$17,000）。Lusha 和 Hunter 是纯按 credit 用量计费模型。Clay 的模型最接近 Apollo，但在数据增强 credits
              之外叠加工作流执行 credits，使成本与结果之间的关系更复杂。G2 2026 报告发现，60% 的 B2B 软件团队在销售中使用 AI，验证了基于 credit 的 AI action 定价已被接受。

              GTM 与分销：Apollo 通过自助服务和内容营销触达 SMB 买方。ZoomInfo 通过现场销售和年度合同触达企业。Cognism 聚焦欧洲中端市场团队。Clay 的 GTM
              结合社区驱动自助（20,000+ Slack 成员、100+ Claygency 伙伴）、入站内容营销，以及企业档每账户 Growth Strategist。Clay 的 Claygency 伙伴网络是最独特的
              GTM 资产——专业机构把 Clay 嵌入客户项目，形成既有厂商无法复制的分销深度。

              AI/agent 定位：ZoomInfo Copilot 生成 AI 谈资、自动化外呼工作流并追踪再互动。Apollo 拥有 AI 邮件写作和预测评分。Salesloft AI Agents
              自动化卖方任务，Rhythm 对信号做优先级排序。Clay 通过 Claygent 做差异化——对传统数据库覆盖不到的目标进行开放式网页研究（财报电话会、招聘信息、技术文档）。Clay 2026 年 MCP
              server 提供结构性优势：Claude 和 ChatGPT 等 LLM 工具可以直接调用 Clay API，把 Clay 变成 agentic AI 生态的数据增强基础设施。
