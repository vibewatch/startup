      - number: '7.2'
        title: 监管与法律风险：隐私、数据经纪与合规链路托管
        blocks:
          - type: paragraph
            body: >-
              Clay 处在三套隐私监管制度的交汇处，这些制度都适用于它的数据补全和外联用例：英国 Privacy and Electronic Communications Regulations（PECR）和 GDPR；经
              CPRA 修订的 California Consumer Privacy Act（CCPA/CPRA）；以及美国 CAN-SPAM Act。监管风险被进一步放大，因为 Clay 不只是收集数据——它组装了一个由
              150+ 供应商构成的瀑布流，每个供应商都有自己的数据采集条款和合规姿态，然后把组装后的结果交给客户，用于冷邮件、社交外联和程序化广告。GDPR 合法依据文件、DNC 名单筛查和删除权处理的托管链条因此横跨
              Clay、每个第三方供应商和每个终端客户，形成三个潜在不合规位置。

              Clay 的隐私政策最后更新于 2020 年 9 月 11 日。截至 2026 年 6 月，它没有提到 Clay 当前产品：Claygent（AI 网页抓取器）、Signals（职位变动和网页访问监测）、Clay
              Ads（把第一方数据推送到 LinkedIn/Meta/Google）、Clay MCP（在 ChatGPT 和 Claude 内呈现数据），或 Enterprise
              层级引入的数据仓库同步能力。一份在这些产品出现前就最后更新的隐私政策，无法为这些产品执行的数据处理构成合规的 GDPR 或 CCPA 告知。Cognism 在竞争定位中明确指出这个缺口：“Cognism
              提供有保证的合规……[Clay 瀑布流中的] 每个供应商采用不同的采集方法、刷新周期和标准，增加了不一致、重复和合规暴露的可能性，尤其是在欧洲。”

              Clay 的 Trust Center（trust.clay.com）返回的内容几乎为空——页面依赖 JavaScript 渲染，直接访问时只有极少文本，没有公开 SOC2 报告、没有 ISO 27001
              证书、没有 GDPR 合法依据文件，也没有子处理方清单。Clay 定价页声称具备 SOC2 Type II、GDPR 合规、CCPA 合规、ISO 27001 和 ISO 42001
              认证，但都没有链接到可公开核验的材料。相比之下，Apollo.io 按 CCPA 要求在加州公开注册为数据经纪商。Clay 是否同样注册尚不清楚。

              经 CPRA 修订的 CCPA（2023 年 1 月 1 日生效）要求作为数据经纪商运营的企业向 California Attorney General
              注册。该法规还赋予消费者更正不准确个人信息的权利——对一家明确建立在多源数据拼接之上的公司来说，这是重大的运营义务；Cognism 估计 Clay 的瀑布流模型可提供约 80%
              覆盖率，但并未披露各供应商质量。ICO 的 PECR 指南要求，向个人发送电子营销邮件（区别于有限责任公司里的企业地址）必须事先获得同意——如果 Clay 客户假设 GDPR B2B
              合法利益例外覆盖所有联系人类型，并用 Clay 补全的个人邮箱做冷外联，就可能违反该义务。Clay 没有公开记录其客户使用工作流如何满足 PECR 合规。

              ZoomInfo 2024 年 10-K 把数据隐私监管变化列为关键重大风险因素，并指出“围绕数据隐私的法律、法规和公众认知变化……可能影响我们高效收集、处理、更新和 /
              或提供当前提供的部分或全部信息的能力。”Clay 成熟度更低、公开监管暴露历史更短，却面对同一结构性风险，而且发生在更早的监管接触周期。

              没有发现针对 Clay 的公开诉讼、执法行动或监管调查。没有负面法律历史值得注意，也属正面信号；但这也反映了 Clay 的私营状态（诉讼程序在启动前不会公开归档）以及它达到显著规模的时间较短（2022
              年后增长阶段）。这个主题上的尽调要求不可妥协。
