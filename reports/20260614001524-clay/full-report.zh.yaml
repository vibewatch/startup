  - id: TM001
    title: 市场定义：边界、邻近市场与替代品
    columns:
      - 类别
      - 定义 / 范围
      - Clay 位置
      - 是否计入 TAM
      - 备注 / 尽调问题
    rows:
      - - 销售情报（核心）
        - 潜客发现、联系人补全、意图信号、账户评分
        - 主市场 —— 聚合 150+ 家供应商的编排层
        - 是
        - Mordor $4.99B（2026）；MarketsandMarkets 隐含 $3.8B（2026）
      - - GTM 工作流自动化
        - 无代码 / 低代码数据管道、CRM 同步、序列触达触发器、AI 代理
        - 相比纯数据供应商的差异化来源；支撑 Clay 溢价定价
        - 是（重叠）
        - 子赛道没有独立分析师规模估算；按第一性原理约 $1.2–1.5B SAM
      - - CRM 原生补全
        - HubSpot Breeze Intelligence、Salesforce Data Cloud、Dynamics AI（CRM 原生补全）
        - 捆绑进现有 CRM 合同的邻近替代品
        - 部分计入（重叠风险）
        - 据 Inc. 2026，平台整合是 Clay 最大替代威胁
      - - 纯意图平台
        - 6sense、Demandbase、Bombora —— 只检测购买信号，不做联系人发现
        - 邻近市场；Clay 摄取意图信号，但不原生生产信号
        - 否
        - Clay 2024 年收购 Avenue（意图信号）；产品有部分重叠
      - - 单点联系人数据库
        - ZoomInfo、Apollo.io、Cognism、Lusha、Hunter —— 单一供应商数据访问
        - 直接争夺数据访问预算；Clay 提供多供应商瀑布式匹配
        - 是
        - 价格压缩明显：Apollo $49–$119/用户/月 vs ZoomInfo $15k–$45k/年计划
      - - 销售互动 / 序列触达
        - Salesloft、Outreach、HubSpot Sequences —— 不带专有数据的邮件 / 电话编排
        - Clay Sequencer 正在切入该类别（2024 年）
        - 否（邻近）
        - Clay 原生序列触达工具可能扩大 TAM 口径；需尽调留存率
      - - 人工替代方案（替代品）
        - VA/BPO 调研、LinkedIn 导出、离岸 SDR 团队
        - Clay 自动化直接替代这些工作流
        - 否（替代品）
        - 替代时间线和相对于 Clay credits 的价格弹性尚未量化
    notes: 市场边界采用 Mordor Intelligence 2026 和 Forrester 2026 定义。TAM 中“是”的条目构成主要规模池；“部分计入（重叠风险）”表示面临捆绑侵蚀的收入，而不是新增空间。
