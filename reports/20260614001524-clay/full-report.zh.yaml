      - number: '1.2'
        title: 管理层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Clay 由 Kareem Amin（CEO）和 Nicolae Rusan 于 2017 年共同创立。两人此前都曾在 Microsoft 任职，并共同创立 Frame；Frame 于 2012
              年被营销自动化公司 Sailthru 收购。收购后，Amin 在 The Wall Street Journal（Dow Jones）担任约两年 VP of Product，随后再次创业。2021 年，Clay
              从宽泛的工作流自动化和无代码内部工具平台，转向专门的 GTM 数据编排平台；Rusan 离开，Varun Anand 以联合创始人身份加入。Anand 曾在 Hillary Clinton 2016
              年总统竞选团队担任新闻助理，此前没有工程背景，后来成为 Clay 产品驱动增长策略和社区生态的核心人物。治理方面：Alfred Lin（Sequoia Capital，Midas List 第 1 名）担任
              Clay 董事，并在原董事 Mike Vernal 离开 Sequoia 后管理 Sequoia 与公司的持续关系。CapitalG 合伙人 Jane Alexander（前 Carta CMO）在 Series
              C 后加入 Clay 的投资人圈层。创始人 Amin 和 Anand 均拒绝在 2025 年 5 月员工要约中出售股份。关键人风险较高，并集中在 Amin
              身上：他是公司的核心产品愿景提出者、公众面孔和社区建设者；公司未披露公开继任计划。重大管理层变化：联合创始人 Rusan 于 2021
              年离开，这是一次重要治理事件，与公司的产品转型同步发生并推动了转型；这次转型最终驱动了爆发式增长。
