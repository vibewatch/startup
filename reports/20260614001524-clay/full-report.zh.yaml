companyProfile:
  summary: >-
    Clay, Inc. 是一家总部位于 New York City 的 B2B SaaS 公司，2017 年由 Kareem Amin 和 Nicolae Rusan 创立（Rusan 离开后，Varun Anand 于 2021
    年加入并成为联合创始人）。公司提供 GTM 开发环境，把 150+ 第三方数据增强集成、AI 研究代理（Claygent）和端到端工作流自动化放进类电子表格界面。经历六年迭代后，Clay 于 2022
    年跑通产品市场契合，收入连续三年增长 10×、10×、6×，FY2024 达到约 $30M，2025 年 12 月 ARR 达到 $100M。2025 年 8 月，公司完成由 CapitalG（Alphabet）领投的 $100M
    Series C，估值 $3.1B；2026 年 1 月由 DST Global 牵头的员工要约把隐含估值推至 $5B。一级融资总额约 $203M，年烧钱为「几百万美元」。主要投资方包括
    Sequoia、Meritech、CapitalG、DST Global 和 HubSpot Ventures。治理权集中在 CEO Kareem Amin 周围；他拒绝在员工要约中出售股份，Sequoia 的 Alfred Lin
    担任董事。核心尽调限制在于财务不透明：毛利率、NRR、LTV/CAC 和股权结构经济性仍未披露，公开证据无法验证 $5B 隐含估值。
