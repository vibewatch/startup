        - label: 每月 AI agent 运行次数
          detail: 每月 140M+（Clay 官网，2026 年 6 月）；公开利用率指标中最高；方法未披露；意味着周活跃使用强度很高
        - label: 生态内 Claygency 机构
          detail: 截至 2025 年 1 月为 90+ 家机构；多家 ARR 运行收入达到 7 位数；形成集体间接收入乘数和社区护城河；2026 年未公开重申当前准确数量
        - label: 社区（Slack）成员
          detail: >-
            18,000+（Forbes，2025 年 1 月）/ 20,000+（由 Inc 2026 / 2025 年 1 月扩张帖推断）；30 座城市有 60+ 个 Clay Club 聚会小组；GTM
            工程领域领先的实践者社区
        - label: 拥有完整案例研究的企业具名客户
