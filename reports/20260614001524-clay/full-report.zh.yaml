          detail: 既是数据供应商，也是平台竞争者；已重新定位为收入运营系统
      edges:
        - from: clay-core
          to: data-providers
          label: API 调用（pay-per-hit / BYOK）
        - from: clay-core
          to: openai
          label: LLM 推理（Claygent）
        - from: clay-core
          to: anthropic
          label: LLM 推理（Claygent）
        - from: clay-core
          to: hubspot-sf
          label: 双向 CRM 同步
        - from: clay-core
          to: linkedin-meta-google
          label: 广告受众推送（API）
        - from: clay-core
          to: mcp-hosts
          label: MCP 服务器（Functions）
        - from: clay-core
          to: stripe
          label: 支付处理
        - from: data-providers
          to: zoominfo-platform
          label: ZoomInfo 既是关键供应商，也是竞争者
        - from: hubspot-competitor
          to: hubspot-sf
          label: HubSpot Breeze 争夺同一批 CRM 用户
