      - number: '6.2'
        title: 采用轨迹：用户数、客户增长与平台使用
        blocks:
          - type: paragraph
            body: >-
              Clay 在 2022–2026 年的采用轨迹，是同阶段 B2B SaaS 中最激进的一类：2022 年收入增长 10×、2023 年 10×、2024 年 6×；2025 年估计仍强劲增长，与 2026 年 1
              月 Series C raise 的二级报道所引用 $100M ARR 里程碑一致。基于这些收入倍数和公司自披露客户数，每个指标的采用都在加速。

              用户数里程碑（均为公司声称）：Clay 在 2024 年 6 月 Series B announcement 时达到 100,000 用户和 2,500+ business customers。到 2025 年
              1 月，Series B expansion materials 引用 5,000+ customers——六个月内增长 2×。到 2026 年 6 月，Clay homepage 声称 500,000+「GTM
              teams」为用户，不过这个更宽口径可能把 free-tier sign-ups、Claygency sub-accounts 和 paying business customers 混在同一个
              top-of-funnel metric 中。Active business customers 最好用 2025 年 1 月的 5,000+ figure 代理；按收入轨迹，到 2026 年中可能增长至
              8,000–12,000，但这是没有披露依据的估计。

              Platform utilization evidence 稀少但方向明确。Clay homepage 截至 2026 年 6 月称 Clay 的 AI agent（Claygent）每月执行 140
              million runs——这是前瞻性使用量声称，暗示庞大 installed base 中 weekly active use 很高。OpenAI 团队在忙碌日里，每名 seller 最多对 150 条
              individual leads 运行 enrichments，且 week-over-week adoption 稳定。Intercom 单月 sourced 4,000+ accounts，并
              enriched 21,000 contacts。A-LIGN 在一个月内通过 Clay 处理 2,000 accounts，交付 450,000 data insights。Coverflex 每月通过
              Clay 跑 3,000,000+ companies 做 signal monitoring。

              地理分布仍以美国为主。EU-headquartered customers（Coverflex、Oyster）和 EU expansion deployments（Verkada 的 28-country
              EMEA push）有记录，但在披露客户名单中仍占少数。2026 年初，Clay integration catalog 新增 Beauhurst（UK/Germany private company
              data）和 Ocean.io（European lookalike prospecting），显示公司有意投资欧洲市场。

              Community 和 ecosystem metrics 强化采用黏性：20,000+ Slack community members、覆盖 30 个城市的 60+ Clay Club meetup
              groups，以及拥有结构化课程的 Clay University。这些形成类 network-effect dynamics，practitioner skill development 会直接加深
              platform utilization。
