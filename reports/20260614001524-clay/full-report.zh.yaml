        - id: openai
          label: OpenAI (GPT)
          detail: Claygent AI 推理和文案生成；ChatGPT/Codex 中的 MCP Functions；成本可变，并按成本转嫁
        - id: anthropic
          label: Anthropic (Claude)
          detail: Claygent 模型选项；Claude 中的 MCP Functions；成本可变，并按成本转嫁
        - id: hubspot-sf
          label: HubSpot / Salesforce
          detail: 双向 CRM 同步；SOQL-as-source；补全后记录的激活层
        - id: linkedin-meta-google
          label: LinkedIn / Meta / Google
          detail: 广告模块受众推送；程序化受众同步；受广告平台开发者政策约束
        - id: mcp-hosts
          label: MCP 宿主平台
          detail: ChatGPT、Codex、Claude 作为面向销售代表的 Clay Functions 界面；依赖 MCP 规范稳定
        - id: stripe
          label: Stripe
          detail: 支付处理；按隐私政策，Clay 不存储银行卡数据
        - id: hubspot-competitor
