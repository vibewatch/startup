      - number: '8.2'
        title: 融资历史、当前估值背景与投资人结构
        blocks:
          - type: paragraph
            body: >-
              Clay 的融资历史走出一条快速且少见的弧线。公司先完成由 First Round Capital 领投的 $2.5M 种子轮，随后在 2019 年完成由 Sequoia 领投的 $13.5M Series
              A，但团队在寻找产品市场契合期间五年未公开宣布。到 2024 年 6 月，Clay 宣布由 Meritech Capital 领投的 $46M Series B，估值
              $500M——这是它第一次公开披露融资——同时披露 2022 年和 2023 年收入均同比增长 10×。Series B 资金到 2025 年 1 月仍未动用，随后 Meritech 抢先领投 $40M
              Series B 扩展轮，估值 $1.25B，背景是 2024 年收入增长 6 倍。到 Series B 扩展轮为止，primary 资本合计约 $102M。


              随后估值升值速度显著加快。2025 年 5 月第一次员工 tender offer 中，Sequoia 牵头购买最多 $20M 员工股票，设定隐含估值 $1.5B。随后 CapitalG（Alphabet 旗下
              venture firm）在 2025 年 8 月领投 $100M Series C primary 轮，估值 $3.1B——这是首次有投资人在公平距离 primary 交易中确认超过 $1B 的价值。2026
              年 1 月，由 DST Global 领投的第二次员工 tender offer（Conviction、Avra 参与，天使包括前 Stripe COO Claire Hughes Johnson）把隐含估值定在
              $5B。所有轮次 primary 资本合计约 $202M，而年烧钱只有几百万美元——意味着大部分已融资本仍在资产负债表上。


              在这些估值水平下，入场纪律至关重要。六次融资事件中的优先股结构和清算优先权没有公开披露；$3.1B 入场的 Series C 投资人相对 $5B 隐含普通股估值拥有 1× 清算权，意味着若退出价格略低于
              $3.1B，Series C 持有人可能先于普通股收回资本。Seed、Series A、Series B、B 扩展轮和 Series C 累积稀释对创始人 / 员工而言可能在 40–55%
              区间，但实际股权结构是私有信息。HubSpot 通过 venture arm 进行战略投资会制造冲突：HubSpot 同时是投资人、客户（通过 OpenAI 和其他共同客户）、潜在收购方，并且通过 Breeze
              Intelligence 成为竞争对手。
