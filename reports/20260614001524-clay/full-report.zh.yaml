      - number: '4.3'
        title: 成本结构与毛利驱动因素
        blocks:
          - type: paragraph
            body: >-
              Clay 的成本结构有三个主要组成。第一，data-provider fees：Clay 向 150+ enrichment providers 支付 wholesale rates，并对每次 lookup
              向客户收取 Data Credits。由于 Clay 谈下了 volume discounts，它在 Data Credits
              上保留利润，但这部分利润在结构上比纯软件利润更薄，因为底层数据商品存在可变成本底线。客户自带 API keys 会完全移除这条收入线，只支付 Actions——经济性因此转向纯平台模型。第二，AI
              inference costs：Clay 以成本原价转嫁 frontier model tokens。对使用可变价格模型的客户子集而言，AI compute 实际成为零利润收入线，但它会拉高整体
              engagement 和 credit consumption。第三，平台工程与基础设施：Actions 收入意在覆盖编排 enrichment workflows、调用 providers、运行
              waterfalls、把结果返回客户的计算成本。Clay 报告称，在 2025 年 1 月之前一年处理了「数亿」次 AI agent tasks，显示基础设施已有可观规模。


              作为可比上市公司利润率参考，ZoomInfo FY2024 adjusted operating margin 为 35%，收入 $1.214B，GAAP revenue 同比下降（−2% YoY），net
              revenue retention 为 87%。ZoomInfo 的 data-license 相对 platform-services 占比更高，在可比阶段支持比 Clay 这种
              pass-through-heavy model 更高的结构性利润率。HubSpot 2024 年收入 $2.63B，为 Clay 需要达到多大规模才能支撑 $5B implied valuation
              提供了参照；即便 HubSpot 达到该规模，GAAP net income 仍为负。Clay 未公开 gross margin。合理类比——按 data passthrough costs 和 AI
              inference expenses 调整后——显示 Clay 的结构性 gross margin 可能落在 50–70% 区间，但这只是估计，不是经佐证的数字；对任何估值模型而言，这是阻塞性尽调缺口。
