  - id: TU005
    title: 扩张与集中度风险——驱动因素、风险与尽调路径
    columns:
      - 维度
      - 扩张驱动 / 集中度风险
      - 严重性 / 影响
      - 缓释因素
      - 尽调路径
    rows:
      - - 落地后扩张机制
        - 信用点消耗随工作流量放大；Sequencer、Ads、Audiences、MCP 等新增模块各自贡献增量 ARR；OpenAI、Figma、Intercom 已记录多团队扩张
        - 正向：结构性 NRR 顺风
        - 多模块使用后，平台广度会抬高切换成本
        - 索取企业客户在第 6、12、18 个月的平均模块数
      - - Claygency 渠道集中度
        - 90+ 家代理机构掌握客户关系；大型 Claygency 流失可能带来多客户相关流失；未见排他或竞业限制
        - 中高：通过代理机构贡献的收入占比未知
        - Clay 社区股权认购、联合营销和 Clay Cup 竞赛增强代理机构绑定
        - 索取代理机构收入占总收入比例；识别前三大 Claygency 的收入贡献
      - - 企业客户集中度
        - HHI 未知；企业合同金额达高六位数；若 2024 年 ARR 为 $30M，单个 $500K 账户约占 1.7%；ARR 到 $100M 时降至约 0.5%
        - 当前规模下偏低；若 ARR 停滞则上升
        - 客户数增长会自然稀释集中度
        - 索取 2024 年和 2025 年前十大客户占 ARR 比例
      - - 反向：信用点模型成本不可预测
        - Cognism 指出，历史上失败 API 调用也会产生成本；信用点复杂度让买方犹豫；不透明的瀑布流成本建模限制 CFO 的预算可预测性
        - 采购摩擦，尤其集中在由企业财务牵头的买方
        - Clay 称失败 enrichment 不收取信用点；2026 年新增透明的信用点定价页面
        - 核验 Clay 对失败调用的计费政策；从企业账户收集 CFO 层面的采购反馈
      - - 反向：GDPR / 欧盟合规不透明
        - Cognism 将 Clay 的第三方 enrichment 瀑布流定位为会在欧盟引入合规不确定性；各供应商 GDPR 立场不同；Clay 的第三方供应商合规未获独立认证
        - 重大：欧盟扩张取决于合规清晰度；部分欧盟企业可能要求逐供应商签署数据处理协议
        - 定价页面声称 SOC2 Type II；ISO 27001；企业页面有 GDPR/CCPA 合规表述
        - 索取 DPA、子处理方清单，以及瀑布式 enrichment 供应商的 GDPR 合法依据文件
    notes: >-
      企业客户集中度数字是基于公开收入估计（2024 年底约 $30M ARR）的示意性计算；实际 ARR 和客户集中度为私有信息。Claygency 收入贡献未公开披露。反向评估来自 Cognism
      的竞争对比页面（立场：反向），反映竞争对手视角；Clay 不认可失败 enrichment 存在隐藏成本的描述。
