      - number: '7.3'
        title: 运营风险：AI 幻觉、数据质量、送达率与安全
        blocks:
          - type: paragraph
            body: >-
              Clay 的运营风险包括四部分：AI 幻觉和输出质量、数据拼接一致性、送达率和垃圾邮件观感，以及安全 / 基础设施。

              AI 幻觉风险来自 Claygent 使用前沿 AI 模型（GPT、Claude）来综合 Clay 自有数据集不包含的网页研究。当 Claygent 被要求寻找“一家公司过去披露过的所有客户”或“LinkedIn
              上所有曾担任特定职位的人”时，AI 模型给出的是尽力综合，而不是数据库查询。不准确的综合——幻觉出的公司名、错误联系方式、编造收入数字——会在 Clay
              用例中造成直接下游后果：发给错误对象、或包含事实错误个性化内容的外联，会损害发件人声誉，引发垃圾邮件投诉，并可能让 Clay 客户承担 GDPR 数据准确性义务。G2 2026 AI Sales
              Intelligence 报告指出，“数据就绪度”是整个 prospecting 品类中“限制 AI 系统准确性、信任和可扩展性的最大单一约束”。Clay 的独特风险在于，它的 AI
              层由用户配置，因此质量保证责任很大程度落在客户身上。

              数据拼接一致性风险来自瀑布流模型本身。多个供应商按顺序查询时，可能为同一个人返回冲突记录——不同邮箱、不同职位、不同电话号码。Clay
              系统交付第一个成功匹配；如果供应商排序没有校准，这个匹配可能最不准确。Cognism 在竞争分析中指出，Clay 的瀑布流“看起来有吸引力，[但]
              引入了结构性风险：每个供应商采用不同的采集方法、刷新周期和标准，增加了不一致、重复和合规暴露的可能性。”一个 Clay 客户用七家供应商瀑布流搭建 10,000 行 outbound 名单时，可能有 15-20%
              联系人的某个数据点来自采集方法会造成 GDPR 不合规数据的供应商，而且无法在行级审计来源。

              送达率和垃圾邮件观感风险是 Clay 品类内生的：平台让 GTM 团队能够大规模发送高度个性化邮件，Clay 自己的 Sequencer 功能还包括“内置 warming、alias
              管理和域名轮换”。这些送达率工具是必要的，因为大规模个性化 outbound 活动有触发 ESP 垃圾邮件过滤和 ISP 域名封锁的风险。Inc. 2026 文章提到，Clay Club
              参与者主动询问“如何避开垃圾邮件过滤器”——这是用户社区话题，不是合规功能。Clay 没有公开记录的滥用防控政策，也没有外联量限速控制。如果 Clay 估计约 8,000+
              企业客户中相当一部分通过共享或轮换域名发送高频活动，声誉外部性会由用户群共同承担，一个客户遇到的发件人声誉问题可能会拉低其他客户的送达率。

              安全和认证缺口已在上文监管章节覆盖；从运营角度看，没有公开子处理方清单，意味着企业买家无法审计通过 Clay 集成层流转的客户数据供应链。Clay 的 Enterprise 层级提供 SSO 和
              RBAC，可以处理客户层访问控制风险，但多租户数据隔离和子处理方安全标准仍未披露。
