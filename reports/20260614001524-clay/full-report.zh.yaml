  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与替代品
        blocks:
          - type: paragraph
            body: >-
              Clay 位于三个成熟软件市场的交叉点：（1）B2B 销售情报与数据增强，（2）工作流自动化 / GTM 编排，（3）AI 代理平台。本分析采用的主要市场边界是「B2B sales
              intelligence」。Mordor Intelligence 将其定义为帮助收入团队发现潜在客户、增强联系人数据、收集意图信号，并进行账户评分分析的软件和服务。该范围包括采集、验证并交付 B2B
              联系人和公司画像数据的平台，也包括跨多个供应商编排数据增强的平台（Clay 的独特主张）。它明确排除：（a）仅作为记录系统使用的通用 CRM
              系统（Salesforce、HubSpot）；（b）纯营销自动化产品（Marketo、Pardot）；（c）销售互动 /
              序列平台（Salesloft、Outreach），除非它们包含自有数据层；以及（d）客户成功或售后情报工具。

              争夺同一预算的邻近领域包括：（i）CRM 原生 AI 数据增强（HubSpot Breeze Intelligence、Salesforce Einstein），付款方把情报功能与 CRM
              许可打包，而不是单独采购产品；（ii）只做意图的平台（6sense、Demandbase、Bombora），专注购买信号识别，不做联系人发现；（iii）单点联系人数据库（ZoomInfo、Apollo.io、Cognism、Lusha、Hunter），提供数据访问，但不做多供应商编排或工作流自动化。替代品包括人工
              VA/BPO 研究、离岸 SDR 外包，以及 LinkedIn Sales Navigator 加人工导出——Clay 的自动化会直接替代这些工作。间接竞争者是通过 Clay 自有 MCP server
              接口调用的通用 AI coding assistants（Cursor、Claude）；如果 AI 助手获得对数据供应商的直接 API 访问，它们可能成为轻量数据增强查询的替代品。

              市场边界很关键，因为它决定哪些竞争对手定价基准有参考意义（数据供应商定价、互动平台定价，还是 CRM 附加组件定价）；也因为 Clay 2026 年 1 月 $5B 估值意味着投资人押注的是更大的编排平台
              TAM，而不只是联系人数据细分市场。
