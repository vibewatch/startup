  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 反论点 / 什么会改变观点
    rows:
      - - 增长速度
        - Clay 在 2022 年和 2023 年收入各增长 10×，2024 年又增长 6×；估计到 2025 年 12 月 ARR 达到 $100M，意味着仍处于超高速增长
        - 代理渠道一旦饱和、企业销售周期拉长，增长可能放缓；目前没有 NRR 数据，无法区分扩张收入和新客户增长
      - - 资本效率
        - 从 $500M 增至 $5B 隐含估值期间几乎零烧钱；Series B 资金截至 2025 年 1 月仍未动用
        - 消耗型模式有变量成本底线（数据转嫁、AI 推理），限制毛利率上行；披露的 GM 明显低于纯软件 SaaS
      - - 社区护城河
        - 20,000+ Slack 成员、90+ Clay Clubs、100+ Claygencies 带来自然分发和迁移成本
        - 社区由从业者驱动；如果 Claygencies 转向 Apollo、ZoomInfo 或 AI-native enrichment 工具，护城河会快速削弱
