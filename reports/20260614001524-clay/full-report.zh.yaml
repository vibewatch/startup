      - number: '2.3'
        title: 买方、用户与付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              Clay 的市场在采购和采用流程中有三类不同角色：预算所有者（buyer）、一线操作员（user）和合同审批方（payer）。三者并不总是重合；它们之间是否错位，是决定采用速度和流失风险的关键因素。

              预算所有者通常是高级收入或营销负责人——VP Sales、VP Marketing、CRO 或 Head of Growth——掌控 GTM 技术预算。在较小公司（100 人以下），CEO
              或创始人也可能承担这个角色。在 Intercom、Canva、Ramp 等企业级公司（均为公开具名的 Clay 客户），预算所有权已迁移到专门的 GTM Engineering 或 GTM Operations
              职能，有时向 CRO 汇报，有时向 CFO 或 CTO 汇报，反映出 Clay 工作流的工程属性。

              用户（一线操作员）可分为五个清晰群体：（1）构建自动化潜客开发和数据增强工作流的 GTM 工程师；（2）维护 CRM 数据质量并构建路由逻辑的 RevOps
              团队；（3）运行程序化外呼活动的增长营销人员；（4）使用增强记录并触发序列的销售开发代表；（5）监控扩张信号的客户成功经理。Clay 服务这五类人，但其产品驱动社区增长最初锚定 GTM 工程师和 RevOps
              从业者——这些技术熟练的构建者是基于 credit 的瀑布式数据增强系统的深度用户。

              付款方（合同审批方）是中端市场和企业客户中的采购或财务职能。Clay 基于 credit 的定价模型——Data Credits 按每次数据增强查询消耗——并不常见，因为它把成本直接映射到数据消耗，使采购讨论围绕
              ROI（每条增强记录成本 vs. 替代供应商合同），而不是席位许可。企业付款方签署年度承诺；Launch 和 Growth 套餐的自助用户通过信用卡月付，完全绕过采购。

              采用路径按具体工作流拆解如下：（1）Free 档——从业者通过社区、Claygency 推荐，或 Claude/ChatGPT 中的 MCP 集成发现 Clay；每月 100 Data Credits 和 500
              Actions 足以在最多 200 行数据上构建测试数据增强工作流。（2）Launch 档（$185/mo）——从业者扩展第一个潜客开发工作流，加入电话号码增强、职位变动信号和邮件活动集成。（3）Growth
              档（$495/mo）——团队集成 CRM 自动同步、webhook 自动化、网站意图追踪和 Ads 受众推送，从单点工具演进为数据基础设施层。（4）Enterprise 档（定制年度合同）——公司将 Clay
              部署为完整 GTM 数据平台，包含 SSO、RBAC、数据仓库同步和专属 Growth Strategist；触发该档的通常是内部扩展性上限或合规要求。中位升级触发因素是在上一档看到 ROI
              证据（例如，相比单一供应商替代方案，数据增强覆盖率提升 2–3×）。
