          - type: paragraph
            body: >-
              Clay 只以 multi-tenant cloud SaaS product 交付；企业页面未宣传 on-premises 或 single-tenant option。集成分三类：(a) CRM 和 data
              warehouse destinations——Salesforce（包括 2026 年 1 月新增的 SOQL-as-a-source）、HubSpot、Snowflake、Dynamics 365 和
              Google BigQuery（coming soon）；(b) sales-engagement platforms——Salesloft、Outreach、Smartlead、HubSpot
              Sequencer 和 Gong；以及 (c) data-enrichment providers——150+ APIs，覆盖 contact
              data（Lusha、Apollo、FullEnrich）、firmographics、technographics（HG Insights、BuyerCaddy）、company
              intelligence（Beauhurst for UK/Germany、Ocean.io lookalike database of 2.5M+ companies）和 intent data。所有
              provider calls 都通过 Clay 的 enrichment engine 路由，而不是让客户直接与 API 签约，从而简化采购。

              支持体系由 Clay University（结构化课程、instructor-led cohorts）、Community platform（500K+ 用户分享 templates 和 workflows）以及
              enterprise customer success 提供。没有公开 self-serve SLA 或 uptime commitment。产品速度很高：changelog 在 2026 年 1 月至 6
              月记录了十一个不同 feature releases，包括 Functions（2026 年 4 月）、Claygent Builder（2026 年 5 月）、OpenAI Codex 中的 Clay
              MCP（2026 年 6 月）、Attio CRM integration（2026 年 3 月）、Table Versioning and Changelog（2026 年 3
              月）、SOQL-as-a-source（2026 年 1 月）以及 22x performance improvement（2026 年 1 月）。Audiences（企业 beta）是前瞻路线图锚点，将
              Clay 从 workflow tool 转为持久 GTM data platform。
