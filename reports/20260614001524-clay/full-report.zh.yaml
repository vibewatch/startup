      - number: '6.5'
        title: 扩张与集中度：先落地再扩张、Claygency 渠道风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Clay 的扩张动作，在结构上围绕平台宽度和按积分消耗模型设计。典型部署路径从单一用例开始——inbound 补全或 outbound 名单构建——随后 GTM engineer
              发现相邻模块，使用范围开始扩张。案例证据至少记录了四条扩张路径：增加更多数据源并升到更高积分层级（横向补全扩张）；采用更多模块（Signals、Sequencer、Ads、Audiences）；把 Clay
              权限扩到新的内部团队（销售、数据科学、招聘、营销）；以及随着 ICP 按地域或细分市场扩展，提高补全量。

              集中度风险有几个维度。头部客户收入集中度没有披露；客户 HHI 指数、前 10 大客户收入占比，或“最大客户占 ARR 百分比”等数字都没有公开。Clay 有 5,000+
              客户，企业账户合同规模据称可达高六位数，仅企业客户就可能形成有意义的数学集中度——一个 $500K ARR 的企业客户，在 $30M ARR 基数中约占
              1.7%。在不知道企业、中端市场和自助收入分布的情况下，真实集中度轮廓仍未知。

              Claygency 准渠道（90+ 家机构）形成独特的双边风险。正面看，Claygency 像一支不拿佣金的销售队伍，以零边际成本为 Clay 获客并完成上手。风险在于，Claygency
              掌握客户关系和工作流架构——如果一家管理大量客户的大型 Claygency 采用竞争平台，Clay 可能会同时失去不成比例的一批终端客户收入。Clay 已经用社区基础设施、向社区成员提供直接股权机会（2025 年
              2 月）和联合营销支持来加深机构绑定。

              企业采购摩擦是真实存在的。Enterprise 层级把 SSO、RBAC、数据仓库同步、无限行批量补全和 Audiences
              放在定制年度合同后面，故意制造一个摩擦点：既筛选出严肃买家，也借自然升级路径创造收入集中度上行空间。Cognism 的反向竞争评论指出，Clay 的积分模式会让买家难以预测成本：过去失败 API
              调用也会产生成本（尽管 Clay 表示失败补全不收积分或 Actions 费用），而瀑布流补全的复杂度要求运营专业能力，点状工具则避开了这层复杂性。Cognism 还强调，欧盟市场的合规不透明会阻碍采购；Clay
              的第三方供应商组合让 GDPR 暴露不确定。

              具名案例里的先落地再扩张数据很有说服力：OpenAI 扩到四个职能，Figma 扩到四个模块，A-LIGN 的总扩张收入超过新 logo 收入，都表明既有客户增长快于新客户流失。但没有披露 NRR
              数据，这一叙事仍停留在案例层面。
