      - number: '6.6'
        title: 附录
        blocks:
          - type: callout
            title: 企业级具名客户证据异常深
            body: >-
              Clay
              发布了十多个来自企业客户、且明确指向结果的具名案例，客户包括品类领先公司（OpenAI、Anthropic、Figma、Intercom、Vanta、Rippling）。结果涵盖可量化的补全覆盖率提升、可记录的
              pipeline 生成、收入归因和多团队部署路径——这种客户证据质量高于一般 Series C B2B SaaS 公司。A-LIGN 案例尤其强，记录了 $3.3M 已关闭收入和 40% pipeline
              增长，具体且更新近。
            calloutType: strength
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU017
          - type: callout
            title: 重大留存不透明：没有可用 NRR、GRR、队列或流失数据
            body: >-
              Clay 没有公开披露净收入留存率、总收入留存率、流失率、队列曲线或合同续约率。这是客户章节最重要的尽调缺口。2024 年收入增长 6 倍、投资人估值连续抬升（$500M →
              $5B），为强留存提供了间接证据，但无法替代直接队列数据。没有 NRR 披露，就无法判断 Clay 的收入增长主要来自新客户获取（增长放缓时会反转），还是来自既有客户净美元扩张（更耐久）。这必须从 Clay
              数据室取得。
            calloutType: risk
            claimRefs:
              - CU023
              - CU024
          - type: callout
            title: Claygency 渠道集中度：双边锁定叠加相关流失风险
            body: >-
              90+ 家 Claygency 机构为客户在 Clay 上搭建工作流，既像一支不拿佣金的销售队伍，也是留存锚点；但它们也把客户关系所有权集中到 Clay 之外。一家管理数十个客户账户的大型
              Claygency，理论上可以把这些工作流迁移到竞争平台，并同时带走对应收入——这是一种相关流失情景，结构上不同于单个企业合同流失。Clay
              的社区股权计划和联合营销项目部分对齐了机构激励，但公开资料没有记录排他或有约束力的协议。Claygency 收入占总 ARR 的比例没有披露。
            calloutType: risk
            claimRefs:
              - CU004
              - CU033
              - CU034
          - type: callout
            title: 按积分消耗模型为 NRR 创造结构性顺风
            body: >-
              Clay 的积分定价让成本随补全量、AI agent 运行和工作流 Actions 扩大，而不是随固定席位扩大；这为 NRR 超过 100% 提供了结构性机制，不需要主动 upsell。客户的 GTM
              团队扩大、增加新数据源、部署 Signals、激活 Ads 受众，或搭建更多 Claygent agent 后，月度积分消耗自然上升，不用单独续签合同也会提高该客户 ARR。企业客户还可结转上一年度最多 15%
              的未使用积分，进一步降低流失摩擦，因为积分本身就是续约激励。这在架构上类似 Snowflake 或 AWS 的消耗增长模型，相比按席位 GTM 工具，是一个有意义的“留存内置”差异点。
