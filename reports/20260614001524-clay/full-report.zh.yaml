  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局——层级、既有厂商、邻近玩家与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Clay 的竞争格局可分为五个层级，每一层的战略接近度和威胁时间线不同。

              第 1 层——直接同类（数据增强编排者）：市场上没有与 Clay 功能完全相同的复制品。最接近的竞争场景，是买方自建内部数据增强编排栈——直接与 ZoomInfo、Clearbit（现为 HubSpot
              Breeze）、Apollo 和 Lusha API 签约，再用 Python 或 dbt 拼接。这个「内部自建」替代方案，是 Clay 企业档最常见的据称流失原因。Clay 社区创造出的 GTM
              工程师群体可以在没有 Clay 的情况下复制瀑布逻辑；社区护城河和 Claygency 伙伴生态，是抵御这种替代的主要壁垒。

              第 2 层——自有数据联系人数据库（既有厂商）：ZoomInfo（约 $1.2B ARR，NASDAQ:GTM）、Apollo.io（约 $145M+ ARR，Series
              D）、Cognism（盈利，Series C，聚焦欧盟）、Lusha（280,000+ 用户）和 Hunter.io（7M+ 用户）各自维护单一来源的自有 B2B
              联系人数据库。它们均不原生支持多来源瀑布式数据增强。所有玩家都争夺同一数据增强预算。Apollo 由于价格更低且绑定序列器，是最激进的直接竞争威胁。

              第 3 层——收入编排和互动平台（邻近玩家）：Salesloft（4,000+ 企业客户，Forrester 2024 Leader）和 Outreach 争夺外呼工作流和互动预算。两家公司在 2025–2026
              年都增加了 AI agent 层和 signal-to-action 模块，与 Clay 的 Sequencer 和 Signals 产品越来越相邻。这些平台不提供联系人数据增强，但争夺 Clay
              Sequencer 现在瞄准的序列预算。

              第 4 层——CRM 平台打包（替代品，长期威胁）：HubSpot（237,000+ 客户，2024 年收入 $2.6B+）在 CRM 内部提供 Breeze Intelligence，作为原生 AI
              数据增强层。Salesforce 提供 Data Cloud 和 Einstein 数据增强。任何已经使用 HubSpot 或 Salesforce
              的买方，都能以现有合同中的边际成本获得数据增强——不需要单独采购数据增强供应商。这是最高的长期替代向量，因为它消除了让 Clay 进入考虑范围的采购事件。

              第 5 层——现状和内部自建：人工 SDR 研究、离岸 VA/BPO 名单构建，以及 LinkedIn Sales Navigator 导出，仍是轻量 Clay 用例的直接替代品。Clay 的 Claygent
              AI agent 可以把 30–40 分钟人工研究压缩到数秒，但前提是买方已经把自动化作为工作流规范。

              可能的新进入者：OpenAI、Anthropic 和 Google 正在构建 LLM 原生工具使用框架（MCP、plugins、Gemini function calling），可能让 AI
              助手无需专门的数据增强平台即可直接访问数据供应商 API。Clay 通过 2026 年推出 MCP server 预先应对这一威胁，把自己定位为 LLM 调用的数据增强编排层，而不是与 LLM
              原生工作流正面竞争。如果 LLM agents 以低成本获得直接数据增强访问，入门级商品化数据增强供应商（Clearout、Skrapp、Firmable）还可能进一步压缩 Clay 的免费转付费漏斗。
