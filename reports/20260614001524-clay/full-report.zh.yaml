            AI、Sana）；其他客户标识（Canva、Ramp、Rippling、HubSpot、Cursor、Notion、Amplitude、Rootly）仅有有限结果数据或没有结果数据
    approximationNotes: 所有数字均为公司声称或媒体估算。付费客户数指 2025 年 1 月；2026 年 6 月的「500K GTM teams」是另一项更宽口径指标，不能直接比较。企业客户数是基于公开案例枚举得出的下限估计。
