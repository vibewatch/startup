            title: 罕见的收入增长轨迹
            body: >-
              2022 年产品市场契合重新启动后，Clay 收入在 2022 年增长 10×、2023 年增长 10×、2024 年增长 6×，连续三年超高速增长。从 2022 年初接近 $0 到 2025 年 12 月达到
              $100M ARR，三年跑到这一规模，在 B2B SaaS 公司中很少见。这样的增长轨迹叠加低烧钱（「一年几百万美元」），指向罕见的资本效率。
