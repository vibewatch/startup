      - number: '6.3'
        title: 具名客户证据：生产部署与量化结果
        blocks:
          - type: paragraph
            body: >-
              Clay 的客户证据在具名、结果具体的案例研究上异常丰富，来源于公司 customer portal，并由独立媒体报道佐证。下述主要部署从 case study materials
              的措辞看，似乎都处于生产运行而非 pilot：客户提到「continuous enrichment flows」、「ongoing workflows」、「recurring
              sourcing」和「week-over-week」adoption patterns。

              OpenAI 是 Clay 的 marquee reference customer。公司部署 Clay，为 ChatGPT Enterprise 处理 inbound lead
              enrichment——最初团队人手不足以应对需求激增——并把 enrichment 覆盖率从 low 40% range 翻倍到 high 80% range。Clay 现在作为 native
              enrichment package（称为「Enrichment Actions」）嵌入 OpenAI 的 Salesforce，销售团队稳定每周使用，通过 Salesforce integration 总计运行
              8,500+ enrichments。部署随后扩展到 RevOps 之外的数据科学团队（估算 OpenAI 用户群中的 knowledge-worker counts）和 recruiting team。

              Anthropic 部署 Clay，将 enrichment 覆盖率从此前 single-source levels 提高到三倍，对所有 inbound self-serve sign-ups 应用 AI
              scoring，并标记 fraudulent email domains。截至 Series B expansion announcement（2025 年 1 月），Anthropic 正用 Clay 的 AI
              agents 生成 sales calls 的 meeting-prep notes。

              Figma 使用 Clay Audiences 导入整个 Salesforce CRM，对所有 records 做 identity resolution，搭建 always-on enrichment
              flows，并把 Snowflake product data 连接到 Clay segments，用于 signal-based sales outreach。Figma 还采用 Clay Ads，用动态更新的
              LinkedIn audiences 替代人工季度 ad-audience exports——这是首个有记录的 full-platform enterprise deployment，同时覆盖
              enrichment、signals、CRM sync 和 ads。

              Intercom 运行了一个月 pilot，证明 Fin（其 AI support agent）的 ROI，sourcing 4,000+ accounts 并 enriching 21,000
              contacts，报告称初始项目生成近 $1 million pipeline。部署随后扩展为 recurring basis，服务整个 GTM organization。

              A-LIGN 用 Clay automated workflows（450,000 data insights、1 个月、比此前合同少约 $10,000）替换 $60,000/年的 manual research
              contract（30,000 data points、6 个月）。A-LIGN 将 6.5 个月内 $3.3M closed revenue 直接归因于 Clay 生成的
              competitive-displacement data，并报告 total pipeline 从 2024 年 $132M 增至 2025 年 $185M（+40%），对现有客户的 gross
              expansion 超过 new logo sales——这是重要 retention proof。

              Sendoso 通过 Clay-driven outbound 生成 $1M+ pipeline，使 SDR team outbound productivity 提升 10x，并记录 email
              response rates 提高 20%。Vanta 搭建 multi-signal inbound enrichment 和 sales automation system，实现 80%+ contact
              coverage，每月新增数千个 enriched contacts，follow-up time 从 3–4 天压缩到当天。Coverflex 对 3,000,000+ company TAM 自动化
              outreach，每月新增 200+ demos，团队 output 相比此前工具提升 5x。Oyster 通过 intent-based outbound automation 为每名 sales
