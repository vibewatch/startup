      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Clay 自成立以来一级融资约 $203M，采用了异常多元的融资结构：传统风险投资轮、社区股权发行，以及两次员工二级要约。公司在融资上长期保持低调——尽管早年已完成 $2.5M 种子轮（First Round
              Capital）和 $13.5M Series A（Sequoia Capital，2019 年），直到 2024 年 6 月 Series B 才公开宣布融资。Series B（$46M，估值 $500M，由
              Meritech Capital 领投）之后仅六个月，公司又完成 Series B 扩展轮（$40M，估值 $1.25B）；据报道，当时原 Series B 资金尚未投入使用。社区股权轮（约 $1M，估值同为
              $1.25B，2025 年 2 月）允许直接用户和社区成员按机构投资者相同条款投资，募资约 $1M——金额不大，但象征意义很强。2025 年 5 月，Sequoia 以 $1.5B 估值购买最高 $20M
              员工股份（员工要约 1）。2025 年 8 月 Series C（$100M，估值 $3.1B，由 Alphabet 旗下风险投资机构 CapitalG
              领投）是最大的一轮一级融资，并在六个月内让估值翻了三倍。第二次员工要约（2026 年 1 月，由 DST Global 领投，估值 $5B）在约五个月内较 Series C 又上调 3.3×。HubSpot
              通过其风险投资部门投资 Clay。公司披露，截至 2026 年初，年烧钱为「一年几百万美元」，意味着相对收入规模极高的资本效率。未公开披露任何债务或信贷额度。
