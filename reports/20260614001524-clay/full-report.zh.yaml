      - number: '2.2'
        title: TAM、SAM 与 SOM——多重测算口径
        blocks:
          - type: paragraph
            body: >-
              本章采用三个独立测算口径；它们得出的估计不同，本文保留矛盾，而不做平滑处理。

              口径 1——分析师自上而下（Mordor Intelligence，2026）：全球销售情报市场 2026 年价值 $4.99B，预计到 2031 年达到 $9.15B，CAGR 为 12.89%。北美占
              2025 年收入的 40.4%（按当年基数约 $1.78B），其中数据增强和工作流自动化子组件是解决方案子板块中增长最快的部分。SMEs 以 16.93% CAGR 增长，快于大型企业（占当前收入
              61.6%）。按量付费定价——Clay 的主要模式——在该市场内以 18.51% CAGR 增长。

              口径 2——较早分析师估计（MarketsandMarkets，2019 年 11 月）：销售情报市场预计从 2019 年 $2.0B 增至 2024 年 $3.4B，CAGR 为 11.4%。若粗略外推至
              2026 年，隐含约 $3.8B——比 Mordor 基准估计低约 24%。差异具有实质意义：2022 年以来 AI 加速大概率解释了上调，但旧模型较低的天花板也说明预测对 AI
              采用速度假设很敏感。两个估计都予以保留，均不视为权威。

              口径 3——上市公司收入代理：市场最大的独立上市玩家 ZoomInfo（ticker: GTM）在经历价格压力前，2024 年报告收入约 $1.1B。Apollo.io 截至 2025 年达到约 $145M
              ARR，意味着前两大合计收入池约 $1.25B；更广义市场还包括 Cognism、Lusha、Hunter、6sense、Demandbase、Salesforce Data Cloud 和 HubSpot
              Breeze Intelligence。对已披露玩家 ARR（可得时）做粗略自下而上求和，2026 年具名玩家总收入约 $2–3B；考虑小型供应商长尾和服务收入后，与 $4–5B 市场规模一致。

              Clay 的 SAM 窄于完整销售情报市场，因为 Clay 不直接提供原始数据——它编排第三方供应商。SAM 估计为 $1.2–1.5B，代表数据增强编排、工作流自动化和 AI 研究代理子板块。Clay 以
              $100M ARR 计算，约占估算 SAM 的 6–8%。对于 Series C 公司而言，这已是有意义的份额；但随着 ZoomInfo 和 HubSpot 把数据增强打包进既有关系，需要持续监测。
