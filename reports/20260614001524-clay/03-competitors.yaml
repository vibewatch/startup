  - id: trust-regulatory-posture
    title: Trust, Compliance, and Regulatory Posture
    body: >-
      Compliance posture is a material differentiator in the B2B contact data market, especially
      for buyers with European operations subject to GDPR or buyers in regulated industries.

      Clay's compliance model is structurally indirect: the platform itself is GDPR and CCPA
      compliant and maintains DNC lists, but contact data is sourced from 100+ third-party
      providers, each with its own collection practices and compliance certifications. Clay's
      privacy documentation acknowledges "third-party vendors vary" in compliance standards.
      Enterprise procurement teams in EMEA or regulated industries may require individual
      compliance documentation from each underlying provider—a friction that Cognism's
      single-source model sidesteps. Cognism explicitly cites this as a "structural risk"
      in positioning against Clay.

      Cognism has the strongest published compliance posture in the category: ISO 27001/27701,
      SOC2 Type II, TPS/CTPS/DNC screening across 15+ countries, notified GDPR database, and
      a zero-breach record. It processes its own data under a single controller relationship,
      enabling clear data lineage for European buyers.

      Apollo has the weakest published compliance history: two breaches (2018 and 2021) exposed
      130M+ records. Apollo's privacy policy discloses it is registered as a data broker in
      California and other states, and that it requires third-party providers to certify lawful
      collection but cannot independently guarantee this.

      Lusha is ISO 27701/27001 and SOC2 Type II certified, GDPR and CCPA compliant, validated
      by TrustArc and ePrivacyseal—the strongest third-party attestation set among SMB-tier
      competitors.

      ZoomInfo's compliance documentation is enterprise-grade but has faced FTC scrutiny in
      prior years for data collection practices and does not publicly disclose its DNC screening
      scope as explicitly as Cognism.

      Hunter operates under GDPR and CCPA with coverage appropriate for its small-team market
      but lacks enterprise certifications.
