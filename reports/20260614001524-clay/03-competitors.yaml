  - id: switching-costs-lock-in
    title: Switching Costs, Lock-in, Multi-homing, and Distribution Power
    body: >-
      Clay's switching costs are moderate-to-high, concentrated in workflow complexity rather
      than data ownership—distinguishing it from legacy incumbent lock-in.

      Workflow depth is the primary switching barrier: a team that has embedded Clay as its GTM
      data infrastructure—routing Salesforce records through waterfall enrichment, triggering
      Claygent research on signals, pushing outputs to sequencers via webhook—faces an estimated
      4–8 week rebuild to replicate on an alternative stack. Enterprise buyers integrating Clay
      with Snowflake, Salesforce, and custom webhook pipelines face engineering-project-level
      switching costs analogous to dbt's transformation-layer lock-in.

      The credit system creates mild additional lock-in: customers who have tuned waterfall
      enrichment sequences for Clay's provider ordering face re-tuning cost when switching,
      but this is secondary to workflow integration cost.

      Multi-homing is prevalent at the entry and mid-market segments: GTM engineers routinely
      use Clay alongside Apollo (sequencing), ZoomInfo (intent), or Salesloft (engagement). Clay's
      open integration model explicitly supports multi-homing—listing Apollo, ZoomInfo, Salesloft,
      Outreach, HubSpot, and Salesforce as integration partners. This tolerance increases adoption
      surface but limits pricing power; buyers who multi-home can reallocate enrichment spend
      toward cheaper per-contact sources, marginalizing Clay's aggregation premium.

      Claygency lock-in is the highest-value retention mechanism: agencies that have built
      client-delivery workflows on Clay face a full IP-rebuild cost to switch, driving structurally
      lower Claygency churn than individual-user churn.

      Clay's 20,000+ Slack community and 100+ Claygency partner network create a distribution
      moat via peer referral and community learning that no direct competitor has replicated.
      The GTM engineer job category—coined by Clay—became a recognized profession by 2026,
      generating organic community growth that compounds independent of marketing spend.

      Supply and partner access: Clay's 100+ provider integrations reduce multi-vendor
      procurement overhead. However, ZoomInfo and Apollo—vertically integrated competitors—have
      economic incentives to restrict wholesale API access or raise per-call pricing as Clay's
      enterprise market share grows. No public evidence of such restriction exists as of mid-2026.
