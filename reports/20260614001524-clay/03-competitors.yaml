  - id: competitor-profiles
    title: Competitor Profiles — Scale, Funding, Product Scope, and Strategic Direction
    body: >-
      Six competitors require dedicated profiles due to strategic proximity and material
      influence on Clay's positioning.

      Apollo.io: Founded 2015, San Francisco. Apollo is the leading SMB-to-commercial B2B
      sales intelligence platform and the most direct pricing threat to Clay. Its credit-based
      model ($49–$119/user/month annual) overlaps Clay's Launch and Growth tiers for buyers
      wanting contact data plus a basic sequencer without multi-source orchestration. Apollo's
      database covers 275M+ contacts and 65M+ companies as a single proprietary source.
      Apollo has experienced two historical data breaches (2018 and 2021), exposing 130M+ records—
      a persistent compliance liability. Apollo is Series D and estimated at $145M+ ARR;
      it is the most aggressive challenger to Clay's entry-market funnel.

      ZoomInfo Technologies (NASDAQ:GTM): Founded 2007 as DiscoverOrg, IPO 2020, Vancouver WA.
      ZoomInfo is the largest proprietary B2B data platform with FY2024 GAAP revenue of $1.21B
      (−2% YoY), 87% NRR, and 1,867 customers with ≥$100K ACV as of Q4 2024. ZoomInfo launched
      Copilot in 2024 (AI account prioritization, talking-point generation, automated sequencing)
      and rebranded to "GTM Intelligence Platform" in 2025. Pricing is annual-only, opaque,
      and reported to range $15K–$45K+ per year. Its strategic direction toward full-suite
      platform consolidation makes it increasingly competitive with both Clay (enrichment) and
      Salesloft (engagement). Revenue contraction and 87% NRR signal it is defending share.

      Cognism: Founded 2016, London. Cognism is Europe's leading compliance-first B2B contact
      data provider. It operates a proprietary dataset screened against 15+ DNC registries,
      is ISO 27001/27701 and SOC2 Type II certified, GDPR-compliant under legitimate interest,
      and explicitly positions against Clay's waterfall enrichment model as a compliance risk.
      Standard plan: $12,750/year (5 seats); Pro: $17,000/year (adds phone-verify and intent data).
      Cognism does not offer multi-source orchestration, AI workflow automation, or a sequencer
      natively, limiting its appeal for GTM engineering use cases.

      Lusha: Founded 2016, Tel Aviv/New York. Lusha has scaled to 280,000+ users, 300M+ data
      points across NA/EMEA/APAC/LATAM, email deliverability of 95–98%, and direct dial accuracy
      of 90%+. It processes 7M new signals per week. Pricing is credit-based: 1 credit per email,
      10 credits per phone; free tier offers 40 credits/month. Lusha added "Deep Intel" in 2026
      for ICP-based account prioritization. ISO 27701/27001 and SOC2 Type II certified, GDPR/CCPA
      compliant. Competes with Clay primarily at the SMB individual-prospector tier.

      Hunter.io: Founded 2015, Paris. Hunter is the leading email-discovery point solution for
      small teams with 7M+ users. Credit-based pricing: Free (50 credits/month) through Enterprise
      (custom). Hunter does not offer phone numbers, AI agents, or workflow automation; it competes
      only for Clay's email-discovery credit spend and includes a basic sequencer (up to 500
      recipients/sequence on free plan, scaling with tier).

      Salesloft: Founded 2011, acquired Vista Equity 2022, Atlanta. Salesloft is a revenue
      orchestration platform with 4,000+ customers processing 100M+ emails and calls monthly.
      Its Cadence (sequencer), Rhythm (AI signal-to-action), Conversations, and Deals modules
      compete with Clay's Sequencer and Signals surfaces. Salesloft has no proprietary enrichment
      and sources contact data externally from providers including Clay. Pricing is not public.
      Forrester named it Leader in Revenue Orchestration Platforms Q3 2024.

      HubSpot / Breeze Intelligence: HubSpot's Breeze AI layer, including Breeze Intelligence
      (formerly Clearbit), is the most existential long-term substitute for Clay at SMB-to-mid-
      market. Any HubSpot CRM customer can access AI enrichment at marginal cost within the
      existing contract. HubSpot Sales Hub includes lead management, AI-guided selling, Sales
      Automation, and CPQ—capabilities converging with Clay's outbound surface. HubSpot had
      237,000+ customers and $2.6B+ revenue in 2024. It does not offer Clay's 100+ provider
      waterfall orchestration.
