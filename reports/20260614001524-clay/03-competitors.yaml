  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitive-pricing
      missingEvidence: >-
        No independent price verification for ZoomInfo is available; all ZoomInfo pricing
        data relies on third-party estimates from Cognism, Evaboot, and similar sources—not
        a ZoomInfo official pricing page or customer contract.
      whyItMatters: >-
        ZoomInfo pricing directly informs competitive intensity in Clay's enterprise segment;
        if actual ZoomInfo ACV is materially lower than estimates, displacement risk for Clay
        is higher than modeled.
      diligencePath: >-
        Obtain at least two recent ZoomInfo customer contracts or quotes from procurement
        sources; check ZoomInfo's 10-K for ACV or contract-size disclosure; request a sales
        call quote for comparison.
      relatedQuestionRefs:
        - QP003
        - QP020

    - type: missing-source
      severity: material
      topic: competitive-landscape
      missingEvidence: >-
        No public disclosure of Clay's provider-level API wholesale pricing agreements or
        exclusivity provisions; no evidence that ZoomInfo or Apollo has restricted or
        threatened to restrict wholesale API access to Clay.
      whyItMatters: >-
        If a major provider restricts Clay's API access, the aggregator moat collapses to
        whichever providers remain; this is the single highest-severity supply-side risk
        in Clay's competitive model.
      diligencePath: >-
        Request a schedule of Clay's key data provider contracts including renewal dates,
        pricing floors, and exclusivity restrictions; confirm via provider interviews whether
        any have signaled pricing changes adverse to aggregator access.
      relatedQuestionRefs:
        - QP016
        - QP023

    - type: missing-source
      severity: moderate
      topic: competitive-landscape
      missingEvidence: >-
        Outreach.io platform capabilities, pricing, and AI agent feature set versus Clay's
        Sequencer are not directly confirmed from Outreach's own product or pricing pages;
        only Salesloft was available in the fetch set for the engagement layer.
      whyItMatters: >-
        Outreach is one of the two largest revenue engagement platforms alongside Salesloft
        and its AI capabilities may compete more directly with Clay's new Sequencer product.
      diligencePath: >-
        Fetch and review Outreach.io product and pricing pages; compare Outreach's 2026 AI
        agent feature set against Clay's Sequencer and Signals surfaces.
      relatedQuestionRefs:
        - QP026

    - type: missing-source
      severity: moderate
      topic: multi-homing
      missingEvidence: >-
        No independent survey or customer data quantifying multi-homing rates among Clay
        users (i.e., percentage who simultaneously subscribe to Apollo, ZoomInfo, or Salesloft).
      whyItMatters: >-
        High multi-homing rates reduce Clay's pricing power and increase churn risk when
        customers consolidate tech stacks; low rates would indicate stronger lock-in.
      diligencePath: >-
        Request Clay's internal customer stack survey data or technology overlap report from
        its CRM; alternatively, analyze G2 and buyer-intent data for Clay's customer
        technology stack co-occurrence with Apollo, ZoomInfo, and Salesloft.
      relatedQuestionRefs:
        - QP013
        - QP025
        - QP027
