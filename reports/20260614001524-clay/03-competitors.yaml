callouts:
  - calloutType: risk
    title: "Compliance chain exposure in EU and enterprise procurement"
    body: >-
      Clay's waterfall model means its compliance posture is only as strong as the weakest of
      its 100+ underlying providers. Enterprise buyers in EMEA or regulated industries may require
      individual compliance documentation from each provider—friction that Cognism's single-source
      model sidesteps entirely. Until Clay provides a consolidated compliance attestation layer,
      this creates a tangible loss vector in EU enterprise deals.
    claimRefs:
      - CP027
      - CP028
      - CP031

  - calloutType: risk
    title: "Apollo is the most immediate pricing and feature overlap threat"
    body: >-
      Apollo.io competes with Clay on price, feature set (contact data + sequencer + AI email
      assist), and target buyer (SMB to commercial GTM teams). Apollo's freemium funnel is more
      permissive, and its pricing is transparent and lower at the entry tier. Clay's differentiation
      (waterfall breadth and Claygent) requires longer evaluation cycles to demonstrate value.
    claimRefs:
      - CP009
      - CP021
      - CP022

  - calloutType: risk
    title: "ZoomInfo revenue decline signals category pricing pressure"
    body: >-
      ZoomInfo's −2% revenue decline in FY2024 and 87% NRR are the most concrete adverse
      evidence in the competitive context: the largest proprietary-database player is losing
      customers even while investing in AI. This validates Clay's differentiation thesis but
      signals that enterprise buyers are repricing enrichment downward, creating category-wide
      margin pressure including on Clay's credit economics.
    claimRefs:
      - CP019
      - CP020
      - CP039

  - calloutType: strength
    title: "Clay MCP server pre-empts agentic AI displacement"
    body: >-
      By launching an MCP server in 2026, Clay has positioned itself as the enrichment
      infrastructure layer for LLM agents (Claude, ChatGPT) rather than competing with them.
      This is the most forward-looking competitive move in the market: if agentic AI workflows
      become the primary GTM research mechanism, Clay becomes the data layer those agents call,
      rather than being displaced.
    claimRefs:
      - CP041
      - CP042

  - calloutType: insight
    title: "Salesloft data gap validates Clay's sequencer expansion"
    body: >-
      Salesloft—the leading revenue orchestration platform with 4,000+ enterprise customers—has
      no proprietary enrichment and explicitly partners with enrichment vendors. This confirms the
      market's structural bifurcation: enrichment and engagement remain separately procured.
      Clay's Sequencer launch in 2026 is a rational attempt to capture engagement spend, but it
      places Clay in direct competition with its partner Salesloft for enterprise engagement budget.
    claimRefs:
      - CP015
      - CP025
      - CP033

