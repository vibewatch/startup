  - id: scale-metrics-milestones
    title: Scale, Metrics, and Milestones
    body: >-
      Clay's financial and operational metrics have grown explosively since the 2022
      product-market-fit relaunch. Revenue grew 10× in both 2022 and 2023, and 6× in 2024,
      reaching approximately $30 million for the full 2024 calendar year (per CEO statement
      reported by Forbes in January 2025). The company reached $100M ARR in December 2025.
      Customer count grew from 2,500 (June 2024) to 5,000 (January 2025), and the user base
      exceeded 100,000 by mid-2024 and approximately 500,000 by mid-2026 per homepage claims.
      Headcount expanded from fewer than 10 at the February 2022 Product Hunt relaunch to
      50+ by June 2024 and 150+ by May 2025. More than 100 specialist agencies ("Claygencies")
      now generate revenue by implementing Clay for clients; several exceed $1M in annual
      revenue. The Slack community surpassed 20,000 members by early 2025, and over 90 Clay
      Clubs operate in cities globally. The $5B implied valuation from the January 2026 tender
      represents approximately 50× the 2024 revenue figure of ~$30M—a premium justified by
      investors citing rapid ARR growth, low burn, and category-defining positioning in GTM
      engineering. Core metrics not publicly disclosed include 2025 full-year revenue, gross
      margins, net revenue retention, and current headcount as of June 2026. The January 2026
      tender offer structure—the second in nine months—signals strong secondary-market demand
      but also highlights the company's continued private status and the absence of a near-term
      IPO timeline.
    claimRefs:
