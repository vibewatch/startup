  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: >-
        No regulatory filing, enforcement action, GDPR/CCPA complaint, or data-privacy
        litigation involving Clay has been identified in available public sources.
      whyItMatters: >-
        Clay aggregates and resells B2B contact data sourced from 150+ providers;
        data-privacy regulation (GDPR, CCPA, CAN-SPAM) poses a latent compliance risk that
        could materially affect the business model if enforcement actions arise.
      diligencePath: >-
        Search ICO (UK), FTC (US), and CNIL (France) enforcement databases for Clay or
        related data broker complaints; request compliance documentation from Clay during
        diligence.
      relatedQuestionRefs:
        - QO023

    - type: private-evidence-only
      severity: material
      topic: ipo-exit
      missingEvidence: >-
        No public IPO filing, direct listing, or formal exit timeline has been disclosed
        by Clay as of the June 2026 run date.
      whyItMatters: >-
        Without a disclosed IPO pathway, investor liquidity depends entirely on secondary
        tender offers (which Clay has committed to annually) or a future acquisition;
        valuation credibility rests on secondary-market demand, not public-market pricing.
      diligencePath: >-
        Monitor SEC EDGAR for any Form S-1 or S-1 draft filings; seek board guidance on
        IPO timeline in management interviews.
      relatedQuestionRefs:
        - QO028

    - type: enumeration-incomplete
      severity: minor
      topic: leadership
      missingEvidence: >-
        Full executive leadership team beyond co-founders Amin and Anand is not publicly
        disclosed; no CTO, CPO, CFO, or COO names are available in public sources.
      whyItMatters: >-
        Understanding whether there is a strong second-tier leadership team is essential
        to assessing key-person risk and organizational resilience.
      diligencePath: >-
        Request full org chart from Clay management; review LinkedIn for Clay executive hires;
        check Crunchbase for any named C-suite additions.
      relatedTableRefs:
        - TO002
      relatedQuestionRefs:
        - QO004
        - QO015
        - QO018

    - type: enumeration-incomplete
      severity: minor
      topic: cap-table
      missingEvidence: >-
        Full cap table including all investor ownership percentages, employee equity pool
        size, option pool, and pro-rata rights is not publicly disclosed.
      whyItMatters: >-
        Without cap table transparency, it is not possible to assess dilution trajectory,
        governance balance, or the effective return profile for each investor class.
      diligencePath: >-
        Request cap table via standard Series C diligence data room; review convertible
        note or SAFE terms if any exist from earlier rounds.
      relatedTableRefs:
        - TO003

