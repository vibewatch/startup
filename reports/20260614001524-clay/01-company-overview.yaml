  - id: funding-capital-structure
    title: Funding History and Capital Structure
    body: >-
      Clay has raised approximately $203M in primary capital since inception, executing an
      unusually diverse set of financing structures: traditional venture rounds, a community
      equity offering, and two employee secondary tender offers. The company maintained a
      low-profile approach to fundraising—announcing no funding publicly until its June 2024
      Series B—despite having raised a $2.5M seed (First Round Capital) and a $13.5M Series A
      (Sequoia Capital, 2019) earlier. The Series B ($46M at $500M valuation, led by Meritech
      Capital) was followed just six months later by a Series B expansion ($40M at $1.25B
      valuation), with the company reportedly not having deployed any of the original Series B
      capital at the time. A community equity round (~$1M at the same $1.25B valuation,
      February 2025) allowed direct users and community members to invest at the same terms
      as institutional investors, raising roughly $1M—modest in amount but highly symbolic.
      In May 2025, Sequoia purchased up to $20M in employee shares at a $1.5B valuation
      (tender 1). The Series C in August 2025 ($100M at $3.1B valuation, led by CapitalG,
      Alphabet's venture arm) was the largest primary round and tripled the valuation in six
      months. A second employee tender (January 2026, led by DST Global at a $5B valuation)
      offered a further 3.3× step-up from the Series C in roughly five months. HubSpot
      invested in Clay through its venture arm. The company has disclosed its annual burn
      rate as "a few million dollars a year" as of early 2026, implying extremely capital-
      efficient growth relative to its revenue. No debt or credit facilities have been
      publicly disclosed.
