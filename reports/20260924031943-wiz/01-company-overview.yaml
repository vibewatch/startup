  title: Company Overview
  summary: Establish identity, leadership, funding, scale, and milestones that every later chapter can reuse as ground truth.
sections:
- id: section-1
  title: Identity and product model
  body: 'Wiz presents itself as a cloud and AI security platform that helps organizations create secure environments across

    all major clouds. The current public record matters because the company is no longer a standalone venture: Google

    says it completed the acquisition, retained the Wiz brand, and will continue to support multiple clouds. That

    makes Wiz best understood as a platform brand inside Google Cloud rather than as a fresh private-market security

    startup.


    The product story is still coherent. The company’s own materials emphasize a normalizing layer across cloud

    environments, with code, cloud, and runtime context feeding a single risk view. That positioning is central to the

    rest of the report because it explains why Wiz can convert technical visibility into enterprise adoption and why

    it is often discussed as a CNAPP-style platform rather than a narrow scanner.'
  claimRefs:
  - CO001
  - CO003
  - CO006
  - CO010
  tableRefs:
  - TO001
- id: section-2
  title: Leadership, funding, and scale
  body: 'The founding team remains the main continuity asset. Public and partner sources consistently name Assaf Rappaport,

    Ami Luttwak, Yinon Costica, and Roy Reznik, and Insight’s profile of the founders is explicit that the team had

    already worked together at Adallom and Microsoft. That background matters because Wiz’s credibility is partly a

    founder story: the same group already learned how to ship and scale a cloud-security product before founding Wiz.


    Funding and scale also look unusually strong for a security company. Public references point to a $100M Series A,

    a later $1B round, and a pre-acquisition ARR path that crossed $1B. Wiz’s own about page adds customer-scale

    proof with the Fortune 100 and workload metrics. For diligence, that combination supports a conclusion that Wiz

    reached genuine enterprise scale before Google bought it.'
  claimRefs:
  - CO002
  - CO004
  - CO005
  - CO008
  - CO009
  tableRefs:
  - TO002
  - TO003
- id: section-3
  title: Milestones, credibility, and remaining gaps
  body: 'The public chronology is straightforward: launch in 2020, rapid enterprise traction, larger funding, then a

    March 2026 Google acquisition. The external validation stack is also notable. Reuters coverage shows Wiz still

    participating in security research and public security commentary, while LinkedIn and startup databases place the

    company in New York and describe a sizable workforce. Those are not perfect diligence substitutes, but they do

    reinforce that Wiz was already operating at broad enterprise scale before the exit.


    The main gap is post-close economics. Public sources clearly support the acquisition value and the pre-close ARR

    storyline, but they do not provide a fresh standalone financial picture after the Google transaction. That is why

    this report treats valuation, revenue, and headcount carefully and carries the missing disclosure forward as a

    diligence gap rather than inventing precision.'
  claimRefs:
  - CO007
  - CO011
  - CO012
  figureRefs:
  - FO001
