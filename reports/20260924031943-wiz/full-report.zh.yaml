  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接：Wiz 验证了产品市场契合度，迅速做大规模，并以巨额退出收官。反向逻辑也同样明确：独立资产已经不复存在。因此，估值分析必须把历史成绩与当前投资机会分开看。Wiz
              已实现许多风投支持的安全公司所追求的退出；现在要问的是，还有没有可供承销的独立资产。


              公开信息给出的结论很明确：至少就全新的独立投资来看，答案是否定的。当前唯一合理的立场，是将 Wiz 视作并购成果，重点跟踪 Google 的整合质量，而非再去推演虚构的一级市场估值路径。
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
      - number: '8.2'
        title: 情景假设推演
        blocks:
          - type: paragraph
            body: >-
              乐观情景已经兑现：市场为一家营收规模真实、赛道地位稳固的公司付出了高价。基准情景是 Google 在 Google Cloud 体系内保住 Wiz
              的品牌和产品价值；悲观情景则是整合削弱多云优势，或拖慢产品路线图。收购完成后，值得讨论的只剩这三种情景。


              因此，本报告给出的不是传统的“买入或卖出”建议，而是对所有权状态的判断。若 Wiz 仍保持独立运作，其 ARR 体量与融资轨迹完全足以支撑高溢价估值讨论。但在交易落地后，唯一的实质性问题是：其产品核心价值能否在
              Google 体系内完好无损地延续。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
      - number: '8.3'
        title: 最终定调
        blocks:
          - type: paragraph
            body: >-
              结论因此偏审慎。Wiz
              是成功案例，但已不是新的入场机会。二级市场交易页面和投资人资料页面显示，外部投资者曾对其感兴趣；但这不改变它已不再是独立未上市初创公司的事实。交割后的经营数据披露仍很有限，无法据此重新建立投资测算。


              尽调团队此时最有参考价值的交付物，是一份交割后的跟踪监测备忘录：持续紧盯产品延续性、Google Cloud 整合深度，以及任何显示 Wiz
              多云定位动摇的迹象。昔日的估值博弈已尘埃落定；摆在尽调面前的全新课题是整合落地质量。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
