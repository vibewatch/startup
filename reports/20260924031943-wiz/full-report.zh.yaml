      - number: '2.3'
        title: AI 时代增长与行业整合信号
        blocks:
          - type: paragraph
            body: >-
              Google 收购 Wiz 本身就是一个强烈的市场信号。买方价值主张现已涵盖 AI 安全防御，不再局限于传统的云安全姿态管理。Google 明确表示 Wiz
              将持续支持各大主流云，表明这笔收购被定性为平台级跨越，而非退缩回单一云厂商生态。


              更广泛的整合趋势表明，买方愈发青睐能够贯通云端可见性、运行时响应和 AI 上下文的一体化平台。Reuters
              的负面报道和公开的合作伙伴生态都说明，安全问题尚未解决；能够跨异构环境统一上下文的平台仍能获得市场溢价。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 收购落地后的竞争格局
        blocks:
          - type: paragraph
            body: >-
              Google 完成收购后，Wiz 面对的竞争格局随之改变。它不再是只靠产品竞争的独立初创公司，而是 Google Cloud
              旗下品牌，渠道优势和捆绑销售因此变得更重要。竞争并未消失，只是换了形态：主要对手包括超大规模云厂商的原生安全产品、综合安全套件厂商，以及主打更快见效的专业型 CNAPP 企业。


              公开对比页面普遍将 Wiz 列为行业标杆，而非边缘厂商。这说明它具备竞争力，也说明品类日趋成熟：买方如今会把 Wiz 与平台套件和云厂商原生控制产品对比，而不再只拿它和小众安全姿态扫描工具比较。
            claimRefs:
