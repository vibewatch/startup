  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营与系统可靠性风险
        blocks:
          - type: paragraph
            body: |-
              Wiz 现有公开状态页，第三方监测工具也在追踪其服务事件。这是云平台的常规做法，但系统可用率、登录可靠性和服务沟通仍需尽调核查。状态页并不代表可靠性差，只说明系统运行状况可以被外部观察。

              更深层的启示在于，运营风险并未随收购而烟消云散。云安全系统深植于关键基础设施链条中，即便极为短暂的宕机也会造成信任裂痕。买方仍将紧盯应急响应时效、运行状态透明度以及技术支持处置平台故障的速度。
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR011
