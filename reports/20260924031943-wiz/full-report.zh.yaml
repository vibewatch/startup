      - number: '1.2'
        title: 管理团队、融资历程与业务规模
        blocks:
          - type: paragraph
            body: >-
              创始团队是维系业务连续性的核心资产。公开资料与合作伙伴渠道口径一致，核心成员包括 Assaf Rappaport、Ami Luttwak、Yinon Costica 与 Roy Reznik；Insight
              对创始团队的专题介绍也明确指出，四人此前曾在 Adallom 与 Microsoft 共事。这段履历支撑着 Wiz 的一部分市场信誉：创办 Wiz 前，同一团队已经积累了交付并规模化云安全产品的经验。


              放在安全企业中对比，其融资与业务体量表现同样亮眼。公开记录显示其完成了 $100M 的 Series A 融资、随后的 $1B 轮次，以及在收购前突破 $1B 的 ARR 路径。Wiz
              官网介绍页面进一步给出了客户体量佐证，披露了 Fortune 100 覆盖率及工作负载指标。综合上述证据，尽调可得出明确结论：在 Google 收购之前，Wiz 就已实现了真正意义上的企业级规模。
            claimRefs:
