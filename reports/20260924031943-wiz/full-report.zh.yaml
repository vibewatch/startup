      - number: '3.2'
        title: 护城河与替代方案压力
        blocks:
          - type: paragraph
            body: >-
              Wiz 的公开护城河叙事，核心仍是安全图谱与上下文层。Google 的收购博文强调代码、云端、运行时和 AI 上下文；Sacra 等市场研究也把 Wiz
              视为品类标杆。真正构成壁垒的不是客户锁定，而是把多云数据归一化、排定风险优先级，并让产品在企业规模下仍易于采用的工程能力。


              替代方案的压力真实存在。传统套件厂商可以捆绑销售，超大规模云厂商可以补贴，开源或自建方案能满足重视掌控权的买方，细分工具也能拿下垂直场景。尽调真正要回答的不是有没有竞争，而是面对这些替代路径，Wiz
              的上下文图谱与品牌力能否守住转化率与客群留存。
            claimRefs:
              - CP004
              - CP005
