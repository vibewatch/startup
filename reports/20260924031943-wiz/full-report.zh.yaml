        title: 产品实际交付形态
        blocks:
          - type: paragraph
            body: >-
              不同公开来源对 Wiz 产品定位的描述相当一致：把代码、云端和运行时信息汇入统一的上下文层。因此，Wiz 不像孤立的单点扫描器，更像一张供安全、工程和平台团队共用的风险图谱。Google
              收购博文印证了此种判断，将该平台定位为能快速绘制架构拓扑、权限配置、数据流向和运行时行为的系统级工具。


              落实到产品层面，该平台本质上应视为工作流基础设施。它绝非单层展示看板，而是一套将云端上下文归一化处理的底座，便于安全团队在代码进入生产环境前筛选并处置高危风险。
