      - number: '1.3'
        title: 里程碑、外部背书与遗留缺口
        blocks:
          - type: paragraph
            body: >-
              公开时间线很清楚：Wiz 于 2020 年成立，随后迅速打开企业市场、完成大额融资，并于 2026 年 3 月被 Google 收购。外部资料也提供了佐证：Reuters 报道显示 Wiz
              持续参与安全研究并公开发表安全评论；LinkedIn 和初创企业数据库则显示，公司总部位于 New York，员工队伍规模可观。这些信息虽不能替代一手尽调，但确实印证了 Wiz
              在退出之前就已具备广泛的企业级业务体量。


              核心信息缺口在于交割后的经营数据。公开资料足以佐证收购对价及交割前 ARR，但未见 Google
              交易完成后独立的最新财务全貌。因此，本报告对估值、营收与员工规模均审慎定格，将缺失的披露归为尽调缺口，而非主观推测数字。
