      - number: '3.3'
        title: 公开记录中的遗留缺口
        blocks:
          - type: paragraph
            body: >-
              在竞争证据链上，有一处明显缺失：目前缺乏一份清晰、最新且按产品逐项拆解的公开评测，能证实 Wiz 在哪些工作负载上胜出、又在哪些价格区间落后。这一缺口不可忽视：云安全采购往往由定价和套件整合左右。Reuters
              报道的负面安全事件也提醒市场，声誉风险可能伴随行业领导地位而来。


              Wiz 仍是有说服力的竞争参照，但现有公开证据主要呈现其战略定位，尚不足以整理出完整功能矩阵。多家厂商的产品主张高度重叠；Wiz 又已被超大规模云厂商收购，公开信息难以清楚拆分各家差异也属常态。
