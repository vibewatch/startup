      - number: '6.2'
        title: 客户采用与扩张路径
        blocks:
          - type: paragraph
            body: >-
              公开记录呈现出典型的“先着陆再扩张”（land-and-expand）路径。Google Cloud、Drata、Saviynt 与 WWT 均将 Wiz
              定位为可融入更大安全生态的组件，说明合作伙伴渠道对分销很重要。客户账户最有价值的扩张，很可能来自加购身份、工作流和云安全等相邻模块，而非一次性部署。


              Software Analyst 等第三方公开评述的权威度虽不及一手案例研究，但仍印证了 Wiz
              在头部大客户内部迅速渗透的事实。最主要的缺口在于，公开材料均未披露客户留存曲线、合同周期或前几大头部客户集中度，呈现出“看得到扩张、测不准粘性”的尽调状态。
            claimRefs:
              - CU004
              - CU007
              - CU008
              - CU011
              - CU012
      - number: '6.3'
        title: 未披露的核心盲区
        blocks:
          - type: paragraph
            body: >-
              客户佐证虽广，却不完整。公司未公开披露 NRR、客户流失率、合同期限或客户集中度。研究者因此能看到需求和采用情况，却无法准确衡量客户黏性与收入持续性。ScaleVP 相对审慎的视角正好揭示了这一缺口：即便品牌
              Logo 背书与使用量声称再亮眼，也无法抹杀潜在的客户集中度风险。


              站在更新报告的立场，恰当的结论应保持中肯：Wiz 拥有充足的客户证据来支撑其企业级地位与伙伴驱动的扩张，但公开披露不足以打消外界对留存率与客户集中度的疑虑。而在公司并入 Google Cloud
              之后，这些问号的分量无疑更重了。
            claimRefs:
              - CU006
