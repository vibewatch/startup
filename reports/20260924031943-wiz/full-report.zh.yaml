  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              公开资料显示，Wiz 所在市场聚焦云原生应用保护，而非某个单点品类。Wiz、Omdia、AWS 和 Google 都从云上下文、安全姿态、运行时和响应处置来描述这一问题。因此，这个市场比 CSPM
              更广，却窄于整个企业网络安全市场。实际替代选择包括云厂商原生控制、电子表格和覆盖面更广的安全套件。


              尽调要看三件事：Wiz 能拼出多少上下文、能多快定位关键风险，以及能替买方省掉多少需要自行打通的工具。市场价值由可见性和修复工作流驱动，不只看告警量。
