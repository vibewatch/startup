        - 安全负面报道依然存在
        - 外部舆论审视能否得到有效化解？
      - - 渠道连续性
        - 支撑市场触达
        - 渠道伙伴落地成果依然可见
        - 合作伙伴的分成机制是否改变？
      - - AI 路线图
        - 业务邻近增长点
        - 具备 AI 安全能力
        - 产品迭代交付有多快？
      - - 股权归属状态
        - 决定标的是否具备可投性
        - 已经完成收购
        - 唯有业务独立分拆才能重开入场窗口
    notes: 本清单列明尽调团队在交易交割后应重点跟踪的核心事项。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
figures:
  - id: FO001
    title: 公司关键里程碑时间线
    type: timeline
    summary: Wiz 从隐身模式发布一路发展，最终被 Google 收购，期间始终坚持多云安全定位。
    data:
      items:
        - date: 2020-01
          label: 走出隐身模式
          detail: 四位联合创始人曾在 Adallom 与 Microsoft 共事，之后创立 Wiz。
          tone: positive
        - date: '2020'
          label: $100M A 轮融资
          detail: Index、Sequoia、Insight 与 Cyberstarts 领投该轮融资。
          tone: positive
        - date: '2022'
          label: 突破 Fortune 100 客户
          detail: 公开材料展现其在大型企业中的快速落地与规模扩张。
          tone: positive
        - date: '2024'
          label: $1B 融资轮次
          detail: 这一轮公开融资直接将公司推入百亿美元独角兽行列。
          tone: positive
        - date: '2025'
          label: $1B ARR 里程碑
          detail: 第三方收入监测机构数据显示，Wiz 在退出前 ARR 已突破 $1B。
          tone: positive
        - date: 2026-03
          label: Google 收购完成交割
          detail: Google 完成收购并保留 Wiz 独立品牌。
          tone: neutral
        - date: 2026-09
          label: 交割后现状
          detail: Wiz 现为 Google Cloud 旗下安全品牌，并继续支持多云环境。
          tone: neutral
        - date: 2026-09
          label: 公开资料更新
          detail: LinkedIn 与初创企业数据库依然显示其拥有纽约据点与庞大的员工队伍。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO006
      - CO008
      - CO009
      - CO012
  - id: FM001
    title: 市场分层金字塔模型
    type: pyramid
    summary: Wiz 居于分层市场的核心枢纽：底层起步于云上可见性，顶层延伸至支持 AI 感知的安全运营。
    data:
      nodes:
        - label: 云与 AI 采用
          detail: 更多工作负载、更多云厂商、更多智能体
          tone: positive
        - label: 攻击面暴露
          detail: 身份凭证、错误配置、机密泄露与运行时风险
          tone: warning
        - label: 上下文关联层
          detail: 代码-云-运行时图谱与资产情报
          tone: positive
        - label: CNAPP / 安全姿态
          detail: 排定关键云风险优先级并予修复
          tone: positive
        - label: 响应 / SecOps
          detail: 调查、研判与响应
          tone: neutral
        - label: AI 安全
          detail: 将可见性延伸至模型与智能体工作流
          tone: positive
    approximationNotes: 各层级系基于产品与分析师公开资料的事实综合，而非正式发布的市场分层标准。
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM008
      - CM010
      - CM012
  - id: FP001
    title: 竞争定位图谱
    type: quadrant
    summary: Wiz 位列 CNAPP 市场右上角，但超大规模云厂商与套件厂商在渠道和捆绑销售上构成强劲压力。
    data:
      xAxis:
        label: 渠道分发优势（0-10 序数）
      yAxis:
        label: 买方选择权 / 部署灵活性（0-10 序数）
      points:
        - label: Wiz
          x: 8
          'y': 6
          detail: 产品上下文能力突出，多云覆盖广。
          tone: positive
        - label: 超大规模云厂商
          x: 10
          'y': 4
          detail: 捆绑销售能力极强，但买方选择权较低。
          tone: positive
        - label: 套件老牌厂商
          x: 9
          'y': 5
          detail: 交叉销售能力强，采购议价杠杆大。
          tone: positive
        - label: CNAPP 专精厂商
          x: 6
          'y': 7
          detail: 通常响应敏捷，但业务规模较小。
          tone: neutral
        - label: 开源 / 自建方案
          x: 3
          'y': 10
          detail: 自主掌控度高，但缺乏开箱即用的简便性。
          tone: neutral
        - label: 渠道捆绑方案
          x: 7
          'y': 5
          detail: 合作伙伴路径能拓宽触达，却也推高了复杂度。
          tone: neutral
    approximationNotes: 序数评分系综合产品、分发及所有权公开事实推算，而非厂商申报的量化指标。
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP009
      - CP012
  - id: FI001
    title: 收入模式演进路径
    type: flow
    summary: Wiz 依据受保护的工作负载规模定价，将客户云资产扩张变现，并逐步横向拓展至云、运行时与 AI 安全。
    data:
      nodes:
        - id: cloud
          label: 客户云资产足迹
          detail: AWS、Azure、GCP 及其他环境衍生出待保护的工作负载。
          tone: positive
        - id: scan
          label: 无代理扫描与安全图谱
          detail: 凭只读权限即可构建上下文并暴露关键风险。
          tone: positive
        - id: license
          label: 按工作负载计费
          detail: 收入随受保护云资产规模增长。
          tone: positive
        - id: expand
          label: 模块横向扩张
          detail: 运行时、AI 与安全响应功能有效拉高 ACV。
          tone: positive
        - id: renew
          label: 企业大客户续约
          detail: 增购扩张机制与伙伴渠道促成更大规模订单。
          tone: neutral
        - id: exit
          label: Google 收购
          detail: $32B 收购完成后，Wiz 的独立收入模式也随之终结。
          tone: warning
      edges:
        - from: cloud
          to: scan
        - from: scan
          to: license
        - from: license
          to: expand
        - from: expand
          to: renew
        - from: renew
          to: exit
    approximationNotes: null
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI008
      - CI009
      - CI011
  - id: FE001
    title: 信任与路线图全景
    type: stack
    summary: Wiz 构筑了云上下文、工作流集成与信任控制的多层体系，但核心悬念在于 AI 以及归入 Google 后的路线图抉择将如何影响这一技术栈。
    data:
      layers:
        - label: 交互体验
          detail: 安全团队与开发者共享同一操作界面
          tone: positive
          modules:
            - 控制台
            - 仪表盘
          outputs:
            - 工作流视图
        - label: 代码与 CI/CD
          detail: 左移安全检查与开发者工具
          tone: positive
          modules:
            - CI/CD 工具
            - GitHub 集成
          outputs:
            - 部署前检测结果
        - label: 云上下文
          detail: 无代理云安全图谱与资产盘点
          tone: positive
          modules:
            - 扫描引擎
            - 安全图谱
          outputs:
            - 风险拓扑图
        - label: 运行时
          detail: 实时工作负载与暴露面上下文
          tone: neutral
          modules:
            - 运行时可见性
          outputs:
            - 攻击路径
        - label: AI 安全
          detail: 看清 AI 应用、智能体及相关风险
          tone: positive
          modules:
            - AI 安全
          outputs:
            - AI 安全防护护栏
        - label: 信任与运营
          detail: 合规、隐私与响应控制机制
          tone: warning
          modules:
            - 安全管控项
            - 客户支持
          outputs:
            - 企业级完备性
    approximationNotes: 各层划分综合了公开平台说明与第三方还原材料。
    claimRefs:
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    summary: Wiz 的采用通常从建立云安全认知开始，随后进入企业部署，再由合作伙伴推动扩张。
    data:
      nodes:
        - id: discover
          label: 认知发现
          detail: 安全与云团队会从客户案例、合作伙伴及公开宣称的规模信息中了解 Wiz。
          tone: positive
        - id: trial
          label: 试用评估
          detail: 团队在真实云环境中测试只读权限与无代理扫描。
          tone: positive
        - id: land
          label: 初步切入
          detail: 先覆盖单个云环境或一组特定工作负载。
          tone: neutral
        - id: prove
          label: 价值验证
          detail: 具名客户案例和合作伙伴佐证展示了生产环境价值。
          tone: positive
        - id: expand
          label: 拓展扩张
          detail: 跨云部署与合作伙伴驱动的扩张推高单客价值。
          tone: positive
        - id: renew
          label: 续约与留存跟踪
          detail: 客户留存质量仅为间接推断，未见公开量化数据。
          tone: warning
    approximationNotes: 该旅程基于客户案例、伙伴页面与公开宣称的规模数据综合梳理，而非实测漏斗数据。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 运营与路线图风险评级最高，而收购引发的特定法律风险多偏向声誉层面，并非生存危机。
    data:
      columns:
        - 低
        - 中
        - 高
      rows:
        - label: 发生概率
          values:
            - label: 服务支持延续性
              tone: neutral
            - label: 宕机中断与鉴权故障
              tone: warning
            - label: 迁移复杂度
              tone: critical
        - label: 影响程度
          values:
            - label: 安全审查压力
              tone: warning
            - label: 合作伙伴依赖
              tone: warning
            - label: 路线图偏离
              tone: critical
        - label: 缓解措施成熟度
          values:
            - label: 状态监控页
              tone: positive
            - label: Google 管控机制
              tone: neutral
            - label: AI 安全路线图
              tone: warning
        - label: 法律与声誉
          values:
            - label: Reuters 报道审视
              tone: warning
            - label: 信息披露规范
              tone: neutral
            - label: 声誉舆论扰动
              tone: warning
        - label: AI 与产品
          values:
            - label: AI 攻击面
              tone: warning
            - label: 路线图覆盖广度
              tone: neutral
            - label: 产品功能深度
              tone: positive
        - label: 集中度
          values:
            - label: 客户结构
              tone: warning
            - label: 合作伙伴构成
              tone: neutral
            - label: 头部大客户透明度不足
              tone: critical
    approximationNotes: 该热力图属定性评估且刻意偏向保守，旨在概括严重程度而非测算精确发生概率。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR007
      - CR012
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: Wiz 从风投支持下的规模化发展走到 Google 收购退出，因此当前重点不再是估值目标，而是确认所有权状态。
    data:
      nodes:
        - id: scale
          label: 规模实证
          detail: $1B ARR 伴随广泛的企业级采纳
          tone: positive
        - id: funding
          label: 风投溢价
          detail: 估值 $12B 的 $1B 融资为该增长轨迹提供了背书
          tone: positive
        - id: exit
          label: Google 收购交割
          detail: $32B 全现金收购兑现了价值
          tone: positive
        - id: liquidity
          label: 价值兑现
          detail: 早期投资方既有账面收益，也有已实现收益
          tone: positive
        - id: standalone
          label: 独立投资敞口关闭
          detail: 私募市场已无新的入场窗口
          tone: warning
        - id: monitor
          label: 跟踪整合动态
          detail: 交割后的业务连续性成为后续尽调重点
          tone: neutral
      edges:
        - from: scale
          to: funding
        - from: funding
          to: exit
        - from: exit
          to: liquidity
        - from: liquidity
          to: standalone
        - from: standalone
          to: monitor
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
      - CV012
