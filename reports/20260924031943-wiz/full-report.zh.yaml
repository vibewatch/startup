  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业变现逻辑
        blocks:
          - type: paragraph
            body: >-
              公开渠道普遍将 Wiz 描述为按受保护云工作负载数量计费的订阅制 SaaS
              业务。这一模式意味着营收随客户云资产规模增长，而非随员工人数线性增加。它也解释了“先着陆再扩张”（land-and-expand）为何有效：客户在某个云环境验证价值后，更多工作负载便可纳入合同。


              其营收端最清晰的公开信号来自 ARR 增长时间线。第三方追踪机构及官方资料均显示，在 Google 交易交割前，Wiz 的 ARR 已突破 $1B；而早期里程碑显示其仅用约 18 个月就跨过 $100M ARR
              门槛。尽管具体营业利润率数据尚未披露，但放眼非上市安全企业，这已是极具说服力的营收质量证明。
            claimRefs:
              - CI001
