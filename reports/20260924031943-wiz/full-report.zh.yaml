      - number: '5.2'
        title: 部署模式与核心差异化
        blocks:
          - type: paragraph
            body: >-
              Wiz 的技术优势首先体现在部署门槛低。它反复强调无代理扫描和只读云端权限；相比笨重的宿主 Agent 或 Sidecar
              方案，极大减轻了全面铺开的工程负担。这解释了为何公开评价一致称其部署迅速且契合企业实际。GitHub 动态与 CI/CD 资料表明，公司不仅希望打动安全运营人员，也在极力争取开发者的技术认同。


              第二大差异化在于上下文的解析深度。第三方技术拆解将 Wiz 归纳为安全图谱，这与其官方强调的共享上下文口径，以及 Google 关于 Wiz
              强化了“从代码到云端”全链路安全的声明高度吻合。换句话说，其护城河并非某项单一功能，而是系统能够安全汇聚并投入实战的上下文体量。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
      - number: '5.3'
        title: 信任机制、AI 布局与路线图风险
        blocks:
          - type: paragraph
            body: >-
              Wiz 的产品也已扩展到 AI 安全。Google 表示，Wiz 现已覆盖 AI 应用和智能体，跟上云端买方转向模型工作流的步伐。AI 安全正在成为独立预算项，而不再只是传统云安全姿态管理的附加模块。


              然而，其产品逻辑并非毫无瑕疵。外界对 Wiz 所发掘安全漏洞的报道，以及各类替代性代码安全方案的涌现，都表明市场仍在持续施压以求验证。在 Google
              收购尘埃落定后，悬而未决的疑问落在路线图优先级上：公开事实证实其当下实力强劲，但在融入 Google 更庞大的安全产品矩阵后，Wiz 平台的迭代节奏尚缺乏明确依据。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
