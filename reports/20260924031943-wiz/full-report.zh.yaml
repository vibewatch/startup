chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与产品模式
        blocks:
          - type: paragraph
            body: >-
              Wiz 自称是一家面向各大主流云、帮助企业构建安全环境的云与 AI 安全平台。解读当前公开信息时，首先要看到它已不再是独立初创公司：Google 称已完成收购、保留 Wiz
              品牌，并将继续支持多云环境。因此，与其把 Wiz 看作一级市场的新兴安全初创公司，不如将它视为 Google Cloud 旗下的平台品牌。


              其产品逻辑保持连贯。官方公开资料强调跨云环境的归一化抽象层，把代码、云端和运行时上下文汇入统一风险视图。这一产品定位贯穿本报告始终：它阐明了 Wiz 何以将技术可见性转化为企业级规模采用，也是业内常将其视作
              CNAPP 类平台而非狭义扫描工具的原因。
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO010
