  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户规模与客群结构
        blocks:
          - type: paragraph
            body: >-
              公开的客群数据是 Wiz 表现最硬核的板块之一。Wiz 称 Fortune 100 中有 65% 均为其客户，其官网介绍页亦披露了 500 万受保护工作负载与每日扫描 2300 亿份文件的数据。这足以得出定论：在
              Google 实施收购之前，该平台就已完成了企业级规模渗透。


              客户构成也相当多元。公开点名的案例覆盖大型企业、科研机构、云平台和合作伙伴，说明 Wiz 既能进入安全团队，也能在平台工程团队落地。多元客群支持这一判断：Wiz
              不是单一场景工具，而是一款拥有多个采用入口的云安全平台。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
