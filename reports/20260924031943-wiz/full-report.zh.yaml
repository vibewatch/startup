      - number: '4.2'
        title: 融资历程与退出测算
        blocks:
          - type: paragraph
            body: >-
              其融资历程同样格外突出。Wiz 曾公开庆祝以 $12B 估值完成 $1B 融资，随后于 2026 年 3 月以 $32B 全现金被 Google
              揽入囊中。这足以表明公司从风投支持阶段走到退出，期间未见明显资金紧张。Insight 对创始人的侧记点出了关键细节：团队已有的默契和客户网络，很可能减少了早期市场拓展中的试错浪费。


              就尽调结论而言，其资本效率足以支撑极快节奏的营收爬坡；但仅凭公开文件，仍无法还原其精确的利润率结构。
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
      - number: '4.3'
        title: 待核实尽调事项
        blocks:
          - type: paragraph
            body: >-
              核心缺口仍是非上市公司的信息不透明：公开资料没有提供足够精确的利润率、现金消耗、CAC 回本周期和续约信息，后期财务投资者因此难以按常规标准承销这项业务。公开 ARR
              口径也略有出入，各来源统计时点不一；稳妥做法是以最近公布的里程碑为准，而非认定某个精确估算就是定论。


              因此，本次更新的财务结论是：Wiz 已验证产品市场契合度并兑现退出价值；但收购完成后，公开披露已不足以支持同等精度的独立运营模型复盘。
