      - number: '2.2'
        title: 买方客群与采购触发机制
        blocks:
          - type: paragraph
            body: >-
              买方需求覆盖安全运营、云工程、平台工程、应用安全，AI 安全团队也在增多。AWS 的医疗中心案例与 Omdia
              分析师框架都支持一个判断：受严格监管的大型企业天然会率先采购，也最能感受到云资产扩张、合规压力和跨云复杂性带来的挑战。


              驱动采购的动因极少是宽泛的安全意识，更多源自审计缺陷通报、云迁移项目，或突然暴露全新风险敞口的 AI 上线项目。Wiz 主打的归一化抽象层与无代理部署有助于缩短买方决策链，但 SecurityScientist
              的问答样本表明，预算获批前，客户仍需充分了解实施方式、信任机制和产品价值。
