              - CR012
      - number: '7.2'
        title: 安全、法律与声誉风险
        blocks:
          - type: paragraph
            body: >-
              Reuters 报道了一起由 Wiz 发现并报告的安全漏洞。这说明 Wiz
              不只是商业安全厂商，也参与公共安全议题。双重身份利弊并存：发现漏洞有助于建立信任，但一旦自身卷入安全事件，也会面临更严格的审视。因此，Wiz 对外展示的安全能力仍需持续验证。


              法律风险往往超出单条新闻的表面范畴。公众与监管对安全厂商的检测精准度、信息披露规范及漏洞响应流程始终保持高压审视。Wiz 对外展现的专业姿态虽称得上稳健，尽调仍应把安全声誉视为持续存在的风险，而非已经解决的问题。
            claimRefs:
              - CR003
              - CR005
              - CR009
      - number: '7.3'
        title: 并购整合与生态依赖风险
        blocks:
          - type: paragraph
            body: >-
              相比单一故障事件，Google 收购对 Wiz 风险画像的影响更为根本。Wiz 对外仍是多云品牌，但产品优先级、路线图安排和技术支持都取决于 Google 内部决策。Google 称 Wiz
              将持续支持多云，这固然令人安心，但买方仍应预设其在路线图规划与分销渠道上对 Google Cloud 存在一定程度的依附。


              投资逻辑的破裂条件很清楚：如果多云兼容性、运营连续性或安全纵深在 Google 体系内实质性减弱，Wiz 的战略价值就会改观。公开资料尚未显示这种下滑，但这些风险值得持续跟踪。
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR012
