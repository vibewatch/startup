chapter:
  number: 2
  title: Market Analysis
  summary: Define the market, buyer, sizing, drivers, and constraints that govern adoption and valuation.
sections:
- id: section-1
  title: Market boundary and substitutes
  body: 'The public evidence supports a market boundary around cloud-native application protection rather than a single point

    category. Wiz, Omdia, AWS, and Google all describe the problem in terms of cloud context, posture, runtime, and

    response. That makes the real market larger than CSPM alone and narrower than all of enterprise cybersecurity.

    The practical substitute set includes native cloud controls, spreadsheets, and broader security suites.


    For diligence purposes, the important takeaway is that Wiz is competing in a category where value depends on how

    much context it can assemble, how quickly it can surface critical risk, and how much it can compress the number

    of tools a buyer needs to stitch together. The market is therefore driven by visibility and remediation workflow,

    not just by alert volume.'
  claimRefs:
  - CM001
  - CM002
  - CM012
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: section-2
  title: Buyer segments and adoption triggers
  body: 'Buyer demand appears to span security operations, cloud engineering, platform engineering, application security,

    and increasingly AI-security teams. AWS’s medical-center example and Omdia’s analyst framing both support the view

    that regulated, large-enterprise environments are the natural first buyers, because they feel the pain of cloud

    sprawl, compliance pressure, and cross-cloud complexity most acutely.


    Adoption is triggered less by generic awareness than by audit findings, migration initiatives, or an AI launch that

    suddenly exposes a new class of risk. Wiz’s own messaging about a normalizing layer and agentless deployment helps

    the buyer path, but the SecurityScientist Q&A pattern shows that customers still need education on implementation,

    trust, and value proof before the budget closes.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM006
  - CM009
  - CM011
  tableRefs:
  - TM002
  - TM003
- id: section-3
  title: AI-era growth and the consolidation signal
  body: 'Google’s acquisition of Wiz is also a market signal. The buyer value proposition now includes AI-security coverage,

    not only classic cloud posture management. Google explicitly says Wiz will continue to support major clouds, which

    suggests that the acquisition is being positioned as a platform expansion rather than a retrenchment into a single

    hyperscaler environment.


    The broader consolidation signal is that buyers increasingly prefer integrated platforms that can connect cloud

    visibility, runtime response, and AI context. Reuters’ adverse coverage and the public partner ecosystem both show

    that security is not a solved problem; the market still rewards platforms that can normalize context across many

    environments.'
  claimRefs:
  - CM007
  - CM008
  - CM010
  - CM012
