  - - Key diligence ask
    - Post-close operating economics
    - Need actual margin, burn, and product-plan disclosure
  - - Exit readiness
    - Already realized
    - Only relevant if a spinout or secondary market emerges
  - - Decision implication
    - Do not underwrite as a fresh standalone startup
    - Reframe as a Google Cloud product line
  notes: The table is intentionally decision-oriented because the asset has already been acquired; valuation should be treated
    as a historical outcome, not a live entry price.
