- id: TV003
  title: Post-close diligence checklist
  columns:
  - diligence item
  - why it matters
  - current public signal
  - open question
  rows:
  - - Product continuity
    - Preserves buyer trust
    - Google says support continues
    - Will the surface stay distinct?
  - - Multi-cloud posture
    - Core differentiation
    - Still publicly supported
    - How long does it remain first-class?
  - - Pricing / packaging
    - Affects monetization
    - No public detail
    - How is it sold inside Google?
  - - Operating economics
    - Needed for underwriting
    - Sparse disclosure
    - Margin and burn remain opaque
  - - Reputation management
    - Affects enterprise adoption
    - Security headlines persist
    - Can public scrutiny be contained?
  - - Channel continuity
    - Supports reach
    - Partner proof still visible
    - Do partner economics change?
  - - AI roadmap
    - Growth adjacency
    - AI security is present
    - How quickly does it ship?
  - - Ownership status
    - Determines investability
    - Already acquired
    - Only a spinout would reopen entry
  notes: The checklist reflects what a diligence team should monitor after close.
