- id: TV002
  title: Scenario sensitivity table
  columns:
  - scenario
  - what has to stay true
  - what breaks the case
  - watch item
  rows:
  - - Bull
    - Google preserves product depth and multi-cloud support
    - Roadmap narrows or brand disappears
    - Continuity of product surface
  - - Base
    - Wiz remains a strong Google Cloud security line
    - Integration blurs the differentiation
    - Multi-cloud support and packaging
  - - Bear
    - Acquisition value remains the end state
    - Product usefulness erodes
    - Support continuity and trust
  - - Secondary
    - Some private-market demand persists
    - No operating disclosure exists
    - Operating economics
  - - Spinout
    - A new independent asset appears
    - Google keeps it embedded
    - Legal / structural change
  - - Exit premium
    - Legacy venture gains remain exceptional
    - New valuation is unsupported
    - Historical return framing
  - - Monitoring only
    - Public signals remain sparse
    - Fresh disclosure appears
    - New economics data
  - - Caution
    - Security reputation stays intact
    - Adverse headlines intensify
    - Trust and scrutiny
  notes: Scenario framing is more useful than a single-point valuation after a completed acquisition.
