  title: Financials
  summary: Explain revenue model, unit economics, capital needs, and which financial inputs are insufficient for underwriting.
sections:
- id: section-1
  title: How Wiz made money
  body: 'Public sources consistently describe Wiz as a subscription SaaS business that priced against the number of cloud

    workloads it protected. That matters because it means revenue should scale with customer cloud footprint, not with

    employee headcount. The model also explains why land-and-expand mechanics were so powerful: once a customer proved

    value on one cloud estate, additional workloads could be brought into the contract.


    The clearest public revenue signal is the ARR timeline. Third-party trackers and company references place Wiz above

    $1B ARR before the Google acquisition closed, while older milestones show $100M ARR in roughly 18 months. That is

    a very strong revenue-quality signal for a private security company, even though the exact operating margin data

    remains undisclosed.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI008
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: section-2
  title: Funding and exit economics
  body: 'The financing story is also unusually strong. Wiz publicly celebrated a $1B round at a $12B valuation, and the

    March 2026 Google acquisition closed at $32B all-cash. That is enough to show that the company moved from venture

    scale to exit scale without a visible funding crunch. Insight’s founder profile adds an important nuance: a

    preexisting team and customer network likely helped reduce go-to-market waste.


    In diligence terms, the most useful conclusion is that capital efficiency was good enough to support a very fast

    revenue ramp, but the exact margin structure still cannot be rebuilt from public documents alone.'
  claimRefs:
  - CI004
  - CI005
  - CI010
  - CI011
- id: section-3
  title: What still needs diligence
  body: 'The remaining gap is classic private-company opacity. Public sources do not provide margin, cash-burn, CAC payback,

    or renewal detail with enough precision to underwrite the business the way a later-stage financial sponsor would.

    There are also modest conflicts in the public ARR narrative: some sources track the company differently by date, so

    the safest approach is to treat the latest milestone rather than any single exact estimate as canonical.


    That leaves the right financial conclusion in a refresh report: Wiz proved product-market fit and exit value, but

    public disclosure no longer supports a standalone operating model with the same precision after the acquisition.'
  claimRefs:
  - CI006
  - CI007
  - CI012
  tableRefs:
  - TI002
  - TI003
