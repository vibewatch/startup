  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer scale and segment mix
        blocks:
          - type: paragraph
            body: >-
              The public customer story is one of the strongest parts of the Wiz record. Wiz says 65% of the Fortune 100
              are

              customers, and its public about page also points to 5 million workloads protected and 230 billion files
              scanned

              daily. That is enough to conclude that the company reached enterprise-scale adoption before the Google
              deal.


              The customer mix looks broad rather than narrow. Named proof appears in enterprise, research, cloud, and
              partner

              contexts, which suggests that the product can land with both security and platform teams. That breadth
              matters

              because it supports the idea that Wiz is not a one-segment tool; it is a cloud-security platform with
              multiple

              adoption surfaces.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
