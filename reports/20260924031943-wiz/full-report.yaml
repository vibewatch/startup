              - CM010
              - CM011
      - number: '2.3'
        title: AI-era growth and the consolidation signal
        blocks:
          - type: paragraph
            body: >-
              Google’s acquisition of Wiz is also a market signal. The buyer value proposition now includes AI-security
              coverage,

              not only classic cloud posture management. Google explicitly says Wiz will continue to support major
              clouds, which

              suggests that the acquisition is being positioned as a platform expansion rather than a retrenchment into
              a single

              hyperscaler environment.


              The broader consolidation signal is that buyers increasingly prefer integrated platforms that can connect
              cloud

              visibility, runtime response, and AI context. Reuters’ adverse coverage and the public partner ecosystem
              both show

              that security is not a solved problem; the market still rewards platforms that can normalize context
              across many

              environments.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set after acquisition
        blocks:
          - type: paragraph
            body: >-
              Wiz’s competitive set changed once Google closed the acquisition. The company is no longer a pure startup
              competing on

              product alone; it is now a brand inside Google Cloud, so distribution leverage and bundling matter more.
              That does

              not eliminate competition. It changes it. In practice, the relevant field now includes hyperscaler-native
              security,

              broad suite vendors, and specialist CNAPP companies that still promise faster time-to-value.


              Public comparison pages consistently treat Wiz as a benchmark company rather than a fringe vendor. That is
              a sign of

              strength, but also of category maturity: buyers evaluate Wiz against platform suites and native cloud
              controls,

              not only against niche posture scanners.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
