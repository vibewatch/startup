  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational and reliability risks
        blocks:
          - type: paragraph
            body: >-
              Wiz now has a visible status page, and third-party trackers show incident-style monitoring around the
              product. That is

              normal for a cloud platform, but it means uptime, login reliability, and service communication remain
              diligence

              items. The existence of status pages does not imply poor reliability; it simply makes reliability
              observable.


              The bigger takeaway is that operational risk did not vanish with the acquisition. Cloud security systems
              sit in the

              path of critical infrastructure, so even short incidents can create trust friction. Buyers will continue
              to ask about

              incident response, status transparency, and how quickly support resolves platform issues.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR011
