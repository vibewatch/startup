  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: How Wiz made money
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently describe Wiz as a subscription SaaS business that priced against the number of
              cloud

              workloads it protected. That matters because it means revenue should scale with customer cloud footprint,
              not with

              employee headcount. The model also explains why land-and-expand mechanics were so powerful: once a
              customer proved

              value on one cloud estate, additional workloads could be brought into the contract.


              The clearest public revenue signal is the ARR timeline. Third-party trackers and company references place
              Wiz above

              $1B ARR before the Google acquisition closed, while older milestones show $100M ARR in roughly 18 months.
              That is

              a very strong revenue-quality signal for a private security company, even though the exact operating
              margin data

              remains undisclosed.
