      - number: '4.2'
        title: Funding and exit economics
        blocks:
          - type: paragraph
            body: >-
              The financing story is also unusually strong. Wiz publicly celebrated a $1B round at a $12B valuation, and
              the

              March 2026 Google acquisition closed at $32B all-cash. That is enough to show that the company moved from
              venture

              scale to exit scale without a visible funding crunch. Insight’s founder profile adds an important nuance:
              a

              preexisting team and customer network likely helped reduce go-to-market waste.


              In diligence terms, the most useful conclusion is that capital efficiency was good enough to support a
              very fast

              revenue ramp, but the exact margin structure still cannot be rebuilt from public documents alone.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
      - number: '4.3'
        title: What still needs diligence
        blocks:
          - type: paragraph
            body: >-
              The remaining gap is classic private-company opacity. Public sources do not provide margin, cash-burn, CAC
              payback,

              or renewal detail with enough precision to underwrite the business the way a later-stage financial sponsor
              would.

              There are also modest conflicts in the public ARR narrative: some sources track the company differently by
              date, so

              the safest approach is to treat the latest milestone rather than any single exact estimate as canonical.


              That leaves the right financial conclusion in a refresh report: Wiz proved product-market fit and exit
              value, but

              public disclosure no longer supports a standalone operating model with the same precision after the
              acquisition.
