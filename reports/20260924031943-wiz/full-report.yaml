  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a market boundary around cloud-native application protection rather than a
              single point

              category. Wiz, Omdia, AWS, and Google all describe the problem in terms of cloud context, posture,
              runtime, and

              response. That makes the real market larger than CSPM alone and narrower than all of enterprise
              cybersecurity.

              The practical substitute set includes native cloud controls, spreadsheets, and broader security suites.


              For diligence purposes, the important takeaway is that Wiz is competing in a category where value depends
              on how

              much context it can assemble, how quickly it can surface critical risk, and how much it can compress the
              number

              of tools a buyer needs to stitch together. The market is therefore driven by visibility and remediation
              workflow,

              not just by alert volume.
            claimRefs:
              - CM001
              - CM002
              - CM012
