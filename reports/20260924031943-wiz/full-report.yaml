      bundling.
    data:
      xAxis:
        label: Distribution leverage (0-10 ordinal)
      yAxis:
        label: Buyer optionality / deployment flexibility (0-10 ordinal)
      points:
        - label: Wiz
          x: 8
          'y': 6
          detail: Strong product context with multi-cloud reach.
          tone: positive
        - label: Hyperscalers
          x: 10
          'y': 4
          detail: Strong bundle power, lower buyer optionality.
          tone: positive
        - label: Suite incumbents
          x: 9
          'y': 5
          detail: Cross-sell depth and procurement leverage.
          tone: positive
        - label: CNAPP specialists
          x: 6
          'y': 7
          detail: Often agile but narrower scale.
          tone: neutral
        - label: Open-source / DIY
          x: 3
          'y': 10
          detail: High control, low turnkey simplicity.
          tone: neutral
