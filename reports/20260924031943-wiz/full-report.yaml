      - number: '6.2'
        title: How adoption expands
        blocks:
          - type: paragraph
            body: >-
              The public record points to a classic land-and-expand motion. Google Cloud, Drata, Saviynt, and WWT all
              frame Wiz

              as something that can sit inside a broader security ecosystem, which is a clue that partner-led
              distribution is

              important. The same ecosystem also hints that the most valuable account expansion probably comes from
              adding

              adjacent identity, workflow, and cloud-security modules rather than from a single one-off deployment.


              Public writeups such as Software Analyst’s are less authoritative than the case studies, but they still
              support the

              idea that Wiz scaled quickly inside larger accounts. The main gap is that none of the public materials
              disclose

              retention curves, contract duration, or top-account concentration, so expansion is visible while
              durability is not

              fully measured.
            claimRefs:
              - CU004
              - CU007
              - CU008
              - CU011
              - CU012
      - number: '6.3'
        title: What remains opaque
        blocks:
          - type: paragraph
            body: >-
              The customer evidence is broad, but it is not complete. The company does not publicly disclose NRR, churn,
              contract

              length, or customer concentration. That means the reader can see demand and adoption but not fully measure

              durability. ScaleVP’s more skeptical framing helps keep that gap visible: even very strong logo and usage
              claims do

              not eliminate concentration risk.


              For a refresh report, the right conclusion is therefore balanced. Wiz has enough customer evidence to
              support

              enterprise relevance and partner-driven expansion, but not enough disclosure to eliminate retention and
              concentration

              questions. Those questions now matter even more because the company is inside Google Cloud.
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU012
