  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and antithesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is simple: Wiz proved product-market fit, scaled quickly, and realized an enormous exit. The
              antithesis

              is equally simple: the standalone asset is gone. That means valuation analysis now has to distinguish
              between the

              historical security outcome and any live investment opportunity. The company already produced the exit
              that many

              venture-backed security companies hope for; the question is whether anything remains to underwrite.


              Public sources say no, at least for a fresh standalone investment. The only sensible current posture is to
              treat

              Wiz as an acquisition outcome and to monitor Google’s integration quality rather than to project a fresh
              private

              valuation path.
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
      - number: '8.2'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is already realized: the market paid a very large price for a company with real revenue
              scale and a

              strong category position. The base case is that Google preserves the Wiz brand and product value inside
              Google

              Cloud. The bear case is that integration blurs the multi-cloud edge or slows roadmap momentum. Those are
              the only

              meaningful scenarios left now that the acquisition has closed.


              That is why the report recommendation is not a classic buy-versus-sell call. It is an ownership-status
              call. If

              Wiz were still independent, the ARR and funding path would support a premium valuation discussion. After
              the close,

              the right question is simply whether the product value survives intact inside Google.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
      - number: '8.3'
        title: Final stance
        blocks:
          - type: paragraph
            body: >-
              The final stance is therefore conservative. Wiz is a success story, but not a fresh entry opportunity.
              Secondary

              market pages and investor-profile pages show that outside interest existed, yet those pages do not change
              the fact

              that the company is no longer a standalone private startup. Public disclosure also remains thin on
              post-close

              operating economics, so there is no new underwriting case to make.


              For a diligence team, the most useful output is a post-close monitoring brief: keep an eye on product
              continuity,

              Google Cloud integration, and any evidence that Wiz’s multi-cloud posture weakens. The old valuation
              debate has

              ended; the new diligence question is integration quality.
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
