              - CE007
              - CE008
      - number: '5.2'
        title: How it deploys and differentiates
        blocks:
          - type: paragraph
            body: >-
              The technical differentiator is deployment friction. Wiz repeatedly emphasizes agentless scanning and
              read-only

              cloud access, which reduces rollout burden relative to heavyweight agents or sidecars. That helps explain
              why

              public references frame the product as both fast to deploy and enterprise-friendly. GitHub activity and
              CI/CD

              material show the company also wants credibility with developers, not just security operators.


              The second differentiator is context depth. Third-party reconstructions describe Wiz as a security graph,
              which is

              consistent with the company’s own language about shared context and with Google’s statement that Wiz
              strengthens

              code-to-cloud security. In other words, the moat is not a single feature. It is the amount of context the
              system

              can safely assemble and operationalize.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
      - number: '5.3'
        title: Trust, AI, and remaining roadmap risk
        blocks:
          - type: paragraph
            body: >-
              The product has also expanded into AI security. Google says Wiz now covers AI applications and agents,
              which keeps

              the platform relevant as cloud buyers move into model-based workflows. That matters because AI security is

              becoming a budget line in its own right, not just an add-on to classic cloud posture.


              Still, the product story is not free of risk. External coverage of a Wiz-found security hole and the
              existence of

              alternative-code-security pages show that the market expects continuous proof. After the Google
              acquisition, the

              remaining open question is roadmap priority: the public evidence supports strength today, but it is less
              clear how

              quickly Wiz’s platform will evolve inside Google’s broader security stack.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
