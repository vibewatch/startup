      - number: '3.2'
        title: Moat and substitute pressure
        blocks:
          - type: paragraph
            body: >-
              The public moat story is still the graph and the context layer. Google’s acquisition blog emphasizes code,
              cloud,

              runtime, and AI context, while Sacra and other market pages frame Wiz as a category benchmark. That
              suggests the

              real moat is not lock-in but the ability to normalize multi-cloud data, prioritize risk, and keep the
              product easy

              enough to adopt at enterprise scale.


              Substitute pressure remains real. Suite incumbents can bundle; hyperscalers can subsidize; open-source or
              DIY paths

              can satisfy control-oriented buyers; and niche tools can win narrow use cases. For underwriting, the
              question is not

              whether competition exists. It is whether Wiz’s context graph and brand strength are enough to keep
              conversion and

              retention strong against these substitute classes.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: What is still missing from the public record
        blocks:
          - type: paragraph
            body: >-
              The competitive record is still incomplete on one obvious point: there is no clean, current,
              product-by-product

              public benchmark that proves where Wiz wins on every workload or where it loses on price. That gap matters
              because

              pricing and suite consolidation are often decisive in cloud security. Reuters’ adverse security story also
              reminds

              the reader that reputation risk can move alongside category leadership.


              In other words, Wiz is still a strong competitive reference point, but the evidence set is now more about
              strategic

              positioning than about a neatly publishable feature matrix. That is a normal consequence of being acquired
              by a

              hyperscaler and of operating in a market where many vendors compete with overlapping claims.
