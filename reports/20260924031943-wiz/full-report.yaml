      - number: '2.2'
        title: Buyer segments and adoption triggers
        blocks:
          - type: paragraph
            body: >-
              Buyer demand appears to span security operations, cloud engineering, platform engineering, application
              security,

              and increasingly AI-security teams. AWS’s medical-center example and Omdia’s analyst framing both support
              the view

              that regulated, large-enterprise environments are the natural first buyers, because they feel the pain of
              cloud

              sprawl, compliance pressure, and cross-cloud complexity most acutely.


              Adoption is triggered less by generic awareness than by audit findings, migration initiatives, or an AI
              launch that

              suddenly exposes a new class of risk. Wiz’s own messaging about a normalizing layer and agentless
              deployment helps

              the buyer path, but the SecurityScientist Q&A pattern shows that customers still need education on
              implementation,

              trust, and value proof before the budget closes.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
