companyProfile:
  summary: |
    Wiz is a cloud security platform that connects code, cloud, runtime, and AI security into
    a single context layer for enterprise cloud estates. Public evidence shows broad adoption,
    agentless deployment, and strong multi-cloud positioning, but the company is now a Google
    Cloud asset, so the diligence question has shifted from standalone growth to post-close
    product continuity and roadmap priority.
