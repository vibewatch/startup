  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Wiz actually ships
        blocks:
          - type: paragraph
            body: >-
              Wiz’s own positioning is unusually consistent across sources: it wants to connect code, cloud, and runtime
              into a

              single context layer. That makes the product less like a point scanner and more like a risk graph that can
              be used

              by security, engineering, and platform teams. The Google acquisition blog reinforces that reading by
              describing

              the platform as a system for rapid mapping of architecture, permissions, data flows, and runtime behavior.


              The practical product implication is that the platform should be understood as workflow infrastructure. It
              is not

              just a dashboard. It is a way to normalize cloud context so that security teams can prioritize what
              matters before

              it reaches production.
            claimRefs:
              - CE001
              - CE002
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
