figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Wiz moved from stealth launch to Google Cloud acquisition while keeping its multi-cloud security positioning.
    data:
      items:
        - date: 2020-01
          label: Launch from stealth
          detail: Four cofounders launched Wiz after Adallom and Microsoft years.
          tone: positive
        - date: '2020'
          label: $100M Series A
          detail: Index, Sequoia, Insight, and Cyberstarts led the round.
          tone: positive
        - date: '2022'
          label: Fortune 100 traction
          detail: Public materials describe rapid enterprise adoption and scale.
          tone: positive
        - date: '2024'
          label: $1B funding round
          detail: Public financing lifted the company into the decacorn tier.
          tone: positive
        - date: '2025'
          label: $1B ARR milestone
          detail: Third-party revenue trackers put Wiz above $1B ARR before exit.
          tone: positive
        - date: 2026-03
          label: Google acquisition closes
          detail: Google completes the acquisition and retains the Wiz brand.
          tone: neutral
        - date: 2026-09
          label: Post-close status
          detail: Wiz is now a Google Cloud security brand with continued multi-cloud support.
          tone: neutral
        - date: 2026-09
          label: Public profile update
          detail: LinkedIn and startup databases still show a New York presence and large employee base.
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO006
      - CO008
      - CO009
      - CO012
