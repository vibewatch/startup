  title: Customers
  summary: Identify who pays/uses the product, the proof of real adoption, durability, expansion, and concentration risks.
sections:
- id: section-1
  title: Customer scale and segment mix
  body: 'The public customer story is one of the strongest parts of the Wiz record. Wiz says 65% of the Fortune 100 are

    customers, and its public about page also points to 5 million workloads protected and 230 billion files scanned

    daily. That is enough to conclude that the company reached enterprise-scale adoption before the Google deal.


    The customer mix looks broad rather than narrow. Named proof appears in enterprise, research, cloud, and partner

    contexts, which suggests that the product can land with both security and platform teams. That breadth matters

    because it supports the idea that Wiz is not a one-segment tool; it is a cloud-security platform with multiple

    adoption surfaces.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: section-2
  title: How adoption expands
  body: 'The public record points to a classic land-and-expand motion. Google Cloud, Drata, Saviynt, and WWT all frame Wiz

    as something that can sit inside a broader security ecosystem, which is a clue that partner-led distribution is

    important. The same ecosystem also hints that the most valuable account expansion probably comes from adding

    adjacent identity, workflow, and cloud-security modules rather than from a single one-off deployment.


    Public writeups such as Software Analyst’s are less authoritative than the case studies, but they still support the

    idea that Wiz scaled quickly inside larger accounts. The main gap is that none of the public materials disclose

    retention curves, contract duration, or top-account concentration, so expansion is visible while durability is not

    fully measured.'
  claimRefs:
  - CU004
  - CU007
  - CU008
  - CU011
  - CU012
- id: section-3
  title: What remains opaque
  body: 'The customer evidence is broad, but it is not complete. The company does not publicly disclose NRR, churn, contract

    length, or customer concentration. That means the reader can see demand and adoption but not fully measure

    durability. ScaleVP’s more skeptical framing helps keep that gap visible: even very strong logo and usage claims do

    not eliminate concentration risk.


    For a refresh report, the right conclusion is therefore balanced. Wiz has enough customer evidence to support

    enterprise relevance and partner-driven expansion, but not enough disclosure to eliminate retention and concentration

    questions. Those questions now matter even more because the company is inside Google Cloud.'
  claimRefs:
  - CU006
  - CU009
  - CU010
  - CU012
  tableRefs:
