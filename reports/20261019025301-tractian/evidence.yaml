evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics-disclosure
    missingEvidence: Current ARR, recognized revenue, gross margin, burn, runway, and revenue mix by product or geography.
    whyItMatters: >-
      Without current operating metrics, it is not possible to underwrite software-quality economics or assess how much
      of the valuation rests on still-unproven efficiency.
    diligencePath: >-
      Request board or investor materials with monthly revenue, gross margin, burn, and cash runway through the latest
      closed quarter.
  - type: missing-source
    severity: material
    topic: customer-denominator
    missingEvidence: >-
      A management-confirmed definition of customers versus manufacturers versus plants, with one current denominator
      used consistently across materials.
    whyItMatters: >-
      Scale claims affect sales efficiency, retention interpretation, and valuation comps, but the retained public
      signals are not directly comparable.
    diligencePath: >-
      Ask management for a current customer-count bridge that reconciles logos, plants, paying entities, and deployed
      monitored assets.
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board roster, post-Series C cap table, liquidation preferences, and investor-rights agreements.
    whyItMatters: >-
      Control rights, liquidation economics, and board composition materially affect downside protection, follow-on
      financing leverage, and founder-versus-investor control.
    diligencePath: >-
      Request charter documents, the latest cap table, board composition, and the Series C term sheet or investor-rights
      agreement.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A management-backed bottom-up TAM/SAM/SOM model with explicit plant, asset, and pricing denominators.
    whyItMatters: >-
      Public proxies show demand and traction but do not let an investor convert workflow relevance into a defendable
      revenue opportunity.
    diligencePath: >-
      Ask management for a cohort-based sizing bridge from target plants and asset counts to paid subscriptions,
      including attach rates and average pricing.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customer-definition
    missingEvidence: A precise definition of customer, manufacturer, facility, and monitored-asset counts used in external reporting.
    whyItMatters: >-
      Inconsistent units can overstate market reach, distort penetration estimates, and break any bottom-up SOM
      exercise.
    diligencePath: Reconcile every public scale metric to one denominator set and request a dated KPI glossary from management.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: budget-owner
    missingEvidence: Procurement evidence showing which function signs and funds the contract by segment.
    whyItMatters: >-
      Budget ownership affects sales-cycle length, required ROI proof, and the plausibility of expansion from pilot to
      multi-site deployment.
    diligencePath: >-
      Request anonymized customer procurement paths, including the sponsoring function, approver chain, and whether
      budgets came from maintenance, operations, or corporate digital teams.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-hardware-terms
    missingEvidence: >-
      Customer contracts or procurement records showing realized discounts, sensor rental terms, and implementation
      services pricing.
    whyItMatters: >-
      Public list prices and quote-led packaging do not show whether Tractian wins on total cost once hardware,
      deployment, and services are negotiated.
    diligencePath: Request current pricing sheets, sample order forms, and at least three recent customer contracts by segment.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: churn-win-loss-and-benchmarking
    missingEvidence: >-
      Independent win/loss data, churn rates, and third-party benchmarks on alert accuracy or ROI versus open-stack
      alternatives.
    whyItMatters: >-
      Moat durability depends on whether the bundled workflow keeps winning after buyers compare hardware lock-in,
      execution depth, and incumbent alternatives.
    diligencePath: >-
      Ask management for competitive displacement data, customer references that switched from named rivals, and any
      audited or third-party benchmark studies.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt obligations, and base-case runway after the 2024 Series C.
    whyItMatters: Without cash and burn data, the chapter cannot test capital adequacy or financing dependency.
    diligencePath: Request the latest board deck, cash reconciliation, debt schedule, and 12-month operating plan from management.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, churn, and NRR split by product line or cohort.
    whyItMatters: These metrics determine whether the installed-hardware model scales efficiently or simply grows volume.
    diligencePath: >-
      Request cohort retention, margin bridge, and sales-efficiency dashboards with definitions consistent across
      periods.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      A reconciled funding chronology explaining why retained third-party totals differ at $184 million versus $196
      million.
    whyItMatters: Capital-base inconsistencies weaken confidence in reported dilution, runway, and post-round capitalization.
    diligencePath: >-
      Reconcile the cap table and financing ledger against signed transaction documents and identify any secondary
      proceeds.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer-signal or practitioner-community evidence such as GitHub activity, package downloads, API forums,
      Stack Overflow discussions, or a comparable industrial practitioner proxy.
    whyItMatters: >-
      The chapter brief explicitly asks for developer-signal or the closest practitioner-community proxy to test whether
      the technical story travels beyond company-controlled channels.
    diligencePath: >-
      Request product telemetry on API or integration usage, public developer resources, or customer-community evidence;
      if none exists, document the absence and identify the nearest practitioner proxy.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Public proof of certifications, audit reports, penetration-testing disclosures, a status page, or documented
      incident response practices.
    whyItMatters: >-
      The assigned sources support privacy and governance language, but they do not independently establish security
      maturity or operational resilience for enterprise buyers.
    diligencePath: >-
      Obtain security-trust-center materials, certification letters, or customer-facing reliability documentation from
      management.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: private-evidence-only
    severity: material
    topic: model-quality
    missingEvidence: >-
      Independent validation of alert precision, false-positive rates, and diagnostic accuracy by asset class or
      deployment cohort.
    whyItMatters: >-
      Product breadth and scale are credible, but underwriting product defensibility and customer ROI still requires
      proof that model outputs are accurate enough to reduce manual review in production.
    diligencePath: >-
      Ask for customer cohort metrics, analyst-validation studies, or blinded before-and-after outcome data segmented by
      machine type and use case.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: private-evidence-only
    severity: minor
    topic: implementation-variability
    missingEvidence: >-
      Customer-level implementation timelines, sensor attach rates, and adoption metrics across different plant
      environments.
    whyItMatters: >-
      External evidence shows the architecture can work, but a single internal integration case and marketing timelines
      do not reveal typical time-to-value across customer fleets.
    diligencePath: >-
      Request implementation cohorts showing install duration, live-asset coverage, and user adoption by site and
      industry.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Public NRR, GRR, logo churn, renewal rates, contract duration, or cohort retention evidence for mature Tractian
      accounts.
    whyItMatters: >-
      Without durability metrics, the chapter can confirm adoption breadth but cannot separate sticky, expanding
      deployments from a large but economically uneven base.
    diligencePath: >-
      Request customer cohorts by start year, renewal and churn statistics, GRR/NRR, and at least three reference calls
      from accounts older than 24 months.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-and-channel-dependence
    missingEvidence: >-
      Top-customer share, top-partner contribution, channel versus direct mix, and ARR by customer segment, region, or
      vertical.
    whyItMatters: >-
      A 500-plus-customer count can still mask concentration or partner dependence that would materially change the
      quality of the revenue base.
    diligencePath: >-
      Ask management for top-10 account share, top-5 partner contribution, and ARR split by geography and vertical for
      the trailing twelve months.
  - type: stale
    severity: minor
    topic: customer-count-definition
    missingEvidence: >-
      A current 2026 management-defined denominator that reconciles customers, clients, manufacturers, and monitored
      plants.
    whyItMatters: >-
      The latest retained public figures are rounded and may double-count multi-site rollouts, which weakens
      comparability across vintages.
    diligencePath: >-
      Request a run-date reconciliation of logos, paying accounts, live plants, and monitored assets, with definitions
      used in investor materials.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-and-incident-record
    missingEvidence: >-
      Direct regulator, court, patent-office, enforcement, breach, outage, and certification records tied to Tractian
      and its operating entities.
    whyItMatters: >-
      The assigned pool cannot establish whether a material adverse event exists or confirm the completeness of the
      legal and regulatory risk register.
    diligencePath: >-
      Search the relevant official registries by each legal entity and obtain management's litigation, claims,
      regulatory-notice, outage, and incident schedules.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: model-performance
    missingEvidence: >-
      Independent precision, recall, false-positive, missed-failure, and avoided-downtime results segmented by asset
      type, customer, and deployment age.
    whyItMatters: >-
      Internal audits and customer feedback do not independently quantify whether the system is reliable enough for
      safety- and uptime-sensitive workflows.
    diligencePath: >-
      Run blind validation against maintenance outcomes and inspect model-monitoring, override, escalation, and
      supervised-analysis logs.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current assurance reports, penetration tests, subprocessor inventory, uptime history, recovery tests, and incident
      metrics.
    whyItMatters: >-
      Company policy statements do not independently demonstrate that controls protect sensitive industrial and personal
      data in production.
    diligencePath: >-
      Review the trust-center package under NDA, test contractual notification duties, and conduct customer
      security-reference calls.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Current cash, burn, runway, ARR, retention, hardware gross margin, implementation cost, support cost,
      working-capital needs, and customer concentration.
    whyItMatters: >-
      A funding-round valuation does not establish cash availability, operating efficiency, or the durability of a
      capital-intensive hardware-software model.
    diligencePath: >-
      Reconcile audited financials, bank balances, cap table, cohort retention, bill of materials, inventory turns, and
      deployment payback in the data room.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operating-disclosure
    missingEvidence: Current ARR, revenue growth, gross margin, NRR, burn, runway, and customer-cohort economics.
    whyItMatters: >-
      Without an operating dashboard, the latest reported valuation cannot be tested against software or industrial-tech
      underwriting standards.
    diligencePath: >-
      Request the latest board deck or finance KPI pack with monthly ARR bridge, gross-margin split, logo retention,
      NRR, and cash runway.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-seniority
    missingEvidence: >-
      Exact post-money shares, liquidation preferences, SAFE or option overhang, and any covenants or seniority tied to
      the 2026 financing.
    whyItMatters: >-
      Capital-stack detail can change realized entry economics even if the headline valuation and product narrative
      remain intact.
    diligencePath: >-
      Request the current cap table, preferred-stock term sheet, and documentation for the BNDES financing before
      setting an entry price.
    relatedQuestionRefs:
      - QV002
      - QV008
