      - number: '3.2'
        title: Capability, packaging, and buying criteria
        blocks:
          - type: paragraph
            body: >-
              The feature comparison is less about raw AI rhetoric than about where the system of record lives. Tractian
              claims a single workflow that moves from sensor data to diagnosis to work order, and it layers that on top
              of a proprietary sensor stack with multimodal inputs. By contrast, Fiix and MachineMetrics are described
              as more integration-led products that connect to broader controller or enterprise data environments, while
              Augury competes on diagnostics but not on owning a full native CMMS. Packaging matters because the public
              floor is not neutral: Tractian carries a five-user paid minimum before hardware, while many adjacent
              platforms either publish lower software-only entry points or keep pricing in custom-quote territory. For
              procurement teams, the question is therefore not "does this do predictive maintenance?" but "how much of
              the stack am I willing to buy from one vendor?"
            claimRefs:
