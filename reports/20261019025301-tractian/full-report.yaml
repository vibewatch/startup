      - number: '4.2'
        title: Public traction signals exist, but unit economics remain mostly private
        blocks:
          - type: paragraph
            body: >-
              Tractian publishes outcome-oriented operational proof, not investor-grade unit economics. Official pages
              emphasize MTBF, MTTR, PM compliance, work order throughput, offline mobile execution, and integration
              breadth, which is useful for understanding value delivery and deployment complexity. Multiples adds
              external commercial proof by describing more than 500 customers, presence in more than 1,000 plants, and
              customer claims of 6-12x ROI with around $6,000 annual savings per monitored machine. Those datapoints
              help frame buyer value and expansion potential, but they still do not disclose gross margin, CAC, payback,
              NRR, churn, or working-capital intensity. A low-tier newsletter further claims revenue doubled in 2024 and
              headcount would rise from 280 to 400+, yet that growth signal is not corroborated by higher-tier retained
              sources.
