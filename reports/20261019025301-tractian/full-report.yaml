      - number: '2.2'
        title: Evidence-constrained sizing and what remains unsupported
        blocks:
          - type: paragraph
            body: >-
              Public sources support the problem severity and the company’s current wedge better than they support a
              classic spend-based TAM model. The strongest external demand proxy in this pool is the claim that U.S.
              manufacturers lose an estimated $50 billion each year to unplanned downtime, which supports budget urgency
              but does not by itself size Tractian’s addressable software spend. Third-party sources also provide
              operating-footprint proxies — facilities monitored, equipment covered, and manufacturers served — but
              those units are not interchangeable. As a result, the market is evidently meaningful, yet public evidence
              still falls short of a clean TAM/SAM/SOM bridge that an investor could underwrite without management
              clarification.
            claimRefs:
