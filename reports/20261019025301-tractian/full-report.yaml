              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, privacy, and AI-accountability risk
        blocks:
          - type: paragraph
            body: >-
              Tractian's own documents define a broad legal and data-governance surface. The platform may process
              confidential industrial information and personal data, and the privacy policy lists operating entities in
              the United States, Brazil, Mexico, and Ireland while assigning controller, joint-controller, or processor
              roles by context. The policy also permits subprocessors and international transfers subject to stated
              safeguards. These disclosures are appropriate starting controls, not proof of compliance effectiveness.
              The terms place technical decisions and input quality with customers, state that AI supports rather than
              replaces professional judgment, and warn that opting out of anonymized model improvement may reduce
              accuracy or functionality. A serious diligence process should test whether those allocations, security
              commitments, and customer consent mechanisms work in production and whether contract indemnities match the
              operational consequences of a missed or incorrect maintenance recommendation.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
