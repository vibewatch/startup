  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segmentation
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "other predictive maintenance startups." Public 2026
              comparisons show at least four ways buyers can solve the same maintenance job: Tractian's own integrated
              hardware-plus-software approach, software-first CMMS platforms such as MaintainX and Fiix, machine-health
              specialists such as Augury, and enterprise or factory-data incumbents such as IBM Maximo and
              MachineMetrics. Tractian's own positioning and third-party reviews converge on the same core distinction:
              it is strongest when the buyer wants one vendor to own sensing, diagnosis, and execution, rather than
              stitching together separate sensors, analytics, and work management layers. That leaves an obvious flank,
              however, because buyers that already trust plant controllers, PLC data, or existing EAM workflows can
              reach a similar outcome with more modular tooling and fewer proprietary dependencies.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
