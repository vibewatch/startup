      - number: '5.3'
        title: Differentiation, trust surface, and product risks
        blocks:
          - type: paragraph
            body: >-
              Tractian's main differentiation is integration depth: one stack spanning multimodal sensing, diagnosis,
              and maintenance execution, with recent public positioning emphasizing specific failure modes, recommended
              fixes, and support for existing enterprise systems. That said, some important diligence points remain
              unresolved in public evidence. Limble's external comparison says implementation takes longer because
              hardware must be installed and configured, which means time-to-value likely varies with plant complexity
              and asset coverage. The assigned evidence set also shows a narrow public trust surface: a June 2026
              privacy policy clearly defines legal entities, controller-versus-processor roles, and the platform's
              operating scope, but the pool does not include public proof of security certifications, a public status
              page, or independent model-accuracy benchmarks. As a result, the technical story is credible on product
              breadth and scale, but still incomplete on security assurance and externally verified performance.
            claimRefs:
              - CE010
