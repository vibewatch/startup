          - type: callout
            title: Capital adequacy cannot be underwritten from public evidence
            body: >-
              The round size and valuation are visible, but cash balance, burn, runway, and even cumulative funding
              totals remain either undisclosed or inconsistent across retained sources.
            calloutType: risk
            claimRefs:
