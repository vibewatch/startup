      - number: '3.3'
        title: Durability, switching costs, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Tractian's moat is real but conditional. Its bundled model should be durable in mid-market industrial
              sites that value fast deployment, unified accountability, and sensor-to-work-order execution more than
              stack flexibility. The same design also concentrates competitive risk: reviewers repeatedly frame Tractian
              as a closed ecosystem, and even supportive commentary describes it as a premium solution whose ROI is less
              immediate for small shops or hard-to-connect remote sites. Trust posture helps at the margin — the company
              now states that customer asset or industrial-process data is not used to train AI models unless
              irreversibly anonymized — but the public evidence still stops short of showing churn, win/loss, or
              independently benchmarked accuracy data. That means the strategic debate is not whether Tractian has
              differentiated product design; it is whether that product design remains superior after buyers price in
              hardware dependence, platform depth tradeoffs, and incumbent response.
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Tractian's moat is workflow ownership, not just better anomaly detection
            body: >-
              Public sources repeatedly differentiate Tractian by bundling sensors, diagnosis, and work execution; the
              moat is strongest where plants value that operational closure more than tooling flexibility.
            calloutType: strength
