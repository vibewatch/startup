      - number: '4.3'
        title: Funding scale is real, but burn and runway are still unverified
        blocks:
          - type: paragraph
            body: >-
              The capital story is directionally positive but incomplete. Multiples reports a $120 million Series C in
              December 2024 at a $720 million valuation and says proceeds were earmarked for R&D, market expansion, new
              hardware and software development, and a Monterrey customer support office. That supports the view that
              the company is financing continued product and go-to-market expansion rather than operating as a
              lightweight pure-software vendor. However, public underwriting still stops short because no retained
              source discloses current cash on hand, monthly burn, debt covenants, runway, or hardware inventory
              requirements, and even the cumulative funding base is inconsistent across retained third-party sources at
              $184 million versus $196 million. The privacy policy's multi-entity structure and processor/controller
              responsibilities also imply compliance, support, and data-governance overhead that public sources do not
              quantify.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI011
      - number: '4.4'
        title: Revenue quality is plausible; underwriting evidence is not yet sufficient
        blocks:
          - type: paragraph
            body: >-
              Financially, Tractian looks more credible as a revenue engine than as a fully underwritable private
              company. The model appears sticky because it combines installed hardware, workflow software, expert
              services, and system integrations that can deepen over time inside a plant network. At the same time, the
              public evidence base remains too shallow to judge margin path, payback, or capital efficiency with
              precision. The absence of verified realized pricing, gross margin, CAC, NRR, and runway means the core
              diligence question is not whether Tractian has commercial traction, but whether that traction converts
              into durable, efficiently scaled, cash-generative growth. Until management provides audited or board-level
              evidence on those metrics, Financials should be treated as supportive but incomplete.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
