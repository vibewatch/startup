  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Tractian consistently presents the product as a closed-loop maintenance system rather than a single
              monitoring tool. Official 2026 product explainers describe a workflow in which wireless sensors capture
              equipment condition, AI diagnostics classify likely failure modes, and the platform generates work orders
              with context, procedures, and mobile execution. That positioning is directionally corroborated by external
              materials: TECHNIA describes Tractian as unifying vibration sensors, AI-powered condition monitoring,
              CMMS, and OEE in one connected platform, while Limble's comparison says Tractian behaves more like an
              AI-powered condition-monitoring ecosystem than a standard CMMS. The practical implication is that
              Tractian's value proposition depends on both hardware deployment and downstream workflow adoption, not
              just analytics quality.
