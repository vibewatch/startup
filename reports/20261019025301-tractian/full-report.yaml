  - id: FE001
    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
      Public sources show Tractian as a layered stack from multimodal sensing through AI inference into workflow
      execution and governance.
    data:
      layers:
        - label: Sensing and asset context
          detail: Installed hardware captures machine-condition inputs at the edge.
          items:
            - Smart Trac Ultra wireless sensing
            - Vibration, temperature, ultrasound, runtime, and RPM inputs
            - Recent public positioning also adds magnetic-field or electrical-signal coverage
          outputs:
            - Continuous condition data and anomaly triggers
        - label: Analytics and model layer
          detail: Signal processing and training stack described in public case studies.
          items:
            - FFT-based signal processing
            - 3.5 billion collected sensor samples
            - Domain-specific and multimodal physical-AI models
          outputs:
            - Failure detection and classified machine-health insights
        - label: Inference and workflow execution
          detail: Diagnostics are translated into actions for planners and technicians.
          items:
            - 50 specialized agents and large-scale inference serving
            - Automatic work-order generation with diagnostics and severity
            - Mobile and offline execution for plant-floor technicians
          outputs:
            - Recommended fixes, procedures, and documented maintenance actions
        - label: Enterprise integration
          detail: Enterprise-system links connect diagnostics to existing operating systems.
          items:
            - CMMS and ERP integrations including SAP, Maximo, UpKeep, Limble, Excel, and NetSuite
            - PLM-to-ERP synchronization in Tractian's internal 3DEXPERIENCE to SAP Business One deployment
          outputs:
            - Closed-loop operating workflow inside existing maintenance systems
        - label: Governance and support controls
          detail: Public trust surface and human-support layer are thinner than the workflow stack.
          items:
            - Global privacy policy with controller and processor role definitions
            - Supervised analysis escalation to vibration experts
          outputs:
            - Defined but still lightly evidenced trust and assurance layer
        - label: Implementation enablement
          detail: Adoption depends on hardware rollout and service support in customer plants.
          items:
            - Hardware installation and configuration
            - Customer success and implementation support
          outputs:
            - Time-to-value varies with plant complexity and deployment scope
    approximationNotes: >-
      The stack reflects only what the assigned public sources explicitly support; security and performance-control
      layers remain incomplete in public evidence.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence portrays a reliability-led industrial buying motion that expands from sensor rollout into
      technician workflows, manager dashboards, and multi-site adoption, with implementation friction as the main drag.
    data:
      items:
        - label: Reliability-led evaluation
          actor: Reliability engineer / maintenance lead
          phase: Land
          tone: neutral
          touchpoints:
            - Uptime-critical assets and expensive downtime frame the problem
            - Tractian is positioned against predictive-maintenance and reporting alternatives
        - label: Sensor and platform rollout
          actor: Tractian implementation team + plant stakeholders
          phase: Deploy
          tone: neutral
          touchpoints:
            - Wireless sensors are installed on critical equipment
            - Official materials claim initial asset coverage in 30-60 days
        - label: Technician execution
          actor: Technician / maintenance team
          phase: Use
          tone: positive
          touchpoints:
            - Mobile work orders and AI-generated SOPs reach the plant floor
            - Offline execution is part of the daily workflow story
        - label: Manager visibility
          actor: Plant manager / operations leader
          phase: Prove
          tone: positive
          touchpoints:
            - Live KPI dashboards surface MTTR, backlog, and completion data
            - Production and OEE visibility extend the pitch beyond maintenance alone
        - label: Expansion loop
          actor: Multi-site reliability organization
          phase: Expand
          tone: positive
          touchpoints:
            - Multi-site management and broader module adoption are central upsell levers
            - Public scale claims cite more than 1,000 plants and more than 500 customers
        - label: Friction and durability check
          actor: Operations leader / procurement owner
          phase: Underwrite
          tone: risk
          touchpoints:
            - Hardware installation and training can slow implementation
            - Public sources still do not disclose NRR, churn, renewals, or concentration
    approximationNotes: >-
      This is a synthesized journey based on repeated public adoption patterns in the assigned pool, not a published
      funnel with conversion rates.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU009
      - CU011
      - CU014
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      The analyst-assigned matrix concentrates the most material residual exposure in model and workflow performance,
      data security, and opaque unit economics.
    data:
      columns:
        - label: Likelihood
          note: Qualitative probability based on the retained evidence.
        - label: Impact
          note: Potential effect on safety, customers, or investment returns.
        - label: Residual exposure
          note: Net risk after controls visible in the assigned pool.
      rows:
        - label: Model and workflow performance
          note: False positives, missed failures, and incomplete action loops can erase expected value.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: risk
            - label: High
              tone: risk
        - label: Security and privacy assurance
          note: Sensitive industrial and personal data cross entities and service providers.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: risk
            - label: Medium-high
              tone: risk
        - label: Deployment and technician adoption
          note: Value depends on data quality, specialist work, and completed work orders.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: risk
            - label: High
              tone: risk
        - label: Connectivity and integration
          note: Cellular networks and external systems sit outside Tractian's full control.
          values:
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: warning
            - label: Medium
              tone: warning
        - label: Proprietary-stack switching friction
          note: Integrated sensors and software can increase replacement cost after rollout.
          values:
            - label: High
              tone: risk
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: warning
        - label: Financial-model opacity
          note: Valuation is reported, while cash, burn, margin, and retention remain unquantified.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: risk
            - label: High
              tone: risk
