        title: Exhibits
        blocks:
          - type: callout
            title: Market proof is workflow-centric, not denominator-clean
            body: >-
              The pool is strong on workflow definition and problem urgency, but weak on investor-grade market sizing.
              Management diligence should ask Tractian to reconcile customers, manufacturers, facilities, assets, and
              paid subscriptions into one bottom-up model.
            calloutType: insight
            claimRefs:
