      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated workflow is the clearest product advantage
            body: >-
              The most credible part of Tractian's technical story is the closed loop from sensing to diagnosis to
              work-order execution; that integration appears in official product pages and is echoed by external partner
              materials.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE011
          - type: callout
            title: Public trust and validation evidence is still narrow
            body: >-
              The assigned evidence set supports privacy/governance language and operational scale, but it does not
              independently verify security certifications, incident transparency, or model-quality metrics across
              deployments.
            calloutType: risk
