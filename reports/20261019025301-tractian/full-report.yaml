              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture and investment implication
        blocks:
          - type: paragraph
            body: >-
              The most consequential risk is not a confirmed lawsuit, breach, or outage in the assigned evidence; it is
              failure of the combined detection-to-action workflow. TechCrunch reported the sector-level cost of high
              false-positive rates, while Tractian says customers commonly verify alerts manually and that its own
              models are internally audited and validated through client feedback. Those controls are directionally
              useful, but they are not an independent accuracy benchmark. The second cluster is data and security
              exposure because the platform handles operational and personal data across several jurisdictions. The
              third is deployment dependency: cellular sensors, third-party integrations, specialized maintenance
              skills, and proprietary hardware all have to work together. Investment underwriting should therefore
              remain conditional on independent model-performance, security-assurance, implementation, and financial
              evidence rather than on the absence of a disclosed adverse event.
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
