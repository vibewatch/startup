  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than a generic “industrial AI” label and broader than a standalone
              vibration-monitoring tool. Across Tractian’s own guides and independent reviews, the core job-to-be-done
              is connecting machine-condition data to prioritized maintenance action, which means the addressable
              workflow includes wireless sensing, diagnostic analytics, and work-order execution. That boundary matters
              because it separates Tractian from pure dashboards on one side and full enterprise asset management suites
              on the other. The closest status-quo substitute is still a disconnected stack: condition alerts in one
              system, technician workflows in another, and manual interpretation in between.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
