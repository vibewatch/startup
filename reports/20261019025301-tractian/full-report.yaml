chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Official current sources make Tractian straightforward to place at the product level even if some
              corporate descriptors remain softer. The about page says Tractian is an Atlanta-based company built to
              eliminate industrial downtime, the homepage calls it the only end-to-end platform to monitor machine
              health, protect assets, and mitigate risk, and the privacy policy defines the business as an industrial
              asset monitoring, maintenance management, reliability, and operational intelligence platform. Taken
              together, those sources support treating Tractian as a vertically integrated industrial maintenance
              platform rather than a standalone sensor vendor or a generic CMMS.


              The same official pool also shows a broader footprint than one U.S. headquarters line would imply. The
              privacy policy lists operating entities in Atlanta, Sao Paulo, Mexico City, and Dublin, while Multiples
              describes the company as founded in 2019 and still privately held. What remains weaker is the exact
              current scale definition: Tractian's homepage uses manufacturers rather than customers, and the retained
              official pages do not disclose current revenue, margin, or runway.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO010
              - CO011
