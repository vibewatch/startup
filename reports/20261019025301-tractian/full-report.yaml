      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The assigned pool clearly identifies Igor Marinelli as the central operator. Tractian's own about page
              presents him as CEO and founder, and the 2023 Series B announcement expands that biography by tying the
              company story to Marinelli's background as a Berkeley-trained computer engineer whose father's work in
              maintenance shaped the original problem statement. Multiples adds Gabriel Lameirinhas as co-founder, which
              is enough to describe a founder-led company even though the retained official pages do not publish a full
              executive roster or current board list.


              That disclosure gap matters because capital formation is visible, but control is not. The assigned sources
              name Sapphire Ventures, General Catalyst, Next47/N47, Y Combinator, and DGF as important backers across
              rounds, yet none of the retained sources publish a current board roster, investor-rights package, or the
              Series C preference stack. For diligence, that means founder-market fit is easier to establish than
              present governance and decision rights.
            claimRefs:
              - CO003
              - CO004
              - CO015
