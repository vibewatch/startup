      - number: '1.3'
        title: Funding, scale, and public metric confidence
        blocks:
          - type: paragraph
            body: >-
              Funding history is the clearest quantified part of the overview. Multiples reports a $120 million Series C
              in December 2024 at a $720 million valuation and $184 million total funding across five rounds, while
              Tractian's own 2023 release documents the prior $45 million Series B led by General Catalyst and says the
              business had already reached more than 1,000 industrial plants. Those figures make Tractian look like a
              late-stage private industrial software-and-hardware company with a real financing history, not an early
              concept-stage asset.


              The harder part is current operating scale. Tractian's homepage now says it is trusted by 2,000
              manufacturers, but Forbes' April 2024 profile used a different denominator - more than 500 industrial
              clients - and the Series B announcement used plants rather than customers. Those claims can all be
              directionally positive without being interchangeable. The same ambiguity applies to economics: the
              assigned public pool does not disclose current ARR, NRR, gross margin, burn, or runway, and even headcount
              is only pinned historically at 200 employees in Forbes' April 2024 snapshot.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones and downside signals
        blocks:
          - type: paragraph
            body: >-
              The milestone chronology supports a company that kept adding capital, product scope, and geographic
              formality from 2019 through 2026. Multiples traces the path from pre-seed and seed capital to a 2022
              Series A, the official 2023 Series B announcement ties financing to 1,000-plant deployment and an
              AI-Assisted Maintenance launch, and the 2026 privacy policy shows a more formal multi-entity structure
              spanning the U.S., Brazil, Mexico, and Ireland. That is enough to build a dated timeline without inventing
              missing corporate-history details.


              The best downside evidence in the assigned pool is executional rather than legal. Limble's 2026 comparison
              says Tractian is stronger as an AI-powered condition-monitoring ecosystem than as an intuitive day-to-day
              CMMS, while Coast argues the product asks buyers to accept a high per-user minimum and meaningful hardware
              dependence. Those critiques do not disprove product-market fit, but they matter because they help explain
              why raw deployment metrics should not be read as proof that Tractian is equally attractive across every
              maintenance workflow or customer segment.
            claimRefs:
              - CO007
              - CO012
              - CO013
              - CO014
              - CO016
