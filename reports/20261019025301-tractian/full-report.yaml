  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Integrated revenue stack with opaque realized pricing
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence points to Tractian monetizing an integrated reliability stack rather than a
              single-seat SaaS tool. Official product pages describe Smart Trac Ultra sensors feeding an AI maintenance
              platform that automatically generates work orders and surfaces KPI dashboards, while Multiples describes a
              subscription revenue model layered onto hardware and services. That mix can support recurring software
              revenue and expansion through broader plant coverage, but the public package is still thin on the details
              that matter for revenue quality: retained Tractian pages do not disclose list prices, contract terms,
              discounting, or revenue-recognition treatment, and the only packaging cue in the pool comes from a
              competitor comparison that says Tractian organizes plans around specific maintenance concerns and
              processes.
