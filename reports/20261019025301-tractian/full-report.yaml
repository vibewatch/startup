      - number: '2.3'
        title: Buyer, user, and budget path
        blocks:
          - type: paragraph
            body: >-
              The recurring buyer persona is not a central CIO team but plant reliability, maintenance, and operations
              leadership inside asset-heavy manufacturing sites. Independent reviews describe Tractian as a fit for
              reliability engineers, maintenance managers, and industrial operations leaders, while the company’s own
              materials frame the workflow around technicians receiving machine-specific diagnoses and work orders on
              the plant floor. That makes the adoption path operational rather than purely IT-led: prove reduced
              downtime on critical rotating assets, show that technicians can act on the system’s prescriptions, and
              then expand coverage across more assets or sites. The economic owner is therefore most likely the
              maintenance or plant-operations budget, sometimes alongside digital-transformation sponsors when
              integrations matter.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary adoption driver is the promise to close the “alert-to-action” gap that makes many
              predictive-maintenance programs stall before delivering ROI. Tractian’s materials repeatedly emphasize
              automated work-order creation, embedded diagnostic context, and fewer false positives, while independent
              reviewers echo fast deployment and an integrated hardware-plus-software bundle as the company’s edge for
              mid-market manufacturers. The same sources also define the main constraints: pricing is not transparently
              published, hardware and implementation add friction relative to software-only CMMS tools, and companies
              already standardized on SAP PM, Maximo, or sensor-agnostic APM stacks may evaluate Tractian as a layer to
              integrate rather than a full-system replacement.
            claimRefs:
              - CM007
              - CM012
              - CM014
