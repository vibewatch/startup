chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              官方现有来源足以界定 Tractian 的产品定位，尽管部分公司描述仍较宽泛。关于页面称其总部在
              Atlanta，目标是消除工业停机；首页称其为监测机器健康、保护资产并降低风险的端到端平台；隐私政策则将其定义为工业资产监测、维护管理、可靠性与运营智能平台。综合来看，Tractian
              更像垂直整合的工业维护平台，而不是单一传感器供应商或通用 CMMS。


              同一批官方材料显示，其足迹比单一美国总部信息所暗示的更广。隐私政策列出 Atlanta、Sao Paulo、Mexico City 和 Dublin 的运营实体；Multiples 称公司成立于 2019
              年且仍为非上市公司。较弱之处在于当前规模的定义：Tractian 首页使用“制造商”而非“客户”，保留的官方页面也未披露当前收入、利润率或 runway。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO010
              - CO011
