        - 留存证据中没有 Tractian 式专有传感器捆绑包
        - 商业灵活性取决于范围和现有工厂基础设施
    notes: 公开价格不可直接横向比较。起价来自留存的 2026 年对比页面；“定制报价”表示来源池没有包含可支持的公开标价。
