            title: 带来粘性的捆绑也缩小了愿意购买的客户范围
            body: 竞争对手撰写的对比将专有硬件、CMMS 深度取舍和价格门槛列为买方转向更模块化或软件优先替代方案的主要原因。
            calloutType: risk
