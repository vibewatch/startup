      - number: '2.3'
        title: 买方、用户与预算路径
        blocks:
          - type: paragraph
            body: >-
              典型买方不是中央 CIO 团队，而是重资产制造现场的工厂可靠性、维护和运营负责人。独立评论认为 Tractian
              适合可靠性工程师、维护经理和工业运营负责人；公司材料则围绕技师在现场接收设备专属诊断和工单来描述工作流。因此采用路径偏运营而非纯
              IT：先证明关键旋转设备停机减少，再证明技师能按系统建议行动，之后扩展到更多设备或工厂。经济预算最可能来自维护或工厂运营，有集成需求时也可能由数字化转型赞助人共同承担。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              主要采用驱动是填补“告警到行动”的断点，许多预测性维护项目正是在交付 ROI 前卡住。Tractian
              反复强调自动生成工单、内嵌诊断上下文和减少误报；独立评论也将快速部署及软硬件一体化视为其服务中型制造商的优势。约束同样明确：价格未透明公布，相比纯软件 CMMS，硬件和实施增加摩擦；已经标准化使用 SAP
              PM、Maximo 或与传感器无关的 APM 栈的公司，可能把 Tractian 当作待集成的一层，而非整套替换。
            claimRefs:
              - CM007
              - CM012
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
