      - number: '2.2'
        title: 受证据约束的市场规模与未获支持部分
        blocks:
          - type: paragraph
            body: >-
              公开来源更能证明问题严重性和公司的切入点，而不是经典的支出型 TAM。指定来源中最强的外部需求代理，是据称美国制造商每年因非计划停机损失估计 $50 billion。这能说明预算紧迫性，却不能单独测算
              Tractian 可服务的软件支出。第三方来源还提供了监测设施、覆盖设备和服务制造商等运营足迹代理，但这些单位不能互换。因此市场显然有意义，公开证据却仍不足以让投资人无需管理层澄清就把 TAM/SAM/SOM
              纳入投资判断。
            claimRefs:
              - CM008
