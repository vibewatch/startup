        - 每位用户每月 $60，最低 5 位用户；Enterprise 起价 $100，最低 10 位用户
        - 状态监测硬件位于 Bundle 套餐
        - 加入传感器前的入门门槛更高；适合接受捆绑栈的买方
      - - MaintainX
        - 基础版 / 核心版 / 高级版 / 企业版
        - 免费层；留存对比中付费方案每位用户每月起价 $20 或 $65
        - 留存证据显示为纯软件
        - 优先推动工作流采用的团队，试点阻力更低
      - - Fiix
        - 免费版 / 基础版 / 专业版 / 企业版
        - 免费层；Basic 每位用户每月起价 $45
        - 留存证据显示与传感器无关
        - 对已有监测基础设施的买方，经济模式更模块化
      - - Limble
        - 定制定价
        - 定制报价
        - 支持自有入门传感器套件及第三方集成
        - 尽管定位偏软件优先，商业模式仍以报价为主
      - - Augury
        - 企业定制定价
        - 定制报价
        - 封闭式硬件与服务模式
