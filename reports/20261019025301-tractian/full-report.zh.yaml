  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与分层
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不止“其他预测性维护初创公司”。2026 年公开对比至少显示四种解决同一维护任务的方式：Tractian 自有的软硬件一体化方案、MaintainX 和 Fiix 等软件优先 CMMS、Augury
              等机器健康专家，以及 IBM Maximo 和 MachineMetrics 等企业或工厂数据老牌系统。Tractian
              定位和第三方评论都强调同一差异：当买方希望一个供应商同时负责感知、诊断和执行，而不是拼接传感器、分析和工作管理层时，它最强。但这也留下侧翼：已经信任工厂控制器、PLC 数据或既有 EAM
              工作流的买方，可用更模块化、专有依赖更少的工具取得类似结果。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
