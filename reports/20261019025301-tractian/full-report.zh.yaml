      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 对价格敏感的判断
            body: >-
              公开证据足以让 Tractian 留在尽调名单中，却不完整到不足以支持买入建议。下一道决策门槛是私下披露，而不是又一个公开标题：在给出超出“未知”的估值判断前，必须审阅 ARR、利润率、留存、股权结构表优先权及
              2026 年融资条款。
            calloutType: recommendation
            claimRefs:
