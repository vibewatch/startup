              指定证据中最重要的风险不是已确认的诉讼、泄露或中断，而是检测到行动的闭环失效。TechCrunch 报道了高误报率的行业成本；Tractian
              称客户通常会人工核验告警，自己的模型也经过内部审计和客户反馈验证。这些控制方向正确，却不是独立准确率基准。第二类风险是数据与安全暴露，平台在多个司法辖区处理运营及个人数据。第三类是部署依赖：蜂窝传感器、第三方集成、专业维护技能和专有硬件必须共同正常工作。因此，投资承销应以独立模型表现、安全保障、实施和财务证据为条件，而不能只看是否没有披露不利事件。
