  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场比泛化的“工业 AI”更窄，却比单一振动监测工具更宽。Tractian
              自有指南和独立评论都指向同一核心任务：把机器状态数据接到优先级明确的维护行动上，因此可服务工作流包括无线感知、诊断分析和工单执行。这一区分将 Tractian
              与纯仪表盘及完整企业资产管理套件分开。最接近的现状替代仍是割裂的技术栈：一个系统发状态告警，另一个承载技师工作流，中间靠人工解读。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
