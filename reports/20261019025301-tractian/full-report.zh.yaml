      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              正向论点建立在产品集成和融资证明上。Tractian 材料展示了从状态监测到工单执行的闭环，公司称拥有 200+ 名工程师的研发团队，并在 2024 年申请 12 项专利。这些信息加上大型财团领投的 Series
              C，说明公司打造了差异化工业软硬件栈，成熟投资人相信其可扩张。反向论点是，公开验证比融资标题更浅：最新估值仍是第三方标记而非公司确认数字；独立评论称规模化后价格可能昂贵；公司也承认维护团队仍会人工核验许多告警。判断因此是，质量信号真实，但把质量转化为价格确信所需的证据仍缺失。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: 情景、下行触发因素与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景区间应围绕披露质量，而不是精确的点估计。乐观情景需要证明 Tractian 能把一体化产品转化为持久的企业经济性，即披露 ARR 增长、利润率、留存，并证明最新资本基础是在放大产品和 go-to-market
              杠杆，而不是填补融资缺口。基准情景只有在管理层核实当前经营指标包、并说明 2026 年 BNDES 融资如何与 2024 年 Series C
              并存时，才支持耐心跟踪。若商业化摩擦持续、自动化需要超预期的人工核验，或资本栈含有公开材料看不见的稀释或优先权负担，悲观情景更可能。眼下尽调要求很直接：运营仪表盘、完整股权表、债务或融资契约，以及与实际 ROI
              挂钩而非营销宣称的客户 cohort 证明。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV003
