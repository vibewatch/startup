            body: >-
              从财务角度看，Tractian
              作为收入引擎比作为完全可承销的非上市公司更可信。其模式似乎有粘性，因为已安装硬件、工作流软件、专家服务和系统集成可以在工厂网络内持续加深。但公开证据仍太薄，无法精确判断利润率路径、回本期或资本效率。缺少经核实的实际定价、毛利率、CAC、NRR
              和 runway，核心尽调问题不是 Tractian 是否有商业 traction，而是 traction
