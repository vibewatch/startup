        - label: 推理与工作流执行
          detail: 诊断结果被转化为规划人员和技术人员可执行的行动。
          items:
            - 50 个专用代理及大规模推理服务
            - 自动生成带诊断和严重程度的工单
            - 为工厂现场技术人员提供移动端和离线执行
          outputs:
            - 建议修复方案、操作程序和记录在案的维护行动
        - label: 企业集成
          detail: 企业系统连接将诊断结果接入现有运营系统。
          items:
            - CMMS 和 ERP 集成，包括 SAP、Maximo、UpKeep、Limble、Excel 和 NetSuite
            - Tractian 内部 3DEXPERIENCE 到 SAP Business One 部署中的 PLM 到 ERP 同步
          outputs:
            - 现有维护系统内的闭环运营工作流
        - label: 治理与支持控制
          detail: 公开可见的信任面和人工支持层薄于工作流技术栈。
          items:
            - 明确定义控制者和处理者角色的全球隐私政策
            - 将受监督的分析升级交由振动专家处理
          outputs:
            - 已定义但公开证据仍较少的信任与保障层
        - label: 实施支持
          detail: 采用取决于客户工厂的硬件铺设和服务支持。
          items:
            - 硬件安装与配置
            - 客户成功和实施支持
          outputs:
            - 价值实现时间随工厂复杂度和部署范围而变化
    approximationNotes: 该技术栈仅反映当前指定公开来源明确支持的内容；安全和性能控制层的公开证据仍不完整。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据描绘了一条以可靠性为核心的工业采购路径：从传感器铺设扩展到技术人员工作流、管理层仪表盘和多站点采用，实施阻力是主要拖累。
    data:
      items:
        - label: 以可靠性为核心的评估
          actor: 可靠性工程师 / 维护负责人
          phase: 获取客户
          tone: neutral
          touchpoints:
            - 对正常运行时间关键的资产和高昂停机成本界定了问题
            - Tractian 被置于预测性维护和报告类替代方案的竞争中
        - label: 传感器与平台铺设
          actor: Tractian 实施团队 + 工厂利益相关方
          phase: 部署
          tone: neutral
          touchpoints:
            - 在关键设备上安装无线传感器
            - 官方材料称初始资产覆盖可在 30-60 天内完成
        - label: 技术人员执行
          actor: 技术人员 / 维护团队
          phase: 使用
          tone: positive
          touchpoints:
            - 移动工单和 AI 生成的 SOP 触达工厂现场
            - 离线执行是日常工作流的一部分
        - label: 管理层可见性
          actor: 工厂经理 / 运营负责人
          phase: 验证
          tone: positive
          touchpoints:
            - 实时 KPI 仪表盘展示 MTTR、积压和完成数据
            - 生产和 OEE 可见性将卖点从维护扩展到更广的运营领域
        - label: 扩张循环
          actor: 多站点可靠性组织
          phase: 扩张
          tone: positive
          touchpoints:
            - 多站点管理和更广泛的模块采用是核心增购杠杆
            - 公开规模口径称覆盖超过 1,000 座工厂和超过 500 个客户
        - label: 阻力与持久性检查
          actor: 运营负责人 / 采购负责人
          phase: 评估
          tone: risk
          touchpoints:
            - 硬件安装和培训可能拖慢实施
            - 公开来源仍未披露 NRR、流失率、续约率或客户集中度
    approximationNotes: 这是根据当前证据池反复出现的公开采用模式综合出的旅程，不是带有转化率的已发布漏斗。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU009
      - CU011
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 分析师指定的矩阵显示，最重大的剩余风险集中在模型与工作流表现、数据安全和不透明的单位经济性上。
    data:
      columns:
        - label: 可能性
          note: 基于保留证据的定性概率。
        - label: 影响
          note: 对安全、客户或投资回报的潜在影响。
        - label: 剩余风险暴露
          note: 当前证据池中可见控制措施之后的净风险。
      rows:
        - label: 模型与工作流表现
          note: 误报、漏检和不完整的行动闭环可能抹去预期价值。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 高
              tone: risk
        - label: 安全与隐私保障
          note: 敏感的工业数据和个人数据会跨越不同实体及服务提供商。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 中高
              tone: risk
        - label: 部署与技术人员采用
          note: 价值取决于数据质量、专业工作和已完成的工单。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: risk
            - label: 高
              tone: risk
        - label: 连接与集成
          note: 蜂窝网络和外部系统不在 Tractian 的完全控制范围内。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: warning
        - label: 专有技术栈切换阻力
          note: 集成后的传感器和软件可能在铺设后提高替换成本。
          values:
            - label: 高
              tone: risk
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
        - label: 财务模型不透明
          note: 估值已有报道，但现金、烧钱速度、利润率和留存率仍无法量化。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 高
              tone: risk
    approximationNotes: 定性定位是分析师综合判断，不是测量得到的概率模型；空单元格表示没有分配保留风险，并不表示该风险类别不可能发生。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR008
      - CR009
      - CR011
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开融资证据和产品差异化被运营披露缺失及商业化阻力抵消，因此建议继续研究。
    data:
      nodes:
        - id: product-proof
          label: 一体化产品证据
          note: 从监测到工单执行的闭环
          claimRefs:
            - CV008
            - CV013
            - CV014
        - id: capital-proof
          label: 资本与投资人联合体证据
          note: 由知名投资人参与的 $120M Series C
          claimRefs:
            - CV001
            - CV011
        - id: price-signal
          label: 最近披露的私募市场估值
          note: 约 $720M 仅出现在第三方数据库中
          claimRefs:
            - CV004
            - CV005
        - id: friction
          label: 商业化阻力
          note: 定价可能不断上升，许多告警仍需人工核验
          claimRefs:
            - CV007
            - CV009
        - id: downside-buffer
          label: 追加融资背景
          note: 2026 年 BNDES 融资可以延长现金续航，但不能证明股权估值
          claimRefs:
            - CV006
        - id: recommendation
          label: 继续研究 / 等待 KPI 资料包
          note: 需要 ARR、利润率、留存率、烧钱速度、现金续航和优先权条款
          claimRefs:
            - CV005
            - CV010
            - CV012
      edges:
        - from: product-proof
          to: capital-proof
          label: 支持增长叙事
          claimRefs:
            - CV001
            - CV008
        - from: capital-proof
          to: price-signal
          label: 证明投资人兴趣
          claimRefs:
            - CV001
            - CV004
        - from: price-signal
          to: friction
          label: 需要经济性证据
          claimRefs:
            - CV005
            - CV007
        - from: friction
          to: downside-buffer
          label: 提高下行敏感度
          claimRefs:
            - CV006
            - CV009
        - from: downside-buffer
          to: recommendation
          label: 保持尽调开放，而非得出结论
          claimRefs:
            - CV006
            - CV010
    approximationNotes: 该流程是分析性的而非定量的；它排列证据链，但不推断概率权重。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
