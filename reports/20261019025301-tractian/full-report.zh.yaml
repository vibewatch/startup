      - number: '3.2'
        title: 能力、打包方式与采购标准
        blocks:
          - type: paragraph
            body: >-
              功能比较的关键不是 AI 话术，而是系统记录落在哪里。Tractian 宣称工作流可从传感器数据一路走到诊断和工单，并建立在带多模态输入的专有传感器栈之上。相比之下，Fiix 和 MachineMetrics
              更依赖集成，连接更广泛的控制器或企业数据环境；Augury 竞争诊断能力，却不负责完整原生 CMMS。打包方式很重要：Tractian
              在硬件之外有五名付费用户的最低门槛，而许多相邻平台要么公布更低的软件单独起售价，要么采用定制报价。采购团队真正要问的不是“它能否做预测性维护”，而是“我愿意从一个供应商购买多少层技术栈”。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
