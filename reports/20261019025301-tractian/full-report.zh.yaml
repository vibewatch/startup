      - number: '3.3'
        title: 持久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Tractian
              的护城河真实存在，但有条件。对重视快速部署、统一责任和从传感器到工单执行、而不太在意技术栈灵活性的中型工业现场，其捆绑模式应较有持久性。但同一设计也集中放大竞争风险：评论反复将其描述为封闭生态；即使支持性评论也认为它是高端方案，对小型工厂或难联网的偏远现场，ROI
              兑现更慢。公司如今称，客户资产或工业流程数据只有在不可逆匿名化后才会用于训练 AI，这有助于建立信任；但公开证据仍未给出流失、输赢复盘或独立基准准确率。战略问题因此不是 Tractian
              是否有差异化产品，而是买方计入硬件依赖、平台深度取舍和老牌厂商反应后，这种设计是否仍占优。
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: Tractian 的护城河是掌控工作流，而不只是更好的异常检测
            body: 公开来源反复指出，Tractian 通过捆绑传感器、诊断和工作执行形成差异；当工厂更看重运营闭环而非工具灵活性时，护城河最强。
            calloutType: strength
            claimRefs:
