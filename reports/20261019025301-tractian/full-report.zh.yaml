        - label: 分析与模型层
          detail: 公开案例研究描述的信号处理和训练栈。
          items:
            - 基于 FFT 的信号处理
            - 采集的 35 亿个传感器样本
            - 领域专用及多模态物理 AI 模型
          outputs:
