      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观情景
        - 管理层披露 ARR 强劲增长、毛利率健康、留存率高且股权结构条款清晰；AI 驱动的工作流自动化无需大量人工核验即可扩张。
        - 如果经营数据得到验证，战略溢价有依据，估值可以高于最近披露的约 $720M。
        - 新 KPI 体系、客户队列证据和资本效率披露同时改善。
        - 指标不足以支撑溢价，或融资更像过桥融资而非增长融资。
      - - 基准情景
        - 公司确认软件经济性扎实但并非顶尖；2026 年融资延长 runway，却没有改变股权价值的可见度。
        - 只有在基本面验证后，估值才应维持在最近披露的私募市场估值附近；可以继续跟踪，但不足以支持激进入场。
        - 部分披露有所改善，但留存率、利润率或优先权条款仍仅部分可见。
        - 商业化采用放缓，或融资条款暴露出不利的稀释或优先受偿安排。
      - - 悲观情景
        - 定价阻力持续存在，自动化仍需大量人工审核，公开估值也没有披露的单位经济性支撑。
        - 估值应低于最近披露的估值，或需要结构化安排，因为下行保护比增长叙事更重要。
        - 没有 KPI 披露、资本更像债务，或客户证据弱于营销材料所暗示的水平。
        - 出现任何降价融资信号、隐藏的优先权负担或客户集中度冲击。
    notes: 这些区间仅用于指示方向，因为当前证据池没有披露 ARR、利润率和股权结构等模型点估值所需的输入。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
