      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              指定来源明确将 Igor Marinelli 识别为核心经营者。Tractian 关于页面称其为 CEO 兼创始人；2023 年 Series B 公告补充称，他是毕业于 Berkeley
              的计算机工程师，父亲从事维护工作，这塑造了最初的问题定义。Multiples 还列出 Gabriel Lameirinhas
              为联合创始人。尽管保留的官方页面没有完整高管名单或当前董事会名单，这些信息已足以将公司描述为创始人主导。


              这项披露缺口很重要：融资过程可见，但控制权不可见。指定来源将 Sapphire Ventures、General Catalyst、Next47/N47、Y Combinator 和 DGF
              列为各轮重要投资者，但没有任何保留来源披露当前董事会、投资者权利包或 Series C 优先股堆叠。尽调更容易确认创始人与市场的匹配度，当前治理和决策权则仍不透明。
            claimRefs:
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
