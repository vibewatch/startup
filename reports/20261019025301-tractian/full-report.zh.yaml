  - id: TV002
    title: 主论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 主论点
        - 集成式传感器加 CMMS 工作流，可能为维护团队打造高黏性的运营系统。
        - 独立案例研究或 KPI 披露若能证明采用效率和留存，将增强投资信心。
      - - 主论点
        - 2024 年的大额融资，加上第三方给出的 $720M 估值，意味着投资者认真看好这一品类及 Tractian 的定位。
        - 发行方确认的估值条款和当前收入指标，能把融资新闻转化为价格支撑。
      - - 反论点
        - 公开证据未披露 ARR、毛利率、NRR、烧钱、现金跑道或清算优先权。
        - 私有运营看板和股权结构表将显著降低投资判断的不确定性。
      - - 反论点
        - 独立评测证据指向定价摩擦，而公司仍将人工验证描述为建立信任的一部分。
        - 如果证明客户能以经济方式扩大使用，并在生产深度上信任自动化，悲观情景将减弱。
    notes: 各行将叙事质量与价格支撑分开；缺失数据的行是估值阻碍，而不是泛泛的公司质量批评。
    claimRefs:
