              补充了外部商业证据：逾 500 个客户、覆盖逾 1,000 家工厂，以及客户自称 ROI 为 6-12x、每台受监测机器年节省约
              $6,000。这些数据能勾勒买方价值和扩张潜力，却没有披露毛利率、CAC、回本期、NRR、流失或营运资本强度。一份低层级通讯进一步称 2024 年收入翻倍、员工将从 280 人增至
              400+，但较高层级的保留来源未予印证。
