      - number: '1.3'
        title: 融资、规模与公开指标可信度
        blocks:
          - type: paragraph
            body: >-
              融资历史是概览中量化最清晰的部分。Multiples 报道称，公司于 2024 年 12 月完成 $120 million Series C，估值 $720 million，五轮累计融资 $184
              million；Tractian 自己的 2023 年公告记录了 General Catalyst 领投的上一轮 $45 million Series B，并称业务已覆盖逾 1,000 家工业工厂。这些数字让
              Tractian 更像有真实融资历史的后期工业软硬件公司，而不是概念早期项目。


              更难判断的是当前经营规模。Tractian 首页如今称有 2,000 家制造商信赖它，但 Forbes 2024 年 4 月的报道使用了不同分母——逾 500 家工业客户；Series B
              公告则使用工厂而非客户。三种说法方向上都积极，却不能互换。经济指标同样模糊：指定公开来源没有披露当前 ARR、NRR、毛利率、burn 或 runway；Forbes 2024 年 4
              月快照也只将员工数历史性地锚定为 200 人。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: 里程碑与下行信号
        blocks:
          - type: paragraph
            body: >-
              里程碑时间线显示，Tractian 在 2019 至 2026 年间持续增加资本、产品范围和地域实体。Multiples 梳理了从 pre-seed、seed 到 2022 年 Series A 的路径；官方
              2023 年 Series B 公告将融资与覆盖 1,000 家工厂及推出 AI-Assisted Maintenance 联系起来；2026
              年隐私政策则显示其已形成横跨美国、巴西、墨西哥和爱尔兰的更正式多实体结构。这足以建立有日期的时间线，无需臆造缺失的公司历史。


              指定来源中最有价值的下行证据来自执行层面，而非法律层面。Limble 2026 年对比称，Tractian 更像 AI 驱动的状态监测生态，而不是直观的日常 CMMS；Coast
              则认为，产品要求客户接受较高的最低付费用户数和显著的硬件依赖。这些批评并不能否定产品与市场匹配，但说明原始部署指标不能被当作其在所有维护工作流或客户群中都同样有吸引力的证明。
