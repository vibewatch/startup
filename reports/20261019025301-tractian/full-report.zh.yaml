  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程
      - 作用
      - 依赖
      - 风险
    rows:
      - - 传感器与资产数据采集
        - 从已安装设备采集振动、温度、超声波、RPM 及其他机器信号
        - 硬件部署、资产覆盖，以及可靠连接或批量同步
        - 传感器覆盖有限或数据质量较差，会削弱后续诊断
      - - 信号处理与模型训练
        - 将原始机器数据转成异常指标，并训练领域专用模型
        - FFT 流程、GPU 集群和大规模标注传感器数据集
        - 关于模型覆盖广度的公开主张高度依赖厂商和合作伙伴披露
      - - 推理与专业代理
        - 执行故障检测、严重度分类、根因分析、维修处方和指引
        - 低延迟服务、跨多个模型的编排，以及资产背景
        - 独立公开证据未验证各代理的准确率或正常运行时间
      - - 工作流与系统集成
        - 将诊断转成工单，并与企业系统同步
        - CMMS / ERP 连接器、移动应用和实施服务
        - 集成广度主要来自公司自述；复杂部署可能拉长价值实现周期
      - - 信任、隐私与治理
        - 明确法律实体、处理角色和平台数据处理责任
        - 隐私政策和内部治理流程
        - 指定来源无法证明公开认证、事件报告或状态透明度
    notes: 该架构根据公开产品、合作伙伴和案例研究证据重建；未经支持的控制被视为风险，而不是默认具备的能力。
