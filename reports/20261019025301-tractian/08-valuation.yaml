    title: Recommendation summary table
    columns: [Item, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not convert diligence into a buy call until private KPI disclosure closes the valuation gap."]
      - [Confidence, medium, "The financing and product signal is real, but the public evidence set is incomplete for underwriting."]
      - [Risk rating, high, "Commercialization and pricing frictions could matter more than the funding headline implies."]
      - [Valuation stance, unknown, "Latest price support is third-party reported and not company-confirmed."]
      - [Entry discipline, "Wait for private metrics package", "Require ARR, gross margin, retention, burn, runway, and preference terms before price-setting."]
    notes: "Assessment uses only assigned prefetched public evidence; unknown means the pool lacks enough operating and cap-stack data to support a valuation call."
    claimRefs: [CV001, CV004, CV005, CV007, CV011]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Side, Argument, "What would change the view"]
    rows:
      - [Thesis, "Integrated sensor plus CMMS workflow can create a sticky operating system for maintenance teams.", "Independent case studies or KPI disclosure showing adoption efficiency and retention would strengthen conviction."]
      - [Thesis, "Large 2024 financing plus third-party $720M mark imply serious investor belief in the category and Tractian's positioning.", "Issuer-confirmed valuation terms and current revenue metrics would convert the financing headline into price support."]
      - [Anti-thesis, "Public evidence does not disclose ARR, gross margin, NRR, burn, runway, or liquidation preferences.", "A private operating dashboard and cap table would materially reduce underwriting uncertainty."]
      - [Anti-thesis, "Independent review evidence points to pricing friction, and the company still describes manual verification as part of trust-building.", "Proof that customers scale usage economically and trust automation at production depth would weaken the downside case."]
    notes: "Rows separate narrative quality from price support; the missing-data rows are valuation blockers rather than generic company-quality criticisms."
    claimRefs: [CV001, CV004, CV005, CV007, CV008, CV009, CV011, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - [Bull, "Management discloses strong ARR growth, healthy gross margin, high retention, and clean cap-table terms; AI-led workflow automation scales without heavy manual verification.", "Valuation can justify moving above the last reported ~$720M mark because operating proof would support a premium strategic multiple.", "New KPI package, customer-cohort evidence, and capital efficiency disclosures all improve at once.", "Metrics fail to support the premium or financing proves more bridge-like than growth-oriented."]
      - [Base, "Company confirms solid but not elite software economics, and 2026 financing adds runway without changing equity value visibility.", "Stay around the latest reported private mark only after validating fundamentals; acceptable for track but not enough for an aggressive entry.", "Selective disclosure improves, but retention, margin, or preference terms remain only partly visible.", "Commercial adoption slows or financing terms reveal unattractive dilution or seniority."]
      - [Bear, "Pricing friction persists, automation requires significant human review, and public valuation remains unsupported by disclosed unit economics.", "Value should sit below the last reported mark or require structure because downside protection matters more than growth narrative.", "No KPI disclosure, more debt-like capital, or weaker customer proof than marketing materials imply.", "Any down-round signal, hidden preference overhang, or customer-concentration shock."]
    notes: "Ranges are directional because the assigned pool lacks disclosed ARR, margin, and cap-table inputs needed for a model-driven point estimate."
    claimRefs: [CV004, CV005, CV006, CV007, CV009, CV010, CV011]
