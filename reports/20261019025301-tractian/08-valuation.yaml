callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: >-
      Public evidence is good enough to keep Tractian in diligence and too incomplete to support a
      buy recommendation. The next decision gate is private disclosure, not another public headline:
      ARR, margin, retention, cap-table preferences, and terms around the 2026 financing need to
      be reviewed before assigning a valuation stance beyond unknown.
    claimRefs: [CV004, CV005, CV006, CV010, CV012]
