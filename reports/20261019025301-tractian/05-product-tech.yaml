  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer-signal or practitioner-community evidence such as GitHub activity, package downloads, API forums, Stack Overflow discussions, or a comparable industrial practitioner proxy.
      whyItMatters: The chapter brief explicitly asks for developer-signal or the closest practitioner-community proxy to test whether the technical story travels beyond company-controlled channels.
      diligencePath: Request product telemetry on API or integration usage, public developer resources, or customer-community evidence; if none exists, document the absence and identify the nearest practitioner proxy.
      relatedQuestionRefs:
        - QE008
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Public proof of certifications, audit reports, penetration-testing disclosures, a status page, or documented incident response practices.
      whyItMatters: The assigned sources support privacy and governance language, but they do not independently establish security maturity or operational resilience for enterprise buyers.
      diligencePath: Obtain security-trust-center materials, certification letters, or customer-facing reliability documentation from management.
      relatedQuestionRefs:
        - QE006
        - QE007
    - type: private-evidence-only
      severity: material
      topic: model-quality
      missingEvidence: Independent validation of alert precision, false-positive rates, and diagnostic accuracy by asset class or deployment cohort.
      whyItMatters: Product breadth and scale are credible, but underwriting product defensibility and customer ROI still requires proof that model outputs are accurate enough to reduce manual review in production.
      diligencePath: Ask for customer cohort metrics, analyst-validation studies, or blinded before-and-after outcome data segmented by machine type and use case.
      relatedQuestionRefs:
        - QE005
        - QE007
    - type: private-evidence-only
      severity: minor
      topic: implementation-variability
      missingEvidence: Customer-level implementation timelines, sensor attach rates, and adoption metrics across different plant environments.
      whyItMatters: External evidence shows the architecture can work, but a single internal integration case and marketing timelines do not reveal typical time-to-value across customer fleets.
      diligencePath: Request implementation cohorts showing install duration, live-asset coverage, and user adoption by site and industry.
      relatedQuestionRefs:
        - QE004
