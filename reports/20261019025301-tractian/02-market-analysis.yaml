  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: A management-backed bottom-up TAM/SAM/SOM model with explicit plant, asset, and pricing denominators.
      whyItMatters: Public proxies show demand and traction but do not let an investor convert workflow relevance into a defendable revenue opportunity.
      diligencePath: Ask management for a cohort-based sizing bridge from target plants and asset counts to paid subscriptions, including attach rates and average pricing.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: customer-definition
      missingEvidence: A precise definition of customer, manufacturer, facility, and monitored-asset counts used in external reporting.
      whyItMatters: Inconsistent units can overstate market reach, distort penetration estimates, and break any bottom-up SOM exercise.
      diligencePath: Reconcile every public scale metric to one denominator set and request a dated KPI glossary from management.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: minor
      topic: budget-owner
      missingEvidence: Procurement evidence showing which function signs and funds the contract by segment.
      whyItMatters: Budget ownership affects sales-cycle length, required ROI proof, and the plausibility of expansion from pilot to multi-site deployment.
      diligencePath: Request anonymized customer procurement paths, including the sponsoring function, approver chain, and whether budgets came from maintenance, operations, or corporate digital teams.
      relatedQuestionRefs: [QM003]
