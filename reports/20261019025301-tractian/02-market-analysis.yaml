      Ordered as increasingly constrained public proxies rather than mathematically nested
      TAM/SAM/SOM layers; the assigned evidence does not disclose a consistent spend-based
      denominator or a standardized customer definition.
    claimRefs: [CM009, CM010, CM011, CM015]
callouts:
  - calloutType: insight
    title: Market proof is workflow-centric, not denominator-clean
    body: >-
      The pool is strong on workflow definition and problem urgency, but weak on investor-grade
      market sizing. Management diligence should ask Tractian to reconcile customers,
      manufacturers, facilities, assets, and paid subscriptions into one bottom-up model.
    claimRefs: [CM001, CM008, CM010, CM011, CM015]
