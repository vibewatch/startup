      - [MaintainX, "Software-first CMMS", "Not stated in retained evidence", "Facilities, light manufacturing, and teams moving off paper", "Mobile-first adoption and software-only deployment with free entry", "No comparable proprietary condition-monitoring hardware in retained evidence"]
      - [Fiix, "CMMS / EAM with integrations", "Not stated in retained evidence", "Reliability teams that want mature work management plus PLC or enterprise integrations", "Integration hub and enterprise asset management depth", "Less differentiated as an all-in-one sensor stack than Tractian"]
      - [Augury, "Machine-health specialist", "Not stated in retained evidence", "Critical rotating assets that need strong diagnostics", "Deep diagnostics and reliability support", "Often needs another CMMS or execution layer"]
      - [IBM Maximo Application Suite, "Enterprise EAM incumbent", "Not stated in retained evidence", "Large regulated or global asset operators", "Lifecycle breadth, IoT integration, and enterprise planning depth", "Complex and expensive implementation"]
      - [MachineMetrics, "Factory data / machine monitoring", "Not stated in retained evidence", "Manufacturers that prefer controller-native machine data", "Direct connectivity to CNC, PLC, and legacy machine controls", "Limited maintenance workflows relative to a full CMMS or EAM"]
    notes: >-
      Public scale and funding detail is uneven; "Not stated in retained evidence" means
      the assigned source pool did not provide a directly supportable public figure.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Tractian
      - MaintainX
      - Fiix
      - Augury
      - IBM Maximo
      - MachineMetrics
    rows:
      - ["Proprietary sensing required for core differentiated workflow", "Yes", "No public proprietary sensor line in retained evidence", "No; integrates with plant and enterprise systems", "Yes, closed ecosystem around Halo sensors", "No; integrates existing sensors and historians", "No; plugs into machine controls rather than a proprietary sensor stack"]
      - ["Native maintenance execution / CMMS ownership", "Yes", "Yes", "Yes", "Partial / often paired with another CMMS", "Yes", "Partial / analytics and monitoring first"]
      - ["Open integrations with ERP / controller data", "APIs, SQL connectors, custom integrations", "100+ integrations in vendor comparisons", "Integration Hub plus open API", "Execution integrations via partner or external systems", "Broad IoT, SCADA, historian, and enterprise integrations", "Direct CNC / PLC / legacy equipment connectivity"]
      - ["Differentiation Tractian public sources emphasize", "Closed-loop sensor-to-work-order execution", "Technician adoption and mobile workflows", "Mature CMMS with PLC and ERP integration", "Diagnostics depth for critical rotating assets", "Enterprise asset lifecycle breadth", "Machine connectivity and production analytics"]
      - ["Best-fit environment from retained evidence", "Plants that want one vendor accountable for detection through execution", "Teams avoiding hardware commitments", "Plants with existing industrial and ERP data stacks", "High-value rotating assets with separate execution tooling", "Large complex asset operators", "Factories that want controller-native monitoring before adding maintenance orchestration"]
    notes: >-
      Cells summarize the retained public evidence only; "Partial" and "No public ...
      retained evidence" mark places where the source pool did not support a stronger
      claim.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008, CP009, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Published package
      - Public floor
      - Hardware model
      - Commercial implication
    rows:
      - [Tractian, "Standard / Enterprise / Bundle", "$60 per user per month with 5-user minimum; Enterprise from $100 with 10-user minimum", "Condition-monitoring hardware sits in Bundle tier", "Higher entry floor before adding sensors; best when buyers accept a bundled stack"]
      - [MaintainX, "Basic / Essential / Premium / Enterprise", "Free tier; paid plans from $20 or $65 per user per month in retained comparisons", "Software-only in retained evidence", "Lower-friction pilot path for teams prioritizing workflow adoption"]
      - [Fiix, "Free / Basic / Professional / Enterprise", "Free tier; Basic from $45 per user per month", "Sensor-agnostic in retained evidence", "More modular economics for buyers with existing monitoring infrastructure"]
      - [Limble, "Custom pricing", "Custom quote", "Supports its own starter sensor kits plus third-party integrations", "Commercial model is quote-led despite a software-first positioning"]
      - [Augury, "Custom enterprise pricing", "Custom quote", "Closed hardware and services model", "Can fit critical assets but keeps buyers in a premium specialist lane"]
      - [IBM Maximo / MachineMetrics, "Custom enterprise pricing or SaaS subscription", "Custom quote / plan-based subscription", "No proprietary Tractian-style sensor bundle in retained evidence", "Commercial flexibility depends on scope and existing plant infrastructure"]
    notes: >-
      Public pricing is not apples-to-apples. Floors come from retained 2026 comparison
      pages, while "Custom quote" means the source pool did not include a supportable
      public list price.
    claimRefs: [CP005, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning shows Tractian strongest on execution closure but weaker on
      ecosystem openness than controller-native or incumbent alternatives.
    xAxis:
      label: Ecosystem openness and bring-your-own-data flexibility
      min: 1
      max: 5
      lowLabel: Closed / proprietary
      highLabel: Open / integration-led
    yAxis:
      label: Native maintenance execution depth
      min: 1
      max: 5
      lowLabel: Analytics layer only
      highLabel: Detection-to-work-order owner
    data:
      points:
        - label: Tractian
          x: 2
          y: 5
          detail: "Closed-loop execution plus proprietary sensing; strongest when one vendor owns the workflow."
        - label: MaintainX
          x: 4
          y: 3
          detail: "Software-first CMMS with broad adoption and lower entry friction, but not a retained hardware-led predictive stack."
        - label: Fiix
          x: 4
          y: 4
          detail: "Mature CMMS and integration hub position it as the more open work-management alternative."
        - label: Augury
          x: 2
          y: 2
          detail: "Strong diagnostics but commonly paired with another execution system."
        - label: IBM Maximo
          x: 5
          y: 4
          detail: "Enterprise EAM breadth and integration openness outweigh deployment simplicity."
        - label: MachineMetrics
          x: 5
          y: 2
          detail: "Controller-native monitoring and analytics without owning a full maintenance workflow."
    approximationNotes: >-
      Ordinal 1-5 scores synthesize retained public evidence on hardware lock-in,
      integration model, and whether each vendor owns work execution; they are not
      benchmarked performance scores.
    claimRefs: [CP001, CP004, CP006, CP007, CP008, CP010]
callouts:
  - calloutType: strength
    title: Tractian's moat is workflow ownership, not just better anomaly detection
    body: >-
      Public sources repeatedly differentiate Tractian by bundling sensors, diagnosis,
      and work execution; the moat is strongest where plants value that operational
      closure more than tooling flexibility.
    claimRefs: [CP001, CP002, CP009, CP014]
  - calloutType: risk
    title: The same bundle that creates stickiness also narrows the willing buyer set
    body: >-
      Competitor-authored comparisons frame proprietary hardware, CMMS-depth tradeoffs,
      and pricing floors as the main reasons buyers defect to more modular or
      software-first alternatives.
    claimRefs: [CP004, CP005, CP010, CP011]
  - calloutType: insight
    title: Incumbents and controller-native tools cap Tractian's pricing power at the top end
    body: >-
      IBM Maximo and MachineMetrics show that Tractian is not just fighting startups; it
      is also competing against existing plant data and asset-management systems that
      can absorb predictive maintenance into broader operational budgets.
    claimRefs: [CP008, CP015]
