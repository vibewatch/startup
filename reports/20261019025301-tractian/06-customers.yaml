  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: >-
        Public NRR, GRR, logo churn, renewal rates, contract duration, or cohort retention
        evidence for mature Tractian accounts.
      whyItMatters: >-
        Without durability metrics, the chapter can confirm adoption breadth but cannot
        separate sticky, expanding deployments from a large but economically uneven base.
      diligencePath: >-
        Request customer cohorts by start year, renewal and churn statistics, GRR/NRR, and
        at least three reference calls from accounts older than 24 months.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration-and-channel-dependence
      missingEvidence: >-
        Top-customer share, top-partner contribution, channel versus direct mix, and ARR by
        customer segment, region, or vertical.
      whyItMatters: >-
        A 500-plus-customer count can still mask concentration or partner dependence that
        would materially change the quality of the revenue base.
      diligencePath: >-
        Ask management for top-10 account share, top-5 partner contribution, and ARR split
        by geography and vertical for the trailing twelve months.
    - type: stale
      severity: minor
      topic: customer-count-definition
      missingEvidence: >-
        A current 2026 management-defined denominator that reconciles customers, clients,
        manufacturers, and monitored plants.
      whyItMatters: >-
        The latest retained public figures are rounded and may double-count multi-site
        rollouts, which weakens comparability across vintages.
      diligencePath: >-
        Request a run-date reconciliation of logos, paying accounts, live plants, and
        monitored assets, with definitions used in investor materials.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU003]
