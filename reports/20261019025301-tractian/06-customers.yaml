figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence portrays a reliability-led industrial buying motion that expands from
      sensor rollout into technician workflows, manager dashboards, and multi-site adoption,
      with implementation friction as the main drag.
    data:
      items:
        - label: Reliability-led evaluation
          actor: Reliability engineer / maintenance lead
          phase: Land
          tone: neutral
          touchpoints:
            - Uptime-critical assets and expensive downtime frame the problem
            - Tractian is positioned against predictive-maintenance and reporting alternatives
        - label: Sensor and platform rollout
          actor: Tractian implementation team + plant stakeholders
          phase: Deploy
          tone: neutral
          touchpoints:
            - Wireless sensors are installed on critical equipment
            - Official materials claim initial asset coverage in 30-60 days
        - label: Technician execution
          actor: Technician / maintenance team
          phase: Use
          tone: positive
          touchpoints:
            - Mobile work orders and AI-generated SOPs reach the plant floor
            - Offline execution is part of the daily workflow story
        - label: Manager visibility
          actor: Plant manager / operations leader
          phase: Prove
          tone: positive
          touchpoints:
            - Live KPI dashboards surface MTTR, backlog, and completion data
            - Production and OEE visibility extend the pitch beyond maintenance alone
        - label: Expansion loop
          actor: Multi-site reliability organization
          phase: Expand
          tone: positive
          touchpoints:
            - Multi-site management and broader module adoption are central upsell levers
            - Public scale claims cite more than 1,000 plants and more than 500 customers
        - label: Friction and durability check
          actor: Operations leader / procurement owner
          phase: Underwrite
          tone: risk
          touchpoints:
            - Hardware installation and training can slow implementation
            - Public sources still do not disclose NRR, churn, renewals, or concentration
    approximationNotes: >-
      This is a synthesized journey based on repeated public adoption patterns in the
      assigned pool, not a published funnel with conversion rates.
    claimRefs: [CU001, CU003, CU005, CU009, CU011, CU014]
callouts:
  - calloutType: insight
    title: Breadth is credible; durability is not yet underwritten
    body: >-
      Repeated third-party customer counts and repeated named accounts make Tractian's
      adoption story credible, but the absence of public renewal and concentration data
      keeps the chapter from graduating from adoption breadth to customer-quality proof.
    claimRefs: [CU003, CU007, CU014]
  - calloutType: risk
    title: The main public drag is deployment friction, not demand denial
    body: >-
      The adverse evidence in the assigned pool does not dispute that industrial buyers use
      Tractian; it warns that hardware-led implementation, onboarding, and product usability
      can slow time to value and complicate broader rollout.
    claimRefs: [CU011, CU012]
