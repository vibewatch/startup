company:
  name: Tractian
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence continues to show Tractian selling primarily to reliability-led,
    asset-intensive industrial teams, with independently repeated claims of more than
    500 customers/clients and more than 1,000 plants by 2023-2024 plus named accounts
    such as John Deere, Procter & Gamble, Caterpillar, and Goodyear. The growth signal
    is credible, but durability remains under-disclosed because the assigned source pool
    still lacks public renewal, churn, cohort, and concentration metrics, while review
    evidence points to hardware-led implementation friction.
sections:
  - id: industrial-segmentation
    title: Industrial buyer and user segmentation
    body: |-
      The retained evidence points to a narrow but coherent customer profile: Tractian is
      marketed and publicly discussed as a platform for reliability engineers, maintenance
      technicians, plant managers, and industrial operations leaders inside asset-intensive
      environments rather than a general-purpose facilities workflow tool. Across Tractian's
      own materials, the recurring operational settings are manufacturing, mining and metals,
      chemicals, food and beverage, oil and gas, mills and agriculture, automotive, and
      heavy equipment, with the common thread being expensive downtime on rotating or
      production-critical assets.

      That positioning matters for customer quality. It suggests the company is winning where
      buyers tolerate a heavier deployment motion in exchange for condition monitoring,
      predictive diagnostics, and production visibility. It also means the public story is
      stronger on user roles and operating pain than on payer identity or procurement
      ownership; the sources are clear about who uses the system day to day, but much less
      clear about whether budget authority sits with maintenance, plant leadership, or a
      broader operations or digital-transformation owner.
    claimRefs: [CU001, CU002, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof
    title: Named customer proof is real but still shallow
    body: |-
      The assigned pool contains enough evidence to say Tractian has real adoption, not just
      logo farming. Independent profiles repeat a public customer count above 500 and name
      recognizable accounts including John Deere, Procter & Gamble, Caterpillar, and
      Goodyear, while Tractian's own materials add additional logos such as ICL, Ingredion,
      CP Kelco, and Georgia Aquarium. That combination makes it hard to dismiss customer
      proof altogether.

      The limitation is depth. Most named-account references stop at "customer" or
      "client" status without disclosing start date, deployed modules, contract value,
      plant count, renewal history, or whether the reference reflects full production
      standardization versus a narrower rollout. In other words, Tractian has public
      evidence of adoption breadth, but the retained sources still do not let an investor
      underwrite customer quality at the account level with much precision.
    claimRefs: [CU003, CU007, CU008, CU014]
    tableRefs: [TU003]
  - id: trajectory-durability-and-friction
    title: Adoption trajectory looks positive; durability and expansion economics remain the gap
    body: |-
      The clearest public trajectory in the assigned pool is top-of-funnel adoption rather
      than retention. Third-party profiles cite roughly 200 companies in 2022, then more
      than 500 customers or clients and more than 1,000 plants by 2023-2024, and Tractian's
      own customer messaging pairs that scale story with claims of first results within
      weeks, 30-60 day initial asset coverage, designated customer-success guidance, and
      measurable reductions in unplanned downtime. That is directionally strong evidence
      that the product can land and expand in industrial workflows.

      What remains missing is the quality of that expansion curve. No retained source
      discloses NRR, GRR, logo churn, contract length, renewal cohorts, top-customer share,
      or channel dependence, so the public record still cannot distinguish sticky,
      expanding deployments from a large installed base with uneven monetization or
      concentration. Public review evidence also adds friction: implementation can be slow
      because hardware installation, configuration, and training extend time to value.
      The result is a customer story that is credible on adoption, mixed on operational
      smoothness, and still underpowered on durability economics.
    claimRefs: [CU004, CU005, CU006, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
