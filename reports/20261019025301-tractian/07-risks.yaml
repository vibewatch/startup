    type: matrix
    summary: >-
      The analyst-assigned matrix concentrates the most material residual exposure in model and
      workflow performance, data security, and opaque unit economics.
    data:
      columns:
        - label: Likelihood
          note: Qualitative probability based on the retained evidence.
        - label: Impact
          note: Potential effect on safety, customers, or investment returns.
        - label: Residual exposure
          note: Net risk after controls visible in the assigned pool.
      rows:
