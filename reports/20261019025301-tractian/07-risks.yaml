            - label: Medium-high
              tone: warning
            - label: High
              tone: risk
            - label: High
              tone: risk
        - label: Connectivity and integration
          note: Cellular networks and external systems sit outside Tractian's full control.
          values:
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: warning
            - label: Medium
              tone: warning
        - label: Proprietary-stack switching friction
          note: Integrated sensors and software can increase replacement cost after rollout.
          values:
            - label: High
              tone: risk
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: warning
        - label: Financial-model opacity
          note: Valuation is reported, while cash, burn, margin, and retention remain unquantified.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: risk
            - label: High
              tone: risk
    approximationNotes: >-
      Qualitative placement is an analyst synthesis, not a measured probability model; empty cells
      mean no retained risk was assigned, not that the risk category is impossible.
    claimRefs: [CR001, CR002, CR004, CR005, CR008, CR009, CR011, CR012, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Thesis-break conditions
    body: >-
      Pause or reprice if independent tests show unacceptable alert error rates, customers cannot
      convert alerts into completed work, required security assurance is unavailable, deployment
      support degrades as installations scale, or hardware economics and burn imply repeated
      financing before durable retention is proven.
    claimRefs: [CR002, CR008, CR010, CR011, CR012, CR013, CR014, CR016]
