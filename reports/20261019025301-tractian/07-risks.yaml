        Current cash, burn, runway, ARR, retention, hardware gross margin, implementation cost,
        support cost, working-capital needs, and customer concentration.
      whyItMatters: >-
        A funding-round valuation does not establish cash availability, operating efficiency, or
        the durability of a capital-intensive hardware-software model.
      diligencePath: >-
        Reconcile audited financials, bank balances, cap table, cohort retention, bill of materials,
        inventory turns, and deployment payback in the data room.
