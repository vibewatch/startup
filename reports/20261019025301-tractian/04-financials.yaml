      - ["Maintenance platform subscription", "AI maintenance platform, dashboards, and workflow software", "Subscription", "Subscription model reported; realized pricing undisclosed", "Recurring software element is evidenced, but no seat/site/asset pricing schedule is public", "Provide contract structure, renewal terms, and realized price waterfalls by segment"]
      - ["Implementation and expert services", "Customer success support, implementation help, and supervised vibration review", "Service engagement", "Service layer evidenced; revenue share unknown", "Public sources show services exist, but not whether they are bundled, billable, or margin accretive", "Break out services attach rate, billability, and effect on deployment margin"]
    notes: >-
      Public retained evidence supports the presence of hardware, subscription software, and
      services, but not revenue recognition policy, revenue mix, or list pricing.
    claimRefs: [CI001, CI008, CI009, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Package element
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Condition-monitoring and energy-efficiency packages", null, "Packaging categories are visible; numeric list prices are not", "No public discount schedule, minimum contract term, or realized ASP", "Retained competitor comparison plus Tractian product pages"]
      - ["AI maintenance platform subscription", null, "Subscription model is public; per-seat, per-asset, or per-site monetization is not", "Unknown renewal mechanics, step-ups, and implementation fees", "Multiples and Tractian official materials"]
      - ["Implementation / support / supervised analysis", null, "Service layer is visible, but billable vs bundled treatment is not", "Unknown whether expert review or customer-success coverage is priced separately", "Tractian official materials"]
    notes: >-
      Null values mean the retained public sources did not disclose quoted prices, discount bands,
      or contract durations even though they do reveal packaging and workflow structure.
    claimRefs: [CI001, CI008, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Customer ROI", "6-12x ROI and about $6,000 annual savings per monitored machine", "Medium", "Supports buyer value and expansion logic but does not prove Tractian's own margin structure", "Request methodology, sample size, and realized retention/expansion by cohort"]
      - ["Revenue growth", "AI Business Weekly says revenue doubled in 2024", "Low", "Growth could justify the 2024 valuation step-up if independently verified", "Reconcile with audited 2024 and 2025 revenue or ARR by geography"]
      - ["Gross margin", null, "Low", "Required to underwrite hardware-plus-software margin path and service burden", "Provide hardware, software, and services gross margin splits"]
      - ["CAC / payback", null, "Low", "Needed to test sales efficiency and financing dependence", "Provide CAC, sales cycle, pipeline conversion, and payback by segment"]
      - ["NRR / churn", null, "Low", "Installed-hardware models can be sticky, but expansion and churn data are necessary to prove it", "Provide logo churn, gross revenue retention, and NRR by cohort"]
      - ["Cash burn / runway", null, "Low", "The company raised significant capital, but adequacy cannot be judged without burn and cash data", "Provide current cash, monthly burn, debt obligations, and runway base case"]
    notes: >-
      Null values are genuine public-data gaps, not zeroes. Outcome claims are useful commercial
      proof, but they are not substitutes for internal unit-economics disclosures.
    claimRefs: [CI003, CI006, CI007, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the operational bridge from sensor deployment to software usage,
      expert support, and account expansion, but not the pricing conversion at each step.
    data:
      nodes:
        - id: deploy
          label: Deploy sensors
          detail: Smart Trac Ultra hardware is deployed on industrial assets as the on-ramp to the platform.
          claimRefs: [CI001, CI002]
        - id: monitor
          label: Stream telemetry into platform
          detail: Sensor data feeds Tractian dashboards and diagnostics continuously.
          claimRefs: [CI002, CI009]
        - id: diagnose
          label: AI diagnosis and recommendations
          detail: The platform identifies faults, severity, and recommended actions.
          claimRefs: [CI002, CI009, CI012]
        - id: execute
          label: Execute work orders
          detail: Work orders route to technicians with mobile and offline support.
          claimRefs: [CI002, CI009]
        - id: prove
          label: Report KPI outcomes
          detail: Dashboards track MTBF, MTTR, PM compliance, backlog, and related outcomes.
          claimRefs: [CI002, CI010, CI013]
        - id: expand
          label: Renew and expand footprint
          detail: Customer ROI and integration breadth support wider plant or asset adoption.
          claimRefs: [CI010, CI013]
      edges:
        - from: deploy
          to: monitor
          label: telemetry
          claimRefs: [CI001, CI002]
        - from: monitor
          to: diagnose
          label: analytics
          claimRefs: [CI002, CI009]
        - from: diagnose
          to: execute
          label: work-order trigger
          claimRefs: [CI009]
        - from: execute
          to: prove
          label: completion data
          claimRefs: [CI002, CI010]
        - from: prove
          to: expand
          label: ROI case
          claimRefs: [CI010, CI013]
    approximationNotes: >-
      This is a qualitative bridge from operational workflow to monetization and retention logic;
      public sources do not provide stepwise conversion rates or margin contribution by stage.
    claimRefs: [CI001, CI002, CI009, CI010, CI013]
callouts:
  - calloutType: insight
    title: Commercial proof is stronger than pricing proof
    body: >-
      Public materials support a real integrated product and customer-value story, but they still
      do not reveal the realized price architecture that would let an investor judge revenue
      quality precisely.
    claimRefs: [CI001, CI002, CI008, CI013]
  - calloutType: risk
    title: Capital adequacy cannot be underwritten from public evidence
    body: >-
      The round size and valuation are visible, but cash balance, burn, runway, and even cumulative
      funding totals remain either undisclosed or inconsistent across retained sources.
    claimRefs: [CI003, CI004, CI005]
