  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Current cash balance, monthly burn, debt obligations, and base-case runway after the 2024 Series C.
      whyItMatters: Without cash and burn data, the chapter cannot test capital adequacy or financing dependency.
      diligencePath: Request the latest board deck, cash reconciliation, debt schedule, and 12-month operating plan from management.
      relatedQuestionRefs: [QI006]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, CAC, payback, churn, and NRR split by product line or cohort.
      whyItMatters: These metrics determine whether the installed-hardware model scales efficiently or simply grows volume.
      diligencePath: Request cohort retention, margin bridge, and sales-efficiency dashboards with definitions consistent across periods.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: total-funding
      missingEvidence: A reconciled funding chronology explaining why retained third-party totals differ at $184 million versus $196 million.
      whyItMatters: Capital-base inconsistencies weaken confidence in reported dilution, runway, and post-round capitalization.
      diligencePath: Reconcile the cap table and financing ledger against signed transaction documents and identify any secondary proceeds.
      relatedQuestionRefs: [QI007]
