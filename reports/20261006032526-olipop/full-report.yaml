  - id: FU001
    title: Customer Journey and Acquisition Loop Map
    type: journey-map
    summary: >-
      Visual map detailing the multi-touch customer journey from digital social discovery through retail conversion and
      subscription retention.
    data:
      items:
        - label: Social Media Discovery
          stage: Awareness & Discovery
          description: Top-of-funnel social discovery through TikTok creators and viral hashtag trends
          channel: TikTok / Social Media
          touchpoints:
            - Organic creator taste tests and recipes
            - 'Hashtags like #OlipopPartner generating viral views'
            - Lifestyle micro-influencer product placements
        - label: First Impulse Trial
          stage: First Trial & Evaluation
          description: Low-friction first purchase via impulse grocery pickup or online affiliate discount codes
          channel: Retail Cooler / Online Store
          touchpoints:
            - Single-can chilled purchase at Target or Walmart
            - Affiliate creator 15% discount promo codes
            - Mixed flavor sampler variety packs online
        - label: Grocery Restock Routine
          stage: Repeat Purchase
          description: Conversion into habituated soda replacement for household consumption
          channel: Physical Retail / Amazon
          touchpoints:
            - Routine grocery restocking during weekly shopping
            - Amazon multi-pack orders for household delivery
            - Seasonal flavor releases and cultural collaborations
        - label: Direct Subscription Home Delivery
          stage: Retention & Expansion
          description: High-value recurring direct-to-consumer subscription and multi-product exploration
          channel: DTC Website
          touchpoints:
            - Automated recurring subscribe-and-save delivery
            - VIP customer loyalty rewards and promotions
            - Brand extension into gummies and lifestyle merchandise
        - label: Marketplace Channel Expansion
          stage: Marketplace Search Capture
          description: Amazon Prime repeat replenishment and discovery of limited-edition flavor packs
          channel: Amazon Marketplace
          touchpoints:
            - Direct Prime search replenishment
            - Verified buyer ratings and customer feedback
            - Multi-flavor pack sampling
        - label: Brand Ecosystem Advocacy
          stage: Loyalty & Referral
          description: Engaged customer advocacy and user-generated social content sharing
          channel: Brand Community
          touchpoints:
            - Tagging brand in organic social mocktails
            - Word-of-mouth friend recommendations
            - Seasonal flavor waitlists and drops
    approximationNotes: Journey stages synthesized from affiliate platform case studies and consumer marketing analysis.
