  - id: FM001
    title: Evidence-constrained market hierarchy
    type: pyramid
    summary: >-
      A qualitative hierarchy separates the broad beverage context from OLIPOP's realizable market without implying
      unsupported dollar values.
    data:
      items:
        - label: Broader soft drinks
          value: Context only
          detail: Too broad to serve as OLIPOP TAM without occasion-level switching evidence.
          tone: neutral
        - label: Lower-sugar soda alternatives
          value: Adjacent demand
          detail: Includes consumers substituting away from conventional sugar levels.
          tone: neutral
        - label: Functional beverages
          value: Broad adjacency
          detail: Includes products bought for benefits beyond refreshment.
          tone: neutral
        - label: Functional soda
          value: Immediate category
          detail: Combines familiar soda occasions with functional positioning.
          tone: opportunity
        - label: Prebiotic soda
          value: Core category
          detail: Closest category to OLIPOP's fiber and botanical proposition.
          tone: opportunity
        - label: OLIPOP reachable demand
          value: U.S.-led footprint
          detail: National retailer access, with only limited availability reported in Canada.
          tone: positive
