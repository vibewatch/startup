  - id: FP001
    title: Ordinal Competitive Pressure Map
    type: quadrant
    summary: >-
      Evidence-backed ordinal positions compare functional differentiation with channel or substitution pressure; they
      are not measured market-share scores.
    data:
      xAxis: Functional differentiation (ordinal 1-5)
      yAxis: Channel or substitution pressure on OLIPOP (ordinal 1-5)
      points:
        - label: OLIPOP
          x: 5
          'y': 3
          note: Highest disclosed fiber payload in the assigned comparisons; independent distribution exposure remains.
        - label: Poppi
          x: 2
          'y': 5
          note: Lower disclosed fiber payload but PepsiCo ownership and greater observed Amazon engagement.
        - label: Culture Pop
          x: 3
          'y': 2
          note: Different probiotic mechanism; assigned evidence shows funding but not comparable channel scale.
        - label: Wildwonder
          x: 4
          'y': 2
          note: Combined prebiotic and probiotic proposition; channel scale is unknown.
        - label: Zevia
          x: 1
          'y': 4
          note: No fiber payload, but zero sugar and a lower cited per-can price.
        - label: DIY sparkling water plus fiber
          x: 4
          'y': 3
          note: Customizable fiber at lower estimated cost, offset by lower convenience and no branded flavor system.
    approximationNotes: >-
