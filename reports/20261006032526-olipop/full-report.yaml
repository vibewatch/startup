        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              OLIPOP sells a soda positioned around digestive-health benefits from its proprietary OLISMART fiber and
              botanical blend. The official storefront currently separates the portfolio into a refrigerated 9 g fiber
              line and a shelf-stable 6 g fiber line, indicating a packaged-goods model designed for both cold-chain and
              ambient retail placement rather than a software-like recurring-revenue model. Oakland is consistently
              identified as the headquarters. The founding date is less settled: CompWorth and Tracxn use 2017, while
              Wikipedia uses 2018. That one-year discrepancy is not material to product-market fit, but it should be
              normalized before legal or financing documents rely on a canonical incorporation or operating-start date.
