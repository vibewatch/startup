company:
  name: OLIPOP
chapter:
  number: 1
  title: Company Overview
  summary: >-
    OLIPOP is an Oakland-based private functional-soda company built around a
    founder-led product and brand, with a reported 2025 Series C valuation of
    $1.85 billion. The assigned public record supports strong retail and product
    milestones but does not reconcile founding year, cumulative funding,
    company-wide revenue, headcount, governance, or current legal exposure.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      OLIPOP sells a soda positioned around digestive-health benefits from its
      proprietary OLISMART fiber and botanical blend. The official storefront
      currently separates the portfolio into a refrigerated 9 g fiber line and
      a shelf-stable 6 g fiber line, indicating a packaged-goods model designed
      for both cold-chain and ambient retail placement rather than a software-like
      recurring-revenue model. Oakland is consistently identified as the
      headquarters. The founding date is less settled: CompWorth and Tracxn use
      2017, while Wikipedia uses 2018. That one-year discrepancy is not material
      to product-market fit, but it should be normalized before legal or financing
      documents rely on a canonical incorporation or operating-start date.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founder leadership and governance visibility
    body: >-
      Publicly visible leadership remains concentrated in co-founders Ben
      Goodwin and David Lester. Goodwin is identified as CEO and formulator in
      the 2026 campaign announcement, while Lester is consistently identified as
      co-founder. This pairing supplies unusually direct founder-product fit:
      product formulation, category narrative, and executive authority remain
      closely linked. It also creates key-person exposure because the assigned
      evidence does not provide a reliable current executive roster, board
      committee structure, ownership schedule, or succession plan. Tracxn
      publishes a board list, but duplicated founder names and limited role
      context make it insufficient as a definitive governance record.
    claimRefs: [CO001, CO006]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital history and scale signals
    body: >-
      The best-corroborated financing marker is a $50 million Series C announced
      in February 2025 at a reported $1.85 billion valuation. Cumulative funding
      is not reconciled: Tracxn reports $243 million over five rounds, whereas
      FundedIQ reports $80 million over two disclosed rounds. Those totals likely
      reflect different round inclusion and normalization rules, so neither
      should be treated as cash available. Scale estimates are similarly
      non-comparable. Public sources mix company revenue, retailer GMV and
      employee bands; the most defensible reading is that OLIPOP has substantial
      national distribution, while audited company-wide revenue, current
      headcount, gross margin, cash and operating cash flow remain unavailable.
    claimRefs: [CO011, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: milestone-readthrough
    title: Milestones and diligence read-through
    body: >-
      The milestone sequence shows a rapid progression from seed financing
      through national brand scale, shelf-stable product development and a 2026
      national creative refresh. Historical setbacks also matter: the founders'
      predecessor beverage, Obi, was sold after failing to gain traction,
      illustrating that the current outcome followed an earlier unsuccessful
      concept rather than a frictionless launch. The 2026 campaign and packaging
      refresh demonstrate continued brand investment, but the assigned adverse
      search returned no retained source on lawsuits or regulatory proceedings.
      That is an evidence gap, not proof of a clean record; current docket,
      claims-substantiation and regulatory checks remain necessary before an
      investment decision.
    claimRefs: [CO007, CO008, CO009, CO010, CO012]
