company:
  name: "OLIPOP"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "OLIPOP's product architecture combines a refrigerated 9g-fiber line with a shelf-stable 6g-fiber line, while its operating controls rely on approved suppliers, externally audited manufacturing facilities, process-authority review, and third-party batch testing. The public record supports the control design and current product split, but not clinical efficacy, co-manufacturer concentration, or independently verified DTC performance."
sections:
  - id: "product-and-format-architecture"
    title: "Product and Format Architecture"
    body: "OLIPOP is delivered as a consumer packaged beverage rather than a software product: the customer job is to substitute a familiar soda occasion with a product marketed as lower in sugar and higher in fiber. The current official surface presents two operating formats, an original refrigerated 9g-fiber line and a shelf-stable 6g-fiber line. That split is strategically important because it changes where the product can be stored and merchandised, while also changing the fiber formulation and quantity. Secondary reporting says the shelf-stable formula replaces two inulin inputs with acacia and guar fibers and carries roughly 30% less fiber, so the two lines should not be treated as nutritionally identical."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "quality-and-release-controls"
    title: "Quality and Release Controls"
    body: "The strongest technical evidence concerns process governance rather than a proprietary manufacturing breakthrough. OLIPOP says approved ingredient suppliers must maintain preventive controls, good manufacturing practices, traceability, recall readiness, and proper storage and handling. It also says every production facility is GFSI-certified and externally audited, while formulas and processes receive review from an FDA-recognized third-party authority. Finished batches are described as undergoing accredited third-party laboratory testing that includes heavy-metal screening. These are meaningful control layers, but they remain company-issued descriptions: the assigned evidence does not disclose audit reports, laboratory results, facility identities, failure rates, recall simulations, or supplier concentration."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
  - id: "deployment-commerce-and-roadmap"
    title: "Deployment, Commerce, and Roadmap Signals"
    body: "Deployment occurs through both retail formats and direct-to-consumer commerce. The 2026 packaging refresh was concentrated on the shelf-stable 6g line, with the refrigerated 9g line left unchanged, indicating that ambient distribution is the current presentation and merchandising focus. A designer portfolio describes work on OLIPOP's mobile funnel, product-detail pages, checkout, and subscription dashboard and claims large conversion and subscription-rate gains; those figures are useful practitioner evidence but are not an independent benchmark or an audited company disclosure. Product leadership also changed in 2026, with reporting that founder Ben Goodwin moved toward innovation while Christian Patiño Webb assumed the CEO role, creating a clearer split between product development and operating scale."
    claimRefs:
      - "CE003"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "differentiation-and-diligence-limits"
    title: "Differentiation and Diligence Limits"
    body: "Publicly visible differentiation is a bundle of formulation, format flexibility, quality-control claims, brand design, and channel execution rather than a demonstrated patent or software moat. A branding consultancy's retrospective says OLIPOP devoted most of its initial capital to branding, consistent with the importance of packaging and nostalgia to the proposition, but that historical spending figure is not independently corroborated here. The company also extended the brand into gummies and lip balm in 2026, suggesting that consumer recognition can travel beyond beverages; the evidence does not establish durable cross-category economics. Most importantly, this source pool contains no peer-reviewed human efficacy study, technical patent record, named co-manufacturer map, or independently verified digital performance dataset."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE015"
callouts:
  - calloutType: "risk"
    title: "Control Claims Are Not Control Evidence"
    body: "The disclosed supplier, facility, process-review, and batch-testing layers are directionally reassuring, but underwriting still requires the underlying certificates, audit exceptions, laboratory methods, batch-failure history, recall tests, and co-manufacturer concentration."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
  - calloutType: "insight"
    title: "Treat DTC Metrics as a Practitioner Claim"
    body: "The portfolio-reported conversion and subscription improvements indicate a potentially material commerce redesign, but they lack an independently disclosed measurement window, traffic denominator, attribution method, and company confirmation."
    claimRefs:
      - "CE010"
      - "CE011"
