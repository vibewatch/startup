  - id: "capitalization-and-valuation-context"
    title: "Capitalization History and Valuation Context"
    body: |
      OLIPOP's capital trajectory reflects rapid expansion from a regional Northern California brand into a nationally distributed enterprise valued at $1.85 billion. Seed funding in 2019 of $2.5 million was followed by an October 2021 Series B round of $39.8 million at a $200 million post-money valuation, led by Monogram Capital Partners alongside prominent celebrity backers. In February 2025, the company closed its Series C round, securing $50 million led by J.P. Morgan Private Capital's Growth Equity Partners at a $1.85 billion post-money mark. Cumulative disclosed funding reached between $95 million and $243 million depending on whether secondary share sales and growth equity tranches are aggregated, with commercial databases confirming an active institutional cap table including Raptor Group and Fifth Down Capital.

      From a valuation discipline perspective, the $1.85 billion post-money Series C represents a trailing revenue multiple of approximately 4.6x on 2024 sales exceeding $400 million. This multiple represents a significant premium relative to mature public beverage conglomerates such as Coca-Cola (approx. 5.5x EV/Sales) and Keurig Dr Pepper (approx. 3.2x EV/Sales), yet remains defensible for a category disruptor expanding retail footprint past 65,000 doors while generating positive operating income. Private secondary prints observed in mid-2026 around $2.1 billion demonstrate constructive private liquidity, though lack of an active S-1 filing indicates management is preserving strategic optionality between an initial public offering and a trade sale to beverage conglomerates.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
