  - id: "scenario-analysis-and-diligence-roadmap"
    title: "Scenario Analysis, Exit Pathways, and Diligence Roadmap"
    body: |
      A three-scenario financial and exit framework establishes an intrinsic valuation range spanning $1.20 billion to $3.00 billion across base, bull, and bear cases. In the Base Case ($2.00 billion valuation, 50% probability), OLIPOP delivers high-teens retail volume growth, manages the Somers litigation through a modest structured settlement without damaging core trademark equity, successfully expands its 6g shelf-stable line, and executes an IPO or strategic sale at 3.5x to 4.0x forward sales. In the Bull Case ($3.00 billion valuation, 25% probability), international market expansion into Canada, Asia, and Australia accelerates top-line growth past $700 million, multi-category brand extensions such as gummy supplements and lip balms capture incremental wallet share, and an acquirer pays a strategic premium exceeding 5.0x sales.

      Under the Bear Case ($1.20 billion valuation, 25% probability), adverse judicial or regulatory rulings in the Somers litigation mandate severe labeling revisions that curtail consumer willingness to pay, competitor price discounting erodes gross margins, and growth slows below 10%, causing exit multiples to compress to 2.0x sales. Key diligence priorities prior to direct capital commitment include obtaining audited FY2024–FY2025 financial statements (specifically gross margins and operating cash flow), reviewing court records and proposed settlement terms in Somers v. Olipop, Inc., evaluating retailer-level scan data for volume repeat rates, and auditing co-packing master service agreements for unit manufacturing cost stability.
