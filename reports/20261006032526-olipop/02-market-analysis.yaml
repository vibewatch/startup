company:
  name: "OLIPOP"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    OLIPOP competes at the intersection of soft drinks, lower-sugar alternatives,
    functional beverages, and prebiotic soda, with national retail reach but only
    limited evidence of international availability. The assigned evidence supports
    demand and distribution signals, not a defensible absolute TAM, SAM, or SOM.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable market should be bounded more narrowly than all non-alcoholic
      beverages. OLIPOP's core offer is soda with a proprietary fiber and botanical
      blend, sold in refrigerated 9 g-fiber and shelf-stable 6 g-fiber lines. That
      places the company directly in functional and prebiotic soda, while adjacent
      spend includes lower-sugar soda, sparkling water, kombucha, and other
      functional drinks. Conventional full-sugar and diet soda are the principal
      status-quo substitutes because the product deliberately uses familiar soda
      formats and flavors. Alcoholic drinks, supplements, and unrelated wellness
      products are excluded from the core market even when they compete for a
      broader health-and-wellness budget. This boundary prevents a broad beverage
      headline from being mistaken for OLIPOP's realistically addressable demand.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM004"
      - "CM010"
    tableRefs:
      - "TM001"
    figureRefs:
      - "FM001"
  - id: "sizing-evidence"
    title: "Evidence-constrained sizing"
    body: >-
      The assigned sources do not provide a transparent, absolute dollar estimate
      for U.S. prebiotic soda, so an investment-grade TAM/SAM/SOM cannot be stated.
      Mosaic instead reports relative demand signals: an OLIPOP demand index of 50,
      latest growth of -28.6%, 6.5% share of search, and a 43.8% growth signal for
      its much broader soft-drinks category. Mosaic explicitly says these values
      are indexed or relative and that no absolute search volumes are displayed.
      Distribution supplies a separate reach lens: Wikipedia reports availability
      through more than 65,000 U.S. retailers. These measures are directionally
      useful but are not mutually convertible; search interest is not revenue,
      category growth is not company growth, and store count is not sell-through.
    claimRefs:
      - "CM003"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM002"
  - id: "buyers-and-adoption"
    title: "Buyer, payer, and adoption path"
    body: >-
      The end consumer is both user and payer in direct-to-consumer purchases, while
      retailers act as channel gatekeepers and category-budget owners for shelf
      access, promotion, and replenishment. Assigned third-party material emphasizes
      health-conscious younger consumers, traditional-soda switchers, and shoppers
      seeking flavor without conventional sugar levels. Adoption therefore depends
      on a sequence: awareness and trial, taste acceptance, repeat purchase, and
      reliable retail availability. OLIPOP's shelf-stable line broadens placement
      beyond refrigerated cases, while its reported national retail footprint lowers
      access friction. The evidence does not disclose account-level velocity,
      repeat-purchase cohorts, retailer concentration, or trade-spend economics, so
      distribution breadth cannot be treated as proof of durable consumer pull.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM011"
      - "CM012"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Flavor, nostalgia, lower sugar, functional positioning, and expanded retail
      availability are the clearest adoption drivers in the assigned evidence.
      Accio reports that 61% of functional-beverage drinkers prioritize flavor
      quality, although its underlying survey method is not disclosed. OLIPOP's
      2026 national campaign and packaging refresh reinforce the familiar-soda
      framing rather than relying only on health claims. Constraints are material:
      one low-reputation analysis flags a roughly $2.50-per-can premium, Mosaic's
      latest demand signal is negative, and a secondary source reports a class
      action challenging digestive-health marketing. The legal report lacks a
      primary court record in this pool. Valuation should therefore reward verified
      repeat demand and velocity, not category narratives or distribution alone.
    claimRefs:
      - "CM005"
      - "CM007"
      - "CM011"
      - "CM013"
      - "CM015"
      - "CM016"
callouts:
  - calloutType: "risk"
    title: "Do not capitalize a broad category headline"
    body: >-
      The evidence set contains indexed demand measures and reach proxies, but no
      transparent absolute market value. Underwriting should wait for auditable
      category sales, retailer velocity, repeat purchase, and channel economics.
    claimRefs:
      - "CM003"
      - "CM006"
      - "CM010"
