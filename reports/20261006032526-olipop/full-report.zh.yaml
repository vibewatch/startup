      - number: '4.3'
        title: 公开增长、资本充足度与尽调投资判断
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 的商业化进程快速提速：收入从 2019 年推出时不足 $1 million，增至 2020 年 $8.6 million、2021 年 $29.7 million、2022 年 $73.4
              million、2023 年 $200 million，并在 2024 年超过 $400 million；管理层公开指引预计 2025 年约为 $500 million。关键是，管理层确认业务在 2024
              年初实现经营盈利，缓解了风险投资支持的饮料初创公司常见的持续烧钱问题。2025 年 2 月完成由 J.P. Morgan Private Capital 的 Growth Equity Partners 主导的
              $50 million Series C 后，资本充足度进一步增强，投后估值为 $1.85 billion，累计股权融资约 $243 million。全公司员工数约为 195 至 373
              人，分布于运营、地推销售和营销，并以远程员工为主。从投资判断看，OLIPOP
              是具备机构级质量的增长资产，拥有强劲的内生现金创造能力；但私营公司披露不透明限制了最终财务核验，具体包括缺少经审计财务报表、贸易支出扣减未量化，以及关于纤维功效的消费者集体诉讼带来的或有负债。
