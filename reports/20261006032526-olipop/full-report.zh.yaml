        - label: 运营费用：营销、远程员工与分销
        - label: 净运营盈利（2024 年初达成）
    approximationNotes: 流程架构对商业转化机制建模：从零售总需求经过扣除项，最终到达运营利润。零售商毛利与毛利率百分比代表高端饮料行业的标准替代指标。
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI007
      - CI010
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从品牌主张到渠道交付，分六层展示有公开证据支持的产品与运营体系。
    data:
      layers:
        - label: 消费者主张
          detail: 以熟悉口味和消化支持为卖点的低糖高纤维汽水。
          modules:
            - 2-5g 糖含量定位
        - label: 产品形态架构
          detail: 冷藏 9g 与常温 6g 产品线分别满足不同的储存和陈列需求。
          modules:
            - 当前两种纤维产品线形态
        - label: 原料治理
          detail: 要求获批供应商维持预防、追溯、召回、储存与处理控制。
          modules:
            - 供应商资质要求
        - label: 制造治理
          detail: 生产设施据描述已获 GFSI 认证、接受外部审计，并按 FDA GMP 标准运营。
          modules:
            - 设施认证与审计
        - label: 验证与放行
          detail: 第三方机构审查配方与流程，认可实验室测试每个批次。
          modules:
            - 流程审查与批次测试
        - label: 品牌与渠道交付
          detail: 包装、零售形态和 DTC 订阅体验将配方转化为客户触达。
          modules:
            - 包装体系与商业流程
    approximationNotes: 这是功能性证据图，而非实体工厂或系统图；未披露的供应商、代制造商、软件供应商和数据流被有意省略。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程与获客循环图
    type: journey-map
    summary: 可视化展示客户从数字社交发现，到零售转化与订阅留存的多触点旅程。
    data:
      items:
        - label: 社交媒体发现
          stage: 认知与发现
          description: 借助 TikTok 创作者和病毒式标签趋势完成漏斗顶部的社交发现
          channel: TikTok / 社交媒体
          touchpoints:
            - 创作者自然试饮与配方分享
            - '通过 #OlipopPartner 等标签获得病毒式浏览量'
            - 生活方式微型影响者的产品植入
        - label: 首次冲动尝试
          stage: 首次尝试与评估
          description: 靠冲动式杂货提货或线上联盟折扣码促成低门槛首次购买
          channel: 零售冷柜 / 网上商店
          touchpoints:
            - 在 Target 或 Walmart 单罐冷藏购买
            - 联盟创作者 15% 折扣促销码
            - 线上混合口味试饮组合包
        - label: 杂货补货习惯
          stage: 重复购买
          description: 转化为家庭消费中习惯性的汽水替代品
          channel: 实体零售 / Amazon
          touchpoints:
            - 每周购物时例行补充杂货
            - 通过 Amazon 下单多包装并配送到家
            - 季节性口味发布与文化合作
        - label: 直营订阅送货到家
          stage: 留存与扩张
          description: 高价值的周期性直营订阅，以及多产品探索
          channel: DTC 网站
          touchpoints:
            - 自动周期性订阅并享受节省优惠的配送
            - VIP 客户忠诚度奖励与促销
            - 品牌延伸至软糖和生活方式商品
        - label: 平台渠道扩张
          stage: 平台搜索捕获
          description: Amazon Prime 重复补货，并发现限量版口味组合包
          channel: Amazon 平台
          touchpoints:
            - 直接通过 Prime 搜索补货
            - 已验证买家评分与客户反馈
            - 多口味组合包试饮
        - label: 品牌生态倡导
          stage: 忠诚与推荐
          description: 活跃客户倡导品牌，并分享用户生成的社交内容
          channel: 品牌社区
          touchpoints:
            - 在自然社交无酒精鸡尾酒内容中标记品牌
            - 朋友口碑推荐
            - 季节性口味候补名单与限时发售
    approximationNotes: 旅程阶段综合联盟平台案例研究与消费者营销分析。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU008
      - CU011
      - CU012
