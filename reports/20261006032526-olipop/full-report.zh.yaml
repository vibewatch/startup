      - number: '3.2'
        title: 产品能力与信任
        blocks:
          - type: paragraph
            body: >-
              指定比较一致认为，OLIPOP 的区别在于纤维，而不是独占的饮用场景。OLIPOP 当前官方页面展示冷藏 9 g 纤维线和常温 6 g 纤维线；SugarMinder 和 HealthRx 将核心 9 g 产品与
              Poppi 的 2 g、Zevia 的 0 g 相比。其他竞争者改变了机制，而非匹配同等剂量：Culture Pop 强调活性益生菌，Wildwonder 结合益生元和益生菌，Zevia
              则去除糖和热量但不含纤维。这支持配方层面的区别，但不是临床或监管护城河。资料池没有一手法律记录、受控的正面对比产品测试、零售商评分卡或独立的品牌健康宣称依据。因此，矩阵将未经支持的信任、合规和感官字段标为未知。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
