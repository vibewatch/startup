      - number: '4.2'
        title: 成本结构、渠道经济性与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              该品牌的成本结构反映了通过全国冷链和常温分销网络扩张高增长功能饮料的运营现实。主要销售成本包括功能性原料（尤其是由益生元纤维、植物成分和果汁组成的专有 OLISMART
              配方）、铝制饮料罐、合同代包装费用和多节点运输。运营费用主要投向零售商贸易支出（包括进场费、促销折扣和端架陈列费）、全国效果营销及创作者合作。OLIPOP
              的市场进入效率差异在于，在扩大门店前就保持极高的零售销售速度：仅覆盖 28,000 个零售点便实现年化收入超过 $200 million，门店数明显少于传统 CPG
              基准通常要求的规模。此外，社交创作者活动的千次曝光成本（CPM）约为 $0.61，为漏斗顶部带来消费者拉力，减少了对传统电视 ATL 广告的依赖。
