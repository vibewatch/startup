  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管审查与健康宣称广告诉讼
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 处于高度受审查的功能饮料品类，品牌定位和较高零售价（单罐 $2.49 至 $3.29）很大程度依赖其宣传的消化健康功效。2025 年 12 月，原告在美国纽约东区联邦地区法院提起 Somers v.
              Olipop, Inc.，指控公司就益生元肠道健康宣称和纤维功效进行欺骗性营销、消费者欺诈和虚假广告。案卷确认 Jordan Somers 于 2026 年 4 月 8
              日提交不妨碍再次起诉的自愿撤诉通知，Ramon E. Reyes, Jr. 法官于 2026 年 4 月 9 日下达电子撤诉令，但底层风险仍在。持续至 2026 年 8
              月的第三方法律监测显示，集体诉讼脆弱性仍然存在；Poppi $8.9 million 益生元汽水和解等竞争者先例，凸显了若宣称被重新提起诉讼或遭 FTC、FDA
              等监管机构追查，公司可能承担重大财务风险及强制标签修改。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
