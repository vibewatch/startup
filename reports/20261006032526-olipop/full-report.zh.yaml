        - OLIPOP 按美元销售额和销量增长计，是美国最大的非酒精饮料品牌
        - 全国财经报道引用 Circana / SPINS 零售联合数据
        - 零售扫描增长放缓至低于碳酸软饮料行业整体基线
      - - 论点：资本效率
        - 公司在 2024 年初实现运营盈利，收入超过 $400M
        - $50M 的 C 轮融资用于平台扩张，而非填补运营现金消耗
        - 运营现金流转负，需要稀释性过桥融资
      - - 反论点：法律审查
        - 联邦消费者集体诉讼挑战其核心消化健康与糖分营销表述
        - Somers v. Olipop, Inc.，案件 1:2025cv06933 已在 EDNY 提起；竞争对手 Poppi 正参与和解谈判
        - 诉讼被驳回且不得就同一诉求重新起诉，法院确认益生元标签结构有效
      - - 反论点：倍数压缩
        - 私募市场 4.6 倍销售额倍数高于成熟上市饮料行业交易中位数
        - 上市饮料龙头的交易倍数为销售额的 2.5x 至 4.5x；存在退出倍数压缩风险
