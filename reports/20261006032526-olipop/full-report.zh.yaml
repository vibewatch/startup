            body: 在 2024 年初实现公司自述的经营盈利，同时将销售额扩大至超过 $400 million，使 OLIPOP 有别于依赖资本的饮料同业。高门店级动销让公司相较传统 CPG 分销打法以更高资本效率达到规模。
