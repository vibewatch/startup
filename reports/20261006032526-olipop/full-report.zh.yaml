      - number: '3.3'
        title: 定价、包装与渠道力量
        blocks:
          - type: paragraph
            body: >-
              公开价格观察按渠道区分，并非实际净价。HealthRx 报告 OLIPOP 单罐约 $2.49-$2.99、Poppi 单罐 $1.99-$2.49；SugarMinder 报告 OLIPOP
              $2.50-$3.50、Poppi $2.50-$3.00、Zevia $1.00-$1.50；两份比较都没有建立共同的零售商和日期。MetricsCart 采用了不同分母——混合产品和包装规格的 Amazon
              平均挂牌价——并报告 2026 年 7 月 13-26 日期间 OLIPOP 为 $15.03、Poppi 为 $19.60。在同一数字货架上，两品牌平均评分都是 4.4 星，但 Poppi 约有 380,000
              条评价，而 OLIPOP 为 220,000 条；Poppi 新增挂牌 8 个，OLIPOP 只有 1 个。这些信号偏向 Poppi 的线上可见度，但 MetricsCart 仍得出结论：两品牌在 Amazon
              上都没有明确的整体优势。
            claimRefs:
