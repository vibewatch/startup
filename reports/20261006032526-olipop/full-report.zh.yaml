      - number: '3.4'
        title: 切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 披露的纤维剂量和双产品线包装架构形成了清晰的货架定位，但证据没有证明存在合同锁定或专有的消费者触达路径。HealthRx 描述了一种自制气泡水加纤维的替代方案，每份约
              $0.40-$0.60，并称散装菊粉每克纤维的成本比 OLIPOP 低七到十六倍。在品牌端，PepsiCo 的所有权为 Poppi 带来潜在分销和营销杠杆，但 MetricsCart 同时报告 Poppi
              2026 年上半年美国零售销量下降 3.6%、金额销售下降 3.3%。因此，护城河主要取决于品牌、配方和执行：消费者可以在口味、糖分、纤维、价格和便利性之间多品牌购买，而零售触达和复购仍未量化。
