  - id: FV001
    title: 估值逻辑与建议流程
    type: flow
    summary: 决策链将规模、运营验证、法律风险与倍数纪律连接到最终的跟踪建议。
    data:
      nodes:
        - id: scale
          label: 品类规模（50k+ 个零售门店的 $400M+ 销售额）
          tone: positive
        - id: profitability
          label: 运营验证（2024 年初实现盈利，且 C 轮由 JPM 领投）
          tone: positive
        - id: litigation
          label: 监管与法律风险（Somers v. Olipop EDNY 健康主张诉讼）
          tone: risk
        - id: valuation-mark
          label: 估值纪律（$1.85B C 轮 / $2.1B 二级市场成交价，销售额 4.6 倍）
          tone: neutral
        - id: diligence-gate
          label: 保密尽调门槛（审计毛利率与集体诉讼和解托管）
          tone: risk
        - id: decision
          label: 投资建议：跟踪（尽调完成前暂缓入场）
          tone: neutral
      edges:
        - from: scale
          to: profitability
          label: 展示单位经济模型
        - from: profitability
          to: litigation
          label: 接受产品责任风险检验
        - from: litigation
          to: valuation-mark
          label: 确定倍数安全边际
        - from: valuation-mark
          to: diligence-gate
          label: 设定验证前提
        - from: diligence-gate
          to: decision
          label: 约束入场纪律
    approximationNotes: 展示将经验证的运营指标与待决诉讼连接到估值立场的定性逻辑。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
