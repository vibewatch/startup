      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              在直面消费者购买中，终端消费者既是使用者也是付款方；零售商则是货架进入、促销和补货的渠道守门人及品类预算掌控者。指定的第三方材料重点提到健康意识较强的年轻消费者、从传统汽水转来的消费者，以及希望保留风味但减少传统糖分的购物者。因此，采用过程依次取决于认知与试用、口味接受、重复购买和稳定的零售可得性。OLIPOP
              的常温产品线扩大了冷藏柜以外的陈列空间，据报道的全国零售覆盖也降低了购买阻力。但证据没有披露账户级动销、复购群组、零售商集中度或贸易支出经济性，因此分销广度不能被当作消费者持久拉力的证明。
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              指定证据中最明确的采用驱动因素是风味、怀旧感、低糖、功能定位和零售可得性扩大。Accio 报告称，61% 的功能饮料饮用者优先考虑风味质量，但其底层调查方法没有披露。OLIPOP 的 2026
              年全国活动和包装焕新强化了熟悉汽水的定位，而非只依赖健康宣传。约束也很实质：一份低声誉分析指出每罐约 $2.50 的溢价，Mosaic
              最新需求信号为负，另有二手来源报告一起挑战消化健康营销的集体诉讼。该法律报告在本资料池中缺少一手法院记录。因此，估值应奖励经验证的复购需求和动销，而不是品类叙事或单纯分销。
            claimRefs:
              - CM005
              - CM007
              - CM011
              - CM013
              - CM015
              - CM016
