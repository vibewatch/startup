            body: >-
              OLIPOP 是包装消费饮料，而非软件产品：消费者的需求是用一种主打低糖高纤维的产品，替代熟悉的汽水饮用场景。当前官方页面展示两种运营形态：原始冷藏 9g 纤维线和 6g
