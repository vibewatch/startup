  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与渠道动态
        blocks:
          - type: paragraph
            body: >-
              OLIPOP 采用全渠道包装消费品业务，主要依靠杂货、商超和会员制商店的批发分销，并辅以直面消费者的线上销售。核心产品是益生元软饮，采用两种主要架构：原始冷藏 9g 益生元纤维线和 6g
              常温纤维线。在批发渠道，OLIPOP 通过全国超过 50,000 家零售门店分销，覆盖 Kroger、Publix 等杂货巨头，Whole Foods 等天然食品杂货商，以及 Target、Walmart 和
              Costco 等大型零售商。零售单罐挂牌价通常为 $2.49-$2.99，12 oz；drinkolipop.com 的直面消费者购买则通过 12
              罐混合装或单口味套装销售。数字商务虽是有价值的测试和留存渠道，但第三方分析显示，drinkolipop.com 在 2025 年 GMV 约为 $12 million，说明实体零售批发占公司总营业额的 95%
              以上。
            claimRefs:
