  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场应比所有非酒精饮料更窄。OLIPOP 的核心产品是含专有纤维和植物成分配方的汽水，分为冷藏 9 g 纤维线和常温 6 g
              纤维线。因此其直接市场是功能型和益生元汽水；相邻支出则包括低糖汽水、气泡水、康普茶和其他功能饮料。传统全糖及无糖汽水是主要现状替代品，因为该产品刻意采用熟悉的汽水形态和口味。即便同样争夺更广义的健康与保健预算，酒精饮料、补充剂和无关的健康产品也不属于核心市场。这样的边界能避免把宽泛的饮料市场标题误当作
              OLIPOP 现实可触达的需求。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
