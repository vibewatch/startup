    diligencePath: Run comprehensive multi-jurisdiction docket searches across state superior courts in California and New York.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited FY2024 and FY2025 financial statements specifying gross margin, net operating cash flow, and exact cash
