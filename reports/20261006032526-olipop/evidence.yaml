evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: identity
    missingEvidence: Primary incorporation and first-commercial-sale records that reconcile the 2017 and 2018 founding dates.
    whyItMatters: A canonical formation timeline is needed for legal identity, founder vesting and financing chronology.
    diligencePath: Inspect the certificate of incorporation, initial board consents and first customer invoices.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current executive roster, board composition, committee mandates, ownership schedule and succession plan.
    whyItMatters: Public evidence cannot quantify founder control, investor protections or key-person continuity.
    diligencePath: Request the current cap table, charter, bylaws, voting agreements, board minutes and succession materials.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Audited company-wide revenue, gross margin, cash, operating cash flow, payroll headcount and complete financing
      proceeds.
    whyItMatters: Public estimates cannot support runway, unit-economics or valuation conclusions and use incompatible denominators.
    diligencePath: Reconcile audited statements, bank balances, payroll records and the capitalization ledger through 2026-10-06.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: Current primary records for lawsuits, regulatory actions, recalls and health-claim substantiation disputes.
    whyItMatters: An empty retained result set does not establish the absence of legal or regulatory exposure.
    diligencePath: >-
      Run federal and state docket, FDA, FTC, state attorney general and recall database checks using legal-entity
      aliases.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: absolute-market-size
    missingEvidence: A transparent U.S. functional-soda and prebiotic-soda market value with period, denominator, and methodology.
    whyItMatters: Without absolute category sales and a defensible boundary, TAM, SAM, and SOM would be speculative.
    diligencePath: >-
      Obtain Circana or NielsenIQ category extracts and reconcile category definitions to OLIPOP's actual SKUs and
      channels.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retail-velocity
    missingEvidence: Account-level units per store per week, distribution quality, retailer concentration, and trade-spend economics.
    whyItMatters: Store count alone cannot distinguish durable pull from paid distribution or low-velocity shelf presence.
    diligencePath: Request retailer scorecards, distributor depletion data, and the top-20 account concentration schedule.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: repeat-purchase
    missingEvidence: Cohort repeat-purchase, subscription churn, household penetration, and switching-source data.
    whyItMatters: These measures are needed to separate trial driven by marketing from recurring category adoption.
    diligencePath: Review DTC cohort exports and obtain panel-based repeat and household-penetration data.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: legal-scrutiny
    missingEvidence: >-
      Primary complaint, docket status, alleged class definition, and OLIPOP's filed response for the reported 2026
      class action.
    whyItMatters: A secondary report cannot establish the claims, procedural posture, or probable commercial effect.
    diligencePath: Retrieve the court docket and pleadings, then review them with advertising and food-label counsel.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: adverse-trust-evidence
    missingEvidence: Primary legal, regulatory, and substantiation records for gut-health claims across OLIPOP and direct competitors.
    whyItMatters: >-
      Without primary records, the chapter cannot compare claim durability, settlement scope, or regulatory posture on a
      like-for-like basis.
    diligencePath: >-
      Obtain court dockets, settlement documents, regulator correspondence, and claim-substantiation files for each
      direct brand.
    relatedQuestionRefs:
      - QP006
  - type: enumeration-incomplete
    severity: material
    topic: likely-entrants
    missingEvidence: >-
      Verified formulation, launch timing, retailer access, and early sell-through for incumbent-backed entrants
      including Simply Pop.
    whyItMatters: >-
      Entrant scale could change shelf access and trade-spend requirements, but a passing mention does not establish an
      operating benchmark.
    diligencePath: >-
      Collect official product pages, retailer listings, distributor materials, and Circana or NielsenIQ scanner data
      for entrant launches.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: distribution-and-switching
    missingEvidence: Comparable retailer door counts, velocity, promotional spend, repeat purchase, and account concentration by brand.
    whyItMatters: >-
      These metrics determine whether product differentiation converts into durable shelf space, pricing power, and
      repeat demand.
    diligencePath: >-
      Request customer-level sell-through, retailer scorecards, syndicated scanner data, cohort repeat rates, and
      trade-spend schedules.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Audited GAAP income statement detailing plant-level COGS breakdown, tolling fees, ingredient purchase costs, and
      gross margin percentages.
    whyItMatters: >-
      Gross margin dictates the business's ability to fund rising retail trade promotion spend and endure aggressive
      pricing competition from conglomerate incumbents.
    diligencePath: >-
      Obtain private data room access to historical monthly GAAP P&L statements, co-packing supplier contracts, and
      bill-of-materials cost accounting files.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: trade-spend-deductions
    missingEvidence: >-
      Gross-to-net revenue waterfall detailing annual slotting allowances, promotional discounts, scan-backs, and
      distributor marketing allowances.
    whyItMatters: >-
      High top-line gross revenues can conceal heavy promotional spend and uncollectible retail deductions that compress
      realized net operating cash flows.
    diligencePath: >-
      Request customer-level gross-to-net reconciliation reports for major accounts including Walmart, Target, Costco,
      and Kroger.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: litigation-liability
    missingEvidence: >-
      Formal litigation case filings, motion-to-dismiss rulings, and settlement exposure assessments regarding the
      December 2025 fiber class action.
    whyItMatters: >-
      An adverse verdict or multimillion-dollar settlement could impair brand equity, force packaging and marketing
      redesigns, or create financial liability similar to peer litigation.
    diligencePath: >-
      Engage external regulatory counsel to review court dockets, evaluate class certification exposure, and benchmark
      potential settlement ranges.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Peer-reviewed human efficacy results and independent evidence testing whether disclosed quality controls operate
      effectively.
    whyItMatters: >-
      The functional proposition and safety posture cannot be underwritten from company descriptions and secondary
      summaries alone.
    diligencePath: >-
      Request study protocols and results, regulator correspondence, third-party certificates, audit reports, corrective
      actions, and laboratory trend data.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: manufacturing-resilience
    missingEvidence: >-
      Named co-manufacturers, facility allocation, supplier concentration, capacity headroom, outage history, and
      contingency plans.
    whyItMatters: The control framework does not reveal whether production or critical ingredients have single points of failure.
    diligencePath: >-
      Review supplier and co-manufacturer schedules, volume allocations, business-continuity tests, and alternate-site
      qualification under NDA.
    relatedQuestionRefs:
      - QE003
      - QE006
  - type: missing-source
    severity: material
    topic: dtc-performance
    missingEvidence: >-
      Company-confirmed definitions, measurement windows, traffic denominators, cohort data, and attribution for the
      portfolio-reported conversion and subscription metrics.
    whyItMatters: >-
      A creator portfolio is practitioner signal but cannot establish sustainable commerce performance or incremental
      recurring revenue.
    diligencePath: >-
      Obtain analytics exports, experiment designs, cohort retention, subscription churn, and finance reconciliation for
      the redesign period.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: Direct cohort retention curves, monthly active subscriber counts, churn percentages, and repeat purchase rates.
    whyItMatters: >-
      Without audited retention and churn data, long-term customer lifetime value and DTC economics cannot be rigorously
      verified.
    diligencePath: >-
      Request confidential e-commerce cohort retention metrics and subscriber churn analyses under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: retail-account-concentration
    missingEvidence: >-
      Specific percentage revenue breakdown across top retail accounts including Target, Walmart, and wholesale
      distributor UNFI/KeHE.
    whyItMatters: >-
      High account concentration exposes OLIPOP to renegotiated slotting terms, inventory de-listings, and wholesale
      margin squeeze.
    diligencePath: Obtain customer concentration disclosures from management presentations or audited financial schedule reviews.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: co-packer-concentration
    missingEvidence: Specific co-packing agreements, production facility locations, and bottling volume capacity distribution.
    whyItMatters: >-
      Concentrated co-packer reliance creates catastrophic operational interruption exposure in the event of
      contamination, equipment failure, or facility outages.
    diligencePath: Request management disclosure of active co-packing master service agreements and facility audit reports.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: ingredient-supplier-concentration
    missingEvidence: >-
      Long-term supply contracts and pricing terms for agricultural prebiotic inputs including inulin, acacia fiber, and
      guar fiber.
    whyItMatters: >-
      Ingredient shortages, crop failures, or tariffs on imported botanicals could disrupt production or compress gross
      margins.
    diligencePath: Review agricultural procurement contracts and multi-sourcing redundancies during management diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: Complete docket entries and discovery transcripts from state-level consumer protection actions.
    whyItMatters: >-
      Confirms whether state attorneys general or class action plaintiffs have initiated secondary civil investigative
