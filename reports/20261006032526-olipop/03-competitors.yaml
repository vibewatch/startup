chapter:
  number: 3
  title: "Competitors"
  summary: "OLIPOP's strongest product-level distinction is its disclosed fiber payload, but that advantage sits in a low-switching-cost beverage set where Poppi has PepsiCo ownership, greater Amazon review volume, and faster observed listing expansion. Assigned evidence supports a broad substitute set and point-in-time pricing comparisons, but not a complete share, realized-price, or retailer-door benchmark."
sections:
  - id: "landscape-and-peer-scale"
    title: "Landscape and Peer Scale"
    body: >-
      The buyer can satisfy the same refreshment or wellness job through direct prebiotic
      sodas, probiotic or synbiotic drinks, zero-sugar soda, incumbent-backed launches,
      sparkling water, or a do-it-yourself fiber drink. Latterly's comparison names Poppi,
      Culture Pop, Health-Ade Pop, Wildwonder, Zevia, and several sparkling-water or
      fermented-beverage alternatives, while Tracxn identifies Culture Pop as a funded
      direct peer. Scale evidence is uneven: Wikipedia reports OLIPOP in more than 65,000
      retailers, MetricsCart reports PepsiCo acquired Poppi for $1.95 billion in May 2025,
      and Tracxn reports $43.7 million of funding for Culture Pop. Comparable funding,
      revenue, door-count, and share data are unavailable for most alternatives, so the
      profile table preserves those fields as unknown rather than implying equal scale.
    claimRefs:
      - "CP010"
      - "CP012"
      - "CP013"
      - "CP016"
    tableRefs:
      - "TP001"

  - id: "product-capability-and-trust"
    title: "Product Capability and Trust"
    body: >-
      The assigned comparisons consistently distinguish OLIPOP through fiber rather than
      through an exclusive consumption occasion. OLIPOP's current official surface presents
      a refrigerated 9 g fiber line and a shelf-stable 6 g line; SugarMinder and HealthRx
      compare the core 9 g offer with Poppi at 2 g and Zevia at 0 g. Other rivals change the
      mechanism instead of matching that dose: Culture Pop emphasizes live probiotics,
      Wildwonder combines prebiotics and probiotics, and Zevia removes sugar and calories
      without a fiber payload. This supports a formulation distinction, not a clinical or
      regulatory moat. The pool contains no primary legal record, controlled head-to-head
      product test, retailer scorecard, or independent substantiation of brand health claims.
      The matrix therefore labels unsupported trust, compliance, and sensory cells as unknown.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP011"
    tableRefs:
      - "TP002"

  - id: "pricing-packaging-and-channel"
    title: "Pricing, Packaging, and Channel Power"
    body: >-
      Public price observations are channel-specific rather than realized net pricing.
      HealthRx reports single-can bands of roughly $2.49-$2.99 for OLIPOP and $1.99-$2.49
      for Poppi, whereas SugarMinder reports $2.50-$3.50 for OLIPOP, $2.50-$3.00 for Poppi,
      and $1.00-$1.50 for Zevia; neither comparison establishes a common retailer and date.
      MetricsCart measures a different denominator—average Amazon listing price across mixed
      products and pack sizes—and reports $15.03 for OLIPOP against $19.60 for Poppi during
      July 13-26, 2026. On that same observed digital shelf, both brands averaged 4.4 stars,
      but Poppi had about 380,000 reviews versus 220,000 for OLIPOP and launched eight new
      listings versus one. Those signals favor Poppi's online visibility, while MetricsCart
      still concluded that neither brand held a clear overall Amazon advantage.
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
    tableRefs:
      - "TP003"

  - id: "switching-cost-and-moat-durability"
    title: "Switching Cost and Moat Durability"
    body: >-
      OLIPOP's disclosed fiber dose and two-line packaging architecture create a legible
      shelf proposition, but the evidence does not establish contractual lock-in or a
      proprietary route to the consumer. HealthRx describes a do-it-yourself sparkling-water
      and fiber alternative at roughly $0.40-$0.60 per serving and says bulk inulin is seven
      to sixteen times cheaper per gram of fiber than OLIPOP. At the branded end, PepsiCo
      ownership gives Poppi potential distribution and marketing leverage, yet MetricsCart
      also reports Poppi's US retail volume down 3.6% and dollar sales down 3.3% in the first
      half of 2026. The resulting moat is best characterized as brand, formulation, and
      execution dependent: consumers can multi-home among taste, sugar, fiber, price, and
      convenience propositions, while retailer access and repeat purchase remain unmeasured.
    claimRefs:
      - "CP010"
      - "CP011"
      - "CP014"
      - "CP015"
    figureRefs:
      - "FP001"

