  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-register
      missingEvidence: Nonpublic FAA issue papers, closure status for remaining certification work, and a clean public outcome memo for the Moog matter.
      whyItMatters: These materials would separate already-cleared risks from still-open gating items and quantify the legal overhang more precisely.
      diligencePath: Request the certification program master schedule, open issue log, and any settlement or disposition papers associated with the Moog case.
      relatedQuestionRefs: [QR001, QR003, QR021]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: governance-depth
      missingEvidence: Current board composition, committee structure, succession planning, and delegated operating authority below the founder.
      whyItMatters: Governance opacity amplifies key-person and execution risk while the company is still certifying and scaling a safety-critical product.
      diligencePath: Ask management for the board roster, committee charters, executive org chart, and founder succession or contingency plan.
      relatedQuestionRefs: [QR023]
    - type: private-evidence-only
      severity: material
      topic: commercialization-conversion
      missingEvidence: Signed procurement values, retrofit throughput assumptions, partner service-level commitments, and reservation-to-order conversion cohorts.
      whyItMatters: Public partnership names and reservations do not by themselves prove revenue timing, unit economics, or channel durability.
      diligencePath: Request backlog waterfall, partner statements of work, delivery schedule, and conversion metrics for reservations and institutional programs.
      relatedQuestionRefs: [QR015, QR018, QR030]
