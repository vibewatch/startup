      - CR043
      - CR044
      - CR046
    tableRefs:
      - TR005
    figureRefs:
      - FR002
  - id: legal-and-governance
    title: Legal friction and founder concentration raise residual execution risk
    body: >-
      The strongest public adverse legal item remains Moog's 2022 federal case against
      Skyryse, Misook Kim, and Robert Pilkington. The CourtListener docket shows that
      Moog filed a complaint and immediately sought preliminary injunctive relief and a
      temporary restraining order, followed by stipulated data-preservation and expedited
      discovery work. Without access to the sealed materials or a clean public outcome
      summary, investors cannot treat the matter as either thesis-breaking or irrelevant.
      What it does show is that supplier- and IP-related friction has already surfaced in
      Skyryse's operating history, and that the counterparty was not a trivial actor:
      Moog describes itself as a global aerospace and defense technology company.

      Governance visibility is also thinner than one would want for a company at this
      stage. Skyryse's public materials are rich on founder narrative, advisory bench, and
      mission, but still light on a detailed board map, committee structure, or named
      operating bench beyond the most visible leadership faces. At the same time, the
      careers and jobs pages show active hiring across certification, systems test,
      manufacturing, supply chain, growth, and government affairs. That combination is not
      necessarily a negative, but it does mean investors are still underwriting a founder-
      centric organization that appears to be building critical operating functions while
      simultaneously trying to certify, manufacture, and commercialize a safety-critical
      aviation platform.
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
    tableRefs:
      - TR004
callouts:
  - calloutType: risk
    title: FAA special conditions make clear that certification is not routine avionics paperwork
    body: >-
      Two separate 2026 special-condition actions show the FAA treating Skyryse's modified
      R66 as a novel fly-by-wire control system that requires additional safety standards,
      not a simple bolt-on modernization of a legacy helicopter.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008]
  - calloutType: risk
    title: Scale-up depends on third parties as much as on Skyryse's own engineering
    body: >-
      United Rotorcraft, Ace Aeronautics, the Army, and CAL FIRE all matter to the
      commercialization narrative, but each relationship remains a dependency that can
      delay or dilute conversion from certification progress into installed, serviced,
      revenue-producing aircraft.
    claimRefs: [CR015, CR017, CR019, CR020, CR021, CR022, CR023, CR046]
  - calloutType: risk
    title: Moog litigation is evidence that supplier and IP execution can become costly distractions
    body: >-
      The 2022 Moog docket does not by itself decide the investment case, but it proves
      that Skyryse has already faced trade-secret-related litigation serious enough to
      prompt TRO and preliminary-injunction filings plus expedited discovery.
    claimRefs: [CR031, CR032, CR033, CR034]
  - calloutType: insight
    title: The Series C bought time, not proof of commercial conversion
    body: >-
      Raising more than $300 million materially improves runway, but the company still has
      to convert reservations, pilots, and institutional partners into certified deployed
      programs rather than interest signals.
    claimRefs: [CR024, CR025, CR026, CR027]
  - calloutType: risk
    title: Public governance visibility still lags the technical and financing ambition
    body: >-
      The public record remains much richer on Mark Groden, advisors, and mission than on
      board structure, succession depth, or a fully disclosed operating bench, which makes
      key-person and organizational-scaling risk hard to underwrite from outside.
    claimRefs: [CR028, CR035, CR036]
