  - id: dependency-and-platform-scaling
    title: Scaling depends on partner execution across retrofit, MRO, and public-sector programs
    body: >-
      Skyryse's commercial path is broader than one helicopter SKU, but that breadth also
      raises dependency risk. The U.S. Army relationship is explicitly a CRADA to develop
      training, interoperability, and optionally piloted capabilities, not a disclosed
      procurement contract. The CAL FIRE relationship is similarly promising but still
      future-facing in the public record: Skyryse's own announcement describes SkyOS as
      being developed for future deployment on firefighting aircraft, while Military +
      Aerospace Electronics frames the work as exploration of optionally piloted or
      remote-controlled aerial firefighting. Those are valuable proof points, but they are
      still pre-scale proofs.

      The field-installation and maintenance path is also partner-dependent. United
      Rotorcraft is slated to provide FAA Part 145 MRO services as Skyryse One shipping
      begins and to support SkyOS integrations on Airbus H125/H130 and Black Hawk
      variants. Ace Aeronautics is positioned as the primary installation hub for Black
      Hawk retrofits. That creates leverage if the partnerships execute well, but it also
      means Skyryse's ability to convert certification into deliveries depends on third
      parties controlling installation slots, maintenance readiness, retrofit quality, and
      customer-facing throughput. In practice, the company must prove not only that SkyOS
      works, but also that a distributed partner network can certify, install, service,
      and support it across multiple aircraft families without creating bottlenecks or
      inconsistent quality.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR045
      - CR046
