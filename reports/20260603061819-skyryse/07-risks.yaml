slug: skyryse
runDate: '2026-06-03'
company:
  name: Skyryse
chapter:
  number: 7
  title: Risks
  summary: >-
    Skyryse's risk profile is dominated by a still-open FAA certification path, bespoke
    fly-by-wire safety requirements, and commercialization that depends on partner-led
    retrofit and institutional procurement rather than already-certified fleet revenue.
    The 2026 FAA special conditions, Moog litigation docket, and ongoing hiring across
    certification, manufacturing, and government-facing roles all indicate that the
    company has meaningful execution work left even after its $300M+ Series C.
sections:
  - id: certification-and-safety-case
    title: Certification is still the gating risk, and the safety case is bespoke
    body: >-
      The clearest risk in the public record is that Skyryse remains in a staged,
      non-final certification process for Skyryse One. Official and independent sources
      agree that the company had reached FAA for-credit flight testing by May 2025, but
      they do not show a completed final approval or certified commercial deliveries by
      run date. The regulatory burden also looks materially more bespoke than a normal
      avionics refresh. In April 2026 the FAA proposed special conditions for flight
      control system annunciation on the modified Robinson R66, explicitly saying the
      existing rotorcraft standards lacked adequate or appropriate safety standards for
      the design. In May 2026 the FAA finalized a second set of special conditions on
      static longitudinal stability, saying the modified aircraft's longitudinal control
      laws could permit neutral or negative static stability and describing the design as
      a four-axis full-authority digital fly-by-wire system with coupled autopilot modes.
      Together, those notices show that certification is not just documentation cleanup;
      Skyryse is asking regulators to approve a materially new control architecture on a
      legacy helicopter platform.

      Independent reporting adds another layer of uncertainty: Aviation Tech Today quoted
      an experienced helicopter pilot who was skeptical that Skyryse's tablet-driven
      automation could safely cover every real-world edge case, including false engine
      failure indications and tail-rotor emergencies. Skyryse counters that it is
      certifying to a very high standard and continues to demonstrate reliability, but
      that answer still leaves investors with a straightforward near-term thesis break:
      if the FAA path slips, if new special conditions appear, or if a high-profile test
      anomaly emerges, revenue timing and adoption credibility both move out at once.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
