  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Certification delay
        - FAA and company milestone updates
        - No disclosed final approval or clear closure path by the next major funding window
        - Re-underwrite timing, revenue start, and capital need
      - - Safety-case regression
        - Test incidents, new special conditions, or public reliability setbacks
        - Material anomaly, fresh regulatory condition, or disclosed edge-case failure
        - Treat as thesis-break until corrective-action burden is understood
      - - Partner-install bottleneck
        - United Rotorcraft / Ace readiness and first-field retrofit evidence
        - No credible service-throughput proof after certification closes
        - Downgrade multi-airframe scale assumptions and margin profile
      - - Development programs fail to convert
        - Army and CAL FIRE status updates
        - Still framed as CRADA / future deployment without funded fleet expansion
        - Remove institutional-conversion upside from base case
      - - Legal / supplier friction returns
        - New litigation, injunction activity, or disclosed supplier dispute
        - New adverse docket activity or similar dispute with critical supplier
        - Escalate IP / sourcing diligence before any follow-on investment
      - - Commercial conversion weakness
        - Deliveries, reservation conversion, and disclosed pricing / procurement evidence
        - Reservations persist without certified deliveries or procurement values
        - Treat retail demand claims as marketing signal rather than revenue support
    notes: >-
      These triggers are designed to be monitorable from public filings, regulatory notices,
