    figureRefs:
      - FR003
  - id: capital-and-commercial-conversion
    title: Large financing reduces runway stress, but commercialization remains capital-intensive and conversion-sensitive
    body: >-
      Skyryse's February 2026 Series C meaningfully reduced immediate financing risk, but
      it did not eliminate the structural capital intensity of the model. The company said
      the round exceeded $300 million and lifted total equity capital above $605 million,
      while the 2025 Form D showed a $192.3 million exempt offering with $167.1 million
      sold to 46 investors. That is real financial support, yet it also shows how much
      capital is required before the business can point to certified production at scale.
      The commercialization story remains heavily mediated by certification timing,
      institutional partner conversion, and retrofit throughput.

      Public demand indicators are encouraging but still imperfect. Skyryse sold out its
      first-edition reservations and continues to accept $2,500 deposits, but final
      aircraft pricing remains undisclosed and reservation momentum is not the same as
      certified deliveries, recognized revenue, or durable fleet utilization. The same
      pattern appears in the broader category context: policy and market sources describe
      simplified controls, retrofit avionics, and optionally piloted aircraft as genuine
      growth themes, but they also emphasize resilient manufacturing, staged autonomy
      adoption, regulatory compliance, and safety-feature investment. That means Skyryse's
      upside is visible, but the path to realizing it is still long and sensitive to any
      certification slip, partner bottleneck, or failure to turn pilots, agencies, and
      operators into repeat-paying deployed customers.
    claimRefs:
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR037
