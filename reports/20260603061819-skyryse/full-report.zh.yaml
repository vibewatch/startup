      - number: '8.3'
        title: 公开市场和私募市场参照点
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给的是区间，不是公式。Joby 和 Archer 尽管仍在大额亏损，市值都显著高于 Skyryse 的私募估值； Eve 与 Skyryse 大致处于同一量级，Vertical
              则远低于它。这些数字告诉投资者，资本市场仍给先进空中交通可选性赋予战略价值， 但并不能告诉我们 Skyryse 的具体模式值一个精确数字。原因在于 Skyryse 主要不是全新设计的空中出租车 OEM。
              它的模式是改装硬件加软件，并把取证杠杆铺到现有机队上。这让公开 eVTOL 市值成为不完美类比，也把更多注意力推向更接近但更不透明的参照， 例如 Reliable Robotics、Merlin
              和其他自主化或航电厂商。从这些相邻公司能得到的最接近教训，不是一个干净倍数， 而是当取证进展、存量机队适用性和战略退出潜力足够可信时，投资者仍会资助不绑定机型的自主化平台。
