      - number: '1.4'
        title: 里程碑、认证路径与早期反向信号
        blocks:
          - type: paragraph
            body: >-
              当前运营叙事主要由认证进展和平台扩展里程碑推动。Skyryse 称，FAA 在 2025 年批准了 SkyOS 飞控计算机的最终设计，2024 年为首架 Skyryse One 颁发 Special
              Airworthiness Certificate，并在 2025 年 5 月前让项目进入计分飞行测试。2026 年，公开监管记录变得更具体：FAA 发布了针对 Skyryse 改装 Robinson R66
              的拟议和最终特殊条件，覆盖飞控告警和静态纵向稳定性。里程碑公告还显示，SkyOS 已经走出 Robinson 平台，进入 Black Hawk 演示、U.S. Army CRADA、CAL FIRE
              消防合作、United Rotorcraft 改装 / MRO 合作，以及 Mitsubishi
              在日本的扩展协议。但公司概况里仍有真实执行风险。截至报告运行日，完整民用认证尚未获批，商业收入基础大多未披露，公开法律案卷还显示 Moog 在 2022 年起诉
              Skyryse，指控涉及前员工的商业秘密问题。即便该案不决定投资逻辑，它也说明供应商和 IP 摩擦已经出现在公司运营历史中。
