        title: 变现模型可见，收入质量不可见
        blocks:
          - type: paragraph
            body: >-
              Skyryse 公开可见的变现从飞机销售和订金开始，而不是已披露的经常性软件收入。最清晰的证据是 Skyryse One 预订漏斗：公司称 First Edition 在六个月内售罄，披露不含定制的入门飞机价格为
              $1.8 million，并继续为下一版本接受 $2,500
              预订，同时最终价格取决于定制和交付时间。这是有用的支付意愿证据，但仍不足以证明已确认收入质量，因为公司也称预订可退款，且没有披露售出多少架、多少预订者转为传统订金，或多少飞机从预订走到正式采购协议。除直接飞机销售外，管理层明确把
              SkyOS 定位为更广的改装和集成平台。Army、CAL FIRE 和 Mitsubishi 公告都指向未来通过国防项目、公共安全现代化和国际渠道关系变现，但这些公告都没有给出合同价值、付款里程碑或收入确认细节。
