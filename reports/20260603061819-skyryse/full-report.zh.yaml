      - number: '4.4'
        title: 结论：下一阶段资金充足，但单位经济尚无法承保
        blocks:
          - type: paragraph
            body: >-
              因此，可支撑的财务结论是好坏参半。进入昂贵的最终认证窗口时，Skyryse
              看起来比许多私营航空航天自主化同行资本更充足；公司也证明了客户或早期采用者至少愿意以高端价格点提交预订。但承保缺口仍大，本章不能把融资动能当作耐久经济性的证据。公开证据仍没有揭示已确认收入、积压订单单位数、预订向正式订单转化、毛利率、现金消耗、现金跑道、债务义务、客户集中度或渠道经济性。反向法律记录也重要：Moog
              2022 年诉讼显示，供应商和 IP 摩擦已经出现过一次；在时间本来就决定成败的类别里，这可能转化为分心、法律开支和项目延误风险。认证未闭合、公开证据未证明交付、收入确认和至少某种利润率结构之前，Skyryse
              更适合被视为资金充足但仍需重度尽调的认证阶段航空平台，而不是财务质量已经得到证明的企业。
