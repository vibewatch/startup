  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Skyryse 拥有的是改装自动化切口，不是完整 AAM 技术栈
        blocks:
          - type: paragraph
            body: >-
              Skyryse 合理的市场边界，比常见的空中出租车或 AAM 标题窄得多。公司目前卖的不是城市空中出租车网络、垂直起降机场基础设施，也不是从零设计的 eVTOL
              飞机。公开记录展示的是一套软件定义飞控和自动化平台，从基于 Robinson R66 的 Skyryse One
              起步，目标是扩展到现有直升机和相邻飞机。因此，最相关的支出池是可改装飞控、简化驾驶舱硬件和软件、安全自动化、认证工程，以及旧机体上的安装 / MRO 工作。已公布的扩展点都强化了这一判断：SkyOS
              被包装为不绑定机型；FAA 特殊条件对应的是改装 R66 的补充认证路径；United Rotorcraft 被点名负责 Airbus 和 Black Hawk 集成；Ace 被定位为 Black Hawk
              改装枢纽；Mitsubishi 则被描述为日本现有飞机现代化的渠道。更广义的 AAM 生态仍重要，因为政策和资本都在流向更自动化的飞行，但 Skyryse
              只有在改装切口完成认证并具备可重复性后，才应捕捉这部分相邻机会。
