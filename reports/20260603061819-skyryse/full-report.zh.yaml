        title: 工程准备度与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              开发和支持布局强化了一个判断：Skyryse 建的是安全关键产品组织，不只是营销概念。招聘页面明确显示，工程、认证、政府事务、运营与制造、业务拓展团队分布在 El Segundo 和 Camarillo
              飞行线。访问日 Greenhouse 看板仍有九个开放岗位，覆盖系统测试、应力分析、生产、供应链、技术写作、业务拓展和政府事务。Built In 上一则 DevOps 招聘更有信息量：它提到遵循 DO178C
              的流程、CI/CD、软件在环测试、Kubernetes 或 Docker，以及 GitLab 或 GitHub
              分支。开放岗位组合还说明，认证文书、伙伴执行和工厂爬坡仍是商业化中劳动密集的部分，而不是已经解决的基础设施。这是公司认真投入安全关键工程流程的良好证据，但回答不了最难的尽调问题。公开支持能力仍显得偏组织驱动，而非自助式。投资人仍需要闭环证据：Skylar
              的网络安全控制、装机机队小时数、签派可靠性、合作伙伴改装吞吐量，以及从今天的特殊条件和计分测试走向广泛商业认证的具体 FAA 收尾路径。
