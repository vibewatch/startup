  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 认证延迟
        - FAA 和公司里程碑更新
        - 到下一个主要融资窗口，仍未披露最终批准或清晰收口路径
        - 重估时间表、收入启动和资金需求
      - - 安全论证倒退
        - 测试事故、新特殊条件或公开可靠性挫折
        - 重大异常、新监管条件或已披露边缘场景故障
        - 在弄清纠正行动负担前，按逻辑破裂处理
      - - 伙伴安装瓶颈
        - United Rotorcraft / Ace 就绪度和首批现场改装证据
        - 认证收口后仍没有可信服务吞吐证明
        - 下调多机型规模化假设和利润率画像
      - - 开发项目未能转化
        - Army 和 CAL FIRE 状态更新
        - 仍以 CRADA / 未来部署表述，没有有资金支持的机队扩张
        - 从基准情景中剔除机构转化上行
      - - 法律 / 供应商摩擦回归
        - 新诉讼、禁令活动或已披露供应商纠纷
        - 出现新的不利案卷活动，或与关键供应商发生类似纠纷
        - 任何后续投资前，升级 IP / 采购尽调
      - - 商业转化疲弱
        - 交付、预订转化，以及已披露定价 / 采购证据
        - 预订持续存在，但没有认证交付或采购金额
        - 把零售需求主张视为营销信号，而非收入支撑
    notes: 这些触发项设计成可从公开文件、监管通知和公司披露中监控，即便私有尽调材料尚未打开也能跟踪。
    claimRefs:
      - CR001
      - CR015
      - CR017
      - CR019
      - CR024
