      - number: '8.4'
        title: 乐观、基准和悲观区间
        blocks:
          - type: paragraph
            body: >-
              在这里做精确 DCF 只是表演，因为公开记录不给足收入、利润率或订单储备输入，无法支撑模型。情景框架更诚实。 乐观情景约为 $1.5 billion 至 $2.2
              billion，并要求三件事同时发生：取证按时完成，首批交付或改装合同在商业上可见， SkyOS 证明自己能从 Robinson R66 扩展到更大的机队机会。基准情景大约为 $0.9 billion 至
              $1.2 billion， 前提是取证没有重大延误，但披露仍然稀薄，因此把当前轮次视为大体合理。悲观情景约为 $0.4 billion 至 $0.7 billion，
              对应取证延误、公开市场倍数进一步压缩，或下一轮融资需要更重结构化条款。在这个框架里，已宣布的 $1.15 billion 估值已经接近当前公开证据能够稳妥支撑的上沿；如果没有证明力阶跃，上行空间有限。
