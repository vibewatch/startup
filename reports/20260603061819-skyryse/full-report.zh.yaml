      - number: '7.3'
        title: 大额融资缓解现金跑道压力，但商业化仍然重资本、且高度依赖转化
        blocks:
          - type: paragraph
            body: >-
              Skyryse 2026 年 2 月的 C 轮显著降低了眼前融资风险，但没有消除模式本身的结构性资本强度。公司称该轮融资超过 $300 million，使累计股权资本超过 $605 million；2025 年
              Form D 则显示一笔 $192.3 million 的豁免发行， 其中 $167.1 million 已售给 46 名投资者。这是真金白银的支持，但也说明业务在证明大规模获证生产之前，需要吃掉多少资本。
              商业化叙事仍然强烈受制于取证时点、机构伙伴转化和改装吞吐量。

              公开需求指标令人鼓舞，但仍不完整。Skyryse 首发版预订已售罄，并继续接受 $2,500 订金；但最终飞机定价仍未披露，
              预订势头也不等于获证交付、确认收入或持久机队利用率。更大类别背景里也有同样模式：政策和市场来源把简化操控、
              改装航电和可选有人驾驶飞机描述为真实增长主题，但也强调韧性制造、分阶段采用自主化、监管合规和安全功能投入。 也就是说，Skyryse
              的上行空间可见，但兑现路径仍然很长，并且对任何取证延误、伙伴瓶颈，或无法把飞行员、机构和运营商转成反复付费的部署客户都很敏感。
