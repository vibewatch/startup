              detail: Firehawk 存量机队庞大，具相关性
              text: 中
        - label: 国防 / 陆军
          values:
            - tone: positive
              detail: CRADA 和任务范围具名
              text: 高
            - tone: medium
              detail: 只披露训练和互操作结果
              text: 中
            - tone: high
              detail: 未披露采购金额
              text: 低
            - tone: high
              detail: 未披露续约机制
