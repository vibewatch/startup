      - number: '7.2'
        title: 规模化取决于改装、MRO 和公共部门项目中的伙伴执行
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的商业路径不止一个直升机 SKU，但这种宽度也带来依赖风险。美国陆军关系明确是一个 CRADA，用于开发训练、 互操作性和可选有人驾驶能力，而不是已披露的采购合同。CAL FIRE
              关系同样有潜力，但公开记录仍偏向未来： Skyryse 自己的公告称 SkyOS 正在开发，未来将部署到消防飞机上；Military + Aerospace Electronics
              则把这项工作表述为探索可选有人驾驶或远程操控的空中消防。这些都是有价值的验证点，但仍是规模化之前的验证。

              现场安装和维修路径也依赖合作伙伴。United Rotorcraft 预计在 Skyryse One 开始发货时提供 FAA Part 145 MRO 服务，并支持 SkyOS 在 Airbus
              H125/H130 和 Black Hawk 变体上的集成。Ace Aeronautics 则被定位为 Black Hawk 改装的主要安装枢纽。伙伴关系执行顺利时会放大杠杆，但也意味着 Skyryse
              把取证转成交付的能力， 取决于第三方掌控的安装档期、维修准备度、改装质量和面向客户的吞吐量。实际落地时，公司不仅要证明 SkyOS
              能工作，还要证明一个分布式伙伴网络能在多个机型家族上完成取证、安装、服务和支持，同时不制造瓶颈或质量不一致。
