        title: 公开牵引力受认证卡口约束，并由合作伙伴牵引
        blocks:
          - type: paragraph
            body: >-
              公开投资人真正能看到的收入引擎仍受认证闸门限制。Skyryse 已经拼出真实商业证据点——首版预订售罄、国防和消防合作、与 Mitsubishi 的国际扩展，以及反复表述计划在 2026
              年交付——但公司没有披露任何已完成交付、已确认收入、ARR、客户数、毛利率、CAC、回本周期，或可退款预订向正式订单的转化。这意味着当前 GTM
              故事更适合描述为高客单价航空采购叠加渠道开发，而不是可重复的软件式漏斗。招聘信号也强化了这一判断。官网职位和 Greenhouse
              页面显示，公司在认证、系统测试、运营与制造、供应链、业务拓展和政府事务上积极招聘，福利组合包括薪资、绩效奖金、股权、搬迁、医疗、每日餐食和健康福利。这些职位作为执行信号偏正面，但从财务角度看，意味着在公开经常性收入证据出现之前，固定成本仍在继续扩张。因此，承保取决于认证里程碑多快能把可见的合作伙伴需求转化为已签署的生产经济性。
