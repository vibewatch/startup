              Joby、Archer、Eve、Vertical 和 EHang 应该出现在本章，但主要作为相邻公开可比公司，而不是直接的直升机改装替代品。它们从零设计的 eVTOL
              或无人驾驶项目，塑造了投资人对先进空中交通的预期、监管叙事和人才竞争。它们也披露了比 Skyryse 更容易被市场看见的规模指标：Stock Analysis 列示 Joby 市值 $11.68
              billion、Archer $5.12 billion、Eve $1.18 billion、Vertical $338.69 million，披露员工数从 198 到 2,559 不等。Joby 收购
              Xwing 说明，相邻玩家可以买入自主化能力，而不只靠内部自建。更难比较的是定价。Skyryse 至少披露了首版入门价 $1.8 million 和 $2,500
              预订订金，但已审阅的竞争对手公开材料通常没有披露交付飞机价目表、合同费率或已实现经济性。这让买方行为更难直接观察，也把尽调重心从标价推向认证、任务适配和分销。
