  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议框架和投资逻辑张力
        blocks:
          - type: paragraph
            body: >-
              Skyryse 值得肯定：在许多先进空中交通公司很难守住私募估值的市场里，它在 2026 年 2 月完成了超过 $300 million 的 C 轮，估值达到 $1.15 billion。新资金、蓝筹投资人和持续
              FAA 进展都是真正的正面因素。投资问题在于， 该轮价格看起来仍更像里程碑估值，而不是经过财务承销的估值。公司自己的 2025 年 Form D 显示没有收入；截至 2026 年 6
              月保留的公开记录，也仍未披露当前收入、毛利率或商业订单储备转化。投资逻辑因此很直接： 如果取证完成且伙伴渠道能转化，SkyOS 可能成为跨大型存量机队的有价值改装和自主化层。反向逻辑同样清楚：
              今天的价格已经把大量未来资本化，却让投资者很难看清经济性、条款和时点。这个组合支持在头部估值下给出观察判断，而不是买入。
