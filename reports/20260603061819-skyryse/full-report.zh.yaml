      - number: '2.2'
        title: 规模测算与买方地图：有意义，但远小于泛 AAM TAM 叙事
        blocks:
          - type: paragraph
            body: >-
              在证据约束下测算，近期市场有意义但有边界。资料缓存中最清晰的美元口径来自 Market Research Future：美国直升机航电市场估计从 2024 年的 $2.1 billion 增长到 2035 年的
              $3.5 billion。但这个数字仍宽于 Skyryse 当前切口，因为它除飞控外还包括导航、通信、监视和监测系统。同一来源给出的飞控系统组件规模约 $420 million 至 $700
              million，更适合作为 Skyryse 近期可信攻击面的代理指标。公开可见买方也符合这个更窄的判断。私人 / 通用航空需求足以支撑首版预订售罄和入门机型公开标价。公共安全买方则通过 CAL
              FIRE，以及消防、EMS、搜救、执法等任务场景出现。军事需求通过 Army 和 Black Hawk 改装路径显现。United Rotorcraft、Ace
              等安装伙伴重要，因为它们是产品的一部分，不只是分销。Mitsubishi 增加了一条渠道主导的国际路径。合在一起，这些细分市场拼出一张可信买方地图，但仍不足以把完整 eVTOL 或 AAM 叙事归给今天的
              Skyryse。
