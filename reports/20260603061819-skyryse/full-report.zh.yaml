  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与运营方工作流
        blocks:
          - type: paragraph
            body: >-
              作为一家私营航空自动化公司，Skyryse 的产品故事异常具体，因为公开信息足以让读者从启动到着陆追踪运营方工作流。SkyOS
              没有被包装成从零设计的飞机项目；它是一套软件定义的电传飞控技术栈，目标是在现有机体上替代传统机械驾驶舱的复杂度。在当前基于 R66 的 Skyryse One
              上，这具体表现为单根控制杆、两块触摸屏、自动检查单、自动飞行、紧急管理逻辑，以及一个大幅简化的驾驶舱：移除了 180 多个部件，以及 50
              多个仪表、开关和断路器。公司给用户的承诺，是在常规和紧急飞行阶段降低工作负荷；同一种界面模式计划跨直升机和飞机迁移，而不是困在一款旗舰飞机里。
