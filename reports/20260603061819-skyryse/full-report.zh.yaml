          detail: 产品上市晚于基准情景
          type: impact
        - id: n7
          label: 收入不及预期
          detail: 积压订单或采购转化低于预期
          type: impact
        - id: n8
          label: 现金需求上升
          detail: 在证明到来前需要更多资本
          type: impact
        - id: n9
          label: 估值压力
