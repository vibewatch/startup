      - number: '8.5'
        title: 投资建议、退出准备度和尽调门槛
        blocks:
          - type: paragraph
            body: >-
              估值决定归根到底是纪律问题，不是欣赏问题。Skyryse 有足够证据留在可投资观察名单上：近期有真金白银进入， 取证工作仍在推进，平台故事延伸到有意义的存量机队类别。但公开证据还不足以支撑投资者凭信心追逐
              $1.15 billion 估值。新投资者需要股权结构表条款、经审计或管理层认证的商业指标、剩余取证预算和时间线，以及更清楚的证据证明预订或伙伴关系能转成高质量收入。
              退出准备度看起来也仍更像另一轮私募融资、战略交易或选择性老股交易，而不是短期公开市场桥梁。在这些缺口关闭之前，最有纪律的姿态是观察；
              如果机会正在进行，争取下行保护；只有当取证和商业转化从愿景变成事实时再上调判断。
