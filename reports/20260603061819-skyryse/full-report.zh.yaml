  - id: FU001
    title: 客户旅程图——从演示到机体部署
    type: journey-map
    layout: wide
    summary: 公开客户证据显示，旅程从演示和预订开始，之后才进入定金、交付和机队扩张。
    data:
      items:
        - label: 认知
          detail: 媒体报道、安全叙事、航展、伙伴公告
          tone: neutral
        - label: 上手评估
          detail: AirVenture 上面向飞行员和非飞行员的模拟器演示
          tone: positive
        - label: 预订或范围界定
          detail: 可退款预订，或伙伴发现阶段工作包
          tone: positive
        - label: 集成规划
          detail: 改装、MRO、CRADA，或特定国家部署规划
          tone: warning
        - label: 飞行证明
          detail: 首飞或特定机型验证里程碑
          tone: positive
        - label: 交付与扩张
          detail: 定金、认证后交付、多机型铺开
          tone: warning
    claimRefs:
      - CU006
      - CU029
      - CU037
  - id: FU002
    title: 采纳 / 部署路径——从兴趣到机队转化的公开证明
    type: flow
    layout: wide
    summary: Skyryse 漏斗顶部和技术证明很强，但从兴趣到经常性机队部署的公开链条仍有缺口。
    data:
      nodes:
        - id: A1
          label: 安全叙事驱动认知
        - id: A2
          label: 模拟器演示或伙伴引介
        - id: A3
          label: 预订或范围界定协议
        - id: A4
          label: 特定机型集成工作
        - id: A5
          label: 首飞 / 验证里程碑
        - id: A6
          label: 定金、交付和机队扩张
      edges:
        - from: A1
          to: A2
          label: 兴趣转为上手评估
        - from: A2
          to: A3
          label: 线索转为预订或有范围的伙伴工作
        - from: A3
          to: A4
          label: 认证和改装规划启动
        - from: A4
          to: A5
          label: 项目达到首飞证明
        - from: A5
          to: A6
          label: 商业转化仍需公开证明
    claimRefs:
      - CU016
      - CU029
      - CU031
      - CU039
  - id: FU003
    title: 客户证明矩阵——按客群划分的证据质量
    type: matrix
    layout: wide
    summary: 机构渠道的具名证明最好，但所有客群的收入和留存可见性都弱。
    data:
      columns:
        - 具名证明
        - 结果具体度
        - 收入可见性
        - 留存可见性
        - 扩张路径
      rows:
        - label: 私人自有自营机主
          values:
            - tone: medium
              detail: 预订和一名飞行员评测
              text: 中
            - tone: medium
              detail: 售罄与首单案例
              text: 中
            - tone: high
              detail: 未披露收入指标
              text: 低
            - tone: high
              detail: 消费者买家无续约数据
              text: 低
            - tone: medium
              detail: 可能通过定金和交付扩张
              text: 中
        - label: 消防机构
          values:
