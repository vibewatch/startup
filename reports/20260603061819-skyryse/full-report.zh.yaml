      - number: '2.3'
        title: 采用驱动强劲，但认证和集成仍决定节奏
        blocks:
          - type: paragraph
            body: >-
              Skyryse 受益于异常清晰的需求驱动。第一是安全。SkyOS 和 Skyryse One
              的卖点是降低飞行员工作负荷、紧急自动化、飞行包线保护，以及最终实现直升机自动着陆，这些都对高负荷旋翼机任务重要。独立安全材料也指向同一方向：U.S. Helicopter Safety Team
              明确鼓励更多稳定性增强、简单自动驾驶采用、飞行数据监测，甚至在危险任务中使用具备自主能力的飞机。第二是训练简化。Flying 报道早期订单来自转向直升机的固定翼飞行员；DOT
              战略称简化飞控可以把航空开放给新一类飞行员；Skyryse 则认为 FAA 的 MOSAIC
              规则可能降低简化车辆操作的训练负担。第三是任务紧迫性，尤其是消防和军事行动，可选飞行员能力、低能见度支持和更容易的互操作性都有明显价值。约束同样重要。Skyryse 仍要完成 R66
              审批路径，证明安装能力不止于演示机队，赢得运营方信任，并拿出超越预订订金或合作伙伴公告的经济逻辑。也就是说，时间表由认证和部署证据决定，而不只是由市场意愿决定。
