      - number: '1.3'
        title: 融资历史、投资人基础与商业化信号
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的资本故事已经成为公司最强、也最容易由外部验证的证据之一。2026 年 2 月的 Series C 官方口径超过 $300 million，公司估值 $1.15
              billion，并把已披露的累计股权融资推高到 $605 million 以上。Cooley、Skyryse、TechCrunch、Los Angeles Business Journal 和 HeliHub
              都印证了该轮融资的大致轮廓；Skyryse 2025 年 Form D 还显示，公司进行了一笔后期豁免发行，目标总额 $192.3 million，截至 2025 年 10 月已从 46 名投资人处售出
              $167.1 million。Series C 财团包括共同领投方 Autopilot Ventures 与 Fidelity，以及 ArrowMark、Atreides、BAM
              Elevate、Baron、Durable、Positive Sum、Qatar Investment Authority、Rokos 管理的 RCM Private Markets Fund 和
              Woodline。商业上，公开记录还看不到 Skyryse 已经成为规模化收入公司，但需求信号清晰：首版 Skyryse One 预订在六个月内售罄；公司公开点名 Air Methods、United
              Rotorcraft、Mitsubishi、U.S. Army、CAL FIRE 和 Ace Aeronautics 为合作伙伴；管理层也反复把认证资金描述为从平台验证走向收入兑现的桥梁。
