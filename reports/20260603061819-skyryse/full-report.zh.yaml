            body: >-
              架构证据在 Skyryse 披露具体子系统时最强。SkyOS
              页面披露了三重冗余飞控计算机、稳健传感器套件、耐卡滞电动作动器，以及把飞行员指令转化为飞机运动的电机控制组件。更新版驾驶舱发布增加了人因角度：控制系统完全数字化后，Skyryse
              称可以围绕飞行员重新设计人体工学，而不是围绕旧机体。Skylar 把这套技术栈扩展到 AI 助手层：它监听 ATC，解读 NOTAM 和天气，追踪 ADS-B 交通，并使用 SkyOS
              内部已有的飞行状态数据。信任图景则更复杂。FAA 已经发布了改装 R66 电传飞控架构的特殊条件，Skyryse 也进入计分飞行测试，但公开证据仍未到最终认证、公开网络安全认证或现场可靠性统计。
