  - id: FO003
    title: 快照 KPI
    type: kpi
    layout: compact
    summary: 公司最可支撑公开成熟度标记的压缩视图：资本、估值、认证阶段和机型平台规模野心。
    approximationNotes: 收入、ARR 和已安装飞机数量被有意排除，因为公开证据无法支撑精确当前值。
