      - number: '3.2'
        title: 既有厂商、供应商与分销权力
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的现状替代方案往往根本不是另一家创业公司，而是熟悉机体上的传统驾驶舱，通过既有 OEM 和 MRO 渠道销售、维护和支持。Airbus 和 Robinson
              体现了这种装机基础现实：它们向已经信任成熟飞机的运营方销售直升机、训练、服务入口和任务可信度。United Rotorcraft 很重要，因为 Skyryse 自己选择了既有厂商式集成和维护伙伴，去触达
              Airbus 与 Black Hawk 机队；这验证了 Skyryse 的部署策略，也显示软件层之外仍掌握着大量渠道权力。Moog
              则代表另一种既有力量：拥有深厚航空历史的飞控和作动供应商，即便不拥有客户关系，也能影响项目风险。因此，Moog 2022 年对 Skyryse
              的起诉具有竞争相关性，因为它说明在买方看到完成版改装产品之前，供应商和 IP 摩擦就可能提前出现。实际情况是，Skyryse 比既有厂商更需要既有渠道。
