      - number: '2.4'
        title: 相邻市场验证自主化需求，但应作为上行空间而非基准情景 TAM
        blocks:
          - type: paragraph
            body: >-
              周边市场背景对估值仍有用，但必须谨慎处理。Reliable Robotics、Merlin、Near Earth 和 Shield AI
              都说明，商业、货运和国防场景中已经存在航空器自主化买方，供应商也在尝试把自主能力改装或叠加到现有机队上，而不是等待全新飞机类别。这支持 Skyryse 的战略逻辑。Joby、Eve、Archer 和
              Vertical 等公开 eVTOL 公司展示的是另一件事：投资人愿意给自动化航空未来赋予数十亿美元股权价值，但这些公司追逐的是从零设计的飞机、城市空中交通服务，有些还包括空中交通管理平台。它们是相邻市场，不是
              Skyryse 目前拥有的市场。实际含义是，上行情景可以引用更广泛的自主化和 eVTOL 可比公司，作为自动化航空可能做大的证据；但基准情景应锚定更小的旋翼机改装和现代化切口，也就是 Skyryse
              通过认证、伙伴支持的安装和可重复任务验证能够触达的范围。
            claimRefs:
