      - number: '7.4'
        title: 法律摩擦和创始人集中度抬高剩余执行风险
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的反向法律事项，仍是 Moog 2022 年在联邦法院对 Skyryse、Misook Kim 和 Robert Pilkington 提起的案件。CourtListener 案卷显示，Moog
              提交诉状后立即申请初步禁令救济和临时限制令，随后双方还约定了数据保全和加速取证工作。
              在无法查看密封材料、也没有清晰公开结果摘要的情况下，投资者不能把该事项视为足以打破投资逻辑，也不能把它当成无关紧要。该事项真正说明的是， Skyryse
              的经营历史里已经出现过供应商和知识产权（IP）摩擦，而且对手方并非小角色：Moog 自称是一家全球航空航天与国防技术公司。

              对一家处在这个阶段的公司而言，治理可见度也比理想状态更薄。Skyryse 的公开材料在创始人叙事、顾问阵容和使命上信息丰富，
              但对详细董事会图谱、委员会结构，或除最显眼领导层之外的具名运营班底披露仍少。同时，职业和招聘页面显示，公司正在认证、系统测试、
              制造、供应链、增长和政府事务等岗位积极招聘。这个组合不必然是负面，但意味着投资者仍在承销一个创始人中心化的组织： 公司一边搭建关键运营职能，一边试图为一个安全关键航空平台完成取证、制造和商业化。
