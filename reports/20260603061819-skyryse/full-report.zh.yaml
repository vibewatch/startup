chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与运营逻辑
        blocks:
          - type: paragraph
            body: >-
              Skyryse 是一家航空硬件和软件公司，总部位于加州 El Segundo，并在 Hawthorne 设有实验室和制造业务，在 Camarillo 拥有飞行线。Mark Groden 于 2016
              年创立公司，核心判断是：提升航空安全，靠数字化并简化飞控，比单纯要求飞行员多训练、继续管理传统机械驾驶舱更有效。SkyOS 承载了这套判断，公司称其为首个通用飞行操作系统。Skyryse
              没有从零设计新飞机，而是采用便于改装的软件定义飞控，可用于直升机和飞机，并从基于 Robinson R66 的 Skyryse One
              切入。因此，商业模式横跨硬件、软件、认证、改装安装，以及民用和国防机队的下游集成合作。公开材料反复把 Skyryse 定位为军民两用平台公司：长期价值不在于卖单一直升机 SKU，而在于先让 SkyOS
              完成一次认证，再把它扩展到多种机体。
