  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 认证仍是闸门风险，安全论证高度定制化
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清楚的风险是，Skyryse One 仍处在分阶段、尚未最终完成的取证流程中。官方和独立来源都显示， 公司到 2025 年 5 月已进入 FAA
              计入取证的飞行测试，但截至本报告运行日，公开材料没有显示最终批准已经完成， 也没有显示已获证的商业交付。监管负担也明显比普通航电更新更定制化。2026 年 4 月，FAA 针对改装后的 Robinson R66
              提出飞控系统告警显示的特殊条件，并明确称现有旋翼航空器标准对该设计缺少充分或适当的安全标准。 2026 年 5 月，FAA
              又最终确定第二组关于纵向静稳定性的特殊条件，称改装飞机的纵向控制律可能允许中性或负静稳定性， 并把该设计描述为带耦合自动驾驶模式的四轴全权限数字电传飞控系统。放在一起看，这些通知说明取证不只是清理文件；
              Skyryse 要求监管机构批准的是在一款传统直升机平台上的实质性新控制架构。

              独立报道又增加了一层不确定性：Aviation Tech Today 引述一位经验丰富的直升机飞行员，他怀疑 Skyryse
              由平板驱动的自动化能否安全覆盖所有真实世界边界场景，包括错误的发动机故障指示和尾桨紧急情况。Skyryse 回应称，公司按很高标准取证，并持续展示可靠性。但这个回答仍给投资者留下一个直接的近期投资逻辑断点：如果
              FAA 路径延误、如果新的特殊条件出现，或如果高关注度测试异常浮出水面，收入时点和采用可信度都会同时后移。
