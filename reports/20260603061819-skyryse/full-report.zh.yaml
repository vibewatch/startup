  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 剩余风险集中在认证收口、安全论证验证、伙伴带动的规模化，而不是近期市场认知。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 致命影响
          values:
            - 治理不透明
            - Moog / 供应商 IP 争端升温
            - FAA 认证延期；批准前发生可靠性事件
        - label: 高影响
          values:
            - 预订转化偏弱
            - 陆军 / CAL FIRE 停留在开发阶段
            - 伙伴安装 / MRO 瓶颈；多机型范围蔓延
        - label: 中等影响
          values:
            - 招聘继续滞后
            - 飞行员信任与培训阻力
