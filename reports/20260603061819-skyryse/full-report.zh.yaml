      - CR031
      - CR037
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 值
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 尊重技术和近期融资，但不要只为里程碑可选性付高价。
      - - 置信度
        - 中
        - 本轮融资和认证数据是真实的，但公开经济性披露仍太薄，难以给出高确信度价格判断。
      - - 风险评级
        - 高
        - 认证时间、商业化证明和结构化条款风险仍主导下行。
      - - 估值立场
        - $1.15B 时合理至偏高
        - 这个价格作为私人市场期权价格说得通，但从公开证据看并不明显便宜。
      - - 最佳进入条件
        - 相对上一轮折价，或获得下行保护
        - 要么价格改善，要么里程碑证明改善。
      - - 上行路径
        - 认证收口，首批收入质量证明出现
        - 两者叠加，可能把价值推入乐观区间。
      - - 立即否决信号
        - 认证前再次融资且结构很重
        - 这意味着名义估值更多靠条款保护，而不是靠证据支撑。
    notes: 本表综合有来源的事实、公开可比公司标记和未解决尽调缺口；不是公司指引。
    claimRefs:
      - CV001
      - CV028
      - CV031
      - CV032
      - CV037
      - CV043
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 证据
      - 为何重要
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 新近完成 $300M+ Series C，估值 $1.15B，蓝筹投资人参与
        - 说明公司仍能为认证冲刺吸引大额私人资本。
        - 下一轮若疲弱或结构很重，将显著削弱这个支撑信号。
      - - 投资逻辑
        - SkyOS 正通过改装和 MRO 伙伴切入现有机队
        - 在存量飞机上复用平台，可支撑超出单一直升机 SKU 的价值。
        - 需要实际有资金支持的改装项目或已交付飞机，来证明复用叙事。
      - - 投资逻辑
        - 公开可比公司仍显示，未盈利先进空中出行标的具备有意义股权价值
        - 当投资人相信认证可以转化时，品类可选性仍获得资本市场支持。
        - 更多可比压缩或发射失败会削弱品类读数。
      - - 反向逻辑
        - Form D 显示无收入，当前公开记录仍缺经济性披露
        - 没有收入、利润率和转化数据，投资人无法精确承销 $1.15B。
        - 经审计商业指标会迅速缩小不确定性。
      - - 反向逻辑
        - 临近报告生成日时认证基础仍活跃，安全质疑仍存在
        - 如果时间滑后或信心受损，商业化开始前价格就可能压缩。
        - 完整认证加早期运营数据会降低这项折价。
      - - 反向逻辑
        - 优先股堆叠和退出路径仍不透明
        - 如果结构很重或流动性只留在私人市场，名义估值会高估新钱回报。
        - 股权结构表透明、流动性路径更清晰，会改善风险回报。
    notes: 每行都给出核心论点，以及会迫使估值上调或下调的具体事实组合。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV028
      - CV031
      - CV032
      - CV038
      - CV039
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 指示性估值区间（USD bn）
      - 概率信号
      - 核心假设
      - 相对 $1.15B 的回报逻辑
      - 下行 / 证实触发因素
    rows:
      - - 乐观
        - 1.5-2.2
        - 需要多个正向证明，不能只靠又一轮叙事
        - 认证完成，首批交付或改装合同开始显现，SkyOS 证明能跨机队复用。
        - 稀释和条款影响前，约有 30%-91% 上行空间。
        - 由认证完成、商业转化和更清晰的条款披露来证实。
      - - 基准
        - 0.9-1.2
        - 最贴合现有证据
        - 2026 年轮次大体站得住，认证没有大幅滑坡，但经济性披露仍然单薄。
        - 约 -22% 至 +4%；不足以支撑一笔激进的新买入。
        - 如果执行保持稳定但披露没有实质改善，则得到证实。
      - - 悲观
        - 0.4-0.7
        - 由延期或融资承压触发
        - 认证延期，怀疑仍在，下一轮融资或市场重估迫使清算价格下修。
        - 任何优先权瀑布影响前，约有 39%-65% 下行空间。
        - 由进度滑坡、结构化融资或收入质量证明缺位来证实。
    notes: 情景区间是基于上一轮估值、上市可比公司的离散度以及收入披露缺口作出的分析师判断；它们不是经评估的公允价值。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV041
      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 参照对象
      - 类型
      - 当前 / 最近披露估值标记
      - 规模 / 状态标记
      - 相关性
      - 主要限制
    rows:
      - - Skyryse 最新轮次
        - 非上市
        - 投后估值 $1.15B；Series C 轮 $300M+
        - 未披露当前收入；认证仍待完成
        - 决策的直接价格锚。
        - 表面估值不说明优先权或新资金经济性。
      - - Joby Aviation
        - 上市
        - 市值约 $11.68B
        - 过去 12 个月收入 $77.67M；仍深度亏损
        - 说明市场仍可能给先进空中出行期权赋予多高价值。
        - 从零搭建空中出租车网络，不是 Skyryse 的直接类比。
      - - Archer Aviation
        - 上市
        - 市值约 $5.12B
        - 过去 12 个月收入 $1.90M；仍严重亏损
        - 股权价值比 Joby 更接近，且仍处认证阶段。
        - 仍是 eVTOL OEM，资本强度和商业化路径不同。
      - - Eve Holding
        - 上市
        - 市值约 $1.18B
        - 保留页面未显示过去 12 个月收入；有 Embraer 生态支持
        - 按表面股权价值看，是当前最近的公开价值锚。
        - 背后生态和地域与 Skyryse 的改装路径不同。
      - - Vertical Aerospace
        - 上市
        - 市值约 $338.69M
        - 保留页面未显示过去 12 个月收入
        - 可作为收入前先进空中出行情绪的偏悲观公开底部。
        - 低迷的公开股权价格不等同于协商出来的私募轮次。
      - - Reliable Robotics
        - 非上市
        - 2026 年 4 月 $160M 融资；估值未披露
        - 200+ 套系统承诺；可获 FAA 认证的自主系统
        - 比多数 eVTOL 名称更接近“现有飞机自主化”的类比。
        - 未披露投后估值。
      - - Merlin
        - 非上市
        - 估值未披露
        - 面向现有飞机、机型无关的自主飞行栈
        - 可参考改装 / 自主平台论点。
        - 同样没有披露估值标记。
      - - Xwing / Joby 结果
        - 战略并购参考
        - Joby 收购 Xwing；条款未披露
        - 自主软件资产被更大的平台玩家吸收
        - 独立 IPO 支撑不确定时，可用于框定退出路径。
        - 未披露交易价值，所以这是退出先例，不是定价可比。
    notes: 样本覆盖与 Skyryse 2026 年 6 月估值争论最相关的上市可比公司和模式匹配非上市参照；并非穷尽式清单。
