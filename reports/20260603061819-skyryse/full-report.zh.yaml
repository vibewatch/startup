  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接改装与自主化竞争者
        blocks:
          - type: paragraph
            body: >-
              Skyryse 面对的不是一个单一、铁板一块的对手集合。最接近的直接同行，是试图把更多自主能力带到现有飞机上的公司，而不是占据公开市场标题的从零设计 eVTOL 开发商。Reliable Robotics 和
              Merlin 是最清晰的类比对象，因为两者都向现有机队销售不绑定机型的自主化能力，强调的是可认证自动化，而非新机体。Near Earth 和 Embention
              位于技术栈更低一层：它们销售自主化、集成、认证支持或电传飞控航电，即便不打包成品牌飞机产品，也可能成为运营方或 OEM 项目里的替代方案。Shield AI
              也应放入视野，因为它展示了自主化广度和国防可信度，但公开证据集中在军事平台的任务自主化，而不是民用旋翼机简化。相对这一组公司，Skyryse
              的差异化来自更窄的切口：在现有旋翼机上做飞行员辅助的电传飞控改装，并配套简化的人机界面，而不是完全无人化运行。
