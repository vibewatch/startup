  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行情景从认证和安全论证问题出发，传导到交付延后、转化变弱、资本需求增加和估值承压。
    data:
      nodes:
        - id: n1
          label: 认证延误
          detail: FAA 最终批准晚于计划
          type: risk
        - id: n2
          label: 安全论证受挫
          detail: 可靠性或边缘场景问题引发更严格审查
          type: risk
        - id: n3
          label: 伙伴瓶颈
          detail: 安装或 MRO 吞吐量落后于需求
          type: risk
        - id: n4
          label: 仅开发阶段证明
          detail: 陆军 / CAL FIRE 仍是非采购项目
