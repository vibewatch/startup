companyProfile:
  summary: >-
    Skyryse 是南加州一家航空技术公司，Mark Groden 于 2016 年创立，目标是用软件定义的飞控简化飞机操作。核心平台 SkyOS
    以电传飞控操作系统替代传统驾驶舱的复杂度，用于改装现有直升机和飞机。公司的第一个认证切入口是 Skyryse One，这是一款基于 Robinson R66 的飞机，采用单杆控制和触摸屏界面。截至 2026 年 6
    月，Skyryse 累计融资超过 $605 million，宣布完成估值 $1.15B、规模超过 $300M 的 Series C，进入 FAA 计分飞行测试，并建立了覆盖 U.S. Army、CAL FIRE、United
    Rotorcraft、Mitsubishi 等渠道的合作伙伴组合。公司前景可观，但仍未拿到完整认证，财务也不透明。
  foundedDate: '2016-01-01'
