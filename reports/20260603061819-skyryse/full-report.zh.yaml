      - number: '4.3'
        title: 融资规模很大，但航空自主化可比公司显示烧钱速度可能很快
        blocks:
          - type: paragraph
            body: >-
              Skyryse 最强的财务证据，是它仍处于认证阶段却能持续融到大额股权轮。公司宣布 2026 年 2 月完成超过 $300 million 的 Series C，称已披露累计股权资本超过 $605
              million，并明确把新资金用途绑定到完成 FAA 认证和把 SkyOS 扩展到更多飞机。2025 年 Form D 提供了有用细节：披露发行规模 $192.3 million，已售 $167.1
              million，剩余 $25.2 million，首次销售日期为 2025 年 9 月 16 日，投资人 46 名，Evercore
              参与配售流程。合起来看，这些来源显示，公司在独角兽轮之前仍在积极进行后期融资，也仍需要新资本把认证桥接到商业化。公开成本驱动也很清楚：Skyryse
              同时推进飞行测试、认证、制造准备、产品集成和渠道开发。公开航空自主化可比公司说明了这点为何重要。Joby、Archer、Eve 和 Vertical
              要么收入很低，要么没有收入，却仍承受大额亏损或负自由现金流。它们不是 Skyryse 的直接预测，但强烈提醒投资人：在运营杠杆出现之前，这一类别即便有大量资本也可能很快消耗掉。
