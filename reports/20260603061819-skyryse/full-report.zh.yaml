      - number: '1.2'
        title: 创始人、管理层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Mark Groden 仍是 Skyryse 最核心的对外高管、技术叙事者和融资门面。官方材料称他为创始人兼 CEO，强调其传感器数据融合背景，以及与交通工具自动化有关的 60
              多项专利记录。公开的领导层图景因为一个异常强的顾问阵容而变得更宽：前 NASA 局长 Dan Goldin、前 NTSB 副主席 Bruce Landsberg、前 FAA 认证负责人 Lirio Liu、前
              FAA 总法律顾问 Marc Nichols、前 Cirrus 领导者 Dale Klapmeier，以及前 Tesla 投资者关系负责人 Martin Viecha
              都在其中。即便如此，公开记录仍高度围绕创始人。SEC Form D 点名 Mark Groden
              和若干关联人士，但公司面向公众的材料没有给出详细运营团队名单、具名董事会构成，或投资人治理图谱。继任安排、委员会结构、保护性条款，以及战略决策到底多大程度集中在 Groden
              手中、而非机构投资人与顾问手中，仍是实质性尽调缺口。
