  - id: TV005
    title: 论点失效和叫停触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 为何重要
      - 行动含义
    rows:
      - - 认证再次延期
        - Skyryse 到需要更多资本时仍未拿到完整认证
        - 当前价格假设认证是转化为收入的闸门，而不是无尽科研项目。
        - 从跟踪转为回避，除非价格大幅下修。
      - - 下一轮融资以重结构条款成交
        - 新资金带有实质优先权、反稀释或折价
        - 届时，表面估值对普通股持有人而言比看上去更弱。
        - 把上一轮表面估值视为高估。
      - - 认证后仍无商业证明
        - 没有交付飞机、获资金支持的改装收入或积压订单转化披露
        - 平台可选性仍停留在叙事，而不是变现。
        - 不要按 2026 年价格锚以上买入。
      - - 安全或法律摩擦恶化
        - 监管、客户或诉讼出现新的重大负面信号
        - 认证是价值核心时，这类公司很难消化信誉打击。
        - 削减乐观情景，重看下行区间。
      - - 上市可比公司倍数继续压缩
        - 先进空中出行股票下修，而 Skyryse 没有公司特定证明来抵消
        - 即使有时间滞后，私募轮次最终也会受公开市场影响。
        - 提高所需折扣，收紧进入条款。
    notes: 上述项目是估值传导触发因素，不是完整风险清单；每一项改变的是价格支撑，而不只是公司质量叙事。
    claimRefs:
      - CV007
      - CV010
      - CV011
      - CV035
      - CV038
      - CV042
  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 已确认收入、已交付飞机、获资金支持的改装里程碑以及积压订单转化
        - 所有估值方法都缺这个分母。
        - 财务尽调包，加客户合同桥接。
      - - 毛利率和单机经济性
        - 硬件毛利、安装成本、质保敞口，以及任何经常性软件抽成
        - 要区分溢价定价和可盈利交付经济性，必须拿到这些数据。
        - CFO 复核，加产品线贡献毛利明细。
      - - 认证预算和时间表
        - 剩余取证成本、测试里程碑和首架交付时间表
        - $1.15B 价格只有在认证能于合理窗口内转化为商业化时才成立。
        - 项目管理材料和里程碑燃尽。
      - - 股权结构和优先权堆栈
        - 清算优先权、反稀释、员工期权刷新以及任何二级市场定价
        - 表面投后估值可能与新资金回报算法相差很大。
        - 融资文件和股权结构的法律尽调。
      - - 机队转化证明
        - 预订到订单的转化、按机型拆分的改装管线，以及合作伙伴付款里程碑
        - 检验 SkyOS 是真实平台，还是只是有前景的演示故事。
        - 销售和合作伙伴管理层商业尽调。
      - - 退出准备度
        - 审计材料、投行反馈，以及任何二级出售或战略进程规划
        - 决定纸面价值能否在没有又一轮仅由赞助方支撑的融资下变现。
        - 董事会材料，加审计师和投行工作计划。
    notes: 上述需求构成最低材料包，用来把当前私募估值标记转化为可投资的承销案例。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV044
