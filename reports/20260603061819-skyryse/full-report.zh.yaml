  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链从新融资和平台可选性出发，但必须穿过认证和披露关口，最后才落到 TRACK 建议。
    data:
      nodes:
        - id: fresh-round
          label: 2026 年新融资
          detail: Skyryse 以 $300M+ 新资本，把私募估值重置到 $1.15B。
        - id: platform
          label: 平台可选性
          detail: SkyOS 正被定位为可覆盖多种现有飞机机队。
        - id: certification
          label: 认证关口
          detail: 截至报告生成日前后，FAA 完整认证仍未完成。
        - id: economics
          label: 经济性披露缺口
          detail: 公开材料尚未给出收入、利润率，也没有披露股权结构条款的衔接。
        - id: public-comps
          label: 不完美的公开可比公司
          detail: eVTOL 股票能提供估值区间，但无法给 Skyryse 一个干净倍数。
        - id: decision
          label: 以 $1.15B 估值 TRACK
          detail: 等待更好的价格 / 条款，或更强的里程碑证明。
      edges:
        - from: fresh-round
          to: platform
          label: 支撑上行情景
        - from: platform
          to: certification
          label: 必须通过批准完成转化
        - from: certification
          to: economics
          label: 仍需商业证明
        - from: economics
          to: public-comps
          label: 迫使采用启发式估值
        - from: public-comps
          to: decision
          label: 让判断对价格敏感
    claimRefs:
      - CV001
      - CV007
      - CV028
      - CV030
      - CV031
      - CV032
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大正向驱动是认证和商业转化；最大负向因素是经济性缺失和市场倍数压缩风险。
    data:
      items:
        - label: 认证按时收口
          value: 4
        - label: 首批交付 / 已获资金支持的改装收入
          value: 4.5
        - label: 跨机队平台证明
          value: 2.5
        - label: 无公开收入 / 利润率桥
          value: -4.5
        - label: 股权结构条款仍未知
          value: -2.5
        - label: 公开可比公司倍数压缩
          value: -3
        - label: 安全 / 法律疑虑持续
          value: -1.5
    approximationNotes: 柱状条是对估值支撑的序数影响评分，不是企业价值的直接变化。
    claimRefs:
      - CV032
      - CV033
      - CV035
      - CV037
      - CV038
      - CV041
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前 $1.15B 融资接近基准情景上沿；若证明没有台阶式改善，上行空间有限。
    data:
      items:
        - label: 熊市情景（M USD）
          low: 400
          mid: 550
          high: 700
        - label: 基准情景（M USD）
          low: 900
          mid: 1050
          high: 1200
        - label: 牛市情景（M USD）
          low: 1500
          mid: 1800
          high: 2200
        - label: 2026 年融资锚点（M USD）
          low: 1150
          mid: 1150
          high: 1150
    approximationNotes: 区间是分析师判断，锚定最新私募轮、公开可比公司离散度和里程碑风险，而不是完整 DCF。
    claimRefs:
      - CV001
      - CV034
      - CV035
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 市场覆盖面和技术雄心评分较高，经济性透明度、估值清晰度和退出就绪度仍然偏弱。
    data:
      items:
        - label: 平台覆盖面
          value: 4
          unit: /5
          detail: 多个存量机队终端市场都有可能。
        - label: 技术验证
          value: 4
          unit: /5
          detail: 项目已有真实资金支持，认证工作也在推进。
        - label: 认证完整性
          value: 2
          unit: /5
          detail: 关键审批关口尚未完成。
        - label: 经济性透明度
          value: 1
          unit: /5
          detail: 收入和利润率披露仍缺位。
        - label: 可比公司支撑
          value: 2
          unit: /5
          detail: 商业模式分化，公开可比公司只能给出粗略区间。
        - label: 退出成熟度
          value: 2
          unit: /5
          detail: 流动性仍更像私下或战略路径，公开市场退出还没准备好。
        - label: 风险调整入场
          value: 2
          unit: /5
          detail: 在更强证据出现前，当前估值标记留下的安全边际有限。
    claimRefs:
      - CV030
      - CV031
      - CV039
      - CV040
      - CV043
