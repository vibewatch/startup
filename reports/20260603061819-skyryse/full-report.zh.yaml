      - number: '8.2'
        title: 上轮背景，以及该估值不能证明什么
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月融资重设了价格锚，但没有取消承销纪律。官方和独立报道一致显示，公司融资超过 $300 million， 把累计披露股权融资推高到 $605 million 以上，并把资金用途放在 SkyOS
              取证和规模化上。2025 年 Form D 提供了有用细节：就在宣布成为独角兽前几个月，Skyryse 仍处于后期融资中，并且当时仍披露为“无收入”。这会影响估值解读。
              大轮融资可以同时令人印象深刻又不完整：它证明投资人愿意出资覆盖取证窗口，不证明 Skyryse 已经进入透明的商业规模。
              预订售罄和多机型改装伙伴关系是不错的兴趣证明信号，但仍远低于投资者通常用来支撑精确收入倍数或 DCF 的证据等级。 因此，$1.15 billion
              估值的正确读法是“如果里程碑转化则合理”，而不是“按当前披露基本面看显然便宜”。
            claimRefs:
              - CV001
