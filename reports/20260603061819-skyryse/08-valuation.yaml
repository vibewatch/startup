- id: round-history-and-price-anchor
  title: Last-round context and what the mark does not prove
  body: 'The February 2026 round resets the price anchor, but it does not eliminate underwriting discipline. Official and independent coverage align that the company raised more than $300 million, pushed lifetime disclosed equity above $605 million, and framed the proceeds around certification and scaling SkyOS. The 2025 Form D adds useful texture because it shows Skyryse was still in late-stage fundraising only months before the unicorn announcement and still disclosed “No Revenues” at that point. That matters for valuation interpretation. A large round can be both impressive and incomplete: it proves investor willingness to fund the certification window, not that Skyryse has already crossed into transparent commercial scale. Reservation sell-out and multi-aircraft retrofit partnerships are good proof-of-interest signals, but they still sit well below the level of evidence investors would normally use to support a precise revenue multiple or DCF. The right reading of the $1.15 billion mark
    is therefore “plausible if milestones convert,” not “obviously cheap on current disclosed fundamentals.”'
