  - - Archer Aviation
    - Public
    - ~$5.12B market cap
    - $1.90M trailing revenue; still heavily loss-making
    - Closer in equity value than Joby and still certification-stage.
    - Still an eVTOL OEM with different capital intensity and go-to-market.
  - - Eve Holding
    - Public
    - ~$1.18B market cap
    - No trailing revenue on retained page; Embraer-backed ecosystem
    - Nearest current public value anchor by headline equity value.
    - Backed ecosystem and geography differ from Skyryse’s retrofit path.
  - - Vertical Aerospace
    - Public
    - ~$338.69M market cap
    - No trailing revenue on retained page
    - Useful bearish public floor for pre-revenue advanced-air-mobility sentiment.
    - Depressed public equity is not the same as a negotiated private round.
  - - Reliable Robotics
    - Private
    - April 2026 $160M funding round; valuation undisclosed
    - 200+ system commitments; FAA-certifiable autonomy system
    - Closer autonomy-on-existing-aircraft analog than most eVTOL names.
    - No disclosed post-money valuation.
  - - Merlin
    - Private
    - Valuation undisclosed
    - Aircraft-agnostic autonomy stack for existing planes
    - Useful reference for the retrofit/autonomy-platform thesis.
    - Again no disclosed valuation marker.
  - - Xwing / Joby outcome
    - Strategic M&A reference
    - Joby acquired Xwing; terms undisclosed
    - Autonomy-software asset absorbed by larger platform player
    - Relevant to exit-path framing when standalone IPO support is uncertain.
    - No disclosed transaction value, so it is an exit precedent, not a pricing comp.
