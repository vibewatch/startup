  - Value
  - Decision implication
  rows:
  - - Recommendation
    - TRACK
    - Respect the technology and recent financing, but do not pay up on milestone optionality alone.
  - - Confidence
    - MEDIUM
    - The round and certification data are real, but public economics disclosure is still too thin for a high-conviction price call.
  - - Risk rating
    - HIGH
    - Certification timing, commercialization proof, and structured-term risk still dominate downside.
  - - Valuation stance
    - FAIR-TO-STRETCHED at $1.15B
    - The mark is plausible as a private option price, not obviously cheap on public evidence.
  - - Best entry setup
    - Discount or downside protection versus last round
    - Either price needs to improve or milestone proof needs to improve.
  - - Upside path
    - Certification closes and first revenue-quality proof appears
    - That combination could move value into the bull range.
  - - Immediate no-go signal
    - Another financing before certification with heavy structure
    - That would imply the headline mark is being protected more by terms than by proof.
  notes: This table synthesizes sourced facts, public-comp markers, and unresolved diligence gaps; it is not company guidance.
