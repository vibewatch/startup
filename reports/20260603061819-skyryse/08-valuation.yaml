artifact: valuation
slug: skyryse
runDate: '2026-06-03'
company:
  name: Skyryse
chapter:
  number: 8
  title: Valuation
  summary: Skyryse’s February 2026 $1.15 billion private mark is supportable only as a certification-and-platform option price, not as a financially underwritten revenue multiple. Public evidence still shows no disclosed current revenue, a live FAA certification process, and public eVTOL/autonomy comps that are informative but imperfect for Skyryse’s retrofit/autonomy model, so the disciplined stance is TRACK with price and term sensitivity rather than BUY.
sections:
- id: recommendation-frame
  title: Recommendation frame and thesis tension
  body: 'Skyryse deserves credit for clearing a February 2026 Series C of more than $300 million at a $1.15 billion valuation in a market where many advanced-air-mobility companies have struggled to keep private marks intact. Fresh capital, blue-chip investors, and continued FAA progress are all real positives. The investment problem is that the round price still reads more like a milestone valuation than a financially underwritten one. The company’s own 2025 Form D showed no revenues, and the retained June 2026 public record still does not disclose current revenue, gross margin, or commercial backlog conversion. The thesis is therefore straightforward: SkyOS could become a valuable retrofit and autonomy layer across large installed fleets if certification closes and partner channels convert. The anti-thesis is equally clear: today’s price already capitalizes a lot of that future while leaving investors with limited visibility into economics, terms, and timing. That combination supports
    a TRACK call at the headline valuation rather than a BUY.'
  claimRefs:
