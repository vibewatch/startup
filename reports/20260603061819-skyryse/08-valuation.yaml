- id: public-and-private-reference-points
  title: Public-market and private-market reference points
  body: The public comp set offers a bracket, not a formula. Joby and Archer both trade materially above Skyryse’s private mark despite still losing large amounts of money, while Eve trades around the same order of magnitude and Vertical sits far below it. Those numbers tell investors that capital markets still ascribe strategic value to advanced-air-mobility optionality, but they do not tell us that Skyryse’s specific model is worth any precise figure. That is because Skyryse is not primarily a clean-sheet air-taxi OEM. Its model is retrofit hardware plus software and certification leverage across existing fleets. That makes public eVTOL market caps imperfect analogs and pushes more attention toward closer but less transparent references such as Reliable Robotics, Merlin, and other autonomy or avionics vendors. The closest lesson from those adjacencies is not a clean multiple. It is that investors still fund aircraft-agnostic autonomy platforms when certification progress, installed-fleet
    applicability, and strategic exit potential are credible.
