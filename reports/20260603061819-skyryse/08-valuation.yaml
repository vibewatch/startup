- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Evidence
  - Why it matters
  - What would change the view
  rows:
  - - Thesis
    - Fresh $300M+ Series C at a $1.15B valuation with blue-chip participation
    - Shows the company can still attract large private capital for the certification push.
    - A weak or structured next round would materially reduce this support signal.
  - - Thesis
    - SkyOS is being positioned across existing fleets through retrofit and MRO partners
    - Platform reuse across installed aircraft can justify value beyond one helicopter SKU.
    - Need actual funded retrofit programs or delivered aircraft to prove the reuse story.
  - - Thesis
    - Public comps still show meaningful equity value for pre-profit advanced-air-mobility names
    - Category optionality still has capital-market support when investors believe certification can convert.
    - More comp compression or failed launches would weaken the category read-through.
  - - Anti-thesis
    - Form D showed no revenues and the current public record still lacks disclosed economics
    - Without revenue, margin, and conversion data, investors cannot underwrite $1.15B with precision.
    - Audited commercial metrics would narrow the uncertainty quickly.
  - - Anti-thesis
    - Certification basis remained active near run date and safety skepticism still exists
    - If timing slips or confidence erodes, the price can compress before commercialization begins.
    - Full certification plus early operating data would reduce this discount.
  - - Anti-thesis
    - Preference stack and exit path remain opaque
    - Headline valuation can overstate new-money returns if structure is heavy or liquidity stays private-only.
    - Cap-table transparency and a cleaner liquidity path would improve the risk-reward.
  notes: Each row states the core argument and the concrete fact pattern that would force a valuation upgrade or downgrade.
