- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Certification slips again
    - Skyryse still lacks full certification by the time it needs more capital
    - The current price assumes certification is a convert-to-revenue gate, not an endless science project.
    - Shift from TRACK to AVOID unless price resets materially lower.
  - - Another financing clears on structure-heavy terms
    - New money comes with meaningful preferences, anti-dilution, or a discount
    - Would show the headline mark is weaker than it appears for common-equity holders.
    - Treat the last-round headline valuation as overstated.
  - - No commercial proof after certification
    - No delivered aircraft, funded retrofit revenue, or backlog-conversion disclosure
    - Would mean platform optionality is still narrative rather than monetization.
    - Do not pay through the 2026 price anchor.
  - - Safety or legal friction worsens
    - Material new adverse signal from regulators, customers, or litigation
    - This category cannot absorb credibility hits easily when certification is central to value.
    - Cut the bull case and revisit the downside band.
  - - Public comp multiples compress further
    - Advanced-air-mobility equities reset lower without offsetting Skyryse-specific proof
    - Private rounds eventually feel the public market even if timing lags.
    - Increase required discount and tighten entry terms.
  notes: These are valuation transmission triggers, not a full risk register; each one changes price support rather than merely changing company quality rhetoric.
