  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table-terms
    missingEvidence: Liquidation preferences, anti-dilution protections, any participating preferred structure, and employee refresh obligations from the latest round.
    whyItMatters: A headline $1.15B post-money valuation can overstate common-equity economics for a new investor if the preference stack is heavy.
    diligencePath: Request the cap table, term sheet, financing docs, and counsel summary of preference economics.
    relatedQuestionRefs:
    - QV023
    - QV029
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Recognized revenue, backlog conversion, gross margin, installation economics, and any recurring software or service revenue split.
    whyItMatters: Without the denominator, valuation remains milestone-based rather than economically underwritten.
    diligencePath: Request management-certified historical financials, backlog bridge, and gross-margin detail by aircraft sale versus retrofit or service revenue.
    relatedQuestionRefs:
    - QV021
    - QV025
    - QV030
  - type: missing-source
    severity: material
    topic: certification-budget
    missingEvidence: Remaining FAA work plan, cost-to-certify, first-delivery schedule, and milestone gating by aircraft platform.
    whyItMatters: The current price only works if certification closes on schedule and turns platform optionality into commercial proof.
    diligencePath: Request program-management materials, certification budget, and milestone burndown with expected first-revenue timing.
    relatedQuestionRefs:
    - QV018
    - QV019
    - QV020
    - QV025
  - type: enumeration-incomplete
    severity: minor
    topic: valuation-comparables
    missingEvidence: More direct private secondary marks or disclosed post-money valuations for retrofit/autonomy peers rather than only funding rounds or strategic outcomes.
    whyItMatters: The comp table is a sample of the most decision-useful public and private references, not an exhaustive census of every adjacent autonomy company.
    diligencePath: Expand the comp set with banker books, secondary transactions, and additional private round materials for autonomy-system vendors.
    relatedQuestionRefs:
    - QV014
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Audited IPO-ready materials, bank feedback, formal secondary plans, or board-approved liquidity path documentation.
    whyItMatters: Even a fair private mark can be hard to realize if liquidity depends solely on future sponsor appetite.
    diligencePath: Request board materials covering banker outreach, auditor readiness, and any secondary or strategic-process planning.
    relatedQuestionRefs:
    - QV024
