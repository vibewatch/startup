- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Indicative valuation band (USD bn)
  - Probability signal
  - Core assumptions
  - Return logic vs $1.15B
  - Downside / confirmation trigger
  rows:
  - - Bull
    - 1.5-2.2
    - Needs multiple positive proofs, not just another narrative
    - Certification closes, first deliveries or retrofit contracts become visible, and SkyOS proves cross-fleet reuse.
    - About 30%-91% upside before dilution and terms.
    - Confirmed by certification completion, commercial conversion, and cleaner term disclosure.
  - - Base
    - 0.9-1.2
    - Most consistent with current evidence
    - The 2026 round broadly holds, certification closes without major slip, but economics disclosure remains thin.
    - Roughly -22% to +4%; not enough margin of safety for a fresh aggressive buy.
    - Confirmed if execution stays steady but disclosure does not materially improve.
  - - Bear
    - 0.4-0.7
    - Triggered by delay or stressed financing
    - Certification slips, skepticism lingers, and the next capital raise or market reset forces a lower clearing price.
    - About 39%-65% downside before any preference waterfall.
    - Confirmed by schedule slippage, structured financing, or no sign of revenue-quality proof.
  notes: Scenario bands are analyst judgement anchored to the last round, public-comp dispersion, and the absence of revenue disclosure; they are not appraised fair values.
