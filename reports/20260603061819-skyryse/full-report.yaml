      - number: '4.4'
        title: 'Verdict: adequately financed for the next phase, not yet underwritable on unit economics'
        blocks:
          - type: paragraph
            body: >-
              The supportable financial verdict is therefore mixed. Skyryse looks better capitalized than many private
              aerospace-autonomy peers heading into the expensive final-certification window, and the company has shown
              that customers or early adopters will at least place reservations at premium price points. But the
              underwriting gaps are still large enough that this chapter cannot treat financing momentum as proof of
              durable economics. Public evidence still does not reveal recognized revenue, backlog unit count,
              conversion from reservation to firm order, gross margin, cash burn, runway, debt obligations, customer
              concentration, or channel economics. The adverse legal record also matters: Moog's 2022 lawsuit shows
              supplier and IP friction has already surfaced once, which can translate into distraction, legal spend, and
              program delay risk in a category where timing is already everything. Until certification closes and public
              evidence demonstrates deliveries, revenue recognition, and at least some margin structure, Skyryse is best
              viewed as a well-funded but still diligence-heavy certification-stage aviation platform rather than a
              business with already proven financial quality.
