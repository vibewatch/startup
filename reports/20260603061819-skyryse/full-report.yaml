      - number: '2.2'
        title: 'Sizing lenses and buyer map: meaningful, but far smaller than generic AAM TAM rhetoric'
        blocks:
          - type: paragraph
            body: >-
              Evidence-constrained sizing points to a meaningful but bounded near-term market. The cleanest dollar lens
              in the cache is Market Research Future's U.S. helicopter avionics estimate of $2.1 billion in 2024 growing
              to $3.5 billion by 2035, but that number is still broader than Skyryse's current wedge because it includes
              navigation, communications, surveillance, and monitoring systems alongside flight controls. The same
              source's flight-control systems component range of roughly $420 million to $700 million is the better
              proxy for what Skyryse can more credibly attack near term. Publicly visible buyers also line up with that
              narrower reading. Private/general aviation demand is real enough to support sold-out first-edition
              reservations and a public list price for the introductory aircraft. Public-safety buyers are visible
              through CAL FIRE and mission profiles like firefighting, EMS, search and rescue, and law enforcement.
              Military demand is visible through the Army and Black Hawk retrofit path. Installation partners such as
              United Rotorcraft and Ace matter because they are part of the product, not just distribution. Mitsubishi
              adds a channel-led international path. Together, those segments create a credible buyer map, but they
              still do not justify assigning the whole eVTOL or AAM narrative to Skyryse today.
