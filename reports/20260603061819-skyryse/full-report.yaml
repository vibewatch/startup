      - number: '2.3'
        title: Adoption drivers are strong, but certification and integration still govern timing
        blocks:
          - type: paragraph
            body: >-
              Skyryse benefits from unusually clear demand drivers. Safety is the first. SkyOS and Skyryse One are sold
              on reduced pilot workload, emergency automation, envelope protection, and eventually helicopter autoland,
              all of which matter in high-workload rotorcraft missions. Independent safety material points in the same
              direction: the U.S. Helicopter Safety Team has explicitly encouraged more stability augmentation, simple
              autopilot adoption, flight-data monitoring, and even autonomy-enabled aircraft for hazardous missions.
              Training simplification is the second driver. Flying reported early orders from fixed-wing pilots moving
              into helicopters, the DOT strategy says simplified flight controls can open aviation to a new class of
              pilots, and Skyryse argues the FAA's MOSAIC rule could cut training burden for simplified vehicle
              operations. Mission urgency is the third driver, especially for firefighting and military operations where
              optional-pilot capability, degraded-visibility support, and easier interoperability have obvious value.
              The constraints are just as important. Skyryse still has to finish the R66 approval path, prove
              installability beyond a demo fleet, win operator trust, and show economic logic beyond a reservation
              deposit or partner announcement. That means timing is governed by certification and deployment proof, not
              only by market desire.
