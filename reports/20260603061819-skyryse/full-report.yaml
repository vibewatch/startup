      - number: '8.4'
        title: Bull, base, and bear ranges
        blocks:
          - type: paragraph
            body: >-
              A precise DCF would be performative here because the public record does not provide the revenue, margin,
              or backlog inputs required to support it. A scenario framework is more honest. The bull case is about $1.5
              billion to $2.2 billion and requires three things to happen together: certification closes on time, the
              first deliveries or retrofit contracts become commercially visible, and SkyOS proves it can scale beyond
              the Robinson R66 into larger fleet opportunities. The base case is roughly $0.9 billion to $1.2 billion,
              which treats the current round as broadly fair only if certification closes without major delay but
              disclosure remains thin. The bear case is about $0.4 billion to $0.7 billion if certification slips,
              public-market multiples compress further, or the next financing requires structure-heavy terms. In that
              frame, the announced $1.15 billion valuation already sits near the top of what current public evidence
              comfortably supports, leaving limited upside without a step change in proof.
            claimRefs:
