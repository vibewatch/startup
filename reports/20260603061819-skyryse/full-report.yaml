      - number: '8.2'
        title: Last-round context and what the mark does not prove
        blocks:
          - type: paragraph
            body: >-
              The February 2026 round resets the price anchor, but it does not eliminate underwriting discipline.
              Official and independent coverage align that the company raised more than $300 million, pushed lifetime
              disclosed equity above $605 million, and framed the proceeds around certification and scaling SkyOS. The
              2025 Form D adds useful texture because it shows Skyryse was still in late-stage fundraising only months
              before the unicorn announcement and still disclosed “No Revenues” at that point. That matters for
              valuation interpretation. A large round can be both impressive and incomplete: it proves investor
              willingness to fund the certification window, not that Skyryse has already crossed into transparent
              commercial scale. Reservation sell-out and multi-aircraft retrofit partnerships are good proof-of-interest
              signals, but they still sit well below the level of evidence investors would normally use to support a
              precise revenue multiple or DCF. The right reading of the $1.15 billion mark is therefore “plausible if
              milestones convert,” not “obviously cheap on current disclosed fundamentals.”
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV033
              - CV034
              - CV036
      - number: '8.3'
        title: Public-market and private-market reference points
        blocks:
          - type: paragraph
            body: >-
              The public comp set offers a bracket, not a formula. Joby and Archer both trade materially above Skyryse’s
              private mark despite still losing large amounts of money, while Eve trades around the same order of
              magnitude and Vertical sits far below it. Those numbers tell investors that capital markets still ascribe
              strategic value to advanced-air-mobility optionality, but they do not tell us that Skyryse’s specific
              model is worth any precise figure. That is because Skyryse is not primarily a clean-sheet air-taxi OEM.
              Its model is retrofit hardware plus software and certification leverage across existing fleets. That makes
              public eVTOL market caps imperfect analogs and pushes more attention toward closer but less transparent
              references such as Reliable Robotics, Merlin, and other autonomy or avionics vendors. The closest lesson
              from those adjacencies is not a clean multiple. It is that investors still fund aircraft-agnostic autonomy
              platforms when certification progress, installed-fleet applicability, and strategic exit potential are
              credible.
