            body: >-
              The core customer risk is that Skyryse's public story can sound more mature than the disclosed revenue
              proof actually is. Most of the named evidence clusters around a handful of marquee institutions and
              partners: CAL FIRE, the U.S. Army, United Rotorcraft or Air Methods, Ace, Mitsubishi, and an unnamed body
