  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Skyryse owns a retrofit-automation wedge, not the whole AAM stack'
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Skyryse is much narrower than the usual air-taxi or AAM headline. The
              company is not currently selling a city-air-taxi network, vertiport infrastructure, or a clean-sheet eVTOL
              aircraft. The public record instead shows a software-defined flight-control and automation platform that
              starts with the Robinson R66-based Skyryse One and is meant to spread across existing helicopters and
              adjacent airplanes. That is why the most relevant spend buckets are retrofit-capable flight controls,
              simplified cockpit hardware and software, safety automation, certification engineering, and
              installation/MRO work on legacy airframes. The published extension points all reinforce that reading:
              SkyOS is marketed as aircraft-agnostic, the FAA special conditions are tied to a modified R66 supplemental
              path, United Rotorcraft is named for Airbus and Black Hawk integration work, Ace is positioned as a Black
              Hawk retrofit hub, and Mitsubishi is framed as a channel to modernize existing aircraft in Japan. The
              broader AAM ecosystem still matters because policy and capital are moving toward more automated flight,
              but Skyryse should only capture that adjacency after its retrofit wedge is certified and repeatable.
