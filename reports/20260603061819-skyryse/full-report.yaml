      - number: '1.4'
        title: Milestones, certification path, and early adverse signals
        blocks:
          - type: paragraph
            body: >-
              The current operating narrative is dominated by certification progress and platform-extension milestones.
              Skyryse says the FAA granted final design approval for the SkyOS flight control computers in 2025, issued
              a Special Airworthiness Certificate for the first Skyryse One aircraft in 2024, and moved the program into
              for-credit flight testing by May 2025. The public regulatory record became more concrete in 2026, when the
              FAA published proposed and final special conditions for Skyryse’s modified Robinson R66 covering
              flight-control annunciation and static longitudinal stability. Milestone releases also show SkyOS moving
              beyond the Robinson platform into a Black Hawk demonstration, a U.S. Army CRADA, a CAL FIRE firefighting
              partnership, a United Rotorcraft retrofit/MRO partnership, and a Mitsubishi expansion agreement in Japan.
              But the company overview still contains real execution risk. Full civilian certification had not yet been
              granted by run date, the commercial revenue base remains largely undisclosed, and the public legal docket
              shows Moog suing Skyryse in 2022 over trade-secret-related allegations involving former employees. Even if
              that case does not define the investment thesis, it is evidence that supplier and IP friction have already
              surfaced in the company’s operating history.
