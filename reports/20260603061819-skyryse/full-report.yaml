  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and operator workflow
        blocks:
          - type: paragraph
            body: >-
              Skyryse’s product story is unusually concrete for a private aviation automation company because the public
              surface lets a reader trace the operator workflow from startup through landing. SkyOS is not pitched as a
              clean-sheet aircraft program; it is a software-defined fly-by-wire control stack meant to replace
              conventional mechanical cockpit complexity on existing airframes. On the current Skyryse One R66
              derivative, that translates into a single control stick, two touchscreens, automated checklists,
              autoflight, emergency-management logic, and a heavily simplified cockpit that removes more than 180
              components and more than 50 gauges, switches, and breakers. The company’s stated user promise is lower
              workload in routine and emergency phases of flight, with the same interface pattern intended to travel
              across helicopters and airplanes rather than remain trapped inside one flagship aircraft.
