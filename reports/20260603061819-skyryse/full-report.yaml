            body: >-
              The strongest public adverse legal item remains Moog's 2022 federal case against Skyryse, Misook Kim, and
              Robert Pilkington. The CourtListener docket shows that Moog filed a complaint and immediately sought
              preliminary injunctive relief and a temporary restraining order, followed by stipulated data-preservation
              and expedited discovery work. Without access to the sealed materials or a clean public outcome summary,
              investors cannot treat the matter as either thesis-breaking or irrelevant. What it does show is that
              supplier- and IP-related friction has already surfaced in Skyryse's operating history, and that the
              counterparty was not a trivial actor: Moog describes itself as a global aerospace and defense technology
              company.

              Governance visibility is also thinner than one would want for a company at this stage. Skyryse's public
              materials are rich on founder narrative, advisory bench, and mission, but still light on a detailed board
              map, committee structure, or named operating bench beyond the most visible leadership faces. At the same
              time, the careers and jobs pages show active hiring across certification, systems test, manufacturing,
              supply chain, growth, and government affairs. That combination is not necessarily a negative, but it does
              mean investors are still underwriting a founder- centric organization that appears to be building critical
              operating functions while simultaneously trying to certify, manufacture, and commercialize a
