        - label: Perception and Data Layer
          detail: >-
            GPS-denied localization, traffic awareness, weather and communications parsing, and aircraft-state data
            surfaced to Skylar.
        - label: Actuation Layer
          detail: >-
            Motor-control assembly plus jam-tolerant electric actuators that translate pilot intent into aircraft
            movement.
        - label: Airframe Layer
          detail: >-
            Robinson R66 today, with Black Hawk and additional retrofit targets used as proof of aircraft-agnostic
            deployment.
