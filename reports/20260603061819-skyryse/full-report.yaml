companyProfile:
  summary: >-
    Skyryse is a Southern California aviation technology company founded in 2016 by Mark Groden to simplify aircraft
    operation through software-defined flight controls. Its core platform, SkyOS, replaces conventional cockpit
    complexity with a fly-by-wire operating system intended to retrofit existing helicopters and airplanes. The
    company’s first certification wedge is Skyryse One, a Robinson R66-derived aircraft using a single control stick and
    touchscreen interface. By June 2026 Skyryse had raised more than $605 million, announced a $300M+ Series C at a
    $1.15B valuation, advanced into FAA for-credit flight testing, and assembled a partner set spanning the U.S. Army,
    CAL FIRE, United Rotorcraft, Mitsubishi, and other channels. The company remains promising but still
    pre-full-certification and financially opaque.
  foundedDate: '2016-01-01'
  founders:
