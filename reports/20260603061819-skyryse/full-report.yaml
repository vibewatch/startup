    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating thesis
        blocks:
          - type: paragraph
            body: >-
              Skyryse is an aviation hardware and software company headquartered in El Segundo, California, with
              additional lab and manufacturing operations in Hawthorne and a flight line in Camarillo. Founded in 2016
              by Mark Groden, the company’s core thesis is that aviation safety can be improved more effectively by
              digitizing and simplifying flight controls than by asking pilots to manage legacy mechanical cockpits with
              more training alone. That thesis is embodied in SkyOS, which the company describes as the first universal
              operating system for flight. Rather than building a clean-sheet aircraft, Skyryse uses retrofit-friendly,
              software-defined flight controls that can be applied to helicopters and airplanes, starting with the
              Robinson R66-based Skyryse One. The business model therefore spans hardware, software, certification,
              retrofit installation, and downstream integration partnerships across civilian and defense aircraft
              fleets. Public materials repeatedly position Skyryse as a dual-use platform company whose long-term value
              depends on certifying SkyOS once and then scaling it across many airframes rather than monetizing a single
              helicopter SKU.
