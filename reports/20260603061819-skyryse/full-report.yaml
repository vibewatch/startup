      - number: '1.3'
        title: Funding history, investor base, and commercialization signals
        blocks:
          - type: paragraph
            body: >-
              Skyryse’s capital story is now one of the company’s strongest externally verifiable proof points. The
              February 2026 Series C officially exceeded $300 million, valued the company at $1.15 billion, and lifted
              lifetime disclosed equity financing above $605 million. Cooley, Skyryse, TechCrunch, the Los Angeles
              Business Journal, and HeliHub all corroborate the broad outlines of the round, while Skyryse’s 2025 Form D
              shows a late-stage exempt offering with a $192.3 million total target and $167.1 million sold as of
              October 2025 from 46 investors. The Series C syndicate included Autopilot Ventures and Fidelity as
              co-leads plus ArrowMark, Atreides, BAM Elevate, Baron, Durable, Positive Sum, Qatar Investment Authority,
              Rokos-managed RCM Private Markets Fund, and Woodline. Commercially, Skyryse is not yet a scaled revenue
              company in the public record, but it does have visible demand signals: first-edition Skyryse One
              reservations sold out within six months, the company has publicly named Air Methods, United Rotorcraft,
              Mitsubishi, the U.S. Army, CAL FIRE, and Ace Aeronautics as partners, and management repeatedly frames
              certification capital as the bridge from platform proof to revenue realization.
