  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue quality
        - Recognized revenue, delivered aircraft, funded retrofit milestones, and backlog conversion
        - This is the missing denominator for every valuation method.
        - Finance diligence pack plus customer contract bridge.
      - - Gross margin and unit economics
        - Hardware margin, installation cost, warranty exposure, and any recurring software take rate
        - Needed to separate premium pricing from profitable delivery economics.
        - CFO review plus product-line contribution margin detail.
      - - Certification budget and timeline
        - Remaining cost-to-certify, test milestones, and first-delivery schedule
        - The $1.15B price only works if certification converts into commercialization in a reasonable window.
        - Program-management deck and milestone burndown.
      - - Cap table and preference stack
        - Liquidation preferences, anti-dilution, employee refresh, and any secondary pricing
        - Headline post-money value can differ sharply from new-money return math.
        - Legal diligence on financing docs and cap table.
      - - Fleet conversion proof
        - Reservation-to-order conversion, retrofit pipeline by airframe, and partner payment milestones
        - Tests whether SkyOS is a real platform or just a promising demo story.
        - Commercial diligence with sales and partner managers.
      - - Exit readiness
        - Audited materials, banker feedback, and any secondary or strategic process planning
        - Determines whether paper value can be monetized without another sponsor-only round.
        - Board materials plus auditor and banker workplan.
    notes: These asks are the minimum package required to turn the current private mark into an investable underwriting case.
