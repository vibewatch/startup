      - number: '3.4'
        title: Moat durability, switching costs, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Skyryse's durable advantage is not raw autonomy breadth. It is the narrower claim that an operator can
              keep an existing rotorcraft category, layer in certified fly-by-wire and emergency automation, and reduce
              pilot workload without waiting for a new eVTOL ecosystem to mature. That wedge creates meaningful
              switching costs because airframe integration, testing, certification, maintenance support, and training
              are all program-specific. But the moat is not impregnable. Reliable, Merlin, Shield AI, Near Earth, and
              Embention show how much capability can migrate into more generic autonomy stacks or better-capitalized
              defense software programs. Public eVTOL names can also crowd the narrative and capital benchmark. The
              adverse record matters too: Aviation Today quoted a skeptical helicopter pilot who questioned whether
              Skyryse's automation can safely resolve edge cases better than a human, and CourtListener shows that Moog
              escalated supplier and trade-secret conflict into litigation. Those signals do not invalidate Skyryse, but
              they do argue against treating the product story as uncontested.
