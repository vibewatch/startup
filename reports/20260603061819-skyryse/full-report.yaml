  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model is visible; revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Skyryse's publicly visible monetization starts with aircraft sales and deposits, not with disclosed
              recurring software revenue. The clearest evidence is the Skyryse One reservation funnel: the company said
              the First Edition sold out within six months, disclosed an introductory aircraft price of $1.8 million
              excluding customization, and continues to take $2,500 reservations for the next edition while leaving
              final pricing contingent on customization and delivery timing. That is useful evidence of willingness to
              pay, but it is still weak evidence of recognized revenue quality because the company also described
              reservations as refundable and has not disclosed how many units were sold, how many holders convert into
              traditional deposits, or how many aircraft have moved from reservation to firm purchase agreement. Beyond
              direct aircraft sales, management clearly frames SkyOS as a broader retrofit and integration platform. The
              Army, CAL FIRE, and Mitsubishi announcements all point to future monetization through defense programs,
              public-safety modernization, and international channel relationships, but none of those announcements
              provide contract value, payment milestones, or revenue-recognition detail.
