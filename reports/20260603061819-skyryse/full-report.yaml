      airframe surface that Skyryse is trying to modernize.
    data:
      layers:
        - label: User Interface Layer
          detail: >-
            Single control stick, two touchscreens, digital checklist, and simplified flight-phase commands for startup,
            takeoff, hover, and landing.
        - label: Automation Layer
          detail: >-
            Autoflight, envelope protection, emergency management, automated autorotation, and the announced autoland
            roadmap.
        - label: Compute Layer
