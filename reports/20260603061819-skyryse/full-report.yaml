              mobility. They also publish more market-visible scale markers than Skyryse: Stock Analysis listed Joby at
              $11.68 billion market cap, Archer at $5.12 billion, Eve at $1.18 billion, and Vertical at $338.69 million,
              with disclosed employee counts ranging from 198 to 2,559. Joby's acquisition of Xwing shows that adjacent
              players can buy autonomy capability instead of building only internally. The harder comparison is pricing.
              Skyryse at least exposed an introductory $1.8 million First Edition price and a $2,500 reservation
              deposit, but the reviewed rival surfaces generally did not disclose delivered-aircraft price lists,
              contract rates, or realized economics. That makes buyer behavior harder to observe directly and pushes
              diligence toward certification, mission fit, and distribution instead of list price.
