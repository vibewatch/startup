      - number: '8.5'
        title: Recommendation, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The valuation decision therefore comes down to discipline, not admiration. Skyryse has enough evidence to
              stay investable on a watchlist: real money came in recently, the certification effort is active, and the
              platform story extends into meaningful installed-fleet categories. But it does not yet have enough public
              proof to justify chasing the $1.15 billion mark on faith. New investors need the cap-table terms, audited
              or management-certified commercial metrics, a remaining certification budget and timeline, and clearer
              evidence that reservations or partnerships convert into high-quality revenue. Exit readiness also still
              looks more like another private round, strategic transaction, or selective secondary than a near-term
              public market bridge. Until those gaps close, the most disciplined stance is TRACK, negotiate for downside
              protection if the opportunity is live, and upgrade only when certification and commercial conversion
              become facts rather than aspirations.
