      - number: '1.2'
        title: Founder, leadership depth, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Mark Groden remains the defining public executive, technical storyteller, and fundraising face of Skyryse.
              Official materials identify him as founder and CEO, describe his background in sensor data fusion, and
              present a 60-plus patent track record tied to vehicle automation. The public leadership picture broadens
              through an unusually strong advisory bench that includes former NASA administrator Dan Goldin, former NTSB
              vice chairman Bruce Landsberg, former FAA certification chief Lirio Liu, former FAA chief counsel Marc
              Nichols, former Cirrus leader Dale Klapmeier, and former Tesla IR head Martin Viecha. Even so, the public
              record remains founder-centric. The SEC Form D names Mark Groden and several related persons, but
              public-facing company material does not provide a detailed operating-team roster, named board composition,
              or investor-governance map. That leaves a real diligence gap around succession planning, committee
              structure, protective provisions, and how much strategic decision-making is concentrated in Groden versus
              institutional investors and advisors.
