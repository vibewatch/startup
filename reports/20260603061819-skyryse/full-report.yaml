      - number: '4.3'
        title: Capital raised is large, but aviation-autonomy comps show how fast it can burn
        blocks:
          - type: paragraph
            body: >-
              Skyryse's strongest financial evidence is its ability to keep raising large equity rounds while still in
              certification. The company announced a February 2026 Series C of more than $300 million, said lifetime
              disclosed equity capital exceeded $605 million, and explicitly tied the new proceeds to completing FAA
              certification and scaling SkyOS across more aircraft. The 2025 Form D adds useful texture: it disclosed a
              $192.3 million offering, $167.1 million sold, $25.2 million remaining, a first sale date of September 16,
              2025, 46 investors, and Evercore acting in the placement process. Read together, those sources show a
              company that was still in active late-stage fundraising before the unicorn round and still needed fresh
              capital to bridge certification into commercialization. Public cost drivers are also visible: Skyryse is
              simultaneously running flight-test work, certification, manufacturing preparation, product integration,
              and channel development. Comparable public aviation-autonomy companies underscore why that matters. Joby,
              Archer, Eve, and Vertical all show either very low revenue or no revenue and still absorb large losses or
              negative free cash flow. Those are not direct forecasts for Skyryse, but they are a strong warning that
              even substantial capital can disappear quickly in this category before operating leverage appears.
