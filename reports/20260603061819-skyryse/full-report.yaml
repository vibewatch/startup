            body: >-
              The revenue engine that public investors can actually see remains certification-gated. Skyryse has
              assembled real commercial proof points — sold-out first-edition reservations, defense and firefighting
              partnerships, international expansion with Mitsubishi, and repeated statements that shipments are planned
              for 2026 — but the company has not disclosed any completed deliveries, recognized revenue, ARR, customer
              count, gross margin, CAC, payback, or conversion from refundable reservation to firm order. That means the
              current GTM story is best described as high-ticket aviation procurement plus channel development rather
              than a repeatable software-style funnel. Hiring signals reinforce that read. The careers and Greenhouse
              pages show active recruiting across certification, systems test, operations and manufacturing, supply
              chain, business development, and government affairs, alongside a benefits stack that includes salary,
              performance bonus, equity, relocation, healthcare, daily food, and wellness benefits. Those postings are
              bullish as execution signals, but financially they imply continued fixed-cost buildout before public
              evidence of recurring revenue. Underwriting therefore depends on how quickly certification milestones
              convert visible partner demand into signed production economics.
