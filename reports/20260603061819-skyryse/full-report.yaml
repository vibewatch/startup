  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The decision chain starts with fresh financing and platform optionality, but it runs through certification and
      disclosure gates before landing on a TRACK recommendation.
    data:
      nodes:
        - id: fresh-round
          label: Fresh 2026 round
          detail: Skyryse reset the private mark at $1.15B with $300M+ new capital.
        - id: platform
          label: Platform optionality
          detail: SkyOS is being positioned across multiple existing aircraft fleets.
        - id: certification
          label: Certification gate
          detail: Full FAA certification still remained open near run date.
        - id: economics
          label: Economics disclosure gap
          detail: No public revenue, margin, or cap-table term bridge exists yet.
        - id: public-comps
          label: Imperfect public comps
          detail: eVTOL equities provide a bracket but not a clean multiple for Skyryse.
        - id: decision
          label: TRACK at $1.15B
          detail: Wait for either better price/terms or better milestone proof.
      edges:
        - from: fresh-round
          to: platform
          label: supports the upside narrative
        - from: platform
          to: certification
          label: must convert through approval
        - from: certification
          to: economics
          label: still needs commercial proof
        - from: economics
          to: public-comps
          label: forces heuristic valuation
        - from: public-comps
          to: decision
          label: keeps the call price-sensitive
    claimRefs:
      - CV001
      - CV007
      - CV028
      - CV030
      - CV031
      - CV032
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The biggest positive drivers are certification and commercial conversion, while the biggest negatives are missing
      economics and market-compression risk.
    data:
      items:
        - label: Certification closes on time
          value: 4
        - label: First deliveries / funded retrofit revenue
          value: 4.5
        - label: Cross-fleet platform proof
          value: 2.5
        - label: No public revenue / margin bridge
          value: -4.5
        - label: Cap-table terms still unknown
          value: -2.5
        - label: Public comp multiple compression
          value: -3
        - label: Safety / legal skepticism persists
          value: -1.5
    approximationNotes: Bars are ordinal impact scores on valuation support, not direct changes in enterprise value.
    claimRefs:
      - CV032
      - CV033
      - CV035
      - CV037
      - CV038
      - CV041
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The current $1.15B round sits near the top of the base case, leaving limited upside without a step change in
      proof.
    data:
      items:
        - label: Bear case (M USD)
          low: 400
          mid: 550
          high: 700
        - label: Base case (M USD)
          low: 900
          mid: 1050
          high: 1200
        - label: Bull case (M USD)
          low: 1500
          mid: 1800
          high: 2200
        - label: 2026 round anchor (M USD)
          low: 1150
          mid: 1150
          high: 1150
    approximationNotes: >-
      Ranges are analyst judgement anchored to the latest private round, public-comp dispersion, and milestone risk
      rather than to a full DCF.
    claimRefs:
      - CV001
      - CV034
      - CV035
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      Market surface and technical ambition score well, while economics transparency, valuation clarity, and exit
      readiness remain weak.
    data:
      items:
        - label: Platform surface
          value: 4
          unit: /5
          detail: Multiple installed-fleet end markets are plausible.
        - label: Technical proof
          value: 4
          unit: /5
          detail: The program has real funding and live certification work.
        - label: Certification completeness
          value: 2
          unit: /5
          detail: The key approval gate is not yet closed.
        - label: Economics transparency
          value: 1
          unit: /5
          detail: Revenue and margin disclosure are still missing.
        - label: Comp support
          value: 2
          unit: /5
          detail: Public comps give only a rough bracket because the business models diverge.
        - label: Exit readiness
          value: 2
          unit: /5
          detail: Liquidity still looks more private or strategic than public-market ready.
        - label: Risk-adjusted entry
          value: 2
          unit: /5
          detail: The current mark leaves limited margin of safety without better proof.
    claimRefs:
      - CV030
      - CV031
      - CV039
      - CV040
      - CV043
