  topStrengths:
    - SkyOS is a differentiated retrofit-friendly fly-by-wire platform rather than a one-aircraft product story.
    - February 2026 financing added substantial capital and validated investor appetite at unicorn scale.
    - >-
      Certification has progressed beyond concept stage into FAA for-credit testing with bespoke special conditions
      already issued.
    - >-
      Partner network spans defense, firefighting, MRO, and international channels, creating multiple commercialization
      paths if certification closes.
    - Public technical materials show unusually concrete product detail for a private aviation-autonomy company.
  topRisks:
    - >-
      Full FAA certification is still not complete, so commercialization timing remains highly sensitive to regulatory
      slippage.
    - >-
      Public evidence does not disclose recognized revenue, gross margin, burn, or backlog conversion, making the
      economic case difficult to underwrite.
    - >-
      Scaling depends on third-party installation, MRO, and fleet partners such as United Rotorcraft, Ace, and
      institutional programs.
    - >-
      Founder concentration and limited public governance disclosure leave key-person and decision-rights risk
      unresolved.
    - >-
      Historical litigation and safety-skepticism coverage show that IP, supplier, and trust issues are not
      hypothetical.
  unresolvedGaps:
    - Exact revenue mix, runway, burn, and gross margin remain undisclosed.
    - Reservation-to-order conversion and installed-aircraft counts are not public.
    - Board composition, investor rights, and succession planning are not publicly detailed.
    - Final FAA certification timing and remaining open issue papers are not disclosed.
    - Commercial contract values for Army, CAL FIRE, Mitsubishi, and retrofit partners remain opaque.
