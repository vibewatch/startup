callouts:
  - calloutType: strength
    title: Platform strategy is broader than one helicopter SKU
    body: >-
      The strongest chapter-one evidence is not merely that Skyryse built Skyryse One, but that it used the R66 as a certification wedge for SkyOS, a retrofit-ready control system already shown on Black Hawk hardware and marketed for additional helicopter and airplane platforms.
    claimRefs:
      - CO003
      - CO004
      - CO007
      - CO039
      - CO043
  - calloutType: strength
    title: February 2026 financing materially de-risked the near-term runway question
    body: >-
      A $300M+ Series C at a $1.15B valuation with blue-chip crossover and sovereign participation gives Skyryse more balance-sheet flexibility than most private aviation-autonomy peers heading into the expensive certification and commercialization phase.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO026
      - CO028
  - calloutType: risk
    title: Certification remains the gating event for commercial scaling
    body: >-
      Even with final design approval on flight control computers and active for-credit testing, public materials still frame full FAA certification as work in progress. Until the approval path closes, Skyryse cannot prove that partner enthusiasm converts into broad civilian fleet revenue.
    claimRefs:
      - CO038
      - CO039
      - CO040
      - CO041
  - calloutType: risk
    title: Founder concentration is still high relative to company maturity
    body: >-
      Skyryse has an elite advisory bench, but the public executive and governance record remains highly centered on Mark Groden. The absence of a clearly disclosed board map or deep public operating roster leaves key-person and governance diligence open even after the unicorn round.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO020
      - CO021
  - calloutType: risk
    title: Historical trade-secret litigation is a reminder that supplier and IP execution can get messy
    body: >-
      Moog’s 2022 federal complaint against Skyryse and former Moog employees does not by itself break the thesis, but it shows that Skyryse’s path has already involved legal friction around sourcing, information control, and program execution.
    claimRefs:
      - CO050
