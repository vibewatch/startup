company:
  name: Skyryse
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Skyryse is a 2016-founded El Segundo aviation automation company building SkyOS, a universal fly-by-wire flight operating system intended to simplify and retrofit existing aircraft rather than design a clean-sheet airframe. Public evidence supports a February 2026 $300M+ Series C at a $1.15B valuation, more than $605M of cumulative equity raised, a late-stage FAA certification campaign for Skyryse One on the Robinson R66, and a broad partner set spanning military, firefighting, MRO, and international distribution. The same evidence also shows meaningful execution concentration around founder-CEO Mark Groden and lingering certification and litigation-related diligence questions.
sections:
  - id: identity-and-product
    title: Identity, footprint, and operating thesis
    body: >-
      Skyryse is an aviation hardware and software company headquartered in El Segundo, California, with additional lab and manufacturing operations in Hawthorne and a flight line in Camarillo. Founded in 2016 by Mark Groden, the company’s core thesis is that aviation safety can be improved more effectively by digitizing and simplifying flight controls than by asking pilots to manage legacy mechanical cockpits with more training alone. That thesis is embodied in SkyOS, which the company describes as the first universal operating system for flight. Rather than building a clean-sheet aircraft, Skyryse uses retrofit-friendly, software-defined flight controls that can be applied to helicopters and airplanes, starting with the Robinson R66-based Skyryse One. The business model therefore spans hardware, software, certification, retrofit installation, and downstream integration partnerships across civilian and defense aircraft fleets. Public materials repeatedly position Skyryse as a dual-use platform company whose long-term value depends on certifying SkyOS once and then scaling it across many airframes rather than monetizing a single helicopter SKU.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003
  - id: leadership-and-governance
    title: Founder, leadership depth, and governance visibility
    body: >-
      Mark Groden remains the defining public executive, technical storyteller, and fundraising face of Skyryse. Official materials identify him as founder and CEO, describe his background in sensor data fusion, and present a 60-plus patent track record tied to vehicle automation. The public leadership picture broadens through an unusually strong advisory bench that includes former NASA administrator Dan Goldin, former NTSB vice chairman Bruce Landsberg, former FAA certification chief Lirio Liu, former FAA chief counsel Marc Nichols, former Cirrus leader Dale Klapmeier, and former Tesla IR head Martin Viecha. Even so, the public record remains founder-centric. The SEC Form D names Mark Groden and several related persons, but public-facing company material does not provide a detailed operating-team roster, named board composition, or investor-governance map. That leaves a real diligence gap around succession planning, committee structure, protective provisions, and how much strategic decision-making is concentrated in Groden versus institutional investors and advisors.
    claimRefs:
      - CO001
