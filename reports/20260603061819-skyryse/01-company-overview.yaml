  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-disclosure
      missingEvidence: Audited revenue, margin, and cash-burn information tied to actual commercial deliveries or contracted recurring software revenue.
      whyItMatters: The company overview can confirm capital raised and certification progress, but not whether demand converts into durable economics or how far the existing balance sheet really stretches.
      diligencePath: Request board-approved budget, latest management accounts, and a backlog-to-revenue bridge by aircraft program.
      relatedQuestionRefs: [QO016, QO023]
    - type: private-evidence-only
      severity: material
      topic: governance-structure
      missingEvidence: Current board composition, investor-rights summary, committee structure, and succession planning documents.
      whyItMatters: Founder concentration is a real diligence issue, and public advisor prestige does not answer who governs downside decisions, financing terms, or CEO replacement scenarios.
      diligencePath: Obtain cap-table governance summary, board observer list, and current org chart with direct reports to the CEO.
      relatedQuestionRefs: [QO008, QO009]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: minor
      topic: funding-chronology
      missingEvidence: Reconciled bridge between the October 2025 Form D amounts and the February 2026 announced Series C proceeds.
      whyItMatters: The broad funding story is clear, but the relationship between the Form D raise and the later press release matters for understanding whether the round was tranched or materially upsized.
      diligencePath: Request signed financing documents or counsel summary explaining tranche timing, investors, and any secondary component.
      relatedQuestionRefs: [QO014, QO015]
      relatedTableRefs: [TO003, TO004]
    - type: missing-source
      severity: material
      topic: litigation-outcome
      missingEvidence: Publicly accessible summary of the disposition or settlement status of Moog v. Skyryse and any continuing obligations.
      whyItMatters: Historical trade-secret litigation may affect supplier relationships, IP diligence, and reputational risk even if it is no longer active.
      diligencePath: Pull the full docket through PACER or counsel memo and determine whether any injunction, settlement, or confidentiality terms survived.
      relatedQuestionRefs: [QO022]
    - type: missing-source
      severity: material
      topic: backlog-quality
      missingEvidence: Signed contract detail for Air Methods, CAL FIRE, Mitsubishi, Army, Ace, and United Rotorcraft programs including revenue model and deployment timing.
      whyItMatters: Named partnerships are strong top-of-funnel evidence, but not all partnership announcements represent production deployments or recurring revenue.
      diligencePath: Request each partner MOU or contract summary with aircraft count, scope of work, pricing, certification dependencies, and exclusivity terms.
      relatedQuestionRefs: [QO017, QO020, QO025]
