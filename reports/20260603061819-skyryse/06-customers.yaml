  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-metrics
    missingEvidence: A dated table of active paying accounts, installed aircraft, and delivered aircraft by customer segment.
    whyItMatters: Without an active-customer denominator the chapter cannot separate headline partnerships from commercial scale.
    diligencePath: Request board or investor materials with customer-count history, deliveries, and active install-base by segment.
    relatedQuestionRefs:
    - QU017
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Renewal, churn, NRR, GRR, and contract-length data for institutional accounts and reservation cancellations for owner-operator buyers.
    whyItMatters: Durability is the core missing dimension in the public customer story and changes how much value to assign to announced partnerships.
    diligencePath: Request customer cohort tables, renewal schedules, and reservation-to-deposit conversion by vintage.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue share, backlog share, or program share by top customer and top partner.
    whyItMatters: A small set of flagship relationships may drive most near-term value, so concentration can be much higher than the sector breadth implies.
    diligencePath: Request top-customer and top-partner concentration from management or data-room sales forecasts.
    relatedQuestionRefs:
    - QU021
    - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: A complete ledger of all named SkyOS customers, channel partners, and deployed aircraft programs.
    whyItMatters: The public chapter can prove several marquee relationships but cannot claim exhaustive customer enumeration from open sources alone.
    diligencePath: Ask management for a current customer and partner roster with stage, aircraft type, and commercial status.
    relatedQuestionRefs:
    - QU006
    - QU022
    relatedTableRefs:
    - TU003
