- id: durability-and-expansion-mechanics
  title: Durability evidence is thin while expansion mechanics are clear
  body: 'Skyryse''s public materials are much better at explaining how accounts could expand than at proving that customers actually renew or increase spend over time. The company''s expansion logic is intuitive: certify SkyOS once, validate it on hard aircraft such as the R66 and Black Hawk, and then push the operating system across additional airframes through installation partners such as United Rotorcraft, Ace, and Mitsubishi-linked channels. That is a strong mechanism for land-and-expand across aircraft families. What is missing is the durability layer that an investor would normally want in a customer chapter. No reviewed source disclosed net revenue retention, gross retention, churn, contract length, installed-fleet count, or customer-count growth. The closest repeat-demand signals are the sold-out first edition, continued reservation intake, and channel expansion to more aircraft types. Those are useful, but they are substitutes for renewal data, not equivalents. Certification progress
    also matters directly here: until Skyryse can move from demonstrations and retrofit planning into certified deliveries, most customer durability questions remain unmeasured in public.'
