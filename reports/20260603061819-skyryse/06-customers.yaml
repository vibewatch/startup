chapter:
  number: 6
  title: Customers
  summary: Skyryse has credible public customer-interest signals across private-owner reservations and a small set of named institutional relationships, especially CAL FIRE, the U.S. Army, Air Methods-linked retrofit channels, and Mitsubishi. The evidence is strongest for early demand, partnership breadth, and platform-expansion intent, but much weaker on active paid deployments, retention, and customer concentration because the company does not publicly disclose recurring customer metrics or install-base counts.
sections:
- id: segmentation-and-demand-signals
  title: Customer segmentation and first demand signals
  body: 'Skyryse''s customer story is broader than a single wealthy-owner helicopter purchase, but it is still early enough that demand proof has to be sorted carefully by segment. Public materials consistently point to two visible audiences. The first is a private-owner or owner-operator audience for Skyryse One, where the strongest proof comes from refundable reservations, a $1.8 million introductory price for the First Edition, a stated sell-out within six months, and FLYING''s observation that some of the first orders came from fixed-wing pilots seeking a safer transition into rotorcraft. The second is a set of institutional customers and channels spanning firefighting, defense, retrofit and MRO, and international modernization partners. Those relationships matter more strategically because they could scale SkyOS across existing fleets if certification closes. Still, the top of funnel is more visible than the bottom: AirVenture demo activity, website reservation flows, and broad partnership
    rhetoric all show interest, but none of them alone prove recurring revenue, active fleet deployment, or durable renewal behavior.'
