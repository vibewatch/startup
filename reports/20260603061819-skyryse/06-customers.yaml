- id: concentration-and-diligence-gaps
  title: Concentration risk and the diligence gap between interest and revenue
  body: 'The core customer risk is that Skyryse''s public story can sound more mature than the disclosed revenue proof actually is. Most of the named evidence clusters around a handful of marquee institutions and partners: CAL FIRE, the U.S. Army, United Rotorcraft or Air Methods, Ace, Mitsubishi, and an unnamed body of reservation holders. That concentration means a delay in any one flagship relationship could disproportionately affect the perception of traction. It also means the company can appear to have deep diversification by sector while still being commercially dependent on a narrow set of counterparties and pre-delivery programs. The most constructive adverse evidence comes from Aviation Tech Today, which paired real interest from Air Methods-related programs with skepticism from an experienced helicopter pilot who questioned whether Skyryse''s automation claims will hold across all edge-case emergencies. That critique does not invalidate demand, but it raises a real procurement
    question: how quickly will safety committees, regulators, and operators accept marketing-led simplicity claims without years of in-service evidence? Until Skyryse discloses backlog, deposits, customer concentration, and renewal behavior, investors should treat the chapter as promising but still heavily diligenced around conversion.'
