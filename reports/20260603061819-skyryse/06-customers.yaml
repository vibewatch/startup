    - Mitsubishi proof lacks disclosed aircraft counts
    - Japan channel value may be overstated without named operators
    - Confirm aircraft programs, local partners, and pilot-program dates
  - - Safety-led marketing
    - Skeptical expert views may slow procurement committee acceptance
    - Adoption cycles could lengthen even if technical demos are strong
    - Gather third-party operator evaluations and safety-case documentation
