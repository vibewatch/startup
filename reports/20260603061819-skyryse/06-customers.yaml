  title: Expansion can occur across airframes, not just within Skyryse One
  body: 'The most attractive part of the customer story is the multi-airframe retrofit logic: once SkyOS is validated and certified, United Rotorcraft, Ace, Army-related Black Hawk work, and Mitsubishi can all become vehicles for broader deployment.'
  claimRefs:
