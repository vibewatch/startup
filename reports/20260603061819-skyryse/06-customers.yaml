- id: named-institutional-proof
  title: Named institutional proof is real but mostly pre-deployment
  body: 'The strongest named customer proof sits in safety-critical institutional programs, but nearly all of it is still pre-deployment rather than broad production use. CAL FIRE is the clearest customer-proof source because Skyryse published a customer-quoted release and several trade outlets independently described the agency''s multi-year firefighting collaboration. The U.S. Army relationship is also meaningful, but it is explicitly a CRADA for development and validation, not a purchase order. Air Methods-linked proof is similarly valuable but nuanced: United Rotorcraft publicly committed Part 145 MRO support for Skyryse One and retrofit work on Airbus and Black Hawk variants, while earlier trade coverage said Skyryse had Air Methods contracts across Bell, Airbus, and Pilatus aircraft. Ace Aeronautics and Mitsubishi expand that network into Black Hawk resale and Japan-market modernization. Together these references prove more than logos, yet they stop short of disclosing installed unit
    counts, committed fleet sizes, or partner-specific economics. Skyryse''s Black Hawk first flight helps bridge that gap technically, but commercial conversion remains to be proven.'
