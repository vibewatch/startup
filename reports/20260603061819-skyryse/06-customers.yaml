  title: Named safety-critical institutions are the strongest proof layer
  body: CAL FIRE, the U.S. Army, and Air Methods-linked retrofit channels show that Skyryse has attracted attention from operators who care more about safety, training burden, and mission reliability than novelty alone.
  claimRefs:
