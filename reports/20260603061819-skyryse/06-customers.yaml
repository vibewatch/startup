  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Private owner-operators / fixed-wing upgraders
    - Owner-pilot / owner-pilot / private purchaser
    - Refundable reservations, First Edition sell-out, and FLYING review citing fixed-wing pilots among first orders
    - Shows consumer willingness to pay for a radically simplified rotorcraft interface
    - No disclosed reservation count, cancellations, or delivery conversion
  - - Firefighting agencies
    - Agency procurement / firefighting pilots / state or local budgets
    - CAL FIRE multi-year partnership with quoted agency executive and multiple trade writeups
    - High-visibility safety mission with credible public customer proof
    - Future deployment only; no installed SkyOS firefighting aircraft disclosed
  - - Defense / military users
    - Program office / military aviators / DoD budget
    - U.S. Army CRADA for training, interoperability, and optionally piloted Black Hawks
    - Validates dual-use demand in a demanding mission set
    - Not a disclosed procurement contract or funded fleet buy
  - - EMS / retrofit / MRO channel
    - Channel partner / operators and mechanics / operator or channel budgets
    - United Rotorcraft / Air Methods retrofit and Part 145 support commitments
    - Provides installation capacity and a route into existing fleets
    - No disclosed unit backlog, revenue share, or signed operator list
  - - Civilian Black Hawk operators
    - Reseller / public-safety and SAR operators / operator budgets
    - Ace partnership to equip hundreds of Black Hawks with SkyOS from an Alabama install hub
    - Expands into utility helicopter fleets beyond Skyryse One
    - Target aircraft count is company-stated and operator names are absent
  - - International modernization channel
    - Trading house / Japanese operators / operator or agency budgets
    - Mitsubishi partnership to deploy SkyOS on a variety of existing aircraft in Japan
    - Demonstrates international channel interest before certification closes
    - No aircraft list, order count, or deployment timing disclosed
  notes: Segmentation is inferred from named public proofs and demand signals, not from a disclosed revenue breakdown or account-level ledger.
