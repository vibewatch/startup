  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Airframe-agnostic retrofit thesis
    - A small number of public relationships can overstate diversification
    - One delayed flagship program could disproportionately affect perceived traction
    - Obtain partner-by-partner signed backlog and pipeline conversion
  - - Black Hawk install ecosystem
    - Progress depends on Army, Ace, and United-linked work streams
    - Black Hawk delays would weaken the strongest multi-airframe proof point
    - Review scope of work, retrofit economics, and certification milestones
