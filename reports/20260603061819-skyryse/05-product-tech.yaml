- id: engineering-readiness-and-diligence-gaps
  title: Engineering readiness and remaining diligence gaps
  body: 'The developer and support footprint reinforces that Skyryse is building a safety-critical product organization, not just a marketing concept. The careers page explicitly shows Engineering, Certification, Government Affairs, Operations and Manufacturing, and Business Development teams split across El Segundo and a Camarillo flight line. The Greenhouse board still showed nine openings at access date, including systems test, stress analysis, production, supply chain, technical writing, business development, and government affairs. A Built In DevOps posting is even more revealing: it references DO178C-adherent processes, CI/CD, software-in-the-loop testing, Kubernetes or Docker, and GitLab or GitHub branching. The open-role mix also suggests certification paperwork, partner execution, and factory ramp remain labor-intensive parts of commercialization rather than solved infrastructure. That is good evidence of serious software process investment, but it does not answer the hardest diligence questions. Public supportability still looks organization-heavy rather than self-serve. Investors still need closed-loop evidence on cybersecurity controls for Skylar, installed fleet hours, dispatch reliability, partner retrofit throughput, and the exact FAA close-out path from today’s special conditions and for-credit testing to broad commercial certification.'
