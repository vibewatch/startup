- id: TE002
  title: Workflow and use-case table
  columns:
  - User job
  - Current workflow pain
  - Skyryse solution
  - Public benefit signal
  - Limitation
  rows:
  - - Start, fly, and land a light helicopter
    - Legacy cockpit requires many discrete controls and memorized checklist steps
    - Single control stick, touchscreens, digital checklist, autoflight, swipe-based phases of flight
    - Skyryse One removes 180+ components and 50+ gauges, switches, and breakers
    - Company materials do not disclose transition-training data or comparative accident rates
  - - Manage abnormal or emergency events
    - Pilot workload spikes during low visibility, engine failures, or unstable flight states
    - Envelope protection, autorotation, emergency-management logic, and planned autoland
    - Skyryse markets automated autorotation today and autoland as a next feature
    - Autoland is still announced rather than fielded
  - - Handle ATC, NOTAMs, weather, and navigation context
    - Pilots manually combine fragmented radio, chart, and weather inputs
    - Skylar transcribes communications, interprets notices, and suggests context-aware actions
    - Public feature list covers ATC parsing, weather, ADS-B traffic, and route optimization
    - No public disclosure of model-accuracy, human-override, or audit logging metrics
  - - Deploy simplified controls on military utility aircraft
    - Black Hawk crews face high workload and multi-mission complexity
    - SkyOS retrofit with single-stick control, automated hover, and optionally piloted framing
    - Skyryse flew a Black Hawk after 91 days of integration and signed an Army CRADA
    - Still a demo and research path, not an announced production fielding program
  - - Upgrade firefighting or utility fleets
    - Pilots operate in low visibility, high workload, and dangerous operating envelopes
    - SkyOS paired with partner installation and future optionally piloted payload-focused concepts
    - CAL FIRE and United Rotorcraft announcements map to firefighting and Airbus H125/H130 use cases
    - Public evidence stops before customer deliveries or documented outcomes
  notes: Benefits reflect company-stated workflow improvements and independent reporting on certification progress; limitations mark where public evidence is still sparse.
