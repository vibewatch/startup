  evidenceGaps:
  - type: missing-source
    severity: material
    topic: certification-closeout
    missingEvidence: A current FAA program view showing remaining issue papers, open findings, conformity backlog, and target close dates for Skyryse One and follow-on STC approvals.
    whyItMatters: The public record proves special conditions and for-credit testing, but not the exact remaining work between today’s milestones and broad commercial certification.
    diligencePath: Request the certification program plan, FAA correspondence summary, and an open-items tracker mapping each finding to expected closure timing.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: cybersecurity-controls
    missingEvidence: Public or shareable documentation for cybersecurity certification, secure-development controls, data retention, privacy, and LLM governance for SkyOS and Skylar.
    whyItMatters: Skylar processes communications and aircraft-state context, so diligence needs more than marketing claims to judge software assurance, privacy exposure, and AI guardrails.
    diligencePath: Request the security architecture, secure-SDLC policy, penetration-test summaries, incident response process, and any SOC 2, ISO 27001, or aviation-cyber mappings.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: operational-reliability-metrics
    missingEvidence: Installed aircraft counts, fleet hours, dispatch reliability, MTBF, mean time to repair, and service-level commitments for any SkyOS-equipped aircraft in testing or field use.
    whyItMatters: Without field reliability data, investors cannot judge whether simplified controls and redundancy claims translate into maintainable operational performance.
    diligencePath: Request fleet-operating logs, reliability dashboards, maintenance event summaries, and support SLA documents by aircraft program.
    relatedQuestionRefs:
    - QE025
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: deployment-throughput
    missingEvidence: Signed backlog, retrofit cycle time, installation staffing, and field-support capacity across United Rotorcraft, Ace, and any additional MRO or distribution partners.
    whyItMatters: Skyryse’s commercialization thesis depends on deployment throughput through third parties, not only on certification progress or demo flights.
    diligencePath: Request partner statements of work, installation-capacity plans, historical pilot projects, and pipeline conversion metrics by partner and aircraft type.
    relatedQuestionRefs:
    - QE015
    - QE028
    relatedTableRefs:
    - TE003
    - TE005
