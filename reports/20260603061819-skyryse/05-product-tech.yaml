- id: deployment-roadmap-and-platform-expansion
  title: Deployment, roadmap, and platform expansion
  body: 'Public deployment evidence suggests Skyryse is trying to prove platform breadth before it proves scaled deliveries. The most important proof point is not simply that Skyryse One exists, but that SkyOS was integrated into a Black Hawk in 91 days and flown through automated pickup, hover, and setdown maneuvers. Around that demo, Skyryse has assembled a partner map that matters operationally: United Rotorcraft for FAA Part 145 MRO and Airbus H125/H130 work, Ace Aeronautics for Black Hawk retrofit installations, the U.S. Army for training and optionally piloted use cases, CAL FIRE for aerial firefighting concepts, and Mitsubishi for Japan expansion. Even the Robinson wedge is only partially under Skyryse''s control, because the underlying airframe, technical publications, and maintenance ecosystem remain owned by the base OEM. The roadmap is active rather than static, with 2025–2026 releases covering the updated cockpit, Skylar, MOSAIC positioning, and a planned emergency autoland capability. What remains unclear is how quickly those announcements convert into certified, revenue-generating, supportable fleet deployments.'
