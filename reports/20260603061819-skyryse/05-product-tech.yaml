- id: FE001
  title: SkyOS product architecture map
  type: stack
  summary: The stack runs from the pilot-facing interface down to compute, sensors, actuators, and the underlying legacy airframe surface that Skyryse is trying to modernize.
  data:
    layers:
    - label: User Interface Layer
      detail: Single control stick, two touchscreens, digital checklist, and simplified flight-phase commands for startup, takeoff, hover, and landing.
    - label: Automation Layer
      detail: Autoflight, envelope protection, emergency management, automated autorotation, and the announced autoland roadmap.
    - label: Compute Layer
      detail: Triply redundant flight-control computers running SkyOS control laws and deterministic expert-AI logic.
    - label: Perception and Data Layer
      detail: GPS-denied localization, traffic awareness, weather and communications parsing, and aircraft-state data surfaced to Skylar.
    - label: Actuation Layer
      detail: Motor-control assembly plus jam-tolerant electric actuators that translate pilot intent into aircraft movement.
    - label: Airframe Layer
      detail: Robinson R66 today, with Black Hawk and additional retrofit targets used as proof of aircraft-agnostic deployment.
