chapter:
  number: 5
  title: Product & Technology
  summary: 'Skyryse has published enough product detail to support a real product-tech assessment: SkyOS is a software-defined fly-by-wire control stack already packaged inside the Skyryse One R66 derivative and extended into Skylar, Black Hawk demonstrations, and multiple partner deployment programs. Public evidence supports meaningful cockpit simplification, redundancy, and certification progress, but follow-on capabilities such as autoland, broad fleet deployment, and cybersecurity or reliability metrics remain more roadmap- and diligence-driven than field-proven.'
sections:
- id: product-definition-and-operator-workflow
  title: Product definition and operator workflow
  body: Skyryse’s product story is unusually concrete for a private aviation automation company because the public surface lets a reader trace the operator workflow from startup through landing. SkyOS is not pitched as a clean-sheet aircraft program; it is a software-defined fly-by-wire control stack meant to replace conventional mechanical cockpit complexity on existing airframes. On the current Skyryse One R66 derivative, that translates into a single control stick, two touchscreens, automated checklists, autoflight, emergency-management logic, and a heavily simplified cockpit that removes more than 180 components and more than 50 gauges, switches, and breakers. The company’s stated user promise is lower workload in routine and emergency phases of flight, with the same interface pattern intended to travel across helicopters and airplanes rather than remain trapped inside one flagship aircraft.
