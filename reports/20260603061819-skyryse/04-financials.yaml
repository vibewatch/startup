      diligencePath: Request signed customer contracts, revenue-recognition policy, and current revenue mix by aircraft sale versus software or service.
      relatedQuestionRefs: [QI003]
    - type: private-evidence-only
      severity: blocking
      topic: recognized-revenue
      missingEvidence: Audited or management-reported revenue, ARR, delivered aircraft count, backlog unit count, and reservation-to-order conversion data.
      whyItMatters: These metrics are required to underwrite current scale, backlog quality, and near-term growth.
      diligencePath: Request quarterly management accounts, backlog schedule, delivered-aircraft list, and reservation waterfall.
      relatedQuestionRefs: [QI007]
    - type: private-evidence-only
      severity: blocking
      topic: runway
      missingEvidence: Cash on hand, monthly burn, runway months, and any debt, liens, guarantees, or project-finance obligations.
      whyItMatters: Capital raised is known, but capital remaining is not; that makes runway underwriting impossible.
      diligencePath: Request current cash balance, trailing 12-month burn, forecast burn, and debt schedule from finance leadership.
      relatedQuestionRefs: [QI014]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, installation cost, warranty burden, CAC, channel commissions, and payback by customer segment.
      whyItMatters: Premium list pricing does not prove profitable delivery or efficient growth.
      diligencePath: Request unit economics by aircraft sale, retrofit program, and partner channel plus sensitivity to certification timing.
      relatedQuestionRefs: [QI015]
      relatedTableRefs: [TI004]
    - type: missing-source
      severity: material
      topic: reservation-conversion
      missingEvidence: Public or private evidence showing how many reservations convert into firm deposits and then accepted deliveries.
      whyItMatters: Reservation sellout is the strongest current demand signal, but its financial quality is impossible to judge without conversion data.
      diligencePath: Request reservation cohort data, refund rates, and signed purchase agreement counts by edition.
      relatedQuestionRefs: [QI006, QI022]
      relatedTableRefs: [TI001, TI003]
