  - id: TI004
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Recognized revenue / ARR
        - Undisclosed
        - medium
        - Core starting point for any underwriting model
        - Request audited revenue by quarter and any recurring software revenue split
      - - Gross margin / contribution margin
        - Undisclosed
        - medium
        - Needed to separate premium pricing from profitable delivery economics
        - Request BOM, installation labor, warranty, and service gross margin
      - - CAC / payback
        - Undisclosed
        - medium
        - Needed to test whether partner-led demand converts efficiently
        - Request channel commissions, direct sales cost, and sales-cycle length by segment
      - - Cash burn / runway
        - Undisclosed
        - medium
        - Determines whether current cash can bridge certification and production ramp
        - Request monthly burn, capex plan, and minimum cash covenant assumptions
      - - Backlog unit count / conversion
        - Undisclosed
        - medium
        - Reservation quality depends on unit count and conversion to firm orders
        - Request reserved units, deposit conversion, and cancellation rate
      - - Debt / project-finance obligations
        - No public evidence located
        - low
        - Debt could materially change runway and downside risk
        - Request debt schedule, liens, guarantees, and any aircraft financing arrangements
    notes: >-
      Null or undisclosed means the reviewed public record did not provide a numeric value fit for underwriting. The limitation is the data gap, not the importance of the metric.
