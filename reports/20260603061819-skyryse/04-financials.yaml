company:
  name: Skyryse
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports premium Skyryse One list pricing, strong financing access, and several partner-led monetization paths, but it does not disclose recognized revenue, gross margin, cash burn, runway, or backlog unit count. The financial case therefore rests more on capital adequacy and platform optionality than on proven unit economics, and peer aviation-autonomy benchmarks suggest certification-led commercialization can still consume hundreds of millions before margins stabilize.
sections:
  - id: monetization-and-pricing
    title: Monetization model is visible; revenue quality is not
    body: >-
      Skyryse's publicly visible monetization starts with aircraft sales and deposits, not with disclosed recurring software revenue. The clearest evidence is the Skyryse One reservation funnel: the company said the First Edition sold out within six months, disclosed an introductory aircraft price of $1.8 million excluding customization, and continues to take $2,500 reservations for the next edition while leaving final pricing contingent on customization and delivery timing. That is useful evidence of willingness to pay, but it is still weak evidence of recognized revenue quality because the company also described reservations as refundable and has not disclosed how many units were sold, how many holders convert into traditional deposits, or how many aircraft have moved from reservation to firm purchase agreement. Beyond direct aircraft sales, management clearly frames SkyOS as a broader retrofit and integration platform. The Army, CAL FIRE, and Mitsubishi announcements all point to future monetization through defense programs, public-safety modernization, and international channel relationships, but none of those announcements provide contract value, payment milestones, or revenue-recognition detail.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI038
      - CI039
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-traction-and-unit-economics
    title: Public traction is certification-gated and partner-led
    body: >-
      The revenue engine that public investors can actually see remains certification-gated. Skyryse has assembled real commercial proof points — sold-out first-edition reservations, defense and firefighting partnerships, international expansion with Mitsubishi, and repeated statements that shipments are planned for 2026 — but the company has not disclosed any completed deliveries, recognized revenue, ARR, customer count, gross margin, CAC, payback, or conversion from refundable reservation to firm order. That means the current GTM story is best described as high-ticket aviation procurement plus channel development rather than a repeatable software-style funnel. Hiring signals reinforce that read. The careers and Greenhouse pages show active recruiting across certification, systems test, operations and manufacturing, supply chain, business development, and government affairs, alongside a benefits stack that includes salary, performance bonus, equity, relocation, healthcare, daily food, and wellness benefits. Those postings are bullish as execution signals, but financially they imply continued fixed-cost buildout before public evidence of recurring revenue. Underwriting therefore depends on how quickly certification milestones convert visible partner demand into signed production economics.
    claimRefs:
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
