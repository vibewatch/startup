      - TI004
    figureRefs:
      - FI002
  - id: capital-adequacy-and-cost-structure
    title: Capital raised is large, but aviation-autonomy comps show how fast it can burn
    body: >-
      Skyryse's strongest financial evidence is its ability to keep raising large equity rounds while still in certification. The company announced a February 2026 Series C of more than $300 million, said lifetime disclosed equity capital exceeded $605 million, and explicitly tied the new proceeds to completing FAA certification and scaling SkyOS across more aircraft. The 2025 Form D adds useful texture: it disclosed a $192.3 million offering, $167.1 million sold, $25.2 million remaining, a first sale date of September 16, 2025, 46 investors, and Evercore acting in the placement process. Read together, those sources show a company that was still in active late-stage fundraising before the unicorn round and still needed fresh capital to bridge certification into commercialization. Public cost drivers are also visible: Skyryse is simultaneously running flight-test work, certification, manufacturing preparation, product integration, and channel development. Comparable public aviation-autonomy companies underscore why that matters. Joby, Archer, Eve, and Vertical all show either very low revenue or no revenue and still absorb large losses or negative free cash flow. Those are not direct forecasts for Skyryse, but they are a strong warning that even substantial capital can disappear quickly in this category before operating leverage appears.
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI043
    tableRefs:
      - TI005
      - TI006
    figureRefs:
      - FI003
  - id: verdict-and-diligence-blockers
    title: 'Verdict: adequately financed for the next phase, not yet underwritable on unit economics'
    body: >-
      The supportable financial verdict is therefore mixed. Skyryse looks better capitalized than many private aerospace-autonomy peers heading into the expensive final-certification window, and the company has shown that customers or early adopters will at least place reservations at premium price points. But the underwriting gaps are still large enough that this chapter cannot treat financing momentum as proof of durable economics. Public evidence still does not reveal recognized revenue, backlog unit count, conversion from reservation to firm order, gross margin, cash burn, runway, debt obligations, customer concentration, or channel economics. The adverse legal record also matters: Moog's 2022 lawsuit shows supplier and IP friction has already surfaced once, which can translate into distraction, legal spend, and program delay risk in a category where timing is already everything. Until certification closes and public evidence demonstrates deliveries, revenue recognition, and at least some margin structure, Skyryse is best viewed as a well-funded but still diligence-heavy certification-stage aviation platform rather than a business with already proven financial quality.
    claimRefs:
      - CI030
      - CI041
      - CI042
      - CI043
      - CI044
      - CI045
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Current public status
      - Revenue-quality view
      - Diligence ask
    rows:
      - - Skyryse One First Edition aircraft sale
        - High-ticket aircraft sale
        - Introductory price disclosed at $1.8M; First Edition sold out in six months; unit count undisclosed
        - Shows premium willingness to pay, but not recognized revenue or backlog value
        - Request units reserved, purchase-agreement conversion, and delivery schedule
      - - Reservation deposits
        - Refundable reservation deposits
        - $2,500 next-edition reservation disclosed; first-edition reservations later convert to traditional deposits
        - Weak proxy for committed revenue because deposits are refundable and conversion terms are undisclosed
        - Request refund rate, cancellation terms, and reservation-to-order conversion data
      - - SkyOS retrofit / integration
        - Software plus hardware retrofit and integration work on third-party aircraft
        - Army, CAL FIRE, and Mitsubishi announcements show deployment intent across other airframes
        - Attractive platform upside, but no public contract economics or recognition policy
        - Request statement of work, milestone payments, and hardware/software revenue split
      - - Government / mission programs
        - Defense and public-safety modernization programs
        - Partnerships disclosed, but no funded contract value or booked revenue disclosed
        - Strategically important proof point, not yet proof of cash receipts
        - Request funded milestones, budget authority, and program duration
      - - International / channel expansion
        - Partner-led deployment into external markets
        - Mitsubishi partnership indicates channel reach beyond direct US aircraft sales
        - Expands TAM, but timing and take rate remain unknown
        - Request channel margin, reseller economics, and order pipeline by geography
    notes: >-
      This table separates visible monetization paths from recognized revenue. Public sources show prices, deposits, and partnership pathways, but not firm backlog value, delivered aircraft, or accounting treatment.
