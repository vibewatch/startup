  - id: TI006
    title: Public comp capital-intensity table
    columns:
      - Company
      - Public revenue signal
      - Loss / burn signal
      - Balance-sheet signal
      - Why it matters for Skyryse
    rows:
      - - Joby Aviation
        - 2025 revenue of $53.43M
        - 2025 losses of -$929.84M
        - Stock Analysis page also referenced a strong cash position in Q1 2026
        - Even the best-funded public peer still shows huge losses while scaling aircraft programs
      - - Archer Aviation
        - LTM revenue of $1.90M
        - -$742.50M net loss and -$588.80M free cash flow
        - $1.78B cash and $121.80M debt
        - Shows how quickly manufacturing and certification programs can consume capital
      - - Eve Holding
        - Revenue not disclosed / pre-revenue on reviewed page
        - -$244.28M net income
        - Stock Analysis page referenced a $441M cash position in milestone coverage
        - Certification-stage players can remain deeply cash consumptive before deliveries begin
      - - Vertical Aerospace
        - No TTM revenue on reviewed page
        - -$134.67M net income
        - No comparable cash figure was extracted from the retained page
        - Pre-revenue public peers remain dependent on capital markets and milestone progress
    notes: >-
