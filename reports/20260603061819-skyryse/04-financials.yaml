  - id: TI003
    title: GTM motion and sales efficiency proxy table
    columns:
      - Proxy
      - Public signal
      - Why it matters
      - Limitation
      - Diligence ask
    rows:
      - - Demand signal
        - First Edition sold out in six months
        - Indicates some early willingness to commit to the product concept
        - Unit count and customer composition are undisclosed
        - Request reservations by cohort, geography, and customer type
      - - Delivery timing
        - First aircraft were scheduled to ship in 2026
        - Sets expectations for when deposits might convert into deliveries
        - Public sources do not confirm actual 2026 deliveries by run date
        - Request delivered aircraft count and acceptance dates
      - - Defense channel
        - Army CRADA cites possible application across 2,400 Black Hawk helicopters
        - Large fleet reference suggests meaningful budget opportunity if programs convert
        - CRADA is not the same as booked revenue
        - Request funded phases, test milestones, and expected procurement path
      - - Public-safety channel
        - CAL FIRE partnership focuses on firefighting aircraft modernization
        - Points to mission-critical buyers that value safety and optional piloting
        - No disclosed contract value or timing
        - Request aircraft scope, budget, and payment schedule
      - - International channel
        - Mitsubishi partnership targets Japanese deployment of SkyOS
        - Suggests external distribution leverage beyond direct US selling
        - No public channel economics or unit commitments
        - Request geographic roadmap, take rate, and pipeline assumptions
    notes: >-
      These are GTM and sales-efficiency proxies, not direct revenue metrics. They help frame the likely sales motion but do not reveal CAC, payback, or win-rate.
