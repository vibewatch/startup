    data:
      columns:
        - Disclosed
        - Partially disclosed
        - Undisclosed
      rows:
        - label: Revenue quality
          values:
            - First Edition list price and reservation fee
            - Sold-out reservations without unit count
            - Recognized revenue, ARR, customer concentration
        - label: Capital adequacy
          values:
            - More than $605M total disclosed equity and a >$300M Series C
            - Use-of-proceeds narrative tied to certification and scaling
            - Cash on hand, monthly burn, runway months
        - label: Unit economics
          values:
            - None
            - Refundable reservation structure and premium aircraft list price
            - Gross margin, CAC, payback, installation economics
