  - - Initial aircraft wedge (Skyryse One on R66)
    - Aircraft sale, SkyOS-enabled controls, training, support, future upgrade path
    - Entire helicopter OEM market or all general-aviation spend
    - Private owner-operators and early institutional launch buyers
    - Near-term commercial entry point
  - - Broader rotorcraft avionics modernization
    - Navigation, communication, surveillance, monitoring, and flight-control upgrades
    - Routine maintenance without avionics modernization
    - Commercial, government, and private helicopter operators
    - Useful upper bound, but broader than Skyryse
  - - Mission autonomy for military / public safety fleets
    - Optional-pilot kits, mission software, safety automation, retrofit packages
    - Weapons, ISR payloads, unrelated mission equipment
    - Defense and public-safety budget owners
    - High-value adjacency with longer cycles
  - - AAM / eVTOL ecosystem
    - Clean-sheet eVTOL aircraft, network operations, traffic management, vertiport-related software
    - Treating all AAM spend as current Skyryse TAM
    - Public-market investors, airlines, future operators, infrastructure backers
    - Strategic adjacency, not owned TAM today
