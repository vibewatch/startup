- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Private / GA owner-operator
    - Individual buyer reserving or purchasing a Skyryse One
    - Pilot-owner or transition pilot
    - Individual or small business
    - Reserve aircraft -> training -> delivery -> recurring support
    - Owner / operator capital budget
    - Safer helicopter access and simpler transition from fixed-wing
  - - Public safety / firefighting / EMS-like operators
    - CAL FIRE-style agency or contracted operator
    - Pilots, first responders, air-ops supervisors
    - Agency budget or mission program budget
    - Fleet modernization -> mission integration -> training -> operational deployment
    - State or local air-ops leadership
    - Safety, limited-visibility performance, optional-pilot capability
  - - Military programs
    - Army or defense customer using Black Hawk-type fleets
    - Pilots, maintainers, mission planners
    - Defense procurement program
    - CRADA / test path -> validation -> retrofit decision -> fielding
    - Program executive office / command budget
    - Training reduction, interoperability, higher-risk missions
  - - MRO / installation partner
    - United Rotorcraft or Ace-type integrator
    - Technicians, completion centers, field service teams
    - Operator or program sponsor
    - Engineering fit -> certification support -> installation -> maintenance
    - Retrofit sponsor plus integrator economics
    - Need for scalable install capacity across legacy fleets
  - - International distributor / OEM channel
    - Mitsubishi-style channel partner
    - Local operators and service networks
    - Distributor, export buyer, or government buyer
    - Localization -> platform selection -> approvals -> deployment
    - Regional distributor or sovereign buyer
    - Existing-aircraft modernization in overseas markets
  notes: Buyer, user, and payer roles differ materially by segment. For Skyryse, installation and certification partners are part of the demand chain, not just post-sale service providers.
