- id: adjacent-markets-and-valuation-implications
  title: Adjacencies validate demand for autonomy, but they should be treated as upside not base-case TAM
  body: 'The surrounding market context is still useful for valuation, but only if it is handled carefully. Reliable Robotics, Merlin, Near Earth, and Shield AI all show that aircraft autonomy buyers already exist in commercial, cargo, and defense settings and that vendors are trying to retrofit or layer autonomy onto existing fleets rather than wait for entirely new aircraft categories. That supports Skyryse''s strategic logic. The public eVTOL set around Joby, Eve, Archer, and Vertical shows something different: investors will ascribe multibillion-dollar equity values to the future of automated aviation, but those companies are chasing clean-sheet aircraft, urban air-mobility services, and in some cases air-traffic-management platforms. Those are adjacent markets, not Skyryse''s present owned market. The practical implication is that upside cases can reference broader autonomy and eVTOL comparables as evidence that automated aviation may become large, but base cases should anchor on the
    smaller rotorcraft retrofit and modernization wedge that Skyryse can reach through certification, partner-enabled installation, and repeatable mission proof.'
