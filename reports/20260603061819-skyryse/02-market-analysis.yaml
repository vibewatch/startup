- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Safety automation for high-workload rotorcraft missions
    - Driver
    - Near-term
    - Supports adoption in firefighting, training, and degraded-visibility operations
    - Request operator safety case and measurable pilot-workload deltas
  - - Training simplification and easier pilot transition
    - Driver
    - Near-term
    - Could widen private and institutional buyer pool if training burden falls
    - Validate actual syllabus hours and insurance treatment after certification
  - - MOSAIC / simplified vehicle operations narrative
    - Driver
    - Medium-term
    - Potentially lowers training and maintenance barriers for simplified aircraft
    - Confirm how Skyryse-certified aircraft will actually qualify under final rules
  - - Military and public-safety modernization budgets
    - Driver
    - Near-term to medium-term
    - Creates non-recreational demand where optional-pilot and interoperability matter
    - Confirm program funding, procurement path, and who owns integration budget
  - - Retrofit preference over fleet replacement
    - Driver
    - Ongoing
    - Legacy fleets may modernize faster than they replace aircraft
    - Build per-airframe economics for retrofit versus replacement decisions
  - - R66 certification and STC completion
    - Constraint
    - Immediate
    - Commercial scaling is gated by finishing the approval path
    - Track remaining FAA milestones, test credits, and post-certification modifications
  - - Install complexity and partner throughput
    - Constraint
    - Immediate
    - The product depends on engineering fit, MRO capacity, and field support
    - Audit installation hours, parts availability, and partner training readiness
  - - Opaque ROI and recurring economics
    - Constraint
    - Ongoing
    - Without pricing and payback evidence, buyers may defer or limit fleet rollout
    - Request signed pricing, software/support attach rates, and customer ROI case studies
  notes: 'Direction labels describe impact on adoption, not certainty of outcome. The biggest risk is sequencing: strong mission logic exists, but revenue timing still depends on certification and installation proof.'
