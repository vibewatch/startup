- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Skyryse adoption runs through a value chain in which certification and installation partners sit between product enthusiasm and repeatable fleet deployment.
  data:
    nodes:
    - id: need
      label: Mission need
      detail: Safer, simpler rotorcraft operations in private, public-safety, and military missions.
    - id: airframe
      label: Existing aircraft base
      detail: R66 first, then H125/H130, Black Hawk, and adjacent aircraft classes.
    - id: partner
      label: Install / channel partner
      detail: Ace, United Rotorcraft, and Mitsubishi-like partners localize and scale deployment.
    - id: cert
      label: Certification gate
      detail: R66 approval path and airframe-specific integration proof remain the key bottlenecks.
    - id: training
      label: Training + change management
      detail: Pilots, maintainers, and agencies must trust simplified controls and new workflows.
    - id: ops
      label: Scaled mission operations
      detail: Only after certification and install proof can SkyOS become a repeatable fleet standard.
    edges:
    - from: need
      to: airframe
      label: mission demand selects candidate platform
    - from: airframe
      to: partner
      label: retrofit path requires local install capacity
    - from: partner
      to: cert
      label: integration work feeds approval evidence
    - from: cert
      to: training
      label: approved system enters operator rollout
    - from: training
      to: ops
      label: trusted crews enable recurring deployment
    - from: cert
      to: ops
      label: without approval the funnel stalls before scale
  approximationNotes: null
