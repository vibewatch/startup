  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-roi
    missingEvidence: Per-airframe retrofit pricing, recurring software/support pricing, insurer treatment, and customer payback period by mission profile.
    whyItMatters: Public signals show aircraft reservation pricing but not the economics that determine whether operators will fund broad fleet rollouts.
    diligencePath: Request signed price sheets, support contracts, and at least three customer ROI case studies by aircraft type and mission.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM004
  - type: missing-source
    severity: material
    topic: install-base-economics
    missingEvidence: Installed-base counts and retrofit-ready economics for each specific aircraft family Skyryse names beyond the R66.
    whyItMatters: The core market thesis depends on legacy-fleet retrofitability, but public sources do not bridge named aircraft classes into a verified SAM or install schedule.
    diligencePath: Build a per-platform fleet map with FAA registry, operator concentration, downtime assumptions, and install labor requirements.
    relatedQuestionRefs:
    - QM017
    - QM023
    relatedTableRefs:
    - TM001
    - TM002
  - type: private-evidence-only
    severity: material
    topic: pipeline-conversion
    missingEvidence: Booked aircraft counts, signed retrofit scope, backlog conversion timing, and revenue recognition path for Army, CAL FIRE, Ace, Mitsubishi, and United Rotorcraft-linked programs.
    whyItMatters: Partnership announcements validate buyer interest, but they do not prove how quickly interest turns into delivered systems or recurring revenue.
    diligencePath: Request each partner agreement summary with aircraft counts, milestones, certification dependencies, pricing structure, and cancellation terms.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
