  name: Skyryse
chapter:
  number: 2
  title: Market Analysis
  summary: Skyryse's real market at run date is not the entire advanced-air-mobility stack but the narrower wedge of retrofit-capable flight controls, safety automation, and related installation services for existing rotorcraft and adjacent aircraft. Public evidence supports a meaningful buyer set across private/general aviation, public safety, military, MRO/install partners, and overseas channels, while also showing that certification, integration complexity, and missing ROI data still cap how much of the broader AAM or eVTOL narrative can be claimed today.
sections:
- id: market-boundary-and-owned-wedge
  title: 'Market boundary: Skyryse owns a retrofit-automation wedge, not the whole AAM stack'
  body: 'The right market boundary for Skyryse is much narrower than the usual air-taxi or AAM headline. The company is not currently selling a city-air-taxi network, vertiport infrastructure, or a clean-sheet eVTOL aircraft. The public record instead shows a software-defined flight-control and automation platform that starts with the Robinson R66-based Skyryse One and is meant to spread across existing helicopters and adjacent airplanes. That is why the most relevant spend buckets are retrofit-capable flight controls, simplified cockpit hardware and software, safety automation, certification engineering, and installation/MRO work on legacy airframes. The published extension points all reinforce that reading: SkyOS is marketed as aircraft-agnostic, the FAA special conditions are tied to a modified R66 supplemental path, United Rotorcraft is named for Airbus and Black Hawk integration work, Ace is positioned as a Black Hawk retrofit hub, and Mitsubishi is framed as a channel to modernize
    existing aircraft in Japan. The broader AAM ecosystem still matters because policy and capital are moving toward more automated flight, but Skyryse should only capture that adjacency after its retrofit wedge is certified and repeatable.'
  claimRefs:
  - CM001
  - CM002
  - CM003
