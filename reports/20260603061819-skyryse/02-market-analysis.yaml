figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Three layers show why Skyryse should be valued first against rotorcraft retrofit automation, then against broader avionics modernization, with AAM/eVTOL treated as adjacency rather than owned TAM.
  data:
    items:
    - label: Core near-term wedge — retrofit-capable flight-control automation
      value: $0.42B–$0.70B
      detail: Closest public spend proxy from the 2024 flight-control systems slice inside the U.S. helicopter avionics market.
    - label: Broader rotorcraft avionics modernization market
      value: $2.1B in 2024; $3.5B by 2035
      detail: Full U.S. helicopter avionics market includes communications, navigation, surveillance, and monitoring in addition to flight controls.
    - label: Strategic adjacency — AAM / eVTOL / autonomy ecosystem
      value: Material but not owned TAM
      detail: Policy support and public-market capital show a larger automated-aviation future, but Skyryse reaches it only after proving retrofit deployment at scale.
  approximationNotes: Only the inner and middle layers are tied to direct public spend estimates. The outer layer is intentionally qualitative to avoid claiming that all AAM or eVTOL value belongs to Skyryse.
  claimRefs:
  - CM001
