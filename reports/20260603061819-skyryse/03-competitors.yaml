  rows:
  - - Skyryse
    - Focal company / rotorcraft retrofit
    - $1.8M First Edition price; $2.5k reservation deposit; reservations sold out in six months
    - Existing rotorcraft operators and new helicopter buyers seeking simpler piloted operations
    - Pilot-assisted fly-by-wire retrofit wedge and simplified HMI on existing aircraft
    - Final delivered pricing, realized installs, and broad field economics remain undisclosed
  - - Reliable Robotics
    - Direct fixed-wing retrofit autonomy peer
    - $160M new funding in 2026; 200+ system commitments claimed
    - Cargo, regional, and military operators using existing aircraft
    - FAA-certifiable fully automated operation narrative on existing aircraft
    - Public proof set is cargo/fixed-wing oriented rather than civil rotorcraft
  - - Merlin
    - Direct adjacent retrofit autonomy peer
    - $105M USSCOM contract ceiling; 100s of autonomous hours claimed
    - Defense tactical transport and autonomy-enabled fixed-wing fleets
    - Aircraft-agnostic autonomy platform messaging
    - Public validation is concentrated in defense and fixed-wing missions
  - - Near Earth Autonomy
    - Autonomy stack / integration supplier
    - 140+ airframes; 10k+ flights; 4k+ hours claimed
    - Commercial and defense uncrewed programs
    - Integration, testing, certification, and deployment support wrapped around autonomy software
    - Public focus is uncrewed assurance rather than branded piloted aircraft
  - - Embention
    - Avionics and fly-by-wire supplier
    - Euronext-listed supplier; ETSO basis and aerospace software standards highlighted
    - Drone and eVTOL OEMs needing control-stack hardware and software
    - Redundant autopilots plus distributed fly-by-wire modules
    - Supplier role is one layer below Skyryse's full product story
  - - Shield AI
    - Adjacent defense autonomy platform
    - Broad multi-platform autonomy proof but no civil pricing disclosed
    - Defense and mission autonomy programs
    - Hivemind spans multiple military autonomy platforms
    - Civil rotorcraft retrofit certification is not the public focus
  - - Airbus / Robinson / incumbent OEMs
    - Status quo substitute
    - Installed fleets, sales channels, training, and service networks
    - Operators preferring proven airframes and conventional cockpit workflows
    - Airframe trust, installed base, and service reach
    - Legacy control systems and slower cockpit simplification narrative
  - - Joby / Archer / Eve / Vertical / EHang
    - Adjacent public AAM comparables
    - $338.69M to $11.68B market caps and 198 to 2,559 employees disclosed
    - Passenger AAM, pilotless UAM, and capital-market narrative
    - Public-market scale, capital access, and autonomy mindshare
    - Mostly clean-sheet eVTOL or pilotless programs rather than retrofit helicopter purchases
  notes: Scale and pricing fields mix directly disclosed values with explicit unknowns because most reviewed competitors do not publish delivered-system prices or realized deployment counts.
