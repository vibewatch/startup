- id: TP004
  title: Switching cost, lock-in, and channel-power table
  columns:
  - Competitive lever
  - Skyryse position
  - Incumbent / rival advantage
  - Why switching is hard
  - Diligence ask
  rows:
  - - Airframe-specific certification
    - SkyOS must be integrated by aircraft type
    - OEMs and established partners already control airframe pathways
    - A new stack requires repeat engineering, testing, and approval work
    - Request airframe-by-airframe certification roadmap and partner responsibilities
  - - MRO and installation capacity
    - Skyryse uses United Rotorcraft to extend reach
    - Large MRO and OEM networks have deeper field presence
    - Operators prefer maintainers already approved on their fleet
    - Ask who installs, maintains, and warranties each retrofit variant
  - - Pilot training and interface migration
    - Skyryse rewrites the cockpit interaction model
    - Incumbents benefit from familiar pilot workflows
    - Retraining and SOP rewrites increase adoption friction
    - Request training hours, simulator needs, and insurance impacts
  - - Supplier and actuation stack control
    - Skyryse owns the software story but not every upstream component
    - Moog-like suppliers have long aerospace histories and IP depth
    - Program risk rises if critical suppliers or IP relationships deteriorate
    - Ask for sole-source dependencies and litigation status
  - - Public-market signaling
    - Skyryse is private and narrative-led
    - Joby, Archer, Eve, and Vertical publish market-cap and headcount markers
    - Buyers and investors may equate public size with staying power
    - Map procurement decisions that require public-company comfort or balance-sheet proof
  - - Installed-base trust
    - Skyryse must win trust on top of existing aircraft
    - Airbus and Robinson already own airframe relationships
    - Operators often prefer known aircraft and support channels over new software layers
    - Ask which operators can adopt without OEM endorsement
  notes: Switching cost is inferred from the integration, certification, service, and training burdens implied across the reviewed sources; exact customer contract terms remain private.
