chapter:
  number: 3
  title: Competitors
  summary: Skyryse competes most directly with existing-aircraft autonomy and avionics providers such as Reliable Robotics, Merlin, Near Earth, and Embention, while incumbent OEM and MRO channels still control much of the field path. Public eVTOL names like Joby, Archer, Eve, Vertical, and EHang matter mainly as adjacent capital-market and narrative comparables rather than one-for-one rotorcraft retrofit substitutes. The reviewed evidence supports a differentiated Skyryse wedge around pilot-assisted rotorcraft fly-by-wire simplification, but also shows real risks from channel dependence, pricing opacity, broader-autonomy rivals, and adverse external scrutiny.
sections:
- id: direct-retrofit-rivals
  title: Direct retrofit and autonomy rivals
  body: 'Skyryse is not competing against a single monolithic rival set. Its closest direct peers are companies trying to bring more autonomy to aircraft that already exist, not the clean-sheet eVTOL developers that dominate public-market headlines. Reliable Robotics and Merlin are the clearest analogues because both market aircraft-agnostic autonomy for existing fleets and emphasize certifiable automation rather than a new airframe. Near Earth and Embention sit one layer lower in the stack: they sell autonomy, integration, certification support, or fly-by-wire avionics that could become substitutes inside an operator or OEM program even when they do not package a branded aircraft product. Shield AI belongs in the frame because it demonstrates autonomy breadth and defense credibility, but its public evidence is centered on mission autonomy for military platforms rather than civil rotorcraft simplification. Relative to that group, Skyryse is differentiated by a narrower wedge: pilot-assisted fly-by-wire retrofit on existing rotorcraft with a simplified human-machine interface rather than fully uncrewed operations.'
