- id: incumbents-and-channel-power
  title: Incumbents, suppliers, and distribution power
  body: 'The status quo alternative to Skyryse is often not another startup at all. It is a conventional cockpit on a familiar airframe sold, maintained, and supported through incumbent OEM and MRO channels. Airbus and Robinson embody that installed-base reality: they sell helicopters, training, service access, and mission credibility to operators who already trust established aircraft. United Rotorcraft matters because Skyryse itself chose an incumbent-style integration and maintenance partner to reach Airbus and Black Hawk fleets, which validates Skyryse''s deployment strategy but also shows how much channel power still sits outside the software layer. Moog adds a different incumbent force: flight-control and actuation suppliers with deep aerospace histories can influence program risk even without owning the customer relationship. The 2022 Moog complaint against Skyryse is therefore competitively relevant because it demonstrates that supplier and IP friction can surface long before a buyer sees a finished retrofit product. In practice, Skyryse needs incumbent channels more than incumbents need Skyryse.'
