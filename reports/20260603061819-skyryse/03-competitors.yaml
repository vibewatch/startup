  - CP002
  - CP040
  - CP038
- calloutType: risk
  title: Incumbents still control much of the deployment path
  body: Airbus, Robinson, and United Rotorcraft demonstrate that OEM and MRO channels remain the gating infrastructure for fleet rollout, which limits how much of the go-to-market Skyryse can own directly.
  claimRefs:
