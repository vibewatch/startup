- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat or threat
  - Threat vector
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Rotorcraft retrofit wedge
    - Generic autonomy stacks or OEM digital cockpits narrow differentiation
    - medium
    - Skyryse remains the clearest pilot-assisted rotorcraft simplification story in the reviewed set
    - Verify how much IP and certification work is reusable across additional rotorcraft types
  - - Incumbent channel capture
    - OEMs and MROs can favor rival solutions or preserve status quo cockpits
    - high
    - Airbus, Robinson, and United Rotorcraft all show how much deployment power sits in legacy channels
    - Review exclusivity, revenue share, and termination rights in partner agreements
  - - Pricing opacity
    - Competitors can compete in custom bids without public list-price comparison
    - medium
    - Most peer surfaces omit delivered-system pricing or contract economics
    - Request actual quoted pricing, maintenance burden, and certification costs by airframe
  - - Autonomy breadth gap
    - Defense autonomy platforms may outpace Skyryse on software breadth
    - high
    - Shield AI, Reliable, and Merlin all market broader autonomy missions than Skyryse
    - Assess whether Skyryse needs adjacent autonomy modules or acquisitions
  - - Public comp narrative pressure
    - Joby, Archer, Eve, Vertical, and EHang can reshape investor expectations and valuation framing
    - medium
    - Public market caps and headcounts are much more visible than Skyryse's private metrics
    - Force the thesis to benchmark against retrofit economics, not just AAM narrative comps
  - - Supplier / IP friction
    - Control-system disputes can slow programs or raise cost
    - medium
    - Moog litigation proves supplier and information-control conflict has already occurred
    - Ask for current dispute status, supplier concentration, and indemnity structure
  notes: Severity is a judgment call derived from the source set rather than a disclosed company metric, so each row should be read as a diligence priority rather than a quantified probability.
