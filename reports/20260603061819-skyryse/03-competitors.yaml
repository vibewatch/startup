callouts:
- calloutType: strength
  title: Skyryse owns a narrower wedge than the public eVTOL names
  body: The strongest competitive framing is not that Skyryse beats every autonomy company on breadth, but that it is one of the few vendors visibly focused on simplifying existing rotorcraft with pilot-in-the-loop fly-by-wire instead of waiting for clean-sheet AAM adoption.
  claimRefs:
