company:
  name: XAG Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    XAG is a Guangzhou-based agricultural robotics company founded in 2007 that has expanded from drones into an
    air-to-ground and smart-farm ecosystem. Public evidence supports meaningful international reach, reported funding,
    and a 2026 Hong Kong listing filing, but valuation, governance depth, and some financial metrics remain incompletely
    disclosed.
sections:
  - id: identity-and-platform
    title: Identity and operating model
    body: >-
      XAG was founded in 2007 and describes itself as an agricultural robotics company focused on making farming more
      efficient, sustainable, and rewarding. Its product scope extends beyond crop-spraying drones to agricultural
      rovers, autopilot consoles, smart-farm IoT, and farm-management systems. Tracxn places the headquarters in Tianhe,
      China, while the company describes its roots and manufacturing ecosystem in the Guangzhou region. The breadth of
      the portfolio supports an ecosystem thesis, but most product and mission descriptions remain company-originated
      rather than independently audited measures of customer outcomes. That distinction matters because a broad catalog
      can demonstrate engineering ambition without proving recurring demand, utilization, or durable pricing power.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
    tableRefs:
      - TO001
  - id: leadership-capital
    title: Leadership, ownership, and capital
    body: >-
      Public leadership evidence identifies Bin Peng and Justin Gong as co-founders, while a March 2026 IPO-oriented
      report identifies Peng Bin as founder, chair, and president and describes concentrated pre-listing control. Tracxn
      reports $248 million of funding across four rounds, including a latest listed round in September 2023. The
      evidence is useful for mapping control and financing history, but it does not establish a current board committee
      structure, normalized valuation, or a complete investor-by-investor capitalization table. Concentrated founder
      ownership may align strategic incentives, yet it also makes succession planning, related-party controls, and the
      treatment of minority investors important underwriting questions for investors.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO010
    tableRefs:
      - TO002
      - TO003
  - id: scale-milestones-and-gaps
    title: Scale, milestones, and diligence gaps
    body: >-
      XAG’s official timeline records a progression from early civilian drone platforms to plant-protection drones,
      air-to-ground robotics, and integrated water, fertilizer, and pesticide management. Independent Yicai reporting
      adds overseas expansion and more than 100,000 unmanned aerial vehicles sold abroad by October 2024, while a March
      2026 report gives a three-year revenue and profit sequence and describes a Hong Kong prospectus submission. These
      signals indicate material scale, but the record leaves important gaps: the IPO-related revenue figure from another
      article lacks currency and filing support, customer retention is not disclosed, and governance and valuation
      require primary-document confirmation.
    claimRefs:
      - CO004
      - CO009
      - CO010
      - CO011
      - CO012
      - CO014
      - CO015
      - CO016
    figureRefs:
      - FO001
