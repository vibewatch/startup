figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Selected dated milestones show XAG’s progression from civilian drones to integrated agricultural robotics and
      international scale.
    data:
      items:
        - date: '2007'
          label: XAircraft team formed
          detail: >-
            Peng Bin brought together a team of technology enthusiasts, laying the foundation for civilian drone and
            robotics work.
          tone: neutral
          claimRefs:
            - CO001
            - CO005
        - date: '2013'
          label: Agricultural focus identified
          detail: >-
            The team discovered flight-control use in agricultural plant protection and moved toward agricultural
            applications.
          tone: opportunity
          claimRefs:
            - CO005
        - date: '2014'
          label: Plant-protection drone commitment
          detail: >-
            The official timeline records a strategic shift toward agricultural drone technology after a prototype test
            flight.
          tone: opportunity
          claimRefs:
            - CO005
        - date: '2015'
          label: P20 launched
          detail: >-
            XAG launched its first-generation plant-protection drone with RTK navigation, centrifugal atomization, and
            smart-battery technology.
          tone: positive
          claimRefs:
            - CO005
        - date: '2017'
          label: Overseas expansion began
          detail: Yicai reported that overseas expansion began in Japan in 2017.
          tone: positive
          claimRefs:
            - CO011
        - date: 2019-2020
          label: Portfolio broadened
          detail: >-
            The company says it introduced rovers, autopilot consoles, smart-farm IoT, and farm-management systems while
            adopting the XAG brand.
          tone: positive
          claimRefs:
            - CO005
        - date: 2021-2022
          label: Air-to-ground matrix
          detail: >-
            The official timeline describes development of an air-to-ground robotics matrix and expanded global sales
            and service channels.
          tone: positive
          claimRefs:
            - CO005
        - date: 2023-2024
          label: Integrated ecosystem
          detail: >-
            XAG says it continued introducing drones, autopilot consoles, and smart fertigation systems and received
            national manufacturing recognition.
          tone: positive
          claimRefs:
            - CO005
        - date: '2025'
          label: R-Series and 60+ markets
          detail: >-
            XAG says it launched new R-Series agricultural rovers and sold products in more than 60 countries and
            regions.
          tone: positive
          claimRefs:
            - CO004
        - date: '2026-03-26'
          label: Hong Kong prospectus reported
          detail: Sohu reported a new Hong Kong Main Board prospectus submission after a prior filing lapsed.
          tone: opportunity
          claimRefs:
            - CO010
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO010
      - CO011
callouts:
  - calloutType: strength
    title: Evidence-backed scale signal
    body: >-
      The combination of official 60-plus-country coverage and Yicai’s report of more than 100,000 overseas UAV sales
      supports material international reach, although the measures are not the same as active customer count.
    claimRefs:
      - CO004
      - CO011
  - calloutType: risk
    title: Primary-document dependency
    body: >-
      The assigned evidence does not establish a current valuation, complete governance structure, or normalized
      customer economics; the IPO prospectus and cap table are the highest-priority diligence documents.
    claimRefs:
      - CO007
      - CO009
      - CO015
      - CO016
