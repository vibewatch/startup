    notes: "Likelihood and residual ratings are analyst judgments anchored to cited disclosures; 'unknown' means the assigned public pool did not establish a rate."
    claimRefs: [CR004, CR006, CR011, CR012, CR015]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns: ["Dependency", "Counterparty or system", "Role", "Concentration evidence", "Failure scenario", "Severity", "Mitigation", "Residual exposure"]
    rows:
      - ["Competitive benchmark", "DJI", "Price, brand, distribution, and product cadence", "DJI above 50% global share versus XAG at 17.1% in 2024 prospectus-based reporting", "Price or channel pressure slows XAG growth", "High", "Portfolio differentiation; effectiveness not quantified", "High"]
      - ["International distribution and service", "Local dealers and service partners", "Sales, certification support, parts, and field service across 64 countries and regions", "Dealer-level shares are not public", "Key-market partner loss or weak service coverage disrupts sales and uptime", "High", "Broad footprint, but redundancy is not quantified", "High"]
      - ["Trade access", "Customs and national import regimes", "Market access and landed cost", "34.8% of 2024 revenue reported overseas", "Tariff or import-policy tightening compresses margin or orders", "High", "No quantified pass-through evidence in the pool", "High"]
      - ["Navigation and control", "RTK, connectivity, local control, and trained operators", "Positioning and safe intervention", "Official page warns accuracy may be affected offline", "Deviation or unavailable positioning interrupts safe operation", "High", "Portable RTK and manual intervention instructions", "Medium-high"]
    notes: "Concentration is quantified only where prospectus-based reporting provides a denominator; supplier, distributor, and service-partner shares remain private."
    claimRefs: [CR007, CR008, CR009, CR010, CR012]
