    columns: [Customer, Segment, Deployment or use case, Production versus pilot, Reported outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible named customer examples and customer-quoted coverage retrieved for the 2026-10-22 refresh; not a full customer list."
    rows:
      - ["Nguyen Van Huong", "Vietnamese durian and mixed-fruit farmer", "XAG P150 orchard crop protection", "Production", "Three-hour spraying versus two tiring days; reported lower water use and reduced exposure.", "Self-reported case story; no independent audit."]
      - ["Bruno Oliveira", "Brazilian coffee, grape, soybean, and corn farmer", "XAG P100 Pro spraying, fertilizer, and cover-crop seeding", "Production", "Reported faster field access after rain, lower water use per hectare, and less crop damage than tractors.", "Self-reported case story; no retention or financial statement."]
      - ["Australian growers and contractors", "Regional grower and contractor segment", "XAG spray, spread, mapping, automation, and support services", "Production or service use", "Regional site says users improve efficiency, coverage, and reliability.", "Aggregate testimonial language; named customer identities and outcomes are not provided."]
    notes: "Enumeration is intentionally partial because public materials expose selected named users and aggregate testimonials rather than a complete customer register; production status is based on the stories' descriptions."
    claimRefs: [CU005, CU007, CU009]
