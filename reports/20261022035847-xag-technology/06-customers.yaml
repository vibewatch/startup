          touchpoints: [Authorized dealers, overseas markets, regional adaptation]
    claimRefs: [CU003, CU013, CU014]
callouts:
  - calloutType: strength
    title: Evidence of real operational use
    body: Named farmers describe using XAG drones in production crop-protection workflows, including specific crops, equipment, and replaced manual or tractor processes.
    claimRefs: [CU005, CU007]
  - calloutType: risk
    title: Retention and concentration remain opaque
    body: Public materials do not disclose customer cohorts, churn, renewal, net retention, contract duration, or customer-level revenue concentration.
    claimRefs: [CU011, CU012, CU013]
