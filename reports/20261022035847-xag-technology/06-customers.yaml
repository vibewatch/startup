company:
  name: XAG Technology
chapter:
  number: 6
  title: Customers
  summary: XAG's public customer evidence is strongest for agricultural operators using drones in time-sensitive crop-protection and input-application workflows. The evidence shows named deployments and operational benefits, but public disclosure remains insufficient to establish retention, cohort durability, or customer concentration.
sections:
  - id: buyer-and-user-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      XAG serves several overlapping customer roles rather than a single buyer type. Farmers and farm
      managers use the equipment directly, while contractors, authorized dealers, and field-service
      operators can act as the operating or distribution layer. XAG Australia's local surface explicitly
      names growers, contractors, and land managers, and lists broadacre cropping, cotton, sugarcane,
      vineyards, orchards, vegetables, and livestock and pasture as application contexts. The customer
      value proposition is therefore tied to field timing, labor availability, terrain, and application
      precision rather than to a generic robotics purchase. The Vietnam and Brazil examples add named
      owner-operators and mixed-crop farms, but they are individual case studies, not evidence of the
      full customer population or a representative revenue mix.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption proof and operating outcomes
    body: >-
      The clearest adoption proof is operational: named growers describe using XAG drones in production
      crop-protection work, and the country stories specify the prior manual or tractor workflow being
      replaced. In Vietnam, Nguyen Van Huong reports moving from boat-based manual spraying to a P150
      after late-2024 purchase; in Brazil, Bruno Oliveira describes using a P100 Pro for coffee, grapes,
      soybeans, and corn, including spraying, fertilizer, and cover-crop seed. These accounts support
      workflow adoption and reported productivity or input changes, but the quantitative outcomes are
      customer estimates in company-distributed stories and are not audited cohort measures. XAG
      Australia's training, parts, service, and demonstration offer indicates that adoption includes
      enablement and after-sales support, not only hardware delivery.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration visibility
    body: >-
      Public evidence does not disclose net revenue retention, gross retention, churn, renewal rates,
      contract lengths, cohort curves, or customer-level revenue concentration. The available proof is
      instead point-in-time or case-based: a Vietnamese orchard owner and a Brazilian mixed-crop farmer
      describe current use, while XAG Australia advertises training, parts, servicing, and field
      demonstrations that could support repeat use. Baidu Baike reports a large authorized-partner and
      service-station footprint as of May 2026, while Yicai gives broader reach indicators, including
      overseas entry into 63 additional countries and regions after Japan and more than 100,000 unmanned
      aerial vehicles sold abroad. Neither source provides an active-customer denominator, channel
      revenue mix, or retention data. The underwriting implication is that customer need appears real in
      several workflows, while durability, expansion economics, channel dependence, and concentration
      remain diligence gaps.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
