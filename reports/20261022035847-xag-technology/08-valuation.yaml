callouts:
  - calloutType: recommendation
    title: Track, do not buy on public evidence alone
    body: The assigned sources show a credible operating platform and demand signals, but no verified current price, capitalization terms, or normalized margin base. A disciplined entry decision requires primary financing and financial evidence.
    claimRefs: [CV001, CV004, CV011, CV014, CV016]
  - calloutType: risk
    title: Down-round and margin risk remain live
    body: A successful listing or financing is not established by the available secondary accounts, which disagree on venue; Reboot Hub also warns that hardware margins and business-model sustainability need testing.
    claimRefs: [CV008, CV009, CV012, CV016]
