    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, "Track", "Do not underwrite a purchase without verified current price and capitalization terms"]
      - [Confidence, "Low", "Operating evidence is directional; financing and normalized profitability inputs are missing"]
      - [Risk rating, "High", "Hardware margin, competition, regulatory execution, and liquidity information remain unresolved"]
      - [Valuation stance, "Price-indeterminate", "Do not label the opportunity cheap, fair, or expensive without primary transaction evidence"]
      - [Return / hold / exit, "Not supportable from public evidence", "Model only after audited forecasts, entry terms, dilution, and exit assumptions are verified"]
    notes: "Assessment is an analyst synthesis of the assigned public sources; no current XAG equity price, share count, preference stack, or verified listing terms were found in the pool."
    claimRefs: [CV001, CV004, CV008, CV011, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - ["Integrated robotics platform", "Public product materials list drones, rovers, autopilot consoles, and connected farm infrastructure", "Audited segment revenue, attach rates, and gross margin by product and service"]
      - ["International demand", "Yicai reported entry into 63 additional countries or regions and more than 100,000 overseas UAV sales", "Country-level sell-through, repeat purchase, channel inventory, and service economics"]
      - ["Commercial visibility", "XAG equipment was featured with a dealer at Queensland's $30 million innovation-fund launch", "Binding customer contracts, utilization, and independently measured farm ROI"]
      - ["Margin and liquidity risk", "Reboot Hub warns that hardware margins and agricultural-drone model sustainability must be tested", "Audited contribution margin, cash runway, debt, financing terms, and a verified listing or round document"]
      - ["Listing-path conflict", "Secondary sources identify different intended listing venues", "Primary exchange or issuer filing that establishes venue, timing, securities, and proceeds"]
    notes: "Signals combine company-authored materials, a regional channel page, independent reporting, and secondary analysis; they are not directly comparable financial metrics."
    claimRefs: [CV002, CV003, CV005, CV006, CV007, CV008, CV009, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Overseas distribution converts into repeat purchases; integrated hardware and software improve monetization and service economics", "Higher-quality recurring or repeat revenue could justify a premium to hardware peers, but no numeric range is supportable from the pool", "Low-to-medium until audited unit economics are supplied", "International growth without repeat utilization or margin expansion"]
      - [Base, "Hardware-led growth continues with regional channel execution and competitive pricing", "Value near disciplined hardware/industrial-technology peer references; exact multiple and return cannot be calculated", "Base case for tracking", "Margin compression, channel inventory, or slower adoption"]
      - [Bear, "IPO or financing is delayed, repriced, or fails to resolve liquidity and preference overhang", "Down-round or illiquidity discount; protect against permanent loss rather than target a modeled return", "Material enough to block a buy call", "Financing below prior mark, weak cash coverage, or regulatory commercialization barrier"]
      - [Diligence gate, "Verified audited statements, cap table, financing instrument, customer cohorts, and service/warranty costs become available", "Re-rate only after reconciling enterprise value, dilution, preferences, and cash/debt", "Required before investment", "Any material inconsistency between management claims and independent evidence"]
    notes: "Scenarios are qualitative because the assigned evidence contains no verified XAG valuation, audited financial statements, share count, cash, debt, or transaction terms."
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
