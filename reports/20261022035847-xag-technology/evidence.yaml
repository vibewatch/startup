evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A current primary valuation, IPO pricing range, or transaction-based valuation benchmark.
    whyItMatters: Valuation is central to underwriting but is not supported by the assigned public source set.
    diligencePath: Review the latest Hong Kong prospectus, pricing disclosures, and verified secondary transactions.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A complete current board, committee, executive, and succession disclosure.
    whyItMatters: Founder concentration and a limited public roster leave key-person and control risks unresolved.
    diligencePath: Obtain the latest prospectus governance section, articles, and board committee terms.
    relatedQuestionRefs:
      - QO002
      - QO008
  - type: conflicting-data
    severity: material
    topic: financials
    missingEvidence: Primary reconciliation of the RMB revenue sequence with the separate 1.1 billion IPO article claim.
    whyItMatters: >-
      The separate article omits currency and period detail, so it should not be merged into the reported financial
      series.
    diligencePath: Reconcile both claims against audited financial statements or the filed prospectus.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: A complete current leadership and board roster with committee assignments.
    whyItMatters: The partial public roster cannot fully assess governance coverage or key-person dependence.
    diligencePath: Review the latest prospectus directors and senior management sections.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 stakeholder map
    missingEvidence: A complete shareholder and stakeholder register including all funds, employee vehicles, and sponsor relationships.
    whyItMatters: >-
      The partial stakeholder sample cannot establish economic ownership, control rights, or listing-related
      obligations.
    diligencePath: Review the latest prospectus shareholding, cornerstone, and sponsor disclosure sections.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Country-by-crop eligible acreage, product approval, channel reach, average selling price, and replacement-cycle
      data needed for a serviceable market and obtainable share model.
    whyItMatters: >-
      Broad robotics and drone forecasts cannot be translated into XAG revenue potential or a valuation multiple without
      a consistent denominator.
    diligencePath: >-
      Obtain the prospectus market-study appendix and management's country, crop, unit, price, and channel model;
      reconcile it to audited shipment and revenue data.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-roi
    missingEvidence: >-
      Representative customer payback, utilization, repeat-purchase, retention, service attachment, and downtime data by
      farm size, crop, geography, and ownership model.
    whyItMatters: >-
      A single farmer case cannot establish scalable ROI, replacement demand, or the durability of service-provider
      economics.
    diligencePath: >-
      Request anonymized cohorts and interview farms, contractors, and dealers in at least three material regions using
      a consistent total-cost-of-ownership template.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A reconciled definition connecting agricultural robotics, precision-agriculture drones, installed units, and
      company revenue without mixing categories or currencies.
    whyItMatters: >-
      Unreconciled forecasts can create false precision and overstate the growth exposure that belongs in XAG's
      valuation.
    diligencePath: >-
      Acquire underlying analyst reports, normalize definitions and currencies, and rebuild the model from country-level
      units, prices, and eligible use cases.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current DJI and XAG model-level quotes, contract terms, discounts, service fees, and total cost of
      ownership.
    whyItMatters: >-
      The available price points mix hardware and software and cannot support a customer-payback or price-leadership
      conclusion.
    diligencePath: Collect regional distributor quotes and matched mission-cost scenarios for XAG, DJI, and contractor workflows.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: >-
      Cohort retention, repeat purchase, service uptime, channel margin, and multi-year customer economics by product
      family.
    whyItMatters: Product breadth and overseas shipments show reach but not durable customer lock-in or profitable distribution.
    diligencePath: Request audited cohort, warranty, service, reseller, and repeat-order data during diligence.
    relatedQuestionRefs:
      - QP005
      - QP008
      - QP009
  - type: missing-source
    severity: material
    topic: competitor-response
    missingEvidence: >-
      Comparable DJI product roadmap, service footprint, regulatory posture, and response to XAG's air-to-ground
      portfolio.
    whyItMatters: DJI is the scale incumbent and could compress differentiation through pricing, launches, or channel investment.
    diligencePath: Obtain current DJI agricultural product, channel, and regulatory evidence in each target market.
    relatedQuestionRefs:
      - QP002
      - QP010
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited segment revenue, realized ASP and discounting, gross-margin bridge, warranty costs, CAC, payback,
      utilization, and customer concentration.
    whyItMatters: >-
      Headline revenue and profit do not establish the durability or cash quality of earnings in a hardware-and-services
      model.
    diligencePath: >-
      Request audited financial statements, segment notes, customer cohorts, channel contracts, and a unit-economics
      bridge from management.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, operating burn, debt and lease obligations, working-capital schedule, capex, runway, and IPO
      use-of-proceeds.
    whyItMatters: >-
      A reported profit and a proposed listing do not show whether the company can fund inventory, service expansion,
      and product development without additional financing.
    diligencePath: Obtain the latest audited balance sheet, cash-flow statement, debt schedule, budget, and final IPO prospectus.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: profitability
    missingEvidence: Reconciled audited figures for 2024-2025 across the Caixin and Futu News summaries.
    whyItMatters: >-
      Small differences in reported revenue and profit can reflect rounding, scope, or source limitations and affect
      margin calculations.
    diligencePath: >-
      Reconcile each period to the underlying prospectus and audited financial statements before computing growth or
      margins.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: product reliability
    missingEvidence: Fleet-level uptime, failure rates, obstacle-avoidance performance, and incident history by model and region.
    whyItMatters: >-
      Reliability determines whether autonomous equipment can operate during narrow agricultural windows and whether
      service obligations consume margin.
    diligencePath: >-
      Request model-level reliability reports, warranty and repair data, incident logs, and service-level performance by
      geography.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: compliance and security
    missingEvidence: >-
      Product approvals, insurance requirements, cybersecurity testing, data governance, and privacy controls by
      operating jurisdiction.
    whyItMatters: >-
      Regional rules and data handling can delay deployment or limit the usable market even when the hardware works
      technically.
    diligencePath: >-
      Obtain a jurisdiction-by-jurisdiction compliance matrix, security assessment, data-retention policy, and insurance
      documentation.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: performance economics
    missingEvidence: >-
      Independent, controlled evidence of application accuracy, yield impact, chemical or fertilizer savings, and total
      cost of ownership.
    whyItMatters: Product differentiation and customer payback depend on realized field outcomes rather than feature breadth alone.
    diligencePath: >-
      Request anonymized field trials with control groups, crop and terrain splits, operator hours, input use, downtime,
      and payback.
    relatedQuestionRefs:
      - QE004
      - QE005
  - type: missing-source
    severity: minor
    topic: developer signal
    missingEvidence: >-
      A public code, package, API, engineering-community, or quantified practitioner-activity surface tied directly to
      XAG products.
    whyItMatters: >-
      A transparent technical or practitioner surface would provide a repeatable signal of integration activity,
      maintenance cadence, and ecosystem depth.
    diligencePath: >-
      Request public API and integration documentation, release history, developer metrics, and practitioner-community
      participation data.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort-level gross retention, net retention, churn, renewal, contract duration, and repeat-purchase data by
      customer segment.
    whyItMatters: >-
      Named deployments and usage stories establish adoption but do not show whether customers remain active or expand
      over time.
    diligencePath: >-
      Request customer cohort tables, renewal schedules, repeat-purchase records, and segment-level retention metrics
      under NDA.
    relatedQuestionRefs:
      - QU006
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      A complete or sampled customer register distinguishing production deployments, pilots, distributors, and service
      operators.
    whyItMatters: >-
      Three public examples cannot establish customer mix, reference quality, or the representativeness of reported
      outcomes.
    diligencePath: >-
      Request a permissioned customer reference list with deployment dates, use cases, contract status, and outcome
      measurement.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer, geography, dealer, and channel revenue concentration, including dependency on major partners.
    whyItMatters: >-
      Agricultural equipment adoption may be mediated by regional dealers or service operators, making concentration
      relevant to durability and procurement risk.
    diligencePath: Request revenue-share schedules by customer, country, dealer, and channel for the latest three fiscal years.
    relatedQuestionRefs:
      - QU007
      - QU008
  - type: missing-source
    severity: material
    topic: legal-regulatory-incidents
    missingEvidence: >-
      Current primary regulator, court, recall, breach, and safety-incident records, plus a product-by-jurisdiction
      licence and certification matrix.
    whyItMatters: >-
      Public silence cannot establish absence, and an enforcement, recall, or approval failure could interrupt sales or
