  - id: TP003
    title: Pricing and packaging comparison
    columns: [Vendor or alternative, Price or contract model, Included capability, Discount or realization, Competitive implication]
    rows:
      - [XAG agricultural drone, "CNY40,000 starting price quoted by a co-founder", "Agricultural drone; quoted payload and comparison are source-specific", "Starting price only; model, configuration, geography, and realized price unknown", "Indicates an entry-price signal but cannot establish lower total cost"]
      - [Sentera FieldAgent Collaborator, "$99 annual license shown", "Core platform access; analytics scope shown as NA in the price grid", "Public list price; realized discount unknown", "Low-cost collaboration tier may support multi-homing"]
      - [Sentera FieldAgent Scout, "$499 annual license", "Visualization and field-management workflow with selected analytics", "Public list price; realized discount unknown", "Software subscription adds a recurring layer to hardware workflows"]
      - [Sentera FieldAgent Advisor, "$999 annual license", "Advisor analytics including stand count, canopy, and tassel capabilities", "Public list price; realized discount unknown", "Targets agronomists rather than replacing XAG aircraft"]
      - [Sentera FieldAgent Advanced, "$1,499 annual license", "Research-level analytics and variability analysis", "Public list price; enterprise pricing available on request", "Shows packaging depth; no comparable XAG software price is disclosed"]
      - [Manual or contractor operation, "Unknown", "Labor or outsourced field service", "No source-backed price or unit economics", "Must be diligenced before claiming robotics payback"]
    notes: "XAG and Sentera figures are not like-for-like: one is a quoted hardware starting price and the others are annual software-license prices. No realized discounts, contract lengths, or total-cost-of-ownership dataset was retained."
    claimRefs: [CP011, CP012, CP014]
