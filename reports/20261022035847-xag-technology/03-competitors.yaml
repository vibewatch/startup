    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008]
callouts:
  - calloutType: recommendation
    title: Underwrite the system, not the drone
    body: Competitive diligence should test whether XAG's rover, software, channel, and support layers increase customer retention and share of wallet, because public evidence still concentrates revenue and market proof in agricultural drones.
    claimRefs: [CP016, CP017, CP019]
  - calloutType: assumption
    title: Pricing comparisons remain provisional
    body: The retained pricing evidence mixes a quoted XAG hardware starting price with Sentera annual software licenses; no conclusion about customer payback or total cost should be drawn until model-level and regional quotes are obtained.
    claimRefs: [CP011, CP012]
