company:
  name: XAG Technology
chapter:
  number: 4
  title: Financials
  summary: XAG has moved from early agricultural-drone development toward a broader equipment, service, and smart-farm ecosystem. Public reporting shows a first annual profit in 2024 and continued profitability in the first half of 2025, but public evidence remains insufficient to underwrite realized pricing, gross margin, cash runway, or customer-level unit economics.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: XAG's commercial model appears to combine sales of agricultural drones and related equipment with technical, service, data, and smart-farm offerings. The product ecosystem includes agricultural drones, rovers, autopilots, remote-sensing drones, agricultural IoT, and a smart agriculture system, while its business scope also includes machinery services, leasing, maintenance, software, data processing, and agricultural services. This supports a hardware-plus-services interpretation rather than a pure SaaS model, but the public evidence does not disclose realized price mix, recurring-revenue share, contract duration, or revenue-recognition policy. A 2024 independent report cited a CNY40,000 starting price for XAG drones, while also noting that overseas expansion and service economics are strategic variables; this is a reference price, not evidence of realized revenue or margin. A Baidu Baike page reports more than 1,500 global authorized partners and a large China service footprint as of May 2026, which is a distribution and support proxy rather than a sales-efficiency metric.
    claimRefs: [CI001, CI002, CI003, CI004, CI014]
    tableRefs: [TI001, TI002]
  - id: profitability-and-capital
    title: Profitability, capital needs, and financing dependency
    body: "Public reporting indicates a material improvement in reported earnings: revenue rose to CNY1.07 billion in 2024 and net profit reached CNY70.4 million, followed by CNY130 million of first-half 2025 profit. A separate IPO-prospectus summary reports 2023 revenue of CNY614 million, 2024 revenue of CNY1.066 billion, and 2025 revenue of CNY1.166 billion, with net profit moving from a CNY133 million loss in 2023 to CNY70 million profit in 2024 and CNY124 million in 2025. These figures are not fully reconciled across sources and should not be treated as audited comparable series without the underlying filing. The Hong Kong IPO is a potential financing event, not cash already available; its proceeds, use of funds, valuation, dilution, and closing status remain unresolved. No public source in the assigned pool establishes cash on hand, burn, runway, debt, working capital, capex, or normalized gross margin."
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: The strongest public financial signal is a reported transition from loss to profit alongside substantial 2024 revenue growth and continued first-half 2025 profitability. The quality of that earnings improvement remains difficult to assess because the assigned sources do not separate hardware, service, IoT, and data contribution margins; do not disclose customer concentration, repeat purchase, CAC, payback, utilization, or warranty costs; and provide only limited realized-pricing evidence. Overseas revenue was reported at 25.2% of total revenue in the first half of 2025, while the IoT segment grew 195.8% year over year to CNY27.8 million, suggesting mix and geographic expansion but not yet demonstrating recurring economics. The adverse case is that hardware margin pressure and fragmented service and parts networks could constrain normalized profitability even if headline revenue and profit continue to grow.
    claimRefs: [CI010, CI011, CI012, CI013]
    figureRefs: [FI001]
