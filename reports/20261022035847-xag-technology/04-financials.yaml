      - ["2024", "CNY1.066bn or CNY1.07bn", "Net profit CNY70m or CNY70.4m; first annual profit reported", "Material reported turn, but normalized margin and cash conversion are unknown"]
      - ["2025", "CNY1.166bn", "Net profit CNY124m", "Prospectus summary indicates continued profit; audit and segment detail required"]
      - ["H1 2025", "CNY745m", "Net profit CNY130m, +48.5% year over year", "Current-period profitability signal; not a substitute for cash, runway, or full-year accounts"]
      - ["Hong Kong IPO", null, "Application submitted; proceeds, valuation, dilution, and closing status unavailable", "Potential future capital, not cash on hand; obtain prospectus terms and use of proceeds"]
    notes: "Figures are reproduced from third-party reports and a prospectus-summary page; small discrepancies between CNY1.066bn/CNY1.07bn and CNY70m/CNY70.4m require reconciliation. Null means no assigned source disclosed the amount."
    claimRefs: [CI005, CI006, CI008, CI009]
