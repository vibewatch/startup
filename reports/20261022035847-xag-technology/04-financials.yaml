callouts:
  - calloutType: strength
    title: Reported profit inflection
    body: "The assigned reporting shows a first annual profit in 2024 followed by first-half 2025 profit, a stronger signal than an unverified revenue-growth narrative."
    claimRefs: [CI005, CI008]
  - calloutType: risk
    title: Hardware economics remain unproven
    body: "The evidence does not establish normalized gross margin, warranty burden, service economics, or cash conversion, and one market analysis explicitly flags hardware-margin pressure as an industry test."
    claimRefs: [CI012, CI013]
  - calloutType: recommendation
    title: Request the operating model before underwriting
    body: "Prioritize audited segment revenue, realized ASP and discounting, gross-margin bridge, cash and debt schedule, working capital, and IPO use-of-proceeds materials before assigning a valuation."
    claimRefs: [CI004, CI009, CI012]
