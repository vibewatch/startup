      - [Agricultural rovers and autopilots, "Equipment sales and related deployment/support", "Product lines and business scope are described, but revenue mix is unavailable", "Company/product evidence; obtain shipment, ASP, attach-rate, and gross-margin data"]
      - [Smart-farm IoT and data services, "IoT equipment, farm-management software, data, and related services", "CNY27.8m first-half 2025 IoT revenue, up 195.8% year over year", "Third-party reported; clarify recurring versus project revenue and segment margin"]
      - [Technical and agricultural services, "Technical support, maintenance, training, farm services, and possible leasing", "More than 1,500 global authorized partners were reported as of May 2026; service revenue and unit economics are unavailable", "Network scale is a distribution proxy only; request contract terms, utilization, and warranty costs"]
    notes: "Values combine third-party financial reporting with product/business descriptions; product-level mix, recurring share, realized pricing, and recognition policy are not disclosed in the assigned evidence."
    claimRefs: [CI001, CI002, CI007, CI010, CI014]
  - id: TI002
