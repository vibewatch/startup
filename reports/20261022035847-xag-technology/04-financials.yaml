      - [Reported overseas price comparison, "US-vendor drones cited at USD60,000 with 20 kg capacity", "Directional competitive context, not a like-for-like margin comparison", "Normalize models, payload, service, financing, and regulatory costs"]
      - [Overseas revenue mix, "25.2% of total revenue in first half of 2025", "Shows geographic diversification, not recurring revenue or cash collection", "Obtain country mix, channel margins, receivables, and FX exposure"]
      - [IoT monetization, "CNY27.8m in first-half 2025; +195.8% year over year", "Fast growth from a small disclosed base; contribution margin and recurrence unknown", "Obtain contracts, renewal, implementation, and gross-margin data"]
    notes: "The pricing row is a reported starting price and the other rows are reported financial indicators; none establishes realized ASP, gross margin, CAC, or payback."
    claimRefs: [CI003, CI010, CI011]
