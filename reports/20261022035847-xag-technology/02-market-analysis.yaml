company:
  name: XAG Technology
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    XAG addresses a real but narrowly defined agricultural-automation market led by
    spraying and spreading drones, with adjacent ground robotics, controls, and smart-farm
    infrastructure. Published forecasts indicate rapid category growth, but their differing
    boundaries do not support a defensible company-specific SAM or SOM without primary
    country, crop, channel, and unit-economics data.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable boundary is narrower than "agtech" and broader than agricultural
      drones alone. XAG sells into automated field operations: aerial spraying and
      spreading, ground-robot tasks, tractor-autopilot workflows, positioning and control,
      and selected irrigation or connected-farm infrastructure. Included spend therefore
      comprises task-specific hardware, mission software, operator enablement, distribution,
      maintenance, and related services. It excludes consumer camera drones, general farm
      machinery without an autonomy layer, broad farm-management software, and unrelated
      sensing. The status quo remains manual application, conventional tractor-mounted
      equipment, and outsourced farm-service contractors. This boundary matters because
      each alternative has a different payer, replacement cycle, labor assumption, and
      regulatory burden; a broad precision-agriculture headline would overstate the budget
      directly available to XAG.
    claimRefs: [CM001, CM002, CM010, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      Available estimates point to expansion, but they are not interchangeable. One
      secondary account citing Frost & Sullivan puts global agricultural robotics at RMB
      8.9 billion in 2024 and RMB 74.9 billion in 2029, while a separate industry article
      places agricultural drones at about USD 2.74 billion in 2024. Those figures differ in
      category, currency, and methodology. Adoption evidence is directionally stronger:
      an article summarizing DJI's industry report states that 400,000 agricultural drones
      were in use at the end of 2024, up 90% from 2020. XAG's reported 17.1% share of the
      2024 agricultural-drone market is a company-position signal, not a defensible SOM.
      No source in the assigned evidence isolates serviceable spend by XAG's approved
      geographies, crops, channels, or product eligibility, so the sizing ladder should be
      read as non-additive evidence rather than a valuation-ready TAM/SAM/SOM model.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The economic buyer changes with farm structure. Large farms and agribusinesses can
      purchase fleets directly, while smaller farms may consume the technology through a
      spraying contractor or local service provider. Dealers and integrators influence
      platform choice because parts, training, repair turnaround, and seasonal uptime are
      integral to the purchase rather than afterthoughts. The user is typically a trained
      operator even when a farm owner or operations manager controls the budget. Adoption
      is strongest where labor is scarce, application windows are short, chemical exposure
      is material, and large or high-value acreage can absorb the capital cost. Yicai's
      farmer example - two people managing 200 hectares while reporting higher yield and
      lower cost - is useful proof of possible workflow leverage, but it is a single case
      and cannot establish a representative payback period.
    claimRefs: [CM009, CM010, CM011, CM015]
    tableRefs: [TM003]
  - id: constraints-and-underwriting
    title: Adoption constraints and valuation relevance
    body: >-
      Adoption timing is constrained by aviation rules, operating certification, support
      coverage, financing, crop economics, and trust in autonomous application. The Drone
      Girl reported that the United States had not finalized Part 108 and cited a backlog
      of more than 1,200 pilot applications in the first half of 2024; that evidence is
      jurisdiction-specific but shows how regulation can delay fleet utilization.
      International trade restrictions and dependence on regional parts and service
      networks can also weaken otherwise attractive hardware economics. Market structure
      adds pressure: a secondary account reported DJI above 50% share and XAG at 17.1% in
      2024, while agricultural drones represented 87.8% of XAG's revenue. Consequently,
      rapid category forecasts should not receive a full growth multiple until diligence
      confirms repeat purchase, service attachment, country-level eligibility, and
      normalized customer payback.
    claimRefs: [CM007, CM012, CM013, CM014, CM015, CM016]
