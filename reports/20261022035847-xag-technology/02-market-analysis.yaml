  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: "Country-by-crop eligible acreage, product approval, channel reach, average selling price, and replacement-cycle data needed for a serviceable market and obtainable share model."
      whyItMatters: "Broad robotics and drone forecasts cannot be translated into XAG revenue potential or a valuation multiple without a consistent denominator."
      diligencePath: "Obtain the prospectus market-study appendix and management's country, crop, unit, price, and channel model; reconcile it to audited shipment and revenue data."
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: customer-roi
      missingEvidence: "Representative customer payback, utilization, repeat-purchase, retention, service attachment, and downtime data by farm size, crop, geography, and ownership model."
      whyItMatters: "A single farmer case cannot establish scalable ROI, replacement demand, or the durability of service-provider economics."
      diligencePath: "Request anonymized cohorts and interview farms, contractors, and dealers in at least three material regions using a consistent total-cost-of-ownership template."
      relatedQuestionRefs: [QM010]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: market-size
      missingEvidence: "A reconciled definition connecting agricultural robotics, precision-agriculture drones, installed units, and company revenue without mixing categories or currencies."
      whyItMatters: "Unreconciled forecasts can create false precision and overstate the growth exposure that belongs in XAG's valuation."
      diligencePath: "Acquire underlying analyst reports, normalize definitions and currencies, and rebuild the model from country-level units, prices, and eligible use cases."
      relatedQuestionRefs: [QM003, QM009]
      relatedTableRefs: [TM002]
