chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              XAG was founded in 2007 and describes itself as an agricultural robotics company focused on making farming
              more efficient, sustainable, and rewarding. Its product scope extends beyond crop-spraying drones to
              agricultural rovers, autopilot consoles, smart-farm IoT, and farm-management systems. Tracxn places the
              headquarters in Tianhe, China, while the company describes its roots and manufacturing ecosystem in the
              Guangzhou region. The breadth of the portfolio supports an ecosystem thesis, but most product and mission
              descriptions remain company-originated rather than independently audited measures of customer outcomes.
              That distinction matters because a broad catalog can demonstrate engineering ambition without proving
              recurring demand, utilization, or durable pricing power.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
