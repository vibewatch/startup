  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than "agtech" and broader than agricultural drones alone. XAG sells
              into automated field operations: aerial spraying and spreading, ground-robot tasks, tractor-autopilot
              workflows, positioning and control, and selected irrigation or connected-farm infrastructure. Included
              spend therefore comprises task-specific hardware, mission software, operator enablement, distribution,
              maintenance, and related services. It excludes consumer camera drones, general farm machinery without an
              autonomy layer, broad farm-management software, and unrelated sensing. The status quo remains manual
              application, conventional tractor-mounted equipment, and outsourced farm-service contractors. This
              boundary matters because each alternative has a different payer, replacement cycle, labor assumption, and
              regulatory burden; a broad precision-agriculture headline would overstate the budget directly available to
              XAG.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available estimates point to expansion, but they are not interchangeable. One secondary account citing
              Frost & Sullivan puts global agricultural robotics at RMB 8.9 billion in 2024 and RMB 74.9 billion in
              2029, while a separate industry article places agricultural drones at about USD 2.74 billion in 2024.
              Those figures differ in category, currency, and methodology. Adoption evidence is directionally stronger:
              an article summarizing DJI's industry report states that 400,000 agricultural drones were in use at the
              end of 2024, up 90% from 2020. XAG's reported 17.1% share of the 2024 agricultural-drone market is a
              company-position signal, not a defensible SOM. No source in the assigned evidence isolates serviceable
              spend by XAG's approved geographies, crops, channels, or product eligibility, so the sizing ladder should
              be read as non-additive evidence rather than a valuation-ready TAM/SAM/SOM model.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer changes with farm structure. Large farms and agribusinesses can purchase fleets
              directly, while smaller farms may consume the technology through a spraying contractor or local service
              provider. Dealers and integrators influence platform choice because parts, training, repair turnaround,
              and seasonal uptime are integral to the purchase rather than afterthoughts. The user is typically a
              trained operator even when a farm owner or operations manager controls the budget. Adoption is strongest
              where labor is scarce, application windows are short, chemical exposure is material, and large or
              high-value acreage can absorb the capital cost. Yicai's farmer example - two people managing 200 hectares
              while reporting higher yield and lower cost - is useful proof of possible workflow leverage, but it is a
              single case and cannot establish a representative payback period.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption timing is constrained by aviation rules, operating certification, support coverage, financing,
              crop economics, and trust in autonomous application. The Drone Girl reported that the United States had
              not finalized Part 108 and cited a backlog of more than 1,200 pilot applications in the first half of
              2024; that evidence is jurisdiction-specific but shows how regulation can delay fleet utilization.
              International trade restrictions and dependence on regional parts and service networks can also weaken
              otherwise attractive hardware economics. Market structure adds pressure: a secondary account reported DJI
              above 50% share and XAG at 17.1% in 2024, while agricultural drones represented 87.8% of XAG's revenue.
              Consequently, rapid category forecasts should not receive a full growth multiple until diligence confirms
              repeat purchase, service attachment, country-level eligibility, and normalized customer payback.
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is a workflow sale, not only a hardware sale
            body: >-
              Training, authorized service, parts availability, operator compliance, and seasonal uptime determine
              whether nominal hardware productivity becomes realized farm ROI.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM015
          - type: callout
            title: Forecast breadth can overstate XAG's valuation-relevant market
            body: >-
              Robotics and drone forecasts use incompatible category boundaries; underwriting should require a
              country-by-crop SAM and a channel- and price-constrained SOM.
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The primary competitive contest is XAG versus DJI in agricultural drones. A 2024 market comparison
              reported DJI at 63.9% of China's agricultural-drone revenue and XAG at 20.8%, while globally XAG held
              17.1% versus DJI's 59%. That gap makes DJI the incumbent benchmark rather than a peripheral peer. XAG
              nevertheless covers more than one aircraft category: its company product listing includes R-series ground
              vehicles, while an independent overview describes agricultural drones, ground rovers, autopilot consoles,
              and connected farm hardware and software. This creates a broader air-to-ground proposition than a
              drone-only purchase, although the available evidence does not prove that buyers procure the components as
              one bundle. Sentera is an adjacent alternative: FieldAgent turns drone, satellite, and ground imagery into
              agronomic analytics and integrates with John Deere Operations Center and Climate FieldView, but it is not
              presented as a replacement for XAG's spraying or rover hardware. Status-quo choices remain manual
              spraying, contractor services, conventional tractor equipment, and an internal build or mixed-fleet
              workflow; the pool contains no comparable cost study for those alternatives.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
      - number: '3.2'
        title: Product scope, capability, and distribution
        blocks:
          - type: paragraph
            body: >-
              XAG's differentiation is operational rather than purely aerodynamic. Its R200 page specifies six-wheel
              drive, route planning, centimeter-level positioning support, variable-rate spraying, obstacle detection,
              and modular add-ons for orchard and greenhouse work. The independent overview similarly describes an
              ecosystem spanning high-payload drones, ground rovers, autopilot consoles, and farm digitization. XAG also
              has an international distribution signal: Yicai reported that the company had entered 63 countries and
              regions after starting overseas expansion in Japan in 2017, with more than 100,000 unmanned aerial
              vehicles sold abroad. This supports distribution reach, not customer retention or service quality.
              Sentera's FieldAgent shows a different route to buyer value: recurring annual licenses, tiered analytics
              access, integrations, and compatibility with multiple drone and sensor platforms. That interoperability
              can support multi-homing and reduces the need to replace existing aircraft, while XAG's integrated
              hardware stack may create more workflow control but also more platform dependence.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP017
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing, packaging, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Public price evidence is asymmetric. Yicai quoted XAG's co-founder saying XAG drones started at CNY40,000
              and contrasted that with US vendors at USD60,000, but the article does not identify a like-for-like model,
              configuration, market, or realized transaction price. Sentera publishes FieldAgent annual license prices
              of $499 for Scout, $999 for Advisor, and $1,499 for Advanced, plus a Collaborator tier shown at $99; these
              are software license prices, not total agronomic operating cost. The comparison therefore cannot establish
              that XAG is cheaper for a farm or service operator. Switching costs likely arise from operator training,
              batteries, payload equipment, RTK or data services, spare parts, and seasonal service reliability, but the
              assigned evidence does not quantify them. XAG's historical shift from direct spraying services to selling
              hardware to professional users suggests channel adaptation, while Sentera's integrations and hardware
              compatibility support multi-homing. No source in the pool provides DJI list prices, discounting, contract
              terms, or verified procurement win rates, so those matrix cells remain unknown.
            claimRefs:
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest durability signals are a broad product stack, a large international channel footprint, and
              accumulated operating experience in agricultural workflows. The counter-signal is concentration:
              agricultural drones represented 89% of XAG revenue in the first half of 2025, according to reporting on
              its prospectus, while DJI retained a substantial lead in both China and global agricultural drones. XAG's
              reported R&D expense ratio also fell from 32.1% of revenue in 2022 to approximately 10% in the first half
              of 2025; this is not proof of underinvestment, but it increases the diligence need around product velocity
              and moat maintenance. Hardware commoditization, price pressure, geopolitical restrictions, and service
              network fragmentation could weaken differentiation. The evidence supports an investable competitive thesis
              only with continued validation of model-level reliability, channel economics, repeat purchases, and the
              response of DJI and other incumbents. Those measures are not disclosed in the assigned pool.
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the system, not the drone
            body: >-
              Competitive diligence should test whether XAG's rover, software, channel, and support layers increase
              customer retention and share of wallet, because public evidence still concentrates revenue and market
              proof in agricultural drones.
            calloutType: recommendation
            claimRefs:
              - CP016
              - CP017
              - CP019
          - type: callout
            title: Pricing comparisons remain provisional
            body: >-
              The retained pricing evidence mixes a quoted XAG hardware starting price with Sentera annual software
              licenses; no conclusion about customer payback or total cost should be drawn until model-level and
              regional quotes are obtained.
            calloutType: assumption
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              XAG's commercial model appears to combine sales of agricultural drones and related equipment with
              technical, service, data, and smart-farm offerings. The product ecosystem includes agricultural drones,
              rovers, autopilots, remote-sensing drones, agricultural IoT, and a smart agriculture system, while its
              business scope also includes machinery services, leasing, maintenance, software, data processing, and
              agricultural services. This supports a hardware-plus-services interpretation rather than a pure SaaS
              model, but the public evidence does not disclose realized price mix, recurring-revenue share, contract
              duration, or revenue-recognition policy. A 2024 independent report cited a CNY40,000 starting price for
              XAG drones, while also noting that overseas expansion and service economics are strategic variables; this
              is a reference price, not evidence of realized revenue or margin. A Baidu Baike page reports more than
              1,500 global authorized partners and a large China service footprint as of May 2026, which is a
              distribution and support proxy rather than a sales-efficiency metric.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI010
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI010
              - CI011
      - number: '4.2'
        title: Profitability, capital needs, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public reporting indicates a material improvement in reported earnings: revenue rose to CNY1.07 billion in
              2024 and net profit reached CNY70.4 million, followed by CNY130 million of first-half 2025 profit. A
              separate IPO-prospectus summary reports 2023 revenue of CNY614 million, 2024 revenue of CNY1.066 billion,
              and 2025 revenue of CNY1.166 billion, with net profit moving from a CNY133 million loss in 2023 to CNY70
              million profit in 2024 and CNY124 million in 2025. These figures are not fully reconciled across sources
              and should not be treated as audited comparable series without the underlying filing. The Hong Kong IPO is
              a potential financing event, not cash already available; its proceeds, use of funds, valuation, dilution,
              and closing status remain unresolved. No public source in the assigned pool establishes cash on hand,
              burn, runway, debt, working capital, capex, or normalized gross margin.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial signal is a reported transition from loss to profit alongside substantial
              2024 revenue growth and continued first-half 2025 profitability. The quality of that earnings improvement
              remains difficult to assess because the assigned sources do not separate hardware, service, IoT, and data
              contribution margins; do not disclose customer concentration, repeat purchase, CAC, payback, utilization,
              or warranty costs; and provide only limited realized-pricing evidence. Overseas revenue was reported at
              25.2% of total revenue in the first half of 2025, while the IoT segment grew 195.8% year over year to
              CNY27.8 million, suggesting mix and geographic expansion but not yet demonstrating recurring economics.
              The adverse case is that hardware margin pressure and fragmented service and parts networks could
              constrain normalized profitability even if headline revenue and profit continue to grow.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
              - CI011
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported profit inflection
            body: >-
              The assigned reporting shows a first annual profit in 2024 followed by first-half 2025 profit, a stronger
              signal than an unverified revenue-growth narrative.
            calloutType: strength
            claimRefs:
              - CI005
              - CI008
          - type: callout
            title: Hardware economics remain unproven
            body: >-
              The evidence does not establish normalized gross margin, warranty burden, service economics, or cash
              conversion, and one market analysis explicitly flags hardware-margin pressure as an industry test.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
          - type: callout
            title: Request the operating model before underwriting
            body: >-
              Prioritize audited segment revenue, realized ASP and discounting, gross-margin bridge, cash and debt
              schedule, working capital, and IPO use-of-proceeds materials before assigning a valuation.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and operating model
        blocks:
          - type: paragraph
            body: >-
              XAG's product is best understood as a farm-operations workflow rather than a single aircraft. Third-party
              descriptions identify agricultural drones, R-series rovers, autopilot consoles, and connected farm
              hardware and software as complementary parts of an air-to-ground system. The core customer job is to
              execute time-sensitive crop-protection, spreading, seeding, fertigation, and monitoring tasks with
              repeatable routes and less direct chemical exposure. XAG's product surface supports both hardware-led
              deployment and service or partner-led operation: the company describes regional channels, while the IRRI
              collaboration shows equipment donated through Philippine partner Agridom for research and protocol
              validation. This operating model can improve utilization where labor is scarce, but it also makes outcomes
              dependent on trained operators, local service coverage, field conditions, and regulatory permissions
              rather than on aircraft capability alone.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE011
      - number: '5.2'
        title: Architecture, controls, and maturity
        blocks:
          - type: paragraph
            body: >-
              The available technical evidence points to a layered architecture combining mobile robotics, positioning
              and perception, application-control hardware, and a local or mobile software layer. Baidu Baike describes
              fully autonomous flight using RTK positioning, terrain-following radar, binocular obstacle avoidance, and
              4D imaging millimeter-wave radar; it also describes variable-rate spraying through a peristaltic pump and
              centrifugal atomizing nozzle. XAG's FPI page shows the same systems pattern in fertigation: sensors
              measure concentration and flow, plans adjust valve opening, the app records task data, and local-server
              and relay components support connectivity. These are concrete mechanisms rather than generic AI claims,
              but they do not establish fleet-wide uptime, false-obstacle rates, application accuracy under all
              conditions, or cybersecurity testing. The technology is therefore credible as an integrated control stack
              while remaining only partially verified as a production-grade reliability and safety system.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE009
      - number: '5.3'
        title: Differentiation, deployment, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              XAG's differentiation rests on the combination of autonomous flight, high-capacity application,
              air-to-ground coverage, and farm-data workflows, reinforced by a partner and service footprint. Yicai
              reported that XAG had entered 63 additional countries and regions after beginning overseas expansion in
              2017, while Baidu Baike reported more than 1,500 authorized partners globally as of May 2026. Yicai also
              described two Xinjiang farmers who managed 200 hectares and reported 20% higher cotton yield and 21% lower
              costs than nearby fields while using a combination of outsourcing, robots, and AI, but it did not isolate
              XAG's contribution. IRRI separately documents a research collaboration and adoption barriers including
              limited access, missing standard protocols, financing constraints, and regulation. The product has
              evidence of international use and institutional validation activity, but not a complete deployment
              scorecard. The key underwriting questions are regional approval and insurance, support response during
              narrow spraying windows, recurring software or data economics, parts availability, and whether claimed
              autonomy translates into safe, repeatable results across crop types and terrain.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated workflow is the defensible product surface
            body: >-
              XAG combines aircraft, ground robotics, application controls, and farm software into a workflow that can
              address more than one field task, although public evidence does not quantify the resulting customer-level
              economics.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE009
          - type: callout
            title: Reliability and compliance remain under-disclosed
            body: >-
              Public sources describe technical safeguards and adoption barriers, but do not provide fleet-wide
              reliability, incident, cybersecurity, approval, or regional service-level evidence.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              XAG serves several overlapping customer roles rather than a single buyer type. Farmers and farm managers
              use the equipment directly, while contractors, authorized dealers, and field-service operators can act as
              the operating or distribution layer. XAG Australia's local surface explicitly names growers, contractors,
              and land managers, and lists broadacre cropping, cotton, sugarcane, vineyards, orchards, vegetables, and
              livestock and pasture as application contexts. The customer value proposition is therefore tied to field
              timing, labor availability, terrain, and application precision rather than to a generic robotics purchase.
              The Vietnam and Brazil examples add named owner-operators and mixed-crop farms, but they are individual
              case studies, not evidence of the full customer population or a representative revenue mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
      - number: '6.2'
        title: Adoption proof and operating outcomes
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption proof is operational: named growers describe using XAG drones in production
              crop-protection work, and the country stories specify the prior manual or tractor workflow being replaced.
              In Vietnam, Nguyen Van Huong reports moving from boat-based manual spraying to a P150 after late-2024
              purchase; in Brazil, Bruno Oliveira describes using a P100 Pro for coffee, grapes, soybeans, and corn,
              including spraying, fertilizer, and cover-crop seed. These accounts support workflow adoption and reported
              productivity or input changes, but the quantitative outcomes are customer estimates in company-distributed
              stories and are not audited cohort measures. XAG Australia's training, parts, service, and demonstration
              offer indicates that adoption includes enablement and after-sales support, not only hardware delivery.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU013
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose net revenue retention, gross retention, churn, renewal rates, contract
              lengths, cohort curves, or customer-level revenue concentration. The available proof is instead
              point-in-time or case-based: a Vietnamese orchard owner and a Brazilian mixed-crop farmer describe current
              use, while XAG Australia advertises training, parts, servicing, and field demonstrations that could
              support repeat use. Baidu Baike reports a large authorized-partner and service-station footprint as of May
              2026, while Yicai gives broader reach indicators, including overseas entry into 63 additional countries
              and regions after Japan and more than 100,000 unmanned aerial vehicles sold abroad. Neither source
              provides an active-customer denominator, channel revenue mix, or retention data. The underwriting
              implication is that customer need appears real in several workflows, while durability, expansion
              economics, channel dependence, and concentration remain diligence gaps.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU007
              - CU009
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence of real operational use
            body: >-
              Named farmers describe using XAG drones in production crop-protection workflows, including specific crops,
              equipment, and replaced manual or tractor processes.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
          - type: callout
            title: Retention and concentration remain opaque
            body: >-
              Public materials do not disclose customer cohorts, churn, renewal, net retention, contract duration, or
              customer-level revenue concentration.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and underwriting priorities
        blocks:
          - type: paragraph
            body: >-
              XAG's September 2025 Hong Kong IPO filing was its second listing attempt, after a withdrawn STAR Market
              application. It enters the underwriting period with evidence of scale and a reported profit turn, but the
              risk stack remains concentrated. Secondary reports based on the 2025 prospectus put 2024 revenue at
              RMB1.066 billion and net profit at RMB70.41 million, while first-half 2025 revenue was RMB745 million,
              period profit RMB130 million, and gross margin 34.3%. That accounting improvement did not eliminate
              cash-conversion risk: one analysis reported a RMB53.67 million operating cash outflow in the first half of
              2025. Agricultural drones still represented 87.8% of 2024 revenue, leaving the model exposed to one
              product category and to DJI, which the same reports placed above 50% global share versus XAG's 17.1%. The
              evidence therefore supports a high residual execution-risk view rather than treating one profitable year
              as normalized economics.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR011
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Regulatory, trade, and operating safety exposure
        blocks:
          - type: paragraph
            body: >-
              The available evidence establishes controls, not comprehensive clearance. XAG's V40 page says product
              versions and features differ because of certification and other factors, directs buyers to consult
              dealers, and lists CE, KC, and FCC certifications for that model. Those statements should not be
              generalized into approval for every product or jurisdiction. The same page warns that positioning accuracy
              may be affected when the drone operates without internet access and tells operators to take control if
              deviation occurs. A secondary safety summary adds operating constraints around livestock proximity and
              densely populated areas. Separately, a 2025 prospectus summary described tariff peaks and warned that
              future import-policy tightening or failed cost pass-through could pressure margins and orders. No current
              primary regulator, court, recall, or incident record was available in the assigned pool, so absence of a
              cited event is not evidence that no event occurred.
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Partner, technology, and international dependencies
        blocks:
          - type: paragraph
            body: >-
              International reach increases both opportunity and dependency risk. Yicai reported in October 2024 that
              XAG had entered 64 countries and regions and sold more than 100,000 UAVs abroad; prospectus-based
              reporting put 2024 overseas revenue at RMB370 million, or 34.8% of total revenue. That footprint implies
              reliance on local dealers, service capacity, certification pathways, logistics, and tariff treatment, but
              the pool does not quantify distributor or supplier concentration. Technology scope also broadens execution
              demands: XAG markets several rover products, and an independent product summary describes an ecosystem
              spanning drones, rovers, autopilot consoles, and connected farm infrastructure. Platform breadth can
              diversify use cases, yet it also multiplies commercialization, support, inventory, and reliability
              obligations. The official warning about offline positioning makes RTK, local control, and operator
              intervention important operational dependencies rather than purely technical features.
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation evidence is uneven. Model-specific certifications, dealer consultation, offline-control
              instructions, and operating-safety procedures show that XAG recognizes compliance and field-safety
              constraints, but the evidence does not disclose incident rates, recall history, audit results, insurance
              claims, or control effectiveness across the installed base. Financial monitoring should reconcile profit
              to operating cash flow and separate seasonality, working capital, and capitalized investment. Commercial
              monitoring should track agricultural-drone revenue concentration, XAG-versus-DJI share, overseas revenue
              exposure, distributor concentration, and tariff pass-through. Thesis-break triggers are renewed losses
              without a credible investment bridge, repeated negative operating cash flow without a documented seasonal
              explanation, material import restrictions that cannot be passed through, a verified safety or
              certification failure that suspends sales, or sustained share loss while drone concentration remains
              elevated. These are analyst-defined decision rules, not company guidance.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence ceiling
            body: >-
              The assigned pool contains no current primary regulator, court, recall, or incident record. This is an
              evidence gap, not proof that litigation, enforcement, recalls, or safety incidents are absent.
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
          - type: callout
            title: Thesis-break monitoring
            body: >-
              Escalate if losses recur without an investment bridge, operating cash flow remains negative without a
              seasonal explanation, material tariffs cannot be passed through, a verified safety or certification
              failure suspends sales, or market share erodes while drone revenue concentration remains elevated.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              XAG has an investable operating story but not a sufficiently disclosed public price story. The company
              describes an ecosystem spanning agricultural drones, rovers, autopilot consoles, and connected farm
              systems, while independent reporting describes expansion into 64 countries and more than 100,000 overseas
              UAV sales. Those signals support a meaningful platform and international demand, not a valuation
              conclusion. The assigned evidence does not provide a verified current round price, share count, preference
              stack, debt balance, or normalized EBITDA. It also contains conflicting secondary descriptions of the
              listing path: Reboot Hub reports a Hong Kong IPO filing, while Baidu Baike says that as of March 2026 XAG
              had submitted a prospectus for the Science and Technology Innovation Board. Neither item is the primary
              filing. The recommendation is therefore track / research more rather than buy: require a verified
              financing instrument and unit economics before paying for a growth multiple. The principal upside is
              broader automation and service-network monetization; the principal underwriting risk is hardware-margin
              and commercialization uncertainty.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV011
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on product breadth, a visible field-use case, and evidence of overseas distribution.
              XAG's Australian channel says the P150 Max was demonstrated at the launch of Queensland's $30 million
              farming-innovation fund, while Yicai's October 2024 report describes expansion into 63 additional
              countries and regions and more than 100,000 overseas UAV sales. These are distribution and positioning
              signals, not recurring-revenue or retention evidence. The anti-thesis is equally material: Reboot Hub
              frames the IPO as a test of profitability while hardware margins are under pressure. Deere's October 2026
              market capitalization and AGCO's public precision-agriculture positioning establish only broad
              public-market context. They do not supply a clean private-company multiple because the assigned evidence
              does not align business mix, growth, margins, capital intensity, or transaction terms. A valuation should
              therefore be triangulated from verified XAG financials and model-appropriate peers rather than headline
              market capitalization.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is directional because the assigned pool lacks audited revenue, gross margin, cash,
              debt, share count, and transaction price. The bull case requires conversion of the product ecosystem and
              overseas footprint into repeatable, higher margin service or software economics; the base case assumes
              hardware-led growth with continued competition and uneven regional monetization; the bear case assumes
              margin compression, delayed liquidity, or a financing event below the prior mark. No numeric valuation
              range, target return, hold period, or exit value is supportable from this pool. The decision should move
              only when a data room confirms cohort or repeat-purchase economics, warranty and service costs, channel
              terms, cap-table preferences, and regulatory commercialization constraints. Exit readiness is not
              demonstrated by conflicting secondary listing accounts. A primary filing or financing-round document,
              audited accounts, and independent transaction evidence are the highest-value next diligence items.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not buy on public evidence alone
            body: >-
              The assigned sources show a credible operating platform and demand signals, but no verified current price,
              capitalization terms, or normalized margin base. A disciplined entry decision requires primary financing
              and financial evidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV014
              - CV016
          - type: callout
            title: Down-round and margin risk remain live
            body: >-
              A successful listing or financing is not established by the available secondary accounts, which disagree
              on venue; Reboot Hub also warns that hardware margins and business-model sustainability need testing.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV016
