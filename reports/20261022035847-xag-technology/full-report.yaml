              - CO008
              - CO009
              - CO011
      - number: '1.2'
        title: Leadership, ownership, and capital
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence identifies Bin Peng and Justin Gong as co-founders, while a March 2026
              IPO-oriented report identifies Peng Bin as founder, chair, and president and describes concentrated
              pre-listing control. Tracxn reports $248 million of funding across four rounds, including a latest listed
              round in September 2023. The evidence is useful for mapping control and financing history, but it does not
              establish a current board committee structure, normalized valuation, or a complete investor-by-investor
              capitalization table. Concentrated founder ownership may align strategic incentives, yet it also makes
              succession planning, related-party controls, and the treatment of minority investors important
              underwriting questions for investors.
