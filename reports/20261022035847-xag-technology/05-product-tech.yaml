company:
  name: XAG Technology
chapter:
  number: 5
  title: Product & Technology
  summary: XAG presents an air-to-ground agricultural automation stack spanning autonomous drones, rovers, irrigation hardware, farm software, and service infrastructure. The evidence supports a technically differentiated workflow, but public materials leave model-level reliability, deployment economics, and regional compliance validation incomplete.
sections:
  - id: product-workflow
    title: Product workflow and operating model
    body: >-
      XAG's product is best understood as a farm-operations workflow rather than a single aircraft. Third-party descriptions identify agricultural drones, R-series rovers, autopilot consoles, and connected farm hardware and software as complementary parts of an air-to-ground system. The core customer job is to execute time-sensitive crop-protection, spreading, seeding, fertigation, and monitoring tasks with repeatable routes and less direct chemical exposure. XAG's product surface supports both hardware-led deployment and service or partner-led operation: the company describes regional channels, while the IRRI collaboration shows equipment donated through Philippine partner Agridom for research and protocol validation. This operating model can improve utilization where labor is scarce, but it also makes outcomes dependent on trained operators, local service coverage, field conditions, and regulatory permissions rather than on aircraft capability alone.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: technical-architecture
    title: Architecture, controls, and maturity
    body: >-
      The available technical evidence points to a layered architecture combining mobile robotics, positioning and perception, application-control hardware, and a local or mobile software layer. Baidu Baike describes fully autonomous flight using RTK positioning, terrain-following radar, binocular obstacle avoidance, and 4D imaging millimeter-wave radar; it also describes variable-rate spraying through a peristaltic pump and centrifugal atomizing nozzle. XAG's FPI page shows the same systems pattern in fertigation: sensors measure concentration and flow, plans adjust valve opening, the app records task data, and local-server and relay components support connectivity. These are concrete mechanisms rather than generic AI claims, but they do not establish fleet-wide uptime, false-obstacle rates, application accuracy under all conditions, or cybersecurity testing. The technology is therefore credible as an integrated control stack while remaining only partially verified as a production-grade reliability and safety system.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-gaps
    title: Differentiation, deployment, and diligence gaps
    body: >-
      XAG's differentiation rests on the combination of autonomous flight, high-capacity application, air-to-ground coverage, and farm-data workflows, reinforced by a partner and service footprint. Yicai reported that XAG had entered 63 additional countries and regions after beginning overseas expansion in 2017, while Baidu Baike reported more than 1,500 authorized partners globally as of May 2026. Yicai also described two Xinjiang farmers who managed 200 hectares and reported 20% higher cotton yield and 21% lower costs than nearby fields while using a combination of outsourcing, robots, and AI, but it did not isolate XAG's contribution. IRRI separately documents a research collaboration and adoption barriers including limited access, missing standard protocols, financing constraints, and regulation. The product has evidence of international use and institutional validation activity, but not a complete deployment scorecard. The key underwriting questions are regional approval and insurance, support response during narrow spraying windows, recurring software or data economics, parts availability, and whether claimed autonomy translates into safe, repeatable results across crop types and terrain.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015]
callouts:
  - calloutType: strength
    title: Integrated workflow is the defensible product surface
    body: XAG combines aircraft, ground robotics, application controls, and farm software into a workflow that can address more than one field task, although public evidence does not quantify the resulting customer-level economics.
    claimRefs: [CE001, CE005, CE009]
  - calloutType: risk
    title: Reliability and compliance remain under-disclosed
    body: Public sources describe technical safeguards and adoption barriers, but do not provide fleet-wide reliability, incident, cybersecurity, approval, or regional service-level evidence.
    claimRefs: [CE008, CE011, CE013]
