  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product reliability
      missingEvidence: Fleet-level uptime, failure rates, obstacle-avoidance performance, and incident history by model and region.
      whyItMatters: Reliability determines whether autonomous equipment can operate during narrow agricultural windows and whether service obligations consume margin.
      diligencePath: Request model-level reliability reports, warranty and repair data, incident logs, and service-level performance by geography.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: compliance and security
      missingEvidence: Product approvals, insurance requirements, cybersecurity testing, data governance, and privacy controls by operating jurisdiction.
      whyItMatters: Regional rules and data handling can delay deployment or limit the usable market even when the hardware works technically.
      diligencePath: Obtain a jurisdiction-by-jurisdiction compliance matrix, security assessment, data-retention policy, and insurance documentation.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: performance economics
      missingEvidence: Independent, controlled evidence of application accuracy, yield impact, chemical or fertilizer savings, and total cost of ownership.
      whyItMatters: Product differentiation and customer payback depend on realized field outcomes rather than feature breadth alone.
      diligencePath: Request anonymized field trials with control groups, crop and terrain splits, operator hours, input use, downtime, and payback.
      relatedQuestionRefs: [QE004, QE005]
    - type: missing-source
      severity: minor
      topic: developer signal
      missingEvidence: A public code, package, API, engineering-community, or quantified practitioner-activity surface tied directly to XAG products.
      whyItMatters: A transparent technical or practitioner surface would provide a repeatable signal of integration activity, maintenance cadence, and ecosystem depth.
      diligencePath: Request public API and integration documentation, release history, developer metrics, and practitioner-community participation data.
      relatedQuestionRefs: [QE009]
