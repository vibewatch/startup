companyProfile:
  summary: >-
    XAG Technology is a Guangzhou-based agricultural robotics company founded in 2007. It has expanded from
    crop-spraying drones into an air-to-ground and smart-farm ecosystem that includes rovers, autopilot systems,
    fertigation hardware, software, and partner-led field services. Public evidence indicates international reach and a
    reported transition to profitability, but does not yet establish durable customer cohorts, normalized margins,
    current valuation, or complete governance controls.
