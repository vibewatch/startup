    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete list of named production customers, with start dates, current status, and whether each relationship is
      pilot, active rollout, or scaled enterprise use.
    whyItMatters: >-
      Current public proof validates selected logos and workflows, but not the full composition or maturity of the
      customer base.
    diligencePath: >-
      Request a customer reference list or revenue-backed deployment register that labels account stage, geography, use
      case, and production status.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: financial-visibility
    missingEvidence: >-
      Current revenue, ARR, gross margin, cash burn, runway, and top-customer concentration metrics tied to the 2026
      board or financing package.
    whyItMatters: >-
      Without current economics, investors cannot separate healthy growth from dilution-driven survival or judge how
      much regulatory and deployment scale costs to maintain.
    diligencePath: >-
      Request CFO reporting pack, current budget versus actuals, customer concentration schedule, and financing terms
      for the 2024-2026 period.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: incident-visibility
    missingEvidence: >-
      A 2024-2026 log of litigation, enforcement correspondence, complaints, outages, cybersecurity incidents, and CAPA
      activity.
    whyItMatters: >-
      A regulated platform can look scalable in launch announcements while still carrying hidden legal, privacy, or
      reliability liabilities that change expected downside.
    diligencePath: >-
      Request legal and regulatory memo, incident postmortems, complaint log, and status or uptime history covering the
      current reporting period.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: material
    topic: cap-table-overhang
    missingEvidence: >-
      Post-money ownership, liquidation preferences, secondary-vs-primary mix, option-pool size, and any debt or
      project-finance obligations tied to the latest rounds.
    whyItMatters: >-
      These terms determine whether the public valuation marker translates into an investable common-equity entry point
