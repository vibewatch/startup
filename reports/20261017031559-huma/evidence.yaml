evidenceGaps:
  - type: missing-source
    severity: material
    topic: economics-and-valuation
    missingEvidence: Verified 2025-2026 revenue, ARR, gross margin, cash-burn, and a primary-source post-money valuation.
    whyItMatters: >-
      These are the metrics needed to judge underwriting quality, dilution risk, and whether the 2024 financing
      translated into durable operating leverage.
    diligencePath: >-
      Request audited FY2024-FY2025 management accounts, latest board pack, and the most recent financing term sheet or
      cap-table summary.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control
    missingEvidence: >-
      Current ownership concentrations, board rights, liquidation preferences, secondaries, and any debt or credit
      facilities.
    whyItMatters: >-
      Capital structure can materially change control, downside protection, and the interpretation of headline funding
      totals.
    diligencePath: >-
      Request the current cap table, financing documents, side letters, debt schedules, and board observer or veto-right
      summaries.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: current-leadership-depth
    missingEvidence: >-
      A 2025-2026 org chart, current board list, exact headcount, and any material leadership departures or hires since
      the 2021 governance disclosures.
    whyItMatters: >-
      Leadership concentration and execution risk cannot be assessed well from a founder-centric public record that is
      several turns behind the current operating year.
    diligencePath: >-
      Request the live org chart, board and committee list, current headcount by function, and a log of executive
      changes since 2021.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent TAM, SAM, or segmented spend data for virtual wards, companion apps, and decentralized trials that
      matches Huma's exact workflow boundary.
    whyItMatters: >-
      Without a clean external sizing benchmark, deployment and ROI signals cannot be translated into a valuation-grade
      market model.
    diligencePath: >-
      Acquire an analyst report or buyer-budget dataset that isolates regulated remote-care software and
      decentralized-trial workflow spend by segment and geography.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Segment-level contract values, buyer titles, and explicit budget-owner disclosure across provider, ministry,
      pharma, and research sales motions.
    whyItMatters: >-
      Buyer and payer roles can be inferred from workflows, but the lack of disclosed ACVs and named budget owners
      limits adoption-timing and go-to-market analysis.
    diligencePath: >-
      Review customer contracts, procurement documents, or management disclosures that identify buyer titles, ACVs, and
      renewal structures by segment.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: valuation-signals
    missingEvidence: A reconciled financing ledger and board-approved valuation history for the 2021-2026 period.
    whyItMatters: >-
      Clay and Forge publish materially different funding and valuation numbers, so public financing signals cannot
      anchor a precise market-size or valuation conclusion.
    diligencePath: >-
      Reconcile the cap table, signed financing documents, and management's latest valuation marks against third-party
      databases before using them in valuation work.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing benchmark
    missingEvidence: >-
      Realized customer pricing, implementation scope, renewal terms, and discount structures for Huma and named
      alternatives.
    whyItMatters: >-
      Without realized pricing and renewal data, the chapter cannot compare Huma’s platform breadth to actual budget
      trade-offs or procurement friction.
    diligencePath: >-
      Request signed order forms, MSAs, SOWs, and procurement comparisons from Huma plus two recent competitive
      bake-offs.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: named-peer win rate
    missingEvidence: >-
      Verified win/loss data, churn anecdotes, migration timelines, and export outcomes versus incumbent EHR modules or
      specialist point vendors.
    whyItMatters: >-
      Commercial durability depends on whether Huma repeatedly displaces alternatives in production, not only on whether
      its architecture looks broader in public materials.
    diligencePath: >-
      Collect customer references, renewal cohorts, competitive intelligence logs, and post-migration implementation
      reviews from the last 12-18 months.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current contract schedules, realized ASPs, and discounting by buyer type.
    whyItMatters: >-
      Public monetization descriptions do not show whether Huma earns software-like recurring revenue or
      deployment-heavy bespoke revenue.
    diligencePath: Request current enterprise contracts, price books, and a revenue bridge by product and buyer cohort.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current gross margin, CAC, implementation cost, payback, and renewal data by segment.
    whyItMatters: These metrics determine whether deployment breadth converts into efficient, durable economics.
    diligencePath: Request board KPI packs or operating dashboards with margin, CAC, payback, and retention cohorts.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, runway, debt facilities, and covenant constraints.
    whyItMatters: Large historical fundraising does not prove current financing sufficiency or timing of the next round.
    diligencePath: Request the latest management accounts, cash bridge, and financing documents.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: Net revenue retention, logo retention, and top-customer concentration by revenue.
    whyItMatters: Revenue quality cannot be judged from deployment-count claims alone.
    diligencePath: Request cohort retention by buyer type and revenue concentration for the top 10 accounts.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer-signal evidence such as active repositories package downloads SDK forum traffic or
      practitioner-community usage tied to Huma's current platform.
    whyItMatters: >-
      Developer adoption would help verify whether Huma's SDK and integration story is externally used or mostly
      marketing-led.
    diligencePath: >-
      Request current SDK documentation distribution metrics repository access or partner integration references that
      show real third-party technical usage.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Current public security privacy certification uptime or incident-response documentation for the platform.
    whyItMatters: >-
      Investors in regulated digital health need proof of operational assurance beyond regulatory-product claims and
      marketing pages.
    diligencePath: >-
      Ask for a security whitepaper trust center certification list DPA summary pen-test cadence and historical uptime
      or incident metrics.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: delivery-ownership
    missingEvidence: >-
      Internal versus outsourced engineering ownership release governance and service-level evidence for the core
      product stack.
    whyItMatters: Long-running partner staffing can speed delivery but may also concentrate technical knowledge outside the company.
    diligencePath: >-
      Request an engineering org chart vendor-scope breakdown release cadence incident metrics and transition plans for
      any partner-owned modules.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: durability-gaps
    missingEvidence: >-
      Customer-retention evidence such as NRR, GRR, churn, renewal rates, contract length, or cohort behavior by
      segment.
    whyItMatters: >-
      Without durability metrics, adoption breadth cannot be translated into recurring revenue confidence or account
      quality.
    diligencePath: >-
      Request cohort retention data, contract-length distributions, and renewal statistics split between providers,
      governments, and life-sciences customers.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Revenue concentration by customer, payer, geography, and segment, including top-account exposure and the share of
      business tied to public-health contracts.
    whyItMatters: >-
      A business with large government or pharma accounts can look broad publicly while still depending on a small
      number of economically critical relationships.
    diligencePath: >-
      Obtain a customer-concentration schedule, segment revenue mix, and disclosure of any accounts or channels
      representing more than 10 percent of ARR or revenue.
    relatedQuestionRefs:
      - QU006
      - QU008
    relatedTableRefs:
