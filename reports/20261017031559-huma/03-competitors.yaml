  - - Incumbent EHR or workflow module
    - Incumbent / adjacent
    - Installed-base advantage implied; no retained named-peer metrics
    - Health systems already standardized on incumbent workflows
    - Can bundle adjacent capabilities inside existing contracts and procurement channels
    - Assigned evidence does not show equivalent cross-workflow regulatory breadth
  - - Internal build / health-system digital team
    - Status quo / substitute
    - Budget comes from internal IT, clinical, and implementation spend rather than vendor list pricing
    - Large systems that want local control or bespoke workflows
    - Can tailor workflow to local processes and existing data estate
    - Slowest path where validation, privacy review, governance, and maintenance all stay with the buyer
