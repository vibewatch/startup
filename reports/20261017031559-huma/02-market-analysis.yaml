  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: Independent TAM, SAM, or segmented spend data for virtual wards, companion apps, and decentralized trials that matches Huma's exact workflow boundary.
      whyItMatters: Without a clean external sizing benchmark, deployment and ROI signals cannot be translated into a valuation-grade market model.
      diligencePath: Acquire an analyst report or buyer-budget dataset that isolates regulated remote-care software and decentralized-trial workflow spend by segment and geography.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: budget-ownership
      missingEvidence: Segment-level contract values, buyer titles, and explicit budget-owner disclosure across provider, ministry, pharma, and research sales motions.
      whyItMatters: Buyer and payer roles can be inferred from workflows, but the lack of disclosed ACVs and named budget owners limits adoption-timing and go-to-market analysis.
      diligencePath: Review customer contracts, procurement documents, or management disclosures that identify buyer titles, ACVs, and renewal structures by segment.
      relatedQuestionRefs: [QM003, QM006]
      relatedTableRefs: [TM003]
    - type: conflicting-data
