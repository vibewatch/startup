          revenue, gross margin, burn, or retention.
        - A management package with audited revenue, margin, burn, and retention could justify a tighter value range.
      - - 'Anti-thesis: financing history is not reconciled'
        - >-
          Accessible public sources disagree on cumulative funding totals, and none in the pool discloses liquidation
          preferences or secondary mix.
        - A reconciled cap table and round history would reduce dilution and overhang uncertainty.
    notes: >-
      The assigned pool offers financing markers and platform signals, but not the private-company economic detail
      needed to resolve the thesis/anti-thesis balance conclusively.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV010
      - CV011
      - CV014
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - The regulated cloud platform and research footprint convert into durable multi-product enterprise expansion.
        - >-
          The July 2024 valuation mark can be defended if deployment breadth translates into strong retention and
          margin.
        - Public sources still do not show whether usage converts into profitable recurring revenue.
        - Possible, but unproven from the assigned public evidence.
      - - Base
        - Huma remains strategically relevant and well funded, but management keeps core economics private.
        - >-
          The company deserves continued diligence attention, yet the entry case stays price-sensitive and hard to
          underwrite.
        - >-
          A later round, liquidity event, or growth slowdown could reset price expectations before economics are
          disclosed.
        - Best supported by the current source pool.
      - - Bear
        - >-
          Commercial proof lags the headline valuation and the next financing or exit window reflects weaker
          monetization than expected.
        - The public record would then read as strategic promise without enough evidence to protect the 2024 mark.
        - >-
          Funding-total discrepancies, absent cap-table terms, and workflow-fit risk increase the chance of a weaker
          next valuation step.
        - Real downside path if private diligence cannot close the operating-data gap.
    notes: >-
      These scenarios use valuation markers and diligence conditions from the assigned pool rather than a bottom-up
      financial model because the operating inputs remain undisclosed publicly.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV012
      - CV013
      - CV014
      - CV015
