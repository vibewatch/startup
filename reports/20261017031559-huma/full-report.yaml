  - id: FM001
    title: Evidence-constrained market layers
    type: pyramid
    summary: >-
      Public evidence supports six adjacent demand pools around provider operations and life-sciences workflows, but not
      a clean standalone TAM/SAM/SOM.
    data:
      items:
        - label: National and health-system virtual wards
          displayValue: ~x2 clinical capacity; 40% shorter stay; >30% lower admissions/readmissions
          note: Provider ROI is framed around capacity relief and safer at-home monitoring.
          claimRefs:
            - CM001
            - CM006
        - label: Elective backlog and peri-operative pathways
          displayValue: Cut elective backlog in half
          note: The operational use case extends Huma's wedge beyond acute monitoring alone.
          claimRefs:
            - CM001
            - CM007
        - label: Chronic and multi-condition RPM programs
          displayValue: Disease-agnostic modules across primary, community, and acute care
          note: The core layer is a regulated patient app plus clinician portal with integrations.
          claimRefs:
            - CM001
            - CM002
        - label: Pharma companion apps and therapy support
          displayValue: Major pharma collaborations
          note: The buyer shifts from provider operations into sponsor-led engagement programs.
          claimRefs:
            - CM003
            - CM010
        - label: Decentralized / hybrid clinical trials
          displayValue: 800+ studies; ~1M participants
          note: Research workflows create a second spend pool outside provider delivery budgets.
          claimRefs:
            - CM003
            - CM008
        - label: Embedded platform and SDK deployments
          displayValue: 3,000+ hospitals/clinics; SDK for customer-built apps
          note: The platform can be embedded into existing regulated software rather than sold only as one app.
          claimRefs:
            - CM008
            - CM012
    approximationNotes: >-
      This pyramid stacks adjacent demand pools and disclosed deployment signals rather than mutually exclusive market
      values because the assigned public evidence does not isolate spend pools cleanly enough for a classical
      TAM/SAM/SOM model.
    claimRefs:
