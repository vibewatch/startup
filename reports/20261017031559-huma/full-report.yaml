companyProfile:
  summary: >-
    Huma is a founder-led, late-stage private digital-health infrastructure company that sells a regulated platform for
    remote patient monitoring, hospital-at-home workflows, and adjacent clinical-research use cases. Its public record
    shows repeated strategic financing, broad deployment claims, and a product story built around reusable regulated
    infrastructure rather than a single-purpose consumer app, but the current economics remain much less transparent
    than the product and funding narrative.
