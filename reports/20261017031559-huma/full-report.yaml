  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Served market boundary
        blocks:
          - type: paragraph
            body: >-
              The clearest public definition of Huma's market starts with workflow, not with a generic
              healthcare-software bucket. Company-issued product pages describe a disease-agnostic
              remote-patient-monitoring and virtual-care stack that connects a patient app to a clinician portal,
              supports primary, community, and acute services, and integrates with EHRs via FHIR and HL7. Independent
              reporting then broadens that boundary: Huma is positioned not only as provider software for virtual wards
              and hospital-at-home programs, but also as infrastructure for companion apps and decentralized clinical
              trials serving life-sciences customers. That makes the relevant market a combination of provider
              operations spend, regulated patient-engagement software, and clinical-research workflow spend rather than
              a single catch-all "digital health" TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM012
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain an independent market report that isolates Huma's exact category, so
              the most defensible sizing approach is to preserve the public operating signals instead of inventing a
              top-down TAM. The provider side shows explicit ROI signals such as roughly doubled clinical capacity,
              shorter stays, and lower admissions/readmissions, plus patient-adoption metrics from Huma's own materials.
              The broader footprint lens comes from third-party summaries that cite thousands of provider sites, tens of
              millions of screened users, and hundreds of studies. Those signals show meaningful category breadth, but
              they do not reveal contract values, budget ownership by segment, or a public SOM that can be underwritten
              from the current evidence alone.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
