      - number: '4.2'
        title: Public traction and GTM proxies
        blocks:
          - type: paragraph
            body: >-
              Huma's public traction evidence is strongest on deployment breadth and weakest on monetization conversion.
              The 2024 company announcement claims more than 3,000 hospitals and clinics, over 35 million screened
              individuals, 1.8 million active users, 140,000 contracted respiratory RPM lives, and revenue that doubled
              year on year. A third-party July 2024 article repeats similar breadth metrics and adds over 4 million
              registered healthcare users plus more than 800 studies, which suggests meaningful installed-base reach
              across care and research. The virtual-wards page adds product-level proof points on patient helpfulness
              and claimed clinical-capacity gains. None of these proxies, however, disclose sales cycle length,
              implementation burden, retention, or payback, so they should be treated as commercial momentum indicators
              rather than sales efficiency proof.
            claimRefs:
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI009
              - CI011
      - number: '4.3'
        title: Capital raised, use of proceeds, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Huma has repeatedly needed external capital to fund expansion, and the public funding record is clear even
              if the current cash position is not. The 2021 Series C brought in about $130 million, with another $70
              million described as milestone-contingent, and management said those proceeds were earmarked for
              geographic expansion, R&D, and deeper life-sciences partnerships. The 2024 Series D added more than $80
              million and pushed total disclosed capital raised above $300 million. That scale of financing is
              consistent with a business that combines regulated software, integrations, device connectivity, global
              deployments, and possibly service-heavy delivery. It is not evidence of current cash availability: the
              materials reviewed do not disclose balance-sheet cash, burn, debt, or runway, so capital adequacy still
              depends on management disclosure rather than public-file verification.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI011
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial read-through is mixed. Huma looks more credible as regulated health-system infrastructure
              than as a pure software vendor, which helps explain why strategic investors and pharma partners
              participate in financing rounds. That said, the public evidence set is still thin where underwriting
              discipline matters most: current realized pricing, revenue mix, gross margin, implementation cost to
              serve, CAC/payback, customer concentration, renewal quality, and absolute cash runway. Independent
              commentary also notes staff cuts around the 2024 Series D and describes revenue and valuation as estimated
              or unconfirmed rather than officially disclosed. Net: funding access and deployment breadth are real
              strengths, but revenue quality, margin path, and near-term financing dependency remain open diligence
              items rather than closed investment conclusions.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulated-platform infrastructure matters more than a single app
            body: >-
              The evidence fits a platform-infrastructure model serving providers, pharma, and public-sector buyers,
              which should be analyzed more like regulated digital-health rails than like a self-serve app business.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI012
          - type: callout
            title: Fundraising history does not answer capital adequacy
            body: >-
              Huma has raised substantial capital, but the public record still does not disclose current cash, burn,
              debt, or runway, so financing dependency remains an underwriting gap.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI013
          - type: callout
            title: Treat public traction as directional until economics are disclosed
            body: >-
              Deployment breadth, users, and claimed revenue growth show momentum, but revenue quality still needs
              cohort retention, realized pricing, and margin disclosure before it can support a conviction underwriting
              case.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered workflow and commercial product surfaces
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports Huma as a workflow product rather than a single app. On the provider side,
              Huma markets virtual wards and remote monitoring that continuously collect patient data so clinicians can
              identify deterioration sooner, prioritize at-risk patients, and manage multiple therapeutic pathways from
              a unified dashboard. On the patient side, the product surface includes timelines of required tasks,
              questionnaires, education, telemedicine, and device-enabled or manual vitals capture. Multiple sources
              also place the same platform into life-sciences workflows such as decentralized trials, companion apps,
              and data collection, which matters because it broadens the addressable buyer set from health systems to
              pharma and research sponsors.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
