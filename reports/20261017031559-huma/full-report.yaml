              - CM006
              - CM008
              - CM010
              - CM012
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to at least three buyer motions. First, health systems and ministries appear to buy
              Huma for virtual wards, elective backlog management, and at-home monitoring, with clinicians and care
              teams as daily users and capacity relief as the practical trigger. Second, pharma and research
              organizations use Huma for companion apps and decentralized or hybrid trials, shifting the economic buyer
              toward R&D, medical, or therapy-support budgets. Third, the newer SDK framing suggests some customers want
              to embed Huma's capabilities into their own applications rather than adopt a single standalone app. That
              is strategically useful, but it also implies enterprise integration and compliance work matter to adoption
              timing.
            claimRefs:
              - CM003
              - CM005
              - CM010
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Constraints and open sizing questions
        blocks:
          - type: paragraph
            body: >-
              The public record is strongest on product breadth, deployments, and selected outcome claims; it is weakest
              on the commercial details required to turn those signals into a valuation-grade market model. The same
              source pool that supports Huma's category breadth also shows why diligence is not done: adoption appears
              to depend on regulated-workflow trust, EHR and data integration, and enough budget authority to fund
              multi-stakeholder care programs. Secondary datasets also disagree on core financing metrics, with Clay and
              Forge publishing materially different funding and valuation snapshots. That contradiction does not
              invalidate the business, but it means this chapter can define the market and the buyer map more
              confidently than it can size Huma's reachable revenue pool.
            claimRefs:
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The category is two-sided, not one wedge
            body: >-
              Huma looks less like a single RPM vendor and more like regulated workflow infrastructure sold into both
              provider operations and life-sciences use cases.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM010
          - type: callout
            title: Public deployment proof is stronger than public market sizing
            body: >-
              The source set shows adoption and workflow breadth, but it still lacks the segment-level contract values,
              budget ownership, and reconciled valuation data needed for a clean TAM/SAM/SOM or revenue-pool model.
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape boundaries and substitute paths
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports analysing Huma against competitor classes rather than a clean named-peer
              set. Third-party coverage consistently describes Huma as serving two buying motions at once: provider-side
              remote monitoring or virtual-ward deployments, and life-sciences or decentralized-trial workflows. That
              breadth means the competitive set is not only direct RPM vendors. It also includes trial-specific
              platforms, AI documentation tools that overlap with Hi Scribe, incumbent workflow modules inside health
              systems, and internal digital-health teams that may build a narrower stack themselves. For investors, the
              key question is therefore whether Huma wins because it replaces multiple vendors and internal projects at
              once, or whether most buyers still procure only one slice of that broader promise.
            claimRefs:
              - CP001
              - CP003
              - CP012
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: Differentiation versus point tools and adjacent rivals
        blocks:
          - type: paragraph
            body: >-
              Public material most clearly differentiates Huma on scope plus regulatory leverage. The strongest
              recurring message is that Huma combines remote monitoring, decentralized trials, clinical documentation,
              and configurable workflow tooling inside one governed platform, rather than selling only a single workflow
              app. That matters because point RPM or AI-scribe tools can attack one budget line, but they do not
              obviously replace the whole provider-plus-pharma platform position. At the same time, the same independent
              review sources warn that local validation, privacy review, and product ownership remain necessary for each
              deployment. In practice, that leaves space for incumbents and narrower specialists whenever buyers value
              local control, simpler implementation, or a single solved use case more than platform breadth.
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP010
              - CP016
