              - CP016
      - number: '3.3'
        title: Pricing, switching cost, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The pricing evidence is directionally useful but commercially incomplete. Independent review pages
              consistently describe Huma as enterprise or custom priced, and the medical-AI profile explicitly says
              buyers should verify platform, care-pathway, and implementation terms. That implies a consultative sale
              and supports the idea that Huma competes for strategic transformation budgets rather than self-serve
              software spend. Switching costs are probably real but not absolute: once Huma is integrated across
              multiple therapeutic areas, dashboards, and governance owners, replacement becomes organizationally
              heavier; yet public buyer guidance still emphasizes checking SLAs, support, data export, and deployment
              scope before committing. Distribution remains a live risk because incumbent health-system vendors may
              bundle adjacent capabilities into an installed base Huma still has to displace account by account.
            claimRefs:
              - CP004
              - CP009
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Durability verdict and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The public record supports a differentiated platform story, but not a fully underwritten moat. Huma looks
              strongest where a buyer wants one regulated surface across remote care, research, and AI-enabled
              operations, and where speed-to-launch matters more than minimizing vendor dependence. The weak point is
              that the assigned evidence remains much better at describing Huma’s architecture than proving repeatable
              commercial wins versus named competitors. There is no retained public evidence here for realized pricing,
              export friction, migration outcomes, or quantified win rates against incumbents. That makes
              commoditization and incumbent-response risk real, even if Huma’s regulatory footprint and breadth remain
              unusually strong for a digital-health vendor.
            claimRefs:
              - CP006
              - CP007
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why Huma is harder to compare than a point tool
            body: >-
              The retained evidence repeatedly presents Huma as a governed platform that spans provider workflows, trial
              workflows, and AI documentation. That cross-budget scope is the main differentiation signal in this
              chapter.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
          - type: callout
            title: Moat proof is weaker than architecture proof
            body: >-
              The assigned sources say much more about product breadth and regulatory posture than about realized
              pricing, migration pain, or repeatable named-peer wins. That keeps incumbent-response and commoditization
              risk live.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Huma appears to monetize as a regulated platform supplier rather than as a narrow single-SKU app vendor.
              The reviewed sources repeatedly place its buyer base in three groups — providers and health systems,
              life-sciences companies, and governments/public-health programs — and the monetization language points to
              subscription, per-user, and platform-enablement contracts rather than transaction take rates or consumer
              payments. The best public price point in the assigned pool is still historical Medopad-era UK pricing of
              £50-£90 per user per month under an annual SaaS license, which is directionally helpful but too stale to
              anchor present-day realized ASPs. That leaves the revenue model intelligible at a category level while
              actual contract structure, discounting, and attach-rate economics remain diligence asks.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
