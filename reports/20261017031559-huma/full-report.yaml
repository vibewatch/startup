      - number: '5.2'
        title: Architecture, integration model, and deployment pattern
        blocks:
          - type: paragraph
            body: >-
              Public technical detail is incomplete but directionally consistent. Sysmetica's partner case study
              describes native patient apps, an Angular clinician portal, and Python services and APIs behind remote
              patient monitoring, while 2024 coverage of Huma Cloud Platform adds a no-code configuration layer, SDK
              access, APIs, flexible hosting, device connectivity, and AI/ML model hosting. Fierce Biotech's reporting
              on a June 2023 FDA clearance for integrations with regulated devices suggests the architecture is not just
              generic care-management software; it is intended to connect with regulated tooling across disease
              programs. Together that implies an operating model built to reuse a common platform across multiple care
              and research programs rather than bespoke one-off deployments.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
