          note: Companion apps, decentralized trials, and research programs.
        - id: public-sector
          label: Governments & public health
          note: Screening and population-engagement deployments.
        - id: platform
          label: Regulated platform base
          note: One cleared platform with cloud configuration, device connectivity, and SDK access.
        - id: monetization
          label: Contracted software revenue
          note: Subscription, per-user, and enablement contracts; public list pricing is mostly undisclosed.
        - id: gross-profit
