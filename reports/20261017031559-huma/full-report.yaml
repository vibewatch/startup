  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Evidence-backed ordinal map of workflow breadth versus deployment leverage from the assigned public sources.
    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
        low: Single workflow
        high: Multi-surface platform
        description: Evidence-backed ordinal scoring from assigned public sources, not market-share data.
        scale: ordinal
      yAxis:
        label: Deployment leverage
        min: 1
        max: 5
        low: Buyer must build/validate more locally
        high: Prebuilt regulated/governed surface
        description: Higher scores indicate faster launch and more reusable governed infrastructure in the retained evidence.
        scale: ordinal
      points:
        - label: Huma
          x: 5
          'y': 5
          note: Broadest retained public scope plus strongest evidence of reusable regulatory/governance leverage.
        - label: Point RPM vendor class
          x: 2
          'y': 4
          note: Direct overlap for monitoring workflows, but narrower than Huma’s cross-workflow platform positioning.
        - label: AI documentation point-solution class
          x: 1
          'y': 4
          note: Competes with Hi Scribe on one workflow rather than replacing Huma’s full platform story.
        - label: Decentralized-trial platform class
          x: 2
          'y': 3
          note: Directly relevant for pharma workflows, but weaker overlap with provider-care delivery in retained evidence.
        - label: Incumbent EHR/workflow module class
          x: 3
          'y': 4
          note: Installed-base distribution can be strong even if retained evidence does not show Huma-like breadth.
        - label: Internal build/custom stack
          x: 4
          'y': 1
          note: Custom breadth is possible, but the buyer keeps the heaviest validation, governance, and maintenance burden.
    approximationNotes: >-
      Ordinal coordinates summarize comparative breadth and deployment leverage from the assigned public evidence; they
      are not measured market-share or satisfaction scores.
    claimRefs:
      - CP002
      - CP008
      - CP010
      - CP015
      - CP016
