  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests Huma often lands through a regulated care workflow, then expands toward broader platform
      usage, but the renewal loop remains weakly disclosed.
    data:
      items:
        - label: Health system, ministry, or sponsor identifies a workflow gap
          actor: Buyer
          phase: Entry
          tone: neutral
          touchpoints:
            - Virtual ward or remote-monitoring need
            - Clinical-trial or patient-support workflow
          note: Public sources show institutional buyers rather than consumer self-serve demand.
        - label: Huma configures a regulated workflow with clinician involvement
          actor: Implementation
          phase: Deployment
          tone: neutral
          touchpoints:
            - Co-created with clinicians
            - Regulatory and integration stack
          note: >-
            Official and company-issued sources stress modular, regulated deployment rather than a lightweight plug-in
            tool.
        - label: Patients are onboarded into app, device, or pathway monitoring
          actor: Patient and care team
          phase: Go-live
          tone: positive
          touchpoints:
