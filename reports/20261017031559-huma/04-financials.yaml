      - ["Government / public-health deployments", "Population screening and engagement programs on the same regulated platform", "Program contract", "Publicly cited as a buyer group; scale evidence exists but contract economics do not", "Useful for breadth, but revenue durability and procurement concentration are unclear", "Request government contract list, renewal cadence, and receivables profile"]
      - ["Platform / SDK enablement", "Cloud platform and SDK access layered onto the regulated base platform", "Subscription / enablement fee", "Launched in 2024; no public rate card in assigned evidence", "Potentially higher-margin software layer, but public monetization detail is minimal", "Request current product packaging, list price, attach rate, and realized ASP by buyer type"]
    notes: "Rows summarize public revenue mechanisms; null-equivalent unknowns remain explicit because the assigned pool does not disclose realized pricing or stream-level revenue mix."
    claimRefs: [CI001, CI002, CI007, CI008, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Public price evidence
      - Pricing basis
      - Known caveat
      - Source
    rows:
      - ["Medopad-era UK software license", "£50-£90 per user per month", "Annual SaaS license fee", "Historical 2014-era evidence; not a current Huma quote", "Wikipedia citing New Scientist"]
      - ["Current regulated platform contracts", "No current public list price in assigned pool", "Subscription and per-user pricing are described, but realized terms are undisclosed", "Useful for model shape only, not underwriting ASP", "YesPress dossier"]
      - ["Huma Cloud Platform / SDK enablement", "No public rate card", "Platform-enablement / software contract", "Launch and product details are public, but commercial packaging is not", "Huma Series D announcement"]
    notes: "This table separates historical list-price evidence from current monetization descriptions; the assigned pool does not provide present-day realized pricing or discount waterfalls."
    claimRefs: [CI002, CI003, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value/status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue growth", "Company says revenue doubled year on year in 2024", "Medium", "Signals commercial momentum, but not absolute scale or margin quality", "Request monthly revenue bridge and audited FY2024/FY2025 revenue"]
      - ["Profitability path", "Company targeted profitability in 2024 announcement", "Low-Medium", "Shows management intent, not realized earnings quality", "Request EBITDA / operating-margin actuals and bridge to target"]
      - ["Delivery leverage proxy", "Virtual-wards page claims 99.7% helpfulness, doubled clinical capacity, and halved backlog", "Medium", "Suggests buyer ROI and potential GTM efficiency", "Request deployment-level ROI studies with sales-cycle and retention data"]
      - ["Gross margin", null, "Low", "Key to judging whether Huma behaves like software, services, or a blended care-operations business", "Request gross margin by product line plus hosting, device, and clinician-support costs"]
      - ["CAC / payback", null, "Low", "Needed to underwrite efficient growth and channel scalability", "Request fully loaded CAC, implementation cost, and payback by buyer segment"]
      - ["Cash burn / runway", null, "Low", "Required to judge financing dependency despite repeated fundraising access", "Request cash balance, monthly burn, runway, and debt covenants"]
    notes: "Null values indicate metrics not disclosed in the assigned public evidence, not zero performance."
    claimRefs: [CI007, CI009, CI011]
figures:
  - id: FI001
    title: Revenue model bridge from deployments to gross profit
    type: flow
    summary: >-
      Public evidence points to one regulated platform monetized across several buyer groups, with
      gross-profit realization depending on how much services, device connectivity, and clinical
      support sit around the software layer.
    data:
      nodes:
        - id: providers
          label: Providers & health systems
          note: Virtual wards, remote monitoring, elective-backlog workflows.
        - id: pharma
          label: Pharma & life sciences
          note: Companion apps, decentralized trials, and research programs.
        - id: public-sector
          label: Governments & public health
          note: Screening and population-engagement deployments.
        - id: platform
          label: Regulated platform base
          note: One cleared platform with cloud configuration, device connectivity, and SDK access.
        - id: monetization
          label: Contracted software revenue
          note: Subscription, per-user, and enablement contracts; public list pricing is mostly undisclosed.
        - id: gross-profit
          label: Gross-profit sensitivity
          note: Margin depends on software mix versus integrations, devices, and outsourced clinician support.
      edges:
        - from: providers
          to: platform
          label: deploy on
        - from: pharma
          to: platform
          label: deploy on
        - from: public-sector
          to: platform
          label: deploy on
        - from: platform
          to: monetization
          label: licenses + enablement
        - from: monetization
          to: gross-profit
          label: realized margin depends on mix
    claimRefs: [CI001, CI002, CI012]
callouts:
  - calloutType: insight
    title: Regulated-platform infrastructure matters more than a single app
    body: >-
      The evidence fits a platform-infrastructure model serving providers, pharma, and public-sector
      buyers, which should be analyzed more like regulated digital-health rails than like a
      self-serve app business.
    claimRefs: [CI001, CI002, CI012]
  - calloutType: risk
    title: Fundraising history does not answer capital adequacy
    body: >-
      Huma has raised substantial capital, but the public record still does not disclose current cash,
      burn, debt, or runway, so financing dependency remains an underwriting gap.
    claimRefs: [CI004, CI005, CI011, CI013]
  - calloutType: recommendation
    title: Treat public traction as directional until economics are disclosed
    body: >-
      Deployment breadth, users, and claimed revenue growth show momentum, but revenue quality still
      needs cohort retention, realized pricing, and margin disclosure before it can support a
      conviction underwriting case.
    claimRefs: [CI007, CI008, CI009, CI011]
