schemaVersion: "report-v2"
artifact: financials
slug: huma
runDate: 2026-10-17
company:
  name: Huma
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports Huma as a regulated B2B digital-health infrastructure business with
    multiple buyer groups, repeated financing access, and credible top-line activity indicators, but
    it does not provide enough current disclosure on realized pricing, gross margin, CAC/payback,
    burn, or runway to underwrite revenue quality or capital adequacy with confidence. The strongest
    confirmed funding datapoints are the 2021 $130 million Series C with a further contingent $70
    million commitment and the 2024 Series D taking total capital raised above $300 million.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Huma appears to monetize as a regulated platform supplier rather than as a narrow single-SKU
      app vendor. The reviewed sources repeatedly place its buyer base in three groups — providers
      and health systems, life-sciences companies, and governments/public-health programs — and the
      monetization language points to subscription, per-user, and platform-enablement contracts
      rather than transaction take rates or consumer payments. The best public price point in the
      assigned pool is still historical Medopad-era UK pricing of £50-£90 per user per month under
      an annual SaaS license, which is directionally helpful but too stale to anchor present-day
      realized ASPs. That leaves the revenue model intelligible at a category level while actual
      contract structure, discounting, and attach-rate economics remain diligence asks.
    claimRefs: [CI001, CI002, CI003, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-gtm
    title: Public traction and GTM proxies
    body: >-
      Huma's public traction evidence is strongest on deployment breadth and weakest on monetization
      conversion. The 2024 company announcement claims more than 3,000 hospitals and clinics, over
      35 million screened individuals, 1.8 million active users, 140,000 contracted respiratory RPM
      lives, and revenue that doubled year on year. A third-party July 2024 article repeats similar
      breadth metrics and adds over 4 million registered healthcare users plus more than 800 studies,
      which suggests meaningful installed-base reach across care and research. The virtual-wards page
      adds product-level proof points on patient helpfulness and claimed clinical-capacity gains.
      None of these proxies, however, disclose sales cycle length, implementation burden, retention,
      or payback, so they should be treated as commercial momentum indicators rather than sales
      efficiency proof.
    claimRefs: [CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: capital-needs
    title: Capital raised, use of proceeds, and capital intensity
    body: >-
      Huma has repeatedly needed external capital to fund expansion, and the public funding record is
      clear even if the current cash position is not. The 2021 Series C brought in about $130
      million, with another $70 million described as milestone-contingent, and management said those
      proceeds were earmarked for geographic expansion, R&D, and deeper life-sciences partnerships.
      The 2024 Series D added more than $80 million and pushed total disclosed capital raised above
      $300 million. That scale of financing is consistent with a business that combines regulated
      software, integrations, device connectivity, global deployments, and possibly service-heavy
      delivery. It is not evidence of current cash availability: the materials reviewed do not
      disclose balance-sheet cash, burn, debt, or runway, so capital adequacy still depends on
      management disclosure rather than public-file verification.
    claimRefs: [CI004, CI005, CI006, CI011, CI013]
  - id: verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial read-through is mixed. Huma looks more credible as regulated health-system
      infrastructure than as a pure software vendor, which helps explain why strategic investors and
      pharma partners participate in financing rounds. That said, the public evidence set is still
      thin where underwriting discipline matters most: current realized pricing, revenue mix, gross
      margin, implementation cost to serve, CAC/payback, customer concentration, renewal quality,
      and absolute cash runway. Independent commentary also notes staff cuts around the 2024 Series D
      and describes revenue and valuation as estimated or unconfirmed rather than officially
      disclosed. Net: funding access and deployment breadth are real strengths, but revenue quality,
      margin path, and near-term financing dependency remain open diligence items rather than closed
      investment conclusions.
    claimRefs: [CI010, CI011, CI012, CI013]
