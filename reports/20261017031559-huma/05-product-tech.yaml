    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Monitor at-risk patients between visits, Clinicians need near-real-time data and escalation signals outside hospital walls, Virtual-ward and RPM programs feed continuous patient data into a unified care workflow, Earlier issue detection and better care-plan adherence are repeatedly claimed, Public evidence does not provide independently audited intervention-to-outcome conversion rates]
      - [Manage peri-operative or waiting-list pathways, Providers need scalable follow-up without expanding physical capacity, Modular programs coordinate remote monitoring outreach and clinician review, Company materials claim higher capacity and lower backlog pressure, Program-level economics and control-group methodology are not public]
      - [Keep patients engaged in home-based care, Patients need reminders education questionnaires telemedicine and simple vitals capture, Native apps combine timeline tasks education telemedicine and device/manual inputs, Official materials cite 99.7 percent helpfulness among patients, No public retention or sustained-engagement denominator is provided]
      - [Launch disease-specific digital programs quickly, Health systems and partners need configurable regulated tooling instead of rebuilding infrastructure, Cloud Platform offers no-code configuration pre-built modules APIs and device connectivity, Coverage says launch time can drop from years to days, The retained pool does not verify current customer pricing or implementation SLAs]
      - [Run decentralized research and companion apps, Pharma and research teams need patient data collection outside traditional sites, Huma extends the same modular platform into trials studies and therapy support, Product reuse across care and research can raise switching costs, Named production deployments and sponsor renewal data are sparse]
    notes: Benefits are preserved as attributed source claims; unsupported denominator and control details remain diligence asks.
    claimRefs: [CE001, CE002, CE004, CE006, CE007, CE012, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Patient apps, Capture tasks questionnaires telemedicine and vital signs for home-based care, Native iOS and Android delivery plus device and mobile-OS compatibility, Public release cadence and supported-device matrix are not disclosed]
      - [Clinician portal, Give care teams dashboards cohort management and notes review in the browser, Angular web frontend and workflow/identity integration, No retained source proves access-control design audit logging or escalation logic]
      - [Backend and APIs, Power national-scale remote monitoring data services and platform logic, Python services APIs and cloud hosting, No public uptime SLA or incident-history evidence is retained]
      - [Device and integration layer, Connect regulated tools wearables inhalers and companion apps into care workflows, FDA-cleared integration surface plus SDK/API capabilities, Device list certification scope and partner-responsibility boundaries are incomplete]
      - [Configuration and AI layer, Reuse modules to launch disease-specific programs and host algorithms, No-code Cloud Platform plus AI/ML hosting marketplace and flexible hosting, Public evidence is thin on model-governance guardrails and pricing]
      - [QA and regulatory foundation, Support regulated releases and quality discipline, QA automation medical-grade testing and regulatory status claims, Current public security privacy and trust artifacts are missing from the retained pool]
    notes: This architecture is reconstructed from retained public evidence and should be confirmed against current product, security, and implementation documentation.
    claimRefs: [CE003, CE006, CE007, CE008, CE011, CE014]
