  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer-signal evidence such as active repositories package downloads SDK forum traffic or practitioner-community usage tied to Huma's current platform.
      whyItMatters: Developer adoption would help verify whether Huma's SDK and integration story is externally used or mostly marketing-led.
      diligencePath: Request current SDK documentation distribution metrics repository access or partner integration references that show real third-party technical usage.
      relatedQuestionRefs: [QE004]
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Current public security privacy certification uptime or incident-response documentation for the platform.
      whyItMatters: Investors in regulated digital health need proof of operational assurance beyond regulatory-product claims and marketing pages.
      diligencePath: Ask for a security whitepaper trust center certification list DPA summary pen-test cadence and historical uptime or incident metrics.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: delivery-ownership
      missingEvidence: Internal versus outsourced engineering ownership release governance and service-level evidence for the core product stack.
      whyItMatters: Long-running partner staffing can speed delivery but may also concentrate technical knowledge outside the company.
      diligencePath: Request an engineering org chart vendor-scope breakdown release cadence incident metrics and transition plans for any partner-owned modules.
      relatedQuestionRefs: [QE008]
