callouts:
  - calloutType: strength
    title: Configurable platform breadth is the core product strength
    body: >-
      Huma appears to have moved beyond a single remote-monitoring app into a
      configurable platform that serves provider workflows, patient engagement,
      and life-sciences programs from a common technical base.
    claimRefs: [CE001, CE002, CE006, CE007]
  - calloutType: risk
    title: Public assurance is weaker than product breadth
    body: >-
      The retained evidence is credible on product scope and regulated intent,
      but it does not give outside investors enough direct proof on developer
      adoption, security controls, uptime, or how dependent delivery remains on
      a long-running external engineering partner.
    claimRefs: [CE011, CE014, CE015]
