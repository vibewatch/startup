      - [Life-sciences trial and companion-app workflows, Pharma and research teams, Established since at least 2021 financing materials and later coverage, Same platform spans decentralized trials studies and post-launch patient support, Need named current sponsors module boundaries and renewal proof]
      - [Huma Cloud Platform, External digital-health builders partners and pharma programs, Launched in 2024 and positioned as a customer-facing build layer, No-code regulated configuration plus SDK APIs AI/ML hosting and device connectivity, Need GA scope pricing and current customer count]
    notes: Public sources show real product breadth, but most maturity claims remain company-anchored rather than audited program metrics.
    claimRefs: [CE001, CE002, CE004, CE005, CE006, CE007, CE009]
