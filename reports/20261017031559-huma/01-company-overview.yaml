    columns: [Stakeholder, Role, Control or economic importance, Evidence-backed rationale, Diligence ask]
    rows:
      - ["Leaps by Bayer", "Lead and repeat strategic investor", "Co-led the 2021 Series C and is still named in 2024 financing coverage.", "Signals continuing pharma-backed conviction in Huma's care-and-research platform thesis.", "Confirm current ownership, pro rata rights, and any commercial side letters."]
      - ["Hitachi Ventures / HV Fund", "Lead and repeat investor", "Co-led the 2021 Series C and remains named in 2024 coverage through HV Fund.", "Suggests sustained strategic support for geographic and enterprise expansion.", "Confirm stake size, board rights, and any Asia go-to-market obligations."]
      - ["AstraZeneca", "Strategic investor", "Named as a participant in the 2024 Series D coverage.", "Strengthens Huma's life-sciences credibility if the investment ties to research workflows.", "Clarify whether AstraZeneca is purely a shareholder, a customer, or both."]
      - ["Samsung Next", "Strategic shareholder", "Named in the 2021 financing release and quoted around biomarker ecosystem potential.", "Extends Huma's reach into device and consumer-health adjacency.", "Check follow-on participation and whether any product integration rights exist."]
      - ["HAT / HAT Sicaf", "Repeat financial investor", "Appears in both 2021 and 2024 financing materials under related fund vehicles.", "Repeat participation indicates continued support through multiple rounds.", "Verify fund vehicle, ownership concentration, and exit expectations."]
      - ["Goldman Sachs, HSBC, and Nomura", "Capital-markets advisors / placement agents", "Official 2021 materials list Goldman Sachs as lead placement agent with HSBC and Nomura as joint placement agents.", "Shows Huma used institutional financing infrastructure as rounds scaled.", "Confirm whether any of these firms also hold equity, warrants, or debt exposure."]
    notes: Roles and economic importance are inferred from financing-announcement language; exact ownership, governance rights, and structured terms remain undisclosed.
    enumerationScope:
      coverage: partial
      basis: Named financing counterparties and investors appearing in retained 2021 and 2024 funding materials.
    claimRefs: [CO006, CO007, CO010, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: The retained evidence supports a clear sequence from Medopad-era founding to rebrand, expansion financing, regulatory milestone, and 2024 cloud-platform launch.
    data:
      items:
        - date: "2011"
          label: Founded as Medopad
          detail: BAE HQ says Dan Vahdat founded the company in 2011 before the later rebrand to Huma.
          tone: positive
          claimRefs: [CO004]
        - date: "2020"
          label: Rebranded to Huma
          detail: BAE HQ says the company rebranded from Medopad to Huma as it broadened from a narrower data-collection tool toward remote care and clinical research.
          tone: neutral
          claimRefs: [CO004]
        - date: "2021-04"
          label: Board expansion disclosed
          detail: Official 2021 funding materials say Claudia Suessmuth Dyckerhoff joined Huma's board in April 2021.
          tone: positive
          claimRefs: [CO008]
        - date: "2021-05-12"
          label: Series C completed
          detail: PRNewswire says Huma completed approximately $130 million of Series C financing led by Leaps by Bayer and Hitachi Ventures.
          tone: positive
          claimRefs: [CO006]
        - date: "2021-05-12"
          label: Contingent capital disclosed
          detail: The same 2021 financing announcement says an additional $70 million commitment could be exercised later, taking total financing above $200 million.
          tone: positive
          claimRefs: [CO007]
        - date: "2021"
          label: Leadership bench broadened
          detail: Official 2021 materials say Huma was adding specialist leaders across technology, AI, legal, healthcare, life sciences, and corporate affairs.
          tone: positive
          claimRefs: [CO009]
        - date: "2023"
          label: Disease-agnostic regulatory milestone
          detail: 2024 reporting says Huma's platform had become the first configurable disease-agnostic FDA Class II, EU MDR Class IIb, and Saudi FDA Class C platform.
          tone: positive
          claimRefs: [CO014]
        - date: "2024-07-22"
          label: Series D and Huma Cloud Platform
          detail: 2024 coverage reports more than $80 million of Series D financing, total funding above $300 million, and launch of Huma Cloud Platform.
          tone: positive
          claimRefs: [CO010, CO011]
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO010, CO011, CO014]
callouts:
  - calloutType: insight
    title: Huma looks more like regulated infrastructure than a single app company
    body: The official product surfaces and repeated financing narratives consistently position Huma as reusable healthcare infrastructure spanning providers and life sciences, which is strategically broader than a point-solution remote-monitoring vendor.
    claimRefs: [CO001, CO002, CO003, CO006, CO011]
  - calloutType: risk
    title: Public economics and control terms remain materially under-disclosed
    body: Huma's identity and financing chronology are reasonably well supported, but current revenue, margin, cap-table, and valuation evidence still depends on secondary or compiled sources rather than primary disclosures.
    claimRefs: [CO010, CO015, CO016]
