company:
  name: Huma
chapter:
  number: 1
  title: Company Overview
  summary: Huma still presents as a founder-led, late-stage private digital-health infrastructure company whose strongest public evidence centers on regulated remote-monitoring software and repeated strategic financings. Retained evidence supports a 2011 founding, a 2020 rebrand from Medopad, approximately $130 million of Series C financing in 2021, more than $80 million of Series D financing in 2024, and broad reported deployment metrics, but revenue, exact headcount, and a primary-source current valuation remain thinly disclosed.
sections:
  - id: identity-and-product
    title: Identity, product scope, and baseline positioning
    body: >-
      Huma's current official surfaces frame the company as infrastructure for
      regulated digital health rather than as a single-purpose patient app. The
      homepage describes the Huma Operating System as an AI foundation for
      regulated industries, while product pages emphasize virtual wards, remote
      monitoring, and hospital-at-home workflows. Third-party coverage also
      places the company in London and traces its evolution from Medopad to
      Huma, which matters because later chapters can reuse the same identity
      baseline instead of guessing whether Huma is primarily a provider
      workflow company, a research-enablement company, or an AI platform
      vendor. The available evidence supports a late-stage private
      digital-health platform identity, but not a revenue-scale identity.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Public evidence still looks concentrated around founder and CEO Dan
      Vahdat, with relatively little independently reported depth on the
      current executive bench beyond financing announcements. The retained 2021
      official funding materials identify Alan Milburn as board chairman and
      say Claudia Suessmuth Dyckerhoff joined the board in April 2021, while
      also stating that Huma was adding leadership across technology, AI,
      legal, healthcare, life sciences, and corporate affairs. That
      combination suggests Huma had already recognized the need to
      professionalize around growth and regulated-market complexity, but the
      retained pool does not independently document today's full management
      roster, board committees, or ownership-linked control rights. The
      underwriting implication is a still-material founder and disclosure
      concentration risk.
    claimRefs: [CO004, CO008, CO009, CO016]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding history and stakeholder map
    body: >-
      Huma's funding narrative is better evidenced than its economics.
      Official 2021 materials consistently support an approximately $130
      million Series C led by Leaps by Bayer and Hitachi Ventures, plus a
      further $70 million commitment that could take cumulative financing above
      $200 million. Independent 2024 coverage then reports more than $80
      million of Series D financing and total funding above $300 million. The
      investor mix is strategically meaningful because it combines pharma,
      industrial, consumer-tech, and crossover capital, which fits Huma's
      positioning across providers, public health systems, and life sciences.
      What remains opaque are the terms that matter most for downside
      protection: cap-table concentration, board rights, secondaries, debt,
      and liquidation preferences.
    claimRefs: [CO006, CO007, CO010, CO015, CO016]
    tableRefs: [TO003]
  - id: milestones-scale-and-open-questions
    title: Milestones, scale signals, and unresolved baseline questions
    body: >-
      The retained evidence supports a usable milestone spine from founding
      through rebrand, expansion financing, regulatory positioning, and the
      2024 launch of Huma Cloud Platform. Scale signals are also directionally
      strong: two 2024 articles report more than 3,000 hospitals and clinics
      and more than 35 million screened individuals. Even so, the public
      baseline is not clean enough to treat all headline metrics as directly
      comparable or current. Tech Funding News reports 4 million registered
      users, while Health Tech World reports 1.8 million active users across
      products in more than 70 countries, which indicates breadth but not a
      single canonical user metric. The same pattern applies to valuation and
      economics, where public evidence is still more promotional than
      underwritable.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
