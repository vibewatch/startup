  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cap-table-overhang
      missingEvidence: >-
        Post-money ownership, liquidation preferences, secondary-vs-primary mix, option-pool size,
        and any debt or project-finance obligations tied to the latest rounds.
      whyItMatters: >-
        These terms determine whether the public valuation marker translates into an investable
        common-equity entry point or hides substantial downside asymmetry.
      diligencePath: >-
        Obtain the latest cap table, round term sheet summaries, debt schedule, and any investor
        side-letter disclosures directly from management.
      relatedQuestionRefs: [QV003]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Verified revenue, gross margin, burn, net retention, customer concentration, and cohort
        expansion data for the care-delivery and life-sciences businesses.
      whyItMatters: >-
        Deployment breadth can support a premium only if it converts into durable, profitable, or
        clearly scaling recurring economics.
      diligencePath: >-
