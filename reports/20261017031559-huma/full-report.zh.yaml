            body: >
              指定材料池支持的是双边商业图景，而非单一同质客户群。Huma 的虚拟病房和远程监测材料中出现了公共卫生与医疗服务方部署；公司发布和独立报道也将 Huma
              放入制药和临床研究流程。买方往往是机构——医疗系统、卫生部门、医疗服务集团、支付方或制药赞助方——而日常用户更常是临床医生、护理团队运营者、研究团队或实施负责人。2024 年平台发布报道还显示，Huma
              试图增加第三条路径：向希望在 Huma 的监管和集成技术栈上构建自有应用的组织销售受监管平台基础设施和 SDK 访问。


