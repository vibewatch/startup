chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与基本定位
        blocks:
          - type: paragraph
            body: >-
              Huma 当前的官方页面将公司定位为受监管数字医疗的基础设施，而非单一用途的患者应用。首页将 Huma Operating System 描述为受监管行业的 AI
              基础，产品页面则强调虚拟病房、远程监测和医院居家护理流程。第三方报道还将公司置于伦敦，并追溯其从 Medopad 更名为 Huma 的演变。这一点很重要，因为后续章节可以沿用同一身份基线，而不必猜测 Huma
              究竟主要是医疗服务流程公司、研究赋能公司，还是 AI 平台供应商。现有证据支持其作为后期私营数字医疗平台的身份，但不足以确认其收入规模身份。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO010
              - CO012
              - CO013
              - CO015
      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据仍主要集中在创始人兼 CEO Dan Vahdat 身上；除了融资公告，对当前高管团队的独立报道相对有限。保留的 2021 年官方融资材料确认 Alan Milburn 为董事会主席，并称 Claudia
              Suessmuth Dyckerhoff 于 2021 年 4 月加入董事会；材料还表示 Huma 正在补充技术、AI、法律、医疗、生命科学和公司事务领域的领导层。这说明 Huma
              已意识到需要围绕增长和受监管市场的复杂性实现专业化，但现有材料无法独立证明今日完整的管理层名单、董事会委员会或与持股相关的控制权。对投资判断而言，创始人依赖和披露集中风险仍然显著。
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO016
      - number: '1.3'
        title: 融资历史与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Huma 的融资叙事比其经济数据更有证据支撑。2021 年官方材料一致支持约 1.3 亿美元的 C 轮融资，由 Leaps by Bayer 和 Hitachi Ventures 领投；另有 7,000
              万美元追加承诺，可能使累计融资超过 2 亿美元。独立的 2024 年报道随后称 D 轮融资超过 8,000 万美元，总融资超过 3 亿美元。投资人组合具有战略意义，兼具制药、工业、消费科技和跨界资本，符合
              Huma 服务医疗服务提供方、公共卫生系统和生命科学客户的定位。仍不透明的是最影响下行保护的条款：股权集中度、董事会权利、老股出售、债务和清算优先权。
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO016
      - number: '1.4'
        title: 里程碑、规模信号与未解的基线问题
        blocks:
          - type: paragraph
            body: >-
              保留证据支持一条可用的里程碑脉络：从成立、更名、扩张融资、监管定位，到 2024 年推出 Huma Cloud Platform。规模信号也总体强劲：两篇 2024 年文章报告称，公司覆盖超过 3,000
              家医院和诊所，筛查人数超过 3,500 万。不过，公开基线仍不够干净，不能把所有头条指标视为可直接比较或仍然有效。Tech Funding News 报告 400 万注册用户，而 Health Tech
              World 报告称产品在 70 多个国家拥有 180 万活跃用户；这些数字说明覆盖面广，却没有给出一个统一的用户口径。估值和经济数据也遵循同一模式：公开证据仍更像宣传材料，而非可用于投资判断的数据。
            claimRefs:
