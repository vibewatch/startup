  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议从真实的平台证据和融资支持出发，最终受缺失经济数据披露的限制作出估值判断。
    data:
      nodes:
        - id: product
          label: 受监管平台证据
          value: Governed AI embedded in the Huma Cloud Platform
          note: 官方产品资料将 AI 定义为医疗交付和研究的能力层。
        - id: adoption
          label: 采用信号
          value: 3,000+ hospitals / 35M+ screened / 4M registered
          note: 2024 年第三方报道显示部署规模和研究参与度均已扩大。
        - id: financing
          label: 融资支持
          value: 2021 Series C; 2024 Series D
          note: 公开来源显示投资者仍可持续进入，且存在 2024 年 7 月估值标记。
        - id: opacity
          label: 投资判断不透明
          value: No public revenue, margin, burn, retention, or cap-table terms
          note: 公开记录没有披露足以严格支撑入场价格的必要输入。
        - id: scenarios
          label: 情景区间保持宽泛
          value: Bull exists, base dominates, bear is plausible
          note: 平台质量比变现质量更容易证明。
        - id: decision
          label: 建议
          value: Track / high risk / stretched
          note: 只有在管理层尽调补齐估值关键缺口后，才应上调判断。
      edges:
        - from: product
          to: adoption
        - from: adoption
          to: financing
        - from: financing
          to: opacity
        - from: opacity
          to: scenarios
        - from: scenarios
          to: decision
    approximationNotes: 这是决策链，而非加权评分模型；它保留原有顺序，不代表步骤之间存在量化转化率。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV010
      - CV012
      - CV015
