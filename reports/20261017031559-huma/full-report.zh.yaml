  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据表明，Huma 往往先从受监管医疗工作流切入，再扩展到更广泛的平台使用，但续约闭环披露仍很有限。
    data:
      items:
        - label: 医疗系统、卫生部或申办方发现工作流缺口
          actor: 买方
          phase: 切入
          tone: neutral
          touchpoints:
            - 虚拟病房或远程监测需求
            - 临床试验或患者支持工作流
          note: 公开来源显示买方是机构，而非消费者自助需求。
        - label: Huma 在临床医生参与下配置受监管工作流
          actor: 实施
          phase: 部署
          tone: neutral
          touchpoints:
            - 与临床医生共同设计
            - 监管与集成技术栈
          note: 官方及公司发布的来源强调模块化、受监管部署，而非轻量级插件工具。
        - label: 患者加入应用、设备或路径监测
          actor: 患者与医疗团队
          phase: 上线
          tone: positive
          touchpoints:
            - 远程监测与参与
            - 患者依从性和可用性声明
          note: Huma 公开材料对成果的表述在这一环节最有力。
        - label: 临床医生复核提醒、仪表盘和文档输出
          actor: 临床用户
          phase: 运营使用
          tone: positive
          touchpoints:
            - 近实时数据采集
            - 临床仪表盘和工作流工具
          note: 运营价值在于释放容量、排定优先级、减轻行政负担。
        - label: 客户账户扩展到相邻路径、地区或研究用例
          actor: 账户扩张
          phase: 扩张
          tone: neutral
          touchpoints:
            - 各国政府和大型制药公司
            - 额外治疗领域和研究
          note: 已点名的合作关系暗示扩张潜力，但公开来源没有量化客户钱包份额或续约深度。
        - label: 部分客户可能升级使用 Huma Cloud Platform 和 SDK
          actor: 平台客户
          phase: 平台推进
          tone: neutral
          touchpoints:
            - SDK 访问
            - 无代码配置和 API
          note: 2024 年报道暗示更广泛的平台销售动作，但客户转化数据仍很少。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU010
      - CU015
      - CU016
