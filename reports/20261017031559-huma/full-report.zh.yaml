  - id: FM001
    title: 受证据约束的市场层次
    type: pyramid
    summary: 公开证据支持围绕医疗服务方运营和生命科学工作流的六个相邻需求池，但不足以形成干净、独立的 TAM/SAM/SOM。
    data:
      items:
        - label: 全国及医疗系统虚拟病房
          displayValue: ~x2 clinical capacity; 40% shorter stay; >30% lower admissions/readmissions
          note: 医疗服务方 ROI 体现在释放容量，以及让居家监测更安全。
          claimRefs:
            - CM001
            - CM006
        - label: 选择性医疗积压与围手术期路径
          displayValue: Cut elective backlog in half
          note: 这一运营用例把 Huma 的切入点从急性监测扩展出去。
          claimRefs:
            - CM001
            - CM007
        - label: 慢性病与多病种 RPM 项目
          displayValue: Disease-agnostic modules across primary, community, and acute care
          note: 核心层是受监管的患者应用，加上带集成功能的临床医生门户。
          claimRefs:
            - CM001
            - CM002
        - label: 制药伴随应用与治疗支持
          displayValue: Major pharma collaborations
          note: 买方从医疗服务方运营转向由申办方主导的患者参与项目。
          claimRefs:
            - CM003
            - CM010
        - label: 去中心化 / 混合临床试验
          displayValue: 800+ studies; ~1M participants
          note: 研究工作流在医疗服务方交付预算之外形成第二个支出池。
          claimRefs:
            - CM003
            - CM008
        - label: 嵌入式平台与 SDK 部署
          displayValue: 3,000+ hospitals/clinics; SDK for customer-built apps
          note: 平台可以嵌入现有受监管软件，而不只是作为单一应用销售。
          claimRefs:
            - CM008
            - CM012
    approximationNotes: 由于已分配的公开证据无法清楚拆分支出池，这一金字塔堆叠的是相邻需求池和已披露的部署信号，而不是互斥的市场价值，因而不构成传统 TAM/SAM/SOM 模型。
    claimRefs:
