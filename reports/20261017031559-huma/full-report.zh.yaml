  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 受监管的云平台和研究覆盖面转化为持久的多产品企业扩张。
        - 如果部署广度转化为强劲留存和利润率，2024 年 7 月的估值标记就有可能守住。
        - 公开来源仍未显示使用量能否转化为盈利性经常性收入。
        - 存在可能，但已分配的公开证据尚未证明。
      - - 基准
        - Huma 仍具战略相关性且资金充足，但管理层继续将核心经济数据保密。
        - 公司值得继续尽调，但入场逻辑对价格仍很敏感，也难以据此作投资判断。
        - 在经济数据披露前，后续融资、流动性事件或增速放缓都可能重置价格预期。
        - 当前资料池对这一情景的支持最充分。
      - - 悲观
        - 商业化证据落后于标题估值，下一轮融资或退出窗口反映出弱于预期的变现能力。
        - 这样一来，公开记录只剩战略前景，却没有足够证据支撑 2024 年的估值标记。
        - 融资总额不一致、缺失的股权表条款和工作流适配风险，都增加下一次估值走弱的可能。
        - 如果私下尽调无法补齐经营数据缺口，这就是现实的下行路径。
    notes: 这些情景使用已分配资料池中的估值节点和尽调条件，而不是自下而上的财务模型，因为经营输入仍未公开披露。
    claimRefs:
