      - number: '4.2'
        title: 公开牵引力与 GTM 代理指标
        blocks:
          - type: paragraph
            body: >-
              Huma 的公开牵引力证据最能证明部署广度，却最不能证明变现转化。2024 年公司公告称，平台覆盖超过 3,000 家医院和诊所、超过 3,500 万名筛查对象、180 万名活跃用户、14 万名签约呼吸 RPM
              用户，收入同比翻倍。2024 年 7 月的一篇第三方文章重复了类似的广度指标，并补充超过 400 万注册医疗用户和 800
              多项研究，说明其在护理和研究领域拥有可观的已安装触达。虚拟病房页面还提供了患者受益度和临床容量提升方面的产品级证据。然而，这些代理指标都没有披露销售周期、实施负担、留存或回本周期，因此应视为商业动能指标，而非销售效率证明。
