      - 证据
      - 哪些信息会改变判断
    rows:
      - - 正论点：受监管的平台层
        - Huma 自身资料描述了嵌入受监管医疗与研究平台的治理型 AI。
        - 若有独立证据证明该架构能带来持久的扩张收入，判断将更坚定。
      - - 正论点：规模化部署面
        - Tech Funding News 报道称，该平台已覆盖 3,000+ 家医院和诊所、35M+ 名筛查用户、4M 名注册用户及 800+ 项研究。
        - 若有高质量出版物进一步印证付费使用、续约和队列经济性，这一规模信号才更具投资价值。
      - - 反论点：估值领先于披露
        - Multiples 和 Clay 指向 2024 年 7 月接近 $1B 的估值，但公开记录没有披露收入、毛利率、现金消耗或留存。
        - 如果管理层提供经审计的收入、利润率、现金消耗和留存数据，估值区间就能收窄。
      - - 反论点：融资历史尚未对账
        - 可获得的公开来源对累计融资总额说法不一，资料池中也没有来源披露清算优先权或老股转让占比。
        - 一份对账后的股权结构表和融资轮次历史将降低对稀释和悬置风险的不确定性。
    notes: 已分配的资料池提供了融资节点和平台信号，却没有足以最终解决正反论点权衡的非上市公司经济细节。
