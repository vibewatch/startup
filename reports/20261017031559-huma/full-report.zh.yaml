figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 保留的证据勾勒出清晰顺序：公司在 Medopad 时期成立，随后更名、获得扩张融资、达成监管里程碑，并于 2024 年推出云平台。
    data:
      items:
        - date: '2011'
          label: 以 Medopad 名义成立
          detail: BAE HQ 称 Dan Vahdat 于 2011 年创立公司，之后公司才更名为 Huma。
          tone: positive
          claimRefs:
            - CO004
        - date: '2020'
          label: 更名为 Huma
          detail: BAE HQ 称，公司从较窄的数据采集工具扩展到远程医疗和临床研究后，由 Medopad 更名为 Huma。
          tone: neutral
          claimRefs:
            - CO004
        - date: 2021-04
          label: 披露董事会扩充
          detail: 2021 年官方融资资料称 Claudia Suessmuth Dyckerhoff 于 2021 年 4 月加入 Huma 董事会。
          tone: positive
          claimRefs:
            - CO008
        - date: '2021-05-12'
          label: 完成 C 轮融资
          detail: PRNewswire 称，Huma 完成了约 $130 million 的 C 轮融资，由 Leaps by Bayer 和 Hitachi Ventures 领投。
          tone: positive
          claimRefs:
            - CO006
        - date: '2021-05-12'
          label: 披露或有资金
          detail: 同一份 2021 年融资公告称，额外 $70 million 的承诺可在之后行使，使总融资额超过 $200 million。
          tone: positive
          claimRefs:
            - CO007
        - date: '2021'
          label: 管理团队扩充
