  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于已分配公开来源、以证据支撑的工作流广度与部署杠杆序数图。
    data:
      xAxis:
        label: 工作流广度
        min: 1
        max: 5
        low: 单一工作流
        high: 多界面平台
        description: Evidence-backed ordinal scoring from assigned public sources, not market-share data.
        scale: ordinal
      yAxis:
        label: 部署杠杆
        min: 1
        max: 5
        low: 买方必须在本地完成更多构建 / 验证
        high: 预构建的受监管 / 治理界面
        description: Higher scores indicate faster launch and more reusable governed infrastructure in the retained evidence.
        scale: ordinal
      points:
        - label: Huma
          x: 5
          'y': 5
          note: 保留的公开范围最广，也有最强的可复用监管 / 治理杠杆证据。
        - label: 单点 RPM 厂商类别
          x: 2
          'y': 4
          note: 与监测工作流直接重叠，但其范围窄于 Huma 的跨工作流平台定位。
        - label: AI 文档单点解决方案类别
          x: 1
          'y': 4
          note: 在单一工作流上与 Hi Scribe 竞争，而不是替代 Huma 的完整平台方案。
        - label: 去中心化试验平台类别
          x: 2
          'y': 3
          note: 与制药工作流直接相关，但在保留证据中与医疗服务方交付的重叠较弱。
        - label: 现有 EHR / 工作流模块类别
          x: 3
          'y': 4
          note: 即使保留证据没有显示 Huma 式广度，既有客户基础的分发能力也可能很强。
        - label: 内部构建 / 定制技术栈
          x: 4
          'y': 1
          note: 定制方案可以覆盖更广，但最重的验证、治理和维护负担仍由买方承担。
    approximationNotes: 序数坐标总结已分配公开证据中的相对广度和部署杠杆；它们不是经过测量的市场份额或满意度评分。
    claimRefs:
      - CP002
      - CP008
      - CP010
      - CP015
      - CP016
  - id: FI001
    title: 从部署到毛利的收入模型桥接
    type: flow
    summary: 公开证据指向一个面向多个买方群体变现的受监管平台；最终毛利取决于软件层周围包含多少服务、设备连接和临床支持。
    data:
      nodes:
        - id: providers
          label: 医疗服务方与医疗系统
          note: 虚拟病房、远程监测和择期医疗积压工作流。
        - id: pharma
          label: 制药与生命科学
          note: 伴随应用、去中心化试验和研究项目。
        - id: public-sector
          label: 政府与公共卫生
          note: 筛查和人群参与部署。
        - id: platform
          label: 受监管的平台底座
          note: 一个获认证的平台，具备云配置、设备连接和 SDK 访问能力。
        - id: monetization
          label: 合同软件收入
          note: 订阅、按用户计费和启用服务合同；公开目录价格大多未披露。
        - id: gross-profit
          label: 毛利敏感度
          note: 利润率取决于软件相对于集成、设备和外包临床支持的收入组合。
      edges:
        - from: providers
          to: platform
          label: 部署于
        - from: pharma
          to: platform
          label: 部署于
        - from: public-sector
          to: platform
          label: 部署于
        - from: platform
          to: monetization
          label: 授权 + 启用服务
        - from: monetization
          to: gross-profit
          label: 实际利润率取决于组合
    claimRefs:
      - CI001
      - CI002
      - CI012
