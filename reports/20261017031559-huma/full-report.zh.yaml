      - number: '4.3'
        title: 融资规模、资金用途与资本密度
        blocks:
          - type: paragraph
            body: >-
              Huma 多次需要外部资本来支持扩张，公开融资记录清楚，但当前现金状况并不清楚。2021 年 C 轮带来约 1.3 亿美元，另有 7,000
              万美元被描述为与里程碑挂钩；管理层称资金将用于地域扩张、研发和深化生命科学合作。2024 年 D 轮新增超过 8,000 万美元，使已披露累计融资超过 3
              亿美元。这种融资规模符合一种同时包含受监管软件、集成、设备连接、全球部署以及可能高服务投入交付的业务。但它不能证明当前现金可用：经审阅材料没有披露资产负债表现金、现金消耗、债务或
              runway，因此资本充足性仍依赖管理层披露，而非公开文件核验。
