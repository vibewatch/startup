companyProfile:
  summary: >-
    Huma
    是一家创始人主导的后期私营数字医疗基础设施公司，销售受监管平台，用于远程患者监测、医院居家护理流程及相邻的临床研究场景。公开记录显示，公司多次获得战略融资、反复声称部署范围广泛，并围绕可复用的受监管基础设施讲述产品故事，而非定位为单一用途的消费应用；但当前经济数据的透明度远低于其产品和融资叙事。
