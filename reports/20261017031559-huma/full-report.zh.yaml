              Huma 的风险堆栈是集中的，而非分散的。同一个支持“数周上线”宣传的疾病无关、受监管平台，也把下行风险集中到一个审批、质量和变更控制界面上：Medical Device Network 和 Digital
              Health 表示，FDA 批准的底座可以承载临床算法并支持新的疾病项目；Pharmaphorum 则称 2026 年 9 月取得的 EUMDR IIb
              认证扩大了其在不同疾病和年龄群体中的使用范围。这种杠杆具有战略价值，但也意味着任何上市后、临床安全或司法管辖区限制，都可能同时影响多个合作项目，而不是单一孤立应用。资本可获得性显著好于公开单位经济透明度，因此融资是缓冲因素，却不能替代下行投资判断。
