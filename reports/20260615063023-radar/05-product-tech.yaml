  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: The customer-facing operating flow runs from tagged-item awareness to associate action, cart automation, and final inventory-state updates.
    approximationNotes: This flow condenses RADAR's public use-case descriptions into a simple seven-step operating sequence.
    data:
      nodes:
        - id: tag-item
          label: Item is RFID tagged
          detail: Merchandise enters the store carrying an EPC-compliant passive UHF tag.
        - id: sense-item
          label: Ceiling sensors read item movement
          detail: Overhead readers continuously capture the location and movement of tagged merchandise.
        - id: update-state
          label: Inventory state is updated
          detail: RADAR analytics convert read events into current inventory location and availability.
        - id: associate-query
          label: Associate locates product
          detail: Staff query the platform to find a requested item or confirm availability.
        - id: shopper-browse
          label: Shopper selects items
          detail: The system observes which tagged items the shopper carries or returns while browsing.
        - id: digital-cart
          label: Digital cart is built
          detail: Checkout logic adds items to a virtual basket as the customer shops.
        - id: exit-payment
          label: Exit triggers payment and final update
          detail: At store exit, the customer is charged and the inventory record reflects the completed sale.
      edges:
        - from: tag-item
          to: sense-item
          label: identify merchandise
        - from: sense-item
          to: update-state
          label: stream read events
        - from: update-state
          to: associate-query
          label: expose item location
        - from: update-state
          to: shopper-browse
          label: maintain live availability
        - from: shopper-browse
          to: digital-cart
          label: infer carried items
        - from: digital-cart
          to: exit-payment
          label: settle purchase
