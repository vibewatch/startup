  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User job
      - Legacy workflow
      - RADAR-enabled workflow
      - Benefit signal
      - Constraint
    rows:
      - - Find an item for a shopper
        - Associate searches floor and stockroom manually or uses a handheld scanner intermittently.
        - Associate queries a mobile interface backed by continuous item-location data.
        - Faster service and better item findability.
        - Depends on complete RFID tagging and ceiling coverage.
      - - Confirm sellable inventory
        - Store relies on stale cycle counts or POS deductions.
        - Platform provides real-time availability and location awareness.
        - Better confidence in what is actually on hand.
        - Public sources do not disclose false-positive rates by category.
      - - Pick omnichannel orders
        - Orders may be accepted for items that cannot actually be found in-store.
        - Store uses current item location to pick with fewer surprises.
        - Reduced cancellation and better fulfillment execution.
        - Integration specifics with OMS/WMS are undisclosed.
      - - Replenish the sales floor
        - Teams walk departments or scan periodically to identify gaps.
        - RADAR highlights misplaced or missing items continuously.
        - Better replenishment speed and labor efficiency.
        - Operational dashboards are described publicly only at a high level.
      - - Operate checkout without a lane
        - Customer must visit staffed or self-checkout.
        - Items are added to a digital cart while shopping and payment occurs on exit.
        - Frictionless checkout and less queueing.
        - Industry edge cases and customer acceptance remain open risks.
      - - Analyze store movement patterns
        - Managers rely on manual observation or lagging reporting.
        - Platform aggregates movement and inventory signals into analytics.
        - Better operational insight into item flow and demand.
        - Public materials do not expose metric definitions or export schema.
    notes: Pure factual workflow snapshot compiled from directly observed public product descriptions and customer-facing claims.
