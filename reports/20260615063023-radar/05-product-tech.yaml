  - id: differentiation
    title: Differentiation and Technical Moat
    body: |
      RADAR's primary differentiating claims are fixed-ceiling sensing precision, real-time item-location capability versus handheld periodic snapshots, a proprietary integrated hardware-software-analytics stack, and a team with deep RFID manufacturing and retail implementation expertise. The company positions itself as solving a problem that legacy RFID approaches have not addressed at scale with the same accuracy profile. The integration of computer vision alongside RFID, as noted in the Old Navy partnership announcement, may provide an additional layer of sensing redundancy or differentiation, though the specific role of computer vision in RADAR's platform versus pure inventory RFID is not publicly explained. RADAR's hardware stack is a proprietary system built on standard RAIN RFID tag technology, meaning retailers are not locked into a non-standard tag format but are dependent on RADAR's proprietary reader infrastructure. The company's data advantage also compounds with scale: each additional deployment expands the operational corpus of item movements, replenishment events, and customer-product interaction patterns that can improve analytics and workflow tuning over time.
    claimRefs:
      - CE003
