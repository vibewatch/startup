  evidenceGaps:
    - type: missing-source
      severity: material
      topic: roadmap-disclosure
      missingEvidence: A public 2026+ product roadmap, release calendar, or versioned changelog showing what RADAR plans to launch beyond currently described inventory and checkout capabilities.
      whyItMatters: Without roadmap disclosure, investors and buyers cannot distinguish mature current capabilities from aspirational future modules.
      diligencePath: Request the product roadmap, release notes, customer migration plan, and a list of milestones already delivered in 2026.
      relatedQuestionRefs:
        - QE017
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: patents-and-algorithms
      missingEvidence: Public patents, technical papers, or customer-authored validation describing RADAR's proprietary item-positioning algorithms or unique sensing innovations.
      whyItMatters: The moat thesis depends partly on proprietary sensing and analytics; absent patent or publication evidence, diligence must verify protectability privately.
      diligencePath: Search patent databases under Automaton, Inc. and RADAR, then request invention disclosures, patent counsel summaries, and any filed applications directly from management.
      relatedQuestionRefs:
        - QE023
    - type: private-evidence-only
      severity: material
      topic: hardware-certifications
      missingEvidence: Hardware certification records, FCC or related compliance filings, and public documentation of sensor-platform regulatory standards.
      whyItMatters: Ceiling-mounted store hardware creates procurement, safety, and compliance risk if certifications and test records are not available during diligence.
      diligencePath: Request certification packets, FCC identifiers, compliance lab reports, and installation standards for each hardware generation.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: deployment-prerequisites
      missingEvidence: A public deployment handbook or implementation checklist naming tagging, network, store-layout, staffing, and integration prerequisites for a new store launch.
      whyItMatters: Fleet-scale expansion economics depend on how much tagging, installation, systems work, and process retraining each new store requires.
      diligencePath: Request the customer onboarding checklist, deployment timeline, store-readiness rubric, and post-install support playbooks.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE005
