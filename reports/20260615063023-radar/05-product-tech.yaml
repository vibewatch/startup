      - FE002
  - id: deployment-integration
    title: Deployment, Integration, and Roadmap
    body: |
      RADAR's deployment model requires physical installation of ceiling-mounted RFID sensors and antennas across the retail sales floor, stockroom, and high-traffic zones. The platform is implemented in phases, as evidenced by Old Navy's multi-year phased nationwide rollout announcement. Retailers must pre-tag merchandise with EPC-compliant RAIN RFID labels, either at the source (manufacturer) or in-store, before RADAR's sensing layer can track individual items. Integration with store systems — POS, WMS, and e-commerce fulfillment platforms — is required for RADAR's inventory data to drive downstream workflows. RADAR's jobs page indicates roles for integration and customer success, but the specific integration standards, middleware, or APIs are not documented publicly. The deployment footprint as of May 2026 exceeds 1,400 stores across American Eagle and Old Navy banners. RADAR's team background includes experience overseeing technology implementations across 1,300+ stores, suggesting operational expertise in large-scale retail rollouts. Reliability, support, and uptime SLA commitments are not disclosed in public materials; these are material items for enterprise procurement due diligence.
