  - id: customer-workflows
    title: Customer Workflows and Use Cases
    body: |
      RADAR's customer-facing workflows center on three primary use cases: real-time inventory intelligence for store associates, omnichannel fulfillment accuracy, and autonomous checkout. For inventory intelligence, store associates access a mobile application that displays the real-time location of any tagged item, enabling rapid response to customer requests for specific sizes or styles. This replaces the prior workflow of physically searching the sales floor and stockroom by memory or walking the floor with a handheld RFID scanner. For fulfillment, accurate real-time inventory prevents order cancellations from shoppers who order online from a store that in fact lacks the requested item. Public coverage and company materials consistently tie the product to reduced search time, better replenishment, and more reliable omnichannel execution. For autonomous checkout, RADAR's platform adds items to a digital cart as the customer moves through the store and charges payment automatically upon exit. RADAR's checkout workflow has been demonstrated in limited deployments; the technology faces the same edge-case and customer-acceptance challenges identified by analysts for all autonomous checkout systems.
    claimRefs:
      - CE005
      - CE006
      - CE017
      - CE023
      - CE040
