  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / process
      - Role in platform
      - Key dependency
      - Principal risk
    rows:
      - - EPC / RAIN RFID tags
        - Provide the item identifier that lets every unit be sensed individually.
        - GS1 EPC data standards and retailer tagging operations
        - Incomplete tagging or poor attachment quality reduces visibility.
      - - Ceiling readers and antennas
        - Interrogate passive UHF tags continuously across the store footprint.
        - Reader hardware performance, placement, and power tuning
        - Installation burden and coverage gaps can impair reads.
      - - Sensor fusion inputs
        - Combine RFID with AI and computer-vision context for more robust item interpretation.
        - Proprietary RADAR software and camera placement
        - Public materials do not explain the exact role or weighting of vision inputs.
      - - Edge processing
        - Filters and normalizes high-volume tag events close to the store environment.
        - Reliable reader connectivity and local compute orchestration
        - Real-time event loads and noise suppression are not publicly benchmarked.
      - - Cloud analytics layer
        - Converts reads into location estimates, counts, and workflow-ready inventory intelligence.
        - RADAR analytics software and data models
        - Algorithm quality is proprietary and externally unaudited.
      - - Enterprise integration layer
        - Passes inventory intelligence into POS, fulfillment, and store-system workflows.
        - Retailer system connectivity and implementation services
        - API and middleware standards are not publicly documented.
      - - Associate and operator applications
        - Deliver lookup, exception handling, and analytics to store personnel.
        - Mobile UX, permissions, and store process adoption
        - Public UI detail is limited and uptime commitments are undisclosed.
    notes: |
      This architecture table is synthesized from official product language, customer announcements, and RFID standards documentation; RADAR has not published a formal technical reference architecture.
