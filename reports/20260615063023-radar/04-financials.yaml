- id: capital-adequacy-and-runway
  title: Capital adequacy, funding structure, and runway
  body: >-
    The Company Overview chapter documents RADAR's full funding chronology. For forward capital adequacy,
    the key facts are: RADAR raised $170 million in Series B financing in May 2026 at a $1 billion post-money
    valuation, bringing cumulative disclosed capital to approximately $270 million (prior rounds totaling
    roughly $100 million, including a ~$38 million round in 2024, plus the Series B). Cash on hand is not
    publicly disclosed, but even assuming Series B proceeds are the dominant liquidity source, $170 million
    provides meaningful runway for a company at RADAR's scale and stated growth trajectory.
    The appointment of Abi Viswanathan as CFO—announced simultaneously with the Series B—signals the company
    is transitioning from founder-led financial management to institutional financial rigor. Viswanathan's
    background at Nuro (scaled to $8.6 billion valuation as CFO) and Uber (global expansion at Strategic
    Finance) is directly relevant to a company managing hardware procurement, enterprise software contracting,
    and international growth simultaneously. The timing of the CFO hire alongside the largest financing round
    in RADAR's history is consistent with an investor expectation that financial systems, controls, and
    forecasting will be substantially strengthened before the company pursues additional capital or exit
    alternatives.
    Planned use of Series B proceeds explicitly covers five areas: accelerating deployments to existing
    retailers, advancing next-generation sensor hardware, expanding AI analytics capabilities, developing
    autonomous checkout, and growing internationally. Not all of these are equally capital-efficient.
    Hardware R&D and international expansion are typically the most capital-intensive, while software
    and analytics investment can be more capital-light relative to revenue potential.
    RADAR's investor syndicate includes strategic retailers (American Eagle, Gap Inc., Lojas Renner) and
    financial investors (Gideon Strategic Partners, Nimble Partners, Align Ventures, Founders Fund,
    Y Combinator, Sound Ventures, Beanstalk, Agnelli family), which reduces the risk of an abrupt
    capital withdrawal but does not eliminate the need for continued performance. The strategic investor
    overlap means RADAR's funding is partially tied to retail sector health; if large-format retail faces
    a prolonged downturn, the strategic investment thesis could weaken.
    Monthly cash burn is not disclosed. Given the company's rapid expansion cadence (~100 stores/month),
    a growing team of consultants, account managers, and engineers (per Forbes), hardware procurement
    and installation costs, and multiple simultaneous R&D workstreams, a reasonable inference is that
    burn is substantial—likely in the range of $10-20 million per month at this stage, which would imply
    9-17 months of runway from the Series B alone. This is an estimation with low confidence; the actual
    figure depends heavily on whether hardware costs are borne by RADAR or capitalized/passed to retailers.
