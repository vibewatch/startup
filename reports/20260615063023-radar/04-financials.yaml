  - CI037
  - CI038

callouts:
- calloutType: risk
  title: Private-company disclosure gap blocks full underwriting
  body: >-
    RADAR has not disclosed ARR, gross margin, NRR, CAC, cash position, or monthly burn. All five
    contentRequirements in this chapter require at least one of these inputs for a complete analysis.
    Investors must treat the current chapter as a structured framework for diligence rather than
    a completed financial model. The appointment of CFO Abi Viswanathan in May 2026 suggests
    improved financial reporting is forthcoming.
  claimRefs:
  - CI047
  - CI048
  - CI049
  - CI050
  - CI051
  - CI052
  - CI053

- calloutType: strength
  title: Series B capital provides meaningful runway and signals strong institutional conviction
  body: >-
    $170M in Series B capital at a $1B valuation, co-led by dedicated growth investors, provides
    RADAR with material runway to execute its accelerated deployment and international strategy.
    The simultaneous CFO appointment and investor syndicate composition (mix of financial and
    strategic retail investors) strengthens governance and reduces near-term liquidity risk.
  claimRefs:
  - CI030
  - CI031
  - CI032
  - CI034

- calloutType: insight
  title: Valuation implies $20–67M ARR at typical SaaS growth multiples — a high bar
  body: >-
    Applying public-market growth multiples (15–50x) to RADAR's $1B valuation produces an implied ARR
    range of $20–67M. Whether this is already achieved, nearly achieved, or still aspirational is
    unknown, but it sets a concrete yardstick for the revenue-base expectation embedded in the unicorn
    price. At 1,400 stores, achieving the midpoint of this range (~$35M ARR) would require approximately
    $25K ACV per store annually — a plausible price for an enterprise inventory-intelligence platform
    with documented 10%+ in-store revenue lift.
  claimRefs:
  - CI039
  - CI040
  - CI041
  - CI044

