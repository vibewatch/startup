- id: gtm-and-sales-efficiency
  title: GTM motion, deployment cadence, and sales efficiency signals
  body: >-
    RADAR's go-to-market is direct-enterprise and exceptionally consultative. Forbes cited the CEO as saying
    the company historically onboarded only one new enterprise retailer per year—an extremely slow pace that
    reflects a highly customized installation and integration process for each flagship account. The $170 million
    Series B is explicitly earmarked to expand this capacity: the stated goal is to move from one to tens of
    new enterprise retailer relationships per year. This acceleration is operationally plausible given the
    hire of Abi Viswanathan as CFO (previously CFO of Nuro, where he helped scale to an $8.6 billion valuation,
    and an early member of Uber's Strategic Finance team) and the rapid store deployment at ~100 new locations
    per month for existing customers. The distinction between "new enterprise relationships" (glacial historically)
    and "new locations within existing relationships" (now running at 100/month) is critical: RADAR's
    expansion velocity is primarily driven by upselling within existing enterprise accounts rather than
    broad new customer acquisition. That is consistent with a land-and-expand model, but it also means
    revenue concentration is high and new-customer CAC is very large on a per-account basis.
    Strategic investor overlap (American Eagle CEO Jay Schottenstein is both an early backer and the first
    fleet-wide customer; Gap Inc. is both a partner and an investor) creates a favorable customer acquisition
    and proof-of-concept environment, but it also means RADAR's most important reference customers have
    financial alignment with the company that an independent buyer might discount. The pipeline of a dozen-plus
    pilot retailers as of May 2026 is a positive leading indicator but insufficient to assess CAC payback or
    true net revenue retention, both of which remain undisclosed.
    PYMNTS reported that the RFID platform originally began as an autonomous-checkout product before pivoting
    to inventory visibility—a fact that matters for the long-run vision but confirms the current revenue
    engine is inventory intelligence rather than checkout automation. Retailers' ROI case for RADAR appears
    concrete: order cancellation rates reduced from 25% to 3% in one documented case (PYMNTS/CNBC), 10%+
    in-store revenue growth reported by customers (Forbes, company-claimed), and a 60% shrink reduction at
    one pilot site (PYMNTS/CNBC). These outcomes, if consistent across the installed base, support a
    strong upsell and retention story, but they are management-reported metrics without independent audit.
