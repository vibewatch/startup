- id: FI004
  title: Capital Intensity and Cash-Flow Map — Series B Capital Deployment
  type: flow
  layout: standard
  summary: How RADAR's ~$270M in cumulative capital has been and will be deployed, with the cash runway node remaining unquantified.
  data:
    nodes:
    - id: c1
      label: Cumulative equity raised ~$270M
      detail: Pre-B rounds (~$100M+) plus Series B ($170M). Investors include Gideon, Nimble, Align, Founders Fund, Y Combinator, Sound Ventures, strategic retail backers.
    - id: c2
      label: Hardware R&D and sensor manufacturing
      detail: Proprietary ceiling sensors require ongoing BOM investment. Series B explicitly funds "next-generation sensor hardware."
    - id: c3
      label: Enterprise deployment (consulting, installation)
      detail: Each new retailer relationship requires intensive on-site deployment. CEO described typical pace as one new enterprise per year historically.
    - id: c4
      label: Software and AI platform development
      detail: Real-time processing of 100B+ daily item events requires cloud infrastructure and ongoing ML/AI investment. Fitting Room IQ, Floor Set IQ launched Feb 2026.
    - id: c5
      label: GTM scaling (sales, account management)
      detail: Series B funds expansion from ~1 to tens of new enterprise retailers annually; requires larger consultant, sales, and account management teams.
    - id: c6
      label: International expansion
      detail: Canada, EMEA, and Latin America expansion planned with Series B proceeds.
    - id: c7
      label: Autonomous checkout development
      detail: Next-revenue-tier product in development; hardware and software investment required before commercialization.
    - id: c8
      label: Cash position and runway — undisclosed
      detail: No public disclosure of ending cash balance, monthly burn, or financial projections. Estimated $10–20M/month burn implies 9–17 months runway from Series B.
    edges:
    - from: c1
      to: c2
      label: Capital allocation (hardware)
    - from: c1
      to: c3
      label: Capital allocation (deployment)
    - from: c1
      to: c4
      label: Capital allocation (software/AI)
    - from: c1
      to: c5
      label: Capital allocation (GTM)
    - from: c1
      to: c6
      label: Capital allocation (international)
    - from: c1
      to: c7
      label: Capital allocation (checkout)
    - from: c2
      to: c8
      label: Consumes cash; timing of ROI uncertain
    - from: c3
      to: c8
      label: High per-deployment cost; improving with scale
    - from: c4
      to: c8
      label: Operating expense; revenue-generating
    - from: c5
      to: c8
      label: Near-term cash consumer; long-term ARR driver
  approximationNotes: >-
    Burn rate and runway are low-confidence estimates inferred from operational signals. Actual
    allocation of Series B proceeds across these buckets is not publicly disclosed.
  claimRefs:
  - CI030
  - CI031
  - CI033
  - CI034
  - CI035
