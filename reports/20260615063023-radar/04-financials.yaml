  summary: How a retailer deploying RADAR converts store activity into three revenue tiers, ending at an unquantified gross-profit node.
  data:
    nodes:
    - id: f1
      label: Enterprise retailer signs contract
      detail: RADAR sells directly to enterprise retailers through a consultative, direct-sales motion with multi-store commitments.
    - id: f2
      label: Hardware deployment (sensors + installation)
      detail: Proprietary ceiling-mounted RFID sensors installed per store. One-time hardware revenue recognized at delivery or ratably. Pricing undisclosed.
    - id: f3
      label: Software subscription activated
      detail: Per-store recurring SaaS license for real-time RFID intelligence platform. Contract terms and pricing undisclosed; likely annual.
    - id: f4
      label: Analytics / AI layer enabled
      detail: Fitting Room IQ, Floor Set IQ, and AI-driven demand insights. May be bundled or separately priced. Launched February 2026.
    - id: f5
      label: Store expansion within account
      detail: ~100 new store locations activated per month across existing retailer accounts. Each new store adds hardware + software revenue.
    - id: f6
      label: Blended gross profit
      detail: Hardware margin estimated 30–50% (Zebra/Impinj benchmarks); software margin estimated 65–80% (vertical SaaS comps). Blended figure undisclosed.
    - id: f7
      label: Revenue quality gap
      detail: ARR, NRR, ACV, gross margin, and customer concentration are all undisclosed. Full gross-profit picture requires management financials.
    edges:
    - from: f1
      to: f2
      label: First deployment
    - from: f2
      to: f3
      label: Platform activation
    - from: f3
      to: f4
      label: Analytics upsell or bundled
    - from: f4
      to: f5
      label: Fleet expansion
    - from: f5
      to: f6
      label: Per-store revenue × deployed stores
    - from: f6
      to: f7
      label: Cannot close model without private data
  approximationNotes: >-
    Gross margin benchmarks are from Impinj FY2025 and Zebra FY2025; not RADAR-confirmed. Revenue
    recognition method for hardware is assumed but not disclosed.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI020
  - CI021
  - CI022

- id: FI002
  title: Unit Economics Bridge — Deployment Inputs vs. Missing Financial Nodes
  type: flow
  layout: standard
  summary: Maps the publicly known deployment signals to the unit-economic model, highlighting the nodes that cannot be closed without private disclosures.
  data:
    nodes:
    - id: u1
      label: 1,400+ stores deployed
      detail: Confirmed as of May 2026. Primary scale anchor.
    - id: u2
      label: ~100 new locations/month
      detail: Company-stated deployment velocity for existing retailer accounts.
    - id: u3
      label: ACV per store — unknown
      detail: No public list price or contract value has been disclosed.
    - id: u4
      label: Implied ARR range
      detail: Mechanical estimate only — $1B valuation at 15–50x implies $20–67M ARR. Not confirmed.
    - id: u5
      label: Hardware COGS — unknown
      detail: Per-sensor cost and installation cost are undisclosed. Comp benchmarks suggest 45–55% gross margin for hardware+services.
    - id: u6
      label: Software margin — unknown
      detail: Vertical SaaS comps suggest 65–80% gross margin at scale, but RADAR's actual software cost base is undisclosed.
    - id: u7
      label: NRR — unknown
      detail: No disclosed cohort data. Land-and-expand within AEO/Old Navy is plausible but unconfirmed.
    - id: u8
      label: Unit economics — unresolvable publicly
      detail: LTV/CAC, payback, and blended gross margin all require private data. Directional case is positive; specific underwriting is blocked.
    edges:
    - from: u1
      to: u3
      label: Installed base × ACV = ARR
    - from: u2
      to: u4
      label: Growth rate drives forward ARR
    - from: u3
      to: u4
      label: ACV unknown blocks ARR calculation
    - from: u4
      to: u8
      label: Revenue inputs missing
    - from: u5
      to: u8
      label: Hardware margin unknown
    - from: u6
      to: u8
      label: Software margin unknown
    - from: u7
      to: u8
      label: Retention unknown
  approximationNotes: >-
    ARR range of $20–67M is a mechanical backsolve from the $1B valuation at 15–50x EV/ARR. No
    revenue has been confirmed or implied by RADAR management. These are investor-implied estimates only.
  claimRefs:
  - CI039
  - CI040
  - CI044
  - CI045
  - CI046
  - CI047

- id: FI003
