      - number: '5.2'
        title: 客户工作流与使用场景
        blocks:
          - type: paragraph
            body: >
              RADAR
              面向客户的工作流围绕三个主要场景：供门店员工使用的实时库存智能、全渠道履约准确性，以及自主结账。在库存智能场景中，门店员工通过移动应用查看任意带标签商品的实时位置，从而快速响应顾客对特定尺码或款式的需求。这取代了过去凭记忆在卖场和库房实地寻找，或拿手持
              RFID
              扫描器巡店的流程。在履约场景中，准确的实时库存可避免顾客从某家门店下线上订单后，因门店实际缺货而被取消订单。公开报道和公司材料一致把产品与缩短搜索时间、改善补货、更可靠的全渠道执行联系起来。在自主结账场景中，RADAR
              平台会在顾客穿行门店时把商品加入数字购物车，并在离店时自动扣款。RADAR 的结账工作流已在有限部署中展示；该技术面临的边界案例和顾客接受度挑战，与分析师对所有自主结账系统指出的问题一致。
