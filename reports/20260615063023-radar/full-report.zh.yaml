      - number: '4.4'
        title: 资本充足性、融资结构与 runway
        blocks:
          - type: paragraph
            body: >-
              公司概览章节记录了 RADAR 的完整融资时间线。向前看资本充足性，关键事实是：RADAR 于 2026 年 5 月以 $1B 投后估值完成 $170M Series B，累计已披露资本约
              $270M（此前轮次合计约 $100M，包括 2024 年约 $38M 轮次，加上 Series B）。账上现金未公开，但即便假设 Series B 资金是主要流动性来源，对 RADAR
              当前规模和所述增长轨迹而言，$170M 也提供了有意义的资金续航。Abi Viswanathan 与 Series B 同步宣布出任
              CFO，说明公司正从创始人主导的财务管理，转向机构化财务纪律。Viswanathan 在 Nuro（作为 CFO 帮助公司扩张至 $8.6B 估值）和 Uber（Strategic Finance
              负责全球扩张）的背景，直接适用于一家同时管理硬件采购、企业软件合同和国际增长的公司。CFO 入职与 RADAR
              史上最大融资轮同时发生，符合投资人预期：公司在寻求更多资本或退出选择之前，需要显著加强财务系统、控制和预测。Series B 计划用途明确覆盖五个领域：加速现有零售商部署、推进下一代传感器硬件、扩展 AI
              分析能力、开发自主结账，以及国际增长。这些事项的资本效率并不相同。硬件研发和国际扩张通常最资本密集；相对于收入潜力，软件和分析投资更轻资本。RADAR 投资方组合包括战略零售商（American
              Eagle、Gap Inc.、Lojas Renner）和财务投资方（Gideon Strategic Partners、Nimble Partners、Align Ventures、Founders
              Fund、Y Combinator、Sound Ventures、Beanstalk、Agnelli family），降低了资本突然撤出的风险，但没有消除持续交付业绩的需要。战略投资方重叠意味着 RADAR
              融资部分绑定零售行业健康；若大业态零售经历长期下行，战略投资论点可能走弱。月度现金消耗未披露。考虑到公司快速扩张节奏（约 100 家门店/月）、不断扩大的顾问、客户经理和工程师团队（据
              Forbes）、硬件采购与安装成本，以及多个并行研发工作流，合理推断是现金消耗相当高——现阶段可能在每月 $10M–$20M 区间，仅靠 Series B 意味着 9–17
              个月资金续航。该估算置信度低；实际数字高度取决于硬件成本由 RADAR 承担，还是资本化 / 转嫁给零售商。
