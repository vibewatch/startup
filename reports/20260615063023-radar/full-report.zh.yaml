      - number: '7.5'
        title: 财务透明度与证据质量风险
        blocks:
          - type: paragraph
            body: >
              RADAR 是一家私营公司，在任何公开文件或经审计文件中均未披露收入、ARR、毛利率、burn rate
              或单位经济性。在投资人和媒体语境中流通的所有经营和财务指标——门店数量、部署速度、客户结果——都来自公司自身，尚未独立验证。以 1,400 家报告生产门店为基础支撑 $1 billion
              估值，隐含单店收入或价值创造预期，但无法用公开信息交叉检查。缺少独立审计、S-1 或经验证的第三方财务披露，意味着投资人在给一个零财务透明度的独角兽定价。

              公开材料引用的客户结果指标——包括店内收入提升 10% 或更高、BOPIS 取消率从 25% 降至 3%、某 pilot 的 shrink 降低
              60%——均发布在公司策划的新闻稿和案例研究中，没有审计、独立方法论或对照组数据。CBInsights 将法律实体 Automaton, Inc.
              标记为未披露财务的私营公司，与完全缺少独立验证相一致。没有大型独立分析机构（Gartner、Forrester、IDC）发布过可公开获取的 RADAR 收入、市场地位或可持续性风险 /
              竞争评估。治理结构又增加了一层不透明：Jay Schottenstein 同时是 RADAR 最大具名生产客户和具名投资人，引发了支撑报告门店数量增长的商业关系是否独立的问题。
