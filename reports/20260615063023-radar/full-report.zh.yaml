          high: 1008
          unit: $M
        - label: 牛市情景（ACV $65K，1,600 家门店）
          low: 832
          mid: 1248
          high: 1664
          unit: $M
        - label: 扩张牛市（ACV $65K，2,000 家门店 — 现有客户全面部署）
          low: 1040
