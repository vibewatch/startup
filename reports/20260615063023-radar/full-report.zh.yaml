      - number: '6.3'
        title: 已具名客户证明：Old Navy 与 American Eagle Outfitters
        blocks:
          - type: paragraph
            body: >
              American Eagle Outfitters 是 RADAR 第一个全门店网络部署者。AEO 执行董事长兼 CEO Jay Schottenstein 既是公司主要客户
              champion，也是财务支持者——这种关系在企业 SaaS 中并不常见，但也证明了很深的运营信念。在 Series B 公告中，Schottenstein 表示：“作为第一家在全门店网络实施 RADAR
              技术的零售商，American Eagle 获得了更高的库存可见性，赋能了我们的员工，也强化了洞察。库存实时数字化之后，我们让创意、运营和技术团队能够把重心放在创造无缝、客户优先的体验上，而这正定义了
              American Eagle 品牌。”AEO 的部署覆盖其美国和加拿大完整门店网络下的 American Eagle 与 Aerie 两个品牌。

              Old Navy（Gap Inc.）于 2025 年 3 月宣布多年合作。Old Navy 总裁兼 CEO Haio Barbeito
              称该平台提供“精密分析，将赋予我们的团队更强的实时库存可见性，从而提供更好的店内购物体验”，并称其为“我们长期战略中的重要因素，目标是让 Old Navy 成为北美最受喜爱的服装品牌”。Gap Inc. CTO
              Sven Gerjets 补充说，“借助 Radar 始终在线的 RFID 技术，我们将从 Old Navy 开始，把门店转变为真正互联的空间。”该 rollout 明确在 Old Navy 1,200+
              家门店网络中分阶段推进，截至运行日期仍在进行中。

              除这两个锚定账户外，截至 2026 年 5 月，约十二家零售商处于活跃 pilot 项目。外界没有看到这些 pilot 的名称、垂直领域或结果数据。2025 年 3 月最初 30+ 个品牌的管线说明 RADAR
              当时正积极向更广泛客户群营销，但公开记录无法确认其中是否有任何管线品牌在 2026 年中前成为付费客户。
