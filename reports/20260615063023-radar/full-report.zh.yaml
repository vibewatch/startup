  - id: FI001
    title: RADAR 收入模型桥 — 客户活动到收入与毛利
    type: flow
    layout: standard
    summary: 零售商部署 RADAR 后，门店活动如何转化为三层收入，并最终走到一个未量化的毛利节点。
    data:
      nodes:
        - id: f1
          label: 企业零售商签约
          detail: RADAR 通过顾问式直销动作直接卖给企业零售商，合同承诺通常覆盖多家门店。
        - id: f2
          label: 硬件部署（传感器 + 安装）
          detail: 每家门店安装自有天花板 RFID 传感器。一次性硬件收入在交付时确认或按比例确认。价格未披露。
        - id: f3
          label: 软件订阅激活
          detail: 实时 RFID 智能平台按门店收取经常性 SaaS 许可费。合同期限和定价未披露；可能按年。
        - id: f4
          label: 分析 / AI 层启用
          detail: Fitting Room IQ、Floor Set IQ 和 AI 驱动的需求洞察。可能打包，也可能单独定价。2026 年 2 月推出。
        - id: f5
          label: 账户内门店扩张
          detail: 现有零售商账户每月激活约 100 个新门店点位。每家新店都会增加硬件 + 软件收入。
        - id: f6
          label: 混合毛利
          detail: 硬件毛利率估算 30–50%（Zebra/Impinj 基准）；软件毛利率估算 65–80%（垂直 SaaS 可比公司）。混合数据未披露。
        - id: f7
          label: 收入质量缺口
          detail: ARR、NRR、ACV、毛利率和客户集中度均未披露。完整毛利图景需要管理层财务数据。
      edges:
        - from: f1
          to: f2
          label: 首次部署
        - from: f2
          to: f3
          label: 平台激活
        - from: f3
          to: f4
          label: 分析加购或打包
        - from: f4
          to: f5
          label: 门店群扩张
        - from: f5
          to: f6
          label: 单店收入 × 已部署门店
        - from: f6
          to: f7
          label: 缺少私有数据，模型无法闭合
    approximationNotes: 毛利率基准来自 Impinj FY2025 和 Zebra FY2025；未经 RADAR 证实。硬件收入确认方法是假设，未披露。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI020
      - CI021
      - CI022
