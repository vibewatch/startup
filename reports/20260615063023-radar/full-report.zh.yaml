      - number: '7.3'
        title: 隐私、监管与法律风险
        blocks:
          - type: paragraph
            body: >
              基于 RFID 的零售系统处在多个快速演进的监管制度交汇处。在美国，RAIN RFID 运行于 902–928 MHz UHF 频段，遵循 FCC Part 15 规则；FCC
              历史上一直维持该频段功率限制稳定，但频谱管理本质上是可能变化的政策决定。NIST Special Publication 800-98 作为 RFID 安全的联邦指导，正式将 RFID
              基础设施识别为可能遭受窃听、未授权追踪、重放攻击和数据完整性破坏的目标，因此企业部署会产生合规和审计预期。RADAR 已发布的隐私政策未披露任何独立安全审计、第三方渗透测试计划或数据泄露通知
              SLA，仅凭公开信息无法验证其安全态势。

              如果单品级标签读取与消费者画像、会员交易或结账事件相连，GDPR 以及 CCPA、CPRA 等州级隐私法可能适用于基于 RFID 的库存系统——而 RADAR 自身的自主结账路线图让这种连接越来越可能。EMEA
              扩张会让 RADAR 受到各国 DPA 执法制度约束，要求显著严于当前美国实践。IP 方面，US20230252283A1 等 RFID 零售专利覆盖 overhead RFID 零售技术的若干方面；RADAR
              针对该专利及相关专利的 freedom-to-operate 状态，未在任何公开文件中获得确认。FCC 消费者指南明确提示零售环境中单品级 RFID
              读取存在隐私敏感性，这说明监管关注并非假设。合在一起，这些监管、安全和 IP 暴露可能带来合规整改成本、执法行动，或被迫改变产品架构，而当前估值并未体现这些成本。
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
