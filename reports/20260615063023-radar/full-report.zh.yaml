              这个竞争格局中的任何供应商——RADAR、Zebra、Checkpoint、Impinj、Trigo 或 Focal——都没有公开披露单店定价、ACV、毛利率或合同期限。RADAR
              商业模式可推断为捆绑硬件的经常性订阅，但实际单店 ACV、续约率和毛利率结构必须在数据室中验证，财务建模才可靠。这本身不构成竞争劣势，但代表可得公开证据中的关键缺口。
