      - number: '7.4'
        title: 自主结账规模化与竞争替代风险
        blocks:
          - type: paragraph
            body: >
              RADAR 的中期路线图包括自主结账，而这个产品类别的商业化难度已显著高于早期支持者的预期。Techpinions
              发表过一篇详细批评，指出自主零售比预想更难，原因包括传感器融合复杂、多模态校准要求高、边界案例失败率高，以及隐藏集成成本。Amazon 于 2024 年从 Fresh 杂货门店撤退 Just Walk Out
              提供了最清晰的市场先例：即便是一家拥有庞大资本和算力资源的科技公司，也未能达到大众市场杂货自主结账所需的准确性和单位经济性，从而验证了怀疑者案例。

              来自 incumbent RFID 厂商的竞争替代是平行威胁。Zebra Technologies 2025 年收入约为 $4.3
              billion，运营着覆盖数千个零售账户的装机基础，并拥有深度集成伙伴关系。Checkpoint Systems 和 Sensormatic 在零售防损 RFID
              中占据稳固位置，可能向上扩展到库存分析。Impinj 以约 $380 million 的 2025 年收入主导 RFID
              半导体供应链，并拥有直接零售商关系，可支持其垂直延伸到软件和分析——事实上从下游作为关键供应商挤压 RADAR。Focal Systems、Trigo 和 Standard.ai
              等计算机视觉初创公司提供自主门店运营的替代路线，构成间接竞争。RADAR 标称 99% 或更高库存准确率的主张来自公司营销，尚未由第三方审计、学术研究或披露方法论的公开客户案例研究独立验证。
            claimRefs:
              - CR022
              - CR023
