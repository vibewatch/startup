  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 许可 / 案件
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓释
      - 剩余暴露
      - 尽调路径
    rows:
      - - GDPR / DPA 执法——RFID 与会员数据联结
        - 欧盟 / 成员国
        - 监管环境活跃；RADAR 尚未进入 EMEA
        - 若推进 EMEA 扩张，为中等
        - 高——潜在罚款最高可达全球收入 4%
        - 隐私内置架构；数据最小化政策
        - 未知——未确认 DPIA 或 DPA 备案
        - 索取数据保护影响评估和 DPA 律师意见
      - - FCC Part 15 UHF 频谱（902–928 MHz RAIN RFID）
        - 美国
        - 稳定；无待决重新分配提案
        - 低——频谱历史上稳定
        - 若重新分配迫使硬件改造，则为关键
        - 现有 FCC 许可；通过 RFID 行业组织游说
        - 若频段收紧，门店群硬件可能搁浅
        - 跟踪 FCC 程序；评估硬件路线图中的替代频率能力
      - - NIST SP 800-98 RFID 安全合规
        - 美国联邦
        - 指引已发布；零售业无强制执行
        - 中——企业零售客户可能要求合规
        - 中——审计发现可能推迟企业销售
        - 落地 SP 800-98 控制；委托第三方渗透测试
        - 无公开证据显示已获合规认证
        - 索取独立 RFID 安全审计；确认客户合同安全要求
      - - 专利 US20230252283A1——头顶式 RFID 零售方法
        - 美国
        - 已授权；相对 RADAR 的 FTO 状态未公开确认
        - 中——可能与 RADAR 核心方法重叠
        - 高——禁令或版税要求可能扰乱运营
        - RADAR 持有自身方法专利；存在交叉许可可能
        - 没有 FTO 分析则未知
        - 委托合格知识产权律师开展自由实施分析
      - - CCPA / CPRA——结账环节消费者 RFID 数据联结
        - 加利福尼亚
        - CCPA 已生效；自主结账数据范围不清
        - 若 RADAR 自主结账联结到消费者 PII，则为高
        - 中——罚款和整改成本
        - 结账环节消费者披露和选择退出架构
        - 未确认结账数据是否落入 CCPA 范围
        - 索取自主结账 CCPA 适用性法律意见；审查隐私政策
    notes: |
      可能性和严重性评级是截至 2026 年 6 月，基于公开监管文件、FCC 案卷、NIST 指引和专利记录得出的定性判断。RADAR 是私营公司；实际合规状态和法律暴露未公开披露，需要管理层尽调确认。
    enumerationScope:
