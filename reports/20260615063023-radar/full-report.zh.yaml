  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: standard
    summary: 规模证据、财务缺口和可比公司分析如何共同导向 PASS / 继续研究建议。
    data:
      nodes:
        - id: n1
          label: 规模证据
          detail: 1,400+ 家已部署门店、每月 100+ 个新地点、$170M Series B，投后估值 $1B
        - id: n2
          label: 市场背景
          detail: RFID 零售市场 $16B+，CAGR 8-9%；AI 顺风；零售数字化正在加速
        - id: n3
          label: 产品证据
          detail: American Eagle 全队列；Old Navy 分阶段推广；有记录的 ROI 指标（公司报告）
        - id: n4
          label: 财务不透明
          detail: 未披露 ARR、毛利率、NRR 或定价；三种估值方法都依赖代理指标
        - id: n5
          label: 可比估值
          detail: Impinj 11.2x P/S、Samsara 12.1x P/S；若按 12x 清过可比中点，需要 $83-100M ARR
        - id: n6
          label: 集中度和退出风险
          detail: 2 个战略锚定客户；KPMG 2026 年 Q1 称 IPO 窗口受限；存在 down-round 风险
        - id: n7
          label: 建议
          detail: PASS / 继续研究 — 公司本身有吸引力，但价格无法验证；尽调前置条件定义了入场条件
      edges:
        - from: n1
          to: n7
          label: 支撑
        - from: n2
          to: n7
          label: 支撑
        - from: n3
          to: n7
          label: 支撑
        - from: n4
          to: n7
          label: 约束
        - from: n5
          to: n7
          label: 锚定
        - from: n6
          to: n7
          label: 抬高风险
    claimRefs:
      - CV001
      - CV003
      - CV015
      - CV020
      - CV035
      - CV039
  - id: FV002
    title: ACV 与收入倍数的估值敏感性
    type: bar
    layout: wide
    summary: 以 1,400 家活跃门店为基础门店数，测算不同单店 ACV 和收入倍数组合下 RADAR 的隐含企业价值。
    approximationNotes: 所有数值都由已披露门店数（1,400）乘以假设 ACV 推出。尚无已确认 ARR 或 ACV。收入倍数来自公开可比分析（Impinj 约 11x、Samsara 约 12x、Zebra 约 2x、私营公司中点约 9–11x）。
    data:
      items:
        - label: ACV $25K / 8x 倍数
          value: 280
          unit: $M EV
          context: 熊市情景经济性，熊市可比倍数
        - label: ACV $25K / 12x 倍数
          value: 420
          unit: $M EV
          context: 熊市情景经济性，中位可比倍数
        - label: ACV $45K / 8x 倍数
          value: 504
          unit: $M EV
          context: 基准情景 ACV，保守倍数
        - label: ACV $45K / 12x 倍数
          value: 756
          unit: $M EV
          context: 基准情景 ACV，中位倍数 — 低于 $1B
        - label: ACV $45K / 16x 倍数
          value: 1008
          unit: $M EV
          context: 基准情景 ACV，需要高增长溢价才能达到 $1B
        - label: ACV $65K / 10x 倍数
          value: 910
          unit: $M EV
          context: 牛市情景 ACV，保守倍数 — 接近 $1B
        - label: ACV $65K / 12x 倍数
          value: 1092
          unit: $M EV
          context: 牛市情景 ACV，中位倍数 — 支撑 $1B
        - label: ACV $75K / 12x 倍数
          value: 1260
          unit: $M EV
          context: 高端 ACV 牛市情景，中位倍数 — 明确上行
    claimRefs:
