      - number: '6.4'
        title: 客户结果与 ROI 证据
        blocks:
          - type: paragraph
            body: >
              RADAR 引用了几项量化 ROI 数据，全部来自公司传播或 CEO 层面证词，而非独立第三方审计。Spencer Hewett 于 2026 年 5 月告诉 Forbes，RADAR 客户实现了“10% or
              more in in-store revenue growth”。PYMNTS 投资 tracker 文章报道，某零售商的 BOPIS 订单取消率在采用平台后从 25% 降至 3%——该统计归因于 Jay
              Schottenstein 对 CNBC 的评论。另一个 pilot 部署据称实现了 60% 的 shrink 降幅，但该数字没有给出客户名称或方法论。

              平台的核心准确性主张——单品级库存准确率 99%，而非 RFID 零售商通常低于 70%——得到多个来源佐证。BusinessWire
              新闻稿把它定位为基础产品主张，关于库存准确性缺口的独立零售行业研究（SCMR、ISM World）也确认，低于 70% 的准确率是公认行业问题。RADAR 每天处理超过 100 billion
              条单品级事件，提供了支撑其准确性主张的数据密度。

              这些结果数字由公司引用，缺乏独立验证。RADAR 尚未发布经审计案例研究、Gartner Peer Insights 评价或第三方 benchmark。缺少 G2/Capterra
              评价和独立分析师评估，意味着结果主张无法交叉验证。尽调应要求客户 reference calls，并在可能情况下获取 AEO 和 Old Navy 的运营数据，以确认收入和 shrink 指标。
