  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：核心库存智能与相邻自动化品类
        blocks:
          - type: paragraph
            body: >-
              RADAR 不应套用单一、庞杂的「零售 AI」市场数字来估值。最强证据支持分层市场结构。中心是基于
              RFID、实时数据采集和分析的商品级零售库存智能；外围是更广的自动识别和资产可视化市场，涵盖移动计算、打印、机器视觉和自助服务工作流；旁边则是相邻的自主结账品类，RADAR
              可以切入，但核心论点不需要靠赢下它成立。这个区分很重要：核心库存可视化问题真实且紧迫——实体零售仍占商业大头，零售商仍受库存准确率不足困扰，全渠道履约又把门店变成微型履约节点——但相邻的结账自动化有不同的采用曲线、经济性和风险曲线。最强公开证据还显示，零售商购买这些系统是为了解决正在发生的运营痛点，而不是尝鲜。因此，尽调的正确框架应是「库存智能第一，自主结账第二」。
