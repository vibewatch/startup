      - number: '2.4'
        title: 顺风真实存在，但承销应区分可执行的可视化需求与投机性的结账上行空间
        blocks:
          - type: paragraph
            body: >-
              2026 年市场背景有利：零售商和基础设施供应商都在描述一个从试验走向执行的转变，主题包括统一商业、AI 辅助决策、RFID 可视化和门店自动化。这利好 RADAR
              的核心库存智能论点。但约束同样重要。库存准确率问题长期存在，不过集成、硬件部署、隐私担忧，以及完全自主结账的经济性，仍会拖慢推广速度。第三方结账市场报告把劳动力压力和客户需求列为增长驱动，但独立和学术来源仍警告，无结账零售运营难、隐私敏感。资本强度和工作流变更管理也意味着，短期采用大概率仍由企业客户主导。对投资人来说，结论很直接：RADAR
              主要应围绕库存可视化、履约准确率和损耗降低预算来承销，自主结账则作为上行空间，而不是基准情形。这个框架仍留下足够大的市场，同时避免品类膨胀。
