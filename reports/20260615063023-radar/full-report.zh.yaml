  - id: TM002
    title: 买方细分与购买驱动地图
    columns:
      - 买方细分
      - 运营触发点
      - 典型高管赞助人
      - RADAR 为什么匹配或不匹配
    enumerationScope:
      coverage: partial
      basis: >-
        Representative enterprise-retail segments inferred from the reviewed sources; not a complete global retailer
        census.
    rows:
      - - 大型服装连锁
        - 全渠道订单需要覆盖卖场、试衣间和库房的单品级可视化
        - 门店运营、技术 / 数字、库存、防损
        - 最匹配，因为服装品类本就更靠前采用 RFID，SKU 准确率直接影响履约和损耗。
      - - 综合商品 / 百货门店
        - 复杂品类组合和全渠道履约压力
        - 运营、商品系统、防损、全渠道商务
        - 若 RFID 采用度和门店人工痛点足以支撑头顶式部署，就是良好匹配。
      - - 食杂 / 会员仓储 / 食品零售
        - 排队减少和结账自动化可能比试衣间可视化更重要
        - 门店运营、前端、支付、技术
        - 匹配更复杂：结账相邻性相关，但 RADAR 最强验证尚不在食杂。
      - - 便利店 / 场馆
        - 快速结账和无摩擦购物
        - 运营、支付、场馆技术
        - 可能是相邻市场，但当前证据密度低于企业服装门店网络。
      - - SMB 商户
        - 基础库存管理和 POS 集成
        - 业主经营者
        - 匹配较弱，因为硬件和安装复杂度可能需要企业级预算和规模。
    notes: 高管赞助人角色根据客户引述、供应商采购模式和工作流范围推断。公开来源对采购委员会方向的支持强于对准确预算所有者的支持。
    claimRefs:
      - CM012
      - CM013
      - CM030
      - CM033
      - CM034
      - CM035
