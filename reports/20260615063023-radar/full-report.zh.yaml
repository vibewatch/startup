  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入（阻断项）
        - 截至上一季度末的经审计 ARR；过去两个财年的总收入；YoY 增长率
        - ARR 是三种估值方法的首要输入；没有它，就无法验证收入倍数或情形矩阵；任何价格敏感投资决定都被阻断
        - 向 CFO Abi Viswanathan 索取；要求审计确认；核验硬件收入确认政策（一次性确认 vs. 分期确认）
      - - 毛利率（阻断项）
        - 过去四个季度的硬件毛利率、软件毛利率和综合毛利率
        - 决定 RADAR 的经济性更接近 Impinj（52.5%）还是 Samsara（76.7%），也决定公司规模化后是否资本高效；影响 DCF 和长期退出倍数假设
        - 索取分部 P&L，要求硬件 COGS 与软件订阅 COGS 分开披露；与经审计财务对账
      - - NRR 和 Cohort 数据（阻断项）
        - 按客户 cohort 列示的 Net Revenue Retention、Gross Revenue Retention 和扩张曲线
        - NRR 决定 land-and-expand 引擎是否有效；AEO 和 Old Navy 在既有关系内扩张，可能抬高门店数标题数字，却不代表新增 ARR
        - 向 CFO 索取 NRR 明细；具体询问 AEO 和 Old Navy 的全门店扩张计入基础 ARR，还是作为增量
      - - ACV / 定价（阻断项）
        - 按客户规模层级列示的单店平均年度合同价值，以及硬件定价（租赁 vs. 销售）
        - 这是检验情形矩阵假设的必要条件；$25K ACV 与 $65K ACV 的差异决定 $1B 是公平价格还是严重偏高
        - 索取企业主协议模板、价格表和代表性 SOW；确认硬件是预付、租赁，还是包含在 ACV 内
      - - 烧钱率和现金头寸（重要项）
        - 最近三个月月度现金消耗；当前现金余额；18 个月财务预测
        - $170M 只能提供方向性的跑道安慰；没有烧钱数据就无法评估是否足够。若每月烧钱 $20M，Series B 完成后跑道 <9 个月
        - 索取资产负债表以及 CFO 编制的烧钱和跑道明细；核验国际扩张和硬件 R&D 是否完整计入烧钱预测
      - - 客户集中度（重要项）
        - 前 3 大客户收入占总 ARR 的百分比；按收入区间拆分的客户数量
        - AEO 和 Old Navy（均为战略投资人）集中度高，削弱参考客户独立性论点；需要确认集中度是否超过 ARR 的 80%
        - 向 CFO 索取客户收入报告；确认次级客户（如 Levi's、其他试点）是付费合同还是非收入试点
    notes: 列为阻断项的问题必须在投入资本前解决；重要项影响置信度和估值，但若其他条件满足，不必然阻止投资。顺序：第 1–3 项应在首次管理层会议处理；第 4–6 项在后续尽调中处理。
    claimRefs:
