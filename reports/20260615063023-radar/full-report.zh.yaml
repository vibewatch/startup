  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与变现流
        blocks:
          - type: paragraph
            body: >-
              RADAR 的收入模式垂直整合、由硬件牵引，但长期经济性落在经常性软件和分析上。公开可描述的技术栈有三层。第一，自研天花板传感器安装在零售门店——RADAR 是唯一公开披露、规模化提供头顶式 RFID
              传感器的供应商；任何部署都必须购买或租赁这些传感器。硬件没有公开标价。第二，实时软件平台位于硬件之上：处理连续 RFID
              位置流，把原始标签事件转成运营动作（补货提醒、履约路由、防损触发、陈列智能），并接入零售商现有系统。RADAR 将其描述为持续服务，而非一次性许可，这意味着经常性订阅收入。第三，分析和 AI 层在 2026
              年初随 Fitting Room Intelligence 和 Floor Set IQ
              上线而显著扩展，提供超越库存位置的行为和需求洞察。这些能力被定位为高级功能，但未知是单独定价，还是打包进基础订阅。官方材料披露的商业模式是「硬件加软件加分析」，对应工业 IoT
              平台常见的混合收入架构。硬件部分给零售商或 RADAR 带来前期资本支出（取决于 RADAR 是销售还是租赁），软件层则按门店创造经常性年度合同价值。RADAR
              官方称要把「电商级智能」带入实体门店，这与按门店或按地点的 SaaS 定价模型一致，但没有任何价格层级、合同最低额或 ACV 区间公开披露。RADAR 还称计划用 Series B
              资金开发自主结账，把它作为增量收入机会。它将构成第三个变现层，可能需要不同定价机制——例如按交易或按结账事件收费——但仍在开发中，尚未贡献已报告收入。向 Canada、EMEA 和 Latin America
              国际扩张代表地理收入上行空间，同样没有披露财务目标。Old Navy 部署背景提供了间接规模锚点。Gap Inc. 披露，2024 财年末 Old Navy North America 有 1,249
              家门店；若按单店定价模型全面部署，将形成显著合同价值。现有已点名客户的总可寻址收入（American Eagle 全门店网络数百家门店，加上分阶段推广的 Old
              Navy）显示，在更多企业零售商完成全量部署前，集中度风险仍然重大。Forbes 报道称，截至 2026 年 5 月约十几家零售商处于活跃试点，这符合一个缓慢爬坡、如今由 Series B
              资本加速的企业市场进入路径。
