      - number: '4.5'
        title: 公开可比公司、估值倍数与隐含收入区间
        blocks:
          - type: paragraph
            body: >-
              RADAR 的 $1 billion 投后 Series B 估值包含增长溢价；只有投资人假设其收入倍数明显高于公开市场 SaaS 基准，这个估值才说得通。截至 2026 年 6 月，POS & Retail
              Management Software 类别的公开垂直 SaaS 可比公司约按 1.6x NTM 收入交易（multiples.vc），Supply Chain Management Software 约为
              3.1x，AI 原生应用约为 3.8x NTM 收入。Aventis SaaS advisors 报告显示，截至 2026 年 3 月，公开市场 EV/Revenue 中位数约为 3.4x，反映出相较 2021
              年峰值的显著压缩，以及 AI 对横向 SaaS 带来的扰动压力。把这些区间套到 RADAR 的 $1 billion 估值，会得到一个隐含 ARR 区间：按 1.6x（POS /
              零售可比公司中位数）计算，隐含收入约为 $625 million——对这一阶段的公司来说高得不可信。按 15-25x（高增长 AI + 硬件平台的成长阶段私募溢价）计算，隐含 ARR 为 $40-67
              million。按 30-50x（已有规模化路径的早期独角兽）计算，隐含 ARR 为 $20-33 million。这些区间只是机械反推——RADAR
              并未披露收入——但说明投资人在定价强劲的超高增长预期，而不是当前基本面。RFID 基础设施可比公司同样重要。Impinj FY2025 收入为 $361.1 million，non-GAAP 毛利率
              55.3%；Q4 2025 出现环比走弱（$92.8M），Q1 2026 指引为 $71-$74M，暗示行业库存周期存在逆风。Impinj 按半导体倍数而非软件倍数交易，反映其芯片加平台模式。Zebra
              Technologies 作为成熟的硬件加服务 incumbent，EV/Revenue 约为 2x（收入 $5.4B，EBITDA 利润率中等）。两家公司都不能直接映射到 RADAR 的 AI
              软件加专有硬件模式，但它们为利润率轮廓设定了上限和下限。RADAR 未来状态最相关的可比对象，应是带硬件 attach 模式的垂直 AI SaaS 公司（可类比服务机器人、计算机视觉平台或工业
              IoT），这类公司在强增长下历史上约按 5-15x 收入交易。若假设当前 ARR 为 $30-50 million、倍数为 10x，RADAR 的企业价值将为 $300-500 million——低于当前 $1
              billion 估值——说明当前估值已经计入未来 2-3 年至少 40-50% 年增长。能否做到，取决于 RADAR 多快能新增企业客户关系（Series B
              正是为解决这一瓶颈而设计），以及硬件商品化后其软件利润率能否扩张。自助结账和自主零售的市场背景提供了机会框架：2025 年全球自助结账系统市场规模约为 $5.3-5.8 billion，CAGR 为
              13-14%。如果 RADAR 的自主结账野心落地，单店收入可能显著超出单纯库存智能。
