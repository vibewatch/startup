        blocks:
          - type: paragraph
            body: >-
              创始人 Spencer Hewett 仍是 RADAR 最核心的公开面孔；公司、客户和财经媒体来源均持续将其称为创始人兼首席执行官。2026 年 5 月，RADAR 任命 Abi Viswanathan 为
              CFO，信号很明确：在更大规模部署阶段前，公司正从创始人主导的早期扩张，转向更正式的财务和运营纪律。公开投资方披露更偏向列明出资方，而非治理细节。2026 年 5 月 Series B 由 Gideon
              Strategic Partners 和 Nimble Partners 共同领投，Align Ventures 参投；更早的官方材料列出 Founders Fund、Y Combinator、Sound
              Ventures、Beanstalk、Gideon VC 和 Agnelli family 等支持者。战略零售资本尤其值得注意：2025 年 3 月材料将 American Eagle、Gap Inc. 和
              Lojas Renner 列为公司零售支持者；CNBC/PYMNTS 明确称 American Eagle CEO Jay Schottenstein 既是支持者，也是 RADAR
              首个全门店零售客户的负责人。仍不透明的是董事会构成、持股比例和准确的完全摊薄股权表，这些都需要管理层尽调，桌面研究无法替代。
