      - number: '4.6'
        title: 财务结论、未披露指标与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              RADAR 的财务画像符合早期独角兽、硬件加软件零售 AI 平台的特征：它已在有意义的规模上证明了企业概念验证（1,400+ 家门店），但尚未达到承销所需的透明度门槛。$1 billion 估值有强客户口径
              ROI 数据、大且增长中的装机基础、以及独特数据资产（每日 100+ billion 条商品事件）支撑，但它隐含的 ARR 对估值倍数要求公司在未来 2-3
              年交付超高增长，才足以对抗公开市场基准。收入质量问题卡在三个未知数上：（1）RADAR 的单店 ACV 是否足够大，能从 1,400 家门店产生实质 ARR；（2）现有账户的 NRR
              随部署成熟是在扩张还是持平；（3）新增企业客户获取能否以足以支撑估值内嵌增长溢价的节奏完成。三项都未披露。硬件经济性是次要担忧：RADAR
              的天花板传感器架构可能比基于摄像头的竞争对手更具成本效率，但实际硬件毛利率未知，下一代硬件投资也会在短期消耗 capex。从资本角度看，$170 million Series B 提供了有意义的
              runway，也释放出强投资人信心；但现金头寸、burn rate 和收入均未披露，使资本充足性只能给出方向性舒适感，无法严肃评估。战略投资人基础增加稳定性，也带来集中度风险。新 CFO
              任命是财务纪律的正向信号，投资人应期待 RADAR 未来拿出明显更好的财务报告——但这些数据尚未公开。多家独立分析机构的 RFID 市场数据确认，RADAR 所处市场具备结构性增长（2026 年全球零售 RFID
              为 $15.97 billion，以约 9% CAGR 增至 2035 年 $34.5 billion），为长期收入增长提供需求侧支撑。不过，Zebra、Impinj、Checkpoint 以及新兴 AI
              玩家带来的竞争强度，可能在 incumbent 加速推出自身全栈 RFID 加分析方案时压缩利润率或拖慢部署速度。零售业面临的库存准确性问题结构性真实且持续存在（SCMR、RFID 市场分析师和客户 ROI
              数据均可印证），但 RADAR 作为解决方案提供商能获得的具体财务回报仍未量化。
