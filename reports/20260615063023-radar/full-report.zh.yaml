  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              RADAR 卡在 RFID 基础设施与 AI 软件分析的交叉点，位置独特，但竞争横跨四个必须拆开的品类。第一类是基础设施在位者，以 Zebra Technologies 和 Impinj
              为代表，提供任何部署底层都需要的 RFID 读写器、芯片和打印机；Zebra 还销售工作流软件，并已开始把 AI 嵌入产品组合。第二类是 Checkpoint Systems、Sensormatic 等 RFID
              加软件一体化供应商，提供端到端系统，历史上更聚焦 EAS 防损和基础库存跟踪，没有 RADAR 的实时天花板传感器模式。第三类是计算机视觉优先的 AI 同行——Trigo、Focal Systems 和
              Standard AI——追求同样的门店智能结果，但传感器栈基于摄像头而非 RFID。第四类是 Amazon Just Walk Out，服务相邻的自主结账任务，用计算机视觉和可选 RFID
              完全消除排队结账。现状替代方案——手持棒人工 RFID 扫描，定期生成某一时点的库存快照——仍是这些系统最常见的替代品，也是 RADAR 最持续替换的方案。NRF 2026
              显示竞争场在扩大：Beontag、Simbe、Wiliot、CONTROLTEK、Honeywell 和 Manhattan Associates 都展示了 RFID 或 AI
              库存解决方案，说明在位者投资平台的同时，市场也在吸引新进入者。对投资人来说，关键框架是：RADAR 是全栈平台，不是组件供应商。Impinj 卖芯片；Zebra 卖硬件套装；Trigo 卖摄像头 AI；只有
              RADAR 把自研天花板传感器、实时软件和持续学习分析打包成一个企业订阅，让零售商无需从多个供应商拼技术栈。
