      - number: '8.5'
        title: 最终尽调清单与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              以下六项尽调，是在 $1B 或接近 $1B 价格下作出任何投资决策的前置条件。它们按重要性而非获取难度排序。第 1–3 项是阻断项：没有它们，价格无法验证。第 4–6
              项重要但不阻断；它们影响投资的置信度，而非可行性。论点失效触发器同样重要。它们定义了投资论点被证伪的条件——也就是在有利尽调基础上作出投资建议后，何时必须撤回或减记。关键触发器包括：ARR 同比增长放缓至 30%
              以下（说明落地后扩张引擎趋于平台期）、NRR 降至 100% 以下（说明已安装客户群内出现流失）、American Eagle 或 Gap Inc. 下调部署计划（说明旗舰客户在全门店规模下没有产出
              ROI），以及 RADAR 在 Series B 后 12 个月内未能新增超过 2–3 个企业客户关系（说明 $170M
              加速计划没有落地）。任何单一触发器都应引发重新评估；两个触发器同时出现，可能足以推翻基准和牛市情景。自动结账的论点失效要单独看：如果 RADAR
              宣布自动结账产品的单店成本显著高于当前仅库存部署（例如结账需要更多传感器、摄像头或集成复杂度，且超过目前披露），$1B 价格中嵌入的期权价值就会被侵蚀。Amazon 的明确失败是最相关的先例，而 RADAR
              尚未披露足够的结账架构技术细节，无法判断它是否解决了 Amazon 没解决的关键经济障碍。
            claimRefs:
