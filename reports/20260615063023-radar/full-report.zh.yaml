  - id: TR005
    title: 缓释地图与否决标准
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 客户集中度（AEO 或 Old Navy 回滚）
        - 关于部署暂停或回滚的公开公告、AEO/Gap SEC 文件或 RADAR 新闻稿
        - 任一锚定客户公开暂停、缩减或终止 RADAR 部署
        - 打破投资逻辑：重新评估投资；寻求合同补救；评估剩余试点转生产管线转化率
      - - 硬件资本强度 vs. 资金跑道
        - RADAR 融资节奏、已宣布人员变化，或披露的每季度部署速度下滑
        - 18 个月内需要下一轮融资，或披露部署速度低于 100 家门店 / 季度
        - 立即融资；探索轻资产授权或合作伙伴模式，降低单店 capex 要求
      - - 监管升级（FCC 频谱、GDPR、CCPA）
        - FCC 针对 900 MHz 频段的 NPRM；EU DPA 对任何 RFID 零售运营商采取执法行动；California AG CCPA 执法行动
        - FCC 就 UHF 频谱启动正式规则制定；DPA 向任何零售 RFID 运营商发出执法通知
        - 聘请监管律师；委托合规评估；在国际扩张时间表中加入监管缓冲
      - - 竞争挤压（Impinj 纵向整合或 Zebra 平台动作）
        - Impinj 发布分析软件或 AI 库存产品；Zebra 收购库存智能创业公司；AEO/Old Navy 披露正在评估替代 RFID 平台
        - 任一锚定客户开始正式评估竞争性 RFID 分析平台
        - 加快在自主结账和 AI 分析上的差异化；若可行，与锚定客户谈判排他窗口
      - - 财务不透明与证据质量披露
        - RADAR 申请 IPO 或披露经审计财务；独立分析师发布 RADAR 财务评估；媒体质疑客户结果指标
        - 经审计收入、NRR 或单位经济披露，且显著低于 Series B 隐含指标
        - 修订估值；要求管理层澄清客户指标方法和审计状态
    notes: |
      阈值和行动含义是基于公开可比案例和行业常态推导的示例性指引，并非合同义务。实际触发监测需要董事会级别访问 RADAR 内部报告；截至运行日期，该信息并未公开。
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评级 / 立场
      - 理由
    rows:
      - - 投资建议
        - 放弃 / 继续研究
        - 牛市情形下 $1B 可以自洽，但没有 ARR、毛利率和 NRR 披露就无法验证。以当前证据质量，不能给出价格敏感的买入建议。
      - - 置信度
        - 低–中
        - 规模和部署证据强；财务不透明限制对价格是否合理的判断。若有经审计 ARR 和分部毛利率，置信度会大幅提高。
      - - 风险评级
        - 高
        - 客户集中（2 个战略锚定客户）、硬件 COGS 不确定、自主零售执行风险、未披露烧钱，以及受限的 IPO 退出窗口，共同构成高风险画像。
      - - 估值立场
        - 基准情形偏贵；牛市情形合理
        - >-
          若 ACV 为 $45K / 店，隐含 ARR ≈$63M，$1B = 15.9x，偏紧。若 ACV 为 $65K / 店，隐含 ARR ≈$104M，$1B = 9.6x，相对 Impinj 和 Samsara
          上市可比公司可辩护。
      - - 目标回报 / 入场价格
        - 只有在 ARR ≥$75M、增长 ≥50%、NRR ≥110% 时，才接受 $1B 入场
        - 若尽调确认牛市指标，$1B 是公平价格。若适用基准指标，应谈到 $600–750M。熊市情形下，若没有新的企业客户证据，任何价格都应放弃。
    notes: 建议评级仅基于公开证据。所有财务指标（ARR、毛利率、NRR、烧钱）均由门店数代理变量和公开可比基准估算；RADAR 未披露，也未由独立方验证。
    claimRefs:
      - CV001
      - CV020
      - CV023
      - CV024
      - CV036
      - CV039
  - id: TV002
    title: 投资逻辑与反逻辑
    columns:
      - 论点
      - 支持证据
      - 什么会改变判断
    rows:
      - - 率先规模化的顶部 RFID 平台
        - 1,400+ 家门店部署；大店型服装零售中唯一已知的天花板传感器 RFID 供应商
        - 出现可行的低成本竞争者，且具备可比的天花板传感器架构；关键客户流失
      - - 头部客户背书证据
        - American Eagle 全门店 + Old Navy 分阶段铺开；记录了 10%+ 店内收入提升和 >60% 损耗下降（公司报告）
        - 独立审计显示客户 ROI 指标被显著夸大，或仅限于一小部分部署
      - - 庞大且增长中的 RFID 市场顺风
        - 零售 RFID 市场 2026 年约 $16B，CAGR 8–9%；企业零售数字化加速
        - 市场增速降至 <5% CAGR；零售商选择替代库存方案（条码、计算机视觉或更便宜的 RFID 配置）
      - - 资本基础强，机构投资人加持
        - 累计融资 $270M；Founders Fund、YC、Sound Ventures、战略锚定方；新 CFO 来自 Nuro
        - 烧钱超过 $20M / 月（未披露）；资本不足迫使稀释性 down-round
      - - 未披露财务画像
        - 未披露 ARR、毛利率、NRR 或定价；无法验证估值精度
        - 若披露 ARR <$50M 且增长 <40%，将确认基准 / 熊市情形，并否定 $1B 价格
      - - 战略投资人利益一致性风险
        - American Eagle CEO（锚定投资人）和 Gap Inc.（共同投资人 + 锚定客户）都在维持 RADAR 高估值上有财务利益
        - 第三方独立客户审计确认 ROI 真实，且客户满意度符合公平交易关系
      - - 自主结账执行风险
        - Amazon Go / Amazon Fresh 门店关闭或改造；TechPinions 称自主零售「比任何人预期的都更难」
        - RADAR 在 50+ 个地点跑通结账试点，并公布单位经济，证明成本可与标准结账基础设施竞争
    notes: 投资逻辑锚定已披露证据；反逻辑同时包含当前担忧和会进一步削弱逻辑的条件。「改变判断」列描述的是会修复或放大担忧的证据。
