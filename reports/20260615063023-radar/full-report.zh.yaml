companyProfile:
  summary: >-
    RADAR（法律实体：Automaton, Inc. dba RADAR）是一家垂直整合的零售科技公司，在零售门店安装自研头顶式 RFID 天花板传感器，并在其上叠加实时库存智能、分析和履约软件。公司由 Spencer Hewett
    于 2013 年创立，采用硬件加经常性 SaaS 模式：每家实体门店部署传感器，连续运行的软件平台把 RFID 信号流转成补货、全渠道履约、防损和陈列工作流。截至 2026 年 5 月，RADAR 已上线超过 1,400
    家门店，并以 $1B 投后估值完成 $170M Series B。其两个公开确认的生产规模客户——American Eagle Outfitters 和 Old Navy（Gap
    Inc.）——同时也是战略投资方，这种双重身份影响了公司的披露姿态。收入、ARR、毛利率和 NRR 均未公开；财务画像仍是私有且未披露。
  foundedDate: null
  founders:
    - name: Spencer Hewett
      role: 创始人兼 CEO
      background: 唯一创始人；自公司 2013 年创立以来一直主导客户、投资方和产品战略。
      claimRefs:
        - CO010
        - CO011
  foundingLocation: null
  headquarters: New York, New York
  productSummary: >-
    头顶式 RFID 天花板传感器阵列覆盖卖场、仓库和试衣间，以 8 秒一次的节奏读取商品级标签、生成全量库存快照，并把数据送入实时软件平台，输出补货提醒、BOPIS 履约路由、损耗检测和陈列智能。高级分析层（Fitting Room
    Intelligence、Floor Set IQ）进一步提供行为和需求洞察。自主结账在产品路线图上，由 Series B 资金支持。
  customerFocus: 大型服装和专业零售企业客户。
  businessModel: 按门店销售或租赁自研天花板传感器，并按门店、按年收取经常性软件和分析订阅费。准确 ACV、合同期限和价格层级均未公开。自主结账目前仍在开发中，若落地将形成额外变现层。
  stage: Series B
  fundingStatus: >-
    2026 年 5 月完成 $170M Series B，投后估值 $1B，由 Gideon Strategic Partners 和 Nimble Partners 共同领投，Align Ventures 参投。此前已披露融资超过
    $100M，来自 American Eagle、Gap Inc.、Lojas Renner 等战略支持者，以及 Founders Fund、Y Combinator、Sound Ventures、Beanstalk、Gideon
    VC 和 Agnelli family 等财务投资方。累计融资总额估计约 $270M。
