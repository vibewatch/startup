  - id: TV005
    title: 打破投资逻辑与否决标准触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 传导到投资逻辑
      - 行动含义
    rows:
      - - ARR 增长减速
        - YoY ARR 增长跌破 30%
        - 削弱 $1B 估值内含的增长溢价倍数；按当前价格，基准情形隐含倍数升至 20x+
        - 重新评估入场价格；若确认，目标 $500–650M；在 Series C 推迟或退出持仓
      - - NRR 恶化
        - NRR 低于 100%（已安装基盘净流失）
        - land-and-expand 模型失去主要增长引擎；收入只依赖新增企业客户
        - 一经确认立即重新评估；NRR 低于 90% 几乎确定是减记信号
      - - 锚定客户部署暂停
        - American Eagle 或 Old Navy 公开放慢或暂停 RADAR 全门店扩张
        - 抽掉 60–70% 预期近期门店数增长；基准情形 ARR 坍塌
        - 立即退出或减记；投资逻辑要求两个锚定账户都执行全门店计划
      - - 新企业客户胜利低于计划
        - Series B 后 12 个月新增企业零售商签约少于 3 家（低于所称「数十家」目标）
        - 证明过去缓慢的 GTM（每年 1 个新客户）并未被新资本修复；增长只能依赖既有客户扩张
        - 发出观察警示；连续 2 个疲弱季度 → 重新评估或退出
      - - 自主结账成本超支
        - 结账产品单店需要的传感器 / 摄像头基础设施显著多于仅库存部署，且被技术规格或试点披露确认
        - 抹去 $1B 内含的结账可选性溢价；降低总可寻址扩张空间
        - 将目标估值下调 10–20%；下修牛市情形
      - - VC / 科技市场倍数压缩
        - 公开 IoT/SaaS 板块 EV/Revenue 倍数压缩至 7x 以下（例如 Impinj 市值跌至 $2.5B，或 Samsara 跌破 7x P/S）
        - 下一次流动性事件可能出现 down-round 风险；$1B 入场变成高于市场
        - 对冲持仓；入场时谈判反稀释保护
    notes: 阈值定义为投资监测触发器，不是会计阈值。每个触发器都应触发一次正式投资逻辑复评。多个触发器同时出现，通常足以否定牛市和基准情形，并启动退出评审。
    claimRefs:
