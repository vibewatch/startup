      - number: '3.2'
        title: 在位者与直接同行画像
        blocks:
          - type: paragraph
            body: >-
              Zebra Technologies 是最有分量的在位者。公司 FY2025 净销售额为 $5,396M，同比增长 8.3%，并给出一个覆盖移动计算、RFID、机器视觉和工作流软件的 $35B
              服务可寻址市场。Zebra 明确把 RFID 称为产品组合中的「亮点」，在零售、制造和物流领域势头强劲。其 RFID 竞争集合列出
              Chainway、Impinj、Invengo、JADAK、Rodinbell、TSC 和 Ubisense，而不是 RADAR，说明 Zebra 的 RFID 策略仍偏硬件，还没有直接瞄准 RADAR 的 AI
              分析层。Zebra 最深的结构性优势是分销：三家分销商分别贡献 2025 年净销售额的 29%、15% 和 15%，带来的渠道渗透是 RADAR 直接企业销售模式无法匹配的。Zebra 2025 年 9 月以
              $1.3B 收购 Elo Holdings，显示其进一步扩张到交互式显示和 POS 工作流。Impinj 是多数 RFID 部署底下的半导体与平台层。其 FY2025 收入为 $361.1M，调整后 EBITDA
              为 $69.6M；2025 年 Q4 环比转弱（$92.8M），2026 年 Q1 指引为 $71M–$74M，暗示行业库存周期逆风。Impinj
              平台面向合作伙伴，通过伙伴生态提供芯片到云连接，并不直接卖给零售商。其 Gen2X 技术增加了高级数据保护和隐私控制。Checkpoint Systems 提供垂直整合的 RFID
              方案，覆盖标签制造、读写器、软件和 EAS 防盗硬件。其从工厂到门店的源标签模式，在库存管理软件上是 RADAR 的直接竞争者，但 Checkpoint 历史取向偏资产保护，而非 RADAR 提供的连续定位 AI
              层。Trigo 每年用非生物识别计算机视觉处理超过 60M 次购物活动，并强调隐私保护内建的方法，适合 GDPR 敏感的欧洲零售商。其防损和结账自动化重点，使它在产品轴上比 RADAR 更接近 Amazon
              JWO，尽管 Trigo 和 RADAR 都声称能带来门店智能结果。Focal Systems 用 AI 摄像头追求类似货架智能用例，提供缺货检测和补货工作流，但它更像互补层，而非竞争性全栈。Amazon
              Just Walk Out（JWO）技术覆盖五个国家超过 350 家门店，聚焦小业态、任务型购物场景（机场、体育场、大学）。Amazon 于 2026 年 1 月宣布关闭 Amazon Go，并将 Amazon
              Fresh 门店转为 Whole Foods Market；这直接说明，即便对全球最大科技公司而言，大业态、杂货导向的无结账零售在运营和经济性上也很难。
