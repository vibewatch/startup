      - number: '6.5'
        title: 集中度风险、留存未知数与扩张动态
        blocks:
          - type: paragraph
            body: >
              RADAR 的客户基础存在严重集中度风险。截至 2026 年 5 月，两个企业家族——American Eagle Outfitters 和 Gap Inc. 的 Old Navy——贡献了全部 1,400+
              家生产门店部署。没有其他客户被公开确认达到生产规模。这意味着 AEO 或 Gap Inc. 任一方的合同重谈、技术路线变化或战略转向，都可能对 RADAR
              收入基础造成实质损害；不过两家公司均未公开表示有意减少部署。

              AEO 关系还把集中度风险叠加为治理担忧：Jay Schottenstein 同时是 AEO 执行董事长（RADAR 第一个且最大的客户）和 RADAR 财务支持者。虽然双重身份反映出真实的运营信念，但也意味着
              RADAR 与其锚定客户之间的合同定价和续约条款，可能并非完全按 arm's-length 商业条件建立。尽调应独立评估合同定价、续约条款，以及是否向 AEO 授予了会使未来商业客户处于劣势的优惠条款。

              RADAR 尚未公开披露 net revenue retention（NRR）、gross revenue retention（GRR）或 churn 数据。Old Navy 公告中的多年合同语言和 AEO
              持续全门店网络部署释放出耐久性信号，但它们不能替代财务留存指标。管线转化动态——2025 年 3 月 30+ 个品牌，到 2026 年 5 月收缩为约 12 个活跃
              pilot——引发了销售周期长度、竞争替代，以及平台企业级实施负担是否限制可触达速度的问题。Series B 材料披露了向 Canada、EMEA 和 Latin America
              扩张的计划，但尚无时间表、合作伙伴或这些地区的具名客户。
            claimRefs:
