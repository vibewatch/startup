      - number: '5.5'
        title: 信任、隐私与安全
        blocks:
          - type: paragraph
            body: >
              RADAR 的产品在面向消费者的环境中持续 RFID 感知，因此带来具体的信任和隐私考量。在单品层面，RFID 标签追踪的是单件商品，而不是直接追踪购物者；但任何把 RFID
              标签读取与会员账户数据或支付信息相连的系统，都会在 GDPR 和 CCPA 下把商品追踪转化为个人数据处理。RFID News UK 于 2026 年 4 月指出，与个人数据相连的 RFID
              部署需要合法处理基础；若对个人构成高风险，还需要 Data Protection Impact Assessment。RADAR 已发布的隐私政策覆盖网站访客数据，但未说明零售顾客在店内的 RFID
              标签读取实践；部署该平台的零售商必须在自身面向消费者的隐私通知中补上这个透明度缺口。NIST SP 800-98 仍是美国联邦关于 RFID 系统安全的主要参考，覆盖标签克隆防范、窃听风险和访问控制。RADAR
              尚未发布其硬件认证、FCC 合规文件，或单品级 RFID 读取日志的数据保留政策。
