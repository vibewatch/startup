  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 理想客户画像与分层
        blocks:
          - type: paragraph
            body: >
              RADAR 的理想客户画像集中在大型北美服装零售商：运营 100 家或更多门店，管理带 RFID 标签的商品，并运行
              buy-online-pick-up-in-store（BOPIS）等全渠道履约项目。主要买方是 CTO 或技术 / 运营
              VP；多年、数百万美元级资本和集成承诺需要董事会层面赞助。付款方是零售商母公司；最终用户是一线门店员工，他们通过 RADAR app 界面接收实时库存提醒并查询商品位置。

              截至 2026 年中，所有公开确认的生产部署都落在北美大众市场和专业服装垂直领域。两个锚定客户——AEO 和 Old Navy——都运营万亿级标签商品管线，并拥有成熟的全渠道基础设施，因此 RFID
              准确性会通过减少 BOPIS 取消、降低 shrink、加快补货，直接撬动收入。库存分散在卖场、库房和试衣间的零售商尤其适合这套平台——在这些环境里，手持 RFID
              扫描棒太慢，周期性扫描会留下很长的准确性缺口。RADAR 的天花板传感器模式每八秒捕获一次全店快照，正好击中这一痛点。

              截至运行日期，非服装垂直（家居用品、电子、体育）尚无任何生产部署获得确认。公司 Series B 材料提到国际扩张计划（Canada、EMEA、Latin
              America），但所有被引用部署都位于美国和加拿大。2025 年 3 月曾报道其管线超过 30 个品牌；到 2026 年 5 月，被引用的活跃 pilot 数量降至约十二个，说明可能存在转化摩擦或选择性
              onboarding，而不是线性管线扩张。
            claimRefs:
              - CU020
              - CU021
              - CU022
              - CU023
              - CU024
              - CU025
