  - id: FV004
    title: 投资 KPI — IC 就绪评分
    type: kpi
    layout: standard
    summary: 投委会使用的七维定性评分，按截至 2026 年 6 月的公开证据校准。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          unit: score
          context: RFID 零售市场 $16B+，CAGR 8-9%；毗邻自主结账；全球零售数字化顺风具备结构性且持久
        - label: 产品和部署证据
          value: 7 / 10
          unit: score
          context: 1,400+ 家门店上线；两个旗舰企业部署达到规模；有记录的客户 ROI 指标（公司报告）；自主结账在开发中，增加可选性
        - label: 竞争护城河
          value: 7 / 10
          unit: score
          context: 专有天花板传感器架构；软件平台粘性；大型服装 RFID 的先发位置；AEO 和 Gap Inc. 作为战略投资者构成壁垒；面对资本充足的新进入者时较弱
        - label: 商业经济性
          value: 4 / 10
          unit: score
          context: 未披露 ARR、毛利率或 NRR；硬件 COGS 带来营运资本强度；如果确认 ARR $75M+、毛利率 $55%+、NRR 110%+，评分会升至 7+
        - label: 管理层和执行
          value: 7 / 10
          unit: score
          context: Spencer Hewett（创始人 / CEO）展现出耐心的企业销售执行力；CFO Abi Viswanathan（曾任 Nuro、Uber）补上机构化财务能力；国际扩张 + 结账 + 硬件路线图并行，带来执行风险
        - label: 估值支撑
          value: 5 / 10
          unit: score
          context: 牛市情景合理（ACV $65K+ 隐含 ARR $100M）；基准情景偏紧（ACV $45K 隐含 ARR $63M，16x）；证据不足，无法确认哪个情景正确
        - label: 证据质量
          value: 3 / 10
          unit: score
          context: 七个阻断性或重大证据缺口；所有财务指标未披露；客户指标由公司报告；战略投资者关系限制参考证据的独立性；不透明度对评分惩罚很重
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV020
      - CV035
      - CV041
      - CV042
