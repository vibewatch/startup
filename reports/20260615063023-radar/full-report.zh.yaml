  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              RADAR 将自己定位为 AI 驱动的零售智能平台，核心由头顶式 RFID
              传感器、软件和分析组成。公司官网和招聘页都把产品指向一个长期存在的零售库存控制痛点：门店仍难以实时知道商品在卖场还是仓库，补货、全渠道履约和客户服务因此被削弱。官方法律文件显示，运营实体为 Automaton,
              Inc.，以 RADAR 名义开展业务。公开地点披露方向一致，但并不完全干净。2025 年 3 月 Old Navy 发布材料称 RADAR 总部在 New York；隐私政策列出 San Diego
              联系地址；公司另行披露在 New York、San Diego 和 Bay Area/San Francisco 设有办公室。合在一起看，证据支持一个以 New York
              为中心、具备多办公室版图的运营身份，但投资人仍应直接索取主要执行办公室和法律实体架构图。变现模式看起来是硬件加经常性软件和分析：RADAR
              销售天花板传感器部署，与零售商系统集成，并在其上叠加分析、补货、履约和自主结账工作流。
