      - number: '6.2'
        title: 部署广度与采用轨迹
        blocks:
          - type: paragraph
            body: >
              从 2025 年 3 月 Old Navy 合作公告到 2026 年 5 月 Series B 公告，RADAR 披露的部署数量快速增长。2025 年 3 月，Gap Inc. 投资者关系新闻稿的 "About
              RADAR" 部分称，RADAR 平台“currently powers inventory optimization in nearly 600 stores nationwide and in Canada
              across three billion-dollar brands with a pipeline of over 30 other top brands”。到 2026 年 5 月 Series B
              公告时，BusinessWire 官方新闻稿引用 RADAR 称其“deployed across more than 1,400 stores”，CEO Spencer Hewett 对 Forbes
              表示该数字为“nearly 1,500 American Eagle and Old Navy storefronts across the country”。

              约 14 个月内，已部署门店增加约 140%，反映出 Old Navy 门店网络的分阶段 rollout；根据 Gap Inc. fiscal 2024 年报，Old Navy 在美国和加拿大拥有超过 1,200
              家自营门店。American Eagle Outfitters 是第一个全门店网络部署者；Old Navy 已宣布的多年 rollout 是加速增长的近因。

              管线叙事随部署规模一起变化。2025 年 3 月，RADAR 提到其管线中有“over 30 other top brands”。到 2026 年 5 月，Forbes 描述为“around a dozen
              more retailers in pilot projects”，说明要么管线流失，要么 30 个管线品牌中许多尚未转为完整 pilot。这一差异是近期增长的重大未知数——公司尚未公开披露 30+
              个品牌中有多少推进到活跃 pilot 或完整合同。
            claimRefs:
