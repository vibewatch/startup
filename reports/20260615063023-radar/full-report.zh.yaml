      - number: '8.4'
        title: 投资建议、正反论点与入场纪律
        blocks:
          - type: paragraph
            body: >-
              对 RADAR 在 $1B 估值下的建议是 PASS / 继续研究。原因不是业务没有吸引力——规模、部署验证、客户质量和市场空间确实出色。原因是，如果不知道真实 ARR 到底是 $35M（熊市情景，估值很紧）还是
              $100M+（牛市情景，可以辩护），就无法执行价格敏感的投资纪律。在没有答案时以 $1B 入场，投的是信仰跃迁，不是完成尽调后的投资。投资正论点在多个维度很强。RADAR
              是唯一在大型服装零售门店中规模化部署的头顶式 RFID 平台。它已有 1,400+ 家经验证的门店部署、美国零售中两个最具标杆性的参考客户（American Eagle 和 Old Navy / Gap
              Inc.）、一波正在推进的新增试点，以及一位刚从规模化 IoT / 自动化背景加入的 CFO。零售 RFID 品类在增长，RADAR 站在多层技术栈的中心。新融资 $170M
              带来运营跑道和地理扩张资金。自动结账产品虽然仍早期，但若能以经济可行的方式交付，可能成为变革性上售。Founders Fund、Y Combinator 和 Sound Ventures
              作为财务投资人，也提供战略可信度。反论点同样清楚。所有核心财务指标都未披露：ARR、毛利率、烧钱、NRR 和 cohort
              数据都不可得。两大客户同时是战略投资人，这会带来价格信号和参考客户立场的一致性，独立财务投资人不能把它当作公平交易下的证明。商业模式需要实地硬件安装，限制新增客户获取速度，也带来营运资本风险。Amazon
              明确退出无人结账零售（关闭 Amazon Go、改造 Amazon Fresh），说明自动零售经济性在规模化时非常困难——这直接挑战 RADAR 最高上行空间的产品押注。按 KPMG Q1 2026
              Venture Pulse，地缘政治不确定性也压缩了 VC / IPO 退出窗口。若投资人仍要推进，入场纪律应是：在接近 $1B 的任何估值承诺前，最低尽调条件是披露经审计 ARR、同比增长、分业务毛利率（硬件
              vs. 软件）和过去十二个月 NRR。这四个指标合在一起，能让投资人判断基准或牛市假设是否成立。若 ARR ≥$75M、增长 ≥50%、NRR ≥110%，$1B 是公平到有吸引力的价格。若 ARR
              <$50M、增长 <40%，$1B 定价过高，投资人应谈到 $600–750M，或等更有证据的后续轮。
            claimRefs:
