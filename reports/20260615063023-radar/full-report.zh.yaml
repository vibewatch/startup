              Amazon 于 2026 年 1 月关闭 Amazon Go，并将 Amazon Fresh 门店转为 Whole
              Foods，这是近期最强验证：即便是资本近乎无限的运营者，规模化自主结账在经济性和运营上也很难。对 RADAR 投资人而言，这确认了恰当的承销锚点：库存智能、损耗降低和全渠道履约是近期已验证用例，在 1,400+
              家门店展现 ROI。自主结账是路线图项目，应建模为可选性，而不是基准收入。
