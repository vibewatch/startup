        blocks:
          - type: paragraph
            body: >-
              本章最后留下几条投资人需要关注的警示。第一，RADAR 对客户成效和部署数量披露异常充分，但传统治理与财务透明度较弱：没有公开董事会名单，没有披露当前员工数，也没有经审计的收入或
              ARR。第二，总部叙事在不同来源中尚未完全统一；面向客户的发布材料称总部在 New York，隐私政策公布 San Diego
              法律联系地址，其他材料又描述多城市办公室版图。第三，自主结账叙事应作为可选上行空间，而非承销时的基准价值。独立和学术来源仍将 RFID
              加视觉零售系统描述为运营难度高、隐私敏感，且经济性扩张比营销说法更难。最后，该品类具有足够战略吸引力，大型在位者和相邻自动化供应商仍在投入；这验证了市场，也给一家仍为私有、公开治理披露有限的公司带来执行压力。
