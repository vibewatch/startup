  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 客户与收入集中度风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，RADAR 公开确认的生产规模部署几乎全部集中在两个企业家族：American Eagle Outfitters（AEO）和 Gap Inc. 的 Old Navy 品牌。2026 年
              5 月 Series B 新闻稿称其管理 1,400 多家门店，但唯一具名的全门店网络生产客户就是这两个服装集团。AEO 执行董事长兼 CEO Jay Schottenstein 身处一种独特纠缠的位置：他既是
              RADAR 第一个生产客户，又是具名股权投资人——这种安排让 arm's-length 合同条款、续约激励，以及 AEO 公开背书 RADAR 技术的可信度都存在治理不透明。

              2025 年 3 月 Old Navy 上线材料提到三十多个品牌的管线；到 2026 年 5 月，RADAR 描述其两个锚定客户之外约有十二个活跃 pilot，意味着 14 个月内管线到生产的转化率约为
              40%。Gap Inc. 报告其截至 2026 年 2 月财年的总净收入下降，减少了 Old Navy 母公司继续进行基础设施投资的预算空间。RADAR 未在任何公开文件或新闻稿中披露 net revenue
              retention rate、合同期限、续约条款或 churn 指标。任一锚定客户突然回滚或冻结部署，都会消灭 RADAR 公开确认生产足迹的大部分，在当前估值下构成生存级集中度风险。投资人应把双客户锚定结构视为
              thesis-break 触发器，closing 前必须完成明确合同尽调。
