  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 感知架构与技术栈
        blocks:
          - type: paragraph
            body: >
              RADAR 的技术平台把安装在天花板上的被动 UHF RFID 传感器、AI 软件，以及其面向客户材料所称的计算机视觉结合起来，在整个门店卖场实现实时、单品级库存追踪。相比早期 RFID
              实施，核心创新在于用固定天花板传感器替代手持扫描棒；后者需要周期性人工操作，只能给出某一时点的快照。公司称其平台可实现 99% 的单品级库存准确率，而未采用 RFID 自动化的零售商行业基线低于
              70%。RADAR 的硬件层依赖行业标准 RAIN RFID（UHF 被动）技术：Electronic Product Code（EPC）标识符写入贴在每件商品上的被动 RFID 标签。RAIN RFID
              读写器——由 Impinj 等生态厂商提供，或按 RADAR 专有规格制造——安装在天花板上，并持续询问覆盖区域内带标签的商品。原始读取数据流入 RADAR
              软件平台，边缘和云端处理把标签读取转化为位置估计和库存计数。RADAR 感知算法的具体实现，包括其声称相较商品化 RAIN RFID 读写器的精度提升，并未公开披露。
