      - number: '4.3'
        title: 成本结构、硬件经济性与资本强度
        blocks:
          - type: paragraph
            body: >-
              RADAR 成本结构比纯软件业务更资本密集，因为公司制造或采购自研天花板传感器，且必须在每家门店实体安装。这带来三层清晰成本：硬件物料清单（传感器、RFID 基础设施、安装人工）、软件与云基础设施（每天连续处理
              100B+ 商品事件，需要不小算力）、AI/分析层和下一代传感器硬件的持续研发。公开记录没有披露 RADAR 的硬件毛利或销货成本。不过，RFID 相邻上市公司的经济性可提供有用代理指标。Impinj——领先的
              RAIN RFID 芯片和平台供应商——FY2025 收入 $361.1M，non-GAAP 毛利率 55.3%，调整后 EBITDA $69.6M（EBITDA 利润率 19.3%）。Zebra
              Technologies 在零售和供应链中打包 RFID 硬件、软件和服务，FY2025 净销售额 $5,396M，毛利 $2,593M，对应硬件和服务混合毛利率 48.1%。两家公司都说明，硬件加软件 RFID
              平台在规模化后可达到高 40% 到中 50% 的毛利率，但这些数字来自成熟公司。RADAR 是早期垂直整合制造商，产量相对任一可比公司都低，单件硬件成本几乎肯定更高。Amazon Just Walk Out
              经验是重要的反向成本基准。Forbes 明确指出，Amazon 基于摄像头的系统每家门店需要数百个摄像头和重量传感器，经济上缺乏竞争力——Amazon 也在 2026 年 1 月正式关闭 Amazon
              Go，并开始将 Amazon Fresh 转为 Whole Foods。RADAR
              认为其天花板传感器架构成本效率更高（需要「几个安装到天花板的传感器」，而不是数百个摄像头），没有公开证据反驳该说法。不过，TechPinions 强调广义自主零售比预期更难；RADAR 由 Series B
              资助的下一代硬件也说明，现有传感器还不是最终成本结构。Series B 资金用途披露明确把「推进下一代传感器硬件」列为资本优先事项。这意味着 $170M
              中会有一部分被硬件研发资本支出吃掉，而不是立即产生收入。公司每月约 100 个新地点的门店部署速度，意味着传感器采购和安装带来显著持续销货成本，即便每个边际部署在软件层面盈利。
