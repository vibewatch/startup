  - id: FV003
    title: 不同情景下的估值和回报区间
    type: range
    layout: standard
    summary: RADAR 在熊市 / 基准 / 牛市情景下的隐含企业价值区间，基于单店 ACV 情景分析和可比收入倍数。
    approximationNotes: 区间反映每个情景带的低 / 中 / 高值，不是统计推导的置信区间。中值使用情景 ACV × 活跃门店 × 中位可比倍数（约 12x）。低值使用 8x，高值使用 16x。全部为推断值；RADAR 未确认 ARR 数据。
    data:
      items:
        - label: 熊市情景（ACV $25K，1,200 家门店）
