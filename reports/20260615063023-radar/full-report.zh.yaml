      - number: '3.3'
        title: 能力、定价与分销对比
        blocks:
          - type: paragraph
            body: >-
              RADAR 与竞争替代方案最关键的结构性差异，是连续与快照的二分。RADAR 的天花板传感器每 8 秒捕捉一次完整门店库存快照，实现 99%
              商品级准确率；定期手持棒人工扫描是主流替代方案，只能提供某一时点快照，典型零售库存准确率低于 70%。Zebra 移动电脑和 RFID sled 支撑手持棒模式；Zebra 不提供天花板传感器自主计数产品。据称
              RADAR 客户获得了可衡量 ROI：一家客户在试点门店将损耗降低 60%；启用全渠道履约工作流的部署中，BOPIS 取消率从 25% 降至 3%。RADAR 每天处理 100B
              商品级事件，其数据飞轮是最耐久的竞争资产——没有在位者或同行承认拥有可比的连续店内商品移动数据集。竞争集合中没有任何供应商公开披露定价。RADAR、Zebra、Checkpoint 和 Impinj
              都谈判企业合同，没有公开价目表。相邻 POS 与库存软件市场提供了粗略基准：较轻量库存管理工具通常按地点每月收取 $50–$300 SaaS 费；全栈 RFID
              部署则带有前期硬件资本支出和多年服务合同。RADAR 模式看起来是经常性软件订阅，硬件打包或租赁，但没有公开披露任何合同经济性；这是任何财务模型的重大尽调缺口。分销上的竞争差异很刺眼。Zebra
              渠道覆盖三大分销商，合计贡献 59% 收入，全球还有数千家 VAR、ISV 和 OEM。RADAR 直接销售给企业连锁。直接模式是早期企业 SaaS 的典型打法，利润捕获更好，但也带来集中度风险：失去 RADAR
              两个已知锚定客户之一（American Eagle 或 Old Navy），造成的损害会显著大于 Zebra 遭遇同等事件。除非 RADAR
              建立间接渠道关系，或引入熟悉渠道的人才，否则分销触达也会约束其中端市场或国际零售扩张。
