      - number: '8.3'
        title: 情景分析——牛市、基准和熊市情景，以及 ACV 与倍数假设
        blocks:
          - type: paragraph
            body: >-
              情景分析先用不同的单店 ACV 假设，把门店数转成 ARR 估算，再检验隐含收入倍数相对可比公司是否站得住。模型设置三种情景，每种情景对应不同 ACV 假设、活跃门店数和置信水平。牛市情景假设 RADAR
              每家活跃门店每年 ACV 达到 $65,000。这个水平落在全服务企业 RFID 部署的可信区间内：零售商获得天花板传感器硬件（可能资本化进 ACV 或以租赁形式计入）、实时库存智能软件、包括较新的
              Fitting Room Intelligence 和 Floor Set IQ 在内的分析能力，以及持续支持。按 $65K ACV、到 2026 年底 1,600 家活跃门店计算（考虑约每月 100
              家的部署节奏，这一假设可行），ARR 约为 $104M。在 $1B EV 下，隐含收入倍数约 9.6x——落在 8–11x 的私营公司区间内，完全可以辩护。上行情景：2,000+ 家门店、$65K ACV，对应
              $130M ARR，$1B 估值为 7.7x，价值清楚。基准情景假设每家活跃门店 ACV 为 $45,000——更低，反映早期部署中锚定客户可能拿到折扣导入价的组合影响。按 $45K 和 1,400
              家活跃门店计算，隐含 ARR 约 $63M。在 $1B EV 下，收入倍数为 15.9x——高于私营可比中点，但若同比增长 ≥50%，仍可能支撑。不过这已经是偏紧的价格，留给执行风险的安全边际很小。熊市情景把
              ACV 建模为每店 $25,000——本质上是功能较薄、上售有限的库存准确性工具——并假设集中度风险使近期增长在流失或暂停后限制在 1,200 家有产出的门店。ARR 约为 $30M。在 $1B EV
              下，隐含倍数约 33x，相对任何可得可比公司都很难辩护。若收入跟踪接近这一情景，下轮降估值将变得可能。纯 ARR 分析还受到几个额外价值驱动因素的影响。American Eagle Outfitters
              在美国约有 800–900 家门店，Gap Inc. 的 Old Navy 品牌在北美运营约 1,249 家门店；仅这两个锚定客户，在现有关系内就代表潜在 2,000+ 家门店的扩张
              TAM。这一内嵌扩张潜力是在基础 ARR 之上的重要期权价值，但前提是扩张门店价格匹配或高于当前 ACV（NRR 未知）。自动结账产品仍在开发中，任何当前门店 ARR
              估算都没有计入这一额外期权。结果分布的不对称性对风险调整判断很重要。牛市情景下，当前 $1B 已经是合理入场价。熊市情景下，价格明显错了，出现重大减记并不意外。这种不对称性叠加财务不透明，正是投资建议为
              PASS、等待尽调，而不是有条件买入的原因。
