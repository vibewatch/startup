      - number: '5.4'
        title: 差异化与技术护城河
        blocks:
          - type: paragraph
            body: >
              RADAR 的主要差异化主张包括：固定天花板感知精度、相较手持周期性快照的实时单品定位能力、专有的一体化硬件-软件-分析栈，以及在 RFID 制造和零售实施方面经验深厚的团队。公司把自己定位为解决传统 RFID
              路线未能以同等准确性在规模上解决的问题。Old Navy 合作公告提到，RADAR 在 RFID 之外还整合计算机视觉，这可能提供额外的感知冗余或差异化；但计算机视觉在 RADAR 平台中相较纯库存 RFID
              的具体角色，并未公开解释。RADAR 的硬件栈是在标准 RAIN RFID 标签技术之上构建的专有系统，这意味着零售商不会被锁定在非标准标签格式上，但会依赖 RADAR
              的专有读写器基础设施。公司的数据优势也会随规模复利：每新增一次部署，都会扩大由商品移动、补货事件和顾客-商品互动模式构成的运营语料，长期可改善分析和工作流调优。
