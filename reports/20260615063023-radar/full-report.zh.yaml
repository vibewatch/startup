        - 员工人工搜索卖场和库房，或间歇使用手持扫描器。
        - 员工查询移动界面，背后由持续的单品位置数据支撑。
        - 服务更快，商品更容易找到。
        - 依赖完整 RFID 贴标和天花板覆盖。
      - - 确认可售库存
        - 门店依赖滞后的周期盘点或 POS 扣减。
        - 平台提供实时可售性和位置感知。
        - 对实际在手库存更有把握。
        - 公开来源未按品类披露误报率。
      - - 拣选全渠道订单
        - 门店可能接受实际无法在店内找到的商品订单。
        - 门店使用当前商品位置拣货，意外更少。
        - 取消减少，履约执行更好。
        - 与 OMS/WMS 的集成细节未披露。
      - - 补充卖场货品
        - 团队巡查各部门，或定期扫描来识别缺口。
        - RADAR 持续标出错放或缺失商品。
        - 补货速度和劳动效率更好。
        - 公开材料只在高层级描述运营仪表盘。
      - - 无通道结账
        - 顾客必须前往人工或自助结账。
        - 购物时商品加入数字购物车，离店时完成支付。
        - 结账无摩擦，排队更少。
        - 行业边缘场景和顾客接受度仍是开放风险。
      - - 分析门店移动模式
        - 经理依赖人工观察或滞后报告。
        - 平台把移动和库存信号聚合成分析。
        - 更好洞察商品流动和需求。
        - 公开材料未披露指标定义或导出 schema。
    notes: 这是一张纯事实工作流快照，来自直接观察到的公开产品描述和面向客户的主张。
