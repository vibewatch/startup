      - number: '8.2'
        title: 公开可比公司分析与隐含收入倍数区间
        blocks:
          - type: paragraph
            body: >-
              RADAR 估值的主要参照物是三家上市公司：Impinj（NASDAQ: PI）、Samsara（NYSE: IOT）和 Zebra Technologies（NASDAQ: ZBRA）。三家公司分别代表
              RFID 与 IoT 平台生态的不同切面，其收入倍数区间划出了 RADAR 隐含倍数的合理带宽。Impinj 是最直接的技术参照：公司是领先的 RAIN RFID 芯片和读写器平台提供商，供应 RADAR
              所部署生态所需的底层芯片和平台基础设施。Impinj FY2025 收入为 $361M，毛利率约 52.5%，反映其硬件占比较高的产品组合。截至 2026 年 6 月，Impinj 市值约
              $4.04B，对应过去十二个月收入约 11.2x 的市销率。这个倍数并不是靠高增长撑起来的：Impinj FY2025 收入增长略为负值（-1.4%），说明市场主要按战略护城河和经常性平台经济给 Impinj
              定价，而不是按增长速度。RADAR 的部署增长快得多，合理上应较 Impinj 享有溢价。Samsara 是 RADAR 软件经济性最好的结构参照：它是一个 IoT
              平台，把传感器数据转成资产密集型企业的运营工作流（车队管理而非零售门店，但架构平行关系清楚）。Samsara FY2026 收入为 $1,619M，同比增长 29.6%，毛利率约 76.7%，体现纯 SaaS
              经济性。其 $19.61B 市值对应约 12.1x P/S 倍数。显著更高的毛利率（76.7%，对比 Impinj 的 52.5%）说明 Samsara 已经做到不背硬件 COGS 负担而扩张——RADAR
              尚未公开证明自己也能做到。若没有同等收入规模，RADAR 要拿到类似 Samsara 的倍数，就必须证明毛利质量更接近 Samsara 的 SaaS 画像。Zebra Technologies
              锚定可比组低端：一家成熟、多元化的企业技术公司，服务零售、供应链和制造业，提供 RFID 硬件、软件和服务。Zebra FY2025 收入 $5.4B，市值 $10.88B，对应 P/S 约
              2.0x——这一水平符合一家硬件收入占比高、有机增长温和、自由现金流强的成熟企业。RADAR 现阶段不应该、也不会按 Zebra 倍数交易；RADAR 倍数讨论的低端，只在 ARR
              基数很小的风险情景下才会被触及。BVP Nasdaq Emerging Cloud Index 跟踪 70 多家上市云软件公司，提供全市场 SaaS 参照。该指数当前成分股显示，到 2026
              年中，云软件公司通常按 8–15x 远期收入交易。Multiples.vc 对 POS 和零售管理软件类别的数据给出的中位数为 5–8x，高增长离群值可达 12–18x。合并这些参照，RADAR
              按当前增长画像的合理收入倍数区间为 10–15x，中点为 12x。按 12x 计算，支撑 $1B 估值需要约 $83M ARR。KPMG Venture Pulse Q1 2026 报告指出，AI 相关公司在
              2026 年初融资中获得溢价倍数，这一顺风部分解释了为什么 RADAR 在未披露收入的情况下，仍能拿到可比区间高端价格。若对上市可比中点施加惯常的 20–25% 私营公司折价，私募交易的公平倍数区间约为
              8–11x，需要 $90–125M ARR 才能支撑 $1B。这个区间只有在牛市情景下才可达到。
