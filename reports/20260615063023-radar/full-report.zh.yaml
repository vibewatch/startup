      - number: '2.3'
        title: 买方、用例和采用路径偏向大型全渠道零售商
        blocks:
          - type: paragraph
            body: >-
              买方模式比具体预算科目更清楚。RADAR 最强的公开客户验证来自大型服装门店网络，这类客户本就重视商品级准确率、试衣间可视化、线上购买到店自提执行和损耗降低。Old Navy 推广与 Gap
              门店基础说明了为什么该品类由企业客户主导：部署头顶式传感器、软件集成和店员工作流，是门店网络级决策，不是给小商户的点状解决方案。相邻市场来源也强化了同一方向。零售科技供应商和行业报道反复把门店描述为多功能枢纽、微型履约点和数据密集的运营节点；RFID、计算机视觉和
              AI 帮助员工基于实时库存状态行动。采用路径也看起来可预测——先试点，衡量损耗和履约结果，再全门店推广——这会偏向具备可证明 ROI 和部署可信度的供应商，而不是概念阶段进入者。
