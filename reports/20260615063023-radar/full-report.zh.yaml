      - number: '1.3'
        title: 规模、客户与客户验证的运营影响
        blocks:
          - type: paragraph
            body: >-
              2025 到 2026 年，RADAR 的公开规模叙事明显增强。2025 年 3 月官方客户材料称，平台支撑了三个十亿美元品牌旗下近 600 家门店；2026 年 5 月融资公告称，部署已扩至超过 1,400
              家门店。后续披露点名 American Eagle Outfitters 和 Old Navy；Forbes 称，American Eagle 和 Old Navy 近 1,500
              家门店已上平台，另有约十几家零售商处于试点。产品价值主张与全渠道执行和损耗控制紧密绑定。Old Navy 发布公告描述了多年全国 rollout
              计划，围绕店员实时商品位置、补货和线上购买到店自提工作流展开。CNBC 给出了最具体的运营验证：部分 RADAR 用户将订单取消率从 25% 降至 3%，一家客户在试点门店将损耗削减 60%。Forbes
              还补充称，客户报告店内收入增长 10% 或更高，但该指标仍是管理层报告，并非独立审计。
