      - number: '2.2'
        title: 市场规模：可信的核心市场存在，但 SAM 偏企业客户，窄于标题式 TAM
        blocks:
          - type: paragraph
            body: >-
              第三方市场报告大致指向同一个量级：2026 年全球零售 RFID 市场约 $16B，自助结账则位于相邻但独立的 $5.9B–$6.6B 区间。Zebra 年报给出更宽的 $35B
              服务可寻址市场，覆盖互联一线和资产可视化工作流。这些品类彼此重叠，不能机械相加；它们更适合作为 RADAR 机会的边界。广义问题空间显然很大；更相关的核心市场，是零售 RFID
              支出中与店内商品可视化、全渠道履约、损耗降低和店员工作流绑定的部分。这个市场看起来仍足以支撑风险投资级结果，尤其是 Old Navy
              这类大型服装门店网络说明，单个企业关系就能横跨一千多家门店。因此证据支持分层测算：广义自动化 TAM 超过 $15B，近期核心 SAM 在低个位数十亿美元，当前可捕获 SOM 小得多，但已由 1,400
              多家上线门店验证。
