  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、方法论与关键缺失输入
        blocks:
          - type: paragraph
            body: >-
              RADAR 于 2026 年 5 月 19 日宣布 $170 million Series B，投后估值 $1 billion；这是 Business
              Wire（公司官方新闻稿）、CNBC、Forbes、PYMNTS 以及多家科技行业媒体报道确认的市场事件。独角兽里程碑本身没有争议。真正有争议的是，若投资人今天进入，$1 billion
              是否是一个可辩护的价格；这个问题无法回答，因为公司未公开披露 ARR、年收入、毛利率、net revenue retention、客户获取成本或现金 burn。这些缺失对一家私营 Series B
              公司并不罕见，但意味着本章只能完全在隐含估值空间中运作：从价格倒推财务画像需要长成什么样才能支撑它，再用证据检验这些隐含要求。分析由三根方法论支柱支撑。第一，收入倍数 proxy：使用可比的公开 RFID 和
              IoT SaaS 公司，推导合适的 EV/Revenue 倍数区间，并反推所需 ARR。第二，门店数量 proxy：使用披露的部署足迹（1,400+ 家门店）作为收入分子，套用一组单店 ACV
              假设，并计算每种情景下的隐含收入倍数。第三，情景矩阵：系统性改变 ACV 和门店数量假设，覆盖 bull、base 和 bear case，产出估值区间。三种方法都受同一个缺口约束：RADAR 的真实 ACV 和
              ARR 未知。因此，本章提出的任何估值结论都明确是估计置信度推断，而非经验证事实。本章标出投资人在以接近 $1 billion
              或该价格投入资本前必须取得的六项具体财务披露。没有这些披露，诚实的分析立场是：市场机会和 proof metrics 很有吸引力；bull case 下价格合理，base case
              下偏紧；在缺少适当质量证据时，无法给出最终投资建议。
