      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >
              RADAR 的部署模式要求在零售卖场、库房和高流量区域安装天花板 RFID 传感器和天线。Old Navy 多年分阶段全国 rollout 公告显示，该平台按阶段实施。零售商必须先用符合 EPC 的 RAIN
              RFID 标签给商品预贴标，地点可以在源头（制造商）或店内；之后 RADAR 的感知层才能追踪单件商品。RADAR 的库存数据若要驱动下游工作流，必须与门店系统——POS、WMS
              和电商履约平台——集成。RADAR 招聘页面显示其设有集成和客户成功岗位，但具体集成标准、中间件或 API 未公开记录。截至 2026 年 5 月，其部署足迹已覆盖 American Eagle 和 Old
              Navy 品牌下超过 1,400 家门店。RADAR 团队背景包括监督 1,300+ 家门店技术实施的经验，说明其具备大规模零售 rollout 的运营能力。公开材料未披露可靠性、支持和 uptime SLA
              承诺；这些都是企业采购尽调的实质事项。
