      - number: '7.2'
        title: 硬件资本强度与 rollout 执行风险
        blocks:
          - type: paragraph
            body: >
              RADAR 的天花板 RFID 传感器阵列需要显著单店资本开支，覆盖专有硬件、安装、电力和网络基础设施，以及与每家零售商后端系统的集成。这种硬件优先模式使 RADAR 区别于纯 SaaS
              平台，也让每个新部署都更像资本密集型建设项目，而不是软件 license。$170 million Series B 是近期零售技术领域最大单笔融资之一，暗示公司要从 1,400
              家门店扩展到全球数万家门店，仍需大量后续资本。若单店平均部署成本粗略为数万美元，Series B 资金在需要追加资本前只能支持数千个新增部署。

              向 EMEA、Canada 和 Latin America 国际扩张——RADAR Series B
              材料均有提及——会带来增量硬件成本、现场服务基础设施和物流复杂性。老旧门店格式若存在非标准天花板高度、非标准网络环境或复杂库房架构，会产生无法仅靠软件更新消除的单店安装摩擦。定制 RFID
              天花板传感器硬件供应链依赖专业电子制造商，其产能约束可能在高峰期限制部署速度。Amazon 于 2024 年决定从 Fresh 杂货门店移除 Just Walk Out
              技术，说明当准确性或经济性在规模上令人失望时，硬件密集型自主零售部署可以被逆转；如果 RADAR 的传感器表现一旦在当前客户基础之外的真实门店环境中下降，它将面临类似的规模化风险天花板。
