      - number: '7.6'
        title: 运营、关键人物与国际扩张风险
        blocks:
          - type: paragraph
            body: >
              创始人兼 CEO Spencer Hewett 是 RADAR 整个历史中唯一持续公开露面的高管。所有投资人沟通、产品公告、媒体采访和客户合作都在其领导下进行。直到 2026 年 5 月，另一位具名 senior
              hire 才是 CFO Abi Viswanathan——这一任命释放出财务纪律增强的信号，但也在关键增长拐点引入执行不确定性。Hewett 若离任或无法履职，将同时移除 RADAR
              的主要客户关系锚点、产品愿景者和投资人信任中心，形成公司层面的关键人物风险；对一家 $1 billion 估值公司而言，这一风险异常尖锐。

              国际扩张会带来复合运营风险。RFID UHF 频段因地区而异（EU 为 868 MHz，美国为 902–928 MHz），需要单独硬件 SKU 或固件适配，并增加供应链复杂性。RADAR 尚未公开回应 EMEA
              和 Latin America 的数据驻留要求、产品安全认证和本地劳动法问题。RFID
              天花板传感器硬件供应链——覆盖读写器、天线、线缆、安装硬件和电力系统——横跨多个专业电子制造商，暴露于关税、组件短缺和物流中断。SML Group 和 Avery Dennison 是主导 RFID
              标签制造商，提供 RADAR 平台运行的前提——商品级标签；该上游层面的任何供应链整合或价格变化，都会影响 RADAR 所有零售客户的扩张意愿。RADAR
              尚未公开披露董事会构成、独立董事人数、审计委员会状态或投资人治理权利，使关键人物风险又叠加了结构性治理不透明。
