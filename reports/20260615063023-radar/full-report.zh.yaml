    rows:
      - - Zebra Technologies
        - 既有硬件 / 软件厂商
        - FY2025 收入 $5.4B；上市公司（ZBRA）
        - 企业供应链、零售、制造、物流
        - 硬件组合最广；通过分销商和 VARs 做全球分销
        - 没有天花板传感器自主库存产品；硬件优先，不是 AI 分析优先
      - - Impinj
        - RFID 芯片 / 平台既有厂商
        - FY2025 收入 $361M；上市公司（PI）
        - RFID 系统集成商和 ISVs；间接触达终端用户
        - 市场领先的 RAIN RFID 芯片和读写器性能；合作伙伴生态广
        - 只销售平台组件；没有零售分析或门店仪表盘
      - - Checkpoint Systems
        - 一体化 RFID/EAS 供应商
        - 私营；CCL Industries 旗下部门
        - 服饰零售，以及制造端源头贴标
        - 从工厂到货架，纵向整合标签、硬件和软件
        - EAS 出身；尚未展示连续实时 AI 分析
      - - Sensormatic Solutions
        - 一体化 RFID/EAS 供应商
        - Johnson Controls 旗下；收入未单独披露
        - 百货商店和大型服饰连锁
        - EAS 防损 + 库存智能组合
        - Sensormatic 产品细节大多未披露；审阅日抓取失败
      - - Trigo
        - 计算机视觉 AI 同业
        - 私营；未取得已披露融资
        - 欧洲杂货和便利零售商
        - 非生物识别 AI；每年 60M+ 次购物活动；GDPR 隐私内建
        - 基于摄像头，不基于 RFID；结账重点不同于库存智能
      - - Focal Systems
        - 计算机视觉货架 AI
        - 私营；融资未披露
        - 超市和杂货连锁
        - 靠 AI 摄像头提供实时货架可用性和补货
        - 只覆盖货架摄像头；没有全店、单品级 RFID 库存准确率
      - - Amazon Just Walk Out
        - 自动结账平台
        - Amazon（上市公司）；技术授权部门
        - 小业态酒店、场馆、便利
        - 靠 AI、摄像头和可选 RFID 实现免结账进出
        - 关闭大业态 Amazon Go/Fresh 门店；对服饰适用性有限
      - - CONTROLTEK
        - RFID/EAS/AI 融合安防
        - 私营；规模未披露
        - 零售资产保护团队
        - SmartPost Z 在店门口结合 RFID、AI 视觉、LiDAR 和 EAS
        - 店门口场景更窄；不是全店库存 AI 平台
      - - Simbe Robotics
        - 自主货架扫描机器人
        - 私营；获零售投资方支持
        - 大业态杂货店和大卖场
        - Tally 机器人扫描货架标签和图像；数据送入分析系统
        - 机器人部署需要地面空间和维护；不是天花板传感器方案
      - - 现状 / 内部手持扫描
        - 人工流程
        - N/A
        - 所有零售层级
        - 前期成本低；无需新增硬件投入
        - 库存准确率低于 70%；只有时点快照；人工成本高
    notes: >-
      规模 / 融资来自 FY2025 年报和新闻稿；私营公司披露很少。审阅日无法访问 Sensormatic 内容。Simbe Robotics 根据 NRF 2026
      二手报道推断。所有标为未知或不可得的单元格都反映真实证据缺口，并非遗漏。
