      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 投资建议——PASS / 继续研究
            body: >-
              RADAR 是一家有吸引力的公司，技术真实，也已证明能在企业规模部署。若 ARR 超过 $75M、同比增长 ≥50%、NRR ≥110%，$1B
              估值可以辩护——但这些指标我们无法确认也无法否认，因为公司都未披露。基于当前证据质量，诚实建议是 PASS /
              继续研究：先完成六项尽调（ARR、毛利率、NRR、ACV、烧钱、集中度），再投入资本。若尽调确认牛市指标，可在 $1B 或附近入场。若确认基准情景指标，谈到 $600–750M
              或等待。若确认熊市情景指标，直接放弃。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV020
              - CV035
              - CV041
          - type: callout
            title: 财务不透明是核心投资风险
            body: >-
              本报告中的其他风险（客户集中度、自动结账、竞争、烧钱）都次于收入不透明这一根本问题。RADAR 已披露融资总额 $270M，并部署了 1,400
              家门店——运营规模已经足够大，投资人有理由期待在尽调中看到经审计财务。私营公司不公开披露并不异常，但这意味着整个投资论点取决于 RADAR 愿意在资料室分享的信息质量和完整度。任何投资人若不核验六项尽调，就按
              $1B 表面价格承销，投的就是信仰跃迁，不是完成尽调的交易。
            calloutType: risk
            claimRefs:
              - CV035
              - CV043
              - CV044
              - CV045
              - CV046
          - type: callout
            title: 关键模型假设与限制
            body: >-
              所有情景 ARR 估算都假设活跃门店基数采用统一 ACV。实际中，锚定客户可能拿到导入价，新零售商则可能支付全价。混合 ACV 可能低于边际
              ACV。门店部署数（1,400+）是下限，不是已验证计数。硬件收入确认政策未知，可能导致 GAAP 收入与现金 ACV 存在重大差异。Trigo、Standard.AI
              或其他零售科技创业公司的私募轮可比数据不可得。情景矩阵和敏感性分析中的所有数字都应视为数量级估算，而非精确财务预测。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV025
              - CV031
