      - number: '4.2'
        title: GTM 路径、部署节奏与销售效率信号
        blocks:
          - type: paragraph
            body: >-
              RADAR 的市场进入路径是直接企业销售，且高度咨询式。Forbes 引述 CEO 称，公司历史上每年只接入一家新的企业零售商——节奏极慢，反映每个旗舰客户都需要高度定制的安装和集成流程。$170M Series
              B 明确用于扩张这一能力：公司目标是从每年一个新企业零售关系，提升到每年数十个。这个加速在运营上有一定可信度，原因包括任命 Abi Viswanathan 为 CFO（此前为 Nuro CFO，帮助其扩张至
              $8.6B 估值；也是 Uber Strategic Finance 早期成员），以及现有客户每月约 100 个新地点的快速门店部署。区分「新企业关系」（历史上极慢）和「现有关系内新地点」（当前
              100/月）非常关键：RADAR 扩张速度主要由现有企业客户内扩售驱动，而非广泛新客户获取。这符合先落地后扩张模式，但也意味着收入集中度高，新客户 CAC
              按单个账户计算非常大。战略投资方与客户重叠（American Eagle CEO Jay Schottenstein 既是早期支持者，也是首个全门店网络客户；Gap Inc.
              既是合作伙伴也是投资方）创造了有利的获客和概念验证环境，但也意味着 RADAR 最重要的参考客户与公司存在财务绑定，独立买方可能会打折看待。截至 2026 年 5
              月，十几家试点零售商的管线是正向领先指标，但不足以评估 CAC 回收或真实净收入留存，两者仍未披露。PYMNTS 报道称，该 RFID
              平台最初是自主结账产品，随后转向库存可视化；这对长期愿景重要，但也确认当前收入引擎是库存智能，而非结账自动化。零售商对 RADAR 的 ROI 叙事看起来具体：一个有记录案例中订单取消率从 25% 降至
              3%（PYMNTS/CNBC），客户报告店内收入增长 10%+（Forbes，公司声称），一家试点门店损耗降低
              60%（PYMNTS/CNBC）。若这些结果能在已安装基础中保持一致，将支撑强扩售和留存故事，但这些指标由管理层报告，未经独立审计。
