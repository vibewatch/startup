  - id: TM001
    title: RADAR 市场边界与相邻品类地图
    columns:
      - 层级
      - 包含内容
      - 代表性证据
      - 为什么对 RADAR 重要
    rows:
      - - 核心品类
        - 用 RFID、传感器和分析实现单品级店内库存智能
        - RADAR 融资发布；Old Navy 铺开；Impinj 平台；库存准确率来源
        - 这是承销核心，因为它直接映射到准确率、履约和损耗结果。
      - - 广义赋能市场
        - AIDC、资产可视化、移动工作流、RFID、打印、机器视觉和自助自动化
        - Zebra 2025 年报
        - 显示问题空间很大，但它比 RADAR 的直接产品足迹更宽。
      - - 相邻工作流市场
        - 自助结账和自动结账系统
        - 来源：Global Market Insights；The Business Research Company；Just Walk Out
        - 与可选上行空间相关，但需求驱动和部署经济性不同于核心库存智能。
      - - 企业零售滩头阵地
        - 已运营 RFID 标签或高 SKU 门店网络的大型全渠道连锁
        - Old Navy / Gap；融资和媒体中的 American Eagle 验证
        - 在这一层，劳动力、损耗和履约 ROI 足以支撑部署复杂度。
    notes: 本表定义市场层级，而不是把它们相加。广义 AIDC 市场与零售 RFID 和自助结账存在重叠，因此这些类别应被理解为边界视角，而非可累加的 TAM 模块。
