  - id: deployment-breadth
    title: Deployment Breadth and Adoption Trajectory
    body: >
      RADAR's disclosed deployment count grew sharply between the Old Navy partnership announcement in March
      2025 and the Series B announcement in May 2026. In March 2025, the "About RADAR" section of the Gap Inc.
      investor-relations press release stated that RADAR's platform "currently powers inventory optimization in
      nearly 600 stores nationwide and in Canada across three billion-dollar brands with a pipeline of over 30
      other top brands." By the May 2026 Series B announcement, BusinessWire's official release quoted RADAR
      as "deployed across more than 1,400 stores," and CEO Spencer Hewett told Forbes the figure was "nearly
      1,500 American Eagle and Old Navy storefronts across the country."

      The ~140% increase in deployed stores over approximately 14 months reflects the phased rollout of Old
      Navy's fleet, which comprises more than 1,200 company-operated stores in the US and Canada according to
      Gap Inc.'s fiscal 2024 annual report. American Eagle Outfitters had been the first fleet-wide deployer;
      Old Navy's announced multi-year rollout is the proximate driver of the accelerated growth.

      The pipeline narrative evolved alongside deployment scale. In March 2025, RADAR cited "over 30 other top
      brands" in its pipeline. By May 2026, Forbes described "around a dozen more retailers in pilot projects,"
      suggesting either pipeline attrition or that many of the 30 pipeline brands have not yet converted to
      full pilots. This divergence is a material unknown for near-term growth — the company has not publicly
      disclosed how many of the 30+ brands advanced to active pilots or full contracts.
    claimRefs:
