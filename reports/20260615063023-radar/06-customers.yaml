company:
  name: RADAR
chapter:
  number: 6
  title: Customers
  summary: >
    RADAR's customer base is anchored by two Fortune 500 apparel retailers — American Eagle Outfitters (AEO)
    and Gap Inc.'s Old Navy — with combined fleet-wide deployments across more than 1,400 stores as of May 2026,
    up from approximately 600 stores in March 2025. Jay Schottenstein, AEO's CEO and executive chairman, is both
    RADAR's first production customer and a key investor, creating a uniquely durable but concentrated anchor
    relationship. Customer-cited outcomes include 10%+ in-store revenue growth, BOPIS order cancellation rates
    falling from 25% to 3%, and a 60% shrink reduction at one pilot location. About a dozen retailers were in
    active pilot programs as of May 2026. Significant concentration risk persists: two corporate families
    account for all large-scale deployments; NRR, contract terms, and churn data are not disclosed.

sections:
  - id: icp-and-segmentation
    title: Ideal Customer Profile and Segmentation
    body: >
      RADAR's ideal customer profile centers on large-format North American apparel retailers operating 100 or
      more stores, managing RFID-tagged merchandise, and running omnichannel fulfillment programs such as
      buy-online-pick-up-in-store (BOPIS). The primary buyer is the CTO or VP of Technology/Operations, with
      board-level sponsorship required for the multi-year, multi-million-dollar capital and integration
      commitment. The payer is the retailer's corporate parent; end users are frontline store associates who
      receive real-time inventory alerts and item-location queries through the RADAR app interface.

      All publicly confirmed production deployments as of mid-2026 fall within the North American mass-market
      and specialty apparel vertical. Both anchor customers — AEO and Old Navy — operate trillion-tagged
      merchandise pipelines and have mature omnichannel infrastructure, making RFID accuracy a direct revenue
      lever through reduced BOPIS cancellations, lower shrink, and faster replenishment. The platform is
      particularly well-suited to retailers where inventory is spread across sales floor, stockroom, and fitting
      rooms — environments where handheld RFID wands are too slow and periodic scanning leaves long accuracy
      gaps. RADAR's ceiling-sensor model, which captures a full store snapshot every eight seconds, addresses
      exactly this pain point.

      Non-apparel verticals (home goods, electronics, sports) remain unconfirmed for any production deployment
      as of the run date. The company's Series B materials note international expansion plans (Canada, EMEA,
      Latin America), but all cited deployments are US- and Canada-based. A pipeline of more than 30 brands
      was reported in March 2025; by May 2026, the cited active pilot count had declined to approximately twelve,
      suggesting conversion friction or selective onboarding rather than a straight-line pipeline expansion.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
