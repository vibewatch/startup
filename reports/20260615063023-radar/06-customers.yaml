callouts:
  - calloutType: strength
    title: "1,400+ Store Fleet Deployment with Fortune 500 Anchors"
    body: >
      RADAR has achieved fleet-wide deployment at two of the largest US apparel retailers — American Eagle
      Outfitters and Old Navy — with combined coverage of more than 1,400 stores as of May 2026. The AEO
      relationship demonstrates multi-year durability and is championed at the CEO/board level. Old Navy's
      multi-year commitment, backed by Gap Inc.'s CTO and Old Navy's CEO, signals institutional buy-in rather
      than opportunistic adoption.
    claimRefs:
      - CU001
      - CU005
      - CU009

  - calloutType: risk
    title: Extreme Customer Concentration in Two Corporate Families
    body: >
      As of mid-2026, two corporate groups account for all 1,400+ production store deployments. No other
      customer has reached production scale. Additionally, RADAR's anchor customer (AEO) is also a key
      investor, creating a conflict of interest that may have affected contract pricing or renewal terms.
      No NRR, GRR, or churn data has been disclosed; the absence of independent customer reviews amplifies
      the concentration risk.
    claimRefs:
      - CU034
      - CU035
      - CU037

  - calloutType: insight
    title: Pipeline Contraction Warrants Diligence on Sales Velocity
    body: >
      The 30+ brand pipeline cited in March 2025 had narrowed to approximately 12 active pilots by May 2026.
      While Old Navy's phased rollout accounts for much of the store-count growth, the pilot count reduction
      raises questions about enterprise sales friction, competitive displacement, or intentional selective
