  - id: customer-outcomes
    title: Customer Outcomes and ROI Evidence
    body: >
      RADAR cites several quantified ROI data points, all of which originate from company communications or
      CEO-level testimony rather than independent third-party audits. Spencer Hewett told Forbes in May 2026
      that RADAR customers had experienced "10% or more in in-store revenue growth." The PYMNTS investment
      tracker article reported that one retailer's BOPIS order cancellation rate dropped from 25% to 3% after
      adopting the platform — a statistic attributed to Jay Schottenstein's comments to CNBC. A separate
      pilot deployment reportedly achieved a 60% reduction in shrink, though no customer name or methodology
      was provided for this figure.

      The platform's core accuracy claim — 99% item-level inventory accuracy versus less than 70% typical of
      non-RFID retailers — is corroborated by multiple sources. The BusinessWire press release positions it as
      a foundational product claim, and independent retail industry research on inventory accuracy gaps
      (SCMR, ISM World) confirms that sub-70% accuracy is a recognized industry problem. RADAR processes more
      than 100 billion item-level events per day, providing the data density that supports its accuracy claim.

      These outcome figures are company-cited and lack independent verification. No audited case study, Gartner
      Peer Insights review, or third-party benchmark has been published for RADAR. The absence of G2/Capterra
      reviews and independent analyst assessments means outcome claims cannot be cross-validated. Diligence
      should request customer reference calls and, where possible, operational data from AEO and Old Navy
      confirming the revenue and shrink metrics.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
