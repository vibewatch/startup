  - id: named-customer-proof
    title: "Named Customer Proof: Old Navy and American Eagle Outfitters"
    body: >
      American Eagle Outfitters was RADAR's first fleet-wide deployer. Jay Schottenstein, AEO's executive
      chairman and CEO, is both the company's primary customer champion and a financial backer — a relationship
      that is unusual in enterprise SaaS but also attests to deep operational conviction. In the Series B
      announcement, Schottenstein stated: "As the first retailer to implement RADAR technology fleet-wide,
      American Eagle has unlocked greater inventory visibility, empowered our associates and sharpened our
      insights. With inventory digitized in real-time, we have enabled our creative, operations and technology
      teams to place their focus on creating seamless, customer-first experiences that define the American Eagle
      brand." AEO's deployment encompasses both the American Eagle and Aerie banners across its full US and
      Canadian store fleet.

      Old Navy (Gap Inc.) announced its multi-year partnership in March 2025. Haio Barbeito, Old Navy's
      President and CEO, described the platform as offering "sophisticated analytics that will give our teams
      greater real-time inventory visibility to provide an even better in-store shopping experience," calling
      it "an important factor in our long-term strategy to make Old Navy the most loved apparel brand in North
      America." Gap Inc. CTO Sven Gerjets added that "with Radar's always-on RFID technology, we will look to
      transform our stores into truly connected spaces, starting with Old Navy." The rollout is explicitly
      phased across Old Navy's 1,200+ store fleet and is still in progress as of the run date.

      Beyond these two anchor accounts, approximately twelve retailers were in active pilot programs as of May
      2026. No names, verticals, or outcome data for these pilots have been publicly disclosed. The original
      March 2025 pipeline of 30+ brands implies that RADAR was actively marketing to a broader universe, but
      the public record does not confirm whether any of those pipeline brands became paying customers by mid-2026.
    claimRefs:
