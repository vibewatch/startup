  - id: concentration-and-risk
    title: "Concentration Risk, Retention Unknowns, and Expansion Dynamics"
    body: >
      RADAR's customer base carries severe concentration risk. As of May 2026, two corporate families —
      American Eagle Outfitters and Gap Inc.'s Old Navy — account for all 1,400+ production store deployments.
      No other customer has been publicly confirmed at production scale. This means that a contract
      renegotiation, technology shift, or strategic pivot by either AEO or Gap Inc. could materially impair
      RADAR's revenue base, though neither company has publicly indicated any intent to reduce deployment.

      The AEO relationship compounds concentration risk with a governance concern: Jay Schottenstein is
      simultaneously executive chairman of AEO (RADAR's first and largest customer) and a financial backer of
      RADAR. While this dual role reflects genuine operational conviction, it also means RADAR's contract
      pricing and renewal terms with its anchor customer may not have been established at fully arm's-length
      commercial terms. Diligence should independently assess contract pricing, renewal provisions, and whether
      any preferential terms were granted to AEO that would disadvantage future commercial customers.

      No net revenue retention (NRR), gross revenue retention (GRR), or churn data has been publicly disclosed
      for RADAR. The multi-year contract language in Old Navy's announcement and AEO's ongoing fleet-wide
      deployment signal durability, but they are not substitutes for financial retention metrics. The pipeline
      conversion dynamic — 30+ brands in March 2025 contracting to ~12 active pilots by May 2026 — raises
      questions about sales cycle length, competitive displacement, and whether the platform's enterprise
      implementation burden limits addressable velocity. Plans to expand to Canada, EMEA, and Latin America
      are disclosed in Series B materials but no timeline, partnerships, or named customers in those geographies
      have been identified.
    claimRefs:
