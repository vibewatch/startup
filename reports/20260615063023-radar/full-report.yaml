  - id: FE004
    title: Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Public proof is strongest for RADAR's fixed-sensor inventory visibility and large-store deployments, and weakest
      for open integrations, certifications, and independent benchmarking.
    data:
      columns:
        - Legacy handheld RFID
        - RADAR fixed sensing
        - Sensor-fusion autonomous checkout
        - Enterprise deployment proof
        - External caveat
      rows:
        - label: Inventory capture cadence
          values:
            - label: Periodic scan only
              tone: warning
            - label: Continuous read model
              tone: positive
            - label: Checkout needs constant state awareness
              tone: neutral
            - label: 1,400+ stores claimed live
              tone: positive
            - label: No audited benchmark disclosed
              tone: warning
        - label: Item location precision
          values:
            - label: Associate dependent
              tone: warning
            - label: 99% claimed accuracy
              tone: positive
            - label: Multi-sensor architectures may reduce edge cases
              tone: neutral
            - label: Old Navy rollout corroborates buyer confidence
              tone: positive
            - label: Third-party validation remains thin
              tone: warning
        - label: Checkout automation
          values:
            - label: Separate staffed or self-checkout lane
              tone: neutral
            - label: RFID-driven carting claim
              tone: positive
            - label: Category remains technically hard at scale
              tone: warning
            - label: Public deployment proof is limited
              tone: warning
            - label: Theft and acceptance risks persist
              tone: warning
        - label: Standards compatibility
          values:
            - label: Standard RFID tags supported but manually used
              tone: neutral
            - label: Uses standard EPC / RAIN tag ecosystem
              tone: positive
            - label: Sensor-fusion systems often add proprietary layers
              tone: neutral
            - label: Retailers avoid non-standard tag lock-in
              tone: positive
            - label: Reader infrastructure is still proprietary to RADAR
              tone: warning
        - label: Deployment burden
          values:
            - label: Lower hardware burden
              tone: positive
            - label: Ceiling installation required
              tone: warning
            - label: Multi-sensor checkout is even heavier
              tone: warning
            - label: Phased rollouts show burden is manageable for enterprises
              tone: positive
            - label: Disruption and coverage tuning still matter
              tone: warning
        - label: Integration openness
          values:
            - label: Often tied to simple inventory tools
              tone: neutral
            - label: Public API detail is opaque
              tone: warning
            - label: Full checkout stacks need deeper payment and identity links
              tone: warning
            - label: Jobs page implies implementation capability
              tone: neutral
            - label: No public connector directory found
              tone: warning
        - label: Developer ecosystem breadth
          values:
            - label: Generic RFID tools exist broadly
              tone: neutral
            - label: Few RADAR-specific artifacts visible
              tone: warning
            - label: Sensor-fusion ecosystems are vendor-specific
              tone: neutral
            - label: Open-source RFID ecosystem is broad overall
              tone: positive
            - label: Proprietary connectors limit outside visibility
              tone: warning
        - label: Trust and compliance proof
          values:
            - label: Basic RFID security guidance exists
              tone: neutral
            - label: Website legal pages are public
              tone: neutral
            - label: Checkout-linked shopper data raises privacy stakes
              tone: warning
            - label: Enterprise buyers can diligence privately
              tone: neutral
            - label: Public hardware certification detail is absent
              tone: warning
    claimRefs:
      - CE010
      - CE014
      - CE018
      - CE022
      - CE024
      - CE032
      - CE034
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Discovery-to-expansion path for RADAR's enterprise retail customers, from initial awareness through fleet-wide
      deployment and capability expansion.
    data:
      items:
        - stage: awareness
          label: Awareness & Interest
          actor: Retailer CTO / VP Technology
          signal: High BOPIS cancellation rates; inventory shrink; competitive pressure from e-commerce precision
        - stage: evaluation
          label: Technical Evaluation
          actor: IT and Operations teams
          signal: Proof-of-concept in 1–3 stores; RFID tag penetration check; integration with existing OMS/POS
        - stage: pilot
          label: Pilot Deployment
          actor: Store operations + technology
          signal: Inventory accuracy jump; associate workflow change; first outcome metrics (shrink, BOPIS)
        - stage: fleet-rollout
          label: Fleet-Wide Rollout
          actor: Multi-year program office
          signal: Sequential store-by-store rollout; requires RFID tagging at source across all merchandise
        - stage: expansion
          label: Module Expansion
          actor: C-suite + product roadmap
          signal: Autonomous checkout; AI analytics; international expansion; cross-brand deployment
