      - number: '8.3'
        title: Scenario analysis — bull, base, and bear cases with ACV and multiple assumptions
        blocks:
          - type: paragraph
            body: >-
              The scenario analysis converts the store-count metric into an ARR estimate using a range of ACV-per-store
              assumptions, then tests whether the resulting implied revenue multiple is supportable relative to the
              comparable set. Three scenarios are modeled. Each carries a different ACV assumption, a different
              active-store count, and a different confidence level. The bull case assumes RADAR achieves an ACV of
              $65,000 per active store per year. This is within the credible range for enterprise RFID deployments at
              full-service scope: the retailer receives ceiling sensor hardware (likely capitalized into the ACV or
              leased), real-time inventory intelligence software, analytics including the newer Fitting Room
              Intelligence and Floor Set IQ products, and ongoing support. At $65K ACV and 1,600 active stores by
              end-2026 (plausible given the ~100/month deployment pace), ARR is approximately $104 million. At $1B EV,
              that implies a ~9.6x revenue multiple—within the 8–11x private-company range and fully defensible. Upside
              scenario: 2,000+ stores at $65K ACV = $130M ARR, $1B at 7.7x = clear value. The base case assumes an ACV
              of $45,000 per active store—lower, reflecting potential mix effects from early deployments that may have
              involved discounted introductory pricing for anchor customers. At $45K and 1,400 active stores, implied
              ARR is approximately $63 million. At $1B EV, that yields a 15.9x revenue multiple—above the private comp
              midpoint but potentially supportable if growth is ≥50% YoY. However, it represents a stretched price that
              leaves little margin for execution risk. The bear case models ACV of $25,000 per store—essentially a
              bare-bones inventory accuracy tool with limited upsell—and assumes concentration risk limits near-term
              growth to 1,200 productive stores after churn or pause. ARR would be approximately $30 million. At $1B EV,
              the implied multiple is ~33x, which is very difficult to justify against any available comparable. A
              down-round becomes likely if revenue tracking comes in near this scenario. Several additional value
              drivers complicate the pure ARR analysis. American Eagle Outfitters has approximately 800–900 US stores
              and Gap Inc.'s Old Navy brand operates approximately 1,249 North America stores; together these two anchor
              customers alone represent a potential 2,000+ store expansion TAM within existing relationships. This
              embedded expansion potential is a meaningful option value on top of the base ARR, but only if
              expansion-store pricing matches or exceeds current ACV (NRR is unknown). The autonomous checkout product
              represents additional optionality that is not captured in any current-store ARR estimate, as it is still
              in development. The asymmetry of outcomes is important for risk-adjusted assessment. In the bull case, the
              current $1B is already a reasonable entry price. In the bear case, the price is significantly wrong and a
              material write-down is plausible. This asymmetry, combined with financial opacity, is why the investment
              recommendation is PASS pending diligence rather than a conditional buy.
            claimRefs:
