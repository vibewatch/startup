      - number: '3.2'
        title: Incumbent and direct peer profiles
        blocks:
          - type: paragraph
            body: >-
              Zebra Technologies is the most consequential incumbent. The company reported FY2025 net sales of $5,396
              million, up 8.3%, and frames a $35 billion served addressable market spanning mobile computing, RFID,
              machine vision, and workflow software. Zebra explicitly characterizes RFID as a portfolio "bright spot"
              with strong momentum in retail, manufacturing, and logistics. Its RFID competitive set lists Chainway,
              Impinj, Invengo, JADAK, Rodinbell, TSC, and Ubisense—not RADAR—indicating Zebra's RFID strategy is
              hardware-oriented and not yet targeting RADAR's AI-analytics layer. Zebra's distribution is its deepest
              structural advantage: three distributors accounted for 29%, 15%, and 15% of its 2025 net sales, giving
              Zebra a channel penetration that RADAR's direct enterprise model does not match. Zebra's acquisition of
              Elo Holdings for $1.3 billion in September 2025 signals further expansion into interactive displays and
              POS workflows. Impinj is the semiconductor and platform layer beneath most RFID deployments. Its FY2025
              revenue was $361.1 million with adjusted EBITDA of $69.6 million; Q4 2025 showed sequential softness
              ($92.8M) with 2026 Q1 guidance of $71–$74M, suggesting an industry inventory-cycle headwind. Impinj's
              platform is partner-facing: it provides chip-to-cloud connectivity through a partner ecosystem and does
              not sell directly to retailers. Its Gen2X technology adds advanced data protection and privacy controls.
              Checkpoint Systems presents a vertically integrated RFID offering that spans label manufacturing, readers,
              software, and EAS anti-theft hardware. Its source-tagging model from factory to store is a direct
              competitor to RADAR for inventory management software, though Checkpoint's historical orientation is
              toward asset protection rather than the continuous-location AI layer that RADAR delivers. Trigo processes
              over 60 million shopping activities annually with non-biometric computer vision and emphasizes a
              privacy-by-design approach suitable for GDPR-sensitive European retailers. Its focus on loss prevention
              and checkout automation makes it a closer competitor to Amazon JWO than to RADAR on the product axis,
              though both Trigo and RADAR claim store-intelligence outcomes. Focal Systems pursues a similar
              shelf-intelligence use case with AI cameras, offering out-of-stock detection and replenishment workflows,
              but in a complementary layer rather than a competing full stack. Amazon's Just Walk Out (JWO) technology
              powers more than 350 stores in five countries, focused on small-format, mission-driven shopping (airports,
              stadiums, universities). Amazon announced in January 2026 that it is closing Amazon Go and converting
              Amazon Fresh stores to Whole Foods Market, a direct signal that large-format, grocery-oriented
              checkout-free retail is operationally and economically difficult even for the largest technology company
              in the world.
