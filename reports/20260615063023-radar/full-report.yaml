            title: Financial Opacity — No Audited Metrics at $1B Valuation
            body: >
              RADAR is a private-undisclosed company at a $1 billion valuation with no disclosed revenue, gross margin,
              NRR, or burn rate. All financial and operating metrics are company-sourced and unaudited. Investors are
