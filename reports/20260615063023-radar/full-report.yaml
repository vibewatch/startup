      - number: '5.5'
        title: Trust, Privacy, and Security
        blocks:
          - type: paragraph
            body: >
              RADAR's product raises specific trust and privacy considerations related to continuous RFID sensing in
              consumer-facing environments. At the item level, RFID tags track individual merchandise units rather than
              shoppers directly, but any system that links RFID tag reads to loyalty account data or payment information
              transforms item-tracking into personal data processing under GDPR and CCPA. RFID News UK noted in April
              2026 that RFID deployments linked to personal data require a lawful processing basis and, where high-risk
              to individuals, a Data Protection Impact Assessment. RADAR's published privacy policy covers website
              visitor data and does not address in-store RFID tag-read practices for retail shoppers, which is a
              transparency gap that retailers deploying the platform must address in their own consumer-facing privacy
              notices. NIST SP 800-98 remains the primary U.S. federal reference for RFID system security, covering tag
              cloning prevention, eavesdropping risk, and access control. RADAR has not published information about its
              hardware certifications, FCC compliance filings, or data retention policies for item-level RFID read logs.
