  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Sensing Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >
              RADAR's technology platform combines ceiling-mounted passive UHF RFID sensors with AI software and,
              according to its customer-facing materials, computer vision to enable real-time item-level inventory
              tracking across the full store floor. The core innovation compared with earlier RFID implementations is
              the replacement of handheld scanning wands — which require periodic manual effort and deliver only
              point-in-time snapshots — with fixed ceiling sensors that continuously read RFID-tagged items. The company
              claims its platform achieves 99% item-level inventory accuracy, compared with an industry baseline below
              70% for retailers without RFID automation. RADAR's hardware layer relies on industry-standard RAIN RFID
              (UHF passive) technology, where Electronic Product Code (EPC) identifiers are encoded on passive RFID tags
              affixed to each merchandise item. RAIN RFID readers — provided by ecosystem vendors such as Impinj or
              manufactured according to RADAR's proprietary specifications — are installed in the ceiling and
              continuously interrogate tag-laden items across a coverage area. Raw read data flows to RADAR's software
              platform, where edge and cloud processing convert tag reads into location estimates and inventory counts.
              The specific implementation of RADAR's sensing algorithms, including its claimed precision improvements
              over commodity RAIN RFID readers, is not publicly disclosed.
