  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing architecture, and monetization streams
        blocks:
          - type: paragraph
            body: >-
              RADAR's revenue model is vertically integrated and hardware-led, but the long-run economic case rests on
              recurring software and analytics. The publicly describable stack has three layers. First, proprietary
              ceiling-mounted sensors are installed in retailer stores—RADAR is the only disclosed provider of overhead
              RFID sensors at scale, and those sensors must be purchased or leased as part of any deployment. No public
              list price for hardware exists. Second, a real-time software platform sits above the hardware: it
              processes the continuous RFID location stream, converts raw tag events into operational actions
              (replenishment alerts, fulfillment routing, loss-prevention triggers, merchandising intelligence), and
              integrates with retailers' existing systems. RADAR describes this as an ongoing service rather than a
              one-time license, which implies recurring subscription revenue. Third, an analytics and AI layer—expanded
              significantly in early 2026 with the launch of Fitting Room Intelligence and Floor Set IQ—delivers
              behavioral and demand insights that go beyond inventory location. These are positioned as premium
              capabilities but it is unknown whether they are priced separately or bundled into a base subscription. The
              business model disclosed in official materials is "hardware plus software plus analytics," which maps to a
              hybrid revenue architecture common in industrial IoT platforms. The hardware component creates an upfront
              capex event for the retailer or for RADAR (depending on whether RADAR sells or leases), while the software
              layer creates a recurring annual contract value per store. RADAR's official description of delivering
              "ecommerce-level intelligence" to physical stores is consistent with a per-store or per-location SaaS
              pricing model, but no price tier, contract minimum, or ACV range has been publicly disclosed. RADAR also
              describes plans to develop autonomous checkout as an incremental revenue opportunity, funded by Series B
              proceeds. This would represent a third monetization tier that likely requires a different pricing
              mechanism—potentially a per-transaction or per-checkout-event fee model—but it remains in development and
              does not yet contribute to reported revenue. International expansion to Canada, EMEA, and Latin America
              represents geographic revenue upside, again without disclosed financial targets. The Old Navy deployment
              context gives indirect scale anchors. Gap Inc. reported 1,249 Old Navy North America stores at fiscal
              year-end 2024, which, if fully deployed under a per-store pricing model, would represent a significant
              contract value. The total addressable revenue from existing named customers (American Eagle with hundreds
              of stores fleet-wide, plus Old Navy in phased rollout) suggests material concentration risk until
              additional enterprise retailers reach full deployment. Forbes reported around a dozen retailers in active
              pilots as of May 2026, consistent with a slow-ramp enterprise GTM that is now being accelerated with
              Series B capital.
