      - number: '7.3'
        title: Privacy, Regulatory, and Legal Risk
        blocks:
          - type: paragraph
            body: >
              RFID-based retail systems sit at the intersection of several regulatory regimes that are actively
              evolving. RAIN RFID in the United States operates in the 902–928 MHz UHF band under FCC Part 15 rules; the
              FCC has historically maintained stable power limits for this band, but spectrum management is a policy
              decision subject to change. NIST Special Publication 800-98, the governing federal guidance on RFID
              security, formally identifies RFID infrastructures as potential targets for eavesdropping, unauthorized
              tracking, replay attacks, and data-integrity compromise, creating a compliance and audit expectation for
              enterprise deployments. RADAR's published privacy policy does not disclose any independent security audit,
              third-party penetration testing schedule, or data-breach notification SLA, leaving the security posture
              unverifiable from public information alone.

              GDPR and state-level privacy laws including CCPA and CPRA may apply to RFID-based inventory systems if
              item-level tag reads are linked to consumer profiles, loyalty transactions, or checkout events — a linkage
              that RADAR's own autonomous-checkout roadmap makes increasingly plausible. EMEA expansion would subject
              RADAR to national DPA enforcement regimes with significantly stricter requirements than current US
              practice. On the IP front, RFID retail patents such as US20230252283A1 cover aspects of overhead RFID
              retail technology; RADAR's freedom-to-operate status against this and related patents has not been
              confirmed in any public filing. The FCC consumer guidance explicitly flags privacy sensitivity for
              item-level RFID reading in retail environments, a signal that regulatory attention is not hypothetical.
              Collectively, these regulatory, security, and IP exposures could result in compliance remediation costs,
              enforcement actions, or forced product-architecture changes that are not reflected in the current
              valuation.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
          - type: table
            tableRef: TR001
            claimRefs:
