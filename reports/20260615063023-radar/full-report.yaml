  - id: TV005
    title: Thesis-break and kill-criteria triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - YoY ARR growth falls below 30%
        - >-
          Undermines the growth-premium multiple embedded in $1B valuation; base case implied multiple rises to 20x+ at
          current price
        - Reassess entry price; target $500–650M if confirmed; defer or exit position at Series C
      - - NRR deterioration
        - NRR falls below 100% (net churn in installed base)
        - Land-and-expand model loses its primary growth engine; revenue becomes dependent on new enterprise wins only
        - Immediately reassess if confirmed; NRR below 90% is a near-certain write-down signal
      - - Anchor customer deployment pause
        - American Eagle or Old Navy publicly slows or pauses fleet expansion with RADAR
        - Removes 60–70% of expected near-term store count growth; base case ARR collapses
        - Exit or write-down immediately; thesis requires both anchor accounts executing full fleet plans
      - - New enterprise wins below plan
        - Fewer than 3 new enterprise retailer signings in 12 months post-Series B (vs. stated "tens" target)
        - >-
          Confirms the historically slow GTM (1 new customer/year) has not been fixed by fresh capital; growth becomes
          dependent on existing customer expansion only
        - Issue a watch flag; 2 consecutive weak quarters → reassess or exit
      - - Autonomous checkout cost overrun
        - >-
          Checkout product requires materially more sensor/camera infrastructure per store than inventory-only
          deployment, confirmed by a technical specification or pilot disclosure
        - Eliminates the checkout optionality premium embedded in $1B; reduces total addressable expansion
        - Reduce target valuation by 10–20%; revise bull case downward
      - - Multiple compression in VC/tech market
        - >-
          Public IoT/SaaS sector EV/Revenue multiples compress below 7x (e.g., Impinj falls to $2.5B market cap or
          Samsara falls below 7x P/S)
        - Likely down-round risk at next liquidity event; $1B entry becomes above-market
        - Hedge position; negotiate anti-dilution protection at entry
    notes: >-
      Thresholds are defined as investment monitoring triggers, not accounting thresholds. Each trigger should prompt a
      formal reassessment of the investment thesis. Multiple simultaneous triggers are likely sufficient to invalidate
      the bull and base cases and initiate an exit review.
    claimRefs:
      - CV033
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and Revenue (Blocking)
        - Audited ARR as of last quarter-end; total revenue for last two fiscal years; YoY growth rate
        - >-
          ARR is the primary input to all three valuation methods; without it, no revenue multiple or scenario matrix
          can be validated; blocking for any price-sensitive investment decision
        - >-
          Request from CFO Abi Viswanathan; require audit confirmation; verify revenue recognition policy for hardware
          (upfront vs. ratable)
      - - Gross Margin (Blocking)
        - Hardware gross margin, software gross margin, and blended gross margin for last four quarters
        - >-
          Determines whether RADAR economics are closer to Impinj (52.5%) or Samsara (76.7%), and whether the business
          is capital-efficient at scale; drives DCF and long-run exit-multiple assumptions
        - >-
          Request segment P&L with hardware COGS disclosed separately from software subscription COGS; reconcile to
          audited financials
      - - NRR and Cohort Data (Blocking)
        - Net Revenue Retention, Gross Revenue Retention, and expansion curves by customer cohort
        - >-
          NRR determines whether the land-and-expand engine is working; AEO and Old Navy expansion within existing
          relationships may inflate headline store count without representing new ARR generation
        - >-
          Request NRR schedule from CFO; ask specifically whether fleet expansion within AEO and Old Navy is captured in
          the base ARR or is incremental
      - - ACV / Pricing (Blocking)
        - Average annual contract value per store, by customer size tier, and hardware pricing (lease vs. sell)
        - >-
          Required to test scenario matrix assumptions; $25K ACV vs $65K ACV difference determines whether $1B is fair
          or severely stretched
        - >-
          Request enterprise master agreement template, pricing schedule, and representative SOW; confirm whether
          hardware is upfront, leased, or included in ACV
      - - Burn Rate and Cash Position (Material)
        - Monthly cash burn for last three months; current cash balance; 18-month financial projection
        - >-
          $170M provides directional runway comfort but its adequacy cannot be assessed without the burn; at $20M/month
          burn, runway is <9 months from Series B close
        - >-
          Request balance sheet and CFO-prepared burn and runway schedule; verify international and hardware R&D are
          fully loaded into burn projection
      - - Customer Concentration (Material)
        - Revenue contribution from top 3 customers as % of total ARR; customer count breakdown by revenue band
        - >-
          High concentration in AEO and Old Navy (both strategic investors) makes the reference-customer independence
          argument weak; need to know if concentration exceeds 80% of ARR
        - >-
          Request customer revenue report from CFO; confirm whether secondary customers (e.g., Levi's, other pilots) are
          paying contracts or non-revenue pilots
    notes: >-
      Items classified as blocking must be resolved before committing capital; material items affect confidence and
      valuation but do not prevent investment if other conditions are met. Sequence: items 1-3 should be addressed in
      initial management session; items 4-6 in follow-up due diligence.
