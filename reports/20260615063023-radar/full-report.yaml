      - number: '1.5'
        title: Public diligence gaps and risk flags
        blocks:
          - type: paragraph
            body: >-
              The chapter closes with several investor-relevant cautions. First, RADAR’s public disclosures are
              unusually strong on customer outcomes and deployment counts but weak on classic governance and financial
              transparency: there is no public board roster, no disclosed current headcount, and no audited revenue or
              ARR number. Second, the headquarters story is not fully normalized across sources; New York is the stated
              headquarters in customer-facing launch materials, while the privacy policy publishes a San Diego legal
              contact address and other materials describe a multi-city office footprint. Third, the company’s
              autonomous-checkout narrative should be treated as optional upside rather than underwritten base-case
              value. Independent and academic sources continue to describe RFID-plus-vision retail systems as
              operationally challenging, privacy-sensitive, and harder to scale economically than marketing suggests.
              Finally, the category is strategically attractive enough that large incumbents and adjacent automation
              vendors continue to invest, which validates the market but also raises execution pressure on a
              still-private company with limited public governance disclosure.
