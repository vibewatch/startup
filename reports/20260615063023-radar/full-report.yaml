  foundingLocation: null
  headquarters: New York, New York
  productSummary: >-
    Overhead RFID ceiling-sensor arrays that read item-level tags across the sales floor, stockroom, and fitting rooms
    at an eight-second full-inventory snapshot cadence, feeding a real-time software platform that delivers
    replenishment alerts, BOPIS fulfillment routing, shrink detection, and merchandising intelligence. A premium
    analytics tier (Fitting Room Intelligence, Floor Set IQ) adds behavioral and demand insight. Autonomous checkout is
    on the product roadmap, funded by Series B proceeds.
  customerFocus: Large-format apparel and specialty retail enterprise accounts.
  businessModel: >-
    Proprietary ceiling sensors sold or leased per store, plus a recurring software and analytics subscription priced
    per store per year. Exact ACV, contract lengths, and pricing tiers are not publicly disclosed. Autonomous checkout,
    currently in development, would represent an additional monetization tier.
