      - number: '7.2'
        title: Hardware Capital Intensity and Rollout Execution Risk
        blocks:
          - type: paragraph
            body: >
              RADAR's ceiling-mounted RFID sensor array requires significant per-store capital expenditure covering
              proprietary hardware, installation, power and network infrastructure, and integration into each retailer's
              back-end systems. This hardware-first model distinguishes RADAR from pure SaaS platforms and makes each
              new deployment a capital-intensive construction project rather than a software license. The $170 million
              Series B — one of the largest recent single raises in retail technology — implies substantial remaining
              capital requirements to scale from 1,400 to tens of thousands of stores globally. At a rough average
              deployment cost of several tens of thousands of dollars per store, the Series B funds would support only a
              few thousand additional deployments before additional capital is needed.

              International expansion into EMEA, Canada, and Latin America — all cited in RADAR's Series B materials —
              introduces incremental hardware cost, field-service infrastructure, and logistics complexity. Older store
              formats with non-standard ceiling heights, non-standard network environments, or complex stockroom
              architectures create per-store installation friction that cannot be eliminated through software updates
              alone. The hardware supply chain for custom RFID ceiling sensors depends on specialized electronics
              manufacturers whose capacity constraints can throttle deployment velocity in peak periods. Amazon's
              decision to remove Just Walk Out technology from its Fresh grocery stores in 2024 demonstrates that
              hardware-intensive autonomous retail deployments can be reversed when accuracy or economics disappoint at
              scale, suggesting RADAR faces a similar scaling-risk ceiling if sensor performance degrades in real-world
              store environments outside its current customer base.
