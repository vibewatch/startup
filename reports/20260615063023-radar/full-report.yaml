  - id: FV004
    title: Investment KPIs — IC-ready scoring
    type: kpi
    layout: standard
    summary: >-
      Qualitative investment committee scoring across seven dimensions, calibrated against public evidence available as
      of June 2026.
    data:
      items:
        - label: Market opportunity
          value: 8 / 10
          unit: score
          context: >-
            $16B+ RFID retail market growing at 8-9% CAGR; autonomous checkout adjacency; global retail digitization
            tailwind is structural and durable
        - label: Product and deployment proof
          value: 7 / 10
          unit: score
          context: >-
            1,400+ stores live; two flagship enterprise deployments at scale; documented customer ROI metrics
            (company-reported); autonomous checkout in development adds optionality
        - label: Competitive moat
          value: 7 / 10
          unit: score
          context: >-
            Proprietary ceiling-sensor architecture; software platform stickiness; first-mover in large-format apparel
            RFID; AEO and Gap Inc. as strategic investors create barriers; weaker against well-capitalized new entrants
        - label: Business economics
          value: 4 / 10
          unit: score
          context: >-
            No ARR, gross margin, or NRR disclosed; hardware COGS create working capital intensity; score would rise to
            7+ if ARR $75M+, gross margin $55%+, and NRR 110%+ are confirmed
        - label: Management and execution
          value: 7 / 10
          unit: score
          context: >-
            Spencer Hewett (founder/CEO) demonstrated patient enterprise sales execution; CFO Abi Viswanathan (ex-Nuro,
            ex-Uber) adds institutional finance capability; simultaneous international+checkout+hardware roadmap creates
            execution risk
        - label: Valuation support
          value: 5 / 10
          unit: score
          context: >-
            Reasonable in bull case (ACV $65K+ implied ARR $100M); stretched in base case (ACV $45K implied ARR $63M at
            16x); insufficient evidence to confirm which scenario is correct
        - label: Evidence quality
          value: 3 / 10
          unit: score
          context: >-
            Seven blocking or material evidence gaps; all financial metrics undisclosed; customer metrics are
            company-reported; strategic investor alignment limits independence of reference proof; score heavily
            penalizes opacity
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV020
      - CV035
      - CV041
      - CV042
