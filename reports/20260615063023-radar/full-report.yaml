  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context, methodology, and critical missing inputs
        blocks:
          - type: paragraph
            body: >-
              RADAR's $170 million Series B, announced 19 May 2026 at a $1 billion post-money valuation, is a confirmed
              market event reported by Business Wire (the official company press release), CNBC, Forbes, PYMNTS, and
              numerous technology-sector outlets. The unicorn milestone is not in dispute. What is in dispute is whether
              $1 billion reflects a defensible price for an investor acquiring today, and that question cannot be
              answered because the company has publicly disclosed no ARR, annual revenue, gross margin, net revenue
              retention, customer acquisition cost, or cash burn. Those omissions are not unusual for a private Series B
              company, but they mean that this chapter must operate entirely in implied-valuation space: working
              backward from the price to derive what the financial profile would need to look like to justify it, and
              then testing those implied requirements against the evidence. Three methodological pillars structure the
              analysis. First, a revenue-multiple proxy: using comparable public RFID and IoT SaaS companies to derive
              an appropriate EV/Revenue multiple band and back-calculating the required ARR. Second, a store-count
              proxy: using the disclosed deployment footprint (1,400+ stores) as the revenue numerator, applying a range
              of ACV-per-store assumptions, and computing the implied revenue multiple at each scenario. Third, a
              scenario matrix: systematically varying ACV and store-count assumptions across bull, base, and bear cases
              to produce a valuation range. All three methods are constrained by the same gap: RADAR's true ACV and ARR
              are unknown. Any valuation conclusion presented here is therefore explicitly an estimated-confidence
              inference, not a verified fact. The chapter flags the six specific financial disclosures that an investor
              must obtain before committing capital at or near $1 billion. Without those disclosures, the honest
              analytical stance is: the market opportunity and proof metrics are compelling; the price is reasonable in
              the bull case and stretched in the base case; and no final investment recommendation is possible with
              evidence of appropriate quality.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
