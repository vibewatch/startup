  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      RADAR's public product story layers merchandise tags, ceiling sensing hardware, analytics processing, and
      retail-facing applications into one integrated stack.
    approximationNotes: >-
      The figure is synthesized from public company, customer, and standards sources rather than copied from a
      vendor-published engineering diagram.
    data:
      layers:
        - id: tagged-items
          label: Tagged merchandise layer
          detail: Individual items carry EPC-encoded passive UHF RAIN RFID tags that make each unit machine-readable.
        - id: ceiling-sensing
          label: Ceiling sensing layer
          detail: >-
            Fixed overhead readers, antennas, and proprietary sensors continuously interrogate tagged items across the
            store.
        - id: edge-eventing
          label: Edge event processing
          detail: Raw tag reads are filtered, normalized, and prepared for real-time location and movement estimation.
        - id: cloud-analytics
          label: Cloud analytics and intelligence
          detail: RADAR software computes inventory counts, item location, movement patterns, and exception signals.
        - id: retail-workflows
          label: Associate and customer workflows
          detail: >-
            Mobile lookup, replenishment, omnichannel fulfillment, and autonomous checkout consume the intelligence
            output.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE008
      - CE023
      - CE038
  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      The customer-facing operating flow runs from tagged-item awareness to associate action, cart automation, and final
      inventory-state updates.
    approximationNotes: This flow condenses RADAR's public use-case descriptions into a simple seven-step operating sequence.
    data:
      nodes:
        - id: tag-item
          label: Item is RFID tagged
          detail: Merchandise enters the store carrying an EPC-compliant passive UHF tag.
        - id: sense-item
          label: Ceiling sensors read item movement
          detail: Overhead readers continuously capture the location and movement of tagged merchandise.
        - id: update-state
          label: Inventory state is updated
          detail: RADAR analytics convert read events into current inventory location and availability.
        - id: associate-query
          label: Associate locates product
          detail: Staff query the platform to find a requested item or confirm availability.
        - id: shopper-browse
          label: Shopper selects items
          detail: The system observes which tagged items the shopper carries or returns while browsing.
        - id: digital-cart
          label: Digital cart is built
          detail: Checkout logic adds items to a virtual basket as the customer shops.
        - id: exit-payment
          label: Exit triggers payment and final update
          detail: At store exit, the customer is charged and the inventory record reflects the completed sale.
      edges:
        - from: tag-item
          to: sense-item
          label: identify merchandise
        - from: sense-item
          to: update-state
          label: stream read events
        - from: update-state
          to: associate-query
          label: expose item location
        - from: update-state
          to: shopper-browse
          label: maintain live availability
        - from: shopper-browse
          to: digital-cart
          label: infer carried items
        - from: digital-cart
          to: exit-payment
          label: settle purchase
    claimRefs:
      - CE006
      - CE017
      - CE023
      - CE040
  - id: FE003
    title: Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
