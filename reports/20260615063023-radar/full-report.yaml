          - type: callout
            title: Mitigating Factor — RFID Spectrum Stability Near-Term
            body: >
              The 902–928 MHz UHF RAIN RFID band has been stable under FCC Part 15 for over a decade, with no pending
              reallocation proposals as of June 2026. This reduces near-term spectrum risk for RADAR's US fleet. RFID
              industry bodies (RAIN RFID Alliance, AIM Global) actively monitor FCC proceedings and would provide early
              warning of any spectrum-management change. International expansion into EU frequencies (868 MHz) is a
              manageable hardware engineering challenge, not a regulatory prohibition.
