      - number: '1.3'
        title: Scale, customers, and customer-proofed operating impact
        blocks:
          - type: paragraph
            body: >-
              RADAR’s public scale story strengthened materially between 2025 and 2026. Official March 2025 customer
              materials said the platform powered nearly 600 stores across three billion-dollar brands, while the May
              2026 financing announcement said deployments had expanded to more than 1,400 stores. Those later
              disclosures specifically named American Eagle Outfitters and Old Navy, and Forbes described nearly 1,500
              American Eagle and Old Navy storefronts on the platform with another roughly dozen retailers in pilots.
              The product value proposition is tightly tied to omnichannel execution and shrink control. Old Navy’s
              launch announcement described multi-year nationwide rollout plans built around real-time item location for
              store associates, replenishment, and buy-online-pick-up-in-store workflows. CNBC then supplied the most
              concrete operating proof points, reporting that some RADAR users reduced order cancellations from 25% to
              3% and that one client cut shrink 60% at a pilot site. Forbes added that customers have reported 10% or
              greater in-store revenue growth, although that metric remains management-reported rather than
              independently audited.
