  - id: FR001
    title: Risk Severity–Likelihood Heatmap
    type: matrix
    layout: wide
    summary: >
      Qualitative risk heatmap mapping RADAR's principal risk categories across two dimensions: likelihood (rows, from
      High to Low) and business impact (columns, from Low to Critical). Cell values name the specific risk event.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - Minor sensor accuracy variation in edge-case stores
            - RFID reader firmware incompatibility gap
            - Financial opacity / unverified unit economics disclosed unfavorably
            - Anchor customer (AEO or Old Navy) terminates RADAR contract
        - label: Medium Likelihood
          values:
            - Tag supply price increase (5–10%)
            - Competitive RFID-analytics product from Impinj or Zebra
            - Old Navy / Gap budget cut pauses deployment expansion
            - Autonomous checkout fails accuracy threshold → fleet rollback
        - label: Low Likelihood
          values:
            - Privacy regulator inquiry (no fine)
            - FCC spectrum NPRM opens for 900 MHz band
            - IP litigation or injunction from patent holder
            - CEO (Spencer Hewett) departure without successor in place
    approximationNotes: >
      Likelihood and severity are qualitative analyst judgments; no probability distribution or financial impact
      quantification is available given RADAR's private-undisclosed status.
