          Scale and deployment proof are strong; financial opacity limits judgment on whether price is right. Confidence
          would rise substantially with audited ARR and segment gross margin.
      - - Risk Rating
        - High
        - >-
          Customer concentration (2 strategic anchor customers), hardware COGS uncertainty, autonomous retail execution
          risk, undisclosed burn, and constrained IPO exit window combine to a high risk profile.
      - - Valuation Stance
        - Rich in base case; reasonable in bull case
        - >-
