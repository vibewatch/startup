      - number: '4.5'
        title: Public comparables, valuation multiples, and implied revenue range
        blocks:
          - type: paragraph
            body: >-
              RADAR's $1 billion post-money Series B valuation embeds a growth premium that only makes sense if
              investors are assuming revenue multiples well above public-market SaaS benchmarks. As of June 2026, public
              vertical SaaS comps in the POS & Retail Management Software category trade at approximately 1.6x NTM
              revenue (multiples.vc), Supply Chain Management Software trades at ~3.1x, and AI-native applications trade
              at approximately 3.8x NTM revenue. The Aventis SaaS advisors report shows a public-market median
              EV/Revenue multiple of approximately 3.4x as of March 2026, reflecting significant compression from the
              2021 peak and AI disruption pressures on horizontal SaaS. Applying those ranges to RADAR's $1 billion
              valuation produces an implied ARR range: at 1.6x (POS/retail comp median), implied revenue would be ~$625
              million—implausibly high for a company at this stage. At 15-25x (growth-stage private premium for a
              high-growth AI+hardware platform), implied ARR would be $40-67 million. At 30-50x (early unicorn with path
              to scale), implied ARR would be $20-33 million. These ranges are purely mechanical—RADAR has not disclosed
              revenue—but they suggest investors are pricing in strong hypergrowth expectations rather than current
              fundamentals. The RFID infrastructure comparables also matter. Impinj's FY2025 revenue was $361.1 million
              at a 55.3% non-GAAP gross margin, and its Q4 2025 showed sequential softness ($92.8M), with Q1 2026
              guidance of $71-$74M suggesting an industry inventory cycle headwind. Impinj trades at semiconductor
              multiples rather than software multiples, reflecting its chip-and-platform model. Zebra Technologies
              trades at roughly 2x EV/Revenue as a mature hardware-plus-services incumbent ($5.4B revenue, moderate
              EBITDA margins). Neither comp directly maps to RADAR's AI-software-plus-proprietary-hardware model, but
              both set ceiling and floor expectations for margin profiles. The most relevant comparable for RADAR's
              future state would be a vertical AI SaaS company with a hardware-attach model (think service-robot
              analogs, computer-vision platforms, or industrial IoT), which historically trades at 5-15x revenue at
              strong growth rates. At a 10x multiple on assumed current ARR of $30-50 million, RADAR's enterprise value
              would be $300-500 million—below its current $1 billion valuation—suggesting the current valuation prices
              in 2-3 years of at least 40-50% annual growth. Whether that is achievable depends on how quickly RADAR can
              add new enterprise relationships (the bottleneck the Series B is designed to fix) and whether its software
              margin can expand as hardware becomes commoditized. Self-checkout and autonomous retail market context
              adds opportunity framing: the global self-checkout system market was valued at ~$5.3-5.8 billion in 2025,
              growing at 13-14% CAGR. RADAR's autonomous checkout ambitions, if realized, could extend its revenue per
              store substantially beyond inventory intelligence alone.
