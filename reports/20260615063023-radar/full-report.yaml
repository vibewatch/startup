      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The six diligence items below are prerequisites for any investment decision at or near the $1B price. They
              are presented in order of materiality, not difficulty of acquisition. Items 1–3 are blocking: without
              them, price cannot be validated. Items 4–6 are material but not blocking; they affect the confidence level
              of the investment rather than its feasibility. Thesis-break triggers are equally important. They define
              the conditions under which the investment thesis would be falsified—where a yes-to-invest recommendation,
              once made on the basis of favorable diligence, would need to be unwound or written down. Key triggers
              include: ARR growth decelerating below 30% YoY (suggests the land-and-expand engine is plateauing), NRR
              declining below 100% (suggests churn within the installed base), American Eagle or Gap Inc. reducing their
              deployment plans (indicates the flagship customers are not generating ROI at full fleet scale), and RADAR
              failing to add more than 2–3 new enterprise relationships in the 12 months following the Series B
              (suggests the $170M acceleration plan is not materializing). Any single trigger should prompt a
              reassessment; two simultaneous triggers are likely sufficient to invalidate the base and bull cases. The
              autonomous checkout thesis-break is separate: if RADAR announces materially higher cost-per-store for the
              autonomous checkout product than its current inventory-only deployment (e.g., if checkout requires more
              sensors, cameras, or integration complexity than presently disclosed), the optionality value embedded in
              the $1B price is eroded. Amazon's explicit failure is the most relevant precedent, and RADAR has not yet
              disclosed enough technical detail about its checkout architecture to assess whether it has solved the key
              economic barriers that Amazon did not.
            claimRefs:
              - CV043
              - CV044
              - CV045
              - CV046
              - CV047
