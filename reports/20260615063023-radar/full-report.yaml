      - number: '2.2'
        title: 'Market size: a credible core market exists, but SAM is enterprise-heavy and narrower than headline TAMs'
        blocks:
          - type: paragraph
            body: >-
              Third-party market reports converge on a global retail-RFID market of roughly $16 billion in 2026, while
              self-checkout sits in a separate but adjacent $5.9 billion to $6.6 billion range. Zebra’s annual report
              frames an even broader $35 billion served addressable market spanning connected-frontline and
              asset-visibility workflows. Those categories overlap, so they should not be summed mechanically. Instead,
              they bracket RADAR’s opportunity. The broad problem space is clearly large; the more relevant core market
              is the subset of retail RFID spend tied to in-store item visibility, omnichannel fulfillment, shrink
              reduction, and associate workflows. That still appears big enough to support venture-scale outcomes,
              especially because large apparel fleets such as Old Navy demonstrate that a single enterprise relationship
              can span more than a thousand stores. The evidence therefore supports a layered sizing view: broad
              automation TAM above $15 billion, core near-term SAM in the low single-digit billions, and a current
              capturable SOM that is much smaller but already validated by 1,400-plus live stores.
