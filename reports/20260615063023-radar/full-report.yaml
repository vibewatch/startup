companyProfile:
  summary: >-
    RADAR (legal entity: Automaton, Inc. dba RADAR) is a vertically integrated retail-technology company that installs
    proprietary overhead RFID ceiling sensors in retail stores and layers real-time inventory intelligence, analytics,
    and fulfillment software on top. Founded in 2013 by Spencer Hewett, the company operates a
    hardware-plus-recurring-SaaS model in which sensors are deployed to each physical store and a continuous software
    platform converts the resulting RFID signal stream into replenishment, omnichannel fulfillment, loss-prevention, and
    merchandising workflows. As of May 2026, RADAR had more than 1,400 stores live and raised $170 million in a Series B
    at a $1 billion post-money valuation. Its two publicly confirmed production-scale customers — American Eagle
    Outfitters and Old Navy (Gap Inc.) — are also strategic investors, a dual role that shapes the company's disclosure
    posture. Revenue, ARR, gross margin, and NRR are not publicly disclosed; the financial profile is
    private-undisclosed.
