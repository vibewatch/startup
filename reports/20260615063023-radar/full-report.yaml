      - number: '4.3'
        title: Cost structure, hardware economics, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              RADAR's cost structure is more capital-intensive than a pure-software business because it manufactures or
              procures proprietary ceiling sensors that must be physically installed in each store. This creates three
              distinct cost layers: hardware bill-of-materials (sensors, RFID infrastructure, installation labor),
              software and cloud infrastructure (continuous processing of 100+ billion item events per day requires
              non-trivial compute), and ongoing R&D for the AI/analytics layer and next-generation sensor hardware. The
              public record does not disclose RADAR's hardware margin or cost of goods sold. However, the economics of
              RFID-adjacent public companies provide useful proxies. Impinj—the leading RAIN RFID chip and platform
              provider—reported FY2025 revenue of $361.1 million with a non-GAAP gross margin of 55.3%, and an adjusted
              EBITDA of $69.6 million (19.3% EBITDA margin). Zebra Technologies, which bundles RFID hardware, software,
              and services across retail and supply chain, reported FY2025 gross profit of $2,593 million on $5,396
              million of net sales, yielding a 48.1% blended gross margin across hardware and services. Both comps
              suggest that a hardware-plus-software RFID platform can achieve gross margins in the high 40s to mid-50s
              at scale, but those figures reflect mature companies. RADAR, as an early-stage vertically integrated
              manufacturer with low production volumes relative to either comp, almost certainly carries higher per-unit
              hardware costs. Amazon's Just Walk Out experience is an important adverse cost benchmark. Forbes
              explicitly noted that Amazon's camera-based system required hundreds of cameras and weight sensors per
              store, making it economically uncompetitive—and Amazon formally closed its Amazon Go stores and began
              converting Amazon Fresh to Whole Foods in January 2026. RADAR argues its ceiling-sensor architecture is
              more cost-efficient (requiring "a few sensors installed to the ceiling" rather than hundreds of cameras),
              and there is no public evidence contradicting that claim. However, TechPinions has highlighted that
              autonomous retail broadly is harder than anticipated, and RADAR's next hardware generation (funded by
              Series B) implies existing sensors are not the final cost structure. Series B use-of-funds disclosures
              explicitly name "advance next-generation sensor hardware" as a capital priority. This means a portion of
              the $170 million will be consumed by hardware R&D capex rather than generating immediate revenue. The
              company's store deployment rate of ~100 new locations per month implies significant ongoing COGS from
              sensor procurement and installation, even if each marginal deployment is profitable at the software level.
