        title: Customer and Revenue Concentration Risk
        blocks:
          - type: paragraph
            body: >
              RADAR's publicly confirmed production-scale deployments as of May 2026 are concentrated almost entirely
              within two corporate families: American Eagle Outfitters (AEO) and Gap Inc.'s Old Navy brand. The May 2026
              Series B press release stated 1,400-plus stores under management, but the only named fleet-wide production
              customers are these two apparel groups. Jay Schottenstein, AEO's executive chairman and CEO, occupies the
              uniquely entangled position of simultaneously being RADAR's first production customer and a named equity
              investor — an arrangement that creates governance opacity around arm's-length contract terms, renewal
              incentives, and the credibility of AEO's public endorsement of RADAR's technology.

              The March 2025 Old Navy launch materials referenced a pipeline of thirty-plus brands; by May 2026, RADAR
              described approximately twelve active pilots beyond its two anchor customers, implying a
              pipeline-to-production conversion rate of roughly 40 percent over 14 months. Gap Inc. reported declining
              total net revenues for its fiscal year ending February 2026, reducing the budget headroom that Old Navy's
