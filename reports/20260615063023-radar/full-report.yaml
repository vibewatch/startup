      - number: '7.4'
        title: Autonomous-Checkout Scaling and Competitive Displacement Risk
        blocks:
          - type: paragraph
            body: >
              RADAR's medium-term roadmap includes autonomous checkout, a product category that has proved significantly
              harder to commercialize than initial proponents anticipated. Techpinions published a detailed critique
              identifying autonomous retail as harder than expected due to sensor-fusion complexity, multi-modal
              calibration requirements, high edge-case failure rates, and hidden integration costs. Amazon's retreat
              from Just Walk Out in its Fresh grocery stores in 2024 provides the clearest market precedent: even a
              technology company with vast capital and compute resources could not achieve the accuracy and unit
              economics required for mass-market grocery autonomous checkout, validating the skeptic case.

              Competitive displacement from incumbent RFID vendors is a parallel threat. Zebra Technologies reported
              2025 revenues of approximately $4.3 billion and operates an installed base spanning thousands of retail
              accounts with deep integration partnerships. Checkpoint Systems and Sensormatic hold entrenched positions
              in retail loss-prevention RFID and could expand upward into inventory analytics. Impinj, which dominates
              the RFID semiconductor supply chain with approximately $380 million in 2025 revenues, has direct retailer
              relationships that could support a vertical extension into software and analytics — effectively squeezing
              RADAR from below as a key supplier. Computer-vision startups including Focal Systems, Trigo, and
              Standard.ai offer alternative approaches to autonomous store operations that compete indirectly. RADAR's
              headline 99 percent or greater inventory accuracy claim originates from company marketing and has not been
              independently validated by a third-party audit, academic study, or published customer case study with
              methodology disclosed.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
          - type: table
            tableRef: TR002
            claimRefs: []
      - number: '7.5'
        title: Financial Transparency and Proof-Quality Risk
        blocks:
          - type: paragraph
            body: >
              RADAR is a private company with no disclosed revenue, ARR, gross margin, burn rate, or unit economics in
              any public filing or audited document. Every operating and financial metric circulating in investor and
              press contexts — store counts, deployment speed, customer outcomes — originates from the company itself
              and has not been independently verified. A $1 billion valuation on a base of 1,400 reported production
              stores implies a per-store revenue or value-creation expectation that cannot be cross-checked against
              public information. The absence of an independent audit, S-1, or verified third-party financial disclosure
              means investors are pricing a unicorn with zero financial transparency.

              Customer outcome metrics cited in public materials — including a 10 percent or greater in-store revenue
              uplift, BOPIS cancellation rates falling from 25 percent to 3 percent, and a 60 percent shrink reduction
              in one pilot — were published in company-curated press releases and case studies without audit,
              independent methodology, or control-group data. CBInsights profiles the legal entity Automaton, Inc. as
              private with no disclosed financials, consistent with the total absence of independent verification. No
              major independent analyst firm (Gartner, Forrester, IDC) has published a publicly available risk or
              competitive assessment of RADAR's revenue, market position, or sustainability. The governance structure
              introduces an additional layer of opacity: Jay Schottenstein serves simultaneously as RADAR's largest
              named production customer and a named investor, raising questions about the independence of the commercial
              relationships underpinning the reported store-count growth.
