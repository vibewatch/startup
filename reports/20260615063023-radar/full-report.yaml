      - number: '2.3'
        title: Buyers, use cases, and adoption motion favor large omnichannel retailers
        blocks:
          - type: paragraph
            body: >-
              The buyer pattern is clearer than the exact budget line. RADAR’s strongest public customer proof comes
              from large apparel fleets that already care about item-level accuracy, fitting-room visibility,
              buy-online-pick-up-in-store execution, and shrink reduction. Old Navy’s rollout and Gap’s store base show
              why the category is enterprise-led: deploying overhead sensors, software integrations, and associate
              workflows is a fleet decision, not a point solution for small merchants. Adjacent market sources reinforce
              the same direction of travel. Retail-tech vendors and industry coverage repeatedly describe stores as
              multi-purpose hubs, micro-fulfillment points, and data-rich operational nodes where RFID, computer vision,
              and AI help staff act on real-time inventory conditions. Adoption also appears to follow a predictable
              motion—pilot, measure shrink and fulfillment outcomes, then roll out fleet-wide—which favors vendors with
              demonstrable ROI and deployment credibility over concept-stage entrants.
