            title: Amazon JWO retreat confirms inventory intelligence is the defensible core; checkout is upside
            body: >-
              Amazon closing Amazon Go and converting Amazon Fresh stores in January 2026 is the strongest recent
              validation that autonomous-checkout-at-scale is economically and operationally hard even for an
              unlimited-capital operator. For RADAR investors, this confirms the appropriate underwriting anchor:
              inventory intelligence, shrink reduction, and omnichannel fulfillment are near-term, proven use cases with
