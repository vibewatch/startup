            body: >-
              Zebra Technologies' $5.4 billion revenue base, three-distributor channel (59% of sales), and RFID "bright
              spot" momentum position it as the only competitor that could credibly build or acquire an AI inventory
              analytics layer. The Elo acquisition at $1.3 billion demonstrates Zebra's willingness to pay for adjacent
