      - number: '7.6'
        title: Operational, Key-Person, and International Expansion Risk
        blocks:
          - type: paragraph
            body: >
              Spencer Hewett, the founder and CEO, is the sole executive with sustained public visibility across RADAR's
              entire history. All investor communications, product announcements, media interviews, and customer
              partnerships have been conducted under his leadership. Until May 2026, the only other named senior hire
              was Abi Viswanathan as CFO — an appointment that signals growing financial discipline but also introduces
              execution uncertainty at a critical growth inflection. Hewett's departure or impairment would remove
              RADAR's primary customer relationship anchor, product visionary, and investor-trust center simultaneously,
              creating a company-level key-person risk that is unusually acute for a company at $1 billion valuation.

              International expansion introduces compound operational risks. RFID UHF frequency bands differ by region
              (868 MHz in the EU versus 902–928 MHz in the US), requiring separate hardware SKUs or firmware adaptations
              and adding supply-chain complexity. Data-residency requirements, product safety certifications, and local
              employment law in EMEA and Latin America have not been publicly addressed by RADAR. The hardware supply
              chain for RFID ceiling sensors — covering readers, antennas, cabling, mounting hardware, and power systems
              — spans multiple specialized electronics manufacturers exposed to tariff, component-shortage, and
              logistics disruption. SML Group and Avery Dennison, the dominant RFID tag manufacturers, supply the
              merchandise-level tags that are a precondition for RADAR's platform; any supply-chain consolidation or
              pricing shift in that upstream layer affects all of RADAR's retail customers' willingness to expand. RADAR
              has not publicly disclosed board composition, independent director count, audit committee status, or
              investor governance rights, compounding the key-person risk with structural governance opacity.
