- id: leadership-capital-stakeholders
  title: Leadership, investors, and stakeholder structure
  body: 'Founder Spencer Hewett remains the central public face of RADAR and is consistently identified as founder
    and chief executive across company, customer, and financial-press sources. In May 2026, RADAR added Abi Viswanathan
    as CFO, signaling a transition from founder-led early scaling into more formal financial and operating discipline
    ahead of a much larger deployment phase. Public investor disclosures are stronger on named capital providers
    than on governance specifics. The May 2026 Series B was co-led by Gideon Strategic Partners and Nimble Partners,
    with Align Ventures participating, while earlier official materials named Founders Fund, Y Combinator, Sound
    Ventures, Beanstalk, Gideon VC, and the Agnelli family among backers. Strategic retail backing is especially
    notable: March 2025 materials named American Eagle, Gap Inc., and Lojas Renner among the company’s retailer
    supporters, and CNBC/PYMNTS explicitly described American Eagle CEO Jay Schottenstein as both a backer and the
    leader of RADAR’s first fleet-wide retailer customer. What remains opaque is board composition, ownership percentages,
    and the exact fully diluted cap table, all of which require management diligence rather than desktop research.'
