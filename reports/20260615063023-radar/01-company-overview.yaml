company:
  name: RADAR
chapter:
  number: 1
  title: Company Overview
  summary: RADAR is a private retail-technology company founded in 2013 by Spencer Hewett that sells a vertically
    integrated overhead RFID, software, and analytics platform for real-time item-level inventory visibility. Public
    disclosures show the company scaled from nearly 600 stores across three billion-dollar brands in March 2025
    to more than 1,400 stores by May 2026, when it raised a $170 million Series B at a $1 billion valuation and
    named Abi Viswanathan CFO. The public record also shows material diligence gaps around exact headcount, board
    composition, and the distinction between its New York headquarters claims and its San Diego legal contact address.
sections:
- id: identity-business-model
  title: Identity, operating footprint, and business model
  body: 'RADAR presents itself as an AI-powered retail intelligence platform built around overhead RFID sensors,
    software, and analytics. The company homepage and jobs page both frame the product as a response to a persistent
    retail inventory-control problem: stores still struggle to know what is on the sales floor versus the stockroom
    in real time, which weakens replenishment, omnichannel fulfillment, and customer service. Official legal documents
    identify the operating entity as Automaton, Inc. doing business as RADAR. Public location disclosures are directionally
    consistent but not perfectly clean. The March 2025 Old Navy launch materials say RADAR is headquartered in New
    York, while the privacy policy lists a San Diego contact address and the company separately discloses offices
    in New York, San Diego, and the Bay Area/San Francisco. Taken together, the evidence supports a New York-centered
    operating identity with a multi-office footprint, but investors should still request the principal executive
    office and legal-entity chart directly. The monetization model appears to be hardware plus recurring software
    and analytics: RADAR sells ceiling-mounted sensor deployments, integrates with retailer systems, and layers
    analytics, replenishment, fulfillment, and autonomous-checkout workflows on top.'
