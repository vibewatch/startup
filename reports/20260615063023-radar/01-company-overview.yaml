  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hq-disclosure
    missingEvidence: A single primary corporate document that explicitly states RADAR's principal executive office
      address and reconciles the New York headquarters description with the San Diego legal contact address.
    whyItMatters: Headquarters and principal-office clarity matter for legal diligence, tax nexus, and management-location
      assessment.
    diligencePath: Request the certificate of incorporation, good-standing filings, and an officer-certified corporate
      fact sheet.
    relatedQuestionRefs:
    - QO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board roster, ownership percentages, share classes, and any investor governance rights or side
      letters.
    whyItMatters: The public record names investors but not who controls board decisions, liquidation rights, or
      major protective provisions.
    diligencePath: Request the current cap table, investor rights agreement, voting agreement, and board-consent
      schedule.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee headcount by function and geography.
    whyItMatters: Headcount is needed to assess operating leverage, deployment capacity, burn, and readiness for
      international expansion.
    diligencePath: Request the latest org chart, employee census, and open-requisition list.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: material
    topic: funding-history
    missingEvidence: A precise lifetime capital-raised figure that bridges pre-Series-B capital with the May 2026
      round.
    whyItMatters: Public sources only provide a >$100M pre-2026 floor plus the $170M Series B, which is insufficient
      for exact dilution and runway analysis.
    diligencePath: Request the historical financing schedule, SAFEs/convertibles table, and closing capitalization
      for each round.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO004
