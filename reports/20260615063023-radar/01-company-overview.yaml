- id: milestones-trajectory
  title: Milestones and trajectory into the 2026 unicorn round
  body: The available public record is thinner on RADAR’s early years than on its 2025–2026 expansion phase, but
    there is still a clear chronology. The company was founded in 2013 by Spencer Hewett. By March 2025, RADAR had
    already accumulated more than $100 million of capital, nearly 600 deployed stores, three billion-dollar brands,
    and a stated pipeline of more than 30 additional brands. That same month, Old Navy publicly committed to a phased
    nationwide rollout, which is strategically important because Gap Inc. reported 1,249 Old Navy North America
    stores at fiscal year-end 2024, creating a very large installed-base opportunity if the rollout completes. In
    May 2025, RADAR refreshed its legal website policies under the Automaton, Inc. dba RADAR name. The decisive
    inflection came on May 19, 2026, when RADAR announced a $170 million Series B at a $1 billion valuation, disclosed
    more than 1,400 live stores and over 100 billion daily item events, and said proceeds would fund more deployments,
    better sensors, AI analytics, autonomous checkout, and international expansion.
