  topStrengths:
    - Only known overhead RFID platform deployed at fleet scale in large-format apparel retail, with 1,400+
      live stores and documented customer ROI (cancellation rates 25%→3%, 60% shrink reduction at one pilot,
      10%+ in-store revenue uplift reported by customers).
    - Strong strategic and financial investor ecosystem including Founders Fund, Y Combinator, American Eagle CEO,
      and Gap Inc.; fresh $270M estimated capital base and experienced CFO Abi Viswanathan added in May 2026.
    - Proprietary ceiling-sensor architecture with claimed 99% item accuracy at an eight-second cadence and
      >100B daily item events creates a high switching-cost data platform moat.
  topRisks:
    - Acute revenue concentration — American Eagle Outfitters and Old Navy are the only confirmed production-scale
      customers, and both are also strategic investors, reducing the independence of commercial proof points and
      creating an existential concentration risk.
    - Complete financial opacity — ARR, gross margin, NRR, burn rate, and CAC are all undisclosed, making it
      impossible to validate whether the $1B valuation is fair, stretched, or materially overpriced without
      management-provided financials.
    - Hardware capital intensity and supply-chain dependency limit new-customer acquisition velocity and create
      working capital risk not present in pure-software peers; Amazon's exit from checkout-free retail
      demonstrates the execution difficulty facing RADAR's highest-upside product bet.
    - Single founder-CEO key-person concentration (Spencer Hewett) with no independent audit, analyst
      coverage, or third-party validation of any financial or operational metric at a $1B valuation.
  unresolvedGaps:
    - ARR, YoY revenue growth, gross margin by segment (hardware vs. software), NRR, and CAC/payback period
      are all undisclosed; no investment decision at the $1B price is supportable without them.
    - Total capital raised (~$270M) and current cash runway are unconfirmed estimates; actual burn rate and
      liquidity position require management disclosure.
    - Board composition, governance rights, and cap table are opaque; the entanglement of strategic investors
      as primary customers requires an independent governance review before closing.
    - Headcount and organizational depth beyond the two named executives are undisclosed; no independent
      audit or third-party verification of any RADAR financial or operational metric exists.
