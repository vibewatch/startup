companyProfile:
  summary: >-
    RADAR (legal entity: Automaton, Inc. dba RADAR) is a vertically integrated retail-technology company that
    installs proprietary overhead RFID ceiling sensors in retail stores and layers real-time inventory
    intelligence, analytics, and fulfillment software on top. Founded in 2013 by Spencer Hewett, the company
    operates a hardware-plus-recurring-SaaS model in which sensors are deployed to each physical store and a
    continuous software platform converts the resulting RFID signal stream into replenishment, omnichannel
    fulfillment, loss-prevention, and merchandising workflows. As of May 2026, RADAR had more than 1,400 stores
    live and raised $170 million in a Series B at a $1 billion post-money valuation. Its two publicly confirmed
    production-scale customers — American Eagle Outfitters and Old Navy (Gap Inc.) — are also strategic
    investors, a dual role that shapes the company's disclosure posture. Revenue, ARR, gross margin, and NRR
    are not publicly disclosed; the financial profile is private-undisclosed.
  foundedDate: null
  founders:
    - name: Spencer Hewett
      role: Founder and CEO
      background: Sole founder; has led all customer, investor, and product strategy since the company's 2013 founding.
      claimRefs: [CO010, CO011]
  foundingLocation: null
  headquarters: New York, New York
  productSummary: >-
    Overhead RFID ceiling-sensor arrays that read item-level tags across the sales floor, stockroom, and
    fitting rooms at an eight-second full-inventory snapshot cadence, feeding a real-time software platform
    that delivers replenishment alerts, BOPIS fulfillment routing, shrink detection, and merchandising
    intelligence. A premium analytics tier (Fitting Room Intelligence, Floor Set IQ) adds behavioral and
    demand insight. Autonomous checkout is on the product roadmap, funded by Series B proceeds.
  customerFocus: Large-format apparel and specialty retail enterprise accounts.
  businessModel: >-
    Proprietary ceiling sensors sold or leased per store, plus a recurring software and analytics
    subscription priced per store per year. Exact ACV, contract lengths, and pricing tiers are not publicly
    disclosed. Autonomous checkout, currently in development, would represent an additional monetization tier.
  stage: Series B
  fundingStatus: >-
    $170M Series B (May 2026) at $1B post-money valuation, co-led by Gideon Strategic Partners and Nimble
    Partners, with Align Ventures participating. Prior disclosed capital exceeds $100M, from strategic
    backers including American Eagle, Gap Inc., and Lojas Renner, plus financial investors Founders Fund,
    Y Combinator, Sound Ventures, Beanstalk, Gideon VC, and the Agnelli family. Total cumulative capital
    estimated at approximately $270M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO010, CO011, CO012, CO013, CO018, CO033, CI030, CI034]
