company:
  name: RADAR
chapter:
  number: 3
  title: Competitors
  summary: >-
    RADAR's most formidable competitive risk comes not from direct AI peers but from Zebra Technologies,
    a $5.4 billion incumbent with an established RFID hardware portfolio and a global distribution network
    that RADAR lacks entirely. Among software-first peers, Trigo and Focal focus on computer vision rather
    than RFID and serve partly different use cases. Amazon's January 2026 retreat from large-format
    checkout-free stores confirms that autonomous checkout at scale remains economically hard, which
    de-risks the checkout segment for RADAR while validating the simpler inventory-intelligence core.
    RADAR's proprietary sensor hardware, 100-billion-event daily data flywheel, and 1,400-store beachhead
    create switching costs, but distribution thinness and undisclosed pricing leave material diligence gaps.

sections:
- id: competitive-landscape-overview
  title: Competitive landscape and category map
  body: >-
    RADAR occupies a distinct niche at the intersection of RFID infrastructure and AI software analytics,
    but it competes across four meaningful competitive categories that any diligence framing must distinguish.
    First, infrastructure incumbents—led by Zebra Technologies and Impinj—supply the RFID readers, chips,
    and printers that sit beneath any deployment; Zebra also sells workflow software and has begun embedding
    AI into its portfolio. Second, integrated RFID-plus-software providers such as Checkpoint Systems and
    Sensormatic offer end-to-end systems historically focused on EAS loss prevention and basic inventory
    tracking, without RADAR's real-time ceiling-sensor model. Third, computer-vision-first AI peers—Trigo,
    Focal Systems, and Standard AI—pursue the same store-intelligence outcome but from camera-based sensor
    stacks rather than RFID. Fourth, Amazon's Just Walk Out serves an adjacent autonomous-checkout job,
    using computer vision and optional RFID to eliminate checkout lines entirely. The status quo—manual
    handheld-wand RFID scanning that delivers periodic point-in-time inventory snapshots—remains the
    most common substitute for any of these systems and the alternative that RADAR most consistently
    displaces. NRF 2026 showed the competitive field broadening: Beontag, Simbe, Wiliot, CONTROLTEK,
    Honeywell, and Manhattan Associates all presented RFID or AI inventory solutions, confirming that
    the market is attracting new entrants even as the incumbents invest in their platforms.
    The critical framing for investors is that RADAR is a full-stack platform rather than a component vendor.
    Impinj sells chips; Zebra sells hardware bundles; Trigo sells camera AI; only RADAR bundles proprietary
    ceiling sensors, real-time software, and continuous-learning analytics into a single enterprise subscription
    that a retailer can deploy without assembling a technology stack from multiple vendors.
