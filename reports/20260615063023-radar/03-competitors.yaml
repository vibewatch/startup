- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat Claim
  - Primary Threat
  - Severity
  - Evidence
  - Mitigation / Diligence Ask
  rows:
  - - Proprietary ceiling sensor hardware creates switching costs
    - Zebra or a contract manufacturer builds a standard RFID ceiling-mount reader at commodity price
    - High
    - Zebra RFID described as bright spot; competitors listed are hardware-only vendors; no ceiling-sensor incumbent identified yet
    - Validate RADAR patent portfolio; confirm sensor IP is defensible beyond trade secret
  - - 100B event/day data flywheel improves AI models continuously
    - Competitor achieves similar dataset scale via different channel (e.g. Zebra acquires a retailer analytics firm)
    - Medium
    - No public peer dataset of comparable size or specificity confirmed
    - Confirm data governance rights; verify that data can be used across customers for model training
  - - Multi-year enterprise contracts and deep WMS/OMS integration create lock-in
    - Retailer terminates contract at renewal after deploying own RFID + open-source analytics
    - Medium
    - POS/retail SaaS switching costs high per multiples.vc coverage; no RADAR churn data disclosed
    - Obtain NRR data; verify contract term lengths and termination penalty clauses
  - - Zebra lacks a ceiling-sensor AI-analytics product today
    - "Zebra acquires or builds an AI inventory analytics product (acquisition model is proven: Elo was $1.3B)"
    - High
    - Zebra acquired Elo for POS/display workflow; RFID analytics is an adjacent M&A target
    - Monitor Zebra roadmap and acquisitions; track Zebra Analytics product investment
  - - RFID privacy regulation favors vendor maturity over new entrants
    - EU RFID regulations mandate compliance overhead that makes enterprise deployment more expensive
    - Medium
    - Indetgroup and inventorfid document active GDPR concerns for RFID deployments in garments
    - Audit RADAR's GDPR compliance posture and data-retention policy for European expansion
  - - Amazon JWO retreat validates RADAR's inventory-intelligence-first thesis
    - Amazon re-enters large-format retail with a revised technology and competes for the same fleet relationships
    - Low (near-term)
    - Amazon closing Amazon Go; converting Amazon Fresh to Whole Foods; JWO focused on small-format venues
    - Track Amazon's retail technology licensing business; maintain awareness of re-entry risk in 12–24 months
  notes: >-
    Severity ratings are qualitative judgments based on evidence availability and structural factors.
    Absence of a threat does not mean the threat is unreal; it means insufficient evidence was available
    to bound severity. Diligence asks are investor-facing questions for in-process due diligence.
