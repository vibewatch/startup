- id: capability-pricing-distribution-comparison
  title: Capability, pricing, and distribution comparison
  body: >-
    The most structurally important contrast between RADAR and its competitive alternatives is the
    continuous-versus-snapshot dichotomy. RADAR's ceiling-mounted sensors capture a complete store
    inventory snapshot every eight seconds, achieving 99% item-level accuracy; manual handheld-wand
    scanning done periodically is the dominant substitute and delivers only a point-in-time snapshot
    with typical retail inventory accuracy below 70%. Zebra mobile computers and RFID sleds enable
    the handheld-wand model; Zebra does not offer a ceiling-sensor autonomous-counting product.
    RADAR's customers reportedly achieved measurable ROI: one client saw a 60% shrink reduction
    in a pilot store, and BOPIS cancellation rates fell from 25% to 3% at deployments that activate
    the omnichannel-fulfillment workflow. With 100 billion item-level events processed per day, RADAR's
    data flywheel is its most durable competitive asset—no incumbent or peer has acknowledged a comparable
    dataset of continuous in-store product-movement data.
    Pricing across the competitive set is not publicly disclosed by any vendor. RADAR, Zebra, Checkpoint,
    and Impinj all negotiate enterprise contracts without published rate cards. The adjacent POS and
    inventory software market provides a rough benchmark: per-location SaaS fees of $50–$300 per month
    are typical for lighter inventory-management tools, while full-stack RFID deployments carry upfront
    hardware capital costs and multi-year service contracts. RADAR's model appears to be a recurring
    software subscription with hardware bundled or leased, but no contract economics have been publicly
    disclosed; this is a material diligence gap for any financial model.
    On distribution, the competitive contrast is stark. Zebra's channel spans three major distributors
    accounting for 59% of its revenue, plus thousands of VARs, ISVs, and OEMs globally. RADAR sells
    direct to enterprise chains. That direct model is typical for early-stage enterprise SaaS and offers
    better margin capture, but it also creates a concentration risk: losing one of RADAR's two known
    anchor customers (American Eagle or Old Navy) would be materially more damaging than the equivalent
    event at Zebra. Distribution reach will also constrain RADAR's expansion into mid-market or
    international retail unless it builds indirect channel relationships or acquires channel-familiar talent.
