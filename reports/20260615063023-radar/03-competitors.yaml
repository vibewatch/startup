callouts:
- calloutType: risk
  title: Zebra's incumbency and channel dominance is the most durable competitive threat
  body: >-
    Zebra Technologies' $5.4 billion revenue base, three-distributor channel (59% of sales), and RFID "bright spot"
    momentum position it as the only competitor that could credibly build or acquire an AI inventory analytics layer.
    The Elo acquisition at $1.3 billion demonstrates Zebra's willingness to pay for adjacent software-first assets.
    RADAR must either achieve enterprise lock-in faster than Zebra can respond—or accept that a future Zebra acquisition
    of a competing analytics firm creates a bundled ceiling-sensor-plus-analytics offering that undercuts RADAR's
    standalone value proposition.
  claimRefs:
  - CP006
  - CP009
  - CP010
  - CP011
  - CP039

- calloutType: insight
  title: Amazon JWO retreat confirms inventory intelligence is the defensible core; checkout is upside
  body: >-
    Amazon closing Amazon Go and converting Amazon Fresh stores in January 2026 is the strongest recent validation
    that autonomous-checkout-at-scale is economically and operationally hard even for an unlimited-capital operator.
    For RADAR investors, this confirms the appropriate underwriting anchor: inventory intelligence, shrink reduction,
    and omnichannel fulfillment are near-term, proven use cases with demonstrated ROI at 1,400+ stores. Autonomous
    checkout is a roadmap item and should be modeled as optionality, not base-case revenue.
  claimRefs:
  - CP021
  - CP023
  - CP028
  - CP030
  - CP042

- calloutType: assumption
  title: Pricing and unit economics are entirely unverified—a blocking gap for any financial model
  body: >-
    No vendor in this competitive landscape—RADAR, Zebra, Checkpoint, Impinj, Trigo, or Focal—publicly discloses
    per-store pricing, ACV, gross margin, or contract duration. RADAR's commercial model is inferred as recurring
    subscription with bundled hardware, but the actual ACV per store, renewal rates, and gross margin structure
    must be validated in the data room before any financial modeling is reliable. This is not a competitive
    disadvantage per se, but it represents a critical gap in the available public evidence.
  claimRefs:
  - CP035
  - CP036

