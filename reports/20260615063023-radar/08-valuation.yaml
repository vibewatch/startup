callouts:
- calloutType: recommendation
  title: Investment recommendation — PASS / Research-More
  body: >-
    RADAR is a compelling company building real technology with proof of enterprise-scale deployment.
    The $1B valuation is defensible if ARR is $75M+ growing ≥50% YoY with NRR ≥110%—metrics we
    cannot confirm or deny because none are disclosed. The honest recommendation at current evidence
    quality is PASS / research-more: complete the six diligence asks (ARR, gross margin, NRR, ACV,
    burn, concentration) before committing capital. If diligence confirms bull-case metrics, enter
    at or near $1B. If it confirms base-case metrics, negotiate to $600–750M or wait. If it
    confirms bear-case metrics, pass entirely.
  claimRefs:
  - CV001
  - CV020
  - CV035
  - CV041

- calloutType: risk
  title: Financial opacity is the key investment risk
  body: >-
    Every other risk in this report (customer concentration, autonomous checkout, competition, burn)
    is secondary to the fundamental opacity around revenue. RADAR has $270M in total disclosed
    funding and 1,400 deployed stores—enough operational scale that an investor should reasonably
    expect audited financials to be available in a diligence process. The absence of public disclosure
    is standard for a private company, but it means the entire investment thesis rests on the quality
    and completeness of what RADAR chooses to share in a data room. Any investor taking the $1B at
    face value without verifying the six diligence items is underwriting a leap of faith, not a
    diligenced transaction.
  claimRefs:
  - CV035
  - CV043
  - CV044
  - CV045
  - CV046

- calloutType: assumption
  title: Key modelling assumptions and limitations
  body: >-
    All scenario ARR estimates assume uniform ACV across the active store base. In practice, anchor
    customers likely received introductory pricing; new retailers may pay full price. The blended
    ACV could be lower than the marginal ACV. Store deployment count (1,400+) is a floor, not a
    verified count. Revenue recognition policy for hardware is unknown and could cause GAAP revenue
    to differ materially from cash ACV. No private-round comparable data for Trigo, Standard.AI,
    or other retail tech startups is available. All figures in the scenario matrix and sensitivity
    analysis should be treated as order-of-magnitude estimates, not precise financial projections.
  claimRefs:
  - CV006
  - CV025
  - CV031

