  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Audited ARR, total revenue, and YoY growth rate for at least two fiscal years
    whyItMatters: >-
      Without ARR, the revenue multiple embedded in RADAR's $1B valuation cannot be validated. All three
      valuation methods (revenue proxy, store-count proxy, scenario analysis) are constrained by this gap.
      The gap is the single most important blocker for any investment recommendation at this price level.
    diligencePath: >-
      Request audited income statement and ARR schedule from CFO Abi Viswanathan; require independent
      audit confirmation; confirm revenue recognition policy for hardware (point-in-time vs. ratable)
    relatedQuestionRefs:
    - QV014
    - QV006

  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin by revenue stream — hardware, software subscription, analytics, and services
    whyItMatters: >-
      Determines whether RADAR is priced at a hardware company multiple (~11x per Impinj) or a SaaS
      multiple (~12x per Samsara). A blended gross margin below 50% would significantly discount the
      appropriate multiple range.
    diligencePath: >-
      Request segment P&L with hardware COGS disclosed separately from software subscription costs;
      reconcile to audited financials
    relatedQuestionRefs:
    - QV015
    - QV030

  - type: private-evidence-only
    severity: blocking
    topic: nrr
    missingEvidence: Net Revenue Retention, Gross Revenue Retention, and expansion curves by customer cohort
    whyItMatters: >-
      With American Eagle nearly at full fleet deployment, NRR may be approaching a plateau. Without
      NRR data, it is impossible to distinguish a healthy land-and-expand motion from a one-time
      deployment pattern that generates minimal expansion revenue after initial fleet completion.
    diligencePath: >-
      Request NRR and GRR by cohort year from RADAR CFO; ask specifically whether AEO fleet expansion
      and Old Navy phased rollout represent base ARR or incremental ARR
    relatedQuestionRefs:
    - QV016
    - QV033

  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: ACV per store by customer size tier, hardware pricing model (sell vs. lease vs. ACV-inclusive), and representative contract terms
    whyItMatters: >-
      ACV is the critical unknown that determines which scenario (bear/base/bull) is correct. A $25K
      ACV means $1B is grossly overpriced; a $65K ACV means $1B may be fair. The entire investment
      decision depends on this one unknown.
    diligencePath: >-
      Request pricing schedule, enterprise master agreement template, average ACV by retailer size,
      and audited revenue recognition footnotes
    relatedQuestionRefs:
    - QV017
    - QV031
    relatedTableRefs:
    - TV003

  - type: private-evidence-only
    severity: material
    topic: burn-rate
    missingEvidence: Monthly cash burn for last three months, current cash balance, and 18-month financial projection
    whyItMatters: >-
      At $15–20M/month burn (plausible for rapid hardware+software scaling), $170M provides only 9–11
      months of runway. An investor entering at $1B must understand whether the capital raised is
      sufficient to reach the ARR milestone that justifies the valuation at the next financing event.
    diligencePath: >-
      Request latest balance sheet and CFO-approved burn and runway schedule; verify international
      expansion and next-generation sensor hardware costs are fully loaded into the projection
    relatedQuestionRefs:
    - QV027

  - type: enumeration-incomplete
    severity: minor
    topic: private-round-comps
    missingEvidence: Valuation and ARR data for comparable private retail tech and RFID startup rounds in 2025–2026
    whyItMatters: >-
      Comparable private round data would strengthen the public-comps analysis and provide a direct
      benchmark for RADAR's $1B price. Private comparables (Trigo, Standard.AI) are undisclosed.
    diligencePath: >-
      Request VC database access (PitchBook, CB Insights) for private RFID/retail-tech round valuations;
      ask lead investors for comparable term sheets from recent enterprise retail SaaS rounds
    relatedQuestionRefs:
    - QV001
    - QV005
    relatedTableRefs:
    - TV004

  - type: missing-source
    severity: material
    topic: customer-independence
    missingEvidence: >-
      Independent third-party assessment of RADAR's customer proof points; arms-length evidence that
      American Eagle and Gap Inc. ROI metrics were not influenced by their investor status
    whyItMatters: >-
      Without independent verification, the ROI metrics attributed to RADAR by its two largest customers—
      who are also strategic investors—cannot be used as unbiased reference proof. An investor relying
      solely on these customer statements may be underweighting the alignment bias risk.
    diligencePath: >-
      Request independent retailer references from RADAR's pilot customers who are not investors;
      commission third-party store performance audit of at least 3 RADAR-equipped vs. comparable
      non-RADAR stores within the same retailer fleet
    relatedQuestionRefs:
    - QV018

  - type: missing-source
    severity: material
    topic: comp-proof-benchmark
    missingEvidence: >-
      Comparable disclosure set from other retail tech unicorns at Series B stage (e.g., store count,
      ARR, NRR, growth rate) to benchmark RADAR's proof package against industry standard
    whyItMatters: >-
      Without a benchmark for what a comparable retail tech unicorn disclosed at Series B, it is
      impossible to judge whether RADAR's proof package is exceptional, average, or below-standard
      for its valuation tier
    diligencePath: >-
      Review public Series B filings and press releases for comparable enterprise retail tech companies;
      consult industry databases for comparable fundraising disclosure levels
    relatedQuestionRefs:
    - QV032

