- id: public-comparable-analysis
  title: Public comparable company analysis and implied revenue multiple band
  body: >-
    Three public companies serve as the primary comparables for RADAR's valuation: Impinj (NASDAQ: PI),
    Samsara (NYSE: IOT), and Zebra Technologies (NASDAQ: ZBRA). Each represents a different slice of
    the RFID and IoT platform ecosystem, and the range of their revenue multiples defines the
    reasonable zone for RADAR's implied multiple.
    Impinj is the most direct technical analog: the company is the leading RAIN RFID chip and reader
    platform provider, supplying the underlying chip and platform infrastructure that enables the
    ecosystem RADAR deploys. Impinj reported FY2025 revenue of $361 million with a gross margin of
    approximately 52.5%, reflecting its hardware-intensive product mix. As of June 2026, Impinj's market
    capitalization is approximately $4.04 billion, implying a price-to-sales multiple of roughly 11.2x
    trailing twelve-month revenue. That multiple is not inflated by high growth: Impinj's FY2025 revenue
    growth was slightly negative (-1.4%), meaning the market is valuing Impinj primarily on strategic
    moat and recurring platform economics rather than growth velocity. RADAR, which benefits from much
    faster deployment growth, would reasonably command a premium to Impinj.
    Samsara is the best structural analog for RADAR's software economics: an IoT platform that converts
    sensor data into operational workflows for asset-intensive enterprises (fleet management rather than
    retail stores, but the architectural parallel is clear). Samsara reported FY2026 revenue of $1,619
    million growing at 29.6% YoY, with a gross margin of approximately 76.7% reflecting pure SaaS
    economics. Its market capitalization of $19.61 billion implies a P/S multiple of approximately
    12.1x. The significantly higher gross margin (76.7% vs. Impinj's 52.5%) reflects Samsara's
    success at scaling without a hardware COGS burden—an outcome RADAR has not yet demonstrated
    publicly. RADAR's valuation would need to prove gross-margin quality closer to Samsara's SaaS
    profile to justify a Samsara-like multiple without the revenue scale.
    Zebra Technologies anchors the low end of the comparable set: a mature, diversified enterprise
    technology company serving retail, supply chain, and manufacturing with RFID hardware, software,
    and services. Zebra's FY2025 revenue of $5.4 billion at a market cap of $10.88 billion yields a
    P/S multiple of approximately 2.0x—a level consistent with a mature business with high hardware
    revenue, modest organic growth, and strong free cash flow generation. RADAR should not and does not
    trade at Zebra multiples at this stage; the low end of the RADAR multiple discussion is bounded by
    the risk scenario where the ARR base is very small.
    The BVP Nasdaq Emerging Cloud Index, which tracks over 70 public cloud software companies, provides
    a market-wide SaaS reference point. The index's current composition implies cloud software companies
    generally trade at 8–15x forward revenue in mid-2026. Multiples.vc data for the POS and retail
    management software category shows a 5–8x median, with high-growth outliers reaching 12–18x.
    Taking these references together, a reasonable revenue multiple band for RADAR at its current growth
    profile is 10–15x, with the midpoint at 12x. At 12x, supporting a $1B valuation requires
    approximately $83M in ARR. The KPMG Venture Pulse Q1 2026 report notes that AI-focused companies
    commanded premium fundraising multiples in early 2026, a tailwind that partially explains why
    RADAR attracted a price at the high end of the comparable band despite no disclosed revenue.
    Applying a customary 20–25% private-company discount to the public comp midpoint would imply a
    fair multiple range of 8–11x for a private transaction, requiring ARR of $90–125M to justify $1B.
    That range is achievable only in the bull case.
