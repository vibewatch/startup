tables:
- id: TV001
  title: Recommendation summary
  columns:
  - Dimension
  - Rating / Stance
  - Rationale
  rows:
  - - Recommendation
    - PASS / Research-More
    - >-
      $1B is defensible in the bull case but unverifiable without ARR, gross margin, and NRR disclosure.
      Cannot make a price-sensitive buy recommendation with current evidence quality.
  - - Confidence
    - Low–Medium
    - >-
      Scale and deployment proof are strong; financial opacity limits judgment on whether price is right.
      Confidence would rise substantially with audited ARR and segment gross margin.
  - - Risk Rating
    - High
    - >-
      Customer concentration (2 strategic anchor customers), hardware COGS uncertainty, autonomous retail
      execution risk, undisclosed burn, and constrained IPO exit window combine to a high risk profile.
  - - Valuation Stance
    - Rich in base case; reasonable in bull case
    - >-
      At ACV $45K/store, implied ARR ≈$63M and $1B = 15.9x—stretched. At ACV $65K/store, implied ARR
      ≈$104M and $1B = 9.6x—defensible relative to Impinj and Samsara public comps.
  - - Target return / entry price
    - $1B entry only if ARR ≥$75M, growth ≥50%, NRR ≥110%
    - >-
      If diligence confirms bull-case metrics, $1B is a fair price. If base-case metrics apply,
      negotiate to $600–750M. Bear-case scenario warrants a pass at any price without new enterprise
      customer evidence.
  notes: >-
    Recommendation ratings are based on public evidence only. All financial metrics (ARR, gross margin,
    NRR, burn) are estimated from store-count proxies and public comparable benchmarks; none are
    disclosed by RADAR or independently verified.
