chapter:
  number: 2
  title: Market Analysis
  summary: 'RADAR sells into a large but easily overstated opportunity: the broad automation and asset-visibility problem in physical retail is large, but the core near-term market is narrower and concentrated in large multi-store retailers already investing in RFID, unified commerce, and omnichannel fulfillment. Public sources support a layered view in which retail RFID alone is a roughly $16 billion 2026 category, self-checkout adds a $6 billion adjacent workflow, and large-enterprise apparel and general-merchandise chains form the most plausible near-term beachhead. The biggest underwriting mistake would be to treat those overlapping categories as additive or to assume autonomous checkout scales as easily as inventory intelligence.'
sections:
- id: market-boundary-and-category-shape
  title: 'Market boundary: core inventory intelligence versus adjacent automation categories'
  body: RADAR should not be valued against a single monolithic “retail AI” market number. The strongest evidence supports a layered market structure. At the center is item-level retail inventory intelligence built on RFID, real-time data capture, and analytics; around that sits a broader automatic-identification and asset-visibility market that also includes mobile computing, printing, machine vision, and self-service workflows; and beside it sits an adjacent autonomous-checkout category that RADAR can address but does not need to win for the core thesis to work. This matters because the core inventory-visibility problem is real and urgent—physical retail still represents the majority of commerce, retailers still suffer poor inventory accuracy, and omnichannel fulfillment turns stores into mini-fulfillment nodes—but adjacent checkout automation has a different adoption profile, economics, and risk curve. The strongest public evidence also shows that retailers are buying these systems to
    solve live operational pain, not to experiment with novelty. For diligence, the right frame is therefore “inventory intelligence first, autonomous checkout second.”
