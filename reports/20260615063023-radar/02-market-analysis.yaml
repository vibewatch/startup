tables:
- id: TM001
  title: RADAR Market Boundary and Adjacent Category Map
  columns:
  - Layer
  - What it Includes
  - Representative Evidence
  - Why it Matters for RADAR
  rows:
  - - Core category
    - Item-level in-store inventory intelligence using RFID, sensors, and analytics
    - RADAR funding release; Old Navy rollout; Impinj platform; inventory-accuracy sources
    - This is the underwriting center because it maps directly to accuracy, fulfillment, and shrink outcomes.
  - - Broad enabling market
    - AIDC, asset visibility, mobile workflows, RFID, printing, machine vision, and self-service automation
    - Zebra 2025 annual report
    - Shows the problem space is large, but it is broader than RADAR’s direct product footprint.
  - - Adjacent workflow market
    - Self-checkout and autonomous-checkout systems
    - Global Market Insights; The Business Research Company; Just Walk Out
    - Relevant for optional upside, but demand drivers and deployment economics differ from core inventory intelligence.
  - - Enterprise retail beachhead
    - Large omnichannel chains already operating RFID-tagged or high-SKU store fleets
    - Old Navy / Gap; American Eagle proof in financing and media
    - This is where deployment complexity is justified by labor, shrink, and fulfillment ROI.
  notes: This table defines market layers rather than summing them. The broad AIDC market overlaps with retail RFID and self-checkout, so categories should be interpreted as bounding lenses, not additive TAM blocks.
