- id: TM004
  title: Market Tailwinds, Constraints, and Diligence Implications
  columns:
  - Factor
  - Direction
  - Evidence
  - Implication for RADAR
  rows:
  - - Unified-commerce urgency
    - Tailwind
    - Honeywell; Increff; Old Navy
    - Supports demand for real-time inventory data across store and e-commerce workflows.
  - - Persistent inventory inaccuracy
    - Tailwind
    - SCMR; ControlTek; Impinj
    - Makes accuracy ROI legible to buyers even before checkout automation is considered.
  - - Labor cost and front-end automation
    - Tailwind
    - GM Insights; The Business Research Company; Just Walk Out
    - Creates adjacent demand for checkout-related workflows and faster store operations.
  - - Hardware deployment and integration complexity
    - Constraint
    - Old Navy-scale rollout requirements; enterprise deployment logic
    - Slows adoption outside large fleets with strong ROI cases and integration capacity.
  - - Privacy and sensing concerns
    - Constraint
    - arXiv survey; checkout-free sources
    - Requires careful governance and may slow expansion into more surveillance-sensitive formats.
  - - Autonomous-checkout economics
    - Constraint
    - Techpinions; Just Walk Out pilot guidance
    - Supports treating checkout as upside rather than the core market assumption.
  notes: The same sources that show market momentum also show where adoption can stall. Investors should separate core inventory-intelligence demand from more speculative autonomous-checkout assumptions.
