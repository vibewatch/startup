callouts:
- calloutType: strength
  title: Real-time inventory visibility has already crossed from concept to operating budget line
  body: Industry and customer sources agree that stores are now expected to function as fulfillment nodes, not just selling floors. That makes item-level visibility a live operational requirement rather than an experimental analytics project.
  claimRefs:
  - CM014
  - CM015
  - CM030
  - CM038
- calloutType: risk
  title: The easiest modeling error is double-counting overlapping TAM categories
  body: Retail RFID, self-checkout, and Zebra’s wider AIDC market are all useful lenses, but they overlap substantially. Adding them together would inflate RADAR’s realistic opportunity and obscure where the company actually has proof today.
  claimRefs:
  - CM003
  - CM005
  - CM007
  - CM029
  - CM040
- calloutType: insight
  title: Old Navy proves why one enterprise can be strategically meaningful
  body: Gap’s 1,249-store Old Navy fleet shows that even a narrow segment such as large apparel chains can support venture-scale opportunity when the workflow touches fulfillment, labor, and shrink across every store.
  claimRefs:
  - CM012
  - CM030
  - CM031
- calloutType: recommendation
  title: Underwrite the market on inventory intelligence first and checkout optionality second
  body: The evidence supports strong demand for accuracy, replenishment, and omnichannel execution. It is much less conclusive that autonomous checkout will scale as quickly or as profitably. Keeping those two layers separate improves diligence discipline.
  claimRefs:
  - CM011
  - CM024
  - CM025
  - CM026
  - CM037
