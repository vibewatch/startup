  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-boundary
    missingEvidence: A primary or high-quality third-party source that directly segments the retail-RFID market into in-store intelligence software/services versus broader tag, reader, and supply-chain spend.
    whyItMatters: Without that segmentation, RADAR’s SAM must be inferred from broader market reports, which introduces real sizing uncertainty.
    diligencePath: Request management’s internal market model and any third-party analyst decks used in fundraising to support the SAM split.
    relatedQuestionRefs:
    - QM004
    - QM010
  - type: private-evidence-only
    severity: material
    topic: buyer-committee
    missingEvidence: Signed deal-level data showing the exact budget owner, buying committee, payback threshold, and average contract value for RADAR deployments.
    whyItMatters: The buyer pattern is directionally visible, but investment underwriting is stronger when the actual budget line and payback hurdle are known.
    diligencePath: Request three recent closed-won deal memos plus one lost-deal postmortem covering sponsor roles and budget authority.
    relatedQuestionRefs:
    - QM016
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: target-universe
    missingEvidence: A credible global census of enterprise retailers that are both RFID-ready and operationally suitable for overhead in-store intelligence deployments.
    whyItMatters: The adoption funnel and near-term SOM depend on how many retailers are realistically deployment-ready, not just theoretically interested.
    diligencePath: Build a target-account census from NRF attendee lists, top-chain rankings, RFID-adoption disclosures, and management CRM segmentation.
    relatedQuestionRefs:
    - QM021
