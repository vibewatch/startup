- id: TM002
  title: Buyer Segment and Purchase-Driver Map
  columns:
  - Buyer segment
  - Operational trigger
  - Typical executive sponsors
  - Why RADAR fits or does not fit
  enumerationScope:
    coverage: partial
    basis: Representative enterprise-retail segments inferred from the reviewed sources; not a complete global retailer census.
  rows:
  - - Large apparel chains
    - Need item-level visibility across floor, fitting room, and stockroom for omnichannel orders
    - Store operations, technology / digital, inventory, loss prevention
    - Best fit because apparel is already RFID-forward and SKU accuracy directly affects fulfillment and shrink.
  - - General merchandise / department stores
    - Complex assortments and omnichannel fulfillment pressure
    - Operations, merchandising systems, LP, omni-commerce
    - Good fit where RFID adoption and store labor pain justify overhead deployment.
  - - Grocery / club / food retail
    - Queue reduction and checkout automation may matter more than fitting-room visibility
    - Store operations, front-end, payments, technology
    - 'More mixed fit: checkout adjacency is relevant, but RADAR’s strongest proof is not yet in grocery.'
  - - Convenience / venues
    - Fast checkout and frictionless shopping
    - Operations, payments, venue tech
    - Possible adjacency market, but lower evidence density today than enterprise apparel fleets.
  - - SMB merchants
    - Basic inventory management and POS integration
    - Owner-operator
    - Weak fit because hardware and installation complexity likely require enterprise budgets and scale.
  notes: Executive-sponsor roles are inferred from quoted customer roles, vendor buying patterns, and workflow scope. Public sources support the direction of the buying committee more strongly than the exact budget owner.
