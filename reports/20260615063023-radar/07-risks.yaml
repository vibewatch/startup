callouts:
  - calloutType: risk
    title: Thesis-Break Trigger — Anchor Customer Rollback
    body: >
      If either AEO or Old Navy publicly pauses, reduces, or terminates its RADAR deployment, the
      company loses the majority of its publicly confirmed production-scale footprint. Investors should
      require explicit contractual evidence of multi-year deployment commitments from both anchor
      customers before closing. The dual role of Jay Schottenstein as both customer CEO and RADAR
      investor is a unique governance risk that must be assessed independently.
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR008

  - calloutType: risk
    title: Financial Opacity — No Audited Metrics at $1B Valuation
    body: >
      RADAR is a private-undisclosed company at a $1 billion valuation with no disclosed revenue, gross
      margin, NRR, or burn rate. All financial and operating metrics are company-sourced and unaudited.
      Investors are pricing a unicorn without an external check on unit economics, customer retention,
      or proof-quality claims. Pre-investment diligence must include audited financials, NRR by cohort,
      and independent validation of customer outcome metrics.
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR035

  - calloutType: insight
    title: Mitigating Factor — RFID Spectrum Stability Near-Term
    body: >
      The 902–928 MHz UHF RAIN RFID band has been stable under FCC Part 15 for over a decade, with
      no pending reallocation proposals as of June 2026. This reduces near-term spectrum risk for
      RADAR's US fleet. RFID industry bodies (RAIN RFID Alliance, AIM Global) actively monitor FCC
      proceedings and would provide early warning of any spectrum-management change. International
      expansion into EU frequencies (868 MHz) is a manageable hardware engineering challenge, not
      a regulatory prohibition.
    claimRefs:
      - CR015
      - CR020

