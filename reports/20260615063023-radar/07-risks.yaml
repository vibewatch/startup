company:
  name: RADAR
chapter:
  number: 7
  title: Risks
  summary: >
    RADAR's risk profile is dominated by acute customer and revenue concentration — two corporate families
    (AEO and Gap/Old Navy) account for all publicly confirmed large-scale deployments as of June 2026 — combined
    with hardware-intensive capital requirements, an absence of independently verified financial metrics,
    and regulatory uncertainty across privacy, spectrum, and IP dimensions. Secondary risks include competitive
    displacement by well-capitalized incumbents (Zebra, Checkpoint, Sensormatic), the scaling challenge of
    autonomous checkout (as demonstrated by Amazon Just Walk Out's grocery retreat), and a single founder-CEO
    key-person dependency. Most financial, retention, and proof-quality metrics remain unaudited and company-
    sourced, creating material diligence gaps at the current $1 billion valuation.

sections:
  - id: customer-revenue-concentration
    title: Customer and Revenue Concentration Risk
    body: >
      RADAR's publicly confirmed production-scale deployments as of May 2026 are concentrated almost entirely
      within two corporate families: American Eagle Outfitters (AEO) and Gap Inc.'s Old Navy brand. The May 2026
      Series B press release stated 1,400-plus stores under management, but the only named fleet-wide production
      customers are these two apparel groups. Jay Schottenstein, AEO's executive chairman and CEO, occupies the
      uniquely entangled position of simultaneously being RADAR's first production customer and a named equity
      investor — an arrangement that creates governance opacity around arm's-length contract terms, renewal
      incentives, and the credibility of AEO's public endorsement of RADAR's technology.

      The March 2025 Old Navy launch materials referenced a pipeline of thirty-plus brands; by May 2026, RADAR
      described approximately twelve active pilots beyond its two anchor customers, implying a pipeline-to-production
      conversion rate of roughly 40 percent over 14 months. Gap Inc. reported declining total net revenues for its
      fiscal year ending February 2026, reducing the budget headroom that Old Navy's parent has for continued
      infrastructure investment. RADAR has disclosed no net revenue retention rate, contract length, renewal terms,
      or churn metric in any public filing or press release. An abrupt rollback or freeze from either anchor
      customer would eliminate the majority of RADAR's publicly confirmed production footprint, presenting an
      existential concentration risk at the current valuation. Investors should treat the dual-customer anchor
      as a thesis-break trigger requiring explicit contract diligence before closing.
    claimRefs:
      - CR001
      - CR002
