  - id: financial-transparency-proof-quality
    title: Financial Transparency and Proof-Quality Risk
    body: >
      RADAR is a private company with no disclosed revenue, ARR, gross margin, burn rate, or unit economics
      in any public filing or audited document. Every operating and financial metric circulating in investor
      and press contexts — store counts, deployment speed, customer outcomes — originates from the company
      itself and has not been independently verified. A $1 billion valuation on a base of 1,400 reported
      production stores implies a per-store revenue or value-creation expectation that cannot be cross-checked
      against public information. The absence of an independent audit, S-1, or verified third-party financial
      disclosure means investors are pricing a unicorn with zero financial transparency.

      Customer outcome metrics cited in public materials — including a 10 percent or greater in-store revenue
      uplift, BOPIS cancellation rates falling from 25 percent to 3 percent, and a 60 percent shrink reduction
      in one pilot — were published in company-curated press releases and case studies without audit, independent
      methodology, or control-group data. CBInsights profiles the legal entity Automaton, Inc. as private with
      no disclosed financials, consistent with the total absence of independent verification. No major independent
      analyst firm (Gartner, Forrester, IDC) has published a publicly available risk or competitive assessment
      of RADAR's revenue, market position, or sustainability. The governance structure introduces an additional
      layer of opacity: Jay Schottenstein serves simultaneously as RADAR's largest named production customer and
      a named investor, raising questions about the independence of the commercial relationships underpinning the
      reported store-count growth.
