  - id: autonomous-checkout-competitive
    title: Autonomous-Checkout Scaling and Competitive Displacement Risk
    body: >
      RADAR's medium-term roadmap includes autonomous checkout, a product category that has proved significantly
      harder to commercialize than initial proponents anticipated. Techpinions published a detailed critique
      identifying autonomous retail as harder than expected due to sensor-fusion complexity, multi-modal
      calibration requirements, high edge-case failure rates, and hidden integration costs. Amazon's retreat
      from Just Walk Out in its Fresh grocery stores in 2024 provides the clearest market precedent: even a
      technology company with vast capital and compute resources could not achieve the accuracy and unit
      economics required for mass-market grocery autonomous checkout, validating the skeptic case.

      Competitive displacement from incumbent RFID vendors is a parallel threat. Zebra Technologies reported
      2025 revenues of approximately $4.3 billion and operates an installed base spanning thousands of retail
      accounts with deep integration partnerships. Checkpoint Systems and Sensormatic hold entrenched positions
      in retail loss-prevention RFID and could expand upward into inventory analytics. Impinj, which dominates
      the RFID semiconductor supply chain with approximately $380 million in 2025 revenues, has direct retailer
      relationships that could support a vertical extension into software and analytics — effectively squeezing
      RADAR from below as a key supplier. Computer-vision startups including Focal Systems, Trigo, and
      Standard.ai offer alternative approaches to autonomous store operations that compete indirectly.
      RADAR's headline 99 percent or greater inventory accuracy claim originates from company marketing and
      has not been independently validated by a third-party audit, academic study, or published customer case
      study with methodology disclosed.
