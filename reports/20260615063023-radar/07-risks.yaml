  evidenceGaps:
    - type: missing-source
      severity: material
      topic: hardware-capital-risk
      missingEvidence: >
        Per-store hardware and installation capital expenditure for a RADAR deployment,
        including sensor cost, installation labor, network infrastructure, and integration fees,
        broken down by store format, size, and deployment complexity.
      whyItMatters: >
        Without per-store capex data, the total capital required to scale from 1,400 to
        10,000-plus stores cannot be estimated, and the Series B runway duration is unverifiable.
      diligencePath: >
        Request deployment cost breakdown from management; obtain sample installation contracts
        from AEO and Old Navy deployments; benchmark against comparable hardware-first retail
        technology companies.
      relatedQuestionRefs:
        - QR003
      relatedTableRefs:
        - TR002

    - type: private-evidence-only
      severity: blocking
      topic: customer-concentration
      missingEvidence: >
        Multi-year contract terms, renewal rates, and revenue contribution data for AEO and Gap/Old Navy
        as primary production customers, including minimum commitment clauses and exit provisions.
      whyItMatters: >
        Without contract-level evidence, the customer concentration risk cannot be calibrated;
        a single customer exit could eliminate most of the company's production footprint.
      diligencePath: >
        Request executed commercial agreements with AEO and Gap/Old Navy; confirm minimum annual
        commitment values, contract duration, renewal triggers, and exit provisions.
      relatedQuestionRefs:
        - QR001
        - QR013

    - type: private-evidence-only
      severity: blocking
      topic: financial-transparency-risk
      missingEvidence: >
        Audited revenue, gross margin, operating loss, net revenue retention, cohort-level churn,
        and unit economics (revenue per store, cost per deployment) for fiscal year 2025 or 2026.
      whyItMatters: >
        RADAR's $1 billion valuation cannot be assessed without independent financial verification;
        all disclosed metrics are company-sourced, unaudited, and unverified.
      diligencePath: >
        Request audited financial statements from an independent accounting firm; obtain NRR
        and gross revenue retention by customer cohort; review deployment economics per store.
      relatedQuestionRefs:
        - QR018
        - QR013

    - type: missing-source
      severity: material
      topic: security-risk
      missingEvidence: >
        Independent security audit or penetration test result for RADAR's RFID sensor network,
        data pipeline, and analytics platform, such as SOC 2 Type II or equivalent certification.
      whyItMatters: >
        RFID systems handling real-time inventory data for Fortune 500 retailers represent a
        material attack surface; without a public audit result, security posture is unverifiable.
      diligencePath: >
        Request SOC 2 Type II report or equivalent; verify whether enterprise customer contracts
        require RADAR to maintain specific security certifications.
      relatedQuestionRefs:
        - QR006

    - type: missing-source
      severity: material
      topic: ip-risk
      missingEvidence: >
        Freedom-to-operate (FTO) analysis covering RADAR's overhead RFID retail method patents,
        including assessment of US20230252283A1 and related US and international filings by
        potential competitors.
      whyItMatters: >
        An unresolved IP conflict with a well-capitalized incumbent (Zebra, Impinj) could result
        in an injunction or royalty obligation that materially disrupts RADAR's operations.
      diligencePath: >
        Commission FTO analysis from qualified IP counsel; review RADAR's own patent portfolio
        and cross-licensing posture; confirm no pending litigation or demand letters.
      relatedQuestionRefs:
        - QR007

    - type: private-evidence-only
      severity: material
      topic: keyman-risk
      missingEvidence: >
        Board composition, independent director count, key-man insurance policy, CEO succession
