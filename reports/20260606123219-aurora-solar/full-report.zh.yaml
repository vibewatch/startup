      - number: '3.4'
        title: Aurora 差异化，以及为什么收购重要
        blocks:
          - type: paragraph
            body: >
              Aurora 的差异化不在每个模块都是 best-in-class。更强的论点是，Aurora 比多数同行更干净地覆盖住宅收入闭环：远程影像或 LIDAR
              驱动的场地建模、提案生成、融资挂钩销售工作流，以及现在的图纸集或许可服务。这一点重要，是因为安装商的实际运营成本往往在销售、设计、许可和运营之间的交接里，而不只在纯仿真精度里。收购逻辑支持这种解读。Folsom
              Labs 给 Aurora 带来相邻的商业仿真引擎，并在 C&I 团队中拥有品牌资产；Lyra 则加强了售后许可瓶颈。但证据尚未显示 Aurora
              已把这些部分压成一个无缝栈，并具备统一定价、附加率透明度，或跨住宅与 C&I
              的单一买方旅程。换句话说，交易拓宽了套件，也改善了竞争覆盖，但没有抹掉一个核心问题：买方想要统一的住宅工作流，还是工程密集型项目的专家栈。
            claimRefs:
              - CP005
