chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 的起点可以追溯到 2013 年 8 月。Christopher Hopper 和 Samuel Adeyemo 称，两人在 Stanford Graduate School of
              Business 读书时尝试设计一套太阳能安装方案，过程受阻后创办了公司。Aurora 官方材料和 Pear VC 的投资组合页面都指向 San Francisco 总部；Aurora
              招聘页面还补充，公司是远程优先，并提供办公室选项。公开材料一贯把 Aurora 描述为私营 Series D 公司，而不是安装商、融资方或资产所有者。


              核心产品是一套面向太阳能专业人士的云端软件平台。Aurora 自己的表述强调帮助安装商和销售团队远程设计、销售、申请许可并交付住宅和商业太阳能项目；Sacra 则把收入模式描述为基于积分的
              SaaS，并带有附加工作流模块。因此，它更像一个垂直于太阳能品类的操作系统：从屋顶建模和产能仿真切入，但一路延伸到销售提案、AI 辅助获客、许可、融资集成和售后工作流。


              公开规模指标很可观，但大多仍来自公司口径。Aurora 新闻资料包、Snapshot 新闻稿和 2023 年 COO 任命公告都提到，超过 7,000 个组织使用平台，全球设计项目超过 10 million
              个。同一批材料也支持一句话商业模式：软件卖给太阳能安装商及相邻专业人士，而不是把硬件卖给屋主。缺口仍在当前经审计收入、当前 ARR，以及 2022 年后估值的最新校准。
