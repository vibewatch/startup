      - number: '3.5'
        title: 反向信号、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              Aurora 的竞争风险来自市场两端。低端，OpenSolar 移除许可摩擦，给小型安装商足够工作流，让他们可以推迟为 Aurora 付费；Solargraf 则提供一个公开打包、由 Enphase
              分销背书、叙事同样一体化的替代方案。高端，工程导向买方可以组合 HelioScope、PVcase、Energy Toolbase 和内部
              CAD，搭出更贴合电气文档、公用事业级设计或混合储能建模的栈。Aurora 最强的护城河证据仍是远程设计精度、提案打磨和集成许可的组合，但最强的反向证据也同样一致：定价不透明、缺少自动化电气工程，以及
              HelioScope 或 Lyra 相邻业务能形成耐久锁定的证据有限。切换成本确实存在，但证据显示，它们来自模板、再培训、CRM 连接和工作流嵌入，而不是 Aurora
              拥有某个不可替代的绘图引擎。随着更多厂商宣传 AI 设计、融资集成和许可自动化，Aurora 的护城河看起来是运营型、细分市场型的，而不是绝对型。
