      - number: '7.3'
        title: 产品、平台与收购后执行风险
        blocks:
          - type: paragraph
            body: >-
              Aurora 对市场压力的回答是扩大产品面：用 Lyra 自动化许可，增加融资集成，让 HelioScope 更能支撑商业承保，把 AI
              用于屋顶遮挡检测，并从单纯太阳能报价走向全屋电气化工作流。战略上，这可能正确；运营上，门槛被抬高。只有即时图纸包能在碎片化 AHJ 要求下保持准确，Lyra
              才能真正缓释风险；只有建模输出在真实承保和发电场景中继续站得住，HelioScope 的可融资性主张才有意义。Similar Obstruction Detection 功能进一步把 Aurora 推进 AI
              赋能的设计自动化；它能省时间，也把更多信任压到模型输出质量上。同时，全屋方案把销售和产品问题从屋顶设计扩展到电器、储能、EV 和能效建模。Aurora
              公开隐私政策和条款展示了当前法律和数据处理边界，但已留存的公开来源仍没有提供正常运行时间历史、事故复盘或集成后 KPI 披露。投资者因此更多依赖路线图叙事，而不是量化执行证据。
