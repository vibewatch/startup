      - number: '6.3'
        title: 工作流嵌入显示出真实切换成本，但留存仍缺披露指标
        blocks:
          - type: paragraph
            body: >-
              Aurora 对客户有黏性，因为它同时卡在太阳能工作流里几个摩擦最高的节点。客户案例反复强调变更单更少、报价更快、现场勘查更快、手工交接更少；一旦销售、设计、金融和运营连上，这些收益就很难再拆回去。Aurora
              的 API 和 Scoop 集成把平台定位成工作流基础设施，而不只是报价软件；GoodLeap 和 Mosaic 把预审嵌进报价，UtilityAPI 把间隔数据直接带入项目，EagleView
              改善远程勘查并减少卡车上门。渠道经理还能在同一系统中集中管理经销商网络的品牌、定价和权限。这些都是很强的切换成本信号。问题是，公开耐久性指标到此为止：Aurora 不披露 NRR、GRR、logo
              流失或合同期限。即便最好的第三方满意度信号也只是间接证据——一篇竞品评测汇总了 G2 分数和支持评分；同一篇评测还认为 Aurora 最适合美国住宅团队，企业级 API 门槛和商业 / EPC 功能缺口仍然可见。
