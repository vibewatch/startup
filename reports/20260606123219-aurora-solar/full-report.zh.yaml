      - number: '7.2'
        title: 对手方、安装商渠道与传染风险
        blocks:
          - type: paragraph
            body: >-
              市场压力要伤到投资逻辑，并不需要 Aurora 自己破产；它的安装商和融资生态只要变得更难运转就够了。SunPower 和 Sunnova 案例显示变化有多快。SunPower 2024 年破产并转移品牌，叠加
              Sunnova 2025 年 Chapter 11，并不是孤立新闻：多方资料描述的是一个住宅太阳能需求、融资、安装商流动性同时承压的生态。Solar Power World 报道，Sunnova
              案中一些本地安装商成为无担保债权人；后续法院批准的出售更新也显示，客户和伙伴的连续性需要数月重组，而不是一次快速重启。Aurora 自身材料反过来说明这为什么重要：公司称美国头部安装商中 80%
              使用其平台，如今又直接接入 TPO 和贷款提供方，帮助这些安装商成交。这构成典型传导通道：即便 Aurora 资产负债表没有直接受冲击，伙伴破产、债权人纠纷或融资收缩也会压低 Aurora 的签约额、扩张和留存。
