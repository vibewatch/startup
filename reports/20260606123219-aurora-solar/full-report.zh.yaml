  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图分层，以及谁真正和 Aurora 竞争
        blocks:
          - type: paragraph
            body: >
              Aurora 面对的不是一个单一竞争者。最直接的住宅工作流对手是 OpenSolar 和
              Solargraf，因为两者都向安装商销售设计、提案、融资、许可或工作流控制，而这些安装商关心当场成交率和运营交接。HelioScope 和 PVcase 攻击的是另一个采购中心：工程师、EPC、C&I
              或公用事业团队，他们更重视可融资级仿真、AutoCAD 原生工作流，或复杂屋顶和地面安装设计，而不是面向屋主的提案。Energy Toolbase
              的竞争点在储能经济性、电价和提案财务逻辑，而不是屋顶几何。Scanifly 通常不是完整替代品，但在困难屋顶上很重要，因为勘查质量、无人机采集和减少上屋顶次数，会替代 Aurora
              远程设计叙事的一部分。现状本身也仍然真实：许多安装商仍把电子表格、通用 CAD、独立 CRM 或项目管理工具拼在一起。这意味着 Aurora 同时在对抗一体化对手、同类最优栈和内部自建。
