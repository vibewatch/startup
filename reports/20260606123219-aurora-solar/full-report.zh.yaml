      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 当前判断
            body: 继续研究。Aurora 看起来具有战略重要性，但公开估值桥太弱，无法支持在基准附近被动接受价格。
            calloutType: recommendation
            claimRefs:
