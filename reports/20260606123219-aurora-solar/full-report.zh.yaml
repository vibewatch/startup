      - number: '3.3'
        title: 定价、打包与分销力量
        blocks:
          - type: paragraph
            body: >
              定价是 Aurora 的弱点之一，因为公司当前没有在自己的官方界面披露清晰的公开席位价目表，而几家对手让比较更容易。OpenSolar
              是最激进的低端切入点，因为其核心平台免费，并靠合作伙伴关系变现。HelioScope 公布专家席位定价，并把商业定位讲得很明确，但项目上限和 AutoCAD 依赖会在 EPC
              需要完整电气交付物时推高总成本。Solargraf 走相反路线，公布年度项目和用户打包，并借助 Enphase 以及 EnFin 等 TPO 集成切入渠道分销。Energy Toolbase
              披露以财务为先的订阅层级；如果团队主要痛点是电价、提案和储能经济性，而不是设计几何，这些价格看起来合理。PVcase
              维持定制定价，符合企业工程销售，而不是自助式安装商动作。合在一起看，市场不是按一条通用价格阶梯排序，而是按工作流原型分流：免费一体化、专家月度席位、年度打包套件、财务牵引订阅，或定制企业工程。
