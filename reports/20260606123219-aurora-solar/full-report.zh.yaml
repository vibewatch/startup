      - number: '5.3'
        title: 许可、图纸集与售后工作流
        blocks:
          - type: paragraph
            body: >-
              Aurora 的许可动作，是产品故事变化最快的地方。今天的公开工作流仍是混合型。Aurora 营销应用内 Plan Sets，并宣传 24-to-48-hour 周转、95% 首次 AHJ 批准、工程盖章和
              AHJ 识别，这说明软件外包着一层成熟服务。Instant Plan Sets 文档展示了第二条更自动化的路径：已售设计可以在项目内部准备许可、配置、预览，并生成符合规范的 PDF。这两个事实合在一起，意味着
              Aurora 已经在尝试把售后运营从软件加服务，推向软件加自动化。


              Lyra 收购是这一方向最强的证据。独立报道称，Aurora 收购 Lyra，正是为了增加自动化、可用于许可的设计图纸，并加速住宅图纸集自动化。Lyra
              自己的产品强调可直接提交的许可包、组件级设计、修订和物料清单，天然贴合 Aurora 的售后瓶颈。Contract Manager 也指向同一方向：Aurora 的协议工作流最初是一个集成 HelloSign
              的产品，但在 2026 年基于 Docusign 重建，带有锁定字段和计算输入。这表明 Aurora 不只想帮助销售代表更快成交，也想在成交后减少运营交接摩擦。
