      - number: '2.2'
        title: 测算视角、美国细分趋势与真实增长发生地
        blocks:
          - type: paragraph
            body: >-
              Aurora 品类底下的太阳能市场仍然很大，但正按细分市场分化。SEIA 称，美国 2025 年新增安装 43.2 GWdc，太阳能贡献全部新增发电容量的 54%，累计容量达到 279.2
              GWdc。但分布式细分并不同步。住宅安装下降 2% 至 4,647 MWdc，商业增长 6% 至 2,345 MWdc，社区太阳能下降 25% 至 1,435 MWdc。EIA
              的小型容量序列显示，底层分布式装机基数仍在增长——2025 年住宅小型容量约 40.5 GW，商业为 16.0 GW——这比公用事业级巨型项目更影响 Aurora。全球数据仍然支持大背景：SolarPower
              Europe 报告 2024 年全球新增太阳能 597 GW、总容量 2.2 TW，Global Market Insights 仍预测全球住宅 PV 收入池到 2034 年 CAGR 为
              7.9%。但这些宽口径视角会高估与 Aurora 的关系，除非它们被翻译到分布式安装商工作流：提案准确性、融资逻辑和许可速度，才决定软件支出是否真正发生。
