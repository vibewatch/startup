      - number: '1.3'
        title: 融资历史、估值与利益相关方画像
        blocks:
          - type: paragraph
            body: >-
              Aurora 的公开融资时间线，先从技术验证和资助开始，再快速放大到风险融资。公司称，NREL 在 2015 年验证了其性能引擎，并且它在 2016 年获得 $400,000 DOE SunShot
              Incubator grant。随后，Aurora 的关于页面记录了 2019 年由 Energize Ventures 领投的 Series A、2020 年由 ICONIQ 领投的 $50 million
              Series B、2021 年 5 月 Coatue 领投的 $250 million Series C，以及 2022 年 2 月由 Coatue 和 Energize 领投的 $200 million
              Series D。


              2022 年 Series D 仍是最后一个公开上能清楚支撑的估值锚。Built In、Sacra 和 Tracxn 都把 Aurora 在该轮融资中的估值放在 $4
              billion。公开来源对主要参投方也基本一致——Coatue、Energize、Fifth Wall、ICONIQ、Lux Capital 和 Emerson
              Collective——但对累计融资额略有分歧。Sacra 总结约为 $520 million，TechCrunch 引用 PitchBook 的 $523 million，Tracxn 则记录七轮融资共
              $537 million。实务结论是，Aurora 累计融资处在 $500 million 出头到中段，但早期轮次的公开口径没有完全对齐。


              公开记录没有证实的部分同样重要。审阅来源没有披露母公司层面的风险债、项目融资义务或老股交易，投资人摘要也没有公开持股比例或董事会权利细节。因此，Aurora
              看起来是一家重度风险资本支持的私营软件公司，仍带着过时但醒目的 2022 年独角兽估值；它不是一家能从近期融资、债务条款或二级市场价格推导当前公允价值的公司。
