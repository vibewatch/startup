  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 投资逻辑
      - 反向逻辑
      - 改变观点的证据
    rows:
      - - 品类领导地位
        - Aurora 的工作流规模真实：覆盖超过 7,000 家组织，平台上设计项目超过 2,000 万个。
        - 仅有规模无法证明当前价格；变现、留存和利润率质量仍不透明。
        - 经审计的队列扩张和安装商附加率数据若显示增购耐久，会强化投资逻辑。
      - - 工作流扩张
        - Lyra 和 NEM 3.0 储能工具加深了 Aurora 在许可和以电池为中心的销售流程中的角色。
        - 进入许可和储能并不自动意味着软件式毛利率或定价权。
        - 分部层面的毛利率和附加率披露，能说明产品宽度是否真正增值。
      - - 内部估值标记支撑
        - 2024 年 7 月员工计划上调表明，2022 年 Series D 后内部价值并未坍塌。
        - 员工计划和市场报价不是公平交易的优先股融资，未必能干净映射到新钱经济性。
        - 按股份类别拆分的近期老股交易记录和最新 409A，可澄清该估值标记是否有经济意义。
      - - 公开可比公司现实
        - 相比更弱的 SaaS 类别，设计和工程软件仍可享有更高上市倍数。
        - 相关上市可比公司仍集中在约 5x-7x 收入，远低于 Aurora 公开数据隐含区间。
        - Aurora 需要大得多且经验证的 ARR 基础，或真正顶级的留存和利润率数据，才能解释如此大的溢价差。
      - - 市场时点
        - 2026 年融资和储能趋势显示，光伏软件在适应，而不是消失。
        - Aurora 错过增长目标后，在承压的安装商市场中重置员工数，削弱了稀缺性叙事。
        - 如果有明确证据显示 2026 年恢复增长且客户经济性稳定，风险 / 回报会大幅改善。
    notes: 反向逻辑主要是分母和增长质量风险，而不是声称 Aurora 缺乏产品相关性。
