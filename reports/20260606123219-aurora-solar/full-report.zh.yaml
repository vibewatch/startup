      - number: '7.4'
        title: 人员、领导层与不透明风险
        blocks:
          - type: paragraph
            body: >-
              缺少让投资者衡量 Aurora 下行空间的上市公司式 KPI 包，因此人员和执行信号比平时更重要。公开材料显示领导层有变动：Matthew Idema 2023 年加入，任总裁兼 COO；Chris Hopper
              在 2024 年 7 月 Lyra 公告中仍以 CEO 身份被引用，到 2026 年 3 月 Snapshot
              发布时，引用头衔已变为联合创始人兼执行董事长。这本身不能证明不稳定，但确实显示他在艰难市场周期中发生了重要角色变化。裁员追踪器也指向多轮减员，不过公开口径不一致：一个追踪器显示截至 2025 年 1 月有两份加州
              WARN 通知，影响 173 名员工；另一个列出加州和纽约共三份通知，影响 230 名员工。Built In 的 2026 年档案进一步强化谨慎判断，提到裁员、定价压力和近期收入轨迹不清。由于已留存公开来源不披露
              ARR、毛利率、烧钱速度、现金跑道、估值或安装商 ARR 集中度，投资者仅凭公开证据无法判断 Aurora 的成本纪律是预防动作，还是比管理层叙事更艰难的增长和融资重置症状。
