  - id: TU005
    title: 扩张和集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度风险
      - 影响
      - 尽调路径
    rows:
      - - TPO 与嵌入式融资
        - 依赖 GoodLeap、Mosaic 等贷款方和 TPO 合作伙伴
        - 嵌入式融资可以扩大钱包份额，但贷款方暂停放款或破产会冻结安装商现金流，拖慢 Aurora 使用
        - 索取合作伙伴结构、兜底迁移预案，以及对破产或暂停放款融资方的敞口
      - - 全屋电气化与储能
        - 户主成本冲击和信任摩擦仍压低成交率
        - Aurora 可以帮助销售更大的组合包，但核心住宅销售漏斗仍要靠安装商化解可负担性和信任顾虑
        - 索取储能、EV 充电、热泵和月付产品的附加率
      - - 经销商网络扩张
        - 必须严控经销商质量、变更单和权限
        - 渠道经理无需重建设计即可放大销量，但经销商执行差会伤害口碑、拖延安装
        - 索取经销商评分卡、取消率，以及按渠道拆分的质量指标
      - - 国际扩张
        - 尽管有法国验证和欧洲生态信号，产品看起来仍主要聚焦美国
        - 美国以外增长可分散客户基础，但本地化、支持和合作伙伴深度并不透明
        - 索取按国家拆分的客户和 ARR 结构，以及本地化路线图
      - - 商业或公用事业扩张
        - 具名公开验证很薄，竞品评论仍指出 EPC 功能缺口
        - 更大 ACV 可拿，但 Aurora 在高级商业工程工作流中可能遇到适配上限
        - 访谈商业 EPC、多户住宅用户和现有公用事业账户
      - - 美国住宅安装商集中
        - 2024 年住宅市场收缩、SunPower 和 Titan 破产，以及 Mosaic 2025 年 Chapter 11 都冲击了 Aurora 的核心生态
