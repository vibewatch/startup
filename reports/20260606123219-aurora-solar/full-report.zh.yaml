      - number: '2.4'
        title: 政策、许可，以及 Aurora 品类的催化剂与逆风
        blocks:
          - type: paragraph
            body: >-
              Aurora 这个品类里，政策变化的关键不在抽象政治，而在安装商工作流怎样改变。California 的 Net Billing Tariff 取代了 2023 年 4 月 15 日后新申请的传统 NEM
              逻辑，按避免成本给出口上网电量计价，并明确把客户推向太阳能加储能经济性。CPUC 自己的材料称，新费率保留既有客户补偿，但改变新销售的激励栈，包括新太阳能客户每月约 USD 100 节省、太阳能加储能客户至少
              USD 136 节省。Aurora 的设计和提案层因此更有价值：电池、分时出口逻辑和客户特定回本假设，都更难准确报价。许可环节同理。DOE 称 SolarAPP+
              自动化住宅太阳能和太阳能加储能许可，可即时批准合格许可，并对地方政府免费；SolarAPP Foundation
              称辖区可在一周内完成集成。这既是需求催化剂，也是商品化风险：许可越数字化，安装商越需要工作流自动化，但裸许可提交的差异化越弱。与此同时，逆风仍然实质存在：IRS 称面向屋主的 25D 抵免在 2025 年 12
              月 31 日后不可用；California 在住宅政策变化后于 2024 年流失约 1,000 个太阳能岗位；Mosaic 和 Sunlight 等贷方失败，也显示安装商预算收紧可以来得多快。
