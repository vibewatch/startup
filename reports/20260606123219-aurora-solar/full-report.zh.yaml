      - number: '1.2'
        title: 创始人、领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公司公告、Craft 高管列表和创始人传记访谈，都持续把 Christopher Hopper 列为 Aurora Solar 的 CEO 和联合创始人。他也是本次审阅外部材料里的主要公开声音：既出现在
              Aurora 自己的高管公告中，也出现在长篇创始人访谈和公司机器学习路线图的技术讨论里。这种对外领导力集中，支持较高的关键人依赖判断，尤其是 Hopper 一人同时承载产品起源叙事、管理控制和品类思想领导力。


              Samuel Adeyemo 的联合创始人身份仍然清楚，但当前运营头衔没有在公开来源中清晰披露。Pear VC 称其为 Co-Founder & COO，Built In 的 2022 年 Series D
              报道则称其为联合创始人兼 CRO。本章审阅的 Aurora 当前官方页面没有发布更新后的高管头衔名单，也没有调和这些标签。可以确认的是，Aurora 在 2023 年 6 月宣布一次重要高管补充：曾任职 Meta
              和 WhatsApp 的 Matthew Idema 加入，担任 President and COO，负责全球 GTM 和业务运营。


              治理透明度偏薄。Aurora
              的公开材料会突出投资人和客户，但没有列出董事会成员、董事会委员会或投资人控制权利。这留下了典型尽调问题：创始人依赖可以识别，但公开记录看不出创始人或领投投资人周围有多少正式治理制衡。董事会构成、观察员权利和控制权变更条款因此仍是数据室优先索取项。
