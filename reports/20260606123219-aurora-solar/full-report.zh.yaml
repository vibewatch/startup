  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与模块地图
        blocks:
          - type: paragraph
            body: >-
              Aurora 现在卖的是宽工作流，不是单点设计工具。在住宅侧，Design Mode 是高保真 CAD 层；Sales Mode 是提案和融资层；Contract Manager 是协议层；Plan Sets
              是许可层；Aurora AI 是提速层，把地址加水电账单变成快速起步设计。API 面横跨这些产品，暴露项目、设计、仿真、融资和协议数据，让运营团队可以把 Aurora 接入 CRM、ERP 和面向屋主的系统。


              HelioScope 仍是最清楚的产品组合分叉。它的品牌、销售动作和仿真文档仍描述一个独立的 C&I 产品族，面向需要快速布局迭代、专业报告和可融资级能源建模的商业开发商，而不是 Aurora
              住宅工作流里的隐藏标签页。这种分离很重要：Aurora
              似乎在走双轨产品策略，一边是紧密集成的住宅工作流软件，另一边是专用商业设计环境。好处是产品深度；尽调问题是，两套界面在身份、数据模型和集成逻辑上到底共享多少。
