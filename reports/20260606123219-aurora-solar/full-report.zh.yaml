            body: >-
              把 Aurora 接到公开市场估值桥上，现有可见数字很难撑住这个基准。按噪音很大的公开收入区间，大约 $113 million 到 $141 million，$4.0 billion 基准对应约 28x 到
              35x 收入。即便认可 Sacra 更高的 2023 年 $170 million 估计，隐含倍数仍约 23.5x。这远高于 2026 年 5 月的公开软件市场背景。Multiples.vc 称设计和工程软件约按
              5.4x 收入交易，具体公开可比也在同一区间：Procore 约 5.3x，Autodesk 约 6.7x，Bentley 约 6.5x，Enphase 约 5.3x。Stem
              说明，当信心破裂时，气候科技倍数可以跌到多低。可比结论不是 Aurora 不该有溢价，而是这里需要的溢价异常大。要让基准看起来普通，Aurora 需要 ARR 接近 $333 million 且按
              12x、$400 million 且按 10x，或 $500 million 且按 8x。已留存公开证据看不到这些。
