      - number: '3.2'
        title: 工作流覆盖与产品范围对比
        blocks:
          - type: paragraph
            body: >
              Aurora 的核心主张是广度。官方材料描述的平台覆盖销售、设计、融资和交付太阳能及储能；帮助中心内容也显示，提案生成、融资集成、TPO
              工作流和商业提案都是正常产品界面，而不是一次性宣传物料。因此，实际比较不该是“谁能在屋顶上画板”，而是“谁能用最少交接，把一个线索推进到可安装输出”。在这个视角下，OpenSolar 和 Solargraf
              是最接近的对手，因为它们同样承诺集成销售工作流、提案生成、融资和许可支持。HelioScope、PVcase 和 Energy Toolbase 更专门：它们可以在仿真深度、AutoCAD
              原生工程或储能财务严谨性上打败 Aurora，但通常要牺牲 CRM、提案精修或许可运营，需要其他工具补位。Scanifly 同样更适合作为提升场地采集质量的专家层。Aurora 收购 Lyra
              后的许可能力因此具有战略意义，因为它减少了销售成交后离开平台的一个最明显理由。
