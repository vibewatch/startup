      - number: '5.2'
        title: 架构、数据输入与仿真深度
        blocks:
          - type: paragraph
            body: >-
              Aurora 的架构最容易从工作流组件看见，而不是从披露的基础设施看见。核心住宅栈把远程影像、屋顶几何、基于 LIDAR 的遮阴、AI 辅助 3D 屋顶建模和产能计算组合在 Design Mode
              内，再把结果交给 Sales Mode，用于提案生成、储能对比和融资沟通。UtilityAPI 让公用事业数据成为第二个主要输入界面，团队可以把区间数据拉入 Aurora，并在节省分析中复用。API
              页面暗示，Aurora 想坐在运营商技术栈中间，而不只是设计桌面上，因为同一平台可以把项目更新、仿真输出、协议和定价对象发往相邻系统。


              Aurora 的数据护城河叙事可信，但仍有一部分未经证明。公司指向 Aurora AI 运行量、约 500,000 个场地模型、HD 影像、EagleView Powered 模型、Google 影像和
              Nearmap 集成，用来说明远程设计质量值得信任。HelioScope 在商业侧延展了深度叙事：自动布局、遮阴分析、LIDAR 支持建模、公用事业费率和财务工具，以及公开的 8760
              仿真方法，使用多个天气数据源。缺口仍在独立基准测试：Aurora 和 HelioScope 披露了令人印象深刻的要素，但没有公开错误率或重设计率证据，无法量化这些要素相对竞品到底好多少。
