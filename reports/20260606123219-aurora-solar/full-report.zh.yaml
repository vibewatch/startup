      - number: '2.3'
        title: 买方分层、融资结构与安装商渠道动态
        blocks:
          - type: paragraph
            body: >-
              Aurora
              的买方不是终端屋主，而是安装商组织；它们的经济模型越来越取决于融资结构和渠道健康度。在核心住宅工作流里，买方和付款方通常是安装商老板、销售负责人或运营负责人，用户则混合了设计师、销售代表、许可协调员和项目经理。在商业分布式太阳能里，工作流转向预施工、工程和投标管理团队，但同一套软件栈仍然嵌在安装商或
              EPC 内部。融资变化如今是预算归属的核心。CFPB 称，2023 年居家住宅太阳能融资结构为 19% 现金、58% 贷款、23% 第三方所有；Wood Mackenzie 称贷款份额在 2022 年已达到
              70%，随后因高利率和 IRA 附加激励偏向 TPO 而丢失份额。pv magazine 随后报道，2024 年贷款降至合同的 43%；Utility Dive 则把 TPO 描述为约 45%
              的安装量，并称顾问预期 2026 年继续增长。这种结构迁移抬高了工作流复杂度——租赁、PPA
              和合规负担重的融资披露，都会产生更多提案和项目管理逻辑——但也带来集中度风险，因为贷方压力会直接传导到安装商流动性和软件预算。
