      - number: '8.4'
        title: 建议、情景与最终尽调纪律
        blocks:
          - type: paragraph
            body: >-
              因此，公开数据结论是继续研究，信心中等、风险高，估值立场偏高。若私下尽调显示 ARR 基数大得多、留存顶尖且利润率结构像软件公司，Aurora
              仍可能配得上这个基准，甚至更高价格。但新投资者不能只凭公开记录就负责任地假设这一点。乐观情景下，如果 ARR 到 2028 年进入 $200M 高段或 $300M 低段，同时守住 12x 到 14x
              的退出倍数，Aurora 大致能撑住基准。基准情景低得多；悲观情景则显示，如果安装商市场压力持续、公开市场倍数保持纪律，价值重置可以来得很快。实际含义很简单：不要争 Aurora
              是不是好公司；要问当前价格有没有支撑。决定性尽调问题是经审计 ARR 桥、队列留存、毛利率和现金生成、从普通股到优先股价值的股类桥，以及近期二级交易记录。如果这些都强，Aurora
              仍可能是有吸引力的资产；如果不是，耐心才是理性选择。
            claimRefs:
