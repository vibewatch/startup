  - id: FI004
    title: 资本强度 / 现金流图
    type: matrix
    layout: wide
    summary: 定性现金流图显示，Aurora 不像制造商那样重资本开支，但政策冲击、安装商困境和流动性披露缺口仍让财务暴露存在。
    approximationNotes: 该图刻意采用定性方式，因为 Aurora 没有发布现金流量表、债务排期或流动性桥。
    data:
      columns:
        - 公开信号
        - 现金影响
        - 投资尽调读数
      rows:
        - id: policy-reset
          label: 加州 NEM / 净计费重置
          values:
            - 2023 年 4 月 15 日后申请转向净计费
            - 住宅项目经济性变差，可能压低安装商需求和软件用量
            - Aurora 收入基础仍嵌着重大政策敏感性
        - id: federal-incentives
          label: 联邦住宅 ITC 到期和 OBBB 波动
          values:
            - Aurora 的 2026 Snapshot 称 25D 到期后波动极端
            - 安装商成交率走弱，可能冲击续约、服务和回款
            - 收入质量取决于 Aurora 在承压住宅安装商之外的多元化程度
        - id: installer-finance
          label: 安装商和贷款机构承压
          values:
            - Mosaic 破产和更广泛裁员说明下游资本稀缺
            - 安装商延迟付款或倒闭可能传导到 Aurora 需求和坏账风险
            - 交易对手健康已经成为软件尽调的一部分
        - id: no-new-round
          label: 2022 年以来没有公开外部融资轮
          values:
            - 现有资本至少需要覆盖三年运营
            - 现金跑道很可能靠削减费用延长，而不是靠可见的新股本
            - 资本充足性方向上偏正面，但仍未量化
        - id: internal-price
          label: 收购 Lyra 后内部价格上调
          values:
            - 员工股价从 $31.44 升至 $46.34
            - 内部估值标记可支撑士气和期权价值，但不增加现金
            - 应视为情绪和战略信号，而非流动性
        - id: liquidity-gap
          label: 缺少现金、烧钱速度和债务披露
          values:
            - 没有公开现金余额、烧钱速度、现金跑道或债务排期
            - 无法把已融资资本换算成多少月现金跑道或契约余量
            - 在评估估值或下行保护前，必须拿到管理层材料
