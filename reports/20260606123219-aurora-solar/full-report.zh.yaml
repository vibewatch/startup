  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的 TAM 逻辑
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 所处市场，比头部太阳能装机统计暗示的范围要窄。真正可触达的支出落在分布式太阳能工作流软件——住宅安装商、储能优先卖方和分布式商业 EPC
              使用的设计、提案、项目管理和许可编排。也就是说，正确边界在太阳能发电下游、安装执行上游。全球广义 PV
              部署量和住宅太阳能收入估计仍有背景价值，因为它们显示底层活动池的大小，但不能一比一转成软件收入。更好的测算视角是活跃太阳能企业数量、分布式系统存量、小型住宅和商业容量增长，以及软件能够移除的许可和融资摩擦。公开证据在这些底层活动指标上很强——SEIA
              列出超过 10,000 家美国太阳能企业，Berkeley Lab 追踪到 2024 年底 4.5 million 套分布式系统，EIA 显示 2025 年小型太阳能仍在扩张——但公开来源没有披露面向
              Aurora 的席位数、合同价值，或按安装商规模划分的附加率。结果是，TAM / SAM 框架可以辩护，但公开 SOM 只有部分可见。
