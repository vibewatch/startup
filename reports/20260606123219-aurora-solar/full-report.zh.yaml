      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务上，Aurora 像一家已有规模但当前不透明的软件公司。它的存活概率明显高于风投支持的太阳能安装商，但承销仍被缺失的私有指标卡住。正向逻辑很直接：Aurora 融资超过 $500
              million，保住了大型安装商渗透，继续发布自动化产品，并用 Lyra 收购加强许可工作流覆盖。负向逻辑同样清楚：没有公开现金余额、没有烧钱速度披露、没有分收入流毛利率、没有 CAC / 回本周期、没有
              NRR、没有债务安排，也没有 2022 年后的新外部融资。公开收入数据库互相打架，最新 2025
              年数字还是单一来源的下行估计，不是交叉验证后的事实。这意味着现金跑道不能换算成月份，只能给出方向性判断：管理层很可能一直借裁员和成本控制守住流动性。我的财务结论因此是混合的：Aurora
              卖的是工作流软件，收入质量可能优于纯交易型太阳能企业；但利润率路径和资本充足性仍是管理层数据问题，不是公开证据结论。承销应保持有条件，直到管理层提供 2024 年和 2025
              年收入确认、现金、烧钱速度、毛利率、留存，以及任何债务或信贷额度披露。
