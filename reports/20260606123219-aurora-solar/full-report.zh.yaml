  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: Aurora 有多条量化公开引用，但耐久性可见度和独立印证并不均衡。
    data:
      columns:
        - 结果具体性
        - 生产成熟度
        - 客群广度
        - 耐久性可见度
      rows:
        - label: New Day Solar
          values:
            - label: 强
              tone: positive
              detail: 设计从 30 分钟缩短到 30 秒、成交率 +15%、每个项目节省数小时，都是具体的前后指标。
            - label: 强
              tone: positive
              detail: 以官方生产案例研究发布，不是试点。
            - label: 中等
              tone: neutral
              detail: 住宅安装商，使用 TPO 和设计服务。
            - label: 弱
              tone: risk
              detail: 除 Aurora 自有案例外，没有合同期限、续约或独立客户引述。
        - label: Mpower Solar
          values:
            - label: 强
              tone: positive
              detail: 提案速度提升 3x、变更单减少 80%、CRM 录入时间被省掉，指标具体。
            - label: 强
              tone: positive
              detail: 面向一家 Brooklyn 在运营安装商的生产部署。
            - label: 中等
              tone: neutral
              detail: 住宅业务加 CRM 集成工作流。
            - label: 弱
              tone: risk
              detail: 没有公开续约、ACV 或长期满意度数据。
        - label: Our World Energy
          values:
            - label: 强
              tone: positive
              detail: 变更单从 40% 降至 10% 以下、现场勘察减半、每个项目最多节省 72 小时。
            - label: 强
              tone: positive
              detail: 生产中的 TPO 工作流，并披露活跃融资组合。
            - label: 中等
              tone: neutral
              detail: 住宅安装商加融资工作流。
            - label: 弱
              tone: risk
              detail: 没有披露续约指标或贷款机构集中度。
        - label: projetsolaire.com
          values:
            - label: 强
              tone: positive
              detail: 安装商网络和安装增长都有量化。
            - label: 强
              tone: positive
              detail: 被呈现为法国活跃生产网络。
            - label: 强
              tone: positive
              detail: 国际和渠道网络证据把范围扩到美国安装商模板之外。
            - label: 弱
              tone: risk
              detail: 公开材料没有展示 Aurora 合同经济性或留存。
        - label: Sunrun 或 HelioScope
          values:
            - label: 强
              tone: positive
              detail: 提案交付提升 27%、节省 2,208 小时、住户账单节省都已量化。
            - label: 强
              tone: positive
              detail: 真实多户部署，而不是概念营销。
            - label: 强
              tone: positive
              detail: Aurora 的影响范围已经超出独栋住宅，这是有用证据。
            - label: 弱
              tone: risk
              detail: 商业范围仍窄，没有揭示更广企业留存。
        - label: Perihelion 或 1 Earth Solar
          values:
            - label: 中等
              tone: neutral
              detail: 交易量 3x 和劳动力成本下降 50% 的故事方向上强，但细节不够完整。
            - label: 强
              tone: positive
              detail: 两者都被呈现为在线生产用例。
            - label: 强
              tone: positive
              detail: 它们把证据延伸到全套件使用和经销商网络管理。
            - label: 弱
              tone: risk
              detail: 两个案例都没有披露合同期限或独立验证。
