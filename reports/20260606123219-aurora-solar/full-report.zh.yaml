      - number: '7.5'
        title: 缓释动作、监控项与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Aurora 确实有可见缓释动作。它通过贷款方集成和更重的 TPO 工作流适应融资复杂度，借 Lyra 降低许可摩擦，延伸到全屋和储能价值主张，把业主经济性从激励转向电费，并用 HelioScope 的可融资性与
              AI 功能守住产品相关性。这些回应合理。但缓释只有在 Aurora
              执行速度快过行业恶化速度时才有效。因此最重要的监控项同时来自外部和内部：又一家大型安装商或融资提供方倒下，加州政策进一步恶化，产品准确性或支持质量出现可见滑坡，反复裁员或管理层震荡，或管理层无法拿出可信的私有
              KPI 包，覆盖 ARR、毛利率、集中度和现金跑道。如果这些指标走错方向，下行情景就不再只是普通太阳能周期，而会变成对 Aurora 能否把自动化和产品宽度转化为持久、盈利韧性的投资逻辑破裂。
