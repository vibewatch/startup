        - 判断 2022-2024 年私募估值标记是否仍站得住的直接基准。
        - ARR 未经公开验证，供应商估计差异很大。
      - - Procore
        - 2026 年 6 月市值 / TTM 收入
        - ~5.3x
        - 上市工作流软件中，最适合对标面向承包商、且有真实利润率披露的运营软件。
        - 建筑软件比光伏更宽，也不专注电池或许可流程。
      - - Autodesk
        - 2026 年 6 月市值 / TTM 收入
        - ~6.7x
        - 有助于锚定设计软件估值上沿，因为市场仍奖励 AI 增强的工程工具。
        - 规模大得多，业务也比 Aurora 分散得多。
      - - Bentley Systems
        - 2026 年 6 月市值 / TTM 收入
        - ~6.5x
        - 设计 / 基础设施工作流软件对标公司，具备经常性收入纪律。
        - Bentley 服务基础设施工程师，不是住宅光伏安装商。
      - - Enphase Energy
        - 2026 年 6 月市值 / TTM 收入
        - ~5.3x
        - 气候科技邻近的上市参照，直接绑定光伏终端市场和安装商需求周期。
        - 硬件和电力电子敞口让它不如 Aurora 纯软件。
      - - Stem
        - 2026 年 6 月市值 / TTM 收入
        - ~0.4x
        - 显示一旦增长和资本市场信心破裂，气候科技倍数会被压到多低。
        - Stem 的经营问题远比 Aurora 公开记录显示的更严重。
      - - 上市设计与工程软件基准
        - 2026 年 5 月行业倍数
        - 约 5.4x 收入
        - 为当前市场里高端工作流软件提供品类层面的估值上限。
        - 行业平均会抹平公司之间的增长、留存和利润率差异。
    notes: 可比组合有意混合工作流软件和气候科技邻近上市公司，用来框定公开市场桥接可能落在哪个合理区间。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful public and benchmark references available from directly reviewable
        2026 market-cap, revenue, and filing sources; it is not exhaustive of all private solar-software transactions
        because most direct private comps are gated or undisclosed.
    claimRefs:
      - CV013
      - CV014
      - CV026
      - CV029
      - CV032
      - CV035
      - CV038
      - CV040
      - CV041
  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 已验证 ARR 仍然太小
        - 经审计 ARR 仍低于约 $150M，且没有顶尖增长或利润率证据
        - 基准估值仍会筛出远高于上市可比公司的倍数。
        - 不要按当前基准投资。
      - - 市场重置后留存不及预期
        - NRR 低于约 110%，或流失率明显高于顶尖软件公司水平
        - 增长质量达不到估值要求，稀缺性溢价就消失。
        - 把 Aurora 估值重定到更接近上市工作流软件的水平。
      - - 利润率显得运营负担重
        - 许可与储能扩张后，毛利率明显低于软件公司常态
        - 业务开始更像服务，而不是值得拿软件稀缺性溢价的公司。
        - 要求降价，或退出。
      - - 缺少增长证据时，老股和内部价格走软
        - 近期获批交易或新的 409A 重估低于当前方向性标记
        - 2024 年估值上调作为价值维持证据的可信度下降。
        - 暂停，在推进前刷新估值工作。
      - - 安装商市场压力持续
        - 电池 / TPO 转向未能抵消安装商基础疲软，或再次出现裁员
        - Aurora 的经营杠杆和客户质量都会恶化。
        - 从继续研究转为回避。
    notes: 这些触发项针对估值，目的是打破价格论证，而不是简单复述通用公司风险。
    claimRefs:
      - CV018
      - CV021
      - CV022
      - CV024
      - CV025
      - CV042
      - CV054
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR 与收入桥接
        - 2023 至 2026 年的月度 ARR、确认收入、预订额及桥接
        - 公开分母噪音太大，无法干净承销该基准。
        - CFO 数据室、董事会材料，以及审计师编制的收入桥接。
      - - 毛利率与现金生成
        - 按产品拆分的毛利率、托管或 AI 成本负荷，以及自由现金流或烧钱概况
        - 高端工作流倍数假设其经济性像软件，而不是运营负担重的服务。
        - 财务尽调与管理账审阅。
      - - 留存与集中度
        - 按安装商队列拆分的 NRR、总流失、扩张和收入集中度
        - 只有现有客户在安装商市场承压下仍能扩张，稀缺性溢价才站得住。
        - 队列分析与头部客户清单。
      - - 股权结构表与股份类别桥接
        - 最新 409A、优先股堆叠、稀释条款，以及按股份类别拆分的近期老股转让
        - 内部普通股标记和市场报价可能误导新资金经济性。
        - 律师审阅股权结构表、公司章程和老股交易批准。
      - - 产品驱动再加速证据
        - Lyra 附着率、电池 / TPO 工作流采用率，以及重置后的定价兑现
        - Aurora 需要证据说明，新的工作流宽度带来的是持久变现，而不只是叙事支撑。
        - 产品分析审阅与客户访谈。
    notes: 如果这些问题无法清楚回答，正确姿态是耐心等待，而不是照单接受该基准。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV050
      - CV055
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: |-
      Aurora Solar 的时间线，从创立和技术验证，走到风险资本扩张、合作伙伴扩展，
      以及 2024-2025 年住宅光伏重置期间出现的裁员。
    data:
      items:
        - date: Aug 2013
          label: 在 Stanford GSB 创立
          detail: Christopher Hopper 和 Samuel Adeyemo 亲历光伏设计摩擦后创立 Aurora。
          tone: positive
        - date: Jul 2015
          label: NREL 验证发布
          detail: OSTI/NREL 技术报告验证了 Aurora 针对三个系统的性能模拟引擎。
          tone: positive
        - date: '2016'
          label: DOE SunShot 资助
          detail: Aurora 称获得 $400k SunShot Incubator 支持。
          tone: positive
        - date: 2019-2020
          label: Series A 后接 Series B
          detail: Energize 支持的 Series A 之后，公司完成 ICONIQ 领投的 $50M Series B，并取得 California Title 24 批准里程碑。
          tone: positive
        - date: '2021'
          label: 500 万项目与 Series C
          detail: Aurora 称设计项目数突破 500 万，并完成 Coatue 领投的 $250M Series C。
          tone: positive
        - date: Feb 2022
          label: 估值 $4B 的 Series D
          detail: $200M Series D 由 Coatue 和 Energize 领投，成为最后一个公开估值标记。
          tone: positive
        - date: Jun 2023
          label: Idema 加入管理层
          detail: Matthew Idema 以 President & COO 身份加入，推动 GTM 和运营专业化。
          tone: neutral
        - date: Jan 2024
          label: 裁员 20%
          detail: TechCrunch 报道称，在增长目标未达成后，公司裁员约 100 人。
          tone: warning
        - date: 2024-2025
          label: 合作伙伴驱动工作流扩展
          detail: Aurora 接入 EagleView 影像、Sunrun 租赁 / PPA 工作流，以及 SCF 商业融资集成。
          tone: positive
        - date: Jan 2025
          label: 基于 WARN 的裁员继续
          detail: Solar Power World 根据州 WARN 通知报道，Aurora 2025 年 1 月裁员 58 人。
          tone: warning
        - date: '2026'
          label: Snapshot 转向 TPO 与电池
          detail: Aurora 年度研究报告强调融资结构转变和电池附着率上升。
          tone: neutral
    approximationNotes: null
