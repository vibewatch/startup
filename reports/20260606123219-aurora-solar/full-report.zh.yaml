  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策、市场周期与加州集中风险
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 首先暴露于住宅太阳能周期性，不是因为它在资产负债表上持有项目，而是因为核心客户是安装商，要在经济性变差的市场里成交项目。公开市场数据显示，美国住宅装机量 2024 年下降
              31%，全国最大的屋顶市场加州收缩 45%。Wood Mackenzie 和 Aurora 自己的 2026 年融资材料都显示，市场快速转向
              TPO，客户自有贷款和现金购买量承压，按月付款可负担性正在取代激励驱动式销售。加州法律立场也没有重新转向支持：2026 年 3 月上诉法院在最高法院发回后维持当前净计费制度；AB 942 和仍在进行的 CPUC
              程序说明政策扰动还没结束。对 Aurora 而言，这意味着对安装商生产率最关键的州和细分市场，在结构上更难变现；即便太阳能需求没有彻底消失，线索转化、软件席位需求和扩张预算仍可能偏弱。
