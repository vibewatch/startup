          - type: paragraph
            body: >-
              成本结构故事只能从负面信号里看见。TechCrunch 报道，Aurora 在未达增长目标后，于 2024 年 1 月裁掉约 500 人团队的 20%，此前 2023 年 11 月还有一次约 20
              人裁减。Aurora 告诉 TechCrunch，高利率和 California NEM 3.0 变化是关键压力。California WARN 年度报告又给出第二个更硬的数据点：Aurora Solar
              Inc. 在 2025 年 1 月 10 日提交永久裁员通知，覆盖 San Francisco 58 名员工；WARNTracker 和 Solar Power World 后来也呼应了同一事件。Tracxn
              的员工数标记——2024 年 12 月 353 人、5 月下旬 296 人——符合一家公司在 2022 年融资后仍在收缩成本基底的叙事。行业背景让这种重置并不意外。Solar Power World 称，2025
              年美国至少 1,691 名太阳能从业者被裁；pv magazine 称，2024 年住宅太阳能安装下降 31%；Mosaic 在宏观和税收抵免压力损害融资流后，于 2025 年 6 月进入 Chapter
              11。CPUC 在 2023 年 4 月 15 日后的净计费制度，以及随后 2025 年联邦税收抵免到期，都恶化了 Aurora 安装商客户的销售环境。含义是，2022
              年的战争基金买到了时间，但不足以避免成本重组。
