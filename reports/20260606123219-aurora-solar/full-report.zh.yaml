        title: 收入估计与估值信号
        blocks:
          - type: paragraph
            body: >-
              资本历史远比当前经营表现更容易观察。公司官方帖子和 TechCrunch 确认了 2020 年 $50M Series B、2021 年 5 月 $250M Series C，以及 2022 年 2 月
              $200M Series D。Tracxn 给出的投后估值为 Series C $2B、Series D $4B；Prime Unicorn Index 则把 2022 年融资描述为 $3.8B
              估值。GetLatka 和 Tracxn 的口径合看，累计披露融资集中在约 $523.5M-$537M。此后，Aurora 没有提供新的公开股权融资轮。因此，2024 年 7 月 Lyra
              收购值得注意，因为它产生的是内部估值信号，而不是外部估值信号：Prime Unicorn 称，收购九天后，Aurora 员工股价从 $31.44 升至
              $46.34。这说明管理层相信交易改善了经济性或防御性，但它不等于一轮有市场定价的融资。收入是最不可靠的公开数据点。GetLatka 显示 2023 年 12 月为 $113.3M、2024 年 10 月为
              $135.3M，Sacra 则估计 2023 年为 $170M。这些供应商估计分歧太大，无法精确承销。因此，谨慎的公开 2024 年区间只能推断为约 $116M-$140M，并应标为估计，而不是已披露 ARR。
