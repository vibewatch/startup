  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Aurora 仍像一家工作流 SaaS 公司，但公开证据显示，变现方式比经典按席位软件模式更混合。定价页显示月度和年度方案、年度付费节省 15%、每月 50
              个项目的单用户层级，以及不限用户的定制企业套餐。它也允许客户在提案中配置 PPW、按组件或固定费用定价；Sacra 则称 Aurora
              还销售项目积分和年度企业最低消费。这关系到收入质量：类订阅的经常性收入很可能存在，但项目挂钩定价和高级服务附加项，意味着实际收入仍会随安装商活动、项目组合和附加率波动。公开牵引力仍然可观。Aurora
              自己的数据称，客户超过 7,000 个、每周项目超过 100,000 个，并渗透约 80% 的美国前 75 大住宅安装商；不过 2024 年快照也显示，该特定研究窗口使用的是更小的 3,500 客户 / 每周
              70,000 项目数据集。结论是规模，而不是精度。Aurora 已经大到足以产生有意义的经常性软件收入，但公开来源仍没有揭示实际 ASP、服务组合或续约质量。
