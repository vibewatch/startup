      - number: '6.4'
        title: 扩张路径看得见，但集中风险仍压在美国住宅安装商和融资方上
        blocks:
          - type: paragraph
            body: >-
              Aurora 有可信的扩张路径。2026 Snapshot 显示安装商转向 TPO、储能、EV 充电，以及更广的全屋能源对话；能在一个工作流里协调设计准确性、融资、定价和业主教育的软件会受益。Aurora
              还可以沿渠道经理、projetsolaire 等欧洲案例，以及 Sunrun 这样的商业或多户型用户扩张。但公司的客户基盘仍然最暴露于美国住宅安装商及其融资栈的健康状况。Aurora 自己的 2026
              年研究强调成本冲击、信任问题和税收抵免时点扭曲。独立报道更令人担忧：pv magazine 称美国住宅太阳能 2024 年下降 31%，Mosaic
              破产造成里程碑付款延迟，可能连锁引发安装商现金流危机。Solar Power World 还报道了 2025 年广泛裁员和关停，并称 Aurora 自身在 2025
              年初裁员。这不证明客户流失，但确实指出本章主要集中风险：Aurora 可能嵌在数千条工作流中，可其中许多工作流仍系于承压的住宅市场和承压的贷款方对手盘。
