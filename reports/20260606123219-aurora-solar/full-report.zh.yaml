companyProfile:
  summary: >-
    Aurora Solar 是总部位于 San Francisco 的太阳能软件公司，由 Christopher Hopper 和 Samuel Adeyemo 于 2013
    年创立。平台已从远程太阳能设计扩展成更宽的工作流栈，覆盖提案生成、融资集成、HelioScope 商业设计、借助 Lyra 自动生成许可图纸集，以及全屋能源工作流。公开来源支持它具备有意义的品类规模——超过 7,000
    个组织、平台上设计项目超过 20 million 个——但没有披露经审计收入、利润率、留存或当前现金头寸。Aurora 最后一轮公开定价融资是 2022 年 2 月的 $200 million Series
    D，外界广泛引用的投后估值约为 $4 billion。
