  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点，以及私有市场标记到底意味着什么
        blocks:
          - type: paragraph
            body: >-
              Aurora 的头部基准仍是 2022 年 2 月的 Series D。公司正式披露了 $200 million 融资；围绕该轮的独立报道和数据供应商把投后估值放在接近 $4.0
              billion。此后，维持估值最好的公开证据来自内部和二级市场信号，而不是新的一级融资。Prime Unicorn 报道，Aurora 2024 年 7 月员工计划价格从 $31.44 升至
              $46.34，方向上说明管理层没有在 2022 年高水位之后下调业务标记。但这些信号不等同于一轮新钱优先股融资。Prime Unicorn 自身使用 $3.8 billion 基线，Notice 和 Nasdaq
              Private Market 也只给出方向性定价或带门槛的市场平台背景。正确读法因此需要分层：公开记录显示 Aurora 可能在 2022
              年后守住或小幅抬升了内部估值，但不能证明新投资者无需进一步尽调收入质量、利润率和股权结构经济性，就应接受这个头部基准。
