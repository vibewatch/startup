      - number: '1.4'
        title: 规模指标、里程碑、合作伙伴与反向信号
        blocks:
          - type: paragraph
            body: >-
              Aurora 的规模主张最强之处在平台使用量，而不是披露的财务产出。官方材料称，超过 7,000 个组织使用平台，超过 10 million 个太阳能项目在 Aurora 中完成设计；2023 年 Solar
              Snapshot 新闻稿还给出每周超过 100,000 个项目的速度。Aurora 官网客户案例呈现了工作流改进前后的变化——成交率提升、变更单减少、现场勘查更快——其他合作页面则显示 Aurora
              从基础设计软件继续外扩，进入远程影像、TPO 和租赁分销、商业 PPA 融资，以及更宽的 C&I 工作流。


              里程碑记录也相对清楚。Aurora 称其在 2021 年 4 月突破 5 million 个已设计项目，2023 年 6 月宣布 Matthew Idema 运营岗位任命，并在 2026 年发布聚焦 TPO
              融资、电池挂接和屋主成本冲击的 Snapshot。这些产品和合作动作强化了一个判断：Aurora 试图吃下更多安装商工作流，尤其是融资和售后复杂度压住增长的环节。


              反向图景集中在裁员，而不是法律程序。TechCrunch 报道称，Aurora 在 2024 年 1 月未达增长目标后裁员 20%、约 100 人，此前 2023 年 11 月还有一次更小规模裁减；报道还引用
              Aurora 说法，把压力部分归因于更高利率和 California NEM 3.0 变化。Solar Power World 后来基于 WARN 通知报道，Aurora 在 2025 年 1 月裁员 58
              人。审阅来源没有浮现诉讼、制裁或执法行动，但连续裁员、当前员工数不透明、缺少当前收入披露，已经足以让运营规模透明度成为活的尽调问题。
