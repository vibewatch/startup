      - number: '5.4'
        title: 商业设计深度与客户证明
        blocks:
          - type: paragraph
            body: >-
              HelioScope 是 Aurora 在住宅报价生成之外具备产品深度的主要证明。该平台仍把自己营销为商业太阳能软件，具备 CAD 风格界面、自动布局、遮阴分析、多结构建模、费率编辑、财务画像、可定制提案和基于
              API 的集成。相比住宅侧，仿真界面披露得异常明确：HelioScope 解释了环境条件、辐照度、组件行为和电气部件如何建模，以及这些输入如何汇入用于项目融资的 8760 产能报告。这比 Aurora 对 AI
              驱动住宅建模给出的技术披露实质强得多。


              客户引用强化了一个判断：HelioScope 不只是宣传册 SKU。Davis Hill Development 称，产品每年新增超过 20 份提案，并支持 30% 增长计划；Sunrun 称
              HelioScope Commercial Modeling Services 在 24 小时内交付准确 3D
              设计，每年节省数千小时，并提高提案吞吐量。这些是公司托管案例，不能算完全独立，但确实显示具名运营商在描述具体工作流成果。尽调含义偏正面：Aurora
              似乎拥有可信的商业设计资产。剩下的问题是战略集成——HelioScope 会继续作为平行业务，还是会随时间更深地并入 Aurora 的住宅运营栈。
            claimRefs:
