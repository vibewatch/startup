      - number: '8.2'
        title: 运营规模真实存在，但公开分母噪音大，市场背景也更难
        blocks:
          - type: paragraph
            body: >-
              Aurora 不是纯叙事资产。Sacra 和 Aurora 自身材料指向真实工作流规模：超过 7,000 家组织使用该平台，已有超过 20 million 个项目在其中完成设计。Lyra 收购和 Aurora 的
              NEM 3.0 储能工具也显示出可信的产品扩张路径，进入许可自动化和电池中心型销售流程。问题不在于 Aurora 是否重要，而在于公开记录是否足够说明变现，支撑这个基准。Sacra 估计 2023 年收入为
              $170 million；GetLatka 称 2024 年收入达到 $135.3 million，但之后又显示 2025 年锐减至 $35 million；RocketReach 列出 Aurora 收入为
              $140.6 million。这个分歧太大，无法给承保提供干净分母。与此同时，更广的安装商生态已被高利率和加州 NEM 3.0 重置。TechCrunch 记录了 Aurora 2024 年裁员以及公司自己提到的
              NEM 3.0 和宏观压力；Utility Dive 和 Berkeley Lab 则显示，出口电价下调和电池复杂度上升已经重塑安装商基础。
