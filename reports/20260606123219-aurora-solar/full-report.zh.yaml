      - number: '5.5'
        title: 差异化与产品技术风险
        blocks:
          - type: paragraph
            body: >-
              Aurora 的差异化站在工作流广度和数据输入上。公开太阳能软件厂商里，很少有公司看起来能横跨远程设计、提案生成、区间数据摄取、合同、图纸集、储能建模和独立商业设计引擎。变更日志结构也显示，产品管理仍在
              AI、API、Contract Manager、Design Mode、Plan Sets、Sales Mode 和 Storage 上持续投入，而不是把它们当作陈旧增购项。这种广度解释了为什么 Aurora
              可以把自己营销为太阳能团队的操作系统，而不只是设计工具。


              风险也同样可见。第一，当前栈仍依赖合作伙伴和外部系统——EagleView、Nearmap、Google 影像、UtilityAPI、Docusign，以及本地 AHJ
              或盖章工作流。第二，有些集成只做到部分产品化：Design Mode 储能仍排除某些既有工作流，API 面是申请访问而不是开放文档，全屋电气化更像相邻销售叙事，而不是披露很深的已发布产品。第三，Aurora
              的公开信任姿态偏薄。保留来源集在准确性和许可主张上很丰富，但在 uptime、安全、事故历史或 API
              治理上稀疏。因此，产品故事在广度上很强、在技术深度上可信，但仍需要私有尽调来证明这种广度在生产环境中到底有多可防御、多可靠。
