- id: recommendation
  title: Recommendation, scenarios, and final diligence discipline
  body: 'The public-data conclusion is therefore research-more with medium confidence, high risk, and a stretched valuation stance. Aurora may still prove worthy of the benchmark or even a higher price if private diligence shows a much larger ARR base, elite retention, and software-like margin structure. But a new investor cannot responsibly assume that from the public record alone. In a bull case, Aurora can roughly defend the benchmark by 2028 if ARR grows into the high-$200 millions or low-$300 millions while keeping a 12x to 14x exit multiple. The base case is far lower, and the bear case shows how quickly value can reset if installer-market stress persists and public multiples remain disciplined. The practical implication is simple: do not argue about whether Aurora is a good company; ask whether the current price is supported. The decisive diligence asks are an audited ARR bridge, cohort retention, gross margin and cash generation, the share-class bridge from common to preferred value,
    and recent secondary tapes. If those are strong, Aurora can still be a compelling asset. If not, patience is the rational move.'
