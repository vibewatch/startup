  - FV002
- id: public-comp-bridge
  title: Public comp math argues the benchmark is stretched
  body: 'Once Aurora is translated into a public-market bridge, the benchmark becomes difficult to defend on currently visible numbers. Using the noisy public revenue band of roughly $113 million to $141 million, a $4.0 billion benchmark implies about 28x to 35x revenue. Even if one grants Sacra’s higher $170 million 2023 estimate, the implied multiple is still about 23.5x. That is far above the May 2026 public software context. Multiples.vc says design and engineering software trades around 5.4x revenue, and specific public comps are in the same zone: Procore is about 5.3x, Autodesk about 6.7x, Bentley about 6.5x, and Enphase about 5.3x. Stem shows how low climate-tech multiples can fall when confidence breaks. The comp conclusion is not that Aurora deserves no premium; it is that the premium required here is unusually large. To make the benchmark look ordinary, Aurora would need something closer to $333 million of ARR at 12x, $400 million at 10x, or $500 million at 8x. None of that is
    visible in the retained public evidence.'
  claimRefs:
