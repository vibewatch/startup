- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - thesis
  - anti-thesis
  - what would change the view
  rows:
  - - Category leadership
    - Aurora has real workflow scale, with over 7,000 organizations and over 20 million projects designed on-platform.
    - Scale alone does not prove the current price if monetization, retention, and margin quality are opaque.
    - Audited cohort expansion and installer attach-rate data showing durable upsell would strengthen the thesis.
  - - Workflow expansion
    - Lyra and NEM 3.0 storage tooling deepen Aurora’s role in permitting and battery-centric sales flows.
    - Expansion into permitting and storage does not automatically mean software-like gross margins or pricing power.
    - Segment-level gross margin and attach-rate disclosures would show whether product breadth is value-accretive.
  - - Internal mark support
    - The July 2024 employee-plan step-up suggests internal value did not collapse after the 2022 Series D.
    - Employee-plan and marketplace quotes are not arm’s-length preferred financings and may not map cleanly to new-money economics.
    - Recent secondary tapes by share class and the latest 409A would clarify whether the mark is economically meaningful.
  - - Public comp reality
    - Design and engineering software can still trade at premium public multiples relative to weaker SaaS categories.
    - Relevant public comps still cluster around roughly 5x-7x revenue, far below Aurora’s public-data implied range.
    - Aurora would need a much larger verified ARR base or truly elite retention and margin data to justify a premium gap this large.
  - - Market timing
    - Financing and storage trends in 2026 suggest solar software is adapting rather than disappearing.
    - Aurora also reset headcount into a stressed installer market after missed growth targets, which weakens the scarcity story.
    - Clear evidence of renewed growth through 2026 plus stable customer economics would materially improve the risk/reward.
  notes: The anti-thesis is mostly denominator and quality-of-growth risk rather than a claim that Aurora lacks product relevance.
