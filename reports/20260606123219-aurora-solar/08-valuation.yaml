sections:
- id: valuation-anchor
  title: Valuation anchor and what the private marks actually mean
  body: 'Aurora’s headline benchmark is still the February 2022 Series D. The company officially disclosed the $200 million raise, and independent coverage plus data vendors around the round place the post-money value near $4.0 billion. Since then, the best public evidence of maintained value has come from internal and secondary signals rather than a new primary financing. Prime Unicorn reported that Aurora’s July 2024 employee-plan price rose to $46.34 from $31.44, which directionally suggests management did not mark the business down after the 2022 high-water mark. But those signals are not equivalent to a new-money preferred round. Prime Unicorn itself uses a $3.8 billion baseline, while Notice and Nasdaq Private Market show only directional pricing or gated marketplace context. The correct reading is therefore nuanced: the public record suggests Aurora likely maintained or modestly stepped up internal value after 2022, but it does not prove that a fresh investor should accept the headline
    benchmark without further diligence on revenue quality, margins, and cap-table economics.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV006
  - CV007
  - CV042
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
  - FV004
- id: operating-scale
  title: Operating scale is real, but the public denominator is noisy and the market backdrop is harder
  body: 'Aurora is not a narrative-only asset. Sacra and Aurora’s own materials point to real workflow scale: over 7,000 organizations use the platform and more than 20 million projects have been designed in it. The Lyra acquisition and Aurora’s NEM 3.0 storage tooling also show a credible product expansion path into permitting automation and battery-centric sales flows. The problem is not whether Aurora matters; it is whether the public record shows enough about monetization to justify the benchmark. Sacra estimated 2023 revenue at $170 million, GetLatka says 2024 revenue reached $135.3 million but later shows a sharp drop to $35 million in 2025, and RocketReach lists Aurora at $140.6 million of revenue. That is far too much divergence for a clean underwriting denominator. At the same time, the broader installer ecosystem has been reset by higher rates and California NEM 3.0. TechCrunch documented Aurora’s 2024 layoffs and the company’s own reference to NEM 3.0 and macro pressure, while
    Utility Dive and Berkeley Lab show the installer base has been reshaped by lower export economics and rising battery complexity.'
  claimRefs:
