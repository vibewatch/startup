chapter:
  number: 8
  title: Valuation
  summary: Aurora Solar still looks like a category leader, and the July 2024 employee-plan step-up suggests internal confidence held after the 2022 Series D. But public revenue evidence remains noisy and mostly low-authority, so a roughly $4.0 billion benchmark screens at about 28x to 35x public ARR or revenue—well above relevant public software and climate-adjacent comps. On public evidence alone, the correct posture is research-more with a stretched valuation stance, not price-taking.
