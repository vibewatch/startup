- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Audited ARR and revenue bridge
    - Monthly ARR, recognized revenue, bookings, and bridge from 2023 through 2026
    - The public denominator is too noisy to underwrite the benchmark cleanly.
    - CFO data room, board deck, and auditor-prepared revenue bridge.
  - - Gross margin and cash generation
    - Gross margin by product, hosting or AI cost load, and free-cash-flow or burn profile
    - Premium workflow multiples assume software-like economics rather than operationally heavy services economics.
    - Finance diligence and management accounts review.
  - - Retention and concentration
    - NRR, gross churn, expansion, and revenue concentration by installer cohort
    - A scarcity premium only works if existing customers expand despite installer-market pressure.
    - Cohort analysis and top-customer schedule.
  - - Cap table and share-class bridge
    - Latest 409A, preference stack, dilution terms, and recent secondary transfers by share class
    - Internal common-share marks and marketplace quotes can misstate new-money economics.
    - Counsel review of cap table, charter, and secondary approvals.
  - - Product-led reacceleration proof
    - Lyra attach rates, battery/TPO workflow adoption, and pricing realization after the reset
    - Aurora needs evidence that new workflow breadth is creating durable monetization rather than just narrative support.
    - Product analytics review and customer-reference calls.
  notes: If these asks cannot be answered cleanly, the correct posture is patience rather than accepting the benchmark at face value.
