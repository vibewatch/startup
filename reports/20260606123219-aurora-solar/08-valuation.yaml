    - research-more
    - The asset quality looks real, but public evidence is too thin and too noisy to underwrite the current private benchmark confidently.
  - - Confidence
    - medium
    - The directional conclusion is clear, but the exact ARR denominator remains vendor-estimated rather than company-verified.
  - - Risk rating
    - high
    - A premium private mark is being judged against public evidence that points to layoffs, market stress, and incomplete economics.
  - - Valuation stance
    - stretched
    - At roughly 28x-35x public revenue, Aurora screens far above relevant public comp bands around roughly 5x-7x.
  - - Decision implication
    - Engage only with data-room proof or a lower price
    - A new investor should demand audited ARR, retention, and cap-table evidence before treating the current benchmark as fair value.
  notes: Recommendation is explicitly price-sensitive and assumes only public evidence, not private diligence access.
