  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: current-revenue-band and TV004 comparable coverage
    missingEvidence: A company-approved ARR and recognized-revenue bridge that reconciles 2023, 2024, and 2025 vendor estimates.
    whyItMatters: The valuation conclusion changes materially depending on whether Aurora is closer to roughly $35M, $135M, or $170M of revenue.
    diligencePath: Request the latest board deck, audited revenue bridge, and monthly ARR waterfall with churn and upsell splits.
    relatedQuestionRefs:
    - QV006
    - QV007
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current gross margin, hosting and AI cost burden, and free-cash-flow or burn profile.
    whyItMatters: A premium software multiple is much easier to defend if Aurora retains software-like margin structure while expanding into permitting and battery workflows.
    diligencePath: Review audited financials, management accounts, and unit-economics schedules by product line.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: retention-quality
    missingEvidence: Post-reset NRR, gross churn, and cohort retention by installer size and geography.
    whyItMatters: A 28x-plus implied ARR multiple is only plausible if churn is low and existing customers expand meaningfully despite installer-market stress.
    diligencePath: Request quarterly cohort tables, top-customer concentration, and churn drivers for 2024-2026.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: share-class-bridge
    missingEvidence: The bridge from the July 2024 employee-plan common-share price to preferred-share value, dilution, and liquidation preferences.
    whyItMatters: Internal common-share marks can move independently of preferred economics, so they do not directly validate a new-money preferred entry price.
    diligencePath: Review the latest 409A, cap table, preference stack, and any secondary transaction memos by share class.
    relatedQuestionRefs:
    - QV030
  - type: stale
    severity: minor
    topic: secondary-liquidity
    missingEvidence: Recent cleared secondary trades with dates, lot sizes, and share classes.
    whyItMatters: Directional marketplace pages help, but pricing without transaction context is too thin to anchor a clean valuation call.
    diligencePath: Ask the company and brokers for a 12-month secondary tape and most recent approved transfer pricing.
    relatedQuestionRefs:
    - QV005

