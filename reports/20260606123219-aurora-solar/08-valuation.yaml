- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Verified ARR is still too small
    - Audited ARR remains below about $150M with no elite growth or margin proof
    - The benchmark keeps screening at a multiple far above public comps.
    - Do not invest at the current benchmark.
  - - Retention disappoints after the market reset
    - NRR below roughly 110% or churn materially above elite software norms
    - The scarcity premium disappears because quality-of-growth is weaker than the valuation requires.
    - Re-rate Aurora closer to public workflow software levels.
  - - Margins look operationally heavy
    - Gross margin is materially below software norms after permitting and storage expansion
    - The business starts to look more services-like and less worthy of a software scarcity premium.
    - Demand a lower price or step away.
  - - Secondary and internal prices soften without growth proof
    - Recent approved trades or a new 409A reset below current directional marks
    - The 2024 step-up loses credibility as evidence of maintained value.
    - Pause and refresh valuation work before proceeding.
  - - Installer market stress persists
    - Battery/TPO pivot fails to offset a weak installer base or further layoffs reappear
    - Aurora’s operating leverage and customer quality both deteriorate.
    - Move from research-more to avoid.
  notes: Triggers are valuation-specific and are meant to break the price case, not merely restate generic company risks.
