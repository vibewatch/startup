  - - Bentley Systems
    - June 2026 market cap / TTM revenue
    - ~6.5x
    - Relevant design/infrastructure workflow software comp with recurring revenue discipline.
    - Bentley serves infrastructure engineers, not residential solar installers.
  - - Enphase Energy
    - June 2026 market cap / TTM revenue
    - ~5.3x
    - Climate-adjacent public reference tied directly to solar end-markets and installer demand cycles.
    - Hardware and power-electronics exposure makes it less software-pure than Aurora.
  - - Stem
    - June 2026 market cap / TTM revenue
    - ~0.4x
    - Shows how far climate-tech multiples can compress when growth and capital-market confidence break.
    - Stem’s operating issues are much more severe than Aurora’s public record suggests.
