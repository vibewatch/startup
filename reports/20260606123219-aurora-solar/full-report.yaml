      - number: '4.3'
        title: Cost reset and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The cost structure story is visible only through negative signals. TechCrunch reported Aurora cut 20% of
              an approximately 500-person staff in January 2024 after missing growth targets, following another roughly
              20-person cut in November 2023. Aurora told TechCrunch that higher interest rates and California’s NEM 3.0
              changes were key pressures. The California WARN annual report adds a second, harder datapoint: Aurora
              Solar Inc. filed a January 10, 2025 permanent layoff covering 58 San Francisco employees, and WARNTracker
              plus Solar Power World later echoed the same event. Tracxn’s headcount markers—353 employees at December
              2024 and 296 employees as of late May—fit the narrative of a company still shrinking its cost base after
              the 2022 raise. Sector context makes that reset unsurprising. Solar Power World says at least 1,691 U.S.
              solar workers were laid off in 2025, while pv magazine says residential solar installations fell 31% in
              2024 and Mosaic entered Chapter 11 in June 2025 after macro and tax-credit pressures impaired financing
              flows. CPUC’s net-billing regime after April 15, 2023 and the subsequent 2025 federal tax-credit expiry
              both worsened the sales environment for Aurora’s installer customers. The implication is that the 2022 war
              chest bought time, but not enough to avoid cost restructuring.
