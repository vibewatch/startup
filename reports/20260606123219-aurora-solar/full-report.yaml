              requiring other tools for CRM, proposal polish, or permit operations. Scanifly likewise sits best as a
              specialist layer that improves site-capture quality. Aurora's post-Lyra permitting capability is therefore
              strategically important because it reduces one of the most obvious reasons to leave the platform after the
              sale closes.
