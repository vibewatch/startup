            body: >-
              Aurora's architecture is most visible through workflow components rather than disclosed infrastructure.
              The core residential stack combines remote imagery, rooftop geometry, LIDAR-based shading, AI-assisted 3D
              roof modeling, and production calculations inside Design Mode, then hands results into Sales Mode for
              proposal generation, storage comparisons, and financing conversations. Utility data becomes a second major
              input surface via UtilityAPI, which lets teams pull interval data into Aurora and reuse it inside savings
              analysis. The API page implies Aurora wants to sit in the middle of the operator's stack, not just at the
              design desktop, because the same platform can emit project updates, simulation outputs, agreements, and
              pricing objects into adjacent systems.


              Aurora's data moat story is plausible but still partly unproven. The company points to Aurora AI run
              volume, half a million site models, HD imagery, EagleView Powered models, Google imagery, and Nearmap
              integrations as reasons to trust remote design quality. HelioScope extends the depth story on the
              commercial side with automatic layout, shading analysis, LIDAR-backed modeling, utility-rate and financial
              tooling, and a published 8760 simulation methodology using multiple weather-data sources. What remains
              missing is independent benchmarking: Aurora and HelioScope disclose impressive ingredients, but not public
              error-rate or redesign-rate evidence that would quantify how much better those ingredients are than
              competing tools.
