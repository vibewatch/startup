  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and what the private marks actually mean
        blocks:
          - type: paragraph
            body: >-
              Aurora’s headline benchmark is still the February 2022 Series D. The company officially disclosed the $200
              million raise, and independent coverage plus data vendors around the round place the post-money value near
              $4.0 billion. Since then, the best public evidence of maintained value has come from internal and
              secondary signals rather than a new primary financing. Prime Unicorn reported that Aurora’s July 2024
              employee-plan price rose to $46.34 from $31.44, which directionally suggests management did not mark the
              business down after the 2022 high-water mark. But those signals are not equivalent to a new-money
              preferred round. Prime Unicorn itself uses a $3.8 billion baseline, while Notice and Nasdaq Private Market
              show only directional pricing or gated marketplace context. The correct reading is therefore nuanced: the
              public record suggests Aurora likely maintained or modestly stepped up internal value after 2022, but it
              does not prove that a fresh investor should accept the headline benchmark without further diligence on
              revenue quality, margins, and cap-table economics.
