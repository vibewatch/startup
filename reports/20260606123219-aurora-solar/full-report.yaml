      - number: '1.4'
        title: Scale Metrics, Milestones, Partnerships, and Adverse Signals
        blocks:
          - type: paragraph
            body: |-
              Aurora's scale claims are strongest around platform usage rather than disclosed financial output.
              Official materials say more than 7,000 organizations use the platform, more than 10 million solar
              projects have been designed in Aurora, and the 2023 Solar Snapshot press release added a rate of
              more than 100,000 projects per week. Customer case studies on Aurora's own site present before-and-
              after workflow improvements—close-rate gains, fewer change orders, and faster site surveys—while
              additional partnership pages show Aurora widening beyond basic design software into remote imagery,
              TPO and lease distribution, commercial PPA financing, and broader C&I workflows.

              The milestone record is also reasonably clear. Aurora says it passed five million projects designed
              in April 2021, announced the Matthew Idema operating hire in June 2023, and in 2026 published a
              Snapshot focused on TPO financing, battery attachment, and homeowner cost shock. Those product and
              partnership moves reinforce the view that Aurora is trying to own more of the installer workflow,
              especially where financing and post-sales complexity constrain growth.

              The adverse picture centers on workforce reductions rather than legal proceedings. TechCrunch reported
              a 20% layoff of about 100 employees in January 2024 after missed growth targets, following a smaller
              November 2023 reduction, and quoted Aurora attributing the pressure in part to higher interest rates
              and California's NEM 3.0 changes. Solar Power World later reported 58 Aurora layoffs in January 2025
              based on WARN notices. No lawsuit, sanction, or enforcement action surfaced in the reviewed sources,
              but the layoff sequence, opaque current headcount, and lack of current revenue disclosure are enough
              to make operating-scale transparency a live diligence issue.
