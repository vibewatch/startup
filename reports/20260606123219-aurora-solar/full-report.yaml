      - number: '3.4'
        title: Aurora differentiation and why the acquisitions matter
        blocks:
          - type: paragraph
            body: >
              Aurora's differentiation is not that every module is best-in-class. The stronger argument is that Aurora
              covers the residential revenue loop more cleanly than most peers: remote-imagery or LIDAR-driven site
              modeling, proposal generation, financing-linked sales workflows, and now plan-set or permitting services.
              That matters because the practical operating cost for installers is often in handoffs between sales,
              design, permitting, and operations rather than in pure simulation accuracy. The acquisition logic supports
              this reading. Folsom Labs gave Aurora an adjacent commercial simulation engine with brand equity among C&I
              teams, while Lyra strengthened the post-sale permitting bottleneck. But the evidence does not yet show
              that Aurora has collapsed those pieces into one seamless stack with shared pricing, attach-rate
              transparency, or a single buyer journey across residential and C&I. In other words, the deals broaden the
              suite and improve competitive coverage, but they do not erase the need to ask whether a buyer wants a
              unified residential workflow or a specialist stack for engineering-heavy jobs.
            claimRefs:
              - CP005
              - CP006
