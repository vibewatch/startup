            body: >-
              The public proof base is strongest when Aurora publishes customer-specific before-and-after workflow
              gains. New Day Solar reported a dramatic time improvement after switching from Solargraf: standard designs
              went from 30 minutes to 30 seconds, complex proposals fell from roughly a day to under an hour, close
              rates rose 15%, and TPO tooling plus Expert Design Services saved up to six hours per project. Mpower
