      - number: '8.2'
        title: Operating scale is real, but the public denominator is noisy and the market backdrop is harder
        blocks:
          - type: paragraph
            body: >-
              Aurora is not a narrative-only asset. Sacra and Aurora’s own materials point to real workflow scale: over
              7,000 organizations use the platform and more than 20 million projects have been designed in it. The Lyra
              acquisition and Aurora’s NEM 3.0 storage tooling also show a credible product expansion path into
              permitting automation and battery-centric sales flows. The problem is not whether Aurora matters; it is
              whether the public record shows enough about monetization to justify the benchmark. Sacra estimated 2023
              revenue at $170 million, GetLatka says 2024 revenue reached $135.3 million but later shows a sharp drop to
              $35 million in 2025, and RocketReach lists Aurora at $140.6 million of revenue. That is far too much
              divergence for a clean underwriting denominator. At the same time, the broader installer ecosystem has
              been reset by higher rates and California NEM 3.0. TechCrunch documented Aurora’s 2024 layoffs and the
              company’s own reference to NEM 3.0 and macro pressure, while Utility Dive and Berkeley Lab show the
              installer base has been reshaped by lower export economics and rising battery complexity.
