  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape segmentation and who actually competes with Aurora
        blocks:
          - type: paragraph
            body: >
              Aurora does not face one monolithic competitor. The most direct residential workflow rivals are OpenSolar
              and Solargraf, because both market design, proposals, financing, and permitting or workflow control to
              installers who care about same-visit close rates and operational handoff. HelioScope and PVcase attack a
              different buying center: engineers, EPCs, and C&I or utility teams that value bankable simulation,
              AutoCAD-native workflows, or complex rooftop and ground-mount design more than homeowner-facing proposals.
              Energy Toolbase competes where the buyer problem is storage economics, tariffs, and proposal finance logic
              rather than rooftop geometry. Scanifly is usually not a full replacement, but it matters on difficult
              roofs because survey quality, drone capture, and reduced roof climbs can displace pieces of Aurora's
              remote-design story. The status quo also remains real: many installers still stitch together spreadsheets,
              generic CAD, and separate CRM or project-management tools. That means Aurora is competing simultaneously
              against all-in-one rivals, best-of-breed stacks, and internal build.
            claimRefs:
              - CP001
