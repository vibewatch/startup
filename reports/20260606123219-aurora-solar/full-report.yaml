      - number: '5.5'
        title: Differentiation and product-tech risks
        blocks:
          - type: paragraph
            body: >-
              Aurora's differentiation rests on workflow breadth plus data inputs. Few public solar software vendors
              appear to span remote design, proposal generation, interval-data ingestion, contracts, plan sets, storage
              modeling, and a separate commercial design engine. The changelog structure also suggests product
              management is actively investing across AI, API, Contract Manager, Design Mode, Plan Sets, Sales Mode, and
              Storage rather than treating them as stale upsells. That breadth helps explain why Aurora can market
              itself as an operating system for solar teams, not just a design tool.


              The risks are equally visible. First, the current stack still depends on partners and external
              systems—EagleView, Nearmap, Google imagery, UtilityAPI, Docusign, and local AHJ or stamp workflows.
              Second, some integrations are only partially productized: Design Mode storage still excludes certain
              existing workflows, the API surface is request-access rather than openly documented, and whole-home
              electrification appears more like an adjacent sales narrative than a deeply documented shipped product.
              Third, Aurora's public trust posture is thin. The retained source set is rich on accuracy and permitting
              claims, but sparse on uptime, security, incident history, or API governance. The product story is
              therefore strong on breadth and plausible on technical depth, but still needs private diligence to prove
              just how defensible and reliable that breadth is in production.
