  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Aurora still looks like a workflow SaaS business, but public evidence suggests monetization is more hybrid
              than a classic per-seat software model. The pricing page shows monthly and annual plan choices, 15%
              savings on annual billing, a 50-project-per-month single-user tier, and custom enterprise packages with
              unlimited users. It also lets customers configure PPW, per-component, or flat-fee pricing inside
              proposals, while Sacra says Aurora additionally sells project credits and annual enterprise minimums. That
              matters for revenue quality: subscription-like recurring revenue likely exists, but project-linked pricing
              and premium service add-ons mean realized revenue can still flex with installer activity, project mix, and
              attach rates. Public traction remains material. Aurora’s own data claims more than 7,000 customers, over
              100,000 projects per week, and roughly 80% penetration of the top 75 U.S. residential installers, although
              the 2024 snapshot also shows a smaller 3,500-customer / 70,000-project weekly dataset for that specific
              study window. The takeaway is scale, not precision. Aurora is large enough for meaningful recurring
              software revenue, but public sources still do not reveal realized ASP, services mix, or renewal quality.
