  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Aurora has several quantified public references, but durability visibility and independent corroboration are
      uneven.
    data:
      columns:
        - Outcome specificity
        - Production maturity
        - Segment breadth
        - Durability visibility
      rows:
        - label: New Day Solar
          values:
            - label: Strong
              tone: positive
              detail: >-
                30 minutes to 30 seconds design, +15% close rate, and hours saved per project are concrete before and
                after metrics.
            - label: Strong
              tone: positive
              detail: Published as an official production case study, not a pilot.
            - label: Moderate
              tone: neutral
              detail: Residential installer with TPO and design-service usage.
            - label: Weak
              tone: risk
              detail: No contract length, renewal, or independent customer quote outside Aurora's own story.
        - label: Mpower Solar
          values:
            - label: Strong
              tone: positive
              detail: 3x faster proposals, 80% fewer change orders, and CRM-entry time removed are specific.
            - label: Strong
              tone: positive
              detail: Production rollout for a live Brooklyn installer.
            - label: Moderate
              tone: neutral
              detail: Residential plus CRM integration workflow.
            - label: Weak
              tone: risk
              detail: No public renewal, ACV, or long-term satisfaction data.
        - label: Our World Energy
          values:
            - label: Strong
              tone: positive
              detail: Change orders 40% to under 10%, site surveys halved, and up to 72 hours saved per project.
            - label: Strong
              tone: positive
              detail: Production TPO workflow with active financing mix disclosed.
            - label: Moderate
              tone: neutral
              detail: Residential installer plus financing workflow.
            - label: Weak
              tone: risk
              detail: No disclosed renewal metrics or lender concentration.
        - label: projetsolaire.com
          values:
            - label: Strong
              tone: positive
              detail: Installer network and installation growth are quantified.
            - label: Strong
              tone: positive
              detail: Presented as an active production network in France.
            - label: Strong
              tone: positive
              detail: International and channel-network proof expands beyond the U.S. installer template.
            - label: Weak
              tone: risk
              detail: Public material does not show Aurora contract economics or retention.
        - label: Sunrun or HelioScope
