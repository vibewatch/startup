  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Evidence-Constrained TAM Logic
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar participates in a narrower market than headline solar-capacity statistics imply. The directly
              relevant spend sits in distributed-solar workflow software — design, proposal, project-management, and
              permit orchestration used by residential installers, storage-first sellers, and distributed commercial
              EPCs. That means the right boundary is downstream of solar generation and upstream of installation
              execution. Broad global PV deployment and residential-solar revenue estimates are still useful context
              because they show the size of the underlying activity pool, but they do not translate one-for-one into
              software revenue. The better sizing lenses are the count of active solar businesses, the installed base of
              distributed systems, the growth of small-scale residential and commercial capacity, and the amount of
              permitting and financing friction that software can remove. Public evidence is strong on those underlying
              activity measures — SEIA lists more than 10,000 U.S. solar businesses, Berkeley Lab tracks 4.5 million
              distributed systems through end-2024, and EIA shows small-scale solar still expanding in 2025 — but public
              sources do not disclose Aurora-relevant seat counts, contract value, or attach rates by installer size.
              The result is a defendable TAM/SAM frame but only a partial public SOM.
            claimRefs:
