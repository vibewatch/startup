      - number: '2.2'
        title: Sizing Lenses, U.S. Segment Trends, and Where Growth Is Really Happening
        blocks:
          - type: paragraph
            body: >-
              The solar market underneath Aurora's category is still large, but it is bifurcating by segment. SEIA says
              the U.S. installed 43.2 GWdc in 2025 and that solar supplied 54% of all new generating capacity, while
              cumulative capacity reached 279.2 GWdc. Yet distributed segments are not moving in lockstep. Residential
              installations fell 2% to 4,647 MWdc, commercial rose 6% to 2,345 MWdc, and community solar fell 25% to
              1,435 MWdc. EIA's small-scale capacity series shows the underlying distributed installed base still
              growing — residential small-scale capacity reached roughly 40.5 GW and commercial 16.0 GW in 2025 — which
              matters more for Aurora than utility-scale megaprojects do. Global data remain supportive: SolarPower
              Europe reported 597 GW of solar installed worldwide in 2024 and 2.2 TW total capacity, while Global Market
              Insights still forecasts a 7.9% CAGR for the global residential PV revenue pool through 2034. But those
              broad lenses overstate Aurora relevance unless they are translated into the distributed-installer
              workflows where proposal accuracy, financing logic, and permitting speed determine whether software spend
              actually happens.
