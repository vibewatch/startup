  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and module map
        blocks:
          - type: paragraph
            body: >-
              Aurora now sells a broad workflow, not a single design point tool. In residential, Design Mode is the
              high-fidelity CAD layer; Sales Mode is the proposal and financing layer; Contract Manager is the agreement
              layer; Plan Sets is the permitting layer; and Aurora AI is the speed layer that turns an address plus a
              utility bill into a fast starting design. The API surface sits across those products, exposing project,
              design, simulation, financing, and agreement data so operators can wire Aurora into CRM, ERP, and
              homeowner-facing systems.


              HelioScope remains the clearest portfolio fork. Its branding, sales motion, and simulation docs still
              describe a distinct C&I product family aimed at commercial developers who need rapid layout iteration,
              professional reporting, and bankable energy modeling, rather than a hidden tab inside Aurora's residential
              workflow. That separation matters: Aurora appears to be pursuing a two-track product strategy, with
              tightly integrated residential workflow software on one side and a dedicated commercial design environment
              on the other. The upside is product depth; the diligence question is how much identity, data model, and
              integration logic is actually shared across the two surfaces.
