  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy, market cyclicality, and California concentration risk
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar is exposed first to residential-solar cyclicality, not because it owns projects on balance
              sheet, but because its core customers are the installers trying to close projects in a market whose
              economics have worsened. Public market data show U.S. residential installations fell 31% in 2024, while
              California—the country’s largest rooftop market—retracted 45%. Wood Mackenzie and Aurora’s own 2026
              financing materials show the market shifting sharply toward TPO, with customer-owned loan and cash volumes
              under pressure and monthly-payment affordability displacing incentive-driven selling. California’s legal
              posture has not turned supportive again: the March 2026 appellate ruling upheld the current net-billing
              regime after Supreme Court remand, while AB 942 and the still-active CPUC proceeding show policy churn
              remains live. For Aurora, that means the state and segment most important to installer productivity remain
              structurally harder to monetize, raising the risk that pipeline conversion, software-seat demand, and
              expansion budgets stay weak even if solar demand does not disappear outright.
            claimRefs:
