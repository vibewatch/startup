      - number: '1.3'
        title: Funding History, Valuation, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: |-
              Aurora's public financing chronology starts with technical validation and grant support before the
              venture rounds scale sharply. The company says NREL validated its performance engine in 2015 and
              that it received a $400,000 DOE SunShot Incubator grant in 2016. Aurora's about page then records
              a 2019 Series A led by Energize Ventures, a $50 million Series B led by ICONIQ in 2020, a
              $250 million Coatue-led Series C in May 2021, and a $200 million Series D in February 2022 led by
              Coatue and Energize.

              The 2022 Series D is still the last clearly supportable public valuation marker. Built In,
              Sacra, and Tracxn each place Aurora at a $4 billion valuation in that round. Public sources also
              line up on the major participating investors—Coatue, Energize, Fifth Wall, ICONIQ, Lux Capital,
              and Emerson Collective—but they diverge slightly on cumulative capital raised. Sacra summarizes the
              total at about $520 million, TechCrunch cites $523 million from PitchBook, and Tracxn records
              $537 million across seven rounds. The practical conclusion is that Aurora has raised a low-to-mid
              $500 million total, but early-round accounting is not perfectly reconciled in the public record.

              What the public record does not substantiate is also important. The reviewed sources did not disclose
              parent-level venture debt, project-finance obligations, or secondary share sales, and none of the
              investor summaries provide public stake sizes or board-rights detail. Aurora therefore looks like a
              heavily venture-backed private software company with a stale but still notable 2022 unicorn
              valuation, rather than a company whose current fair value can be triangulated from recent
              financing, debt terms, or secondary-market prints.
