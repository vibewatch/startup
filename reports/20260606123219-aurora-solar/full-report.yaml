      - number: '7.4'
        title: People, leadership, and opacity risk
        blocks:
          - type: paragraph
            body: >-
              The public-company-style KPI pack that would let an investor size Aurora’s downside is absent, so people
              and execution signals carry more weight than they otherwise would. Public materials show leadership
              motion: Matthew Idema was added as President and COO in 2023, Chris Hopper was still quoted as CEO in the
              July 2024 Lyra announcement, and by the March 2026 Snapshot release he was quoted as Co-Founder and
              Executive Chairman. That does not prove instability by itself, but it does show meaningful role change
              during a difficult market period. Layoff trackers also point to repeated workforce reductions, though the
              public counts are inconsistent: one tracker shows two California WARN notices affecting 173 workers
              through January 2025, while another lists three notices affecting 230 workers across California and New
              York. Built In’s 2026 profile compounds the caution by describing workforce reductions, pricing pressure,
              and unclear near-term revenue trajectory. Because retained public sources do not disclose ARR, gross
              margin, burn, runway, valuation, or installer ARR concentration, investors cannot tell from public
              evidence alone whether Aurora’s cost discipline is precautionary or the symptom of a tougher growth and
              financing reset than management narrative implies.
