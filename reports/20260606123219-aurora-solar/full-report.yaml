              more than 7,000 organizations use the platform, the partner program says the software is trusted by more
              than 80% of top U.S. installers, and the richest named success stories all come from installer operators
              improving proposal speed, design accuracy, and handoff quality. Around that core sit adjacent segments
              that deepen platform stickiness: channel managers running dealer networks, financing partners embedded
              into Sales Mode, data and imagery partners that improve site accuracy, commercial and multifamily teams
              using HelioScope and utility-scale playbooks, and international installer networks such as projetsolaire
              in France. What is still missing is a public paid-customer breakdown by geography, company size, or ACV.
              Utilities and large developers appear in Aurora's messaging, but named active customer proof there is thin
