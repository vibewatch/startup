      - number: '7.2'
        title: Counterparty, installer-channel, and contagion risk
        blocks:
          - type: paragraph
            body: >-
              Aurora does not need to go bankrupt itself for market distress to damage the thesis; its installer and
              financing ecosystem only needs to become harder to operate. The SunPower and Sunnova cases show how fast
              that can happen. SunPower’s 2024 bankruptcy and brand transfer, plus Sunnova’s 2025 Chapter 11, are not
              isolated headlines: multiple sources describe an ecosystem in which residential-solar demand, financing,
              and installer liquidity are all under stress at once. Solar Power World reported that some local
              installers appeared as unsecured creditors in the Sunnova case, while later court-approved sale updates
              showed that continuity for customers and partners required months of restructuring rather than a quick
              reset. Aurora’s own materials reinforce why this matters: the company says 80% of the top U.S. installers
              use its platform and now integrates directly with TPO and loan providers to help those installers close
              deals. That creates a classic transmission channel where partner insolvency, creditor disputes, or
              financing pullbacks can reduce Aurora bookings, expansion, and retention even without a direct Aurora
              balance-sheet shock.
