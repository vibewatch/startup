companyProfile:
  summary: >-
    Aurora Solar is a San Francisco-based solar software company founded in 2013 by Christopher Hopper and Samuel
    Adeyemo. The platform has expanded from remote solar design into a broader workflow stack spanning proposal
    generation, financing integrations, HelioScope commercial design, automated permit plan sets through Lyra, and
    whole-home energy workflows. Public sources support meaningful category scale—more than 7,000 organizations and more
    than 20 million projects designed on-platform—but do not disclose audited revenue, margins, retention, or current
    cash position. Aurora’s last public priced round was a $200 million Series D in February 2022, with a broadly cited
    ~$4 billion post-money valuation.
