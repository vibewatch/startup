- id: named-proof-and-adoption
  title: Named customer proof shows meaningful ROI across residential, channel, international, and multifamily use cases
  body: 'The public proof base is strongest when Aurora publishes customer-specific before-and-after workflow gains. New Day Solar reported a dramatic time improvement after switching from Solargraf: standard designs went from 30 minutes to 30 seconds, complex proposals fell from roughly a day to under an hour, close rates rose 15%, and TPO tooling plus Expert Design Services saved up to six hours per project. Mpower Solar reported proposals three times faster, site surveys cut in half, 80% fewer change orders, and 20 minutes of manual CRM entry removed per project through HubSpot integration. Our World Energy, which now says 85% of its projects are TPO-based, reported change orders dropping from 40% to under 10% and up to 72 hours saved per project. Internationally, projetsolaire expanded from 67 to more than 520 installers and from 200 annual installations in 2021 to more than 4,000 installations in the first half of 2024. Commercial proof exists but is thinner: Sunrun''s HelioScope case
    study is quantified and useful, while Aurora''s utility and EPC motion is still described more through playbooks than through a dense roster of named current customers.'
