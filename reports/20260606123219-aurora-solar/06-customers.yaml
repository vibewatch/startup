- id: retention-and-switching-costs
  title: Workflow embedding suggests real switching costs, but retention still lacks disclosed metrics
  body: 'Aurora appears sticky for customers because it sits at several high-friction points in the solar workflow at once. Customer stories repeatedly emphasize fewer change orders, faster proposals, faster site surveys, and fewer manual handoffs; those gains are harder to unwind once sales, design, finance, and operations are connected. Aurora''s APIs and the Scoop integration pitch the platform as workflow infrastructure rather than just proposal software, while GoodLeap and Mosaic embed pre-qualification inside proposals, UtilityAPI brings interval data directly into projects, and EagleView improves remote surveys and reduces truck rolls. Channel managers can further centralize branding, pricing, and permissions across dealer networks inside the same system. These are all strong switching-cost signals. The problem is that public durability metrics stop there: Aurora does not disclose NRR, GRR, logo churn, or contract length. Even the best third-party satisfaction signal is indirect —
    a competitor review summarizing G2 scores and support ratings — and that same review argues Aurora is strongest for U.S. residential teams, with enterprise-tier API gating and commercial-EPC feature gaps still visible.'
  claimRefs:
