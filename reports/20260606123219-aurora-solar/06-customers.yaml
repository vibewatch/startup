  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Segmented NRR, GRR, logo churn, contract length, and renewal timing for self-serve versus enterprise customers.
    whyItMatters: Without retention data, durability must be inferred from workflow embedding and case-study anecdotes rather than verified revenue resilience.
    diligencePath: Request cohort retention tables and renewal waterfalls by plan, segment, and geography from Aurora management.
    relatedQuestionRefs:
    - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, top-financing-partner exposure, and state-level exposure to bankrupt or distressed installers.
    whyItMatters: Aurora's base appears concentrated in U.S. residential installers and lenders, but public evidence does not show whether any single partner or account is material.
    diligencePath: Request ARR by top 10 customers, lender-partner mix, and churn or write-off exposure tied to bankrupt installers or paused financing partners.
    relatedQuestionRefs:
    - QU025
  - type: private-evidence-only
    severity: minor
    topic: international-mix
    missingEvidence: Country-by-country customer count, ARR mix, and product readiness outside the United States.
    whyItMatters: France and European speakers show expansion potential, but the scale of non-U.S. revenue and product localization depth remain opaque.
    diligencePath: Request geography split for customers, revenue, support coverage, and product feature parity across major non-U.S. markets.
    relatedQuestionRefs:
    - QU026
  - type: missing-source
    severity: material
    topic: utility-commercial-roster
    missingEvidence: Named active utility, developer, and commercial EPC customers with deployment scope, ACV, and renewal status.
    whyItMatters: Commercial and utility motion could diversify Aurora away from residential cyclicality, but public proof is still mostly playbooks and one multifamily case study.
    diligencePath: Request reference calls and customer roster for commercial EPC, multifamily, developer, and utility accounts using Aurora or HelioScope today.
    relatedQuestionRefs:
    - QU027
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A fuller named-customer roster across residential installers, commercial EPCs, channel managers, and international accounts.
    whyItMatters: Aurora publishes only selective success stories, so the named-customer proof table is representative rather than exhaustive.
    diligencePath: Ask Aurora for a current reference list segmented by use case, geography, and contract maturity, then expand the enumeration on refresh.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU006
    - QU027
    relatedTableRefs:
    - TU003
