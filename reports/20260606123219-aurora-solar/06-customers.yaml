- id: expansion-and-concentration-risk
  title: Expansion avenues are visible, but concentration risk still runs through U.S. residential installers and financiers
  body: 'Aurora has credible expansion paths. The 2026 Snapshot shows installers shifting toward TPO, storage, EV charging, and broader whole-home energy conversations, all of which favor software that can coordinate design accuracy, financing, pricing, and homeowner education in one workflow. Aurora also has visible expansion paths through channel managers, European references such as projetsolaire, and commercial or multifamily users such as Sunrun. Yet the company''s installed base still appears most exposed to the health of U.S. residential installers and their financing stack. Aurora''s own 2026 research highlights cost shock, trust issues, and tax-credit timing distortions. Independent reporting is more concerning: pv magazine said U.S. residential solar declined 31% in 2024, while Mosaic''s bankruptcy created milestone-payment delays that can cascade into installer cash-flow crises. Solar Power World further reported broad 2025 layoffs and closures and said Aurora itself cut staff
    in early 2025. That does not prove customer churn, but it does show the chapter''s main concentration risk: Aurora may be embedded in thousands of workflows, yet many of those workflows remain tied to a stressed residential market and stressed lender counterparties.'
