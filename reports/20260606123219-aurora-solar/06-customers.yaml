- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - TPO and embedded financing
    - Dependence on lender and TPO partners such as GoodLeap and Mosaic
    - Embedded financing can expand wallet share, but lender pauses or bankruptcies can freeze installer cash flow and slow Aurora usage
    - Request partner mix, fallback migration playbooks, and exposure to bankrupt or paused financiers
  - - Whole-home electrification and storage
    - Homeowner cost shock and trust friction still suppress close rates
    - Aurora can help sell larger bundles, but the core residential funnel still depends on installers overcoming affordability and trust concerns
    - Request attach rates by storage, EV charging, heat pumps, and monthly-payment product
  - - Dealer-network expansion
    - Dealer quality, change orders, and permissions must be governed tightly
    - Channel managers can scale volume without recreating designs, but poor dealer execution can damage reputation and delay installs
    - Request dealer scorecards, cancellation rates, and quality metrics by channel
  - - International expansion
    - Product still appears primarily U.S.-focused despite France proof and European ecosystem signals
    - Non-U.S. growth could diversify the base, but localization, support, and partner depth are not transparent
    - Request customer and ARR mix by country plus localization roadmap
  - - Commercial or utility expansion
    - Named public proof is thin and competitive reviews still flag EPC feature gaps
    - Larger ACVs are available, but Aurora may face fit limits in advanced commercial engineering workflows
    - Reference-call commercial EPCs, multifamily users, and any current utility accounts
  - - U.S. residential installer concentration
    - 2024 residential market contraction, SunPower and Titan bankruptcies, and Mosaic's 2025 Chapter 11 all hit Aurora's core ecosystem
    - Could slow seat growth, raise churn, or reduce expansion demand even if Aurora remains embedded in existing workflows
    - Request logo churn by state, bankrupt-account exposure, and pipeline by residential vs commercial segment
  notes: Expansion vectors are visible, but the public record still suggests Aurora is structurally concentrated in a volatile U.S. residential installer and financing ecosystem.
