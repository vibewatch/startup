  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use case
  - Scale / proof
  - Revenue / strategic value
  - Key gap
  rows:
  - - Residential installers
    - Installer owner / sales rep / design and ops team
    - AI design, proposals, CRM handoff, financing presentation
    - Strongest public proof; 7,000+ organizations overall and named ROI stories from New Day, Mpower, Our World Energy, and Perihelion
    - Core installed base and source of most visible workflow ROI
    - No public split by installer size, seat count, state, or ARR
  - - Commercial installers / EPCs / multifamily teams
    - Engineering lead / sales engineer / EPC manager
    - HelioScope modeling, commercial modeling services, utility-scale playbooks
    - Named proof exists via Sunrun multifamily plus official commercial and utility playbooks
    - Higher-ACV expansion path beyond rooftop residential
    - Named current EPC roster, ACV, and renewal status are not public
  - - Utilities, developers, and investors
    - Developer / project-development user / capital provider
    - Utility-scale site assessment, design, forecasting, and project screening
    - Public evidence is mostly official playbook messaging rather than named live utility customers
    - Could diversify customer mix away from residential cyclicality
    - Named utility logos and active deployment counts are not public
  - - Financing partners
    - Lender or TPO provider / installer sales rep / homeowner payer
    - Soft-credit pre-qual, loan, lease, and PPA options inside Sales Mode
    - GoodLeap, Mosaic, and TPO workflows are explicitly embedded; 55% of installers now rank TPO as top product
    - Deepens Aurora's role in proposal-to-close workflows and monthly-payment selling
    - Partner volume mix and exposure to bankrupt or paused financiers are not public
  - - Channel managers / dealer networks
    - Corporate channel manager / external dealer / homeowner payer
    - Custom branding, pricing, permissions, and accurate point-of-sale proposals
    - Dedicated Aurora product page plus 1 Earth Solar dealer-network case study
    - Lets Aurora scale through partners without recreating designs in separate systems
    - Dealer count, channel churn, and QA metrics are not disclosed
  - - International customers
    - Installer network operator / local installer / homeowner payer
    - Localized sales and design workflows outside the U.S.
    - France case study shows 67 to 520+ installers and 4,000+ H1 2024 installations; Europe also appears in Empower 2026 programming
    - Shows non-U.S. applicability and channel expansion potential
    - Country count, international revenue share, and product-localization depth remain undisclosed
  notes: Public proof is strongest in installer, partner, and channel-manager segments; utility and international mix remain only partially disclosed.
