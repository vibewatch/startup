company:
  name: Aurora Solar
chapter:
  number: 6
  title: Customers
  summary: 'Aurora Solar''s customer base is demonstrably real and broad: more than 7,000 organizations used the platform to design 20M+ projects by April 2026, with the clearest public proof across U.S. residential installers, channel and dealer operators, financing partners, and a growing France case study. Named users report material workflow ROI — New Day cut design time from 30 minutes to 30 seconds, Mpower cut change orders 80%, Our World Energy cut change orders from 40% to under 10%, and Sunrun or HelioScope raised multifamily proposal delivery 27% year over year — while embedded financing, utility-data, imagery, CRM, and API integrations likely create real switching costs. But durability is still partly unverified because Aurora discloses no NRR, GRR, churn, or concentration metrics, commercial and utility proof is thin, and the core installer base is exposed to financing and market stress after a 31% U.S. residential contraction in 2024 and Mosaic''s 2025 bankruptcy.'
sections:
- id: customer-base-and-segmentation
  title: Customer base segmentation is broad, but strongest proof is still in installer-centric workflows
  body: 'Aurora Solar sells into solar professionals rather than homeowners directly, and its public evidence base shows six practical customer lenses. The clearest segment is the U.S. residential installer: Aurora says more than 7,000 organizations use the platform, the partner program says the software is trusted by more than 80% of top U.S. installers, and the richest named success stories all come from installer operators improving proposal speed, design accuracy, and handoff quality. Around that core sit adjacent segments that deepen platform stickiness: channel managers running dealer networks, financing partners embedded into Sales Mode, data and imagery partners that improve site accuracy, commercial and multifamily teams using HelioScope and utility-scale playbooks, and international installer networks such as projetsolaire in France. What is still missing is a public paid-customer breakdown by geography, company size, or ACV. Utilities and large developers appear in Aurora''s messaging,
    but named active customer proof there is thin relative to the residential installer base.'
