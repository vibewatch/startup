company:
  name: Aurora Solar
chapter:
  number: 1
  title: Company Overview
  summary: 'Aurora Solar is a San Francisco-based private Series D software company founded in 2013 by

    Christopher Hopper and Samuel Adeyemo to help solar installers design, sell, and deliver projects

    remotely. Public sources support meaningful category scale—more than 7,000 organizations and more

    than 10 million projects designed—but do not support a current headcount or current revenue run-rate,

    with outside market-data sources instead estimating roughly $170 million of 2023 revenue and about

    $520-537 million of lifetime funding. The main company-overview diligence flags are stale valuation

    visibility after the $4 billion 2022 Series D, incomplete public governance disclosure, and layoffs in

    2024 and 2025 amid interest-rate and California NEM 3.0 headwinds.'
sections:
- id: identity-and-business-model
  title: Identity, Headquarters, Stage, and Business Model
  body: 'Aurora Solar traces its origin to August 2013, when Christopher Hopper and Samuel Adeyemo say

    they founded the company after struggling to design a solar installation while they were students

    at Stanford Graduate School of Business. Official Aurora materials and Pear VC''s portfolio page

    align on San Francisco as the headquarters, while Aurora''s careers page adds that the company is

    remote-first with office options. Public materials consistently describe Aurora as a private Series D

    company rather than an installer, financier, or asset owner.


    The core product is a cloud-based software platform for solar professionals. Aurora''s own language

    emphasizes helping installers and sales teams design, sell, permit, and deliver residential and

    commercial solar projects remotely, while Sacra describes the revenue model as credit-based SaaS

    with add-on workflow modules. The business therefore appears closest to a category-specific solar

    operating system: it begins with roof modeling and production simulation, but it extends into sales

    proposals, AI-assisted lead capture, permitting, financing integrations, and post-sales workflows.


    Public scale markers are significant but still mostly company-reported. Aurora''s press kit,

    snapshot press release, and 2023 COO appointment announcement each cite more than 7,000

    organizations using the platform and more than 10 million projects designed globally. Those same

    materials support a one-line business model of software sold to solar installers and related solar

    professionals, not hardware sold to homeowners. What remains missing is current audited revenue,

    current ARR, and a current post-2022 valuation refresh.'
