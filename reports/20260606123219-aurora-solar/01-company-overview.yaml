  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: executive-title-clarity
    missingEvidence: 'Public sources reviewed do not provide a current official executive roster that reconciles

      Samuel Adeyemo''s present title. Pear VC lists COO while older 2022 coverage used CRO.'
    whyItMatters: 'Founder-role ambiguity makes it harder to assess day-to-day operating ownership, succession,

      and whether commercial leadership sits with a founder or with later operating hires.'
    diligencePath: 'Request a current executive-org chart, biographies, and board-approved title list from the data

      room; confirm reporting lines between Hopper, Adeyemo, and Idema.'
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: 'No reviewed public source disclosed board composition, investor board seats, observer rights,

      committee structure, or founder/investor control provisions.'
    whyItMatters: 'Without board and control-rights visibility it is impossible to evaluate how founder dependence

      is checked, how investors influence strategy, or how a down-round or sale process would be

      governed.'
    diligencePath: 'Request the cap table, shareholder agreement, board roster, committee list, and any investor

      rights side letters from the data room.'
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: 'Public sources show a pre-layoff headcount of about 500 in early 2024 and about 300 around the

      2022 Series D, but they do not disclose a current 2026 employee count after later layoffs.'
    whyItMatters: 'Current headcount is a basic scale and operating-efficiency metric, especially for a company that

      has already executed multiple workforce reductions.'
    diligencePath: 'Request current employee count, department mix, hiring plan, and attrition history through 2026

      from management or HR materials.'
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: 'No reviewed primary source disclosed current ARR, current revenue run-rate, or audited 2024-2025

      revenue. The only numeric revenue figure surfaced was Sacra''s outside estimate for 2023.'
    whyItMatters: 'Without current revenue or ARR, it is not possible to test whether Aurora''s 2022 $4 billion

      valuation remains defensible or whether the post-layoff operating reset improved efficiency.'
    diligencePath: 'Request audited 2024 and 2025 financials, current ARR by product line, gross retention, net

      retention, and sales-efficiency metrics.'
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: 'The milestone table is limited to publicly visible events. Internal board actions, customer

      concentration inflections, and any undisclosed financing or restructuring events would expand the chronology

      but are not available in reviewed public materials.'
    whyItMatters: 'Chapter 1 is meant to be the single chronology of record, so readers need an explicit note

      that the table is comprehensive only for public milestones, not for private company actions.'
    diligencePath: 'Request a management chronology or board deck that lists material internal events by quarter,

      then reconcile it against the public timeline before final publication.'
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: legal-regulatory-clearance
    missingEvidence: 'No lawsuit, sanction, or enforcement action surfaced in the reviewed sources, but no systematic

      PACER, state court, attorney-general, or regulator database sweep was performed.'
    whyItMatters: 'The absence of negative coverage in general-news sources is weaker than a documented legal

      clearance search, especially for a company serving a regulated solar workflow.'
    diligencePath: 'Run a targeted legal and regulatory search across PACER, California and federal court dockets,

      AG press releases, CEC/CPUC materials, and complaint databases.'
    relatedQuestionRefs:
    - QO022
