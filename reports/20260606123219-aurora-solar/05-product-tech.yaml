chapter:
  number: 5
  title: Product & Technology
  summary: Aurora Solar has built a broad solar-workflow portfolio spanning residential CAD design, AI-generated 3D models, proposal and contract workflows, interval-data integrations, and an increasingly automated permitting stack, while HelioScope remains a distinct but credible commercial design engine. The strongest evidence supports workflow breadth plus imagery/LIDAR and simulation depth; the main diligence risks are service-heavy plan-set operations, opaque API and reliability governance, and limited independent benchmarks for Aurora's AI and data-moat claims.
sections:
- id: product-surface-and-module-map
  title: Product surface and module map
  body: |-
    Aurora now sells a broad workflow, not a single design point tool. In residential, Design Mode is the high-fidelity CAD layer; Sales Mode is the proposal and financing layer; Contract Manager is the agreement layer; Plan Sets is the permitting layer; and Aurora AI is the speed layer that turns an address plus a utility bill into a fast starting design. The API surface sits across those products, exposing project, design, simulation, financing, and agreement data so operators can wire Aurora into CRM, ERP, and homeowner-facing systems.

    HelioScope remains the clearest portfolio fork. Its branding, sales motion, and simulation docs still describe a distinct C&I product family aimed at commercial developers who need rapid layout iteration, professional reporting, and bankable energy modeling, rather than a hidden tab inside Aurora's residential workflow. That separation matters: Aurora appears to be pursuing a two-track product strategy, with tightly integrated residential workflow software on one side and a dedicated commercial design environment on the other. The upside is product depth; the diligence question is how much identity, data model, and integration logic is actually shared across the two surfaces.
