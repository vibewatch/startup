- id: commercial-design-depth-and-customer-proof
  title: Commercial design depth and customer proof
  body: |-
    HelioScope is the main proof that Aurora has product depth beyond residential quote generation. The platform still markets itself as commercial solar software, with a CAD-style interface, automatic layout, shading analysis, multi-structure modeling, rate editing, financial profiles, customizable proposals, and API-based integration. The simulation surface is unusually explicit compared with the residential side: HelioScope explains how environmental conditions, irradiance, module behavior, and electrical components are modeled and how those inputs roll into an 8760 production report used for project financing. That is a materially stronger technical disclosure than Aurora gives for its AI-driven residential modeling.

    Customer references reinforce that HelioScope is more than a brochure SKU. Davis Hill Development says the product added more than twenty proposals annually and supported a 30% growth plan, while Sunrun says HelioScope Commercial Modeling Services delivered accurate 3D designs in 24 hours, saved thousands of hours annually, and improved proposal throughput. Those are company-hosted case studies, so they are not fully independent, but they do show named operators describing concrete workflow outcomes. The implication for diligence is positive: Aurora appears to own a credible commercial design asset. The remaining question is strategic integration—whether HelioScope stays a parallel business or becomes more deeply unified with Aurora's residential operating stack over time.
  claimRefs:
  - CE021
  - CE022
  - CE023
