  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: whole-home-energy
    missingEvidence: SKU-level product documentation or customer deployments showing Aurora orchestrating whole-home electrification measures beyond solar-plus-storage proposals.
    whyItMatters: Whole-home energy is part of Aurora's positioning, but investors need to know whether it is a real production workflow or mainly a sales narrative.
    diligencePath: Request product docs, customer screenshots, and roadmap notes for heat-pump, electrification, and appliance-level workflows.
    relatedQuestionRefs:
    - QE008
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: Public or shared private API docs covering authentication, rate limits, versioning, and shared data models across Aurora and HelioScope.
    whyItMatters: The breadth of Aurora's workflow-integration story is hard to underwrite without seeing how reusable and stable the integration layer really is.
    diligencePath: Request developer documentation, sample payloads, webhook schemas, and a partner onboarding guide from Aurora.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: material
    topic: data-moat
    missingEvidence: Independent error-rate, redesign-rate, or benchmark evidence for Aurora AI, EagleView Powered models, and remote-design accuracy claims.
    whyItMatters: Aurora markets data and automation as a moat, but without outside validation it is difficult to separate true technical advantage from strong product marketing.
    diligencePath: Ask for third-party accuracy studies, internal redesign metrics, and before/after change-order data segmented by imagery source and workflow.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public uptime, security-attestation, privacy-control, or incident-response artifacts specific to Aurora's API and workflow stack.
    whyItMatters: Enterprise and channel partners care about reliability and governance; missing public trust artifacts raise diligence friction for a system of record inside the project workflow.
    diligencePath: Request SOC or security summaries, status-page history, API governance docs, and privacy-control mappings for partner integrations.
    relatedQuestionRefs:
    - QE025
