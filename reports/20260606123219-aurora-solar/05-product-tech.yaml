- id: permit-plan-set-and-post-sale-workflow
  title: Permit, plan-set, and post-sale workflow
  body: |-
    Aurora's permitting motion is where the product story is changing fastest. Today's public workflow is still hybrid. Aurora markets in-app Plan Sets and advertises 24-to-48-hour turnaround, 95% first-time AHJ approvals, engineering stamps, and AHJ identification, which suggests a mature service layer wrapped around the software. The Instant Plan Sets documentation shows a second, more automated track: sold designs can be prepared for permitting, configured, previewed, and turned into to-code PDFs from inside the project. Those two facts together imply Aurora is already trying to move from software-plus-service toward software-plus-automation in post-sale operations.

    The Lyra acquisition is the strongest evidence of that direction. Independent coverage says Aurora bought Lyra specifically to add automated permit-ready design plans and accelerate residential plan-set automation. Lyra's own product emphasizes ready-to-submit permit packages, component-level designs, revisions, and bills of materials, which fit naturally into Aurora's post-sale bottleneck. Contract Manager points in the same direction: Aurora's agreement workflow started as a HelloSign-integrated product but was rebuilt on Docusign in 2026 with locked fields and calculated inputs. That indicates Aurora is not only trying to help reps sell faster, but also trying to reduce operational handoff friction after the sale closes.
  claimRefs:
