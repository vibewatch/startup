summary:
  headline: >-
    Aurora Solar appears to be a genuine category leader in solar workflow software, but public evidence still points to
    stretched valuation, market-driven operating pressure, and too much missing financial disclosure to underwrite the
    company confidently at its benchmark.
  overallScore: 6.3
