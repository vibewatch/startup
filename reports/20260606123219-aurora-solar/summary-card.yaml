  topStrengths:
    - >-
      Aurora spans more of the installer workflow than most direct competitors, combining design, proposal, financing,
      commercial modeling, and permitting automation in one platform family.
    - >-
      Public scale markers are meaningful, with more than 7,000 organizations and more than 20 million designs completed
      on-platform.
    - >-
      Aurora raised more than half a billion dollars from a strong climate and growth-investor syndicate before the
      market reset, giving it more strategic resilience than smaller solar-software peers.
    - >-
      Product expansion through HelioScope, Lyra, EagleView, financing, and utility-data integrations suggests real
      ecosystem depth rather than a single-point design tool.
  topRisks:
    - >-
      Aurora’s customer base is tied to a stressed residential-solar ecosystem still dealing with NEM 3.0, higher
      financing costs, and installer or financier bankruptcies.
    - >-
      Public financial disclosure is too thin to verify ARR, margin, burn, runway, retention, or concentration, making
      the current valuation hard to underwrite.
    - >-
      Layoffs in 2024 and 2025, plus incomplete governance and leadership disclosure, signal real operating pressure and
      reduce confidence in current scale claims.
    - >-
      A roughly $4 billion benchmark appears stretched against public revenue estimates that cluster near roughly $113
      million to $141 million.
  unresolvedGaps:
    - Audited 2024-2026 ARR, revenue, gross margin, and cash-burn bridge are unavailable publicly.
    - Net revenue retention, gross churn, and customer concentration by installer cohort are undisclosed.
    - Current cap table, preference stack, 409A, and recent secondary transaction data are not public.
    - Current headcount and formal board composition are not cleanly disclosed in authoritative public sources.
    - >-
      Public sources do not provide a clear post-acquisition KPI readout for Lyra, HelioScope, or whole-home workflow
      expansion.
