    - Driver + commoditization risk
    - Current + medium term
    - Automation can enlarge the market for integrated workflow software but compress standalone permit-tool differentiation
    - Measure Aurora attach and retention for permitting modules where SolarAPP+ is live
  notes: Rows intentionally mix demand growth, policy change, financing structure, and workflow automation because Aurora sells into installer operating systems rather than into a single commodity market.
