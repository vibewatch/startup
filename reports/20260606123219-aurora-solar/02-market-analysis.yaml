- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Aurora
  - Diligence ask
  rows:
  - - Large underlying solar activity base and global growth
    - Driver
    - Current + medium term
