    - Driver + transition cost
    - Current + 2026
    - Raises need for financing logic and lease/PPA workflows but changes partner and integration requirements
    - Audit Aurora support for TPO pricing, disclosures, and downstream handoffs
  - - High interest rates and loan sensitivity
    - Constraint
    - Current
    - Can reduce installer sales velocity and software budgets for smaller accounts
    - Track customer churn and expansion by installer size and financing mix
