- id: buyers-financing-and-channel-dynamics
  title: Buyer Segmentation, Financing Mix, and Installer Channel Dynamics
  body: |-
    Aurora's buyers are not end-homeowners; they are installer organizations whose economics increasingly depend on financing structure and channel health. In the core residential workflow, the buyer and payer are usually the installer owner, sales leader, or operations head, while the user is a mix of designers, sales reps, permit coordinators, and project managers. In commercial distributed solar, the workflow shifts toward preconstruction, engineering, and bid-management teams, but the same software stack still sits inside the installer or EPC. Financing changes are now central to budget ownership. CFPB says 2023 at-home residential solar financing was 19% cash, 58% loans, and 23% third-party ownership, while Wood Mackenzie says loans had reached 70% share in 2022 before losing share as higher rates and IRA adders favored TPO. pv magazine then reported loans fell to 43% of contracts in 2024, and Utility Dive described TPO as roughly 45% of installs with consultants expecting further 2026 growth. That mix shift raises workflow complexity — leases, PPAs, and compliance-heavy finance disclosures all create more proposal and project-management logic — but it also creates concentration risk because lender distress feeds directly into installer liquidity and software budgets.
  claimRefs:
