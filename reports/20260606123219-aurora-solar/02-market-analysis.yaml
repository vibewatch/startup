callouts:
- calloutType: insight
  title: Do not size Aurora off headline solar capex alone
  body: |-
    The public record is strong on solar deployment, system counts, and installer breadth, but weak on solar-workflow software spend. The cleanest public TAM and SAM frame is installer count plus distributed-system complexity, not the largest global PV revenue headline.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM010
- calloutType: risk
  title: Residential channel stress can cut software budgets before macro solar growth helps
  body: |-
    Aurora benefits when workflows become harder, but it still sells into installer P and Ls. High rates, 25D expiry, lender pauses, and bankruptcies can cause abrupt seat churn even while long-term solar deployment remains positive.
  claimRefs:
  - CM024
  - CM026
  - CM028
  - CM029
  - CM030
  - CM039
  - CM041
  - CM042
- calloutType: assumption
  title: SolarAPP+ is both catalyst and commoditization threat
  body: |-
    Permit digitization expands the value of integrated workflow software because fewer manual handoffs are tolerated, but a free and increasingly standardized permit layer can also compress pricing power for standalone permit tools.
  claimRefs:
  - CM033
  - CM034
  - CM035
