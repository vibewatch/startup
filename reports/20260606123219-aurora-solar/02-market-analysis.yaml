company:
  name: Aurora Solar
chapter:
  number: 2
  title: Market Analysis
  summary: |-
    Aurora Solar's relevant market is the distributed-solar workflow layer: design, proposal, project-management, and permitting software sold to residential and small-to-mid commercial installers rather than the entire solar hardware or generation market. Public evidence supports strong global and U.S. solar tailwinds — SEIA logged 43.2 GWdc of U.S. installations in 2025 and SolarPower Europe reported 597 GW globally in 2024 — but Aurora's nearer-term software demand is governed by distributed-market friction: NEM 3.0, Section 25D expiry after 2025, the shift from loans to TPO, and lender-installer distress. The chapter therefore uses installer-count, distributed-capacity, and permitting-friction lenses to frame TAM/SAM while preserving that a clean public SOM remains unresolved without Aurora-specific seat, pricing, and retention data.
sections:
- id: market-boundary
  title: Market Boundary and Evidence-Constrained TAM Logic
  body: |-
    Aurora Solar participates in a narrower market than headline solar-capacity statistics imply. The directly relevant spend sits in distributed-solar workflow software — design, proposal, project-management, and permit orchestration used by residential installers, storage-first sellers, and distributed commercial EPCs. That means the right boundary is downstream of solar generation and upstream of installation execution. Broad global PV deployment and residential-solar revenue estimates are still useful context because they show the size of the underlying activity pool, but they do not translate one-for-one into software revenue. The better sizing lenses are the count of active solar businesses, the installed base of distributed systems, the growth of small-scale residential and commercial capacity, and the amount of permitting and financing friction that software can remove. Public evidence is strong on those underlying activity measures — SEIA lists more than 10,000 U.S. solar businesses, Berkeley Lab tracks 4.5 million distributed systems through end-2024, and EIA shows small-scale solar still expanding in 2025 — but public sources do not disclose Aurora-relevant seat counts, contract value, or attach rates by installer size. The result is a defendable TAM/SAM frame but only a partial public SOM.
  claimRefs:
