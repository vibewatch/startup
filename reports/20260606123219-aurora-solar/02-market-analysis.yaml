  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Aurora
  rows:
  - - Residential installer workflow software
    - Design, sales proposal, CRM-adjacent project management, financing logic, plan-set generation
    - Homeowner electricity spend itself, loan principal, module and inverter hardware
    - Installer owner, sales lead, ops manager
    - Core software category for Aurora
  - - Distributed commercial installer / EPC workflow
    - Site design, proposal, preconstruction coordination, permitting, project tracking for rooftop and small C&I projects
    - Utility-scale development, grid-scale interconnection studies, module procurement
    - Commercial EPC leadership, preconstruction, engineering
    - Important adjacency because the same workflow stack extends beyond residential
  - - Permit workflow automation
    - AHJ submission packets, code checks, plan-set completeness, inspection checklist logic
    - Pure jurisdiction ERP replacement or general municipal software
    - Installer operations team, permit coordinators, AHJs
    - Adjacent layer where Aurora can add value but also faces commoditization
  - - Community solar / off-roof subscriptions
    - Lead capture or subscriber comparison only where rooftop is not viable
    - Subscriber management, bill-credit allocation, offtake contracting
    - Community-solar provider or subscriber manager
    - Meaningful substitute or adjacency, but not Aurora's core workflow today
  - - Utility-scale and manufacturing
    - None for Aurora core market
    - Modules, trackers, wafers, cells, utility project EPC and asset operation
    - Manufacturers, developers, utilities
    - Useful macro context but outside the relevant software spend boundary
  - - Status-quo substitutes
    - Spreadsheets, general CRM, lender portals, free permitting tools
    - Dedicated high-end solar workflow suites
    - Installer owner or rev-ops
    - Main low-end alternative when installer budgets are stressed
  notes: Boundary is defined by workflow ownership and recurring software spend, not by the full dollar value of solar hardware or electricity sales.
