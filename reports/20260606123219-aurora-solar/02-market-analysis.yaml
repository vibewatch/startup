- id: policy-permitting-catalysts-and-headwinds
  title: Policy, Permitting, and the Catalysts vs. Headwinds for Aurora's Category
  body: |-
    For Aurora's category, policy changes matter less as abstract politics than as changes to installer workflow. California's Net Billing Tariff replaced legacy NEM logic for new applications after April 15, 2023, credits exports based on avoided cost, and explicitly pushes customers toward solar-plus-storage economics. CPUC's own materials say the new tariff preserves existing customer compensation but changes the incentive stack for new sales, including roughly USD 100 monthly savings for new solar customers and at least USD 136 for solar-plus-storage customers. That makes Aurora's design and proposal layer more valuable because batteries, time-varying export logic, and customer-specific payback assumptions all become harder to quote correctly. The same is true in permitting. DOE says SolarAPP+ automates residential solar and solar-plus-storage permitting, can instantly approve eligible permits, and is free to local governments; the SolarAPP Foundation says jurisdictions can integrate it in under a week. That is both a demand catalyst and a commoditization risk: the more permitting becomes digitized, the more installers need workflow automation, but the less differentiated bare permit submission becomes. Meanwhile, headwinds remain material: the IRS says the homeowner-facing 25D credit is unavailable after December 31, 2025, California lost about 1,000 solar jobs in 2024 after residential policy changes, and lender failures such as Mosaic and Sunlight show how quickly installer budgets can tighten.
