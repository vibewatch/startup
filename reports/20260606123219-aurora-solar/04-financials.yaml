- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Qualitative cash-flow map showing why Aurora is less capex-heavy than a manufacturer but still financially exposed through policy shocks, installer distress, and missing liquidity disclosure.
  approximationNotes: This is intentionally qualitative because Aurora does not publish a cash-flow statement, debt schedule, or liquidity bridge.
  data:
    columns:
    - Public signal
    - Cash implication
    - Underwriting readout
    rows:
    - id: policy-reset
      label: California NEM / net-billing reset
      values:
      - Applications after April 15, 2023 moved to net billing
      - Harder residential economics can lower installer demand and software volumes
      - Major policy sensitivity remains embedded in Aurora’s revenue base
    - id: federal-incentives
      label: Federal residential ITC expiry and OBBB volatility
      values:
      - Aurora’s 2026 Snapshot describes extreme volatility after 25D expiry
      - Weaker installer close rates can hit renewals, services, and collections
      - Revenue quality depends on how diversified Aurora is beyond stressed residential installers
    - id: installer-finance
      label: Installer and lender distress
      values:
      - Mosaic bankruptcy and broader layoffs signal capital scarcity downstream
      - Installer payment delays or failures can ripple into Aurora demand and bad-debt risk
      - Counterparty health is now part of software underwriting
    - id: no-new-round
      label: No public external round since 2022
      values:
      - Existing capital had to bridge at least three years of operations
      - Runway likely extended through expense cuts rather than visible fresh equity
      - Capital adequacy is directionally positive but still unquantified
    - id: internal-price
      label: Internal price step-up after Lyra
