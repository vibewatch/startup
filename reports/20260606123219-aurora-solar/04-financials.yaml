company:
  name: Aurora Solar
chapter:
  number: 4
  title: Financials
  summary: Aurora Solar still looks like a scaled solar-software platform with recurring subscription and workflow revenue plus more than $523M of disclosed capital raised, but public underwriting remains incomplete because cash, burn, margin, and retention are undisclosed. The best public 2024 revenue read is an inferred roughly $116M-$140M band anchored by vendor estimates, while 2024-2025 layoffs and a January 2025 WARN filing for 58 San Francisco employees show that the 2022 raise did not eliminate the need for cost resets amid residential-solar headwinds. July 2024’s Lyra acquisition coincided with an internal employee share-price jump from $31.44 to $46.34, improving internal valuation optics without providing a fresh external market price.
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction
  body: 'Aurora still looks like a workflow SaaS business, but public evidence suggests monetization is more hybrid than a classic per-seat software model. The pricing page shows monthly and annual plan choices, 15% savings on annual billing, a 50-project-per-month single-user tier, and custom enterprise packages with unlimited users. It also lets customers configure PPW, per-component, or flat-fee pricing inside proposals, while Sacra says Aurora additionally sells project credits and annual enterprise minimums. That matters for revenue quality: subscription-like recurring revenue likely exists, but project-linked pricing and premium service add-ons mean realized revenue can still flex with installer activity, project mix, and attach rates. Public traction remains material. Aurora’s own data claims more than 7,000 customers, over 100,000 projects per week, and roughly 80% penetration of the top 75 U.S. residential installers, although the 2024 snapshot also shows a smaller 3,500-customer
    / 70,000-project weekly dataset for that specific study window. The takeaway is scale, not precision. Aurora is large enough for meaningful recurring software revenue, but public sources still do not reveal realized ASP, services mix, or renewal quality.'
