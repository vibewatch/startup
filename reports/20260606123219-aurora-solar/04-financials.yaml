- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue vs ARR
    - Without a company-defined ARR and revenue-recognition policy, public vendor estimates cannot be reconciled into one credible number
    - Request monthly revenue bridge, ARR definition, and treatment of credits, services, and implementation work
  - - Revenue mix by software, credits, and services
    - Mix determines gross margin quality and how cyclical installer demand really is
    - Request stream-level revenue percentages and cohort gross margin
  - - Gross margin by stream
    - No path to a reliable valuation multiple without knowing software versus services margin
    - Request gross profit and COGS split by software, professional services, and premium design services
  - - CAC / payback / sales efficiency
    - The GTM motion cannot be underwritten without understanding acquisition cost and payback
    - Request CAC, sales cycle, win rate, pipeline coverage, and quota attainment by segment
  - - NRR / churn / cohort expansion
    - Retention is the core proof of workflow stickiness and pricing power
    - Request logo churn, gross retention, NRR, and expansion by installer cohort
  - - Cash balance / burn / runway
    - Capital adequacy remains directional only without actual liquidity data
    - Request latest month-end cash, burn, runway bridge, and board forecast
  - - Debt, revolvers, or secured facilities
    - Undisclosed leverage could change downside risk and dilution timing
    - Request debt schedule, lender agreements, and covenant package
  - - Customer concentration and bad-debt exposure
    - Installer and lender distress could concentrate losses or slow collections
    - Request top-customer concentration, renewal history, write-offs, and exposure to distressed installer or lender accounts
  notes: Every row is an explicit underwriting blocker or material uncertainty; none of these fields can be solved credibly from public sources alone.
