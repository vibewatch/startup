callouts:
- calloutType: risk
  title: 2022 funding bought time, not immunity
  body: Aurora’s disclosed capital base remains large for a private solar-software company, but the 2024 and 2025 layoffs show the prior cost structure still had to be reset as residential-solar conditions worsened.
  claimRefs:
  - CI019
  - CI028
  - CI031
  - CI047
- calloutType: insight
  title: The Lyra signal is internal, not market-clearing
  body: The July 2024 move from $31.44 to $46.34 per employee share implies improved internal valuation confidence after the Lyra acquisition, but investors should not treat it as the equivalent of a fresh priced round.
  claimRefs:
  - CI024
  - CI025
  - CI026
- calloutType: recommendation
  title: Do not underwrite runway from public data alone
  body: Aurora’s public footprint is large enough to justify continued diligence, but cash, burn, gross margin, NRR, debt, and concentration data are still required before turning this chapter into a conviction-level financial view.
  claimRefs:
  - CI044
