  rows:
  - - Core software access
    - Monthly or annual software plan access
    - Plan / workspace
    - Public pricing shows monthly and annual options plus a starter tier and custom enterprise plans
    - High for recurring software logic, medium for actual ASP
    - Request ARR by monthly vs annual contracts and by self-serve vs enterprise accounts
  - - Project-linked pricing
    - Proposal pricing can be configured by PPW, per component, or flat fee
    - Project / quote
    - Visible in pricing workflow but realized monetization mix is undisclosed
    - Medium because project activity can affect realized economics
    - Request how much billed volume is tied to project throughput or credit usage
  - - Credit consumption
    - Sacra says customers buy credits that are spent on projects and features
    - Credit
    - Third-party reported at $0.10 per credit; not verified in Aurora’s current public pricing page
    - Medium-low because third-party only
    - Request current credit schedule, breakage, and annual credit utilization by cohort
  - - Enterprise minimums
    - Custom enterprise contracts with annual minimum commitments
    - Annual contract
    - Sacra reports an enterprise minimum near $15K per year
    - Medium because third-party only
    - Request actual minimums, ACVs, and renewal rates for enterprise accounts
  - - Premium design and drafting services
    - Plan sets, engineering stamps, and expedited site models sold alongside software
    - Project / service order
    - Officially marketed as add-ons
    - Medium because services mix can dilute gross margin
    - Request services revenue share and gross margin by add-on line
  - - AI and contract add-ons
    - Aurora AI, e-signature, contract tools, and integrations create upsell paths
    - Feature add-on / seat / usage
    - Officially marketed; revenue contribution undisclosed
    - Medium because attach-rate data is absent
    - Request attach rates, pricing, and gross-margin contribution of each premium module
  notes: Official pages show the menu of monetization options, but realized pricing, services mix, and credit economics remain partially undisclosed.
