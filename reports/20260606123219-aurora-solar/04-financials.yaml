- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'Financially, Aurora looks like a scaled but currently opaque software business whose survival probability is materially better than that of a venture-backed solar installer, yet whose underwrite is still blocked on missing private metrics. The positive case is straightforward: Aurora raised more than half a billion dollars, retained large installer penetration, continued shipping automation products, and used the Lyra acquisition to strengthen permitting workflow coverage. The negative case is equally clear: there is no public cash balance, no burn disclosure, no gross margin by stream, no CAC/payback, no NRR, no debt schedule, and no fresh outside financing after 2022. Public revenue databases disagree, and the most recent 2025 number is a single-source downside estimate rather than a corroborated fact. That means runway cannot be converted into months, only into a directional judgment that management has likely been defending liquidity through layoffs and cost controls. My financial
    verdict is therefore mixed: revenue quality is probably better than pure transactional solar businesses because Aurora sells workflow software, but margin path and capital adequacy remain management-data questions rather than public-evidence conclusions. Underwriting should stay conditional until management provides 2024 and 2025 revenue recognition, cash, burn, gross margin, retention, and any debt or credit-facility disclosures.'
