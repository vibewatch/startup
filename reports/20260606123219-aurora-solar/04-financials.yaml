  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP by plan, credit burn, enterprise discounting, and services attach rates.
    whyItMatters: List pricing alone does not reveal revenue quality, software gross margin, or the sensitivity of revenue to installer activity.
    diligencePath: Request 2024 and 2025 bookings by tier, average realized pricing, credit consumption per account, and services revenue as a percent of total revenue.
    relatedQuestionRefs:
    - QI002
    relatedTableRefs:
    - TI002
  - type: conflicting-data
    severity: material
    topic: 2024-revenue-precision
    missingEvidence: Management-certified 2024 recognized revenue, ARR, and reconciliation to any usage or services revenue.
    whyItMatters: GetLatka and Sacra provide materially different scale signals, so a public-only revenue number remains directional rather than underwritable.
    diligencePath: Request monthly revenue bridge for 2023 through 2025, plus auditor-ready ARR definitions and revenue-recognition treatment for credits and services.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: lyra-economics
    missingEvidence: Post-acquisition metrics showing whether Lyra improved close rates, permitting cycle times, gross margin, or attach rates.
    whyItMatters: The Lyra deal coincided with a higher internal share price, but investors still lack proof that the acquisition changed unit economics rather than only strategic narrative.
    diligencePath: Ask management for pre/post-acquisition permitting-cycle data, plan-set automation adoption, attach rates, and cost-per-project savings attributable to Lyra.
    relatedQuestionRefs:
    - QI015
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, gross margin by stream, CAC/payback, NRR, and a 12-month operating plan.
    whyItMatters: Without cash and burn disclosure, capital raised cannot be translated into runway months or a financing trigger, which blocks a real financial underwrite.
    diligencePath: Request board or lender reporting packs showing cash, burn, gross margin, retention, sales efficiency, and monthly forecast versus actuals for 2024 and 2025.
    relatedQuestionRefs:
    - QI020
    - QI023
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-and-credit-facilities
    missingEvidence: Any venture debt, credit facility, equipment financing, or covenanted working-capital line documentation.
    whyItMatters: A hidden debt facility could change downside protection, liquidity stress, and dilution risk even if no new equity has been announced.
    diligencePath: Request debt schedules, lender agreements, covenant compliance certificates, and any security interests or negative pledges outstanding as of the latest month-end.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-bad-debt
    missingEvidence: Revenue concentration by installer, cohort churn, and any bad-debt or payment-delay exposure tied to distressed residential solar counterparties.
    whyItMatters: Installer bankruptcies and lender failures can hit Aurora through non-renewal, slower collections, or services work that never converts into durable subscription revenue.
    diligencePath: Request top-20 customer revenue concentration, renewal history, write-offs, and exposure to bankrupt or financially stressed installer and lender accounts.
    relatedQuestionRefs:
    - QI021
    - QI022
    relatedTableRefs:
    - TI005
