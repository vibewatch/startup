- id: revenue-estimates-and-valuation-signals
  title: Revenue estimates and valuation signals
  body: 'Capital history is much easier to observe than current operating performance. Official company posts and TechCrunch establish a $50M Series B in 2020, a $250M Series C in May 2021, and a $200M Series D in February 2022. Tracxn puts the post-money at $2B for Series C and $4B for Series D, while Prime Unicorn Index describes the 2022 round as a $3.8B valuation. Across GetLatka and Tracxn, lifetime disclosed funding clusters around roughly $523.5M-$537M. Since then, Aurora has offered no fresh public equity round. The July 2024 Lyra acquisition is therefore notable because it produced an internal, not external, valuation signal: Prime Unicorn says Aurora’s employee share price moved from $31.44 to $46.34 nine days after the acquisition. That says management believed the deal improved economics or defensibility, but it is not the same as a priced market round. Revenue is the least reliable public datapoint. GetLatka shows $113.3M in December 2023 and $135.3M in October 2024, while Sacra
    estimated $170M for 2023. Those vendor estimates disagree too much to underwrite precisely. A cautious public 2024 band is therefore only inferable at roughly $116M-$140M, and should be labeled an estimate rather than disclosed ARR.'
