- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Total disclosed capital raised
    - ~$523.5M-$537M across public databases
    - Medium
    - Sets the ceiling for how much cumulative equity Aurora has had available to fund growth
    - Request board-approved capitalization table and cash receipts by round
  - - Last priced round
    - Feb 2022 Series D, $200M at roughly $3.8B-$4.0B post-money
    - Medium
    - Latest external valuation anchor and the last known major cash infusion
    - Provide final Series D documents, share count, and any liquidation preferences
  - - Fresh external equity since 2022
    - No reviewed public new round
    - Medium
    - If true, runway has been managed without visible outside capital for over three years
    - Disclose whether any extension, bridge, SAFE, or structured secondary occurred after Series D
  - - Planned use of 2022 funds
    - Officially described as accelerating product, growth, and customer digital transformation
    - High
    - Use-of-funds language frames whether the 2022 raise was meant for expansion versus survival
    - Provide original Series D operating plan and actual deployment versus plan
  - - Internal valuation signal
    - Employee share price moved from $31.44 to $46.34 in July 2024 after Lyra
    - Medium
    - Positive internal mark but not a fresh external market-clearing price
    - Provide 409A or other internal-valuation methodology and fully diluted share count
  - - 2024 cost reset
    - 20% layoff of about 500 staff plus an earlier November 2023 cut
    - Medium
    - Shows the 2022 capital base did not fully cover the prior cost structure
    - Provide pre- and post-layoff operating expense run rates and savings achieved
  - - 2025 WARN layoff
    - 58 San Francisco employees in a Jan. 10, 2025 WARN filing
    - High
    - Confirms further cost action after the 2024 reset
    - Provide the role mix, annualized savings, severance cost, and any additional 2025 actions
  - - Cash / burn / runway
    - Not publicly disclosed
    - Not applicable
    - Without these, capital adequacy cannot be converted into months-of-runway
    - Provide latest cash, monthly burn, covenant headroom, and runway forecast
  - - Debt / credit obligations
    - No reviewed public evidence of venture debt or project-finance obligations
    - Medium
    - Hidden leverage could change downside risk materially
    - Provide debt schedule, borrowing-base mechanics, and any secured lender relationships
  notes: This table focuses on forward capital adequacy rather than restating the entire funding chronology; all runway language is inferential because cash and burn are private.
