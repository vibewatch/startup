    {
      "id": "mitigations-monitoring-and-thesis-breaks",
      "title": "Mitigations, monitoring, and thesis-break triggers",
      "body": "Aurora does have visible mitigation moves. It is adapting to financing complexity with lender integrations and a heavier TPO workflow, reducing permitting friction through Lyra, extending into whole-home and storage-related value propositions where homeowner economics are framed around bills rather than incentives, and using HelioScope’s bankability and AI features to defend product relevance. Those are sensible responses to the market. But the mitigants work only if Aurora can execute faster than the industry is deteriorating. The most important monitors are therefore external and internal at the same time: another major installer or finance-provider failure, fresh California policy deterioration, visible slippage in product accuracy or support quality, repeated layoffs or management churn, or management’s inability to produce a credible private KPI pack on ARR, gross margin, concentration, and cash runway. If those indicators move the wrong way, the downside case stops being ordinary solar cyclicality and becomes a thesis-break on Aurora’s ability to turn automation and product breadth into durable, profitable resilience.",
