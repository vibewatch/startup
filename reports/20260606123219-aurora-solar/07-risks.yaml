    {
      "id": "product-platform-and-integration-risk",
      "title": "Product, platform, and post-acquisition execution risk",
      "body": "Aurora’s answer to market stress is to widen the product surface: automate permitting with Lyra, add financing integrations, make HelioScope more bankable for commercial underwriting, apply AI to rooftop obstruction detection, and move beyond solar-only proposals into whole-home electrification workflows. Strategically, that may be correct. Operationally, it raises the bar. Lyra only works as a mitigation if instant plan sets stay accurate across fragmented AHJ requirements, while HelioScope’s bankability claims matter only if modeled outputs continue to hold up in real underwriting and production contexts. The Similar Obstruction Detection feature further pushes Aurora into AI-enabled design automation, which can save time but also shifts more trust onto model output quality. Meanwhile, the whole-home offering broadens the sales and product problem from rooftop design into appliance, storage, EV, and efficiency modeling. Aurora’s public privacy policy and terms show a current legal and data-handling perimeter, but retained public sources still do not provide uptime history, incident postmortems, or post-integration KPI disclosure. That leaves investors relying on roadmap narrative more than measured execution proof.",
