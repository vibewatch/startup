    "number": 7,
    "title": "Risks",
    "summary": "Aurora Solar’s risk profile is dominated by a hostile residential-solar backdrop and by management’s response to it. California NEM 3.0, higher financing costs, and the SunPower/Sunnova failure cycle pressure the installer customers Aurora depends on, while Aurora’s own mitigation path—Lyra, financing integrations, HelioScope AI, and whole-home workflow expansion—widens execution, privacy, and disclosure risk at a moment when public financial visibility remains thin."
  },
