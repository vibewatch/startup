- id: pricing-packaging-distribution
  title: Pricing, packaging, and distribution power
  body: |
    Pricing is one of Aurora's weak spots because the company does not currently disclose a clear public seat schedule on its own official surfaces, while several rivals make the comparison easier. OpenSolar is the most aggressive low-end wedge because its core platform is free and monetized through partner relationships. HelioScope publishes specialist-seat pricing and makes its commercial positioning explicit, but its project caps and AutoCAD dependency push total cost up once an EPC needs full electrical deliverables. Solargraf takes the opposite tack by publishing annual project-and-user bundles and leaning into channel distribution through Enphase and TPO integrations such as EnFin. Energy Toolbase discloses finance-first subscription tiers that look reasonable for teams whose main pain point is tariffs, proposals, and storage economics, not design geometry. PVcase keeps pricing custom, which fits an enterprise engineering sale rather than a self-serve installer motion. Taken together, the market is sorted less by one universal price ladder than by workflow archetype: free all-in-one, specialist monthly seat, annual packaged suite, finance-led subscription, or custom enterprise engineering.
