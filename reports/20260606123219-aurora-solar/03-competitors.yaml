company:
  name: Aurora Solar
chapter:
  number: 3
  title: Competitors
  summary: |
    Aurora competes in a fragmented market, not a single lane: OpenSolar and Solargraf attack the same residential all-in-one workflow, HelioScope and PVcase own much of the engineering-heavy C&I or utility edge, Energy Toolbase competes on storage and financial rigor, and Scanifly fills hard-site survey gaps. Aurora's strongest differentiation remains the residential close-the-loop workflow built on remote imagery or LIDAR, polished proposals, and now permit-set services, reinforced by the HelioScope and Lyra acquisitions. The main exposed flanks are still pricing opacity, specialist-stack substitution for commercial engineering, and the low-end pressure from free or publicly packaged alternatives.
sections:
- id: landscape-segmentation
  title: Landscape segmentation and who actually competes with Aurora
  body: |
    Aurora does not face one monolithic competitor. The most direct residential workflow rivals are OpenSolar and Solargraf, because both market design, proposals, financing, and permitting or workflow control to installers who care about same-visit close rates and operational handoff. HelioScope and PVcase attack a different buying center: engineers, EPCs, and C&I or utility teams that value bankable simulation, AutoCAD-native workflows, or complex rooftop and ground-mount design more than homeowner-facing proposals. Energy Toolbase competes where the buyer problem is storage economics, tariffs, and proposal finance logic rather than rooftop geometry. Scanifly is usually not a full replacement, but it matters on difficult roofs because survey quality, drone capture, and reduced roof climbs can displace pieces of Aurora's remote-design story. The status quo also remains real: many installers still stitch together spreadsheets, generic CAD, and separate CRM or project-management tools. That means Aurora is competing simultaneously against all-in-one rivals, best-of-breed stacks, and internal build.
