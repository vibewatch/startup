  evidenceGaps:
  - type: missing-source
    severity: material
    topic: aurora-public-pricing
    missingEvidence: A current official Aurora public pricing page or contract-summary source that confirms seat, credit, and enterprise pricing terms.
    whyItMatters: Without official list pricing, competitive modeling can only say Aurora is opaque or premium-coded, not precisely where it lands against HelioScope, Solargraf, or Energy Toolbase.
    diligencePath: Request Aurora's current rate card or active quote screenshots from a live customer or channel partner and reconcile against any current credits program.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: aurora-attach-rates
    missingEvidence: Cross-sell and attach-rate data showing how many Aurora customers actually use HelioScope, Lyra plan sets, or both.
    whyItMatters: The strategic value of Aurora's acquisitions depends on adoption inside the installed base, not just ownership of adjacent products.
    diligencePath: Ask Aurora for cohort-level attach rates, logo overlap, and retention by product combination, or obtain channel-partner usage data.
    relatedQuestionRefs:
    - QP027
  - type: access-blocked
    severity: minor
    topic: third-party-user-review-depth
    missingEvidence: Unrestricted access to larger current G2 or Capterra review samples for Scanifly, Solargraf, and Aurora head-to-head comparisons.
    whyItMatters: Open independent user-review depth would better separate structural product weaknesses from marketing-heavy review pages or small-sample anecdotes.
    diligencePath: Access paid review datasets or screenshots from subscribed review accounts, then compare complaint frequency and recency across vendors.
    relatedQuestionRefs:
    - QP028

