callouts:
- calloutType: strength
  title: Aurora still owns the strongest residential “close the loop” story
  body: |
    The most compelling Aurora case is not pure panel-layout superiority. It is the combination of remote model quality, polished proposals, financing-linked sales workflow, and now permit-set services in one residential-centric operating flow.
  claimRefs:
  - CP034
  - CP035
  - CP038
- calloutType: risk
  title: Aurora is squeezed by free all-in-one rivals below and specialist stacks above
  body: |
    OpenSolar and Solargraf pressure Aurora on price and workflow breadth at the residential edge, while HelioScope, PVcase, and Energy Toolbase make it easier for engineering-heavy buyers to defect toward a best-of-breed commercial stack.
  claimRefs:
  - CP019
  - CP036
  - CP037
- calloutType: insight
  title: The real moat question is workflow stickiness, not feature checklists
  body: |
    The fetched evidence suggests that switching costs come from embedded templates, CRM handoffs, permitting processes, and team retraining. As more vendors claim AI design, financing, and permit automation, Aurora's durable advantage must show up in operational lock-in and measurable throughput, not just product marketing.
  claimRefs:
  - CP031
  - CP033
  - CP040
