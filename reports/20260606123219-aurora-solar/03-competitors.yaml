- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Aurora differentiator or risk
  - who pressures it
  - severity
  - current evidence
  - mitigation / diligence ask
  rows:
  - - Remote-imagery and LIDAR-led design accuracy tied to proposal workflow
    - OpenSolar and Solargraf narrow the gap; Scanifly can outperform on hard-site survey capture
    - Medium
    - Aurora's strengths are repeatedly described around modeling + proposals; rivals now market AI design and financing too
    - Verify actual conversion lift and design-error reduction versus specific alternatives
  - - Integrated permitting after Lyra
    - Solargraf also markets automated permits and plan sets; status quo buyers can outsource permit vendors
    - Medium
    - Aurora and news coverage both frame Lyra as a permitting acceleration bet; Solargraf markets the same workflow theme
    - Request attach-rate and turnaround data for Aurora plan sets versus external permit shops
  - - Residential all-in-one breadth
    - OpenSolar is free and Solargraf is publicly packaged with channel backing
    - High
    - Rivals now combine proposals, finance, CRM, and permitting in one product narrative
    - Assess whether Aurora wins on measured productivity, not just marketing breadth
  - - Commercial expansion through HelioScope
    - PVcase and specialist-stack buyers may still prefer engineering-first tools
    - Medium
    - Aurora owns HelioScope, but available evidence still shows adjacent products and specialist stack needs
    - Confirm cross-sell adoption and whether commercial buyers actually standardize on the Aurora suite
  - - Opaque pricing and missing electrical automation
    - Every engineering-heavy or budget-sensitive buyer
    - High
    - Independent reviews repeatedly call out no automated electrical documentation and unclear pricing
    - Request current list pricing and test whether Lyra/HelioScope reduce the need for AutoCAD or other bolt-ons
  notes: Severity is an analyst ordinal judgment; this register is about durability of competitive claims, not a forecast of revenue impact.
