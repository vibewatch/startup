- id: workflow-coverage
  title: Workflow coverage and product-scope comparison
  body: |
    Aurora's core claim is breadth. Its official material describes a platform that sells, designs, finances, and delivers solar and storage, while its help-center content shows proposal generation, financing integrations, TPO workflows, and commercial proposals as normal product surfaces rather than one-off collateral. The practical comparison is therefore not “who can draw panels on a roof,” but “who can move a job from lead to install-ready output with the fewest handoffs.” On that lens, OpenSolar and Solargraf are the closest rivals because they also promise integrated sales workflow, proposal generation, financing, and permitting support. HelioScope, PVcase, and Energy Toolbase are more specialized: they can beat Aurora on simulation depth, AutoCAD-native engineering, or storage-financial rigor, but usually at the cost of requiring other tools for CRM, proposal polish, or permit operations. Scanifly likewise sits best as a specialist layer that improves site-capture quality. Aurora's post-Lyra permitting capability is therefore strategically important because it reduces one of the most obvious reasons to leave the platform after the sale closes.
