- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - target segment
  - workflow scope
  - distribution / pricing clue
  - key limitation
  rows:
  - - Aurora Solar
    - Direct all-in-one workflow incumbent
    - US residential and smaller commercial installers
    - Design, proposals, financing-linked sales workflow, and now permit-set services
    - Pricing mostly non-transparent on current official surfaces; sells breadth and speed
    - Commercial electrical engineering remains a weak spot
  - - OpenSolar
    - Direct all-in-one rival
    - Small to mid-size residential installers; global users
    - Free design, proposal, CRM, financing, and permitting-oriented integrations
    - Free core software; partner-monetized
    - Lower perceived depth on LIDAR, proposal polish, and larger-project performance
  - - HelioScope
    - Commercial design specialist
    - C&I EPCs and engineering teams
    - Bankable simulation, commercial layouts, proposal support
    - Published $159/$259 monthly specialist seats
    - AutoCAD and other tools still needed for fuller electrical workflow
  - - PVcase
    - Utility/C&I engineering specialist
    - Utility-scale developers and advanced C&I designers
    - AutoCAD-native layout and electrical-design workflow
    - Custom enterprise pricing
    - Not built around residential sales workflow or self-serve proposals
  - - Energy Toolbase
    - Finance and storage specialist
    - Solar-plus-storage developers and rate-sensitive commercial teams
    - Financial modeling, storage economics, proposal and monitoring stack
    - Published subscription tiers starting at $299/user/month
    - Usually complements, rather than replaces, primary design software
  - - Scanifly
    - Survey and site-data specialist
    - Installers with complex roofs or site-survey bottlenecks
    - Drone or remote-imagery capture feeding design and proposal tools
    - Quoted / demo-led pricing only on fetched surfaces
    - Bolt-on workflow rather than full replacement suite
  - - Solargraf
    - Direct all-in-one rival
    - Residential and light commercial installers, especially Enphase-aligned channels
    - Design, interactive proposals, permitting, financing, CRM, and battery workflows
    - Public annual bundles from $2,799 for 240 projects / 2 users
    - Independent review depth is thinner than Aurora's; shading accuracy criticism needs more verification
  - - Status quo / internal build
    - Substitute
    - Price-sensitive installers or teams with entrenched internal ops
    - Spreadsheets, generic CAD, standalone CRM, and separate PM or permit vendors
    - License spend can look low upfront but labor cost is hidden
    - Data fragmentation, retraining drag, and error-prone handoffs
  notes: Representative competitive set for the solar design workflow buyer; rows mix direct rivals, specialist substitutes, and status-quo alternatives rather than claiming one exhaustive market map.
