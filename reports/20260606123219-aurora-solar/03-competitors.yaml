- id: adverse-signals
  title: Adverse signals, switching costs, and moat durability
  body: |
    The competitive risk to Aurora comes from both ends of the market. At the low end, OpenSolar removes license friction and gives smaller installers enough workflow to defer paying for Aurora, while Solargraf offers a publicly packaged alternative with Enphase-backed distribution and similar all-in-one messaging. At the high end, engineering-focused buyers can combine HelioScope, PVcase, Energy Toolbase, and internal CAD to build a stack that is better aligned with electrical documentation, utility-scale design, or hybrid-storage modeling. Aurora's strongest moat evidence remains the combination of remote-design accuracy, proposal polish, and integrated permitting, but its strongest adverse evidence is equally consistent: pricing opacity, missing automated electrical engineering, and limited proof that the HelioScope or Lyra adjacencies create durable lock-in. Switching costs do exist, yet the evidence suggests they come from templates, retraining, CRM linkage, and workflow embedding rather than from Aurora owning some irreplaceable drawing engine. As more vendors advertise AI design, financing integrations, and permit automation, Aurora's moat looks operational and segment-specific, not absolute.
