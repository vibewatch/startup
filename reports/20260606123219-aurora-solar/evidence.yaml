      Commercial and utility motion could diversify Aurora away from residential cyclicality, but public proof is still
      mostly playbooks and one multifamily case study.
    diligencePath: >-
      Request reference calls and customer roster for commercial EPC, multifamily, developer, and utility accounts using
      Aurora or HelioScope today.
    relatedQuestionRefs:
