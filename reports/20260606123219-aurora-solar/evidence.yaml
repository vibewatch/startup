evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: executive-title-clarity
    missingEvidence: |-
      Public sources reviewed do not provide a current official executive roster that reconciles
      Samuel Adeyemo's present title. Pear VC lists COO while older 2022 coverage used CRO.
    whyItMatters: |-
      Founder-role ambiguity makes it harder to assess day-to-day operating ownership, succession,
      and whether commercial leadership sits with a founder or with later operating hires.
    diligencePath: |-
      Request a current executive-org chart, biographies, and board-approved title list from the data
      room; confirm reporting lines between Hopper, Adeyemo, and Idema.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: |-
      No reviewed public source disclosed board composition, investor board seats, observer rights,
      committee structure, or founder/investor control provisions.
    whyItMatters: |-
      Without board and control-rights visibility it is impossible to evaluate how founder dependence
      is checked, how investors influence strategy, or how a down-round or sale process would be
      governed.
    diligencePath: |-
      Request the cap table, shareholder agreement, board roster, committee list, and any investor
      rights side letters from the data room.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: |-
      Public sources show a pre-layoff headcount of about 500 in early 2024 and about 300 around the
      2022 Series D, but they do not disclose a current 2026 employee count after later layoffs.
    whyItMatters: |-
      Current headcount is a basic scale and operating-efficiency metric, especially for a company that
      has already executed multiple workforce reductions.
    diligencePath: |-
      Request current employee count, department mix, hiring plan, and attrition history through 2026
      from management or HR materials.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: |-
      No reviewed primary source disclosed current ARR, current revenue run-rate, or audited 2024-2025
      revenue. The only numeric revenue figure surfaced was Sacra's outside estimate for 2023.
    whyItMatters: |-
      Without current revenue or ARR, it is not possible to test whether Aurora's 2022 $4 billion
      valuation remains defensible or whether the post-layoff operating reset improved efficiency.
    diligencePath: |-
      Request audited 2024 and 2025 financials, current ARR by product line, gross retention, net
      retention, and sales-efficiency metrics.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: |-
      The milestone table is limited to publicly visible events. Internal board actions, customer
      concentration inflections, and any undisclosed financing or restructuring events would expand the chronology
      but are not available in reviewed public materials.
    whyItMatters: |-
      Chapter 1 is meant to be the single chronology of record, so readers need an explicit note
      that the table is comprehensive only for public milestones, not for private company actions.
    diligencePath: |-
      Request a management chronology or board deck that lists material internal events by quarter,
      then reconcile it against the public timeline before final publication.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: legal-regulatory-clearance
    missingEvidence: |-
      No lawsuit, sanction, or enforcement action surfaced in the reviewed sources, but no systematic
      PACER, state court, attorney-general, or regulator database sweep was performed.
    whyItMatters: |-
      The absence of negative coverage in general-news sources is weaker than a documented legal
      clearance search, especially for a company serving a regulated solar workflow.
    diligencePath: |-
      Run a targeted legal and regulatory search across PACER, California and federal court dockets,
      AG press releases, CEC/CPUC materials, and complaint databases.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: software-som
    missingEvidence: >-
      Aurora customer count by installer segment, blended ARR per account, module attach rates, and gross retention by
      customer size.
    whyItMatters: >-
      Without customer count, price, and retention data, public deployment and installer-count lenses cannot be turned
      into a defensible SOM.
    diligencePath: >-
      Request Aurora cohort data by installer size, product bundle, and financing mix, then map those cohorts to the
      public installer base.
    relatedQuestionRefs:
      - QM005
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: permit-workflow-spend
    missingEvidence: A public benchmark for what installers or jurisdictions actually pay for permit-workflow software or services.
    whyItMatters: >-
      Permit automation is central to Aurora's adjacency thesis, but the public record shows workflow friction and
      adoption, not monetized spend.
    diligencePath: >-
      Collect pricing sheets, reseller contracts, or customer references from permit-software vendors and SolarAPP+
      implementation partners.
    relatedQuestionRefs:
      - QM011
      - QM021
      - QM025
    relatedTableRefs:
      - TM001
      - TM004
  - type: missing-source
    severity: material
    topic: installer-churn-risk
    missingEvidence: Public data linking installer bankruptcies, financing-partner outages, and software churn or seat contraction.
    whyItMatters: >-
      Channel distress is a core downside case for Aurora, but external sources mostly show market and lender stress
      rather than direct SaaS retention impact.
    diligencePath: >-
      Ask Aurora for churn reasons, lost-ARR notes, and exposure to stressed lenders or California-heavy installers over
      2024-2026.
    relatedQuestionRefs:
      - QM018
      - QM024
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: aurora-public-pricing
    missingEvidence: >-
      A current official Aurora public pricing page or contract-summary source that confirms seat, credit, and
      enterprise pricing terms.
    whyItMatters: >-
      Without official list pricing, competitive modeling can only say Aurora is opaque or premium-coded, not precisely
      where it lands against HelioScope, Solargraf, or Energy Toolbase.
    diligencePath: >-
      Request Aurora's current rate card or active quote screenshots from a live customer or channel partner and
      reconcile against any current credits program.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: aurora-attach-rates
    missingEvidence: >-
      Cross-sell and attach-rate data showing how many Aurora customers actually use HelioScope, Lyra plan sets, or
      both.
    whyItMatters: >-
      The strategic value of Aurora's acquisitions depends on adoption inside the installed base, not just ownership of
      adjacent products.
    diligencePath: >-
      Ask Aurora for cohort-level attach rates, logo overlap, and retention by product combination, or obtain
      channel-partner usage data.
    relatedQuestionRefs:
      - QP027
  - type: access-blocked
    severity: minor
    topic: third-party-user-review-depth
    missingEvidence: >-
      Unrestricted access to larger current G2 or Capterra review samples for Scanifly, Solargraf, and Aurora
      head-to-head comparisons.
    whyItMatters: >-
      Open independent user-review depth would better separate structural product weaknesses from marketing-heavy review
      pages or small-sample anecdotes.
    diligencePath: >-
      Access paid review datasets or screenshots from subscribed review accounts, then compare complaint frequency and
      recency across vendors.
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP by plan, credit burn, enterprise discounting, and services attach rates.
    whyItMatters: >-
      List pricing alone does not reveal revenue quality, software gross margin, or the sensitivity of revenue to
      installer activity.
    diligencePath: >-
      Request 2024 and 2025 bookings by tier, average realized pricing, credit consumption per account, and services
      revenue as a percent of total revenue.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: conflicting-data
    severity: material
    topic: 2024-revenue-precision
    missingEvidence: Management-certified 2024 recognized revenue, ARR, and reconciliation to any usage or services revenue.
    whyItMatters: >-
      GetLatka and Sacra provide materially different scale signals, so a public-only revenue number remains directional
      rather than underwritable.
    diligencePath: >-
      Request monthly revenue bridge for 2023 through 2025, plus auditor-ready ARR definitions and revenue-recognition
      treatment for credits and services.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: lyra-economics
    missingEvidence: >-
      Post-acquisition metrics showing whether Lyra improved close rates, permitting cycle times, gross margin, or
      attach rates.
    whyItMatters: >-
      The Lyra deal coincided with a higher internal share price, but investors still lack proof that the acquisition
      changed unit economics rather than only strategic narrative.
    diligencePath: >-
      Ask management for pre/post-acquisition permitting-cycle data, plan-set automation adoption, attach rates, and
      cost-per-project savings attributable to Lyra.
    relatedQuestionRefs:
      - QI015
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, gross margin by stream, CAC/payback, NRR, and a 12-month operating plan.
    whyItMatters: >-
      Without cash and burn disclosure, capital raised cannot be translated into runway months or a financing trigger,
      which blocks a real financial underwrite.
    diligencePath: >-
      Request board or lender reporting packs showing cash, burn, gross margin, retention, sales efficiency, and monthly
      forecast versus actuals for 2024 and 2025.
    relatedQuestionRefs:
      - QI020
      - QI023
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: debt-and-credit-facilities
    missingEvidence: Any venture debt, credit facility, equipment financing, or covenanted working-capital line documentation.
    whyItMatters: >-
      A hidden debt facility could change downside protection, liquidity stress, and dilution risk even if no new equity
      has been announced.
    diligencePath: >-
      Request debt schedules, lender agreements, covenant compliance certificates, and any security interests or
      negative pledges outstanding as of the latest month-end.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-bad-debt
    missingEvidence: >-
      Revenue concentration by installer, cohort churn, and any bad-debt or payment-delay exposure tied to distressed
      residential solar counterparties.
    whyItMatters: >-
      Installer bankruptcies and lender failures can hit Aurora through non-renewal, slower collections, or services
      work that never converts into durable subscription revenue.
    diligencePath: >-
      Request top-20 customer revenue concentration, renewal history, write-offs, and exposure to bankrupt or
      financially stressed installer and lender accounts.
    relatedQuestionRefs:
      - QI021
      - QI022
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: whole-home-energy
    missingEvidence: >-
      SKU-level product documentation or customer deployments showing Aurora orchestrating whole-home electrification
      measures beyond solar-plus-storage proposals.
    whyItMatters: >-
      Whole-home energy is part of Aurora's positioning, but investors need to know whether it is a real production
      workflow or mainly a sales narrative.
    diligencePath: >-
      Request product docs, customer screenshots, and roadmap notes for heat-pump, electrification, and appliance-level
      workflows.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: >-
      Public or shared private API docs covering authentication, rate limits, versioning, and shared data models across
      Aurora and HelioScope.
    whyItMatters: >-
      The breadth of Aurora's workflow-integration story is hard to underwrite without seeing how reusable and stable
      the integration layer really is.
    diligencePath: Request developer documentation, sample payloads, webhook schemas, and a partner onboarding guide from Aurora.
    relatedQuestionRefs:
      - QE020
  - type: missing-source
    severity: material
    topic: data-moat
    missingEvidence: >-
      Independent error-rate, redesign-rate, or benchmark evidence for Aurora AI, EagleView Powered models, and
      remote-design accuracy claims.
    whyItMatters: >-
      Aurora markets data and automation as a moat, but without outside validation it is difficult to separate true
      technical advantage from strong product marketing.
    diligencePath: >-
      Ask for third-party accuracy studies, internal redesign metrics, and before/after change-order data segmented by
      imagery source and workflow.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public uptime, security-attestation, privacy-control, or incident-response artifacts specific to Aurora's API and
      workflow stack.
    whyItMatters: >-
      Enterprise and channel partners care about reliability and governance; missing public trust artifacts raise
      diligence friction for a system of record inside the project workflow.
    diligencePath: >-
      Request SOC or security summaries, status-page history, API governance docs, and privacy-control mappings for
      partner integrations.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Segmented NRR, GRR, logo churn, contract length, and renewal timing for self-serve versus enterprise customers.
    whyItMatters: >-
      Without retention data, durability must be inferred from workflow embedding and case-study anecdotes rather than
      verified revenue resilience.
    diligencePath: Request cohort retention tables and renewal waterfalls by plan, segment, and geography from Aurora management.
    relatedQuestionRefs:
      - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-customer revenue share, top-financing-partner exposure, and state-level exposure to bankrupt or distressed
      installers.
    whyItMatters: >-
      Aurora's base appears concentrated in U.S. residential installers and lenders, but public evidence does not show
      whether any single partner or account is material.
    diligencePath: >-
      Request ARR by top 10 customers, lender-partner mix, and churn or write-off exposure tied to bankrupt installers
      or paused financing partners.
    relatedQuestionRefs:
      - QU025
  - type: private-evidence-only
    severity: minor
    topic: international-mix
