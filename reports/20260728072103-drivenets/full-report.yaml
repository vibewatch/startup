  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Incumbent Router Landscape: Cisco, Juniper, Nokia, and the Installed-Base Problem'
        blocks:
          - type: paragraph
            body: >-
              The most important competitive fact is that DriveNets is not trying to sell into a vacuum. Cisco, Juniper,
              and Nokia all continue to market very large, 800G-capable routing platforms with integrated software,
              support, security, and automation. Cisco positions the 8000 family around Silicon One, density,
              sustainability, and support, with systems scaling to more than 500 Tbps. Juniper’s PTX line is explicitly
              marketed as AI-era routing with 800GE, automation, and security. Nokia’s 7750 SR family similarly pitches
              deterministic performance, integrated security, and high-density 800GE scaling. In carrier buying
              committees, these vendors benefit from long procurement history, known support models, and the
              organizational convenience of an integrated stack. DriveNets’ counter-position is that standard white
              boxes plus DNOS or AI Fabric break vendor lock and scale more flexibly, but that advantage is strongest
              only when the buyer is willing to trade operational familiarity for long-run economics and flexibility.
              The incumbent field therefore remains both the reference point and the hardest source of inertia in nearly
              every telecom opportunity.
            claimRefs:
              - CP001
              - CP002
