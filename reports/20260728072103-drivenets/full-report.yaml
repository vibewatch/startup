      - number: '8.3'
        title: Scenario Logic and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The bull/base/bear logic follows directly from that comp spread. The bull case assumes DriveNets can turn
              telecom lighthouse credibility into a broader AI-infrastructure platform, win enough named AI customers to
              reduce concentration anxiety, and convert its secured business into revenue at margins that still deserve
              a premium multiple. The bear case assumes the business is real but more services-heavy,
              customer-concentrated, and inventory-sensitive than the premium narrative implies. The base case sits
              between them: a real company, a real opportunity, and a real chance that the 2026 valuation will prove
              fair later—but only if a set of private metrics turns out to be stronger than the public evidence can
              currently verify. That is why entry discipline matters. Publicly, the goal should not be to overfit one
              heroic comp. It should be to protect against paying an Arista-like price for a business that may still
              convert like a Cisco/Ciena-style infrastructure vendor. The evidence today is good enough to watch
              closely, but not good enough to suspend underwriting standards.
            claimRefs:
              - CV024
              - CV025
              - CV026
