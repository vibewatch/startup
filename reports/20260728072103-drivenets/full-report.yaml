      - number: '8.2'
        title: Public Comp Framework and Revenue Required
        blocks:
          - type: paragraph
            body: >-
              Public comps are helpful here not because they are perfect matches, but because they show how much revenue
              scale public markets require before an $8.5 billion valuation looks routine. Arista is the most generous
              benchmark in this set: it combines networking relevance with premium growth and software-market esteem,
              and even then its 2026 P/S ratio implies that DriveNets would need roughly $384 million of annual revenue
              to justify today’s mark on similar terms. Cisco, Ciena, and Nokia imply far larger required revenue
              bases—roughly $1.14 billion, $886 million, and nearly $3.9 billion respectively. That wide spread is the
              whole valuation problem in one table. If DriveNets is truly becoming the Arista of open AI-and-telecom
              infrastructure, the current price may eventually look fair. If it behaves more like a systems-heavy,
              support-intensive network vendor, the burden of proof becomes much steeper. Because recognized revenue is
              not public, comp work here cannot conclude with precision; it can only frame what scale would need to be
              true.
