  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: From High-End Routing to Open Ethernet AI Fabrics'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define DriveNets’ market is not “networking” in the abstract but two concrete buying
              domains that share a common architecture problem. The first is the high-end router and aggregation market
              serving service-provider cores, edges, peering nodes, broadband backhaul, and cloud backbones. Dell’Oro
              describes this market as large-scale routing and aggregation platforms bought by telecom operators, cloud
              providers, enterprises, and public entities when bandwidth, IP scale, and service capabilities become
              critical. The second domain is AI-cluster networking, where the buyer is no longer just a carrier
              transport team but also a hyperscaler, NeoCloud, foundation-model lab, or enterprise building
              high-performance multi-tenant GPU clusters. DriveNets’ thesis is that the same disaggregated,
              merchant-silicon, software-centric design can address both domains. That creates a broader surface than a
              single-product router replacement story, but it also means the company competes against entrenched router
              incumbents in one segment and vertically integrated AI infrastructure stacks in another. Market boundary
              clarity matters because telecom routing refresh and AI-fabric buildout move on different procurement
              cycles, use different proof points, and tolerate different levels of operational change.
            claimRefs:
