  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: strong proof and strong narrative are visible, but the valuation
      denominator is still private, so entry discipline stays cautious.
    data:
      nodes:
        - id: proof
          label: Customer and financing proof
          detail: AT&T, Comcast, KDDI, WhiteFiber, Series D, cash-flow-positive signal
          tone: positive
        - id: upside
          label: AI and platform upside
          detail: Heterogeneous AI, scale-across, broader TAM, partner ecosystem
          tone: positive
        - id: opacity
          label: Revenue / margin opacity
          detail: No public revenue, gross-margin, or concentration bridge
          tone: warning
        - id: price
          label: $8.5B current price
          detail: Requires stronger denominator confidence than public sources provide
          tone: warning
        - id: watch
          label: Watch recommendation
          detail: Real business, but not enough disclosed to support invest now
          tone: negative
      edges:
        - from: proof
          to: upside
        - from: upside
          to: opacity
        - from: opacity
          to: price
        - from: price
          to: watch
    claimRefs:
