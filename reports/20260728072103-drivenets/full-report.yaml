      - number: '7.2'
        title: Operational, Technical, and AI Governance Risk
        blocks:
          - type: paragraph
            body: >-
              The company’s biggest operating risks come from the same choices that make the platform attractive.
              Disaggregation shifts complexity away from proprietary chassis and into orchestration, testing, support,
              and integration. DNOR is explicitly meant to absorb that complexity by providing bootstrapping, upgrades,
              alarms, RCA, and single-entity control, but that also means DriveNets becomes the control-plane trust
              anchor for deployments composed of many moving parts. The AI layer adds a second multiplier. The AI
              Platform Software Engineer role describes multi-agent systems, RAG pipelines, MCP servers, Kubernetes,
              tracing, evaluation, and safety features in production. That is a sophisticated signal, but it also means
              the company is taking on agentic-system governance inside environments where customers care about uptime,
              latency, and failure isolation. Public evidence names mitigations like support, training, and operations
              tooling, yet it still does not disclose the reliability, incident-rate, or security-architecture evidence
              an outsider would ideally want. For a company selling into mission-critical networks, that gap should be
              treated as material rather than cosmetic.
            claimRefs:
              - CR007
              - CR008
