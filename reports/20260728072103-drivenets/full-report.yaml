      - number: '2.4'
        title: 'Adoption Constraints: Skills, Operational Change, and Incumbent Staying Power'
        blocks:
          - type: paragraph
            body: >-
              The strongest reason not to overstate the market is that disaggregation adoption is not gated only by
              technical merit. The IEEE ComSoc summary of RtBrick survey data is a useful adverse lens because it shows
              how much institutional friction still surrounds open networking: 93% of respondents reported insufficient
              leadership support, 42% pointed to operational-transformation complexity, 38% cited specialist-skill
              shortages, and 81% said their current architectures are not well suited to future bandwidth growth.
              SDxCentral’s AT&T coverage adds operator-specific texture, noting that some vendors initially dragged
              their feet and that legacy compatibility was a real early challenge. The incumbent field also remains
              powerful. Cisco, Juniper, and Nokia are all refreshing massive 800G-capable routing portfolios and
              wrapping them in security, automation, and support narratives designed to preserve trust in integrated
              stacks. That means DriveNets is not simply selling into an empty white-box greenfield. It is asking buyers
              to unlearn process, reorganize supply chains, and accept more integration responsibility in exchange for
              lower long-run cost and higher flexibility. Public evidence supports the existence of a very large
              opportunity, but not the assumption that the whole opportunity converts quickly or evenly across buyer
              classes.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
