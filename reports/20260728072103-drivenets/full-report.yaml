companyProfile:
  summary: >-
    DriveNets is an Israeli network-infrastructure company founded in 2015 by Ido Susan and Hillel Kobrinsky. The
    company sells a cloud-native network operating system and related AI-fabric software that run on standard white-box
    hardware rather than proprietary router chassis. Public evidence supports meaningful lighthouse traction with AT&T,
    Comcast, KDDI, and WhiteFiber, plus a June 2026 Series D that priced the business at $8.5 billion. The strategic
    story is strong, but audited revenue quality and concentration data remain private.
