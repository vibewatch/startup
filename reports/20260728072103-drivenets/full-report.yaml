      - number: '1.2'
        title: Founders, Leadership Depth, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The founder-market-fit story is unusually strong for a deep infrastructure startup. Ido Susan previously
              co-founded Intucell, which Cisco acquired in 2013, and Hillel Kobrinsky previously founded Interwise,
              which AT&T acquired; both backgrounds are directly relevant to telecom software and carrier selling.
              Public round announcements, trade coverage, and profile databases consistently describe Susan as CEO and
              Kobrinsky as co-founder or chief strategy officer, while the company still appears to rely heavily on
              founder-led narrative when explaining both telecom disaggregation and heterogeneous AI. Leadership depth
              beyond the founders is visible but not fully transparent. DriveNets has public evidence of regional
              expansion, operations hiring, ecosystem partnerships, and dedicated AI engineering, which implies a much
              more mature operating bench than an early-stage startup, yet the current board roster, committee
              structure, and governance rights after the 2025 secondary and 2026 financing remain opaque. That opacity
              matters because DriveNets has now raised close to $1 billion of primary capital and supported a very large
              liquidity event through AT&T’s secondary purchase, but outside investors still cannot independently
              reconstruct present control rights from public materials alone.
