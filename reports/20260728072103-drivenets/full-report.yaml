      - number: '1.3'
        title: Funding History, Secondary Liquidity, and Milestone Record
        blocks:
          - type: paragraph
            body: >-
              DriveNets’ financing history is clearer than many late-stage private infrastructure companies, but it
              still requires careful separation between primary funding, secondary liquidity, and unofficial valuation
              chatter. Official company releases support a $110 million Series A in 2019, a $208 million Series B in
              2021, a $262 million Series C in 2022, and a $410 million Series D in June 2026. Tracxn and the latest
              company release both place lifetime primary funding at roughly $1.0 billion. Independent Israeli coverage
              adds two consequential layers: first, AT&T bought about $650 million of shares from employees and
              investors in July 2025, creating meaningful liquidity without putting new cash on the company balance
              sheet; second, Calcalist reported that the June 2026 round valued DriveNets at $8.5 billion, while
              Reuters-syndicated coverage said the company did not disclose the post-money valuation officially. The
              operational milestones are as important as the financing chronology. Public evidence ties the company to
              AT&T production deployment from 2020, more than 52% of AT&T core traffic by early 2023, KDDI commercial
              deployment in 2023, Orange live-core testing in early 2025, Comcast’s Janus expansion in March 2025,
              WhiteFiber AI-fabric deployment in May 2025, and AMD reference-architecture publication in July 2026.
