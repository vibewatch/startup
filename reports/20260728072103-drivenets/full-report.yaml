  - id: FR001
    title: Risk heatmap
    type: quadrant
    layout: standard
    summary: >-
      The highest-severity public risks combine large-customer concentration, multivendor delivery complexity, and
      AI-governance exposure in critical infrastructure contexts.
    data:
      xAxis: Likelihood (low=1, high=10)
      yAxis: Severity (low=1, high=10)
      points:
        - label: Customer concentration
          x: 7
          'y': 9
          detail: Few lighthouse accounts carry outsized narrative and likely revenue weight
        - label: Partner / silicon dependency
          x: 7
          'y': 8
          detail: Open model depends on many ecosystem pieces staying aligned
        - label: AI-governance / automation failure
          x: 6
          'y': 9
          detail: Agentic tooling in infrastructure operations can fail in high-impact ways
        - label: Legal / privacy mismatch
          x: 5
          'y': 7
          detail: Policies exist, but operational compliance quality is not public
        - label: General demand risk
          x: 3
          'y': 5
