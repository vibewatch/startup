  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base, Buyer Map, and Segment Reality
        blocks:
          - type: paragraph
            body: >-
              DriveNets does not sell to a mass self-serve user base; it sells into infrastructure buying centers where
              the actual users are network-operations, architecture, and platform teams inside very large organizations.
              Publicly visible segments now span four buckets: service providers, hyperscalers, NeoClouds/GPUaaS
              operators, and enterprises building AI infrastructure. The named proof is strongest in telecom, where
              AT&T, Comcast, KDDI, and Orange together show the company can land tier-1 operators at multiple stages of
              adoption. The buyer-versus-user distinction matters here. At AT&T or Comcast, the buyer is a network
              leadership or architecture function, the operator is an internal engineering team, and the end beneficiary
              is the subscriber or enterprise customer consuming bandwidth and reliability. In AI deployments, the
              likely buyer is an infrastructure or platform team optimizing GPU utilization, while the end beneficiary
              may be a model-building organization or downstream customer. That structure makes customer concentration
              more dangerous than account count alone suggests, because each named win can be very large, strategic, and
              slow-moving.
