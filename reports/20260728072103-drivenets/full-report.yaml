  - id: FR002
    title: Risk transmission map
    type: flow
    layout: wide
    summary: >-
      Most downside paths start in ecosystem or execution complexity and propagate into customer trust, backlog
      conversion, and valuation credibility.
    data:
      nodes:
        - id: ecosystem
          label: Partner / silicon issue
          detail: Supplier, partner, or integration slippage appears
