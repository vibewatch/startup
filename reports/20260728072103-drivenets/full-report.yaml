chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Architecture Thesis, and What DriveNets Actually Sells
        blocks:
          - type: paragraph
            body: >-
              DriveNets positions itself as a networking software vendor rather than as another proprietary-router OEM.
              The core product is DNOS, a cloud-native network operating system that runs on commodity white-box
              hardware and abstracts clusters of packet-forwarding boxes into one logical routing system. That
              architectural choice matters because it attacks two pain points incumbent telecom and cloud buyers
              repeatedly describe: vendor lock-in and the economic mismatch between traffic growth and router cost. The
              company now extends the same disaggregated-control philosophy into AI fabrics, arguing that the network
              has become the bottleneck for large GPU clusters and that open Ethernet can outperform closed
              single-vendor stacks when the software layer optimizes the whole path. Official materials and independent
              coverage are aligned on the identity basics: DriveNets was founded in 2015, is based in Ra’anana, Israel,
              is led by co-founder and CEO Ido Susan, and serves service providers, cloud operators, and increasingly
              AI-infrastructure builders. The evidence does not support a simplistic “software-defined router” label
              alone; the commercial story is a broader one about replacing closed integrated systems with software plus
              merchant-silicon building blocks that can scale from telecom core routing to AI cluster fabrics.
