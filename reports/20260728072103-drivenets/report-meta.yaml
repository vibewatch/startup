companyProfile:
  summary: >-
    DriveNets is an Israeli network-infrastructure company founded in 2015 by Ido Susan and Hillel
    Kobrinsky. The company sells a cloud-native network operating system and related AI-fabric
    software that run on standard white-box hardware rather than proprietary router chassis. Public
    evidence supports meaningful lighthouse traction with AT&T, Comcast, KDDI, and WhiteFiber, plus
    a June 2026 Series D that priced the business at $8.5 billion. The strategic story is strong,
    but audited revenue quality and concentration data remain private.
  founders:
    - name: Ido Susan
      role: Co-founder and Chief Executive Officer
      background: Previously co-founded Intucell, which Cisco acquired in 2013.
      claimRefs: [CO003, CO011]
    - name: Hillel Kobrinsky
      role: Co-founder
      background: Previously founded Interwise, which AT&T acquired.
      claimRefs: [CO004, CO012]
  foundingLocation: Israel
  headquarters: Ra'anana, Israel
  productSummary: >-
    DriveNets sells DNOS / Network Cloud software for disaggregated routing plus Ethernet-based AI
    fabric software, using merchant-silicon white boxes, multi-vendor integration, and cloud-style
    scale-out operations.
  customerFocus: >-
    Tier-1 telecom operators, hyperscalers, NeoClouds, and large AI builders that need core
    routing, backbone modernization, or high-performance Ethernet fabric.
  businessModel: >-
    Infrastructure software plus deployment and support economics: customers buy DriveNets software
    and network-cloud architecture on commodity hardware, then expand through multiyear rollouts and
    operational support.
  stage: Late-stage private infrastructure company (Series D)
  fundingStatus: >-
    DriveNets raised a $410 million Series D in June 2026 at an $8.5 billion valuation, bringing
    total primary capital raised to roughly $1 billion after earlier Series A, B, and C financings.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO007, CO010, CO011, CO012, CV001, CV002, CV003, CU002]
summary:
