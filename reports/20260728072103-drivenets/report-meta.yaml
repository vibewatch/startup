  topStrengths:
    - Public sources support unusually strong lighthouse proof for a private infrastructure vendor, including AT&T, Comcast, KDDI, and WhiteFiber.
    - DriveNets has credible product breadth across disaggregated carrier routing and newer AI-fabric workloads on white-box hardware.
    - The company paired a $410M Series D with claims of cash-flow positivity and $1B+ secured business, signaling real commercial momentum.
  topRisks:
    - Public evidence still does not disclose recognized revenue, gross margin, or customer concentration by revenue.
    - The current $8.5B mark already assumes economics closer to a premium network platform than a support-heavy infrastructure vendor.
    - A small set of lighthouse customers and ecosystem partners likely drive a disproportionate share of present proof and downside risk.
    - AI upside is visible, but named customer breadth and repeatability remain less transparent than the narrative suggests.
  unresolvedGaps:
    - Revenue by segment, gross margin, and backlog-conversion timing are not publicly disclosed.
    - Top-customer concentration, renewals, and expansion economics remain private.
    - Named production AI customer breadth beyond WhiteFiber is still thin in public evidence.
    - Preference stack, dilution history, and current balance-sheet detail are not publicly available.
