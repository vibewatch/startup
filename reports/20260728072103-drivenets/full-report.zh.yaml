      - number: '1.2'
        title: 创始人、管理层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              作为深层基础设施创业公司，DriveNets 的创始人与市场匹配度异常强。Ido Susan 此前联合创立 Intucell，Cisco 于 2013 年收购了该公司；Hillel Kobrinsky 此前创立
              Interwise，AT&T 后来收购了该公司。两段履历都直接指向电信软件与运营商销售。公开融资公告、行业报道和画像数据库一致把 Susan 描述为 CEO，把 Kobrinsky
              描述为联合创始人或首席战略官；公司解释电信解耦和异构 AI 时，仍明显依赖创始人主导的叙事。创始人之外的管理层厚度能看到一些轮廓，但透明度不够。公开证据显示 DriveNets
              在区域扩张、运营招聘、生态伙伴和专门 AI 工程上都有动作，说明运营班底远比早期创业公司成熟；但 2025 年二级交易和 2026
              年融资之后，现任董事会名单、委员会结构和治理权利仍不透明。这种不透明很关键：DriveNets 已累计募集接近 10 亿美元一级资本，还通过 AT&T
              的二级购买支撑了一场很大的流动性事件，但外部投资者仍无法仅靠公开材料独立还原当前控制权安排。
