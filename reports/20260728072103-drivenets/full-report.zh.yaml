  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础、买方地图与细分现实
        blocks:
          - type: paragraph
            body: >-
              DriveNets 不面向大众自助用户销售，而是卖进基础设施采购中心；真实用户是大型组织内部的网络运维、架构和平台团队。公开可见的细分如今有四类：服务提供商、超大规模云厂商、NeoCloud / GPUaaS
              运营商，以及建设 AI 基础设施的企业。具名证明在电信最强，AT&T、Comcast、KDDI 和 Orange 合在一起显示，公司可以在多个采用阶段拿下一级运营商。买家与用户的区别在这里很重要。在 AT&T 或
              Comcast，买家是网络领导层或架构职能，运营方是内部工程团队，最终受益者是消费带宽和可靠性的用户或企业客户。AI 部署中，买家可能是优化 GPU
              利用率的基础设施或平台团队，最终受益者则可能是模型建设组织或下游客户。这种结构让客户集中度比单纯账户数量显示的更危险，因为每一个具名胜利都可能很大、很战略、移动很慢。
