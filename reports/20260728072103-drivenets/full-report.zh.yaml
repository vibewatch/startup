              DriveNets 的护城河一部分来自技术，一部分来自组织。技术侧，公司与 AT&T 及其他运营商有多年现场验证，这很重要，因为大型运营商不会轻易更换骨干架构。组织侧，公司依赖围绕商用芯片、白盒
              ODM、集成商和渠道的伙伴生态。KDDI、Radisys、Dell、Accton 和 AMD 等关系都改善了市场进入能力，但也意味着公司不像 Cisco 或 Nvidia
