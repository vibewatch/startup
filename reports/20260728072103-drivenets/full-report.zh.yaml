      - number: '1.4'
        title: 规模信号、员工数代理指标与主要未解问题
        blocks:
          - type: paragraph
            body: >-
              规模信号已经足以说明 DriveNets 不再只是一个愿景式解耦故事，但对承销最关键的信息仍不完整。最强的公开规模信号来自客户和部署证明：AT&T、Comcast、KDDI、Orange 与 WhiteFiber
              都公开关联到生产部署、试点或战略用例；DriveNets 称 AT&T 与 Comcast 合计承载美国互联网总流量超过 30%。2026 年 Series D 公告还称，公司自 2025
              年起现金流为正，已锁定业务超过 10 亿美元；对仍为私营公司的基础设施厂商来说，这两个信号都不常见。员工数据方向一致，但并不完全对齐：Calcalist 2025 年 7 月报道为 450 名员工加 100
              个开放岗位；Revelio 估计 2026 年 3 月全球 607 人；Tracxn 显示 2026 年 6 月下旬为 574 人。共同结论不是精确人数，而是业务形态：DriveNets
              已是数百人规模的全球公司，工程重心在以色列，仍在积极招聘，并且有真实现场部署足迹。未解问题同样重要。公开来源仍未披露官方 2026 年投后估值条款、收入组合、毛利率、现任董事会构成，也没有披露据称验证 AI
              Fabric 扩张的具名超大规模云客户。
