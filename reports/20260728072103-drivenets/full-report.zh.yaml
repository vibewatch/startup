  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐逻辑很简单：强证据和强叙事都看得见，但估值分母仍未公开，因此入场纪律仍需谨慎。
    data:
      nodes:
        - id: proof
          label: 客户和融资证据
          detail: AT&T、Comcast、KDDI、WhiteFiber、Series D、现金流为正信号
          tone: positive
        - id: upside
          label: AI 和平台上行空间
          detail: 异构 AI、scale-across、更大 TAM、合作伙伴生态
          tone: positive
        - id: opacity
          label: 收入 / 利润率不透明
          detail: 没有公开收入、毛利率或客户集中度拆解
          tone: warning
        - id: price
          label: $8.5B 当前价格
          detail: 需要比公开来源更强的分母信心
          tone: warning
        - id: watch
          label: 观察建议
          detail: 业务真实，但披露不足以支撑现在投资
          tone: negative
      edges:
        - from: proof
          to: upside
        - from: upside
          to: opacity
        - from: opacity
          to: price
        - from: price
          to: watch
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV008
      - CV028
      - CV033
      - CV034
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 上市网络设备公司的估值倍数意味着，DriveNets 要支撑 $8.5B 估值，所需收入水平可能差异很大。
    data:
      items:
        - label: Arista 类 22.14x 倍数
          value: 384
          detail: 所需年收入，单位为百万美元
        - label: Ciena 类 9.59x 倍数
          value: 886
          detail: 所需年收入，单位为百万美元
        - label: Cisco 类 7.43x 倍数
          value: 1144
          detail: 所需年收入，单位为百万美元
        - label: Nokia 类 2.17x 倍数
          value: 3917
          detail: 所需年收入等效值，单位为百万美元
    claimRefs:
