      - number: '8.4'
        title: 建议、置信度与尽调关口
        blocks:
          - type: paragraph
            body: >-
              仅基于公开信息，合适建议是观察，置信度中等，估值立场偏紧。这个案子太强，不能条件反射式放弃：客户验证真实，技术差异化有可能成立，AI 上行也不是想象。但以当前估值给出投资建议，信息又太不完整，因为公司仍未披露决定
              $8.5B 估值究竟是克制还是亢奋的关键变量。缺失清单很直接：分部收入、毛利率、积压订单转化、头部客户集中度，以及 AI 客户群已具名的广度。如果这些指标被证明强劲，2026
              年这一轮或许会显得有先见之明，而不是昂贵。如果它们令人失望，回头看当前价格就会显得饱满。因此，观察姿态不是犹豫不决；它是在承认 DriveNets 是当前以色列和 AI
              网络赛道中更可信的后期基础设施故事之一的同时，维持估值纪律。
