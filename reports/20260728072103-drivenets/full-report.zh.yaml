  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与治理暴露面
        blocks:
          - type: paragraph
            body: >-
              DriveNets 不是消费应用，但公开法律暴露面仍然重要，因为公司处理支持互动、营销数据和全球招聘，同时越来越多地把 AI
              赋能基础设施推向关键网络环境。网站隐私政策、使用条款和招聘隐私通知合在一起，显示它已有有意义的合规足迹。文件提到多种数据收集方式、特定第三方平台、支持和账户功能、自动访问限制，以及横跨以色列、美国、英国、德国、印度、加拿大和日本的多实体集团结构。方向上这是好事，说明公司没有忽视法律基础。它也是风险，因为组织扩张后，跨境数据处理和雇佣运营会变得更难。FTC
              隐私指南进一步抬高门槛，明确隐私承诺和安全预期可以被执行；NIST 2026 年 AI RMF 工作也强调，关键基础设施里的 AI 赋能能力需要明确的风险管理。问题不是 DriveNets
              缺少政策文件；而是政策存在比运营合规质量更容易被公开验证。
