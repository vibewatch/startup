      - number: '8.2'
        title: 上市可比框架与所需收入
        blocks:
          - type: paragraph
            body: >-
              上市可比公司在这里有用，不是因为它们完美匹配，而是因为它们显示：公开市场要看到多大收入规模，才会把 $8.5B 估值视为常规。Arista
              是这组里最宽松的基准：它既有网络相关性，也有高增长和软件市场溢价；即便如此，按其 2026 年 P/S 倍数推算，DriveNets 也需要约 $384M
              年收入，才能在类似条件下支撑今天的估值。Cisco、Ciena 和 Nokia 隐含的收入基数大得多，分别约为 $1.14B、$886M 和接近 $3.9B。这个巨大跨度，就是整张表里的估值问题。如果
              DriveNets 真的在成为开放 AI 与电信基础设施里的
              Arista，当前价格最终可能显得合理。如果它更像一家系统重、支持密集的网络供应商，举证门槛就会陡得多。确认收入未公开，可比分析无法给出精确结论；它只能框出需要成真的规模。
