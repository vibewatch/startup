  - id: FU004
    title: 留存 / 复购队列
    type: range
    layout: standard
    summary: 公开留存只能从关系加深中推断，而不是靠收入指标判断；因此最干净的边界是按阶段划分，而不是按百分比划分。
    data:
      items:
        - label: AT&T 关系成熟度指数
          low: 8
          mid: 9
          high: 10
          unit: /10
        - label: Comcast 关系成熟度指数
          low: 6
          mid: 7
          high: 8
          unit: /10
        - label: KDDI 关系成熟度指数
          low: 5
          mid: 6
          high: 7
          unit: /10
        - label: 已点名 AI 客户多元化指数
          low: 2
          mid: 3
          high: 4
          unit: /10
    approximationNotes: 这些是根据公开关系推进推导出的定性阶段分数，不是披露的留存率或 NRR 数据。
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU030
      - CU036
  - id: FR001
    title: 风险热力图
    type: quadrant
    layout: standard
    summary: 公开信息中严重度最高的风险，把大客户集中、多供应商交付复杂度，以及关键基础设施场景中的 AI 治理暴露叠在一起。
    data:
      xAxis: 可能性（低=1，高=10）
      yAxis: 严重度（低=1，高=10）
      points:
        - label: 客户集中
          x: 7
          'y': 9
          detail: 少数灯塔账户承载过高的叙事权重，也很可能承载过高收入权重
        - label: 合作伙伴 / 芯片依赖
          x: 7
          'y': 8
          detail: 开放模型要靠生态中许多环节持续对齐
        - label: AI 治理 / 自动化失败
          x: 6
          'y': 9
          detail: 基础设施运营中的智能体工具可能以高影响方式失效
        - label: 法律 / 隐私错配
          x: 5
          'y': 7
          detail: 政策存在，但运营合规质量并未公开
        - label: 一般需求风险
          x: 3
          'y': 5
          detail: 需求看起来真实；更大的风险是交付质量，而不是没有兴趣
    claimRefs:
      - CR005
      - CR006
      - CR013
      - CR021
      - CR027
      - CR031
      - CR034
  - id: FR002
    title: 风险传导图
    type: flow
    layout: wide
    summary: 多数下行情景始于生态或执行复杂度，并传导到客户信任、积压订单转化和估值可信度。
    data:
      nodes:
        - id: ecosystem
          label: 合作伙伴 / 芯片问题
          detail: 供应商、合作伙伴或集成进度出现滑坡
          tone: warning
        - id: delivery
          label: 部署或支持压力
          detail: 现场团队和编排层承受更重负载
          tone: warning
        - id: customer
          label: 客户信任受损
          detail: 大型灯塔客户经历延误或结果不及预期
          tone: negative
        - id: backlog
          label: 积压订单转化放慢
          detail: 收入确认时点和扩张假设变弱
          tone: negative
        - id: valuation
          label: 叙事与估值收缩
          detail: 公开故事变得更难站住
          tone: negative
      edges:
        - from: ecosystem
          to: delivery
        - from: delivery
          to: customer
        - from: customer
          to: backlog
        - from: backlog
          to: valuation
    claimRefs:
      - CR016
      - CR022
      - CR023
      - CR024
      - CR025
      - CR030
  - id: FR003
    title: 依赖关系图
    type: matrix
    layout: wide
    summary: DriveNets 必须同时协调法律、软件、合作伙伴和客户依赖；没有任何单一层承载全部风险。
    data:
      columns:
        - 法律 / 隐私
        - AI 治理
        - 芯片 / ODM
        - 计算 / 系统伙伴
        - 客户灯塔
