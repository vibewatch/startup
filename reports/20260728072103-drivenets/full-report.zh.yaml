      - number: '1.3'
        title: 融资历史、二级流动性与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              DriveNets 的融资历史比许多后期私营基础设施公司更清楚，但仍要把一级融资、二级流动性和非官方估值传闻分开看。公司官方稿件支持以下节点：2019 年 1.10 亿美元 Series A 轮，2021 年
              2.08 亿美元 Series B 轮，2022 年 2.62 亿美元 Series C 轮，以及 2026 年 6 月 4.10 亿美元 Series D 轮。Tracxn 与公司最新公告都把累计一级融资放在约
              10 亿美元。以色列独立报道补了两层重要信息：第一，AT&T 于 2025 年 7 月从员工和投资者手中买入约 6.50
              亿美元股份，给股东带来有意义的流动性，但没有给公司资产负债表注入新现金；第二，Calcalist 报道 2026 年 6 月轮次把 DriveNets 估到 85 亿美元，而 Reuters
              辛迪加报道则称公司没有正式披露投后估值。运营里程碑与融资时间线同样重要。公开证据把公司与一串节点连在一起：2020 年 AT&T 生产部署，2023 年初 AT&T 核心流量超过 52%，2023 年 KDDI
              商业部署，2025 年初 Orange 现网核心测试，2025 年 3 月 Comcast 的 Janus 扩张，2025 年 5 月 WhiteFiber AI Fabric 部署，以及 2026 年 7 月
              AMD 参考架构发布。
