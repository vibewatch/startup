      - number: '8.3'
        title: 情景逻辑与入场纪律
        blocks:
          - type: paragraph
            body: >-
              牛市、基准、熊市逻辑直接来自这组可比公司的跨度。牛市情景假设 DriveNets 能把电信灯塔客户可信度转成更广的 AI 基础设施平台，赢下足够多已具名 AI
              客户以降低集中度焦虑，并把已锁定业务转成收入，同时保持足以配得上溢价倍数的利润率。熊市情景假设业务是真实的，但服务更重、客户更集中、对库存更敏感，超过溢价叙事所暗示的水平。基准情景介于两者之间：公司真实，机会真实，2026
              年估值也确有可能日后被证明合理——但前提是一组私有指标比当前公开证据能验证的更强。因此，入场纪律很重要。公开信息下，目标不应是过度拟合某一个英雄式可比公司，而应防止为一家转换模式仍可能像 Cisco/Ciena
              式基础设施供应商的公司，支付 Arista 式价格。今天的证据足以让人密切跟踪，但还不足以暂停承销标准。
