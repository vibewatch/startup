  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Network Cloud 核心架构与产品模块
        blocks:
          - type: paragraph
            body: >-
              DriveNets 的产品面比一套路由器操作系统更宽。公开产品材料显示，栈里至少有四个核心层：白盒硬件构件、作为网络操作系统的 DNOS、作为编排与生命周期层的 DNOR，以及包裹部署和运维的服务 /
              支持。架构论点是让标准硬件集群表现得像一个单一的大规模路由或 AI 网络系统。所以白盒页面聚焦 NCP 与 NCF 构件，DNOR
              页面则强调单一实体管理、零接触开通、生命周期升级和拓扑可见性。结果不是简单的开放硬件加软件，而是在保留解耦带来的供应链灵活性和扩展优势的同时，尽量复制单体机箱的运营简单性。IP/MPLS
              案例补了一个重要实施线索：DNOS 被描述为基于微服务的软件，绑定 x86 控制平面资源和集群化转发元素。这更像真正的云原生运营模型，而不是把旧路由软件简单移植到通用盒子上。
