      - number: '2.2'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比标准企业软件销售更复杂，因为出资决策者、技术用户和运营负责人往往不是同一批人。电信场景里，经济买家通常是 CTO 或网络基础设施预算负责人；用户是核心传输、IP、自动化和运维工程师；成功指标是每 bit
              传输成本更低、专有限制更少。APAC 与 KDDI 案例显示，当电力、机架空间和容量扩张压力足够高时，互联网网关、对等互联和骨干网团队愿意试用或部署解耦式路由。AI
              场景里，买家画像转向基础设施工程、平台和数据中心团队；他们更关心 GPU 利用率、作业完成时间、多租户能力和部署速度，而不是 MPLS 路由规模。Dell AI Factory、WhiteFiber、Accton
              以及 AMD 关联材料都指向这一第二类买家。用户仍是基础设施工程师，但工作流已经变成集群启动、拥塞调优、编排，以及存储 /
              后端融合。两个市场中，付款方都位于日常用户上游；只有平台证明经济或运营收益大到足以抵消集成负担时，采用才会发生。
