        title: AI Fabric 工作流与运营模型
        blocks:
          - type: paragraph
            body: >-
              AI 产品故事把同一套软件定义姿态延伸到一个更新、买方要求不同的领域。公开 AI 页面称 DriveNets AI Fabric 覆盖
              scale-up、scale-out、scale-across、前端与存储网络，并提供 Fabric 调度和端点调度两种以太网形态。硬件 - 软件 - 服务打包很明确：方案点名交换机、NIC 选择、DNOS 与
