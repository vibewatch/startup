      - CV018
      - CV019
      - CV020
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 只看公开资料，回报逻辑与其说取决于精确上行空间，不如说取决于 DriveNets 最终拿到溢价倍数，还是基础设施式倍数。
    data:
      items:
        - label: 当前 / 历史估值桥（USD B）
          low: 5
          mid: 6.75
          high: 8.5
        - label: 上市可比公司 P/S 区间
          low: 2.17
          mid: 9.59
          high: 22.14
        - label: 隐含证据可信度
          low: 3
          mid: 5
          high: 7
          unit: /10
    approximationNotes: 第一行覆盖 2025 年二级交易和 2026 年融资两个参考点；第二行覆盖上市可比公司区间；第三行是证据质量的序数评分。
    claimRefs:
      - CV001
      - CV005
      - CV014
      - CV016
      - CV035
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 这些具体指标会最快上调或下调观察立场。
    data:
      items:
        - label: 收入披露质量
          value: Low
          detail: 目前没有公开的分部收入拆解
          tone: warning
        - label: 客户证据质量
          value: High
          detail: AT&T、Comcast、KDDI 和 WhiteFiber 构成异常强的客户名单
          tone: positive
        - label: AI 广度透明度
          value: Mixed
          detail: AI 机会看得见，但已点名客户广度看不见
          tone: warning
        - label: 利润率可见度
          value: Low
          detail: 毛利率和贡献利润率仍未公开
          tone: negative
        - label: 估值纪律信号
          value: Watch
          detail: 公司很强，价格很贵，分母不完整
          tone: warning
        - label: 下一步尽调解锁项
          value: Segment revenue + concentration
          detail: 这两个指标会最快改变答案
          tone: positive
    claimRefs:
      - CV007
      - CV008
      - CV028
      - CV029
      - CV033
      - CV034
      - CV036
