chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: DriveNets 的身份、架构论点与实际销售内容
        blocks:
          - type: paragraph
            body: >-
              DriveNets 把自己定位成网络软件厂商，而不是另一家专有路由器 OEM。核心产品 DNOS
              是一套云原生网络操作系统，跑在通用白盒硬件上，把成组的包转发设备抽象成一个逻辑路由系统。这种架构选择之所以重要，是因为它直击电信与云买家反复提到的两个痛点：厂商锁定，以及流量增长与路由器成本之间的经济错配。公司如今把同一套解耦控制理念延伸到
              AI Fabric，认为网络已经成为大型 GPU 集群的瓶颈；只要软件层优化全路径，开放以太网就能跑赢封闭的单一厂商栈。官方材料与独立报道在身份基础上相互印证：DriveNets 创立于 2015
              年，总部位于以色列 Ra’anana，由联合创始人兼 CEO Ido Susan 领导，服务于服务提供商、云运营商，以及越来越多的 AI
              基础设施建设方。证据不支持把它简单贴成“软件定义路由器”；更完整的商业故事，是用软件加商用芯片构件替代封闭一体化系统，并把规模从电信核心路由扩到 AI 集群 Fabric。
