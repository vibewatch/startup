  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 起步价格与市场实际在买什么
        blocks:
          - type: paragraph
            body: >-
              公开起点很清楚，尽管经济分母并不清楚。2026 年 6 月，多方来源把 DriveNets 新融资的估值定在 $8.5B，明显高于 2025 年 AT&T 老股交易隐含的约 $5B
              参考值。公司也正式声称已锁定业务超过 $1B、一级融资约 $1B，并自 2025
              年起现金流为正。这些都是严肃的后期信号。它们说明，投资人买的不是概念演示，而是一家公司：有真实部署、真实商业动能，也有足够资产负债表实力去追逐大型 AI
              机会。但市场仍在买一个分母不完整的叙事。公开来源仍未披露确认收入、毛利率、积压订单账龄，或头部客户集中度的经济口径。因此，当前价格并没有挂在一个清晰披露的收入倍数上；它挂在一种信念上：灯塔客户牵引力、电信可信度和
              AI fabric 扩张，最终能复利成比公开记录目前能证明的规模大得多的经济性。
