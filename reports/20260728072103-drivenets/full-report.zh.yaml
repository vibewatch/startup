  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：从高端路由到开放以太网 AI Fabric
        blocks:
          - type: paragraph
            body: >-
              定义 DriveNets 市场，最干净的方式不是抽象地说“网络”，而是看两个共享同一架构问题的具体采购域。第一块是高端路由与汇聚市场，服务于服务提供商核心网、边缘、对等节点、宽带回传和云骨干网。Dell’Oro
              把这一市场描述为大规模路由与汇聚平台：当带宽、IP 规模和服务能力变得关键时，电信运营商、云提供商、企业和公共实体都会采购。第二块是 AI
              集群网络，买家不再只是运营商传输团队，还包括超大规模云厂商、NeoCloud、基础模型实验室，或搭建高性能多租户 GPU 集群的企业。DriveNets
              的论点是，同一套解耦、商用芯片、软件中心的设计可以同时覆盖这两个领域。这让公司面对的市场面大于单一产品替代路由器的故事，但也意味着它在一个赛道要对抗根深蒂固的路由巨头，在另一个赛道要对抗垂直整合的 AI
              基础设施栈。市场边界必须讲清楚，因为电信路由刷新与 AI Fabric 建设采购周期不同、验证点不同、能接受的运营变化幅度也不同。
