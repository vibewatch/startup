      - number: '2.3'
        title: 增长驱动：流量、AI 利用率与开放生态经济性
        blocks:
          - type: paragraph
            body: >-
              需求驱动在运营商和 AI 基础设施证据里都看得见。运营商侧，AT&T 公开提到日流量超过 594 PB，Telstra International 提到亚太容量提升
              30%；这些数字解释了为什么运营商持续寻找比传统机箱刷新周期扩得更快的架构。TIP 的 DAR 蓝图和 KDDI 材料强化了同一点：运营商想把硬件与软件拆开，以便一块一块扩容、在厂商之间选择，并同时降低
              capex 与 opex。AI 侧，问题从传输增长转向昂贵算力闲置。DriveNets、Broadcom、Accton、AMD、Dell 和 650 Group 都把机会框定在 GPU 利用率、作业完成时间、首
              token 时间和多厂商灵活性上。2023 年 AI Fabric 发布时声称可把闲置时间最高降低 30%、总集群成本降低 10%；后续 Accton 与 AMD 关联披露又提到 32K GPU
              规模以及大型集群上的验证性能。这些说法大多来自公司关联来源，必须打折；但方向性信息一致：如果开放以太网能接近专有栈性能，同时保住买方可选择性，就能撬动未来 AI 网络支出的大份额。
