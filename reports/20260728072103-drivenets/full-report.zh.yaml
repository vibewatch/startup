      - number: '2.4'
        title: 采用约束：技能、运营变革与现有巨头韧性
        blocks:
          - type: paragraph
            body: >-
              不能高估市场的最强理由，是解耦采用不只由技术优劣决定。IEEE ComSoc 对 RtBrick 调研数据的总结提供了有用的反面视角，显示开放网络仍被大量组织摩擦卡住：93% 的受访者称领导支持不足，42%
              指向运营转型复杂度，38% 提到专业技能短缺，81% 认为现有架构不适合未来带宽增长。SDxCentral 关于 AT&T
              的报道补充了运营商层面的细节：部分厂商起初行动拖沓，旧系统兼容性也是早期真实挑战。现有巨头仍然很强。Cisco、Juniper 和 Nokia 都在刷新庞大的 800G
              路由产品组合，并用安全、自动化和支持叙事维持买家对一体化栈的信任。也就是说，DriveNets
              并不是在一片空白的白盒绿地里销售。它要求买家忘掉旧流程、重组供应链，并承担更多集成责任，以换取长期成本下降和灵活性提升。公开证据支持存在一个很大的机会，但不支持假设整个机会会在各类买家中快速、均匀地转化。
