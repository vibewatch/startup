        title: AI Fabric 竞争者与维持现状的替代方案
        blocks:
          - type: paragraph
            body: >-
              在 AI 基础设施里，比较对象不再限于路由器 OEM。买家可以继续使用标准 Ethernet Clos，选择专有 InfiniBand，采用 Nvidia Spectrum-X，评估 Arista 或 Cisco
              的以太网 AI 产品，也可以使用 DriveNets 的调度式 Fabric 方案。DriveNets 自家材料当然带有推广色彩，但很好地描出了买方对话：InfiniBand
              有基准性能，却伴随厂商锁定、存储与计算网络分离、调优开销；标准以太网灵活且便宜，但过去在拥塞管理和确定性性能上较弱；新的以太网替代方案则试图在保住开放性的同时缩小性能差距。DriveNets
              想占住“开放以太网但不严重牺牲性能”的位置。AMD、Accton、Dell 和 Broadcom 关联发布强化了这一定位，APNIC 与 UEC/TIP
              材料也说明开放以太网为什么具有战略意义。不过，这个领域比运营商路由变化更快，竞争集合并不稳定。即便 DriveNets 在架构叙事上胜出，买家仍可能偏好更简单的单一厂商套装，或基于熟悉 leaf-spine
