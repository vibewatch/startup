  topStrengths:
    - 包括 AT&T、Comcast、KDDI 和 WhiteFiber 在内，公开资料给出的灯塔客户证据很强；对私有基础设施供应商来说，这并不常见。
    - DriveNets 的产品宽度可信，覆盖解耦运营商路由，也延伸到白盒硬件上的新 AI fabric 工作负载。
    - 公司拿到 $410M Series D，同时声称现金流为正、已锁定 $1B+ 业务，商业动能确实存在。
  topRisks:
    - 公开证据仍没有披露已确认收入、毛利率或按收入计的客户集中度。
    - 当前 $8.5B 标记已经按更接近高溢价网络平台的经济性定价，而不是按支持负担更重的基础设施供应商定价。
    - 少数灯塔客户和生态伙伴很可能贡献了当前证据和下行风险的不成比例份额。
    - AI 上行空间看得见，但具名客户广度和可复制性没有叙事说得那么透明。
  unresolvedGaps:
    - 按业务分部的收入、毛利率和积压订单转化节奏未公开披露。
    - 头部客户集中度、续约和扩张经济性仍是私有信息。
    - WhiteFiber 之外，公开证据里的具名生产级 AI 客户广度仍薄。
    - 优先股堆叠、稀释历史和当前资产负债表细节没有公开。
