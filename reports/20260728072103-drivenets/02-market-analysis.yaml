- id: growth-drivers-and-expansion-tailwinds
  title: 'Growth Drivers: Traffic, AI Utilization, and Open-Ecosystem Economics'
  body: 'The demand drivers are visible in both carrier and AI infrastructure evidence. On the carrier side, AT&T’s public account of more than 594 petabytes of daily traffic and Telstra International’s 30% Asia-Pacific capacity increase show why operators keep searching for architectures that scale faster than legacy chassis refresh cycles. TIP’s DAR blueprint and the KDDI materials reinforce the same point: operators want to separate hardware from software so they can scale one block at a time, choose among vendors, and lower both capex and opex. On the AI side, the problem shifts from transport growth to expensive idle compute. DriveNets, Broadcom, Accton, AMD, Dell, and 650 Group all frame the opportunity around GPU utilization, job completion time, time to first token, and multi-vendor flexibility. The 2023 AI-fabric launch claimed up to 30% idle-time reduction and 10% total-cluster cost reduction, while later Accton and AMD-linked disclosures described 32K-GPU scale and validated performance
    on large clusters. Those claims must be discounted because most come from company-linked sources, but the directional message is consistent: if open Ethernet can approach proprietary-stack performance while keeping buyer optionality, it can unlock a large share of future AI-network spend.'
  claimRefs:
