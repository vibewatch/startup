  rows:
  - - High-end service-provider routing
    - Core, edge, peering, aggregation routers and switch platforms
    - Campus LAN, SMB routing, consumer Wi-Fi
    - Carrier CTO / IP transport budget owner
    - Legacy market DriveNets attacks with DNOS and Network Cloud
  - - Disaggregated telecom transport
    - Open router software, merchant-silicon white boxes, integrator services
    - Traditional single-vendor chassis refresh sold as closed bundles
    - Carrier architecture, transport, and operations leaders
    - Closest near-term replacement motion for DriveNets carrier business
  - - Cloud backbone / DCI routing
    - Large IP backbones and interconnect routed at hyperscale and cloud scale
    - Generic enterprise WAN appliances
    - Cloud network engineering and infra leadership
    - Important because DriveNets pitches cloud-like economics and elasticity
  - - AI back-end fabric
    - GPU-to-GPU cluster connectivity and collective-communications optimization
    - Server compute, accelerator silicon, model software itself
    - AI infrastructure or platform teams
    - Fastest narrative expansion area for DriveNets
  - - AI storage / front-end / scale-across networking
    - Storage-to-GPU, multi-site, and front-end AI traffic carried on lossless Ethernet
    - General-purpose enterprise switching
    - AI platform and data-center operations teams
    - Expands wallet share beyond only one cluster layer
  notes: Boundary separates carrier-routing replacement from AI-cluster networking so later sizing lenses do not double-count the same spend.
