- id: buyers-users-and-payers
  title: Buyers, Users, Payers, and Adoption Paths
  body: The buyer map is more complex than a standard enterprise software sale because the economic sponsor, technical user, and operational owner are often different teams. In telecom, the economic buyer is typically the CTO or network-infrastructure budget owner; the users are core-transport, IP, automation, and operations engineers; and the success metric is lower cost per transported bit with fewer proprietary constraints. The APAC and KDDI case studies show that internet gateway, peering, and backbone teams are willing to trial or deploy disaggregated routing when power, rack space, and capacity expansion pressures are high enough. In AI, the buyer profile shifts toward infrastructure engineering, platform, and data-center teams that care about GPU utilization, job completion time, multi-tenancy, and deployment speed rather than MPLS route scale. Dell AI Factory, WhiteFiber, Accton, and AMD-linked materials all point to this second buyer class. The user is still an infrastructure engineer,
    but the workflow is now cluster bring-up, congestion tuning, orchestration, and storage/back-end convergence. Across both markets, the payer is upstream of the daily user and adoption happens only when the platform can prove economic or operational gains large enough to justify the integration burden.
