- id: scale-headcount-and-open-gaps
  title: Scale Signals, Headcount Proxies, and the Main Open Questions
  body: 'Scale signals are strong enough to show that DriveNets is no longer an aspirational disaggregation story, but they are still incomplete in the ways that matter to underwriting. The strongest public scale signal is customer and deployment proof: AT&T, Comcast, KDDI, Orange, and WhiteFiber are all publicly linked to production deployments, trials, or strategic use cases, and DriveNets says AT&T and Comcast together support more than 30% of total U.S. internet traffic. The 2026 Series D release also says the company has been cash-flow positive since 2025 and has more than $1 billion in secured business, both unusual signals for a still-private infrastructure vendor. Workforce data are directionally consistent but not perfectly aligned: Calcalist reported 450 employees plus 100 open hires in July 2025, Revelio estimated 607 employees globally as of March 2026, and Tracxn showed 574 employees as of late June 2026. The common conclusion is not the exact number but the shape of the business:
    DriveNets is a multi-hundred-person global company with heavy engineering concentration in Israel, active hiring, and a real field-deployment footprint. The unresolved issues are equally important. Public sources still do not disclose official 2026 post-money valuation terms, revenue mix, gross margins, current board composition, or the named hyperscaler accounts that supposedly validate the AI-fabric expansion.'
