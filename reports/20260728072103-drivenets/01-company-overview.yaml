  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: Current board roster, observer rights, and voting-control structure after the 2025 secondary and 2026 Series D.
    whyItMatters: Late-stage governance determines investor protections, founder control, and how strategic customers may influence roadmap decisions.
    diligencePath: Request the current board list, voting agreements, and side-letter summary from management or lead investors.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Official confirmation of the June 2026 post-money valuation and the precise terms of the 2025 AT&T secondary.
    whyItMatters: Entry price discipline, dilution analysis, and current mark validation depend on knowing whether $8.5B is official or only market chatter.
    diligencePath: Request the signed financing summary, cap-table bridge, and any internal valuation memo used for the Series D.
    relatedQuestionRefs:
    - QO009
    - QO023
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Revenue mix, ARR composition, gross margin, and backlog duration by telecom versus AI-fabric programs.
    whyItMatters: Cash-flow positivity alone does not show whether the business is software-like, services-heavy, or inventory-intensive.
    diligencePath: Request cohort revenue by product line, gross margin bridges, and backlog conversion schedules for the last eight quarters.
    relatedQuestionRefs:
    - QO017
    - QO018
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named hyperscaler, foundation-model, or NeoCloud AI-fabric customers and the size of those production deployments.
    whyItMatters: The AI-fabric growth thesis depends on whether the company has repeatable large-scale wins beyond a few public showcase accounts.
    diligencePath: Request a named customer list with production versus pilot status, contract value, and renewal or expansion history.
    relatedQuestionRefs:
    - QO015
    - QO016
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Management-confirmed current employee count and office distribution.
    whyItMatters: The exact count affects burn estimates, execution bandwidth, and the true scale of the field-support organization.
    diligencePath: Ask management for current employees, open roles, and employee mix by geography and function.
