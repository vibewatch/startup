company:
  name: DriveNets
chapter:
  number: 1
  title: Company Overview
  summary: DriveNets is a Ra’anana-based networking software company founded in 2015 that sells a disaggregated network operating system and AI fabric stack on commodity hardware to large telecom and AI-infrastructure buyers. Public evidence strongly supports the June 2026 $410 million Series D, a customer base anchored by AT&T, Comcast, KDDI, Orange and WhiteFiber references, and a transition from carrier routing into AI fabrics. What remains materially less visible is the official post-money valuation, the current board roster, exact revenue composition, and the full named hyperscaler customer list.
sections:
- id: identity-and-product-thesis
  title: Identity, Architecture Thesis, and What DriveNets Actually Sells
  body: 'DriveNets positions itself as a networking software vendor rather than as another proprietary-router OEM. The core product is DNOS, a cloud-native network operating system that runs on commodity white-box hardware and abstracts clusters of packet-forwarding boxes into one logical routing system. That architectural choice matters because it attacks two pain points incumbent telecom and cloud buyers repeatedly describe: vendor lock-in and the economic mismatch between traffic growth and router cost. The company now extends the same disaggregated-control philosophy into AI fabrics, arguing that the network has become the bottleneck for large GPU clusters and that open Ethernet can outperform closed single-vendor stacks when the software layer optimizes the whole path. Official materials and independent coverage are aligned on the identity basics: DriveNets was founded in 2015, is based in Ra’anana, Israel, is led by co-founder and CEO Ido Susan, and serves service providers, cloud
    operators, and increasingly AI-infrastructure builders. The evidence does not support a simplistic “software-defined router” label alone; the commercial story is a broader one about replacing closed integrated systems with software plus merchant-silicon building blocks that can scale from telecom core routing to AI cluster fabrics.'
