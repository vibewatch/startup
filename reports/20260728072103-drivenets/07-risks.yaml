  title: Risks
  summary: 'DriveNets'' risk profile is defined less by market irrelevance than by coordination complexity: multivendor hardware, mission-critical customers, expanding AI automation, and a relatively small number of lighthouse accounts all have to work together without visible failures.'
sections:
- id: legal-regulatory-and-governance-surface
  title: Legal, Regulatory, and Governance Surface
  body: DriveNets is not a consumer app, but its public legal surface still matters because the company handles support interactions, marketing data, and global recruiting while increasingly pitching AI-enabled infrastructure into critical network environments. The website privacy policy, terms of use, and careers privacy notice together show a meaningful compliance footprint. They mention multiple data-collection modes, specific third-party platforms, support and account functions, restrictions on automated access, and a multi-entity group structure spanning Israel, the US, UK, Germany, India, Canada, and Japan. That is directionally good because it suggests the company is not ignoring legal basics. It is also a risk because cross-border data handling and employment operations become harder as the organization scales. The FTC privacy guidance raises the bar further by making clear that privacy promises and security expectations are enforceable, while NIST’s 2026 AI RMF work underscores
    that AI-enabled capabilities inside critical infrastructure deserve explicit risk-management treatment. The problem is not that DriveNets lacks policy documents; it is that policy presence is easier to verify publicly than operational compliance quality.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR028
  - CR032
  - CR033
  tableRefs:
