- id: switching-costs-distribution-and-partner-power
  title: Switching Costs, Distribution Power, and Partner Dependence
  body: 'DriveNets’ moat is partly technical and partly organizational. On the technical side, the company has years of field proof with AT&T and other operators, which matters because large carriers do not easily swap backbone architectures. On the organizational side, however, the company depends on a partner ecosystem around merchant silicon, white-box ODMs, integrators, and channels. The KDDI, Radisys, Dell, Accton, and AMD relationships all improve market access, but they also mean the company does not fully own the hardware, optics, or channel layer in the way Cisco or Nvidia can. That creates a double-edged dynamic: DriveNets can benefit from openness and ecosystem breadth, yet buyers may ask who ultimately carries integration, support, and roadmap liability. Carrier deals also impose high switching costs because changing routing architecture affects operations, spare inventory, automation workflows, and skills. In AI, the switching cost is less about legacy MPLS process and more
    about performance validation, cluster bring-up time, and support for multi-tenancy or scale-across deployments. Those are real costs, but they are lower than rewriting a telecom backbone, which makes the AI segment simultaneously more contestable and more volatile.'
