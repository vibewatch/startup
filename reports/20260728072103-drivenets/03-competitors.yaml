  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Recent win/loss data by competitor class, including Cisco, Juniper, Nokia, Nvidia, and internal-build outcomes.
    whyItMatters: The moat story depends on knowing whether DriveNets is consistently winning or only collecting showcase accounts.
    diligencePath: Request the last 24 months of competitive win/loss by segment, ACV, and reason code.
    relatedQuestionRefs:
    - QP009
    - QP018
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: ai-benchmarking
    missingEvidence: Independent production benchmarks comparing DriveNets to InfiniBand, Spectrum-X, and standard Ethernet across real customer clusters.
    whyItMatters: AI-performance claims are central to the thesis but still rely heavily on company-linked testing.
    diligencePath: Request customer benchmark reports, production telemetry, and third-party validation files.
    relatedQuestionRefs:
    - QP013
    - QP017
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Bookings mix and margin split across direct, OEM, SI, and strategic-partner channels.
    whyItMatters: Partner leverage helps growth but can weaken pricing power and customer ownership.
    diligencePath: Request channel contribution, gross margin, and attach-rate data by partner type.
    relatedQuestionRefs:
    - QP011
    - QP015
  - type: private-evidence-only
    severity: minor
    topic: pricing-transparency
    missingEvidence: Comparable pricing, support, and services structure versus incumbents and status-quo alternatives.
    whyItMatters: Economic superiority is frequently claimed but rarely publicly itemized.
    diligencePath: Review sample quotes and TCO models from recent competitive deals.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: minor
    topic: ai-customer-breadth
    missingEvidence: Named AI customers beyond a small number of public reference points.
    whyItMatters: Without broader name coverage it is hard to separate early traction from durable share.
    diligencePath: Request the named AI customer list, deployment stage, and renewal / expansion history.
