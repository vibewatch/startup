  rows:
  - - Cisco 8000
    - Incumbent integrated router OEM
    - Up to 518 Tbps on 8800 platforms
    - Carrier core, edge, AI-era routing
    - Silicon One, support, security, large installed base
    - Closed stack and higher lock-in risk versus disaggregated model
  - - Juniper PTX
    - Incumbent integrated router OEM
    - Up to 518.4 Tbps and 800GE-ready
    - Core, DCI, AI data-center routing
    - Automation, security, dense routing, broad WAN heritage
    - Still a conventional vendor-controlled stack
  - - Nokia 7750 SR
    - Incumbent integrated router OEM
    - Up to 230 Tb/s full-duplex with 800GE
    - Telco, AI and cloud routing
    - SR OS maturity, deterministic forwarding, security
    - Less overtly positioned around disaggregated white-box economics
  - - Nvidia InfiniBand / Spectrum-X
    - AI fabric incumbent / adjacent
    - Benchmark AI-networking brand and Ethernet alternative
    - Hyperscalers, AI clusters
    - Performance reputation and vertically integrated ecosystem
    - Vendor lock, separate fabrics, and lower buyer optionality per DriveNets critique
  - - Standard Ethernet Clos / internal build
    - Status quo / internal substitute
    - Common hyperscaler and data-center design pattern
    - Cloud and AI builders
    - Familiar operations, wide ecosystem, cheap switching blocks
    - Performance and congestion-management trade-offs at extreme scale
  - - DriveNets
    - Disaggregated software-led challenger
    - AT&T, KDDI, Comcast, Orange, WhiteFiber proof points
    - Carriers, cloud, hyperscalers, NeoClouds
    - White-box openness plus scheduled-fabric software and routing heritage
    - Requires buyer confidence in ecosystem integration and software-led support
  notes: Competitive profiles compare strategic alternatives rather than trying to imply identical products or identical buyer processes across telecom and AI.
