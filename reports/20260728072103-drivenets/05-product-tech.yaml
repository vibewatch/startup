- id: TE002
  title: Workflow / use-case table
  columns:
  - Buyer job
  - Current challenge
  - DriveNets solution
  - Evidence of benefit
  - Open limitation
  rows:
  - - Build carrier core or backbone
    - Traditional chassis scale is rigid and expensive
    - DNOS + DDC + white-box cluster
    - AT&T case, IP/MPLS case study, and product pages show live use
    - No public SLA pack
  - - Operate many sites as one system
    - Distributed hardware usually creates operational complexity
    - DNOR single-entity orchestration
    - DNOR page stresses lifecycle and topology management
    - Public ops telemetry is absent
  - - Bring up a large AI cluster
    - Networking integration and tuning are slow and fragile
    - AI Fabric + AI Cluster Orchestrator + DIS
    - Solution pages and AMD reference architecture describe repeatable deployment
    - Most measured outcomes are company-claimed
  - - Expand across sites
    - Latency, packet loss, and multi-site design are difficult
    - Scale-across with deep-buffer interconnect NCPs
    - AI solution pages explicitly describe multi-site design
    - No third-party benchmark on distance tradeoffs
  - - Reduce vendor lock and source flexibly
    - Integrated stacks limit procurement choices
    - Any GPU / any NIC / any optics model
    - White-box and AI pages repeatedly emphasize openness
    - Interoperability cost may still shift to DriveNets or the customer
  - - Maintain and upgrade live networks
    - Maintenance windows and rollback risk are painful
    - NMW, ZTP, smart rollout, RCA, and support services
    - DNOR and support pages describe these workflows
    - No public incident history to prove behavior under stress
  notes: Public sources support the workflow thesis strongly enough to show how customers are supposed to use the product, though not every operational claim is independently measured.
