chapter:
  number: 5
  title: Product & Technology
  summary: 'DriveNets delivers a layered network platform rather than a single NOS: white-box hardware patterns, DNOS, DNOR, AI-fabric variants, orchestration, and services are all part of the product contract. Public evidence is strong on architectural intent and module breadth, but weaker on independently auditable reliability, security, and benchmark depth.'
sections:
- id: network-cloud-core-architecture
  title: Network Cloud Core Architecture and Product Modules
  body: 'DriveNets’ product surface is broader than a router operating system. Public product materials show a stack with at least four core layers: white-box hardware building blocks, DNOS as the network operating system, DNOR as the orchestration and lifecycle layer, and services/support that wrap deployment and operations. The architectural thesis is to make clusters of standard hardware behave like a single high-scale routing or AI-network system. That is why the white-box page focuses on NCP and NCF building blocks, while the DNOR page emphasizes single-entity management, zero-touch provisioning, lifecycle upgrades, and topology visibility. The result is not simply open hardware plus software; it is an attempt to replicate the operational simplicity of a monolithic chassis while preserving the supply-chain flexibility and scaling advantages of disaggregation. The IP/MPLS case study adds an important implementation clue: DNOS is presented as microservice-based software tied to x86 control-plane
    resources and clusterized forwarding elements, which suggests a genuinely cloud-native operating model rather than a simple port of legacy router software onto generic boxes.'
  claimRefs:
