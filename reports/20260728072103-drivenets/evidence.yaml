evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: Current board roster, observer rights, and voting-control structure after the 2025 secondary and 2026 Series D.
    whyItMatters: >-
      Late-stage governance determines investor protections, founder control, and how strategic customers may influence
      roadmap decisions.
    diligencePath: Request the current board list, voting agreements, and side-letter summary from management or lead investors.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Official confirmation of the June 2026 post-money valuation and the precise terms of the 2025 AT&T secondary.
    whyItMatters: >-
      Entry price discipline, dilution analysis, and current mark validation depend on knowing whether $8.5B is official
      or only market chatter.
    diligencePath: Request the signed financing summary, cap-table bridge, and any internal valuation memo used for the Series D.
    relatedQuestionRefs:
      - QO009
      - QO023
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Revenue mix, ARR composition, gross margin, and backlog duration by telecom versus AI-fabric programs.
    whyItMatters: >-
      Cash-flow positivity alone does not show whether the business is software-like, services-heavy, or
      inventory-intensive.
    diligencePath: >-
      Request cohort revenue by product line, gross margin bridges, and backlog conversion schedules for the last eight
      quarters.
    relatedQuestionRefs:
      - QO017
      - QO018
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named hyperscaler, foundation-model, or NeoCloud AI-fabric customers and the size of those production deployments.
    whyItMatters: >-
      The AI-fabric growth thesis depends on whether the company has repeatable large-scale wins beyond a few public
      showcase accounts.
    diligencePath: >-
      Request a named customer list with production versus pilot status, contract value, and renewal or expansion
      history.
    relatedQuestionRefs:
      - QO015
      - QO016
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Management-confirmed current employee count and office distribution.
    whyItMatters: The exact count affects burn estimates, execution bandwidth, and the true scale of the field-support organization.
    diligencePath: Ask management for current employees, open roles, and employee mix by geography and function.
    relatedQuestionRefs:
      - QO019
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: Internal milestone list covering board changes, product launches, and customer wins not publicly announced.
    whyItMatters: >-
      The chapter can build a credible public chronology, but not a complete corporate timeline of every operational or
      governance event.
    diligencePath: >-
      Request an internal milestone chronology or dataroom summary to reconcile omitted board, product, and commercial
      milestones.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: ai-serviceable-market
    missingEvidence: Named AI-fabric customers, deal sizes, renewal rates, and production-versus-pilot conversion data.
    whyItMatters: >-
      Without customer-count and ACV evidence, the gap between AI-networking TAM rhetoric and DriveNets’ actual
      reachable SAM remains very wide.
    diligencePath: Request named AI customers, active clusters, ACVs, and win/loss data by segment.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: carrier-market-size
    missingEvidence: Non-paywalled numeric revenue tables for the carrier high-end routing market and disaggregated-router share.
    whyItMatters: >-
      The public category definitions are good, but precise TAM/SAM work still depends on paid analyst datasets or
      internal customer budgets.
    diligencePath: Obtain Dell’Oro or equivalent market tables, or request top-down market sizing from management with source files.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Actual pricing, license, support, and hardware-bundle economics for telecom and AI-fabric deployments.
    whyItMatters: >-
      Adoption can be strong while margin or payback remains weak; public sources emphasize benefits but not price
      architecture.
    diligencePath: Request sample quotes, gross-margin ranges, and support attach rates by deployment type.
    relatedQuestionRefs:
      - QM018
  - type: conflicting-data
    severity: minor
    topic: tam-horizons
    missingEvidence: A single time-consistent AI-networking market model using one horizon and one methodology.
    whyItMatters: >-
      Public TAM quotes span 2027, end-of-decade, and deployment-economics proxies, which is informative but not fully
      apples-to-apples.
    diligencePath: Normalize market assumptions into one dated bottom-up model before using them for valuation.
