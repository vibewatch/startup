- id: durability-expansion-and-support-burden
  title: Durability, Expansion, and the Support Burden Behind Growth
  body: 'The best public durability signal is not a churn metric; it is deployment progression over time. AT&T’s relationship deepened from architecture work to major production traffic and then to an equity position. Comcast’s Janus story moved from initial launch in Atlanta toward expansion across the company’s footprint. KDDI moved from internet-gateway use toward backbone-core deployment. Those are the kinds of transitions investors want to see because they imply customer trust and internal customer references. But they also reveal an important operational cost. DriveNets’ own podcast and support pages emphasize that these accounts demand accuracy, five-nines style reliability, global deployment support, and substantial field resources. That means expansion is not purely a sales outcome; it is partly a delivery and support outcome. Publicly, that creates a dual conclusion: the company appears capable of winning follow-on work, but growth may remain concentrated in a few large, resource-intensive
    programs rather than in a broad, low-touch customer base.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU028
  - CU029
  - CU030
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-risk-and-remaining-gaps
  title: Concentration Risk and Remaining Customer Gaps
  body: 'The major customer risk is not whether DriveNets has any customers; it clearly does. The real question is how diversified those customers are by segment, geography, and revenue contribution. Public evidence still leaves that unresolved. Most named production proof clusters around AT&T, Comcast, KDDI, and a small set of additional references like WhiteFiber and Orange. Meanwhile, the company repeatedly describes hyperscaler, NeoCloud, and enterprise AI adoption without naming most of the buyers. That asymmetry matters because it means investors can believe the AI pipeline exists while still lacking the evidence needed to measure concentration or repeatability. The chapter also needed to test a common temptation: overstating Telstra. Public evidence in this run does not support treating Telstra as a DriveNets customer; if anything, Telstra’s own 2026 announcement shows a rival multivendor path built around Cisco, Dell, and Red Hat. The prudent customer verdict is therefore positive
    but incomplete: DriveNets has real lighthouse adoption, but the public record still does not show a broadly diversified, fully underwritten customer base.'
