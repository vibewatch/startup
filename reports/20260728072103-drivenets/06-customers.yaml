  title: Customers
  summary: DriveNets has unusually strong public lighthouse-customer proof for an infrastructure startup, especially in telecom, but the public record still leaves AI-customer breadth, revenue concentration, and measured retention mostly opaque.
sections:
- id: customer-base-and-segmentation
  title: Customer Base, Buyer Map, and Segment Reality
  body: 'DriveNets does not sell to a mass self-serve user base; it sells into infrastructure buying centers where the actual users are network-operations, architecture, and platform teams inside very large organizations. Publicly visible segments now span four buckets: service providers, hyperscalers, NeoClouds/GPUaaS operators, and enterprises building AI infrastructure. The named proof is strongest in telecom, where AT&T, Comcast, KDDI, and Orange together show the company can land tier-1 operators at multiple stages of adoption. The buyer-versus-user distinction matters here. At AT&T or Comcast, the buyer is a network leadership or architecture function, the operator is an internal engineering team, and the end beneficiary is the subscriber or enterprise customer consuming bandwidth and reliability. In AI deployments, the likely buyer is an infrastructure or platform team optimizing GPU utilization, while the end beneficiary may be a model-building organization or downstream customer.
    That structure makes customer concentration more dangerous than account count alone suggests, because each named win can be very large, strategic, and slow-moving.'
  claimRefs:
  - CU001
  - CU005
  - CU010
  - CU015
  - CU016
  - CU017
  - CU033
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-deployments-and-adoption-proof
  title: Named Deployments and Adoption Proof
  body: 'The public adoption record is now too strong to dismiss as slideware. AT&T remains the clearest flagship: public sources show a progression from initial core deployment to a 52%-of-core-traffic milestone and finally to strategic shareholding. Comcast provides the next-best proof because Janus moved from an announced transformation initiative to an expanded footprint using DriveNets Network Cloud, with multiple third-party outlets describing the relationship as both technically meaningful and commercially material. KDDI adds APAC proof and a useful shape of adoption: initial peering deployment, then a larger backbone partnership with disclosed starting sites and a commercial timeline. WhiteFiber extends the proof beyond telecom into AI infrastructure, including a 2026 scale-across deployment spanning two GPU data centers 52 miles apart. Orange and anonymized case studies help widen the map, but they are clearly weaker evidence than the AT&T, Comcast, and KDDI programs because they
    reveal less about scale, renewal, or revenue. So the public answer is that adoption is real and multi-region, but its center of gravity still sits in a fairly small cluster of lighthouse accounts.'
