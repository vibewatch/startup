- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Signal
  - Why it matters
  - Current gap
  rows:
  - - Cash on hand
    - Not disclosed
    - Fresh financing plus cash-flow positivity suggest meaningful liquidity
    - Determines downside protection and freedom to keep investing
    - Need actual cash balance and minimum operating buffer
  - - Monthly burn
    - Not disclosed
    - Headcount and deployment activity imply a large cost base
    - Tests whether cash-flow positivity is durable or lumpy
    - Need monthly burn / cash-conversion bridge
  - - Runway months
    - Not disclosed
    - Series D likely extended runway materially
    - Critical for timing of any next financing
    - Need runway under base and downside cases
  - - Planned use of funds
    - Inventory scaling and heterogeneous AI expansion
    - Signals capital will support physical delivery and GTM expansion
    - Clarifies why a cash-flow-positive company still raised so much capital
    - Need split across inventory, R&D, sales, and working capital
  - - Next-round trigger
    - Unknown
    - Could be optional if AI demand compounds, or necessary if inventory needs spike
    - Affects dilution and risk rating
    - Need board-approved financing plan and covenant view
  - - Debt / project finance obligations
    - No public debt detail retrieved
    - May mean a cleaner balance sheet, but could simply be undisclosed
    - Important for liquidation and working-capital stress
    - Need debt schedule, supplier terms, and guarantees
  notes: DriveNets looks well funded, but the lack of cash, burn, and debt detail prevents precise runway analysis.
