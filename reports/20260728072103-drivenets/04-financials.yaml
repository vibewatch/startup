- id: unit-economics-and-demand-quality-proxies
  title: Unit Economics and Demand-Quality Proxies
  body: 'Because DriveNets does not publish recognized revenue, ARR, gross margin, or burn, the best public financial read comes from proxies. The strongest ones are demand intensity and operating posture. Management says the company had more than $1 billion in secured business, became cash-flow positive in 2025, and generated substantial AI solution revenue in the same year. The 2025 inflection blog also describes strategic agreements, major AI projects, and multiyear completion windows, all of which suggest that the company is moving from point deployments toward larger programmatic revenue. Meanwhile, the workforce signals imply a sizeable cost base: CTech placed DriveNets at 450 employees plus 100 open hires in mid-2025, Globes said around 500 later that year, and third-party headcount platforms point to the high-500s or low-600s in 2026. Those facts make one conclusion possible even without a published income statement: this is already a real operating company with meaningful labor
    and field-support expense. What remains unclear is whether deployment simplification and AI attach revenue are creating software-like leverage or merely supporting a capital-intensive scale-up phase.'
