- id: financial-verdict-and-remaining-underwriting-gaps
  title: Financial Verdict and Remaining Underwriting Gaps
  body: The public-only financial verdict is positive on scale and negative on disclosure completeness. Public sources are now strong enough to say that DriveNets has late-stage demand, meaningful customer traction, and more financial resilience than a typical venture-backed infrastructure startup. Cash-flow positivity, a billion-dollar secured-business claim, a massive 2026 raise, and visible secondary liquidity all support that. But those positives still stop short of a clean underwriting case. There is no public revenue bridge by product line, no gross-margin detail, no working-capital schedule, no cash balance, no debt schedule, and no clear separation between carrier routing programs, AI-fabric wins, systems revenue, and services attach. Even the headcount proxy varies materially across public sources. Investors can therefore conclude that DriveNets is scaling from a position of strength, yet they still cannot tell whether the current economics are software-like, integration-heavy,
    or temporarily distorted by inventory expansion. That is the key reason this chapter supports the company’s financial credibility while still withholding a fully underwritten verdict.
