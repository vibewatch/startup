- id: capital-formation-liquidity-and-balance-sheet-implications
  title: Capital Formation, Liquidity, and Balance-Sheet Implications
  body: 'DriveNets’ capital story has two distinct chapters: primary financing to build the company and secondary liquidity that repriced the equity without adding operating cash. Official releases show $110 million in Series A, $208 million in the 2021 growth round, $262 million in 2022, and $410 million in Series D in 2026, bringing total primary capital to roughly $1 billion. Then AT&T bought a large secondary stake in 2025, which media reports valued at about $650 million and roughly a 15% ownership position. That secondary mattered because it validated strategic demand and let insiders realize liquidity, but it did not directly extend runway. The June 2026 raise did. Management explicitly tied the new capital to inventory build, AI pipeline support, and heterogeneous-infrastructure expansion. That is a crucial signal: unlike a pure software vendor that mostly funds payroll and go-to-market, DriveNets appears to need working capital to support physical systems delivery into an AI market
    shaped by supply constraints. The company’s balance-sheet adequacy therefore looks better than most startups’, but its capital intensity is also probably higher than the software label alone would imply.'
