- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy
  - Likely analytical effect
  - Diligence path
  rows:
  - - Revenue by product line
    - Separates routing software, AI fabric, services, and partner-channel economics
    - Secured-business claim plus bookings blog
    - Could reveal a much more services-heavy mix than the narrative implies
    - Request quarterly revenue by product and customer segment
  - - Gross margin and contribution margin
    - Determines whether this is software-like or delivery-heavy
    - Deployment simplification and inventory comments only
    - Could change valuation discipline materially
    - Request gross-margin bridge and hardware pass-through treatment
  - - Cash balance and runway
    - Tests financing dependency after the Series D
    - Cash-flow-positive claim plus fresh round size
    - Could confirm strength or expose near-term capital needs
    - Request current cash, monthly net burn, and 18-month plan
  - - Backlog conversion timing
    - Turns >$1B secured business into recognizable revenue timing
    - 2025 inflection multiyear-completion comment
    - Could show slow conversion and heavy implementation exposure
    - Request backlog aging and recognition schedule
  - - Customer concentration and ACV distribution
    - Determines how dependent growth is on a few very large programs
    - Named customer set and strategic secondary only
    - Could raise volatility risk if a few deals dominate
    - Request top-10 customers by ARR / bookings / backlog
  - - Working-capital intensity
    - Inventory scaling changes cash needs even if topline is growing
    - Series D inventory language
    - Could explain why a cash-flow-positive company still raised so much capital
    - Request inventory turns, prepayments, and vendor-term summary
  notes: These are the specific private metrics still required to turn a strong narrative into a clean financial underwriting case.
