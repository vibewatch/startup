- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting it
  - Counterpoint
  - What would change the view
  rows:
  - - DriveNets is becoming a major network platform company
    - $1B+ secured business, cash-flow positive, major telco customers, AI expansion
    - Scale is real, but revenue quality is still opaque
    - Recognized revenue, margin, and cohort-quality disclosure
  - - AI can justify a premium multiple
    - WhiteFiber, heterogeneous AI, AMD/Dell ecosystem, broader TAM narrative
    - Named AI customer breadth is still thin
    - Named production AI roster and repeat wins
  - - Telecom credibility provides downside support
    - AT&T, Comcast, and KDDI are hard-won lighthouse accounts
    - A small set of accounts can also create concentration risk
    - Top-customer concentration and renewal visibility
  - - The round could still be too full
    - Public comps outside Arista require much larger revenue bases
    - Private investors sometimes pay ahead for category leaders
    - Proof of premium margins and rapid backlog conversion
  - - A full pass would be too harsh
    - Too much customer and technology proof exists for that
    - Price discipline still matters at this mark
    - A materially lower entry or stronger private metrics
  notes: The anti-thesis is not that the company is weak; it is that the current valuation may already discount most of the visible upside.
