  - - AI breadth remains mostly unnamed
    - Premium multiple logic needs repeatable AI wins
    - No new named AI customers appear despite heavy narrative emphasis
    - High
    - Request named production roster by segment
  - - Large-customer concentration intensifies
    - A few lighthouses would dominate both proof and economics
    - Any one of AT&T, Comcast, or KDDI weakens materially
    - High
    - Request top-customer concentration and renewal data
  - - Margins look systems-heavy rather than software-like
    - Would compress the justified multiple band
    - Inventory, support, and services content dominate economics
    - High
    - Request gross-margin and services-mix bridge
  - - Partner or supply-chain slippage slows deployments
    - Would undermine the AI scaling story at the worst time
    - Reference-design or inventory cadence weakens
    - Medium-High
    - Request supply and partner contingency plan
  notes: These are the public signals most likely to flip the recommendation from watch to pass or, if resolved positively, from watch to invest.
