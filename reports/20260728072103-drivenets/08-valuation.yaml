  title: Valuation
  summary: DriveNets has enough proof to merit a serious watch, but on public evidence the $8.5 billion 2026 valuation already assumes much stronger revenue visibility and/or software-like quality than outsiders can currently verify.
sections:
- id: starting-price-and-what-the-market-is-buying
  title: Starting Price and What the Market Is Actually Buying
  body: The public starting point is clear even if the economic denominator is not. In June 2026, multiple sources placed DriveNets’ new financing at an $8.5 billion valuation, up meaningfully from the approximately $5 billion reference implied by the 2025 AT&T secondary. Officially, the company also claimed more than $1 billion of secured business, roughly $1 billion of primary capital raised, and cash-flow positivity since 2025. Those are serious late-stage signals. They suggest that investors are not buying a concept demo but a business with real deployments, real commercial momentum, and enough balance-sheet strength to pursue a large AI opportunity. What the market is still buying, however, is a narrative with an incomplete denominator. Public sources still do not reveal recognized revenue, gross margin, backlog aging, or top-customer concentration in economic terms. So the current price is not attached to a clearly disclosed revenue multiple; it is attached to a belief that lighthouse
    customer traction, telecom credibility, and AI-fabric expansion can compound into much larger economics than the public record can yet prove.
