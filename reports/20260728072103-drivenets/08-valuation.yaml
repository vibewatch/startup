- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - What public signal would worsen it
  - Severity
  - Diligence response
  rows:
  - - Backlog fails to convert into visible revenue scale
    - Current valuation assumes meaningful commercial translation
    - Large projects slip or expansion narratives cool
    - High
