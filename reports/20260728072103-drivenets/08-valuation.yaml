    - $8.5B appears rich against Cisco/Ciena/Nokia style frameworks
    - Customer concentration or partner slippage becomes visible
    - Real downside if private metrics disappoint
  - - Base
    - Carrier proof remains strong, AI expands selectively, and economics are decent but not elite
    - Watch posture is justified; current mark is arguable but full
    - Need much better denominator disclosure before conviction
    - Most consistent with current public evidence
  - - Bull
    - AI platform narrative scales, margins prove premium, and named AI customers broaden quickly
    - Arista-like premium logic becomes more credible and the round can age well
    - Requires unusually strong execution and disclosure improvement
    - Possible but not yet proven publicly
