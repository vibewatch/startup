- id: TV006
  title: Final diligence asks table
  columns:
  - Missing input
  - Why it is decisive
  - Best public proxy today
  - Impact on recommendation
  - Exact diligence path
  rows:
  - - Revenue by segment
    - Tells whether the company is telecom software, AI systems, services, or some mix
    - Secured-business claim plus lighthouse customers
    - Could move watch toward invest or pass
    - Request quarterly revenue bridge across routing, AI fabric, services, and partner channel
  - - Gross margin / contribution margin
    - Determines justified multiple band
    - Support-heavy deployment narrative
    - Could materially compress or support premium valuation logic
    - Request gross-margin and contribution-margin history by segment
  - - Backlog conversion timing
    - Turns >$1B secured business into real annualized scale
    - Bookings and multiyear completion language
    - Could validate or weaken the round at current price
    - Request backlog-aging, conversion schedule, and cancellation profile
  - - Top-customer concentration
    - Tests how much valuation rests on few lighthouses
    - Named AT&T / Comcast / KDDI depth
    - Could shift risk rating and stance
    - Request top-10 customer concentration and renewal history
  - - Named AI customer breadth
    - Tests whether AI upside is repeatable or still mostly narrative
    - WhiteFiber plus unnamed deployments
    - Could justify premium if broad and sticky
    - Request named production AI customer roster and expansion data
  - - Runway and capital-intensity view
    - Determines whether growth is self-funding or still financing-sensitive
    - Cash-flow-positive claim plus large inventory raise
    - Could change the recommendation only if much weaker than implied
    - Request current cash, burn, inventory turns, and financing plan
  notes: These are the few private metrics that would most quickly decide whether the current valuation is merely rich or genuinely justified.
