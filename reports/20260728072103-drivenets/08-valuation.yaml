- id: recommendation-confidence-and-diligence-gates
  title: Recommendation, Confidence, and Diligence Gates
  body: 'The right public-only recommendation is watch, with medium confidence and a stretched valuation stance. The case is too strong for a reflexive pass: customer proof is real, technology differentiation is plausible, and the AI upside is not imaginary. But the case is also too incomplete for an invest call at the current mark because the company still withholds the exact variables that determine whether an $8.5 billion valuation is disciplined or exuberant. That missing set is straightforward: revenue by segment, gross margin, backlog conversion, top-customer concentration, and the named breadth of the AI customer base. If those metrics prove strong, the 2026 round may look prescient rather than rich. If they disappoint, the current price will look full in hindsight. The point of a watch posture is therefore not indecision; it is maintaining valuation discipline while acknowledging that DriveNets is one of the more credible late-stage infrastructure stories in the current Israeli and
    AI-networking landscape.'
