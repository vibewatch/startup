summary:
  headline: >-
    MiniMax has built one of the broader product surfaces among private AI companies and appears commercially real at
    meaningful scale, but live IP litigation, governance and financial opacity, and intense pricing competition keep the
    story in Track rather than buy territory at reported late-stage marks.
