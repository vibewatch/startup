      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              MiniMax 受益于几个清晰增长驱动：模型价格下降会扩大试验面，开源分发会放大认知，多模态创作工具会提高钱包份额机会，更宽的 AI
              竞赛会让买方持续按性价比比较供应商。但同一组动态也定义了约束。价格压缩可能在公司形成深度锁定前侵蚀利润率。开源可用性和蒸馏叙事可能加速商品化。企业买方仍可能偏好已经打包支持、分析、SSO
              和合规的供应商。创作者工作流还带来内容来源、版权、安全审核和计费公平性的独立信任问题。围绕中国 AI 供应商的地缘政治和政策叙事，也可能拖慢国际企业采用，即使产品基准表现不错。MiniMax
              自身文档还显示了速率限制和异步视频工作流等运营约束，它们会影响真实生产上线。市场大到值得重视，变化也足以奖励低成本进入者，但它并不无摩擦，也不会必然奖励最便宜的模型。
