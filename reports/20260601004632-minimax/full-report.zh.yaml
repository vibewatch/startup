            body: >-
              避免虚假精确的最清晰方式，是将 MiniMax 与披露充分的公开软件和 AI 相邻公司进行三角校验，再将该区间与 MiniMax 自己的私募和 IPO 指引相比较。Adobe、Duolingo、C3.ai 和
              GitLab 基于 2026 年 6 月市值数据和 CompaniesMarketCap 最新报告收入，市值/收入大致在 4.3x 至 5.5x 之间；每家发行人的 2026 年 10-K 文件也可在 EDGAR
              查到。这些可比对象并不完美：Adobe 规模更大、盈利能力更强，Duolingo 是消费者订阅业务，C3.ai 是公开市场纯 AI 标的，GitLab
              是开发者平台。但它们仍提供了有用的公开市场现实校验。MiniMax 自己据报的估值标记要高得多。2024 年 $2.5 billion 估值相当于 2024 年 $30.5 million 收入的约 82x。$3
              billion 私募估值意味着约 38x 2025 年收入或 20x ARR，而 >$4 billion 的 IPO 目标意味着约 51x 2025 年收入或接近 27x ARR。如果 MiniMax
              证明前沿模型效率、企业持久性和 ARR 快速复合增长，这一溢价最终可能合理。今天，公开证据支持增长质量，但不支持这种程度的估值确定性。
