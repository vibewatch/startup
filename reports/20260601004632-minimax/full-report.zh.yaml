  - id: TV007
    title: 定价面对比表
    columns:
      - 供应商
      - 参考模型 / 产品
      - 公开价格点
      - 相对 MiniMax
      - 估值含义
    rows:
      - - MiniMax
        - M2.7 API
        - 每 1M tokens 输入 $0.3 / 输出 $1.2
        - 基准
        - 有助于采用，但难以证明溢价定价权。
      - - OpenAI
        - GPT-5.5 API
        - 每 1M tokens 输入 $5 / 输出 $30
        - MiniMax 输入便宜约 94%，输出便宜约 96%
        - MiniMax 可以定位为价值领导者，但这也意味着收入质量必须来自用量。
      - - Anthropic
        - Sonnet 4.6 API
        - 每 MTok 输入 $3 / 输出 $15
        - MiniMax 输入便宜约 90%，输出便宜约 92%
        - 激进折扣有助于拿到用量，但会压缩毛利率。
      - - Google
        - Gemini 付费层参考
        - 每 1M tokens 输入 $1.50 / 输出 $9
        - MiniMax 输入便宜约 80%，输出便宜约 87%
        - 竞争性价格强度意味着今天不应支付稀缺式估值溢价。
    notes: 这不是纯性能比较。它是变现质量视角，说明 MiniMax 相对主要前沿同行采取了非常激进的价格姿态。
