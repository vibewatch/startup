      - number: '4.2'
        title: 市场推进动作与牵引力代理指标：产品驱动的全球使用可见，但队列经济性不可见
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的市场推进姿态看起来是混合型。官方公司页面强调其拥有全球个人用户、企业和开发者装机基础；文档集则显示，公司有意通过 SDK 兼容、开放
              API、本地部署指南和开源智能体样例，推进面向开发者的动作。第三方报道把图景又往前推了一步：Kr-Asia 描述了 B2C 与 B2B 双收入结构；Chinatalk 则称 Talkie 仍是最大收入贡献者，并称
              Hailuo 和 Talkie 在 2025
              年前九个月披露了有意义的月活用户数。这些是有价值的需求信号，因为它们说明公司既在变现消费者注意力，也在变现开发者或企业用量。但它们仍达不到标准软件尽调门槛。公开材料没有披露
              CAC、付费转化率、流失、队列留存、企业席位扩张、各分部支持成本或客户集中度。因此，MiniMax 看起来商业上活跃、分布全球，但销售效率和收入耐久度仍是从产品入口和媒体报道推断出来的，而不是来自经审计或管理层级
