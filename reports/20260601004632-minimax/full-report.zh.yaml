      - number: '3.3'
        title: 消费者陪伴、创作者入口与视频生成竞争
        blocks:
          - type: paragraph
            body: |2-
                      MiniMax 对创作者和陪伴层暴露异常高，这既是竞争正面因素，也是风险。Hailuo 给 MiniMax 在视频上提供了真实消费者创作者入口，Talkie 和 MiniMax Agent 又把用户触点扩到 API 买方之外。这意味着 MiniMax 不必只靠企业合同或开发者 Token 变现。但这也意味着它要在 ByteDance 和 Tencent 结构性强势的地带与它们正面竞争。ByteDance 的技术栈覆盖消费者聊天，以及越来越宽的 Volcengine Doubao 模型目录，包括代码、视觉、视频、实时语音和角色扮演模型。Tencent 把 Hunyuan 模型工作与 Yuanbao 终端用户助手分开；Baidu 的 ERNIE/Yiyan 页面则显示，编码、写作和视觉生成已经成为中国助手体验的基本配置。具体到视频，MiniMax 有真实强项的公开证据：Hailuo 02 在用户基准中排在 Google Veo 3 之上，列示成本也低得多。但同一基准也把 ByteDance Seedance 排在 Hailuo 前面，说明 MiniMax 的创作者优势仍在争夺中，而不是已经定局。
                    
