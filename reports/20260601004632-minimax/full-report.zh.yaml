              公司概况已经覆盖逐轮融资时间线；财务问题在于，这些报道如何反映 MiniMax 当前资本获取能力。2024 年 3 月 Bloomberg 和 SiliconANGLE 报道把一轮大型私募融资定在至少 $600
              million、估值超过 $2.5 billion。随后 Reuters、SCMP 和 Yahoo 的报道描述了秘密香港 IPO 活动、保荐人、拟募资规模和明显走高的估值区间。Kr-Asia 走得更远，报道称
              2025 年收入为 $79 million、ARR 超过 $150 million、毛利率为
              25.4%，同时也称调整后净亏损仍然很大。这些数字在分析上很重要，但本章不应把它们当作已提交报表。它们是媒体报道或招股书报道数字，而不是我们在本来源集中独立核验过的 MiniMax
              官方年报条目。投资判断需要更细：MiniMax 看起来能吸引资本，也可能已有实质商业化规模，但公开来源记录仍让投资者在最关键数字上依赖第三方摘要。
