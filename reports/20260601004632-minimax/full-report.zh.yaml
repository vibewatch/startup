  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 版权案实质恶化
        - 禁令推进、重大不利裁决，或改变单位经济性的准备金要求
        - 直接打击 Hailuo 商业化、投资者信心和 IPO 胃口
        - 暂停投资判断；立即重切悲观情景。
      - - ARR 停滞或质量不及预期
        - ARR 没有明显超过 >$150M，或有证据显示 ARR 主要是低质量 / 促销型
        - 打破估值溢价来自耐久平台变现的论点
        - 将公允价值中枢移至基准情景区间下方。
      - - 规模扩大后毛利率仍在 20% 中段附近
        - 进一步放量或申报披露后，仍未向 30%-35% 移动
        - 说明定价权弱，成本优势没有转化为软件级经济性
        - 不要支付溢价倍数。
      - - Talkie / 消费者收入组合仍占主导
        - 消费者陪伴收入仍驱动大部分变现，且消费质量没有改善
        - 相较企业平台叙事，抬高毛利率、监管和留存风险
        - 对估值和退出概率施加更大折扣。
      - - 上市流程中披露仍然薄
        - 没有一手招股书、没有股权结构清晰度，也没有量化法律准备金
        - 无法可靠测算稀释、现金需求和下行
        - 维持观察 / 暂缓，直到尽调包改善。
    notes: 这些触发因素设计为可监控，而非抽象担忧。每个阈值都能直接连到估值压缩、融资摩擦，或两者。
