    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 据报道的增长和融资是真实的，但公开证据尚不足以支撑按传闻中的私募或 IPO 标记入场。
        - 在取得一手披露前，不应按 >$3B 私募 / >$4B IPO 指示价格承诺投资。
      - - 信心水平
        - 中
        - 第三方报道足以框定区间，但磁盘上没有一手招股书或审计包来解决收入质量和股权结构细节。
        - 等到出现申报级披露后再重估。
      - - 风险评级
        - 高
        - 正在进行的版权诉讼、披露不完整、激进定价以及亏损仍大，让投资测算很脆弱。
        - 在任何条款清单工作前，要求完成诉讼、准备金和治理尽调。
      - - 估值立场
        - 偏高
        - 据报道的标记意味着 20x-27x ARR 或 38x-51x 收入，显著高于大约 4x-6x 的上市 AI / 软件公司市值 / 收入参考。
        - 任何高于基准情景区间的入场，都需要异常强的上行情景信念。
      - - 当前回报形态
        - 只有更低入场价才呈现不对称性
        - 如果 ARR 复合增长且法律风险消退，上行空间存在；但按传闻价格看，当前公开证据留下的安全边际很少。
        - 更倾向等待价格回调至约 ~$2B-$2.5B，或看到更强的审计证明。
    notes: 本表对价格敏感，而不是只评价公司质量。评估基于报告运行时引用来源集中的公开证据，不包括私下尽调材料。
