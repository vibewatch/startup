  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按投委会口径，从规模、变现、风险、估值和证据质量给 MiniMax 打分。
    data:
      items:
        - label: 产品广度
          value: 8/10
          note: 多模态技术栈和宽产品面是真实存在的，也已有商业可见度。
        - label: 收入动能
          value: 8/10
          note: 据报道，2025 收入增长和 ARR 推进都很强。
        - label: 企业端证明
          value: 6/10
          note: 214,000+ 企业客户 / 开发者有分量，但队列质量仍不透明。
        - label: 变现质量
          value: 4/10
          note: Talkie 占比、单个消费者低支出和激进定价压低了溢价信心。
        - label: 利润率质量
          value: 3/10
          note: 25.4% 毛利率和 $250M 调整后净亏损，还撑不起稀缺性倍数。
        - label: 法律 / 政策风险
          value: 2/10
          note: 进行中的版权案，以及更广的陪伴 / 内容风险，都需要估值打折。
        - label: 估值公允性
          value: 3/10
          note: 据报道的估值明显高于公开 AI / 软件可比倍数。
        - label: 证据质量
          value: 4/10
          note: 足以划出区间，但不足以高确信度投资测算。
    approximationNotes: 分数带有判断性和相对性，采用 1-10 分制，分数越高越好；仅汇总公开证据。
    claimRefs:
      - CV009
      - CV015
      - CV020
      - CV022
      - CV030
      - CV031
      - CV043
      - CV044
      - CV045
      - CV049
