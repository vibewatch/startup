          detail: MiniMax 发布了覆盖文本、视频、token 套餐和附加项的价目表。
          tone: positive
        - id: usage
          label: 用量和用户代理指标
          detail: 官方用户数和第三方 MAU / ARR 报道暗示需求有相当体量。
          tone: positive
        - id: mix
          label: B2C / B2B 组合信号
          detail: 第三方报道显示，其收入同时来自消费者产品和企业平台。
          tone: neutral
        - id: yield
          label: 实际收益不确定
          detail: 折扣、额度失效、企业条款和平台抽成率都未公开。
