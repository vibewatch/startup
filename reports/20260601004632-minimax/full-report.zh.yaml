companyProfile:
  summary: >-
    MiniMax 是一家总部位于上海的多模态 AI 公司，围绕创始人 Yan Junjie 及一批前 SenseTime 成员于 2022 年初创立。公司如今覆盖 M-series 语言模型、Hailuo
    视频、语音、音乐、Talkie、MiniMax Agent，以及开发者 / API 平台；官方材料称其在全球市场拥有 236 million 个人用户和 214,000
    名企业或开发者客户。公开报道显示其商业化和融资能力已有实质信号，包括 2025 年收入 $79 million、2026 年 2 月年经常性收入（ARR）超过 $150 million、2023 年以来融资超过 $850
    million，以及秘密推进香港 IPO。但公开治理、现金、股权结构表和权利管理披露仍有限，因此 MiniMax 应被视为一家已具规模、但仍不透明的后期私有 AI 公司。
