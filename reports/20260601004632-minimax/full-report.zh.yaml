      - number: '8.5'
        title: 尽调要求、退出准备度与最终观点
        blocks:
          - type: paragraph
            body: >-
              剩余工作显而易见且重要。投资者仍需要主要申报文件或等同的审计包，以核对收入、ARR、毛利、亏损、客户集中度和地域组合；需要一份股权结构表视图，以显示早期优先股投资者是否形成有意义的清算优先权悬置；需要
              Hailuo 的量化诉讼准备金和权利治理路线图；还需要更好地拆分增长中有多少来自持久的 B2B 使用，而非质量较低的消费者支出。ChinaTalk 的招股书分析显示，Talkie/Xingye
              仍具有经济重要性，这同时提出利润率质量和监管问题。Yahoo 的 IPO 文章指向基石需求，但基石支持并不等于公开市场能以有吸引力的上市后回报出清。这就是最终姿态仍为观察的原因。MiniMax
              仍可能成为重要的公开 AI 平台，如果审计证据收紧，之后的 IPO 或 crossover 轮可能表现良好。然而，就当前记录而言，有纪律的入场意味着要么等待更多披露，要么等待明显低于传闻中的 >$3
              billion 私募 / >$4 billion IPO 区间的估值。
