      - number: '1.3'
        title: 资本基础、变现信号与规模指标
        blocks:
          - type: paragraph
            body: >-
              即便不考虑后续 IPO 报道，公开融资报道也已经把 MiniMax 放进后期私有公司区间。Bloomberg 和 SiliconANGLE 2024 年 3 月报道称，Alibaba 领投了至少 $600
              million 的融资，估值超过 $2.5 billion，HongShan 也已承诺出资。Reuters 后来报道称，MiniMax 在秘密推进香港 IPO 时，投资方包括 Alibaba、Tencent
              关联实体、HongShan、Hillhouse 和 Yunqi；该 IPO 目标估值超过 $4 billion，可能募资 HK$4 billion 至 HK$5 billion。运营上，MiniMax
              官方材料称其拥有 236 million 用户和 214,000 名企业或开发者客户；KR Asia 披露了比公司自身更细的变现数据：2025 年收入 $79 million，国际收入占比超过
              70%，收入流分为消费者和平台两部分，且 2 月 ARR 超过 $150 million。这些数字是有用的规模信号，但仍属于报道口径，而不是完整公开、经审计的数据室。
