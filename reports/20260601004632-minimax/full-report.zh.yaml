          tone: positive
        - date: '2024-03-05'
          label: 重大融资被报道
          detail: Bloomberg 和 SiliconANGLE 报道，MiniMax 完成至少 $600M 融资，估值超过 $2.5B。
          tone: positive
        - date: '2025-07-16'
          label: 香港 IPO 申报被报道
          detail: Reuters 称 MiniMax 已秘密提交申报，并目标估值超过 $4B。
          tone: positive
        - date: '2025-09-16'
          label: Hailuo 诉讼提交
          detail: Disney、Universal 和 Warner Bros. Discovery 起诉 MiniMax 涉嫌侵犯版权。
          tone: warning
        - date: '2025-10-27'
