      - number: '2.2'
        title: 规模测算视角：宏观 AI 软件上行空间，对比 MiniMax 可见支出轨道
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个有利的市场背景，但不支持一套干净的 TAM/SAM/SOM 堆栈。已审阅材料中最宽的镜头是 Goldman Sachs 的 $150 billion 生成式 AI 软件
              TAM，它只适合作为上限。MiniMax 近期可变现机会窄得多，最好用可观察支出轨道来框定。开发者侧，MiniMax 公布了很低的 API 标价和月度 Token 计划；OpenAI、Anthropic 和
              Google 则公布了明显更高的旗舰 Token 或席位价格。创作者侧，MiniMax 公布月度视频套餐和按视频计费的 API 价格，应用商店证据还显示 Hailuo
              用户有另一套自助订阅阶梯。市场结构侧，即便技术叙事看起来有竞争力，公开报道仍显示中国前沿创业公司与美国实验室之间存在重大变现缺口。因此，正确分析姿态是同时保留几组镜头：宽口径软件
              TAM、当前前沿实验室收入基准、可见自助月度承诺，以及 MiniMax 能借 Hailuo、Talkie、API 平台和企业部署动作触达的具体支出池。
