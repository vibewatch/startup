        - label: 12x ARR
          value: 1800
          unit: $M equity value
        - label: 16x ARR
          value: 2400
          unit: $M equity value
        - label: 20x ARR（约 $3B 私募估值）
          value: 3000
          unit: $M equity value
        - label: 26.7x ARR（约 $4B IPO 目标）
          value: 4000
          unit: $M equity value
    approximationNotes: 以已披露的 >$150 million ARR 下限作为保守锚点。由于公开说法只称 ARR 已超过 $150 million，如果实际 ARR 明显更高，传闻估值对应的真实倍数可能略低。
