  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: MiniMax 将认知转为变现的漏斗，从公开入口开始，以订阅、API 消耗或团队钱包收束。
    data:
      nodes:
        - id: surface
          label: 公开入口
          detail: 用户通过 Talkie、Hailuo、新闻发布、GitHub、Hugging Face 或 API 平台发现 MiniMax。
        - id: trial
          label: 试用 / 免费使用
          detail: 消费者使用免费积分或可选试用；开发者使用免费或低摩擦的开源、API 或智能体入口。
        - id: value
          label: 任务跑通
          detail: 创作者拿到可用媒体，陪伴用户回来再开一轮会话，或开发者完成一次编码 / 智能体任务。
        - id: paid
          label: 付费转化
          detail: 用户在配额或质量需求上升后，购买订阅、token 套餐、积分或按量付费 API 用量。
        - id: team
          label: 团队部署
          detail: 负责人分配 token 套餐席位、启用共享积分，或创建团队钱包，扩大内部使用。
        - id: expand
          label: 扩张 / 集中
