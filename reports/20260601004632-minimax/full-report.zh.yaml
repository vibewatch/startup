        title: 里程碑、IPO 轨迹与反向法律信号
        blocks:
          - type: paragraph
            body: >-
              MiniMax 第一章的时间线已经足够密集，足以影响后续尽调。官方发布显示，从 2025 年末到 2026
              年初，公司在编码模型、角色扮演系统、视频生成、语音和音乐上快速推出旗舰产品，进一步说明它一边扩大产品边界，一边推进 API / 平台策略。外部看，公司从 2024 年 3 月超大融资走到 2025
              年中被报道准备香港 IPO，相比不少 AI 同行，融资节奏明显提速。主要反向权重来自 Hailuo。Reuters Legal 2025 年 9 月报道称，Disney、Universal 和 Warner
              Bros. Discovery 起诉 MiniMax，指控其涉嫌使用受版权保护的角色和视频；Reuters 后来在 2026 年 5 月又报道，MiniMax 驳回该案的动议失败。这个组合很重要：MiniMax
              看起来雄心大、资金足、商业面宽，但也背着正在进行的知识产权风险，可能让分发、营销和公开市场叙事控制变得更复杂。
