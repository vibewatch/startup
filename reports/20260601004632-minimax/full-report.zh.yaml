              具名客户证据最强的地方有两类：经过筛选的开发者平台背书，以及公开的 Hailuo 用户评论。M2.1 发布说明包含多家开发者工具公司的引述，称 MiniMax
              已被集成、受欢迎，或在真实编码工作流中表现突出。这一点有价值，因为它点出了实际交易对手；但它仍然是供应商或生态体系中心化的证明，而不是一份 Fortune 500 采购参考清单。Hailuo 的 Google
              Play 评论提供了另一种证据：它们显示付费或试用用户确实在交易、生成输出、将 Hailuo 与 Kling
              等竞品比较，并在计费或点数显得不公平时提出抱怨。这类证据声望较低，但更直接反映客户行为。不过，持久性仍然披露不足。MiniMax 未公开披露
              NRR、GRR、流失率、合同期限、续约率或产品线留存队列。因此，公开记录能在方向上支持采用和变现，但不能提供机构尽调在承销企业扩张前希望看到的持久性指标。
