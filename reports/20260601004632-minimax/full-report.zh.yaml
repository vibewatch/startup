  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 一手申报文件 / 招股书
        - 完整收入、毛利、亏损、现金、客户集中度和地区披露
        - 没有这些，估值判断就依赖二级报道和管理层口径摘要
        - 索取申报文件、HKEX 递交材料或完整投资者材料。
      - - 股权结构表和优先权
        - 清算优先权、反稀释条款，以及任何 IPO 转换机制
        - 如果早期优先股持有人吃掉上行，即使价格看起来很高也可能不吸引人
        - 在数据室由法律顾问 + 财务团队尽调。
      - - 收入质量
        - B2B 与 B2C 拆分、队列留存、付费席位扩张、流失率和 ARR 桥
        - 决定 ARR 应获得软件式倍数还是消费者应用式倍数
        - 财务工作流和管理层问答。
      - - 诉讼经济性
        - 准备金政策、保险覆盖、补救计划和权利过滤路线图
        - 诉讼已经发生，可能改变商业化经济性
        - 法律尽调和产品权利审查。
      - - 算力和毛利结构
        - 推理成本曲线、GPU 承诺，以及所称训练效率可转化为服务经济性的证据
        - 用来检验低价是战略性选择，还是结构性不可持续
        - 技术尽调 + 财务模型。
      - - 监管 / 产品组合
        - 陪伴应用治理、未成年人控制，以及 Talkie/Xingye 的司法辖区暴露
        - 消费者主导收入可能比企业平台使用承受不同风险折扣
        - 政策法律顾问和信任 / 安全尽调。
    notes: 这些问题是把 MiniMax 从一个有趣故事变成可投资测算资产的最短路径。在它们得到回答前，估值判断应保持保守。
