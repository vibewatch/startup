        - id: coststack
          label: 算力和外包运营
          detail: 云、审核、数据标注和营销仍会实质影响单位经济模型。
          tone: warning
        - id: open
          label: 利润率路径未解
          detail: 公开证据无法闭合 CAC、回本周期、NRR、烧钱速度或现金跑道。
