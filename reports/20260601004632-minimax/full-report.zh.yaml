          detail: 要求保障、支持和合规就绪度。
        - id: apps
          label: 应用商店 / 分发方
          detail: 可要求备案或暂停分发。
      edges:
        - from: cac
          to: talkie
          label: 安全与备案义务
        - from: apps
          to: talkie
          label: 分发验证
        - from: rights
