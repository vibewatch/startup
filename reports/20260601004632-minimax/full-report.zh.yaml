chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品宽度与运营模式
        blocks:
          - type: paragraph
            body: >-
              MiniMax 自己的材料把公司定位为一家全球 AI 基础模型公司，使命是“让智能惠及每个人”，并追求 AGI。产品足迹也支撑这一定位：MiniMax
              并非只有一个聊天机器人。官方来源描述了覆盖文本、音频、图像、视频和音乐的多模态模型家族，并把这些模型接到多个分发入口：MiniMax Agent、Hailuo AI、MiniMax
              Audio、Talkie，以及面向企业和开发者的 Open API Platform。平台和定价文档很关键，因为它们显示公司已经搭出真实商业化层，而不只是研究品牌。MiniMax 公布按量付费的 Token
              价格、月度 Token 计划和独立视频生成套餐；产品页和发布说明也显示，公司持续砸在智能体式编码、视频生成、语音和音乐上。合在一起，公开记录支持这样一个判断：MiniMax 是一家多模态 AI
              公司，既靠直接产品变现，也靠开发者基础设施变现。
