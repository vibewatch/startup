      - number: '5.3'
        title: 视频、语音与音乐产品
        blocks:
          - type: paragraph
            body: >-
              Hailuo 是最显眼的多模态产品家族，也是外部验证最清晰的一条。官方材料描述的视频技术栈已经支持文生视频、图生视频、首尾帧视频、主体参考视频，以及模板驱动的智能体流程。Hailuo 02 和 Hailuo
              2.3 发布说明推进了两条互相关联的叙事：第一，MiniMax 称它通过架构和数据变化提高了原始视频保真度；第二，它主张这些提升以明显低于同业的价格到来。公司自有材料声称 NCR 带来效率提升、原生 1080p
              输出、更强指令跟随，以及一个从单点生成走向更宽多模态装配的 Media Agent。外部证据部分支撑这一叙事：The Decoder 报道了强劲用户基准排名，以及低于 Veo 式替代方案的单视频成本；Play
              列表则确认产品已经在移动端上线，并且现在更偏向广告生成工作流。Speech 和 Music 把同一策略延展到相邻创作者工具。Speech 2.8 强调真实感、声音标签和克隆；Music 2.6
              则从文生音乐扩到翻唱生成、更强结构控制和面向智能体的技能。合在一起，MiniMax 正在打造一个创意套件，但其最激进的质量主张仍高度依赖公司自写证据。
