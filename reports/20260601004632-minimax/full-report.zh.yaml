        title: 诉讼与知识产权悬置风险
        blocks:
          - type: paragraph
            body: >-
              MiniMax 档案中最具体的负面事项，是 Hollywood 版权案件。Reuters、Courthouse News、Variety、CNBC、Straits Times 和 IPWatchdog 均描述了
              Disney、Universal 和 Warner Bros. Discovery 在 2025 年 9 月提出的诉状，指控 MiniMax 未经许可使用受版权保护的作品构建或商业化
              Hailuo，并随后通过可识别的电影公司角色营销该服务。这很重要，因为该诉讼不是笼统的行业类比；它专门指向 MiniMax 和 Hailuo，且诉状既描述了面向客户的输出，也描述了推广材料。Reuters 在
              2026 年 5 月的后续报道同样重要，因为它显示该案经受住了 MiniMax
              早期驳回动议。这并不是实体败诉，但意味着美国诉讼风险已经足够现实，会消耗管理层时间、法律支出，并可能占用产品路线图注意力。对投资者而言，问题不在于侵权是否已经被证明，而在于 MiniMax
              能否在案件发展为赔偿或禁令问题之前，展示可信的权利过滤、准备金规划和产品调整能力。
