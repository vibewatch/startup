      - number: '2.3'
        title: 按产品入口划分买方、用户和付费方
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的买方地图因入口不同而明显变化。Hailuo
              的用户可以是个人创作者、独立工作室、营销人员或社媒运营者；在自助套餐里，付费方可能就是同一个人，一旦视频生成变成经常性工作流，付费方也可能变成小团队预算负责人。Talkie
              的用户和付费方通常是同一名消费者，市场用留存和感知情感价值来出清，而不是企业控制。API
              平台的用户常常是开发者或智能体构建者，但当用量持续后，付款可能从个人银行卡转到团队或产品预算。企业产品团队里，最终用户仍可能是开发者、分析师或创作者，但真正经济买方往往是 CTO、AI 平台负责人、CIO
              或转型办公室，因为支持、吞吐量、安全和部署架构会进入采购。MiniMax 可变现 SAM 因此不主要取决于全球 AI 兴趣总量，而取决于有多少创作者、陪伴用户、开发者和产品团队，会从试用走向在有可衡量 ROI
              的工作流上反复付费。
