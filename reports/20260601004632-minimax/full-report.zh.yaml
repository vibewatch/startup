        title: 产品入口与客户工作流术语
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的官方材料支持一个比典型前沿模型创业公司推介叙事更宽的产品定义。公司卖的不只是语言模型 API。其公开技术栈覆盖 M-series 推理和编码模型、角色扮演 / 聊天层、Hailuo
              视频生成、语音和音乐模型，以及通过 SDK、CLI 和本地部署面向开发者分发。按工作流看，不同用户群会以不同形式遇到 MiniMax：开发者调用 API 或从终端运行智能体，创作者用 Hailuo
              或音乐生成流程生产素材，陪伴聊天用户则与 M2-her
              家族塑造的角色体验互动。文档索引很重要，因为它显示这些是同一平台上的连接入口，而不是彼此孤立的发布。同一棵文档树暴露文本、图像、视频、语音、音乐和文件管理端点。外部证据在 Hailuo
              创作者工作流上最强：Play 列表确认了移动端分发，以及围绕文本 / 视频 / 图像生成和主体参考一致性构建的功能集。结论是，MiniMax
              的产品最好被理解为一个多模态操作层，横跨消费者应用、创作者工具和开发者运行时。
