      - number: '6.5'
        title: 集中度与客户风险
        blocks:
          - type: paragraph
            body: >-
              客户质量是 MiniMax 叙事变弱的地方。第一，最强的公开规模和变现线索仍指向面向消费者的产品，尤其是 Talkie 和 Hailuo，而不是已披露的企业锚定客户。如果价值更高的 API 和团队账户小于
              214,000 这一总体口径，就会产生收入组合风险。第二，陪伴式 AI 面临直接的监管敏感性。CNBC 报道称，中国规则草案针对情感操纵、自残内容、未成年人，以及大型 AI
              陪伴服务的强制安全评估；这些提议直接映射到 Talkie 这类产品。第三，Hailuo 面临版权和来源压力。Reuters 和 Straits Times 描述了重大的 Hollywood 诉讼，指控面向客户的
              Hailuo 输出和推广中使用了受版权保护的角色。最后，Fortune 指出，地缘政治信任、审查和数据治理顾虑可能降低西方企业部署中国模型的意愿。简言之，MiniMax
              有真实用户和付费界面的证据，但集中度、合规、权利和信任障碍都可能拖慢客户质量改善。
