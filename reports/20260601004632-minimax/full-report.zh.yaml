      - number: '1.2'
        title: 创始人锚点、治理不透明与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据远比 MiniMax 的产品证据薄。Reuters 报道称，MiniMax 于 2022 年初由前 SenseTime 高管 Yan Junjie 创立；SiliconANGLE 另称，公司由包括
              Yan 在内的前 SenseTime 员工创立，Yan 之前是 SenseTime 副总裁。KR Asia 后来直接引用 Yan 以创始人兼 CEO 身份讨论公司的平台转型。这足以把 Yan
              锚定为核心公开创始高管，却不足以支撑一个完全透明的治理结构。已审阅的官方材料没有公布清晰的现任董事会名单、委员会图谱或经核实员工数；第三方融资报道列出投资方，却没有披露可核对的股权结构表或控制框架。由此产生真实的尽调不对称：MiniMax
              看起来像一家有规模、有公开市场野心的运营公司，但公开记录仍显示，公司对 Yan 有明显关键人依赖，外部也难看清治理到底如何组织。对一家已经吸引全球用户、开发者和公开市场关注的公司来说，这种不透明值得重视。
