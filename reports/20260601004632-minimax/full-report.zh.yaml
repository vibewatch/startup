  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: MiniMax 的风险向量彼此相关：法律、监管、访问和信任事件会同时传导到转化、审核支出和估值。
    data:
      nodes:
        - id: legal
          label: 版权诉讼
          detail: Hailuo 相关法律行动抬高损害赔偿和产品补救风险。
        - id: reg
          label: 陪伴监管
          detail: Talkie / Xingye 面临安全监管草案、应用商店要求和评估义务。
        - id: access
          label: 供应商访问限制
          detail: Anthropic / OpenAI 式限制可能关上生态大门。
        - id: controls
          label: 更多过滤与安全运营
          detail: 权利控制、人工升级和合规审查会增加成本。
        - id: conversion
          label: 转化放慢
          detail: 创作者、团队和企业会犹豫，或更早流失。
        - id: mix
          label: 收入结构压力
          detail: 消费者占比高或折扣驱动的增长更难抵消。
        - id: margin
          label: 利润率压缩
          detail: 更低定价叠加更高合规成本，会收窄贡献利润率。
        - id: valuation
          label: 估值压力
          detail: 风险堆叠相关性上升后，融资和承销容忍度会收紧。
      edges:
        - from: legal
          to: controls
          label: 可能需要权利过滤或和解
        - from: reg
          to: controls
          label: 增加人工升级处理和备案
        - from: access
          to: conversion
          label: 抬高合作伙伴和买家疑虑
        - from: controls
          to: margin
          label: 更高运营成本
        - from: controls
          to: conversion
          label: 摩擦增加、发布放慢
        - from: conversion
          to: mix
          label: 企业多元化放慢
        - from: mix
          to: margin
          label: 消费者偏重结构延续
        - from: margin
          to: valuation
          label: 增长质量下降
        - from: legal
          to: valuation
          label: 拨备 / 禁令阴影
        - from: reg
          to: valuation
          label: 陪伴产品现金流面临政策不确定性
    claimRefs:
      - CR016
      - CR020
      - CR023
      - CR030
      - CR042
      - CR045
      - CR046
      - CR047
      - CR048
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: MiniMax 不只依赖客户，也依赖监管机构、版权方、应用分发商和企业守门人；这些角色的动作都可能阻断变现。
