    summary: MiniMax 通过消费者应用、开发者 API、额度和创作者套餐变现，但从价目表走到留存毛利，中间仍隔着不透明的折扣和基础设施层。
    data:
      nodes:
        - id: talkie
          label: Talkie / 陪伴支出
          detail: 消费者付费意愿看起来真实，但精确付费人数和续费曲线仍是私有信息。
          tone: positive
        - id: hailuo
          label: Hailuo 视频支出
          detail: 按视频定价和更大的月度套餐，形成直接的创作者变现。
          tone: positive
        - id: api
          label: API 按量付费用量
          detail: 文本、音频、图像、音乐和 MCP 调用按公开价目表计费。
          tone: positive
        - id: plans
          label: Token 套餐和预付额度
          detail: 月度套餐和预付额度把用量转成经常性或预付现金。
          tone: positive
        - id: enterprise
          label: 企业 / 平台交易
          detail: 开放平台和企业服务可能带来更大的定制合同。
          tone: neutral
        - id: gross
          label: 总收入池
          detail: 所有变现入口先汇总，再扣除折扣、额度使用和合作伙伴影响。
          tone: positive
        - id: cost
          label: 云、审核和支持成本
          detail: 外部算力、外包运营和快速模型迭代周期，会压迫留存经济性。
          tone: warning
        - id: retained
          label: 留存毛利
          detail: 公开标价无法揭示各细分市场或渠道的实际利润率。
          tone: neutral
      edges:
