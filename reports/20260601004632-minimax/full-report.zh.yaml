      - number: '4.5'
        title: 财务结论与尽调阻塞：法律暴露和缺失现金数据让承销仍未闭环
        blocks:
          - type: paragraph
            body: >-
              MiniMax
              的正面财务情景已经清晰到值得认真对待。官方文档显示变现入口很多，第三方报道也指向收入、ARR、全球触达和持续外部融资能力。负面情景同样重要。公司在承销最需要的地方仍然财务不透明：没有公开现金余额、没有月度烧钱速度、没有债务时间表、没有合同质量披露、没有渠道抽成率，也没有从总用量到留存毛利的经验证桥。法律风险又加了一层。Reuters、CourtListener
              和其他报道显示，美国制片厂不仅就 Hailuo 涉嫌版权侵权提起诉讼，而且已经挺过驳回挑战，使损害赔偿、禁令、额外合规支出和上市过程中的估值压力都仍有可能。因此，本章底线是谨慎，而不是否定。MiniMax
              可能正在扩张为一家真实的多入口 AI 公司，但在管理层分享经审计报表、云承诺、队列数据和法律准备金假设前，公开证据更支持继续研究，而不是干净承销。
