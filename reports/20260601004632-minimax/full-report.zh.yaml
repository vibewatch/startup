  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑证据
      - 什么会改变判断
    rows:
      - - MiniMax 已不再处于收入前阶段，正在证明真实商业化
        - 投资者页面显示 2025 年收入 $79M、ARR >$150M，以及 214,000+ 企业客户 / 开发者。
        - 一手申报文件确认收入确认质量和可重复的企业使用。
      - - 全球触达支撑其平台化野心
        - KrASIA 称 >70% 收入来自国际市场；Reuters/Yahoo 描述 IPO 兴趣和基石需求。
        - 披露显示这种国际收入组合能盈利，而非主要靠低毛利获客支出撑起。
      - - 如果经得起验证，成本 / 性能主张可能带来上行空间
        - Fortune 称 MiniMax 声称 M1 只用了约 $534,700 的租用算力，可能给前沿玩家施压。
        - 独立基准测试和使用数据验证成本主张及其商业意义。
      - - 当前估值标记明显跑在当前财务质量前面
        - 2024 年估值 >$2.5B，对应 $30.5M 收入；$3B-$4B 标记意味着 20x-27x ARR 或 38x-51x 收入。
        - 经审计的利润率扩张、更强企业收入组合和更快 ARR 增长弥合差距。
      - - Talkie 主导的变现质量可能低于企业叙事暗示
        - ChinaTalk 称 Talkie/Xingye 仍是最大收入贡献者，平均消费仅约 $5。
        - 收入组合明显转向留存更高的 B2B / 平台使用。
      - - 法律悬顶可能直接压缩估值
        - Reuters 称片方寻求利润返还和禁令式命令；Reuters 后续称 MiniMax 驳回诉讼的动议失败。
        - 和解、驳回，或可信的权利控制能显著降低商业化风险。
