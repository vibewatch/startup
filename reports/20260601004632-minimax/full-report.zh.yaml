      - number: '8.4'
        title: 情景区间与下行传导
        blocks:
          - type: paragraph
            body: >-
              情景分析在这里很重要，因为几乎所有有利估值输入仍是报道口径，而不是完整申报口径。在乐观情景中，MiniMax 将已披露的 ARR 动能转化为明确由企业牵引的平台故事，将 ARR 推高至 $200 million
              以上，把毛利率提升至接近或超过 35%，并在任何补救措施冲击商业化之前控制法律和政策风险。这可以支持 $3.5 billion 至 $5.0 billion 的结果。基准情景更保守：ARR
              继续增长，但收入组合仍部分由消费者驱动，毛利率维持在 20% 中段至 30% 低段，且公司仍必须激进定价来赢得份额。在这一路径上，约 $1.8 billion 至 $3.0 billion
              看起来更可支撑。悲观情景并非理论。Disney/Universal/WBD 诉讼仍在进行，MiniMax
              已经未能早期驳回，所请求的救济包括利润返还以及在缺少保护措施时停止侵权的命令。如果这些风险与倍数压缩和企业转化放缓相结合，$0.9 billion 至 $1.5 billion
              的估值区间就变得合理。Fortune 关于超低成本 M1 训练的报道是有趣的上行燃料，但即便 Fortune 也强调该说法未被独立验证，因此它不能自行抹去下行。
