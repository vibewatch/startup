        title: 语言、编码与角色扮演模型核心
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的官方产品姿态在语言技术栈上最清楚。平台文档现在显示，M3 是最新的智能体式、多模态、1M 上下文旗舰；M2.7、M2.5、M2.1、M2 和 M2-her
              则仍服务更具体的任务。这种分层很重要，因为 MiniMax 并不是在营销一个万能模型；它在区分前沿长上下文推理、更便宜 / 更高速的编码模型，以及专用角色扮演模型。M2 和 M2.1
              发布材料尤其强调智能体式编码和工具使用。官方主张突出多语言代码、移动和 Web 应用开发、办公任务执行，以及在外部智能体脚手架上的顺滑行为。最有技术含量的公开披露不在营销页，而在 M2 架构文章中。这些文章解释了
              MiniMax 为什么坚持全注意力，为什么把交错思考视为运营上重要，以及为什么历史保留属于产品使用的一部分，而不只是模型训练。角色扮演侧，M2-her
              文章有价值，因为它显示产品意图：保留长尾角色声音，管理长周期叙事一致性，并个性化节奏，而不是只优化泛化对话质量。仍缺少更多验证的是，公司的自有评测主张能否在自家基准之外转化为持久生产优势。
