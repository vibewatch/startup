  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：MiniMax 面对四个重叠市场，而不是一个泛化 TAM
        blocks:
          - type: paragraph
            body: >-
              分析 MiniMax 时，不能把它当作只卖进一个无差别生成式 AI 市场的公司。自身产品证据指向四个相互重叠、但并不相同的支出池。第一是前沿多模态模型和 API 支出，开发者和产品团队购买
              Token、吞吐量和模型访问。第二是消费者 AI 创作支出，Hailuo、Speech 和 Music 支撑创作者与营销人员的图像、视频、语音和配乐工作流。第三是社交或陪伴式 AI 支出，Talkie 和
              M2-her 角色扮演技术栈比拼的是留存、角色还原度和情感投入，而不是原始 Token
              量。第四是企业助手和智能体部署支出，买方除模型质量外，还关心支持、分析、合规和上线服务。这些市场会互相影响，但纳入的支出、买方和替代品集合并不一样。现状替代方案也因入口而异：创作者可用代理机构和剪辑软件，开发者可用人类程序员和既有
              API，陪伴式 AI 则面对消费者娱乐应用。把这一切都视为一个 TAM，会掩盖真正的采用逻辑。
