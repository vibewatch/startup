    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: MiniMax 的可见轨迹从 2022 年初创立开始，经过 2024 年一轮重要融资，延伸到 2025–2026 年模型发布、IPO 准备和正在进行的 Hailuo 诉讼。
    data:
      items:
        - date: early 2022
