  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以已披露的 >$150 million ARR 参考点为锚，不同 ARR 倍数对应的隐含股权价值敏感性。
    data:
      items:
        - label: 8x ARR
