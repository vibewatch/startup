  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 好莱坞 IP 诉讼
        - 案件态势恶化
        - 初步禁令推进、证据开示制裁，或和解带来重大产品限制
        - 暂停投资判断，或按法律准备金和产品影响情景重切估值
      - - 陪伴产品监管
        - CAC 制度从草案变成正式规则并收紧
        - 最终规则逐项对应现有 Talkie/Xingye 流程，且看不到准备就绪证据
        - 在假设陪伴产品现金流耐久前，要求拿出运营控制证明
      - - 蒸馏 / 访问限制
        - 西方模型厂商收紧限制，或发布更多针对 MiniMax 的执法主张
        - 关键访问渠道丧失、反复出现欺诈指控，或合作伙伴下架
        - 将生态访问视为受损，并提高地缘政治 / 信任折价
      - - 企业信任 / 保障缺口
        - 管理层推动更大 B2B 客户时，公开包装仍然薄
        - 尽管冲刺企业客户，却没有信任中心、认证包、DPA 路径或 SLA 安排
        - 假设企业转化更慢，收入组合质量更低
      - - 价格压缩与产能压力
        - 同价性能升级继续推进，但看不到支持或利用率余量
        - 反复折扣、RPM 瓶颈，或当前标价下支持负担上升
