  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: MiniMax 以共享多模态模型底座为基础，向上叠出消费者产品、创作者应用、智能体工具、API 和开放权重部署。
    data:
      layers:
        - id: surface
          label: 用户触达层
          detail: 陪伴聊天、创作者视频 / 音乐工具、终端 / CLI 工作流和直接 API 调用，分别把 MiniMax 送到不同入口。
        - id: applications
          label: 应用层
          detail: MiniMax Agent、Hailuo、角色扮演 / 聊天体验、语音和音乐，把特定模态工作流打包给不想直接使用原始 API 原语的用户。
        - id: models
          label: 模型层
          detail: M3、M2.7、M2.5、M2.1、M2、M2-her、Hailuo、speech 和 music 系列覆盖推理、编码、角色扮演、视频和音频生成。
        - id: orchestration
          label: 编排层
          detail: 交错式思考、异步任务处理、提示缓存、文件检索和工具调用逻辑，把模型输出接到可用工作流里。
        - id: protocols
          label: 协议与工具层
          detail: Anthropic / OpenAI 兼容、SDK 快速入门、MCP、Mini-Agent 和 CLI，让开发者把 MiniMax 接入现有技术栈。
        - id: deployment
          label: 部署与分发层
          detail: 托管 API 与 Hugging Face 开放权重发布并行，并提供面向 vLLM、SGLang 和 MLX 的本地部署指引。
