  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与竞品分类
        blocks:
          - type: paragraph
            body: |2-
                      MiniMax 面对的竞争场域，比简单的“聊天机器人排行榜”更宽。在直接前沿竞争中，它会在 API 质量、编码表现和开发者心智上与 OpenAI、Anthropic、Google Gemini、DeepSeek 和 Qwen 比较。在消费者和创作者应用中，它还要与 ByteDance 的 Doubao/Seedance 技术栈、Tencent 的 Hunyuan 加 Yuanbao 组合，以及 Baidu 的 ERNIE/Yiyan 助手竞争。这些中国对手重要，是因为它们会在本土同时压缩价格和分发：有的消费者入口装机更强，有的提供开放权重或兼容性友好的替代方案，有的能借母公司渠道推进 AI。现状替代方案同样有分量。买方可以继续使用公司内部已批准的 ChatGPT 或 Gemini，可以依赖内部开发团队自托管 Qwen 或 DeepSeek，也可以干脆等到企业治理更清晰后再迁移。因此，MiniMax 不只是要在基准上打败某一个模型；它必须在成本、创意输出、编码智能体实用性和信任上同时取胜，还要防住 Zhipu 等新进入者，它们正把中国源头 AI 推向国际市场。
                    
