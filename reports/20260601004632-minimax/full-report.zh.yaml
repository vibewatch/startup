            body: >-
              MiniMax 显然已经超越研究实验室状态，但变现质量仍然参差。KrASIA 报道称，2025 年收入为 $79 million，同比增长 158.9%，超过 70% 来自国际市场，毛利为 $20.1
              million，且到 2 月 ARR 超过 $150 million。这是强劲的收入线势头。问题在于是什么类型的收入在支撑叙事。ChinaTalk 称，Talkie/Xingye 仍贡献最大收入份额，该应用在
              2025 年前九个月拥有约 20 million 月活跃用户，而 Hailuo 为 5.6 million，且同期 Talkie/Xingye 平均客户支出仅约 $5。MiniMax
              也公开发布非常低的自助价格：月度 token 计划为 $20、$50 和 $120，核心文本模型 API 定价为每百万 token 输入 $0.3、输出
              $1.2。这些界面支持采用，但也意味着当前变现案例很大一部分依赖交易量，而非溢价定价。在 2025 年调整后净亏损仍为 $250 million 的情况下，市场必须承销未来经营杠杆，而不是当前盈利质量。
