  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险
      - 影响
      - 尽调路径
    rows:
      - - API、开放权重和 CLI 带来的免费 / 开放开发者入口
        - 214K 头部数字里，大量可能是低价值试用者，而非稳定付费账户
        - 会抬高漏斗顶部，却不能保证形成稳定 B2B 收入
        - 将披露的企业 / 开发者数量拆成免费、自助付费和签约企业队列
      - - 从 Token Plan 到 Teams 再到按量付费钱包
        - 尽管团队包装清晰，具名企业客户仍然稀疏
        - 可能拖慢企业信任和采购接受的证明
        - 索取头部客户名单、合同期，以及按计划类型拆分的扩张收入
      - - Hailuo 创作者采用
        - 收入可能仍集中在创作者订阅和一次性点数购买
        - 消费端波动会推高流失和退款压力
        - 索取订阅用户队列、退款率，以及创作者与营销用户组合
      - - Talkie / 陪伴应用互动
        - 陪伴应用可能仍是收入贡献中占比过高的一块
        - 高度依赖受监管且情感敏感的用例
        - 索取按产品和地域拆分的收入集中度，以及监管预案
      - - Hailuo 内的营销 / 广告生成器推进
        - 可能吸引更高价值的 SMB 需求，但也带来更高内容责任暴露
        - 提升变现潜力，同时抬高来源证明和品牌安全要求
        - 索取面向营销用户的审核、权利筛查和企业赔偿立场
      - - 全球扩张
        - 70%+ 国际收入改善多元化，但信任门槛可能限制西方企业采用
        - 即便试用使用强劲，也会拖慢企业转化
        - 索取按地域和受监管行业暴露拆分的客户结构
      - - 开源生态势头
        - 社区采用可能真实存在，但若竞品价格 / 性能改善，使用会迁移
        - 开发者使用未必转成粘性收入
        - 索取 OSS / 社区使用向付费席位或 API 支出的转化漏斗
      - - 围绕 Hailuo 的版权诉讼
        - 权利纠纷未决期间，企业和创作者客户可能不愿扩大使用
        - 可能压低付费意愿，或要求成本高昂的控制
        - 索取诉讼准备金、客户沟通和来源证明路线图
