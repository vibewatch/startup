              月的更新明确限制来自中国等未支持地区的受控实体，即使通过离岸子公司也不例外。这意味着对西方模型供应商、路由网络或外部基准渠道的任何依赖，都可能在政策压力或欺诈执法下消失。换言之，蒸馏叙事不只是声誉噪音：即使在监管机构正式行动之前，它也可能变成具体的准入、合作和信任问题。
