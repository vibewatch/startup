        title: 陪伴应用安全与监管风险
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的第二大风险集群位于陪伴式 AI，而不是纯 API 基础设施。公司自有材料清楚表明，情感或角色扮演互动是真实产品界面，且 CNBC 报道称 Talkie 和 Xingye
              在所引用期间贡献了超过三分之一收入。这使得 CAC 关于拟人化交互式 AI
              的措施草案高度相关。草案文本异常具体：禁止情感操纵、鼓励自残、赌博内容、诱导非理性决策和有害依赖设计；同时要求未成年人模式、在明确自杀或自残场景下由人工接管、数据删除选项，以及在用户规模跨越既定阈值后进行正式安全评估。应用商店也被纳入控制链条。这些尚未构成对
              MiniMax
              的最终执法，因此投资者应保留细致判断。但作为政策映射，匹配度很直接：一个规模化陪伴产品，涉及未成年人、依赖、安全和应用分发暴露，如今处在监管机构定义的类别中，其合规负担在运营上沉重，并可能摊薄利润率。
