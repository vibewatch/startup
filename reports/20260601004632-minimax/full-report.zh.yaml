  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与官方价格入口：MiniMax 公布了广泛标价，但未披露真实经济性
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的公开材料让收入漏斗顶部远比底部更容易看见。官方页面和平台文档至少展示了 5 类变现入口：按 Token 定价的文本 API、Token Plan
              订阅、预付积分、按视频生成加更大视频套餐，以及额外的语音、音乐、图像和智能体相关用量。公司还营销 Talkie、Hailuo AI 和 MiniMax Agent
              等消费者产品，这很重要，因为它并未把自己呈现为纯企业 API
              供应商。话虽如此，此处官方记录更像价目表，而不是会计报表。公开文档显示标价、包含额度、视频单元扣减和套餐阶梯，但没有披露实际折扣、渠道费用、退款行为、企业最低承诺，也没有说明自助式合同与销售主导合同之间如何确认收入。财务上，本章第一个结论很直接：MiniMax
              有许多可见收费方式，但公开定价透明度不应被误认为净收入质量也透明。
