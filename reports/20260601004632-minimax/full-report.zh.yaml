  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 MiniMax 是否令人印象深刻；而是公开证据是否支持近期据报估值标记所隐含的价格。按这个标准，答案还不是。Bloomberg 和 SiliconANGLE 描述了一轮 2024
              年融资，金额至少为 $600 million，估值超过 $2.5 billion。Yahoo 后来称公司估值约为 $3 billion，而 Reuters 报道称，一项保密的香港 IPO 可能寻求超过 $4
              billion 的估值，并募资约 HK$4 billion 至 HK$5 billion。这些是严肃的资本市场信号，但它们面对的仍是一家公司：其已披露 2025 年收入为 $79 million，ARR
              只是最近才超过 $150 million，调整后净亏损仍为 $250 million。这样的组合使公司值得关注，但对价格敏感。我的建议是观察，而不是按据报水平买入：MiniMax
              拥有足够的产品广度、增长和投资者兴趣，值得持续关注；但在缺少主要申报文件、经审计披露和明确法律准备金可见度的情况下，当前证据基础不足以支撑传闻中的 $3 billion 至 $4 billion 区间。
