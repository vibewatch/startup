  - id: diligence-asks-exit-readiness-and-final-view
    title: Diligence asks, exit readiness, and final view
    body: >-
      The remaining work is obvious and material. Investors still need a primary filing or equivalent audited package
      that reconciles revenue, ARR, gross profit, loss, customer concentration, and geographic mix; a cap-table view
      showing whether earlier preferred investors create meaningful preference overhang; a quantified litigation reserve
      and rights-governance roadmap for Hailuo; and a better breakdown of how much of growth is durable B2B usage versus
      lower-quality consumer spending. ChinaTalk's prospectus analysis suggests that Talkie/Xingye remains economically
      important, which raises both margin-quality and regulatory questions. Yahoo's IPO article points to cornerstone
      demand, but cornerstone support is not the same as public-market clearing at attractive aftermarket returns. That
      is why the final posture remains Track. MiniMax may still become a major public AI platform, and a later IPO or
      crossover round could work well if audited evidence tightens. As of the current record, however, disciplined entry
      means waiting for either more disclosure or a materially lower valuation than the rumored >$3 billion private /
      >$4 billion IPO range.
