  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Copyright case worsens materially
        - Injunction traction, major adverse ruling, or reserve requirement that changes unit economics
        - Direct hit to Hailuo commercialization, investor confidence, and IPO appetite
        - Pause underwriting; re-cut bear case immediately.
      - - ARR stalls or quality disappoints
        - No clear progress beyond >$150M ARR or evidence that ARR is mostly low-quality / promotional
        - Breaks the argument that valuation premium reflects durable platform monetization
        - Move fair-value center below the base-case band.
      - - Gross margin stays near mid-20s despite scale
        - No move toward 30%-35% after additional scale or filing disclosure
        - Suggests pricing power is weak and cost advantage is not flowing into software-quality economics
        - Do not pay premium multiples.
      - - Talkie / consumer mix remains dominant
        - Consumer companion revenue still drives the majority of monetization without better spend quality
        - Raises margin, regulatory, and retention risk relative to enterprise-platform narrative
        - Apply a larger discount to valuation and exit probability.
      - - Disclosure remains thin into listing process
        - No primary prospectus, no cap-table clarity, and no quantified legal reserve
        - Prevents reliable underwriting of dilution, cash needs, and downside
        - Stay on Track / pass until diligence pack improves.
    notes: >-
      Triggers are designed to be monitorable rather than abstract. Each threshold is chosen because it can be linked
      directly to valuation compression, financing friction, or both.
