  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Primary filing / prospectus
        - Full revenue, gross profit, loss, cash, customer concentration, and regional disclosure
        - Without it the valuation case depends on secondary reporting and management-linked summaries
        - Request the filing, HKEX submission, or full investor deck.
      - - Cap table and preferences
        - Liquidation preferences, anti-dilution terms, and any IPO conversion mechanics
        - A rich price can still be unattractive if earlier preferred holders absorb upside
        - Counsel + finance diligence in the data room.
      - - Revenue quality
        - B2B vs B2C split, cohort retention, paid-seat expansion, churn, and ARR bridge
        - Determines whether ARR deserves software-like or consumer-app-like multiples
        - Finance workstream and management Q&A.
      - - Litigation economics
        - Reserve policy, insurance coverage, remediation plan, and rights-filter roadmap
        - The lawsuit is already live and could alter commercialization economics
        - Legal diligence and product-rights review.
      - - Compute and margin structure
        - >-
          Inference cost curve, GPU commitments, and evidence that claimed training efficiency translates into serving
          economics
        - Needed to test whether low prices are strategic or structurally unsustainable
        - Technical diligence plus finance model.
      - - Regulatory / product mix
        - Companion-app governance, minors controls, and jurisdictional exposure for Talkie/Xingye
        - Consumer-led revenue may carry a different risk discount than enterprise platform usage
        - Policy counsel and trust / safety diligence.
    notes: >-
      These asks are the shortest path to converting MiniMax from an interesting story into an underwritable asset.
      Until they are answered, the valuation call should remain conservative.
