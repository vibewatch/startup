  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: primary-filing
      missingEvidence: >-
        The on-disk source set still lacks a primary MiniMax prospectus or equivalent filing that reconciles revenue,
        ARR, gross profit, losses, customer concentration, and capital structure.
      whyItMatters: >-
        Without a primary filing, the valuation case relies on secondary reporting and commentary about the prospectus
        rather than the prospectus itself.
      diligencePath: >-
        Obtain the HKEX filing, investor deck, or audited filing package directly and reconcile all published numbers
        against it.
      relatedQuestionRefs:
        - QV005
        - QV032
    - type: private-evidence-only
      severity: blocking
      topic: cap-table
      missingEvidence: >-
        Full preference stack, anti-dilution terms, conversion mechanics, and any IPO-specific overhang from prior
        rounds remain undisclosed in the local evidence set.
      whyItMatters: >-
        A rich headline valuation can still produce poor returns if earlier preferred holders absorb a disproportionate
        share of exit value.
      diligencePath: Request the cap table, charter documents, and IPO conversion analysis from counsel or the data room.
      relatedQuestionRefs:
        - QV032
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: No on-disk cohort retention, churn, ARPU bridge, or B2B vs B2C gross-margin split is available.
      whyItMatters: >-
        Those items determine whether ARR deserves an enterprise-platform multiple or a lower-quality consumer-app
        multiple.
      diligencePath: >-
        Request cohort tables, gross-margin by segment, and management bridge between consumer, developer, and
        enterprise monetization.
      relatedQuestionRefs:
        - QV011
        - QV012
        - QV014
        - QV015
    - type: private-evidence-only
      severity: material
      topic: litigation-economics
      missingEvidence: >-
        The public record does not quantify reserve policy, insurance coverage, or remediation cost for the Hailuo
        copyright case.
      whyItMatters: >-
        The lawsuit is already live and could transmit directly into product limits, compliance costs, or valuation
        discounting.
      diligencePath: Review legal memos, reserve analysis, insurance coverage, and rights-filter rollout plans.
      relatedQuestionRefs:
        - QV025
        - QV026
        - QV027
        - QV032
    - type: enumeration-incomplete
      severity: material
      topic: private-ai-comparables
      missingEvidence: >-
        The frontier-AI private comparable set remains thin because most peers do not publish both revenue and valuation
        with enough precision for apples-to-apples comparison.
      whyItMatters: It limits confidence in any attempt to defend or reject MiniMax’s price solely on peer-round narratives.
      diligencePath: Track future filings, secondary marks, and new financing disclosures for pure-play AI companies.
      relatedTableRefs:
        - TV003
      relatedQuestionRefs:
        - QV020
        - QV021
    - type: conflicting-data
      severity: material
      topic: current-valuation-mark
      missingEvidence: >-
        SCMP cited a lower Crunchbase-based valuation path while Reuters and Yahoo described materially higher private /
        IPO marks.
      whyItMatters: >-
        Conflicting marks raise the possibility that investors are comparing non-equivalent rounds, databases, or
        post-money assumptions.
      diligencePath: Confirm exact post-money valuation, share count, and round chronology directly from primary issuance documents.
      relatedQuestionRefs:
        - QV033
