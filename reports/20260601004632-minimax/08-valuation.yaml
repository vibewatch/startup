  - id: monetization-quality-and-revenue-mix
    title: Monetization quality and revenue mix
    body: >-
      MiniMax has clearly moved beyond research-lab status, but the quality of monetization is still mixed. KrASIA
      reports 2025 revenue of $79 million, up 158.9% year over year, with more than 70% coming from international
      markets, gross profit of $20.1 million, and ARR above $150 million by February. That is strong top-line momentum.
      The issue is what kind of revenue is carrying the story. ChinaTalk says Talkie/Xingye still contributes the
      largest share of revenue, that the app had around 20 million monthly active users in the first nine months of 2025
      versus 5.6 million for Hailuo, and that the average Talkie/Xingye customer spent only about $5 in that period.
      MiniMax is also openly publishing very low self-serve prices: monthly token plans at $20, $50, and $120, plus API
      pricing at $0.3 input and $1.2 output per million tokens for core text models. Those surfaces support adoption,
      but they also imply that a large part of the current monetization case rests on volume, not premium pricing. With
      2025 adjusted net loss still at $250 million, the market must underwrite future operating leverage rather than
      current earnings quality.
    claimRefs:
