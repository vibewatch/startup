callouts:
  - calloutType: recommendation
    title: Recommendation — Track
    body: >-
      MiniMax is worth tracking closely, but not at a price that assumes public-company-quality evidence already exists.
      Wait for a primary filing or a materially lower entry point before treating the current story as investable.
    claimRefs:
      - CV043
      - CV049
      - CV050
  - calloutType: risk
    title: Legal discount is not optional
    body: >-
      The Disney / Universal / Warner Bros. Discovery case is live, the dismissal attempt already failed, and the
      requested remedies include profits plus an order halting infringement without protections. That should be treated
      as a valuation discount, not background noise.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - calloutType: insight
    title: ARR matters more than raw hype
    body: >-
      The clearest public anchor is not the rumor mill around a $4 billion IPO; it is the disclosed statement that ARR
      has passed $150 million. Even on that more generous base, the rumored marks still imply premium multiples that
      require better proof than the current record offers.
    claimRefs:
      - CV015
      - CV042
      - CV043
      - CV046
