    summary: IC-style scoring of MiniMax across scale, monetization, risk, valuation, and evidence quality.
    data:
      items:
        - label: Product breadth
          value: 8/10
          note: Multimodal stack and broad product surface are real and commercially visible.
        - label: Revenue momentum
          value: 8/10
          note: Reported 2025 revenue growth and ARR progression are strong.
        - label: Enterprise proof
          value: 6/10
          note: 214,000+ enterprise clients / developers is meaningful, but cohort quality remains opaque.
        - label: Monetization quality
          value: 4/10
          note: Talkie mix, low spend per consumer, and aggressive pricing limit premium confidence.
        - label: Margin quality
          value: 3/10
          note: 25.4% gross margin and $250M adjusted net loss do not yet support a scarcity multiple.
        - label: Legal / policy risk
          value: 2/10
          note: Live copyright case and broader companion / content risks warrant a discount.
        - label: Valuation fairness
          value: 3/10
          note: Reported marks sit far above public AI/software reference multiples.
        - label: Evidence quality
          value: 4/10
          note: Enough to bracket the range, not enough to underwrite with high conviction.
    approximationNotes: Scores are judgmental and relative, on a 1-10 scale where higher is better. They summarize public evidence only.
