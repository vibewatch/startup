company:
  name: MiniMax
chapter:
  number: 8
  title: Valuation
  letter: V
  summary: >-
    MiniMax looks commercially real but publicly under-disclosed for the price implied by reported private and IPO
    marks. Reported funding signals, ARR, and product breadth support a serious platform story, yet the disclosed
    revenue base, sub-software gross margin, ongoing copyright litigation, and aggressive pricing make a >$3 billion
    private mark or >$4 billion IPO target look stretched relative to current public AI/software multiples. The
    investable posture is Track: do not chase rumored pricing until a primary filing or equivalent audited disclosure
    proves revenue quality, enterprise durability, and legal-risk containment.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The core valuation question is not whether MiniMax is impressive; it is whether the public evidence supports the
      price implied by recent reported marks. On that test, the answer is not yet. Bloomberg and SiliconANGLE describe a
      2024 financing of at least $600 million at a valuation above $2.5 billion. Yahoo later described the company at
      around $3 billion, while Reuters reported that a confidential Hong Kong IPO could target a valuation above $4
      billion and raise roughly HK$4 billion to HK$5 billion. Those are serious capital-market signals, but they still
      sit against a business whose disclosed 2025 revenue is $79 million, whose ARR only recently passed $150 million,
      and whose adjusted net loss remained $250 million. That combination makes the company interesting but
      price-sensitive. My recommendation is Track rather than buy at reported levels: MiniMax has enough product
      breadth, growth, and investor interest to merit continued attention, but the current evidence base does not
      justify paying the rumored $3 billion to $4 billion range without a primary filing, audited disclosures, and
      explicit legal-reserve visibility.
    claimRefs:
