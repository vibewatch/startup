  - id: TV003
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        This reference set intentionally combines MiniMax's own reported marks with four public AI/software names that
        have current market-cap and revenue disclosures plus fresh 2026 10-K pages on EDGAR. It is not exhaustive
        because most frontier-AI private peers do not publish comparable revenue and valuation data.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - MiniMax 2024 financing
        - Valuation / 2024 revenue
        - '>$2.5B on $30.5M revenue (~82.0x)'
        - Best clean historical private mark for MiniMax itself.
        - Private round; no audited filing on disk; 2024 revenue comes from later IPO reporting.
      - - MiniMax later private mark
        - Valuation / 2025 revenue and ARR
        - ~$3.0B on $79M revenue (~38.0x) or >$150M ARR (20.0x)
        - Useful midpoint between the 2024 round and IPO talk.
        - Reported by media rather than confirmed in a primary filing.
      - - MiniMax rumored IPO target
        - Valuation / 2025 revenue and ARR
        - '>$4.0B on $79M revenue (~50.6x) or >$150M ARR (~26.7x)'
        - Most relevant current price reference if the company lists soon.
        - Rumored target can move with market conditions; prospectus not cited directly here.
      - - Adobe
        - Market cap / TTM revenue
        - $104.77B / $24.45B (~4.29x)
        - Large profitable creative-software comp exposed to gen-AI monetization.
        - Much larger, mature, and structurally more profitable than MiniMax.
      - - Duolingo
        - Market cap / TTM revenue
        - $5.18B / $1.09B (~4.75x)
        - Consumer subscription app comp with AI and strong engagement dynamics.
        - Language learning differs from frontier-model infrastructure and AI companionship.
      - - C3.ai
        - Market cap / TTM revenue
        - $1.56B / $0.30B (~5.20x)
        - Public pure-play AI software reference.
        - Enterprise AI software stack differs from MiniMax's multi-product consumer + platform mix.
      - - GitLab
        - Market cap / TTM revenue
        - $5.24B / $0.95B (~5.52x)
        - Developer-platform comp relevant to code and agent monetization.
        - Still not a frontier-model lab and carries lower legal / policy risk.
    notes: >-
      Public rows use market cap rather than enterprise value because debt/cash detail was not collected here; the table
      is a directional valuation sanity check, not a precise fairness opinion. The striking point is range separation:
      MiniMax's own marks sit multiples above public software references.
