  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - >-
          Reported growth and funding are real, but public evidence does not yet support paying the rumored private or
          IPO mark.
        - Do not commit at >$3B private / >$4B IPO indications before primary disclosure.
      - - Confidence
        - Medium
        - >-
          Enough third-party reporting exists to bracket the range, but no on-disk primary prospectus or audited package
          resolves revenue quality and cap-table details.
        - Re-rate only after filing-grade disclosure is available.
      - - Risk rating
        - High
        - >-
          Live copyright suit, incomplete disclosure, aggressive pricing, and still-large losses make underwriting
          fragile.
        - Demand litigation, reserve, and governance diligence before any term-sheet work.
      - - Valuation stance
        - Stretched
        - >-
          Reported marks imply 20x-27x ARR or 38x-51x revenue, well above roughly 4x-6x public AI/software
          market-cap/revenue references.
        - Any entry above the base-case band requires unusually strong upside conviction.
      - - Return profile today
        - Asymmetric only at a lower entry
        - >-
          The upside exists if ARR compounds and legal risk fades, but current public evidence leaves little margin of
          safety at the rumored price.
        - Prefer waiting for a reset toward ~$2B-$2.5B or stronger audited proof.
    notes: >-
      This table is price-sensitive rather than company-quality-only. Assessments reflect public evidence available in
      the cited source set as of the report run, not private diligence materials.
