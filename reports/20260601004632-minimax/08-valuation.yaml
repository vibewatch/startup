  - id: TV007
    title: Pricing surface comparison table
    columns:
      - Provider
      - Reference model / product
      - Public price point
      - Relative to MiniMax
      - Valuation implication
    rows:
      - - MiniMax
        - M2.7 API
        - $0.3 input / $1.2 output per 1M tokens
        - Baseline
        - Supports adoption but limits evidence for premium pricing power.
      - - OpenAI
        - GPT-5.5 API
        - $5 input / $30 output per 1M tokens
        - MiniMax is ~94% cheaper on input and ~96% cheaper on output
        - MiniMax can position as value leader, but that also implies revenue quality must come from volume.
      - - Anthropic
        - Sonnet 4.6 API
        - $3 input / $15 output per MTok
        - MiniMax is ~90% cheaper on input and ~92% cheaper on output
        - Aggressive discounting helps land usage but can compress gross margin.
      - - Google
        - Gemini paid tier reference
        - $1.50 input / $9 output per 1M tokens
        - MiniMax is ~80% cheaper on input and ~87% cheaper on output
        - Competitive price intensity argues against paying a scarcity-style valuation premium today.
    notes: >-
      This is not a pure performance comparison. It is a monetization-quality lens showing that MiniMax is competing
      with a very aggressive price posture relative to major frontier peers.
