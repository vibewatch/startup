  - id: comparable-set-and-multiple-compression
    title: Comparable set and multiple compression
    body: >-
      The cleanest way to avoid false precision is to triangulate MiniMax against disclosed public software and
      AI-adjacent companies, then compare that range with MiniMax's own private and IPO indications. Adobe, Duolingo,
      C3.ai, and GitLab all trade at roughly 4.3x to 5.5x market cap to revenue using June 2026 market-cap data and the
      latest reported revenue on CompaniesMarketCap, with fresh 2026 10-K filings visible on EDGAR for each issuer.
      Those are imperfect comparables: Adobe is far larger and more profitable, Duolingo is a consumer subscription
      business, C3.ai is a pure-play public AI name, and GitLab is a developer platform. But they still set a useful
      public-market reality check. MiniMax's own reported marks are far richer. The 2024 $2.5 billion valuation equals
      about 82x 2024 revenue of $30.5 million. A $3 billion private mark implies about 38x 2025 revenue or 20x ARR, and
      a >$4 billion IPO target implies roughly 51x 2025 revenue or nearly 27x ARR. That premium might eventually be
      justified if MiniMax proves frontier-model efficiency, enterprise durability, and rapid ARR compounding. Today,
      public evidence supports growth quality, not that level of valuation certainty.
