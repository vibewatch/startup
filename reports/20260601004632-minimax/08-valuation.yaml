  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          ARR exceeds $200M, gross margin approaches or exceeds 35%, enterprise/platform mix rises, and litigation /
          policy risk is contained without commercial disruption.
        - >-
          $3.5B-$5.0B. Requires the market to keep paying a frontier-AI premium because growth quality improves
          meaningfully.
        - Model-cost claims fail to verify; enterprise conversion disappoints; legal remedies bite sooner than expected.
        - Low. Public evidence hints at upside but does not yet prove it.
      - - Base
        - >-
          ARR grows from the disclosed >$150M level, revenue mix remains mixed, gross margin stays in the high-20s or
          low-30s, and legal overhang remains manageable but unresolved.
        - $1.8B-$3.0B. Roughly 12x-20x ARR on a still-fast-growing but under-disclosed business.
        - Public-market multiple compression, consumer mix staying too large, and lack of filing-grade disclosure.
        - Medium. Best fit with the evidence currently on disk.
      - - Bear
        - >-
          Litigation, regulatory friction, or competition slows monetization; aggressive pricing persists; public-market
          comps remain near ~5x revenue; legal reserves and compliance costs rise.
        - $0.9B-$1.5B. Equivalent to heavy de-rating toward 6x-10x ARR or a more punitive revenue lens.
        - Injunction-style constraints, rights-filter costs, weak enterprise conversion, or down-round dynamics.
        - Medium. Not a tail risk given the live legal process and still-lossy economics.
    notes: >-
      These ranges are scenario bands, not point estimates. The base case intentionally leans conservative because
      MiniMax has reported momentum but still lacks the primary disclosure package that would justify narrow valuation
      precision.
