  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - MiniMax is no longer pre-revenue and is demonstrating real commercialization
        - 2025 revenue of $79M, ARR >$150M, and 214,000+ enterprise clients / developers on the investor page.
        - Primary filing confirms revenue-recognition quality and repeatable enterprise usage.
      - - Global reach supports a legitimate platform ambition
        - KrASIA says >70% of revenue is international; Reuters/Yahoo describe IPO interest and cornerstone demand.
        - Disclosure shows this international mix is profitable and not mostly low-margin acquisition spend.
      - - Cost/performance claims may create upside if they hold
        - >-
          Fortune says MiniMax claimed M1 used only about $534,700 of rented compute and may pressure frontier
          incumbents.
        - Independent benchmarking and usage data verify the cost claim and its commercial relevance.
      - - Current marks look far ahead of current financial quality
        - 2024 valuation >$2.5B on $30.5M revenue; $3B-$4B marks imply 20x-27x ARR or 38x-51x revenue.
        - Audited margin expansion, stronger enterprise mix, and faster ARR growth close the gap.
      - - Talkie-led monetization may be lower quality than enterprise narratives imply
        - ChinaTalk says Talkie/Xingye remains the largest revenue contributor and average spend was only about $5.
        - Revenue mix shifts meaningfully toward higher-retention B2B / platform usage.
      - - Legal overhang can directly compress valuation
        - >-
          Reuters says studios seek profits and an injunction-style order; Reuters later says MiniMax failed to dismiss
          the case.
        - Settlement, dismissal, or credible rights controls materially de-risk commercialization.
    notes: >-
      The thesis is intentionally paired with the anti-thesis so the recommendation remains evidence-sensitive. A better
      company can still be a bad investment at the wrong entry price.
