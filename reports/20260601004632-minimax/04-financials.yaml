    - Provide latest balance sheet, unrestricted cash, and cash by legal entity.
  - - Monthly burn
    - Not publicly disclosed; only a reported annual adjusted net loss is available
    - low
    - Burn determines runway and timing pressure for new financing
    - Provide monthly cash burn, capex, and working-capital swing history.
  - - Runway months
    - Not publicly disclosed
    - low
    - Without runway, funding dependency remains speculative
    - Provide base, downside, and expansion runway models.
  - - Historical external capital access
    - March 2024 reporting placed a $600M round at >$2.5B valuation; Reuters later said MiniMax had raised >$850M since 2023
    - medium
    - Supports the view that MiniMax can access outside funding even if internal cash generation is thin
    - Provide cap table, liquidation preferences, and any investor rights tied to new capital needs.
  - - Potential IPO proceeds
