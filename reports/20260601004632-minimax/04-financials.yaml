- id: financial-risks-and-diligence-blockers
  title: 'Financial verdict and diligence blockers: legal exposure and missing cash data keep underwriting open'
  body: 'MiniMax’s positive financial case is visible enough to take seriously. Official docs show extensive monetization surfaces, and third-party reports indicate revenue, ARR, global reach, and continuing access to outside capital. The negative case is equally important. The company is still financially opaque in the ways that matter most for underwriting: no public cash balance, no monthly burn, no debt schedule, no contract-quality disclosure, no channel take rates, and no verified bridge from gross usage to retained gross profit. Legal risk adds another layer. Reuters, CourtListener, and other coverage show that US studios are not only suing Hailuo over alleged copyright infringement but have already survived a dismissal challenge, keeping open the possibility of damages, injunctions, added compliance spend, and valuation pressure around any listing process. As a result, the chapter’s bottom line is cautious rather than dismissive. MiniMax may be scaling into a real multi-surface AI
    business, but public evidence still supports a research posture more than a clean financial underwrite until management shares audited statements, cloud commitments, cohort data, and legal reserve assumptions.'
