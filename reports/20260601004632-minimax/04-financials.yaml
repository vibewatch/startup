- id: reported-financials-funding-and-capital-access
  title: 'Reported revenue, funding, valuation, and IPO terms: useful signals, still mostly third-party-reported'
  body: 'Company Overview already covers the round-by-round funding chronology; the financial question is what those reports imply about MiniMax’s present capital access. March 2024 Bloomberg and SiliconANGLE reporting placed a large private round at at least $600 million and above a $2.5 billion valuation. Later Reuters, SCMP, and Yahoo reporting describe confidential Hong Kong IPO activity, sponsors, a proposed raise size, and valuation ranges that moved materially higher. Kr-Asia goes further by reporting 2025 revenue of $79 million, ARR above $150 million, and a 25.4% gross margin, while also saying adjusted net loss remained substantial. These figures are analytically important, but they should not be treated like filed statements inside this chapter. They are media-reported or prospectus-reported numbers, not line items we independently verified in an official MiniMax annual report contained in this source set. The underwriting takeaway is nuanced: MiniMax appears able to attract capital
    and may have meaningful commercialization scale, but the public source record still leaves investors dependent on third-party summaries for the most consequential numbers.'
