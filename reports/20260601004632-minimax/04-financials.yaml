- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Audited financial statements / official prospectus
    - Without primary statements, reported revenue, margin, and loss figures remain harder to verify
    - Obtain the latest audited annual and interim statements plus any filed or draft listing prospectus.
  - - Cash, burn, and runway
    - Capital adequacy cannot be underwritten from revenue anecdotes alone
    - Request monthly cash bridge, unrestricted cash balances, and 12–24 month runway scenarios.
  - - Realized pricing and discount policy
    - List pricing overstates certainty on net revenue quality
    - Review sample enterprise MSAs, reseller terms, discount schedules, and credits / breakage policy.
  - - Cloud and compute commitments
    - Asset-light positioning can still mask large third-party obligations
    - Request cloud vendor contracts, reserved-capacity commitments, and compute spend by model line.
  - - Consumer cohort retention and enterprise concentration
    - High usage does not automatically equal durable cash flow
    - Request cohort tables for Talkie/Hailuo and revenue concentration by top customers / channels.
  - - Legal reserve and copyright-compliance cost
    - Active litigation may alter valuation, launch costs, or availability of certain content categories
    - Request litigation reserve analysis, insurance coverage, takedown / moderation spend, and scenario planning.
  notes: These are the core blockers preventing a clean public-only underwriting case on MiniMax as of 2026-06-01.
  enumerationScope:
    coverage: partial
    basis: Rows prioritize the highest-impact financial unknowns revealed by the source review; they are not the only diligence requests that could matter.
