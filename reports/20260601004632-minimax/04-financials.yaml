- calloutType: insight
  title: MiniMax already exposes more public list pricing than many private AI peers
  body: Official docs show text, video, speech, image, music, token-plan, credits, and package pricing. That breadth makes MiniMax easier to model at the rate-card layer than at the realized-margin layer.
  claimRefs:
