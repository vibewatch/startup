- calloutType: risk
  title: Capital access looks real, but capital adequacy still cannot be underwritten from public evidence alone
  body: Funding and IPO reports imply MiniMax can raise money, yet no official cash, burn, runway, or debt schedule is public in this chapter’s primary source set.
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI037
- calloutType: recommendation
  title: Treat ARR, revenue, margin, and IPO figures as reported signals until management or filings substantiate them
  body: Kr-Asia, Reuters, SCMP, Yahoo, and Chinatalk provide important numbers, but the chapter still lacks a directly reviewed MiniMax annual report or prospectus to close the core underwriting loop.
  claimRefs:
