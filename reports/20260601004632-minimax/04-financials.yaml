chapter:
  number: 4
  title: Financials
  summary: 'MiniMax publishes unusually visible list pricing across APIs, plans, and creator packages, and media reporting suggests real commercialization scale. But the core underwriting problem remains unresolved: reported revenue, ARR, margin, valuation, and IPO figures are still mostly third-party-reported in this source set, while cash, burn, runway, and legal reserves remain undisclosed. The result is a company that looks commercially credible yet still financially opaque where investors most need certainty.'
sections:
- id: revenue-model-and-price-surfaces
  title: 'Revenue model and official price surfaces: MiniMax publishes broad list pricing but not realized economics'
  body: 'MiniMax’s public materials make the top of the revenue funnel much easier to see than the bottom. Official pages and platform docs show at least five monetization surfaces: token-priced text APIs, Token Plan subscriptions, prepaid credits, per-video generation plus larger video packages, and additional speech, music, image, and agent-related usage. The company also markets consumer products such as Talkie, Hailuo AI, and MiniMax Agent, which matters because the business is not presented as a pure enterprise API vendor. That said, the official record here is rate-card heavy rather than accounting heavy. Public docs show list prices, included quotas, video unit deductions, and package ladders, but they do not disclose realized discounting, channel fees, refund behavior, enterprise minimum commits, or how revenue is recognized across self-serve versus sales-led contracts. Financially, the chapter’s first conclusion is therefore straightforward: MiniMax has many visible ways to charge,
    but public pricing transparency should not be mistaken for visibility into net revenue quality.'
