  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: four overlapping MiniMax markets, not one generic TAM'
        blocks:
          - type: paragraph
            body: >-
              MiniMax should not be analyzed as if it were selling into one undifferentiated generative-AI market. Its
              own product evidence points to four overlapping but distinct spend pools. First is frontier multimodal
              model and API spend, where developers and product teams buy tokens, throughput, and model access. Second
              is consumer AI creation spend, where Hailuo, Speech, and Music support image, video, voice, and soundtrack
              workflows for creators and marketers. Third is social or companion AI spend, where Talkie and the M2-her
              role-play stack compete on retention, character fidelity, and emotional engagement rather than raw token
              volume. Fourth is enterprise assistant and agent deployment spend, where buyers care about support,
              analytics, compliance, and rollout services in addition to model quality. These markets influence each
              other, but the included spend, buyer, and substitute set are not identical. The status quo substitutes
              differ by surface too: agencies and editing software for creators, human coders and incumbent APIs for
              developers, and consumer entertainment apps for companion AI. Treating all of that as one TAM would hide
              the real adoption logic.
