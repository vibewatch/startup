            body: >-
              MiniMax’s public and reported operating model suggests externalized infrastructure rather than owned
              compute, but that does not make the business cheap. Chinatalk says MiniMax describes itself as pursuing a
              light-asset strategy, with no owned training clusters and outsourced content moderation, digital
              marketing, and data labeling. At the same time, MiniMax’s own local-deployment guide shows that even local
              inference for M2.7 can demand four 96 GB GPUs, eight 144 GB GPUs, or very large Mac Studio memory
              footprints depending on deployment style. The guide’s MLX variants span roughly 100 GB to 457 GB model
