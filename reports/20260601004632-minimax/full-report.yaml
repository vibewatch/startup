            title: Recommendation — Track
            body: >-
              MiniMax is worth tracking closely, but not at a price that assumes public-company-quality evidence already
              exists. Wait for a primary filing or a materially lower entry point before treating the current story as
              investable.
            calloutType: recommendation
            claimRefs:
