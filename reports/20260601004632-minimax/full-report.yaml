      - number: '2.3'
        title: Buyer, user, and payer segmentation by product surface
        blocks:
          - type: paragraph
            body: >-
              MiniMax's buyer map changes meaningfully by surface. For Hailuo, the user can be an individual creator,
              indie studio, marketer, or social-media operator; the payer may be the same person in self-serve tiers or
              a small team budget owner once video generation becomes a recurring workflow. For Talkie, the user and
              payer are usually the same consumer, and the market clears on retention and perceived emotional value
              rather than enterprise controls. For the API platform, the user is often a developer or agent builder, but
              payment can shift from an individual's card to a team or product budget as usage becomes persistent. For
              enterprise product teams, the end users may still be developers, analysts, or creators, yet the true
              economic buyer is often a CTO, AI platform lead, CIO, or transformation office because support,
              throughput, security, and deployment architecture become part of the purchase. MiniMax's monetizable SAM
              therefore depends less on total global AI interest than on how many creators, companion users, developers,
              and product teams progress from trial to repeated paid usage on a workflow with measurable ROI.
