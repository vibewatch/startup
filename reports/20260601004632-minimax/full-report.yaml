    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product breadth, and operating model
        blocks:
          - type: paragraph
            body: >-
              MiniMax’s own materials frame the company as a global AI foundation model company pursuing AGI under the
              mission “Intelligence with Everyone.” That framing is supported by a product footprint that is broader
              than a single chatbot. Official sources describe multimodal model families spanning text, audio, images,
              video, and music, and connect those models to multiple distribution surfaces: MiniMax Agent, Hailuo AI,
              MiniMax Audio, Talkie, and the enterprise/developer-facing Open API Platform. The platform and pricing
              documentation matter because they show a real commercialization layer, not just research branding. MiniMax
              publishes pay-as-you-go token pricing, monthly token plans, and separate video-generation plans, while
              product pages and launch notes show continued investment in agentic coding, video generation, speech, and
              music. Taken together, the public record supports a multimodal AI company monetizing through both direct
              products and developer infrastructure.
