      - number: '8.4'
        title: Scenario ranges and downside transmission
        blocks:
          - type: paragraph
            body: >-
              Scenario work matters here because almost every favorable valuation input is still reported rather than
              fully filed. In the bull case, MiniMax converts its disclosed ARR momentum into a clearly enterprise-led
              platform story, pushes ARR beyond $200 million, lifts gross margin toward or above 35%, and contains legal
              and policy risk before any remedy hits commercialization. That can support a $3.5 billion to $5.0 billion
              outcome. The base case is more conservative: ARR continues growing but revenue mix remains partly
              consumer-led, gross margin stays in the mid-20s to low-30s, and the company still must price aggressively
              to win share. On that path, roughly $1.8 billion to $3.0 billion looks more supportable. The bear case is
              not theoretical. The Disney/Universal/WBD suit is live, MiniMax already failed to dismiss it early, and
              the remedies sought include profits plus an order to halt infringement absent protections. If those risks
              combine with multiple compression and slower enterprise conversion, a $0.9 billion to $1.5 billion
              valuation band becomes plausible. Fortune's report on ultra-cheap M1 training is interesting upside fuel,
              but even Fortune stressed the claim was not independently verified, so it cannot erase downside on its
              own.
