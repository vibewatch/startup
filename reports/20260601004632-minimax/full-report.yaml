          - type: callout
            title: ARR matters more than raw hype
            body: >-
              The clearest public anchor is not the rumor mill around a $4 billion IPO; it is the disclosed statement
              that ARR has passed $150 million. Even on that more generous base, the rumored marks still imply premium
              multiples that require better proof than the current record offers.
