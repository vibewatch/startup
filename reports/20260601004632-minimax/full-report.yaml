      - number: '1.2'
        title: Founder anchor, governance opacity, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is much thinner than MiniMax’s product evidence. Reuters reported that MiniMax
              was founded in early 2022 by former SenseTime executive Yan Junjie, while SiliconANGLE separately
              described the company as having been founded by former SenseTime employees including Yan, previously a
              vice president there. KR Asia later cited Yan directly as founder and CEO discussing the company’s
              platform transition. That is enough to anchor Yan as the central public founder-executive, but not enough
              to underwrite a fully transparent governance structure. Reviewed official materials do not publish a clear
              current board roster, committee map, or verified headcount, and third-party financing reports identify
              investors without disclosing a reconciled cap table or control framework. The result is a real diligence
              asymmetry: MiniMax looks like a scaled operating company with public-market ambitions, but the public
              record still suggests meaningful key-person dependence on Yan and limited outside visibility into how
              governance is actually organized. That opacity is notable for a company already courting global users,
              developers, and public-market attention.
