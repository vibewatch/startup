            body: >-
              MiniMax does have the beginnings of an enterprise motion. The public docs describe team seats, shared
              credits, team wallets, rate limits, and API products that look usable for self-serve developers and small
              teams. The problem is that the trust and dependency layer is much less mature in public view. In the
              fetched source set, MiniMax surfaces pricing and product breadth very clearly, but not a public trust
