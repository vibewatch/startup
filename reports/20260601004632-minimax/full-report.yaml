  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Sensitivity of implied equity value to different ARR multiples applied to the disclosed >$150 million ARR
      reference point.
    data:
      items:
        - label: 8x ARR
          value: 1200
          unit: $M equity value
        - label: 12x ARR
          value: 1800
          unit: $M equity value
        - label: 16x ARR
          value: 2400
          unit: $M equity value
        - label: 20x ARR (~$3B private mark)
          value: 3000
          unit: $M equity value
        - label: 26.7x ARR (~$4B IPO target)
          value: 4000
          unit: $M equity value
    approximationNotes: >-
      Uses the disclosed ARR floor of >$150 million as a conservative anchor. Because ARR is described only as having
      surpassed $150 million, the true multiple at the rumored marks could be somewhat lower if ARR is materially
      higher.
