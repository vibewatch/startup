  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Litigation and intellectual-property overhang
        blocks:
          - type: paragraph
            body: >-
              The single most concrete adverse item in the MiniMax file is the Hollywood copyright case. Reuters,
              Courthouse News, Variety, CNBC, Straits Times, and IPWatchdog all describe a September 2025 complaint by
              Disney, Universal, and Warner Bros. Discovery alleging that MiniMax built or commercialized Hailuo using
              copyrighted works without permission and then marketed the service through recognizable studio characters.
              That matters because the lawsuit is not a vague sector analogy; it is directed at MiniMax and Hailuo
              specifically, and the pleadings describe customer-facing outputs as well as promotional materials. The May
              2026 Reuters follow-up is also important because it shows the case surviving MiniMax's early dismissal
              attempt. That is not a merits loss, but it does mean U.S. litigation risk is live enough to consume
              management time, legal spend, and potentially product-roadmap attention. For investors, the question is
              less whether infringement has already been proven and more whether MiniMax can show credible rights
              filtering, reserve planning, and product-adjustment capacity before the case matures into a damages or
              injunction problem.
