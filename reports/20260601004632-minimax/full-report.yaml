              pages and platform docs show at least five monetization surfaces: token-priced text APIs, Token Plan
              subscriptions, prepaid credits, per-video generation plus larger video packages, and additional speech,
              music, image, and agent-related usage. The company also markets consumer products such as Talkie, Hailuo
