      - number: '3.3'
        title: Consumer companion, creator surface, and video-generation competition
        blocks:
          - type: paragraph
            body: |2-
                      MiniMax is unusually exposed to the creator and companion layer, which is a competitive positive and a risk. Hailuo gives MiniMax a real consumer-creator surface in video, while Talkie and MiniMax Agent widen user touchpoints beyond API buyers. That means MiniMax is not forced to monetize only through enterprise contracts or developer tokens. But it also means it competes directly with ByteDance and Tencent where those companies are structurally strong. ByteDance’s stack spans consumer chat plus an increasingly broad Volcengine Doubao model catalog including code, vision, video, realtime speech, and role-play models. Tencent separates its Hunyuan model work from Yuanbao’s end-user assistant, while Baidu’s ERNIE/Yiyan page shows that coding, writing, and visual generation are now table stakes in Chinese assistant experiences. In video specifically, MiniMax has public evidence of real strength: Hailuo 02 ranked above Google Veo 3 in a user benchmark and at much lower listed cost. Yet that same benchmark also placed ByteDance Seedance ahead of Hailuo, showing that MiniMax’s creator advantage is contested rather than settled.
                    
