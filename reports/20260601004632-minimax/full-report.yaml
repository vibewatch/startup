  summary: >-
    MiniMax is a Shanghai-based multimodal AI company founded in early 2022 around founder Yan Junjie and a former
    SenseTime cohort. The company now operates across M-series language models, Hailuo video, speech, music, Talkie,
    MiniMax Agent, and a developer/API platform, with official materials claiming 236 million individual users and
    214,000 enterprise or developer customers across global markets. Public reporting suggests meaningful
