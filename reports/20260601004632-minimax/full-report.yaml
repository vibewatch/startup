        title: Product surface and customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              MiniMax's official materials support a broader product definition than a typical frontier-model startup
              pitch. The company is not only selling a language model API. Its public stack spans M-series reasoning and
              coding models, a role-play/chat layer, Hailuo video generation, speech and music models, and
              developer-facing distribution via SDKs, CLI, and local deployment. In workflow terms, that means different
              user groups encounter MiniMax in different forms: developers call an API or run an agent from the
              terminal, creators use Hailuo or music generation flows to produce assets, and companion-chat users
              interact with character experiences shaped by the M2-her family. The docs index matters because it shows
              these are connected surfaces on one platform rather than isolated launches. The same documentation tree
              exposes text, image, video, speech, music, and file-management endpoints. External evidence is strongest
              on Hailuo's creator workflow: the Play listing confirms mobile distribution and a feature set built around
              text/video/image generation and subject-reference consistency. The upshot is that MiniMax's product is
              best understood as a multimodal operating layer spanning consumer apps, creator tooling, and developer
              runtimes.
