          - type: callout
            title: Legal discount is not optional
            body: >-
              The Disney / Universal / Warner Bros. Discovery case is live, the dismissal attempt already failed, and
              the requested remedies include profits plus an order halting infringement without protections. That should
              be treated as a valuation discount, not background noise.
            calloutType: risk
