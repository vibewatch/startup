  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      MiniMax's risk vectors are correlated: legal, regulatory, access, and trust events all flow into conversion,
      moderation spend, and valuation at the same time.
    data:
      nodes:
        - id: legal
          label: Copyright litigation
          detail: Hailuo-specific legal action raises damages and product-remedy risk.
        - id: reg
          label: Companion regulation
          detail: Talkie/Xingye face draft safety, app-store, and assessment obligations.
        - id: access
          label: Vendor access restrictions
          detail: Anthropic / OpenAI style restrictions can close ecosystem doors.
        - id: controls
          label: More filtering and safety ops
          detail: Rights controls, human escalation, and compliance reviews add cost.
        - id: conversion
          label: Slower conversion
          detail: Creators, teams, and enterprises hesitate or churn sooner.
        - id: mix
          label: Revenue-mix stress
          detail: Consumer-heavy or discounted growth becomes harder to offset.
        - id: margin
          label: Margin compression
          detail: Lower pricing plus higher compliance cost narrows contribution margins.
        - id: valuation
          label: Valuation pressure
          detail: Financing and underwriting tolerance tighten as risk stack correlates.
      edges:
        - from: legal
          to: controls
          label: May require rights filters or settlements
        - from: reg
          to: controls
          label: Adds human escalation and filings
        - from: access
          to: conversion
          label: Raises partner and buyer skepticism
        - from: controls
          to: margin
          label: Higher operating cost
        - from: controls
          to: conversion
          label: Friction and slower releases
        - from: conversion
          to: mix
          label: Enterprise diversification slows
        - from: mix
          to: margin
          label: Consumer-heavy blend persists
        - from: margin
          to: valuation
          label: Lower quality of growth
        - from: legal
          to: valuation
          label: Reserve / injunction overhang
        - from: reg
          to: valuation
          label: Policy uncertainty over companion cash flows
    claimRefs:
      - CR016
      - CR020
      - CR023
      - CR030
      - CR042
      - CR045
      - CR046
      - CR047
      - CR048
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      MiniMax depends not only on customers but also on regulators, rights holders, app distributors, and enterprise
      gatekeepers whose actions can block monetization.
    data:
      nodes:
        - id: talkie
          label: Talkie / Xingye
          detail: Companion products with meaningful policy exposure.
        - id: hailuo
          label: Hailuo web/app/API
          detail: Video product tied to pricing momentum and litigation risk.
        - id: cac
          label: CAC and PRC regulators
          detail: Set rules for anthropomorphic interaction services.
        - id: rights
          label: Rights holders and U.S. courts
          detail: Shape copyright liability and product constraints.
        - id: vendors
          label: Western model vendors / routers
          detail: Can restrict access based on region or abuse concerns.
        - id: buyers
          label: Enterprise procurement
          detail: Demand assurance, support, and compliance readiness.
        - id: apps
          label: App stores / distributors
          detail: Can require filings or suspend distribution.
      edges:
        - from: cac
          to: talkie
          label: Safety and filing obligations
        - from: apps
          to: talkie
          label: Distribution validation
        - from: rights
          to: hailuo
          label: Litigation and filtering pressure
        - from: vendors
          to: hailuo
          label: Ecosystem access and benchmarking friction
        - from: buyers
          to: hailuo
          label: Trust and SLA expectations
        - from: buyers
          to: talkie
          label: Indirect via brand and trust perception
        - from: rights
          to: buyers
          label: Procurement caution from legal headlines
        - from: cac
          to: apps
          label: App-store verification duties
    claimRefs:
      - CR021
      - CR029
      - CR030
      - CR031
      - CR035
      - CR043
      - CR044
      - CR050
