      - number: '3.5'
        title: Moat durability, displacement pressure, and adverse signals
        blocks:
          - type: paragraph
            body: |2-
                      The durable part of MiniMax’s position is not one benchmark score; it is the combination of low-cost multimodal APIs, Hailuo video distribution, and a public product strategy aimed squarely at coding agents and creator workflows. That gives MiniMax more than one route to relevance. The adverse case is equally clear. Some of MiniMax’s most attention-grabbing cost and performance claims remain company-stated rather than independently verified, and independent coverage explicitly says verification is still pending. Chinese-origin AI also faces a trust ceiling in some Western enterprise and government settings because buyers worry about censorship, policy alignment, and national-security exposure. Meanwhile, rivalry inside China is intensifying, not easing: ByteDance already beat Hailuo in one public video arena, DeepSeek and Qwen keep lowering model and self-hosting barriers, and Zhipu shows that likely entrants can expand globally through sovereign or government-linked channels. MiniMax therefore looks strongest as a fast-moving multimodal challenger, but not yet as the category owner. Its moat is promising, but still conditional on continued distribution and trust-building execution.
                    
