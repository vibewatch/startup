      - number: '7.5'
        title: Commercialization, margin, and competitive price compression
        blocks:
          - type: paragraph
            body: >-
              Commercially, MiniMax is not a zero-revenue science project; the risk is that it may be monetizing in
              exactly the way that is hardest to defend. Official pricing is transparent and low, Hailuo 2.3 advertises
              more performance at the same price, and the Fast tier explicitly claims up to 50% lower batch-creation
              cost. Goldman's software framework reminds investors that the attractive generative-AI outcome is
              premiumization and upsell, not endless discounting. Yet Similarweb rankings and incumbent pricing pages
              show MiniMax operating in categories already dominated by ChatGPT, Gemini, Claude, Character.ai, and other
              large or highly trafficked products. That means MiniMax may need to keep passing efficiency gains back to
              customers just to defend share. Such a strategy can still win adoption, especially in video and
              price-sensitive API use cases, but it also increases sensitivity to compute scarcity, support burden,
              litigation-driven filtering costs, and demand spikes. The company is therefore exposed to a classic
              growth-quality problem: visible commercialization, but with thinner margin buffers and more routes for
              adverse events to hit the P&L.
