            - Monthly token plan
            - Paygo wallet
          emotion: Users confront price, quota, or feature ceilings and decide whether to pay or leave
          label: Quota or feature limit
        - stage: Workflow embedding
          actors:
            - Paid creator
            - Power user
            - Developer team
          touchpoints:
            - Hailuo tools/agent
            - MiniMax Agent
            - SDK + CLI + shared credits
          emotion: Adoption deepens when outputs become part of regular content, coding, or research workflows
          label: Workflow embedding
        - stage: Expansion or churn
          actors:
            - Team owner
            - Enterprise buyer
            - Consumer subscriber
          touchpoints:
            - More seats
            - Higher usage
            - Renewal/cancellation
            - Support or moderation experience
          emotion: >-
            Customer quality depends on billing clarity, trust, and whether the product becomes repeat infrastructure
            instead of novelty
          label: Expansion or churn
