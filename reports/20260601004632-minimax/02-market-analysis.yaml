  - id: FM004
    title: Adoption path from trial to scaled deployment
    type: flow
    layout: wide
    summary: >-
      Flow from discovery to governed rollout, highlighting the points where MiniMax's low pricing helps and
      where trust, support, and workflow friction can stall expansion.
    data:
      nodes:
        - id: discovery
          label: Discovery and benchmark curiosity
          detail: Buyers encounter MiniMax through leaderboards, peer price comparisons, app stores, and creator demos.
          tone: positive
        - id: trial
          label: Free trial and promo credits
          detail: Hailuo launch credits, Music beta freebies, and temporary free model access reduce trial friction.
          tone: positive
        - id: proof
          label: Workflow proof
          detail: Users must prove a real win such as a usable video ad, coding task, or long-retention character interaction.
          tone: neutral
        - id: paid
          label: Paid self-serve commitment
          detail: Spend starts through app subscriptions, Token Plans, Credits, or Video Packages.
          tone: positive
        - id: integration
          label: Team integration
          detail: API keys, CLI use, async video flows, and rate limits turn experimentation into operational usage.
          tone: neutral
        - id: enterprise
          label: Governed rollout
          detail: Large buyers require support, analytics, compliance, and throughput beyond low list prices.
          tone: positive
        - id: risk
          label: Risk gate
          detail: Copyright, provenance, geopolitics, and price compression can halt or delay expansion.
          tone: warning
