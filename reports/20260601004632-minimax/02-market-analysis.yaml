    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to MiniMax
    rows:
      - - Frontier multimodal model / API spend
        - Token metering, caching, tool use, inference, model access, video or audio API usage
        - Raw GPU infrastructure, generic cloud spend, and non-AI software budgets without model consumption
        - Developers, AI product teams, platform engineering, central AI budgets
        - Core developer and enterprise monetization layer
      - - Consumer AI creation spend
        - App subscriptions, credits, monthly video packages, creator workflows for image, video, music, and speech
        - Generic social ad spend or human-only editing services without AI generation
        - Creators, marketers, indie studios, small teams
        - Core Hailuo and multimodal creator layer
      - - Social / companion AI spend
        - Premium character-chat use, coins or subscriptions, long-retention interaction spend
        - General social networking, gaming, or entertainment spend without AI character interaction
        - End users paying directly
        - Distinct Talkie and role-play layer
      - - Enterprise assistant / agent deployment spend
        - Seat licenses, support, analytics, compliance controls, rollout services, dedicated throughput
        - Casual employee experimentation and unmanaged shadow AI usage
        - CIO, CTO, AI platform lead, transformation office
        - Important adjacent layer for larger contracts
      - - Status-quo substitutes
        - Agency work, stock media, human editing, incumbent APIs, human developers, internal tools
        - n/a
        - Existing labor and software budgets
        - Defines the real switching baseline, not just named AI peers
    notes: >-
      MiniMax touches several adjacent categories, but the chapter treats them as linked spend pools rather than
      one synthetic market. That boundary choice is the main analytical control for the rest of the chapter.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        The rows cover the four spend pools most directly supported by MiniMax's observed product and pricing
        surfaces plus the status-quo substitute set used to judge switching behavior.
