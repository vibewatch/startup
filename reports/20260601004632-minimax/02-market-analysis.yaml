  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Falling frontier-model list prices
        - positive
        - now
        - Lowers trial friction and lets MiniMax win attention with aggressive price-performance
        - What are realized net prices, gross margins, and promo dependence by surface?
      - - Multimodal cross-sell across text, video, speech, and music
        - positive
        - now to next 24 months
        - Increases potential wallet share per account once one workflow converts
        - What share of paying accounts use two or more modalities?
      - - Open-source model and community distribution
        - mixed
        - now
        - Expands awareness and developer adoption, but weakens hard pricing moats
        - How much paid usage is incremental versus cannibalized by self-hosting?
      - - Mobile creator distribution and ad-generation use cases
        - positive
        - now
        - Broadens the top of funnel from developers to creators and marketers
        - What are paid conversion and retention by web, app, and API channel?
      - - Enterprise governance requirements
        - mixed
        - now to next 24 months
        - Larger contracts exist, but support, analytics, SSO, and compliance slow cycles
        - Which governance features are live versus promised, and for which regions?
      - - Price compression and commoditization
        - negative
        - now
        - Can shrink margins before deep lock-in forms
        - How elastic is demand when peers cut prices or bundle AI into existing suites?
      - - Copyright, provenance, and safety sensitivity
        - negative
        - now to next 24 months
        - Creator and enterprise buyers may hesitate if ownership, labeling, or moderation feels unclear
        - What indemnity, provenance, review, and takedown controls exist by modality?
      - - Geopolitics and China-specific policy narratives
        - negative
        - now to next 36 months
        - Can limit international enterprise adoption even when products benchmark well
        - What percent of revenue is international and what compliance stack supports it?
      - - Throughput and workflow friction
        - negative
        - now
        - Video RPM caps and async task flows can impede scaled operational usage
        - What SLAs, overrides, or dedicated throughput options are available today?
      - - Monetization gap versus US frontier labs
        - negative
        - now
        - Technical visibility does not guarantee software-scale revenue or durable valuation support
        - What product lines drive paid revenue and what concentration risk exists inside each?
    notes: >-
      The most important market reality is simultaneity: MiniMax's biggest growth drivers are also the sources of
      its biggest constraints. Cheap, open, multimodal AI grows the market while making it harder to own.
    enumerationScope:
      coverage: partial
      basis: >-
        These rows capture the highest-signal drivers and constraints visible in reviewed public sources, but they
        are not a substitute for product-level cohort and margin data.
