    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      Nested lenses from the broad generative-AI software market to the narrower spend pools MiniMax can reach
      through creators, companion users, developers, and enterprise product teams.
    data:
      nodes:
        - label: 'Broad TAM: Generative AI software'
          value: $150B
          detail: Goldman Sachs macro upper-bound lens for generative AI software.
        - label: 'Observable frontier-lab revenue benchmark (2024 reported)'
          value: ~$4.7B
          detail: Sum of reported OpenAI, Anthropic, and MiniMax 2024 revenues from Asia Tech Review.
        - label: 'Visible self-serve spend rails'
          value: $10-$6,000+/month
          detail: Hailuo app tiers, Token Plans, and Video Packages show buyer ladders from consumers to business teams.
        - label: 'MiniMax-priority SAM'
          value: creators + companion users + developers + enterprise product teams
          detail: Product evidence supports these four buyer groups most clearly.
        - label: 'Near-term conversion focus'
          value: workflow proof before lock-in
          detail: Buyers need repeat creation, coding, or deployment ROI before spend expands.
    approximationNotes: >-
      The second layer is a simple sum of reported 2024 revenues used as a market-structure benchmark, not a
      full market estimate. The third layer mixes official monthly price points and app-review price references
      because MiniMax does not publish one unified public budget ladder across all surfaces.
