  - CP014
  - CP027
  - CP032
  - CP038
  - CP039
- calloutType: insight
  title: Chinese rivals squeeze MiniMax from both sides
  body: "        DeepSeek and Qwen squeeze from the cost-and-openness side, while ByteDance, Tencent, and Baidu squeeze from the distribution side. MiniMax is therefore strongest where it can combine both—affordable multimodal generation with a user-facing product surface—rather than in commodity text inference alone.\n      "
