- id: companion-safety-and-regulatory-risk
  title: Companion-app safety and regulatory risk
  body: 'MiniMax''s second major risk cluster sits in companion AI rather than pure API infrastructure. The company''s own materials make clear that emotional or role-play interaction is a real surface, and CNBC reports that Talkie and Xingye contribute more than one third of revenue in the referenced period. That makes the CAC draft measures on anthropomorphic interactive AI highly relevant. The draft text is unusually specific: it bars emotional manipulation, self-harm encouragement, gambling content, unreasonable-decision inducement, and harmful dependency design; it also requires minors mode, human takeover in explicit suicide or self-harm scenarios, data-deletion options, and formal safety assessments once user scale crosses the stated thresholds. App stores are pulled into the control loop as well. None of this is yet final enforcement against MiniMax, so investors should preserve nuance. But as a policy mapping exercise the fit is direct: a scaled companion product with minors, dependency,
    safety, and app-distribution exposure now sits in a regulator-defined category whose compliance burden is operationally heavy and potentially margin-dilutive.'
  claimRefs:
  - CR015
  - CR016
  - CR017
