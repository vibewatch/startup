- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Hollywood IP litigation
    - Case posture worsens
    - Preliminary injunction traction, discovery sanctions, or settlement with material product restrictions
    - Pause underwriting or re-cut valuation for legal reserve and product-impact scenarios
  - - Companion regulation
    - CAC regime hardens from draft to effective rules
    - Final rules map one-for-one to current Talkie/Xingye flows without visible readiness evidence
    - Demand proof of operating controls before assuming companion cash flows are durable
  - - Distillation / access restrictions
    - Western model vendors tighten restrictions or publish additional MiniMax-specific enforcement claims
    - Loss of critical access channels, repeated fraud allegations, or partner offboarding
    - Treat ecosystem access as impaired and raise geopolitical / trust discount
  - - Enterprise trust / assurance gap
    - Public packaging remains thin while management pushes larger B2B accounts
    - No trust center, certification packet, DPA path, or SLA posture despite enterprise push
    - Assume slower enterprise conversion and lower-quality revenue mix
  - - Price compression and capacity stress
    - Same-price performance upgrades continue without visible support or utilization headroom
    - Repeated discounts, RPM bottlenecks, or rising support burden at current list prices
    - Cut margin assumptions and require evidence that growth is not being purchased uneconomically
  sourceRefs:
