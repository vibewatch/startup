company:
  name: MiniMax
chapter:
  number: 7
  title: Risks
  letter: R
  summary: MiniMax's risk stack is investable only with heavy caveats. The company has live Hollywood copyright litigation around Hailuo, direct policy exposure to draft Chinese companion-AI rules that map onto Talkie/Xingye, public accusations from Anthropic of large-scale distillation abuse, and thinner public enterprise-assurance packaging than Western incumbents. At the same time, MiniMax is clearly commercializing through aggressive API and video pricing, which supports growth but increases margin sensitivity and makes legal, trust, or safety shocks more likely to transmit across revenue, conversion, and valuation at once.
sections:
- id: litigation-and-ip-risk
  title: Litigation and intellectual-property overhang
  body: The single most concrete adverse item in the MiniMax file is the Hollywood copyright case. Reuters, Courthouse News, Variety, CNBC, Straits Times, and IPWatchdog all describe a September 2025 complaint by Disney, Universal, and Warner Bros. Discovery alleging that MiniMax built or commercialized Hailuo using copyrighted works without permission and then marketed the service through recognizable studio characters. That matters because the lawsuit is not a vague sector analogy; it is directed at MiniMax and Hailuo specifically, and the pleadings describe customer-facing outputs as well as promotional materials. The May 2026 Reuters follow-up is also important because it shows the case surviving MiniMax's early dismissal attempt. That is not a merits loss, but it does mean U.S. litigation risk is live enough to consume management time, legal spend, and potentially product-roadmap attention. For investors, the question is less whether infringement has already been proven and more whether
    MiniMax can show credible rights filtering, reserve planning, and product-adjustment capacity before the case matures into a damages or injunction problem.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR045
  - CR048
  tableRefs:
