  - FR002
- id: enterprise-trust-and-dependency-risk
  title: Enterprise trust, partner, and execution risk
  body: 'MiniMax does have the beginnings of an enterprise motion. The public docs describe team seats, shared credits, team wallets, rate limits, and API products that look usable for self-serve developers and small teams. The problem is that the trust and dependency layer is much less mature in public view. In the fetched source set, MiniMax surfaces pricing and product breadth very clearly, but not a public trust center, DPA, SOC 2 page, ISO-certification page, or robust enterprise-support positioning comparable to what OpenAI publicly markets for ChatGPT Enterprise. That does not prove the company lacks controls; it does mean outside buyers have less public assurance to lean on. The same pattern appears in distribution proof: MiniMax''s strongest named evidence is ecosystem-partner language and product documentation, not disclosed Fortune 500 deployments or major cloud-partner case studies. That leaves underwriting exposed to softer dependencies: enterprise procurement committees, partner
    confidence, app stores, regulators, and internal safety/compliance staffing that is not yet visible in the public record.'
  claimRefs:
