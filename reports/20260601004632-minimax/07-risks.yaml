- id: distillation-security-and-geopolitical-access
  title: Model distillation, security, and geopolitical access risk
  body: 'The third cluster is more nuanced because it mixes allegation, security posture, and geopolitical access. Anthropic publicly accused MiniMax of an industrial-scale distillation campaign involving more than 13 million Claude exchanges targeted at coding and tool-use capabilities, and CNBC frames the allegation alongside similar rhetoric from OpenAI. OpenAI''s own February 2026 memo broadens the pattern, describing unauthorized resellers, synthetic-data pipelines, and reinforcement-style optimization as part of the current adversarial-distillation ecosystem. None of that is a court finding, and CNBC quotes experts warning that some of the rhetoric also serves strategic competitive narratives. Still, the combination matters for diligence because vendor policy is tightening in real time. Anthropic''s September 2025 update explicitly restricts controlled entities from unsupported regions like China even via offshore subsidiaries. That means any dependence on Western model vendors, router
    networks, or external benchmarking channels can disappear under policy pressure or fraud enforcement. In other words, the distillation story is not just reputational noise: it can become a concrete access, partnership, and trust problem even before regulators formally act.'
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR043
