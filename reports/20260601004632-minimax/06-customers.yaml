- id: named-proof-and-durability
  title: Named proof and durability
  body: 'Named customer proof is strongest in two places: curated developer-platform endorsements and public Hailuo user reviews. The M2.1 launch note includes quotes from multiple developer-tool companies describing MiniMax as integrated, popular, or high-performing in real coding workflows. That is useful because it names actual counterparties, but it remains vendor- or ecosystem-centric proof rather than a Fortune-500 procurement reference list. Hailuo''s Google Play reviews supply a different kind of evidence: they show that paying or trial users are actually transacting, generating outputs, comparing Hailuo against rivals such as Kling, and complaining when billing or credits feel unfair. That is lower-prestige proof but more direct customer-behavior evidence. Durability, however, is still under-disclosed. MiniMax does not publicly disclose NRR, GRR, churn, contract length, renewal rates, or product-line retention cohorts. The public record therefore supports adoption and monetization
    directionally, but not the durability metrics an institutional diligence process would want before underwriting enterprise expansion.'
