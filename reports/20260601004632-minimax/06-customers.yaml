- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use Case
  - Scale
  - Revenue / Strategic Value
  - Gap
  rows:
  - - Talkie / companion users
    - Individual user / user / individual or ad-supported payer
    - Role-play, character chat, emotional companionship, long-horizon narrative interaction
    - Officially within 236M cumulative users; CNBC cites >20M MAU for Talkie + Xingye during the referenced period
    - High engagement consumer surface and reportedly >1/3 of revenue in first three quarters
    - No disclosed paid-subscriber count, churn, ARPU, or regional split
  - - Hailuo creators
    - Creator / creator / individual subscriber or credit buyer
    - Text-to-video, image-to-video, subject-reference video, short-form creative output
    - 75.8K Google Play reviews; official web, app, and API distribution; company claims hundreds of millions to billions of created videos
    - Strongest public B2C monetization proof and creator adoption signal
    - Review count is not equal to active paid creators; no disclosed subscriber base
  - - Hailuo marketers / SMBs
    - Marketer, product seller, SMB team / creator-user / subscription or credits buyer
    - AI ad generation, multilingual product videos, template-driven campaign assets
    - Official ad-generator release and Hailuo Agent tooling show explicit marketing workflow push
    - Higher-value creator workflow that can move beyond hobbyist usage
    - No disclosed conversion rate from creator traffic to business accounts
  - - MiniMax Agent power users
    - Knowledge worker or prosumer / user / monthly plan or bundled access payer
    - Research, coding, search, multimodal agent execution
    - Official agent, CLI, and Hugging Face surfaces show public availability and subscription path via Token Plan
    - Bridges consumer-style self-serve usage into team and API upsell
    - No disclosed DAU, subscriber count, or seat retention
  - - API developers and OSS adopters
    - Developer / developer / self-serve paygo, token plan, or local-compute payer
    - Coding agents, terminal workflows, multimodal app building, experimentation
    - Official 214,000 enterprises and developers claim; GitHub and Hugging Face surfaces are live
    - Large top-of-funnel for ecosystem adoption and future paid conversion
    - Headline combines enterprises with developers, obscuring actual paying-account mix
  - - Enterprise / team accounts
    - Team owner, technical lead, procurement / developers and internal users / team owner or company
    - Seat-managed team usage, shared credits, pay-as-you-go wallet spending
    - Team plan documentation and enterprise-language positioning are public; KrASIA reports US$26M open-platform and enterprise-services revenue
    - Most scalable B2B revenue layer if real customer quality is high
    - Named production enterprise references, contract length, and concentration remain undisclosed
