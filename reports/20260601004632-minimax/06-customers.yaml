  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: MiniMax does not publicly disclose NRR, GRR, cohort retention, logo churn, renewal rate, or contract length by product line or customer segment.
    whyItMatters: Without retention cohorts, the public story cannot distinguish sticky enterprise and subscriber behavior from broad but low-durability experimentation.
    diligencePath: Request cohort retention by Talkie, Hailuo, Agent, self-serve API, and enterprise accounts, plus refund and chargeback trends for paid consumer surfaces.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU026
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-contracts
    missingEvidence: Top-customer revenue share, top-10 account concentration, average contract duration, prepaid duration, and enterprise expansion cohorts are not public.
    whyItMatters: MiniMax could look diversified in user count while still depending economically on a much narrower set of companion-app revenues or a small enterprise cohort.
    diligencePath: Request a product-line and top-account schedule with revenue, gross margin, contract end dates, renewal status, and region.
    relatedQuestionRefs:
    - QU016
    - QU021
    - QU026
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: Public named proof is concentrated in developer-tool quotes and Google Play user reviews; a broader named enterprise reference set was not found.
    whyItMatters: Curated ecosystem proof and consumer reviews are useful, but they are not a substitute for a representative enterprise reference set with deployment stage and measurable outcomes.
    diligencePath: Request a public-reference list or confidential customer pack covering enterprise accounts, production status, spend, use case, and renewal history.
    relatedQuestionRefs:
    - QU013
    - QU025
    - QU026
    relatedTableRefs:
    - TU003
