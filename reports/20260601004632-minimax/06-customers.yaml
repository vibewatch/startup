- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Free/open developer entry via API, open weights, and CLI
    - Large share of 214K headline may be low-value experimenters rather than durable paying accounts
    - Can inflate top-of-funnel without guaranteeing durable B2B revenue
    - Split reported enterprise/developer counts into free, self-serve paid, and contracted enterprise cohorts
  - - Token Plan to Teams to paygo wallet
    - Named enterprise logos are sparse despite clear packaging for teams
    - Could slow proof of enterprise trust and procurement acceptance
    - Request top customer list, contract lengths, and expansion revenue by plan type
  - - Hailuo creator adoption
    - Revenue may stay concentrated in creator subscriptions and one-off credit purchases
    - Consumer-style volatility can raise churn and refund pressure
    - Request subscriber cohorts, refund rates, and creator vs. marketer mix
  - - Talkie / companion engagement
    - Companion apps may remain a disproportionately large revenue contributor
    - High dependence on regulated, emotionally sensitive use case
    - Request revenue concentration by product and region, plus regulatory contingency plans
  - - Marketing / ad-generator push in Hailuo
    - Could attract higher-value SMB demand but also higher content-liability exposure
    - Improves monetization potential while raising provenance and brand-safety requirements
    - Request moderation, rights-screening, and enterprise indemnity posture for marketing users
  - - Global expansion
    - 70%+ international revenue improves diversification, but trust barriers may limit Western enterprise adoption
    - Slows enterprise conversion even if usage trials are strong
    - Request customer mix by geography and regulated-industry exposure
  - - Open-source ecosystem momentum
    - Community adoption may be real but portable if rivals improve price/performance
    - Developer usage may not convert into sticky revenue
    - Request conversion funnel from OSS/community usage into paid seats or API spend
  - - Copyright litigation around Hailuo
    - Enterprise and creator customers may hesitate to scale usage during live rights disputes
    - Could depress willingness to pay or require costly controls
    - Request litigation reserve, customer communications, and provenance roadmap
  sourceRefs:
