callouts:
- calloutType: strength
  title: MiniMax has a real multi-surface customer base, not just a model narrative
  body: The public record supports genuine customer breadth across consumer companions, creator tools, agent products, and API/developer surfaces. KrASIA's revenue split, Hailuo's review base, Token Plan packaging, and open-source distribution all point to real usage and monetization across more than one route to market.
  claimRefs:
  - CU004
  - CU005
  - CU008
  - CU014
  - CU018
  - CU041
- calloutType: risk
  title: Customer quality is weaker than customer reach
  body: MiniMax's headline scale metrics are impressive, but the strongest public proof still clusters around consumer and creator products. Named enterprise customers, renewal data, NRR, contract length, and top-customer concentration remain largely undisclosed, while Talkie regulation and Hailuo copyright litigation create direct customer-risk overhangs.
  claimRefs:
  - CU032
  - CU033
  - CU035
  - CU039
  - CU045
- calloutType: insight
  title: Developer proof is better than enterprise proof
  body: MiniMax's M2.1 partner quotes, GitHub CLI, Hugging Face distribution, and community showcase all support meaningful developer adoption. What they do not yet provide is the kind of independently documented enterprise deployment history that would close diligence on customer durability and procurement depth.
  claimRefs:
  - CU017
  - CU018
  - CU020
  - CU021
  - CU044
