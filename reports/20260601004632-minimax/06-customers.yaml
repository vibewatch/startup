company:
  name: MiniMax
chapter:
  number: 6
  title: Customers
  letter: U
  summary: 'MiniMax has clearer evidence of customer breadth than of customer durability. Official materials and KrASIA support a four-part customer map: consumer companion users on Talkie, creators and marketers using Hailuo, developers experimenting through open-source and CLI surfaces, and enterprise/developer buyers on the API platform. The strongest third-party monetization proof sits in Hailuo''s app-store review base, subscription language, and creator/advertising workflow pushes; the strongest named proof sits in developer-tool partner quotes around M2.1. However, public disclosure remains thin on named enterprise customers, retention cohorts, contract length, NRR/GRR, and top-customer concentration. Regulation around emotional companions, copyright disputes around Hailuo outputs, and Western trust barriers around Chinese AI models all weaken customer quality even as reported reach expands.'
sections:
- id: individual-user-and-creator-base
  title: Individual-user and creator base
  body: MiniMax's clearest customer evidence is on the consumer and creator side, but the signals must be separated carefully. The company's own about page says its models and AI-native products have cumulatively served more than 236 million individual users across 200-plus countries and regions. That is a broad reach claim, not a retention or paying-customer metric. Hailuo provides more tangible proof of active creator demand. The official product surfaces pitch text-to-video, image-to-video, subject-reference consistency, ad generation, and template-based creation, while the Google Play listing shows a visible consumer funnel with optional subscription access, a 3.7 rating, and 75.8K reviews. The listing also identifies creators, social-media users, marketers, and storytellers as the intended users. Talkie appears in MiniMax's official product list and the M2-her research post confirms a dedicated companion and role-play product track, but public monetization detail around Talkie itself
    is materially thinner than for Hailuo.
