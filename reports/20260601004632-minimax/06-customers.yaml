- id: adoption-trajectory-and-monetization
  title: Adoption trajectory and monetization signals
  body: 'The adoption picture looks strongest when MiniMax''s user, usage, and revenue metrics are kept in separate buckets. KrASIA reports 2025 revenue of US$79 million, with US$53.1 million from AI-native products and US$26 million from open-platform and enterprise services; the same article says annual recurring revenue exceeded US$150 million in February and more than 70% of revenue came from international markets. Those figures matter more than the raw reach claims because they show both B2C and B2B monetization. CNBC adds a sharper concentration clue: Talkie and its domestic Xingye counterpart reportedly accounted for more than one third of company revenue in the first three quarters of the year and averaged more than 20 million monthly active users. Hailuo contributes separate monetization proof through paid subscriptions, creator review activity, and video-pricing disclosures. KrASIA''s 600 million cumulative generated videos and The Decoder''s 3.7 billion video-creation figure are
    not directly comparable, but both support real platform throughput rather than a marketing-only launch.'
