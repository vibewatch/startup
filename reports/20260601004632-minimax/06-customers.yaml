- id: concentration-and-customer-risks
  title: Concentration and customer risks
  body: Customer quality is where the MiniMax story weakens. First, the strongest public scale and monetization clues point back to consumer-facing products, especially Talkie and Hailuo, rather than to disclosed enterprise anchors. That raises mix risk if higher-value API and team accounts are smaller than the broad 214,000 headline implies. Second, companion AI faces direct regulatory sensitivity. CNBC reports draft China rules aimed at emotional manipulation, self-harm content, minors, and mandatory security assessments for large AI-companion services; those proposals map directly onto Talkie-style products. Third, Hailuo faces copyright and provenance pressure. Reuters and Straits Times describe major Hollywood litigation alleging copyrighted character use in customer-facing Hailuo outputs and promotions. Finally, Fortune notes that geopolitical trust, censorship, and data-governance concerns can reduce Western enterprise willingness to deploy Chinese models. In short, MiniMax has evidence
    of real users and paying surfaces, but concentration, compliance, rights, and trust barriers could all slow customer quality improvement.
