- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: MiniMax converts awareness into monetization through a funnel that starts with public surfaces and ends with subscriptions, API spend, or team wallets.
  data:
    nodes:
    - id: surface
      label: Public surface
      detail: Users discover MiniMax through Talkie, Hailuo, news launches, GitHub, Hugging Face, or the API platform.
    - id: trial
      label: Trial / free usage
      detail: Consumers use free credits or optional trials; developers use free or low-friction open-source, API, or agent access.
    - id: value
      label: Task success
      detail: A creator gets usable media, a companion user returns for another session, or a developer completes a coding/agent task.
    - id: paid
      label: Paid conversion
      detail: Users buy subscriptions, token plans, credits, or paygo API usage once quota or quality needs increase.
    - id: team
      label: Team deployment
      detail: Owners assign token-plan seats, enable shared credits, or create team wallets for broader internal use.
    - id: expand
      label: Expansion / concentration
      detail: Spend expands with repeat usage, or stalls if regulation, rights, billing friction, or trust barriers interrupt adoption.
    edges:
    - from: surface
      to: trial
      label: Low-friction entry
    - from: trial
      to: value
      label: Usable output or workflow success
    - from: value
      to: paid
      label: Quota exhaustion / premium need
    - from: paid
      to: team
      label: More users or heavier workloads
    - from: team
      to: expand
      label: Repeat use or renewal decision
