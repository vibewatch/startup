  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: moderation and security review operations
    missingEvidence: MiniMax does not publicly document what triggers video security review, how review
      is staffed, what turnaround times exist, or how companion-chat escalation is operationalized.
    whyItMatters: A multimodal platform selling both creator and companion products faces safety, abuse,
      and service-quality risk that cannot be underwritten from launch notes alone.
    diligencePath: Request moderation policy docs, queue metrics, false-positive/false-negative tracking,
      and incident-response playbooks for media and companion products.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: training-data provenance and copyright protections for Hailuo
    missingEvidence: Public sources do not explain the provenance mix of Hailuo training data, any opt-out
      systems, or the exact safeguards intended to avoid copyrighted-character generation.
    whyItMatters: The active Hollywood litigation could affect product availability, output restrictions,
      and the perceived defensibility of MiniMax's video business.
    diligencePath: Request training-data sourcing policy, indemnity language, rights-management workflow,
      and a technical memo on copyrighted-asset blocking and watermarking.
    relatedQuestionRefs:
    - QE024
    - QE026
  - type: private-evidence-only
    severity: material
    topic: enterprise reliability and security posture
    missingEvidence: Reviewed public materials did not surface a status page, uptime SLA, incident history,
      or named third-party security certification for the platform.
    whyItMatters: Developer adoption can start from docs and GitHub, but enterprise conversion depends
      on reliability, incident response, and audit-ready security evidence.
    diligencePath: Request SOC 2 / ISO materials if they exist, historical uptime and incident reports,
      enterprise support policies, and customer-facing SLA templates.
    relatedQuestionRefs:
    - QE022
    - QE026
    relatedTableRefs:
    - TE004
  - type: methodology-gap
    severity: material
    topic: benchmark methodology and self-selection bias
    missingEvidence: MiniMax publishes many benchmark and evaluation narratives, but external corroboration
      is uneven and some favorable comparisons rely on user-rated arenas or company-authored methodology.
    whyItMatters: Investors can over-credit model advantage if pricing or ranking claims are not reproducible
      across independent evaluation setups.
    diligencePath: Request raw benchmark protocols, independent reruns, customer case studies with production
      metrics, and win/loss analysis versus named competitors in live deployments.
    relatedQuestionRefs:
    - QE014
    - QE025
    - QE026
    relatedTableRefs:
    - TE004
