- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control / quality signal
  - status
  - scope
  - gap
  rows:
  - - Video security review
    - publicly referenced
    - Video package docs say failed or security-reviewed jobs are not deducted
    - MiniMax does not publicly explain reviewer logic, thresholds, or appeal workflow
  - - Rate limits and async boundaries
    - documented
    - LLM, video, speech, and music limits plus polling flows are public
    - throughput controls are not the same as reliability guarantees or abuse-prevention disclosure
  - - Companion-AI regulation readiness
    - externally tightening
    - CNBC reports draft China rules for suicide, emotional manipulation, minors, and session reminders
    - MiniMax does not publish a detailed Talkie compliance playbook in reviewed sources
  - - Copyright / data provenance controls
    - contested
    - Hailuo is under active U.S. copyright litigation over allegedly infringing outputs and training/use
    - public technical mitigation details are missing
  - - App-store data safety signals
    - partially visible
    - Play listing says data is encrypted in transit and deletion can be requested
    - this is not equivalent to enterprise security certification or platform-wide privacy transparency
  - - Reliability / security disclosures
    - thin
    - reviewed docs did not surface a status page, uptime SLA, or named third-party security certification
    - enterprise diligence still needs direct management disclosure
  - - Benchmark transparency
    - mixed
    - official launches cite strong performance and external outlets cite user arenas
    - self-selection and incomplete methodology limit underwriting confidence
  notes: The table separates visible controls from controls that are likely present but not publicly documented.
    Missing disclosures matter because MiniMax sells both creator and companion-AI workflows.
