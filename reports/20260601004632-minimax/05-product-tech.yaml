- id: multimodal-creator-products
  title: Video, speech, and music products
  body: 'Hailuo is the most visible multimodal product family and the one with the clearest external validation.
    Official materials describe a video stack that already supports text-to-video, image-to-video, start/end-frame
    video, subject-reference video, and template-driven agent flows. The launch notes for Hailuo 02 and
    Hailuo 2.3 push two related narratives: first, MiniMax claims it improved raw video fidelity through
    architecture and data changes; second, it argues that those improvements arrive at meaningfully lower
    price points than peers. The company''s own materials claim NCR-based efficiency improvements, native
    1080p output, stronger instruction following, and a Media Agent that moves from point generation toward
    broader multimodal assembly. External evidence partly supports that story: The Decoder reports strong
    user-benchmark placement and lower per-video cost than Veo-style alternatives, while the Play listing
    confirms the product ships on mobile and now leans into ad-generation workflows. Speech and music
    extend the same strategy into adjacent creator tools. Speech 2.8 emphasizes realism, sound tags, and
    cloning, while Music 2.6 expands from text-to-music into cover generation, stronger structure control,
    and agent-facing skills. Taken together, MiniMax is building a creative suite, but one whose most
    aggressive quality claims still rely heavily on company-authored evidence.'
