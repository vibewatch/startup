- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Foundation model families
    - provide reasoning, coding, role-play, speech, video, and music capabilities
    - continuous model release cadence and training economics
    - public disclosures vary widely by modality; strongest detail is on text
  - - Interleaved-thinking context handling
    - supports long-horizon agent tasks by preserving reasoning state in history
    - application keeps full message history intact
    - performance degrades if developers strip thinking blocks or compress context incorrectly
  - - API compatibility layer
    - lets teams call MiniMax through Anthropic- or OpenAI-style clients
    - stable endpoint behavior and SDK examples
    - compatibility does not by itself prove enterprise-grade operational maturity
  - - Async media job layer
    - handles long-running video and audio generation with task polling and file retrieval
    - job queue, storage, and download infrastructure
    - opaque failure reasons and moderation paths can create support burden
  - - Local deployment runtime
    - enables self-hosting on vLLM, SGLang, or MLX
    - high-end GPU or workstation hardware plus ecosystem support
    - deployment is feasible but not lightweight for ordinary customers
  - - Agent tooling layer
    - adds MCP servers, Mini-Agent patterns, and CLI ergonomics on top of raw models
    - GitHub maintenance and docs quality
    - tooling breadth increases support surface and versioning complexity
  - - Traffic and billing controls
    - rate limits, package units, prompt caching, and token plans govern usage
    - pricing pages and backend metering
    - list-pricing clarity does not reveal realized reliability or margin economics
  notes: Architecture rows describe the public operating model, not internal training infrastructure.
    Where docs are silent, the risk column highlights the missing operational detail.
