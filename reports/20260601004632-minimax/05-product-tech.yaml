- id: language-coding-and-roleplay-core
  title: Language, coding, and role-play model core
  body: 'The official product posture is clearest in MiniMax''s language stack. Platform docs now show
    M3 as the latest agentic, multimodal, 1M-context flagship, while M2.7, M2.5, M2.1, M2, and M2-her
    remain live for more specific jobs. That segmentation matters because MiniMax is not marketing a single
    universal model; it is differentiating between frontier long-context reasoning, cheaper/high-speed
    coding models, and a dedicated role-play model. The M2 and M2.1 launch materials push especially hard
    on agentic coding and tool use. Official claims emphasize multilingual code, mobile and web app development,
    office-task execution, and smooth behavior across external agent scaffolds. The most technically substantive
    public disclosure sits in the M2 architecture posts rather than the marketing pages. Those explain
    why MiniMax stuck with full attention, why interleaved thinking is treated as operationally important,
    and why history retention is part of product usage rather than only model training. On the role-play
    side, the M2-her post is valuable because it shows product intent: preserve long-tail character voice,
    manage long-horizon narrative coherence, and personalize pacing instead of optimizing for generic
    dialogue quality. What remains less verified is whether the company''s proprietary evaluation claims
    translate into durable production advantage outside its own benchmarks.'
  claimRefs:
