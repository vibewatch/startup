      - FO003
  - id: section-4
    title: Milestones, IPO trajectory, and adverse legal signals
    body: >-
      MiniMax’s chapter-one chronology is already dense enough to shape later diligence work. Official releases show a
      fast cadence of flagship launches across coding models, role-play systems, video generation, speech, and music
      from late 2025 into early 2026, reinforcing the picture of a company that is still expanding product scope while
      pushing an API/platform strategy. Externally, the company moved from the March 2024 mega-round into reported
      Hong Kong IPO preparations by mid-2025, which implies an accelerated financing timetable relative to many AI
      peers. The main adverse counterweight is Hailuo. Reuters Legal reported in September 2025 that Disney,
      Universal, and Warner Bros. Discovery sued MiniMax over alleged use of copyrighted characters and videos, and
      Reuters later reported in May 2026 that MiniMax lost its bid to dismiss that case. That combination matters:
      MiniMax appears ambitious, well-financed, and commercially broad, but it also carries a live intellectual-
      property risk that could complicate distribution, marketing, and public-market narrative control.
