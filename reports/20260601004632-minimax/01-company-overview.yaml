        - Clarify stake size, any board or observer rights, and whether Tencent has product or distribution preferences.
      - - HongShan Capital
        - Venture investor
        - Bloomberg and Reuters both place HongShan in MiniMax’s disclosed investor set, suggesting it remains a meaningful financial stakeholder.
