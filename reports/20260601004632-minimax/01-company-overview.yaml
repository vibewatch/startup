      - - Hillhouse Investment
        - Venture/growth investor
        - Reuters named Hillhouse among investors, indicating late-stage financial sponsorship beyond strategic platforms.
        - Confirm ownership, participation in later rounds, and any governance protections.
      - - Yunqi Capital
        - Venture investor
