    topic: Stakeholder or investor map remains a partial public enumeration in Company Overview
    missingEvidence: Public materials identify major investors and sponsors but not a full cap table or ownership split.
    whyItMatters: Control, liquidation preference, and information-rights questions cannot be resolved from the public record alone.
    diligencePath: Request the current cap table, financing documents, and investor rights schedule.
