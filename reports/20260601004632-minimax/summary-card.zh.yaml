summary:
  headline: MiniMax 已经搭出民营 AI 公司里少见的宽产品面，商业化也像是跑到了有意义规模；但未决 IP 诉讼、治理与财务不透明、 价格战压力仍重，按传闻后期估值看，更适合跟踪而不是买入。
