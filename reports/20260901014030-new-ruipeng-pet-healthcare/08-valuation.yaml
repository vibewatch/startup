    {
      "id": "scenarios-and-price-support",
      "title": "Scenarios, ranges, and the price-support test",
      "body": "The scenario work makes the investment call more concrete. The bull case assumes New Ruipeng has quietly repaired more than public evidence shows: revenue scaled toward RMB10-12 billion, EBITDA turned positive, network rationalization improved unit economics rather than signaling distress, and the Cayman issue remains containable at the parent level. Under that set of assumptions, a roughly RMB28-34 billion valuation band becomes plausible. That is the only scenario that overlaps the current 2026 Hurun-like mark.\n\nThe base case is less forgiving and better aligned with the public record. It assumes revenue nearer RMB8-9 billion, thinner margins than public bull arguments imply, and a market willing to pay about 2.0x-2.5x sales for a strategically important but still under-disclosed operator. That points to roughly RMB16-22 billion. The bear case is harsher: slower growth, continued EBITDA weakness, more visible store contraction, or deeper legal-structure stress could push value toward about RMB8-14 billion. That outcome would still recognize that New Ruipeng owns real scale and strategic relevance, but it would treat the business more like a complicated service-heavy network than a premium late-stage healthcare platform. The practical conclusion is that the current mark needs optimistic hidden data to clear; the public record alone supports downside skew rather than clear upside.",
