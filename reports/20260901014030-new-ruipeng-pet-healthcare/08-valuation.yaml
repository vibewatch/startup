      "title": "The current mark is best understood as a strategic reference value, not a public-evidence-cleared price",
      "body": "Hurun-style values are useful because they are current and widely recognized, but the methodology itself says they may rely on past rounds and industry comparatives. That makes them meaningful signals, not decisive underwriting proof.",
