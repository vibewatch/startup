        "CV002",
        "CV003",
        "CV001"
      ]
    },
    {
      "calloutType": "risk",
      "title": "The decisive missing variable is not whether New Ruipeng is real; it is whether 2025-2026 revenue and margins improved enough to justify the premium",
      "body": "If revenue roughly doubled from the 2022 baseline and EBITDA inflected positive, the current mark could become defensible. If not, it still looks ahead of fundamentals. That is why audited post-2022 financials are the single highest-priority diligence ask.",
