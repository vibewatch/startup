    "number": 8,
    "title": "Valuation",
    "summary": "New Ruipeng is clearly a real scaled asset, but the current public valuation support is weak. The best company-specific 2025-2026 value signals are secondary Hurun-derived marks of RMB33 billion in 2025 and RMB30.5 billion in 2026, while the last hard financial baseline remains 2022 revenue of RMB5.7402 billion and net loss of RMB1.4171 billion from the IPO filing. On that last disclosed revenue base, the current mark implies roughly 5.3x-5.7x sales — richer than the selected public pet-health, retail, and clinic comparables in this chapter. Recommendation: research-more; confidence: medium; risk rating: high; valuation stance: expensive at Hurun-like marks pending fresh audited financials and full cap-table / Cayman-process clarity."
  },
  "sections": [
    {
      "id": "recommendation-and-entry-discipline",
      "title": "Recommendation, confidence, and entry discipline",
      "body": "The public evidence supports a real company, not a clean price-support story. New Ruipeng is not a speculative shell: it has real scale, a still-marketed 1,000-plus hospital network, meaningful historical revenue, real customers, and strategic relationships that are uncommon in Chinese pet healthcare. That is the core positive case. But public valuation underwriting is harsher. The only current company-specific price signal that is newer than the 2020 financing is a secondary Hurun-derived mark: RMB33 billion in 2025 and RMB30.5 billion in 2026. Hurun's own methodology makes clear that these list values are useful reference points, but they are not the same thing as a new priced financing or a cleared public-market trade.\n\nThe last hard operating denominator is still 2022 revenue of RMB5.7402 billion from the F-1/A. On that denominator, the current Hurun-like mark implies about 5.3x-5.7x sales while the selected public comparables in this chapter mostly trade between about 0.7x and 4.0x. The exceptions are higher-quality animal-health names with cleaner margins and better disclosure. New Ruipeng also carries legal and structural overhangs that most public comps do not, including parent-level Cayman restructuring headlines and a much thinner public disclosure trail after the June 2024 IPO withdrawal. Recommendation: research-more rather than buy at the current reference mark. Confidence is medium because the company-quality case is real, but the price-support case still depends on non-public numbers. Risk rating is high because profitability, regulation, disclosure, and holding-company issues all matter to the multiple simultaneously. Entry discipline should be explicit: new money needs either a materially lower entry point — roughly the mid-to-high teens or low-20s billion RMB range — or fresh audited data proving a much stronger 2025-2026 financial profile than public evidence currently shows.",
