      "id": "capital-and-disclosure",
      "title": "Capital history and disclosure quality",
      "body": "The best-documented external capital event remains the September-October 2020 financing disclosed in the F-1/A. That filing names Tencent, Boehringer Ingelheim, Snow Lake, Gracious Rhythm, Worldwide Healthcare Trust, OrbiMed funds, Aspex, LBC, AIG, and ABCI, for roughly US$558 million of Class B capital across several tranches. Independent coverage by Global Venturing and KrASIA described the broader round as a Tencent-led raise worth hundreds of millions and attached a roughly US$4.4 billion valuation. In January 2023, just before the IPO push, New Ruipeng also issued a US$50 million convertible note to a Nestlé subsidiary. Importantly, Petfoodie's contemporaneous coverage said the amount and valuation were not publicly disclosed in press materials, so investors still rely on the SEC filing for the exact note size.\n\nDisclosure quality is the central limitation of the overview. The IPO filing gives a surprisingly rich 2022 picture — RMB5.74 billion of revenue, RMB318.8 million gross profit, RMB1.42 billion net loss, negative RMB948.2 million adjusted EBITDA, RMB566.8 million cash, 2.6 million active pet-care customers, and 5.2 million Rvet registered users. After the June 2024 withdrawal, however, the company returned to a more selective disclosure stance. Official 2025 news provides operating signals such as a claimed March 2025 profitability turning point in the medical module, but no audited 2024 or 2025 financial statements were found in reviewed public materials. That means the company is still sizeable and well capitalized by historical standards, but investors no longer have a current public financial baseline.",
