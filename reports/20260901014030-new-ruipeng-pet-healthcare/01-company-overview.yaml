      "id": "leadership-and-governance",
      "title": "Leadership, governance, and control",
      "body": "Peng Yonghe remains the central human anchor of the company. The F-1/A identifies him as founder, co-chairman, and president, and his biography runs continuously through the Ruipeng operating history from veterinarian to entrepreneur. However, the governance design disclosed for the IPO shows that New Ruipeng is not founder-controlled in the simple sense often associated with private roll-ups. Under the September 2020 shareholder agreement, management appointees had four board seats and Hillhouse-linked entities had four more, while Dachen and Riverhead each had one. That split implies strong investor oversight over capital allocation and governance even before any public listing.\n\nThe rest of the disclosed leadership bench is meaningful but still concentrated. Liang Li brought Hillhouse directly into the chairmanship as co-chairman and partner. Yanzhong Zhang represents long-tenured operating continuity from the legacy Ruipeng system and now shows up in official 2025 communications as the hospital-group general manager. Chenguang Zhou brought listed-company finance experience from China Foods and COFCO-linked roles. Even so, reviewed public materials still concentrate strategic legitimacy in Peng. There is no post-withdrawal public disclosure of a refreshed board charter, a new independent governance framework, or a succession plan after the failed IPO process. For a company this large, the governance picture is therefore adequate for understanding ownership influence but still incomplete for underwriting long-term execution depth.",
