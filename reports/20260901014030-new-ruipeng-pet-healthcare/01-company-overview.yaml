  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "New Ruipeng Pet Healthcare Group is China's largest pet-hospital platform by disclosed 2022 scale, built on a Ruipeng operating history that started in 1998 and a broader New Ruipeng group structure formed after Hillhouse-backed consolidation. The company filed for a Nasdaq IPO in 2023, disclosed RMB5.74 billion of 2022 revenue with continued losses, then withdrew the offering in June 2024. Current public signals still point to a very large private operator with 20-plus brands, 1,000-plus hospitals on its website, a 2025-2026 Hurun unicorn valuation range of roughly RMB30.5-33 billion, and strategic relationships with Tencent, Boehringer Ingelheim, Hillhouse, and Nestlé."
  },
  "sections": [
    {
      "id": "identity-and-footprint",
      "title": "Identity, footprint, and operating scope",
      "body": "New Ruipeng is best understood as three corporate layers rather than one simple founding date. The operating origin traces back to December 1998, when Peng Yonghe founded Ruipeng Pet Hospital in Shenzhen. Baidu's company profile treats 26 November 2013 as the establishment date of the group legal entity now profiled as New Ruipeng Pet Healthcare Group. The current structure was then reshaped in 2018, when Ruipeng completed strategic cooperation with Hillhouse and began operating under the broader New Ruipeng platform. Finally, the Cayman holding company used for the U.S. listing attempt was incorporated in June 2019. Using all three dates avoids a common mistake: calling the business either a 1998 startup or a 2019 Cayman shell without clarifying that both statements refer to different layers of the same platform.\n\nThe operating scope is also broader than a plain veterinary chain. The company and filing both describe three main pillars — pet care services, supply chain services, and local services — while the official site adds diagnostics, internet tools, welfare programs, talent development, and other adjacent functions. The current English-language website highlights more than 20 brands, more than 1,000 hospitals, and more than 90 cities. The last SEC-era disclosures were even larger: 23 brands, 1,891 hospitals, 113 cities, and operations in 31 provinces at 2022 year-end, rising to 1,942 hospitals and 114 cities by September 2022 in IPO marketing materials. The precise current audited hospital count is therefore unclear, but the combined sources leave no doubt that New Ruipeng remains the largest scaled pet-hospital network publicly documented in China.",
