evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current official or regulatory disclosure of exact employee count.
    whyItMatters: >-
      Headcount is a key proxy for labor intensity and operating leverage in a hospital roll-up but cannot be refreshed
      confidently from public sources.
    diligencePath: Request current HR dashboard or statutory social-insurance headcount from management in a diligence room.
    relatedQuestionRefs:
      - QO023
  - type: stale
    severity: material
    topic: current-scale
    missingEvidence: A post-2022 audited hospital count and city count.
    whyItMatters: >-
      The current website uses rounded language that obscures whether the network expanded, rationalized, or both after
      the IPO withdrawal.
    diligencePath: Obtain a 2024-2026 hospital master list with open, closed, and acquired sites by city.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A current post-withdrawal capitalization table, including Nestlé note status and investor ownership percentages.
    whyItMatters: Governance rights and dilution risk cannot be underwritten from the stale IPO-era structure alone.
    diligencePath: >-
      Request the latest shareholder register, all note or warrant instruments, and any board observer or
      director-rights side letters.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Audited 2023-2025 financial statements or current management accounts.
    whyItMatters: The company's overview still depends on 2022 financials, limiting confidence in present valuation and liquidity.
    diligencePath: Request audited statements, monthly management P&L, and cash bridge covering the period since the withdrawn IPO.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO015
  - type: missing-source
    severity: minor
    topic: standards-impact
    missingEvidence: >-
      Independent third-party evidence on how much the 2025 national standard materially changes clinic operations or
      creates commercial advantage for New Ruipeng.
    whyItMatters: >-
      Current evidence comes mostly from company and affiliated narratives, so strategic significance could be
      overstated.
    diligencePath: >-
      Interview regulators, competing chains, or veterinary associations about implementation costs and competitive
      effects.
    relatedQuestionRefs:
      - QO020
  - type: conflicting-data
    severity: material
    topic: market-boundary
    missingEvidence: >-
      A standardized third-party market map that reconciles pet economy, pet-care services, and pet-healthcare category
      definitions on one methodology.
    whyItMatters: Different category definitions can swing TAM by orders of magnitude and materially distort valuation multiples.
    diligencePath: >-
      Request the full Frost & Sullivan taxonomy used in the IPO filing and compare it against current industry
      white-paper definitions.
    relatedQuestionRefs:
      - QM001
      - QM011
      - QM012
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: capture-rate
    missingEvidence: >-
      A management or third-party estimate of what share of national pet-care spend is realistically chain-capturable
      for licensed hospital operators.
    whyItMatters: >-
      The difference between gross market size and chain-capturable medical spend drives whether New Ruipeng is under-
      or over-valued.
    diligencePath: >-
      Ask management for internal TAM/SAM work by city tier, clinic format, and service line; validate against
      competitor density maps.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: online-origin-share
    missingEvidence: >-
