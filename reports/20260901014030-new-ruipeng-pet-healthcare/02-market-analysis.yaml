    {
      "id": "buyer-and-demand",
      "title": "Buyer, user, payer, and demand formation",
      "body": "The economic buyer in pet healthcare is usually the pet owner, while the end user is the pet and the effective gatekeeper is the veterinarian or clinic brand that earns trust at the moment of care. China’s demand base is getting both larger and younger. The 2026 white paper says urban dog and cat population reached 126 million in 2025, while post-90s and post-00s owners represented roughly 69% of the market combined. These cohorts are digitally native, research-heavy, and increasingly willing to treat pets as long-duration household members instead of low-cost companions.\n\nDemand quality is rising even where raw pet-population growth is slower. Annual spend per dog and cat reached RMB3,006 and RMB2,085 in 2025, and hospital-visit rates increased for both species. Owners most often consult veterinarians or visit hospitals directly when dealing with disease questions, which means clinical trust remains the primary conversion mechanism even in a digital market. Adjacent service preferences also reinforce the importance of standardization: professional quality, proximity to home, and a clean environment rank highly in grooming and boarding decisions. That logic likely transfers into clinic choice as chains compete with independents. For New Ruipeng, this creates a favorable setup for a brand-and-network model rather than a pure online marketplace model.",
