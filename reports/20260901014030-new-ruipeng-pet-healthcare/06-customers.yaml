  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "New Ruipeng's public customer proof is strongest on breadth: the last filing disclosed roughly 2.6 million active pet-care customers, 56% repurchase in 2022, and 5.2 million registered Rvet users, while the current website still describes a 20-plus-brand network serving millions of pets across more than 90 cities. The company also shows live channel activity through Meituan group-buy packages, customer-favorite merchant awards, and an internet-hospital surface that spans consultation through follow-up. What remains missing is audited current retention, city-level monetization quality, and post-IPO-withdrawal customer metrics for 2025-2026."
  },
