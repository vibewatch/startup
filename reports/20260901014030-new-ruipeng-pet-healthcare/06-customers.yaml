    {
      "id": "historical-adoption-and-usage-proof",
      "title": "Historical adoption and usage proof",
      "body": "The strongest quantitative customer evidence still comes from the 2023 SEC filings. Those filings disclosed that active pet-care customers increased from about 2.5 million in 2021 to about 2.6 million in 2022, while annual net revenue per active customer fell modestly from RMB1,203 to RMB1,129. More importantly for durability, the company said it achieved an approximately 56% pet-care customer repurchase rate in 2022, versus an industry average of 30%-40%. For a veterinary chain, that is a meaningful sign that the network was not operating as a pure emergency-only service. It implies pet owners were coming back for repeat clinical and related services.\n\nThe Rvet platform added a second adoption layer. The filings say Rvet had about 5.2 million registered users and about 1.347 million active customers in 2022, and explicitly define an active customer as a user making at least one purchase during the period. The same filing describes Rvet as a closed-loop online program and the company's core online platform for local services. It supports appointment booking, records review, expert consultation, monthly care packages, and product purchases. The filings also say roughly one-third of active hospital customers consumed in other company channels in 2022, suggesting that cross-sell between clinics and digital or retail surfaces was already material. Even though these numbers are stale, they remain the best public evidence that New Ruipeng had achieved real customer scale before returning to private-market opacity.",
