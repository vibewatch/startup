      "id": "segments-and-service-surfaces",
      "title": "Customer segments and service surfaces",
      "body": "New Ruipeng is fundamentally a consumer healthcare company. Its buyers and payers are pet owners who purchase veterinary care, diagnostics, grooming, vaccination, boarding-adjacent services, and pet products for companion animals. The current official surfaces make that clear: the company markets a service menu that includes vaccinations, health examinations, parasite protection, teeth cleaning, spay/neuter procedures, remote diagnosis, online consultation, grooming, bathing, and SPA. The Ruipeng Pet Hospital consumer site reinforces the same point by advertising medical treatment together with grooming, boarding care, bathing, SPA, and food-and-supplies sales. This is not a narrow one-off surgery business; it is a recurring relationship business organized around the ongoing needs of pet parents.\n\nThe current customer footprint is also multi-brand and multi-city. The official intro page says New Ruipeng operates more than 20 brands, more than 1,000 hospitals, and serves more than 90 cities, explicitly naming Beijing, Shanghai, Guangzhou, Shenzhen, Hong Kong, Chengdu, Hangzhou, Chongqing, Wuhan, Xi'an, Suzhou, Tianjin, Nanjing, Changsha, Zhengzhou, Shenyang, and Lanzhou. That footprint suggests a customer base centered on urban China, especially where higher-income pet ownership and specialty care are more established. The home page also says the company serves millions of pets and homeless animals in over 1,600 communities. Put together, the evidence supports a broad consumer funnel that starts with local discovery and extends through a layered network of central, specialty, international, and community hospitals.",
