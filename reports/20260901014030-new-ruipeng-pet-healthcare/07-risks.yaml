    "number": 7,
    "title": "Risks",
    "summary": "New Ruipeng's risk profile is high and highly interconnected. The clearest issues are regulatory and operational: China's pet-hospital rules require branch-by-branch licensing, qualified veterinarians, strict records, epidemic reporting, waste controls, and scoped internet diagnosis, while the company's own filing admits historical gaps in drug records, off-label or unapproved medication use, and narcotic-procedure compliance at some hospitals. Those execution burdens sit on top of large historical losses, a thinned public disclosure trail after the June 2024 IPO withdrawal, and November 2025 Cayman restructuring headlines that create legal and financing uncertainty around the parent holding company."
  },
  "sections": [
    {
      "id": "regulatory-and-legal-exposure",
      "title": "Regulatory and legal exposure",
      "body": "New Ruipeng operates in a tightly regulated corner of healthcare services. China's 2022 rules for animal diagnosis institutions require formal licenses, fixed premises, qualified staff, functional treatment areas, isolation controls, equipment, waste-handling systems, epidemic-reporting processes, and strict limits on practice scope. Branch expansion does not eliminate that burden; each branch institution must obtain its own license. The same rule set permits internet-enabled diagnosis activities only through filed-in veterinarians and only within the licensed scope of the institution. For a network that historically disclosed almost 1,900 hospitals and still markets itself as 1,000-plus hospitals today, that means the regulatory surface area scales with every site, every veterinarian, every record, and every online workflow.\n\nNew Ruipeng's own filings show that this is not theoretical. The F-1/A says Rvet and Zhiyue already hold certain telecom licenses, yet additional permits may still be required for internet information, audio-visual, internet culture, online publishing, or private-school activities as interpretations evolve. The filing also warns that online local services and education activities may be deemed restricted or prohibited foreign-invested businesses under PRC law. Most importantly, the filing explicitly states that some hospitals used human or not-fully-approved veterinary drugs, some had inaccurate or incomplete drug records, and some did not follow all required procedures for narcotic and psychotropic drugs for animals. Those admissions turn compliance from a generic sector risk into a company-specific operating issue. New Ruipeng's leadership in national standards and internal SOP rollout is a real mitigation, but it is not an external clean bill of health.",
