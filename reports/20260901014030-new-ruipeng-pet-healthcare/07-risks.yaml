    {
      "id": "financial-governance-and-partner-risk",
      "title": "Financial, governance, and partner risk",
      "body": "The financial and governance picture remains the hardest risk cluster to underwrite cleanly. The last audited public baseline is still 2022: RMB5.7402 billion of revenue, RMB318.8 million of gross profit, RMB1.4171 billion of net loss, and about negative RMB948.2 million of adjusted EBITDA. The June 2024 withdrawal proved that New Ruipeng could step back from public markets without ever pricing the offering, but it did not answer whether the company fixed the underlying profitability problem. Since then, the U.S. filing trail effectively ends. CapEdge and BamSEC show no new public operating update after the withdrawal request. OffshoreAlert headlines then introduced a new and more serious question: in November 2025, the Cayman parent reportedly sought the appointment of restructuring officers while still controlling more than 1,800 operating subsidiaries and branches in China. The detail is still too thin to model precisely, but it raises legitimate legal and financing uncertainty around the offshore holding structure.\n\nPartner and industry dependencies add another layer. JD can improve customer acquisition, insurance settlement, and at-home diagnostics, but it also creates dependency on non-owned channel execution and data-sharing arrangements. Boehringer brings training, disease understanding, and solution quality, yet some of the ecosystem story still leans on that strategic relationship. More broadly, 36Kr and other critical coverage argue that China's pet-medical market remains fragmented, price-sensitive, and structurally margin-constrained. If that framing is broadly right, then New Ruipeng carries not only company-specific risk but also business-model risk: the network may be operationally impressive and still struggle to convert scale into durable profits.",
