        title: Exhibits
        blocks:
          - type: callout
            title: The current mark is best understood as a strategic reference value, not a public-evidence-cleared price
            body: >-
              Hurun-style values are useful because they are current and widely recognized, but the methodology itself
              says they may rely on past rounds and industry comparatives. That makes them meaningful signals, not
              decisive underwriting proof.
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
              - CV001
          - type: callout
            title: >-
              The decisive missing variable is not whether New Ruipeng is real; it is whether 2025-2026 revenue and
              margins improved enough to justify the premium
            body: >-
              If revenue roughly doubled from the 2022 baseline and EBITDA inflected positive, the current mark could
              become defensible. If not, it still looks ahead of fundamentals. That is why audited post-2022 financials
              are the single highest-priority diligence ask.
            calloutType: risk
