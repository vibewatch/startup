      - number: '6.4'
        title: Retention quality and concentration verdict
        blocks:
          - type: paragraph
            body: >-
              The customer story is credible, but it is not fully underwritten. New Ruipeng has better public proof of
              breadth than of quality-adjusted durability. Historical filings show millions of users, meaningful repeat
              purchase, and cross-channel behavior. Current official pages still show a large urban brand network and
              active platform partnerships. Yet the company no longer publishes current active-customer counts, case
              volumes, retention cohorts, city-level conversion, or revenue concentration by channel. There is also no
              independent public roll-up of branch-level ratings because major Chinese review surfaces such as Dianping
              are difficult to access programmatically and were not reviewable in a stable fetched form during this run.


              The main downside signal is affordability pressure. 36Kr argues that many young Chinese pet owners are
              price-sensitive when facing higher-priced medical expenses and that smaller clinics still use price wars
              to attract customers. That matters because New Ruipeng is trying to sell standardized, higher-trust care
              through a scaled network that likely carries more overhead than a single independent clinic. The company's
              real concentration risk therefore looks less like one huge enterprise customer and more like a mix of
              urban concentration, channel dependence on local platforms and Rvet, and incomplete visibility into
              whether repeat usage translates into attractive city-level economics. The net verdict is constructive on
              customer breadth and ecosystem engagement, but cautious on current retention transparency and monetization
              quality.
