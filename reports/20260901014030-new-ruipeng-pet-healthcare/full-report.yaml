  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real company, not a clean price-support story. New Ruipeng is not a
              speculative shell: it has real scale, a still-marketed 1,000-plus hospital network, meaningful historical
              revenue, real customers, and strategic relationships that are uncommon in Chinese pet healthcare. That is
              the core positive case. But public valuation underwriting is harsher. The only current company-specific
              price signal that is newer than the 2020 financing is a secondary Hurun-derived mark: RMB33 billion in
              2025 and RMB30.5 billion in 2026. Hurun's own methodology makes clear that these list values are useful
              reference points, but they are not the same thing as a new priced financing or a cleared public-market
              trade.


              The last hard operating denominator is still 2022 revenue of RMB5.7402 billion from the F-1/A. On that
              denominator, the current Hurun-like mark implies about 5.3x-5.7x sales while the selected public
              comparables in this chapter mostly trade between about 0.7x and 4.0x. The exceptions are higher-quality
              animal-health names with cleaner margins and better disclosure. New Ruipeng also carries legal and
              structural overhangs that most public comps do not, including parent-level Cayman restructuring headlines
              and a much thinner public disclosure trail after the June 2024 IPO withdrawal. Recommendation:
              research-more rather than buy at the current reference mark. Confidence is medium because the
              company-quality case is real, but the price-support case still depends on non-public numbers. Risk rating
              is high because profitability, regulation, disclosure, and holding-company issues all matter to the
              multiple simultaneously. Entry discipline should be explicit: new money needs either a materially lower
              entry point — roughly the mid-to-high teens or low-20s billion RMB range — or fresh audited data proving a
              much stronger 2025-2026 financial profile than public evidence currently shows.
            claimRefs:
