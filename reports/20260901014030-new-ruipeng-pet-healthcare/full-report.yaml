      - number: '2.4'
        title: Market verdict for New Ruipeng
        blocks:
          - type: paragraph
            body: >-
              The best market judgment is constructive but not simplistic. China’s pet economy is unquestionably large,
              and its veterinary-service demand still looks underpenetrated relative to mature countries. However, the
              investable market for New Ruipeng is narrower than the most aggressive headline TAMs suggest. A realistic
              service TAM should sit somewhere between the filing’s pet-care market framing and broader service-share
              estimates, not at the full pet-economy level. That still leaves a large opportunity set for a scaled
              operator, because the combination of rising clinical demand, digital discovery, regulatory formalization,
              and fragmented local supply favors chains that can standardize care and absorb compliance costs.


              The unresolved issue is capture, not existence. Demand is present. The harder question is how much of that
              demand can be profitably served by licensed, quality-controlled, multi-brand hospital networks rather than
              by independent clinics, local platforms, and lower-cost informal providers. That is why later chapters
              must connect the attractive market backdrop to product execution, customer durability, and capital
              intensity before treating the market alone as an investment case.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM034
              - CM036
              - CM037
              - CM039
