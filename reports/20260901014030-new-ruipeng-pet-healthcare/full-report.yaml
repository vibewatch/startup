companyProfile:
  summary: >-
    New Ruipeng grew out of Peng Yonghe's Shenzhen veterinary business founded in 1998, was reorganized into the broader
    Hillhouse-backed New Ruipeng platform in 2018, and later attempted a U.S. listing through a Cayman parent before
    withdrawing in 2024. Today it combines a 1,000-plus-hospital network with diagnostics, supply-chain services, local
    services, Rvet digital workflows, and strategic ecosystem partnerships. Public evidence proves scale and strategic
    relevance, but not yet the current financial quality needed to support the latest implied valuation cleanly.
