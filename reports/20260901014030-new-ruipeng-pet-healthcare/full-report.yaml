      - number: '2.3'
        title: Growth drivers versus structural constraints
        blocks:
          - type: paragraph
            body: >-
              The market’s headline growth drivers are clear: low household pet ownership versus the U.S., lower per-pet
              spending than mature markets, younger urban owners, rising interest in preventive care, and the ability to
              cross-sell products and services once a pet owner enters a trusted network. The company’s own filing
              argues that 38% of hospital customers already consumed through other channels by 2022, illustrating the
              wallet-share upside once a chain captures the first medical interaction. In mature markets, Banfield and
              VCA show that large veterinary platforms can layer diagnostics, wellness plans, urgent care, and
              acquisition-led expansion on top of a wide base of neighborhood hospitals.


              The constraints are just as important. China’s industry remains fragmented and increasingly competitive.
              Licensing rules apply at both institution and practitioner level, and regulations around quarantine, waste
              disposal, disease reporting, veterinary drugs, and prescribed scope of practice make quality chains harder
              to scale than low-regulation retail concepts. Talent is the other bottleneck: hospital growth needs
              trained clinicians and specialty capacity, not just leases and marketing. That is why New Ruipeng’s
              emphasis on talent development and national standard setting matters strategically. Formalization raises
              the bar for everyone, but the operators with training systems, capital, and compliance infrastructure
              should gain relative advantage over smaller clinics.
            claimRefs:
