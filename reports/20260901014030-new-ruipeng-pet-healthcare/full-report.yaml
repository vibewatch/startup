      - number: '4.3'
        title: Capital adequacy, financing dependence, and balance-sheet quality
        blocks:
          - type: paragraph
            body: >-
              The balance sheet was not distressed in the simple sense, but it was not self-funding either. At 2022
              year-end the company had RMB566.8 million of cash and cash equivalents, RMB1.165 billion of restricted
              cash, and disclosed unused credit lines of RMB2.8564 billion, of which roughly RMB1.3952 billion was
              expected to be available for use. Short-term bank borrowings stood at RMB1.3838 billion. Read together,
              these numbers suggest a company that still had financing capacity, but not one that had escaped reliance
              on external capital or short-term borrowing.


              The funding timeline reinforces that view. The 2020 Tencent-led round and the January 2023 Nestlé
              convertible note both matter because the operating model appears to have required fresh capital to support
              network scale, working capital, and investment. The filing directly said equity financings and short-term
              bank borrowings had been the primary liquidity sources. That is a workable setup for a large private
              platform, but it also means the company’s capital adequacy cannot be judged purely from cash on hand.
              Investors have to ask how much of reported liquidity was truly discretionary, how much was tied up, and
              how much margin improvement would be needed before the business could finance growth internally.
