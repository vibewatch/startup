      - number: '8.2'
        title: Current valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The key valuation tension is straightforward. The 2020 round valued New Ruipeng at nearly RMB30 billion. A
              Baidu Baike page summarizing Hurun placements says the company later appeared at RMB33 billion in the 2025
              Global Unicorn Index and RMB30.5 billion in the 2026 list. In other words, the public signal suggests that
              six years of scale-building, a U.S. listing attempt, and a later convertible note have produced little
              visible mark-up over the 2020 round. That is not necessarily bearish in itself — late-stage venture
              markets compressed sharply after 2021 — but it does mean investors cannot assume hidden compounding. The
              June 2024 RW withdrawal ended the public-listing path before a market-clearing price emerged, and
              CapEdge/BamSEC show that the public filing trail effectively stops there.


              The comparable set does not rescue the current mark. Yahoo Finance shows CVS Group at about 1.34x trailing
              sales and Pets at Home at about 0.67x. Chewy sits near 0.7x-0.8x on a market-cap-to-revenue lens depending
              on source and timing. Zoetis is the premium outlier at roughly 3.35x-4.05x because it is an animal-health
              pharmaceutical leader with much stronger margins, disclosure, and public-market depth than a clinic chain.
              Relative to that band, New Ruipeng's implied 5.3x-5.7x on stale 2022 revenue looks expensive. There is a
              path under which the mark becomes more reasonable: if 2025-2026 revenue has grown toward roughly RMB10-11
              billion and margins have improved sharply, the same valuation signal would compress toward about 3x sales.
              But public evidence does not currently prove that. The weight of available evidence therefore says the
              current reference mark is a strategic-asset price, not a publicly supported fundamental price.
            claimRefs:
