        title: Exhibits
        blocks:
          - type: callout
            title: The market is big, but the right TAM is smaller than the headline pet economy
            body: >-
              The highest-confidence demand conclusion is directional: China pet healthcare has real secular growth. The
              lowest-confidence conclusion is any pitch that lifts one headline RMB300bn+ number and treats all of it as
              hospital revenue opportunity.
            calloutType: insight
            claimRefs:
