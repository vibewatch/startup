              If audited margins improved, stores were rationalized cleanly, and the Cayman restructuring is contained,
              the public record is materially understating quality. If not, current opacity is itself part of the risk.
              That is why the absence of refreshed audited numbers matters almost as much as the 2022 loss profile.
