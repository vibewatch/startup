    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'THESIS: New Ruipeng is a rare scaled pet-healthcare asset in China'
        - 1,000+ marketed hospitals, IPO-era revenue scale, and major ecosystem partnerships are all real
        - Fresh data show the network is shrinking faster than margins improve, or partner benefits do not monetize.
      - - 'THESIS: Ecosystem depth could justify some premium'
        - >-
          JD integration, Boehringer support, and standardization efforts create more optionality than a standalone
          clinic roll-up
        - Unit economics show these ecosystem surfaces add complexity without meaningful revenue or margin benefit.
      - - 'ANTI-THESIS: The public mark is not supported by current public fundamentals'
        - >-
          Hurun-style marks are secondary signals, not fresh financings, and the last disclosed revenue base implies a
          premium above public comps
        - Audited 2024-2026 numbers show revenue doubled and EBITDA turned positive.
      - - 'ANTI-THESIS: Scale may be service-heavy rather than software-like'
        - 2022 losses, weak adjusted EBITDA, and adverse industry evidence point to hard-to-scale economics
        - Hospital-level cohorts show strong same-store productivity and improving contribution margins.
      - - 'ANTI-THESIS: Legal and structure opacity deserve a discount'
        - Withdrawn IPO, sparse public disclosure, and Cayman restructuring headlines all widen the discount rate
