  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Cayman process worsens
        - Restructuring becomes more detailed, creditor-heavy, or operationally connected to PRC subsidiaries
        - Discount rate rises and holding-company certainty falls
        - Pause positive underwriting and request immediate legal diligence.
      - - New round clears below reference bands
        - Fresh financing prices well below 2020 or Hurun-like bands
        - Creates direct negative price discovery and resets return math
        - Re-underwrite from the bear/base cases before adding capital.
      - - Further network contraction without margin repair
        - Closures continue but contribution margins do not visibly improve
        - Supports anti-thesis that scale was low quality
        - Reduce strategic-scarcity premium and focus on downside protection.
      - - Core regulatory or quality incident
        - Confirmed license, care-quality, or compliance problem in key hospitals
        - Damages trust and increases legal risk
        - Escalate risk rating and revise scenario probabilities downward.
      - - Audited numbers fail to inflect
        - 2024-2025 or 2026 data still show weak EBITDA and heavy cash needs
        - Current mark loses remaining benefit of doubt
        - Shift to avoid unless valuation resets materially.
    notes: Triggers were chosen because they create genuine re-underwriting events rather than ordinary operating noise.
    claimRefs:
      - CV015
      - CV016
      - CV044
      - CV045
      - CV051
      - CV052
      - CV053
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - 2024-2025 audited financials
        - Revenue, gross margin, EBITDA, capex, and hospital-level contribution margin bridge
        - Needed to test whether the public mark is rich or merely stale
        - Finance data room, auditor package, and city-tier margin bridge.
      - - Cap table and preference stack
        - Liquidation preferences, convertibles, debt, and any structural seniority above common
        - Return math is unreliable without the full waterfall
        - Board or legal data room plus current financing documents.
      - - Cayman restructuring detail
        - Petition, creditor matrix, officer appointments, ring-fencing, and operating impact
        - Parent-level stress may change both downside and timing
        - Counsel memo, court filings, and management Q&A.
      - - Store-count and same-store bridge
        - Openings, closures, acquisitions, mature-store cohorts, and utilization
        - Needed to separate quality rationalization from distress contraction
        - Ops diligence, city-level KPI pack, and regional management interviews.
      - - Customer economics
        - Repeat visits, retention, AOV, insurance attach, and cohort contribution by service type
        - Tests whether ecosystem breadth converts into durable economics
        - Growth and hospital ops workstream with cohort exports.
      - - Risk-control evidence
        - Cyber, licensing, clinical-quality, and compliance audit outputs
        - Discount-rate compression requires proof that scale is governable
        - Internal audit, external assessments, and regulator correspondence.
    notes: These are the minimum decision-critical diligence asks before making a price-led investment decision.
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
