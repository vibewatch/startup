  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what should count as TAM
        blocks:
          - type: paragraph
            body: >-
              The first analytical challenge is definitional. Some sources use “pet market” to mean the entire spending
              universe across food, supplies, services, and healthcare. Others use “pet care market” to mean a narrower
              services-heavy category centered on veterinary treatment and related care. Still others — especially
              healthcare research publishers — isolate pet-healthcare products and clinical-adjacent categories into a
              much smaller addressable market. For New Ruipeng, the right market boundary is not the full pet economy.
              The company monetizes a service-led mix built around hospitals, diagnostics, grooming, local services, and
              supply chain. That means total pet-economy numbers are useful for directional growth, but not as the
              valuation denominator.


              This distinction matters because the numbers diverge widely. Frost & Sullivan data reproduced in the F-1/A
              puts the total China pet market at RMB285.9 billion in 2022 and the narrower pet-care market at RMB56.3
              billion. The 2026 white paper, by contrast, says urban dog-and-cat consumption reached RMB312.6 billion in
              2025. StrategyHelix presents an even smaller future market of USD942.8 million by 2031 for “pet
              healthcare,” which is almost certainly a narrower product or healthcare category rather than the full
              veterinary-services opportunity. The correct takeaway is not that one of these sources is wrong; it is
              that they answer different questions. Later valuation work should therefore use layered TAM logic rather
              than a single headline market number.
            claimRefs:
