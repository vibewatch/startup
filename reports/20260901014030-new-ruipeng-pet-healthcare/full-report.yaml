        title: What the product actually is
        blocks:
          - type: paragraph
            body: >-
              New Ruipeng does not sell a single product in the software-company sense. Its public materials describe a
              care platform made up of more than 20 brands, 1,000-plus animal hospitals, 14 veterinary specialties,
              central and international hospitals, internet-hospital services, diagnostics, supply-chain enablement, and
              training systems. The filing reinforces that broader framing by listing third-party diagnosis, continued
              veterinary education, and marketing-as-a-service alongside core pet care. That breadth is strategically
              important because it means product quality depends on how well the company coordinates clinical,
              logistical, and digital assets rather than on one hero feature.


              The most tangible assets are the hospital network, the central diagnostics infrastructure, and the
              software systems that support care delivery. RVET and local-service surfaces extend the offering into
              consultation, booking, and aftercare. The international division extends the company into premium and
              specialist care formats, while the education layer supports clinician throughput and standardization. This
              is closer to a healthcare operating platform than a narrow chain-store retail concept.
