        title: Exhibits
        blocks:
          - type: callout
            title: The breadth signal is real
            body: >-
              Even with stale financial disclosure, New Ruipeng still shows unusually strong public proof of customer
              breadth for a private healthcare roll-up: millions of historical customers, a seven-figure transactional
              online surface, a large urban network, and live local-platform activity.
            calloutType: strength
            claimRefs:
              - CU002
              - CU007
              - CU010
              - CU018
          - type: callout
            title: Retention quality is the missing piece
            body: >-
              The public record stops short of proving that customer breadth translates into attractive, durable
              economics today. Current cohorts, NPS, same-store visit trends, and channel contribution margins are not
              public, while independent reporting suggests price sensitivity remains a real constraint.
            calloutType: risk
