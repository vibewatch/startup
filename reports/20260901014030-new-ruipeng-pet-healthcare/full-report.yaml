      - number: '1.4'
        title: Milestones, strategic signals, and adverse developments
        blocks:
          - type: paragraph
            body: >-
              Recent public signals show a company that is still expanding its institutional role in China's pet-health
              ecosystem even while staying private. Official 2025 coverage emphasizes tighter cooperation with Meituan,
              standard-setting work with the Futian district government, and leadership in the first national guidance
              specific to pet diagnosis and treatment service institutions. The diagnostics and technology pages
              reinforce a strategy that pairs hospital scale with central labs, digital workflows, and specialty-care
              standardization. Business Wire China's Boehringer release adds another strategic layer: New Ruipeng is
              positioned not only as a veterinary-service chain but also as a partner for disease understanding,
              professional training, and broader animal-health distribution.


              The main adverse corporate milestone is the June 2024 withdrawal of the Nasdaq listing. The SEC letter is
              explicit that the company chose not to proceed, that the filing never became effective, and that no
              securities were sold. Renaissance Capital and IPOScoop both treated the transaction as a shelved US$100
              million IPO. Since then, the public evidence reviewed here shows no replacement filing or firm relisting
              timetable. At the same time, Baidu's company profile says the business remained on the 2025 and 2026 Hurun
              global unicorn lists at RMB33 billion and RMB30.5 billion valuations respectively, suggesting that
              private-market status did not erase its unicorn standing. The combination matters: New Ruipeng still looks
              strategically important and operationally large, but its investability story is now driven more by
              historic scale and ecosystem position than by fresh public disclosure.
