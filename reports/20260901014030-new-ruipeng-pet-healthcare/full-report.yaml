              This is not just a compliance-heavy company; it is a compliance-heavy company that admitted past
              compliance gaps
            body: >-
              The most important risk signal is that New Ruipeng's own filing did not present regulation as a
              hypothetical backdrop. It disclosed issues around drug use, records, and narcotic procedures at some
              hospitals, meaning future diligence has to focus on remediation quality rather than on abstract sector
              rules.
