chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating scope
        blocks:
          - type: paragraph
            body: >-
              New Ruipeng is best understood as three corporate layers rather than one simple founding date. The
              operating origin traces back to December 1998, when Peng Yonghe founded Ruipeng Pet Hospital in Shenzhen.
              Baidu's company profile treats 26 November 2013 as the establishment date of the group legal entity now
              profiled as New Ruipeng Pet Healthcare Group. The current structure was then reshaped in 2018, when
              Ruipeng completed strategic cooperation with Hillhouse and began operating under the broader New Ruipeng
              platform. Finally, the Cayman holding company used for the U.S. listing attempt was incorporated in June
              2019. Using all three dates avoids a common mistake: calling the business either a 1998 startup or a 2019
              Cayman shell without clarifying that both statements refer to different layers of the same platform.


              The operating scope is also broader than a plain veterinary chain. The company and filing both describe
              three main pillars — pet care services, supply chain services, and local services — while the official
              site adds diagnostics, internet tools, welfare programs, talent development, and other adjacent functions.
              The current English-language website highlights more than 20 brands, more than 1,000 hospitals, and more
              than 90 cities. The last SEC-era disclosures were even larger: 23 brands, 1,891 hospitals, 113 cities, and
              operations in 31 provinces at 2022 year-end, rising to 1,942 hospitals and 114 cities by September 2022 in
              IPO marketing materials. The precise current audited hospital count is therefore unclear, but the combined
              sources leave no doubt that New Ruipeng remains the largest scaled pet-hospital network publicly
              documented in China.
