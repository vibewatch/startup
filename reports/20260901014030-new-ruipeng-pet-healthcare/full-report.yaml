  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, mix, and growth quality
        blocks:
          - type: paragraph
            body: >-
              The filing shows a more diversified revenue engine than the label “pet hospital chain” suggests. In 2022
              New Ruipeng generated RMB5.7402 billion of revenue, up 20.0% from 2021, with the increase driven primarily
              by supply chain services. Pet care services still formed the largest line at 51.7% of revenue, but supply
              chain rose to 38.0% and local services contributed 10.3%. This mix matters because it means the company’s
              financial model is not simply a clinic P&L multiplied across locations. It is a hybrid of medical fees,
              grooming, product distribution, local e-commerce, and prepayment-linked service flows.


              That hybrid cuts both ways. On one hand, it gives New Ruipeng more wallet-share surfaces than a pure
              hospital operator and may create cross-sell advantages once a customer enters the system. On the other
              hand, it makes quality-of-revenue analysis harder. A growing share from supply chain can lift scale faster
              than clinic throughput alone, but it may carry different gross-margin, working-capital, and
              cash-conversion characteristics than hospital care. Investors therefore need to separate “large revenue
              base” from “high-quality medical revenue base” when assessing the business.
