            body: >-
              The official product pages and filing make the operating architecture legible even without source code. At
              the base level, New Ruipeng says it built an ERP-centered business-process system spanning CRM, promotion
              management, supply chain, cashiering, reporting, and approvals. On the clinical side, the public pages
              point to HIS, CDSS, PACS, remote treatment, remote education, dog nose recognition, and digital medical
              records. The central lab adds pathology and molecular-diagnostics depth, while RVET handles pre-visit
              consultation, appointment flow, and post-visit interaction.


              Operationally, the 1+P+C model matters because it implies a referral architecture instead of flat store
              autonomy. Community hospitals handle high-frequency general-care traffic, specialty hospitals absorb more
              complex cases, and center hospitals concentrate difficult diagnosis, treatment, and rehabilitation. That
              structure can create better use of doctors and equipment if the digital stack and referral pathways work.
              It also makes software integration and standard workflows more important than they would be in a loose
              franchise or single-clinic model.
