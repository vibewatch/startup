      - number: '7.2'
        title: Operational, quality, and cybersecurity risk
        blocks:
          - type: paragraph
            body: >-
              The operational-risk stack goes well beyond licenses. The F-1/A warns that injuries to employees,
              customers, or trainees can create compensation, penalties, litigation, and reputational damage. It also
              warns that claims of improper animal care or poor communication can generate negative publicity that hurts
              revenue even when allegations are inaccurate. That is a meaningful risk for a brand positioning itself
              around health, wellness, digitization, and higher standards. In healthcare-style services, a scaled trust
              story cuts both ways: it creates differentiation when quality is consistent and magnifies damage when
              quality incidents spread across social media or local communities.


              Cyber and workflow risk are similarly material. New Ruipeng's filings and current product pages together
              show a network that depends on digital records, ERP, HIS, CDSS, PACS, remote diagnosis, online
              consultation, customer data, and partner-linked local-service flows. The filing says the company processes
              large amounts of customer and transaction data and that third-party service providers can access sensitive
              information. A breach or major outage would not merely be an IT inconvenience. It could trigger regulatory
              action, direct customer claims, insurance cost increases, and loss of trust at exactly the point where the
              company is trying to differentiate on integrated care. The public record also lacks any independent
              cybersecurity audit, penetration-test disclosure, or external reliability dashboard for these systems, so
              investors can see the digital ambition more clearly than the resilience evidence.
            claimRefs:
              - CR013
              - CR014
              - CR015
