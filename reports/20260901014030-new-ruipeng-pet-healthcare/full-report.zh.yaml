      - number: '7.3'
        title: 财务、治理与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              财务和治理仍是最难干净承保的一组风险。最后一个经审计的公开基线仍停在 2022 年：收入 RMB5.7402 billion、毛利 RMB318.8 million、净亏损 RMB1.4171
              billion，调整后 EBITDA 约为负 RMB948.2 million。2024 年 6 月撤回上市申请证明 New Ruipeng
              可以在未完成定价的情况下退出公开市场，但没有回答公司是否修复了底层盈利问题。此后，美国申报线索基本中断。CapEdge 和 BamSEC 都没有显示撤回申请后新的公开经营更新。OffshoreAlert
              的标题随后提出了一个更新、更严重的问题：2025 年 11 月，Cayman 母公司据称寻求任命重组官，同时仍控制中国境内 1,800
              多家运营子公司和分支机构。细节还太少，无法精确建模，但围绕离岸控股结构的法律和融资不确定性已经合理上升。


              合作伙伴和行业依赖又叠加一层风险。JD 可以改善获客、保险结算和到家诊断，但也让公司依赖非自有渠道的执行和数据共享安排。Boehringer
              带来培训、疾病理解和解决方案质量，但部分生态叙事仍倚重这段战略关系。更宽地看，36Kr 等批判性报道认为，中国宠物医疗市场仍然分散、价格敏感，并在结构上受利润率约束。如果这种框架大体成立，New Ruipeng
              承担的不只是公司特定风险，还有商业模式风险：网络可以在运营上很强，却仍难把规模转化为持久利润。
