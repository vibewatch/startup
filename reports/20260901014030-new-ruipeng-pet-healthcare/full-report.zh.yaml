        - 按个案定价；未披露公开标准化价格
        - 医院就诊、诊断、治疗、美容、本地优惠
        - 定价不透明仍是投诉来源
        - 规模并不自动等于价格透明
      - - Ringpai 线下医疗
        - 按个案定价；同样不透明
        - 基于医院的诊疗，加美容 / 产品
