      - number: '8.3'
        title: 情景、区间与价格支撑测试
        blocks:
          - type: paragraph
            body: >-
              情景分析让投资判断更具体。牛市情景假设 New Ruipeng 已经悄悄修复了比公开证据更多的问题：收入扩大到 RMB10-12 billion，EBITDA
              转正，网络出清改善了单店经济性而不是发出压力信号，Cayman 问题仍能限制在母公司层面。在这组假设下，约 RMB28-34 billion 的估值区间才变得合理。这是唯一一个与当前 2026 年类似 Hurun
              标记重叠的情景。


              基准情景更不宽容，也更贴近公开记录。它假设收入更接近 RMB8-9 billion，利润率比公开牛市论点暗示的更薄，市场愿意为一家战略重要但披露仍不足的运营商支付约 2.0x-2.5x 销售额。这指向约
              RMB16-22 billion。熊市情景更严厉：增长放缓、EBITDA 持续疲弱、更可见的门店收缩，或更深的法律结构压力，都可能把价值推向约 RMB8-14 billion。这个结果仍会承认 New
              Ruipeng 拥有真实规模和战略相关性，但会把这门生意更像一个复杂、服务属性重的网络，而不是溢价后期医疗平台。务实结论是，当前标记需要乐观的隐藏数据才能站住；单靠公开记录，更支持下行偏斜，而不是清晰上行。
