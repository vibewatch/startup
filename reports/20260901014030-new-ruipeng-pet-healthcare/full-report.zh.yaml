figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从创立到撤回 IPO 后独角兽估值重置的主要公司级里程碑。
    data:
      items:
        - label: 1998 — Ruipeng Pet Hospital 创立
          date: 1998-12
          detail: Peng Yonghe 创办最初的深圳兽医业务，后来成为 New Ruipeng 的运营核心。
          tone: positive
        - label: 2013 — 集团法律实体成立
          date: 2013-11
          detail: Baidu 资料记录了后来与 New Ruipeng Group 相关联的法律实体成立日期。
          tone: neutral
        - label: 2018 — Hillhouse 合作打造 New Ruipeng 平台
          date: 2018-08
          detail: 与 Hillhouse 的战略合作把 Ruipeng 变成更大的整合载体。
          tone: positive
        - label: 2020 — Tencent/Boehringer 领投巨额融资
          date: 2020-09
          detail: 申报历史披露多批次融资约 US$558m，独立报道给出约 US$4.4bn 估值。
          tone: positive
        - label: 2023-01 — Nestlé 票据 + Nasdaq 申报
          date: 2023-01
          detail: Nestlé 子公司提供 US$50m 票据，公司提交 Nasdaq 上市 F-1 文件。
          tone: positive
        - label: 2024-06 — 美国 IPO 撤回
          date: 2024-06
          detail: 公司在生效前叫停上市，未出售任何证券。
          tone: negative
        - label: 2025-02 — 标准制定与地方政府定位
          date: 2025-02
          detail: 与福田的合作以及全国宠物诊疗指南活动，进一步强化了行业领导地位。
          tone: positive
        - label: 2025-06 至 2026-06 — 独角兽估值延续
          date: 2026-06
          detail: Baidu / Hurun 信号显示，公司 2025 年估值为 RMB33bn，2026 年为 RMB30.5bn。
          tone: neutral
    approximationNotes: 时间线混合了有备案支撑的日期和二级估值榜单日期；这些估值点不是融资轮次。
    claimRefs:
      - CO001
      - CO003
      - CO016
      - CO017
      - CO018
      - CO033
      - CO034
      - CO036
      - CO038
      - CO039
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: 经营历史、资本、网络规模和数字基础设施如何拼出公司当前形态。
    data:
      nodes:
        - id: N01
          label: 经营核心
          detail: Ruipeng 医院网络由彭永鹤于 1998 年创立
        - id: N02
          label: 平台范围
          detail: 宠物护理服务 + 供应链 + 本地服务 + 诊断
        - id: N03
          label: 数字层
          detail: ERP、HIS、CDSS、PACS、Rvet 用户基础
        - id: N04
          label: 资本结构
          detail: Hillhouse、Tencent、Boehringer、Nestlé 票据，以及其他 2020 年投资方
        - id: N05
          label: 当前版图
          detail: 20+ 品牌；官网 1000+ 家医院；最近一次详细备案为 1891-1942 家
        - id: N06
          label: 治理张力
          detail: 创始人主导运营，但治理受投资人塑形，IPO 已搁置
      edges:
        - from: N01
          to: N02
          label: 扩展为
        - from: N02
          to: N03
          label: 由此支撑
        - from: N04
          to: N05
          label: 提供资金
        - from: N05
          to: N06
          label: 催生需求
        - from: N06
          to: N04
          label: 影响
        - from: N03
          to: N05
          label: 支持
    approximationNotes: null
    claimRefs:
      - CO001
      - CO006
      - CO014
      - CO016
      - CO026
      - CO029
      - CO040
      - CO043
  - id: FO003
    title: 快照 KPI
    type: kpi
    layout: standard
    summary: New Ruipeng 的核心公开规模、披露和估值锚点。
    data:
      items:
        - label: 经营起点
          value: '1998'
          unit: null
          note: Ruipeng Pet Hospital 的创立日期，不是后来集团法律实体的成立日期。
        - label: 当前官网版图
          value: 1,000+
          unit: hospitals
          note: 官网披露的四舍五入口径；当前精确审计数量不可得。
        - label: 最近一次详细备案版图
          value: 1,891
          unit: hospitals
          note: 2022 年年末备案披露；IPO 简介来源显示，截至 2022 年 9 月为 1,942 家。
        - label: 2022 年收入
          value: RMB 5.74bn
          unit: null
          note: 来自 F-1/A 的最近一项近似审计口径公开收入数据。
        - label: 2022 年净亏损
          value: RMB 1.42bn
          unit: null
          note: 显示公司已具规模但仍持续亏损。
        - label: Nestlé 票据
          value: US$50m
          unit: null
          note: 2023 年 1 月向一家 Nestlé 子公司发行。
        - label: 2025-2026 年独角兽估值区间
          value: RMB 30.5bn-33bn
          unit: null
          note: 二级估值榜单信号，不是定价股权融资。
    approximationNotes: 多项数值为便于阅读采用四舍五入口径；精确来源数字仍保留在 claims 和 KPI 表中。
    claimRefs:
      - CO001
