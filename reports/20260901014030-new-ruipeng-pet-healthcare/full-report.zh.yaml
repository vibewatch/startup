      - number: '3.3'
        title: 国际在位者和相邻平台竞争者
        blocks:
          - type: paragraph
            body: >-
              国际可比公司能说明耐久的兽医服务护城河长什么样。Banfield 强调预防护理、健康计划、远程建议和全生命周期护理，并拥有极大的全国规模；VCA
              把基础、专科、急诊、紧急护理和肿瘤服务结合起来，并用保留本地医院身份的并购打法扩张。CVS Group
              则提供一个公开市场视角，说明投资者如何给上市兽医连锁估值。这些例子重要，因为它们提示，规模化兽医护理的终局模型不是单纯“更多诊所”，而是叠加复购型项目、专科服务、标准化记录和可信转诊路径的系统。


              相邻数字平台重要的原因不同：它们会削弱医院连锁与宠物主之间的直接关系。JD 与 New Ruipeng 在 2026 年的合作延伸到互联网医院、保险、诊断和 AI 模型；Meituan
              带来本地预约和团购；Baidu 和 JD 此前也合作过宠物医生服务；RVET 自身则试图把发现、咨询、预约和复诊留在 New Ruipeng
              的软件界面内。这些平台不能完全替代医院交付，但它们调节流量、价格可见度和再次触达，因此既是高度相关的竞争者，也是合作伙伴。
