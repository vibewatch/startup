  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、结构和增长质量
        blocks:
          - type: paragraph
            body: >-
              申报文件显示的收入引擎，比“宠物医院连锁”这个标签更分散。2022 年，New Ruipeng 实现 RMB5.7402 billion 收入，较 2021 年增长
              20.0%，增长主要由供应链服务驱动。宠物护理服务仍是最大收入线，占 51.7%，但供应链升至 38.0%，本地生活服务贡献 10.3%。这种结构重要，因为它说明公司的财务模型不是把单店诊所 P&L
              按网点数倍增。它是医疗费用、美容、产品分销、本地电商和预付费相关服务流的混合体。


              这种混合结构有两面。一方面，它让 New Ruipeng
              比纯医院运营商拥有更多钱包份额触点，客户进入体系后可能产生交叉销售优势。另一方面，它也让收入质量分析更难。供应链占比提高，可能比单靠诊所吞吐更快拉升规模，但其毛利率、营运资本和现金转化特征可能不同于医院护理。因此，投资者评估公司时需要把“大收入基础”和“高质量医疗收入基础”拆开看。
