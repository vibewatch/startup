      - number: '2.4'
        title: New Ruipeng 的市场判断
        blocks:
          - type: paragraph
            body: >-
              最好的市场判断是建设性但不简单。中国宠物经济无疑很大，兽医服务需求相对成熟国家仍显渗透不足。不过，New Ruipeng 可投资的市场比最激进头部 TAM 所暗示的更窄。现实的服务 TAM
              应位于申报文件中的宠物护理市场口径与更广的服务份额估算之间，而不是完整宠物经济层面。即便如此，对规模化运营商而言机会仍很大，因为临床需求上升、数字化发现、监管规范化和本地供给分散叠加在一起，有利于能够标准化护理并吸收合规成本的连锁。


              未解决的问题不是需求是否存在，而是能抓住多少。需求是存在的。更难的问题是，持牌、质量可控、多品牌医院网络能以有利润的方式服务多少需求，而不是被独立诊所、本地平台和低成本非正规供给拿走。这也是为什么后续章节必须把有吸引力的市场背景，与产品执行、客户耐久性和资本强度连接起来，不能只靠市场本身构成投资理由。
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM034
              - CM036
              - CM037
              - CM039
