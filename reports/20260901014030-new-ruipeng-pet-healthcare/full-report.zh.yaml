  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁真正与 New Ruipeng 竞争
        blocks:
          - type: paragraph
            body: >-
              竞争地图不只是“New Ruipeng 对另一家医院连锁”。中国宠物医疗市场仍然分散，2024 年前五大玩家只占收入 15.4%，单体医院仍是主流形态。这意味着 New Ruipeng
              同时面对直接规模化连锁、数千家本地独立诊所、影响发现和预约的互联网平台，以及塑造投资者预期的国际兽医服务模式。公司自己的结构也重要：New Ruipeng
              不只是诊所整合平台，而是横跨宠物护理、供应链和本地生活服务的平台。任何现实竞争评估，都必须判断这种平台宽度，而不只是看医院数量。


              Ringpai 是最清晰的全国性直接对手，因为它披露了多城市医院网络、并购计划、外部资本，以及围绕标准化和盈利能力的 IPO
              质量叙事。但更大的战略威胁可能来自分散线下供给与平台化线上需求的组合。宠物主仍可以在本地诊所之间多栖，流量发现也越来越经过 Meituan、JD、Baidu，以及 RVET 等自有应用。换句话说，New
              Ruipeng 最大挑战不只是另一家连锁能否匹配它的版图，而是竞争者或平台能否在连锁规模优势转化为复购支出前，先拦截客户关系。
