  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 2024-2025 年审计财务
        - 收入、毛利率、EBITDA、资本开支和医院层面贡献利润率桥
        - 需要判断公开估值标记是偏贵，还是只是过时
        - 财务数据室、审计师材料和城市层级利润率桥。
      - - 股权结构和优先权栈
        - 清算优先权、可转债、债务，以及任何高于普通股的结构性优先级
        - 没有完整瀑布，回报数学不可靠
        - 董事会或法律数据室，以及当前融资文件。
      - - Cayman 重组细节
        - 申请书、债权人矩阵、官员任命、环围隔离和运营影响
        - 母公司层面压力可能改变下行和时间表
        - 律师备忘录、法院文件和管理层问答。
      - - 门店数量与同店桥
        - 开店、关店、收购、成熟门店队列和利用率
        - 需要区分高质量理性化和困境收缩
        - 运营尽调、城市级 KPI 包和区域管理层访谈。
      - - 客户经济性
        - 复诊、留存、客单价、保险附加率和按服务类型拆分的队列贡献
        - 检验生态宽度能否转化为持久经济性
        - 增长与医院运营工作流，配合队列数据导出。
      - - 风险控制证据
        - 网络安全、牌照、临床质量和合规审计输出
        - 要压低折现率，必须证明规模可治理
        - 内审、外部评估和监管往来函件。
    notes: 这些是在价格驱动的投资决策前，最低限度、足以影响决策的尽调问题。
