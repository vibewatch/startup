        - 执行和成本控制比挂牌价更重要
      - - 独立诊所
        - 本地定价通常更灵活
        - 基础诊疗和便利性
        - 质量和价格标准化差异很大
        - 让切换成本保持在低位
      - - Banfield 健康计划
        - 会员 / 计划模式
        - 预防护理、生命周期健康管理、虚拟支持
