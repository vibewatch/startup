      - number: '3.2'
        title: 国内直接对手和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Ringpai 已经大到不可忽视，但仍小到让 New Ruipeng 在已披露规模上明显领先。Pet Fair Asia 和 NewTimeSpace 都称，截至 2025 年中，Ringpai 在约 70
              个城市运营 548 家医院；New Ruipeng 则在 2022 年底披露 1,891 家医院。New Ruipeng 的挑战在于，Ringpai 的经营故事可能更干净。独立报道认为，Ringpai 的 VDP
              模式更有利于留住医疗团队，并采用更可控的并购方式；同时批评 New Ruipeng 早期全资收购方法导致整合成本重、内部竞争强。这并不意味着 Ringpai 占主导，但确实让它成为最可信的“执行更好的第二名”。


              更顽固的对手仍是现状：本地诊所。连锁渗透率约 22%，意味着许多宠物主仍通过附近独立诊所解决护理需求，这些诊所可能更便宜、更有人情味，或只是更方便。这会压低切换成本，也让品牌护城河难以在每个城市落地。New
              Ruipeng 的回答是借助多品牌网络和 1+P+C 结构做标准化和转诊深度，但只有客户感知到质量差距、医生也留在体系内，这些优势才有意义。
