      - number: '4.4'
        title: 财务判断和尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务判断是混合的。New Ruipeng 证明了收入规模、客户触达、多元变现和持续融资能力。但同一公开记录也显示，公司进入 2023 年时调整后 EBITDA 为负、经营现金流为负、存货沉重，并依赖融资。2024
              年 6 月撤回 IPO 后，透明度急剧下降。虽然公司 2024 年年末信息称医疗模块在 2025 年 3 月转亏为盈，但没有找到经审计的 2024 或 2025 年报表来检验该说法。


              因此，核心尽调阻断点是当前状态，而不是历史状态。历史数据足以说明业务真实且规模很大，但不足以说明 2024 年之后的组织是否改善了现金转化、收窄了诊所层面亏损，或实现了可持续盈利。Chewy 到 Zoetis
              的公开可比公司对比凸显了问题：相似的宠物邻近收入规模，会因利润率结构和财务质量不同，对应极其不同的市值和倍数。没有当前分部利润率、同院趋势和现金消耗披露，承销仍被锚定在过期数字上。
