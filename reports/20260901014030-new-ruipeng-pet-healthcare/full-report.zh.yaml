      - number: '6.4'
        title: 留存质量和集中度判断
        blocks:
          - type: paragraph
            body: >-
              客户故事可信，但尚未被完整承销。New Ruipeng
              在公开层面对广度的证明，强于对质量调整后耐久性的证明。历史文件显示数百万用户、有意义复购和跨渠道行为。当前官方页面仍显示大型城市品牌网络和活跃平台合作。但公司不再发布当前活跃客户数、病例量、留存队列、城市层面转化，或按渠道拆分的收入集中度。也没有独立公开汇总的门店层面评分，因为
              Dianping 等主要中国点评界面难以用程序稳定访问，本次研究中未能以稳定抓取形式审阅。


              主要下行信号是可负担性压力。36Kr 认为，许多中国年轻宠物主在面对较高价格医疗费用时较为价格敏感，小诊所仍用价格战吸引客户。这一点重要，因为 New Ruipeng
              试图通过规模化网络销售标准化、更高信任度的护理，而该网络的间接成本很可能高于单个独立诊所。因此，公司真正的集中度风险，不像是一个大型企业客户，而更像城市集中、本地平台和 Rvet
              渠道依赖，以及复购是否转化为有吸引力城市层面经济性的可见度不足。净判断是：客户广度和生态参与具建设性，但对当前留存透明度和变现质量保持谨慎。
