      - number: '8.4'
        title: 退出准备度、打破投资假设的触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持公司已具备 IPO 条件。一个干净的 IPO 故事需要当前经审计的收入质量、毛利率和 EBITDA
              进展、股权结构和优先权透明度、法律结构清晰度，以及更有力地回答中国规模化宠物医院运营能否让利润率复利，而不只是让网点复利。相反，公开记录给出的是一次撤回的 IPO、撤回后稀疏的披露轨迹，以及后来
              OffshoreAlert 关于 Cayman 重组官的标题。这足以让 New Ruipeng 作为跟踪资产保留可投性，但不足以按接近公开上市状态的后期复利公司来承保。


              因此，最终尽调清单异常明确。投资者需要 2024-2025
              年经审计财务和医院层面利润率桥；当前股权结构、清算优先权和任何债权人包袱；经核验的门店数量桥和同店经营趋势；客户留存和复诊证据；以及合规、网络安全和临床质量审计结果。打破投资假设的触发器也应同样明确：任何更深
              Cayman
              压力证据、明显低于当前隐含区间的新融资、没有可见利润率修复的进一步网络收缩，或核心网络内经确认的监管或质量事件。如果这些风险受控，且新数据证明收入和利润率已经拐头，建议可以上调。在此之前，正确姿态是尊重资产，但谨慎定价。
