      - number: '6.2'
        title: 历史采用和使用证明
        blocks:
          - type: paragraph
            body: >-
              最强的定量客户证据仍来自 2023 年 SEC 文件。这些文件披露，活跃宠物护理客户从 2021 年约 2.5 million 增至 2022 年约 2.6 million，而每名活跃客户年净收入从
              RMB1,203 小幅降至 RMB1,129。对耐久性更重要的是，公司称 2022 年宠物护理客户复购率约 56%，而行业平均为
              30%-40%。对兽医连锁而言，这是一项有意义信号，说明网络并非按纯急诊服务运转。它意味着宠物主会回来复购临床及相关服务。


              Rvet 平台增加了第二层采用。文件称，2022 年 Rvet 拥有约 5.2 million 注册用户和约 1.347 million 活跃客户，并明确把活跃客户定义为期内至少购买一次的用户。同一文件把
              Rvet 描述为闭环线上项目，也是公司本地生活服务的核心线上平台。它支持预约、病历查看、专家咨询、月度护理包和产品购买。文件还称，2022
              年约三分之一活跃医院客户在公司其他渠道消费，说明诊所与数字或零售界面之间的交叉销售已经具有实质规模。虽然这些数字已经过期，但它们仍是最佳公开证据，说明 New Ruipeng
              在重新回到私募市场不透明状态前，已经取得真实客户规模。
