            title: 决定性缺失变量不是 New Ruipeng 是否真实，而是 2025-2026 年收入和利润率是否改善到足以支撑溢价
            body: 如果收入相对 2022 年基线大致翻倍，EBITDA 转正，当前标记可以变得可辩护。否则，它仍然跑在基本面前面。这就是为什么 2022 年后的经审计财务是单一最高优先级的尽调问题。
