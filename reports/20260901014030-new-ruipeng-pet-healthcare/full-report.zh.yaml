      - 机制
      - 单位
      - 2022 数值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 宠物护理服务
        - 医院医疗服务、美容、诊断、教育
        - 收入占比
        - 51.7% 合计；46.7% 医疗；5.0% 美容
        - 核心战略收入流，但披露的利润率细节少
        - 需要诊所级毛利率和同院趋势
      - - 供应链服务
        - 向第三方医院 / 门店销售食品、药品、设备、耗材
        - 收入占比
        - 2022 年收入占比 38.0%
        - 快速增长的规模驱动项；利润率可能较低，且占用营运资本
        - 需要按分部披露毛利率和库存周转
      - - 本地服务
        - 通过自有及第三方线上 / 线下渠道销售产品
        - 收入占比
        - 2022 年收入占比 10.3%
        - 有用的数字化变现入口
        - 需要贡献利润率和 CAC 数据
