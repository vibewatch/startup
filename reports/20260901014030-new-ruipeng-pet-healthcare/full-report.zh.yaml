        - 数字优先的宠物主人
        - 发现、预约、保险、团购、数据入口
        - 单靠平台本身无法替代线下医院产能
      - - Banfield / VCA / CVS Group
        - 国际在位者 / 可比对象
        - 1,000+ 家 Banfield 医院；VCA 全国网络；CVS 上市连锁
        - 成熟市场兽医客户
        - 健康计划、专科深度、公开市场纪律
        - 模型反映的是不同支付和所有权环境
    notes: 表中混合了直接连锁、相邻平台、国际在位者和分散的存量供给，因为它们都在不同层级争夺同一客户关系。
