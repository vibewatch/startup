      - CO008
      - CO018
      - CO020
      - CO022
      - CO039
      - CO040
  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: wide
    summary: 从广义宠物经济到更相关的兽医服务机会集，分层观察市场。
    data:
      items:
        - label: 中国宠物总市场（2027F）
          value: RMB 570.1bn
          detail: 广义宠物经济，涵盖食品、用品、服务和医疗
        - label: 城镇犬猫消费（2025）
          value: RMB 312.6bn
          detail: 规模大，但混合了医疗与非医疗家庭支出
        - label: 宠物护理市场（2022 / 2027F）
          value: RMB 56.3bn -> RMB 140.5bn
          detail: 最接近备案支撑的护理支出口径
        - label: 连锁可捕获医疗 SOM 代理
          value: RMB 50bn-90bn
          detail: 当前服务与医疗占比口径提示的示例性子集
    approximationNotes: 底层是分析性的 SOM 代理，并非已披露市场估计；它用于说明可投资服务支出比完整宠物经济更窄。
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM018
      - CM019
      - CM040
      - CM041
