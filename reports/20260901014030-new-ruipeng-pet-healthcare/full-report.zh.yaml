      - number: '1.2'
        title: 领导层、治理和控制权
        blocks:
          - type: paragraph
            body: >-
              Peng Yonghe 仍是公司的核心人物锚点。F-1/A 将他列为创始人、联席董事长和总裁，他的履历也从兽医到创业者，贯穿 Ruipeng 的经营历史。不过，IPO 披露的治理设计显示，New Ruipeng
              并不是私募整合型公司里常见的简单创始人控制。根据 2020 年 9 月股东协议，管理层委派人拥有四个董事席位，Hillhouse 相关实体另有四席，Dachen 和 Riverhead
              各一席。这样的结构说明，即使在上市前，投资方已经对资本配置和治理有很强监督。


              已披露的其他高管团队有分量，但仍相对集中。Liang Li 以联席董事长和合伙人身份，把 Hillhouse 直接带入董事会主席层面。Yanzhong Zhang 代表老 Ruipeng
              体系中的长期经营连续性，并在 2025 年官方沟通中以医院集团总经理身份出现。Chenguang Zhou 带来来自 China Foods 和 COFCO
              相关岗位的上市公司财务经验。即便如此，已审阅公开材料仍把战略合法性集中在 Peng 身上。撤回上市后，公司没有公开披露更新后的董事会章程、新的独立治理框架，或 IPO
              失败后的接班计划。对这样规模的公司而言，治理图谱足以理解所有权影响，但用于判断长期执行深度仍不完整。
