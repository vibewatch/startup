chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图和经营范围
        blocks:
          - type: paragraph
            body: >-
              理解 New Ruipeng，最好把它拆成三层公司事实，而不是只看一个成立日期。经营起点可追溯至 1998 年 12 月，Peng Yonghe 在深圳创办 Ruipeng Pet Hospital。Baidu
              公司档案把 2013 年 11 月 26 日列为集团法律实体成立日，该实体现在被描述为 New Ruipeng Pet Healthcare Group。2018 年，Ruipeng 与 Hillhouse
              完成战略合作，并开始在更大的 New Ruipeng 平台下运营，当前结构由此重塑。最后，用于赴美上市尝试的 开曼控股公司成立于 2019 年 6 月。把三个日期都放进来，才能避免常见误读：既不能简单说这是一家
              1998 年创业公司，也不能说它只是 2019 年开曼 壳公司；两种说法指向的是同一平台的不同层级。


              经营范围也不只是普通兽医连锁。公司和申报文件都把业务概括为三大支柱——宠物护理服务、供应链服务和本地生活服务；官网还加入诊断、互联网工具、公益项目、人才培养和其他邻近功能。当前英文官网强调超过 20 个品牌、超过
              1,000 家医院、覆盖超过 90 个城市。SEC 时期的最后披露规模更大：截至 2022 年底有 23 个品牌、1,891 家医院、113 个城市，并在 31 个省份经营；IPO 营销材料中，到 2022 年
              9 月又增至 1,942 家医院和 114 个城市。因此，当前经审计的精确医院数量并不清楚，但多方来源合在一起，足以确认 New Ruipeng 仍是中国公开记录中规模最大的宠物医院网络。
