      - number: '3.4'
        title: 护城河耐久性和竞争判断
        blocks:
          - type: paragraph
            body: >-
              净竞争判断是正面的，但不能自满。New Ruipeng
              仍受益于无可匹配的已披露版图、组合宽度、合作伙伴关系，以及一套从诊所收入延伸到供应链和本地生活服务的平台架构。但护城河是运营型的，不是不可攻破的。Boehringer 关系有帮助，但不是独家。JD 和
              Meituan 改善分销，也制造渠道依赖。Ringpai 的 VDP 叙事显示，对手可以合理主张自己执行更好。连锁渗透率低，也意味着独立诊所仍在许多城市设定默认替代方案。


              这个组合意味着，New Ruipeng
              的竞争耐久性更多取决于标准化、医生留存、转诊转化和客户信任，而不是品类所有权。公司可以赢，但必须证明更大的生态能带来比碎片化市场或更轻对手更好的经济性和护理结果。公开市场可比公司也强化了同一课：规模本身不是投资者奖励的护城河，纪律化、可复制的经济模型才是。
