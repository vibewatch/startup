  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 TAM 应该计入什么
        blocks:
          - type: paragraph
            body: >-
              第一个分析难点是定义。有些来源把“宠物市场”用于涵盖食品、用品、服务和医疗健康的全支出宇宙。有些来源把“宠物护理市场”用于更窄、更偏服务的类别，核心是兽医治疗及相关护理。还有一些来源——尤其是医疗健康研究机构——把宠物医疗健康产品和临床邻近类别单独拆出，形成一个小得多的可触达市场。对
              New Ruipeng 来说，正确市场边界不是完整宠物经济。公司的变现组合以服务为主，围绕医院、诊断、美容、本地生活服务和供应链搭建。因此，宠物经济总量有助于判断方向性增长，但不能直接当作估值分母。


              这个区分重要，因为不同口径的数字差异很大。F-1/A 引用的 Frost & Sullivan 数据显示，2022 年中国宠物市场总规模为 RMB285.9 billion，较窄的宠物护理市场为 RMB56.3
              billion。相比之下，2026 年白皮书称，2025 年城镇犬猫消费达到 RMB312.6 billion。StrategyHelix 给出的 2031 年“宠物医疗健康”未来市场更小，只有 USD942.8
              million，几乎肯定是一个更窄的产品或医疗健康类别，而不是完整兽医服务机会。正确结论不是某个来源错了，而是它们回答的是不同问题。后续估值应采用分层 TAM 逻辑，而不是单一头部市场数字。
