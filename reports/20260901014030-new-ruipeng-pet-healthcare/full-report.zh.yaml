  - id: TV002
    title: 投资逻辑 / 反逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：New Ruipeng 是中国少见的规模化宠物医疗资产
        - 1,000+ 家对外宣传医院、上市申报期收入规模和主要生态合作都是真实存在的
        - 新数据表明网络收缩快于利润率改善，或合作方收益无法变现。
      - - 投资逻辑：生态深度可能支撑一定溢价
        - JD 集成、Boehringer 支持和标准化投入带来的可选项，多于单纯的诊所整合平台
        - 单店经济性显示，这些生态触点增加了复杂度，却没有带来有意义的收入或利润率收益。
      - - 反逻辑：公开估值标记缺少当前公开基本面支撑
        - Hurun 式标记只是二级信号，不是新一轮融资；最后披露的收入基数也意味着其估值高于公开可比公司
        - 2024-2026 年审计数据证明收入翻倍，EBITDA 转正。
      - - 反逻辑：规模可能偏服务密集，而非软件化
        - 2022 年亏损、调整后 EBITDA 偏弱和行业逆向证据，都指向难以规模化的经济性
        - 医院层面队列显示同店产能强劲、贡献利润率改善。
      - - 反逻辑：法律和结构不透明应当折价
        - 撤回 IPO、公开披露稀疏、Cayman 重组报道都会推高折现率
        - 管理层披露完整股权结构、债权人和重组细节，证明问题已被隔离。
      - - 反逻辑：公开可比公司限制乐观空间
        - 选取的公开宠物和诊所类比公司，多数交易倍数低于 New Ruipeng 隐含的 2025-2026 年倍数
        - 新可比公司组或新数据证明，New Ruipeng 应更接近高溢价动物健康倍数，而不是服务连锁倍数。
    notes: 各行写成可证伪的投资论点，而不是泛泛列优劣势。
