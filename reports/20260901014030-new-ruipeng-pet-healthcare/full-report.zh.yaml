      - number: '1.3'
        title: 资本历史和披露质量
        blocks:
          - type: paragraph
            body: >-
              记录最充分的外部资本事件，仍是 F-1/A 披露的 2020 年 9-10 月融资。文件列出 Tencent、Boehringer Ingelheim、Snow Lake、Gracious
              Rhythm、Worldwide Healthcare Trust、OrbiMed funds、Aspex、LBC、AIG 和 ABCI，合计约 US$558 million 的 Class B
              资本，分多批进入。Global Venturing 和 KrASIA 的独立报道把更大一轮融资描述为 Tencent 领投、规模达数亿美元，并附带约 US$4.4 billion 估值。2023 年 1
              月、IPO 推进前夕，New Ruipeng 还向 Nestlé 子公司发行了 US$50 million 可转债。重要的是，Petfoodie 当时报道说新闻材料并未公开金额和估值，因此投资者仍需依赖 SEC
              文件确认票据的精确规模。


              披露质量是公司概况中的核心限制。IPO 文件给出了意外丰富的 2022 年画像——RMB5.74 billion 收入、RMB318.8 million 毛利、RMB1.42 billion 净亏损、负
              RMB948.2 million 调整后 EBITDA、RMB566.8 million 现金、2.6 million 活跃宠物护理客户，以及 5.2 million Rvet 注册用户。2024 年 6
              月撤回上市后，公司又回到更选择性的披露状态。2025 年官方新闻给出经营信号，例如声称医疗模块在 2025 年 3 月迎来盈利拐点，但已审阅公开材料中没有找到经审计的 2024 或 2025
              年财务报表。也就是说，按历史标准看公司仍有规模、资本也较充足，但投资者已经没有当前公开财务基线。
