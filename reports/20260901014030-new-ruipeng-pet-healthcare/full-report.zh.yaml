    rows:
      - - Cayman 流程恶化
        - 重组变得更细、更偏债权人主导，或在运营上连到中国子公司
        - 折现率上升，控股公司确定性下降
        - 暂停正面承销，并立即要求法律尽调。
      - - 新一轮融资低于参考区间
        - 新融资定价明显低于 2020 年或类似 Hurun 的区间
        - 形成直接负面价格发现，重置回报数学
        - 追加资本前，先按熊市 / 基准情形重新承销。
      - - 网络继续收缩但利润率不修复
        - 持续关店，但贡献利润率没有明显改善
        - 支持“规模质量偏低”的反逻辑
        - 降低战略稀缺溢价，转向下行保护。
      - - 核心监管或质量事件
        - 关键医院确认出现牌照、诊疗质量或合规问题
        - 损害信任并抬高法律风险
        - 上调风险评级，下修场景概率。
      - - 审计数据未能拐点
        - 2024-2025 年或 2026 年数据仍显示 EBITDA 偏弱、现金需求沉重
        - 当前估值标记失去剩余疑点利益
        - 除非估值大幅重置，否则转向回避。
