      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 这不只是一家合规负担重的公司；它还是一家承认过既往合规缺口的公司
            body: 最重要的风险信号是，New Ruipeng 自己的申报文件没有把监管写成假设性的背景。它披露了部分医院在用药、记录和麻醉药品流程上的问题，意味着未来尽调必须聚焦整改质量，而不是抽象的行业规则。
            calloutType: risk
            claimRefs:
