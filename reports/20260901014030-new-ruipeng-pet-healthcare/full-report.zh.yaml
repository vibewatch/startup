      - number: '5.2'
        title: 运营架构和客户流程
        blocks:
          - type: paragraph
            body: >-
              即使没有源代码，官网产品页和申报文件也能让运营架构变得清楚。基础层面，New Ruipeng 称其搭建了以 ERP 为中心的业务流程系统，覆盖 CRM、促销管理、供应链、收银、报表和审批。临床侧，公开页面指向
              HIS、CDSS、PACS、远程治疗、远程教育、犬鼻纹识别和数字病历。中心实验室增加病理和分子诊断深度，RVET 负责到店前咨询、预约流程和到店后互动。


              从运营看，1+P+C
              模式重要，因为它意味着转诊架构，而不是门店扁平自治。社区医院承接高频普通护理流量，专科医院吸收更复杂病例，中心医院集中疑难诊断、治疗和康复。如果数字化栈和转诊路径能跑通，这个结构可以更好使用医生和设备。相比松散加盟或单诊所模型，它也让软件集成和标准流程更重要。
