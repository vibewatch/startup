      - number: '2.2'
        title: 购买者、用户、付款方和需求形成
        blocks:
          - type: paragraph
            body: >-
              宠物医疗健康中的经济购买者通常是宠物主，终端用户是宠物，真正的把关人则是在护理时刻建立信任的兽医或诊所品牌。中国需求基础正在变大，也在变年轻。2026 年白皮书称，2025 年城镇犬猫数量达到 126
              million，90 后和 00 后宠物主合计约占市场 69%。这些人群是数字原住民，重度做功课，也越来越愿意把宠物视为长期家庭成员，而不是低成本陪伴。


              即使原始宠物数量增长放缓，需求质量仍在上升。2025 年单犬和单猫年消费分别达到 RMB3,006 和
              RMB2,085，两类宠物的就诊率都提高。遇到疾病问题时，宠物主最常咨询兽医或直接去医院，这意味着即便在数字化市场里，临床信任仍是主要转化机制。相邻服务偏好也强化了标准化的重要性：美容和寄养决策中，专业质量、离家近和环境干净都排名靠前。连锁与独立诊所竞争时，这套逻辑很可能转移到诊所选择上。对
              New Ruipeng 而言，这更利好品牌加网络模式，而不是纯线上市场模式。
