            body: >-
              资产负债表并不是简单意义上的困境状态，但也不能自我供血。截至 2022 年底，公司拥有 RMB566.8 million 现金及现金等价物、RMB1.165 billion 受限现金，并披露未使用授信额度
              RMB2.8564 billion，其中约 RMB1.3952 billion 预计可供使用。短期银行借款为 RMB1.3838
              billion。合在一起看，这些数字说明公司仍有融资能力，但尚未摆脱对外部资本或短期借款的依赖。


              融资时间线也强化了这一点。2020 年 Tencent 领投轮和 2023 年 1 月 Nestlé
              可转债都很关键，因为经营模型似乎需要新资本支撑网络规模、营运资本和投资。申报文件直接称，股权融资和短期银行借款一直是主要流动性来源。对大型私有平台而言，这种配置可以运转，但也意味着不能仅凭账面现金判断资本充足性。投资者需要追问：报告流动性中有多少真正可自由支配，多少被锁定；业务需要改善多少利润率，才能内部融资增长。
