      - number: '4.2'
        title: 单位经济代理指标和成本结构
        blocks:
          - type: paragraph
            body: >-
              公开披露足以证明牵引力，但不足以证明诊所层面经济性。New Ruipeng 披露，2022 年约有 2.6 million 活跃宠物护理客户，复购率约 56%，每名活跃客户年均宠物护理收入
              RMB1,129，Rvet 注册用户 5.2
              million。这些都是有用信号，说明客户基础真实，数字界面也有意义。但申报文件没有公布同院销售、诊所贡献利润率、回本周期或城市层面盈利能力。因此，最佳可得的单位经济视角仍是一组代理指标，而不是完整承销模型。


              成本结构更容易诊断。公司 2022 年收入 RMB5.7402 billion、毛利 RMB318.8 million，意味着毛利率只有约 5.6%。净亏损 RMB1.4171 billion，调整后
              EBITDA 为负 RMB948.2 million。RMB680.3 million 存货、RMB240.8 million 物业和设备支出，以及持续为负的经营现金流，都指向同一结论：截至 2022
              年，规模尚未创造明显经营杠杆。业务未来可能仍受益于交叉销售和采购，但在最后一个经审计检查点，公开披露证据显示的是低利润率、资产和营运资本都偏重的经营模型。
