  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层和服务界面
        blocks:
          - type: paragraph
            body: >-
              New Ruipeng
              本质上是一家消费者医疗健康公司。它的购买者和付款方，是为伴侣动物购买兽医护理、诊断、美容、疫苗、寄养邻近服务和宠物产品的宠物主。当前官方界面说得很清楚：公司对外展示的服务菜单包括疫苗接种、健康体检、驱虫、洗牙、绝育手术、远程诊疗、在线咨询、美容、洗澡和
              SPA。Ruipeng Pet Hospital
              的消费者网站也强化了同一点：它把医疗诊疗与美容、寄养护理、洗澡、SPA、食品和用品销售一起宣传。这不是狭窄的一次性手术业务，而是围绕宠物家长持续需求组织起来的复购关系业务。


              当前客户版图也是多品牌、多城市的。官方介绍页称，New Ruipeng 运营超过 20 个品牌、超过 1,000 家医院，服务超过 90
              个城市，并明确列出北京、上海、广州、深圳、香港、成都、杭州、重庆、武汉、西安、苏州、天津、南京、长沙、郑州、沈阳和兰州。这个版图说明客户基础以中国城市为中心，尤其是较高收入宠物拥有和专科护理更成熟的地区。首页还称，公司在超过
              1,600 个社区服务数百万只宠物和流浪动物。合在一起，证据支持一个广泛消费者漏斗：从本地发现开始，延伸到中心、专科、国际和社区医院组成的分层网络。
