  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是一家真实公司，而不是一个干净的价格支撑故事。New Ruipeng 不是投机壳：它有真实规模、仍在宣传的 1,000
              多家医院网络、有意义的历史收入、真实客户，以及中国宠物医疗里并不常见的战略关系。这是核心正面案例。但公开估值承保要严苛得多。比 2020 年融资更新的、当前唯一公司特定价格信号，是来自 Hurun
              的二级市场式标记：2025 年 RMB33 billion，2026 年 RMB30.5 billion。Hurun
              自己的方法说明，这些榜单估值可作为有用参考，但并不等同于一轮新定价融资或一笔已清算的公开市场交易。


              最后一个硬运营分母仍是 F-1/A 中 2022 年收入 RMB5.7402 billion。以该分母计算，当前类似 Hurun 的标记意味着约 5.3x-5.7x 销售额，而本章选取的上市可比公司大多交易在约
              0.7x 到 4.0x 之间。例外是质量更高、利润率更干净、披露更充分的动物健康公司。New Ruipeng 还背着多数上市可比公司没有的法律和结构性包袱，包括母公司层面的 Cayman 重组标题，以及 2024
              年 6 月撤回 IPO
              后稀薄得多的公开披露轨迹。建议：在当前参考标记下继续研究，而不是买入。信心为中等，因为公司质量案例真实存在，但价格支撑案例仍依赖非公开数据。风险评级为高，因为盈利能力、监管、披露和控股公司问题会同时影响倍数。入场纪律需要明确：新资金要么需要明显更低的入场点——大致在
              RMB 十几 billion 中高段或 RMB 低 20 billion 区间——要么需要新的经审计数据，证明 2025-2026 年财务画像远强于当前公开证据。
