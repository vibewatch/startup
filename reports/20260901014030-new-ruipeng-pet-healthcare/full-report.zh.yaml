              - CR017
              - CR018
          - type: callout
            title: 撤回 IPO 之后发生了什么，如今很大程度决定剩余风险
            body: >-
              如果经审计利润率已经改善、门店已干净出清，且 Cayman 重组保持在可控范围内，公开资料就显著低估了公司质量。反之，当前不透明本身就是风险的一部分。因此，缺少更新后的经审计数据，几乎和 2022
              年亏损状况本身一样重要。
