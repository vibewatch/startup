        title: 图表
        blocks:
          - type: callout
            title: 市场很大，但正确 TAM 小于头部宠物经济数字
            body: 置信度最高的需求结论是方向性的：中国宠物医疗健康确有长期增长。置信度最低的结论，是拿一个 RMB300bn+ 头部数字就把它全部视为医院收入机会。
