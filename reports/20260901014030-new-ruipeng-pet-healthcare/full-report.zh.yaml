      - number: '2.3'
        title: 增长驱动与结构性约束
        blocks:
          - type: paragraph
            body: >-
              市场的头部增长驱动很清楚：家庭宠物拥有率低于美国、单宠支出低于成熟市场、城市宠物主更年轻、预防护理兴趣上升，以及宠物主一旦进入可信网络后，产品和服务可以交叉销售。公司自己的申报文件称，到 2022 年已有 38%
              医院客户通过其他渠道消费，说明连锁抓住首次医疗互动后，钱包份额还有上行空间。在成熟市场，Banfield 和 VCA 证明，大型兽医平台可以在广泛社区医院基础上叠加诊断、健康计划、急诊护理和并购驱动扩张。


              约束同样重要。中国行业仍分散，竞争也越来越激烈。牌照规则同时约束机构和执业人员；围绕检疫、废弃物处置、疾病报告、兽药和规定执业范围的监管，使优质连锁比低监管零售概念更难扩张。人才是另一处瓶颈：医院增长需要受训临床医生和专科能力，不只是租约和营销。因此，New
              Ruipeng 强调人才培养和国家标准制定，在战略上很重要。规范化会抬高所有人的门槛，但拥有培训体系、资本和合规基础设施的运营方，应相对小诊所获得优势。
