  - id: FM004
    title: 采纳漏斗或价值链地图
    type: flow
    layout: standard
    summary: 主人旅程越来越多从线上开始，但可信转化仍发生在诊所里。
    data:
      nodes:
        - id: A1
          label: 认知 / 症状
          detail: 主人注意到健康问题或预防需求
        - id: A2
          label: 数字发现
          detail: 搜索引擎、平台、小程序、社区推荐
        - id: A3
          label: 选择诊所
          detail: 信任、距离、清洁度、专业质量
        - id: A4
          label: 诊断和治疗
          detail: 兽医问诊、诊断、用药，必要时手术
        - id: A5
          label: 复诊护理和交叉销售
          detail: 随访、产品、健康管理、本地服务、持续互动
      edges:
        - from: A1
          to: A2
          label: 调研
        - from: A2
          to: A3
          label: 预约 / 选择
        - from: A3
          to: A4
          label: 转化
        - from: A4
          to: A5
          label: 留存
        - from: A5
          to: A3
          label: 复购循环
    approximationNotes: 流程由调研行为、平台评论和公司的线上线下策略综合得出，而不是来自某一个已披露漏斗数据集。
