      - number: '8.2'
        title: 当前估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              核心估值张力很直接。2020 年那轮融资把 New Ruipeng 估到接近 RMB30 billion。一个汇总 Hurun 上榜信息的百度百科页面称，公司随后在 2025 年全球独角兽榜以 RMB33
              billion 出现，在 2026 年榜单为 RMB30.5 billion。换言之，公开信号显示，六年的规模建设、一次美国上市尝试以及后续可转债，几乎没有在 2020
              年那轮基础上带来可见估值上调。这本身不一定偏空——2021 年后后期风险投资市场急剧压缩——但它确实意味着投资者不能假设隐藏复利。2024 年 6 月 RW
              撤回在市场出清价格出现前终止了公开上市路径，CapEdge/BamSEC 也显示公开申报线索基本止步于此。


              可比公司组也无法拯救当前标记。Yahoo Finance 显示 CVS Group 约为 1.34x 往绩销售额，Pets at Home 约为 0.67x。按市值对收入口径，Chewy 约在
              0.7x-0.8x，具体取决于来源和时点。Zoetis 是溢价离群值，约为 3.35x-4.05x，因为它是动物健康制药龙头，利润率、披露和公开市场深度都远强于诊所连锁。相对于这个区间，New Ruipeng
              基于过时 2022 年收入隐含的 5.3x-5.7x 看起来昂贵。也存在一条让这个标记更合理的路径：如果 2025-2026 年收入已增长至大约 RMB10-11
              billion，且利润率大幅改善，同一估值信号会压缩到约 3x 销售额。但公开证据目前不能证明这一点。因此，现有证据的权重指向：当前参考标记是战略资产价格，而不是由公开证据支撑的基本面价格。
