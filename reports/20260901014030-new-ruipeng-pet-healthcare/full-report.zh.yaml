      - number: '1.4'
        title: 里程碑、战略信号和负面进展
        blocks:
          - type: paragraph
            body: >-
              近期公开信号显示，公司虽保持私有状态，仍在扩大其在中国宠物健康生态中的机构角色。2025 年官方报道强调与 Meituan
              深化合作、与福田区政府推动标准制定，并牵头首个专门面向宠物诊疗服务机构的全国性指引。诊断和技术页面进一步印证了一个策略：把医院规模与中心实验室、数字化流程和专科护理标准化配对。Business Wire
              China 的 Boehringer 新闻稿又加上一层战略含义：New Ruipeng 不只被定位为兽医服务连锁，也被定位为疾病认知、专业培训和更广泛动物健康分销的合作伙伴。


              主要负面公司里程碑，是 2024 年 6 月撤回 Nasdaq 上市。SEC 信函明确写明，公司选择不继续推进，文件从未生效，也没有出售任何证券。Renaissance Capital 和 IPOScoop
              都把该交易视为搁置的 US$100 million IPO。此后，本报告审阅的公开证据没有显示替代申报或明确重新上市时间表。同时，Baidu 公司档案称，公司仍以 RMB33 billion 和 RMB30.5
              billion 估值分别入选 2025 和 2026 年 Hurun 全球独角兽榜，说明私有市场身份没有抹去其独角兽地位。这个组合很关键：New Ruipeng
              仍显得具有战略重要性且运营规模庞大，但其可投资叙事如今更多靠历史规模和生态位置驱动，而不是靠新的公开披露。
