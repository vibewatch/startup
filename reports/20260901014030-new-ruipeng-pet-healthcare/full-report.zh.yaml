      - number: '5.1'
        title: 产品到底是什么
        blocks:
          - type: paragraph
            body: >-
              New Ruipeng 不是按软件公司意义销售单一产品。公开材料描述的是一个护理平台，由超过 20 个品牌、1,000 多家动物医院、14
              个兽医专科、中心和国际医院、互联网医院服务、诊断、供应链赋能和培训系统组成。申报文件也用更宽框架描述它，把第三方诊断、继续兽医教育和营销即服务，与核心宠物护理并列。这种宽度具有战略意义，因为产品质量取决于公司协调临床、物流和数字资产的能力，而不是某个英雄功能。


              最有形的资产是医院网络、中心诊断基础设施，以及支撑护理交付的软件系统。RVET
              和本地生活服务界面把产品延伸到咨询、预约和后续护理。国际业务部门把公司带入高端和专科护理形态，教育层则支撑临床医生供给和标准化。它更接近医疗运营平台，而不是狭窄的连锁门店零售概念。
