      - number: '7.2'
        title: 运营、质量与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              运营风险不止牌照一项。F-1/A
              警示，员工、客户或学员受伤可能带来赔偿、处罚、诉讼和声誉损害。文件也提示，不当动物护理或沟通不佳的指控，即便并不准确，也可能引发负面舆论并伤害收入。这个品牌围绕健康、康养、数字化和更高标准定位，这类指控就是实质风险。在类医疗服务里，规模化信任叙事是一把双刃剑：质量稳定时形成差异化，质量事件一旦在社交媒体或本地社区扩散，损害也会被放大。


              网络安全和流程风险同样重要。New Ruipeng
              的申报文件和当前产品页面放在一起看，这个网络依赖数字病历、ERP、HIS、CDSS、PACS、远程诊断、线上咨询、客户数据，以及与合作伙伴相连的本地服务流。申报文件称，公司处理大量客户和交易数据，第三方服务商也能接触敏感信息。一次数据泄露或重大宕机不只是
              IT
              麻烦。它可能触发监管行动、客户直接索赔、保险成本上升，并在公司试图靠一体化照护做差异化时正面侵蚀信任。公开资料也没有给出这些系统的独立网络安全审计、渗透测试披露或外部可靠性看板，因此投资者能更清楚看到数字化雄心，却看不到同等清晰的韧性证据。
