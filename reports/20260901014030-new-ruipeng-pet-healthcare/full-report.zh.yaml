      - number: '7.4'
        title: 缓释因素、监测指标与打破投资假设的触发器
        blocks:
          - type: paragraph
            body: >-
              缓释因素确实存在。New Ruipeng 有规模、内部培训基础设施、上一披露期数千名持证兽医、结构化的 1+P+C
              转诊模型、数字化流程工具、国家标准领导地位，以及强势战略伙伴。这些都会降低单一本地问题自动演变为系统性失败的概率。但剩余风险仍高，因为同一家公司一边披露有限的当期公开信息，一边试图协调医院、兽医、供应链、实验室、客户数据、互联网服务、教育和合作伙伴生态。在这种结构下，风险如何传导，比任何孤立问题都更重要。


              因此，务实尽调应盯住硬触发器，而不是笼统乐观。最重要的负面触发器包括：核心医院出现经监管确认的牌照或药品合规行动；有证据显示 Cayman
              重组流程超出可控的控股公司事项；经审计财务继续不更新；可见同店萎缩或医院进一步收缩；或 JD、Boehringer 等关键生态伙伴流失。正向抵消因素则是发布经审计的 2024 或 2025
              年数据，证明利润率显著改善，并透明证明质量、牌照、数据安全和人员系统能在规模下撑住。在此之前，New Ruipeng 更不像一个干净的后期复利资产，更像一个规模大、战略重要、但剩余风险阴影很重的运营商。
