  - id: FI001
    title: 收入模式桥
    type: flow
    layout: standard
    summary: New Ruipeng 如何把医院客流、数字用户和 B2B 分销转成确认收入。
    data:
      nodes:
        - id: customer
          label: 宠物主人 / 诊所买方
          description: 消费者通过医院、本地平台或 Rvet 进入；B2B 买方通过供应链网络进入
        - id: petcare
          label: 宠物护理服务
          description: 医疗治疗、美容、诊断和其他护理按服务收费产生收入
        - id: digital
          label: Rvet / 本地服务
          description: 数字问诊、预约、产品销售和本地商业活动支撑流量与变现
        - id: supply
          label: 供应链服务
          description: 面向医院、诊所和门店的产品分销，把收入扩展到自有医院之外
        - id: prepay
          label: 预付款 / 会员
          description: 医疗卡和会员在服务交付前收取现金，并进入合同负债
        - id: recognized
          label: 确认收入
          description: 2022 年收入合计 RMB5.7402B，来源覆盖宠物护理、供应链和本地服务
      edges:
        - from: customer
          to: petcare
          label: 就诊和治疗支出
        - from: customer
          to: digital
          label: 预约、浏览、购买活动
        - from: petcare
          to: prepay
          label: 会员 / 卡增购
        - from: digital
          to: petcare
          label: 流量和复诊
        - from: digital
          to: supply
          label: 产品需求和本地商业
        - from: supply
          to: recognized
          label: 产品销售确认
        - from: petcare
          to: recognized
          label: 服务收入确认
        - from: prepay
          to: recognized
          label: 履约后确认收入
        - from: digital
          to: recognized
          label: 本地服务收入确认
    approximationNotes: null
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI014
      - CI022
      - CI027
      - CI029
  - id: FI002
    title: 单位经济桥
    type: flow
    layout: standard
    summary: 用当前公开可得的最佳代理链条，从客户活动推到贡献质量。
    data:
      nodes:
        - id: active
          label: 2.6M 活跃宠物护理客户
          description: 2022 年披露的活跃宠物护理客户基础
        - id: repeat
          label: ~56% 复购
          description: 宠物护理服务中的重复行为代理
        - id: revenue_per
          label: 每名活跃客户年宠物护理收入 RMB1,129
          description: 已披露的每名活跃宠物护理客户年度净收入
        - id: mix
          label: 向供应链和本地服务交叉销售
          description: 更宽的平台可能把护理就诊之外的钱包份额做大
        - id: gross
          label: ~5.6% 毛利率
          description: 虽有规模，毛利能力仍弱
        - id: ebitda
          label: 调整后 EBITDA 利润率 -16.5%
          description: 最近审计点显示，经营杠杆仍为负
      edges:
        - from: active
          to: repeat
          label: 留存推动复用
        - from: repeat
          to: revenue_per
          label: 就诊转化为年度支出
        - from: revenue_per
          to: mix
          label: 护理服务之外的潜在交叉销售
        - from: mix
          to: gross
          label: 分部组合决定毛利质量
        - from: gross
          to: ebitda
          label: 运营费用吞噬毛利
    approximationNotes: 桥接链条并不完整，因为公司没有披露诊所层面的贡献利润率、CAC 或同院生产率。因此只能停在已披露利润率代理处。
    claimRefs:
