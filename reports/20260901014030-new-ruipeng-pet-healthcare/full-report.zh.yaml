  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              New Ruipeng 经营的是医疗服务里监管很重的一角。中国 2022
              年动物诊疗机构规则要求机构具备正式许可证、固定场所、合格人员、功能诊疗区、隔离控制、设备、废弃物处理系统、疫情报告流程，并严格限制执业范围。开分支机构不能消除这层负担；每一家分支机构都必须单独取证。同一套规则也只允许通过已备案兽医、在机构获许可范围内开展互联网诊疗活动。这个网络历史上披露过近
              1,900 家医院，如今仍以 1,000 多家医院对外宣传，也就是说，每一个站点、每一名兽医、每一份记录、每一个线上流程都会放大监管接触面。


              New Ruipeng 自己的申报文件说明，风险并非理论问题。F-1/A 称 Rvet 和 Zhiyue
              已持有若干电信牌照，但监管解释一旦演变，互联网信息、视听、互联网文化、网络出版或民办学校活动仍可能需要额外许可。文件还警示，线上本地服务和教育活动可能在中国法律下被认定为外商投资限制或禁止业务。更关键的是，文件明确披露，部分医院使用过人用药或尚未完全获批的兽药，部分医院药品记录不准确或不完整，还有部分医院没有遵守动物麻醉药品和精神药品所需的全部流程。这些承认把合规从泛泛的行业风险变成公司特定经营问题。New
              Ruipeng 在国家标准和内部 SOP 推广中的领导地位确实能缓释风险，但这不是外部给出的健康证明。
