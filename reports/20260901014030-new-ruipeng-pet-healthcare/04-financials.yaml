    {
      "id": "financial-verdict-and-blockers",
      "title": "Financial verdict and diligence blockers",
      "body": "The financial verdict is mixed. New Ruipeng proved revenue scale, customer reach, diversified monetization, and continued access to capital. But the same public record also shows a company that entered 2023 with negative EBITDA, negative operating cash flow, heavy inventories, and dependence on financing. The June 2024 IPO withdrawal then sharply reduced transparency. While the company’s 2024 year-end message claimed the medical module turned profitable in March 2025, no audited 2024 or 2025 statements were found to test that claim.\n\nThat makes the central diligence blocker current rather than historical. Historical data is enough to say the business was real and large. It is not enough to say whether the post-2024 organization has improved cash conversion, narrowed clinic-level losses, or achieved sustainable profitability. Public-comp comparisons from Chewy to Zoetis underscore the stakes: similar pet-adjacent revenue scale can map to very different market caps and multiples depending on margin structure and financial quality. Without current disclosures on segment margins, same-hospital trends, and cash burn, underwriting remains anchored to stale numbers.",
