    {
      "id": "unit-economics-and-cost-structure",
      "title": "Unit economics proxies and cost structure",
      "body": "Public disclosure is rich enough to prove traction, but not rich enough to prove clinic-level economics. New Ruipeng disclosed roughly 2.6 million active pet-care customers in 2022, a repurchase rate of about 56%, average annual pet-care revenue per active customer of RMB1,129, and 5.2 million registered Rvet users. Those are useful signs that the customer base was real and that digital surfaces mattered. But the filing did not publish same-hospital sales, clinic contribution margin, payback period, or city-level profitability. That means the best available unit-economics view remains a proxy set rather than a full underwriting model.\n\nCost structure is easier to diagnose. The company’s 2022 gross profit was RMB318.8 million on RMB5.7402 billion of revenue, implying gross margin of only about 5.6%. Net loss was RMB1.4171 billion and adjusted EBITDA was negative RMB948.2 million. Inventories of RMB680.3 million, property-and-equipment spending of RMB240.8 million, and continuing negative operating cash flow all reinforce the same conclusion: scale did not yet create obvious operating leverage by 2022. The business may still benefit from cross-sell and procurement over time, but publicly disclosed evidence shows a low-margin, asset- and working-capital-heavy operating model at the last audited checkpoint.",
