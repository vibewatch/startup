      "id": "direct-domestic-rivals",
      "title": "Direct domestic rivals and the status-quo alternative",
      "body": "Ringpai is large enough to matter, but still small enough to leave New Ruipeng meaningfully ahead on disclosed scale. Pet Fair Asia and NewTimeSpace both describe Ringpai as operating 548 hospitals across roughly 70 cities by mid-2025, compared with New Ruipeng’s 1,891-hospital disclosure at 2022 year-end. The challenge for New Ruipeng is that Ringpai’s operating story may be cleaner. Independent reporting credits Ringpai’s VDP model with better retention of medical teams and a more controlled acquisition style, while criticizing New Ruipeng’s earlier full-buyout approach for heavy integration costs and internal competition. That does not make Ringpai dominant, but it does make it the most credible “better-executed number two.”\n\nThe more stubborn rival remains the status quo: local clinics. Chain penetration around 22% means many pet owners still solve care needs through nearby independents that can be cheaper, more personal, or simply more convenient. This keeps switching costs low and makes brand moat difficult to enforce city by city. New Ruipeng’s answer is standardization and referral depth through a multi-brand network and 1+P+C structure, but those advantages only matter if customers perceive the quality gap and if doctors stay within the system.",
