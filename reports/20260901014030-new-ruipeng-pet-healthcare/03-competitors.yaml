    {
      "id": "international-and-adjacent-models",
      "title": "International incumbents and adjacent platform competitors",
      "body": "International comparators help show what a durable veterinary-service moat can look like. Banfield emphasizes preventive care, wellness plans, tele-advice, and life-stage care at very large national scale, while VCA combines primary, specialty, emergency, urgent care, and oncology with an acquisition playbook that preserves local-hospital identity. CVS Group offers a public-market lens for how investors value a listed veterinary chain. These examples matter because they suggest the end-state model for scaled veterinary care is not “more clinics” by itself, but a system that layers recurring programs, specialized services, standardized records, and trusted referral pathways.\n\nAdjacent digital platforms matter for a different reason: they can weaken the direct relationship between hospital chain and pet owner. JD’s 2026 partnership with New Ruipeng reaches into internet hospitals, insurance, diagnostics, and AI models; Meituan drives local bookings and group-buying; Baidu and JD previously cooperated on pet-doctor services; and RVET itself tries to keep discovery, consultation, booking, and follow-up inside New Ruipeng’s software surface. These platforms are not full substitutes for hospital delivery, but they are highly relevant competitors and partners because they mediate traffic, pricing visibility, and re-engagement.",
