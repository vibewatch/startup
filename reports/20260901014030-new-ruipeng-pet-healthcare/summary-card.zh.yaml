  topStrengths:
    - New Ruipeng 确有全国规模：官网显示当前医院数超过 1,000 家，IPO 阶段材料也证明它是中国公开记录中最大的宠物医院网络。
    - 这项资产的战略稀缺性在于，它把医院、诊断、数字化流程、供应链服务，以及 JD、Boehringer 等生态关系拼在一起。
    - 作为民营宠物医疗运营商，公司历史收入和客户证明较扎实：2022 年收入 RMB5.7402 billion，活跃宠物护理客户约 2.6 million。
    - IPO 撤回后，公司仍出现在近期 Hurun 独角兽榜单，说明它在机构视野中仍具重要性。
  topRisks:
    - 当前 RMB30.5-33 billion 估值信号来自二级市场，相比最后披露的 2022 年收入基数和所选上市可比区间，仍显偏贵。
    - 公开证据仍缺少经审计的 2024-2026 财务、当前利润率、股权结构条款，以及同店经营趋势细节。
    - 公司运营超大规模持牌医院网络，又依赖数字、临床和伙伴协同，监管和执行复杂度都高。
    - OffshoreAlert 披露的 Cayman 重组标题，给母公司层面增加了法律和融资压力；多数上市可比公司没有这类包袱。
    - 行业证据仍指向中国宠物医院经济模型分散、价格敏感、利润率承压。
  unresolvedGaps:
    - 经审计的 2024-2026 收入、毛利率、EBITDA、现金和医院层面贡献利润率尚未公开。
    - 当前股权结构、清算优先权、债务堆叠，以及普通股之上的任何债权人优先级仍未披露。
    - Cayman 重组程序的确切法律和经济范围仍缺少公开透明度。
    - IPO 撤回后，门店数桥接、同店表现，以及关店 / 开店 cohort 仍缺少公开记录。
    - 验证长期经济模型所需的客户留存、复诊和保险 attach 数据仍属私有。
