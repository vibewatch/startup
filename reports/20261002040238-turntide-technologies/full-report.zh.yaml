  - id: FE001
    title: 已公开电气化产品架构
    type: stack
    summary: 已公开的六层架构串联客户运行工况、核心元器件与公开质保声明；接口与控制协议文档仍不完备。
    data:
      layers:
        - label: 客户运行工况
          modules:
            - 商用与非公路车辆动力推进
            - 固定式专用作业设备
          note: Applications are stated by Turntide; shipment mix is not disclosed.
        - label: 系统拓扑构型
          modules:
            - 电驱动桥总成（EDU）
            - 串联式混动
            - 并联式混动
            - 电动动力输出装置（ePTO）
          note: Named production deployments are not established by the assigned evidence.
        - label: 机械集成
          modules:
            - 差速器与简化齿轮传动机构
            - 独立元器件可维保性
          note: Service intervals and repair-time evidence are unavailable.
        - label: 电力转换
          modules:
            - 匹配标定的逆变器与控制器
            - 高压电气连接线束
          note: Control software, interfaces, and functional-safety artifacts are undisclosed.
        - label: 机电核心模块
          modules:
            - 可叠加工况的轴向磁通电机
            - 可配置绕组与多电压档位选项
          note: Public metrics are issuer claims without an independent benchmark protocol.
        - label: 冷却与品质保障
          modules:
            - 共用或间接液冷系统
            - 声称符合 ISO、环境与防护等级（IP）规范
          note: Certificate scope and full-load thermal validation require direct review.
    approximationNotes: 概念分层梳理自已审阅的公开披露；不代表未披露接口已就绪、具备量产就绪度或已获系统级性能认证。
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE016
  - id: FU001
    title: 客户拓展路径与商业化扩张飞轮
    type: journey-map
    summary: 多阶段 OEM 客户导入生命周期：从初期应用联合开发，延伸至合资扩张与实车长期复购。
    data:
      items:
        - label: 需求挖掘与线索获取
          touchpoints:
            - 面向 OEM 的技术型直销对接
            - 行业展会（CONEXPO、IAA Transportation）
            - 核心零部件生态伙伴引荐（EVR Motors、RISE Robotics）
          painPoints: Complex non-linear electrification requirements across varied duty cycles
          actions: >-
            Evaluate vehicle packaging constraints, torque density targets, and hybrid versus battery electric
            architecture requirements
        - label: 技术联合开发
          touchpoints:
            - 应用工程测功机台架实测（滑铁卢、英国及客户现场）
            - 电力电子与电机控制器匹配
            - 安全合规审查（ISO 26262、CRA 及轨道交通标准框架）
          painPoints: High engineering friction and long validation cycles before prototype sign-off
          actions: Conduct motor characterization dyno runs and pair modular inverters to customer powertrain interfaces
        - label: 首期量产订单
          touchpoints:
            - 试点示范与车队评估验收签发
            - 首期电池与电机量产合同（如 Hitachi Rail 订单）
            - 厂区部件装配与交付
          painPoints: Limited initial unit volumes and heavy reliance on customized hardware configurations
          actions: >-
            Deliver customized traction batteries and inverters for pilot intercity trains and commercial vehicle
            platforms
        - label: 合资建厂与渠道扩张
          touchpoints:
            - 区域制造合资企业（在印度与 Minda Corporation 设立 51/49 合资公司）
            - 与电机及执行器伙伴联合提供交钥匙动力总成方案
            - 本地化主机厂供应链整合
          painPoints: Capital intensity, local regulatory approvals, and partner margin sharing
          actions: Establish regional manufacturing presence to satisfy domestic procurement mandates and expand OEM pipeline
        - label: 车队全生命周期运维与换代
          touchpoints:
            - 持续维护与固件标定
            - OTA 远程监控与电池诊断
            - 后续列车编组或整车项目拓展
          painPoints: Absence of public NRR, long replacement cycles, and risk of customer redesign
          actions: Maintain technical support relationships while seeking multi-year platform fleet renewal commitments
        - label: 生态深度复购与再对接
          touchpoints:
            - 客户高管复盘与下一代动力总成路线图规划
            - 拓展至相邻设备品类及多电压电池平台
            - 二级市场后装改造与电池回收支持
          painPoints: OEM platform architecture freeze and multi-year refresh cadences
          actions: Position high-torque axial flux motor updates for next-generation vehicle cycle designs
    approximationNotes: 流程梳理自 Turntide 应用工程岗位招聘需求、行业公告及合资公司申报文件，代表标准 OEM 商业化路径。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU007
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 矩阵横跨发生概率、影响严重程度与缓释成熟度，系统梳理企业核心风险。
    data:
      columns:
        - label: 发生概率
          detail: 结合已有证据估算风险发生的概率。
        - label: 影响程度
          detail: 风险一旦爆发对公司存续与运营造成的潜在冲击烈度。
        - label: 缓释成熟度
          detail: 现有风控机制与政策的完备度与有效性。
      rows:
        - label: 现金跑道与下调轮流动性
          note: 持续失血未解，一级市场存在下调估值记录。
          values:
            - label: 高
              tone: critical
              detail: 估值从 $1B 骤降至 $83.83M，显示融资压力极度严峻。
            - label: 极高
              tone: critical
              detail: 若缺乏新增资金注入，可能引发破产清算或折价重组。
            - label: 低
              tone: critical
              detail: 未披露公开现金跑道，且高度依赖可转债。
        - label: 硬件制造工业化
          note: 精密轴向磁通电机规模化组装难度极高。
          values:
            - label: 中
              tone: warning
              detail: 工装模具与自动化绕线需要大量资本开支。
            - label: 高
              tone: warning
              detail: 产能瓶颈可能延误主机厂项目交付。
            - label: 中等
              tone: neutral
              detail: 获得 UKAS 认可的 BSI 认证奠定了质量管理基线。
        - label: 跨国合资落地（印度 SPV）
          note: 与 Minda Corporation 设立跨境合资公司的执行风险。
          values:
            - label: 中
              tone: neutral
              detail: 取决于印度监管审批与 SPV 注资到位情况。
            - label: 高
              tone: warning
              detail: 一旦执行受阻，将严重阻碍切入印度电动车生态。
            - label: 中等
              tone: neutral
              detail: Turntide 持股 51% 拥有控制权，且本土一级供应商伙伴经验丰富。
        - label: 商业化落地与企业客户采纳速度
          note: 深度依赖轨道交通与非道路场景主机厂的验证周期。
          values:
            - label: 高
              tone: warning
              detail: 重型运输领域开发与准入认证周期普遍漫长。
            - label: 高
              tone: warning
              detail: 从工程样机到量产交付的转化节奏缓慢，压制收入爬坡。
            - label: 推进中
              tone: warning
              detail: 与 JCB、Hitachi Rail 及 MAN 的合作仍在推进，尚待转化为正式量产。
        - label: 供应链与贸易合规
          note: 供应链横跨美、英、印多地带来的敞口风险。
          values:
            - label: 低
              tone: positive
              detail: 具备完备的供应商行为准则与合同合规认证。
            - label: 高
              tone: warning
              detail: 零部件短缺或违反制裁禁令可能导致产线停摆。
            - label: 健全
              tone: positive
              detail: 拥有涵盖环保、制裁及劳工标准的正式管理制度。
        - label: 高顺位清算优先权压顶
          note: 累计融资超 $400M+ 导致资本结构极为复杂。
          values:
            - label: 高
              tone: critical
              detail: 优先股资本规模庞大，顺位排在普通股股东之前。
            - label: 极高
              tone: critical
              detail: 在任何退出情景下，次级顺位份额都面临颗粒无收的清零风险。
            - label: 低
              tone: critical
              detail: 清算优先权结构繁复，且未见任何已知的普通股保护条款。
    approximationNotes: 发生概率与影响程度定性推导自经核实的一级市场融资历史、业务布局及合作伙伴披露信息。
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR007
      - CR009
      - CR010
  - id: FV001
    title: Turntide 投资建议与投资判断决策链
    type: flow
    summary: 逻辑从自研电机能效优势一路推演至清算优先权压顶，最终得出回避（Avoid）评级。
    data:
      nodes:
        - id: tech
          label: 自研电气化技术（能效提升 25-50%）
        - id: capital
          label: 重资产属性与快速失血（截至 2022 年累计融资约 ~$485M+）
        - id: disclosure
          label: 财务数据无公开披露（未披露 ARR、烧钱速度与毛利率）
        - id: overhang
          label: 估值雪崩与清算优先权压顶（峰值 $1B 重置为 D-2 轮的 $83.83M）
        - id: decision
          label: 投资建议：回避（Avoid）/ 极高风险
        - id: diligence
          label: 必填尽调前置条件（完整股权结构表清算瀑布模型与经审计收入）
      edges:
        - - tech
          - capital
        - - capital
          - disclosure
        - - disclosure
          - overhang
        - - overhang
          - decision
        - - decision
          - diligence
    approximationNotes: 概念性递进决策链，直观展示尽调推导各阶段。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV007
      - CV010
