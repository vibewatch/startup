      - number: '4.3'
        title: 资金需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              现有证据表明这是一条资本密集型的扩产路径。据 Reuters 报道，2022 年一轮 $80 million 融资使股权融资总额达到 $485 million，资金部分用于美国本土制造与技术研发。2026
              年，Turntide 将 Project SUPREME 描绘为一项投资额 £17 million 的等额配套资助项目（尚待政府最终批准），重点推进劳动密集型电机生产环节的自动化，并扩建厂房至 2028 年 1
              月。Forge 另据报道披露，公司于 2026 年 5 月 7 日完成一笔 $26.2 million 的 Series D-2 轮融资，投后估值仅为 $83.83
              million。上述金额只是融资额与项目预算，绝非账面现金额。招聘开支、员工福利以及跨越四个国家的运营足迹带来了肉眼可见的组织刚性支出，而公开现金结余、负债、烧钱速度、营运资金及现金跑道至今仍未披露公开数据。
