      - number: '5.3'
        title: 产品成熟度、部署进展与可维修性
        blocks:
          - type: paragraph
            body: >-
              根据所审阅材料，产品成熟度参差不齐。AF430S 早在 2025 年 4 月便有供应商撰写的详细产品名录，而集成式 EDU 则宣布于 2026 年 3 月的 CONEXPO 展会上首次亮相，并在 2026 年 9
              月借 IAA Transportation 期间的一篇付费通稿再度造势。Turntide 还通报称搭载该系统的定制 Sierra Echo-R 赛车完成了 600 多英里（more than 600
              miles）的荒漠测试，并称 EDU
              在整场比赛中运行无虞。此举印证了样机在振动、重载、扬尘和高温极端工况下的性能，但绝不能替代独立第三方实测的耐用性结果、量产车队的实际运行工时、质保返修数据或故障率统计分布。EDU
              各组件支持独立维修理论上可缩小维护范围，但公开来源并未提供关于保养周期、备件供应、诊断流程或平均故障修复时间（MTTR）的公开证据。
            claimRefs:
              - CE005
              - CE010
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: 质量体系、安全规范与技术尽调要点
        blocks:
          - type: paragraph
            body: >-
              Turntide 官网宣称其系统达到国际公认基准，并经由 UKAS 认可的 BSI 认证核验符合 ISO 规范；AF430S 产品页另行自述符合 ISO 16750 环境测试标准，并具备 IP67 与
              IP6K9K 的外壳防护等级。但在指派的尽调材料中，并未列明官网所引 ISO
              标准的具体编号、证书编号、认证实体、认证范围或有效截止日期。材料亦未记录功能安全分析、电机控制软件架构、网络安全控制、历史安全事件、供应商准入机制或电池安全验证。招聘页面仅释放出泛化的专业人才需求信号，而抓取到的独立行业出版物页面也只是编辑个人履历，缺乏实质性技术报道。因此在技术尽调中，必须直接核查认证证书与检测报告，调取
              OEM 验证报告、实车远程遥测数据、固件管控机制及质量体系凭证，方能将公布的性能自述或质量承诺认定为经过量产验证。
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE014
              - CE016
      - number: '5.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 深度集成是产品立足之本
            body: >-
              公司的差异化主张不仅在于轴向磁通电机的拓扑构型，更在于将电机、逆变器、传动齿轮、冷却及可维修性深度集成，旨在帮 OEM 减轻系统验证负担。由于指定材料中未见公开点名的量产 OEM
              客户、缺乏集成周期基准对比以及客户实际取得的经济收益，上述产品逻辑目前在商业上尚未得到量化验证。
            calloutType: insight
