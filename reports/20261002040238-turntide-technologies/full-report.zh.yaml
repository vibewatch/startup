      - number: '7.2'
        title: 运营复杂度高企、供应链脆弱与质量控制挑战
        blocks:
          - type: paragraph
            body: >-
              公司从建筑暖通软件及电机改造向重型车辆电气化转型，直面沉重的运营与工业化扩产瓶颈。生产大功率轴向磁通电机、碳化硅电力电子器件与多元化学体系电池包，需要高度专用的制造自动化产线、洁净室工装与精密装配工艺。其实体运营网络分散于各地——包括佐治亚州
              Alpharetta、英国 Sunderland 和 Gateshead、加拿大 Waterloo 以及印度 Pune 的多处设施——带来了巨大的供应链协同摩擦与跨国合规成本。此外，Turntide
              的《供应商行为准则》针对劳工标准、有害物质处理、冲突矿产采购及国际贸易制裁合规设定了严苛要求，在动荡的全球硬件供应链环境下，可能进一步推高采购开支并限制零部件供货稳定性。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
