      - number: '1.2'
        title: 高管团队、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Turntide 现任高管团队已转向服务商业交通、非道路机械及轨道交通电气化业务。首席执行官 Steve Hornyak 统领的高管团队包括首席商务官 Brad Bell、首席财务官 Nick
              Carr、总法律顾问 Chris Turner、工程副总裁 Adam Nixon、全球运营副总裁 David Orgill、产品副总裁 George Paterson、合作伙伴副总裁 Ryan Grodzki
              以及各区域商务负责人。创始团队彻底换血（包括前 CEO Ryan Morris 于 2023 年底离职）基本消除了创始人控制权风险，却加剧了轴向磁通动力总成商业化推进对 Hornyak 和 Nixon
              的关键人物执行依赖。跨国制造与交付高度依赖区域董事总经理的领导，尤其是负责亚太区的 Pradumna Walimbe（时值 Turntide 与印度 Minda Corporation 建立 51/49
              动力总成合资企业），以及负责欧洲、中东和非洲区（EMEA）并统筹英国轨道与非道路生产的 Gareth Littlewood。
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO002
