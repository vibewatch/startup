      - number: '7.3'
        title: 商业集中度高、交易对手履约风险与合资依赖
        blocks:
          - type: paragraph
            body: >-
              Turntide 交通与工业电气化产品线的商业化推进，高度依附于极少数核心企业伙伴及跨国交易对手。2026 年 3 月，Turntide 与印度汽车 Tier-1 供应商 Minda Corporation
              签署战略合资协议，借特殊目的实体（SPV）生产电动汽车及混动动力总成零部件，其中 Turntide 持股 51%，Minda 持股 49%。该合资项目虽旨在打入印度本土 OEM
              市场并满足零部件本地化率要求，但交易依然受制于东道国监管审批、出资缴款通知以及复杂的跨国知识产权授权条款。与此同时，公司在 JCB、Hitachi Rail 及大众旗下 MAN
              卡车等重点客户中的商用交通落地进展，依然面临从原型样件到正式量产的认证风险、漫长的汽车销售周期，且缺乏具备约束力的多年期“照付不议”（take-or-pay）批量采购承诺。
