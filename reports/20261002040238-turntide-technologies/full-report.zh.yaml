            title: 倒挂轮估值缩水与资本结构脆弱性
            body: >-
              Turntide 的隐含投后估值从 2022 年 6 月的超 $1.0 billion 暴跌至 2026 年 5 月的 $83.83 million，构成了急剧的下行风险诱因。鉴于历史上累计投入超 $400
              million 资金，如此剧烈的估值缩水意味着早期优先股可能存在清算压顶隐患、员工期权大面积沦为“水下期权”，且未来后续融资时将遭遇极大的资本重组阻力。
