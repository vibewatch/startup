  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、客群细分与结构调整
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies 切入全球商用车电气化及工业动力总成市场，专攻高扭矩轴向磁通电机、低压与高压电机控制器以及交通电池系统 [CM001]。公司早期靠 Smart Motor System
              与物联网自动化套件主攻商用建筑节能。但在 BrainBox AI 收购其自动化部门、接管 1,900 多栋联网建筑业务后，其目标市场版图大幅收缩 [CM002]。因此，Turntide
              当前的核心市场明确局限于交通运输和重型工业动力总成领域，剔除了建筑管理系统及楼宇级暖通空调（HVAC）优化软件 [CM003]。在重型交通领域，OEM
              厂商亟需高功率密度动力总成，以便在不牺牲载荷能力的前提下装入空间紧凑的底盘 [CM004]。相反，在印度等高增长新兴市场，需求集中于两轮、三轮及轻型四轮交通工具的低压架构
              [CM005]。传统替代方案依然根深蒂固，市场仍由传统径向磁通感应电机、永磁电机以及传统内燃机主导 [CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 目标市场规模测算、区域格局与测算缺口
        blocks:
          - type: paragraph
            body: >-
              评估 Turntide 的潜在总需求，须按其实际运营业务线逐一细分，而非套用宽泛的气候科技单一数字。尽管第三方市场机构预计商用建筑自动化支出将从 2022 年的 $87.3 billion 增至 2031 年的
              $168.8 billion（复合年均增长率 7.9%），但在剥离该业务后，Turntide 已无法从中直接获利 [CM007]。当前 Turntide 的核心增长看点转向轴向磁通电机制造与区域轻型动力总成
              [CM008]。在英国和欧洲，轴向磁通电机的应用得到产业化扩产计划扶持，包括英国政府 DRIVE35 计划下持续至 2028 年 1 月的 £17 million 等额配套资助项目 Project SUPREME
              [CM009]。在南亚，低运营成本推动了大规模电气化普及：电动三轮车每公里运行成本为 INR 1.28，远低于汽油车每公里的 INR 3.21 [CM010]。2025 年底印度电动汽车单月注册量达到 23.4
              万辆（234,000 units），印证了轻型出行领域的商业规模 [CM011]。但鉴于 Turntide
              从未公开披露商业出货量与定价层级，外界无法独立测算其合并层面的总可用市场（TAM）、可服务市场（SAM）及可获取市场（SOM）[CM012]。
