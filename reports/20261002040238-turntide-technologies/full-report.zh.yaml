      - number: '2.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 业务剥离后的市场边界收缩
            body: 将自动化部门出售给 BrainBox AI 后，Turntide 的市场机会已从宽泛的智慧建筑脱碳大幅收缩至专精的车辆电气化领域。尽职调查必须严格将其定位于特种动力总成硬件与电子零部件供应商来展开评估。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 轴向磁通制造规模化瓶颈
            body: >-
              轴向磁通电机虽具备出色的功率与扭矩密度，却因工艺复杂且造价昂贵而在工业界普及受阻。Turntide 的商业化成败，高度系于其为期 18 个月的 Project SUPREME
              资助项目能否顺利实现定子绕线与装配自动化。
            calloutType: risk
            claimRefs:
              - CM009
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 动力总成与工业电气化竞争格局
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies 所处的竞争格局横跨多个不同的技术边界与设备类别，主要划分为老牌汽车与工业 Tier-1
              巨头、专注高性能轴向磁通电机的创新厂商，以及固守传统的交流感应或永磁电机存量设备制造商 [CP001, CP002, CP008]。公司 2013 年成立之初名为 Software Motor
              Corporation（SMC），早期凭借软件控制的开关磁阻电机（SRM）切入节能市场，旨在摆脱对稀土永磁体的依赖，替代建筑暖通空调、商用制冷和乳业通风系统中的标准交流感应电机 [CP001, CP003,
              CP004]。然而，凭借 2021 年 6 月发起的大举并购——包括买下 BorgWarner 的 Gateshead 传动系统业务、电池包专精厂商 Hyperdrive 以及电机控制公司 AVID
              Technology——Turntide 直接杀入非道路、商用交通和轨道交通动力总成电气化领域 [CP001, CP002, CP005]。此番战略转向让 Turntide 与
              BorgWarner、Bosch、Dana、Danfoss Editron 等全球零部件巨头正面遭遇；后者坐拥深厚的全球分销网络、百亿美元级的研发预算以及数十年积累的 OEM 供货关系 [CP001,
              CP002]。与此同时，在高扭矩密度轴向磁通推进领域，YASA（2021 年被 Mercedes-Benz 收购）和 Saietta
              等专精玩家树立了高压功率密度的技术标杆；而在传统商用建筑自动化与风机改造市场，Siemens、ABB 和 WEG 等工业老牌势力牢牢把持着渠道 [CP001, CP002, CP005]。Turntide
              的产品线试图兼顾车辆动力推进与工业系统，导致其在需求各异的客户采购决策环节面临多线受压 [CP002, CP005, CP009]。
