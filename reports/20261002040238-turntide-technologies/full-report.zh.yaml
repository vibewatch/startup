            body: >-
              Turntide 公布了关于密度、效率、电压、防护等级及耐用性的精确自述指标，但外部产品名录实为供应商自行撰写，Yahoo 相关报道被标注为付费通稿，而抓取到的 Power & Motion
              页面并未包含实质性技术文章正文。在全面审查测试协议与独立第三方实测结果前，投资研判应将上述数据严格视为公司单方面宣称。
            calloutType: risk
