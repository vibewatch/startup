chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、成立沿革与战略重组
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies 由 Piyush Desai、Mark Johnston 和 Trevor Creary 于 2013 年以 Software Motor Company
              之名创立，最初立足于专利开关磁阻 Smart Motor Systems 配合云端建筑自动化控制系统打响品牌。公司总部位于加利福尼亚州 Sunnyvale，主要高管运营中心设在佐治亚州
              Alpharetta，此前将高效电机技术推向农业、建筑暖通空调（HVAC）及商业设备领域。然而 2022 年后的宏观环境转变迫使公司展开大刀阔斧的重组。Turntide 于 2022
              年下半年裁员，联合创始人兼长期执掌公司的 CEO Ryan Morris 于 2023 年 10 月离职；公司先任命 Mark Cox 为临时 CEO，随后延聘 Steve Hornyak
              出任正式首席执行官。2024 年 5 月，Turntide 将涵盖 1,900 多栋联网客户建筑的核心自动化部门出售给蒙特利尔的 BrainBox
              AI。这笔关键资产剥离标志着公司果断退出建筑能源管理业务，将工程与制造重心全面转向轴向磁通电机、电力电子及高压轨道电池系统。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
