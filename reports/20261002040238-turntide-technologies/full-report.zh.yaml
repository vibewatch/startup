figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 追踪 Turntide 从创立、独角兽高估值狂飙、运营重组，再到战略转型工业与轨道电气化的完整发展轨迹。
    data:
      items:
        - label: 2013：公司创立
          date: '2013-01-01'
          detail: Desai、Johnston 与 Creary 创立 Software Motor Company，主攻开关磁阻智能电机研发。
          tone: neutral
        - label: 2021：扩张期融资
          date: '2021-03-01'
          detail: 获 Breakthrough Energy Ventures、Amazon 与 CPPIB 大额注资，加速智能电机系统规模化落地。
          tone: positive
        - label: 2022-06：跻身独角兽巅峰
          date: '2022-06-15'
          detail: 获 OGCI 与 SEEIT 领投 $80M 股权融资，投后估值破 $1.0B，累计融资达 $485M。
          tone: positive
        - label: 2022-H2：重组与裁员
          date: '2022-09-01'
          detail: 科技行业整体收缩，公司启动裁员并压缩运营开支。
          tone: negative
        - label: 2023-06：Series D-1 资本重组
          date: '2023-06-27'
          detail: 以 $0.46/share 完成 $57.5M Series D-1 轮融资，投后估值为 $825.9M，附带 1.5x 清算优先权。
          tone: warning
        - label: 2023-10：创始人兼 CEO 离职
          date: '2023-10-15'
          detail: 联合创始人兼 CEO Ryan Morris 离职，Mark Cox 出任临时高管接管运营。
          tone: negative
        - label: 2024-05：剥离业务予 BrainBox AI
          date: '2024-05-29'
          detail: 将楼宇自动化部门（覆盖 1,900+ 栋联网建筑）出售给 BrainBox AI，全面转型车辆电气化。
          tone: warning
        - label: 2025-10：商业 OEM 客户扩张
          date: '2025-10-21'
          detail: 正式 CEO Steve Hornyak 上任后，公布新增 30+ 家客户与 15+ 家轴向磁通 OEM 合作方。
          tone: positive
        - label: 2026-03：签署印度动力总成合资协议
          date: '2026-03-10'
          detail: 与 Minda Corporation 签署 51:49 合资协议，在印度生产电动及混动动力总成系统。
          tone: positive
        - label: 2026-05：Series D-2 降估值融资
          date: '2026-05-07'
          detail: 以每股 $0.09 完成 $26.2M Series D-2 降估值融资，估值大幅下调至 $83.83M。
          tone: negative
    approximationNotes: 时间线事件均取自公司公告、并购新闻稿及 Forge Global 融资披露的已核实公开日期。
    claimRefs:
