            body: >-
              即便轴向磁通电机技术颇具吸引力，且绑定了 Hitachi Rail 与 Minda Corporation 等知名 Tier-1 合作伙伴，Turntide 仍给新进股权资本带来极高的结构性风险。高顺位轮次引入
