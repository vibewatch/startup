      - number: '2.3'
        title: 买方细分、采购决策权与产业化瓶颈
        blocks:
          - type: paragraph
            body: >-
              采购 Turntide 电气化产品涉及两类迥异的采购决策画像，各自的评估标准与预算归属截然不同 [CM013]。商用车与轨道交通 OEM
              主要依据重量功率密度、热管理封装以及制造验证指标来考量轴向磁通电机、逆变器和电池系统 [CM014]。与之相对，成本敏感型区域市场的轻型出行 OEM 与 Tier-1
              伙伴，则把单体经济模型、供应链本土化及合规性置于首位 [CM015]。全行业推广面临显著阻力：轴向磁通电机架构长期受制于繁琐耗时的制造工艺（包括精密线圈绕线及专用零部件模具开发），导致规模化量产成本居高不下
              [CM016]。上述制造瓶颈迫使企业必须持续借助合资合作、本土供应链配套及政府补贴联合资助，方能拼出具备竞争力的产能规模 [CM014]。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
