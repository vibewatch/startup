      - number: '8.2'
        title: 资本结构、下轮融资动向与清算优先权压顶
        blocks:
          - type: paragraph
            body: >-
              Turntide 的融资轨迹先赶上 2020–2022 年的气候科技投资热潮，随后又撞上流动性紧缩和估值收缩。2022 年 6 月，公司完成 Climate Investment 和 SDCL Energy
              Efficiency Income Trust 领投的 $80M 股权融资，估值超过 $1.0B，跻身独角兽。此前，2021 年已有一轮 $80M 融资和一笔 $225M 可转债入账。到 2023
              年中，媒体称后续融资的估值折让最高达 80%。Forge Global 的私募市场数据记录了更深的资本重置：2026 年 5 月，Series D-2 轮以每股 $0.09 募得 $26.2M，投后估值仅为
              $83.83M；此前的 2023 年 6 月 Series D-1 轮募资 $57.54M，附带 1.5x 清算优先权，另有 Series Junior 发行。按此计算，股权价值较 $1.0B 峰值缩水超过
              90%。高顺位清算优先权和重组后的股权类别带来严重稀释与结构性压顶，普通股股东及早期优先股投资人都面临大幅减记风险。
            claimRefs:
              - CV007
