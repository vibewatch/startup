            body: >-
              现有财务证据在透明度与融资走势上偏负面，但尚未就实际经营业绩得出定论。据 Forge 报道，2026 年 5 月的投后估值远低于其公布的 2023 年 6 月融资时的 $825.86 million
              投后估值；Forge 还报道称 2023 年的 Series D-1 轮附带 1.5x 清算优先权和 8% 的股息率。Forge
              提醒其非上市公司数据可能基于有限样本，未经审计或独立核实，因此上述数据须凭借一手凭证予以核实。即便考虑到这一点，新进投资者也无法单凭累计融资金额或附带条件的配套资助项目，理性推断其资金链是否充裕。在取得合并财务报表、现金与债务明细表、月度烧钱速度与现金跑道、在手订单转化情况、毛利率勾稽表及证券级股权结构表文件之前，该标的应保持不可投研判。
