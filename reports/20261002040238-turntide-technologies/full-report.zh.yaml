  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、评估立场与尽调评级
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies 在自研电气化硬件的落地进展与风投股权结构的恶化之间，呈现出尖锐反差。核心投资逻辑认为，工业电机与商用车动力总成代表着庞大的全球脱碳机遇，Turntide
              的开关磁阻与轴向磁通电机拓扑结构相比传统感应设计可带来 25% 至 50% 的能效提升。然而，反向逻辑占据绝对主导：Turntide 属于重资本运营模式，截至 2022 年已消耗约 $485M 至 $491M
              资金，却始终未披露年经常性收入、毛利率、现金烧钱速度及现金跑道等公开基本面财务指标。因此，我们明确给出回避（Avoid）建议，置信度评级为低（1/5），风险等级为极高（Critical），估值立场判定为偏贵（Expensive）。在取得经审计的财务报表、经核验的量产毛利率以及摸清清算优先权压顶状况之前，绝不建议向该公司注资。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
