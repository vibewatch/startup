      - number: '6.3'
        title: 商业持续性、扩张闭环与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Turntide 的商业扩张策略高度依赖战略合资企业与交钥匙工程合作，旨在化解传统采购摩擦并拓宽目标区域覆盖面 [CU003, CU007]。2026 年 3 月，Turntide 与印度 Spark Minda
              核心企业 Minda Corporation 签署战略合资协议，在一家特殊目的实体（SPV）中持有 51% 控股权，专注于面向印度本地 OEM 研发及制造高压牵引电机、电机控制器与热管理泵
              [CU007]。与此同时，公司与 EVR Motors、RISE Robotics 等零部件专业厂商展开交钥匙平台合作，将 Turntide
              逆变器与运动执行器打包成预集成的电驱动力总成，力图缩短重型设备制造商的商业集成周期 [CU003]。尽管构建了上述协同分销网络，客户集中度过高与商业可持续性仍然是首要的尽调风险点 [CU010,
              CU012]。Forge Global 的一级半市场交易数据披露，Turntide 于 2026 年 5 月遭遇严峻的估值倒挂融资，其 Series D-2 轮仅以每股 $0.09 筹集 $26.2
              million，投后估值仅为 $83.83 million，较此前 $1.0 billion 估值峰值以及 $825.86 million 的 Series D-1 轮估值基准暴跌超 91%
              [CU010]。此番严峻的资本重组，叠加未见公开净留存率（NRR）或总留存率（GRR）指标，印证了公司在商业化落地上面临巨大阻力、销售周期漫长，且过度依赖少数几家大型工业客户的订单承诺 [CU010,
              CU012]。
            claimRefs:
              - CU003
              - CU007
              - CU010
              - CU012
