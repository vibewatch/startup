  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户客群划分与商业合作架构
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies 瞄准跨领域的电气化市场机遇，横跨商用车、非道路工业机械、客运铁路及建筑运营 [CU001,
              CU002]。公司并非公开目录式零部件分销商，而是将定制电机、高压逆变器、电力电子及模块化电池系统直接销往原始设备制造商（OEM）与专业系统集成商 [CU002]。在商用交通领域，Turntide
              为改造混动或纯电商用卡车、工程作业车及客车的车辆制造商提供重型牵引电机、集成电机控制器及热管理流体泵 [CU002, CU005]。在铁路领域，Turntide
              专为区域及城际客运列车定制高压磷酸铁锂（LFP）电池包、电能转换硬件及热管理单元 [CU004, CU006]。其最初以 Smart Motor System
              品牌商业化的传统建筑自动化与农业业务，曾向谋求降低暖通空调电耗的大型企业物业业主、区域零售运营商及乳品养殖场供应开关磁阻电机 [CU001,
              CU008]。所有板块的商业合作都需要深度应用工程协同、技术联合开发及联合台架测功标定，导致在量产合同正式落地前往往经历长达数年的漫长采购评估周期 [CU002, CU003]。
