      - number: '5.2'
        title: 技术架构与性能自述
        blocks:
          - type: paragraph
            body: >-
              已公开的架构以可堆叠的轴向磁通电机与电力电子器件的组合为核心。Turntide
              将电驱动单元（EDU）描述为半集成式的电机、逆变器及差速器总成，采用电机-逆变器共用冷却回路、简化齿轮传动机构，且各零部件可独立维修。公司通报称，在 400 V 及以上电压等级下，EDU 电机配置的额定功率在
              73 kW 至 220 kW 之间，峰值功率在 300 kW 至 700 kW 之间。供应商撰写的 AF430S 产品名录补充了 800 VDC
              下的峰值功率与扭矩密度指标，以及关于液冷、工作电压、环境测试与外壳防护等级（IP 代码）的自述数据。上述规格参数可作为有价值的设计参考，却非经过验证的对比基准：两处宣传页中反复提及的“扭矩密度提升
              53%、体积缩减 58%、重量减轻 37%”均源自同一份公司新闻稿，既未披露测试规程，亦未说明参照基准配置。
