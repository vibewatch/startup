      - number: '1.3'
        title: 融资沿革、投资者阵容与严峻的估值倒挂下轮融资
        blocks:
          - type: paragraph
            body: >-
              2018 年至 2022 年间，Turntide 从知名机构及企业气候投资财团累计获得 $485M 股权融资，资方包括 Breakthrough Energy Ventures、Amazon Climate
              Pledge Fund、Canada Pension Plan Investment Board、BMW i Ventures、Fifth Wall、JLL Spark 及 OGCI Climate
              Investments。2022 年 6 月，Turntide 宣布完成由 OGCI Climate Investments 与 SDCL Energy Efficiency Income
              Trust（SEEIT）领投的 $80M 股权融资，声称投后估值突破 $1B 跻身独角兽行列。然而，随着科技行业下行、组织架构精简以及建筑自动化业务剥离，Turntide
              的股本结构经历了极度稀释和多轮资本重组。Forge Global 追踪的二级交易数据及结构化股权备案显示，公司于 2023 年 6 月实施过渡性重组（每股 $0.46 发行附带 1.5x 清算优先权的
              $57.54M Series D-1 轮，以及 $31.41M Junior Series 轮），随后在 2026 年 5 月完成艰难的 Series D-2 轮，以每股 $0.09 仅募得
              $26.2M。2026 年 5 月交易隐含的投后估值仅为 $83.83M——较 2022 年峰值重挫 91.6%，表明股权优先权结构经历了深度重组。
