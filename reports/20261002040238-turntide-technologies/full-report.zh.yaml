      - number: '3.2'
        title: 能力对比、渠道实力与市场推广定位
        blocks:
          - type: paragraph
            body: >-
              将 Turntide 与直接竞品及存量设备厂商对比，可见其在技术能力、定价模式与分销渠道上存在显著的权衡取舍 [CP002, CP006, CP008, CP011]。在特种推进领域，Turntide
              轴向磁通电机以紧凑体积输出超高扭矩密度，专为底盘布局空间极度受限的商用车混动、电动动力分出装置（ePTO）及辅助传动系统定制 [CP002,
              CP011]。为弥补面对本土存量巨头时的分销与本土化短板，Turntide 于 2026 年与 Spark Minda 核心实体 Minda Corporation
              组建战略合资企业，在一家印度特殊目的实体（SPV）中持有 51% 控股权，旨在面向当地商用纯电及混动平台制造并推广本土化的高压电机、电机控制器及热管理泵 [CP006,
              CP007]。借此轻资产合作模式，Turntide 得以打入高增长发展中国家的 OEM 供应链，而无需独自承担新建工厂的全部重资产资本开支 [CP006, CP007]。相比之下，Danfoss、Bosch 和
              BorgWarner 等大型工业巨头凭借现成的 Tier-1 供应关系、全面的长期服务框架协议（MSA）及打包批量折扣，构成了初创企业难以企及的竞争壁垒 [CP001, CP006]。Turntide
              虽然能提供囊括电机、逆变器及储能电池模块的集成动力总成套件，但商业定价透明度极低，高度依赖双边保密协议与定制化工程工作说明书（SOW），拖慢了企业级客户的采购落地节奏 [CP002, CP008, CP010]。
