      - number: '8.3'
        title: 情景估值建模与关键尽调诉求
        blocks:
          - type: paragraph
            body: >-
              结合当前公开可见信息审视 Turntide 在乐观、基准与悲观情景下的表现，下行风险明显不对称。乐观情景下，重型商用车主机厂（OEM）规模采用轴向磁通电驱动单元（EDU），加上来自 Hitachi Rail
              的英国铁路电池量产订单放量，以及借助持股 51% 的印度 Minda Corporation 合资公司向海外扩张，推动 Turntide 建立持续盈利能力，最终以 $250M 至 $400M 的估计企业价值实现
              IPO 或战略并购。基准情景下，Turntide 守住特种非道路机械、铁路与区域商用运输车队的细分供应商定位，虽有适度收入，但受制于制造业营运资金，对应企业价值在 $60M 至 $100M 之间（与近期
              Series D-2
              轮定价一致）。悲观情景下，剧烈现金消耗、高额零部件质保负债或优先权堆叠进一步加剧，将引发困境再注资、债务重组或资产清算，导致低顺位权益回报归零。机构投资者若要入局，必须严格尽调实际收入运行率、客户流失率、在手订单可取消性，以及最终的股权结构表分配瀑布。
            claimRefs:
