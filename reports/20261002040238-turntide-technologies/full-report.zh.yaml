companyProfile:
  summary: >-
    Turntide Technologies 是一家成立于 2013 年的后期非上市电气化硬件公司，前身为 Software Motor Company。公司业务已从建筑自动化转型，转向面向工业、商用车和非道路车辆 OEM
    的轴向磁通电机、电力电子及高压轨道电池系统。留存记录显示，公司累计获得巨额融资，于 2024 年剥离自动化部门，并在 2026 年 5 月通过 Series D-2 轮将投后估值重置为 $83.83M，但目前仍未披露公开财务数据。
