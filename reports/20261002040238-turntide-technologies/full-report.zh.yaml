  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与销售动线
        blocks:
          - type: paragraph
            body: >-
              Turntide
              将自身定位为电机、电力电子和储能设备制造商，业务模式贯穿从客户工程开发、规模量产到持续技术支持的端到端全流程。上述业务触点支撑着几条看似可行的收入流：零部件或系统销售、集成工程服务以及持续支持服务。然而，公开资料并未披露其收入是单独计费、按项目打包、按单件定价还是按期确认。公司在
              2021 年的新闻稿中声称已有具体的改造落地案例，且暖通空调电机能耗平均降低
              64%，虽能证明其经济价值主张，但绝非实际售价、收入、毛利、复购情况或客户集中度的证据。因此，具备投资意义的收入模型仍停留在产品驱动、依赖深度工程的假说阶段，尚未形成量化的财务全貌。
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
