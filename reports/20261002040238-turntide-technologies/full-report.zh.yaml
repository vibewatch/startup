  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Turntide 公开展示的产品矩阵呈现出从零部件到系统的完整布局，而非单一的电机
              SKU。公司自述业务覆盖电机、电力电子、储能系统及热管理设备的设计开发；所审阅的官方页面进一步列出了轴向磁通电机、电驱动单元（EDU）、混动推进架构以及电动动力分出（ePTO）系统。从客户工作流来看，EDU 将
              OEM 原本需要单独采购并独立验证的动力部件集成在一起，而 ePTO
              则能在无需启动车辆引擎的情况下为驻车作业供电。混动专页探讨了在纯电受限工况下适用的串联与并联架构。该产品广度或许有助于减少系统集成接口，但在交付的尽调材料中，没有任何公开来源披露任何产品线的当前出货量、标准售价、生产交付周期或质保条款。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE013
