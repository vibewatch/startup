          detail: 公司承诺提供持续运维支持，但合同节点与服务收费标准均无公开披露。
        - id: financial-output
          label: 营业收入与毛利润
          detail: 收入确认时点、实际到手价、产品结构、质保成本及毛利率均未公开。
    approximationNotes: 概念性业务流程梳理自公司陈述；不包含任何预估转化率、价格、收入或毛利数据。
    claimRefs:
      - CI003
      - CI004
      - CI009
