      - number: '4.2'
        title: 定价机制与单体经济模型
        blocks:
          - type: paragraph
            body: >-
              所有留存材料均未提供公开标价、实际成交价、合同期限、折扣力度、质保成本、收入确认政策、合并收入或毛利率数据。Tracxn 显示截至 2024 年 12 月 31 日，独立法人实体 Turntide
              Transport Limited 的年收入区间在 £10 million 至 £50 million 之间，但该子公司层面的数据绝不能等同于 Turntide Technologies
              的合并收入或年经常性收入（ARR）。在缺乏合同条款和分成机制的情况下，公开宣传的客户节能效益也无法折算为供应商的实际收入。销售周期长度、获客成本（CAC）、回本周期、渠道分成、在手订单转化率、产能利用率、营运资本及服务交付成本同样无从获取。此结论并非判定其毛利率偏低，而是若缺乏管理层数据包，分析师根本无法测算其单体经济模型。
