      - number: '1.4'
        title: 商业化路径、运营里程碑与信息不对称
        blocks:
          - type: paragraph
            body: >-
              Turntide 的运营主线围绕轴向磁通电机与专用高压储能系统建立 Tier-1 OEM 合作。2025 年底，公司管理层通报在机器人、船舶及商业机械领域斩获 30 多家新客户以及 15 家轴向磁通电机净增
              OEM 客户，称 5 年期潜在储备订单机会超过 $300M。已确认的工业客户与合作伙伴包括采购城际列车电池系统的 Hitachi Rail、JCB、Milrem Robotics，以及 2026 年与 Spark
              Minda（Minda Corporation）在印度组建的重大动力总成制造合资企业。尽管公布了这些商业进展，关键基本面指标仍全然不透明：Turntide 从未公开披露过 GAAP
              收入、年经常性收入（ARR）、毛利率、现金烧钱速度或可用流动资金余额。对机构尽调而言，财务数据大面积隐秘，要求分析师在取得经审计的独立核实前，将所有营收预测仅视为推测性的公司口径主张。
            claimRefs:
