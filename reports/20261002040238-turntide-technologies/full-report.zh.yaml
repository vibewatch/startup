      - number: '6.2'
        title: 落地推进态势与实名量产证据
        blocks:
          - type: paragraph
            body: >-
              Turntide 公开可见的客户落地证据在宏观营销口径与具体合同级量产规模之间呈现出剧烈分化 [CU001, CU004, CU008]。公司官方渠道及合作伙伴联合案例宣称，Turntide 技术在全球已集成至
              30 多万辆（over 300,000）电动汽车、5,000 栋商业建筑及 1,000 座乳品养殖场 [CU001]。然而，上述醒目宣传数据缺乏关于经常性软件
              ARR、硬件出货量、车队实际稼动率或安装后客户留存率的公开披露 [CU011]。具体的客户实证主要靠少数几家 Tier-1 工业客户支撑 [CU004, CU008,
              CU009]。在铁路客运领域，Turntide 斩获 Hitachi Rail 的首期电池生产合同，为英国 Arriva 旗下的 Grand Central 城际客车队供应高压牵引电池，替代既有列车编组中的
              600 多台柴油内燃发动机 [CU004]。在商业地产领域，富国银行（Wells Fargo）的企业级试点评估验证了采用 Turntide 开关磁阻电机改造暖通空调风机后，节能比例达 70% 至 80%
              [CU008]。早期投资方的新闻稿也曾提及 JLL、XNRGY 及重型设备制造商 JCB 等工业机构的实名商业评估
              [CU009]。尽管如此，由于缺乏针对客户群体的公开披露数据、续约率及经过验证的全车队部署统计，长期的客户终身价值（LTV）仍未经规模化验证 [CU011]。
