company:
  name: "Turntide Technologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Turntide Technologies has pivoted from building automation and switched reluctance motors toward industrial electrification, axial flux powertrains, and rail battery systems. While the company achieved a $1B+ unicorn valuation in 2022 after raising $485M in cumulative capital, subsequent operational retrenchment—including 2022 layoffs, executive churn, the divestiture of its building automation division to BrainBox AI in 2024, and a May 2026 Series D-2 down-round at an $83.8M valuation—marks a severe corporate restructuring."
sections:
  - id: "corporate-identity-and-pivot"
    title: "Corporate Identity, Founding History, and Strategic Realignment"
    body: "Founded in 2013 under the name Software Motor Company by Piyush Desai, Mark Johnston, and Trevor Creary, Turntide Technologies originally established its brand on patented switched reluctance Smart Motor Systems paired with cloud building automation controls. Headquartered in Sunnyvale, California, with primary executive operations centered in Alpharetta, Georgia, the company marketed its high-efficiency motor technology across agriculture, built environment HVAC, and commercial equipment. However, the macro shift following 2022 forced an aggressive corporate restructuring. Turntide completed layoffs in the second half of 2022, witnessed the departure of co-founder and long-time CEO Ryan Morris in October 2023, and appointed interim CEO Mark Cox before bringing on Steve Hornyak as permanent Chief Executive Officer. In May 2024, Turntide sold its core Automation Division—encompassing over 1,900 connected customer buildings—to Montreal-based BrainBox AI. This pivotal divestiture marked a decisive operational exit from building energy management, redirecting Turntide's engineering and manufacturing focus toward axial flux motors, power electronics, and high-voltage rail battery systems."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "executive-governance-and-leadership"
    title: "Executive Leadership, Governance, and Key-Person Exposure"
    body: "Turntide's current executive bench reflects its strategic pivot toward commercial mobility, off-highway machinery, and rail transit electrification. Chief Executive Officer Steve Hornyak oversees a senior management team comprised of Chief Commercial Officer Brad Bell, Chief Financial Officer Nick Carr, General Counsel Chris Turner, VP of Engineering Adam Nixon, VP of Global Operations David Orgill, VP of Product George Paterson, VP of Partnerships Ryan Grodzki, and regional commercial leaders. The complete turnover of the original founder group—including the exit of former CEO Ryan Morris in late 2023—substantially eliminates founder-control risks but heightens key-person execution dependency on Hornyak and Nixon to commercialize the axial flux powertrain portfolio. International manufacturing and delivery rely heavily on the leadership of regional managing directors, notably Pradumna Walimbe in APAC as Turntide establishes its 51/49 powertrain joint venture with Minda Corporation in India, and Gareth Littlewood in EMEA overseeing UK rail and off-highway production."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-down-round"
    title: "Capitalization History, Investor Base, and Severe Valuation Down-Round"
    body: "Between 2018 and 2022, Turntide raised $485M in cumulative equity financing from prominent institutional and corporate climate syndicates, including Breakthrough Energy Ventures, Amazon Climate Pledge Fund, Canada Pension Plan Investment Board, BMW i Ventures, Fifth Wall, JLL Spark, and OGCI Climate Investments. In June 2022, Turntide announced an $80M equity financing round led by OGCI Climate Investments and SDCL Energy Efficiency Income Trust (SEEIT), claiming unicorn status with a post-money valuation surpassing $1B. However, following the tech downturn, organizational downsizing, and building automation divestment, Turntide's capitalization structure endured extreme dilution and multiple recapitalization rounds. Secondary transaction data and structured equity filings tracked by Forge Global show an intermediate June 2023 recapitalization ($57.54M Series D-1 at a $0.46 share price with a 1.5x liquidation preference, alongside a $31.41M Junior Series), followed by a severe May 2026 Series D-2 round raising $26.2M at $0.09 per share. The May 2026 transaction implied an $83.83M post-money valuation—representing a 91.6% collapse from its 2022 peak mark and indicating heavy restructuring of equity preferences."
    claimRefs:
      - "CO005"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "commercial-scale-and-diligence-gaps"
    title: "Commercial Trajectory, Operational Milestones, and Information Asymmetries"
    body: "Turntide's operational trajectory centers on establishing Tier-1 OEM partnerships for axial flux motors and specialized high-voltage energy storage. In late 2025, company management reported securing over 30 new customer accounts and 15 net new axial flux motor OEMs across robotics, marine, and commercial machinery, citing potential pipeline opportunities exceeding $300M over five years. Confirmed industrial accounts and partners include Hitachi Rail for intercity train battery systems, JCB, Milrem Robotics, and a major 2026 Indian powertrain manufacturing joint venture with Spark Minda (Minda Corporation). Despite these commercial announcements, critical fundamental metrics remain completely opaque: Turntide has never publicly reported GAAP revenue, annual recurring revenue (ARR), gross profit margins, cash burn rate, or available liquidity balances. For institutional diligence, this extensive financial concealment necessitates treating top-line projections as speculative company claims pending verified audit verification."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
callouts:
  - calloutType: risk
    title: "Severe Equity Recapitalization and 91.6% Valuation Drawdown"
    body: "Secondary venture records and private placement filings reveal that Turntide's post-money valuation dropped from $1.0B+ in June 2022 to $83.83M in May 2026 under a Series D-2 financing priced at $0.09 per share. Earlier junior equity tranches face heavy liquidation preference overhangs."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
  - calloutType: insight
    title: "Strategic Specialization via Asset Divestiture"
    body: "The May 2024 sale of Turntide's building automation business to BrainBox AI successfully eliminated multi-building software overhead, enabling the remaining business to concentrate capital and manufacturing assets squarely on axial flux propulsion and heavy-duty battery storage."
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO014"
