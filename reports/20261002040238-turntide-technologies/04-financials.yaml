    columns: [Pricing input, Public value, Confidence, Why it matters, Required evidence]
    rows:
      - [List price, null, "Unavailable", "Sets the visible starting point but not realized revenue", "Current SKU price list and regional price books"]
      - [Realized average selling price, null, "Unavailable", "Needed to connect shipments to recognized revenue", "Invoice-level ASP by product family, region, and customer cohort"]
      - [Contract and payment structure, null, "Unavailable", "Determines timing, backlog quality, and working-capital exposure", "Representative OEM and customer contracts with payment, acceptance, cancellation, and warranty terms"]
      - [Discounts and channel economics, null, "Unavailable", "Affects net price, contribution margin, and partner incentives", "Discount waterfall, channel rebates, commissions, and partner-margin schedule"]
      - [Revenue recognition, null, "Unavailable", "Distinguishes shipment, milestone, acceptance, and service revenue", "Audited revenue-recognition policy and deferred-revenue roll-forward"]
    notes: "Null means no value was disclosed in the retained public sources; it does not mean the economic item is zero or inapplicable."
    claimRefs: [CI010, CI015]
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns: [Metric, Public value, Confidence, Underwriting significance, Diligence ask]
    rows:
      - [Consolidated revenue or ARR, null, "Unavailable", "Prevents scale and growth assessment; the subsidiary revenue band is not consolidated", "Provide three years of audited consolidated revenue by product, customer, and geography"]
      - [Gross margin and contribution margin, null, "Unavailable", "Prevents assessment of manufacturing leverage and service burden", "Provide product-level gross margin bridges including materials, labor, warranty, freight, and support"]
      - ["CAC, sales cycle, and payback", null, "Unavailable", "Prevents sales-efficiency assessment for direct and partner-led programs", "Provide funnel cohorts, fully loaded acquisition cost, cycle length, and payback by route to market"]
      - ["Cash, debt, burn, and runway", null, "Unavailable", "Prevents capital-adequacy and next-round timing assessment", "Provide current cash, restricted cash, debt, monthly burn, covenant headroom, and base/downside runway"]
      - ["Project SUPREME funding split", "£17M matched-funded project; exact grant and company contributions undisclosed", "Medium; company-issued and subject to approval", "Matched funding may create co-investment and execution obligations", "Provide award letter, approval status, draw schedule, matching contribution, milestones, and clawbacks"]
      - ["May 2026 Series D-2 financing", "$26.2M raised; $83.83M post-money valuation reported by Forge", "Medium; third-party data requires primary confirmation", "Signals financing access but not remaining liquidity or operating performance", "Provide certificate of incorporation, cap table, cash receipt, use-of-funds plan, and pro forma runway"]
    notes: "Financing amounts and project values are not cash balances; Forge data is unaudited, and the £17M project remains subject to government approval."
    claimRefs: [CI003, CI005, CI006, CI007, CI008, CI015, CI016]
