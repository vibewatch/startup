schemaVersion: "report-v2"
artifact: financials
slug: turntide-technologies
runDate: 2026-10-02
company:
  name: Turntide Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Turntide has visible product breadth and continuing access to project and equity capital, but
    the retained public record does not disclose consolidated revenue, pricing, gross margin,
    cash, burn, or runway. A sharply lower 2026 financing valuation reported by Forge makes the
    missing operating and liquidity data a material underwriting blocker rather than a routine
    private-company disclosure gap.
sections:
  - id: revenue-model-and-sales-motion
    title: Revenue model and sales motion
    body: >-
      Turntide presents itself as a manufacturer of electric motors, power electronics, and energy
      storage, with an end-to-end engagement model that runs from customer engineering through
      production and ongoing support. Those surfaces support several plausible revenue streams:
      component or system sales, integration engineering, and continuing support. They do not,
      however, disclose whether these streams are sold separately, bundled into programs, priced
      per unit, or recognized over time. The 2021 company release claimed named retrofit deployments
      and a 64% average reduction in HVAC motor energy consumption, which is evidence of an economic
      value proposition but not evidence of realized price, revenue, margin, repeat purchasing, or
      customer concentration. The investable revenue model therefore remains a product-led,
      engineering-intensive hypothesis rather than a quantified financial profile.
    claimRefs: [CI009, CI010, CI014, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing and unit economics
    body: >-
      No retained source supplies list pricing, realized pricing, contract duration, discounts,
      warranty economics, revenue-recognition policy, consolidated revenue, or gross margin. Tracxn
      does show a £10 million to £50 million revenue band for the separate legal entity Turntide
      Transport Limited as of December 31, 2024, but that subsidiary-level range cannot be treated
      as Turntide Technologies consolidated revenue or ARR. Public customer-energy savings also
      cannot be converted into supplier revenue without contract terms and sharing economics.
      Sales-cycle length, CAC, payback, channel fees, backlog conversion, utilization, working
      capital, and service-delivery cost are likewise unavailable. The result is not a low-margin
      conclusion; it is an inability to estimate unit economics without a management data pack.
    claimRefs: [CI008, CI014, CI015]
    tableRefs: [TI002]
  - id: capital-needs-and-financing-dependency
    title: Capital needs and financing dependency
    body: >-
      Available evidence points to a capital-intensive scale-up. Reuters reported an $80 million
      2022 round that brought total equity funding to $485 million and was intended partly for U.S.
      manufacturing and technology development. In 2026, Turntide described Project SUPREME as a
      £17 million matched-funded project, subject to government approval, focused on automating
      labor-intensive motor-production steps and expanding facilities through January 2028. Forge
      separately reported a $26.2 million Series D-2 financing on May 7, 2026 at an $83.83 million
      post-money valuation. These amounts are financing and project values, not cash on hand.
      Recruiting, benefits, and a four-country operating footprint add visible organizational
      commitments, while public cash, debt, burn, working capital, and runway remain undisclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI011, CI012, CI013, CI016]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict
    body: >-
      The financial evidence is adverse on transparency and financing trajectory, not conclusive on
      operating performance. Forge reports a May 2026 post-money valuation far below the $825.86
      million post-money valuation it reports for June 2023 financings; it also reports a 1.5x
      liquidation preference and 8% dividend rate for the 2023 Series D-1. Forge cautions that its
      private-company data may rely on limited inputs and is not audited or independently verified,
      so these figures require primary-document confirmation. Even with that caveat, a new investor
      cannot responsibly infer capital adequacy from cumulative funding raised or a conditional
      matched-funded project. Underwriting should remain blocked pending consolidated financials,
      cash and debt schedules, monthly burn and runway, backlog conversion, gross-margin bridges,
      and security-level capitalization documents.
    claimRefs: [CI005, CI006, CI007, CI008, CI015, CI016]
