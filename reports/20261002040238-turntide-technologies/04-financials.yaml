callouts:
  - calloutType: risk
    title: Funding raised is not runway
    body: >-
      Public financing and matched-project values show capital access, but without cash, burn, debt,
      covenants, and committed co-investment they cannot establish present liquidity or runway.
    claimRefs: [CI001, CI003, CI005, CI016]
