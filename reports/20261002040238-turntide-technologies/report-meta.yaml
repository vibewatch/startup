companyProfile:
  summary: >-
    Turntide Technologies is a late-stage private electrification hardware company founded in 2013 as Software Motor
    Company. The business has pivoted from building automation into axial-flux motors, power electronics, and
    high-voltage rail battery systems for industrial, commercial vehicle, and off-highway OEMs. The retained record
    shows substantial cumulative funding, a 2024 divestiture of the automation division, and a May 2026 Series D-2 reset
    to an $83.83M post-money mark, but it still does not disclose public financials.
