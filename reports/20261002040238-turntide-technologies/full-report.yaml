figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Milestone trajectory tracking Turntide's formation, hyper-growth unicorn capitalization, operational
      restructuring, and strategic pivot toward industrial and rail electrification.
    data:
      items:
        - label: '2013: Corporate Inception'
          date: '2013-01-01'
          detail: >-
            Founded as Software Motor Company by Desai, Johnston, and Creary to develop switched reluctance smart
            motors.
          tone: neutral
        - label: '2021: Growth Capital Expansion'
          date: '2021-03-01'
          detail: Secures major backing from Breakthrough Energy Ventures, Amazon, and CPPIB to scale smart motor systems.
          tone: positive
        - label: '2022-06: Unicorn Status Peak'
          date: '2022-06-15'
          detail: Secures $80M equity round at a $1.0B+ valuation from OGCI and SEEIT, reaching $485M in cumulative funding.
          tone: positive
        - label: '2022-H2: Restructuring & Layoffs'
          date: '2022-09-01'
          detail: Initiates workforce reductions and operational cost-cutting amid macro tech retrenchment.
          tone: negative
        - label: '2023-06: Series D-1 Recapitalization'
          date: '2023-06-27'
          detail: Raises $57.5M Series D-1 at $0.46/share with 1.5x liquidation preference at an $825.9M valuation.
          tone: warning
        - label: '2023-10: Founder CEO Departure'
          date: '2023-10-15'
          detail: Co-founder and CEO Ryan Morris departs; interim executive leadership installed under Mark Cox.
          tone: negative
        - label: '2024-05: Divestiture to BrainBox AI'
          date: '2024-05-29'
          detail: >-
            Sells building Automation Division (1,900+ connected buildings) to BrainBox AI, pivoting fully to vehicle
            electrification.
          tone: warning
        - label: '2025-10: Commercial OEM Expansion'
          date: '2025-10-21'
          detail: Reports 30+ new customer accounts and 15+ axial flux OEMs under permanent CEO Steve Hornyak.
          tone: positive
        - label: '2026-03: India Powertrain JV Agreement'
          date: '2026-03-10'
          detail: Signs 51/49 joint venture with Minda Corporation to manufacture EV and hybrid powertrain systems in India.
          tone: positive
        - label: '2026-05: Series D-2 Down-Round'
          date: '2026-05-07'
          detail: Completes $26.2M Series D-2 down-round at $0.09/share, marking valuation down to $83.83M.
          tone: negative
    approximationNotes: >-
      Timeline events reflect verified public dates from corporate announcements, M&A press releases, and Forge Global
      financing disclosures.
