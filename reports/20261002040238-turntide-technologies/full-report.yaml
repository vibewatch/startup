      - number: '1.4'
        title: Commercial Trajectory, Operational Milestones, and Information Asymmetries
        blocks:
          - type: paragraph
            body: >-
              Turntide's operational trajectory centers on establishing Tier-1 OEM partnerships for axial flux motors
              and specialized high-voltage energy storage. In late 2025, company management reported securing over 30
              new customer accounts and 15 net new axial flux motor OEMs across robotics, marine, and commercial
              machinery, citing potential pipeline opportunities exceeding $300M over five years. Confirmed industrial
              accounts and partners include Hitachi Rail for intercity train battery systems, JCB, Milrem Robotics, and
              a major 2026 Indian powertrain manufacturing joint venture with Spark Minda (Minda Corporation). Despite
              these commercial announcements, critical fundamental metrics remain completely opaque: Turntide has never
              publicly reported GAAP revenue, annual recurring revenue (ARR), gross profit margins, cash burn rate, or
              available liquidity balances. For institutional diligence, this extensive financial concealment
              necessitates treating top-line projections as speculative company claims pending verified audit
              verification.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Equity Recapitalization and 91.6% Valuation Drawdown
            body: >-
              Secondary venture records and private placement filings reveal that Turntide's post-money valuation
              dropped from $1.0B+ in June 2022 to $83.83M in May 2026 under a Series D-2 financing priced at $0.09 per
              share. Earlier junior equity tranches face heavy liquidation preference overhangs.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
              - CO011
          - type: callout
            title: Strategic Specialization via Asset Divestiture
            body: >-
              The May 2024 sale of Turntide's building automation business to BrainBox AI successfully eliminated
              multi-building software overhead, enabling the remaining business to concentrate capital and manufacturing
              assets squarely on axial flux propulsion and heavy-duty battery storage.
            calloutType: insight
            claimRefs:
              - CO002
              - CO005
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Segmentation, and Structural Realignment
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies operates within the global commercial vehicle electrification and industrial
              powertrain market, specializing in high-torque axial-flux electric motors, low- and high-voltage motor
              controllers, and transport battery systems [CM001]. The company historically targeted commercial building
              energy efficiency through its Smart Motor System and IoT automation suite. However, this addressable
              footprint contracted materially following BrainBox AI's acquisition of Turntide's Automation Division,
              transferring operations across more than 1,900 connected buildings [CM002]. Consequently, Turntide's core
              market is now explicitly bounded by transport and heavy-duty industrial powertrain applications, excluding
              building management systems and building-level HVAC optimization software [CM003]. In heavy transport,
              OEMs seek high-power-density powertrains capable of fitting space-constrained chassis without sacrificing
              payload capacity [CM004]. Conversely, in emerging high-volume markets such as India, demand centers on
              low-voltage architectures for two-, three-, and light four-wheel mobility [CM005]. Status-quo alternatives
              remain entrenched, dominated by conventional radial-flux induction and permanent-magnet motors, as well as
              legacy internal combustion engines [CM006].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Addressable Market Sizing, Geographic Dynamics, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Evaluating Turntide's total addressable demand requires distinct segmentation across its operating
              business units rather than a single broad climate-tech figure. While third-party market estimates project
              commercial building automation spend to expand from $87.3 billion in 2022 to $168.8 billion by 2031 at a
              7.9% CAGR, Turntide no longer captures direct value from this segment following its corporate divestment
              [CM007]. Instead, Turntide's primary growth lenses center on axial-flux motor manufacturing and regional
              light-mobility powertrains [CM008]. In the UK and Europe, axial-flux adoption is supported by
              industrialization scale-up initiatives, including the £17 million matched-funding Project SUPREME under
              the UK Government's DRIVE35 program extending through January 2028 [CM009]. In South Asia, high-volume
              electrification is driven by lower operating costs, where electric three-wheelers operate at INR 1.28 per
              kilometer versus INR 3.21 per kilometer for gasoline [CM010]. Monthly Indian EV registrations reached
              234,000 units in late 2025, validating commercial scale in lightweight mobility [CM011]. However, a total
              consolidated TAM/SAM/SOM cannot be independently calculated due to Turntide's non-disclosure of commercial
              shipment volumes and pricing tiers [CM012].
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM007
              - CM009
      - number: '2.3'
        title: Buyer Segmentation, Procurement Ownership, and Industrialization Constraints
        blocks:
          - type: paragraph
            body: >-
              Purchasing decisions for Turntide's electrification products involve two distinct procurement personas
              with disparate decision criteria and budget ownership [CM013]. Commercial vehicle and rail OEMs evaluate
              axial-flux motors, inverters, and battery systems based on gravimetric power density, thermal packaging,
              and manufacturing validation [CM014]. In contrast, light-mobility OEMs and Tier 1 partners in
              cost-sensitive regional markets prioritize unit economics, supply-chain localization, and regulatory
              compliance [CM015]. Significant headwinds govern industry-wide adoption: axial-flux motor architectures
              have historically suffered from complex, labor-intensive manufacturing processes, including precision coil
              winding and specialized component tooling, making high-volume production cost-prohibitive [CM016]. These
              manufacturing constraints require continuous joint ventures, localized supply-chain partnerships, and
              state grant co-funding to achieve competitive scale [CM014].
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Divestiture Boundary Contraction
            body: >-
              Turntide's market opportunity has materially narrowed from broad smart-building decarbonization to
              precision vehicular electrification following the sale of its Automation Division to BrainBox AI.
              Diligence must evaluate the company strictly as a specialty powertrain hardware and electronics supplier.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: Axial-Flux Manufacturing Scalability Bottleneck
            body: >-
              Despite superior power and torque density, axial-flux motors have faced widespread industrial adoption
              barriers due to complex, expensive manufacturing processes. Turntide's commercial success depends heavily
              on automating stator winding and assembly under its 18-month Project SUPREME grant program.
            calloutType: risk
            claimRefs:
              - CM009
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Across Powertrain and Industrial Electrification
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding Turntide Technologies spans multiple distinct technology boundaries and
              equipment classes, dividing primarily into established Tier-1 automotive and industrial conglomerates,
              specialized high-performance axial-flux motor developers, and legacy AC induction or permanent magnet
              status-quo equipment manufacturers [CP001, CP002, CP008]. Historically founded in 2013 as Software Motor
              Corporation (SMC), Turntide entered the efficiency market by developing software-controlled switched
              reluctance motors (SRMs) designed to displace standard AC induction motors in building HVAC, commercial
              refrigeration, and dairy ventilation systems without relying on rare-earth permanent magnets [CP001,
              CP003, CP004]. However, through aggressive acquisitions in June 2021—including BorgWarner's Gateshead
              drivetrain operations, battery pack specialist Hyperdrive, and motor control firm AVID Technology—Turntide
              expanded directly into off-highway, commercial transport, and rail powertrain electrification [CP001,
              CP002, CP005]. This pivot placed Turntide into direct technological and commercial competition against
              massive global component suppliers such as BorgWarner, Bosch, Dana, and Danfoss Editron, who possess
              entrenched global distribution, multi-billion-dollar R&D budgets, and decades-long OEM supplier
              relationships [CP001, CP002]. Concurrently, in high-torque-density axial-flux propulsion, specialized
              players such as YASA (acquired by Mercedes-Benz in 2021) and Saietta set high technical benchmarks for
              high-voltage power density, while industrial incumbents like Siemens, ABB, and WEG dominate traditional
              commercial building automation and fan retrofits [CP001, CP002, CP005]. Turntide's product scope attempts
              to span both vehicle propulsion and industrial systems, creating multi-front competitive pressure across
              disparate customer buying centers [CP002, CP005, CP009].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP013
      - number: '3.2'
        title: Capability Comparison, Channel Power, and GTM Positioning
        blocks:
          - type: paragraph
            body: >-
              Evaluating Turntide against direct competitors and incumbent equipment providers reveals significant
              technological and commercial trade-offs across capability, pricing models, and distribution channels
              [CP002, CP006, CP008, CP011]. In specialized propulsion, Turntide's axial-flux motors deliver ultra-high
              torque density in compact form factors, tailored for commercial vehicle hybrid applications, electrified
              power take-off (ePTO), and auxiliary drivetrains where chassis packaging space is strictly constrained
              [CP002, CP011]. To bridge the distribution and localization gap against domestic incumbents, Turntide
              executed a strategic joint venture in 2026 with Spark Minda's flagship entity, Minda Corporation, securing
              a 51% controlling stake in an Indian special purpose vehicle designed to manufacture and commercialize
              localized high-voltage motors, motor controllers, and thermal pumps for domestic electric and hybrid
              commercial platforms [CP006, CP007]. This asset-light partnership strategy enables Turntide to access OEM
              supply chains in high-growth developing markets without shouldering the full capital expenditure of
              greenfield manufacturing plants [CP006, CP007]. In contrast, large industrial conglomerates like Danfoss,
              Bosch, and BorgWarner leverage existing Tier-1 supply relationships, extensive master service agreements,
              and bundled volume discounting that startups cannot easily match [CP001, CP006]. While Turntide provides
              integrated powertrain kits encompassing motors, inverters, and battery storage modules, its commercial
              pricing transparency remains opaque, requiring bilateral non-disclosure agreements and customized
              engineering statements of work that slow enterprise adoption cycles [CP002, CP008, CP010].
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP010
              - CP012
      - number: '3.3'
        title: Switching Costs, Supply Chain Risks, and Long-Term Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The durability of Turntide's competitive moat depends on architectural switching costs, intellectual
              property defenses, and long-term capital adequacy [CP001, CP009, CP012, CP013, CP014]. In commercial
              automotive, rail, and off-highway sectors, customer switching costs are exceptionally high once an
              electric drive unit or battery management system is engineered into an OEM chassis architecture [CP002,
              CP005]. Qualification, rigorous thermal safety testing, ISO compliance audits, and functional safety
              validations (such as ISO 26262 and UKAS-accredited BSI frameworks) typically require 18 to 36 months of
              pre-production engineering lead time [CP005, CP008, CP012]. Furthermore, Turntide mandates comprehensive
              supplier compliance across its supply network via its formalized Supplier Code of Conduct, mitigating
              supply chain governance and labor liability risks across global manufacturing nodes [CP012]. However, this
              architectural lock-in cuts both ways: winning production programs away from entrenched incumbents like
              BorgWarner or Danfoss requires overcoming identical multi-year qualification barriers [CP001, CP002,
              CP005]. Additionally, adverse private market data indicates that Turntide's financial capitalization has
              faced severe stress [CP013, CP014]. After raising $80 million in June 2022 at a headline unicorn valuation
              exceeding $1 billion, secondary market valuation estimates from Forge Global indicated a Series D-2
              valuation mark of $83.83 million by May 2026—representing an adverse secondary valuation contraction of
              over 90% from peak levels [CP013, CP014]. Such steep capitalization pressures create significant
              counterparty credit risk for major OEMs evaluating multi-decade vehicle production platforms against
              well-capitalized public competitors [CP006, CP013, CP014].
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Tier-1 Incumbent Scale and Counterparty Credit Risk
            body: >-
              Turntide's most acute competitive headwind stems not from motor electromagnetic performance, but from
              counterparty credit risk and balance sheet asymmetry. Global commercial vehicle and rail OEMs commit to
              vehicle architectures spanning 10 to 15 years of production and spare parts availability. Incumbents like
              BorgWarner and Bosch possess investment-grade balance sheets that guarantee warranty coverage, recall
              indemnities, and uninterrupted multi-plant supply. In contrast, Turntide's May 2026 secondary market
              valuation mark of $83.83 million on Forge Global highlights severe capital compression that amplifies OEM
              supplier viability concerns.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP013
              - CP014
          - type: callout
            title: Joint Venture Localization as a Strategic Market Entry Wedge
            body: >-
              Turntide's 51/49 joint venture agreement with Minda Corporation in India represents a viable strategic
              blueprint for competing against entrenched global Tier-1 suppliers. By partnering with Spark Minda's
              established automotive components manufacturing and distribution infrastructure, Turntide sidesteps severe
              greenfield capex requirements while meeting local sourcing mandates for high-growth commercial EV and
              hybrid platforms in South Asia.
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and sales motion
        blocks:
          - type: paragraph
            body: >-
              Turntide presents itself as a manufacturer of electric motors, power electronics, and energy storage, with
              an end-to-end engagement model that runs from customer engineering through production and ongoing support.
              Those surfaces support several plausible revenue streams: component or system sales, integration
              engineering, and continuing support. They do not, however, disclose whether these streams are sold
              separately, bundled into programs, priced per unit, or recognized over time. The 2021 company release
              claimed named retrofit deployments and a 64% average reduction in HVAC motor energy consumption, which is
              evidence of an economic value proposition but not evidence of realized price, revenue, margin, repeat
              purchasing, or customer concentration. The investable revenue model therefore remains a product-led,
              engineering-intensive hypothesis rather than a quantified financial profile.
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI010
              - CI015
      - number: '4.2'
        title: Pricing and unit economics
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies list pricing, realized pricing, contract duration, discounts, warranty
              economics, revenue-recognition policy, consolidated revenue, or gross margin. Tracxn does show a £10
              million to £50 million revenue band for the separate legal entity Turntide Transport Limited as of
              December 31, 2024, but that subsidiary-level range cannot be treated as Turntide Technologies consolidated
              revenue or ARR. Public customer-energy savings also cannot be converted into supplier revenue without
              contract terms and sharing economics. Sales-cycle length, CAC, payback, channel fees, backlog conversion,
              utilization, working capital, and service-delivery cost are likewise unavailable. The result is not a
              low-margin conclusion; it is an inability to estimate unit economics without a management data pack.
            claimRefs:
              - CI008
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI010
              - CI015
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Available evidence points to a capital-intensive scale-up. Reuters reported an $80 million 2022 round that
              brought total equity funding to $485 million and was intended partly for U.S. manufacturing and technology
              development. In 2026, Turntide described Project SUPREME as a £17 million matched-funded project, subject
              to government approval, focused on automating labor-intensive motor-production steps and expanding
              facilities through January 2028. Forge separately reported a $26.2 million Series D-2 financing on May 7,
              2026 at an $83.83 million post-money valuation. These amounts are financing and project values, not cash
              on hand. Recruiting, benefits, and a four-country operating footprint add visible organizational
              commitments, while public cash, debt, burn, working capital, and runway remain undisclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI011
              - CI012
              - CI013
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
              - CI016
      - number: '4.4'
        title: Underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The financial evidence is adverse on transparency and financing trajectory, not conclusive on operating
              performance. Forge reports a May 2026 post-money valuation far below the $825.86 million post-money
              valuation it reports for June 2023 financings; it also reports a 1.5x liquidation preference and 8%
              dividend rate for the 2023 Series D-1. Forge cautions that its private-company data may rely on limited
              inputs and is not audited or independently verified, so these figures require primary-document
              confirmation. Even with that caveat, a new investor cannot responsibly infer capital adequacy from
              cumulative funding raised or a conditional matched-funded project. Underwriting should remain blocked
              pending consolidated financials, cash and debt schedules, monthly burn and runway, backlog conversion,
              gross-margin bridges, and security-level capitalization documents.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding raised is not runway
            body: >-
              Public financing and matched-project values show capital access, but without cash, burn, debt, covenants,
              and committed co-investment they cannot establish present liquidity or runway.
            calloutType: risk
            claimRefs:
              - CI001
