chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Strategic Realignment
        blocks:
          - type: paragraph
            body: >-
              Founded in 2013 under the name Software Motor Company by Piyush Desai, Mark Johnston, and Trevor Creary,
              Turntide Technologies originally established its brand on patented switched reluctance Smart Motor Systems
              paired with cloud building automation controls. Headquartered in Sunnyvale, California, with primary
              executive operations centered in Alpharetta, Georgia, the company marketed its high-efficiency motor
              technology across agriculture, built environment HVAC, and commercial equipment. However, the macro shift
              following 2022 forced an aggressive corporate restructuring. Turntide completed layoffs in the second half
              of 2022, witnessed the departure of co-founder and long-time CEO Ryan Morris in October 2023, and
              appointed interim CEO Mark Cox before bringing on Steve Hornyak as permanent Chief Executive Officer. In
              May 2024, Turntide sold its core Automation Division—encompassing over 1,900 connected customer
              buildings—to Montreal-based BrainBox AI. This pivotal divestiture marked a decisive operational exit from
              building energy management, redirecting Turntide's engineering and manufacturing focus toward axial flux
              motors, power electronics, and high-voltage rail battery systems.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
