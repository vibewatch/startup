      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Turntide's current executive bench reflects its strategic pivot toward commercial mobility, off-highway
              machinery, and rail transit electrification. Chief Executive Officer Steve Hornyak oversees a senior
              management team comprised of Chief Commercial Officer Brad Bell, Chief Financial Officer Nick Carr,
              General Counsel Chris Turner, VP of Engineering Adam Nixon, VP of Global Operations David Orgill, VP of
              Product George Paterson, VP of Partnerships Ryan Grodzki, and regional commercial leaders. The complete
              turnover of the original founder group—including the exit of former CEO Ryan Morris in late
              2023—substantially eliminates founder-control risks but heightens key-person execution dependency on
              Hornyak and Nixon to commercialize the axial flux powertrain portfolio. International manufacturing and
              delivery rely heavily on the leadership of regional managing directors, notably Pradumna Walimbe in APAC
              as Turntide establishes its 51/49 powertrain joint venture with Minda Corporation in India, and Gareth
              Littlewood in EMEA overseeing UK rail and off-highway production.
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO008
              - CO014
      - number: '1.3'
        title: Capitalization History, Investor Base, and Severe Valuation Down-Round
        blocks:
          - type: paragraph
            body: >-
              Between 2018 and 2022, Turntide raised $485M in cumulative equity financing from prominent institutional
              and corporate climate syndicates, including Breakthrough Energy Ventures, Amazon Climate Pledge Fund,
              Canada Pension Plan Investment Board, BMW i Ventures, Fifth Wall, JLL Spark, and OGCI Climate Investments.
              In June 2022, Turntide announced an $80M equity financing round led by OGCI Climate Investments and SDCL
              Energy Efficiency Income Trust (SEEIT), claiming unicorn status with a post-money valuation surpassing
              $1B. However, following the tech downturn, organizational downsizing, and building automation divestment,
              Turntide's capitalization structure endured extreme dilution and multiple recapitalization rounds.
              Secondary transaction data and structured equity filings tracked by Forge Global show an intermediate June
              2023 recapitalization ($57.54M Series D-1 at a $0.46 share price with a 1.5x liquidation preference,
              alongside a $31.41M Junior Series), followed by a severe May 2026 Series D-2 round raising $26.2M at $0.09
              per share. The May 2026 transaction implied an $83.83M post-money valuation—representing a 91.6% collapse
              from its 2022 peak mark and indicating heavy restructuring of equity preferences.
            claimRefs:
              - CO005
              - CO009
              - CO010
              - CO011
              - CO012
