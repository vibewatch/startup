  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product lines and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Turntide's public product surface describes a component-to-system offer rather than a single motor SKU.
              The company says it designs motors, power electronics, energy storage, and thermal equipment; the reviewed
              pages then identify axial-flux motors, an electric drive unit (EDU), hybrid propulsion configurations, and
              an electric power take-off (ePTO) system. In customer workflow terms, the EDU combines propulsion
              components that an OEM would otherwise source and validate separately, while the ePTO powers stationary
              work functions without running the vehicle engine. The hybrid page addresses series and parallel
              architectures for duty cycles where full battery electrification is constrained. This breadth may reduce
              integration interfaces, but no assigned source discloses current shipment volumes, standard pricing,
              production lead times, or warranty terms for any line.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
