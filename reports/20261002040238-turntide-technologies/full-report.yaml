              - CE006
              - CE007
              - CE008
              - CE013
              - CE015
      - number: '5.2'
        title: Architecture and performance claims
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture centers on stackable axial-flux motors paired with power electronics. Turntide
              describes the EDU as a semi-integrated motor, inverter, and differential, with shared motor-inverter
              cooling, simplified gearing, and separately serviceable components. The company reports nominal power from
              73 kW to 220 kW and peak power from 300 kW to 700 kW for EDU motor configurations at 400 volts and above.
              A supplier-authored AF430S listing adds peak power and torque density figures at 800 VDC, plus liquid
              cooling, voltage, environmental-test, and ingress-protection claims. These specifications are useful
              design inputs, not verified comparative benchmarks: the two pages repeating the 53% torque-density, 58%
              size, and 37% weight comparison originate from the same company release and disclose neither test protocol
              nor baseline configuration.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE009
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE016
      - number: '5.3'
        title: Maturity, deployment, and serviceability
        blocks:
          - type: paragraph
            body: >-
              Product maturity is mixed across the reviewed evidence. The AF430S had a detailed supplier-authored
              product listing in April 2025, whereas the integrated EDU was announced for unveiling at CONEXPO in March
              2026 and was again presented in a paid September 2026 release around IAA Transportation. Turntide also
              reports more than 600 miles of desert running in a purpose-built Sierra Echo-R and says the EDU completed
              that event without issues. This is relevant prototype validation under vibration, load, dust, and heat,
              but it is not a substitute for independent endurance results, production-fleet operating hours, warranty
              data, or failure-rate distributions. Separately serviceable EDU components could reduce repair scope,
              though the public sources provide no service interval, parts availability, diagnostic workflow, or
              mean-time-to-repair evidence.
            claimRefs:
              - CE005
              - CE010
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Quality, security, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Turntide's website states that its systems meet internationally recognized benchmarks and that BSI
              certification accredited by UKAS verifies ISO compliance; the AF430S listing separately claims ISO 16750
              environmental testing and IP67 and IP6K9K ingress ratings. The assigned evidence does not identify the
              website-referenced ISO standards, certificate numbers, certified entities, certification scope, or expiry
              dates. Nor does it document functional-safety analysis, motor-control software architecture, cybersecurity
              controls, incident history, supplier qualification, or battery-safety validation. The careers page
              supplies only a general practitioner signal, and the fetched independent trade-publication page yielded an
              editor biography rather than substantive technical reporting. Technical diligence should therefore verify
              certificates and test reports directly and obtain OEM validation, field telemetry, firmware governance,
              and quality-system evidence before treating the disclosed performance or assurance claims as
              production-proven.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the product thesis
            body: >-
              The differentiation claim is not merely an axial-flux motor geometry; it is the combination of motor,
              inverter, gearing, cooling, and serviceability intended to reduce OEM validation work. That thesis remains
              commercially unquantified because the assigned evidence provides no named series-production OEM,
              integration-cycle baseline, or realized customer economics.
            calloutType: insight
            claimRefs:
              - CE002
              - CE005
              - CE013
              - CE014
          - type: callout
            title: Specification detail exceeds independent proof
            body: >-
              Turntide publishes precise density, efficiency, voltage, ingress, and endurance claims, but the apparent
              external product listing is supplier-authored, the Yahoo item is labeled a paid press release, and the
              fetched Power & Motion page contains no substantive technical article text. Underwriting should treat the
              figures as company claims until test protocols and independent results are reviewed.
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Commercial Structure
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies targets multi-sector electrification opportunities spanning commercial vehicles,
              off-highway industrial machinery, passenger rail, and building operations [CU001, CU002]. Rather than
              operating as an open catalog component distributor, the company sells custom electric motors, high-voltage
              inverters, power electronics, and modular battery systems directly to original equipment manufacturers
              (OEMs) and specialized system integrators [CU002]. In the commercial transportation vertical, Turntide
              provides heavy-duty traction motors, integrated motor controllers, and thermal fluid pumps to vehicle
              builders adapting commercial trucks, construction rigs, and buses for hybrid or fully electric duty cycles
              [CU002, CU005]. In the rail domain, Turntide engineers specialized high-voltage lithium iron phosphate
              (LFP) battery packs, power conversion hardware, and thermal management units specifically configured for
              regional and intercity passenger trainsets [CU004, CU006]. The legacy building automation and agriculture
              operations, originally commercialized under the Smart Motor System brand, delivered switched reluctance
              motors to enterprise real estate owners, regional retail operators, and dairy facilities seeking HVAC
              electricity consumption reductions [CU001, CU008]. Commercial engagements across all segments require deep
              applications engineering collaboration, technical co-development, and joint dyno characterization,
              resulting in extended multi-year procurement evaluation cycles before production contracts materialize
              [CU002, CU003].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
              - CU009
      - number: '6.2'
        title: Adoption Trajectory and Named Production Proof
        blocks:
          - type: paragraph
            body: >-
              Publicly visible adoption evidence for Turntide presents a sharp divergence between aggregated marketing
              figures and concrete, contract-level production volumes [CU001, CU004, CU008]. Promotional literature
              published across company channels and syndicated partner case studies asserts that Turntide technologies
              have been integrated into over 300,000 electric vehicles, 5,000 commercial buildings, and 1,000 dairy
              farms globally [CU001]. However, these headline figures lack public reporting on recurring software ARR,
              hardware unit shipments, active fleet utilization, or post-installation customer retention [CU011].
              Concrete customer validation is anchored by a select group of Tier 1 industrial relationships [CU004,
              CU008, CU009]. In passenger rail, Turntide secured an initial battery production contract from Hitachi
              Rail to supply high-voltage traction batteries for Arriva's Grand Central intercity passenger fleet in the
              United Kingdom, replacing over 600 diesel combustion engines across operating trainsets [CU004]. In
              commercial real estate, enterprise pilot evaluations with Wells Fargo validated energy efficiency
              reductions of 70% to 80% on retrofitted HVAC fan systems using Turntide switched reluctance motors
              [CU008]. Historical sponsor releases have also cited named commercial evaluations with industrial
              organizations including JLL, XNRGY, and heavy equipment manufacturer JCB [CU009]. Nonetheless, the absence
              of public cohort disclosures, renewal rates, or verified fleet-wide deployment statistics leaves long-term
              customer lifetime value unverified [CU011].
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU009
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU008
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Durability, Expansion Loops, and Commercial Risk
        blocks:
          - type: paragraph
            body: >-
              Turntide's commercial expansion strategy relies heavily on strategic joint ventures and turnkey
              engineering partnerships designed to bypass traditional procurement friction and expand addressable
              geographic reach [CU003, CU007]. In March 2026, Turntide executed a strategic joint venture agreement with
              Spark Minda flagship Minda Corporation in India, holding a 51% controlling stake in an SPV focused on
              domestic development and manufacturing of high-voltage traction motors, motor controllers, and thermal
              pumps for Indian OEMs [CU007]. Parallel turnkey platform partnerships with component specialists such as
              EVR Motors and RISE Robotics bundle Turntide inverters and motion actuators into pre-integrated electric
              powertrains, attempting to accelerate commercial integration timelines for heavy equipment manufacturers
              [CU003]. Despite these collaborative distribution loops, customer concentration and commercial durability
              remain primary diligence risks [CU010, CU012]. Private secondary market transactional data from Forge
              Global reveals that Turntide experienced a severe down-round financing in May 2026, raising $26.2 million
              in Series D-2 capital at an $83.83 million post-money valuation ($0.09 per share), representing an acute
              decline of over 91% from its prior $1.0 billion valuation and $825.86 million Series D-1 equity round
              [CU010]. This severe recapitalization, combined with the lack of public net revenue retention (NRR) or
              gross revenue retention (GRR) metrics, indicates substantial commercial adoption headwinds, extended sales
              cycles, and significant dependency on a handful of large-scale industrial commitments [CU010, CU012].
            claimRefs:
              - CU003
              - CU007
              - CU010
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Acute Valuation Down-Round Exposes Commercial Scaling Friction
            body: >-
              The severe recapitalization in May 2026, wherein Turntide raised $26.2 million in Series D-2 equity at an
              $83.83 million valuation ($0.09 per share), represents an acute collapse from its previous $1.0 billion
              valuation and $825.86 million Series D-1 baseline [CU010]. In the capital-intensive OEM electrification
              sector, extended multi-year qualification cycles and unproven customer retention introduce severe
              liquidity pressure unless production volumes materialize rapidly [CU010, CU012].
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
          - type: callout
            title: Strategic Joint Ventures as Asset-Light OEM Expansion Mechanism
            body: >-
              Turntide's 51/49 joint venture with Minda Corporation in India demonstrates a strategic shift toward
              shared manufacturing infrastructure and localized distribution [CU007]. By combining proprietary axial
              flux and power electronics IP with Spark Minda's established automotive tier-1 supply network, Turntide
              seeks to reduce development lead times and access Indian EV OEM procurement without bearing full
              standalone factory capital expenditures [CU007].
            calloutType: insight
            claimRefs:
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital Structure, Severe Valuation Deflation, and Runway Vulnerability
        blocks:
          - type: paragraph
            body: >-
              Turntide Technologies faces critical financial fragility driven by private capital restructuring and
              severe valuation deflation. In June 2022, Turntide announced an $80 million equity funding round that
              established a benchmark post-money valuation exceeding $1 billion, backed by climate-focused venture
              capital syndicates and sovereign wealth funds. However, secondary market pricing benchmarks recorded by
              Forge Global in May 2026 indicate a Series D-2 transaction at a post-money valuation mark of $83.83
              million, reflecting an equity devaluation exceeding 91% from its prior unicorn benchmark. With cumulative
              debt and equity funding exceeding $400 million to $485 million across convertible notes and venture
              rounds, the company's lack of disclosed revenue, EBITDA, cash reserves, and monthly net cash burn severely
              restricts independent capital runway assessment. The existence of senior liquidation preferences and
              potential preference overhang from earlier preferred equity series poses acute dilution and governance
              risk for late-stage investors.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
