callouts:
  - calloutType: "insight"
    title: "Post-Divestiture Boundary Contraction"
    body: "Turntide's market opportunity has materially narrowed from broad smart-building decarbonization to precision vehicular electrification following the sale of its Automation Division to BrainBox AI. Diligence must evaluate the company strictly as a specialty powertrain hardware and electronics supplier."
    claimRefs:
      - "CM002"
      - "CM003"
  - calloutType: "risk"
    title: "Axial-Flux Manufacturing Scalability Bottleneck"
    body: "Despite superior power and torque density, axial-flux motors have faced widespread industrial adoption barriers due to complex, expensive manufacturing processes. Turntide's commercial success depends heavily on automating stator winding and assembly under its 18-month Project SUPREME grant program."
    claimRefs:
      - "CM009"
      - "CM016"
