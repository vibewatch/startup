chapter:
  number: 5
  title: "Product & Technology"
  summary: "Turntide presents a modular electrification portfolio spanning axial-flux motors, electric drive units, hybrid systems, ePTO, power electronics, and energy storage. Public evidence supports a specific component-and-system architecture and detailed company-claimed specifications, but it does not independently establish those performance figures, serial-production maturity, long-duration reliability, or named security and quality certifications."
sections:
  - id: "product-lines-and-customer-workflows"
    title: "Product lines and customer workflows"
    body: >-
      Turntide's public product surface describes a component-to-system offer rather than a
      single motor SKU. The company says it designs motors, power electronics, energy storage,
      and thermal equipment; the reviewed pages then identify axial-flux motors, an electric
      drive unit (EDU), hybrid propulsion configurations, and an electric power take-off (ePTO)
      system. In customer workflow terms, the EDU combines propulsion components that an OEM
      would otherwise source and validate separately, while the ePTO powers stationary work
      functions without running the vehicle engine. The hybrid page addresses series and
      parallel architectures for duty cycles where full battery electrification is constrained.
      This breadth may reduce integration interfaces, but no assigned source discloses current
      shipment volumes, standard pricing, production lead times, or warranty terms for any line.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE007"
      - "CE013"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-performance-claims"
    title: "Architecture and performance claims"
    body: >-
      The disclosed architecture centers on stackable axial-flux motors paired with power
      electronics. Turntide describes the EDU as a semi-integrated motor, inverter, and
      differential, with shared motor-inverter cooling, simplified gearing, and separately
      serviceable components. The company reports nominal power from 73 kW to 220 kW and peak
      power from 300 kW to 700 kW for EDU motor configurations at 400 volts and above. A
      supplier-authored AF430S listing adds peak power and torque density figures at 800 VDC,
      plus liquid cooling, voltage, environmental-test, and ingress-protection claims. These
      specifications are useful design inputs, not verified comparative benchmarks: the two
      pages repeating the 53% torque-density, 58% size, and 37% weight comparison originate from
      the same company release and disclose neither test protocol nor baseline configuration.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE008"
      - "CE009"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-deployment-and-serviceability"
    title: "Maturity, deployment, and serviceability"
    body: >-
      Product maturity is mixed across the reviewed evidence. The AF430S had a detailed
      supplier-authored product listing in April 2025, whereas the integrated EDU was announced
      for unveiling at CONEXPO in March 2026 and was again presented in a paid September 2026
      release around IAA Transportation. Turntide also reports more than 600 miles of desert
      running in a purpose-built Sierra Echo-R and says the EDU completed that event without
      issues. This is relevant prototype validation under vibration, load, dust, and heat, but
      it is not a substitute for independent endurance results, production-fleet operating
      hours, warranty data, or failure-rate distributions. Separately serviceable EDU components
      could reduce repair scope, though the public sources provide no service interval, parts
      availability, diagnostic workflow, or mean-time-to-repair evidence.
    claimRefs:
      - "CE005"
      - "CE010"
      - "CE014"
      - "CE015"
      - "CE016"
  - id: "quality-security-and-technical-diligence"
    title: "Quality, security, and technical diligence"
    body: >-
      Turntide's website states that its systems meet internationally recognized benchmarks and
      that BSI certification accredited by UKAS verifies ISO compliance; the AF430S listing
      separately claims ISO 16750 environmental testing and IP67 and IP6K9K ingress ratings.
      The assigned evidence does not identify the website-referenced ISO standards, certificate
      numbers, certified entities, certification scope, or expiry dates. Nor does it document
      functional-safety analysis, motor-control software architecture, cybersecurity controls,
      incident history, supplier qualification, or battery-safety validation. The careers page
      supplies only a general practitioner signal, and the fetched independent trade-publication
      page yielded an editor biography rather than substantive technical reporting. Technical
      diligence should therefore verify certificates and test reports directly and obtain OEM
      validation, field telemetry, firmware governance, and quality-system evidence before
      treating the disclosed performance or assurance claims as production-proven.
    claimRefs:
      - "CE009"
      - "CE011"
      - "CE012"
      - "CE014"
      - "CE016"
