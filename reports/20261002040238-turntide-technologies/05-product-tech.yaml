callouts:
  - calloutType: "insight"
    title: "Integration is the product thesis"
    body: "The differentiation claim is not merely an axial-flux motor geometry; it is the combination of motor, inverter, gearing, cooling, and serviceability intended to reduce OEM validation work. That thesis remains commercially unquantified because the assigned evidence provides no named series-production OEM, integration-cycle baseline, or realized customer economics."
    claimRefs:
      - "CE002"
      - "CE005"
      - "CE013"
      - "CE014"
  - calloutType: "risk"
    title: "Specification detail exceeds independent proof"
    body: "Turntide publishes precise density, efficiency, voltage, ingress, and endurance claims, but the apparent external product listing is supplier-authored, the Yahoo item is labeled a paid press release, and the fetched Power & Motion page contains no substantive technical article text. Underwriting should treat the figures as company claims until test protocols and independent results are reviewed."
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE015"
      - "CE016"
