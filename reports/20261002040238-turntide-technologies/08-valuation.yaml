company:
  name: "Turntide Technologies"
chapter:
  number: 8
  title: "Valuation"
  summary: "Turntide Technologies faces a severe valuation disconnect between its peak $1.0B June 2022 unicorn valuation and subsequent down-round structures indicated by secondary databases, including Forge Global's recorded $83.83M post-money mark on its May 2026 Series D-2 round. Despite notable operational progress in commercial vehicle axial-flux propulsion and rail battery supply agreements, complete lack of public revenue and margin disclosures warrants an Avoid recommendation with critical risk."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis, Stance, and Recommendation"
    body: "Turntide Technologies presents a stark divergence between proprietary electrification hardware traction and venture capital cap-table deterioration. The core investment thesis posits that industrial electric motors and commercial vehicle powertrains represent a massive global decarbonization opportunity, where Turntide's switched reluctance and axial flux motor topologies offer 25% to 50% energy efficiency gains over legacy induction designs. However, the anti-thesis is dominant: Turntide has operated with high capital intensity, consuming approximately $485M to $491M in total capital through 2022, while continuing to withhold fundamental financial metrics including annual recurring revenue, gross margins, cash burn rate, and operating runway. Consequently, we issue a definitive Avoid recommendation with Low confidence (1/5), Critical risk rating, and an Expensive valuation stance. The company cannot be recommended for capital commitment without audited financial statements, verified production margins, and clarity regarding liquidation preference overhang."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-history-and-valuation-reset"
    title: "Capital Structure, Down-Round Dynamics, and Preference Overhang"
    body: "Turntide's capital history reflects the exuberant climate tech cycle of 2020–2022 followed by an acute liquidity and valuation contraction. In June 2022, Turntide closed an $80M equity financing round led by Climate Investment and SDCL Energy Efficiency Income Trust, valuing the company at over $1.0B and achieving unicorn status. This followed an $80M round and a $225M convertible note in 2021. However, by mid-2023, media reports signaled that follow-on financings faced steep valuation haircuts of up to 80%. Private market intelligence from Forge Global records an even deeper capital reset: an $83.83M post-money valuation mark tied to a May 2026 Series D-2 round at $0.09 per share raising $26.2M, preceded by June 2023 Series D-1 ($57.54M raised at 1.5x liquidation preference) and Series Junior issuances. This implies an equity value erosion exceeding 90% from the peak $1.0B benchmark. The introduction of senior liquidation preferences and restructured share classes creates substantial dilution and structural overhang, threatening common shareholders and earlier preferred investors."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Valuation Modeling and Critical Diligence Asks"
    body: "Evaluating Turntide across bull, base, and bear scenarios demonstrates significant asymmetric downside under current public visibility. In the bull case, OEM adoption of axial-flux electric drive units (EDUs) across heavy-duty commercial vehicles, combined with scaling UK rail battery production orders from Hitachi Rail and international expansion through its 51% Minda Corporation joint venture in India, enables Turntide to establish sustained profitability and achieve an eventual IPO or strategic acquisition at an estimated enterprise value of $250M to $400M. In the base case, Turntide maintains niche supplier status in specialty off-highway, rail, and regional commercial fleets, generating modest revenue but remaining constrained by manufacturing working capital, justifying an enterprise value between $60M and $100M (consistent with the recent Series D-2 pricing). In the bear case, severe cash burn, high component warranty liabilities, or further preference overhang trigger a distressed recapitalization, debt restructuring, or asset liquidation yielding zero return to junior equity. Any institutional investment requires mandatory diligence on actual revenue run-rate, customer churn, backlog cancellability, and the definitive cap-table waterfall."
    claimRefs:
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
