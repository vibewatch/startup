callouts:
  - calloutType: "risk"
    title: "Tier-1 Incumbent Scale and Counterparty Credit Risk"
    body: "Turntide's most acute competitive headwind stems not from motor electromagnetic performance, but from counterparty credit risk and balance sheet asymmetry. Global commercial vehicle and rail OEMs commit to vehicle architectures spanning 10 to 15 years of production and spare parts availability. Incumbents like BorgWarner and Bosch possess investment-grade balance sheets that guarantee warranty coverage, recall indemnities, and uninterrupted multi-plant supply. In contrast, Turntide's May 2026 secondary market valuation mark of $83.83 million on Forge Global highlights severe capital compression that amplifies OEM supplier viability concerns."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP005"
      - "CP013"
      - "CP014"
  - calloutType: "insight"
    title: "Joint Venture Localization as a Strategic Market Entry Wedge"
    body: "Turntide's 51/49 joint venture agreement with Minda Corporation in India represents a viable strategic blueprint for competing against entrenched global Tier-1 suppliers. By partnering with Spark Minda's established automotive components manufacturing and distribution infrastructure, Turntide sidesteps severe greenfield capex requirements while meeting local sourcing mandates for high-growth commercial EV and hybrid platforms in South Asia."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP010"
