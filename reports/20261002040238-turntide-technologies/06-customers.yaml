callouts:
  - calloutType: "risk"
    title: "Acute Valuation Down-Round Exposes Commercial Scaling Friction"
    body: "The severe recapitalization in May 2026, wherein Turntide raised $26.2 million in Series D-2 equity at an $83.83 million valuation ($0.09 per share), represents an acute collapse from its previous $1.0 billion valuation and $825.86 million Series D-1 baseline [CU010]. In the capital-intensive OEM electrification sector, extended multi-year qualification cycles and unproven customer retention introduce severe liquidity pressure unless production volumes materialize rapidly [CU010, CU012]."
    claimRefs:
      - "CU010"
      - "CU012"
  - calloutType: "insight"
    title: "Strategic Joint Ventures as Asset-Light OEM Expansion Mechanism"
    body: "Turntide's 51/49 joint venture with Minda Corporation in India demonstrates a strategic shift toward shared manufacturing infrastructure and localized distribution [CU007]. By combining proprietary axial flux and power electronics IP with Spark Minda's established automotive tier-1 supply network, Turntide seeks to reduce development lead times and access Indian EV OEM procurement without bearing full standalone factory capital expenditures [CU007]."
    claimRefs:
      - "CU007"
