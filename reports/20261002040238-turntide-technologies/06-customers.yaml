figures:
  - id: "FU001"
    title: "Customer Journey and Commercial Expansion Loops"
    type: "journey-map"
    summary: "Multi-stage OEM customer adoption lifecycle from initial application co-development through joint venture scaling and field retention."
    data:
      items:
        - label: "Application Sourcing"
          touchpoints:
            - "Direct OEM technical sales engagement"
            - "Industry trade expos (CONEXPO, IAA Transportation)"
            - "Strategic component partner referrals (EVR Motors, RISE Robotics)"
          painPoints: "Complex non-linear electrification requirements across varied duty cycles"
          actions: "Evaluate vehicle packaging constraints, torque density targets, and hybrid versus battery electric architecture requirements"
        - label: "Technical Co-Development"
          touchpoints:
            - "Applications engineering dyno testing (Waterloo, UK, customer sites)"
            - "Power electronics and motor controller pairing"
            - "Safety compliance review (ISO 26262, CRA, rail frameworks)"
          painPoints: "High engineering friction and long validation cycles before prototype sign-off"
          actions: "Conduct motor characterization dyno runs and pair modular inverters to customer powertrain interfaces"
        - label: "Initial Production Order"
          touchpoints:
            - "Pilot demonstration and fleet evaluation sign-off"
            - "Initial battery and motor production contracts (e.g. Hitachi Rail order)"
            - "Facility component assembly and delivery"
          painPoints: "Limited initial unit volumes and heavy reliance on customized hardware configurations"
          actions: "Deliver customized traction batteries and inverters for pilot intercity trains and commercial vehicle platforms"
        - label: "Joint Venture & Channel Scaling"
          touchpoints:
            - "Regional manufacturing JVs (Minda Corporation 51/49 venture in India)"
            - "Turnkey propulsion solution bundles with motor and actuator partners"
            - "Localized domestic OEM supply chain integration"
          painPoints: "Capital intensity, local regulatory approvals, and partner margin sharing"
          actions: "Establish regional manufacturing presence to satisfy domestic procurement mandates and expand OEM pipeline"
        - label: "Fleet Lifecycle & Renewal"
          touchpoints:
            - "Ongoing maintenance and firmware calibration"
            - "Over-the-air monitoring and battery diagnostics"
            - "Follow-on trainset or vehicle program expansion"
          painPoints: "Absence of public NRR, long replacement cycles, and risk of customer redesign"
          actions: "Maintain technical support relationships while seeking multi-year platform fleet renewal commitments"
        - label: "Ecosystem Re-Engagement"
          touchpoints:
            - "Customer executive reviews and next-generation powertrain roadmaps"
            - "Expansion into adjacent equipment lines and multi-voltage battery platforms"
            - "Secondary market retrofit and battery recycling support"
          painPoints: "OEM platform architecture freeze and multi-year refresh cadences"
          actions: "Position high-torque axial flux motor updates for next-generation vehicle cycle designs"
    approximationNotes: "Represents the standard OEM commercialization workflow synthesized from Turntide applications engineering postings, trade announcements, and joint venture filings."
