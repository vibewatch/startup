evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, cost of goods sold, gross margins, SG&A operating expenses,
      and cash runway.
    whyItMatters: >-
      Without primary income statement and balance sheet verification, Turntide's cash burn rate, operating solvency,
      and claims of $300M revenue potential cannot be verified.
    diligencePath: Request confidential audited financials, bank covenant verification, and management accounts under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: axial-flux-sam-som
    missingEvidence: >-
      Granular market sizing data detailing annual axial-flux electric motor unit demand specifically for commercial bus
      and truck chassis.
    whyItMatters: >-
      Without segmented vehicle-class demand figures, Turntide's immediate addressable powertrain opportunity cannot be
      separated from broader electric vehicle forecasts.
    diligencePath: >-
      Obtain specialized commercial vehicle propulsion powertrain component forecasts from automotive industry
      benchmarking groups.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-financial-metrics
    missingEvidence: >-
      Audited gross margin, average selling prices (ASP), and customer churn rates across Turntide's axial-flux and
      industrial motor lines.
    whyItMatters: >-
      Without verified pricing and unit economics, assessing Turntide's cost competitiveness against high-volume Tier-1
      incumbents remains constrained to qualitative analysis.
    diligencePath: >-
      Request management accounts, customer contract schedules, and bill-of-materials cost breakdowns under NDA during
      formal diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Consolidated revenue, gross margin, contribution margin, working-capital intensity, warranty cost, and
      service-delivery cost.
    whyItMatters: >-
      Without these inputs, revenue quality, manufacturing leverage, and the path to sustainable gross profit cannot be
      underwritten.
    diligencePath: >-
      Obtain audited consolidated financials plus product-, customer-, and geography-level revenue and gross-margin
      bridges for the last three years.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: commercial-terms
    missingEvidence: >-
      Customer pricing, discounts, contract duration, acceptance and cancellation clauses, backlog conversion, payment
      terms, and revenue-recognition policy.
    whyItMatters: >-
      These terms determine realized price, revenue timing, cash conversion, concentration exposure, and backlog
      quality.
    diligencePath: >-
      Review representative contracts, invoice cohorts, backlog aging, cancellations, and the audited
      revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-gap
    missingEvidence: >-
      Current cash, restricted cash, debt, covenants, monthly burn, committed project matching funds, and base/downside
      runway.
    whyItMatters: >-
      Historical funding raised and project values do not establish liquidity or the timing and terms of the next
      financing.
    diligencePath: >-
      Obtain current treasury statements, debt schedules, covenant calculations, a 24-month monthly cash forecast, and
      the Project SUPREME award documents.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: independent-performance-validation
    missingEvidence: >-
      Independent test protocols and results for torque density, size, weight, efficiency, thermal derating, and
      long-duration EDU reliability.
    whyItMatters: >-
      The disclosed metrics drive the product differentiation thesis, but repeated syndicated company releases do not
      independently validate the baseline, denominator, or production-duty performance.
    diligencePath: >-
      Request accredited dynamometer reports, environmental and endurance test logs, field-failure distributions, and
      direct OEM validation references.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public or private evidence of motor-control software governance, release cadence, integration tooling, contributor
      depth, and practitioner adoption.
    whyItMatters: >-
      Matched motor-inverter operation and hybrid mode transitions depend on controls engineering that cannot be
      assessed from a generic careers page.
    diligencePath: >-
      Review firmware repositories, release records, interface documentation, functional-safety ownership, integration
      tickets, and engineering-team retention in a technical data room.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: certification-and-quality-scope
    missingEvidence: >-
      Named ISO certificates, certified legal entities and sites, validity dates, audit findings, functional-safety
      artifacts, cybersecurity controls, and battery-safety qualifications.
    whyItMatters: >-
      Generic certification and security language cannot establish which products, facilities, development processes, or
      operating risks are actually covered.
    diligencePath: >-
      Obtain current certificates and audit reports directly from Turntide, verify them with the issuing bodies, and map
      each scope to the products and facilities underwritten.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: customer-retention-and-revenue-arr
    missingEvidence: >-
      Audited customer retention rates, net revenue retention (NRR), active account counts, and annual recurring
      software revenue disclosures.
    whyItMatters: >-
      Without verified retention and contract renewal metrics, investors cannot evaluate whether historical deployments
      represent durable commercial expansion or stalled pilot engagements.
    diligencePath: >-
      Request private customer cohort retention logs, top customer revenue concentration schedules, and recurring
      maintenance contract records from management.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive statutory regulatory filing records across all operating jurisdictions and full capitalization
      waterfall schedule for Series D-2 down-round restructuring.
    whyItMatters: >-
      Without primary legal filings and detailed waterfall documentation, prospective underwriters cannot quantify
      potential preference wipeout or regulatory approval friction in India.
    diligencePath: >-
      Obtain verified cap-table distribution schedule, Delaware Certificate of Incorporation amendments, and formal
      approval records from Indian regulatory bodies (RBI/FDI).
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: blocking
    topic: revenue-and-gross-margin
    missingEvidence: >-
      Audited financial statements showing Turntide's annual recurring revenue, gross margins, and customer
      concentration.
    whyItMatters: Without verified revenue or unit margins, standard valuation multiples cannot be applied.
    diligencePath: Obtain audited financial statements and board pack under NDA during formal diligence.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-waterfall
    missingEvidence: >-
      Complete cap-table waterfall including liquidation preferences and participation rights across all Series D
      tranches.
    whyItMatters: Determines whether secondary share purchases at current prices have any downside recovery rights.
    diligencePath: Request fully diluted cap-table schedule and certificate of incorporation from company counsel.
    relatedQuestionRefs:
      - QV008
