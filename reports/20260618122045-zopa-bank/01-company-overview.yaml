chapter:
  number: 1
  title: Company Overview
  summary: Zopa Bank is a London-headquartered UK digital bank that evolved from a 2005 peer-to-peer lending pioneer into a regulated, profitable, multi-product retail bank. Public 2025 and 2026 reporting supports a >$1 billion valuation, roughly £377 million of 2025 revenue, roughly £65 million of underlying pre-tax profit, a £6.4 billion deposit base, and about 1.7 million customers. The overview case is attractive because profitability and capital access now coexist, but diligence still needs to weigh conduct overhangs such as motor-finance exposure, complaint patterns, and opaque cap-table detail.
sections:
- id: identity-and-model
  title: Identity and Business Model
  body: 'Zopa Bank Limited now presents itself as a regulated UK digital bank rather than only the peer-to-peer lender that made the brand famous in the mid-2000s. Public company materials and the FCA register align on the legal identity, London headquarters, and dual FCA/PRA regulatory perimeter. That matters because it frames Zopa less as a marketplace intermediary and more as a deposit-funded balance-sheet lender with a broader everyday-banking ambition. The current proposition spans savings, unsecured loans, credit cards, current accounts, car finance, ISAs, and investment adjacencies, which makes Zopa’s identity foundational for every later diligence chapter. The historical through-line is still important: Zopa’s original mission around more human, more accessible finance remains visible in management’s positioning, but the operating model has clearly shifted toward a multi-product retail bank optimised for cross-sell, funding stability, and regulated profitability.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO039
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership and Governance
  body: 'Leadership is unusually important to understanding Zopa because the company’s transition from marketplace pioneer to profitable bank has been narrated through a relatively small set of visible executives. Jaidev Janardana is the dominant public face of the bank, while the leadership page and third-party executive directories show a broadening functional bench across finance, risk, compliance, technology, customer, and strategy. Governance also retains a strong link to the founding era through Giles Andrews on the board, while investor influence is visible through SoftBank representative Max Ohrstrand and other non-executive directors. That combination is stronger than a pure founder-centric fintech, but it does not eliminate key-person risk: succession planning, exact board committee structure, and insider ownership remain private. For diligence purposes, the important takeaway is that Zopa’s leadership bench now looks institutionally credible, but the company still depends heavily
    on a narrow set of decision-makers to maintain strategic coherence and regulatory trust.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO037
  tableRefs:
  - TO002
  - TO003
- id: funding-and-capital
  title: Funding History and Capital Structure
  body: 'Zopa’s capital history shows three distinct phases: venture support during the peer-to-peer era, transition capital around the 2020 banking-licence shift, and larger institutional funding once the company could be underwritten as a digital bank with a growing deposit base. The SoftBank-led 2021 round is the clearest milestone because it set unicorn valuation status and validated the banking pivot in global fintech markets. The 2024 A.P. Moller Holding round matters for a different reason: it reaffirmed a valuation above $1 billion after the broader reset in fintech multiples. The 2025 AT1 issuance then added a second capital channel, indicating that Zopa can supplement equity with regulatory capital suited to a maturing bank. What remains opaque is ownership concentration, liquidation preferences, and any secondary transfers among earlier venture investors. As a result, outside observers can see the chronology and approximate scale of funding, but not yet the full economics of control.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO037
  figureRefs:
  - FO001
- id: scale-and-performance
  title: Scale, Profitability, and Coverage Gaps
  body: 'Public 2025 and 2026 reporting makes Zopa unusual among private UK challenger banks because the company is pairing unicorn valuation status with repeated profitability disclosures. The available numbers indicate roughly £380.7 million of revenue in 2024, £377.1 million in 2025, and a sharp step-up in underlying pre-tax profit to about £65 million, alongside improving cost-to-income ratios. Balance-sheet scale also appears meaningful: customer deposits reached about £6.4 billion and the gross loan book about £3.8 billion by end-2025. Customer traction is similarly material, with roughly 1.7 million customers and substantial credit-card issuance. Still, not every cover metric is equally well evidenced. Headcount is not cleanly corroborated from the source pack, and some customer-experience metrics such as NPS remain company-cited rather than independently audited. The prudent diligence stance is therefore that Zopa’s scale and profitability are credible, but several operating detail
    layers remain private.'
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO021
