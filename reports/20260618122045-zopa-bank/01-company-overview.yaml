callouts:
- calloutType: strength
  title: Profitable unicorn is the core overview signal
  body: 'Zopa enters 2026 with a profile that is rare in European fintech: a private-market valuation still above $1 billion, an expanding deposit-funded balance sheet, and repeated public disclosures of meaningful profitability. That combination is the anchor fact that later market, financial, and valuation chapters need to test rather than assume.'
  claimRefs:
  - CO012
  - CO019
  - CO022
  - CO038
- calloutType: risk
  title: Regulatory conduct remains the main overview caveat
  body: Motor-finance provisions and complaint-oriented sources are the clearest overview-level adverse indicators. They do not yet overturn the positive profitability story, but they do show why Zopa should be evaluated as a regulated consumer bank with conduct risk, not just as a fast-growing fintech brand.
  claimRefs:
  - CO034
  - CO035
  - CO002
