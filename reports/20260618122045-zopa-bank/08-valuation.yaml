  - CV008
  - CV033
  - CV035
  - CV042
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner/Diligence Path
  rows:
  - - Motor finance
    - Portfolio and claims sensitivity model
    - Determines whether the base case is conservative
    - Management, legal counsel, and risk team
  - - Capital and liquidity
    - Current buffers and stress tests
    - Validates resilience under downside cases
    - CFO and treasury
  - - Cohort economics
    - Cross-sell, churn, and lifetime value by product
    - Tests moat durability
    - Growth and analytics team
  - - Cap table and preferences
    - Latest round rights, preference stack, and secondaries
    - Affects real entry economics
    - Company secretary and investors
  - - Exit readiness
    - Disclosure roadmap and liquidity timing
    - Tests path to rerating or exit
    - CEO, CFO, and board
  - - Competitive positioning
    - Current account and daily-engagement data vs peers
    - Shows whether upside multiple expansion is deserved
    - Strategy team
  notes: These asks are the minimum pack needed to move from medium-confidence public underwriting to a high-conviction pricing decision.
