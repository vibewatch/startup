- id: diligence-asks-and-kill-criteria
  title: Diligence Asks and Kill Criteria
  body: >-
    The remaining diligence burden is mostly about converting a medium-confidence public thesis into a high-conviction private-market pricing decision. Investors should not rely on the headline valuation alone. They need a motor finance sensitivity pack, capital and liquidity stress tests, cohort economics by product, and a current cap-table summary that shows preference and secondary economics. Exit readiness also needs direct management evidence, because public profitability is helpful but not sufficient for IPO-quality disclosure or for a premium rerating. The kill criteria are equally practical. If conduct costs rise sharply, if deposit momentum weakens, if credit quality deteriorates, or if a major operational incident damages trust, the fair-value range should be revised down quickly. Those triggers do not imply the company is uninvestable today. They mean that Zopa is a price-sensitive opportunity where diligence quality will determine whether a positive thesis becomes a strong investment
    or a merely acceptable one for disciplined investors with downside protection.",
  claimRefs:
  - CV029
  - CV030
