- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Motor finance cost
    - Provision or expected loss rises materially
    - Erodes confidence in fair-value base case
    - Mark down to bear case or pause
  - - Funding stress
    - Sustained deposit outflow or sharply higher savings pricing
    - Weakens earnings and confidence
    - Reduce multiple and re-check liquidity
  - - Credit stress
    - Arrears or impairments step above plan
    - Lowers profit quality
    - Re-underwrite downside
  - - Execution shock
    - Major outage, cyber event, or service failure
    - Hits customer proof and conduct profile
    - Increase risk rating and delay investment
  - - Market rerating
    - Public fintech multiples compress further
    - Shrinks exit optionality
    - Demand lower entry valuation
  notes: Triggers focus on issues that would change valuation faster than gradual product iteration or normal macro noise.
