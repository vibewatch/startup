  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Latest cap table, preference stack, secondaries, and investor rights summary.
    whyItMatters: Headline valuation can materially overstate or understate true entry economics if liquidation preferences or secondaries are significant.
    diligencePath: Request full financing documents and current ownership waterfall.
    relatedQuestionRefs:
    - QV028
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: scenario-sensitivity
    missingEvidence: Detailed motor finance, capital, liquidity, and NIM sensitivity model.
    whyItMatters: Scenario ranges are only directional without management’s internal downside framework.
    diligencePath: Request board or IC materials covering downside cases and treasury stress tests.
    relatedQuestionRefs:
    - QV018
    - QV019
    - QV020
    - QV021
    - QV022
    relatedTableRefs:
    - TV003
    - TV005
  - type: missing-source
    severity: material
    topic: cohort-economics
    missingEvidence: Product-level cohort profitability, conversion, and churn by customer segment.
    whyItMatters: The upside case depends on multi-product depth, so missing cohort economics caps confidence in multiple expansion.
    diligencePath: Request growth analytics pack and contribution-margin views by product pair.
    relatedQuestionRefs:
    - QV023
    - QV026
    - QV031
    relatedTableRefs:
    - TV002
    - TV006
    - TV004
