callouts:
- calloutType: strength
  title: The platform thesis is breadth plus configurable core banking
  body: Zopa's product and technology case is strongest when viewed as a configurable everyday-banking platform rather than a single best-of-breed app. Thought Machine, cloud infrastructure, and cross-sellable modules together imply faster launch flexibility than many legacy-bank stacks.
  claimRefs: [CE003, CE012, CE013, CE018, CE030]
- calloutType: risk
  title: Dependency concentration is the main architecture risk
  body: The same modern stack that gives Zopa product flexibility also concentrates risk in a small number of external dependencies, especially Thought Machine, cloud vendors, card schemes, bureaus, and regulatory infrastructure. Public materials support the architecture direction but not full resilience proof.
  claimRefs: [CE019, CE020, CE021, CE022, CE032]
