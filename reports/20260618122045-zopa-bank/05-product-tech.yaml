  claims:
  - {id: CE001, statement: 'Zopa''s 2026 product suite spans personal loans, easy-access savings, cash ISA, credit cards, a current account, car finance, and emerging investment-adjacent features.', type: third-party-reported, topic: product-suite, sourceRefs: [SE012, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE001]}
  - {id: CE002, statement: 'Personal loans remain Zopa''s flagship legacy product and the clearest long-standing operating module in the public source pack.', type: third-party-reported, topic: product-suite, sourceRefs: [SE012, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE002]}
  - {id: CE003, statement: 'Savings products and the newer current-account push show that Zopa has expanded materially beyond its lending-only origins.', type: third-party-reported, topic: product-suite, sourceRefs: [SE012, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE003]}
  - {id: CE004, statement: 'Credit cards are a material product module at Zopa because public 2026 reporting references more than 470,000 cards issued.', type: third-party-reported, topic: product-suite, sourceRefs: [SE012, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE004]}
  - {id: CE005, statement: 'Investment or junior-investment features appear more emerging or partner-led than Zopa''s core lending, savings, and card products.', type: inferred, topic: product-suite, sourceRefs: [SE012, SE013], confidence: low, freshness: current, answersQuestionRefs: [QE005]}
  - {id: CE006, statement: 'The module map implies that Zopa''s platform value comes from cross-sell depth across several regulated banking products rather than from a single SKU.', type: inferred, topic: product-architecture, sourceRefs: [SE012, SE013, SE014], confidence: medium, freshness: current, answersQuestionRefs: [QE006]}
  - {id: CE007, statement: 'Zopa''s customer workflow begins with app-led onboarding and identity or eligibility checks inside a digital banking journey.', type: inferred, topic: workflow, sourceRefs: [SE012, SE025], confidence: medium, freshness: current, answersQuestionRefs: [QE007]}
  - {id: CE008, statement: 'The public developer domain and Open Banking standards context support the view that Zopa can use regulated API flows for onboarding, account aggregation, or affordability checks.', type: inferred, topic: workflow, sourceRefs: [SE002, SE011], confidence: high, freshness: current, answersQuestionRefs: [QE008]}
  - {id: CE009, statement: 'Once a customer activates into one product, Zopa can use servicing and data history to cross-sell adjacent credit, savings, or current-account products.', type: inferred, topic: workflow, sourceRefs: [SE012, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE009]}
  - {id: CE010, statement: 'Combining current account, savings, and credit inside one relationship should deepen engagement and lifetime value more effectively than a stand-alone lending app.', type: inferred, topic: workflow, sourceRefs: [SE012, SE013, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE010]}
  - {id: CE011, statement: 'The main workflow limitation visible publicly is that cross-sell conversion, approval speed, and servicing reliability metrics are not disclosed in detail.', type: third-party-reported, topic: workflow-gaps, sourceRefs: [SE012, SE024, SE025], confidence: medium, freshness: current, answersQuestionRefs: [QE011]}
  - {id: CE012, statement: 'Thought Machine Vault is the core-banking platform publicly associated with Zopa.', type: third-party-reported, topic: architecture, sourceRefs: [SE005, SE015], confidence: high, freshness: current, answersQuestionRefs: [QE012]}
  - {id: CE013, statement: 'Thought Machine matters because it provides a cloud-native real-time ledger and product-factory model that should speed product configuration and change management.', type: inferred, topic: architecture, sourceRefs: [SE005, SE015], confidence: high, freshness: current, answersQuestionRefs: [QE013]}
  - {id: CE014, statement: 'Zopa''s operating architecture appears to rely primarily on AWS with some Google Cloud capability in the broader financial-services stack context.', type: inferred, topic: architecture, sourceRefs: [SE001, SE008, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE014]}
  - {id: CE015, statement: 'The existence of developer.zopa.com and Open Banking standards support indicates that Zopa has a real public API or developer-facing surface.', type: third-party-reported, topic: developer-signal, sourceRefs: [SE002, SE011], confidence: high, freshness: current, answersQuestionRefs: [QE015]}
  - {id: CE016, statement: 'Zopa''s credit decisioning likely depends on internal models plus third-party bureau data from providers such as Experian, Equifax, and TransUnion.', type: inferred, topic: risk-engine, sourceRefs: [SE021, SE022, SE023], confidence: medium, freshness: current, answersQuestionRefs: [QE016]}
  - {id: CE017, statement: 'Zopa''s payments and account-servicing flows are likely dependent on UK payment rails such as Faster Payments and Bacs.', type: inferred, topic: payments, sourceRefs: [SE017, SE018], confidence: medium, freshness: current, answersQuestionRefs: [QE017]}
  - {id: CE018, statement: 'A cloud-native ledger and modular product stack should let Zopa iterate faster than many legacy retail banks that still run on older core systems.', type: inferred, topic: architecture, sourceRefs: [SE005, SE010, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE018]}
  - {id: CE019, statement: 'Thought Machine is the most concentrated single architectural dependency because it sits at the core ledger and product-configuration layer.', type: inferred, topic: dependency-risk, sourceRefs: [SE005, SE015], confidence: high, freshness: current, answersQuestionRefs: [QE019]}
  - {id: CE020, statement: 'AWS and Google Cloud create a second concentration layer because outages, pricing changes, or policy shifts could affect platform resilience and economics.', type: inferred, topic: dependency-risk, sourceRefs: [SE001, SE008, SE009], confidence: medium, freshness: current, answersQuestionRefs: [QE020]}
  - {id: CE021, statement: 'Visa and Mastercard are likely hard dependencies for Zopa''s card economics, acceptance, and customer experience.', type: inferred, topic: dependency-risk, sourceRefs: [SE019, SE020], confidence: medium, freshness: current, answersQuestionRefs: [QE017]}
  - {id: CE022, statement: 'FCA and PRA authorization plus Open Banking ecosystem rules are hard dependencies for Zopa''s platform to operate as a regulated digital bank.', type: inferred, topic: regulatory-tech, sourceRefs: [SE011, SE016, SE014], confidence: medium, freshness: current, answersQuestionRefs: [QE021]}
  - {id: CE023, statement: 'PCI DSS, ISO 27001, and NCSC-style cyber guidance define the right public trust and control framework for evaluating Zopa''s security posture.', type: inferred, topic: trust-controls, sourceRefs: [SE004, SE007, SE009], confidence: high, freshness: current, answersQuestionRefs: [QE022]}
  - {id: CE024, statement: 'The public source pack does not fully prove the exact certification scope, audit date, or environment coverage behind any claimed security standards.', type: third-party-reported, topic: trust-gaps, sourceRefs: [SE004, SE007, SE012], confidence: medium, freshness: current, answersQuestionRefs: [QE022, QE025]}
  - {id: CE025, statement: 'Public engineering signal exists through Zopa''s GitHub presence, developer domain, and active hiring pages.', type: third-party-reported, topic: developer-signal, sourceRefs: [SE002, SE003, SE006], confidence: high, freshness: current, answersQuestionRefs: [QE023]}
  - {id: CE026, statement: 'The active jobs signal implies continued investment in engineering, data, platform, product, and security capabilities rather than a maintenance-only roadmap.', type: inferred, topic: roadmap, sourceRefs: [SE003, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE023]}
  - {id: CE027, statement: 'Monzo''s public developer docs provide a benchmark showing that Zopa appears to have meaningful API intent but a narrower public developer surface than the best-known challenger-bank peer.', type: inferred, topic: benchmark, sourceRefs: [SE002, SE010], confidence: medium, freshness: current, answersQuestionRefs: [QE024]}
  - {id: CE028, statement: 'Public review surfaces support the view that Zopa has real mobile delivery at scale, but they do not prove best-in-class reliability or support quality.', type: third-party-reported, topic: service-quality, sourceRefs: [SE024, SE025], confidence: medium, freshness: current, answersQuestionRefs: [QE011, QE022]}
  - {id: CE029, statement: 'The roadmap signal points toward deeper everyday-banking cross-sell, especially around current accounts, cards, and savings relationships.', type: inferred, topic: roadmap, sourceRefs: [SE012, SE013, SE014], confidence: medium, freshness: current, answersQuestionRefs: [QE009, QE023]}
  - {id: CE030, statement: 'The current architecture should reduce launch friction for additional deposit or credit features because the core stack appears modular rather than monolithic.', type: inferred, topic: roadmap, sourceRefs: [SE005, SE012, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE013]}
  - {id: CE031, statement: 'Trust and compliance matter disproportionately at Zopa because the bank handles payments, cards, deposits, identity data, and credit decisions within one digital relationship.', type: inferred, topic: trust-controls, sourceRefs: [SE004, SE007, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE021, QE022]}
  - {id: CE032, statement: 'Public materials do not disclose incident history, uptime commitments, or detailed resilience metrics for Zopa''s production environment.', type: third-party-reported, topic: trust-gaps, sourceRefs: [SE012, SE024, SE025], confidence: medium, freshness: current, answersQuestionRefs: [QE025]}
  - {id: CE033, statement: 'Public materials do not disclose model performance, fraud-loss rates, approval fairness metrics, or bureau mix for Zopa''s decisioning engine.', type: third-party-reported, topic: trust-gaps, sourceRefs: [SE002, SE021, SE022], confidence: medium, freshness: current, answersQuestionRefs: [QE025]}
  - {id: CE034, statement: 'Investment-adjacent features appear less mature than the core loans, savings, cards, and current-account modules.', type: inferred, topic: product-maturity, sourceRefs: [SE012, SE013], confidence: low, freshness: current, answersQuestionRefs: [QE005]}
  - {id: CE035, statement: 'Zopa''s moat appears to come more from execution, data, and operating-model integration than from a uniquely proprietary consumer network or exclusive distribution channel.', type: inferred, topic: differentiation, sourceRefs: [SE012, SE015, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE006, QE018]}
  - {id: CE036, statement: 'The main remaining product and technology diligence blocker is obtaining a verified production architecture map plus third-party evidence for security scope and control effectiveness.', type: inferred, topic: diligence-blocker, sourceRefs: [SE004, SE007, SE009, SE012], confidence: medium, freshness: current, answersQuestionRefs: [QE025]}
  evidenceGaps:
  - {type: private-evidence-only, severity: material, topic: architecture, missingEvidence: 'Verified production architecture diagram with service boundaries, environments, and failover patterns.', whyItMatters: 'Public descriptions show stack direction but not resilience or blast-radius detail.', diligencePath: 'Request platform architecture review and resilience testing summary.'}
  - {type: private-evidence-only, severity: material, topic: security, missingEvidence: 'Certification certificates, assessor details, audit dates, and in-scope systems for PCI DSS and ISO 27001.', whyItMatters: 'Framework references alone do not prove control maturity or environment coverage.', diligencePath: 'Request security assurance pack and latest certification letters.'}
  - {type: private-evidence-only, severity: material, topic: decisioning, missingEvidence: 'Model-performance, fraud-loss, approval-fairness, and bureau-mix metrics for underwriting and fraud controls.', whyItMatters: 'The underwriting engine is a core differentiator claim but public evidence is thin.', diligencePath: 'Request model-governance pack and monthly risk dashboards.'}
  - {type: private-evidence-only, severity: minor, topic: roadmap, missingEvidence: 'Current-account activation, cross-sell conversion, and product-level adoption metrics.', whyItMatters: 'Roadmap quality depends on actual customer migration into the broader banking suite.', diligencePath: 'Request product KPI dashboard with active users, balances, and cross-sell funnels.'}
