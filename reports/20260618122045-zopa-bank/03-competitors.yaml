- id: incumbent-and-specialist-competition
  title: Incumbent and Specialist Competition
  body: >-
    Specialist and incumbent alternatives matter because they often neutralize one product advantage at a time. Marcus, Tandem, and Atom can all compete aggressively in deposit-gathering or savings-led propositions, which means Zopa cannot assume above-market pricing will hold for long. OakNorth is less relevant for mass-market consumers but still shows how focused lenders can build strong niches without becoming universal banks. Meanwhile the incumbent banks retain advantages that are easy to underestimate from a fintech lens: salary account anchoring, branch familiarity, broad product menus, established fraud-response expectations, and the ability to bundle cards, savings, loans, and mortgages under one long-known brand. Those advantages do not stop challengers from winning secondary relationships, but they do slow primary-account capture. For Zopa, that means competition is not only about feature parity with Monzo or Revolut. It is also about whether customers choose Zopa instead of Marcus
    for savings, instead of a high-street bank for day-to-day payments, or instead of a specialist lender for a credit product. The competitive set is broad because different substitutes attack different parts of the economics stack.
