- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Profitable regulated-bank model
    - Peers with larger daily engagement may cross-sell into the same economics faster
    - High
    - Test product-level profitability and repeat usage by cohort against Monzo and Starling benchmarks
  - - Savings-led acquisition engine
    - Specialist savings brands and incumbents can compress rate advantage quickly
    - High
    - Review retention after teaser or best-buy periods and measure deposit beta
  - - Underwriting and credit expertise
    - Economic stress or conduct problems could impair credit-led moat claims
    - High
    - Request vintage loss curves, complaints, and repricing history by product
  - - Cross-sell into multi-product relationships
    - Customers may keep Zopa as a secondary account or secondary savings pot
    - Medium-High
    - Request data on primary-account adoption, product overlap, and churn by first-product entry
  - - Brand trust and app quality
    - Review platforms show customer sentiment can reverse quickly across challengers
    - Medium
    - Compare service SLAs, complaints, and review trends across Zopa, Monzo, and Revolut
  notes: The main durability risks are not speculative new entrants but better-capitalized peers, primary-account incumbency, and weak evidence that secondary users become sticky core relationships.
