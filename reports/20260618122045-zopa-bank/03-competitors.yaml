chapter:
  number: 3
  title: Competitors
  summary: >-
    Zopa competes most directly with Monzo, Starling, Revolut, Chase UK, and specialist savings or lending brands rather than with every incumbent bank equally. Its edge is a profitable, regulated, multi-product savings-and-credit model, but it is weaker than current-account-led peers on daily-engagement surface area and weaker than giant incumbents on balance-sheet power, bundled trust, and primary-account inertia. The competitive moat is therefore real but conditional: it improves if Zopa can convert funding, underwriting, and cross-sell discipline into durable relationship depth before broader app-led peers and large incumbents compress product differentiation.
sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: >-
    Zopa sits inside a layered competitive field rather than a single peer group. Direct digital-bank peers include Monzo, Revolut, Starling, and Chase UK, each of which competes for a mainstream consumer relationship through app-led distribution. A second ring includes specialist savings or lending brands such as Marcus, Tandem, Atom, and OakNorth, which overlap on one product lane without matching Zopa’s full consumer profile. A third ring is the incumbent high-street set—Barclays, Lloyds, NatWest, Santander and others—that still owns brand trust, salary-account primacy, and cross-product breadth even when their digital experience looks less differentiated. This matters because Zopa is not defending a unique feature category. It is defending a combination of regulated-bank credibility, attractive savings, unsecured credit economics, and an ambition to deepen into everyday banking. The category context therefore rewards careful peer selection: Monzo and Starling matter most for primary-account
    and current-account gravity, Revolut matters for ecosystem breadth and scale, Chase UK matters for subsidized entry, and specialists matter for product-level margin pressure.
