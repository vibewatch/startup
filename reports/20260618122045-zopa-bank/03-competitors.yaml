callouts:
- calloutType: insight
  title: Zopa’s real contest is for relationship depth, not just customer count
  body: >-
    The company does not need to out-scale Revolut or Monzo on headline users to win, but it does need to prove that profitable savings and credit relationships become broader and stickier over time.
  claimRefs:
  - CP013
  - CP020
  - CP033
  - CP035
- calloutType: risk
  title: Primary-account gravity still sits with stronger current-account brands and incumbents
  body: >-
    If customers continue to keep Zopa as a secondary savings or borrowing app while salary, payments, and daily engagement stay elsewhere, the moat will remain more fragile than the headline profitability story implies.
