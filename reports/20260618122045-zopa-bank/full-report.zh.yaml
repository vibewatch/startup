      - number: '8.2'
        title: 可比估值与市场背景
        blocks:
          - type: paragraph
            body: >-
              做可比估值必须先保持克制，因为没有哪一家同业与 Zopa 完全重合。Monzo 规模更大，平台宽度或许配得上溢价。Starling 在银行模式和盈利性上更接近，因此更适合作为锚点。OakNorth 是英国
              fintech 银行的成功案例，但它偏企业贷款，可比性有限。Nubank 展示了规模化、盈利型 neobank 在公开市场可能达到的上限；N26 的重估历史则提醒投资者，私募估值也会大幅压缩。Klarna 的
              IPO 背景还给出一条经验：公开市场的风险偏好已经有选择地回来了，但品类领导力和披露质量很重要。在这个背景下，Zopa
              当前隐含倍数看起来合理，而非亢奋。市场足以支撑一家盈利资产守住价值，但没宽松到可以无视行为合规或竞争风险。因此，Zopa 更像是估值公允到略有吸引力，而不是显然被错杀。
