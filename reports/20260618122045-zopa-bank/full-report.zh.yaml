      - number: '7.5'
        title: 风险缓释与放弃标准
        blocks:
          - type: paragraph
            body: >-
              风险案例的缓释侧并非空白。Zopa
              已有盈利能力、多元产品和可见资本市场通道，这些都为环境恶化时的应对争取时间。但只有投资人尽早跟踪正确指标，缓释才有意义。投诉、拨备、逾期、存款流出、服务中断和客户情绪恶化，是最有用的公开预警灯，因为它们贴近核心风险传导路径。正确的放弃标准因此应务实，而不是抽象。汽车金融暴露显著增加、存款持续外流、信用压力急剧上升，或重大运营事件，都足以触发重新承销公司，并可能下调价值。这一框架导向有纪律的结论：只有行为、资金和信用信号仍被严格控制时，Zopa
              的风险栈才可接受。如果几项同时转弱，投资论点应迅速重估，而不是乐观防守。
            claimRefs:
              - CR036
