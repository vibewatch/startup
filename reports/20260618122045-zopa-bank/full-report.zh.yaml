      - number: '8.4'
        title: 尽调问题与否决标准
        blocks:
          - type: paragraph
            body: >-
              剩余尽调的核心，是把一个中等置信度的公开市场论点，转成高确信度的私募市场定价决策。投资者不能只看表面估值。他们需要汽车金融敏感性包、资本和流动性压力测试、按产品拆分的 cohort 经济性，以及一份最新 cap
              table，说明优先权和老股转让经济性。退出准备也需要管理层直接给证据，因为公开盈利有帮助，但不足以支撑 IPO
              级披露，也不足以支撑溢价重估。否决标准同样务实：如果行为合规成本急剧上升、存款动能减弱、信用质量恶化，或重大运营事件损害信任，公允价值区间就应迅速下调。这些触发点并不意味着 Zopa
              今天不可投，而是说明它是一个对价格敏感的机会；尽调质量会决定正面论点能否变成一笔强投资，还是只是一笔带下行保护、但仅算合格的纪律型投资。
