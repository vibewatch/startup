companyProfile:
  summary: >-
    Zopa Bank Limited 是一家总部位于伦敦的受监管数字银行，源头可追溯到 2005 年，当时它推出了全球首个 P2P 借贷市场。Zopa 在英国 P2P 信贷领域先行 15 年后，于 2020
    年取得完整英国银行牌照，转向由存款供资的零售银行业务。今天的 Zopa 提供储蓄账户、信用卡、个人贷款，以及最近推出的 Biscuit 活期账户。到 2025 年底，Zopa 约有 170 万客户、£6.4B 存款、£3.8B
    总贷款，基础税前利润达到 £65M——是在规模化后仍能盈利的少数英国新银行之一。CEO Jaidev Janardana 自 2014 年起领导公司。公司在 2024 年 12 月以超过 $1B 的估值融资 $87M 股权资金（由
    A.P. Moller Holding 领投），并在 2025 年 5 月通过一次具有标志意义的 LSE 债券上市募集 £80M AT1 资本。公司目前没有 IPO 计划。
