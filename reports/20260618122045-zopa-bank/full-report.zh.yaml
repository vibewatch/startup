        title: 传统银行与专业机构竞争
        blocks:
          - type: paragraph
            body: >-
              专业机构和传统银行替代品重要，因为它们往往一次中和一个产品优势。Marcus、Tandem 和 Atom 都能在吸收存款或储蓄主导产品上激进竞争，这意味着 Zopa
              不能假设高于市场的定价能长期维持。OakNorth
              对大众消费者没那么相关，但仍展示了专注型贷款机构如何在不成为全能银行的情况下建立强利基。与此同时，传统银行保留的优势，很容易被金融科技视角低估：工资账户锚定、网点熟悉度、宽产品菜单、既有欺诈响应预期，以及把卡、储蓄、贷款和按揭打包在一个长期熟悉品牌下的能力。这些优势不会阻止挑战者赢得次级关系，但会放慢主账户获取。对
              Zopa 而言，竞争不只是与 Monzo 或 Revolut 做到功能同等；还要看客户是否选择 Zopa 而非 Marcus 做储蓄，选择 Zopa 而非高街银行处理日常支付，或选择 Zopa
              而非专业贷款机构使用某个信贷产品。竞争集合很宽，因为不同替代者攻击经济栈的不同部分。
