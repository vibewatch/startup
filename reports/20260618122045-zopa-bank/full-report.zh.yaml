            body: >-
              Zopa 的产品架构最好理解为一组面向客户的模块，叠在共享的受监管银行栈之上。个人贷款仍是业务锚点，因为它历史最久，也最清楚被验证；但日常银行主张已经延伸到活期储蓄、现金
              ISA、信用卡、活期账户、汽车金融，以及正在出现的投资或儿童投资邻近业务。这种宽度重要，因为平台价值不主要来自某个单一
              SKU，而来自把客户从一个有资金关系的产品迁移到多个产品的能力。公开证据支持多数模块的存在和战略作用，但成熟度并不均匀：贷款、储蓄和卡看起来已规模化；活期账户更新；投资功能似乎更多由合作伙伴主导或仍在萌芽。实际产品问题因此是成熟度和交叉销售深度，而不是
              Zopa 是否已经走出贷款起点。
