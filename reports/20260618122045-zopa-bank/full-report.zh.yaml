      - number: '7.2'
        title: 信用与财务风险
        blocks:
          - type: paragraph
            body: >-
              Zopa
              的财务风险锚定在资产负债表结构上。公司现在在消费贷款和零售存款上已有有意义规模，这有利于盈利，但也让它对宏观条件敏感。以数十亿英镑计的贷款账簿意味着，逾期率或损失率的小幅变化，都可能对利润和资本生成产生放大后果，尤其因为公开披露在减值细节上比收入表现更薄。与此同时，资金模型高度依赖消费者储户。这通常比批发资金便宜，但让银行容易受到利率竞争和信心冲击影响。如果
              Bank of England 降息而存款定价仍有竞争压力，净息差也可能压缩。信用、资金和利润率风险因此相互强化。单看任何一个暴露都不致命，但合在一起解释了为什么风险纪律必须成为投资论点的一部分，而不是事后补充。
