            body: >-
              采用看起来可信，因为 2024 年至 2026 年的多个引用指向同一方向：客户更多、卡更多、存款更多。报告中客户数从 2024 年底约 135 万增至 2025 年底约 170 万，说明 Zopa 即使走出最初的
              P2P 身份后，仍在增加家庭客户。增长不只是 logo 或下载量。约 £6.4B 存款基础说明客户把有分量的余额交给 Zopa；超过 47
              万张已发行信用卡则显示，产品扩张已超出储蓄和个人贷款。最重要的细微差别是，已安装客户基数仍远低于更广英国数字银行机会，因此增长看起来尚未触及结构性天花板。与此同时，获客中相当一部分似乎由利率驱动，这可以快速放量，但如果竞争对手在价格上更激进，也可能反转。
