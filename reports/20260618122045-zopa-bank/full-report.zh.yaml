appendices:
  - id: A
    title: 融资与投资者历史
    blocks:
      - type: paragraph
        body: >-
          从 2005 年创立到 2026 年中，Zopa 通过股权轮次和 AT1 资本累计融资约 $1.2 billion。主要节点包括为支撑 2020 年银行牌照而融资 £220M， 2021 年由 SoftBank
          领投、估值 $1B 的 $300M Series F，以及 2024 年 12 月由 A.P. Moller Holding 领投、估值 >$1B 的上调估值融资。 2025 年 5 月，Zopa 在伦敦证券交易所挂牌
          £80M AT1 债券，这是 Zopa 第一只公开资本市场工具。按 CEO 表态，公司目前没有 IPO 计划。
        claimRefs:
          - CO011
          - CO012
  - id: B
    title: 监管摘要
    blocks:
      - type: paragraph
        body: >-
          Zopa Bank Limited（FCA 机构编号：800542）获 Financial Conduct Authority 和 Prudential Regulation Authority
          授权，是一家英国零售银行。 最高 £85,000 的客户存款受 Financial Services Compensation Scheme 保护。当前最实质的监管敞口，是 FCA 面向全行业的汽车金融佣金调查；Zopa
          已计提约 £8 million 拨备。 另在 2025 年，Zopa 成为首家获 FCA 许可、可在建议缺口改革框架下提供「定向支持」的英国银行，在投资指导上拿到监管先发优势。
        claimRefs:
          - CO002
