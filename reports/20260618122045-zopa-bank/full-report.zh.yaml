  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Zopa
              应放在英国零售银行业里分析，但不能把整个资产负债表宇宙同等加权。相关边界包括家庭存款、无抵押消费贷款、信用卡、活期账户关系，以及可迁移到数字渠道的税收优惠储蓄或投资余额。大型公司银行、保险制造、商户收单，以及大多数以按揭驱动的经济账不应纳入核心范围，因为
              Zopa 还不是这些场景的核心买方选择。Bank of England 和 UK Finance 数据说明外层市场显然很大；FCA、CMA、Open Banking、Which 和 Moneyfacts
              证据则解释数字分发为何重要：消费者能快速比较利率，比以往周期更容易转移资金，也越来越期待移动优先的服务。即便如此，Zopa
              的可服务池仍窄于整个英国银行体系，因为许多家庭仍把工资账户、按揭关系或复杂金融需求留给传统银行。实际市场边界因此是这样一部分英国成年人：他们愿意信任数字优先提供商来处理储蓄、借贷，并最终处理日常银行业务，而不是英国金融资产里的每一英镑。
