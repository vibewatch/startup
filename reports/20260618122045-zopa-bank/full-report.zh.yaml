      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              理解 Zopa 时，领导层格外关键，因为公司从市场先行者转向盈利银行的过程，一直由少数可见度较高的高管讲述。Jaidev Janardana
              是银行最核心的公众面孔；同时，领导层页面和第三方高管目录显示，公司在财务、风险、合规、技术、客户和战略等职能上正在补强。治理层面，Giles Andrews 留任董事会，保留了与创立时代的强连接；SoftBank
              代表 Max Ohrstrand 和其他非执行董事也体现出投资人影响力。这一组合强于纯创始人中心的金融科技公司，但并未消除关键人物风险：接班安排、具体董事会委员会结构和内部持股仍未公开。尽调视角下，关键结论是
              Zopa 的领导班子已经具备机构可信度，但公司仍高度依赖少数决策者来维持战略一致性和监管信任。
