        blocks:
          - type: paragraph
            body: >-
              关键尽调问题已经不再是 Zopa 能否产生收入和利润，而是投资人能否把利润完整拆解为稳定利差收入、正常化信用成本和可重复经营杠杆。公开报道没有提供产品级收入组合、法定 CET1 和流动性比率、存款成本、逾期和核销
              vintages，或按分群实现的
              APR。它也没有说明利润率故事有多少依赖异常有利的利率环境，有多少来自结构性承销优势。汽车金融拨备显示，即便在盈利年份，行为和信用问题仍可能打断盈利叙事。投资工作中，正确下一步是管理层数据室，把分群收益率、信用损失、资金成本、获客渠道和资本消耗，在基础情景和压力情景下连接起来。没有这座桥，Zopa
              公开财务故事在方向上具备投资性，但细节仍不完整。走到这个阶段的贷款机构，应该用 cohort、资本和资金管理数据承销，而不是只看新闻稿级 KPI 和标题增长数字。资金管理组合也太重要，不能略过。
