  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              在下行案例中，监管和法律风险最值得关注，因为它可能比底层客户增长或产品动能变化得更快。FCA 的汽车金融佣金审查是最清晰的实时问题。即使 Zopa
              已经确认拨备，最终成本路径仍取决于审查结果、判例法方向和索赔渠道行为。Consumer Duty
              增加了第二层约束，迫使董事会持续证明良好客户结果，而不只是上线时证明。实际含义是，盈利的挑战者银行如果投诉、披露或销售行为恶化，仍可能承受有分量的补偿、运营分心和声誉损害。FCA 和 PRA
              监管也重要，因为任何失误都会落在持牌银行身上，而不是轻监管 app 身上。因此，法律姿态并非假设问题，而是一个常驻承销变量，直接关系到资本、信任和估值。
