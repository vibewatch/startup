      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              最干净的规模分层，从英国家庭存款和消费信贷余额开始，再收窄到可被数字渠道争夺的余额，最后落到 Zopa 当前足迹。Bank of England 序列支持约 £1.9T 家庭存款和约 £230B
              未偿消费信贷；UK Finance 数据则指向其中规模很大的无抵押个人贷款池。储蓄加零售贷款的外层 TAM
              因此可辩护地达到数万亿英镑，且尚未计入活期账户资金流。下一步不是假装所有余额都同样可触达。Statista、Accenture、Deloitte、PwC 和 KPMG
              都支持一个判断：挑战者银行和数字银行采用已成主流，但仍只是总余额的子集；这意味着 SAM 更小，可能位于数千亿英镑低位，而不是完整英国零售银行存量。Zopa 当前 SOM 小得多，但已经有意义：2025
              年公开披露显示，存款和贷款合计约 £10.2B，客户约 170 万。因此，证据支持一种分层视角：TAM 庞大，数字银行 SAM 受约束，而可见 SOM 可信但相对于可获得池仍处早期。
