      - number: '6.4'
        title: 留存、交叉销售与集中风险
        blocks:
          - type: paragraph
            body: >-
              留存是客户故事中最不透明的部分，因为公开来源没有给出精确流失、cohort 或 NRR 表。最好的代理指标，是 Zopa 披露超过 25%
              客户持有两个或更多产品，这意味着银行正在把有意义的少数家庭转化为更深关系。这很重要，因为先储蓄、后增加贷款或卡的客户，比纯利率购物者更难被挖走。即便如此，耐久性因产品而异。储蓄余额可以有黏性，但仍暴露在利率竞争下；贷款除非被交叉销售，否则期限有限；卡可以加深参与，但会受不利审批或额度体验影响。因此，集中风险不是某个具名客户离开，而是许多小储户或
              app 用户同时因更差利率或更差服务做出反应。正确尽调镜头是 cohort
              经济性、产品配对转化、投诉趋势线监测，以及按客户年限、渠道和余额规模拆分的产品配对贡献利润率。这些细节能区分真正忠诚和暂时性利率驱动使用。
