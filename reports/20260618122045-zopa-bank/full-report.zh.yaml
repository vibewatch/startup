  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Zopa 处在分层竞争场中，而不是单一同业组里。直接数字银行同业包括 Monzo、Revolut、Starling 和 Chase UK，它们都通过 app 主导的分发争夺主流消费者关系。第二圈包括
              Marcus、Tandem、Atom 和 OakNorth 等专业储蓄或贷款品牌，它们在单一产品赛道上重叠，但没有 Zopa 的完整消费者画像。第三圈是
              Barclays、Lloyds、NatWest、Santander 等传统高街银行，它们即便数字体验差异化较弱，仍握有品牌信任、工资账户主导权和跨产品宽度。关键在于，Zopa
              不是在防守一个独特功能品类，而是在防守受监管银行可信度、有吸引力的储蓄、无抵押信贷经济性，以及向日常银行深化的野心这一组合。因此，品类语境奖励谨慎选择同业：Monzo 和 Starling
              对主账户和活期账户引力最重要；Revolut 代表生态宽度和规模；Chase UK 代表补贴式进入；专业机构则压迫产品层利润率。
