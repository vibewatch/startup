    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zopa Bank Limited 现在把自己定位为受监管的英国数字银行，而不只是 2000 年代中期让品牌成名的 P2P 贷款机构。公司公开材料与 FCA 登记信息在法律主体、伦敦总部，以及 FCA/PRA
              双重监管边界上相互吻合。这一点重要，因为它把 Zopa 从市场撮合中介重新框定为由存款供资、承担资产负债表风险的贷款机构，并带有更广的日常银行野心。当前产品覆盖储蓄、无抵押贷款、信用卡、活期账户、汽车金融、ISA
              和投资邻近业务，因此 Zopa
              的身份是后续每个尽调章节的基础。历史脉络仍然重要：管理层对更有人味、更易获得金融服务的原始使命仍有表述，但运营模型已经清楚转向多产品零售银行，优化目标是交叉销售、资金稳定性和受监管盈利能力。
