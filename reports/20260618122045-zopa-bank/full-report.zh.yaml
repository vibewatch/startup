      - number: '3.4'
        title: 竞争护城河与耐久性
        blocks:
          - type: paragraph
            body: >-
              Zopa
              的护城河最好理解为一组能力，而不是单一平台边缘。盈利能力、存款供资、承销能力，以及多产品储蓄加信贷栈，都是有意义的强项；在挑战者银行阵营里，一些同业仍更强调增长叙事或宽产品铺摊，而非已验证盈利。不过，护城河并非绝对。以活期账户为先的同业拥有更多日常参与度；套餐驱动同业可以在息差之外变现；传统银行能用更深资产负债表交叉补贴产品。评论来源也显示，整个品类的信任仍可被争夺；没有一家
              app 主导银行能免于服务失败或情绪反转。耐久性问题因此落在转换成本和关系深度上。如果 Zopa
              能把一个储户或借款人变成重复、多产品用户，其经济性应会改善。否则，价格透明和轻松多栖，会让它一边暴露给更强品牌，另一边暴露给更好利率。投资人因此应把护城河评为可信，但取决于交叉销售执行、主账户进展，以及盈利能力在竞争中可持续的持续证据。
