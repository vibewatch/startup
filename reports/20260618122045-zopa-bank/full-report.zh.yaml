      - number: '1.5'
        title: 里程碑与不利事件
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支撑了一个连贯故事：Zopa 在 2005 年开创英国消费金融科技，2020 年取得银行牌照，2021 年达到独角兽估值，2024 年确认该估值，并在 2025 年通过 AT1
              实现资本结构多元化。这一路径与许多仍在亏损或战略模糊的同业明显不同。与此同时，这条时间线不应被理解为毫无摩擦的成功故事。当前报道反复提到与 FCA 佣金审查相关的约 £8M
              汽车金融拨备；投诉导向来源也显示，借贷实践和消费者结果仍属于尽调表面。不利事项没有否定运营进展，但它们会影响承销判断，因为受监管贷款机构可能很快从增长叙事转入行为监管审视。完整投资案例因此必须同时容纳两件事：Zopa
              比许多金融科技同业更成熟，但仍带着成长型消费银行常见的监管和声誉尾部风险。
