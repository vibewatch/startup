        title: 收入来源与盈利能力
        blocks:
          - type: paragraph
            body: >-
              公开报道显示，Zopa 已经拥有真正银行规模的利润表，而不是只靠增长话术支撑的早期金融科技故事。证据最强的数据点是：2024 年收入约 £380.7M，2025 年收入 £377.1M，2025 年基础税前利润约
              £65M，而上一年约
              £30M。这一模式意味着收入增速略趋平，但经营杠杆大幅改善；这很重要，因为受监管消费贷款机构即使报告收入没有飙升，也能靠更好的资金组合、定价纪律和信用控制创造股权价值。收入质量看起来也强于手续费主导的金融科技模型，因为业务似乎锚定在个人贷款、汽车金融、信用卡和储蓄利差带来的经常性净利息收入上，另有较小的交换费和手续费贡献。它也说明经济账现在更依赖资产负债表执行，而不是一次性合作或推荐收入。
