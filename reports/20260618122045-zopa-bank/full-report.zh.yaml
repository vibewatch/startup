      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自数字习惯形成、更容易的数据可携带，以及消费者持续比较可见利率。Open Banking 降低了部分开户摩擦，app
              原生服务削弱了网点在简单产品上的优势。储蓄意识提高，也有利于能清楚宣传收益率的挑战者。与此同时，利率周期是双刃剑：有吸引力的存款利率能吸入余额，但更高借贷成本会压低信贷需求并增加可负担性压力。传统银行仍握有信任、品牌熟悉度、工资账户锚定和产品打包优势，因此数字采用不会自动转化为主账户地位。监管压力也是实际约束。Consumer
              Duty 期望、行为审查，以及汽车金融或无抵押贷款问题，都可能迫使重新定价或放慢扩张。公开数据也留下重要缺口：没有经审阅来源给出一个与 Zopa 对齐的 SAM
              数字；品类级估算混合了用户、余额和收入，难以整齐比较。尽调中，值得投资的问题因此不是英国数字银行是否已经有规模，而是 Zopa 能否在竞争性子集中持续复利，同时不牺牲承销纪律或资金经济性。
