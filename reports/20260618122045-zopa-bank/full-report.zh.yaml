      - number: '2.3'
        title: 买方与分群图谱
        blocks:
          - type: paragraph
            body: >-
              需求侧更多按金融行为分层，而不是按法律实体规模分层。对利率敏感的储户、数字化自信的专业人士、循环信用用户，以及试图整合资金管理的年轻家庭，是最明显的数字银行群体。他们的工作流并不相同。储户往往因为比较网站展示领先利率而进入，然后判断服务和信任是否足够强，能否把余额留下。借款人更看重速度、清晰度和通过
              app
              完成服务，而不是实体网点。活期账户用户的信任门槛更高，因为工资入账、账单支付设置和卡片可靠性，比多开一个储蓄罐更有惯性。这使得买方、用户和付款方实质上都是同一个消费者，但预算所有权仍随产品时点变化：储蓄预算来自家庭流动性决策，无抵押借款则与可负担性和再融资选择竞争。Zopa
              的交叉销售野心重要，因为单一产品储户比同时使用存款、卡和贷款的客户更容易流失。因此，市场奖励能把低摩擦首个产品转化为更广金融关系的提供商，前提是不过度拉伸承销或服务质量。
