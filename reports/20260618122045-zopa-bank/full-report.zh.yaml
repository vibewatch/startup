      - number: '8.3'
        title: 情景分析：熊市、基准、牛市
        blocks:
          - type: paragraph
            body: >-
              情景框架刻意保持简单，因为公开证据足以支撑方向性区间，却不足以做精确 DCF。熊市情景下，汽车金融成本扩大、净息差收缩、竞争压力拖慢客户变现，公允价值会被推向约 £0.7 billion。基准情景下，Zopa
              维持盈利和温和增长，同时把风险事件控制住，可支撑约 £0.9 billion 的估值，也大体贴近最近披露的独角兽估值。牛市情景下，盈利显著放大、退出市场改善，投资者按更接近 4 倍收入的成长质量给 Zopa
              重估，对应约 £1.5 billion。核心结论是，当前表面估值没有留下很大的犯错空间，但相对同业也不荒唐。多数上行来自信心和流动性重估，多数下行来自行为合规、资金或信用压力。
