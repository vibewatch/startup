      - number: '5.4'
        title: 信任、合规与路线图
        blocks:
          - type: paragraph
            body: >-
              信任和路线图尽调与功能宽度同样重要，因为 Zopa 是一家受监管消费银行，大规模处理卡、支付、存款、个人数据和信贷决策。公开标准引用支持把 PCI DSS、ISO 27001 和 NCSC
              式网络控制作为银行的正确框架，但来源包无法完整证明范围、审计日期，或每个产品环境是否都落在同一认证边界内。公开招聘、GitHub
              活动和开发者表面证据确实显示，公司持续投资平台、数据、工程和产品岗位，这与日常银行扩张议程一致，而不是一个冻结的产品集。不过，本章主要尽调缺口是，公开材料没有披露事件指标、正常运行时间承诺、详细 ML
              表现，或第三方验证的架构图。路线图案例有希望，但产品成熟度和控制成熟度应分开承销。这一区分很重要，因为在快速扩张的数字银行里，功能宽度可能跑在已验证控制深度前面，尤其当合作伙伴和监管者都处在关键路径上。执行纪律每一天都仍是核心。
