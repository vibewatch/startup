  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议
        blocks:
          - type: paragraph
            body: >-
              Zopa 的正面逻辑很直接：它已经不是一家只会讲客户增长故事的投机型
              fintech。公开证据显示，它是一家已经盈利的英国数字银行，手里有可观存款、真实信贷产品，也有足够大的客户基础，可以支撑多产品飞轮。这很关键，因为市场对盈利金融平台的容忍度，高于烧钱换增长的故事。反面逻辑同样清楚。汽车金融悬而未决、更大挑战者银行的竞争、以及私营公司披露有限，意味着投资者买入的仍是不确定性，不只是上行空间。因此建议可以偏正面，但必须克制。如果入场价格不高于审慎的基准情景估值，买入评级站得住；但强力买入会夸大确定性，因为几项关键经济性仍未公开。简言之，Zopa
              看起来值得投，但必须正视那些会侵蚀当前表面合理估值倍数的下行通道。
