      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Zopa 的资本历史分为三个阶段：P2P 时代的风投资金支持、2020 年银行牌照转型前后的过渡资本，以及公司可被视作拥有增长存款基础的数字银行后取得的更大规模机构融资。2021 年 SoftBank
              领投轮是最清晰的里程碑，因为它确认了独角兽估值，也让全球金融科技市场认可银行转型。2024 年 A.P. Moller Holding 轮融资的意义不同：在金融科技估值倍数整体重置之后，它再次确认估值高于
              $1B。2025 年 AT1 发行又增加了第二条资本渠道，说明 Zopa
              能在股权之外补充适合成熟银行的监管资本。仍然不透明的是股权集中度、清算优先权，以及早期风投股东之间是否存在二级转让。因此，外部观察者能看清融资时间线和大致规模，却还看不到完整控制权经济账。
