            body: >-
              相比网点密集型银行，运营风险对 Zopa 更重要，因为品牌承诺几乎完全数字化。一旦 app、服务栈或底层平台受损，客户会很快且公开地感受到。最大依赖似乎是与 Thought Machine
              的核心银行关系，并由更广云和基础设施层支撑。这套架构可以现代、高效，但也意味着供应商集中、部署纪律和故障恢复会变成核心控制问题。网络安全和欺诈威胁同样与主张不可分割，因为 app
              主导的消费银行始终暴露在身份、支付和客户信任攻击下。公开来源也暗示，公司处在持续执行环境中，而不是冻结的稳态：招聘和平台工作仍在推进。风险结论不是 Zopa
              的技术模型弱，而是韧性、事件响应和变更管理对守住客户结果和监管信心都必不可少。
