      - number: '4.2'
        title: 定价模型与单位经济
        blocks:
          - type: paragraph
            body: >-
              Zopa 的定价模型体现的是资产负债表型消费银行经济账，而不是订阅软件公司经济账。公开标价显示，无抵押个人贷款 APR 通常位于十几个百分点中高段或 20% 出头，储蓄产品 AER
              维持在有竞争力的中个位数，信用卡 APR 位于 20% 后段，汽车金融覆盖高个位数到十几个百分点中段的宽区间。这些标价不披露按 cohort 实现的收益率，但勾勒出模型背后的利差逻辑。由于 Zopa
              现在交叉销售存款、贷款、卡和接近活期账户的服务，最重要的单位经济问题是获客成本、生命周期价值、回本周期，以及扣除资金成本和预期损失后的总贷款利润率。公开证据支持方向性估计，但按渠道实现的
              CAC、经损失调整的单位利润率和 cohort 回本仍需要管理层尽调。
