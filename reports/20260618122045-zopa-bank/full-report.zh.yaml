      - number: '4.3'
        title: 资本充足与资金结构
        blocks:
          - type: paragraph
            body: >-
              Zopa 最重要的承销变化，是资金现在看起来主要由存款驱动，而非风投资金驱动；股权和 AT1 充当审慎缓冲和增长助推器，而不是日常流动性支持。2025 年底约 £6.4B 客户存款，对应约 £3.8B
              总贷款账簿，意味着零售资金覆盖有分量，也留出了一定流动性管理空间。2025 年 5 月 £80M AT1
              发行尤其值得注意，因为它标志着公司触达新的监管资本渠道，并降低了对普通股融资轮的单一依赖。即便如此，资本充足率并不完全透明。来源包中的公开材料没有披露干净的 CET1 比率，因此外部分析只能根据同业实践、Zopa
              的盈利能力和新增 AT1 层，推断一个可信的十几个百分点中段区间。这使资本方向上可信，但仅凭公开证据还不能完全承销。
