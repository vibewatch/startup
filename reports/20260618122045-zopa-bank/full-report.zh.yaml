      - number: '5.3'
        title: 技术栈与运营架构
        blocks:
          - type: paragraph
            body: >-
              最有后果的公开技术事实，是 Zopa 使用 Thought Machine Vault，因为这意味着它采用现代核心账本和产品工厂模型，而不是打补丁的遗留栈。围绕这个核心，银行似乎依赖以 AWS 为中心、搭配部分
              Google Cloud 服务的云基础设施组合；开发者表面包括公开开发者域名和 Open Banking
              兼容信号。信贷决策和欺诈控制似乎依靠内部模型，并结合征信机构等外部数据提供商；支付和卡功能则依赖英国标准支付轨道和全球卡组织网络。架构上行空间在于可配置性，以及新产品更快的上线周期。下行在于集中风险：少数基础设施、账本、支付和数据伙伴，一旦服务质量、经济账或监管环境变化，就可能成为单点故障或议价压力来源。
