      - number: '1.4'
        title: 规模、盈利能力与覆盖缺口
        blocks:
          - type: paragraph
            body: >-
              2025 年和 2026 年的公开报道让 Zopa 在英国私营挑战者银行中显得少见：公司同时具备独角兽估值身份，并反复披露盈利。现有数字显示，2024 年收入约 £380.7M，2025 年收入
              £377.1M，基础税前利润大幅升至约 £65M，成本收入比也在改善。资产负债表规模同样可观：到 2025 年底，客户存款约 £6.4B，总贷款账簿约 £3.8B。客户动能也有分量，客户约 170
              万，并发行了大量信用卡。不过，封面指标并非同样有证据支撑。员工人数无法从来源包中干净交叉验证，NPS 等部分客户体验指标仍来自公司口径，而非独立审计。审慎的尽调立场因此是：Zopa
              的规模和盈利能力可信，但若干运营细节层仍未公开。
