  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与画像
        blocks:
          - type: paragraph
            body: >-
              Zopa 的客户基础更应理解为零售银行组合，而不是单一同质的“用户”类别。银行似乎聚焦于数字化参与度较高的英国成年人：他们愿意比较储蓄利率、使用 app
              服务，并持有日常消费信贷产品，而无需去网点。公开证据对四类人群最强：储户、个人贷款借款人、持卡人，以及规模较小但战略价值更高的多产品客户。对零售银行来说，具名客户证据不是企业客户 logo
              页，而是跨产品页面、评论平台、比较表和投诉渠道累积起来的 cohort 证据。这意味着买方、用户和付款方通常是同一个人，获客因此更简单，但合同锁定也更弱。Zopa
              的核心分群足够宽，可以全国化扩张；同时又足够窄，仍围绕主流个人金融，而不是利基富裕客群或 SME 银行业务。
