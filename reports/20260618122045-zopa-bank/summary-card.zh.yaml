  topStrengths:
    - 已经在规模上盈利——Zopa 是英国少数能持续扩大税前利润的新银行之一（2025 年 £65M），下行韧性少见。
    - 成本收入比 34.8%，行业领先，显示经营杠杆高、技术驱动效率强。
    - 18 年自有借贷数据支撑贷款和信用卡风控模型，形成耐久竞争护城河。
    - 公司向日常银行扩张（Biscuit 活期账户、投资），收入不再只押注净息差。
    - SoftBank、A.P. Moller Holding 等深度机构背书，加上 AT1 债券成功上市，强化了资本市场信用。
  topRisks:
    - 汽车金融佣金调查：FCA 调查影响整个行业；Zopa 已计提约 £8M，但最终裁定前总敞口仍不确定。
    - 资本充足的同业（Monzo、Revolut、Starling、Chase UK）加速切入 Zopa 核心储蓄和借贷市场，竞争强度上升。
    - 若英国基准利率下行快于预期，净息差会被压缩，贷款利差和存款收入承压。
    - CEO Jaidev Janardana 自 2014 年起主导战略，关键人依赖高；若领导层更替，不确定性会显著上升。
    - 客户规模差距明显：Zopa 1.7M 客户对 Monzo 13M，议价能力、品牌认知和交叉销售池都受限。
  unresolvedGaps:
    - 完整优先权结构和清算瀑布未披露，稀释敏感性和下行回收无法精确建模。
    - 按产品线拆分的 CAC 和 LTV 未公开，限制单位经济性尽调精度。
    - 汽车金融 FCA 调查对 Zopa 的最终成本仍未量化，公开信息仅有 £8M 计提。
    - 技术架构、供应商合同条款和云成本结构细节需要管理层访谈。
    - Biscuit 活期账户牵引数据（开户数、主账户认定率）尚未公开披露。
