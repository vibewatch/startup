- id: FI004
  title: Customer Relationship Economics Bridge
  type: flow
  layout: standard
  summary: The customer-economics story depends on acquisition cost, activation into credit or savings, cross-sell depth, and the speed of payback.
  data:
    nodes:
    - label: Customer acquisition
      note: Paid and organic acquisition establishes initial CAC
    - label: Product activation
      note: Customers activate into savings, loans, cards, or current account
    - label: Cross-sell expansion
      note: A second or third product raises balances and engagement
    - label: Lifetime gross profit
      note: Spread income and fees accumulate across the relationship
    - label: Payback and retained value
      note: Faster payback improves capital efficiency and supports further growth
  approximationNotes: Public sources do not disclose realized CAC or payback curves, so this bridge is qualitative around estimated economics.
