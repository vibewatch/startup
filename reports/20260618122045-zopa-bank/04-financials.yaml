  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital
    missingEvidence: Statutory CET1, total capital ratio, leverage ratio, and liquidity coverage disclosures.
    whyItMatters: These ratios determine whether growth is genuinely well capitalized or only directionally plausible from press coverage.
    diligencePath: Request the latest board pack, ICAAP summary, and prudential reporting extracts.
  - type: private-evidence-only
    severity: material
    topic: credit-losses
    missingEvidence: Vintage delinquency, charge-off, and recovery data by product and origination cohort.
    whyItMatters: Loss behavior is the missing link between attractive APRs and durable economic profit.
    diligencePath: Request monthly risk dashboards and back-book monitoring by cohort.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Realized CAC, funded-product activation rates, payback curves, and segment LTV.
    whyItMatters: Estimated unit economics are useful for directional analysis but not sufficient for underwriting precision.
    diligencePath: Request acquisition-channel analytics and cohort gross-profit views.
  - type: conflicting-data
    severity: minor
    topic: motor-finance
    missingEvidence: A precise bridge from motor-finance provision to downside scenarios and legal exposure.
    whyItMatters: Conduct costs can distort otherwise improving profitability if assumptions change.
    diligencePath: Request provision methodology, scenario memos, and legal counsel summary for the review.
