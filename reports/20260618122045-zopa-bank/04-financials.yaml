chapter:
  number: 4
  title: Financials
  summary: 'Zopa Bank enters 2026 with a stronger financial profile than many UK challenger-bank peers: roughly £377.1 million of 2025 revenue, about £65 million of underlying pre-tax profit, a £6.4 billion deposit base, and a £3.8 billion gross loan book. The core question is not whether a real earnings engine exists, but how durable that engine remains under funding-cost, credit-loss, and regulatory stress. Public evidence supports a deposit-funded model with improving leverage, yet still leaves important underwriting gaps around statutory capital, cohort losses, and realized pricing.'
sections:
- id: revenue-streams-and-profitability
  title: Revenue Streams and Profitability
  body: >-
    Public reporting indicates that Zopa already has a real bank-scale income statement rather than an early-stage fintech story built only on growth rhetoric. The strongest supported datapoints are roughly £380.7 million of revenue in 2024, £377.1 million in 2025, and about £65 million of underlying pre-tax profit in 2025 versus about £30 million in the prior year. That pattern implies slightly flatter top-line growth but much better operating leverage, which matters because a regulated consumer lender can create equity value through better funding mix, pricing discipline, and credit control even when reported revenue is not surging. The quality of revenue also looks stronger than fee-led fintech models because the business appears anchored in recurring net interest income from personal loans, car finance, cards, and savings spread, with smaller interchange and fee contributions on top. It also suggests the economics now depend more on balance-sheet execution than on one-off partnership or referral income.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
