- id: capital-adequacy-and-funding-structure
  title: Capital Adequacy and Funding Structure
  body: >-
    The most important underwriting shift at Zopa is that funding now appears primarily deposit-led rather than venture-led, with equity and AT1 serving as prudential buffers and growth enablers instead of daily liquidity support. End-2025 customer deposits of about £6.4 billion compare with a gross loan book of about £3.8 billion, implying meaningful retail funding coverage and some room for liquidity management. The May 2025 £80 million AT1 issuance is especially notable because it signals access to a new regulatory-capital channel and reduces dependence on common-equity rounds alone. Even so, capital adequacy is not fully transparent. Public materials do not disclose a clean CET1 ratio in the source pack, so outside analysis must infer a plausible mid-teens range from peer practice, Zopa's profitability, and the added AT1 layer. That makes capital directionally credible, but not fully underwritten from public evidence alone.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
