callouts:
- calloutType: strength
  title: Profitability is now part of the thesis, not just the aspiration
  body: The strongest financial signal is that Zopa appears to have crossed from venture-backed growth narrative into durable bank-style profitability. That shift changes the diligence lens from survival financing to earnings quality, capital efficiency, and resilience under stress.
  claimRefs:
  - CI001
  - CI002
  - CI020
  - CI021
- calloutType: risk
  title: Credit and conduct detail still govern downside risk
  body: Motor-finance provisioning and the lack of public cohort-loss disclosure mean investors still cannot fully see whether yield, credit quality, and compliance are balanced optimally. The next diligence layer must connect profit claims to loss behavior and capital consumption.
  claimRefs:
  - CI029
  - CI030
  - CI033
  - CI035
