- id: pricing-model-and-unit-economics
  title: Pricing Model and Unit Economics
  body: >-
    Zopa's pricing model reflects the economics of a balance-sheet consumer bank rather than a subscription software company. Public list pricing suggests unsecured personal loans generally sit in the mid-to-high teens or low twenties APR, savings products remain competitive around mid-single-digit AERs, credit cards price in the high twenties APR range, and car finance spans a broad single-digit to mid-teen APR band. Those list rates do not reveal realized yield by cohort, but they do frame the spread logic behind the model. Because Zopa now cross-sells deposits, loans, cards, and current-account-adjacent services, the most important unit-economics questions are customer acquisition cost, lifetime value, payback period, and gross lending margin after funding cost and expected losses. Public evidence supports directional estimates, but realized CAC by channel, loss-adjusted unit margin, and cohort payback still require management diligence.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
