              Operational risk matters more for Zopa than for a branch-heavy bank because the brand promise is almost
              entirely digital. If the app, the servicing stack, or the underlying platform is impaired, customers feel
              it quickly and publicly. The biggest dependency appears to be the core-banking relationship with Thought
              Machine, supported by broader cloud and infrastructure layers. That architecture can be modern and
              efficient, but it also means vendor concentration, deployment discipline, and outage recovery become core
              control questions. Cyber and fraud threats are similarly inseparable from the proposition because an
              app-led consumer bank is always exposed to attacks on identity, payments, and customer trust. Public
              sources also imply a living execution environment rather than a frozen steady state, with hiring and
              platform work still ongoing. The risk conclusion is not that Zopa’s technology model is weak; it is that
              resilience, incident response, and change management are essential to preserve both customer outcomes and
