      - number: '7.4'
        title: People, Execution, and Strategic Risk
        blocks:
          - type: paragraph
            body: >-
              Zopa is more institutionally developed than a founder-led startup, but execution and strategy still depend
              on a relatively small set of executives. Jaidev Janardana remains central to public messaging, strategic
              coherence, and external credibility, so key-person risk is real even with a broader bench in finance,
              risk, technology, and compliance. Strategic risk also comes from outside the org chart. Monzo, Starling,
              Revolut, and large incumbents all pressure Zopa in different ways, whether through feature breadth,
              current-account primacy, distribution strength, or funding scale. Investor liquidity expectations add
              another subtle pressure because a private company that has already been valued at unicorn levels must keep
              one eye on future exit options. That can bias priorities toward valuation defense or market readiness.
              None of these issues is unmanageable, but together they mean Zopa’s next phase is less about proving
              product-market fit and more about executing consistently under competitive and regulatory load.",
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
          - type: table
            tableRef: TR004
            claimRefs:
