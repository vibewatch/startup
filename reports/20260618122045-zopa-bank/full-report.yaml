  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The positive case for Zopa is straightforward: this is no longer a speculative fintech with only
              customer-growth rhetoric. Public evidence points to a profitable UK digital bank with meaningful deposits,
              real credit products, and a customer base large enough to support a multi-product flywheel. That matters
              because the market is more forgiving of profitable financial platforms than of cash-burning growth
              stories. The anti-thesis is equally clear. Motor finance overhang, competition from larger challengers,
              and private-company disclosure limits mean investors are still underwriting uncertainty rather than only
              upside. That tension leads to a recommendation that is positive but disciplined. A buy rating is
              supportable if entry pricing sits at or below a prudent base-case valuation, yet a strong-buy rating would
              overstate confidence because several important economics remain private. In short, Zopa looks investable,
              but only with respect for the downside channels that can erode today’s seemingly reasonable headline
              multiple.",
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
