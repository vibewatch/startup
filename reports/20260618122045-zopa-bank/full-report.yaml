              “user” category. The bank appears to focus on digitally engaged UK adults who are comfortable comparing
              savings rates, using app-based servicing, and holding everyday consumer-credit products without visiting a
              branch. Public evidence is strongest for four cohorts: savers, personal-loan borrowers, cardholders, and
