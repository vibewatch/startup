      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Zopa’s capital history shows three distinct phases: venture support during the peer-to-peer era,
              transition capital around the 2020 banking-licence shift, and larger institutional funding once the
              company could be underwritten as a digital bank with a growing deposit base. The SoftBank-led 2021 round
              is the clearest milestone because it set unicorn valuation status and validated the banking pivot in
              global fintech markets. The 2024 A.P. Moller Holding round matters for a different reason: it reaffirmed a
              valuation above $1 billion after the broader reset in fintech multiples. The 2025 AT1 issuance then added
              a second capital channel, indicating that Zopa can supplement equity with regulatory capital suited to a
              maturing bank. What remains opaque is ownership concentration, liquidation preferences, and any secondary
              transfers among earlier venture investors. As a result, outside observers can see the chronology and
              approximate scale of funding, but not yet the full economics of control.
