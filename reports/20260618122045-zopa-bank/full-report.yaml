        title: Scale, Profitability, and Coverage Gaps
        blocks:
          - type: paragraph
            body: >-
              Public 2025 and 2026 reporting makes Zopa unusual among private UK challenger banks because the company is
              pairing unicorn valuation status with repeated profitability disclosures. The available numbers indicate
              roughly £380.7 million of revenue in 2024, £377.1 million in 2025, and a sharp step-up in underlying
