              - CR030
              - CR031
              - CR034
              - CR035
              - CR038
      - number: '7.5'
        title: Risk Mitigation and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigating side of the risk case is not empty. Zopa has profitability, diversified products, and
              visible capital-market access, all of which provide time to respond if conditions worsen. But mitigation
              only matters if investors track the right indicators early. Complaints, provisioning, arrears, deposit
              runoff, service disruption, and customer-sentiment deterioration are the most useful public warning lights
              because they sit close to the core risk transmission paths. The right kill criteria are therefore
              practical rather than abstract. A material increase in motor finance exposure, a sustained deposit outflow
              trend, a sharp step-up in credit stress, or a major operational incident would each justify
              re-underwriting the company and probably lowering value. That framing leads to a disciplined conclusion:
              Zopa’s risk stack is acceptable only while conduct, funding, and credit signals remain tightly controlled.
              If several weaken at once, the thesis should be reconsidered quickly rather than defended
              optimistically.",
            claimRefs:
              - CR036
              - CR037
              - CR038
              - CR039
