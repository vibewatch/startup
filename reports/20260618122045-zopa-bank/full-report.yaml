  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Zopa should be analyzed inside UK retail banking, but not against the entire balance-sheet universe with
              equal weight. The relevant perimeter includes household deposits, unsecured consumer lending, credit
              cards, current-account relationships, and adjacent tax-advantaged savings or investment balances that can
              migrate into digital channels. It excludes large corporate banking, insurance manufacturing, merchant
              acquiring, and most mortgage-led economics where Zopa is not yet the core buyer choice. Bank of England
              and UK Finance data make the outer market obviously large, while FCA, CMA, Open Banking, Which, and
              Moneyfacts evidence show why digital distribution matters: consumers can compare rates quickly, move money
              more easily than in earlier cycles, and increasingly expect mobile-first servicing. Even so, the
              addressable pool for Zopa is narrower than the whole UK banking system because many households still keep
              salary accounts, mortgage relationships, or complex financial needs with incumbents. The practical market
              boundary is therefore the slice of UK adults willing to trust a digital-first provider for savings,
              borrowing, and eventually everyday banking, rather than every pound inside British financial assets.
            claimRefs:
