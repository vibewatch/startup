      - number: '8.2'
        title: Comparable Valuation and Market Context
        blocks:
          - type: paragraph
            body: >-
              Comparable valuation should begin with humility because no single peer matches Zopa exactly. Monzo is
              larger and arguably deserves a premium for platform breadth. Starling is closer on banking model and
              profitability, which makes it a more useful anchor. OakNorth is a UK fintech bank success story, but its
              enterprise-lending orientation limits comparability. Nubank offers an upper-bound picture of what scaled
              profitable neobanking can achieve in public markets, while N26’s re-rating history reminds investors that
              private marks can also compress sharply. Klarna’s IPO context adds another lesson: public appetite has
              returned selectively, but category leadership and disclosure quality matter a lot. Against that
              background, Zopa’s current implied multiple looks reasonable rather than exuberant. The market context is
              supportive enough for a profitable asset to retain value, but not generous enough to ignore conduct or
              competition risk. That is why Zopa screens as fairly valued to mildly attractive rather than obviously
              mispriced.",
            claimRefs:
              - CV011
