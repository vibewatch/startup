        title: Milestones and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              The milestone record supports a coherent story: Zopa pioneered UK consumer fintech in 2005, acquired a
              banking licence in 2020, reached unicorn valuation in 2021, reaffirmed that valuation in 2024, and
              diversified its capital stack through AT1 in 2025. That sequence is materially different from many peers
              that remain either loss-making or strategically ambiguous. At the same time, the chronology should not be
              read as a frictionless success story. Current coverage repeatedly notes an approximately £8 million
              motor-finance provision tied to the FCA commission review, and complaint-oriented sources show that
              lending practices and consumer outcomes are still part of the diligence surface. These adverse items do
              not negate the operating progress, but they do matter for underwriting because a regulated lender can move
              quickly from growth narrative to conduct scrutiny. A complete investment case therefore has to hold both
              truths at once: Zopa looks more mature than many fintech peers, yet still carries regulatory and
              reputation overhangs typical of a growing consumer bank.
