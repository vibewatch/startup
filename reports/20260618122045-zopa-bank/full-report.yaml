        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership is unusually important to understanding Zopa because the company’s transition from marketplace
              pioneer to profitable bank has been narrated through a relatively small set of visible executives. Jaidev
              Janardana is the dominant public face of the bank, while the leadership page and third-party executive
              directories show a broadening functional bench across finance, risk, compliance, technology, customer, and
              strategy. Governance also retains a strong link to the founding era through Giles Andrews on the board,
              while investor influence is visible through SoftBank representative Max Ohrstrand and other non-executive
              directors. That combination is stronger than a pure founder-centric fintech, but it does not eliminate
              key-person risk: succession planning, exact board committee structure, and insider ownership remain
              private. For diligence purposes, the important takeaway is that Zopa’s leadership bench now looks
              institutionally credible, but the company still depends heavily on a narrow set of decision-makers to
              maintain strategic coherence and regulatory trust.
