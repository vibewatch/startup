  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Module Map
        blocks:
          - type: paragraph
            body: >-
              Zopa's product architecture is best understood as a set of customer-facing modules layered on top of a
              shared regulated banking stack. Personal loans still anchor the franchise because they are the oldest and
              most clearly proven product, but the everyday-banking proposition now extends into easy-access savings,
              cash ISA, credit cards, a current account, car finance, and emerging investment or junior-investment
              adjacencies. That breadth matters because the value of the platform comes less from any single SKU and
              more from the ability to move a customer from one funded relationship into several. Public evidence
              supports the existence and strategic role of most modules, but maturity is uneven: loans, savings, and
              cards look scaled; current account looks newer; and investment features appear more partner-led or
              emerging. The practical product question is therefore maturity and cross-sell depth, not whether Zopa has
              broadened beyond its lending origins.
