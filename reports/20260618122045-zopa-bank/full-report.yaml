  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the part of the downside case that deserves the most attention because it can
              change faster than underlying customer growth or product momentum. The FCA’s motor finance commission
              review is the clearest live issue. Even though Zopa has already recognized a provision, the final cost
              path still depends on review outcomes, case-law direction, and the behaviour of claims channels. Consumer
              Duty adds a second layer by forcing boards to evidence good customer outcomes continuously, not just at
              launch. The practical implication is that a profitable challenger bank can still suffer meaningful
              remediation, operational distraction, and reputational damage if complaints, disclosure, or sales conduct
              deteriorate. FCA and PRA supervision also matters because any lapse lands on a licensed bank rather than a
              lightly regulated app. The legal posture is therefore not hypothetical. It is a standing underwriting
              variable with direct relevance to capital, trust, and valuation.",
