      - number: '5.2'
        title: Customer Workflow and Service Delivery
        blocks:
          - type: paragraph
            body: >-
              The service-delivery logic at Zopa looks increasingly like a digital-bank workflow in which onboarding,
              identity verification, funding, servicing, and cross-sell all happen inside one app-led operating loop.
              Customers can be acquired through savings, credit, or current-account entry points, then moved into
              adjacent products once trust and data accumulate. Open Banking capability matters here because it can
              support account aggregation, affordability checks, and smoother income verification, while faster domestic
              payment rails matter because customer trust depends on money movement being timely and legible. The
              strategic benefit of this workflow is that it should lower friction between initial acquisition and later
              product expansion. The risk is that every additional workflow step depends on regulated controls, fraud
              prevention, and third-party infrastructure behaving correctly, so workflow quality is inseparable from
              compliance and platform reliability. In practice, product convenience and operational resilience have to
              be judged together.
