              billion by end-2025. Customer traction is similarly material, with roughly 1.7 million customers and
              substantial credit-card issuance. Still, not every cover metric is equally well evidenced. Headcount is
              not cleanly corroborated from the source pack, and some customer-experience metrics such as NPS remain
              company-cited rather than independently audited. The prudent diligence stance is therefore that Zopa’s
              scale and profitability are credible, but several operating detail layers remain private.
