      - number: '2.4'
        title: Growth Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are digital habit formation, easier data portability, and the continued
              consumer practice of shopping visible rates. Open Banking has lowered some onboarding friction, while
              app-native servicing reduces the branch advantage for simpler products. Higher savings awareness also
              helps challengers that can advertise clear yields. At the same time, the rate cycle cuts both ways:
              attractive deposit rates can pull balances in, but higher borrowing costs can dampen credit demand and
              increase affordability stress. Incumbents still retain advantages in trust, brand familiarity, payroll
              anchoring, and product bundling, so digital adoption does not automatically translate into primary-bank
              status. Regulatory pressure is another real constraint. Consumer-duty expectations, conduct scrutiny, and
              car-finance or unsecured-lending issues can force repricing or slower expansion. Public data also leave
              important gaps: no reviewed source provides a single Zopa-aligned SAM number, and category-level estimates
              mix users, balances, and revenues in ways that resist neat comparison. For diligence, the investable
              question is therefore not whether UK digital banking exists at scale, but whether Zopa can keep
              compounding inside a competitive subset without sacrificing underwriting discipline or funding economics.
            claimRefs:
