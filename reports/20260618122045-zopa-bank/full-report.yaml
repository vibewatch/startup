      - number: '7.2'
        title: Credit and Financial Risk
        blocks:
          - type: paragraph
            body: >-
              Zopa’s financial risk is anchored in the structure of its balance sheet. The company now has meaningful
              scale in consumer lending and retail deposits, which is good for earnings but also creates sensitivity to
              macro conditions. A loan book measured in billions means that small shifts in arrears or loss rates can
              have outsized consequences for profit and capital generation, especially because public disclosures remain
              thinner on impairment detail than on top-line performance. At the same time, the funding model relies
              heavily on consumer savers. That is usually cheaper than wholesale funding, but it makes the bank
              vulnerable to rate competition and confidence shocks. Net interest margin could also compress if the Bank
              of England eases rates while deposit pricing stays competitive. Credit, funding, and margin risk therefore
              reinforce each other. None of these exposures is fatal on its own, yet together they explain why risk
              discipline has to be part of the investment thesis rather than an afterthought.",
