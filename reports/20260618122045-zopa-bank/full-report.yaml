      - number: '8.3'
        title: 'Scenario Analysis: Bear, Base, Bull'
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is intentionally simple because public evidence is good enough for directional
              ranges but not for a precise DCF. In the bear case, motor finance cost expands, net interest margin
              compresses, and competitive pressure slows customer monetisation, pushing fair value toward roughly £0.7
              billion. In the base case, Zopa sustains profitability and moderate growth while keeping risk incidents
              contained, which supports a valuation around £0.9 billion and broadly aligns with the last disclosed
              unicorn mark. In the bull case, profitability scales materially, exit markets improve, and investors
              reward Zopa with a growth-quality rerating closer to 4 times revenue, implying about £1.5 billion. The key
              lesson is that the current headline valuation does not leave vast room for error, but it also does not
              look absurd relative to peers. Most upside comes from confidence and liquidity rerating, while most
              downside comes from conduct, funding, or credit stress.",
            claimRefs:
              - CV021
