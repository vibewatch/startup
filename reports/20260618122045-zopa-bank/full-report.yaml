              proof is not a logo slide of enterprise clients; it is the accumulation of cohort evidence across product
              pages, review platforms, comparison tables, and complaint channels. That means buyer, user, and payer are
              usually the same individual, which simplifies acquisition but also reduces contractual lock-in. Zopa’s
