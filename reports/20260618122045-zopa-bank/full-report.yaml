    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Zopa Bank Limited now presents itself as a regulated UK digital bank rather than only the peer-to-peer
              lender that made the brand famous in the mid-2000s. Public company materials and the FCA register align on
              the legal identity, London headquarters, and dual FCA/PRA regulatory perimeter. That matters because it
              frames Zopa less as a marketplace intermediary and more as a deposit-funded balance-sheet lender with a
              broader everyday-banking ambition. The current proposition spans savings, unsecured loans, credit cards,
              current accounts, car finance, ISAs, and investment adjacencies, which makes Zopa’s identity foundational
              for every later diligence chapter. The historical through-line is still important: Zopa’s original mission
              around more human, more accessible finance remains visible in management’s positioning, but the operating
              model has clearly shifted toward a multi-product retail bank optimised for cross-sell, funding stability,
              and regulated profitability.
