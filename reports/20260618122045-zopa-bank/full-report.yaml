companyProfile:
  summary: >-
    Zopa Bank Limited is a London-based regulated digital bank that traces its roots to 2005, when it launched as the
    world's first peer-to-peer lending marketplace. After pioneering UK P2P credit for fifteen years, Zopa obtained a
    full UK banking licence in 2020 and pivoted to deposit-funded retail banking. Today Zopa offers savings accounts,
    credit cards, personal loans, and the recently launched Biscuit current account. It ended 2025 with roughly 1.7
    million customers, £6.4 billion in deposits, £3.8 billion in gross loans, and an underlying pre-tax profit of £65
    million — one of very few profitable UK neobanks at scale. CEO Jaidev Janardana has led the company since 2014. The
    company raised $87M in equity in December 2024 at a valuation exceeding $1 billion (led by A.P. Moller Holding), and
    followed that in May 2025 with £80M in AT1 capital via a landmark LSE bond listing. An IPO is not currently planned.
