  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Zopa sits inside a layered competitive field rather than a single peer group. Direct digital-bank peers
              include Monzo, Revolut, Starling, and Chase UK, each of which competes for a mainstream consumer
              relationship through app-led distribution. A second ring includes specialist savings or lending brands
              such as Marcus, Tandem, Atom, and OakNorth, which overlap on one product lane without matching Zopa’s full
              consumer profile. A third ring is the incumbent high-street set—Barclays, Lloyds, NatWest, Santander and
              others—that still owns brand trust, salary-account primacy, and cross-product breadth even when their
              digital experience looks less differentiated. This matters because Zopa is not defending a unique feature
              category. It is defending a combination of regulated-bank credibility, attractive savings, unsecured
              credit economics, and an ambition to deepen into everyday banking. The category context therefore rewards
              careful peer selection: Monzo and Starling matter most for primary-account and current-account gravity,
              Revolut matters for ecosystem breadth and scale, Chase UK matters for subsidized entry, and specialists
              matter for product-level margin pressure.
