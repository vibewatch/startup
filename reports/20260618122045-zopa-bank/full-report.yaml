      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Motor finance is the key external overhang
            body: >-
              The motor finance review is the one risk that can simultaneously raise cash cost, attract supervisory
              scrutiny, and distort investor confidence.
            calloutType: risk
