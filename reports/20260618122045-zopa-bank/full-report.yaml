      - number: '4.4'
        title: Financial Data Gaps and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The key diligence issue is no longer whether Zopa can generate revenue and profit, but whether an investor
              can fully decompose that profit into stable spread income, normalized credit cost, and repeatable
              operating leverage. Public coverage does not provide product-level revenue mix, statutory CET1 and
              liquidity ratios, cost of deposits, delinquency and charge-off vintages, or realized APR by segment. It
              also leaves uncertain how much of the margin story depends on unusually supportive rate conditions versus
              structural underwriting edge. Motor-finance provisioning shows that conduct and credit issues can still
              disrupt the earnings narrative even in a profitable year. For investment work, the right next step is a
              management data room that connects segment yields, credit losses, funding costs, acquisition channels, and
              capital consumption under both base and stressed scenarios. Without that bridge, Zopa's public financial
              story is investable in direction but not yet complete in detail. A lender this far along should be
              underwritten with cohort, capital, and treasury data rather than only press-quality KPIs and headline
              growth figures. Treasury mix matters too materially.
