chapter:
  number: 7
  title: Risks
  summary: >-
    Zopa’s biggest risks are conduct-led rather than purely growth-led. The FCA motor finance review, Consumer Duty oversight, credit-book sensitivity, retail-deposit funding concentration, and technology dependence all create real downside paths from operating friction into capital and valuation pressure. The risk stack is manageable because the bank is profitable and better capitalised than earlier-stage fintechs, but it remains narrow enough that a few adverse developments at once could break the thesis.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: >-
    Regulatory and legal risk is the part of the downside case that deserves the most attention because it can change faster than underlying customer growth or product momentum. The FCA’s motor finance commission review is the clearest live issue. Even though Zopa has already recognized a provision, the final cost path still depends on review outcomes, case-law direction, and the behaviour of claims channels. Consumer Duty adds a second layer by forcing boards to evidence good customer outcomes continuously, not just at launch. The practical implication is that a profitable challenger bank can still suffer meaningful remediation, operational distraction, and reputational damage if complaints, disclosure, or sales conduct deteriorate. FCA and PRA supervision also matters because any lapse lands on a licensed bank rather than a lightly regulated app. The legal posture is therefore not hypothetical. It is a standing underwriting variable with direct relevance to capital, trust, and valuation.",
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
