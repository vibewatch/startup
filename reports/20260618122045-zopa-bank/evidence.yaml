evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: A full post-2024 cap table with investor ownership percentages, board rights, preferences, and any secondaries.
    whyItMatters: >-
      Without cap-table detail, outside investors cannot fully assess control concentration, dilution history, or
      downside protections.
    diligencePath: Request the latest cap table, shareholder agreements, and board-rights summary from management.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current employee count and functional headcount split for Zopa Bank.
    whyItMatters: Headcount is needed to benchmark operating efficiency, product velocity, and control coverage against peer banks.
    diligencePath: Request current HR dashboard totals or a dated org chart from management.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: zopa-specific-sam
    missingEvidence: A directly published market model matching Zopa’s exact product bundle and target cohort.
    whyItMatters: >-
      The chapter can only triangulate SAM from adjacent balances and adoption data, which adds uncertainty to long-term
      share assumptions.
    diligencePath: >-
      Ask management for internal market sizing by product cohort and compare it to acquisition funnel and cross-sell
      data.
    relatedQuestionRefs:
      - QM008
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-depth
    missingEvidence: Cohort-level data on how many Zopa customers move from one product into two or more products over time.
    whyItMatters: Relationship depth determines whether rate-led acquisition can translate into durable economics.
    diligencePath: Request product-by-cohort migration curves, balance retention by vintage, and payback by first product.
    relatedQuestionRefs:
      - QM015
      - QM025
  - type: private-evidence-only
    severity: material
    topic: cohort-competition
    missingEvidence: Product-level cohort overlap showing whether Zopa users also hold Monzo, Revolut, or incumbent primary accounts.
    whyItMatters: Without multi-homing data it is hard to measure whether Zopa is a core relationship or a secondary product app.
    diligencePath: Request overlap, churn, and share-of-wallet data segmented by first product and tenure.
    relatedQuestionRefs:
      - QP017
      - QP018
      - QP025
  - type: stale
    severity: minor
    topic: pricing-volatility
    missingEvidence: Frozen same-day competitor rates and fees across all products in scope.
    whyItMatters: >-
      Packaging comparisons drift quickly and can misstate near-term competitiveness if not refreshed close to diligence
      close.
    diligencePath: Refresh every public pricing page in the last week before IC and store screenshots or structured snapshots.
    relatedQuestionRefs:
      - QP011
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
