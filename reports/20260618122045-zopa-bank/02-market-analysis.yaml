- id: market-sizing
  title: 'Market Sizing: TAM, SAM, and SOM'
  body: >-
    The cleanest sizing stack starts with UK household deposits and consumer-credit balances, then narrows to digitally contestable balances and finally to Zopa’s current footprint. Bank of England series support about £1.9 trillion of household deposits and about £230 billion of consumer credit outstanding, while UK Finance data point to a large unsecured personal-lending pool inside that total. That gives a defensible multi-trillion-pound outer TAM for savings plus retail lending, even before considering current-account flows. The next step is not to pretend all of that is equally reachable. Statista, Accenture, Deloitte, PwC, and KPMG all support the idea that challenger and digital-bank adoption has become mainstream but still remains a subset of total balances, implying a smaller SAM that likely sits in the low hundreds of billions rather than the full UK retail-banking stock. Zopa’s current SOM is much smaller but already meaningful: public 2025 disclosures point to about £10.2 billion
    of combined deposits and loans and about 1.7 million customers. The evidence therefore supports a layered view with a huge TAM, a constrained digital-banking SAM, and a visible SOM that is credible but still early relative to the available pool.
