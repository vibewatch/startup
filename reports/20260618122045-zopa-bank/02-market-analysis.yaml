chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Zopa Bank sells into a very large UK retail-banking pool, but the relevant opportunity is not the whole system. The most defendable framing is a broad TAM anchored in household deposits plus consumer credit, a narrower SAM defined by digitally active mass-market adults willing to use app-led providers for savings and borrowing, and a current SOM represented by roughly £6.4 billion of deposits, roughly £3.8 billion of loans, and around 1.7 million customers. Digital adoption, open-banking rails, and transparent savings-rate shopping support growth, while incumbent trust, rate competition, and conduct scrutiny constrain how quickly challengers can convert adoption into durable share.
sections:
- id: market-boundary
  title: Market Boundary and Definition
  body: >-
    Zopa should be analyzed inside UK retail banking, but not against the entire balance-sheet universe with equal weight. The relevant perimeter includes household deposits, unsecured consumer lending, credit cards, current-account relationships, and adjacent tax-advantaged savings or investment balances that can migrate into digital channels. It excludes large corporate banking, insurance manufacturing, merchant acquiring, and most mortgage-led economics where Zopa is not yet the core buyer choice. Bank of England and UK Finance data make the outer market obviously large, while FCA, CMA, Open Banking, Which, and Moneyfacts evidence show why digital distribution matters: consumers can compare rates quickly, move money more easily than in earlier cycles, and increasingly expect mobile-first servicing. Even so, the addressable pool for Zopa is narrower than the whole UK banking system because many households still keep salary accounts, mortgage relationships, or complex financial needs with
    incumbents. The practical market boundary is therefore the slice of UK adults willing to trust a digital-first provider for savings, borrowing, and eventually everyday banking, rather than every pound inside British financial assets.
  claimRefs:
