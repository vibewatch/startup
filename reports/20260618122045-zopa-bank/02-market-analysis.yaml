callouts:
- calloutType: insight
  title: The right market is smaller than the headline UK banking system
  body: >-
    The most important analytical move is narrowing from the whole UK banking stock to the subset of balances and users that a digital-first bank can realistically win without a branch network or a dominant mortgage franchise.
  claimRefs:
  - CM007
  - CM017
  - CM018
  - CM035
- calloutType: risk
  title: Rate-led acquisition can hide weak relationship depth
  body: >-
    Savings comparison sites and promotional pricing can generate fast inflows, but durable economics depend on whether Zopa turns first-product users into broader, stickier relationships before rates normalize.
