    - Corporate treasury balances and wholesale funding
    - UK households as both user and payer
    - Core funding pool and major acquisition wedge
  - - Consumer unsecured credit
    - Personal loans, credit-card balances, refinancing, car-finance adjacency
    - Commercial lending and mortgage-led economics
    - Retail borrowers
    - Core lending and risk-underwriting lane
  - - Everyday banking relationships
    - Salary-led current accounts, cards, payments, budgeting features
    - Merchant acquiring and enterprise treasury
    - Retail current-account holders
    - Important expansion lane but not Zopa’s historical core
  - - Wealth and tax wrappers
    - Cash ISA migration and entry-level investment balances
    - Full-service wealth management and pensions manufacturing
    - Mass-market savers and emerging investors
    - Adjacency that can deepen wallet share
  - - Status-quo substitutes
    - Incumbent high-street banks, savings comparison flows, specialist savings brands
    - Non-UK banking revenue pools
    - Same end users choosing alternatives
    - Sets the true competitive boundary
  notes: The table separates the broad UK retail-banking perimeter from the narrower product set that Zopa can realistically contest today.
