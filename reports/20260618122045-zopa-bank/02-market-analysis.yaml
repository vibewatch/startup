- id: buyer-and-segment-map
  title: Buyer and Segment Map
  body: >-
    The demand side is segmented less by legal entity size than by financial behavior. Rate-sensitive savers, digitally confident professionals, revolving-credit users, and younger households trying to consolidate money management form the most obvious digital-banking cohorts. Their workflows differ. Savers often arrive because comparison sites surface a leading rate, then decide whether service and trust are strong enough to leave balances in place. Borrowers care more about speed, clarity, and app-mediated servicing than about physical branches. Current-account users require a higher trust threshold because salary deposit, bill-pay setup, and card reliability create more inertia than opening an extra savings pot. This makes buyer, user, and payer roles effectively the same consumer, but budget ownership still differs by product moment: savings budgets sit in household liquidity decisions, while unsecured borrowing competes against affordability and refinancing choices. Zopa’s cross-sell
    ambition matters because a single-product saver is easier to lose than a customer using deposits, cards, and loans together. The market therefore rewards providers that can convert a low-friction first product into a broader financial relationship without overextending underwriting or service quality.
  claimRefs:
