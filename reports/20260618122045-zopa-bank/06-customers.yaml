chapter:
  number: 6
  title: Customers
  summary: >-
    Zopa’s customer case is credible because public evidence converges on meaningful household scale, strong savings-led acquisition, 470 thousand plus cards in issue, and more than a quarter of customers holding multiple products. Independent app stores, reviews, complaints records, and rate-comparison sites show genuine customer proof rather than a purely management-framed narrative. The main diligence gap is not whether customers exist, but how durable they are by cohort once rate competition, service friction, and cross-sell execution are considered.
sections:
- id: customer-segmentation-and-profile
  title: Customer Segmentation and Profile
  body: >-
    Zopa’s customer base is best understood as a retail-bank portfolio rather than as a single homogeneous “user” category. The bank appears to focus on digitally engaged UK adults who are comfortable comparing savings rates, using app-based servicing, and holding everyday consumer-credit products without visiting a branch. Public evidence is strongest for four cohorts: savers, personal-loan borrowers, cardholders, and the smaller but strategically more valuable multi-product customer set. For a retail bank, named customer proof is not a logo slide of enterprise clients; it is the accumulation of cohort evidence across product pages, review platforms, comparison tables, and complaint channels. That means buyer, user, and payer are usually the same individual, which simplifies acquisition but also reduces contractual lock-in. Zopa’s core segmentation is therefore broad enough to scale nationally, yet narrow enough to remain centered on mainstream personal finance rather than on niche affluent
    or SME banking.",
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
