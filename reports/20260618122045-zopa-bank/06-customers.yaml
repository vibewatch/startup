  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: Exact churn, cohort retention, and NRR or GRR by product and tenure bucket.
    whyItMatters: Without retention cohorts, the durability of Zopa’s customer economics remains inferred rather than directly proven.
    diligencePath: Request monthly product-level cohorts for savers, borrowers, card users, and multi-product customers.
    relatedQuestionRefs:
    - QU016
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
    - TU003
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: Conversion rates from savings into loans or cards and the CAC or payback profile by channel.
    whyItMatters: Cross-sell is central to the thesis, so missing conversion data limits confidence in customer lifetime value.
    diligencePath: Request funnel metrics covering acquisition channel, initial product, cross-sell timing, and cohort profitability.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU002
    - TU005
