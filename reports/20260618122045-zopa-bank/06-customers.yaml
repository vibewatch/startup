- id: customer-proof-satisfaction-and-reviews
  title: Customer Proof, Satisfaction, and Reviews
  body: >-
    Public customer proof is materially stronger than a management-only story because it spans several independent surfaces. Apple App Store, Google Play, and AppFollow all show that Zopa’s mobile experience is visible and generally well rated. Trustpilot and Reviews.io add a broader sentiment layer that is still net positive, even though those channels also surface recurring complaints on servicing speed, approvals, and disputed outcomes. The company-cited NPS of 75 is directionally encouraging because it implies stronger advocacy than the broader UK financial-services average that Zopa references, but diligence should still treat it as a company-framed metric until the survey method is disclosed. The more durable insight is that customers appear to value straightforward pricing, a polished app, and reasonably clear product propositions. That combination is good enough to create repeat trust, but it is not so unique that Zopa can ignore service execution or comparison-site competitiveness.",
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
