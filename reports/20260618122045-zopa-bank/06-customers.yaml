- id: adoption-trajectory-and-growth
  title: Adoption Trajectory and Growth
  body: >-
    Adoption looks credible because multiple 2024 to 2026 references point in the same direction: more customers, more cards, and more deposits. The reported progression from roughly 1.35 million customers at end-2024 to around 1.7 million by end-2025 suggests that Zopa is still adding households even after moving beyond its original peer-to-peer identity. Growth is not only about logos or downloads. A deposit base of roughly £6.4 billion indicates that customers are trusting Zopa with meaningful balances, while more than 470 thousand issued credit cards show product expansion beyond savings and personal loans. The most important nuance is that the installed base still sits far below the broader UK digital-banking opportunity, so growth does not yet look structurally maxed out. At the same time, a meaningful part of acquisition appears rate-led, which can scale fast but can also reverse if competitors become more aggressive on price.",
  claimRefs:
  - CU009
