- id: retention-cross-sell-and-concentration-risk
  title: Retention, Cross-Sell, and Concentration Risk
  body: >-
    Retention is the least transparent part of the customer story because public sources do not give exact churn, cohort, or NRR tables. The best proxy is Zopa’s disclosure that more than 25 percent of customers hold two or more products, which implies the bank is converting a meaningful minority of households into deeper relationships. That matters because a saver who later adds a loan or card becomes harder to dislodge than a pure rate shopper. Even so, durability varies by product. Savings balances can be sticky but remain exposed to rate competition; loans have finite terms unless cross-sold; cards can deepen engagement but are vulnerable to adverse approval or limit experiences. Concentration risk is therefore not about one named customer leaving, but about many small savers or app users reacting at once to worse rates or poorer service.             The right diligence lens is cohort economics, product-pair conversion, complaint trendline monitoring, and product-pair contribution margin over time by tenure, channel, and balance size. Those details would distinguish genuine loyalty from temporary rate-driven usage.",
