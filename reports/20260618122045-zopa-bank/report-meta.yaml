companyProfile:
  summary: "Zopa Bank Limited is a London-based regulated digital bank that traces its roots to 2005, when it launched as the world's first peer-to-peer lending marketplace. After pioneering UK P2P credit for fifteen years, Zopa obtained a full UK banking licence in 2020 and pivoted to deposit-funded retail banking. Today Zopa offers savings accounts, credit cards, personal loans, and the recently launched Biscuit current account. It ended 2025 with roughly 1.7 million customers, £6.4 billion in deposits, £3.8 billion in gross loans, and an underlying pre-tax profit of £65 million — one of very few profitable UK neobanks at scale. CEO Jaidev Janardana has led the company since 2014. The company raised $87M in equity in December 2024 at a valuation exceeding $1 billion (led by A.P. Moller Holding), and followed that in May 2025 with £80M in AT1 capital via a landmark LSE bond listing. An IPO is not currently planned."
  foundedDate: "2005-01-01"
  founders:
    - name: "Giles Andrews"
      role: "Co-founder and Board Member"
      background: "Serial entrepreneur; helped build and scale Zopa from P2P pioneer through banking transition"
      claimRefs: ["CO003"]
  foundingLocation: "London, United Kingdom"
  headquarters: "1 Snowden Street, London, EC2A 2DQ, United Kingdom"
  productSummary: "Savings accounts (easy-access and fixed-term), credit cards (budgeting tools, real-time credit score), personal loans (£1,000–£25,000), Biscuit current account (2% AER, cashback, 7.1% regular saver), car finance, ISAs, and investment products."
  customerFocus: "UK retail consumers seeking transparent, competitive-rate digital banking products; skewed toward credit-active, digitally literate adults aged 25–55."
  businessModel: "Net interest margin on deposit-funded consumer credit (loans, credit cards); fee income from interchange and account services. Expanding into investment and advice-adjacent products."
  stage: "Series F+, Unicorn"
  fundingStatus: "Last equity: $87M (Dec 2024, >$1B valuation, A.P. Moller Holding-led). AT1 capital: £80M (May 2025, LSE bond). Total raised: ~$1.2B."
  disclosureProfile: "private-disclosed"
  claimRefs: ["CO001", "CO002", "CO003", "CO011", "CO012"]

