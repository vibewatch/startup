  topStrengths:
    - "Profitable at scale — one of very few UK neobanks with sustained and growing pre-tax profit (£65M in 2025), providing rare downside resilience."
    - "Sector-leading cost-to-income ratio of 34.8%, demonstrating high operational leverage and technology-driven efficiency."
    - "18-year proprietary lending data enables superior credit risk models across loans and credit cards, a durable competitive moat."
    - "Expanding into everyday banking (Biscuit current account, investments), diversifying revenue beyond net-interest-margin."
    - "Deep institutional backing (SoftBank, A.P. Moller Holding) and successful AT1 bond listing signal strong capital-market credibility."
  topRisks:
    - "Motor finance commission investigation: FCA probe has sector-wide implications; Zopa provisioned ~£8M but total exposure remains uncertain pending final determinations."
    - "Competitive intensity from well-capitalised peers (Monzo, Revolut, Starling, Chase UK) accelerating into Zopa's core savings and lending segments."
    - "Net interest margin compression if UK base rate declines faster than forecast, squeezing lending spreads and deposit income."
    - "Key-person dependency on CEO Jaidev Janardana, who has driven strategy since 2014; a leadership change would create material uncertainty."
    - "Customer scale gap: Zopa's 1.7M customers vs. Monzo's 13M limits negotiating leverage, brand recognition, and cross-sell pool."
