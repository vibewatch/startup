appendices:
  - id: A
    title: "Funding and Investor History"
    blocks:
      - type: paragraph
        body: "Zopa has raised approximately $1.2 billion across equity rounds and AT1 capital from its 2005 founding through mid-2026. Major milestones include a £220M raise to support the 2020 banking licence, a $300M SoftBank-led Series F in 2021 at a $1B valuation, and a December 2024 upround at >$1B led by A.P. Moller Holding. The May 2025 £80M AT1 bond listing on the London Stock Exchange was Zopa's first public capital market instrument. An IPO is not currently planned per CEO commentary."
        claimRefs: ["CO011", "CO012"]
  - id: B
    title: "Regulatory Summary"
    blocks:
      - type: paragraph
        body: "Zopa Bank Limited (FCA Firm Reference: 800542) is authorised by the Financial Conduct Authority and the Prudential Regulation Authority as a UK retail bank. Customer deposits up to £85,000 are protected by the Financial Services Compensation Scheme. The most material current regulatory exposure is the industry-wide FCA motor finance commission investigation; Zopa has set aside approximately £8 million in provisions. Separately, in 2025 Zopa became the first UK bank granted FCA permission to offer 'targeted support' under the advice-gap reform regime, representing a regulatory first-mover advantage in investment guidance."
        claimRefs: ["CO002"]

