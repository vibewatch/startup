companyProfile:
  summary: >-
    CDN77 is a privately held, founder-controlled content delivery and internet-infrastructure
    company founded in 2011 by Zdenek Cendra. It operates a vertically integrated network and
    product stack spanning CDN, storage, edge compute, and dedicated infrastructure, with
    publicly described scale of 230+ locations and 330 Tbps of capacity. The business reported
    $218 million of FY2025 revenue and announced a CVC minority investment in September 2026,
    but governance terms, audited financials, and current customer concentration remain private.
