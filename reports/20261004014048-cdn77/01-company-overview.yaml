        debt or credit facilities, cap table, and investor governance rights.
      whyItMatters: >-
        Funding raised is not cash available, and minority ownership does not reveal practical
        control without the transaction documents.
      diligencePath: >-
        Review the signed transaction agreements, capitalization table, funds-flow statement,
        debt schedule, board documents, and regulatory approval timetable.
      relatedQuestionRefs: [QO003, QO007]
      relatedTableRefs: [TO001, TO003]
