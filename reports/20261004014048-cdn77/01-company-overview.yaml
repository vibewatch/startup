company:
  name: CDN77
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CDN77 is a founder-controlled, privately held internet-infrastructure operator founded in
    2011; it reported $218 million of 2025 revenue and announced CVC as a minority partner in
    September 2026. The transaction adds a scaled financial sponsor while leaving Zdenek Cendra
    as majority owner and CEO, but the stake size, primary-versus-secondary proceeds, board
    composition, and current customer count remain undisclosed.
sections:
  - id: identity-scale-and-business-model
    title: Identity, operating model, and scale
    body: >-
      Founded in 2011 by Zdenek Cendra, CDN77 operates as a content-delivery and internet-
      infrastructure provider rather than a pure software vendor. Its model is vertically
      integrated: the company says it designs and runs its network, hardware platforms, and
      software stack, with content delivery at the core and storage, edge compute, and dedicated
      CPU/GPU infrastructure as adjacencies. The company homepage reports $218 million of revenue
      for 2025, explicitly a revenue figure rather than ARR, and more than 230 locations with
      330 Tbps of network capacity are repeated in company and third-party accounts. Public
      profiles associate the business with both London and Prague, but no corporate filing in
      the assigned evidence establishes the legal headquarters. A current customer count is also
      unavailable; the only numeric directory entry is an undated, stale figure published in
      2025 and should not be treated as the present installed base.
    claimRefs: [CO001, CO006, CO007, CO008, CO011, CO012, CO014, CO015]
    tableRefs: [TO001]
  - id: ownership-leadership-and-governance
    title: Ownership, leadership, and governance
    body: >-
      The September 2026 transaction preserves founder control: Cendra remains chief executive
      and majority owner while CVC, through Strategic Opportunities, is set to acquire a minority
      stake. CDN77 says most of the senior team has been with the company since its founding and
      will remain, which supports continuity but also makes founder and long-tenured-team
      dependence a central diligence issue. Financial terms and the exact stake were not
      disclosed, and completion remained subject to customary regulatory approvals. The evidence
      does not distinguish primary growth capital from a secondary share purchase, so neither
      total funding raised nor cash newly available to the company can be inferred. It also does
      not identify directors, reserved matters, investor consent rights, succession planning, or
      a complete executive roster. Those documents are necessary to test whether minority status
      translates into limited control in practice.
    claimRefs: [CO002, CO003, CO004, CO005, CO013]
    tableRefs: [TO002, TO003]
  - id: milestones-and-external-signals
    title: Milestones and external signals
    body: >-
      The available chronology shows a bootstrapped-to-sponsored transition, but not a complete
      corporate history. After the 2011 founding, the next dated evidence in the assigned pool is
      a 2025 directory snapshot, followed by 2025 revenue, an August 2026 workforce indication,
      and the September 2026 CVC announcement. Independent reports then attached an approximately
      $1.9 billion valuation and an about-$270-million 2026 revenue target to the transaction.
      These are reported estimates, not disclosed transaction terms or audited guidance. The
      milestone record lacks dated product launches, prior financing events, regulatory outcomes,
      and adverse incidents; absence of those events in this pool is not evidence that none
      occurred. The timeline therefore functions as an evidence map, not a complete history.
    claimRefs: [CO001, CO003, CO008, CO009, CO010, CO011, CO015]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Diligence implications
    body: >-
      The strongest overview signal is scale achieved while retaining founder control: disclosed
      network capacity, 2025 revenue, and the CVC minority transaction all point to an established
      private infrastructure operator rather than an early-stage startup. The central underwriting
      questions sit behind those headline metrics. Revenue quality, customer concentration,
      capital expenditure, debt, and cash conversion are not available here, and the $1.9 billion
      figure comes from third-party reporting rather than published deal terms. Dealroom also
      flags that expansion into capital-heavy AI and GPU infrastructure brings competition from
      much larger cloud and hyperscale operators. The investment case therefore depends on
      verifying transaction mechanics, audited financials, cohort retention, capacity economics,
      governance rights, and management depth. Until those items are supplied, the announced
      partnership demonstrates external sponsor interest but does not establish cash proceeds,
      a closed transaction, or reduced key-person risk.
    claimRefs: [CO002, CO004, CO005, CO008, CO009, CO010, CO013, CO016]
