  - id: "scenario-analysis-and-decision-framework"
    title: "Scenario Analysis, Downside Triggers, and Diligence Path"
    body: |
      Our forward scenario framework evaluates CDN77 across bull, base, and bear operating cases through 2028. In the Bull Case (20% probability), CDN77 successfully commercializes its dedicated CPU/GPU infrastructure and edge storage across its 230+ PoP footprint, cross-selling adjacent AI inference services into its enterprise video customer base. Revenue accelerates to $360 million by 2028, and multiple durability holds at 8.0x revenue, yielding an enterprise valuation of $2.88 billion (1.52x return). In the Base Case (60% probability), core video delivery continues expanding moderately toward $310 million in 2028 revenue, while AI infrastructure investments remain focused on boutique enterprise hosting. Multiple compression to 5.5x revenue reflects broader infrastructure commoditization, yielding a valuation of $1.71 billion (0.90x return, flat capital preservation). In the Bear Case (20% probability), high GPU procurement costs and power commitments compress operating cash flow, tier-one streaming customers renegotiate transit pricing via multi-CDN routers, and revenue stalls at $240 million. Multiple compression to 3.5x revenue results in a down-round valuation of $840 million (0.44x return, 56% drawdown).
      
      Based on this evidence architecture, we assign an overall Track recommendation with Medium confidence, High risk rating, and Fair valuation stance. Downside triggers that would prompt a downgrade to Avoid include margin compression below cash-flow breakeven, loss of anchor streaming accounts, or aggressive debt leverage to fund GPU clusters. Conversely, an upgrade to Buy requires confirmatory diligence access: verifying audited gross margins, inspecting CVC's minority protective covenants, confirming regulatory closing approvals across cross-border screening jurisdictions, and auditing customer retention cohorts. Until these private records are independently examined, institutional investors should monitor CDN77's operational progress rather than chasing secondary equity allocations at peak headline multiples.
