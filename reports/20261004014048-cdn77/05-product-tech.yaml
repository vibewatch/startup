callouts:
  - calloutType: strength
    title: "Integration depth is the central technical thesis"
    body: >-
      CDN77 combines video-oriented delivery, inline WebAssembly logic, and company-described
      ownership of network, hardware, and software. That integration can support close control of
      the request path, but public sources do not quantify the resulting customer performance.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
  - calloutType: risk
    title: "Scale disclosures are not reliability evidence"
    body: >-
      The reported 235 points of presence and 330 Tbps of global network capacity establish
      footprint and capacity only. Underwriting still requires uptime, incident, failover,
      security-audit, and independently measured performance evidence.
    claimRefs:
      - CE005
