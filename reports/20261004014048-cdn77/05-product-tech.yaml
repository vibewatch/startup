company:
  name: CDN77
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    CDN77 is a vertically integrated delivery-infrastructure provider whose public positioning is
    anchored in video, with an edge-compute product that runs Rust-authored WebAssembly modules
    inline in the request path. The disclosed stack and scale are substantial, but the assigned
    evidence does not independently establish uptime, application-security depth, developer
    adoption, certifications, or the shipping maturity of the announced storage and GPU expansion.
sections:
  - id: product-and-workflow
    title: "Product surface and customer workflow"
    body: >-
      CDN77's core customer job is to move latency-sensitive content from an origin to distributed
      users while reducing work at the origin. Video is the clearest specialization: the company
      says 90% of delivered data is video, while an independent review identifies HLS, DASH, and
      CMAF support. A third-party company profile also lists website acceleration, software
      distribution, HD/4K video delivery, gaming-site acceleration, and customized private CDN
      solutions, although that profile is historical and does not establish the current packaging
      of each line. The current edge-compute surface extends the workflow from caching into
      request inspection, access validation, transformation, routing, and cache-key control before
      traffic reaches origin systems. This makes CDN77 a delivery and request-processing platform,
      not merely a reseller of bandwidth, but public proof is stronger for capability descriptions
      than for independently measured customer outcomes.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE016
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-operating-model
    title: "Architecture and operating model"
    body: >-
      The operating model is vertically integrated at the network, hardware, and software layers.
      CVC's transaction announcement says CDN77 builds and runs all three, a description repeated
      by independent coverage. The official edge-compute page places programmable logic directly
      in the HTTP request lifecycle: plugins are developed with a Rust SDK, compiled to
      WebAssembly, and can use built-in key-value storage for configuration or shared state. The
      same page reports 235 points of presence across 135 countries and 330 Tbps of global network
      capacity; CVC and The Recursive separately describe more than 230 locations and the same
      330 Tbps capacity figure. These are capacity and footprint disclosures, not uptime, latency,
      or delivered-throughput benchmarks. A historical ColoHouse case study also shows that
      physical expansion depends on colocation access, exchange connectivity, onsite support, and
      the ability to install CDN77-specific hardware.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE012
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: deployment-maturity-and-roadmap
    title: "Deployment, support, and roadmap maturity"
    body: >-
      The available evidence points to a high-touch enterprise deployment model. CDN77 says edge
      computing is designed and implemented with its engineers rather than presented as a wholly
      self-serve runtime, and its homepage promises direct L2/L3 engineering access plus
      client-specific customization. That service model can reduce implementation friction for
      demanding customers, but it also makes onboarding capacity, deployment lead time, and support
      scalability important diligence questions. The stated next product frontier is broader
      infrastructure: CVC and The Recursive describe planned or expanding storage, edge compute,
      and dedicated CPU/GPU capacity for applications including AI workloads. Neither source gives
      deployment dates, installed GPU capacity, utilization, customer adoption, or a separation
      between currently shipping services and forward expansion. The roadmap should therefore be
      underwritten as directionally credible but operationally unverified.
    claimRefs:
      - CE010
      - CE011
      - CE013
  - id: differentiation-trust-and-risks
    title: "Differentiation, trust controls, and technical risks"
    body: >-
      The strongest disclosed differentiation is control over the delivery stack combined with
      video specialization and request-path programmability. The WebAssembly runtime is described
      as sandboxed with strict isolation and defined CPU and memory limits, while a third-party
      review reports DDoS protection, token authentication, geo-blocking, SSL certificates,
      analytics, and API access. These statements identify controls but do not substitute for
      audited security evidence. An independent provider review also claims CDN77 lacks enterprise
      WAF custom rules and bot management and has limited Asia and South America coverage; those
      limitations require direct product verification because the review also uses an older,
      materially smaller node count than current company disclosures. No assigned source provides
      SOC 2 or ISO certificates, penetration-test results, a public incident history, uptime/SLA
      performance, or developer-community adoption data. The resulting diligence case is a
      technically coherent product with meaningful verification gaps at the trust and operating
      performance layers.
    claimRefs:
      - CE001
      - CE004
      - CE009
      - CE014
      - CE015
      - CE016
