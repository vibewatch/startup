      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Mindshare
        blocks:
          - type: paragraph
            body: >-
              Procurement of high-capacity CDN infrastructure is driven primarily by specialized engineering and
              infrastructure leaders, including Vice Presidents of Infrastructure, Heads of Video Delivery, and Chief
              Technology Officers. In large-scale video streaming, gaming, and online education platforms—such as CDN77
              clients Rakuten TV, Starz, Udemy, and Banijay—delivery performance directly governs viewer churn and
              digital monetization. Enterprise buyers evaluate vendors across multilayer caching performance, direct
              access to senior support engineers, custom edge routing rules, and predictable pricing structures free of
              hidden egress surcharges. PeerSpot engagement data ranks CDN77 fifteenth in the overall CDN category with
              a 2.6% category mindshare as of October 2026, marking an increase from 0.8% in the preceding year. This
              steady mindshare expansion reflects increasing enterprise interest in specialized infrastructure
              alternatives beyond multi-product public cloud suites.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth Catalysts, Adoption Constraints, and Competitive Headwinds
        blocks:
          - type: paragraph
            body: >-
              Adoption of independent edge infrastructure is accelerated by three structural tailwinds: surging 4K and
              live interactive streaming volumes, enterprise multi-CDN hedging strategies designed to mitigate
              single-provider outages, and the operational requirement for specialized low-latency computing. However,
              significant adoption constraints and competitive headwinds govern the sector. CDN transit remains highly
              capital-intensive, requiring sustained hardware investment across hundreds of global points of presence to
              maintain line-rate capacity. Furthermore, as CDN77 actively scales into dedicated CPU and GPU
              infrastructure tailored for heavy artificial intelligence inferencing workloads, it confronts formidable
              competition from hyperscale cloud operators such as Amazon Web Services, Microsoft Azure, and Google
              Cloud, which possess massive balance sheets, subsidized transit economics, and entrenched enterprise
              developer ecosystems.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specialization in Video Delivery as Defensible Market Wedge
            body: >-
              While general-purpose CDNs and hyperscalers compete aggressively on static web asset distribution, CDN77's
              deliberate concentration on high-throughput video delivery—accounting for 90% of network traffic—enables
              tailored caching architectures and cost efficiencies that resonate with margin-conscious media streaming
              platforms.
            calloutType: insight
            claimRefs:
              - CM004
              - CM010
          - type: callout
            title: Hyperscale Competition in Emerging AI Edge Workloads
            body: >-
              CDN77's strategic expansion into dedicated CPU and GPU infrastructure for artificial intelligence
              inferencing moves the company beyond bandwidth delivery into direct competition against established cloud
              hyperscalers possessing superior capital reserves and integrated developer ecosystems.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Alternatives and Architecture Segmentation
        blocks:
          - type: paragraph
            body: >-
              The content delivery network landscape comprises three distinct tiers: legacy enterprise CDNs and
              hyperscalers, mid-market video and web acceleration specialists, and emerging multi-CDN edge platforms.
              CDN77 positions itself primarily within high-volume video and software distribution, operating a
              self-built physical infrastructure of over 230 points of presence and 330 Tbps of network capacity. Unlike
              pure software overlays or transit resellers, CDN77 owns and deploys custom bare-metal servers, which
              isolates it from public cloud transit markups and allows aggressive price-performance positioning against
              incumbents like Akamai, Cloudflare, and Amazon CloudFront. However, enterprise streaming buyers frequently
              employ multi-CDN switching architectures such as Cedexis or internal traffic routers, commoditizing raw
              edge bandwidth and forcing vendors to compete on specialized streaming workflows and direct engineering
              access rather than proprietary network lock-in.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
