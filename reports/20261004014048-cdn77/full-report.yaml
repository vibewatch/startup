      - number: '3.2'
        title: Feature Tradeoffs and Monetization Models
        blocks:
          - type: paragraph
            body: >-
              In feature and capability benchmarks, CDN77 focuses engineering resources on low-latency live video, VoD
              packaging, and high-throughput object caching. Enterprise competitors maintain broader enterprise
              application security, Web Application Firewall (WAF) ecosystems, and serverless developer platforms. CDN77
              responds by bundling core security features, custom origin configurations, and dedicated L2 and L3
              engineering support directly into bandwidth contracts rather than selling them as premium add-ons. In
              public packaging, CDN77 provides self-serve tiers starting at $990 per month alongside custom enterprise
              volume commitments. High-volume streaming contracts achieve significant unit discounts, but buyer reviews
              highlight friction points such as pre-paid credit expiration and occasional client-side URL normalization
              constraints during scripted package retrieval.
            claimRefs:
              - CP006
