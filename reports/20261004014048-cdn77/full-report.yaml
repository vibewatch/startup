      - number: '7.2'
        title: Regulatory Approvals, Data Governance, and Multi-Jurisdictional Posture
        blocks:
          - type: paragraph
            body: >
              From a legal and regulatory perspective, CDN77 operates across dual headquarters and primary operational
              centers in Prague, Czech Republic, and London, United Kingdom, subjecting its data transport and edge
              caching operations to both EU General Data Protection Regulation (GDPR) and UK GDPR frameworks.
              Furthermore, the closing of CVC's minority equity acquisition remains subject to customary regulatory
              approvals across relevant competition and investment scrutiny bodies. As an intermediary transporting data
              to an estimated one billion unique users daily, CDN77 must navigate evolving European digital sovereignty
              legislation, including the EU Network and Information Security Directive (NIS2) and the Digital Services
              Act (DSA), which impose stringent incident reporting protocols and intermediary liability standards.


              To maintain transparent customer-facing security governance, CDN77 maintains a dedicated security
              advisories repository on its client support portal, publishing formal notices when customer-impacting
              vulnerabilities arise. As of its April 2026 audit, the platform reported zero active security advisories,
              reflecting mature core software isolation across its caching engines. Nevertheless, legal risks persist
              regarding content neutrality, copyright infringement safe harbors, and cross-border lawful access demands
              given the high volume of live sports broadcasting, gaming distributions, and video-on-demand media passing
              through its network edges.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operational Resilience, Transit Dependencies, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              CDN77's operational architecture relies on designing, deploying, and operating its own hardware platforms,
              network routers, and caching software rather than white-labeling third-party transit. While this vertical
              integration insulates the business from public cloud markups and underpins eleven consecutive years of
              positive cash flow, it introduces concentrated supply-chain exposure to Tier-1 upstream transit carriers,
              optical interconnect providers, and server component manufacturers. In particular, planned expansion into
              high-density CPU and GPU clusters tailored for artificial intelligence inference and training exposes the
              business to global semiconductor allocation bottlenecks, long lead times for server chassis, and power
              availability constraints in major data center metros.


              Governance and organizational concentration also present distinct thesis-break risks. Zdenek Cendra, who
              founded the company in 2011 and has led its bootstrapped growth for 15 years, retains majority voting
              equity and executive leadership. While senior engineering leads have tenured track records since
              inception, the business lacks public-company institutional governance depth, leaving strategic trajectory
              and key customer relationships closely tied to the founder. Diligence must monitor key counterparty
              exposure across top video accounts (such as Rakuten TV, Starz, Udemy, and Banijay), tracking potential
              multi-CDN volume rebalancing or customer churn triggers that could impair baseline operating margins.
            claimRefs:
              - CR002
              - CR006
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Competitive Scale in AI Infrastructure
            body: >-
              Scaling into dedicated CPU/GPU infrastructure and edge storage pits CDN77 directly against hyperscalers
              like AWS, Microsoft Azure, and Google Cloud, which possess vastly larger balance sheets. Without sustained
              customer commitments, heavy hardware capex could pressure CDN77's eleven-year track record of positive
              cash flows.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR007
          - type: callout
            title: Mitigation Through Direct Engineering Access and Founder Alignment
            body: >-
              CDN77 mitigates customer retention risks through direct client access to senior L2 and L3 network
              engineers rather than account managers. Furthermore, founder Zdenek Cendra's retention of majority
              ownership under the CVC partnership ensures strategic continuity and preserves the company's hands-on
              engineering ethos.
            calloutType: insight
            claimRefs:
              - CR006
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The core investment thesis for CDN77 rests on its demonstrated ability to generate high capital efficiency
              and sustained operational profitability in a physical infrastructure market where competitors have
              historically bled cash. Founded in 2011 by Czech entrepreneur Zdenek Cendra, CDN77 scaled to $218 million
              in 2025 revenue and an estimated 1 billion unique daily users without raising outside equity capital
              before September 2026. By designing and operating custom bare-metal servers, direct optical transit
              routing, and in-house edge caching across 230+ points of presence, CDN77 achieves exceptional human
              operating leverage, generating over $1.7 million in revenue per employee across its lean 126-person staff.
              Furthermore, long-duration sponsorship from CVC Strategic Opportunities validates the company's enterprise
              footprint across high-throughput media customers like Rakuten TV, Starz, and Udemy, while providing
              balance-sheet stability to pursue opportunistic infrastructure expansions into storage and compute without
              immediate debt or solvency pressure.


              Conversely, the anti-thesis highlights structural industry vulnerabilities and governance opacity that
              constrain immediate institutional underwriting. First, 90% of CDN77's network throughput is concentrated
              in streaming video delivery, a highly commoditized segment where multi-CDN enterprise buyers continuously
              squeeze transit pricing. Second, the company's strategic push into dedicated CPU/GPU infrastructure,
              Kubernetes services, and distributed storage forces it into direct competition against hyperscale cloud
              platforms possessing vastly superior capital resources and captive developer ecosystems. Crucially,
              third-party press claims suggesting SaaS-grade multiples exceeding 15x ARR mischaracterize the business:
              CDN77 is an asset-heavy infrastructure provider whose statutory gross margins, bandwidth co-location
              contracts, maintenance capex schedules, and customer churn rates remain strictly private. In addition, the
              transaction's financial terms, exact dilution, and minority board covenants remain undisclosed, leaving
              potential co-investors exposed to key-person dependency on founder Zdenek Cendra.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing Context, Capital Structure, and Relative Valuation
        blocks:
          - type: paragraph
            body: >
              On September 23, 2026, CDN77 reached a landmark liquidity milestone when private equity firm CVC Capital
              Partners agreed to acquire a minority stake through its Strategic Opportunities platform, marking the
              largest private equity transaction in the Central and Eastern European technology sector in 2026. While
              official announcements left transaction proceeds confidential, reporting from financial outlets including
              Reuters indicated an enterprise valuation of approximately $1.9 billion (€1.7 billion). Private market
              transaction trackers such as Multiples.vc benchmarked the deal at an 8.7x multiple against historical 2025
              revenue ($218 million) and a reported headline round size of $570 million, while media reporting against
              CDN77's 2026 revenue target of $270 million implies an entry multiple of roughly 7.0x forward sales.
              Founder Zdenek Cendra preserves majority equity ownership and executive control, while the senior
              management team remains intact to execute forward operations.


              Benchmarking CDN77 against peer infrastructure and cloud comparables illustrates distinct valuation
              bifurcations. Publicly listed data cloud provider UCloud Technology trades at approximately $1.9 billion
              in market valuation on $254 million in revenue, demonstrating comparable infrastructure scale. In
              contrast, enterprise AI software platform C3.ai commands an enterprise valuation of $1.8 billion on $250
              million in sales (4.7x revenue multiple) while generating substantial EBITDA losses of ($484 million).
              Private venture-backed networking and cloud data management peers—including Aviatrix ($2.0 billion
              valuation on $40 million revenue; 50.0x), Druva ($2.0 billion valuation on $100 million revenue; 20.0x),
              and Kong ($2.0 billion valuation on $100 million revenue; 20.0x)—command aggressive software multiples
              that do not reflect CDN77's bandwidth-centric infrastructure delivery model. At roughly 7.0x forward 2026
              revenue, CDN77 is priced at a full but fair multiple for a scaled, profitable infrastructure asset, yet
              the absence of audited EBITDA, customer retention cohorts, and verified cap-table preference terms
              precludes underwriting price expansion.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: Scenario Analysis, Downside Triggers, and Diligence Path
        blocks:
          - type: paragraph
            body: >
              Our forward scenario framework evaluates CDN77 across bull, base, and bear operating cases through 2028.
              In the Bull Case (20% probability), CDN77 successfully commercializes its dedicated CPU/GPU infrastructure
              and edge storage across its 230+ PoP footprint, cross-selling adjacent AI inference services into its
              enterprise video customer base. Revenue accelerates to $360 million by 2028, and multiple durability holds
              at 8.0x revenue, yielding an enterprise valuation of $2.88 billion (1.52x return). In the Base Case (60%
              probability), core video delivery continues expanding moderately toward $310 million in 2028 revenue,
              while AI infrastructure investments remain focused on boutique enterprise hosting. Multiple compression to
              5.5x revenue reflects broader infrastructure commoditization, yielding a valuation of $1.71 billion (0.90x
              return, flat capital preservation). In the Bear Case (20% probability), high GPU procurement costs and
              power commitments compress operating cash flow, tier-one streaming customers renegotiate transit pricing
              via multi-CDN routers, and revenue stalls at $240 million. Multiple compression to 3.5x revenue results in
              a down-round valuation of $840 million (0.44x return, 56% drawdown).


              Based on this evidence architecture, we assign an overall Track recommendation with Medium confidence,
              High risk rating, and Fair valuation stance. Downside triggers that would prompt a downgrade to Avoid
              include margin compression below cash-flow breakeven, loss of anchor streaming accounts, or aggressive
              debt leverage to fund GPU clusters. Conversely, an upgrade to Buy requires confirmatory diligence access:
              verifying audited gross margins, inspecting CVC's minority protective covenants, confirming regulatory
              closing approvals across cross-border screening jurisdictions, and auditing customer retention cohorts.
              Until these private records are independently examined, institutional investors should monitor CDN77's
              operational progress rather than chasing secondary equity allocations at peak headline multiples.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Prudent Entry Discipline: Track Over Early Capital Commitment'
            body: >-
              Although CDN77's bootsrapped track record and multi-terabit network represent rare achievements in
              European deep tech, the reported $1.9 billion valuation leaves minimal room for multiple expansion.
              Investors should track operational execution in edge AI compute and condition any direct equity investment
              on audited margin verification and downside governance protections.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV011
          - type: callout
            title: Capital Intensity Escalation in Emerging Workloads
            body: >-
              Transitioning from self-funded network transit to GPU-dense AI inferencing clusters drastically shifts
              capital intensity. Competing against AWS, Microsoft Azure, and Google Cloud demands massive balance-sheet
              commitments that could erode CDN77's historic cash-flow resilience if utilization falters.
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV014
              - CV015
