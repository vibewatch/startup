        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              The strongest overview signal is scale achieved while retaining founder control: disclosed network
              capacity, 2025 revenue, and the CVC minority transaction all point to an established private
              infrastructure operator rather than an early-stage startup. The central underwriting questions sit behind
              those headline metrics. Revenue quality, customer concentration, capital expenditure, debt, and cash
              conversion are not available here, and the $1.9 billion figure comes from third-party reporting rather
              than published deal terms. Dealroom also flags that expansion into capital-heavy AI and GPU infrastructure
              brings competition from much larger cloud and hyperscale operators. The investment case therefore depends
              on verifying transaction mechanics, audited financials, cohort retention, capacity economics, governance
              rights, and management depth. Until those items are supplied, the announced partnership demonstrates
              external sponsor interest but does not establish cash proceeds, a closed transaction, or reduced
              key-person risk.
