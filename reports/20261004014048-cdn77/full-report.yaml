        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The operating model is vertically integrated at the network, hardware, and software layers. CVC's
              transaction announcement says CDN77 builds and runs all three, a description repeated by independent
              coverage. The official edge-compute page places programmable logic directly in the HTTP request lifecycle:
              plugins are developed with a Rust SDK, compiled to WebAssembly, and can use built-in key-value storage for
              configuration or shared state. The same page reports 235 points of presence across 135 countries and 330
              Tbps of global network capacity; CVC and The Recursive separately describe more than 230 locations and the
              same 330 Tbps capacity figure. These are capacity and footprint disclosures, not uptime, latency, or
              delivered-throughput benchmarks. A historical ColoHouse case study also shows that physical expansion
              depends on colocation access, exchange connectivity, onsite support, and the ability to install
              CDN77-specific hardware.
