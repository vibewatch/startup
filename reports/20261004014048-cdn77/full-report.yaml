        - Upstream IP transit and inter-PoP fiber transport
        - High
        - Fiber cut, transit price hike, or route de-peering
        - High
        - Multi-homed BGP routing across Tier-1 carriers and major internet exchanges
        - Margin compression if upstream IP transit unit costs increase unexpectedly
      - - Anchor Enterprise Media Clients
        - Tier-1 Streaming Platforms (Rakuten TV, Starz, Udemy)
        - Primary volume drivers accounting for baseline throughput
        - High
        - Customer renegotiates rates or shifts traffic to multi-CDN competitors
        - High
        - Direct L2/L3 engineering support, custom caching, long-term contract lock-in
        - Volume shock if major streaming platform rebalances multi-CDN allocation
      - - Hardware & Component Suppliers
        - Server OEMs & Semiconductor Vendors (Nvidia, Supermicro)
        - Bare-metal edge servers and specialized GPU clusters
        - Medium
        - Component allocation delays, GPU shortages, hardware defects
        - Medium
        - Multi-vendor sourcing strategy, owned engineering design, buffer stock
        - Delayed rollout of dedicated AI inference and storage service roadmap
      - - Private Equity Capital Partner
        - CVC Capital Partners (Strategic Opportunities)
        - Institutional minority shareholder and governance partner
        - Medium
        - Strategic misalignment on exit horizon or dividend distribution pressure
        - Medium
        - Founder Zdenek Cendra retains majority equity ownership and CEO control
        - Potential friction regarding capital allocation between dividends and reinvestment
    notes: >-
      Ordered by severity. Synthesizes key supplier, customer, and financing dependencies identified across CDN77's
      operating infrastructure.
    claimRefs:
      - CR002
      - CR006
      - CR007
      - CR014
      - CR015
  - id: TV001
    title: Recommendation and Valuation Stance Summary
    columns:
      - Investment Metric
      - Assigned Value
      - Analytical Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Profitable infrastructure business with strong customer scale but lacking audited gross margin proof
        - Maintain active monitoring; withhold direct equity capital until confirmatory diligence access is granted
      - - Confidence Level
        - Medium
        - >-
          Multiple independent sources corroborate revenue, valuation mark, and CVC deal structure, but internal
          financials remain private
        - Rely on verified deal terms while discounting speculative third-party SaaS valuation multiples
      - - Risk Rating
        - High
        - >-
          Significant video workload concentration (90%), bandwidth pricing pressure, and steep capex in AI/GPU
          expansion
        - Require downside protections, conservative leverage terms, and clear liquidation preference priority
      - - Valuation Stance
        - Fair
        - >-
          Entry valuation of $1.9B represents ~7.0x 2026E revenue ($270M) or 8.7x 2025 revenue ($218M), fully pricing
          core CDN execution
        - Unfavorable risk/reward for multiple expansion without verified proprietary margin differentiation
      - - Target Horizon
        - 3 to 5 Years
        - >-
          Alinged with CVC Strategic Opportunities' long-duration capital platform and multi-year AI infrastructure
          rollout
        - Underwrite liquidity through secondary buyouts, strategic hyperscaler sale, or eventual European IPO
    notes: >-
      Recommendation and stance synthesized from verified September 2026 CVC transaction terms, public comparables, and
      operational infrastructure metrics.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV008
      - CV011
  - id: TV002
    title: Investment Thesis vs. Anti-Thesis Matrix
    columns:
      - Dimension
      - Investment Thesis (Bull Position)
      - Core Anti-Thesis (Bear Position)
      - What Would Change the View
    rows:
      - - Operational Profitability
        - 11 consecutive years of positive cash flow funded 230+ PoPs and 330 Tbps without external equity
        - Asset-heavy physical network requires ongoing hardware refresh and power/colocation commitments
        - Audited EBITDA statements proving free cash flow margins exceed 20% net of maintenance capex
      - - Operating Leverage
        - 126 employees generate $218M revenue (> $1.7M/employee) through automated engineering operations
        - Lean headcount limits enterprise sales reach and complex customer solution engineering
        - Proof of sustained high ARR per employee alongside expansion of enterprise sales and solutions staff
      - - Product & Market Breadth
        - Expansion into storage, Kubernetes, and dedicated CPU/GPU infrastructure broadens addressable spend
        - Entering AI/GPU infrastructure pits CDN77 directly against hyperscalers with massive capital scale
        - Verified enterprise pre-commitments for GPU clusters with positive unit contribution margins
      - - Customer & Traffic Profile
        - Serves 1B unique daily users and premier digital media accounts (Rakuten TV, Starz, Udemy)
        - 90% video delivery concentration creates vulnerability to customer churn and multi-CDN switching
        - Contractual proof of multi-year minimum volume commitments and low net revenue churn (< 5%)
      - - Capital Backing & Governance
        - CVC Strategic Opportunities brings €212B sponsor scale, institutional stability, and long hold horizons
        - Founder Zdenek Cendra retains majority control; exact minority covenants and liquidity paths are undisclosed
        - Inspection of shareholder agreement confirming board governance representation and drag-along covenants
    notes: Matrix balances operational strengths against disclosed risk factors and structural diligence requirements.
    claimRefs:
