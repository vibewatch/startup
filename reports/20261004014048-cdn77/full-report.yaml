    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and scale
        blocks:
          - type: paragraph
            body: >-
              Founded in 2011 by Zdenek Cendra, CDN77 operates as a content-delivery and internet- infrastructure
              provider rather than a pure software vendor. Its model is vertically integrated: the company says it
              designs and runs its network, hardware platforms, and software stack, with content delivery at the core
              and storage, edge compute, and dedicated CPU/GPU infrastructure as adjacencies. The company homepage
              reports $218 million of revenue for 2025, explicitly a revenue figure rather than ARR, and more than 230
              locations with 330 Tbps of network capacity are repeated in company and third-party accounts. Public
              profiles associate the business with both London and Prague, but no corporate filing in the assigned
              evidence establishes the legal headquarters. A current customer count is also unavailable; the only
              numeric directory entry is an undated, stale figure published in 2025 and should not be treated as the
              present installed base.
