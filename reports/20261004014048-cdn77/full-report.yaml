              - CU003
              - CU004
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU012
              - CU015
      - number: '6.3'
        title: Retention Dynamics and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention and lifetime contract durability at CDN77 are heavily underpinned by its
              engineering-led operational philosophy, where clients receive direct communication channel access to L2
              and L3 network engineers rather than tiered account representatives. Leadership has explicitly prioritized
              multi-year customer relationships over quarterly billing optimization, contributing to eleven consecutive
              years of positive operating cash flow. However, the commercial profile exhibits structural concentration
              vulnerabilities. With 90% of traffic concentrated in video streaming, gross margins and capacity
              utilization remain highly sensitive to traffic shifts, renegotiations, or multi-CDN rebalancing by a
              handful of anchor media accounts. Furthermore, while peer review platforms note that CDN77 offers
              competitive entry and setup costs compared to Akamai or Arbor DDoS, enterprise buyers also note that
              competitors provide more comprehensive native web application security and distributed threat detection
              stacks. The expansion roadmap supported by CVC's 2026 minority investment aims to broaden account
              penetration by cross-selling Kubernetes-as-a-service, edge compute, and dedicated AI GPU infrastructure
              into the existing enterprise customer base.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: High Vertical Concentration in Streaming Video
            body: >-
              With 90% of CDN77's delivered traffic concentrated in streaming video, the business is exposed to volume
              rebalancing and pricing pressure from large entertainment and VOD platforms. Maintaining infrastructure
              margins requires sustained multi-service expansion into edge compute and storage.
            calloutType: risk
            claimRefs:
              - CU002
              - CU014
          - type: callout
            title: Engineer-to-Engineer Customer Support Moat
            body: >-
              Direct access to L2 and L3 engineers via dedicated communication channels provides a distinct operational
              advantage over legacy CDN vendors. This hands-on model has driven client durability and supported eleven
              consecutive years of cash-flow-positive growth.
            calloutType: strength
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Taxonomy and Capital Exposure
        blocks:
          - type: paragraph
            body: >
              Evaluating CDN77's operational profile reveals four primary risk dimensions: workload and customer
              concentration in streaming video, execution complexity surrounding capital-heavy AI and GPU infrastructure
              expansion, cross-border regulatory compliance spanning the European Union and the United Kingdom, and
              key-person dependency on founder Zdenek Cendra. Operating a global network spanning more than 230
              locations with 330 Tbps of network capacity requires substantial continuous hardware maintenance and
              network transit commitments. Because approximately 90% of all delivered data is concentrated in video
              streaming, any macro disruption in digital media consumption, customer platform churn, or multi-CDN
              switching directly affects utilization economics across its physical edge footprint.


              The agreed minority partnership with CVC Capital Partners through its Strategic Opportunities
              platform—valuing CDN77 at approximately $1.9 billion (€1.7 billion)—injects substantial balance-sheet
              credibility to support higher-tier enterprise contracts and expansion into adjacent compute. However,
              moving beyond core content delivery into dedicated bare-metal servers, Kubernetes-as-a-service, edge
              storage, and GPU clusters forces CDN77 to confront hyperscale cloud providers with vastly larger R&D and
              capital expenditure budgets. Navigating this shift requires rigorous capital discipline to avoid margin
              compression in commoditized transit while funding long-cycle infrastructure build-outs.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
