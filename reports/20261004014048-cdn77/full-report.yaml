  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Service Scope
        blocks:
          - type: paragraph
            body: >-
              The content delivery network (CDN) market encompasses globally distributed server infrastructure
              engineered to cache, optimize, and transport digital assets closer to end users. CDN77 positions its
              commercial architecture squarely around high-throughput data movement, with video delivery comprising
              approximately 90% of total delivered network volume. While legacy CDN deployments focused predominantly on
              static asset caching and simple web acceleration, contemporary enterprise demand spans low-latency live
              video streaming, adaptive bitrate delivery, and dynamic edge acceleration. Beyond core bandwidth
              transport, CDN77 has expanded its service boundary into adjacent infrastructure layers, including
              S3-compatible cloud storage with zero egress fees, container execution, and dedicated CPU and GPU compute
              instances. These adjacent offerings allow the company to capture broader enterprise infrastructure
              spending while defending against commoditization in pure-play transit.
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM011
      - number: '2.2'
        title: Addressable Market Sizing and TAM/SAM/SOM Architecture
        blocks:
          - type: paragraph
            body: >-
              Independent industry projections from ResearchAndMarkets evaluate the global content delivery network
              market at $24.25 billion in 2025, forecasting expansion to $103.4 billion by 2035 at a compound annual
              growth rate (CAGR) of 15.61%. Growth across this broad total addressable market (TAM) is driven by
              escalating video consumption, the proliferation of over-the-top (OTT) streaming platforms, and
              data-intensive gaming workloads. Within this macro boundary, media and entertainment represents the
              dominant end-user category, where web performance optimization solutions currently capture the majority
              share of commercial spending. From a geographic perspective, North America commands the largest regional
              share of global demand, followed by Europe and rapidly expanding Asia-Pacific markets. Against this
              broader sizing lens, CDN77 targets an addressable segment focused on heavy-traffic digital platforms,
              generating $218 million in 2025 revenue and targeting approximately $270 million in 2026.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM008
              - CM014
