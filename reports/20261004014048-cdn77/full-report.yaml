      - number: '5.3'
        title: Deployment, support, and roadmap maturity
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a high-touch enterprise deployment model. CDN77 says edge computing is
              designed and implemented with its engineers rather than presented as a wholly self-serve runtime, and its
              homepage promises direct L2/L3 engineering access plus client-specific customization. That service model
              can reduce implementation friction for demanding customers, but it also makes onboarding capacity,
              deployment lead time, and support scalability important diligence questions. The stated next product
              frontier is broader infrastructure: CVC and The Recursive describe planned or expanding storage, edge
              compute, and dedicated CPU/GPU capacity for applications including AI workloads. Neither source gives
              deployment dates, installed GPU capacity, utilization, customer adoption, or a separation between
              currently shipping services and forward expansion. The roadmap should therefore be underwritten as
              directionally credible but operationally unverified.
            claimRefs:
              - CE010
              - CE011
              - CE013
      - number: '5.4'
        title: Differentiation, trust controls, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The strongest disclosed differentiation is control over the delivery stack combined with video
              specialization and request-path programmability. The WebAssembly runtime is described as sandboxed with
              strict isolation and defined CPU and memory limits, while a third-party review reports DDoS protection,
              token authentication, geo-blocking, SSL certificates, analytics, and API access. These statements identify
              controls but do not substitute for audited security evidence. An independent provider review also claims
              CDN77 lacks enterprise WAF custom rules and bot management and has limited Asia and South America
              coverage; those limitations require direct product verification because the review also uses an older,
              materially smaller node count than current company disclosures. No assigned source provides SOC 2 or ISO
              certificates, penetration-test results, a public incident history, uptime/SLA performance, or
              developer-community adoption data. The resulting diligence case is a technically coherent product with
              meaningful verification gaps at the trust and operating performance layers.
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration depth is the central technical thesis
            body: >-
              CDN77 combines video-oriented delivery, inline WebAssembly logic, and company-described ownership of
              network, hardware, and software. That integration can support close control of the request path, but
              public sources do not quantify the resulting customer performance.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
          - type: callout
            title: Scale disclosures are not reliability evidence
            body: >-
              The reported 235 points of presence and 330 Tbps of global network capacity establish footprint and
              capacity only. Underwriting still requires uptime, incident, failover, security-audit, and independently
              measured performance evidence.
            calloutType: risk
            claimRefs:
              - CE005
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              CDN77's commercial customer base is bifurcated between high-throughput global digital entertainment
              platforms and a diversified mid-market enterprise segment. At the top of the pyramid, tier-one media
              platforms, live sports broadcasters, video-on-demand services, and gaming operators represent the
              overwhelming majority of network utilization, with company disclosures noting that 90% of all delivered
              data is dedicated to streaming video. These buyers—exemplified by Starz, Rakuten TV, Sport1, Banijay, and
              Udemy—procure high-capacity transit and edge distribution to ensure low-latency delivery during peak
              viewing events and global release windows. Conversely, technographic census data reveals a substantial
              secondary tier of enterprise and public-sector accounts, including municipal transit authorities,
              educational institutions, retail distributors, and regional manufacturers that consume standard web
              acceleration, TLS termination, and static asset caching. While long-tail web buyers choose CDN77 for
              transparent self-service pricing and straightforward deployment, enterprise media accounts contract
              directly for dedicated capacity and bespoke origin caching configurations.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Named Enterprise Proof
        blocks:
          - type: paragraph
            body: >-
              Adoption across CDN77's customer base reflects steady expansion from regional website acceleration into
              mission-critical global media delivery. Historical directory tracking recorded over 8,800 clients across
              Europe, the United States, South America, and Asia during earlier phases of network build-out. By 2026,
              the company's edge footprint scaled to more than 230 points of presence with 330 Tbps of network capacity,
              serving over one billion unique users daily and generating $218 million in 2025 revenue. Named enterprise
              deployments demonstrate diverse operational workloads: video streaming provider Rakuten TV and broadcast
              producer Banijay utilize CDN77 for high-definition streaming delivery; online learning platform Udemy
              relies on edge caching for course distribution; and large public bodies such as the Municipal Transport
              Company of Madrid deploy edge infrastructure for public portal availability. Peer comparisons on
              enterprise review platforms highlight that buyers frequently evaluate CDN77 against legacy providers like
              Akamai and Cloudflare, favoring CDN77's personalized support model and transparent pricing over complex
              enterprise contracts.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU013
          - type: table
            tableRef: TU003
