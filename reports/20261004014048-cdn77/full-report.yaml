      - number: '3.3'
        title: Differentiation Durability and Substitution Risk
        blocks:
          - type: paragraph
            body: >-
              CDN77's competitive durability rests on cost efficiency derived from owned server hardware, private
              network backbones, and lean operations that generated 11 consecutive years of positive cash flow. To
              defend against edge commoditization, the company has announced expansion into digital storage, edge
              compute, Kubernetes-as-a-service, and dedicated CPU and GPU infrastructure for AI workloads backed by
              minority growth capital from CVC. Nonetheless, substantial substitution risks remain. Large media buyers
              retain high switching elasticity by maintaining multi-CDN configurations that instantly shift traffic
              between vendors based on real-time latency and spot pricing. As hyperscalers leverage bundled enterprise
              cloud credits and zero-egress internal networks, CDN77 must continually expand into adjacent compute
              workloads to prevent margin erosion in its core streaming delivery business.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Cost Advantage from Owned Infrastructure
            body: >-
              By owning and operating its physical server hardware and 20 Tbps private backbone across 230 locations,
              CDN77 sustains gross margin advantages over virtualized resellers, enabling competitive video delivery
              pricing while maintaining 11 consecutive years of positive operational cash flow.
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP014
          - type: callout
            title: Multi-CDN Switching and Bandwidth Commoditization
            body: >-
              Enterprise video platforms routinely implement multi-CDN routing and dynamic traffic steering, creating
              high price elasticity and low switching costs that expose bandwidth-heavy CDN providers to continuous
              margin compression.
            calloutType: risk
            claimRefs:
              - CP003
              - CP005
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Topline Scale
        blocks:
          - type: paragraph
            body: >-
              CDN77 operates a vertically integrated global content delivery network and infrastructure platform
              delivering high-volume digital media, live streaming, video on demand, and software artifacts. The core
              monetization mechanism is usage-based bandwidth and delivery capacity, complemented by custom enterprise
              contracts for high-throughput clients and adjacent managed infrastructure under the CDN77 and DataPacket
              brands. For fiscal year 2025, CDN77 officially reached annual revenue of $218 million, positioning the
              business among the top five independent CDN providers globally by top-line revenue scale. Management has
              publicly disclosed a revenue target of approximately $270 million for fiscal year 2026, representing
              approximately 24% year-over-year revenue expansion. In the first quarter of 2026, CDN77 disclosed revenue
              of $63.9 million, demonstrating run-rate consistency with its full-year guidance trajectory. The revenue
              profile is heavily anchored in media delivery, with 90% of total delivered data volume dedicated to video
              traffic. While top-line scale is robust, revenue recognition policies, contract duration splits, committed
              minimums versus overage fees, and net revenue retention figures remain private and undisclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
