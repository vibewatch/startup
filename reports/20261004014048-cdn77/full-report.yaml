              - CI008
              - CI011
      - number: '4.3'
        title: Capital Adequacy, Valuation Multiples, and Forward Diligence
        blocks:
          - type: paragraph
            body: >-
              In September 2026, private equity group CVC Capital Partners agreed to acquire a minority stake in CDN77
              through its Strategic Opportunities platform, establishing an enterprise valuation of approximately $1.9
              billion. Founder and chief executive officer Zdenek Cendra retains majority ownership and operational
              control. Prior to this growth transaction, CDN77 was entirely bootstrapped and self-funded, having
              operated without institutional venture capital or private equity backing since its 2011 founding. At the
              reported $1.9 billion valuation against targeted 2026 revenue of $270 million, the implied forward revenue
              multiple is roughly 7x sales, which aligns favorably against capital-intensive infrastructure benchmarks
              despite third-party speculation suggesting hypothetical SaaS multiples exceeding 15x ARR. The primary
              strategic catalyst for external capital is funding heavy capital expenditures required to expand into
              AI-oriented CPU/GPU compute clusters, Kubernetes as a service, and storage. Diligence blockers remain
              around debt facility obligations, customer concentration among anchor media accounts, and capital
              efficiency when competing against hyperscale cloud platforms.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Exceptional Human Capital Operating Leverage
            body: >-
              With 126 employees generating $218 million in 2025 revenue (over $1.73 million per employee), CDN77
              demonstrates extreme operational efficiency. By prioritizing engineer-to-engineer customer interactions
              and automating infrastructure deployments, the company avoided the bloated GTM overhead common in
              enterprise SaaS peers.
            calloutType: insight
            claimRefs:
              - CI003
              - CI008
              - CI011
          - type: callout
            title: Capital Intensity Escalation in AI and GPU Workloads
            body: >-
              While CDN77 successfully bootstrapped its global CDN across 230+ edge locations using internal cash flow,
              competing in dedicated AI inferencing, GPU hosting, and edge compute exposes the business to steep
              hardware depreciation cycles, volatile silicon supply chains, and direct competition from well-capitalized
              hyperscalers.
            calloutType: risk
            claimRefs:
              - CI010
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              CDN77's core customer job is to move latency-sensitive content from an origin to distributed users while
              reducing work at the origin. Video is the clearest specialization: the company says 90% of delivered data
              is video, while an independent review identifies HLS, DASH, and CMAF support. A third-party company
              profile also lists website acceleration, software distribution, HD/4K video delivery, gaming-site
              acceleration, and customized private CDN solutions, although that profile is historical and does not
              establish the current packaging of each line. The current edge-compute surface extends the workflow from
              caching into request inspection, access validation, transformation, routing, and cache-key control before
              traffic reaches origin systems. This makes CDN77 a delivery and request-processing platform, not merely a
              reseller of bandwidth, but public proof is stronger for capability descriptions than for independently
              measured customer outcomes.
            claimRefs:
