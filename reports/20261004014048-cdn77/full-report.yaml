      - number: '4.2'
        title: Cost Structure and Infrastructure Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Unlike virtualized edge software providers that lease third-party public cloud compute or white-label
              commodity capacity, CDN77 designs, builds, and directly operates its own physical network, custom server
              hardware platforms, and software routing stack. The infrastructure footprint encompasses more than 230
              points of presence globally, delivering 330 Tbps of network edge throughput capacity. The company operates
              with a lean headcount base of 126 employees as of August 2026, yielding exceptional human capital
              productivity with revenue per employee exceeding $1.7 million based on 2025 performance. Capital
              expenditures and cost of goods sold are primarily driven by server procurement, edge co-location leases,
              network transit, dark fiber interconnection, and power consumption. CDN77 has remained cash-flow positive
              for eleven consecutive years, demonstrating that historical edge build-out and ongoing physical expansion
              have been funded entirely out of operational cash generation. However, audited gross margins, transit
              pricing curves, depreciation schedules, and maintenance capital expenditures are not publicly disclosed,
              creating diligence gaps for institutional margin underwriting.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
