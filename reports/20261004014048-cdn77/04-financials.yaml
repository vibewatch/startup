    title: "Exceptional Human Capital Operating Leverage"
    body: "With 126 employees generating $218 million in 2025 revenue (over $1.73 million per employee), CDN77 demonstrates extreme operational efficiency. By prioritizing engineer-to-engineer customer interactions and automating infrastructure deployments, the company avoided the bloated GTM overhead common in enterprise SaaS peers."
    claimRefs:
      - "CI003"
      - "CI008"
      - "CI011"
  - calloutType: "risk"
    title: "Capital Intensity Escalation in AI and GPU Workloads"
    body: "While CDN77 successfully bootstrapped its global CDN across 230+ edge locations using internal cash flow, competing in dedicated AI inferencing, GPU hosting, and edge compute exposes the business to steep hardware depreciation cycles, volatile silicon supply chains, and direct competition from well-capitalized hyperscalers."
