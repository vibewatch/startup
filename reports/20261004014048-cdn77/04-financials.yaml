chapter:
  number: 4
  title: "Financials"
  summary: "CDN77 reached $218 million in revenue in 2025 and targets approximately $270 million in 2026, sustaining eleven consecutive years of positive cash flow without prior external institutional funding. A September 2026 transaction with CVC Capital Partners valued the company at roughly $1.9 billion for a minority stake to accelerate adjacent storage, compute, and AI infrastructure workloads."
sections:
  - id: "revenue-model-and-topline-scale"
    title: "Revenue Model and Topline Scale"
    body: "CDN77 operates a vertically integrated global content delivery network and infrastructure platform delivering high-volume digital media, live streaming, video on demand, and software artifacts. The core monetization mechanism is usage-based bandwidth and delivery capacity, complemented by custom enterprise contracts for high-throughput clients and adjacent managed infrastructure under the CDN77 and DataPacket brands. For fiscal year 2025, CDN77 officially reached annual revenue of $218 million, positioning the business among the top five independent CDN providers globally by top-line revenue scale. Management has publicly disclosed a revenue target of approximately $270 million for fiscal year 2026, representing approximately 24% year-over-year revenue expansion. In the first quarter of 2026, CDN77 disclosed revenue of $63.9 million, demonstrating run-rate consistency with its full-year guidance trajectory. The revenue profile is heavily anchored in media delivery, with 90% of total delivered data volume dedicated to video traffic. While top-line scale is robust, revenue recognition policies, contract duration splits, committed minimums versus overage fees, and net revenue retention figures remain private and undisclosed."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-capital-intensity"
    title: "Cost Structure and Infrastructure Capital Intensity"
    body: "Unlike virtualized edge software providers that lease third-party public cloud compute or white-label commodity capacity, CDN77 designs, builds, and directly operates its own physical network, custom server hardware platforms, and software routing stack. The infrastructure footprint encompasses more than 230 points of presence globally, delivering 330 Tbps of network edge throughput capacity. The company operates with a lean headcount base of 126 employees as of August 2026, yielding exceptional human capital productivity with revenue per employee exceeding $1.7 million based on 2025 performance. Capital expenditures and cost of goods sold are primarily driven by server procurement, edge co-location leases, network transit, dark fiber interconnection, and power consumption. CDN77 has remained cash-flow positive for eleven consecutive years, demonstrating that historical edge build-out and ongoing physical expansion have been funded entirely out of operational cash generation. However, audited gross margins, transit pricing curves, depreciation schedules, and maintenance capital expenditures are not publicly disclosed, creating diligence gaps for institutional margin underwriting."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy-and-cvc-partnership"
    title: "Capital Adequacy, Valuation Multiples, and Forward Diligence"
    body: "In September 2026, private equity group CVC Capital Partners agreed to acquire a minority stake in CDN77 through its Strategic Opportunities platform, establishing an enterprise valuation of approximately $1.9 billion. Founder and chief executive officer Zdenek Cendra retains majority ownership and operational control. Prior to this growth transaction, CDN77 was entirely bootstrapped and self-funded, having operated without institutional venture capital or private equity backing since its 2011 founding. At the reported $1.9 billion valuation against targeted 2026 revenue of $270 million, the implied forward revenue multiple is roughly 7x sales, which aligns favorably against capital-intensive infrastructure benchmarks despite third-party speculation suggesting hypothetical SaaS multiples exceeding 15x ARR. The primary strategic catalyst for external capital is funding heavy capital expenditures required to expand into AI-oriented CPU/GPU compute clusters, Kubernetes as a service, and storage. Diligence blockers remain around debt facility obligations, customer concentration among anchor media accounts, and capital efficiency when competing against hyperscale cloud platforms."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
