      - number: '7.4'
        title: 支撑底稿
        blocks:
          - type: callout
            title: AI 基础设施的资本密集度与竞争体量差距
            body: >-
              向专属 CPU/GPU 基础设施与边缘存储扩张，使 CDN77 直面 AWS、Microsoft Azure 和 Google Cloud
              等超大规模厂商的正面阻击，后者资产负债表规模呈现压倒性优势。若无坚实的客户采购订单背书，沉重的硬件资本开支恐将对 CDN77 连续 11 年正向现金流记录构成实质性拖累。
            calloutType: risk
