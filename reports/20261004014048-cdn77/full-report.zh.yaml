      - number: '8.2'
        title: 融资背景、资本结构与相对估值对标
        blocks:
          - type: paragraph
            body: >
              2026 年 9 月 23 日，私募巨头 CVC Capital Partners 达成协议，由旗下 Strategic Opportunities 基金收购少数股权，成为 2026
              年中东欧科技领域规模最大的私募股权交易，为 CDN77 树立了里程碑式的流动性标杆。虽然官方通告未予披露交易对价，但包括路透社在内的权威财经媒体报道其企业估值约 $1.9B（17
              亿欧元，€1.7b）。Multiples.vc 等一级市场追踪机构基于 2025 年 $218M 历史营收与媒体披露的 $570M 交易规模，测算出该轮估值倍数为 8.7 倍市销率（P/S）；对照 CDN77
              披露的 2026 年 $270M 目标收入，隐含入场倍数约为 7.0 倍预期市销率。创始人 Zdenek Cendra 继续保留多数股权与管理控制权，高管团队全员留任执行后续运营。


              将 CDN77 与基础设施和云计算可比同业对标，呈现出清晰的估值层级分化。上市数据云服务商 UCloud Technology 凭借 $254M 营收规模取得约 $1.9B
              市值，展现出相近的基础设施体量。相比之下，企业 AI 软件平台 C3.ai 凭借 $250M 营收录得 $1.8B 企业估值（4.7 倍市销率），同期录得 ($484M) 的巨额 EBITDA
              亏损。风险投资支持的私有网络与云数据管理同行——包括 Aviatrix（$40M 营收规模估值 $2.0B；50.0 倍）、Druva（$100M 营收规模估值 $2.0B；20.0 倍）与 Kong（$100M
              营收规模估值 $2.0B；20.0 倍）——虽享有高昂的软件估值乘数，但与 CDN77 依赖带宽流量的基础设施交付模式缺乏可比性。以约 7.0 倍 2026
              年预期市销率定价，对一家具备规模且持续盈利的基础设施企业而言估值充分合理；但在缺乏经审计 EBITDA、分客群留存数据与经核实的股权优先清算条款前提下，尚无充分依据将估值倍数扩张计入投资判断。
