              的企业估值。创始人兼 CEO Zdenek Cendra 保留控股权与经营主导权。在本次增长性交易前，CDN77 始终采取自筹资金滚动发展模式，自 2011 年成立以来从未引入风险投资或私募股权资本。以媒体报道的
