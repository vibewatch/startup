            - 已披露的 330 Tbps 全球网络容量
            - 依赖第三方机房托管与网络交换中心互联
        - label: 战略业务扩展层
          detail: 融资并购材料提及的广阔基础设施衍生服务，目前尚无量化部署指标。
          items:
