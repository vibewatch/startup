      - number: '3.2'
        title: 功能取舍与商业化变现模式
        blocks:
          - type: paragraph
            body: >-
              横向比对功能特性，CDN77 将工程资源重度倾斜至低延迟实时视频、VoD 点播转码切片与高吞吐对象缓存。企业级竞争对手则构筑了更完善的企业应用安全体系、Web
              应用防火墙（WAF）生态与无服务器开发者平台。CDN77 的应对策略是将基础安全防护、自定义源站配置以及专属 L2/L3 技术支持直接打包计入带宽合约，而非拆分为高昂增值模块。公开产品包装上，CDN77
              既提供每月 $990 起步的自助服务套餐，也承接定制化企业大客户用量合约。大流量流媒体客户可获取显著单价折扣，但买方评测也指出若干使用痛点，例如预付额度存在有效期限，以及自动化脚本抓取包时偶发客户端 URL
              规范化限制。
