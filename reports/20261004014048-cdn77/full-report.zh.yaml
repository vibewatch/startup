companyProfile:
  summary: >-
    CDN77 成立于 2011 年，由 Zdenek Cendra 创立，是一家创始人控股的私有内容分发与互联网基础设施企业。公司运营垂直整合的网络与产品栈，业务覆盖 CDN、云存储、边缘计算与专用基础设施，公开披露网络规模达
    230+ 个节点，总带宽容量达 330 Tbps。公司公布 2025 财年收入 $218M，并在 2026 年 9 月宣布引入 CVC 少数股权投资，但公司治理条款、审计后财务数据与当前客户集中度仍未公开。
