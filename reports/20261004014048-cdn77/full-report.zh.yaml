    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位、运营模式与网络规模
        blocks:
          - type: paragraph
            body: >-
              CDN77 由 Zdenek Cendra 于 2011
              年创立，定位为内容分发与互联网基础设施提供商，而非纯软件厂商。其模式高度垂直整合：公司表示其自主设计并运营网络、硬件平台及软件栈，以内容分发为核心，衍生覆盖存储、边缘计算以及专用 CPU/GPU
              基础设施。公司官网披露 2025 年收入 $218M（明确为营业收入而非 ARR），且公司声明及第三方报告均反复引述其拥有 230+ 个节点和 330 Tbps
              网络容量。公开资料显示其在伦敦和布拉格两地均有业务，但当前证据库中的公司登记文件均未明确法定总部所在地。当前客户总数同样未予披露；行业名录中唯一的客户数字为 2025
              年发布的未注明日期历史数据，不应视作当前实际装机量。
