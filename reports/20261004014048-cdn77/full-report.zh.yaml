      - number: '2.4'
        title: 增长催化剂、落地阻力与竞争逆风
        blocks:
          - type: paragraph
            body: >-
              独立边缘基础设施的应用落地受到三重结构性利好驱动：4K 与低延迟互动流媒体传输量爆发、企业为防范单点供应商宕机而推行的多 CDN
              对冲策略，以及定制化低延迟计算的刚性运维诉求。然而，该领域亦面临显著的落地阻力与竞争逆风。CDN 带宽传输具备高资本密集度特征，需在数百个全球节点持续投入硬件以维系线速传输容量。此外，CDN77
              积极扩展面向高负载 AI 推理的专用 CPU 与 GPU 基础设施，直面 AWS、Microsoft Azure 和 Google Cloud
              等超大规模云厂商的严峻竞争。后者拥有庞大的资产负债表、交叉补贴的带宽成本优势以及根深蒂固的企业开发者生态。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 支撑底稿
        blocks:
          - type: callout
            title: 视频分发专业化构成防御性市场切入点
            body: 通用型 CDN 与超大规模云厂商在静态网页分发上展开激烈价格战，而 CDN77 将 90% 的网络流量聚焦于高吞吐视频分发，可借此构建定制化缓存架构与成本优势，精准切中注重利润率的流媒体平台需求。
            calloutType: insight
            claimRefs:
              - CM004
              - CM010
          - type: callout
            title: 新兴边缘 AI 负载遭遇超大规模云厂商挤压
            body: CDN77 战略性进军面向 AI 推理的专用 CPU 与 GPU 基础设施，使公司从单纯带宽传输延伸至与成熟云巨头的正面战场，而后者具备显著更优的资金储备与集成开发者生态。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场替代方案与架构细分
        blocks:
          - type: paragraph
            body: >-
              内容分发网络竞争格局呈现清晰的三级分化：传统企业级 CDN 与超大规模云厂商、中端视频与网页加速专精厂商，以及新兴多 CDN 边缘平台。CDN77 主要卡位大流量视频与软件分发赛道，依托自建物理基础设施，运营
              230+ 个网络节点与 330 Tbps 带宽容量。不同于纯软件服务商或带宽转售商，CDN77 自研并部署裸金属服务器，消除了公有云带宽加价成本，进而对抗 Akamai、Cloudflare 和 Amazon
              CloudFront 等老牌厂商时具备极具竞争力的性价比。然而，企业级流媒体买方广泛采用 Cedexis 或自研流量调度网关等多 CDN
              切换架构，将底层边缘带宽过度同质化，迫使各供应商转而在定制化流媒体工作流与直通资深工程师支持上建立壁垒，而非依赖私有网络锁定客户。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
