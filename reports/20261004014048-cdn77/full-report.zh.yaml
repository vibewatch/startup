      - number: '3.3'
        title: 差异化壁垒持久度与替代风险
        blocks:
          - type: paragraph
            body: >-
              CDN77 竞争壁垒的核心在于成本优势，该优势源于自建服务器硬件、私有网络骨干网以及支撑连续 11 年正向现金流的精益运营。为抵御边缘带宽同质化冲击，公司在 CVC
              少数股权资金支持下，宣布向云存储、边缘计算、Kubernetes-as-a-service 以及面向 AI 负载的专用 CPU/GPU
              基础设施延伸。尽管如此，替代风险依然严峻。大型媒体客户具备极高切换弹性，依托多 CDN 架构依据实时延迟与现货价格动态分配流量。超大规模云厂商凭借企业云抵扣券和免内网出向流量费大肆捆绑销售，倒逼 CDN77
              必须持续向相邻计算负载建立站位，以遏制核心流媒体分发业务利润率受蚀。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 支撑底稿
        blocks:
          - type: callout
            title: 自有基础设施筑造底层成本优势
