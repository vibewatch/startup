        title: 收入模式与顶线规模
        blocks:
          - type: paragraph
            body: >-
              CDN77 运营垂直整合的全球内容分发网络与基础设施平台，承载海量数字媒体、实时流媒体、点播视频及软件交付分发。核心商业化机制基于带宽与传输容量用量计费，并辅以面向大流量客户的定制化企业合约，同时在 CDN77
              和 DataPacket 品牌下提供托管基础设施服务。在 2025 财年，CDN77 官方公布年营业收入达到 $218M，按营收规模跻身全球独立 CDN 厂商前五。管理层公开设定 2026 财年营收目标约
              $270M，相当于约 24% 的同比营收增幅。2026 年一季度公司公布营收 $63.9M，跑赢全年业绩指引节奏。收入结构高度依赖媒体分发，视频流量占全网传输总量的
              90%。尽管营收增长稳健，但收入确认政策、合同期限分布、保底承诺与超额用量计费拆分以及净收入留存率（NRR）仍属非公开信息。
