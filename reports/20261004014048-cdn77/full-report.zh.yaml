      - number: '8.3'
        title: 情景推演、下行情景触发器与尽调核查路径
        blocks:
          - type: paragraph
            body: >
              我们前瞻构建的情景推演模型，评估了 CDN77 截至 2028 年在乐观、基准与悲观三种经营假设下的走势。在乐观情景（概率 20%）下，CDN77 依托其 230+ 节点网络成功将专属 CPU/GPU
              基础设施与边缘存储商业化，向视频存量客户交叉销售相邻 AI 推理业务。2028 年营收提速至 $360M，估值倍数维持在 8.0 倍市销率，测算出企业估值达 $2.88B（投资回报率 1.52
              倍）。在基准情景（概率 60%）下，核心视频分发稳步推进，2028 年达到 $310M 营收，而 AI 基础设施投资仍聚焦于精品企业托管业务。受宏观基础设施同质化拖累，估值倍数收缩至 5.5 倍市销率，估值为
              $1.71B（投资回报率 0.90 倍，基本保本）。在悲观情景（概率 20%）下，高昂的 GPU 硬件采购成本与刚性用电承诺大幅压缩经营现金流，头部流媒体客户借助多 CDN 动态调度强行压低带宽单价，营收停滞于
              $240M。估值乘数进一步跌落至 3.5 倍市销率，导致估值下挫至 $840M 的折价轮（0.44 倍回报率，账面回撤 56%）。


              综合上述证据架构，我们给予
              CDN77“持续跟踪”（Track）的综合评级，确定性评定为“中”（Medium），风险评级为“高”（High），估值判定为“合理”（Fair）。促使评级下调至“回避”（Avoid）的下行触发因素包括：利润率承压跌破现金流收支平衡点、核心标杆流媒体大客户流失，或为采购
              GPU 集群激进举债。相反，上调至“买入”（Buy）则需获得确证性尽调准入支持：核验审计后法定毛利率、调阅 CVC
              少数股权保护性条款、确认多国交叉审查监管审批最终落地，以及审计分客群留存数据。在此类未公开记录得到独立核验之前，机构投资者应对其后续业务进展保持密切跟踪，而非在媒体报道的高位估值倍数下盲目追逐老股转让份额。
