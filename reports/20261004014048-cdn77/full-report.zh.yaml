      - number: '2.3'
        title: 客户画像、采购机制与市场关注度
        blocks:
          - type: paragraph
            body: >-
              大容量 CDN 基础设施的采购决策主要由专业工程与基础设施负责人主导，包括基础设施副总裁、视频分发负责人与首席技术官（CTO）。在大型视频流媒体、游戏及在线教育平台中——例如 CDN77 客户 Rakuten
              TV、Starz、Udemy 和
              Banijay——分发性能直接决定观众流失率与商业化变现成效。企业买方评估供应商的核心指标涵盖多层缓存性能、资深技术支持团队响应效率、自定义边缘路由规则，以及剔除隐性出向流量附加费的可预测定价机制。PeerSpot
              行业数据显示，截至 2026 年 10 月，CDN77 在 CDN 品类中位列第 15 名，市场关注度（Mindshare）由上一年度的 0.8% 攀升至
              2.6%。关注度的持续提升，表明企业对多产品公有云全家桶之外的专业基础设施替代方案需求日益增长。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
