        title: 产品边界与客户业务流
        blocks:
          - type: paragraph
            body: >-
              CDN77 的核心客户价值在于将延迟敏感型数字内容从源站分发至全球终端用户，同时降低源站负载。视频是其最明确的专长领域：公司称视频数据占全网传输总量的 90%，独立评测显示其支持 HLS、DASH 和 CMAF
              协议。第三方企业档案亦列出网页加速、软件分发、HD/4K 视频分发、游戏网站加速及定制专有 CDN
              解决方案，但该档案属于历史资料，无法作为各项业务现行产品包装形态的定论。当前的边缘计算能力将客户业务流从被动缓存延伸至请求检测、访问鉴权、数据转换、动态路由及缓存键（Cache-key）控制，使流量在抵达源站前完成处理。这使
              CDN77 成为具备请求处理能力的分发平台，而不仅仅是带宽转售商；但公开材料中对其功能规格的描述较为充分，独立第三方的量化性能测评仍有待补充。
