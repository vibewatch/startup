      - number: '1.4'
        title: 尽调结论与启示
        blocks:
          - type: paragraph
            body: >-
              概况中最显著的积极信号，是公司在保持创始人绝对控股的同时具备可观业务规模：已披露的网络容量、2025 年收入以及 CVC
              少数股权交易，均表明这是一家成熟的私有基础设施运营商，而非早期初创公司。核心投资评估疑问潜藏于这些亮眼指标之后。收入质量、客户集中度、资本开支、负债规模与现金转换率在此处均属空白，$1.9B
              估值亦源自第三方媒体报道而非官方公开交易条款。Dealroom 亦指出，向资本密集型 AI 与 GPU
              基础设施扩张将直面规模庞大得多的云厂商与超大规模厂商竞争。因此，投资逻辑的成立取决于对交易结构、审计财报、客户留存表现、容量经济模型、治理权益及管理层深度的实质核验。在补充上述材料前，本次宣布的合作仅体现出外部机构资方的兴趣，尚不能证实增量资金到账、交易顺利交割或关键人风险的实质下降。
