  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与服务范畴
        blocks:
          - type: paragraph
            body: >-
              内容分发网络（CDN）市场涵盖全球分布式服务器基础设施，旨在使数字资产在更靠近终端用户侧完成缓存、优化与传输。CDN77 将自身商业架构聚焦于高吞吐数据传输，其中视频分发占其全网分发总量的约 90%。传统 CDN
              部署主要侧重静态资产缓存与简易网页加速，而当下企业需求已延伸至低延迟实时视频流媒体、自适应码率分发及动态边缘加速。在核心带宽传输之外，CDN77 逐步将服务边界拓宽至相邻基础设施层，推出免出方向流量费（Zero
              egress fees）的 S3 兼容云存储、容器运行环境以及专用 CPU 与 GPU 计算实例。这些相邻产品使公司得以捕获更广泛的企业基础设施开支，同时抵御纯管道分发业务的同质化竞争。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM011
      - number: '2.2'
        title: 目标市场空间与 TAM/SAM/SOM 架构
        blocks:
          - type: paragraph
            body: >-
              ResearchAndMarkets 独立行业预测显示，2025 年全球内容分发网络市场规模为 $24.25B，预计至 2035 年将以 15.61% 的复合年增长率（CAGR）攀升至
              $103.4B。这一广阔潜在市场（TAM）的扩张，主要受视频消费激增、OTT
              流媒体平台普及以及数据密集型游戏工作负载拉动。在此宏观范畴内，媒体与娱乐是最大的终端用户领域，网页性能优化解决方案目前占据该领域商业支出的主要份额。就地域分布而言，北美占据全球需求最大份额，欧洲紧随其后，亚太市场增速迅猛。在这一市场图景下，CDN77
              切入重流量数字平台这一细分市场，2025 年录得 $218M 收入，2026 年目标收入约 $270M。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM008
              - CM014
