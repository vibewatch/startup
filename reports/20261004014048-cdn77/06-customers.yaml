chapter:
  number: 6
  title: "Customers"
  summary: "CDN77 serves massive global digital platforms across streaming video, gaming, and online education, alongside a long-tail base of regional enterprise and mid-market web deployments. Video delivery constitutes 90% of network traffic, reflecting heavy workload and vertical concentration among high-volume media buyers, while enterprise retention is anchored by direct L2/L3 engineer access and bespoke origin routing."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Base Segmentation and Demand Drivers"
    body: "CDN77's commercial customer base is bifurcated between high-throughput global digital entertainment platforms and a diversified mid-market enterprise segment. At the top of the pyramid, tier-one media platforms, live sports broadcasters, video-on-demand services, and gaming operators represent the overwhelming majority of network utilization, with company disclosures noting that 90% of all delivered data is dedicated to streaming video. These buyers—exemplified by Starz, Rakuten TV, Sport1, Banijay, and Udemy—procure high-capacity transit and edge distribution to ensure low-latency delivery during peak viewing events and global release windows. Conversely, technographic census data reveals a substantial secondary tier of enterprise and public-sector accounts, including municipal transit authorities, educational institutions, retail distributors, and regional manufacturers that consume standard web acceleration, TLS termination, and static asset caching. While long-tail web buyers choose CDN77 for transparent self-service pricing and straightforward deployment, enterprise media accounts contract directly for dedicated capacity and bespoke origin caching configurations."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-named-proof"
    title: "Adoption Trajectory and Named Enterprise Proof"
    body: "Adoption across CDN77's customer base reflects steady expansion from regional website acceleration into mission-critical global media delivery. Historical directory tracking recorded over 8,800 clients across Europe, the United States, South America, and Asia during earlier phases of network build-out. By 2026, the company's edge footprint scaled to more than 230 points of presence with 330 Tbps of network capacity, serving over one billion unique users daily and generating $218 million in 2025 revenue. Named enterprise deployments demonstrate diverse operational workloads: video streaming provider Rakuten TV and broadcast producer Banijay utilize CDN77 for high-definition streaming delivery; online learning platform Udemy relies on edge caching for course distribution; and large public bodies such as the Municipal Transport Company of Madrid deploy edge infrastructure for public portal availability. Peer comparisons on enterprise review platforms highlight that buyers frequently evaluate CDN77 against legacy providers like Akamai and Cloudflare, favoring CDN77's personalized support model and transparent pricing over complex enterprise contracts."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "retention-expansion-and-concentration-risk"
    title: "Retention Dynamics and Concentration Risks"
    body: "Customer retention and lifetime contract durability at CDN77 are heavily underpinned by its engineering-led operational philosophy, where clients receive direct communication channel access to L2 and L3 network engineers rather than tiered account representatives. Leadership has explicitly prioritized multi-year customer relationships over quarterly billing optimization, contributing to eleven consecutive years of positive operating cash flow. However, the commercial profile exhibits structural concentration vulnerabilities. With 90% of traffic concentrated in video streaming, gross margins and capacity utilization remain highly sensitive to traffic shifts, renegotiations, or multi-CDN rebalancing by a handful of anchor media accounts. Furthermore, while peer review platforms note that CDN77 offers competitive entry and setup costs compared to Akamai or Arbor DDoS, enterprise buyers also note that competitors provide more comprehensive native web application security and distributed threat detection stacks. The expansion roadmap supported by CVC's 2026 minority investment aims to broaden account penetration by cross-selling Kubernetes-as-a-service, edge compute, and dedicated AI GPU infrastructure into the existing enterprise customer base."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
