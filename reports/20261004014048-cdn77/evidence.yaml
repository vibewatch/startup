evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      Exact stake size, primary-versus-secondary allocation, purchase price, cash proceeds, debt or credit facilities,
      cap table, and investor governance rights.
    whyItMatters: >-
      Funding raised is not cash available, and minority ownership does not reveal practical control without the
      transaction documents.
    diligencePath: >-
      Review the signed transaction agreements, capitalization table, funds-flow statement, debt schedule, board
      documents, and regulatory approval timetable.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive and board roster, reporting lines, tenure, prior departures, succession coverage, incentives,
      and investor-appointed governance roles.
    whyItMatters: >-
      The public record supports founder continuity but cannot quantify management depth, functional gaps, or key-person
      dependence.
    diligencePath: >-
      Obtain organization charts, biographies, board minutes, succession plans, option and retention schedules, and
      three years of leadership changes.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: customer-count
    missingEvidence: >-
      A current customer count with a defined customer denominator, reporting date, revenue concentration, retention,
      and cohort methodology.
    whyItMatters: >-
      The stale directory figure cannot establish present scale or diversification and may use a different definition
      from management reporting.
    diligencePath: >-
      Reconcile CRM and billing exports to audited revenue, then obtain current active-customer counts, top-20
      concentration, gross and net retention, and churn cohorts.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: milestone-history
    missingEvidence: >-
      Dated product launches, prior financings, material partnerships, regulatory outcomes, outages, litigation, and
      other adverse events needed for an eight-item chronology.
    whyItMatters: >-
      The six supported items do not establish a complete company history, and silence in the assigned pool cannot prove
      that no adverse event occurred.
    diligencePath: >-
      Review the company archive, corporate registry, transaction records, court and regulator databases, incident
      history, and dated product documentation.
    relatedQuestionRefs:
      - QO005
      - QO008
      - QO009
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited revenue, revenue recognition policy, gross margin, customer concentration, capital expenditure, debt, cash
      flow, and capacity utilization.
    whyItMatters: >-
      Reported revenue and network capacity do not establish ARR, profitability quality, cash generation, or returns on
      infrastructure investment.
    diligencePath: >-
      Obtain audited statements, quality-of-earnings work, customer-level revenue cohorts, network utilization reports,
      capex schedules, and debt agreements.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular vendor-by-vendor revenue market share breakdown for pure-play content delivery network providers in
      Europe and North America.
    whyItMatters: >-
      While global CDN market reports project overall industry growth from $24.25B to $103.4B, specific private company
      segment shares (e.g., CDN77 vs Fastly or Akamai in live video streaming) are not independently audited in public
      filings.
    diligencePath: >-
      Request management's third-party market share analysis and internal traffic share logs by geographic region during
      commercial diligence.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Third-party audited latency, time-to-first-byte (TTFB), and rebuffering rate benchmarks comparing CDN77 against
      Akamai, Cloudflare, and AWS CloudFront under live peak traffic conditions.
    whyItMatters: >-
      Without independent performance audits, assertions regarding low-latency live streaming superiority cannot be
      quantitatively corroborated against Tier-1 enterprise incumbents.
    diligencePath: >-
      Obtain multi-CDN telemetry datasets from platforms like Cedexis, ThousandEyes, or Catchpoint across major North
      American and European metropolitan test nodes.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
      Audited financial statements detailing gross margins, bandwidth transit unit costs, customer acquisition costs,
      and net revenue retention rates.
    whyItMatters: >-
      Without audited gross margin figures and cohort retention data, institutional underwriters cannot independently
      verify whether CDN77's cash-flow margins are sustainable under aggressive AI infrastructure expansion.
    diligencePath: >-
      Obtain confidential management information memorandum and audited financial statements under NDA during
      confirmatory due diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: reliability-proof
    missingEvidence: >-
      Current uptime SLA performance, public status history, incident postmortems, failover test results, and
      independent latency or quality-of-experience benchmarks.
    whyItMatters: >-
      Network footprint and stated capacity do not establish availability, delivered throughput, or customer-perceived
      performance under peak load.
    diligencePath: >-
      Request 24 months of SLA attainment and incident data, regional latency distributions, video rebuffering metrics,
      and documented disaster-recovery tests.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: security-and-compliance-proof
    missingEvidence: >-
      Current security certifications, independent audit reports, penetration-test summaries, privacy and data-residency
      controls, and an authoritative WAF and bot-management matrix.
    whyItMatters: >-
      Marketing and review descriptions identify controls but do not prove their operating effectiveness or suitability
      for regulated and application-sensitive workloads.
    diligencePath: >-
      Obtain the trust package, certification scopes, latest penetration-test remediation, security architecture,
      data-processing terms, and product-level control matrix.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public code repository, package-registry footprint, SDK release history, practitioner forum, or other
      developer-community evidence for the edge-compute runtime.
    whyItMatters: >-
      Without an external practitioner signal, SDK usability, release cadence, ecosystem depth, and deployment friction
      cannot be evaluated independently.
    diligencePath: >-
      Request public or diligence-room SDK documentation, changelogs, sample applications, customer references,
      deployment telemetry, and developer-support metrics.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: roadmap-maturity
    missingEvidence: >-
      Shipping status, installed capacity, utilization, customer adoption, and delivery dates for storage and dedicated
      CPU/GPU infrastructure.
    whyItMatters: >-
      Transaction materials describe expansion direction but do not establish that the announced infrastructure is
      deployed, commercially available, or economically utilized.
    diligencePath: >-
      Review product general-availability dates, signed customer commitments, installed hardware inventory, capacity
      utilization, power contracts, and roadmap milestones.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and annual customer churn rates broken down by
      contract tier.
    whyItMatters: >-
      Without formal NRR or churn disclosures, true underlying revenue durability and net customer expansion cannot be
      independently verified from public web telemetry.
    diligencePath: >-
      Request private customer cohort analysis, historical retention tables, and billing system renewal logs during
      confidential data room review.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: customer-concentration
    missingEvidence: >-
      Revenue contribution percentages for top 5, 10, and 20 customer accounts, specifically among anchor video
      streaming clients.
    whyItMatters: >-
      High concentration among a handful of major streaming contracts could leave gross margins vulnerable to vendor
      re-negotiation or multi-CDN traffic shifting.
    diligencePath: Inspect audited customer concentration schedules and top-customer billing records under NDA.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Audited revenue breakdown by top 5 and top 10 customers to quantify single-account churn risk.
    whyItMatters: >-
      90% of traffic is video; losing an anchor customer like Rakuten TV or Starz would materially affect capacity
      utilization.
    diligencePath: Request customer concentration schedule, top-10 revenue percentages, and contract renewal dates under NDA.
    relatedQuestionRefs:
      - QR004
  - type: missing-source
    severity: minor
    topic: cyber-insurance-and-penetration-testing
    missingEvidence: Third-party SOC 2 Type II audit report and cyber risk insurance coverage limits.
    whyItMatters: >-
      Verifies whether operational liabilities from potential DDoS amplification or edge routing vulnerabilities are
      insured.
    diligencePath: Request latest third-party SOC 2 Type II compliance audit and current commercial cyber liability policy schedule.
    relatedQuestionRefs:
      - QR005
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-margins
    missingEvidence: >-
      Audited financial statements detailing gross margins, transit bandwidth COGS, power and colocation costs, and net
      profit margins.
    whyItMatters: >-
      Without audited gross margin data, institutional investors cannot verify the durability of cash-flow margins under
      aggressive GPU capex expansion.
    diligencePath: >-
      Request statutory audited financial statements and management accounts under confidential NDA during confirmatory
      due diligence.
    relatedQuestionRefs:
      - QV001
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Disclosed capitalization table detailing exact post-transaction equity ownership, liquidation preference
      seniority, and minority veto rights held by CVC.
    whyItMatters: Determines whether CVC holds blocking rights over future capital calls, M&A exits, or debt financing.
    diligencePath: >-
      Review shareholder agreement, investor rights agreement, and articles of association in confirmatory legal
      diligence.
    relatedQuestionRefs:
      - QV003
      - QV007
      - QV009
  - type: stale
    severity: minor
    topic: client-count-benchmarking
    missingEvidence: Current active enterprise customer count broken down by spend tier and net revenue retention (NRR) cohorts.
    whyItMatters: >-
      Historical CMSWire profile lists 8,800+ clients across 32+ PoPs from an older vintage, leaving modern enterprise
      account churn unverified.
    diligencePath: Request enterprise customer revenue cohort analysis and top-20 account concentration schedule.
    relatedQuestionRefs:
      - QV004
      - QV007
