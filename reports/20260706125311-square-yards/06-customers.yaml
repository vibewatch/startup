- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Homebuyers / investors
    - Buyer=user; developers often fund distribution
    - Property discovery, site visits, booking, transaction support
    - 2,73,643 FY26 customer acquisitions across the platform
    - Core brokerage engine and entry point for cross-sell
    - No split between first-time buyers, investors, and repeat users
  - - NRIs / overseas customers
    - Buyer or investor user; families or advisors may influence
    - Remote property search, investment, financing, and post-sale management
    - Officially called out as a marketplace segment across 9-country footprint
    - Adds higher-ticket international demand and cross-border advisory value
    - No disclosed acquisition, conversion, or repeat data for NRIs
  - - Developers / inventory suppliers
    - Developer is economic payer; end buyer is user
    - Primary inventory distribution and project merchandising
    - Home page and corporate materials emphasise hot-selling projects and top developers
    - Supplies monetisable inventory and commission pools
    - No disclosed top-developer concentration or contract terms
  - - Banks / NBFCs
    - Lender funds economics; borrower uses service
    - Home-loan matching, sanction, and disbursal through Urban Money
    - Public sources cite 95+ to 150+ institutions depending on source and period
    - Largest adjacent monetisation surface after brokerage
    - Public partner count is not perfectly reconciled across sources
  - - Channel partners / realtors
    - Partner uses workflow; lender or developer ultimately pays economics
    - Lead sourcing, case updates, brokerage tracking, and inventory distribution
    - 150,000+ channel partners in ET profile; 5,000+ active realtors on Square Connect
    - Extends acquisition beyond app and web into assisted channels
    - Partner productivity, churn, and revenue concentration are undisclosed
  - - Post-sale homeowners / landlords / tenants
    - Homeowner or landlord pays; tenant may be user
    - Interiors, rentals, property management, and post-sale support
    - 1,840 designed homes and 2,783 rental transactions in FY26
    - Improves lifetime value beyond a one-time booking
    - Attach-rate mix by product line and repeat usage are undisclosed
  notes: Rows separate who buys from who uses and who funds the economics. Scale mixes direct customer counts with ecosystem participation because the company does not publish a unified active-customer ledger by segment.
