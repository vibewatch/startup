- id: durability-satisfaction-and-repeat-usage
  title: Durability, Satisfaction, and Repeat-Usage Evidence
  body: 'Durability is the least-proven part of the customer story. The company does disclose a 55% attachment rate and live post-sale surfaces such as interiors, rentals, and property management, which suggests Square Yards can monetize more than the initial booking event. FY26 materials also cite 1,840 captive designed homes and 2,783 rental transactions, so adjacent-service adoption is not hypothetical. But none of the reviewed public sources disclose MAU, repeat-purchase frequency, repeat-borrow curves, NRR, GRR, churn, renewal behavior, or active customer cohorts. For a low-frequency category like housing, that omission matters more than it would for a daily-use software product. Public evidence proves the platform can acquire and route customers; it does not yet prove the economic durability of those cohorts after the first transaction.


    Customer satisfaction signals are mixed rather than one-sided. PissedConsumer preserves at least one strongly favorable narrative about usability, rich property detail, and virtual tours, while AppBrain still shows a strong aggregate rating. But complaint-heavy forums such as ConsumerComplaints.in and ComplaintLists converge on a different set of issues: refund delays, aggressive telemarketing, unfulfilled promises, weak broker follow-through, and post-sale friction. That split is analytically useful. It suggests the front-end discovery experience may be stronger than the service layer that follows after booking or handoff. AmbitionBox’s middling 3.5/5 employee-review score is not customer proof, but it is directionally consistent with a labor-intensive platform where execution quality can vary by team, city, and manager. The practical conclusion is that customer satisfaction is good enough to support scale, but not yet clean enough to infer low churn or strong referral-led compounding
    without management data.'
