- id: adoption-trajectory-and-customer-proof
  title: Adoption Trajectory, Named Proof, and Distribution Surfaces
  body: 'Square Yards’ public adoption proof is strongest on throughput. The FY26 performance page discloses 2,73,643 customer acquisitions, Rs 13,236 crore of house transactions, and Rs 87,831 crore of loan disbursals through Urban Money. Independent 2026 coverage from Entrackr and ET Startup repeats those numbers, which materially reduces the risk that the company is inflating an isolated press-release metric. The same official materials show why the adoption story is multi-channel rather than app-only. Square Yards still cites heavy web traffic at the top of the funnel, but AppBrain’s public Android data only shows 100,000+ downloads and 8,216 reviews, far below total FY26 acquisitions. That gap implies assisted sales, broker-led distribution, developer inventory relationships, and partner-led mortgage sourcing are all central to customer acquisition.


    Named proof is real, but it is better at the cohort level than at the contract-economics level. Urban Money’s About page says Square Connect has earned the trust of over 100,000 people and that more than 5,000 realtors actively use the network daily. The Urban Money Partner page shows authorised partners tracking offers, earnings, and case updates across banks in real time, which is much stronger evidence of production workflow than a generic affiliate form. Urban Money’s January 2026 borrower research adds another concrete demand proof: Tier-2 and Tier-3 cities accounted for about 64% of 2025 home-loan demand and grew roughly 81% year over year. That matters because it shows Square Yards is not only monetising metro luxury demand; it is also attached to the broader mortgage expansion story across smaller cities. The missing piece is named developer or lender economics. Public pages prove inventory and lender-network depth, but not the revenue concentration of any one counterparty.'
