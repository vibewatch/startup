- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: This table captures the most concrete publicly visible customer or partner cohorts surfaced in official pages, review platforms, and 2026 coverage; it is not a full roster of developers, lenders, or enterprise customers.
