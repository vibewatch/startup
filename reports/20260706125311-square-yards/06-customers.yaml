  - Customer / cohort
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof quality
  - Limitation
  rows:
  - - Square Connect realtors
    - Broker / channel partner cohort
    - Daily-use broker and inventory network inside the Square Yards ecosystem
    - Production
    - 100,000+ trusted users and 5,000+ active realtors indicate a live distribution network
    - No disclosed GMV, churn, or revenue per realtor
  - - Urban Money authorised partners
    - Bank/NBFC distribution and DSA cohort
    - Real-time offers, earnings, and case updates across various banks
    - Production
    - Partner app evidence is stronger than a passive affiliate form because it exposes case workflow and economics
    - No named institution-level conversion data or partner retention
  - - Tier-2 / Tier-3 home-loan borrowers
    - Borrower cohort
    - Mortgage demand originating outside major metros
    - Production
    - Urban Money research quantifies 64% of 2025 demand from smaller cities and ~81% YoY growth
    - Company-published research, not third-party borrower cohort data
  - - Square Yards app users
    - Consumer homebuyer / renter cohort
    - Search, shortlist, buy, rent, and invest through the app
    - Production
    - 100,000+ downloads and 8,216 reviews prove real public user adoption
    - No MAU, lead-to-booking conversion, or repeat-purchase rates
  - - Public complainants and reviewers
    - Post-booking and service users
    - Refund, telemarketing, broker follow-through, and interior/rental-service experiences
    - Production
    - Multiple public forums prove real customer interaction after acquisition, not just marketing interest
    - Complaint forums over-sample dissatisfied users and rarely quantify cohort size
  notes: Proof quality is uneven. The channel-partner and broker rows are the cleanest workflow evidence, while the complaint row proves real usage but is inherently skewed toward negative experiences.
