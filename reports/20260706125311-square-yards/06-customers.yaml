    severity: minor
    topic: review-surface-access
    missingEvidence: Clean, directly readable exports from Google Maps, Glassdoor, Justdial, Sulekha, Quora, and MouthShut review pages
    whyItMatters: Several public review surfaces were blocked, login-gated, or noisy at access time, which limits full triangulation of customer sentiment.
    diligencePath: Capture human-reviewed screenshots or exportable review summaries from the blocked platforms and reconcile them with complaint-forum themes.
