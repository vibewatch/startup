  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented MAU, repeat-purchase, repeat-borrow, NRR/GRR, churn, and renewal/cohort tables for homebuyers, borrowers, brokers, and managed-property customers
    whyItMatters: Without cohort data, investors can verify customer acquisition and throughput but cannot verify durability or referral compounding.
    diligencePath: Request customer-cohort dashboards and retention waterfalls from management, split by product line and acquisition channel.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named developer, lender, and enterprise customer roster with active inventory counts, contract economics, and current production status
    whyItMatters: Public proof today is cohort-level and directional; it does not reveal whether a few counterparties dominate economics or whether named relationships are strategic or incidental.
    diligencePath: Obtain a top-customer and top-counterparty schedule plus sample active contracts before investment approval.
    relatedQuestionRefs:
    - QU014
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: channel-and-counterparty-concentration
    missingEvidence: Top-developer, top-lender, and top-channel-partner revenue shares, conversion rates, and productivity distribution by cohort
    whyItMatters: The public story shows ecosystem breadth but cannot tell investors whether concentration risk is low or simply undisclosed.
    diligencePath: Ask management for a concentration table, city mix, and assisted-vs-digital funnel breakdown for FY24-FY26.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
