- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Mortgage cross-sell through Urban Money
    - Model relies on external lenders and a large partner/channel network
    - Bank/NBFC pullback or partner churn could slow the highest-scale adjacency
    - Request lender mix, conversion by institution, approval SLAs, and repeat-borrow curves
  - - Developer inventory distribution
    - Primary-sales economics depend on access to developer projects
    - Loss of a few large developers or project pipelines could compress brokerage throughput
    - Request top-developer GTV, commission rates, exclusivity status, and pipeline concentration
  - - Metro-heavy transaction base
    - Bengaluru, Mumbai, Delhi NCR, Pune, and Hyderabad dominate disclosed GTV mix
    - Regional slowdown in a few cities could disproportionately affect volume
    - Request city cohort trends, booking mix, and local CAC / productivity data
  - - Post-sale adjacencies (rentals, interiors, management)
    - Publicly disclosed adjacent volumes are real but still small relative to acquisitions
    - Cross-sell upside may be overstated if attach-rate economics are shallow
    - Request attach-rate by product, gross margin by adjacency, and repeat-use cadence
  - - Assisted-channel acquisition engine
    - Acquisition clearly extends beyond the app into brokers and partners
    - Offline-heavy funnels may be harder to standardise and control for service quality
    - Request channel mix, assisted-vs-digital conversion, and refund / escalation metrics
  - - Disclosure gap on top customers / counterparties
    - No public concentration table for top lender, broker, or developer relationships
    - Investors cannot quantify counterparty dependence despite visible ecosystem breadth
    - Require a top-10 counterparty concentration schedule before underwriting durability
  notes: 'The risk lens is customer-economics specific: each row ties expansion upside to a counterparty or execution dependency that could weaken repeat monetisation or cohort durability.'
