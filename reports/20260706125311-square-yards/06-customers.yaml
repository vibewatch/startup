  title: Customers
  summary: 'Square Yards has real customer breadth across homebuyers, NRIs, developers, brokers, and lenders: the company disclosed 2,73,643 FY26 customer acquisitions, Rs 13,236 crore of transactions, Rs 87,831 crore of loan disbursals, and a 55% attachment rate for adjacent services. The weak spot is durability proof, because public evidence is rich on acquisition and partner scale but thin on retained cohorts, while complaint forums still surface post-booking service friction.'
sections:
- id: segment-mix-and-customer-base
  title: Customer Segments and Buyer/User/Payer Structure
  body: 'Square Yards’ customer base is broader than a classic residential-brokerage funnel. The official corporate narrative positions the company as an integrated real-estate and mortgage platform spanning search, discovery, transactions, home loans, interiors, rentals, property management, and post-sales support. That means buyer, user, and payer roles change by product line. In the core brokerage journey, the end homebuyer or investor is the user, but developers often fund distribution through commissions and inventory access. In the mortgage journey, the borrower is the user, while banks and NBFCs pay referral economics through Urban Money. In rentals, interiors, and property management, the homeowner, landlord, tenant, or post-sale household becomes the end user. The official About Us page also makes the NRI segment explicit, saying Square Yards connects buyers, sellers, and investors across residential, commercial, and NRI categories.


    The public footprint suggests this segmentation is not cosmetic. Square Yards says it operates across 100+ cities and 9 countries, cites 8mn+ monthly traffic, and frames its platform as one continuous customer journey rather than a stack of unrelated services. Urban Money’s pages extend that journey into lending and broker tooling, while LinkedIn’s public company page highlights adjacent service lines such as Data Assisted Buying, Interior Decor, Property Management, Legal Services, 3D Home Tours, and Easy Loans. Together those surfaces support four customer constituencies that matter most for diligence: homebuyers and investors, NRIs and overseas-oriented customers, developers and inventory suppliers, and banks/NBFCs plus channel partners. What is less visible is the economic weight of each segment. Public disclosures prove breadth, but not segment-level revenue mix, active-customer counts, or retention by cohort.'
