- id: expansion-loops-and-concentration-risk
  title: Expansion Loops and Concentration Risks
  body: 'Square Yards’ customer expansion logic is intuitive: acquire the home search or buying intent, then attach financing, rentals, interiors, property management, or data-led advisory. The FY26 performance page and About Us material both support that thesis, and the 55% attachment rate indicates the ecosystem is doing more than handing off one-time leads. The problem is that the disclosed expansion proof remains directional. Home loans are clearly the largest adjacent monetisation surface, but the public record does not break out lender conversion by bank, approval vintage by cohort, or repeat usage once a customer’s first property transaction is complete. Likewise, developer and inventory relationships are visible on the home page through project merchandising and top-developer positioning, yet no source reviewed discloses top-developer concentration by revenue or gross transaction value.


    That leaves three concentration risks. First, Urban Money is dependent on external banks, NBFCs, and large channel ecosystems; one source cites 95+ financial institutions and 150,000+ channel partners, while a later Fortune India article says more than 150 banks and NBFCs. Either way, the model relies on counterparties outside Square Yards’ control. Second, real-estate monetisation is concentrated in a handful of metros—Bengaluru, Mumbai, Delhi NCR, Pune, and Hyderabad dominate public GTV disclosures—so the customer story is broad, but not evenly distributed. Third, the company does not publish a counterparty concentration table, which prevents investors from knowing whether a few developers, a few lenders, or a few broker clusters drive a disproportionate share of economics. The chapter verdict is therefore positive on reach and multi-segment fit, but only moderate on durability until cohort retention and concentration disclosures arrive.'
