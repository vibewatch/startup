      - number: '7.4'
        title: 合作伙伴、人员与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Square Yards 的合作伙伴与人员风险，最好理解为关键依赖集中，而不是单一收入客户集中。Urban Money 规模可观，但它依赖受监管贷款机构及其行为框架，而不是自有封闭贷款账簿。RBI
              的数字贷款规则、负责任商业行为指引和公平实践准则，都把责任推回受监管实体，并强调披露、投诉处理、数据使用和催收行为；因此，如果贷款机构一侧出现行为问题，只要导流或服务体验显得掠夺性或不透明，风险仍会回传到
              Square Yards 品牌。融资结构又叠加一层。Outlook 称 2026 年 6 月融资的一部分将用于债务再融资，ET 称公司正讨论再融 $50-60
              million；公开资料仍没有显示债务部分背后的契约包或到期阶梯。创始人集中度也重要。2026 年融资叙事主要由 Tanuj Shori
              公开发声，而本次查看的官方公司材料没有披露更广泛的继任或董事会框架。在一家多品牌、IPO 前公司里，执行顺畅时这可控；一旦执行打滑，它就会成为放大器。
