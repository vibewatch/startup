  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前定价锚与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Square Yards 终于有了真实的公开估值锚，但这个锚并不完美。2026 年 6 月这一轮向公司注入 Rs 900 crore（~$95 million），并公开把平台推入估值超过 $1 billion
              的独角兽阵营。这很重要，因为此前 2025 年末估值升至约 $900 million
              时，公司只是接近这个象征门槛，还没有跨过去。它也重要，因为这一轮由机构资本锚定，而不只是二级市场传闻。不过，融资组合让解读变复杂。多家媒体称该轮混合了债务和股权，有些报道称大约三分之一是股权、三分之二是债务。这意味着名义估值可以作锚，但还不能当成干净的全股权公开市场可比估值来承销。同一批报道把融资直接连到强化资产负债表、再融资、技术投入和
              IPO 准备；这对一家准备上市的公司合理，但也解释了为什么入场纪律重要。按今天的私募估值标记，公司估值看起来能防守；到拟发行 IPO 区间，举证压力会显著上升。
