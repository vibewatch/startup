      - number: '3.4'
        title: 市场份额与竞争动态
        blocks:
          - type: paragraph
            body: >-
              印度 Proptech 行业高度分散，线下交易占主导，因此精确市场份额很难确认。按网页流量看，99acres 和 MagicBricks 在房产门户中规模最高。按收入看，Square Yards FY26 收入
              Rs 2,086 crore，位居头部之一，但不同收入模式使直接比较变复杂——房源门户披露广告收入，而 Square Yards 披露基于交易的经纪收入。NoBroker 是另一家 Proptech
              独角兽、也是最接近的可比公司，收入估计明显更低，但因轻资产技术模式利润率更高。Anarock 聚焦机构交易，单笔价值更高但量更低。竞争格局正在整合，玩家纷纷扩展相邻服务——99acres
              进入虚拟看房，MagicBricks 进入数据分析，NoBroker 进入家庭服务。Square Yards 的回应是加深全栈模式，并通过地理扩张和计划中的 IPO 扩大规模。
