      - CR047
      - CR049
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前观点
      - 当前观点依据
      - 观点改变条件
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 私人市场 >$1B 估值有依据，但披露基础还不足以支持买入式判断。
        - DRHP 级别的分部经济性、干净的融资条款，以及更清晰的 FY27 已预订增长。
      - - 置信度
        - 中
        - 可观察的融资事实很强，但定价仍对资本结构和 IPO 时点敏感。
        - 经审计数据，加上股权结构表和债务文件。
      - - 风险评级
        - 高
        - 业务在改善，但如果 IPO 二级市场转弱或融资条款不及预期，倍数压缩风险真实存在。
        - 更好的 IPO 窗口，以及公开市场投资者接受溢价倍数的证据。
      - - 估值立场
        - 当前合理；按 IPO 口径偏高
        - 按增长看，当前私募定价合理；但 $1.5-2.0B 需要更多证明。
        - FY27 增长 40%+、EBITDA 利润率达到两位数，以及更干净的融资质量。
      - - 决策含义
        - 宁可纪律性地在 IPO 前进入，也不要追逐 IPO 价格区间
        - 最可见的上行仍在上市前；IPO 后上行空间会快速压缩。
        - 报价显著低于营销中的 IPO 区间，或披露质量显著高于今日基线。
    notes: 本表刻意对价格敏感：它把可辩护的当前私人市场估值，与证明力度弱得多的 IPO 区间愿景分开。
    claimRefs:
      - CV003
      - CV037
      - CV038
      - CV054
      - CV058
      - CV059
      - CV060
      - CV061
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 观点改变条件
    rows:
      - - 增长 + 盈利能力
        - FY26 增长 48%、EBITDA 利润率 8%，说明经营杠杆真实存在。
        - 8% 利润率仍远低于门户级盈利能力，也可能只是周期性表现。
        - 分部利润率披露，以及再一年盈利增长。
      - - 变现宽度
        - 经纪、按揭、租赁、室内装修和服务把交叉销售空间延伸到一次性交易之外。
        - 宽业务也可能掩盖哪些分部真正配得上溢价倍数、哪些分部稀释质量。
        - 经审计的分部收入、利润率和分群经济性。
      - - 当前定价锚
        - 独角兽轮融资是真实的 2026 年独立第三方融资事件。
        - 债务、再融资以及仍缺失的优先权细节，让估值信号不够干净。
        - 已签署融资文件和股权结构瀑布。
      - - IPO 路径
        - 印度退出窗口足够开放，2026 年上市具备可行性。
        - 同一个市场也在强化定价纪律，并惩罚过度要价。
        - 更强的二级市场行情，以及同业科技 IPO 更好的上市表现。
      - - 可比公司组
        - Square Yards 增长更快、融资业务更宽，理应相对 Compass / eXp 这类经纪公司享有溢价。
        - 但公司仍缺少 REA / Rightmove 那样的利润率质量和挂牌市场主导力，套用门户倍数可能过于宽松。
        - 证明 FY27 业务组合和利润率正结构性靠近门户级质量。
    notes: 反向逻辑由估值和资本结构驱动，并不是说 Square Yards 缺少商业动能。
    claimRefs:
      - CV009
      - CV013
      - CV014
      - CV021
      - CV028
      - CV029
      - CV040
      - CV043
      - CV048
      - CV050
      - CV056
      - CV057
  - id: TV003
    title: 可比估值表
    columns:
      - 可比公司 / 锚点
      - 收入基础
      - 当前估值 / 市值
      - 收入倍数
      - 可比意义
      - 局限
    rows:
      - - Square Yards 当前私人市场区间
        - FY26 收入 ~$223M
        - 当前测算区间 $1.0B-$1.1B
        - 4.5x-4.9x
        - 高增长的混合型房地产科技 + 按揭平台，EBITDA 正在改善
        - 私募混合轮融资，不是公开市场出清价
      - - REA Group
        - 2025 收入 $1.26B
        - 市值 $13.03B
        - 10.3x
        - 房地产分类信息中最优质的溢价门户标杆
        - 利润率质量和挂牌市场主导力高得多
      - - Rightmove
        - 2025 收入 $0.57B
        - 市值 $4.50B
        - 7.9x
        - 另一个体现稀缺价值的高质量门户标杆
        - 成熟英国门户，不是经纪人驱动或融资偏重的模式
      - - Zillow
        - TTM 收入 $2.69B
        - 市值 $7.65B
        - 2.8x
        - 消费者房产平台，服务更宽但门户纯度更低
        - 美国住房周期和产品组合不同于印度
      - - Compass
        - TTM 收入 $6.96B
        - 市值 $9.47B
        - 1.4x
        - 经纪业务偏重的交易平台标杆
        - 低利润率经纪人模式压低可比质量
      - - eXp World Holdings 公司
        - TTM 收入 $4.77B
        - 市值 $1.07B
        - 0.2x
        - 展示以经纪人为中心的房地产交易吞吐模式的下行区间
        - 不是可一一对应的科技 + 融资生态系统
    notes: >-
      公开可比公司的倍数使用 CompaniesMarketCap 的市值和收入页面。Square Yards 倍数采用 Economic Times 报道的 FY26 $223M
      收入桥，以及实用的当前私人市场估值区间，而不是仅采用字面上的 >$1B 下限。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most relevant valuation archetypes for Square Yards: premium portals, consumer property
        platforms, and brokerage-heavy throughput models rather than every listed proptech or fintech company.
