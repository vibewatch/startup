      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              关键增长驱动包括印度快速城市化（2030 年城市人口预计达到 40%）、中产收入上升推动置业、PMAY 和 Smart Cities Mission 等政府政策支持、回购利率下行（向 5.25% 靠拢），以及
              RERA 执法提升交易透明度。印度拥有 800 million+ 互联网用户，COVID 后用户更能接受高价值线上交易，数字采用因此提速。印度住房贷款渗透率仅为 GDP 的 11-12%，而发达市场为
              60%+，上行空间很大。约束包括根深蒂固的线下经纪人关系（尤其在 Tier 2-3
              城市）、开发商抵触平台介入销售、各邦监管割裂、低频购买品类里的高获客成本，以及高价值数字交易的信任障碍。资本强度中等——经纪模式轻资产，但需要大量投入销售团队。
            claimRefs:
