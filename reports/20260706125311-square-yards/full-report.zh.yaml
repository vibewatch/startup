      - number: '8.4'
        title: 最终判断、投资论点失效触发点与剩余尽调问题
        blocks:
          - type: paragraph
            body: >-
              本章结论对价格敏感，而不是对公司质量敏感。Square Yards 已有足够规模、变现宽度和经营改善证据，值得关注，也足以支撑当前独角兽估值。它还没有的是足够公开披露，来支撑激进买入或盲目追
              IPO。Bain、McKinsey、Preqin、BCG 以及印度 IPO 市场报道都指向同一个元结论：2026
              年足够开放，可以产生退出；但还没有开放到可以忽视承销纪律。因此，反论点不是业务崩塌，更多是倍数压缩、资本结构漏损，或 IPO
              窗口弱于预期。最重要的尽调问题因此不是泛泛的增长问题，而是能移动估值的问题：债务条款、股权结构表质量、经审计分部经济性，以及 FY27 已预订可见度。在这些答案出来前，最佳姿态是在当前估值标记下跟踪 /
              继续研究，避免像 DRHP 已公开一样支付 $1.5 billion 至 $2.0 billion 区间。若管理层能拿出干净条款、双位数利润率，以及通向 REA/Rightmove 式质量而非
              Compass/eXp 式周期性的可信路径，评级可以上调。否则，投资论点破裂会比名义增长叙事暗示得更快。
