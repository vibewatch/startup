  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              印度 Proptech 竞争格局分为三层：纯房源门户（99acres、MagicBricks、Housing.com）、全栈交易平台（Square
              Yards、NoBroker、PropTiger）和机构顾问公司（Anarock）。在 30+ 主要 Proptech 玩家中，截至 2026
              年只有少数实现盈利。市场结构高度分散，没有任何一家玩家掌握超过住宅总交易量 5% 的份额。Square Yards
              的差异化来自房产生命周期的纵向整合——从发现和虚拟看房，到交易、融资、室内设计和租赁管理。这不同于依靠广告和线索变现、但不参与交易的房源门户，也不同于 NoBroker 以房东 / 业主与租客 /
              买家直连为核心的去经纪模式。所有主要玩家都在投资 AI、自动化和服务扩张，试图拿下房产价值链中更大的份额，竞争动态正在快速变化。自 2023 年以来，多家平台同步追求独角兽地位和 IPO
              准备度，推动全行业在技术、品牌和人才获取上重投入，竞争强度明显上升。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
