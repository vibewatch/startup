  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 市场周期性
        - 预订和库存趋势
        - 行业增速明显低于当前 FY26 预期，同时库存继续上升
        - 重新测算成交量假设，并下调收入置信度
      - - 监管 / 法律风险
        - 州 RERA 或购房者救济信号
        - 涉及 Square Yards 实体的注册通知反复出现、退款争议或管辖法院选择冲突
        - 将合规视为增长拖累，而不只是法律成本项
      - - 贷款机构伙伴行为风险
        - RBI / LSP 或贷款机构投诉信号
        - 出现 LSP 控制失效、借款人披露疏漏或合作贷款机构流失的证据
        - 对 Urban Money 变现和更广泛品牌外溢进行压力测试
      - - IPO 执行风险
        - 公开上市时间表
        - 虽然 IPO 信息持续释放，但没有 DRHP 证据或可见的投行进展
        - 将独角兽轮融资视为过桥，而不是近期去风险事件
      - - 债务 / 再融资风险
        - 对资本市场的依赖
        - 在契约条款披露更清晰或持续两位数利润率可见之前，就需要追加资本
        - 提高折现率，并缩短投资测算期限
      - - 人员 / 声誉风险
        - 创始人或品牌触发项
        - 创始人离任、董事会透明度持续不足，或出现一批未解决的退款或欺诈指控
        - 在治理和投诉数据改善前，暂停形成高确信度判断
    notes: 触发项针对投资逻辑破裂，而不是泛泛的 KPI 观察清单；每一项都把公开信号映射到投资测算口径的变化。
    claimRefs:
      - CR010
      - CR011
      - CR019
      - CR024
      - CR026
      - CR028
