      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              MagicBricks 由 Times Group 支持，是印度历史最久、认知度最高的房产门户之一，拥有庞大的房源数据库和二十年积累的品牌信任。它通过高级房源、广告和开发商线索生成变现。99acres 是
              Info Edge 的子公司（Info Edge 也拥有 Naukri.com），在房产搜索平台中流量最高，具备大量已验证房源数据库和详尽的社区分析。Housing.com 现由澳大利亚 REA Group
              持有，面向千禧一代和首次置业者，主打简洁界面、虚拟看房和 AI 驱动推荐。NoBroker 通过消除传统经纪人、支持业主与买家 / 租客直连，成为独角兽（估值约 $1
              billion），在租赁和合住场景尤其强。Anarock 是机构房地产顾问，聚焦开发商咨询、资本市场顾问和企业交易，而非零售经纪。PropTiger
              则把数字工具与人工顾问结合，服务端到端房产交易，尤其擅长开发商销售撮合。
