    summary: 仅用公开披露的扩张信号，代理观察复购价值可见度；Square Yards 未披露真正的时间序列留存队列。
    data:
      columns:
        - 第 1 月
        - 第 3 月
        - 第 6 月
        - 第 12 月
      rows:
        - id: public-proxy
          label: FY26 获客队列（代理）
          values:
            - '55'
            - '55'
            - '1.0'
            - '0.7'
    approximationNotes: >-
      公司未披露实际留存客户队列。由于没有公开时间拆分，第 1 月和第 3 月锚定官方披露的 55% 附着率；第 6 月和第 12 月则以已披露的租赁交易量和设计住宅量，作为相对 FY26
      获客规模的后段旅程触点下限。请将其视为可见度代理，而非真正的留存曲线。
    claimRefs:
      - CU023
      - CU028
      - CU029
      - CU040
      - CU042
      - CU043
  - id: FR001
    title: 风险热力图：发生可能性 vs 剩余严重性
    type: matrix
    layout: standard
    summary: 按发生可能性和可见缓释后的剩余严重性，梳理 Square Yards 的主要公开风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 极高严重性
          values:
            - IPO 执行 / 申报文件失误
            - 创始人或治理缺口
            - 房地产周期下行叠加债务压力
        - label: 高严重性
          values:
            - 邦级 RERA / 争议管辖选择摩擦
            - 贷款方合作伙伴行为或数字借贷违规
            - NoBroker 带来的抽佣率压缩
        - label: 中等严重性
          values:
            - 投诉聚集但缺少系统性证据
            - 跨品牌服务质量不一致
            - 开发商竣工延迟拖累转化
    approximationNotes: 可能性和严重性是基于已披露市场、监管和评论证据的定性判断，不是概率估计。
    claimRefs:
      - CR010
      - CR011
      - CR019
      - CR024
      - CR026
      - CR029
      - CR034
      - CR040
      - CR042
      - CR045
  - id: FR002
    title: 风险传导图：主要风险如何传导至收入、融资和估值
    type: dag
    layout: wide
    summary: 展示市场、法律和融资风险如何从单个节点层层传导到成交、利润率、流动性和 IPO 结果。
    data:
      nodes:
        - id: market-slowdown
          label: 房地产降温 / 负担能力压力
        - id: developer-delay
          label: 开发商延期 / 库存失衡
        - id: rera-friction
          label: RERA / 管辖复杂性
        - id: lsp-risk
          label: LSP / 贷款方行为风险
        - id: complaints
          label: 投诉 / 退款聚集
        - id: bookings
          label: 成交转化压力
        - id: margin
          label: 利润率 / 抽佣率压力
        - id: liquidity
          label: 流动性 / 契约压力
        - id: ipo-delay
          label: IPO 延迟 / 尽调拖延
        - id: valuation
          label: 估值压缩
      edges:
        - to: bookings
          from: market-slowdown
        - to: bookings
          from: developer-delay
        - to: bookings
          from: rera-friction
        - to: complaints
          from: lsp-risk
        - to: margin
          from: complaints
        - to: margin
          from: bookings
        - to: liquidity
          from: margin
        - to: ipo-delay
          from: liquidity
        - to: ipo-delay
          from: rera-friction
        - to: valuation
          from: ipo-delay
        - to: valuation
          from: margin
    claimRefs:
      - CR011
      - CR013
      - CR024
      - CR026
      - CR029
      - CR030
      - CR040
      - CR045
      - CR047
      - CR050
  - id: FR003
    title: 依赖图：关键外部依赖与创始人依赖
    type: dag
    layout: wide
    summary: 连接 Square Yards 的外部依赖，以及这些依赖可能影响的业务线和结果。
    data:
      nodes:
        - id: founder
          label: 创始人 / CEO 可见度
        - id: lenders
          label: 150+ 家银行与 NBFC
        - id: developers
          label: 开发商开盘管线
        - id: rera
          label: 各邦 RERA 机构
        - id: sebi
          label: SEBI / IPO 中介机构
        - id: nobroker
          label: NoBroker / 零佣金竞争
        - id: urbanmoney
          label: Urban Money
        - id: brokerage
          label: 核心经纪业务
        - id: ipo
          label: IPO 路径
        - id: brand
          label: 平台品牌 / 信任
      edges:
        - to: ipo
          from: founder
        - to: brand
          from: founder
        - to: urbanmoney
          from: lenders
        - to: brand
          from: urbanmoney
        - to: brokerage
          from: developers
        - to: brokerage
          from: rera
        - to: ipo
          from: sebi
        - to: brokerage
          from: nobroker
        - to: brand
          from: brokerage
        - to: ipo
          from: urbanmoney
    claimRefs:
      - CR006
      - CR008
      - CR019
      - CR026
      - CR029
      - CR034
      - CR036
      - CR037
      - CR042
      - CR048
      - CR050
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 结论从真实的独角兽融资事件出发，经过可比公司估值分散度和资本结构限制校正，落到克制的跟踪 / 继续研究建议。
    data:
      nodes:
        - id: anchor
          label: 可用私人市场锚点
          detail: 2026 年 6 月融资轮 >$1B
        - id: growth
          label: 业务验证
          detail: FY26 增长 48%，EBITDA 为正
        - id: comps
          label: 可比公司分散度大
          detail: 经纪商 0.2x 至门户 10x
        - id: structure
          label: 混合融资轮限制
          detail: 债务 + 股权让纯粹价格发现变模糊
        - id: decision
          label: 跟踪 / 继续研究
          detail: 当前公允，IPO 区间偏贵
      edges:
        - from: anchor
          to: growth
          label: 由……支撑
        - from: growth
          to: comps
          label: 对标于
        - from: comps
          to: structure
          label: 受……约束
        - from: structure
          to: decision
          label: 导向
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV039
      - CV048
      - CV058
      - CV061
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以 FY26 约 $223M 的收入桥为基准，合理收入倍数小幅变化，就会显著拉动隐含股权价值。
    data:
      items:
        - label: 4x 收入
          value: 892
        - label: 5x 收入
          value: 1115
        - label: 6x 收入
          value: 1338
        - label: 7x 收入
          value: 1561
        - label: 8x 收入
          value: 1784
      yAxis:
        label: 隐含估值（USD M）
    approximationNotes: 隐含估值按「倍数 × FY26 收入」简单计算，收入基准采用 Economic Times 报道的约 $223M 收入桥。
    claimRefs:
      - CV007
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 最宽的价值创造空间，仍是从当前私人市场估值标记重估到可行 IPO 区间；再往上，上行空间会收窄。
    data:
      items:
        - label: 悲观情景
          low: 900
          high: 1100
          unit: USD M
        - label: 当前私人市场锚点
          low: 1000
          high: 1100
          unit: USD M
        - label: 基准 IPO 就绪区间
          low: 1200
          high: 1500
          unit: USD M
        - label: 乐观 / IPO 拉伸区间
          low: 1600
          high: 2000
          unit: USD M
    approximationNotes: 区间综合公开融资轮事实、FY26 收入、FY27 执行门槛和 2026 年 IPO 市场纪律，并非管理层指引。
    claimRefs:
      - CV037
      - CV038
      - CV051
      - CV052
      - CV053
      - CV054
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 紧凑呈现最直接影响 Square Yards 估值讨论的 KPI。
    data:
      items:
        - label: 当前私人市场估值锚点
          value: '>1000'
          unit: USD M
        - label: FY26 收入
          value: '223'
          unit: USD M
        - label: FY26 增长
          value: '48'
          unit: '%'
        - label: FY26 EBITDA 利润率
          value: '8'
          unit: '%'
        - label: 当前隐含收入倍数
          value: 4.5-4.9
          unit: x
        - label: IPO 期望区间
          value: 1500-2000
          unit: USD M
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV037
      - CV038
      - CV061
