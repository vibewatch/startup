      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Square Yards 生态服务多类买方画像，购买行为各不相同。核心住宅买方（Rs 50 lakh-Rs 2 crore 区间的首次置业者）贡献交易量，尤其集中在 Tier 1 和新兴 Tier 2
              城市。NRI 投资者是 Square Yards 最初聚焦的客群，交易额更高但量更低。高端 / 豪宅买方（Rs 2 crore+）增长最快，2026 年 Q1 同比增长
              30%。付款方一侧，房地产开发商是经纪服务的主要佣金来源，为 Square Yards 的获客和销售撮合付费。银行和 NBFC 向 Urban Money
              支付住房贷款线索推荐费。终端消费者则为周边服务（室内设计、物业管理）付费。经纪佣金预算归开发商营销团队所有，住房贷款推荐预算归银行零售贷款部门所有。数字平台的采用触发点通常是重大人生事件（结婚、换工作搬迁、家庭扩容），叠加
              COVID 时期行为变化后，用户对线上找房的接受度提高。
