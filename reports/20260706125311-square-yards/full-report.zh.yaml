      - number: '1.3'
        title: 融资历史与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              自创立以来，Square Yards 已通过 8 轮融资筹得约 $208 million。最重要的一轮发生在 2026 年 6 月，公司融得 Rs 900 crore（约 $95
              million），结构包含股权和债务，由 EAAA Alternatives（Edelweiss 集团的另类投资部门）与全球信贷管理机构 Muzinich & Co. 领投，估值升至 $1 billion
              以上，确认独角兽地位。在此之前，2025 年 11 月 Series C 融资额为 $35 million，由韩国 Smilegate Investment 领投，投前估值 $900
              million。更早的融资包括 2021 年来自 ADM Capital 的 $24.82 million 风险债，2019 年来自 Bennett Coleman（Times Group）的 $20
              million，2016 年来自 Reliance Group Holdings 的 $12 million，以及 2017 年来自 Lohia Group 的 $10 million 可转债。公司目前正筹备面向
              2026 日历年的 Rs 2,000 crore（约 $240 million）IPO，同时仍在洽谈按最高 $1.6 billion 估值再融 $50-60 million 的 IPO
              前资金。投行聘任正在推进，DRHP 预计会在 FY27 内提交。
