      - number: '7.3'
        title: 市场、竞争与声誉风险
        blocks:
          - type: paragraph
            body: >-
              核心商业风险，是周期敏感性叠加竞争趋同。行业研究者和记者描述的都是同一套格局：销量可能还能稳住，但 FY26 增长预计放缓，购房负担能力承压；开发商推盘快于施工，或库存与回款错位时，仍会伤到下游中介。这对
              Square Yards 重要，因为即使后续交叉销售其他服务，它的变现起点仍是房产交易。竞争也不再只是门户对门户。NoBroker 官网仍主打零佣金，但其公开定位已延伸到金融产品和家居服务；Square
              Yards 则用 Urban Money、室内装修、租赁和物业管理来讲一条整合式置业旅程。功能重叠因此变宽。声誉风险不是单向负面，而是好坏交织：Justdial 仍有庞大评分基数和一些正向服务反馈，但
              PissedConsumer 与 ComplaintLists 上也反复出现退款、交付预期、价格变化和室内工程体验相关指控。尽调含义是，零散投诉不能忽略，但没有公司侧解决数据，也无法正确量化。
