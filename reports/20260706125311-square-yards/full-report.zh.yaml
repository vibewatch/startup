            body: >-
              FY26 公司完成 2,73,643 次获客，收入 Rs 2,086 crore，平均每次获客收入约 Rs 76,000（约 $900）。按促成 Rs 13,236 crore 房地产交易额计算，隐含抽佣率约为
              GTV 的 15.8%（因包含住房贷款和其他收入而被抬高）。按行业标准，一手房交易的纯经纪 抽佣率估计为 2-3%。销售周期中等——一手住宅从找房到认购通常需要 30-90 天。8,700-9,100
              名员工对应人均收入约 Rs 23-24 lakh（约 $27,000），低于科技公司基准，但符合经纪 / 顾问模式。客户获取成本（CAC）未公开披露，但考虑到所需团队规模和营销投入，估计不低。FY27
              指引为收入增长 40%+、EBITDA 利润率达到两位数，意味着固定成本继续被不断增长的交易量分摊，经营杠杆仍在释放。
