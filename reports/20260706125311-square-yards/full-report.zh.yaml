      - number: '6.4'
        title: 扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              Square Yards 的客户扩张逻辑很直观：先获取找房或购房意图，再附加融资、租赁、室内设计、物业管理或数据驱动顾问。FY26 业绩页面和 About Us 材料都支持这一判断，55%
              附加转化率也表明生态不只是转交一次性线索。问题在于，已披露的扩张证据仍偏方向性。住房贷款显然是最大的相邻变现界面，但公开记录没有按银行拆分贷款机构转化，没有按
              客户队列披露审批批次，也没有披露客户完成首笔房产交易后的复用情况。同样，开发商和库存关系可以从首页项目陈列和头部开发商展示中看到，但已审阅来源没有披露按收入或总交易额计算的头部开发商集中度。


              因此留下三类集中风险。第一，Urban Money 依赖外部银行、NBFC 和大型渠道生态；一个来源提到 95+ 金融机构和 150,000+ 渠道伙伴，后来的 Fortune India 文章则称有超过 150
              家银行和 NBFC。不管按哪个口径，模式都依赖 Square Yards 控制之外的交易对手。第二，房地产变现集中在少数大都市——Bengaluru、Mumbai、Delhi NCR、Pune 和
              Hyderabad 主导公开 GTV
              披露——客户故事很宽，但分布并不均匀。第三，公司没有发布交易对手集中度表，投资人无从判断少数开发商、少数贷款机构或少数经纪人集群是否贡献了不成比例的经济收益。本章结论因此是：覆盖面和多客群匹配度为正面，但在披露
              客户队列留存和集中度之前，持久性只能评为中等。
