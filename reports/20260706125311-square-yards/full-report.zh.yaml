  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价模式
        blocks:
          - type: paragraph
            body: >-
              Square Yards 通过四条主要收入流变现：（1）房地产经纪佣金，通常由开发商为一手住宅销售撮合支付交易额的 1-3%，构成收入的大部分（约 70%）；（2）Urban Money 带来的住房贷款推荐费，从
              150+ 银行和 NBFC 合作伙伴按贷款额 0.5-1.5% 收取（约占收入 15-20%）；（3）Interior Company 的室内设计项目收入，来自设计施工合同；（4）Azuro
              的物业管理费。收入确认以交易为主——房产成功认购 / 登记后确认佣金，贷款放款后确认住房贷款费用。FY26 收入达到 Rs 2,086 crore（约 $223 million），较 FY25 的 Rs
              1,410 crore 增长 48%。印度市场贡献 88% 收入，同比增长 57%，国际业务（UAE、澳大利亚、加拿大）贡献剩余
              12%。基于交易的确认方式和极少的经常性订阅成分，使收入质量较强；但对一手房销售的依赖，也让收入随房地产市场周期波动。
