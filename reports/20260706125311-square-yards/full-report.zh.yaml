    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Square Yards 由 Tanuj Shori 和 Kanika Gupta Shori 于 2014 年在印度 Haryana 的 Gurugram (Gurgaon) 创立。两位创始人在香港以 NRI
              身份工作时，亲历印度房地产市场的割裂和不透明，Square Yards 由此诞生。Tanuj Shori 曾在 Standard Chartered、Lehman Brothers 和 Nomura
              从事投资银行业务，Kanika Gupta Shori 则有财富管理和战略背景，并拥有 Delhi University 与 Wharton 履历。公司定位为印度最大的综合 Proptech
              平台，把房地产经纪（Square Yards）、住房贷款撮合（Urban Money）、租赁管理（Azuro）、室内设计（Interior
              Company）和虚拟看房（PropVR）并入同一生态。收入主要来自一手住宅销售经纪佣金、150+ 银行与 NBFC 合作伙伴支付的住房贷款推荐费，以及周边服务收费。公司早期聚焦海湾地区 NRI
              客群，如今已扩展为覆盖印度 30+ 城市的全国网络，并在 UAE、澳大利亚和加拿大设有国际办公室，全球覆盖 9 个国家和 100+ 城市。
