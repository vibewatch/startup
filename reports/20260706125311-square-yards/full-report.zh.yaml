      - number: '2.2'
        title: TAM、SAM 与 SOM 规模测算
        blocks:
          - type: paragraph
            body: >-
              2026 年，印度整体房地产市场估值约 $585 billion，其中住宅板块为 $438 billion。Proptech 市场本身预计为 $1.3-1.8 billion，按方法和范围不同，CAGR 为
              12-19%。测算 Square Yards 的 TAM，需要看三条线：（1）印度住宅交易的经纪佣金池——年住宅交易额约 $130 billion，平均经纪费率 2%，对应经纪 TAM 约 $2.6
              billion；（2）住房贷款撮合机会——印度住房贷款市场规模 $540 billion，年新增放款约 12%（$65 billion），0.5-1% 推荐佣金对应 $325-650 million
              TAM；（3）周边服务层（室内设计、物业管理）再增加 $500 million-$1 billion。SAM 收窄到 Square Yards 已有布局的印度前 50 大城市里，可数字化触达的城市交易，估计为全国
              TAM 的 40-50%。SOM 反映 Square Yards 当前捕获的 Rs 13,236 crore GTV（约 $1.6 billion），相对于 $130 billion
              住宅交易总市场，按交易额计市场渗透率约 1.2%。
            claimRefs:
