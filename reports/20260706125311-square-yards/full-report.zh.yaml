      - number: '7.2'
        title: 监管与 IPO 执行风险
        blocks:
          - type: paragraph
            body: >-
              法律与监管栈不只是「是否符合 RERA」这么简单。Square Yards 的本土市场归 Haryana RERA 的 Gurugram 机构管辖，其他经营邦也各有投诉和代理人界面；UP-RERA
              的公开材料强调，这套制度的核心是消费者保护、更快裁决和透明度。LiveLaw 对租赁管辖权的分析说明了现实中的麻烦：各邦做法并不完全一致，尤其在类租赁结构接近销售、或地方指引仍不足时。Bar & Bench
              的报道又补上一层：最高法院仍在细化何时应走 RERA、IBC 或消费者论坛，因此延迟、退款或交付纠纷可能先变成程序复杂问题，再变成经济实质问题。其上，2026 年 IPO 路径本身规则很重。SEBI 修订后的
              ICDR 制度、主通函、投行尽调资料库规则，以及视听版招股文件要求，都抬高了文件、口径一致性和内部准备度的门槛。主要风险不是 Square Yards 无法上市，而是公开记录还没有证明公司离清完这些关口有多近。
