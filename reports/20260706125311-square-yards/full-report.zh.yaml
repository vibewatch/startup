  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一体化产品栈与客户流程
        blocks:
          - type: paragraph
            body: >-
              Square Yards 由 Tanuj Shori 和 Kanika Gupta Shori 于 2014 年在 Gurugram 创立，如今把自己定位为印度最大的综合房地产与住房贷款平台，业务覆盖 100+
              城市和 9 个国家。它的产品面明显宽于房源门户：主 Square Yards 应用组合了已验证房源搜索、片区情报、价格趋势、虚拟看房、法律支持和融资交接；Urban Money
              叠加贷款发现和合作伙伴流程；Azuro 覆盖租赁管理；Interior Company 覆盖家具软装和设计；数据智能工具则开放市场价格、交易和开发商排名视图。公开应用
              和网站证据显示，公司试图把通常割裂的买房旅程——搜索、评估、预约看房、融资、文书、售后跟踪——压进同一个操作系统。战略上，这种宽度很重要，因为 Square Yards
              变现的是交易，而不仅是线索；一旦用户进入漏斗，公司可以在同一平台上交叉销售相邻服务。最强的公开证据不只是网站上的品牌架构，而是移动端房源、应用商店描述、合作伙伴工具和数据界面都持续指向一条互联工作流，而非彼此割裂的点产品。
