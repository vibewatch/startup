      - number: '4.2'
        title: 成本结构与利润率分析
        blocks:
          - type: paragraph
            body: >-
              FY26 毛利达到 Rs 476 crore，毛利率 23%，说明销售团队薪酬和开发商激励分成带来可观收入成本。EBITDA 为 Rs 176 crore（利润率 8%），高于 FY25 约 Rs 47
              crore（利润率 3%），实现 3.7 倍改善并体现显著经营杠杆。8,700-9,100 人团队支撑经纪模式，员工成本主导成本结构，估计占收入
              60-65%。房产交易低频且获客昂贵，销售和营销成本处于高位。随着公司投资 AI、PropVR 和数字基础设施，技术与平台成本占比较小但正在上升。毛利率到 EBITDA 利润率之间 15 个百分点的差距（23%
              毛利率减 8% EBITDA）反映大型销售组织带来的管理费用负担。营运资本尚可控，因为佣金收入通常在交易完成后 30-60 天内回款，但部分情况下开发商付款周期可能拉长到 90+ 天。
