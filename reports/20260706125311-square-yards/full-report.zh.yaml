  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Square Yards 处在三个相邻市场的交汇处：房地产经纪与交易服务、住房贷款撮合，以及 Proptech
              技术服务。核心可服务市场是印度住宅房地产交易层——一手与二手房销售带来的经纪佣金和服务费。该口径不包含房产底层价值本身，但包含交易中的 1-3%
              经纪佣金。相邻的住房贷款市场包括撮合住房贷款产生的推荐费和佣金，通常为贷款额的 0.5-1.5%。Proptech 层则覆盖虚拟看房、AI
              驱动推荐和数字化交易管理等技术服务。现状替代方案包括传统线下经纪人（仍控制 80%+ 交易）、开发商直销团队，以及不经过中介的银行直营网贷申请。市场边界明确排除商业地产顾问（Anarock
              的主要领域）、纯租赁分类信息平台（NoBroker 的核心）和建筑 / 开发活动。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
