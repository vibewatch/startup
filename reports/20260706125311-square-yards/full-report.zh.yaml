  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              2026 年的 Square Yards 比一年前更强，但剩余风险是叠在一起的，不是彼此孤立。公司动能真实：FY26 收入达到 Rs 2,086 crore，EBITDA 改善至 Rs 176
              crore，2026 年 6 月融资将估值推至 $1 billion 以上，管理层也明确把下一步描述为 Rs 2,000 crore
              IPO。也正是这些事实集中放大了时点风险。经纪主导模式仍压在印度住房市场之上，而分析师预计 FY26 该市场增速会放缓，负担能力压力、高房价和库存压力都在背景里累积。与此同时，Square Yards
              已不再是狭义市场平台；它把经纪需求同住房贷款、租赁、室内设计和物业管理等相邻业务绑定，一个节点的运营或合规问题可能传导到旗舰品牌。因此最高严重程度风险是一组同步风险：市场周期性、逐邦 RERA
              与购房者救济复杂性、Urban Money 的贷款机构合作伙伴行为风险、IPO 前债务和尽调风险、创始人集中，以及不稳定客户体验带来的品牌损害。
