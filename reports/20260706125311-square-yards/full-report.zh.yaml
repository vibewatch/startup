      - number: '8.2'
        title: 收入倍数、同业参照与增长调整视角
        blocks:
          - type: paragraph
            body: >-
              最简单的估值测试，是问 Square Yards 在重经纪交易公司与高端房地产门户之间应落在哪个位置。按 Economic Times 给出的约 $223 million FY26 收入桥，当前合理估值带约
              $1.0 billion 至 $1.1 billion，对应约 4.5x 至 4.9x 收入。这已经远高于 eXp 等重经纪同业，也明显高于 Compass，但仍低于 Rightmove、REA
              这类享受更高利润率、以房源挂牌为主的平台型特许经营。公开可比公司显示这条价差有多宽：eXp 约 0.2x 收入，Compass 约 1.4x，Zillow 约 2.8x，Rightmove 约 7.9x，REA
              约 10.3x。仅这一点就不支持把 Square Yards 称为显然便宜。但增长调整视角会让画面缓和。Square Yards 仍在增长 48%，且 EBITDA
              为正；其简单的每增长点倍数比率，更接近增长更快的混合平台，而不是成熟门户。换句话说，如果增长能延续，今天的私募估值并不离谱。问题在于，增长调整启发式不能替代证据：收入结构质量、利润率耐久性，以及增长引擎中有多少可重复、多少只是周期性房地产吞吐。
