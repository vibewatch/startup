  - id: TV004
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（USD bn）
      - 概率信号
      - 必须成立的条件
    rows:
      - - 牛
        - FY27 增长维持在 40% 以上，EBITDA 利润率升至 12% 以上，下一轮融资理顺结构，IPO 市场给规模化消费科技发行人更高定价。
        - 1.6-2.0
        - 20-25%
        - 需要 DRHP 级披露、更干净的资本结构，并清楚证明 Square Yards 值得高于经纪公司倍数。
      - - 基准
        - FY27 增长落在 35-40% 左右，EBITDA 利润率达到 10-11%，2026 年 IPO 窗口足够可用但仍有纪律。
        - 1.2-1.5
        - 50-55%
        - 执行质量足以让公开市场接受一个合理但不狂热的估值。
      - - 熊
        - IPO 时点延后、增长跌破 30%、利润率停在 9% 以下，或债务 / 股权结构条款削弱股权质量信心。
        - 0.9-1.1
        - 20-30%
        - 较弱的 IPO 行情或混乱融资条款，会把 Square Yards 拉回当前私人市场支撑位，而不是推动溢价重估。
    notes: 情景区间是基于证据的投资测算区间，不是管理层指引。概率信号来自当前公开文件下的方向性判断。
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
      - CV051
      - CV052
      - CV053
  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 窗口明显转弱
        - 二级市场波动让新股发行在 Square Yards 目标窗口期内持续低迷
        - 即便运营仍不错，支撑溢价倍数的逻辑也会先松动
        - 将公允价值移向当前私人市场支撑位，而不是 IPO 区间定价
      - - 增长大幅不及预期
        - FY27 收入增长跌破 30%
        - 当前私人市场溢价不再像高增长倍数
        - 重新按 Zillow / Compass 类可比区间测算
      - - 利润率进展停滞
        - IPO 准备期内 EBITDA 利润率仍低于 9%
        - 业务看起来更像交易吞吐，而不是高质量平台经济性
        - 下调牛情景，并假设上市后重估潜力更低
      - - 融资质量不及预期
        - 债务契约、优先权或反稀释保护比预期更激进
        - 名义独角兽估值失去作为干净股权锚的价值
        - 将当前轮视为结构化融资，而不是公开市场可比
      - - 披露仍然单薄
        - 定价讨论升温前，仍没有 DRHP 级分部和股权结构表细节
        - 不透明这一反向逻辑仍未解决
        - 不测算 IPO 区间；保持跟踪 / 继续研究
    notes: 上述都是投资逻辑破裂触发项，不是通用运营风险。每一项都会直接改变市场可理性支付的倍数。
    claimRefs:
      - CV020
      - CV023
      - CV028
      - CV029
      - CV030
      - CV043
      - CV047
      - CV051
      - CV057
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 债务 / 股权拆分和契约条款
        - 已签署条款清单、债务包、契约条款、到期结构和允许杠杆
        - 决定独角兽估值是干净股权信号，还是部分来自结构化资本方案
        - CFO 和法律顾问在 NDA 下提供；审阅融资文件
      - - 股权结构表质量
        - 优先权层级、反稀释权、清算瀑布和任何老股转让部分
        - 缺少这些，私人估值质量无法与公开市场倍数干净对比
        - 财务团队数据室和董事会批准的股权结构表
      - - 分部经济性
        - 按经纪、Urban Money、租赁、室内装修和其他业务拆分的收入、毛利率和 EBITDA
        - 用来判断 Square Yards 应享有门户溢价，还是应按混合服务折价
        - 经审计管理包或 DRHP 草稿
      - - FY27 可见度
        - 已预订管线、转化假设，以及当前运行率与 40%+ 增长目标的对比
        - 只有前瞻增长既真实又可见，IPO 区间才站得住
        - 管理层预测包，加月度运行率桥接
      - - 公开上市准备度
        - DRHP 时间、治理升级，以及管理层打算如何向投资者呈现混合融资历史
        - 即使业务不错，如果披露质量达不到公开市场要求，也可能定价很差
        - IPO 法律顾问、投行和准备工作计划
    notes: 上述问题对估值至关重要。在回答前，Square Yards 应被视为一家可信公司，但定价文件仍不完整。
    claimRefs:
      - CV016
      - CV045
      - CV048
      - CV049
      - CV050
      - CV057
      - CV058
