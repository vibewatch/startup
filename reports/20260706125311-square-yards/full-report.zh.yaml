        title: 领导层、治理与关键人员
        blocks:
          - type: paragraph
            body: >-
              Square Yards 的领导层由联合创始人 Tanuj Shori（CEO）和 Kanika Gupta Shori 支撑，两人自公司创立起一直在岗。Tanuj Shori
              在全球金融机构的投资银行经历，让他具备房地产经纪平台所需的财务判断和交易能力。截至 2026 年中，公司员工数在 8,700-9,100 人之间，高于 2025 年约 8,000
              人。高管团队覆盖技术、运营和销售等职能，但作为私人公司，Square Yards 尚未充分披露董事会构成和独立董事信息。关键人物风险集中在 Tanuj Shori
