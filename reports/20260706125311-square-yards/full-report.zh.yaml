      - number: '6.2'
        title: 采用轨迹、具名证据与分销界面
        blocks:
          - type: paragraph
            body: >-
              Square Yards 的公开采用证据在吞吐量上最强。FY26 业绩页面披露 2,73,643 次获客、Rs 13,236 crore 房屋交易额，以及通过 Urban Money 完成 Rs 87,831
              crore 贷款放款。Entrackr 和 ET Startup 的 2026
              年独立报道重复了这些数字，显著降低了公司夸大单一新闻稿指标的风险。同一批官方材料也解释了为什么采用故事是多渠道，而不是纯应用。Square Yards 仍在漏斗顶部引用高网站流量，但 AppBrain 公开
              Android 数据只显示 100,000+ 下载和 8,216 条评论，远低于 FY26 总获客量。这一差距意味着辅助销售、经纪人主导分销、开发商库存关系和合作伙伴主导的住房贷款获客，都是获客核心。


              具名证据是真实的，但更能证明客户队列层面，而不是合约经济层面。Urban Money 的 About 页面称 Square Connect 已赢得超过 100,000 人信任，且超过 5,000
              名房地产经纪人每天活跃使用该网络。Urban Money Partner 页面显示授权合作伙伴可跨银行实时追踪报价、收入和案件更新，这比普通联盟营销表单更能证明生产工作流。Urban Money 2026 年 1
              月的借款人研究又提供了一个具体需求证据：Tier-2 和 Tier-3 城市约占 2025 年住房贷款需求的 64%，并同比增长约 81%。这一点重要，因为它说明 Square Yards
              不只在变现大都会豪宅需求，也接入了小城市更广泛的住房贷款扩张故事。缺失环节是具名开发商或贷款机构的经济性。公开页面证明库存和贷款机构网络有深度，但没有证明任一交易对手的收入集中度。
