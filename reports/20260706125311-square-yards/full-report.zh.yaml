              Square Yards 于 2026 年 6 月融得 Rs 900 crore（约 $95 million），结构包含股权和债务（约三分之一股权、三分之二债务）。历轮累计融资约 $208
              million。当前估值超过 $1 billion。公司 FY26 EBITDA 为正，达到 Rs 176 crore，运营上可自我维持，但仍在为扩张和 IPO 准备筹集额外资本。公司正洽谈按最高 $1.6
              billion 估值进行 $50-60 million IPO 前融资。近期融资中的债务部分带来契约义务和偿还安排，但条款未公开披露。公司计划在 CY2026 进行 Rs 2,000 crore
              IPO，若完成将显著增强资本基础。资本投向优先级包括技术投入、地理扩张、资产负债表强化和 IPO 准备成本。由于 EBITDA 为正，现金消耗很低，不过公司可能在部分板块提前投入、领先于盈利。
