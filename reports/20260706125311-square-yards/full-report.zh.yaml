      - number: '8.3'
        title: 乐观、基准、悲观承销情景，以及价值创造仍在哪里
        blocks:
          - type: paragraph
            body: >-
              看 Square Yards 的正确问题不是「这是不是一家好公司？」，而是「按今天证据，哪个估值区间有支撑？公开市场愿意给更高定价前，还需要发生什么？」按当前私募基础，答案相当直接：>$1 billion
              标记有支撑。更难的问题是，公司能否从这个私募锚走向 $1.5 billion 至 $2.0 billion 的 IPO 叙事。若 FY27 收入真的增长 40%，达到约 Rs 2,920 crore，那么
              $1.5 billion 至 $1.6 billion 的 IPO 区间会降到约 4.8x 至 5.1x 远期收入——要求高，但对于一个拥有多重变现面、盈利改善的公司并不荒唐。$2.0 billion
              要价更难，因为即便按 40% 增长下限，仍对应约 6.4x 远期收入，因此需要高于下限的执行、更干净的融资质量，以及更友好的 IPO 市场。这就是 IPO 前与 IPO 后拆分很重要的原因：从今天约 $1.1
              billion 到 IPO 时 $1.6 billion 仍有可观上行，但如果 Square Yards 不能开始更像高利润率门户，而仍像一个由经纪人和融资驱动的交易平台，IPO 定价之后的增量上行会很快压缩。
