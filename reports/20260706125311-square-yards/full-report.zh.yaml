  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方 / 用户 / 付款方结构
        blocks:
          - type: paragraph
            body: >-
              Square Yards
              的客户基础比典型住宅经纪漏斗更宽。官方公司叙事把它定位为综合房地产与住房贷款平台，覆盖搜索、发现、交易、住房贷款、室内设计、租赁、物业管理和售后支持。这意味着买方、用户和付款方角色会随产品线变化。核心经纪旅程中，终端购房者或投资者是用户，但开发商往往通过佣金和库存准入为分销付费。住房贷款旅程中，借款人是用户，银行和
              NBFC 则通过 Urban Money 支付推荐经济。租赁、室内设计和物业管理场景中，房主、房东、租客或售后家庭成为终端用户。官方 About Us 页面也明确提到 NRI 客群，称 Square Yards
              连接住宅、商业和 NRI 类别下的买家、卖家和投资者。


              公开足迹说明，这种分层不是表面包装。Square Yards 称其覆盖 100+ 城市和 9 个国家，月流量 8mn+，并把平台描述为一条连续客户旅程，而不是一堆无关服务。Urban Money
              页面把这条旅程延伸到贷款和经纪人工具；LinkedIn 公开公司页则突出 Data Assisted Buying、Interior Decor、Property Management、Legal
              Services、3D Home Tours 和 Easy Loans 等相邻服务线。合在一起，这些界面支持尽调最该关注的四类客户：购房者和投资者、NRI 与海外导向客户、开发商和库存供应方，以及银行 /
              NBFC 加渠道伙伴。更不透明的是各客群的经济权重。公开披露证明了宽度，但没有证明分部收入结构、活跃客户数或按客户队列 看的留存。
