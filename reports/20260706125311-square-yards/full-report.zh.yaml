      - number: '6.3'
        title: 持久性、满意度与复用证据
        blocks:
          - type: paragraph
            body: >-
              持久性是客户故事里最缺证明的一环。公司披露了 55% 附加转化率，并上线了室内设计、租赁和物业管理等售后界面，说明 Square Yards 能在首次认购之外继续变现。FY26 材料还提到 1,840
              套自有设计住宅和 2,783 笔租赁交易，因此相邻服务采用并非假设。但已审阅公开来源均未披露 MAU、复购频次、重复借款曲线、NRR、GRR、流失、续约行为或活跃客户
              队列。住房是低频品类，这一缺口比日用软件产品更重要。公开证据证明平台能获客并分流客户；尚未证明这些客户队列在首笔交易后的经济持久性。


              客户满意度信号不是单边的，而是好坏参半。PissedConsumer 保留了至少一条强正面叙事，称赞易用性、丰富房产细节和虚拟看房；AppBrain 仍显示较高综合评分。但
              ConsumerComplaints.in 和 ComplaintLists
              等投诉密集论坛汇聚到另一组问题：退款延迟、激进电话营销、承诺未兑现、经纪人跟进弱，以及售后摩擦。这种分裂有分析价值。它说明前端发现体验可能强于认购或交接之后的服务层。AmbitionBox 员工评分为中等的
              3.5/5，不是客户证据，但方向上符合一个劳动密集平台的特征：执行质量会随团队、城市和经理而变化。实际结论是，客户满意度足以支撑规模，但若没有管理层数据，还不足以推断低流失或强推荐驱动的复利增长。
