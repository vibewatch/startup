      - number: '3.3'
        title: 竞争差异化与护城河
        blocks:
          - type: paragraph
            body: >-
              Square Yards 的主要竞争优势在于一体化收入模型，同一客户可触发多次收费——经纪佣金、住房贷款推荐费、室内设计项目收入和物业管理费。这与单一收入流竞争对手形成鲜明对比。Urban Money
              住房贷款平台拥有 150+ 银行合作伙伴，构成纯房源门户缺少的分销护城河。PropVR 的 3D 虚拟看房技术在房源发现上带来差异化，对不便实地看房的 NRI 买家尤其有用。公司 8,700-9,100
              名员工的规模，带来纯数字平台在 Tier 2-3 城市难以匹敌的地面覆盖。关键脆弱点包括经纪模式劳动密集（运营成本高于房源门户）、依赖开发商关系获取库存，以及 NoBroker
              面向价格敏感买家的零经纪费模式。护城河评估显示防御性中等——一体化模式创造转换成本，但每个单独组件都面对专门竞争者。
