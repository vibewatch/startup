chapter:
  number: 4
  title: "Financials"
  summary: "Square Yards delivered FY26 revenue of Rs 2,086 crore (48% YoY growth) with EBITDA of Rs 176 crore (8% margin, up from 3%), demonstrating operating leverage from brokerage commissions (primary) and mortgage referral fees (growing), while targeting 40%+ growth and double-digit EBITDA margins in FY27."
sections:
  - id: "revenue-model"
    title: "Revenue Streams and Pricing Model"
    body: "Square Yards generates revenue through four primary streams: (1) real estate brokerage commissions, typically 1-3% of transaction value paid by developers for primary residential sales facilitation, which constitutes the majority (~70%) of revenue; (2) mortgage referral fees from Urban Money, earned at 0.5-1.5% of loan value from 150+ banking and NBFC partners (~15-20% of revenue); (3) interior design project revenue through Interior Company, earned on design-build contracts; and (4) property management fees through Azuro. The revenue recognition model is primarily transaction-based — commissions are recognized upon successful property booking/registration, while mortgage fees are recognized upon loan disbursement. FY26 revenue reached Rs 2,086 crore (~$223 million), up 48% from Rs 1,410 crore in FY25. The Indian market contributed 88% of revenue, growing 57% YoY, while international operations (UAE, Australia, Canada) contributed the remaining 12%. Revenue quality is strong given the transaction-based recognition and minimal recurring subscription component, though the dependence on primary sales makes revenue cyclical with real estate market conditions."
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006", "CI007"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "cost-structure"
    title: "Cost Structure and Margin Analysis"
    body: "FY26 gross profit reached Rs 476 crore with a 23% gross margin, indicating significant cost of revenue from sales team compensation and developer incentive sharing. EBITDA was Rs 176 crore (8% margin), up from approximately Rs 47 crore (3% margin) in FY25, demonstrating 3.7x improvement and significant operating leverage. The cost structure is dominated by employee costs (estimated 60-65% of revenue) given the 8,700-9,100 person workforce required for the brokerage model. Sales and marketing costs are elevated given high customer acquisition costs in a low-frequency purchase category. Technology and platform costs are a smaller but growing component as the company invests in AI, PropVR, and digital infrastructure. The gross-to-EBITDA gap of 15 percentage points (23% gross margin minus 8% EBITDA) reflects the overhead burden of a large sales organization. Working capital is manageable as commission revenue typically flows within 30-60 days of transaction closure, though developer payment cycles can extend to 90+ days in some cases."
    claimRefs: ["CI008", "CI009", "CI010", "CI011", "CI012", "CI013"]
    tableRefs: ["TI003"]
    figureRefs: ["FI002"]
  - id: "unit-economics"
    title: "Unit Economics and GTM Efficiency"
    body: "With 2,73,643 customer acquisitions in FY26 and revenue of Rs 2,086 crore, the average revenue per customer acquisition is approximately Rs 76,000 (~$900). For real estate transactions worth Rs 13,236 crore facilitated, the implied take rate is approximately 15.8% of GTV (inflated by inclusion of mortgage and other revenue). The pure brokerage take rate on primary transactions is estimated at 2-3% based on industry standards. Sales cycle is moderate — property discovery to booking typically takes 30-90 days for primary residential. The 8,700-9,100 employee base implies revenue per employee of approximately Rs 23-24 lakh (~$27,000), which is below technology company benchmarks but consistent with brokerage/advisory models. Customer acquisition cost (CAC) data is not publicly disclosed but is estimated to be significant given the workforce size and marketing spend required. The FY27 guidance of 40%+ revenue growth with double-digit EBITDA margins suggests continued operating leverage as fixed costs are distributed over growing transaction volumes."
    claimRefs: ["CI014", "CI015", "CI016", "CI017", "CI018", "CI019"]
    tableRefs: []
    figureRefs: ["FI003"]
  - id: "capital-adequacy"
    title: "Capital Position and Financing"
    body: "Square Yards raised Rs 900 crore (~$95 million) in June 2026, combining equity and debt (approximately one-third equity, two-thirds debt). Total capital raised across all rounds is approximately $208 million. The current valuation exceeds $1 billion. With positive EBITDA of Rs 176 crore in FY26, the company is self-sustaining operationally but is raising additional capital for expansion and IPO preparation. The company is in discussions to raise an additional $50-60 million pre-IPO at up to $1.6 billion valuation. The debt component of recent raises introduces covenant obligations and repayment schedules that are not publicly disclosed. A Rs 2,000 crore IPO is planned for CY2026, which would significantly enhance the capital base. Capital deployment priorities include technology investment, geographic expansion, balance sheet strengthening, and IPO preparation costs. Cash burn is minimal given positive EBITDA, though the company may be investing ahead of profitability in some segments."
    claimRefs: ["CI020", "CI021", "CI022", "CI023", "CI024", "CI025", "CI026"]
    tableRefs: ["TI004", "TI005"]
    figureRefs: ["FI004"]
