callouts:
  - calloutType: "strength"
    title: "Operating Leverage Demonstrated"
    body: "EBITDA margin expansion from 3% to 8% on 48% revenue growth proves the brokerage model scales — fixed platform costs are absorbed while transaction volumes grow."
    claimRefs: ["CI009", "CI010"]
  - calloutType: "risk"
    title: "Revenue Cyclicality"
    body: "Transaction-based revenue is inherently tied to real estate market cycles. A slowdown in property sales would directly impact revenue without a sufficient recurring revenue base."
    claimRefs: ["CI001", "CI007"]
  - calloutType: "assumption"
    title: "Debt Covenant Uncertainty"
    body: "With approximately two-thirds of the recent Rs 900 crore raise being debt, undisclosed covenant terms represent a material financial risk that cannot be assessed without private data."
    claimRefs: ["CI021", "CI026"]
