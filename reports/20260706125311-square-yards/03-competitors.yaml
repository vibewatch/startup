callouts:
  - calloutType: "strength"
    title: "Unique Full-Stack Integration"
    body: "No competitor offers the complete brokerage-to-management lifecycle; this cross-sell model yields higher revenue per customer and creates ecosystem lock-in."
    claimRefs: ["CP013", "CP014"]
  - calloutType: "risk"
    title: "Labor-Intensive Model Limits Scalability"
    body: "With 8,700-9,100 employees vs 2,000-3,000 for comparable revenue listing portals, Square Yards' human-intensive model may face margin pressure at scale."
    claimRefs: ["CP016", "CP020"]
  - calloutType: "insight"
    title: "Convergence Threat"
    body: "As listing portals expand into transactions and NoBroker into services, the differentiation gap narrows — Square Yards must continuously deepen its integrated value proposition."
    claimRefs: ["CP024", "CP019"]
