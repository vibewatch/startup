- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Publicly visible workflow role
  - Maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Square Yards consumer platform
    - Homebuyer / investor / renter
    - Search, shortlist, compare, visit, transact, monitor portfolio
    - Scaled live platform
    - AI-matched search, price-trend views, verified listings, integrated adjacencies
    - No public uptime, architecture, or retention metrics
  - - Urban Money borrower platform
    - Borrower
    - Loan comparison, eligibility, approval assistance, cross-sell from property journey
    - Scaled live platform
    - Embedded finance inside property flow
    - No public lender-SLA or conversion-funnel disclosure
  - - Urban Money Partner
    - Channel partner / loan agent
    - Lead intake, application tracking, brokerage visibility, RM escalation
    - Live mobile workflow product
    - CRM-linked case tracking and partner economics inside one app
    - No public API/integration documentation
  - - Urban Money Force
    - Internal sales employee
    - Lead management, task tracking, status updates, follow-up orchestration
    - Live internal app
    - Operational tooling shows managed loan-origination workflow, not passive referral
    - No public reliability or security-control detail
  - - PropVR immersive stack
    - Developer / buyer / enterprise client
    - 3D tours, digital twins, AR/VR content, immersive sales enablement
    - Expanded via acquisition and ongoing operation
    - Dedicated 3D division with Unreal Engine relationship
    - No public throughput, rendering-cost, or adoption metrics by developer
  - - Data Intelligence / PropsAMC layer
    - Buyer, lender, wealth manager, internal teams
    - Registered-price lookup, valuation intelligence, transaction rankings, risk inputs
    - Public tool plus B2B productisation
    - Turns fragmented property data into reusable analytics asset
    - No public accuracy benchmark, coverage heatmap, or refresh-frequency SLA
  - - Interior Company / Azuro adjacencies
    - Homeowner / landlord / tenant
    - Post-purchase furnishing and rental/property-management cross-sell
    - Live adjacent brands
    - Raises lifetime-value potential beyond a one-time sale
    - Cross-sell attach rates not disclosed
  notes: Rows distinguish customer-facing products from internal or partner workflow tools. Maturity is inferred from public websites, app-store metadata, and company/partner announcements rather than audited product telemetry.
