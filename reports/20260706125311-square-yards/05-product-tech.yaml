  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-disclosure
    missingEvidence: Public uptime history, incident logs, service-level objectives, and disaster-recovery architecture for the consumer and mortgage platforms
    whyItMatters: Without reliability evidence, investors can confirm feature breadth but cannot assess operational resilience at unicorn-scale volumes ahead of the planned IPO.
    diligencePath: Request internal status-page history, incident postmortems, uptime dashboards, and cloud-resilience architecture from engineering leadership.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Model-governance documentation covering training data, human review, hallucination controls, bias checks, and approval workflows for production AI features
    whyItMatters: Square Yards publicly claims multiple AI workflows and risk-scoring applications, but governance quality determines whether those tools are durable and IPO-ready.
    diligencePath: Ask for model cards, review protocols, evaluation metrics, and escalation policies for every production AI use case.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: lender-integration-slas
    missingEvidence: Bank/NBFC integration documentation, approval-time distributions, API/SFTP architecture, and partner SLA performance for Urban Money
    whyItMatters: Embedded-finance tooling is strategically important, but operational reliability and lender dependency cannot be judged from marketing pages alone.
    diligencePath: Obtain lender-integration architecture, partner scorecards, and funnel-conversion dashboards from Urban Money product and operations teams.
    relatedQuestionRefs:
    - QE013
    - QE014
    relatedTableRefs:
    - TE002
    - TE003
  - type: missing-source
    severity: minor
    topic: data-intelligence-methodology
    missingEvidence: Methodology note describing data coverage, refresh frequency, and validation process for the public property-rates and valuation surfaces
    whyItMatters: The data-intelligence layer is central to valuation and risk claims, but its credibility depends on data freshness and coverage quality.
    diligencePath: Request methodology documentation or a public technical note from the data-intelligence team.
    relatedQuestionRefs:
    - QE004
    - QE012
    relatedTableRefs:
    - TE001
    - TE003
