callouts:
- calloutType: strength
  title: Integrated workflow is the core product advantage
  body: Square Yards’ strongest product signal is not any single feature but the way search, price intelligence, immersive viewing, finance, legal support, interiors, and rentals are all stitched into one user journey. That raises switching costs and expands monetisation beyond a lead fee.
  claimRefs:
  - CE001
  - CE003
  - CE021
  - CE026
  - CE031
- calloutType: strength
  title: AI and data assets are becoming standalone products
  body: The shift from internal tooling to externally marketed SuperAgent Pro and Data Intelligence Solutions suggests Square Yards is trying to turn proprietary workflow and property data into reusable B2B products, which could support higher-margin revenue streams over time.
  claimRefs:
  - CE018
  - CE019
  - CE036
  - CE037
- calloutType: risk
  title: Product breadth exceeds public control disclosure
  body: Public evidence is strong on features and awards but weak on hard technical controls. Investors still lack public architecture diagrams, incident metrics, security certifications, AI-governance controls, and lender-integration SLAs, so the product story remains easier to verify than platform resilience.
  claimRefs:
  - CE020
  - CE032
  - CE035
  - CE038
  - CE039
