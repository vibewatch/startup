- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - Square Yards solution
  - Measurable public benefit
  - Limitation
  rows:
  - - Property discovery
    - Search across cities, developers, price bands, and possession status
    - Consumer web/app with smart filters, locality insights, verified inventory
    - 500k+ Android downloads and 8.2k ratings show scaled distribution
    - No public active-user or search-to-visit conversion disclosure
  - - Remote property evaluation
    - Users want to assess homes before travel or site visits
    - 3D walkthroughs, virtual tours, videos, and PropVR immersive content
    - Repeatedly cited across official app copy, blog posts, and PropVR materials
    - No public engagement split between static and immersive listings
  - - Market intelligence before investment
    - Compare micro-markets and registration data
    - Data Intelligence page with rates, price appreciation, developer and locality rankings
    - Public evidence of structured transaction/value dashboards
    - No methodology note on data refresh cadence or geographic completeness
  - - Mortgage application
    - Borrower compares lenders and wants faster approval
    - Urban Money borrower platform with online comparison and digital-finance handoff
    - Official site markets quick approvals and end-to-end assistance
    - No public lender-approval SLA by bank or segment
  - - Partner-led mortgage sales
    - Loan agents need visibility into cases and commissions
    - Urban Money Partner app with dashboards, CRM-fed status, and brokerage updates
    - App-store/AppBrain copy shows real-time case and earnings workflows
    - No public disclosure on partner churn or response times
  - - Internal field execution
    - Employees need task queues and follow-up visibility
    - Urban Money Force app centralises lead status, tasks, and follow-ups
    - Public app description confirms dedicated internal workflow product
    - No public disclosure of incident management or device-security policies
