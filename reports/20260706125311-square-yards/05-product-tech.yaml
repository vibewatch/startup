  rows:
  - - Consumer experience layer
    - Search, shortlist, compare, transact, and manage post-sale flows
    - Square Yards website, Android app, iOS app
    - App stores, mobile release cycle, content operations
    - Quality drift if listings or UX are not refreshed in step with field ops
  - - Partner and employee workflow layer
    - Origination, CRM status, brokerage, and task orchestration for mortgages
    - Urban Money Partner and Urban Money Force app pages
    - Internal CRM and lender operations
    - Operational bottlenecks if CRM sync or task-routing breaks
  - - Property data layer
    - Rates, registered prices, developer and locality analytics
    - Data Intelligence public page and Inc42 B2B product story
    - Transaction ingestion, registry feeds, data normalisation
    - Coverage or accuracy gaps can weaken valuation/risk outputs
  - - AI application layer
    - Lead nurturing, content generation, image tagging, 2D-to-3D, predictive analytics
    - Microsoft case study, SuperAgentPro blog, Inc42 feature
    - Model providers, training data, human QA
    - Little public detail on hallucination controls or model governance
  - - Immersive 3D layer
    - Virtual tours, digital twins, cinematic 3D, AR/VR experience creation
    - PropVR site and Unreal Engine partnership
    - 3D-content production pipeline and Unreal ecosystem
    - Unknown unit economics and developer adoption by module
  - - Risk/compliance analytics layer
    - Real-time risk assessment and lending decision support
    - Bharat Fintech award write-up and Data Intelligence positioning
    - Internal analytics models, partner data, lender rules
    - Black-box risk models can create explainability and compliance issues
