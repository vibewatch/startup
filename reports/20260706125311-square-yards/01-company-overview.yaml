chapter:
  number: 1
  title: "Company Overview"
  summary: "Square Yards is India's largest integrated proptech platform, founded in 2014 by Tanuj Shori and Kanika Gupta Shori, achieving unicorn status in June 2026 after raising Rs 900 crore at a valuation exceeding $1 billion, with FY26 revenue of Rs 2,086 crore representing 48% year-over-year growth."
sections:
  - id: "identity-and-founding"
    title: "Identity, Founding, and Business Model"
    body: "Square Yards was founded in 2014 in Gurugram (Gurgaon), Haryana, India, by Tanuj Shori and Kanika Gupta Shori. The company was born out of the founders' personal frustration with the fragmented and opaque Indian real estate market while working as NRIs in Hong Kong. Tanuj Shori brought investment banking experience from Standard Chartered, Lehman Brothers, and Nomura, while Kanika Gupta Shori had a wealth management and strategy background with credentials from Delhi University and Wharton. The company operates as India's largest integrated proptech platform, combining real estate brokerage (Square Yards), mortgage facilitation (Urban Money), rental management (Azuro), interior design (Interior Company), and virtual property viewing (PropVR) into a single ecosystem. The business model generates revenue primarily through brokerage commissions on primary residential sales, mortgage referral fees from 150+ banking and NBFC partners, and fees from ancillary services. The company has expanded from its initial NRI-focused Gulf operations to a pan-India presence across 30+ cities, with international offices in UAE, Australia, and Canada, operating across 9 countries and 100+ cities globally."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO007", "CO008"]
    tableRefs: []
    figureRefs: ["FO003"]
  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key Personnel"
    body: "The leadership of Square Yards is anchored by co-founders Tanuj Shori (CEO) and Kanika Gupta Shori, both of whom have been with the company since inception. Tanuj Shori's background in investment banking at global institutions gives him strong financial acumen and deal-making capabilities critical for a real estate brokerage platform. The company employs between 8,700 and 9,100 people as of mid-2026, having grown from approximately 8,000 in 2025. The executive team includes senior professionals across technology, operations, and sales, though detailed board composition and independent director information remains limited for this private company. Key-person risk is concentrated in Tanuj Shori as the public face, primary fundraiser, and strategic decision-maker. The planned IPO in 2026 is expected to bring greater governance transparency, including formal board disclosures and independent director appointments required under SEBI listing regulations."
    claimRefs: ["CO009", "CO010", "CO011", "CO012", "CO013"]
    tableRefs: ["TO002"]
    figureRefs: []
  - id: "funding-and-valuation"
    title: "Funding History and Valuation Trajectory"
    body: "Square Yards has raised approximately $208 million across 8 funding rounds since inception. The most significant was the June 2026 round of Rs 900 crore (~$95 million) combining equity and debt, anchored by EAAA Alternatives (the Edelweiss group's alternative investment arm) and global credit manager Muzinich & Co., which pushed the valuation above $1 billion and confirmed unicorn status. Prior to this, the November 2025 Series C of $35 million was led by South Korea's Smilegate Investment at a $900 million pre-money valuation. Earlier rounds included $24.82 million in venture debt from ADM Capital in 2021, $20 million from Bennett Coleman (Times Group) in 2019, $12 million from Reliance Group Holdings in 2016, and $10 million in convertible notes from Lohia Group in 2017. The company is now preparing for a Rs 2,000 crore (~$240 million) IPO targeted for calendar year 2026, with discussions ongoing to raise an additional $50-60 million in pre-IPO funding at a valuation as high as $1.6 billion. Investment bankers are being appointed and a DRHP filing is anticipated within FY27."
    claimRefs: ["CO014", "CO015", "CO016", "CO017", "CO018", "CO019", "CO020", "CO021", "CO022", "CO023"]
    tableRefs: ["TO003"]
    figureRefs: []
  - id: "scale-and-milestones"
    title: "Scale Metrics and Key Milestones"
    body: "Square Yards achieved significant scale in FY26 with revenue reaching Rs 2,086 crore (~$223 million), up 48% year-over-year from Rs 1,410 crore in FY25. EBITDA surged 3.7x to Rs 176 crore with margins expanding from 3% to 8%, marking the third consecutive year of positive EBITDA. The Indian market contributed 88% of total revenue, growing 57% year-over-year. In FY26, the platform facilitated 2,73,643 customer acquisitions, real estate transactions worth Rs 13,236 crore, and loan disbursals of Rs 87,831 crore through Urban Money. The company reported gross profit of Rs 476 crore with a 23% gross margin. Square Yards has set FY27 targets of 40%+ revenue growth and double-digit EBITDA margins. Key milestones include the founding in 2014, rapid expansion through acquisitions of Interior Company, Azuro, and PropVR, the pivot from NRI-focused to pan-India operations, consistent revenue CAGR of approximately 53% over five years, and the achievement of unicorn status in June 2026."
    claimRefs: ["CO024", "CO025", "CO026", "CO027", "CO028", "CO029", "CO030", "CO031", "CO032", "CO033", "CO034", "CO035"]
    tableRefs: ["TO001", "TO004"]
    figureRefs: ["FO001", "FO002"]
