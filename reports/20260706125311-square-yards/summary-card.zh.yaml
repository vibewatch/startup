    - CEO Tanuj Shori 同时是主要融资人、公众门面和决策者，关键人集中
    - Rs 900 crore 融资中三分之二为债务，契约条款未披露
    - 房源平台切入交易、NoBroker 扩展服务栈，竞争边界趋同
    - 目标 Rs 2,000 crore 的 IPO 面临资本市场波动下的执行风险
    - 多个论坛上的消费者投诉显示服务质量不一致
  unresolvedGaps:
    - 各分部收入精确拆分（经纪 / 按揭 / 室内装修）未披露
    - IPO 前无法取得按分部划分的获客成本和单位经济
    - 近期融资的债务契约条款和还款时间表未披露
    - 完整董事会构成和治理结构未公开
    - 现金头寸和详细资产负债表需等 DRHP 提交
