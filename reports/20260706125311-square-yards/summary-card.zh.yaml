  topStrengths:
    - 经纪 + 按揭 + 室内装修 + 管理的一体化全栈模型，带来交叉销售和生态锁定
    - 收入增长轨迹强（同比 48%，5 年 CAGR 53%），经营杠杆已显现
    - EBITDA 转正且利润率从 3% 扩至 8%，可持续盈利路径得到验证
