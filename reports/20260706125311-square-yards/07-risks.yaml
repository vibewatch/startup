- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Market cyclicality
    - Bookings and inventory trend
    - Sector growth slows materially below current FY26 expectations while inventory keeps rising
    - Re-underwrite volume assumptions and downgrade revenue confidence
  - - Regulatory / legal risk
    - State-RERA or homebuyer-remedy signal
    - Repeat registration notices, refund disputes, or forum-selection conflicts tied to Square Yards entities
    - Treat compliance as a growth drag, not just a legal-cost line item
  - - Lender-partner conduct risk
    - RBI/LSP or lender complaint signal
    - Evidence of LSP-control failures, borrower-disclosure lapses, or partner-lender attrition
    - Stress Urban Money monetization and broader brand spillover
  - - IPO execution risk
    - Public listing timeline
    - No DRHP evidence or visible banker progress despite continued IPO messaging
    - Assume the unicorn round is a bridge, not a near-term de-risking event
  - - Debt / refinancing risk
    - Capital-market dependency
    - Need for additional capital before clearer covenant disclosure or sustained double-digit margin visibility
    - Increase discount rate and shorten underwriting horizon
  - - People / reputation risk
    - Founder or brand trigger
    - Founder departure, board-opacity persistence, or a cluster of unresolved refund or fraud allegations
    - Pause conviction until governance and complaint data improve
  notes: These are thesis-break triggers rather than generic KPI watchlists; each maps a public signal to a change in underwriting posture.
