- id: regulatory-legal-and-ipo-risk
  title: Regulatory and IPO execution risk
  body: 'The legal and regulatory stack is broader than a simple ‘RERA compliant or not’ checkbox. Square Yards’ home market sits under Haryana RERA’s Gurugram authority, while other operating states maintain their own complaint and agent surfaces, and UP-RERA’s public materials emphasize consumer protection, speedier adjudication, and transparency as the point of the regime. LiveLaw’s lease-jurisdiction analysis shows why this matters in practice: state approaches are not perfectly uniform, especially where lease-like structures resemble sales or where local guidance remains underdeveloped. Bar & Bench’s coverage adds another layer by showing that the Supreme Court continues to refine when RERA, IBC, and consumer forums should be used, meaning delay, refund, or possession disputes can become procedurally complex before they become economically material. On top of that, the IPO path itself is rule-heavy in 2026. SEBI’s amended ICDR regime, its master circular, merchant-banker due-diligence
    repository rule, and audiovisual-offer-document requirement all raise the burden of documentation, consistency, and internal readiness. The main risk is not that Square Yards cannot list; it is that the public record here does not yet prove how far along the company is in clearing those gates.'
