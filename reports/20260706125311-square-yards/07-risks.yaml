- id: partner-people-and-financial-risk
  title: Partner, people, and financial-model risk
  body: Square Yards’ partner and people risk is best understood as concentration of critical dependencies rather than concentration of any single revenue customer. Urban Money’s scale is meaningful, but it depends on regulated lenders and their conduct frameworks rather than on a captive loan book. RBI’s digital-lending rules, responsible-business-conduct directions, and fair-practices code all push responsibility back onto the regulated entity and highlight disclosures, grievance handling, data usage, and recovery conduct, so a lender-side conduct issue can still echo into the Square Yards brand if the lead-generation or servicing experience feels predatory or opaque. Funding structure adds another layer. Outlook says part of the June 2026 raise will refinance debt, ET says the company is discussing an additional $50-60 million raise, and the public corpus still does not show the covenant package or maturity ladder behind the debt component. Founder concentration is also material. The
    2026 capital-raise narrative is publicly voiced through Tanuj Shori, while the official company materials reviewed here do not disclose a broader succession or board framework. In a multi-brand, pre-IPO company, that is manageable until execution slips; after that, it can become a multiplier.
