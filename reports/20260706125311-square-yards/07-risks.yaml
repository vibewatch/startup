  evidenceGaps:
  - type: missing-source
    severity: material
    topic: state-rera-compliance
    missingEvidence: A current state-by-state RERA registration and notice history for Square Yards agents and entities.
    whyItMatters: Square Yards operates across many cities, but this public corpus does not prove the company’s own registration status or complaint history in each state regime.
    diligencePath: Request a current state-wise RERA compliance register with licence numbers, renewal dates, and any notices or penalties received.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Debt maturity, covenant, security, and waiver terms for the debt component of the June 2026 raise.
    whyItMatters: A cyclical booking slowdown can turn manageable leverage into a liquidity event if the covenant package is tight or near-dated.
    diligencePath: Obtain facility agreements or a lender summary showing maturities, covenants, security, and permitted uses of proceeds.
    relatedQuestionRefs:
    - QR003
    - QR024
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: ipo-preparedness
    missingEvidence: DRHP filing status, merchant-banker roster, board-approved IPO workplan, and any pre-filing SEBI comments.
    whyItMatters: The IPO is part of the company’s current valuation and balance-sheet story, so slippage or diligence issues would directly affect the investment case.
    diligencePath: Request the IPO readiness tracker, mandates to merchant bankers and legal counsel, and the target DRHP calendar.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: complaint-resolution-metrics
    missingEvidence: Complaint volumes, refund rates, average resolution time, and CSAT by brokerage, mortgage, interiors, and rentals.
    whyItMatters: Public review sites prove anecdotes exist, but not whether service failures are isolated or systemic across business lines.
    diligencePath: Request monthly complaint dashboards and refund-aging reports for each major business line.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: succession-governance
    missingEvidence: Current board composition, independent oversight, founder delegation, and formal succession planning.
    whyItMatters: Founder concentration is more material when the company is simultaneously scaling multiple adjacencies and preparing for an IPO.
    diligencePath: Request the current board and executive org chart, committee structure, and formal succession-planning materials.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR004
    - TR005
