- id: mitigations-monitoring-and-thesis-breakers
  title: Mitigations, monitoring, and thesis-break triggers
  body: 'The mitigating case is real but incomplete. Square Yards enters this risk chapter with better evidence than many private proptechs: FY26 operating leverage improved materially, the company raised meaningful institutional capital, its official materials support a wide geographic and service footprint, and the mortgage arm appears to work with a diversified lender network rather than a single balance-sheet counterparty. Review surfaces are also not uniformly adverse, which matters because a polarized brand is harder to repair than a mixed one. Still, the chapter’s thesis breakers should be framed around observable events rather than management optimism. If sector booking growth slows and inventory builds faster than demand, Square Yards’ conversion-led revenue can soften before cross-sell economics compensate. If any RERA registration, refund, or forum-choice dispute becomes recurrent across states, the legal stack becomes a growth drag rather than a compliance cost. If lender-partner
    conduct or digital-lending compliance issues appear, the risk transmits into trust at Urban Money and then into the broader platform. And if the IPO timetable slips without clearer governance or covenant disclosure, today’s unicorn story starts to look more like a financing bridge than a durable de-risking event.'
