company:
  name: Square Yards
chapter:
  number: 8
  title: Valuation
  summary: 'Square Yards now has a usable >$1 billion private valuation anchor after its June 2026 unicorn round, but the hybrid debt-equity structure and incomplete DRHP-grade disclosure make the $1.5-2.0 billion IPO aspiration materially harder to underwrite. On FY26 revenue of ₹2,086 crore (~$223 million), the current private mark implies roughly 4.5x-5.0x revenue — fair for a 48% growth, 8% EBITDA-margin blended proptech/fintech platform — while the IPO band pushes toward 6.7x-9.0x and therefore requires cleaner capital terms, sustained 40%+ growth, and a friendlier IPO tape. Recommendation: track / research-more at the current mark; do not chase IPO pricing without cap-table, debt, and segment-economics disclosure.'
sections:
- id: current-pricing-and-entry-discipline
  title: Current pricing anchor and entry discipline
  body: Square Yards finally has a real public valuation anchor, but it is not a perfect one. The June 2026 round put Rs 900 crore (~$95 million) into the company and publicly moved the platform into the unicorn club at more than $1 billion. That matters because the prior late-2025 step-up to about $900 million had left the company close to, but not across, the symbolic threshold. It also matters because the round was anchored by institutional capital rather than purely by secondary-market gossip. Still, the financing mix complicates interpretation. Multiple outlets said the round was a blend of debt and equity, and some said it was roughly one-third equity and two-thirds debt. That means the headline valuation is usable as an anchor, but not yet as a clean all-equity comparable for public-market underwriting. The same coverage tied the raise directly to balance-sheet strengthening, refinancing, technology investment, and IPO preparation, which is rational for a company preparing a public
    listing but also underscores why entry discipline matters. At today’s private mark, the company looks defensible. At the marketed IPO band, the burden of proof rises materially.
  claimRefs:
