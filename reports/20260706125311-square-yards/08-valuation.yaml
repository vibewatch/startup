  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Exact debt-versus-equity split, debt covenants, repayment schedule, and any liquidation preference or anti-dilution terms in the June 2026 financing.
    whyItMatters: The hybrid round headline may overstate the quality of the common-equity valuation if downside protection or restrictive debt terms are doing part of the work.
    diligencePath: Review executed term sheets, debt documents, and the cap-table waterfall under NDA before treating the unicorn mark as a clean pricing anchor.
    relatedQuestionRefs:
    - QV003
    - QV023
    - QV027
  - type: private-evidence-only
    severity: material
    topic: ipo-underwriting
    missingEvidence: DRHP-grade disclosure for segment revenue, segment EBITDA, customer cohorts, conversion funnel, and booked FY27 pipeline.
    whyItMatters: Without audited segment economics and near-term pipeline proof, the $1.5-2.0 billion IPO band remains more narrative than underwritten cash-flow evidence.
    diligencePath: Require a DRHP draft or management data room package with FY26 audited financials and current FY27 run-rate detail before underwriting the IPO band.
    relatedQuestionRefs:
    - QV005
    - QV016
    - QV017
    - QV027
  - type: conflicting-data
    severity: minor
    topic: funding-history
    missingEvidence: A reconciled funding history that explains differences between lagging third-party databases, equity-only tallies, and the new mixed debt-equity round.
    whyItMatters: Inconsistent funding totals are not thesis-breaking by themselves, but they signal why valuation quality and dilution cannot be inferred from headlines alone.
    diligencePath: Request a round-by-round capitalization history that separates equity, venture debt, and other structured instruments.
    relatedQuestionRefs:
    - QV004
    - QV023
  - type: enumeration-incomplete
    severity: minor
    topic: TV003 comparable-set completeness
    missingEvidence: A fully exhaustive like-for-like public comparable set for an India-focused blended proptech, mortgage-distribution, and transaction-services model.
    whyItMatters: TV003 is intentionally partial because no perfect public peer basket exists; a fuller comp sheet could still shift the exact relative-multiple conclusion at the margin.
    diligencePath: Expand the comp screen with banker-style peer work once management discloses segment mix, margin quality, and public-filing-ready operating definitions.
    relatedTableRefs:
    - TV003
