- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Debt/equity split and covenants
    - Executed term sheet, debt package, covenants, maturity profile, and allowed leverage
    - Determines whether the unicorn mark is a clean equity signal or partly a structured capital solution
    - CFO and counsel under NDA; financing document review
  - - Cap-table quality
    - Preference stack, anti-dilution rights, liquidation waterfall, and any secondary components
    - Without this, private valuation quality cannot be compared cleanly with public multiples
    - Finance team data room and board-approved cap table
  - - Segment economics
    - Revenue, gross margin, and EBITDA by brokerage, Urban Money, rentals, interiors, and other businesses
    - Needed to know whether Square Yards deserves a portal premium or a blended-service discount
    - Audited management pack or DRHP draft
  - - FY27 visibility
    - Booked pipeline, conversion assumptions, and current run-rate versus the 40%+ growth target
    - The IPO band only works if forward growth is both real and visible
    - Management forecast pack plus monthly run-rate bridge
  - - Public-listing readiness
    - DRHP timing, governance upgrades, and how management plans to present the hybrid funding history to investors
    - A good business can still price poorly if disclosure quality is not public-market ready
    - IPO counsel, merchant bankers, and readiness workplan
  notes: These asks are valuation-critical. Until they are answered, Square Yards should be treated as a credible company with an incomplete pricing file.
