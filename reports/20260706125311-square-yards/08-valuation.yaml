- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Growth + profitability
    - 48% FY26 growth with 8% EBITDA margin shows real operating leverage.
    - An 8% margin is still far below portal-quality profitability and could prove cyclical.
    - Segment-level margin disclosure and another year of profitable growth.
  - - Monetization breadth
    - Brokerage, mortgages, rentals, interiors, and services create cross-sell optionality beyond one-time transactions.
    - Breadth can also mask which segments truly earn the premium multiple and which dilute quality.
    - Audited segment revenue, margin, and cohort economics.
  - - Current pricing anchor
    - The unicorn round is a real 2026 arm’s-length financing event.
    - The mark is muddied by debt, refinancing, and still-missing preference details.
    - Executed financing documents and cap-table waterfall.
  - - IPO pathway
    - India’s exit window is open enough that a 2026 listing is plausible.
    - The same market is enforcing pricing discipline and punishing overreach.
    - A stronger secondary tape and better listing outcomes for peer tech IPOs.
  - - Comparable set
    - Square Yards deserves a premium to brokerages like Compass/eXp because of faster growth and financing breadth.
    - It still lacks the margin quality and listing dominance of REA/Rightmove, so portal multiples may be too generous.
    - Proof that FY27 mix and margins are structurally moving toward portal-like quality.
  notes: The anti-thesis is valuation and capital-structure driven, not a claim that Square Yards lacks commercial momentum.
