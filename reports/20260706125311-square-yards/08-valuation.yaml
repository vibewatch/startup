- id: scenario-underwriting-and-value-creation
  title: Bull, base, and bear underwriting — and where value creation still sits
  body: 'The right way to look at Square Yards is not “is this a good company?” but “what valuation band is justified by today’s evidence, and what still needs to happen before the public market pays up?” On a current private basis, the answer is fairly straightforward: the >$1 billion mark is supportable. The harder question is whether the company can move from that private anchor to a $1.5 billion to $2.0 billion IPO narrative. If FY27 revenue really grows 40% and reaches roughly Rs 2,920 crore, then a $1.5 billion to $1.6 billion IPO band falls to around 4.8x to 5.1x forward revenue — demanding, but not absurd for a company with multiple monetization surfaces and improving profitability. A $2.0 billion ask is harder because it still implies about 6.4x forward revenue on the 40% growth floor and therefore needs better-than-floor execution, cleaner financing quality, and a more receptive IPO tape. This is why the pre-IPO versus post-IPO split matters: the move from roughly $1.1 billion
    today to $1.6 billion at IPO still offers meaningful upside, but the incremental upside after that compresses quickly unless Square Yards begins to look much more like a high-margin portal than like an agent- and financing-enabled transaction platform.'
