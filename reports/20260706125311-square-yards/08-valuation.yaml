- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range (USD bn)
  - Probability signal
  - What must be true
  rows:
  - - Bull
    - FY27 growth stays above 40%, EBITDA margin moves above 12%, next financing cleans up the structure, and the IPO market rewards scaled consumer-tech issues.
    - 1.6-2.0
    - 20-25%
    - DRHP-grade disclosure, cleaner capital stack, and clear evidence that Square Yards deserves more than a brokerage multiple.
  - - Base
    - FY27 growth lands around 35-40%, EBITDA margin reaches 10-11%, and the 2026 IPO window is adequate but disciplined.
    - 1.2-1.5
    - 50-55%
    - Execution stays good enough for public markets to accept a fair but not euphoric valuation.
  - - Bear
    - IPO timing slips, growth drops below 30%, margin stalls below 9%, or debt/cap-table terms reduce equity-quality confidence.
    - 0.9-1.1
    - 20-30%
    - A weaker IPO tape or messy financing terms pull Square Yards back toward current private support rather than a premium rerating.
  notes: Scenario ranges are evidence-based underwriting bands, not management guidance. Probability signals are directional judgments from today’s public file.
