- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO window weakens materially
    - Secondary-market volatility keeps launches muted into Square Yards’ target window
    - Premium multiple support falls first, even if operations remain decent
    - Move fair value toward current private support rather than IPO-band pricing
  - - Growth misses hard
    - FY27 revenue growth falls below 30%
    - Current private premium no longer looks like a fast-growth multiple
    - Re-underwrite to a Zillow/Compass-like comp band
  - - Margin progress stalls
    - EBITDA margin stays below 9% into IPO preparation
    - The business screens more like throughput than quality platform economics
    - Cut bull case and assume lower post-listing rerating potential
  - - Financing quality disappoints
    - Debt covenants, preferences, or dilution protections are more aggressive than expected
    - Headline unicorn mark loses value as a clean equity anchor
    - Treat current round as structured financing, not a public comp
  - - Disclosure remains thin
    - No DRHP-grade segment and cap-table detail before pricing talks intensify
    - The anti-thesis of opacity remains unresolved
    - Do not underwrite the IPO band; stay in track / research-more
  notes: These are thesis-break triggers, not generic operating risks. Each one directly changes the multiple the market can rationally pay.
  claimRefs:
