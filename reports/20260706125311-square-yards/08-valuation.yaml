- id: peer-multiples-and-growth-adjusted-lens
  title: Revenue multiples versus peers and growth-adjusted framing
  body: 'The simplest valuation test is to ask where Square Yards belongs on the spectrum between brokerage-heavy transaction companies and premium real-estate portals. Using the Economic Times revenue bridge of about $223 million for FY26, a practical current valuation band of roughly $1.0 billion to $1.1 billion implies about 4.5x to 4.9x revenue. That already sits far above brokerage-heavy peers such as eXp and materially above Compass, but still below platform franchises like Rightmove and REA that enjoy higher-margin, listing-dominant models. Public comps show how wide this spread is: eXp is roughly a 0.2x revenue name, Compass about 1.4x, Zillow about 2.8x, Rightmove about 7.9x, and REA about 10.3x. That alone argues against calling Square Yards obviously cheap. But a growth-adjusted lens softens the picture. Square Yards is still growing 48% with positive EBITDA, which puts its simple multiple-per-growth-point ratio much closer to faster-growing blended platforms than to mature portals.
    In other words, today’s private mark is not outrageous if growth sustains. The problem is that a growth-adjusted heuristic cannot substitute for proof on mix quality, margin durability, and what portion of the growth engine is repeatable versus cyclical real-estate throughput.'
