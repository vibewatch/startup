tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why this is the current view
  - What changes the view
  rows:
  - - Recommendation
    - track / research-more
    - The >$1B private mark is defendable, but the disclosure base is not strong enough for a buy-style call.
    - DRHP-grade segment economics, clean financing terms, and clearer FY27 booked growth.
  - - Confidence
    - Medium
    - Observable round facts are strong, but pricing is still sensitive to cap structure and IPO timing.
    - Audited numbers plus cap-table and debt documentation.
  - - Risk rating
    - High
    - The business is improving, but multiple compression risk is real if the IPO tape weakens or financing terms disappoint.
    - A better IPO window and evidence that public investors accept a premium multiple.
  - - Valuation stance
    - Fair now; stretched at IPO talk
    - Current private pricing looks reasonable against growth, but $1.5-2.0B needs much more proof.
    - 40%+ FY27 growth, double-digit EBITDA margin, and cleaner financing quality.
  - - Decision implication
    - Prefer disciplined pre-IPO entry over IPO-band chasing
    - Most visible upside still sits before listing; post-IPO upside compresses quickly.
    - Price offered materially below marketed IPO range or disclosure materially above today’s baseline.
  notes: 'This table is intentionally price-sensitive: it separates the defendable current private mark from the much less proven IPO-band aspiration.'
