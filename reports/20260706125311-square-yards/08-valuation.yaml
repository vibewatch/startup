- id: final-call-triggers-and-diligence
  title: Final call, thesis-break triggers, and remaining diligence asks
  body: 'The chapter conclusion is price-sensitive rather than company-quality-sensitive. Square Yards has enough evidence of scale, monetization breadth, and operating improvement to justify attention and to defend the current unicorn mark. What it does not yet have is enough public disclosure to justify an aggressive buy or blind IPO-chase posture. Bain, McKinsey, Preqin, BCG, and India IPO-market coverage all point to the same meta-point: 2026 is open enough for exits to happen, but not open enough to ignore underwriting discipline. That makes the anti-thesis less about business collapse and more about multiple compression, cap-structure leakage, or a weaker-than-expected IPO window. The most important diligence asks are therefore not generic growth questions but valuation-moving questions: debt terms, cap-table quality, audited segment economics, and booked FY27 visibility. Until those are answered, the best posture is track / research-more at the current mark and resist paying the $1.5
    billion to $2.0 billion range as if the DRHP were already public. If management can show clean terms, double-digit margins, and a credible route to REA/Rightmove-style quality rather than Compass/eXp-style cyclicality, the call can move higher. If not, the thesis breaks faster than the headline growth narrative suggests.'
