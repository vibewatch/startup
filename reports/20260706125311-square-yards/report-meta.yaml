companyProfile:
  summary: "Square Yards is India's largest integrated proptech platform, founded in 2014 by Tanuj Shori and Kanika Gupta Shori. The company offers an end-to-end real estate ecosystem spanning property brokerage (Square Yards), mortgage facilitation (Urban Money with 150+ banking partners), interior design (Interior Company), property management (Azuro), and virtual property tours (PropVR). In June 2026, Square Yards achieved unicorn status after raising Rs 900 crore from EAAA Alternatives and Muzinich & Co, pushing its valuation above $1 billion. FY26 revenue reached Rs 2,086 crore (48% YoY growth) with EBITDA of Rs 176 crore (8% margin). The company operates across 100+ cities in 9 countries with 8,700-9,100 employees, and is preparing for a Rs 2,000 crore IPO."
