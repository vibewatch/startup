company:
  name: "Square Yards"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "India's real estate market is projected at $585 billion in 2026 with a proptech layer of $1.3-1.8 billion growing at 12-19% CAGR, while the home mortgage finance market reaches $540 billion, creating an enormous TAM for Square Yards' integrated brokerage and fintech model."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Definition"
    body: "Square Yards operates at the intersection of three adjacent markets: real estate brokerage and transaction services, mortgage and home loan facilitation, and proptech technology services. The primary addressable market is India's residential real estate transaction layer — the brokerage commission and service fees earned on primary and secondary property sales. This excludes the underlying property value itself but includes the 1-3% brokerage commission on transactions. The adjacent mortgage market encompasses referral fees and commission income from facilitating home loans, typically 0.5-1.5% of loan value. The proptech layer covers technology-enabled services including virtual tours, AI-powered recommendations, and digital transaction management. Status-quo substitutes include traditional offline brokers (who still control 80%+ of transactions), direct developer sales teams, and bank-direct mortgage applications without intermediaries. The market boundary explicitly excludes commercial real estate advisory (Anarock's primary domain), pure-play rental classifieds (NoBroker's core), and construction/development activities."
    claimRefs: ["CM001", "CM002", "CM003", "CM004"]
    tableRefs: ["TM001"]
    figureRefs: []
  - id: "market-sizing"
    title: "TAM, SAM, and SOM Sizing"
    body: "India's overall real estate market is valued at approximately $585 billion in 2026, with the residential segment at $438 billion. The proptech market specifically is projected at $1.3-1.8 billion in 2026, growing at a CAGR of 12-19% depending on methodology and scope. For Square Yards' TAM, we consider three lenses: (1) The brokerage commission pool on India's residential transactions — with approximately $130 billion in annual residential transaction value and average brokerage rates of 2%, this yields a brokerage TAM of approximately $2.6 billion; (2) The mortgage facilitation opportunity — India's mortgage market is $540 billion with ~12% annual originations ($65 billion), and referral commissions of 0.5-1% yield a $325-650 million TAM; (3) The ancillary services layer (interiors, property management) adds another $500 million-$1 billion. The SAM narrows to digitally addressable urban transactions in India's top 50 cities where Square Yards has presence, estimated at 40-50% of the national TAM. The SOM reflects Square Yards' current capture of Rs 13,236 crore in GTV (approximately $1.6 billion) against a total market of $130 billion in residential transactions, implying roughly 1.2% market penetration by transaction volume."
    claimRefs: ["CM005", "CM006", "CM007", "CM008", "CM009", "CM010", "CM011"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001", "FM002"]
  - id: "buyer-segmentation"
    title: "Buyer, User, and Payer Segmentation"
    body: "The Square Yards ecosystem serves multiple buyer personas with distinct purchase behaviors. The primary residential buyer (first-time homebuyer in the Rs 50 lakh-Rs 2 crore range) represents the volume driver, particularly in Tier 1 and emerging Tier 2 cities. The NRI investor segment, which was Square Yards' original focus, provides higher transaction values but lower volume. The premium/luxury buyer (Rs 2 crore+) is growing fastest at 30% YoY in Q1 2026. On the payer side, real estate developers are the primary commission source for brokerage services, paying Square Yards for customer acquisition and sales facilitation. Banks and NBFCs pay referral fees to Urban Money for mortgage leads. End consumers pay for ancillary services (interior design, property management). Budget ownership sits with developer marketing teams for brokerage commissions and with bank retail lending divisions for mortgage referrals. The adoption trigger for digital platforms is typically a major life event (marriage, job relocation, family expansion) combined with increasing comfort with online property discovery accelerated by COVID-era behavioral shifts."
    claimRefs: ["CM012", "CM013", "CM014", "CM015", "CM016"]
    tableRefs: ["TM003"]
    figureRefs: ["FM003", "FM004"]
  - id: "growth-drivers"
    title: "Growth Drivers and Adoption Constraints"
    body: "Key growth drivers include India's rapid urbanization (40% urban population projected by 2030), rising middle-class income enabling homeownership, government policy support through PMAY and Smart Cities Mission, declining interest rates (repo rate trending toward 5.25%), and RERA enforcement improving transaction transparency. Digital adoption is accelerated by 800 million+ internet users and increasing comfort with high-value online transactions post-COVID. India's mortgage penetration at 11-12% of GDP versus 60%+ in developed markets represents enormous headroom. Constraints include entrenched offline broker relationships (especially in Tier 2-3 cities), developer resistance to platform-mediated sales, regulatory fragmentation across states, high customer acquisition costs in a low-frequency purchase category, and trust barriers for high-value digital transactions. Capital intensity is moderate — the brokerage model is asset-light but requires significant sales team investment."
    claimRefs: ["CM017", "CM018", "CM019", "CM020", "CM021", "CM022", "CM023"]
    tableRefs: ["TM004"]
    figureRefs: []
