callouts:
  - calloutType: "strength"
    title: "Massive Underpenetrated Market"
    body: "India's mortgage-to-GDP ratio of 11-12% versus 60%+ in developed markets provides a multi-decade structural tailwind for mortgage facilitation services."
    claimRefs: ["CM019", "CM020"]
  - calloutType: "risk"
    title: "Sizing Uncertainty"
    body: "Market size estimates vary by 40%+ depending on methodology. The brokerage commission pool is highly sensitive to commission rate assumptions which are declining under competitive pressure."
    claimRefs: ["CM007", "CM008"]
  - calloutType: "insight"
    title: "Platform Economics Favor Full-Stack"
    body: "The low frequency of property purchases makes customer acquisition expensive, but the full-stack model (brokerage + mortgage + interiors) amortizes CAC across multiple revenue events per customer."
    claimRefs: ["CM022", "CM003"]
