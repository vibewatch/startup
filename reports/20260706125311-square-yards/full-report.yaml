  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Square Yards generates revenue through four primary streams: (1) real estate brokerage commissions,
              typically 1-3% of transaction value paid by developers for primary residential sales facilitation, which
              constitutes the majority (~70%) of revenue; (2) mortgage referral fees from Urban Money, earned at
              0.5-1.5% of loan value from 150+ banking and NBFC partners (~15-20% of revenue); (3) interior design
              project revenue through Interior Company, earned on design-build contracts; and (4) property management
              fees through Azuro. The revenue recognition model is primarily transaction-based — commissions are
              recognized upon successful property booking/registration, while mortgage fees are recognized upon loan
              disbursement. FY26 revenue reached Rs 2,086 crore (~$223 million), up 48% from Rs 1,410 crore in FY25. The
              Indian market contributed 88% of revenue, growing 57% YoY, while international operations (UAE, Australia,
              Canada) contributed the remaining 12%. Revenue quality is strong given the transaction-based recognition
              and minimal recurring subscription component, though the dependence on primary sales makes revenue
              cyclical with real estate market conditions.
            claimRefs:
