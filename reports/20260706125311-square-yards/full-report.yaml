      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Key growth drivers include India's rapid urbanization (40% urban population projected by 2030), rising
              middle-class income enabling homeownership, government policy support through PMAY and Smart Cities
              Mission, declining interest rates (repo rate trending toward 5.25%), and RERA enforcement improving
              transaction transparency. Digital adoption is accelerated by 800 million+ internet users and increasing
              comfort with high-value online transactions post-COVID. India's mortgage penetration at 11-12% of GDP
              versus 60%+ in developed markets represents enormous headroom. Constraints include entrenched offline
              broker relationships (especially in Tier 2-3 cities), developer resistance to platform-mediated sales,
              regulatory fragmentation across states, high customer acquisition costs in a low-frequency purchase
              category, and trust barriers for high-value digital transactions. Capital intensity is moderate — the
              brokerage model is asset-light but requires significant sales team investment.
            claimRefs:
