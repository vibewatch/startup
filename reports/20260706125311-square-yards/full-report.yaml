  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Square Yards operates at the intersection of three adjacent markets: real estate brokerage and transaction
              services, mortgage and home loan facilitation, and proptech technology services. The primary addressable
              market is India's residential real estate transaction layer — the brokerage commission and service fees
              earned on primary and secondary property sales. This excludes the underlying property value itself but
              includes the 1-3% brokerage commission on transactions. The adjacent mortgage market encompasses referral
              fees and commission income from facilitating home loans, typically 0.5-1.5% of loan value. The proptech
              layer covers technology-enabled services including virtual tours, AI-powered recommendations, and digital
              transaction management. Status-quo substitutes include traditional offline brokers (who still control 80%+
              of transactions), direct developer sales teams, and bank-direct mortgage applications without
              intermediaries. The market boundary explicitly excludes commercial real estate advisory (Anarock's primary
              domain), pure-play rental classifieds (NoBroker's core), and construction/development activities.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM, SAM, and SOM Sizing
        blocks:
          - type: paragraph
            body: >-
              India's overall real estate market is valued at approximately $585 billion in 2026, with the residential
              segment at $438 billion. The proptech market specifically is projected at $1.3-1.8 billion in 2026,
              growing at a CAGR of 12-19% depending on methodology and scope. For Square Yards' TAM, we consider three
              lenses: (1) The brokerage commission pool on India's residential transactions — with approximately $130
              billion in annual residential transaction value and average brokerage rates of 2%, this yields a brokerage
              TAM of approximately $2.6 billion; (2) The mortgage facilitation opportunity — India's mortgage market is
              $540 billion with ~12% annual originations ($65 billion), and referral commissions of 0.5-1% yield a
              $325-650 million TAM; (3) The ancillary services layer (interiors, property management) adds another $500
              million-$1 billion. The SAM narrows to digitally addressable urban transactions in India's top 50 cities
              where Square Yards has presence, estimated at 40-50% of the national TAM. The SOM reflects Square Yards'
              current capture of Rs 13,236 crore in GTV (approximately $1.6 billion) against a total market of $130
              billion in residential transactions, implying roughly 1.2% market penetration by transaction volume.
            claimRefs:
