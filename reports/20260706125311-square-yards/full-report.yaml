        - $4.50B market cap
        - 7.9x
        - Another high-quality portal benchmark for scarcity value
        - Mature UK portal, not an agent-led or financing-heavy model
      - - Zillow
        - $2.69B TTM revenue
        - $7.65B market cap
        - 2.8x
        - Consumer property platform with broader services and lower portal purity
        - US housing cycle and product mix differ from India
      - - Compass
        - $6.96B TTM revenue
        - $9.47B market cap
        - 1.4x
        - Brokerage-heavy transaction platform benchmark
        - Lower-margin agent model compresses comp quality
      - - eXp World Holdings
        - $4.77B TTM revenue
        - $1.07B market cap
        - 0.2x
        - Shows downside range for agent-centric real-estate throughput models
        - Not a like-for-like tech + financing ecosystem
    notes: >-
      Public comp multiples use CompaniesMarketCap market cap and revenue pages. Square Yards multiple uses the FY26
      $223M revenue bridge reported by Economic Times and a practical current private valuation band rather than the
      literal >$1B floor alone.
    enumerationScope:
