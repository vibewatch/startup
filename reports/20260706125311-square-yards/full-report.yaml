  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Square Yards looks stronger in 2026 than it did a year earlier, but its residual risks are stacked rather
              than isolated. The company has real momentum: FY26 revenue reached Rs 2,086 crore, EBITDA improved to Rs
              176 crore, the June 2026 fundraise pushed valuation above $1 billion, and management is explicitly framing
              the next step as a Rs 2,000 crore IPO. Those same facts also concentrate timing risk. The brokerage-led
              model still sits on top of an Indian housing market that analysts expect to grow more slowly in FY26, with
              affordability strain, elevated prices, and inventory pressure building in the background. At the same
              time, Square Yards is not a narrow marketplace anymore; it now ties brokerage demand to mortgages,
              rentals, interiors, and property-management adjacencies, which means an operational or conduct issue in
              one node can travel into the flagship brand. The highest-severity risks are therefore a synchronized set:
              market cyclicality, state-by-state RERA and homebuyer-remedy complexity, lender-partner conduct risk at
              Urban Money, pre-IPO debt and diligence risk, founder concentration, and brand damage from uneven customer
              experiences.
