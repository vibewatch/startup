      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              MagicBricks, backed by the Times Group, is one of India's oldest and most recognized property portals with
              extensive listing databases and strong brand trust built over two decades. It monetizes through premium
              listings, advertising, and lead generation for developers. 99acres, a subsidiary of Info Edge (which also
              owns Naukri.com), commands the highest traffic among property search platforms with massive verified
              listing databases and detailed neighborhood analytics. Housing.com, now owned by Australia's REA Group,
              targets millennials and first-time buyers with a clean user interface, virtual tours, and AI-driven
              recommendations. NoBroker achieved unicorn status (~$1 billion valuation) by eliminating traditional
              brokers and enabling direct owner-to-buyer/tenant transactions, with particular strength in rentals and
              co-living. Anarock operates as an institutional real estate advisory focusing on developer consulting,
              capital markets advisory, and corporate transactions rather than retail brokerage. PropTiger combines
              digital tools with human advisory for end-to-end property transactions, particularly developer sales
              facilitation.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
