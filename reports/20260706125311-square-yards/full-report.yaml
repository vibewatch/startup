          unit: '%'
        - label: Current implied revenue multiple
          value: 4.5-4.9
          unit: x
        - label: IPO aspiration band
          value: 1500-2000
          unit: USD M
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV037
      - CV038
      - CV061
