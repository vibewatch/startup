      - number: '3.4'
        title: Market Share and Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              Precise market share data for India's fragmented proptech sector is difficult to establish given the
              dominance of offline transactions. By web traffic, 99acres and MagicBricks command the highest volumes
              among property portals. By revenue, Square Yards at Rs 2,086 crore in FY26 is among the largest, though
              direct comparison is complicated by different revenue models — listing portals report advertising revenue
              while Square Yards reports transaction-based brokerage income. NoBroker, the closest comparable as another
              proptech unicorn, is estimated to have significantly lower revenue but higher margins given its
              asset-light tech model. Anarock focuses on institutional transactions with higher per-deal values but
              lower volumes. The competitive landscape is consolidating as players expand into adjacent services —
              99acres into virtual tours, MagicBricks into data analytics, NoBroker into home services. Square Yards'
              response has been to deepen its full-stack model and pursue scale through geographic expansion and the
              planned IPO.
