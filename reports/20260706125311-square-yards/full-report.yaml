              from sales team compensation and developer incentive sharing. EBITDA was Rs 176 crore (8% margin), up from
              approximately Rs 47 crore (3% margin) in FY25, demonstrating 3.7x improvement and significant operating
              leverage. The cost structure is dominated by employee costs (estimated 60-65% of revenue) given the
              8,700-9,100 person workforce required for the brokerage model. Sales and marketing costs are elevated
              given high customer acquisition costs in a low-frequency purchase category. Technology and platform costs
              are a smaller but growing component as the company invests in AI, PropVR, and digital infrastructure. The
              gross-to-EBITDA gap of 15 percentage points (23% gross margin minus 8% EBITDA) reflects the overhead
              burden of a large sales organization. Working capital is manageable as commission revenue typically flows
              within 30-60 days of transaction closure, though developer payment cycles can extend to 90+ days in some
              cases.
