            body: >-
              Overall, Square Yards looks like a scaled operating platform with real product depth rather than a thin
              brokerage shell. It is now a unicorn after its June 2026 fundraise, reported FY26 revenue of Rs 2,086
              crore, and serves a large installed network across consumer, partner, and developer workflows; those facts
              raise the bar for what investors should expect from public technical disclosure. On the positive side, the
              company has corroborated evidence for AI usage, app distribution, immersive-content capability, mobile
              workflow tooling, and data-intelligence assets that can be reused across brokerage, lending, and B2B
              distribution. On the negative side, Square Yards still does not publicly disclose core engineering metrics
              such as service-level objectives, incident history, cloud resilience, model-governance controls,
