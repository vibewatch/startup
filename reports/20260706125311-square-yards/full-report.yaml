  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current pricing anchor and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Square Yards finally has a real public valuation anchor, but it is not a perfect one. The June 2026 round
              put Rs 900 crore (~$95 million) into the company and publicly moved the platform into the unicorn club at
              more than $1 billion. That matters because the prior late-2025 step-up to about $900 million had left the
              company close to, but not across, the symbolic threshold. It also matters because the round was anchored
              by institutional capital rather than purely by secondary-market gossip. Still, the financing mix
              complicates interpretation. Multiple outlets said the round was a blend of debt and equity, and some said
              it was roughly one-third equity and two-thirds debt. That means the headline valuation is usable as an
              anchor, but not yet as a clean all-equity comparable for public-market underwriting. The same coverage
              tied the raise directly to balance-sheet strengthening, refinancing, technology investment, and IPO
              preparation, which is rational for a company preparing a public listing but also underscores why entry
              discipline matters. At today’s private mark, the company looks defensible. At the marketed IPO band, the
              burden of proof rises materially.
