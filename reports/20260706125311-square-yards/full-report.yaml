  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation range (USD bn)
      - Probability signal
      - What must be true
    rows:
      - - Bull
        - >-
          FY27 growth stays above 40%, EBITDA margin moves above 12%, next financing cleans up the structure, and the
          IPO market rewards scaled consumer-tech issues.
        - 1.6-2.0
        - 20-25%
        - >-
          DRHP-grade disclosure, cleaner capital stack, and clear evidence that Square Yards deserves more than a
          brokerage multiple.
      - - Base
        - >-
          FY27 growth lands around 35-40%, EBITDA margin reaches 10-11%, and the 2026 IPO window is adequate but
          disciplined.
        - 1.2-1.5
        - 50-55%
        - Execution stays good enough for public markets to accept a fair but not euphoric valuation.
      - - Bear
        - >-
          IPO timing slips, growth drops below 30%, margin stalls below 9%, or debt/cap-table terms reduce
          equity-quality confidence.
        - 0.9-1.1
        - 20-30%
        - >-
          A weaker IPO tape or messy financing terms pull Square Yards back toward current private support rather than a
          premium rerating.
    notes: >-
      Scenario ranges are evidence-based underwriting bands, not management guidance. Probability signals are
      directional judgments from today’s public file.
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
      - CV051
      - CV052
      - CV053
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - IPO window weakens materially
        - Secondary-market volatility keeps launches muted into Square Yards’ target window
        - Premium multiple support falls first, even if operations remain decent
        - Move fair value toward current private support rather than IPO-band pricing
      - - Growth misses hard
        - FY27 revenue growth falls below 30%
        - Current private premium no longer looks like a fast-growth multiple
        - Re-underwrite to a Zillow/Compass-like comp band
      - - Margin progress stalls
        - EBITDA margin stays below 9% into IPO preparation
        - The business screens more like throughput than quality platform economics
        - Cut bull case and assume lower post-listing rerating potential
      - - Financing quality disappoints
        - Debt covenants, preferences, or dilution protections are more aggressive than expected
        - Headline unicorn mark loses value as a clean equity anchor
        - Treat current round as structured financing, not a public comp
      - - Disclosure remains thin
        - No DRHP-grade segment and cap-table detail before pricing talks intensify
        - The anti-thesis of opacity remains unresolved
        - Do not underwrite the IPO band; stay in track / research-more
    notes: >-
      These are thesis-break triggers, not generic operating risks. Each one directly changes the multiple the market
      can rationally pay.
    claimRefs:
      - CV020
      - CV023
      - CV028
      - CV029
      - CV030
      - CV043
      - CV047
      - CV051
      - CV057
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Debt/equity split and covenants
        - Executed term sheet, debt package, covenants, maturity profile, and allowed leverage
        - Determines whether the unicorn mark is a clean equity signal or partly a structured capital solution
        - CFO and counsel under NDA; financing document review
      - - Cap-table quality
        - Preference stack, anti-dilution rights, liquidation waterfall, and any secondary components
        - Without this, private valuation quality cannot be compared cleanly with public multiples
        - Finance team data room and board-approved cap table
      - - Segment economics
        - Revenue, gross margin, and EBITDA by brokerage, Urban Money, rentals, interiors, and other businesses
        - Needed to know whether Square Yards deserves a portal premium or a blended-service discount
        - Audited management pack or DRHP draft
      - - FY27 visibility
        - Booked pipeline, conversion assumptions, and current run-rate versus the 40%+ growth target
        - The IPO band only works if forward growth is both real and visible
        - Management forecast pack plus monthly run-rate bridge
      - - Public-listing readiness
        - DRHP timing, governance upgrades, and how management plans to present the hybrid funding history to investors
        - A good business can still price poorly if disclosure quality is not public-market ready
        - IPO counsel, merchant bankers, and readiness workplan
    notes: >-
      These asks are valuation-critical. Until they are answered, Square Yards should be treated as a credible company
      with an incomplete pricing file.
    claimRefs:
      - CV016
      - CV045
      - CV048
      - CV049
      - CV050
      - CV057
      - CV058
