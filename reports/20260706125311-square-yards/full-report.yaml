        title: Funding History and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Square Yards has raised approximately $208 million across 8 funding rounds since inception. The most
              significant was the June 2026 round of Rs 900 crore (~$95 million) combining equity and debt, anchored by
              EAAA Alternatives (the Edelweiss group's alternative investment arm) and global credit manager Muzinich &
              Co., which pushed the valuation above $1 billion and confirmed unicorn status. Prior to this, the November
              2025 Series C of $35 million was led by South Korea's Smilegate Investment at a $900 million pre-money
              valuation. Earlier rounds included $24.82 million in venture debt from ADM Capital in 2021, $20 million
              from Bennett Coleman (Times Group) in 2019, $12 million from Reliance Group Holdings in 2016, and $10
              million in convertible notes from Lohia Group in 2017. The company is now preparing for a Rs 2,000 crore
              (~$240 million) IPO targeted for calendar year 2026, with discussions ongoing to raise an additional
              $50-60 million in pre-IPO funding at a valuation as high as $1.6 billion. Investment bankers are being
              appointed and a DRHP filing is anticipated within FY27.
