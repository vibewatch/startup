              - CP021
              - CP022
      - number: '3.3'
        title: Competitive Differentiation and Moats
        blocks:
          - type: paragraph
            body: >-
              Square Yards' primary competitive advantage lies in its integrated revenue model that generates multiple
              fee events per customer — brokerage commission, mortgage referral fee, interior design project revenue,
              and property management fees. This contrasts sharply with single-revenue-stream competitors. The Urban
              Money mortgage platform with 150+ banking partners creates a significant distribution moat that pure
              listing portals lack. PropVR's 3D virtual tour technology provides differentiation in property discovery,
              particularly for NRI buyers who cannot easily visit properties. The company's scale of 8,700-9,100
              employees provides an on-ground presence that pure-play digital platforms cannot match in Tier 2-3 cities.
              Key vulnerabilities include the labor-intensity of the brokerage model (higher operating costs than
              listing portals), dependence on developer relationships for inventory access, and competition from
              NoBroker's zero-brokerage model which appeals to cost-conscious buyers. The moat assessment suggests
              moderate defensibility — the integrated model creates switching costs but each individual component faces
              dedicated competitors.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
              - CP017
              - CP018
              - CP019
