  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call moves from a real unicorn financing event through comp dispersion and capital-structure caveats to a
      disciplined track / research-more recommendation.
    data:
      nodes:
        - id: anchor
          label: Usable private anchor
          detail: June 2026 round >$1B
        - id: growth
          label: Business proof
          detail: 48% FY26 growth and positive EBITDA
        - id: comps
          label: Wide comp dispersion
          detail: 0.2x brokerages to 10x portals
        - id: structure
          label: Hybrid round caveat
          detail: Debt + equity muddies pure price discovery
        - id: decision
          label: Track / research-more
          detail: Fair now, stretched at IPO band
      edges:
        - from: anchor
          to: growth
          label: supported by
        - from: growth
          to: comps
          label: benchmarked against
        - from: comps
          to: structure
          label: tempered by
        - from: structure
          to: decision
          label: leads to
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV039
      - CV048
      - CV058
      - CV061
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Using the FY26 ~$223M revenue bridge, small changes in the justified revenue multiple create large changes in
      implied equity value.
    data:
      items:
        - label: 4x revenue
          value: 892
        - label: 5x revenue
          value: 1115
        - label: 6x revenue
          value: 1338
        - label: 7x revenue
          value: 1561
        - label: 8x revenue
          value: 1784
      yAxis:
        label: Implied valuation (USD M)
    approximationNotes: >-
      Implied valuations are simple multiple × FY26 revenue calculations using the ~$223M revenue bridge reported by
      Economic Times.
    claimRefs:
      - CV007
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The widest value-creation move remains the rerating from the current private mark into a viable IPO band; upside
      narrows beyond that.
    data:
      items:
        - label: Bear case
          low: 900
          high: 1100
          unit: USD M
        - label: Current private anchor
          low: 1000
          high: 1100
          unit: USD M
        - label: Base IPO-ready range
          low: 1200
          high: 1500
          unit: USD M
        - label: Bull / IPO stretch range
          low: 1600
          high: 2000
          unit: USD M
    approximationNotes: >-
      Ranges combine public round facts, FY26 revenue, FY27 execution thresholds, and 2026 IPO-market discipline rather
      than management guidance.
    claimRefs:
      - CV037
      - CV038
      - CV051
      - CV052
      - CV053
      - CV054
