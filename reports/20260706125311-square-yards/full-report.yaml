            body: >-
              Square Yards raised Rs 900 crore (~$95 million) in June 2026, combining equity and debt (approximately
              one-third equity, two-thirds debt). Total capital raised across all rounds is approximately $208 million.
              The current valuation exceeds $1 billion. With positive EBITDA of Rs 176 crore in FY26, the company is
              self-sustaining operationally but is raising additional capital for expansion and IPO preparation. The
              company is in discussions to raise an additional $50-60 million pre-IPO at up to $1.6 billion valuation.
              The debt component of recent raises introduces covenant obligations and repayment schedules that are not
              publicly disclosed. A Rs 2,000 crore IPO is planned for CY2026, which would significantly enhance the
              capital base. Capital deployment priorities include technology investment, geographic expansion, balance
