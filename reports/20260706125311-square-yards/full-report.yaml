chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Square Yards was founded in 2014 in Gurugram (Gurgaon), Haryana, India, by Tanuj Shori and Kanika Gupta
              Shori. The company was born out of the founders' personal frustration with the fragmented and opaque
              Indian real estate market while working as NRIs in Hong Kong. Tanuj Shori brought investment banking
              experience from Standard Chartered, Lehman Brothers, and Nomura, while Kanika Gupta Shori had a wealth
              management and strategy background with credentials from Delhi University and Wharton. The company
              operates as India's largest integrated proptech platform, combining real estate brokerage (Square Yards),
              mortgage facilitation (Urban Money), rental management (Azuro), interior design (Interior Company), and
              virtual property viewing (PropVR) into a single ecosystem. The business model generates revenue primarily
              through brokerage commissions on primary residential sales, mortgage referral fees from 150+ banking and
              NBFC partners, and fees from ancillary services. The company has expanded from its initial NRI-focused
              Gulf operations to a pan-India presence across 30+ cities, with international offices in UAE, Australia,
              and Canada, operating across 9 countries and 100+ cities globally.
