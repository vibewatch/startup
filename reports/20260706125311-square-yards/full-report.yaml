      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The Square Yards ecosystem serves multiple buyer personas with distinct purchase behaviors. The primary
              residential buyer (first-time homebuyer in the Rs 50 lakh-Rs 2 crore range) represents the volume driver,
              particularly in Tier 1 and emerging Tier 2 cities. The NRI investor segment, which was Square Yards'
              original focus, provides higher transaction values but lower volume. The premium/luxury buyer (Rs 2
              crore+) is growing fastest at 30% YoY in Q1 2026. On the payer side, real estate developers are the
              primary commission source for brokerage services, paying Square Yards for customer acquisition and sales
              facilitation. Banks and NBFCs pay referral fees to Urban Money for mortgage leads. End consumers pay for
              ancillary services (interior design, property management). Budget ownership sits with developer marketing
              teams for brokerage commissions and with bank retail lending divisions for mortgage referrals. The
              adoption trigger for digital platforms is typically a major life event (marriage, job relocation, family
              expansion) combined with increasing comfort with online property discovery accelerated by COVID-era
              behavioral shifts.
