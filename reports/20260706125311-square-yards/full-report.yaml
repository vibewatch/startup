  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              India's proptech competitive landscape comprises three distinct tiers: pure-play listing portals (99acres,
              MagicBricks, Housing.com), full-stack transaction platforms (Square Yards, NoBroker, PropTiger), and
              institutional advisory firms (Anarock). Out of 30+ major proptech players, only a handful operate
              profitably as of 2026. The market is structurally fragmented with no single player commanding more than 5%
              of total residential transaction volume. Square Yards differentiates through vertical integration across
              the property lifecycle — from discovery and virtual tours through transaction, financing, interiors, and
              rental management. This contrasts with listing portals that monetize through advertising and lead
              generation without participating in transactions, and with NoBroker's broker-elimination model focused on
              direct owner-tenant/buyer connections. The competitive dynamics are evolving rapidly as all major players
              invest in AI, automation, and service expansion to capture greater share of the property value chain.
              Competitive intensity has increased significantly since 2023 as multiple platforms pursue unicorn status
              and IPO readiness simultaneously, driving heavy investment in technology, branding, and talent acquisition
              across the sector.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
