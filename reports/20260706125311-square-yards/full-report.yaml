    type: journey-map
    layout: wide
    summary: >-
      How Square Yards moves customers from discovery into financing and post-sale monetisation across homebuyers, NRIs,
      developers, and lenders.
    data:
      nodes:
        - id: n1
          label: Search & discovery
        - id: n2
          label: Broker / developer assisted evaluation
        - id: n3
          label: Booking & transaction support
        - id: n4
          label: Home-loan matching via Urban Money
        - id: n5
          label: Interiors / rentals / property management
        - id: n6
          label: Post-sale service and repeat monetisation
    approximationNotes: >-
      This figure is structural. It maps the publicly visible customer path but does not imply disclosed conversion
      rates between steps.
    claimRefs:
      - CU001
      - CU002
      - CU009
      - CU011
      - CU023
      - CU025
      - CU035
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      Publicly visible adoption surfaces show that Square Yards scales through web traffic, assisted acquisition,
      partner workflows, and post-sale attachments rather than app installs alone.
    data:
      nodes:
        - id: a1
          label: 8mn+ monthly traffic
        - id: a2
          label: Broker / developer consultation
        - id: a3
          label: 2,73,643 FY26 customer acquisitions
        - id: a4
          label: 55% attached-service journeys
        - id: a5
          label: Urban Money loan workflow
        - id: a6
          label: Rentals / interiors / management
      edges:
        - from: a1
          to: a2
          label: assisted sales and inventory discovery
        - from: a2
          to: a3
          label: booking / acquisition
        - from: a3
          to: a4
          label: cross-sell attachment
        - from: a3
          to: a5
          label: loan match and disbursal
        - from: a4
          to: a6
          label: post-sale monetisation
        - from: a5
          to: a6
          label: repeat service ecosystem
    approximationNotes: >-
      The chart is a deployment flow, not a true conversion funnel. Public sources disclose stage magnitudes unevenly,
      so the exhibit emphasises sequence and dependency rather than exact drop-off rates.
    claimRefs:
      - CU004
      - CU005
      - CU010
      - CU011
      - CU015
      - CU016
      - CU024
      - CU026
      - CU034
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Public customer proof is strongest for workflow existence and weakest for retained-cohort economics.
    data:
      columns:
        - Deployment maturity
        - Outcome specificity
        - Retention visibility
      rows:
        - label: Square Connect realtors
          values:
            - Production
            - Active daily network disclosed
            - Low — no churn or revenue per realtor
        - label: Urban Money partners
          values:
            - Production
            - Real-time cases and earnings workflow
            - Low-Medium — no partner retention curve
        - label: Tier-2 / 3 borrowers
          values:
            - Production
            - 64% demand share and ~81% YoY growth disclosed
            - Low — no vintage or repeat-borrow data
        - label: Square Yards app users
          values:
            - Production
            - Downloads, reviews, and rating are public
            - Low — no MAU or booking conversion
        - label: Complaint / review forums
          values:
            - Production usage implied
            - Post-sale issues are concrete
            - Low — complaint surfaces do not quantify cohort size
    approximationNotes: >-
      Proof quality varies by surface. Workflow tools and app stores prove usage, while complaint forums prove service
      interaction; none of the rows provides full contract-value or retention economics.
    claimRefs:
      - CU016
      - CU017
      - CU010
      - CU018
      - CU019
      - CU021
      - CU036
      - CU038
      - CU039
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: >-
      Proxy view of repeat-value visibility using only publicly disclosed expansion signals; Square Yards does not
      publish true time-series retention cohorts.
    data:
      columns:
        - Month 1
        - Month 3
        - Month 6
        - Month 12
      rows:
        - id: public-proxy
          label: FY26 acquisition cohort (proxy)
          values:
            - '55'
            - '55'
            - '1.0'
            - '0.7'
    approximationNotes: >-
      The company does not disclose actual retained-customer cohorts. Month 1 and Month 3 are anchored to the official
      55% attachment-rate disclosure because no time split is public; Month 6 and Month 12 use disclosed
      rental-transaction and designed-home volumes as lower-bound late-journey touchpoints relative to FY26
      acquisitions. Treat this as a visibility proxy, not a true retention curve.
    claimRefs:
      - CU023
      - CU028
      - CU029
      - CU040
      - CU042
      - CU043
  - id: FR001
    title: 'Risk heatmap: likelihood vs residual severity'
    type: matrix
    layout: standard
    summary: Maps Square Yards’ major public risks by assessed likelihood and residual severity after visible mitigations.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Severity
          values:
            - IPO execution / documentation failure
            - Founder or governance gap
            - Housing-cycle downturn plus debt pressure
        - label: High Severity
          values:
            - State-RERA / forum-selection friction
            - Lender-partner conduct or digital-lending breach
            - NoBroker-led take-rate compression
        - label: Medium Severity
          values:
            - Complaint cluster without systemic proof
            - Cross-brand service-quality inconsistency
            - Developer completion delays hitting conversions
    approximationNotes: >-
      Likelihood and severity are qualitative assessments based on disclosed market, regulatory, and review evidence;
      they are not probability estimates.
    claimRefs:
      - CR010
      - CR011
      - CR019
      - CR024
      - CR026
      - CR029
      - CR034
      - CR040
      - CR042
      - CR045
  - id: FR002
    title: 'Risk transmission map: how primary risks flow into revenue, financing, and valuation'
    type: dag
    layout: wide
    summary: >-
      Shows how market, legal, and financing risks can cascade from individual nodes into bookings, margins, liquidity,
      and IPO outcomes.
    data:
      nodes:
        - id: market-slowdown
          label: Housing Slowdown / Affordability Stress
        - id: developer-delay
          label: Developer Delay / Inventory Imbalance
        - id: rera-friction
          label: RERA / Forum Complexity
        - id: lsp-risk
          label: LSP / Lender Conduct Risk
        - id: complaints
          label: Complaint / Refund Cluster
        - id: bookings
          label: Booking Conversion Pressure
        - id: margin
          label: Margin / Take-Rate Pressure
        - id: liquidity
          label: Liquidity / Covenant Pressure
        - id: ipo-delay
          label: IPO Delay / Diligence Slippage
        - id: valuation
          label: Valuation Compression
      edges:
        - to: bookings
          from: market-slowdown
        - to: bookings
          from: developer-delay
        - to: bookings
          from: rera-friction
        - to: complaints
          from: lsp-risk
        - to: margin
          from: complaints
        - to: margin
          from: bookings
        - to: liquidity
          from: margin
        - to: ipo-delay
          from: liquidity
        - to: ipo-delay
          from: rera-friction
        - to: valuation
          from: ipo-delay
        - to: valuation
          from: margin
    claimRefs:
