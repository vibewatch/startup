  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated Product Stack and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Founded in Gurugram in 2014 by Tanuj Shori and Kanika Gupta Shori, Square Yards now presents itself as
              India’s largest integrated real-estate and mortgage platform, with operations across 100+ cities and 9
              countries. The product surface is materially broader than a listings portal: the main Square Yards app
              combines verified property search, locality intelligence, price trends, virtual tours, legal support, and
              financing handoff; Urban Money layers in loan discovery and partner workflows; Azuro covers rental
              management; Interior Company covers furnishing and design; and data-intelligence tools expose market-rate,
              transaction, and developer ranking views. Public app and website evidence suggests the company is trying
              to collapse what is normally a fragmented buyer journey—search, evaluation, visit planning, finance,
              paperwork, post-sale tracking—into a single operating system. That breadth matters strategically because
              Square Yards monetises the transaction, not only the lead, and can use the same platform to cross-sell
              adjacent services once a user enters the funnel. The strongest public proof is not just brand architecture
              on the website; it is the way mobile listings, app-store descriptions, partner tools, and data surfaces
              consistently point to one interconnected workflow rather than disconnected point products.
