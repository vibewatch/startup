      - number: '4.3'
        title: Unit Economics and GTM Efficiency
        blocks:
          - type: paragraph
            body: >-
              With 2,73,643 customer acquisitions in FY26 and revenue of Rs 2,086 crore, the average revenue per
              customer acquisition is approximately Rs 76,000 (~$900). For real estate transactions worth Rs 13,236
              crore facilitated, the implied take rate is approximately 15.8% of GTV (inflated by inclusion of mortgage
              and other revenue). The pure brokerage take rate on primary transactions is estimated at 2-3% based on
              industry standards. Sales cycle is moderate — property discovery to booking typically takes 30-90 days for
              primary residential. The 8,700-9,100 employee base implies revenue per employee of approximately Rs 23-24
              lakh (~$27,000), which is below technology company benchmarks but consistent with brokerage/advisory
              models. Customer acquisition cost (CAC) data is not publicly disclosed but is estimated to be significant
              given the workforce size and marketing spend required. The FY27 guidance of 40%+ revenue growth with
              double-digit EBITDA margins suggests continued operating leverage as fixed costs are distributed over
              growing transaction volumes.
