      - number: '7.3'
        title: Market, competition, and reputation risk
        blocks:
          - type: paragraph
            body: >-
              The core commercial risk is cyclical sensitivity layered onto converging competition. Sector researchers
              and reporters are all describing some version of the same setup: unit sales may hold up, but FY26 growth
              is expected to slow, affordability is under strain, and developers can still hurt downstream
              intermediaries when launches outrun construction or when inventory and collections drift out of sync. That
              matters for Square Yards because its monetization still begins with property transactions, even if it
              cross-sells other services later. Competition is also no longer just portal-versus-portal. NoBroker’s
              official site still leads with zero brokerage, but its own public positioning now extends into financial
              products and home services, while Square Yards pitches an integrated ownership journey through Urban
              Money, interiors, rentals, and property management. Functional overlap has therefore widened. Reputation
              risk is mixed rather than one-directional: Justdial still shows a large rating base and some positive
              service feedback, yet PissedConsumer and ComplaintLists show recurring allegations around refunds,
              possession expectations, pricing changes, and interior-work experiences. The diligence implication is that
              anecdotal complaints cannot be ignored, but they also cannot be sized correctly without company-side
              resolution data.
