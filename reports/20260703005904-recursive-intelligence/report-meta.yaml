companyProfile:
  summary: >-
    Recursive Intelligence, publicly styled Ricursive Intelligence, is a Palo Alto frontier AI lab
    founded by Anna Goldie and Azalia Mirhoseini to automate and compress semiconductor design
    cycles. The company’s pitch is a shift from fabless to “designless” custom silicon: customers
    provide workload requirements and the platform increasingly handles architecture, physical
    design, verification, and eventual manufacturing handoff. That thesis draws real credibility
    from the founders’ AlphaChip lineage and blue-chip investors, but the public package is still
    early—strong on technical ambition and funding proof, weak on disclosed revenue, customer
    traction, and operating controls.
  foundedDate: '2025-01-01'
  founders:
    - name: Anna Goldie
      role: Co-founder & CEO
      background: Former Google Brain and Anthropic researcher publicly identified as one of the AlphaChip creators and Ricursive's chief executive.
      claimRefs: [CO009, CO011, CO012]
    - name: Azalia Mirhoseini
      role: Co-founder & CTO
      background: Former Google Brain and Anthropic researcher publicly identified as AlphaChip co-creator and Ricursive's technical co-founder.
      claimRefs: [CO010, CO011, CO012]
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California, USA
  productSummary: AI-powered chip-design software and services intended to move from stage-specific design acceleration toward workload-to-GDSII semiconductor automation.
  customerFocus: Hyperscalers, frontier model labs, semiconductor companies, and other workload owners seeking custom silicon without building a full internal chip-design organization.
  businessModel: Enterprise software plus high-touch design engagements, with future platformization around AI-driven design automation.
  stage: Series A (private)
  fundingStatus: $35M seed at launch in December 2025 followed by a $300M Series A at a $4B valuation in January 2026, for $335M total disclosed funding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO007, CO008, CO009, CO010, CO015, CO016, CO017]
