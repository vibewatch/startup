  topStrengths:
    - Rare founder-market fit from the team behind AlphaChip and multiple follow-on chip-design research programs.
    - "Large and strategically important market problem: chip design remains slow, expensive, and talent constrained."
    - Unusually strong capital base and investor syndicate for a company this early in its commercialization cycle.
  topRisks:
    - No public revenue, ARR, gross margin, or named paying customer evidence currently supports the $4B valuation.
    - Incumbents such as Synopsys, Cadence, and Siemens already ship AI-assisted EDA into production customer workflows.
    - Trust, privacy, security, and quality-control disclosures for sensitive customer design data remain thin.
    - Cap-table economics, governance rights, and downside protection terms of the Series A are undisclosed.
  unresolvedGaps:
    - Exact legal name, incorporation record, and definitive branding across Recursive, Ricursive, and homepage typo variants.
    - Named customer deployments, tape-outs, and post-silicon benchmark results for Ricursive-designed outputs.
    - Revenue model, pricing, gross margin, burn, runway, and next-round trigger metrics.
    - Board composition, liquidation preferences, and manufacturing/signoff partner details.
