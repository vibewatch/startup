- id: differentiation-and-moat
  title: Differentiation, IP, and Operating Moat
  body: 'Ricursive''s clearest differentiation is scope. Incumbent AI-EDA offerings from Synopsys, Cadence, and Siemens are marketed as ways to optimize or orchestrate existing design flows; Ricursive is marketing a future in which the customer describes a workload and receives a manufacturable design outcome. That positioning could be strategically meaningful because chip design cycles are still measured in years and large labor budgets, while even best-in-class commercial tools largely optimize within a traditional toolchain. A second moat component is founder and data lineage: the team can point to AlphaChip, open-sourced circuit-training assets, and award-winning follow-on research as proof that they understand both the learning problem and the physical-design constraints. A third is operating-model know-how around co-designing models and hardware for specific workloads rather than selling off-the-shelf accelerators. However, the moat is still more promissory than proven in public. Ricursive
    has not publicly disclosed a patent estate, customer lock-in metrics, proprietary dataset scale, or durable supply agreements, so diligence should treat the moat as technically credible but commercially unproven.'
