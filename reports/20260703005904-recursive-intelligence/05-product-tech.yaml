- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: 'Public disclosures point to an operating model that layers proven research primitives under a broader end-to-end ambition. Ricursive''s technical credibility starts with AlphaChip: Goldie and Mirhoseini helped build a reinforcement-learning floorplanning system that Google DeepMind says uses an edge-based graph neural network, places components sequentially on a grid, and has been used on production TPU generations and external chip programs. Ricursive''s own platform then appears to extend that lineage in two directions. First, Phase I focuses on stage accelerators across the existing flow, including timing analysis and PPA-driven optimization from architecture design through physical signoff. Second, the company says Phase II will combine stages into a workload-to-GDSII model, meaning the customer interface becomes a workload description while the back end handles architecture exploration, layout, verification, and manufacturing handoff. This is a much broader system boundary
    than Synopsys DSO.ai, Cadence Cerebrus, or Siemens Solido, which are all described as AI-enhanced layers inside established EDA flows. The main caveat is that Ricursive has not publicly documented the exact internal model boundaries, human-review checkpoints, or signoff chain for this end-to-end stack.'
