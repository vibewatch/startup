- id: trust-security-and-quality-controls
  title: Trust, Safety, Security, Privacy, Compliance, and Quality Controls
  body: This is the weakest publicly documented part of the Ricursive story. Industry sources on agentic EDA consistently stress human-supervised workflows, trusted toolchains, auditability, and quality controls because chip-design errors propagate directly into expensive fabrication risk. Ricursive's public materials, by contrast, do not yet expose a trust center, privacy notice tailored to sensitive customer IP, security architecture, certification list, data-retention policy, model-governance description, or post-silicon quality framework. The closest public signal is the Ashby board, which lists a Founding Security Engineer alongside EDA and infrastructure roles. That is positive insofar as it suggests the company knows security must be built in early, but it also indicates the control plane is still being staffed rather than already evidenced through mature public artifacts. Because Ricursive's value proposition requires customers to share high-value workloads and possibly pre-silicon
    design intent, the absence of public trust documentation is not cosmetic; it is a real diligence blocker that should be closed before a risk-sensitive customer or investor underwrites broad deployment.
  claimRefs:
