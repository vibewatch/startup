  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: A public or shareable trust packet covering security architecture, privacy handling, model governance, and compliance controls.
    whyItMatters: Ricursive needs customers to share valuable workloads and potentially pre-silicon design intent, so undocumented controls create adoption and diligence friction.
    diligencePath: Request a security questionnaire, data-flow diagram, privacy policy for customer design data, and any SOC 2 / ISO / internal audit evidence.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: foundry-and-supply-access
    missingEvidence: Named foundry, packaging, test, and export-control processes that support the workload-to-GDSII and delivery thesis.
    whyItMatters: A designless promise is only valuable if Ricursive can convert designs into real tape-outs through reliable manufacturing channels.
    diligencePath: Request partner names, draft statements of work, process-node targets, and the manufacturing/signoff chain for an example customer program.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
    - TE005
  - type: private-evidence-only
    severity: material
    topic: customer-deployment-proof
    missingEvidence: Named customers, stage of engagement, tape-out status, and any post-silicon or benchmark results for Ricursive-designed outputs.
    whyItMatters: Without customer proof, investors cannot tell whether Ricursive has moved beyond compelling research and hiring into repeatable commercial execution.
    diligencePath: Request a pipeline table with customer names redacted if needed, milestones, tape-out dates, and benchmark summaries for at least two active programs.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: minor
    topic: support-sla
    missingEvidence: Customer support model, SLA terms, escalation paths, pricing format, and implementation playbooks.
    whyItMatters: High-touch product delivery can succeed, but buyers need to know whether Ricursive can support complex programs after the initial design engagement.
    diligencePath: Request onboarding materials, support staffing ratios, service tiers, and example implementation timelines.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: material
    topic: module-map-coverage
    missingEvidence: A fuller public breakdown of product modules, benchmarks, APIs, or docs for each step in the Ricursive design stack.
    whyItMatters: Current public evidence is enough to describe the operating thesis, but not enough to underwrite module maturity or exact technical boundaries.
    diligencePath: Request a product brief, architecture deck, and benchmark pack that maps each claimed capability to a specific tool or model component.
    relatedQuestionRefs:
