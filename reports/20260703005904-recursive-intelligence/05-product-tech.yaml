  rows:
  - - AI lab / chip team needs workload-specific silicon
    - Traditional custom-chip programs require large expert teams and year-plus cycles
    - Engagement-led AI chip-design platform from workload definition toward implementation
    - Faster path to custom silicon for scaled workloads
    - No public proof yet of recurring packaged offering or tape-out cadence
  - - Hyperscaler or chipmaker wants faster architecture-to-layout iteration
    - Physical design and verification loops are slow and labor intensive
    - Phase I stage accelerators across architecture, timing, PPA, and signoff-adjacent tasks
    - Shorter iteration loops and more design-space exploration
    - Public benchmark pack is limited and largely management-described
  - - Company lacks in-house chip experts but serves large algorithms
    - Off-the-shelf chips may be suboptimal for specialized workloads
    - Designless model where Ricursive performs design work for customers
    - Custom chips without standing up a full chip team
    - Foundry, support, and commercial packaging remain opaque
  - - Research or infrastructure team wants better chip/layout primitives
    - Manual floorplanning and placement remain hard to automate
    - AlphaChip-derived RL and graph-model lineage applied to design subproblems
    - Hours instead of weeks or months on selected placement tasks
    - Lineage is proven; Ricursive-specific platform breadth is not yet independently verified
  - - Enterprise buyer evaluates trusted deployment
    - Need to share sensitive workload and design intent with a vendor
    - Security, support, and governance workstreams are implied by hiring
    - Potential future audited operating model
    - No public trust center, SLA, or certification packet was visible
