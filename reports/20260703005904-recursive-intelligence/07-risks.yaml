  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named paying customers, production deployments, and partner-by-partner conversion evidence for Ricursive itself.
    whyItMatters: Without direct customer proof, investors cannot tell whether the current valuation reflects a real commercial wedge or only founder-quality optionality.
    diligencePath: Request anonymized or named design-partner list, stage of engagement, paid-vs-unpaid status, and one full pilot-to-production case study.
    relatedQuestionRefs:
    - QR006
    - QR022
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: Customer contract package covering IP ownership, indemnity, support-access controls, data retention, and any DPA or SLA commitments.
    whyItMatters: Chip-design customers care about sensitive IP, liability allocation, and secure access boundaries; public silence here leaves a real legal and sales-friction blind spot.
    diligencePath: Obtain current MSA/SOW templates, security addendum, incident-response commitments, and any export-control clauses for cross-border support.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: compute-burn
    missingEvidence: Runway, compute-spend profile, hosting architecture, and expected gross-margin bridge from research workload to commercial deployments.
    whyItMatters: The public story acknowledges significant infrastructure ambition but does not show whether the funding base supports the time needed for customer qualification.
    diligencePath: Request monthly compute spend, committed infrastructure obligations, hiring plan, runway case, and scenario sensitivity to delayed revenue.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: export-controlled-pipeline
    missingEvidence: Company-specific view of customer geography, parent-entity screening, and whether any pilot or hosted workflow triggers BIS licensing or remote-access controls.
    whyItMatters: Regulatory burden matters only if it touches the real pipeline, but that pipeline geography is not public.
    diligencePath: Review CRM geography, beneficial-owner checks, product classifications, and any counsel memo on D:5/Macau exposure for sales and support.
    relatedQuestionRefs:
    - QR018
    - QR019
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: benchmark-pack
    missingEvidence: Independent benchmark pack showing where Ricursive improves cycle time, quality, or verification outcomes versus incumbent or human baselines and where humans remain in the loop.
    whyItMatters: The thesis depends on trusted workflow insertion, not on a broad claim that AI can help somewhere in chip design.
    diligencePath: Request customer-approved benchmark studies, failure analyses, and a reference architecture showing verification responsibility by workflow stage.
    relatedQuestionRefs:
    - QR013
    - QR023
    - QR030
    relatedTableRefs:
    - TR003
    - TR007
