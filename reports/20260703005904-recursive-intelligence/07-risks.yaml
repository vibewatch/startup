- id: TR007
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Commercial proof gap
    - Named paying production partner evidence
    - Next financing or major valuation event still arrives without named design wins, benchmark pack, or deployment references
    - Re-underwrite Ricursive as a research asset rather than a commercially proven platform.
  - - Verification / reliability risk
    - Signoff-grade benchmark disclosure
    - Management cannot show where Ricursive beats or safely augments incumbent flows and where human verification still owns outcomes
    - Cut conversion assumptions and treat full-stack automation claims as unproven.
  - - Export-control exposure
    - Pipeline or support workflow hits D:5 / Macau screening complexity
    - Meaningful account activity depends on entities or remote users that require licenses or special controls Ricursive cannot evidence
    - Require formal export-control architecture before supporting additional global expansion.
  - - Incumbent displacement pressure
    - Buyer chooses incumbent AI flow instead of Ricursive
    - Repeated losses to Synopsys, Cadence, or Siemens extensions in comparable workflows
    - Lower TAM and pricing-power assumptions materially.
  - - Compute burn and runway
    - Infrastructure expansion outruns qualification progress
    - Emergency fundraise, visible spend spike, or no credible burn-to-revenue bridge after infrastructure scaling
    - Increase required return and shorten willingness to fund ahead of proof.
  - - Execution breadth
    - Founder departure or hiring stall in verification/commercial leadership
    - Key technical or operational seats stay unfilled or a founder reduces active operating role
    - Pause until leadership depth and process ownership are demonstrably broader.
  notes: These kill criteria are event-driven and externally monitorable; they focus on signals that would change underwriting, not on generic startup uncertainty.
