- id: dependency-and-market-structure-risk
  title: Incumbent EDA platforms, foundry-qualified flows, and concentrated buyers create structural dependency risk
  body: 'Ricursive is entering a market that is large but structurally concentrated. Independent market work says the AI EDA and broader EDA stack is already dominated by a handful of vendors, while official product pages show those same vendors shipping reinforcement-learning, agentic, and verification-centric automation across much of the design flow. That matters because Ricursive does not only need interest; it needs workflow insertion against entrenched systems that already own signoff, foundry qualification, and many customer relationships. The buyer side is concentrated too. Public semiconductor analysis says hyperscalers and major chipmakers are developing their own ASICs and care deeply about sovereignty, making them attractive but demanding accounts. Dependency risk is therefore two-sided: upstream on incumbent tools and qualified flows, and downstream on a small set of highly sophisticated customers that can build internally or wait. This makes the commercial bar higher than in
    ordinary enterprise software, because Ricursive has to win inside ecosystems that are already buying bundled AI from trusted vendors.'
