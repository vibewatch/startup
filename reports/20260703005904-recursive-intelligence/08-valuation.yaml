- id: TV007
  title: Financing / valuation context table
  columns:
  - Dimension
  - Current public evidence
  - Implication for entry discipline
  rows:
  - - Seed anchor
    - 'Dec 2025 seed: $35M at roughly a $750M valuation'
    - Series A price should be judged relative to a 5.3x step-up in less than two months.
  - - Series A headline
    - 'Jan 2026 round: $300M at a $4.0B post-money valuation'
    - This is the live market-clearing mark, but it is still a narrative-heavy one.
  - - Implied pre-money / dilution
    - About $3.7B pre-money and ~7.5% new-money dilution
    - The round reset price expectations far more than it de-risked the business.
  - - Total disclosed capital
    - $335M raised across seed and Series A
    - Capital suffices for hiring and compute buildout, but not for public proof of monetization.
  - - Public operating support
    - No public revenue, ARR, gross margin, customer count, or pricing disclosure
    - Do not pay above the last round on public evidence alone.
  - - Preference / governance overhang
    - Preferences, board rights, ratchets, and side letters are not publicly disclosed
    - Headline valuation may overstate common-equity attractiveness.
  - - Recommended entry discipline
    - Only re-underwrite at or above $4B after customer, benchmark, and cap-table diligence clears
    - Absent those milestones, use the last round as a watch level rather than as a chase price.
  notes: Uses headline financing math and disclosure gaps to convert the last round into a practical entry-discipline framework.
