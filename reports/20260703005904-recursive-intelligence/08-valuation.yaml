    - Next financing needs to reprice around evidence rather than scarcity.
  - - Base
    - 50%
    - $3.75B-$4.75B
    - 0.9x-1.2x
    - The company converts investor enthusiasm into early programs but still lacks full operating disclosure.
    - Commercial proof arrives slower than the hiring and compute-spend ramp.
  - - Bull
    - 20%
    - $6.0B-$8.0B
    - 1.5x-2.0x
