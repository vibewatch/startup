    - Incumbents match the feature set before Ricursive scales revenue.
  - - Probability-weighted center
    - 100%
    - ~$4.0B-$4.2B
    - ~1.0x
    - The current round is roughly defendable only if the base case begins to materialize over the next 12-18 months.
    - Absent milestones, the weighted center drifts below the last mark.
  notes: Ranges are analyst scenario frames, not company guidance; they preserve uncertainty because Ricursive has not disclosed revenue or margin inputs.
