    - January 2026 $4B post-money Series A
    - Use the last round as the ceiling for entry discipline, not as proved intrinsic value.
  - - Upgrade trigger
    - Named paying customers plus benchmarked design wins
    - Would improve confidence that price is supported by real demand rather than scarcity alone.
  - - Primary downside trigger
    - No revenue proof or weak benchmark data by next financing
    - Would increase the odds of narrative compression or a flat/down follow-on round.
