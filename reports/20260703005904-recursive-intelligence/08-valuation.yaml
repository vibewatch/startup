  - - Risk rating
    - High
    - Execution, commercialization, and price-support risk remain substantial.
  - - Valuation stance
    - Stretched
    - The $4B mark prices future success more than disclosed current performance.
  - - Target return discipline
    - Not yet supportable at headline price
    - A >2x gross case likely needs a lower effective entry, term protection, or exceptional new milestones.
