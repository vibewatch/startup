- id: TI005
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Evidence quality
  - Financing implication
  - Diligence ask
  rows:
  - - Total disclosed capital raised
    - $335M
    - Defines the outer public capital cushion today
    - High
    - Strong by startup standards, but insufficient alone to infer runway
    - Provide post-close cash bridge and current unrestricted cash
  - - Seed financing
    - $35M at a $750M valuation in early Dec. 2025
    - Shows how quickly investor appetite formed before Series A
    - Medium
    - Implies valuation acceleration preceded broad public commercial proof
    - Provide exact seed close date, cap table, and any secondaries
  - - Series A financing
    - $300M at a $4B post-money valuation in Jan. 2026
    - Largest hard public financing fact and current valuation anchor
    - High
    - Reduces near-term solvency concern but not commercialization risk
    - Provide board materials on use of proceeds and cash targets
  - - Official use of proceeds
    - Scale research / engineering team and significantly expand compute infrastructure
    - Clarifies that capital is funding R&D and platform buildout
    - High
    - Suggests capital need is tied to productization and compute, not just GTM expansion
    - Provide spend plan by hiring, compute, tooling, and customer delivery
  - - Cash on hand
    - Undisclosed publicly
    - Core input for runway and downside durability
    - High on absence, low on value
    - Cannot test liquidity or months of runway
    - Provide latest cash, restricted cash, and committed cloud / compute obligations
  - - Burn and runway
    - Undisclosed publicly
    - Necessary for dilution timing and financing dependency
    - High on absence, low on value
    - Next-round timing cannot be underwritten
    - Provide gross burn, net burn, and runway under base / downside cases
  - - Debt / project finance / leases
    - No public schedule identified
    - Leverage could materially alter enterprise value and downside risk
    - Medium on absence
    - Could mean clean balance sheet or simply undisclosed obligations
    - Provide debt, lease, supplier-finance, and covenant schedule
  - - Next-round trigger
    - Not publicly disclosed; likely linked to productization milestones, compute expansion, or slower commercial conversion
    - Explains whether the current round is bridge capital or long-duration capital
    - Low-medium
    - Dilution trigger cannot be forecast from public evidence
    - Provide board-defined minimum cash policy and financing trigger thresholds
  notes: This table focuses on forward capital adequacy rather than repeating narrative funding chronology. Null-like entries are real disclosure gaps, not placeholders for easy public lookup.
