tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Likely unit
  - Current public status
  - Revenue-quality read
  - Diligence ask
  rows:
  - - Core design platform
    - Enterprise software platform for AI-driven chip design and optimization
    - Platform license or annual contract
    - Platform is public; monetization form undisclosed
    - Potentially high if embedded in customer design workflows, but current contract model is unknown
    - Provide standard MSA, pricing schedule, and first live paid deployments
  - - Design-partner engagement
    - High-touch pilot or co-development work with early semiconductor customers
    - Pilot statement of work or milestone contract
    - Development-partner motion is public; no contract values disclosed
    - Lower quality than recurring software if revenue depends on custom work
    - Provide paid pilot counts, average contract value, and conversion to recurring revenue
  - - Verification and workflow automation modules
    - Automation spanning placement through design verification
    - Module, seat, or workflow contract
    - Product scope is public; module-level packaging is not
    - Could improve attach and expansion, but stream is not separately observable
    - Disclose module packaging, upsell path, and whether verification is billed separately
  - - Support / maintenance layer
    - Ongoing model updates, workflow support, and bug fixes analogous to mature EDA vendors
    - Support term or recurring maintenance fee
    - No public Ricursive support pricing or policy found
    - Would improve durability if contractual, but currently only an inferred future layer
    - Provide support tiers, renewal terms, and support gross margin
  - - Compute-backed design runs
    - Company-funded or customer-funded compute used to train, tune, or run design workflows
    - Usage, project, or reserved-capacity basis
    - Compute expansion is public; billing model is not
    - Can become margin dilutive if compute is bundled too aggressively into delivery
    - Provide who pays for training/inference compute and whether contracts cap or pass through usage
  notes: Rows separate what Ricursive publicly describes today from the monetization layers investors would need to see in contracts; undisclosed fields are left explicit rather than inferred.
