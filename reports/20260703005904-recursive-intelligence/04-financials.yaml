- id: TI004
  title: Cost structure / gross-margin driver table
  columns:
  - Cost bucket
  - Public evidence
  - Gross-margin implication
  - Public status
  - Diligence ask
  rows:
  - - Elite AI and semiconductor labor
    - Lightspeed says labor is the bulk of semiconductor R&D spend; Ricursive is scaling a small elite team
    - Keeps near-term gross margin low until revenue becomes repeatable and software-heavy
    - Strongly supported
    - Provide headcount by function, loaded compensation, and hiring plan by quarter
  - - Compute infrastructure
    - Series A proceeds explicitly include significant compute expansion
    - Bundled compute can dilute gross margin if not separately priced or efficiently utilized
    - Strongly supported
    - Provide compute budget, capex vs opex split, and customer chargeback policy
  - - EDA and toolchain expense
    - Legacy EDA licenses are described as expensive and category power remains concentrated
    - Raises delivery cost until Ricursive can replace or reduce incumbent-tool dependence
    - Directionally supported
    - Provide annual third-party tooling spend and dependence by workflow stage
  - - Verification and human-in-the-loop review
    - TechCrunch says platform extends through design verification; Semiconductor Engineering says human oversight remains necessary
    - Adds solutions-engineering and QA cost that delays pure-software margin structure
    - Strongly supported
    - Provide implementation playbook, review hours, and defect / rework burden per project
  - - Advanced-packaging and reliability complexity
    - Siemens and HCLTech describe 3D IC, chiplet, and trusted-toolchain complexity
    - Creates ongoing need for simulation, reliability, and customer-specific validation capacity
    - Directionally supported
    - Provide which packaging / reliability workflows Ricursive supports natively versus through partners
  - - Go-to-market and solution engineering
    - Enterprise selling into chip teams implies heavy pre-sales technical work
    - Sales efficiency depends on how much technical labor is required before signature
    - Inferred from public GTM evidence
    - Provide AE-to-SE ratio, average pre-sales hours, and pilot support cost
  notes: The table distinguishes direct disclosed cost nodes from analog-driven pressure points. It does not assume Ricursive bears foundry or inventory costs because no public source shows that business model.
  enumerationScope:
    coverage: partial
    basis: Rows summarize the cost buckets most likely to determine Ricursive's margin path given the reviewed public company, investor, and industry sources.
