- id: TI006
  title: Public traction / private-metric gap table
  columns:
  - Metric or dataset
  - What is public
  - What is missing
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Revenue / ARR / bookings
    - No public revenue figure; only funding and strategy are public
    - Current revenue by stream, bookings, and revenue-recognition bridge
    - Cannot underwrite scale, growth, or revenue quality
    - Request trailing 12-month revenue, pipeline conversion, and accounting memo
  - - Pricing / contract value
    - No public list price or realized contract value
    - Standard pricing schedule, pilot pricing, discount policy, and services scope
    - Cannot map customer interest into monetization efficiency
    - Request standard order form, price book, and first ten realized contracts
  - - Customer names / count / concentration
    - Unnamed interest from major chip makers; no named paying accounts
    - Current customers, pilot count, top-account mix, and concentration
    - Cannot test adoption breadth or single-customer dependency
    - Request customer list, stage of each account, and top-10 revenue share
  - - Gross margin / cost of delivery
    - Only public-comp analogs disclose margin structure
    - Ricursive gross margin, compute allocation, services burden, and support costs
    - Cannot tell whether commercialization is software-like or services-heavy
    - Request gross-margin bridge by contract type
  - - Cash / burn / runway
    - $335M raised publicly; current liquidity undisclosed
    - Current cash, gross burn, net burn, and base / downside runway
    - Cannot judge financing urgency or downside resilience
    - Request monthly cash bridge and 18-month operating plan
  - - Commercial proof points
    - Founder pedigree, AlphaChip lineage, and investor roster are public
    - Booked pilots, production accounts, design wins, renewals, and benchmarked customer outcomes
    - Public traction is credibility-heavy rather than KPI-heavy
    - Request customer case studies with pricing, cycle time, and retention outcomes
  - - Headcount and functional mix
    - Company says it is scaling a small elite team, but no count or mix is public
    - Engineering, research, solutions, and GTM headcount by quarter
    - Cannot model fixed-cost growth or support leverage
    - Request org chart, hiring plan, and attrition data by function
  notes: The table is intentionally gap-oriented because public evidence is unusually thin on operating metrics. Each row points to the minimum private artifact needed to move from narrative diligence to financial underwriting.
