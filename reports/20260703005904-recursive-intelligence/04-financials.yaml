- id: cost-structure-margin-path-and-service-delivery
  title: Cost Structure, Margin Path, and Service-Delivery Costs
  body: 'Public evidence implies a cost base that is far heavier than normal software but lighter than a semiconductor manufacturer. Ricursive''s Series A announcement said proceeds will scale research and engineering and significantly expand compute infrastructure. Lightspeed argues that leading-edge chip design still consumes large engineering teams, expensive EDA tooling, and years of labor. Siemens and HCLTech add why that burden matters: 3D ICs, chiplets, advanced packaging, and trusted toolchains increase the amount of simulation, validation, and reliability work needed before anything can be taped out. Even if Ricursive never owns fabs or inventory, it still has to pay for elite talent, compute, tools, and customer-facing verification support.


    That cost structure matters because the margin path is not yet observable. Mature public analogs show what success could look like: Synopsys and Cadence report software-, IP-, maintenance-, and services-heavy revenue models, and Synopsys'' filing implies gross margin around the high-70s. But Semiconductor Engineering''s 2026 panel is the key adverse counterweight. It argues that AI is automating tedious design tasks, not replacing EDA tools or human oversight outright, and warns that full autonomy is still a step away because chip design mistakes are extremely expensive. For Ricursive, that means near-term service delivery likely includes human-in-the-loop design, verification, and workflow tuning, which keeps gross margin below eventual pure-software aspirations until productization is proven.'
