  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Recursive Intelligence 公开品牌为 Ricursive Intelligence，应按 AI 芯片设计自动化平台分析，而不是半导体制造商、晶圆代工厂、晶圆厂设备供应商或 AI
              芯片卖方。公司官网、发布材料和独立报道都把它放在软件层：帮助工程师更快做出定制芯片。这一区分重要，因为前沿 AI 投资很容易借用 AI 加速器收入、晶圆代工收入或晶圆厂设备资本开支等巨大相邻数字，然后称之为
              TAM。这些资金池是需求驱动因素或背景，不是 Ricursive 实际售卖进入的市场。


              最应纳入的支出，是能改善芯片设计工作流的软件和服务：布局规划、PPA 优化、设计收敛、验证辅助，以及在公司证明能够超出布局之后，最终进入架构探索。现状替代方案仍是劳动密集型的传统 EDA
              流程，工程团队在既有工具里手工迭代，直到设计收敛。最近的相邻替代品，是 Synopsys 和 Cadence 已经出售的 AI 模块。这些既有厂商证明类别存在，但也收窄边界：Ricursive
              可信的市场是芯片设计内部的自动化层，不是整个半导体价值链。
