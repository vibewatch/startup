      - number: '6.4'
        title: 持久性、集中度与仍需完成的尽调
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开证据最薄弱之处。留存来源没有披露客户数、试点到生产的转化率、合同期限、NRR、GRR、续约节奏，
              甚至没有清晰区分评估账户和生产账户。不能把这种缺失解读成失败信号；很多极早期基础设施公司都会把这些数字留在私域。 但这也意味着，本章不能仅凭创始人履历或融资速度，负责任地推断留存质量、扩张效率或安装基础健康度。


              公开记录也无法测算集中度风险，这本身就是风险信号。公司可以拥有广泛的主动询盘， 却仍在商业上依赖一两个标杆设计伙伴，用于验证、路线图反馈和未来订单。如果 Ricursive 第一个可见参考客户最终是前沿 AI
              实验室或顶级芯片厂商， 这个胜利会有战略价值——但也可能给客户带来谈判筹码，并扭曲公司的收入结构。管理层披露更多信息之前， 诚实做法是保留缺口，而不是用未公开的 logo、NPS 或留存说法去填补。


              客户尽调因此要直接追问隐藏变量。最有决策价值的要求包括具名客户参考包、带转化状态的试点漏斗、脱敏合同结构、 在现有 EDA
              栈中的工作流位置、流片或验证结果证据，以及已签客户和近期管线的集中度数据。Ricursive 可能确实在 NDA 背后拥有优秀早期客户。 当前公开记录只是还没有证明这一点。
