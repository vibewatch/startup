      - number: '5.4'
        title: 差异化、IP 与运营护城河
        blocks:
          - type: paragraph
            body: >-
              Ricursive 最清楚的差异化是范围。Synopsys、Cadence 和 Siemens 的既有 AI-EDA 产品，营销重点是优化或编排既有设计流程；Ricursive
              营销的是一个未来：客户描述工作负载，收到可制造设计结果。这一定位可能具备战略意义，因为芯片设计周期仍以年和大型人工预算计，而即便一流商业工具，也大多是在传统工具链内部优化。第二个护城河组成部分是创始人和数据谱系：团队可以指向
              AlphaChip、开源 circuit-training
              资产和获奖后续研究，证明其理解学习问题，也理解物理设计约束。第三个组成部分，是围绕特定工作负载共同设计模型和硬件的运营经验，而不是销售现成加速器。不过，公开范围内的护城河仍更像承诺而非已证事实。Ricursive
              没有公开披露专利组合、客户锁定指标、专有数据集规模或持久供应协议，因此尽调应把护城河视为技术上可信、商业上未证。
