  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、稀释测算，以及为什么 $4B 标记需要纪律
        blocks:
          - type: paragraph
            body: >-
              Ricursive 在不到两个月内，从 2025 年 12 月约 $750 million 的种子轮估值跳到 2026 年 1 月 $4 billion 投后 Series A。 这样的跃升在当前前沿 AI
              市场中并非不可能，但对一家尚未公开披露收入、ARR、毛利率、客户数或具名付费设计项目的公司来说， 仍是一次激进重估。现有证据支持的是一轮“创始人 + 可选性”融资：Anna Goldie 和 Azalia
              Mirhoseini 具备稀缺的 AlphaChip 与 TPU 可信度， 公司瞄准真实的设计瓶颈，顶级投资人也迅速围绕故事组成银团。融资数学同样重要。$4 billion 投后估值下的 $300 million
              一级融资， 意味着约 $3.7 billion 投前估值，新增资金稀释仅约 7.5%；也就是说，这轮融资抬高参考价格的程度远大于改变股权基础。
              公开证据支持存在一轮稀缺资产的市场出清融资；但在出现新里程碑前，还不足以支持以高于该轮的价格买入。 由于公开条款未披露清算优先权或治理保护，头条估值应被视为入场纪律的上限，而不是内在价值。
