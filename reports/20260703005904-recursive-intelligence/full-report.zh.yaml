        - 半导体设计组织的 CAD / 硅工程预算
        - 最有意义的广义背景，因为 Ricursive 卖进的是软件工作流，而不是硬件资本开支
      - - AI PPA / 布局规划自动化
        - 布局、PPA 搜索和流程优化模块的点工具支出
        - 与芯片设计无关的通用 ML 工具
        - 物理设计和 CAD 团队
        - 直接切中 Ricursive，因为今天公开的既有厂商证据在这里最强
      - - 全栈 AI 芯片设计自动化
        - 从布局延伸到验证、设计收敛和更广平台编排的工作流自动化
        - 成品芯片、晶圆产出、代工产能
        - 硅平台和工程负责人
        - 这是 Ricursive 的核心论点；如果证据成立，也是它可能捕获的最大软件层
      - - 定制硅项目设计预算
        - 附着在战略 ASIC 或加速器项目上的自动化叠加层和增量软件 / 服务支出
        - 流片制造成本和云推理收入
        - 超大规模云厂商、fabless 或 OEM 芯片项目负责人
        - 定义了近期最可能服务的市场，速度 ROI 在这里最高
