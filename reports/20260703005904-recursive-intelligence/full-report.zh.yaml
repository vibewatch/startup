      - number: '3.4'
        title: 护城河有可能成立，但公开反向证据仍主导持久性分析
        blocks:
          - type: paragraph
            body: >-
              Recursive 确实具备形成可防守位置的要素。AlphaChip
              谱系是真实的，创始团队的领域匹配度异常高，公司也融到足够资本来积极招聘。如果它能把这些履历转成一套工作流，帮助团队压缩更多芯片设计周期，尤其是那些太小、无法自建超大规模云厂商级内部系统的团队，它可能在既有 EDA
              套件和自建替代品之间占据有意义的位置。


              问题在于，同一组创造可信度的证据也限制护城河持久性。AlphaChip 的开源谱系意味着技术栈的一部分可被检查，也可能被复现。New Scientist
              的批评说明，关于强化学习在芯片布局中更优的主张，公开证明门槛仍然很高。与此同时，Synopsys、Cadence、Siemens 和行业观察者都指向一个世界：智能体式 AI 变成标准 EDA
              功能，而不是创业公司独有差异化。如果这在 Recursive 发布客户胜利或基准证据之前发生，既有厂商可以把 AI 打包进受信任工作流，压缩创业公司建立溢价位置的窗口。


              2026 年融资周期并没有降低风险，反而加剧了风险。Cognichip、MatX 和 Rebellions 显示，资本仍不断涌入设计自动化新进入者和相邻硬件公司。因此，Recursive
              的护城河目前更多是理论而非公开证明：吸引力来自谁在打造它、它声称自动化什么；但它仍易受商品化、内部自建、硬件采购替代或既有厂商捆绑的冲击。
