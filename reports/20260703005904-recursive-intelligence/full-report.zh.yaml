      - number: '6.2'
        title: 公开证据栈：相邻可信度真实存在，Ricursive 自身客户证据仍然单薄
        blocks:
          - type: paragraph
            body: >-
              核心客户事实是负面的，但很重要：Ricursive 的公开页面没有点名生产客户。TechCrunch 更明确，称创始人不会点名早期客户。同一篇访谈确实报道了来自“每一家大型芯片制造商”的强烈主动询问，并称
              Ricursive 可以挑选首批开发伙伴；这比零信号更好，但仍明显弱于具名账户、买方引述、流片案例或结果指标。发布新闻稿中的“早期企业”表述也应归入同一桶：它显示商业化意图，而不是客户证明。


              更强的是相邻谱系。DeepMind 称 AlphaChip 已用于多个 TPU 世代，MediaTek 也将其扩展到先进芯片。Sequoia 播客补充说，创始人数年来把 TPU
              团队视为内部客户，并围绕这些工程师真正关心的指标打磨方法。这很有意义，因为它证明她们过去解决过真实设计用户问题。但它仍是相邻证明，不是 Ricursive 收入证明。正确解读是：Ricursive
              一开始就拥有异常强的创始人与市场匹配度，也拥有异常弱的公开牵引披露。


              市场侧背景解释了投资人为何愿意容忍这一缺口。Anthropic、AWS、Google、Microsoft
              和其他平台构建者已经在证明，当成本、吞吐和控制足够重要时，大买方会投入定制芯片路径。从这个意义上说，Ricursive 指向的是真实痛点。缺失的一步，是证明客户会把生产设计流程中有意义的一部分，交给
              Ricursive 这家公司。
