          detail: IP 安全、可追溯性和支持访问控制。
        - id: export
          label: 出口管制负担
          detail: 许可、母公司筛查和远程用户控制。
        - id: pilot
          label: 试点认证
          detail: 客户验证和工作流嵌入。
        - id: delay
          label: 部署延迟
          detail: 通往生产验收的路径更长。
        - id: revenue
          label: 收入爬坡
          detail: 商业转化和账户覆盖广度。
        - id: burn
          label: 现金消耗 / 跑道
          detail: 规模化前的算力和人才开支。
        - id: valuation
          label: 估值支撑
          detail: 守住当前估值并支撑下一轮的能力。
      edges:
        - from: verification
          to: pilot
        - from: ipsec
          to: pilot
        - from: export
          to: pilot
        - from: pilot
          to: delay
        - from: delay
          to: revenue
        - from: revenue
          to: burn
        - from: burn
          to: valuation
        - from: export
          to: valuation
    approximationNotes: 该图突出一阶传导路径，而非列举所有可能的反馈回路。
    claimRefs:
      - CR020
      - CR022
      - CR025
      - CR027
      - CR030
      - CR040
      - CR044
      - CR047
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Ricursive 同时依赖既有工具栈、下游合格签核、稀缺人才，以及客户集中、且往往能自研的买方群体。
    data:
      nodes:
        - id: ricursive
          label: Ricursive
          detail: 正在商业化的 AI 驱动芯片设计平台。
        - id: synopsys
          label: Synopsys
          detail: 拥有 DSO.ai 和大型企业客户基础的 EDA 既有厂商。
        - id: cadence
          label: Cadence
          detail: 具备 Cerebrus 和 ChipStack 智能体工作流的 EDA 既有厂商。
        - id: siemens
          label: Siemens
          detail: 定制 IC、仿真和多物理场生态。
        - id: foundry
          label: 合格签核流程
          detail: 签核方接受的时序、DRC、SI、PI 和可制造性报告。
        - id: buyers
          label: 大型芯片厂商买方
          detail: 成熟客户，拥有内部团队和 ASIC 规划。
        - id: compute
          label: 算力基础设施
          detail: 研究和模型执行能力。
        - id: talent
          label: 稀缺人才市场
          detail: ML、验证、物理设计和系统专长。
        - id: rules
          label: 出口规则
          detail: D:5 / 澳门筛查和远程访问控制。
        - id: data
          label: 客户设计数据
          detail: 敏感 PDK、IP 和工作流上下文。
      edges:
        - from: synopsys
          to: ricursive
        - from: cadence
          to: ricursive
        - from: siemens
          to: ricursive
        - from: foundry
          to: ricursive
        - from: compute
          to: ricursive
        - from: talent
          to: ricursive
        - from: rules
          to: ricursive
        - from: data
          to: ricursive
        - from: ricursive
          to: buyers
        - from: rules
          to: buyers
    approximationNotes: 该图抽象出杠杆最高的依赖，而不是列出每一家供应商、客户或晶圆厂关系。
    claimRefs:
      - CR011
      - CR013
      - CR014
      - CR015
      - CR016
      - CR018
      - CR019
      - CR033
      - CR041
      - CR046
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从创始人稀缺性和市场需求推导至当前「跟踪 / 继续研究」建议的决策链。
    data:
      nodes:
        - id: n1
          label: 稀缺创始人和 AlphaChip 可信度
          detail: Goldie 和 Mirhoseini 在 AI 驱动芯片设计上带来少见的可信度。
        - id: n2
          label: 真实市场瓶颈
          detail: 超大规模云厂商持续投入定制 AI 芯片和更快迭代。
        - id: n3
          label: $4B 估值较早落定
          detail: 种子轮到 Series A 轮的估值跃升发生在公开财务披露之前。
        - id: n4
          label: 既有 AI-EDA 产品已经存在
          detail: Synopsys 和 Cadence 已经销售 AI 芯片设计自动化产品。
        - id: n5
          label: 缺少公开收入证明
          detail: Ricursive 尚未公开披露收入、利润率、ARR 或客户数量。
        - id: n6
          label: 反向技术批评
          detail: 外部专家质疑 AlphaChip 式优势是否已经充分证明。
        - id: n7
          label: 建议：跟踪 / 继续研究
          detail: 商业证明改善之前，可以观察这个估值，但不能有把握地追价。
      edges:
        - from: n1
          to: n7
          label: 支撑上行
        - from: n2
          to: n7
          label: 支撑上行
        - from: n3
          to: n7
          label: 设定入场纪律
        - from: n4
          to: n7
          label: 抬高证明门槛
        - from: n5
          to: n7
          label: 限制确信度
        - from: n6
          to: n7
          label: 抬高下行风险
    approximationNotes: 该流程是分析框架，不是机械公式；它把主要估值驱动因素压缩成一条可提交 IC 的推荐路径。
    claimRefs:
      - CV005
      - CV015
      - CV024
      - CV025
      - CV036
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在选定上市公司收入倍数视角下，Ricursive 若要支撑 $4B 估值所需的隐含年收入。
    data:
      items:
        - label: 10.5x（Synopsys 参照）
          value: 382
          unit: $M revenue
        - label: 18.8x（4 家可比公司均值）
          value: 212
          unit: $M revenue
        - label: 18.6x（Cadence 参照）
          value: 215
          unit: $M revenue
        - label: 21.9x（NVIDIA 参照）
          value: 183
          unit: $M revenue
        - label: 24.4x（AMD 参照）
          value: 164
          unit: $M revenue
    approximationNotes: 数值只是用 $4,000M 除以所选倍数得到的简单隐含收入结果，不是 Ricursive 管理层指引。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于证据质量和执行里程碑，为 Ricursive 估算悲观、基准和乐观估值区间（以十亿美元计）。
    data:
      items:
        - label: 悲观情景
          low: 2.5
          mid: 2.9
          high: 3.25
          unit: $B
        - label: 基准情景
          low: 3.75
          mid: 4.1
          high: 4.75
          unit: $B
        - label: 乐观情景
          low: 6
          mid: 7
          high: 8
          unit: $B
        - label: 概率加权中枢
          low: 4
          mid: 4.1
          high: 4.2
          unit: $B
    approximationNotes: 情景区间是分析师估算，既保留不确定性，也围绕最新融资估值锚定。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV043
      - CV044
      - CV045
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 一张 IC 风格评分卡，覆盖最能决定 Ricursive 能否不止靠叙事撑估值的维度。
    data:
      items:
        - label: 市场需求
          value: 8/10
          note: 定制 AI 芯片需求和设计复杂度真实存在，并且还在增长。
        - label: 创始人 / 人才质量
          value: 9/10
          note: AlphaChip 背景和招聘信号异常强。
        - label: 技术证明可见度
          value: 6/10
          note: 概念可信，但相对既有厂商的公开基准数据仍然偏薄。
        - label: 客户证明
          value: 3/10
          note: 战略兴趣可见；具名付费客户证据不可见。
        - label: 经济性可见度
          value: 2/10
          note: 尚无公开收入、利润率或 ARR 披露。
        - label: 竞争隔离度
          value: 4/10
          note: 既有 EDA 厂商已经把 AI 辅助设计工具商业化。
        - label: 估值支撑
          value: 3/10
          note: 除非里程碑快速改善，否则当前价格隐含的回报不到风险投资应有水平。
        - label: 证据质量
          value: 5/10
          note: 融资和市场叙事来源扎实；变现证据仍未公开。
    approximationNotes: 分数是基于来源证据的分析判断，不是公司披露，也不是管理层给出的量化评级。
    claimRefs:
      - CV014
      - CV024
      - CV025
      - CV031
      - CV036
      - CV045
      - CV049
      - CV050
