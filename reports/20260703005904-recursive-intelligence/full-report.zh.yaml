      - number: '4.3'
        title: 公开牵引、指标缺口与资本充足性
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引信号是融资速度、创始人履历和技术可信度，而不是财务表现。Ricursive 披露已融资 $335M；TechCrunch 和 Crunchbase 报道称，公司不到两个月内从 $750M 估值的
              $35M 种子轮，跳到 $4B 估值的 $300M Series A。PRNewswire 称新资金将投向团队扩张和算力基础设施；DeepMind 的 AlphaChip 历史和 TechCrunch
              关于主要芯片制造商兴趣的叙述，也解释了投资人为何愿意如此激进地给团队融资。这些都是真实的市场信念信号，但不能替代收入、定价或留存。


              私有指标缺口仍是本章核心阻断点。已审阅公开资料没有披露收入、ARR、当前客户数、具名付费账户、毛利率、现金、烧钱速度、跑道或债务。即便下一轮触发条件也不透明：公开证据表明现金正在投向研究人才、算力和平台建设，但没有说明花得多快，也没有说明对应哪些商业里程碑。相对晶圆厂或云基础设施创业公司，Ricursive
              的资本强度较低，因为它没有公开建设工厂或购买库存；相对普通软件创业公司，它仍然明显资本密集，因为算力和稀缺半导体人才处于交付中心。公开看，公司为研究加速融资充足，但还不能据此承销收入持久性。
