        - 提供计算预算、资本开支与运营开支拆分，以及客户费用分摊政策
      - - EDA 与工具链费用
        - 传统 EDA 许可证被描述为昂贵，品类权力仍高度集中
        - 在 Ricursive 能替代或降低对既有工具依赖前，交付成本会被抬高
        - 方向性支撑
        - 提供年度第三方工具支出，以及按工作流阶段拆分的依赖度
      - - 验证与人在环审核
        - TechCrunch 称平台延伸到设计验证；Semiconductor Engineering 称人工监督仍然必要
        - 增加解决方案工程和 QA 成本，推迟纯软件毛利结构
        - 强支撑
        - 提供实施手册、审核小时数，以及每个项目的缺陷 / 返工负担
      - - 先进封装与可靠性复杂度
        - Siemens 和 HCLTech 描述了 3D IC、chiplet 与可信工具链复杂度
        - 持续需要仿真、可靠性和客户定制验证能力
        - 方向性支撑
        - 说明 Ricursive 原生支持哪些封装 / 可靠性工作流，哪些依赖伙伴
      - - GTM 与解决方案工程
        - 面向芯片团队的企业销售意味着售前技术工作很重
        - 销售效率取决于签约前需要投入多少技术人力
        - 从公开 GTM 证据推断
        - 提供 AE/SE 比例、平均售前小时数和试点支持成本
    notes: 本表区分直接披露的成本节点与类比推导的压力点。没有公开来源显示 Ricursive 采用晶圆厂或库存型商业模式，因此不假设其承担这类成本。
