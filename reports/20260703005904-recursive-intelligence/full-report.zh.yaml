      - number: '2.4'
        title: 增长驱动、采用约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求侧是真实的。超大规模云厂商已经大规模运营第一方芯片项目：AWS 推广 Trainium 用于 AI 训练和推理，Google 称 TPU 支撑 Gemini 和更广泛的 AI 技术栈，Microsoft 称
              Maia 200 改善自有集群内的推理经济性。再叠加 Lightspeed 的观点——顶级芯片项目仍要消耗数年和数亿美元——增长驱动逻辑很强。Ricursive
              不需要全世界每一家半导体公司都购买平台才能重要；它只需要在时间和人才最稀缺的定制芯片项目中拿到有意义的份额。


              约束侧同样重要。公开证明在布局规划和 PPA 优化上最强；延伸到验证和全栈自动化的更宽主张，还没有具名设计胜利或公开基准来支撑。New Scientist 对 AlphaChip
              公开证据的怀疑很重要，因为关键任务设计软件买方对可复现性、保密性和切换成本异常敏感。出口管制又加了一层摩擦，影响哪些客户、晶圆厂和伙伴能够被干净服务。对估值而言，这意味着应按证明里程碑和企业采用证据来承销
              Ricursive，而不是只看宽泛 TAM 话术。
