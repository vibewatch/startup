              都出现在官方公告里。缺失的信息同样重要。同一组资料没有披露收入、ARR、客户数或总员工数，部分二级报道甚至把轮次表述弄错。因此，投资人可以高度相信融资时间线，但对当前经营规模只能给低到中等信心；公开事实只说明公司在招聘和基础设施上投入，而不是发布牵引指标。
