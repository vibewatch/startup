  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局横跨直接既有厂商、相邻领域、替代路径和资本支持的新进入者
        blocks:
          - type: paragraph
            body: >-
              Recursive Intelligence 公开品牌为 Ricursive Intelligence，它进入的不是空白类别。最清楚的直接商业替代，是 Synopsys DSO.ai 和 Cadence
              Cerebrus；Cadence 2026 年的 ChipStack AI Super Agent 又把这种竞争从后端优化延伸到前端设计和验证。Siemens Solido 通过营销 AI
              支持的变异感知设计、IP 验证、表征和仿真，把既有厂商阵地扩展到相邻的定制 IC
              工作流。这三组既有产品族比多数早期创业公司更重要，因为它们已经嵌在半导体组织内部，而这些组织信任它们的支持模式、签核流程和采购动作。


              替代品集合同样重要。AlphaChip 和开源 circuit_training 仓库，让强化学习布局规划谱系的一部分可以被顶尖内部团队复现。Google、AWS 和 Microsoft 都公开描述了第一方 AI
              加速器，这意味着最先进的买方可以通过内部芯片项目应对硬件瓶颈，而不是采用外部自动化创业公司。更简单的替代品是商用硬件：NVIDIA 和 AMD 让买方通过采购解决近期 AI 算力需求，而不是启动多年定制芯片项目。


              潜在新进入者再加一层压力。Cognichip 明确试图把深度学习用于芯片设计；MatX 和 Rebellions
              则说明，相邻芯片创业公司可以把资本、人才和买方注意力拉向硬件主导的替代方案。因此，实际竞争地图不只是 Recursive 对另一家年轻创业公司；而是 Recursive 对根深蒂固的 EDA
              既有厂商、开源或内部自建路径，以及资本密集型硬件选项——这些选项会让许多买方不再需要定制设计。
