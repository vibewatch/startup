      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开披露指向一种运营模式：把已被证明的研究原语放在底层，再叠加更宽的端到端野心。Ricursive 的技术可信度始于 AlphaChip：Goldie 和 Mirhoseini
              参与构建了一个强化学习布局规划系统，Google DeepMind 称该系统使用基于边的图神经网络，在网格上按顺序放置组件，并已用于生产 TPU 世代和外部芯片项目。Ricursive
              自己的平台似乎沿着这一谱系向两个方向延伸。第一，Phase I 聚焦既有流程里的阶段加速器，包括从架构设计到物理签核的时序分析和 PPA 驱动优化。第二，公司称 Phase II 会把各阶段合并成从工作负载到
              GDSII 的模型，也就是客户界面变成工作负载描述，后端处理架构探索、布局、验证和制造交付。这一系统边界远宽于 Synopsys DSO.ai、Cadence Cerebrus 或 Siemens
              Solido；后者都被描述为既有 EDA 流程内部的 AI 增强层。主要保留点是，Ricursive 尚未公开记录这套端到端技术栈的精确内部模型边界、人工复核节点或签核链条。
