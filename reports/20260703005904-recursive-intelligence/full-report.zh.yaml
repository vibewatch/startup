  - id: TV002
    title: 正反论点表
    columns:
      - 维度
      - 多头论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 市场需求
        - AI 实验室和超大规模云厂商确实需要更快的定制硅迭代。
        - 真实瓶颈并不保证 Ricursive 能拿到有吸引力的经济性。
        - 多个付费项目，以及跨不止一个买方的扩张证据。
      - - 产品承诺
        - AlphaChip 背景和递归式 AI-硬件协同设计支撑了有意义的产品论点。
        - 公开证据仍未显示其在生产中可重复地优于既有 EDA 工作流。
        - 关于设计周期、验证吞吐和 PPA 的独立基准数据。
      - - 客户验证
        - 主动找上门的战略兴趣说明买方确实好奇。
        - 战略兴趣不等于付费部署或续约行为。
        - 具名付费客户，以及生产或续约证据。
      - - 财务支持
        - 大额资本基础能支持人才和计算扩建。
        - 目前还没有公开收入、ARR、毛利率或定价披露来支撑估值。
        - 收入衔接路径、定价模型和利润率披露。
      - - 竞争
        - Ricursive 可能成为芯片制造商和云实验室的战略赋能层。
        - Synopsys 和 Cadence 已经把 AI 辅助自动化交付进客户工作流。
        - Ricursive 在重要设计上显著优于既有基线的证据。
      - - 政策与技术风险
        - 创始人信誉和计算需求能继续吸引投资人注意力。
        - AlphaChip 式优越性仍有争议，出口管制摩擦也可能拖慢商业化。
        - 第三方技术验证，加上政策约束可管理的证据。
      - - 退出逻辑
        - 稀缺性可能支撑又一轮溢价私募融资或合作。
        - 若没有披露支撑，近期 IPO 逻辑偏弱；当前估值已经吃掉了大部分上行叙事。
        - 数据室级别披露；回报相对上一轮还要多出低双位数百分点的风险溢价。
    notes: 反向逻辑聚焦估值支撑和商业化证据，而不是否认 AI 芯片设计自动化的重要性。
