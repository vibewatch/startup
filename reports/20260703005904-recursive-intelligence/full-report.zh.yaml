    title: 投资逻辑破裂与止损触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 相对既有厂商的基准差距
        - 在客户相关设计上，相比 Synopsys/Cadence 工作流没有清晰提升
        - 削弱核心主张：Ricursive 是差异化平台，而不只是光环项目。
        - 把估值立场推向悲观情景，并要求显著更低的入场价格。
      - - 没有具名付费客户
        - 下一轮融资仍没有客户名称、付费试点或收入区间
        - 说明商业证明落后于资本投放。
        - 建议维持在继续研究或更低。
      - - 技术质疑延续
        - 第三方复现仍未显示清晰的 AlphaChip 式优势
        - 提高叙事跑在可复现优势前面的概率。
        - 把公司视为实验性基础设施 R&D，而不是规模化软件平台。
      - - 政策摩擦升高
        - 出口管制或生态规则限制跨境 AI 芯片项目
        - 可能放慢获客，并收窄伙伴集合。
        - 提高所需安全边际，并缩短投资测算周期。
      - - 条款悬置风险浮现
        - Series A 优先权、反稀释棘轮条款或治理权利显著压低普通股上行空间
        - 可能让名义 $4B 估值在经济上不那么有吸引力。
        - 任何承诺前，先基于股权结构表重建回报测算。
    notes: 每个触发因素都可能改变概率加权估值走廊，或改变按当前估值买入的经济吸引力，因此被纳入。
    claimRefs:
      - CV017
      - CV033
      - CV036
      - CV037
      - CV040
      - CV045
      - CV047
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入模型
        - 当前收入、软件 / 许可 / 服务属性，以及任何 ARR 口径
        - 没有收入形态，上市可比只能做代理测算。
        - 索取收入桥、定价模型，以及确认收入与签约收入明细。
      - - 客户证明
        - 具名付费客户、项目规模、生产与试点状态、续约路径
        - 估值故事必须从战略兴趣转成已变现采用。
        - 询问头部设计伙伴、合同阶段和用例结果。
      - - 基准测试结果
        - 相对既有工作流的实测布局时间、验证吞吐和 PPA 提升
        - 技术转商业的核心证明就在这里。
        - 索取第三方基准测试包和客户背调对象。
      - - 毛利率和算力成本
        - 训练 / 推理单元经济、服务收入占比和交付模型
        - 如果算力或服务拖累利润率，软件式倍数就难以成立。
        - 审查队列级毛利率和算力 COGS 假设。
      - - Series A 条款
        - 优先股堆叠、董事会权利、pro rata 结构和任何投资人保护
        - 经济吸引力可能与名义估值显著不同。
        - 获取股权结构表、股票购买协议和主要投资人附函。
      - - 现金跑道和招聘计划
        - 烧钱速度、招聘速度和算力 capex 承诺
        - 有助判断当前轮融资是在资助证明，还是只是延长实验。
        - 索取经营计划、烧钱桥和算力基础设施承诺。
    notes: 买方若要在 January 2026 投后基准之上做有意义的投资测算，至少要完成这些尽调事项。
    claimRefs:
      - CV024
      - CV029
      - CV031
      - CV032
      - CV045
      - CV047
      - CV050
  - id: TV008
    title: 退出就绪度表
    columns:
      - 路径
      - 就绪度
      - 支撑因素
      - 阻碍因素
      - 视角变化条件
    rows:
      - - 下一轮私募融资
        - 中
        - 顶级投资人组合和创始人稀缺性仍能吸引资本。
        - 若下一轮仍没有客户或基准证明，估值压缩风险会上升。
        - 展示付费牵引，并控制烧钱速度。
      - - 战略合作 / 渠道交易
        - 中高
        - 目标客户包括大型芯片制造商和云实验室，战略兴趣可见。
        - 这些兴趣尚未以经常性收入或生产部署形式披露。
        - 公布有意义的设计 win 或嵌入式工作流集成。
      - - 战略出售
        - 中低
        - 大型 EDA、算力或超大规模云厂商可能看重人才和工作流 IP。
        - 买家仍会要求差异化可持续、可集成的证据。
        - 证明一项既有厂商无法低成本复制的必备能力。
      - - IPO / 上市路径
        - 低
        - 披露质量足够强时，市场会奖励 AI 基础设施稀缺性。
        - Ricursive 缺少公开收入、利润率、客户和监管文件级透明度。
        - 建立 IPO 级披露、收入规模和治理可见度。
    notes: 就绪度仅按公开证据判断；私下尽调可能显著改善或恶化每条路径。
    claimRefs:
      - CV035
      - CV046
      - CV048
      - CV049
      - CV050
