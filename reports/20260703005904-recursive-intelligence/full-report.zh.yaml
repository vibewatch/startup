        - None
        - 晶圆厂工具、工艺设备、封装线、代工收入
        - 半导体制造商和晶圆代工厂
        - 重要需求背景，但不是 Ricursive TAM
      - - AI 加速器销售和云 AI 收入
        - None
        - GPU、TPU、Trainium、Maia、云服务收入
        - 云和平台业务单元
        - 这是下游需求信号，不是 Ricursive 开票的软件市场
    notes: 边界纪律在这里很重要：纳入支出仅限于芯片设计软件和相邻自动化服务。来自 AI 加速器、晶圆厂设备或代工厂的大硬件数字被明确排除在 Ricursive TAM 之外，尽管它们会增强定制硅项目的紧迫性。
