      - number: '5.3'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              Ricursive 当前部署模式看起来由项目牵引，而不是由产品牵引。EE Times
              称首轮推出面向第三方的工作负载特定芯片设计，这意味着在形成可重复产品包之前，需要定制需求接入、架构界定，并与客户工作负载集成。公司自己的前向地图分三阶段：先加速既有设计流程，再交付从工作负载到 GDSII
              的端到端协同设计，最后才追求递归自治。可靠性证据最强的地方是谱系，而不是 Ricursive 自己的公开部署：AlphaChip 已在 Google TPU 中经生产验证；StartupHub
              报道称，Ricursive 展示过一个静态时序分析引擎，据称与商业工具的相关性超过
              0.999，速度显著更高。这在方向上令人印象深刻，但仍是管理层呈现的证据，不是独立发布的基准包，也不是具名客户流片。支持姿态同样只能推断。此次审阅的官方材料里没有看到公开定价、API 文档、状态页或 SLA
