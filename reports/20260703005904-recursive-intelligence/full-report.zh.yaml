      - number: '4.4'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论既不是看空概念，也无法让承销安心。如果 Ricursive 成熟为关键任务设计平台，并拥有类似上市 EDA
              厂商的经常性软件、IP、维护和服务经济性，收入质量可能变得有吸引力。问题是，公开证据还没有证明这些层级中任何一个已经规模化存在。没有披露价格本、没有收入确认政策、除了未具名兴趣外没有客户证明，也没有证据显示人在回路的设计和验证成本已经压低到足以支撑软件式利润率。


              $335M
              融资垫子降低了资本依赖，但问题仍未解决，因为现金、烧钱速度和跑道都未披露。最可能的失败模式不是晶圆厂过度建设，而是漫长且昂贵的产品化周期：算力、工程和客户交付成本跑得比可重复企业收入更快。核心尽调阻断点很直接：已签客户合同、当前
              ARR 或已预订试点收入、定价和实施范围、支持负担、毛利率桥，以及当前现金与烧钱模型。在这些材料可得之前，仅基于公开资料的正确结论是：Ricursive
              是一个资本充足的研发平台，最终经济性有希望，但当下商业化仍未验证。
