  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              今天最适合把 Ricursive 理解为高触达芯片设计平台加服务项目，而不是已经出货的商用芯片 SKU 或自助式 SaaS
              产品。创始人描述的未来是：拥有规模化算法或工作负载的客户，把工作负载需求、目标约束和部署目标交给 Ricursive；Ricursive 再用 AI 压缩从架构选择到物理实现、最终到可制造 GDSII
              交付的路径。公开表述反复把它框定为从 fabless 走向 designless：没有大型内部芯片团队的买方，应能购买定制芯片结果，而不是自己搭建完整设计组织。可见产品表面仍很早。官网主要是使命页；招聘和
              Ashby 页面比公开文档更清楚地暴露建设方向，活跃招聘覆盖 EDA、RTL 验证、LLM
              基础设施、软件基础设施、研究和安全。这一组合意味着，当前产品边界既包含单阶段设计加速器，也包含把它们运营起来所需的模型训练、验证和安全系统。
