companyProfile:
  summary: >-
    Recursive Intelligence 公开使用 Ricursive Intelligence 这一名称，是 Anna Goldie 和 Azalia Mirhoseini 在 Palo Alto 创立的前沿 AI
    实验室，目标是自动化并压缩半导体设计周期。公司的叙事是从 fabless 走向 “designless” 定制芯片：客户给出工作负载需求，平台逐步接手架构、物理设计、验证，最终交付制造环节。这一命题有创始人的 AlphaChip
    谱系和一线投资人背书，可信度真实存在；但公开证据包仍处早期——技术野心和融资证明很强，收入披露、客户牵引和运营控制偏弱。
