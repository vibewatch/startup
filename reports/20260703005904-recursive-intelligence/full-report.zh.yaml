      - number: '5.5'
        title: 信任、安全、安全防护、隐私、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              这是 Ricursive 故事里公开记录最弱的一块。关于智能体式 EDA
              的行业资料持续强调人工监督工作流、受信任工具链、可审计性和质量控制，因为芯片设计错误会直接传导成昂贵的制造风险。相比之下，Ricursive 的公开材料还没有暴露信任中心、面向敏感客户 IP
              的隐私声明、安全架构、认证清单、数据留存政策、模型治理说明或硅后质量框架。最接近的公开信号是 Ashby 招聘板，它在 EDA
              和基础设施岗位旁列出创始安全工程师。这是正面信号，因为它说明公司知道安全必须早期内建；但它也表明控制面仍在招人，而不是已经通过成熟公开工件证明。Ricursive
              的价值主张要求客户分享高价值工作负载，甚至可能分享硅前设计意图；缺少公开信任文档不是表面问题，而是真实尽调阻断点，应在风险敏感客户或投资人承销广泛部署之前补上。
