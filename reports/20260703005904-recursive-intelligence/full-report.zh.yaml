      - number: '4.2'
        title: 成本结构、利润率路径与服务交付成本
        blocks:
          - type: paragraph
            body: >-
              公开证据暗示，Ricursive 的成本基础远重于普通软件公司，但轻于半导体制造商。Ricursive 的 Series A 公告称，融资将用于扩大研究和工程团队，并显著扩充算力基础设施。Lightspeed
              认为，领先芯片设计仍要消耗大型工程团队、昂贵 EDA 工具和多年劳动。Siemens 和 HCLTech 补充了这份负担为何重要：3D
              IC、chiplet、先进封装和受信任工具链，会增加流片前所需的仿真、验证和可靠性工作量。即便 Ricursive 从不拥有晶圆厂或库存，它仍要为顶尖人才、算力、工具和面向客户的验证支持付费。


              这套成本结构重要，因为利润率路径还不可观察。成熟上市可比公司展示了成功后的样子：Synopsys 和 Cadence 报告的软件、IP、维护和服务占比较高的收入模型，Synopsys 申报文件也暗示毛利率在高
              70% 区间。但 Semiconductor Engineering 2026 年小组讨论是关键反向证据。它认为 AI 正在自动化繁琐设计任务，而不是直接替代 EDA
              工具或人工监督；它还警告，全自动仍差一步，因为芯片设计错误极其昂贵。对 Ricursive 而言，这意味着近期服务交付很可能包含人在回路的设计、验证和工作流调优；在产品化被证明之前，毛利率会低于最终纯软件愿景。
