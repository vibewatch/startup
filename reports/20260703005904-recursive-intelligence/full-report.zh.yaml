      - number: '8.2'
        title: 投资论点、反面论点和可比公司测算
        blocks:
          - type: paragraph
            body: >-
              正面承保逻辑很直接。芯片设计慢、贵，而且是 AI 基础设施的真实瓶颈；超大规模云厂商和模型公司仍在投资定制硅； Ricursive 的创始人所做 AlphaChip 工作已经影响多代 Google
              TPU。反面逻辑同样重要。公开客户证据仍然缺席， 公开财务披露很少，而既有 EDA 供应商已经在商业化 AI 辅助设计工作流，承诺更好的 PPA 结果和 5x-10x 生产率提升。 2026 年 7
              月公开可比公司快照显示，Synopsys 收入倍数约 10.5x，Cadence 约 18.6x，NVIDIA 约 21.9x， AMD 约
              24.4x。这些高倍数属于已经披露收入、拥有深厚安装基础和成熟商业化体系的公司。 从这些参照倒推，可以看出 Ricursive 需要多少运营实质，$4 billion 价格才会显得耐久，而不只是赶风口。
              正确解读是，Ricursive 拥有高质量市场和产品论点，但客户与财务证据仍不足以穿透反面论点。
