      - number: '8.3'
        title: 情景框架、下行触发因素和回报测算
        blocks:
          - type: paragraph
            body: >-
              不利情形并不是 Ricursive 缺乏技术人才，而是估值可能跑在可复现商业差异化前面。New Scientist 记录了专家质疑： AlphaChip
              式主张是否已经公开证明能持续优于专家设计师或商业工具；与此同时，Synopsys 和 Cadence 已经把生产级 AI 优化产品卖进真实客户工作流。 这给 Ricursive 设下很高门槛：公司不仅要证明 AI
              能帮芯片设计，还要证明自己的具体系统能创造足够可衡量的速度、验证或 PPA 优势， 从而把预算从既有供应商手里拉走，或作为赋能层叠在它们之上。熊市情形因此围绕执行错配：精英创始人、重算力和招聘投入，
              但付费部署或有基准的结果转化缓慢。基准情形让估值维持在当前水平附近，因为稀缺 AI 基础设施故事仍能吸引充裕资本。 牛市情形要求具名客户、有基准的设计胜利，以及公司能从 $4 billion
              入场价复合到至少可信的 1.5x-2.0x 总价值扩张， 而不只是守住上一轮估值的证据。
