      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Ricursive 最早的买方不是所有地方的所有芯片用户，而是日程压缩价值数百万美元、且定制芯片已经具备战略意义的组织。TechCrunch
              称任何制造电子产品且需要芯片的公司都在范围内，但现实中的第一波更窄：超大规模云厂商的硅团队、先进制程 fabless 芯片设计商，以及构建定制 ASIC
              的系统公司。这些买方已经长期承受漫长设计周期、高昂工程团队成本，并面临越来越大的压力，要靠定制芯片做差异化。


              使用者比买方集合更具体。物理设计、CAD 和验证团队会先评估产品，因为 Synopsys 和 Cadence 的既有案例仍扎根于 PPA
              和流程优化。预算权力很可能从这些团队起步；一旦工具触及多个工作流阶段或企业级算力承诺，再向上扩展。因此，采用路径应被理解为分阶段信任曲线：先建立基准可信度，再在单个模块上试点，随后延伸到验证或签核，最后才进入项目级标准化。这一顺序会让
              Ricursive 的近期 SOM 小于其标题叙事。
