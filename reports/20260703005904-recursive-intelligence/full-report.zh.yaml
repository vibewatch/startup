    sections:
      - number: '1.1'
        title: 身份、命名与当前定位
        blocks:
          - type: paragraph
            body: >-
              第一项尽调问题是身份卫生。本次任务请求的公司名是 Recursive Intelligence，但公开语料持续使用 Ricursive Intelligence；官网首页标题又多出一个拼写错误，把品牌写成
              Riculsive Intelligence。TechCrunch 也提醒读者不要把 Ricursive 与 Richard Socher 那家名称相近的创业公司 Recursive
              混淆，因此别名风险不是表面瑕疵。撇开这一点，运营叙事是一致的：Ricursive 把自己定位成一家用 AI 加速半导体设计的前沿 AI 实验室，TechCrunch 2
              月的特写也明确称，公司卖的是设计芯片的软件，而不是自己造芯片。独立报道把公司放在 Palo Alto；当前阶段更适合描述为私营、Series A
              后，而不是隐身或仅停留在概念。后续章节的核心判断是：命名层存在身份混乱，但产品命题、创始人和融资路径都指向同一家公司。
