  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标客户画像、买方 / 使用者 / 付款方地图与工作流位置
        blocks:
          - type: paragraph
            body: >-
              尽管公开记录不能支持一份公开客户名单，但它支持相当具体的客户形态。Ricursive 卖的不是成品芯片。它把芯片设计加速命题卖给那些已经背着昂贵芯片路线图、大额算力预算和痛苦 PPA 取舍的组织。这首先指向前沿
              AI 实验室和超大规模云厂商，其次是大型 fabless 半导体供应商，再往后是因为推理规模或硬件差异化具有经济意义、如今足以支撑内部 ASIC 项目的系统公司。可见类比都在这个世界里：TSMC
              庞大的晶圆代工客户群，AWS 和 Google 的定制芯片项目，以及正在优化先进制程 SoC 的 Cadence 和 Synopsys 客户。


              一个账户内部，买方、使用者和付款方不太可能是同一个人。买方大概率是关心到流片时间和总系统经济性的算力、平台或芯片项目负责人。使用者更可能是待在 EDA
              工作流里的物理设计、验证或架构团队。付款方则是为芯片路线图买单的更大企业预算负责人。这种分裂很重要，因为它意味着销售动作漫长且由技术中介，而不是轻量级产品驱动采用。Ricursive
              自己的招聘板也强化了这一判断：公开招聘仍集中在 EDA 算法、基础设施、验证、研究和安全，而不是现场销售或规模化客户成功。


              Sequoia 的 “designless” 表述也有信息量。卖点不只是让现有芯片团队工作更快；而是更多公司可能成为芯片买方或芯片项目发起方，却不用搭建巨大的内部设计组织。如果这一命题成立，Ricursive 的
              TAM 可以从传统 fabless 供应商扩展到 AI 实验室和系统公司：它们想要定制芯片，但不想从零复制一套 Broadcom、Google 或 NVIDIA
              式芯片组织。不过，这仍是目标客户假设，不是已经被证明的 Ricursive 业务账簿。
