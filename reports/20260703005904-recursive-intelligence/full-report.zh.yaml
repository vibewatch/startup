      - number: '1.2'
        title: 创始人、技术履历与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人与市场匹配度是公开记录里最清楚的优势。Anna Goldie 和 Azalia Mirhoseini 多次被列为 Ricursive 联合创始人，Goldie 任 CEO，Mirhoseini 任
              CTO；TechCrunch 2 月更深入的访谈把两人描述为长期合作者，路径从 Google Brain、Anthropic、再回到 Google，最终同步走到
              Ricursive。可信度不只是简历。Sequoia、TechCrunch 和 Google DeepMind 都把二人与 AlphaChip 连接起来，DeepMind 2024
              年的文章提供了外部证据：Ricursive
              出现之前，这项工作已经有分量。话虽如此，公开治理披露仍然很浅。已审阅资料清楚列出投资人并引用合伙人观点，但没有发布董事会名单、独立董事或具体控制权。结果是一种典型前沿实验室格局：技术领导力和外部验证一开始就异常强，但正式治理、继任深度，以及公司商业叙事在多大程度上仍集中于两位创始人，仍是实质性尽调缺口。
