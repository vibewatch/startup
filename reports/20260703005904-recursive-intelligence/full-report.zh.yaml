        - 要求建立正式出口管制架构后，才支持进一步全球扩张。
      - - 既有厂商替代压力
        - 买方选择既有厂商 AI 流程，而不是 Ricursive
        - 在可比工作流中反复输给 Synopsys、Cadence 或 Siemens 扩展模块
        - 实质下调 TAM 和定价权假设。
