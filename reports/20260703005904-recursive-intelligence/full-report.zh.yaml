      - number: '2.2'
        title: 多重测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              最好的市场规模纪律，是先看一个宽口径、可观察的天花板，再逐步向下收。EDA 和 IP 软件大盘最干净的上限代理，是既有厂商收入：CompaniesMarketCap 报告 Synopsys 2025 年收入约
              80.0 亿美元、Cadence 约 52.9 亿美元，合计约 132.9 亿美元；2026 年滚动十二个月口径也接近 135.2 亿美元。这个视角仍不完美，因为这些收入包括 Ricursive
              尚未替代的传统流程、IP 和企业关系。但相比借用半导体资本开支或 AI 芯片收入，它更站得住。


              第二个视角是下游紧迫性。SEMI 预测 2025 年晶圆厂设备支出为 1100 亿美元、2026 年为 1300 亿美元，说明 AI 相关芯片需求正把资本形成推过硬件栈。但它不会一比一转化成 Ricursive
              的软件 TAM。需要保留的矛盾是：围绕定制芯片的风投叙事，在紧迫性方向上是对的；但当前已经货币化的软件控制点，远小于相邻硬件资金池。因此，这里的窄口径市场估计采用低 / 基准 /
              高区间，并锚定既有厂商软件天花板，而不是总半导体支出。
