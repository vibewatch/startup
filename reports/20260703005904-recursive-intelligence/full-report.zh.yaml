      - number: '3.3'
        title: 切换成本、分发和供应通道仍偏向既有厂商与替代品
        blocks:
          - type: paragraph
            body: >-
              公开包装对比是不对称的。Synopsys 把 DSO.ai 与 AWS 部署基础能力配在一起，例如 ParallelCluster、Batch 和调度器支持，这意味着现有 Synopsys 客户可以扩展到 AI
              优化，而无需重构运营模式。Cadence 强调复用设计师工作台，以及调用底层 Cadence 工具的智能体层，这同样把买方留在既有厂商环境内。Siemens 的适用面更窄，但只要定制 IC
              表征或变异感知设计已经标准化，它仍能受益于既有企业位置。


              相比之下，Recursive
              要求买方在公开记录尚未展示成熟半导体采购部门通常想看的信任工件之前，先增加一个新供应商。公开材料没有披露定价、客户名称、合规姿态或带基准的部署。这不证明创业公司没有这些资产；它只意味着外部尽调还不能把它们视为已经验证。结果是切换成本劣势，即便产品命题比既有厂商点式工具更宽。


              替代品在采用摩擦上表现不错。开源 AlphaChip 工具在软件意义上免费，但在人才和实验上昂贵。超大规模云厂商内部自建运营负担重，却能让最大买方获得最大控制权。NVIDIA 和 AMD
              的商用加速器最容易采用，因为采购可以解决眼前 AI 容量问题，而不用开启新的设计流程。因此，Recursive
              不只是要卖更好的自动化，还必须给出理由，让客户愿意承受比既有厂商延伸或更简单硬件采购路径更高的切换摩擦。
