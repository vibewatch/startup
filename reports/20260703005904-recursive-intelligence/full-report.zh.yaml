  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Ricursive 的公开商业故事，形状比金额清楚。TechCrunch 称公司在构建设计芯片的 AI 工具，而不是芯片本身；Lightspeed 和公司则描述一个用于 AI
              驱动半导体设计的全栈平台。这指向设计软件变现模型，而不是芯片销售：最可能的收入表面，是企业平台许可、设计伙伴项目，以及类似成熟 EDA
              厂商的经常性支持或维护层。公开资料没有披露这些收入流今天哪一个已经存在、收入是一次性预付还是随时间确认，也没有披露是否已有客户为生产使用付费。


              GTM 动作也高度定制。TechCrunch 报道称，Nvidia、AMD、Intel 和其他芯片制造商都是目标客户，Ricursive 不会点名早期客户，创始人可以选择首批开发伙伴。这与自助式 SaaS
              漏斗正相反。它暗示公司要进入半导体设计组织，做长周期、技术密集型销售；可重复的经常性收入出现前，很可能需要试点、验证和实施工作。Ricursive
              自有页面和已审阅媒体报道都完全没有公开定价，因此最能支撑的结论是：如果商业化已经开始，它也是报价制、伙伴主导，而不是广泛产品化。
