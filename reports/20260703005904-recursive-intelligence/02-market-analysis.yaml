    severity: minor
    topic: budget-owner
    missingEvidence: Procurement workflow detail showing which functional leader actually owns the budget for AI-EDA platform expansion inside hyperscalers and fabless design teams.
    whyItMatters: Budget ownership determines sales-cycle length, expansion path, and the realistic denominator for SOM assumptions.
