  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Public pricing, contract structure, or pilot economics for Ricursive and comparable multi-stage chip-design automation products.
    whyItMatters: Without pricing and deployment terms, any SAM-to-revenue conversion remains speculative and buyer willingness to pay cannot be benchmarked.
    diligencePath: Request pilot pricing, contract terms, and expansion assumptions from Ricursive management and compare them with incumbent EDA enterprise agreements.
    relatedQuestionRefs:
