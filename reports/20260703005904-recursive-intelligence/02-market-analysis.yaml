  - - AI PPA / floorplanning automation
    - Point-tool spend for layout, PPA search, and flow optimization modules
    - General-purpose ML tooling unrelated to chip design
    - Physical-design and CAD teams
    - Directly relevant because public incumbent proof is strongest here today
  - - Full-stack AI chip-design automation
    - Workflow automation from placement toward verification, design closure, and broader platform orchestration
    - Finished chips, wafer output, foundry capacity
    - Silicon-platform and engineering leaders
    - This is Ricursive’s core thesis and the largest plausible software layer it could capture if proof holds
  - - Custom-silicon program design budgets
    - Automation overlays and incremental software/services spend attached to strategic ASIC or accelerator programs
    - Tapeout manufacturing cost and cloud inference revenue
    - Program owners for hyperscaler, fabless, or OEM chip programs
    - Defines the likely near-term served market where ROI from speed is highest
  - - Fab equipment and foundry capex
    - None
    - Wafer-fab tools, process equipment, packaging lines, foundry revenue
    - Semiconductor manufacturers and foundries
    - Important demand context but not Ricursive TAM
  - - AI accelerator sales and cloud AI revenue
    - None
    - GPU, TPU, Trainium, Maia, cloud-service revenue
    - Cloud and platform business units
    - A downstream demand signal, not a software market Ricursive invoices
