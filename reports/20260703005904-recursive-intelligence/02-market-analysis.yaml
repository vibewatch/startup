- id: drivers-constraints
  title: Growth drivers, adoption constraints, and valuation relevance
  body: |-
    The demand side is real. Hyperscalers now run first-party silicon programs at scale: AWS markets Trainium for AI training and inference, Google says TPUs power Gemini and its broader AI stack, and Microsoft says Maia 200 improves inference economics inside its own fleet. Combined with Lightspeed’s point that top silicon programs still consume years and hundreds of millions of dollars, the growth-driver logic is strong. Ricursive does not need every semiconductor company in the world to buy its platform to matter; it only needs a meaningful share of the custom-silicon programs where time and talent are most scarce.

    The constraint side is just as important. Public proof remains strongest in floorplanning and PPA optimization, while broader claims into verification and full-stack automation are not yet backed by named design wins or public benchmarks. New Scientist’s skepticism around AlphaChip’s public proof matters because buyers of mission-critical design software are unusually sensitive to reproducibility, secrecy, and switching costs. Export controls add another layer of friction by shaping which customers, foundries, and partners can be served cleanly. For valuation, that means Ricursive should be underwritten on proof milestones and enterprise adoption evidence rather than on broad TAM rhetoric alone.
