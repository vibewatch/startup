  title: The real market is narrower than the narrative, but still valuable
  body: The venture narrative around custom silicon is directionally correct about urgency, yet the defendable spend pool today is still a software layer inside chip design rather than semiconductor capex or AI-chip revenue. That narrower framing lowers TAM inflation risk while still leaving a meaningful multi-billion-dollar SAM if full-stack proof materializes.
  claimRefs:
  - CM020
  - CM022
  - CM027
  - CM038
- calloutType: risk
  title: Proof beyond floorplanning is the gating commercial variable
  body: Public category validation exists for floorplanning and PPA optimization, but Ricursive has not yet published named design wins, pricing, or verification benchmarks. Until that changes, enterprise adoption should be modeled as a staged trust curve instead of an immediate platform-replacement story.
