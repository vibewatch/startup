    - QM030
  - type: conflicting-data
    severity: material
    topic: benchmark-proof
    missingEvidence: A current public benchmark set comparing AI-assisted layouts and verification outcomes against expert human teams and incumbent commercial tools.
    whyItMatters: The gap between published AlphaChip success and later expert skepticism directly affects trust, pilot scope, and the size of the reachable market.
    diligencePath: Commission an independent benchmark across modern chip blocks and verification workloads using neutral academic or industrial evaluators.
    relatedQuestionRefs:
    - QM011
    - QM012
