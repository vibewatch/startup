chapter:
  number: 2
  title: Market Analysis
  summary: Recursive Intelligence, publicly branded Ricursive Intelligence, should be analyzed as a narrow but strategically important AI chip-design automation company inside broader EDA, not as a proxy for semiconductor capex or AI-chip revenue. The most defensible upper-bound market lens is the roughly 13.3-13.5 billion dollar incumbent design-software pool represented by Synopsys and Cadence revenue, while a narrower 2-5 billion dollar near-term SAM and 0.5-1.5 billion dollar beachhead are more realistic for multi-stage automation that still lacks public design-win proof. Demand drivers from hyperscaler custom silicon and AI-related fab expansion are real, but adoption remains gated by workflow trust, integration cost, benchmark proof, and export-control friction.
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: |-
    Recursive Intelligence, publicly branded Ricursive Intelligence, should be analyzed as an AI chip-design automation platform, not as a semiconductor manufacturer, foundry, fab-equipment vendor, or AI-chip seller. The company’s own site, launch materials, and independent coverage all place it inside the software layer that helps engineers create custom silicon faster. That distinction matters because the temptation in frontier-AI investing is to borrow giant adjacent numbers such as AI-accelerator revenue, foundry revenue, or fab-equipment capex and call them TAM. Those pools are demand drivers or context, but they are not the market Ricursive sells into.

    The most relevant included spend is software and services that improve chip-design workflows: floorplanning, PPA optimization, design closure, verification assistance, and eventually architecture exploration if the company proves it can extend beyond layout. The status-quo substitute is still a labor-heavy incumbent EDA flow where engineering teams iterate manually inside established tools until closure. The closest adjacent substitutes are AI modules already sold by Synopsys and Cadence. Those incumbents validate that the category exists, but they also narrow the boundary: Ricursive’s credible market is the automation layer inside chip design, not the whole semiconductor value chain.
