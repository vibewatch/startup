  - type: private-evidence-only
    severity: material
    topic: design-wins
    missingEvidence: Named customer references, public production design wins, or benchmark case studies that go beyond founder pedigree and financing velocity.
    whyItMatters: Commercial proof would determine whether Ricursive can move from a research-led narrative to repeatable budget capture in real programs.
    diligencePath: Request customer references, pilot-to-production conversion data, and benchmark reports under NDA from Ricursive and prospective design-partner customers.
    relatedQuestionRefs:
