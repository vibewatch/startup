  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hyperscaler custom-silicon race
    - Positive
    - Now through 2028+
    - Sustains buyer urgency for faster design cycles and raises willingness to test automation on strategic programs
    - Map active first-party silicon roadmaps and where schedule compression is worth the most
  - - Incumbent AI-EDA proof points
    - Positive
    - Now
    - Normalizes AI-assisted design procurement and makes Ricursive easier to explain inside engineering teams
    - Benchmark incumbent case studies against Ricursive pilot claims
  - - Floorplanning and PPA pain
    - Positive
    - Persistent
    - Long design cycles and manual closure loops create a high-value problem to solve
    - Quantify labor, compute, and schedule cost per advanced program
  - - Expansion beyond placement into verification
    - Positive if proven
    - 2026-2028
    - Would increase SAM materially by moving Ricursive from point tool to platform budget
    - Demand public or customer-backed proof that verification claims work in practice
  - - Switching cost into entrenched EDA stacks
    - Negative
    - Persistent
    - Even superior point performance may not convert if integration and methodology risk is too high
    - Test migration effort, workflow interoperability, and rollback options in pilots
  - - Public proof gap beyond narrow tasks
    - Negative
    - Now
    - Missing named wins, pricing, and verification benchmarks keeps commercial trust below the headline narrative
    - Request benchmark packs, customer references, and proof of repeatability
  - - Export-control and enforcement risk
    - Negative
    - Now through 2026+
