- id: switching-distribution-substitutes
  title: Switching costs, distribution, and supply access still favor incumbents and substitutes
  body: 'The public packaging comparison is asymmetric. Synopsys pairs DSO.ai with AWS deployment primitives
    such as ParallelCluster, Batch, and scheduler support, which implies that an existing Synopsys customer
    can extend into AI optimization without re-architecting its operating model. Cadence emphasizes designer-cockpit
    reuse and an agentic layer that calls underlying Cadence tools, which similarly keeps the buyer inside
    the incumbent environment. Siemens''s relevance is narrower, but it still benefits from existing enterprise
    placement wherever custom-IC characterization or variation-aware design is already standardized.


    Recursive, by contrast, asks a buyer to add a new vendor before the public record shows the typical
    trust artifacts that mature semiconductor procurement functions want to see. Public materials do not
    disclose pricing, customer names, compliance posture, or benchmarked deployments. That does not prove
    the startup lacks those assets; it means outside diligence cannot yet treat them as demonstrated.
    The result is a switching-cost disadvantage even if the product thesis is broader than incumbent point
    tools.


    Substitutes compare well on adoption friction. Open-source AlphaChip tooling is free in software terms
    but expensive in talent and experimentation. Internal hyperscaler build-outs are operationally demanding,
    yet they maximize control for the largest buyers. Merchant accelerators from NVIDIA and AMD are the
    easiest option of all because procurement can solve an immediate AI-capacity problem without launching
    a new design flow. Recursive therefore has to sell not just better automation, but a reason to bear
    more switching friction than an incumbent extension or a simpler hardware-purchase path.'
