  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Recursive pricing and packaging
    missingEvidence: Public list pricing, contract structure, deployment packaging tiers, or compute-cost
      assumptions for Recursive are not disclosed in retained sources.
    whyItMatters: Without packaging and pricing detail, it is impossible to compare procurement friction
      or ROI against incumbent EDA suites or substitute paths.
    diligencePath: Request a current product deck, pricing sheet, sample MSA or order form, and compute-cost
      assumptions under NDA.
    relatedQuestionRefs:
    - QP018
    - QP020
    relatedTableRefs:
    - TP003
    - TP004
  - type: missing-source
    severity: material
    topic: Recursive customer references and benchmark wins
    missingEvidence: No retained public source names a Recursive customer, taped-out design win, or benchmark
      against Synopsys DSO.ai, Cadence Cerebrus or ChipStack, or Siemens Solido.
    whyItMatters: Competitive underwriting depends on whether Recursive can prove production improvement
      rather than simply narrate technical ambition.
    diligencePath: Request customer reference calls, before-and-after benchmark decks, evaluation summaries,
      or pilot conversion data under NDA.
    relatedQuestionRefs:
    - QP019
    - QP028
    relatedTableRefs:
    - TP002
    - TP003
  - type: private-evidence-only
    severity: material
    topic: Enterprise trust and compliance posture
    missingEvidence: Public evidence does not show SOC 2, ISO 27001, export-control workflow, model-governance
      controls, or enterprise support commitments for Recursive.
    whyItMatters: A buyer choosing between a new startup and entrenched EDA vendors will often screen
      on procurement and trust before feature depth.
    diligencePath: Request a security whitepaper, compliance roadmap, export-control process, support
      SLAs, and current procurement blockers from pilots.
    relatedQuestionRefs:
    - QP022
    - QP028
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: Normalized benchmark across Recursive and incumbents
    missingEvidence: Public sources do not provide a normalized benchmark comparing Recursive, DSO.ai,
      Cerebrus or ChipStack, Solido, and open-source AlphaChip on the same modern design set.
    whyItMatters: Without a normalized benchmark, it is hard to know whether Recursive's claimed workflow
      breadth is truly differentiated or simply differently narrated.
    diligencePath: Request evaluation methodology, design-set coverage, and per-step benchmark outputs
      across placement, verification, timing closure, and architecture exploration.
    relatedQuestionRefs:
    - QP021
    - QP028
    relatedTableRefs:
    - TP003
  - type: stale
    severity: minor
    topic: Long-tail entrant universe
    missingEvidence: Public 2026 evidence on long-tail entrants such as XCENA or other stealth chip-design
      startups is thin or stale relative to the incumbent and substitute landscape retained here.
    whyItMatters: A refresh could reveal additional venture-backed design-automation startups that change
      the direct-peer set or pricing pressure narrative.
    diligencePath: Re-run entrant discovery on every refresh and prioritize new 2026 or 2027 product or
      funding pages before expanding the profile table.
    relatedQuestionRefs:
    - QP031
    - QP032
    relatedTableRefs:
    - TP001
    - TP002
