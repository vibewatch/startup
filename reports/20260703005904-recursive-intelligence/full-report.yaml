      - number: '3.2'
        title: Competitor profiles show incumbents win on proof and startups win mostly on narrative
        blocks:
          - type: paragraph
            body: >-
              Synopsys and Cadence are the strongest direct competitors because their AI products are already packaged
              as extensions of existing enterprise flows. DSO.ai is framed as autonomous RTL-to-GDSII optimization with
              cloud deployment paths on AWS. Cerebrus is framed as AI-driven flow optimization, and ChipStack adds an
              explicit agentic story around autonomous design and verification. Siemens is less of a direct full-flow
              digital signoff rival, but it is still relevant because Solido addresses custom-IC variation, simulation,
              and characterization with AI-enabled tooling and installed enterprise usage. Together, these incumbent
              products mean buyers do not have to suspend trust or procurement standards to test AI assistance in chip
              design.


              Recursive's public differentiation is broader ambition: a self-improving platform intended to compress
              more of the design cycle than a point optimizer. The company also has unusually strong founder-market fit
              through AlphaChip, RL-CCD, Insta, C3PO, and prior work on Gemini, Claude, Grok, and TPUs. However, the
              public record is still thin where buyers care most. No retained source names a Recursive customer, a
              taped-out benchmark win, or a public before-and-after comparison against DSO.ai, Cerebrus, ChipStack, or
              Solido. Pricing is equally opaque across the startup and the incumbents, so public comparison must focus
              on scope, workflow fit, and proof rather than on normalized contract economics.


              The entrant cohort is earlier still. Cognichip looks closest to a direct design-automation entrant because
              it is pitching AI to help design chips. MatX and Rebellions are more adjacent: both are hardware-led and
              can compete for budget or strategic attention without offering the same software layer. That makes them
              less direct feature competitors than Recursive, but still relevant because every dollar, engineer, and
              roadmap debate diverted toward hardware alternatives makes it harder for a new automation vendor to own
              the customer conversation.
