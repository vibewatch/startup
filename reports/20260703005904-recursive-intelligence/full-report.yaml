            body: >-
              The milestone record shows a company moving quickly from research pedigree to capitalized buildout, but
              not yet to public commercial proof. Pre-company credibility comes from the AlphaChip work, after which
              Ricursive publicly launched in December 2025, broadened its thesis through Sequoia’s January 2026 podcast,
