  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision chain from founder scarcity and market need to the current track / research-more recommendation.
    data:
      nodes:
        - id: n1
          label: Rare founders and AlphaChip credibility
          detail: Goldie and Mirhoseini bring unusual credibility in AI-driven chip design.
        - id: n2
          label: Real market bottleneck
          detail: Hyperscalers keep investing in custom AI silicon and faster iteration.
        - id: n3
          label: $4B mark set early
          detail: Seed to Series A step-up happened before public financial disclosure.
        - id: n4
          label: Incumbent AI-EDA products exist
          detail: Synopsys and Cadence already sell AI chip-design automation.
        - id: n5
          label: Public revenue proof absent
          detail: No public Ricursive revenue, margin, ARR, or customer count disclosed.
        - id: n6
          label: Adverse technical critique
          detail: Outside experts dispute whether AlphaChip-style superiority is fully proven.
        - id: n7
          label: 'Recommendation: Track / research-more'
          detail: The valuation can be watched, but not confidently chased, until commercial proof improves.
      edges:
        - from: n1
          to: n7
          label: supports upside
        - from: n2
          to: n7
          label: supports upside
        - from: n3
          to: n7
          label: sets entry discipline
        - from: n4
          to: n7
          label: raises bar for proof
        - from: n5
          to: n7
          label: limits conviction
        - from: n6
          to: n7
          label: raises downside risk
    approximationNotes: >-
      Flow is analytical rather than mechanical; it compresses the main valuation drivers into one IC-ready
      recommendation path.
    claimRefs:
