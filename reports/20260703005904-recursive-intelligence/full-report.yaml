      - number: '4.3'
        title: Public Traction, Metric Gaps, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are financing speed, founder pedigree, and technology credibility,
              not financial performance. Ricursive disclosed $335 million raised, and TechCrunch plus Crunchbase
              reported a jump from a $35 million seed at a $750 million valuation to a $300 million Series A at a $4
              billion valuation in less than two months. PRNewswire said the new money is earmarked for team growth and
              compute infrastructure, while DeepMind's AlphaChip history and TechCrunch's account of interest from major
              chipmakers show why investors are willing to finance the team so aggressively. Those are real signals of
              market belief, but they are not substitutes for revenue, pricing, or retention.


              The private-metric gap remains the chapter's central blocker. No reviewed public source discloses revenue,
              ARR, current customer count, named paying accounts, gross margin, cash, burn, runway, or debt. Even the
              next-round trigger is opaque: public evidence suggests cash is being spent on research talent, compute,
              and platform buildout, but not how quickly or against what commercial milestones. Relative to fab or
              cloud-infrastructure startups, Ricursive is less capital intensive because it is not publicly building
              plants or buying inventory; relative to ordinary software startups, it is still materially capital
              intensive because compute and scarce semiconductor talent sit at the center of delivery. Publicly, the
              company looks well financed for research acceleration but not yet underwriteable for revenue durability.
