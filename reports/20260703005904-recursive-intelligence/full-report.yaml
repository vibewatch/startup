      - number: '6.4'
        title: Durability, concentration, and the diligence still required
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public evidence is weakest. No retained source discloses customer count,
              pilot-to-production conversion, contract length, NRR, GRR, renewal cadence, or even a clean split between
              evaluation accounts and production accounts. That absence should not be read as a sign of failure; plenty
              of very young infrastructure companies keep these numbers private. But it does mean the chapter cannot
              responsibly infer retention quality, expansion efficiency, or broad installed-base health from founder
              pedigree or fundraising velocity.


              Concentration risk is also impossible to size from the public record, which is itself a risk signal. A
              company can have broad inbound interest yet still be commercially dependent on one or two marquee design
              partners for validation, roadmap feedback, and future bookings. If Ricursive’s first visible reference
              customer ends up being a frontier AI lab or a top-tier chip vendor, that win would be strategically
              valuable—but it could also create negotiation leverage for the customer and distort the company’s revenue
              mix. Until management discloses more, the honest posture is to preserve the gap rather than fill it with
              logos, NPS, or retention claims that are not public.


              Customer diligence therefore needs to go directly after the hidden variables. The most decision-useful
              asks are a named reference pack, a pilot funnel with conversion status, redacted contract structures,
              workflow placement inside existing EDA stacks, evidence of tapeout or verification outcomes, and
              concentration data for both signed customers and near-term pipeline. Ricursive may well have excellent
              early customers behind NDAs. The current public record simply does not prove it yet.
            claimRefs:
              - CU027
              - CU028
              - CU029
