  - id: TV008
    title: Exit readiness table
    columns:
      - Route
      - Readiness
      - What supports it
      - What blocks it
      - What changes the view
    rows:
      - - Next private round
        - Medium
        - Elite syndicate and founder scarcity can still attract capital.
        - Another round without customer or benchmark proof would raise compression risk.
        - Show paid traction and keep burn under control.
      - - Strategic partnership / channel deal
        - Medium-high
        - Target customers include major chip makers and cloud labs; strategic interest is visible.
        - Interest is not yet disclosed as recurring revenue or production deployments.
        - Announce meaningful design wins or embedded workflow integrations.
      - - Strategic sale
        - Low-medium
        - Large EDA, compute, or hyperscaler players could value talent and workflow IP.
        - Buyers would still want evidence that differentiation is durable and integrable.
        - Demonstrate a must-have capability that incumbents cannot cheaply replicate.
      - - IPO / public route
        - Low
        - The market rewards AI infrastructure scarcity when disclosure quality is strong.
        - Ricursive lacks public revenue, margin, customer, and filing-grade transparency.
        - Build IPO-grade disclosure, revenue scale, and governance visibility.
    notes: Readiness is judged against public evidence only; private diligence may improve or worsen each route materially.
    claimRefs:
      - CV035
