              coverage show that the $4 billion valuation is being underwritten more on founder pedigree and
              infrastructure importance than on disclosed revenue or customer referenceability. Public searches also did
              not surface named regulatory events or commercial partnerships, so those areas remain explicit diligence
              gaps rather than cleared checkpoints.
