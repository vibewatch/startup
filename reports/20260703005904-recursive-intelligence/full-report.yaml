  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scorecard across the dimensions that most affect whether Ricursive deserves more than a narrative
      valuation.
    data:
      items:
        - label: Market need
          value: 8/10
          note: Custom AI silicon demand and design complexity are real and growing.
        - label: Founder / talent quality
          value: 9/10
          note: AlphaChip pedigree and recruiting signal are unusually strong.
        - label: Technical proof visibility
          value: 6/10
          note: Concept is credible, but public benchmark data versus incumbents is still thin.
        - label: Customer proof
          value: 3/10
          note: Strategic interest is visible; named paying customer evidence is not.
        - label: Economics visibility
          value: 2/10
          note: No public revenue, margin, or ARR disclosure yet.
        - label: Competitive insulation
          value: 4/10
          note: Incumbent EDA vendors already commercialize AI-assisted design tools.
        - label: Valuation support
          value: 3/10
          note: Current price implies sub-venture-style returns unless milestones improve fast.
        - label: Evidence quality
          value: 5/10
          note: Funding and market narrative are well sourced; monetization evidence remains private.
    approximationNotes: >-
      Scores are analytical judgments built from sourced evidence; they are not company disclosures or quantitative
      ratings from management.
    claimRefs:
      - CV014
      - CV024
      - CV025
      - CV031
      - CV036
      - CV045
      - CV049
      - CV050
