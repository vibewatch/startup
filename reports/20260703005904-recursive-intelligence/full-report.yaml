  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Recursive Intelligence, publicly branded Ricursive Intelligence, should be analyzed as an AI chip-design
              automation platform, not as a semiconductor manufacturer, foundry, fab-equipment vendor, or AI-chip
              seller. The company’s own site, launch materials, and independent coverage all place it inside the
              software layer that helps engineers create custom silicon faster. That distinction matters because the
              temptation in frontier-AI investing is to borrow giant adjacent numbers such as AI-accelerator revenue,
              foundry revenue, or fab-equipment capex and call them TAM. Those pools are demand drivers or context, but
              they are not the market Ricursive sells into.


              The most relevant included spend is software and services that improve chip-design workflows:
              floorplanning, PPA optimization, design closure, verification assistance, and eventually architecture
              exploration if the company proves it can extend beyond layout. The status-quo substitute is still a
              labor-heavy incumbent EDA flow where engineering teams iterate manually inside established tools until
              closure. The closest adjacent substitutes are AI modules already sold by Synopsys and Cadence. Those
              incumbents validate that the category exists, but they also narrow the boundary: Ricursive’s credible
              market is the automation layer inside chip design, not the whole semiconductor value chain.
            claimRefs:
