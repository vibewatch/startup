  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market need
        - AI labs and hyperscalers clearly need faster custom-silicon iteration.
        - A real bottleneck does not guarantee Ricursive captures attractive economics.
        - Multiple paying programs and expansion evidence across more than one buyer.
      - - Product promise
        - AlphaChip pedigree and recursive AI-hardware co-design support a meaningful product thesis.
        - Public proof still does not show reproducible production outperformance versus incumbent EDA workflows.
        - Independent benchmark data on time-to-design, verification throughput, and PPA.
      - - Customer proof
        - Inbound strategic interest suggests real buyer curiosity.
        - Strategic interest is not the same as paid deployment or renewal behavior.
        - Named paying customers with production or renewal evidence.
      - - Financial support
        - Large capital base can fund talent and compute buildout.
        - No public revenue, ARR, gross margin, or pricing disclosure supports the mark yet.
        - Revenue bridge, pricing model, and margin disclosure.
      - - Competition
        - Ricursive could become a strategic enabling layer for chip makers and cloud labs.
        - Synopsys and Cadence already ship AI-assisted automation into customer workflows.
        - Evidence that Ricursive materially outperforms incumbent baselines on important designs.
      - - Policy and technical risk
        - Founder credibility and compute demand can keep investor attention high.
        - AlphaChip-style superiority remains contested and export-control friction can slow commercialization.
        - Third-party technical validation plus evidence that policy constraints are manageable.
      - - Exit logic
        - Scarcity could support another premium private round or partnership.
        - >-
          Near-term IPO support is weak without disclosure and the current mark already absorbs much of the upside
          narrative.
        - Data-room quality disclosures and returns that exceed a low-teens percentage risk premium over the last round.
    notes: >-
      Anti-thesis arguments focus on valuation support and commercialization evidence, not on denying the importance of
      AI-chip design automation.
