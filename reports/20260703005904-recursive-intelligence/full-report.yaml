          detail: ML, verification, physical design, and systems expertise.
        - id: rules
          label: Export rules
          detail: D:5 / Macau screening and remote-access controls.
        - id: data
          label: Customer design data
          detail: Sensitive PDK, IP, and workflow context.
      edges:
        - from: synopsys
