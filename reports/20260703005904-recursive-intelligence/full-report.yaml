  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context, dilution math, and why the $4B mark needs discipline
        blocks:
          - type: paragraph
            body: >-
              Ricursive jumped from a roughly $750 million December 2025 seed valuation to a January 2026 $4 billion
              post-money Series A in less than two months. That step-up is possible in the current frontier-AI market,
              but it is still an aggressive reset for a company that has not publicly disclosed revenue, ARR, gross
              margin, customer count, or named paid design programs. The available evidence supports a
              founder-and-optionality round: Anna Goldie and Azalia Mirhoseini carry rare AlphaChip and TPU credibility,
              the company is attacking a real design bottleneck, and elite investors syndicated quickly behind the
              story. The financing math is also important. A $300 million primary at a $4 billion post implies roughly a
              $3.7 billion pre-money valuation and only about 7.5% new-money dilution, which means the round moved the
              reference price much more than it changed the ownership base. Public evidence supports the existence of a
              scarce market-clearing round; it does not yet support paying above that round without fresh milestones.
              Because public terms do not disclose liquidation preferences or governance protections, the headline mark
              should be treated as a ceiling for entry discipline rather than as intrinsic value.
            claimRefs:
