      - number: '8.3'
        title: Scenario framing, downside triggers, and return math
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Ricursive lacks technical talent; it is that valuation may be running ahead
              of reproducible commercial differentiation. New Scientist documented expert skepticism that
              AlphaChip-style claims have publicly proven consistent superiority over expert designers or commercial
              tools, while Synopsys and Cadence already market production AI optimization products into real customer
              workflows. That creates a high bar for Ricursive: the company must prove not only that AI can help chip
              design, but that its specific system creates enough measurable speed, verification, or PPA advantage to
              pull budget away from incumbents or sit above them as an enabling layer. The bear case therefore centers
              on execution mismatch: elite founders, heavy compute and hiring spend, but slow conversion into paid
              deployments or benchmarked outcomes. The base case keeps valuation around the current mark because capital
              remains abundant for scarce AI infrastructure stories. The bull case requires named customers, benchmarked
              design wins, and evidence that the company can compound from a $4 billion entry into at least a credible
              1.5x-2.0x gross value expansion rather than merely defend the last round.
