  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target customer archetypes, buyer-user-payer map, and workflow position
        blocks:
          - type: paragraph
            body: >-
              The public record supports a fairly specific customer shape even though it does not support a public
              customer list. Ricursive is not selling finished chips. It is selling a chip-design acceleration thesis
              into organizations that already carry expensive silicon roadmaps, large compute budgets, and painful PPA
              trade-offs. That points first toward frontier AI labs and hyperscalers, then toward large fabless
              semiconductor vendors, and then toward system companies that now justify in-house ASIC programs because
              inference scale or hardware differentiation matters economically. The visible analogs all live in that
              world: TSMC’s huge foundry customer base, AWS and Google’s custom-silicon programs, and Cadence and
              Synopsys customers optimizing advanced-node SoCs.


              Within one account, the buyer, user, and payer are unlikely to be the same person. The buyer is probably a
              compute, platform, or silicon program owner who cares about time-to-tapeout and total system economics.
              The user is more likely a physical-design, verification, or architecture team living inside an EDA
              workflow. The payer is the broader enterprise budget owner funding the chip roadmap. That split matters
              because it implies a long and technically mediated sales motion, not lightweight product-led adoption.
              Ricursive’s own jobs board reinforces that interpretation: public hiring remains concentrated in EDA
              algorithms, infrastructure, verification, research, and security rather than field sales or scaled
              customer success.


              Sequoia’s “designless” framing is also informative. The pitch is not merely that existing chip teams can
              work faster; it is that more companies might become chip buyers or chip program sponsors without standing
              up gigantic in-house design organizations. If that thesis is right, Ricursive’s TAM could extend beyond
              classic fabless vendors into AI labs and system companies that want custom silicon but do not want to
              reproduce a full Broadcom-, Google-, or NVIDIA-style chip organization from scratch. But that is still a
              target-customer hypothesis, not a demonstrated Ricursive book of business.
