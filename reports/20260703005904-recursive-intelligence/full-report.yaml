  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans direct incumbents, adjacencies, substitutes, and capital-backed entrants
        blocks:
          - type: paragraph
            body: >-
              Recursive Intelligence, publicly branded Ricursive Intelligence, is not entering a blank category. The
              clearest direct commercial alternatives are Synopsys DSO.ai and Cadence Cerebrus, with Cadence's 2026
              ChipStack AI Super Agent extending that rivalry from back-end optimization into front-end design and
              verification. Siemens Solido widens the incumbent field in adjacent custom-IC workflows by marketing
              AI-enabled variation-aware design, IP validation, characterization, and simulation. Those three incumbent
              families matter more than most early startups because they already sit inside semiconductor organizations
              that trust their support models, signoff flows, and procurement motions.


              The substitute set is equally important. AlphaChip and the open-source circuit_training repository make
              part of the reinforcement-learning floorplanning lineage reproducible for elite internal teams. Google,
              AWS, and Microsoft each publicly describe first-party AI accelerators, which implies that the most
              advanced buyers can respond to hardware bottlenecks through internal silicon programs rather than by
              adopting an external automation startup. A simpler substitute is merchant hardware: NVIDIA and AMD let a
              buyer solve near-term AI compute needs through procurement rather than through a multiyear custom-chip
              program.


              Likely entrants add one more layer of pressure. Cognichip is explicitly trying to apply deep learning to
              chip design, while MatX and Rebellions show that adjacent silicon startups can pull capital, talent, and
              buyer attention into hardware-led alternatives. The practical competitive map is therefore not just
              Recursive versus another young startup; it is Recursive versus entrenched EDA incumbents, open-source or
              internal build paths, and capital-intensive hardware options that can make custom design unnecessary for
              many buyers.
