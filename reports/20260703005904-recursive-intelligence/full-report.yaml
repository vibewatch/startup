    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, naming, and current positioning
        blocks:
          - type: paragraph
            body: >-
              The first diligence issue is identity hygiene. The requested company name in this run is Recursive
              Intelligence, but the public corpus consistently uses Ricursive Intelligence, while the official homepage
              title adds a further typo and renders the brand as Riculsive Intelligence. TechCrunch also warned readers
              not to confuse Ricursive with Richard Socher’s similarly named startup Recursive, which makes the alias
              risk real rather than cosmetic. Setting that aside, the operating story is consistent: Ricursive presents
              itself as a frontier AI lab using AI to accelerate semiconductor design, and TechCrunch’s February profile
              makes clear that the company is selling software that designs chips rather than trying to fabricate chips
              itself. Independent coverage places the company in Palo Alto, and the current stage is best described as
              private and post-Series A rather than stealth or merely conceptual. For later chapters, the key overview
              judgment is that identity confusion exists at the naming layer, but the product thesis, founders, and
              funding path all point to one underlying company.
