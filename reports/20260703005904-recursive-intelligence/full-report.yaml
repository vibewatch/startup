  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Valuation and commercial proof are the top residual risks
        blocks:
          - type: paragraph
            body: >-
              Recursive Intelligence, publicly branded as Ricursive Intelligence, has raised enough capital to be judged
              against commercial evidence rather than just technical promise. Within months of launch the company
              reached a $4 billion valuation, yet the reviewed public corpus still centers on founders, AlphaChip
              lineage, and the ambition to compress design cycles rather than on named customers, public benchmarks, or
              repeatable economics. That mismatch matters because the intended buyers are major semiconductor companies
              with long qualification cycles, deep internal teams, and the ability to wait for incumbent vendors to
              close feature gaps. The main risk is therefore not that the thesis is incoherent; it is that valuation has
              moved materially ahead of public proof, leaving little room for product, conversion, or pricing slippage.
              In that setup, even a technically impressive pilot can still fail to justify price if it does not convert
              into repeated, production-grade customer evidence fast enough. Speed matters enormously here.
