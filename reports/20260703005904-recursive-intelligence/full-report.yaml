  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              Ricursive's public commercial story is clearer in shape than in dollars. TechCrunch says the company is
              building AI tools that design chips, not chips themselves, while Lightspeed and the company describe a
              full-stack platform for AI-driven semiconductor design. That points toward a design-software monetization
              model rather than chip sales: the most plausible revenue surfaces are enterprise platform licenses,
              design-partner engagements, and recurring support or maintenance layers similar to mature EDA vendors.
              Public sources do not disclose which of those streams exists today, whether revenue is recognized upfront
              or over time, or whether any customer is already paying for production use.


              The GTM motion also looks highly bespoke. TechCrunch reported that Nvidia, AMD, Intel, and other chip
              makers are target customers, that Ricursive will not name early customers, and that the founders can
              choose first development partners. That is the opposite of a self-serve SaaS funnel. It suggests
              long-cycle, technically intensive selling into semiconductor design organizations, likely with pilot,
              verification, and implementation work before repeatable recurring revenue exists. Public pricing is
              entirely absent across Ricursive's own surfaces and the reviewed press coverage, so the best supportable
              conclusion is that commercialization, if underway, is quote-based and partner-led rather than broadly
              productized.
