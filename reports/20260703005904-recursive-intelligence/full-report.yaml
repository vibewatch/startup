      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is neither bearish on the concept nor comfortable on the underwriting. Revenue
              quality could become attractive if Ricursive matures into a mission-critical design platform with
              recurring software, IP, maintenance, and services economics similar to public EDA vendors. The problem is
              that public evidence does not yet prove any of those layers exist at scale. There is no disclosed price
              book, no revenue-recognition policy, no customer proof beyond unnamed interest, and no evidence that
              human-in-the-loop design and verification costs have been pushed low enough to support software-like
              margins.


              Capital dependency is lower than it would be without the $335 million financing cushion, but still
              unresolved because cash, burn, and runway are undisclosed. The most likely failure mode is not fab
              overbuild; it is a long, expensive productization cycle in which compute, engineering, and
              customer-delivery costs outrun repeatable enterprise revenue. The core diligence blockers are
              straightforward: signed customer contracts, current ARR or booked pilot revenue, pricing and
              implementation scope, support burden, gross-margin bridge, and a current cash-and-burn model. Until those
              are available, the right public-only conclusion is that Ricursive is a well-capitalized R&D platform with
              promising eventual economics but unverified present-day commercialization.
