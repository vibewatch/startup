      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Ricursive’s earliest buyers are not every chip user everywhere; they are the
              organizations where schedule compression is worth millions and where custom silicon is already strategic.
              TechCrunch says any company that makes electronics and needs chips is in scope, but the realistic first
              wave is narrower: hyperscaler silicon teams, advanced-node fabless chip designers, and systems companies
              building custom ASICs. Those buyers already live with long design cycles, expensive engineering teams, and
              increasing pressure to differentiate through custom silicon.


              The user base is more specific than the buyer set. Physical-design, CAD, and verification teams would
              evaluate the product first because incumbent examples from Synopsys and Cadence are still rooted in PPA
              and flow optimization. Budget authority likely starts in those groups and expands upward once the tool
              touches multiple workflow stages or enterprise compute commitments. The adoption path should therefore be
              thought of as a staged trust curve: benchmark credibility, pilot on one block, extension into verification
              or signoff, and only then program-wide standardization. That sequencing keeps Ricursive’s near-term SOM
              narrower than its headline narrative.
