        - id: siemens
          label: Siemens
          detail: Custom IC, simulation, and multiphysics ecosystem.
        - id: foundry
          label: Qualified signoff flows
          detail: Accepted timing, DRC, SI, PI, and manufacturability reports.
        - id: buyers
          label: Large chipmaker buyers
          detail: Sophisticated accounts with internal teams and ASIC agendas.
        - id: compute
          label: Compute infrastructure
          detail: Research and model-execution capacity.
        - id: talent
