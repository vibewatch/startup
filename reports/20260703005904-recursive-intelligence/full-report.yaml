      - number: '8.2'
        title: Investment thesis, anti-thesis, and comp math
        blocks:
          - type: paragraph
            body: >-
              The positive underwriting case is straightforward. Chip design is slow, expensive, and a real bottleneck
              for AI infrastructure; hyperscalers and model builders continue investing in custom silicon; and Ricursive
              is led by founders whose AlphaChip work already shaped multiple Google TPU generations. The negative case
              is just as important. Public customer proof is still absent, public financial disclosure is minimal, and
              incumbent EDA vendors are already commercializing AI-assisted design workflows that promise better
              power-performance-area results and 5x-10x productivity gains. July 2026 public comp snapshots imply
              roughly 10.5x revenue for Synopsys, 18.6x for Cadence, 21.9x for NVIDIA, and 24.4x for AMD. Those are
              premium multiples attached to companies with disclosed revenue, deep installed bases, and mature
              go-to-market motions. Working backward from those references shows how much operating substance Ricursive
              would need before a $4 billion price looks durable rather than simply fashionable. The right reading is
              that Ricursive has a high-quality market and product thesis, but still lacks customer and financial proof
              strong enough to clear the anti-thesis.
