  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Technical trust, export controls, and secure workflow requirements transmit into deployment timing, burn, revenue
      conversion, and valuation faster than the company’s public narrative suggests.
    data:
      nodes:
        - id: verification
          label: Verification gap
          detail: Need signoff-grade proof and human-supervised boundaries.
        - id: ipsec
          label: Trusted toolchain burden
          detail: IP security, traceability, and support-access controls.
        - id: export
          label: Export-control burden
          detail: Licenses, parent screening, and remote-user controls.
        - id: pilot
          label: Pilot qualification
          detail: Customer validation and workflow insertion.
        - id: delay
          label: Deployment delay
          detail: Longer path to production acceptance.
        - id: revenue
          label: Revenue ramp
          detail: Commercial conversion and account breadth.
        - id: burn
          label: Burn / runway
          detail: Compute and talent expense before scale.
        - id: valuation
          label: Valuation support
          detail: Ability to defend the current price and next round.
      edges:
        - from: verification
          to: pilot
        - from: ipsec
          to: pilot
        - from: export
          to: pilot
        - from: pilot
          to: delay
        - from: delay
          to: revenue
        - from: revenue
          to: burn
        - from: burn
          to: valuation
        - from: export
          to: valuation
    approximationNotes: The map highlights first-order transmission paths, not every possible feedback loop.
    claimRefs:
