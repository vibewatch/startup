companyProfile:
  summary: >-
    Recursive Intelligence, publicly styled Ricursive Intelligence, is a Palo Alto frontier AI lab founded by Anna
    Goldie and Azalia Mirhoseini to automate and compress semiconductor design cycles. The company’s pitch is a shift
    from fabless to “designless” custom silicon: customers provide workload requirements and the platform increasingly
    handles architecture, physical design, verification, and eventual manufacturing handoff. That thesis draws real
    credibility from the founders’ AlphaChip lineage and blue-chip investors, but the public package is still
    early—strong on technical ambition and funding proof, weak on disclosed revenue, customer traction, and operating
    controls.
