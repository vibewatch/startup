- id: milestones-hiring-and-adverse-context
  title: Milestones, hiring signals, and adverse context
  body: The milestone record shows a company moving quickly from research pedigree to capitalized buildout, but not yet to public commercial proof. Pre-company credibility comes from the AlphaChip work, after which Ricursive publicly launched in December 2025, broadened its thesis through Sequoia’s January 2026 podcast, and almost immediately began posting a concentrated set of Palo Alto roles across EDA, infrastructure, verification, security, and research. That hiring mix matters because it suggests a full-stack chip-design software effort rather than a narrow lab project. TechCrunch’s February coverage further sharpened the market wedge by saying Nvidia is both an investor and that Nvidia, AMD, Intel, and other chip makers are target customers. The adverse side is also real. CIOL’s skeptical framing and other noisy secondary coverage show that the $4 billion valuation is being underwritten more on founder pedigree and infrastructure importance than on disclosed revenue or customer referenceability.
    Public searches also did not surface named regulatory events or commercial partnerships, so those areas remain explicit diligence gaps rather than cleared checkpoints.
