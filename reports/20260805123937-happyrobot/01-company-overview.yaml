- id: funding-history-and-valuation
  title: Funding history and valuation
  body: 'HappyRobot''s financing history is unusually compressed: three priced rounds in roughly twenty months culminating in a unicorn valuation. The company announced a $15.6 million Series A around December 2024 led by Andreessen Horowitz, with Y Combinator and Ryder Ventures participating and early adopters including Circle Logistics and Uber Freight. A $44 million Series B (about €37.7 million) followed around September 2025, led by Base10 with participation from Andreessen Horowitz, Y Combinator, and a broader syndicate. On August 4, 2026, HappyRobot announced a $150 million Series C at a $1.2 billion post-money valuation, led by Prysm Capital and co-led by Eurazeo, with existing backers Andreessen Horowitz, Base10, and Y Combinator doubling down alongside strategic investors including Koch Disruptive Technologies, Kfund, Orange, T.Capital, Bankinter, Endeavor Catalyst, and Wave-X. The round brought total funding to roughly $200 million and was widely reported to have crowned a new freighttech unicorn. The $1.2 billion mark and lead-investor identities are corroborated across the company''s own announcement and multiple independent technology and freight-trade outlets, which is why those specific facts carry high confidence while revenue-multiple interpretation does not.'
