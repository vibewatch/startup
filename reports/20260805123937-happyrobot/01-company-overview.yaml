- id: scale-milestones-and-adverse-context
  title: Scale, milestones, and adverse context
  body: 'HappyRobot''s scale story is strong but leans heavily on company-claimed operating metrics. The company says it serves more than 150 enterprise customers — including DHL, Kuehne+Nagel, Uber Freight, Naturgy, Repsol, and LKW WALTER — and reports millions of tasks per month, agents going live in four to twelve weeks, one customer automating 28,000 hours of work monthly, a 9.4-out-of-10 customer-satisfaction score, more than 70% autonomous resolution on average, and revenue that grew roughly fivefold since its Series B. A November 2025 DHL press release independently corroborates a material deployment handling large volumes of emails and voice minutes, which lends outside support to the flagship-logo narrative. Two adverse threads temper the story. First, HappyRobot''s audited financials are not public, so widely cited annual recurring revenue figures near $50 million are third-party estimates rather than confirmed numbers. Second, the freight market it automates is experiencing record fraud in 2026 — with hundreds of millions in reported annual losses and a surge in flagged fraudulent entities — which is simultaneously a demand driver and a systemic risk to autonomous voice and email workflows. The milestone chronology below therefore pairs financing and scale proof points with these adverse and unresolved items.'
