company:
  name: HappyRobot
chapter:
  number: 1
  title: Company Overview
  summary: HappyRobot is a Y Combinator-born, Spanish-founded AI-agent company that turned autonomous "AI workers" for freight and logistics operations into a category-defining platform, reaching a $1.2 billion valuation in a $150 million Series C roughly twenty months after its first priced round, but its scale metrics are largely company-claimed and its audited financials remain private.
sections:
- id: identity-and-business-model
  title: Identity and business model
  body: 'HappyRobot is a private, venture-backed AI company that builds and deploys autonomous "AI workers" — conversational AI agents that execute mission-critical operational work such as phone calls, emails, document handling, scheduling, and negotiations — starting in freight and logistics and expanding into adjacent operations-heavy industries. The company frames itself as an "operating system for the real economy" and markets a thesis of "enterprise superintelligence," where AI agents and human teams compound an organization''s collective intelligence. Its own homepage and Series C announcement describe agents that run across voice, SMS, email, WhatsApp, webchat, Microsoft Teams, and Slack, integrated into transportation management systems, load boards, and telephony. The public identity is consistent across company surfaces and independent technology and freight-trade reporting, which describe HappyRobot as a freight-focused agentic-AI vendor that automates carrier sales, dispatch, check calls, appointment scheduling, and collections. That positioning matters for underwriting because the business rests on the claim that AI agents can reliably execute operational transactions, not merely chat, so identity and product credibility are inseparable from the funding narrative.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO023
  - CO026
  - CO038
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: 'HappyRobot was founded in 2022 by three Spanish co-founders — Pablo Palafox (chief executive officer), his brother Javier "Javi" Palafox (chief operating officer), and Luis Paarup (chief technology officer) — and went through Y Combinator''s Summer 2023 batch after pivoting from a computer-vision data-labeling tool toward logistics AI agents. Independent European and technology outlets describe Pablo Palafox as an AI researcher with a deep-learning doctorate and prior experience at large technology firms, which supports a founder-market-fit narrative anchored in applied AI rather than logistics operating experience. Governance disclosure is thin, as is typical for a private company at this stage: HappyRobot does not publish a full board roster, committee structure, or complete executive team on its public surfaces, and the founding trio concentrates key-person risk. Location is genuinely ambiguous in the public record — company and European coverage emphasize offices in San Francisco and Madrid, while some funding write-ups frame the company as Madrid- or New York-linked — so the precise single headquarters should be treated as an open diligence item rather than asserted. The public record therefore supports a founder-led, technically credible team with concentrated control and incomplete governance transparency.'
