- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Dispatcher labor load and churn
    - Driver
    - Current
    - Repetitive calls and follow-up create a tangible automation ROI story
    - Quantify baseline call volume, handle time, and avoided headcount by workflow
  - - Check calls consuming roughly 40% of dispatcher time
    - Driver
    - Current
    - A narrow voice-automation wedge can create measurable capacity gain
    - Validate the 40% benchmark against customer logs before extrapolating
  - - Freight downturn and broker margin pressure
    - Mixed driver and constraint
    - Current to near term
    - Cost pressure increases automation interest but compresses discretionary budgets
    - Test whether buyers fund projects from operating savings or new software budgets
  - - Mainstream enterprise-agent adoption
    - Driver
    - '2026'
    - Gartner-style adoption forecasts make agent workflows more acceptable to buyers
    - Identify whether logistics buyers are in the early 40% of embedded-agent adopters
  - - Agentic-AI cancellation risk
    - Constraint
    - Through 2027
    - More than 40% project cancellation risk raises proof, governance, and ROI thresholds
    - Request cohort conversion, production retention, and cancellation data from management
  - - Trust, reliability, compliance, and integration burden
    - Constraint
    - Current
    - Mission-critical freight calls require grounding, handoff, auditability, and deep TMS/load-board integration
    - Review incident logs, human-in-the-loop controls, security posture, and implementation timelines
  notes: The table intentionally pairs demand drivers with adoption brakes because fast-growing agent markets can still see high pilot failure or budget cancellation rates.
