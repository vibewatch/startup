tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to HappyRobot
  rows:
  - - Freight and logistics AI automation
    - Software automating voice, email, document, scheduling, dispatch, tracking, and collections workflows
    - Physical freight capacity, fuel, trucks, warehouses, and linehaul procurement
    - Operations, dispatch, brokerage, transportation, and transformation leaders
    - Core market boundary for autonomous AI workers in freight operations
  - - Digital freight brokerage
    - Digitized freight matching, broker workflow, carrier sales, pricing, and operational coordination software
    - Total logistics services spend and offline manual brokerage labor not digitized through platforms
    - Freight brokers, 3PLs, and logistics technology buyers
    - Best near-term vertical SAM proxy for HappyRobot's freight wedge
  - - Enterprise AI-agent software
    - Autonomous task agents embedded in enterprise applications and operations workflows
    - Consumer assistants, general model infrastructure, and non-agent AI spend
    - CIO, COO, transformation, and business-unit software budgets
    - Horizontal adjacency that supports platform expansion beyond logistics
  - - Conversational AI enterprise
    - Voice/chat/email automation, contact-center automation, and omnichannel agent interfaces
    - Pure RPA, analytics, physical automation, and freight marketplace take rates
    - Customer service, operations, and contact-center owners
    - Captures the voice and message interface layer but is broader than logistics
  - - Status quo substitutes
    - Dispatcher labor, call-center/BPO capacity, TMS queues, load boards, CRM/RPA scripts, and internal tooling
    - New autonomous-agent software subscription budgets
    - Operations managers and finance leaders approving labor substitution
    - Sets the displacement hurdle and ROI comparison for adoption
  notes: Boundary table separates software-addressable workflow automation from broad logistics spend and status-quo labor substitutes; rows are directional rather than exhaustive market taxonomy.
