- id: multi-lens-market-sizing
  title: TAM/SAM/SOM multi-lens sizing
  body: >-
    The public market evidence gives a useful range, but not a single precise TAM. Digital freight brokerage sources put the 2026 market between roughly $5.62 billion and $10.23 billion, depending on methodology, with cited growth rates clustered around the mid-20s to low-30s percentage range and 2030 outcomes around $13.9 billion to $24.5 billion. That range is the cleanest logistics-specific SAM lens for HappyRobot's initial freight-automation wedge, especially with North America representing about 43% share. A broader enterprise-AI lens is materially larger: enterprise AI-agent core software is cited around $7 billion to $12 billion for 2026, while Gartner-derived agentic software spending reaches about $206.5 billion by 2026 when embedded software spend is included. Conversational AI adds another adjacency, growing from about $14.3 billion in 2025 to $41.4 billion in 2030. The underwriting answer is therefore evidence-constrained: use digital freight brokerage for logistics SAM, enterprise AI agents for adjacency, and avoid treating all logistics spend or all embedded agent spend as HappyRobot's obtainable market.
