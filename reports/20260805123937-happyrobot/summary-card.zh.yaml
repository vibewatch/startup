  topStrengths:
    - 经确认的 $1.2B Series C 由 Prysm Capital 和 Eurazeo 领投，并获多家独立媒体交叉印证，显示投资人信心很强。
    - DHL、Kuehne+Nagel、Uber Freight 等蓝筹企业已采用，部署也有独立来源印证，执行逻辑因此站得住。
    - 自 Series B 以来收入大约增长 5 倍，公司声称净收入留存率超过 150%，指向很强的扩张经济性。
    - 物流垂直深度叠加执行能力（不止聊天）、深度 TMS / load-board 集成和多语种语音，让它区别于横向同业。
    - 创始团队技术可信，模型无关架构也让底层 AI 模型演进时更能扛住周期。
  topRisks:
    - 审计财务、ARR、毛利率和烧钱速度均未披露，估值因此建立在估计而非经验证经济性上。
    - 2026 年货运欺诈和 double brokering 创纪录，自主语音与邮件工作流既会成为目标，也可能变成攻击通道。
    - EU AI Act 高风险义务将于 2026 年 8 月生效，叠加岗位替代反弹，抬高监管和声誉风险。
    - 赛道拥挤且融资充足，横向企业 AI 玩家也可能压缩定价和利润率。
    - 客户集中在少数蓝筹 logo，且创始三人组关键人依赖高，增加脆弱性。
  unresolvedGaps:
    - 审计财务报表、经确认 ARR、毛利率、现金余额、烧钱速度和现金跑道。
    - 经对齐后的股权结构表、Series C 优先权条款和投后持股比例。
    - 独立验证公司声称的运营指标（自主解决率、CSAT、NDR、每月任务数）。
    - 在公开信息表述冲突下，确认主要总部和法定注册地。
