companyProfile:
  summary: >-
    HappyRobot is a venture-backed AI company founded in 2022 that builds and deploys autonomous "AI
    workers" — conversational AI agents that execute operational tasks such as phone calls, emails,
    scheduling, and negotiations — beginning in freight and logistics and expanding into insurance,
    energy, telecom, and airlines operations. After a Y Combinator Summer 2023 batch and a pivot from
    computer-vision data labeling, the company raised roughly $200 million across three priced rounds in
    about twenty months, culminating in a $150 million Series C at a $1.2 billion valuation on August 4,
    2026. Public evidence supports a category-leading position with more than 150 enterprise customers
    including DHL and Kuehne+Nagel, but scale metrics are largely company-claimed and audited financials
    remain private.
  founders:
    - name: Pablo Palafox
      role: Co-founder and CEO
      background: >-
        AI researcher with a deep-learning doctorate and prior large-technology-company experience who
        anchors the company's applied-AI and agent-platform thesis.
      claimRefs: [CO005, CO006]
    - name: Javier Palafox
      role: Co-founder and COO
      background: >-
        Pablo Palafox's brother; leads operations and go-to-market execution for enterprise deployments.
      claimRefs: [CO005]
    - name: Luis Paarup
      role: Co-founder and CTO
      background: >-
        Technical co-founder responsible for the agent and voice platform and its model-agnostic
        architecture.
      claimRefs: [CO005]
  foundedDate: '2022-01-01'
  foundingLocation: Spain (Madrid) and San Francisco
  headquarters: San Francisco, USA and Madrid, Spain
  productSummary: >-
    A platform of autonomous AI agents that operate across voice, SMS, email, WhatsApp, webchat, Microsoft
    Teams, and Slack and integrate with transportation management systems, load boards, and telephony to
    execute logistics tasks such as load booking, price negotiation, appointment scheduling, check calls,
    rate verification, proof-of-delivery collection, and collections.
  customerFocus: >-
    Enterprise freight brokers, third-party logistics providers, carriers, and shippers, plus an expanding
    set of operations-heavy buyers in insurance, energy, telecom, and airlines.
  businessModel: >-
    Recurring software revenue for AI-agent "workers", monetized through subscription and usage-based
    pricing for automated operational workflows deployed into enterprise systems.
  stage: Series C (venture-backed private)
  fundingStatus: >-
    Raised a $150 million Series C at a $1.2 billion post-money valuation on August 4, 2026, led by Prysm
    Capital and co-led by Eurazeo, with existing backers Andreessen Horowitz, Base10, and Y Combinator
    re-investing alongside strategic investors; roughly $200 million raised in total across three rounds.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO013, CO014, CO016, CO018, CO029]
