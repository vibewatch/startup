tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / driver
  - Public status
  - Revenue quality
  - Diligence ask
  rows:
  - - AI-worker workflow subscription
    - Configured autonomous agents embedded in customer operations
    - Workflow, seat, or agent package
    - Inferred from official positioning; no list price
    - Potentially recurring and sticky if workflow-critical
    - Request contract template, minimum commitments, and ARR by workflow
  - - Consumption / interaction usage
    - Voice, email, and task volume processed by agents
    - Interactions, voice minutes, tasks, or overages
    - Inferred from usage-heavy product metrics
    - Scales with customer activity but exposes inference and telephony COGS
    - Request usage meter, overage rates, and gross margin by channel
  - - Implementation and integration services
    - Deployment, TMS/load-board/telephony integration, playbook configuration
    - Project or onboarding work
    - Public go-live range of 4–12 weeks; pricing undisclosed
    - Can accelerate adoption but may dilute gross margin if labor-heavy
    - Request onboarding cost, implementation revenue, and services margin
  - - Enterprise expansion / cross-sell
    - Additional workflows and verticals after initial deployment
    - More teams, geographies, workflows, or vertical templates
    - Supported by NDR >150% company claim
    - High quality if expansion is usage-led rather than discount-led
    - Request cohort expansion bridge and discount-adjusted NDR
  - - Strategic-channel monetization
    - Investor and partner access to industrial, telecom, and finance buyers
    - Partner-influenced contracts or channel introductions
    - Potential channel signal; no pipeline attribution disclosed
    - Could lower CAC if partners originate demand
    - Request partner-sourced pipeline, conversion, and economics
  notes: Non-enumeration table; monetization units are inferred from public product and traction evidence because HappyRobot does not publish list pricing or contract metrics.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI017
  - CI036
- id: TI002
  title: Pricing / monetization table
  columns:
  - Pricing element
  - What is public
  - Likely model
  - Underwriting implication
  - Diligence ask
  rows:
  - - List price
    - No public rate card found on official or finance-profile sources
    - Enterprise quote-based pricing
    - Cannot benchmark ASP or discounting from public data
    - Obtain current price book and discount waterfall
  - - Contract unit
    - AI workers and workflows are public; exact billing unit is not
    - Per-workflow, per-seat, and/or consumption hybrid
    - Unit choice determines revenue durability and COGS exposure
    - Request sample MSA, order form, usage schedule, and renewal terms
  - - Usage overages
    - High interaction volumes are public; metering rules are not
    - Overages for calls, minutes, messages, or tasks
    - Upside if tied to volume; downside if COGS scales faster
    - Request usage invoices by top ten customers
  - - Implementation fees
    - 4–12 week deployment is public; fee treatment is not
    - Bundled or separately billed services
    - Recognition and margin depend on accounting policy
    - Request revenue-recognition memo and services gross margin
  - - Realized pricing / discounts
    - No public realized ASP or discount data
    - Negotiated enterprise contracts
    - Could hide lower unit economics despite strong logos
    - Request net revenue retention, gross retention, and renewal-price bridge
  notes: 'Pricing is treated as partially evidenced: official pages describe the workflow product and traction, while all price points and realized contract economics are private.'
  claimRefs:
  - CI008
  - CI013
  - CI014
  - CI015
  - CI018
