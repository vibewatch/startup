- id: TI005
  title: Public financial gaps table
  columns:
  - Gap
  - Public proxy available
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue / ARR
    - Third-party estimates around 2025 revenue and 2026 ARR
    - Valuation multiple may be materially wrong if estimates are off
    - Request audited revenue, ARR waterfall, cohort ARR, and deferred revenue schedule
  - - Revenue-estimate divergence
    - Sigrise and CB Insights do not present the same corroborated revenue point
    - Creates adverse conflicting-data risk around the base revenue denominator
    - Reconcile third-party estimates to management bookings, GAAP revenue, and ARR
  - - Gross margin and COGS
    - Qualitative inference from voice/LLM/telephony architecture
    - Cannot assess software-like margin path
    - Request COGS by inference, telephony, support, services, and cloud vendors
  - - Realized pricing and discounts
    - No public list price; enterprise model inferred
    - ASP and NDR quality cannot be verified
    - Request price book, net expansion bridge, renewal rates, and discount policy
  - - CAC, payback, and sales cycle
    - Logo count and growth claims only
    - Direct enterprise GTM capital efficiency remains unknown
    - Request sales efficiency dashboard by cohort and segment
  - - Burn, cash, and runway
    - Fresh $150M round but no cash-flow data
    - Capital adequacy cannot be converted into runway months
    - Request post-Series C cash, monthly burn, hiring plan, and board budget
  - - Customer concentration
    - 150+ customers and named logos are public
    - A few large deployments could dominate ARR and distort NDR
    - Request ARR concentration, gross retention, and top-customer contract terms
  notes: This table intentionally ranks missing private metrics because public claims are sufficient for a thesis but not for a financing model or investment committee underwriting package.
