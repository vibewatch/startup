- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin
    - Not disclosed
    - Medium that gap exists
    - Core determinant of whether AI-agent revenue behaves like software
    - Request 2025/2026 gross margin by product, services, and usage channel
  - - LLM / ASR / TTS inference cost
    - Not disclosed; likely usage-linked COGS
    - Medium
    - High-volume voice agents can incur variable model and speech costs
    - Request cost per call, per minute, and per resolved workflow
  - - Telephony and communication cost
    - Not disclosed; relevant to voice-heavy workflows
    - Medium
    - Voice minutes can pressure margins versus text-only software
    - Request carrier/SIP spend and pass-through policy
  - - Implementation cost per deployment
    - 4–12 week go-live public; cost not public
    - Medium
    - Determines services leverage and CAC payback
    - Request implementation hours, services margin, and time-to-value by cohort
  - - Net dollar retention
    - Company claims >150%
    - Medium
    - Expansion signal can offset enterprise CAC if independently verified
    - Request cohort NDR, gross retention, churn reasons, and discount-adjusted expansion
  - - CAC payback / sales cycle
    - Not disclosed
    - Medium that gap exists
    - Determines capital efficiency of direct enterprise GTM
    - Request CAC, sales cycle, win rate, quota productivity, and payback
  - - Public comparable disclosure
    - UiPath and C.H. Robinson have public filing pages; HappyRobot does not
    - High
    - Frames software-vs-freight economic benchmark without pretending comparables are identical
    - Map HappyRobot margins to automation-software and freight-brokerage comps under NDA
  notes: 'Every null or qualitative unit-economics field is intentional: HappyRobot is private and public sources do not disclose the management KPI package needed for CAC, gross margin, or payback modeling.'
