- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'HappyRobot''s capital position improved materially with the August 2026 Series C, but the company remains a private, disclosure-limited growth asset. The local financing record is clear enough for chronology: a $15.6 million Series A in December 2024 led by Andreessen Horowitz, a $44 million Series B in September 2025 led by Base10, and a $150 million Series C in August 2026 led by Prysm Capital and co-led by Eurazeo, bringing total funding to roughly $200 million in about twenty months. The proceeds are described as supporting enterprise-superintelligence expansion, yet cash on hand, burn, runway, debt, and credit obligations are not public. The short interval from Series B to Series C suggests aggressive scaling and continuing financing dependency unless ARR, gross margin, retention, and implementation leverage validate the $1.2 billion mark. Capital adequacy is therefore probably good for near-term hiring and deployment, but not underwritable without a cash-flow package.'
