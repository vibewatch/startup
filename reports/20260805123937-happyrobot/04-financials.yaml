  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: Public sources do not disclose HappyRobot list pricing, realized ASP, usage overage rates, minimum commitments, discounting, or revenue-recognition treatment.
    whyItMatters: The revenue model cannot be converted into ARR quality, gross margin, or payback without contract economics.
    diligencePath: Request current price book, sample MSA and order forms, revenue-recognition memo, invoice extracts, and renewal pricing bridge.
    relatedQuestionRefs:
    - QI002
    - QI004
    - QI008
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: Gross margin, telephony cost, inference cost, ASR/TTS cost, cloud cost, support burden, and implementation-services margin by cohort are not public.
    whyItMatters: HappyRobot may have software-like revenue potential, but voice and model costs can materially change margin quality.
    diligencePath: Request 2025-2026 COGS by channel, gross margin by product line, vendor contracts, and implementation-hours reporting.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: revenue-estimate-conflict
    missingEvidence: Sigrise and CB Insights do not provide a single corroborated revenue estimate, and no audited company statement resolves the divergence.
    whyItMatters: The $1.2 billion valuation multiple is highly sensitive to whether 2026 ARR is actually near the third-party estimate.
    diligencePath: Reconcile third-party estimates to audited GAAP revenue, ARR, bookings, deferred revenue, and management's board KPI deck.
    relatedQuestionRefs:
    - QI014
    - QI016
    - QI017
    - QI026
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-runway-and-capital-adequacy
    missingEvidence: Cash on hand, monthly net burn, runway, debt, cloud/telephony commitments, and post-Series C budget are not disclosed publicly.
    whyItMatters: A large Series C improves funding capacity but does not reveal whether the next financing is optional or required.
    diligencePath: Request post-money cash balance, monthly burn bridge, hiring plan, debt schedule, vendor commitments, and board-approved operating plan.
