- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - SOC 2 Type II
    - Company-claimed
    - Security and availability controls for enterprise customers
    - Review report scope, exceptions, bridge letter, and auditor identity under NDA
  - - GDPR, HIPAA, EU AI Act attestation
    - Company-claimed
    - Privacy and regulated-workflow posture across regions and use cases
    - Confirm legal basis, data-processing addendum, BAA scope, and EU AI Act classification
  - - RBAC and zero-trust networking
    - Company-claimed
    - Owner, Editor, Viewer access levels and network control plane
    - Test least-privilege enforcement and customer admin audit logs
  - - Tenant isolation, per-customer keys, residency, retention
    - Company-claimed
    - Data segregation, encryption, data-location, and per-workflow deletion boundaries
    - Inspect key management, residency mapping, and deletion SLAs
  - - Hallucination guardrails and human oversight
    - Risk-control requirement from adverse source plus company handoff claims
    - Grounding, escalation, transcripts, summaries, and call-center fallback
    - Obtain guardrail design, red-team results, kill-switch rules, and false-commitment logs
  notes: Public controls are largely company-asserted; the adverse hallucination row is included because safe autonomy depends on both security and output reliability.
