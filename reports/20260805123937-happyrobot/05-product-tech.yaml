- id: FE004
  title: Product maturity capability map
  type: matrix
  layout: wide
  summary: Public evidence points to strongest maturity in freight communications and integrations, with less externally proven maturity in benchmarks, roadmap, and adjacent verticals.
  data:
    columns:
    - Capability
    - Public maturity signal
    - Differentiation
    - Diligence priority
    rows:
    - label: Freight voice workflows
      values:
      - Strong
      - Official workflow claims plus freight-specific review/news coverage
      - Vertical jargon, interruptions, and carrier workflows
      - Verify call accuracy, compliance, and exception logs
    - label: Messaging and collaboration
      values:
      - Strong
      - Official channel list includes SMS, email, WhatsApp, webchat, Teams, Slack
      - Cross-channel session continuity and handoff
      - Measure adoption by channel and transcript quality
    - label: TMS / load-board integrations
      values:
      - Medium-strong
      - Official and technical sources cite TMS, load boards, APIs, and webhooks
      - Execution in systems of record
      - Audit integration uptime, permissions, and data correctness
    - label: Security and deployment
      values:
      - Medium-strong
      - Security page claims SOC 2, GDPR, HIPAA, EU AI Act, VPC, on-prem
      - Enterprise trust and flexible deployment
      - Review reports and architecture under NDA
    - label: Model quality and evaluation
      values:
      - Medium
      - Technical overview describes model-agnostic ASR/LLM/TTS and evaluations
      - Vendor swapping and workflow tuning
      - Demand benchmark, red-team, and hallucination metrics
    - label: Adjacent vertical expansion
      values:
      - Emerging
      - Funding and technology coverage mentions broader enterprise operations
      - Reusable operating-system thesis
      - Confirm production deployments outside logistics
  approximationNotes: Maturity is inferred from public evidence density, not from private product telemetry.
