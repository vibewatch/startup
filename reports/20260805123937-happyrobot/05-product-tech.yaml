  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-performance-benchmarks
    missingEvidence: Workflow-level accuracy, hallucination rate, call completion, escalation, and false-commitment metrics by use case and channel.
    whyItMatters: Autonomous freight workflows can create operational commitments, so public marketing metrics are insufficient for safety and ROI underwriting.
    diligencePath: Request benchmark dashboards, red-team results, call samples, transcript audits, and customer-specific exception reports under NDA.
    relatedQuestionRefs:
    - QE028
    - QE030
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: roadmap-and-sla-history
    missingEvidence: Feature-dated roadmap, changelog, status history, SLA attainment, incident logs, and postmortems.
    whyItMatters: Deployment risk depends on reliability history and release velocity, neither of which is visible from public product pages.
    diligencePath: Ask management for the roadmap, uptime/SLA reports, SRE incident review, and customer support ticket taxonomy.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: data-learning-boundary
    missingEvidence: Technical controls proving continuous learning and evaluation without training on customer data.
    whyItMatters: The product needs feedback loops to improve while honoring privacy promises and customer data restrictions.
    diligencePath: Review model-training policy, data-flow diagrams, retention configuration, evaluation pipelines, and customer contract language.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: ip-and-voice-model-proof
    missingEvidence: Patent filings, independent voice benchmarks, accent/jargon test results, and proprietary dataset documentation.
    whyItMatters: Voice quality is a claimed differentiator, but public sources do not prove durable IP or measurable model superiority.
    diligencePath: Search patent databases during confirmatory diligence and request internal evaluation reports for TTS, ASR, interruption handling, and logistics jargon.
    relatedQuestionRefs:
    - QE009
    - QE028
    relatedTableRefs:
    - TE001
