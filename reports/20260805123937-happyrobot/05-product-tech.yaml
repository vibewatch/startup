  rows:
  - - Conversational agent core
    - Operations teams and supervisors
    - Current product surface on official agent overview
    - Executes calls, emails, messages, and workflow steps instead of simple chat
    - Independent accuracy and exception-rate benchmarks by use case
  - - Voice AI layer
    - Carrier sales, dispatch, call-center teams
    - Official and review sources describe voice automation
    - Multilingual TTS/ASR positioned for accents, jargon, and interruptions
    - Voice-model evaluation data and accent-specific performance tests
  - - Messaging and collaboration channels
    - Dispatchers, carrier reps, supervisors
    - Official product page lists SMS, WhatsApp, webchat, Teams, and Slack
    - Session continuity and handoff across communications surfaces
    - Customer-specific channel adoption and transcript-quality samples
  - - Freight workflow playbooks
    - Brokerage and 3PL operators
    - Named tasks include booking, negotiation, appointments, tracking, POD, collections, and customs
    - Vertical workflow vocabulary and logistics-specific execution
    - Proof that every named task is mature in production, not only configurable
  - - Integration layer
    - IT, RevOps, and operations systems owners
    - TMS, load-board, telephony, and email integrations are described publicly
    - Deep connectivity to systems where freight work is actually recorded
    - Integration uptime, data-latency, permissions, and vendor-dependency audit
  notes: Rows synthesize official product claims, technical documentation, and third-party review signals; maturity levels are public-evidence judgments, not internal roadmap commitments.
