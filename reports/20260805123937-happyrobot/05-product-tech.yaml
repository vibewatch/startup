- id: trust-safety-security-compliance
  title: Trust, safety, security, privacy, and compliance
  body: 'Trust is a gating product dimension because HappyRobot operates in workflows where an agent can quote a rate, schedule an appointment, accept a load, or communicate with a carrier. The company claims SOC 2 Type II, GDPR, HIPAA, EU AI Act attestation, zero-trust networking, RBAC, tenant isolation, per-customer encryption keys, regional data residency, no training on customer data, and per-workflow retention. These are the right control categories for enterprise adoption, but most are public assertions rather than disclosed audit artifacts. The adverse Qiscus source adds a separate reliability concern: AI agents can hallucinate and need grounding, guardrails, escalation, human oversight, and audit trails. For diligence, security claims and hallucination controls should be reviewed together, because privacy, accuracy, and escalation all determine whether autonomous agents can safely run mission-critical freight operations.'
