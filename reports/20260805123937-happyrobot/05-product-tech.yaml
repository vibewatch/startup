- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - HappyRobot solution
  - Measurable benefit or signal
  - Limitation
  rows:
  - - Load booking
    - Manual outreach and inbox/call follow-up slow carrier coverage
    - Agent conducts calls or messages and records outcomes
    - External freight sources describe communication automation; company claims large task volume
    - Booking conversion and margin uplift by lane are not public
  - - Price negotiation
    - Human reps negotiate repetitive freight conversations
    - Agent handles rate conversations with context and escalation
    - Product materials name negotiation and workflow execution
    - Guardrails for unauthorized commitments need management review
  - - Appointment scheduling
    - Schedulers coordinate across calls, email, and systems
    - Agent schedules and confirms appointments through connected systems
    - Use case is named in official and technical sources
    - Exception handling for accessorials and facility constraints is private
  - - Check calls and tracking
    - Dispatchers spend time asking for status and updating TMS notes
    - Agent performs outbound status checks and writes summaries
    - Freight articles and product materials identify tracking and tracing
    - Carrier consent, spoofing, and call-quality evidence required
  - - Rate verification and POD collection
    - Teams chase documents and validate rates manually
    - Agent requests documents, verifies details, and routes summaries
    - Product canon names verification and proof-of-delivery collection
    - Document OCR accuracy and dispute resolution are not disclosed
  - - Collections and customs support
    - Back-office teams handle repetitive follow-up and documentation
    - Agent manages reminders, messages, and escalation paths
    - Company scope includes collections and customs
    - Compliance boundaries and region-specific scripts need review
  notes: Use cases are representative of named public workflow coverage; benefit cells are public signals rather than audited ROI by workflow.
