- id: FE002
  title: Freight workflow operating flow
  type: flow
  layout: wide
  summary: A freight task flows from trigger to agent execution, system update, transcript, and human handoff when confidence or policy requires escalation.
  data:
    nodes:
    - id: trigger
      label: Workflow trigger
      detail: Inbound call, email, message, scheduled check, or TMS event.
    - id: context
      label: Retrieve context
      detail: Session history, playbook, TMS/load-board data, and customer policy.
    - id: conversation
      label: Agent conversation
      detail: Voice or messaging agent negotiates, schedules, verifies, or collects information.
    - id: systems
      label: System update
      detail: REST/webhook/TMS/email actions record the outcome.
    - id: quality
      label: Transcript and summary
      detail: Live transcript, summary, and analytics are stored for review.
    - id: handoff
      label: Human handoff
      detail: Slack, Teams, or call-center transfer when confidence, policy, or failure mode requires it.
    - id: learning
      label: Continuous learning loop
      detail: Context and evaluations improve future workflows without training on customer data.
    edges:
    - from: trigger
      to: context
      label: open task
    - from: context
      to: conversation
      label: ground agent
    - from: conversation
      to: systems
      label: complete action
    - from: conversation
      to: quality
      label: capture transcript
    - from: conversation
      to: handoff
      label: escalate exceptions
    - from: systems
      to: learning
      label: record outcome
    - from: quality
      to: learning
      label: review and evaluate
  claimRefs:
  - CE003
  - CE005
  - CE006
  - CE007
  - CE020
  - CE029
