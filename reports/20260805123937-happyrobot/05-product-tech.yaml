- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk or diligence focus
  rows:
  - - Kubernetes in isolated VPC
    - Runs cloud-native containerized agent services
    - Managed cloud or customer cloud environment
    - Validate tenant isolation, network segmentation, and cluster hardening
  - - REST APIs and webhooks behind WAF / load balancer
    - Connects workflows and enterprise systems
    - Customer systems and HappyRobot API gateway
    - Confirm rate limits, auth model, replay protection, and webhook failure behavior
  - - Hardened SIP gateway
    - Handles real-time voice interactions
    - Telephony carriers, SIP infrastructure, call-center fallback
    - Assess voice uptime, failover, recording consent, and spoofing controls
  - - Stateless orchestration plus stateful stores
    - Coordinates workflow logic while storing recordings, analytics, and state separately
    - Managed databases, analytics stores, retention policy
    - Review encryption, residency, backup, deletion, and per-workflow retention
  - - Model-agnostic ASR / LLM / TTS layer
    - Allows model swaps and specialization by task
    - External or internal model providers
    - Test regression management, hallucination guardrails, and vendor concentration
  notes: Architecture rows follow the company technical overview; risk cells translate disclosed components into diligence tests.
