      - number: '7.4'
        title: Partner, dependency, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              HappyRobot depends on several counterparties whose failure would transmit quickly into revenue or
              valuation. The public customer story centers on blue-chip logistics names such as DHL, Kuehne+Nagel, Uber
              Freight, and other enterprise logos, but open sources do not disclose the ARR mix, renewal maturity,
              top-account concentration, or contract protections behind those references. The technical stack also
              depends on model, speech, telephony, email, TMS, load-board, and security layers that must be reliable
              enough for operational execution. Regulators are dependency nodes too because AI Act and FMCSA rule
              changes can force workflow redesign, disclosures, or new verification steps. Finally, the growth plan
              depends on a high-profile Series C syndicate maintaining support if growth, compliance, or margins
              disappoint. Diligence should map account concentration, vendor redundancy, fallback design, board support,
              and customer-contract rights rather than treating logo count as durable proof.
            claimRefs:
