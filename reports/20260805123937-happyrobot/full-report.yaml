  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The chapter's TRACK recommendation flows from strong category/customer proof through financial opacity and
      frothy-multiple risk to a price-sensitive diligence stance.
    data:
      nodes:
        - id: proof
          label: Blue-chip proof and 5x growth
          detail: Company-reported scale with DHL and Kuehne+Nagel corroboration.
        - id: valuation
