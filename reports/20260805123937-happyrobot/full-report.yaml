  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market boundary for HappyRobot should be defined as logistics and freight operations AI
              automation rather than the entire logistics economy. Included spend is software and automation budget used
              to execute repetitive communications and workflow steps in freight brokerage, 3PL, carrier, and shipper
              operations: carrier sales, dispatch, check calls, appointment scheduling, rate verification, collections,
              document follow-up, and customer communications. Excluded spend is the much larger pool of physical
              freight capacity, fuel, driver wages, warehousing assets, and transportation procurement dollars that
              software does not capture directly. Digital freight brokerage is the closest vertical sizing lens because
              it is already about digitizing freight matching and brokerage workflows, while enterprise AI-agent and
              conversational-AI reports provide horizontal adjacency rather than a clean TAM. Status quo substitutes
              remain powerful: manual dispatcher teams, offshore BPO/call-center labor, TMS workflows, load boards, RPA,
              CRM automation, and internal engineering. That boundary matters because HappyRobot can be underwritten as
              a workflow-execution wedge only if it converts labor-heavy communications into trusted autonomous
              resolutions.
