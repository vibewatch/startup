      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Market growth is pushed by a practical labor-and-cost problem more than by generic AI enthusiasm. Freight
              operations rely on repetitive communications, dispatcher follow-up, exception handling, and status
              updates; public freight-agent commentary indicates check calls can consume about 40% of dispatcher time,
              so successful automation has a direct capacity and cost story. Downturn pressure can reinforce this if
              brokers and 3PLs need to handle the same shipment volume with fewer coordinators, and Gartner-style
              enterprise adoption expectations suggest buyers are preparing for agentic workflows in mainstream
              software. The constraint side is equally important. Gartner's warning that more than 40% of agentic-AI
              projects are at risk of cancellation by 2027 is directly relevant to HappyRobot because freight workflows
              are mission-critical and error-prone. Trust, hallucination control, telephony reliability, human handoff,
              compliance, integration with TMS and load-board systems, and freight recession budget pressure can all
              slow conversion from curiosity to production. Diligence should therefore test workflow-level ROI and
              cancellation risk, not just top-down market growth.
