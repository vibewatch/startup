      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is acute because HappyRobot does not merely summarize tickets; it places calls, handles
              emails, touches logistics workflows, and can influence real shipments, appointments, rates, and
              proof-of-delivery processes. A hallucinated response or misread instruction is therefore a service-quality
              event, not a cosmetic chatbot error. The freight-fraud backdrop intensifies the problem: criminals are
              reported to use deepfake voices, identity theft, forged documents, and double brokering, so autonomous
              calls can be attacked or mimicked. Mitigation maturity should be marked developing until diligence
              verifies grounding, deterministic workflow constraints, human escalation thresholds, call authentication,
              audit trails, red-team exercises, and customer incident history. The upside case improves if HappyRobot
              turns these controls into a trusted fraud-reduction layer; the downside case is a visible incident that
              simultaneously damages customer trust, raises manual-review cost, and invites regulator scrutiny.
