      - number: '8.6'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not yet a public-company story; it is a growth-stage data-room story. HappyRobot’s
              public proof is sufficient to justify tracking and potentially leaning in if access opens, but not
              sufficient to price an IPO-ready asset. Before any investment, diligence must close the ARR bridge, gross
              margin, implementation cost, cohort retention, customer concentration, security controls, claims history,
              and preference overhang. The most important thesis-break triggers are quantifiable: ARR below roughly $40
              million, NDR meaningfully below 130%, slowing growth without improving margins, a top-customer
              concentration problem, poor deployment payback, or a high-severity autonomous-agent failure in regulated
              or fraud-heavy workflows. If management can provide audited or investor-quality financials showing
              high-quality ARR, strong gross margins, blue-chip expansion, and reasonable preference terms, HappyRobot
              remains a watch-list leader. If not, the Series C valuation should be treated as a high-water mark rather
              than a safe entry point.
