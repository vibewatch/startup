  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape is broader than a list of freight AI startups because the buyer can solve the
              same operations job through direct workflow automation, horizontal agent platforms, incumbent software,
              outsourced labor, or internal build. Direct freight and logistics AI peers include Fleetworks, Vooma,
              Parade, Loop AI, Drumkit, Pallet, Mentium, and adjacent listed alternatives that focus on carrier
              outreach, capacity management, freight booking, status checks, or supply-chain exceptions. Horizontal
              enterprise voice and agent vendors such as Sierra, Decagon, Cresta, and Parloa are not freight-native, but
              their scale, model investment, and contact-center distribution give them optionality to move down into
              logistics workflows. Incumbents and substitutes include RPA, CRM and service platforms, Flexport and Uber
              Freight style operating systems, BPO/offshore call centers, and in-house manual dispatch teams.
              HappyRobot’s public differentiation is therefore not merely “AI voice”; it is vertical logistics execution
              with TMS/load-board integration, multilingual voice, model-agnostic orchestration, and governance/context
              layers that must remain harder to copy than generic agent interaction.
