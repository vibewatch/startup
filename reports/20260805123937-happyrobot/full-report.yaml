            body: >-
              HappyRobot should not be underwritten as a pure software company until gross margin and service-delivery
              costs are disclosed. The platform has software-like characteristics because agents are deployed in
              repeatable workflows and can scale across customers, but the cost base includes real-time voice telephony,
              ASR/TTS, LLM inference, monitoring, reliability operations, human handoff, customer-specific integrations,
