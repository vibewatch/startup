  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              HappyRobot is attractive because its autonomous agents target a painful, expensive logistics operating
              layer, but the risk stack is unusually severe for a private software company. The top risks are not
              generic startup execution items: freight fraud is at record levels, AI hallucination can translate
              directly into wrong operational actions, and the EU AI Act and FMCSA environment turn trust, logging,
              oversight, and identity verification into core operating requirements. The investment implication is a
              high-risk, evidence-sensitive watch stance. Fraud and regulation can increase demand for HappyRobot, yet
              the same conditions can damage customers if the platform is tricked, copied, or allowed to act without
              sufficient guardrails. Residual exposure remains material because public evidence does not disclose
              incident rates, customer concentration, indemnities, insurance, or audited financials. The severity
              ordering below therefore treats fraud, legal/regulatory posture, and mission-critical reliability as
              thesis gates rather than secondary diligence items.
            claimRefs:
              - CR021
              - CR022
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
