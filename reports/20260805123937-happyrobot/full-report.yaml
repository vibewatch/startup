      - number: '2.3'
        title: Buyer, user, payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is operational rather than purely technical. Freight brokers are the clearest beachhead
              because they own high-frequency phone and email work around carrier sales, rate checks, load booking,
              check calls, and collections, and because brokerage economics create pressure to expand capacity without
              linear headcount. 3PLs and freight forwarders share similar workflows but tend to add enterprise
              integration, customer-communication, and change-management requirements. Carriers and dispatch
              organizations are users and potential buyers when automation addresses driver updates, appointment
              scheduling, and exceptions, while shippers and enterprise logistics teams are more often budget owners or
              beneficiaries of improved visibility and service. HappyRobot's public customer list and DHL proof point
              show the market thesis has moved beyond pilot-only demand, but budget ownership remains mixed across
              operations, transportation, customer service, procurement, and transformation leaders. The adoption path
              should therefore start with bounded, measurable workflows, prove resolution quality and human handoff,
              then expand to multi-channel autonomous agents once trust, integrations, and ROI are visible.
            claimRefs:
