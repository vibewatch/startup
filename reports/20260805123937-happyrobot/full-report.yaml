          detail: Roughly 24x ARR if the $50M ARR estimate is accurate.
        - id: comps
          label: Wide AI comp dispersion
          detail: Vertical AI medians near 25–30x but scarce assets much higher.
        - id: gaps
          label: Audited financials and preference stack missing
          detail: ARR, margin, cohorts, burn, and liquidation terms are private.
        - id: risk
          label: Agentic-AI saturation and cancellation risk
          detail: Saturation commentary and Gartner cancellation warnings temper upside.
        - id: decision
          label: TRACK; medium confidence; high risk
          detail: Seek data-rich entry or better terms before buying.
      edges:
        - from: proof
          to: valuation
          label: supports premium
        - from: valuation
          to: comps
          label: benchmark multiple
        - from: comps
          to: decision
          label: fair-to-stretched
        - from: gaps
          to: decision
          label: blocks conviction
        - from: risk
          to: decision
