      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              HappyRobot was founded in 2022 by three Spanish co-founders — Pablo Palafox (chief executive officer), his
              brother Javier "Javi" Palafox (chief operating officer), and Luis Paarup (chief technology officer) — and
              went through Y Combinator's Summer 2023 batch after pivoting from a computer-vision data-labeling tool
              toward logistics AI agents. Independent European and technology outlets describe Pablo Palafox as an AI
              researcher with a deep-learning doctorate and prior experience at large technology firms, which supports a
              founder-market-fit narrative anchored in applied AI rather than logistics operating experience. Governance
              disclosure is thin, as is typical for a private company at this stage: HappyRobot does not publish a full
              board roster, committee structure, or complete executive team on its public surfaces, and the founding
              trio concentrates key-person risk. Location is genuinely ambiguous in the public record — company and
              European coverage emphasize offices in San Francisco and Madrid, while some funding write-ups frame the
              company as Madrid- or New York-linked — so the precise single headquarters should be treated as an open
              diligence item rather than asserted. The public record therefore supports a founder-led, technically
              credible team with concentrated control and incomplete governance transparency.
