      - number: '3.2'
        title: Competitor profiles and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Direct-profile evidence points to a market with several young but funded specialists. Fleetworks is the
              best-corroborated direct peer in the public allocation, with Tracxn and PitchBook supporting a Brooklyn
              freight-AI profile and a $16.7 million Series A around October 2025. Vooma is San Francisco based and has
              raised about $17.1 million according to Tracxn, while Parade is positioned around carrier capacity
              management and is reported in the canonical source set at roughly $37 million raised. Loop AI is adjacent
              rather than identical: TechCrunch reports a $95 million Series C led by Valor Equity to build supply-chain
              AI for disruption prediction, meaning it threatens the broader supply-chain automation budget more than
              HappyRobot’s exact phone-and-email execution wedge. Horizontal competitors are much larger: Sacra
              describes Sierra at about a $15.8 billion valuation and roughly $200 million ARR, while AI2.work and
              Compworth place Decagon near a $4.5 billion valuation and about $44 million revenue. The profile
              implication is asymmetric: HappyRobot appears stronger in freight-specific execution, but several
              competitors have enough capital to compress pricing or acquire missing vertical capability.
