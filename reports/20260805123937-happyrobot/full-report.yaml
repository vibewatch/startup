      - number: '3.4'
        title: Switching cost, lock-in, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              HappyRobot’s moat durability rests on whether logistics context, live workflow orchestration, integration
              depth, and enterprise governance compound faster than voice-agent components commoditize. Deep
              integrations into transportation management systems, load boards, telephony, and customer-specific
              playbooks can create operational switching cost because workflows, transcripts, handoffs, and exception
              rules become embedded in daily freight operations. Yet lock-in is not absolute. Buyers can multi-home by
              workflow, keep a call center fallback, route only selected lanes to AI agents, or allow a horizontal
              platform to automate support-like interactions while a freight specialist handles execution. The adverse
              case is a crowded, well-funded field in which Sierra, Decagon, Cresta, Parloa, or a CRM/RPA incumbent
              bundles agent automation into existing enterprise contracts, while direct specialists copy narrow freight
              playbooks. The durable-moat underwriting question is therefore not whether HappyRobot has a head start,
              but whether its vertical data/context layer, customer proof, and governance controls produce measurable
              switching cost before competitors normalize similar voice and workflow automation.
