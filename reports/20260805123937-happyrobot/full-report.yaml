      - number: '7.5'
        title: Financial, model, fraud, and people risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk is not only valuation; it is the absence of public evidence needed to validate the
              model beneath the valuation. HappyRobot has raised about $200 million and reached a $1.2 billion
              valuation, yet audited financials, ARR quality, gross margin, burn, payback, fraud-loss allocation,
              insurance coverage, and customer-level liability terms are private. Record freight fraud can create demand
              for automation, but it can also raise support costs, manual review, security spend, indemnity disputes,
              and customer-trust risk. Competition from freight-specific tools, horizontal AI-agent vendors, incumbents,
              and BPO substitutes can compress pricing if the product becomes less differentiated. People risk compounds
              this: the public narrative is founder-centered, the company must scale compliance and customer-success
              operations quickly after the Series C, and automation of dispatcher or contact-center workflows can create
              labor or reputational resistance. These risks keep the residual exposure high until management data proves
              durable economics.
            claimRefs:
              - CR021
