  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR verification miss
        - ARR below roughly $40M or large non-recurring services component
        - Raises implied multiple above the fair-to-stretched range
        - Pause or demand substantially lower price
      - - Retention miss
        - NDR below 130% or weak enterprise cohort expansion
        - Undercuts scarce-asset premium and land-and-expand story
        - Reclassify to research-more or avoid
      - - Growth deceleration
        - Growth falls sharply after the Series C without margin improvement
        - Signals early-adopter saturation or high deployment friction
        - Require down-round or structured downside protection
      - - Autonomous-agent failure
        - Severe production error, fraud exposure, or regulatory incident in mission-critical workflows
        - Converts reliability risk into customer and legal risk
        - Kill until controls and liability allocation are proven
      - - Preference-stack overhang
        - Participating preferences, heavy senior stack, or strategic rights materially impair common returns
        - Shifts upside away from new or common-equity investors
        - Invest only with matching protections or step away
    notes: >-
      These are diligence thresholds, not predictions; each trigger ties public uncertainty to a concrete investment
      action.
    claimRefs:
      - CV015
      - CV030
      - CV031
      - CV036
      - CV037
      - CV041
      - CV042
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - ARR bridge
        - Audited or investor-quality ARR by quarter, new vs expansion, churn, and services split
        - Determines whether 24x ARR is real or understated/overstated
        - Request finance data room and reconcile to billings and contracts
      - - Gross margin and deployment cost
        - Model, telephony, SRE, support, and implementation cost per workflow
        - Separates software-quality revenue from services-heavy automation
        - Review cohort gross margin and deployment payback by customer segment
      - - Retention and concentration
        - NDR, GRR, top-10 customer concentration, logo churn, and renewal timing
        - Validates or breaks the premium growth thesis
        - Inspect anonymized cohorts and speak with DHL, Kuehne+Nagel, and Circle references
      - - Cap table and preferences
        - Liquidation preference, participation, seniority, option pool, secondary, and pro-rata terms
        - Determines actual downside and upside participation at a $1.2B mark
        - Review charter, financing docs, side letters, and investor-rights agreements
      - - Product reliability and liability
        - Incident history, human handoff, audit logs, kill switches, and indemnity terms
        - Mission-critical calls and emails create operational and fraud exposure
        - Run technical/security diligence and sample workflow failure reviews
      - - Exit readiness
        - Public-company-quality controls, reporting cadence, compliance posture, and auditor readiness
        - Defines whether the next financing can be an IPO path or another private round
        - Review controls roadmap and board materials with CFO or finance owner
    notes: >-
      The asks are ordered by impact on valuation first, then legal and exit-readiness risk; every item should be
      requested before any priced commitment.
    claimRefs:
      - CV030
      - CV031
      - CV032
