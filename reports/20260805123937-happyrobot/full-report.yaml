  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that HappyRobot is one of the scarce private agentic-AI companies with a real
              vertical wedge, operational rather than chat-only workflows, and blue-chip logistics proof that could
              compound into a broader “real economy” automation platform. The company-reported ingredients are unusually
              strong: 150+ enterprise customers, millions of monthly tasks, 4–12 week go-live cycles, roughly 5x revenue
              growth since Series B, and NDR above 150%. Those signals can justify a premium if ARR is truly near or
              above $50 million and cohorts show durable expansion. The anti-thesis is equally direct: the public record
              does not include audited revenue, gross margin, churn, customer concentration, or preference-stack
              details, and AI-agent comps remain frothy with saturation and project-cancellation risk. At the current
              price, HappyRobot is not an automatic buy; it is a high-upside company whose entry price must be
              conditioned on private financial verification.
            claimRefs:
