  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - ARR above $70M, NDR above 150%, continued blue-chip expansion, category scarcity
        - 35–50x ARR could imply roughly $2.5B–$4.0B if growth quality is proven
        - Customer cohorts expand and deployments remain reliable at scale
        - No trigger unless financials contradict the ARR and NDR story
      - - Base
        - ARR near $50M, 5x growth claim directionally true, but financials still private
        - $1.2B equals roughly 24x ARR and sits near vertical-AI normalization
        - Fair-to-stretched valuation; track until audited data or better entry terms arrive
        - ARR or margin evidence merely meets, not beats, the public story
      - - Bear
        - ARR overstated, growth slows, projects are cancelled, or reliability/fraud events surface
        - 12–18x on $35M–$45M ARR implies material down-round risk
        - Gartner-style project cancellation and saturation warnings intensify
        - ARR below $40M, NDR below 130%, or severe production failure
    notes: >-
      Scenario math uses rounded ARR multiples, not a full DCF, because HappyRobot does not disclose audited financials,
      burn, margin, or precise ARR.
