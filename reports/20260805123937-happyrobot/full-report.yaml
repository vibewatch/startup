  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing model
        blocks:
          - type: paragraph
            body: >-
              HappyRobot's revenue model is investable only if it is separated into what is public and what is inferred.
              Publicly, the company sells autonomous AI agents that execute operational work across voice, email,
              messaging, and enterprise systems; it does not publish list prices, rate cards, minimum commitments, or
              realized contract values. The most supportable interpretation is a hybrid subscription-and-usage model:
              enterprise customers likely pay for configured AI-worker workflows, with consumption tied to interactions,
              voice minutes, seats, or workflow volume, while implementation and integration work may be bundled into
              enterprise contracts. That model can produce high-quality recurring revenue if workflows become embedded
              in TMS, telephony, and customer operations, but it also creates revenue-recognition questions around setup
              fees, usage overages, discounts, and customer-specific scopes. Because pricing is undisclosed, the chapter
              treats monetization mechanics as inferred and flags realized pricing as a diligence blocker rather than
              asserting a SaaS rate card.
