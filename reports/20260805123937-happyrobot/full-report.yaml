              supply-chain, or customer-communications executive who owns cost, service-level, and capacity outcomes;
              the daily users are dispatchers, carrier-sales reps, customer-service agents, coordinators, or back-office
              teams; and the payer is typically an enterprise operations or transformation budget rather than an
              individual seat buyer. Public evidence shows a freight and logistics wedge: freight brokers, 3PLs,
              shippers, contract-logistics providers, and carrier-facing teams handling check calls, status updates,
              email triage, inbound calls, appointment scheduling, and booking. The company now claims 150+ enterprise
