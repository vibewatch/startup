chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              HappyRobot is a private, venture-backed AI company that builds and deploys autonomous "AI workers" —
              conversational AI agents that execute mission-critical operational work such as phone calls, emails,
              document handling, scheduling, and negotiations — starting in freight and logistics and expanding into
              adjacent operations-heavy industries. The company frames itself as an "operating system for the real
              economy" and markets a thesis of "enterprise superintelligence," where AI agents and human teams compound
              an organization's collective intelligence. Its own homepage and Series C announcement describe agents that
              run across voice, SMS, email, WhatsApp, webchat, Microsoft Teams, and Slack, integrated into
              transportation management systems, load boards, and telephony. The public identity is consistent across
              company surfaces and independent technology and freight-trade reporting, which describe HappyRobot as a
              freight-focused agentic-AI vendor that automates carrier sales, dispatch, check calls, appointment
              scheduling, and collections. That positioning matters for underwriting because the business rests on the
              claim that AI agents can reliably execute operational transactions, not merely chat, so identity and
              product credibility are inseparable from the funding narrative.
