      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is high because HappyRobot sells autonomous communications into freight and enterprise
              operations just as AI governance and freight-fraud rulemaking are tightening. In Europe, the AI Act
              creates obligations around classification, documentation, logging, transparency, human oversight,
              accuracy, robustness, and cybersecurity; for systems that interact with people, disclosure that a user is
              dealing with AI is especially relevant to voice agents. In the United States, FMCSA-linked fraud
              enforcement, broker rules, complaint backlogs, and identity-verification pressure make freight compliance
              a practical product-design issue. HappyRobot can plausibly mitigate this through attestation, governance,
              audit trails, customer-specific retention, and human oversight, but public sources do not prove the full
              conformity file, legal classification, or contract-level allocation of liability. Investment diligence
              should therefore require AI Act evidence, FMCSA control mapping, privacy documentation, audit logs, and
              abuse-response procedures before assuming frictionless regulated deployment.
            claimRefs:
