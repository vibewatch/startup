- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory compliance
    - AI Act classification, transparency, logging, and oversight evidence
    - Company cannot produce conformity documentation, AI inventory, human-oversight design, or disclosure workflow before EU obligations bite
    - Thesis break for EU-regulated expansion; pause investment or require escrowed compliance milestones
  - - Freight fraud / weaponization
    - Fraud false negatives, suspicious-call incidents, and complaint trends
    - Repeated customer-impacting fraud incidents, platform abuse, or unresolved FMCSA-related control gaps
    - Reprice risk, require insurance and indemnity clarity, or walk if controls are immature
  - - Operational reliability
    - Autonomous error rate, human-escalation rate, rollback frequency, and SLA misses
    - Material hallucination or incorrect-action incident in a production logistics workflow
    - Suspend scale assumptions until root-cause analysis and guardrail evidence are verified
  - - Customer concentration
    - Top-account ARR, renewal status, and deployment maturity
    - Top-three customers dominate ARR or a flagship logo churns, downgrades, or stalls expansion
    - Reduce valuation multiple and require cohort-level retention proof
  - - Financial model
    - ARR quality, gross margin, burn, payback, and fraud-loss allocation
    - Management cannot reconcile ARR, gross margin, burn, or liability assumptions under NDA
    - Do not price the round on estimated ARR; move to research-more or avoid
  - - Execution and labor reputation
    - Hiring plan, compliance staffing, incident backlog, and workforce backlash
    - Scaling stalls, compliance roles remain unfilled, or displacement backlash blocks deployments
    - Lower growth forecast and require board-level operating plan before investing
  notes: Kill criteria translate the chapter's risk register into diligence triggers; thresholds should be replaced with portfolio-specific covenants once management data is available.
