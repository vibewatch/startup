  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: HappyRobot's formal EU AI Act classification, conformity documentation, DPA package, privacy impact work, customer-contract liability terms, and any jurisdiction-specific legal opinions.
    whyItMatters: The legal register is partial without company-specific files, and classification or liability allocation could materially change launch timing, implementation cost, and investment risk.
    diligencePath: Request the AI system inventory, EU AI Act attestation pack, privacy and retention schedules, customer DPA templates, external counsel memo, and board compliance reporting.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer ARR, renewal dates, deployment status, committed minimums, expansion cohorts, and concentration by DHL, Kuehne+Nagel, Uber Freight, or other flagship logos.
    whyItMatters: Public logo evidence cannot determine whether one account loss would break the growth or valuation thesis.
    diligencePath: Obtain an anonymized customer cohort and ARR bridge under NDA, then reconcile it to case studies, usage, renewals, and support tickets.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-model-and-liability
    missingEvidence: Audited ARR, gross margin, burn, payback, fraud-loss allocation, indemnity caps, insurance coverage, and customer-level incident cost history.
    whyItMatters: The $1.2 billion valuation cannot be risk-adjusted without knowing whether fraud and reliability controls destroy margins or shift liability to HappyRobot.
    diligencePath: Request audited financials, contract schedules, insurance binders, loss runs, incident logs, and a bridge from company-claimed operating metrics to ARR and gross margin.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: operational-control-maturity
    missingEvidence: Production error rates, hallucination tests, red-team results, abuse-monitoring metrics, incident postmortems, kill-switch logs, and human-escalation dashboards.
    whyItMatters: Public sources identify necessary controls but do not prove HappyRobot's controls work at enterprise scale in adversarial freight workflows.
    diligencePath: Run transcript and incident sampling, inspect audit logs, interview trust-and-safety leads, and require customer references on failure handling.
    relatedTableRefs:
    - TR002
    - TR005
