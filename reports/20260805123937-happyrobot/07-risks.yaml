  - FR002
- id: partner-dependency-and-concentration-risk
  title: Partner, dependency, and concentration risk
  body: HappyRobot depends on several counterparties whose failure would transmit quickly into revenue or valuation. The public customer story centers on blue-chip logistics names such as DHL, Kuehne+Nagel, Uber Freight, and other enterprise logos, but open sources do not disclose the ARR mix, renewal maturity, top-account concentration, or contract protections behind those references. The technical stack also depends on model, speech, telephony, email, TMS, load-board, and security layers that must be reliable enough for operational execution. Regulators are dependency nodes too because AI Act and FMCSA rule changes can force workflow redesign, disclosures, or new verification steps. Finally, the growth plan depends on a high-profile Series C syndicate maintaining support if growth, compliance, or margins disappoint. Diligence should map account concentration, vendor redundancy, fallback design, board support, and customer-contract rights rather than treating logo count as durable proof.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR027
  - CR028
  - CR042
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-model-fraud-and-people-risk
  title: Financial, model, fraud, and people risk
  body: 'The financial risk is not only valuation; it is the absence of public evidence needed to validate the model beneath the valuation. HappyRobot has raised about $200 million and reached a $1.2 billion valuation, yet audited financials, ARR quality, gross margin, burn, payback, fraud-loss allocation, insurance coverage, and customer-level liability terms are private. Record freight fraud can create demand for automation, but it can also raise support costs, manual review, security spend, indemnity disputes, and customer-trust risk. Competition from freight-specific tools, horizontal AI-agent vendors, incumbents, and BPO substitutes can compress pricing if the product becomes less differentiated. People risk compounds this: the public narrative is founder-centered, the company must scale compliance and customer-success operations quickly after the Series C, and automation of dispatcher or contact-center workflows can create labor or reputational resistance. These risks keep the residual
    exposure high until management data proves durable economics.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
