  - id: FE001
    title: 分层产品架构图
    type: stack
    layout: wide
    summary: HappyRobot 将渠道、工作流剧本、编排、集成和信任控制层层叠加，把对话转成已完成的物流工作。
    data:
      layers:
        - label: 互动渠道
          detail: 语音、SMS、邮件、WhatsApp、网页聊天、Teams 和 Slack 构成智能体入口。
          tone: positive
          modules:
            - 语音通话
            - SMS
            - 邮件
            - WhatsApp
            - 网页聊天
            - Teams
            - Slack
          outputs:
            - 入站和出站对话
            - 转录文本
        - label: 工作流剧本
          detail: 无代码剧本和自定义代码模块固化订舱、排程、验证、POD、催收和报关流程。
          tone: positive
          modules:
            - 无代码剧本
            - 自定义代码模块
            - 会话上下文
          outputs:
            - 工作流动作
            - 摘要
            - 升级处理
        - label: 智能体编排
          detail: 无状态编排协调 ASR、LLM、TTS、策略，以及存放录音和分析的有状态存储。
          tone: neutral
          modules:
            - ASR
            - LLM
            - TTS
            - 策略规则
            - 状态存储
          outputs:
            - 决策
            - 通话录音
            - 分析事件
        - label: 企业集成
          detail: API、webhook、TMS、货源板、电话系统和邮件把智能体连接到记录系统。
          tone: warning
          modules:
            - REST API
            - webhook
            - TMS
            - DAT / Truckstop / Highway
            - SIP 网关
          outputs:
            - TMS 更新
            - 费率核验
            - 承运商沟通
        - label: 信任与可靠性控制
          detail: 安全、故障切换、SRE、兜底、加密和留存控制压住企业部署风险。
          tone: positive
          modules:
            - WAF
            - 负载均衡器
            - 租户隔离
            - RBAC
            - 故障切换
            - 呼叫中心兜底
          outputs:
            - 审计日志
            - 受控访问
            - 连续性路径
    approximationNotes: 层边界综合自公司产品、技术和安全页面，并非来自已发布图表。
    claimRefs:
