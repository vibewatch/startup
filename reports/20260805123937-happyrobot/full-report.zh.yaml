              耐久度证据有希望但不完整。HappyRobot 声称净美元留存率超过 150%、客户满意度 9.4/10、智能体 4 到 12
              周上线，并在具名客户内部自动化大量工作负载；若得到验证，这些都指向扩张潜力。不过，没有公开来源披露总收入留存率、logo 流失、cohort 留存、续约率、合同期限、最低承诺、客户级 NRR、客户级 CSAT
              方法或支持工单趋势。这个区别很重要，因为 AI
              智能体采纳可以在第一个工作流上展示亮眼自动化，却仍可能因可靠性、采购、劳动力接受度或集成维护不达预期而面临续约风险。耐久度最好的公开代理指标是重复工作负载使用：DHL 的年化量、Circle
              的全天来电覆盖和货运预订占比，以及 Kuehne+Nagel 的高量试点活动。投资判断中，这些代理指标应被视为运营嵌入度信号，而不是 NDA 下续约和 cohort 数据的替代品。
