companyProfile:
  summary: >-
    HappyRobot 是一家由风险资本支持的 AI 公司，成立于 2022 年，构建并部署自主 “AI workers”——能执行电话、邮件、排期、谈判等运营任务的对话式 AI
    智能体。公司从货运与物流切入，并向保险、能源、电信、航空运营扩展。经历 Y Combinator Summer 2023 批次、从计算机视觉数据标注转型后，公司在约二十个月内完成三轮有定价融资，累计约 $200
    million；August 4, 2026，公司以 $1.2 billion 估值完成 $150 million Series C 轮。公开证据支持其处于品类领先位置，企业客户超过 150 家，包括 DHL 和
    Kuehne+Nagel；但规模指标大多来自公司口径，审计财务仍未披露。
