      - number: '8.5'
        title: 可比集合与倍数映射
        blocks:
          - type: paragraph
            body: >-
              可比集合不是一个整齐的公开同业组。HappyRobot 位于垂直物流工作流软件、企业会话式 AI、私有 agentic-AI
              龙头，以及公开联网运营或经纪业务可比公司之间。Sierra、Decagon、Parloa、Harvey、Glean 和 Cursor 能帮助框定私募投资人为稀缺 AI 应用支付的价格，但它们披露的 ARR
              和估值多是第三方估算，有时还会算出相互冲突的倍数。Fin.ai 和 Agent Market Cap 可用作方向性的私有可比背景，Finro、Aventis 和 ValueAdd VC 则帮助把更宽的 AI
              倍数区间拉回常态。C.H. Robinson、RXO 和 Samsara 的申报文件不是直接估值参照，但能把讨论锚定在上市公司披露纪律和风险因素可比性上。正确读数是：如果 $50 million ARR
              估算属实，24x ARR 可以自洽；如果收入质量、毛利率或留存不达标，这个倍数就偏贵。
