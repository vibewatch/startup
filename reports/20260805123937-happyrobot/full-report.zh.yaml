  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 有吸引力，因为自主智能体瞄准了痛、贵且真实的物流运营层；但对一家私人软件公司来说，风险栈异常严峻。最高风险不是泛泛的创业执行项：货运欺诈处于纪录水平，AI 幻觉会直接变成错误运营动作，EU
              AI Act 和 FMCSA 环境则把信任、日志、监督和身份核验变成核心运营要求。投资含义是高风险、证据敏感的观察立场。欺诈和监管能提升 HappyRobot
              需求，但同样条件也可能在平台被欺骗、被仿冒或缺少足够护栏时伤害客户。公开证据没有披露事故率、客户集中度、赔偿条款、保险或审计财务，因此剩余敞口仍然重大。下方严重度排序把欺诈、法律/监管姿态和关键任务可靠性视为投资论点闸门，而不是次要尽调事项。
