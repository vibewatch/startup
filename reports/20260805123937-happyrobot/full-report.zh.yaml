              模块地图可以落成四个实际产品族：沟通渠道、物流工作流技能、企业集成和面向运营人员的控制界面。产品页和第三方目录一致描述了能跨电话、邮件和消息工作的智能体；货运专项来源进一步补充了订舱、价格谈判、预约、状态检查、费率核验、签收证明、催收和海关等运营词汇。只有当每个工作流都能接入买家的运输管理系统、load-board
              数据、电话栈、收件箱和升级渠道时，这种广度才有价值。因此，下表不把产品视为无差别的智能体平台，而是把每个模块同用户、成熟度信号、差异化和尽调缺口绑定，帮助投资判断区分已出货的工作流深度和相邻垂直扩张雄心。
