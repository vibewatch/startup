      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 由三名西班牙联合创始人于 2022 年创立——Pablo Palafox（chief executive officer）、他的兄弟 Javier “Javi” Palafox（chief
              operating officer）和 Luis Paarup（chief technology officer）。公司经历 Y Combinator Summer 2023
              批次后，从计算机视觉数据标注工具转向物流 AI 智能体。独立欧洲媒体和科技媒体把 Pablo Palafox 描述为 AI 研究者，拥有深度学习博士学位和大型科技公司经历，这支撑了一个以应用 AI
              而非物流运营经验为核心的创始人与市场匹配叙事。治理披露很薄，这符合这一阶段私人公司的常态：HappyRobot
              没有在公开页面披露完整董事会名单、委员会结构或完整高管团队，三位创始人也集中了承担关键人物风险的控制权。公开记录里的地点确实模糊——公司和欧洲报道强调 San Francisco 与 Madrid
              办公室，一些融资报道则把公司与 Madrid 或 New York
              联系起来——因此，精确的单一总部应被视为开放尽调项，而不是直接断言。公开资料由此支持一个创始人主导、技术可信但控制集中、治理透明度不足的团队画像。
