        - 在控制和责任分配得到证明前否决
      - - 优先权堆栈压力
        - 参与型优先权、沉重高级顺位或战略权利显著损害普通股回报
        - 把上行从新投资人或普通股投资人转走
        - 只有拿到匹配保护才投，否则退出
    notes: 这些是尽调阈值，不是预测；每个触发项都把公开不确定性绑定到具体投资动作。
    claimRefs:
      - CV015
