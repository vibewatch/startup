  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 应被评估为运营工作的执行平台，而不是横向聊天机器人。公司描述的自主对话式 AI
              智能体会在实时物流工作流中拨打电话、发送邮件和消息、收集文档、谈判、排期、核验费率并更新货运状态。产品表面覆盖语音、SMS、邮件、WhatsApp、webchat、Microsoft Teams 和
              Slack，因此真正的价值单位是一项已完成的运营任务，而不是一个用户席位或一条生成答案。这个区别很重要，因为 HappyRobot 承诺触达承运人销售、调度、check
              call、签收证明收集、催收和海关等工作流，而这些都可能形成现实世界里的承诺。公开证据支持其工作流覆盖广、产品架构可信；但性能基准和客户专属准确率数据仍主要来自公司口径。
