      - number: '5.4'
        title: 部署、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              部署成熟度的公开支撑强于路线图细节。HappyRobot 称智能体通常 4 到 12 周上线，可部署在托管云、客户 AWS/GCP/Azure VPC 或本地环境，并支持多可用区故障切换、24/7 SRE
              覆盖，以及最终回落到客户呼叫中心的语音兜底。这些控制很适合运营
              AI，因为宕机或糟糕通话会扰乱货运执行。开发者文档和招聘页面又提供了公开开发者入口与持续工程投入的证据。不过，公开记录没有发布带日期的功能路线图、状态历史流或独立 SLA
              表现。因此，路线图表把当前能力和部署选项视为有支撑，同时把功能速度、事故历史和经基准测试的可靠性留作尽调请求。
