      - number: '8.6'
        title: 退出准备度、最终尽调问题与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              退出准备度还不是上市公司故事，而是成长期资料室故事。HappyRobot 的公开证据足以支持跟踪，也可能在有准入时更积极，但不足以给一个可 IPO 资产定价。任何投资前，尽调必须补齐 ARR
              桥接、毛利率、实施成本、分 cohort 留存、客户集中度、安全控制、索赔历史和优先权包袱。最重要的投资逻辑失效触发器都可以量化：ARR 低于约 $40 million、NDR 明显低于
              130%、增长放慢但利润率未改善、头部客户集中问题、部署回本差，或在受监管 / 欺诈高发工作流中出现高严重性 autonomous-agent 失效。如果管理层能提供审计或投资人质量财务，证明 ARR
              高质量、毛利率强、蓝筹客户扩张、优先权条款合理，HappyRobot 仍是观察名单龙头。否则，Series C 估值应视为高水位，而不是安全进场点。
