  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              HappyRobot
              的公开客户基础集中在企业运营团队，痛点是高频沟通，而不是通用聊天机器人支持。买家通常是负责成本、服务等级和产能结果的运营、物流、供应链或客户沟通高管；日常用户是调度员、承运人销售代表、客服坐席、协调员或后台团队；付费方通常是企业运营或转型预算，而不是单个席位买家。公开证据显示货运与物流楔子明确：货运经纪商、3PL、托运人、合同物流服务商和面向承运人的团队，处理
              check call、状态更新、邮件分拣、来电、预约排期和订舱。公司现在声称拥有 150+ 企业客户，并点名 DHL、Kuehne+Nagel、Uber Freight、Naturgy、Repsol 和 LKW
              WALTER，这意味着客户基础偏向大型全球账户和企业采购，而不是 SMB 自助服务。通过 San Francisco、Madrid、DHL、Kuehne+Nagel 和 LKW WALTER
              证据看，地理分布呈跨大西洋且偏欧洲；但按区域、细分市场和收入带划分的客户数并不公开。
