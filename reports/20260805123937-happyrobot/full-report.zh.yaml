      - number: '1.4'
        title: 规模、里程碑与反向背景
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的规模叙事很强，但高度依赖公司披露的运营指标。公司称服务 150 多家企业客户——包括 DHL、Kuehne+Nagel、Uber Freight、Naturgy、Repsol 和 LKW
              WALTER——每月处理数百万项任务，智能体通常 4 到 12 周上线，某客户每月自动化 28,000 小时工作，客户满意度为 9.4/10，平均自主解决率超过 70%，Series B
              轮以来收入约增长五倍。November 2025 的 DHL 新闻稿独立印证了一项实质性部署，处理大量邮件和语音分钟数，为旗舰 logo 叙事提供了外部支撑。两条反向线索给故事降温。第一，HappyRobot
              的审计财务不公开，因此广泛流传的接近 $50 million 年度经常性收入只是第三方估计，不是已确认数字。第二，公司正在自动化的货运市场在 2026
              年遭遇创纪录欺诈——公开年损失达数亿美元，被标记的欺诈实体激增——这既能拉动需求，也是自主语音和邮件工作流的系统性风险。因此，下方里程碑时间线把融资和规模证据同这些反向、未解决事项放在一起看。
