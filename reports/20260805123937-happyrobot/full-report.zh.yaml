      - CE013
      - CE015
      - CE016
      - CE019
      - CE020
  - id: FE002
    title: 货运工作流运行流程
    type: flow
    layout: wide
    summary: 货运任务从触发开始，进入智能体执行、系统更新和转录留存；当置信度或策略要求升级时，再转给人工。
    data:
      nodes:
        - id: trigger
          label: 工作流触发
          detail: 入站电话、邮件、消息、计划查货或 TMS 事件。
        - id: context
          label: 获取上下文
          detail: 会话历史、剧本、TMS / 货源板数据和客户策略。
        - id: conversation
          label: 智能体对话
          detail: 语音或消息智能体负责谈判、排程、验证或收集信息。
        - id: systems
          label: 系统更新
          detail: REST / webhook / TMS / 邮件动作记录结果。
        - id: quality
          label: 转录与摘要
