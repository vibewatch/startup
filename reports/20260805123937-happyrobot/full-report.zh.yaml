      - number: '2.2'
        title: TAM/SAM/SOM 多镜头测算
        blocks:
          - type: paragraph
            body: >-
              公开市场证据给出了有用区间，但没有给出单一精确 TAM。按不同方法，数字货运经纪来源把 2026 市场放在约 $5.62 billion 到 $10.23 billion 之间，引用的增速集中在 20% 中段到
              30% 出头，2030 结果约为 $13.9 billion 到 $24.5 billion。对 HappyRobot 最初的货运自动化切入口来说，这个区间是最干净的物流专项 SAM 镜头，尤其北美约占 43%
              份额。更宽的企业 AI 镜头明显更大：企业 AI 智能体核心软件在 2026 年约为 $7 billion 到 $12 billion，而 Gartner 衍生的智能体软件支出在纳入嵌入式软件支出后，到 2026
              达到约 $206.5 billion。对话式 AI 又提供一个相邻市场，从 2025 年约 $14.3 billion 增至 2030 年 $41.4 billion。投资判断因此受证据约束：用数字货运经纪测物流
              SAM，用企业 AI 智能体看相邻空间，并避免把全部物流支出或全部嵌入式智能体支出都当成 HappyRobot 可获取市场。
