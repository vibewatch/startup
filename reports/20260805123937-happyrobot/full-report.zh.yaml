  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，HappyRobot 是少数真正拿到垂直切口的私有 agentic-AI
              公司之一；它做的是运营流，不只是聊天流，也有蓝筹物流客户证明，未来可能复利成更宽的“实体经济”自动化平台。公司披露的要素异常强：150+ 家企业客户、每月数百万项任务、4–12 周上线周期、Series B
              后收入约 5x 增长、NDR 超过 150%。如果 ARR 确实接近或超过 $50 million，且分 cohort
              数据证明扩张可持续，这些信号足以支撑溢价。反逻辑同样直接：公开记录没有审计收入、毛利率、流失、客户集中度或优先权栈细节，AI agent
              可比公司的估值仍有泡沫，也存在饱和和项目取消风险。按当前价格，HappyRobot 不是无脑买入；它是高上行公司，但进场价必须取决于私有财务验证。
