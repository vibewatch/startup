      - number: '5.5'
        title: 语音、数据与集成差异化
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的差异化不是单一模型，而是一组能力打包：垂直工作流上下文、货运系统集成、多语言语音处理、人工交接和模型无关编排。公司材料声称拥有自有多语言 TTS 和
              ASR，可处理口音、物流术语和打断；外部画像则把产品定位为物流沟通自动化，而非通用支持聊天。最强技术护城河应来自积累的货运工作流数据、集成模板、升级模式和行为评估循环；但公开证据没有证明独特数据集、专利保护或独立基准测试下的语音准确率。因此，HappyRobot
              在已有货运工作流、集成和客户部署处看起来最成熟；每一个被“企业超级智能”叙事提到的相邻垂直，证据都更弱。
