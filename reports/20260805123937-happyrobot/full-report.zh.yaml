              TMS、DAT、Truckstop 和 Highway 集成。Kuehne+Nagel 明确被标为试点：公司报告 10,000+ 次状态检查、6,000+ 封邮件、78% 已接通电话由 AI 端到端处理，并增加
              47% 团队产能，同时有 Yngve Ruud 具名引用。DHL 是最独立的蓝筹证据，因为 DHL Group 发布了新闻稿，描述 HappyRobot 智能体处理大量邮件和语音，并包含 Lindsay
              Bridges 的背书。Uber Freight、Naturgy、Repsol、LKW WALTER、Ryder、Flexport 和 Werner 提升了 logo
