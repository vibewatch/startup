        title: 采纳轨迹
        blocks:
          - type: paragraph
            body: >-
              采纳证据在活动和用例层面最强，在账户留存层面不够完整。HappyRobot 在官网报告每月 10 million-plus 次交互，在 Series C 轮公告中称每月数百万任务，平均自主解决率超过
              70%，成本降低 75%，产能提升 10x，智能体通常 4 到 12 周上线，并有一名未具名客户每月自动化 28,000
              小时工作。这些数字显示部署速度快、工作流使用重复，但它们来自公司口径，缺少活跃生产账户数、每账户智能体数量、毛流失率或 cohort 续约率等分母。具名部署补充了质感：Circle Logistics
              把特定货运工作流推进到零接触或近零接触自动化；Kuehne+Nagel 披露一个包含 10,000+ 状态检查和 6,000+ 邮件的试点；DHL
              描述了每年数十万封邮件和数百万语音分钟量。因此，轨迹看起来像企业账户内部工作负载深度在扩张，公开证据更能证明运营使用，而不是经常性收入耐久度。
