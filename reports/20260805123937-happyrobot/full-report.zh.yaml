  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价模型
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的收入模型只有先区分公开事实和推断，才有投资意义。公开层面，公司销售自主 AI
              智能体，在语音、邮件、消息和企业系统中执行运营工作；它不披露标价、费率卡、最低承诺或实际合同价值。最可支持的解释是订阅加用量的混合模型：企业客户可能为配置好的 AI worker
              工作流付费，消耗量与交互、语音分钟、席位或工作流量挂钩，实施和集成工作则可能打包进企业合同。若工作流嵌入
              TMS、电话系统和客户运营，这种模型可以产生高质量经常性收入；但它也带来有关设置费、用量超额、折扣和客户专属范围的收入确认问题。由于定价未披露，本章把变现机制作为推断处理，并把实际定价列为尽调阻碍，而不是断言一张
              SaaS 费率卡。
