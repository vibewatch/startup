      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险高，因为 AI 治理和货运欺诈规则正在收紧，HappyRobot 正好把自主沟通卖进货运和企业运营。在欧洲，AI Act
              围绕分类、文档、日志、透明度、人工监督、准确性、稳健性和网络安全设置义务；对于与人交互的系统，告知用户正在与 AI 打交道，对语音智能体尤其重要。在美国，与 FMCSA
              相关的欺诈执法、经纪商规则、投诉积压和身份核验压力，让货运合规变成实际的产品设计问题。HappyRobot 可以通过
              attestation、治理、审计轨迹、客户专属留存和人工监督来合理缓释，但公开来源没有证明完整合规文件、法律分类或合同层面的责任分配。投资尽调应要求 AI Act 证据、FMCSA
              控制映射、隐私文档、审计日志和滥用响应流程，然后才可假设受监管部署没有摩擦。
