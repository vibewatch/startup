      - - 横向 AI 智能体
        - 厂商对比证据强调客服自动化，而非货运定价
        - 企业支持智能体合同、席位、会话或用量
        - 客服、语音和跨渠道智能体
        - 垂直集成附加费和合同捆绑未知
        - 横向厂商可打包进入更大的客户体验预算
      - - RPA / CRM 既有厂商
