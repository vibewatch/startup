      - number: '8.4'
        title: 牛市、基准与熊市情境
        blocks:
          - type: paragraph
            body: >-
              牛市情境要求 ARR 明显高于公开估算、继续保持近 5x 的动能、净留存超过 150%，并证明物流工作流能在横向 AI 厂商和垂直专家压低价格前，形成可防守、可复制的切口。若如此，市场可能把 HappyRobot
              估到更接近稀缺 agentic-AI 龙头，多十亿美元估值也说得通。基准情境假设 $50 million ARR 估算大致正确：在 $1.2 billion 估值下，隐含 24x ARR；相对 25–30x 企业
              AI 正常化区间，这是合理到偏贵，只比公开物流 / 数据智能参照区间略好。熊市情境是 ARR 被高估或质量偏低，早期部署后收入增长放慢，agentic-AI 项目被取消或退回
              pilot，倍数压缩到低十几倍至高十几倍区间。下行尤其尖锐，因为私募优先权条款可能保护后期投资人，而普通股承受大部分重估。
