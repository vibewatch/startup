      - number: '3.3'
        title: 能力、定价、GTM 与信任对比
        blocks:
          - type: paragraph
            body: >-
              能力维度上，HappyRobot 最强的公开主张是端到端物流执行：横跨语音、SMS、邮件、WhatsApp、webchat、Teams、Slack、TMS 系统、load board
              和电话网络，而不是通用客服聊天。直接货运 AI 同行在用例狭窄时应被视为最危险，例如承运人销售、订舱或状态检查；横向供应商在买家更重视联络中心广度、企业支持工作流或成熟 GTM
              关系，而不是货运专项系统时最危险。整个集合的公开定价证据都很弱。HappyRobot 没有在审查过的官方页面上发布可比标价，SourceForge
              更多是呈现代替方案而非透明价格表，供应商对比页也暗示企业智能体定价通常是定制、按用量或按合同而定。信任层面同样混合：客户 logo 和融资证据帮助
              HappyRobot，但公开竞争者页面很少提供足够的集成、审计、数据驻留或服务等级细节，无法清晰排序所有供应商。因此，采购对比应被写成能力与证据之争，定价应作为尽调缺口处理，而不是已解决的 benchmark。
