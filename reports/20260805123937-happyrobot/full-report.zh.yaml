      - number: '2.4'
        title: 增长驱动因素与采纳约束
        blocks:
          - type: paragraph
            body: >-
              推动市场增长的主要不是泛泛的 AI 热情，而是现实的劳动力和成本问题。货运运营依赖重复沟通、调度跟进、异常处理和状态更新；公开的货运智能体评论显示，check call 可能吃掉调度员约 40%
              时间，因此成功自动化有直接的产能和成本叙事。若周期下行迫使经纪商和 3PL 用更少协调员处理同样货量，这一压力还会增强；Gartner
              式的企业采纳预期也说明买家正为主流软件里的智能体工作流做准备。约束面同样重要。Gartner 警告称，到 2027 超过 40% 的智能体 AI 项目面临取消风险，这与 HappyRobot
              直接相关，因为货运工作流关键且容易出错。信任、幻觉控制、电话可靠性、人工交接、合规、与 TMS 和 load-board
              系统集成，以及货运衰退下的预算压力，都可能拖慢从好奇到生产环境的转化。尽调因此应测试工作流层面的 ROI 和取消风险，而不只是自上而下的市场增长。
