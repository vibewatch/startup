              HappyRobot 的公开 GTM 证据更像是面向运营复杂账户的企业直销，而不是自下而上的自助采用。客户名单突出 DHL、Kuehne+Nagel、Uber Freight、Naturgy、Repsol 和
              LKW WALTER；公司还声称拥有 150 多家企业客户，并拥有可能帮助打开电信、工业和金融服务渠道的战略投资者。最强的销售效率代理指标来自公司口径：Series B 轮以来收入约增长五倍，净美元留存率超过
              150%，智能体通常 4 到 12 周上线，某客户据称每月自动化 28,000 小时。这些指标若准确，意味着强劲扩张经济性；但它们没有披露
