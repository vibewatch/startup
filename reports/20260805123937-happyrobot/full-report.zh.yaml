      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的“先落地后扩张”路径可信，因为产品可以从狭窄沟通工作流切入，证明自动化或服务等级收益，再扩展到相邻电话、邮件、文档、排期、销售和其他运营渠道。Series C
              轮叙事又加入第二条扩张向量：从物流延伸到保险、能源与公用事业、电信、航空和金融服务；公司材料还称在未充分利用渠道中带来 5x 销售结果。风险在于，公开客户叙事重度依赖一小组蓝筹物流 logo——尤其是
              DHL、Kuehne+Nagel、Circle Logistics、Uber Freight、Ryder、Flexport 和
              Werner——却没有披露收入集中度、头部客户占比或续约状态。还存在劳动力替代和声誉风险：自动化承运人 check call 以及调度员/协调员工作流，可能引发反弹，即便 Circle
              称没有岗位流失。因此，集中度和劳动力反弹应是尽调优先项，而不是脚注，因为它们会削弱客户引用、续约和扩张速度。
