  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代品
        blocks:
          - type: paragraph
            body: >-
              竞争格局比一张货运 AI 创业公司名单更宽，因为买家可以用直接工作流自动化、横向智能体平台、既有软件、外包劳动力或内部自建来解决同一个运营任务。直接的货运与物流 AI 同行包括
              Fleetworks、Vooma、Parade、Loop
              AI、Drumkit、Pallet、Mentium，以及一批相邻上市替代方案，分别聚焦承运人触达、运力管理、货运预订、状态检查或供应链异常。Sierra、Decagon、Cresta 和 Parloa
              等横向企业语音与智能体供应商并非货运原生，但它们的规模、模型投入和联络中心分销能力，让它们有机会下探到物流工作流。既有厂商和替代品还包括 RPA、CRM 与服务平台、Flexport 和 Uber Freight
              风格的操作系统、BPO/离岸呼叫中心，以及内部人工调度团队。因此，HappyRobot 的公开差异化不只是“AI voice”；真正要守住的是垂直物流执行能力，包括 TMS/load-board
              集成、多语言语音、模型无关编排，以及必须比通用智能体交互更难复制的治理和上下文层。
