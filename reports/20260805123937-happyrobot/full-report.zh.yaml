      - number: '8.3'
        title: 融资背景、进场纪律与优先权包袱
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的融资背景很紧：约二十个月内完成三轮定价融资，$150 million
              成长轮后马上打上独角兽标记。速度本身是优势，因为它显示投资人需求和足够支撑后期资本的客户牵引，但也带来进场纪律问题。新投资人不只要承销估值，还要承销 Series C
              后持股、清算优先权、参与权、按比例跟投行为、二级交易、期权池刷新，以及任何战略投资人的商业权利。这些条款都未公开。在估算 $50 million ARR 基数上，头部估值约等于 24x ARR，处在垂直或企业
              AI 的中位到偏高区间，但低于最激进的 agentic 龙头公司。只有当已验证的 ARR、留存、毛利率和部署经济性证明 HappyRobot 属于稀缺资产溢价池，而不是正在回归常态的 Series C
              同期公司，这笔交易才有吸引力。
            claimRefs:
              - CV001
