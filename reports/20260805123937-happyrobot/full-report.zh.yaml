              在毛利率和服务交付成本披露之前，HappyRobot 不应被按纯软件公司建模。平台具备软件特征，因为智能体部署在可重复工作流中，也能跨客户扩展；但成本底座包括实时语音电话、ASR/TTS、LLM
              推理、监控、可靠性运营、人工交接、客户专属集成和实施人力。4 到 12 周上线窗口对 onboarding 效率是积极信号，但仍意味着专业服务工作，而这部分成本可能按会计政策落在 COGS
              或客户成功费用里。UiPath 和 C.H. Robinson 的公开文件页面只适合作可比参照：前者代表自动化软件披露，后者代表货运经纪经济性，而 HappyRobot
              处在两极之间。缺少毛利率、每次交互推理成本和每次部署实施成本，利润率路径仍是定性判断，不能直接进模型。
