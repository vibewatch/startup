      - number: '2.3'
        title: 买家、用户、付费方分层与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是运营型的，而不只是技术型的。货运经纪商是最清晰的滩头阵地，因为承运人销售、费率查询、订舱、check call
              和催收带来高频电话与邮件工作，同时经纪业务的经济模型也要求在不线性增加人手的情况下扩大产能。3PL
              和货代拥有相似工作流，但通常叠加企业集成、客户沟通和变革管理要求。承运人和调度组织在自动化覆盖司机更新、预约排期和异常处理时既是用户也可能是买家；托运人和企业物流团队则更多是预算所有者或可见性与服务改善的受益方。HappyRobot
              的公开客户名单和 DHL
              证据表明，市场叙事已经越过“只有试点需求”的阶段；但预算归属仍分散在运营、运输、客服、采购和转型负责人之间。采纳路径因此应从边界清晰、可衡量的工作流开始，先证明解决质量和人工交接，再在信任、集成和 ROI
              可见后扩展到多渠道自主智能体。
