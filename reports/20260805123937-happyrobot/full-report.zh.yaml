      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              本章建议是继续跟踪（TRACK），置信度中等，风险高，估值立场偏贵。评分约为 6.4/10，因为品类质量、客户证据和增长叙事强于公开财务证明。最强的证实事实是 $150 million Series C、投后估值
              $1.2 billion 已获多方佐证，累计融资据报接近 $200 million，DHL 和 Kuehne+Nagel 也有外部客户证据。限制因素在于 ARR 基数似乎来自第三方估算，小幅 ARR
              变化会大幅推高或压低倍数，可比 AI agent 的估值离散度很大。因此，IC 的实际决定不是“回避”，而是“跟踪以争取准入”，索取管理层数据，并在投入新的一级资本前，要求验证后的增长桥，或明显更好的进入条款。
