      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的融资节奏异常紧凑：约二十个月内完成三轮有定价融资，并冲到独角兽估值。公司在 December 2024 左右宣布 $15.6 million Series A 轮，由 Andreessen
              Horowitz 领投，Y Combinator 和 Ryder Ventures 参投，早期采用者包括 Circle Logistics 与 Uber Freight。September 2025
              左右，公司又完成 $44 million（约 €37.7 million）Series B 轮，由 Base10 领投，Andreessen Horowitz、Y Combinator
              和更广泛的投资人联盟参投。August 4, 2026，HappyRobot 宣布以 $1.2 billion 投后估值完成 $150 million Series C 轮，由 Prysm Capital
              领投、Eurazeo 共同领投，老股东 Andreessen Horowitz、Base10 和 Y Combinator 加码，同时引入 Koch Disruptive
              Technologies、Kfund、Orange、T.Capital、Bankinter、Endeavor Catalyst 和 Wave-X 等战略投资者。本轮使累计融资达到约 $200
              million，并被广泛报道为造就了一个新的货运科技独角兽。公司公告、多家独立科技媒体和货运行业媒体交叉印证了 $1.2 billion
              估值和领投方身份，因此这些具体事实置信度高；但收入倍数解读并不具备同等置信度。
