            - 中；独立报道重复提到部分客户标识
            - 低；没有公开流失或队列指标
    approximationNotes: 矩阵评级是基于公开证据深度的定性分析师评估；并不对客户经济价值排序。
    claimRefs:
      - CU015
      - CU021
      - CU024
      - CU026
      - CU029
      - CU031
      - CU041
  - id: FU004
    title: 分析师估算耐久性的留存复购队列
    type: cohort
    layout: standard
    summary: 由于 HappyRobot 不披露队列数据，数值为分析师估算的留存百分比，将公开 NDR、CSAT、部署速度和具名工作负载深度转化为尽调情景。
    data:
      columns:
        - 第 0 个月
        - 第 3 个月
        - 第 6 个月
        - 第 12 个月
      rows:
        - label: 具名近生产环境物流账户
          values:
            - 100
            - 96
            - 92
            - 88
        - label: 高频试点转扩张账户
          values:
            - 100
            - 90
            - 82
            - 72
        - label: 仅有客户标识或垂直扩张早期账户
          values:
            - 100
            - 84
            - 72
            - 58
    approximationNotes: 数值是分析师估算的留存百分比，并非公司披露的队列数据；公开来源披露 NDR 和 CSAT 说法， 但不披露 GRR、客户流失或续约表。
    claimRefs:
      - CU012
      - CU013
      - CU024
      - CU032
      - CU033
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 在私有证据验证控制措施前，热力图把欺诈、EU AI Act 合规和关键任务可靠性放在最高剩余严重度区间。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 货运欺诈与平台武器化
          values:
            - 高
            - 高
            - 发展中
            - 严重
        - label: EU AI Act / 法律合规
          values:
            - 高
            - 高
            - 发展中
            - 高
        - label: AI 幻觉 / 错误自主行动
          values:
            - 中
            - 高
            - 发展中
            - 高
        - label: 客户集中度
          values:
            - 中
            - 高
            - Unknown
            - 高
        - label: 私有财务模型 / 估值
          values:
            - 中
            - 高
            - Unknown
            - 高
        - label: 安全、隐私与数据处理
          values:
            - 中
            - 高
            - 发展中
            - 高
        - label: 创始人与执行扩张
          values:
            - 中
            - 中
            - 发展中
            - 中
        - label: 劳工与声誉反弹
          values:
            - 中
            - 中
            - 早期
            - 中
    approximationNotes: 定性评分使用公开负面证据和已披露公司背景；没有私有损失、事件或集中度数据可用。
    claimRefs:
      - CR033
      - CR037
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最高影响风险会先传导到客户信任和监管审查，再反映到利润率、留存、融资和估值。
    data:
      nodes:
        - id: fraud
          label: 欺诈 / 深度伪造 / 伪造文件
          detail: 创纪录货运欺诈和平台武器化风险
          tone: adverse
        - id: reliability
          label: 幻觉或错误行动
          detail: 关键任务自主运营可能以外部可见方式失败
          tone: adverse
        - id: regulation
          label: AI Act 与 FMCSA 合规
          detail: 规则决定披露、日志、监督和核验要求
          tone: warning
        - id: trust
          label: 客户信任与续约
          detail: 企业客户需要可靠、合规的工作流
          tone: warning
        - id: cost
          label: 支持成本与毛利率
          detail: 人工审核、保险、安全和合规都会增加成本
          tone: warning
        - id: growth
          label: ARR 增长与扩张
          detail: 预算压力或部署失败会拖慢增长
          tone: warning
        - id: valuation
          label: 融资与估值倍数
          detail: 若增长或控制证据变弱，溢价倍数会压缩
          tone: adverse
      edges:
        - from: fraud
          to: trust
        - from: fraud
          to: cost
        - from: reliability
          to: trust
        - from: reliability
          to: cost
        - from: regulation
          to: trust
        - from: regulation
          to: cost
        - from: trust
          to: growth
        - from: cost
          to: growth
        - from: growth
          to: valuation
        - from: cost
          to: valuation
    claimRefs:
      - CR032
      - CR043
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: HappyRobot 的风险画像取决于监管方、旗舰客户、AI / 语音基础设施、企业集成和资本提供方构成的网络。
    data:
      nodes:
        - id: happyrobot
          label: HappyRobot 平台
          detail: 面向货运和企业运营的自主 AI Agent
          tone: neutral
        - id: customers
          label: 旗舰客户
          detail: DHL、Kuehne+Nagel、Uber Freight 和其他企业客户标识
          tone: warning
        - id: regulators
          label: EU AI Act / FMCSA
          detail: 围绕 AI 透明度、监督、日志和货运欺诈的规则
          tone: warning
        - id: models
          label: ASR / LLM / TTS 层
          detail: 模型、语音和评估依赖
          tone: warning
        - id: systems
          label: TMS / 货运配载平台 / 电话 / 邮件
          detail: 运营集成和通信渠道
          tone: warning
        - id: security
          label: 安全与信任运营
          detail: 身份验证、审计轨迹、事件响应
          tone: warning
        - id: capital
          label: 成长资本联合投资方
          detail: Series C 投资者和后续支持
          tone: neutral
        - id: market
          label: 货运周期预算背景
          detail: 经纪商预算压力和反欺诈支出取舍
          tone: adverse
      edges:
        - from: regulators
          to: happyrobot
        - from: models
          to: happyrobot
        - from: systems
          to: happyrobot
        - from: security
          to: happyrobot
        - from: happyrobot
          to: customers
        - from: customers
          to: capital
        - from: market
          to: customers
        - from: regulators
          to: security
        - from: systems
          to: security
        - from: capital
          to: happyrobot
    claimRefs:
      - CR042
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 本章的 TRACK 推荐从强品类 / 客户证明出发，经过财务不透明和估值倍数泡沫风险， 落到价格敏感的尽调立场。
    data:
      nodes:
        - id: proof
          label: 蓝筹客户证明与 5x 增长
          detail: 公司报告的规模，并有 DHL 和 Kuehne+Nagel 佐证。
        - id: valuation
          label: $1.2B Series C 轮
          detail: 如果 $50M ARR 估算准确，约为 24x ARR。
        - id: comps
          label: AI 可比公司倍数分散
          detail: 垂直 AI 中位数接近 25–30x，但稀缺资产高得多。
        - id: gaps
          label: 缺少经审计财务和优先权结构
          detail: ARR、毛利率、客户队列、现金消耗和清算条款仍为私有信息。
        - id: risk
          label: Agentic AI 饱和与取消风险
          detail: 饱和评论和 Gartner 取消警告压低上行空间。
        - id: decision
          label: TRACK；中等信心；高风险
          detail: 买入前寻找数据更充分的入场点或更好条款。
      edges:
        - from: proof
          to: valuation
          label: 支持溢价
        - from: valuation
          to: comps
          label: 倍数基准
        - from: comps
          to: decision
          label: 合理至偏贵
        - from: gaps
          to: decision
          label: 阻碍确信度
        - from: risk
          to: decision
          label: 提高门槛收益率
    approximationNotes: 逻辑权重是定性判断，不是评分算法。
    claimRefs:
      - CV004
      - CV006
      - CV014
      - CV015
      - CV016
      - CV030
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 同一个 $1.2B 标记，会随真实 ARR 分母不同，从非常偏贵变成更正常。
    data:
      items:
        - label: $35M ARR
          value: 34.3
          detail: $1.2B 估值除以 $35M ARR。
          tone: adverse
        - label: $50M ARR
          value: 24
          detail: 公开基础估算；相对 25–30x 常态化倍数属合理至偏贵。
          tone: warning
        - label: $65M ARR
          value: 18.5
          detail: ARR 更高会让该估值标记更站得住。
          tone: neutral
        - label: $80M ARR
          value: 15
          detail: 上行情景 ARR 对照垂直 AI 中位数会显得有吸引力。
          tone: positive
    approximationNotes: 数值是用 $1.2B 投后估值计算的隐含 ARR 倍数，并四舍五入到一位小数。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV025
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: 情景估值区间说明，当前估值标记要先核验 ARR 和留存，才撑得起风险投资式回报假设。
    data:
      items:
        - label: 悲观估值
          low: 420
          high: 810
          unit: USDm
          note: 若增长质量不达标，在 $35M–$45M ARR 上给 12–18x。
        - label: 基准估值
          low: 1000
          high: 1500
          unit: USDm
          note: 以约 $50M ARR 给 20–30x，覆盖当前 $1.2B 标记。
        - label: 乐观估值
          low: 2450
          high: 4000
          unit: USDm
          note: 若 HappyRobot 证明稀缺品类领导力，以 $70M–$80M ARR 给 35–50x。
    approximationNotes: 区间是情景测算，并非正式估值意见；不包括清算优先权和稀释影响。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 可上投委会的 KPI 显示，公司质量很强，但证据质量偏弱、估值风险高，抵消了部分吸引力。
    data:
      items:
        - label: 投资建议
          value: TRACK
          detail: 公司质量值得跟踪，但价格和私有证据未达到买入门槛。
        - label: 信心
          value: Medium
          detail: 融资和客户证明比收入和毛利率更有佐证。
        - label: 风险评级
          value: High
          detail: 可靠性、饱和、取消、优先权和披露风险仍然重大。
        - label: 估值立场
          value: Stretched
          detail: 按 $1.2B 投后估值计算，约为估算 ARR 的 24x。
        - label: 综合评分
          value: 6.4 / 10
          detail: 上行空间强，但公开财务披露不足。
        - label: 入场门槛
          value: <=20x verified ARR
          detail: 除非条款提供下行保护，否则保持指示性价格纪律。
        - label: 关键尽调关口
          value: Audited ARR bridge
          detail: ARR 分母是估值中最大的摆动因素。
    approximationNotes: KPI 值是投委会判断，来自本章证据集。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV030
      - CV048
