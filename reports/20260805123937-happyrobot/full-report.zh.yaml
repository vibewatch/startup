      - number: '5.6'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              信任是产品的闸门，因为 HappyRobot 运行在智能体可以报价、安排预约、接受货物或与承运人沟通的工作流里。公司声称具备 SOC 2 Type II、GDPR、HIPAA、EU AI Act
              证明、零信任网络、RBAC、租户隔离、每客户加密密钥、区域数据驻留、不用客户数据训练，以及按工作流配置的留存。这些都是企业采用所需的控制类别，但多数仍是公开断言，而不是已披露的审计材料。反向的 Qiscus
              来源提出另一层可靠性担忧：AI 智能体会产生幻觉，需要事实锚定、护栏、升级机制、人工监督和审计轨迹。尽调时，安全主张和幻觉控制应一起审查，因为隐私、准确性和升级机制共同决定自主智能体能否安全运行关键货运运营。
