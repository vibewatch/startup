  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 的可投资市场边界应定义为物流与货运运营的 AI
              自动化，而不是整个物流经济。可纳入的支出，是货运经纪、3PL、承运人和托运人运营中用于执行重复沟通与工作流步骤的软件和自动化预算：承运人销售、调度、check
              call、预约排期、费率核验、催收、文档跟进和客户沟通。应剔除的是更大的实物货运运力、燃油、司机工资、仓储资产和运输采购金额，因为软件无法直接捕获这些支出。数字货运经纪是最接近的垂直市场测算镜头，因为它本来就在数字化货运撮合和经纪工作流；企业
              AI 智能体和对话式 AI 报告只能提供横向邻近参考，不是干净的 TAM。现状替代方案依然强势：人工调度团队、离岸 BPO/呼叫中心劳动力、TMS 工作流、load board、RPA、CRM
              自动化和内部工程团队。这个边界很关键，因为只有把人力密集的沟通转化为可信的自主解决，HappyRobot 才能作为工作流执行切入口被投资论证。
