  - id: TV006
    title: 最终尽调清单表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 桥
        - 按季度拆分的审计级或投资人级 ARR、新增 / 扩张、流失和服务收入拆分
        - 判断 24x ARR 是否真实，或被低估 / 高估
        - 索取财务资料室，并与账单和合同核对
      - - 毛利率与部署成本
        - 每条工作流的模型、电话通信、SRE、支持和实施成本
        - 区分软件质量收入和服务占比高的自动化收入
        - 按客户细分审查分群毛利率和部署回本周期
      - - 留存与集中度
        - NDR、GRR、前 10 大客户集中度、客户 logo 流失和续约时点
        - 验证或打穿高溢价增长论点
        - 查看匿名化分群，并访谈 DHL、Kuehne+Nagel 和 Circle 参考客户
      - - 股权结构表与优先权
        - 清算优先权、参与权、优先顺位、期权池、老股转让和按比例认购条款
        - 决定 $1.2B 估值下真实下行和上行参与
        - 审查章程、融资文件、附函和投资人权利协议
      - - 产品可靠性与责任
        - 事件历史、人工交接、审计日志、熔断开关和赔偿条款
        - 关键任务通话和邮件会带来运营与欺诈暴露
        - 开展技术 / 安全尽调，并抽样复盘工作流失败案例
      - - 退出准备度
        - 上市公司级内控、报告节奏、合规状态和审计师准备度
        - 决定下一轮融资能否走向 IPO，还是继续私募融资
        - 与 CFO 或财务负责人审查内控路线图和董事会材料
    notes: 清单先按估值影响排序，再看法律和退出准备风险；任何定价承诺前都应索取每一项。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV043
      - CV044
      - CV048
