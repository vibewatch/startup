    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              HappyRobot 是一家获风险投资支持的私人 AI 公司，构建并部署自主 “AI workers”——对话式 AI
              智能体，能执行电话、邮件、文档处理、排期、谈判等关键运营工作。公司从货运与物流起步，正在向相邻的重运营行业扩展。HappyRobot 把自己定义为“实体经济的操作系统”，并主打“企业超级智能”叙事：AI
              智能体与人类团队共同放大组织的集体智能。公司官网和 Series C 轮公告都称，智能体横跨语音、SMS、邮件、WhatsApp、webchat、Microsoft Teams 和
              Slack，并接入运输管理系统、load board 与电话系统。公司页面、独立科技媒体和货运行业报道给出的公开身份基本一致：HappyRobot 是聚焦货运的智能体 AI
              供应商，自动化承运人销售、调度、check call、预约排期和催收。这个定位直接影响投资判断，因为业务押注的是 AI 智能体能可靠执行运营交易，而不只是聊天；因此，公司身份和产品可信度与融资叙事无法分开看。
