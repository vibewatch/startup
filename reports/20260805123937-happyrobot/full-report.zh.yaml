    rows:
      - - HappyRobot
        - 垂直物流 AI 智能体
        - $150M Series C，估值 $1.2B；公司声称 150+ 企业客户
        - 货运经纪商、3PL、货主和运营密集型企业
        - 货运原生执行覆盖语音 / 邮件 / 聊天，并接入 TMS 和货源板
        - 财务数据未公开，实际成交价格也未披露
      - - Fleetworks
        - 直接货运 / 物流 AI 同业
        - 约 2025 年 10 月 $16.7M Series A；Tracxn 和 PitchBook 均佐证其 Brooklyn 公司资料
        - 需要围绕承运商工作流获得 AI 辅助的货运运营方
        - 工作流贴近货运运营
        - 公开融资规模较小，公开客户 / 定价细节有限
      - - Vooma
        - 直接货运 / 物流 AI 同业
        - 已融资约 $17.1M；Tracxn 显示 San Francisco 公司资料
        - 将人工货运沟通和文件工作流自动化的物流团队
        - 货运原生专注让它成为直接用例竞争对手
        - 公开来源里的规模、定价和企业级证明更薄
      - - Parade
        - 直接 / 相邻承运运力平台
        - 标准竞争对手事实集中显示已融资约 $37M
        - 管理运力关系的经纪公司和承运商
        - 承运运力管理深度与 HappyRobot 工作流相邻
        - 广泛多语言语音智能体执行的证据较少
      - - Loop AI
        - 相邻供应链 AI
        - 2026 年 4 月由 Valor Equity 领投 $95M Series C
        - 寻求供应链中断预测的企业
        - 预测型中断智能会争夺供应链 AI 预算
        - 从公开报道看，它不是承运商电话执行的直接替代
      - - Drumkit / Pallet / Mentium
        - 直接和相邻物流 AI 创业公司
        - 出现在替代方案和市场图谱来源中，但公开融资细节不一
        - 物流工作流、经纪业务和货运科技买方
        - 扩展了货运 AI 创业公司的竞争宽度
        - 标准化公开规模、定价和客户证据稀疏
      - - Sierra / Decagon
        - 横向企业 AI 智能体
        - Sierra 估值约 $15.8B，ARR 约 $200M；Decagon 估值约 $4.5B，收入约 $44M
        - 企业客服和广义智能体部署
        - 资本基础和企业 GTM 触达远大于 HappyRobot
        - 非货运原生；必须自建或收购物流特定集成
      - - Cresta / Parloa
        - 横向语音 / 联络中心 AI
        - PitchBook 和 AI 公司名录支持其企业对话式 AI 定位
        - 联络中心和客户体验团队
        - 语音 / 联络中心成熟度，以及横向部署打法
        - 可能缺少 HappyRobot 式 TMS / 货源板执行深度
      - - UiPath / Salesforce / CRM / RPA 技术栈
        - 既有软件替代方案
        - 根据品类地位推断装机基础庞大；来源并未把它们列为 HappyRobot 特定同业
        - 企业运营、服务和后台自动化买方
        - 捆绑、采购熟悉度和工作流所有权
        - 通用自动化可能需要服务投入，也缺少货运原生智能体封装
      - - BPO、离岸呼叫中心、内部调度、Flexport / Uber Freight 式平台
        - 现状 / 运营替代
        - 买方仍可选择人工劳动力和既有物流操作系统
        - 拥有现有人手的运营团队、经纪商、货主和承运商
        - 控制感、熟悉度和兜底能力
        - 自动化杠杆较低；可能更慢或更耗人力
    notes: 非穷尽竞争画像，综合章节签名来源和部分 HappyRobot 核心来源；私营公司通常不披露完整融资、收入、客户或实际成交价格。
