    title: 从首个工作流到企业扩张的客户旅程图
    type: journey-map
    layout: wide
    summary: 公开客户旅程从高频通信工作流开始，经过集成和上线；只有可靠性、员工接受度和可衡量结果站得住， 才会继续扩张。
