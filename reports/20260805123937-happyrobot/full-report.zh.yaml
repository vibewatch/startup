      - number: '7.6'
        title: 缓释措施、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              可投资的 HappyRobot 不是单纯更快的 AI 语音代理；它必须是一层受控运营层，合规经过验证、抗欺诈、可靠性可量化。缓释措施应覆盖 AI Act 分类证据、人工监督、AI
              通话透明提示、不可篡改日志、客户级数据保留、身份验证、异常检测、滥用监控、事件响应、供应商冗余和清晰的人工兜底。监控必须量化：欺诈误报和漏报、自主错误率、人工升级率、SLA 未达标、头部账户
              ARR、毛利率、烧钱、未解决投诉和审计状态，至少每季度复盘一次。如果管理层拿不出符合性文件、出现重大自主动作事故、欺诈武器化风险可信、旗舰客户流失、审计指标撑不起估值，或合规与信任团队配置跟不上增长，投资逻辑就失效。在这些测试通过前，正确动作是设置明确止损条件、继续跟踪，而不是假设溢价估值已经去风险。
