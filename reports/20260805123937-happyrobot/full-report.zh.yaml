      - number: '3.2'
        title: 竞争者画像与战略方向
        blocks:
          - type: paragraph
            body: >-
              直接画像证据显示，这个市场已有数家年轻但拿到资金的专业公司。Fleetworks 是公开证据集中证据最充分的直接同行，Tracxn 和 PitchBook 支持其 Brooklyn 货运 AI 画像，并指向
              October 2025 左右 $16.7 million Series A 轮。Vooma 位于 San Francisco，根据 Tracxn 已融资约 $17.1 million；Parade
              则围绕承运人运力管理定位，核心来源集报道其累计融资约 $37 million。Loop AI 相邻但不完全相同：TechCrunch 报道 Valor Equity 领投其 $95 million Series
              C 轮，用于构建预测扰动的供应链 AI，这意味着它更威胁广义供应链自动化预算，而不是 HappyRobot 精确的电话和邮件执行楔子。横向竞争者体量大得多：Sacra 描述 Sierra 估值约 $15.8
              billion、ARR 约 $200 million；AI2.work 和 Compworth 则把 Decagon 放在接近 $4.5 billion 估值和约 $44 million
              收入的位置。画像含义是不对称的：HappyRobot 在货运专项执行上看起来更强，但多家竞争者有足够资本压缩价格，或收购缺失的垂直能力。
