- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric or status
  - Multiple / valuation read-through
  - Relevance to HappyRobot
  - Limitation
  rows:
  - - Sierra
    - ~$15.8B valuation; ~$200M ARR estimate
    - Roughly 79x by simple math; some comp framing cites ~105x
    - Scarce enterprise AI-agent leader benchmark
    - Third-party estimates conflict and segment mix differs
  - - Decagon
    - ~$4.5B valuation; ~$44M revenue or ARR estimate
    - Reported private-agent multiple around ~129x in comp commentary
    - Customer-support AI agent comp with high growth expectations
    - Revenue definition and ARR quality are not public
  - - Parloa
    - ~$3B reported value
    - Voice/conversational-AI premium comp
    - Relevant to HappyRobot's voice-first enterprise workflow layer
    - European segment and financial details are estimated
  - - Harvey
    - ~$11B reported valuation
    - Around 58x ARR in private-AI comp commentary
    - Vertical AI application leader in a workflow-heavy market
    - Legal vertical economics differ from logistics operations
  - - Glean
    - ~$7.2B valuation; ~$200M ARR estimate
    - Around 36x ARR
    - Enterprise knowledge/workflow AI comp with mature enterprise buyers
    - Different product category and retention drivers
  - - Cursor
    - Developer-tool AI comp
    - Around 14.6x in dev-tools multiple commentary
    - Lower-end multiple anchor for high-growth AI software
    - Developer tools are not logistics workflow automation
  - - Vertical / enterprise AI median
    - Series C normalization band
    - Roughly 25–30x revenue or ARR
    - Closest broad private-market frame for HappyRobot's stage
    - Broad median masks quality dispersion and estimate error
  - - Public logistics / connected operations references
    - C.H. Robinson, RXO, and Samsara filings
    - Public disclosure benchmark rather than direct private ARR multiple
    - Helps discipline risk, disclosure, and maturity comparisons
    - Public scale and business models are not direct valuation comps
  notes: Enumeration is a representative public/private comp set built from analyst-market-data and filing sources; multiples are rounded and should be re-cut after audited ARR, revenue definition, and retention are provided.
  enumerationScope:
    coverage: sample
    basis: Covers representative AI-agent private leaders, broad AI multiple frameworks, and public logistics or connected-operations filings available in the 2026 source pack; it is not an exhaustive transaction database.
