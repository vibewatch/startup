- id: bull-base-bear-scenarios
  title: Bull, base, and bear cases
  body: >-
    The bull case requires ARR materially above the public estimate, continued 5x-style momentum, net retention above 150%, and evidence that logistics workflows create a defensible repeatable wedge before horizontal AI vendors and vertical specialists compress pricing. In that case, the market could value HappyRobot closer to scarce agentic-AI leaders and a multi-billion-dollar mark could be plausible. The base case assumes the $50 million ARR estimate is approximately right: at $1.2 billion, the implied 24x ARR multiple is fair-to-stretched against 25–30x enterprise-AI normalization and only modestly better than public logistics/data-intelligence reference ranges. The bear case is that ARR is overstated or low quality, revenue growth decelerates after early deployments, agentic-AI projects are cancelled or pushed into pilots, and multiples compress toward the low-teens to high-teens band. The downside is especially acute because private preference terms may protect late investors while common-equity outcomes absorb most of the reset.
