- id: comparable-set-and-multiple-read-through
  title: Comparable set and multiple read-through
  body: >-
    The relevant comparable set is not a single neat public peer group. HappyRobot sits at the intersection of vertical logistics workflow software, enterprise conversational AI, private agentic-AI leaders, and public connected-operations or brokerage comparables. Sierra, Decagon, Parloa, Harvey, Glean, and Cursor help frame what private investors are paying for scarce AI applications, but their reported ARR and valuation figures are third-party estimates and sometimes produce conflicting multiple math. Fin.ai and Agent Market Cap are useful for directional private-comps context, while Finro, Aventis, and ValueAdd VC help normalize broader AI multiple ranges. C.H. Robinson, RXO, and Samsara filings are not direct valuation matches, yet they ground the discussion in public-company disclosure discipline and risk-factor comparability. The right read-through is that 24x ARR is defensible if the $50 million ARR estimate is true, but stretched if revenue quality, gross margin, or retention falls short.
