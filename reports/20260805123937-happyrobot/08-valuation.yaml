- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting the view
  - What would change the view
  - Direction
  rows:
  - - Category leadership in vertical agentic AI
    - 150+ customers, blue-chip logistics logos, and rapid Series C financing
    - Confirmed ARR quality and repeatable expansion outside the first logistics accounts
    - Thesis
  - - Operational workflow wedge
    - Agents automate voice, email, scheduling, tracking, and negotiation rather than simple chat
    - Failed production reliability, poor human-handoff outcomes, or fraud-driven incidents
    - Thesis
  - - Premium growth profile
    - Company-reported 5x growth and NDR above 150%
    - Cohort data showing NDR below 130% or growth deceleration after initial deployments
    - Thesis
  - - Disclosure gap
    - No audited financial statements, gross margin, burn, or customer concentration disclosed publicly
    - Investor-quality financial package with ARR bridge, cohorts, and margin waterfall
    - Anti-thesis
  - - Frothy agentic-AI market
    - Private comps show extreme dispersion and saturation warnings
    - Multiple compression below vertical-AI normalization or failed follow-on rounds
    - Anti-thesis
  - - Preference and dilution overhang
    - $150M new Series C may carry investor protections not visible publicly
    - Full cap table, liquidation stack, pro-rata, option pool, and strategic rights review
    - Anti-thesis
  notes: The table separates company quality from price risk; anti-thesis rows are not disqualifying unless the named diligence items fail.
