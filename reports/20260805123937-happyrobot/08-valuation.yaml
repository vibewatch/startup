- id: recommendation-confidence-and-risk
  title: Recommendation, confidence, risk rating, and valuation stance
  body: >-
    The chapter recommendation is TRACK, with medium confidence, high risk, and a stretched valuation stance. The score is approximately 6.4 out of 10 because the quality of the category, customer evidence, and growth narrative is stronger than the quality of public financial proof. The strongest confirmatory facts are the corroborated $150 million Series C at a $1.2 billion post-money valuation, the reported total funding near $200 million, and external customer evidence around DHL and Kuehne+Nagel. The limiting facts are that the ARR base appears third-party estimated, the multiple moves sharply with small ARR changes, and comparable-agent valuations have a wide dispersion. The practical IC decision is therefore not “avoid”; it is “track for access,” seek management data, and require either a verified growth bridge or materially better entry terms before committing new primary capital.
  claimRefs:
