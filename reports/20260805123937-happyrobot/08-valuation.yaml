  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or investor-quality revenue, ARR, gross margin, burn, cash runway, NDR, GRR, and cohort retention.
    whyItMatters: These items determine whether the estimated ARR denominator and premium multiple are credible enough to underwrite the $1.2 billion valuation.
    diligencePath: Request the finance data room, audited statements if available, management accounts, customer-contract schedule, ARR bridge, and cohort exports.
    relatedQuestionRefs:
    - QV028
    - QV030
  - type: private-evidence-only
    severity: material
    topic: preference-overhang
    missingEvidence: Financing documents showing liquidation preference, participation, seniority, pro-rata rights, side letters, option-pool changes, and secondary allocations.
    whyItMatters: Preference terms and dilution determine whether a new investor participates in upside or is structurally subordinated after the Series C.
    diligencePath: Review charter, stock purchase agreement, investor-rights agreement, voting agreement, side letters, and post-money cap table.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage
    missingEvidence: Exhaustive private AI-agent transaction database with harmonized ARR definitions, revenue quality, growth, gross margin, and liquidation preference terms.
    whyItMatters: Without a full transaction set, the comparable valuation table remains a representative benchmark rather than a mathematically exhaustive comp screen.
    diligencePath: Rebuild comps from PitchBook/CB Insights data-room exports and banker transaction logs once access is available.
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: material
    topic: comparable-valuations
    missingEvidence: Source-level reconciliation of Sierra and Decagon ARR definitions, valuation dates, and multiple calculations.
    whyItMatters: Divergent private-comp multiple math can make HappyRobot look either normal or expensive depending on the denominator used.
    diligencePath: Pull original financing memos or audited ARR definitions for each comp before using them in a pricing model.
    relatedQuestionRefs:
    - QV016
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Board materials, controls roadmap, auditor readiness, security incident log, claims history, and customer concentration schedule.
    whyItMatters: Exit readiness and next-round valuation depend on whether the company can graduate from private narrative to public-company-quality disclosure.
    diligencePath: Conduct CFO, general counsel, security, and top-customer diligence sessions before a term sheet.
    relatedQuestionRefs:
    - QV022
