evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-financials
    missingEvidence: Audited revenue, ARR, gross margin, and burn figures for 2025-2026.
    whyItMatters: The $1.2 billion valuation cannot be underwritten against a revenue multiple without confirmed financials.
    diligencePath: Request audited financials, an ARR schedule, and a management KPI deck under NDA.
    relatedQuestionRefs:
      - QO018
      - QO021
      - QO026
