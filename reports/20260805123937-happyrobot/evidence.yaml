    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and named executives beyond the founding trio.
    whyItMatters: Governance depth and succession planning matter for a fast-scaling founder-controlled company.
    diligencePath: Request the current org chart, board list, and shareholder-agreement summary from management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: location
    missingEvidence: A definitive statement of HappyRobot's principal headquarters and legal domicile.
