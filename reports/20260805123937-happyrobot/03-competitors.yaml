  rows:
  - - HappyRobot
    - Vertical logistics AI agents
    - $150M Series C at $1.2B valuation; 150+ enterprise customers claimed
    - Freight brokers, 3PLs, shippers and operations-heavy enterprises
    - Freight-native execution across voice/email/chat plus TMS and load-board integrations
    - Private financials and realized pricing remain undisclosed
  - - Fleetworks
    - Direct freight/logistics AI peer
    - $16.7M Series A around Oct. 2025; Brooklyn profile corroborated by Tracxn and PitchBook
    - Freight operators needing AI assistance around carrier workflows
    - Direct workflow proximity to freight operations
    - Smaller public funding base and limited public customer/pricing detail
  - - Vooma
    - Direct freight/logistics AI peer
    - About $17.1M raised; San Francisco profile in Tracxn
    - Logistics teams automating manual freight communication and document workflows
    - Freight-native specialization makes it a direct use-case competitor
    - Scale, pricing, and enterprise proof are thinner in public sources
  - - Parade
    - Direct/adjacent carrier capacity platform
    - Approximately $37M raised in canonical competitor facts
    - Brokerages and carriers managing capacity relationships
    - Carrier capacity management depth adjacent to HappyRobot workflows
    - Less evidence of broad multilingual voice-agent execution
  - - Loop AI
    - Adjacent supply-chain AI
    - $95M Series C in Apr. 2026 led by Valor Equity
    - Enterprises seeking supply-chain disruption prediction
    - Predictive disruption intelligence can compete for supply-chain AI budget
    - Not a direct carrier-call execution substitute based on public coverage
  - - Drumkit / Pallet / Mentium
    - Direct and adjacent logistics AI startups
    - Listed in alternative and market-map sources, but public funding detail varies
    - Logistics workflows, brokerage operations, and freight tech buyers
    - Adds breadth to the freight AI startup field
    - Sparse standardized public scale, pricing, and customer evidence
  - - Sierra / Decagon
    - Horizontal enterprise AI agents
    - Sierra roughly $15.8B valuation and ~$200M ARR; Decagon roughly $4.5B valuation and ~$44M revenue
    - Enterprise customer support and broad agent deployments
    - Far larger capital bases and enterprise GTM reach
    - Not freight-native; must build or buy logistics-specific integrations
  - - Cresta / Parloa
    - Horizontal voice/contact-center AI
    - PitchBook and AI-company directories support enterprise conversational AI positioning
    - Contact centers and customer-experience teams
    - Voice/contact-center maturity and horizontal deployment playbooks
    - May lack HappyRobot-style TMS/load-board execution depth
  - - UiPath / Salesforce / CRM/RPA stack
    - Incumbent software substitutes
    - Large installed bases inferred from category position; not sourced as HappyRobot-specific peers
    - Enterprise operations, service, and back-office automation buyers
    - Bundling, procurement familiarity, and workflow ownership
    - Generic automation may require services and lacks freight-native agent packaging
  - - BPO, offshore call centers, in-house dispatch, Flexport/Uber Freight style platforms
    - Status quo / operating substitutes
    - Manual labor and existing logistics operating systems remain available to buyers
    - Operations teams with existing personnel, brokers, shippers, and carriers
    - Control, familiarity, and fallback capacity
    - Lower automation leverage; may be slower or more labor-intensive
  notes: Non-exhaustive competitive profile synthesized from the chapter signature sources and selected HappyRobot core sources; private companies generally do not disclose complete funding, revenue, customers, or realized pricing.
