- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat vector
  - Severity
  - Mitigation or diligence ask
  - Evidence posture
  rows:
  - - Freight-specific workflow context and execution
    - Direct peers replicate high-ROI workflows such as check calls, carrier outreach, and document handling
    - High
    - Inspect customer-specific playbooks, win/loss data, and deployment time by workflow
    - Supported by HappyRobot official surfaces plus peer profiles
  - - Deep TMS/load-board/telephony integrations
    - Horizontal vendors or incumbents partner, acquire, or build connectors
    - High
    - Review integration backlog, customer dependency, connector usage, and data portability terms
    - Company-claimed; needs private integration usage proof
  - - Multilingual voice and model-agnostic orchestration
    - Voice-agent components commoditize and become available through broader platforms
    - Medium
    - Benchmark call completion, accent handling, fallback, and model-swap costs against peers
    - Supported by company positioning; third-party benchmark missing
  - - Customer logos and enterprise trust
    - Large vendors bundle agents into existing CRM/RPA/support contracts
    - Medium
    - Compare renewal rates, expansion, and customer concentration against competitive wins
    - Public logos strong but contract depth private
  - - Vertical GTM focus in logistics
    - Freight recession or budget compression narrows procurement windows while peers discount
    - Medium
    - Request pipeline by segment, churn by cohort, and discounting history
    - Inferred from competitive funding and market-map evidence
  - - Operational switching cost after deployment
    - Buyers multi-home, retain call centers, or split workflows across vendors
    - High
    - Test portability, termination clauses, data export, and fallback operating procedures
    - Adverse multi-homing risk is inferred from substitutes and opaque pricing
  notes: Risk register separates public evidence from private diligence asks; no row assumes exclusivity, exhaustive competitor coverage, or proven switching-cost economics.
