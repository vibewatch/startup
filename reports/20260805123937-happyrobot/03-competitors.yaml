  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-trust-and-sla-proof
    missingEvidence: Comparable vendor security attestations, uptime SLAs, audit logs, data-residency controls, integration certifications, and regulated-workflow evidence for HappyRobot and named competitors.
    whyItMatters: Trust and regulatory posture affect displacement risk in mission-critical freight communications but are not consistently disclosed across private vendors.
    diligencePath: Request security packs, SOC reports, SLA schedules, integration certifications, and enterprise reference calls from HappyRobot and short-listed competitors.
    relatedQuestionRefs:
    - QP018
    - QP026
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contract-benchmarks
    missingEvidence: Realized customer contract prices, discounting, minimum commitments, overage rates, support bundles, uptime remedies, and gross-margin impact for HappyRobot and competing agent vendors.
    whyItMatters: Without actual contract terms, pricing power, margin durability, and substitution economics versus BPO or incumbents cannot be underwritten.
    diligencePath: Review anonymized customer contracts, renewal quotes, competitive bid sheets, and procurement comparisons under NDA.
    relatedQuestionRefs:
    - QP029
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss-and-lock-in
    missingEvidence: Customer-level win/loss data, churn reasons, multi-homing prevalence, data-export rights, implementation cost, and displacement attempts by horizontal or direct competitors.
    whyItMatters: Moat durability depends on observable switching costs and competitive win rates, not just public feature claims or funding scale.
    diligencePath: Conduct management diligence on churn cohorts, request win/loss summaries, test data portability clauses, and interview logistics customers who evaluated multiple vendors.
    relatedQuestionRefs:
    - QP030
    relatedTableRefs:
    - TP004
