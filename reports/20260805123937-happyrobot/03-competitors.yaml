- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Option
  - Public pricing / package evidence
  - Likely commercial unit
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - HappyRobot
    - No comparable public list pricing found on reviewed official surfaces
    - Enterprise contract, workflow, usage, or task volume likely, but unconfirmed
    - AI workers across voice/email/chat with logistics integrations
    - Realized price, gross margin, usage tiers, and SLA terms unknown
    - Underwrite ROI and pricing power only after reviewing customer contracts
  - - Direct freight AI peers
    - Alternative and profile pages generally do not expose standardized pricing
    - Workflow subscription or usage-based automation likely, but unconfirmed
    - Narrow freight communication, capacity, document, or dispatch workflows
    - List-vs-realized pricing and discounting unknown
    - Price competition could emerge first in narrow use cases
  - - Horizontal AI agents
    - Vendor comparison evidence emphasizes support automation rather than freight pricing
    - Enterprise support-agent contracts, seats, conversations, or usage
    - Customer support, voice, and cross-channel agents
    - Vertical integration surcharges and contract bundling unknown
    - Horizontal vendors can bundle into broader customer-experience budgets
  - - RPA/CRM incumbents
    - Existing enterprise software budgets and add-ons, but no HappyRobot-specific substitute price in sources
    - Seats, platform modules, services, or consumption add-ons
    - Workflow automation, CRM/service processes, integration ecosystem
    - Services effort and hidden implementation cost may be material
    - Bundling can compress standalone agent margins
  - - BPO / offshore call centers / internal teams
    - Labor-rate and staffing alternative, not standardized in retained sources
    - FTE, hourly, outsourced service, or internal cost center
    - Manual exception handling, relationship continuity, and fallback operations
    - Quality, turnover, 24/7 coverage, and management overhead vary
    - Sets the ROI hurdle for automation and caps willingness to pay
  notes: All pricing rows are non-enumeration and evidence-constrained; public sources support absence of comparable list pricing more strongly than actual realized contract terms.
