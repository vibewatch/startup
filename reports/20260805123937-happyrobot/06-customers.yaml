- id: expansion-and-concentration-risk
  title: Expansion and concentration risk
  body: >-
    HappyRobot's land-and-expand path is credible because the product can start with a narrow communication workflow, prove automation or service-level gains, then expand into adjacent calls, emails, documents, scheduling, sales, and other operational channels. The Series C narrative adds a second expansion vector beyond logistics into insurance, energy and utilities, telecommunications, airlines, and financial services, while company materials cite 5x sales outcomes in underutilized channels. The risk is that the public customer narrative leans heavily on a small group of blue-chip logistics logos — especially DHL, Kuehne+Nagel, Circle Logistics, Uber Freight, Ryder, Flexport, and Werner — without disclosing revenue concentration, top-customer percentages, or renewal status. There is also labor-displacement and reputational risk: automating carrier check calls and dispatcher/coordinator workflows can trigger pushback even when Circle says no jobs were lost. Concentration and labor backlash should therefore be diligence priorities, not footnotes, because they can impair references, renewals, and expansion velocity.
