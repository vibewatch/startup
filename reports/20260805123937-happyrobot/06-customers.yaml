  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale or geography signal
  - Strategic value
  - Gap
  rows:
  - - Enterprise freight brokers and 3PLs
    - Ops leader buys; dispatch, carrier-sales, and coordinator teams use; operations budget pays
    - Check calls, booking, inbound/outbound calls, email triage, status updates
    - Circle Logistics, Ryder, Flexport, Werner, Uber Freight named in public materials
    - Original wedge with concrete workflow outcomes
    - Revenue by broker segment and logo-level renewal status are not disclosed
  - - Global contract logistics and freight-forwarding providers
    - Supply-chain executives buy; customer-service and air/logistics teams use; enterprise procurement pays
    - Customer communications, status checks, email processing, voice interactions
    - DHL and Kuehne+Nagel provide named customer proof across global operations
    - Blue-chip validation and reference quality
    - Production scope versus pilot scope varies by account
  - - Shippers, carriers, and transport groups
    - Transportation or supply-chain operations executives buy; carrier-facing teams use; transformation budget pays
    - Load tracking, scheduling, negotiation, rate verification, proof-of-delivery workflows
    - Uber Freight, LKW WALTER, Naturgy, Repsol cited as enterprise logos
    - Extends wedge beyond freight brokerage
    - Limited public outcome metrics for most logos
  - - Non-logistics operations verticals
    - Insurance, energy, telecom, airline, and financial-services operations leaders buy; service teams use
    - High-volume voice, email, document, and scheduling workflows
    - Company claims expansion beyond logistics in 2026 materials
    - Enlarges addressable market and reduces logistics cyclicality
    - Named deployments and outcomes outside logistics are sparse
  - - Sales and underutilized-channel teams
    - Revenue or operations leaders buy; sales/support teams use; commercial budget pays
    - Re-activating low-utilization channels and automating follow-up communications
    - Company claims sales teams generated 5x more revenue through underutilized channels
    - Potential upsell motion inside existing enterprises
    - No independent cohort or channel-by-channel proof
  notes: Segmentation is based on named customer proof, company-claimed logos, and public use-case descriptions; customer counts by geography, contract value, and vertical revenue mix are not disclosed.
