  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Full 150+ customer roster, deployment status, customer-level revenue, and outcome metrics by named account.
    whyItMatters: The public named-customer proof table samples the strongest visible accounts and cannot quantify production penetration or concentration across the full base.
    diligencePath: Request a customer roster, reference list, deployment-stage export, and account-level ARR under NDA.
    relatedQuestionRefs:
    - QU015
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Gross revenue retention, logo churn, cohort NDR, renewal rates, customer-level CSAT, and contract duration by customer segment.
    whyItMatters: Company-claimed NDR and CSAT are useful but cannot prove durable revenue without cohort and renewal evidence.
    diligencePath: Request cohort retention schedules, renewal histories, churned-account interviews, and the methodology behind CSAT and NDR.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-5 and top-10 customer revenue concentration, top-account renewal dates, reference dependency, and customer-specific gross margin.
    whyItMatters: The public story depends on a few flagship logos, so concentration could materially affect renewal risk and valuation support.
    diligencePath: Obtain ARR by customer, signed renewal calendars, customer health scores, and reference-call transcripts for top accounts.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: non-logistics-expansion-proof
    missingEvidence: Named non-logistics customer case studies with deployment stage, use case, outcome metrics, and renewal or expansion evidence.
    whyItMatters: Expansion beyond logistics is central to the platform story but remains less proven than freight and supply-chain adoption.
    diligencePath: Ask management for non-logistics customer references and search for customer-issued announcements in insurance, energy, telecom, airlines, and finance.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU001
    - TU005
