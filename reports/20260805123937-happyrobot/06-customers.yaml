figures:
- id: FU001
  title: Customer journey map from first workflow to enterprise expansion
  type: journey-map
  layout: wide
  summary: The public customer journey starts with a high-volume communication workflow, moves through integration and go-live, and expands only if reliability, labor acceptance, and measurable outcomes hold.
  data:
    nodes:
    - id: pain
      label: High-volume operations pain
      detail: Enterprise teams face repetitive calls, emails, status checks, booking, and scheduling work across freight and other operations-heavy verticals.
      tone: warning
    - id: pilot
      label: Narrow workflow pilot
      detail: Buyers test a contained use case such as status checks, carrier calls, inbound calls, or email triage.
      tone: neutral
    - id: integration
      label: Systems integration
      detail: Agents connect to TMS, load boards, telephony, email, or internal systems so they can execute rather than only converse.
      tone: neutral
    - id: golive
      label: Four-to-twelve-week go-live
      detail: Company materials claim agents typically reach live deployment within 4-12 weeks.
      tone: positive
    - id: production
      label: Operational workload absorption
      detail: Circle, DHL, and Kuehne+Nagel evidence shows freight booking, status checks, emails, calls, and voice minutes shifting to AI agents.
      tone: positive
    - id: expansion
      label: Multi-workflow expansion
      detail: NDR above 150% and 5x sales-channel claims imply potential expansion from initial workflows into broader operations.
      tone: positive
    - id: risk
      label: Retention and labor gates
      detail: Renewal data, concentration exposure, accuracy, and labor-displacement acceptance remain the key diligence gates.
      tone: adverse
  approximationNotes: Journey stages are an analyst synthesis from public customer stories and company deployment claims, not a disclosed sales-funnel dataset.
  claimRefs:
  - CU003
  - CU010
  - CU020
  - CU024
  - CU036
  - CU039
