chapter:
  number: 6
  title: Customers
  summary: HappyRobot has unusually concrete customer proof for a private AI-agent startup, anchored by DHL, Kuehne+Nagel, and Circle Logistics deployments or pilots plus a company-claimed base of 150+ enterprises, but retention, contract durability, logo concentration, and audited outcome attribution remain largely private or customer-claimed.
sections:
- id: customer-segmentation
  title: Customer segmentation
  body: >-
    HappyRobot's public customer base is concentrated in enterprise operations teams whose pain is high-volume communication rather than generic chatbot support. The buyer is usually an operations, logistics, supply-chain, or customer-communications executive who owns cost, service-level, and capacity outcomes; the daily users are dispatchers, carrier-sales reps, customer-service agents, coordinators, or back-office teams; and the payer is typically an enterprise operations or transformation budget rather than an individual seat buyer. Public evidence shows a freight and logistics wedge: freight brokers, 3PLs, shippers, contract-logistics providers, and carrier-facing teams handling check calls, status updates, email triage, inbound calls, appointment scheduling, and booking. The company now claims 150+ enterprise customers and names DHL, Kuehne+Nagel, Uber Freight, Naturgy, Repsol, and LKW WALTER, which implies a base skewed toward large global accounts and enterprise procurement rather than SMB self-service. Geography appears transatlantic and Europe-heavy through San Francisco, Madrid, DHL, Kuehne+Nagel, and LKW WALTER proof, but customer-count splits by region, segment, and revenue band are not public.
