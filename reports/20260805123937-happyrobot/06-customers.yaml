- id: adoption-trajectory
  title: Adoption trajectory
  body: >-
    Adoption proof is strongest at the activity and use-case level, less complete at the account-retention level. HappyRobot reports more than 10 million interactions per month on its homepage, millions of tasks per month in its Series C announcement, more than 70% average autonomous resolution, 75% cost reduction, 10x capacity increases, agents typically live in four to twelve weeks, and one unnamed customer automating 28,000 hours of work per month. These figures indicate rapid deployment and repeated workflow usage, but they are company-claimed and lack denominators such as active production accounts, number of agents per account, gross churn, or cohort renewal rates. Named deployments add texture: Circle Logistics moved specific freight workflows into zero-touch or near-zero-touch automation, Kuehne+Nagel disclosed a pilot with 10,000+ status checks and 6,000+ emails, and DHL described annual volumes of hundreds of thousands of emails and millions of voice minutes. The trajectory therefore looks like expanding workload depth inside enterprise accounts, with public evidence better at proving operational usage than recurring revenue durability.
