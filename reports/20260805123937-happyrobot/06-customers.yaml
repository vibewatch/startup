- id: retention-durability
  title: Retention and durability
  body: >-
    Durability evidence is promising but incomplete. HappyRobot claims net dollar retention above 150%, a 9.4 out of 10 customer-satisfaction score, agents that go live in four to twelve weeks, and substantial workload automation inside named customers, all of which point toward expansion potential if validated. However, no public source discloses gross revenue retention, logo churn, cohort retention, renewal rates, contract length, minimum commitments, customer-level NRR, customer-level CSAT methodology, or support ticket trends. That distinction matters because AI-agent adoption can show impressive first-workflow automation while still facing renewal risk if reliability, procurement, labor acceptance, or integration maintenance disappoint. The best public proxy for durability is repeat workload usage: DHL's annualized volumes, Circle's all-day inbound coverage and freight-booking share, and Kuehne+Nagel's high-volume pilot activity. For underwriting, those proxies should be treated as signs of operational embeddedness, not substitutes for renewal and cohort data under NDA.
