- id: named-customer-proof
  title: Named customer proof
  body: >-
    The named-customer file is better than logo-wall evidence because several references tie customers to workflows and measurable outcomes. Circle Logistics is the clearest production-style proof: HappyRobot says 18% of all freight was booked with zero human touch, manual calls fell 80% to 100% by use case, margins were about 10% higher, inbound calls were answered 24/7, ROI exceeded 5x, and no jobs were lost because the system augmented teams while integrating with Transport Pro TMS, DAT, Truckstop, and Highway. Kuehne+Nagel is clearly labeled as a pilot: the company reports 10,000+ status checks, 6,000+ emails, 78% of connected calls handled end-to-end by AI, and 47% additional team capacity, with a named executive quote from Yngve Ruud. DHL is the most independent blue-chip proof because DHL Group issued the press release, describing HappyRobot agents handling large email and voice volumes and including Lindsay Bridges' endorsement. Uber Freight, Naturgy, Repsol, LKW WALTER, Ryder, Flexport, and Werner strengthen logo quality, but most public outcome metrics remain company- or customer-claimed.
