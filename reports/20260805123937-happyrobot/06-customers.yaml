- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Workflow expansion from calls into emails, documents, scheduling, collections, and sales channels
    - Expansion economics may depend on a few high-volume customers proving multiple workflows
    - Strong NDR is plausible but unverified without cohort and top-account data
    - Request account-level product adoption, ACV expansion, and workflow count by customer
  - - New vertical expansion into insurance, energy, utilities, telecom, airlines, and financial services
    - Public named-proof still skews heavily toward logistics and supply chain
    - Reduces freight-cycle exposure only if non-logistics deployments become material
    - Request vertical ARR split and named references outside logistics
  - - Blue-chip customer references such as DHL, Kuehne+Nagel, Uber Freight, and Circle Logistics
    - Public narrative is concentrated around a small number of logos
    - A lost flagship reference could slow enterprise procurement and future fundraising narratives
    - Request top-5 and top-10 revenue concentration plus renewal status
  - - Automation of dispatcher, coordinator, and carrier-check-call workflows
    - Labor-displacement backlash could undermine adoption or force slower human-in-the-loop deployments
    - Reputational and implementation risk, partly offset by Circle's no-jobs-lost claim
    - Interview customer operations leaders and frontline users about labor acceptance
  - - Company-claimed outcomes and customer-supplied testimonials
    - ROI and margin claims could be overstated without independent measurement
    - Valuation and expansion case weaken if outcomes are not repeatable across cohorts
    - Rebuild ROI from raw call, booking, margin, and labor-hour data under NDA
  notes: Expansion upside and concentration downside are analyzed together because the same few flagship accounts supply much of the public proof and likely influence references, upsell credibility, and valuation support.
