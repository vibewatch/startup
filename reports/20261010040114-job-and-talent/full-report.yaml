  - id: FU001
    title: Customer Journey and Expansion Loops Map
    type: journey-map
    summary: >-
      End-to-end customer lifecycle spanning enterprise client onboarding, worker matching, shift execution, and
      workforce retention loops.
    approximationNotes: >-
      Stages and touchpoints synthesized from Job&Talent client onboarding disclosures, worker terms of use, and in-app
      feature specifications.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU011
    data:
      nodes:
        - id: demand-intake
          label: Demand Intake
          stage: 1. Demand Intake
          actor: Enterprise Employer
          action: >-
            Defines volume staffing needs, shift schedules, and required worker qualifications across warehouse or
            logistics facilities.
          touchpoints:
            - Job&Talent Business web portal
            - Account manager interface
        - id: automated-sourcing
          label: Candidate Sourcing & Vetting
          stage: 2. Candidate Sourcing & Vetting
          actor: AI Recruiter (Clara)
          action: >-
            Contacts applicants within minutes, runs automated screening interviews, and verifies eligibility without
            requiring a CV.
          touchpoints:
            - Clara conversational interface
            - Job&Talent mobile app
        - id: contract-and-onboarding
          label: Digital Onboarding
          stage: 3. Digital Onboarding
          actor: Candidate & Employer
          action: >-
            Uploads identity verification documents and signs digital employment contracts within the mobile
            application.
          touchpoints:
            - Mobile app contract signature
            - Digital subscription service
        - id: shift-execution
          label: Shift Execution & Attendance
          stage: 4. Shift Execution & Attendance
          actor: Shift Worker & Supervisor
          action: >-
            Clocks in and out using geolocation verification; supervisors monitor attendance and no-shows via real-time
            dashboard.
          touchpoints:
            - Geolocation mobile clocking
            - Supervisor live dashboard
        - id: payroll-and-billing
          label: Payroll & Commercial Settlement
          stage: 5. Payroll & Commercial Settlement
          actor: Job&Talent Billing Engine
          action: Automatically aggregates verified shift hours into automated client invoices and rapid worker compensation.
          touchpoints:
            - Automated payroll engine
            - Client invoicing portal
        - id: workforce-expansion
          label: Expansion & Permanent Management
          stage: 6. Expansion & Permanent Management
          actor: Enterprise Account Lead
          action: >-
            Expands staffing coverage across additional facilities and extends platform software to manage permanent
            internal staff.
          touchpoints:
            - Enterprise review
            - Integrated workforce platform
