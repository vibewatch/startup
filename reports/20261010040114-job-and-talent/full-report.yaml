              - CO002
              - CO003
      - number: '1.2'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Job&Talent has accumulated an extensive syndicate of institutional backing since Kibo Ventures entered as
              its first institutional fund. Over subsequent financing rounds, major global venture and growth investors
              including Atomico, SoftBank, Kinnevik, BlackRock, and DN Capital joined the cap table. In April 2025, the
              company completed a 92 million Euro Series F round valuing Job&Talent at 1.3 billion Euros, reflecting a
              down round relative to secondary market platforms like Forge Global that previously tracked last known
              marks at 2.35 billion dollars in January 2026. Detailed capitalization tables, liquidation preferences,
              and debt facilities remain private, posing an ongoing analytical gap for equity investors.
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO010
      - number: '1.3'
        title: Operating Scale, Unit Economics, and Operational Milestones
        blocks:
          - type: paragraph
            body: >-
              Operationally, Job&Talent generated 1.8 billion Euros in revenue in 2024 with underlying EBITDA of 61.3
              million Euros, expanding its contribution margin to 27.3% and revenue per FTE to 804 thousand Euros. The
              platform placed over 300,000 workers across more than 3,250 client companies in 2024, deploying its
              proprietary Clara AI recruiter to conduct over 180,000 candidate interviews and directly complete 7,000
              hires. In the United States, which represents its largest and fastest-growing geography, Job&Talent
              contracts local industrial and logistics workers across regional distribution hubs. While third-party
              breach monitoring lists a historical 2018 credential exposure affecting 11.0 million records, no active
              breaches or security compromises are recorded for 2026.
