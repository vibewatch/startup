companyProfile:
  summary: >-
    Job&Talent is a Madrid-based workforce management and temporary staffing platform founded in 2009 by Juan Urdiales
    and Felipe Navio. The company combines high-volume blue-collar placement operations with AI-enabled workflow
    software for recruiting, scheduling, attendance, and payroll, and it now operates across 10 countries with a large
    enterprise customer base. FY2024 results showed real operating leverage, but the business remains a hybrid staffing
    model rather than a pure software company, so valuation still depends heavily on capital-structure clarity and
    sustained execution.
  foundedDate: '2009-01-01'
