      - number: '5.3'
        title: Engineering Architecture, Cloud Infrastructure, and Open Source
        blocks:
          - type: paragraph
            body: >-
              Job&Talent's software engineering organization structures its core capabilities into three primary
              verticals: Marketplace, Attendance, and Scale. The backend microservices architecture utilizes a polyglot
              foundation encompassing Ruby on Rails, Python, Elixir, and Node.js deployed across Amazon Web Services
              (AWS) infrastructure. Developer operations leverage Docker containerization and Terraform
              infrastructure-as-code to standardize internal cloud environments (Devcloud). On the public developer
              surface, Job&Talent maintains 54 public repositories under its GitHub organization, demonstrating
              historical engineering contributions in Swift UI components, Ruby API clients, and Gradle action
              automation. However, proprietary matching algorithms, dispatch heuristics, and latency telemetry are
              managed in private repositories without public documentation.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE014
