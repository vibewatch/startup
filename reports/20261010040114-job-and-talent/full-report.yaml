chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Leadership Governance
        blocks:
          - type: paragraph
            body: >-
              Founded in Madrid in 2009 by co-CEOs Juan Urdiales and Felipe Navio, Job&Talent operates across 10
              international markets supplying temporary labor in logistics, warehousing, and retail. Corporate
              leadership includes Chief Financial Officer Linda Hoglund, Chief Technology Officer Uri Saranga, and
              regional operating heads across the United States and Europe. The executive team maintains centralized
              governance through its Madrid headquarters while establishing a global whistleblower channel for workers
              and corporate staff to report compliance infractions. However, public user feedback on Trustpilot and
              mobile review platforms highlights recurring worker disputes regarding app glitches, payroll customer
              service responsiveness, and local branch communication.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO008
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
