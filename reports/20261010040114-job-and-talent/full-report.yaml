              - CU011
      - number: '6.3'
        title: Adoption Trajectory and Named Deployment Proof
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption metrics reflect significant operating scale across Job&Talent's international
              footprint. By the close of 2024, the company disclosed active commercial relationships with more than
              3,250 enterprise companies across ten operating countries, placing over 300,000 workers globally in
              essential logistics, warehousing, and retail sectors. The United States has emerged as Job&Talent's
              primary growth engine since its launch in 2021, recording 27% year-over-year revenue growth in the final
              quarter of 2024. Production deployment proof is evident in regional logistics hubs, such as active
              recruitment operations for packing roles at $17.00 per hour with a leading logistics provider in South
              Whitehall Township, Pennsylvania. Furthermore, early customer trials of Clara demonstrated high
              throughput, completing over 180,000 screening interviews and generating more than 7,000 successful
              placements, confirming enterprise willingness to rely on automated AI agents for high-velocity front-line
              recruitment.
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
