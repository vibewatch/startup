              - CE014
      - number: '5.4'
        title: Platform Maturity, Security Governance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Job&Talent demonstrates commercial operating scale across European and North American markets, but its
              technical delivery faces verifiable product and reliability risks. While historical breach monitoring
              catalogues an unconfirmed 2018 credential exposure affecting approximately 11.0 million records, no major
              security breaches have been catalogued through 2026. Governance controls include a dedicated Whistleblower
              Channel for reporting organizational or operational misconduct. Conversely, external user reviews on
              Trustpilot reveal recurring mobile application glitches, form submission errors, and communication
              disconnects during onboarding. Furthermore, because Job&Talent does not disclose model architectures,
              training datasets, or benchmarked dispatch latency, investors cannot independently verify whether its
              algorithmic matching delivers a defensible software moat beyond conventional rule-based agency dispatch.
            claimRefs:
              - CE001
              - CE004
