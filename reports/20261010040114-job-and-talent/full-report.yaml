      - number: '6.4'
        title: Retention, Churn, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite robust headline scale, significant diligence vulnerabilities surround customer retention
              durability, user satisfaction, and client concentration. Job&Talent does not publicly report net revenue
              retention, gross revenue retention, or annual enterprise logo renewal rates, leaving investors unable to
              verify whether top-line expansion represents durable cohort compounding or transactional volume
              replacement. On the candidate side, public reviews on Trustpilot reveal meaningful software friction,
              including persistent app glitches during registration, unresponsive customer support lines, and payment
              disputes from frontline workers. While the company operates across 3,250 enterprise clients in ten
              countries, revenue concentration among anchor third-party logistics accounts remains undisclosed, exposing
              the business to potential volume shocks if major e-commerce or logistics contracts re-tender or insource
              warehouse operations.
            claimRefs:
              - CU012
              - CU013
              - CU014
