              - CR008
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Worker App Friction and Payment Processing Dispute Exposure
            body: >-
              Operational reviews on Trustpilot reveal recurring complaints regarding onboarding app glitches and
              payroll dispute resolution, representing a direct threat to temporary worker retention and supply
              reliability during peak logistics hiring surges.
            calloutType: risk
            claimRefs:
              - CR009
              - CR011
          - type: callout
            title: Multi-Jurisdictional Compliance Burden in Frontline Staffing
            body: >-
              Operating across the UK, EU, US, and Latin America exposes Job&Talent to heterogeneous statutory
              transparency, tax, and anti-money laundering mandates, requiring formal local compliance frameworks such
              as Colombia's PTEE and SAGRILAFT.
            calloutType: insight
            claimRefs:
