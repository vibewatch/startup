  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Job&Talent operates at the convergence of high-volume contingent staffing and AI-driven workforce
              management software. The platform's primary market boundary encompasses temporary labor spend in frontline
              essential industries, including logistics, e-commerce fulfillment, warehousing, and light manufacturing.
              Unlike professional IT contracting or executive recruitment, this category requires rapid, multi-shift
              placement of pre-vetted hourly workers. Incumbent staffing providers such as Adecco, Randstad, and
              Manpower traditionally address this demand via distributed brick-and-mortar branch networks, resulting in
              substantial overhead and slower time-to-hire. Job&Talent substitutes this legacy agency model with an
              automated digital marketplace while extending into client enterprise software to manage internal and
              permanent frontline workforces.
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
      - number: '2.2'
        title: Market Sizing Lenses and Segment Sizing Constraints
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for Job&Talent requires evaluating both global staffing macro trends and
              regional frontline industrial concentration. While global commercial staffing exceeds €500 billion
              annually, cyclical macroeconomic headwinds caused a 9.5% market contraction in 2024 as e-commerce
              fulfillment cooled from pandemic highs. Within Job&Talent's core focus areas—logistics and light
              industrial temporary labor across Europe and the United States—the addressable market spans approximately
              €150 billion to €200 billion. Within the 10 countries where Job&Talent maintains active regulatory
              licenses, the serviceable market is bounded near €50 billion. Job&Talent captured €1.8 billion in 2024
              revenue across 300,000 placed workers, outperforming the sector by 8 percentage points globally and
              achieving 5.7% growth in the United States.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
