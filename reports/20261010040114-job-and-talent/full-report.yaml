  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Job&Talent structures its commercial go-to-market strategy around two interconnected customer groups:
              enterprise employers requiring flexible, high-volume frontline staffing and temporary workers seeking
              dependable hourly shift employment. On the enterprise side, buyers are typically corporate vice presidents
              of supply chain, warehouse general managers, and human resources directors operating in warehousing,
              third-party logistics, retail distribution, and light manufacturing facilities. These corporate buyers
              demand rapid fill rates, automated attendance verification, and labor compliance to handle volatile
              seasonal throughput and structural labor shortages. On the worker side, Job&Talent provides a
              consumer-grade mobile application that allows candidates to complete digital applications, sign employment
              contracts, track shift schedules, clock hours via geolocation, and access rapid wage payouts. The company
              is also piloting software extensions to allow existing enterprise clients to manage internal permanent
              staff alongside contingent workers, expanding its addressable software value proposition beyond pure temp
              staffing.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Customer Journey and Digital Adoption Surfaces
        blocks:
          - type: paragraph
            body: >-
              The customer lifecycle at Job&Talent begins when an enterprise employer submits volume staffing demands
              and shift parameters through the enterprise portal. Sourcing and screening workflows are increasingly
              automated: the proprietary AI recruiting agent Clara initiates contact with applicants within minutes of
              submission, conducting automated voice and text screening interviews without requiring a formal curriculum
              vitae. Once screened and matched, candidates sign digital employment contracts directly inside the mobile
              app. Operational adoption during active shifts centers on digital time clocking; during a Spanish test
              pilot, voluntary worker adoption of in-app time clocking surged from 68.6% to 95.6% within three months.
              Shift managers receive real-time attendance dashboards that flag no-shows immediately, while verified
              geolocation punch data automatically feeds payroll processing and commercial invoicing. This integrated
              digital loop enhances workforce transparency and reduces operational administrative overhead for facility
              supervisors.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
