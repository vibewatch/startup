      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Gamification as an Operational Absenteeism Countermeasure
            body: >-
              Job&Talent's primary product innovation lies in converting routine worker shift interactions into
              quantified attendance metrics. By gamifying attendance scores and response rates through its mobile
              application, the platform aims to systematically predict and curb unexcused temp worker absences before
              shift starts.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Mobile Stability Friction and Proprietary AI Opacity
            body: >-
              While Job&Talent markets an AI-powered staffing paradigm, independent worker reviews highlight critical
              mobile app glitches during application and onboarding flows. Furthermore, Job&Talent maintains complete
              algorithmic opacity regarding matching model architectures, training datasets, and actual dispatch
              latency.
            calloutType: risk
            claimRefs:
              - CE011
