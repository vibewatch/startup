      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Transition and Capital Recalibration
            body: >-
              Job&Talent's transition from a pure marketplace into an AI-enabled workforce platform delivered 27.3%
              contribution margins and 61.3 million Euros in underlying EBITDA in 2024. However, its 2025 Series F
              equity round priced at 1.3 billion Euros confirms a material valuation reset compared to secondary marks
