        title: Exhibits
        blocks:
          - type: callout
            title: Rapid In-App Adoption and High-Volume AI Sourcing
            body: >-
              Job&Talent demonstrates strong operational adoption with in-app digital time tracking rising from 68.6% to
              95.6% during pilot testing in Spain, complemented by AI recruiter Clara completing over 180,000 automated
              interviews and enabling more than 7,000 placements across high-volume logistics and retail sectors.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Mobile App Friction and Opaque Enterprise Retention Metrics
            body: >-
              Worker reviews on Trustpilot reveal recurring friction regarding app crashes, unresponsive support, and
              disputed shift payments, while enterprise customer renewal rates, net retention rates, and top-account
              concentration remain undisclosed, creating uncertainty regarding the durability of client relationships.
            calloutType: risk
            claimRefs:
