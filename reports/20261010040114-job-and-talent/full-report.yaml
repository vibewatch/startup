  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric
      - Value
      - Benchmark
      - Decision Implication
    rows:
      - - Recommendation
        - track
        - buy / hold / avoid
        - Withhold new capital allocation pending cap table transparency and verified organic growth trajectory
      - - Confidence
        - medium
        - high / medium / low
        - >-
          High confidence on operational scale; medium confidence on valuation multiples due to private capital
          structure opacity
      - - Risk Rating
        - high
        - low / medium / high / critical
        - High execution, labor compliance, and valuation overhang risk from historical secondary marks
      - - Valuation Stance
        - stretched
        - attractive / fair / stretched / expensive
        - >-
          Headline marks between $1.5B and $2.35B price in software-like multiples for a business generating 3.4% EBITDA
          margins on €1.8B revenue
    notes: >-
      Assessment synthesized from FY2024 reported financials, Forge Global valuation marks, and secondary transaction
      indicators as of October 2026.
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV013
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Investment Thesis
      - Anti-Thesis
      - Thesis-Break Indicator
    rows:
      - - Operational Scale
        - >-
          Global footprint with €1.8B revenue and 2,500+ client enterprises demonstrates commercial viability in
          high-volume staffing
        - >-
          1.5% top-line contraction in FY2024 signals sensitivity to broader macroeconomic labor cooling in core
          European geographies
        - Consecutive years of organic revenue contraction exceeding 5% in constant currency
      - - Platform Automation
        - >-
          Clara AI recruiter and automated dispatch drove 23% EBITDA expansion to €61.3M and 21% increase in revenue per
          FTE to €804k
        - >-
          Frontline worker friction, onboarding glitches, and payroll payment disputes documented on Trustpilot threaten
          worker retention and brand equity
        - Gross worker churn accelerating or persistent mobile app ratings falling below 3.0 / 5.0
      - - Geographic Expansion
        - >-
          US revenue grew 5.7% in FY2024, validating international market expansion outside congested European staffing
          corridors
        - >-
          US expansion requires heavier sales burn and local enterprise compliance against well-capitalized incumbent
          staffing aggregators
        - US top-line growth decelerating below broader market staffing benchmarks
      - - Valuation & Structure
        - Company achieves operational self-sufficiency with positive EBITDA and expanding contribution margins (27.3%)
        - >-
          Historical down-round marks and potential liquidation preference overhangs create asymmetrical downside for
          common or junior equity
        - Disclosure of restrictive debt covenants, down-round structured preference hurdles, or liquidity crunch
    notes: >-
      Synthesis balances operational productivity metrics against marketplace labor risks and valuation multiple
      discipline.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Downside Triggers & Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - US revenue accelerates >15% CAGR; AI tools lift EBITDA margins to 5.5%; platform take-rate expands
        - $2.5B to $3.0B valuation at 1.2x-1.4x EV/revenue exit; potential IPO readiness on sustained profitability
        - Failure to monetize software independently; European regulatory crackdowns on temporary staffing platforms
        - 20% probability
      - - Base Case
        - Revenue stabilizes at 2-4% growth; EBITDA margin holds around 3.5-4.0% (€65M-€75M); US gains offset EU drag
        - $1.2B to $1.5B fair valuation at 0.6x-0.8x EV/revenue, consistent with hybrid tech-enabled staffing multiples
        - Prolonged European industrial slowdown; margin compression from enterprise price competition
        - 55% probability
      - - Bear Case
        - Top-line contracts >3% annually; wage inflation compresses contribution margins; worker app attrition rises
        - $600M to $800M valuation at traditional staffing multiples (0.3x-0.4x EV/revenue); severe preference dilution
        - Debt refinancing distress; major enterprise customer defections in logistics
        - 25% probability
    notes: >-
      Scenarios evaluate enterprise value relative to €1.8B FY2024 baseline revenue and peer trading ranges in
      tech-enabled staffing.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV013
      - CV014
