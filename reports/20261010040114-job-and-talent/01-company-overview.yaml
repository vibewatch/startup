chapter:
  number: 1
  title: "Company Overview"
  summary: "Job&Talent is a Madrid-headquartered workforce management platform founded in 2009 that combines temporary staffing operations with proprietary AI matching tools, reporting 1.8 billion Euros in 2024 revenue alongside a 1.3 billion Euro Series F valuation."
sections:
  - id: "identity-governance"
    title: "Corporate Identity and Leadership Governance"
    body: "Founded in Madrid in 2009 by co-CEOs Juan Urdiales and Felipe Navio, Job&Talent operates across 10 international markets supplying temporary labor in logistics, warehousing, and retail. Corporate leadership includes Chief Financial Officer Linda Hoglund, Chief Technology Officer Uri Saranga, and regional operating heads across the United States and Europe. The executive team maintains centralized governance through its Madrid headquarters while establishing a global whistleblower channel for workers and corporate staff to report compliance infractions. However, public user feedback on Trustpilot and mobile review platforms highlights recurring worker disputes regarding app glitches, payroll customer service responsiveness, and local branch communication."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO008"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "capitalization-structure"
    title: "Financing History and Capital Structure"
    body: "Job&Talent has accumulated an extensive syndicate of institutional backing since Kibo Ventures entered as its first institutional fund. Over subsequent financing rounds, major global venture and growth investors including Atomico, SoftBank, Kinnevik, BlackRock, and DN Capital joined the cap table. In April 2025, the company completed a 92 million Euro Series F round valuing Job&Talent at 1.3 billion Euros, reflecting a down round relative to secondary market platforms like Forge Global that previously tracked last known marks at 2.35 billion dollars in January 2026. Detailed capitalization tables, liquidation preferences, and debt facilities remain private, posing an ongoing analytical gap for equity investors."
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO010"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "operating-scale-milestones"
    title: "Operating Scale, Unit Economics, and Operational Milestones"
    body: "Operationally, Job&Talent generated 1.8 billion Euros in revenue in 2024 with underlying EBITDA of 61.3 million Euros, expanding its contribution margin to 27.3% and revenue per FTE to 804 thousand Euros. The platform placed over 300,000 workers across more than 3,250 client companies in 2024, deploying its proprietary Clara AI recruiter to conduct over 180,000 candidate interviews and directly complete 7,000 hires. In the United States, which represents its largest and fastest-growing geography, Job&Talent contracts local industrial and logistics workers across regional distribution hubs. While third-party breach monitoring lists a historical 2018 credential exposure affecting 11.0 million records, no active breaches or security compromises are recorded for 2026."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO011"
      - "CO012"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
