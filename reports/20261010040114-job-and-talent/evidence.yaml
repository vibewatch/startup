evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership governance
    missingEvidence: >-
      Complete historical registry of supervisory board members, independent directors, and advisory committee
      appointments.
    whyItMatters: >-
      Current public leadership disclosures only enumerate operational C-suite executives, omitting full board
      composition and shareholder representative voting seats.
    diligencePath: >-
      Obtain corporate extract from the Spanish Commercial Registry (Registro Mercantil de Madrid) for full board
      appointments.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current detailed cap table, share class rights, liquidation preferences, and outstanding debt facility schedules.
    whyItMatters: >-
      Without exact share class rights and liquidation waterfalls, the true economic distribution of common equity
      behind senior preferred stock is unmodelable.
    diligencePath: Request confidential cap table schedule and debt covenant terms from company management in confirmatory data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: unit-economics-segmentation
    missingEvidence: >-
      Audited gross margin, net revenue retention (NRR), software take-rate, and customer concentration data segmented
      by geography.
    whyItMatters: >-
      Without segmented margin disclosure, underwriters cannot verify whether profitability gains stem from higher
      software margins or traditional gross staffing volume.
    diligencePath: >-
      Request audited 2024-2025 financial statements, segment reporting, and cohort NRR bridges during management
      diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: worker-retention-vs-complaints
    missingEvidence: >-
      Worker cohort retention rates, app completion drop-off funnels, and dispute resolution time metrics to counter
      external review complaints.
    whyItMatters: >-
      External review platforms show recurring onboarding glitches and payment disputes that could elevate worker churn
      and customer acquisition costs.
    diligencePath: >-
      Review internal product analytics on application completion rates, shift fill rates, and worker net promoter
      scores across major hubs.
    relatedQuestionRefs: []
