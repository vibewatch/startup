    title: "Capital Intensity and Thin Operating Cushion"
    body: "With FY2024 EBITDA margins of 3.4% and an April 2025 Series F down-round valuation of €1.3 billion ($1.5 billion), Job&Talent operates with limited margin cushion against wage inflation or client default risk in economic downturns."
