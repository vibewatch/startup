              - CO010
      - number: '1.3'
        title: 运营规模、单位经济与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              运营层面，Job&Talent 2024 年收入为 1.8B 欧元，基础 EBITDA 为 61.3M 欧元，贡献利润率提升至 27.3%，每名 FTE 的收入达到 804k 欧元。2024 年，平台为超过
              3,250 家客户企业安置了 300,000 多名工人，并部署自有 Clara AI 招聘员完成超过 180,000 次候选人面试，直接促成 7,000
              次招聘。在其规模最大、增速最快的美国市场，Job&Talent 通过区域配送中心为当地工业和物流工人签约。尽管第三方泄露监测记录了一起影响 11.0M 条记录的历史性 2018 年凭证泄露事件，但 2026
              年没有记录在案的活跃泄露或安全入侵。
