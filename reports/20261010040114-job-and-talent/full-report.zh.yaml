figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Job&Talent 的创立、融资轮次、地理扩张和 AI 产品发布等运营与公司里程碑。
    data:
      items:
        - date: '2009-01-01'
          label: 在马德里创立
          detail: Juan Urdiales 和 Felipe Navio 在马德里创立公司，解决劳动力市场招聘低效问题
          tone: neutral
        - date: '2013-06-01'
          label: 首次 App 发布并进入英国
          detail: 发布首款移动应用，并将业务国际化扩展至英国市场
          tone: positive
        - date: '2015-01-01'
          label: 首家机构基金
          detail: 公司收入达到 1 million Euros 时，Kibo Ventures 成为首家机构投资者
          tone: positive
        - date: '2016-06-01'
          label: 转向交易型模式并引入 Atomico
          detail: 将商业模式转为交易型市场，并引入 Atomico 作为机构投资方
          tone: positive
        - date: '2018-02-01'
          label: 历史数据事件
          detail: 发生安全数据泄露，暴露约 11.0 million 条历史记录；BreachHistory 对此有记录
          tone: warning
        - date: '2019-12-31'
          label: 快速拓展欧洲大陆
          detail: 进入瑞典和德国，并报告欧洲收入达到 250 million 欧元
          tone: positive
        - date: '2021-12-31'
          label: 进入美国市场并推出企业 App
          detail: 进入美国物流人员配置市场，并为企业客户推出 Job&Talent Business
          tone: positive
        - date: '2024-12-31'
          label: 规模与盈利拐点
