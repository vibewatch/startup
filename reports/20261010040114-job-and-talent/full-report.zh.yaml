  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 位于大规模灵活用工与 AI 驱动劳动力管理软件的交汇处。平台的主要市场边界是物流、电商履约、仓储和轻制造等一线必需行业的临时劳动力支出。不同于专业 IT
              外包或高管招聘，这一品类需要快速、多班次地安置预先筛选的小时工。Adecco、Randstad 和 Manpower
              等传统用工服务商过去依靠分散的实体分支网络满足需求，带来较高管理费用和更慢的招聘速度。              Job&Talent
              用自动化数字市场平台替代传统中介模式，同时延伸到客户企业软件，管理客户内部及长期一线劳动力。
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
      - number: '2.2'
        title: 市场规模测算视角与细分规模约束
        blocks:
          - type: paragraph
            body: >-
              测算 Job&Talent 的可服务市场，需要同时看全球用工宏观趋势和区域一线工业劳动力的集中度。全球商业用工市场年规模超过 €500B，但随着电商履约从疫情高点降温，周期性宏观逆风令市场在 2024 年收缩
              9.5%。在 Job&Talent 的核心领域——欧洲和美国的物流及轻工业临时用工——可服务市场约为 €150B–€200B。在 Job&Talent 持有有效监管许可的 10 个国家，可触达市场规模约为
              €50B。Job&Talent 2024 年通过安置 30 万名工人取得 €1.8B 收入，全球增速比行业高 8 个百分点，并在美国实现 5.7% 增长。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
