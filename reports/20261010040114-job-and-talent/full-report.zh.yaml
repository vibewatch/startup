            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 Kibo Ventures 作为首家机构基金入股以来，Job&Talent 已积累了广泛的机构投资者阵容。后续融资中，Atomico、SoftBank、Kinnevik、BlackRock 和 DN
              Capital 等全球大型风险投资与成长型投资者陆续进入股东名册。2025 年 4 月，公司完成 92M 欧元 Series F 融资，Job&Talent 估值为 1.3B 欧元；相较于 Forge
              Global 等二级市场平台此前记录的 2026 年 1 月 2.35B 美元最新估值，这属于下轮融资。详细股权结构表、清算优先权和债务授信仍未公开，持续给股权投资者留下分析缺口。
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO014
              - CO015
