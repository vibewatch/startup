            title: 运营交付与一线支持摩擦
            body: >-
              Job&Talent 宣传 Clara AI 可实现自主招聘，但一线临时工评价显示运营摩擦反复出现。Trustpilot
              上的投诉集中于应用提交故障、客服咨询无人回应和支付争议，说明用自动化软件界面替代传统现场中介协调员存在执行风险。
