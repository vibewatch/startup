companyProfile:
  summary: >-
    Job&Talent 是一家总部位于马德里的劳动力管理和临时用工平台，由 Juan Urdiales 与 Felipe Navio 于 2009 年创立。公司把大规模蓝领安置业务与 AI
    驱动的招聘、排班、考勤和薪资工作流软件结合起来，目前已覆盖 10 个国家，并拥有庞大的企业客户群。FY2024 体现出真实的经营杠杆，但公司仍是混合型用工模式，而非纯软件公司，因此估值仍高度取决于资本结构是否清晰，以及能否持续执行。
  foundedDate: '2009-01-01'
  founders:
