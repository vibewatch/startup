  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与领导治理
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 由联席 CEO Juan Urdiales 和 Felipe Navio 于 2009 年在马德里创办，目前覆盖 10
              个国际市场，为物流、仓储和零售行业提供临时劳动力。公司管理层包括首席财务官 Linda Hoglund、首席技术官 Uri
              Saranga，以及分布于美国和欧洲的区域运营负责人。高管团队以马德里总部为中心实施集中治理，同时建立全球举报渠道，让工人和公司员工报告合规违规。不过，Trustpilot
              和移动应用评价平台上的公开反馈显示，工人反复投诉应用故障、薪资客服响应迟缓以及当地分支沟通不畅。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO008
              - CO013
