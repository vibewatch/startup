        title: 展示
        blocks:
          - type: callout
            title: 平台转型与资本重新校准
            body: >-
              Job&Talent 从纯 marketplace 转向 AI 驱动的劳动力平台，2024 年贡献利润率达到 27.3%，基础 EBITDA 为 61.3M 欧元。但 2025 年 Series F
              股权轮将估值定在 1.3B 欧元，相较于此前最高达 2.35B 美元的二级市场估值，确认了大幅重置，凸显市场仍在重新评估技术赋能型用工资产。
