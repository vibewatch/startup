              Job&Talent 运营混合型劳动力市场平台和数字用工交付模式，通过临时工安置的小时加价取得收入。FY2024，集团实现 €1.8B 总收入，在欧美用工市场宏观逆风下小幅收缩
              1.5%。核心变现引擎是雇主记录型用工中介，对安置的一线工人确认总账单，而不是只收取 marketplace 净佣金。为超越交易型用工费，公司提供 Job&Talent Business
              软件套件，用于企业劳动力排班、考勤追踪和合规管理。此外，Job&Talent 已推出长期招聘能力和自动化招聘代理 Clara，后者完成超过 18 万次面试以加快安置速度。不过，公开申报没有单独列示纯软件订阅
              ARR，也就是说，报告中的收入主要反映大规模、转付型劳动力账单，而非经常性高毛利软件订阅。
