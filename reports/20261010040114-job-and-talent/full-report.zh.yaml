  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规框架
        blocks:
          - type: paragraph
            body: >-
              Job&Talent
              在英国、西班牙、哥伦比亚和美国等不同劳动与企业监管制度下运营临时用工及劳动力管理基础设施。在欧盟和西班牙，机构用工指令要求工资分配、工人分类和工时追踪严格保持同等标准；若企业客户接受劳动审计，平台可能承担共同雇主责任。在哥伦比亚，Job&Talent
              的当地运营子公司必须正式实施商业透明与道德计划（PTEE）及 SAGRILAFT 风险管理体系，以应对洗钱和腐败风险。在英国，Job and Talent Holding Limited
              发布法定治理披露，包括依据《2016 年财政法》附表 19 第 16 段制定的正式英国税务策略，以及遵守欧盟指令 2021/2101
              的合并企业所得税报告。标准化使用条款划定候选人义务和企业客户边界，但跨境法定要求存在差异，公司仍需本地法律监督并持续投入合规费用。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
