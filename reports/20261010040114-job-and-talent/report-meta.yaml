  topStrengths:
    - Large operating scale with €1.8B FY2024 revenue and 300,000+ annual worker placements.
    - Meaningful operating leverage from Clara AI and related automation, with €61.3M underlying EBITDA.
    - Broad enterprise footprint across 10 markets and 3,250+ customer companies.
  topRisks:
    - Capital structure opacity and unresolved liquidation-preference / debt questions after the 2025 down-round.
    - Worker-facing app friction, payroll disputes, and support complaints can impair supply liquidity and brand trust.
    - The business still looks like hybrid staffing, so SaaS-style multiples are hard to justify.
  unresolvedGaps:
    - Current cap table, liquidation preferences, and debt schedule, including the April 2026 UK charge registration.
    - Audited 2025 accounts showing gross margin, cash generation, and segment-level economics.
    - NRR, software take-rate, and customer concentration data sufficient to test the AI-platform premium.
    - A clean current headcount and workforce productivity bridge by geography and function.
