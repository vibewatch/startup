    body: "Customer service bottlenecks, mobile app glitches, and payroll dispute complaints documented in Trustpilot reviews demonstrate vulnerability to frontline worker attrition, enabling competing digital marketplaces and legacy agencies to capture shift volume when worker experience falters."
