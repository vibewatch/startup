    body: "While Job&Talent pitches an AI-native staffing revolution with tools like Clara, its continued reliance on physical branch networks such as LGS Staffing in the United States and statutory W-2 employment liabilities anchors its unit economics to hybrid staffing rather than high-margin SaaS."
    claimRefs:
