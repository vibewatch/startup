summary:
  headline: |
    Ayar Labs is the best-funded pure-play in-package optical I/O company, with a blue-chip strategic cap
    table, a working TeraPHY+SuperNova stack, and a credible 2026-2027 ramp window — but commercial revenue
    is unproven, NVIDIA and Broadcom's in-house CPO programs raise real competitive risk, and the exact
    Series D valuation premium versus Lightmatter and Celestial AI is hard to justify without revenue
    visibility. Track closely; not yet de-risked enough to underwrite aggressively.
