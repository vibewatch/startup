companyProfile:
  summary: |
    Ayar Labs is a Santa Clara, California-based silicon-photonics company founded in 2015 to commercialize
    in-package optical I/O for AI and HPC systems. Its two-part product stack — the TeraPHY optical I/O
    chiplet and the SuperNova multi-wavelength remote laser source — is designed to replace electrical
    SerDes inside accelerator packages and across racks, enabling scale-up fabrics with materially higher
    bandwidth, lower latency, and lower power than copper or pluggable optics over distance. The company
    has raised about $370 million across rounds capped by a $155 million Series D in December 2024 that
    pushed its valuation above $1 billion, with strategic backing from NVIDIA, AMD Ventures, Intel Capital,
    GlobalFoundries, HPE, Lockheed Martin Ventures, and Advent. Commercial revenue, ARR, customer
    concentration, gross margin, and burn rate are not publicly disclosed; engagement with hyperscalers
    and DoD/DOE programs is collaborator- and grant-driven rather than commercially proven at scale. The
    central investment debate is whether Ayar's first-mover IP and strategic cap table can outpace
    NVIDIA's in-house Spectrum-X/Quantum-X CPO programs, Broadcom's CPO push, and a still-uncertain CPO
    adoption curve in 2026-2028.
  foundedDate: '2015-01-01'
  founders:
    - name: Vladimir Stojanović
      role: Co-founder
      background: Co-founder and Berkeley/MIT photonics professor whose work on monolithic CMOS silicon photonics inside the DARPA POEM program seeded Ayar Labs' core IP.
      claimRefs: [CO001]
    - name: Mark Wade
      role: Co-founder
      background: Co-founder and former MIT photonics researcher who served as an early CEO and continues to drive Ayar Labs' technical roadmap.
      claimRefs: [CO001]
    - name: Chen Sun
      role: Co-founder
      background: Co-founder and MIT photonics researcher who contributed to the original DARPA POEM monolithic CMOS optical I/O breakthrough underlying TeraPHY.
      claimRefs: [CO001]
  foundingLocation: Emeryville, California (Bay Area — DARPA POEM project from MIT/UC Berkeley)
  headquarters: Santa Clara, California
  productSummary: |
    Ayar Labs sells the TeraPHY optical I/O chiplet — a CMOS silicon-photonics die that integrates into a
    customer's compute package alongside CPUs, GPUs, switch ASICs, or FPGAs via standard chiplet interfaces
    — paired with SuperNova, a remote multi-wavelength CW laser light source that feeds TeraPHY via a single
    optical fiber. The combined system delivers terabit-class bandwidth per chiplet at single-digit pJ/bit
    power, extending high-bandwidth interconnect reach from millimeters to kilometers and replacing
    electrical SerDes plus pluggable transceivers for AI scale-up and disaggregated computing fabrics.
  customerFocus: AI accelerator vendors, hyperscale data-center operators (Microsoft/Google/Meta/AWS targets), HPC system vendors (HPE Slingshot, defense HPC), and US DoD/DOE high-performance computing programs (DARPA PIPES, national labs).
  businessModel: Direct B2B sale of TeraPHY chiplets and SuperNova laser modules to compute-package integrators and system OEMs, monetized through evaluation-kit access today and high-volume per-unit chiplet/laser pricing once customer programs reach production. Non-dilutive DARPA/DOE grants supplement R&D funding.
  stage: Late-venture (Series D) private company
  fundingStatus: |
    Approximately $370 million raised across Seed, Series A, B, C, and D plus DARPA/DOE grants, capped by a
    $155 million Series D announced December 11, 2024 led by Advent Global Opportunities and Light Street
    Capital, with NVIDIA, AMD Ventures, Intel Capital, 3M Ventures, Autopilot, GlobalFoundries, HPE
    Pathfinder, Lockheed Martin Ventures, Boardman Bay, Founders Fund, and Playground Global participating;
    the company described its Series D valuation only as above $1 billion.
