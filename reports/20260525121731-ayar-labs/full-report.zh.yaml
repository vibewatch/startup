  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 上一轮定价是锚点，不是完整估值证明
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 2024 年 12 月 Series D 是当前资本结构里唯一公开的硬定价事件，因此应优先于其他所有视角。该轮融资 $155M， 将已披露累计融资推到约 $370M，并明确把公司估值推到
              $1B 以上。它还带来了异常强的战略投资背书： AMD Ventures、Intel Capital、NVIDIA、3M Ventures 和 Autopilot 加入 Advent Global
              Opportunities、Light Street Capital， 以及一个既有投资团，后者已包括 GlobalFoundries、Lockheed Martin Ventures、Playground
              Global、Boardman Bay 和 Applied Ventures。 这张股权结构表重要，因为它显示多个半导体、系统和防务参与者相信，Ayar 的光 I/O 堆栈可能在 AI
              基础设施内部变得具有战略重要性。 但同一组证据也暴露了核心投资判断上限：没有确切投后估值，没有已发布收入，没有毛利率，也没有公开优先股堆叠。 换句话说，上一轮是可靠标记，但单独不足以证明公允价值。
