      - number: '2.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: AI scale-up 让互连成为一阶市场问题
            body: 多个独立来源现在都把互连描述为下一代 AI 集群的限制因素，而不是次要组件选择。能在不推高功耗的情况下把带宽搬离铜缆的供应商，将直接受益。
            calloutType: strength
            claimRefs:
