      - CE040
      - CE041
      - CE042
      - CE043
      - CE048
  - id: FU001
    title: Ayar 公开商业化流程——从研究验证到超大规模云厂商设计导入
    type: flow
    layout: wide
    summary: 公开进入市场路径从 DARPA 支持的验证和战略投资者触达开始，再通过送样和演示进入封装伙伴、机架集成商，以及仍未具名的终端客户。
    data:
      nodes:
        - id: gtm1
          label: DARPA / 研究验证
          detail: POEM、PERFECT 和 PIPES 验证了核心带宽与功耗问题，并降低最早期技术采用路径的风险。
          tone: neutral
        - id: gtm2
          label: 战略投资者-客户对齐
          detail: NVIDIA、Intel、HPE、GlobalFoundries 和 Lockheed 提供资本，也让公司优先接触路线图。
          tone: positive
        - id: gtm3
          label: 送样和集成演示
          detail: 2020 年的送样 / 协同设计、2022 年合同项下首批规模出货，以及 2023 年 Intel FPGA 演示，共同证明封装可行性。
          tone: positive
        - id: gtm4
          label: ASIC 和封装路线
          detail: GUC 和 Alchip 将光引擎嵌入先进封装和 ASIC 流程，面向未来超大规模云厂商系统。
          tone: positive
        - id: gtm5
          label: 机架级集成
          detail: Wiwynn 把 Ayar 带入可部署的机架架构和未公开客户预览。
          tone: positive
        - id: gtm6
          label: 未具名超大规模云厂商量产
          detail: 最终云买方仍未披露，公开证据中量产转化尚未被证明。
          tone: warning
      edges:
        - from: gtm1
          to: gtm2
        - from: gtm2
          to: gtm3
        - from: gtm3
          to: gtm4
        - from: gtm4
          to: gtm5
        - from: gtm5
          to: gtm6
    approximationNotes: 该流程综合了 Ayar 似乎遵循的公开渠道顺序；它不是公司披露的销售漏斗，也不暗示各阶段之间存在已知转化率。
