      - number: '7.7'
        title: 缓释因素、监测指标与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Ayar 确实有可信的缓释因素。远程激光器架构正是为了改善热表现和可维护性，公司也在台湾 ASIC 生态里推进多个封装伙伴，
              并拥有不只会出资的战略投资人。但这些缓释因素必须变得可被外部观察，才值得给满分。信号最强的正面指标包括：
              具名量产部署，而不是又一个架构合作；公开证据显示封装和激光器供应商从就绪走向持续出货；以及至少一个大型平台客户在 LPO 或先进可插拔桥接方案之前选择光 I/O。 负面指标同样清楚。如果 2027 年后高量
              CPO 仍看起来被推迟，如果桥接架构主导早期 AI scale-up，如果出口管制复杂度封堵一个重要地域市场， 或如果 Ayar
              在客户集中度下降之前再次融资，投资逻辑破裂就会开始成形。因此，投资人不应把公司当作纯组件供应商来盯， 而应把它看成依赖系统生态的平台押注；每一次披露的伙伴、合规事件或客户认证里程碑，都可能实质改变其价值。
            claimRefs:
              - CR013
              - CR016
              - CR024
