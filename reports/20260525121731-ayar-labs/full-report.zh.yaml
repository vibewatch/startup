      - number: '8.4'
        title: M&A 先例显示战略胃口，但规模仍主导价格
        blocks:
          - type: paragraph
            body: >-
              光互连和光子 M&A 先例是支持性的，但前提是记住区间有多宽。Cisco 在 2021 年以约 $4.5B 现金收购 Acacia， 以强化其 Internet-for-the-Future
              战略中的相干光学。Marvell 同意以 $10B 现金加股票收购 Inphi， 以加深其数据中心和 5G 光连接版图。更近一些，Ciena 同意以 $270M 现金收购 Nubis
              Communications， 以强化其面向 AI 工作负载的数据中心内部战略；II-VI 则用大型现金加股票结构完成了与 Coherent 的合并。
              共同主线很清楚：只要光学资产能解决关键基础设施内的带宽、延迟或封装瓶颈，战略买家愿意支付实质价格。 但价格离散同样清楚：市场给有规模、有收入、平台属性强的资产，与给更窄能力补强型收购的定价完全不同。Ayar
              属于这场战略对话， 但今天的公开证据还不能有把握地把它放在 Acacia 或 Inphi 那一端。
            claimRefs:
              - CV030
