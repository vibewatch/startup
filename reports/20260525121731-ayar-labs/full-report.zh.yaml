  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图谱与严重程度排序
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 进入 2026 年决策窗口时，风险画像在时间上异常压缩。公司有可信的产品信号、强大的战略投资人名单和内部报告的验证数据，
              但决定风投回报的闸门项彼此紧扣：可制造性必须成熟，同时市场还在判断从可插拔模块和 LPO 转向真正共封装光学（CPO）的速度。
              因此，近期最重要的风险不是抽象的技术怀疑，而是采用时间点、制造集中度、大平台的竞争性内化、可见需求集中在战略参与者手里， 以及爬坡后期才浮现的出口管制或 IP
              摩擦。这些风险会叠加，而不是相互抵消。哪怕市场采用只推迟一年，而先进封装仍受约束、客户继续要求可运维性， Ayar 也可能在 NVIDIA、Broadcom 和 Marvell
              强化自身光子布局时，面对更窄的商业化窗口。本章排序把这种时间压缩——不是单纯器件可行性——视为核心投资判断问题。
