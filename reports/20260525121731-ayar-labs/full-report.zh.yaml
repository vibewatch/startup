      - number: '3.3'
        title: 私营 CPO 创业公司与相邻挑战者
        blocks:
          - type: paragraph
            body: >-
              私营挑战者中，Lightmatter 和 Celestial AI 是两个最可比的战略威胁，因为两者都在向 Ayar 想要触达的同一批超大规模云厂商和加速器受众销售光学 scale-up
              叙事。Lightmatter 的路线图覆盖 NPO、OBO、2D CPO、3D CPO 和 3D 中介层，Passage 产品从 12.8 Tbps 扩展到 32–64 Tbps 级系统。其官网披露累计融资
              $850 million、估值 $4.4 billion，资本量超过 Ayar，也让它能销售更广的互连平台，而不只是一对 chiplet 加激光器。Celestial AI 同样资本充足，累计融资 $515
              million，并把 Photonic Fabric 从封装推到机架级；Marvell 计划收购它，说明超大规模云光学 scale-up 创业公司已经有足够价值，被既有半导体平台吸收。


              Ranovus、Scintil、Nubis/Ciena 和 POET 范围更窄，但仍然相关。Ranovus 明确营销面向 scale-up 的 12.8 Tb/s XPU 和交换机 CPO。Scintil 聚焦于
              AI scale-up 链路所需的高密度多波长光源，能够攻击 Ayar 当前通过 SuperNova 外置化的激光源层。Ciena 通过 Nubis
              域名呈现的共封装光学页面强调低功耗光学引擎和可现场维护的外置光源，这一可维护性叙事接近 Ayar 自身架构。POET 更偏相邻而非直接竞争，但其光学中介层平台瞄准 800G、1.6T 及以上，因此也会争夺 AI
              fabric 周边相同的封装和互连预算。
