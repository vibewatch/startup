  - id: TV007
    title: 投资逻辑破裂与叫停触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对估值的传导
      - 行动含义
    rows:
      - - CPO 采用再次滑坡
        - 独立分析师观点仍认为主流大规模部署被推迟到 2027 年之后
        - 拉长规模化时间，削弱为战略可选性支付的溢价
        - 将立场从合理转向偏高，并要求较上一轮平价有更大折扣。
      - - 没有有意义的商业披露
        - 下一次融资事件前，没有公开收入、积压订单或已具名量产规模客户证据
        - 挡住基于收入的估值，只剩可选性支撑投资逻辑
        - 不支付溢价；建议维持观察 / 继续研究。
      - - 下一轮暴露对投资人不友好的条款
        - 优先股堆叠、参与分配条款或反稀释保护让新资金实质上处于劣后
        - 表面估值可保持不变，但实际回报经济性被摧毁
        - 在完成股权结构表尽调前，把当前估值标记视为偏高。
      - - 光学市场下行再次显现
        - 更多类似 Rockley 的困境结果，或超大规模云厂商明确拒绝 CPO
        - 推高行业折现率，压低退出胃口
        - 视严重程度，从合理转向偏高 / 昂贵。
    notes: 每个触发因素都可从未来融资公告、分析师评论或公司 / 客户披露中外部监控。
    claimRefs:
      - CV023
      - CV024
      - CV034
      - CV035
      - CV041
      - CV045
      - CV047
      - CV048
      - CV049
  - id: TV008
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 准确投后估值和优先股堆叠
        - 没有公开的投后估值数字、清算优先权安排或反稀释条款
        - 回报测算可能与名义独角兽估值大幅背离
        - 在 NDA 下要求投资条款清单摘要或股权结构表视图。
      - - 当前收入和出货规模
        - 没有公开收入、ARR 或出货金额披露
        - 没有这些，收入倍数估值和现金消耗评估都无从下手
        - 索取过去 12 个月收入、已签积压订单和出货运行率。
      - - 客户转化证据
        - 战略和 Tier-1 参与话术已公开，但已具名量产项目没有公开
        - 设计参与到规模化部署之间的缺口决定估值时间点
        - 索取客户阶段地图、量产时间和附着率。
      - - 单位经济性
        - 没有公开毛利率、模块成本或系统级节省披露
        - 溢价估值取决于经济性，而不只是技术优势
        - 要求产品毛利率桥和客户 ROI 数据。
      - - 制造准备度
        - 公开来源有准备度说法，但没有经审计的良率或产能利用率数据
        - 从合理估值到偏高估值，核心差别仍是规模化风险
        - 要求制造 KPI、良率轨迹和认证里程碑。
    notes: 把观察名单仓位变成有承销依据的溢价入场前，至少需要这些尽调项。
    claimRefs:
      - CV012
      - CV014
      - CV047
      - CV048
      - CV049
      - CV050
