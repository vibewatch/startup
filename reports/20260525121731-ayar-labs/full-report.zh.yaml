    type: range
    layout: wide
    summary: Ayar 相关来源、独立分析师和更广泛的非超大规模云采用评论，指向的时间窗口并不相同；本图用区间方式归纳。
    approximationNotes: 年份区间是从引用来源推断出的方向性时间窗口，不是约束性预测。
    data:
      items:
        - label: Ayar / 伙伴商业化表述
          low: 2026
          high: 2028
          unit: year
          detail: Laser Focus 和 Ayar 相关报道把光 I/O 产品框定为 2026–2028 年陆续出现。
        - label: CPO 大规模部署
          low: 2027
          high: 2028
          unit: year
          detail: LightCounting 预计 2027 年进入大规模部署，2028 年更广泛放量。
        - label: 过渡技术延续（LPO / NPO / 可插拔）
          low: 2026
          high: 2031
          unit: year
          detail: 独立报道提示，过渡架构在最初 CPO 试点之后很长一段时间内仍可能有价值。
        - label: 更广泛的非超大规模云主流化
          low: 2029
          high: 2035
          unit: year
          detail: CIR 将企业 CPO 采用描述为超大规模云厂商跑通验证之后、更慢更晚的一波。
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR021
      - CR023
  - id: FR004
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示 Ayar 根本风险如何传导到收入延后、融资收紧和投资逻辑失效。
    approximationNotes: 连线表达的是方向性逻辑，不是测得的系数。
    data:
      nodes:
        - id: adoption-delay
          label: 采用延迟
          detail: 过渡架构延续，CPO 放量后移
        - id: gf-single-fab
          label: GF 单一晶圆厂
          detail: 硅光产能仍然集中
        - id: laser-supply
          label: 激光器供应
          detail: 外部激光阵列和认证必须扩规模
        - id: packaging-bottleneck
          label: 封装瓶颈
          detail: 先进封装仍然紧张
        - id: competitor-internalization
          label: 平台内化
          detail: 大型厂商自己嵌入光子技术
        - id: export-controls
          label: 出口管制
          detail: EAR 筛查和实体清单义务扩大
        - id: customer-concentration
          label: 客户集中度
          detail: 少数早期客户主导需求
        - id: revenue-slip
          label: 收入延后
          detail: 商业化放量向右推迟
        - id: margin-pressure
          label: 利润率压力
          detail: 供应链和封装成本维持高位
        - id: financing-need
          label: 融资需求
          detail: 大规模放量前还需要更多资本
        - id: thesis-break
          label: 投资逻辑失效
          detail: 证明与规模尚未汇合，窗口先关闭
      edges:
        - from: gf-single-fab
          to: packaging-bottleneck
          label: 单一来源链条叠加
        - from: laser-supply
          to: margin-pressure
          label: 认证与产能分配
        - from: packaging-bottleneck
          to: revenue-slip
          label: 出货放慢
        - from: adoption-delay
          to: revenue-slip
          label: 客户观望
        - from: competitor-internalization
          to: revenue-slip
          label: 外售 TAM 收窄
        - from: customer-concentration
          to: revenue-slip
          label: 少数账户权重上升
        - from: export-controls
          to: margin-pressure
          label: 合规负担
        - from: revenue-slip
          to: financing-need
          label: 现金跑道缩短
        - from: margin-pressure
          to: financing-need
          label: 毛利润延后
        - from: financing-need
          to: thesis-break
          label: 下轮估值下调或被迫依赖战略方
    claimRefs:
      - CR009
      - CR024
      - CR042
      - CR043
      - CR047
      - CR049
  - id: FV001
    title: 精选估值与交易标记
    type: bar
    layout: wide
    summary: 私募融资定价和近期战略交易，把 Ayar 夹在尚未放量的光子初创公司与数十亿美元级类别龙头之间。
    data:
      items:
        - label: Ayar Labs Series D 轮估值下限
          value: 1000
          note: USD M；公开证据只说明估值高于 $1B，不给出精确数。
        - label: Lightmatter
          value: 4400
          note: USD M 私募估值，2024 年 10 月。
        - label: Celestial AI
          value: 2500
          note: USD M+ 估值，2025 年 3 月。
        - label: Scintil Photonics
          value: 133.6
          note: 截至 2025 年 8 月的 USD M 估值。
        - label: Cisco / Acacia
          value: 4500
          note: USD M 战略收购价值。
        - label: Ciena / Nubis
          value: 270
          note: USD M 战略收购价值。
    claimRefs:
      - CV002
      - CV018
      - CV021
      - CV022
      - CV030
      - CV032
      - CV038
      - CV042
    approximationNotes: 所有数字均为百万美元。Ayar 采用公开披露的 >$1B 下限，而不是虚构精确的投后估值。
  - id: FV002
    title: 隐含估值区间
    type: range
    layout: standard
    summary: 中枢情景贴近上一轮估值下限；上行需要更快证明商业规模，下行则来自时点继续后移。
    data:
      items:
        - label: 悲观情景
          low: 500
          mid: 650
          high: 800
          unit: USD M
          note: 采用延后、商业化更慢，或下一轮条款对投资人不友好。
        - label: 基准情景
          low: 900
          mid: 1100
          high: 1300
          unit: USD M
          note: 没有重大负面意外时，维持在接近上一轮估值下限的位置。
        - label: 乐观情景
          low: 1500
          mid: 1800
          high: 2200
          unit: USD M
          note: 需要更广泛部署证明、更好披露，以及更强的战略退出信心。
    claimRefs:
      - CV002
      - CV037
      - CV043
      - CV044
      - CV045
      - CV047
      - CV048
      - CV049
    approximationNotes: 单一单位图，单位为百万美元。这些是情景区间，不是模型输出或管理层指引。
  - id: FV003
    title: 围绕上一轮估值下限的估值驱动瀑布图
    type: waterfall
    layout: wide
    summary: 战略和生态正向因素，大体被收入不透明与采用时点风险抵消，当前公允价值中枢仍落在上一轮估值下限附近。
    data:
      items:
        - label: 上一轮估值下限
          value: 1000
          note: 公开证据只支持 >$1B 下限，不支持精确数字。
        - label: 战略股东结构溢价
          value: 150
          note: AMD、NVIDIA、Intel、HPE、GF 等战略方降低融资脆弱性。
        - label: 产品 / 制造就绪度
          value: 100
          note: 公司和伙伴材料支撑生产就绪定位。
        - label: 收入不透明折价
          value: -125
          note: 没有公开披露收入、利润率或积压订单。
        - label: CPO 采用时点折价
          value: -75
          note: 独立分析师仍认为广泛大规模部署处在早期。
        - label: 上市可比公司 / 退出不确定性
          value: -50
          note: 上市光学可比公司噪音大，战略退出价值差异也很大。
        - label: 基准情景中枢标记
          value: 1000
          note: 仅看公开证据，净效应让 Ayar 接近上一轮平价。
    claimRefs:
      - CV002
      - CV010
      - CV012
      - CV037
      - CV041
      - CV047
      - CV048
      - CV049
    approximationNotes: 示意性估值桥，单位为百万美元。正负调整是判断视角下的权重，不是管理层数字。
  - id: FV004
    title: 可比公司定位矩阵
    type: matrix
    layout: wide
    summary: 从战略契合和产品就绪度看，Ayar 表现不错；但相对任何需要传统估值锚的投资人，财务可见性很弱。
    data:
      columns:
        - 商业证明
        - 财务可见性
        - 战略买家适配度
        - 下行信号
      rows:
        - label: Ayar Labs
          values:
            - 中
            - 低
            - 高
            - 中
        - label: Lightmatter
          values:
            - 中
            - 低
            - 高
            - 低
        - label: Celestial AI
          values:
            - 中
            - 低
            - 高
            - 低
        - label: POET Technologies
          values:
            - 低
            - 高
            - 中
            - 高
        - label: Rockley Photonics
          values:
            - 低
            - 高
            - 低
            - 极高
    claimRefs:
      - CV018
      - CV021
      - CV023
      - CV026
      - CV037
      - CV041
      - CV046
      - CV047
      - CV048
    approximationNotes: 仅为顺序型定性评分。矩阵用于说明：Ayar 看起来具备战略吸引力，但仍缺少干净的估值支撑基础。
