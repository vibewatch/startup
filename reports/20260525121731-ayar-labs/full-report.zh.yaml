      - number: '2.4'
        title: 增长驱动因素与采用时点
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动很简单：AI 集群正在变得更大、更受电力约束，也更依赖通信。Ayar 自身围绕生成式 AI 的叙事认为，推理已经变成机架级问题，而微调和训练会扩展到数百、数千，最终数万块
              GPU。独立分析师工作也指向同一方向。Dell’Oro 称，最大型超大规模云 AI 集群已经接近 100,000 个加速器，并可能在不久后达到 1
              million，这让互连设计从事后补充变成一阶系统问题。电力是第二个主要驱动。IEA 现在预计，到 2030 年，全球数据中心用电需求将翻倍以上，其中 AI 优化数据中心的需求将增长超过四倍；Dell’Oro
              也强调未来 AI 机架可能达到 600 kW 级，并且集群会分布在多个设施中。资本可得性是第三个驱动：Alphabet 和 Meta 最新文件显示基础设施支出仍然巨大，Amazon
              文件也继续强调物业和设备投资中的服务器与网络设备。这些力量都利好每个封装、每瓦提供更高带宽的光互连架构。标准和生态进展同样有帮助：UCIe 降低封装边界的集成摩擦，CW-WDM
              标准化则支持远端光源互操作。合在一起，这些趋势形成一条可信的多年采用跑道，即便准确斜率仍不确定。
