      - number: '8.5'
        title: 情景区间围绕上一轮，因为争论在时间点，不只在技术
        blocks:
          - type: paragraph
            body: >-
              估值区间最好围绕时间点和商业化置信度来框定，而不是围绕收入倍数。乐观情景下，如果光 I/O 能把战略关系转化为可见设计定点， 如果客户路线图能变成更广泛的量产部署，并且分析师对 CPO
              时间点的怀疑开始消退，Ayar 有可能明显高于上一轮地板。 基准情景下，公司仍接近上一轮标记，因为战略投资团质量很高，类别也仍然重要；但公开证据仍无法展示收入、单位经济性或股权结构清晰度。 悲观情景下，如果
              CPO 部署继续慢于预期，如果光学买方更久地停留在桥接技术上，或下一轮融资暴露投资人不友好条款、需要折价清场，
              估值标记会压缩到上一轮以下。因此，这个情景差更多反映商业化时间点、战略可选性和披露质量，而不是传统财务模型。
            claimRefs:
