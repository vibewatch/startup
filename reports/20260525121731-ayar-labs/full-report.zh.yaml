      - number: '3.4'
        title: 可插拔、LPO 与过渡架构
        blocks:
          - type: paragraph
            body: >-
              最容易被低估的竞争对手，是那些并不彻底替代封装边界的架构。Innolight、Eoptolink 和 Accelink 显示，既有可插拔生态在 800G 和 1.6T 上已经很强。Lumentum 和
              Coherent 继续推进更高密度模块和激光光源，改善前面板与机架级光互连的经济性。分析师和行业证据一致表明，这些架构不会消失：LightCounting 预计高批量 CPO 部署要到 2027 年，LPO
              部署更早启动，800G 及以上可插拔出货仍在增长。Avnet 还明确认为，可插拔模块和 CPO 会共存五到十年，因为可维护性、可配置性和多供应商采购在运营上仍然重要。


              对 Ayar 而言，近期任务不是逐端口击败每个可插拔厂商，而是证明在最高性能 AI scale-up 场景中，继续留在封装外的成本、功耗和密度惩罚已经不可接受。如果运营方可以用 LPO、NPO
              或高密度可插拔模块推迟这次架构跃迁，Ayar 的采用曲线就会后移。因此，外置激光器的可维护性具有战略意义：它试图在把光学带入封装的同时，保留可插拔模块的一项关键优势。
