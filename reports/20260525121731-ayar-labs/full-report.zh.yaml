            body: >
              独立报道突出主要采用风险：共封装光学减少了铜缆瓶颈，却提高了液冷、光纤走线、可制造性、监控和故障影响半径上的运营复杂度。Ayar
              当前估值已经假设这个缺口能够跨过去，但公开证据仍指向一个正在过渡的过程，而不是已经完成的超大规模落地部署。
