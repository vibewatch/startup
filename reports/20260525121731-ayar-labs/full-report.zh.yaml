      - number: '7.5'
        title: 客户集中、资本与治理风险
        blocks:
          - type: paragraph
            body: >-
              Ayar 可见的支持基础质量很高，但也偏窄。公开记录里充满战略投资人、合作方和政府相关项目：GlobalFoundries、HPE、NVIDIA、Intel 相关 DARPA 工作， 以及 DoD
              相邻应用。更难找到的是具名量产客户、多元化对外销售收入或批量采购承诺的广泛证据。评估套件页面进一步显示， 公司仍在把准入机会分配给签有长期商业协议的客户；从商业化角度看这合理，但也说明早期需求可能由少数账户主导。
              这种集中度叠加在资本强度之上。公司披露了大量融资和超过独角兽水平的估值，但本次审阅材料里没有公开烧钱速度或现金跑道数据。 如果采用时间点拉长到分析师窗口的后段，Ayar
              可能在规模经济性得到证明之前还需要额外资本。治理风险同样集中。 Ayar 的公开领导层页面比早期初创公司的组织图深得多，但公司似乎仍异常依赖 Mark Wade、Vladimir Stojanovic 和
              Chen Sun， 来维持商业、架构和科学连续性。在它变成单点依赖之前，这是一项优势。
