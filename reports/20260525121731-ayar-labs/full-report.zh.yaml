            body: Ayar 最强的差异化仍是封装深度。多数对手要么止步于可插拔模块，要么止步于 NPO，要么把封装级故事和更广平台路线图绑定。客户一旦认定封装边界本身就是瓶颈，同时仍想要可维护的外置光源，Ayar 的优势最明显。
