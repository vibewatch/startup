      - number: '2.5'
        title: 约束、替代方案与可插拔–LPO–CPO 之争
        blocks:
          - type: paragraph
            body: >-
              Ayar 市场的最强近端约束不是带宽需求不足，而是更容易部署的替代方案仍然可用。LightCounting 和 Dell’Oro 都暗示，采用大概率分阶段推进：可插拔模块继续稳固，LPO
              作为低功耗过渡台阶增长，交换机侧 CPO 先起量，封装级光学 chiplet 则在封装和可维护性问题解决后再到来。这与 Ayar 直接相关，因为它最高价值的逻辑依赖光学 I/O
              向加速器靠近，而不只是进入网络交换机。独立技术出版物也强化了制造挑战：已知良品光学 chiplet、无源光纤贴装、连接器化、封装良率和热集成，都是高批量部署的闸门。公开分析师评论还明确指出，当前 CPO
              实现大多以交换机为中心，大规模 scale-up 出货更可能从 2027 年而非 2026 年开始。竞争压力进一步放大时点风险。NVIDIA
              没有等待第三方生态成熟；它已经发布带有激进能效主张的硅光子交换平台，这可能把交换机层价值留在既有平台栈内部。净结果是，Ayar 明显受益于托举光互连市场的同一组宏观驱动，但其商业捕获窗口大概率比最乐观的头部
              TAM 数字所暗示的更晚、更窄。
