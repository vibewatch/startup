  - id: TE002
    title: 与电互连的公开性能对比
    columns:
      - 指标
      - Ayar 光 I/O
      - 电 SerDes / 可插拔模块
      - 公开优势
      - 限制
    rows:
      - - 带宽密度
        - 按 Ayar 营销口径高 5x–10x；现有 chiplet 为 2 Tbps 级，下一代演示为 4–8 Tbps
        - 长距离下，铜线 / 可插拔架构很快吃掉板边资源和重定时器预算
        - 同等封装预算下，可用的封装外带宽更高
        - 比例来自公司声明，不能跨所有工作负载做同口径比较
      - - 每 bit 能耗
        - SC23 级公开演示中 <5 pJ/bit；效率提升声明为 4x–8x
        - 传统长距离电互连和可插拔路径在可比距离下通常高得多
        - 更低 I/O 功耗是 AI scale-up 经济性的核心
        - Ayar 未公布完整系统级功耗拆分或冷却开销
      - - 时延
        - 产品声明约每个 chiplet 5 ns + TOF；验证中端到端 <25 ns
        - 50 Gbps 以上电链路通常需要 FEC，并累积串行化 / retimer 延迟
        - 光链路能守住更低的封装间时延
        - 公开数据多来自实验室和演示配置
      - - 覆盖距离
        - 公开材料显示从毫米到 2 km
        - 铜互连通常从封装 / 板上英寸级延伸到电缆形态下米级
        - 一套架构可覆盖 die、板、机架和远程内存距离
        - 长距离仍取决于激光预算、光学余量和封装质量
      - - 维护模式
        - 外置远程激光器可在封装外更换
        - 可插拔模块仍最易更换；纯 CPO 引擎更难维护
        - Ayar 通过把激光源外置，保留了一部分可插拔性
        - 一个远程光源故障可能同时影响多个通道
    notes: 对比混合了公司声明、验证结果和分析师观察，应按方向性判断阅读，而不是当作统一基准测试套件。
    claimRefs:
      - CE002
      - CE003
      - CE008
      - CE017
      - CE027
      - CE040
      - CE042
      - CE049
