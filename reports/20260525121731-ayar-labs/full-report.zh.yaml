      - number: '3.2'
        title: 上市既有厂商与平台供应商
        blocks:
          - type: paragraph
            body: >-
              最强竞争压力来自上市既有厂商，因为每家公司攻击的是 Ayar 价值主张的不同层。Broadcom 是最清晰的交换机层基准：到 2025 年底，它已展示 Meta 测试的 400G-equivalent CPO
              端口累计 100 万个链路小时、无链路抖动，并声称光模块功耗比可插拔方案低 65%，这把 CPO 从概念推向生产就绪。Marvell 走的是更偏计算中心的路线，将自有定制 XPU
              平台延伸到共封装光学，并主张集成光子可跨多个机架连接数百个 XPU。Intel 的威胁来自另一点：它的 OCI chiplet 同样瞄准共封装光学 I/O，但把激光器直接集成在 chiplet 上，而不是采用
              Ayar 的外置激光模式。


              Cisco/Acacia、Coherent 和 Lumentum 在封装内光学 I/O 上没有那么一一对应，但它们重要，因为它们已经拥有客户关系、光学制造能力和可转向最高价值光学层的路线图。Acacia 明确营销
              AI scale-out 光互连和 3D siliconization。Coherent 和 Lumentum 供应许多 AI fabric 仍然需要的激光器、模块和光学子系统，即便最先进节点逐步迁移到
              CPO。Broadcom、Marvell、Cisco、Coherent、Lumentum 和 Intel 的 SEC 文件节奏提醒投资者，Ayar 竞争的不是只有创业公司，还有拥有经审计上市公司资源的供应商。
