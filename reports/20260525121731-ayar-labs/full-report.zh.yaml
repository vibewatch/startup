              光源来描述变现；评估套件优先给已经承诺长期商业协议的客户；2022 年融资材料称 Ayar
              已完成首批按合同批量商业出货。后续材料把重点转向不断增长的客户基础，以及与客户路线图对齐的高批量制造，但公开来源仍未给出标价、已签订单积压、单位出货量和收入确认政策。这意味着，公开信息下的投资判断者能看到需求面包屑——样品、设计定点、长期商业意向和首批出货——却无法把它们转化为可审计的收入、毛利或
              CAC/回本周期模型。实际看，Ayar 仍像一家早期商业化硬件公司，证明点更多是伙伴采用和制造就绪，而不是已披露的财务产出。
