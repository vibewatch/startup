    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 并不参与整个数据中心网络市场；它参与的是更窄的一块：共封装光学引擎和光学 I/O chiplet，用光而不是长距离电走线，把数据直接从加速器、交换芯片和先进封装中搬出来。更宽的可比集合是 AI
              集群光互连市场，包括可插拔收发器、线性驱动可插拔模块、主动光缆、交换机侧 CPO，以及同时用于 scale-out 和 scale-up 网络的光链路。Ayar 的核心产品定位还要更窄：TeraPHY 光学
              I/O chiplet 搭配 SuperNova 远端激光源。因此，头部光互连 TAM 数字会高估 Ayar 的直接收入池，因为大量支出落在收发器模块、系统级交换机、布线和传输设备上，而这些不是 Ayar
              自己销售的产品。合理的市场边界应从嵌入封装内的光学引擎内容开始，再向外扩展到可插拔模块和 LPO
              等相邻替代支出。这个区分很重要，因为买方决策不是简单的“买光模块”，而是“当带宽密度、功耗、延迟和传输距离足以抵消集成成本时，用封装级光学 I/O 替代铜缆或可插拔模块”。Ayar 公开材料一直把
              scale-up AI fabric 作为最高价值用例，而独立分析师来源显示，可插拔模块、LPO 和 DCI 光互连仍是重要的相邻和替代市场，不会一夜消失。
