          - type: paragraph
            body: >-
              最难的问题已经不是“Ayar 能否演示光 I/O？”，而是“客户能否维护、认证并规模化采购？”反向分析师观点在这里很有用： LightCounting 仍认为 LPO 会早于 CPO
              落地，Lightwave/CIR 则指出，非超大规模运营商仍担心良率、热表现、维修模式和供应商锁定。 Ayar
              的外置激光器策略有利于可维护性，因为激光器可以在封装外冷却和更换；但它也集中故障域，并带来新的插入损耗和供应依赖。 与此同时，公开披露仍缺少投资判断最需要的数字——封装良率、激光器 MTBF、已定价
              SKU、积压订单和具名量产部署。 因此，本章给出有利的技术方向判断，但在这些私下尽调项开放之前，对近期商业化时间点只给中等置信度。
            claimRefs:
              - CE040
              - CE041
              - CE042
              - CE043
              - CE045
              - CE048
              - CE049
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与理想客户分层
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 的公开客户图谱很特殊：它仍更像设计导入生态，而不是成熟的已签收入账户清单。公司把光 I/O 定位在 AI 训练和推理基础设施里； 直接“买方”往往不是传统采购部门，而是
              ASIC、GPU、网络或机架级架构团队。公开具名的交易对手因此混合了几类角色： DARPA 和防务项目是验证资金方；HPE、NVIDIA、Intel、GlobalFoundries、Lockheed Martin
              是战略合作方和投资人； GUC、Alchip、Wiwynn 则为未具名的超大规模云或云买方打开市场路径。Ayar 自己在 2024 年融资稿里称， 公司正把大规模制造与客户路线图对齐，并与 Tier 1
              客户开展令人兴奋的接触，但仍未点名这些账户，也没有披露多少在付费、多少还在评估。 这意味着本章的核心投资判断不是客户兴趣是否存在——显然存在——而是公开证据能否证明可复制的量产部署。今天还不能。
