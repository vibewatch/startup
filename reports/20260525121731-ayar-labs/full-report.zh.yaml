            body: >-
              本章的证据质量最适合概括为“生态验证强，已闭合商业证明弱”。可以较有把握纳入投资判断的是，Ayar 已经获得计算、封装、防务和机架集成领域一流交易对手的严肃接触；
              公司早已越过纯概念科学，进入集成演示、验证测试和选择性客户预览；公共资金与伙伴支持也都围绕同一个核心问题对齐，
              即把数据传得比铜互连更远、更快。尚不能判断的是客户规模化持久性：公开来源没有显示具名超大规模云采购承诺、量产单位数量、价格区间、集中度表或留存指标。
              已审阅来源也没有找到公开量子计算客户公告，尽管公司在更广泛的行业讨论里与这一主题相邻。投资人因此应把 Ayar 视为高质量设计导入故事： 商业转化有可能发生，但公开透明度还不够。
