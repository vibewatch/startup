  - id: TP005
    title: 护城河耐久性与威胁评分
    columns:
      - 威胁 / 护城河议题
      - 证据
      - 严重度
      - 重要性
      - 尽调追问
    rows:
      - - 封装深度差异化
        - Ayar 将光学 I/O 直接接入主要 XPU 和交换芯片厂商已使用的封装流程
        - 中等正向
        - 这是 Ayar 相比可插拔模块和许多 NPO 对手最清晰的技术护城河
        - 哪些客户已在量产封装设计中认证 TeraPHY？
      - - 外置激光器可维护性
        - Ayar 的远程光源，以及 Ciena/Nubis 的外置光源叙事，都保留了一部分可维护性优势
        - 中等正向
        - 激光器可维护，可以削弱市场对 CPO 的一项主要反对意见
        - 外置激光器多久需要更换，由谁更换？
      - - NVIDIA 交换层内化
        - Spectrum-X Photonics 将在 2026 年把自研硅光子和 CPO 带入以太网交换
        - 高度负向
        - 交换机 OEM 可以在 fabric 层绕过商用光学 I/O 供应商
        - 如果交换机客户把光学内化，Ayar 还控制任何差异化层吗？
      - - 在位厂商资金实力挤压
        - Broadcom、Marvell、Cisco、Intel、Coherent 和 Lumentum 都背靠上市公司资产负债表
        - 高度负向
        - 在位厂商能出钱熬更长认证周期，也能顶住更慢采用
        - 哪些现金和合作伙伴承诺能让 Ayar 熬过 CPO 爬坡延迟？
      - - LPO 与可插拔模块延续
        - 分析师来源预计，LPO 会早于大批量 CPO 爬坡，可插拔模块仍将在许多链路占主导
        - 高度负向
        - 架构切换变慢，会拉长 Ayar 销售周期，并可能压缩早期 TAM
        - 哪些 AI 链路在功耗或密度上已经糟到必须现在采用封装内光学？
      - - 板块资本市场怀疑
        - Rockley 通过 Chapter 11 破产重组，随后出售核心硅光子 IP
        - 中等负向
        - 纯光子公司可能在规模经济到来前就断掉融资
        - 如果不再做一轮大额融资，Ayar 路线图中有多少已筹到量产所需资金？
    notes: 严重度标签是作者基于已审阅证据作出的判断，用于排列尽调优先级，并不暗示概率预测。
