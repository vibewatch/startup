  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 因素
      - 方向
      - 时间
      - 公开证据
      - 对 Ayar 的影响
      - 尽调追问
    rows:
      - - AI 模型和集群扩展到单机架之外
        - 正面
        - 即刻至 2030 年
        - Ayar 对工作负载的表述，加上 Dell’Oro 对集群规模的评论
        - 提高封装级带宽密度和低延迟互连网络的价值
        - 索取 2026-2028 年设计中按客户拆分的带宽地图和 radix 假设
      - - 超大规模云基础设施预算维持高位
        - 正面
        - 2026-2028
        - Alphabet、Meta 和 Amazon 文件，加上 Dell’Oro 与资本开支挂钩的网络展望
        - 支撑客户继续愿意为先进互连实验和平台换代投钱
        - 跟踪网络 / 光学支出是否随计算支出同步扩张
      - - AI 数据中心的电力和供电约束
        - 正面
        - 2026-2030
        - IEA 电力需求预测和 Dell’Oro 对 600 kW 机架的评论
        - 如果能降低每 bit 功耗和铜走线长度，光 I/O 价值主张会更强
        - 验证相对高端可插拔光模块和 LPO 的真实系统级节能
      - - 标准和生态进展（UCIe、CW-WDM、封装合作伙伴）
        - 正面
        - 2025-2028
        - Ayar 产品页、OFC 摘要和合作公告
        - 降低集成摩擦，让多厂商堆栈中的设计赢单更可信
        - 确认当前头部客户要求哪些标准
      - - 可插拔光模块和 LPO 仍是可用替代品
        - 负面
        - 2026-2028
        - LightCounting 和 Dell’Oro 均提到混合采用和可插拔光模块仍然有用
        - 即便整体光学市场增长，也可能延后 Ayar 拿到份额
        - 梳理哪些买方群体真正需要封装级光学，而不是升级模块即可
      - - 封装良率和已知良品 chiplet 要求
        - 负面
        - 2026-2028
        - IEEE OFC 关于连接器化 chiplet 和 HVM 流程的论文
        - 给光 chiplet 带来商业化和毛利率风险
        - 在假设规模经济前，先索取良率、组装和测试指标
      - - 交换机优先的 CPO 放量
        - 混合 / 负面
        - 2026-2027
        - 分析师说明和 NVIDIA photonics 公告都指向交换机平台先行
        - 扩大 CPO 整体 SAM，但可能让 Ayar 的加速器封装逻辑排在后面
        - 每个预测都要拆开交换机层和加速器层采用假设
      - - chiplet 侧光学的公开单位经济数据稀少
        - 负面
        - 持续
        - 公开来源披露区间，不披露出货 ASP 或 attach rate
        - 从 TAM 换算到 Ayar 可拿收入高度不确定
        - 把市场规模换算成估值前，先在 NDA 下取得客户、端口和定价数据
    notes: 这些驱动和约束行刻意混合市场拉动、技术就绪度和商业化摩擦。 时间基于基准运行日期时可获得的公开证据，不应被解读为确定的部署排期。
