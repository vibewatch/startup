companyProfile:
  summary: >
    Ayar Labs 总部位于 California 州 Santa Clara，成立于 2015 年，主攻面向 AI 和 HPC 系统的封装内光学 I/O 商业化。公司的两段式产品栈由 TeraPHY 光学 I/O chiplet
    和 SuperNova 多波长远端激光源组成，目标是在加速器封装内部和跨机架连接中替代电 SerDes，让 scale-up fabric 在长距离下获得显著高于铜缆或可插拔光模块的带宽、更低延迟和更低功耗。公司累计融资约 $370
    million，最近一轮是 2024 年 12 月 $155 million Series D，将估值推到 $1 billion 以上；战略投资方包括 NVIDIA、AMD Ventures、Intel
    Capital、GlobalFoundries、HPE、Lockheed Martin Ventures 和 Advent。商业化收入、ARR、客户集中度、毛利率和烧钱速度没有公开披露；与超大规模云厂商以及 DoD/DOE
    项目的接触更多由合作方和补助驱动，还没有在商业规模上被验证。核心投资分歧在于，Ayar 的先发 IP 和战略股东阵容，能否跑赢 NVIDIA 自研 Spectrum-X/Quantum-X CPO 项目、Broadcom 的 CPO
    推进，以及 2026-2028 年仍不确定的 CPO 采用曲线。
