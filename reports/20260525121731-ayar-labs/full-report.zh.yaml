      - number: '7.2'
        title: 技术、集成与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Ayar 的技术论据强到值得重视，但还不足以抹掉制造风险。公开公司材料展示了多代 TeraPHY 路线图，以及罕见详细的内部热测试和 BER 测试， 包括 30–80°C 循环和模拟 800°C/s
              爬升。这些结果重要，因为它们回应了外界对热计算封装中微环型 CPO 的标准质疑。 但同一篇博客也强化了核心风险：Ayar 仍在谈 EVT、DVT、晶圆测试和验证关口，这些都必须关闭，制造才真正进入规模化。
              公开来源没有披露良率曲线、光学对准缺陷率、封装漏检数据或长期现场返修。供应链集中度进一步放大不确定性。 Ayar 的故事仍依赖 GlobalFoundries 的硅光子工艺、台湾封装伙伴的封装集成，以及
              Sivers 等外部激光器供应商提供 SuperNova 光源。 Laser Focus World 和 CIR 都清楚说明了远程激光器架构存在的原因：激光器对温度敏感，可维护性仍是现实问题。
              这套架构缓解了一个问题，同时创造了另一个问题——外部激光器认证、供应保障和更换模式都变成量产关键堆栈的一部分。
