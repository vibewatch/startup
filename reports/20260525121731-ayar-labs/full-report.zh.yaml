      - number: '8.3'
        title: 公开光学可比公司给出边界，而非直接倍数
        blocks:
          - type: paragraph
            body: >-
              公开市场光学公司差异太大，无法为 Ayar 支撑干净的直接倍数，但它们仍可作为边界条件。区间悲观端是 Rockley Photonics， 该公司 2023 年 1 月申请 Chapter
              11，并通过重组消除了超过 $120M 的有担保债务。当光子叙事无法转化为持久资本市场支持时， 这就是警示性的公开结果。POET Technologies
              处在早期阶段光谱的另一端：这是一家上市光学公司，虽然过去收入几乎可以忽略、分析师覆盖很薄且共识为卖出， 却拥有数十亿美元公开市值。与此同时，Lumentum 和 Coherent
              是大型多元化公开光子供应商，披露收入达到数十亿美元， 可作为规模参照，却不是阶段匹配的风险投资可比公司。分析师也继续给这个类别注入现实感：Lightwave、Cignal AI 和 LightCounting
              都认为， 广泛高量 CPO 部署仍处早期，并且很可能明显推到 2027 年或更晚。因此，公开可比公司不否定 Ayar 的估值标记，但反对虚假精确。
