  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场地图与竞争边界
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 卖的不是面板收发器；它试图把光学 I/O 嵌入封装本身，替代电 I/O 以及部分可插拔光模块角色。这意味着它的竞争集合横跨多层。直接架构层包括 Lightmatter、Celestial AI
              和 Ranovus 等私营 scale-up 光子创业公司，它们同样向更大 AI 集群推销光学 fabric。既有厂商层包括
              Broadcom、Marvell、Intel、Cisco/Acacia、Coherent 和 Lumentum，它们各自已经掌握交换芯片、硅光子、光 DSP、激光器或收发器分销中的若干环节。替代层包括
              Innolight、Eoptolink 和 Accelink 等厂商的可插拔与近封装光模块，以及线性驱动可插拔模块；这些方案在解决部分功耗问题的同时，保留了可维护性和多供应商采购。


              这个框架很关键，因为 Ayar 并不需要每个对手都复制它完全相同的 chiplet 设计才会丢份额。NVIDIA 的 Spectrum-X Photonics 交换机证明，交换机 OEM 可以在 fabric
              层把共封装光子内部化。Broadcom 和 Marvell 正借助超大规模云客户关系和已落地的硅光子经验，把 CPO 从实验室推向现场。同时，LightCounting 和 Avnet 都认为，LPO
              和先进可插拔模块会在许多链路中继续成为默认选择多年；这意味着 Ayar 必须先赢下最难、最高密度的 AI scale-up 用例，否则行业可能先落在更易维护的中间架构上。
