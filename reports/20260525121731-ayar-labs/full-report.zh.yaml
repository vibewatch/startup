              2026 年 3 月的 Wiwynn 合作很关键，因为它把 Ayar 从组件公司重新框定为系统架构参与者。已披露目标——1,024
              个加速器，配套机架级液冷、光纤管理和可维护激光模块——比早期仅限封装的演示更接近超大规模云厂商实际采购单元。
