      - number: '1.4'
        title: 运营足迹、生态系统与商业化姿态
        blocks:
          - type: paragraph
            body: >
              Ayar 的运营足迹和生态系统，现在更适合被理解为一套商业化堆栈，而不是一串标志。公开材料仍把公司锚在 Silicon Valley，但最新公告显示运营版图已经扩大：2025 年 7 月，Ayar 称其在
              Taiwan Hsinchu 开设新办公室，并把 San Jose
              总部面积扩大一倍，明确把扩张与高批量制造和共封装光学采用绑定。公司没有披露精确员工数，而是通过美国和台湾招聘计划、设施扩张以及专门的运营负责人来释放规模信号。围绕这套足迹的是一张密集的伙伴网络。HPE 通过多年
              Slingshot 与 AI 架构合作接入；NVIDIA 通过光学 I/O 合作和投资接入；GlobalFoundries 通过工艺与制造合作接入；Lockheed Martin 通过防务应用开发接入；Intel
              通过高曝光 FPGA 演示接入；Wiwynn 则通过机架级系统设计与制造接入。Gazettabyte 2026 年 1 月的访谈进一步补足细节：Ayar 正与 Alchip 和 GUC 合作，把光学引擎塞进先进
              ASIC 封装，尤其面向超大规模云厂商部署路径。合在一起，这些关系说明 Ayar 的商业化逻辑不是以狭窄的独立商用模式卖一个光子模块，而是嵌入更广泛的 AI 封装与机架生态。
