chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务身份与核心产品
        blocks:
          - type: paragraph
            body: >
              Ayar Labs 把自己定位为一家共封装光学公司，切的是 AI 基础设施里的数据搬运问题。公司公开材料一直称其成立于 2015 年，核心是用可直接集成进加速器、CPU、GPU、交换芯片和其他先进封装的光学
              I/O，替代铜缆和可插拔光模块造成的瓶颈。商业系统围绕两个紧耦合组件搭建：TeraPHY 光学引擎和 SuperNova 多波长远端光源。按当前产品定位，Ayar 声称这套光学 I/O 栈相对传统可插拔光模块加电
              SerDes，可实现 5x-10x 更高带宽、约 10x 更低延迟和显著更好的能效，同时把通信距离从毫米级延伸到公里级。公司官网话术也已经从只讲组件，转向 AI scale-up
              平台：当前材料强调“超越机架”的连接，宣传每个光学引擎超过 8 Tbps，并把数千块 GPU 像一个统一系统运行作为目标终态。技术页面进一步说明，这套方案更偏标准化，而不是完全定制：当前支持
              AIB，下一代路径指向 UCIe，并与 CW-WDM MSA 对齐。这个定位很关键，因为 Ayar 不只是在卖一个光子器件；它想成为下一代 AI 封装、机架和分解式内存架构里的光互连层。
