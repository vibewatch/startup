            title: 先交换机、再混合采用，可能推迟 Ayar 的收入捕获
            body: 公开证据并不支持行业会立刻从可插拔模块跳到加速器封装光学 chiplet。分析师指向一条分阶段路径：可插拔模块和 LPO 仍然相关，交换机侧 CPO 先爬坡，封装级光学 I/O 随后跟进。
            calloutType: risk
