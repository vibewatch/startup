  - id: FE004
    title: 互连选项矩阵
    type: matrix
    layout: wide
    summary: Ayar 的小芯片光互连相对于既有电互连 / 可插拔链路和交换机中心 CPO 设计的定位。
    data:
      columns:
        - 维度
        - Ayar 小芯片光互连
        - 电互连 / 可插拔
        - 交换机中心 CPO
      rows:
        - label: 封装外覆盖距离
          values:
            - label: 封装外覆盖距离
              tone: neutral
              detail: 从封装到机架和远程内存的距离
            - label: 高
              tone: positive
              detail: 借助远置光源覆盖毫米到公里级
            - label: 低-中
              tone: negative
              detail: 铜线在封装 / 板级很强，距离拉长后变弱
            - label: 中
              tone: positive
              detail: 适合交换机邻近场景，但架构不太原生贴合计算封装
        - label: 每比特功耗
          values:
            - label: 每比特功耗
              tone: neutral
              detail: AI scale-up 的关键瓶颈
            - label: 强
              tone: positive
              detail: 低于 5 pJ/bit 的演示目标，以及 4x–8x 的营销优势
            - label: 弱
              tone: negative
              detail: 长距电互连和可插拔模块消耗更多功耗
            - label: 强
              tone: positive
              detail: CPO 也能降功耗，但可维护性取舍仍在
        - label: 现场可维护性
          values:
            - label: 现场可维护性
              tone: neutral
              detail: 运营方无需更换整个封装时，能替换多少部件
            - label: 中
              tone: neutral
              detail: 外置激光器有帮助，但光引擎仍集成在封装中
            - label: 高
              tone: positive
              detail: 可插拔模块是当下最简单的运维模型
            - label: 低-中
              tone: negative
              detail: 纯共封装可能加剧维修焦虑，除非激光器外置
        - label: 生态成熟度
          values:
            - label: 生态成熟度
              tone: neutral
              detail: 标准、合作伙伴和部署证据
            - label: 中
              tone: neutral
              detail: 合作伙伴阵容强，但具名大规模部署仍少
            - label: 高
              tone: positive
              detail: 供应链和买方行为已经根深蒂固
            - label: 中
              tone: neutral
              detail: 有大厂支持，但采用仍早且对良率敏感
    approximationNotes: 定性矩阵综合了官方产品主张和反向分析师评论；语气表示相对位置，不是绝对分数。
    claimRefs:
