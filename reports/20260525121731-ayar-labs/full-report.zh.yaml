  productSummary: >
    Ayar Labs 销售 TeraPHY 光学 I/O chiplet——一颗 CMOS 硅光子裸片，可通过标准 chiplet 接口与 CPU、GPU、交换机 ASIC 或 FPGA 一起集成进客户计算封装——并搭配
    SuperNova，一种远端多波长 CW 激光光源，通过单根光纤为 TeraPHY 供光。组合系统在每颗 chiplet 上提供 Tbps 级带宽，功耗为个位数 pJ/bit，把高带宽互连距离从毫米级拉到公里级，并在 AI
    scale-up 和分解式计算 fabric 中替代电 SerDes 加可插拔收发器。
  customerFocus: >-
