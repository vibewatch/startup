  - id: TP004
    title: 过渡架构与切换成本对比
    columns:
      - 架构
      - 代表厂商
      - 运营优势
      - 运营劣势
      - 对 Ayar 的含义
    rows:
      - - 重定时可插拔模块
        - 模块厂：Coherent、Lumentum、Innolight、Eoptolink、Accelink
        - 可热插拔、多供应商、运维熟悉
        - 800G–1.6T 下功耗更高，热约束更紧
        - 最密集 fabric 场景的默认基线；Ayar 必须在 TCO 上打赢它
      - - 线性驱动可插拔模块（LPO）
        - 生态广；LightCounting 和 Avnet 重点提及
        - 保留可插拔可维护性，同时削掉部分 DSP 开销
        - 光学仍留在封装外
        - 早期 CPO 采用中最可信的近期替代方案
      - - 近封装光学（NPO）
        - Ciena/Nubis、Lightmatter L-series
        - 电气走线更短，密度优于前面板可插拔模块
        - 拿不到完整封装级 I/O 收益
        - 能满足想降低风险、不愿直接上完整封装内光学的买家
      - - 交换层 CPO
        - Broadcom、NVIDIA、Marvell
        - 核心 fabric 中密度和功耗收益最高
        - 集成复杂，维修负担重
        - 若交换机 OEM 自己内化光子能力，Ayar 会受威胁
      - - 封装内计算裸片光学 I/O
        - CPO / NPO 方案：Ayar、Intel OCI、Celestial AI、Lightmatter M-series
        - 最大化缓解芯片边缘 I/O 压力，并提升带宽密度
        - 认证与封装负担最高
        - 只有更深封装切入值得承担复杂度，Ayar 才能赢
      - - 自建定制光学方案
        - NVIDIA 和超大规模云厂商牵头的生态
        - 完全控制架构和供应链
        - 需要深厚的光子、封装和制造能力
        - 最大客户可能把最有价值的光学层内化
    notes: 对比重点放在可维护性和封装深度，而非标价；私营 CPO 平台的具体合同价格未公开披露。
