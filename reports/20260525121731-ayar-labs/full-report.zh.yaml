      - number: '7.4'
        title: 竞争与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              Ayar 并不是在一条无人竞争的架构赛道里。NVIDIA 已经把硅光子纳入自己的交换机组合。Broadcom 有清晰的 XPU-CPO 和光学路线图， 还拿到了来自 Meta 的客户可靠性统计。Marvell
              正把内部硅光子经验与收购 Celestial AI 结合。Lightmatter 仍在面向 AI 互连网络推广 Passage，
              这意味着即便不计入更专门的挑战者，初创公司赛场也已经拥挤。这个竞争集合重要，因为每多一个既有巨头或资本充足的初创公司， 光 I/O 保持为可对外销售、且独立经济性丰厚的品类的概率就会下降。IP
              图景也提高了犯错成本。Justia 的受让人页面显示， Ayar、Lightmatter 和 Rockley 之间存在多组相邻专利组合；Rockley 破产以及后续专利组合出售说明，困境中的光子 IP
              可能回到更有资金实力的竞争对手手里。 如果冲突出现，PTAB 提供了现成挑战场所。这些都不能证明 Ayar 今天存在 FTO 问题；但确实说明，公司身处密集且活跃可交易的专利环境，
              后期争议即便没有法庭胜负，也可能造成战略伤害。
