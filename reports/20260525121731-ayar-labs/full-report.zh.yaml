    rows:
      - - Broadcom
        - 交换机层 CPO
        - 上市既有厂商；最新 10-K 于 2025-12-18 提交
        - 超大规模交换和 AI 互连网络中的 CPO
        - 最强证据：交换机厂商可在 Ayar 赢得广泛 socket 前先把 CPO 工业化
      - - Marvell
        - 定制 XPU + 互连
        - 上市既有厂商；最新 10-K 于 2026-03-11 提交
        - 面向多机架定制 XPU scale-up 的共封装光学
        - 把硅光、光 DSP 和超大规模云厂商关系捆在一起
      - - Cisco / Acacia
        - 客户端光学 + 光引擎
        - 上市既有厂商；最新 10-K 于 2025-09-03 提交
        - AI scale-out 光学和光引擎
        - 即便封装深度重叠较弱，仍掌握光学客户关系
      - - Intel Silicon Photonics
        - OCI chiplet + 可插拔光模块
        - 上市既有厂商；最新 10-K 于 2026-01-23 提交
        - 共封装光 I/O chiplet 和大规模出货的可插拔基础
        - 在 chiplet 式光 I/O 上最接近 Ayar 的既有厂商类比对象
      - - Coherent
        - 激光器 / 收发器 / 子系统
        - 上市既有厂商；最新 10-K 于 2025-08-19 提交
        - 向 AI 互连网络供应光模块和激光器
        - 掌握许多 CPO 系统仍需要的使能组件
      - - Lumentum
        - 可插拔光模块 + 激光源
        - 上市既有厂商；OFC 2026 展示 1.6T 可插拔光模块和 CPO 激光源
        - AI 数据中心可插拔光模块和 CPO 高功率光源
        - 同时在过渡架构和使能组件层竞争
      - - Lightmatter
        - 端到端光子互连路线图
        - 累计融资 $850M；披露估值 $4.4B
        - 面向 AI scale-up 的 NPO、OBO、2D/3D CPO 和 3D interposer
        - 融资最充足的私营对手，产品面比 Ayar 更宽
      - - Celestial AI
        - Photonic Fabric scale-up 互连
        - 累计融资 $515M；2025 年宣布被 Marvell 收购
        - 封装到机架的光学 scale-up 互连网络和 16 Tbps chiplet
        - 与创业公司路线直接重叠，也证明创业公司正被既有厂商整合
      - - Ranovus
        - XPU 和交换机 CPO
        - 私营；推广 12.8 Tb/s scale-up CPO，并声称获得 Tier-1 验证
        - 面向多机架 scale-up 的 XPU 和交换机光引擎
        - 在明确 XPU / 交换机 CPO 叙事上，仅次于 Lightmatter/Celestial 的最接近创业公司同行
      - - 可插拔光模块 / LPO 生态
        - 现状方案和过渡替代品
        - Innolight、Eoptolink 和 Accelink 已在出货 800G/1.6T 等级产品
        - 让运营方可以推迟封装集成
        - 最务实的近期替代品，因为保留热插拔可维护性
    notes: 截至 2026-05-25 运行日期，这些行汇总 Ayar 在商业上最重要的竞争对手和替代品； 规模信号采用最新公开披露，而不是标准化收入或出货指标。
