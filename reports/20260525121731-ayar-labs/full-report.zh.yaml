  - id: FE001
    title: 从封装到机架的光 I/O 系统流
    type: flow
    layout: wide
    summary: Ayar 的 TeraPHY 小芯片和 SuperNova 光源如何连接计算封装、远程内存和机架级互连网络。
    data:
