      - number: '2.3'
        title: 买方、用户与预算结构
        blocks:
          - type: paragraph
            body: >-
              Ayar 式光学 I/O
              的直接买方通常不是最终超大规模云厂商单独一方，而是加速器设计方、交换机厂商、先进封装伙伴和系统集成商的组合；这些角色把云厂商的带宽需求转化为封装级设计定点。在最有吸引力的细分市场——直接挂在加速器上的
              scale-up fabric——运营用户是云厂商 AI 平台团队，但即时采购决策落在集成封装的硅片或子系统供应商手里。交换机侧 CPO 是第二个细分市场，买方是网络平台团队或交换机
              OEM，超大规模云厂商的网络架构与基础设施财务团队则是实际付款方。ODM 和先进 ASIC 伙伴等系统集成商夹在中间，因为它们要判断基于 chiplet
              的光学架构能否以可接受良率完成封装、测试、散热和制造。HPC 与 exascale 系统是更小但仍有意义的细分市场，因为它们重视低延迟、分解式架构和内存 / fabric
              效率，即便超大规模云的出货量尚未完全释放。跨这些细分市场看，预算所有权通常在基础设施架构、网络或硅平台负责人手里，而不是采购团队购买大宗光模块。这有利于
              Ayar，只要它能被写入下一代加速器或交换机平台规格；但这也意味着认证周期漫长且由伙伴牵引，不是快速更换模块。
