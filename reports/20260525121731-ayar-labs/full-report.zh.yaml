      - number: '8.2'
        title: 私有光子同业界定上行语境
        blocks:
          - type: paragraph
            body: >-
              最干净的私有同业信号说明，Ayar 今天并没有按类别龙头估值。Lightmatter 2024 年 10 月 Series D 用 $400M 新资金定出 $4.4B 估值， 累计融资
              $850M。Celestial AI 2025 年 3 月 Series C1 融资 $250M，把累计融资推到 $515M 以上，并将估值抬到 $2.5B 以上。 即便在类别低端，Scintil
              Photonics 在 2025 年 8 月后期轮后也接近 $133.6M 估值。换句话说，私有光学基础设施市场已经横跨从低于 $200M 的专用资产， 到数十亿美元级 AI 光子平台。Ayar 自身略高于
              $1B 的位置，因此有意义，但相对于融资最激进的光子公司仍有折价。 这个折价可以理解：Ayar 有战略投资人、早期出货历史和强产品主张，但公开证据仍没有显示广泛商业转化或财务披露， 足以支撑按
              Lightmatter 或 Celestial 水平溢价。
