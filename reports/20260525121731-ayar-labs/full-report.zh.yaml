      - number: '2.2'
        title: 市场规模——TAM、SAM 和贴近产品的 SOM 代理
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 的公开市场规模口径差异很大，因为各方测量的东西并不相同。最宽的 TAM 口径是 AI 集群光互连：LightCounting 公开摘要称，该市场将从 2024 年约 $5 billion 增至
              2026 年超过 $10 billion，并在光互连从 scale-out 扩散到 scale-up fabric 的过程中持续增长到 2030 年。更窄的 SAM 口径是独立 CPO 市场。在这里，公开
              2026 年估计已经相差超过 3x：PW Consulting 基于 2025 年 $560 million 的基数，隐含 2026 年约 $1.247 billion；HDIN Research 则给出更宽的
              2026 年 $2.2-$4.2 billion 区间。差异来自边界选择：只算模块还是算更广生态价值，先看交换机部署还是所有 CPO 架构，以及对超大规模云厂商采用时点的不同假设。对 Ayar
              而言，由于公开来源没有披露定价、设计定点数量或已承诺出货量，一个更贴近产品的口径比经典企业 SOM 预测更有辩护力。若用 PW Consulting 自身 2025 年细分占比作为低情景代理，服务 AI/HPC
              工作负载的光学引擎切片在 2026 年约为 $0.43 billion。这不是 Ayar 收入预测，但相较完整光互连 TAM，它更现实地代理了 CPO 栈中最接近 Ayar 当前产品足迹的部分。
