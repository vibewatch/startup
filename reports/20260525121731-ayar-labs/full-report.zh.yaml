              这套架构是以 chiplet 为中心的光学 fabric。电侧，当前公开代际仍使用 AIB；Ayar 的下一代叙事则明确绑定 UCIe 和更广泛的多供应商 chiplet 生态。光侧，系统依赖 CW-WDM
              式多波长光源，以及能扛住真实封装流程的光纤贴装方法。Ayar 自身材料称，UCIe 加光学 I/O 是让内存离开计算封装、同时不牺牲带宽的关键；OCP 和 IEEE/OFC 材料则强调 V-groove
              无源贴装和已知良品 chiplet 流程，这是从实验室演示走向制造的实际桥梁。重要的尽调结论是，Ayar 的差异化不只在光子裸片，而在跨标准、封装设计、光纤贴装和外置光源的完整集成配方。
