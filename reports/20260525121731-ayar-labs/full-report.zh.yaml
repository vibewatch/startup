      - number: '1.6'
        title: 采用风险与剩余披露缺口
        blocks:
          - type: paragraph
            body: >
              公司概况里的主要风险不在于 Ayar 技术是否有意思，而在于这项技术能否足够快地穿过可靠性、可维护性和超大规模部署的完整关卡，从而支撑后期私营估值。Ayar 自有材料现在称方案已经验证、可投产，但独立报道仍把
              2026 年描绘成过渡期，而不是超大规模部署已经完成的故事。The Register 2026 年 3
              月的报道尤其适合作为反向视角，因为它点出了公司新闻稿弱化的运营细节：液冷交互、光纤走线、可制造性、遥测要求，以及与可热插拔光模块相比，共封装光学引擎一旦失效会带来更大的“故障影响半径”。DARPA 和 Laser
              Focus World 也提醒读者，行业长期目标——100 Tbps 以上、每 bit 能耗很低的光学 I/O——仍是一段开发旅程，不是已经完成的市场事实。披露层面，Ayar
              仍不公开精确员工数、已点名客户部署、收入、股权拆分和委员会级治理细节。对尽调而言，这意味着规模只能从融资、设施扩张、技术里程碑和伙伴密度中推断，而不能直接读取标准后期经营指标。
