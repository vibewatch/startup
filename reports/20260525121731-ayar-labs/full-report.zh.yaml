        blocks:
          - type: paragraph
            body: >-
              Ayar 的产品线异常集中：公司卖的是两段式光学 I/O 栈，而不是一大菜单的光模块。TeraPHY 是封装内光学 I/O chiplet，贴着计算硅片放；SuperNova 是远端多波长激光源，通过光纤给这些
              chiplet 供光。从客户任务看，这对组合要替代耗电的电链路和可插拔光链路，解决 scale-up AI 系统的瓶颈，之后再延伸到池化内存和其他可组合架构。公开材料一直把 AI scale-up
              定位为第一个商业落点，把远端或分解式内存定位为第二个落点。这让 Ayar 看起来不太像通用光模块供应商，更像未来 xPU 封装和机架 fabric 的组件供应商。
