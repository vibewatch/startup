      - number: '1.3'
        title: 融资历史与资本基础
        blocks:
          - type: paragraph
            body: >
              Ayar Labs 的融资轨迹已经清楚地从深科技风险资本，走向大额 AI 基础设施成长资本。2022 年 4 月的 Series C 融资 $130 million，由 Boardman Bay Capital
              Management 领投，Hewlett Packard Enterprise 和 NVIDIA 等战略方参投，早期支持方 Applied Ventures、GlobalFoundries、Intel
              Capital 和 Lockheed Martin Ventures 也在其中。这轮融资重要，不只是因为扩充了股权结构表，更因为 Ayar
              当时表示已有首批批量商业出货签约，并预计年底前出货数千件，把融资和商业化主张挂钩，而不只是 R&D。2024 年 12 月，公司宣布 $155 million Series D，由 Advent Global
              Opportunities 和 Light Street Capital 领投，并称累计融资达到 $370 million、估值升至 $1 billion 以上。到 2026 年 3 月，Ayar 披露了更大一轮
              Series E：Neuberger Berman 领投 $500 million，使累计融资达到 $870 million，估值达到 $3.75 billion。Series E 投资人再次扩围，引入 ARK
              Invest、Insight Partners、Qatar Investment Authority、Sequoia Global Equities 和 1789 Capital 等机构资本，也新增 Alchip
              和 MediaTek 作为半导体生态战略投资方。Neuberger Berman 还获得董事会观察员席位，意味着公司在未上市前已叠加更正式的成长阶段治理层。
