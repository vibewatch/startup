      - number: '7.6'
        title: 监管、出口管制与防务相邻风险
        blocks:
          - type: paragraph
            body: >-
              Ayar 的出口管制风险不在于光 I/O 今天显然被禁，而在于 AI 硬件周边的合规边界扩张速度，快过年轻硬件公司通常建设法务基础设施的速度。 Cleary 2025 年 3 月对 BIS
              会议的总结称，围绕中国、AI、半导体和超级计算的 EAR 执法大幅增加，Entity List 也在扩张。 2025 年 1 月 BIS 临时最终规则尤其相关，因为它收紧了对处理先进计算 IC 的晶圆厂和
              OSAT 的尽调预期——这正是光互连供应商依赖的生态系统。 Ayar 与 DARPA PIPES 和 POEM 的接近度会提高敏感性，而不是降低敏感性：即便产品面向商业 AI
              基础设施，双用途和防务相邻的性能目标也会强化筛查、安全和客户接受义务。 本次审阅的公开来源没有披露 Ayar 的 ECCN 立场、出口管制意见，也没有说明公司是否在商业
              AI、中国相关机会和防务敏感项目之间划出严格边界。 这种不确定性眼下可管理，但它不是文书脚注；如果处理太晚，会直接压缩 TAM 或延迟出货。
            claimRefs:
              - CR043
              - CR044
              - CR045
              - CR046
