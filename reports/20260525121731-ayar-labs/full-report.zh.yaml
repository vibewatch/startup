      - number: '7.3'
        title: 市场时点与采用风险
        blocks:
          - type: paragraph
            body: >-
              Ayar 最大的风险，可能是市场认同它的方向，却不认同它的时间表。Ayar 相关来源和 Gazettabyte 把首次商业使用框定在 GPU scale-up 场景， 并指向 2026–2028
              年商业化窗口。独立分析师和行业媒体更谨慎。LightCounting 认为高量 CPO 部署大概率在 2027 年， 而 LPO 部署已经开始，重新定时的可插拔模块在本十年剩余时间仍会有韧性。Optical
              Connections 还补充说， 第一波热度降温后，AI 光学增长应在 2026–2027 年放缓。CIR 的 2026 年分析更进一步：除少数超大规模环境外， 可见的 CPO
              部署仍然很少，许多运营商对可维护性和供应商锁定不舒服，企业可能把 CPO 视为下一个十年的技术。 这不意味着 Ayar
              的长期方向错了。它意味着收入窗口可能从“很快必然发生”变成“以后必然发生”，而深科技硬件公司常常按前一种叙事融资， 却扛不住后一种叙事。在这个语境下，LPO、NPO
              和更好的可插拔模块不是失败替代品；它们是真实的桥接架构， 能在不推翻光 I/O 投资逻辑的情况下推迟 Ayar 的收入爬坡。
