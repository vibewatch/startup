      - number: '6.2'
        title: 已公开具名交易对手与证据质量
        blocks:
          - type: paragraph
            body: >-
              最可信的具名公开证据，是那些把 Ayar chiplet 拉进真实系统语境的合作。HPE 是最清晰的 OEM / 渠道伙伴， 因为双方宣布围绕未来 Slingshot 世代和联合客户接触开展多年合作。Intel
              是最清晰的技术验证伙伴， 因为 Ayar 与 Intel 在 DARPA PIPES 下合作，之后又在 Supercomputing 2023 展示了 4 Tbps 光互连 FPGA。 Lockheed
              Martin 是最清晰的防务侧集成商，因为它既投资了 Ayar，也宣布了面向 DoD 应用的感知系统合作。 GlobalFoundries
              与其说是“客户”，不如说是关键制造锚点；但它愿意投资，并公开围绕封装内客户 ASIC 共同开发，仍然是有意义的客户就绪度证据。 NVIDIA 的角色很强，但更模糊：公司参与未来 AI
              架构合作并两次投资，可公开记录仍没有走到具名部署。综合来看，这些证据强过标识墙， 但弱于已披露的经常性量产合同。
