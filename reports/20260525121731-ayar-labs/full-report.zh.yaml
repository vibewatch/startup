    PIPES、国家实验室）。
  businessModel: >-
    面向计算封装集成商和系统 OEM，直接 B2B 销售 TeraPHY chiplet 与 SuperNova 激光模块；现阶段通过评估套件准入推进商业化，客户项目投产后再按高批量 chiplet /
    激光器单价变现。DARPA/DOE 的非稀释性补助补充 R&D 资金。
