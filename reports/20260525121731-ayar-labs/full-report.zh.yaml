      - number: '6.5'
        title: 合作经济性、持久性与集中度
        blocks:
          - type: paragraph
            body: >-
              Ayar 公开客户证据的主要商业弱点不是缺少兴趣，而是缺少经济披露。TeraPHY 或 SuperNova 没有公开定价，NRR、GRR、流失或续约数据没有披露，
              客户数分母没有披露，最大客户收入占比也没有披露。公开具名证据还集中在少数战略投资人与政府相关渠道里，这会真实放大外界高估多元化的风险。 Next Platform 明确提醒读者，不要因为 NVIDIA、AMD 或
              Intel 投资就推断其已进入量产部署；它还单独指出，硅光子在生产系统里的存在感仍然很低， 因为买方仍担心规模经济性和可靠性。LightCounting 的 SC23 评论指向类似方向：Ayar
              的演示值得关注，但 Nvidia 自己的 NVLink 网络仍非光学。 Ayar 自己的 2026 年网络研讨会同样承认，制造流程、封装和供应链就绪度仍要在 2026-2028
