      - number: '6.3'
        title: 政府与防务渠道
        blocks:
          - type: paragraph
            body: >-
              在 Ayar 的公开记录里，政府和防务是最早、也最具体有文档支撑的准客户渠道。DARPA 的 POEM 和 PERFECT 项目界定了 Ayar 创始人最初要解决的性能和功耗问题， PIPES
              则提供了最清晰的正式桥梁，把研究脉络接到与 Intel 合作的封装光 I/O。DARPA 自己的 PIPES 页面明确把该技术描述为既适用于专用 DoD 产品， 也适用于双用途 CPU、GPU、AI 和 HPC
              系统。随后，Lockheed Martin 把这条脉络延伸到实际防务用例，将 Ayar 的光 I/O 定位于下一代感知系统和 DoD 频谱处理工作负载。 HPE 又增加了一条相邻的公开 HPC 渠道，把
              Slingshot 合作与未来 DOE exascale 系统挂钩。缺口同样重要： 没有任何已审阅来源点名 LLNL、ORNL、Sandia 或其他国家实验室部署，也没有任何防务或政府关系披露公开合同金额。
              因此，这条渠道真实且战略重要，但更像验证锚点，还不是透明收入基础。
