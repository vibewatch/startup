      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Ayar Labs 的公开治理画像仍由创始人主导，Mark Wade 现在已经明确成为运营重心。公司在 2023 年 12 月宣布，联合创始人、时任 CTO Wade 接替 Charles Wuischpard
              出任 CEO；Wuischpard 在交接期短暂担任顾问后离开。Ayar 自身公告和 Lightwave
              报道都把这次变动描述为一次有意安排：公司从外部引入的规模化高管，重新切回技术创始人来带下一阶段商业化。公开领导层页面显示，公司的管理层厚度比早年披露更强，包括 CFO Lisa Cummins
              Dulchinos、CTO 兼联合创始人 Vladimir Stojanovic、首席科学家兼联合创始人 Chen Sun、首席战略官 Vivek Gupta、制造与台湾运营负责人 Scott
              Clark，以及总法律顾问兼公司秘书 Matthew Gloss。同一页面还列出了辨识度较高的董事会名单，包括 Craig Barratt、Pat Gelsinger、Will Graves、Jordan
              Katz、Ganesh Moorthy 和 Geoff Tate。仍然缺失的是后期投资者通常想看的治理细节：Ayar 没有公开拆分委员会架构、董事独立性、持股比例，或 Series E
              董事会观察员披露之外的详细董事权利。因此，这是一套足以支撑生态信用的治理画像，但在硬治理机制上仍带有私营公司信息披露偏轻的特征。
