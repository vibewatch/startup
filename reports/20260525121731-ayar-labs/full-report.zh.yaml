      - number: '1.5'
        title: 里程碑与当前扩容轨迹
        blocks:
          - type: paragraph
            body: >
              公司的里程碑路径呈现出重复节奏：先拿 DARPA 相关技术验证，再拿生态证明，系统级 scale-up 到 2026 年才开始成为主线。Ayar 的历史叙事可追溯到 DARPA POEM
              中关于处理器内部和处理器之间光通信的工作，随后进入 PIPES 项目，Ayar 与 Intel 在先进 FPGA 封装上演示了光学 I/O。后续里程碑更明确地转向商业化：2022 年 Series C
              把融资与已签约的首批批量商业出货绑定；2023 年 Intel FPGA 展示公开了 4 Tbps 双向演示；2024 年 12 月 Series D 将光学 I/O
              描述为已可商业化，并与客户路线图对齐；2025 年 7 月台湾扩张则被定位为高批量制造准备。2026 年 3 月的 Series E 和 Wiwynn 公告把故事又推高一层，从 chiplet
              与封装就绪，转向面向 1,024 个加速器、每个加速器超过 100 Tbps 光连接的机架级参考架构。这一顺序很重要。Ayar
              的公开证据已经不再局限于器件级或单封装性能主张；它现在给出了一条从封装集成走向可部署超大规模机架系统的可信路径。
