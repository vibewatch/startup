      - number: '8.6'
        title: 建议：观察，按面值合理，溢价前继续研究
        blocks:
          - type: paragraph
            body: >-
              从公开证据出发，最可防守的判断是中等置信度观察、估值立场合理；但前提是，未披露的优先股堆叠如果对投资人不友好，同一估值标记可能显得偏高。 Ayar 值得获得真实信用：罕见的战略投资团，来自 HPE 和
              GlobalFoundries 的生态验证，DARPA 支撑的类别相关性， 以及明显对齐 AI scale-up 痛点的产品故事。但反向逻辑同样具体：最好的独立类别研究仍认为共封装光学不可避免但不会马上到来，
              公开市场纯光子标的在该板块已经出现严重下行，而 Ayar 既不披露收入，也不披露单位经济性。正因如此，一个对价格敏感的建议必须止步于买入之前。
              能推动结论变化的工作很直接：确切投后估值和优先权条款、当前出货和收入规模、设计定点正在转化为量产项目的证据，
              以及光学堆栈经济性能支撑持久回报的证据。在这些事实公开或经尽调确认之前，上一轮平价合理，但支付有意义的溢价不合理。
