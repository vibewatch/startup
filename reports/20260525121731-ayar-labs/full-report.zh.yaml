        - id: n2
          label: AIB / UCIe 电边界
          description: 当前 AIB 世代正朝兼容 UCIe 的光重定时器迁移
        - id: n3
          label: TeraPHY 小芯片
          description: 光引擎把电信号流量转换为 WDM 光链路
        - id: n4
          label: 光纤 / 连接器化连接
