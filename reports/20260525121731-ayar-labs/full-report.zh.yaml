      - number: '3.5'
        title: 差异化、护城河与切换成本
        blocks:
          - type: paragraph
            body: >-
              Ayar 真正的差异化是光学插入深度。公司试图利用主要 XPU 厂商熟悉的制造和封装流程，把光学 I/O 直接放进计算或交换封装，同时让光源保持远端且可维护。这不同于大多数可插拔厂商，也不同于 Acacia
              偏客户侧光模块的重点，更不同于 Intel 集成激光的 OCI chiplet。若 Ayar
              赢下一个插槽，切换成本会很可观：封装协同设计、光纤拓扑、热认证和远端激光架构都会成为平台定义的一部分，之后再切回前面板光模块或换成另一家光学 I/O 供应商，成本都会很高。


              这条护城河并非不可攻破。更大的既有厂商有足够资本和制造深度来补齐功能差距，NVIDIA 也已经证明战略买方可以在交换机层内部化光子能力。资本市场历史同样是警示：Rockley 的 Chapter 11 重组和后续
              IP 出售说明，硅光子专门厂商可能在规模经济到来前失败。因此，Ayar 拥有一条狭窄但有价值的护城河：当客户今天就想要直接封装内光学 I/O
              和可维护外置激光器时，它处在领先位置；但护城河能持续多久，取决于它能否在市场落到既有厂商自有平台，或更方便运营的 LPO 与可插拔混合方案之前，把技术认证转化为设计定点。
