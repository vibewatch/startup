  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A bottoms-up 2026-2030 model that separates switch-side CPO, accelerator-package optical I/O, optical-engine content, and full module/system value using actual port, attach-rate, and ASP assumptions.
    whyItMatters: Public market estimates currently mix incompatible scopes, which is why the 2026 range spans more than 3x. Without harmonized scope, TAM/SAM/SOM judgments can overstate Ayar's true capture opportunity.
    diligencePath: Obtain full LightCounting and Dell'Oro forecast workbooks or customer port plans, then reconcile them to a single taxonomy for module, engine, and package-level spend.
    relatedQuestionRefs:
    - QM003
    - QM004
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: company-som
    missingEvidence: Current Ayar design-win count, customer qualification stage, optical-engine pricing, and attach-rate assumptions by target segment.
    whyItMatters: Public sources are sufficient to build a product-near market proxy, but not to translate that proxy into a credible Ayar-specific SOM or revenue ramp.
    diligencePath: Request customer pipeline, package qualification milestones, and pricing ranges under NDA; then map each opportunity to switch-side versus accelerator-side adoption paths.
    relatedQuestionRefs:
    - QM006
    - QM020
    - QM026
  - type: missing-source
    severity: material
    topic: scale-up-vs-scale-out-split
    missingEvidence: A public dataset that cleanly splits optics demand, ports, or spend between scale-out and scale-up AI networks across hyperscalers.
    whyItMatters: Ayar is more levered to scale-up than generic optics demand, so missing this split makes it difficult to estimate how much of the broad AI-optics market is actually relevant.
    diligencePath: Collect hyperscaler architecture disclosures, switch port maps, and analyst channel checks that isolate NVLink/UALink-like fabrics from Ethernet scale-out fabrics.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: minor
    topic: optics-unit-economics
    missingEvidence: A current public $/Gbps decline curve for 800G, 1.6T, LPO, and package-level optical-engine alternatives used in AI clusters.
    whyItMatters: Public commentary confirms power and density advantages, but limited price transparency makes it hard to quantify the exact point at which chiplet optics become economically dominant.
    diligencePath: Use supplier quotations, teardown data, and paid transceiver ASP datasets to build a comparable $/Gbps and W/Gbps framework for pluggables, LPO, and optical engines.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
