callouts:
- calloutType: strength
  title: AI scale-up makes interconnect a first-order market problem
  body: Multiple independent sources now frame interconnect as the limiting factor in next-generation AI clusters rather than a secondary component choice. That directly benefits suppliers that can move bandwidth off copper without exploding power draw.
  claimRefs:
  - CM020
  - CM030
  - CM033
- calloutType: risk
  title: Switch-first and hybrid adoption can delay Ayar capture
  body: The public evidence does not support an immediate jump from pluggables to accelerator-package optical chiplets. Analysts point to a phased path in which pluggables and LPO remain relevant, switch-side CPO ramps first, and package-level optical I/O follows later.
  claimRefs:
  - CM018
  - CM019
  - CM040
- calloutType: insight
  title: Headline AI-optics TAM is not the same as Ayar’s monetizable pool
  body: Ayar clearly participates in a very large optics wave, but the directly monetizable slice is narrower because the company sells chiplets and optical engines, not the whole stack of modules, transport gear, and systems included in broad optics TAM figures.
