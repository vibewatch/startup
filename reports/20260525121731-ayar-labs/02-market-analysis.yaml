company:
  name: Ayar Labs
chapter:
  number: 2
  title: Market Analysis
  summary: 'Ayar Labs sells into a narrow but fast-opening slice of the broader AI-data-center optics market: co-packaged optical engines and optical I/O chiplets used to relieve bandwidth, latency, and power bottlenecks in scale-up fabrics. Public evidence supports a broad AI-cluster optics TAM above $10 billion by 2026, but the nearer CPO market lens is much smaller at roughly $1.2-$4.2 billion in 2026, with Ayar’s product-near optical-engine slice only a fraction of that headline pool. Demand is being pulled by hyperscaler AI capex, cluster power constraints, and rising inter-rack bandwidth needs, while adoption is still constrained by packaging maturity, switch-first deployment, and continued pluggable/LPO competition through at least 2026-2027.'
sections:
- id: market-boundary
  title: Market Boundary and Definition
  body: 'Ayar Labs does not participate in the entire data-center networking market; it participates in the narrower market for co-packaged optical engines and optical I/O chiplets that move data directly off accelerators, switches, and advanced packages using light rather than long electrical traces. The broad comparison set is the optics-for-AI-clusters market, which includes pluggable transceivers, linear-drive pluggables, active optical cables, switch-side co-packaged optics, and optical links used in both scale-out and scale-up networks. Ayar’s core product position is narrower still: TeraPHY optical I/O chiplets paired with the SuperNova remote laser source. That means headline optics TAM figures overstate Ayar’s direct revenue pool because much of the spend sits in transceiver modules, system-level switches, cabling, and transport gear that Ayar does not itself sell. The right market boundary therefore starts with optical-engine content embedded in packages and then expands outward
    to adjacent substitute spend in pluggables and LPO. This distinction matters because the buyer decision is not simply “buy optics”; it is “replace copper or pluggables with package-level optical I/O where bandwidth density, power, latency, and reach justify the integration cost.” Public Ayar materials consistently frame scale-up AI fabrics as the highest-value use case, while independent analyst sources show that pluggables, LPO, and DCI optics remain important adjacent and substitute markets rather than disappearing overnight.'
