- id: market-sizing
  title: Market Sizing — TAM, SAM, and a Product-Near SOM Proxy
  body: 'Public market-sizing lenses for Ayar Labs differ sharply because they measure different things. The broadest TAM lens is optics for AI clusters: LightCounting’s public summary says that market rises from about $5 billion in 2024 to more than $10 billion in 2026, and continues growing through 2030 as optical interconnects spread from scale-out into scale-up fabrics. A narrower SAM lens is the stand-alone co-packaged optics market. Here, public 2026 estimates already span more than 3x, with PW Consulting implying roughly $1.247 billion in 2026 after a $560 million 2025 base, while HDIN Research publishes a much broader $2.2-$4.2 billion 2026 range. The spread reflects boundary choices: module-only versus broader ecosystem value, switch-first deployments versus all CPO architectures, and differing assumptions about hyperscaler adoption timing. For Ayar, a still narrower product-near lens is more defensible than a classic corporate SOM forecast because public sources do not disclose
    Ayar’s pricing, design-win count, or committed volumes. Using PW Consulting’s own 2025 segmentation shares as a low-case proxy, the optical-engine slice serving AI/HPC workloads works out to roughly $0.43 billion in 2026. That is not an Ayar revenue forecast, but it is a more realistic public proxy for the part of the CPO stack closest to Ayar’s current product footprint than the full optics TAM.'
