- id: growth-drivers
  title: Growth Drivers and Adoption Timing
  body: 'The core demand driver is simple: AI clusters are getting larger, more power-constrained, and more communication-heavy. Ayar’s own generative-AI framing argues that inference already becomes a rack-scale problem, while fine-tuning and training extend into hundreds, thousands, and eventually tens of thousands of GPUs. Independent analyst work points in the same direction. Dell’Oro says the largest hyperscaler AI clusters are already approaching 100,000 accelerators and could reach one million in the near future, which makes interconnect design a first-order system problem rather than an afterthought. Power is the second major driver. The IEA now projects global data-center electricity demand to more than double by 2030, with AI-optimized data centers more than quadrupling their demand, while Dell’Oro highlights 600 kW-class future AI racks and cluster distribution across multiple facilities. Capital availability is the third driver: Alphabet’s and Meta’s latest filings show enormous
    continuing infrastructure spend, and Amazon’s filing continues to emphasize server and networking equipment within property and equipment investment. These forces all favor optical interconnect architectures that deliver more bandwidth per package and per watt. Standards and ecosystem progress also help: UCIe reduces integration friction at the package boundary, while CW-WDM standardization supports remote-light-source interoperability. Together, these trends create a credible multi-year adoption runway even if the exact slope remains uncertain.'
