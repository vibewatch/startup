  rows:
  - - AI-cluster optics TAM
    - Pluggable transceivers, LPO, CPO, active optical cables, and optical links used in AI compute-node and back-end fabrics
    - Electrical-only networking silicon, GPUs/CPUs, servers, power, cooling, real estate
    - Hyperscalers, neoclouds, switch OEMs, accelerator vendors
    - Useful headline TAM backdrop but materially broader than Ayar’s direct product scope
  - - CPO modules and switch-side optics
    - Co-packaged optical engines/modules integrated into Ethernet or InfiniBand switch platforms
    - Standalone pluggables, most long-haul telecom optics, non-AI transport hardware
    - Switch vendors and hyperscaler network architecture teams
    - Near-term commercial SAM because analyst sources expect CPO to ramp first on switches
  - - Optical I/O chiplets / in-package optical engines
    - Chiplet, retimer, and remote-light-source content co-packaged with accelerators or switches
    - Entire switch chassis, rack systems, external modules, general transport gear
    - Accelerator ASIC teams, advanced-packaging partners, hyperscaler silicon groups
    - Core Ayar market and closest product-near value pool
  - - Pluggable and linear-drive pluggable optics
    - 800G/1.6T pluggable optics and LPO used in AI clusters
    - Package-level optical chiplets and most internal package interconnect
    - Network platform teams and hyperscaler infra buyers
    - Primary substitute set that can delay Ayar adoption while still benefiting broader optics demand
  - - Scale-across / DCI optics
    - ZR/ZR+, coherent optics, WDM transport linking distributed AI campuses
    - Metro/long-haul carrier networks unrelated to AI workloads
    - Cloud network architects and transport teams
    - Important adjacency because distributed clusters expand optical budgets, but only partly monetizable by Ayar today
  notes: Rows intentionally separate broad AI-optics TAM from the narrower optical-engine market that is closest to Ayar. Included and excluded spend reflect what Ayar sells versus what only defines the substitute set or adjacent infrastructure budget.
