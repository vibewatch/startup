- id: TE003
  title: Integration, standards, and dependency table
  columns:
  - Layer / interface
  - Current public implementation
  - Roadmap / direction
  - Dependency
  - Technical risk
  rows:
  - - Electrical die-to-die interface
    - AIB in current public generation
    - Migration to UCIe-compatible optical retimers
    - Customer chiplet ecosystem and PHY interoperability
    - Equalization, validation burden, and standards timing
  - - Optical source interface
    - CW-WDM MSA source model with 8-wavelength current-gen references and 16-wavelength SuperNova product page
    - Higher-wavelength-count remote source roadmap
    - Laser-die suppliers and optical power budget
    - Shared-failure domains and insertion-loss management
  - - Packaging model
    - Multi-chip module / interposer / advanced package integration
    - 2.5D and 3D chiplet packaging support via UCIe 2.0+
    - Foundry, OSAT, and substrate partners
    - Yield loss and thermal coupling can erase performance gains
  - - Fiber attach
    - V-groove passive attach and connectorized chiplet flow
    - Known-good connectorized chiplets for HVM
    - Assembly process control and test coverage
    - Optical alignment tolerance and repair complexity
  - - System use case
    - AI scale-up first, remote memory second, rack fabrics emerging
    - Beyond-rack fabrics and multi-rack scale-up
    - Switch, memory-package, and rack-system partners
    - Software, topology, and service-model immaturity
  notes: Ayar’s differentiation depends on the full integration recipe; failure in any single layer can dominate package-level economics.
