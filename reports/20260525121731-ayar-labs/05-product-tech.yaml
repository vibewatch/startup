- id: ip-roadmap-and-trl
  title: IP moat, roadmap, and TRL
  body: 'The IP and maturity picture is stronger than that of a typical photonics startup because Ayar’s public trail links DARPA-funded academic roots, current patents, and fresh conference output. POEM and PIPES define the research lineage around WDM, low-energy photonic links, and package-level optical I/O. Current patent listings show Ayar protecting not only the base optical engine concept but adjacent architectures such as pooled memory, remote memory, and switch-oriented optical I/O chiplets. Recent technical publications cover both the UCIe optical retimer path and the packaging problem of making known-good connectorized chiplets. In TRL terms, Ayar looks beyond pure lab research but short of broad hyperscale deployment: credible at demo-plus-validation scale, credible enough for ecosystem co-design, but still dependent on customer qualification, yield learning, and supply-chain execution through 2027 and into 2028.'
