- id: architecture-and-integration
  title: Architecture and integration model
  body: The architecture is a chiplet-centric optical fabric. On the electrical side, the current public generation still uses AIB, while Ayar’s next-generation story is explicitly tied to UCIe and the broader multi-vendor chiplet ecosystem. On the optical side, the system depends on CW-WDM-style multi-wavelength sources and fiber attachment methods that can survive real packaging flows. Ayar’s own materials say UCIe plus optical I/O is what allows memory to move away from the compute package without surrendering bandwidth, while OCP and IEEE/OFC materials emphasize V-groove passive attach and known-good chiplet flows as the practical bridge from lab demonstrations to manufacturing. The important diligence takeaway is that Ayar’s differentiation is not only the photonics die; it is the full integration recipe across standards, package design, fiber attach, and external light sourcing.
