    severity: material
    topic: supply-chain-concentration
    missingEvidence: Detailed exposure to GF process capacity, laser-die suppliers, packaging houses, and second-source plans.
    whyItMatters: Ayar’s ecosystem strength is also a single-chain dependency risk if one foundry, laser, or assembly node slips.
    diligencePath: Request approved vendor list, dual-source roadmap, long-lead capacity reservations, and contingency plans for each critical node.
