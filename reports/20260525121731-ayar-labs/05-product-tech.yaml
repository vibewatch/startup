- id: performance-envelope-and-validation
  title: Performance envelope and validation status
  body: 'Ayar’s public performance story now spans three layers: current 2 Tbps-class public product descriptions, 4 Tbps-class scale-up examples, and 8 Tbps-class validation engines that are still moving through DVT/qualification. The headline advantages remain familiar—more bandwidth density, lower latency, lower power-per-bit, and longer reach than copper-heavy alternatives—but the more valuable signal is that Ayar now publishes validation details instead of only top-level marketing ratios. The 2024 validation post describes five-day UCIe link tests, optical margin results, thermal-cycling results, high transient-temperature emulation, and end-to-end UCIe-over-optics latency under 25 ns. That does not prove broad production maturity, but it does move the product from “science project” territory toward evidence of operability under package-like thermal and link conditions.'
