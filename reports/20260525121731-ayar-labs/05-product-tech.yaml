- id: technical-risks-and-diligence
  title: Technical risks and diligence priorities
  body: 'The hardest issues are no longer “can Ayar demonstrate optical I/O?” but “can customers service it, qualify it, and buy it at scale?” Adverse analyst coverage is useful here: LightCounting still expects LPO to land earlier than CPO, while Lightwave/CIR argues that non-hyperscale operators remain wary of yield, thermal behavior, repair models, and vendor lock-in. Ayar’s external-laser strategy helps on serviceability because the laser can be cooled and replaced outside the package, but it also concentrates failure domains and creates new insertion-loss and supply dependencies. Meanwhile, public disclosures still omit the numbers that matter most for underwriting—package yields, laser MTBF, priced SKUs, backlog, and named production deployments. The chapter therefore ends with a favorable technical direction but only medium conviction on near-term commercialization timing until those private diligence items are opened.'
