  rows:
  - - TeraPHY current optical I/O chiplet
    - GPU / CPU / ASIC package-to-package or package-to-rack I/O
    - Current public generation; roughly 2 Tbps-class bidirectional, AIB today and UCIe next
    - Chiplet form factor with millimeter-to-kilometer optical reach
    - Paid SKU structure, ASP, and shipped-unit counts are undisclosed
  - - TeraPHY next-gen optical retimer
    - AI scale-up fabrics and package-to-package optical links
    - 2025 OFC / validation stage; 8.192 Tbps aggregate paper result and 8 Tbps validation blog
    - First UCIe optical retimer claim and 16-wavelength microring links
    - Need customer qualification, yield, and tape-out evidence
  - - SuperNova remote light source
    - Shared laser source feeding many chiplets and ports
    - Product page live; 16 wavelengths / 16 ports / 256 channels / 16 Tbps bidirectional
    - External, field-replaceable, CW-WDM MSA-compliant laser source
    - Need MTBF, replacement cost, and module BOM detail
  - - Connectorized V-groove package option
    - Assembly / test flow for high-volume packages
    - 2025 IEEE/OFC packaging paper
    - Passive fiber attach plus known-good connectorized chiplet flow
    - No public assembly yield, insertion-loss, or rework metrics
  - - Rack-scale Wiwynn / ELSFP reference system
    - Hyperscale AI rack integration and thermal management
    - OFC 2026 demo / production-ready marketing
    - Moves Ayar from component demos to rack-level liquid-cooled architecture
    - No public named production deployment or run-rate volume data
  notes: Ayar’s public stack is still narrow but vertically integrated around the optical engine plus remote laser pair; most deployment proof is ecosystem-led rather than customer-general-availability led.
