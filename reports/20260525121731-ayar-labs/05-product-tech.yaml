chapter:
  number: 5
  title: Product & Technology
  summary: Ayar Labs is commercializing a tightly coupled optical I/O stack—TeraPHY chiplets plus the SuperNova remote light source—that is technically credible at demo and qualification scale and strategically aligned to AI scale-up and remote-memory architectures. Public materials support a current 2 Tbps-class product profile, 4–8 Tbps next-generation optical-engine proofs, monolithic 45 nm silicon-photonics manufacturing, and real ecosystem traction with HPE, NVIDIA, Wiwynn, Intel, and Alchip/TSMC packaging flows. The unresolved questions are not whether the links work in the lab, but whether Ayar can deliver package yield, serviceability, laser reliability, and customer qualification fast enough for high-volume ramps.
sections:
- id: product-portfolio-and-customer-job
  title: Product portfolio and customer job
  body: 'Ayar’s product line is unusually concentrated: the company sells a two-part optical I/O stack rather than a broad menu of optics modules. TeraPHY is the in-package optical I/O chiplet that sits next to compute silicon, while SuperNova is the remote multi-wavelength laser source that feeds those chiplets over fiber. In customer-workflow terms, the pair is meant to replace the power-hungry electrical and pluggable-optics links that bottleneck scale-up AI systems, then later extend into pooled memory and other composable architectures. Public materials consistently position AI scale-up as the first commercial landing zone and remote or disaggregated memory as the second. That makes Ayar look less like a general-purpose optics vendor and more like a component supplier for future xPU package and rack fabrics.'
