- id: manufacturing-process-and-ecosystem
  title: Manufacturing process and ecosystem
  body: 'Manufacturing is one of the strongest parts of Ayar’s public narrative. The company has long tied TeraPHY to GlobalFoundries’ monolithic silicon-photonics process, and external technical sources reinforce that GF Fotonix / 45SPCLO is built to combine electronics and photonics on a single 45 nm SOI platform with packaging features such as fiber-attach support. Just as important, Ayar has assembled a visible ecosystem around that process: HPE for future Slingshot fabrics, NVIDIA for AI interconnect development, Wiwynn for rack-scale system framing, and Alchip/TSMC-oriented reference designs for advanced AI sockets. This ecosystem is a major credibility asset, but it is also a dependency map. Ayar is not selling a drop-in pluggable module; it is asking customers to trust a stack that spans foundry process, package assembly, laser sourcing, interoperability standards, and systems integrators.'
