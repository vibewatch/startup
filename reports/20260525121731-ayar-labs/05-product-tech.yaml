  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-pricing-and-asp
    missingEvidence: Public SKU list, per-chiplet ASPs, SuperNova pricing, and sample-to-volume commercial terms.
    whyItMatters: Without priced SKUs and commercial terms, the product story cannot be converted into contribution-margin or adoption-friction analysis.
    diligencePath: Request current price book, customer quote decks, and sample-to-volume conversion terms by product family.
    relatedQuestionRefs:
    - QE001
    - QE020
    - QE025
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: field-reliability-and-mtbf
    missingEvidence: Package-level field MTBF, SuperNova replacement rates, and full GR-468 / lifetime qualification reports.
    whyItMatters: Ayar’s architecture only becomes financeable if the external laser and in-package optics stay reliable at real deployment duty cycles.
    diligencePath: Request qualification reports, HALT/HASS data, return-rate history, and laser-source field-failure data.
    relatedQuestionRefs:
    - QE011
    - QE022
    - QE025
    relatedTableRefs:
    - TE002
    - TE003
  - type: private-evidence-only
    severity: material
    topic: packaging-yield-and-known-good-economics
    missingEvidence: Known-good-chiplet yield, optical-assembly scrap rate, insertion-loss distribution, and package rework economics.
    whyItMatters: Co-packaged optics often fails commercially on package yield and rework cost before it fails on bandwidth.
    diligencePath: Request yield dashboards by package step, assembly SPC, and sensitivity analysis for yield loss versus final module gross margin.
    relatedQuestionRefs:
    - QE006
    - QE015
    - QE021
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
  - type: private-evidence-only
    severity: material
    topic: customer-qualification-and-backlog
    missingEvidence: Named customer qualification status, design-win funnel, backlog, and deployment counts by 2026–2028 program.
    whyItMatters: Public milestones show technical progress, but commercialization timing depends on who is qualified, who is sampling, and who is actually ordering.
    diligencePath: Request customer program tracker, qualification milestones, backlog by quarter, and forecast-to-ship conversion history.
    relatedQuestionRefs:
    - QE010
    - QE016
    - QE020
    - QE023
    - QE025
    relatedTableRefs:
