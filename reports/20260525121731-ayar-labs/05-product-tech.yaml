- id: TE002
  title: Public performance comparison versus electrical interconnects
  columns:
  - Metric
  - Ayar optical I/O
  - Electrical SerDes / pluggables
  - Public advantage
  - Caveat
  rows:
  - - Bandwidth density
    - 5x–10x higher per Ayar marketing; 2 Tbps-class current chiplet, 4–8 Tbps next-gen demos
    - Copper / pluggable architectures consume board edge and retimers quickly at long reach
    - More usable off-package bandwidth in the same package budget
    - Ratios are company-claimed and not apples-to-apples across all workloads
  - - Energy per bit
    - <5 pJ/bit in SC23-class public demos; 4x–8x efficiency claim
    - Traditional long-reach electrical and pluggable paths are typically far higher at comparable reach
    - Lower I/O power is central to AI scale-up economics
    - Ayar does not publish full system-level power breakdowns or cooling overhead
  - - Latency
    - About 5 ns per chiplet + TOF in product claims; <25 ns end-to-end in validation
    - Electrical links above 50 Gbps often need FEC and accumulate serialization / retimer delay
    - Optics preserves lower package-to-package latency
    - Public data are mostly lab and demo configurations
  - - Reach
    - Millimeters to 2 km in public materials
    - Copper generally falls from inches on package/board to meters in cable form
    - One architecture can span die, board, rack, and remote memory distances
    - Long reach still depends on laser budget, optical margin, and packaging quality
  - - Service model
    - External remote laser can be replaced outside the package
    - Pluggables remain easiest to replace; pure CPO engines are harder to service
    - Ayar keeps some pluggability by externalizing the laser
    - A failed remote source can affect many channels at once
  notes: The comparison mixes company claims, validation results, and analyst observations; it should be read as directional rather than as a uniform benchmark suite.
