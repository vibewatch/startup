  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A full customer roster with deployment stage, segment, and revenue significance for each named account.
      whyItMatters: Publicly named counterparties are only a partial subset of Ayar's real account base, so concentration and commercial maturity cannot be measured from the public record alone.
      diligencePath: Request a board-approved customer list showing sampling, design-in, pilot, and production accounts plus the top ten accounts by revenue and expected 2026 volume.
      relatedQuestionRefs:
        - QU001
        - QU018
      relatedTableRefs:
        - TU002
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Current price bands for TeraPHY chiplets, SuperNova light sources, and any system-level pricing assumptions at prototype versus volume scale.
      whyItMatters: Without pricing or ASP evidence, it is impossible to translate technical demand into customer willingness to buy or to estimate gross-margin potential.
      diligencePath: Request current price lists, volume breakpoints, and sample quotes by product generation, together with any customer ROI or TCO models used in sales.
      relatedQuestionRefs:
        - QU019
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: NRR, GRR, churn, renewal rates, contract duration, and repeat-order history for customer cohorts.
      whyItMatters: The chapter can show strong design-in interest, but it cannot prove whether early customers expand, stay, or quietly fall out of the funnel.
      diligencePath: Request cohort tables for sampling, pilot, and production customers showing renewal and conversion from 2022 through 2026.
      relatedQuestionRefs:
        - QU020
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-customer revenue share, investor-customer share of bookings, and share of revenue tied to government or defense programs.
      whyItMatters: Public evidence is concentrated in a small set of strategic counterparties, creating a real risk that diversification is overstated.
      diligencePath: Request a concentration schedule listing top five accounts, associated investors, government-linked revenue, and any single-source dependency thresholds used by management.
      relatedQuestionRefs:
        - QU021
        - QU022
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: minor
      topic: national-lab-deployments
      missingEvidence: A named DOE or national-lab deployment, pilot, or technical paper tying Ayar directly to a lab program such as LLNL, ORNL, or Sandia.
      whyItMatters: The public story strongly suggests HPC relevance, but the absence of a named lab user keeps that channel indirect.
      diligencePath: Search conference proceedings and customer references for named lab deployments, or ask management for lab-specific pilots and funded projects.
      relatedQuestionRefs:
        - QU012
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: hyperscaler-pipeline
      missingEvidence: Named design wins, trials, purchase commitments, or production ramps from cloud builders and hyperscalers.
      whyItMatters: The valuation case depends heavily on hyperscale adoption, yet the public record stops at route-to-market partners and private briefings.
      diligencePath: Request a pipeline by named account showing stage, expected qualification date, and whether the buyer is a direct cloud operator or an intermediary system vendor.
      relatedQuestionRefs:
        - QU013
        - QU014
    - type: missing-source
      severity: minor
      topic: quantum-customers
      missingEvidence: A public quantum-computing customer announcement, named sampling cohort, or explicit statement that no such public customers exist.
      whyItMatters: Quantum is often discussed as an adjacent use case, but there is no retained public proof that it contributes to current customer traction.
      diligencePath: Search Ayar's newer announcements and technical conference talks for named quantum pilots, or ask management directly whether any quantum accounts are active.
      relatedQuestionRefs:
        - QU025
