company:
  name: Ayar Labs

chapter:
  number: 6
  title: Customers
  summary: >-
    Ayar Labs' public customer proof remains partnership-led and pre-commercial: the clearest named
    counterparties are HPE, Intel, NVIDIA, GlobalFoundries, Lockheed Martin, and 2025-2026
    route-to-market partners GUC, Alchip, and Wiwynn, while DARPA-backed PIPES/POEM provide the
    strongest government validation. The company disclosed first volume commercial shipments under
    contract in 2022 and has since advanced to a 4 Tbps Intel FPGA demo, >100 Tbps hyperscaler-route
    package concepts, and rack-scale Wiwynn previews, but it still does not publish customer counts,
    pricing, retention, or top-account concentration. Independent sources caution that strategic
    investments and design partnerships should not be confused with production hyperscaler deployments,
    so the bottom line is strong ecosystem pull but limited public proof of durable commercial adoption.

sections:
  - id: SU001
    title: Customer profile and ideal-customer segments
    body: >-
      Ayar Labs' public customer map is unusual because it is still closer to a design-in ecosystem than
      to a mature booked-revenue account list. The company positions its optical I/O around AI training
      and inference infrastructure, where the direct "buyer" is often an ASIC, GPU, networking, or
      rack-level architecture team rather than a conventional purchasing department. The named public
      counterparties therefore mix several roles: DARPA and defense programs as validation funders;
      HPE, NVIDIA, Intel, GlobalFoundries, and Lockheed Martin as strategic collaborators and investors;
      and GUC, Alchip, and Wiwynn as route-to-market enablers for unnamed hyperscaler or cloud buyers.
      Ayar's own 2024 financing release said the company was aligning high-volume manufacturing to
      customer roadmaps and had exciting engagements with Tier 1 customers, but it still did not name
      those accounts or disclose how many are paying versus evaluating. That means the core underwriting
      judgment for this chapter is not whether customer interest exists—it clearly does—but whether the
      public evidence proves repeatable production deployment. Today it does not.
    claimRefs:
      - CU001
      - CU002
      - CU025
      - CU026
      - CU036
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: SU002
    title: Named public counterparties and proof quality
    body: >-
      The most credible named public proof points are collaborations that tie Ayar's chiplets to a real
      system context. HPE is the clearest OEM/channel partner because the companies announced a
      multi-year collaboration around future Slingshot generations and joint customer engagements.
      Intel is the clearest technical-validation partner because Ayar and Intel worked together under
      DARPA PIPES and later showed a 4 Tbps optically enabled FPGA at Supercomputing 2023. Lockheed
      Martin is the clearest defense-side integrator because it both invested and announced a sensory
      systems collaboration tied to DoD applications. GlobalFoundries is less a "customer" than a vital
      manufacturing anchor, but its willingness to invest and publicly co-develop around in-package
      customer ASICs is still meaningful customer-readiness evidence. NVIDIA's role is powerful but more
      ambiguous: the company collaborates on future AI architectures and has invested twice, yet the
      public record still stops short of a named deployment. Across all of these cases, the proof is
      stronger than a logo wall but weaker than a disclosed recurring production contract.
    claimRefs:
      - CU003
      - CU004
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
      - CU015
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: SU003
    title: Government and defense channel
    body: >-
      Government and defense are the oldest and most concretely documented customer-adjacent channels in
      Ayar's public record. DARPA's POEM and PERFECT programs define the performance and power problems
      Ayar's founders were originally solving, while PIPES provides the clearest formal bridge from
      research lineage into packaged optical I/O with Intel. DARPA's own PIPES page explicitly frames the
      technology as relevant to both specialty DoD products and dual-use CPUs, GPUs, AI, and HPC systems.
      Lockheed Martin then extends that lineage into an applied defense use case by positioning Ayar's
      optical I/O for next-generation sensory systems and DoD spectral-processing workloads. HPE adds an
      adjacent public HPC channel by tying the Slingshot collaboration to future DOE exascale systems.
      What remains missing is equally important: no reviewed source named an LLNL, ORNL, Sandia, or other
      national-lab deployment, and no public contract values were given for any defense or government
      relationship. This channel is therefore real and strategically important, but still more validation
      anchor than transparent revenue base.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
    tableRefs:
      - TU003
    figureRefs: []

  - id: SU004
    title: Hyperscaler route-to-market and adoption trajectory
    body: >-
      The 2025-2026 partnership wave shows Ayar moving from component proof into the supply-chain layers
      that hyperscalers actually buy through. GUC gives Ayar an ASIC-design-services path into future
      hyperscaler XPUs; Alchip gives it an advanced-packaging and TSMC-aligned path into tier-1 AI
      accelerators; Wiwynn brings the company closest to a deployable cloud-system context with rack-scale
      infrastructure and private customer briefings at OFC 2026. Collectively, those announcements imply
      that Ayar's near-term go-to-market is not direct sale to Microsoft, Google, Meta, or AWS under its
      own name, but rather insertion into the packaging, ASIC, and rack vendors that serve them. That is
      commercially sensible for a chiplet company, yet it also means the headline question—who has really
      committed to buying at volume—remains unanswered in public. The adoption trajectory is visible; the
      customer list at the end of that trajectory is not.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU027
      - CU037
    tableRefs:
      - TU004
    figureRefs:
      - FU003

  - id: SU005
    title: Partnership economics, durability, and concentration
    body: >-
      The main commercial weakness in Ayar's public customer evidence is not lack of interest, but lack of
      economic disclosure. There is no public pricing for TeraPHY or SuperNova, no disclosed NRR, GRR,
      churn, or renewal data, no customer-count denominator, and no top-customer share of revenue.
      Publicly named proof is also concentrated in a small set of strategic investors and government-linked
      channels, which creates a real risk of overstating diversification. Next Platform explicitly warned
      readers not to infer production deployment from NVIDIA, AMD, or Intel investing, and separately said
      that silicon photonics still had very little presence in production systems because buyers remained
      concerned about volume economics and reliability. LightCounting's SC23 commentary points in a similar
      direction: Ayar's demo was notable, but Nvidia's own NVLink networks were still non-optical. Ayar's
      own 2026 webinar likewise acknowledges that manufacturing flows, packaging, and supply-chain
      readiness still have to mature through 2026-2028. In other words, the public customer set is
      strategically impressive but commercially under-specified.
    claimRefs:
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU036
    tableRefs:
      - TU005
    figureRefs:
      - FU004

  - id: SU006
    title: Evidence quality verdict
    body: >-
      The chapter's evidence quality is best described as "strong on ecosystem validation, weak on closed
      commercial proof." What can be underwritten with confidence is that Ayar has serious engagement from
      top-tier counterparties across compute, packaging, defense, and rack integration; that the company has
      moved well beyond concept-only science into integrated demos, validation tests, and selective customer
      previews; and that public funding and partner support are aligned around the same core problem of
      moving data farther and faster than copper allows. What cannot yet be underwritten is customer-scale
      durability: public sources do not show named hyperscaler purchase commitments, production-volume unit
      counts, pricing bands, concentration schedules, or retention metrics. Reviewed sources also failed to
      surface a public quantum-computing customer announcement despite the company being adjacent to that
      theme in broader industry discussion. Investors should therefore treat Ayar as a high-quality design-in
      story whose commercial conversion is plausible but not yet publicly transparent.
    claimRefs:
      - CU031
      - CU032
      - CU034
      - CU035
      - CU036
      - CU038
    tableRefs: []
    figureRefs: []

callouts:
  - calloutType: strength
    title: Public proof is better than a logo wall
    body: >-
      Ayar's named counterparties are not passive logos: HPE tied the company to future Slingshot customer
      engagements, Intel co-developed packaged optical demos under DARPA PIPES, Lockheed announced a DoD
      sensory-systems use case, and Wiwynn moved the story into rack-scale AI infrastructure.
    claimRefs:
      - CU006
      - CU010
      - CU015
      - CU023

  - calloutType: risk
    title: Investor overlap can exaggerate customer diversification
    body: >-
      NVIDIA, Intel, HPE, GlobalFoundries, and Lockheed all strengthen Ayar's public ecosystem story, but
      independent reporting warns that investment and collaboration do not prove those firms have committed to
      production deployment or meaningful purchase volumes.
    claimRefs:
      - CU009
      - CU031
      - CU032
      - CU036

  - calloutType: insight
    title: DARPA and defense remain the clearest anchor channel
    body: >-
      Ayar's strongest publicly documented payer-validation lineage runs from POEM and PERFECT into PIPES
      and then into Lockheed/DoD use cases, which helps explain why defense and HPC are easier to evidence
      than direct hyperscaler procurement.
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU019

