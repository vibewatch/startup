- id: TV008
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Exact post-money and preference stack
    - No public post-money figure, liquidation preference schedule, or anti-dilution terms
    - Return math can diverge sharply from the headline unicorn mark
    - Request term sheet summary or cap-table view under NDA.
  - - Current revenue and shipment scale
    - No public revenue, ARR, or shipment value disclosure
    - Without it, revenue-multiple valuation and cash-burn assessment are impossible
    - Ask for trailing revenue, booked backlog, and shipment run rate.
  - - Customer conversion evidence
    - Strategic and Tier-1 engagement language is public, but named production programs are not
    - The gap between design engagement and scaled deployment drives valuation timing
    - Ask for customer stage map, production timing, and attach rates.
  - - Unit economics
    - No public gross margin, module cost, or system-level savings disclosure
    - Premium valuation depends on economics, not just technical merit
    - Request product gross margin bridge and customer ROI data.
  - - Manufacturing readiness
    - Public sources show readiness claims, but not audited yield or capacity utilization data
    - Scaling risk remains central to the difference between a fair mark and a stretched one
    - Request manufacturing KPIs, yield trajectory, and qualification milestones.
  notes: These are the minimum diligence items required before turning a watchlist position into an underwritten
    premium entry.
