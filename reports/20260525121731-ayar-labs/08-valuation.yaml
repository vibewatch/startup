- id: private-peer-benchmarks
  title: Private photonics peers define the upside context
  body: 'The cleanest private peer signals say Ayar is not being valued as the category leader today.
    Lightmatter''s October 2024 Series D set a $4.4 billion mark on $400 million of new capital and $850
    million of total funding. Celestial AI''s March 2025 Series C1 raised $250 million, pushed cumulative
    funding above $515 million, and lifted valuation above $2.5 billion. Even at the lower end of the
    category, Scintil Photonics sat near a $133.6 million valuation after an August 2025 later-stage round.
    Put differently, the private optical-infrastructure market already spans from sub-$200 million specialist
    assets to multi-billion-dollar AI-photonics platforms. Ayar''s own placement just above $1 billion
    therefore reads as meaningful but still discounted relative to the most aggressively capitalized photonics
    names. That discount is understandable: Ayar has strategic investors, early shipment history, and
    strong product claims, but public evidence still does not show the broad commercial conversion or
    financial disclosure that would justify paying up to Lightmatter- or Celestial-like levels.'
  claimRefs:
  - CV018
  - CV019
