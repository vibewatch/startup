  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact post-money and preference stack
    missingEvidence: The precise Series D post-money valuation, liquidation preferences, participation
      terms, and anti-dilution protections are not public.
    whyItMatters: Ayar can look fair on a headline basis and still be stretched on actual investor returns
      if the capital stack is senior-heavy or highly structured.
    diligencePath: Request a cap-table summary or term-sheet extract under NDA from management or lead
      investors.
    relatedQuestionRefs:
    - QV002
    - QV022
  - type: private-evidence-only
    severity: blocking
    topic: revenue and unit economics
    missingEvidence: No public revenue, backlog, ARR, gross margin, or shipment-value disclosure was found
      in reviewed sources.
    whyItMatters: Without commercial financial data, no conventional revenue or contribution-margin valuation
      framework can be defended from public evidence alone.
    diligencePath: Obtain current revenue run rate, shipment volumes, customer concentration, and gross
      margin bridge directly from the company.
    relatedQuestionRefs:
    - QV010
  - type: enumeration-incomplete
    severity: material
    topic: clean comparable universe
    missingEvidence: The public and private comp set for optical interconnects is sparse and mixes direct
      peers, diversified platforms, distress outcomes, and strategic tuck-ins.
    whyItMatters: A thin comp set can overstate confidence in any single multiple or transaction read-through.
    diligencePath: Expand the comp set with banker materials, private-market databases, and confidential
      deal comparables before anchoring on a premium multiple.
    relatedTableRefs:
    - TV003
    - TV004
    - TV005
  - type: missing-source
    severity: material
    topic: design-win conversion and production scale
    missingEvidence: Public sources describe Tier-1 engagement and product readiness, but not named production
      customers, attach rates, or audited manufacturing KPIs.
    whyItMatters: The gap between strategic engagement and repeat production deployment is the key variable
      separating the bull case from the base case.
    diligencePath: Ask for a customer stage map, current production qualifications, yield trajectory,
      and package-level deployment roadmap.
    relatedQuestionRefs:
    - QV023
    - QV029
