- id: TV006
  title: Bull, base, and bear valuation scenarios
  columns:
  - Scenario
  - Assumptions
  - Implied valuation range (USD M)
  - Probability signal
  - Decision implication
  rows:
  - - Bull
    - Ayar converts strategic relationships into broader production design wins, analyst skepticism on
      CPO timing eases, and commercial scale becomes externally visible.
    - 1500-2200
    - Requires a material shift in deployment evidence during 2026-2027.
    - Would support paying above the last-round mark if supported by real customer and economics data.
  - - Base
    - Strategic syndicate remains supportive, product readiness continues, and no major negative commercialization
      surprise emerges, but revenue disclosure still stays limited.
    - 900-1300
    - Best fit with current evidence.
    - Supports a hold/track posture around last-round parity, not aggressive markup.
  - - Bear
    - CPO adoption remains slower than expected, bridge technologies dominate longer, or the next financing
      clears below the current mark with heavy preference overhang.
    - 500-800
    - Risk rises if public deployment evidence remains sparse into 2027.
    - Would imply the last round was stretched and that downside protection matters more than optionality.
  notes: All ranges are judgmental public-market scenarios expressed in USD millions. They are deliberately
    broad because Ayar provides no revenue or margin base for a tighter model.
