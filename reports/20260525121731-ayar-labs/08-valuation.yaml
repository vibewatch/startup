- id: m-and-a-precedents
  title: M&A precedents show strategic appetite, but scale still dominates price
  body: 'Optical interconnect and photonics M&A precedent is supportive, but only if one remembers how
    wide the range is. Cisco paid roughly $4.5 billion in cash for Acacia in 2021 to reinforce coherent
    optics inside its Internet-for-the-Future strategy. Marvell agreed to buy Inphi in a $10 billion cash-and-stock
    deal to deepen its data-center and 5G optical connectivity footprint. More recently, Ciena agreed
    to acquire Nubis Communications for $270 million in cash to strengthen its inside-the-data-center
    strategy for AI workloads, while II-VI completed its combination with Coherent using a large cash-and-stock
    structure. The common thread is clear: strategic buyers will pay materially for optical assets that
    solve bandwidth, latency, or packaging bottlenecks inside critical infrastructure. But the price dispersion
    is equally clear: the market pays very differently for scaled, revenue-bearing, platform-like assets
    than it does for narrower capability tuck-ins. Ayar belongs in that strategic conversation, but today''s
    public evidence cannot yet place it at the Acacia or Inphi end of the range with conviction.'
  claimRefs:
  - CV030
  - CV031
  - CV032
  - CV033
  - CV042
  tableRefs:
  - TV005
- id: scenario-range
  title: Scenario range centers near the last round because the debate is about timing, not technology
    alone
  body: The valuation range is best framed around timing and commercialization confidence rather than
    around a revenue multiple. In the bull case, Ayar can plausibly move materially above the last-round
    floor if optical I/O converts strategic relationships into visible design wins, if customer roadmaps
    translate into broader production deployment, and if analyst skepticism about CPO timing starts to
    collapse. In the base case, the company remains close to its last-round mark because the strategic
    syndicate is high quality and the category remains important, but the public evidence still cannot
    show revenue, unit economics, or cap-table clarity. In the bear case, the mark compresses below the
    last round if CPO deployment remains slower than expected, if optics buyers stick with bridge technologies
    longer, or if the next financing reveals investor-unfriendly terms or a need to clear the market at
    a discount. The scenario spread therefore reflects commercialization timing, strategic optionality,
    and disclosure quality more than a traditional financial model.
  claimRefs:
  - CV034
