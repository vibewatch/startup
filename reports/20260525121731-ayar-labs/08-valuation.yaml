company:
  name: Ayar Labs
chapter:
  number: 8
  title: Valuation
  summary: 'Ayar Labs'' December 2024 Series D is the only reliable public price-setting event: $155 million
    raised at a valuation above $1 billion with a strategically exceptional cap table. Private peer marks
    such as Lightmatter''s $4.4 billion and Celestial AI''s $2.5 billion show upside optionality for optical-interconnect
    leaders, but public and analyst evidence still argues for discipline because Ayar discloses no revenue
    or preference stack and the co-packaged-optics adoption curve remains early.'
sections:
- id: last-round-anchor
  title: Last-round mark is the anchor, not a full valuation proof
  body: 'Ayar Labs'' December 2024 Series D is the only hard public pricing event in the current capital
    stack, so it deserves primacy over every other lens. The round raised $155 million, brought disclosed
    lifetime funding to roughly $370 million, and explicitly took the company above a $1 billion valuation.
    It also came with unusually strong strategic sponsorship: AMD Ventures, Intel Capital, NVIDIA, 3M
    Ventures, and Autopilot joined Advent Global Opportunities, Light Street Capital, and an existing
    syndicate that already included GlobalFoundries, Lockheed Martin Ventures, Playground Global, Boardman
    Bay, and Applied Ventures. That cap table matters because it indicates multiple semiconductor, systems,
    and defense actors believe Ayar''s optical I/O stack could become strategically important inside AI
    infrastructure. But the same evidence set also exposes the core underwriting limit: no exact post-money
    valuation, no published revenue, no gross margin, and no public preference stack. In other words,
    the last round is a reliable mark, but not a sufficient proof of fair value on its own.'
