  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Cisco overlap
    missingEvidence: A current Cisco or Acacia source that explicitly details a production CPO roadmap for in-package compute or switch optical I/O.
    whyItMatters: Current retained Cisco evidence is stronger on optics portfolio and AI scale-out than on a direct Ayar-style package roadmap, which keeps Cisco in the adjacent rather than direct bucket.
    diligencePath: Review Cisco OFC 2026 materials or Acacia product announcements for explicit CPO package-integration milestones and named deployments.
    relatedQuestionRefs:
    - QP008
  - type: private-evidence-only
    severity: material
    topic: private startup pricing
    missingEvidence: Normalized pricing, unit-volume and gross-margin disclosures for Ayar, Lightmatter, Celestial AI and Ranovus products.
    whyItMatters: Without price and shipment transparency, capital raised is only a rough proxy for competitive staying power and does not prove cost competitiveness.
    diligencePath: Request customer or partner pricing sheets, paid analyst reports, or procurement disclosures that benchmark optical-engine ASPs and deployment volumes.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: missing-source
    severity: material
    topic: named production wins
    missingEvidence: Named hyperscaler, XPU or switch production wins for Ayar and the closest private peers beyond general traction language.
    whyItMatters: Design-win specificity is the strongest external proof of switching costs and real commercial momentum in a market that is still pre-volume for many vendors.
    diligencePath: Review partner press releases, hyperscaler conference talks, and procurement disclosures for named production deployments rather than validation language.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: moat durability
    missingEvidence: Independent evidence on whether Ayar's package-depth lead is materially harder to replicate than Intel, Marvell, NVIDIA or Broadcom alternatives.
    whyItMatters: The investment case depends on Ayar owning a durable optical-I/O wedge rather than simply pioneering a feature incumbents can absorb.
    diligencePath: Interview packaging partners, foundries, or paid analyst sources on qualification cycles, IP defensibility, and replication difficulty for external-laser CPO architectures.
    relatedQuestionRefs:
    - QP021
