callouts:
- calloutType: strength
  title: Ayar is deepest where optics move inside the package
  body: |-
    Ayar's strongest differentiation remains package-depth. Most rivals either stop at pluggables, stop at NPO, or pair their package-level story with a broader platform roadmap. Ayar is most advantaged when a customer decides the package boundary itself is the bottleneck and still wants a serviceable external light source.
  claimRefs:
  - CP001
  - CP002
  - CP040
  - CP048
- calloutType: risk
  title: NVIDIA can disintermediate merchant optics vendors at the switch tier
  body: |-
    Spectrum-X Photonics shows that a strategic platform owner can internalize silicon photonics and CPO directly into the switch layer. That does not eliminate Ayar's compute-package opportunity, but it reduces the chance that the switch tier remains open to an independent merchant optical-I/O supplier.
  claimRefs:
  - CP006
  - CP007
  - CP042
- calloutType: risk
  title: LPO and advanced pluggables can delay the architectural jump Ayar needs
  body: |-
    Analyst and trade sources do not expect an overnight CPO transition. If operators can retain hot-swap pluggables or adopt LPO for another design cycle, Ayar may face a longer qualification path and a smaller near-term serviceable market than its technical positioning implies.
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP041
- calloutType: insight
  title: Consolidation is tilting the market toward capitalized platforms
  body: |-
    Celestial AI's planned sale to Marvell and Rockley's earlier restructuring both suggest that advanced silicon-photonics assets are valuable, but not always durable as standalone companies. Ayar can benefit from this scarcity if it executes, yet the same pattern means incumbent buyers are likely to own more of the optical stack over time.
