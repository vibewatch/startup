- id: public-incumbents-and-platform-vendors
  title: Public Incumbents and Platform Vendors
  body: |-
    The strongest competitive pressure comes from public incumbents because each attacks a different layer of Ayar's value proposition. Broadcom is the clearest switch-layer benchmark: by late 2025 it was presenting one million Meta-tested link hours without a flap on 400G-equivalent CPO ports and claiming 65% lower optics power than pluggables, which moves CPO from concept to production-readiness. Marvell is taking a more compute-centric route, extending its custom XPU platform with co-packaged optics and arguing that integrated photonics can connect hundreds of XPUs across multiple racks. Intel is dangerous for a different reason: its OCI chiplet also targets co-packaged optical I/O but integrates lasers directly on the chiplet rather than using Ayar's external-laser model.

    Cisco/Acacia, Coherent and Lumentum are less like-for-like on in-package optical I/O, but they matter because they already own customer relationships, optics manufacturing, and roadmaps that can be redirected toward the highest-value optical layers. Acacia explicitly markets AI scale-out optics and 3D siliconization. Coherent and Lumentum supply the lasers, modules and optical subsystems that many AI fabrics still need even when the most advanced nodes migrate toward CPO. SEC filing cadence across Broadcom, Marvell, Cisco, Coherent, Lumentum and Intel is a reminder that Ayar is competing against vendors with audited public-company resources, not just startups.
