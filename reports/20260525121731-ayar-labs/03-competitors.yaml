- id: TP005
  title: Moat Durability and Threat Scoring
  columns:
  - Threat / moat issue
  - Evidence
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Package-depth differentiation
    - Ayar integrates optical I/O directly into package flows already used by major XPU and switch vendors
    - Medium positive
    - This is Ayar's clearest technical moat versus pluggables and many NPO rivals
    - Which customers have qualified TeraPHY in production package designs?
  - - External-laser serviceability
    - Ayar remote light source and Ciena/Nubis external-light-source messaging preserve some serviceability advantages
    - Medium positive
    - Serviceable lasers can reduce one of the main objections to CPO
    - How often must external lasers be replaced and by whom?
  - - NVIDIA switch-tier internalization
    - Spectrum-X Photonics brings in-house silicon photonics and CPO to Ethernet switching in 2026
    - High negative
    - Switch OEMs can bypass merchant optical-I/O vendors at the fabric layer
    - Does Ayar still control any differentiated layer if switch customers internalize optics?
  - - Incumbent balance-sheet pressure
    - Broadcom, Marvell, Cisco, Intel, Coherent and Lumentum all operate from public-company balance sheets
    - High negative
    - Incumbents can fund longer qualification cycles and survive slower adoption
    - What cash and partner commitments let Ayar outlast a delayed CPO ramp?
  - - LPO and pluggable persistence
    - Analyst sources expect LPO to ramp before high-volume CPO and pluggables to remain dominant on many links
    - High negative
    - A slower architectural transition stretches Ayar's sales cycle and can shrink early TAM
    - Which AI links already fail on power or density badly enough to force in-package optics now?
  - - Sector capital-market skepticism
    - Rockley restructured through Chapter 11 and later sold core silicon-photonics IP
    - Medium negative
    - Pure-play photonics companies can lose financing before scale economics arrive
    - How much of Ayar's roadmap is funded to volume production without another large round?
  notes: Severity labels are author judgments based on reviewed evidence and are meant to prioritize diligence rather than imply a probabilistic forecast.
