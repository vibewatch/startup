- id: private-cpo-startups-and-adjacent-challengers
  title: Private CPO Startups and Adjacent Challengers
  body: |-
    Among private challengers, Lightmatter and Celestial AI are the two most comparable strategic threats because both are selling optical scale-up narratives to the same hyperscaler and accelerator audience that Ayar wants. Lightmatter's roadmap spans NPO, OBO, 2D CPO, 3D CPO and 3D interposers, with Passage products ranging from 12.8 Tbps to 32–64 Tbps-class systems. Its homepage discloses $850 million of cumulative funding and a $4.4 billion valuation, which gives it more capital than Ayar and lets it sell a broader interconnect platform rather than one chiplet-plus-laser pair. Celestial AI is similarly well capitalized at $515 million raised and pushes Photonic Fabric from package to rack level; Marvell's planned acquisition suggests that hyperscaler optical scale-up startups are already valuable enough to be absorbed by incumbent semiconductor platforms.

    Ranovus, Scintil, Nubis/Ciena and POET are narrower but still relevant. Ranovus explicitly markets 12.8 Tb/s XPU and switch CPO for scale-up. Scintil focuses on a dense multi-wavelength light source for AI scale-up links, which can attack the laser-source layer that Ayar currently externalizes through SuperNova. Ciena's co-packaged optics page, surfaced through the Nubis domain, emphasizes low-power optical engines and field-serviceable external light sources, a serviceability message close to Ayar's own architecture. POET is more adjacent than direct, but its optical interposer platform is aimed at 800G, 1.6T and beyond and therefore competes for the same packaging and interconnect budgets around AI fabrics.
