company:
  name: Ayar Labs
chapter:
  number: 3
  title: Competitors
  summary: Ayar Labs competes in a layered optical-interconnect market rather than against one like-for-like rival. The most important threats are large public incumbents with existing optics franchises, well-funded private scale-up photonics startups such as Lightmatter and Celestial AI, and the near-term persistence of pluggable and LPO architectures that delay broad CPO adoption. Ayar's moat is deepest where it pushes optics inside the package with a serviceable external laser architecture, but NVIDIA's in-house switch-tier photonics and incumbent balance sheets cap how much time the company has to convert technical lead into customer lock-in.
sections:
- id: market-map-and-competitive-boundaries
  title: Market Map and Competitive Boundaries
  body: |-
    Ayar Labs is not selling a faceplate transceiver; it is trying to replace electrical I/O and some pluggable-optics roles by embedding optical I/O into the package itself. That means its competitive set spans several layers. At the direct architecture layer are private scale-up photonics startups such as Lightmatter, Celestial AI and Ranovus that also pitch optical fabrics for larger AI clusters. At the incumbent layer are Broadcom, Marvell, Intel, Cisco/Acacia, Coherent and Lumentum, each of which already controls some combination of switch silicon, silicon photonics, optical DSPs, lasers or transceiver distribution. At the substitute layer are pluggable and near-package optics from vendors such as Innolight, Eoptolink and Accelink, plus linear-drive pluggables that keep serviceability and multivendor sourcing intact while solving part of the power problem.

    That framing matters because Ayar does not need every rival to copy its exact chiplet design in order to lose share. NVIDIA's Spectrum-X Photonics switch proves that switch OEMs can internalize co-packaged photonics at the fabric layer. Broadcom and Marvell are using hyperscaler relationships and fielded silicon-photonics experience to move CPO out of the lab. Meanwhile LightCounting and Avnet both argue that LPO and advanced pluggables will remain the default in many links for years, which means Ayar must win the hardest, highest-density AI scale-up use cases before the industry settles on a more serviceable intermediate architecture.
