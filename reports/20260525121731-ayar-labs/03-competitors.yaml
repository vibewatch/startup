- id: differentiation-moat-and-switching-costs
  title: Differentiation, Moat, and Switching Costs
  body: |-
    Ayar's real differentiation is depth of optical insertion. The company is trying to put optical I/O directly into the compute or switch package using manufacturing and packaging flows that look familiar to major XPU vendors, while keeping the light source remote and serviceable. That is different from most pluggable vendors, different from Acacia's client-optics emphasis, and different from Intel's integrated-laser OCI chiplet. If Ayar wins a socket, the switching cost can be meaningful: package co-design, fiber topology, thermal qualification, and remote-laser architecture all become part of the platform definition, making a later swap back to front-panel optics or to a different optical-I/O vendor expensive.

    The moat is not unassailable. Larger incumbents have enough capital and manufacturing depth to close feature gaps, and NVIDIA has already demonstrated that a strategic buyer can internalize photonics at the switch tier. Capital-market history is also a warning sign: Rockley's Chapter 11 restructuring and later IP sale show that silicon-photonics specialists can fail before scale economics arrive. Ayar therefore has a narrow but valuable moat: it leads where customers want direct in-package optical I/O and serviceable external lasers today, but moat durability depends on converting technical qualification into design wins before the market settles around incumbent-owned platforms or more operationally convenient LPO and pluggable hybrids.
