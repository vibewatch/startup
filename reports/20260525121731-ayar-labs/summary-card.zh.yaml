summary:
  headline: >
    Ayar Labs 是最受资本支持的纯 in-package optical I/O 公司，战略投资人阵容一线，TeraPHY+SuperNova 已跑通，2026-2027 年放量窗口也可信；但商业收入尚未验证，NVIDIA 和
    Broadcom 自研 CPO 项目带来真实竞争风险，在看不见收入的情况下，Series D 相对 Lightmatter 和 Celestial AI 的估值溢价也难以证明。应紧密跟踪；尚未去风险到可以激进承销。
