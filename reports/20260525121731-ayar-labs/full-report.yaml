  foundingLocation: Emeryville, California (Bay Area — DARPA POEM project from MIT/UC Berkeley)
  headquarters: Santa Clara, California
  productSummary: |
    Ayar Labs sells the TeraPHY optical I/O chiplet — a CMOS silicon-photonics die that integrates into a
    customer's compute package alongside CPUs, GPUs, switch ASICs, or FPGAs via standard chiplet interfaces
    — paired with SuperNova, a remote multi-wavelength CW laser light source that feeds TeraPHY via a single
    optical fiber. The combined system delivers terabit-class bandwidth per chiplet at single-digit pJ/bit
    power, extending high-bandwidth interconnect reach from millimeters to kilometers and replacing
    electrical SerDes plus pluggable transceivers for AI scale-up and disaggregated computing fabrics.
  customerFocus: >-
    AI accelerator vendors, hyperscale data-center operators (Microsoft/Google/Meta/AWS targets), HPC system vendors
    (HPE Slingshot, defense HPC), and US DoD/DOE high-performance computing programs (DARPA PIPES, national labs).
  businessModel: >-
    Direct B2B sale of TeraPHY chiplets and SuperNova laser modules to compute-package integrators and system OEMs,
    monetized through evaluation-kit access today and high-volume per-unit chiplet/laser pricing once customer programs
    reach production. Non-dilutive DARPA/DOE grants supplement R&D funding.
  stage: Late-venture (Series D) private company
  fundingStatus: |
    Approximately $370 million raised across Seed, Series A, B, C, and D plus DARPA/DOE grants, capped by a
    $155 million Series D announced December 11, 2024 led by Advent Global Opportunities and Light Street
    Capital, with NVIDIA, AMD Ventures, Intel Capital, 3M Ventures, Autopilot, GlobalFoundries, HPE
    Pathfinder, Lockheed Martin Ventures, Boardman Bay, Founders Fund, and Playground Global participating;
    the company described its Series D valuation only as above $1 billion.
