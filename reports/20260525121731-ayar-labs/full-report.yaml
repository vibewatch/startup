              the public underwriter can see demand breadcrumbs—sampling, design wins, long-term commercial intent, and
              first shipments—but cannot convert them into auditable revenue, gross profit, or CAC/payback math. In
              practice, Ayar still screens as an early-commercial hardware company whose proof points are partner
