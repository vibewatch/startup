    title: Competitor Market Map for Ayar Labs
    columns:
      - Competitor / class
      - Layer of competition
      - Scale signal
      - Primary overlap with Ayar
      - Why it matters
    rows:
      - - Broadcom
        - Switch-tier CPO
        - Public incumbent; latest 10-K filed 2025-12-18
        - CPO in hyperscale switching and AI fabrics
        - Strongest proof that switch vendors can industrialize CPO before Ayar wins broad sockets
      - - Marvell
        - Custom XPU + interconnect
        - Public incumbent; latest 10-K filed 2026-03-11
        - Co-packaged optics for multi-rack custom XPU scale-up
        - Combines silicon photonics, optical DSPs and hyperscaler relationships
      - - Cisco / Acacia
        - Client optics + optical engines
        - Public incumbent; latest 10-K filed 2025-09-03
        - AI scale-out optics and optical engines
        - Owns optics customer relationships even if package-depth overlap is weaker
      - - Intel Silicon Photonics
        - OCI chiplet + pluggables
        - Public incumbent; latest 10-K filed 2026-01-23
        - Co-packaged optical I/O chiplets and large shipped pluggable base
        - Most direct incumbent analogue to Ayar on chiplet-style optical I/O
      - - Coherent
        - Lasers / transceivers / subsystems
        - Public incumbent; latest 10-K filed 2025-08-19
        - Optical modules and laser supply into AI fabrics
        - Controls enabling components that many CPO systems still need
      - - Lumentum
        - Pluggables + laser sources
        - Public incumbent; OFC 2026 showcased 1.6T pluggables and CPO laser sources
        - AI datacenter pluggables and high-power sources for CPO
        - Competes at both transition-architecture and enabling-component layers
      - - Lightmatter
        - End-to-end photonic interconnect roadmap
        - $850M total funding; $4.4B valuation disclosed
        - NPO, OBO, 2D/3D CPO and 3D interposers for AI scale-up
        - Best-funded private rival with broader product surface than Ayar
      - - Celestial AI
        - Photonic Fabric scale-up interconnect
        - $515M total funding; Marvell acquisition announced 2025
        - Package-to-rack optical scale-up fabrics and 16 Tbps chiplets
        - Direct startup overlap plus evidence of startup-to-incumbent consolidation
      - - Ranovus
        - XPU and switch CPO
        - Private; 12.8 Tb/s scale-up CPO marketed with Tier-1 validation claims
        - XPU and switch optical engines for multi-rack scale-up
        - Closest startup peer on explicit XPU/switch CPO messaging after Lightmatter/Celestial
      - - Pluggables / LPO ecosystem
        - Status quo and transition substitute
        - Innolight, Eoptolink and Accelink already shipping 800G/1.6T classes
        - Lets operators delay package integration
        - Most practical near-term substitute because it preserves hot-swap serviceability
    notes: >-
      Rows group the most commercially material competitors and substitutes for Ayar as of the 2026-05-25 run date;
