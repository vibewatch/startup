      - number: '1.4'
        title: Footprint, Ecosystem & Commercialization Posture
        blocks:
          - type: paragraph
            body: >
              Ayar’s operating footprint and ecosystem are now best understood as a commercialization stack, not merely
              a list of logos. Public materials still center the company in Silicon Valley, but the latest releases show
              a broader operating footprint: in July 2025 Ayar said it had opened a new office in Hsinchu, Taiwan and
              doubled the size of its San Jose headquarters, explicitly linking that expansion to high-volume
              manufacturing and co-packaged-optics adoption. The company did not disclose a precise headcount, instead
              signaling scale through hiring plans in the U.S. and Taiwan, facility expansion, and dedicated operations
              leadership. Around that footprint sits a dense partner network. HPE is tied in through a multi-year
              Slingshot and AI-architecture collaboration; NVIDIA through optical-I/O collaboration and investment;
              GlobalFoundries through process and manufacturing collaboration; Lockheed Martin through defense
              application development; Intel through high-profile FPGA demonstrations; and Wiwynn through rack-level
              system design and manufacturing. Gazettabyte’s January 2026 interview adds more texture by showing Ayar
              working with Alchip and GUC to fit optical engines into advanced ASIC packages, particularly for
              hyperscaler deployment paths. Together, these relationships suggest Ayar’s commercial thesis is to become
              embedded inside a broader AI packaging and rack ecosystem rather than to sell a standalone photonics
              module on a narrow merchant basis.
