      - number: '7.7'
        title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Ayar does have credible mitigants. The remote-laser architecture exists precisely to improve thermal
              behavior and serviceability, the company has pursued multiple packaging partners in Taiwan’s ASIC
              ecosystem, and it has strategic investors who can do more than supply capital. But those mitigants must
              become externally observable before they deserve full credit. The highest-signal positive indicators would
              be: a named production deployment rather than another architecture partnership; public evidence that
              packaging and laser suppliers are moving from readiness to sustained shipments; and proof that at least
              one large platform customer selected optical I/O ahead of an LPO or advanced-pluggable bridge. The
              negative indicators are equally clear. A thesis break would start to form if high-volume CPO still looks
              pushed out after 2027, if bridge architectures dominate early AI scale-up, if export-control complexity
              blocks a meaningful geography, or if Ayar raises fresh capital before customer concentration is reduced.
              Investors should therefore monitor the company less like a pure component vendor and more like a
              systems-dependent platform bet whose value can change materially with each disclosed partner, compliance
              event, or customer qualification milestone.
