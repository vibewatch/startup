        title: Customer profile and ideal-customer segments
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs' public customer map is unusual because it is still closer to a design-in ecosystem than to a
              mature booked-revenue account list. The company positions its optical I/O around AI training and inference
              infrastructure, where the direct "buyer" is often an ASIC, GPU, networking, or rack-level architecture
              team rather than a conventional purchasing department. The named public counterparties therefore mix
              several roles: DARPA and defense programs as validation funders; HPE, NVIDIA, Intel, GlobalFoundries, and
              Lockheed Martin as strategic collaborators and investors; and GUC, Alchip, and Wiwynn as route-to-market
              enablers for unnamed hyperscaler or cloud buyers. Ayar's own 2024 financing release said the company was
              aligning high-volume manufacturing to customer roadmaps and had exciting engagements with Tier 1
              customers, but it still did not name those accounts or disclose how many are paying versus evaluating.
              That means the core underwriting judgment for this chapter is not whether customer interest exists—it
              clearly does—but whether the public evidence proves repeatable production deployment. Today it does not.
