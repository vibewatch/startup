  - id: TP004
    title: Transition Architectures and Switching-Cost Comparison
    columns:
      - Architecture
      - Representative vendors
      - Operational advantage
      - Operational drawback
      - Implication for Ayar
    rows:
      - - Re-timed pluggables
        - Coherent, Lumentum, Innolight, Eoptolink, Accelink
        - Hot-swappable, multivendor, familiar operations
        - Higher power and tighter thermal limits at 800G–1.6T
        - Default baseline that Ayar must beat on TCO for the densest fabrics
      - - Linear-drive pluggables (LPO)
        - Broad ecosystem; highlighted by LightCounting and Avnet
        - Removes some DSP overhead while keeping pluggable serviceability
        - Still leaves optics outside the package
        - Most credible near-term substitute for early CPO adoption
      - - Near-package optics (NPO)
        - Ciena/Nubis, Lightmatter L-series
        - Shorter electrical reach and better density than front-panel pluggables
        - Does not capture full package-level I/O benefit
        - Can satisfy buyers who want lower risk than full in-package optics
      - - Switch-tier CPO
        - Broadcom, NVIDIA, Marvell
        - Highest density and power gains in core fabrics
        - Integration complexity and repair burden
        - Threatens Ayar where switch OEMs internalize photonics themselves
      - - In-package compute-die optical I/O
        - Ayar, Intel OCI, Celestial AI, Lightmatter M-series
        - Maximizes shoreline relief and bandwidth density
        - Highest qualification and packaging burden
        - Ayar wins only if this deeper insertion is worth the complexity
      - - Custom in-house optical build
        - NVIDIA and hyperscaler-led ecosystems
        - Full control of architecture and supply chain
        - Requires deep photonics, packaging and manufacturing capabilities
        - Largest customers may internalize the most valuable optical layers
    notes: >-
      The comparison emphasizes serviceability and packaging depth rather than list pricing because exact contract
      pricing for private CPO platforms is not publicly disclosed.
    enumerationScope:
      coverage: partial
      basis: >-
        Representative architecture options and substitute paths discussed in reviewed analyst, official, and vendor
        sources for 2025-2026.
    claimRefs:
      - CP028
      - CP030
      - CP031
      - CP032
      - CP033
      - CP034
      - CP035
      - CP041
