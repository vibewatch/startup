              The March 2026 Wiwynn partnership matters because it reframes Ayar from a component company into a
              system-architecture participant. The disclosed target — 1,024 accelerators with rack-level liquid cooling,
              fiber management, and serviceable laser modules — is materially closer to a hyperscaler purchasing unit
