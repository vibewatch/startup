  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Timing
      - Public Evidence
      - Implication for Ayar
      - Diligence Ask
    rows:
      - - AI model and cluster scaling beyond one rack
        - Positive
        - Immediate to 2030
        - Ayar workload framing plus Dell’Oro cluster-size commentary
        - Raises value of package-level bandwidth density and lower-latency fabrics
        - Request customer-specific bandwidth maps and radix assumptions for 2026-2028 designs
      - - Hyperscaler infrastructure budgets remain elevated
        - Positive
        - 2026-2028
        - Alphabet, Meta, and Amazon filings plus Dell’Oro capex-linked networking outlook
        - Supports continued willingness to fund advanced interconnect experiments and platform refreshes
        - Track whether networking/optics dollars scale in line with compute spending
      - - Power and electricity constraints in AI data centers
        - Positive
        - 2026-2030
        - IEA electricity-demand forecast and Dell’Oro 600 kW rack commentary
        - Improves value proposition of optical I/O if it reduces watts per bit and copper trace length
        - Validate real system-level power savings versus high-end pluggables and LPO
      - - Standards and ecosystem progress (UCIe, CW-WDM, packaging partners)
        - Positive
        - 2025-2028
        - Ayar product pages, OFC abstract, and partnership announcements
        - Lowers integration friction and makes design wins more plausible in multi-vendor stacks
        - Confirm which standards are required by current lead customers
      - - Pluggables and LPO remain serviceable substitutes
        - Negative
        - 2026-2028
        - LightCounting and Dell’Oro both describe hybrid adoption and continued pluggable relevance
        - Can delay Ayar capture even while the overall optics market grows
        - Map which buyer segments genuinely need package-level optics versus improved modules
      - - Packaging yield and known-good-chiplet requirements
        - Negative
        - 2026-2028
        - IEEE OFC paper on connectorized chiplets and HVM process flow
        - Creates commercialization and gross-margin risk for optical chiplets
        - Ask for yield, assembly, and test metrics before assuming scale economics
      - - Switch-first CPO ramp
        - Mixed / Negative
        - 2026-2027
        - Analyst notes and NVIDIA photonics announcements point first to switch platforms
        - Expands SAM for CPO generally but may leave Ayar’s accelerator-package thesis later in queue
        - Separate switch-tier and accelerator-tier adoption assumptions in every forecast
      - - Sparse public unit economics for chiplet-side optics
        - Negative
        - Ongoing
        - Public sources publish ranges, not shipment ASPs or attach rates
        - Makes revenue translation from TAM to Ayar capture highly uncertain
        - Obtain customer, port, and pricing data under NDA before converting market size to valuation
    notes: >-
      Driver and constraint rows intentionally mix market pull, technical readiness, and commercialization friction.
      Timing reflects public evidence available as of the canonical run date and should not be read as a guaranteed
      deployment schedule.
