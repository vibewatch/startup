      - number: '8.3'
        title: Public optics comps provide boundaries, not a direct multiple
        blocks:
          - type: paragraph
            body: >-
              Public-market optics names are too heterogeneous to support a clean direct multiple for Ayar, but they are
              still useful as boundary conditions. The bearish edge of the range is Rockley Photonics, which filed
              Chapter 11 in January 2023 and restructured through a process that eliminated more than $120 million of
              secured debt. That is the cautionary public outcome when a photonics narrative fails to convert into
              durable capital-market support. POET Technologies sits at the other end of the early-stage spectrum: a
              listed optical company with a multi-billion public market value despite de minimis trailing revenue, thin
              analyst coverage, and a sell consensus. Meanwhile Lumentum and Coherent are large, diversified public
              photonics vendors with billions of dollars in disclosed revenue, which makes them useful as scale
              references but poor stage-matched venture comparables. Analysts also continue to inject realism into the
              category: Lightwave, Cignal AI, and LightCounting all argue that broad high-volume CPO deployment remains
              early and likely pushes meaningfully into 2027 or later. So public comps do not invalidate Ayar's mark,
              but they do argue against false precision.
