      - number: '1.3'
        title: Funding History & Capital Base
        blocks:
          - type: paragraph
            body: >
              Ayar Labs’ financing arc now shows a clear progression from deep-tech venture backing to large,
              AI-infrastructure growth capital. The April 2022 Series C brought in $130 million led by Boardman Bay
              Capital Management, with strategic participation from Hewlett Packard Enterprise and NVIDIA alongside
              earlier backers including Applied Ventures, GlobalFoundries, Intel Capital, and Lockheed Martin Ventures.
              That round mattered not only because it expanded the cap table, but because Ayar said it had first volume
              commercial shipments under contract and expected to ship thousands of units by year-end, tying financing
              to commercialization claims rather than only R&D. In December 2024, the company announced a $155 million
              Series D led by Advent Global Opportunities and Light Street Capital, stating that total funding had
              reached $370 million and valuation had moved above $1 billion. By March 2026, Ayar disclosed a much larger
              Series E: $500 million led by Neuberger Berman, taking total funding to $870 million and valuation to
              $3.75 billion. The Series E investor set broadened again, bringing in institutional capital such as ARK
              Invest, Insight Partners, Qatar Investment Authority, Sequoia Global Equities, and 1789 Capital, while
              also adding Alchip and MediaTek as strategic semiconductor ecosystem investors. Neuberger Berman also
              received a board-observer role, signaling a more formal growth-stage governance layer without making the
              company public.
