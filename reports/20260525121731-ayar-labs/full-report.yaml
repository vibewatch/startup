          detail: Laser Focus and Ayar-linked coverage frame optical I/O offerings as emerging through 2026–2028.
        - label: High-volume CPO deployments
          low: 2027
          high: 2028
          unit: year
          detail: LightCounting places high-volume deployments in 2027 with broader high volumes by 2028.
        - label: Bridge-tech persistence (LPO / NPO / pluggables)
          low: 2026
          high: 2031
          unit: year
          detail: Independent coverage suggests bridge architectures can remain relevant well beyond initial CPO pilots.
        - label: Broader non-hyperscale mainstreaming
          low: 2029
          high: 2035
          unit: year
          detail: CIR describes enterprise CPO adoption as a slower, later wave after hyperscaler proving cycles.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR021
      - CR023
  - id: FR004
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Causal view of how Ayar’s root risks propagate into delayed revenue, tighter financing, and thesis-break outcomes.
    approximationNotes: Edges express directional logic rather than measured coefficients.
    data:
      nodes:
        - id: adoption-delay
          label: Adoption delay
          detail: CPO ramp slips while bridge architectures persist
        - id: gf-single-fab
          label: GF single-fab
          detail: Silicon photonics capacity remains concentrated
        - id: laser-supply
          label: Laser supply
          detail: External laser arrays and qualification must scale
        - id: packaging-bottleneck
          label: Packaging bottleneck
          detail: Advanced packaging remains tight
        - id: competitor-internalization
          label: Platform internalization
          detail: Large vendors embed photonics themselves
        - id: export-controls
          label: Export controls
          detail: EAR screening and Entity List obligations expand
        - id: customer-concentration
          label: Customer concentration
          detail: Few early customers dominate demand
        - id: revenue-slip
          label: Revenue slip
          detail: Commercial ramp moves right
        - id: margin-pressure
          label: Margin pressure
          detail: Supply chain and packaging costs stay elevated
        - id: financing-need
          label: Financing need
          detail: More capital is required before broad scale
        - id: thesis-break
          label: Thesis break
          detail: Window closes before proof and scale converge
      edges:
        - from: gf-single-fab
          to: packaging-bottleneck
          label: single-source stack compounds
        - from: laser-supply
          to: margin-pressure
          label: qualification and allocation
        - from: packaging-bottleneck
          to: revenue-slip
          label: shipments slow
        - from: adoption-delay
          to: revenue-slip
          label: customers wait
        - from: competitor-internalization
          to: revenue-slip
          label: merchant TAM narrows
        - from: customer-concentration
          to: revenue-slip
          label: few accounts matter more
        - from: export-controls
          to: margin-pressure
          label: compliance overhead
        - from: revenue-slip
          to: financing-need
          label: runway shortens
        - from: margin-pressure
          to: financing-need
          label: gross profit delayed
        - from: financing-need
          to: thesis-break
          label: down-round or forced strategic dependence
    claimRefs:
      - CR009
      - CR024
      - CR042
      - CR043
      - CR047
      - CR049
  - id: FV001
    title: Selected valuation and transaction markers
    type: bar
    layout: wide
    summary: >-
      Private financing marks and recent strategic transactions bracket Ayar between sub-scale photonics startups and
      multi-billion-dollar category leaders.
    data:
      items:
        - label: Ayar Labs Series D floor
          value: 1000
          note: USD M; public evidence says valuation above $1B, not exact.
        - label: Lightmatter
          value: 4400
          note: USD M private valuation, Oct. 2024.
        - label: Celestial AI
          value: 2500
          note: USD M+ valuation, Mar. 2025.
        - label: Scintil Photonics
          value: 133.6
          note: USD M valuation as of Aug. 2025.
        - label: Cisco / Acacia
          value: 4500
          note: USD M strategic acquisition value.
        - label: Ciena / Nubis
          value: 270
          note: USD M strategic acquisition value.
    claimRefs:
      - CV002
      - CV018
      - CV021
      - CV022
      - CV030
      - CV032
      - CV038
      - CV042
    approximationNotes: >-
      All figures in USD millions. Ayar uses the disclosed public floor of >$1B rather than an invented exact post-money
      number.
  - id: FV002
    title: Implied valuation range
    type: range
    layout: standard
    summary: >-
      The central case stays close to the last-round floor, while upside requires faster proof of commercial scale and
      downside appears if timing slips persist.
    data:
      items:
        - label: Bear case
          low: 500
          mid: 650
          high: 800
          unit: USD M
          note: Delayed adoption, slower commercialization, or investor-unfriendly next round.
        - label: Base case
          low: 900
          mid: 1100
          high: 1300
          unit: USD M
          note: Holds near the last-round floor with no major negative surprise.
        - label: Bull case
          low: 1500
          mid: 1800
          high: 2200
          unit: USD M
          note: Requires broader deployment proof, better disclosure, and stronger strategic-exit confidence.
    claimRefs:
      - CV002
      - CV037
      - CV043
      - CV044
      - CV045
      - CV047
      - CV048
      - CV049
    approximationNotes: Single-unit figure in USD millions. These are scenario ranges, not model outputs or management guidance.
  - id: FV003
    title: Waterfall of valuation drivers around the last-round floor
    type: waterfall
    layout: wide
    summary: >-
      Positive strategic and ecosystem factors are largely offset by revenue opacity and adoption-timing risk, leaving
      the current fair value centered near the last-round floor.
    data:
      items:
        - label: Last-round floor
          value: 1000
          note: Public evidence supports only a >$1B floor, not a precise figure.
        - label: Strategic cap-table premium
          value: 150
          note: AMD, NVIDIA, Intel, HPE, GF and other strategics reduce financing fragility.
        - label: Product / manufacturing readiness
          value: 100
          note: Company and partner materials support production-ready positioning.
        - label: Revenue opacity discount
          value: -125
          note: No public revenue, margin, or backlog disclosure.
        - label: CPO adoption timing discount
          value: -75
          note: Independent analysts still see broad high-volume deployment as early.
        - label: Public comp / exit uncertainty
          value: -50
          note: Public optics comps are noisy and strategic exit values vary widely.
        - label: Base-case central mark
          value: 1000
          note: Net effect keeps Ayar near last-round parity on public evidence alone.
    claimRefs:
      - CV002
      - CV010
      - CV012
      - CV037
      - CV041
      - CV047
      - CV048
      - CV049
    approximationNotes: >-
      Illustrative valuation bridge in USD millions. The positive and negative adjustments are judgmental lens weights,
      not management figures.
  - id: FV004
    title: Comp positioning matrix
    type: matrix
    layout: wide
    summary: >-
      Ayar screens well on strategic fit and product readiness, but poorly on financial visibility relative to any
      investor who wants a conventional valuation anchor.
    data:
      columns:
        - Commercial proof
        - Financial visibility
        - Strategic-buyer fit
        - Downside signal
      rows:
