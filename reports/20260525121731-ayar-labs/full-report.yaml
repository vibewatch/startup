      - number: '7.2'
        title: Technology, Integration, and Supply-Chain Risk
        blocks:
          - type: paragraph
            body: >-
              Ayar’s technical case is strong enough to matter but not strong enough to erase manufacturing risk. Public
              company materials show a multi-generation TeraPHY roadmap and unusually detailed internal thermal and BER
              tests, including 30–80°C cycling and emulated ramps to 800°C/s. Those results matter because they address
              one of the standard criticisms of microring-based CPO in hot compute packages. But the same blog also
              reinforces the central risk: Ayar is still talking about EVT, DVT, wafer sort, and validation gates that
              must be closed before manufacturing truly scales. Public sources do not disclose yield curves,
              optical-alignment defect rates, package escape data, or long-duration field returns. Supply-chain
              concentration compounds the uncertainty. Ayar’s story still leans on GlobalFoundries for silicon
              photonics, Taiwanese packaging partners for package integration, and external laser suppliers such as
              Sivers for the SuperNova light source. Laser Focus World and CIR both make clear why the remote-laser
              architecture exists: lasers are temperature-sensitive and serviceability remains a live concern. That
              architecture mitigates one problem while creating another—external laser qualification, supply assurance,
              and replacement models become part of the production-critical stack.
