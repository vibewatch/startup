    columns:
      - Segment
      - Direct Buyer
      - End User / Payer
      - Workflow
      - Budget Owner
      - Adoption Trigger
      - Current Fit for Ayar
    rows:
      - - Accelerator-package scale-up fabrics
        - Accelerator/ASIC vendor or hyperscaler silicon team
        - Hyperscaler AI platform owner paying for cluster throughput and utilization
        - Package-level design-in with advanced packaging and protocol validation
        - Silicon platform VP; AI infrastructure architecture lead
        - Copper reach/power wall inside rack-scale and multi-rack scale-up fabrics
        - Best strategic fit, but longest qualification path
      - - Switch-side CPO in AI back-end networks
        - Switch OEM, switch ASIC vendor, or hyperscaler networking team
        - Hyperscaler network capex budget
        - Switch platform refresh tied to 1.6T/3.2T roadmaps and liquid-cooled racks
        - Networking architecture; switch silicon GM
        - Port density, power, and resiliency at 1.6T+
        - Near-term SAM, but crowded by NVIDIA/Broadcom strategies
      - - Rack-scale system and ODM platforms
        - ODM/system integrator plus package and board-design partner
        - Hyperscaler platform engineering budget
        - Reference design, subsystem co-design, and manufacturability work-up
        - Platform engineering; advanced systems architect
        - Need multi-rack scale-up with manufacturable packaging
        - Important channel multiplier for Ayar ecosystems such as Alchip and future ODMs
      - - HPC / exascale systems
        - System OEM or national-lab prime contractor
        - Government lab, enterprise HPC buyer, or sovereign program
        - Multi-year architecture program with strict latency and memory-fabric requirements
        - Program CTO; chief architect; government program office
        - Need for disaggregation, low latency, and high-bandwidth Slingshot/fabric evolution
        - Useful proof-point segment, but lower volume than hyperscale cloud
      - - Distributed AI campuses / scale-across DCI
        - Cloud network architecture and transport team
        - Cloud infrastructure finance and capacity planning
        - Campus/inter-site optical design paired with AI-cluster siting decisions
        - Network architecture VP; capacity planning
        - Power-limited clusters distributed across buildings or campuses
        - >-
          Adjacency that expands optics spend, though much value sits in coherent/DCI suppliers rather than Ayar
          directly
    notes: >-
      Buyer and payer differ across rows because Ayar is typically specified into a larger silicon or system program
      rather than bought like a commodity transceiver. Budget ownership therefore sits with platform, networking, and
      silicon teams rather than ordinary component procurement.
