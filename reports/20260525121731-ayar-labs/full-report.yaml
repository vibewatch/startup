      - number: '2.5'
        title: Constraints, Substitutes, and the Pluggable–LPO–CPO Debate
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term constraint on Ayar’s market is not lack of demand for bandwidth; it is the
              availability of easier substitutes. LightCounting and Dell’Oro both suggest that adoption is likely to
              proceed in stages: pluggables remain entrenched, LPO grows as a lower-power stepping stone, switch-side
              CPO ramps first, and package-level optical chiplets arrive later as packaging and serviceability issues
              are solved. That is directly relevant to Ayar because its highest-value thesis depends on optical I/O
              moving closer to accelerators, not merely onto network switches. Independent technical publications
              reinforce the manufacturing challenge: known-good optical chiplets, passive fiber attach,
              connectorization, packaging yield, and thermal integration all remain gating items for high-volume
              deployment. Public analyst commentary is also explicit that current CPO implementations are mostly
              switch-centric and that large-scale scale-up shipments are more likely to start in 2027 than in 2026.
              Competitive pressure compounds the timing risk. NVIDIA is not waiting for a third-party ecosystem to
              mature; it has already announced silicon-photonics switch platforms with aggressive efficiency claims,
              which could keep switch-tier value inside the incumbent platform stack. The net result is that Ayar
              clearly benefits from the same macro drivers lifting the optics market, but its commercial capture window
              likely opens later and narrower than the most bullish headline TAM figures imply.
