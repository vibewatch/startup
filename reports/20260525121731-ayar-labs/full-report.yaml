      - number: '2.3'
        title: Buyer, User, and Budget Structure
        blocks:
          - type: paragraph
            body: >-
              The direct buyer for Ayar-style optical I/O is usually not the final hyperscaler alone; it is the
              combination of accelerator designers, switch vendors, advanced-packaging partners, and system integrators
              that translate hyperscaler bandwidth requirements into package-level design wins. In the most attractive
              segment — scale-up fabrics attached directly to accelerators — the operational user is the hyperscaler AI
              platform team, but the immediate buying decision sits with the silicon or subsystem vendor integrating the
              package. Switch-side CPO is a second segment where the buyer is the networking platform team or switch
              OEM, with hyperscaler network architecture and infrastructure-finance teams serving as the effective
              payer. System integrators such as ODMs and advanced-ASIC partners sit in the middle because they decide
              whether a chiplet-based optical architecture can be packaged, tested, cooled, and manufactured at
              acceptable yields. HPC and exascale systems represent a smaller but still meaningful segment because they
              value low latency, disaggregation, and memory/fabric efficiency even before hyperscale cloud volumes fully
              materialize. Across these segments, budget ownership usually sits with infrastructure architecture,
              networking, or silicon-platform leaders rather than procurement teams buying commodity optics. That favors
              Ayar if it can get specified into next-generation accelerator or switch platforms, but it also means
              qualification cycles are long and partner-led, not quick module swaps.
