  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs does not participate in the entire data-center networking market; it participates in the
              narrower market for co-packaged optical engines and optical I/O chiplets that move data directly off
              accelerators, switches, and advanced packages using light rather than long electrical traces. The broad
              comparison set is the optics-for-AI-clusters market, which includes pluggable transceivers, linear-drive
              pluggables, active optical cables, switch-side co-packaged optics, and optical links used in both
              scale-out and scale-up networks. Ayar’s core product position is narrower still: TeraPHY optical I/O
              chiplets paired with the SuperNova remote laser source. That means headline optics TAM figures overstate
              Ayar’s direct revenue pool because much of the spend sits in transceiver modules, system-level switches,
              cabling, and transport gear that Ayar does not itself sell. The right market boundary therefore starts
              with optical-engine content embedded in packages and then expands outward to adjacent substitute spend in
              pluggables and LPO. This distinction matters because the buyer decision is not simply “buy optics”; it is
              “replace copper or pluggables with package-level optical I/O where bandwidth density, power, latency, and
              reach justify the integration cost.” Public Ayar materials consistently frame scale-up AI fabrics as the
              highest-value use case, while independent analyst sources show that pluggables, LPO, and DCI optics remain
              important adjacent and substitute markets rather than disappearing overnight.
            claimRefs:
