      - number: '1.2'
        title: Leadership & Governance
        blocks:
          - type: paragraph
            body: >
              Ayar Labs’ public governance profile remains founder-led, with Mark Wade now clearly installed as the
              operating center of gravity. The company announced in December 2023 that Wade, a co-founder and then-CTO,
              succeeded Charles Wuischpard as chief executive officer; Wuischpard remained briefly in an advisory role
              during the transition before exiting. Both Ayar’s own release and Lightwave’s coverage frame the change as
              a deliberate move from an externally recruited scaling executive back to a technical founder for the next
              commercialization phase. The public leadership page shows a broader management bench than the company
              disclosed in its earlier years, including CFO Lisa Cummins Dulchinos, CTO and co-founder Vladimir
              Stojanovic, chief scientist and co-founder Chen Sun, Chief Strategy Officer Vivek Gupta, manufacturing and
              Taiwan operations lead Scott Clark, and General Counsel and Corporate Secretary Matthew Gloss. The same
              page also identifies a recognizable board roster that includes Craig Barratt, Pat Gelsinger, Will Graves,
              Jordan Katz, Ganesh Moorthy, and Geoff Tate. What is still missing is the governance detail a later-stage
              investor would normally want: Ayar does not publicly break out committee structure, director independence,
              ownership percentages, or detailed board rights beyond the Series E board-observer disclosure. The result
              is a governance profile that is legible enough for ecosystem credibility, but still private-company-light
              on hard governance mechanics.
