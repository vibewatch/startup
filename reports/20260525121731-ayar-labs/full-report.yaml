            - Low
        - label: POET Technologies
          values:
            - Low
            - High
            - Medium
            - High
        - label: Rockley Photonics
          values:
            - Low
            - High
            - Low
            - Very High
    claimRefs:
      - CV018
      - CV021
      - CV023
      - CV026
      - CV037
      - CV041
      - CV046
      - CV047
      - CV048
    approximationNotes: >-
      Ordinal qualitative scoring only. The matrix is a synthesis tool to show why Ayar can look strategically
      attractive while still lacking a clean valuation support base.
