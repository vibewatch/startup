      - number: '8.5'
        title: Scenario range centers near the last round because the debate is about timing, not technology alone
        blocks:
          - type: paragraph
            body: >-
              The valuation range is best framed around timing and commercialization confidence rather than around a
              revenue multiple. In the bull case, Ayar can plausibly move materially above the last-round floor if
              optical I/O converts strategic relationships into visible design wins, if customer roadmaps translate into
              broader production deployment, and if analyst skepticism about CPO timing starts to collapse. In the base
              case, the company remains close to its last-round mark because the strategic syndicate is high quality and
              the category remains important, but the public evidence still cannot show revenue, unit economics, or
              cap-table clarity. In the bear case, the mark compresses below the last round if CPO deployment remains
              slower than expected, if optics buyers stick with bridge technologies longer, or if the next financing
              reveals investor-unfriendly terms or a need to clear the market at a discount. The scenario spread
              therefore reflects commercialization timing, strategic optionality, and disclosure quality more than a
              traditional financial model.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV043
