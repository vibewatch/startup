  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Landscape and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs enters the 2026 decision window with a risk profile that is unusually compressed in time. The
              company has credible product signals, a strong strategic-investor roster, and internally reported
              validation data, but the gating items for venture returns remain tightly coupled: manufacturability must
              mature at the same time that the market is still deciding how quickly to move from pluggables and LPO to
              true co-packaged optics. The top near-term risks are therefore not abstract technology doubts; they are
              adoption timing, manufacturing concentration, competitive internalization by larger platforms,
              concentration of visible demand among strategic actors, and export-control or IP friction that appears
              late in the ramp. Those risks stack rather than offset. If market adoption shifts out by even a year while
              advanced packaging remains constrained and customers continue to demand operational serviceability, Ayar
              could face a narrower commercialization window just as NVIDIA, Broadcom and Marvell strengthen their own
              photonics positions. The chapter’s ranking treats that timing compression—not pure device feasibility—as
              the core underwriting concern.
