      - number: '8.4'
        title: M&A precedents show strategic appetite, but scale still dominates price
        blocks:
          - type: paragraph
            body: >-
              Optical interconnect and photonics M&A precedent is supportive, but only if one remembers how wide the
              range is. Cisco paid roughly $4.5 billion in cash for Acacia in 2021 to reinforce coherent optics inside
              its Internet-for-the-Future strategy. Marvell agreed to buy Inphi in a $10 billion cash-and-stock deal to
              deepen its data-center and 5G optical connectivity footprint. More recently, Ciena agreed to acquire Nubis
              Communications for $270 million in cash to strengthen its inside-the-data-center strategy for AI
              workloads, while II-VI completed its combination with Coherent using a large cash-and-stock structure. The
              common thread is clear: strategic buyers will pay materially for optical assets that solve bandwidth,
              latency, or packaging bottlenecks inside critical infrastructure. But the price dispersion is equally
              clear: the market pays very differently for scaled, revenue-bearing, platform-like assets than it does for
              narrower capability tuck-ins. Ayar belongs in that strategic conversation, but today's public evidence
              cannot yet place it at the Acacia or Inphi end of the range with conviction.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV042
          - type: table
