      - number: '7.4'
        title: Competitive and IP Risk
        blocks:
          - type: paragraph
            body: >-
              Ayar is not competing in an empty architecture lane. NVIDIA has already moved silicon photonics into its
              own switch portfolio. Broadcom has a clear XPU-CPO and optical roadmap plus customer reliability
              statistics from Meta. Marvell is blending in-house silicon photonics experience with the Celestial AI
              acquisition. Lightmatter still markets Passage for AI fabrics, meaning the startup field remains crowded
              even before accounting for more specialized challengers. That competitive set matters because each
              additional incumbent or capitalized startup weakens the chance that optical I/O remains a merchant
              category with generous standalone economics. The IP picture raises the cost of being wrong. Justia
              assignee pages show multiple adjacent patent estates across Ayar, Lightmatter, and Rockley, and the
              Rockley bankruptcy plus later patent-portfolio sale shows that distressed photonics IP can re-enter the
              market in the hands of a better-funded rival. PTAB provides a ready challenge venue if conflict emerges.
              None of this proves Ayar has an FTO problem today; it does mean the company operates in a dense and
              actively tradable patent environment where a late-stage dispute could be strategically damaging even
