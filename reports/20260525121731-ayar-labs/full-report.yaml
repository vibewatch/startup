      - number: '3.4'
        title: Pluggables, LPO, and Transition Architectures
        blocks:
          - type: paragraph
            body: >-
              The most underestimated competitors are the architectures that do not fully replace the package boundary.
              Innolight, Eoptolink and Accelink show how strong the incumbent pluggable ecosystem already is at 800G and
              1.6T. Lumentum and Coherent continue to push higher-density modules and laser sources that improve the
              economics of front-panel and rack-scale optics. Analyst and trade evidence is consistent that these
              architectures are not disappearing: LightCounting expects high-volume CPO deployments only in 2027, while
              deployments of LPO begin earlier and pluggable shipments at 800G and above keep growing. Avnet explicitly
              argues that pluggables and CPO will coexist for five to ten years because serviceability, configurability
              and multivendor sourcing still matter operationally.


              For Ayar, that means the near-term job is not to beat every pluggable vendor port for port; it is to prove
              that the cost, power and density penalty of staying outside the package has become unacceptable in the
              highest-performance AI scale-up domains. If operators can use LPO, NPO or high-density pluggables to defer
              that architectural jump, Ayar's adoption curve slips. That is why external-laser serviceability is
              strategically important: it tries to preserve one of the key benefits of pluggables while still taking
              optics into the package.
