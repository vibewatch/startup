            body: >-
              The hardest issues are no longer “can Ayar demonstrate optical I/O?” but “can customers service it,
              qualify it, and buy it at scale?” Adverse analyst coverage is useful here: LightCounting still expects LPO
              to land earlier than CPO, while Lightwave/CIR argues that non-hyperscale operators remain wary of yield,
              thermal behavior, repair models, and vendor lock-in. Ayar’s external-laser strategy helps on
