  - id: TV007
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to valuation
      - Action implication
    rows:
      - - CPO adoption slips again
        - Independent analyst view still says mainstream high-volume deployment is pushed beyond 2027
        - Extends time-to-scale and weakens premium paid for strategic optionality
        - Move stance from fair toward stretched and require a larger discount to last-round parity.
      - - No meaningful commercial disclosure
        - No public revenue, backlog, or named production-scale customer evidence before the next financing event
        - Blocks revenue-based valuation and leaves the thesis dependent on optionality alone
        - Do not pay a premium; keep recommendation at track/research-more.
      - - Next round exposes investor-unfriendly terms
        - Preference stack, participating terms, or anti-dilution protections materially subordinate new money
        - Can leave apparent headline value intact while destroying actual return economics
        - Treat the current mark as stretched until the cap table is diligenced.
      - - Optics market downside reasserts itself
        - More Rockley-like distress outcomes or clear rejection of CPO by hyperscalers
        - Raises sector discount rates and lowers exit appetite
        - Shift from fair to stretched/expensive depending severity.
    notes: >-
      Each trigger is externally monitorable from future financing announcements, analyst commentary, or
      company/customer disclosures.
