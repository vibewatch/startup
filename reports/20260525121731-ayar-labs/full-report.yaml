      - number: '8.6'
        title: 'Recommendation: track, fair at face value, research-more before paying up'
        blocks:
          - type: paragraph
            body: >-
              The most defensible call from public evidence is track with medium confidence and a fair valuation stance,
              with the caveat that the same mark could look stretched if the undisclosed preference stack is
              investor-unfriendly. Ayar deserves real credit for a rare strategic syndicate, ecosystem validation from
              HPE and GlobalFoundries, category relevance supported by DARPA, and a product story that is clearly
              aligned with AI scale-up pain points. But the anti-thesis is equally concrete: the best independent
              category work still says co-packaged optics is inevitable but not imminent, public pure-play downside has
              already been severe in this sector, and Ayar discloses neither revenue nor unit economics. That
              combination is exactly why a price-sensitive recommendation must stop short of buy. The work that would
              move the call is straightforward: exact post-money and preference terms, current shipment and revenue
              scale, proof that design wins are converting into production programs, and evidence that the economics of
              the optical stack support durable returns. Until those facts are public or diligenced, last-round parity
              is reasonable, but paying a meaningful premium is not.
            claimRefs:
              - CV037
