companyProfile:
  summary: |
    Ayar Labs is a Santa Clara, California-based silicon-photonics company founded in 2015 to commercialize
    in-package optical I/O for AI and HPC systems. Its two-part product stack — the TeraPHY optical I/O
    chiplet and the SuperNova multi-wavelength remote laser source — is designed to replace electrical
    SerDes inside accelerator packages and across racks, enabling scale-up fabrics with materially higher
    bandwidth, lower latency, and lower power than copper or pluggable optics over distance. The company
    has raised about $370 million across rounds capped by a $155 million Series D in December 2024 that
    pushed its valuation above $1 billion, with strategic backing from NVIDIA, AMD Ventures, Intel Capital,
    GlobalFoundries, HPE, Lockheed Martin Ventures, and Advent. Commercial revenue, ARR, customer
    concentration, gross margin, and burn rate are not publicly disclosed; engagement with hyperscalers
    and DoD/DOE programs is collaborator- and grant-driven rather than commercially proven at scale. The
    central investment debate is whether Ayar's first-mover IP and strategic cap table can outpace
    NVIDIA's in-house Spectrum-X/Quantum-X CPO programs, Broadcom's CPO push, and a still-uncertain CPO
    adoption curve in 2026-2028.
