- id: market-timing-adoption
  title: Market Timing and Adoption Risk
  body: 'The biggest risk to Ayar may be that the market agrees with its direction but not with its timetable. Ayar-linked sources and Gazettabyte frame first commercial use around GPU scale-up and a 2026–2028 commercialization window. Independent analyst and trade sources are more cautious. LightCounting says high-volume CPO deployments are likely in 2027, while LPO deployments are already starting and re-timed pluggables remain durable through the rest of the decade. Optical Connections adds that AI-optics growth should moderate in 2026–2027 as the first wave of excitement cools. CIR’s 2026 analysis goes further: outside a small set of hyperscale environments, there are still few visible CPO deployments, many operators are uncomfortable with serviceability and vendor lock-in, and enterprises may treat CPO as next-decade technology. That does not mean Ayar is wrong on the long term. It means the revenue window can shift from “inevitable soon” to “inevitable later,” and deep-tech hardware
    companies are often financed for one interpretation but not the other. In that context, LPO, NPO, and better pluggables are not failed substitutes; they are real bridge architectures that can delay Ayar’s revenue ramp without disproving the optical-I/O thesis.'
