- id: regulatory-export-controls
  title: Regulatory, Export-Control, and Defense-Adjacency Risk
  body: 'The export-control risk for Ayar is not that optical I/O is obviously banned today; it is that the compliance perimeter around AI hardware is widening faster than young hardware companies usually build legal infrastructure. Cleary’s March 2025 summary of the BIS conference described a dramatic increase in EAR enforcement focused on China, AI, semiconductors, and supercomputing, plus an expanding Entity List. The January 2025 BIS interim final rule is especially relevant because it tightens due-diligence expectations for foundries and OSATs handling advanced-computing ICs—exactly the kind of ecosystem dependencies that optical-interconnect vendors rely upon. Ayar’s DARPA PIPES and POEM proximity makes the sensitivity higher, not lower: dual-use and defense-adjacent performance goals can sharpen screening, security, and customer-acceptance obligations even when a product is built for commercial AI infrastructure. Public sources reviewed here do not disclose Ayar’s ECCN position, export-control
    opinions, or whether the company has carved out strict boundaries between commercial AI, China-linked opportunities, and defense-sensitive programs. That uncertainty is manageable for now, but it is not a paperwork footnote; if handled late, it can directly reduce TAM or delay shipments.'
  claimRefs:
  - CR043
  - CR044
  - CR045
  - CR046
