- id: concentration-capital-governance
  title: Customer Concentration, Capital, and Governance Risk
  body: 'Ayar’s visible support base is high quality but also narrow. The public record is rich in strategic investors, collaborators, and government-linked programs: GlobalFoundries, HPE, NVIDIA, Intel-linked DARPA work, and DoD-adjacent applications. What is harder to find is broad evidence of named production customers, diversified merchant revenue, or volume purchase commitments. The evaluation-kit page reinforces that the company is still allocating access to customers with long-term commercial agreements, which is rational from a commercialization standpoint but also a sign that early demand can be dominated by a few accounts. That concentration sits on top of capital intensity. The company has disclosed substantial funding and an above-unicorn valuation, but no public burn-rate or runway data in the materials reviewed here. If adoption timing stretches toward the later end of the analyst window, Ayar could need additional capital before the economics of scale are proven. Governance
    risk is similarly concentrated. Ayar’s public leadership page is much deeper than an early-stage startup org chart, yet the company still appears unusually dependent on Mark Wade, Vladimir Stojanovic, and Chen Sun for commercial, architectural, and scientific continuity. That is a strength until it becomes a single-point dependency.'
