evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      A complete board matrix with committees, independence status, director start dates, and share ownership or
      observer rights.
    whyItMatters: >-
      The leadership table is intentionally partial because late-stage governance quality cannot be judged from names
      alone.
    diligencePath: >-
      Request the current board deck, cap table governance summary, and any board or observer rights letters from the
      Series E round.
    relatedQuestionRefs:
      - QO008
      - QO013
      - QO028
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-ownership
    missingEvidence: >-
      Ownership percentages, liquidation preferences, pro-rata positions, and commercial side letters for the main
      investors and strategic stakeholders.
    whyItMatters: >-
      The stakeholder map identifies economically important parties, but without cap-table data it cannot show control
      or dilution risk with precision.
    diligencePath: >-
      Obtain the latest financing documents and cap-table summary, then reconcile them against public investor
      announcements.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO028
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-disclosure
    missingEvidence: A verified current employee count by geography and function.
    whyItMatters: >-
      Scale must otherwise be inferred from office expansion and hiring language, which is a weak substitute for
      operating data.
    diligencePath: Ask management for a current org snapshot or HR system export covering total headcount and the Taiwan expansion.
    relatedQuestionRefs:
      - QO020
      - QO028
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Current revenue, run-rate, or shipment-derived commercial volume with at least one reconciliation to disclosed
      milestones.
    whyItMatters: >-
      Late-stage valuation and commercialization readiness cannot be judged cleanly without some revenue or shipment
      conversion metric.
    diligencePath: >-
      Request monthly bookings, shipments, revenue, and backlog by customer cohort and compare them against the Series
      C/D/E milestone narrative.
    relatedQuestionRefs:
      - QO021
      - QO022
      - QO028
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A bottoms-up 2026-2030 model that separates switch-side CPO, accelerator-package optical I/O, optical-engine
      content, and full module/system value using actual port, attach-rate, and ASP assumptions.
    whyItMatters: >-
      Public market estimates currently mix incompatible scopes, which is why the 2026 range spans more than 3x. Without
      harmonized scope, TAM/SAM/SOM judgments can overstate Ayar's true capture opportunity.
    diligencePath: >-
      Obtain full LightCounting and Dell'Oro forecast workbooks or customer port plans, then reconcile them to a single
      taxonomy for module, engine, and package-level spend.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: company-som
    missingEvidence: >-
      Current Ayar design-win count, customer qualification stage, optical-engine pricing, and attach-rate assumptions
      by target segment.
    whyItMatters: >-
      Public sources are sufficient to build a product-near market proxy, but not to translate that proxy into a
      credible Ayar-specific SOM or revenue ramp.
    diligencePath: >-
      Request customer pipeline, package qualification milestones, and pricing ranges under NDA; then map each
      opportunity to switch-side versus accelerator-side adoption paths.
    relatedQuestionRefs:
      - QM006
      - QM020
      - QM026
  - type: missing-source
    severity: material
    topic: scale-up-vs-scale-out-split
    missingEvidence: >-
      A public dataset that cleanly splits optics demand, ports, or spend between scale-out and scale-up AI networks
      across hyperscalers.
    whyItMatters: >-
      Ayar is more levered to scale-up than generic optics demand, so missing this split makes it difficult to estimate
      how much of the broad AI-optics market is actually relevant.
    diligencePath: >-
      Collect hyperscaler architecture disclosures, switch port maps, and analyst channel checks that isolate
      NVLink/UALink-like fabrics from Ethernet scale-out fabrics.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: minor
    topic: optics-unit-economics
    missingEvidence: >-
      A current public $/Gbps decline curve for 800G, 1.6T, LPO, and package-level optical-engine alternatives used in
      AI clusters.
    whyItMatters: >-
      Public commentary confirms power and density advantages, but limited price transparency makes it hard to quantify
      the exact point at which chiplet optics become economically dominant.
    diligencePath: >-
      Use supplier quotations, teardown data, and paid transceiver ASP datasets to build a comparable $/Gbps and W/Gbps
      framework for pluggables, LPO, and optical engines.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: Cisco overlap
    missingEvidence: >-
      A current Cisco or Acacia source that explicitly details a production CPO roadmap for in-package compute or switch
      optical I/O.
    whyItMatters: >-
      Current retained Cisco evidence is stronger on optics portfolio and AI scale-out than on a direct Ayar-style
      package roadmap, which keeps Cisco in the adjacent rather than direct bucket.
    diligencePath: >-
      Review Cisco OFC 2026 materials or Acacia product announcements for explicit CPO package-integration milestones
      and named deployments.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: private startup pricing
    missingEvidence: >-
      Normalized pricing, unit-volume and gross-margin disclosures for Ayar, Lightmatter, Celestial AI and Ranovus
      products.
    whyItMatters: >-
      Without price and shipment transparency, capital raised is only a rough proxy for competitive staying power and
      does not prove cost competitiveness.
    diligencePath: >-
      Request customer or partner pricing sheets, paid analyst reports, or procurement disclosures that benchmark
      optical-engine ASPs and deployment volumes.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
      - TP004
  - type: missing-source
    severity: material
    topic: named production wins
    missingEvidence: >-
      Named hyperscaler, XPU or switch production wins for Ayar and the closest private peers beyond general traction
      language.
    whyItMatters: >-
      Design-win specificity is the strongest external proof of switching costs and real commercial momentum in a market
      that is still pre-volume for many vendors.
    diligencePath: >-
      Review partner press releases, hyperscaler conference talks, and procurement disclosures for named production
      deployments rather than validation language.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat durability
    missingEvidence: >-
      Independent evidence on whether Ayar's package-depth lead is materially harder to replicate than Intel, Marvell,
      NVIDIA or Broadcom alternatives.
    whyItMatters: >-
      The investment case depends on Ayar owning a durable optical-I/O wedge rather than simply pioneering a feature
      incumbents can absorb.
    diligencePath: >-
      Interview packaging partners, foundries, or paid analyst sources on qualification cycles, IP defensibility, and
      replication difficulty for external-laser CPO architectures.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: material
    topic: exact-series-d-post-money-valuation
    missingEvidence: The exact post-money valuation and capitalization table line for the December 2024 Series D close.
    whyItMatters: >-
      Public sources only say valuation was above $1 billion, which is not precise enough for dilution or step-up
      analysis.
