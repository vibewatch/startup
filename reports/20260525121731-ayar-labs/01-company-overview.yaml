  - calloutType: insight
    title: Wiwynn changes the story from chiplet proof to rack design
    body: >
      The March 2026 Wiwynn partnership matters because it reframes Ayar from a component company into
      a system-architecture participant. The disclosed target — 1,024 accelerators with rack-level
      liquid cooling, fiber management, and serviceable laser modules — is materially closer to a
      hyperscaler purchasing unit than earlier package-only demos.
    claimRefs:
      - CO028
      - CO029
      - CO042

  - calloutType: risk
    title: Rack-scale CPO still has a serviceability and deployment hurdle
    body: >
      Independent coverage highlights the main adoption risk: co-packaged optics reduces copper
      bottlenecks but increases operational complexity around liquid cooling, fiber routing,
      manufacturability, monitoring, and failure blast radius. Ayar’s valuation now assumes this gap
      can be crossed, but public evidence still points to a transition in progress rather than a
      completed hyperscale rollout.
    claimRefs:
      - CO038
      - CO039
      - CO041
      - CO044

