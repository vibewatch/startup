company:
  name: Ayar Labs

chapter:
  number: 1
  title: Company Overview
  summary: >
    Ayar Labs is a Silicon Valley silicon-photonics company building co-packaged optical I/O for AI
    scale-up, centered on its TeraPHY optical engine and SuperNova remote light source. Since
    co-founder Mark Wade became CEO in late 2023, the company has moved from component demos and
    ecosystem partnerships into a March 2026 Series E-funded push toward volume production, Taiwan
    expansion, and rack-scale reference systems with Wiwynn. The strategic opportunity is large, but
    commercialization still depends on hyperscaler deployment, rack serviceability, and the broader
    pace of co-packaged optics adoption.

sections:
  - id: business-identity
    title: Business Identity & Core Product
    body: >
      Ayar Labs presents itself as a co-packaged optics company focused on the data-movement problem
      inside AI infrastructure. Public company materials consistently describe the business as founded
      in 2015 and focused on replacing copper and pluggable-optics bottlenecks with optical I/O that
      can be integrated directly into accelerator, CPU, GPU, switch, and other advanced packages.
      The commercial system is built around two tightly-coupled elements: the TeraPHY optical engine
      and the SuperNova multi-wavelength remote light source. In current product positioning, Ayar
      claims this optical I/O stack enables 5x-10x higher bandwidth, roughly 10x lower latency, and
      materially better power efficiency than traditional pluggable optics plus electrical SerDes,
      while extending communication reach from millimeters to kilometers. The company’s own current
      home-page language has also shifted from a component-only story toward an AI scale-up platform
      story: current materials market “beyond the rack” connectivity, advertise greater than 8 Tbps
      per optical engine, and frame thousands of GPUs operating as a unified system as the intended
      end state. Technical pages reinforce that the solution is standards-oriented rather than fully
      bespoke, with current AIB support, a next-generation UCIe path, and CW-WDM MSA alignment.
      That positioning matters because Ayar is not just selling a photonics part; it is trying to
      become the optical interconnect layer for next-generation AI packages, racks, and disaggregated
      memory architectures.
