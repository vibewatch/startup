  - id: milestones-and-scale-up
    title: Milestones & Current Scale-Up Trajectory
    body: >
      The company’s milestone path shows a repeated pattern: DARPA-linked technical validation first,
      ecosystem proof second, and system-level scale-up only now emerging as the 2026 story. Ayar’s
      historical narrative runs back to DARPA’s POEM work on photonic communications inside and
      between processors, then into the PIPES effort, where Ayar and Intel demonstrated optical I/O
      on an advanced FPGA package. Later milestones are more explicitly commercial: the 2022 Series C
      tied financing to first volume commercial shipments under contract; the 2023 Intel FPGA showcase
      publicized a 4 Tbps bi-directional demonstration; the December 2024 Series D framed optical I/O
      as commercial-ready and aligned with customer roadmaps; and the July 2025 Taiwan expansion was
      presented as preparation for high-volume manufacturing. The March 2026 Series E and Wiwynn
      announcements then pushed the story one level higher, from chiplet and package readiness to a
      rack-scale reference architecture designed for 1,024 accelerators and more than 100 Tbps of
      optical connectivity per accelerator. That sequencing is important. Ayar’s public evidence is no
      longer limited to device-level or single-package performance claims; it now includes a plausible
      path from package integration to deployable hyperscale rack systems.
