callouts:
  - calloutType: strength
    title: Ecosystem density is a core strategic asset
    body: >
      Ayar’s strongest company-overview signal is not any single metric; it is the repeated presence
      of foundry, systems, AI, and defense partners across financing and commercialization milestones.
      The same narrative thread runs through Series C, Series D, Series E, HPE, NVIDIA,
      GlobalFoundries, Intel, Lockheed Martin, and Wiwynn.
    claimRefs:
