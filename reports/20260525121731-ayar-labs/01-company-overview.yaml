  - id: risks-and-gaps
    title: Adoption Risks & Remaining Disclosure Gaps
    body: >
      The main company-overview risk is not whether Ayar has interesting technology; it is whether the
      technology can move through the full reliability, serviceability, and hyperscaler-deployment
      gauntlet quickly enough to justify late-stage private valuations. Ayar’s own materials now call
      the solution proven and production-ready, but independent reporting still frames 2026 as a
      transition period rather than a completed hyperscale deployment story. The Register’s March 2026
      reporting is especially useful as an adverse lens because it surfaces the operational details
      that company press releases downplay: liquid-cooling interactions, optical-fiber routing,
      manufacturability, telemetry requirements, and the larger “blast radius” if a co-packaged
      optical engine fails compared with a swappable pluggable optic. DARPA and Laser Focus World also
      remind readers that the industry’s long-run target state — 100 Tbps-plus optical I/O at very
      low energy per bit — remains a development journey, not a finished market fact. On disclosure,
      Ayar still withholds exact headcount, named customer deployments, revenue, ownership breakdown,
      and committee-level governance details. For diligence purposes, that means scale must be inferred
      from fundraising, facility expansion, technical milestones, and partner density rather than from
      standard late-stage operating metrics.
