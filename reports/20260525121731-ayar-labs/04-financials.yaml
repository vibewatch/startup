- id: non-dilutive-funding-capital-efficiency-verdict
  title: Non-Dilutive Funding & Capital Efficiency Verdict
  body: 'Ayar''s non-dilutive story is material enough to matter, but not complete enough to close the underwriting gap. The company traces its roots to DARPA-funded research, disclosed a DARPA PIPES grant in 2019, and later won a $15 million DoD Project KANAGAWA OTA. Those programs likely helped de-risk technology maturation, yet they do not eliminate venture dependence. Public adverse commentary on co-packaged optics also matters financially: industry analysts and infrastructure observers still question serviceability, vendor lock-in, repair complexity, and the timing of broad deployment, often describing CPO as inevitable but not imminent. That matters because Ayar''s capital base has moved faster than its public operating disclosure. The financial verdict, therefore, is positive on strategic relevance and fundability but cautious on underwriting: Ayar looks financeable, not yet financially transparent.'
