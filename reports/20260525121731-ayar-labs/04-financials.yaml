  rows:
  - - Product sales of TeraPHY and SuperNova
    - Sale of optical I/O chiplets and light sources into compute and interconnect programs
    - Per chiplet/system or program contract; pricing undisclosed
    - Public pages position both products as the commercial offering, but no ASP or booked revenue is disclosed
    - Early-commercial with low visibility
    - Provide audited revenue by product line, customer program, and quarter
  - - Evaluation kits and engineering samples
    - Qualification kits and sample hardware allocated to prospective production customers
    - Kit/sample pricing not public
    - Evaluation kit allocations are prioritized for customers with long-term commercial agreements
    - Qualification-stage and difficult to forecast
    - Disclose sample-to-production conversion rates, support burden, and average contract size
  - - Joint development and commercialization work
    - Partner-led integration, co-design, and ecosystem development with strategic backers
    - Milestone or engineering-payment terms undisclosed
    - HPE, NVIDIA, Intel/DoD, and other collaborations are public, but accounting treatment is not
    - Mixed; may support adoption without being recurring product revenue
    - Clarify NRE, milestone revenue, and any reimbursed engineering work
  - - Volume commercial supply under customer roadmaps
    - Scaling hardware shipments into long-term commercial agreements and customer manufacturing plans
    - Multi-year supply agreements, unit terms undisclosed
    - Ayar disclosed first volume commercial shipments in 2022 and later framed Series D around high-volume manufacturing
    - Potentially attractive, but timing and backlog remain opaque
    - Provide backlog, contracted volumes, conversion milestones, and revenue-recognition policy
