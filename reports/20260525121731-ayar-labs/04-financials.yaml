  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact-series-d-post-money-valuation
    missingEvidence: The exact post-money valuation and capitalization table line for the December 2024 Series D close.
    whyItMatters: Public sources only say valuation was above $1 billion, which is not precise enough for dilution or step-up analysis.
    diligencePath: Request the signed Series D financing memo, cap table, or board materials showing exact post-money valuation and share count.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: revenue-arr-disclosure
    missingEvidence: Audited revenue or ARR by quarter, customer stage, and product line.
    whyItMatters: Without disclosed revenue, investors cannot test whether sampling and first shipments are becoming a repeatable commercial engine.
    diligencePath: Request monthly or quarterly revenue by product, backlog, and revenue-recognition policy for samples, kits, and volume shipments.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI001
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-ebitda
    missingEvidence: Current gross margin, contribution margin, and EBITDA/operating margin for Ayar Labs.
    whyItMatters: Hardware investors need margin structure to judge whether strategic customer adoption can translate into attractive unit economics.
    diligencePath: Request product-level gross margin, manufacturing cost breakdown, and an adjusted EBITDA bridge for the most recent twelve months.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Cash balance, monthly burn, capex cadence, and runway by scenario.
    whyItMatters: Capital adequacy cannot be underwritten from financing headlines alone when manufacturing scale-up may consume cash unevenly.
    diligencePath: Request a monthly cash bridge, capex vs opex split, and management's base/downside runway model through volume-production milestones.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: headcount-financial-link
    missingEvidence: A management-confirmed current headcount and hiring plan tied to functions and spending.
    whyItMatters: Without a credible headcount denominator, outside investors cannot test burn-per-employee or revenue-per-employee efficiency.
    diligencePath: Request current FTE count by function, planned hires by quarter, and fully loaded personnel cost assumptions.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: enumeration-incomplete
    severity: material
    topic: investor-cap-table-completeness
    missingEvidence: A full legal cap table including SPVs, follow-on vehicles, and ownership percentages for named investors.
    whyItMatters: The public investor table captures principal named backers but cannot show concentration, board control, or pro-rata behavior.
    diligencePath: Request the current cap table, board observer list, and ownership by investor family before inferring governance from public press releases.
    relatedTableRefs:
    - TI003
