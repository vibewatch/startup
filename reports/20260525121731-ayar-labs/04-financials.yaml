- id: funding-rounds-capital-structure
  title: Funding Rounds & Capital Structure
  body: 'Ayar''s capital structure is equity-led, with major disclosed rounds totaling roughly $369 million across Series A, B, C/C1, and D. The 2024 Series D added $155 million and publicized valuation language of above $1 billion, but no exact post-money figure. Earlier rounds show a stepwise pattern: $24 million Series A in 2018, $35 million Series B in 2020, $130 million Series C in 2022, and a $25 million C1 extension in 2023. Outside equity, Ayar also disclosed a $3 million SVB term loan and government-backed funding tied to DARPA and DoD programs. The underwriting implication is that Ayar has historically funded commercialization through repeated venture infusions plus selective non-equity support, not through publicly visible operating cash generation. The key financial question for 2026 is therefore less whether Ayar can raise capital—its record says yes—and more whether commercialization can reduce dependence on the next financing cycle.'
