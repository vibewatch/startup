- id: unit-economics-adequacy-disclosure-gaps
  title: Unit Economics, Capital Adequacy & Disclosure Gaps
  body: 'The weakest part of Ayar''s public financial file is operating disclosure. Reviewed sources do not provide revenue, ARR, gross margin, EBITDA, cash balance, monthly burn, runway, or a management-confirmed headcount that would support efficiency ratios. What is public are directional unit-economics signals: optical I/O is marketed on bandwidth, latency, and power savings; the company has disclosed long-term commercial agreements, first commercial shipments, and hiring plans; and Series D proceeds were framed around high-volume manufacturing. Those clues suggest heavy commercialization spend and capital intensity, but they do not let an outside investor convert Ayar into a reliable revenue bridge or cash-runway model. The result is a diligence posture built on nulls where the critical underwriting metrics should be. For a late-venture hardware company, that is not fatal—but it does make the next financing trigger impossible to model with precision from public evidence alone.'
