        - label: Partner concentration
          values: [medium, high, partial, medium-high]
        - label: Portfolio loss and return opacity
          values: [medium, high, low, high]
    approximationNotes: "Likelihood and mitigation maturity are qualitative analytical ratings based on the retained public evidence; no numeric probability or loss estimate is implied."
    claimRefs: [CR003, CR004, CR009, CR011, CR012, CR014]
