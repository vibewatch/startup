companyProfile:
  summary: >-
    Micro Connect is a Hong Kong-based private fintech and market-infrastructure company founded around revenue-linked
    financing for China's micro and small businesses. Its public model combines Daily Revenue Obligations with digital
    revenue collection, contract valuation, and the MCEX venue, while the retained evidence leaves current economics and
    portfolio outcomes unverified.
