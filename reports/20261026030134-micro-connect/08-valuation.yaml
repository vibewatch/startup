schemaVersion: "report-v2"
artifact: valuation
slug: micro-connect
runDate: 2026-10-26
company:
  name: Micro Connect
chapter:
  number: 8
  title: Valuation
  summary: >-
    Micro Connect has a differentiated cash-flow investment infrastructure thesis, but the
    available evidence does not support a current valuation range or price endorsement.
    The recommendation is Track / Research More with low confidence and high risk until
    audited economics, asset-vintage performance, liquidity, and current financing terms
    are disclosed.
sections:
  - id: decision-and-valuation-context
    title: Decision and valuation context
    body: >-
      The evidence supports a Track / Research More recommendation, not an invest-at-any-price
      conclusion. A company-attributed 2023 report placed the US$458 million Series C at a
      US$1.7 billion post-raise valuation, while Caplight still estimates US$1.7 billion and
      lists US$603 million of total funding. Caplight also identifies debt dated February 5,
      2024 as the latest round on its public page. Those figures are financing references,
      not proof of present fair value: no retained source supplies current audited revenue,
      margin, cash burn, runway, cap-table terms, or a transaction-level secondary price.
      Confidence is therefore low, risk is high, and valuation stance is indeterminate
      pending private diligence rather than “fair” or “cheap” on a stale headline mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV016]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The investable thesis is that Micro Connect is building infrastructure around measurable
      contract cash flows rather than extending conventional equity or debt. Its 2024 protocol
      introduced a price-to-net-contract-payout ratio, and the same report said institutional
      investors had deployed nearly RMB4 billion across more than 10,000 stores in 270 Chinese
      cities by year-end 2023. The anti-thesis is equally material. Scale at the underlying
      store level does not establish Micro Connect Group revenue, profitability, realized
      investor returns, or durable secondary liquidity. A low-reputation automated analysis
      also characterized the proposition as high-risk and urged a wait-and-see approach because
      of regulatory, credit, and execution uncertainty. Product differentiation is credible;
      underwriting proof remains incomplete.
    claimRefs: [CV009, CV010, CV014, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      Scenario work must remain conditional because the public evidence cannot anchor a DCF,
      revenue multiple, or asset-management earnings multiple. Caplight labels Lufax, Ant Group,
      and Pipe as similarity comparables, but its public page provides no operating-multiple
      comparison; those labels are not a valuation benchmark. The bull case requires audited
      company economics, stable vintage losses and realized returns, repeat institutional
      capital, and demonstrated liquidity. The base case treats the 2023 US$1.7 billion mark
      only as historical context while requiring a fresh priced transaction and full preference
      stack before underwriting. The bear case combines weak underlying cash flows, regulatory
      friction, thin liquidity, and a financing reset. No probability or valuation range is
      assigned because doing so would turn missing private data into false precision.
    claimRefs: [CV001, CV006, CV007, CV009, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence
    body: >-
      Exit readiness is not yet demonstrated. MCIF's Chapter 21 application expired after six
      months, and Charles Li suspended that IPO route in favor of a private fund; the group
      planned to commit US$100 million and seek additional private capital. EquityZen describes
      a possible private-share route sourced from existing shareholders, but that is not evidence
      of available inventory, price discovery, or dependable liquidity. Current NUMA materials
      also restrict participation to offshore professional investors using licensed intermediaries
      and describe NUMA as market infrastructure rather than an exchange. Before investment,
      diligence should obtain audited group financials, cohort loss and return data, current
      cap-table and preference terms, secondary turnover, regulatory opinions, and a credible
      exit pathway with measurable milestones.
    claimRefs: [CV006, CV007, CV008, CV011, CV012, CV015, CV016]
    figureRefs: [FV001]
tables:
