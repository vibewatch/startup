    claimRefs: [CV001, CV002, CV006, CV008, CV010, CV016]
callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      Micro Connect may merit continued diligence, but the retained evidence cannot establish
      what investors are being asked to pay today or whether that price compensates for credit,
      regulatory, liquidity, dilution, and execution risk.
    claimRefs: [CV014, CV016]
