    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, "Track / Research More", "Do not endorse a price before private-data diligence"]
      - [Confidence, Low, "Public evidence is insufficient for a current valuation method"]
      - [Risk rating, High, "Require downside protection and milestone-based underwriting"]
      - [Valuation stance, Indeterminate, "Treat US$1.7B as a historical/estimated reference, not fair value"]
      - [Entry decision, Conditional, "Reassess only with audited economics, current terms, and liquidity proof"]
    notes: "Assessment as of 2026-10-26; the US$1.7B references are a 2023 company-attributed financing mark and a current Caplight estimate, not an independently verified transaction price."
    claimRefs: [CV001, CV002, CV003, CV004, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "A protocol and market infrastructure for valuing contract cash flows may create a differentiated asset class.", "Audited issuer economics plus repeat institutional demand and realized returns"]
      - [Anti-thesis, "Store-level deployment scale does not establish group profitability, credit outcomes, or liquid exits.", "Transparent vintage losses, net investor returns, and secondary turnover"]
      - [Regulatory boundary, "Current NUMA materials limit access to offshore professional investors through licensed intermediaries.", "Counsel-grade confirmation of durable cross-border portability"]
    notes: "The thesis is conditional; company-issued protocol claims and third-party scale reporting do not substitute for audited financial or return data."
    claimRefs: [CV009, CV010, CV011, CV012, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Key risk, Probability signal]
    rows:
      - [Bull, "Audited growth and margins; stable vintage losses; repeat capital; proven liquidity", "No range assigned; apply a model only after current financials and terms are verified", "Execution and regulatory portability", "Not assigned—public evidence is insufficient"]
      - [Base, "Platform remains active but group economics and transaction liquidity stay private", "Use the 2023 US$1.7B mark only as historical context and negotiate from current evidence", "Stale price anchor and dilution", "Not assigned—requires a fresh priced transaction"]
      - [Bear, "Weak cash-flow vintages, regulatory friction, thin liquidity, or delayed capital formation", "Assume material impairment or down-round risk; no precise haircut is supportable", "Capital loss and blocked exit", "IPO suspension is a negative observable signal"]
    notes: "These are conditional diligence scenarios, not forecasts; no probabilities, valuation ranges, or target returns are asserted without audited inputs."
    claimRefs: [CV001, CV006, CV007, CV009, CV013, CV014, CV015, CV016]
