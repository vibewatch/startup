  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Three independently verifiable named merchant references with production status and measurable outcomes.
      whyItMatters: The current evidence is portfolio-level and cannot validate customer value or deployment quality.
      diligencePath: Request consented references, redacted contracts, and payment records across food and beverage, retail, and services.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Cohort-level merchant and investor retention, renewal, loss, and repeat-participation data.
      whyItMatters: Adoption totals do not prove recurring customer demand or cash-flow durability.
      diligencePath: Obtain a reconciled cohort file through 2026-10-26 with definitions, denominators, and vintage-level outcomes.
      relatedQuestionRefs: [QU004, QU007]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-customer, top-partner, top-geography, and top-investor concentration schedules.
      whyItMatters: Broad coverage can mask economically material dependence on a few counterparties or sectors.
      diligencePath: Request top-10 and top-20 exposure tables plus partner attribution and contractual concentration limits.
      relatedQuestionRefs: [QU006]
    - type: stale
      severity: minor
      topic: adoption
      missingEvidence: A current 2026 operating series reconciling stores, merchants, investments, active contracts, and DRO turnover.
      whyItMatters: Existing figures are historical and use non-equivalent units.
      diligencePath: Reconcile monthly operating metrics to one definition and publish as-of dates and denominator notes.
      relatedQuestionRefs: [QU002, QU008]
