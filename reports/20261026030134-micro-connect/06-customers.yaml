schemaVersion: "report-v2"
artifact: customers
slug: micro-connect
runDate: 2026-10-26
company:
  name: Micro Connect
chapter:
  number: 6
  title: Customers
  summary: Micro Connect has reported rapid expansion of its small-business asset base and institutional investor network, but the public record does not identify enough merchants or disclose retention, repeat-investor, or concentration denominators to underwrite customer durability.
sections:
  - id: customer-model
    title: Buyer, user, and payer architecture
    body: >-
      Micro Connect serves two linked customer groups rather than a single software buyer. Small businesses supply operating cash flows and seek growth capital; professional and institutional investors buy exposure to those cash flows; Micro Connect operates the exchange, fund, and structured-product infrastructure between them. The company describes Daily Revenue Obligations as standardized contracts on daily business revenue, with repayment collected through an Automated Repayment Mechanism and supported by partnerships with brands, franchises, financial institutions, and SaaS companies. This creates a multi-sided adoption problem: merchant onboarding, data and payment integration, investor underwriting, and secondary-market liquidity must all scale together. The public evidence confirms the model's architecture, but not customer-level economics, renewal behavior, or the share of capital coming from repeat participants.
    claimRefs: [CU001, CU002, CU003, CU004, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Reported adoption and operating scale
    body: >-
      Reported adoption has moved from more than 100 investments in 2022 to more than 10,000 stores in 270 Chinese cities by the end of the period described in a later market-standard account, while a Macao Daily Times account reported more than RMB4.4 billion invested across more than 13,000 merchants in over 200 cities. Micro Connect's own current company page separately lists a 2023–2024 milestone of surpassing 10,000 stores and cumulative deployment above RMB4.6 billion by 2024. These figures indicate asset-side breadth, but they are not a clean cohort series: the sources use different units (investments, stores, merchants, and deployment), dates, and denominators. No public source in this pool gives active-use rates, churn, renewal, realized losses, or repeat-investor rates.
    claimRefs: [CU005, CU006, CU007, CU010, CU015]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, outcomes, and durability
    body: >-
      The strongest public proof is portfolio-level rather than customer-level. The available sources describe broad categories such as food and beverage, retail, services, culture, sports, consumer retail, and e-commerce, and a launch account identifies 39 SPVs and 25 SPACs as initial listings, but it does not name operating merchants or provide customer-quoted outcomes. That distinction matters: a merchant count can show origination and exposure, while it cannot establish production deployment quality, repayment performance, or customer satisfaction. Likewise, a broad market forecast and reported institutional participation are not evidence of repeat investment. Until Micro Connect provides anonymized cohort tables or independently verifiable named references, customer durability remains a material diligence gap.
    claimRefs: [CU008, CU009, CU012, CU013, CU015]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion loops and concentration risks
    body: >-
      The proposed expansion loop is visible in the product design: standardize a merchant's revenue contract, distribute it to professional investors, collect daily revenue shares, and use observed cash-flow data to support additional financing or market participation. The official NUMA release also limits participation to offshore professional investors through licensed intermediaries and excludes retail investors, which narrows the addressable investor channel but may support a controlled distribution model. The public record does not disclose customer concentration, channel concentration, contract length, renewal rates, merchant attrition, investor exits, or secondary-market turnover. The lapsed Chapter 21 listing and move to a private-fund model are not customer churn evidence, but they show that fundraising and deployment speed can affect the platform's expansion path.
    claimRefs: [CU002, CU004, CU011, CU014, CU016]
tables:
  - id: TU001
    title: Customer segmentation by role
    columns: [Segment, Buyer/user/payer, Use case, Reported scale or value, Diligence gap]
    rows:
      - [Merchant and small-business operators, "User and recipient of growth capital", "Convert operating revenue into a standardized DRO or related contract", "More than 10,000 stores / more than 13,000 merchants reported in different accounts", "Named references, active-contract share, repayment and renewal data"]
      - [Institutional and professional investors, "Buyer of revenue-linked investment exposure", "Subscribe to DROs or related products and receive revenue-share distributions", "More than 50 investor members reported for MCEX; institutional participation also reported", "Repeat subscriptions, realized returns, exits, and concentration by investor"]
      - ["Brands, franchises, financial institutions, SaaS companies, and licensed intermediaries", "Partner or channel supporting onboarding, data, distribution, or access", "Automated repayment, asset standardization, market distribution, and regulated access", "Partnership role is described; partner-level volumes are not disclosed", "Counterparty list, economics, exclusivity, and failure contingencies"]
    notes: Customer roles and scale use different dates and units from the cited sources; null or undisclosed items are diligence gaps rather than zero values.
    claimRefs: [CU001, CU003, CU006, CU007, CU014]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Period or date basis, Source confidence, Implication, Missing denominator]
    rows:
      - [Investments in micro and small businesses, ">100", "Reported in the March 2022 Series B account", high, "Early asset-side origination was established", "No active-versus-completed or repayment cohort"]
      - [Stores on MCEX, "More than 10,000", "As of the end of the period described by the MAP account; source text says 'end of last year'", medium, "Indicates broad geographic and sector coverage", "Exact as-of date, active contracts, and cohort survival"]
      - [MCEX merchant footprint, "More than RMB4.4 billion across more than 13,000 merchants in over 200 cities", "Macao Daily Times account; publication date unavailable in fetched text", medium, "Shows reported scale beyond a single city or vertical", "Reconciliation to stores, deployed capital, and current active base"]
      - [Company milestone, "Surpassed 10,000 stores; cumulative deployment exceeded RMB4.6 billion by 2024", "Company overview milestone for 2023–2024", medium, "Supports a multi-year expansion narrative", "Audited definition, monthly progression, losses, and current run-rate"]
    notes: Values are reported figures, not a harmonized cohort series. The sources use investments, stores, merchants, and deployment as different units; no growth rate is derived.
    claimRefs: [CU005, CU006, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or segment, Deployment/use case, Production vs pilot, Reported outcome, Limitation]
    rows:
      - [Food and beverage merchants, "Revenue-share financing through DROs / MCEX", "Portfolio segment reported; individual deployments not named", "Included among businesses reported on MCEX", "No named merchant, contract, retention, or outcome evidence"]
      - ["Retail, services, culture, and sports businesses", "Revenue-share financing and cash-flow-linked investment", "Portfolio segments reported; individual deployments not named", "Categories reported for the MCEX asset base", "No customer quote, production status, or repayment outcome"]
      - [Consumer retail and e-commerce enterprises in initial SPV/SPAC listings, "Micro Star market structure listings", "39 SPVs and 25 SPACs reported as initial listings", "Launch account describes diverse enterprises", "No named enterprise list, customer KPI, or independent verification"]
    notes: The assigned pool contains category-level and vehicle-level evidence but no independently verifiable named merchant case study; these rows should not be read as proof of retention or customer satisfaction.
    enumerationScope:
      coverage: partial
      basis: "Publicly reported customer categories and initial listing vehicles in the assigned source pool; not a complete merchant enumeration."
    claimRefs: [CU008, CU013, CU015]
figures:
  - id: FU001
    title: Customer journey from operating cash flow to expansion
    summary: The customer system links merchant financing, institutional distribution, payment-linked collection, and potential follow-on participation, with key proof gaps at every transition.
    type: journey-map
    data:
      items:
        - label: "1"
          stage: 1
          title: Merchant onboarding
          detail: Small business supplies operating and contract information; named customer proof is not public.
        - label: "2"
          stage: 2
          title: Contract standardization
          detail: Revenue is represented as a DRO or related contract with stated cash-flow and risk terms.
        - label: "3"
          stage: 3
          title: Investor distribution
          detail: Professional and institutional investors receive exposure through MCEX or related structures.
        - label: "4"
          stage: 4
          title: Daily collection
          detail: Automated repayment is intended to route revenue shares through operating and partner infrastructure.
        - label: "5"
          stage: 5
          title: Performance observation
          detail: Cash-flow history could support underwriting, but public retention and loss cohorts are absent.
        - label: "6"
          stage: 6
          title: Follow-on expansion
          detail: Additional financing or investor participation is plausible from observed performance, but repeat behavior and turnover are undisclosed.
    claimRefs: [CU002, CU003, CU004, CU009, CU015]
callouts:
  - calloutType: strength
    title: Broad reported asset-side reach
    body: >-
      Multiple sources report a footprint above 10,000 stores or 13,000 merchants across more than 200 cities, indicating that Micro Connect has moved beyond a single-pilot customer base.
    claimRefs: [CU006, CU007, CU010]
  - calloutType: risk
    title: Scale is not durability
    body: >-
      Public disclosures do not establish active-contract rates, retention, realized losses, repeat investor behavior, or top-customer concentration, so reported origination scale should not be treated as recurring customer value.
    claimRefs: [CU015, CU016]
