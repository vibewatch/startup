      - ["MAP standard", "Price-to-net-contract-payout ratio and revenue-sharing parameters", "Valuation and risk framing for DRO contracts", "Adoption rate, model accuracy, and third-party validation", "Could reduce comparison friction if accepted beyond Micro Connect"]
      - ["MCIF private-fund route", "Private limited-partner fundraising after the listing plan was suspended", "Flexible fundraising and deployment claimed by management", "Management fee, carry, liquidity, minimum commitment, and investor concentration", "Private distribution may accelerate deployment but provides less public price discovery"]
      - ["Named online-platform peers", "No pricing disclosed in the assigned Tracxn profile", "Startup fundraising or fund-management workflows", "Fees, take rates, contract minimums, and enterprise terms", "No price-based superiority claim is supportable"]
    notes: "The assigned pool contains no verified numeric pricing schedule; 'unknown' means not disclosed in these sources, not that no fee exists."
    claimRefs: ["CP002", "CP007", "CP012"]
