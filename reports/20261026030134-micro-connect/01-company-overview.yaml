callouts:
  - calloutType: strength
    title: Distinct market-infrastructure thesis
    body: Micro Connect has paired revenue-linked instruments with a named Macao venue and is now extending the model toward contract-based financing.
    claimRefs: [CO003, CO004, CO005]
  - calloutType: risk
    title: Scale is not portfolio performance
    body: Merchant and invested-capital counts do not reveal revenue, losses, liquidity, realized investor returns, or current cash runway.
    claimRefs: [CO012, CO013, CO014, CO016]
