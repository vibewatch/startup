  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Audited revenue by stream, fee take rates, servicing costs, cohort contribution margin, and realized investor returns.
      whyItMatters: Without these inputs, financed volume and merchant counts cannot be translated into sustainable revenue or profit.
      diligencePath: Obtain audited management accounts, product-level revenue bridge, fee schedules, servicing-cost allocation, and vintage investor-return files.
      relatedQuestionRefs: [QI004, QI005, QI008]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, monthly burn, runway, debt balances, warehouse facilities, covenants, and committed but undrawn capital.
      whyItMatters: Historical funding and a proposed private-fund commitment do not establish corporate liquidity or financing dependency.
      diligencePath: Request the latest balance sheet, cash-flow forecast, debt schedule, facility terms, covenant package, and funding plan.
      relatedQuestionRefs: [QI006, QI007]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: traction
      missingEvidence: A reconciled time series defining whether reported RMB 4bn, RMB 4.4bn, 10,000 stores, and 13,000 merchants overlap.
      whyItMatters: Different scopes and dates could otherwise overstate growth or imply false precision.
      diligencePath: Obtain venue-level issuance, active-merchant, city, and cumulative-versus-period definitions by vintage.
      relatedQuestionRefs: [QI003]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: financing-dependency
