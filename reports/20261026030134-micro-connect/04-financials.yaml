schemaVersion: "report-v2"
artifact: financials
slug: micro-connect
runDate: 2026-10-26
company:
  name: Micro Connect
chapter:
  number: 4
  title: Financials
  summary: Micro Connect monetizes a contract-based financing and market-infrastructure model rather than a disclosed SaaS subscription stream. Public evidence shows meaningful capital deployment and a growing financing venue, but does not disclose revenue, gross margin, burn, runway, realized investor returns, or unit economics needed for underwriting.
sections:
  - id: revenue-mechanism
    title: Revenue mechanism and monetization
    body: >-
      Micro Connect's economic engine is built around packaging recurring cash-flow rights from micro and small businesses into investable instruments. Independent coverage describes daily revenue obligations as a right to a fraction of business revenue for a fixed period, while the company describes NUMA as infrastructure for real-world commercial contracts rather than an equity or bond replacement. This supports a transaction- and platform-economics interpretation, not an ARR assumption. Public disclosures identify the revenue-sharing ratio, contract period, daily tracking, and investor participation rules as core product mechanics, but they do not disclose the fee take rate, spread, servicing fee, or realized revenue retained by Micro Connect. Riverchain's 2026 partnership adds a working-capital origination channel for Hong Kong construction contractors, suggesting that the platform can monetize through partner-originated assets as well as the original China micro-business network. List mechanisms and reported deployment are therefore observable; realized revenue mix and recognition policy remain diligence items.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Traction, GTM, and unit economics
    body: >-
      Public traction is expressed primarily in financed businesses, merchants, cities, and investor participation rather than company revenue. The Standard reported nearly RMB 4 billion of financing for more than 10,000 stores, while Macau Daily Times reported more than RMB 4.4 billion invested across more than 13,000 merchants in over 200 cities. The publications use different labels, scope, and timing, so the figures cannot establish growth without a reconciled cohort series and cannot be treated as Micro Connect revenue, GMV, ARR, or profit. AInvest separately asserted a 15% average annual investor return, but that low-reputation, AI-generated article is not corroborated by primary evidence in the pool and is unsuitable as an underwriting input. The GTM motion appears distribution-led: licensed intermediaries and professional investors access the market, while partners such as Riverchain originate sector-specific assets. No assigned source provides CAC, payback, sales cycle, servicing cost, default rate, realized yield, repeat-investor rate, or contribution margin. Those inputs are unavailable, not zero.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      Capital access has two distinct layers: financing supplied to underlying businesses and corporate capital available to Micro Connect or its managed vehicles. The 2023 Series C announcement reported US$458 million raised and a company-stated US$1.7 billion valuation, but that is historical financing raised and valuation, not current cash available or runway. A 2025 SCMP report said the proposed MCIF listing lapsed after six months and that Micro Connect Group would commit US$100 million while seeking additional private-fund capital; the report does not establish that the commitment was funded or available to the operating company. The 2026 Riverchain announcement refers to a dedicated funding commitment without giving amount, draw conditions, or balance-sheet treatment. Micro Connect's official news index also lists a 2024 announcement for an up-to-US$200 million asset-backed loan facility, but the index does not disclose current drawings, maturities, covenants, or recourse. The assigned pool does not disclose outstanding debt, warehouse advance rates, loss reserves, cash, burn, or runway. The verdict is therefore conditional: productization and deployment are visible, but revenue quality, margin path, liquidity, and corporate capital adequacy remain material underwriting blockers.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and quality
    columns: [Stream, Mechanism, Unit or basis, Current public status, Quality and recognition caveat, Diligence ask]
    rows:
      - ["DRO/contract-based financing", "Investors acquire rights to a share of business revenue for a fixed period", "Contract cash-flow rights", "Publicly described and traded through MCEX", "Not company revenue; determine platform fee, servicing fee, and principal-versus-fee presentation", "Audited revenue bridge by product and legal entity"]
      - ["MCEX market infrastructure", "Venue and market-standard services for revenue-based instruments", "Listed/traded asset packages and investor access", "Venue launched and reported as facilitating billions of yuan of investment", "Deployment volume is not revenue or take rate", "Exchange fee schedule, settlement income, and operating cost allocation"]
      - ["Partner-originated working capital", "Riverchain originates construction working-capital assets using Micro Connect funding infrastructure", "Project-cycle working-capital assets", "Partnership announced May 22, 2026", "Funding commitment size, draw profile, credit losses, and revenue share are undisclosed", "Executed partner agreement and cohort economics"]
      - ["NUMA/CBF infrastructure", "Framework for recurring commercial-contract cash flows", "Contract-based financing infrastructure", "White paper released August 3, 2026", "Launch and framework claims do not establish commercial revenue or adoption", "Paying customer definition, pricing, pipeline, and conversion data"]
    notes: Public sources describe mechanisms and financed-asset scale; they do not disclose Micro Connect's realized revenue, fee rates, or revenue-recognition policy, and nulls mean unavailable rather than zero.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI007]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Price or contract term, List versus realized pricing, Public evidence, Unknowns, Underwriting implication]
    rows:
      - ["Revenue-sharing ratio", "No public list or realized rate in assigned sources", "MAP helps businesses identify an optimal revenue-sharing ratio", "Actual ratio by sector and cohort is unavailable", "Cannot estimate yield, fee revenue, or borrower affordability"]
      - ["Contract period", "Fixed period is part of the DRO structure", "MAP helps identify an optimal contract period", "Contract tenor distribution and renewal terms are unavailable", "Duration drives cash-flow timing and loss sensitivity"]
      - ["Investor access", "Offshore professional investors through licensed intermediaries for NUMA", "Eligibility rule is company-stated", "Intermediary fees, minimum ticket, and realized investor pricing are unavailable", "GTM and distribution economics cannot be modeled"]
      - ["Construction working-capital funding", "Dedicated funding commitment referenced by partner", "No amount or rate disclosed", "Draw conditions, advance rate, collateral, and servicing fee are unavailable", "Partner channel economics and credit exposure remain unquantified"]
    notes: These are product terms and eligibility descriptions, not realized customer prices or Micro Connect margin; no source in the pool supports a numeric fee or take-rate assumption.
    claimRefs: [CI002, CI003, CI004, CI005, CI014]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Public value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Financed asset volume", "Nearly RMB 4bn in one report and over RMB 4.4bn in another; scope and date vary", "medium", "Indicates platform activity but is not revenue", "Reconcile venue-wide volume by vintage and entity"]
      - ["Underlying businesses or merchants", "Over 10,000 stores in one report; more than 13,000 merchants in another", "medium", "Indicates reach but not active or paying customers", "Monthly active cohort, churn, repeat issuance, and concentration"]
      - ["CAC and sales payback", null, "low", "Determines whether partner/intermediary distribution scales efficiently", "Cohort CAC, channel fees, sales cycle, and payback by segment"]
      - ["Gross margin and contribution margin", null, "low", "Separates scalable infrastructure economics from servicing intensity", "Audited margin bridge including monitoring, collections, and venue costs"]
      - ["Default or loss rate", null, "low", "Determines investor returns, reserve needs, and capital intensity", "Vintage delinquency, loss, recovery, and stress data"]
      - ["Cash, burn, and runway", null, "low", "Determines corporate financing dependency and next-round timing", "Latest management accounts, cash balance, monthly burn, debt maturities, and covenant headroom"]
    notes: Values are reported operating-scale proxies where available; unavailable metrics are explicit diligence gaps and are not estimated from funding raised or financed volume.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI013, CI015, CI016]

figures:
  - id: FI001
    title: Contract cash flow to market infrastructure
    type: flow
    summary: The public model converts business cash flows into contract rights, distributes them through regulated or licensed market channels, and requires economics to be tested at the asset and platform layers.
    data:
      nodes:
        - id: business-cash-flow
          label: Business cash flow
          detail: Daily or recurring commercial receipts from micro and small businesses or partner-originated assets.
        - id: contract-right
          label: Contract-based right
          detail: DRO or similar right to a share of revenue for a fixed period.
        - id: monitoring-and-disclosure
          label: Monitoring and disclosure
          detail: Daily contract-level tracking and market-standard metrics are described publicly.
        - id: investor-channel
          label: Investor channel
          detail: Professional or institutional investors participate through market or licensed-intermediary access.
        - id: capital-deployment
          label: Capital deployment
          detail: Capital reaches underlying merchants or sector-specific borrowers through the platform and partners.
        - id: platform-economics
          label: Platform economics
          detail: Fees, servicing income, funding spread, losses, and operating costs are not publicly quantified in the assigned evidence.
      edges:
        - from: business-cash-flow
          to: contract-right
        - from: contract-right
          to: monitoring-and-disclosure
        - from: monitoring-and-disclosure
          to: investor-channel
        - from: investor-channel
          to: capital-deployment
        - from: capital-deployment
          to: platform-economics
    claimRefs: [CI001, CI002, CI003, CI004, CI005]

callouts:
  - calloutType: strength
    title: Observable financing infrastructure
    body: >-
      Public reporting supports real deployment through MCEX and a newer partner-originated channel, giving the model more operational evidence than a pure concept-stage financing narrative.
    claimRefs: [CI006, CI008, CI009]
  - calloutType: risk
    title: Corporate underwriting remains blocked
    body: >-
      No assigned source discloses current revenue, margin, cash, burn, runway, loss rates, or realized investor returns; historical funding and venue volume cannot substitute for those inputs.
    claimRefs: [CI011, CI012, CI015, CI016]

