    title: Product module and asset matrix
    columns: [Module or asset, User, Status or maturity, Differentiation, Diligence gap]
    rows:
      - [DRC, "Mainland micro and small business", "Described product", "Upfront capital exchanged for a share of daily revenue", "Need standardized contract, default, and loss statistics"]
      - [DRO, "Offshore professional investor", "Traded asset described in market coverage", "Offshore rights and benefits of a DRC", "Need legal opinions and transfer-enforceability evidence"]
      - [DRP, "International investor seeking portfolio exposure", "Portfolio structure described", "Bundles DRO interests for investment and trading", "Need liquidity, valuation, and concentration disclosures"]
      - [NUMA / CBF, "Offshore professional investor via licensed intermediary", "White paper released 2026-08-03", "Extends the framework to recurring contract cash flows beyond traditional equity and debt", "Need production implementation, governance, and independent validation"]
    notes: "Product descriptions are drawn from company, regulatory-release, and industry sources; status is not a certification of production maturity, and null diligence gaps identify missing public evidence."
    claimRefs: [CE001, CE002, CE003, CE008]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Small business obtains growth capital", "Traditional finance may not fit fragmented merchants", "Revenue-sharing contract tied to future daily receipts", "Capital access without an equity or conventional bond claim", "Public evidence does not show realized cost of capital or loss rate"]
      - ["Institutional investor accesses small-business cash flows", "Small contracts are difficult to source and compare", "DRO/DRP instruments and MCEX venue", "Centralized market structure and stated price-discovery objective", "Secondary-market depth and turnover are not publicly quantified here"]
      - ["Platform collects repayments", "Revenue is generated across many stores and partners", "Automated Repayment Mechanisms and digital infrastructure", "Potentially granular, recurring collection process", "No public uptime, reconciliation, fraud, or exception-rate disclosure"]
      - ["Investor evaluates contract risk", "Cash-flow contracts are heterogeneous", "MAP and NUMA-style standardized market language", "Comparable disclosure and risk framing are intended outcomes", "Standards are described as guides; independent validation is limited"]
    notes: "Benefits are stated as intended or described by sources, not independently measured outcomes; unavailable denominators and operating metrics remain diligence requests."
    claimRefs: [CE002, CE004, CE006, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Merchant and partner data", "Capture operating and payment signals from small businesses", "Brands, franchises, financial institutions, and SaaS partners", "Data completeness, manipulation, and partner concentration"]
      - ["Contract standardization", "Represent DRC/DRO/DRP or broader contract cash-flow rights", "Legally enforceable contracts and consistent definitions", "Misclassification, disputes, and cross-border enforceability"]
      - ["Repayment rail", "Collect and route daily revenue shares", "Automated Repayment Mechanisms and digital infrastructure", "Reconciliation, outages, fraud, and exception handling"]
      - ["Market structure", "Package, list, price, and trade rights for investors", "MCEX authorization, intermediaries, and investor eligibility", "Liquidity, valuation, and regulatory perimeter"]
      - ["AI-assisted analysis", "Process fragmented and dynamic contract information", "Digitized payment and business-operation data", "Model error, explainability, privacy, and human oversight"]
    notes: "The architecture is reconstructed from disclosed modules and operating descriptions; no source provides a complete technical diagram, service-level agreement, security assessment, or independent controls report."
    claimRefs: [CE004, CE005, CE006, CE008, CE010]

