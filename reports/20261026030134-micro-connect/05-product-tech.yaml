company:
  name: Micro Connect
chapter:
  number: 5
  title: Product & Technology
  summary: Micro Connect combines revenue-sharing contracts, automated repayment infrastructure, and a Macao market venue into a product for financing small Chinese businesses. Its newest NUMA protocol extends the concept to contract cash flows and explicitly positions AI as an information-processing aid rather than an autonomous decision-maker, but public evidence remains thinner on implementation controls, reliability, and independent technical validation.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      Micro Connect's customer-facing product is a financing and market-infrastructure
      workflow rather than a conventional software application. A small or micro business
      receives capital in exchange for an agreed share of future daily revenue; the
      resulting rights can be packaged for institutional investors through the Micro Connect
      Macao Financial Assets Exchange (MCEX). The 2022 authorization announcement describes
      Daily Revenue Contract Certificates as entitlements to daily revenue shares from
      brick-and-mortar businesses, while the 2023 industry account distinguishes DRCs,
      offshore DROs, and portfolios of DROs. This makes the product's core unit a contract
      cash-flow claim, with the venue and repayment network providing the surrounding
      operating layer rather than a simple lending dashboard.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, operating model, and maturity
    body: >-
      The operating model has several identifiable layers. Micro Connect says its
      Automated Repayment Mechanisms collect revenue shares through digital infrastructure
      operated with brands, franchises, financial institutions, and SaaS companies; the
      Macao approval release separately describes a blockchain-enabled technology platform.
      The later Micro Star description adds digital market components including RBOs, SPVs,
      SPACs, ETFs, and RBUs, while the 2026 NUMA white paper reframes the broader opportunity
      as Contract-Based Financing for recurring real-world contract cash flows. These are
      specific product assertions, not independent proof of throughput or resilience. Public
      material supports a live market structure and named instruments, but does not disclose
      service-level targets, incident history, disaster recovery, API specifications, or
      audit results.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, controls, and diligence gaps
    body: >-
      The differentiation is the attempt to standardize fragmented, non-standard contract
      cash flows into investable rights and to connect that asset layer with securities-law
      capital. The NUMA release says digitized payments and business operations make cash
      flows verifiable and that AI can process heterogeneous contract information
      continuously, while human participants retain final judgment. The model therefore
      depends on data integrity at the merchant and partner interfaces, correct allocation
      of revenue shares, investor eligibility controls, and legally durable transfer and
      settlement mechanics. A Macao executive order confirms the exchange authorization, but
      does not establish operational effectiveness or portability across jurisdictions.
      Independent coverage reports scale claims and market standards, yet public evidence
      does not establish security testing, privacy controls, uptime, loss controls, or
      repeatable performance of the repayment rails. Those omissions are material product
      and implementation risks.
    claimRefs: [CE008, CE009, CE010, CE011]

