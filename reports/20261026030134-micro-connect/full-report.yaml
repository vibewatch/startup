          'y': 5
          note: Direct operating exposure but no external market infrastructure
    approximationNotes: >-
      Coordinates are analyst-authored ordinal scores, not measured market benchmarks; they encode only the capability
      descriptions available in the assigned sources.
    claimRefs:
      - CP010
      - CP011
      - CP016
  - id: FI001
    title: Contract cash flow to market infrastructure
    type: flow
    summary: >-
      The public model converts business cash flows into contract rights, distributes them through regulated or licensed
      market channels, and requires economics to be tested at the asset and platform layers.
    data:
      nodes:
        - id: business-cash-flow
          label: Business cash flow
          detail: Daily or recurring commercial receipts from micro and small businesses or partner-originated assets.
        - id: contract-right
          label: Contract-based right
          detail: DRO or similar right to a share of revenue for a fixed period.
        - id: monitoring-and-disclosure
          label: Monitoring and disclosure
          detail: Daily contract-level tracking and market-standard metrics are described publicly.
        - id: investor-channel
          label: Investor channel
          detail: Professional or institutional investors participate through market or licensed-intermediary access.
        - id: capital-deployment
          label: Capital deployment
          detail: Capital reaches underlying merchants or sector-specific borrowers through the platform and partners.
        - id: platform-economics
          label: Platform economics
          detail: >-
            Fees, servicing income, funding spread, losses, and operating costs are not publicly quantified in the
            assigned evidence.
      edges:
        - from: business-cash-flow
          to: contract-right
        - from: contract-right
          to: monitoring-and-disclosure
        - from: monitoring-and-disclosure
          to: investor-channel
        - from: investor-channel
          to: capital-deployment
        - from: capital-deployment
          to: platform-economics
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Micro Connect's disclosed operating stack runs from merchant cash-flow data through contract rights and repayment
      infrastructure to an investor market venue.
    data:
      layers:
        - label: Cash-flow inputs
          name: Cash-flow inputs
          detail: Merchant and partner signals feed the contract and settlement workflow.
          items:
            - name: Merchant and partner data
              detail: Payment and business-operation information from small and micro businesses and their operating partners.
              value: Input
            - name: Payment and operating records
              detail: Digitized payment and business-operation records described as inputs to cash-flow verification.
              value: Input
        - label: Contract layer
          name: Contract layer
          detail: Revenue-sharing rights are represented as named instruments and protocol concepts.
          items:
            - name: DRC / DRO / DRP
              detail: Revenue-sharing contracts, offshore rights, and portfolio interests described in industry coverage.
              value: Asset
            - name: NUMA / CBF
              detail: Contract-Based Financing framework for recurring real-world contract cash flows.
              value: Protocol
        - label: Operations
          name: Operations
          detail: Repayment and contract-analysis functions operate on the disclosed data and contract layers.
          items:
            - name: Automated Repayment Mechanisms
              detail: Digital infrastructure described as collecting revenue shares with partners.
              value: Settlement
            - name: AI-assisted contract processing
              detail: Company says AI processes heterogeneous contract information while humans retain final judgment.
              value: Analysis
        - label: Market access
          name: Market access
          detail: The venue and intermediaries connect eligible investors with the contract-rights market.
          items:
            - name: MCEX / licensed intermediaries
              detail: Macao venue and access path for eligible offshore professional investors.
              value: Distribution
            - name: Investor eligibility and access
              detail: >-
                NUMA is described as limited to offshore professional investors participating through licensed
                intermediaries.
              value: Control
        - label: Control boundary
          name: Control boundary
          detail: Eligibility and human decision rights constrain access to the disclosed market and AI-assisted analysis.
          items:
            - name: Professional-investor gate
              detail: NUMA is described as unavailable to retail investors and accessible through licensed intermediaries.
              value: Eligibility
        - label: Evidence and assurance
          name: Evidence and assurance
          detail: Public disclosure supports the conceptual architecture but leaves operating-control evidence incomplete.
          items:
            - name: Independent validation gap
              detail: No retained source provides a public security, uptime, privacy, or recovery assessment.
              value: Gap
    approximationNotes: >-
      Layer order is an analytical synthesis of disclosed product components, not a company-published system diagram;
      dependencies and controls are incomplete in public sources.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE008
  - id: FU001
    title: Customer journey from operating cash flow to expansion
    summary: >-
      The customer system links merchant financing, institutional distribution, payment-linked collection, and potential
      follow-on participation, with key proof gaps at every transition.
    type: journey-map
    data:
      items:
        - label: '1'
          stage: 1
          title: Merchant onboarding
          detail: Small business supplies operating and contract information; named customer proof is not public.
        - label: '2'
          stage: 2
          title: Contract standardization
          detail: Revenue is represented as a DRO or related contract with stated cash-flow and risk terms.
        - label: '3'
          stage: 3
          title: Investor distribution
          detail: Professional and institutional investors receive exposure through MCEX or related structures.
        - label: '4'
          stage: 4
          title: Daily collection
          detail: Automated repayment is intended to route revenue shares through operating and partner infrastructure.
        - label: '5'
          stage: 5
          title: Performance observation
          detail: Cash-flow history could support underwriting, but public retention and loss cohorts are absent.
        - label: '6'
          stage: 6
          title: Follow-on expansion
          detail: >-
            Additional financing or investor participation is plausible from observed performance, but repeat behavior
            and turnover are undisclosed.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU009
      - CU015
