  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Historical financing and product-scale evidence are outweighed by missing underwriting inputs and an unproven exit
      route.
    data:
      nodes:
        - id: historical-mark
          label: 2023 financing mark
          detail: US$458M Series C; company-attributed US$1.7B valuation
        - id: current-reference
          label: Current private reference
          detail: Caplight estimates US$1.7B; no public stock price
        - id: operating-proof
          label: Product-scale evidence
          detail: Nearly RMB4B across 10,000+ stores in 270 cities by end-2023
        - id: liquidity-route
          label: Conditional liquidity
          detail: Private shares depend on existing-holder supply
        - id: exit-warning
          label: Exit warning
          detail: MCIF listing application expired; private-fund route chosen
        - id: evidence-gap
          label: Underwriting gap
          detail: No audited group economics, cap table, or transaction-level secondary evidence
        - id: recommendation
          label: Track / Research More
          detail: No current price endorsement or quantified valuation range
      edges:
        - - historical-mark
          - current-reference
        - - current-reference
          - operating-proof
        - - operating-proof
          - liquidity-route
        - - liquidity-route
          - exit-warning
        - - exit-warning
          - evidence-gap
        - - evidence-gap
          - recommendation
    approximationNotes: The flow is qualitative and does not imply probabilities, conversion rates, or value-proportional weights.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV010
      - CV016
