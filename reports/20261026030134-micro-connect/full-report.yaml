chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Forbes describes Micro Connect as Hong Kong-based and founded in 2021. Its public proposition connects
              institutional capital to micro and small businesses through Daily Revenue Obligations, instruments that
              exchange growth capital for an agreed share of daily revenue over a defined period. MCEX, launched in
              Macao in March 2023, provides the market venue for those instruments. In August 2026, the company widened
              its stated strategy through NUMA, a contract-based financing framework for recurring commercial cash
              flows. Micro Connect says NUMA is market infrastructure rather than an exchange and restricts
              participation to offshore professional investors using licensed intermediaries. The retained evidence
              supports a differentiated financing model, but not a verified registered headquarters or complete
              legal-entity map.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO010
              - CO011
              - CO013
              - CO014
              - CO016
      - number: '1.2'
        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Charles Li and Gary Zhang are the two publicly identified co-founders. Company-issued material names Li as
              chairman and Zhang as chief executive, while independent reporting links Li's credibility to his prior
              tenure leading Hong Kong Exchanges and Clearing. That background is relevant founder-market fit for
              building market infrastructure, but it also concentrates the public strategy narrative around Li. The
              retained sources do not disclose a complete board roster, executive succession plan, voting arrangements,
              related-party controls, or the allocation of operating and risk responsibilities below the founders.
              Consequently, the public record establishes leadership identity but does not establish whether governance
              and regulatory relationships are institutionalized beyond the founders.
            claimRefs:
              - CO002
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO006
      - number: '1.3'
        title: Funding, operating scale, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Independent reports place the March 2022 Series B at US$70 million and the first two rounds at US$120
              million. Forbes then reported a US$458 million Series C in August 2023 at a US$1.7 billion valuation,
              bringing total equity raised to US$578 million. The disclosed investor roster includes Baillie Gifford,
              Sequoia China, Lenovo Capital, Vectr Fintech, Dara Holdings, ABC International, and Horizons Ventures, but
              the public sources do not provide ownership percentages or preference terms. Reported platform activity
              also expanded across non-comparable snapshots: more than 2,900 stores and US$120 million funded by March
              2023; more than 10,000 stores and nearly RMB4 billion at 2023 year-end; and more than 13,000 merchants
              with over RMB4.4 billion invested in later coverage. These are activity measures, not revenue, cash, or
              investor-return metrics.
            claimRefs:
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO008
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO007
              - CO010
              - CO011
              - CO013
              - CO015
      - number: '1.4'
        title: Adverse signals and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Two adverse signals qualify the growth narrative. HK01 reported outside criticism that the daily-revenue
              model resembled high-interest P2P finance and that its cross-border structure might contain legal or
              regulatory gaps; the report also carried the founders' rebuttal, so the criticism is an allegation rather
              than a finding. Separately, SCMP reported that the MCIF Chapter 21 application expired in December 2025
              after six months and that the vehicle shifted to a private-fund route. Neither event proves misconduct or
              business failure, but each raises execution and regulatory-portability questions. Current revenue, margin,
              burn, runway, headcount, customer definitions, vintage losses, realized investor returns, and the full
              capitalization stack remain unsupported. Those gaps prevent a current operating or risk-adjusted-return
              underwriting case.
            claimRefs:
              - CO009
              - CO015
              - CO016
