  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all Chinese MSME credit. Micro Connect's operating wedge is financing for
              small, often bricks-and-mortar consumer businesses whose daily revenue can be digitally observed and
              shared with capital providers. The capital-side product is a cash-flow right distributed to institutional
              investors through market infrastructure. Included spend therefore comprises revenue-sharing or
              contract-based financing, underwriting and servicing, and associated issuance or trading infrastructure.
              Ordinary bank loans, non-bank loans, owner capital, supplier credit, equity and retained cash are
              substitutes rather than addressable revenue by default. This boundary matters because a
              multi-trillion-dollar MSME lending estimate substantially overstates Micro Connect's serviceable
              opportunity unless merchant eligibility, investor demand and platform economics are separately
              established.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM012
              - CM015
      - number: '2.2'
        title: Broad-market scale versus serviceable opportunity
        blocks:
          - type: paragraph
            body: >-
              Two independent lenses establish a large financing backdrop but not company-specific TAM, SAM or SOM.
              Research and Markets estimates China's MSME financing market at US$3.88 trillion in 2025, US$4.32 trillion
              in 2026 and about US$5.93 trillion in 2030, while an official briefing reported RMB34.42 trillion of
              inclusive micro- and small-enterprise loans outstanding at May 2025. These measures differ in currency,
              methodology, period and denominator: one is a publisher's broad market estimate and the other is a
              loan-balance statistic. They should not be added or treated as Micro Connect revenue opportunity. A
              defensible serviceable-market calculation still requires the annual financing demand of eligible digitally
              connected merchants, expected contract take-up, investor capacity and Micro Connect's fee or spread
              economics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
      - number: '2.3'
        title: Buyer, user and payer structure
        blocks:
          - type: paragraph
            body: >-
              Adoption is two-sided. Small-business operators use the financing and surrender a defined share of daily
              revenue; institutional allocators buy the resulting cash-flow exposure; intermediaries and the exchange
              connect, disclose and service the contracts. HSBC described the model as collecting daily cash flow
              through digital payments, while SCMP reported that institutional investors had deployed close to RMB4
              billion across more than 10,000 stores in 270 Chinese cities by the end of 2023. That is meaningful
              historical proof of distribution, but it does not disclose current origination volume, repeat-investor
              behavior, realized net returns or secondary turnover. Budget ownership therefore sits with merchants on
              the financing side and investment committees on the capital side, with both groups needing evidence that
              daily data and contract enforcement produce attractive risk-adjusted outcomes.
            claimRefs:
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM012
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Structural drivers include the scale of China's small-business economy, continued growth in formal MSME
              financing, widespread digital payments and policy efforts to improve credit access. The same evidence also
              shows strong substitutes: average rates on newly issued inclusive micro- and small-enterprise loans were
              3.69% in May 2025, so Micro Connect must win on access, flexibility or risk sharing rather than market
              growth alone. Constraints are material. A low-tier secondary source reports sharp volatility in a
              representative fund's annualized returns, an AI-generated market commentary flags liquidity, fraud and
              macro sensitivity, and the planned Chapter 21 vehicle lapsed before shifting to a private-fund route. New
              SME payment protections may improve merchant cash conversion, but they do not prove DRO repayment or
              liquidity. Valuation should therefore be anchored to verified repeat capital, cohort performance and
              monetized volume, not the broad-market forecast.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad TAM is not an investable SOM
            body: >-
              Public sources support a large MSME financing category, but none isolates the eligible merchant pool,
              annual DRO origination capacity, investor allocation ceiling, current secondary liquidity or Micro
              Connect's take rate.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than fintech peers
        blocks:
          - type: paragraph
            body: >-
              The closest public database classification is too broad to be decision-grade: Tracxn places Micro Connect
              among hundreds of online investment platforms and names FundersClub, AngelList, and iAngels as leading
              comparables, even though their described products focus on startup fundraising or venture-fund services
              rather than exchange-traded claims on micro-business revenue. The buyer's practical alternatives are
              therefore better framed as classes: bank credit, private funds, online capital-raising platforms, retained
              cash or internal underwriting, and Micro Connect's own DRO/MCEX structure. This wider frame avoids
              treating database similarity as product substitutability. It also exposes a material evidence gap: the
              assigned pool contains no primary documentation from a direct revenue-based-financing rival and no
              comprehensive competitor census.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP014
              - CP016
      - number: '3.2'
        title: Infrastructure breadth is the differentiator, but not yet proof of defensibility
        blocks:
          - type: paragraph
            body: >-
              Micro Connect combines a funding instrument, a trading venue, valuation conventions, and revenue
              collection rather than offering only a marketplace listing or fund-administration layer. Independent
              reporting describes MCEX as a licensed venue for DROs and reports more than 50 institutional investor
              members, while later reporting on the Micro Star structure describes portfolios, collective accounts,
              exchange-traded facilities, and revenue-based units. That breadth may create distribution and workflow
              advantages because businesses, intermediaries, and investors interact through one operating stack.
              However, reported participant and merchant counts largely trace to company or exchange disclosures, and
              the pool provides no independent evidence on repeat participation, bid-ask depth, turnover, or realized
              investor outcomes.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: Commercial terms and switching costs remain opaque
        blocks:
          - type: paragraph
            body: >-
              Public material explains the mechanism but not the price. MAP is described as helping investors value
              expected cash flow and helping businesses select a revenue-sharing ratio and contract period, but the
              assigned sources disclose no standardized list price, realized take rate, servicing fee, spread, discount
              schedule, or contract-level return distribution. The daily collection and disclosure workflow could create
              switching costs once a merchant, brand, intermediary, and investor have integrated their data and payment
              processes. That is an inference, not demonstrated retention evidence. The same infrastructure could become
              a moat if liquidity and performance compound, or a costly operating burden if investors multi-home,
              underwriting is replicated, or transaction activity remains shallow.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP012
      - number: '3.4'
        title: Execution and market-structure risk dominate the competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is not a named rival's product launch but a financing-channel setback.
              MCIF's Chapter 21 listing application expired after six months, and management shifted the vehicle to a
              private-fund route while retaining the possibility of a later listing. SCMP also noted that no company had
              successfully listed under that regime. This does not invalidate MCEX or the DRO model, but it shows that
              distribution strategy depends on regulatory pathways and investor acceptance as much as product design. A
              low-reputation, AI-generated commentary separately raises regulatory, credit, and liquidity concerns; it
              is useful only as a weak adverse prompt, not proof. The investment conclusion is therefore conditional:
              Micro Connect appears differentiated, but durable advantage requires audited performance, repeat-investor
              data, market-liquidity evidence, and contract-level economics.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The defensible wedge is system breadth
            body: >-
              Micro Connect is differentiated by combining contract design, collection infrastructure, valuation
              conventions, distribution, and a venue rather than by a publicly documented price advantage.
            calloutType: strength
            claimRefs:
              - CP005
              - CP008
              - CP010
          - type: callout
            title: Liquidity and performance are the missing moat tests
            body: >-
              Member and merchant counts do not establish secondary-market depth, vintage losses, repeat investment,
              realized returns, or switching behavior.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue mechanism and monetization
        blocks:
          - type: paragraph
            body: >-
              Micro Connect's economic engine is built around packaging recurring cash-flow rights from micro and small
              businesses into investable instruments. Independent coverage describes daily revenue obligations as a
              right to a fraction of business revenue for a fixed period, while the company describes NUMA as
              infrastructure for real-world commercial contracts rather than an equity or bond replacement. This
              supports a transaction- and platform-economics interpretation, not an ARR assumption. Public disclosures
              identify the revenue-sharing ratio, contract period, daily tracking, and investor participation rules as
              core product mechanics, but they do not disclose the fee take rate, spread, servicing fee, or realized
              revenue retained by Micro Connect. Riverchain's 2026 partnership adds a working-capital origination
              channel for Hong Kong construction contractors, suggesting that the platform can monetize through
              partner-originated assets as well as the original China micro-business network. List mechanisms and
              reported deployment are therefore observable; realized revenue mix and recognition policy remain diligence
              items.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
