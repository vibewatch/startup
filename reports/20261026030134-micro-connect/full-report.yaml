            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Traction, GTM, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public traction is expressed primarily in financed businesses, merchants, cities, and investor
              participation rather than company revenue. The Standard reported nearly RMB 4 billion of financing for
              more than 10,000 stores, while Macau Daily Times reported more than RMB 4.4 billion invested across more
              than 13,000 merchants in over 200 cities. The publications use different labels, scope, and timing, so the
              figures cannot establish growth without a reconciled cohort series and cannot be treated as Micro Connect
              revenue, GMV, ARR, or profit. AInvest separately asserted a 15% average annual investor return, but that
              low-reputation, AI-generated article is not corroborated by primary evidence in the pool and is unsuitable
              as an underwriting input. The GTM motion appears distribution-led: licensed intermediaries and
              professional investors access the market, while partners such as Riverchain originate sector-specific
              assets. No assigned source provides CAC, payback, sales cycle, servicing cost, default rate, realized
              yield, repeat-investor rate, or contribution margin. Those inputs are unavailable, not zero.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Capital access has two distinct layers: financing supplied to underlying businesses and corporate capital
              available to Micro Connect or its managed vehicles. The 2023 Series C announcement reported US$458 million
              raised and a company-stated US$1.7 billion valuation, but that is historical financing raised and
              valuation, not current cash available or runway. A 2025 SCMP report said the proposed MCIF listing lapsed
              after six months and that Micro Connect Group would commit US$100 million while seeking additional
              private-fund capital; the report does not establish that the commitment was funded or available to the
              operating company. The 2026 Riverchain announcement refers to a dedicated funding commitment without
              giving amount, draw conditions, or balance-sheet treatment. Micro Connect's official news index also lists
              a 2024 announcement for an up-to-US$200 million asset-backed loan facility, but the index does not
              disclose current drawings, maturities, covenants, or recourse. The assigned pool does not disclose
              outstanding debt, warehouse advance rates, loss reserves, cash, burn, or runway. The verdict is therefore
              conditional: productization and deployment are visible, but revenue quality, margin path, liquidity, and
              corporate capital adequacy remain material underwriting blockers.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Observable financing infrastructure
            body: >-
              Public reporting supports real deployment through MCEX and a newer partner-originated channel, giving the
              model more operational evidence than a pure concept-stage financing narrative.
            calloutType: strength
            claimRefs:
              - CI006
              - CI008
              - CI009
          - type: callout
            title: Corporate underwriting remains blocked
            body: >-
              No assigned source discloses current revenue, margin, cash, burn, runway, loss rates, or realized investor
              returns; historical funding and venue volume cannot substitute for those inputs.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Micro Connect's customer-facing product is a financing and market-infrastructure workflow rather than a
              conventional software application. A small or micro business receives capital in exchange for an agreed
              share of future daily revenue; the resulting rights can be packaged for institutional investors through
              the Micro Connect Macao Financial Assets Exchange (MCEX). The 2022 authorization announcement describes
              Daily Revenue Contract Certificates as entitlements to daily revenue shares from brick-and-mortar
              businesses, while the 2023 industry account distinguishes DRCs, offshore DROs, and portfolios of DROs.
              This makes the product's core unit a contract cash-flow claim, with the venue and repayment network
              providing the surrounding operating layer rather than a simple lending dashboard.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE009
      - number: '5.2'
        title: Architecture, operating model, and maturity
        blocks:
          - type: paragraph
            body: >-
              The operating model has several identifiable layers. Micro Connect says its Automated Repayment Mechanisms
              collect revenue shares through digital infrastructure operated with brands, franchises, financial
              institutions, and SaaS companies; the Macao approval release separately describes a blockchain-enabled
              technology platform. The later Micro Star description adds digital market components including RBOs, SPVs,
              SPACs, ETFs, and RBUs, while the 2026 NUMA white paper reframes the broader opportunity as Contract-Based
              Financing for recurring real-world contract cash flows. These are specific product assertions, not
              independent proof of throughput or resilience. Public material supports a live market structure and named
              instruments, but does not disclose service-level targets, incident history, disaster recovery, API
              specifications, or audit results.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE008
      - number: '5.3'
        title: Differentiation, controls, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The differentiation is the attempt to standardize fragmented, non-standard contract cash flows into
              investable rights and to connect that asset layer with securities-law capital. The NUMA release says
              digitized payments and business operations make cash flows verifiable and that AI can process
              heterogeneous contract information continuously, while human participants retain final judgment. The model
              therefore depends on data integrity at the merchant and partner interfaces, correct allocation of revenue
              shares, investor eligibility controls, and legally durable transfer and settlement mechanics. A Macao
              executive order confirms the exchange authorization, but does not establish operational effectiveness or
              portability across jurisdictions. Independent coverage reports scale claims and market standards, yet
              public evidence does not establish security testing, privacy controls, uptime, loss controls, or
              repeatable performance of the repayment rails. Those omissions are material product and implementation
              risks.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distinct product concept
            body: >-
              Micro Connect has articulated a differentiated contract-cash-flow asset model with named instruments, a
              market venue, and a newer protocol framework rather than only a generic small-business lending
              proposition.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE008
          - type: callout
            title: Technical and control evidence is thin
            body: >-
              Public sources describe the architecture at the market-structure level but do not establish security
              testing, uptime, reconciliation quality, privacy controls, or independent validation of the repayment and
              analytics stack.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Require operating-control evidence
            body: >-
              Before underwriting product maturity, request architecture and API documentation, data lineage, access
              controls, incident and uptime logs, repayment exception statistics, model governance, and independent
              legal and controls reports.
            calloutType: recommendation
            claimRefs:
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer architecture
        blocks:
          - type: paragraph
            body: >-
              Micro Connect serves two linked customer groups rather than a single software buyer. Small businesses
              supply operating cash flows and seek growth capital; professional and institutional investors buy exposure
              to those cash flows; Micro Connect operates the exchange, fund, and structured-product infrastructure
              between them. The company describes Daily Revenue Obligations as standardized contracts on daily business
              revenue, with repayment collected through an Automated Repayment Mechanism and supported by partnerships
              with brands, franchises, financial institutions, and SaaS companies. This creates a multi-sided adoption
              problem: merchant onboarding, data and payment integration, investor underwriting, and secondary-market
              liquidity must all scale together. The public evidence confirms the model's architecture, but not
              customer-level economics, renewal behavior, or the share of capital coming from repeat participants.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU007
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU009
              - CU015
      - number: '6.2'
        title: Reported adoption and operating scale
        blocks:
          - type: paragraph
            body: >-
              Reported adoption has moved from more than 100 investments in 2022 to more than 10,000 stores in 270
              Chinese cities by the end of the period described in a later market-standard account, while a Macao Daily
              Times account reported more than RMB4.4 billion invested across more than 13,000 merchants in over 200
              cities. Micro Connect's own current company page separately lists a 2023–2024 milestone of surpassing
              10,000 stores and cumulative deployment above RMB4.6 billion by 2024. These figures indicate asset-side
              breadth, but they are not a clean cohort series: the sources use different units (investments, stores,
              merchants, and deployment), dates, and denominators. No public source in this pool gives active-use rates,
              churn, renewal, realized losses, or repeat-investor rates.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: Named proof, outcomes, and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest public proof is portfolio-level rather than customer-level. The available sources describe
              broad categories such as food and beverage, retail, services, culture, sports, consumer retail, and
              e-commerce, and a launch account identifies 39 SPVs and 25 SPACs as initial listings, but it does not name
              operating merchants or provide customer-quoted outcomes. That distinction matters: a merchant count can
              show origination and exposure, while it cannot establish production deployment quality, repayment
              performance, or customer satisfaction. Likewise, a broad market forecast and reported institutional
              participation are not evidence of repeat investment. Until Micro Connect provides anonymized cohort tables
              or independently verifiable named references, customer durability remains a material diligence gap.
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU013
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU013
              - CU015
      - number: '6.4'
        title: Expansion loops and concentration risks
        blocks:
          - type: paragraph
            body: >-
              The proposed expansion loop is visible in the product design: standardize a merchant's revenue contract,
              distribute it to professional investors, collect daily revenue shares, and use observed cash-flow data to
              support additional financing or market participation. The official NUMA release also limits participation
              to offshore professional investors through licensed intermediaries and excludes retail investors, which
              narrows the addressable investor channel but may support a controlled distribution model. The public
              record does not disclose customer concentration, channel concentration, contract length, renewal rates,
              merchant attrition, investor exits, or secondary-market turnover. The lapsed Chapter 21 listing and move
              to a private-fund model are not customer churn evidence, but they show that fundraising and deployment
              speed can affect the platform's expansion path.
            claimRefs:
              - CU002
              - CU004
              - CU011
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad reported asset-side reach
            body: >-
              Multiple sources report a footprint above 10,000 stores or 13,000 merchants across more than 200 cities,
              indicating that Micro Connect has moved beyond a single-pilot customer base.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU010
          - type: callout
            title: Scale is not durability
            body: >-
              Public disclosures do not establish active-contract rates, retention, realized losses, repeat investor
              behavior, or top-customer concentration, so reported origination scale should not be treated as recurring
              customer value.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Micro Connect's core exposure is structural rather than a single disclosed enforcement event. The model
              packages small-business revenue shares into tradable instruments and operates through MCEX, which was
              described as the first licensed global exchange for daily revenue obligations. That licensing achievement
              reduces one immediate authorization concern, but it does not establish that future product changes,
              cross-border distribution, or every investor jurisdiction will receive the same treatment. The company's
              own earlier description said approval processes for future design changes might take longer because the
              model was innovative and unfamiliar to the market. The December 2025 expiry of MCIF's Chapter 21
              application adds a separate capital-markets execution risk: the company moved to a private-fund model
              after the six-month window elapsed, while the cited report noted that no company had successfully listed
              through Chapter 21. Diligence should therefore obtain the applicable Macao, Hong Kong, mainland and
              investor-jurisdiction opinions, product-perimeter constraints, and any correspondence governing changes to
              DRO/RBO structures.
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Operational, data and control risk
        blocks:
          - type: paragraph
            body: >-
              The operating model is unusually dependent on reliable, granular data. Micro Connect's described
              architecture captures revenue digitally, splits cash flows, forecasts store performance and supports
              trading and settlement; the later MAP disclosure standard likewise emphasizes tracking cash flow on every
              contract and every shop. This granularity is an advantage only if source data are complete, timely,
              correctly attributed and resistant to manipulation. The earlier case description identified daily
              transfers among consumer brands, franchises, SaaS companies, industry associations and local government,
              and specifically said contracts must protect the safety, fairness and accuracy of data use and sharing
              across borders. A control failure could simultaneously impair underwriting, repayment allocation, investor
              disclosure and regulatory confidence. Operational monitoring should cover data reconciliation exceptions,
              delayed remittances, model drift, access-control events, vendor outages and unresolved merchant disputes,
              with independent testing of the automated repayment and settlement paths.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
      - number: '7.3'
        title: Capital, partner and market-structure dependencies
        blocks:
          - type: paragraph
            body: >-
              Micro Connect's growth case requires both supply-side participation from small businesses and continuing
              demand from institutional investors. Historical disclosures describe rapid expansion from more than 100
              investments and US$70 million of Series B funding in 2022 to more than 10,000 stores and nearly 4 billion
              yuan of institutional investment at the end of 2023, but these measures do not disclose realized losses,
              cash conversion, investor returns, or concentration by brand, geography, investor or data provider.
              Contract durations of roughly 42 to 44 months can create duration and liquidity mismatches if investor
              appetite weakens before collections mature. The abandoned listing path also shows that public-market
              funding cannot be treated as available on schedule; management said MCIF would instead rely on a US$100
              million manager commitment and additional private-sector funding. The underwriting file should test
              capital-call capacity, investor redemption and transfer terms, store-level loss vintages, partner
              concentration, and contingency arrangements for a material SaaS, brand or exchange counterparty failure.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk posture is monitorable, but public evidence does not establish a current loss curve,
              profitability profile or independently verified portfolio performance. The most useful dashboard should
              combine regulatory status, data integrity and funding durability rather than rely on store counts alone. A
              thesis break would occur if MCEX authorization or product permissions were restricted, if cash-flow
              reconciliation or repayment exceptions became material, or if the private-fund replacement for the lapsed
              listing could not secure enough capital to maintain deployment and servicing. A second break would be
              evidence that reported portfolio scale does not translate into durable collections, repeat institutional
              demand or acceptable realized returns. Current public material also does not quantify Micro Connect's own
              burn, runway, margin, customer concentration or incident history. Those unknowns should remain explicit
              gaps, with monthly diligence focused on audited collections, loss and recovery vintages, liquidity terms,
              regulatory correspondence, security incidents and financing runway.
            claimRefs:
              - CR009
              - CR011
              - CR012
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              The combination of novel financial-product regulation and dependence on granular multi-party data means a
              single control or permission failure could impair both investor confidence and operating continuity.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
          - type: callout
            title: Diligence gate
            body: >-
              Do not underwrite liquidity or valuation from the lapsed IPO path; require current private-fund
              commitments, audited collection and loss vintages, and counsel-grade product-perimeter opinions before
              treating the platform as scalable infrastructure.
            calloutType: recommendation
            claimRefs:
              - CR011
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and valuation context
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a Track / Research More recommendation, not an invest-at-any-price conclusion. A
              company-attributed 2023 report placed the US$458 million Series C at a US$1.7 billion post-raise
              valuation, while Caplight still estimates US$1.7 billion and lists US$603 million of total funding.
              Caplight also identifies debt dated February 5, 2024 as the latest round on its public page. Those figures
              are financing references, not proof of present fair value: no retained source supplies current audited
              revenue, margin, cash burn, runway, cap-table terms, or a transaction-level secondary price. Confidence is
              therefore low, risk is high, and valuation stance is indeterminate pending private diligence rather than
              “fair” or “cheap” on a stale headline mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Micro Connect is building infrastructure around measurable contract cash
              flows rather than extending conventional equity or debt. Its 2024 protocol introduced a
              price-to-net-contract-payout ratio, and the same report said institutional investors had deployed nearly
              RMB4 billion across more than 10,000 stores in 270 Chinese cities by year-end 2023. The anti-thesis is
              equally material. Scale at the underlying store level does not establish Micro Connect Group revenue,
              profitability, realized investor returns, or durable secondary liquidity. A low-reputation automated
              analysis also characterized the proposition as high-risk and urged a wait-and-see approach because of
              regulatory, credit, and execution uncertainty. Product differentiation is credible; underwriting proof
              remains incomplete.
            claimRefs:
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario work must remain conditional because the public evidence cannot anchor a DCF, revenue multiple,
              or asset-management earnings multiple. Caplight labels Lufax, Ant Group, and Pipe as similarity
              comparables, but its public page provides no operating-multiple comparison; those labels are not a
              valuation benchmark. The bull case requires audited company economics, stable vintage losses and realized
              returns, repeat institutional capital, and demonstrated liquidity. The base case treats the 2023 US$1.7
              billion mark only as historical context while requiring a fresh priced transaction and full preference
              stack before underwriting. The bear case combines weak underlying cash flows, regulatory friction, thin
              liquidity, and a financing reset. No probability or valuation range is assigned because doing so would
              turn missing private data into false precision.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not yet demonstrated. MCIF's Chapter 21 application expired after six months, and
              Charles Li suspended that IPO route in favor of a private fund; the group planned to commit US$100 million
              and seek additional private capital. EquityZen describes a possible private-share route sourced from
              existing shareholders, but that is not evidence of available inventory, price discovery, or dependable
              liquidity. Current NUMA materials also restrict participation to offshore professional investors using
              licensed intermediaries and describe NUMA as market infrastructure rather than an exchange. Before
              investment, diligence should obtain audited group financials, cohort loss and return data, current
              cap-table and preference terms, secondary turnover, regulatory opinions, and a credible exit pathway with
              measurable milestones.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV010
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              Micro Connect may merit continued diligence, but the retained evidence cannot establish what investors are
              being asked to pay today or whether that price compensates for credit, regulatory, liquidity, dilution,
              and execution risk.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV016
