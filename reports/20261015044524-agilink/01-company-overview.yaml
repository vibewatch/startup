callouts:
  - calloutType: insight
    title: Fast financing, short standalone record
    body: >-
      Public sources support a rare pace of financing and milestone density for
      a company that only became independent in January 2026, which is
      valuation-positive but leaves little standalone operating history to
      underwrite.
    claimRefs: [CO008, CO009, CO010]
  - calloutType: risk
    title: Governance and commercial disclosure still lag the valuation story
    body: >-
      Revenue, customer concentration, board composition, investor rights, and
      parent-related-party terms remain outside the assigned pool, so the
      current evidence is stronger on momentum than on durable unit economics or
      control protections.
    claimRefs: [CO012, CO015, CO016]
