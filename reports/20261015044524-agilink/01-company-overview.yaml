slug: agilink
runDate: 2026-10-15
company:
  name: Agilink
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Agilink is a recently independent AgiBot spinout focused on dexterous robot
    hands and grippers, with official pages claiming broad deployment and rapid
    scale-up. Third-party reporting supports a 2026 funding sprint to a
    unicorn-level valuation, but public evidence still leaves revenue,
    customers, governance, and related-party economics thinly disclosed.
sections:
  - id: identity-and-scale
    title: Identity, positioning, and disclosed operating scale
    body: >-
      Agilink's current official positioning is tightly focused on dexterous
      manipulation systems rather than general-purpose humanoids: the company
      says it designs and manufactures high-DoF dexterous hands and adaptive
      grippers for research, industrial automation, and service robotics. The
      current product lineup on official surfaces centers on the OmniHand 3
      family and OmniPicker 3, while the public product catalog emphasizes
      application fit, mounting, power, communication, and control-software
      integration. On scale, the strongest currently visible numbers remain
      company claims rather than independently benchmarked disclosures:
      Agilink's homepage advertises No.1 market share in Q1 2026, 20,000+
      products shipped, and 50,000+ hours of real-world data. Those claims
      point to real commercial and deployment ambition, but they do not yet
      substitute for verified revenue, customer concentration, or repeat-order
      disclosure.
    claimRefs: [CO001, CO002, CO006, CO007, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and parent dependence
    body: >-
      The clearest founder signal in the assigned pool is Xiong Kun, whom both
      Baidu Baike and Sina associate with the Agilink spinout and with prior
      Tencent Robotics X and robotics engineering experience. That gives the
      company credible technical founder-market fit for dexterous end-effectors,
      but it also highlights key-person dependence because the public record is
      much richer on the founder than on broader management or board oversight.
      Governance visibility remains imperfect. Baidu Baike names Wang Chuang as
      legal representative, while Sina's May 2026 article names Deng Taihua,
      creating a live discrepancy in basic corporate-control data. The official
      about page further confirms that Agilink originated inside AgiBot before
      becoming independent in January 2026, so diligence still needs to test
      how much product roadmap, sales mix, IP, and transfer-pricing exposure
      remains tied to the parent ecosystem.
    claimRefs: [CO003, CO005, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding pace, stakeholders, and disclosure gaps
    body: >-
      Public evidence supports a very fast capital-formation story. The about
      page says Agilink became independent in January 2026, while Baidu Baike
      and Sina describe multiple rounds completed within months and a
      unicorn-level valuation by May or June 2026. Baidu Baike also points to a
      parent-controlled cap table, saying Shanghai Zhiyuan New Innovation
      Technology holds roughly 67% of shares and that Tencent- and SAIC-linked
      vehicles became shareholders. That combination matters for valuation and
      control analysis: Agilink appears to have attracted strong investor pull,
      but public sources still do not expose board composition, investor rights,
      liquidation preferences, or related-party commercial terms with AgiBot.
      The chapter can therefore establish stakeholder shape, but not yet clean
      governance economics.
    claimRefs: [CO008, CO009, CO010, CO013, CO016]
    tableRefs: [TO003]
  - id: milestones-and-external-risk
    title: Milestones and external risk context
    body: >-
      The dated milestone trail is unusually dense for such a young standalone
      company: official and third-party sources support a path from internal
      incubation in 2023 to launch milestones in 2025, independence in January
      2026, new Omni products in April, unicorn valuation markers by May and
      June, and an October 2026 dexterity demonstration that helped keep the
      story visible. That said, the sector backdrop is not uniformly favorable.
      Humanoids Daily reports that Beijing warned China's humanoid and embodied
      robotics sector against "highly repetitive products" and bubble dynamics.
      For Agilink, that means strong early momentum is arriving in a market that
      may reward differentiated execution but punish copycat hardware and
      overcapitalized supply chains.
    claimRefs: [CO003, CO008, CO009, CO014, CO015]
    figureRefs: [FO001]
