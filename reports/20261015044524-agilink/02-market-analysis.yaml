company:
  name: "Agilink"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Public evidence supports a tightly bounded market around dexterous hands, grippers,
    and the integration workflows that let robotics teams deploy them into embodied-AI,
    research, and industrial handling programs. China offers a large automation base and
    heavy 2026 capital formation, but the assigned evidence only supports installed-base,
    capital-flow, and shipment lenses rather than a revenue-grade TAM/SAM/SOM model, and
    IFR's commercialization warning keeps the adoption timeline from looking immediate.
sections:
  - id: "boundary-and-buyers"
    title: "Market boundary and buyer map"
    body: >
      The assigned pool points to a narrower market than generic humanoid-robot headlines
      imply. Agilink's official positioning is centered on dexterous hands and grippers,
      while the AGIBOT store frames selection around the object, movement, and host robot
      instead of the whole robot stack. That keeps the included spend at the end-effector,
      integration, and manipulation-data layer and excludes broader humanoid locomotion,
      full robot platforms, and general-purpose foundation-model budgets that the evidence
      does not isolate. Buyer and payer evidence also clusters around three initial
      groups: research teams collecting manipulation data, robot OEMs or integrators
      fitting hands into humanoid and general-robot platforms, and industrial automation
      teams using grippers where the workflow favors reliability over anthropomorphic
      dexterity.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM009, CM012]
    tableRefs: [TM001, TM003]
  - id: "sizing-lenses"
    title: "Sizing lenses and demand drivers"
    body: >
      The evidence supports multiple sizing lenses, but not a single clean TAM. IFR's 2026
      release places China at roughly 2 million operational industrial robots and 54% of
      annual global industrial-robot installations, which is the broadest credible demand
      context in the assigned pool. The same source shows domestic suppliers increasing
      share from 30% of Chinese installations in 2020 to 57% in 2024, which matters
      because Agilink is selling Chinese-designed end-effectors into a policy-supported
      localization cycle. Humanoids Daily adds a second lens by describing more than 50
      embodied-intelligence financings and roughly RMB 20 billion of Q1 2026 capital in
      China, while Agilink-specific shipment figures from Humanoids Daily and Baidu offer
      a third lens on current throughput. Together those inputs justify a demand narrative,
      but they remain installed-base, capital, and unit-shipment proxies rather than a
      revenue-backed market stack.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM012, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "constraints-and-open-questions"
    title: "Adoption constraints and unresolved market proof"
    body: >
      The strongest disconfirming evidence is not that demand disappears, but that broad
      humanoid commercialization remains slower and narrower than unicorn narratives imply.
      IFR explicitly says universal humanoid factory or household adoption will not happen
      in the near- or medium-term future and instead expects AI adoption with traditional
      industrial robotics over the next five to ten years. That pushes Agilink's nearer
      commercial opportunity toward concrete, integration-ready workflows rather than a
      generic claim that the total humanoid market is already open. The assigned pool also
      leaves two valuation-relevant gaps unresolved: there is no independent denominator
      for Agilink's claimed Q1 2026 China market-share leadership, and there is no
      public revenue, ASP, or external-customer mix disclosure that would translate the
      shipment narrative into defensible TAM, SAM, or SOM ranges.
    claimRefs: [CM003, CM011, CM013, CM014, CM015]
callouts:
  - calloutType: "insight"
    title: "The market is narrower than the headline"
    body: >
      The best-supported opportunity is dexterous manipulation hardware plus integration,
      not the full humanoid stack. That narrower boundary still benefits from China's large
      automation base and embodied-AI capital cycle.
    claimRefs: [CM001, CM006, CM008, CM012]
  - calloutType: "risk"
    title: "Public market proof remains incomplete"
    body: >
      Shipment and financing signals are strong, but the assigned evidence does not provide
      an independent market-share benchmark or a revenue-quality TAM/SAM/SOM build.
    claimRefs: [CM010, CM011, CM014]
