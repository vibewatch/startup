company:
  name: Agilink
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a real commercialization story for Agilink, but it
    does not yet support underwriting a $1B-plus private valuation with buy-level
    conviction. The right reader-facing stance is research-more: product breadth,
    shipment claims, and sector tailwinds are real, while revenue quality,
    customer concentration, governance terms, and downside protection remain too
    opaque for an aggressive entry call.
sections:
  - id: valuation-context
    title: Valuation context and price discipline
    body: >-
      The public price anchors are strong enough to establish that Agilink has
      already crossed the unicorn threshold, but they are not strong enough to
      prove the current price is attractive. Dealroom shows a June 2026 financing
      event of $138M at a reported $1.4B valuation, while Crunchbase and company-
      adjacent sources consistently place the business in the May-to-June 2026
      unicorn cohort. That combination means the valuation question is no longer
      whether the market will pay $1B-plus for the asset; it is whether outside
      investors today have enough evidence on revenue quality, dilution, and
      repeatable demand to justify following that mark without a discount or
      stronger protections.
    claimRefs: [CV002, CV003, CV006, CV007, CV012, CV015]
    tableRefs: [TV001]
  - id: thesis-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The bullish case starts with evidence that Agilink is more than a concept
      deck: official product pages show live dexterous-hand and gripper offerings,
      the company says the spinout launched scaled product lines in 2025 and 2026,
      and independent reporting ties the current financing to deployment-oriented
      hardware and data programs. The anti-thesis is that the most valuation-
      sensitive variables remain hidden. Public sources do not verify revenue,
      gross margin, repeat-order behavior, or preference structure, and the
      broader humanoid ecosystem still faces commercialization and safety frictions
      that can compress multiples faster than narrative-driven private marks can
      recover them.
    claimRefs: [CV001, CV004, CV005, CV008, CV009, CV010, CV011, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-exit
    title: Scenarios, comparables, and exit readiness
    body: >-
      Scenario framing should stay milestone-based instead of pretending the
      public record contains a clean revenue multiple. Dealroom and Crunchbase
      imply Agilink is being priced alongside newly minted robotics unicorns
      rather than against disclosed cash-flow fundamentals, so the comparable set
      is best treated as directional sentiment rather than a precise benchmark.
      The upside path requires proof that shipment claims translate into repeat
      customer demand, healthy margins, and broader licensing beyond the Agibot
      ecosystem. The downside path is straightforward: if policy enthusiasm and
      category scarcity are doing more work than unit economics, a later round can
      still be flat, structured, or delayed even if the company keeps shipping.
    claimRefs: [CV002, CV006, CV008, CV009, CV010, CV011, CV013, CV015]
    tableRefs: [TV003]
  - id: recommendation
    title: Final recommendation and diligence asks
    body: >-
      The evidence supports engagement, but not blind price acceptance. Agilink
      has enough product and financing proof to stay on the live diligence list,
      and the category backdrop is attractive enough that walking away entirely
      would be premature. Even so, the chapter does not clear the bar for a buy
      because current valuation markers are better documented than the economics
      underneath them. The underwriting discipline should therefore be research-
      more with a stretched valuation stance: revisit only if management can show
      audited or lender-grade revenue quality, external-customer mix, cap-table
      terms, and evidence that commercialization can scale faster than standards,
      safety, and adoption bottlenecks can slow it.
    claimRefs: [CV010, CV011, CV013, CV014]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [Current call, research-more, medium, high, stretched, "Keep active diligence, but do not underwrite current price without harder economics and governance evidence."]
      - [Upgrade condition, conditional buy, low, medium, fair-to-attractive, "Requires verified revenue quality, external-customer concentration data, and terms that protect against a flat or structured follow-on round."]
    notes: >-
      Public sources provide valuation markers and product traction proxies, but
      not verified revenue, margin, or preference-stack detail; the second row is
      a diligence threshold rather than a current judgment.
    claimRefs: [CV002, CV010, CV011, CV013, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - ["Thesis: commercialization is real", "Official and independent sources show active OmniHand and OmniPicker products, June 2026 unicorn financing, and shipment claims above 8,000 hands.", "Verified customer names, reorder cadence, and revenue by product line would strengthen the case materially."]
      - ["Thesis: category tailwind can support exits", "IFR and IDC both describe robotics and humanoid adoption as strategic growth markets, with China policy support and rapid shipment growth forecasts.", "Evidence of durable export demand or non-Agibot licensing would make the tailwind more company-specific."]
      - ["Anti-thesis: valuation is ahead of disclosed economics", "The public record shows $1B-plus pricing, but not audited revenue, gross margin, retention, or repeat-order quality.", "A priced round at a similar mark backed by audited operating metrics would narrow this gap."]
      - ["Anti-thesis: adoption and safety friction can compress multiples", "IFR and industry reporting both warn that mass adoption is not near-term and that safety standards and tactile-sensing bottlenecks are still being worked through.", "Third-party proof of reliable production deployment at scale would reduce this downside."]
    notes: >-
      This table mixes direct source facts with underwriting implications, so each
      row should be read as a synthesized argument rather than a standalone raw
      datapoint.
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV010, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Shipments convert into repeat external demand, OmniHand 3 production scales, and Agilink broadens beyond captive ecosystem sales.", "Current unicorn mark proves conservative and a later round can clear higher on economics-backed growth.", "Execution slip, export friction, or weak margins can still cap upside.", "Would require verified revenue conversion from the current shipment narrative."]
      - [Base, "Product traction continues, but investors still lack audited economics and cap-table clarity.", "Current $1.0-1.4B range behaves like a holding mark rather than a clear bargain.", "Flat growth in external customers or governance complexity can keep returns middling.", "Best matches today's evidence."]
      - [Bear, "Shipment momentum is real but monetization, customer diversity, or safety readiness disappoint.", "A future round needs structure, resets lower, or takes longer than the current narrative implies.", "Down-round risk rises if category multiples cool before fundamentals catch up.", "Most likely if data-room evidence cannot close current gaps."]
      - [Walk-away trigger, "Management cannot validate revenue quality, non-Agibot customer mix, or preference stack.", "No reason to pay narrative-driven unicorn pricing without downside protection.", "Information asymmetry dominates the underwriting case.", "Should immediately move the call from research-more to pass."]
    notes: >-
      These are underwriting scenarios rather than model outputs; public evidence
      is insufficient for a defensible DCF or revenue-multiple bridge, so the
      ranges are expressed qualitatively instead of with false precision.
    claimRefs: [CV002, CV006, CV008, CV009, CV010, CV011, CV013, CV014, CV015]
