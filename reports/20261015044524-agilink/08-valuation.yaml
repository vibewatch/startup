  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Verified revenue by product line, gross margin, repeat-order behavior, and customer concentration.
      whyItMatters: Those metrics determine whether shipment and financing momentum justify paying a premium private valuation.
      diligencePath: Request audited or lender-grade monthly revenue, gross margin, and customer-cohort detail in the data room.
      relatedQuestionRefs: [QV006, QV007]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Cap-table detail on liquidation preferences, board control, investor rights, and any transfer-pricing or IP-sharing arrangements with Agibot.
      whyItMatters: A $1B-plus entry can still deliver weak returns if preference overhang or related-party dependence subordinates new capital.
      diligencePath: Obtain the current cap table, shareholder agreement summary, board composition, and related-party agreements before pricing a term sheet.
      relatedQuestionRefs: [QV003, QV008]
      relatedTableRefs: [TV001]
    - type: missing-source
      severity: material
      topic: customer-validation
      missingEvidence: Independent third-party customer references that separate Agibot-internal demand from external commercial adoption.
      whyItMatters: Exit readiness depends on whether Agilink is becoming a category supplier or remains mostly tied to its parent ecosystem.
      diligencePath: Ask for named customer references, reorder data, and a shipped-unit split between parent-affiliated and external accounts.
      relatedQuestionRefs: [QV002, QV007]
      relatedTableRefs: [TV002, TV003]
