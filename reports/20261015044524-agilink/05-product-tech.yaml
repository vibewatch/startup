slug: "agilink"
runDate: "2026-10-15"
company:
  name: "Agilink"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Agilink's public product story is strongest at the end-effector layer: dexterous hands, grippers, and flexible-material manipulation demos backed by visible 2025-2026 release cadence. The same evidence still leaves SKU-level architecture reconciliation, field reliability, software stack separation from AGIBOT, and trust/compliance readiness under-documented."
sections:
  - id: "product-scope"
    title: "Product scope is clear, but the offer is still catalog-led"
    body: |
      Agilink's official surfaces consistently define the company around dexterous manipulation rather than a broad robot platform: the about page frames the company as a builder of robotic hands and grippers, and the AGIBOT store asks buyers to choose an end effector around the object, movement, and host robot in the target application. That positioning is useful because it anchors the product in a customer workflow instead of a generalized embodied-AI narrative. The public catalog is still narrow, however. On the main dexterous-hand collection page, the visible current lineup is two OmniHand variants plus OmniPicker 3, which suggests a focused end-effector business rather than a fully modular stack with many production SKUs. Baidu Baike's scenario summary broadens the same story from catalog to go-to-market: data-collection use cases, robot-integration programs, and industrial or research deployments.
    claimRefs: ["CE001", "CE002", "CE003", "CE008"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-dependencies"
    title: "Publicly evidenced architecture centers on end-effector mechanics, tactile sensing, and integration dependencies"
    body: |
      The strongest product proof in the assigned pool is the flexible-material demo record. Two independent write-ups say OmniHand 3 Ultra handled silk-thread separation, needle threading, hooping, and stitching, and both describe a 21-active-DOF, direct-drive hand with tactile sensing. The Rundown adds a training path that starts with teleoperated data collection and then reinforcement-learning refinement, which is more concrete than generic “AI-powered” positioning. At the same time, the deployment burden is still pushed to integrators: the store tells buyers to validate mount, power, communications, and control-software compatibility before purchase. That matters because Humanoids Daily places the OmniHand 3 Ultra-T inside AGIBOT's broader “One Body, Three Intelligences” stack, so the public record points to meaningful ecosystem dependence rather than a separately documented Agilink software/control platform.
    claimRefs: ["CE005", "CE006", "CE007", "CE009", "CE010", "CE011", "CE014"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-commercialization"
    title: "Release cadence and shipment claims support momentum, but not yet underwriting-grade maturity"
    body: |
      Agilink's official timeline shows an unusually fast 2025-2026 sequence: OmniHand and OmniHand Pro in August 2025, the Omni 3 series in April 2026, and the flagship OmniHand 3 Ultra-M at ICRA in June 2026. That launch cadence is reinforced by organization-building signals on the same page, including a 60+ person team scaling toward 100+ by Q4 2026. Public volume claims also move quickly upward, from more than 8,000 OmniHand deliveries by June to more than 15,000 dexterous hands by September 30 and more than 20,000 products shipped on the homepage snapshot. Those numbers are directionally positive for commercialization, but they are not directly comparable because the disclosed scopes shift from OmniHand deliveries to dexterous hands to total products, without separating internal AGIBOT programs from third-party customer units.
    claimRefs: ["CE004", "CE012", "CE013"]
  - id: "technical-risks"
    title: "Technical diligence should focus on SKU reconciliation, reliability, and trust surfaces"
    body: |
      The largest product risk in the current evidence set is not lack of activity; it is the gap between rich demo and launch narratives and thin operating proof. Public materials do not reconcile the OmniHand 3 family into a clean SKU-level architecture map: independent demo coverage describes OmniHand 3 Ultra as a 21-DOF direct-drive hand, while APC coverage describes OmniHand 3 Ultra-T as a 22+3-DOF tendon-driven system. That may reflect different products rather than contradiction, but it still means buyers need exact SKU-level diligence on actuation, sensing, and supported workloads. Just as important, the assigned pool does not establish production reliability metrics, customer-visible support SLAs, or external trust/compliance documentation. For underwriting, those omissions matter more than another hero demo, because they determine whether Agilink is selling a repeatable subsystem or a still engineer-heavy integration project.
    claimRefs: ["CE009", "CE011", "CE014"]
