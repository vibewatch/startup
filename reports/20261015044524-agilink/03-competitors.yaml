schemaVersion: "report-v2"
artifact: "competitors"
slug: "agilink"
runDate: "2026-10-15"
company:
  name: "Agilink"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Agilink is strongest in this retained evidence set when the buyer wants a high-dexterity hand
    that can ride the AGIBOT ecosystem and a fast 2026 commercialization push, but independent
    proof is thin across the pool. ROBOTERA adds a competing promotional deployment narrative,
    while Shadow Robot supplies a long-tenured research benchmark. Public pricing is largely absent,
    so the most defensible comparison is capability, deployment route, and dependence on affiliated
    channels rather than clean feature-price benchmarking.
sections:
  - id: "competitive-scope"
    title: "Competitive set is broader than hand-vs-hand"
    body: >-
      The retained pool shows that Agilink competes on more than a single product axis. Its own
      official surfaces split the market between dexterous hands for multi-finger manipulation and
      grippers for simpler object-handling work, which means the practical substitute is often not
      another five-finger hand but a lower-complexity gripper or other task-specific tooling. The
      same official guidance also says buyer fit depends on mount, payload, power, communication,
      and software interfaces, so competition is partly a component-selection process inside a
      broader robot program, not just a catalog comparison between end effectors.
    claimRefs: ["CP001", "CP002", "CP012"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "peer-landscape"
    title: "Direct peers, adjacent vendors, and incumbents attack different buyer priorities"
    body: >-
      Agilink's clearest adjacent pressure in the retained 2026 pool comes from ROBOTERA, which
      combines a dexterous-hand architecture with a broader robotics platform and a live
      commercialization story in logistics. Shadow Robot represents a different incumbent threat:
      less evidence of recent scaled deployment in this pool, but long-standing research credibility
      and a 24-degree-of-freedom hand that continues to anchor the high-end benchmark set.
      Agilink's own position sits between those poles: newer and faster-moving than Shadow Robot,
      but still proving whether its early shipment and market-share claims translate into durable,
      independently verified share against other ambitious embodied-AI vendors.
    claimRefs: ["CP003", "CP004", "CP005", "CP006", "CP007", "CP012", "CP013", "CP014"]
    tableRefs: ["TP001"]
  - id: "switching-and-packaging"
    title: "Switching costs exist, but public pricing and win-rate visibility are weak"
    body: >-
      The most visible switching-cost levers are integration and developer workflow rather than
      headline price. Agilink's retained sources emphasize mechanical fit, communication protocols,
      and software access, while Unite.ai's recap of published specifications points to SDKs,
      simulation assets, and ROS 2 reference nodes that can create meaningful engineering
      stickiness once a hand is integrated. Even so, the retained sources do not disclose public
      pricing for Agilink, ROBOTERA, or Shadow Robot, so buyers and investors cannot benchmark
      feature-price tradeoffs cleanly from public evidence. That opacity also makes it harder to
      know whether Agilink wins on capability, discounting, parent-network pull, or bundled
      support.
    claimRefs: ["CP002", "CP009", "CP010", "CP015"]
    tableRefs: ["TP003"]
  - id: "durability-and-risk"
    title: "Moat durability still depends on proving independence from the parent ecosystem"
    body: >-
      The retained evidence suggests Agilink's current edge is partly channel and ecosystem speed.
      Official and affiliate sources say the company was formed inside AGIBOT, Baidu records
      AGIBOT's Shanghai Zhiyuan affiliate with roughly two-thirds ownership, and C Capital ties the
      hand business to AGIBOT robots already working on customer factory floors. That can accelerate
      deployment, but it also means much of the visible proof sits inside a company-controlled or
      financially aligned network. ROBOTERA already markets its own direct-drive hand and in-house
      stack with multi-site deployments, while Shadow Robot remains a recognizable research
      benchmark, so Agilink still needs more independent win/loss, reliability, and pricing proof
      to show that its advantage is durable rather than a fast-moving, parent-enabled first wave.
    claimRefs: ["CP003", "CP008", "CP011", "CP013", "CP014", "CP016"]
