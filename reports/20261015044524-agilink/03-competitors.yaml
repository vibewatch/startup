      - ["Commercial deployment proof", "Shipment and market-share claims are strong but mostly company or affiliate sourced", ">10 logistics centers and Q2 2026 thousand-unit deliveries claimed", "Commercial status shown, but retained pool emphasizes research posture over fleet scale", "Common substitute where a full dexterous hand is unnecessary"]
      - ["Integration / developer stack", "Mount/power/protocol review plus SDK, API, simulation, and ROS 2 assets are disclosed", "In-house hardware stack and real-world deployment feedback are disclosed; SDK detail is not retained here", "Retained directory entry does not expose SDK or integration detail", "Mechanical and control simplicity can lower integration burden"]
      - ["Benchmark transparency", "Company-controlled market-share and shipment claims dominate", "Press-release style commercialization claims dominate", "Directory-style summary dominates", "Alternative is visible, but public head-to-head performance data is absent"]
    notes: >-
      Unsupported competitor cells are preserved as unknown or described only at the level stated
      in the retained source set; this matrix compares disclosed signals, not verified like-for-like
      performance.
    claimRefs: ["CP001", "CP002", "CP004", "CP007", "CP009", "CP010", "CP012", "CP014", "CP015"]
  - id: "TP003"
    title: "Pricing / packaging comparison"
    columns:
      - "Option"
      - "Public pricing evidence"
      - "Package model in retained sources"
      - "Unknowns / caveats"
      - "Implication"
    rows:
      - ["Agilink OmniHand", "No public list price in retained sources", "Sales-led fit discussion after task and integration review", "ASP, discounts, service terms, and minimum order size are undisclosed", "Capability may be differentiated, but public ROI modeling is weak"]
      - ["Agilink OmniPicker / gripper path", "No public list price in retained sources", "Same storefront offers a simpler object-handling route", "Price delta versus OmniHand is undisclosed", "Keeps a lower-complexity substitute available inside the same channel"]
      - ["ROBOTERA", "No public price in retained source", "Commercial deployment story without quoted package terms", "No retained evidence on contract model, maintenance, or support bundle", "May compete on total solution value without public price anchoring"]
      - ["Shadow Robot", "No public price in retained source", "Commercial research-standard positioning", "No retained evidence on deployment bundle or support economics", "Incumbent credibility is visible, but public TCO remains opaque"]
    notes: >-
      The retained source set is weak on realized pricing. The table therefore compares public
      pricing transparency and packaging disclosure, not normalized contract economics.
