  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment coverage is broad, but payer quality is still inferred more than proven
        blocks:
          - type: paragraph
            body: >-
              The best-supported customer story in the assigned pool is segment breadth rather than named-account depth.
              AGIBOT's storefront positions OmniHand and OmniPicker around "interaction & manipulation," "object
              handling," and "manipulation research," while the AGILINK about page frames the company as a
              dexterous-manipulation supplier for both research and industry. That combination supports a buyer map
              spanning robotics research teams, humanoid or general-purpose robot OEMs, and industrial integrators that
              need end effectors rather than finished robot platforms. It does not, however, identify the payer mix by
              segment or show how much volume comes from affiliated AGIBOT programs versus outside customers, so the
              commercial quality of the installed base remains partly inferred.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
