      - number: '2.2'
        title: Sizing lenses and demand drivers
        blocks:
          - type: paragraph
            body: >
              The evidence supports multiple sizing lenses, but not a single clean TAM. IFR's 2026 release places China
              at roughly 2 million operational industrial robots and 54% of annual global industrial-robot
              installations, which is the broadest credible demand context in the assigned pool. The same source shows
              domestic suppliers increasing share from 30% of Chinese installations in 2020 to 57% in 2024, which
              matters because Agilink is selling Chinese-designed end-effectors into a policy-supported localization
              cycle. Humanoids Daily adds a second lens by describing more than 50 embodied-intelligence financings and
              roughly RMB 20 billion of Q1 2026 capital in China, while Agilink-specific shipment figures from Humanoids
              Daily and Baidu offer a third lens on current throughput. Together those inputs justify a demand
              narrative, but they remain installed-base, capital, and unit-shipment proxies rather than a revenue-backed
              market stack.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
