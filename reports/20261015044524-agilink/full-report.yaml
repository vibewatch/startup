        title: Direct peers, adjacent vendors, and incumbents attack different buyer priorities
        blocks:
          - type: paragraph
            body: >-
              Agilink's clearest adjacent pressure in the retained 2026 pool comes from ROBOTERA, which combines a
              dexterous-hand architecture with a broader robotics platform and a live commercialization story in
              logistics. Shadow Robot represents a different incumbent threat: less evidence of recent scaled deployment
              in this pool, but long-standing research credibility and a 24-degree-of-freedom hand that continues to
              anchor the high-end benchmark set. Agilink's own position sits between those poles: newer and
              faster-moving than Shadow Robot, but still proving whether its early shipment and market-share claims
              translate into durable, independently verified share against other ambitious embodied-AI vendors.
