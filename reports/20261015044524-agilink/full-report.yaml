      - number: '1.2'
        title: Leadership, governance, and parent dependence
        blocks:
          - type: paragraph
            body: >-
              The clearest founder signal in the assigned pool is Xiong Kun, whom both Baidu Baike and Sina associate
              with the Agilink spinout and with prior Tencent Robotics X and robotics engineering experience. That gives
              the company credible technical founder-market fit for dexterous end-effectors, but it also highlights
              key-person dependence because the public record is much richer on the founder than on broader management
              or board oversight. Governance visibility remains imperfect. Baidu Baike names Wang Chuang as legal
              representative, while Sina's May 2026 article names Deng Taihua, creating a live discrepancy in basic
              corporate-control data. The official about page further confirms that Agilink originated inside AgiBot
              before becoming independent in January 2026, so diligence still needs to test how much product roadmap,
              sales mix, IP, and transfer-pricing exposure remains tied to the parent ecosystem.
            claimRefs:
