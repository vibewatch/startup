              - CM008
              - CM010
              - CM015
      - number: '2.3'
        title: Adoption constraints and unresolved market proof
        blocks:
          - type: paragraph
            body: >
              The strongest disconfirming evidence is not that demand disappears, but that broad humanoid
              commercialization remains slower and narrower than unicorn narratives imply. IFR explicitly says universal
              humanoid factory or household adoption will not happen in the near- or medium-term future and instead
              expects AI adoption with traditional industrial robotics over the next five to ten years. That pushes
              Agilink's nearer commercial opportunity toward concrete, integration-ready workflows rather than a generic
              claim that the total humanoid market is already open. The assigned pool also leaves two valuation-relevant
              gaps unresolved: there is no independent denominator for Agilink's claimed Q1 2026 China market-share
              leadership, and there is no public revenue, ASP, or external-customer mix disclosure that would translate
              the shipment narrative into defensible TAM, SAM, or SOM ranges.
            claimRefs:
              - CM003
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is narrower than the headline
            body: >
              The best-supported opportunity is dexterous manipulation hardware plus integration, not the full humanoid
              stack. That narrower boundary still benefits from China's large automation base and embodied-AI capital
              cycle.
            calloutType: insight
            claimRefs:
