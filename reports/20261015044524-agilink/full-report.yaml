              - CE011
              - CE014
      - number: '5.3'
        title: Release cadence and shipment claims support momentum, but not yet underwriting-grade maturity
        blocks:
          - type: paragraph
            body: >
              Agilink's official timeline shows an unusually fast 2025-2026 sequence: OmniHand and OmniHand Pro in
              August 2025, the Omni 3 series in April 2026, and the flagship OmniHand 3 Ultra-M at ICRA in June 2026.
              That launch cadence is reinforced by organization-building signals on the same page, including a 60+
              person team scaling toward 100+ by Q4 2026. Public volume claims also move quickly upward, from more than
              8,000 OmniHand deliveries by June to more than 15,000 dexterous hands by September 30 and more than 20,000
              products shipped on the homepage snapshot. Those numbers are directionally positive for commercialization,
              but they are not directly comparable because the disclosed scopes shift from OmniHand deliveries to
              dexterous hands to total products, without separating internal AGIBOT programs from third-party customer
              units.
            claimRefs:
              - CE004
              - CE012
              - CE013
      - number: '5.4'
        title: Technical diligence should focus on SKU reconciliation, reliability, and trust surfaces
        blocks:
          - type: paragraph
            body: >
              The largest product risk in the current evidence set is not lack of activity; it is the gap between rich
              demo and launch narratives and thin operating proof. Public materials do not reconcile the OmniHand 3
              family into a clean SKU-level architecture map: independent demo coverage describes OmniHand 3 Ultra as a
              21-DOF direct-drive hand, while APC coverage describes OmniHand 3 Ultra-T as a 22+3-DOF tendon-driven
              system. That may reflect different products rather than contradiction, but it still means buyers need
              exact SKU-level diligence on actuation, sensing, and supported workloads. Just as important, the assigned
              pool does not establish production reliability metrics, customer-visible support SLAs, or external
              trust/compliance documentation. For underwriting, those omissions matter more than another hero demo,
              because they determine whether Agilink is selling a repeatable subsystem or a still engineer-heavy
              integration project.
            claimRefs:
              - CE009
              - CE011
              - CE014
