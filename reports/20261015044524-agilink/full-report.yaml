    title: Risk heatmap
    type: matrix
    summary: Evidence-backed view of the main residual risks by likelihood, impact, and mitigation maturity.
    data:
      columns:
        - label: Likelihood
          note: How likely the issue is to matter under current public evidence.
        - label: Impact
          note: Potential effect on commercialization or investor downside.
        - label: Mitigation maturity
          note: How concrete the visible public mitigation appears today.
      rows:
        - label: Regulatory / certification clarity
          values:
            - label: Medium
              tone: medium
              note: Public evidence does not clear certifications or legal perimeter.
            - label: High
              tone: high
              note: Missing certifications or legal constraints can block deployments.
            - label: Low
              tone: medium
              note: Diligence path is clear, but retained mitigation proof is limited.
        - label: Parent / control concentration
          values:
            - label: High
              tone: high
              note: Official origin and reported majority ownership keep this active now.
            - label: High
              tone: high
              note: Governance or related-party terms could materially shape minority outcomes.
            - label: Medium
              tone: medium
              note: Financing and spinout help, but public control-rights disclosure is thin.
        - label: Integration / reliability execution
          values:
            - label: High
              tone: high
              note: Compatibility and retargeting complexity are explicit in retained product sources.
            - label: High
              tone: high
              note: Failed deployments would directly impair adoption and support economics.
            - label: Medium
              tone: medium
              note: Engineering path exists, but public field metrics are missing.
        - label: Demo-to-production conversion
          values:
            - label: Medium
              tone: medium
              note: Showcase momentum exists, but production proof remains thin.
            - label: High
              tone: high
              note: Pilot-stage demand can fade if production economics disappoint.
            - label: Low
              tone: medium
              note: No retained customer cohort or renewal data is visible.
        - label: Hiring / process scaling
          values:
            - label: Medium
              tone: medium
              note: Team scaling and launch cadence imply operational load.
            - label: Medium
              tone: medium
              note: Process gaps can slow service and quality feedback loops.
            - label: Low
              tone: medium
              note: Retained public proof of mature quality systems is limited.
        - label: Valuation / financing discipline
          values:
            - label: High
              tone: high
              note: Unicorn pricing followed the spinout quickly.
            - label: High
              tone: high
              note: Weak demand quality at this price would create downside asymmetry.
            - label: Low
              tone: medium
              note: Public economic disclosure still lags the financing narrative.
    approximationNotes: >-
      Heatmap scores summarize retained evidence rather than audited incident frequencies; they should be updated once
