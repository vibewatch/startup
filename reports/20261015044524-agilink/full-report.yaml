        title: Traction and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are stronger than public economics. Company-issued September 2026 coverage says
              Agilink has shipped more than 15,000 dexterous hands, while Baidu Baike's June 2026 summary says
              cumulative OmniHand deliveries exceeded 8,000 units and gripper shipments exceeded 10,000 units. The
              official about page also shows a rapid operating ramp: Agilink says it has 60+ team members today, is
              scaling toward 100+ by Q4 2026, launched OmniHand and OmniHand Pro in August 2025, hit its 1,000th hand in
              December 2025, and unveiled multiple Omni 3 products in 2026. Those signals support real production
              activity, but they still do not convert shipment counts into revenue, gross profit, or customer quality
              because the company does not break out realized pricing, external-customer mix, or service costs.
