chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and disclosed operating scale
        blocks:
          - type: paragraph
            body: >-
              Agilink's current official positioning is tightly focused on dexterous manipulation systems rather than
              general-purpose humanoids: the company says it designs and manufactures high-DoF dexterous hands and
              adaptive grippers for research, industrial automation, and service robotics. The current product lineup on
              official surfaces centers on the OmniHand 3 family and OmniPicker 3, while the public product catalog
              emphasizes application fit, mounting, power, communication, and control-software integration. On scale,
              the strongest currently visible numbers remain company claims rather than independently benchmarked
              disclosures: Agilink's homepage advertises No.1 market share in Q1 2026, 20,000+ products shipped, and
              50,000+ hours of real-world data. Those claims point to real commercial and deployment ambition, but they
              do not yet substitute for verified revenue, customer concentration, or repeat-order disclosure.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO016
