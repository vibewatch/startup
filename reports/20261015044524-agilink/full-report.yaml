  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Agilink's public commercial surface still looks like an industrial hardware supplier, not a disclosed
              recurring-software business. The AGIBOT store only presents OmniHand dexterous hands and OmniPicker
              grippers, while the corporate site describes dexterous manipulation systems and end-effector solutions
              rather than subscriptions or usage-based software. The sales path is also consultative: buyers are told to
              choose around their application, then confirm mounting, power, communication, software, budget range, and
              timeline with sales. That implies revenue likely starts with hardware orders plus potentially bundled
              integration support, but public materials do not disclose list prices, realized ASPs, contract length,
              discounts, or any recognized-services revenue.
