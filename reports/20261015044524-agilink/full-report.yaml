      - number: '6.2'
        title: Adoption proof is real, but still light on named third-party production deployments
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is stronger than a pure concept-stage robotics supplier, but the proof surfaces
              remain uneven. AGILINK says the program launched its first products in August 2025 and reached a
              1,000th-hand production milestone in December 2025, while Baidu Baike reports more than 8,000 cumulative
              OmniHand deliveries and more than 10,000 gripper shipments by June 2026. Those milestones imply meaningful
              physical volume, yet the same source set still fails to show named third-party customers with outcome
              evidence, contract duration, repeat ordering, or deployment counts by geography. In practice, the assigned
              pool supports "commercial traction exists" much better than it supports "durable, diversified external
              customer base exists."
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU006
              - CU008
              - CU013
      - number: '6.3'
        title: Expansion depends on partner channels while durability and concentration stay open
        blocks:
          - type: paragraph
            body: >-
              The independent evidence points to opportunity, but also to procurement friction and concentration risk.
              Yicai ties parent-company AgiBot's CP Robotics relationship to vertical application development in life
              sciences, retail, and wellness, which suggests Agilink's commercial expansion may still be mediated
              through the broader AgiBot ecosystem rather than repeatable stand-alone demand. Humanoids Daily's write-up
              of Morgan Stanley's China humanoid survey reinforces that caution: interest is high, but satisfaction is
              low and only a small minority are already evaluating or launching pilots. The same diligence challenge
              appears in discovery itself, where unrelated software and cable companies surface under the "Agilink"
              name, making external customer verification noisier than the headline shipment story. With no disclosed
              NRR, GRR, churn, renewal, or top-customer mix in the assigned pool, durability and concentration remain
              material gaps.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Traction is easier to verify than durability
            body: >-
              Shipment and production milestones suggest real demand, but the public record still lacks the named
              third-party accounts and renewal metrics that would prove the demand is durable and diversified.
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk ranking
        blocks:
          - type: paragraph
            body: >-
              The strongest retained evidence points to three risks that can break the investment case if they remain
              unresolved: parent/control concentration, deployment reliability, and valuation discipline. Official
              history says Agilink was formed within Agibot, while Baidu reports an Agibot-linked shareholder still
              controls about two-thirds of the equity, so governance independence is not yet proven by public materials.
              Product evidence is also still closer to integration guidance, partner workflows, and showcase demos than
              to audited field reliability. Finally, Crunchbase's unicorn framing arrived within months of the spinout,
              but the official public package reviewed here still does not disclose the external-customer revenue
              quality needed to underwrite that price. Kill criteria should therefore focus on control rights, field
              failure data, and external-customer economics rather than on launch cadence alone.
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Governance and regulatory verification risk
        blocks:
          - type: paragraph
            body: >-
              Public governance evidence is directionally useful but incomplete. Agilink's own history says the program
              started within Agibot and only became an independent company in January 2026, while Baidu reports that an
              Agibot-linked shareholder still owns approximately 67 percent of the shares even after new outside
              investors joined. That combination leaves meaningful residual risk around board control, IP assignment,
              related-party transactions, and transfer-pricing. Separately, the retained public set for this chapter did
              not surface a named package of licenses, certifications, litigation outcomes, or enforcement clearances.
              That is not proof of a problem, but it is also not enough to clear legal or regulatory exposure; the right
              next step is a direct diligence package from counsel and management rather than inference from marketing
              pages.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR015
      - number: '7.3'
        title: Product integration and commercialization execution risk
        blocks:
          - type: paragraph
            body: >-
              The product stack looks technically ambitious, but the retained sources describe meaningful integration
              complexity. AGIBOT's own store says compatibility depends on the host robot's mount, payload, power,
              communication, and software interfaces, while MANUS explains that OmniHand control can require
              retargeting, inverse kinematics, and joint-coupling translation rather than a direct joint-to-joint
              mapping. Those facts raise the bar for customers to achieve stable deployments and make reliability
              evidence more important than conference demos. The highest-visibility independent-looking article in the
              pool is still an Agilink-sponsored IEEE Spectrum piece centered on balloon twisting at ICRA, and IFR's
              broader market context says real-world humanoid capabilities remain concentrated in demonstrators or pilot
              projects. The residual question is not whether the demos are impressive, but whether Agilink can convert
              them into repeatable uptime, service, and renewal outcomes.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
      - number: '7.4'
        title: Financing and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Financing momentum is a strength, but it also raises price-discipline and process-maturity risk.
              Crunchbase says Agilink reached a $1 billion valuation after four rounds since the January 2026 spinout,
              while the official about page simultaneously points to a 60-plus-person team scaling toward 100-plus by Q4
              2026 and a dense launch timeline. That combination can be positive if demand quality is proven, yet it
              also means quality systems, partner management, and customer support must scale rapidly. The public
              package reviewed here still does not disclose audited revenue, margin, or external-customer concentration
              data, so investors cannot yet tell how much of the story depends on Agibot internal demand, ecosystem
              partners, or forward-looking market positioning. A disciplined underwriting posture should therefore tie
              valuation comfort to verified external revenue quality and concentration rather than to unicorn status
              alone.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Parent concentration is the cleanest thesis-break test
            body: >-
              If board control, IP assignment, or related-party pricing still heavily favor Agibot after the spinout,
              the upside from Agilink's commercialization may not accrue cleanly to minority investors.
            calloutType: risk
            claimRefs:
              - CR003
              - CR014
          - type: callout
            title: Reliability proof matters more than demo quality now
            body: >-
              The product story is strongest at the demo and partner-workflow level, so the next diligence step should
              be field failure, service, and renewal evidence rather than another showcase clip.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR009
          - type: callout
            title: Do not underwrite the unicorn price without external-customer economics
            body: >-
              A $1B valuation reached within months of the spinout can be justified only if audited external revenue
              quality, concentration, and margin data confirm that demand is broader than parent or ecosystem pull.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public price anchors are strong enough to establish that Agilink has already crossed the unicorn
              threshold, but they are not strong enough to prove the current price is attractive. Dealroom shows a June
              2026 financing event of $138M at a reported $1.4B valuation, while Crunchbase and company- adjacent
              sources consistently place the business in the May-to-June 2026 unicorn cohort. That combination means the
              valuation question is no longer whether the market will pay $1B-plus for the asset; it is whether outside
              investors today have enough evidence on revenue quality, dilution, and repeatable demand to justify
              following that mark without a discount or stronger protections.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish case starts with evidence that Agilink is more than a concept deck: official product pages
              show live dexterous-hand and gripper offerings, the company says the spinout launched scaled product lines
              in 2025 and 2026, and independent reporting ties the current financing to deployment-oriented hardware and
              data programs. The anti-thesis is that the most valuation- sensitive variables remain hidden. Public
              sources do not verify revenue, gross margin, repeat-order behavior, or preference structure, and the
              broader humanoid ecosystem still faces commercialization and safety frictions that can compress multiples
              faster than narrative-driven private marks can recover them.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Scenario framing should stay milestone-based instead of pretending the public record contains a clean
              revenue multiple. Dealroom and Crunchbase imply Agilink is being priced alongside newly minted robotics
              unicorns rather than against disclosed cash-flow fundamentals, so the comparable set is best treated as
              directional sentiment rather than a precise benchmark. The upside path requires proof that shipment claims
              translate into repeat customer demand, healthy margins, and broader licensing beyond the Agibot ecosystem.
              The downside path is straightforward: if policy enthusiasm and category scarcity are doing more work than
              unit economics, a later round can still be flat, structured, or delayed even if the company keeps
              shipping.
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Final recommendation and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports engagement, but not blind price acceptance. Agilink has enough product and financing
              proof to stay on the live diligence list, and the category backdrop is attractive enough that walking away
              entirely would be premature. Even so, the chapter does not clear the bar for a buy because current
              valuation markers are better documented than the economics underneath them. The underwriting discipline
              should therefore be research- more with a stretched valuation stance: revisit only if management can show
              audited or lender-grade revenue quality, external-customer mix, cap-table terms, and evidence that
              commercialization can scale faster than standards, safety, and adoption bottlenecks can slow it.
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
