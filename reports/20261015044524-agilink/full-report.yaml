      - number: '3.4'
        title: Moat durability still depends on proving independence from the parent ecosystem
        blocks:
          - type: paragraph
            body: >-
              The retained evidence suggests Agilink's current edge is partly channel and ecosystem speed. Official and
              affiliate sources say the company was formed inside AGIBOT, Baidu records AGIBOT's Shanghai Zhiyuan
              affiliate with roughly two-thirds ownership, and C Capital ties the hand business to AGIBOT robots already
              working on customer factory floors. That can accelerate deployment, but it also means much of the visible
              proof sits inside a company-controlled or financially aligned network. ROBOTERA already markets its own
              direct-drive hand and in-house stack with multi-site deployments, while Shadow Robot remains a
              recognizable research benchmark, so Agilink still needs more independent win/loss, reliability, and
              pricing proof to show that its advantage is durable rather than a fast-moving, parent-enabled first wave.
            claimRefs:
