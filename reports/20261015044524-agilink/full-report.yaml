      - number: '1.3'
        title: Funding pace, stakeholders, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a very fast capital-formation story. The about page says Agilink became
              independent in January 2026, while Baidu Baike and Sina describe multiple rounds completed within months
              and a unicorn-level valuation by May or June 2026. Baidu Baike also points to a parent-controlled cap
              table, saying Shanghai Zhiyuan New Innovation Technology holds roughly 67% of shares and that Tencent- and
              SAIC-linked vehicles became shareholders. That combination matters for valuation and control analysis:
              Agilink appears to have attracted strong investor pull, but public sources still do not expose board
              composition, investor rights, liquidation preferences, or related-party commercial terms with AgiBot. The
              chapter can therefore establish stakeholder shape, but not yet clean governance economics.
            claimRefs:
