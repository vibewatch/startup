  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is clear, but the offer is still catalog-led
        blocks:
          - type: paragraph
            body: >
              Agilink's official surfaces consistently define the company around dexterous manipulation rather than a
              broad robot platform: the about page frames the company as a builder of robotic hands and grippers, and
              the AGIBOT store asks buyers to choose an end effector around the object, movement, and host robot in the
              target application. That positioning is useful because it anchors the product in a customer workflow
              instead of a generalized embodied-AI narrative. The public catalog is still narrow, however. On the main
              dexterous-hand collection page, the visible current lineup is two OmniHand variants plus OmniPicker 3,
              which suggests a focused end-effector business rather than a fully modular stack with many production
              SKUs. Baidu Baike's scenario summary broadens the same story from catalog to go-to-market: data-collection
              use cases, robot-integration programs, and industrial or research deployments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
