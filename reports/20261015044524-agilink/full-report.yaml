  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer map
        blocks:
          - type: paragraph
            body: >
              The assigned pool points to a narrower market than generic humanoid-robot headlines imply. Agilink's
              official positioning is centered on dexterous hands and grippers, while the AGIBOT store frames selection
              around the object, movement, and host robot instead of the whole robot stack. That keeps the included
              spend at the end-effector, integration, and manipulation-data layer and excludes broader humanoid
              locomotion, full robot platforms, and general-purpose foundation-model budgets that the evidence does not
              isolate. Buyer and payer evidence also clusters around three initial groups: research teams collecting
              manipulation data, robot OEMs or integrators fitting hands into humanoid and general-robot platforms, and
              industrial automation teams using grippers where the workflow favors reliability over anthropomorphic
              dexterity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
              - CM012
