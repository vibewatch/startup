          - type: callout
            title: Ask for parent-versus-external revenue split before underwriting growth
            body: >-
              The key diligence fork is whether shipment scale already reflects third-party demand or is still
              concentrated in Agibot-linked programs, because concentration changes both revenue quality and the margin
              story.
            calloutType: recommendation
            claimRefs:
