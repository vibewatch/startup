      - number: '3.3'
        title: Switching costs exist, but public pricing and win-rate visibility are weak
        blocks:
          - type: paragraph
            body: >-
              The most visible switching-cost levers are integration and developer workflow rather than headline price.
              Agilink's retained sources emphasize mechanical fit, communication protocols, and software access, while
              Unite.ai's recap of published specifications points to SDKs, simulation assets, and ROS 2 reference nodes
              that can create meaningful engineering stickiness once a hand is integrated. Even so, the retained sources
              do not disclose public pricing for Agilink, ROBOTERA, or Shadow Robot, so buyers and investors cannot
              benchmark feature-price tradeoffs cleanly from public evidence. That opacity also makes it harder to know
              whether Agilink wins on capability, discounting, parent-network pull, or bundled support.
