              - CI008
              - CI014
          - type: callout
            title: Capital adequacy remains opaque
            body: >-
              Agilink's 2026 fundraising and unicorn valuation prove investor appetite, not cash runway; absent
              balance-sheet, burn, and debt detail, the chapter cannot underwrite liquidity.
            calloutType: risk
            claimRefs:
