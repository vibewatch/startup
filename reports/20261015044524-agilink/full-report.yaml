  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is broader than hand-vs-hand
        blocks:
          - type: paragraph
            body: >-
              The retained pool shows that Agilink competes on more than a single product axis. Its own official
              surfaces split the market between dexterous hands for multi-finger manipulation and grippers for simpler
              object-handling work, which means the practical substitute is often not another five-finger hand but a
              lower-complexity gripper or other task-specific tooling. The same official guidance also says buyer fit
              depends on mount, payload, power, communication, and software interfaces, so competition is partly a
              component-selection process inside a broader robot program, not just a catalog comparison between end
              effectors.
