            body: >-
              The official timeline shows rapid launch velocity from the 2025 OmniHand generation into the April/June
              2026 Omni 3 family, and public shipment disclosures are moving up quickly enough to suggest real
              commercialization motion even though the published denominators are not cleanly aligned.
            calloutType: strength
            claimRefs:
