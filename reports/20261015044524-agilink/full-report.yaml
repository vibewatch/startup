      - number: '4.3'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Agilink has clearly been able to raise capital, but current adequacy is not publicly underwritable.
              Crunchbase News reports that the company reached a $1 billion valuation after four funding rounds since
              its January 2026 spinout and that the new capital would fund model development, data, and hardware.
              Agilink's own about page also says a June 2026 round pushed post-money valuation above $1 billion. That
              financing momentum matters because the company is adding headcount and shipping increasingly sophisticated
              hardware, both of which usually pull forward working-capital needs, inventory commitments, warranty
              reserves, and support costs. Baidu Baike's ownership summary also says the Agibot parent still holds
              roughly 67% of the shares, so intercompany dependence remains a real consideration even as Agilink
              broadens into the external robotics market.
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed: commercialization appears real, but revenue quality and capital
              sufficiency are not yet transparent enough for a clean underwriting case. Shipment and fundraising
              milestones show momentum, yet none of the reviewed public sources disclose revenue, gross margin, burn,
              runway, debt obligations, customer concentration, or the split between Agibot-internal demand and
              third-party buyers. Humanoids Daily's reporting on Beijing's warning about sector "bubbles" and repetitive
              humanoid products adds a credible adverse backdrop because it raises the bar on differentiation and
              capital discipline exactly when Agilink is scaling production. Until the company provides SKU-level ASPs,
              product-family margins, liquidity, and parent-transaction detail, the chapter supports a research-more
              stance rather than a conviction view on margin path or financing resilience.
            claimRefs:
              - CI007
              - CI010
              - CI012
              - CI013
              - CI014
