      - number: '5.2'
        title: >-
          Publicly evidenced architecture centers on end-effector mechanics, tactile sensing, and integration
          dependencies
        blocks:
          - type: paragraph
            body: >
              The strongest product proof in the assigned pool is the flexible-material demo record. Two independent
              write-ups say OmniHand 3 Ultra handled silk-thread separation, needle threading, hooping, and stitching,
              and both describe a 21-active-DOF, direct-drive hand with tactile sensing. The Rundown adds a training
              path that starts with teleoperated data collection and then reinforcement-learning refinement, which is
              more concrete than generic “AI-powered” positioning. At the same time, the deployment burden is still
              pushed to integrators: the store tells buyers to validate mount, power, communications, and
              control-software compatibility before purchase. That matters because Humanoids Daily places the OmniHand 3
              Ultra-T inside AGIBOT's broader “One Body, Three Intelligences” stack, so the public record points to
              meaningful ecosystem dependence rather than a separately documented Agilink software/control platform.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
              - CE014
          - type: table
            tableRef: TE003
