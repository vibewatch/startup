      - number: '1.4'
        title: Milestones and external risk context
        blocks:
          - type: paragraph
            body: >-
              The dated milestone trail is unusually dense for such a young standalone company: official and third-party
              sources support a path from internal incubation in 2023 to launch milestones in 2025, independence in
              January 2026, new Omni products in April, unicorn valuation markers by May and June, and an October 2026
              dexterity demonstration that helped keep the story visible. That said, the sector backdrop is not
              uniformly favorable. Humanoids Daily reports that Beijing warned China's humanoid and embodied robotics
              sector against "highly repetitive products" and bubble dynamics. For Agilink, that means strong early
              momentum is arriving in a market that may reward differentiated execution but punish copycat hardware and
              overcapitalized supply chains.
