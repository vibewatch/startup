chapter:
  number: 6
  title: "Customers"
  summary: "Public customer evidence supports real demand for dexterous-hand and gripper products, but it is still much stronger on segment fit, shipment milestones, and parent-ecosystem pull than on named third-party production customers. The assigned pool shows a plausible early buyer mix across robotics R&D, robot OEMs, and industrial integrators, while leaving retention, concentration, and external-vs-affiliate revenue quality unresolved."
sections:
  - id: "segment-mix"
    title: "Segment coverage is broad, but payer quality is still inferred more than proven"
    body: >-
      The best-supported customer story in the assigned pool is segment breadth rather than named-account depth. AGIBOT's storefront positions OmniHand and OmniPicker around "interaction & manipulation," "object handling," and "manipulation research," while the AGILINK about page frames the company as a dexterous-manipulation supplier for both research and industry. That combination supports a buyer map spanning robotics research teams, humanoid or general-purpose robot OEMs, and industrial integrators that need end effectors rather than finished robot platforms. It does not, however, identify the payer mix by segment or show how much volume comes from affiliated AGIBOT programs versus outside customers, so the commercial quality of the installed base remains partly inferred.
    claimRefs: ["CU001", "CU002", "CU003", "CU006", "CU007"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-proof"
    title: "Adoption proof is real, but still light on named third-party production deployments"
    body: >-
      The adoption trajectory is stronger than a pure concept-stage robotics supplier, but the proof surfaces remain uneven. AGILINK says the program launched its first products in August 2025 and reached a 1,000th-hand production milestone in December 2025, while Baidu Baike reports more than 8,000 cumulative OmniHand deliveries and more than 10,000 gripper shipments by June 2026. Those milestones imply meaningful physical volume, yet the same source set still fails to show named third-party customers with outcome evidence, contract duration, repeat ordering, or deployment counts by geography. In practice, the assigned pool supports "commercial traction exists" much better than it supports "durable, diversified external customer base exists."
    claimRefs: ["CU004", "CU005", "CU006", "CU012", "CU013"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-and-expansion"
    title: "Expansion depends on partner channels while durability and concentration stay open"
    body: >-
      The independent evidence points to opportunity, but also to procurement friction and concentration risk. Yicai ties parent-company AgiBot's CP Robotics relationship to vertical application development in life sciences, retail, and wellness, which suggests Agilink's commercial expansion may still be mediated through the broader AgiBot ecosystem rather than repeatable stand-alone demand. Humanoids Daily's write-up of Morgan Stanley's China humanoid survey reinforces that caution: interest is high, but satisfaction is low and only a small minority are already evaluating or launching pilots. The same diligence challenge appears in discovery itself, where unrelated software and cable companies surface under the "Agilink" name, making external customer verification noisier than the headline shipment story. With no disclosed NRR, GRR, churn, renewal, or top-customer mix in the assigned pool, durability and concentration remain material gaps.
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU012", "CU013"]
