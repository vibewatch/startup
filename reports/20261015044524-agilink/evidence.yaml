evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-metrics
    missingEvidence: Verified revenue, ASP, repeat-order, gross-margin, and named-customer data by product family.
    whyItMatters: Commercial quality and valuation cannot be judged from shipment or valuation headlines alone.
    diligencePath: Request a management KPI pack with booked revenue, shipments by SKU, repeat orders, and customer concentration.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: Full executive roster, board membership, and formal role descriptions beyond the founder-centric public narrative.
    whyItMatters: Key-person dependence and governance depth cannot be assessed from two public signals alone.
    diligencePath: Request the board deck, org chart, and current director / officer list from counsel or management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: Cap table percentages for all holders, investor-rights terms, and related-party economics with AgiBot.
    whyItMatters: Control, dilution, and transfer-pricing risk directly affect downside protection and valuation quality.
    diligencePath: Obtain the current cap table, financing docs, board observer rights, and intercompany commercial agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: governance
    missingEvidence: An authoritative registry or company-confirmed filing naming the current legal representative.
    whyItMatters: Even basic control-field discrepancies reduce confidence in public governance summaries.
    diligencePath: Pull the latest company registry extract and reconcile it with management's current legal entity chart.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: >-
      An independent 2026 benchmark for China's dexterous-hand market share, including numerator, denominator, and
      methodology.
    whyItMatters: >-
      Leadership claims can affect valuation, competitive positioning, and the credibility of Agilink's current shipment
      narrative.
    diligencePath: >-
      Request a third-party industry ranking, distributor shipment audit, or analyst note that defines the category and
      measures share consistently.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Public ASP, revenue, repeat-order, and segment-budget data by product family and buyer type.
    whyItMatters: >-
      Without monetization and budget data, the chapter cannot convert shipment and installed-base proxies into
      defensible TAM, SAM, or SOM ranges.
    diligencePath: >-
      Collect customer cohort data, price bands, repeat-order rates, and segment revenue splits directly from management
      or channel partners.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-mix
    missingEvidence: Independent customer references that distinguish internal Agibot demand from third-party external buyers.
    whyItMatters: >-
      External-customer breadth determines whether current shipment momentum represents a real market or mostly
      parent-linked pull-through.
    diligencePath: >-
      Request named customer case studies, channel disclosures, or procurement references broken out by internal versus
      external deployments.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public or diligence-room pricing, support, and minimum-order terms for Agilink, ROBOTERA, and Shadow Robot.
    whyItMatters: >-
      Without package economics, capability comparisons cannot be converted into buyer ROI or investor gross-margin
      intuition.
    diligencePath: Request current quote sheets, sample contracts, and realized discount ranges by product family.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent head-to-head benchmarks on dexterity, reliability, failure rates, and customer win/loss outcomes
      versus direct peers.
    whyItMatters: >-
      Current public proof is dominated by company, affiliate, or promotional sources, which weakens confidence in
      durable differentiation.
    diligencePath: >-
      Ask for third-party test reports, reference calls, and customer evaluation scorecards covering Agilink, ROBOTERA,
      and incumbent alternatives.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: parent-dependence
    missingEvidence: >-
      Shipment mix, revenue mix, and transfer-pricing detail separating AGIBOT-linked deployments from third-party
      external sales.
    whyItMatters: If parent-linked volume dominates, apparent market traction may overstate independent competitive pull.
    diligencePath: >-
      Request a customer concentration breakout, related-party revenue schedule, and win/loss data for non-AGIBOT
