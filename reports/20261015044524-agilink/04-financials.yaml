  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-disclosure
      missingEvidence: SKU-level list pricing, realized ASPs, discount policy, payment terms, and contract structure for OmniHand and OmniPicker.
      whyItMatters: Revenue quality cannot be underwritten from shipment counts alone without knowing what customers actually pay.
      diligencePath: Request booked ASP by SKU, channel, and customer segment plus standard order forms and discount approval rules.
      relatedQuestionRefs: [QI002, QI008]
      relatedTableRefs: [TI002, TI003]
    - type: private-evidence-only
      severity: blocking
      topic: profitability
      missingEvidence: Product-family gross margin, BOM, yield, warranty reserve, and post-sale service-cost data.
      whyItMatters: Margin path is the core financial debate for a dexterous-hardware business and is currently unsupported by public evidence.
      diligencePath: Obtain product P&Ls for OmniHand and OmniPicker plus warranty and field-service history.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: liquidity
      missingEvidence: Cash balance, monthly burn, runway, debt facilities, capex commitments, and planned use-of-funds bridge.
      whyItMatters: Fundraising momentum does not prove near-term capital adequacy or next-round dependency.
      diligencePath: Request the latest balance sheet, cash bridge, debt schedule, and board financing plan.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: customer-mix
      missingEvidence: Shipment and revenue split between Agibot-linked internal programs and third-party external customers, plus top-customer concentration.
      whyItMatters: Internal demand can overstate market validation and hide concentration risk.
      diligencePath: Provide customer-level revenue concentration, internal-transfer revenue, and external reorder data.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: missing-source
      severity: material
