schemaVersion: "report-v2"
artifact: financials
slug: agilink
runDate: 2026-10-15
company:
  name: Agilink
chapter:
  number: 4
  title: Financials
  summary: >-
    Agilink's public financial story is still a commercialization narrative rather than an
    underwritable model: official and company-issued sources show a fast ramp in dexterous-hand
    shipments and repeated 2026 fundraising, but they do not disclose revenue, pricing, margins,
    or cash runway. The available evidence supports a hardware-led, integration-heavy revenue
    model with meaningful parent-dependence and sector-bubble risk, leaving margin path and
    capital adequacy as diligence blockers.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: >-
      Agilink's public commercial surface still looks like an industrial hardware supplier, not a
      disclosed recurring-software business. The AGIBOT store only presents OmniHand dexterous
      hands and OmniPicker grippers, while the corporate site describes dexterous manipulation
      systems and end-effector solutions rather than subscriptions or usage-based software. The
      sales path is also consultative: buyers are told to choose around their application, then
      confirm mounting, power, communication, software, budget range, and timeline with sales.
      That implies revenue likely starts with hardware orders plus potentially bundled integration
      support, but public materials do not disclose list prices, realized ASPs, contract length,
      discounts, or any recognized-services revenue.
    claimRefs: [CI002, CI003, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics-proxies
    title: Traction and unit-economics proxies
    body: >-
      Public traction signals are stronger than public economics. Company-issued September 2026
      coverage says Agilink has shipped more than 15,000 dexterous hands, while Baidu Baike's
      June 2026 summary says cumulative OmniHand deliveries exceeded 8,000 units and gripper
      shipments exceeded 10,000 units. The official about page also shows a rapid operating ramp:
      Agilink says it has 60+ team members today, is scaling toward 100+ by Q4 2026, launched
      OmniHand and OmniHand Pro in August 2025, hit its 1,000th hand in December 2025, and
      unveiled multiple Omni 3 products in 2026. Those signals support real production activity,
      but they still do not convert shipment counts into revenue, gross profit, or customer
      quality because the company does not break out realized pricing, external-customer mix, or
      service costs.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financing-dependence
    title: Capital adequacy and financing dependence
    body: >-
      Agilink has clearly been able to raise capital, but current adequacy is not publicly
      underwritable. Crunchbase News reports that the company reached a $1 billion valuation after
      four funding rounds since its January 2026 spinout and that the new capital would fund
      model development, data, and hardware. Agilink's own about page also says a June 2026 round
      pushed post-money valuation above $1 billion. That financing momentum matters because the
      company is adding headcount and shipping increasingly sophisticated hardware, both of which
      usually pull forward working-capital needs, inventory commitments, warranty reserves, and
      support costs. Baidu Baike's ownership summary also says the Agibot parent still holds
      roughly 67% of the shares, so intercompany dependence remains a real consideration even as
      Agilink broadens into the external robotics market.
    claimRefs: [CI004, CI010, CI011, CI012]
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is therefore mixed: commercialization appears real, but revenue
      quality and capital sufficiency are not yet transparent enough for a clean underwriting
      case. Shipment and fundraising milestones show momentum, yet none of the reviewed public
      sources disclose revenue, gross margin, burn, runway, debt obligations, customer
      concentration, or the split between Agibot-internal demand and third-party buyers.
      Humanoids Daily's reporting on Beijing's warning about sector "bubbles" and repetitive
      humanoid products adds a credible adverse backdrop because it raises the bar on
      differentiation and capital discipline exactly when Agilink is scaling production. Until the
      company provides SKU-level ASPs, product-family margins, liquidity, and parent-transaction
      detail, the chapter supports a research-more stance rather than a conviction view on margin
      path or financing resilience.
    claimRefs: [CI007, CI010, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - OmniHand dexterous hands
        - Hardware sale into research, humanoid, and industrial manipulation programs
        - Units shipped / orders
        - ">15,000 dexterous hands shipped by Sep 2026 per company-issued coverage"
        - Company-claimed traction; no public revenue conversion
        - Break out external versus internal mix, ASP by SKU, and gross margin by hand family
      - - OmniPicker grippers
        - Hardware sale for object-handling and gripping tasks
        - Units shipped / orders
        - ">10,000 cumulative gripper shipments reported as of Jun 2026 via Baidu summary"
        - Third-party summary of company claims; no current-run revenue disclosure
        - Provide current shipment count, ASP, repeat-order rate, and customer concentration
      - - Integration / configuration support
        - Pre-sale application scoping and compatibility work around mounting, power, controls, and workflow fit
        - Engineering hours / NRE / bundled services
        - Public sales process is visible, but monetization is undisclosed
        - Inferred from official workflow; no fee schedule or attach rate
        - Quantify services revenue share, implementation burden, and post-sale support economics
    notes: >-
      Quality separates shipment evidence from missing revenue disclosure; unknown means the
      assigned public source pool does not publish a value.
    claimRefs: [CI002, CI003, CI007, CI008, CI009, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - AGIBOT OmniHand 2025 (w.Tactile)
        - Not publicly listed
        - Store presents model selection, but no list price or contract term
        - Realized ASP, discounting, minimum order, payment terms unknown
        - AGIBOT Store
      - - OmniPicker 3
        - Not publicly listed
        - Store frames product fit by object-handling use case, not published pricing
        - Reseller terms, service attach, and warranty economics unknown
        - AGIBOT Store
      - - OmniHand 3 family / flagship variants
        - Not publicly listed
        - Launches are public, but no public monetization detail is attached
        - Development-access terms, channel economics, and contract length unknown
        - AGILINK About page + AGIBOT Store
    notes: >-
      Official sources confirm offers and launch cadence, not realized pricing or revenue
      recognition; blank economics are diligence asks, not zero values.
    claimRefs: [CI006, CI009, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Realized ASP by SKU / channel
        - null
        - Low
        - Shipment counts cannot be translated into revenue quality without realized pricing
        - Provide booked ASP by OmniHand and OmniPicker SKU, by direct versus partner channel
      - - Gross margin by product family
        - null
        - Low
        - Hardware underwriting depends on BOM, yield, warranty, and service burden
        - Share product-family gross margin bridge with material cost and warranty assumptions
      - - Sales cycle / solution-engineering load
        - Consultative sale with compatibility scoping; duration undisclosed
        - Medium
        - Determines CAC, payback, and how scalable the current GTM motion is
        - Report funnel conversion, pilot-to-order timing, and technical-support hours per deal
      - - Installed-base mix
        - null
        - Low
        - Parent-internal demand versus third-party demand changes concentration and revenue quality
        - Split shipments and revenue between Agibot internal programs and external customers
      - - Cash balance / runway
        - null
        - Low
        - Funding momentum does not prove current liquidity or financing dependency
        - Provide cash, burn, debt facilities, capex commitments, and monthly runway bridge
    notes: >-
      Null means no public metric was disclosed in the assigned source pool; confidence reflects
      whether the row rests on direct disclosure versus process inference.
    claimRefs: [CI003, CI004, CI009, CI010, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence points to a hardware-led, sales-assisted bridge from application scoping to shipped end-effectors.
    data:
      nodes:
        - id: lead-intake
          label: Application brief
          detail: Buyer shares task requirements, location, budget range, and project timeline.
        - id: product-selection
          label: Product selection
          detail: Sales steers the buyer toward an OmniHand dexterous hand or OmniPicker gripper.
        - id: technical-fit
          label: Integration check
          detail: Mechanical mount, payload, power, communication, and control software fit are confirmed.
        - id: hardware-order
          label: Hardware order
          detail: Revenue appears to start with end-effector hardware orders rather than a disclosed software subscription.
        - id: deployment
          label: Shipment / deployment
          detail: Shipment milestones show scale, but public sources do not separate internal and third-party demand.
        - id: support-loop
          label: Support / replacement
          detail: Ongoing support and replacement demand are plausible, but no public recurring revenue metric is disclosed.
    claimRefs: [CI002, CI003, CI007, CI009, CI014]
callouts:
  - calloutType: insight
    title: Shipment momentum is not revenue quality
    body: >-
      Shipment milestones show real commercialization, but without public ASP, customer-mix, or
      gross-margin data they should not be treated as a proxy for high-quality revenue.
    claimRefs: [CI007, CI008, CI014]
  - calloutType: risk
    title: Capital adequacy remains opaque
    body: >-
      Agilink's 2026 fundraising and unicorn valuation prove investor appetite, not cash runway;
      absent balance-sheet, burn, and debt detail, the chapter cannot underwrite liquidity.
    claimRefs: [CI010, CI011, CI014]
  - calloutType: recommendation
    title: Ask for parent-versus-external revenue split before underwriting growth
    body: >-
      The key diligence fork is whether shipment scale already reflects third-party demand or is
      still concentrated in Agibot-linked programs, because concentration changes both revenue
      quality and the margin story.
    claimRefs: [CI012, CI014]
