            - label: High
              tone: high
              note: Failed deployments would directly impair adoption and support economics.
            - label: Medium
              tone: medium
              note: Engineering path exists, but public field metrics are missing.
        - label: Demo-to-production conversion
          values:
            - label: Medium
              tone: medium
              note: Showcase momentum exists, but production proof remains thin.
            - label: High
              tone: high
              note: Pilot-stage demand can fade if production economics disappoint.
            - label: Low
              tone: medium
              note: No retained customer cohort or renewal data is visible.
        - label: Hiring / process scaling
