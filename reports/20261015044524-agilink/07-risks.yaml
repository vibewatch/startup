            - label: Medium
              tone: medium
              note: Team scaling and launch cadence imply operational load.
            - label: Medium
              tone: medium
              note: Process gaps can slow service and quality feedback loops.
            - label: Low
              tone: medium
              note: Retained public proof of mature quality systems is limited.
        - label: Valuation / financing discipline
          values:
            - label: High
              tone: high
              note: Unicorn pricing followed the spinout quickly.
            - label: High
              tone: high
              note: Weak demand quality at this price would create downside asymmetry.
            - label: Low
              tone: medium
              note: Public economic disclosure still lags the financing narrative.
    approximationNotes: >-
      Heatmap scores summarize retained evidence rather than audited incident frequencies; they should be updated once
      customer mix, field reliability, and governance documents are provided.
    claimRefs: [CR003, CR006, CR009, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Parent concentration is the cleanest thesis-break test
    body: >-
      If board control, IP assignment, or related-party pricing still heavily favor Agibot after the spinout, the
      upside from Agilink's commercialization may not accrue cleanly to minority investors.
    claimRefs: [CR003, CR014]
  - calloutType: risk
    title: Reliability proof matters more than demo quality now
    body: >-
      The product story is strongest at the demo and partner-workflow level, so the next diligence step should be
      field failure, service, and renewal evidence rather than another showcase clip.
    claimRefs: [CR006, CR007, CR009]
  - calloutType: recommendation
    title: Do not underwrite the unicorn price without external-customer economics
    body: >-
      A $1B valuation reached within months of the spinout can be justified only if audited external revenue quality,
      concentration, and margin data confirm that demand is broader than parent or ecosystem pull.
    claimRefs: [CR010, CR013, CR016]
