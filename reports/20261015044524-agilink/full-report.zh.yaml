      - number: '8.3'
        title: 情景、可比公司与退出准备度
        blocks:
          - type: paragraph
            body: >-
              情景分析应以里程碑为基础，而不是假装公开记录包含一个干净的收入倍数。Dealroom 和 Crunchbase 暗示 Agilink
              的定价更接近新晋机器人独角兽，而非已披露现金流基本面，因此可比集合应被视为方向性情绪，而不是精确基准。上行情景要求证明发货说法能转化为复购需求、健康利润率，并能在 Agibot
              生态之外扩大许可。下行情景很直接：如果政策热情和品类稀缺性比单位经济性更能推动估值，即使公司继续发货，下一轮也可能平价、带结构条款或延期。
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 最终建议与尽调要求
        blocks:
          - type: paragraph
            body: >-
              证据支持继续接触，但不支持盲目接受价格。Agilink
              有足够产品和融资证据留在进行中的尽调名单上，品类背景也足够有吸引力，完全放弃还为时过早。即便如此，本章尚未达到买入门槛，因为当前估值标记比其背后的经济性更有记录。投资判断应因此是“继续研究、估值偏高”：只有当管理层能够展示经审计或达到贷款人标准的收入质量、外部客户结构、股权结构表条款，并证明商业化扩张速度能超过标准、安全和采用瓶颈拖慢速度时，才应重新评估。
            claimRefs:
              - CV010
