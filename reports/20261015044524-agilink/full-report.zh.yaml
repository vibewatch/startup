      - number: '1.2'
        title: 领导层、治理与母公司依赖
        blocks:
          - type: paragraph
            body: >-
              本组证据中最清晰的创始人信号来自 Xiong Kun；Baidu Baike 和 Sina 都将其与 Agilink 分拆及其此前在 Tencent Robotics X
              和机器人工程领域的经历联系起来。这为灵巧末端执行器提供了可信的创始人技术—市场匹配，但也凸显关键人物依赖：公开记录对创始人的信息远多于对管理团队或董事会监督的披露。治理可见度仍不完整。Baidu Baike 将
              Wang Chuang 列为法定代表人，而 Sina 2026 年 5 月文章称为 Deng Taihua，基础公司控制数据出现实时矛盾。官方关于页面还确认 Agilink 先在 AgiBot 内部成立、于
              2026 年 1 月独立，因此仍需核查产品路线、销售结构、IP 和转移定价风险有多少仍绑定母公司生态。
