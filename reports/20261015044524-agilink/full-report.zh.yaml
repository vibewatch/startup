          - type: paragraph
            body: >-
              对于一家如此年轻的独立公司，时间线异常密集：官方及第三方来源支持其从 2023 年内部孵化，经过 2025 年发布里程碑、2026 年 1 月独立、4 月推出新的 Omni 产品、5 月和 6
