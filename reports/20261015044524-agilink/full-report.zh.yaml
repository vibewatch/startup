            body: >-
              本组证据中最强的产品证明是柔性材料演示。两篇独立报道称 OmniHand 3 Ultra 完成丝线分离、穿针、绷圈和缝纫，并都描述其为 21 个主动自由度、直驱、带触觉感知的机械手。The Rundown
              还补充了一条训练路径：先远程操作采集数据，再用强化学习优化，比泛泛的“AI 驱动”定位更具体。与此同时，部署负担仍由集成商承担：商店要求买方在采购前验证安装、电源、通信和控制软件兼容性。这很重要，因为
