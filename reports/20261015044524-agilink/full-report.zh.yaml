      - number: '5.3'
        title: 发布节奏和发货说法支持动能，但尚未达到可据此投资的成熟度
        blocks:
          - type: paragraph
            body: >-
              Agilink 官方时间线显示 2025—2026 年节奏异常快：2025 年 8 月推出 OmniHand 和 OmniHand Pro，2026 年 4 月推出 Omni 3 系列，2026 年 6 月在
              ICRA 发布旗舰 OmniHand 3 Ultra-M。同页的组织建设信号也支持这一点，包括 60+ 人团队向 2026 年第四季度 100+ 人扩张。公开销量说法同样快速上升：6 月 OmniHand
              交付超过 8,000 台，9 月 30 日灵巧手超过 15,000 只，主页快照显示产品总发货超过 20,000 件。这些数字对商业化方向有利，但不能直接比较，因为披露范围从 OmniHand
              交付变为灵巧手，再变为全部产品，且没有区分 AGIBOT 内部项目与第三方客户单位。
