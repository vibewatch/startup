            body: >-
              公开牵引力信号强于公开经济数据。公司发布的 2026 年 9 月报道称 Agilink 已发货超过 15,000 只灵巧手；Baidu Baike 2026 年 6 月摘要称累计 OmniHand 交付超过
              8,000 台，夹爪发货超过 10,000 台。官方关于页面还显示运营快速扩张：Agilink 称当前团队有 60+ 人，计划在 2026 年第四季度扩大至 100+ 人；OmniHand 和 OmniHand
              Pro 于 2025 年 8 月推出，2025 年 12 月交付第 1,000 只机械手，2026 年推出多个 Omni 3
              产品。这些信号支持真实生产活动，但由于公司没有拆分实际定价、外部客户结构或服务成本，发货量仍无法转化为收入、毛利润或客户质量。
