      - number: '3.4'
        title: 护城河能否持久仍取决于证明其独立于母公司生态
        blocks:
          - type: paragraph
            body: >-
              留存证据表明，Agilink 当前优势部分来自渠道和生态速度。官方及关联来源称公司在 AGIBOT 内部成立；Baidu 记录 AGIBOT 的 Shanghai Zhiyuan 关联公司持有约三分之二股份；C
              Capital 将机械手业务与已在客户工厂运行的 AGIBOT 机器人联系起来。这能加快部署，但也意味着大量可见证明位于公司控制或财务关联网络内。ROBOTERA
              已在销售自有直驱机械手和内部栈，并实现多地点部署；Shadow Robot 仍是可识别的科研基准。因此 Agilink
              仍需更多独立的赢单/失单、可靠性和定价证据，证明其优势是持久能力，而不是快速推进、由母公司赋能的第一波。
            claimRefs:
              - CP003
              - CP008
              - CP011
              - CP013
              - CP014
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Agilink 的公开商业形态仍像工业硬件供应商，而不是已披露的经常性软件业务。AGIBOT 商店只展示 OmniHand 灵巧手和 OmniPicker
              夹爪；公司网站描述的是灵巧操作系统和末端执行器方案，而非订阅或按使用量计费的软件。销售路径也偏顾问式：买方先按应用选择，再与销售确认安装、电源、通信、软件、预算范围和时间表。收入可能从硬件订单加潜在捆绑集成支持开始，但公开材料没有披露标价、实际
              ASP、合同期限、折扣或已确认服务收入。
