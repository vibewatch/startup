      - number: '3.3'
        title: 切换成本存在，但公开定价与赢单率可见度低
        blocks:
          - type: paragraph
            body: >-
              最明显的切换成本来自集成和开发者工作流，而不是标题价。Agilink 留存来源强调机械适配、通信协议和软件访问；Unite.ai 对已发布规格的整理提到 SDK、仿真资产和 ROS 2
              参考节点，机械手接入后可能形成明显工程黏性。即便如此，留存来源没有披露 Agilink、ROBOTERA 或 Shadow Robot
              的公开价格，买方和投资者无法从公开证据清楚比较功能与价格。这种不透明也让人难以判断 Agilink 赢在能力、折扣、母公司网络拉动，还是捆绑支持。
