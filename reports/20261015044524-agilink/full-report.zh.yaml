      - number: '2.2'
        title: 规模化视角与需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              证据支持多个规模化视角，但不足以形成单一干净的 TAM。IFR 2026 年发布资料称，中国约有 2m 台在运行的工业机器人，占全球年度工业机器人安装量的
              54%，这是本组证据中最广泛且可信的需求背景。同一来源显示，中国供应商在国内安装量中的份额从 2020 年的 30% 升至 2024 年的 57%；这很重要，因为 Agilink
              正把中国设计的末端执行器卖入政策支持的国产化周期。Humanoids Daily 还提供第二个视角：2026 年第一季度中国有超过 50 笔具身智能融资、资本规模约 RMB 20b；Humanoids Daily
              和 Baidu 的 Agilink 发货数字则提供第三个当前吞吐量视角。合在一起，这些输入足以支撑需求叙事，但仍是装机基数、资本和单位发货量代理指标，而非有收入支撑的市场栈。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
