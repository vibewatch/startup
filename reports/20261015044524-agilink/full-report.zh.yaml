      - number: '2.3'
        title: 采用约束与尚未解决的市场证明
        blocks:
          - type: paragraph
            body: >-
              最强的反证不是需求消失，而是广泛的人形机器人商业化仍比独角兽叙事更慢、更窄。IFR 明确表示，普遍的人形机器人工厂或家庭采用在近期和中期不会发生，并预计未来五至十年 AI 将与传统工业机器人结合采用。这把
              Agilink 近期商业机会推向具体、可集成的工作流，而不是泛泛声称整个人形机器人市场已经打开。本组证据还留下两个与估值相关的缺口：没有独立分母验证 Agilink 所称 2026
              年第一季度中国市场份额领先，也没有公开收入、ASP 或外部客户结构披露来把发货叙事转换为可辩护的 TAM、SAM 或 SOM 区间。
            claimRefs:
              - CM003
              - CM011
              - CM013
              - CM014
              - CM015
