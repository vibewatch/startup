      - - 对母公司及控制权的依赖
        - Agibot / 与 Agibot 相关的股东
        - 起源平台、控股股东及可能的关联方锚点
        - 高
        - 治理、定价或 IP 决策偏向母生态，而非少数投资者或外部客户。
        - 高
        - 完成拆分并获得外部融资，说明公司已有一定机构化。
        - 在控制权和关联方边界形成文件前，风险维持高位。
      - - 工作流与集成伙伴
        - MANUS 和系统集成商
        - 支持遥操作、重定向、数据采集和部署工作流
        - 中
        - 客户需要特定伙伴的工具或专业能力，导致上线变慢或支持成本上升。
        - 中
        - 开放接口和多条集成商路径可能逐步降低锁定。
        - 留存的伙伴冗余证据有限，因此风险为中。
      - - 外部买方对估值的支撑
        - 外部客户基础与内部 / 生态需求
        - 为独角兽叙事验证收入并支撑价格
        - Unknown
        - 若外部客户占比低或过于集中，需求质量将弱于融资叙事。
        - 高
        - 除融资势头和产品里程碑外，留存公开证据中看不到任何缓释措施。
        - 在披露经审计的外部客户收入构成和集中度前，风险维持高位。
    notes: 集中度反映留存来源公开揭示的内容；“未知”表示指定样本没有量化分母，不代表集中度低。
    claimRefs:
      - CR003
      - CR006
      - CR010
      - CR013
      - CR014
      - CR016
  - id: TV001
    title: 建议摘要表
    columns:
      - 观察维度
      - 建议
      - 置信度
      - 风险评级
      - 估值判断
      - 决策含义
    rows:
      - - 当前判断
        - research-more
        - medium
        - high
        - stretched
        - 继续推进尽调，但在获得更扎实的经济性和治理证据前，不要按当前价格做投资判断。
      - - 升级条件
        - conditional buy
        - low
        - medium
        - fair-to-attractive
        - 需要验证收入质量、外部客户集中度数据，以及能防范平价或结构化后续轮融资的条款。
    notes: 公开来源提供了估值标记和产品进展代理指标，但没有经过验证的收入、利润率或优先权结构细节；第二行是尽调门槛，不是当前判断。
    claimRefs:
      - CV002
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 当前证据
      - 哪些事实会改变判断
    rows:
      - - 正方：商业化是真实的
        - 官方和独立来源显示 OmniHand、OmniPicker 产品在售，2026 年 6 月完成独角兽融资，且灵巧手出货量据称超过 8,000 只。
        - 经验证的客户名称、复购节奏和按产品线拆分的收入，将显著强化这一判断。
      - - 正方：品类顺风有助于退出
        - IFR 和 IDC 都将机器人及人形机器人采用描述为战略增长市场，同时中国政策提供支持，出货量预计快速增长。
        - 持续的出口需求或非 Agibot 授权证据，会让这一顺风更能落到公司本身。
      - - 反方：估值领先于已披露的经济性
        - 公开记录显示定价超过 $1B，但没有经审计的收入、毛利率、留存或复购质量。
        - 若在相近估值完成一轮有价格的融资，并由经审计的经营指标支撑，这一差距会缩小。
      - - 反方：采用与安全摩擦会压缩倍数
        - IFR 和行业报道都警告，大规模采用并非近期之事，安全标准和触觉传感瓶颈仍在解决。
        - 第三方证明产品已可靠地大规模生产部署，将降低这一下行风险。
    notes: 这张表混合了直接来源事实与投资判断，因此每一行都应视为综合论点，而非孤立的原始数据点。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 出货转化为可重复的外部需求，OmniHand 3 实现规模化生产，Agilink 也从封闭生态销售拓展出去。
        - 当前独角兽估值将证明偏保守，下一轮可凭经济性支撑的增长获得更高定价。
        - 执行延误、出口摩擦或利润率偏低，仍可能封顶上行空间。
        - 前提是验证当前出货叙事能转化为收入。
      - - 基准
        - 产品进展延续，但投资者仍缺少经审计的经济性数据和清晰的股权结构表。
        - 当前 $1.0-1.4B 区间更像持仓估值，而不是明显的便宜价格。
        - 外部客户增长停滞或治理复杂度上升，可能令回报维持平庸。
        - 与今天的证据最匹配。
      - - 悲观
        - 出货势头真实存在，但变现、客户多元化或安全准备度令人失望。
        - 下一轮融资需要结构化安排、估值下调，或耗时长于当前叙事所暗示的时间。
        - 若品类倍数在基本面追上前降温，下一轮降价融资风险会上升。
        - 若数据室证据无法填补当前缺口，这一情景最可能发生。
      - - 止损触发条件
        - 管理层无法验证收入质量、非 Agibot 客户构成或优先股堆叠。
        - 没有下行保护，就没有理由支付由叙事驱动的独角兽价格。
        - 信息不对称主导投资判断。
        - 应立即将判断从“继续研究”改为“放弃”。
    notes: 这些是投资判断情景，不是模型输出；公开证据不足以支撑可辩护的 DCF 或收入倍数推导，因此区间以定性方式表达，而不制造虚假的精确度。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV009
      - CV010
