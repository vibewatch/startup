      - number: '3.2'
        title: 直接同业、相邻供应商与老牌厂商分别争夺不同买方重点
        blocks:
          - type: paragraph
            body: >-
              在 2026 年留存材料中，Agilink 最明确的相邻压力来自 ROBOTERA；它把灵巧手架构与更广泛的机器人平台结合，并在物流领域展现商业化。Shadow Robot
              构成另一种老牌威胁：本组证据较少显示其近期规模化部署，但它拥有长期科研信誉和一只 24 自由度机械手，仍是高端基准。Agilink 位于两者之间：比 Shadow Robot
              更新、更快，但仍需证明早期发货和市场份额说法能否转化为相对于其他具身 AI 厂商的持久、独立验证份额。
