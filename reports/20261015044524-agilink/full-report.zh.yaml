      - number: '5.4'
        title: 技术尽调应聚焦 SKU 对账、可靠性与信任证明
        blocks:
          - type: paragraph
            body: >-
              当前证据集最大的产品风险不是缺少活动，而是丰富演示和发布叙事与薄弱运营证明之间的差距。公开材料没有把 OmniHand 3 系列整理成清晰的 SKU 架构图：独立演示报道将 OmniHand 3 Ultra
              描述为 21 自由度直驱机械手，而 APC 报道将 OmniHand 3 Ultra-T 描述为 22+3 自由度腱驱系统。这可能代表不同产品而非矛盾，但买方仍需就驱动、传感和支持的工作负载进行精确的 SKU
              级尽调。同样重要的是，本组证据没有建立生产可靠性指标、面向客户的支持 SLA 或外部信任/合规文件。对投资判断而言，这些缺口比再看一次英雄演示更重要，因为它们决定 Agilink
              卖的是可复用子系统，还是仍高度依赖工程师的集成项目。
