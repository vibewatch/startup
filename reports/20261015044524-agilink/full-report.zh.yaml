        blocks:
          - type: paragraph
            body: >-
              Agilink 当前的官方定位集中在灵巧操作系统，而不是通用人形机器人：公司称其为科研、工业自动化和服务机器人设计并制造高自由度灵巧手与自适应夹爪。官方渠道当前主推 OmniHand 3 系列和
              OmniPicker 3，公开产品目录强调应用适配、安装、电源、通信和控制软件集成。规模方面，目前最醒目的数字仍是公司自称，而非独立基准验证：Agilink 主页宣称 2026 年第一季度市场份额第一、已发货
              20,000+ 件产品，并积累 50,000+ 小时真实世界数据。这些说法说明商业化和部署野心确实存在，但还不能替代经验证的收入、客户集中度或复购披露。
