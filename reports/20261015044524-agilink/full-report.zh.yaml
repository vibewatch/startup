      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Agilink 显然具备融资能力，但当前资本充足性无法公开评估。Crunchbase News 报道，公司在 2026 年 1 月分拆后完成四轮融资并达到 $1B
              估值，新资本将用于模型开发、数据和硬件。Agilink 关于页面还称，2026 年 6 月一轮融资将投后估值推至 $1B
              以上。这一融资动能很重要，因为公司正在增员并发货更复杂的硬件，通常会提前拉动营运资金、库存承诺、保修准备金和支持成本。Baidu Baike 的持股摘要还称 Agibot 母公司仍持有约 67% 股份，因此即使
              Agilink 向外部机器人市场拓展，集团内依赖仍是现实考量。
            claimRefs:
