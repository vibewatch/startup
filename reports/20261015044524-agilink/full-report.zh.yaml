        title: 产品范围清晰，但供给仍由目录驱动
        blocks:
          - type: paragraph
            body: >-
              Agilink 官方渠道始终把公司定义为灵巧操作企业，而不是广泛的机器人平台：关于页面将公司定位为机械手和夹爪制造商，AGIBOT
              商店则要求买方围绕目标应用中的物体、动作和宿主机器人选择末端执行器。这种定位有价值，因为它把产品锚定在客户工作流，而不是笼统的具身 AI 叙事上。不过公开目录仍很窄。主灵巧手集合页当前可见产品是两个
              OmniHand 变体加 OmniPicker 3，说明它更像聚焦的末端执行器业务，而不是拥有大量生产 SKU 的完整模块化栈。Baidu Baike 的场景摘要则把同一故事从目录扩展到
              go-to-market：数据采集、机器人集成以及工业或科研部署。
