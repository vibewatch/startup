        title: 剩余风险排序
        blocks:
          - type: paragraph
            body: >-
              最强的留存证据指向三项风险：母公司/控制权集中、部署可靠性和估值纪律。如果无法解决，它们都可能击穿投资逻辑。官方历史称 Agilink 在 Agibot 内部成立；Baidu 报道 Agibot
              关联股东仍控制约三分之二股权，因此公开材料尚未证明治理独立。产品证据也更接近集成指引、伙伴工作流和展示演示，而不是经过审计的现场可靠性。最后，Crunchbase
              在分拆数月内采用独角兽叙事，但本次审阅的官方公开材料仍未披露足以支撑该价格的外部客户收入质量。因此，否决标准应聚焦控制权、现场故障数据和外部客户经济性，而不是只看发布节奏。
            claimRefs:
              - CR003
              - CR006
              - CR009
