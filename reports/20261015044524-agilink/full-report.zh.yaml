  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方图谱
        blocks:
          - type: paragraph
            body: >-
              本组证据指向的市场比泛化的人形机器人头条更窄。Agilink 官方定位围绕灵巧手和夹爪，AGIBOT
              商店则按物体、动作和宿主机器人来选择产品，而不是按整套机器人选择。因此纳入的支出集中在末端执行器、集成和操作数据层，不包括证据无法单独拆出的更广泛人形机器人移动、整机平台和通用基础模型预算。买方和付款方初步集中在三组：采集操作数据的科研团队、把机械手装入人形和通用机器人平台的机器人
              OEM 或集成商，以及在可靠性优先于拟人灵巧性的流程中使用夹爪的工业自动化团队。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
