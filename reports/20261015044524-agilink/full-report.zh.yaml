        title: 融资速度、利益相关方与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一条非常快的资本形成故事。关于页面称 Agilink 于 2026 年 1 月独立；Baidu Baike 和 Sina 描述其在数月内完成多轮融资，并在 2026 年 5 月或 6
              月达到独角兽估值。              Baidu Baike 还指向由母公司控制的股权结构表：Shanghai Zhiyuan New Innovation Technology 持有约 67%
              股份，腾讯和上汽关联主体成为股东。这对估值与控制权分析很重要：Agilink 似乎获得了强劲投资者拉力，但公开来源仍未披露董事会构成、投资者权利、清算优先权或与 AgiBot
