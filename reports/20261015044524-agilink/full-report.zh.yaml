      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论因此是混合的：商业化似乎真实存在，但收入质量和资本充足性尚不透明，无法形成干净的投资判断。发货和融资里程碑显示动能，但所审阅的公开来源均未披露收入、毛利率、现金消耗、现金跑道、债务义务、客户集中度，或
              Agibot 内部需求与第三方买方的比例。Humanoids Daily 对北京警告行业“泡沫”和重复人形产品的报道构成可信的不利背景，因为它恰好在 Agilink
              扩大生产时提高了差异化和资本纪律门槛。在公司提供 SKU 级 ASP、产品系列利润率、流动性和母公司交易细节之前，本章支持“继续研究”，而非对利润路径或融资韧性形成确定判断。
            claimRefs:
              - CI007
              - CI010
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 发货动能不等于收入质量
            body: 发货里程碑说明商业化真实存在，但没有公开 ASP、客户结构或毛利数据，就不应把它们当作高质量收入的代理指标。
            calloutType: insight
            claimRefs:
              - CI007
              - CI008
              - CI014
          - type: callout
            title: 资本充足性仍不透明
            body: Agilink 在 2026 年融资并达到独角兽估值，证明投资者愿意下注，而不是证明现金跑道；缺少资产负债表、现金消耗和债务细节，本章无法评估流动性。
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI014
          - type: callout
            title: 在评估增长前要求母公司与外部收入拆分
            body: 关键尽调分叉在于发货规模是否已经反映第三方需求，还是仍集中在 Agibot 关联项目，因为集中度会同时改变收入质量和利润故事。
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI014
  - number: 5
    title: 产品与技术
