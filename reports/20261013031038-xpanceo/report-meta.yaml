  topStrengths:
    - $290M of disclosed capital and a $1.35B valuation give Xpanceo unusual runway for a deep-tech hardware program.
    - Public prototype activity suggests meaningful subsystem progress across optics, sensing, power, and packaging.
    - The roadmap starts with narrower medical and industrial wedges rather than forcing an immediate consumer launch.
    - Scientific leadership and a concentrated R&D team are aligned around a hard, defensible technical problem.
  topRisks:
    - >-
      No commercial revenue, no active customers, and no public clinical filings leave the business unproven
      commercially.
    - Smart contact lens integration, power, thermal, and biocompatibility constraints could delay or derail execution.
    - >-
      Cap-table, manufacturing-yield, and regulatory details remain insufficiently disclosed for a high-confidence
      underwriting view.
    - The current valuation already prices in multiple milestones that have not yet been independently verified.
  unresolvedGaps:
    - Clinical and regulatory roadmap, including first-in-human evidence and any filed submissions
    - Current burn, runway, cap table, board rights, and preference stack
    - Manufacturing partner, yield assumptions, and quality-system readiness
    - Named pilot customers or buyer proof in medical, enterprise, or frontier wedges
    - User willingness-to-wear and retention data for direct-eye devices
