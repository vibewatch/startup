companyProfile:
  summary: >-
    Xpanceo is a Dubai-based deep-tech startup founded in 2019 that is building an AI-powered smart contact lens
    platform spanning XR display, health sensing, power, and transparent electronics. The company has raised $290M
    across seed and Series A financing, employs roughly 100 specialists, and is pursuing a staged roadmap that starts
    with medical and industrial wedges before any broader consumer rollout. Despite visible prototype progress, the
    business remains pre-commercial with no disclosed revenue or active commercial customers and a long regulatory path
    ahead.
  foundedDate: '2019-01-01'
  founders:
    - name: Roman Axelrod
      role: Co-founder and Managing Partner
      background: Serial technology entrepreneur who anchors the commercial and capital-formation side of the company.
      claimRefs:
        - CO004
    - name: Valentyn S. Volkov
      role: Scientific Co-founder and Partner
      background: Physicist leading the nanophotonics, optics, and advanced materials research agenda.
      claimRefs:
        - CO005
  foundingLocation: Dubai, United Arab Emirates
  headquarters: Dubai, United Arab Emirates
  productSummary: >-
