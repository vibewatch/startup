callouts:
  - calloutType: "risk"
    title: "The Ocular Integration Chasm"
    body: >
      While Xpanceo has demonstrated more than 28 standalone prototypes across individual functional domains (glaucoma sensing, optical zoom, and holographic AR projection), combining all components into a single submillimeter lens without thermal buildup or polymer delamination represents an unproven engineering leap. Historical attempts by Google Verily and Mojo Vision collapsed under the weight of ocular physiological limits and capital intensity.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR006"
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "Capital Structure Dilution Risk"
    body: >
      Xpanceo's $250 million Series A round establishes the highest valuation benchmark in MENA deep-tech history at $1.35 billion. However, lead investor Opportunity Venture (Asia) holds substantial concentration across all financing rounds. If human clinical milestones or integrated prototype demonstrations slip past early 2027, the company faces severe valuation compression upon seeking Western institutional or corporate strategic capital.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
