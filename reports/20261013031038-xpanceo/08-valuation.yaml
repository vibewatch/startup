    title: 'Investment Stance: Research-More at Stretched Valuation'
    body: We advise prospective investors to maintain a research-more stance on Xpanceo. The $1.35 billion Series A post-money valuation prices in seamless commercial scaling for a deep-tech venture that is years away from human clinical validation and commercial revenue generation.
