  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Catalyst to Shift View
    rows:
      - - Technology & Form Factor
        - Smart contact lenses eliminate clumsy AR headsets and provide invisible, weightless computing with 30-degree FOV
        - Integrating display, power, and sensors into a single submillimetre lens remains unproven on humans; Mojo Vision pivoted after $204M
        - Successful public on-eye wearing of integrated prototype by founders in early 2027
      - - Capital & Runway
        - Securing $250M Series A provides deep-tech runway and allowed doubling laboratory facilities and team to 100 staff
        - Single lead investor Opportunity Venture (Asia) led both Seed and Series A; missing syndicated tier-1 global deep-tech VCs
        - Syndicated financing round with independent tier-1 institutional hardware/biotech investors
      - - Commercial Model
        - Multi-layered revenue model projecting $1,500 device MSRP plus $1,800 annual AR advertising and $100 app fees per user
        - Zero commercial traction, unverified consumer willingness to insert active electronics on cornea, and 2031 non-wearer crossover assumption is speculative
        - Signed paid enterprise or healthcare pilot contracts with non-refundable commitments
      - - Regulatory & Clinical
        - Dual medical/consumer positioning allows glaucoma IOP and diabetes tear glucose diagnostics to enter healthcare markets
        - Ocular contact devices face rigorous FDA/EMA Class II/III medical device approval hurdles with no public clinical trial filings to date
        - Public registration of clinical protocols and institutional review board trial clearance
    notes: Juxtaposes key investment thesis pillars against structural technical, clinical, and commercial counterarguments.
