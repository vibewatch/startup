  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Integrates display and power by 2027; passes clinical trials in 2027; launches commercial device by 2028; reaches 1M users by 2030
        - $5.0B+ strategic acquisition by Big Tech (Meta, Apple, Google) seeking post-smartphone interface dominance; 3.7x+ gross return
        - Big Tech builds competing smart glasses that capture user attention before lenses mature
        - 15%
      - - Base Case
        - Demonstrates integrated prototype in 2027; human clinical trials extend into 2028-2029; commercial launch deferred to 2030; standalone B2B niche adoption
        - $1.0B-$1.5B flat to modest valuation recapitalization; dilutive Series B needed to fund extended trials; 0.7x-1.1x return
        - R&D burn consumes $250M before commercialization, requiring structured preferred equity
        - 55%
      - - Bear Case
        - Technical bottlenecks in ocular power dissipation or corneal oxygenation prove insurmountable; clinical safety issues or regulatory refusal
        - $100M-$200M distressed IP liquidation or acqui-hire; common equity wiped out by Series A liquidation preferences
        - Device failure on eye; severe ocular adverse event; inability to raise follow-on capital
        - 30%
    notes: Probability-weighted return scenarios based on execution of 2026-2027 prototype and clinical milestones.
