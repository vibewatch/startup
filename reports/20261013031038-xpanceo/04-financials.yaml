callouts:
  - calloutType: risk
    title: Audacious Capital Risk in Unproven Hardware Form Factor
    body: XPANCEO is attempting what tech giants Apple, Google, and Mojo Vision abandoned or scaled back after spending billions of dollars. At a $1.35 billion valuation with zero commercial revenue, the capital at risk is extraordinary if biocompatibility, manufacturing yield, or clinical approvals encounter delays.
    claimRefs:
      - CI001
      - CI008
      - CI009
      - CI010
  - calloutType: insight
    title: Two-Stage Commercialization Decouples Near-Term B2B from Consumer Scale
    body: 'Rather than betting entirely on an immediate consumer electronics release, XPANCEO is pursuing a phased monetization roadmap: targeted B2B deployments in glaucoma and oncology medication monitoring post-2026 provide early commercial validation before attempting mass-market consumer entry around 2030.'
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI014
