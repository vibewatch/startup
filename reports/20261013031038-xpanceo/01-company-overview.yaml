  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capitalization-and-board-composition
      missingEvidence: Detailed cap table, preferred stock liquidation preferences, and formal board composition beyond sole disclosed lead investor Opportunity Venture (Asia).
      whyItMatters: A single lead investor backing both seed ($40M) and Series A ($250M) creates significant governance concentration and obscures economic rights, secondaries, and minority protections.
      diligencePath: Request corporate charter, Series A investor rights agreement, and certified share register during formal confirmatory diligence.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: clinical-trial-and-regulatory-filings
      missingEvidence: Independent regulatory filings, institutional review board (IRB) approvals, or clinical trial registry entries for human ocular testing.
      whyItMatters: Direct-eye electronic devices face stringent class II/III medical device regulatory barriers; lack of formal filings means human clinical safety milestones remain unverified by third parties.
      diligencePath: Review clinical protocol documentation, pre-submission FDA correspondence, and local UAE Ministry of Health clinical trial permits.
      relatedQuestionRefs:
        - QO004
