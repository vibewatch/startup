      - number: '5.2'
        title: User Workflows, Clinical Diagnostics, and Frontier Operational Wedges
        blocks:
          - type: paragraph
            body: >-
              To bypass consumer adoption friction and near-term retail form-factor expectations, Xpanceo has divided
              its commercialization pathway into specialized clinical and industrial application wedges. In clinical
              diagnostics, the company has developed a smart contact lens for glaucoma management that incorporates a
              microscopic surface optical pattern that shifts in response to intraocular pressure fluctuations. Patients
              photograph the lens using a smartphone camera, allowing a proprietary neural network trained on over
              10,000 measurements across varied iris pigments to estimate intraocular pressure non-invasively. A
              companion biochemical sensing prototype employs functionalized gold nanoparticles—measuring roughly 1,000
              times thinner than human hair—to detect glucose and oncology drug metabolites in tear fluid without
              requiring blood draws or interstitial skin needles. In industrial and extreme environments, Xpanceo pairs
              a helmet-mounted external projection unit with an embedded holographic optical element inside the contact
              lens, providing astronauts, military aviators, and industrial technicians with heads-up situational data
              without adding head-worn display bulk.
