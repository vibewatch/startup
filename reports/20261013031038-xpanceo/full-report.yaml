      - number: '4.2'
        title: Pricing Power and Market Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Because XPANCEO has not released commercial pricing or signed public customer contracts, pricing power
              must be evaluated against broader spatial computing and smart eyewear market benchmarks. According to IDC,
              global smart glasses shipments reached 2.25 million units in Q1 2026, with average selling prices (ASPs)
              starting at approximately $376 in 2026 and projected to compress to $229 by 2030 as mass-market scale
              expands. Smart contact lenses face a fundamentally bifurcated pricing dynamic: medical diagnostic wedges
              can support premium healthcare pricing subsidized by clinical reimbursement codes, whereas consumer
              adoption requires competing directly against mainstream smart glasses pricing. Until XPANCEO completes
              clinical trials and demonstrates commercial manufacturing yields with industrial partners, any revenue
              underwriting based on list pricing or consumer willingness-to-pay remains purely speculative.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
      - number: '4.3'
        title: Cost Structure, R&D Capital Intensity, and Cash Runway
        blocks:
          - type: paragraph
            body: >-
              XPANCEO's cost structure is defined by the heavy capital requirements of advanced nanotechnology,
              photonics, and cleanroom experimentation. Founder Roman Axelrod disclosed that building and equipping the
              company's central Dubai laboratory has required approximately $8 million in capital expenditure to date,
              with substantial additional facility investments planned over the next several years. Operating expenses
              are primarily driven by personnel costs across a team of 100 specialized scientists, optical engineers,
              and operational staff. Assuming an average fully loaded tech-talent compensation profile in the UAE and
              European research hubs, baseline personnel burn likely ranges between $1.0 million and $1.5 million
              monthly, before factoring in external fabrication runs, academic research sponsorships, and specialized
              materials procurement. Supported by the $250 million Series A financing closed in July 2025, XPANCEO
              maintains a substantial multi-year cash cushion that insulates the company from immediate financing
              dependency as it pursues its 2026-2027 milestone targets.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI013
