      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Adoption pathways for smart contact lens technology split across three divergent customer archetypes, each
              governed by incompatible procurement cycles and regulatory gates. In the defense and aerospace frontier
              vertical, buyers are institutional program managers (e.g., flight operations, defense procurement) seeking
              hands-free heads-up displays where helmets or face masks make conventional AR glasses impossible. Here,
              budgets are funded via specialized R&D and defense procurement allocations with high willingness to pay,
              but procurement cycles routinely take 36 to 60 months and require rigorous MIL-STD environmental
              ruggedization. In the clinical and ophthalmic vertical, the user is a patient suffering from glaucoma or
              chronic conditions, but the decision-maker and gatekeeper is an ophthalmologist or health insurer.
              Adoption triggers require peer-reviewed clinical validation against gold-standard tonometry or blood
              assays, and reimbursement relies on established CPT/DRG diagnostic billing codes. Finally, in the mass
              consumer and enterprise productivity vertical, individual consumers and enterprise IT departments control
              spending, where purchase triggers depend entirely on comfort, aesthetic invisibility, and battery autonomy
              exceeding a full working day.
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth Drivers, Biological Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver propelling investor interest in ocular computing is the secular industry shift
              from handheld smartphones to ambient AI-first spatial computing. Meta's commercial success with smart
              glasses demonstrates significant consumer appetite for hands-free contextual AI audio and capture.
              However, smart contact lenses encounter severe structural constraints that conventional head-worn frames
              avoid. First, corneal physiology imposes strict oxygen transmissibility (Dk/t) limits; embedding silicon
              displays, antennas, and solid-state microbatteries risks corneal hypoxia, ocular infection, and chronic
              irritation during extended wear. As acknowledged in engineering disclosures with microbattery developer
              ITEN, powering sustained milliwatt-level microdisplays on the human eye requires microbatteries that do
              not generate hazardous heat or volume expansion. Second, regulatory classification as a Class II or Class
              III medical device necessitates multi-year clinical trials before commercial marketing. While Xpanceo has
              targeted clinical trials by the end of 2026 with a fully integrated prototype demonstration scheduled for
              early 2027, the company has not published peer-reviewed human safety data, clinical trial registry
              identifiers, or customer unit economics, leaving substantial diligence gaps regarding actual market
              adoption timing.
            claimRefs:
              - CM002
              - CM004
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Ocular Chasm Between Smart Glasses and Smart Contact Lenses
            body: >-
              While the rapid commercial traction of display-less smart glasses (167% YoY shipment surge in Q1 2026 per
              IDC) demonstrates robust demand for lightweight AI wearables, smart contact lenses face an entirely
              different risk profile. Contact lenses place active electronics and microbatteries directly against the
              cornea, transforming a consumer gadget into an invasive Class II/III medical device requiring rigorous
              regulatory clearances, clinical trials, and biocompatibility validation.
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM014
          - type: callout
            title: Frontier Industrial and Medical Wedges vs. Consumer Horizon
            body: >-
              Xpanceo's development of standalone prototype applications—such as AR vision for space/flight helmets and
              non-invasive glaucoma monitoring—represents a pragmatic commercial wedge. High-margin aerospace and
              medical diagnostic buyers have established budgets and tolerance for specialized companion hardware,
              offering an addressable entry path before consumer mass adoption becomes feasible.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The landscape for ocular and spatial computing divides into three distinct competitive vectors: direct
              smart contact lens pioneers attempting on-eye integration, Big Tech consumer electronics incumbents
              developing smart glasses and spatial computing headsets, and medical device manufacturers offering
              single-purpose diagnostic lenses. Within the direct category, Xpanceo operates in rare isolation following
              the high-profile failure of Mojo Vision, which raised over $205 million to build an augmented-reality
              contact lens before abandoning the program in 2023 due to insurmountable optical efficiency bottlenecks
              and capital constraints. Big Tech incumbents, led by Meta and Apple, have concentrated capital on external
              facial wearables such as Meta Ray-Ban glasses and Apple Vision Pro, commanding immense consumer brand
              equity, established developer ecosystems, and global retail distribution channels that startup entrants
              cannot match. While Xpanceo claims that daily contact lens wearers create an expansive addressable market
              for invisible computing, the company must overcome both the mechanical substitutes of mature smart glasses
              and the biological hurdles that previously halted pioneer ventures.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP010
              - CP015
