      - number: '4.4'
        title: Financial Underwriting Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, XPANCEO presents a high-conviction deep-tech binary bet
              rather than a measurable commercial growth asset. The company's $1.35 billion post-money valuation
              represents an extraordinary premium for an organization with $0 in revenue, pricing in flawless multi-year
              technological integration and regulatory execution. Historical precedents underscore the severity of this
              risk: global technology leaders including Apple, Google, and Mojo Vision collectively poured hundreds of
              millions into direct-eye and AR contact lens initiatives before suffering commercial retreat or severe
              pivots. Furthermore, academic research literature highlights that smart contact lenses require extensive
              multi-year clinical trials to establish human ocular biocompatibility, continuous diagnostic precision,
              and patient safety. Key diligence blockers include the complete absence of audited financial statements,
              undisclosed monthly cash burn rates, lack of manufacturing yield projections, and unverified commercial
              customer demand.
