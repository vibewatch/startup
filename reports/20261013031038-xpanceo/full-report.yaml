      - number: '5.4'
        title: Manufacturing Scale, Biocompatibility, and Regulatory Certification Horizons
        blocks:
          - type: paragraph
            body: >-
              Moving from laboratory bench prototypes to a wearable ophthalmic product introduces severe biological,
              material, and regulatory barriers. Academic clinical literature establishes that extended contact lens
              wear requires high oxygen permeability (Dk) and surface wettability; inadequate oxygen diffusion across
              the cornea induces corneal acidosis, epithelial keratitis, and endothelial edema. Embedding opaque silicon
              chips, metallic antennas, and solid-state battery cells inherently obstructs natural gas exchange and tear
              film dynamics across the ocular surface. While Xpanceo expanded its Dubai R&D facility in late 2025 with
              dedicated biosensing and photonics cleanroom suites, commercial manufacturing requires medical-grade
              cleanroom fabrication and ISO 13485 quality system certification. Furthermore, regulatory precedents
              highlight a demanding timeline: the FDA database of sensor-based digital health technologies (sDHT) shows
              no approved or cleared smart contact lenses as of mid-2026. Xpanceo's target of initiating clinical trials
              by the end of 2026 represents the earliest step in a multi-year Class II or Class III medical device
              clearance pathway.
            claimRefs:
              - CE011
              - CE013
              - CE014
