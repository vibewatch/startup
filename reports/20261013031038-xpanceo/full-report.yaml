      - number: '6.4'
        title: Durability, Wearer Retention & Adoption Barriers
        blocks:
          - type: paragraph
            body: >-
              The ultimate determinants of customer adoption and long-term durability for smart contact lenses are
              wearer retention, ocular biocompatibility, and clinical regulatory approval. Academic literature
              evaluating ocular wearables indicates that placing powered electronic components directly on the eye
              introduces formidable physiological barriers, including disrupted tear film stability, hypoxia from
              constrained oxygen permeability, and elevated risks of infectious keratitis or corneal acidosis. Even
              among conventional soft contact lens wearers, significant annual drop-out rates occur due to dryness,
              discomfort, and handling fatigue. For an active electronic device incorporating microbatteries, inductive
              antennas, and microdisplays, ensuring acceptable daily wear-time and thermal safety is an extraordinary
              engineering challenge. Xpanceo has targeted late 2026 for pre-clinical component trials and initial human
              safety evaluations, followed by a public demonstration of an integrated prototype worn by its founders in
              early 2027. Crucially, the company plans to certify its lenses as regulated medical devices, meaning
              commercialization in major jurisdictions will require multi-year clinical trials and rigorous premarket
              approvals. Until peer-reviewed human clinical safety and wearer adherence data become available,
              prospective customer adoption remains entirely theoretical.
            claimRefs:
              - CU009
              - CU011
