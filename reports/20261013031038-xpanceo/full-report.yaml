      - number: '8.3'
        title: Bull, Base, and Bear Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              To evaluate entry discipline under high uncertainty, we construct a three-scenario return framework based
              on technological, clinical, and commercial milestone execution. In the bull case (15% probability),
              Xpanceo successfully demonstrates an integrated prototype in early 2027, passes clinical safety trials by
              2028, and secures an acquisition by Big Tech (such as Meta, Apple, or Google) seeking next-generation
              interface dominance, achieving an exit valuation exceeding $5.0 billion. In the base case (55%
              probability), Xpanceo proves standalone subsystems but encounters integration and clinical delays that
              defer consumer launch to 2030, necessitating an extension or down-round recapitalization at $1.0 billion
              to $1.5 billion that significantly dilutes earlier equity holders. In the bear case (30% probability),
              technical bottlenecks in ocular power dissipation or corneal oxygenation prove insurmountable, clinical
              trials fail to clear safety bars, or follow-on capital dries up, resulting in distressed intellectual
              property liquidation at $100 million to $200 million where common equity is wiped out by Series A
              liquidation preferences. The speculative nature of seed pitch projections—such as a $1,500 device MSRP
              generating $1,800 in annual ad revenue per user—further highlights the downside vulnerability of the base
              and bear trajectories.
            claimRefs:
