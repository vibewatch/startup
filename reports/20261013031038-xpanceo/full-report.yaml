      - number: '5.3'
        title: Subsystem Hardware Architecture, Power Delivery, and Optics
        blocks:
          - type: paragraph
            body: >-
              The core technical hurdle in ocular wearable computing is achieving sufficient processing, display
              illumination, and sensor telemetry within a submillimeter soft lens without generating hazardous ocular
              heat or exceeding biocompatibility constraints. Xpanceo resolves these constraints through an asymmetrical
              off-lens architecture that offloads compute and primary battery mass to an external pocket-sized wearable
              companion device. The companion communicates with the lens via a custom resonant RF link delivering up to
              three times higher radiation efficiency than conventional on-body antennas. On the lens substrate,
              transparent flexible conductors fabricated from patented quasi-two-dimensional gold films—comprising only
              a few atomic layers—route power and telemetry around the optical zone without obstructing vision. For
              sustained optical projection, Xpanceo partners with French manufacturer ITEN to integrate solid-state
              ceramic microbatteries with mesoporous electrodes, eliminating liquid electrolyte leakage and thermal
              swelling risks. Micro-optics are developed in collaboration with JBD, utilizing ultra-compact MicroLED
              microdisplays and custom near-eye collimating optics characterized using specialized optical test benches
              co-engineered with Konica Minolta Sensing Europe.
            claimRefs:
