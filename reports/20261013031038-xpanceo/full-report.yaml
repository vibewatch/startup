  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Xpanceo's core investment thesis centers on the premise that ambient computing will ultimately transcend
              smartphones and bulky mixed-reality headsets through a weightless, invisible smart contact lens. Backed by
              $290 million in total venture capital, the company has assembled significant intellectual property with 20
              patent filings and over 28 standalone prototypes demonstrating micro-displays, biosensing, wireless
              charging, and transparent circuitry. The company projects an addressable market surpassing $750 billion
              over the next decade as contact lenses potentially merge personal computing, health monitoring, and
              biometric identity. However, the anti-thesis is equally profound and anchored in severe hardware and
              biological constraints. Smart contact lens predecessor Mojo Vision raised $204 million before pivoting
              away from contact lens hardware due to prohibitive technical, clinical, and capital hurdles. Integrating
              eight distinct subsystems into a submillimetre hydrogel substrate without inducing corneal hypoxia,
              thermal injury, or ocular infection represents an extraordinary deep-tech challenge. Independent reviews
              highlight that Xpanceo's expansive claims remain far ahead of published bench validation, with
              commercialization requiring years of regulatory clearances.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV011
              - CV012
