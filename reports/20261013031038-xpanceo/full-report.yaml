  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Target Markets
        blocks:
          - type: paragraph
            body: >-
              Xpanceo's commercial strategy envisions an expansive computing platform designed to replace conventional
              smartphones and head-mounted XR displays with an invisible on-eye interface. The company divides its
              future customer base across four distinct wedges: healthcare monitoring, industrial and enterprise
              operations, high-performance frontier environments, and mainstream consumer spatial computing. Within
              healthcare, the primary target user is the ophthalmology patient population, with specific emphasis on
              continuous intraocular pressure monitoring for glaucoma management and non-invasive tear fluid analysis
              for oncological and cardiovascular drug dosing. In enterprise and industrial settings, Xpanceo targets
              deskless professionals, factory maintenance crews, and logistics operators who require hands-free
              contextual information feeds without the visual obstruction or neck strain associated with bulky
              head-mounted displays. For frontier applications such as aerospace, aviation, and elite motorsport racing,
              the company pairs contact lens optics with specialized helmet companion hardware to project heads-up
              mission telemetry in environments where external glasses cannot fit. Finally, in consumer markets, Xpanceo
              articulates a vision where 250 million daily contact lens wearers transition to smart lenses for real-time
              translation, augmented navigation, and personal computing. However, all four segments remain entirely
              hypothetical as commercial markets; Xpanceo has established no formal distribution channels, institutional
              payer agreements, or enterprise procurement relationships.
            claimRefs:
