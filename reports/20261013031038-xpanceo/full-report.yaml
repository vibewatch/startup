chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Location, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Founded in 2019, Xpanceo operates from Dubai Internet City in the United Arab Emirates, positioning itself
              at the frontier of post-screen spatial computing and ocular biosensing. The company aims to develop an
              invisible, weightless smart contact lens that merges augmented reality projection, continuous biometric
              sensing, and onboard artificial intelligence inference into an all-in-one wearable interface. Supported by
              substantial private capital inflows, Xpanceo expanded its Dubai research and development facilities to
              approximately 100 specialized physicists, materials scientists, and hardware engineers. Despite achieving
              unicorn status following its Series A financing, Xpanceo remains an early-stage, pre-commercial deep-tech
              enterprise with zero commercial revenues and no commercial customer deployments as of October 2026.
            claimRefs:
              - CO001
              - CO002
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
      - number: '1.2'
        title: Founders, Executive Leadership, and Capitalization Governance
        blocks:
          - type: paragraph
            body: >-
              Xpanceo was co-founded by managing partner Roman Axelrod, a serial technology entrepreneur overseeing
              commercialization and corporate structuring, and Dr. Valentyn S. Volkov, an accomplished physicist with
              more than 110 scientific publications who heads nanophotonics and advanced materials research. The venture
              exhibits pronounced key-person dependency on both individuals, whose complementary backgrounds bridge
              corporate execution with laboratory nanophotonics. From a governance standpoint, Xpanceo displays extreme
              investor concentration: Hong Kong-based Opportunity Venture (Asia), led by managing director Philip Ma,
              served as the sole publicly identified lead sponsor for both the $40 million seed round in 2023 and the
              $250 million Series A in July 2025. This single-sponsor structure insulates laboratory milestones from
              broader venture capital market cycles but leaves outside board checks, voting control distribution, and
              minority shareholder protections largely unverified.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
