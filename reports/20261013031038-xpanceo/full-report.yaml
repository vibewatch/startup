      - number: '1.3'
        title: Subsystem Prototyping and Hardware Engineering Traction
        blocks:
          - type: paragraph
            body: >-
              Rather than attempting immediate monolithic integration onto an ultra-thin ocular substrate, Xpanceo has
              pursued an iterative modular engineering strategy. Over four years of laboratory operations, the team
              engineered more than 28 discrete functional prototypes to validate discrete hardware layers in isolation.
              At Mobile World Congress (MWC) 2026 in Barcelona, Xpanceo publicly demonstrated five operational
              prototypes, highlighting ultra-low-power micro-OLED augmented reality displays, real-time tear-fluid
              glucose monitoring, and wireless power transfer. To address severe power constraints inherent in ocular
              devices, Xpanceo established an engineering collaboration with French microbattery manufacturer ITEN,
              validating a solid-state rechargeable storage proof-of-concept. The company targets early 2027 for its
              first integrated demonstration combining visual display, health telemetry, and energy harvesting in a
              single lens.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
