      - number: '7.2'
        title: Regulatory and Clinical Clearance Barriers
        blocks:
          - type: paragraph
            body: >
              Ophthalmic diagnostic and therapeutic contact lenses face some of the most stringent regulatory oversight
              frameworks globally, classified as Class II or Class III medical devices by the FDA, European MDR, and
              equivalent health authorities. Academic literature confirms that smart contact lenses encounter profound
              biocompatibility hurdles, as prolonged wear beyond 72 hours frequently induces ocular surface irritation,
              mechanical shear, and microbial colonization. Despite commercial demonstrations of IOP and glucose sensing
              lenses, Sensimed Triggerfish remains the only FDA-cleared ocular telemetry contact lens system for
              glaucoma monitoring, illustrating the multi-year clinical trial burden required to achieve market
              clearance.


              Xpanceo has targeted clinical trials by the end of 2026 for its diagnostic portfolio, specifically its
              AI-powered glaucoma management lens and tear fluid biomarker sensing platforms. However, no public
              investigational device exemption (IDE) or clinical trial registry entries (such as ClinicalTrials.gov)
              have been published, creating material uncertainty regarding first-in-human trial endpoints. Because
              Xpanceo's contact lens incorporates active electronic components, microdisplays, and RF wireless energy
              links, regulatory bodies will scrutinize long-term corneal endothelial health, thermal dissipation limits,
              and electrical leakage risks under exhaustive GLP animal toxicology and clinical protocols.


              A failure or delay during initial human trials represents a primary thesis-break trigger. Should clinical
              protocols reveal unexpected foreign-body sensations, tear film disruption, or inconsistent
              glucose-to-blood correlation, Xpanceo's dual-track consumer and medical narrative would be forced to
              retreat into slower, capital-intensive prescriptive medical pathways.
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
