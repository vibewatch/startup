      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Ocular Integration Chasm
            body: >
              While Xpanceo has demonstrated more than 28 standalone prototypes across individual functional domains
              (glaucoma sensing, optical zoom, and holographic AR projection), combining all components into a single
              submillimeter lens without thermal buildup or polymer delamination represents an unproven engineering
              leap. Historical attempts by Google Verily and Mojo Vision collapsed under the weight of ocular
              physiological limits and capital intensity.
