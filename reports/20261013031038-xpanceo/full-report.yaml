      - number: '3.2'
        title: Technical Capabilities and Architectural Differentiation
        blocks:
          - type: paragraph
            body: >-
              Evaluating Xpanceo against alternative computing architectures reveals acute divergence between
              demonstrated sub-component prototypes and an integrated, wearable consumer device. At MWC 2026 and GITEX
              Global 2025, Xpanceo demonstrated standalone prototypes covering on-eye microdisplays, tear-fluid
              electrochemical glucose sensing, intraocular pressure monitoring, and wireless radiofrequency recharging.
              To circumvent severe on-eye battery safety hazards, Xpanceo partnered with French solid-state manufacturer
              ITEN to develop ceramic microbattery cells intended to avoid thermal runaway and chemical leakage.
              However, independent biomedical reviews emphasize that smart contact lenses face fundamental physiological
              barriers that cannot be solved by electronics miniaturization alone. Operating directly on the cornea
              imposes strict oxygen transmissibility thresholds (Dk) to prevent corneal edema and epithelial acidosis,
              while tear film biomarker concentrations fluctuate widely under reflex tearing and environmental stress.
              Furthermore, optical waveguide losses exceeding 99% continue to constrain microdisplay brightness and RGB
              color generation in submillimeter form factors.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
