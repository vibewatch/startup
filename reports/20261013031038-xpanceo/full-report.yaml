  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Hierarchy and Residual Exposure Profile
        blocks:
          - type: paragraph
            body: >
              Developing an on-eye computing interface requires surmounting simultaneous physics, biometric, and
              manufacturing constraints that have historically derailed prior ocular wearable programs. Xpanceo's public
              posture emphasizes a transition from discrete prototypes demonstrated across industry conferences to a
              fully integrated prototype targeted for early 2027. However, the residual exposure across regulatory
              clearance, micro-scale component yields, battery safety, and commercial capital intensity remains
              critical.


              The venture's highest-severity operational vulnerability centers on the integration bottleneck: combining
              micro-OLED displays, transparent quasi-2D gold circuitry, solid-state ceramic microbatteries, and
              biochemical sensors within an ultra-thin contact lens polymer without delamination, localized thickening,
              or thermal injury to the cornea. While partnerships with specialized industrial suppliers Contamac and
              ITEN demonstrate structured manufacturing diligence, clinical trials originally slated for late 2026
              represent a binary operational threshold where unforeseen ocular surface inflammation, corneal hypoxia, or
              sensor drift could force fundamental redesigns.


              Financially, Xpanceo's $250 million Series A round at a $1.35 billion post-money valuation establishes a
              precarious capital structure. Without commercial revenue, sustained R&D across custom nanophotonics
              cleanrooms, 28 discrete prototype iterations, and multi-center clinical trials drives an estimated burn
              rate of $2.5 million to $3.5 million monthly. If macroeconomic conditions tighten or prototype integration
              slips past the 2027 window, down-round financing or severe dilution will threaten capitalization before
              commercial market entry.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
