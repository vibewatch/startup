      - number: '7.3'
        title: Operational, Supply Chain, and Component Dependencies
        blocks:
          - type: paragraph
            body: >
              Xpanceo's technical roadmap relies entirely on deep single-source supplier partnerships for core enabling
              hardware components that do not exist as off-the-shelf catalog parts. The power system represents a
              critical technical bottleneck: conventional lithium-ion batteries cannot be safely deployed directly on
              the eye due to thermal runaway, swelling, and toxic electrolyte leakage risks. To mitigate this, Xpanceo
              partnered with French solid-state battery manufacturer ITEN to develop customized ceramic microbatteries.
              However, industrial mass production of submillimeter solid-state cells capable of handling milliwatt-level
              bursts for augmented reality projection remains in early commercial stages.


              Similarly, optical encapsulation presents severe yield risks. Encapsulating microdisplays, holographic
              optical elements, and wireless receiving antennas within biocompatible lens polymers requires specialized
              material expertise. Xpanceo's partnership with Contamac seeks to solve microdisplay sealing without
              localized thickening, seams, or delamination, initially targeting rigid gas-permeable lens geometries
              before migrating to soft lenses. Any disruption in Contamac's material supply or JBD Inc.'s microdisplay
              fabrication would halt prototype iteration.


              Furthermore, head-mounted and companion-device architectures introduce user adoption friction. Xpanceo's
              prototypes rely on external companion hardware—such as specialized RF antennas or helmet mounts—to provide
              inductive energy transfer and off-board compute. If companion hardware bulk or transmission efficiency
              fails to satisfy consumer ergonomics, consumer willingness-to-wear will remain heavily suppressed relative
              to standalone smart glasses.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR011
              - CR012
