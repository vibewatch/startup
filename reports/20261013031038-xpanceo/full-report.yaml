      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Xpanceo is currently years away from public listing readiness, leaving strategic M&A as the primary viable
              liquidity pathway should its core technologies prove commercially viable. However, institutional acquirers
              in consumer electronics and medical devices demand rigorous clinical validation and defensible
              manufacturing yields before committing billions in capital. Key thesis-break triggers include: first,
              failure to initiate registered human clinical trials by the end of 2026; second, failure of the founders
              to wear an all-in-one integrated working prototype during the scheduled early 2027 public demonstration;
              and third, any departure of core scientific leadership or loss of key academic partnerships. Before
              committing capital or considering secondary market liquidity, investors must execute specific diligence
              requests: obtain audited capitalization tables and Series A liquidation waterfall models; inspect
              solid-state battery micro-encapsulation safety test data developed with ITEN; examine ethics board
              approvals for on-eye human protocols; and review third-party optometric evaluations of wearability and
              corneal comfort.
