        title: Named Deployments & Partnership Proof
        blocks:
          - type: paragraph
            body: >-
              Because Xpanceo operates as a pre-commercial venture, its customer proof surface consists of technical
              co-development partnerships and academic research collaborations rather than production client
              deployments. The company's most concrete technical collaboration is with French solid-state microbattery
              innovator ITEN, with whom Xpanceo developed a proof of concept integrating ceramic microbatteries and
              wireless energy harvesters into a soft contact lens substrate. This partnership addresses the critical
              bottleneck of safe milliwatt-level power delivery on the eye, though it represents component-level
              feasibility rather than a volume commercial procurement relationship. Additionally, Xpanceo expanded its
              R&D facilities during GITEX Global 2025 in Dubai, hosting an academic testing and lecture program in
