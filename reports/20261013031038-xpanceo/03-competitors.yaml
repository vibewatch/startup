callouts:
  - calloutType: risk
    title: "Mojo Vision Precedent Highlights In-Eye Optical and Capital Fragility"
    body: "Mojo Vision's failure to commercialize an AR contact lens after raising over $200 million and demonstrating in-eye green microLED prototypes illustrates the extreme capital intensity and physical hurdles of ocular computing. Xpanceo faces identical physical bottlenecks in red light generation, thermal dissipation, and optical transmission, making its unproven integrated demonstration scheduled for 2027 a binary risk milestone."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP007"
  - calloutType: insight
    title: "Structural Asymmetry Against Big Tech Distribution Ecosystems"
    body: "While Xpanceo's submillimeter form factor is technically differentiated from facial smart glasses, incumbents like Meta and Apple possess entrenched consumer distribution, retail networks, and developer ecosystems. In the absence of proprietary prescription retail channels or consumer hardware partnerships, Xpanceo risks producing a remarkable scientific demonstration without a viable path to mass adoption."
    claimRefs:
      - "CP002"
      - "CP011"
      - "CP015"

