callouts:
  - calloutType: "risk"
    title: "The Ocular Chasm Between Smart Glasses and Smart Contact Lenses"
    body: "While the rapid commercial traction of display-less smart glasses (167% YoY shipment surge in Q1 2026 per IDC) demonstrates robust demand for lightweight AI wearables, smart contact lenses face an entirely different risk profile. Contact lenses place active electronics and microbatteries directly against the cornea, transforming a consumer gadget into an invasive Class II/III medical device requiring rigorous regulatory clearances, clinical trials, and biocompatibility validation."
    claimRefs:
      - "CM004"
      - "CM011"
      - "CM014"
  - calloutType: "insight"
    title: "Frontier Industrial and Medical Wedges vs. Consumer Horizon"
    body: "Xpanceo's development of standalone prototype applications—such as AR vision for space/flight helmets and non-invasive glaucoma monitoring—represents a pragmatic commercial wedge. High-margin aerospace and medical diagnostic buyers have established budgets and tolerance for specialized companion hardware, offering an addressable entry path before consumer mass adoption becomes feasible."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM009"
      - "CM013"
