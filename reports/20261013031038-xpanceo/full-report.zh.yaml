  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的核心投资论点建立在这样一个前提上：环境计算最终会借助轻若无物、隐形的智能隐形眼镜，超越智能手机和笨重的混合现实头显。公司累计获得 2.9 亿美元风险投资，已凭借 20 项专利申请和超过 28
              个独立原型，积累了覆盖微显示、生物传感、无线充电和透明电路的重要知识产权。公司预计，未来十年可触达市场将超过 7,500 亿美元，因为隐形眼镜可能把个人计算、健康监测和生物识别身份合为一体。

              但反向论点同样强烈，且根植于严苛的硬件和生物学约束。智能隐形眼镜先行者 Mojo Vision 在转向放弃隐形眼镜硬件前筹得 2.04
              亿美元，原因正是技术、临床和资本门槛过高。要把八个不同子系统集成进亚毫米级水凝胶基底，同时不造成角膜缺氧、热损伤或眼部感染，是非同寻常的深科技挑战。独立评审指出，Xpanceo
              的宏大主张远远领先于已发表的台架验证；商业化还需要多年的监管许可。
