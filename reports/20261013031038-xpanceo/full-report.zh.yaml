      - number: '8.2'
        title: 融资背景、估值判断与建议
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 在 2025 年 7 月完成 2.5 亿美元 A 轮融资后成为独角兽，投后估值 13.5 亿美元，创下 UAE 和 MENA 风投史上最大 A 轮交易。该轮由 Opportunity
              Venture (Asia) 领投，早期 4,000 万美元种子轮也全部由其提供。这笔资金让公司拥有充足跑道，并得以将工程师和科学家人数翻倍至 100 人，但我们的估值判断仍偏高。13.5
              亿美元的价格，已经计入了一家商业化后期公司的成功，而 Xpanceo
              目前商业收入为零，也尚未证明能在人眼上运行一体化设备。资本高度集中于一家亚洲家族办公室领投方，加上缺少顶级全球硬件风投组成的联合投资团，进一步暴露出治理和估值纪律方面的担忧。因此，我们给出中等信心的“继续研究”建议，并将风险评级定为关键；在临床安全数据和可运行的一体化硬件得到独立验证前，建议潜在投资者避免支付独角兽级别的进入倍数。
