      - number: '5.3'
        title: 子系统硬件架构、供电与光学
        blocks:
          - type: paragraph
            body: >-
              眼部可穿戴计算的核心技术难题，是在亚毫米软镜片中实现足够的处理、显示照明和传感器遥测，同时不产生危险眼部热量，也不超出生物相容性约束。Xpanceo
              采用非对称的镜片外架构，把计算和主要电池重量转移到外部口袋大小的可穿戴配套设备上，以解决这些约束。配套设备通过定制谐振 RF
              链路与镜片通信，辐射效率最高可达传统人体天线的数倍。镜片基底上的透明柔性导体由专利准二维金膜制成，仅含几层原子，可绕开光学区域传输电力和遥测信号而不遮挡视野。为实现持续光学投影，Xpanceo 与法国制造商
              ITEN 合作，把带介孔电极的固态陶瓷微电池集成进系统，从而消除液态电解质泄漏和热膨胀风险。微光学由 JBD 协作开发，使用超紧凑 MicroLED 微显示器和定制近眼准直光学；后者通过与 Konica
              Minolta Sensing Europe 联合设计的专业光学测试台进行表征。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
