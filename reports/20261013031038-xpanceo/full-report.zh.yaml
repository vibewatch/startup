      - number: '8.4'
        title: 退出准备、尽调要求与投资论点击穿触发因素
        blocks:
          - type: paragraph
            body: >-
              Xpanceo
              距离具备公开上市条件仍有数年，目前若核心技术证明具备商业可行性，战略并购是主要可行的流动性路径。但消费电子和医疗器械领域的机构收购方，在投入数十亿美元前要求严格的临床验证和可守住的制造良率。击穿投资论点的关键触发因素包括：第一，未能在
              2026 年底前启动注册人体临床试验；第二，创始人未能在计划于 2027
              年初举行的公开演示中佩戴全功能一体化工作原型；第三，核心科学领导层离职或关键学术合作关系流失。投资者在投入资本或考虑二级市场流动性前，必须完成具体尽调：取得经审计的资本表和 A 轮清算瀑布模型；检查与 ITEN
              共同开发的固态电池微封装安全测试数据；审阅眼部人体方案的伦理委员会批准；并复核第三方验光机构对佩戴性和角膜舒适度的评估。
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资立场：高估值下继续研究
            body: 我们建议潜在投资者继续以“继续研究”的立场看待 Xpanceo。13.5 亿美元的 A 轮投后估值，已经为一家距离人体临床验证和商业收入仍有数年的深科技企业计入了无缝商业化扩张。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV014
          - type: callout
            title: 关键投资论点击穿触发因素与悬置风险
            body: 如果 Xpanceo 未能在 2026 年底前实现首次人体临床里程碑，或无法在 2027 年初交付一体化工作原型，核心平台时间表就会失效，并迫使公司进行下行轮重组。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
