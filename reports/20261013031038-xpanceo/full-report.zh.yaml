      - number: '3.3'
        title: 商业封装、定价模型与分销能力
        blocks:
          - type: paragraph
            body: >-
              空间计算和眼部感知的商业化，凸显了补贴型消费硬件与专业临床耗材之间巨大的产品封装差异。在位智能眼镜平台采用透明的标价和消费者可触达的分销：Meta 的 Ray-Ban 智能眼镜售价在 $299 至 $379
              之间，依靠数字平台生态补贴硬件；Apple 则以 $3,499 为高端专业消费者空间计算设备定价基准。相比之下，Sensimed Triggerfish
              等医疗眼部设备已经证明，专业连续感知镜片可以作为临床诊断耗材销售，每次操作定价 $500 至 $1,500，依靠报销路径而非直接面向消费者零售。Xpanceo 既未公布零售硬件价格，也未宣布商业 SaaS
              模式，体现出其商业化前状态。公司计划在 2026 年末开展首次人体临床试验、2027 年展示集成消费原型，但目前没有验光师分销协议或监管审批，商业化进入市场路径仍未验证。
