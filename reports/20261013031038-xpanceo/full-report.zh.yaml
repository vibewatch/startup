        - id: step-2
          label: 集成缺口
          role: bottleneck
          detail: 尚未在眼上演示集成式一体镜片；目标于 2027 年初演示
        - id: step-3
          label: 临床与监管障碍
          role: risk
          detail: 没有公开临床试验申报；目标于 2026 年底前开展人体眼部安全试验
        - id: step-4
          label: 估值定价
          role: valuation
          detail: $1.35B 的 A 轮估值已将商业化前阶段的成熟执行计入价格
        - id: step-5
          label: 股权结构表与优先股堆叠压力
