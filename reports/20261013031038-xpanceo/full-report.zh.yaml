      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV014
  - id: TV002
    title: 正方 / 反方表
    columns:
      - 支柱
      - 正方论点
      - 反方论据
      - 改变判断的催化剂
    rows:
      - - 技术与形态
        - 智能隐形眼镜摆脱笨重的 AR 头显，以 30 度视场提供隐形、无负重的计算体验
        - 将显示、电源和传感器集成到单片亚毫米镜片中仍未在人类身上验证；Mojo Vision 融资 $204M 后已转向
        - 创始团队于 2027 年初公开成功佩戴集成原型
      - - 资本与资金续航
        - 获得 $250M A 轮融资，为深科技研发提供续航，并使实验室设施和团队规模翻倍至 100 人
        - 单一领投方 Opportunity Venture (Asia) 同时领投种子轮和 A 轮；缺少全球一线深科技 VC 的联合投资
        - 由独立的一线机构级硬件 / 生物科技投资者参与的联合融资轮
      - - 商业模式
        - 多层收入模型预计设备 MSRP 为 $1,500，另加每用户每年 $1,800 的 AR 广告收入和 $100 应用费
        - 商业进展 为零，消费者是否愿意将主动电子元件置于角膜上尚未验证，且 2031 年非佩戴者跨越假设具有投机性
        - 签署付费企业或医疗试点合同，并获得不可退款承诺
      - - 监管与临床
        - 医疗与消费双重定位，使青光眼 IOP 和糖尿病泪液葡萄糖诊断能够进入医疗市场
        - 眼部接触设备面临严格的 FDA/EMA II/III 类医疗器械审批门槛，迄今没有公开临床试验申报
        - 公开注册临床方案，并取得机构审查委员会试验许可
    notes: 将核心投资论点支柱与技术、临床和商业层面的结构性反方论据并置。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 2027 年完成显示和电源集成；2027 年通过临床试验；2028 年推出商业设备；2030 年达到 1M 用户
        - 大型科技公司（Meta、Apple、Google）为取得后智能手机时代的界面主导权，以 $5.0B+ 战略收购；总回报 3.7 倍以上
        - 在镜片成熟前，大型科技公司 推出竞品智能眼镜并抢走用户注意力
        - 15%
      - - 基准情景
        - 2027 年展示集成原型；人体临床试验延续至 2028-2029 年；商业发布推迟到 2030 年；独立的 B2B 利基市场采用
        - 估值 $1.0b-$1.5b 基本持平或温和重估；需通过稀释性 B 轮融资为延长的试验提供资金；回报 0.7-1.1 倍
        - 商业化前研发消耗 $250M，需要结构化优先股融资
        - 55%
      - - 悲观情景
        - 眼部散热或角膜供氧的技术瓶颈无法克服；临床安全问题或监管拒批
        - $100m-$200m 困境 IP 清算或收购招聘；普通股被 A 轮清算优先权抹去
        - 设备在眼上失效；严重眼部不良事件；无法筹集后续资本
        - 30%
    notes: 基于 2026-2027 年原型和临床里程碑执行情况的概率加权回报情景。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
      - CV014
