      - number: '8.3'
        title: 乐观、基准与悲观情景建模
        blocks:
          - type: paragraph
            body: >-
              为在高度不确定性下评估进入纪律，我们基于技术、临床和商业里程碑的执行情况构建三情景回报框架。在乐观情景（概率 15%）下，Xpanceo 将在 2027 年初成功展示一体化原型，2028
              年前通过临床安全试验，并被寻求下一代界面主导权的大科技公司（如 Meta、Apple 或 Google）收购，退出估值超过 $5.0b。在基准情景（概率 55%）下，Xpanceo
              证明各子系统可以独立工作，但遭遇集成和临床延期，消费者产品推迟到 2030 年上市，并需要在 $1.0b-$1.5b 估值进行延期轮或下行轮重组，严重稀释早期股东。在悲观情景（概率
              30%）下，眼部供电散热或角膜供氧的技术瓶颈无法解决，临床试验无法通过安全门槛，或后续资本枯竭，最终以 $100m-$200m 进行困境式知识产权清算，普通股被 A
              轮清算优先权抹去。种子轮路演预测的投机性——例如一台 $1500 设备每年为每位用户带来 $1800 广告收入——也进一步凸显了基准和悲观路径的下行脆弱性。
            claimRefs:
