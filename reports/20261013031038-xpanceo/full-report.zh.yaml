chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、所在地与经营规模
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 成立于 2019
              年，办公地点在阿拉伯联合酋长国的迪拜互联网城，定位于后屏幕空间计算和眼部生物感知的前沿。公司希望开发一款隐形、无感的智能隐形眼镜，把增强现实投影、持续生物识别感知和端侧人工智能推理整合进一体化可穿戴界面。依靠大规模私人资本注入，Xpanceo
              将迪拜研发设施扩充至约 100 名专业物理学家、材料科学家和硬件工程师。尽管在 A 轮融资后达到独角兽地位，截至 2026 年 10 月，Xpanceo
              仍是一家早期、商业化前的深科技企业，没有商业收入，也没有商业客户部署。
            claimRefs:
              - CO001
              - CO002
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
      - number: '1.2'
        title: 创始人、高管领导层与资本治理
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 由管理合伙人 Roman Axelrod 和 Dr. Valentyn S. Volkov 共同创立。前者是连续创业的科技企业家，负责商业化和公司架构；后者是发表过 110
              多篇科学论文的物理学家，主管纳米光子学和先进材料研究。两人互补的经历把公司执行与实验室纳米光子学连接起来，也使企业明显依赖这两位关键人物。从治理角度看，Xpanceo 的投资人高度集中：由管理董事 Philip
              Ma 领导、总部位于香港的 Opportunity Venture (Asia)，是 2023 年 $40 million 种子轮和 2025 年 7 月 $250 million A
              轮唯一公开确认的领投方。这种单一赞助方结构能让实验室里程碑不受更广泛创投市场周期影响，但外部董事制衡、投票权分配和少数股东保护仍大多未得到验证。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO010
      - number: '1.3'
        title: 子系统原型与硬件工程进展
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 没有试图立刻把所有部件整合到超薄眼部基底上，而是采用迭代式模块化工程策略。经过四年实验室运营，团队打造了 28 个以上相互独立的功能原型，分别验证各个硬件层。2026 年在巴塞罗那举行的
              Mobile World Congress（MWC）上，Xpanceo 公开展示了 5 个可运行原型，重点包括超低功耗 Micro-OLED
              增强现实显示、实时泪液葡萄糖监测和无线供电。为应对眼部设备固有的严苛供电约束，Xpanceo 与法国微电池制造商 ITEN 建立工程合作，验证了固态可充电储能概念。公司目标是在 2027
              年初完成首次整合展示，将视觉显示、健康遥测和能量采集集成到同一片镜片中。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
