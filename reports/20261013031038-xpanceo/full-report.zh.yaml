      - number: '6.2'
        title: 采用轨迹与收入现实
        blocks:
          - type: paragraph
            body: >-
              从商业和收入角度看，Xpanceo
              目前没有任何商业进展。公司没有年度经常性收入，没有销售商业硬件，也没有报告企业和消费者类别中的活跃付费客户账户。相反，其发展轨迹由深科技研究里程碑和机构资本积累定义。Xpanceo 已完成 $40 million
              种子投资，随后在 2025 年中以 $1.35 billion 估值完成 $250 million A 轮融资，因此拥有充足的财务跑道支持长期实验室开发。四年研究期间，团队跨多轮硬件迭代组装了 28
              个以上独立原型，分别测试全息光学元件、Micro-OLED
              显示器、微电池和生物传感器等子系统。这些迭代虽显示实验室进展迅速，但市场上没有完整可穿戴设备，因而无法衡量净收入留存、总续费率和群组扩张曲线等客户增长指标。公司宣传的 2033 年 2.5
              亿名日常隐形眼镜佩戴者，只是自上而下的可服务市场规模假设，不是已证明的买方需求或转化速度。
