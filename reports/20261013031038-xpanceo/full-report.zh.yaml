      - number: '3.4'
        title: 壁垒持久性、商品化与不利尽调发现
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 声称，其专利组合、准二维金导体和纳米光学元件构成持久的物理壁垒，不会被软件仿制或 Big Tech
              快速复制。但尽调分析发现，壁垒持久性和监管准备度存在关键漏洞。首先，知识产权壁垒保护的是部件制造技术，却无法防止快速进步、无需直接接触角膜的智能眼镜带来技术替代。其次，Xpanceo
              目前没有任何公开的人体临床试验结果、FDA 研究性器械豁免或 CE 标志认证，其生物感知和眼上电子安全性完全没有得到独立医疗机构的佐证。Mojo Vision
              的警示性先例表明，眼部可穿戴深科技硬件初创公司可能耗尽数亿美元风投资金，却仍无法交付可制造的商业设备；这给 Xpanceo $1.35 billion 的投后估值带来极高执行风险。
            claimRefs:
