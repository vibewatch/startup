      - number: '7.2'
        title: 监管与临床审批障碍
        blocks:
          - type: paragraph
            body: >
              眼科诊断和治疗用隐形眼镜受到全球最严格的监管框架约束，被 FDA、欧洲 MDR 及同等卫生监管机构归类为 II 类或 III 类医疗器械。学术文献证实，智能隐形眼镜面临严峻的生物相容性障碍：佩戴超过 72
              小时往往会引发眼表刺激、机械剪切和微生物定植。尽管市场上已经展示过眼压（IOP）和葡萄糖传感镜片，Sensimed Triggerfish 仍是唯一获 FDA
              许可、用于青光眼监测的眼部遥测隐形眼镜系统，说明要取得上市许可需要承担多年临床试验的负担。

              Xpanceo 计划在 2026 年底前为其诊断产品组合开展临床试验，重点是 AI 驱动的青光眼管理镜片和泪液生物标志物传感平台。然而，目前没有公开的研究性器械豁免（IDE）或临床试验注册信息（如
              ClinicalTrials.gov），因此首次人体试验的终点仍存在重大不确定性。由于 Xpanceo 的隐形眼镜集成了有源电子元件、微显示器和 RF 无线能量链路，监管机构将在全面的 GLP
              动物毒理学和临床方案中，严格审查长期角膜内皮健康、散热上限和漏电风险。

              初次人体试验失败或延期，是击穿投资论点的首要触发因素。如果临床方案发现意外的异物感、泪膜受扰或葡萄糖与血糖相关性不稳定，Xpanceo 的消费和医疗双轨叙事就会被迫退回到更慢、更耗资本的处方医疗路径。
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
