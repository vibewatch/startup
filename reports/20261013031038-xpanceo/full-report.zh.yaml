      - 失效模式 / 运营挑战
      - 可能性
      - 严重程度
      - 缓解措施成熟度
      - 剩余暴露
      - 尚未解决的尽调缺口
    rows:
      - - 多组件亚毫米级分层
        - 高
        - 关键
        - 早期概念验证（PoC）
        - 机械眨眼疲劳和聚合物吸水导致的高包装失效率
        - 软水凝胶镜片气密封装的加速机械磨损测试结果
      - - 散热与眼部过热
        - 中
        - 高
        - 原型演示
        - AR 投影期间角膜组织对局部温度升高超过 1°C 敏感
        - 泪液浸没条件下运行中的主动式微显示器热成像剖析
      - - 固态电池微型化良率爬坡
        - 中
        - 高
        - 合作伙伴协作
        - ITEN 定制微型陶瓷电池量产可能面临晶圆厂良率低的问题
        - ITEN 洁净室设施的量产协议和缺陷率承诺
      - - 生物标志物传感可靠性与泪液相关性
        - 高
        - 中
        - 实验室验证
        - 泪液葡萄糖与血糖之间存在滞后，环境温度漂移还会导致 IOP 误差
        - 可变环境湿度和温度波动下的双传感器校准曲线
    notes: 运营风险按严重程度排序。缓解措施成熟度衡量原型状态与量产准备度。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR008
      - CR009
  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 关键依赖
      - 交易对手
      - 架构中的角色
      - 集中度
      - 失效情景
      - 严重程度
      - 缓解措施
      - 剩余暴露
    rows:
      - - 眼科镜片聚合物材料
        - Contamac
        - 获 FDA 批准的硬、软隐形眼镜聚合物及封装专业能力
        - 唯一来源
        - 无法在 JBD 微显示器及电子元件周围实现无缝聚合物密封
        - 关键
        - 2026 年 10 月宣布开展联合研发，聚焦硬镜片载体几何结构
        - 聚合物化学工艺转移延误将暂停实体可穿戴测试
      - - 固态陶瓷微电池
        - ITEN
        - 用于镜片上储能的微型陶瓷固态电池
        - 唯一来源
        - 供应短缺或无法提供所需的毫瓦级瞬时功率密度
        - 关键
        - 已用 ITEN 的专利介孔陶瓷电极建立概念验证（PoC）
        - 替代电池化学体系存在不可接受的可燃性或体积风险
      - - 超紧凑微显示器
        - JBD Inc.
        - 用于视网膜投影的定制微 OLED / MicroLED 显示器制造
        - 唯一来源
        - MicroLED 良率受限，或显示器在低功耗下亮度衰减
        - 高
        - 定制低功耗微显示器集成，目标功耗为 1-3 uW
        - 显示组件重新设计将迫使光学系统和配套硬件重新开模
      - - 资本集中度与资金续航
        - Opportunity Venture (Asia)
        - $40M 种子轮和 $250M A 轮融资的领投方
        - 高
        - 领投方不愿为多年商业化前资本消耗提供兜底
        - 高
        - 充足的 $250M 现金储备可支撑至目标 2027 年里程碑
        - 独角兽估值（$1.35B）意味着里程碑延期时存在极高的下轮融资风险
    notes: 合作伙伴依赖登记表按交易对手集中度和组件关键性排序。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 评估
      - 证据基线
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 尚无收入的深科技公司，拥有 28 个独立组件原型，但还没有集成式眼上设备
        - 待临床数据和集成原型演示完成后再配置资本
      - - 置信度
        - 中
        - 有记录的融资额为 $290M，已申请 20 项专利，并在 MWC 2026 公开演示组件
        - 技术文档足够，但临床数据和股权结构表数据未披露
      - - 风险评级
        - 关键
        - 硬件微型化、眼部生物相容性、缺乏监管申报，以及单一领投方
        - 若人体安全试验出现眼部刺激或电池故障，下行风险极高
      - - 估值立场
        - 估值偏高
        - A 轮投后估值 $1.35B，而商业收入为零、设备目标 MSRP 为 $1,500
        - 需要多年技术、临床和商业转化均无失误，才能支撑入场估值
    notes: 综合 A 轮条款、已披露的原型状态及截至 2026 年 10 月的风险画像，概括估值立场。
