      - number: '6.4'
        title: 耐用性、佩戴者留存与采用障碍
        blocks:
          - type: paragraph
            body: >-
              智能隐形眼镜能否被客户采用并长期使用，最终取决于佩戴者留存、眼部生物相容性和临床监管审批。评估眼部可穿戴设备的学术文献表明，把带电电子部件直接放在眼睛上会引入严峻生理障碍，包括泪膜稳定性受扰、氧渗透受限导致的缺氧，以及感染性角膜炎或角膜酸中毒风险升高。即使是传统软性隐形眼镜佩戴者，也常因干涩、不适和操作疲劳而出现显著年度流失。对一款包含微电池、感应天线和微显示器的有源电子设备而言，要保证可接受的日佩戴时长和热安全，工程难度极高。Xpanceo
              计划在 2026 年末开展临床前部件试验和初步人体安全评估，随后在 2027
              年初公开展示由创始人佩戴的集成原型。关键在于，公司计划将镜片认证为受监管医疗器械；要在主要司法辖区实现商业化，必须经过多年临床试验和严格上市前审批。在同行评审的人体临床安全性和佩戴依从性数据出现之前，潜在客户采用仍完全停留在理论推演阶段。
            claimRefs:
              - CU009
              - CU011
              - CU013
