              把商业化路径拆成专业临床和工业应用切入口。临床诊断上，公司开发了一款用于青光眼管理的智能隐形眼镜，表面带有微型光学图案，会随眼压变化而改变。患者用智能手机相机拍摄镜片，专有神经网络再根据超过 10,000
