      - number: '7.3'
        title: 运营、供应链与零部件依赖
        blocks:
          - type: paragraph
            body: >
              Xpanceo
              的技术路线完全依赖深度绑定的单一来源供应商伙伴，因为其核心赋能硬件并不存在现成目录件。电源系统是关键技术瓶颈：传统锂离子电池存在热失控、膨胀和有毒电解液泄漏风险，不能直接安全地放在眼睛上。为此，Xpanceo
              与法国固态电池制造商 ITEN 合作开发定制陶瓷微型电池。但能够承受增强现实投影毫瓦级脉冲、且实现亚毫米尺寸的固态电芯，工业化量产仍处于商业化早期。

              同样，光学封装也带来严重的良率风险。要把微显示器、全息光学元件和无线接收天线封装在生物相容性镜片聚合物中，需要专门的材料能力。Xpanceo 与 Contamac
              的合作旨在解决微显示器密封问题，避免局部增厚、接缝或分层；项目先针对硬性透气镜片几何结构，再迁移到软镜片。Contamac 的材料供应或 JBD Inc. 的微显示器制造一旦中断，原型迭代就会停摆。

              此外，头戴式和伴随设备架构也会增加用户采用阻力。Xpanceo 的原型依赖外部伴随硬件——例如专用 RF
              天线或头盔支架——来提供感应式能量传输和机外计算。如果伴随硬件的体积或传输效率达不到消费级人体工学要求，相比独立智能眼镜，消费者佩戴的意愿仍会大幅受压。
