            body: >-
              Xpanceo 的商业战略设想一套广泛的计算平台，用隐形眼上界面替代传统智能手机和头戴式 XR
              显示器。公司把未来客户分为四个切入口：医疗监测、工业和企业运营、高性能前沿环境，以及大众消费空间计算。在医疗领域，主要目标用户是眼科患者，重点是持续眼压监测青光眼，以及非侵入式泪液分析肿瘤和心血管药物剂量。在企业和工业场景中，Xpanceo
              面向无固定办公桌的专业人员、工厂维护团队和物流运营人员，为他们提供免手持上下文信息流，避免笨重头戴显示器造成视线遮挡或颈部负担。在航空航天、航空和顶级赛车等前沿应用中，公司把隐形眼镜光学器件与专业头盔配套硬件结合，在外置眼镜无法安装的环境中投射任务抬头遥测。最后，在消费市场，Xpanceo
              描绘了 2.5 亿名日常隐形眼镜佩戴者转用智能镜片的愿景，用于实时翻译、增强导航和个人计算。但这四个细分市场目前都只是商业假设；Xpanceo 尚未建立正式分销渠道、机构付款方协议或企业采购关系。
