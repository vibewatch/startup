              - CE007
              - CE012
      - number: '5.4'
        title: 制造规模、生物相容性与监管认证展望
        blocks:
          - type: paragraph
            body: >-
              从实验室台式原型走向可穿戴眼科产品，会带来严重的生物、材料和监管障碍。学术临床文献表明，长期佩戴隐形眼镜需要高氧渗透率（Dk）和良好表面润湿性；氧气无法充分扩散穿过角膜，会造成角膜酸中毒、上皮角膜炎和内皮水肿。在眼表嵌入不透明硅芯片、金属天线和固态电池，本身就会阻碍自然气体交换和泪膜动态。Xpanceo
              虽在 2025 年末扩建迪拜研发设施并设置专门的生物感知和光子学洁净室，但商业制造仍需要医疗级洁净室生产和 ISO 13485 质量体系认证。此外，监管先例显示时间表非常严苛：截至 2026 年中，FDA
              基于传感器的数字健康技术（sDHT）数据库中没有任何获批或获准的智能隐形眼镜。Xpanceo 计划在 2026 年底启动临床试验，这只是多年 II 类或 III 类医疗器械审批路径的最早一步。
            claimRefs:
              - CE011
              - CE013
              - CE014
