  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险层级与剩余风险敞口
        blocks:
          - type: paragraph
            body: >
              开发眼上计算界面，需要同时跨过物理学、生物识别和制造约束；这些约束过去曾令其他眼部可穿戴项目受挫。Xpanceo 对外强调，公司将从行业会议上展示的独立原型，推进到目标在 2027
              年初完成的完整集成原型。但监管审批、微型部件良率、电池安全和商业资本强度方面的剩余风险仍处于关键级别。

              公司最严重的运营脆弱点在于集成瓶颈：要把 Micro-OLED 显示器、透明准二维金电路、固态陶瓷微电池和生化传感器装进超薄隐形眼镜聚合物，同时避免分层、局部增厚或角膜热损伤。Contamac、ITEN
              等专业工业供应商的合作说明制造尽调已有规划，但原定于 2026 年末开展的临床试验是一道二元运营门槛；一旦出现意外的眼表炎症、角膜缺氧或传感器漂移，就可能迫使公司进行根本性重新设计。

              从财务上看，Xpanceo 以 $250 million A 轮融资和 $1.35 billion 投后估值建立了脆弱的资本结构。在没有商业收入的情况下，持续投入定制纳米光子学洁净室、28
              个独立原型迭代和多中心临床试验，预计每月消耗 $2.5 million 至 $3.5 million。如果宏观经济环境收紧，或原型集成拖过 2027
              年窗口，公司可能在进入商业市场前就面临降价轮融资或严重稀释，资本结构也会受到威胁。
