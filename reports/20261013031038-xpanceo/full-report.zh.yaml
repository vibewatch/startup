      - number: '1.4'
        title: 商业化战略、监管障碍与市场时机
        blocks:
          - type: paragraph
            body: >-
              尽管营销叙事把智能隐形眼镜定位成智能手机和增强现实头显的终极继任者，Xpanceo 仍面临严重的商业、人体生理和监管障碍。未经验证的硬件范式若直接推向大众消费者，执行风险极高；Humane、Rabbit
              等第一代环境式 AI 可穿戴设备近期的市场失败和停产已经说明这一点。意识到这些风险后，Xpanceo 管理层采取分阶段商业路线图：普通消费者要到 2030 年代初才可能买到产品，中间阶段则从 2028
              年左右开始，聚焦青光眼眼压监测等狭窄的商业和医疗切入口。此外，直接接触眼睛的电子硬件必须经过严格临床安全验证和正式医疗器械审批，这些里程碑风险仍是待完成的尽调事项。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 深科技资本实力与硬件去风险化
            body: >-
              Xpanceo 为一家 MENA 深科技硬件企业积累了前所未有的资本储备，共筹得 $290 million 股权资本。但所有主要资金都来自单一金融赞助方 Opportunity Venture
              (Asia)。这能让近期研发免受资本市场波动影响，但 $1.35 billion 的估值已经把成熟商业部署的预期定价在人体临床验证之前。
            calloutType: insight
            claimRefs:
              - CO002
              - CO003
              - CO004
          - type: callout
            title: 消费硬件尚早与时间表的现实性
            body: >-
              管理层明确把普通消费者上市时间推迟到 2030 年代初，并优先从 2028 年开始布局狭窄的 B2B 医疗切入口，说明其已认识到 Humane、Rabbit 等当代 AI
              可穿戴设备的警示性失败。要解决眼部生物相容性、持续供电和监管审批问题，公司还需多年持续资本开支，商业收入不会很快出现。
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与相邻支出
        blocks:
          - type: paragraph
            body: >-
              要估算 Xpanceo 的可服务市场，必须拆开三类不同的支出池：空间计算和智能眼镜硬件、专业医疗/眼科诊断设备，以及日常消费视力矫正。传统空间计算和扩展现实（XR）硬件目前包括头戴式显示器和智能眼镜。IDC
              市场数据显示，2026 年第一季度全球智能眼镜出货量同比激增 167%，单季达到 2.25m 台，主要由 Ray-Ban Meta 这类无显示 AI 音频/摄像眼镜推动，而非完整眼部显示设备。光学透视 AR
              眼镜属于相邻的高端市场，预计出货量将从 2026 年的 3.0m 台增至 2030 年的 12.2m 台。Xpanceo
              试图把微型显示器、生物传感器和无线供电直接集成到巩膜隐形眼镜上，从而越过笨重头显和智能镜框。然而，轻量 AI 智能眼镜、Abbott FreeStyle Libre 和 Dexcom
              等连续血糖监测仪（CGM），以及普通处方隐形眼镜等现有替代品，已经分别满足其价值主张中的部分需求，而且没有眼部安全风险。当前纳入 Xpanceo 可服务支出的，仅限高强度企业 XR
              头显、专业医疗监测设备和早期采用者的可穿戴计算；在证明非侵入式临床安全性之前，标准大众智能手机和处方眼镜预算完全不应计入。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
      - number: '2.2'
        title: TAM、SAM 与受约束的可服务市场规模
        blocks:
          - type: paragraph
            body: >-
              评估 Xpanceo 的长期商业机会，需要从多个独立视角切入，而不是接受宽泛的自上而下技术预测。最宽的理论视角来自全球眼科护理和消费视力矫正：世界卫生组织（WHO）数据显示，全球至少有 22
              亿人存在视力损伤，未矫正屈光不正和白内障是主要原因；视力损伤每年给全球生产力造成估计 $411 billion 的负担。消费计算领域，Xpanceo 声称到 2033 年每天佩戴隐形眼镜的人数将达到 2.5
              亿，并由此形成终极后屏幕平台。但把理论佩戴者转化为现实支出，必须设定严格边界。IDC 预计，无显示智能眼镜品类 2026 年全球收入为 $5.1 billion，对应出货量 1360 万台；到 2030
              年出货量增至 2730 万台，CAGR 为 18.9%，ASP 则从 $376 降至 $229。混合现实头显到 2030 年还将形成 $7.1 billion 的市场（1040
              万台）。由于缺少监管审批和规模化制造，Xpanceo 在 2028 年以前的大众消费 SOM 实际接近于零。现实的初始可服务市场只能是小众高风险国防/航空航天抬头显示合同，以及专业临床监测试点。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              智能隐形眼镜的采用路径分为三类截然不同的客户，每类都受不兼容的采购周期和监管门槛约束。在国防和航空航天前沿领域，买方是机构项目经理（例如飞行运营和国防采购部门），他们寻找免手持抬头显示，因为头盔或面罩使传统 AR
              眼镜无法使用。预算来自专业研发和国防采购拨款，支付意愿高，但采购周期通常需要 36 至 60 个月，还要满足严格的 MIL-STD
              环境加固要求。在临床和眼科领域，使用者是青光眼或慢性病患者，但决策者和把关人是眼科医生或健康保险机构。采用需要经过同行评审的临床验证，且要与金标准眼压测量或血液检测对照；报销则依赖既有 CPT/DRG
              诊断计费代码。最后，在大众消费和企业生产力领域，个人消费者与企业 IT 部门掌握支出，购买触发因素完全取决于舒适度、外观隐形程度以及能否续航超过一个完整工作日。
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、生物约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推动投资人关注眼部计算的主要增长动力，是行业从手持智能手机转向环境式、AI 优先空间计算的长期迁移。Meta 在智能眼镜上的商业成功，证明消费者对免手持、具备上下文的 AI
              音频和捕捉功能有显著需求。但智能隐形眼镜遇到的是普通头戴式镜框可以避开的结构性约束。首先，角膜生理学对氧传输率（Dk/t）设有严格上限；在镜片内嵌入硅显示器、天线和固态微电池，长期佩戴可能造成角膜缺氧、眼部感染和慢性刺激。与微电池开发商
              ITEN 的工程披露也承认，要在人的眼睛上持续驱动毫瓦级微显示器，需要微电池不能产生危险热量或体积膨胀。其次，若按 II 类或 III 类医疗器械分类，上市前必须进行多年临床试验。Xpanceo 虽计划在
              2026 年底前开展临床试验、在 2027 年初展示完整集成原型，但公司尚未公布同行评审的人体安全数据、临床试验注册编号或客户单位经济模型，实际市场采用时间仍存在重大尽调缺口。
            claimRefs:
              - CM002
              - CM004
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 智能眼镜与智能隐形眼镜之间的眼部鸿沟
            body: >-
              无显示智能眼镜在 2026 年第一季度出货量同比激增 167%（据 IDC），其快速商业进展证明轻量 AI
              可穿戴设备需求强劲；但智能隐形眼镜面临完全不同的风险结构。隐形眼镜把有源电子元件和微电池直接贴近角膜，使消费小工具变成侵入式 II/III 类医疗器械，必须经过严格监管审批、临床试验和生物相容性验证。
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM014
          - type: callout
            title: 前沿工业和医疗切入口与消费市场远景
            body: >-
              Xpanceo 开发太空/飞行头盔 AR
              视觉、非侵入式青光眼监测等独立原型应用，是务实的商业切入口。高毛利的航空航天和医疗诊断买方已经有预算，也能接受专业配套硬件，因此在大众消费者采用可行之前，公司有机会从这些市场进入。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、在位者与替代品
        blocks:
          - type: paragraph
            body: >-
              眼部与空间计算市场分成三条竞争线：尝试把系统集成到眼上的智能隐形眼镜先驱；开发智能眼镜和空间计算头显的 Big Tech 消费电子在位者；以及提供单一用途诊断镜片的医疗器械制造商。在直接竞争类别中，继 Mojo
              Vision 高调失败后，Xpanceo 几乎没有同类对手。Mojo Vision 曾筹资超过 $205 million 打造增强现实隐形眼镜，却因光学效率瓶颈无法突破、资本受限，于 2023 年放弃项目。由
              Meta 和 Apple 领衔的 Big Tech 在位者则把资本集中在 Meta Ray-Ban 眼镜、Apple Vision Pro
              等外置面部可穿戴设备上，拥有初创进入者难以匹敌的消费者品牌资产、成熟开发者生态和全球零售渠道。Xpanceo
              虽声称每天佩戴隐形眼镜的人群构成广阔的隐形计算市场，但仍须同时克服成熟智能眼镜这一机械替代品，以及此前已令先驱项目停摆的生物学障碍。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP010
              - CP015
