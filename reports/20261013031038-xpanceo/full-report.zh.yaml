companyProfile:
  summary: >-
    Xpanceo 是一家总部位于迪拜、2019 年成立的深科技初创公司，正在打造融合 XR 显示、健康感知、供电和透明电子技术的 AI 智能隐形眼镜平台。公司通过种子轮和 A 轮累计融资 $290M，雇用约 100
    名专业人员，并采取分阶段路线图：先从医疗和工业切入口起步，再考虑更广泛的消费市场。尽管原型进展已公开可见，公司仍处于商业化前阶段，尚未披露收入或活跃商业客户，前方还有漫长的监管路径。
