    title: 产品架构图
    type: stack
    summary: 从眼部基底到外部计算配套设备的六层光电、传感和电力架构。
    data:
      layers:
        - label: 1. 眼部基底与生物相容性封装
          detail: 为持续向角膜输送氧气并保持舒适性而设计的软隐形眼镜水凝胶基底。
        - label: 2. 透明导电电路
          detail: 获得专利的准二维金导体，由分布在镜片周边的少原子层柔性互连构成。
        - label: 3. 微光学与近眼显示
          detail: 采用专有近眼准直光学和全息光学元件的 MicroLED 微显示器。
        - label: 4. 生物传感与诊断换能器
          detail: 采用功能化金纳米颗粒的电化学泪液生物标志物传感器，以及光学 IOP 形变计。
        - label: 5. 能量采集与微电池储能
          detail: 固态陶瓷微电池搭配谐振射频能量采集和多级电力封装。
        - label: 6. 外部射频配套设备与处理单元
          detail: 口袋大小的可穿戴配套设备，提供计算卸载、传感器遥测和无线供电。
