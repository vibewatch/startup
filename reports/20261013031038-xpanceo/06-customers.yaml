callouts:
  - calloutType: insight
    title: Pre-Commercial Deep Tech Adoption Dynamics
    body: Xpanceo does not yet operate a commercial sales funnel. In deep tech hardware platforms, customer traction is measured by prototype validation, academic partnerships, and supply chain co-development rather than traditional ARR or logo velocity.
    claimRefs:
      - CU001
      - CU005
      - CU007
  - calloutType: risk
    title: Clinical Certification as the Ultimate Adoption Gate
    body: Because Xpanceo's interface rests directly on the cornea, enterprise and consumer adoption remains completely blocked until the device secures Class II/III medical device regulatory clearance and proves long-term biocompatibility in human trials.
    claimRefs:
      - CU009
      - CU011
      - CU013
