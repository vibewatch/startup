  title: Customers
  summary: Xpanceo is a pre-revenue deep-tech venture with zero commercial customers, focusing adoption efforts on component prototypes, academic collaborations, and hardware co-development partnerships ahead of targeted 2026–2027 clinical demonstrations.
sections:
  - id: customer-segmentation-and-target-markets
    title: Customer Base Segmentation & Target Markets
    body: 'Xpanceo''s commercial strategy envisions an expansive computing platform designed to replace conventional smartphones and head-mounted XR displays with an invisible on-eye interface. The company divides its future customer base across four distinct wedges: healthcare monitoring, industrial and enterprise operations, high-performance frontier environments, and mainstream consumer spatial computing. Within healthcare, the primary target user is the ophthalmology patient population, with specific emphasis on continuous intraocular pressure monitoring for glaucoma management and non-invasive tear fluid analysis for oncological and cardiovascular drug dosing. In enterprise and industrial settings, Xpanceo targets deskless professionals, factory maintenance crews, and logistics operators who require hands-free contextual information feeds without the visual obstruction or neck strain associated with bulky head-mounted displays. For frontier applications such as aerospace, aviation, and elite motorsport racing, the company pairs contact lens optics with specialized helmet companion hardware to project heads-up mission telemetry in environments where external glasses cannot fit. Finally, in consumer markets, Xpanceo articulates a vision where 250 million daily contact lens wearers transition to smart lenses for real-time translation, augmented navigation, and personal computing. However, all four segments remain entirely hypothetical as commercial markets; Xpanceo has established no formal distribution channels, institutional payer agreements, or enterprise procurement relationships.'
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU012
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-revenue-status
    title: Adoption Trajectory & Revenue Realities
    body: From a commercial and revenue perspective, Xpanceo currently exhibits zero commercial traction. The company generates no annual recurring revenue, sells no commercial hardware units, and reports zero active paying customer accounts across both enterprise and consumer categories. Instead, its developmental trajectory is defined by deep-tech research milestones and institutional capital accumulation. Having completed a $40 million seed investment followed by a $250 million Series A financing at a $1.35 billion valuation in mid-2025, Xpanceo possesses substantial financial runway to underwrite prolonged laboratory development. Across four years of research, the team has assembled more than 28 standalone prototypes across multiple hardware iterations, testing individual subsystems including holographic optical elements, micro-OLED displays, microbatteries, and biosensors. While these iterations demonstrate rapid laboratory progress, the absence of an integrated, wearable device on the market means that customer growth metrics such as net revenue retention, gross renewal rates, and cohort expansion curves cannot be measured. The company's publicized metric of 250 million daily contact lens wearers by 2033 represents a top-down addressable market sizing hypothesis rather than demonstrated buyer demand or conversion velocity.
    claimRefs:
      - CU001
      - CU004
      - CU008
      - CU010
    tableRefs:
      - TU002
  - id: named-customer-proof-and-partnerships
    title: Named Deployments & Partnership Proof
    body: Because Xpanceo operates as a pre-commercial venture, its customer proof surface consists of technical co-development partnerships and academic research collaborations rather than production client deployments. The company's most concrete technical collaboration is with French solid-state microbattery innovator ITEN, with whom Xpanceo developed a proof of concept integrating ceramic microbatteries and wireless energy harvesters into a soft contact lens substrate. This partnership addresses the critical bottleneck of safe milliwatt-level power delivery on the eye, though it represents component-level feasibility rather than a volume commercial procurement relationship. Additionally, Xpanceo expanded its R&D facilities during GITEX Global 2025 in Dubai, hosting an academic testing and lecture program in collaboration with Middlesex University Dubai and specialist optometry practice Cairns & Co. While these engagements validate scientific transparency and external academic interest, they do not constitute customer validation or enterprise pilot contracts. No industrial conglomerate, defense contractor, hospital system, or retail consumer has placed binding purchase orders or completed field trials with Xpanceo's technology. Furthermore, the company faces severe partner concentration and component dependency risks, relying on bespoke third-party fabrication for essential micro-optics and specialized solid-state cells.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU014
    tableRefs:
      - TU003
  - id: wearer-retention-and-adoption-barriers
    title: Durability, Wearer Retention & Adoption Barriers
    body: The ultimate determinants of customer adoption and long-term durability for smart contact lenses are wearer retention, ocular biocompatibility, and clinical regulatory approval. Academic literature evaluating ocular wearables indicates that placing powered electronic components directly on the eye introduces formidable physiological barriers, including disrupted tear film stability, hypoxia from constrained oxygen permeability, and elevated risks of infectious keratitis or corneal acidosis. Even among conventional soft contact lens wearers, significant annual drop-out rates occur due to dryness, discomfort, and handling fatigue. For an active electronic device incorporating microbatteries, inductive antennas, and microdisplays, ensuring acceptable daily wear-time and thermal safety is an extraordinary engineering challenge. Xpanceo has targeted late 2026 for pre-clinical component trials and initial human safety evaluations, followed by a public demonstration of an integrated prototype worn by its founders in early 2027. Crucially, the company plans to certify its lenses as regulated medical devices, meaning commercialization in major jurisdictions will require multi-year clinical trials and rigorous premarket approvals. Until peer-reviewed human clinical safety and wearer adherence data become available, prospective customer adoption remains entirely theoretical.
    claimRefs:
      - CU009
      - CU011
      - CU013
    figureRefs:
      - FU001
