  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Angle
      - Core Argument
      - Empirical Evidence
      - Thesis Invalidation Trigger
    rows:
      - - Growth & Moat
        - Dominant startup digital banking platform scaling with AI enterprise formation surge
        - Over 300,000 customers onboarded, capturing one-third of all early-stage U.S. startups
        - Quarterly customer account growth decelerating below 10% YoY or market share erosion
      - - Unit Economics
        - High-margin profitable financial software engine with durable cash generation
        - Four consecutive years of operating profitability with $650M in annualized revenue
        - Transition into operating losses or sharp compression in net interest margin yield
      - - Regulatory Posture
        - Proactive transition from BaaS dependency to direct federal bank supervision
        - Received OCC conditional approval to establish Mercury Bank N.A. targeting 2027 launch
        - Formal denial or material restriction of final national bank charter by OCC examiners
      - - Capital Structure
        - Clean senior preferred structure without onerous liquidation multipliers or participating rights
        - Series D shares carry standard 1.0x liquidation preference and 1.0x common conversion
        - Introduction of senior structured debt overhang or down-round liquidation preference ratchets
    notes: Synthesis of investment drivers and operational risks across corporate disclosures and regulatory filings.
