    title: Recommendation summary table
    columns:
      - Parameter
      - Value
      - Basis and Strategic Rationale
      - Decision Implication
    rows:
      - - Recommendation
        - Buy
        - Series D pricing at 8.0x annualized revenue ($5.2B on $650M run-rate) supported by sustained profitability
        - Participate in primary capital rounds or acquire secondary equity up to $5.2B valuation cap
      - - Confidence
        - Medium
        - Financial run-rate, customer counts, and OCC conditional charter confirmed by primary corporate disclosures and tier-one investors
        - High conviction on core operating metrics; diligence required on net interest margin sensitivity
      - - Risk Rating
        - Medium
        - Four consecutive years of profitability offset partner bank concentration and BaaS regulatory transition
        - Size investment allocation appropriately while tracking OCC operational readiness checkpoints
      - - Valuation Stance
        - Fair
        - 8.0x annualized revenue represents balanced pricing relative to private peers and Brex acquisition benchmark ($5.15B)
        - Entry multiple offers attractive risk-adjusted upside toward public market liquidity
    notes: Valuation metrics anchored to May 2026 Series D post-money capitalization and Q3 2026 annualized revenue disclosures.
