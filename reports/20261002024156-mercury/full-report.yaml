chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Mercury was founded in 2017 by Immad Akhund, Max Tagher, and Jason Zhang and is headquartered in San
              Francisco. Its product is a software-led financial platform for startups and small businesses: independent
              coverage describes checking, savings, debit cards, treasury tools, and bill pay, while Mercury describes a
              broader operating layer spanning payments, invoicing, spend monitoring, and cash flow. The legal
              distinction is important for diligence. Mercury states that it is a fintech company rather than an
              FDIC-insured bank; deposit services are currently supplied through Choice Financial Group and Column N.A.,
              and the IO Card is issued by Patriot Bank. The model therefore combines software ownership with continuing
              reliance on regulated banking partners.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO010
              - CO011
              - CO013
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The available evidence consistently identifies Akhund, Tagher, and Zhang as the founding team and
              describes them as former colleagues at Heyzap. Forbes identifies Akhund as chief executive and co-founder,
              but the assigned evidence does not establish a current board roster, committee structure, founder
              ownership, or voting control. It also does not independently verify current operating titles for Tagher
              and Zhang, so the leadership table avoids assigning titles that the retained pages do not substantiate.
              Akhund remains the visible author of the financing, product, and bank-charter narrative, creating a
              plausible key-person concentration, but that is an analytical diligence concern rather than proof of weak
              succession. Board materials and an organization chart are required before drawing a governance conclusion.
            claimRefs:
              - CO001
              - CO005
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.3'
        title: Capital, Scale, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Mercury announced a $200 million Series D at a $5.2 billion valuation led by TCV, with Andreessen
              Horowitz, Coatue, CRV, Sapphire Ventures, Sequoia Capital, and Spark Capital returning. That round and
              valuation are supportable; a precise cumulative-funding figure is not. Retained profiles use different
              funding totals, and the assigned sources do not provide a complete primary financing schedule, debt terms,
              secondaries, or capitalization table. Operating scale is also largely company-reported. Mercury says
              annualized revenue reached $650 million in September 2025, customer count exceeded 300,000, and 2025
              transaction volume was $248 billion. Annualized revenue is not ARR, transaction volume is not revenue,
              funding raised is not cash available, and four years of GAAP net income and EBITDA profitability do not
              disclose margins or cash generation.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
