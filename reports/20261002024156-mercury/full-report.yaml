      - number: '1.4'
        title: Milestones and Regulatory Transition
        blocks:
          - type: paragraph
            body: >-
              The timeline shows a progression from the 2017 founding and 2019 business-account launch to a broader
              financial operating system. By late 2025 Mercury reported substantial revenue and transaction scale,
              opened Mercury Personal more broadly, and pursued a national bank charter. In April 2026 it received
              conditional OCC approval to establish Mercury Bank, N.A.; Mercury explicitly says additional FDIC and
              Federal Reserve approvals and final OCC approval are still required before the bank can open. The May
              Series D and September launch of Mercury Books extend both the capital base and product perimeter. No
              eligible adverse or regulatory source in the assigned pool independently evaluates this transition, so the
              absence of a cited incident must not be read as evidence that no compliance, outage, or partner risk
              exists.
