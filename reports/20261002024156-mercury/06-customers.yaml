callouts:
  - calloutType: "insight"
    title: "Conversational Intake as a Competitive Moat in Business Banking"
    body: "By replacing static form fields with an adaptive conversational interview layer, Mercury accelerates entity validation for complex founder profiles while capturing structured compliance narratives required for BSA/AML triage. This materially reduces application abandonment compared to incumbent commercial banks."
    claimRefs:
      - "CU006"
  - calloutType: "risk"
    title: "Ecosystem Concentration and Startup Mortality Vulnerability"
    body: "Because Mercury's primary customer base consists of early-stage, venture-backed companies, its deposit stability is directly coupled to tech funding environments. Startups burning venture capital without subsequent fundraises create systemic attrition that cannot be mitigated by software usability alone."
    claimRefs:
      - "CU012"
      - "CU013"
