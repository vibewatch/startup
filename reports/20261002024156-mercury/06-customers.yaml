chapter:
  number: 6
  title: "Customers"
  summary: "Mercury has established extensive commercial adoption within tech startups and small businesses, scaling past 200,000 corporate customers and over $156B in annualized payment transaction volume. Expansion into personal accounts via Mercury Personal targets complex operators, while commercial concentration remains tied to the tech venture cycle and customer due-diligence scrutiny."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and Target Profiles"
    body: "Mercury primarily serves early-stage technology startups, software development companies, venture-backed scaleups, and broader digital-first small businesses. Early-stage venture startups (ranging from pre-seed formations to Series A teams) represent the core wedge of the customer base, where rapid digital onboarding and integrated venture-scale tooling (checking, savings, corporate credit cards, and treasury services) address critical friction points in traditional corporate banking. Beyond early formations, scaleups utilize multi-entity treasury management and higher-yield cash accounts, whereas venture capital and investment firms utilize Mercury for capital call routing and fund operational spend. Most recently, Mercury Personal was introduced in 2024 and expanded in 2025 to capture individual founder and high-net-worth operator banking, converting corporate relationship trust into consumer account wallet share."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-onboarding"
    title: "Adoption Trajectory, Transaction Scale, and Onboarding Velocity"
    body: "Mercury's adoption trajectory has demonstrated substantial growth, expanding from over 100,000 startup customers in early 2023 to more than 200,000 active startups and small businesses by 2024 disclosures, processing over $156 billion in annual transaction volume. To sustain this onboarding velocity across increasingly complex corporate entities—such as Delaware C-corps, multi-founder LLCs, and international holding structures—Mercury transitioned its customer due diligence and Know Your Customer (KYC) capture from static forms into structured conversational AI onboarding. This conversational workflow dynamically branches entity-formation intake, automatically classifies business descriptions against regulatory schemas, and triages low-risk domestic applicants for auto-approval while surfacing ambiguous use-of-funds narratives directly to human compliance officers."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU006"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-retention-risks"
    title: "Named Customer Proof, Retention Dynamics, and Concentration Vulnerabilities"
    body: "Production deployment and customer proof are demonstrated across technology firms and venture ecosystems, including active executive endorsement from Superhuman, Akita Software, and venture partners such as Andreessen Horowitz. While customer acquisition velocity and brand affinity remain high across founders, quantitative retention metrics—such as net revenue retention (NRR), gross revenue retention (GRR), and cohort churn curves—remain private and undisclosed. Customer concentration is intrinsically exposed to macroeconomic and venture funding cycles, where early-stage company dissolutions directly reduce non-interest deposit balances and transaction interchange. Furthermore, fintech banking partner scrutiny and enhanced Bank Secrecy Act / Anti-Money Laundering (BSA/AML) compliance requirements create ongoing onboarding friction and account limitation risks for cross-border and complex legal entities, underscored by regulatory enforcement actions against unrelated commercial entities operating under similar commercial names."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
