schemaVersion: "report-v2"
artifact: risks
slug: mercury
runDate: 2026-10-02
company:
  name: Mercury
chapter:
  number: 7
  title: Risks
  summary: >-
    Mercury's March 2026 advisory brochure directly identifies technology, cybersecurity,
    third-party, custody, execution, and conflict-of-interest exposures, while a current
    company job posting shows that trading-control infrastructure remains an active operating
    priority. The highest residual risk is the combination of regulated workflows with
    concentrated external dependencies; independent enforcement, incident, and loss evidence
    was not available in the assigned source pool.
sections:
  - id: risk-posture
    title: Risk posture and evidence boundary
    body: >-
      Mercury presents itself as a finance stack rather than an insured bank, and its own
      materials show that delivery spans affiliated advisory and broker-dealer functions,
      partner banks, custodians, investment managers, cloud infrastructure, and automated
      workflows. That architecture concentrates several failure modes in the same customer
      experience: a vendor interruption can become an execution problem, a control break can
      become a regulatory issue, and a data error can become a suitability or valuation
      problem. The assigned discovery pool is not a clean adverse record. Four results concern
      elemental mercury or unrelated organizations using the Mercury name; they are retained
      only to document scope contamination and are excluded from company-risk conclusions.
      Accordingly, this chapter ranks disclosed exposures but does not infer that a breach,
      enforcement action, or customer loss occurred.
    claimRefs: [CR002, CR003, CR004, CR012, CR015]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and conduct exposure
    body: >-
      Mercury Advisory is a wholly owned subsidiary of Mercury Technologies and operates a
      registered advisory program, so suitability, supervision, recordkeeping, disclosure,
      and conflict management are material operating obligations rather than peripheral
      compliance tasks. The 2026 brochure discloses a revenue conflict when recommendations
      can increase balances or use of affiliated accounts, and it also says Mercury Advisory
      guaranteed a parent revolving credit facility. The same brochure reports no disciplinary
      item, but that is a company-issued disclosure, not independent proof that no regulatory
      or legal matter exists. The legal agreement further limits the information considered
      in portfolio recommendations and relies on customers to keep it current. Diligence
      should therefore reconcile Form ADV records, FINRA records, exam correspondence,
      complaints, and litigation searches before treating the disclosed status as complete.
    claimRefs: [CR001, CR007, CR008, CR009, CR014]
    tableRefs: [TR001]
  - id: operations-security
    title: Operational, security, and control execution
    body: >-
      The most decision-relevant operating risk is control execution across automated trading
      and partner-managed infrastructure. Mercury's brochure says portfolio rebalancing
      depends on vendors including Amazon Web Services and custodian services, and that vendor
      unavailability can remove the ability to rebalance. It also identifies programming,
      code, and system failures as possible causes of trading errors and describes
      cybersecurity events as potential sources of transaction disruption, information loss,
      litigation, and regulatory action. A current company job posting seeks a leader to own
      trade surveillance, breaks, settlement, regulatory reporting, examinations, and control
      evidence. That posting is not proof of a control deficiency, but it makes staffing,
      exception aging, reconciliation quality, and post-launch testing concrete diligence
      topics. No incident history or control-effectiveness data was available in the pool.
    claimRefs: [CR004, CR005, CR006, CR011]
    tableRefs: [TR002]
  - id: dependencies-kill-criteria
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      Mercury's own disclosures identify Apex as the required custodian for direct Treasury
      and Invest accounts, Morgan Stanley as the custodian and portfolio manager for Treasury
      Solutions, and Choice Financial Group and Column as banking-service providers. These
      arrangements distribute regulated responsibilities, but they also create operational
      handoffs and counterparties that Mercury does not fully control. The mitigation case
      depends on tested continuity, contractual service levels, alternative providers,
      reconciliations, and evidence that supervisory controls operate in production. Monitor
      partner concentration, unresolved trade breaks, settlement failures, late regulatory
      reports, customer-impacting incidents, repeat audit findings, and changes to bank or
      custody relationships. A partner termination without a tested migration path, a material
      control failure, or regulatory restrictions that interrupt core money movement should
      be treated as thesis-break events until remediated and independently verified.
    claimRefs: [CR002, CR003, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or obligation
      - Jurisdiction / status
      - Likelihood
      - Severity
      - Mitigation evidence
      - Residual exposure / diligence path
    rows:
      - - Suitability, supervision, and trading-control obligations
        - U.S.; RIA and broker-dealer-related workflows disclosed
        - Medium
        - High
        - Company is recruiting licensed leadership for surveillance, reporting, exams, and control evidence
        - Obtain exam history, WSPs, exception metrics, and remediation logs
      - - Affiliated-product and balance-based revenue conflicts
        - U.S.; conflict disclosed in March 2026 Form ADV brochure
        - Medium
        - Medium
        - Voluntary participation and fee disclosure are cited by the company
        - Test recommendation governance, overrides, and conflict committee evidence
      - - Undetected legal or disciplinary exposure
        - Company brochure says none reportable; no independent confirmation in assigned pool
        - Unknown
        - High
        - Annual brochure review and company compliance program
        - Reconcile IAPD, FINRA, court, complaint, and regulator records
    notes: >-
      Sample of material disclosed obligations and gaps, ordered by residual severity; likelihood
      ratings are analyst judgments based on company-issued disclosures, not incident frequencies.
    enumerationScope:
      coverage: sample
      basis: >-
        Material regulatory and legal risks identifiable from the assigned October 2026
        prefetched source pool; independent enforcement coverage was unavailable.
    claimRefs: [CR001, CR007, CR008, CR009, CR011, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Vendor or system outage prevents portfolio rebalancing
        - Medium
        - High
        - Partially disclosed
        - Time-sensitive trades or allocations may be delayed
        - No recovery-time, failover, or outage-history evidence
      - - Programming, code, or system error causes trading error
        - Medium
        - High
        - Active build-out indicated
        - Customer loss, remediation cost, and supervisory exposure
        - No break-rate, loss, or exception-aging data
      - - Cybersecurity event disrupts transactions or compromises data
        - Medium
        - High
        - Plans disclosed, effectiveness unverified
        - Customer loss, litigation, and regulatory inquiry
        - No independent incident or control-assurance evidence
      - - Supervisory and reporting controls fail to scale with product breadth
        - Medium
        - High
        - Leadership role open
        - Late reporting, repeat findings, or product restrictions
        - No staffing capacity or control-test results
    notes: >-
      Ratings synthesize risks expressly disclosed by Mercury with a company-issued operating-role
      description; no incident frequency or independently tested control data was available.
    claimRefs: [CR004, CR005, CR006, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation / residual exposure
    rows:
      - - Custody, clearing, and execution
        - Apex Clearing Corporation
        - Required custodian for direct Treasury and Invest accounts
        - High for disclosed direct programs
        - Custody or execution interruption delays trades and transfers
        - High
        - Confirm portability, SLA, reconciliation, and tested migration plan
      - - Treasury Solutions custody and portfolio management
        - Morgan Stanley
        - Custodian, recommendations, and transaction execution
        - High within Treasury Solutions
        - Service or relationship disruption impairs a premium product
        - High
        - Review termination rights, substitution plan, and client communication playbook
      - - Banking-service access
        - Choice Financial Group and Column N.A.
        - FDIC-member partner banks named in company disclosure
        - Material; allocation not disclosed
        - Partner restriction interrupts core banking functions
        - High
        - Obtain volume split, regulatory status, and contingency routing
      - - Cloud and system services
        - Amazon Web Services and custodian services
        - Infrastructure supporting portfolio rebalancing
        - Material; redundancy not disclosed
        - Vendor unavailability removes rebalancing capability
        - High
        - Validate multi-region recovery, manual fallback, and recovery objectives
    notes: >-
      Counterparties and roles are company-disclosed; concentration levels are qualitative because
      contract terms, transaction shares, service levels, and redundancy evidence were not provided.
    claimRefs: [CR002, CR003, CR004, CR010, CR012, CR013]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative view of disclosed exposure, likelihood, and mitigation maturity; it is not an
      incident-frequency model.
    data:
      columns:
        - label: Impact
          detail: Potential consequence if the failure occurs
        - label: Likelihood
          detail: Qualitative exposure inferred from disclosed architecture, not event frequency
        - label: Mitigation maturity
          detail: Strength of evidence visible in the assigned source pool
      rows:
        - label: Partner-bank interruption
          note: Banking allocation and portability are undisclosed.
          values:
            - {label: High, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Unverified, tone: warning}
        - label: Custody or execution disruption
          note: Apex and Morgan Stanley roles are disclosed.
          values:
            - {label: High, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Partial, tone: warning}
        - label: Trading-control failure
          note: Current hiring indicates active investment in control ownership.
          values:
            - {label: High, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Building, tone: warning}
        - label: Cybersecurity event
          note: Plans are disclosed, but effectiveness evidence is absent.
          values:
            - {label: High, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Unverified, tone: warning}
        - label: Affiliated-product conflict
          note: The Form ADV brochure discloses the incentive and stated mitigants.
          values:
            - {label: Medium, tone: warning}
            - {label: Medium, tone: warning}
            - {label: Disclosed, tone: neutral}
        - label: Evidence-scope contamination
          note: Four assigned results concern unrelated Mercury meanings or entities.
          values:
            - {label: Medium, tone: warning}
            - {label: High, tone: negative}
            - {label: Identified, tone: positive}
    approximationNotes: >-
      Impact, likelihood, and maturity are qualitative analyst classifications; no numeric event
      probabilities, loss amounts, or independently tested control scores were available.
    claimRefs: [CR004, CR006, CR007, CR011, CR012, CR015]
callouts:
  - calloutType: risk
    title: Investment committee kill criteria
    body: >-
      Pause or re-underwrite if a bank, custodian, or clearing relationship is restricted without
      a tested migration path; if a material trading or cybersecurity control failure causes
      customer loss; or if examinations identify repeat supervisory failures that constrain core
      products. Require source documents and remediation evidence rather than relying on the
      absence of a public incident in this constrained pool.
    claimRefs: [CR004, CR005, CR006, CR011, CR012]
