evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, committee assignments, founder ownership, voting control, and
      succession arrangements.
    whyItMatters: The public founder narrative does not establish who controls strategic, compliance, or succession decisions.
    diligencePath: >-
      Request the current organization chart, board minutes, charter documents, capitalization table, voting agreements,
      and succession plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      A primary financing schedule separating equity, debt, secondaries, undrawn facilities, fees, and cash currently
      available.
    whyItMatters: Public totals conflict and funding raised cannot be treated as liquidity or runway.
    diligencePath: >-
      Reconcile signed financing documents, the capitalization table, debt statements, secondary ledgers, and current
      treasury balances.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated employee count with a defined denominator covering employees, contractors, and international personnel.
    whyItMatters: >-
      Published figures range from 1,000-plus to 5,000, preventing a reliable workforce and operating-leverage
      assessment.
    diligencePath: Obtain a dated HRIS export and reconcile its population definition to payroll and contractor records.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-regulatory-evidence
    missingEvidence: >-
      An eligible independent regulatory, legal, or critical source evaluating Mercury's partner-bank operations and
      charter transition.
    whyItMatters: >-
      Company disclosures establish conditions but cannot independently establish compliance quality or the absence of
      incidents.
    diligencePath: >-
      Review OCC, FDIC, Federal Reserve, state regulator, court, partner-bank enforcement, outage, and complaint records
      outside this constrained source pool.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: fintech-market-sizing
    missingEvidence: >-
      Audited industry-wide deposit market share and ARR breakdown specifically isolating fintech sponsor-bank deposits
      for technology startups in 2026.
    whyItMatters: >-
      Without segmented private depository data, quantifying Mercury's exact SOM percentage relative to Brex, Ramp, and
      traditional banks relies on estimated proxies.
    diligencePath: >-
      Obtain private benchmarking reports from depository partner disclosures, call reports, or venture debt syndicate
      filings.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-displacement-rates
    missingEvidence: >-
      Granular cohort-level customer churn and displacement data indicating what percentage of venture-backed startups
      migrate primary operating accounts from Mercury to Rho, Brex, or Ramp upon scaling.
    whyItMatters: >-
      Determines whether Mercury functions predominantly as an early-stage incubator bank that loses mature, high-spend
      corporate clients to enterprise spend platforms.
    diligencePath: Request anonymized customer retention by employee headcount cohort or survey scaling Series B+ venture CFOs.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited customer acquisition cost (CAC), channel payback periods, and cohort-level net revenue retention (NRR)
      schedules.
    whyItMatters: >-
      Without segmented CAC and cohort retention data, underwriting cannot independently verify customer lifetime value
      resilience if venture startup formation slows.
    diligencePath: >-
      Request management's cohort contribution models, gross churn metrics, and sales efficiency figures under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: partner-bank-economics
    missingEvidence: >-
      Contractual fee-sharing schedule and net interest margin retention splits between Mercury and partner institutions
      including Choice Financial and Evolve Bank.
    whyItMatters: >-
      Partner bank revenue sharing determines underlying gross margins and vulnerability to regulatory compliance cost
      pass-throughs.
    diligencePath: >-
      Review BaaS partner service-level agreements and sweep network yield allocation exhibits in confidential data
      room.
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: partner-bank-synchronization
    missingEvidence: >-
      Quantitative latency benchmarks, API throughput limits, and core banking synchronization performance metrics
      between Mercury's cloud infrastructure and Choice Financial Group / Column N.A. ledgers.
    whyItMatters: >-
      System reliability, payment execution cut-off compliance, and transaction reconciliation integrity depend directly
      on the performance and uptime of partner bank API connectors.
    diligencePath: >-
      Request engineering architecture documentation, partner bank service level agreements (SLAs), error budget
      reports, and historical API availability logs during technical underwriting.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross retention, and annual account churn rates across customer vintage
      cohorts.
    whyItMatters: >-
      Without cohort retention disclosures, assessing the durability of customer deposits against normal tech startup
      failure rates remains speculative.
    diligencePath: >-
      Request cohort retention tables, customer lifetime value (LTV), and account closure rates under confidential
      diligence review.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer
    missingEvidence: >-
      Comprehensive roster of mid-market and enterprise customer deployments outside early-stage venture software
      startups.
    whyItMatters: >-
      Validating whether Mercury has successfully expanded into larger non-tech commercial enterprises beyond
      founder-led seed and Series A entities.
    diligencePath: >-
      Review customer revenue concentration logs and verify top 50 corporate client industry classifications during
      management diligence.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: independent-legal-status
    missingEvidence: >-
      Independent regulator, court, complaint, and enforcement records tied specifically to Mercury Technologies,
      Mercury Advisory, or its broker-dealer affiliate.
    whyItMatters: >-
      Company-issued disclosure cannot independently establish the absence, scope, or resolution of legal and regulatory
      matters.
    diligencePath: >-
      Pull current SEC IAPD and FINRA BrokerCheck records, regulator examination correspondence, federal and state court
      dockets, complaint logs, and outside-counsel litigation letters.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Transaction-volume allocation, service levels, termination rights, recovery objectives, and tested migration plans
      for bank, custodian, clearing, and cloud counterparties.
    whyItMatters: >-
      Public disclosures identify counterparties but do not quantify concentration or prove that Mercury can preserve
      core services after a partner failure.
    diligencePath: >-
      Review partner contracts, quarterly business reviews, concentration dashboards, continuity tests, and the most
      recent failover or migration exercise.
    relatedQuestionRefs:
      - QR004
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: control-effectiveness
    missingEvidence: >-
      Incident history, trade-break rates, settlement failures, exception aging, control-test results, audit findings,
      and customer-loss data.
    whyItMatters: >-
      Disclosed risks and an open control-leadership role establish exposure but not actual frequency, loss severity, or
      mitigation effectiveness.
    diligencePath: >-
      Obtain 24 months of operational-risk metrics, incident post-mortems, audit and exam findings, remediation
      tracking, and board risk reporting.
    relatedQuestionRefs:
      - QR003
      - QR006
      - QR007
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: minor
    topic: evidence-quality
    missingEvidence: A clean, independently sourced adverse-search set scoped to the target company and its regulated affiliates.
    whyItMatters: >-
      Name collisions in the assigned pool reduce confidence that the public adverse record was searched comprehensively
      without false attribution.
    diligencePath: >-
      Search legal entity names and regulator identifiers in SEC, FINRA, CFPB, OCC, FDIC, state-regulator, court, and
      incident databases, then verify every result by entity.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
