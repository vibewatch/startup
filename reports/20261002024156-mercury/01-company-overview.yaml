company:
  name: "Mercury"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Mercury is a San Francisco fintech founded in 2017 that combines business banking access with cards, payments, treasury, invoicing, and financial software. It announced a $200 million Series D at a $5.2 billion valuation and says it serves more than 300,000 customers, while its transition from a partner-bank model to a national bank remains conditional on further regulatory approvals."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      Mercury was founded in 2017 by Immad Akhund, Max Tagher, and Jason Zhang and is
      headquartered in San Francisco. Its product is a software-led financial platform
      for startups and small businesses: independent coverage describes checking,
      savings, debit cards, treasury tools, and bill pay, while Mercury describes a
      broader operating layer spanning payments, invoicing, spend monitoring, and cash
      flow. The legal distinction is important for diligence. Mercury states that it is
      a fintech company rather than an FDIC-insured bank; deposit services are currently
      supplied through Choice Financial Group and Column N.A., and the IO Card is issued
      by Patriot Bank. The model therefore combines software ownership with continuing
      reliance on regulated banking partners.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The available evidence consistently identifies Akhund, Tagher, and Zhang as the
      founding team and describes them as former colleagues at Heyzap. Forbes identifies
      Akhund as chief executive and co-founder, but the assigned evidence does not
      establish a current board roster, committee structure, founder ownership, or
      voting control. It also does not independently verify current operating titles for
      Tagher and Zhang, so the leadership table avoids assigning titles that the retained
      pages do not substantiate. Akhund remains the visible author of the financing,
      product, and bank-charter narrative, creating a plausible key-person concentration,
      but that is an analytical diligence concern rather than proof of weak succession.
      Board materials and an organization chart are required before drawing a governance
      conclusion.
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "capital-and-scale"
    title: "Capital, Scale, and Stakeholders"
    body: >-
      Mercury announced a $200 million Series D at a $5.2 billion valuation led by TCV,
      with Andreessen Horowitz, Coatue, CRV, Sapphire Ventures, Sequoia Capital, and
      Spark Capital returning. That round and valuation are supportable; a precise
      cumulative-funding figure is not. Retained profiles use different funding totals,
      and the assigned sources do not provide a complete primary financing schedule,
      debt terms, secondaries, or capitalization table. Operating scale is also largely
      company-reported. Mercury says annualized revenue reached $650 million in September
      2025, customer count exceeded 300,000, and 2025 transaction volume was $248 billion.
      Annualized revenue is not ARR, transaction volume is not revenue, funding raised is
      not cash available, and four years of GAAP net income and EBITDA profitability do
      not disclose margins or cash generation.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "milestones-and-regulatory-transition"
    title: "Milestones and Regulatory Transition"
    body: >-
      The timeline shows a progression from the 2017 founding and 2019 business-account
      launch to a broader financial operating system. By late 2025 Mercury reported
      substantial revenue and transaction scale, opened Mercury Personal more broadly,
      and pursued a national bank charter. In April 2026 it received conditional OCC
      approval to establish Mercury Bank, N.A.; Mercury explicitly says additional FDIC
      and Federal Reserve approvals and final OCC approval are still required before the
      bank can open. The May Series D and September launch of Mercury Books extend both
      the capital base and product perimeter. No eligible adverse or regulatory source
      in the assigned pool independently evaluates this transition, so the absence of a
      cited incident must not be read as evidence that no compliance, outage, or partner
      risk exists.
    claimRefs:
      - "CO001"
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
