          - type: callout
            title: 牌照转型过渡期与合作银行集中度风险
            body: >-
              在 OCC 最终批准 Mercury Bank N.A. 正式展业之前（预计 2027 年），Mercury 仍需依靠 Choice Financial 与 Column
              提供底层存款与清算通道，这使得该平台在第三方 BaaS 强监管执法周期中持续暴露在外部合规风险之下。
            calloutType: risk
