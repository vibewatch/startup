        title: 补充图表
        blocks:
          - type: callout
            title: $5.2B 估值下的战略入场逻辑
            body: >-
              Mercury 在 2026 年 5 月完成的 $5.2 billion Series D 估值对应 8.0 倍年化营收（$650 million），对于兼具 40%+ 营收复合增速、经核验的 GAAP
              盈利能力且拥有清晰银行全牌照路径的稀缺标的而言，提供了极具吸引力的风险收益比。
            calloutType: recommendation
