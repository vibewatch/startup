              等第三方研究模型测算，其年化营收从 2024 年的 $500 million 攀升至 2025 年的 $650 million 到 $712.8 million 之间，依据不同折算基准呈现 43% 至 96%
              的增幅。2026 年 5 月，Mercury 依托稳健运营基本面完成由 TCV 领投的 $200 million Series D 轮融资，投后估值达 $5.2 billion，较 2025 年 3 月 $3.5
