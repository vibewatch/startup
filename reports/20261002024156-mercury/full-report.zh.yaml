            body: >-
              Mercury
              将自身定位为财务科技底座而非承保银行，其官方材料显示，其交付体系涵盖关联投资顾问与券商经纪业务、合作银行、托管商、资产管理机构、云基建及自动化工作流。这种架构将多类失效模式集中映射在同一种用户体验中：供应商服务中断可能演变成交易执行故障，内控缺失可能演变为合规监管风暴，数据差错亦可能演化为合规适当性或资产估值隐患。当前调取的证据池并非纯粹的公司负面记录：其中四项检索结果指向化学元素汞或使用
              Mercury 名称的无关机构，留存此类记录仅用于说明检索范围的数据杂质，不作为评估公司风险的依据。因此，本章旨在梳理公司已披露的风险敞口，而非推断其已发生数据泄露、执法处罚或客户资金损失。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR015
