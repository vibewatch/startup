  - id: FI001
    title: 营收转化模型拆解
    type: flow
    summary: 客户存款与交易体量层层递进转化为多元营收流及 GAAP 净利润的链路图。
    approximationNotes: 存款规模与利差转化数据基于分析师测算及行业基准利差估算，非经审计的分部财务报告。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI009
      - CI016
    data:
      nodes:
        - id: deposits
          label: 客户存款资金池（$20B 底仓）
          detail: 创投资金与日常营运资金归集划转至合作银行网络。
        - id: partners
          label: 合作银行资金归集分流
          detail: 资金分散存管于 Choice Financial、Evolve Bank 与 Patriot Bank。
        - id: nim
          label: 净息差收益生成
          detail: 基于沉淀资金余额赚取利差收益，并与合作银行进行分润。
        - id: card-volume
          label: 支付与刷卡流水（$248B）
          detail: 来自 IO 商业信用卡刷卡手续费及跨境国际支付交易处理费。
        - id: software-fees
          label: 软件与增值服务
          detail: 月度工作流订阅（$35-$350/月）、创投借贷及外汇业务。
        - id: profitability
          label: 毛利润与 GAAP 盈利
          detail: 凭借 PLG 产品驱动增长极低的获客成本，连续十个季度实现盈利。
      edges:
        - from: deposits
          to: partners
          label: 资金归集链路
        - from: partners
          to: nim
          label: 利差收益
        - from: nim
          to: card-volume
          label: 核心业务
        - from: card-volume
          to: software-fees
          label: 工作流延伸
        - from: software-fees
          to: profitability
          label: 净利润转化
  - id: FE001
    title: Mercury 产品与技术架构全景图
    type: stack
    summary: 六层技术架构全景，涵盖客户前端体验、业务工作流、交易处理路由、总账同步、数据智能及风险工程体系。
    data:
      layers:
        - label: 客户体验与数字银行交互界面
          detail: 跨端 Web 与移动应用，向创始人及财务团队提供多主体财务全景穿透、精细权限管控与账户管理能力。
        - label: 金融工作流与自动化服务层
          detail: 集成化软件模块，实现供应商账单支付、应收账款开票、规则驱动审批流与薪酬发放全流程自动化。
        - label: 交易编排与底层支付通道
          detail: 支付路由与执行服务层，对接全美 ACH 本地清算网、实时 Fedwire 大额系统、支票清算所及银行卡清算网络。
        - label: 合作银行核心总账桥接层
          detail: 双向 API 连接网关，与 Choice Financial Group 及 Column N.A. 实时同步客户账户状态、资金余额与交易日记账。
        - label: 数据集成与财务软件同步
          detail: 实现与主流财务软件及大型企业资源规划（ERP）系统的自动化双向会计总账同步。
        - label: 风险工程、反欺诈机器学习与合规体系
          detail: 持续运行的机器学习流水线，涵盖实时反欺诈识别、交易风险打分、身份核验及监管合规监控。
    approximationNotes: 架构分层概念图，基于官方产品披露、招聘职位架构说明以及 BaaS 运营服务模型梳理构建。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE009
  - id: FU001
    title: 客户生命周期旅程与入驻漏斗全景图
    type: journey-map
    summary: 具象化创始人与初创企业从工商设立建档、对话式智能开户、多产品矩阵延伸，到个人银行深度协同的演进路径。
    data:
      items:
        - label: 公司设立与服务触达
          description: 创始人在特拉华州设立 C-corp 或 LLC；由 VC 合作渠道或同侪口碑推荐接触 Mercury。
          touchpoints:
            - VC 合作伙伴推荐
            - Mercury 官网门户申请
        - label: 对话式 KYC 开户流程
          description: 自适应 AI 引导式问答交互，结构化采集实际受益人、股权架构信息与自然语言业务描述。
          touchpoints:
            - 自适应叙述式主体尽调问卷
            - 自动化合规风险评分与分流
        - label: 核心账户激活启用
          description: 极速开立支票账户、储蓄账户并下发虚拟借记卡/信用卡，满足日常经营消耗支出。
          touchpoints:
            - 即时账户核验与核准
            - 虚拟卡即时发放与薪资代发系统打通
        - label: 多产品矩阵延伸增购
          description: 随资金体量扩张，客户逐步采纳 Treasury 现金管理归集账户、创投借贷及自动化账单支付。
          touchpoints:
            - 自动化资金收益管理
            - 多用户分级角色权限控制
        - label: 创始人个人银行业务交叉销售
          description: 将建立在企业端的高信赖度合作关系顺畅延伸至 Mercury Personal 个人消费银行账户。
          touchpoints:
            - Mercury Personal 专属直邀
            - 创始人个人与企业资金一体化控制台
        - label: 留存锁定与生态裂变推广
          description: 忠实客户口碑自发形成转介绍闭环，持续渗透新设立初创企业群体。
          touchpoints:
            - 社区转介绍激励机制
            - 供应商与开票支付网络双边互动
    approximationNotes: 阶段划分综合自 Perspective AI 客户研究报告与 Mercury 官方产品矩阵所披露的客户入驻与留存扩展飞轮。
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 针对已披露风险敞口、发生概率及缓解成熟度的定性评估视图，并非事故频率发生率量化模型。
    data:
      columns:
        - label: 影响程度
          detail: 故障或风险事件一旦发生可能导致的潜在后果
        - label: 发生可能性
          detail: 基于披露架构推断的定性敞口，非历史事件统计频率
        - label: 风险缓解成熟度
          detail: 选定证据源池中可查验的事实支撑力度
      rows:
        - label: 合作银行服务中断
          note: 合作银行业务分配比例与账户可迁移性未公开披露。
          values:
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 尚未核实
              tone: warning
        - label: 资产托管或交易执行中断
          note: Apex 与 Morgan Stanley 的服务职责已获披露。
          values:
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 部分具备
              tone: warning
        - label: 交易风控机制失效
          note: 当前招聘动态表明公司正加大对内控主导权的资源投入。
          values:
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 建设中
              tone: warning
        - label: 网络安全事件
          note: 应急预案已披露，但缺乏防护有效性验证证据。
          values:
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 尚未核实
              tone: warning
        - label: 关联产品利益冲突
          note: Form ADV 手册披露了激励机制及既定的利益冲突缓解措施。
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 已披露
              tone: neutral
        - label: 证据检索范围交叉污染
          note: 分配的检索结果中有四项涉及同名但不相关的第三方实体或概念。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 已识别
              tone: positive
    approximationNotes: 影响程度、发生概率与成熟度均为分析师定性分类；未获取到量化的事件概率、损失金额或经独立测试的控制得分数据。
