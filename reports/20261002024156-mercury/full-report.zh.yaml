      - number: '8.2'
        title: 融资历程、股权结构表演进与入场估值
        blocks:
          - type: paragraph
            body: >-
              Mercury 的累计资本运作历程呈现出各轮机构风投中稳步递增的估值跃升。商业数据库与二级市场追踪平台显示，公司在六轮机构融资中累计募集了 $546 million 至 $609.19 million
              的股权资金。公司 Series D 轮融资中，优先股发行定价为每股 $17.72，对应已发行股份 11,284,504 股，附带标准的 1.0 倍非参与型清算优先权、6.0% 非累积股息率，以及 1.0
              倍普通股转换比例。


              这种股权结构表展现出优异的治理控制力，几乎不存在高额清算优先权负担。在先前的 2025 年 3 月 Series C 轮融资中，Mercury 以每股 $12.93 发行 18,752,920 股，募集
              $242.55 million，投后估值 $3.5 billion，由 Sequoia Capital 领投，Coatue Management、Charles River Ventures（CRV）、Spark
              Growth Ventures、Andreessen Horowitz 及 Marathon 联合跟投。从 Series C 到 Series D 每股价格 37.0%
              的增幅，证明了公司在整个金融科技企业级软件估值倍数承压的大环境下，依旧拥有优异的估值抗跌性。


              以 $5.2 billion 投后估值对比 $650 million 年化营收，对应的隐含市销率（P/S）为 8.0 倍。横向对比未上市企业银行同业——例如 Capital One 于 2026 年 1 月以
              $5.15 billion 现金加股票方式收购的 Brex，以及 Ramp——当前估值倍数具备较强吸引力。Mercury 经受检验的连续四年盈利记录与可观的客户规模，构筑了纯成长型软件标的所不具备的安全边际。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
