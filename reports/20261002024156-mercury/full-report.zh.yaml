chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Mercury 由 Immad Akhund、Max Tagher 和 Jason Zhang 于 2017
              年创立，总部位于旧金山。其产品形态是一套以软件驱动、面向初创企业和小微企业的金融平台：独立报道涵盖支票账户、储蓄、借记卡、资金管理工具及账单支付，Mercury
              自身则将其定义为覆盖支付、开票、支出监控与现金流的更广泛运营底座。这一法律界定对尽调至关重要：Mercury 明确声明自身属于金融科技公司而非 FDIC 承保银行；目前其存款服务由 Choice
              Financial Group 和 Column N.A. 提供，IO Card 则由 Patriot Bank 发行。因此，该模式将软件自主权与对持牌合作银行的持续依赖结合在一起。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO010
              - CO011
