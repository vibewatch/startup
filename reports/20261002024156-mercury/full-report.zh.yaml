      - number: '7.2'
        title: 监管合规、法律诉讼与展业合规敞口
        blocks:
          - type: paragraph
            body: >-
              Mercury Advisory 作为 Mercury Technologies
              的全资子公司，负责运营受监管的注册投顾业务，因此投资者适当性管理、合规监督、台账归档、信息披露与利益冲突防范属于核心运营底线，而非边缘合规事务。2026
              年法定信息披露手册显示，当投资建议可能增加关联账户余额或使用频率时存在收入利益冲突，手册同时披露 Mercury Advisory
              为母公司的循环信贷额度提供了连带担保。该手册中虽未列出任何受纪律处罚记录，但这属于公司单方申报披露，并不能作为不存在任何潜在监管或诉讼调查的独立确证。相关法律协议进一步限制了组合推荐中所参考的信息维度，依赖客户自行维护信息时效。因此，在将披露情况视为定论之前，尽调团队需进一步调取
              Form ADV、FINRA 记录、监管问询函、客户投诉及司法诉讼检索进行全面交叉核验。
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR014
