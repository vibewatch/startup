            title: 投委会一票否决标准
            body: >-
              若合作银行、托管机构或清算通道受限且缺乏经测试的迁移方案；若重大交易或网络安全控制故障导致客户遭受资金损失；或监管核查发现反复出现的重大内控合规失效限制了核心产品展业，必须暂停投资决策或重新评估投资判断。应要求调阅底层文件及整改凭单，而不得仅凭当前有限信息池中未见公开负面事件便推定风险不存在。
