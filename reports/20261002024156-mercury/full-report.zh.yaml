      - number: '7.3'
        title: 运营、信息安全与内控执行
        blocks:
          - type: paragraph
            body: >-
              对投资决策影响最大的运营隐患，在于跨自动化交易系统与合作方托管基建的内控执行。Mercury 的公开手册指出，投资组合的再平衡依赖于包括亚马逊 AWS
              与资产托管机构在内的第三方供应商，一旦供应商服务宕机，可能导致再平衡操作彻底无法执行。手册同时将程序编写逻辑、底层代码及系统故障列为潜在交易错误的诱因，并将网络安全事件视作可能引发交易中断、敏感信息泄露、法律诉讼及监管问责的潜在源头。公司当前发布的招聘岗位正在招募一名负责人，统筹交易监控、异常对账、资金结算、监管申报、监管审计配合及内控合规留痕。该招聘启事虽不能确证内控薄弱，但将人员配置完备度、异常账挂账周期、对账质量及上线后压测确立为实质性的尽调焦点。样本池中目前未见既往故障历史或内控有效性评估记录。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
