              - CO015
              - CO016
      - number: '1.2'
        title: 领导层与公司治理
        blocks:
          - type: paragraph
            body: >-
              现有公开证据一致表明 Akhund、Tagher 与 Zhang 为创始团队成员，且此前均在 Heyzap 共事。Forbes 将 Akhund
              列为首席执行官兼联合创始人，但本轮尽调材料未列出当前董事会名单、委员会架构、创始人持股比例或投票权控制情况。材料亦未能独立核实 Tagher 与 Zhang
              当前的具体运营职务，因此高管表避免录入未获留存页面佐证的头衔。Akhund
              始终是融资、产品与银行牌照叙事的核心主导者，形成较为明显的关键人集中风险，但这属于分析维度的尽调审视重点，而非继任机制薄弱的确证。在得出明确治理结论前，仍需查阅董事会档案与组织架构图。
            claimRefs:
              - CO001
              - CO005
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.3'
        title: 资本历程、规模与股东结构
        blocks:
          - type: paragraph
            body: >-
              Mercury 宣布完成由 TCV 领投的 $200 million Series D 轮融资，估值达到 $5.2 billion，老股东 Andreessen
              Horowitz、Coatue、CRV、Sapphire Ventures、Sequoia Capital 及 Spark Capital
              悉数跟投。该轮融资与估值具备证据支撑，但确切的累计融资金额则无法证实。留存资料显示的融资总额各不相同，且指定信源未提供完整的股权融资时间表、债务条款、老股转让记录或股权结构表。运营规模数据同样主要来自公司自述。Mercury
              称其 2025 年 9 月年化营收达到 $650 million，客户数量突破 300,000 家，2025 年交易规模达 $248 billion。需注意，年化营收不等于
              ARR，交易规模不等于营业收入，融资金额不等于账面可用现金，且连续四年取得 GAAP 净利润与 EBITDA 盈利亦未披露具体利润率或现金生成能力。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
      - number: '1.4'
        title: 发展里程碑与监管牌照转型
        blocks:
          - type: paragraph
            body: >-
              发展轨迹显示，公司从 2017 年创立、2019 年上线企业账户，逐步演进为功能更全面的财务操作系统。截至 2025 年底，Mercury 报告了亮眼的营收与交易规模，将 Mercury Personal
              推广至更广泛客群，并着手申请全美银行牌照。2026 年 4 月，公司获得 OCC 关于设立 Mercury Bank, N.A. 的有条件批准；Mercury 明确表示，该银行正式开业前仍需取得 FDIC
              与美联储的补充审批以及 OCC 的最终许可。5 月的 Series D 轮融资与 9 月 Mercury Books
              的发布，同步充实了资本储备并拓宽了产品边界。由于指定样本库中缺乏对该转型过程进行独立评估的负面或监管信源，未检索到相关通报绝不能直接等同于合规、宕机或合作方风险不存在。
