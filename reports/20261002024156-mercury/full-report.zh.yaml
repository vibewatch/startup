      - number: '7.4'
        title: 核心依赖、缓解措施与投资逻辑破灭触发条件
        blocks:
          - type: paragraph
            body: >-
              Mercury 自身的公开披露显示，Apex 是 Direct Treasury 及 Invest 账户的指定托管商，摩根士丹利（Morgan Stanley）为 Treasury Solutions
              的托管商及资产组合管理人，Choice Financial Group 与 Column 则为底层银行业务服务提供商。这种合作架构虽分散了持牌金融职能，但也带来了 Mercury
              无法完全掌控的业务交接断点与外部交易对手。风险化解成效高度依赖经过实战检验的容灾方案、合同服务级别协议（SLA）、备用供应商矩阵、对账闭环，以及线上风控审查真实生效的客观凭证。尽调应重点跟踪合作方集中度、未结未平账目、结算失败率、监管报表逾期、影响客户的运营事故、外部审计反复指出的缺陷，以及银行或托管合作关系的任何异动。若出现合作关系终止且缺乏可行迁移通道、实质性内控失控，或是遭遇监管限制导致核心资金划转受阻，在完成实质整改并获得独立核验之前，均应直接视为投资逻辑破灭事件。
