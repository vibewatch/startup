              申请全美银行牌照，并向 FDIC 申请联邦存款保险，旨在将资产负债表收益全面内部化，消除中间件脆弱性。同时，竞对基准测试暴露了部分运营摩擦：竞品平台资金管理活期收益率介于 3.65% 至 4.24% APY
