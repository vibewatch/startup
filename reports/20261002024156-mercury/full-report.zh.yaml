          date: '2017'
          detail: Immad Akhund、Max Tagher 与 Jason Zhang 在旧金山联合创办 Mercury。
          tone: neutral
        - label: 上线企业账户
          date: '2019'
          detail: 留存第三方资料将 Mercury 首款企业账户上线时间定于 2019 年。
          tone: neutral
        - label: C 轮融资
          date: 2025-03
          detail: 留存第三方资料显示公司完成 $300M C 轮融资，投后估值 $3.5B。
          tone: positive
        - label: 年化营收突破节点
          date: 2025-09
          detail: Mercury 披露年化营收达 $650M；该指标并非年度经常性收入（ARR）。
          tone: positive
        - label: 拓展 Mercury Personal 业务
          date: 2025-12
          detail: 《福布斯》报道 Mercury Personal 个人业务正式面向公众全面开放。
          tone: neutral
        - label: 获 OCC 有条件批复
          date: 2026-04
          detail: Mercury 获准有条件筹建 Mercury Bank, N.A.，后续仍需满足相关最终审批要件。
          tone: neutral
        - label: D 轮融资
          date: 2026-05
          detail: Mercury 宣布完成由 TCV 领投的 $200M D 轮融资，估值达 $5.2B。
          tone: positive
        - label: 推出 Mercury Books
          date: 2026-09
          detail: Mercury 推出深度集成的复式记账软件，支持 AI 辅助自动化工作流。
          tone: positive
    approximationNotes: 仅在存留证据明确提供具体月份处标注文档时间；未对未披露日期进行推断。
    claimRefs:
      - CO001
