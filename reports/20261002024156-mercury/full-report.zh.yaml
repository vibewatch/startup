              Mercury 的商业化主要依靠三条核心收入渠道：客户存款产生的净息差、企业卡刷卡手续费分成，以及财务自动化工作流的软件订阅费。其变现根基在于存放在合作银行网络中约 $20 billion 的客户存款盘子，这使得
              Mercury 在当期利率环境下能够捕获可观利差。在交易流变现端，Mercury 发行提供 1.5% 返现且免个人担保的 IO
              企业信用卡，通过商户刷卡手续费获取收益。为减少对资产负债表利息收入的单一依赖，Mercury 推出涵盖自动化开票、全球账单支付与财务运营的软件模块，定价在每月 $35 至 $350
              不等。基础商业支票与储蓄账户依然免收账户维护费和境内电汇费，而存款超过 $250,000 的大额客户则可通过 Tea Room 权益享受专属客服及资金管理服务。
