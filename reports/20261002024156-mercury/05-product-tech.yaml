    data:
      layers:
        - label: "Client Experience & Digital Banking UI"
          detail: "Responsive web and mobile applications providing founders and finance teams multi-entity financial visibility, permission controls, and account management."
        - label: "Financial Workflow & Automation Services"
          detail: "Integrated software modules automating vendor bill payment, accounts receivable invoicing, rule-based approval chains, and payroll disbursement."
        - label: "Transaction Orchestration & Payment Rails"
          detail: "Payment routing and execution services interfacing with domestic ACH networks, real-time Fedwire, check clearinghouses, and card networks."
        - label: "Partner Bank Core Ledger Bridge"
          detail: "Bi-directional API connectors synchronizing customer account states, balances, and transaction journals with Choice Financial Group and Column N.A."
        - label: "Data Integration & Accounting Synchronization"
          detail: "Automated two-way ledger synchronization with major accounting platforms and enterprise enterprise resource planning (ERP) systems."
        - label: "Risk Engineering, Fraud ML & Compliance"
          detail: "Continuous machine learning pipelines for fraud detection, transaction risk scoring, identity validation, and regulatory compliance monitoring."
