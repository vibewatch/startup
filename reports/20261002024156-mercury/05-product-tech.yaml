callouts:
  - calloutType: "insight"
    title: "The Decoupled Core Architecture Advantage and Constraint"
    body: "Mercury's technical architecture decouples the customer-facing software experience from regulated banking infrastructure. By integrating with Choice Financial Group and Column N.A., Mercury focuses engineering velocity on financial operations workflows, UI design, and fraud modeling without managing a regulated bank core. However, this structure creates an unavoidable architectural boundary: ultimate settlement, transaction finality, and deposit custody remain dependent on partner bank API availability, uptime, and regulatory compliance frameworks."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE010"
