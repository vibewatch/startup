- calloutType: insight
  title: Deposit Diversification and Multi-Homing Mitigate Direct Churn
  body: Rather than entirely replacing Mercury, growing venture-backed companies increasingly adopt a multi-homing architecture.
    Startups maintain Mercury for operational money movement, founder-friendly software workflows, and developer APIs while
    establishing secondary accounts with spend platforms or traditional commercial institutions to safeguard excess treasury
    holdings.
  claimRefs:
  - CP001
  - CP007
  - CP011
  - CP015
- calloutType: risk
  title: Margin Pressure from Zero-Fee Spend Platforms and Yield Demands
  body: As corporate spend management platforms eliminate user fees and offer integrated commercial banking, Mercury's effort
    to monetize premium software tiers faces resistance from founders who expect core back-office tooling to remain free or
    subsidized by interchange.
