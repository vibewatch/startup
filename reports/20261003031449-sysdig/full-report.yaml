    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions & Operating Drivers
      - Implied Valuation Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Runtime AI security agent adoption surges; ARR reaches $350M+ with >120% NRR; platform consolidates enterprise
          runtime standard.
        - >-
          $2.5B - $3.2B valuation (7.0x - 9.0x ARR multiple); successful public offering or strategic acquisition by
          platform buyer.
        - >-
          Failure of AI agent monetization; aggressive runtime feature bundling by Microsoft Azure, AWS, and Google
          Cloud.
        - 25% - High technical barrier to entry and customer loyalty in highly regulated containerized deployments.
      - - Base Case
        - >-
          Moderate 15%-20% ARR expansion supported by indirect reseller channels; retention stabilizes around 110%; cash
          breakeven reached.
        - >-
          $1.1B - $1.5B valuation (4.5x - 5.5x ARR multiple); private holding period with eventual secondary
          recapitalization.
        - >-
          Extended enterprise procurement cycles and price discounting against consolidated CNAPP security suite
          offerings.
