      - number: '3.3'
        title: Capability Matrix, Commercial Packaging, and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >
              Evaluating technical capabilities across buying criteria reveals Sysdig's structural advantage in active
              runtime defense contrasted with commercial opacity in procurement cycles. In vulnerability management,
              Sysdig's Risk Spotlight leverages runtime telemetry to identify whether vulnerable packages are actually
              loaded or executed in production, filtering out up to 95% of static vulnerability noise. Competitors
              without kernel-level sensors must present entire container image vulnerability queues to engineering
              teams, causing acute triage fatigue. In Kubernetes posture and runtime detection, Sysdig's Falco-based
              eBPF probes provide granular command, network, and process trees that agentless tools cannot capture.


              Commercial terms and packaging models diverge sharply across the competitive spectrum. Sysdig Secure
              utilizes customized enterprise pricing based on monitored host compute counts, connected cloud accounts,
              and log ingestion volume, requiring direct sales engagement rather than publishing transparent public
              tiers. Commercial reviews from Work-Management highlight that this lack of upfront pricing transparency
              complicates early-stage budget comparisons. In contrast, alternative machine learning and analytics
              platforms such as DataRobot publish six-figure enterprise floors ($100,000/year), illustrating enterprise
              SaaS tendencies toward gated enterprise quotes. In cloud infrastructure evaluations, buyers face complex
              licensing structures that escalate rapidly as container node density increases.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
