  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Adjacencies
        blocks:
          - type: paragraph
            body: >
              The cloud-native application protection platform (CNAPP) sector consolidates previously fragmented
              security disciplines, including container security, cloud security posture management (CSPM), cloud
              workload protection platforms (CWPP), and cloud infrastructure entitlements management (CIEM). Sysdig
              bounds its core value proposition around runtime threat detection and live workload visibility powered by
              the CNCF-graduated Falco engine. Rather than competing exclusively as a static configuration auditing
              console, Sysdig positions runtime truth as the primary mechanism to filter vulnerability backlogs and
              catch active adversary execution in distributed container and Kubernetes environments.


              The boundary of spend explicitly encompasses enterprise tooling for container behavioral monitoring,
              Kubernetes admission control, host and image scanning, runtime detection and response (CDR), and
              continuous audit-ready regulatory compliance. Adjacent categories that intersect but remain distinct from
              core CNAPP workloads include traditional endpoint detection and response (EDR), security information and
              event management (SIEM), and standalone observability platforms. While Sysdig offers Sysdig Monitor as a
              complementary metrics solution, enterprise cloud security budgets are managed through dedicated
              cybersecurity allocations governed by CISOs and SecOps leadership rather than IT operations line items.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing Lenses and Sizing Trajectories
        blocks:
          - type: paragraph
            body: >
              Sizing the market for cloud workload and runtime security requires evaluating multiple demand lenses
              across macro infrastructure transition, workload-specific container expansion, and vendor-addressable
              runtime defense. Broad analyst frameworks emphasize rapid workload migration: historical projections from
              451 Research anticipated the cloud-enabling technology market expanding to $39.6B with container software
              growing at a 40% CAGR, while Gartner research projected 70% of enterprise workloads deployed in cloud
              infrastructure and platform services. However, top-line cloud expansion figures fail to isolate the
              operational subset dedicated to runtime threat protection.


              A constrained addressable market lens evaluates the universe of enterprises operating distributed,
              multi-cloud containerized estates. With modern enterprise security tooling budgets ranging from $100K to
              over $500K annually per enterprise, and per-host runtime monitoring costs spanning $50 to $100 monthly for
              Sysdig Secure, the serviceable addressable market (SAM) concentrates heavily in Kubernetes-heavy
              enterprises across technology, financial services, healthcare, and digital retail. In contrast,
              organizations running static or lift-and-shift virtual machine workloads opt for lighter agentless posture
              scanners, establishing a clear ceiling on Sysdig's immediate serviceable market.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
