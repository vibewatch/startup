      - number: '7.2'
        title: Operational, Architectural, and AI Workload Security Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Sysdig's competitive positioning hinges upon continuous runtime monitoring via kernel-level
              system-call inspection. Historically, runtime security tools focused on cloud-native container workloads,
              but enterprise adoption of autonomous AI agents and large language model (LLM) workloads introduces
              operational failure modes that traditional cloud-dependent architectures struggle to mitigate. Adversarial
              technical analyses indicate that AI agent runtime attacks, such as prompt injection and Model Context
              Protocol (MCP) tool poisoning, execute in live memory rather than at static scan time. Competitor
              benchmarks emphasize that cloud-dependent CNAPP architectures experience visibility gaps in self-hosted,
              on-premises, or air-gapped GPU clusters where remote SaaS connectivity is restricted or unavailable.
              Concurrently, executive commentary highlights that enterprise AI governance remains uncoordinated, with
              internal employees testing third-party tools outside centralized monitoring boundaries. Within Sysdig's
              internal organization, leadership turnover and historical headcounts—reported between 501 and 1,000
              employees alongside prior restructuring cuts—place operational strain on customer onboarding and ongoing
              engineering maintenance. If Sysdig fails to deliver low-overhead, offline-capable runtime enforcement
              across diverse multi-cloud environments, enterprise security teams risk alert fatigue and bypassed
              controls.
            claimRefs:
              - CR006
              - CR007
              - CR008
