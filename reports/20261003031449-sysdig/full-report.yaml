        title: Exhibits
        blocks:
          - type: callout
            title: Open Source Monetization and Platform Bundling Barrier
            body: >-
              Falco's Apache 2.0 license empowers major cloud platform providers to package and distribute the core
              runtime system-call engine without paying Sysdig licensing fees. Unless Sysdig consistently demonstrates
              superior value through proprietary threat intelligence feeds, managed SaaS capabilities, and agentic
              remediation workflows, commodity bundling by hyperscalers represents a structural barrier to long-term
              software margin expansion.
            calloutType: risk
            claimRefs:
              - CR005
              - CR012
          - type: callout
            title: Private Valuation Mark Disconnect and Exit Horizon Uncertainty
            body: >-
              Sysdig has not completed a primary equity round since its $350 million Series G at a $2.5 billion
              valuation in December 2021. With audited metrics for 2026 unverified and tech-sector growth multiples
              compressing since late 2021, the company faces potential liquidity friction and liquidation preference
              overhang unless private market growth or public IPO conditions validate its historical headline valuation.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Sysdig centers on its differentiated runtime-first security paradigm and
              deep systems engineering moats. Unlike pure-play cloud security posture management (CSPM) vendors that
              evaluate static configuration states and theoretical exposure, Sysdig inspects live kernel system calls
              via eBPF probes and kernel modules, providing definitive visibility into what code is actively executing
              in enterprise Kubernetes and multi-cloud container workloads. This architectural foundation, created by
              Loris Degioanni and cemented through the Cloud Native Computing Foundation graduation of Falco, delivers
              unmatched signal-to-noise ratios, reducing operational alert fatigue for enterprise security operations
              centers and mission-critical public sector deployments such as India's Unique Identification Authority
              (Aadhaar). Furthermore, the company's recent expansion into headless programmatic APIs and autonomous AI
              security agents positions Sysdig to secure agentic developer workflows at machine speed.


              Conversely, the anti-thesis highlights structural enterprise headwinds, competitive consolidation, and
              licensing defensibility risks. Because Falco is distributed under a permissive Apache 2.0 license, major
              cloud hyperscalers (AWS, Azure, Google Cloud) and incumbent security giants (Palo Alto Networks,
              CrowdStrike) can freely embed the core open-source detection engine into native managed offerings without
              establishing a commercial relationship with Sysdig. While Sysdig monetizes proprietary managed rule feeds,
              CIEM, posture management, and compliance tooling under Sysdig Secure, larger cybersecurity platform
              vendors continue to bundle agentless vulnerability scanning and container security directly into
              enterprise enterprise agreements, creating severe pricing pressure. Moreover, private market disclosures
              through Forge Global indicate significant valuation markdown from $2.5B down to $1.1B in July 2026,
              reflecting the multiple compression impacting growth-stage software infrastructure that lacks audited
              revenue run rates.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
