      - number: '5.3'
        title: Product Modules, Deployment, and Ecosystem Integration
        blocks:
          - type: paragraph
            body: >-
              Sysdig divides its commercial portfolio into modular capabilities spanning container security, compliance,
              infrastructure monitoring, and AI investigation [CE001, CE002, CE009]. Core product modules include Sysdig
              Secure for runtime threat detection, vulnerability prioritization, and compliance scanning, alongside
              Sysdig Monitor for cloud infrastructure metrics and Prometheus dashboarding [CE007, CE009]. In shift-left
              workflows, Sysdig provides inline container scanners and CI/CD integration plugins for Jenkins and GitHub
              Actions that evaluate container images against security policies and emit standard SARIF vulnerability
              reports before images are pushed to production registries [CE010]. Enterprise operations ingest runtime
              policy alerts into central log analytics through standardized data schemas mapped to the Google Security
              Operations Unified Data Model (UDM) [CE006]. While Sysdig manages commercial Falco Feeds and enterprise
              platform governance, Falco's Apache 2.0 license permits competing vendors or public cloud providers to
              embed the open-source detection engine directly, making platform integration depth and proprietary threat
              research the primary commercial differentiators [CE002].
            claimRefs:
              - CE001
