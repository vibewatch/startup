      - number: '5.2'
        title: Operating Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >-
              The core technical architecture of Sysdig Secure is founded on Falco, an open-source runtime threat
              detection engine created by Sysdig and contributed to the Cloud Native Computing Foundation (CNCF), where
              it graduated in 2024 [CE002, CE003]. Workload observability is achieved at the Linux kernel boundary
              through modern extended Berkeley Packet Filter (eBPF) probes or loadable kernel modules, capturing system
              call streams without necessitating source-code modifications [CE003, CE004]. In the SaaS control plane,
              Sysdig maintains distributed microservices utilizing Java, Golang, and Python backend components,
              alongside managed Prometheus telemetry engines within Sysdig Monitor [CE007, CE009]. In 2026, Sysdig
              expanded its delivery model with headless cloud security interfaces and Sysdig Secure AI, exposing runtime
              telemetry via model context protocol (MCP) services and RESTful APIs to allow autonomous agents and
              automated pipelines to ingest findings directly [CE002, CE009]. Platform security events are streamed to
              third-party SIEM and data-analytics platforms such as Google Security Operations and Sumo Logic via
              authenticated webhooks and structured JSON feeds [CE006, CE008].
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
