  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Open-Source Governance Risks
        blocks:
          - type: paragraph
            body: >-
              Sysdig operates as a security platform processing telemetry across complex multi-cloud and
              multi-jurisdictional enterprise infrastructures. In its published global privacy posture, the company
              explicitly acts as both an independent data controller and a customer data processor or service provider.
              Under international data privacy frameworks, Sysdig maintains certified adherence to the EU-U.S. Data
              Privacy Framework and the UK Extension to the EU-U.S. Data Privacy Framework, while facilitating
              international data transfers and processing across facilities in the United States, European Union, United
              Kingdom, Costa Rica, Canada, India, Serbia, and Japan. Operating cross-border telemetry collection exposes
              Sysdig to compliance scrutiny under GDPR, CCPA, and regional sovereignty rules if sensitive personal data
              or network credentials inadvertently leak into system-call logging streams. Furthermore, Sysdig's core
              threat detection engine, Falco, is governed as a graduated open-source project by the Cloud Native
              Computing Foundation under an Apache 2.0 license. While community stewardship provides vendor neutrality,
              the Apache 2.0 licensing model grants major cloud hyperscalers and competing platform vendors the legal
              right to incorporate and ship the underlying Falco detection engine without maintaining any paid
              commercial relationship with Sysdig, creating an ongoing intellectual property and monetization barrier.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
