      - number: '5.4'
        title: Differentiation, Governance, and Product Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Sysdig differentiates its technical stack from agentless CNAPP competitors through deep kernel-level
              visibility that identifies in-use, exploitable vulnerabilities rather than theoretical risks [CE001,
              CE004]. To uphold software development lifecycle integrity, Sysdig applies its own security scanning tools
              internally and maintains private branches of critical open-source components before customer delivery
              [CE010]. Enterprise trust controls include historical SOC 2 Type II attestations and automated
              vulnerability policy evaluation on hardened operating systems such as Bottlerocket [CE002, CE008].
              Nonetheless, technical diligence highlights significant platform dependencies: runtime system-call
              interception introduces deployment friction in restricted container environments, agentless competitors
              bypass kernel agent maintenance, and public access to current external security audit reports remains
              gated [CE002, CE005]. Furthermore, technical writing and developer hiring requisitions across 2025 and
              2026 underscore ongoing platform maintenance demands across multi-cloud integrations [CE007, CE011].
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
