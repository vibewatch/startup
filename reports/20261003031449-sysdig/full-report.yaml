      - number: '8.2'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Sysdig's capital capitalization history reflects the broader valuation trajectory of enterprise cloud
              infrastructure across the 2020 to 2026 market cycles. In December 2021, Sysdig announced a landmark $350
              million Series G round led by Permira's growth fund with participation from Guggenheim Investments and
              long-term venture backers Accel, Bain Capital Ventures, DFJ Growth, Goldman Sachs, and Insight Partners,
              achieving a headline post-money valuation of $2.5 billion. At the time, the company reported rapid
              expansion including an annualized net revenue retention rate of 149% and an average ARR exceeding $875,000
              across its top 50 purchasing accounts, with total equity capital raised reaching $744 million.


              However, between 2022 and 2025, no subsequent primary venture rounds were publicly confirmed, and market
              conditions for enterprise cloud security shifted toward vendor consolidation and capital efficiency. In
              July 2026, private transaction and capitalization records published on Forge Global disclosed a $101.51
              million Series X financing round priced at $6.89 per share across 14,722,466 shares, establishing a
              post-money valuation mark of $1.1 billion. This represents a 56% contraction from the December 2021 peak
              price of $16.23 per share, bringing total cumulative funding to $831.28 million. The transaction structure
              demonstrates a standard 1.0x non-participating liquidation preference, indicating that while existing
              common equity holders have experienced meaningful dilution, the capital structure avoids punitive
              structured overhangs. Nevertheless, public disclosures regarding ongoing cash burn, gross margins, and
              actual audited ARR remain private, necessitating strict entry discipline for growth-stage equity
              investors.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
