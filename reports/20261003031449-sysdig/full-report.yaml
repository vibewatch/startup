              - CE003
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Buyer Personas and Workload Segmentation
        blocks:
          - type: paragraph
            body: >
              Sysdig's commercial enterprise footprint spans three core customer constituencies: central security teams
              (CISOs and SecOps directors), cloud platform engineering organizations, and distributed DevOps
              practitioners managing containerized production services. Enterprise procurement is predominantly driven
              by centralized security budgets seeking unified Cloud-Native Application Protection Platform (CNAPP)
              capabilities that combine runtime detection with posture compliance.


              Buyer requirements vary significantly by infrastructure scale and regulatory exposure. Highly regulated
              sectors, including financial services and public sector entities, adopt Sysdig to address compliance
              regimes such as PCI-DSS and HIPAA across ephemeral container environments. Mid-market and cloud-native
              commercial buyers frequently encounter Sysdig via developer adoption of open-source Falco, transitioning
              into commercial Sysdig Secure contracts as cluster footprints expand across AWS, Azure, GCP, and private
              cloud deployments.
