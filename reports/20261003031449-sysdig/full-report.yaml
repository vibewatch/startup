      - number: '2.3'
        title: Buyer Personas, Procurement Economics, and Contracting Dynamics
        blocks:
          - type: paragraph
            body: >
              Procurement of runtime security platforms involves cross-functional alignment between security executives
              and platform engineering leadership. The primary economic buyer is typically the Chief Information
              Security Officer (CISO) or VP of Security Operations, who controls annualized cybersecurity software
              budgets between $100,000 and $500,000+ for enterprise infrastructure defense. The daily practitioners and
              evaluators, however, comprise DevSecOps engineers, site reliability engineers (SREs), and platform
              architects who suffer from alert fatigue and operational friction in CI/CD deployment pipelines.


              Commercial agreements reflect infrastructure volume and licensing tiers rather than traditional per-seat
              enterprise SaaS seats. Transaction benchmarking from Vendr reveals that Sysdig contracts typically price
              between $50 and $100 per host per month for Sysdig Secure, scaling to $150,000 to $400,000 annual contract
              values for mid-market estates monitoring 500 to 2,000 hosts. Enterprise expansion is driven primarily by
              net revenue retention (NRR) and account-level infrastructure growth: targeting enterprise buyers with
              dedicated security teams allowed Sysdig to expand contract sizes by 36% through refined Ideal Customer
              Profile (ICP) alignment.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Structural Friction, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Adoption velocity in cloud workload defense is propelled by the accelerating complexity of cloud-native
              attack paths and strict regulatory compliance requirements such as PCI-DSS, HIPAA, and NIST. As
              enterprises expand ephemeral container deployments, static image scanning surfaces thousands of
              theoretical vulnerabilities, creating severe operational friction between developers and security teams.
              Runtime observability addresses this bottleneck by correlating live system calls with CVE data, enabling
              organizations to eliminate up to 95% of vulnerability triage noise and isolate actively running risks.


              Conversely, adoption encounters material structural headwinds. Enterprise implementation requires
              installing eBPF probes or kernel modules across production clusters, introducing technical deployment
              friction, ongoing policy tuning, and operational overhead that agentless posture management vendors
              exploit in competitive sales cycles. Furthermore, because Falco is Apache 2.0 open-source software, cloud
              service providers and commercial rivals can integrate core detection logic without commercial licensing,
              exerting downward pressure on proprietary pricing power. Key diligence gaps remain regarding verified
              enterprise ARR, standalone product gross margins, and customer cohort churn rates.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Runtime Context as a Procurement Filter
            body: >-
              Enterprise buyers increasingly reject standalone posture scanning tools that generate thousands of
              unprioritized configuration alerts. Sizing Sysdig's opportunity depends on enterprise migration toward
              runtime-correlated vulnerability management, where live execution data reduces triaged alerts by up to
              75%.
            calloutType: insight
            claimRefs:
              - CM004
              - CM013
          - type: callout
            title: Open-Source Monetization and Platform Bundling Constraints
            body: >-
              Because Sysdig's underlying Falco detection engine is governed by the CNCF under an Apache 2.0 license,
              major cloud hyperscalers and competing CNAPP vendors can incorporate Falco rule logic without licensing
              Sysdig's commercial platform, creating persistent pricing resistance.
            calloutType: risk
            claimRefs:
