      - number: '7.3'
        title: Partner Ecosystem and Capital Trajectory Risks
        blocks:
          - type: paragraph
            body: >-
              Sysdig's commercial expansion is heavily intertwined with third-party channel ecosystems and hyperscaler
              marketplace distribution. Following its December 2021 Series G financing, Sysdig committed to an indirect
              sales strategy mandating that all commercial transactions outside the Global 500 flow through channel
              partners, value-added resellers, and regional integrators such as its solution partnership with Kafein
              Yazilim. While this channel-first posture lowers direct sales overhead in mid-market accounts, it creates
              acute commercial dependencies on distributor execution, co-selling agreements, and cloud platform
              integrations across Amazon Web Services, Google Cloud Platform, Microsoft Azure, IBM Cloud, and SUSE
              Rancher. Financially, Sysdig has raised $744 million in aggregate equity capital, anchored by its December
              2021 post-money valuation mark of $2.5 billion. However, the company has operated without raising primary
              capital since that round, and management has not published audited financial statements confirming annual
              recurring revenue, gross margins, cash burn rate, or net revenue retention for 2026. Without verifiable
              public financial disclosures or an active S-1 filing, investors must monitor whether indirect channel
              velocity sufficiently mitigates private market down-round exposure and liquidity timing risks.
            claimRefs:
