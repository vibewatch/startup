              - CV006
              - CV010
              - CV012
      - number: '8.3'
        title: Scenario Analysis, Exit Readiness, and Diligence Framework
        blocks:
          - type: paragraph
            body: >-
              To model potential risk-adjusted outcomes for Sysdig over a 36-month investment horizon, we evaluate bull,
              base, and bear operating cases grounded in market adoption dynamics and valuation multiple benchmarks. In
              the bull case, enterprise adoption of agentic AI workloads and real-time runtime governance accelerates
              demand for kernel-level eBPF instrumentation, enabling Sysdig to expand ARR beyond $350 million with
              sustained >120% net retention, commanding an exit valuation between $2.5 billion and $3.2 billion
              (7.0x–9.0x forward ARR) through either a strategic acquisition by a platform vendor (e.g., Cisco, Google
              Cloud) or an independent public listing once IPO windows reopen.


              In the base case, Sysdig maintains defensible positions in regulated enterprise accounts (financial
              institutions, government identity infrastructure) and expands via managed partner channels, generating
              moderate 15%–20% annual top-line expansion while sustaining breakeven free cash flow. Under prevailing
              software infrastructure trading multiples of 4.5x–5.5x forward ARR, the base case implies an enterprise
              valuation range of $1.1 billion to $1.5 billion, roughly aligned with its current Series X post-money
              valuation. In the bear case, continued bundling of cloud detection by hyperscalers and dominant platform
              vendors erodes Sysdig's net new customer acquisition velocity, reducing net retention below 100% and
              forcing secondary markdowns toward $600 million to $800 million (2.5x–3.5x ARR), triggering potential
              recapitalization or distressed consolidation.


              Prudent investment underwriting mandates resolving key analytical gaps prior to capital allocation.
              Crucial diligence priorities include auditing confidential ARR scale, calculating cohort-level gross
              margin and customer acquisition payback periods, verifying the extent of customer overlap with Wiz and
              Palo Alto Networks, and monitoring enterprise adoption of newly introduced headless and agentic security
              modules.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Decision Framework: Track at Fair Value'
            body: >-
              Sysdig is classified as a 'track' opportunity with a 'fair' valuation stance at its implied $1.1B Series X
              post-money valuation mark. While the company possesses premier runtime telemetry and deep enterprise
              penetration across regulated sectors, the lack of audited financial disclosures and intense competitive
              pressure from broader cybersecurity platforms warrant holding off on primary equity commitments until
              verified ARR growth and margin trajectories are confirmed.
            calloutType: recommendation
            claimRefs:
