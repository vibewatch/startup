        - >-
          Recognized CNAPP leader and Forrester Wave Leader with specialized reputation across Kubernetes and container
          workloads.
        - >-
          Enterprises increasingly favor consolidated cybersecurity platforms (Wiz, Palo Alto, CrowdStrike) over point
          runtime solutions.
        - >-
          Platform vendors achieve parity in kernel-level container telemetry without degrading cluster stability or
          developer velocity.
      - - Customer Adoption
        - >-
          Secures mission-critical enterprise accounts including India's UIDAI (Aadhaar), Worldpay, Mambu, and major
          regulated institutions.
        - >-
          Top-50 customer ARR exceeds $875k, but long-tail self-service and mid-market expansion remains constrained by
          deployment complexity.
        - >-
          Evidence of material logo churn or ARR contraction among core Global 2000 customers migrating to bundled
          suites.
