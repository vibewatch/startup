      - number: '6.3'
        title: Named Production Proof, Reference Quality, and Competitive Discontent
        blocks:
          - type: paragraph
            body: >
              Enterprise customer evidence demonstrates verified production deployments across mission-critical
              environments. Key named references include Apree Health, which standardized on Sysdig as its exclusive
              Kubernetes security platform for vulnerability management and cluster compliance, and major sovereign
              entities such as India's Unique Identification Authority (UIDAI), which selected Sysdig through an open
              public tender. Further enterprise references across payment processing and digital banking validate
              runtime Falco efficacy.


              Nevertheless, customer satisfaction and expansion dynamics reveal structural competitive friction.
              Independent analysis highlights that while Sysdig excels at kernel-level threat detection, enterprise SOC
              teams experience operational bottlenecks around vulnerability triage and automated remediation.
              Competitors such as Wiz and Orca exploit this friction with frictionless agentless posture graphs,
              challenging Sysdig's agent-based daemonset architecture during procurement renewals and driving evaluation
              of remediation-first alternatives.
