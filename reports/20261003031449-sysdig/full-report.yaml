      - - Bear Case
        - >-
          ARR stagnates below $200M as enterprises migrate to bundled platform suites; NRR slips below 95%; continued
          workforce restructuring.
        - >-
          $600M - $800M valuation (2.5x - 3.5x ARR multiple); distressed sale or defensive liquidation preference
          execution.
