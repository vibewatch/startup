      - number: '6.2'
        title: Adoption Trajectory, Deal Sizing, and Channel Scaling
        blocks:
          - type: paragraph
            body: >
              Commercial momentum historically benefited from rapid cloud containerization, with annualized revenue run
              rate tripling over twelve-month expansion cycles and net revenue retention reaching 149% among enterprise
              accounts prior to market consolidation. Large-scale enterprise spending demonstrates high account value
              concentration, with the top 50 purchasing customers averaging over $875,000 in annual recurring revenue.


              However, contemporary customer expansion increasingly relies on indirect channel ecosystems rather than
              direct enterprise outbound motions. Sysdig transitioned all commercial transactions outside the Global 500
              to certified reseller and systems integration partners. Global systems integrators such as Tech Mahindra
              package Sysdig into managed cloud migration and DevSecOps transformation practices, providing turnkey
              posture assessment and runtime protection. Despite this ecosystem reach, overall active customer count and
              net retention disclosures remain unverified on a contemporary run-date basis.
