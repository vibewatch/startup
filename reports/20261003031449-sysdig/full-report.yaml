      - number: '3.2'
        title: Competitor Profiles, Scale, and Core Architectural Tradeoffs
        blocks:
          - type: paragraph
            body: >
              Detailed benchmarking across core alternatives highlights distinct trade-offs across deployment overhead,
              visibility depth, and total cost of ownership. Wiz represents the primary commercial threat in broad
              enterprise cloud security RFPs, leveraging frictionless read-only cloud integrations, attack-path
              graphing, and unified multi-cloud dashboards to capture procurement favor among CISOs seeking rapid
              enterprise-wide coverage. However, independent vendor reviews from Charting Cyber and Work-Management
              emphasize that Wiz exhibits relative weakness in live container runtime threat detection, relying
              primarily on scheduled snapshot audits rather than continuous system-call interception.


              Direct container peer Aqua Security shares open-source roots with Sysdig and delivers comparable container
              workload protection capabilities, but differs across software supply chain and application security
              packaging. Palo Alto Networks' Prisma Cloud offers comprehensive suite-level CNAPP capabilities spanning
              infrastructure-as-code, posture, and runtime, yet enterprise feedback frequently cites operational sprawl,
              complex multi-module licensing, and heavy administrative overhead. Meanwhile, RFP.wiki benchmarking scores
              Sysdig at 4.6 out of 5 based on 609 reviews (#7 of 17 in CSPM), trailing specialized posture suites like
              Netskope (5.0 score, 802 reviews) and Tenable (5.0 score, 1,457 reviews) on pure configuration breadth
              while outperforming on containerized workload instrumentation.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
