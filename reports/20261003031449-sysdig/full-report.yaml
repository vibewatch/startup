    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Open-Source Foundations
        blocks:
          - type: paragraph
            body: >-
              Sysdig, Inc. is a cloud security and Kubernetes observability vendor headquartered in San Francisco,
              California, founded in 2013 by Loris Degioanni, who previously co-created the foundational open-source
              network protocol analyzer Wireshark. The company commercializes a cloud-native application protection
              platform (CNAPP) centered on runtime threat detection, system call inspection, and container security,
              deriving its primary architectural moat from the open-source Falco project and eBPF-driven runtime
              intelligence. Sysdig operates as a venture-backed late-stage enterprise software firm selling SaaS
              subscriptions across North America, Europe, and Asia-Pacific. While open-source adoption and runtime
              instrumentation provide strong developer affinity, third-party benchmarks evaluate its market
              defensibility as contested given increasing competition from agentless cloud security vendors and
              incumbent platform consolidators.
