              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview and Market Segmentation
        blocks:
          - type: paragraph
            body: >
              The competitive arena for cloud-native application protection platforms (CNAPP) is defined by a
              fundamental architectural divide between runtime-first workload protection and agentless configuration
              posture management. Sysdig anchors its competitive positioning in runtime detection and deep container
              observability, tracing its lineage directly to the open-source Falco engine graduated by the Cloud Native
              Computing Foundation (CNCF). In enterprise evaluations, Sysdig confronts four distinct competitor
              categories: high-velocity agentless posture specialists such as Wiz and Orca Security; multi-product
              enterprise platform consolidators including Palo Alto Networks (Prisma Cloud) and CrowdStrike Falcon Cloud
              Security; direct container security peers like Aqua Security; and status-quo open-source or internal
              builds relying directly on standalone Falco and cloud-provider native tooling.


              Market segmentation reflects buyer priorities regarding operational friction versus defense depth. Wiz and
              Orca Security built substantial market momentum by eliminating runtime agent overhead through API-driven
              snapshot analysis of cloud configurations, virtual disks, and control planes. Conversely, Sysdig targets
              platform engineering and DevSecOps teams operating complex, distributed Kubernetes footprints where static
              API scans cannot observe active execution paths, in-memory malware, or ephemeral container drift. While
              major cloud providers (AWS, Microsoft Azure, Google Cloud) continue to expand basic native security
              baselines, enterprise buyers managing hybrid and multi-cloud container infrastructure turn to independent
              CNAPP vendors to enforce uniform detection policies and unified vulnerability prioritization across
              disparate compute environments.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
