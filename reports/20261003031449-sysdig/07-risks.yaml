callouts:
  - calloutType: risk
    title: Open Source Monetization and Platform Bundling Barrier
    body: >-
      Falco's Apache 2.0 license empowers major cloud platform providers to package and distribute the core runtime system-call engine without paying Sysdig licensing fees. Unless Sysdig consistently demonstrates superior value through proprietary threat intelligence feeds, managed SaaS capabilities, and agentic remediation workflows, commodity bundling by hyperscalers represents a structural barrier to long-term software margin expansion.
    claimRefs:
      - CR005
      - CR012
  - calloutType: risk
    title: Private Valuation Mark Disconnect and Exit Horizon Uncertainty
    body: >-
      Sysdig has not completed a primary equity round since its $350 million Series G at a $2.5 billion valuation in December 2021. With audited metrics for 2026 unverified and tech-sector growth multiples compressing since late 2021, the company faces potential liquidity friction and liquidation preference overhang unless private market growth or public IPO conditions validate its historical headline valuation.
    claimRefs:
      - CR013
      - CR014
