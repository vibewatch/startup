callouts:
  - calloutType: "risk"
    title: "The Remediation Deficit in Enterprise Customer Retention"
    body: |
      While Sysdig commands high customer loyalty among Kubernetes practitioners for deep kernel-level visibility, enterprise retention faces severe pressure from detection fatigue. Competitive benchmarks indicate that alert volumes without automated remediation capabilities create significant friction for enterprise security operations. With agentless competitors marketing zero-maintenance posture management, Sysdig must continuously prove that runtime kernel depth outweighs the deployment friction of node agents.
    claimRefs:
      - "CU005"
      - "CU010"
      - "CU012"
