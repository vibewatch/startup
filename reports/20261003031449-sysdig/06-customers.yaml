  title: "Customers"
  summary: "Sysdig targets enterprise DevSecOps, platform engineering, and CISO buyers with runtime threat detection across Kubernetes, cloud infrastructure, and emerging AI workloads. Commercial adoption is anchored by deep Linux kernel visibility via Falco, but enterprise contract durability faces rising friction from agentless CSPM alternatives and remediation backlogs."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Enterprise Buyer Personas and Workload Segmentation"
    body: |
      Sysdig's commercial enterprise footprint spans three core customer constituencies: central security teams (CISOs and SecOps directors), cloud platform engineering organizations, and distributed DevOps practitioners managing containerized production services. Enterprise procurement is predominantly driven by centralized security budgets seeking unified Cloud-Native Application Protection Platform (CNAPP) capabilities that combine runtime detection with posture compliance.

      Buyer requirements vary significantly by infrastructure scale and regulatory exposure. Highly regulated sectors, including financial services and public sector entities, adopt Sysdig to address compliance regimes such as PCI-DSS and HIPAA across ephemeral container environments. Mid-market and cloud-native commercial buyers frequently encounter Sysdig via developer adoption of open-source Falco, transitioning into commercial Sysdig Secure contracts as cluster footprints expand across AWS, Azure, GCP, and private cloud deployments.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-deal-velocity"
    title: "Adoption Trajectory, Deal Sizing, and Channel Scaling"
    body: |
      Commercial momentum historically benefited from rapid cloud containerization, with annualized revenue run rate tripling over twelve-month expansion cycles and net revenue retention reaching 149% among enterprise accounts prior to market consolidation. Large-scale enterprise spending demonstrates high account value concentration, with the top 50 purchasing customers averaging over $875,000 in annual recurring revenue.

      However, contemporary customer expansion increasingly relies on indirect channel ecosystems rather than direct enterprise outbound motions. Sysdig transitioned all commercial transactions outside the Global 500 to certified reseller and systems integration partners. Global systems integrators such as Tech Mahindra package Sysdig into managed cloud migration and DevSecOps transformation practices, providing turnkey posture assessment and runtime protection. Despite this ecosystem reach, overall active customer count and net retention disclosures remain unverified on a contemporary run-date basis.
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "named-production-proof-and-procurement-friction"
    title: "Named Production Proof, Reference Quality, and Competitive Discontent"
    body: |
      Enterprise customer evidence demonstrates verified production deployments across mission-critical environments. Key named references include Apree Health, which standardized on Sysdig as its exclusive Kubernetes security platform for vulnerability management and cluster compliance, and major sovereign entities such as India's Unique Identification Authority (UIDAI), which selected Sysdig through an open public tender. Further enterprise references across payment processing and digital banking validate runtime Falco efficacy.

      Nevertheless, customer satisfaction and expansion dynamics reveal structural competitive friction. Independent analysis highlights that while Sysdig excels at kernel-level threat detection, enterprise SOC teams experience operational bottlenecks around vulnerability triage and automated remediation. Competitors such as Wiz and Orca exploit this friction with frictionless agentless posture graphs, challenging Sysdig's agent-based daemonset architecture during procurement renewals and driving evaluation of remediation-first alternatives.
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU003"
