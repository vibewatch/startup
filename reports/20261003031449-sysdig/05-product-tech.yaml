chapter:
  number: 5
  title: "Product & Technology"
  summary: "Sysdig delivers a cloud-native application protection platform (CNAPP) anchored by runtime system-call observability from the CNCF-graduated open-source Falco engine. The platform combines eBPF-driven workload monitoring, container image scanning, posture management, and agentic AI investigation, while balancing technical deployment friction against open-source defensibility."
sections:
  - id: "product-definition-and-workflow"
    title: "Product Definition and Customer Security Workflow"
    body: "Sysdig provides an enterprise cloud-native application protection platform (CNAPP) anchored in live runtime system-call observability [CE001]. The platform is engineered to eliminate operational security blind spots by capturing kernel-level system calls rather than relying solely on static configuration scanning or cloud control-plane metadata [CE001, CE003]. Security operations and platform engineering teams deploy Sysdig Secure to observe dynamic container activity, prioritize vulnerabilities by active execution status, detect runtime anomalies, and trigger automated remediation workflows [CE001, CE004]. Customer workflows integrate the platform directly across continuous integration and deployment pipelines, container registries, Kubernetes clusters, and cloud provider APIs [CE004, CE008]. Independent review platforms report that correlating runtime execution context with vulnerability databases reduces alert noise by up to 75% for enterprise security teams [CE004]. However, third-party user feedback consistently notes that configuring agent instrumentation and maintaining complex detection rules requires specialized technical expertise [CE005]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE008"
    tableRefs:
      - "TE001"
  - id: "architecture-and-technical-stack"
    title: "Operating Architecture and Technology Stack"
    body: "The core technical architecture of Sysdig Secure is founded on Falco, an open-source runtime threat detection engine created by Sysdig and contributed to the Cloud Native Computing Foundation (CNCF), where it graduated in 2024 [CE002, CE003]. Workload observability is achieved at the Linux kernel boundary through modern extended Berkeley Packet Filter (eBPF) probes or loadable kernel modules, capturing system call streams without necessitating source-code modifications [CE003, CE004]. In the SaaS control plane, Sysdig maintains distributed microservices utilizing Java, Golang, and Python backend components, alongside managed Prometheus telemetry engines within Sysdig Monitor [CE007, CE009]. In 2026, Sysdig expanded its delivery model with headless cloud security interfaces and Sysdig Secure AI, exposing runtime telemetry via model context protocol (MCP) services and RESTful APIs to allow autonomous agents and automated pipelines to ingest findings directly [CE002, CE009]. Platform security events are streamed to third-party SIEM and data-analytics platforms such as Google Security Operations and Sumo Logic via authenticated webhooks and structured JSON feeds [CE006, CE008]."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE003"
  - id: "product-lines-and-workflow-use-cases"
    title: "Product Modules, Deployment, and Ecosystem Integration"
    body: "Sysdig divides its commercial portfolio into modular capabilities spanning container security, compliance, infrastructure monitoring, and AI investigation [CE001, CE002, CE009]. Core product modules include Sysdig Secure for runtime threat detection, vulnerability prioritization, and compliance scanning, alongside Sysdig Monitor for cloud infrastructure metrics and Prometheus dashboarding [CE007, CE009]. In shift-left workflows, Sysdig provides inline container scanners and CI/CD integration plugins for Jenkins and GitHub Actions that evaluate container images against security policies and emit standard SARIF vulnerability reports before images are pushed to production registries [CE010]. Enterprise operations ingest runtime policy alerts into central log analytics through standardized data schemas mapped to the Google Security Operations Unified Data Model (UDM) [CE006]. While Sysdig manages commercial Falco Feeds and enterprise platform governance, Falco's Apache 2.0 license permits competing vendors or public cloud providers to embed the open-source detection engine directly, making platform integration depth and proprietary threat research the primary commercial differentiators [CE002]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE007"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "governance-and-technical-risk"
    title: "Differentiation, Governance, and Product Diligence Blockers"
    body: "Sysdig differentiates its technical stack from agentless CNAPP competitors through deep kernel-level visibility that identifies in-use, exploitable vulnerabilities rather than theoretical risks [CE001, CE004]. To uphold software development lifecycle integrity, Sysdig applies its own security scanning tools internally and maintains private branches of critical open-source components before customer delivery [CE010]. Enterprise trust controls include historical SOC 2 Type II attestations and automated vulnerability policy evaluation on hardened operating systems such as Bottlerocket [CE002, CE008]. Nonetheless, technical diligence highlights significant platform dependencies: runtime system-call interception introduces deployment friction in restricted container environments, agentless competitors bypass kernel agent maintenance, and public access to current external security audit reports remains gated [CE002, CE005]. Furthermore, technical writing and developer hiring requisitions across 2025 and 2026 underscore ongoing platform maintenance demands across multi-cloud integrations [CE007, CE011]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE011"
