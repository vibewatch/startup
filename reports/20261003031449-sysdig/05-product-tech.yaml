callouts:
  - calloutType: "insight"
    title: "The Runtime Advantage and Its Operational Trade-off"
    body: "Sysdig's kernel-level runtime observability provides deep fidelity by observing actual system calls and in-memory execution, cutting static vulnerability noise by up to 75%. However, this approach requires host-level sensor privileges or eBPF support, creating greater operational deployment friction than agentless posture management competitors."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "Open-Source Core Defensibility Risk"
    body: "Because Sysdig contributed Falco to the CNCF under an Apache 2.0 license, major cloud hyperscalers and competing vendors can freely incorporate the underlying runtime detection engine into proprietary offerings without paying platform licensing fees to Sysdig."
    claimRefs:
      - "CE002"
      - "CE003"
