      - number: '7.4'
        title: 图表分析
        blocks:
          - type: callout
            title: 开源商业化与平台捆绑壁垒
            body: >-
              Falco 的 Apache 2.0 许可证赋予主要云平台服务商打包分发核心运行时系统调用引擎的权利，且无需向 Sysdig 支付授权费。除非 Sysdig 能够通过专有威胁情报库、托管 SaaS
              能力及智能体修复工作流持续展现出卓越价值，否则超大规模云厂商的通用化捆绑将构成长期软件利润率扩张的结构性壁垒。
            calloutType: risk
            claimRefs:
              - CR005
              - CR012
          - type: callout
            title: 一级半估值倒挂与退出周期不确定性
            body: >-
              自 2021 年 12 月以 $2.5 billion 估值完成 $350 million Series G 轮融资以来，Sysdig 尚未完成任何新股股权融资。由于 2026
              年经审计的指标未经证实，且科技行业成长股估值倍数自 2021 年底以来大幅收缩，除非非上市业务增长或公开市场 IPO 条件能够支撑其历史公布估值，否则公司将面临潜在流动性摩擦与清算优先权积压风险。
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Sysdig 的核心投资逻辑在于差异化运行时优先（runtime-first）安全范式与深厚系统工程护城河。纯云安全态势管理（CSPM）厂商主要评估静态配置与理论暴露面；Sysdig 截然不同，借助 eBPF
              探针与内核模块实时检查内核系统调用，确切掌握企业级 Kubernetes 及多云容器工作负载中具体哪些代码正在活跃执行。这一架构由 Loris Degioanni 奠定，并因 Falco
              从云原生计算基金会（CNCF）毕业而确立地位；架构带来极高信噪比，切实减轻了企业安全运营中心（SOC）及印度唯一身份识别管理局（Aadhaar）等关键公共部门部署中的告警疲劳。此外，公司近期向无头（headless）程序化
              API 与自主 AI 安全智能体延伸，使 Sysdig 能够以机器响应速度守护智能体开发者工作流。


              反向逻辑则揭示了结构性阻力、竞争整合及开源许可防御风险。由于 Falco 采用宽松的 Apache 2.0 许可证分发，主流超大规模云厂商（AWS、Azure、Google Cloud）与老牌安全巨头（Palo
              Alto Networks、CrowdStrike）均可将核心开源检测引擎直接嵌入其原生托管产品，无需与 Sysdig 建立商业采购关系。尽管 Sysdig 依靠 Sysdig Secure
              对自研托管规则库、CIEM、态势管理与合规工具进行商业变现，但更庞大的网络安全平台厂商持续把无代理漏洞扫描与容器安全直接捆绑至企业大单中，形成严峻定价压力。Forge Global
              一级半市场披露记录显示，2026 年 7 月公司估值从 $2.5B 下调至 $1.1B，印证了缺乏经审计收入运行率的成长期软件基础设施正面临估值倍数压缩。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
