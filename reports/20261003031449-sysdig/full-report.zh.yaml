      - number: '8.3'
        title: 情景分析、退出准备度与尽调框架
        blocks:
          - type: paragraph
            body: >-
              为测算 Sysdig 在 36 个月投资周期内的风险调整收益，我们基于市场采纳动态与估值倍数基准，设定了乐观、基准与悲观三种经营情景。在乐观情景下，企业加速采纳智能体 AI 工作负载与实时运行时治理，拉动内核级
              eBPF 插桩需求，推动 Sysdig 的 ARR 突破 $350 million 并维持 >120% 的净留存率；一旦 IPO 窗口重新开启，公司可通过平台巨头（如 Cisco、Google
              Cloud）战略收购或独立上市，实现 $2.5 billion 至 $3.2 billion 的退出估值（对应 7.0x–9.0x 远期 ARR 倍数）。


              在基准情景下，Sysdig 守住强监管企业客户（金融机构、政府身份基础设施）的基本盘，借助托管伙伴渠道扩张，年收入实现 15%–20% 的稳健增长，同时维持自由现金流平衡。按照当前软件基础设施 4.5x–5.5x
              远期 ARR 的交易倍数，基准情景推导出的企业估值区间为 $1.1 billion 至 $1.5 billion，与当前 X
              轮投后估值大致吻合。在悲观情景下，超大规模云厂商与主流平台安全商持续捆绑云检测能力，侵蚀 Sysdig 的新增客户拓展速度，净留存率跌破 100%，倒逼二级市场估值下调至 $600 million 到 $800
              million（对应 2.5x–3.5x ARR），可能触发资本重组或困境整合。


              审慎的投资判断要求在资金出资前厘清核心分析缺口。关键尽调方向包括：核实未公开的真实 ARR 规模、测算分客群毛利率与获客回本周期、摸清与 Wiz 及 Palo Alto Networks
              的客户重叠程度，并跟踪企业对其新推出的无头与智能体安全模块的采纳进展。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
