      - number: '6.4'
        title: 图表分析
        blocks:
          - type: callout
            title: 企业客户留存中的修复短板
            body: >
              尽管 Sysdig 凭借深度的内核级可见性在 Kubernetes
              实践者中享有极高的客户忠诚度，但检测疲劳令企业客户留存面临严峻压力。竞争性基准测试表明，缺乏自动化修复能力的庞大告警量给企业安全运营带来了沉重摩擦。在无代理竞品大肆宣传零维护态势管理的情况下，Sysdig
              必须不断证明运行时内核检测深度足以抵消节点代理带来的部署摩擦。
            calloutType: risk
            claimRefs:
              - CU005
              - CU010
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规监管、隐私保护与开源治理风险
        blocks:
          - type: paragraph
            body: >-
              作为安全平台，Sysdig 负责处理跨越复杂多云及多司法管辖区企业基础设施的遥测数据。在已发布的全球隐私声明中，公司明确同时充当独立数据控制方以及客户数据处理方或服务提供方。在国际数据隐私框架下，Sysdig
              保持着对“欧盟-美国数据隐私框架”及“欧盟-美国数据隐私框架英国延伸版”的认证合规，并支持在美国、欧盟、英国、哥斯达黎加、加拿大、印度、塞尔维亚和日本等地的设施之间开展跨境数据传输与处理。开展跨境遥测数据收集使
              Sysdig 面临 GDPR、CCPA 和区域主权法规的合规审查，特别是当敏感个人数据或网络凭据不慎泄露至系统调用日志流时。此外，Sysdig 的核心威胁检测引擎 Falco
              作为已毕业的开源项目，由云原生计算基金会（CNCF）在 Apache 2.0 许可证下进行治理。虽然社区托管提供了厂商中立性，但 Apache 2.0
              授权模式赋予了大型超大规模云厂商和竞争平台厂商合法权利，无需与 Sysdig 保持任何付费商业关系即可直接集成并分发底层 Falco 检测引擎，构成了持续的知识产权与商业变现壁垒。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: 运营、架构及 AI 工作负载安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营维度来看，Sysdig 的竞争定位取决于依靠内核级系统调用检查实施的持续运行时监控。历史上，运行时安全工具聚焦于云原生容器工作负载，但企业对自主 AI
              智能体与大语言模型（LLM）工作负载的采纳引入了全新运行故障模式，传统依赖云端的架构难以应对。对抗性技术分析表明，提示词注入（prompt injection）和模型上下文协议（MCP）工具投毒等针对 AI
              智能体的运行时攻击是在活跃内存中发生，而非静态扫描阶段。竞品基准强调，在远程 SaaS 连接受限或不可用的自建、本地部署或物理隔离（air-gapped）GPU 集群中，依赖云端的 CNAPP
              架构存在可见性盲区。与此同时，高管评论指出企业 AI 治理仍缺乏统筹，内部员工在集中监控边界之外私自测试第三方工具。在 Sysdig 内部，高管变动以及历史员工规模（据报道在 501 至 1,000
              人之间，且此前经历过重组裁员）给客户上线培训与持续工程维护带来了运营压力。如果 Sysdig 无法在多样化的多云环境中提供低开销、具备离线能力的运行时安全防护，企业安全团队将面临告警疲劳与控制失效的风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
