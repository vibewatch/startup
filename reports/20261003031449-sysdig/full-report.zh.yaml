        - 全球及区域分销商（如 Kafein Yazilim）
        - 全球 500 强以外客户的独家销售渠道
        - 高
        - 分销商渠道冲突、销售周期拉长或技术定位失效
        - 高
        - 合作伙伴认证计划与专属渠道赋能团队
        - 缺乏对客户采用情况与续约意向的直接可见度
      - - 开源社区贡献者参与度
        - CNCF Falco 社区贡献者
        - 核心运行时探针维护与漏洞报告
        - 中
        - 贡献者流失分散，或转向竞争性开源安全框架
        - 中
        - 积极把控项目领导权，主导 CNCF 毕业级项目维护
        - 若企业端外部贡献下降，下游维护负担将加重
    notes: 按商业严重程度排序；评估 Sysdig 对云厂商、分销商及开源生态的平台依赖度。
    claimRefs:
