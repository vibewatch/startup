            body: >-
              基于代理的内核插桩与无代理配置扫描之间，运行时云安全平台的成本结构存在显著差异。Sysdig 主营业务成本（COGS）的核心驱动项包括横跨 AWS、Google Cloud 与 Microsoft Azure
              的多云 SaaS 托管基础设施、处理高频 eBPF 系统调用遥测数据的数据摄取流水线，以及针对复杂企业架构派驻的专业服务。尽管早期高速增长期的披露数据显示年化净收入留存率（NRR）达 149%，前 50
              大客户的平均 ARR 超过 $875,000，但公司后续沟通显示净收入留存率已放缓至
              110%。实际毛利率、获客成本（CAC）回本周期及客户终身价值（LTV）仍属于未获核实的非公开指标，这使得投资测算的敏感性取决于运行时遥测存储成本是否会将软件毛利率压低至企业级 SaaS 中位数之下。
