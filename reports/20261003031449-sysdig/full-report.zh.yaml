  - id: TV002
    title: 投资逻辑与反向逻辑对照表
    columns:
      - 支柱维度
      - 正向投资逻辑
      - 反向抗辩逻辑
      - 证伪触发条件（何种情况会改变观点）
    rows:
      - - 产品与架构
        - 基于 eBPF 与 Falco 的深度运行时内核探针可提供实时可利用性上下文，静态扫描根本无法比拟。
        - 宽松的 Apache 2.0 许可证允许竞争对手和云厂商直接封装核心 Falco 检测能力，无需向 Sysdig 付费。
        - 超大规模云厂商推出托管的原生 Falco 运行时引擎，直接集成到其标准云计算服务中。
      - - 市场定位
        - 公认的 CNAPP 领导者及 Forrester Wave 领导者，在 Kubernetes 和容器工作负载领域享有专业声誉。
        - 企业愈发倾向采购集成化网络安全平台（Wiz、Palo Alto、CrowdStrike），而非单一的运行时点状方案。
        - 平台型厂商在不牺牲集群稳定性或开发者研发效率的前提下，达到同等内核级容器遥测水平。
      - - 客户采用
        - 拿下关键企业大客户，包括印度 UIDAI（Aadhaar）、Worldpay、Mambu 以及重要受监管机构。
        - 前 50 大客户 ARR 超过 $875k，但长尾自助服务与中端市场扩张仍受制于部署复杂性。
        - 核心全球 2000 强客户向捆绑套件迁移，出现重大客户流失或 ARR 缩减的明确迹象。
      - - 资本与估值
        - Series X 估值回调至 $1.1B，消化了 2021 年高估值倍数泡沫，确立了合理的入场倍数。
        - 股价从 $16.23 跌至 $6.89，表明历史增长放缓且普通股可能面临稀释。
        - 经审计财务文件或积极的 IPO 前 S-1 招股说明书证实收入持续加速增长。
    notes: 对比截至 2026 年运营防御力与结构性市场风险的投资逻辑对照矩阵。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV008
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 假设与运营驱动因素
      - 隐含估值逻辑
      - 核心风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观情景
        - 运行时 AI 安全智能体普及加速；ARR 达到 $350M+ 且 NRR > 120%；平台巩固企业级运行时标准地位。
        - $2.5B - $3.2B 估值（7.0x - 9.0x ARR 倍数）；成功公开上市或被平台型买家战略收购。
        - AI 智能体商业化受阻；Microsoft Azure、AWS 和 Google Cloud 大幅捆绑原生运行时功能。
        - 25% —— 高度受监管的容器化部署具备极高技术进入壁垒与客户黏性。
      - - 基准情景
        - 在间接分销渠道支撑下 ARR 温和增长 15%-20%；净留存率稳定在 110% 左右；实现现金收支平衡。
        - $1.1B - $1.5B 估值（4.5x - 5.5x ARR 倍数）；维持非上市状态，最终通过老股资本重组退出。
        - 大企业采购周期拉长，且面对集成化 CNAPP 安全套件时被迫降价应对。
        - 55% —— 与当前 Series X 估值定价及成熟市场环境相吻合。
      - - 悲观情景
        - 由于企业向捆绑平台套件迁移，ARR 停滞在 $200M 以下；NRR 滑落至 95% 以下；人员重组持续。
        - $600M - $800M 估值（2.5x - 3.5x ARR 倍数）；折价出售或被动执行清算优先权。
        - 标杆企业大客户流失，且 Falco 开源规则在竞争平台中泛化贬值。
        - 20% —— 企业高切换成本与深度系统集成起到一定缓冲作用。
    notes: 基于当前云软件估值倍数环境，按 24-36 个月周期推演的前瞻性情景测算。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
