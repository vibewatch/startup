      - number: '1.2'
        title: 高管团队、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              在扩张周期中，Sysdig 的管理团队经历了多个领导阶段。公司目前由首席执行官 Hatem Naguib 掌舵，这位企业级基础设施与安全领域的老将接替了长期任职的首席执行官 Suresh
              Vasudevan。创始人 Loris Degioanni 继续以首席技术官身份主导产品创新与技术战略，同开源项目 Falco 及云原生安全开发者生态保持深度协同。财务运营自 2021 年底起由首席财务官
              Karen Walker 统筹，人力资源管理则在 Series G 轮扩张前后由首席人力资源官 Paul Whitney 推进制度化。董事会监督与治理吸纳了 Permira、Insight
              Partners、Bain Capital Ventures、Accel 以及 Goldman Sachs
              等主要风险投资方的代表与观察席位，不过非上市状态限制了外界对其投票权控制结构及正式董事会委员会构成的公开能见度。
