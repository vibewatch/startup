  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户安全工作流
        blocks:
          - type: paragraph
            body: >-
              Sysdig 提供以实时运行时系统调用可观测性为核心的企业级云原生应用保护平台（CNAPP）[CE001]。该平台靠捕获内核级系统调用消除运维安全盲区，而非仅仅依赖静态配置扫描或云控制平面元数据 [CE001,
              CE003]。安全运营和平台工程团队部署 Sysdig Secure 来监控动态容器活动、根据活跃运行状态对漏洞进行优先级排序、检测运行时异常并触发自动化修复工作流 [CE001,
              CE004]。客户工作流将该平台直接集成到持续集成与持续部署（CI/CD）流水线、容器镜像仓库、Kubernetes 集群以及云厂商 API 中 [CE004,
              CE008]。独立评测平台报告称，将运行时执行上下文与漏洞数据库关联，可为企业安全团队减少高达 75% 的告警噪音 [CE004]。然而，第三方用户反馈普遍指出，配置代理插桩和维护复杂的检测规则需要专业技术知识
              [CE005]。
