      - number: '2.3'
        title: 买方画像、采购经济学与合同动态
        blocks:
          - type: paragraph
            body: >
              采购运行时安全平台需要安全高管与平台工程主管跨部门协同。核心财务决策人通常是首席信息安全官（CISO）或安全运营副总裁，他们掌管着用于企业基础设施防御、年度规模在 $100,000 至 $500,000+
              的网络安全软件预算。日常使用者与评估人则涵盖 DevSecOps 工程师、站点可靠性工程师（SRE）及平台架构师，他们在 CI/CD 部署流水线中饱受告警疲劳与运维摩擦之苦。


              商业合同挂钩基础设施规模与许可等级，而非传统的企业级 SaaS 按人头席位收费。来自 Vendr 的交易基准数据显示，Sysdig Secure 的合同单价通常为每主机每月 $50 至 $100；对于监控 500
              至 2,000 台主机的中型市场架构，年度合同总额（ACV）可达 $150,000 至 $400,000。企业客户增购主要受净收入留存率（NRR）及账户级基础设施扩张驱动：锁定拥有专职安全团队的企业买方，让
              Sysdig 依托更精准的目标客户画像（ICP）将合同规模扩大了 36%。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
