      - number: '7.3'
        title: 合作伙伴生态与资本路径风险
        blocks:
          - type: paragraph
            body: >-
              Sysdig 的商业扩张与第三方渠道生态以及超大规模云厂商云市场分销深度交织。在 2021 年 12 月完成 Series G 轮融资后，Sysdig 推行间接销售战略，要求 Global 500
              之外的所有商业交易均必须经由渠道伙伴、增值经销商以及区域集成商进行（例如其与 Kafein Yazilim
              的方案合作）。尽管这种渠道优先的策略降低了中端市场客户的直销开销，但它对分销商的执行力、联合销售协议，以及在 Amazon Web Services、Google Cloud Platform、Microsoft
              Azure、IBM Cloud 和 SUSE Rancher 上的云平台集成产生了严重的商业依赖。从财务表现来看，Sysdig 累计获得 $744 million 股权融资，以 2021 年 12 月完成的
              $2.5 billion 投后估值为锚。然而，自该轮融资以来，公司在未再募集新股资本的情况下运营，管理层亦未发布经审计的财务报表以确认 2026
              年的年度经常性收入、毛利率、现金消耗率或净收入留存率。在缺乏可核实的公开财务披露或有效 S-1
              文件的情况下，投资者必须密切关注间接渠道的推进速度能否有效对冲一级半市场流血轮（down-round）风险与流动性时点风险。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
