  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与相邻赛道
        blocks:
          - type: paragraph
            body: >
              云原生应用保护平台（CNAPP）赛道整合了此前分散的安全门类，涵盖容器安全、云安全态势管理（CSPM）、云工作负载保护平台（CWPP）以及云基础设施授权管理（CIEM）。Sysdig 将核心价值定位锁定在基于
              CNCF 毕业项目 Falco 引擎的运行时威胁检测与实时工作负载可见性上。Sysdig 并不单纯作为静态配置审计控制台参与竞争，而是将运行时实测作为核心机制，用以过滤漏洞积压并捕捉分布式容器与
              Kubernetes 环境中的活跃攻击行为。


              支出边界明确涵盖用于容器行为监控、Kubernetes 准入控制、主机与镜像扫描、运行时检测与响应（CDR）以及满足持续审计要求的合规管理等企业级工具。与核心 CNAPP
              工作负载交叉但保持独立的相邻品类包括传统端点检测与响应（EDR）、安全信息与事件管理（SIEM）以及独立的可观测性平台。尽管 Sysdig 提供 Sysdig Monitor
              作为配套的指标监控解决方案，但企业云安全预算仍由 CISO 与 SecOps 主管支配的专属网络安全预算管理，而非归入 IT 运维科目。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场测算视角与增长轨迹
        blocks:
          - type: paragraph
            body: >
              测算云工作负载与运行时安全市场，需要从宏观基础设施转型、容器工作负载扩张以及厂商可触达的运行时防御等多个需求视角进行综合评估。主流分析机构框架侧重于工作负载的快速迁移：451 Research
              的历史预测认为云赋能技术市场规模将扩大至 $39.6B，其中容器软件的复合年增长率（CAGR）达 40%；Gartner 研报则预计 70%
              的企业工作负载将部署在云基础设施与平台服务中。然而，整体上云规模的数据未能单独切分出专注运行时威胁防护的实际运维支出。


              更严格的可触达市场测算视角聚焦于运行分布式多云容器架构的企业群体。鉴于现代企业单家每年的安全工具预算介于 $100K 至 $500K 以上，而 Sysdig Secure 每主机每月的运行时监控费用为 $50 至
              $100，其可服务市场（SAM）高度集中在科技、金融服务、医疗保健以及数字零售等领域深度使用 Kubernetes
              的企业。相比之下，运行静态或直接搬迁（lift-and-shift）虚拟机工作负载的组织更倾向选择较轻量的无代理态势扫描工具，这为 Sysdig 当下的直接可服务市场设定了清晰上限。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
