    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与开源根基
        blocks:
          - type: paragraph
            body: >-
              Sysdig, Inc. 是一家总部位于加利福尼亚州旧金山的云安全与 Kubernetes 可观测性厂商，由 Loris Degioanni 于 2013 年创立；Loris
              此前曾联合创立基础开源网络协议分析工具 Wireshark。公司商业化运营云原生应用保护平台（CNAPP），聚焦运行时威胁检测、系统调用检查与容器安全，依托开源项目 Falco 及 eBPF
              驱动的运行时情报构建核心架构壁垒。作为获风投支持的成长期后期企业软件公司，Sysdig 在北美、欧洲及亚太地区销售 SaaS
              订阅。尽管开源普及与运行时插桩带来了深厚的开发者认同，但面对无代理云安全厂商和既有平台整合商的激烈竞争，第三方基准评测仍将其市场防御壁垒归为存在争议。
