      - number: '5.2'
        title: 运行架构与技术栈
        blocks:
          - type: paragraph
            body: >-
              Sysdig Secure 的核心技术架构立足于 Falco——这是由 Sysdig 创建并贡献给云原生计算基金会（CNCF）的开源运行时威胁检测引擎，该引擎已于 2024 年正式毕业 [CE002,
              CE003]。工作负载的可观测性在 Linux 内核边界通过新型扩展伯克利数据包过滤器（eBPF）探针或可加载内核模块实现，无需修改源代码即可捕获系统调用流 [CE003, CE004]。在 SaaS
              控制平面中，Sysdig 维护着采用 Java、Golang 和 Python 后端组件的分布式微服务，并在 Sysdig Monitor 内运行托管的 Prometheus 遥测引擎 [CE007,
              CE009]。2026 年，Sysdig 通过无头云安全接口与 Sysdig Secure AI 拓展了交付模式，通过模型上下文协议（MCP）服务和 RESTful API
              暴露运行时遥测数据，支持自主智能体与自动化流水线直接摄取研判结果 [CE002, CE009]。平台安全事件通过鉴权 Webhook 与结构化 JSON 数据流推送到 Google Security
              Operations、Sumo Logic 等第三方 SIEM 及数据分析平台 [CE006, CE008]。
