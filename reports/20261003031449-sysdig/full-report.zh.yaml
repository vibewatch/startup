            body: >-
              不同于定期轮询 API 快照的无代理云态势工具，Sysdig 的实时运行时检测通过 eBPF
              探针持续监控内核系统调用。在分布式多云集群中摄取密集系统调用遥测数据，会产生大量数据出站、计算处理和多云存储开销。如果客户合同等级未能对超额用量合理定价，遥测基础设施的主营业务成本（COGS）可能会将毛利率压缩至常规软件水平之下。
