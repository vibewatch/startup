              - CV010
      - number: '8.2'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Sysdig 的资本运作历程折射出企业级云基础设施在 2020 至 2026 年市场周期中的整体估值轨迹。2021 年 12 月，Sysdig 宣布完成标志性的 $350 million G 轮融资，由
              Permira 旗下成长基金领投，Guggenheim Investments 以及早期风投支持方 Accel、Bain Capital Ventures、DFJ Growth、Goldman Sachs 和
              Insight Partners 参投，投后估值达到 $2.5 billion。当时公司公布了亮眼的扩张数据，包括年化净留存率（NRR）达 149%，前 50 大客户的平均 ARR 超过
              $875,000，累计股权融资金额达到 $744 million。


              2022 至 2025 年间，公司未公开确认任何后续新股风投融资，企业级云安全市场环境也全面转向供应商整合与资本效率。2026 年 7 月，Forge Global
              公布的一级半市场交易与资本结构记录显示，公司完成一笔 $101.51 million 的 X 轮融资，发行 14,722,466 股，每股价格 $6.89，投后估值定格在 $1.1 billion。这较 2021
              年 12 月 $16.23 的峰值股价回落 56%，累计融资总额达到 $831.28 million。交易结构采用了标准 1.0x 非参与型清算优先权（non-participating liquidation
              preference），表明现有普通股持有人虽经历了显著稀释，但资本结构避免了惩罚性条款负担。尽管如此，公司日常现金消耗、毛利率以及经审计的实际 ARR 仍未公开披露，成长期股权投资者必须恪守严格的入场纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
