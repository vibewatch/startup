            body: >-
              自 2013 年成立以来，Sysdig 在八轮融资中累计获得 $744M 新股与老股融资，顶点是 2021 年 12 月由 Permira 领投的 $350M Series G 轮，估值达
              $2.5B。此后融资环境经历大幅调整，截至 2026 年底 Sysdig 尚未宣布新一轮股权新股融资。公司未来的资本充足度由 CEO 办公室架构的治理监督，以及 Permira、Accel、Bain
              Capital Ventures 和 Insight Partners 等机构投资财团提供支撑。然而，员工追踪记录显示，公司在 2024 年 4 月裁撤了约 100 名员工，并在 2025 年 1 月裁撤了 50
              名员工。在缺乏 S-1 注册文件或经认证的公开财务披露的情况下，机构投资评估必须将第三方追踪机构的估测数据（例如未经核实的 $283M 营收数据）视为未经证实的假设，将尽调重心放在现金跑道与 GAAP
              营业利润率上。
