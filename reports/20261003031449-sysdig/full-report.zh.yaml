      - number: '2.4'
        title: 采纳驱动因素、结构性阻力与尽调盲区
        blocks:
          - type: paragraph
            body: >
              云原生攻击路径复杂化，加上 PCI-DSS、HIPAA 和 NIST
              等严苛的法规合规要求，推动了云工作负载防护工具的落地速度。随着企业扩大短期容器部署，静态镜像扫描会暴露出成千上万个理论漏洞，在开发人员与安全团队之间引发严重的协作摩擦。运行时可观测性将实时系统调用与 CVE
              数据深度关联，化解了这一瓶颈，使企业能够消除高达 95% 的漏洞排查噪音并隔离正在运行的实际风险。


              相反，推广也遭遇了实质性的结构性阻力。企业级落地需要在生产集群中安装 eBPF 探针或内核模块，带来了技术部署摩擦、持续策略调优和运维开销，无代理态势管理厂商在竞争性销售中经常针对这些弱点发起攻势。此外，由于
              Falco 是基于 Apache 2.0 协议的开源软件，云服务商与商业竞品无需商业授权即可整合其核心检测逻辑，对 Sysdig 的自研定价能力造成下行压力。关键尽调盲区仍在于经核实的企业
              ARR、独立产品毛利率以及客户群组流失率。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表分析
        blocks:
          - type: callout
            title: 作为采购过滤器的运行时上下文
            body: 企业买家正日益弃用会产生数千条未分级配置告警的独立态势扫描工具。评估 Sysdig 的市场机遇，取决于企业向运行时关联漏洞管理的迁移进程——在这一模式下，实时执行数据可将待排查告警减少高达 75%。
            calloutType: insight
            claimRefs:
              - CM004
              - CM013
          - type: callout
            title: 开源商业化与平台捆绑约束
            body: >-
              由于 Sysdig 底层的 Falco 检测引擎由 CNCF 按照 Apache 2.0 许可证托管，大型超大规模云厂商与竞争性 CNAPP 厂商无需采购 Sysdig 商业平台授权即可直接整合 Falco
              规则逻辑，从而对定价形成持续阻力。
            calloutType: risk
            claimRefs:
              - CM003
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与市场细分
        blocks:
          - type: paragraph
            body: >
              云原生应用保护平台（CNAPP）的竞争格局由一条根本性的架构分水岭所决定：即“运行时优先的工作负载保护”与“无代理配置态势管理”之争。Sysdig
              将竞争定位锚定在运行时检测与深度容器可观测性上，其技术血统直接源自 CNCF 毕业的开源引擎 Falco。在企业选型评估中，Sysdig 面临四类鲜明的竞争对手：以 Wiz 和 Orca Security
              为代表的高速发展型无代理态势专家；包括 Palo Alto Networks（Prisma Cloud）和 CrowdStrike Falcon Cloud Security
              在内的多产品企业级平台整合商；Aqua Security 等直接容器安全同行；以及直接依托独立 Falco 和云厂商原生工具的原有开源或自研方案。


              市场细分折射出买家在运维摩擦与防御深度之间的权衡取舍。Wiz 和 Orca Security 通过对云配置、虚拟磁盘及控制平面进行 API
              驱动的快照分析，免去了运行时代理开销，从而积累了强大的市场势能。相反，Sysdig 针对的是运营复杂分布式 Kubernetes 架构的平台工程与 DevSecOps 团队，在这些场景中，静态 API
              扫描无法观察到活跃执行路径、内存恶意软件或短期容器漂移。尽管主流云厂商（AWS、Microsoft Azure、Google
              Cloud）不断扩展基础原生安全基线，但管理混合云与多云容器基础设施的企业买方仍转向独立 CNAPP 厂商，以在异构计算环境中推行统一的检测策略与统一的漏洞优先级排序。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 竞争对手画像、体量规模与核心架构权衡
        blocks:
          - type: paragraph
            body: >
              对核心替代方案的细致评测揭示了部署开销、可见深度与总体拥有成本之间的显著权衡。Wiz
              是大型企业云安全招标（RFP）中的主要商业威胁，凭借无摩擦的只读云集成、攻击路径图谱及统一的多云仪表板，赢得了寻求快速实现企业级全覆盖的 CISO 青睐。然而，来自 Charting Cyber 和
              Work-Management 的独立厂商评测指出，Wiz 的实时容器运行时威胁检测能力相对偏弱，主要依赖定期的快照审计而非持续的系统调用拦截。


              直接容器安全同行 Aqua Security 与 Sysdig 同具开源基因，提供相当的容器工作负载保护能力，但在软件供应链和应用安全打包方式上存在差异。Palo Alto Networks 的 Prisma
              Cloud 提供覆盖基础设施即代码（IaC）、态势管理和运行时的综合套件级 CNAPP 能力，但企业用户反馈常提及运维繁杂、多模块许可复杂以及管理开销沉重。与此同时，RFP.wiki 基准评测根据 609
              条评价为 Sysdig 打出 4.6 分（满分 5 分，基于 609 条评价，在 CSPM 领域的 17 家厂商中排名第 7），在纯配置覆盖面上落后于 Netskope（5.0 分，802 条评价）和
              Tenable（5.0 分，1,457 条评价）等专业态势管理套件，但在容器化工作负载插桩能力上更具优势。
            claimRefs:
