      - number: '3.3'
        title: 能力矩阵、商业打包与定价机制
        blocks:
          - type: paragraph
            body: >
              按采购标准评估各项技术能力，Sysdig 在主动运行时防御上具备结构性优势，但采购周期中的商务透明度相对不足。在漏洞管理上，Sysdig 的 Risk Spotlight
              利用运行时遥测数据识别生产环境中是否实际加载或运行了存在漏洞的软件包，可过滤掉高达 95% 的静态漏洞噪音。缺乏内核级传感器的竞品只能将整个容器镜像漏洞列表全盘推给工程团队，引发严重的排查疲劳。至于
              Kubernetes 态势与运行时检测，Sysdig 基于 Falco 的 eBPF 探针可提供无代理工具无法获取的精细命令、网络及进程调用树。


              各竞争对手在商务条款与打包模式上分化明显。Sysdig Secure 采用基于受监控主机计算数量、关联云账户数量及日志摄取量的定制化企业定价，需要直销团队介入，未公开透明的分层价格。Work-Management
              的商业评测指出，前期缺乏透明定价增加了初期预算对比的难度。相比之下，DataRobot 等其他机器学习与分析平台公布了六位数的企业级准入门槛（$100,000/年），反衬出企业级 SaaS
              普遍倾向于非公开企业报价的特点。在云基础设施选型中，随着容器节点密度增加，买方常面临成本快速攀升的复杂许可架构。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河韧性、开源商品化与被替换风险
        blocks:
          - type: paragraph
            body: >
              Sysdig 的防御护城河被评估为存在争议，在具有高粘性的平台集成与开源商品化风险之间摇摆。一旦深度嵌入客户的 CI/CD 流水线、Kubernetes 准入控制器和企业级 SecOps
              工作流，该平台会产生可观的切换摩擦。对于在数千个节点上定制 Falco 检测规则、通过 Falco Feeds 映射 MITRE ATT&CK
              覆盖范围并配置自动修复的客户而言，拔除内核传感器并重建定制化运维剧本需要大量工程投入，因而面临高昂的迁移成本。此外，Sysdig 在 2026 年推出的 Sysdig Secure AI
              和无头智能体（headless agentic）接口将安全信号直接嵌入自动化开发流水线，进一步强化了企业锁定效应。


              相反，Sysdig 面临威胁长期定价权的重大结构性脆弱性。由于底层的 Falco 检测引擎在 CNCF 基金会治理下采用 Apache 2.0
              开源许可，超大规模云厂商或商业竞争对手可将该引擎直接嵌入原生服务，无需向 Sysdig 支付授权费。此外，Sysdig 在公开浏览器中发布了其托管 Falco Feeds
              的头部检测规则，使竞品能够参照并复刻规则集。尽管 Sysdig 借助专有云态势、托管合规和统一关联分析筑牢商业收入防线，但免费独立 Falco
              的存在为预算有限的工程团队提供了可行替代方案，制约了企业端定价变现能力。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 图表分析
        blocks:
          - type: callout
            title: CNAPP 采购中的运行时优先权衡
            body: >-
              Sysdig 最核心的竞争差异化优势——由 Falco 驱动的深度内核级可见性——同时也是其主要的运维脆弱点。在与 Wiz
              的销售竞争中，安全团队必须权衡取舍：一方面是无摩擦无代理部署带来的立竿见影效果，另一方面是在生产级 Kubernetes 集群中维护 eBPF 探针所需的运维严谨度。
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 开源商品化与核心引擎风险暴露
            body: >-
              由于 Falco 已从 CNCF 毕业，采用 Apache 2.0 许可证且维护者遍布各大科技厂商，其底层检测引擎本质上不具备专有属性。Sysdig 的定价持久性完全仰赖商业 SaaS
              关联分析、托管规则库与企业级合规，而非专有算法层面的技术锁定。
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
