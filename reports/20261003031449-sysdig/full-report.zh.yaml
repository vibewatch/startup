              Sysdig 将其商业产品组合划分为涵盖容器安全、合规管理、基础设施监控与 AI 调查的模块化能力 [CE001, CE002, CE009]。核心产品模块包括用于运行时威胁检测、漏洞优先级排序与合规扫描的
