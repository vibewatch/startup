      - number: '6.3'
        title: 知名生产验证案例、参考客户质量与竞争压力
        blocks:
          - type: paragraph
            body: >
              企业客户证据证实了其在关键业务环境中的实际生产部署。主要知名客户包括 Apree Health，该公司将 Sysdig 作为其专属 Kubernetes
              安全平台，用于漏洞管理和集群合规；还包括印度唯一身份认证管理局（UIDAI）等主要主权机构，该机构通过公开招标选定了 Sysdig。支付处理和数字银行领域的其他企业案例也验证了运行时 Falco 的有效性。


              尽管如此，客户满意度与扩张动态反映出结构性的竞争摩擦。独立分析指出，虽然 Sysdig 的内核级威胁检测表现优异，但企业安全运营中心（SOC）团队在漏洞排查与自动化修复上面临运维瓶颈。Wiz 和 Orca
              等竞品凭借无摩擦的无代理态势图谱抓住这一痛点，在采购续约期对 Sysdig 基于代理的 DaemonSet 架构发起挑战，促使客户评估以自动化修复为先的替代方案。
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU010
