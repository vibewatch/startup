  - id: FE001
    title: Sysdig 云安全技术架构栈
    type: stack
    summary: 分层展示 Sysdig 的技术架构，涵盖从主机内核探针到外部 SIEM 对接与 AI 调用的完整链路。
    data:
      layers:
        - label: 自主与无头调用层
          detail: 向自主智能体与外部工具开放运行时遥测、态势洞察及漏洞优先级排序。
          modules:
            - Sysdig Secure AI 智能体工作流
            - 无头 MCP 服务与 RESTful API
        - label: SaaS 控制平面与分析层
          detail: 处理遥测接入、指标存储及告警的多租户后端微服务集群。
          modules:
            - 多租户事件聚合器（Java / Go / Python）
            - 托管 Prometheus 工作负载指标引擎
        - label: 运行时威胁检测与策略引擎
          detail: 对照社区规则与专家精选威胁检测规则，评估实时工作负载事件。
          modules:
            - CNCF Falco 规则评估引擎
            - 精选威胁情报源
        - label: 内核探针与工作负载传感器
          detail: 主机级探针，无需修改应用程序即可在云规模下捕获实时 Linux 系统调用事件。
          modules:
            - Linux eBPF 系统调用探针
            - 主机内核事件拦截模块
        - label: 工作负载运行环境
          detail: 运行客户应用程序与容器工作负载的目标计算基础设施。
          modules:
            - 托管 Kubernetes（EKS、GKE、AKS、OpenShift）
            - 容器宿主机与云计算实例
        - label: 外部 SIEM 与下游对接生态
          detail: 下游企业安全运营中心（SOC）与分析接收目标。
          outputs:
            - Google Security Operations（通过 Webhook 对接 UDM）
            - Sumo Logic 分析集成
