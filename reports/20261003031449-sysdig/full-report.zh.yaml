      - 评估结论
      - 核心依据与战略基础
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 运行时技术差异化显著，但被一级市场估值倍数重置及缺乏经审计财务数据所抵消。
        - 保持积极跟踪姿态；在未经审计核实 ARR 之前，避免投入新的新股资金。
      - - 置信度
        - 中
        - 资本化记录来自 Forge Global 及公司公告，已获核实；ARR 与现金消耗率未经核实。
        - 以充足安全边际评估各种情景，交易前必须要求进入保密数据室。
      - - 风险评级
        - 中
        - 累计融资达 $831.28M 且企业级客群稳定；但面临云厂商捆绑与开源替代风险。
        - 紧密监控对战 Wiz、Palo Alto Prisma Cloud 以及开源 Falco 自建部署时的竞标胜率。
      - - 估值研判
        - 合理
        - 2026 年 7 月 Series X 每股 $6.89 的价格对应 $1.1B 投后估值，较 2021 年高点回归理性。
        - 当前 $1.1B 估值为老股交易或结构化过桥投资提供了合适进入基准。
    notes: 评估综合了截至 2026 年 Q3 的 Forge Global 老股及 Series X 资本化数据与公司公开披露。
