              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资决策框架：估值合理，列入观察
            body: >-
              按其 $1.1B 的 X 轮隐含投后估值，Sysdig
              评级定为估值「合理」（fair）的「观察」（track）标的。尽管公司具备顶级运行时遥测技术并深度切入强监管行业企业，但缺乏经审计财务数据，加之综合网络安全平台竞争激烈，在核实其 ARR
              增速与利润率走势前，应暂缓出资一级股权。
            calloutType: recommendation
            claimRefs:
