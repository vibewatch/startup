      - number: '6.2'
        title: 采纳轨迹、客单价规模与渠道扩张
        blocks:
          - type: paragraph
            body: >
              在商业推进初期，公司受益于云容器化的快速普及，年化收入运行率在为期十二个月的扩张周期中增至三倍规模，在市场整合前企业客户的净收入留存率（NRR）达到 149%。大型企业支出呈现出极高的单客价值集中度，采购规模前
              50 大客户的平均年度经常性收入（ARR）超过 $875,000。


              然而，当前客户拓展日益依赖间接渠道生态，而非直销企业客户的主动拓展模式。Sysdig 将 Global 500 之外的所有商业交易转由认证经销商和系统集成伙伴承接。Tech Mahindra 等全球系统集成商将
              Sysdig 打包进托管云迁移与 DevSecOps 转型方案中，提供开箱即用的态势评估与运行时保护。尽管生态触达广泛，但截至当前的活跃客户数与净留存率披露数据仍未经核实。
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
              - CU013
