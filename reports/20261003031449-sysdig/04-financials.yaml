callouts:
  - calloutType: "risk"
    title: "Telemetry Storage Overhead and Gross Margin Sensitivity"
    body: "Unlike agentless cloud posture tools that poll periodic API snapshots, Sysdig’s real-time runtime detection monitors continuous kernel system calls via eBPF probes. Ingestion of dense system-call telemetry across distributed multi-cloud clusters generates substantial data egress, processing, and multi-cloud storage expenses. If customer contract tiers fail to price usage overages appropriately, telemetry infrastructure COGS can compress gross margins below standard software thresholds."
    claimRefs:
      - "CI006"
      - "CI008"
  - calloutType: "insight"
    title: "Capital Sustainability in an Extended Private Horizon"
    body: "Having last completed a primary financing round in December 2021 ($350M Series G at a $2.5B valuation), Sysdig has operated for nearly five years without fresh announced primary equity capital. Reported workforce reductions of 100 employees in April 2024 and 50 in January 2025 indicate concerted operational discipline to align operating expense burn with recurring revenue run rates and preserve cash runway ahead of eventual public liquidity."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI013"
