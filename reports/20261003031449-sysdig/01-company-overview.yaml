callouts:
  - calloutType: insight
    title: Foundational Open-Source Pedigree vs Commercial Defensibility
    body: Sysdig enjoys an uncommon technical pedigree rooted in Wireshark and CNCF Falco, establishing deep runtime credibility. However, independent diligence benchmarks categorize its moat as contested as cloud security consolidation accelerates.
    claimRefs:
      - CO002
      - CO003
      - CO013
  - calloutType: risk
    title: Workforce Adjustments and Extended Financing Pause
    body: Employee-reported tracking indicates workforce cuts across 2024 and 2025 following a financing pause since the December 2021 Series G, making verified current ARR, net retention, and operating burn the primary diligence requirements.
    claimRefs:
      - CO014
      - CO015
