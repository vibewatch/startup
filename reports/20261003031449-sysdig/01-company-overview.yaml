chapter:
  number: 1
  title: Company Overview
  summary: Sysdig is an enterprise cloud and container security provider founded in 2013 on open-source runtime instrumentation (Falco and Wireshark lineage) that achieved a $2.5B post-money valuation at its $350M Series G in December 2021 (total primary funding $744M), now navigating a competitive runtime defense market alongside CEO succession and workforce adjustments.
sections:
  - id: corporate-identity-and-foundations
    title: Corporate Identity and Open-Source Foundations
    body: Sysdig, Inc. is a cloud security and Kubernetes observability vendor headquartered in San Francisco, California, founded in 2013 by Loris Degioanni, who previously co-created the foundational open-source network protocol analyzer Wireshark. The company commercializes a cloud-native application protection platform (CNAPP) centered on runtime threat detection, system call inspection, and container security, deriving its primary architectural moat from the open-source Falco project and eBPF-driven runtime intelligence. Sysdig operates as a venture-backed late-stage enterprise software firm selling SaaS subscriptions across North America, Europe, and Asia-Pacific. While open-source adoption and runtime instrumentation provide strong developer affinity, third-party benchmarks evaluate its market defensibility as contested given increasing competition from agentless cloud security vendors and incumbent platform consolidators.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO013
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: executive-leadership-and-governance
    title: Executive Leadership, Governance, and Key-Person Exposure
    body: Sysdig has transitioned its executive management through multiple leadership phases across its scaling lifecycle. The company is currently led by Chief Executive Officer Hatem Naguib, an enterprise infrastructure and security veteran who succeeded long-tenured CEO Suresh Vasudevan. Founder Loris Degioanni continues to drive product innovation and technical strategy in the role of Chief Technology Officer, maintaining deep alignment with the open-source Falco and cloud-native security developer ecosystems. Financial operations have been overseen by Chief Financial Officer Karen Walker since late 2021, and corporate human resources were formalized under Chief Human Resource Officer Paul Whitney around the Series G expansion. Board oversight and governance incorporate representation and observation from major venture backers including Permira, Insight Partners, Bain Capital Ventures, Accel, and Goldman Sachs, though private ownership limits public visibility into voting control and formal board committee composition.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO002
  - id: capitalization-and-scale-milestones
    title: Capitalization History, Operational Milestones, and Resource Adjustments
    body: Sysdig has raised $744 million in cumulative institutional equity financing across successive funding rounds, culminating in a $350 million Series G led by Permira in December 2021 that established a $2.5 billion valuation. Prior expansion rounds included a $68.5 million Series D in September 2018 ($121.5 million cumulative) and a $70 million Series E in January 2020 ($206 million cumulative) led by Insight Partners. Later secondary estimates from Silicon Valley Investclub observed a flat $2.5 billion valuation mark as of April 2023, while comprehensive secondary liquidity and forward market marks remain private. Following hyper-expansion in 2021–2022, independent analytical trackers documented resource adjustments including employee-reported workforce cuts of roughly 100 personnel in April 2024 and 50 personnel in January 2025. Crucial operational metrics including audited ARR, revenue retention, gross margin, cash burn, and exact customer counts remain undisclosed private data points requiring direct confirmatory diligence.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO014
      - CO015
    tableRefs:
      - TO003
