evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr
    missingEvidence: >-
      Audited current Annual Recurring Revenue (ARR), GAAP revenue, net retention rate, and operating cash burn for
      2024-2026.
    whyItMatters: >-
      Essential to determine whether Sysdig current operating scale justifies its $2.5B Series G post-money valuation
      mark.
    diligencePath: Request audited GAAP financial statements and subscription ARR cohort schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-logos
    missingEvidence: Active paying enterprise customer count and top-10 customer revenue concentration data.
    whyItMatters: Verifies whether logo growth has continued past the 700 customer milestone announced in December 2021.
    diligencePath: Obtain an anonymized customer billings schedule segmented by annual contract value (ACV) band.
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements or verified disclosures confirming Sysdig's current standalone ARR, subscription
      gross margin, and net retention rates.
    whyItMatters: >-
      Independent financial verification is necessary to establish exact commercial scale and customer expansion
      efficiency.
    diligencePath: >-
      Request audited financial disclosure schedules, revenue cohort waterfalls, and SEC S-1 filings if confidential IPO
      documents exist.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Audited head-to-head enterprise RFP win/loss rates, contract discount benchmarks, and ARR migration statistics
      between Sysdig and Wiz.
    whyItMatters: >-
      Direct commercial displacement velocity cannot be independently verified from public marketing and peer review
      data alone.
    diligencePath: >-
      Review customer contract displacement surveys, vendor displacement logs, and commercial Gartner / Forrester market
      share datasets during diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: minor
    topic: realized-contract-pricing
    missingEvidence: >-
      Realized average annual contract value (ACV) and per-node discounting tiers across varying enterprise deployment
      scales.
    whyItMatters: >-
