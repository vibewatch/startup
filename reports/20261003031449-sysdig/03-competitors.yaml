callouts:
  - calloutType: "insight"
    title: "The Runtime-First Tradeoff in CNAPP Procurement"
    body: "Sysdig's primary competitive differentiation—deep kernel-level visibility powered by Falco—is simultaneously its primary operational vulnerability. In competitive sales cycles against Wiz, security teams must weigh the immediate gratification of frictionless agentless deployment against the operational rigor required to maintain eBPF probes across production Kubernetes clusters."
    claimRefs:
      - "CP005"
      - "CP006"
  - calloutType: "risk"
    title: "Open-Source Commoditization and Core Engine Exposure"
    body: "Because Falco is graduated by the CNCF under an Apache 2.0 license with maintainers across major tech vendors, the underlying detection engine is inherently non-proprietary. Sysdig's pricing durability relies entirely on commercial SaaS correlation, managed feeds, and enterprise compliance rather than proprietary algorithmic lock-in."
    claimRefs:
      - "CP014"
      - "CP015"
