callouts:
  - calloutType: strength
    title: Modular Pulser Economics and Established Physics Foundations
    body: Pacific Fusion bypasses expensive optical laser amplifiers and delicate superconducting magnets by utilizing modular impedance-matched Marx generator pulsers constructed largely from domestic commercial-grade electrical components. By anchoring its physics on the proven Magnetized Liner Inertial Fusion mechanism validated at Sandia National Laboratories, the company converts a multi-billion-dollar scientific unknown into a tractable modular hardware engineering and manufacturing challenge.
    claimRefs:
      - CE002
      - CE004
      - CE008
  - calloutType: risk
    title: Demonstration System Multi-Module Integration and Shot-Rate Scaling
    body: While Pacific Fusion has demonstrated 440 GW single-module peak power and over 3,000 shots on its Sirius pulser, integrating 156 synchronized modules into a 60 MA driver represents unprecedented pulsed-power complexity. Transitioning from demonstration shots to a repetitive utility-scale plant requires resolving chamber wall erosion, target cost reduction, and tritium fuel cycle closure.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE014
