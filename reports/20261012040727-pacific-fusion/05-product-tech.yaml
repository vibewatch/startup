  - id: TE003
    title: Technology Subsystems and Operating Architecture
    columns:
      - Architecture Layer / Component
      - Functional Role
      - Critical Dependency
      - Identified Technical Risk
    rows:
      - - Capacitor Energy Storage Banks
        - Store ~80 MJ electrical energy for rapid discharge
        - High-energy-density commercial capacitors
        - Capacitor dielectric degradation under repetitive shots
      - - Impedance-Matched Marx Generators
        - Pulse compression to 100 ns, 1.1 MV, 440 GW/module
        - Fast solid-state / gas closing switches
        - Switch electrode erosion and timing jitter between modules
      - - Magnetized Liner (MagLIF) Target
        - Deuterium-tritium fuel container compressed by current
        - Target fabrication precision and preheat laser
        - Instabilities (Rayleigh-Taylor) degrading fusion yield
      - - Reaction Chamber & First Wall
        - Absorb fusion pulse energy and breed tritium
        - Liquid metal / sacrificial wall protection
        - Neutron damage to structural materials and wall erosion
    notes: Architecture specifications based on Pacific Fusion technical disclosures and Demonstration System design parameters.
