company:
  name: Pacific Fusion
chapter:
  number: 5
  title: Product & Technology
  summary: Pacific Fusion is developing a modular, pulser-driven inertial fusion energy system based on Magnetized Liner Inertial Fusion (MagLIF) and proprietary Impedance-Matched Marx Generators. By utilizing commercial capacitor technology, direct electromagnetic compression, and a 156-module Demonstration System targeting over 60 MA, the company aims to achieve net facility gain (Q_f > 1) at roughly one-tenth the capital cost of laser ICF facilities. Key technical diligence blockers center on full-scale 156-module synchronization jitter, continuous high-rate repetitive pulsing, target cost economics, and closed-loop tritium breeding.
sections:
  - id: product-definition-commercial-workflow
    title: Product Definition and Commercial Fusion Workflow
    body: Pacific Fusion is developing an inertial fusion energy system engineered to deliver dispatchable, carbon-free firm baseload electrical power directly into regional transmission grids. Unlike intermittent renewable assets or inflexible nuclear fission plants, pulser-driven inertial fusion operates by repeatedly pulsing high-yield fusion reactions within a robust reaction chamber, capturing high-energy neutron thermal output to drive conventional supercritical steam turbine generators. The customer-facing product delivers high-capacity-factor baseload electricity and high-temperature industrial steam, offering utilities a direct zero-carbon replacement for retiring coal and natural gas infrastructure. By targeting levelized electricity production costs of 2 cents per kilowatt-hour by 2040, the company aims to undercut both fossil fuels and alternative advanced clean firm technologies. In addition to commercial grid firming and baseload supply, the system architecture offers dual-use value for high-yield laboratory physics research and stockpile stewardship, substantiated by Pacific Fusion's collaborative agreements with the National Nuclear Security Administration.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE011
      - CE012
    tableRefs:
      - TE002
  - id: operating-architecture-marx-generator
    title: Modular Driver Architecture and Impedance-Matched Marx Generator Technology
    body: At the core of Pacific Fusion's operating architecture is a modular pulsed-power driver powered by Impedance-Matched Marx Generators (IMG). Conventional pulsed-power systems like the Z facility at Sandia National Laboratories require massive water transmission lines and intermediate pulse-forming networks that dissipate significant energy. Pacific Fusion's IMG architecture, co-invented by Chief Technology Officer Keith LeChien, integrates pulse-shaping directly into the capacitive stages, effectively doubling overall driver efficiency and power density compared to legacy architectures. The system stores approximately 80 MJ of electrical energy in commercial capacitor banks and releases that energy in ultra-fast, 100-nanosecond high-current pulses exceeding 60 MA. This immense electromagnetic pulse drives Magnetized Liner Inertial Fusion (MagLIF) capsules, direct-driving metal liners to compress pre-heated and magnetized deuterium-tritium fuel to ignition conditions. Achieving net facility gain (Q_f > 1) demands flawless synchronization across 156 discrete pulser modules, representing the primary system integration hurdle.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE008
      - CE014
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: demonstration-system-asset-pipeline
    title: Demonstration System, Experimental Validation, and Development Pipeline
    body: Pacific Fusion's technology roadmap advances through a disciplined hardware verification pipeline designed to de-risk key subsystems before commissioning its full-scale Demonstration System. In California laboratory facilities, the Sirius prototype pulser serves as a continuous testbed for switch durability and capacitor longevity, successfully logging more than 3,000 executed shots as of July 2026. In June 2026, the engineering team demonstrated a fully scaled pulser module delivering over 440 GW of peak output power and approximately 1.1 MV peak voltage, establishing the single-module power threshold required to drive thermonuclear fusion. Parallel target physics experiments conducted at Sandia National Laboratories in February 2026 validated a modified target architecture that substantially simplifies target manufacturing and robotic chamber insertion. To transition from benchtop prototypes to full driver assembly, the company established an industrial manufacturing center in Los Lunas, New Mexico, to mass-produce 156 production modules. These modules feed the $1 billion Demonstration System facility currently under construction at Mesa del Sol in Albuquerque.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
