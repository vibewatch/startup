companyProfile:
  summary: >-
    Pacific Fusion is a private U.S. fusion-energy company developing a pulsed-power inertial fusion platform based on
    modular impedance-matched Marx generator pulsers. Founded in 2023 and headquartered in Fremont, California, the
    company is building a large Albuquerque Demonstration System to pursue net facility gain by 2030 while remaining
    pre-revenue and highly dependent on milestone-tranched capital.
