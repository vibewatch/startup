      - number: '5.2'
        title: Modular Driver Architecture and Impedance-Matched Marx Generator Technology
        blocks:
          - type: paragraph
            body: >-
              At the core of Pacific Fusion's operating architecture is a modular pulsed-power driver powered by
              Impedance-Matched Marx Generators (IMG). Conventional pulsed-power systems like the Z facility at Sandia
              National Laboratories require massive water transmission lines and intermediate pulse-forming networks
              that dissipate significant energy. Pacific Fusion's IMG architecture, co-invented by Chief Technology
              Officer Keith LeChien, integrates pulse-shaping directly into the capacitive stages, effectively doubling
              overall driver efficiency and power density compared to legacy architectures. The system stores
              approximately 80 MJ of electrical energy in commercial capacitor banks and releases that energy in
              ultra-fast, 100-nanosecond high-current pulses exceeding 60 MA. This immense electromagnetic pulse drives
              Magnetized Liner Inertial Fusion (MagLIF) capsules, direct-driving metal liners to compress pre-heated and
              magnetized deuterium-tritium fuel to ignition conditions. Achieving net facility gain (Q_f > 1) demands
              flawless synchronization across 156 discrete pulser modules, representing the primary system integration
              hurdle.
            claimRefs:
