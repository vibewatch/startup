      - number: '8.2'
        title: Core Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The central thesis for Pacific Fusion rests on the premise that pulsed magnetic inertial fusion offers a
              radically faster and more capital-efficient trajectory toward commercial fusion power than laser-driven or
              magnetic tokamak alternatives. Rather than relying on massive, fragile laser optics or expensive
              high-temperature superconducting magnetic coils, Pacific Fusion utilizes impedance-matched Marx generator
              pulsers composed of modular, mass-manufacturable electrical components capable of delivering two terawatts
              of peak electrical power per module over 100-nanosecond bursts. By collaborating with established nuclear
              industrial leaders like General Atomics to test components and pulser modules at its specialized test
              facility, Pacific Fusion seeks to de-risk engineering execution. Conversely, the anti-thesis highlights
              substantial unresolved scientific and operational hurdles that threaten commercialization. Net facility
              gain, while an essential physics milestone, does not prove grid-scale energy conversion, high-repetition
              chamber clearing, or economic plant survivability. Independent industry analysts point out that operating
              156 coupled modules under continuous high-energy repetitive discharge involves unprecedented material
              fatigue, tritium handling complexities, and severe thermal management constraints that remain unvalidated
              outside computer simulations.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
