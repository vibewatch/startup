  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Energy Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Commercial fusion energy targets the multi-trillion-dollar global market for wholesale baseload power,
              positioning itself as a zero-carbon, dispatchable electricity resource that directly displaces legacy
              fossil thermal generation such as coal and natural gas. Unlike intermittent renewable assets such as wind
              and solar photovoltaics that require multi-hour battery energy storage systems or redundant peaking
              turbines to maintain grid stability, fusion systems aim to supply uninterrupted, firm electrical output
              regardless of weather conditions or diurnal cycles. The addressable spend encompasses utility-scale
              wholesale power generation and long-duration capacity payments, while excluding distributed residential
              rooftop solar, retail electricity distribution, and mobile transportation fuels that fall outside
              centralized generation boundaries.


              At the same time, Pacific Fusion's pulser-driven inertial fusion energy architecture introduces a distinct
              near-term dual-use market. The company's modular impedance-matched Marx generator technology, capable of
              producing high-power electric currents and radiation bursts, creates valuable adjacent revenue
              opportunities in national security testing, pulsed x-ray environments, and neutron testing for government
              agencies such as the National Nuclear Security Administration (NNSA). This dual-use capability enables
              earlier commercial validation and testing revenue before full-scale commercial electric utility
              integration is technically achievable, providing a structured hedge against the extended timelines typical
              of utility infrastructure projects.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 'Constrained Sizing Lenses: TAM, SAM, and Early SOM Realities'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Pacific Fusion's addressable market requires decomposing broad global generation figures into
              realistic, evidence-constrained sizing layers. At the macroeconomic ceiling, global electricity
              consumption exceeds 29,000 terawatt-hours annually, representing a theoretical total addressable market
              (TAM) of more than $2 trillion in annual wholesale revenue. Within this universe, the serviceable
              addressable market (SAM) is defined by the clean firm capacity required to replace retiring coal and
              natural gas plants and to support load growth, representing roughly 10,000 TWh annually of baseload demand
              where intermittency is unacceptable to grid operators and heavy industrial consumers.


              However, the serviceable obtainable market (SOM) for Pacific Fusion over the next decade is governed by
              strict capital, licensing, and technological constraints. The company has secured $900 million in
              milestone-contingent Series A funding, a capital commitment that dwarfs the $15 million median funding
              round for energy ventures but remains modest relative to the capital required to build complete commercial
              power stations. Target economics project a long-term electricity cost of $0.02 per kilowatt-hour by 2040,
              but early commercialization before 2035 will be restricted to specialized high-value deployments, pilot
              demonstration facilities, and defense-adjacent testing installations where buyers can absorb higher
              initial unit costs.
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
