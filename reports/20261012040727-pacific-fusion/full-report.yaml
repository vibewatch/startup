      - number: '8.4'
        title: Underwriting Roadblocks, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Institutional capital seeking exposure to next-generation energy infrastructure faces distinct information
              barriers when evaluating Pacific Fusion. Secondary market liquidity on alternative trading platforms like
              Nasdaq Private Market remains tightly restricted to accredited investors, and private secondary trades
              provide no reliable price discovery or transaction volume transparency. Furthermore, Pacific Fusion has
              not published commercial power purchase agreements, utility memoranda of understanding, or hyperscale data
              center offtake letters of intent, leaving revenue timing and merchant power marketability entirely
              theoretical. Before an investment committee can contemplate primary or secondary equity participation,
              diligence must resolve specific operational blockers. Key diligence asks include obtaining the
              confidential Series A term sheet to analyze liquidation preference seniority, auditing the full-module
              pulser test logs from the Albuquerque facility, and reviewing third-party safety and environmental
              licensing assessments. Critical thesis-break triggers that would justify an outright Avoid recommendation
              include unresolvable pulser module jitter preventing synchronized fuel compression, cancellation of
              investor capital tranches, or regulatory denials on tritium fuel handling.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Research-More Governed by Valuation Opacity'
            body: >-
              Pacific Fusion represents one of the most compelling scientific engineering efforts in deep tech, backed
              by over $900M in milestone-tranched Series A capital and top-tier scientific leadership. However,
              disciplined institutional underwriting cannot issue a Buy recommendation in the total absence of share
              price, post-money valuation, cap table liquidation preferences, and commercial utility commitments.
              Investors should maintain a research-more stance and monitor full-module pulser testing and Albuquerque
              facility milestones.
