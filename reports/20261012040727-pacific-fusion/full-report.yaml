      - number: '8.3'
        title: Financing Context, Cap Table Dynamics, and Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion unique capitalization structure fundamentally shapes its underwriting risk profile. Rather
              than securing traditional venture rounds subject to cyclical market sentiment every 18 months, the company
              negotiated an all-in $900 million Series A commitment where capital is called as explicit technical
              milestones are verified by investors. While this structure insulates the founding engineering team from
              near-term financing turbulence and aligns incentives around hardware delivery, it introduces binary
              tranche risk: if the company misses critical integration deadlines, such as the 2028 commissioning of its
              Albuquerque Demonstration System, milestone tranches may freeze, causing immediate capital momentum loss.
              To assess risk-adjusted returns across possible futures, diligence models three operating scenarios. In
              the bull case, rapid validation of full-module performance unlocks subsequent tranches and establishes
              Pacific Fusion as the global leader in firm baseload energy. In the base case, integration complexity
              induces 12 to 24 month schedule delays, resulting in valuation plateauing and dilution from bridge
              extensions. In the bear case, pulser synchronization bottlenecks trigger tranche cancellations, leading to
              painful down-rounds or recapitalizations.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV011
              - CV012
