              Unlike pure magnetic confinement or laser fusion ventures targeting only wholesale electricity, Pacific
              Fusion's pulsed-power architecture creates a near-term institutional anchor in national security science.
              Exceeding 100 megajoules of burst yield provides the NNSA with a non-explosive stockpile stewardship
