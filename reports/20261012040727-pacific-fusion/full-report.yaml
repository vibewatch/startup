              pulser, integrating 156 synchronized modules into a 60 MA driver represents unprecedented pulsed-power
              complexity. Transitioning from demonstration shots to a repetitive utility-scale plant requires resolving
              chamber wall erosion, target cost reduction, and tritium fuel cycle closure.
            calloutType: risk
            claimRefs:
