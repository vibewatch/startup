  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Taxonomy & Heatmap
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion operates under a binary risk profile characteristic of capital-intensive hard-science
              ventures. Commercial viability hinges on validating a multi-megampere pulsed-power driver capable of
              compressing magnetized deuterium-tritium fuel targets to achieve net facility gain by 2030. Our risk
              taxonomy stratifies exposure across technical, regulatory, operational, and financial dimensions.
              High-severity threats concentrate around driver module scaling and capacitor repetition endurance, where
              component degradation under rapid multi-kilovolt discharge remains unproven at commercial duty cycles.
              Conversely, near-term regulatory risk is tempered by federal policy momentum classifying fusion under
              byproduct material rules rather than fission reactor standards. Milestone-based tranche funding creates
              additional execution pressure, as capital disbursements correlate directly with hardware delivery
              schedules.
