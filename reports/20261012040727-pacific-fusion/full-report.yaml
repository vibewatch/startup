      - number: '5.4'
        title: Technical Differentiation, IP Moat, and Industrial Partnerships
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's core competitive differentiation lies in the physics and capital efficiency of
              pulser-driven inertial fusion compared to both laser-driven IFE and steady-state magnetic confinement
              tokamaks. Laser-driven ignition systems, such as the National Ignition Facility, convert wall-plug
              electricity to laser light at less than 1% efficiency, requiring multi-billion-dollar optical glass chains
              that cannot economically scale to commercial power plants. In contrast, pulsed-power drivers deliver
              direct electromagnetic energy with driver efficiencies exceeding 10% to 20%, dramatically lowering the
              fusion gain required to achieve net facility gain. Furthermore, unlike magnetic confinement approaches
              that depend on complex, expensive high-temperature superconducting magnets and unproven divertor physics,
              Pacific Fusion constructs its pulsers from domestic, mass-manufacturable electrical components and
              off-the-shelf capacitors. This hardware simplicity is reinforced by strategic industrial partnerships,
              notably an ongoing collaboration with General Atomics for specialized pulser module testing and nuclear
              engineering support, alongside formal research alignment with the NNSA.
            claimRefs:
              - CE002
              - CE004
              - CE008
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Safety Controls, Tritium Fuel Cycle, and Technical Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              From a regulatory and safety perspective, pulsed inertial fusion eliminates catastrophic meltdown risks
              and runaway criticality accidents inherent to traditional nuclear fission. The fusion reaction occurs in
              discrete pulses, and shutting down the electrical driver instantly terminates fusion plasma production
              without residual decay heat emergencies. However, commercialization introduces non-trivial technical,
              licensing, and operational diligence gaps. While single-module electrical output has achieved 440 GW,
              simultaneous low-jitter discharge across 156 coupled modules in a shared vacuum environment remains
              unproven outside numerical simulations. Moreover, while single-shot net facility gain is targeted by 2030,
              a commercial utility power plant requires firing at repetitive multi-hertz frequencies, demanding robust
              chamber protection against 14 MeV neutron bombardment, rapid debris evacuation, and automated sub-dollar
              target fabrication. In addition, closed-loop tritium breeding within lithium-bearing chamber blankets must
              be engineered and licensed under domestic nuclear regulatory frameworks, areas where detailed public
              engineering data remains undisclosed.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE014
              - CE015
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Modular Pulser Economics and Established Physics Foundations
            body: >-
              Pacific Fusion bypasses expensive optical laser amplifiers and delicate superconducting magnets by
              utilizing modular impedance-matched Marx generator pulsers constructed largely from domestic
              commercial-grade electrical components. By anchoring its physics on the proven Magnetized Liner Inertial
              Fusion mechanism validated at Sandia National Laboratories, the company converts a multi-billion-dollar
              scientific unknown into a tractable modular hardware engineering and manufacturing challenge.
            calloutType: strength
            claimRefs:
