      - number: '6.4'
        title: Commercial Durability, Offtake Concentration, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Traditional enterprise software customer metrics such as Net Revenue Retention, Gross Revenue Retention,
              and cohort churn are entirely inapplicable to Pacific Fusion at its current stage of maturity. Customer
              durability in pre-commercial fusion is instead governed by milestone financing stability, partner
              retention, and political alignment. With more than $900 million in Series A capital committed across
              milestone-based tranches, the company faces severe concentration risk tied to technical execution rather
              than customer churn: failing to demonstrate full-scale module operation or slipping past 2028
              demonstration system commissioning would jeopardize future funding tranches. Public secondary trading via
              platforms like Nasdaq Private Market remains restricted to accredited investors, reflecting illiquid
              private ownership. Furthermore, specialized fusion intelligence services track Pacific Fusion behind
              commercial investor paywalls, underscoring the scarcity of audited public customer disclosures. A profound
              diligence gap exists regarding customer procurement friction. Power purchase agreements in the utility
              sector typically require multi-year regulatory approvals, demonstrated plant availability above ninety
              percent, and stringent credit guarantees that pre-commercial startups cannot readily provide. Underwriting
              Pacific Fusion therefore requires recognizing that commercial durability will remain unprovable until
              full-scale facility operation demonstrates economic viability.
