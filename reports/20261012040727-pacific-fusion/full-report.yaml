  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Commercial Fusion Workflow
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion is developing an inertial fusion energy system engineered to deliver dispatchable,
              carbon-free firm baseload electrical power directly into regional transmission grids. Unlike intermittent
              renewable assets or inflexible nuclear fission plants, pulser-driven inertial fusion operates by
              repeatedly pulsing high-yield fusion reactions within a robust reaction chamber, capturing high-energy
              neutron thermal output to drive conventional supercritical steam turbine generators. The customer-facing
              product delivers high-capacity-factor baseload electricity and high-temperature industrial steam, offering
              utilities a direct zero-carbon replacement for retiring coal and natural gas infrastructure. By targeting
              levelized electricity production costs of 2 cents per kilowatt-hour by 2040, the company aims to undercut
              both fossil fuels and alternative advanced clean firm technologies. In addition to commercial grid firming
              and baseload supply, the system architecture offers dual-use value for high-yield laboratory physics
              research and stockpile stewardship, substantiated by Pacific Fusion's collaborative agreements with the
              National Nuclear Security Administration.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
              - CE012
