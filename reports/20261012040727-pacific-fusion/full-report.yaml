  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Target Market Segments: Defense, Utilities, and Industrial Power'
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion addresses a multi-tiered commercial market shaped by distinct power requirements,
              procurement timelines, and risk appetites. At the apex of near-term commercial relevance sits the national
              security and defense sector, where the Department of Energy's National Nuclear Security Administration
              requires high-yield experimental capabilities to maintain the United States nuclear stockpile without
              explosive underground testing. While conventional fusion ventures focus exclusively on long-duration
              electricity grids, Pacific Fusion's pulsed-power architecture offers rapid high-yield bursts exceeding 100
              megajoules, creating a unique institutional application that precedes commercial electricity generation.
              Beyond defense science, regulated electric utilities represent the primary high-volume customer segment.
              Investor-owned utilities such as the Public Service Company of New Mexico face escalating mandates under
              state carbon-free standards to replace retiring coal and natural gas capacity with firm, non-intermittent
              clean power. A third emerging segment consists of hyperscale data centers and artificial intelligence
              computing facilities, where acute regional grid interconnection bottlenecks create substantial willingness
              to procure behind-the-meter clean baseload power. Finally, heavy industrial manufacturing presents
              long-term potential for modular pulsed-power units delivering co-located process heat and electricity.
              However, commercial diligence reveals that across all four segments, binding commercial agreements remain
              absent, leaving target customer sizing primarily conceptual.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU010
