      - number: '4.2'
        title: Cost Structure, Capex Intensity, and Unit Economic Drivers
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion cost architecture is deliberately structured around modularity and domestic mass
              manufacturability to avoid the severe capital expenditure escalation typical of custom one-off fusion
              research devices. The core driver consists of 156 identical shipping-container-sized pulsed-power modules,
              which utilize commercial capacitors and fast electrical switches rather than expensive high-power laser
              banks or cryogenic superconducting magnets. This design philosophy directly underpins the company target
              levelized cost of electricity (LCOE) of $0.02 per kWh by 2040, predicated on continuous manufacturing
              learning curves across thousands of standardized capacitor-switch bricks. Operating expense and capital
              maintenance will be governed by component durability, where recent prototype testing has demonstrated over
              3,000 shots. Nevertheless, full-scale plant capital expenditure, target manufacturing cost per modular
              container, and balance-of-plant thermal conversion efficiency remain closely held private data,
              representing significant analytical gaps for project-finance underwriting.
            claimRefs:
              - CI004
              - CI006
