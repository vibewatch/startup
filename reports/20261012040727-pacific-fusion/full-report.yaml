      - number: '4.3'
        title: Capital Adequacy, Milestone-Gated Tranches, and Forward Runway
        blocks:
          - type: paragraph
            body: >-
              To manage the immense capital intensity of fusion development, Pacific Fusion raised an extraordinary
              Series A financing round exceeding $1 billion led by General Catalyst. The round employs a milestone-gated
              tranche structure modeled after biotechnology development: total capital is committed upfront, but
              disbursements are unlocked sequentially as specific engineering milestones are verified. The company has
              already achieved its first two milestone gates—including achieving 440 gigawatts of peak power in an
              80-nanosecond pulse from a subscale prototype pulser module—unlocking subsequent capital to break ground
              on a $1 billion research and manufacturing campus in Albuquerque, New Mexico. While this structure aligns
              capital outlay with systematic physical de-risking and shields the firm from frequent dilutive financings,
              it introduces binary operational exposure: if the demonstration system misses its 2028 commissioning
              target, milestone capital momentum could stall. Private secondary share liquidity remains restricted to
              accredited investors on alternative trading systems with no public pricing discovery.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI009
              - CI010
              - CI012
      - number: '4.4'
        title: Financial Diligence Verdict, Asymmetric Risks, and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Pacific Fusion represents an exceptionally capitalized but
              binary frontier energy venture. The milestone-tranche governance framework provides superior capital
              discipline compared to open-ended research subsidies, ensuring that the substantial $1 billion capital
              pool is expended only against tangible hardware milestones. However, because Pacific Fusion has zero
              realized revenue, unproven long-term component degradation rates, and no creditworthy customer off-take
              guarantees, the company cannot be underwritten on conventional discounted cash flow or recurring revenue
              metrics. Institutional underwriters face material information blockers regarding the Series A liquidation
              preferences, per-module unit manufacturing economics, and regulatory site permitting costs. Commercial
