        title: 'Institutional Counterparties: NNSA, General Atomics, and PNM'
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion's customer proof is characterized by high-profile institutional alignment rather than
              commercial sales contracts. In August 2026, the company executed a public-private Memorandum of
              Understanding with the National Nuclear Security Administration regarding collaboration on high-yield
              fusion, high-energy-density science, and pulsed-power technologies. This memorandum formalizes federal
              interest in utilizing Pacific Fusion's Albuquerque facility for science-based stockpile stewardship,
              establishing the NNSA as an essential institutional stakeholder. Concurrently, regional utility leadership
              has signaled openness to future offtake: Don Tarry, President and Chief Executive Officer of the Public
              Service Company of New Mexico, participated in the Albuquerque groundbreaking, noting that fusion could
              support the utility's decarbonization objectives under the New Mexico Energy Transition Act. On the
              industrial engineering side, General Atomics collaborates extensively with Pacific Fusion to manufacture
              and test production-scale pulser modules capable of delivering two terawatts of peak electrical power.
              While these relationships provide critical technical credibility, rigorous diligence must distinguish
              institutional collaboration from commercial customer adoption. The NNSA agreement is a non-binding
              research framework rather than a procurement contract, and PNM has not executed a power purchase
              agreement, interconnection study, or capital commitment. Pacific Fusion therefore maintains zero paying
              commercial customers or contracted offtake capacity.
