  - id: FE001
    title: Pulsed-Power Inertial Fusion System Stack
    type: stack
    summary: >-
      Layered architecture of Pacific Fusion's pulser-driven inertial fusion system from energy storage through
      electricity generation.
    data:
      layers:
        - name: Energy Storage Layer
          label: Energy Storage Layer
          detail: Grid charging and bulk capacitor banks storing ~80 MJ electrical energy
          items:
            - Commercial off-the-shelf high-density capacitor banks
            - Charging power supplies and safety dump systems
        - name: Pulse Compression Layer
          label: Pulse Compression Layer
          detail: 156 Impedance-Matched Marx Generator modules delivering ultra-fast current rise
          items:
            - Low-inductance gas and solid-state closing switches
            - Impedance-matching transmission line networks
        - name: Current Convergence & Transmission
          label: Current Convergence & Transmission
          detail: Magnetically insulated transmission lines channeling >60 MA into vacuum chamber
          items:
            - Central vacuum convolute and load interface
            - Magnetic field coils establishing axial pre-magnetization
        - name: Target Assembly & Implosion
          label: Target Assembly & Implosion
          detail: Magnetized liner inertial fusion (MagLIF) cylindrical DT fuel capsule
          items:
            - Cylindrical metal liner containing deuterium-tritium
            - Laser pre-heating and magnetic flux compression
        - name: Reaction Chamber & Blanket
          label: Reaction Chamber & Blanket
          detail: Chamber vessel capturing 14 MeV neutrons, thermal energy, and breeding tritium
          items:
            - Sacrificial first wall protection / liquid liner
            - Lithium-bearing blanket for tritium replenishment
        - name: Power Conversion & Balance of Plant
          label: Power Conversion & Balance of Plant
          detail: Thermal heat exchange driving standard steam turbine generator for grid output
          items:
            - High-temperature heat exchangers and steam cycle
            - Grid interconnection and auxiliary house-load recirculating power
    approximationNotes: >-
      Driver energy storage and peak current targets reflect Demonstration System design specifications; commercial
      blanket and turbine integration represent conceptual power plant roadmap.
