      - number: '7.2'
        title: Regulatory, Licensing & Policy Dynamics
        blocks:
          - type: paragraph
            body: >-
              From a regulatory perspective, Pacific Fusion benefits from significant structural tailwinds relative to
              traditional nuclear developers. The Nuclear Regulatory Commission has proposed governing commercial fusion
              systems under a 10 CFR Part 30 byproduct materials framework, avoiding the burdensome licensing overhead
              and multi-year environmental reviews mandated for Part 50 fission reactors. In parallel, the company has
              engaged federal lobbying representation to advocate across defense, energy, appropriations, and fusion tax
              parity legislation, expending more than $700,000 across four consecutive quarters. At the state level,
              Pacific Fusion's planned $1 billion Albuquerque campus is tied to performance-based economic development
              incentives from New Mexico. These incentives remain contingent on verified job creation and capital
              deployment milestones, establishing a compliance and municipal oversight obligation.
