      - number: '1.4'
        title: 开发里程碑、技术执行与不利风险画像
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的技术路线图，核心是证明脉冲功率驱动器可以用国产工业部件低成本批量制造，而不是依赖高度定制的实验室设备。2026 年 5 月，公司与 Lawrence Livermore
              National Laboratory 合作时取得关键验证：Sirius 四级阻抗匹配 Marx 发生器原型连续运行超过 3,000 shots。在 Albuquerque 建设中的完整
              Demonstration System 计划组装约 156 个相同模块，向磁化靶材施加巨大的 60 mega-ampere 电流脉冲。尽管工程进展很快，外部分析师和市场批评者仍强调：2030
              年实现设施净增益，并不会自动解决电网级发电转换、换热器寿命或可持续氚燃料增殖问题。此外，Series A 资金释放严格取决于中间目标；如果进度晚于预计的 2028 年系统调试节点，融资节奏将面临急剧放缓风险。
