  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标市场分层：国防、公用事业与工业电力
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 面向一个多层商业市场，各层的电力需求、采购周期和风险承受力不同。短期商业相关性最高的是国家安全和国防领域：能源部 NNSA
              需要高产额实验能力，在不进行地下核爆的情况下维护美国核库存。传统聚变项目只关注长期电网供电，而 Pacific Fusion 的脉冲功率架构可快速产生超过 100 megajoules
              的高产额爆发，在商业发电前先满足独特的机构用途。国防科研之外，受监管电力公用事业是主要的大体量客户。Public Service Company of New Mexico
              等投资者所有公用事业，正面对州级无碳标准带来的压力，需要用稳定、非间歇性的清洁电力替代退役煤电和燃气容量。第三个新兴客群是超大规模数据中心和人工智能计算设施；区域并网瓶颈严重，促使它们愿意采购表后清洁基荷电力。最后，重工业制造业长期可能采购提供共址工艺热和电力的模块化脉冲功率单元。但商业尽调显示，四类市场都没有具约束力的商业协议，目标客户规模仍主要停留在概念阶段。
