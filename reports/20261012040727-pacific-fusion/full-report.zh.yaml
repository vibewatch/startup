      - number: '2.3'
        title: 买方分层、经济预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              聚变能源的采用路径分成四类主要买方，每类的采购标准、风险偏好和预算归属都不同。受监管的投资者所有公用事业（IOUs）和独立发电商（IPPs）是公用事业规模基荷电力的主要成交市场，但采购周期受公共事业委员会、综合资源计划（IRPs）和严格工程可靠性标准约束；在缺乏大量运行数据前，它们不会采购未经验证的首台套反应堆。因此，Pacific
              Fusion 与 General Atomics 的工程合作，是建立技术可信度、让部件设计符合公用事业并网标准的重要前置通道。

              另一方面，运营人工智能数据中心的超大规模科技公司，是动机强、资金足的早期买家。面对前所未有的负荷增长和地区并网延迟，这些公司既需要全天候无碳能源，也有能力签订直接承购协议、表后共址合同和预先市场承诺。同时，NNSA
              等政府国防机构掌握专门的测试和脉冲功率模拟预算，可通过双边合同及公私合作调用，在商业电站许可推进期间提供早期、非稀释性的验证。
            claimRefs:
              - CM002
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
