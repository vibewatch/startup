  - id: FE001
    title: 脉冲功率惯性聚变系统栈
    type: stack
    summary: Pacific Fusion 脉冲器驱动惯性聚变系统从能量存储到发电的分层架构。
    data:
      layers:
        - name: Energy Storage Layer
          label: 能量存储层
          detail: 电网充电和大容量电容器组，储存约 80 MJ 电能
          items:
            - 商用现货高密度电容器组
            - 充电电源和安全泄放系统
        - name: Pulse Compression Layer
          label: 脉冲压缩层
          detail: 156 个阻抗匹配 Marx 发电机模块，实现超快电流上升
          items:
            - 低电感气体及固态闭合开关
            - 阻抗匹配传输线网络
        - name: Current Convergence & Transmission
          label: 电流汇聚与传输
          detail: 磁绝缘传输线将 >60 MA 电流导入真空腔室
          items:
            - 中央真空汇流器和负载接口
            - 建立轴向预磁化的磁场线圈
        - name: Target Assembly & Implosion
          label: 靶丸组件与内爆
          detail: 磁化套筒惯性聚变（MagLIF）圆柱形 DT 燃料靶丸
          items:
            - 含氘氚燃料的圆柱形金属套筒
            - 激光预热和磁通压缩
        - name: Reaction Chamber & Blanket
          label: 反应腔室与包层
          detail: 腔室容器捕获 14 MeV 中子和热能，并增殖氚
          items:
            - 牺牲型第一壁保护／液态套筒
            - 用于补充氚的含锂包层
        - name: Power Conversion & Balance of Plant
          label: 电力转换与厂务系统
          detail: 热交换驱动标准蒸汽轮机发电机，向电网输出电力
          items:
            - 高温热交换器和蒸汽循环
            - 电网并网及辅助厂用循环电力
