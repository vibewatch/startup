  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 立场／评级
      - 关键证据与依据
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 卓越的技术履历和 $900M 资金承诺，被零公开估值标记及商业验证不足所抵消。
        - 拒绝参与未定价轮次；跟踪里程碑执行，等待可审计的入场条款。
      - - 信心
        - 中等
        - 第一阶段脉冲器部件提前完成演示，但全模块集成和电站经济性仍未经证明。
        - 在提高信心评级前，先验证全模块性能数据并确认 Albuquerque 设施投运。
      - - 风险评级
        - 高
        - 资本密集度极高、重复放电生存能力未经验证、氚来源受限，且资金分批拨付受里程碑门控。
        - 按严格的分批资金损失止损标准评估，并设置强约束性的下行保护契约。
      - - 估值立场
        - unknown
        - 投后估值、股价、清算优先权和持股比例均完全未披露。
        - 不要臆测估值；尽调期间必须核验一手股权表。
    notes: 对资本结构、技术执行和风险评估等投委会尽调维度的综合判断。
