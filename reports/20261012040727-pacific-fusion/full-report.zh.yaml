      - number: '2.4'
        title: 采用驱动、结构性瓶颈与尽调风险
        blocks:
          - type: paragraph
            body: >-
              推动投资者和客户关注 Pacific Fusion 的长期顺风，是电力需求的结构性拐点。经历数十年停滞后，电力公用事业和科技运营商正因 AI
              训练集群扩张、工业回流，以及建筑供热和交通全面电气化而面临巨大负荷增长。企业净零承诺和日益严格的化石燃料监管，又抬高了对可调度清洁电力的竞争需求；在这个环境下，电力可得性已经成为高毛利技术增长的硬约束。

              但需求顺风并不能消除商业化的技术和财务瓶颈。2030 年实现设施净增益是必要的科学里程碑，却留下了复杂的 balance-of-plant 工程问题。商业可行性要求把原型模块扩展到 156 个同步的阻抗匹配
              Marx 发生器脉冲器，以高重复频率反复放电；同时还要处理腔室壁侵蚀、氚燃料循环和可靠取热。由于资本按阶段硬件示范结果分批拨付，任何模块验证延误都会削弱融资动能，并可能把商业部署推迟到 2035 年以后。
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 设施净增益之后的商业化缺口
            body: >-
              2030 年实现设施净增益只是必要的科学门槛；商业采用仍要解决点火后的严重工程问题：156 个 Marx 发生器模块同步放电、腔室第一壁承受反复 multi-megajoule
              脉冲的寿命，以及经济可行的氚燃料循环增殖。
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
          - type: callout
            title: 双用途脉冲功率衔接短期收入
            body: Pacific Fusion 的阻抗匹配 Marx 发生器脉冲器技术，在国家安全测试、微波产生和辐射效应模拟中提供短期变现选择，在公用事业规模电站成熟前先带来非公用事业收入。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与直接聚变同业类型
        blocks:
          - type: paragraph
            body: >-
              商业聚变行业的特点，是少数私营开发商之间高度集中的资本竞争；这些公司都希望在 2030 年前证明净能量增益。据行业估算，聚变领域已吸引超过 $7 billion
              私人风险资本，绝大多数集中在三家领先者：Commonwealth Fusion Systems、Helion Energy 和 Pacific Fusion。Commonwealth Fusion Systems
              代表稳态磁约束路线，采用高温超导磁体，在与 MIT 合作开发的紧凑托卡马克中压缩等离子体。Helion Energy 采用脉冲磁惯性等离子体加速器，计划通过 Faraday
              感应直接回收电能，不走传统蒸汽轮机循环。Pacific Fusion 则成为资金最充足的脉冲器驱动磁化套筒惯性聚变（MagLIF）代表，已筹集约 $900 million
              推进电容器驱动的脉冲功率商业化。除直接聚变创业公司外，公司还面临小型模块化裂变反应堆（SMRs）、先进地热和配套碳捕集的联合循环天然气等现状竞争；这些方案已能或接近能为高耗电超大规模客户和工业客户提供稳定基荷电力。
            claimRefs:
              - CP001
              - CP004
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP012
      - number: '3.2'
        title: 技术架构与约束能力对比
        blocks:
          - type: paragraph
            body: >-
              聚变开发商的差异，根本上取决于驱动器墙插效率、物理成熟度和 balance-of-plant 复杂度。Pacific Fusion 结合了 National Ignition Facility 在 2022
              年证明实验室科学增益 Q>1 的成果，以及 Sandia National Laboratories Z-machine
              建立磁驱动套筒内爆物理的成果。不同于部署数十亿美元、且电光转换效率低的激光束线，Pacific Fusion 使用模块化阻抗匹配 Marx 发生器脉冲器，以 100-nanosecond
              爆发脉冲把强电流直接送入等离子体燃料囊。在实验室测试中，公司称 Sirius 脉冲功率原型截至 2026 年 7 月已超过 3,000 shots。公司正与 General Atomics
              合作测试脉冲器模块和硬件部件，为整合计划于 2028 年调试的 156 模块 Demonstration System
              验证模块化驱动架构。稳态托卡马克虽避免离散燃料丸注入，却需要大型低温制冷厂维持超导磁线圈，会产生显著寄生电负荷。Pacific Fusion
              的固态脉冲器驱动器具备更高墙插效率，但仍需解决电网级节奏下的反复放电腔室清理和靶材注入。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
