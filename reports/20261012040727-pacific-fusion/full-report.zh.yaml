      - number: '5.2'
        title: 模块化驱动架构与阻抗匹配 Marx 发生器技术
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 运营架构的核心，是由 Impedance-Matched Marx Generators（IMG）驱动的模块化脉冲功率驱动器。Sandia National Laboratories
              的 Z facility 等传统脉冲功率系统，需要庞大的水传输线和中间脉冲成形网络，会耗散大量能量。Pacific Fusion 的 IMG 架构由首席技术官 Keith LeChien
              共同发明，把脉冲整形直接集成到电容级中，相比旧架构几乎将整体驱动效率和功率密度翻倍。系统在商用电容器组中储存约 80 MJ 电能，再以超过 60 MA 的超快 100-nanosecond
              高电流脉冲释放。强大的电磁脉冲驱动 Magnetized Liner Inertial Fusion（MagLIF）囊体，直接推动金属套筒压缩预热并磁化的氘氚燃料，使其达到点火条件。要实现设施净增益（Q_f >
              1），156 个独立脉冲器模块必须完美同步，这是系统集成的首要难题。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
              - CE014
