      - number: '6.2'
        title: 示范里程碑与商业采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 2023 年成立，是一家深科技开发公司，目前没有商业运营历史、经常性收入或客户采用指标。商业轨迹完全受实体工程里程碑约束。2024 年末至 2025 年初，公司在 Fremont
              Test Center 完成阻抗匹配 Marx 发生器脉冲器部件的初步验证测试，单日连续满功率 shot 超过 100 次。2026 年 8 月，公司在 Albuquerque Mesa del Sol 破土建设
              $1 billion Research and Manufacturing Campus，完成最大的一次运营扩张。该设施计划组装并容纳 Demonstration System，即约 150 至 156
              个脉冲器模块组成的集成阵列，目标在 2030 年实现设施净增益。设施净增益——整个设施的聚变能量输出超过其储存的电能输入——是开展商业电力对话不可绕过的门槛。独立分析师强调，即使公司达成 2030
              年净增益目标，商业电子到达电网前仍有重大工程障碍，包括反复放电腔室寿命、快速靶材注入和闭环氚增殖。长期商业采用目标是 2040 年批量制造模块化电站，以约 $0.02 per kilowatt-hour
              供应批发电力，但这些预测还没有第三方运营数据验证。
            claimRefs:
