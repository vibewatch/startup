        - 高
        - 多投资者银团结构，获得广泛机构支持
        - 资金分批拨付受严格物理指标和示范交付成果锁定
      - - 市政基础设施与选址支持
        - New Mexico 州政府与 Albuquerque 市
        - 场地基础设施、公用事业并网及税收激励
        - 低
        - 市政电网并网延迟或地方行政交接
        - 中等
        - 两党积极协调立法，并推进 Mesa del Sol 总体规划
        - 高峰充电负荷需要当地公用事业升级输电容量
