      - number: '5.4'
        title: 技术差异化、IP 护城河与工业合作
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的核心差异化，在于脉冲器驱动惯性聚变相对于激光驱动 IFE 和稳态磁约束托卡马克的物理与资本效率。National Ignition Facility
              等激光点火系统把墙插电能转成激光光，效率低于 1%，需要数十亿美元的光学玻璃链条，无法经济地扩展到商业电站。脉冲功率驱动器则直接输送电磁能，驱动效率超过 10% 到
              20%，显著降低实现设施净增益所需的聚变增益。此外，磁约束路线依赖复杂昂贵的高温超导磁体和未经验证的偏滤器物理；Pacific Fusion
              的脉冲器由国内可批量制造的电气部件和现货电容器构成。这种硬件简洁性还得到战略工业合作强化，尤其是与 General Atomics 持续合作测试专业脉冲器模块并提供核工程支持，同时与 NNSA 保持正式研究协同。
            claimRefs:
              - CE002
              - CE004
              - CE008
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: 安全控制、氚燃料循环与技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从监管和安全角度看，脉冲惯性聚变没有传统裂变固有的灾难性熔毁和失控临界事故风险。聚变反应以离散脉冲发生，关停电驱动器即可立即终止等离子体产生，不会留下余热紧急事故。但商业化会带来不少技术、许可和运营尽调缺口。虽然单模块电输出已达到
              440 GW，但在共享真空环境中让 156 个耦合模块同时低抖动放电，除数值模拟外仍未被证明。即便 2030 年目标是单次放电实现设施净增益，商业公用事业电站仍须以每秒多次的重复频率开火，要求腔室抵御 14
              MeV 中子轰击、快速排出碎屑，并自动制造低于一美元的靶材。此外，含锂腔室毯层内的闭环氚增殖必须在国内核监管框架下完成工程设计并取得许可；这些领域的详细公开工程数据仍未披露。
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE014
              - CE015
      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 模块化脉冲器经济性与成熟物理基础
            body: >-
              Pacific Fusion 使用主要由国内商用级电气部件构成的模块化阻抗匹配 Marx 发生器脉冲器，绕开昂贵的光学激光放大器和脆弱的超导磁体。公司以 Sandia National Laboratories
              验证过的 Magnetized Liner Inertial Fusion 机制为物理基础，把数十亿美元级的科学未知转成可处理的模块化硬件工程和制造问题。
            calloutType: strength
            claimRefs:
              - CE002
              - CE004
              - CE008
          - type: callout
            title: Demonstration System 多模块集成与 shot 率扩展
            body: >-
              Pacific Fusion 的 Sirius 脉冲器已展示 440 GW 单模块峰值功率和超过 3,000 shots，但把 156 个同步模块整合成 60 MA 驱动器，仍是前所未有的脉冲功率复杂度。从示范
              shot 走向重复运行的公用事业规模电站，还要解决腔室壁侵蚀、靶材降本和氚燃料循环闭合。
            calloutType: risk
            claimRefs:
              - CE003
              - CE005
              - CE006
