    summary: 连接资本承诺、技术证明点、投资判断障碍和投资立场的决策路径。
    data:
      nodes:
        - id: step-1
          label: 资本承诺
          detail: $900M+ 里程碑分批 Series A 为核心硬件开发里程碑提供资金续航
        - id: step-2
          label: 部件验证
          detail: 第一阶段模块化脉冲器组件在公司测试中心提前完成验证
        - id: step-3
          label: 全模块规模化
          detail: 在复制 155 个模块前，持续进行单个 2 TW 模块的工程演示
        - id: step-4
          label: 投资判断缺口
          detail: 投后估值未披露、没有公开股权结构表详情，且缺少商业承购
        - id: step-5
          label: 投资结论
          detail: 定价纪律和商业验证不足，决定建议继续研究，而非买入
        - id: step-6
          label: 尽调路线图
          detail: 跟踪 Albuquerque 投运、全模块测试数据及具有约束力的公用事业合作公告
      edges:
        - from: step-1
          to: step-2
