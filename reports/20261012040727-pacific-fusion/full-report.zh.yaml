  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 管理层建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的投资画像十分特殊：机构级科学信誉、顶尖国家实验室领导力，以及由 General Catalyst 领投的 $900 million 里程碑分批 Series A
              融资，都是其支撑。公司希望通过模块化、脉冲器驱动的磁化套筒惯性聚变系统，攻克人类最难的物理挑战之一，并在 2030
              年实现设施净增益。公司采用资本催缴联合体结构，只有技术里程碑得到验证后才会解锁融资；它在九个月内交付了 Phase 1 的基础组件，明显早于原定的 12 到 18
              个月。尽管技术进展显著，审慎的投资判断仍需要严格控制价格，并看清资产估值。Pacific Fusion 是一家不透明的私人公司：没有披露任何 post-money
              估值、股价或商业承购合同，清算优先权也属机密，因此无法给出 Buy 投资评级。在经审计的股权结构表条款和完整模块演示指标可获得前，尽调只能给出继续研究的建议，估值立场则为未知。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
