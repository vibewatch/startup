      - number: '5.3'
        title: Demonstration System、实验验证与开发管线
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的技术路线通过严格的硬件验证管线推进，先给关键子系统去风险，再调试完整 Demonstration System。在加州实验室，Sirius
              原型脉冲器持续测试开关耐久性和电容器寿命，截至 2026 年 7 月已成功记录超过 3,000 次 shot。2026 年 6 月，工程团队展示了完整规模的脉冲器模块，峰值输出功率超过 440 GW、峰值电压约
              1.1 MV，达到了驱动热核聚变所需的单模块功率门槛。2026 年 2 月，Sandia National Laboratories
              开展的并行靶材物理实验验证了改良靶材架构，大幅简化靶材制造和机器人送入腔室。为从台式原型转向完整驱动器组装，公司在新墨西哥州 Los Lunas 建立工业制造中心，批量生产 156
              个量产模块。这些模块将供应目前在 Albuquerque Mesa del Sol 建设中的 $1 billion Demonstration System 设施。
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE009
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
