      - number: '8.2'
        title: 核心投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的核心逻辑是：相比激光驱动或磁约束托卡马克，脉冲磁惯性聚变可能以更快、资本效率更高的路径走向商业聚变电力。Pacific Fusion
              不依赖庞大而脆弱的激光光学系统，也不依赖昂贵的高温超导磁线圈，而是使用阻抗匹配的 Marx 发生器脉冲器；这些脉冲器由可模块化、可大批量制造的电气组件组成，每个模块都能在 100
              纳秒脉冲中输出两太瓦峰值电功率。公司还与 General Atomics
              等成熟核工业伙伴合作，在专用测试设施中测试组件和脉冲器模块，以降低工程执行风险。反向逻辑则指出，商业化仍面临大量未解决的科学和运营障碍。设施净增益虽是关键物理里程碑，却不能证明电网规模的能量转换、高重复频率清腔能力或电站具备经济可持续性。独立行业分析师指出，连续高能量重复放电运行
              156 个耦合模块，会带来前所未有的材料疲劳、氚处理复杂性和严苛的热管理约束；这些问题在计算机模拟之外仍未得到验证。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: 融资背景、股权结构表动态与情景建模
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 独特的资本结构从根本上决定了其投资判断风险。公司没有每 18 个月参与一次受周期性市场情绪影响的传统风险融资，而是谈下总额 $900 million 的 Series A
              承诺，投资人核实明确的技术里程碑后再催缴资金。这种结构让创始工程团队免受近期融资波动影响，也把激励与硬件交付对齐；但它引入了二元分批风险：如果错过关键整合节点，例如 2028 年调试 Albuquerque
              Demonstration System，里程碑资金可能冻结，资本动能会立即减弱。为评估不同未来下的风险调整后回报，尽调建立了三个运营情景。乐观情景中，完整模块性能迅速得到验证，后续资金解锁，Pacific
              Fusion 成为全球稳定基荷能源领导者。基准情景中，整合复杂度导致进度延误 12 到 24 个月，估值停滞，并因过桥融资延期而被稀释。悲观情景中，脉冲器同步瓶颈触发分批资金取消，导致痛苦的下轮融资或资本重组。
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: 投资判断障碍、尽调要求与逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              寻求布局下一代能源基础设施的机构资本，在评估 Pacific Fusion 时会遇到明显的信息壁垒。Nasdaq Private Market
              等另类交易平台的二级市场流动性仍严格限于合格投资者，私人二级交易也无法提供可靠的价格发现或交易量透明度。此外，Pacific Fusion
              尚未发布商业购电协议、公用事业谅解备忘录或超大规模数据中心承购意向书，因此收入时间表和商用电力的可销售性仍停留在理论阶段。投资委员会考虑参与新股或老股之前，尽调必须先解决具体的运营阻塞点。核心要求包括取得机密
              Series A 条款清单以分析清算优先权顺位、审计 Albuquerque
              设施的完整模块脉冲器测试日志，以及审阅第三方安全与环境许可评估。若脉冲器模块抖动无法消除并阻止燃料同步压缩、投资人资本分批被取消，或氚燃料处理遭监管拒绝，就足以触发逻辑失效，并支持直接给出回避建议。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资立场：估值不透明，继续研究
            body: >-
              Pacific Fusion 是深科技领域最值得关注的科学工程项目之一，背后有超过 $900M 的里程碑分批 Series A 资本和顶尖科学领导力。但在完全缺少股价、post-money
              估值、股权结构表清算优先权和商业公用事业承诺的情况下，严谨的机构投资判断不能给出 Buy 建议。投资人应维持继续研究的立场，持续跟踪完整模块脉冲器测试和 Albuquerque 设施里程碑。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV014
