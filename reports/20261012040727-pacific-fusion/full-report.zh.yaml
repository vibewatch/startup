  - id: TV002
    title: 正／反论点表
    columns:
      - 类别
      - 正方论点
      - 反方论据
      - 关键尽调／触发条件
    rows:
      - - 技术与可扩展性
        - 脉冲磁约束聚变采用模块化国产硬件，避开巨型激光光学系统和特殊超导磁体。
        - 全尺寸 156 模块驱动器、高重复频率腔室清空和靶丸注入均完全未经验证。
        - 在 Albuquerque 设施完成可核验的全脉冲器模块演示，并达到 2 TW 峰值输出规格。
      - - 资本与结构
        - $900M 分批融资消除了近期风险投资再融资风险，并执行严格的技术里程碑门槛。
        - 资金催缴结构意味着错过里程碑就会冻结后续批次，骤然形成流动性悬崖。
        - 确认里程碑签署标准，以及 Series A 银团中的托管资金储备。
      - - 经济竞争力
        - 更简单的架构目标是在 2040 年实现每千瓦时 2 美分的电价，显著低于传统核电和激光聚变。
        - 公司尚无收入，目标制造成本、腔室更换周期和电站寄生负荷均没有运营数据。
        - 由独立技术经济模型审计真实商业运行周期下的平准化能源成本。
      - - 商业承购
        - 数据中心和公用事业对稳定、零碳基荷电力的巨大需求，带来近乎无限的可触达市场。
        - 尚未披露任何有约束力的购电协议、意向书或公用事业试点协议。
        - 宣布首个商业锚定买家、超大规模数据中心伙伴或公用事业并网研究。
    notes: 将核心投资判断假设与技术、商业及结构性反方论据进行结构化对照。
    claimRefs:
      - CV004
      - CV005
      - CV006
  - id: TV003
    title: 乐观／基准／悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值／回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 完整脉冲器模块在 2026 年成功；示范系统于 2028 年投运；到 2030 年证明实现净设施能量增益。
        - 解锁数十亿美元级私人市场估值；定位为领先的清洁基荷电力供应商，带来 >10x 回报潜力。
        - 精密电容器和开关的供应链瓶颈拖慢制造规模化。
        - 第一阶段部件里程碑在交割后 9 个月达成，而目标为 12-18 个月。
      - - 基准情景
        - Albuquerque 园区硬件建设推进，但集成延迟 12-24 个月；到 2031-2032 年实现净增益。
        - 在里程碑延期期间估值标记持平；回报中等，但补充过桥资金造成显著稀释。
        - 设施建设成本和部件磨损率上升，挤压项目经济性。
        - Albuquerque 已开始破土动工，Sirius 脉冲器已完成 3,000 次原型放电。
      - - 悲观情景
        - 耦合模块之间出现系统性阻抗匹配故障；示范系统错过 2028 年里程碑门槛。
        - 分批资金被冻结；估值大幅减记，或在惩罚性的优先清算权下被迫重组资本。
        - 银团拒绝豁免；知识产权在困境收购中出售给国防承包商。
        - 关键分析师报告指出并网商业化未经验证、分批融资脆弱。
    notes: 对执行时间线、分批资金、商业可行性和隐含回报画像进行运营情景建模。
    claimRefs:
      - CV007
      - CV008
      - CV009
