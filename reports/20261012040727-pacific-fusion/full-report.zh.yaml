chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与阶段
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 是一家早期聚变能源开发公司，成立于 2023 年夏季，总部位于加州 Fremont。公司尚未产生收入，专注解决商业化脉冲功率惯性约束聚变所需的科学和机械工程瓶颈。Pacific
              Fusion 不走激光驱动或大型稳态磁约束托卡马克路线，而是开发以模块化阻抗匹配 Marx 发生器为核心的高效率脉冲器驱动惯性聚变架构。2026 年 8 月，公司在新墨西哥州 Albuquerque 的 Mesa
              del Sol 破土动工，建设一座 $1 billion 的 Research and Manufacturing Campus，显著扩大了实体 footprint。该设施专为集成和运行完整
              Demonstration System 而建，目标是在 2030 年实现设施净增益——聚变能量输出高于驱动器最初储存的总能量。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 创始人、领导团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              这家公司由总裁 Will Regan、首席技术官 Dr. Keith LeChien 和首席运营官 Carrie von Muench
              共同创立，三人分别带来先进能源项目管理、脉冲功率物理创新和资本结构设计经验。Will Regan 曾负责 ARPA-E 的 ALPHA 聚变研究组合，并创立 Alphabet 旗下 Google X
              的先进技术分拆公司，熟悉联邦科研协同。Dr. Keith LeChien 曾领导能源部的 U.S. National Confinement Fusion Program，并在 Sandia National
              Laboratories 任职期间共同发明阻抗匹配 Marx 发生器驱动技术，使公司高度依赖其脉冲器工程能力。Carrie von Muench 曾通过 Eric Schmidt
              的家族办公室网络为创始团队提供顾问服务，擅长设计里程碑触发的资本承诺。公司治理由一支影响力很强的董事会主导，成员包括前 Google 董事长 Eric Schmidt、General Catalyst
              Managing Director Hemant Taneja 和 Stripe 联合创始人 Patrick Collison。
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: 资本结构、战略合作与国家安全协同
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 完成了气候科技领域规模最大的早期风险投资轮次之一，获得超过 $900 million 的已承诺 Series A，由 General Catalyst 领投，Lowercarbon
              Capital、MCJ Collective
              及机构合作方参与。资金承诺按严格的科学里程碑分批拨付：只有在逐项跨过示范门槛后，资金才会逐步释放，而不是一次性到账。除私人股权支持外，公司还在民用工程和联邦国家安全两端建立了关键机构合作。2026 年 8
              月，Pacific Fusion 与能源部 National Nuclear Security Administration（NNSA）签署正式 Memorandum of
              Understanding，就高产额聚变和高能量密度物理开展合作，在不进行核爆炸试验的前提下服务库存管理。公司还与 General Atomics 合作测试脉冲器驱动的聚变硬件和靶材制造方法，但二级定价及资本化
              股权结构表的关键细节仍属非公开信息。
            claimRefs:
              - CO006
              - CO007
              - CO011
              - CO012
              - CO015
