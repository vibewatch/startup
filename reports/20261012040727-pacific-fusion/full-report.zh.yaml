  - id: FU001
    title: Pacific Fusion 商业承购与采用生命周期
    type: journey-map
    summary: 展示从公私国防科学合作到公用事业探索、稳定电力部署和工业扩张的结构化进程。
    data:
      nodes:
        - label: 1. 国家安全与高增益科学
          stage: Defense & Scientific R&D (2025–2028)
          actor: NNSA / DOE National Laboratories
          touchpoints:
            - August 2025–2026 NNSA MOU on high-yield fusion collaboration
            - Albuquerque campus demonstration of >100 MJ pulsed burst yield
            - Non-testing stockpile stewardship validation data
        - label: 2. 全尺寸脉冲器验证
          stage: Module Qualification (2025–2027)
          actor: General Atomics & Pacific Fusion Fremont Test Center
          touchpoints:
            - Testing production-scale 2 TW IMG pulser module
            - Multi-shot endurance exceeding 100 consecutive shots per day
            - Mass-manufacturable pulsed power component supply chain
        - label: 3. 净设施能量增益演示
          stage: Demonstration System Commissioning (2028–2030)
          actor: Mesa del Sol Albuquerque Campus
          touchpoints:
            - 150–156 module pulser array integration
            - Target chamber assembly and tritium handling validation
            - Verification of fusion energy output exceeding stored capacitor energy
        - label: 4. 公用事业发电评估
          stage: Commercial Feasibility & Exploration (2029–2032)
          actor: Public Service Company of New Mexico (PNM) & Regional Utilities
          touchpoints:
            - Interconnection studies under New Mexico Energy Transition Act
            - Evaluation of firm clean baseload generation economics
            - Pre-commercial pilot PPA structuring and risk-sharing terms
        - label: 5. 稳定基荷电力部署
          stage: Commercial Power Generation (2033–2038)
          actor: Regulated Electric Utilities & Grid Operators
          touchpoints:
            - Grid-scale power plant siting adjacent to existing transmission
            - Replacement of retiring thermal baseload capacity
            - Regulatory licensing framework under NRC Part 20/30 materials regime
        - label: 6. 直接工业与离网扩张
          stage: Scaled Industrial Adoption (2038–2040)
          actor: Hyperscale AI Data Centers & Heavy Industrial Off-Takers
          touchpoints:
            - Direct on-site firm clean power agreements bypassing transmission queues
            - Long-term levelized cost target approaching $0.02 per kWh by 2040
            - Modular multi-unit plant expansion for industrial heat and power
    approximationNotes: 采用时间线反映 Pacific Fusion 声明的里程碑和管理层评论；商业部署仍取决于 2030 年净增益演示。
