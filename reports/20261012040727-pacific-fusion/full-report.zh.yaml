      - number: '7.4'
        title: 合作伙伴依赖与资本模式敞口
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 对国家实验室、专业组件制造商和公共资本联合体都有关键依赖。公司的科学基础高度依托 Sandia National Laboratories 和 Lawrence Livermore
              National Laboratory 的研究先例及持续合作研究协议。高压电容器、开关和精密靶材制造也受制于供应链，商业供应商冗余有限。财务方面，Pacific Fusion 宣布获得超过 $900
              million 的私人 Series A 承诺，并有州政府支持的风险资本参与；但资金按里程碑分批拨付。脉冲器组装或 Albuquerque
              园区建设若出现重大延误，将加大烧钱敞口，并可能在商业净增益得到证明前迫使公司进行稀释性过桥融资。
