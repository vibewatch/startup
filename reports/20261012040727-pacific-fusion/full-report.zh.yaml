      - number: '6.4'
        title: 商业持久性、承购集中度与尽调现实
        blocks:
          - type: paragraph
            body: >-
              Net Revenue Retention、Gross Revenue Retention 和 cohort churn 等传统企业软件客户指标，在 Pacific Fusion
              当前阶段完全不适用。商业化前聚变公司的客户持久性，取决于里程碑融资稳定性、伙伴留存和政治协同。公司已承诺超过 $900 million 的 Series
              A，并按里程碑分批拨款，因此集中风险来自技术执行，而非客户流失：如果无法展示全规模模块运行，或错过 2028 年 Demonstration System 调试节点，后续融资批次就会受损。Nasdaq
              Private Market 等平台的公开二级交易仍限于合格投资者，体现私营股权的低流动性。专业聚变情报服务也把 Pacific Fusion
              放在商业投资者付费墙后，凸显经审计的公开客户披露十分稀缺。客户采购阻力是一个深刻的尽调缺口。公用事业购电协议通常需要多年监管审批、电站可用率证明和严格信用担保，而商业化前创业公司很难提供。评估 Pacific
              Fusion 时必须认识到，只有全规模设施证明经济可行性后，商业持久性才可能得到验证。
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU011
              - CU013
              - CU014
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 商业化前承购真空与里程碑依赖
            body: >-
              Pacific Fusion 目前没有商业客户、没有具约束力的购电协议（PPAs），也没有商业收入。2026 年 8 月 NNSA Memorandum of Understanding
              验证了公司的高产额国家安全相关性，PNM 也在 New Mexico Energy Transition Act 下表达了探索兴趣；但在 Albuquerque Demonstration System 于
              2030 年实现设施净增益前，商业化仍完全受阻。
            calloutType: risk
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU011
          - type: callout
            title: 双市场策略：以国防库存管理为早期锚点
            body: >-
              不同于只瞄准批发电力的纯磁约束或激光聚变项目，Pacific Fusion 的脉冲功率架构在国家安全科学领域建立了短期机构锚点。超过 100 megajoules 的爆发产额，为 NNSA
              提供非爆炸性库存管理研究平台，使公司在商业电网平价之前数年就拥有战略政府伙伴。
            calloutType: insight
            claimRefs:
              - CU001
              - CU006
              - CU007
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险分类与热力图
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 面临资本密集型硬科技项目常见的二元风险格局。商业化能否成立，取决于验证一套可达兆安级的脉冲功率驱动器，能否把磁化氘氚燃料靶压缩到 2030
              年实现设施净增益。我们的风险分类从技术、监管、运营和财务四个维度拆解敞口。最严重的威胁集中在驱动模块扩展和电容器重复放电寿命上：在商业工作周期下，组件能否承受快速的多千伏放电仍未经证明。相比之下，联邦政策正推动将聚变归入副产品材料规则，而非裂变反应堆标准，近期监管风险因此有所缓解。按里程碑分批拨款又增加了执行压力，因为资金拨付直接跟随硬件交付进度。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR014
      - number: '7.2'
        title: 监管、许可与政策动态
        blocks:
          - type: paragraph
            body: >-
              从监管角度看，相比传统核能开发商，Pacific Fusion 享有明显的结构性顺风。美国核管理委员会提议依据 10 CFR Part 30 副产品材料框架监管商业聚变系统，从而避开 Part 50
              裂变反应堆所需的繁重许可流程和多年环境审查。与此同时，公司聘请联邦游说代表，围绕国防、能源、拨款以及聚变税收平等立法展开倡导，连续四个季度支出超过 $700,000。州政府方面，Pacific Fusion
              计划投资 $1 billion 建设 Albuquerque 园区，并绑定 New Mexico 提供的绩效型经济发展激励。这些激励仍以核实就业创造和资本投入里程碑为前提，也就带来了合规与市政监督义务。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 运营与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              对 Pacific Fusion 而言，运营和工程执行是技术不确定性的主要来源。与 Lawrence Livermore National Laboratory 共同设计的单体脉冲功率原型虽已完成超过 3,000
              次测试放电，但商业电站必须在不损坏组件的情况下持续按重复频率点火。拟议的 156
              模块驱动架构带来严峻的同步和阻抗匹配挑战；模块之间轻微的时序抖动都可能破坏等离子体压缩的对称性。此外，处理氚燃料库存还涉及辐射防护、围护和监管库存报告要求，这些都必须纳入 Albuquerque 设施。若无法在
              2028 年前调试完成 Demonstration System，物理验证将推迟，后续投资人资本分批拨付也会受到威胁。
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR012
