  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与商业聚变工作流
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion
              正在开发一种惯性聚变能源系统，目标是把可调度、零碳、稳定的基荷电力直接送入区域输电网。不同于间歇性可再生能源或缺乏弹性的裂变电站，脉冲器驱动惯性聚变在坚固的反应腔内反复触发高产额聚变反应，捕获高能中子热输出，驱动传统超临界蒸汽轮机发电。面向客户的产品是高容量因子基荷电力和高温工业蒸汽，为公用事业提供替代退役煤电和燃气基础设施的零碳方案。公司以
              2040 年 2 cents per kilowatt-hour
              的平准化发电成本为目标，试图压过化石燃料和其他先进清洁稳定能源。除商业并网调峰和基荷供应外，该系统也可用于高产额实验室物理研究和库存管理，Pacific Fusion 与 NNSA 的合作协议为此提供了依据。
            claimRefs:
