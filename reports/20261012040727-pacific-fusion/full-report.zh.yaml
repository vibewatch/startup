  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务能源支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              商业聚变瞄准全球数万亿美元级的批发基荷电力市场，定位为零碳、可调度的电力资源，直接替代煤炭和天然气等传统化石燃料火电。风电和光伏等间歇性可再生能源需要多小时电池储能或备用调峰燃机来维持电网稳定；聚变则试图不受天气和昼夜周期影响，持续提供稳定电力。可服务支出包括公用事业规模的批发发电和长期容量付费，但不包括分布式住宅屋顶光伏、零售配电以及移动交通燃料，因为这些不属于集中式发电边界。

              与此同时，Pacific Fusion 的脉冲器驱动惯性聚变能源架构带来了独特的短期双用途市场。公司的模块化阻抗匹配 Marx 发生器技术能够产生高功率电流和辐射脉冲，可在国家安全测试、脉冲 X 射线环境和面向
              NNSA 等政府机构的中子测试中创造相邻收入机会。在全面接入商业电网之前，这种双用途能力可以更早带来商业验证和测试收入，部分对冲公用事业基础设施项目通常较长的建设周期。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 受约束的市场测算视角：TAM、SAM 与早期 SOM 现实
        blocks:
          - type: paragraph
            body: >-
              要评估 Pacific Fusion 的可服务市场，必须把全球发电总量拆成现实、受证据约束的分层口径。宏观天花板上，全球年用电量超过 29,000 terawatt-hours，对应理论 TAM——年批发收入超过
              $2 trillion。在这个总盘子里，SAM 由替代退役煤电和燃气电厂、承接负荷增长所需的清洁稳定容量定义，约为每年 10,000 TWh 的基荷需求；电网运营商和重工业用户无法接受间歇性供电。

              但未来十年 Pacific Fusion 的 SOM 受资本、许可和技术约束严格限制。公司已获得 $900 million 的里程碑条件 Series A，这一承诺远高于能源创业公司的 $15 million
              融资中位数，却仍不足以覆盖建设完整商业电站所需的资本。目标经济性是 2040 年长期电价 $0.02 per kilowatt-hour，但 2035
              年前的早期商业化只能落在高价值专业部署、试点示范设施和国防相邻测试场景，买家需要能够承受更高的初始单机成本。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM008
              - CM009
