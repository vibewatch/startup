      - number: '6.3'
        title: 机构交易对手：NNSA、General Atomics 与 PNM
        blocks:
          - type: paragraph
            body: >-
              Pacific Fusion 的客户证据主要是高知名度的机构协同，而非商业销售合同。2026 年 8 月，公司与 NNSA 签署公私合作 Memorandum of
              Understanding，就高产额聚变、高能量密度科学和脉冲功率技术开展合作。该备忘录正式确认联邦方面有意使用 Pacific Fusion 的 Albuquerque 设施开展基于科学的库存管理，使 NNSA
              成为关键机构利益相关方。同时，地区公用事业管理层已释放未来承购意愿：Public Service Company of New Mexico 总裁兼 CEO Don Tarry 参加 Albuquerque
              破土仪式，并指出聚变可以帮助公用事业在 New Mexico Energy Transition Act 下实现脱碳目标。在工业工程合作上，General Atomics 深度参与 Pacific Fusion
              的生产级脉冲器模块制造和测试，模块峰值电功率可达 two terawatts。尽管这些关系提供重要技术可信度，严格尽调必须区分机构合作与商业客户采用。NNSA 协议是不具约束力的研究框架，不是采购合同；PNM
              也没有签署购电协议、并网研究或资本承诺。因此 Pacific Fusion 仍没有付费商业客户或签约承购容量。
