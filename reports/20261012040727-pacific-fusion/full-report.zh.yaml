        title: 商业化模式、定价目标与替代电力经济性
        blocks:
          - type: paragraph
            body: >-
              聚变行业的商业化策略，在客户接入周期和平准化成本目标上各不相同。Helion Energy 已与 Microsoft 签署备受关注的企业购电协议，计划 2028
              年供电，以承受较高的履约风险换取客户动能。Commonwealth Fusion Systems 计划在 2030 年代初把电力岛接入公用事业规模系统，并以先进天然气基荷经济性为基准。Pacific Fusion
              采用模块化电站部署思路，目标是 2040 年把平准化电力成本降到 2 cents per
              kilowatt-hour（$20/MWh）。但这要求证明模块化脉冲器能够以五金店级别的部件成本制造，同时把一次性靶材制造成本维持在每 shot 几美分以下。Pacific Fusion
              仍是私营公司；Nasdaq Private Market 等私募二级平台只允许合格投资者交易股权，专业行业追踪机构也把公司档案放在付费墙后。先进地热和裂变 SMR
              等替代技术受益于成熟的公用事业采购框架；若聚变电站资本开支超出传统电站融资范围，商业化将面临巨大障碍。
