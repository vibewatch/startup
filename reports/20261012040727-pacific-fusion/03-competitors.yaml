  - id: TP002
    title: Feature / Capability Matrix
    columns:
      - Buying / Evaluation Criteria
      - Pacific Fusion (MagLIF / Pulser)
      - Commonwealth Fusion (Tokamak)
      - Helion Energy (Magneto-Inertial)
      - Laser ICF / NIF Derivatives
    rows:
      - - Primary Confinement / Driver Mechanism
        - Modular impedance-matched Marx generator pulser
        - High-temperature superconducting magnetic tokamak
        - Inductive plasmoid accelerator / field-reversed configuration
        - Megajoule laser beamline amplification
      - - Demonstrated Technical Milestone
        - Capacitor prototype >3,000 shots; Sandia Z-machine basis
        - High-field 20T magnet demonstration for SPARC
        - Trenta/Polaris pulse compression demonstrations
        - Scientific breakeven Q>1 achieved at NIF (2022)
      - - Driver Wall-Plug Efficiency
        - High electrical driver efficiency via solid-state capacitors
        - Cryogenic cooling load reduces overall net plant efficiency
        - High direct recovery potential from pulsed magnetic flux
        - Low electrical-to-optical efficiency (<1-2% laser wall-plug)
      - - Target Fabrication & Repetition Rate
        - Unproven high-rep-rate target insertion; 156-module driver
        - Continuous steady-state burn without discrete fuel pellets
        - Repetitive pulse plasmoid injection (pellet-free)
        - Cryogenic target alignment and chamber clearing bottlenecks
    notes: Capability evaluation based on published technical roadmaps and laboratory precedent; full-scale repetitive shot endurance and target fabrication economics remain unverified across all private ventures.
