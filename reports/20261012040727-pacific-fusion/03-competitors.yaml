  - id: TP001
    title: Competitor Profile Table
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Differentiation
      - Limitation
    rows:
      - - Commonwealth Fusion Systems (CFS)
        - Direct / Tokamak
        - $2B+ raised
        - Utility baseload / Grid power
        - High-field superconducting magnets (SPARC/ARC design)
        - High cryogenic cooling complexity, large footprint, and expensive superconducting tape supply chains
      - - Helion Energy
        - Direct / Magneto-Inertial
        - $570M+ ($1.4B+ commitments)
        - Industrial / Hyperscale off-takers (e.g., Microsoft PPA)
        - Direct electricity recovery via pulsed magnetic field without steam turbines
        - Requires aneutronic D-He3 fuel cycle and unproven repetitive plasmoid physics at commercial scale
      - - Laser-Driven Inertial Ventures (e.g., NIF Derivatives)
        - Adjacent / Laser Inertial
        - Multi-billion national lab driver ($3.5B+ NIF)
        - Defense research & grid power studies
        - Demonstrated laboratory scientific breakeven (Q>1) in December 2022
        - Very low wall-plug electrical-to-optical conversion efficiency and complex cryogenic target fabrication
      - - Small Modular Fission (SMRs) & Advanced Geothermal
        - Substitute / Firm Clean Power
        - Multi-hundred million to billions across NuScale, Fervo, etc.
        - 24/7 industrial heat and firm electricity
        - Established fission regulatory frameworks and commercial drilling techniques
        - Nuclear waste handling, high capital cost overruns, or geographic hydrothermal resource constraints
    notes: Competitor comparison compiled from industry disclosures, venture capitalization reports, and federal laboratory benchmarks; private venture metrics reflect announced funding commitments rather than audited cash reserves.
