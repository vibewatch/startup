        - Turnkey pulser-driven power plant modules with maintenance
        - Overnight capex, target cost per shot, and plant balance-of-plant costs undisclosed
      - - Helion Energy
        - Direct corporate PPA (e.g., binding Microsoft PPA for 2028)
        - Confidential contract price; market estimates ~$50-80/MWh
        - Direct electricity supply without steam turbine generation
        - Performance penalty structure and backup power guarantees if 2028 delivery slips
      - - Commonwealth Fusion Systems
        - Utility-scale power plant integration via SPARC/ARC
        - Targeting grid parity with advanced combined-cycle gas
        - Baseload thermal-to-electric power island with high-field magnets
        - Superconducting tape supply chain scalability and maintenance cost per replacement cycle
