company:
  name: Pacific Fusion
chapter:
  number: 7
  title: Risks
  summary: >-
    Pacific Fusion faces formidable technical, operational, and milestone execution hurdles as it scales its
    pulsed-power magnetized liner inertial fusion concept toward a 2030 net facility gain target. While favorable NRC
    byproduct material regulation and New Mexico state incentives provide policy and siting tailwinds, unproven
    multi-module pulser durability, tritium supply risks, and dependence on public-private lab partnerships present
    critical underwriting concerns.
sections:
  - id: severity-ranked-risk-taxonomy
    title: Severity-Ranked Risk Taxonomy & Heatmap
    body: >-
      Pacific Fusion operates under a binary risk profile characteristic of capital-intensive hard-science ventures.
      Commercial viability hinges on validating a multi-megampere pulsed-power driver capable of compressing magnetized
      deuterium-tritium fuel targets to achieve net facility gain by 2030. Our risk taxonomy stratifies exposure across
      technical, regulatory, operational, and financial dimensions. High-severity threats concentrate around driver
      module scaling and capacitor repetition endurance, where component degradation under rapid multi-kilovolt
      discharge remains unproven at commercial duty cycles. Conversely, near-term regulatory risk is tempered by federal
      policy momentum classifying fusion under byproduct material rules rather than fission reactor standards.
      Milestone-based tranche funding creates additional execution pressure, as capital disbursements correlate directly
      with hardware delivery schedules.
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR008
      - CR011
      - CR014
    figureRefs:
      - FR001
  - id: regulatory-and-legal-risk
    title: Regulatory, Licensing & Policy Dynamics
    body: >-
      From a regulatory perspective, Pacific Fusion benefits from significant structural tailwinds relative to
      traditional nuclear developers. The Nuclear Regulatory Commission has proposed governing commercial fusion systems
      under a 10 CFR Part 30 byproduct materials framework, avoiding the burdensome licensing overhead and multi-year
      environmental reviews mandated for Part 50 fission reactors. In parallel, the company has engaged federal lobbying
      representation to advocate across defense, energy, appropriations, and fusion tax parity legislation, expending
      more than $700,000 across four consecutive quarters. At the state level, Pacific Fusion's planned $1 billion
      Albuquerque campus is tied to performance-based economic development incentives from New Mexico. These incentives
      remain contingent on verified job creation and capital deployment milestones, establishing a compliance and
      municipal oversight obligation.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR013
    tableRefs:
      - TR001
  - id: operational-and-technical-execution
    title: Operational & Technical Execution Risks
    body: >-
      Operational and engineering execution represents the primary locus of technical uncertainty for Pacific Fusion.
      While individual pulsed-power prototypes designed with Lawrence Livermore National Laboratory have demonstrated
      over 3,000 test discharges, commercial power plant operations will demand continuous firing at repetitive shot
      frequencies without component breakdown. The proposed 156-module driver architecture introduces severe
      synchronization and impedance-matching challenges, where minor timing jitter across modules could degrade plasma
      compression symmetry. Furthermore, handling tritium fuel inventories introduces radioprotection, containment, and
      regulatory inventory reporting requirements that must be integrated into the Albuquerque facility. Failure to
      commission the Demonstration System by 2028 would delay physics validation and jeopardize subsequent investor
      capital tranches.
    claimRefs:
      - CR003
      - CR007
      - CR008
      - CR009
      - CR012
    tableRefs:
      - TR002
  - id: partner-dependency-and-financial-model
    title: Partner Dependencies & Capital Model Exposure
    body: >-
      Pacific Fusion maintains critical dependencies across national laboratories, specialized component manufacturers,
      and public capital syndicates. The company's scientific foundation relies heavily on research precedents and
      ongoing cooperative research agreements with Sandia National Laboratories and Lawrence Livermore National
      Laboratory. High-voltage capacitor manufacturing, switches, and precision target fabrication also rely on
      constrained supply chains with limited commercial vendor redundancy. On the financial side, while Pacific Fusion
      announced over $900 million in private Series A commitments alongside state-backed venture participation, the
      capital is disbursed in milestone-dependent tranches. Any significant delay in pulser assembly or Albuquerque
      campus development increases cash burn exposure and could force dilutive bridge financing before commercial net
      gain is demonstrated.
    claimRefs:
      - CR001
      - CR002
      - CR010
      - CR013
      - CR014
    tableRefs:
      - TR003
