        - id: stage-5
          label: Long-Term PPA Commercial Offtake
          detail: Execution of 15-25 year utility power purchase agreements delivering firm clean baseload power.
        - id: stage-6
          label: Unit Margins & Operating Cash Flow
          detail: Achieving target $0.02/kWh LCOE through modular factory production and low-cost component replacement.
    approximationNotes: Sequence illustrates the conceptual capital and operational dependencies required to transition from pre-revenue technology demonstration to cash flow generation.
