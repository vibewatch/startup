callouts:
  - calloutType: risk
    title: Milestone-Tranched Funding Structure Creates Discontinuous Financing Risk
    body: While Pacific Fusion >$1B Series A provides substantial committed capital, funds are released in tranches conditioned on technical milestones. Missing the 2028 demonstration system commissioning schedule could stall tranche disbursements before commercialization.
    claimRefs:
      - CI001
      - CI002
      - CI009
  - calloutType: insight
    title: Modularity Limits Single-Point Failure in Pulser Manufacturing Capex
    body: By standardizing around 156 identical shipping-container-sized pulser modules composed of mass-manufacturable switches and capacitors, Pacific Fusion avoids the custom one-off capex escalations typical of laser or magnetic confinement research reactors.
    claimRefs:
      - CI006
      - CI007
      - CI011
