figures:
  - id: FU001
    title: Pacific Fusion Commercial Offtake and Adoption Lifecycle
    type: journey-map
    summary: Illustrates the structured progression from public-private defense science collaboration to utility exploration, firm power deployment, and industrial expansion.
    data:
      nodes:
        - label: 1. National Security & High-Yield Science
          stage: Defense & Scientific R&D (2025–2028)
          actor: NNSA / DOE National Laboratories
          touchpoints:
            - August 2025–2026 NNSA MOU on high-yield fusion collaboration
            - Albuquerque campus demonstration of >100 MJ pulsed burst yield
            - Non-testing stockpile stewardship validation data
        - label: 2. Full-Scale Pulser Validation
          stage: Module Qualification (2025–2027)
          actor: General Atomics & Pacific Fusion Fremont Test Center
          touchpoints:
            - Testing production-scale 2 TW IMG pulser module
            - Multi-shot endurance exceeding 100 consecutive shots per day
            - Mass-manufacturable pulsed power component supply chain
        - label: 3. Net Facility Gain Demonstration
          stage: Demonstration System Commissioning (2028–2030)
          actor: Mesa del Sol Albuquerque Campus
          touchpoints:
            - 150–156 module pulser array integration
            - Target chamber assembly and tritium handling validation
            - Verification of fusion energy output exceeding stored capacitor energy
        - label: 4. Utility Generation Evaluation
          stage: Commercial Feasibility & Exploration (2029–2032)
          actor: Public Service Company of New Mexico (PNM) & Regional Utilities
          touchpoints:
            - Interconnection studies under New Mexico Energy Transition Act
            - Evaluation of firm clean baseload generation economics
            - Pre-commercial pilot PPA structuring and risk-sharing terms
        - label: 5. Firm Baseload Power Deployment
          stage: Commercial Power Generation (2033–2038)
          actor: Regulated Electric Utilities & Grid Operators
          touchpoints:
            - Grid-scale power plant siting adjacent to existing transmission
            - Replacement of retiring thermal baseload capacity
            - Regulatory licensing framework under NRC Part 20/30 materials regime
        - label: 6. Direct Industrial & Off-Grid Expansion
          stage: Scaled Industrial Adoption (2038–2040)
          actor: Hyperscale AI Data Centers & Heavy Industrial Off-Takers
          touchpoints:
            - Direct on-site firm clean power agreements bypassing transmission queues
            - Long-term levelized cost target approaching $0.02 per kWh by 2040
            - Modular multi-unit plant expansion for industrial heat and power
    approximationNotes: Adoption timeline reflects Pacific Fusion stated milestones and management commentary; commercial deployment remains contingent on 2030 net gain demonstration.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU007
      - CU010
callouts:
  - calloutType: risk
    title: Pre-Commercial Offtake Vacuum and Milestone Dependency
    body: Pacific Fusion currently has zero commercial customers, zero binding power purchase agreements (PPAs), and zero commercial revenue. While the August 2026 NNSA Memorandum of Understanding validates high-yield national security relevance and PNM has expressed exploratory interest under New Mexico's Energy Transition Act, commercialization remains entirely blocked until net facility gain is achieved at the Albuquerque Demonstration System by 2030.
    claimRefs:
      - CU003
      - CU005
      - CU009
      - CU011
  - calloutType: insight
    title: 'Dual-Market Strategy: Defense Stockpile Stewardship as Early Anchor'
    body: Unlike pure magnetic confinement or laser fusion ventures targeting only wholesale electricity, Pacific Fusion's pulsed-power architecture creates a near-term institutional anchor in national security science. Exceeding 100 megajoules of burst yield provides the NNSA with a non-explosive stockpile stewardship research platform, giving the company a strategic government partner years before commercial grid parity is required.
    claimRefs:
      - CU001
      - CU006
      - CU007
