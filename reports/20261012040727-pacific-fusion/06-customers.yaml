company:
  name: Pacific Fusion
chapter:
  number: 6
  title: Customers
  summary: 'Pacific Fusion is an early-stage, pre-revenue fusion energy developer with zero commercial utility customers or executed power purchase agreements. Its commercial adoption strategy centers on a dual-track pathway: near-term national security research collaboration with the NNSA followed by post-2030 utility baseload power generation, anchored by its $1 billion Albuquerque Demonstration System.'
sections:
  - id: customer-segmentation
    title: 'Target Market Segments: Defense, Utilities, and Industrial Power'
    body: Pacific Fusion addresses a multi-tiered commercial market shaped by distinct power requirements, procurement timelines, and risk appetites. At the apex of near-term commercial relevance sits the national security and defense sector, where the Department of Energy's National Nuclear Security Administration requires high-yield experimental capabilities to maintain the United States nuclear stockpile without explosive underground testing. While conventional fusion ventures focus exclusively on long-duration electricity grids, Pacific Fusion's pulsed-power architecture offers rapid high-yield bursts exceeding 100 megajoules, creating a unique institutional application that precedes commercial electricity generation. Beyond defense science, regulated electric utilities represent the primary high-volume customer segment. Investor-owned utilities such as the Public Service Company of New Mexico face escalating mandates under state carbon-free standards to replace retiring coal and natural gas capacity with firm, non-intermittent clean power. A third emerging segment consists of hyperscale data centers and artificial intelligence computing facilities, where acute regional grid interconnection bottlenecks create substantial willingness to procure behind-the-meter clean baseload power. Finally, heavy industrial manufacturing presents long-term potential for modular pulsed-power units delivering co-located process heat and electricity. However, commercial diligence reveals that across all four segments, binding commercial agreements remain absent, leaving target customer sizing primarily conceptual.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU010
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Demonstration Milestones and Commercial Adoption Trajectory
    body: As a deep-technology development company founded in 2023, Pacific Fusion does not possess commercial operational history, recurring revenue, or customer adoption metrics. Its commercial trajectory is entirely bounded by physical engineering milestones. In late 2024 and early 2025, the company completed initial validation testing of its impedance-matched Marx generator pulser components at its Fremont Test Center, achieving more than 100 consecutive full-power shots in a single day. In August 2026, the company marked its most significant operational expansion by breaking ground on a $1 billion Research and Manufacturing Campus at Mesa del Sol in Albuquerque, New Mexico. This facility is engineered to assemble and house the Demonstration System, an integrated array of approximately 150 to 156 pulser modules designed to achieve net facility gain by 2030. Achieving net facility gain—where fusion energy output surpasses the stored electrical energy input of the entire facility—represents the indispensable gate for commercial power discussions. Independent analysts emphasize that even if Pacific Fusion meets its 2030 net gain objective, substantial engineering barriers will remain before commercial electrons can reach the power grid, including repetitive-shot chamber survivability, rapid target injection, and closed-loop tritium breeding. Long-term commercial adoption targets anticipate mass manufacturing of modular plants by 2040 delivering wholesale electricity at approximately $0.02 per kilowatt-hour, though these projections remain unverified by third-party operating data.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU008
      - CU010
      - CU015
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-partnerships-and-utility-proof
    title: 'Institutional Counterparties: NNSA, General Atomics, and PNM'
    body: 'Pacific Fusion''s customer proof is characterized by high-profile institutional alignment rather than commercial sales contracts. In August 2026, the company executed a public-private Memorandum of Understanding with the National Nuclear Security Administration regarding collaboration on high-yield fusion, high-energy-density science, and pulsed-power technologies. This memorandum formalizes federal interest in utilizing Pacific Fusion''s Albuquerque facility for science-based stockpile stewardship, establishing the NNSA as an essential institutional stakeholder. Concurrently, regional utility leadership has signaled openness to future offtake: Don Tarry, President and Chief Executive Officer of the Public Service Company of New Mexico, participated in the Albuquerque groundbreaking, noting that fusion could support the utility''s decarbonization objectives under the New Mexico Energy Transition Act. On the industrial engineering side, General Atomics collaborates extensively with Pacific Fusion to manufacture and test production-scale pulser modules capable of delivering two terawatts of peak electrical power. While these relationships provide critical technical credibility, rigorous diligence must distinguish institutional collaboration from commercial customer adoption. The NNSA agreement is a non-binding research framework rather than a procurement contract, and PNM has not executed a power purchase agreement, interconnection study, or capital commitment. Pacific Fusion therefore maintains zero paying commercial customers or contracted offtake capacity.'
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: durability-concentration-and-diligence-gaps
    title: Commercial Durability, Offtake Concentration, and Diligence Realities
    body: 'Traditional enterprise software customer metrics such as Net Revenue Retention, Gross Revenue Retention, and cohort churn are entirely inapplicable to Pacific Fusion at its current stage of maturity. Customer durability in pre-commercial fusion is instead governed by milestone financing stability, partner retention, and political alignment. With more than $900 million in Series A capital committed across milestone-based tranches, the company faces severe concentration risk tied to technical execution rather than customer churn: failing to demonstrate full-scale module operation or slipping past 2028 demonstration system commissioning would jeopardize future funding tranches. Public secondary trading via platforms like Nasdaq Private Market remains restricted to accredited investors, reflecting illiquid private ownership. Furthermore, specialized fusion intelligence services track Pacific Fusion behind commercial investor paywalls, underscoring the scarcity of audited public customer disclosures. A profound diligence gap exists regarding customer procurement friction. Power purchase agreements in the utility sector typically require multi-year regulatory approvals, demonstrated plant availability above ninety percent, and stringent credit guarantees that pre-commercial startups cannot readily provide. Underwriting Pacific Fusion therefore requires recognizing that commercial durability will remain unprovable until full-scale facility operation demonstrates economic viability.'
    claimRefs:
      - CU003
      - CU005
      - CU009
      - CU011
      - CU013
      - CU014
