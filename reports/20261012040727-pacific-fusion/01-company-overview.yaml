company:
  name: Pacific Fusion
chapter:
  number: 1
  title: Company Overview
  summary: Pacific Fusion is an early-stage pulsed-power inertial fusion company founded in 2023 and headquartered in Fremont, California. Backed by a landmark $900 million milestone-tranched Series A led by General Catalyst, the company broke ground on a $1 billion Demonstration System campus in Albuquerque, New Mexico, targeting net facility gain by 2030.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity, Operating Model, and Stage
    body: Pacific Fusion is an early-stage fusion energy development company established in the summer of 2023 with corporate headquarters located in Fremont, California. The organization operates as a pre-revenue technology development entity focused exclusively on solving the scientific and mechanical engineering bottlenecks necessary to realize commercial pulsed-power inertial confinement fusion. Rather than relying on laser-driven systems or massive steady-state magnetic confinement tokamaks, Pacific Fusion is developing a high-efficiency pulser-driven inertial fusion architecture centered on modular impedance-matched Marx generators. In August 2026, the company expanded its physical footprint significantly by breaking ground on a $1 billion Research and Manufacturing Campus located at Mesa del Sol in Albuquerque, New Mexico. This facility is specifically engineered to integrate and operate the company’s full Demonstration System, which aims to achieve net facility gain—producing greater fusion energy output than the total energy initially stored in the driver—by 2030.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
    tableRefs:
      - TO001
  - id: founding-team-and-governance
    title: Founders, Leadership Team, and Governance Structure
    body: The venture was co-founded by President Will Regan, Chief Technology Officer Dr. Keith LeChien, and Chief Operating Officer Carrie von Muench, bringing together a specialized blend of advanced energy program direction, pulsed-power physics innovation, and creative capital structuring. Will Regan formerly directed the ALPHA fusion research portfolio at ARPA-E and founded an advanced technology spinout from Alphabet's Google X, possessing extensive domain fluency in federal research coordination. Dr. Keith LeChien previously led the U.S. National Confinement Fusion Program within the Department of Energy and co-invented the impedance-matched Marx generator driver technology during his tenure at Sandia National Laboratories, creating an intense key-person dependency on his pulser engineering leadership. Carrie von Muench joined after advising the founding group through Eric Schmidt's family office network, bringing specialized experience in structuring milestone-gated capital commitments. Corporate governance is anchored by an influential board comprising former Google Chairman Eric Schmidt, General Catalyst Managing Director Hemant Taneja, and Stripe Co-Founder Patrick Collison.
    claimRefs:
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholder-ecosystem
    title: Capitalization, Strategic Partnerships, and National Security Synergy
    body: Pacific Fusion concluded one of the most substantial initial venture capital rounds in climate technology, securing over $900 million in committed Series A funding in a round led by General Catalyst, alongside participation from Lowercarbon Capital, MCJ Collective, and institutional partners. The capital commitment is structured around rigorous scientific milestone tranches, meaning funds are released progressively as demonstration hurdles are cleared rather than disbursed in a single upfront lump sum. Alongside private equity backing, the company has forged critical institutional partnerships across both civilian engineering and federal national security domains. In August 2026, Pacific Fusion executed a formal Memorandum of Understanding with the Department of Energy’s National Nuclear Security Administration (NNSA) to collaborate on high-yield fusion and high-energy-density physics, creating mutual utility for stockpile stewardship without nuclear explosive testing. Furthermore, Pacific Fusion actively collaborates with General Atomics to test pulser-driven fusion hardware and target manufacturing methodologies, though key secondary pricing and capitalization cap-sheet specifics remain private.
    claimRefs:
      - CO006
      - CO007
      - CO011
      - CO012
      - CO015
    tableRefs:
      - TO003
  - id: technical-roadmap-and-execution-milestones
    title: Development Milestones, Technical Execution, and Adverse Risk Profile
    body: Pacific Fusion's technical roadmap centers on proving that pulsed-power drivers can be mass-manufactured cost-effectively using domestic industrial components rather than highly bespoke laboratory apparatus. The company achieved a pivotal proof point in May 2026 when its Sirius four-stage impedance-matched Marx generator prototype exceeded 3,000 continuous shots in collaboration with Lawrence Livermore National Laboratory. The full Demonstration System under construction in Albuquerque is designed to assemble approximately 156 identical modular units to drive a massive 60 mega-ampere current pulse through magnetized targets. Despite rapid engineering strides, external analysts and critical market observers emphasize that achieving net facility gain by 2030 does not automatically solve grid-level electricity conversion, heat-exchanger survivability, or sustainable tritium fuel breeding. Moreover, because Series A capital releases depend strictly on hitting intermediate targets, any schedule slippage past the anticipated 2028 system commissioning deadline would present acute funding deceleration risks.
    claimRefs:
      - CO002
      - CO009
      - CO010
      - CO013
      - CO014
    figureRefs:
      - FO001
