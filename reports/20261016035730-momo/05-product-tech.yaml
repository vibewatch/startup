      - "Public role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Bank and settlement connectivity", "Powers wallet funding, transfer, and merchant settlement through partner institutions", "Bank and financial-institution relationships", "Operational dependence on partner uptime, settlement quality, and compliance coordination"]
      - ["Wallet and payments core", "Maintains the consumer payment surface and money-movement workflows", "Reliable ledger and mobile application shell", "No independent public SLA or incident-history evidence in assigned pool"]
      - ["Identity and trust controls", "Applies eKYC, monitoring algorithms, and transaction safeguards", "Access to user identity and transaction data plus control tuning", "Control depth is directionally described but not independently audited in the source set"]
      - ["Mini-app runtime", "Lets third-party services inherit host login, payment, and distribution", "Shared platform APIs and release governance", "Weak developer governance could create quality or security spillover across modules"]
      - ["Developer platform", "Supports Re.Pack bundles, secure chunk loading, Hermes, sandbox development, and team enablement", "Internal platform ownership and release discipline", "Migration success is public, but ongoing release cadence and resilience are not"]
    notes: "Architecture reflects only components explicitly described in the assigned evidence; absent public API, status-page, and certification materials are captured as diligence gaps rather than inferred capabilities."
