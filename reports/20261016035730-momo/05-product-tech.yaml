company:
  name: "MoMo"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    MoMo is no longer just a wallet surface: current evidence describes a
    layered super-app product that combines payments, financial-service
    distribution, and third-party mini apps on shared identity, risk, and bank
    integration rails. Public engineering evidence confirms real platform work
    around mini apps and a Re.Pack migration, but the assigned source set does
    not independently verify present-day uptime, API maturity, or external
    security-certification depth.
sections:
  - id: "product-scope-and-user-jobs"
    title: "Product scope now covers both wallet frequency and higher-value financial jobs"
    body: >-
      The product definition is broader than a single e-wallet. Official and
      third-party sources describe MoMo as M_Service's mobile-payment platform,
      while 2026 coverage consistently frames it as a financial super app that
      layers lending, insurance, savings, investments, merchant tools, and
      lifestyle services on top of the original wallet. AgileTech's teardown is
      useful because it breaks that breadth into operating layers rather than
      marketing tabs: consumer payments first, then regulated-product
      distribution, then a platform for third-party mini apps. That sequencing
      matters for customer workflow. The wallet still owns the highest-frequency
      user jobs such as transfers, QR checkout, bill pay, and top-ups, while
      adjacent modules monetize the same identity, balance, and trust rails
      instead of asking users to rebuild context in separate apps.
    claimRefs: ["CE001", "CE003", "CE004", "CE010", "CE012"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-delivery-model"
    title: "Public engineering evidence points to a shared platform with mini-app delivery"
    body: >-
      The best direct architecture evidence in the assigned pool comes from the
      AgileTech and Callstack pieces. AgileTech says MoMo's mini apps inherit
      the host app's login, payment, and distribution, implying a platform
      model with reusable shared services rather than isolated point products.
      Callstack then adds concrete implementation detail: MoMo migrated its
      super app and one mini app onto a Re.Pack-based React Native architecture
      with a secure chunk loader, Hermes support, and a MoMo core package, then
      built a sandbox development environment and training for internal teams.
      Together, those sources support a delivery model in which product
      expansion depends on a reusable mobile shell, shared trust controls, and
      partner-facing mini-app tooling. That is a more mature operating posture
      than simple wallet feature accretion, but it also increases dependency on
      platform governance and release discipline.
    claimRefs: ["CE004", "CE005", "CE006", "CE007"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-differentiation-and-control-risks"
    title: "Scale and breadth are visible, but independent control evidence is still thin"
    body: >-
      Product maturity is visible in scope and scale even though the public
      evidence remains incomplete. Reuters-sourced 2026 reporting says MoMo has
      more than 30 million users, and official plus third-party sources show
      that the service model depends on extensive bank and financial-institution
      partnerships rather than a closed-loop wallet. SME Business Review also
      describes AI-assisted transaction categorization and monitoring algorithms
      that can alert on unusual activity or restrict transactions, which is
      directionally consistent with a super app handling lending and merchant
      flows alongside payments. The gap is not whether MoMo has broadened the
      product; it clearly has. The gap is whether outside investors can
      independently verify uptime discipline, mini-app contribution, and current
      certification depth from public materials rather than partner or company
      narratives.
    claimRefs: ["CE008", "CE009", "CE010", "CE011", "CE013"]
callouts:
  - calloutType: "strength"
    title: "Platform logic is visible in public evidence"
    body: >-
      MoMo appears to reuse the same wallet, identity, risk, and distribution
      rails across first-party modules and third-party mini apps instead of
      shipping disconnected products.
    claimRefs: ["CE004", "CE005", "CE006"]
  - calloutType: "risk"
    title: "Breadth has outpaced public technical transparency"
    body: >-
      Public sources support product breadth and engineering investment, but
      they do not independently prove present-day uptime, external security
      assurance, or how much usage now depends on partner-run mini apps.
    claimRefs: ["CE006", "CE008", "CE011", "CE013"]
