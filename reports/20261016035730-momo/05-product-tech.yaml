      - ["Handle travel, tickets, and everyday utility tasks", "Book or pay for adjacent services inside the same app", "Lifestyle-service shelf connected to the wallet", "Keeps more consumer use cases inside one interface", "No public source in the pool quantifies repeat usage by vertical"]
      - ["Manage money with assistance and alerts", "Review categorized spend, summaries, reminders, and chat-style queries", "AI assistant and automated tracking/notification layer", "Adds budgeting and oversight features beyond simple payments", "Source set does not independently verify model accuracy or user adoption of assistant features"]
    notes: "Benefits are workflow-level inferences from cited product descriptions; where assigned sources omit conversion, latency, or usage denominators, the limitation cell records the gap explicitly."
    claimRefs: ["CE003", "CE010", "CE012"]
