evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: Full current board composition, committee structure, and governance rights.
    whyItMatters: Governance control and board-seat allocation affect downside protection and strategic decision-making.
    diligencePath: Request the latest board list, shareholder agreement summary, and investor-rights schedule from management.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table-and-stakeholders
    missingEvidence: Exhaustive as-of-runDate cap table, ownership percentages, liquidation preferences, debt, and secondaries.
    whyItMatters: Investor economics and control cannot be inferred from representative investor names alone.
    diligencePath: Obtain the latest cap table, financing documents, and any secondary-transfer schedule.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: users
    missingEvidence: One reconciled user metric separating registered, active, and transacting users.
    whyItMatters: >-
      Valuation and scale analysis are sensitive to whether the company is reporting registered accounts or active
      usage.
    diligencePath: Ask management for monthly active users, registered users, and transacting-user definitions for 2024-2026.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Exact current headcount and functional split by geography or business line.
    whyItMatters: A banded employee estimate is too imprecise for operating-leverage or burn analysis.
    diligencePath: Request HR headcount by month and by function, plus any reorganization or layoff history since 2024.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: conflicting-data
    severity: material
    topic: user-scale
    missingEvidence: A company or regulator disclosure reconciling registered users, active users, and transacting users.
    whyItMatters: >-
      User-scale disagreement directly affects adoption depth, cross-sell assumptions, and any attempt to derive a
      MoMo-specific SAM or SOM.
    diligencePath: >-
      Request management KPI definitions or audited investor materials that reconcile registered, monthly active, and
      transacting-user counts.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Public disclosure of merchant count, effective take rate, active-user mix, and attach rates into lending,
      insurance, and investment products.
    whyItMatters: >-
      Without those conversion inputs, a market-size estimate cannot be converted into a defendable revenue opportunity
      for MoMo.
    diligencePath: >-
      Obtain management metrics or investor materials that break out merchant monetization and product penetration by
      cohort.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: budget-owner-split
    missingEvidence: Contract-level economics showing how merchants and financial-product partners pay for distribution through MoMo.
    whyItMatters: >-
      Budget-owner clarity would sharpen which side of the platform drives margin and which adoption motions deserve
      valuation weight.
    diligencePath: >-
      Review partnership agreements or management commentary on fee splits, commissions, and merchant-pricing
      architecture.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: private-evidence-only
    severity: material
    topic: merchant-pricing
    missingEvidence: >-
      Comparable public merchant discount rates, wallet rebate programs, and contract economics for MoMo, ZaloPay,
      ViettelPay, and bank-led QR acceptance.
    whyItMatters: >-
      Without realized pricing and subsidy data, the chapter can compare positioning and breadth but cannot prove which
      player monetizes best or buys share most aggressively.
    diligencePath: >-
      Request current merchant pricing schedules, incentive terms, and take-rate disclosures from management or payment
      partners.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: rival-scale-comparability
    missingEvidence: >-
      Current, like-for-like active-user, transaction-volume, and merchant-acceptance metrics for ZaloPay, ViettelPay,
      VNPay, and Moca.
    whyItMatters: >-
      Public sources mix registered users, estimated users, and projections, which weakens direct scale comparison
      across alternatives.
    diligencePath: >-
      Gather 2025-2026 management disclosures, regulator data, or audited market-share studies using a common
      denominator.
    relatedQuestionRefs:
      - QP002
  - type: missing-source
    severity: minor
    topic: adjacent-entrant-watchlist
    missingEvidence: >-
