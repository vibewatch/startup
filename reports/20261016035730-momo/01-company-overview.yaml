artifact: company-overview
slug: momo
runDate: 2026-10-16
company:
  name: MoMo
chapter:
  number: 1
  title: Company Overview
  summary: >-
    MoMo, operated by M_Service in Ho Chi Minh City, has evolved from a 2007/2010
    mobile-payments origin into a broader Vietnamese financial super app spanning
    lending, insurance, savings, investment, and merchant services. Retained 2026
    coverage converges on profitability since 2024 and a fresh investor process
    above a $2 billion valuation, but current user totals, exact headcount, board
    composition, and cap-table control rights remain inconsistently or incompletely
    disclosed in the assigned source set.
sections:
  - id: identity-and-scope
    title: Identity, headquarters, and operating scope
    body: >-
      MoMo’s legal operator is M_Service, which the company says was founded in
      2007 and licensed by the State Bank of Vietnam to provide e-wallet,
      money-transfer, and collection/disbursement services. Independent coverage
      traces the consumer-wallet launch to 2010, first around mobile top-ups and
      peer-to-peer transfers, then into a much broader financial-services stack.
      By 2026, retained reporting consistently describes MoMo as a Vietnamese
      financial “super app” rather than a single-product wallet, with lending,
      insurance, savings, investment, and merchant tools layered onto the core
      payments product. Headquarters location is consistent across official and
      directory-style coverage in Ho Chi Minh City, but the public source pack is
      much stronger on product breadth than on precise current operating metrics.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder continuity, and governance transparency
    body: >-
      The retained pool identifies co-founders Nguyen Manh Tuong and Nguyen Ba
      Diep as the original operators behind M_Service, while FundedIQ lists Pham
      Thanh Duc as CEO. That gives enough signal to establish founder continuity
      and a named current chief executive, but not enough to verify a full board,
      committee structure, or ownership-linked governance rights. This matters
      because MoMo is entering another strategic process: diligence on control,
      board seats, and any investor vetoes cannot rely on the assigned public web
      sources alone. In practical terms, the company still appears key-person
      dependent on a small senior team whose public profiles are easier to confirm
      than the governance mechanics around them.
    claimRefs: [CO006, CO007]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding history, current scale signals, and milestone read-through
    body: >-
      The clearest capital marker in the retained set is the $200 million Series E
      raised in December 2021, with independent sources also describing roughly
      $434 million total capital raised to date. The 2026 update is strategic
      rather than completed financing: multiple reports say MoMo hired Jefferies
      and Morgan Stanley to explore options including new investors at a valuation
      above $2 billion, while stressing that the talks were early and that no deal
      was guaranteed. Profitability since 2024 is the strongest fresh operating
      milestone in the pool, but scale disclosures are less tidy: retained sources
      variously cite more than 30 million users, more than 32 million users, and
      40 million registered users in 2025, which should not be collapsed into a
      single “customer count” without management clarification on registered
      versus active users. FundedIQ likewise provides only a 501-1000 employee
      band, so exact headcount, debt or secondary structure, and current investor
      control terms remain diligence items rather than settled facts.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
