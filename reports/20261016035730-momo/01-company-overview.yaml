    summary: >-
      MoMo’s retained public milestones show a long build from M_Service’s 2007
      founding to 2026 strategic fundraising, with profitability arriving before
      the next capital process.
    data:
      items:
        - label: M_Service founded
          year: "2007"
          detail: M_Service was founded in 2007 as the operator behind MoMo.
          tone: positive
          claimRefs: [CO001]
        - label: Wallet launch
          year: "2010"
          detail: Independent coverage places the consumer-wallet launch in 2010, initially focused on top-ups and peer-to-peer transfers.
          tone: positive
          claimRefs: [CO003]
        - label: Smartphone-app transition
          year: "2014"
          detail: Metropolitan says the original service evolved by 2014 into a smartphone application.
          tone: positive
          claimRefs: [CO003]
        - label: Series C expansion capital
          year: "2019"
          detail: Digital in Asia says Warburg Pincus led a $100M Series C to support merchant acceptance and QR payments.
          tone: positive
          claimRefs: [CO008]
        - label: Series E funding
          date: "2021-12"
          detail: Retained sources identify a $200M Series E led by Mizuho Bank as the last major disclosed financing round.
          tone: positive
          claimRefs: [CO008]
        - label: First profitable year
          year: "2024"
          detail: Multiple 2026 reports say MoMo became profitable in 2024.
          tone: positive
          claimRefs: [CO010]
        - label: Registered-user milestone
          year: "2025"
          detail: Digital in Asia says MoMo crossed 40 million registered users in 2025, a figure not directly comparable with other 2026 user counts.
          tone: neutral
          claimRefs: [CO013]
        - label: New investor process
          date: "2026-04"
          detail: Multiple outlets say MoMo hired Jefferies and Morgan Stanley to explore options including new investors at a valuation above $2B.
          tone: warning
          claimRefs: [CO015, CO016]
    claimRefs: [CO001, CO003, CO008, CO010, CO013, CO015, CO016]
callouts:
  - calloutType: risk
    title: Public scale disclosure is directionally strong but not numerically clean
    body: >-
      Retained 2026 sources support profitability and investor interest, but they
      do not converge on one user definition or one exact headcount figure, which
      limits how confidently this chapter can treat MoMo’s scale as a cover metric.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
