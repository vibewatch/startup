      - Diligence ask
    rows:
      - ["Founder team", "Operating founders", "Founders anchor company origin and continuity, but public sources do not quantify ownership or board control.", "Obtain current cap table, founder ownership %, and any super-voting or veto rights."]
      - ["Mizuho Bank", "Lead investor in Dec 2021 Series E", "Lead name on the last major disclosed round and an anchor for the company’s unicorn-era financing.", "Confirm current ownership %, board representation, and any protective provisions."]
      - ["Warburg Pincus", "2019 growth investor", "Digital in Asia says Warburg led the $100M Series C that funded merchant and QR expansion.", "Verify whether Warburg still holds a material stake post-2021 financing."]
      - ["Goodwater / Kora / Ward Ferry / Standard Chartered", "Named later-stage investor set", "Metropolitan lists them among the investor base, but public sources do not break out economics or governance rights.", "Request round-by-round ownership dilution and liquidation preference stack."]
      - ["Jefferies and Morgan Stanley", "2026 strategic-process advisers", "Their mandate signals an active capital process above $2B valuation, but not a completed financing.", "Clarify whether the process targets primary capital, secondary liquidity, or strategic sale options."]
    notes: >-
      Representative stakeholder map only: retained sources name major investors
      and advisers, but do not disclose the live cap table, debt, secondaries, or
      board-seat allocation as of runDate.
    enumerationScope:
      coverage: partial
      basis: >-
        Built from assigned 2019-2026 funding coverage that names representative
        investors and advisers, but does not publish an exhaustive as-of-runDate
        ownership or governance ledger.
    claimRefs: [CO006, CO008, CO009, CO015]
