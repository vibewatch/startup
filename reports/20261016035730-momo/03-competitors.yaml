      - Target segment
      - Differentiation
      - Limitation
    rows:
      - [MoMo, direct wallet / super app, "40m registered users in 2025; $434M raised; $2B valuation signal", "General consumer payments plus embedded finance", "Broadest product scope across payments, lending, savings, insurance, tickets, and merchant tools", "Public pricing and realized economics not disclosed in assigned pool"]
      - [ZaloPay, direct wallet, "~12m users (est.)", "Social-commerce and chat-centric consumers", "Native Zalo messaging integration for in-chat payments and merchant flows", "Smaller public scale signal than MoMo; economic disclosures not surfaced"]
      - [ViettelPay, direct wallet / incumbent-distribution challenger, "~20m users (est.)", "Rural users, utility/government payments, telecom-linked onboarding", "Viettel point-of-sale footprint extends reach beyond urban wallet strongholds", "Less evidence of broad super-app breadth than MoMo"]
      - [VNPay / VietQR, substitute rail / incumbent banking infrastructure, "Interoperable QR acceptance across bank apps and many wallets", "Merchants and buyers that prefer bank-linked checkout", "Reduces need for exclusive wallet integration by standardizing QR acceptance", "Does not by itself replicate wallet-led ecosystem engagement"]
      - [Moca, adjacent wallet / embedded checkout, "Public current scale not captured in assigned pool", "Ride-hailing or commerce-linked checkout contexts", "Still cited as one of the top-three popular wallets in Vietnam's two largest cities in older market material", "Assigned pool lacks current product, funding, and merchant-acceptance detail"]
      - ["Fiin / TIMA / Home Credit Vietnam", adjacent fintech alternatives, "MoMo profile lists these among top competitors; TIMA shown as Series B while others are less disclosed", "Borrowers or users solving narrower financial-service jobs", "Compete for lending and financial-product usage without needing to beat MoMo at general wallet acceptance", "Narrower job-to-be-done than a full payment super app"]
    notes: "Rows combine company-issued and independent sources; estimated or older scale figures stay labeled, and blank economics should be read as evidence gaps rather than zeros."
    claimRefs: [CP003, CP004, CP005, CP007, CP008, CP009, CP011, CP013]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - MoMo
      - ZaloPay
      - ViettelPay
      - VNPay / VietQR / bank apps
    rows:
      - ["Consumer reach", "High: 31m users in 2022 and 40m registered users in 2025 cited by third parties", "Medium: ~12m users (est.)", "Medium-high: ~20m users (est.)", "High for acceptance, but user base is fragmented across banks and apps"]
      - ["Social / chat commerce", "Medium: broad app, but no cited chat-native advantage", "High: in-chat and Zalo Official Account payment flows", "Low-medium: more utility and distribution-led", "Low: rails, not a social interface"]
      - ["Rural cash-in / onboarding reach", "High: official page cites >4,000 financial points across 45 provinces", "Low-medium: assigned pool emphasizes urban/social fit", "High: Viettel telecom outlets and rural communes are a named strength", "Medium: depends on bank coverage rather than wallet agent network"]
      - ["Embedded financial-services breadth", "High: lending, insurance, savings, investments, travel, and merchant tools", "Medium: payments-led evidence, broader breadth not well surfaced here", "Low-medium: payments and utility use cases dominate assigned evidence", "Low: interoperability rail rather than full super-app bundle"]
      - ["Government / utility fit", "Medium: broad payments platform", "Medium: secondary option outside Zalo-native commerce", "High: government services, top-ups, and utility payments are highlighted strengths", "High: interoperable bank/payment-provider acceptance"]
    notes: "This matrix expresses evidence-backed relative fit, not benchmarked product scores; unsupported breadth or pricing details remain explicitly low-confidence or unknown."
    claimRefs: [CP001, CP002, CP006, CP007, CP008, CP009, CP010, CP011, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public price / unit signal
      - Public onboarding / contract model
      - Included capabilities evidenced
      - Implication
    rows:
      - [MoMo, "Public merchant discount rates or wallet take rates not disclosed in assigned pool", "Consumer wallet onboarding plus bank / financial-institution partnerships", "Payments, transfers, bill pay, lending, insurance, savings, investments, tickets, travel", "Packaging breadth can support lock-in even when pricing is opaque"]
      - [ZaloPay, "Public price signal not disclosed in assigned pool", "Wallet flow embedded in Zalo social graph and merchant chats", "Chat payments, bill-splitting, Zalo OA storefront purchases", "Packaging is narrower than MoMo but can convert well where social distribution matters most"]
      - [ViettelPay, "Public price signal not disclosed in assigned pool", "Wallet onboarding reinforced by Viettel's offline distribution points", "Mobile top-ups, government services, utility payments, rural payment access", "Distribution can offset weaker breadth if the buyer needs reach outside urban digital-first segments"]
      - [VNPay / VietQR / bank apps, "No single wallet-style list price; assigned pool only supports interoperability description", "Merchant or bank-led QR acceptance through interoperable standard", "Cross-bank QR acceptance and bank-app checkout", "This substitute can commoditize basic checkout and lower exclusivity for any one wallet"]
    notes: "The assigned pool supports packaging and distribution comparisons much better than price transparency; unknown rate cells are intentional evidence gaps."
    claimRefs: [CP001, CP002, CP007, CP008, CP009, CP012, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on cited evidence for distribution reach (x) and breadth of
      embedded financial-service scope (y), not on audited performance benchmarks.
    xAxis:
      label: Distribution reach / buyer ubiquity
      min: 1
      max: 5
      low: niche or context-specific
      high: nationally pervasive / default checkout
      description: evidence-backed ordinal scoring
      scale: ordinal
    yAxis:
      label: Breadth of embedded financial-service scope
      min: 1
      max: 5
      low: single-purpose payment rail
      high: multi-product financial super app
      description: evidence-backed ordinal scoring
      scale: ordinal
    data:
      points:
        - label: MoMo
          x: 5
          y: 5
          tone: positive
          note: "Highest supported combination of public user scale, partner breadth, and multi-product scope."
        - label: ZaloPay
          x: 4
          y: 3
          tone: warning
          note: "Strong social-commerce distribution, but assigned evidence shows narrower product breadth than MoMo."
        - label: ViettelPay
          x: 4
          y: 2
          tone: warning
          note: "Distribution-heavy rival with rural and utility-payment strengths."
        - label: VNPay / VietQR
          x: 5
          y: 1
          tone: neutral
          note: "Interoperable acceptance rail with broad checkout relevance but limited wallet-style ecosystem evidence here."
        - label: Moca
          x: 2
          y: 1
          tone: warning
          note: "Still appears in older popularity rankings, but current breadth and scale are under-documented in this pool."
        - label: Lending / finance adjacencies
          x: 2
          y: 2
          tone: warning
          note: "Apps such as Fiin, TIMA, and Home Credit compete for specific financial jobs without matching full wallet ubiquity."
    approximationNotes: >-
      Scores are ordinal synthesis from the cited sources' descriptions of reach, use cases, and
      substitute rails; they should not be read as measured market-share or feature-count deltas.
    claimRefs: [CP003, CP004, CP005, CP007, CP008, CP009, CP010, CP012, CP013, CP014]
callouts:
  - calloutType: strength
    title: Breadth remains MoMo's clearest edge
    body: >-
      MoMo's strongest advantage is not one payment feature but the combination of wide consumer
      reach, partner density, and a broader embedded-finance bundle than the wallet-only evidence
      surfaced for direct peers.
    claimRefs: [CP002, CP005, CP010, CP014]
  - calloutType: risk
    title: Interoperable rails can commoditize basic checkout
    body: >-
      VietQR and bank-app acceptance mean merchants can capture digital-payment demand without
      staying exclusive to one wallet, so MoMo still has to earn engagement through ecosystem
      value rather than simple QR ubiquity.
    claimRefs: [CP009, CP012]
