  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: merchant-pricing
      missingEvidence: Comparable public merchant discount rates, wallet rebate programs, and contract economics for MoMo, ZaloPay, ViettelPay, and bank-led QR acceptance.
      whyItMatters: Without realized pricing and subsidy data, the chapter can compare positioning and breadth but cannot prove which player monetizes best or buys share most aggressively.
      diligencePath: Request current merchant pricing schedules, incentive terms, and take-rate disclosures from management or payment partners.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP003]
    - type: stale
      severity: material
      topic: rival-scale-comparability
      missingEvidence: Current, like-for-like active-user, transaction-volume, and merchant-acceptance metrics for ZaloPay, ViettelPay, VNPay, and Moca.
      whyItMatters: Public sources mix registered users, estimated users, and projections, which weakens direct scale comparison across alternatives.
      diligencePath: Gather 2025-2026 management disclosures, regulator data, or audited market-share studies using a common denominator.
      relatedQuestionRefs: [QP002]
    - type: missing-source
      severity: minor
      topic: adjacent-entrant-watchlist
      missingEvidence: Fresh public product and funding detail for Moca, ShopeePay, and additional adjacent fintech entrants named only indirectly in the assigned pool.
      whyItMatters: The broader field may shift faster than the direct-wallet trio suggests, especially if ecosystem-linked entrants regain momentum.
      diligencePath: Add current official or independent competitor profiles for commerce-linked wallets and new fintech entrants in the next refresh cycle.
      relatedQuestionRefs: [QP001, QP006]
