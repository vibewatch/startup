schemaVersion: "report-v2"
artifact: competitors
slug: momo
runDate: 2026-10-16
company:
  name: MoMo
chapter:
  number: 3
  title: Competitors
  summary: >-
    MoMo still looks like Vietnam's broadest consumer wallet/super-app bundle, but the moat is
    distribution- and ecosystem-based rather than price-based. ZaloPay and ViettelPay each own a
    structurally advantaged flank, while VietQR and bank-app rails reduce the need for merchants
    or buyers to stay exclusive to any single wallet.
sections:
  - id: landscape-and-classes
    title: Landscape and competitor classes
    body: >-
      The competitive set is wider than "other wallets." Direct wallet peers include ZaloPay and
      ViettelPay; substitute rails include bank-app transfers and VietQR; adjacent competitors
      include lending and financial-services apps; and older ride-hailing or commerce-linked
      wallets such as Moca remain relevant for specific checkout contexts. Public evidence still
      shows MoMo as the scale leader: one independent profile says it has 12 active competitors,
      while another says MoMo, ZaloPay, and VNPay together account for roughly three quarters of
      Vietnam's mobile-payment transactions. That framing matters because MoMo competes on breadth
      of use cases and acceptance, not just on owning one payment flow.
    claimRefs: [CP003, CP004, CP005, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-tradeoffs-and-substitutes
    title: Buyer trade-offs and substitute paths
    body: >-
      The strongest alternatives win on context, not on a like-for-like feature war. ZaloPay's
      advantage is social commerce because it lives inside Zalo and supports chat-native payments.
      ViettelPay's advantage is distribution through Viettel's nationwide telecom footprint,
      especially outside Vietnam's biggest cities and in government or utility-payment contexts.
      VietQR and bank apps are the most important substitute because they offer interoperable
      acceptance across banks and many wallets, so merchants do not need to bet on a single
      closed ecosystem. For many sellers, the practical choice is MoMo first for reach, then
      ZaloPay or VietQR where audience fit is stronger.
    claimRefs: [CP005, CP007, CP008, CP009, CP011]
    tableRefs: [TP002]
  - id: moat-durability-and-pricing
    title: Moat durability, packaging, and lock-in
    body: >-
      MoMo's defensibility comes from ecosystem density rather than transparent public pricing.
      Company and third-party sources consistently describe a wallet that has expanded into
      lending, insurance, savings, investments, ticketing, travel, and merchant tools, which
      increases switching costs for heavy users. But the same evidence also argues the wallet
      category is fragmented and structurally low-margin: one sector analysis counts about 40
      active e-wallets and explicitly says subsidies remain a common retention tool. That means
      MoMo's moat is durable only if its broader financial-services bundle keeps users and
      merchants engaged better than interoperable QR rails or distribution-led rivals can.
    claimRefs: [CP001, CP002, CP010, CP012, CP014]
    tableRefs: [TP003]
  - id: open-questions-and-watchpoints
    title: Open questions and watchpoints
    body: >-
      The public evidence pool is good enough to map strategic positions, but not to underwrite
      take-rate economics. Merchant discount rates, wallet rebates, contract terms, and realized
      unit economics remain largely undisclosed in the assigned sources, so the chapter can
      compare packaging breadth and channel fit but not prove who monetizes best. The same issue
      applies to rival scale comparability: MoMo is quoted with 31 million users in 2022 and 40
      million registered users in 2025, while ZaloPay and ViettelPay figures are mostly estimates
      or projections. The competitive verdict is therefore strong on buyer fit and distribution,
      but only medium confidence on pricing power.
    claimRefs: [CP006, CP007, CP008, CP010, CP011, CP012]
tables:
