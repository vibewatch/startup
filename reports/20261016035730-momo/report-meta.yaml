companyProfile:
  summary: >-
    MoMo is Vietnam's leading digital wallet and broader financial super-app, operated by M_Service and headquartered in
    Ho Chi Minh City. The company was founded in 2007, launched its consumer wallet in 2010, and has expanded from
    payments into lending, insurance, savings, investments, and merchant tools. Retained 2026 coverage says MoMo has
    been profitable since 2024 and is exploring strategic options with new investors at a valuation above $2 billion,
    but the public source set still leaves user definitions, governance rights, and exact operating scale only partially
    disclosed.
