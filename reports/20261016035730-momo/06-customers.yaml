figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a funnel that is easy to enter through payments but harder
      to deepen into recurring, multi-category financial use.
    data:
      items:
        - label: Acquire
          body: "Consumers install for transfers, QR checkout, bills, or promotions."
          touchpoints:
            - P2P transfer
            - QR payment
            - Bill payment
        - label: Activate
          body: "Named retail acceptance such as Bách Hóa Xanh converts installs into physical checkout use."
          touchpoints:
            - Grocery checkout
            - Online channel acceptance
            - Cashback / discount
        - label: Repeat
          body: "Repeat usage depends on building a second habit beyond commodity QR rails shared with bank apps."
          touchpoints:
            - Bills
            - Transport / travel
            - Daily services
        - label: Expand
          body: "MoMo broadens from payments into merchant offers, BNPL, savings, insurance, and investments."
          touchpoints:
            - Postpaid wallet
            - Lending
            - Insurance
        - label: Monetize
          body: "Higher-value economics appear when active users adopt financial products rather than only payment flows."
          touchpoints:
            - Credit
            - Savings
            - Investment
        - label: Retain
          body: "The main risk is dormancy: registered scale exceeds the best public monthly-active datapoint in the pool."
          touchpoints:
            - Monthly activity
            - Multi-category use
            - Habit formation
    claimRefs: [CU003, CU005, CU008, CU010, CU011, CU013]
