      - ["Bách Hóa Xanh postpaid-wallet use case", "Retail consumers using BNPL", "Users could pay with MoMo's postpaid wallet at participating stores", Production, "Demonstrates expansion from payment acceptance into higher-value wallet usage", "Still one merchant case study rather than broad cohort evidence"]
      - ["Public partner network proof", "Banks / FIs / merchants", "70+ financial-institution partners plus 140K-300K+ acceptance points", Production aggregate, "Supports broad distribution surfaces for customer acquisition and cross-sell", "Not a clean named-customer roster; public evidence remains aggregate"]
    notes: >-
      Public named customer proof in the assigned pool is thin, so this table mixes one
      named retailer deployment with two production proof points that remain aggregate.
