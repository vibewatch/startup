      - ["Current nationwide user base", ">30M users across Vietnam", "2026-04", "Metropolitan Asia / TechStartups / InforCapital", medium, "Confirms large present-day consumer reach", "No official MAU, payer, or active-account split"]
      - ["Registered vs active base", "40M registered; ~10M MAU; ~25% implied monthly activity", "2026-07 analysis citing 2026-03 self-report", "Arie portfolio analysis", low, "Suggests many registered accounts may be dormant", "No company cohort, churn, or repeat-purchase disclosure"]
      - ["Merchant footprint", "140K to 300K+ acceptance points", "2026-04 to 2026-07", "Digital in Asia / Metropolitan Asia", medium, "Merchant-side scale is meaningful even if exact count is disputed", "Counting methodology and active-merchant definition are unclear"]
    notes: >-
      Values preserve each source's own metric language and are not normalized into ARR,
      GMV, or active-merchant estimates when the denominator is not disclosed.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU011]
  - id: TU003
