  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: MoMo's current NRR, GRR, logo churn, cohort retention, and renewal disclosures.
      whyItMatters: Without retention denominators, the chapter cannot distinguish registered scale from durable monetizable usage.
      diligencePath: Request the last 12 months of monthly active users, cohort retention, repeat-purchase frequency, and churn by major product line from management.
      relatedQuestionRefs: [QU005, QU006, QU008]
      relatedTableRefs: [TU002]
    - type: conflicting-data
      severity: material
      topic: distribution
      missingEvidence: A reconciled current definition for active users, registered users, active merchants, and payment acceptance points.
      whyItMatters: Public sources conflict on the size of both the active user base and merchant footprint, which weakens comparability across the adoption narrative.
      diligencePath: Ask management to reconcile registered users, MAU, acceptance points, and active merchants to one dated KPI table with methodology notes.
      relatedQuestionRefs: [QU002, QU004, QU005]
      relatedTableRefs: [TU001, TU002, TU003]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A dated list of top customer logos, merchant cohorts, production deployments, and case-study outcomes beyond Bách Hóa Xanh.
      whyItMatters: One named merchant proof point is not enough to judge whether adoption is broad, repeatable, or concentrated in a few channels.
      diligencePath: Request the top 20 merchant and channel accounts by payment volume, contract status, and retention, plus 3-5 current customer references.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-customer, top-merchant, and top-partner concentration plus procurement-cycle dependence by channel.
      whyItMatters: Channel or enterprise concentration could make MoMo's customer proof look broader than the underlying revenue base really is.
      diligencePath: Request gross payment volume and revenue contribution by top merchants, partner channels, and financial-institution relationships for the last four quarters.
      relatedQuestionRefs: [QU008]
