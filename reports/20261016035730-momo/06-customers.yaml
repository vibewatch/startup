schemaVersion: "report-v2"
artifact: customers
slug: momo
runDate: 2026-10-16
company:
  name: MoMo
chapter:
  number: 6
  title: Customers
  summary: >-
    MoMo has credible evidence of nationwide consumer and merchant reach, with multiple
    2026 secondary sources putting the user base above 30 million and a named retail
    deployment at Bách Hóa Xanh. The weaker point is durability: the strongest active-use
    datapoint in the assigned pool is an independent July 2026 analysis citing roughly 10
    million monthly actives on 40 million registered users, while public sources do not
    disclose retention, churn, or customer concentration.
sections:
  - id: customer-base-and-segments
    title: Customer base spans consumers, merchants, and financial-distribution partners
    body: >-
      MoMo's customer footprint is broad, but the public evidence mixes stale official
      pages with fresher secondary reporting. The official about-us page still describes a
      historical base of 2.5 million customers, 1 million app users, and 4,000 financial
      transaction points across 45 provinces, including rural access. By April 2026,
      multiple news summaries were instead describing MoMo as serving more than 30 million
      users nationwide, with a large acceptance and banking network. That combination
      suggests the buyer and payer surface is no longer just individual wallet users:
      merchants, small businesses, retailers, and bank-linked financial partners now sit
      inside the same operating network. The problem for diligence is not lack of scale
      signals; it is the absence of one current, primary disclosure that reconciles
      consumer, merchant, and partner counts into a single taxonomy.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-usage-quality
    title: Adoption proof exists, but active-use quality is materially less clear than logo scale
    body: >-
      The strongest named deployment proof in the assigned pool is Bách Hóa Xanh, where
      MoMo became an accepted payment method in more than 500 Ho Chi Minh City stores
      after already being available on the retailer's online channel. That shows real
      production usage rather than logo-only association. Public scale reporting is much
      less consistent once the analysis moves from registrations to activity. Secondary
      2026 coverage repeatedly cites more than 30 million users, while an independent July
      2026 portfolio analysis cites 40 million registered users but only about 10 million
      monthly actives, implying a large dormant base. For this chapter, that means MoMo
      has credible acquisition and distribution breadth, but the better diligence question
      is whether the installed base converts into recurring, multi-category usage.
    claimRefs: [CU004, CU005, CU008, CU009, CU011, CU012]
    tableRefs: [TU002, TU003]
  - id: expansion-durability-and-concentration
    title: Expansion logic is plausible, but retention and concentration disclosures remain thin
    body: >-
      The public narrative around MoMo's customer economics is land-and-expand: acquire a
      consumer through payments, then deepen wallet habits with lending, insurance,
      investments, bill pay, and merchant offers. That logic is reinforced by broadening
      small-business and merchant tooling, plus the named Bách Hóa Xanh example where
      MoMo extended from online acceptance into offline checkout and postpaid-wallet use.
      Even so, the evidence pool does not publish NRR, GRR, churn, renewal, cohort, or
      top-customer concentration metrics, and even merchant-footprint disclosures conflict
      between roughly 140,000 and more than 300,000 acceptance points. The chapter
      conclusion is therefore positive on surface-level adoption and expansion vectors, but
      cautious on durability because management has not given public investors the
      denominator set needed to judge repeat behavior or concentration risk cleanly.
    claimRefs: [CU005, CU006, CU007, CU010, CU011, CU013]
callouts:
  - calloutType: strength
    title: Distribution breadth is real
    body: >-
      Multiple 2026 sources converge on a user base above 30 million, and the named Bách
      Hóa Xanh rollout shows MoMo can convert distribution into production checkout use.
    claimRefs: [CU004, CU008, CU009]
  - calloutType: risk
    title: Retention quality is still underdisclosed
    body: >-
      The strongest activity datapoint in the assigned pool suggests a large gap between
      registered users and monthly actives, while public sources still omit churn,
      retention, and concentration data.
    claimRefs: [CU005, CU011]
