callouts:
  - calloutType: "risk"
    title: "Top residual risk is control-assurance mismatch, not obvious demand weakness"
    body: "Public sources support MoMo's scale and breadth, but they do not yet provide enough third-party audit, incident, or merchant-economics evidence for outside investors to underwrite the enlarged platform with the same confidence as the growth narrative."
    claimRefs: ["CR004", "CR008", "CR010", "CR011", "CR012"]
  - calloutType: "recommendation"
    title: "Use explicit thesis-break triggers before underwriting valuation upside"
    body: "Treat disclosed enforcement, repeated severe outages, material partner-bank disruption, or a 2026 financing outcome with unusually defensive terms as kill criteria that require a full re-underwrite rather than incremental monitoring."
    claimRefs: ["CR001", "CR002", "CR006", "CR009", "CR013"]
