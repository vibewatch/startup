  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: user-scale
      missingEvidence: A company or regulator disclosure reconciling registered users, active users, and transacting users.
      whyItMatters: User-scale disagreement directly affects adoption depth, cross-sell assumptions, and any attempt to derive a MoMo-specific SAM or SOM.
      diligencePath: Request management KPI definitions or audited investor materials that reconcile registered, monthly active, and transacting-user counts.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: sam-som-gap
      missingEvidence: Public disclosure of merchant count, effective take rate, active-user mix, and attach rates into lending, insurance, and investment products.
      whyItMatters: Without those conversion inputs, a market-size estimate cannot be converted into a defendable revenue opportunity for MoMo.
      diligencePath: Obtain management metrics or investor materials that break out merchant monetization and product penetration by cohort.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002, TM003]
    - type: private-evidence-only
      severity: minor
      topic: budget-owner-split
      missingEvidence: Contract-level economics showing how merchants and financial-product partners pay for distribution through MoMo.
      whyItMatters: Budget-owner clarity would sharpen which side of the platform drives margin and which adoption motions deserve valuation weight.
      diligencePath: Review partnership agreements or management commentary on fee splits, commissions, and merchant-pricing architecture.
      relatedQuestionRefs: [QM004, QM005]
