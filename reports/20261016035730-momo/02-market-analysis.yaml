schemaVersion: "report-v2"
artifact: market-analysis
slug: momo
runDate: "2026-10-16"
company:
  name: MoMo
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    MoMo's core market is broader than wallet payments but narrower than generic
    "super app" rhetoric: the addressable spend sits at the intersection of
    Vietnam's cashless-payments shift, merchant acceptance, and embedded
    financial-product distribution. Public evidence supports the top-down market
    trajectory and MoMo's broad reach, but it does not isolate a clean SAM/SOM
    because public sources conflict on user scale and do not disclose active-user,
    merchant-take-rate, or attach-rate conversion needed to turn national payment
    GMV into MoMo-specific revenue capacity.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      Public evidence supports defining MoMo as a Vietnam consumer-and-merchant
      financial-services platform rather than as a generic "fintech app" or an
      undifferentiated super app. The official company description anchors the
      boundary in licensed mobile payments, e-wallet transfers, collection and
      disbursement services, and a payment platform that extends access into areas
      where banking penetration has historically been weak. Recent independent
      coverage then widens that boundary to the higher-value layers MoMo now sells
      inside the app, including lending, insurance, savings, investment, and
      merchant tooling. That means the relevant substitute set is not only rival
      wallets; it also includes cash, bank-led payment flows, and standalone
      financial-product distribution that MoMo is trying to collapse into one
      application. The chapter therefore treats broad Vietnam digital-payment GMV
      as a boundary-setting lens, not as a direct proxy for MoMo revenue.
    claimRefs: [CM001, CM002, CM007, CM008, CM013]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses are credible at the top of the funnel but weak at the MoMo-specific cut
    body: >-
      The cleanest public sizing lens is the national payments backdrop. Reuters
      syndication carried Bain's estimate that Vietnam digital payment transaction
      value rises from USD 150 billion in 2024 to USD 178 billion in 2025 and to
      USD 300-400 billion by 2030, which is directionally useful because it shows
      the size and growth of the wallet-adjacent pool MoMo sells into. The harder
      step is translating that top-down volume into a MoMo-specific TAM, SAM, or
      SOM. Public sources disagree on whether MoMo currently serves more than 30
      million users or 40 million registered users, and neither disclosure breaks
      out active users, monetized merchants, take rate, or the attach rate from
      payments into higher-margin financial products. That prevents a defensible
      public SAM/SOM bridge today, so the report preserves the broad market lens
      and explicitly carries the conversion math as an evidence gap instead of
      inventing a precise bottom-up market size.
    claimRefs: [CM003, CM004, CM005, CM006, CM009, CM010, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer adoption is multi-sided, with strong cashless tailwinds but real conversion constraints
    body: >-
      The adoption path is multi-sided. Consumers adopt MoMo for habitual payment
      flows and then encounter adjacent financial products inside the same app;
      merchants and small businesses adopt it as an acceptance and collection
      rail; financial-product partners use the installed base as a lower-friction
      distribution channel. That structure matters for valuation because it means
      MoMo is competing both for consumer wallet share and for partner budgets
      tied to distribution, underwriting, and merchant acquisition. The strongest
      current growth drivers are the shift toward cashless payments and wider use
      of online financial products in Vietnam, but the main constraints remain
      competition, compliance intensity, and the lack of public disclosure around
      user activation and monetization quality. In practice, MoMo looks like a
      large and growing market participant with credible cross-sell optionality,
      but the evidence base still favors market-boundary clarity over precise
      adoption conversion modeling.
    claimRefs: [CM007, CM008, CM009, CM011, CM012, CM013]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - ["Core wallet payments", "P2P transfers, bill pay, mobile top-ups, QR purchases, and mobile payment flows inside the MoMo wallet.", "Offline cash, card-only acquiring, and cross-border remittance rails not described in the retained evidence.", "Consumer / consumer or merchant at transaction time.", "Daily-use entry point that creates the behavioral habit MoMo monetizes."]
      - ["Merchant acceptance and SME tools", "Payment platform, collection/disbursement, and merchant tools tied to domestic digital transactions.", "Standalone POS hardware, core banking software, or enterprise ERP spend outside the app/payment rail.", "Merchant or small business / merchant budget.", "Expands MoMo from a consumer wallet into a seller-side workflow."]
      - ["Embedded consumer finance distribution", "Lending, insurance, savings, and investment products distributed inside the app.", "Balance-sheet lending or wealth assets held off-platform by banks or asset managers unless distributed through MoMo.", "Consumer user; economics ultimately funded by partner financial institutions and commissions.", "Higher-margin adjacency that matters more to valuation than pure payment volume."]
      - ["Lifestyle and service marketplace activity", "Travel, ticketing, donations, rewards, and other service flows routed through the app.", "Generic e-commerce GMV with no payment or financial-service attachment.", "Consumer / partner merchant or service provider.", "Useful for retention and engagement, but not the whole addressable market by itself."]
    notes: >-
      Boundary logic combines the official product scope with independent April
      2026 coverage; included spend reflects what the retained sources explicitly
      place inside MoMo's platform, and exclusions mark adjacent pools the
      evidence does not cleanly attribute to MoMo.
    claimRefs: [CM001, CM002, CM007, CM008, CM013]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Lens
      - Publisher
      - Year / geography
      - Value
      - CAGR / trajectory
      - Methodology / limitation
    rows:
      - ["Vietnam digital payment transaction value", "Bain e-Conomy SEA projection cited by Reuters/Economic Times", "2025 / Vietnam", "USD 178B", "Up from USD 150B in 2024", "Broad transaction-value lens; not MoMo revenue and not wallet-only spend."]
      - ["Vietnam digital payment transaction value range", "Bain e-Conomy SEA projection cited by Reuters/Economic Times", "2030 / Vietnam", "USD 300B-400B", "Long-range market-expansion scenario", "Useful for top-down TAM framing, but too broad to infer MoMo share or take rate."]
      - ["MoMo public user figure (lower)", "Reuters-syndicated April 2026 coverage", "2026 / Vietnam", "30M+ users", "Current public figure in multiple April 2026 reports", "User count only; does not separate registered, active, or monetized cohorts."]
      - ["MoMo public user figure (higher)", "Digital in Asia synthesis", "2025 / Vietnam", "40M registered users", "Article pairs the figure with profitability and penetration claims", "Conflicts with the lower public figure and still does not disclose active-user conversion."]
    notes: >-
      Public evidence supports the national-transaction-value lens, but the
      chapter does not present a clean public SAM/SOM because user and
      monetization disclosures are incomplete and partially conflicting.
    claimRefs: [CM003, CM004, CM005, CM009, CM011]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow / budget owner
      - Adoption trigger
    rows:
      - ["Everyday consumer wallet", "Consumer household", "End consumer", "Consumer at point of use; merchant pays acceptance economics where relevant", "Household payments and convenience budget", "Faster cashless payment, transfers, and one-app utility."]
      - ["Merchant acceptance and collections", "Merchant / SMB owner", "Cashier, store operator, or owner", "Merchant", "Owner or payments-operations budget", "QR acceptance, collections, and participation in cashless demand growth."]
      - ["Embedded finance distribution", "Partner lender, insurer, or investment provider seeking channel access", "Consumer inside the app", "Financial-product partner via commissions, distribution fees, or shared economics", "Partnership / product-distribution budget", "Acquire customers through MoMo's installed base instead of a fully standalone channel."]
      - ["Retention and engagement services", "Partner service provider or merchant", "Consumer", "Partner merchant and consumer depending on service", "Growth or marketing budget", "Increase repeat app usage so payment and finance products stay top of mind."]
    notes: >-
      The map reflects the multi-sided structure visible in retained sources:
      MoMo is not only a consumer wallet, but also a merchant rail and a
      distribution surface for partner financial products.
    claimRefs: [CM007, CM008, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Volume-to-concentration sizing lens
    type: pyramid
    summary: >-
      The figure moves from national payment volume to wallet concentration and
      user-scale indicators, showing why boundary setting is stronger than a fully
      reconciled public SAM/SOM.
    data:
      items:
        - label: Vietnam digital payment transaction value, 2030 high case
          value: 400
          unit: USD bn
          detail: Bain e-Conomy SEA projection cited by Reuters-syndicated April 2026 coverage.
          tone: high
        - label: Vietnam digital payment transaction value, 2025
          value: 178
          unit: USD bn
          detail: Broad national transaction value, not wallet-only spend or MoMo revenue.
          tone: neutral
        - label: Top-three wallet share of mobile payment transactions
          value: 75
          unit: "%"
          detail: Digital in Asia says MoMo, ZaloPay, and VNPay together account for about three quarters of mobile payment transactions.
          tone: medium
        - label: MoMo share estimate within that top-three group
          value: 56
          unit: "%"
          detail: Digital in Asia attributes the single largest wallet share to MoMo.
          tone: opportunity
        - label: MoMo public user figure in Reuters-syndicated coverage
          value: 30
          unit: m users
          detail: More than 30 million users; active-user disclosure remains absent.
          tone: neutral
        - label: MoMo public user figure in Digital in Asia
          value: 40
          unit: m registered users
          detail: Higher registered-user figure conflicts with the Reuters-syndicated number and is not an active-user metric.
          tone: risk
    approximationNotes: >-
      This pyramid is an ordered set of sizing lenses rather than a reconciled
      TAM-to-SAM-to-SOM bridge. Broad transaction-value figures and user counts
      are not directly comparable units, so the chart shows the sequence of
      public evidence rather than an implied conversion rate.
    claimRefs: [CM003, CM004, CM005, CM006, CM010]
callouts:
  - calloutType: insight
    title: Broad market growth is clear; MoMo-specific capture math is not
    body: >-
      Retained sources support a strong Vietnam cashless-payments growth backdrop,
      but they do not disclose the active-user, merchant monetization, or
      product-attach data required to turn that backdrop into a publishable
      MoMo-specific SAM/SOM.
    claimRefs: [CM003, CM009, CM011]
  - calloutType: risk
    title: Public user-scale disclosures are directionally positive but not internally clean
    body: >-
      Public reporting places MoMo above 30 million users and possibly at 40
      million registered users, yet the active-to-registered conversion and the
      monetized cohort remain unverified, which limits valuation confidence on
      cross-sell and retention assumptions.
    claimRefs: [CM004, CM005, CM009]
