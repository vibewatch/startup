            title: Public evidence points to a mix shift, not just bigger payment volume
            body: >-
              MoMo’s better financial story is not simply “more wallet transactions.” The assigned evidence points to a
              broader move into distributed lending, insurance, savings, and investment products, where revenue quality
              depends on partner economics rather than pure payment throughput.
            calloutType: insight
            claimRefs:
              - CI002
