              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Expansion logic is plausible, but retention and concentration disclosures remain thin
        blocks:
          - type: paragraph
            body: >-
              The public narrative around MoMo's customer economics is land-and-expand: acquire a consumer through
              payments, then deepen wallet habits with lending, insurance, investments, bill pay, and merchant offers.
              That logic is reinforced by broadening small-business and merchant tooling, plus the named Bách Hóa Xanh
              example where MoMo extended from online acceptance into offline checkout and postpaid-wallet use. Even so,
              the evidence pool does not publish NRR, GRR, churn, renewal, cohort, or top-customer concentration
              metrics, and even merchant-footprint disclosures conflict between roughly 140,000 and more than 300,000
              acceptance points. The chapter conclusion is therefore positive on surface-level adoption and expansion
              vectors, but cautious on durability because management has not given public investors the denominator set
              needed to judge repeat behavior or concentration risk cleanly.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution breadth is real
            body: >-
              Multiple 2026 sources converge on a user base above 30 million, and the named Bách Hóa Xanh rollout shows
              MoMo can convert distribution into production checkout use.
            calloutType: strength
            claimRefs:
              - CU004
              - CU008
              - CU009
          - type: callout
            title: Retention quality is still underdisclosed
            body: >-
              The strongest activity datapoint in the assigned pool suggests a large gap between registered users and
              monthly actives, while public sources still omit churn, retention, and concentration data.
            calloutType: risk
            claimRefs:
              - CU005
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked residual risks center on regulatory breadth and a still-opaque capital process
        blocks:
          - type: paragraph
            body: >-
              The public record shows a company that is larger, broader, and more regulated than a simple consumer
              wallet. Reuters and multiple follow-on reports say MoMo is exploring strategic options that could value it
              above $2 billion, but the same sources say the process is early stage and may not close. At the same time,
              official and government-linked sources describe a business that now spans payments, lending, insurance,
              savings, investments, AI-driven risk controls, and public-service integrations. That combination raises
              the residual risk rank for regulatory/compliance execution: MoMo has more surface area to supervise, while
              outside investors still lack public visibility into the exact 2026 transaction terms, timing, and whether
              fresh capital is opportunistic or partly defensive.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR012
              - CR013
          - type: table
