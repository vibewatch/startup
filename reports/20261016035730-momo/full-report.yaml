        title: Funding history, current scale signals, and milestone read-through
        blocks:
          - type: paragraph
            body: >-
              The clearest capital marker in the retained set is the $200 million Series E raised in December 2021, with
              independent sources also describing roughly $434 million total capital raised to date. The 2026 update is
              strategic rather than completed financing: multiple reports say MoMo hired Jefferies and Morgan Stanley to
              explore options including new investors at a valuation above $2 billion, while stressing that the talks
              were early and that no deal was guaranteed. Profitability since 2024 is the strongest fresh operating
              milestone in the pool, but scale disclosures are less tidy: retained sources variously cite more than 30
              million users, more than 32 million users, and 40 million registered users in 2025, which should not be
              collapsed into a single “customer count” without management clarification on registered versus active
              users. FundedIQ likewise provides only a 501-1000 employee band, so exact headcount, debt or secondary
              structure, and current investor control terms remain diligence items rather than settled facts.
