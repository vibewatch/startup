      - number: '6.2'
        title: Adoption proof exists, but active-use quality is materially less clear than logo scale
        blocks:
          - type: paragraph
            body: >-
              The strongest named deployment proof in the assigned pool is Bách Hóa Xanh, where MoMo became an accepted
              payment method in more than 500 Ho Chi Minh City stores after already being available on the retailer's
              online channel. That shows real production usage rather than logo-only association. Public scale reporting
              is much less consistent once the analysis moves from registrations to activity. Secondary 2026 coverage
              repeatedly cites more than 30 million users, while an independent July 2026 portfolio analysis cites 40
              million registered users but only about 10 million monthly actives, implying a large dormant base. For
              this chapter, that means MoMo has credible acquisition and distribution breadth, but the better diligence
              question is whether the installed base converts into recurring, multi-category usage.
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU009
              - CU011
              - CU012
          - type: table
