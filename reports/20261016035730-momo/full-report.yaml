  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              The competitive set is wider than "other wallets." Direct wallet peers include ZaloPay and ViettelPay;
              substitute rails include bank-app transfers and VietQR; adjacent competitors include lending and
              financial-services apps; and older ride-hailing or commerce-linked wallets such as Moca remain relevant
              for specific checkout contexts. Public evidence still shows MoMo as the scale leader: one independent
              profile says it has 12 active competitors, while another says MoMo, ZaloPay, and VNPay together account
              for roughly three quarters of Vietnam's mobile-payment transactions. That framing matters because MoMo
              competes on breadth of use cases and acceptance, not just on owning one payment flow.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
