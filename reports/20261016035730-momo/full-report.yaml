      - number: '5.2'
        title: Public engineering evidence points to a shared platform with mini-app delivery
        blocks:
          - type: paragraph
            body: >-
              The best direct architecture evidence in the assigned pool comes from the AgileTech and Callstack pieces.
              AgileTech says MoMo's mini apps inherit the host app's login, payment, and distribution, implying a
              platform model with reusable shared services rather than isolated point products. Callstack then adds
              concrete implementation detail: MoMo migrated its super app and one mini app onto a Re.Pack-based React
              Native architecture with a secure chunk loader, Hermes support, and a MoMo core package, then built a
              sandbox development environment and training for internal teams. Together, those sources support a
              delivery model in which product expansion depends on a reusable mobile shell, shared trust controls, and
              partner-facing mini-app tooling. That is a more mature operating posture than simple wallet feature
              accretion, but it also increases dependency on platform governance and release discipline.
            claimRefs:
