      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Current upside evidence is outweighed by price opacity and missing diligence inputs.
    data:
      nodes:
        - id: scale
          label: Scale and profitability proof
          note: 30 million-plus users and reported profitability since 2024.
        - id: market
          label: Large market tailwind
          note: Reuters/Bain market-growth outlook supports continued digital-payments adoption.
        - id: price
          label: Price support is thin
          note: Latest public signal is an exploratory >$2 billion process, not a closed round.
        - id: diligence
          label: Missing diligence items
          note: No public auditeds, term sheet, liquidation stack, or cap-table details.
        - id: exit
          label: Exit timing is deferred
          note: Public sources say an IPO is not on the near-term agenda.
        - id: recommendation
          label: Recommendation = research-more
          note: Positive only after economics and terms support the entry price.
      edges:
        - from: scale
          to: recommendation
          label: supports upside
        - from: market
          to: recommendation
          label: supports demand
        - from: price
          to: recommendation
          label: limits conviction
        - from: diligence
          to: recommendation
          label: blocks underwriting
        - from: exit
          to: recommendation
          label: reduces liquidity support
    approximationNotes: Logic chain summarises qualitative weighting; it is not a probabilistic model.
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
      - CV015
