    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Indicative valuation / return logic
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - >-
          Profitability proves durable, user scale converts into higher-margin financial-services revenue, and strategic
          investors pay a private premium for category leadership.
        - >-
          A clean private round above $2 billion can be defended if diligence confirms economics materially stronger
          than public comps imply.
        - Would require signed financing terms plus audited proof that 2024 profitability is repeatable.
        - >-
          Execution risk in lending/insurance expansion; premium could evaporate if process slips or structure becomes
          aggressive.
      - - Base
        - >-
          MoMo remains strategically strong, but investors anchor on public payments comps plus incomplete disclosure
          rather than on scarcity alone.
        - >-
          Using public peers at roughly 2.0x-2.9x revenue on the reported ~$482 million revenue base suggests a rough
          band near $1.0 billion-$1.4 billion.
        - Best matches the current public record because it uses disclosed revenue and listed-peer multiple evidence.
        - Reported revenue is unaudited in public sources, and peer comparability is imperfect for a super-app mix.
      - - Bear
        - >-
          Financing process stalls or clears only with heavy structure after diligence exposes weaker margin quality or
          overstates monetizable user depth.
        - >-
          A reset below the base-case range becomes plausible if the market leans toward lower public comp multiples or
          discounts opaque terms.
        - >-
          Would likely coincide with no near-term IPO path, failed price discovery, or diligence gaps remaining open
          late in process.
        - Down-round optics, preference overhang, and weaker exit optionality.
