      - number: '2.3'
        title: Buyer adoption is multi-sided, with strong cashless tailwinds but real conversion constraints
        blocks:
          - type: paragraph
            body: >-
              The adoption path is multi-sided. Consumers adopt MoMo for habitual payment flows and then encounter
              adjacent financial products inside the same app; merchants and small businesses adopt it as an acceptance
              and collection rail; financial-product partners use the installed base as a lower-friction distribution
              channel. That structure matters for valuation because it means MoMo is competing both for consumer wallet
              share and for partner budgets tied to distribution, underwriting, and merchant acquisition. The strongest
              current growth drivers are the shift toward cashless payments and wider use of online financial products
              in Vietnam, but the main constraints remain competition, compliance intensity, and the lack of public
              disclosure around user activation and monetization quality. In practice, MoMo looks like a large and
              growing market participant with credible cross-sell optionality, but the evidence base still favors
              market-boundary clarity over precise adoption conversion modeling.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
