              - CR012
          - type: callout
            title: Use explicit thesis-break triggers before underwriting valuation upside
            body: >-
              Treat disclosed enforcement, repeated severe outages, material partner-bank disruption, or a 2026
              financing outcome with unusually defensive terms as kill criteria that require a full re-underwrite rather
              than incremental monitoring.
            calloutType: recommendation
            claimRefs:
