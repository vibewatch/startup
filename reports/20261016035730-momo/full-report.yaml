      - number: '3.2'
        title: Buyer trade-offs and substitute paths
        blocks:
          - type: paragraph
            body: >-
              The strongest alternatives win on context, not on a like-for-like feature war. ZaloPay's advantage is
              social commerce because it lives inside Zalo and supports chat-native payments. ViettelPay's advantage is
              distribution through Viettel's nationwide telecom footprint, especially outside Vietnam's biggest cities
              and in government or utility-payment contexts. VietQR and bank apps are the most important substitute
              because they offer interoperable acceptance across banks and many wallets, so merchants do not need to bet
              on a single closed ecosystem. For many sellers, the practical choice is MoMo first for reach, then ZaloPay
              or VietQR where audience fit is stronger.
            claimRefs:
              - CP005
              - CP007
