          users, which can support a scarcity premium for a scaled Vietnamese fintech leader.
        - >-
          Audited segment economics showing profit is not one-off and is driven by durable higher-margin products would
          strengthen this case.
      - - Thesis
        - >-
          Bain market forecasts cited by Reuters point to a large, still-growing Vietnam digital-payments market,
          preserving room for MoMo to deepen monetization beyond wallet payments.
        - >-
          Evidence that lending, insurance, savings, and merchant tools are scaling without regulatory or credit
          slippage would improve conviction.
      - - Anti-thesis
        - >-
          The freshest public price signal is only an exploratory >$2 billion investor process that may not close, so
          there is no current priced round validating the headline mark.
