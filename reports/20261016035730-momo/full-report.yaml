              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Operational resilience matters more because transaction, public-service, and AI scale raise the blast radius
        blocks:
          - type: paragraph
            body: >-
              MoMo's scale is itself a risk amplifier. Government-linked reporting says the platform processes each
              transaction through multiple parallel AI models and supports a meaningful share of Vietnam's online
              public-service payment flows, while third-party reporting says MoMo also claims more than 30 million
              users, more than 70 banks and financial institutions, and more than 300,000 acceptance points. Against
              that backdrop, RFP-focused external review content flags recurring complaint clusters around crashes,
              forced restarts, congestion, account locks, and support delays. Those signals do not prove a systemic
              incident, but they do mean that outages, model errors, or support failures would affect a large installed
              base before outside investors can test them against public SLA, status-page, or audit-pack evidence.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Partner dependency and disclosure gaps define the key diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              MoMo's go-to-market and product model still depends heavily on external institutions. The company
              describes strategic cooperation with banks and financial institutions as core to national reach, and
              third-party coverage points to a dense partner network plus public-service integrations. That supports
              scale, but it also creates dependency risk: service quality, settlement economics, compliance, and fraud
              controls sit partly outside fully public verification. The practical kill criteria are monitorable:
              evidence of enforcement or licensing friction, repeated high-severity reliability failures, partner-bank
              or public-service disruptions, or a 2026 financing process that lands on unusually defensive terms would
              all weaken the underwriting case materially.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR011
              - CR013
              - CR014
