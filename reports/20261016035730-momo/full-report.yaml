  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports defining MoMo as a Vietnam consumer-and-merchant financial-services platform
              rather than as a generic "fintech app" or an undifferentiated super app. The official company description
              anchors the boundary in licensed mobile payments, e-wallet transfers, collection and disbursement
              services, and a payment platform that extends access into areas where banking penetration has historically
              been weak. Recent independent coverage then widens that boundary to the higher-value layers MoMo now sells
              inside the app, including lending, insurance, savings, investment, and merchant tooling. That means the
              relevant substitute set is not only rival wallets; it also includes cash, bank-led payment flows, and
              standalone financial-product distribution that MoMo is trying to collapse into one application. The
              chapter therefore treats broad Vietnam digital-payment GMV as a boundary-setting lens, not as a direct
              proxy for MoMo revenue.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM013
      - number: '2.2'
        title: Sizing lenses are credible at the top of the funnel but weak at the MoMo-specific cut
        blocks:
          - type: paragraph
            body: >-
              The cleanest public sizing lens is the national payments backdrop. Reuters syndication carried Bain's
              estimate that Vietnam digital payment transaction value rises from USD 150 billion in 2024 to USD 178
              billion in 2025 and to USD 300-400 billion by 2030, which is directionally useful because it shows the
              size and growth of the wallet-adjacent pool MoMo sells into. The harder step is translating that top-down
              volume into a MoMo-specific TAM, SAM, or SOM. Public sources disagree on whether MoMo currently serves
              more than 30 million users or 40 million registered users, and neither disclosure breaks out active users,
              monetized merchants, take rate, or the attach rate from payments into higher-margin financial products.
              That prevents a defensible public SAM/SOM bridge today, so the report preserves the broad market lens and
              explicitly carries the conversion math as an evidence gap instead of inventing a precise bottom-up market
              size.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
