              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Top residual risk is control-assurance mismatch, not obvious demand weakness
            body: >-
              Public sources support MoMo's scale and breadth, but they do not yet provide enough third-party audit,
              incident, or merchant-economics evidence for outside investors to underwrite the enlarged platform with
              the same confidence as the growth narrative.
            calloutType: risk
            claimRefs:
              - CR004
              - CR008
              - CR010
