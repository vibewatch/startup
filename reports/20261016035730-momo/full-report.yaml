      - number: '3.4'
        title: Open questions and watchpoints
        blocks:
          - type: paragraph
            body: >-
              The public evidence pool is good enough to map strategic positions, but not to underwrite take-rate
              economics. Merchant discount rates, wallet rebates, contract terms, and realized unit economics remain
              largely undisclosed in the assigned sources, so the chapter can compare packaging breadth and channel fit
              but not prove who monetizes best. The same issue applies to rival scale comparability: MoMo is quoted with
              31 million users in 2022 and 40 million registered users in 2025, while ZaloPay and ViettelPay figures are
              mostly estimates or projections. The competitive verdict is therefore strong on buyer fit and
              distribution, but only medium confidence on pricing power.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth remains MoMo's clearest edge
            body: >-
              MoMo's strongest advantage is not one payment feature but the combination of wide consumer reach, partner
              density, and a broader embedded-finance bundle than the wallet-only evidence surfaced for direct peers.
            calloutType: strength
            claimRefs:
              - CP002
              - CP005
              - CP010
              - CP014
          - type: callout
            title: Interoperable rails can commoditize basic checkout
            body: >-
              VietQR and bank-app acceptance mean merchants can capture digital-payment demand without staying exclusive
              to one wallet, so MoMo still has to earn engagement through ecosystem value rather than simple QR
              ubiquity.
            calloutType: risk
            claimRefs:
