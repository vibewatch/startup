  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base spans consumers, merchants, and financial-distribution partners
        blocks:
          - type: paragraph
            body: >-
              MoMo's customer footprint is broad, but the public evidence mixes stale official pages with fresher
              secondary reporting. The official about-us page still describes a historical base of 2.5 million
              customers, 1 million app users, and 4,000 financial transaction points across 45 provinces, including
              rural access. By April 2026, multiple news summaries were instead describing MoMo as serving more than 30
              million users nationwide, with a large acceptance and banking network. That combination suggests the buyer
              and payer surface is no longer just individual wallet users: merchants, small businesses, retailers, and
              bank-linked financial partners now sit inside the same operating network. The problem for diligence is not
              lack of scale signals; it is the absence of one current, primary disclosure that reconciles consumer,
              merchant, and partner counts into a single taxonomy.
