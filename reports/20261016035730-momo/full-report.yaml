  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope now covers both wallet frequency and higher-value financial jobs
        blocks:
          - type: paragraph
            body: >-
              The product definition is broader than a single e-wallet. Official and third-party sources describe MoMo
              as M_Service's mobile-payment platform, while 2026 coverage consistently frames it as a financial super
              app that layers lending, insurance, savings, investments, merchant tools, and lifestyle services on top of
              the original wallet. AgileTech's teardown is useful because it breaks that breadth into operating layers
              rather than marketing tabs: consumer payments first, then regulated-product distribution, then a platform
              for third-party mini apps. That sequencing matters for customer workflow. The wallet still owns the
              highest-frequency user jobs such as transfers, QR checkout, bill pay, and top-ups, while adjacent modules
              monetize the same identity, balance, and trust rails instead of asking users to rebuild context in
              separate apps.
            claimRefs:
              - CE001
