          value: 30
          unit: m users
          detail: More than 30 million users; active-user disclosure remains absent.
          tone: neutral
        - label: MoMo public user figure in Digital in Asia
          value: 40
          unit: m registered users
          detail: Higher registered-user figure conflicts with the Reuters-syndicated number and is not an active-user metric.
          tone: risk
    approximationNotes: >-
      This pyramid is an ordered set of sizing lenses rather than a reconciled TAM-to-SAM-to-SOM bridge. Broad
      transaction-value figures and user counts are not directly comparable units, so the chart shows the sequence of
      public evidence rather than an implied conversion rate.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM010
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on cited evidence for distribution reach (x) and breadth of embedded financial-service
      scope (y), not on audited performance benchmarks.
    xAxis:
      label: Distribution reach / buyer ubiquity
      min: 1
      max: 5
      low: niche or context-specific
      high: nationally pervasive / default checkout
      description: evidence-backed ordinal scoring
      scale: ordinal
    yAxis:
      label: Breadth of embedded financial-service scope
      min: 1
      max: 5
      low: single-purpose payment rail
      high: multi-product financial super app
      description: evidence-backed ordinal scoring
      scale: ordinal
    data:
      points:
        - label: MoMo
          x: 5
          'y': 5
          tone: positive
          note: Highest supported combination of public user scale, partner breadth, and multi-product scope.
        - label: ZaloPay
          x: 4
          'y': 3
          tone: warning
          note: Strong social-commerce distribution, but assigned evidence shows narrower product breadth than MoMo.
        - label: ViettelPay
          x: 4
          'y': 2
          tone: warning
          note: Distribution-heavy rival with rural and utility-payment strengths.
        - label: VNPay / VietQR
          x: 5
          'y': 1
          tone: neutral
          note: >-
            Interoperable acceptance rail with broad checkout relevance but limited wallet-style ecosystem evidence
            here.
        - label: Moca
          x: 2
          'y': 1
          tone: warning
          note: Still appears in older popularity rankings, but current breadth and scale are under-documented in this pool.
        - label: Lending / finance adjacencies
          x: 2
          'y': 2
          tone: warning
          note: >-
            Apps such as Fiin, TIMA, and Home Credit compete for specific financial jobs without matching full wallet
            ubiquity.
    approximationNotes: >-
      Scores are ordinal synthesis from the cited sources' descriptions of reach, use cases, and substitute rails; they
      should not be read as measured market-share or feature-count deltas.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP007
      - CP008
      - CP009
      - CP010
      - CP012
      - CP013
      - CP014
  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public sources describe a monetization bridge from wallet activity into partner-finance distribution income, not
      just payment fees.
    data:
      nodes:
        - id: users
          label: User and merchant activity
          displayValue: 30m+ users / 300k+ acceptance points
          detail: Metropolitan's public scale proxy for the installed base.
        - id: wallet
          label: Wallet payments
          displayValue: Core transaction layer
          detail: Licensed payments and e-wallet services remain the foundation.
        - id: fees
          label: Merchant payment fees
          displayValue: Take-rate not disclosed
          detail: Public evidence confirms the stream but not its realized pricing.
        - id: crosssell
          label: Financial-product cross-sell
          displayValue: Loans, BNPL, insurance, funds, savings
          detail: Independent sources describe the mix shift beyond pure payments.
        - id: commissions
          label: Distribution / servicing income
          displayValue: Partner-economics opaque
          detail: MoMo appears to earn fees while partners hold most direct lending risk.
        - id: profit
          label: Profitability outcome
          displayValue: First profitable year reported in 2024
          detail: Public reporting says the model reached profitability after subsidy cuts.
      edges:
        - from: users
          to: wallet
          label: Usage creates payment frequency
        - from: wallet
          to: fees
          label: Payments generate transaction fees
        - from: users
          to: crosssell
          label: Installed base enables cross-sell
        - from: crosssell
          to: commissions
          label: Partner products generate commissions or servicing income
        - from: fees
          to: profit
          label: Lower-margin contribution
        - from: commissions
          to: profit
          label: Higher-margin path implied by the mix shift
    approximationNotes: >-
      The bridge is directional rather than numeric because no assigned public source discloses take rates, commission
      schedules, gross margins, or segment contribution by revenue stream.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI008
      - CI009
      - CI011
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public evidence supports a layered stack in which wallet rails, trust controls, and partner delivery
      infrastructure sit beneath both first-party modules and mini apps.
    data:
      layers:
        - label: Consumer entrypoints
          detail: Wallet, QR checkout, bill pay, transfers, and service discovery surfaces.
          items:
            - Wallet balance
            - QR payments
            - P2P transfers
            - Bill pay
        - label: Financial-service modules
          detail: Higher-margin products sit above the wallet habit.
          modules:
            - Lending
            - Insurance
            - Savings
            - Investments
            - Merchant tools
        - label: Lifestyle and commerce layer
          detail: Travel, ticketing, donations, and loyalty keep adjacent use cases in the same app.
          modules:
            - Movie tickets
            - Flights
            - Train rides
            - Hotels
            - Donations / loyalty
        - label: Mini-app and partner runtime
          detail: Third-party services inherit shared login, payment, and distribution.
          modules:
            - Mini apps
            - Partner services
            - Shared distribution
        - label: Identity and trust controls
          detail: Shared controls underpin every product surface.
          modules:
            - eKYC
            - Fraud monitoring
            - Limits management
            - Alerts / restrictions
        - label: Payments core and developer platform
          detail: Ledger, partner connectivity, and mobile-platform tooling support delivery.
          outputs:
            - Ledger / settlement
            - Bank connectivity
            - Secure chunk loader
            - Hermes support
            - Sandbox dev platform
    approximationNotes: >-
      This is a qualitative architecture stack derived from public descriptions rather than a vendor-authored system
      diagram.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a funnel that is easy to enter through payments but harder to deepen into recurring,
      multi-category financial use.
    data:
      items:
        - label: Acquire
          body: Consumers install for transfers, QR checkout, bills, or promotions.
          touchpoints:
            - P2P transfer
            - QR payment
            - Bill payment
        - label: Activate
          body: Named retail acceptance such as Bách Hóa Xanh converts installs into physical checkout use.
          touchpoints:
            - Grocery checkout
            - Online channel acceptance
            - Cashback / discount
        - label: Repeat
          body: Repeat usage depends on building a second habit beyond commodity QR rails shared with bank apps.
          touchpoints:
            - Bills
            - Transport / travel
            - Daily services
        - label: Expand
          body: MoMo broadens from payments into merchant offers, BNPL, savings, insurance, and investments.
          touchpoints:
            - Postpaid wallet
            - Lending
            - Insurance
        - label: Monetize
          body: Higher-value economics appear when active users adopt financial products rather than only payment flows.
          touchpoints:
            - Credit
            - Savings
            - Investment
        - label: Retain
          body: 'The main risk is dormancy: registered scale exceeds the best public monthly-active datapoint in the pool.'
          touchpoints:
            - Monthly activity
            - Multi-category use
            - Habit formation
    claimRefs:
      - CU003
      - CU005
      - CU008
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Regulatory breadth and operational resilience carry the highest residual severity because control evidence is
      still less transparent than the business is large.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual severity
      rows:
        - label: Regulatory / compliance perimeter
          values:
            - text: Medium
            - text: High
              note: Wallet plus lending, insurance, savings, investment, and public-service touchpoints
            - text: High
              tone: warning
              note: Mitigation exists, but external audit and enforcement visibility remain incomplete
        - label: Platform reliability / support strain
          values:
            - text: Medium
              note: Complaint clusters cite crashes, congestion, and support delays
            - text: High
              note: Large consumer and merchant footprint raises outage blast radius
            - text: High
              tone: warning
        - label: Partner / integration dependency
          values:
            - text: Medium
            - text: Medium-high
              note: Bank, public-service, and merchant integrations underpin reach
            - text: Medium-high
              tone: warning
        - label: Capital-process opacity
          values:
            - text: Medium
              note: 2026 process is confirmed but terms and counterparties are undisclosed
            - text: Medium-high
            - text: Medium-high
              tone: neutral
        - label: Merchant economics / support transparency
          values:
            - text: Medium
            - text: Medium
            - text: Medium-high
              note: Contract-only MDR, settlement-cycle, and support evidence limit public underwriting
        - label: Public-service integration dependency
          values:
            - text: Medium
            - text: High
            - text: Medium-high
              note: National-service payment role raises reputational and policy sensitivity
    approximationNotes: >-
      Qualitative ranking based on retained public evidence; the figure does not infer probabilities beyond the cited
      sources.
