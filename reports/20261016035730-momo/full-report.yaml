        title: Scale and breadth are visible, but independent control evidence is still thin
        blocks:
          - type: paragraph
            body: >-
              Product maturity is visible in scope and scale even though the public evidence remains incomplete.
              Reuters-sourced 2026 reporting says MoMo has more than 30 million users, and official plus third-party
              sources show that the service model depends on extensive bank and financial-institution partnerships
              rather than a closed-loop wallet. SME Business Review also describes AI-assisted transaction
              categorization and monitoring algorithms that can alert on unusual activity or restrict transactions,
              which is directionally consistent with a super app handling lending and merchant flows alongside payments.
              The gap is not whether MoMo has broadened the product; it clearly has. The gap is whether outside
