      - number: '4.3'
        title: New capital looks opportunistic, but liquidity and risk-bearing capacity are still opaque
        blocks:
          - type: paragraph
            body: |-
              The last clearly referenced priced financing in the assigned pool is the December 2021
              Series E, when Mizuho led a $200 million round that put MoMo above a $2 billion valuation.
              April 2026 coverage then shows MoMo testing a new investor process with Jefferies and Morgan
              Stanley, but that process is explicitly early-stage and public reporting still does not
              disclose counterparties, timing, or terms. That combination suggests MoMo is raising from a
              position of operating momentum rather than publicly visible distress, yet it does not prove
              capital adequacy. None of the assigned sources provide audited cash on hand, burn, warehouse
              lines, guarantees to lending partners, or credit-loss performance on originated loans. The
              practical verdict is that revenue quality appears to be improving, but capital sufficiency
              and downside protection still require management-room evidence rather than public inference.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
