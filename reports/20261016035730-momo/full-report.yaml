      - number: '1.2'
        title: Leadership, founder continuity, and governance transparency
        blocks:
          - type: paragraph
            body: >-
              The retained pool identifies co-founders Nguyen Manh Tuong and Nguyen Ba Diep as the original operators
              behind M_Service, while FundedIQ lists Pham Thanh Duc as CEO. That gives enough signal to establish
              founder continuity and a named current chief executive, but not enough to verify a full board, committee
              structure, or ownership-linked governance rights. This matters because MoMo is entering another strategic
              process: diligence on control, board seats, and any investor vetoes cannot rely on the assigned public web
              sources alone. In practical terms, the company still appears key-person dependent on a small senior team
              whose public profiles are easier to confirm than the governance mechanics around them.
