chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating scope
        blocks:
          - type: paragraph
            body: >-
              MoMo’s legal operator is M_Service, which the company says was founded in 2007 and licensed by the State
              Bank of Vietnam to provide e-wallet, money-transfer, and collection/disbursement services. Independent
              coverage traces the consumer-wallet launch to 2010, first around mobile top-ups and peer-to-peer
              transfers, then into a much broader financial-services stack. By 2026, retained reporting consistently
              describes MoMo as a Vietnamese financial “super app” rather than a single-product wallet, with lending,
              insurance, savings, investment, and merchant tools layered onto the core payments product. Headquarters
              location is consistent across official and directory-style coverage in Ho Chi Minh City, but the public
              source pack is much stronger on product breadth than on precise current operating metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
