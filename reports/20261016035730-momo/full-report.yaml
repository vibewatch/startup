      - number: '3.3'
        title: Moat durability, packaging, and lock-in
        blocks:
          - type: paragraph
            body: >-
              MoMo's defensibility comes from ecosystem density rather than transparent public pricing. Company and
              third-party sources consistently describe a wallet that has expanded into lending, insurance, savings,
              investments, ticketing, travel, and merchant tools, which increases switching costs for heavy users. But
              the same evidence also argues the wallet category is fragmented and structurally low-margin: one sector
              analysis counts about 40 active e-wallets and explicitly says subsidies remain a common retention tool.
              That means MoMo's moat is durable only if its broader financial-services bundle keeps users and merchants
              engaged better than interoperable QR rails or distribution-led rivals can.
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP012
              - CP014
