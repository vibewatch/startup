  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The investment question is not whether MoMo is strategically important in Vietnam; public reporting
              supports that it is. The question is whether a fresh entry at or above the reported >$2 billion process
              level is already backed by enough public evidence to underwrite returns. The answer is no. Reuters says
              the current process is exploratory, may not result in a transaction, and is not an IPO substitute in the
              near term, while public-market payment comps shown by Multiples trade at materially lower revenue
              multiples than the 2021 private-round anchor. That combination supports a research-more stance rather than
              a buy call, with medium confidence and a stretched public valuation stance until audited economics and
              actual round terms are available.
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.2'
        title: Valuation anchors and thesis balance
        blocks:
          - type: paragraph
            body: >-
              Public valuation support comes from three places: the last priced round, the current but unpriced 2026
              investor process, and comparable public-company multiples. Multiples rounds the last disclosed valuation
              to $2 billion and describes the December 2021 Series E as implying about $2.27 billion post-money, while
              FinTech Futures separately confirms the $200 million raise led by Mizuho. Reuters and multiple
              syndications then show that 2026 interest is occurring above $2 billion, but they stop short of describing
              a signed transaction, round size, or term sheet. That means the bullish thesis rests on scarcity,
              profitability, and scale, while the anti-thesis rests on price opacity, multiple compression risk, and
              limited public disclosure on the current cap table.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              A scenario view is more defensible than a single-point target because the public record mixes one dated
              private-round mark with fresh but non-binding financing chatter. Digital in Asia reports roughly $482
              million of 2024 revenue and first-year profitability, while Multiples shows listed payment peers ranging
              from 0.6x to 2.9x LTM revenue for PicPay and Flywire. That math points to a public-comps band well below
              the 2021 private-round anchor, but strategic scarcity and super-app breadth could still preserve a private
              premium if management can evidence durable profitability and monetization quality. The base case therefore
              centers on a reset toward public-comp discipline, with upside only if private diligence proves materially
              better economics than the public record currently shows.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The gating issue is not market demand but evidence depth. MoMo's official page supports that it is a
              licensed payments platform with long operating history, and Reuters supports that profitability arrived in
              2024, but neither source set resolves margin durability, cash generation, or downside protection in a new
              round. Before underwriting any round above the last disclosed private valuation, investors need audited
              2024-2025 financials, cohort evidence showing how much of revenue and profit comes from higher-margin
              financial services, and the exact preference stack or anti-dilution terms that would shape downside. A
              failure to provide those materials, or a financing process that clears only through structure rather than
              clean price, should be treated as a thesis-break trigger rather than an invitation to stretch.
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV011
              - CV013
              - CV015
