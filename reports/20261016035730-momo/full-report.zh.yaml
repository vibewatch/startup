      - number: '1.2'
        title: 领导层、创始人延续性与治理透明度
        blocks:
          - type: paragraph
            body: >-
              保留来源将 Nguyen Manh Tuong 和 Nguyen Ba Diep 认定为 M_Service 的联合创始人及早期运营者，FundedIQ 则将 Pham Thanh Duc
              列为首席执行官。现有信号足以确认创始人延续性和一名具名的现任 CEO，但不足以核实完整董事会、委员会结构或与持股相关的治理权利。MoMo
              正进入另一项战略流程，因此控制权、董事会席位和投资者否决权不能只依赖指定公开网页来源。实际看，公司仍依赖一支规模不大的高级管理团队，而其公开履历比围绕融资的治理机制更容易核实。
