        title: 待解问题与观察点
        blocks:
          - type: paragraph
            body: >-
              公开证据池足以描绘战略位置，但不足以评估抽成率经济性。指定来源基本没有披露商户折扣费率、钱包返利、合同条款和实际单位经济性，
              因此本章可以比较产品组合广度与渠道匹配度，却无法证明谁的变现能力更强。竞争对手的规模可比性也存在同样问题：MoMo 的公开口径为 2022 年 31M 用户、2025 年 40M 注册用户，而 ZaloPay 和
              ViettelPay 的数字大多是估算或预测。因此，竞争结论在买方匹配度和 分销表现强劲，但对定价能力只有中等信心。
