          label: 较低毛利贡献
        - from: commissions
          to: profit
          label: 收入结构变化暗示更高毛利路径
    approximationNotes: 这条链路体现方向而非数值，因为现有公开来源没有披露费率、佣金安排、毛利率或各收入流的分部贡献。
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI008
      - CI009
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一种分层架构：钱包网络、信任控制和合作伙伴交付基础设施位于自有模块及小程序之下。
    data:
      layers:
        - label: 消费者入口
          detail: 钱包、二维码结账、账单缴费、转账和服务发现入口。
          items:
            - 钱包余额
            - 二维码支付
            - P2P 转账
            - 账单缴费
        - label: 金融服务模块
          detail: 高毛利产品建立在钱包使用习惯之上。
          modules:
            - 放贷
            - 保险
            - 储蓄
            - 投资
            - 商户工具
        - label: 生活方式与商业层
          detail: 旅行、票务、捐赠和忠诚度服务把相邻场景留在同一款应用里。
          modules:
            - 电影票
            - 航班
            - 火车行程
            - 酒店
            - 捐赠 / 忠诚度
        - label: 小程序与合作伙伴运行时
          detail: 第三方服务共享登录、支付和分发能力。
          modules:
            - 小程序
            - 合作伙伴服务
            - 共享分发
        - label: 身份与信任控制
          detail: 共享控制措施支撑每个产品入口。
          modules:
            - eKYC
            - 欺诈监控
            - 限额管理
            - 警报 / 限制
        - label: 支付核心与开发者平台
          detail: 账本、合作伙伴连接和移动平台工具支撑交付。
          outputs:
            - 账本 / 结算
            - 银行连接
            - 安全分块加载器
            - Hermes 支持
            - 沙盒开发平台
    approximationNotes: 这是根据公开描述整理出的定性架构，而非厂商编制的系统图。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，用户容易从支付切入，但更难转化为经常性的多品类金融使用。
    data:
      items:
        - label: 获取
          body: Consumers install for transfers, QR checkout, bills, or promotions.
          touchpoints:
            - P2P 转账
            - 二维码支付
            - 账单缴费
        - label: 激活
          body: Named retail acceptance such as Bách Hóa Xanh converts installs into physical checkout use.
          touchpoints:
            - 杂货结账
            - 线上渠道受理
            - 返现 / 折扣
        - label: 复用
          body: Repeat usage depends on building a second habit beyond commodity QR rails shared with bank apps.
          touchpoints:
            - 账单
            - 交通 / 出行
            - 日常服务
        - label: 扩展
          body: MoMo broadens from payments into merchant offers, BNPL, savings, insurance, and investments.
          touchpoints:
            - 后付费钱包
            - 放贷
            - 保险
        - label: 变现
          body: Higher-value economics appear when active users adopt financial products rather than only payment flows.
          touchpoints:
            - 信贷
            - 储蓄
            - 投资
        - label: 留存
          body: 'The main risk is dormancy: registered scale exceeds the best public monthly-active datapoint in the pool.'
          touchpoints:
            - 月度活跃度
            - 多品类使用
            - 习惯养成
    claimRefs:
      - CU003
      - CU005
      - CU008
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 监管覆盖面和运营韧性的剩余风险最高，因为控制措施的证据透明度仍落后于业务规模。
    data:
      columns:
        - 发生可能性
        - 影响
        - 剩余严重度
      rows:
        - label: 监管 / 合规边界
          values:
            - text: 中
            - text: 高
              note: 覆盖钱包、放贷、保险、储蓄、投资和公共服务入口
            - text: 高
              tone: warning
              note: 已有缓释措施，但外部审计和执法透明度仍不完整
        - label: 平台可靠性 / 支持压力
          values:
            - text: 中
              note: 投诉集中反映崩溃、拥堵和客服延迟
            - text: 高
              note: 庞大的消费者和商户覆盖面会放大宕机影响范围
            - text: 高
              tone: warning
        - label: 合作伙伴 / 集成依赖
          values:
            - text: 中
            - text: 中高
              note: 银行、公共服务和商户集成支撑覆盖范围
            - text: 中高
              tone: warning
        - label: 资本流程不透明
          values:
            - text: 中
              note: 2026 年流程已获确认，但条款和交易对手未披露
            - text: 中高
            - text: 中高
              tone: neutral
        - label: 商户经济性 / 支持透明度
          values:
            - text: 中
            - text: 中
            - text: 中高
              note: 仅有合同层面的 MDR、结算周期和支持证据，限制了公开信息下的收入质量评估
        - label: 公共服务集成依赖
          values:
            - text: 中
            - text: 高
            - text: 中高
              note: 全国性服务支付角色提高了声誉和政策敏感度
    approximationNotes: 定性排名基于留存的公开证据；该图不对引述来源之外的概率作推断。
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 当前上行空间证据不足以抵消价格不透明和尽调输入缺失。
    data:
      nodes:
        - id: scale
          label: 规模与盈利证明
          note: 用户数超过 3000 万，且据报道自 2024 年起实现盈利。
        - id: market
          label: 巨大市场顺风
          note: Reuters/Bain 对市场增长的展望支持数字支付继续普及。
        - id: price
          label: 价格支撑薄弱
          note: 最新公开信号是规模超过 $2 billion 的探索性交易流程，而非已完成的融资轮。
        - id: diligence
          label: 尽调项目缺失
          note: 没有公开审计财务报表、条款清单、清算顺位或股权结构表细节。
        - id: exit
          label: 退出时点延后
          note: 公开来源称，IPO 不在近期计划内。
        - id: recommendation
          label: Recommendation = 继续研究
          note: 只有当商业经济性和交易条款足以支撑入场价格时，结论才会转为积极。
      edges:
        - from: scale
          to: recommendation
          label: 支持上行空间
        - from: market
          to: recommendation
          label: 支持需求
        - from: price
          to: recommendation
          label: 限制确信度
        - from: diligence
          to: recommendation
          label: 阻碍投资判断
        - from: exit
          to: recommendation
          label: 削弱流动性支撑
    approximationNotes: 逻辑链总结定性权重；它不是概率模型。
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
      - CV015
