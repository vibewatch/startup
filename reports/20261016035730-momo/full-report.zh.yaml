      - number: '2.3'
        title: 买方采用具有多边性；无现金支付趋势强劲，但转化仍受现实约束
        blocks:
          - type: paragraph
            body: >-
              该 采用 path 是 multi-sided. 消费者 adopt MoMo 用于 habitual 支付 flows 和 然后 encounter 相邻 金融产品 在……内 该 同一 应用; 商户 和 小型
              业务es adopt it 作为 一个 受理 和 收款 通道; 金融-产品 合作伙伴 使用 该 installed 基础 作为 一个 更低-friction 分销 channel. 该 结构 重要 用于 估值
              因为 it 意味着 MoMo 是 competing 两者 用于 消费者钱包 share 和 用于 合作伙伴 budgets tied 到 分销, 投资判断, 和 商户 获客. 该 强est 当前 增长
              drivers 是 该 shift toward cash更少 支付 和 更宽 使用 的 线上 金融产品 在 越南, 但 该 main constraints 仍然 competition, compliance
              强度, 和 该 lack 的 公开 披露 一个融资轮 用户 activation 和 变现 质量. 在 practice, MoMo looks like 一个 大型 和 growing 市场
              participant 与 可信 cross-sell 选择权, 但 该 证据 基础 仍 fav或s 市场-边界 clarity over 精确 采用 转化 modeling.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM012
              - CM013
