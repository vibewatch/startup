      - number: '3.3'
        title: 护城河持久性、产品组合与锁定效应
        blocks:
          - type: paragraph
            body: >-
              MoMo's 防御性 comes 从 生态系统 density 而不是 transparent 公开 定价. 公司 和 第三方来源 consistently 描述 一个 钱包 该 有 扩展 进入 借贷, 保险,
              储蓄, 投资, 票务, 旅行, 和 商户工具, 这使得 increases switching costs 用于 heavy 用户. 但 该 同一 证据 也 argues 该 钱包 类别 是 分散的 和 结构性地
              低-利润率: 一个 sector analysis counts 约 40 活跃 e-钱包s 和 explicitly 称 补贴 仍然 一个 常见 留存 tool. 该 意味着 MoMo's moat 是
              durable 仅 if 其 更广泛 金融-服务 bundle keeps 用户 和 商户 参与 better 比 interoperable QR 通道 或 分销-领投 竞争对手 可以.
            claimRefs:
              - CP001
