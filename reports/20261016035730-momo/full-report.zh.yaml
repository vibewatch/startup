      - number: '1.3'
        title: 融资历史、当前规模信号与里程碑解读
        blocks:
          - type: paragraph
            body: >-
              保留来源中最清晰的资本节点，是 2021 年 12 月完成的 $200M E 轮融资；独立来源还称截至当时累计融资约 $434M。 2026 年的更新属于战略进程，而非已完成融资：多篇报道称 MoMo 聘请
              Jefferies 和 Morgan Stanley 探索引入新投资者等选项， 估值超过 $2B，同时强调谈判仍处早期阶段，交易并无保证。自 2024 年起盈利，是来源池中最新且最有力的经营里程碑；
              但规模披露并不整齐：不同来源分别给出超过 30M 用户、超过 32M 用户，以及 2025 年 40M 注册用户，未经管理层澄清注册用户 与活跃用户的区别，不应将其合并为一个“客户数”。FundedIQ 也只提供
              501-1000 人的员工区间，因此确切员工人数、债务或老股 交易结构，以及当前投资者的控制权条款，都仍是待尽调事项，而非已确认事实。
