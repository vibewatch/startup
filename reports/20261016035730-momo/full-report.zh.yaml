      - CV003
      - CV004
      - CV005
      - CV008
      - CV012
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 指示性估值 / 回报逻辑
      - 概率信号
      - 主要风险
    rows:
      - - 乐观
        - 盈利能力证明具备持续性，用户规模转化为更高毛利的金融服务收入，战略投资者为品类领导地位支付私募溢价。
        - 若尽调确认经济性显著强于公开可比公司所暗示的水平，则可以为高于 $2 billion 的干净私募轮估值辩护。
        - 需要已签署的融资条款，以及经审计的证据证明 2024 年盈利可重复。
        - 借贷 / 保险扩张存在执行风险；若流程拖延或结构变得激进，溢价可能消失。
      - - 基准
        - MoMo 的战略实力仍在，但投资者会锚定公开支付可比公司和不完整披露，而非只看稀缺性。
        - 按公开同业约 2.0x-2.9x 收入倍数、以报道的 ~$482 million 收入为基础，粗略区间约为 $1.0 billion-$1.4 billion。
        - 这一情景最符合当前公开记录，因为它使用了披露收入和上市同业倍数证据。
        - 公开来源中的报道收入未经审计，而超级应用业务组合与同业的可比性并不完美。
      - - 悲观
        - 尽调暴露出较弱的利润率质量或高估了可变现用户深度后，融资流程停滞，或只能通过复杂结构完成。
        - 如果市场倾向于更低的公开可比倍数，或对不透明条款打折，估值下调至基准情景区间以下就可能发生。
        - 这很可能伴随近期没有 IPO 路径、价格发现失败，或尽调缺口在流程后期仍未关闭。
        - 低价轮观感、清算优先权悬置以及更弱的退出选择权。
    notes: 仅为示意性情景框架；估值逻辑将一项公开报道的 2024 年收入数字与公开可比公司案例结合，不应视为有明确价格的目标。
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV014
      - CV015
