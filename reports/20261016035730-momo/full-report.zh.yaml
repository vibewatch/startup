  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 哪些信息会改变看法
    rows:
      - - 正方
        - Reuters 及多家转载媒体称，MoMo 在服务超过 3000 万名用户的同时自 2024 年起已实现盈利，这可以支撑一家规模化越南金融科技龙头的稀缺性溢价。
        - 经审计的分部经济性若显示利润并非一次性，而是由可持续的高毛利产品驱动，将强化这一论点。
      - - 正方
        - Reuters 引述的 Bain 市场预测指向一个规模庞大且仍在增长的越南数字支付市场，为 MoMo 在钱包支付之外深化变现留下空间。
        - 若有证据表明借贷、保险、储蓄和商户工具在没有监管或信贷失控的情况下实现规模化，将增强信心。
      - - 反方
        - 最新的公开价格信号只是一个可能无法完成的、探索性的 >$2 billion 投资者流程，因此没有当前定价轮次来验证表面估值。
        - 一轮已签署、一级市场条款清晰且结构有限的融资将大幅削弱这一疑虑。
      - - 反方
        - Multiples 显示，PicPay、Flywire 等上市支付同业的 LTM 收入倍数低于 MoMo 上一轮私募锚点，带来倍数压缩风险。
        - 更干净的收入质量证明、优于同业的利润率或更低的入场价格，都能缩小估值差距。
    notes: 论点按证据权重排列，并非穷尽；公开来源支持这一框架，但不足以形成完整的投资判断备忘录。
