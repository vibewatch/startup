  summary: >-
    MoMo 是越南领先的数字钱包和更广泛的金融超级应用，由 M_Service 运营，总部位于胡志明市。公司成立于 2007 年， 2010 年推出消费者钱包，随后从支付扩展到借贷、保险、储蓄、投资和商户工具。保留的 2026
