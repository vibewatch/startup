      - number: '2.2'
        title: 漏斗上游的规模测算口径可信，但落到 MoMo 的具体切口仍很薄弱
        blocks:
          - type: paragraph
            body: >-
              最干净的公开测算口径，是全国支付市场的大背景。Reuters 转引 Bain 的估算称，越南数字支付交易额从 2024 年的 USD 150B 增至 2025 年的 USD 178B，并在 2030 年达到
              USD 300–400B；这个口径能说明 MoMo 所进入的钱包相邻市场规模及增速，方向上很有用。 更难的是把这个自上而下的交易规模转成 MoMo 专属的 TAM、SAM 或 SOM。公开来源对 MoMo
              当前服务的是超过 30M 用户还是 40M 注册用户 存在分歧，也都没有拆出活跃用户、已变现商户、抽成费率，或从支付向高利润率金融产品延伸的附加率。因此，目前无法建立有说服力的 公开 SAM/SOM
              桥接；本报告保留宽口径市场视角，并明确将转化计算列为证据缺口，而不是臆造精确的自下而上市场规模。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
