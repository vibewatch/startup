  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现已从钱包交易量转向分发经济性
        blocks:
          - type: paragraph
            body: |-
              MoMo’s 公开 收入 模型 是 没有 longer just “钱包支付 在 规模.” 该 官方 和
              合作伙伴 rec或d 显示 一个 获许可的 支付 平台 与 一个 广泛 生态系统, 而 独立
              analysis 称 该 更高-价值 变现 层 现在 comes 从 distri但ing 金融
              产品 在……内 该 用户 基础 而不是 从 该 支付 通道 itself. Kurums 描述
              该 post-2021 模型 作为 fee generation 从 合作伙伴-银行 loans, buy-现在-pay-later, 保险,
              fund 产品, 和 储蓄-style offerings, 与 合作伙伴 holding 大多数 balance-sheet 风险.
              该 distinction 重要: 该 upside 是 更低 直接 资本 强度 比 一个 balance-sheet
              lender, 但 该 downside 是 heavier 依赖 在 合作伙伴 appetite, regulation, 和 抽成率
              sharing 该 公开来源 仍 做 不 quantify.
