  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              公开证据支持将 MoMo
              定义为面向越南消费者和商户的金融服务平台，而不是泛化的“金融科技应用”或没有差异化的超级应用。官方描述将边界落在获许可的移动支付、电子钱包转账、收付款服务，以及把金融服务带到银行渗透率长期偏低地区的支付平台上。近期独立报道又把边界扩展到
              MoMo 在应用内销售的高价值服务，包括借贷、保险、储蓄、投资和商户工具。因此，相关替代方案不只有竞争钱包，也包括现金、银行主导的支付流程，以及 MoMo 试图整合进单一应用的独立金融产品分销。本章将越南数字支付
              GMV 作为界定边界的视角，而不是 MoMo 收入的直接代理指标。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
