      - number: '8.2'
        title: 估值锚点与论点平衡
        blocks:
          - type: paragraph
            body: >-
              公开估值依据有三处：最近一笔有定价的融资、当前尚未定价的 2026 年投资者进程，以及可比上市公司的估值倍数。Multiples 将最近披露的 估值四舍五入至 $2B，并称 2021 年 12 月 E 轮对应约
              $2.27B 投后估值；FinTech Futures 则单独确认该笔由 Mizuho 领投的 $200M 融资。 Reuters 和多家转载媒体随后显示，2026 年的兴趣出现在 $2B
              以上，但并未描述已签署交易、融资规模或条款清单。因此，看多论点建立 在稀缺性、盈利能力和规模之上；看空论点则指向价格不透明、估值倍数压缩风险，以及当前股权表披露有限。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              相比单点目标，情景视角更稳妥，因为公开记录把一笔有明确日期的私募融资估值，与最新但不具约束力的融资消息混在了一起。Digital in Asia 报道 MoMo 2024 年收入约
              $482M，并实现首年盈利；Multiples 显示，PicPay 和 Flywire 的上市支付同业 LTM 收入倍数在 0.6x 至 2.9x 之间。这组数据指向一个明显低于 2021
              年私募融资锚点的公开可比公司估值区间；但如果管理层能证明盈利能力和变现质量可持续， 战略稀缺性与超级应用的广度仍可能支撑私募溢价。因此，基准情景是估值回归公开可比公司纪律；只有私募尽调证明经济性明显优于当前
              公开记录，才有上行空间。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
