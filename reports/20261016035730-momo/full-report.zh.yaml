  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              该 competitive 集合 是 更宽 比 "other 钱包s." 直接 钱包 同业 包括 ZaloPay 和 ViettelPay; 替代方案 通道 包括 银行-应用 转账 和 VietQR; 相邻
              competit或s 包括 借贷 和 金融-服务 apps; 和 older ride-hailing 或 commerce-linked 钱包s such 作为 Moca 仍然 相关 用于 specific
              结账 contexts. 公开 证据 仍 显示 MoMo 作为 该 规模 leader: 一个 独立 profile 称 it 有 12 活跃 competit或s, 而 一个不她 称 MoMo,
              ZaloPay, 和 VNPay together account 用于 约 三个 quarters 的 越南's 移动-支付 交易. 该 framing 重要 因为 MoMo competes 在 广度 的
              使用 cases 和 受理, 不 just 在 owning 一个 支付 flow.
            claimRefs:
