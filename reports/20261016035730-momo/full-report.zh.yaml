chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与经营范围
        blocks:
          - type: paragraph
            body: >-
              MoMo 的法律运营主体是 M_Service。公司称其成立于 2007 年，并获越南国家银行许可，提供电子钱包、资金转账和收付款服务。独立报道将消费者钱包的上线时间追溯至 2010
              年，起初覆盖移动充值和点对点转账，后来扩展为更广泛的金融服务体系。截至 2026 年，保留报道持续将 MoMo
              描述为越南金融“超级应用”，而非单一产品钱包；借贷、保险、储蓄、投资和商户工具都叠加在核心支付产品之上。官方资料和目录类报道对总部胡志明市的描述一致，但公开来源对产品广度的支持明显强于对当前精确经营指标的支持。
