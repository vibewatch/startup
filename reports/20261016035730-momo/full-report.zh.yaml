            title: 公开 用户-规模 披露 是 方向上 positive 但 不 internally 干净
            body: >-
              公开 报道 places MoMo 超过 30 百万 用户 和 possibly 在 40 百万 注册 用户, 尚未 该 活跃-到-注册 转化 和 该 已变现 coh或t 仍然 unverified, 这使得
              limits 估值 置信度 在 cross-sell 和 留存 assumptions.
            calloutType: risk
