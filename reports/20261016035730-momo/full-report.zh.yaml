        title: 展品
        blocks:
          - type: callout
            title: 大市场增长清晰，但 MoMo 的具体切入规模无法测算
            body: 保留来源支持越南无现金支付强劲增长的背景，但没有披露把这一背景转化为可发布的 MoMo 专属 SAM/SOM 所需的活跃用户、商户变现或产品附着数据。
            calloutType: insight
