chapter:
  number: 4
  title: Financials
  summary: Wispr discloses strong relative growth (150%+ QoQ for four consecutive quarters; 30x YoY per Menlo Ventures) and usage-scale traction (60B+ words dictated, 10,000+ enterprises) but no absolute revenue, ARR, gross margin, CAC, NRR, or burn/runway figure, leaving its $2B Series B valuation impossible to benchmark against a revenue multiple from public information alone; a Sydecar-administered SEC Form D confirms outside capital was pooled into Wispr via an SPV as early as March 2024.
sections:
- id: revenue-model-and-mix
  title: Revenue Model, Pricing, and Revenue Mix
  body: Wispr's primary and, as far as public sources reveal, only monetized revenue stream is recurring per-seat SaaS subscription revenue from its Flow dictation product, sold across a Free tier, a self-serve Pro tier (list price $12-15 per user per month), and a custom-priced Enterprise tier layering on SSO, SCIM, audit logs, and dedicated support. Wispr's newly launched Notetaker meeting-transcription product is bundled into the existing Free and Pro tiers at no additional charge as of the run date, meaning it currently functions as a retention and competitive-differentiation feature rather than an incremental revenue line — a strategic choice that trades near-term monetization for broader product stickiness against Otter.ai, Granola, and Fireflies. No source reviewed discloses Wispr's realized, post-discount average revenue per user, its revenue split between individual/Pro and Enterprise contracts, or any detail on revenue-recognition policy; every pricing figure available is list pricing pulled from the company's own documentation or third-party pricing-review blogs, not realized, blended, or audited revenue. Wispr's dedicated vertical messaging (Flow for Lawyers, HIPAA-ready and SOC 2-oriented compliance framing) suggests a deliberate strategy of weighting toward higher-value regulated-vertical Enterprise contracts alongside its broader self-serve individual base, though the actual revenue split between these two motions is not disclosed.
