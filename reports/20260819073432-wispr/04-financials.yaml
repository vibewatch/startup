- id: public-traction-and-financial-gaps
  title: Public Traction vs. Private-Metric Gaps
  body: 'Wispr''s clearest disclosed traction proxies are usage-scale metrics rather than financial ones: more than 60 billion cumulative words dictated on the Flow platform, use by more than 10,000 enterprises, and adoption inside most Fortune 500 companies as of the August 2026 Series B. On growth, the company and its lead investor Menlo Ventures disclosed only relative rates — revenue growing more than 150% for four consecutive quarters, and separately more than 30x year over year over roughly fourteen months — figures that are broadly consistent with each other given compounding, but that provide no absolute revenue anchor. The only absolute revenue figure located anywhere in this research is Getlatka''s stale, third-party estimate of approximately $10 million ARR as of October 2025; applying the company''s own claimed growth rate forward to August 2026 would imply revenue roughly an order of magnitude higher, but this is an extrapolation built on a low-confidence base and a company-claimed rate, not a verified figure, and should not be read as Wispr''s actual current ARR. This combination — real usage-scale traction, real but unanchored growth-rate claims, and a single stale third-party revenue estimate — is the core public-traction gap this chapter identifies: there is no way, using only public information, to compute a defensible current revenue multiple for Wispr''s $2 billion valuation.'
