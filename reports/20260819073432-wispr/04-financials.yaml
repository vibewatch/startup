- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'Wispr''s cash position immediately following its August 17, 2026 Series B is at least the $280 million in gross proceeds from that round, though no source discloses a net cash-on-hand figure after fees, prior burn, or existing cash balance are accounted for. No source reviewed discloses Wispr''s actual monthly burn rate or runway in months; 2026 benchmark research on Series-B-stage AI/SaaS startups generally suggests gross burn rates in the $200K-$600K per month range with typical post-raise runway of 12-15 months, but this is an industry proxy only, not a Wispr-specific figure, and should not be substituted for real diligence. No public reporting as of the run date identifies any hiring freeze or layoffs at Wispr; company messaging around the Series B emphasizes continued investment in Canto R&D, Notetaker and Interface Labs expansion, and further India/UK go-to-market scaling, consistent with an active-growth rather than a cost-cutting posture. A notable primary-source data point outside the widely reported priced rounds: a small special-purpose vehicle, ''Wispr I, a Series of Republic Deal Room Master Fund LLC,'' administered by Sydecar LLC, filed a Form D with the SEC on October 3, 2024 disclosing a fully sold $424,500 offering with a first-sale date of March 28, 2024 — public confirmation that outside capital was being pooled into Wispr''s cap table via a crowdfunding-style vehicle well before its widely reported Series A. No SEC filing was located under Wispr''s own corporate name, and no source discloses any debt facility, venture debt, or project-finance obligation; every dollar of disclosed capital to date is characterized as priced equity financing across the seed, Series A, Series A extension, and Series B rounds (the full round-by-round chronology is established in the Company Overview chapter and is referenced, not restated, here).'
