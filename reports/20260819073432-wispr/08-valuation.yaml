- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Key Assumptions
  - Valuation / Return Logic
  - Key Risks
  - Probability Signal
  rows:
  - - Bull
    - Canto/Notetaker mature into a durable platform; SOC 2 Type II restored promptly; no BIPA-style claim filed; ARR grows into the 25-30x late-stage AI multiple band on a materially larger disclosed base
    - Next round or exit prices at or above the $2B mark on a verified revenue multiple consistent with AI-application benchmarks
    - Execution risk across four simultaneous workstreams with an uncertain, possibly under-100-person team
    - Menlo Ventures (a repeat, informed investor) leading the Series B is a positive signal, though not conclusive
  - - Base
    - Continued strong relative growth but absolute revenue remains below what $2B would require at a typical 8-20x multiple; SOC 2 Type II eventually restored without further incident; no material regulatory event
    - Next round prices roughly flat to modestly up, reflecting continued execution but persistent disclosure-quality skepticism
    - Margin compression from AI-native inference costs; continued reliance on VC funding rather than self-sustaining cash flow
    - Broad market data on down-round frequency (~19-30% of 2026 rounds) suggests this outcome is at least as likely as the bull case
  - - Bear
    - A BIPA-style claim is filed against Wispr; SOC 2 Type II re-audit stalls further; disclosed revenue at next liquidity event falls well short of implied growth claims
    - Next financing is a down round, consistent with the ~19-30% of 2026 venture rounds reported as down rounds
    - Regulatory litigation costs; enterprise-contract losses in regulated verticals; investor confidence erosion
    - Cap-table composition (athlete/celebrity investors) is a weak negative signal for rigorous, revenue-verification-driven underwriting discipline
  notes: Probability signals are qualitative, evidence-based judgments, not a quantified probability distribution; no source reviewed provides a formal probability-weighted valuation model for Wispr specifically.
