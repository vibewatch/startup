- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / Valuation / Status
  - Relevance
  - Limitation
  rows:
  - - ElevenLabs (voice synthesis/TTS)
    - $330M ARR (end-2025); $11B valuation (Feb 2026 Series D)
    - ~33x ARR
    - Closest disclosed-revenue voice-AI comparable; establishes a real multiple anchor
    - Different core product (TTS/voice cloning vs. Wispr's dictation/transcription); not a direct product substitute
  - - Otter.ai (meeting transcription)
    - ~$100M estimated ARR (Mar 2025); ~$70-73M total disclosed funding
    - Implied historical valuation multiple lower than Wispr's current position (exact current 2026 valuation not disclosed)
    - Closest direct product comparable (meeting transcription, competes with Wispr Notetaker)
    - Current 2026 valuation not publicly disclosed; ARR figure is a third-party estimate, not company-confirmed
  - - Granola (bot-free meeting notetaker)
    - $1.5B valuation (Mar 2026 Series C, $125M raised); up from $250M prior round
    - Valuation roughly tripled over one funding cycle (magnitude, not multiple, comparable to Wispr's own re-rating)
    - Most architecturally similar direct comparable (bot-free capture, same product category as Wispr Notetaker)
    - No disclosed ARR figure for Granola, so no revenue multiple can be computed
  - - Deepgram (voice-AI infrastructure/API)
    - $1.3B valuation (Jan 2026 Series C, $130M raised)
    - No disclosed ARR; different business model (B2B infrastructure API vs. Wispr's B2C/B2B app)
    - Adjacent infrastructure comparable; illustrates capital flowing into voice-AI broadly
    - Not a direct product comparable; serves developers, not knowledge workers directly
  - - Fireflies.ai (meeting transcription/CRM)
    - '>$1B valuation (Jun 2025); no major raise since 2021'
    - Achieved comparable valuation magnitude to Wispr's own with far less disclosed capital ($1B+ valuation on limited disclosed funding)
    - Direct product comparable illustrating a capital-efficient path to a similar valuation magnitude
    - Valuation is dated (mid-2025) and not independently re-confirmed for 2026
  notes: Multiples are computed only where both a valuation and a revenue figure are disclosed (ElevenLabs); for all other comparables, at least one input is undisclosed, so only valuation magnitude (not a computed multiple) is comparable.
