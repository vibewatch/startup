- id: recommendation-and-final-diligence
  title: Recommendation, Risk Rating, and Final Diligence Asks
  body: 'Wispr shows no public evidence of exit readiness — no disclosed IPO timeline, no disclosed M&A discussions, and continued active primary fundraising as recently as August 2026 — confirming the company remains firmly in a growth-financing phase rather than approaching any liquidity event. Given the totality of evidence across this report, the appropriate overall recommendation is ''track / research-more'' rather than a definitive buy or avoid call: the qualitative thesis (voice as the next default interface, corroborated by a credible lead investor and genuine usage-scale traction) is well-evidenced, but the valuation''s supportability cannot currently be confirmed using public information, and material regulatory, compliance, and disclosure risks remain unresolved as of the run date. The appropriate confidence level for this recommendation is medium, not high, because the qualitative product-market-fit case is reasonably strong while the quantitative valuation-support evidence (absolute revenue, gross margin, NRR, cap-table terms) is almost entirely absent from public sources; correspondingly, the risk rating is medium-to-high given the combination of an unresolved SOC 2 Type II lapse, active industry-wide regulatory precedent risk, and concentrated two-founder key-person dependence, and the valuation stance is best characterized as ''stretched'' — supportable in principle by growth-rate claims and comparable-company context, but not confirmable as fairly priced without further disclosure. Six concrete final diligence asks would materially improve confidence in a definitive judgment: Wispr''s absolute revenue/ARR figure, its current SOC 2 Type II re-audit status, confirmation of any voice-biometric litigation exposure, its full cap table and preference stack, its gross margin/CAC/NRR/burn figures, and its customer-concentration profile — none of which is resolvable from the public sources reviewed in this report.'
