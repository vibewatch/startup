- id: exhibits
  title: Exhibits
  body: 'This chapter''s scenario ranges and revenue-multiple sensitivity analysis are illustrative constructions built from industry benchmark data and the comparable set established here, not disclosed company or investor targets, and should be revisited once any of the six final diligence asks are resolved. Market-sizing uncertainty carried over from the Market Analysis chapter (a roughly six-fold spread across publisher category-total estimates, $9B-$61B, for Wispr''s addressable market) compounds the valuation uncertainty identified in this chapter: even an optimistic revenue trajectory for Wispr depends on which market-boundary assumption ultimately proves most accurate. Readers should treat the recommendation, confidence, risk rating, and valuation stance in this chapter as conditional on the evidence available as of August 19, 2026, and should re-run this analysis once Wispr''s next financing event, an independent Canto benchmark, or its SOC 2 Type II re-audit outcome becomes public.'
