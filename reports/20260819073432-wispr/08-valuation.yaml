- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Absolute revenue/ARR
    - Current trailing-twelve-month revenue and ARR figure
    - Required to benchmark the $2B valuation against any disclosed comparable or industry multiple
    - Request directly from Wispr's finance team or the Series B data room
  - - SOC 2 Type II re-audit status
    - Confirmation of current (post-run-date) SOC 2 Type II re-issuance
    - Directly affects enterprise-trust thesis durability and regulated-vertical sales risk
    - Request current compliance-attestation documentation from Wispr's security team
  - - BIPA / voice-biometric litigation exposure
    - Confirmation of whether Wispr is a named party in any voice-biometric litigation
    - Directly affects legal-cost and regulatory-risk assumptions embedded in the valuation
    - Run a PACER/state-court docket search; request confirmation from company counsel
  - - Cap table, dilution, and preference stack
    - Full cap-table ownership percentages, liquidation preferences, and anti-dilution terms
    - Required to compute actual realizable returns for any investor class in downside or exit scenarios
    - Request the certificate of incorporation and Series B term sheet via the data room
  - - Gross margin, CAC, NRR, and burn/runway
    - Company-specific unit-economics and capital-adequacy figures
    - Required to validate whether Wispr meets the late-stage benchmarks that determine markdown risk at the next round
    - Request a full financial data package via the data room
  - - Customer concentration
    - Revenue share attributable to Wispr's largest named accounts (e.g., Clay)
    - High concentration would be a material, currently invisible valuation risk
    - Request top-10-account revenue concentration data from the company
  notes: Each row is a specific, actionable request that would materially improve confidence in a final valuation judgment; none of these six items is resolvable from the public sources reviewed in this report.
