- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - What Would Change the View
  rows:
  - - 'Bull thesis: Wispr becomes the default ''voice layer'' beneath productivity software, not just a dictation app (Menlo Ventures'' explicit framing)'
    - Confirmed traction for Notetaker and Canto beyond core Flow, and a durable technical moat validated by an independent benchmark
  - - 'Bull thesis: Strong disclosed relative growth (150%+ QoQ for 4 quarters; 30x YoY per Menlo) and broad usage-scale proxies (60B+ words, 10,000+ enterprises, 72% engagement)'
    - Disclosure of an absolute revenue/ARR figure consistent with these growth claims
  - - 'Anti-thesis: Core technical differentiation (Canto accuracy) is entirely company-claimed and unbenchmarked'
    - An independent, methodologically transparent benchmark validating or refuting Canto's claimed WER reduction
  - - 'Anti-thesis: SOC 2 Type II attestation invalidated March 2026, not yet restored, directly undercutting the enterprise-trust pillar of the bull case'
    - Re-issuance of a valid SOC 2 Type II attestation and completion of ISO 27001 certification
  - - 'Anti-thesis: Active industry-wide BIPA and EU AI Act regulatory precedent risk applies to any voice-data company'
    - Wispr avoiding becoming a named party in voice-biometric litigation, and a clear, disclosed EU AI Act compliance roadmap
  - - 'Anti-thesis: Complete financial-disclosure opacity — no absolute revenue, margin, NRR, burn, or cap-table data is public'
    - Direct company disclosure (via data room, next round, or M&A process) of these core financial metrics
  - - 'Anti-thesis: Open-source alternatives (FreeFlow, OpenWhispr) claim comparable latency at zero cost'
    - Evidence that Wispr's actual product quality and enterprise packaging meaningfully outperform these alternatives in a controlled comparison
  notes: Each row pairs a specific argument with a concrete, monitorable event that would shift the overall investment view; this table should be revisited whenever new evidence on any row emerges.
