  - type: private-evidence-only
    severity: blocking
    topic: no current (2026) retention, NRR, GRR, or churn figure
    missingEvidence: A current net/gross revenue retention or logo-churn figure; the only located retention data point (70% at 12 months) dates to around November-December 2025.
    whyItMatters: Retention is the core signal for durability of Wispr's customer base and cannot be assessed with a stale, pre-Series-B figure.
    diligencePath: Request current cohort retention curves from the company via the data room.
    relatedQuestionRefs:
    - QU010
  - type: private-evidence-only
    severity: material
    topic: no customer-concentration disclosure
    missingEvidence: Any figure on revenue concentration among Wispr's largest accounts.
    whyItMatters: High concentration in a small number of accounts (even reputationally strong ones like Clay) would be a material risk not visible from public marketing content alone.
