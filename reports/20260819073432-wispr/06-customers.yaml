- id: retention-satisfaction-and-complaints
  title: Retention, Satisfaction, and Documented Complaints
  body: 'The only retention figure located anywhere in this research is a 70% twelve-month retention rate reported by The AI Insider around November-December 2025 — a stale data point relative to the August 2026 run date, with no current net/gross revenue retention or churn figure disclosed post-Series-B. In its absence, Wispr''s own media kit offers an engagement proxy: the average user types roughly 72% of their characters through Flow after six months of use, a real stickiness signal but not a substitute for retention economics. Independent review evidence is genuinely mixed rather than uniformly positive: DroidCrunch''s two-week hands-on test rated Flow 4.2/5, and JustUseApp''s aggregation of 20 reviews shows a 4.8-out-of-5 average — yet JustUseApp''s own automated safety/legitimacy score for the app is a contradictory 0/100, illustrating how differently automated trust-scoring and direct user-review averages can characterize the same product. A recurring, specific complaint documented in independent reviews is transcript loss during long-form dictation in noisy environments or when using AirPods, described by one reviewer as working well ''in calm, quiet environments'' but breaking ''in most everyday settings''; separately, users who signed up via Apple ID report subscription-cancellation friction because the subscription does not appear in the standard Apple subscriptions list. Wispr does document a structured in-app support process (Report an Issue, Billing/Account Management escalation) for handling exactly these complaints, indicating the company has a disclosed workflow even though the complaints themselves persist in independent review content.'
