- id: expansion-and-concentration-risk
  title: Expansion Drivers and Concentration Risk
  body: Wispr's Notetaker launch targets the same broad professional user base as core Flow rather than a distinct new customer segment, suggesting it functions primarily as a retention/expansion play — bundled free into existing Free and Pro tiers — rather than a new-logo acquisition vehicle, though this is an inference rather than a company-disclosed strategic framing. The Clay case study illustrates a plausible land-and-expand pattern (individual GTM-team adoption expanding into CRM logging and internal documentation), but no source quantifies the actual seat-count growth within Clay or any other named account, and no source discloses Wispr's customer-concentration risk — the revenue share attributable to its largest accounts — leaving this a fully unquantified diligence gap. The most consistently cited procurement/channel friction points are Wispr's cloud-only architecture (driving privacy/compliance hesitation among enterprise buyers) and, more acutely, the company's own March-April 2026 SOC 2 Type II invalidation and re-audit episode, which is a concrete, disclosed blocker specifically for the regulated-vertical (legal, healthcare) buyers Wispr is actively courting through its vertical messaging. Wispr's 2025-2026 data-privacy incident — undisclosed screenshot/audio capture followed by banning the user who exposed it — is a documented instance of adverse customer-relations handling that plausibly damaged trust among exactly the bottom-up, word-of-mouth customer base the company depends on for organic growth, independent of any of the specific outcome metrics discussed elsewhere in this chapter.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU005
  figureRefs: []
- id: exhibits
  title: Exhibits
  body: 'This chapter preserves several diligence gaps rather than resolving them with unverified confidence: no independent source corroborates any of Wispr''s company-published named-customer outcome metrics; no current (2026) retention, NRR, GRR, or churn figure exists; no customer-concentration disclosure exists; and the direct G2 reviews page could not be retrieved during this research pass due to access blocking, leaving one standard B2B customer-proof data point unavailable. An independent growth-analysis newsletter''s reconstruction of Wispr''s founding story is worth noting here too: the company''s original neural-wristband product reportedly found no market (''nobody wanted it'') before the pivot to software that produced today''s customer traction — a reminder that the current customer-proof narrative follows an earlier, different product''s customer-validation failure. Readers should treat every specific outcome percentage in this chapter''s named-customer-proof table as company-published unless explicitly noted otherwise, and should independently re-verify Wispr''s current SOC 2 Type II status before assuming regulated-vertical procurement friction has been resolved.'
  claimRefs:
  - CU029
  - CU033
