  - type: missing-source
    severity: material
    topic: no independently corroborated named-customer outcome metrics
    missingEvidence: A second, independent source verifying any of Wispr's company-published named-customer outcome figures (Clay's 52%/20%/$3.08M; Greg Dickson's 60-min-to-5-min writing time).
    whyItMatters: Every specific, quantified customer outcome located in this research originates solely from Wispr's own case-study pages, which independent commentary explicitly frames as conversion-optimized marketing content.
    diligencePath: Contact Clay directly (or request an introduction via the company) to independently verify the published outcome metrics.
    relatedQuestionRefs:
