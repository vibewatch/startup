- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - Notetaker bundled free into existing tiers
    - Concentration in the existing individual/Pro customer base rather than genuinely new-logo acquisition
    - May inflate perceived product breadth without proportionally growing the customer count
    - Request new-logo vs. existing-customer usage split for Notetaker specifically
  - - Land-and-expand within named accounts (e.g., Clay expanding from demos to CRM logging)
    - Unquantified — no seat-count expansion data disclosed for any named account
    - Expansion motion is plausible but unverified at the account level
    - Request Clay's (or another named account's) seat-count growth over time
  - - Bottom-up, employee-led adoption inside Fortune 500 companies
    - High dependence on continued individual advocacy/virality rather than direct enterprise sales
    - A slowdown in organic/viral adoption could disproportionately affect growth given this go-to-market reliance
    - Request the split between self-serve and directly-sold Enterprise revenue
  - - International expansion (India, UK; 162 countries)
    - Geographic revenue concentration unknown — no per-country revenue breakdown disclosed
    - Cannot assess whether growth is broad-based or concentrated in North America despite geographic user breadth
    - Request revenue-by-region breakdown
  - - Compliance-driven vertical expansion (legal, healthcare via HIPAA-ready messaging)
    - March 2026 SOC 2 Type II invalidation is a direct procurement blocker for exactly these regulated verticals
    - Enterprise contract renewals/expansions in regulated verticals may stall pending re-audit completion
    - Confirm current SOC 2 Type II status before any regulated-vertical expansion assumption
  - - Celebrity/high-profile user endorsements (Reid Hoffman, athletes)
    - Marketing-value concentration in a small number of high-profile names rather than a broad base of typical named accounts
    - Risks overstating typical customer experience relative to celebrity-adjacent best cases
    - Request a broader, randomly sampled set of named customer references beyond the persona case studies
  notes: Impact assessments are the researchers' qualitative judgment; no source reviewed provides a probability-weighted or dollar-quantified risk estimate for any row.
