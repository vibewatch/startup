- id: adoption-trajectory-and-scale
  title: Adoption Trajectory and Scale
  body: 'The most precise enterprise-adoption data point located in this research — 270 named Fortune 500 companies, roughly 125 new enterprise customers added per week, and 40% month-over-month growth in users and ARR — dates to around November 2025-January 2026, per The AI Insider and VKTR''s independent reporting on that period. By the August 2026 Series B, Wispr''s own disclosed language shifted to a broader, unquantified ''most Fortune 500 companies'' claim, with no updated named-company count or weekly-addition rate disclosed alongside the round, and total business/enterprise counts cited across Series B press coverage conflict materially: Yahoo Finance/AFP cites more than 10,000 enterprises, AI Weekly cites 100,000 businesses, and other 2026 press cites 125,000-plus businesses. Wispr Flow supports over 100 languages and operates in 162 countries as of the Series B, and the company has actively expanded go-to-market operations into India and the United Kingdom over the roughly ten months since its Series A extension — but no source discloses an updated 2026 absolute active-user count, leaving current total scale a matter of relative growth-rate claims rather than a verifiable number.'
