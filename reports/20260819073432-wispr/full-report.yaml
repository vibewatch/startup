            body: >-
              Wispr's primary and, as far as public sources reveal, only monetized revenue stream is recurring per-seat
              SaaS subscription revenue from its Flow dictation product, sold across a Free tier, a self-serve Pro tier
              (list price $12-15 per user per month), and a custom-priced Enterprise tier layering on SSO, SCIM, audit
              logs, and dedicated support. Wispr's newly launched Notetaker meeting-transcription product is bundled
              into the existing Free and Pro tiers at no additional charge as of the run date, meaning it currently
              functions as a retention and competitive-differentiation feature rather than an incremental revenue line —
              a strategic choice that trades near-term monetization for broader product stickiness against Otter.ai,
              Granola, and Fireflies. No source reviewed discloses Wispr's realized, post-discount average revenue per
              user, its revenue split between individual/Pro and Enterprise contracts, or any detail on
              revenue-recognition policy; every pricing figure available is list pricing pulled from the company's own
              documentation or third-party pricing-review blogs, not realized, blended, or audited revenue. Wispr's
              dedicated vertical messaging (Flow for Lawyers, HIPAA-ready and SOC 2-oriented compliance framing)
              suggests a deliberate strategy of weighting toward higher-value regulated-vertical Enterprise contracts
              alongside its broader self-serve individual base, though the actual revenue split between these two
