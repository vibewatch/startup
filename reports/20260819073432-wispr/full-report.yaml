      - number: '1.3'
        title: Funding History, Valuation, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Wispr's disclosed financing history runs from roughly $14.6 million in seed/accelerator capital
              (2022-2024), through a ~$30 million Series A in June 2025, a $25 million Series A extension in November
              2025 led by Notable Capital (with Steven Bartlett's Flight Fund participating) at a roughly $700 million
              post-money valuation, to the headline $280 million Series B closed August 17, 2026, led by Menlo Ventures
              at a $2 billion valuation. TechCrunch and Yahoo Finance/AFP both report cumulative funding of $361 million
              after the Series B, but third-party trackers disagree: Getlatka's tracker separately records a $260
              million Series B and $315 million cumulative total, and QuantLogix records a $53.17 million Series A and
              $79.44 million total as of mid-2025 versus the $81 million figure reported by The AI Insider for the same
              period. These gaps likely reflect timing and classification differences across independent aggregators
              rather than a single authoritative error, but they have not been reconciled against a primary filing. New
              Series B investors include Acrew Capital, Forerunner Ventures, Goodwater Capital, Peak XV Partners,
              Together Fund, PLUS Capital, and Activate; existing investors Menlo Ventures, NEA, Neo Ventures, 8VC,
              Notable Capital, and MVP Ventures returned. Menlo Ventures partners Matt Kraning and Venky Ganesan led the
              round, framing it around a thesis that the text box, not just the keyboard, is the next interface to
              disappear. Peak XV Partners and Activate were both reported in earlier 2026 coverage as being in talks to
              invest roughly $15 million and $3-5 million respectively; both are confirmed participants in the closed
              round, which is a useful verification of pre-close reporting accuracy. A roster of professional athletes —
              including Joe Burrow, Shaun White, Klay Thompson, Paul George, and Domantas Sabonis — also hold stakes in
              the company, most likely marketing-value positions rather than governance-relevant stakes.
