      - number: '8.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              This chapter's scenario ranges and revenue-multiple sensitivity analysis are illustrative constructions
              built from industry benchmark data and the comparable set established here, not disclosed company or
              investor targets, and should be revisited once any of the six final diligence asks are resolved.
              Market-sizing uncertainty carried over from the Market Analysis chapter (a roughly six-fold spread across
              publisher category-total estimates, $9B-$61B, for Wispr's addressable market) compounds the valuation
              uncertainty identified in this chapter: even an optimistic revenue trajectory for Wispr depends on which
              market-boundary assumption ultimately proves most accurate. Readers should treat the recommendation,
              confidence, risk rating, and valuation stance in this chapter as conditional on the evidence available as
              of August 19, 2026, and should re-run this analysis once Wispr's next financing event, an independent
              Canto benchmark, or its SOC 2 Type II re-audit outcome becomes public.
            claimRefs:
              - CV039
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Overall call: track / research-more, not buy or avoid'
            body: >-
              The qualitative thesis (voice as the next interface) is well-evidenced and credibly backed by Menlo
              Ventures, but the $2B valuation cannot be confirmed as supported using public information alone; revisit
              once absolute revenue, SOC 2 Type II status, and litigation exposure are resolved.
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV040
          - type: callout
            title: Valuation stance is 'stretched,' not clearly attractive or expensive
            body: >-
              Growth-rate claims and comparable-company context (ElevenLabs ~33x ARR, Granola's re-rating trajectory)
              support a premium multiple in principle, but the complete absence of disclosed absolute revenue makes the
              $2B mark unverifiable as fairly priced.
            calloutType: risk
            claimRefs:
              - CV032
              - CV002
          - type: callout
            title: Risk rating is medium-to-high given compounding unresolved issues
            body: >-
              An unrestored SOC 2 Type II lapse, active industry-wide BIPA/EU AI Act regulatory precedent risk, and
              concentrated two-founder key-person dependence combine to elevate risk above what the strong growth-rate
              narrative alone would suggest.
            calloutType: risk
            claimRefs:
              - CV033
              - CV019
          - type: callout
            title: Comparable-set approach inherits private-market pricing uncertainty
            body: >-
              No publicly traded, pure-play voice-AI dictation company exists; every comparable identified (ElevenLabs,
              Otter, Granola, Deepgram, Fireflies) is itself privately valued via VC rounds, so cross-referencing
              against them does not fully resolve the valuation-support question for Wispr.
            calloutType: assumption
            claimRefs:
              - CV015
              - CV009
