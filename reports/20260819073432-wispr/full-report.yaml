  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Confirmed BIPA-style claim naming Wispr
        - Any filed complaint naming Wispr directly
        - Directly undermines the regulatory-safety assumption embedded in the current valuation
        - Reassess risk rating upward and pause any new capital commitment pending resolution
      - - Continued SOC 2 Type II delay
        - No re-issuance within 12 months of the March 2026 invalidation
        - Undermines the enterprise-trust pillar of the bull thesis
        - Downgrade valuation stance from 'stretched' toward 'expensive'
      - - Disclosed revenue inconsistent with growth claims
        - >-
          A future disclosed absolute revenue figure implying materially less than 150%+ compounded quarterly growth
          from the stale $10M base
        - Directly invalidates the growth-quality assumption underlying the bull and base cases
        - Reassess valuation stance and recommendation; likely downgrade toward 'avoid'
      - - Co-founder departure
        - Either Tanay Kothari (CEO) or Sahaj Garg (CTO) departs
        - Removes the key-person foundation of the entire technical and strategic thesis
        - Treat as a thesis-break event; pause new capital commitment pending leadership-transition clarity
      - - Down round or capital-adequacy stress signal
        - A subsequent round at a flat/down valuation, or public reports of layoffs/hiring freeze
        - Signals the market itself is repricing the $2B mark downward
        - Reassess valuation stance immediately toward 'expensive'; revisit recommendation
      - - Independent benchmark showing competitive parity from open-source alternatives
        - >-
          A credible, methodologically transparent benchmark showing FreeFlow/OpenWhispr matching Wispr Flow/Canto on
          core accuracy/latency metrics
        - Weakens the technical-moat component of the bull thesis
        - Reassess moat-durability risk upward; discount the technical-differentiation portion of the valuation case
    notes: >-
      None of these triggers has been observed as of August 19, 2026 based on evidence reviewed in this report; this
      table is a forward-looking monitoring framework, not a record of events that have occurred.
