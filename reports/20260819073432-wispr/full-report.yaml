      - number: '8.3'
        title: Bull / Base / Bear Scenarios and Valuation Support
        blocks:
          - type: paragraph
            body: >-
              If Wispr's actual current ARR were, illustratively, in the $50-150 million range — consistent with
              compounding its own claimed 150%+ quarterly growth from the stale ~$10 million October 2025 base — the
              implied revenue multiple on the $2 billion valuation would fall in the roughly 13x-40x range, squarely
              within (or modestly above) the 8-20x AI-application-company benchmark band that 2026 industry research
              cites for late-stage AI deals; this is an illustrative extrapolation, however, not a disclosed figure, and
              should not be mistaken for verified underwriting support. In the bull case, Canto and Notetaker mature
              into a durable platform, SOC 2 Type II is promptly restored, no BIPA-style claim is filed against Wispr,
              and the company grows into its $2B mark (or beyond, toward a Granola-style re-rating) at a subsequent
              round priced on verified revenue consistent with late-stage AI benchmarks. In the base case, growth
              continues but absolute revenue remains below what $2B would require at typical multiples, compliance
              issues are eventually resolved without further incident, and the next round prices roughly flat to
              modestly up. In the bear case — a scenario 2026 market data suggests is not a tail risk but plausible,
              given that roughly 19-30% of all 2026 venture rounds are reported as down rounds — a BIPA-style claim is
              filed, SOC 2 Type II re-audit stalls further, disclosed revenue falls short of implied growth claims, and
              Wispr's next financing prices below the current $2B mark. A probability-relevant signal favoring the
              bull/base cases is that Menlo Ventures, a repeat and already-informed investor, led the Series B,
              suggesting its own private diligence may have resolved some of the financial-disclosure gaps this chapter
              cannot close from public information alone; a signal favoring the bear case is Wispr's notably
              non-institutional cap-table composition (professional athletes and cultural figures), which is not
              typically associated with the rigorous, revenue-verification-driven underwriting discipline of a pure
              institutional round.
            claimRefs:
              - CV002
              - CV003
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
