  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The most active regulatory/legal risk cluster facing any voice-data-processing company in 2026 is
              Illinois' Biometric Information Privacy Act (BIPA): nine class-action lawsuits were filed in Chicago
              federal court in May 2026 against Google, Amazon, Apple, Microsoft, and others alleging unauthorized use
              of voice recordings to train AI models, and Walmart was separately sued in July 2026 over an AI phone
              system's voiceprint collection — establishing that BIPA litigation risk extends well beyond AI-training
              use cases into ordinary commercial voice-processing deployments of the kind Wispr operates. No source
              reviewed identifies Wispr specifically as a named defendant in any BIPA or equivalent litigation as of the
              run date, so this remains an industry-precedent exposure rather than a confirmed, filed claim against the
              company; a 2024 BIPA amendment narrowing per-scan repetitive-violation damages somewhat reduces (but does
              not eliminate) the tail-risk exposure. At the federal level, the FTC's Operation AI Comply enforcement
              campaign has produced an $18 million settlement against Air AI in March 2026 using existing Section 5
              unfair/deceptive-practices authority, though — in a genuine discrepancy across secondary sources — one
              legal-analysis source states the FTC had not released a formal AI-specific policy statement as of early
              April 2026 despite a December 2025 Executive Order directing it to, while other 2026 commentary describes
              a policy statement as already issued. In the EU, voice biometric systems are classified as high-risk under
              the AI Act's Annex III, but a July 2026 Digital Omnibus on AI postponed comprehensive high-risk compliance
              obligations to December 2, 2027, giving Wispr additional runway to prepare EU compliance infrastructure
              before facing potential fines of up to €35 million or 7% of global turnover. Separately, Wispr's own
              'Flow' product name overlaps with a Google AI product Autodesk sued Google over in 2026 for trademark
              infringement — a live precedent for branding-collision litigation risk in AI software that this diligence
              exercise flags for Wispr's own trademark position, which no source confirms as registered or challenged.
            claimRefs:
