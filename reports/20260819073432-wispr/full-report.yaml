            title: ASR accuracy improvement is a genuine growth driver, not just a feature
            body: >-
              Wispr's Canto model, cutting noisy-environment word-error rates from over 30% to 5-10%, aligns directly
              with the accuracy-driven adoption pattern that market research identifies as central to enterprise
              willingness-to-pay for dictation software.
            calloutType: strength
