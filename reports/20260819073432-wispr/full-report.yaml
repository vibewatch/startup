            body: >-
              Wispr's headline technical differentiation claim is Canto, its proprietary speech model previewed
              alongside the Series B, said to reduce word-error rates in noisy real-world conditions from over 30% to
              between 5% and 10%, translating (per company estimate) into 30-35% fewer dictations requiring manual
              editing in everyday use — figures that, along with a MacLife testimonial citing '100% accuracy' reproduced
              on Wispr's own API documentation page, trace entirely back to company disclosure or a company-selected
              quote rather than any independently reproducible benchmark located during this research. Genuine
              developer-community engagement with Wispr Flow as a reference product is nonetheless real: two independent
              open-source projects, 'FreeFlow' and 'OpenWhispr,' were built explicitly as Wispr Flow alternatives and
              shown on Hacker News, with FreeFlow's creator claiming two-thirds of dictations complete in under 0.6
              seconds using a comparable persistent-WebSocket architecture — a competing latency claim worth tracking
              against Wispr's own 700ms target, even though it is not a direct head-to-head benchmark. By contrast, a
