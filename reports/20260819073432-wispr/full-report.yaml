  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct, Incumbent, Adjacent, and Substitute'
        blocks:
          - type: paragraph
            body: >-
              Wispr competes across five distinct competitor classes rather than a single homogenous market. Direct
              peers in core dictation include the emerging cluster of lower-priced prosumer apps — Superwhisper, Willow,
              Monologue, and Aqua Voice — explicitly named by TechCrunch as a source of increased competitive pressure
              in its coverage of Wispr's own Series B. In meeting transcription, Wispr's new Notetaker product (launched
              August 5, 2026) enters a sub-market already occupied by Otter.ai (estimated ~$100M ARR, ~35% transcription
              market share per WorldMetrics), Granola ($1.5B valuation after a March 2026 Series C), and Fireflies.ai
              (>$1B valuation, capital-efficient), making Wispr a later entrant here despite its overall scale
              advantage. Incumbent Big Tech platforms — Apple, Google, and Microsoft — offer free, OS-bundled dictation
              that Wispr's own lead investor Menlo Ventures explicitly names (alongside Anthropic and OpenAI) as the
              eventual competitive ceiling for its broader 'voice layer' ambition. Adjacent infrastructure vendors such
              as Deepgram ($1.3B valuation, January 2026 Series C) sell comparable underlying speech-recognition
              capability as a developer-facing API rather than a consumer app, representing a different buyer
              relationship than Wispr's direct-to-professional model but a real commoditization risk to any single
              vendor's proprietary ASR claims. Finally, internal build on open-source OpenAI Whisper remains a credible
              substitute path for technically sophisticated enterprise buyers who prefer not to pay a recurring per-seat
              SaaS fee, and free OS-native dictation remains the ever-present status-quo alternative for casual users.
