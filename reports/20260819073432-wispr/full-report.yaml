      - number: '2.2'
        title: 'Market Sizing: Multiple Conflicting Lenses'
        blocks:
          - type: paragraph
            body: >-
              No single authoritative TAM figure exists for Wispr's addressable market. Publicly available analyst
              estimates for plausibly relevant categories span roughly $9 billion to more than $60 billion depending
              entirely on where the boundary is drawn: Grand View Research's broader 'voice and speech recognition'
              category ($23.7B in 2024 to $53.7B by 2030, 14.6% CAGR) and AssemblyAI's overlapping category ($18.4B in
              2025 to $61.7B by 2031, 22.4% CAGR) sit well above The Business Research Company's narrower 'Cloud
              Dictation Solution' sub-segment ($9.7B in 2025 to $20.8B by 2030, 16.4% CAGR), which in turn conflicts
              with The Insight Partners' estimate for an ostensibly identical sub-segment ($8.42B in 2025 to $23.47B by
              2034, 12.06% CAGR). Market.us's narrower 'voice AI agents' figure ($2.4B in 2024 to $47.5B by 2034, 34.8%
              CAGR) illustrates that even the fastest-growing published CAGR corresponds to one of the smallest
              published bases, underscoring how much boundary definition — not just growth optimism — drives the wide
              range of headline numbers. Because no source reviewed attributes a specific market share to Wispr within
              any of these boundaries, this chapter preserves an illustrative TAM/SAM/SOM worked example (roughly $150B
              illustrative TAM, $30B illustrative SAM, $600M illustrative SOM for a leading vendor at a 2% SAM capture
              rate) rather than presenting it as a Wispr-specific disclosed estimate — it is a methodology illustration,
              not a company forecast. Diligence should treat every dollar figure in this section as a category total
              from a named third-party publisher, not as evidence of Wispr's own revenue opportunity.
