  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Wispr Flow lets a user press a keyboard shortcut, speak naturally — including
              filler words, self-corrections, and mid-sentence changes — and have polished, formatted text appear
              wherever their cursor is positioned, in effectively any desktop or mobile application, replacing manual
              typing for messages, documents, code, and email. As of the August 2026 Series B, Wispr's product line
              spans three distinct modules at very different maturity stages: Flow itself (the mature, multi-year core
              dictation product across Mac, Windows, iOS, and Android), Notetaker (a bot-free meeting-transcription
              product launched August 5, 2026, bundled into existing tiers at no extra charge), and Canto (Wispr's first
              proprietary speech-recognition model, previewed alongside the Series B as the underlying ASR engine for
              both other products). A fourth, pre-product research effort — Wispr Interface Labs, led by newly hired
              Ariya Rastrow (formerly of Amazon Alexa's founding team) — sits furthest from market, exploring new
              human-computer-interaction paradigms with no disclosed public roadmap or shipping timeline. Wispr also
              extends its software product into hardware via a partnership with Oasis Devices, whose Oasis 1 titanium
              ring lets users dictate via a close-range whisper microphone without speaking audibly, though Wispr does
              not manufacture this hardware itself.
