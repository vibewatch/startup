      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Wispr Flow follows a classic bottom-up SaaS adoption path: an individual professional self-serves on the
              Free tier or a 14-day Pro trial, and only once usage and headcount cross a visibility threshold inside an
              organization does IT/security leadership become the formal budget owner and negotiate an Enterprise
              contract with SSO, SCIM, and admin controls. Market research consistently identifies healthcare (clinical
              documentation), legal (briefs, depositions, case notes), and finance as the enterprise verticals with the
              clearest, most compliance-driven documentation burden, and Wispr's own dedicated 'Flow for Lawyers'
              product page — emphasizing HIPAA-ready and SOC 2 Type II-oriented messaging — confirms a deliberate
              vertical go-to-market motion rather than a purely horizontal one. In regulated verticals specifically, the
              actual budget owner and adoption trigger is typically IT/security/compliance leadership rather than the
              end-user professional, because executing a Business Associate Agreement or Data Processing Agreement and
              enabling audit logging require centralized procurement authority that individual professionals do not
              hold. The most consistently cited adoption trigger across both market research and Wispr's own marketing
              is measurable time-savings ROI — Wispr claims roughly a 4x/220wpm typing-speed multiplier for Flow,
              directly aligned with the productivity-ROI adoption trigger that procurement research identifies as the
              dominant conversion driver for AI dictation tools generally.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM030
