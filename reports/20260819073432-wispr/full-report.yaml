      - number: '1.4'
        title: Cover Metrics, Scale, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Wispr reports revenue growth exceeding 150% for four consecutive quarters heading into the Series B, and
              Menlo Ventures' own investment memo separately describes revenue growing more than 30x year over year over
              roughly fourteen months — figures that are broadly consistent with each other given compounding. The
              absolute revenue base behind those growth rates is not disclosed; the only public estimate is a stale ~$10
              million ARR figure as of October 2025 from Getlatka, so current 2026 revenue in dollar terms is an open
              question. Customer-scale claims are similarly inconsistent across sources: Yahoo Finance/AFP cites more
              than 10,000 enterprises, AI Weekly's coverage of the same announcement cites 100,000 businesses, and other
              2026 press cites 125,000-plus businesses; a January-2026 report separately specified adoption inside 270
              named Fortune 500 companies. Employee headcount estimates range from roughly 50 to 125 across third-party
              data providers, with no official company disclosure to resolve the range. On the adverse side, Wispr
              experienced a significant privacy incident in which early versions of Flow captured periodic screenshots
              of the user's screen alongside audio and transmitted both to cloud infrastructure without clear
              disclosure; when a user surfaced this behavior, the company's first response was to ban that user's
              account, a decision CTO Sahaj Garg later publicly apologized for. The company subsequently made
              AI-training use of voice data opt-in by default and introduced a zero-retention Privacy Mode. Separately,
              Wispr's SOC 2 Type II compliance attestation was proactively invalidated in March 2026 over
              auditor-integrity concerns, and the company obtained a new SOC 2 Type I attestation from A-LIGN in April
              2026 while Type II and ISO 27001 re-audits remain pending. Both episodes are material for enterprise
              buyers in regulated verticals such as legal and healthcare, where Wispr is actively selling.
