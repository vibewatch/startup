  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Wispr's core, directly addressable market is enterprise and consumer voice-to-text dictation software —
              the segment its Flow product sells into today — nested inside a much broader 'voice AI' category that also
              includes contact-center conversational agents, voice synthesis/cloning, and consumer smart-speaker
              hardware. The clearest status-quo substitutes are free or OS-bundled dictation features (Apple
              Dictation/Apple Intelligence, Google Voice Typing with Gemini, Microsoft Voice Access/Copilot Voice) and
              open-source models such as OpenAI Whisper, all of which cap how much an individual user is willing to pay
              for a standalone app like Wispr Flow. A second, faster-moving competitive layer has emerged directly
              inside the paid dictation segment: lower-priced prosumer apps including Willow, Monologue, Aqua, and
              Superwhisper, explicitly called out in TechCrunch's coverage of Wispr's own Series B as a source of margin
              and share pressure. Wispr's lead Series B investor, Menlo Ventures, explicitly frames the company's
              ambition as extending beyond this narrow dictation wedge toward becoming the default 'voice layer' beneath
              all productivity software — a market that already includes Apple, Google, Microsoft, Anthropic, and OpenAI
              as incumbents with native voice capabilities. Emerging hardware adjacencies, such as Wispr's partnership
              with wearable-ring maker Oasis Devices, sit at the edge of this boundary: they extend Flow's reach into a
              new input modality without themselves being a market Wispr directly monetizes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM026
