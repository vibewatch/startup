      - number: '3.3'
        title: Switching Costs, Multi-Homing, and Distribution/Supply Access
        blocks:
          - type: paragraph
            body: >-
              Switching costs for an individual professional are low across nearly every competitor reviewed: Wispr,
              Otter, Superwhisper, and Willow all offer no-commitment free tiers or short trials, enabling genuine
              multi-homing where a user might trial several dictation tools in parallel before settling on one for daily
              use. Switching costs rise materially once an organization reaches the enterprise tier and configures SSO,
              admin controls, and compliance workflows around a specific vendor — at that point, incumbents with mature
              enterprise tooling (Wispr, Otter) hold a structural lock-in advantage over newer prosumer entrants like
              Superwhisper or Aqua Voice that lack comparable enterprise packaging. On distribution and supply access,
              Wispr's partnership with hardware maker Oasis Devices (a smart ring enabling whisper-level private
              dictation) is a differentiated channel move that none of the direct dictation-app competitors reviewed
              have matched with an equivalent disclosed hardware partnership, though no source discloses whether this
              arrangement is exclusive.
