        title: Cost Structure, Gross Margin, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Wispr discloses no gross margin, COGS breakdown, CAC, payback period, net revenue retention, or
              customer-concentration figure — every unit-economics field in this chapter's dedicated table is null and
              backed only by industry-benchmark proxies rather than a company-specific disclosure. 2026 benchmark
              research indicates AI-native SaaS products realistically operate at 40-60% gross margin once inference and
              cloud-compute costs are honestly included, materially below the 75-85% margin norm for classic,
              non-inference-heavy SaaS, with inference alone typically consuming roughly 23% of revenue; because Flow's
              core function (continuous real-time ASR plus LLM-driven text cleanup) is inference-intensive, Wispr's true
              gross margin most plausibly sits in this AI-native band rather than the classic-SaaS band, though this is
              an inference rather than a disclosed figure. The same benchmark research argues that classic SaaS
              CAC-payback targets built on ~80% gross-margin assumptions are roughly a third too generous for AI-native
              products, implying that any CAC/LTV framework applied to Wispr should use AI-adjusted benchmarks rather
              than legacy SaaS heuristics — though absent Wispr's own CAC or payback data, this remains a directional
              caution rather than a specific number. The best available public stickiness proxy, in the total absence of
              disclosed NRR or churn, is Wispr's own claim that the average user types roughly 72% of their characters
              through Flow after six months of use across nearly 70 apps — a real engagement signal, but not a
              substitute for retention economics. Wispr's own March-April 2026 SOC 2 Type II invalidation and re-audit
              episode also represents a real, if unquantified, compliance-remediation cost precisely as the company
