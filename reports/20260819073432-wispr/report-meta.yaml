  topStrengths:
  - 'Founder-market fit: both co-founders bring directly relevant Stanford AI/ML and hardware backgrounds, and the company re-rated from ~$700M to $2B in nine months on reported 150%+ quarterly revenue growth.'
  - 'Genuine usage-scale traction: 60B+ words dictated, adoption inside most Fortune 500 companies, and a company-claimed 72% share-of-characters engagement metric after six months of use.'
  - Credible, repeat lead investor (Menlo Ventures) articulating a clear, ambitious thesis that voice is the next default computing interface beyond dictation.
  - Active, disclosed product expansion (Notetaker, Canto, Interface Labs) diversifying beyond a single-purpose dictation tool.
  - Comparable voice-AI financings (ElevenLabs at ~33x ARR, Granola's re-rating to $1.5B) provide supportive, if imperfect, valuation context.
  topRisks:
  - No absolute revenue, ARR, gross margin, CAC, or NRR figure is publicly disclosed, so the $2B valuation cannot be benchmarked against a verified revenue multiple.
  - SOC 2 Type II attestation was invalidated in March 2026 and has not been fully restored, directly undercutting enterprise-trust messaging to regulated-vertical buyers.
  - Active industry-wide BIPA voice-biometric litigation (Big Tech, Walmart) and EU AI Act high-risk obligations represent structural regulatory tail risk for any voice-data company.
  - Key-person risk is concentrated in two founders with no disclosed succession plan, compounded by conflicting third-party headcount estimates (50-125 employees).
  - Wispr's own Canto/latency differentiation claims are entirely company-claimed, with no independent benchmark located, while open-source alternatives (FreeFlow, OpenWhispr) already claim comparable latency.
  unresolvedGaps:
  - Current absolute revenue/ARR and gross margin figures
  - Current SOC 2 Type II re-audit completion status
  - Confirmation of whether Wispr is a named party in any voice-biometric litigation
  - Full cap table, liquidation preference terms, and dilution from the Series B
  - Independent benchmark of Canto's claimed word-error-rate reduction
  - Customer-concentration data (revenue share from largest named accounts)
