companyProfile:
  summary: Wispr is a private, venture-backed AI software company headquartered in San Francisco, founded in 2021 by Stanford-trained engineers Tanay Kothari and Sahaj Garg, who initially pursued a neural-interface hardware concept before pivoting to the Wispr Flow voice-dictation software product around 2024. Flow converts spoken speech into polished, formatted text across Mac, Windows, iOS, and Android, and the company closed a $280 million Series B on August 17, 2026 at a $2 billion valuation led by Menlo Ventures, alongside the launch of its proprietary Canto speech model and a bot-free meeting-transcription product, Notetaker. Public evidence is strongest on usage-scale traction (60B+ words dictated, adoption inside most Fortune 500 companies) and growth-rate claims (150%+ quarterly revenue growth), and weakest on absolute financial disclosure, independent technical benchmarking, and current enterprise-compliance status following a March 2026 SOC 2 Type II lapse.
