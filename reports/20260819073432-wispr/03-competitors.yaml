- id: exhibits
  title: Exhibits
  body: 'This chapter preserves several diligence gaps rather than resolving them with unverified confidence: no independent benchmark of Wispr Flow against its direct competitors was located during this research pass; Wispr''s Canto accuracy claim has not been independently replicated; and a forward-looking scan of likely new entrants beyond the competitors identified here has not been completed, which matters given how quickly this landscape has moved — Granola alone went from a $250 million to a $1.5 billion valuation within roughly a year. Readers should treat every feature-matrix cell marked ''Unknown / not disclosed'' as an absence of evidence found during this research pass, not as a confirmed negative, and should re-verify Wispr''s SOC 2 Type II re-issuance status before treating the current moat-durability assessment as final.'
