- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Canto proprietary ASR model reduces noisy-environment WER from 30%+ to 5-10%
    - Commoditization — open-source Whisper and API vendors (Deepgram, AssemblyAI) sell comparable underlying ASR capability
    - material
    - Request an independent replication benchmark of Canto's claimed WER reduction before treating it as a durable moat
  - - Cross-app, cross-device reach (not just OS-native)
    - Big Tech incumbents (Apple, Google, Microsoft) could close the gap by simply investing more in existing free dictation features
    - material
    - Track OS vendor dictation feature releases each major OS update cycle for signs of convergence
  - - Enterprise compliance/trust posture (HIPAA-ready, SOC 2)
    - Wispr's own March 2026 SOC 2 Type II invalidation undercuts this exact differentiation versus prosumer rivals at the worst possible time
    - material
    - Confirm current SOC 2 Type II re-issuance status and any customer contract impact before closing diligence
  - - Bottom-up enterprise distribution (employee-led adoption inside Fortune 500s)
    - Otter.ai's October 2025 enterprise suite launch directly contests the same enterprise accounts using a similar bottom-up-to-top-down motion
    - material
    - Request Wispr's enterprise logo overlap/competitive-loss data versus Otter.ai
  - - First-mover advantage in bot-free meeting capture (Notetaker)
    - Granola already has a mature, well-capitalized ($1.5B) bot-free product with reported displacement of legacy incumbents; Wispr entered this specific sub-market only in August 2026
    - material
    - Benchmark Wispr Notetaker's actual feature parity and customer conversion against Granola directly
  - - Capital advantage ($361M raised, $2B valuation) enabling outspending smaller rivals
    - Fireflies.ai's profitable, capital-efficient posture and Superwhisper/Aqua Voice's lean pricing show capital is not the only path to competing in this market
    - minor
    - Assess whether Wispr's spend is translating into defensible product gaps or primarily into growth marketing
  - - Hardware partnership (Oasis Devices ring) extends reach beyond software-only competitors
    - Partnership is exclusive-in-appearance only; no disclosed exclusivity terms prevent Oasis or a similar hardware maker from also partnering with Otter, Granola, or a new entrant
    - minor
    - Request the actual exclusivity terms (if any) of the Oasis Devices partnership
  notes: Severity reflects the researchers' assessment of how directly each threat undermines the specific moat claim, based on evidence reviewed; it is not a probability-weighted financial estimate.
