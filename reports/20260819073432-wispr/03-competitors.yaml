  evidenceGaps:
  - type: missing-source
    severity: material
    topic: no independent benchmark of Wispr Flow vs. competitors
    missingEvidence: A methodologically transparent, non-vendor-affiliated benchmark comparing word-error rate, latency, and formatting quality across Wispr Flow, Otter.ai, Granola, and Superwhisper.
    whyItMatters: All comparison content reviewed is either vendor-authored or ad-supported blog content; competitive claims about accuracy cannot be independently verified.
    diligencePath: Commission a third-party lab benchmark (e.g., an academic ASR lab or independent test publication) across a standardized noisy-audio test set.
    relatedQuestionRefs:
    - QP017
  - type: missing-source
    severity: material
    topic: Canto accuracy claim lacks independent benchmark
    missingEvidence: An independent replication of Wispr's claimed Canto word-error-rate reduction (30%+ to 5-10%) using a standardized, publicly documented test methodology.
    whyItMatters: Moat durability hinges on whether Canto's accuracy edge is real and defensible or a marketing claim that competitors can quickly match.
    diligencePath: Request Canto's technical evaluation methodology from Wispr, or commission an independent replication study.
    relatedQuestionRefs:
    - QP026
  - type: enumeration-incomplete
    severity: minor
    topic: likely new entrants beyond currently identified competitors
    missingEvidence: A forward-looking scan of stealth-mode or recently-funded voice AI startups that could become direct Wispr competitors within 12-24 months.
    whyItMatters: The competitive landscape in AI voice software is moving quickly (Granola's $1.5B valuation emerged within roughly a year of its prior round); an incomplete entrant scan understates future competitive risk.
    diligencePath: Set up a recurring PitchBook/CB Insights alert for new voice-AI-dictation and meeting-transcription funding announcements.
    relatedQuestionRefs:
    - QP029
  - type: conflicting-data
    severity: minor
    topic: Otter.ai revenue vs. funding mismatch relative to Wispr
    missingEvidence: A reconciled explanation for why Otter.ai (estimated ~$100M ARR) has raised far less total capital (~$70-73M) than Wispr (~$361M) despite seemingly comparable or larger revenue.
    whyItMatters: This mismatch could indicate Wispr's valuation is pricing in growth/optionality well beyond Otter's revenue multiple, which is directly relevant to the valuation chapter.
    diligencePath: Request both companies' most recent revenue multiples and growth-adjusted valuation comparables from a banker or PitchBook subscription.
