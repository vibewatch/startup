chapter:
  number: 1
  title: Company Overview
  summary: Wispr, the San Francisco AI voice-dictation company behind Wispr Flow, closed a $280M Series B led by Menlo Ventures at a $2B valuation on August 17, 2026, expanding from core dictation into meeting transcription (Notetaker), a proprietary speech model (Canto), and new HCI research (Interface Labs), against a backdrop of a 2025-2026 privacy incident and a March 2026 SOC 2 Type II lapse.
sections:
- id: identity-and-founding
  title: Identity, Founding, and Product
  body: 'Wispr is a private, venture-backed AI software company headquartered in San Francisco, California, operating its flagship consumer/enterprise product under the Wispr Flow brand. The company was founded in 2021 by Stanford-trained engineers Tanay Kothari and Sahaj Garg, who initially pursued a neural-interface hardware concept before pivoting around 2024 to a pure-software voice-dictation product. Flow converts spoken speech into polished, formatted, context-aware text across Mac, Windows, iOS, and Android, and the company markets it as up to 4x faster than typing (roughly 220 words per minute versus a 45 wpm typing baseline in its own materials). As of the August 2026 Series B, Wispr has expanded well beyond core dictation: it launched Canto, its first proprietary speech-recognition model, to cut word-error rates in noisy environments from over 30% to 5-10%; it shipped Notetaker, a bot-free AI meeting-transcription product, on August 5, 2026; and it stood up Wispr Interface Labs, an internal research group exploring new human-computer-interaction paradigms. The company also partners with hardware maker Oasis Devices, whose Oasis 1 smart ring integrates with Flow to enable private, whisper-level dictation. Collectively these moves position Wispr as attempting to become a general ''voice layer'' beneath productivity software rather than a single-purpose dictation utility, per both company and lead-investor framing.'
