- id: leadership-and-governance
  title: Leadership, Governance, and Key-Person Dependence
  body: 'Wispr''s leadership is concentrated in its two co-founders: CEO Tanay Kothari, a Stanford Computer Science and AI graduate, Forbes 30 Under 30 honoree, and (per Getlatka) IOI medalist who previously built and sold the AI-personalization startup FeatherX; and CTO Sahaj Garg, a Stanford engineering graduate and former AI team lead at photonic-hardware startup Luminous Computing. No public reporting as of the run date indicates either founder has stepped back from their CEO/CTO role, so key-person dependence on this pair remains high with no disclosed successor for either seat. The leadership bench expanded in mid-2026 with the hire of Ariya Rastrow, a member of Amazon Alexa''s founding team, to lead the new Wispr Interface Labs research group — a meaningful addition of large-scale conversational-AI production experience the founders lack. On governance, the clearest public data point is that Hans Tung of Notable Capital joined Wispr''s board as an observer after the November 2025 Series A extension; no source identifies a full board roster, independent directors, or whether the Series B created new board seats, which is treated here as a material evidence gap rather than assumed to be resolved.'
