  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-Series-B absolute revenue/ARR disclosure
    missingEvidence: An audited or company-disclosed absolute revenue/ARR figure as of the August 2026 Series B (only relative growth-rate claims are public).
    whyItMatters: Valuation and financial-health judgments cannot be triangulated from growth rate alone without an absolute revenue base.
    diligencePath: Request trailing-twelve-month revenue and ARR from the company directly or via the Series B data room.
    relatedQuestionRefs:
    - QO020
  - type: missing-source
    severity: material
    topic: board of directors composition
    missingEvidence: A full, current list of Wispr's board members and any board seats (versus observer rights) created by the Series B.
    whyItMatters: Board composition affects governance risk, founder control, and investor influence over strategic decisions.
    diligencePath: Request the certificate of incorporation, voting agreement, or board consent records via the data room.
    relatedQuestionRefs:
    - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: leadership table completeness beyond named founders and lab lead
    missingEvidence: A full executive/leadership roster beyond the CEO, CTO, and the newly hired head of Interface Labs.
    whyItMatters: Key-person risk assessment is incomplete without visibility into VP-level and functional leadership depth.
    diligencePath: Request an organizational chart or LinkedIn-verified leadership roster from the company.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder/investor map completeness
    missingEvidence: Confirmed ownership percentages for each investor and full economic/control terms of the Series B.
    whyItMatters: Cap table concentration and investor control rights materially affect governance and exit dynamics.
    diligencePath: Request the cap table and Series B term sheet via the data room.
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology completeness
    missingEvidence: Any internal milestones (e.g., unannounced product releases, internal reorganizations) not captured in public reporting.
    whyItMatters: A chronology built solely from public press may omit material internal events relevant to diligence.
    diligencePath: Request an internal timeline of key events from company management.
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: typing-speed comparison claims vs competitors
    missingEvidence: An independent, methodology-disclosed benchmark comparing Wispr Flow's claimed 4x/220wpm typing-speed multiplier against competing dictation tools.
    whyItMatters: Company-claimed speed multipliers are marketing figures; without a neutral benchmark the comparative advantage cannot be verified.
    diligencePath: Commission or locate an independent third-party benchmark test across Wispr Flow, Otter.ai, and Apple/Google native dictation.
    relatedQuestionRefs:
    - QO030
  - type: conflicting-data
    severity: material
    topic: conflicting total-funding figures across trackers
    missingEvidence: A reconciled, single total-funding figure; TechCrunch/Yahoo report $361M cumulative while Getlatka's tracker reports $315M across three rounds.
    whyItMatters: A ~$46M discrepancy in cumulative funding affects capital-efficiency and burn-rate analysis in later financials chapters.
    diligencePath: Request the company's own capitalization summary or verified funding ledger.
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: conflicting customer/business-count figures
    missingEvidence: A single reconciled figure for how many businesses/enterprises use Wispr Flow; sources range from >10,000 enterprises to 100,000-125,000+ businesses.
    whyItMatters: Customer-count claims feed directly into market-penetration and valuation multiples used in later chapters.
    diligencePath: Request the company's own enterprise-account and seat-count reporting.
    relatedTableRefs:
    - TO001
  - type: access-blocked
    severity: minor
    topic: Tracxn and CB Insights company profile pages blocked during research
    missingEvidence: Full Tracxn and CB Insights structured company profiles (funding rounds, investor list, headcount trend).
    whyItMatters: These aggregators often hold reconciled datasets that could resolve some of the conflicting figures noted above.
    diligencePath: Access Tracxn/CB Insights via a paid seat or alternate IP/session to retrieve the full profile.
    relatedQuestionRefs:
    - QO021
