- id: exhibits
  title: Exhibits
  body: 'Supporting exhibits for this chapter include the milestone chronology table (also rendered as a timeline figure), the leadership and stakeholder enumeration tables, and the snapshot KPI figure. One cross-cutting note not tied to a single section above: Wispr''s flagship product name, ''Flow,'' overlaps with a Google AI product also named ''Flow,'' which Autodesk sued Google over in 2026 for trademark infringement. That dispute does not involve Wispr directly, but it illustrates a live branding/trademark-collision risk pattern in the AI software space that this diligence exercise flags for ongoing monitoring rather than treating as resolved. Later chapters in this report — market analysis, competitors, financials, product and technology, customers, risks, and valuation — should treat the identity, leadership roster, funding chronology, and cover metrics established here as the reusable ground truth, updating only the volatile facts explicitly flagged as evidence gaps above.'
  claimRefs:
  - CO045
