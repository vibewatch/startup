- id: TR005
  title: Mitigation and Kill-Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - BIPA/voice-biometric litigation exposure
    - Wispr (or a direct competitor) named as a defendant in voice-biometric litigation
    - Any filed complaint naming Wispr directly
    - Reassess legal-exposure severity from precedent-level to confirmed-matter level; request litigation-reserve disclosure
  - - SOC 2 Type II compliance lapse
    - Re-issuance (or continued delay) of a valid SOC 2 Type II attestation
    - No Type II re-issuance within 12 months of the March 2026 invalidation
    - Treat continued delay as a deeper compliance-program weakness; flag as a blocker for regulated-vertical expansion
  - - Financial-model opacity
    - Company discloses (via next round, M&A process, or voluntary disclosure) an absolute revenue/ARR figure
    - Disclosed figure materially below what 150%+ quarterly growth from the stale ~$10M base would imply
    - Reassess valuation multiple and growth-quality assumptions downward
  - - Key-person departure
    - Either co-founder (CEO or CTO) departs or is replaced
    - Any public announcement of a Kothari or Garg departure
    - Treat as a thesis-break-level event given no disclosed succession plan
  - - Capital-adequacy stress
    - Signs of hiring freeze, layoffs, or a down round
    - Any public report of layoffs or a subsequent round at a flat/down valuation
    - Reassess capital-adequacy and financing-dependency risk upward
  - - Competitive displacement
    - Independent benchmark shows Wispr's accuracy/latency falling materially behind FreeFlow, OpenWhispr, or a funded competitor
    - A credible, methodologically transparent benchmark showing Wispr behind on core metrics
    - Reassess moat-durability risk upward; revisit valuation assumptions tied to technical differentiation
  notes: Triggers are the researchers' proposed monitorable indicators for tracking risk evolution after this report's run date; none of these thresholds has yet been crossed as of August 19, 2026 based on evidence reviewed.
