- id: operational-and-security-risk
  title: Operational, Quality, and Security Risk
  body: 'Wispr''s most acute current operational risk is its own SOC 2 Type II attestation, proactively invalidated in March 2026 over auditor-integrity concerns; the company has so far only obtained a lower-assurance SOC 2 Type I attestation from A-LIGN, with Type II and ISO 27001 re-audits still pending as of the run date — a real, unresolved gap that directly blocks the compliance assurances Wispr''s own marketing promises to regulated-vertical (legal, healthcare) buyers. This compliance lapse follows a separate, earlier data-privacy incident in which Flow''s context-awareness feature captured screenshots and audio without clear disclosure, and the company''s first response to the user who exposed it was to ban that account — a quality-control and trust failure the CTO later publicly apologized for, and which was only remediated after public backlash rather than proactively. Independent reviews also document a recurring product reliability failure mode: Flow loses or fails to complete transcription during long-form dictation in noisy environments or when using Bluetooth peripherals such as AirPods, working well only ''in calm, quiet environments'' per one reviewer''s direct testing. No source discloses a public status page, SLA commitment, or incident history for Wispr''s cloud service, and the company''s cloud-only architecture (no offline mode on any platform) means any cloud/infrastructure degradation directly and immediately affects the customer-facing product with no local fallback — a structural exposure inherent to the architecture choice rather than a one-time incident.'
