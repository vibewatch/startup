- id: people-execution-and-mitigations
  title: People/Execution Risk and Mitigations
  body: 'Wispr''s key-person risk is concentrated in its two co-founders, CEO Tanay Kothari and CTO Sahaj Garg, with no disclosed succession plan and no deep bench of named executive leadership beyond the recently hired head of Wispr Interface Labs; while no public reporting indicates either founder has departed, the company''s entire strategic and technical direction rests on this two-person team. This concentration is compounded by conflicting third-party headcount estimates (ranging from roughly 50 to 125 employees across QuantLogix, FundedIQ, LeadIQ, and Getlatka) and by the fact that Wispr is simultaneously executing on at least four distinct workstreams — core Flow/Canto improvement, Notetaker product maturation, Wispr Interface Labs research, and India/UK go-to-market expansion — an execution-breadth risk relative to an organization of uncertain but likely modest size. Two independent open-source projects, FreeFlow and OpenWhispr, built explicitly as Wispr Flow alternatives with comparable claimed latency, represent a further competitive/execution risk: a credible, no-cost substitution path exists if Wispr''s own execution falters on price, privacy, or reliability. Against these risks, Wispr has put in place concrete, if incomplete, mitigations documented on its own security and privacy pages: HIPAA-ready controls, a (currently Type I, pending Type II) SOC 2 program, opt-in AI-training data use, and a zero-retention Privacy Mode — genuine risk-response steps rather than an absence of any mitigation, even though several of the risk clusters identified in this chapter remain only partially addressed.'
