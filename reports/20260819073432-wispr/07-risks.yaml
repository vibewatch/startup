- id: exhibits
  title: Exhibits
  body: 'This chapter proposes monitorable kill criteria for each major risk cluster rather than leaving severity assessments purely qualitative: a confirmed BIPA-style claim naming Wispr directly, continued delay beyond 12 months in re-obtaining a valid SOC 2 Type II attestation, a disclosed absolute revenue figure materially below what the company''s own growth-rate claims would imply, any co-founder departure, and signs of capital-adequacy stress (hiring freezes, layoffs, or a down round) would each represent a material escalation beyond the current risk assessment in this chapter. None of these thresholds has been crossed as of August 19, 2026 based on the evidence reviewed, and readers should treat the regulatory/legal risks in particular as prospective, precedent-based exposure rather than confirmed, pending matters against Wispr specifically. Several diligence gaps are preserved rather than resolved with unverified confidence: whether Wispr is a party to any voice-biometric litigation, its trademark registration status for ''Flow,'' its actual burn rate and runway, and its full board/governance composition all require direct company or docket-level confirmation beyond what public sources provide.'
