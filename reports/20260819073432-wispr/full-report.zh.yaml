            body: >-
              本章保留了若干尽调缺口，而不是用未经验证的把握感把它们抹平：Canto 所称准确率提升、Wispr 自己 API 文档转载的 MacLife 引用，都没有独立基准；Wispr 云服务没有披露 uptime/SLA
              承诺、状态页或事故记录；也没有公开独立安全审计或渗透测试。护城河耐久性问题——Wispr 以 Canto 准确率、亚秒级延迟工程和集成广度拼出的组合，能否挡住 FreeFlow、OpenWhispr
              这类已经声称有相近延迟的开源替代品——仍只得到部分解答，后续应做直接并排对比。读者应把本章图表中的每一项架构和依赖细节，都视为依据 Wispr 自身技术博客和独立评论综合推断而来；公司没有公开点名具体云基础设施或
              LLM 供应商。
            claimRefs:
              - CE017
              - CE028
