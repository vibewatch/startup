chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与产品
        blocks:
          - type: paragraph
            body: >-
              Wispr 是一家总部位于 San Francisco, California、由风险资本支持的私营 AI 软件公司，旗舰消费者 / 企业级产品使用 Wispr Flow 品牌。公司由 Stanford
              背景工程师 Tanay Kothari 和 Sahaj Garg 于 2021 年创立，最初探索神经接口硬件概念，约在 2024 年转向纯软件语音听写产品。Flow
              能把口述内容转换为润色过、带格式、理解上下文的文本，覆盖 Mac、Windows、iOS 和 Android；公司在市场材料中称其速度最高可达打字的 4x（按其自有材料，约 220 words per
              minute，对比 45 wpm 打字基线）。到 August 2026 Series B 时，Wispr 已经明显超出核心听写：它发布了首个自研语音识别模型 Canto，把嘈杂环境中的词错误率从超过 30%
              降到 5-10%；在 August 5, 2026 推出无机器人 AI 会议转写产品 Notetaker；并成立内部研究组 Wispr Interface Labs，探索新的人机交互范式。公司还与硬件厂商
              Oasis Devices 合作，后者的 Oasis 1 智能戒指接入 Flow，可支持私密的耳语级听写。合在一起看，按公司和领投方的叙事，Wispr
              正在尝试从单一用途听写工具，变成生产力软件底层的通用「语音层」。
