  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Canto / Notetaker 成熟为可持续平台；SOC 2 Type II 迅速恢复；没有 BIPA 式索赔提交； ARR 在显著更大的披露基数上增长到后期 AI 25-30x 倍数区间
        - 下一轮或退出定价不低于 $2B 标记，且经验证的收入倍数与 AI 应用基准一致
        - 在团队规模不确定、可能不足 100 人的情况下，同时推进四条工作流带来执行风险
        - Menlo Ventures 作为重复下注且掌握信息的投资人领投 Series B，是正面信号，但并非决定性证据
      - - 基准
        - 相对增长继续强劲，但绝对收入低于 $2B 估值在典型 8-20x 倍数下所需水平； SOC 2 Type II 最终恢复且未再出事；无重大监管事件
        - 下一轮定价大致持平到小幅上升，反映公司继续执行，但披露质量疑虑仍在
        - AI 原生推理成本挤压利润率；公司继续依赖 VC 融资，而非自我维持的现金流
        - 下轮估值下调频率（2026 年约 19-30%）的广泛市场数据表明， 该结果至少和乐观情景一样可能
      - - 悲观
        - BIPA 式索赔针对 Wispr 提交；SOC 2 Type II 重新审计进一步停滞； 下一次流动性事件披露的收入远低于隐含增长主张
        - 下一轮融资是 down round，与报道中 2026 年约 19-30% 风险投资轮次为 down round 一致
        - 监管诉讼成本；受监管行业企业合同流失；投资人信心受损
        - 股权结构表中运动员 / 名人投资人占位，对严谨、收入验证驱动的承销纪律是弱负面信号
    notes: 概率信号是基于证据的定性判断，不是量化概率分布； 已审查来源没有提供针对 Wispr 的正式概率加权估值模型。
