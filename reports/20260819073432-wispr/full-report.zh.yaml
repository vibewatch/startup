      - number: '3.3'
        title: 切换成本、多栖使用与分发 / 供给入口
        blocks:
          - type: paragraph
            body: >-
              对个人专业用户而言，几乎所有被审阅竞争者的切换成本都低：Wispr、Otter、Superwhisper 和 Willow
              都提供无需承诺的免费档或短期试用，因此用户可以真实多栖，同时试用几款听写工具，再决定日常使用哪一个。组织进入企业档并围绕特定供应商配置
              SSO、管理员控制和合规工作流后，切换成本会显著上升；此时，具备成熟企业工具的在位者（Wispr、Otter）相较缺乏可比企业级打包、面向准专业个人用户的新进入者（如 Superwhisper 或 Aqua
              Voice）拥有结构性锁定优势。分发和供给入口方面，Wispr 与硬件厂商 Oasis Devices
              的合作（通过智能戒指实现耳语级私密听写）是一种差异化渠道动作；本次审阅的直接听写应用竞争者中，没有任何一家披露了同等硬件合作，但也没有来源披露该安排是否排他。
            claimRefs:
              - CP027
              - CP028
              - CP030
      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Wispr 最清晰的技术护城河主张，是 Canto 模型把嘈杂环境词错误率从超过 30% 降到 5-10%；但这是公司自称，并未被独立基准验证，真实耐久性仍未证实。由于 OpenAI 开源 Whisper 模型和
              Deepgram 这类 API 供应商都出售大体可比的底层 ASR 能力，任何单一供应商自研模型（包括
              Wispr）的商品化风险都是结构性真实存在，而非假设。第二个耐久性风险是，科技巨头在位者（Apple、Google、Microsoft）只要加大对现有免费、操作系统内置听写功能的投入，就可能缩小 Wispr
              的跨应用听写质量差距，而不必新建一个完整产品类别。反向证据方面：本次审阅的直接竞争者（Otter、Fireflies、Granola、Superwhisper、Willow）似乎都没有经历过可与 Wispr 自身
              2025-2026 截屏采集 / 封禁用户事件或 March 2026 SOC 2 Type II 作废相当的公开信任事件。这使它成为 Wispr
              特有的、相对竞争者的声誉弱点，而不是行业普遍模式；这一点尤其重要，因为 Wispr 正试图在与面向准专业个人用户的低成本对手竞争的同时，用企业信任姿态做差异化。Wispr 近期最可防守的差异化，可能是跨应用 /
              跨设备触达与企业合规包的组合，而不是单独的原始转写准确率；本章审阅的几乎每一类竞争者，其准确率主张都在收敛。
