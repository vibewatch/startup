        - 确认 Wispr 是否在任何声纹生物识别诉讼中被点名
        - 直接影响估值内嵌的法律成本和监管风险假设
        - 检索 PACER / 州法院案卷；向公司法律顾问索取确认
      - - 股权结构表、稀释和优先股堆叠
        - 完整股权结构表持股比例、清算优先权和反稀释条款
        - 需要这些数据，才能计算任一投资者类别在下行或退出情景中的实际可实现回报
        - 通过数据室索取公司注册证书和 Series B 条款清单
