            title: 总体结论：观察 / 继续研究，不是买入或回避
            body: 定性逻辑（语音成为下一代界面）证据较充分，并由 Menlo Ventures 可信背书；但仅靠公开信息无法确认 $2B 估值已有支撑。绝对收入、SOC 2 Type II 状态和诉讼暴露解决后再重估。
