      - number: '8.4'
        title: 建议、风险评级与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Wispr 没有公开证据显示已准备退出——没有披露 IPO 时间表，没有披露 M&A 讨论，且 2026 年 8
              月仍在进行活跃一级融资——这确认公司仍牢牢处在成长融资阶段，而不是接近任何流动性事件。综合本报告全部证据，合适的总体建议是「观察 / 继续研究」，而不是明确买入或回避：定性逻辑（语音
              成为下一代默认界面，且有可信领投方和真实使用规模牵引力 佐证）证据较充分，但估值支撑性目前无法用公开信息确认，截至运行日期，重大监管、合规和披露风险仍未解决。这个建议的合适置信度是中，而不是高，因为定性
              产品市场匹配案例相当强，但定量估值支撑证据（绝对收入、毛利率、NRR、股权条款）几乎完全缺席于公开来源。相应地，风险评级为中到高：未解决的 SOC 2 Type II
              缺口、活跃全行业监管先例风险，以及两位创始人关键人依赖叠加在一起。估值立场最适合描述为「偏高」——原则上可由增长率主张和可比公司背景支撑，但在没有进一步披露前，无法确认定价公平。6
              个具体最终尽调问题会显著提高判断信心：Wispr 的绝对收入/ARR 数字、当前 SOC 2 Type II
              重审状态、任何语音生物识别诉讼暴露的确认、完整股权结构表和优先权堆叠、毛利率/CAC/NRR/烧钱数据，以及客户集中度画像；公开来源无法解决其中任何一项。
