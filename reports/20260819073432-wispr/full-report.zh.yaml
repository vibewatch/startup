          detail: 提供 Oasis 1 戒指集成；属于补充，不是核心
          tone: neutral
        - id: auditors
          label: SOC 2 / ISO 27001 审计方（A-LIGN 及前任审计方）
          detail: 合规认证依赖；前任审计方的诚信失效已经造成真实事件
          tone: negative
        - id: board
          label: 董事会 / 治理（Notable Capital 观察员席位）
          detail: 唯一披露的治理参与数据点
          tone: neutral
        - id: founders
          label: 联合创始人（Kothari、Garg）
          detail: 唯一具名的高管领导层；未披露接班计划
          tone: negative
        - id: product
          label: Wispr Flow / Notetaker / Canto 产品
          detail: 最终触达客户的产品
          tone: neutral
      edges:
        - from: cloud
          to: product
          label: 提供所需算力
        - from: auditors
          to: product
          label: 证明企业销售所需的信任状态
        - from: oasis
          to: product
          label: 延伸硬件触达
        - from: founders
          to: product
          label: 确定技术和战略方向
        - from: menlo
          to: founders
          label: 提供资本和治理输入
        - from: board
          to: founders
          label: 提供投资人监督（按披露，仅为观察员）
    approximationNotes: 云 / AI 基础设施提供商身份是推断，并非公司确认；审计方依赖被纳入，是因为其 2026 年失效曾直接冲击已披露的产品信任。
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR012
  - id: FV001
    title: Wispr 建议逻辑链
    type: flow
    layout: wide
    summary: 已披露规模 / 验证、未解风险和估值支撑缺口如何合并，形成总体“继续研究”建议。
    data:
      nodes:
        - id: scale
          label: 规模 / 验证证据
          detail: 60B+ 词、10,000+ 家企业、150%+ 环比增长、72% 参与度——都是真实指标，但属于相对 / 代理指标
        - id: thesis
          label: 乐观逻辑（Menlo Ventures）
          detail: 语音会成为听写之外的下一个默认界面
        - id: antithesis
          label: 反向逻辑缺口
          detail: 未被基准验证的 Canto 说法；SOC 2 Type II 失效；BIPA / EU AI Act 先例风险
        - id: financials
          label: 财务披露不透明
          detail: 公开信息没有绝对收入、毛利率、NRR、烧钱速度或股权结构表数据
        - id: comparables
          label: 可比公司组背景
          detail: ElevenLabs 约 33x ARR；Granola、Deepgram、Fireflies 估值量级相近
        - id: risk
          label: 风险评级：中高
          detail: 综合监管、合规、关键人和披露风险
        - id: recommendation
          label: 建议：观察 / 继续研究
          detail: 信心：中；估值立场：偏高
      edges:
        - from: scale
          to: thesis
          label: 支撑
        - from: thesis
          to: recommendation
          label: 指向上行空间
        - from: antithesis
          to: risk
          label: 抬高
        - from: financials
          to: risk
          label: 抬高
        - from: comparables
          to: recommendation
          label: 提供背景，不构成确认
        - from: risk
          to: recommendation
          label: 压低确信度
    claimRefs:
      - CV017
      - CV018
      - CV027
      - CV032
      - CV033
  - id: FV002
    title: 支撑 Wispr $2B 估值所需收入：不同倍数下的测算
    type: bar
    layout: standard
    summary: 示例测算：按 2026 年基准研究引用的低位、中位和高位后期 AI 应用倍数，要支撑 $2 billion 估值所需的年收入。
    data:
      items:
        - label: 8x 下所需收入（AI 应用低端）
          value: 250
          detail: 以 8x 倍数支撑 $2B 所需的百万美元收入
          tone: negative
        - label: 14x 下所需收入（AI 应用中点）
          value: 143
          detail: 以 14x 倍数支撑 $2B 所需的百万美元收入
          tone: warning
        - label: 20x 下所需收入（AI 应用高端）
          value: 100
          detail: 以 20x 倍数支撑 $2B 所需的百万美元收入
          tone: neutral
        - label: 33x 下所需收入（ElevenLabs 可比倍数）
          value: 61
          detail: 按 ElevenLabs 隐含约 33x ARR 倍数支撑 $2B 所需的百万美元收入
          tone: positive
        - label: 已过时的已披露 ARR 估计（Getlatka, Oct 2025）
          value: 10
          detail: 公开可得的唯一绝对收入数字，日期比 Series B 早近一年
          tone: negative
    approximationNotes: 所需收入数字只是用行业基准倍数做的简单算术（估值 / 倍数），不是 Wispr 披露的专项计算；已过时的 $10M 只用于量级对照，并不代表当前水平。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV009
  - id: FV003
    title: Wispr 估值 / 回报区间（示例性下一轮结果）
    type: range
    layout: wide
    summary: 在本章定义的悲观 / 基准 / 乐观情景下，Wispr 下一次披露融资事件的低 / 基准 / 高示例性估值结果。
    data:
      items:
        - label: 悲观情景下一轮估值
          low: 1.2
          mid: 1.6
          high: 2
          displayValue: $1.2B-$2.0B
          detail: 下行轮情景，与 2026 年风投轮次中约 19-30% 被报道为下行轮相一致
          tone: negative
        - label: 基准情景下一轮估值
          low: 2
          mid: 2.3
          high: 2.8
          displayValue: $2.0B-$2.8B
          detail: 大致持平到小幅上行，反映持续执行，但披露怀疑仍在
          tone: neutral
        - label: 乐观情景下一轮估值
          low: 3
          mid: 4.5
          high: 6
          displayValue: $3.0B-$6.0B
          detail: 如果 Canto / Notetaker 成熟为耐用平台，则与 Granola 式重估幅度相一致
          tone: positive
    approximationNotes: 所有数字都是本报告构建的 USD billions 口径示例性情景区间，不是公司或投资人披露目标；锚定的是可比公司估值轨迹（如 Granola 在一个周期内大约 6x 重估）以及本章引用的下行轮频率基准。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV011
  - id: FV004
    title: Wispr 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的紧凑评分，覆盖市场、验证、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场
          value: Large but boundary-uncertain
          detail: $9B-$61B 品类总规模区间取决于定义；未给出 Wispr 份额估计
          trend: neutral
        - label: 验证 / 牵引力
          value: Strong relative, weak absolute
          detail: 150%+ 环比增长、60B+ 词已听写，但未披露绝对收入
          trend: up
        - label: 护城河
          value: Unbenchmarked
          detail: Canto 准确率说法和集成广度确实存在，但未被独立验证
          trend: neutral
        - label: 单位经济
          value: Undisclosed
          detail: 公开信息没有毛利率、CAC、回本周期或 NRR；AI 原生基准暗示 40-60% 毛利率区间
          trend: down
        - label: 风险
          value: Medium-to-high
          detail: SOC 2 Type II 失效未解决，监管先例风险活跃，关键人集中度高
          trend: down
        - label: 估值支撑
          value: Stretched / unverifiable
          detail: $2B 标记无法用公开信息中的收入倍数做基准比较
          trend: down
        - label: 证据质量
          value: Medium
          detail: 35 个来源覆盖 10+ 个域名，但核心财务指标完全受制于私有披露缺口
          trend: neutral
    claimRefs:
      - CV027
      - CV032
      - CV033
      - CV034
