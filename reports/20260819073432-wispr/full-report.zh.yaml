      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Wispr 当前最尖锐的运营风险，是它自己的 SOC 2 Type II 审验：2026 年 3 月，因审计方诚信问题被主动作废；截至运行日期，公司只从 A-LIGN 取得了保证级别较低的 SOC 2 Type
              I 审验，Type II 和 ISO 27001 复审仍未完成。这是一个真实且未解决的缺口，直接堵住 Wispr
              自身营销向受监管垂直行业（法律、医疗）买家承诺的合规保证。这一合规缺口之前，还有另一起数据隐私事件：Flow
              的情境感知功能在披露不清的情况下采集截图和音频，公司对曝光该问题的用户第一反应是封号——这是一次质量控制和信任失败，CTO
              后来公开道歉，且补救是在舆论反弹后才发生，而非主动完成。独立评论还记录了一种反复出现的产品可靠性失效模式：在嘈杂环境中长篇听写，或使用 AirPods 等 Bluetooth 外设时，Flow
              会丢失或无法完成转写；按一名评测者的直接测试，它只在「平静、安静的环境」表现良好。没有来源披露 Wispr 云服务的公开状态页、SLA
              承诺或事故历史；公司纯云架构（任何平台都没有离线模式）意味着，任何云端/基础设施退化都会直接且立即影响面向客户的产品，没有本地备用方案。这是架构选择内生的结构性暴露，而非一次性事故。
