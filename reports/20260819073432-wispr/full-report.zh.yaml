      - number: '7.3'
        title: 合作伙伴/依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Wispr 的产品完全依赖未具名第三方云 / AI 基础设施供应商来支撑 ASR 和 LLM 处理管线；负面隐私报道还称，早期产品版本的数据经过与 OpenAI、Meta
              有关联的基础设施。这是一个真实但披露不完整的基础设施依赖，本次未在公开来源中找到应急方案。Wispr 在纯软件听写之外的硬件触达，依赖单一具名伙伴 Oasis
              Devices；没有披露排他条款或供应链韧性信息。资本和战略叙事依赖则集中在领投方 Menlo Ventures，其「文本框正在消亡」判断塑造了 Wispr 多轮融资中的公开定位。财务模型方面，截至 2026 年
              8 月 Series B，Wispr 没有披露绝对收入、ARR、毛利率、CAC/回本周期或 NRR；本次研究中唯一绝对收入估计，是 2025 年 10 月的过时约 ~$10 million
              ARR。这意味着，仅靠公开信息，目前无法用收入倍数校准公司的 $2 billion 估值。行业基准研究显示，如果如实计入推理成本，AI 原生 SaaS 产品现实毛利率大约为 40-60%，明显低于传统 SaaS
              75-85% 的常态；这意味着 Flow 这种推理密集型产品存在真实且持续的毛利挤压风险。再叠加未披露的烧钱速度和现金跑道（只有 $200K-$600K/月、12-15 个月的行业 代理估计），Wispr
              继续依赖风险资本、而非自我维持现金流，是结构性融资依赖风险，不是已经解决的问题。
