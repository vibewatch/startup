      - number: '5.3'
        title: 差异化、路线图与开发者社区信号
        blocks:
          - type: paragraph
            body: >-
              Wispr 最核心的技术差异化主张是 Canto。这个自研语音模型随 Series B 预览发布；公司称，在嘈杂真实环境中，它把词错误率从超过 30% 降到
              5%-10%，按公司估计，日常使用中需要手动编辑的听写减少 30-35%。但这些数字，以及 Wispr 自己 API 文档页面转载的 MacLife「100%
              准确率」推荐语，全部来自公司披露或公司筛选的引用，本次研究没有找到可独立复现的基准。与此同时，开发者社区把 Wispr Flow 作为参考产品的真实参与度确实存在：两个独立开源项目 FreeFlow 和
              OpenWhispr 明确做成 Wispr Flow 的替代品，并在 Hacker News 展示；FreeFlow 创建者称，采用类似的持久 WebSocket 架构后，三分之二的听写能在 0.6
              秒内完成。这一竞争性延迟主张值得与 Wispr 自己 700ms 目标持续对照，即便它不是直接头对头基准。相反，一个名义上代表「Wispr Flow」的 GitHub 组织页面更像 SEO
              导向营销文案，而不是真实仓库活动；它只能作为公司维护开源存在的低置信度证据。Wispr 披露的 2026 年 8 月路线图顺序——先成立 Interface Labs，再发布 Notetaker，再在
              Series B 同步预览 Canto——表明公司是在有意错峰推出新产品界面（研究组、已发布产品、核心模型升级），而不是三者同时发布；公司也维护一个公开且活跃更新的 更新日志，记录增量功能发布。
