      - number: '7.4'
        title: 人员/执行风险与缓释
        blocks:
          - type: paragraph
            body: >-
              Wispr 的关键人风险集中在两位联合创始人 CEO Tanay Kothari 和 CTO Sahaj Garg 身上；公司没有披露继任计划，除最近聘任的 Wispr Interface Labs
              负责人外，也没有具名高管深度梯队。虽然没有公开报道显示任何一位创始人离职，但公司的全部战略和技术方向都压在这两人团队上。这一集中度又被两个因素放大：第三方员工数估计彼此冲突（QuantLogix、FundedIQ、LeadIQ、Getlatka
              给出的范围大约 50 到 125 人），而且 Wispr 正同时推进至少四条不同工作线——核心 Flow/Canto 改进、Notetaker 产品成熟、Wispr Interface Labs
              研究、印度/英国市场进入扩张。相对一个规模不确定但可能并不大的组织，这是执行宽度风险。两个独立开源项目 FreeFlow 和 OpenWhispr 明确做成 Wispr Flow
              替代品，并声称有相近延迟，构成进一步竞争/执行风险：如果 Wispr 在价格、隐私或可靠性上执行失手，市场存在可信的免费替代路径。面对这些风险，Wispr
              确实在自身安全和隐私页面上落地了一些具体但不完整的缓释措施：HIPAA-ready 控制、SOC 2 计划（目前 Type I，Type II 待完成）、AI 训练数据 opt-in 使用，以及零留存
              Privacy Mode。这些是真实风险应对，而不是完全没有缓释；但本章识别的几个风险集群仍只得到部分处理。
