            body: >-
              Wispr 在 August 17, 2026 Series B 后的现金头寸至少包括该轮 $280 million 总募集资金；但没有来源披露扣除费用、历史烧钱或既有现金余额后的净账上现金。没有被审阅来源披露
              Wispr 实际月度烧钱速度或现金跑道月数；2026 年关于 Series B 阶段 AI / SaaS 创业公司的基准研究一般提示，总烧钱速度在 $200K-$600K per month
              区间，融资后典型现金跑道为 12-15 months，但这只是行业代理，不是 Wispr 特定数字，也不能替代真实尽调。截至报告日，没有公开报道显示 Wispr 冻结招聘或裁员；公司围绕 Series B
              的信息强调继续投入 Canto R&D、Notetaker 和 Interface Labs 扩张，以及进一步扩大 India / UK
              市场拓展，符合主动增长姿态，而非降本姿态。一个值得注意、来自主要来源但不在广泛报道定价轮次里的数据点是：一个小型特殊目的载体「Wispr I, a Series of Republic Deal Room
              Master Fund LLC」由 Sydecar LLC 管理，于 October 3, 2024 向 SEC 提交 Form D，披露一笔已全部售出的 $424,500 发行，首次出售日期为 March
