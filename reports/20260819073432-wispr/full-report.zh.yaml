  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              放在客户工作流里看，Wispr Flow
              让用户按下键盘快捷键，自然说话——包括填充词、自我纠正和句中改口——然后在光标所在位置生成润色过、带格式的文本，几乎可用于任意桌面或移动应用，替代消息、文档、代码和邮件中的手动输入。截至 August 2026
              Series B，Wispr 产品线横跨三个成熟度差异很大的模块：Flow 本身（成熟的多年核心听写产品，覆盖 Mac、Windows、iOS 和 Android）、Notetaker（August 5,
              2026 发布的无机器人会议转写产品，打包进现有档位且不额外收费）和 Canto（Wispr 首个自研语音识别模型，随 Series B 一起预览，作为另外两个产品的底层 ASR
              引擎）。第四项、尚未产品化的研究工作是 Wispr Interface Labs，由新聘 Ariya Rastrow（曾在 Amazon Alexa
              创始团队）负责；它离市场最远，探索新的人机交互范式，但未披露公开路线图或发布时间。Wispr 还通过与 Oasis Devices 合作，把软件产品延伸到硬件；后者的 Oasis 1
              钛金戒指让用户借助近距离耳语麦克风听写，无需大声说话，不过 Wispr 自身并不制造这款硬件。
