companyProfile:
  summary: >-
    Wispr 是一家总部位于 San Francisco、由风险资本支持的私营 AI 软件公司，2021 年由 Stanford 背景工程师 Tanay Kothari 和 Sahaj Garg 创立。两人最初做神经接口硬件概念，约在
    2024 年转向 Wispr Flow 语音听写软件产品。Flow 能把口述内容转换为润色过、带格式的文本，覆盖 Mac、Windows、iOS 和 Android；公司在 August 17, 2026 完成由 Menlo
    Ventures 领投的 $280 million Series B，估值 $2 billion，同时发布自研 Canto 语音模型和无机器人会议转写产品 Notetaker。公开证据最强的是使用规模牵引（已听写 60B+
    词、进入多数 Fortune 500 公司）和增长率主张（季度收入增长 150%+）；最弱的是绝对财务披露、独立技术基准，以及 March 2026 SOC 2 Type II 失效后的当前企业合规状态。
