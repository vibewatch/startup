  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重程度
      - 缓释措施 / 尽调问题
    rows:
      - - Canto 自研 ASR 模型将噪声环境 WER 从 30%+ 降至 5-10%
        - 商品化 — 开源 Whisper 和 API 供应商（Deepgram、AssemblyAI）出售可比的底层 ASR 能力
        - 重大
        - 在把 Canto 视为持久护城河前，要求独立复现实验验证其 WER 降幅宣称
      - - 跨应用、跨设备覆盖（不只是 OS 原生）
        - 科技巨头既有厂商（Apple、Google、Microsoft）只要加大投入现有免费听写功能，就可能补上差距
        - 重大
        - 每个主要 OS 更新周期跟踪 OS 厂商听写功能发布，观察是否趋同
      - - 企业合规 / 信任姿态（HIPAA 就绪、SOC 2）
        - Wispr 自身 2026 年 3 月 SOC 2 Type II 失效，正好在最糟糕的时间削弱了它相对专业消费者对手的这个差异化
        - 重大
        - 交易关闭前确认当前 SOC 2 Type II 重新签发状态及任何客户合同影响
      - - 自下而上的企业分发（员工先在 Fortune 500 内采用）
        - Otter.ai 2025 年 10 月推出企业套件，用类似的自下而上转自上而下打法，直接争夺同一批企业账户
        - 重大
        - 要求 Wispr 提供与 Otter.ai 的企业客户重叠 / 竞争流失数据
      - - 无机器人会议捕捉（Notetaker）的先发优势
        - Granola 已经有成熟且资金充足（$1.5B）的无机器人产品，据称正在替代传统既有工具；Wispr 直到 2026 年 8 月才进入这个子市场
        - 重大
        - 直接对标 Granola，测试 Wispr Notetaker 的实际功能齐平度和客户转化
      - - 资本优势（已融资 $361M，估值 $2B），可以比小对手更敢花钱
        - Fireflies.ai 的盈利、资本高效姿态，以及 Superwhisper/Aqua Voice 的轻量定价，说明资本不是在这个市场竞争的唯一路径
        - 轻微
        - 评估 Wispr 的支出是在转化为可防御的产品差距，还是主要砸进增长营销
      - - 硬件合作（Oasis Devices 戒指）把触达延伸到纯软件对手之外
        - 合作只是在表象上排他；未披露任何排他条款可阻止 Oasis 或类似硬件厂商也与 Otter、Granola 或新进入者合作
        - 轻微
        - 要求查看 Oasis Devices 合作的实际排他条款（如有）
    notes: 严重程度反映研究团队评估每项威胁多直接削弱具体护城河主张，依据已审证据；它不是按概率加权的财务估计。
