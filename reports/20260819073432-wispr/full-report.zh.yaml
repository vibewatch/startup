  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - ElevenLabs（语音合成 / TTS）
        - $330M ARR（2025 年底）；$11B 估值（2026 年 2 月 Series D）
        - 约 33x ARR
        - 最接近且披露收入的语音 AI 可比对象；提供真实倍数锚点
        - 核心产品不同（TTS / 语音克隆 vs. Wispr 的听写 / 转录）；不是直接产品替代品
      - - Otter.ai（会议转录）
        - 约 $100M 估计 ARR（2025 年 3 月）；累计披露融资约 $70-73M
        - 隐含历史估值倍数低于 Wispr 当前位置（2026 年当前准确估值未披露）
        - 最接近的直接产品可比对象（会议转录，与 Wispr Notetaker 竞争）
        - 2026 年当前估值未公开披露；ARR 数字是第三方估计，未经公司确认
      - - Granola（无机器人会议记录工具）
        - $1.5B 估值（2026 年 3 月 Series C，融资 $125M）；上一轮估值 $250M
        - 估值在一个融资周期内大约翻了三倍（可比的是幅度而非倍数，类似 Wispr 自身重估）
        - 架构最相近的直接可比对象（无机器人采集，与 Wispr Notetaker 同一产品类别）
        - Granola 未披露 ARR，无法计算收入倍数
      - - Deepgram（语音 AI 基础设施 / API）
        - $1.3B 估值（2026 年 1 月 Series C，融资 $130M）
        - 未披露 ARR；商业模式不同（B2B 基础设施 API vs. Wispr 的 B2C / B2B 应用）
        - 相邻基础设施可比对象；说明资本正广泛流向语音 AI
        - 不是直接产品可比对象；服务开发者，而非直接服务知识工作者
      - - Fireflies.ai（会议转录 / CRM）
        - '>$1B 估值（2025 年 6 月）；2021 年以来无重大融资'
        - 以少得多的披露资本达到与 Wispr 相近的估值量级（有限披露融资支撑 $1B+ 估值）
        - 直接产品可比对象，展示以更高资本效率达到类似估值量级的路径
        - 估值时点较旧（2025 年中），且 2026 年未获独立重新确认
    notes: 仅在同时披露估值和收入数字时才计算倍数（ElevenLabs）；其他所有可比对象至少有一个输入项未披露， 因此只能比较估值量级，而非计算出的倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most directly relevant, recently-funded voice-AI comparables identified through August 2026 research;
        smaller or unfunded competitors and any non-public comparables are necessarily excluded.
