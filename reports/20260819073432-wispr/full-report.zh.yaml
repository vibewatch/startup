  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Wispr Flow 的客户群覆盖个人自助专业用户、垂直企业买家（法律场景的 Flow for Lawyers、客户支持专用产品页），以及面向多数 Fortune 500 公司的广泛横向部署；公司发布的 6
              个面向人群画像的案例研究覆盖 B2B/GTM 团队、创始人、创客、顾问、作家和创作者。独立评论 StartupSpells
              明确把这个人群画像定向案例页解读为精心设计的转化漏斗，而不是自然形成的客户证言集合——这提醒我们，Wispr 的具名客户证据是经过筛选的营销内容，不是典型账户的随机样本。最清晰的生产级、全公司具名部署是
              Clay，这是一家位于 San Francisco、拥有 200+ 员工的 B2B 软件平台；Clay 报告称，在其 GTM 技术栈全公司采用 Wispr Flow 后，客户响应时间缩短 52%，每天客户电话增加
              20%，每年估计节省 $3.08 million 成本。和本次研究找到的其他具体结果指标一样，这些数字全部来自 Wispr 自己的案例研究页面，没有找到独立佐证。Clay
              之外，具名客户证据主要由高知名度个人背书构成——律师 Ernie Svenson、LinkedIn 联合创始人 Reid Hoffman（「I am Voicepilled」）、NBA 全明星 Domantas
              Sabonis（由 Yahoo Finance/AFP 独立引用，而不只是 Wispr 自己的营销）——这些背书是真实的，但相较普通企业账户的广泛样本，过度代表最佳案例和名人相邻证言。
