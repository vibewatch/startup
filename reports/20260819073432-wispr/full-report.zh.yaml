      - number: '3.2'
        title: 能力、定价与市场打法对比
        blocks:
          - type: paragraph
            body: >-
              独立对比文章（虽严格来说并非供应商中立）一致描述 Wispr Flow 在实时、跨应用听写准确率和技术术语处理上更强，而 Otter.ai 在说话人标注、CRM
              集成等会议协作功能上更强。本次审阅没有找到方法透明且非供应商关联的基准，能比较 Wispr Flow
              与直接竞争对手的词错误率、延迟或格式质量；所有找到的对比要么是供应商撰写内容，要么是广告支持博客评论，这严重限制了任一方向准确率优势主张的可信度。定价上，Wispr Flow 的 Pro
              档（$12-15/month）高于 Otter.ai 约 $8.33/month 的等价价格；真正更便宜的只有免费操作系统原生档。Superwhisper 的 $249.99 终身授权和 Aqua Voice
              颗粒化 $8-24/month 档位，代表完全不同的打包策略，瞄准的是拒绝 Wispr 和 Otter 循环订阅模式、价格敏感的个人买方。销售打法上，Wispr 在 Fortune 500
              公司内部由员工驱动、自下而上的采用路径，如今正被 Otter.ai October 2025 企业套件发布（API、MCP 服务器和企业 AI
              智能体）直接挑战；两家公司不是各走一条路，而是从不同起点收敛到同一批企业账户。
