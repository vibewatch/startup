      - number: '8.2'
        title: 当前融资背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Wispr 于 2026 年 8 月 17 日完成 $280 million Series B，估值 $2 billion；相比 9 个月前约 $700 million 估值几乎翻了 3
              倍。这一融资节奏假定投资人对 AI 语音软件的兴趣继续强劲，也与 2026 年市场评论一致：AI 估值处在高位（尽管并非所有人都认定不可持续），包括种子期 AI 公司相对非 AI 同行有 42%
              溢价，以及分析师和至少一名前情报官员对潜在回调发出警告。在语音 AI 类别内部，可比融资提供了有用但不完美的参照：ElevenLabs 于 2026 年 2 月完成 $500 million Series
              D，估值 $11 billion，披露 ARR 为 $330 million，隐含 ARR 倍数约 33x；这是本次研究找到的披露收入最清晰可比项，尽管 ElevenLabs 核心产品（语音合成/TTS）与
              Wispr 的听写/转写重点有实质差异。Granola 是架构上最相近的可比公司（无需会议机器人的会议捕获，对应 Wispr 自己的 Notetaker 路径），2026 年 3 月完成 $125 million
              Series C，估值 $1.5 billion，高于上一轮 $250 million；相对重估幅度与 Wispr 近期轨迹相近，不过 Granola 自己的 ARR 未披露。Deepgram（$1.3
              billion，2026 年 1 月）和 Fireflies.ai（据报道截至 2025 年 6 月超过 $1 billion，2021
              年以来未有大额融资）补足可比组，说明相近估值可以通过资本密集的基础设施路径，也可以通过资本效率和盈利导向路径达成——这两条都不同于 Wispr 自身重融资的增长策略。关键是，没有上市的纯垂直语音 AI
              听写公司可作为公开市场估值锚；这里识别的每个可比公司本身也都是由 VC 轮次定价的私营公司，因此可比公司方法继承了本章试图为 Wispr 解决的同一类私募市场定价不确定性。
