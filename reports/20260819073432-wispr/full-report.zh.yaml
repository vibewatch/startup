      - number: '1.4'
        title: 封面指标、规模与反向事件
        blocks:
          - type: paragraph
            body: >-
              Wispr 报告称，在进入 Series B 前，收入增长连续四个季度超过 150%；Menlo Ventures 自己的投资备忘录也单独描述其收入在约十四个月内同比增长超过
              30x。考虑复利，两组数字大体一致。支撑这些增长率的绝对收入基数并未披露；唯一公开估计是 Getlatka 截至 October 2025 的陈旧约 $10 million ARR，因此 2026
              年当前美元收入仍是开放问题。客户规模主张同样不一致：Yahoo Finance / AFP 称超过 10,000 家企业，AI Weekly 对同一公告的报道称 100,000 家企业，其他 2026 年媒体称
              125,000+ 家企业；一篇 January-2026 报道还单独指明已有 270 家具名 Fortune 500 公司采用。第三方数据供应商给出的员工数估计从约 50 到 125
              不等，公司没有官方披露来收束区间。反向侧，Wispr 经历过一次重大隐私事件：Flow
              早期版本会周期性捕获用户屏幕截图，同时采集音频，并在缺乏清晰披露的情况下把两者传到云基础设施；用户曝光该行为后，公司第一反应是封禁该用户账号，CTO Sahaj Garg 后来公开道歉。随后，公司把语音数据用于
              AI 训练改为默认选择加入，并推出零留存 Privacy Mode。另一起事件是，Wispr 的 SOC 2 Type II 合规证明因审计机构诚信问题在 March 2026 被主动作废；公司在 April
              2026 从 A-LIGN 获得新的 SOC 2 Type I 证明，但 Type II 和 ISO 27001 复审仍在推进。Wispr
              正在向法律、医疗等受监管垂直行业销售，这两起事件都对企业采购方构成重大影响。
