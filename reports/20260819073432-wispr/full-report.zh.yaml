  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 何种证据会改变判断
    rows:
      - - 乐观逻辑：Wispr 成为生产力软件底层默认「语音层」，而不只是一个听写应用 （Menlo Ventures 的明确表述）
        - Notetaker 和 Canto 在核心 Flow 之外获得已确认牵引力，且独立基准验证技术护城河可持续
      - - 乐观逻辑：已披露相对增长强劲（连续 4 个季度 QoQ 超过 150%；Menlo 称 YoY 增长 30x）， 且使用规模代理指标广（60B+ 单词、10,000+ 家企业、72% 参与度）
        - 披露与这些增长主张一致的绝对收入 / ARR 数字
      - - 反向逻辑：核心技术差异化（Canto 准确率）完全来自公司自述，尚无基准验证
        - 独立且方法透明的基准验证或反驳 Canto 宣称的 WER 降幅
      - - 反向逻辑：SOC 2 Type II 证明 2026 年 3 月失效，尚未恢复，直接削弱乐观情景中的企业信任支柱
        - 有效 SOC 2 Type II 证明重新签发，并完成 ISO 27001 认证
      - - 反向逻辑：全行业活跃的 BIPA 和 EU AI Act 监管先例风险适用于任何语音数据公司
        - Wispr 未成为声纹生物识别诉讼的被点名方，并披露清晰的 EU AI Act 合规路线图
      - - 反向逻辑：财务披露完全不透明——没有公开绝对收入、利润率、NRR、烧钱速度或股权结构表数据
        - 公司通过数据室、下一轮融资或并购流程直接披露这些核心财务指标
      - - 反向逻辑：开源替代品（FreeFlow、OpenWhispr）声称以零成本提供可比延迟
        - 受控对比证明 Wispr 的实际产品质量和企业级打包能力显著优于这些替代品
    notes: 每行都把一个具体论点与可观察、可监测且会改变整体投资判断的事件配对； 只要任一行出现新证据，就应重审本表。
