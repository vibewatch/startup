      - number: '5.2'
        title: 架构、延迟工程与开发者集成
        blocks:
          - type: paragraph
            body: >-
              Wispr 自己的技术博客把架构写成“客户端捕获、云端处理”的管线：在用户设备上做本地语音活动检测和加密，通过 TLS 加密把音频实时流式传到 Wispr 云服务器，云端用 Canto 模型完成 ASR
              转写，再用 LLM 做后处理——去掉口头填充词、按具体应用套格式，并通过一个从用户长期编辑中学习的纠错反馈回路，逐 token 个性化输出。公司给出明确工程目标：用户说完后 700
              毫秒内完成完整转写和格式化，ASR 推理、LLM 推理和网络各自大约 200 毫秒；公司也把纯云端设计定义为刻意取舍：按照它自己的判断，真正实时的性能和个性化模型的高频更新，只有借助云服务器上的高端
              GPU/TPU 算力才能做到，而不是靠端侧处理。因此，Wispr Flow 在任何平台都不提供离线或端侧转写模式。第三方开发者可以通过 Voice Interface API 把 Flow
              的语音能力直接嵌进自己的应用；该 API 支持 WebSocket 流式传输（最低延迟）和 REST 批量提交。Wispr 也明确主打与开发者工具的深度集成——GitHub，以及独立报道提到的 Cursor、VS
              Code、Replit、Warp CLI——用于口述提交信息、代码审查和技术文档，并正确处理 camelCase/snake_case。Notetaker 另有一套 MCP（Meeting Content
              Platform）API，可把会议笔记和摘要导出到 Claude、ChatGPT 等外部 AI 智能体，把 Wispr 的集成面从核心听写产品继续向外延伸。
