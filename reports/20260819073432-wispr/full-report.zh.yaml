      - number: '6.4'
        title: 扩张驱动因素与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Wispr 推出的 Notetaker 面向与核心 Flow 相同的广泛专业用户群，而不是一个截然不同的新客群；这说明它更像留存/扩张打法——免费打包进现有 Free 和 Pro
              层级——而不是新客户获取工具。不过这是推断，并非公司披露的战略表述。Clay 案例研究展示了一个合理的先落地再扩张 路径（GTM 团队个人采用，扩展到 CRM 记录和内部文档），但没有来源量化 Clay
              或任何其他具名账户内部的实际席位增长，也没有来源披露 Wispr 的客户集中度风险——最大客户贡献的收入占比——因此这是完全未量化的尽调缺口。最常被提到的采购/渠道摩擦点，是 Wispr
              的纯云架构（引发企业买家的隐私/合规顾虑），以及更尖锐的公司自身 2026 年 3-4 月 SOC 2 Type II 作废与重审事件；后者是具体、已披露的阻碍，尤其卡住 Wispr
              正通过垂直话术积极争取的受监管垂直行业（法律、医疗）买家。Wispr 2025-2026
              年数据隐私事件——未披露的截图/音频采集，随后封禁曝光用户——是一次有记录的负面客户关系处理，合理推断它损害了公司赖以自然增长的自下而上、口碑驱动客户群信任，这一点独立于本章其他地方讨论的具体结果指标。
