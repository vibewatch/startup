          - type: callout
            title: 估值立场是「偏高」，不是明显便宜或昂贵
            body: 增长率主张和可比公司背景（ElevenLabs 约 33x ARR、Granola 的重估轨迹）原则上支持溢价倍数，但完全没有披露绝对收入，使 $2B 标记无法验证为公平定价。
            calloutType: risk
