  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接、在位、相邻与替代
        blocks:
          - type: paragraph
            body: >-
              Wispr 面对的不是单一同质市场，而是五类不同竞争者。核心听写的直接同行包括一批面向准专业个人用户的新兴低价应用——Superwhisper、Willow、Monologue 和 Aqua
              Voice；TechCrunch 在报道 Wispr 自身 Series B 时明确点名这组应用，称其带来更高竞争压力。会议转写方面，Wispr 新 Notetaker 产品（August 5, 2026
              发布）进入的是一个已有玩家的子市场：Otter.ai（WorldMetrics 估计约 $100M ARR、约 35% 转写市场份额）、Granola（March 2026 Series C 后估值
              $1.5B）和 Fireflies.ai（估值 >$1B、资本效率高）。即便 Wispr 整体规模占优，在这个子市场仍是后来者。科技巨头在位平台 Apple、Google 和 Microsoft
              提供免费的操作系统内置听写；Wispr 领投方 Menlo Ventures 也明确把它们（连同 Anthropic 和 OpenAI）列为公司更大「语音层」野心的最终竞争天花板。Deepgram
              等相邻基础设施厂商（January 2026 Series C，估值 $1.3B）以面向开发者的 API，而不是消费者应用，销售可比的底层语音识别能力；这与 Wispr
              直接面向专业用户的买方关系不同，但对任何单一供应商的自研 ASR 主张都构成真实商品化风险。最后，对技术成熟的企业采购方来说，基于开源 OpenAI Whisper
              内部自建仍是可信替代路径，尤其是当它们不愿支付持续按席位 SaaS 费用时；对轻度用户来说，免费的操作系统原生听写始终是现状替代方案。
