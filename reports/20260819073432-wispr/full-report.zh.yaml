        - 确认 Wispr 目前已签署 BAA，并按 HIPAA 时限留存日志
      - - 欧盟 AI Act 高风险系统义务
        - 约束
        - 2026 年全面执行
        - 欧盟企业部署要额外承担文档和人工监督负担
        - 评估 Wispr 是否会将 Flow 归类为该法下的高风险 AI 系统
      - - 企业软件定价转向按用量 / 成果计费
        - 约束
        - 到 2026 年逐步显现
        - 多年维度看，可能挤压 Wispr 按席位计费模式
        - 跟踪 Wispr 是否推出按用量计费档位
      - - 免费 OS 原生听写（Apple/Google/Microsoft）压低付费意愿上限
        - 约束
        - 持续中
        - 限制个人 / 专业消费者用户愿意为独立听写应用支付的价格
        - 持续跟踪 Wispr 免费到付费转化率
      - - Wispr 自身 SOC 2 Type II 失效与重新审计（2026 年 3–4 月）
        - 约束
