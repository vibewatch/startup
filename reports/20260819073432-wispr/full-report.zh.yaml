              - CV002
          - type: callout
            title: 风险评级为中到高，因为未解决问题叠加
            body: 尚未恢复的 SOC 2 Type II 缺口、活跃全行业 BIPA/EU AI Act 监管先例风险，以及两位创始人关键人依赖叠加，使风险高于单看强增长率叙事会得到的水平。
            calloutType: risk
            claimRefs:
              - CV033
              - CV019
          - type: callout
            title: 可比公司方法继承私募市场定价不确定性
            body: >-
              没有上市的纯垂直语音 AI 听写公司；所有可比公司（ElevenLabs、Otter、Granola、Deepgram、Fireflies）本身也都通过 VC 轮次获得私募估值，因此交叉参照它们并不能完全解决
              Wispr 的估值支撑问题。
