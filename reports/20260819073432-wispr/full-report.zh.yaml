  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              2026 年，任何处理语音数据的公司面对的最活跃监管/法律风险集群，是伊利诺伊州的 Biometric Information Privacy Act（BIPA）：2026 年 5 月，芝加哥联邦法院出现 9
              起针对 Google、Amazon、Apple、Microsoft 等公司的集体诉讼，指控它们未经授权使用语音录音训练 AI 模型；Walmart 又在 2026 年 7 月因 AI
              电话系统采集声纹被单独起诉。这说明，BIPA 诉讼风险已经超出 AI 训练用例，进入 Wispr 所运营这类普通商业语音处理部署。本次审阅没有来源显示，截至运行日期 Wispr 本身是任何 BIPA
              或同类诉讼的具名被告，因此这仍是行业先例暴露，而不是针对公司的已确认立案主张；2024 年 BIPA 修正案缩窄了按次扫描重复违规损害赔偿，一定程度降低（但没有消除）尾部风险暴露。联邦层面，FTC 的
              Operation AI Comply 执法行动在 2026 年 3 月用现有 Section 5 不公平/欺骗性行为权限，促成了对 Air AI 的 $18 million
              和解。不过，二级来源之间存在真实出入：一份法律分析称，尽管 2025 年 12 月行政令要求 FTC 发布 AI 专项政策声明，截至 2026 年 4 月初 FTC 仍未发布；而其他 2026
              年评论则称该声明已经发布。欧盟方面，语音生物识别系统在 AI Act Annex III 下被列为高风险，但 2026 年 7 月 Digital Omnibus on AI 将全面高风险合规义务推迟到 2027
              年 12 月 2 日，让 Wispr 在面临最高 €35 million 或全球营业额 7% 罚款之前，获得额外时间搭建欧盟合规基础设施。另一个独立风险是，Wispr 的「Flow」产品名与一个 Google
              AI 产品重名；Autodesk 已在 2026 年就该 Google 产品起诉 Google 商标侵权。这是 AI 软件品牌冲突诉讼的进行中先例，本次尽调据此提示 Wispr 自身商标状态风险，而没有来源确认
              Wispr 商标已注册或受到挑战。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
