      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Wispr 的领导权集中在两位联合创始人手里：CEO Tanay Kothari 拥有 Stanford Computer Science 和 AI 背景，是 Forbes 30 Under 30 入选者，并据
              Getlatka 称为 IOI 奖牌得主，此前创办并出售 AI 个性化创业公司 FeatherX；CTO Sahaj Garg 拥有 Stanford 工程背景，曾任光子硬件创业公司 Luminous
              Computing AI 团队负责人。截至运行日，公开报道未显示任一创始人退出 CEO / CTO 职位，因此公司对这两人的关键人依赖仍高，也未披露任一席位的继任人选。mid-2026，领导班子新增 Ariya
              Rastrow；他是 Amazon Alexa 创始团队成员，负责新的 Wispr Interface Labs 研究组。对创始人欠缺的大规模对话式 AI
              生产经验而言，这是有意义的补强。治理层面，最清晰的公开数据点是 Notable Capital 的 Hans Tung 在 November 2025 Series A extension 后以观察员身份加入
              Wispr 董事会；没有来源披露完整董事会名单、独立董事，或 Series B 是否新增董事席位。这里把它视为重大证据缺口，而不是假设已经解决。
