      - number: '4.2'
        title: 成本结构、毛利率与单位经济
        blocks:
          - type: paragraph
            body: >-
              Wispr 未披露毛利率、COGS 拆分、CAC、回本周期、净留存率或客户集中度——本章专门表格里的每个单位经济字段均为空值，背后只能用行业基准代理，而不是公司特定披露。2026
              年基准研究显示，一旦诚实计入推理和云计算成本，AI 原生 SaaS 产品现实毛利率通常在 40-60%，明显低于经典、非重推理 SaaS 的 75-85% 毛利率常态；单推理通常就会吃掉约 23% 收入。Flow
              的核心功能是连续实时 ASR 加 LLM 文本清理，推理密集，因此 Wispr 真实毛利率最可能落在 AI 原生区间，而非经典 SaaS 区间；但这是推断，不是披露数字。同一基准研究认为，基于约 80%
              毛利率假设的经典 SaaS CAC 回本目标，对 AI 原生产品来说大约宽松了三分之一；这意味着套用到 Wispr 的任何 CAC / LTV 框架都应使用 AI 调整后基准，而不是传统 SaaS
              经验法则。不过，在缺少 Wispr 自身 CAC 或回本数据时，这仍只是方向性提醒，而不是具体数字。在完全没有披露 NRR 或流失的情况下，最佳公开黏性代理是 Wispr 自己的说法：平均用户使用六个月后，在近
              70 个应用中约 72% 字符通过 Flow 输入。这是真实参与度信号，但不能替代留存经济。Wispr 自身 March-April 2026 SOC 2 Type II
              作废与复审事件，也代表真实但未量化的合规修复成本；这正发生在公司试图扩大更高毛利、依赖合规的 Enterprise 档之时。
