  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Wispr 的相关性
    rows:
      - - 企业 / 消费者语音听写软件
        - 面向语音转文字听写应用的按席位 SaaS 授权（Wispr Flow、Otter 听写功能、Dragon）
        - 联络中心 IVR 支出；消费者智能音箱硬件
        - 个人专业人士（Free/Pro）或 IT / 安全（Enterprise）
        - 核心——这是 Wispr Flow 直接销售的细分市场
      - - AI 会议转写 / 会议记录软件
        - 面向有机器人或无机器人会议转写的按席位或按会议授权（Wispr Notetaker、Otter、Fireflies、Granola、Read AI）
        - 视频会议平台本身的费用（Zoom、Teams 授权）
        - 与听写相同的买方，通常打包采购
        - 核心——截至 2026 年 8 月，Wispr 最新产品线
      - - 语音 AI Agent / 对话式 AI（联络中心、IVR）
        - 客服自动化、外呼 Agent
        - 内部生产力听写
        - 联络中心运营 / CX 预算负责人
        - 相邻——买方和工作流不同于 Wispr 核心产品
      - - 语音合成 / TTS 和语音克隆
        - 面向媒体 / 游戏的文本转语音生成、语音克隆
        - 语音转文字转写
        - 媒体 / 创意和开发者预算负责人
        - 相邻——价值主张不同（输出语音，而不是输入转写）
      - - OS 原生听写和开源 ASR
        - 免费、捆绑的听写功能（Apple、Google、Microsoft）和开源 Whisper 部署
        - 付费第三方听写应用
        - 没有独立买方——随 OS / 设备购买捆绑
        - 现状替代品 / 对 Wispr 支付意愿形成竞争天花板
      - - 可穿戴语音输入硬件
        - 支持私密 / 低声听写的智能戒指和可穿戴设备（Oasis Devices）
        - 纯软件听写应用
        - 个人消费者 / Prosumer，有时由 IT 配发
        - 相邻合作渠道，不是 Wispr 直接销售的产品
    notes: 边界线根据市场研究和 Wispr 自有产品页面中的买方 / 工作流差异划定；部分分析师报告把其中几行打包成一个「voice AI」总量，因此引用的市场规模数字差异很大。
