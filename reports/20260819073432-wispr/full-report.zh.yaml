      - number: '4.3'
        title: 公开牵引力 vs. 私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              Wispr 披露最清晰的牵引力代理是使用规模，而不是财务指标：Flow 平台累计听写超过 60 billion 词、被超过 10,000 家企业使用，并在 August 2026 Series B 时进入多数
              Fortune 500 公司。增长方面，公司及其领投方 Menlo Ventures 只披露相对速度——收入连续四个季度增长超过 150%，另在约十四个月内同比增长超过
              30x；考虑复利，两者大体一致，但都不给绝对收入锚。本文研究中唯一找到的绝对收入数字，是 Getlatka 截至 October 2025 的陈旧第三方估计，约 $10 million
              ARR；把公司自称增长率向前推到 August 2026，会得到大约高一个数量级的收入，但这是建立在低可信基数和公司自称速度上的外推，不是已验证数字，也不应读成 Wispr 当前实际
              ARR。真实的使用规模牵引、真实但无锚的增长率主张，以及单一陈旧第三方收入估计，合在一起构成本章识别的核心公开牵引缺口：只靠公开信息，无法为 Wispr $2 billion 估值计算出可防守的当前收入倍数。
