  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与替代品
        blocks:
          - type: paragraph
            body: >-
              Wispr 核心且可直接触达的市场，是企业和消费者语音转文本听写软件——也就是 Flow 今天售卖的细分市场；它嵌在更宽的「语音 AI」类别里，后者还包括联络中心对话式智能体、语音合成 /
              克隆和消费级智能音箱硬件。最清晰的存量替代品，是免费或操作系统内置的听写功能（Apple Dictation / Apple Intelligence、Google Voice Typing with
              Gemini、Microsoft Voice Access / Copilot Voice）以及 OpenAI Whisper 等开源模型；它们共同限制了个人用户愿意为 Wispr Flow
              这类独立应用支付的上限。付费听写细分市场内部已经出现第二层、移动更快的竞争：Willow、Monologue、Aqua 和 Superwhisper 等面向准专业个人用户的低价应用，在 TechCrunch 对
              Wispr 自身 Series B 的报道中被明确点名，是利润率和份额压力来源。Wispr 的 Series B 领投方 Menlo Ventures
              明确把公司野心表述为，从狭窄听写切口延伸到所有生产力软件底层的默认「语音层」；这个市场里，Apple、Google、Microsoft、Anthropic 和 OpenAI
              已经是具备原生语音能力的在位者。新兴硬件相邻机会，例如 Wispr 与可穿戴戒指厂商 Oasis Devices 的合作，位于边界边缘：它把 Flow 的触达延伸到一种新的输入形态，但硬件本身并不是 Wispr
              直接变现的市场。
