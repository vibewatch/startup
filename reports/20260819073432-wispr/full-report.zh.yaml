      - number: '6.3'
        title: 留存、满意度与已记录投诉
        blocks:
          - type: paragraph
            body: >-
              本次研究找到的唯一留存数字，是 The AI Insider 在 2025 年 11-12 月前后报道的 70% 十二个月留存率——相对 2026 年 8 月运行日期，这个数据已经过时；Series B
              之后也没有披露当前净/总收入留存或流失率。在缺少留存经济性数据的情况下，Wispr 自己的媒体资料包给出一个参与度代理：用户使用 6 个月后，平均大约 72% 的字符通过 Flow
              输入。这是真实的粘性信号，但不能替代留存经济性。独立评论证据并非一边倒正面，而是真正混合：DroidCrunch 两周上手测试给 Flow 4.2/5；JustUseApp 汇总 20 条评论后平均
              4.8/5——但 JustUseApp 自己给该应用 的自动安全/合法性分数却是矛盾的
              0/100，说明自动信任评分和直接用户评论均值可以把同一个产品描述得很不一样。独立评论中反复出现的具体投诉，是在嘈杂环境或使用 AirPods
              做长篇听写时丢失转写；一名评测者称它在「平静、安静的环境」表现良好，但在「多数日常场景」会失灵。另外，通过 Apple ID 注册的用户报告取消订阅有摩擦，因为订阅没有出现在标准 Apple
              订阅列表中。Wispr 确实记录了一套结构化的应用内支持流程（Report an Issue、Billing/Account Management
              升级）来处理这些投诉，说明公司有公开工作流，尽管投诉本身仍出现在独立评论内容里。
