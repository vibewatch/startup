      - number: '2.2'
        title: 市场规模：多重冲突视角
        blocks:
          - type: paragraph
            body: >-
              Wispr 可服务市场没有单一权威 TAM 数字。公开分析师对可能相关类别的估计，大致从 $9 billion 到超过 $60 billion，完全取决于边界画在哪里：Grand View Research
              更宽的「语音与语音识别」类别（2024 年 $23.7B，到 2030 年 $53.7B，14.6% CAGR）和 AssemblyAI 重叠类别（2025 年 $18.4B，到 2031 年
              $61.7B，22.4% CAGR），显著高于 The Business Research Company 更窄的「云听写解决方案」子细分（2025 年 $9.7B，到 2030 年 $20.8B，16.4%
              CAGR）；后者又与 The Insight Partners 对看似相同子细分的估计（2025 年 $8.42B，到 2034 年 $23.47B，12.06% CAGR）冲突。Market.us 更窄的「语音
              AI 智能体」数字（2024 年 $2.4B，到 2034 年 $47.5B，34.8% CAGR）说明，即便公开 CAGR
              最高，对应的也是最小基数之一；真正拉开头条数字差距的，不只是增长乐观度，更是边界定义。本次审阅没有任何来源在这些边界内给出 Wispr 的具体市场份额，因此本章保留一个示例性 TAM / SAM / SOM
              演算（约 $150B 示例 TAM、$30B 示例 SAM、领先厂商以 2% SAM 捕获率对应 $600M 示例 SOM），而不是把它写成 Wispr
