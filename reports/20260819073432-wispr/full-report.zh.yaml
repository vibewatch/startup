      - number: '1.3'
        title: 融资历史、估值与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Wispr 已披露融资从约 $14.6 million 种子 / 加速器资本（2022-2024）开始，经 June 2025 约 $30 million Series A、November 2025 由
              Notable Capital 领投的 $25 million Series A extension（Steven Bartlett 的 Flight Fund 参与，投后估值约 $700 million），到
              August 17, 2026 完成的头条 $280 million Series B，Menlo Ventures 领投，估值 $2 billion。TechCrunch 和 Yahoo Finance /
              AFP 都报道 Series B 后累计融资为 $361 million，但第三方追踪器并不一致：Getlatka 的追踪器另记一笔 $260 million Series B 和 $315 million
              累计总额；QuantLogix 记录的 mid-2025 Series A 为 $53.17 million、累计 $79.44 million，也不同于 The AI Insider 同期报道的 $81
              million。这些差异更可能来自独立聚合器的时间点和分类口径差异，而不是某个单一权威错误；但它们尚未与一份主要文件对齐。新的 Series B 投资者包括 Acrew Capital、Forerunner
              Ventures、Goodwater Capital、Peak XV Partners、Together Fund、PLUS Capital 和 Activate；老股东 Menlo
              Ventures、NEA、Neo Ventures、8VC、Notable Capital 和 MVP Ventures 继续跟投。Menlo Ventures 合伙人 Matt Kraning 和 Venky
              Ganesan 主导本轮，投资逻辑围绕「下一个消失的不只是键盘，而是文本框」。Peak XV Partners 和 Activate 在 2026 早些时候报道中曾被称为正洽谈分别投资约 $15 million
              和 $3-5 million；两者均已确认参与已完成轮次，这有助于验证交割前报道的准确性。包括 Joe Burrow、Shaun White、Klay Thompson、Paul George 和
              Domantas Sabonis 在内的一批职业运动员也持有公司股权；这些更可能是带营销价值的头寸，而不是与治理相关的持股。
