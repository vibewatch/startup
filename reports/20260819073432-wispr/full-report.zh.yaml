  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与收入结构
        blocks:
          - type: paragraph
            body: >-
              按公开来源可见范围，Wispr 主要且唯一已变现的收入流，是 Flow 听写产品带来的按席位循环 SaaS 订阅收入；它覆盖 Free 档、自助 Pro 档（标价 $12-15 per user per
              month），以及叠加 SSO、SCIM、审计日志和专属支持的定制定价 Enterprise 档。截至报告日，Wispr 新推出的 Notetaker 会议转写产品被打包进现有 Free 和 Pro
              档，不额外收费；它当前更像留存和竞争差异化功能，而不是新增收入线。这一策略用近期变现换取更强产品黏性，以对抗 Otter.ai、Granola 和 Fireflies。没有被审阅来源披露 Wispr
              折扣后的实际平均每用户收入、个人 / Pro 与 Enterprise 合同之间的收入拆分，或收入确认政策细节；所有可用定价都是来自公司自有文档或第三方价格评论博客的标价，不是实际、混合或经审计收入。Wispr
              的专门垂直行业话术（Flow for Lawyers、已为 HIPAA 做好准备，以及围绕 SOC 2 的合规叙事）显示，公司有意在广泛自助个人基础之外，加重高价值受监管垂直行业 Enterprise
              合同；但两种动作之间的真实收入拆分未披露。
