      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              被审阅市场研究中反复出现三类增长驱动因素：远程 / 混合办公继续常态化，临床和法律文档负担结构性上升，以及 ASR 准确率持续改善。Wispr 自己的 Canto
              模型正好提供了例子：公司称其把嘈杂环境词错误率从超过 30% 降到 5-10%，因此这是真正的采用驱动因素，而不是装饰性功能更新。约束侧，监管是主线：一旦说话人可识别，GDPR
              将语音录音归入特殊类别生物识别数据，要求明确同意和合法跨境传输机制；HIPAA 要求任何接触受保护健康信息的供应商签署 Business Associate
              Agreement、加密、基于角色的访问和六年审计日志留存；EU AI Act 在 2026 年全面执行，又给高风险 AI 语音系统新增风险管理和人工监督义务。Wispr 自身 March-April 2026
              SOC 2 Type II 作废与复审事件，是这个更大主题的公司特定实例：合规状态不是一次性打勾，而是持续运营要求，且有时会倒退；今天评估 Wispr
              的企业应确认其当前复审状态，而不是依赖历史认证。第二个移动较慢的约束，是企业软件在 2026 年向按用量 / 按结果定价迁移的大趋势；它尚未取代听写专用工具的按席位定价，但可能在多年周期内压迫 Wispr 的
              Pro / Enterprise 按席位模型。同时，企业在第一轮预算中通常会把 AI 工具上线、集成和合规开销低估 30-50%，这一点会放大压力。
