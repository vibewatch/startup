      - number: '5.4'
        title: 信任、安全、信息安全与合规
        blocks:
          - type: paragraph
            body: >-
              Wispr 自己的安全与合规 FAQ 写明，其面向法律、医疗等受监管企业买家的核心认证目标包括 HIPAA-ready 控制（支持 Business Associate Agreement）、SOC 2
              合规计划，以及推进 ISO 27001。不过，这套信任叙事带着一个重大且近期的污点：2026 年 3 月，Wispr 的 SOC 2 Type II 审验因审计方诚信问题被主动作废；截至运行日期，公司只在
              2026 年 4 月从 A-LIGN 重新取得保证级别较低的 SOC 2 Type I 审验，Type II 和 ISO 27001 复审仍在进行。这意味着，尽管 Wispr
              在营销中突出该认证，它目前无法向潜在企业买家出示有效且当前的 SOC 2 Type II 审验。这一合规缺口之前还发生过另一起独立的 2025-2026 年数据隐私事件：Flow
              早期版本的情境感知功能在录音之外，周期性截取用户当前活动窗口截图，并在披露不清的情况下把两者传到云端基础设施；公司最初对曝光该问题的用户采取封号处理，直到舆论反弹后才推出零留存的 Privacy
              Mode，并把语音/截图数据用于 AI 训练改成默认 opt-in 而非 opt-out。本次审阅没有发现任何来源披露 Wispr Flow
              的独立安全审计或渗透测试报告；除上述合规审验主张之外，第三方验证过的信息安全状态仍是未解问题，受监管垂直行业的企业买家在依赖 Wispr 自身合规话术前应专门追问。
