  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - BIPA / 声纹生物识别诉讼敞口
        - 声纹生物识别诉讼把 Wispr（或直接竞争对手）列为被告
        - 任何直接点名 Wispr 的已提交诉状
        - 将法律敞口严重性从先例层面重估为已确认事项；要求披露诉讼准备金
      - - SOC 2 Type II 合规中断
        - 有效 SOC 2 Type II 证明重新签发（或继续延迟）
        - 2026 年 3 月失效后 12 个月内未重新签发 Type II
        - 把持续延迟视为更深层的合规体系弱点；将其标记为受监管行业扩张的阻断项
      - - 财务模型不透明
        - 公司通过下一轮融资、并购流程或主动披露给出绝对收入 / ARR 数字
        - 披露数字显著低于从陈旧的约 $10M 基数按 150%+ 季度增长推导出的水平
        - 下调估值倍数和增长质量假设
      - - 关键人物离职
        - 任一联合创始人（CEO 或 CTO）离职或被替换
        - 任何有关 Kothari 或 Garg 离职的公开公告
        - 在没有披露继任计划的情况下，按投资逻辑失效级事件处理
      - - 资本充足性压力
        - 出现招聘冻结、裁员或 down round 迹象
        - 任何关于裁员的公开报道，或后一轮估值持平 / 下调
        - 上调资本充足性和融资依赖风险
      - - 竞争替代
        - 独立基准显示 Wispr 的准确率 / 延迟显著落后于 FreeFlow、OpenWhispr 或获融资竞争对手
        - 可信且方法透明的基准显示 Wispr 在核心指标上落后
        - 上调护城河耐久性风险；重审与技术差异化绑定的估值假设
    notes: 这些触发项是研究人员提出的可监测指标，用于跟踪本报告运行日之后的风险演变；基于已审查证据， 截至 2026 年 8 月 19 日尚未跨过任何阈值。
