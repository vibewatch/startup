  - id: CM002
    statement: Native OS dictation features (Apple Dictation/Apple Intelligence, Google Voice Typing/Gboard with Gemini, Microsoft Voice Access/Copilot Voice) and open-source models (OpenAI Whisper) are free or bundled status-quo substitutes that compete for the same underlying user need as Wispr Flow.
    type: third-party-reported
    topic: market-boundary
    sourceRefs:
    - SM022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM002
  - id: CM003
    statement: 'Menlo Ventures, Wispr''s lead Series B investor, explicitly frames dictation as a narrow wedge into an adjacent, much larger market: replacing the text box as the default human-AI interface across all software, a market that already includes Apple, Google, Microsoft, Anthropic, and OpenAI.'
    type: company-claimed
    topic: market-boundary
    sourceRefs:
    - SM020
    - SM021
    confidence: high
    freshness: current
    answersQuestionRefs:
