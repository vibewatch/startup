  claims:
  - id: CM001
    statement: The market Wispr competes in can be bounded as enterprise and consumer voice-to-text dictation and transcription software, a narrower segment nested inside the broader voice AI category that also includes voice assistants, IVR/contact-center automation, and voice synthesis (TTS/cloning).
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM003
    - SM016
    confidence: medium
    freshness: current
    answersQuestionRefs:
