tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Wispr
  rows:
  - - Enterprise/consumer voice dictation software
    - Per-seat SaaS licenses for speech-to-text dictation apps (Wispr Flow, Otter dictation features, Dragon)
    - Contact-center IVR spend; consumer smart-speaker hardware
    - Individual professional (Free/Pro) or IT/security (Enterprise)
    - Core — this is the segment Wispr Flow directly sells into
  - - AI meeting-transcription / notetaker software
    - Per-seat or per-meeting licenses for bot or bot-free meeting transcription (Wispr Notetaker, Otter, Fireflies, Granola, Read AI)
    - Video-conferencing platform fees themselves (Zoom, Teams licenses)
    - Same buyer as dictation, often bundled
    - Core — Wispr's newest product line as of August 2026
  - - Voice AI agents / conversational AI (contact center, IVR)
    - Customer-service automation, outbound calling agents
    - Internal productivity dictation
    - Contact-center operations / CX budget owner
    - Adjacent — different buyer and workflow than Wispr's core product
  - - Voice synthesis / TTS and voice cloning
    - Text-to-speech generation, voice cloning for media/gaming
    - Speech-to-text transcription
    - Media/creative and developer budget owners
    - Adjacent — different value proposition (output voice, not input transcription)
  - - OS-native dictation and open-source ASR
    - Free, bundled dictation features (Apple, Google, Microsoft) and open-source Whisper deployments
    - Paid third-party dictation apps
    - No distinct buyer — bundled with OS/device purchase
    - Status-quo substitute / competitive ceiling on Wispr's willingness-to-pay
  - - Wearable voice-input hardware
    - Smart rings and wearables enabling private/whisper dictation (Oasis Devices)
    - Software-only dictation apps
    - Individual consumer/prosumer, sometimes IT-provisioned
    - Adjacent partnership channel, not a direct product Wispr sells
  notes: Boundary lines are drawn based on buyer/workflow distinctions described in market research and Wispr's own product pages; some analyst reports bundle several of these rows into one 'voice AI' total, which is why cited market-size figures vary so widely.
