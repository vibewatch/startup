- id: exhibits
  title: Exhibits
  body: 'This chapter preserves several sizing and adoption diligence gaps rather than resolving them with a single confident number: no source reviewed provides a market-share estimate specific to Wispr within any cited market boundary; no source separately quantifies a market for AI meeting-notetaker products distinct from dictation/transcription generally, which matters given Wispr''s new Notetaker line; and the roughly six-fold spread across publisher category-total estimates has not been reconciled against a single bottoms-up methodology. Asia-Pacific''s status as the fastest-growing region for voice AI/dictation adoption is also notable in light of Wispr''s own reported India and UK go-to-market expansion, suggesting a plausible alignment between where the company is investing sales effort and where the broader market is growing fastest, though this is inference rather than a company-disclosed strategic rationale. Readers should treat every dollar figure in the sizing lens table and figures above as a named third-party publisher''s category total, not as an independently audited or Wispr-attributed number.'
