  - id: CE012
    statement: Wispr Notetaker captures meetings via system audio rather than joining as a visible bot/participant, distinguishing its capture mechanism from Zoom/Teams-integration-based competitors and working across any meeting platform, including unplanned or calendar-free conversations.
    type: observed
    topic: product-module-map
