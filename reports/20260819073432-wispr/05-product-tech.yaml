  claims:
  - id: CE001
    statement: In customer workflow terms, Wispr Flow lets a user press a shortcut, speak naturally (including filler words and self-corrections), and have polished, formatted text inserted wherever their cursor is positioned in any application, replacing manual typing for messages, documents, code, and emails.
    type: observed
    topic: product-definition
    sourceRefs:
    - SE001
    - SE017
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
  - id: CE002
    statement: 'Wispr''s product line as of August 2026 comprises three modules: Flow (core cross-app dictation), Notetaker (bot-free meeting transcription, launched Aug 5, 2026), and the Canto speech model (the underlying ASR engine powering both, previewed Aug 17, 2026).'
    type: observed
    topic: product-module-map
    sourceRefs:
    - SE011
    - SE019
    - SE018
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE002
  - id: CE003
    statement: Wispr Interface Labs, led by Ariya Rastrow, is an internal research group (not a shipping product) exploring new human-computer-interaction paradigms beyond the current dictation/transcription product line.
    type: third-party-reported
    topic: product-module-map
    sourceRefs:
    - SE022
    - SE029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
  - id: CE004
    statement: 'Wispr''s architecture follows a client-capture-then-cloud-processing pipeline: local voice-activity detection and encryption on the user''s device, TLS-encrypted streaming to Wispr''s cloud servers, cloud-based ASR transcription, and LLM-based post-processing for formatting, filler-word removal, and style personalization.'
    type: third-party-reported
    topic: architecture
    sourceRefs:
    - SE003
    - SE009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE003
  - id: CE005
    statement: Wispr's own engineering blog states a design target of completing full transcription and LLM formatting within 700 milliseconds of the user finishing speaking, broken into roughly 200ms budgets each for ASR inference, LLM inference, and networking.
    type: company-claimed
    topic: architecture
    sourceRefs:
    - SE003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE004
  - id: CE006
    statement: Wispr's Voice Interface API supports both WebSocket streaming (for lowest-latency real-time use) and REST batch submission, authenticated by API key or per-user token, enabling third-party developers to embed Flow's voice-to-text capability directly into their own applications.
    type: observed
    topic: architecture
    sourceRefs:
    - SE004
    - SE001
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE005
  - id: CE007
    statement: Wispr explicitly markets deep, workflow-specific integrations with developer tools (GitHub, and per third-party coverage Cursor, VS Code, Replit, and Warp CLI) for dictating commit messages, code reviews, issues, and technical documentation with correct handling of camelCase/snake_case syntax and jargon.
    type: company-claimed
    topic: architecture
    sourceRefs:
    - SE002
    - SE010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE005
  - id: CE008
    statement: Wispr's own technical blog describes a correction feedback loop in which the system learns from user edits to avoid repeating the same formatting or word-choice mistake, implying an on-going per-user personalization/fine-tuning mechanism layered on top of the base ASR and LLM models.
    type: company-claimed
    topic: architecture
    sourceRefs:
    - SE003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE006
  - id: CE009
    statement: Canto, Wispr's first proprietary speech-recognition model previewed alongside the August 2026 Series B, is designed to reduce word-error rates in noisy real-world conditions (background noise, wind, music, accents) from over 30% to between 5% and 10%.
    type: company-claimed
    topic: differentiation
    sourceRefs:
    - SE018
    - SE021
    - SE030
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE007
  - id: CE010
    statement: Wispr expects Canto to reduce the share of dictations requiring manual editing by 30% to 35% in everyday use, a company-claimed accuracy-to-usability translation rather than an independently benchmarked figure.
    type: company-claimed
    topic: differentiation
    sourceRefs:
    - SE018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE007
  - id: CE011
    statement: No source reviewed provides an independent, third-party replication of Canto's claimed word-error-rate reduction using a standardized, publicly documented test methodology; all accuracy figures located trace back to company disclosure.
    type: open-question
    topic: differentiation
    sourceRefs: []
    confidence: low
    freshness: current
