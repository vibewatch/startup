- id: trust-safety-security-and-compliance
  title: Trust, Safety, Security, and Compliance
  body: 'Wispr''s own security and compliance FAQ documents HIPAA-ready controls (Business Associate Agreement support), a SOC 2 compliance program, and ISO 27001 pursuit as its core certifications targeted at regulated enterprise buyers in legal and healthcare verticals. That trust posture, however, carries a material and recent blemish: Wispr''s SOC 2 Type II attestation was proactively invalidated in March 2026 over auditor-integrity concerns, and the company has so far only obtained a new, lower-assurance SOC 2 Type I attestation from A-LIGN in April 2026, with Type II and ISO 27001 re-audits still pending as of the run date — meaning Wispr cannot currently present a valid, current SOC 2 Type II attestation to prospective enterprise buyers despite marketing that certification prominently. This compliance lapse follows an earlier, separate 2025-2026 data-privacy incident in which early versions of Flow''s context-awareness feature captured periodic screenshots of the user''s active window alongside audio and transmitted both to cloud infrastructure without clear disclosure; the company''s initial response to the user who exposed this was to ban that user''s account, and only after public backlash did Wispr introduce a zero-retention ''Privacy Mode'' and make AI-training use of voice/screenshot data opt-in by default rather than opt-out. No source reviewed discloses an independent security audit or penetration-test report for Wispr Flow beyond these compliance-attestation claims, leaving third-party-verified security posture — as distinct from compliance-attestation status — an open question that enterprise buyers in regulated verticals should specifically probe before relying on Wispr''s own compliance messaging.'
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  tableRefs:
  - TE004
  figureRefs: []
- id: exhibits
  title: Exhibits
  body: 'This chapter preserves several diligence gaps rather than resolving them with unverified confidence: no independent benchmark exists for Canto''s claimed accuracy improvement or for the MacLife quote reproduced on Wispr''s own API docs; no uptime/SLA commitment, status page, or incident history is disclosed for Wispr''s cloud service; and no independent security audit or penetration test has been published. The moat-durability question — whether Wispr''s combination of Canto accuracy, sub-second latency engineering, and integration breadth is defensible against open-source alternatives like FreeFlow and OpenWhispr that already claim comparable latency — remains only partially resolved and should be revisited with a direct side-by-side comparison. Readers should treat every architecture and dependency detail in this chapter''s figures as synthesized from Wispr''s own technical blog post and independent commentary, since the company does not publicly name its specific cloud infrastructure or LLM providers.'
  claimRefs:
  - CE017
  - CE028
