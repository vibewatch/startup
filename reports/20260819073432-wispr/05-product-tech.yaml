  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow (Status Quo)
  - Company Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Drafting an email or Slack message
    - Type manually, or use OS-native dictation with minimal formatting
    - Speak naturally into Flow; LLM removes filler words and formats per app context
    - Company claims ~4x/220wpm typing-speed multiplier vs. 45wpm manual typing
    - No independent benchmark of the speed multiplier
  - - Drafting legal briefs or case notes
    - Type manually or use legacy dictation software (e.g., Dragon)
    - Flow with personal legal dictionary (e.g., statute names) via Flow for Lawyers
    - Company-claimed time savings for drafting agreements and case notes
    - No disclosed law-firm-specific accuracy benchmark
  - - Capturing a meeting without a visible bot
    - Manual note-taking, or a bot-based tool (Otter, Zoom transcription) joining the call
    - Notetaker captures via system audio; live transcript, AI summary, action items
    - No visible bot; works on any platform including ad hoc/calendar-free conversations
    - Notetaker is new (Aug 2026) with limited independent review depth
  - - Coding / technical documentation by voice
    - Type code and docs manually, or use a generic dictation tool with poor syntax handling
    - Flow's developer-oriented integrations (GitHub, Cursor, VS Code, Replit, Warp CLI) handle camelCase/snake_case and technical jargon
    - Reduces context-switching between keyboard and voice for repetitive documentation tasks
    - No independent developer-productivity study located
  - - Private dictation in public/shared spaces
    - Speak aloud (privacy risk) or avoid dictation entirely
    - Oasis 1 ring's whisper-level microphone paired with Flow
    - Enables dictation without speaking audibly
    - Requires purchasing separate third-party hardware ($289 preorder price per prior research)
  notes: Benefit figures are company-claimed or product-marketing statements unless otherwise noted; no independent, controlled-study benchmark was located for any row.
