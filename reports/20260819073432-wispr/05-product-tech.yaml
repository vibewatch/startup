  - TE002
  figureRefs: []
- id: architecture-and-technical-approach
  title: Architecture, Latency Engineering, and Developer Integration
  body: 'Wispr''s own technical blog describes a client-capture-then-cloud-processing pipeline: local voice-activity detection and encryption on the user''s device, TLS-encrypted real-time streaming to Wispr''s cloud servers, cloud-based ASR transcription via the Canto model, and LLM-based post-processing that removes filler words, applies app-specific formatting style, and personalizes output token-by-token based on a correction feedback loop that learns from user edits over time. The company states an explicit engineering target of completing full transcription and formatting within 700 milliseconds of the user finishing speaking, broken into roughly 200-millisecond budgets each for ASR inference, LLM inference, and networking — and frames this cloud-only design choice as a deliberate trade-off: true real-time performance and frequent personalization-model updates are, in the company''s own assessment, only achievable with cloud servers leveraging high-end GPU/TPU compute rather than on-device processing, which is why Wispr Flow offers no offline or on-device transcription mode on any platform. Third-party developers can embed Flow''s voice capability directly into their own applications via a Voice Interface API supporting both WebSocket streaming (lowest latency) and REST batch submission, and Wispr explicitly markets deep integrations with developer tools — GitHub, and per independent coverage Cursor, VS Code, Replit, and Warp CLI — for dictating commit messages, code reviews, and technical documentation with correct camelCase/snake_case handling. Notetaker adds a separate MCP (Meeting Content Platform) API that exports meeting notes and summaries to external AI agents such as Claude and ChatGPT, extending Wispr''s integration surface beyond its own core dictation product.'
  claimRefs:
  - CE004
