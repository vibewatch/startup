    statement: Wispr partners with hardware maker Oasis Devices, whose Oasis 1 titanium smart ring integrates with Flow via a close-range whisper microphone, enabling private dictation without speaking aloud — a supply/distribution dependency on a third-party hardware partner rather than a Wispr-manufactured product.
