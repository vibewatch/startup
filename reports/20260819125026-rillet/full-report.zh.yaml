  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Rillet
              看起来不像面临银行式牌照风险的业务，但因为它贴近财务控制、上市公司流程和个人数据，法律与合规负担仍然不轻。隐私政策清楚表明，公司在更广服务环境中处理个人和交易信息，客户数据处理则由客户协议约束。这组事实带来典型企业软件法律敞口：隐私、数据处理和合同范围。
              [CR003] [CR004] [CR005] [CR006]


              监管叠加更少是直接牌照问题，更多是预期管理问题。California 隐私规则、客户组织面对的 SEC 网络披露预期，以及更广的 AI 治理规范，都会抬高客户对财务平台的要求。这并不意味着 Rillet
              暴露独特，但意味着公司不能容忍含糊控制或夸大的 AI 主张。这个品类几乎不给合规粗糙留下空间。 [CR007] [CR008] [CR009] [CR030] [CR031]
