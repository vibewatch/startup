            body: >-
              公开记录强烈指向：Rillet
              是一家订阅软件公司，但实际定价机制没有披露。公司销售的是带工作流模块的会计记录系统，不是支付或借贷产品，因此核心收入流应当是经常性软件收入。同时，实施看起来需要较多人工介入，即使公司没有把服务收入单独列出，服务或带服务属性的上线投入也可能有经济影响。
