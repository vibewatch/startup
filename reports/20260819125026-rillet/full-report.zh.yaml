      - number: '1.5'
        title: 战略联盟与尽调保留点
        blocks:
          - type: paragraph
            body: >-
              Rillet 试图借成熟会计机构站台来对冲品类疑虑。2026 年 4 月与 EY 的联盟，明确把产品定位为 AI 原生、实时且天生可审计；Series C 材料称，公司是 Accounting Today 前
              20 大 CPA 事务所中超过半数的官方合作伙伴。Series B 还点名 Armanino 和 Wiss。这个生态重要，因为 Rillet 要求财务买家信任一个年轻、AI
              前置的系统，而会计软件又是最重控制的类别之一。会计事务所背书是实际的信任桥，不只是营销奖杯。 [CO031] [CO032]


              不过，本章最大的谨慎点在于，许多看起来最漂亮的运营指标仍由公司提供。实施速度、自动化率、客户数和关账时间改善，主要来自官方发布、营销页面和案例研究。这不等于它们不真实，但意味着投资人应把它们当成尽调线索，而不是已审计事实。5.0
              星 G2 主张和 Forbes Fintech 50 提及等软信号同样如此。因此，公司概况的结论是：创始人与市场匹配、融资背书和可见客户动能很强；但治理透明度和经独立验证的运营规模，只能给到中等把握。
