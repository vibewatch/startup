      - number: '1.6'
        title: 要点展示
        blocks:
          - type: callout
            title: 创始人与市场匹配、融资背书让高层投资逻辑成立
            body: >-
              Rillet 不是又一个 AI 外壳故事。创始人叙事、产品架构语言和融资序列，都指向同一个痛点：现代财务团队仍困在旧式 ERP 工作流里，而这些工作流并不是为实时、AI 辅助的运营而设计。Sequoia、a16z
              和 ICONIQ 先后快速押注这条逻辑，客户背书现在也包括上市公司和 AI 领导者。
            calloutType: strength
            claimRefs:
              - CO009
