chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、推出节奏与产品定位
        blocks:
          - type: paragraph
            body: >-
              Rillet 把自己定位成 AI 原生
              ERP，而不是外挂式自动化层。无论在官网、帮助中心还是产品说明里，公司都把总账说成财务运行内核：关账管理、AR/AP、收入确认和报表都在一个持续更新的系统中流转。卖点不只是记账更快，而是财务团队应当基于实时账簿工作；AI
              在总账内部运行，而不是把数据拷到电子表格和单点工具里。官方产品话术反复使用「零日关账」和「实时」，以此区别于 NetSuite、SAP、Oracle、Workday 等批处理导向的既有厂商。 [CO001]
              [CO003] [CO004] [CO006]


              时间线重要，因为多份来源描述了公司发展的不同节点。Rillet 称自己成立于 2021 年，也称 2024 年走出隐身模式。这个区分解释了不少表面矛盾：公司在大规模营销之前已经存在。到 2026 年 8 月
              Series C 时，Rillet 已经成为 AI 原生会计基础设施里的可见品类领导者；公司营销和媒体报道都围绕同一个观点展开：旧式 ERP 软件为 AI 之前的工作流而生，而 Rillet
              想用智能体财务重塑品类。 [CO001] [CO002] [CO005] [CO018]
