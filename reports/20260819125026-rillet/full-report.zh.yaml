              按当前基本面是否已经配得上独角兽估值。因此，财务结论是：如果执行强，业务很可能具备有吸引力的软件经济性；但仅靠公开记录，还不能证明收入质量或利润率质量。审慎投资人应把当前公开财务案例视为足以支持兴趣，但在没有管理层数据室入口前，不足以形成价格确信。
