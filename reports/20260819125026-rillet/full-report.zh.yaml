              - CV037
              - CV018
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV037
              - CV038
              - CV018
              - CV020
      - number: '8.4'
        title: 建议、入场纪律与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开证据的建议是继续研究。这不是说公司质量不够，而是价格需要公开记录没有提供的私有信息。战略格局有吸引力，但入场纪律应当严格；除非私有 ARR、留存和毛利率明确处于顶级水平，否则必须保留安全边际。
              [CV024] [CV025] [CV026] [CV032] [CV033] [CV034]


              因此，最终判断是：Rillet 看起来可能成为定义品类的公司，但只看公开信息，本轮名义估值仍可能太满，无法直接形成投资确信。最好的上行触发因素，是证据显示隐藏基本面已经达到世界级；关键下行触发因素，则是安全 /
              控制失效、留存偏弱和客户集中度意外。保持有纪律的观察清单立场，既保留上行空间入口，也不假装公开记录已经完成承销判断。这种立场还把决策锚在可证伪的尽调里程碑上，而不是只看创始人魅力或融资势能。这种纪律很重要。
              [CV021] [CV023] [CV030] [CV031] [CV035] [CV036] [CV040]
            claimRefs:
