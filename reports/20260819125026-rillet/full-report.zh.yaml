        title: 投资逻辑支撑与价格背景
        blocks:
          - type: paragraph
            body: >-
              Rillet 的乐观逻辑很容易理解。公司切入的是一个极大的市场，作为年轻 ERP 厂商却拿出了异常强的客户证明，还在很短时间内吸引了顶级投资人阵容。这些要素支持一种判断：一家定义品类的公司可能正在成形。
              [CV001] [CV002] [CV003] [CV004] [CV005] [CV029]


              更难的问题不是质量，而是价格。公开证据能解释投资人为何兴奋，却无法证明 2026 年 8
              月的价格是否已经吃掉了大部分近期上行空间。原因很简单：名义估值是公开的，但支撑估值的收入、利润率、留存和客户集中度仍是私有信息。即便公司很好，如果入场价从第一天起就假设一切卓越，投资回报也可能平庸。
              [CV006] [CV018] [CV019] [CV020]
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
