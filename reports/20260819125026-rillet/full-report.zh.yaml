            body: >-
              公开信息给出的结论喜忧参半，但方向偏正面。收入质量信号有吸引力，因为客户看起来真实、ROI
              故事具体，公司也有充足的新资本。但核心财务问题仍未回答：ARR、收入、毛利率、烧钱速度、留存和集中度。没有这些，任何承销判断都只能是暂定。 [CI024] [CI025] [CI033] [CI034]
