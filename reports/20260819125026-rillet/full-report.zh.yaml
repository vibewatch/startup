      - number: '1.3'
        title: 融资历程与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Rillet 的融资节奏异常快。公司 2025 年 5 月宣布由 Sequoia 领投的 $25M Series A；仅十周后，又宣布由 Andreessen Horowitz 和 ICONIQ 共同领投的
              $70M Series B；最后在 2026 年 8 月完成 ICONIQ 领投、估值 $1B 的 $100M Series C。即使用最保守的公开记录解读，这也是约十五个月内三轮大额融资，披露融资超过
              $200M。这个速度说明，投资人看待 Rillet 时，不是把它当普通 ERP 替换供应商，而是当作定义品类的 AI 基础设施押注。 [CO013] [CO014] [CO016] [CO017] [CO018]


              股权结构重要，因为它混合了顶级软件投资人和越来越偏成长阶段的资本。Sequoia 领投 Series A；a16z 和 ICONIQ 在 Series B 进入；Series C 又扩展到 Sequoia
              Global Equities、Bain Capital Ventures、Battery Ventures、FirstMark、Scale Venture Partners、Creandum 和 Oak
              HC/FT。Crunchbase 还报道过未经确认的约 $500M Series B
              估值；若大致准确，就意味着公司约一年内再次翻倍、进入独角兽状态。公开证据没有展示完整优先股堆叠、内部人持股或任何债务成分，因此后期估值分析仍必须在资本结构数据不完整的情况下推进。 [CO011] [CO013]
              [CO014] [CO015] [CO017]
