        title: 图表
        blocks:
          - type: callout
            title: 这是公司质量之争，但必须先过价格质量这一关
            body: Rillet 在市场、产品和客户证据上站得住。未解的问题是，这些正面因素是否已经远远反映在 $1B 轮估值里。
