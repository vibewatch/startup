companyProfile:
  summary: >-
    Rillet 是 Nicolas Kopp 和 Stelios Modes 创办的 AI 原生会计与 ERP 初创公司。公司销售一套财务记录系统，把实时总账、关账管理、收入确认、AP/AR 工作流和 Aura AI
    放进同一条会计工作流。作为一家年轻 ERP 供应商，Rillet 的公开客户证据异常扎实，标杆客户包括 Mercor、Neuralink、Skild AI、Function
    Health、Temporal、Scribe、Omni、Revv 和 OnlineMedEd。到 2026 年 8 月，Rillet 已完成由 ICONIQ 领投、估值 $1B 的 $100M Series C 轮；在 A/B/C
    轮快速融资后，公开披露融资总额已超过 $200M。
  foundedDate: '2021-01-01'
  founders:
    - name: Nicolas Kopp
      role: 联合创始人兼 CEO
      background: 曾任 N26 美国 CEO，受过财务和会计训练；他用财务可见性滞后来定义 Rillet 要解决的痛点。
      claimRefs:
