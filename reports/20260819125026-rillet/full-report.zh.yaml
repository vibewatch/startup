        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动解释了 AI 原生财务工具为何现在出现。会计 AI 市场增长很快；云 ERP 已经占主导；电子支付已成常态；单是 AP 自动化类别就是数十亿美元级市场。与此同时，Controller
              团队仍把太多时间花在对账、关账以及跨工具切换上下文上。只要供应商能守住可审计性，工作流自动化就有清晰的 ROI 路径。 [CM011] [CM020] [CM021] [CM023] [CM024]


              约束同样真实。智能体 AI 仍充满炒作，Gartner 预计到 2027 年会有 40% 以上项目被取消。既有厂商正在嵌入自己的 AI，这可能压缩 AI
              原生供应商今天享有的架构优势。而且这个品类仍以财务为先：运营复杂度很深的产品型公司，可能仍需要 DOSS 这样的运营平台或传统套件。强痛点和真实执行风险并存，正是市场有吸引力但尚未决出赢家的原因。 [CM024]
              [CM029] [CM031] [CM035] [CM036]
