  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              理解 Rillet，最好把它看成一套财务记录系统：AI 原生工作流自动化嵌在会计核心里。公开展示的产品范围覆盖总账、关账管理、收入确认、AP、AR、报表和 Aura
              AI。这个范围明显宽于单点关账工具，但仍窄于完整运营 ERP。工作流叙事很关键，因为公司卖给的是 Controller 和会计团队；他们想要实时账簿、更快关账和更干净的审计轨迹，而不是通用自动化工具包。
              [CE001] [CE002] [CE003] [CE005] [CE008] [CE009]


              模块组合也解释了路线图逻辑。Rillet 从总账向相邻财务工作流外扩，而不是从库存或制造等运营模块起步。这让产品围绕会计事实保持一致，但也意味着需要深度运营 ERP
              的买家仍在其可见范围之外。实际结论是，产品强项来自聚焦：公司想先把财务工作流做到异常好，再去其他地方变宽。 [CE002] [CE008] [CE009] [CE031]
