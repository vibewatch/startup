              客户风险和人员风险也交织在一起。集中度、留存和渠道依赖没有公开披露，尽管少数标杆客户在叙事中占很大比重。与此同时，创始人可信度、快速发版和高触达支持，都指向关键人和规模化风险：驱动早期成功的品质，如果组织不能变宽，后期可能变成瓶颈。
