      - number: '3.3'
        title: 既有厂商仍保有权力的地方
        blocks:
          - type: paragraph
            body: >-
              既有厂商仍在宽度、生态和采购安全感上占优。Oracle、SAP 和 Workday 不只是软件产品；它们是长期存在的企业运行系统，拥有全球集成商网络、审计熟悉度和 CIO 认可的购买路径。NetSuite
              尤其重要，因为它更接近 Rillet 的财务 ERP 使用场景，同时仍受益于成熟度、宽度和品牌信任。 [CP003] [CP004] [CP007] [CP008] [CP022]


              分发优势又被切换成本放大。财务领导者不会轻易更换总账：他们必须保留历史账簿、审批、关账控制、税务逻辑和下游报表。因此，如果 Rillet
              的快速实施主张属实，它在战略上很有力量；但这不会抹去大型买家面对成熟供应商时的结构性安心感。大型企业还会在内部政策上偏向采购历史更长、全球服务能力更强、已有安全审批的供应商。 [CP019] [CP020]
              [CP022] [CP026]
