      - number: '1.4'
        title: 规模、客户组合与合作伙伴牵引
        blocks:
          - type: paragraph
            body: >-
              客户牵引是文件里最强的信号之一，不过主要仍由公司披露。Series A 新闻稿称客户接近 200 家，Series B 称超过 200 家，之后的关于页面称 500+，Series C 和 Fortune
              访谈又把当前数字提高到超过 600 家。这些快照与一家快速扩张的企业软件公司内部一致，尽管公开记录没有定义「客户」究竟是付费账户、上线部署，还是已签约客户标识。 [CO019] [CO020] [CO021]
              [CO034]


              名单质量比绝对数量更有说明力。Fortune 确认 Neuralink、Skild AI 和 Mercor 是客户；官方 Series C 材料提到 Mercor、Function Health 和
              Temporal；公司案例研究还展示 Scribe 等客户用 Rillet 准备 IPO、处理复杂收入确认并加快关账。Mercor 是最突出的证明点：Rillet 称其智能体支撑了一个 ARR 超过
              $2B、财务团队仅三人的业务。科技之外，Fortune 引述 Kopp 称，目前约 40% 客户来自生物科技、医疗健康、物流、专业服务等非科技行业。这个扩展重要，因为它说明 Rillet 已经在检验：以 SaaS
              为中心的切入口，能否推广到更广的财务平台市场。 [CO022] [CO023] [CO024] [CO025] [CO026] [CO027] [CO028] [CO029] [CO030]
