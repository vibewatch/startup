      - number: '8.2'
        title: 倍数背景与乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              判断当前价格，一个简单办法是倒推：ARR 要到什么水平，$1B 才显得合理。如果 ARR 只有 $25M，价格约等于 40x ARR，极其昂贵。ARR 到 $50M，倍数降到约 20x；到 $75M ARR，约
              13.3x。公开软件可比公司的倍数跨度很大，但这些隐含水平仍要求投资人相信公司增长极强、收入质量也很高。 [CV008] [CV009] [CV010]


              因此，情景框架很关键。乐观情景需要隐藏 ARR 很高、留存异常强，并且有可信的利润率路径。基准情景假设私有指标扎实但不惊艳，因此本轮价格显得偏满。悲观情景假设 ARR
              较低或续约韧性较弱，价格就会显得激进。换句话说，公司完全可能很优秀，但价格仍可能只是合理而已。 [CV011] [CV012] [CV013] [CV021] [CV022] [CV023]
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
