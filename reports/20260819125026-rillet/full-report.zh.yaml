              - CO013
              - CO014
              - CO016
              - CO027
          - type: callout
            title: 公开证据最强在叙事，最弱在硬运营披露
            body: >-
              Rillet
              发布了大量有用的方向性证据，但许多最关键的承销输入仍由管理层提供：客户数、实施速度、自动化率，以及财务团队能否在规模化后保持精简。治理细节、准确总部和经验证员工数也仍不完整。这些缺口不会否定公司故事，但在没有直接尽调入口时，会实质性压低确信度。
