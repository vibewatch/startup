  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接、既有、邻近与替代路径
        blocks:
          - type: paragraph
            body: >-
              Rillet 周围的竞争场比普通初创同业清单更宽。直接竞争者包括其他现代财务 ERP 和 AI 会计新创。既有厂商包括 NetSuite、Sage Intacct、Oracle、SAP 和
              Workday。邻近玩家包括 DOSS 等运营优先 ERP，以及不替换总账、只自动化部分关账环节的工作流工具。买家也可以继续用电子表格和覆盖层工具，或保留当前 ERP、在周围搭建 AI
              和数据自动化。因此，正确的分析框架是「解决财务记录系统这项工作的各种方式」，而不只是「其他 AI ERP 初创」。 [CP001] [CP002] [CP004] [CP005] [CP024] [CP025]


              Rillet 自己也把格局中最具体的部分说得很明白：公开对比页面反复瞄准 QuickBooks、NetSuite 和 Sage
              Intacct。这个定位说明，其最常见的实际销售动作，是在成长型公司内部替换财务系统，而不是在全球制造业里正面替代 SAP。 [CP002] [CP004] [CP006] [CP028]
