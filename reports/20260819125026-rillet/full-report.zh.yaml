      - number: '6.3'
        title: 买家、支持与扩张动态
        blocks:
          - type: paragraph
            body: >-
              可见买家是财务领导者，通常是正在替换脆弱系统栈的 Controller 或 CFO。用户是会计团队，价值主张不只是自动化，而是把他们从手工关账和对账工作中解放出来。多个客户故事也显示，Rillet
              通常与更广的现代财务栈共存——Stripe、Ramp、Rippling、Salesforce 和 Snowflake——这说明公司先赢的是会计核心，而不是第一天就拿下所有相邻工作流。 [CU012]
              [CU013] [CU014] [CU033]


              支持和响应速度反复出现在客户故事中。OnlineMedEd 描述了专属 Slack 支持和快速响应。Omni
              称功能请求在数周内交付。这些轶事显示一种高触达部署模式：它可以提升早期留存和扩张，但不能替代真实队列指标。公开证据也暗示客户在初始 ERP
              切换后继续叠加更多模块，呈现先落地再扩张。因此，上线后的早期体验可能对长期扩张价值格外重要。 [CU024] [CU025] [CU027] [CU028] [CU029]
