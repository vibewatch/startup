              - CV026
      - number: '8.3'
        title: 上市可比公司的参照价值与局限
        blocks:
          - type: paragraph
            body: >-
              上市公司可比样本只适合作为背景。Oracle、Workday、Intuit、SAP、Salesforce、Adobe 和 ServiceNow
              说明，绑定核心业务流程的企业软件品类可以支撑很大的企业价值。它们的大致市值 / 收入倍数区间，从高 3x 到约 9x，较快增长的高溢价软件公司落在区间上沿。 [CV011] [CV012] [CV013]
              [CV014] [CV015] [CV016] [CV017]


              但不能滥用这些可比公司。它们是收入已知、披露成熟、业务分散度远高的上市公司。它们说明的是优秀软件经济模型可以支撑什么，而不是 Rillet 今天具体该值多少。关键推论很简单：如果隐藏基本面足够强，$1B
              估值可以站得住；但公开记录无法证明门槛已经跨过。正因为有这种不确定性，可比公司更适合约束纪律，而不是直接结束估值争论。至少目前，可比公司只是护栏，不是决策引擎。 [CV018] [CV020] [CV026]
              [CV027] [CV028]
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV037
              - CV038
