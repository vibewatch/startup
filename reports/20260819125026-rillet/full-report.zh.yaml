          - type: callout
            title: 手工工作痛点真实，但 AI 财务采用不是通行证
            body: Rillet 最强的市场驱动，是财务团队仍有太多关账工作靠手工完成。最强的市场风险，是许多智能体 AI 项目失败，因为买家无法充分信任、集成或治理它们。结果是一个紧迫感清晰、怀疑也同样清晰的市场。
