      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上最重要的风险不是泛泛的可用性，而是自动化下的会计正确性。Rillet 要求财务团队允许智能体和工作流在总账内部运行。如果跑通，这是重大优势；如果因为映射错误、审批薄弱或 AI
              越界而失败，信任损害可能很严重。审批、权限和审计轨迹等公开缓释措施是真实正面因素，但它们不能替代关于错误率或事故历史的独立证据。 [CR001] [CR002] [CR010] [CR011] [CR014]


              公开记录在可靠性上也比控制更薄。没有留存的状态页历史或 SLA 披露，也没有 AI
              层准确率或延迟的基准视图。对于卖进审计敏感工作流的财务平台，这个缺口几乎和功能深度一样重要。它也让人更难区分普通初创公司的不透明，和真正抬高的运营风险画像。 [CR013] [CR014] [CR032]
