            body: >-
              客户章节最大的弱点是持久性证据。公开材料没有披露 NRR、GRR、客户流失、续约率、合同期限或队列行为，也没有量化最大客户占多少
              ARR，或会计事务所伙伴贡献多少销售管线。这意味着当前记录证明客户存在，且其中一些很积极；但还不能证明收入基础有多粘、多分散。 [CU030] [CU031] [CU034] [CU037]


              证据质量也有问题。最强结果来自 Rillet
              自写的案例研究，而不是独立评论或客户主导的会议分享。没有留存的公开投诉证据是积极信号，但不能一锤定音。因此，投资人应把客户故事看成有前景且越来越具体，但仍需要直接客户访谈和队列级验证。换句话说，客户背书质量足以支持信念，但还不足以替代续约数据。
