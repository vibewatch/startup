  foundingLocation: United States
  headquarters: New York, New York, USA
  productSummary: Rillet 销售 AI 原生会计基础设施。平台把源系统数据接入实时总账，在上下文里跑关账和收入流程，并用带审批闸门的 AI 智能体帮助财务团队自动化会计工作，同时守住控制和可审计性。
  customerFocus: 面向高增长、多实体、财务复杂度高的公司里的 Controller、会计负责人和 CFO；这些团队通常已经超出 QuickBooks 能力边界，对旧式财务 ERP 感到不满，或需要更快的关账、收入确认和审计工作流。
