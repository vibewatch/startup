        title: 分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              公开客户故事最强在增长，最弱在分母细节。Rillet 从 Series A 时接近 200 家客户，增长到 Series B 时超过 200 家，再到后续公司页面上的 500+，并在 Series C 时超过
              600 家。这条进展与更广的融资叙事方向一致，也支持 2025-2026 年采用显著加速的说法。 [CU001] [CU002] [CU003] [CU004] [CU005]


              可见客户组合也重要。Fortune 称，约 40% 客户基础目前位于科技和 AI 之外；官方材料除早期 SaaS / AI
              核心外，也提到生物科技、医疗健康、金融科技、物流和专业服务。即便如此，最好的公开证明仍集中在高增长、财务复杂度高的公司，而非传统大型企业。因此，公开客户集看起来正在变宽，但仍未完全多元化。 [CU010]
