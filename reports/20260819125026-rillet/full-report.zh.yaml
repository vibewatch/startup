      - number: '3.4'
        title: 持久性、商品化与风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的反向证据不是 Rillet 没有品类，而是公司完全成熟之前，品类可能已经拥挤。独立评论已经指出，相比更成熟替代方案，Rillet 的生态深度和更广集成能力较弱，尤其在 SaaS
              之外的工作流中。公开来源也还没有展示出 Oracle、SAP 或 Workday 在大型竞争交易中能够引用的全球企业客户深度。 [CP021] [CP029] [CP033]


              更长期的风险是商品化。如果既有厂商把自己的 AI 层做得足够好用，市场可能更看重可信的装机基础工作流，而不是架构纯度。在这种情境下，Rillet
              的护城河必须来自执行深度：更好的工作流数据、更好的智能体监督，以及在旧式技术栈里难以复制的更快财务结果。这是可能的，但公开记录还不能证明。投资人因此应把护城河主张视为取决于持续产品交付和可重复竞争胜利，而不是已由品类话术盖棺定论。
              [CP030] [CP034] [CP035]
