  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Rillet 销售的不是 Oracle 或 SAP 意义上的「全 ERP」。公开材料和独立评论一致认为，公司瞄准的是 ERP
              的财务层：总账、收入确认、AR/AP、关账、合并和报表。库存、仓储、制造和更广的运营工作流不在已记录的产品范围内，这意味着真实市场边界窄于品类营销常引用的总 ERP 数字。这个区分很重要，因为 Rillet
              的真正目标不是「所有 ERP 买家」，而更像是「正在替换以总账为中心工作流的财务团队」。 [CM001] [CM002]


              当前替代方案分成四类：由电子表格主导的关账，QuickBooks 或 Xero 等 SMB 会计工具，NetSuite 和 Sage Intacct 等中端财务
              ERP，以及不替换总账、只自动化部分关账环节的覆盖层工具。这组替代栈重要，因为 Rillet 的采用路径并非纯新增；通常是财务团队撞上旧栈复杂度上限后，作出的升级或替换决定。 [CM026] [CM027]
              [CM028]
