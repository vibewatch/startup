      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清楚的一点，是创始人质量。Nicolas Kopp 的背景结合了财务训练、投行业务，以及担任 N26 美国 CEO 时对旧式财务系统痛点的一线体感。在 Series B 公告中，Kopp 明确把
              Rillet 的起点连到自己的挫败感：即使已有强财务团队，关键经营指标仍要等几周才能看到。ACG Silicon Valley 和 Slush 的公开简介补充了教育和职业细节，与这个故事一致。公司也把
              Stelios Modes 列为联合创始人兼 CTO，并称他是 N26 支付基础设施背后的技术架构师。两人组合更像财务运营者加系统建设者，而不是泛泛的 AI 工具团队。 [CO009] [CO010]
              [CO014]


              治理信息主要通过融资事件露出。Series B 引入 Andreessen Horowitz 的 Alex Rampell 和 ICONIQ 的 Seth Pierrepont 进入董事会，Series C
              又强调 Pierrepont 的董事身份。这意味着股权结构加深后，机构监督正在增强；但公开材料仍远未披露完整董事会名单、独立董事、委员会结构或创始人控制安排。Rillet
              已是独角兽阶段，还销售审计关键基础设施，这个缺口很显眼。公开来源里的地点信号也不一致，San Francisco 和 New York 都出现在公司沟通中，因此总部和运营足迹仍需要更精确的尽调。 [CO011]
              [CO012] [CO016]
