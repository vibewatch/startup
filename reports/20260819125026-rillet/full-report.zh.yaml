      - number: '2.2'
        title: TAM、SAM 与规模测算证据
        blocks:
          - type: paragraph
            body: >-
              自上而下的数字很大但并不一致，谨慎尽调本就该预期如此。The Business Research Company 估计，会计 AI 市场 2025 年为 $6.93B、2026 年为 $10.4B，到 2030
              年增长至 $53.45B。Research and Markets 估计，2024 至 2029 年 ERP 中的 AI 将带来 $13.08B 增量增长。在更广的 ERP 层面，公开汇总给出的 2026
              年市场区间约为 $78B 至 $106B，取决于方法论；云 ERP 已经是默认部署模型。这些数字适合当边界标尺，不适合当精密工具。 [CM003] [CM004] [CM005] [CM006] [CM007]
              [CM008] [CM009] [CM010]


              因此，Rillet 的实际可服务市场（SAM）远小于庞大的 ERP 数字，更可能落在一部分财务团队里：这些团队需要现代收入确认、多实体报表或实时关账自动化，但不想购买完整运营套件。Rillet
              自身在科技之外的牵引，以及中端财务团队中手工应付和关账工作的普遍存在，都说明这个切入口真实存在。但公开记录无法按公司规模、ACV 或区域清晰测算这个切入口，所以本报告保留宽口径 TAM、采用保守 SAM。
