              公开可得的最强财务证据是间接证据。Rillet 称当前服务 600+ 家客户，并且在 Series C 前三个月把新增 ARR 翻倍。客户故事也拼出一条连贯的 ROI
              逻辑：精简财务团队用系统缩短关账时间、自动化收入工作流，并避免增加后台人手。 [CI006] [CI011] [CI013] [CI014]


              这些故事有意义，因为它们暗示产品不是可有可无的软件。Mercor 的 $2B ARR / 三人财务团队案例、Scribe 的 $100M ARR IPO
              路径故事，以及多项关账提速，都支撑了一个足以承载企业级定价的价值叙事。但它们仍是案例研究证明，不是经审计收入证据。真正的洞察是：价值故事在多个客户和用例中都显得扎实，尽管公司尚未披露能从这份价值中捕获多少价格。
