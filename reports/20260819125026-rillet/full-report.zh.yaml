            body: >-
              Rillet 的运营模型与外部系统缠在一起。客户故事提到周边栈里的 Stripe、Rippling、Salesforce 和 Snowflake，GTM
              动作也部分依赖会计事务所信任桥。这些依赖本身都不必然有问题，但每一个都会制造 Rillet 直接控制之外的失败模式。独立评论已经把生态宽度列为弱项，说明依赖风险不只是理论。 [CR015] [CR016]
