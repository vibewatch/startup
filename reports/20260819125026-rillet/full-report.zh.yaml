          detail: 总账、收入确认、应付 / 应收、关账和报表数据模型
        - label: 控制层
          detail: 权限、审批和审计就绪的工作流闸口
        - label: Aura AI 层
          detail: 专门的会计智能体和可解释答案
        - label: 财务输出
          detail: 实时账簿、报表、审计支持和运营答案
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE013
      - CE011
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: standard
    summary: 客户工作流从源数据接入，走向账内自动化、人工审批和实时报表。
    data:
      nodes:
        - id: f1
          label: 连接源系统
          detail: 账单、银行、薪资、CRM 和电子表格数据流入
        - id: f2
          label: 在总账中标准化
          detail: 数据映射到账务结构中
        - id: f3
          label: 运行财务工作流
          detail: 结账、收入确认、AP 和 AR 都基于实时账簿运转
        - id: f4
          label: Aura 起草工作项
          detail: 智能体提出答案、附表或会计任务
        - id: f5
          label: 人工审批
          detail: 财务控制负责人或会计复核重要操作
        - id: f6
          label: 产出交付物
          detail: 报表、对账结果和审计就绪证据保持更新
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    claimRefs:
      - CE006
      - CE005
      - CE011
      - CE013
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 财务工作流跑得通，要靠上游数据保真、总账模型、审批设计和信任控制。
    data:
      nodes:
        - id: d1
          label: 源系统数据质量
        - id: d2
          label: 集成覆盖度
        - id: d3
          label: 总账映射逻辑
        - id: d4
          label: 审批工作流设计
        - id: d5
          label: 权限 / 安全
        - id: d6
          label: Aura AI 行为
        - id: d7
          label: 当前账簿 + 报表
        - id: d8
          label: 审计就绪产出
      edges:
        - from: d1
          to: d3
        - from: d2
          to: d3
        - from: d3
          to: d6
        - from: d4
          to: d6
        - from: d5
          to: d6
        - from: d6
          to: d7
        - from: d4
          to: d8
        - from: d5
          to: d8
        - from: d7
          to: d8
    claimRefs:
      - CE021
      - CE010
      - CE014
      - CE034
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 公开证据显示，核心财务模块比更宽的平台层和生态层更成熟。
    data:
      columns:
        - 当前角色
        - 证据质量
        - 成熟度（1-5）
      rows:
        - label: 总账 + 结账
          values:
            - 核心产品
            - 高，来自多个页面 / 案例
            - '4'
        - label: 收入确认 / AR
          values:
            - 核心周边工作流
            - 中，来自产品 + 案例研究证据
            - '4'
        - label: 应付账款
          values:
            - 扩展中的工作流
            - 中，来自产品页 / 文档
            - '3'
        - label: Aura AI
          values:
            - 差异化层
            - 中，来自公司材料
            - '3'
        - label: API / 开发者接口
          values:
            - 平台扩展层
            - 中，来自文档
            - '3'
        - label: 运营型 ERP 广度
          values:
            - 不在公开可见重点内
            - 强负向证据
            - '1'
    claimRefs:
      - CE002
      - CE011
      - CE018
      - CE031
      - CE032
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: 典型客户旅程从财务痛点开始，随后推进到 ERP 替换，再扩展到更广的会计工作流。
    data:
      items:
        - id: discover
          label: 痛点识别
          actor: 财务控制负责人 / CFO
          description: 财务负责人意识到，现有技术栈撑不住多实体、收入确认或结账需求。
          channels:
            - QuickBooks 吃力
            - NetSuite 挫败感
            - 电子表格痛点
        - id: evaluate
          label: 评估替换方案
          actor: 会计负责人
          description: 客户把 Rillet 与现有财务系统、实施负担放在一起比较。
          channels:
            - 案例研究
            - 对比页
            - 会计事务所信任背书
        - id: deploy
          label: 上线
          actor: 会计团队
          description: 实施目标是快速把历史数据、结账工作流和源系统连接迁到 Rillet。
          channels:
            - 实施团队
            - Slack 支持
            - 集成
        - id: operate
          label: 跑生产结账
          actor: 财务控制负责人和会计
          description: 团队在产品内使用实时账簿、审批、收入确认和报表。
          channels:
            - 结账
            - 收入确认
            - AP/AR
            - 审计支持
        - id: expand
          label: 扩大使用
          actor: 财务部门
          description: 客户增加更多工作流，依赖更快支持，也可能放大客户背书价值。
          channels:
            - 更多模块
            - 合作伙伴渠道
            - 可背书性
    claimRefs:
      - CU012
      - CU039
      - CU029
      - CU027
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开可见的采用路径从财务痛点走向生产部署，再进入扩展或客户背书。
    data:
      nodes:
        - id: n1
          label: 现有技术栈不够用
          detail: QBO、电子表格或 NetSuite 式痛苦实施催生需求
        - id: n2
          label: 评估财务核心系统替换
          detail: 财务控制负责人 / CFO 比较速度、信任度和工作流适配度
        - id: n3
          label: 实施 Rillet
          detail: 历史数据和集成迁入新系统
        - id: n4
          label: 跑完首次结账
          detail: 客户在生产环境验证结账、收入确认和报表
        - id: n5
          label: 扩展模块和用例
          detail: 更多工作流接入平台
        - id: n6
          label: 成为可背书客户
          detail: 具名案例或标杆客户强化 GTM
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CU039
      - CU029
      - CU035
      - CU027
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证明材料在具名工作流结果上最强，在留存数据和独立评价上最弱。
    data:
      columns:
        - 具名具体度
        - 结果清晰度
        - 留存可见度
      rows:
        - label: Mercor / 标杆客户
          values:
            - 高
            - 中
            - 低
        - label: 厂商撰写案例研究
          values:
            - 高
            - 高
            - 低
        - label: 独立媒体提及
          values:
            - 中
            - 中
            - 低
        - label: 公开队列 / 续约数据
          values:
            - 低
            - 低
            - 低
    claimRefs:
      - CU026
      - CU035
      - CU030
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险集中在会计准确性、安全信任和隐藏的收入质量弱点。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
      rows:
        - label: AI / 会计错误风险
          values:
            - 中
            - 高
            - 中等
        - label: 安全 / 隐私事件
          values:
            - 低-中
            - 高
            - 中等
        - label: 客户集中度未知
          values:
            - 中
            - 高
            - 低
        - label: 集成依赖失败
          values:
            - 中
            - 中-高
            - 中等
        - label: 支持体系扩张压力
          values:
            - 中-高
            - 中-高
            - 低-中等
    claimRefs:
      - CR001
      - CR007
      - CR021
      - CR011
      - CR026
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 少数运营故障可能迅速传导到信任、客户、融资和估值。
    data:
      nodes:
        - id: d1
          label: AI / 会计错误
        - id: d2
          label: 安全或隐私事件
        - id: d3
          label: 客户信任流失
        - id: d4
          label: 续约 / 赢单率压力
        - id: d5
          label: 收入质量评级下调
        - id: d6
          label: 融资 / 估值压力
        - id: d7
          label: 声誉风险外溢至审计师 / 合作伙伴
      edges:
        - from: d1
          to: d3
        - from: d2
          to: d3
        - from: d3
          to: d4
        - from: d4
          to: d5
        - from: d5
          to: d6
        - from: d2
          to: d7
        - from: d1
          to: d7
        - from: d7
          to: d4
    claimRefs:
      - CR001
      - CR036
      - CR034
      - CR035
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Rillet 的客户价值链依赖数据源、合作伙伴渠道和买方信任基础设施。
    data:
      nodes:
        - id: p1
          label: Stripe / 账单数据
        - id: p2
          label: Rippling / 薪资数据
        - id: p3
          label: Salesforce / 合同数据
        - id: p4
          label: Snowflake / 分析导出
        - id: p5
          label: 会计事务所伙伴
        - id: p6
          label: Rillet 总账和内控
        - id: p7
          label: 客户财务团队信任
      edges:
        - from: p1
          to: p6
        - from: p2
          to: p6
        - from: p3
          to: p6
        - from: p4
          to: p7
        - from: p5
          to: p7
        - from: p6
          to: p7
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
  - id: FV001
    title: 估值支撑视角
    type: range
    summary: 当前价格已经固定；变量是需要多少隐藏 ARR 来支撑它。
    data:
      items:
        - label: 估值 $1B，ARR $25M
          low: 40
          high: 40
        - label: 估值 $1B，ARR $50M
          low: 20
          high: 20
        - label: 估值 $1B，ARR $75M
          low: 13.3
          high: 13.3
    claimRefs:
      - CV008
      - CV009
      - CV010
  - id: FV002
    title: 情景回报图
    type: matrix
    layout: standard
    summary: 核心争议不是 Rillet 有没有吸引力，而是价格里已经计入了多少隐藏基本面。
    data:
      columns:
        - 增长质量
        - 收入质量
        - 价格吸引力
      rows:
        - label: 乐观情景
          values:
            - 高
            - 高
            - 好
        - label: 基准情景
          values:
            - 高
            - 中
            - 合理 / 偏满
        - label: 悲观情景
          values:
            - 参差
            - 低
            - 差
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV026
  - id: FV003
    title: 可比估值区间
    type: bar
    summary: 公开可比参照给出一个粗略倍数区间；只有 Rillet 的隐藏基本面确实异常强，才有理由突破该区间。
    data:
      items:
        - label: Salesforce
          value: 3.8
        - label: Intuit
          value: 4.6
        - label: Workday
          value: 5.6
        - label: SAP
          value: 5.7
        - label: Oracle
          value: 7.2
        - label: ServiceNow
          value: 9.1
    claimRefs:
      - CV037
      - CV038
      - CV018
      - CV020
