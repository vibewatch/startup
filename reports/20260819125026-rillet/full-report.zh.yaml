        title: 要点展示
        blocks:
          - type: callout
            title: 市场足够大，但真正该问的是 SAM 是否契合，不是演 TAM 大戏
            body: >-
              Rillet 总能指向巨大的 ERP 或会计 AI 市场数字，这些数字在方向上有用。但可投资的问题更窄：有多少支出来自愿意为了实时关账和 AI
              原生工作流而专门替换总账的财务团队？公开记录支持一个有意义的切入口，尤其在 SaaS 和多实体财务场景中；但它还不能支撑一个干净的通用 ERP 故事。
            calloutType: insight
