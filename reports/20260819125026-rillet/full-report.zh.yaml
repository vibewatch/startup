            body: >-
              Rillet 看起来像软件公司，而不是资产负债表密集型金融科技或硬件业务。公开记录中看不到库存、放贷敞口或项目融资负担，这是结构性利好。另一面是，公司的产品承诺——AI
              智能体、可审计性、快速实施和高触达支持——很可能带来不小的支持、合规和算力成本。在当前阶段，这些成本可能尤其重要，因为企业买家仍需要大量信任建设和手把手部署帮助。 [CI015] [CI016] [CI017]
              [CI023] [CI029]


              资本充足性是本章最清晰的正面因素。超过 $200M 的披露融资，包括 $100M Series C，相比买家可能担心的年轻 ERP
              供应商融资风险，显著降低了近期融资压力。投资人仍看不到烧钱速度、现金余额、现金跑道或实施的真实服务负担。没有这些数据，就无法判断新资本相对运营野心是否充足，还是只够支撑下一小段扩张。 [CI007]
