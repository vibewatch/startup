      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家地图比支出地图更清楚。用户通常是负责月末关账的会计团队；功能推动者往往是 Controller 或会计负责人；预算所有者是 CFO 或财务职能；审批层可能包括
              IT、审计师或可信的会计事务所伙伴。这也是实施速度如此重要的原因之一：产品卖给的团队本已超负荷，往往承受不起漫长 ERP 项目。 [CM015] [CM016] [CM025] [CM026] [CM031]


              财务领域的采用数据喜忧参半。正面看，AI 已经足够主流，59% 的财务领导者和 46% 的会计人员正在以某种形式使用它，SMB 采用率也已过半。负面看，66% 的应付团队仍在手工录入发票，73%
              尚未完全自动化，89% 的会计人员希望获得更好的集成。这解释了 Rillet 的价值主张为何有共鸣：痛点真实存在。也解释了品类为何难落地——买家不是只在购买 AI，他们买的是工作流可靠性。 [CM016]
