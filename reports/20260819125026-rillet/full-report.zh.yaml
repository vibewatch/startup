      - number: '5.2'
        title: 架构、工作流与运营模型
        blocks:
          - type: paragraph
            body: >-
              核心架构故事从上游开始。Rillet 从财务系统、计费工具、银行、薪资和其他来源摄取数据，在总账中标准化数据，然后让会计工作流和智能体在上下文里运行。公开文档和产品页面一致把 AI
              层描绘成嵌在会计工作流内部，而不是站在外部。这是公司最重要的技术主张。 [CE004] [CE006] [CE007] [CE010] [CE011]


              运营模型随后形成一个闭环：源系统数据进入
