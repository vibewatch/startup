- calloutType: insight
  title: The product looks deeper than a landing page suggests
  body: Rillet’s combination of product pages, customer stories, API docs, approval-workflow docs, and monthly update posts suggests a real operating product rather than a thin AI wrapper. The product still looks finance-centric, but within that wedge the public surface is relatively mature for a young company.
  claimRefs:
  - CE002
  - CE018
  - CE019
  - CE025
