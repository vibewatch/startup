chapter:
  number: 5
  title: Product & Technology
  summary: Rillet’s public product surface supports the core thesis that it is building an AI-native accounting system of record, not just a close overlay or chatbot. The product appears deepest in ledger-centric workflows—close, rev rec, AP/AR, auditability, and agent-assisted accounting—while operational ERP breadth remains visibly limited. The strongest diligence positives are the coherence of the architecture story, the existence of real docs and release cadence, and the explicit trust controls; the biggest missing pieces are independent performance benchmarks, reliability metrics, and deeper disclosure on the AI stack itself.
sections:
- id: product-definition
  title: Product definition and module map
  body: 'Rillet is best understood as a finance system of record with AI-native workflow automation built into the accounting core. The product scope shown publicly spans the general ledger, close management, revenue recognition, AP, AR, reporting, and Aura AI. That is materially broader than a point close tool, but still narrower than a full operational ERP. The workflow framing matters because the company sells to controllers and accounting teams that want live books, faster closes, and cleaner audit trails rather than a generic automation toolkit. [CE001] [CE002] [CE003] [CE005] [CE008] [CE009]


    The module set also explains the roadmap logic. Rillet is extending outward from the ledger into adjacent finance workflows instead of starting with operational modules such as inventory or manufacturing. That keeps the product coherent around accounting truth, but it also means buyers needing deep operational ERP still sit outside the product’s visible scope. The practical takeaway is that product strength comes from focus: the company is trying to be unusually good at finance workflows before it becomes broad elsewhere. [CE002] [CE008] [CE009] [CE031]'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE005
  - CE008
  - CE009
  - CE031
  tableRefs:
  - TE001
  - TE002
  figureRefs: []
- id: architecture-and-workflow
  title: Architecture, workflow, and operating model
  body: 'The core architecture story starts upstream. Rillet ingests data from finance systems, billing tools, banks, payroll, and other sources; normalizes that data in the ledger; and then lets accounting workflows and agents operate in-context. Public docs and product pages consistently portray the AI layer as embedded inside the accounting workflow rather than standing apart from it. That is the company’s most important technical claim. [CE004] [CE006] [CE007] [CE010] [CE011]


    The operating model is then a loop: source-system data lands in Rillet, finance workflows execute against live books, approval workflows gate material actions, and reports or answers come out with traceable context. That workflow can be compelling if the data ingestion and controls really hold, but it also means the product is highly dependent on integration fidelity and upstream system quality. This architecture is elegant on paper, but it raises the practical bar on connector quality, reconciliation logic, and exception handling. [CE006] [CE010] [CE013] [CE021] [CE028]'
  claimRefs:
  - CE004
  - CE006
  - CE007
  - CE010
  - CE011
  - CE013
  - CE021
  - CE028
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE002
- id: trust-and-compliance
  title: Trust, compliance, and audit posture
  body: 'Trust is central because the product touches the ledger. Public pages stress permissions, human approval, audit trails, and certification posture rather than pure autonomy. Rillet says it holds SOC 1 Type II and SOC 2 Type II certifications, while pre-IPO and audit-readiness material frames the product for more control-sensitive finance teams. This is reinforced by the EY alliance messaging, which is not independent proof of product quality but does indicate that the company is deliberately building trust bridges with established accounting institutions. [CE013] [CE014] [CE015] [CE016] [CE029]


    At the same time, the public record is still lighter on operational reliability than on security posture. There is no detailed public uptime narrative, incident history, or benchmark set for the AI layer. For a workflow that increasingly depends on agents and real-time books, that gap matters. It means buyers can understand the control philosophy, but still cannot easily gauge how the system behaves under load, edge cases, or incident conditions. [CE032] [CE033] [CE038]'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE029
  - CE033
  - CE034
  - CE038
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: maturity-proof-and-roadmap
  title: Maturity, customer proof, and roadmap signal
  body: 'The strongest maturity signal is that public materials move beyond homepage copy. Rillet has customer case studies, product update posts, API documentation, approval-workflow docs, and product-specific pages for AP, AR, close, and audit readiness. That is more evidence of operating product depth than many early AI-software startups expose publicly. [CE018] [CE019] [CE020] [CE022] [CE023] [CE024] [CE025] [CE026]


    The 2026 release cadence also matters. January through July updates emphasize accounting depth, controls, integrations, and AI workflow extensions rather than broad operational-suite expansion. The MCP connector is the clearest signal that the company is experimenting with how agents interact with finance data outside the core UI. Overall, the roadmap appears focused and credible, but still finance-centric. [CE019] [CE020] [CE032] [CE035] [CE036] [CE037]'
