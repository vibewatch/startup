chapter:
  number: 4
  title: Financials
  summary: Public evidence suggests Rillet is building a promising subscription software business with strong customer ROI signals and ample fresh capital, but the financial record remains thin on the numbers that most matter for underwriting. The company does not disclose ARR, revenue, gross margin, burn, runway, retention, or concentration publicly. The Series C meaningfully reduces near-term financing risk, yet the main unresolved question is whether value creation from agentic accounting workflows is translating into durable, high-margin software economics.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: 'The public record strongly suggests that Rillet is a subscription software business, but it does not disclose the actual pricing mechanics. The company sells an accounting system of record with workflow modules, not a payments or lending product, which points toward recurring software revenue as the core stream. At the same time, implementation appears hands-on enough that services or service-like onboarding effort likely matters economically, even if it is not broken out as revenue. [CI001] [CI002] [CI003] [CI004]


    That ambiguity matters because pricing opacity is one of the chapter’s central blockers. There is no public list price, no contract model disclosure, and no realized-ACV benchmark. The product’s emphasis on revenue recognition and enterprise-grade finance workflows suggests a meaningful willingness-to-pay story, but not one investors can quantify from public sources alone. [CI003] [CI004] [CI005]'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-roi-signals
  title: Public traction and ROI signals
  body: 'The strongest financial evidence available publicly is indirect. Rillet says it now serves 600+ customers and doubled new ARR in the three months leading into the Series C. Customer stories also make a coherent ROI case: lean finance teams use the system to reduce close time, automate revenue workflows, and avoid adding back-office headcount. [CI006] [CI011] [CI013] [CI014]


    Those stories are meaningful because they imply that the product is not just nice-to-have software. Mercor’s $2B ARR / three-person-finance-team example, Scribe’s $100M ARR IPO-path story, and several close-speed improvements all reinforce a value narrative strong enough to support enterprise pricing. But they remain case-study proof, not audited revenue evidence. The real insight is that the value story looks robust across several customers and use cases even though the company has not disclosed the exact price capture against that value. [CI011] [CI012] [CI018] [CI019] [CI020] [CI021] [CI022] [CI023]'
  claimRefs:
  - CI006
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: cost-structure-and-capital
  title: Cost structure, capital intensity, and adequacy
  body: 'Rillet looks like a software company rather than a balance-sheet-intensive fintech or hardware business. There is no visible inventory, lending exposure, or project-finance burden in the public record. That is a structural positive. The other side of the equation is that the company’s product promise—AI agents, auditability, rapid implementation, and hands-on support—likely carries meaningful support, compliance, and compute cost. Those costs may be especially important during the current phase, when enterprise buyers still need a lot of trust-building and hands-on deployment help. [CI015] [CI016] [CI017] [CI023] [CI029]


    Capital adequacy is the clearest positive in the chapter. More than $200M of disclosed funding, including the $100M Series C, materially lowers near-term financing pressure relative to what buyers might fear from a young ERP vendor. What investors still cannot see is burn, cash balance, runway, or the true service burden of implementations. Without those, it is impossible to say whether fresh capital is ample relative to operating ambition, or merely enough for a short next leg of scaling. [CI007] [CI008] [CI009] [CI010] [CI022] [CI035]'
  claimRefs:
  - CI015
  - CI017
  - CI016
  - CI021
  - CI023
  - CI008
  - CI007
  - CI009
  - CI022
  - CI035
