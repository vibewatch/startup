callouts:
- calloutType: insight
  title: The public financial story is good enough to show promise, not enough to prove value
  body: 'Rillet looks like a real software business with strong customer ROI and strong fresh capitalization. But the public record stops short of the numbers investors actually need to defend a $1B price: revenue, margin, burn, retention, and concentration.'
  claimRefs:
  - CI006
  - CI008
  - CI010
  - CI036
- calloutType: risk
  title: The gross-margin question is probably the most underrated diligence issue
  body: A young AI-native ERP can win customers and still disappoint financially if implementation effort, support load, and compute cost remain too high. Public case studies help explain value creation, but not value capture.
