  figureRefs:
  - FI003
  - FI004
- id: public-gaps-and-verdict
  title: Public gaps and chapter verdict
  body: 'The public-information verdict is mixed but directionally positive. Revenue-quality signals are promising because customers appear real, ROI stories are concrete, and the company has ample fresh capital. But the central financial questions remain unanswered: ARR, revenue, gross margin, burn, retention, and concentration. Without those, any underwriting view is provisional. [CI024] [CI025] [CI033] [CI034] [CI036]


    Public-company filings and market values for Oracle, Workday, and Intuit are useful context for what great enterprise-software economics can eventually justify. They do not answer whether Rillet already deserves a unicorn valuation on current fundamentals. The financial conclusion is therefore that the business likely has attractive software economics if execution is strong, but the public record alone cannot prove revenue quality or margin quality yet. A prudent investor should therefore treat the current public financial case as supportive of interest, but insufficient for price conviction without management data-room access. [CI026] [CI027] [CI028] [CI030] [CI031] [CI032] [CI037]'
