  topStrengths:
    - 品类时点站得住：财务团队要的是 AI-native 记录系统，而不是外挂式自动化。
    - 作为年轻 ERP 供应商，公开客户证据罕见地具体：既有头部客户名，也有工作流级案例。
    - 产品叙事在营销、文档、安全控制和客户证据之间能对上，不只是靠模糊的 AI 话术撑着。
    - 投资人质量和融资动能显著压低了近期资本充足性风险。
    - 客户从科技和 AI 外溢到其他垂直行业，说明切入口可能正在变宽。
  topRisks:
    - 公开材料仍未披露 ARR、收入、毛利率、烧钱速度、留存和集中度，外部投资人很难支撑 $1B 定价。
    - 会计准确性、安全 / 隐私信任或 AI 治理一旦出错，会很快传导到客户信心和估值。
    - 现有证据仍偏向 AI、SaaS 和现代增长型公司，还不是充分多元化的企业客户底盘。
    - 高接触度实施和支持如果不能标准化，可能挤压利润率或组织扩张能力。
    - 在这个估值上，表现只是「不错」可能不足以带来有吸引力的回报。
  unresolvedGaps:
    - 当前 ARR、GAAP 收入，以及跨季度增长能否持续。
    - 毛利率、支持负担、AI 算力成本，以及烧钱速度 / 现金跑道。
    - 净留存率（NRR）、总留存率（GRR）、客户流失、合同期限和大客户集中度。
    - 优先股堆叠、稀释、内部人持股，以及是否存在结构化融资条款。
    - 状态页历史、经基准测试的 AI / 错误率证据，以及更深入的安全运营披露。
