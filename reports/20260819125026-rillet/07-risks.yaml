- id: operational-and-security
  title: Operational, quality, and security risk
  body: 'Operationally, the most important risk is not generic uptime—it is accounting correctness under automation. Rillet is asking finance teams to let agents and workflows operate inside the ledger. If that works, it is a major advantage. If it fails through bad mappings, weak approvals, or AI overreach, the trust damage could be severe. Public mitigations such as approvals, permissions, and audit trails are real positives, but they do not replace independent evidence on error rates or incident history. [CR001] [CR002] [CR010] [CR011] [CR014]


    The public record is also lighter on reliability than on controls. There is no retained status-page history or SLA disclosure, and no benchmarked view of the AI layer’s accuracy or latency. For a finance platform selling into audit-sensitive workflows, that gap matters almost as much as feature depth. It also makes it harder to distinguish ordinary startup opacity from a genuinely elevated operational risk profile. [CR013] [CR014] [CR032]'
  claimRefs:
