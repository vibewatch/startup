- id: financial-risk-and-kill-criteria
  title: Financial/model risk and kill criteria
  body: 'Financially, the near-term picture is buffered by cash but clouded by missing visibility. The Series C reduces immediate financing pressure, yet the public record still lacks ARR, gross margin, burn, concentration, and renewal detail. That missing visibility is itself a risk because it weakens downside analysis and can hide brittle economics beneath a strong narrative. [CR027] [CR028] [CR029] [CR033]


    The most useful kill criteria are therefore concrete. A material accounting-control failure, a customer-data security breach, a stall in non-tech expansion, or evidence of concentrated churn would each meaningfully change the thesis. The public risk verdict is not that Rillet is unusually dangerous; it is that the company operates in a control-sensitive category where a small number of execution mistakes could transmit quickly into revenue, reputation, and valuation. Investors should therefore monitor not only growth, but also trust indicators that might deteriorate long before revenue fully shows the damage. Even modest warning signs matter. [CR034] [CR035] [CR036] [CR037] [CR038] [CR039] [CR040]'
