chapter:
  number: 7
  title: Risks
  summary: 'Rillet’s biggest risks are concentrated rather than diffuse: accounting correctness under AI-assisted workflows, security/privacy trust, hidden customer-durability weakness, and the challenge of scaling a high-touch operating model in a control-sensitive category. The company’s visible mitigations—approvals, audit trails, privacy disclosures, partner trust, and fresh capital—are real, but they do not fully answer missing questions on incident history, cohort durability, and AI-governance detail. The risk posture is elevated but understandable for a fast-scaling enterprise-software company trying to redefine accounting infrastructure.'
sections:
- id: legal-regulatory
  title: Legal and regulatory risk
  body: 'Rillet does not look like a business that faces bank-style licensing risk, but it does face a meaningful legal and compliance burden because it sits close to financial controls, public-company processes, and personal data. The privacy policy makes clear that the company handles personal and transactional information in its broader service environment and that customer-data processing is governed through customer agreements. That combination creates classic enterprise-software legal exposure around privacy, data processing, and contract scope. [CR003] [CR004] [CR005] [CR006]


    The regulatory overlay is less about direct licensing and more about expectation setting. California privacy rules, SEC cyber-disclosure expectations at customer organizations, and broader AI-governance norms all raise the standard for what customers will expect from a finance platform. That does not mean Rillet is uniquely exposed, but it does mean the company cannot afford vague controls or exaggerated AI claims. The category gives little room for compliance sloppiness. [CR007] [CR008] [CR009] [CR030] [CR031]'
  claimRefs:
