evidenceGaps:
  - id: EGO001
    type: missing-source
    severity: material
    topic: headquarters
    missingEvidence: A definitive corporate profile or filing naming the principal executive office and current headquarters city.
    whyItMatters: Geographic center affects hiring assumptions, diligence logistics, and local-network interpretation.
    diligencePath: Request the latest company profile or corporate filing naming the principal executive office.
    relatedQuestionRefs:
      - QO005
  - id: EGO002
    type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A full board roster, independent directors, and current cap-table summary after the Series C.
    whyItMatters: Governance quality and control rights are central to late-stage underwriting but are not publicly disclosed here.
    diligencePath: Ask management for the board deck, cap-table waterfall, and post-money governance agreements.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - id: EGO003
    type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A verified employee count, office footprint, and current functional split by department.
    whyItMatters: Operating leverage and implementation capacity depend on actual staffing, not website positioning.
    diligencePath: Request HRIS headcount exports or an org chart dated to the Series C close.
    relatedQuestionRefs:
      - QO022
      - QO025
  - id: EGO004
    type: missing-source
    severity: minor
    topic: customer-definition
    missingEvidence: >-
      A precise definition of “customer” and whether reported counts represent paying accounts, live deployments, or
      logos under contract.
    whyItMatters: Customer-count ambiguity affects all per-customer valuation heuristics later in the report.
    diligencePath: Ask management for active-paying-customer, live-customer, and pilot counts separately.
    relatedQuestionRefs:
      - QO013
      - QO024
  - id: EGM001
    type: missing-source
    severity: material
    topic: geography-split
    missingEvidence: >-
      A clean split of the addressable market by US versus international expansion lanes relevant to Rillet’s current
      GTM.
    whyItMatters: Regional differences affect implementation, partner strategy, and competitive intensity.
    diligencePath: Request pipeline mix, customer geography, and target-region prioritization from management.
    relatedQuestionRefs:
      - QM023
  - id: EGM002
    type: private-evidence-only
    severity: material
    topic: software-budget
    missingEvidence: >-
      Bottom-up budget data showing how much controllers and CFOs actually spend on ledger replacement, close software,
      and adjacent finance tooling.
    whyItMatters: Top-down TAM estimates overstate practical spend if buyers only reallocate part of the finance stack.
    diligencePath: Ask management for recent deal sizes, displaced spend, and budget owners across wins.
    relatedQuestionRefs:
      - QM024
  - id: EGM003
    type: private-evidence-only
    severity: material
    topic: sam-model
    missingEvidence: A bottom-up SAM by company size, entity complexity, and vertical fit using Rillet’s actual win profile.
    whyItMatters: The public record shows category breadth but not which subsegments convert at high velocity today.
    diligencePath: Request customer segmentation by ACV, industry, and pre-Rillet system.
    relatedQuestionRefs:
      - QM025
  - id: EGP001
    type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Systematic win/loss data by competitor, ACV band, and pre-Rillet system.
    whyItMatters: Public comparisons show positioning but not actual competitive conversion rates.
    diligencePath: Request the last 12 months of opportunities lost-to / won-against by named competitor.
    relatedQuestionRefs:
      - QP016
      - QP023
  - id: EGP002
    type: private-evidence-only
    severity: material
    topic: pricing-benchmarks
    missingEvidence: Side-by-side live pricing, discounting, services spend, and payback periods for Rillet and incumbent alternatives.
    whyItMatters: Packaging claims are hard to underwrite without real deal data.
    diligencePath: Ask for redacted proposals and services SOWs from recent competitive deals.
    relatedQuestionRefs:
      - QP014
      - QP015
  - id: EGP003
    type: missing-source
    severity: medium
    topic: adjacent-modern-finance-platforms
    missingEvidence: >-
      Richer retained evidence on spend, treasury, and banking adjacents such as Ramp, Brex, or Mercury that sometimes
      shape the broader finance-stack decision.
    whyItMatters: Those vendors are not ledger replacements but can influence bundle economics and workflow ownership.
    diligencePath: Fetch current official product pages for the modern finance-stack adjacents and map overlap precisely.
    relatedQuestionRefs:
      - QP001
      - QP018
  - id: EGI001
    type: private-evidence-only
    severity: critical
    topic: arr-and-revenue
    missingEvidence: ARR, GAAP revenue, net new ARR, and historical growth by quarter.
    whyItMatters: Valuation underwriting is weak without an actual revenue base.
    diligencePath: Request board-ready revenue bridge and trailing 12-month ARR detail.
    relatedQuestionRefs:
      - QI007
      - QI021
  - id: EGI002
    type: private-evidence-only
    severity: critical
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, burn, runway, and implementation-services burden.
    whyItMatters: A software business can still be unattractive if service load or AI cost overwhelms margin.
    diligencePath: Request unit-economics pack and by-customer contribution analysis.
    relatedQuestionRefs:
      - QI009
      - QI011
      - QI023
      - QI024
      - QI025
  - id: EGI003
    type: private-evidence-only
    severity: critical
    topic: revenue-quality
    missingEvidence: NRR, GRR, logo churn, contract length, and top-customer concentration.
    whyItMatters: Strong top-line momentum does not necessarily imply durable software economics.
    diligencePath: Request cohort tables and concentration schedule.
    relatedQuestionRefs:
      - QI015
      - QI021
  - id: EGE001
    type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Public uptime/status disclosures, response SLAs, and incident history.
    whyItMatters: A finance system of record needs reliability evidence beyond general security marketing.
    diligencePath: Request status-page history, uptime commitments, and incident postmortems.
    relatedQuestionRefs:
      - QE021
  - id: EGE002
    type: missing-source
    severity: material
    topic: ai-stack
    missingEvidence: >-
      Specific model providers, cost structure, latency, hallucination controls, and benchmark results for Aura
