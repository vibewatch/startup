    diligencePath: Ask management for API usage, active developers, and partner-built integrations.
    relatedQuestionRefs:
      - QE013
      - QE024
  - id: EGU001
    type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, contract length, and cohort retention by customer segment.
