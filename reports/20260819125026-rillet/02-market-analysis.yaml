callouts:
- calloutType: insight
  title: The market is large enough, but the right analytical question is SAM fit, not TAM theater
  body: 'Rillet can always point to a giant ERP or AI-accounting market number, and those numbers are directionally useful. But the investable question is narrower: how much of that spend belongs to finance teams willing to replace their ledger specifically for real-time close and AI-native workflows? The public record supports a meaningful wedge, especially in SaaS and multi-entity finance, but not a clean universal ERP story yet.'
  claimRefs:
  - CM001
  - CM004
  - CM008
  - CM033
- calloutType: risk
  title: Manual-work pain is real, but AI-finance adoption is not a free pass
  body: The strongest market driver for Rillet is that finance teams still run too much of close manually. The strongest market risk is that many agentic-AI projects fail because buyers cannot trust, integrate, or govern them well enough. The result is a market with visible urgency and equally visible skepticism.
  claimRefs:
  - CM020
  - CM021
  - CM025
  - CM037
