- id: sizing-lenses
  title: TAM, SAM, and sizing-lens evidence
  body: 'The top-down numbers are large but inconsistent, which is exactly what careful diligence should expect. The Business Research Company sizes AI in accounting at $6.93B in 2025 and $10.4B in 2026, growing to $53.45B by 2030. Research and Markets estimates $13.08B of incremental growth in AI-in-ERP from 2024 to 2029. At the broader ERP layer, public roundups cite a 2026 market range from roughly $78B to $106B depending on methodology, with cloud ERP already the default deployment model. These figures are useful as boundary markers, not precision tools. [CM003] [CM004] [CM005] [CM006] [CM007] [CM008] [CM009] [CM010]


    The practical SAM for Rillet is therefore much smaller than the big ERP number and probably sits in the subset of finance teams that need modern rev rec, multi-entity reporting, or real-time close automation without wanting a full operational suite. Rillet’s own traction outside tech, plus the prevalence of manual AP and close work across mid-market finance teams, suggests there is a real wedge. But the public record does not let us size that wedge cleanly by company size, ACV, or region, which is why the report keeps the TAM broad and the SAM conservative. [CM021] [CM030] [CM032]'
