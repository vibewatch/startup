- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'Several structural drivers help explain why AI-native finance tools have emerged now. The AI-in-accounting market is growing quickly; cloud ERP is already dominant; electronic payments are now the norm; and the AP automation category alone is multi-billion-dollar. At the same time, controller teams still spend too much time on reconciliation, close, and context-switching across tools, which creates a visible ROI path for workflow automation if the vendor can preserve auditability. [CM011] [CM020] [CM021] [CM023] [CM024]


    The constraints are equally real. Agentic AI remains hype-heavy and Gartner expects 40%+ of projects to be cancelled by 2027. Incumbents are embedding their own AI, which may compress the architectural advantage AI-native vendors enjoy today. And the category remains financials-first: product businesses with deep operational complexity may still need an operations platform such as DOSS or a traditional suite. That combination of strong pain and real execution risk is exactly why the market is attractive but not yet won. [CM024] [CM029] [CM031] [CM035] [CM036]'
