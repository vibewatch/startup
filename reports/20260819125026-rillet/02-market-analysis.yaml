chapter:
  number: 2
  title: Market Analysis
  summary: Rillet operates inside the financials slice of ERP rather than the full operational ERP stack. Public market evidence supports a large and fast-growing umbrella market—AI in accounting at $10.4B in 2026, AI in ERP growing at a 27.3% CAGR, and global ERP software somewhere between roughly $78B and $106B in 2026—but Rillet’s practical SAM is the subset of finance teams replacing ledger-centric workflows for real-time close, rev rec, and multi-entity reporting. Adoption drivers are strong because manual finance work remains pervasive; constraints are equally real because buyers still worry about trust, integration, and whether agentic AI actually works in production.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'Rillet does not sell “all ERP” in the broad Oracle or SAP sense. Public materials and independent reviews agree that the company targets the financials layer of ERP: general ledger, revenue recognition, AR/AP, close, consolidation, and reporting. Inventory, warehouse, manufacturing, and broader operational workflows are outside the product’s documented scope, which means the real market boundary is narrower than the total ERP number often cited in category marketing. That is an important distinction because it makes Rillet’s true target less “every ERP buyer” and more “finance teams replacing a ledger-centric workflow.” [CM001] [CM002]


    The current substitutes split into four buckets: spreadsheet-led closes, SMB accounting tools such as QuickBooks or Xero, mid-market financial ERPs such as NetSuite and Sage Intacct, and overlay tools that automate pieces of close without replacing the ledger. That substitute stack matters because Rillet’s adoption motion is not purely greenfield; it is usually an upgrade or replacement decision made after finance teams hit complexity limits in the old stack. [CM026] [CM027] [CM028]'
  claimRefs:
  - CM001
  - CM002
  - CM030
  - CM028
