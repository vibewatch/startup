callouts:
- calloutType: insight
  title: The customer story is unusually specific for a young ERP vendor
  body: Rillet does not just present a logo wall. It has role-level case studies, concrete close and implementation anecdotes, and several marquee names that recur across independent and company-controlled sources. That is a strong starting point for diligence.
  claimRefs:
  - CU008
  - CU018
  - CU035
  - CU026
- calloutType: risk
  title: Durability still needs cohort data, not just good stories
  body: The public record can prove that customers exist and that some appear happy. It still cannot prove NRR, churn, renewal quality, or concentration. That is the central diligence blocker in this chapter.
  claimRefs:
  - CU030
  - CU032
  - CU040
