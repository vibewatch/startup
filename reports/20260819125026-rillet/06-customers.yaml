chapter:
  number: 6
  title: Customers
  summary: 'Rillet’s public customer evidence is one of the strongest parts of the company story: customer-count growth is rapid, named proof is unusually specific for a young ERP vendor, and several case studies describe real production outcomes in close, rev rec, audit readiness, and implementation speed. The main weakness is not customer existence but customer durability: public sources do not disclose NRR, churn, concentration, or partner-sourced pipeline share. The current evidence supports strong go-to-market momentum and good reference quality, while leaving revenue stickiness and diversification as open diligence items.'
sections:
- id: segmentation-and-trajectory
  title: Segmentation and adoption trajectory
  body: 'The public customer story is strongest on growth and weakest on denominator detail. Rillet went from nearly 200 customers at the Series A, to more than 200 by the Series B, to 500+ on later company pages, and to more than 600 by the Series C. That progression is directionally consistent with the broader funding narrative and supports the claim that adoption accelerated materially during 2025-2026. [CU001] [CU002] [CU003] [CU004] [CU005]


    The visible segment mix also matters. Fortune says about 40% of the customer base now sits outside tech and AI, while official materials cite biotech, healthcare, fintech, logistics, and professional services alongside the earlier SaaS/AI core. Even so, the best public proof still clusters around high-growth, finance-complex companies rather than traditional large enterprises. The public set therefore looks broadening, but still not fully diversified. [CU010] [CU011] [CU032] [CU036]'
  claimRefs:
