- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: The typical customer journey starts with finance pain, moves through ERP replacement, and then expands into broader accounting workflows.
  data:
    items:
    - id: discover
      label: Pain recognition
      actor: Controller / CFO
      description: Finance leaders realize the current stack cannot handle multi-entity, rev-rec, or close demands.
      channels:
      - QuickBooks strain
      - NetSuite frustration
      - Spreadsheet pain
    - id: evaluate
      label: Evaluate replacement
      actor: Accounting leader
      description: Rillet is compared against status-quo financial systems and implementation burdens.
      channels:
      - Case studies
      - Comparison pages
      - Accounting-firm trust
    - id: deploy
      label: Go live
      actor: Accounting team
      description: Implementation aims to move historical data, close workflows, and source-system connections onto Rillet quickly.
      channels:
      - Implementation team
      - Slack support
      - Integrations
    - id: operate
      label: Run production close
      actor: Controllers and accountants
      description: Teams use live books, approvals, rev rec, and reporting inside the product.
      channels:
      - Close
      - Rev rec
      - AP/AR
      - Audit support
    - id: expand
      label: Expand usage
      actor: Finance org
      description: Customers add more workflows, lean on faster support, and potentially widen reference value.
      channels:
      - More modules
      - Partner channel
      - Referenceability
