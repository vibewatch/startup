      detail: QBO, spreadsheets, or painful NetSuite-style implementations create demand
    - id: n2
      label: Evaluate finance-core replacement
      detail: Controller/CFO compares speed, trust, and workflow fit
    - id: n3
      label: Implement Rillet
      detail: Historical data and integrations move onto the new system
    - id: n4
      label: Run first close
      detail: Customer proves close, rev rec, and reporting in production
    - id: n5
      label: Expand modules and use cases
      detail: More workflows adopt the platform
    - id: n6
