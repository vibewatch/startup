- id: buyers-support-and-expansion
  title: Buyer, support, and expansion dynamics
  body: 'The visible buyer is the finance leader, usually a controller or CFO replacing a brittle stack. The user is the accounting team, and the value proposition is not merely automation but relief from manual close and reconciliation work. Several customer stories also show that Rillet typically coexists with a broader modern finance stack—Stripe, Ramp, Rippling, Salesforce, and Snowflake—which suggests the company is winning the accounting core rather than every adjacent workflow from day one. [CU012] [CU013] [CU014] [CU033]


    Support and responsiveness are recurring parts of the customer story. OnlineMedEd describes dedicated Slack support and fast response times. Omni says feature requests were shipped within weeks. Those anecdotes suggest a high-touch deployment model that can improve early retention and expansion, though they do not substitute for actual cohort metrics. Public evidence also implies land-and-expand behavior as customers layer on more modules after the initial ERP switch. This in turn means the early post-go-live experience may be unusually important to long-run expansion value. [CU024] [CU025] [CU027] [CU028] [CU029]'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU034
  - CU024
  - CU025
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU004
  - TU005
  figureRefs: []
- id: durability-and-diligence-gaps
  title: Durability, concentration, and unresolved diligence gaps
  body: 'The customer chapter’s biggest weakness is durability evidence. Public materials do not disclose NRR, GRR, logo churn, renewal rates, contract lengths, or cohort behavior. Nor do they quantify how much ARR is concentrated in the largest logos or how much pipeline comes from accounting-firm partners. That means the current record proves that customers exist and that some are enthusiastic; it does not yet prove how sticky or diversified the revenue base is. [CU030] [CU031] [CU034] [CU037]


    There is also an evidence-quality issue. The strongest outcomes come from Rillet-authored case studies rather than from independent reviews or customer-run conference talks. The absence of retained public complaint evidence is encouraging, but not dispositive. Investors should therefore treat the customer story as promising and increasingly specific, yet still in need of direct reference calls and cohort-level validation. In other words, reference quality is good enough to support belief, but not yet strong enough to replace renewal data. [CU026] [CU035] [CU038]'
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU037
  - CU026
