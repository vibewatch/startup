- id: named-proof-and-use-cases
  title: Named customer proof and use-case evidence
  body: 'Named customer proof is unusually strong for a young finance-software company, though still mostly curated by the vendor. Official materials cite Mercor, Function Health, and Temporal. Fortune independently adds Neuralink and Skild AI, while case studies provide deeper workflow evidence for Revv, Omni, OnlineMedEd, Scribe, and Blackthorn. The result is a customer-proof set that is broader than a simple logo slide and specific enough to support real diligence questions. [CU007] [CU008] [CU009] [CU026]


    The use cases line up around close acceleration, revenue recognition, audit readiness, and cleaner finance operations. Mercor is the marquee reference because Rillet says its agents support a business scaling past $2B ARR with a finance team of three. Scribe frames the product as an IPO-path system, while Revv, Omni, OnlineMedEd, and Blackthorn each describe concrete workflow or close improvements. [CU015] [CU016] [CU017] [CU018] [CU019] [CU020] [CU021] [CU022] [CU023]'
  claimRefs:
