- id: multiple-context-and-scenarios
  title: Multiple context and bull/base/bear framing
  body: 'A simple way to frame the current price is to ask what ARR level would be needed to make $1B look reasonable. If ARR were only $25M, the price would imply about 40x ARR, which would be extremely rich. At $50M ARR, the multiple falls to about 20x; at $75M ARR, about 13.3x. Public software comps span a wide range, but those implied levels still require confidence in very strong growth and revenue quality. [CV008] [CV009] [CV010]


    That is why the scenario framing matters. The bull case requires high hidden ARR, exceptional retention, and a credible margin path. The base case assumes solid but not extraordinary private metrics, making the round look full. The bear case assumes lower ARR or weaker durability, in which case the price would look aggressive. Put differently, the company may well be excellent and the price may still be merely fair. [CV011] [CV012] [CV013] [CV021] [CV022] [CV023]'
  claimRefs:
