- id: public-comp-context
  title: Public-comp context and its limits
  body: 'Public market comps are useful only as context. Oracle, Workday, Intuit, SAP, Salesforce, Adobe, and ServiceNow show that enterprise-software categories tied to core business workflows can support very large enterprise values. Their rough market-cap-to-revenue ranges cluster from around the high-3x area to roughly 9x for faster-growing premium software names. [CV011] [CV012] [CV013] [CV014] [CV015] [CV016] [CV017]


    But those comps should not be abused. They describe public companies with known revenue, mature disclosure, and much broader diversification. They help establish what excellent software economics can justify, not what Rillet specifically deserves today. The important inference is simply that a $1B price can be defensible if the hidden fundamentals are strong enough—but the public record cannot prove that threshold has been met. That uncertainty is why comp context helps frame discipline rather than settling the valuation debate outright. It is a guardrail, not a decision engine, for now. [CV018] [CV020] [CV026] [CV027] [CV028]'
