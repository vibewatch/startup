- id: recommendation-and-diligence
  title: Recommendation, entry discipline, and final diligence asks
  body: 'The public-evidence recommendation is research-further. That is not a comment that the company lacks quality; it is a comment that the price requires private information the public record does not contain. The strategic setup is attractive, but the entry discipline should be strict and should assume the need for a margin of safety unless private ARR, retention, and gross margin are clearly elite. [CV024] [CV025] [CV026] [CV032] [CV033] [CV034]


    The final view is therefore that Rillet looks like a potentially category-defining business whose headline round may still be too full for a public-information-only conviction call. The best upside trigger would be evidence that the hidden fundamentals are already world-class; the key downside triggers are security/control failures, weak retention, and concentration surprises. A disciplined watchlist stance preserves access to upside without pretending the public record already closes the underwriting case. It also keeps the decision anchored to falsifiable diligence milestones instead of founder charisma or round momentum alone. That discipline matters. [CV021] [CV023] [CV030] [CV031] [CV035] [CV036] [CV040]'
