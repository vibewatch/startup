chapter:
  number: 8
  title: Valuation
  summary: 'Rillet’s August 2026 unicorn round looks high-quality but full. Public evidence strongly supports the idea that the company may be building a category-defining AI-native finance platform, yet it does not disclose the financial metrics required to defend the $1B price with conviction. The correct public-information posture is therefore research-further: strong enough to want access to the deal, not transparent enough to pay the headline valuation without seeing ARR, retention, margins, burn, and terms.'
sections:
- id: thesis-and-price-context
  title: Thesis support versus price context
  body: 'The bullish case for Rillet is easy to understand. The company is attacking a very large market, has unusually strong customer proof for a young ERP vendor, and attracted a top-tier investor syndicate at high speed. Those ingredients are consistent with the idea that a category-defining company could be forming. [CV001] [CV002] [CV003] [CV004] [CV005] [CV029]


    The harder question is price, not quality. Public evidence can show why investors were excited, but it cannot show whether the August 2026 price already discounts most of the near-term upside. That is because the headline valuation is known while the revenue, margin, retention, and concentration base beneath it remains private. A great company can still be a mediocre investment if the entry price already assumes excellence from day one. [CV006] [CV018] [CV019] [CV020]'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
