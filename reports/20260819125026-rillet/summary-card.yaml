  topStrengths:
    - Strong category timing as finance teams look for AI-native systems of record rather than bolt-on automation.
    - >-
      Public customer proof is unusually specific for a young ERP vendor, including marquee names and workflow-level
      case studies.
    - >-
      Product narrative is coherent across marketing, docs, security controls, and customer evidence rather than resting
      on vague AI language alone.
    - Investor quality and financing momentum materially reduce near-term capital-adequacy risk.
    - Expansion beyond tech and AI into other verticals suggests the wedge may be broadening.
  topRisks:
    - >-
      Public ARR, revenue, gross margin, burn, retention, and concentration remain undisclosed, making the $1B price
      hard to underwrite externally.
    - >-
      Accounting correctness, security/privacy trust, and AI-governance failure would transmit quickly into customer
      confidence and valuation.
    - >-
      The current proof set still leans toward AI/SaaS and modern-growth companies rather than a fully diversified
      enterprise base.
    - High-touch implementation and support may pressure margins or organizational scalability if not standardized.
    - At this valuation, merely good performance may not be enough to generate attractive returns.
  unresolvedGaps:
    - Current ARR, GAAP revenue, and multi-quarter growth durability.
    - Gross margin, support burden, AI-compute cost, and burn/runway.
    - NRR, GRR, logo churn, contract duration, and top-customer concentration.
    - Preference stack, dilution, insider ownership, and any structured financing terms.
    - Status-page history, benchmarked AI/error-rate evidence, and deeper security-operations disclosure.
