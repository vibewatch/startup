- id: durability-and-risk
  title: Durability, commoditization, and risk
  body: 'The sharpest adverse evidence is not that Rillet lacks a category. It is that the category may get crowded before the company fully matures. Independent reviews already flag ecosystem depth and broader integration breadth as weaker than more mature alternatives, especially outside SaaS-focused workflows. Public sources also do not yet show the same depth of global enterprise references that Oracle, SAP, or Workday can cite in large competitive deals. [CP021] [CP029] [CP033]


    The longer-term risk is commoditization. If incumbents make their AI layers usable enough, the market may value trusted installed-base workflows over architectural purity. In that scenario, Rillet’s moat has to come from execution depth: better workflow data, better agent supervision, and faster finance outcomes that are hard to reproduce inside legacy stacks. That is possible, but the public record cannot yet prove it. Investors should therefore treat moat claims as conditional on continued product shipping and repeatable competitive wins, not as something already settled by category language. [CP030] [CP034] [CP035]'
