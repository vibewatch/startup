- id: where-rillet-wins
  title: Where Rillet appears strongest against direct alternatives
  body: 'Rillet’s strongest public differentiation is not generic AI branding. It is the claim that the ledger itself is AI-native: close management, revenue recognition, AP/AR workflows, and approval-gated agents all run in one finance operating loop rather than through bolt-on copilots. The official product surfaces, Aura pages, and API/workflow docs all reinforce that design choice. [CP012] [CP013] [CP015] [CP031]


    That architecture matters most in the company’s sweet spot: multi-entity, SaaS-like, fast-scaling finance teams that care about close speed, revenue recognition, and auditability. Against QuickBooks, the wedge is complexity and control. Against NetSuite and Sage, the wedge is real-time workflow depth, implementation speed, and agentic automation. The public evidence does not prove Rillet wins every time, but it does show a coherent battle card. It also suggests that product depth is increasingly documentable in public, which helps offset the normal skepticism buyers apply to a young accounting-system vendor. [CP004] [CP005] [CP006] [CP017] [CP019]'
  claimRefs:
  - CP012
  - CP013
  - CP014
  - CP015
  - CP032
  - CP019
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: where-incumbents-retain-power
  title: Where incumbents retain power
  body: 'Incumbents still dominate on breadth, ecosystem, and procurement comfort. Oracle, SAP, and Workday are not just software products; they are long-standing enterprise operating systems with global integrator networks, audit familiarity, and CIO-approved buying paths. NetSuite in particular matters because it sits closer to Rillet’s financial-ERP use case while still benefiting from maturity, breadth, and brand trust. [CP003] [CP004] [CP007] [CP008] [CP022]


    That distribution advantage is compounded by switching cost. Finance leaders do not change the ledger casually: they must preserve historical books, approvals, close controls, tax logic, and downstream reporting. Rillet’s fast-implementation claim is therefore strategically powerful if true, but it does not erase the structural comfort large buyers feel toward established vendors. Large enterprises also have internal policy bias toward vendors with broader procurement history, global services capacity, and preexisting security approvals. [CP019] [CP020] [CP022] [CP026]'
  claimRefs:
  - CP003
  - CP004
  - CP007
  - CP008
  - CP022
  - CP020
  - CP026
