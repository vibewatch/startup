callouts:
- calloutType: insight
  title: Rillet is not trying to beat SAP everywhere; it is trying to win the finance-led replacement motion first
  body: The public evidence suggests Rillet’s most realistic competitive motion is replacing QuickBooks, NetSuite, or Sage Intacct for fast-scaling finance teams that care about close speed and control. That is a much more achievable wedge than broad ERP displacement, and it is probably the right one.
  claimRefs:
  - CP002
  - CP005
  - CP004
  - CP006
- calloutType: risk
  title: The moat question is execution depth, not AI branding
  body: Incumbents can imitate interface-level AI. What is harder to copy is a finance workflow that is faster, more trusted, and easier to govern in production. Public materials imply Rillet is trying to build exactly that, but the proof burden remains high.
  claimRefs:
  - CP030
  - CP036
  - CP016
