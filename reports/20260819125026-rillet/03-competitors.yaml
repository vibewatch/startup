chapter:
  number: 3
  title: Competitors
  summary: Rillet competes most directly against NetSuite, Sage Intacct, and the “outgrown QuickBooks” path, while broader incumbents such as Oracle, SAP, and Workday retain major breadth, ecosystem, and trust advantages. Public evidence suggests Rillet’s strongest wedge is AI-native close, rev-rec, and finance workflow depth inside the ledger, not broad operational ERP coverage. The central competitive question is whether that workflow depth can compound fast enough to overcome switching costs, shallow ecosystem concerns, and the likelihood that incumbents will improve their own AI layers.
sections:
- id: landscape
  title: 'Landscape: direct, incumbent, adjacent, and substitute paths'
  body: 'The competitive field around Rillet is broader than a normal startup peer set. Direct competitors include other modern financial ERPs and AI-accounting upstarts. Incumbents include NetSuite, Sage Intacct, Oracle, SAP, and Workday. Adjacents include operations-first ERPs such as DOSS, plus workflow tools that automate parts of close without replacing the ledger. The buyer can also stay with spreadsheets and overlays, or simply keep the current ERP and build AI and data automation around it. That is why the right analytical frame is “ways to solve the finance-system-of-record job,” not just “other AI ERP startups.” [CP001] [CP002] [CP004] [CP005] [CP024] [CP025]


    Rillet itself makes the most concrete part of the landscape explicit by repeatedly targeting QuickBooks, NetSuite, and Sage Intacct in public comparison pages. That positioning suggests its most common practical selling motion is a financials-system replacement inside growth companies rather than a head-to-head displacement of SAP in global manufacturing. [CP002] [CP004] [CP006] [CP028]'
