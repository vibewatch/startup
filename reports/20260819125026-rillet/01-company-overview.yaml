callouts:
- calloutType: strength
  title: Founder-market fit and financing pedigree make the high-level thesis coherent
  body: 'Rillet is not just another AI wrapper story. The founder narrative, the product architecture language, and the financing sequence all line up around a single pain point: modern finance teams are still trapped in legacy ERP workflows that were not built for real-time, AI-assisted operation. Sequoia, a16z, and ICONIQ all backed that thesis in rapid succession, and customer references now include public companies and AI leaders.'
  claimRefs:
  - CO009
  - CO003
  - CO013
  - CO014
  - CO016
  - CO027
- calloutType: risk
  title: Public evidence is strongest on narrative and weakest on hard operating disclosure
  body: 'Rillet publishes a large amount of useful directional evidence, but many of the most important underwriting inputs remain management-supplied: customer count, implementation speed, automation rates, and proof that finance teams can stay lean at scale. Governance detail, exact headquarters, and verified headcount also remain incomplete. Those gaps do not negate the company story, but they materially limit conviction without direct diligence access.'
  claimRefs:
  - CO008
  - CO035
  - CO021
  - CO033
