chapter:
  number: 1
  title: Company Overview
  summary: Rillet is a US-based AI-native accounting and ERP startup founded by former N26 US chief Nicolas Kopp and CTO/co-founder Stelios Modes. Public materials describe a 2021 founding, a 2024 public launch, and a rapid financing arc from a $25M Series A in May 2025 to a $100M Series C at a $1B valuation in August 2026. The company says it now serves 600+ customers, including AI leaders such as Mercor, Neuralink, and Skild AI, while expanding beyond tech into multiple verticals. The core diligence tension is that founder quality, customer logos, and investor pedigree are visible, but governance detail and independently verified operating metrics remain limited.
sections:
- id: identity-and-positioning
  title: Identity, launch timing, and product positioning
  body: 'Rillet presents itself as an AI-native ERP rather than a bolt-on automation layer. Across the homepage, help center, and product explainers, the company consistently frames the general ledger as the operating core for finance, with close management, AR/AP, revenue recognition, and reporting running in one continuously updated system. The pitch is not just faster bookkeeping; it is that finance teams should work from live books, with AI operating inside the ledger rather than copying data out to spreadsheets and point tools. Official product language repeatedly uses “zero-day close” and “real-time” to differentiate the platform from batch-oriented incumbents like NetSuite, SAP, Oracle, and Workday. [CO001] [CO003] [CO004] [CO006]


    The timeline matters because multiple sources describe different moments in the company’s development. Rillet says it was founded in 2021, but also says it came out of stealth in 2024. That distinction resolves much of the apparent contradiction between older background assumptions and current company materials: the company existed before it marketed broadly. By the time of the August 2026 Series C, it had already become a visible category leader in AI-native accounting infrastructure, with marketing and press coverage aligned around the idea that legacy ERP software was built for a pre-AI workflow and that Rillet is trying to reset the category around agentic finance. [CO001] [CO002] [CO005] [CO018]'
