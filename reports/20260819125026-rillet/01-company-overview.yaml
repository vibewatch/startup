- id: strategic-alliances-and-diligence-caveats
  title: Strategic alliances and diligence caveats
  body: 'Rillet has tried to offset category skepticism by aligning itself with established accounting institutions. The April 2026 EY alliance explicitly positions the product as AI-native, real-time, and audit-ready by design, while the Series C materials say the company is an official partner to more than half of Accounting Today’s top 20 CPA firms. The Series B specifically named Armanino and Wiss. This ecosystem matters because Rillet is asking finance buyers to trust a young, AI-forward system in one of the most control-sensitive software categories. Partner validation from accounting firms is a practical trust bridge, not just a marketing trophy. [CO031] [CO032]


    Still, the chapter’s biggest caution is that many of the best-looking operating benchmarks remain company-supplied. Implementation speed, automation rates, customer counts, and close-time improvements come primarily from official releases, marketing pages, and case studies. That does not make them false, but it does mean investors should treat them as diligence prompts rather than as audited facts. The same applies to softer signals like the 5.0-star G2 claim and the Forbes Fintech 50 mention. The company-overview verdict is therefore strong on founder-market fit, funding pedigree, and visible customer momentum, but only moderate on governance transparency and independently verified operating scale. [CO033] [CO035] [CO036] [CO037]'
