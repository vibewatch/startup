      - number: '1.4'
        title: Scale, customer mix, and partner traction
        blocks:
          - type: paragraph
            body: >-
              Customer traction is one of the strongest signals in the file, though it remains mostly company-reported.
              The Series A release cited nearly 200 customers, the Series B cited more than 200, the about page later
              cited 500+, and the Series C plus Fortune interview raised the current figure to more than 600. Those
              snapshots are internally consistent with a rapidly scaling enterprise software company, even if the public
              record does not define whether “customers” means paying accounts, live deployments, or logos under
              contract. [CO019] [CO020] [CO021] [CO034]


              The quality of names is more telling than the absolute count. Fortune identifies Neuralink, Skild AI, and
              Mercor as customers; official Series C materials cite Mercor, Function Health, and Temporal; and company
              case studies show Scribe and others using Rillet for IPO preparation, complex revenue recognition, and
              faster closes. Mercor is the standout proof point: Rillet says its agents support a business scaling past
              $2B ARR with a finance team of three. Beyond tech, Fortune quotes Kopp saying roughly 40% of customers now
              come from non-tech sectors such as biotech, healthcare, logistics, and professional services. That
              broadening matters because it suggests Rillet is already testing whether its SaaS-centric wedge
              generalizes into a wider finance-platform market. [CO022] [CO023] [CO024] [CO025] [CO026] [CO027] [CO028]
              [CO029] [CO030]
