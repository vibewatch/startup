companyProfile:
  summary: >-
    Rillet is an AI-native accounting and ERP startup founded by Nicolas Kopp and Stelios Modes. The company sells a
    finance system of record that combines a real-time general ledger, close management, revenue recognition, AP/AR
    workflows, and Aura AI inside one accounting workflow. Its public customer proof is unusually strong for a young ERP
    vendor, with marquee names including Mercor, Neuralink, Skild AI, Function Health, Temporal, Scribe, Omni, Revv, and
    OnlineMedEd. By August 2026, Rillet had raised a $100M Series C led by ICONIQ at a $1B valuation after a rapid A/B/C
    financing cycle that took total disclosed funding above $200M.
