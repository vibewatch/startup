      - number: '1.5'
        title: Strategic alliances and diligence caveats
        blocks:
          - type: paragraph
            body: >-
              Rillet has tried to offset category skepticism by aligning itself with established accounting
              institutions. The April 2026 EY alliance explicitly positions the product as AI-native, real-time, and
              audit-ready by design, while the Series C materials say the company is an official partner to more than
              half of Accounting Today’s top 20 CPA firms. The Series B specifically named Armanino and Wiss. This
              ecosystem matters because Rillet is asking finance buyers to trust a young, AI-forward system in one of
              the most control-sensitive software categories. Partner validation from accounting firms is a practical
              trust bridge, not just a marketing trophy. [CO031] [CO032]


              Still, the chapter’s biggest caution is that many of the best-looking operating benchmarks remain
              company-supplied. Implementation speed, automation rates, customer counts, and close-time improvements
              come primarily from official releases, marketing pages, and case studies. That does not make them false,
              but it does mean investors should treat them as diligence prompts rather than as audited facts. The same
              applies to softer signals like the 5.0-star G2 claim and the Forbes Fintech 50 mention. The
              company-overview verdict is therefore strong on founder-market fit, funding pedigree, and visible customer
              momentum, but only moderate on governance transparency and independently verified operating scale. [CO033]
              [CO035] [CO036] [CO037]
            claimRefs:
              - CO031
              - CO032
              - CO033
              - CO034
              - CO035
              - CO037
              - CO038
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Founder-market fit and financing pedigree make the high-level thesis coherent
            body: >-
              Rillet is not just another AI wrapper story. The founder narrative, the product architecture language, and
              the financing sequence all line up around a single pain point: modern finance teams are still trapped in
              legacy ERP workflows that were not built for real-time, AI-assisted operation. Sequoia, a16z, and ICONIQ
              all backed that thesis in rapid succession, and customer references now include public companies and AI
              leaders.
            calloutType: strength
            claimRefs:
              - CO009
              - CO003
              - CO013
              - CO014
              - CO016
              - CO027
          - type: callout
            title: Public evidence is strongest on narrative and weakest on hard operating disclosure
            body: >-
              Rillet publishes a large amount of useful directional evidence, but many of the most important
              underwriting inputs remain management-supplied: customer count, implementation speed, automation rates,
              and proof that finance teams can stay lean at scale. Governance detail, exact headquarters, and verified
              headcount also remain incomplete. Those gaps do not negate the company story, but they materially limit
              conviction without direct diligence access.
            calloutType: risk
