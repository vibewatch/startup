      - number: '3.2'
        title: Where Rillet appears strongest against direct alternatives
        blocks:
          - type: paragraph
            body: >-
              Rillet’s strongest public differentiation is not generic AI branding. It is the claim that the ledger
              itself is AI-native: close management, revenue recognition, AP/AR workflows, and approval-gated agents all
              run in one finance operating loop rather than through bolt-on copilots. The official product surfaces,
              Aura pages, and API/workflow docs all reinforce that design choice. [CP012] [CP013] [CP015] [CP031]


              That architecture matters most in the company’s sweet spot: multi-entity, SaaS-like, fast-scaling finance
              teams that care about close speed, revenue recognition, and auditability. Against QuickBooks, the wedge is
              complexity and control. Against NetSuite and Sage, the wedge is real-time workflow depth, implementation
              speed, and agentic automation. The public evidence does not prove Rillet wins every time, but it does show
              a coherent battle card. It also suggests that product depth is increasingly documentable in public, which
              helps offset the normal skepticism buyers apply to a young accounting-system vendor. [CP004] [CP005]
              [CP006] [CP017] [CP019]
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP032
