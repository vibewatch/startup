  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis support versus price context
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Rillet is easy to understand. The company is attacking a very large market, has
              unusually strong customer proof for a young ERP vendor, and attracted a top-tier investor syndicate at
              high speed. Those ingredients are consistent with the idea that a category-defining company could be
              forming. [CV001] [CV002] [CV003] [CV004] [CV005] [CV029]


              The harder question is price, not quality. Public evidence can show why investors were excited, but it
              cannot show whether the August 2026 price already discounts most of the near-term upside. That is because
              the headline valuation is known while the revenue, margin, retention, and concentration base beneath it
              remains private. A great company can still be a mediocre investment if the entry price already assumes
              excellence from day one. [CV006] [CV018] [CV019] [CV020]
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV035
              - CV036
          - type: table
            tableRef: TV002
            claimRefs:
              - CV029
              - CV030
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Multiple context and bull/base/bear framing
        blocks:
          - type: paragraph
            body: >-
              A simple way to frame the current price is to ask what ARR level would be needed to make $1B look
              reasonable. If ARR were only $25M, the price would imply about 40x ARR, which would be extremely rich. At
              $50M ARR, the multiple falls to about 20x; at $75M ARR, about 13.3x. Public software comps span a wide
              range, but those implied levels still require confidence in very strong growth and revenue quality.
              [CV008] [CV009] [CV010]


              That is why the scenario framing matters. The bull case requires high hidden ARR, exceptional retention,
              and a credible margin path. The base case assumes solid but not extraordinary private metrics, making the
              round look full. The bear case assumes lower ARR or weaker durability, in which case the price would look
              aggressive. Put differently, the company may well be excellent and the price may still be merely fair.
              [CV011] [CV012] [CV013] [CV021] [CV022] [CV023]
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV007
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV038
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV026
      - number: '8.3'
        title: Public-comp context and its limits
        blocks:
          - type: paragraph
            body: >-
              Public market comps are useful only as context. Oracle, Workday, Intuit, SAP, Salesforce, Adobe, and
              ServiceNow show that enterprise-software categories tied to core business workflows can support very large
              enterprise values. Their rough market-cap-to-revenue ranges cluster from around the high-3x area to
              roughly 9x for faster-growing premium software names. [CV011] [CV012] [CV013] [CV014] [CV015] [CV016]
              [CV017]


              But those comps should not be abused. They describe public companies with known revenue, mature
              disclosure, and much broader diversification. They help establish what excellent software economics can
              justify, not what Rillet specifically deserves today. The important inference is simply that a $1B price
              can be defensible if the hidden fundamentals are strong enough—but the public record cannot prove that
              threshold has been met. That uncertainty is why comp context helps frame discipline rather than settling
              the valuation debate outright. It is a guardrail, not a decision engine, for now. [CV018] [CV020] [CV026]
              [CV027] [CV028]
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV037
              - CV038
          - type: table
            tableRef: TV004
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV037
              - CV018
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV037
              - CV038
              - CV018
              - CV020
      - number: '8.4'
        title: Recommendation, entry discipline, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The public-evidence recommendation is research-further. That is not a comment that the company lacks
              quality; it is a comment that the price requires private information the public record does not contain.
              The strategic setup is attractive, but the entry discipline should be strict and should assume the need
              for a margin of safety unless private ARR, retention, and gross margin are clearly elite. [CV024] [CV025]
              [CV026] [CV032] [CV033] [CV034]


              The final view is therefore that Rillet looks like a potentially category-defining business whose headline
              round may still be too full for a public-information-only conviction call. The best upside trigger would
              be evidence that the hidden fundamentals are already world-class; the key downside triggers are
              security/control failures, weak retention, and concentration surprises. A disciplined watchlist stance
              preserves access to upside without pretending the public record already closes the underwriting case. It
              also keeps the decision anchored to falsifiable diligence milestones instead of founder charisma or round
              momentum alone. That discipline matters. [CV021] [CV023] [CV030] [CV031] [CV035] [CV036] [CV040]
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV040
              - CV039
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV034
              - CV036
          - type: table
            tableRef: TV006
            claimRefs:
              - CV007
              - CV032
              - CV033
              - CV034
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a company-quality debate filtered through a price-quality problem
            body: >-
              Rillet looks real on market, product, and customer evidence. The unresolved issue is whether those
              positives are already more than priced into the $1B round.
            calloutType: insight
            claimRefs:
              - CV006
              - CV007
              - CV035
          - type: callout
            title: Without private metrics, “invest” would be a story-first call
            body: >-
              The public record is good enough to want access, not good enough to commit at face value. A clean invest
              decision requires seeing ARR, retention, margins, and terms.
            calloutType: risk
            claimRefs:
              - CV026
              - CV007
              - CV032
