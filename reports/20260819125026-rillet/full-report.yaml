      - number: '5.2'
        title: Architecture, workflow, and operating model
        blocks:
          - type: paragraph
            body: >-
              The core architecture story starts upstream. Rillet ingests data from finance systems, billing tools,
              banks, payroll, and other sources; normalizes that data in the ledger; and then lets accounting workflows
              and agents operate in-context. Public docs and product pages consistently portray the AI layer as embedded
              inside the accounting workflow rather than standing apart from it. That is the company’s most important
              technical claim. [CE004] [CE006] [CE007] [CE010] [CE011]


              The operating model is then a loop: source-system data lands in Rillet, finance workflows execute against
              live books, approval workflows gate material actions, and reports or answers come out with traceable
              context. That workflow can be compelling if the data ingestion and controls really hold, but it also means
              the product is highly dependent on integration fidelity and upstream system quality. This architecture is
              elegant on paper, but it raises the practical bar on connector quality, reconciliation logic, and
              exception handling. [CE006] [CE010] [CE013] [CE021] [CE028]
