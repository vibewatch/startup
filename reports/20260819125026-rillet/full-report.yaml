      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Founder quality is one of the clearest parts of the public record. Nicolas Kopp’s background combines
              finance training, investment banking, and frontline exposure to the pain of legacy financial systems while
              he was US CEO of N26. In the Series B announcement, Kopp explicitly tied Rillet’s origin story to his
              frustration at waiting weeks for business-critical metrics even with a strong finance team in place.
              Public biographies on ACG Silicon Valley and Slush add educational and career detail consistent with that
              story. The company also identifies Stelios Modes as co-founder and CTO, describing him as the technical
              architect behind N26’s payments infrastructure. Together, the pairing suggests a finance-operator plus
              systems-builder founder match rather than a generic AI tooling team. [CO009] [CO010] [CO014]


              Governance is visible mainly through financing events. The Series B added Alex Rampell from Andreessen
              Horowitz and Seth Pierrepont from ICONIQ to the board, and the Series C again highlights Pierrepont as a
              board member. That implies increasing institutional oversight as the cap table deepened, but public
              materials still stop well short of a full board roster or any detailed discussion of independent
              directors, committee structure, or founder control. For a unicorn-stage company selling audit-critical
              infrastructure, that gap is noticeable. Public-source location signals are also mixed, with San Francisco
              and New York both showing up in company communications, reinforcing the need for more precise diligence on
              headquarters and operating footprint. [CO011] [CO012] [CO016]
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO008
