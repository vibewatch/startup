  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Rillet does not look like a business that faces bank-style licensing risk, but it does face a meaningful
              legal and compliance burden because it sits close to financial controls, public-company processes, and
              personal data. The privacy policy makes clear that the company handles personal and transactional
              information in its broader service environment and that customer-data processing is governed through
              customer agreements. That combination creates classic enterprise-software legal exposure around privacy,
              data processing, and contract scope. [CR003] [CR004] [CR005] [CR006]


              The regulatory overlay is less about direct licensing and more about expectation setting. California
              privacy rules, SEC cyber-disclosure expectations at customer organizations, and broader AI-governance
              norms all raise the standard for what customers will expect from a finance platform. That does not mean
              Rillet is uniquely exposed, but it does mean the company cannot afford vague controls or exaggerated AI
              claims. The category gives little room for compliance sloppiness. [CR007] [CR008] [CR009] [CR030] [CR031]
            claimRefs:
