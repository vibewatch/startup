  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Rillet does not sell “all ERP” in the broad Oracle or SAP sense. Public materials and independent reviews
              agree that the company targets the financials layer of ERP: general ledger, revenue recognition, AR/AP,
              close, consolidation, and reporting. Inventory, warehouse, manufacturing, and broader operational
              workflows are outside the product’s documented scope, which means the real market boundary is narrower
              than the total ERP number often cited in category marketing. That is an important distinction because it
              makes Rillet’s true target less “every ERP buyer” and more “finance teams replacing a ledger-centric
              workflow.” [CM001] [CM002]


              The current substitutes split into four buckets: spreadsheet-led closes, SMB accounting tools such as
              QuickBooks or Xero, mid-market financial ERPs such as NetSuite and Sage Intacct, and overlay tools that
              automate pieces of close without replacing the ledger. That substitute stack matters because Rillet’s
              adoption motion is not purely greenfield; it is usually an upgrade or replacement decision made after
              finance teams hit complexity limits in the old stack. [CM026] [CM027] [CM028]
            claimRefs:
              - CM001
              - CM002
              - CM030
              - CM028
              - CM029
              - CM031
          - type: table
            tableRef: TM001
