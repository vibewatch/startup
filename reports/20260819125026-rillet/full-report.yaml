      - number: '3.3'
        title: Where incumbents retain power
        blocks:
          - type: paragraph
            body: >-
              Incumbents still dominate on breadth, ecosystem, and procurement comfort. Oracle, SAP, and Workday are not
              just software products; they are long-standing enterprise operating systems with global integrator
              networks, audit familiarity, and CIO-approved buying paths. NetSuite in particular matters because it sits
              closer to Rillet’s financial-ERP use case while still benefiting from maturity, breadth, and brand trust.
              [CP003] [CP004] [CP007] [CP008] [CP022]


              That distribution advantage is compounded by switching cost. Finance leaders do not change the ledger
              casually: they must preserve historical books, approvals, close controls, tax logic, and downstream
              reporting. Rillet’s fast-implementation claim is therefore strategically powerful if true, but it does not
              erase the structural comfort large buyers feel toward established vendors. Large enterprises also have
              internal policy bias toward vendors with broader procurement history, global services capacity, and
              preexisting security approvals. [CP019] [CP020] [CP022] [CP026]
            claimRefs:
