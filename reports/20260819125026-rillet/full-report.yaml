      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is large enough, but the right analytical question is SAM fit, not TAM theater
            body: >-
              Rillet can always point to a giant ERP or AI-accounting market number, and those numbers are directionally
              useful. But the investable question is narrower: how much of that spend belongs to finance teams willing
              to replace their ledger specifically for real-time close and AI-native workflows? The public record
              supports a meaningful wedge, especially in SaaS and multi-entity finance, but not a clean universal ERP
              story yet.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM008
              - CM033
          - type: callout
            title: Manual-work pain is real, but AI-finance adoption is not a free pass
            body: >-
              The strongest market driver for Rillet is that finance teams still run too much of close manually. The
              strongest market risk is that many agentic-AI projects fail because buyers cannot trust, integrate, or
              govern them well enough. The result is a market with visible urgency and equally visible skepticism.
            calloutType: risk
            claimRefs:
              - CM020
              - CM021
              - CM025
              - CM037
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct, incumbent, adjacent, and substitute paths'
        blocks:
          - type: paragraph
            body: >-
              The competitive field around Rillet is broader than a normal startup peer set. Direct competitors include
              other modern financial ERPs and AI-accounting upstarts. Incumbents include NetSuite, Sage Intacct, Oracle,
              SAP, and Workday. Adjacents include operations-first ERPs such as DOSS, plus workflow tools that automate
              parts of close without replacing the ledger. The buyer can also stay with spreadsheets and overlays, or
              simply keep the current ERP and build AI and data automation around it. That is why the right analytical
              frame is “ways to solve the finance-system-of-record job,” not just “other AI ERP startups.” [CP001]
              [CP002] [CP004] [CP005] [CP024] [CP025]


              Rillet itself makes the most concrete part of the landscape explicit by repeatedly targeting QuickBooks,
              NetSuite, and Sage Intacct in public comparison pages. That positioning suggests its most common practical
              selling motion is a financials-system replacement inside growth companies rather than a head-to-head
              displacement of SAP in global manufacturing. [CP002] [CP004] [CP006] [CP028]
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP024
              - CP025
              - CP033
