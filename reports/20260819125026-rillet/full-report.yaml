  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Rillet is best understood as a finance system of record with AI-native workflow automation built into the
              accounting core. The product scope shown publicly spans the general ledger, close management, revenue
              recognition, AP, AR, reporting, and Aura AI. That is materially broader than a point close tool, but still
              narrower than a full operational ERP. The workflow framing matters because the company sells to
              controllers and accounting teams that want live books, faster closes, and cleaner audit trails rather than
              a generic automation toolkit. [CE001] [CE002] [CE003] [CE005] [CE008] [CE009]


              The module set also explains the roadmap logic. Rillet is extending outward from the ledger into adjacent
              finance workflows instead of starting with operational modules such as inventory or manufacturing. That
              keeps the product coherent around accounting truth, but it also means buyers needing deep operational ERP
              still sit outside the product’s visible scope. The practical takeaway is that product strength comes from
              focus: the company is trying to be unusually good at finance workflows before it becomes broad elsewhere.
