      - number: '1.3'
        title: Funding history and investor base
        blocks:
          - type: paragraph
            body: >-
              Rillet’s financing cadence is unusually fast. The company announced a $25M Series A led by Sequoia in May
              2025, then a $70M Series B co-led by Andreessen Horowitz and ICONIQ only ten weeks later, and finally a
              $100M Series C led by ICONIQ at a $1B valuation in August 2026. Even using the most conservative reading
              of the public record, that is three substantial rounds in about fifteen months and more than $200M of
              disclosed funding. The pace indicates that investors viewed Rillet less as a normal ERP replacement vendor
              and more as a category-defining AI infrastructure bet. [CO013] [CO014] [CO016] [CO017] [CO018]


              The cap table matters because it mixes premier software investors with increasingly growth-oriented
              capital. Sequoia led the Series A, a16z and ICONIQ stepped in at Series B, and the Series C expanded the
              syndicate with Sequoia Global Equities, Bain Capital Ventures, Battery Ventures, FirstMark, Scale Venture
              Partners, Creandum, and Oak HC/FT. Crunchbase also reported an unconfirmed ~$500M Series B valuation,
              which—if directionally accurate—would mean the company doubled again to unicorn status within roughly a
              year. What public evidence does not show is the full preference stack, insider ownership, or any debt
              component, so late-stage valuation analysis still has to proceed with incomplete capital-structure data.
              [CO011] [CO013] [CO014] [CO015] [CO017]
            claimRefs:
              - CO013
