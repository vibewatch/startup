      - number: '7.3'
        title: Dependency, customer, and people risk
        blocks:
          - type: paragraph
            body: >-
              Rillet’s operating model is entangled with external systems. Customer stories reference Stripe, Rippling,
              Salesforce, and Snowflake in the surrounding stack, while the GTM motion relies in part on accounting-firm
              trust bridges. None of these dependencies are inherently problematic, but each creates failure modes
              outside Rillet’s direct control. Independent reviews already flag ecosystem breadth as a weakness, which
              means dependency risk is not just theoretical. [CR015] [CR016] [CR017] [CR018] [CR019] [CR020]


              Customer and people risk are similarly intertwined. Concentration, retention, and channel dependence are
              not publicly disclosed, even though a few marquee logos loom large in the narrative. At the same time,
              founder credibility, fast shipping, and high-touch support all point to key-person and scaling risk: the
              qualities that power early success can become bottlenecks later if the organization does not broaden.
              [CR021] [CR022] [CR023] [CR024] [CR025] [CR026]
            claimRefs:
              - CR015
              - CR016
              - CR017
