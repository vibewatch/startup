              - CR040
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The product can fail in only a few ways, but those ways matter enormously
            body: >-
              Rillet does not face a sprawling hardware or lending risk map. Instead, a handful of concentrated
              risks—bad accounting output, a breach, weak durability, or stalled wedge expansion—would each transmit
              very quickly into the thesis.
            calloutType: risk
            claimRefs:
              - CR001
              - CR036
              - CR038
              - CR037
          - type: callout
            title: Fresh capital helps, but it does not solve the trust problem automatically
            body: >-
              The Series C materially improves staying power. It does not by itself answer whether the company can scale
              support, prove durable renewals, and maintain controls while automating more finance work.
            calloutType: insight
            claimRefs:
