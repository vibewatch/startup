        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The public record strongly suggests that Rillet is a subscription software business, but it does not
              disclose the actual pricing mechanics. The company sells an accounting system of record with workflow
              modules, not a payments or lending product, which points toward recurring software revenue as the core
              stream. At the same time, implementation appears hands-on enough that services or service-like onboarding
              effort likely matters economically, even if it is not broken out as revenue. [CI001] [CI002] [CI003]
              [CI004]


              That ambiguity matters because pricing opacity is one of the chapter’s central blockers. There is no
              public list price, no contract model disclosure, and no realized-ACV benchmark. The product’s emphasis on
              revenue recognition and enterprise-grade finance workflows suggests a meaningful willingness-to-pay story,
              but not one investors can quantify from public sources alone. [CI003] [CI004] [CI005]
