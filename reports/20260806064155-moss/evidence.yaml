      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, investor seat allocation, and founder succession documentation.
    whyItMatters: >-
      Founder continuity is positive, but missing board and succession data leaves governance risk under-specified for a
      regulated fintech.
    diligencePath: Request board observer list, board minutes summary, and org chart for regulated and operating entities.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Audited ARR, revenue composition, margins, burn, and debt-draw usage.
