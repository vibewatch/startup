evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      A reconciled KPI pack showing active customers, businesses served, employee count, annual spend, and ARR on the
      same as-of date.
    whyItMatters: Current public materials conflict on the core scale metrics most likely to appear in an investment memo.
    diligencePath: Request CFO or finance-ops pack used for the August 2026 Series C process and compare it to current web copy.
    relatedQuestionRefs:
      - QO014
      - QO015
      - QO016
      - QO018
      - QO025
