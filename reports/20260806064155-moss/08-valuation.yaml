- id: bull-base-bear
  title: Bull / base / bear scenarios
  body: 'Scenario analysis helps because Moss is too mature for pure narrative investing but too private for precision. In the base case, the current mark is approximately fair: ARR expands steadily, the AI and workflow suite improves revenue quality, and no major regulatory or partner issue interrupts execution. That supports a value range clustered around the unicorn mark. In the bull case, Moss proves it can compound beyond €70M ARR faster than expected, deepen multi-module penetration, and make Finance AI commercially meaningful rather than merely differentiating marketing. That would justify a clear step-up. In the bear case, the company does not need a scandal to lose value; a slower growth path, weaker cohort quality, partner friction, or more cautious capital markets could be enough to compress the multiple. The key insight is that Moss now sits in a narrower band of plausible outcomes than an early-stage startup, but price sensitivity still matters a lot.'
  claimRefs:
