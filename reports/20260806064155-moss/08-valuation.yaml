    - Down-round or weak secondary pricing would weaken this support
  - - Multi-product finance platform can grow wallet share
    - Cards, AP, integrations, and Finance AI broaden monetization
    - Weak module expansion or low AI adoption would undercut it
  - - Operating scale is already meaningful
    - €70M+ ARR, 5,000+ customers, 2M+ monthly transactions
    - Audited revenue or retention gaps could reveal weaker quality
  - - Information opacity remains substantial
    - No public preference stack, margin detail, or audited current financial pack
    - Management disclosure that closes these gaps could upgrade conviction
  notes: Rows intentionally pair bullish and skeptical readings of the same evidence set.
