- id: recommendation-and-entry-discipline
  title: Recommendation, confidence, and entry discipline
  body: The right call on the current public record is Track with medium confidence. Track—not Buy—because the company quality appears real, the latest financing anchor is fresh, and there is a credible path to further multiple support if ARR keeps compounding and Finance AI increases wallet share. But Buy would require more evidence than is publicly visible. The core issue is not that Moss looks weak; it is that the entry price already reflects meaningful success. A trailing multiple of roughly 14x reported ARR is not absurd for a high-growth fintech-software hybrid, but it is rich enough that new investors need better proof on revenue quality, margin structure, and dilution terms. Entry discipline therefore matters more than generic admiration of the company. A modest premium to today’s mark could still work if execution stays excellent, but the public record does not yet justify paying materially ahead of the latest disclosed price without deeper diligence.
