- id: valuation-context
  title: Financing context and what the current price implies
  body: 'Moss now has two strong public valuation anchors: the 2022 Series B at roughly $573M and the August 2026 Series C at €1B+. The later round is not just a paper carry-forward; it represents a new price-setting event in a market that has been more selective than the 2021-2022 peak period. That matters. A fresh round deserves more weight than stale private marks. Still, the information value of the round is incomplete because investors do not know the detailed preference stack, anti-dilution provisions, or governance rights attached to the new capital. Nor do filing surfaces provide enough current audited operating detail to turn the ARR claim into a robust intrinsic-value model. The current price therefore works best as a market-clearing reference point, not as proof that upside remains abundant. Investors should view it as a serious anchor, but not as a substitute for underwriting.'
