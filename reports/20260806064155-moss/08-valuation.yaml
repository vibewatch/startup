- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'The final judgment is that Moss is investable as a company but not yet clearly underwritten as a price. That distinction is important. Recent funding, credible scale, and a broadened finance platform argue that the company belongs on a serious late-stage watchlist. But the missing public evidence—audited operating detail, margin structure, preference terms, customer economics, and risk KPI depth—means investors should still treat the latest valuation as something to verify rather than simply accept. The most valuable next diligence steps are straightforward: reconcile ARR to audited statements, understand module mix and cohort expansion, quantify partner and payment economics, and review the Series C preference stack. A buy case strengthens if those requests confirm durable software-like economics. The thesis weakens quickly if growth quality disappoints, if financing terms prove investor-protective in a way that hurts new entrants, or if operating risks interrupt monetization of
    the AI suite.'
