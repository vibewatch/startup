- id: comparable-analysis
  title: Comparable company framing
  body: 'No single comparable perfectly matches Moss. Adyen, Payoneer, and Nu Holdings are useful because they show how public markets currently price large payment and fintech infrastructure businesses, but they are much larger, more mature, and more fully disclosed than Moss. They are therefore anchors, not peers in the strict sense. Airwallex is a closer directional comp because it combines payment infrastructure with adjacent financial workflows and continues to attract private capital at scale. Even there, the fit is imperfect because Airwallex is more global and significantly larger on ARR. The right comp framework is therefore blended: use public companies to cap optimism and private high-growth fintechs to preserve realism about upside. On that blended view, Moss’s €1B+ mark is understandable, but it is not obviously cheap.'
