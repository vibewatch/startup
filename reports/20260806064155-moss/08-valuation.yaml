    - ~€1.2B-€1.5B fair value; upside from growth and product breadth
    - Execution and control quality must hold while scaling
    - Possible but needs fresh proof
  - - Base
    - Steady ARR growth, moderate expansion, current strategy intact
    - ~€0.9B-€1.1B; latest mark roughly fair
    - Little margin of safety for new money
    - Most consistent with current evidence
  - - Bear
    - Growth slows, cohort quality disappoints, or partner/regulatory issue appears
    - ~€0.6B-€0.8B; multiple compression plus lower confidence
    - Price resets faster than narrative
    - Material if diligence uncovers weak quality
  notes: Ranges are heuristic bands anchored on public evidence, not a full DCF or audited comp model.
