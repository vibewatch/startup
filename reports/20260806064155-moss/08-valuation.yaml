company:
  name: Moss
chapter:
  number: 8
  title: Valuation
  summary: 'Moss now has a credible public late-stage price anchor: the August 2026 €30M Series C at €1B+ valuation. That round, together with reported €70M+ ARR, 5,000+ customers, and 350+ employees, supports the view that Moss is a real scale fintech rather than a purely narrative company. The valuation question is not whether Moss deserves serious investor attention. It is whether the latest unicorn mark leaves enough upside for new money given limited audited disclosure, unknown preference terms, and still-material execution and partner risk. On current public evidence, the company earns a Track recommendation with medium confidence and a full-to-stretched valuation stance.'
sections:
- id: investment-thesis
  title: Investment thesis and anti-thesis
  body: The positive valuation case for Moss starts with the unusual combination of recent scale and strategic breadth. Public reporting says the company crossed €70M ARR, 5,000+ customers, 350+ employees, and 2M+ monthly transactions before or around the August 2026 Series C. That is not a seed-stage story being priced on aspiration alone. The business also appears to be broadening beyond card issuance into spend control, AP automation, reimbursements, accounting integrations, and Finance AI, which creates a path to higher revenue per customer and more defensible workflow ownership. The anti-thesis is equally important. The same public evidence set still lacks audited financial disclosure, preference detail, cohort quality, and hard margin data. At a €1B+ valuation, investors are not paying a low-information discount. They are paying for a late-stage growth story that must continue to execute cleanly across regulated payments and finance automation.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
