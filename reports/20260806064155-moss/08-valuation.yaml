- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Capital markets reset
    - Down-round or distressed financing
    - Signals latest mark was too optimistic
    - Reprice base and bear cases immediately
  - - Growth-quality miss
    - Audited revenue, retention, or margin materially below implication of current mark
    - Undermines premium multiple support
    - Pause investment until gap is understood
  - - Operating-risk event
    - Regulatory or partner disruption materially affects customer operations
    - Damages monetization credibility
    - Shift toward bear-case weighting
  - - AI monetization failure
    - Finance AI remains a feature not a monetization lever
    - Reduces multiple premium justification
    - Lower fair-value ceiling
  notes: Triggers focus on events that would change price support, not just company quality.
  claimRefs:
  - CV028
  - CV032
  - CV035
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited ARR bridge, gross margin, and product mix
    - Determines whether ~14x trailing ARR is justified
    - Request CFO pack and auditor-backed metrics
  - - Customer durability
    - NRR, churn, cohort expansion, and module penetration
    - Distinguishes logo growth from durable monetization
    - Request cohort tables by segment and geography
  - - Capital structure
    - Series C preference, liquidation, and anti-dilution terms
    - Required to assess real entry economics for new investors
    - Request term sheet summary and cap-table waterfall
  - - Partner economics and risk
    - Unit economics by payment rail / partner and contingency plans
    - Shows whether scale converts to defendable profit and resilience
    - Request partner concentration and failover materials
  notes: Each ask is chosen because it can move valuation confidence materially within one diligence cycle.
