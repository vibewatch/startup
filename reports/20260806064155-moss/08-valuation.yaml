  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: Audited ARR bridge, gross margin, EBITDA profile, and module-level revenue mix.
    whyItMatters: These metrics determine whether the current mark is merely fair or genuinely attractive.
    diligencePath: Request CFO / auditor package reconciling management ARR to statutory and management accounts.
    relatedQuestionRefs:
    - QV006
    - QV018
    - QV028
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Series C liquidation preferences, anti-dilution protection, governance rights, and option-pool effects.
    whyItMatters: Price alone is insufficient without knowing who gets paid first and how future dilution works.
    diligencePath: Request term sheet summary and cap-table waterfall model.
    relatedQuestionRefs:
    - QV007
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cohort-quality
    missingEvidence: NRR, churn, expansion by module, activation depth, and geography-specific cohort behavior.
    whyItMatters: These metrics drive whether Moss deserves software-like valuation treatment or a lower fintech multiple.
    diligencePath: Request cohort and expansion dashboards for cards, AP, reimbursements, and AI workflows.
    relatedQuestionRefs:
    - QV019
    - QV021
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
