- id: mitigations-and-kill-criteria
  title: Mitigations, residual exposure, and kill criteria
  body: 'Overall, Moss does not look reckless; it looks like a maturing fintech whose residual risk comes from scale, partner reliance, and public-information limits. The mitigation side is visible: regulatory positioning is explicit, trust and security materials are better than average, the product strategy is diversifying beyond interchange, and the company has demonstrated access to both equity and debt financing. The residual side is equally real: public disclosure on incidents, partner concentration, risk governance depth, and loss metrics is still thin. That means the investment question is not whether Moss has any mitigation—it clearly does—but whether the remaining blind spots are tolerable at a unicorn valuation. The most useful kill criteria are therefore monitorable rather than speculative: any licence issue, material partner interruption, evidence of control failures in AI-led accounting, or a financing reset inconsistent with the growth narrative would materially weaken the
    thesis and should trigger immediate re-underwriting.'
  claimRefs:
