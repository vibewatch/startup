    - Germany / EU
    - No action disclosed; regulated status actively marketed
    - Low-medium
    - High
    - Existing licence, explicit compliance posture, trust materials
    - A supervisory event could directly affect payments operations and fundraising
    - Request regulator correspondence summary and internal compliance dashboard
  - - DORA compliance failure
    - EU
    - Binding regime in force
    - Medium
    - High
    - Security controls, process formalisation, partner oversight
    - Major incident or control gap could trigger remediation cost and scrutiny
    - Request DORA readiness assessment and incident reporting playbook
  - - AI-governance failure in Finance AI workflows
    - EU
    - Control burden rising with automation narrative
    - Medium
    - Medium-high
    - Human-in-the-loop positioning and explicit caution on hallucinations
