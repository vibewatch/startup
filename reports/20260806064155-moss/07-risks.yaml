- id: customer-and-execution-risk
  title: Customer concentration and scaling execution
  body: Public customer evidence is strong enough to show adoption breadth but not strong enough to rule out concentration or control risk. Moss can point to hospitality, ecommerce, media, accounting partners, and multi-entity finance use cases. That supports the argument that the product is not a one-vertical niche. But the same evidence does not reveal top-customer ARR share, usage concentration by module, or whether one segment drives most payment volume. This matters because spend-management businesses can look diversified at the logo layer while remaining concentrated economically. Execution risk rises with scale. Recent reporting describes 350+ employees, €70M+ ARR, and more than 2 million transactions per month. At that scale, investors should assume that hiring quality, process discipline, and control-system maturity become just as important as product roadmap speed. Public materials still feel founder-led, which is not bad, but succession depth and independent risk-management bench
    are not well disclosed.
  claimRefs:
  - CR020
  - CR021
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR037
  - CR038
