  - - Privacy / contract mismatch across product entities and partners
    - Germany / UK / EU
    - Complex but formalised legal surface
    - Medium
    - Medium
    - Legal centre and privacy disclosures exist
    - Opaque partner allocation could create complaint and remediation friction
    - Request current legal-entity matrix and partner-service responsibility map
  notes: Severity is ranked by the combination of direct business interruption potential and likely effect on investor confidence.
