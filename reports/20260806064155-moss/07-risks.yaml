schemaVersion: report-v2
artifact: risks
slug: moss
runDate: '2026-08-06'
company:
  name: Moss
chapter:
  number: 7
  title: Risks
  summary: 'Moss presents a stronger public control posture than a typical spend-management startup: it is explicit about BaFin-regulated status, publishes a legal centre, claims ISO/IEC 27001:2022 certification, and writes concretely about finance-specific fraud and AI limitations. The main risk is therefore not obvious regulatory recklessness. It is compound dependency risk. Moss relies on licences, partners, integrations, and AI-assisted accounting workflows that can transmit disruptions into customer trust, revenue, and valuation simultaneously. Public disclosure on incident history, partner concentration, and risk-governance depth remains limited, so residual exposure is still meaningful at unicorn scale.'
sections:
- id: regulatory-and-legal
  title: Regulatory and legal posture
  body: 'Moss looks more credible on regulatory posture than many spend-management startups because it does not merely imply compliance; it repeatedly foregrounds being a BaFin-regulated e-money institution, ties card issuance to Mastercard licensing, and provides a legal centre that separates software services from regulated payment services. That is a meaningful positive. It suggests the company understands that the product sits inside real-money flows, not just back-office workflow software. At the same time, the structure also creates risk complexity. The legal centre shows multiple product surfaces and partner-delivered elements, which means that as Moss scales finance AI, AP workflows, cards, wallet, and credit-like capabilities, the contractual and supervisory surface grows faster than a single-product SaaS business. DORA and the AI Act add another layer: compliance is no longer just about having a licence, but about proving resilient operating controls, model governance, and traceable
    accountability.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: security-and-operational-risk
  title: Security, fraud, and operational resilience
  body: 'The security story is directionally strong but incomplete. Moss publicly claims ISO/IEC 27001:2022 certification, frames itself as built to local and global standards, and publishes detailed writing about finance-specific fraud vectors such as business email compromise and vendor email compromise. That is better evidence than generic trust-centre boilerplate. It shows management is at least thinking in the right threat model: attackers target approvals, invoices, supplier relationships, and payment authorisations, not just application code. Still, public controls claims are not the same thing as demonstrated resilience. The company does not publish outage history, incident metrics, or service-level evidence in the materials reviewed here. Its own AI article is unusually candid that generative models can hallucinate numbers and that humans remain accountable. That honesty is a positive signal, but it also confirms that the Finance AI layer creates residual model-risk exactly where
    finance teams care most: coding accuracy, reporting integrity, and approval confidence.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
