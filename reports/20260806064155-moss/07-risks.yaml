  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Historical outage log, incident severity counts, customer compensation, and major-incident root-cause reviews.
    whyItMatters: Public controls claims are hard to underwrite without operating-history evidence.
    diligencePath: Request 24-month incident register with severity, duration, affected modules, and remediation status.
    relatedQuestionRefs:
    - QR014
    - QR029
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Exact dependence by revenue, payment volume, and contingency plans for Mastercard, Airwallex, and banking/payment partners.
    whyItMatters: Dependency risk can be understated when only the marketing layer is visible publicly.
    diligencePath: Request partner concentration schedule and documented failover / migration plans.
    relatedQuestionRefs:
    - QR017
    - QR021
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: risk-governance-depth
    missingEvidence: Board committee structure, named risk/compliance leadership, and internal audit or model-risk governance practices.
    whyItMatters: A unicorn-scale regulated fintech needs more than founder visibility to manage compound control risk.
    diligencePath: Request governance deck covering committees, reporting lines, and model / compliance ownership.
    relatedQuestionRefs:
    - QR025
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: loss-metrics
    missingEvidence: Fraud-loss, chargeback, dispute, credit-loss, and customer concentration metrics by cohort and geography.
    whyItMatters: These are the most direct quantitative indicators of residual risk transmission into margin and valuation.
    diligencePath: Request risk KPI pack tied to monthly management reporting.
    relatedQuestionRefs:
    - QR023
    - QR028
    - QR030
    relatedTableRefs:
    - TR005
