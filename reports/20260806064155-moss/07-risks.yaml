- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Licence or supervisory risk
    - Regulatory status change
    - Any disclosed BaFin restriction, material remediation, or partner-licence complication
    - Pause investment or re-underwrite immediately
  - - Partner interruption
    - Card or UK banking capability disruption
    - Mastercard or Airwallex service issue that visibly affects customers
    - Downgrade operating resilience view and reassess retention risk
  - - AI/control failure
    - Accounting or approval-control incident
    - Evidence that Finance AI caused material misclassification, payment, or reporting failure
    - Treat as thesis-breaking until governance is proven
  - - Financing / valuation stress
    - Capital raise or debt change inconsistent with growth narrative
    - Down-round, distressed debt, or unexplained covenant pressure
    - Reset valuation assumptions and increase downside weighting
  notes: Kill criteria focus on externally observable events that would force immediate re-underwriting.
