  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  productSummary: >-
    Spend-management and finance-operations platform offering corporate cards, expense management,
    employee reimbursements, invoice capture and approvals, budget controls, accounting
    integrations (including DATEV and ERP connectors), and Finance AI agents for pre-accounting and
    workflow automation.
  customerFocus: >-
    European finance teams at SMEs and mid-market companies, with strongest visible footprint in
    Germany and expansion into the UK, the Netherlands, and Austria. Public proof spans hospitality,
    ecommerce, media, accounting-service partners, and multi-entity finance teams.
  businessModel: >-
    Hybrid fintech-software model combining platform subscription value, workflow monetization,
    card/interchange economics, payment-related fees, and potentially credit-linked revenue where
    supported by product structure and funding lines. The strategic direction points toward broader
    wallet share via multi-module adoption rather than dependence on card issuance alone.
  stage: late-stage private
  fundingStatus: >-
    Roughly €160M total funding after the August 2026 €30M Series C led by Portage, plus a prior
    HSBC Innovation Banking UK debt facility of up to €50M announced in 2023. Earlier rounds include
    a 2021 Series A extension and a 2022 €75M Series B led by Tiger Global.
  disclosureProfile: private-disclosed
  claimRefs: [CO004, CO005, CO014, CO018, CO021, CV002]
summary:
  headline: >-
    Moss has credible late-stage fintech scale, differentiated European finance-workflow fit, and a
    fresh unicorn price anchor, but the current public record still leaves too much opacity on
    audited economics and capital-structure terms to justify a high-conviction buy at the latest mark.
