      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The category has moderate but not insurmountable switching costs. Once a platform owns cards, approval
              logic, invoice capture, exports, and close-process habits, replacing it creates real operational pain; yet
              those costs are still far below ERP replacement, and many vendors now promise faster onboarding with
              modular rollouts. That reduces lock-in and increases the importance of distribution and ecosystem
              leverage. Qonto can attach spend workflows to a large business-account base, Airwallex can extend from
              global payments infrastructure, Ramp can use U.S. momentum and AI branding to raise feature expectations,
              and Payhawk / Spendesk can sell one-platform consolidation to finance teams already tired of fragmented
              stacks. Moss’s moat is therefore not simple product novelty. It rests on Europe-specific compliance
              credibility, AP depth, accounting integrations, modular packaging, and whether its AI layer genuinely
              improves close quality and throughput more than peers can copy.
