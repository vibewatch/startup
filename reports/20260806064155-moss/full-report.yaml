        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Moss does not look like a pure SaaS vendor or a pure card issuer. Public pricing pages show paid software
              plans starting from €99 per month, plus modular add-ons and free entry points for some workflows. Product
              pages show monetizable surfaces across cards, AP automation, reimbursements, approvals, intelligence, and
              international payments. The corporate-cards page adds an important clue: Moss offers both credit and debit
              products, including flexible repayment cycles and zero interest when repaid on time, which implies that
              the business model likely combines subscription revenue with interchange, payment-related fees, and
              possibly credit-linked economics that depend on usage, repayment behavior, and partner-bank or funding
              costs. That blended model is strategically attractive because it widens ARPA and lowers dependence on any
              one revenue stream, but it also makes revenue quality harder to assess from public evidence alone.
