      - number: '2.3'
        title: Buyers, users, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer is usually the finance leader or controller, the day-to-day workflow owner is the AP or
              finance-operations team, the user base includes employees and budget owners, and the payer is the company
              itself. Moss product materials are explicitly written for modern SMB finance teams rather than consumers.
              The adoption path usually starts with one painful workflow—cards, AP, or reimbursements—then expands into
              approvals, budgeting, procurement, and ERP integration once the system becomes the source of truth for
              spend data. This land-and-expand motion is consistent with the broader market: competitors such as
              Spendesk, Payhawk, Ramp, Brex, Soldo, and Qonto all now pitch unified workflows rather than single
              modules. Moss’s free starter plans for cards or AP reduce adoption friction for smaller teams, while paid
              plans with unlimited users and add-ons fit the buyer profile of scaling European SMEs that want
              centralized control without enterprise ERP complexity.
