      - number: '2.4'
        title: Why the market is moving now—and what slows adoption
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are visibility, control, compliance, and staffing leverage. External studies
              consistently cite real-time spend visibility, policy enforcement, AI-powered automation, ERP integration,
              and cloud deployment as primary growth engines. Europe adds a distinct regulatory tailwind: the European
              Commission treats eInvoicing as a key digital enabler, the 2025 country factsheets track widening B2B and
              B2C mandates, and the post-ViDA environment gives member states more room to mandate structured invoicing
              domestically ahead of the 2030 cross-border obligation. Moss’s own survey evidence shows that finance
              teams are already digitising, but still uneasy about AI autonomy. The main adoption constraints are also
              clear: integration costs, workflow change resistance, security and compliance burdens, fragmented vendor
              stacks, and the challenge of proving ROI to smaller teams that still tolerate spreadsheets. For Moss,
              these constraints matter because the company sells exactly where regulated workflow change is hardest: the
              moment money moves, invoices are approved, and month-end data must survive audit.
