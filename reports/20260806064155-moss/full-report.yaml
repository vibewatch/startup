      - number: '1.5'
        title: Milestones and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Moss's milestone record shows a company widening from a Germany-first corporate-card entrant into a
              broader European finance-automation platform. The early product in 2020 emphasised high-limit corporate
              cards and startup expense controls. The 2021 Series A extension funded international expansion and product
              broadening, while the 2022 Series B marked the shift to modular spend management covering cards, invoices,
              reimbursements, and liquidity workflows. The 2023 HSBC facility shows a willingness to blend venture
              equity with balance-sheet support. By 2025, Moss had deepened its UK banking stack through Airwallex and
              began publicly framing its strategy around trust, security, and regulation. By 2026, Moss Intelligence had
              become central to the narrative: the company markets receipt chasing, pre-accounting, policy enforcement,
              and invoice matching as AI-agent workflows, and the Series C was explicitly raised to expand that Finance
              AI suite. The strategic through-line is not merely “more spend management,” but ownership of the finance
              team's day-to-day operating workflow under a regulated shell with stronger automation, embedded payments,
              and cross-border reach.
