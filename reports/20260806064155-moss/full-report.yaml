  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Moss is really competing in
        blocks:
          - type: paragraph
            body: >-
              Moss does not compete in one narrow category. Its operating market spans at least three linked software
              and payments layers: spend management platforms, accounts payable automation, and corporate-card-enabled
              finance operations. Moss product pages and pricing show that the company sells cards, invoice capture,
              reimbursements, approval routing, procurement-style controls, ERP sync, and AI pre-accounting as parts of
              one system. That places it broader than a pure expense-management app, but narrower than a full ERP or
              business bank. The clean market boundary therefore includes corporate cards, AP, reimbursements, approval
              and policy controls, audit-ready document management, and accounting/ERP integrations for business finance
              teams. It excludes payroll, general ledger ownership, broad treasury systems, and consumer banking.
              Status-quo substitutes remain spreadsheets, bank-issued cards, email-based approvals, legacy ERPs used as
              workflow systems, and point solutions such as travel or procurement tools that finance teams stitch
              together manually.
