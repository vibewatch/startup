            body: >-
              The most concrete technical evidence comes from Moss’s own engineering writing and integration
              documentation. The Coding Agent post describes a system that retrains a model per organisation using
              accountant actions as feedback, stores model artefacts in Google Cloud buckets, uses Vertex AI for
              training, and orchestrates pipelines with Airflow. Moss says the system automatically codes nearly 2
              million fields per month, targets at least 95% precision for auto-applied codings, and can exceed 98%
              precision for many customers and dimensions, with manual coding dropping below 25% after a few months in
              some cases. That is a specific operating model, not vague AI branding. The broader architecture appears to
              combine application-layer workflow controls, OCR, policy logic, accounting synchronization, and
              model-assisted coding on top of regulated payment and card infrastructure. The main technical diligence
              question is not whether Moss has AI features, but how robustly those model outputs generalize across
