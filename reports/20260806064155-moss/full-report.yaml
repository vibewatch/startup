              The security story is directionally strong but incomplete. Moss publicly claims ISO/IEC 27001:2022
              certification, frames itself as built to local and global standards, and publishes detailed writing about
              finance-specific fraud vectors such as business email compromise and vendor email compromise. That is
              better evidence than generic trust-centre boilerplate. It shows management is at least thinking in the
              right threat model: attackers target approvals, invoices, supplier relationships, and payment
              authorisations, not just application code. Still, public controls claims are not the same thing as
              demonstrated resilience. The company does not publish outage history, incident metrics, or service-level
              evidence in the materials reviewed here. Its own AI article is unusually candid that generative models can
              hallucinate numbers and that humans remain accountable. That honesty is a positive signal, but it also
              confirms that the Finance AI layer creates residual model-risk exactly where finance teams care most:
