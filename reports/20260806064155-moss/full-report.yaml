              - CV039
      - number: '8.3'
        title: Financing context and what the current price implies
        blocks:
          - type: paragraph
            body: >-
              Moss now has two strong public valuation anchors: the 2022 Series B at roughly $573M and the August 2026
              Series C at €1B+. The later round is not just a paper carry-forward; it represents a new price-setting
              event in a market that has been more selective than the 2021-2022 peak period. That matters. A fresh round
              deserves more weight than stale private marks. Still, the information value of the round is incomplete
              because investors do not know the detailed preference stack, anti-dilution provisions, or governance
              rights attached to the new capital. Nor do filing surfaces provide enough current audited operating detail
              to turn the ARR claim into a robust intrinsic-value model. The current price therefore works best as a
              market-clearing reference point, not as proof that upside remains abundant. Investors should view it as a
              serious anchor, but not as a substitute for underwriting.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV027
              - CV028
          - type: table
            tableRef: TV005
            claimRefs:
              - CV028
              - CV032
              - CV035
              - CV040
      - number: '8.4'
        title: Bull / base / bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis helps because Moss is too mature for pure narrative investing but too private for
              precision. In the base case, the current mark is approximately fair: ARR expands steadily, the AI and
              workflow suite improves revenue quality, and no major regulatory or partner issue interrupts execution.
              That supports a value range clustered around the unicorn mark. In the bull case, Moss proves it can
              compound beyond €70M ARR faster than expected, deepen multi-module penetration, and make Finance AI
              commercially meaningful rather than merely differentiating marketing. That would justify a clear step-up.
              In the bear case, the company does not need a scandal to lose value; a slower growth path, weaker cohort
              quality, partner friction, or more cautious capital markets could be enough to compress the multiple. The
              key insight is that Moss now sits in a narrower band of plausible outcomes than an early-stage startup,
              but price sensitivity still matters a lot.
            claimRefs:
              - CV013
              - CV014
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV003
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV033
              - CV034
              - CV035
      - number: '8.5'
        title: Comparable company framing
        blocks:
          - type: paragraph
            body: >-
              No single comparable perfectly matches Moss. Adyen, Payoneer, and Nu Holdings are useful because they show
              how public markets currently price large payment and fintech infrastructure businesses, but they are much
              larger, more mature, and more fully disclosed than Moss. They are therefore anchors, not peers in the
              strict sense. Airwallex is a closer directional comp because it combines payment infrastructure with
              adjacent financial workflows and continues to attract private capital at scale. Even there, the fit is
              imperfect because Airwallex is more global and significantly larger on ARR. The right comp framework is
              therefore blended: use public companies to cap optimism and private high-growth fintechs to preserve
              realism about upside. On that blended view, Moss’s €1B+ mark is understandable, but it is not obviously
              cheap.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV032
