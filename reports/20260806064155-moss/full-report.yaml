      - number: '4.3'
        title: Cost structure, margin drivers, and what public data still cannot prove
        blocks:
          - type: paragraph
            body: >-
              Moss’s cost structure likely sits between SaaS and regulated payment infrastructure. On the revenue side,
              software subscriptions should be high-margin; on the cost side, card issuance, partner rails, compliance,
              fraud/risk operations, underwriting, support, implementation, and AI/data infrastructure all create drag
              that pure workflow SaaS vendors do not face. The EU interchange regime also caps core card economics for
              consumer debit and credit transactions, which is a reminder that European card margin upside is
              structurally narrower than in the U.S. Moss can offset that with software ARPA, AP monetization,
              FX/payment services, and financing products, but that only helps if gross margins remain healthy and
              credit losses stay contained. Public evidence is insufficient on both counts. There is no audited gross
              margin, no disclosed loss rate, no take-rate by spend, and no realized pricing data by customer cohort.
              The right underwriting posture is therefore to treat the revenue model as promising but not yet
              quality-proven.
