      - number: '3.2'
        title: Capability, packaging, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              On feature breadth, Moss is stronger than simple card-and-expense tools because it combines AP,
              reimbursements, approvals, and AI pre-accounting in one stack. Spendesk and Payhawk are the closest
              European matches on breadth; Ramp is broader still but U.S.-centered; Qonto and Airwallex approach the
              problem from the business-account or payments-infrastructure side; and Soldo remains more
              spend-control-led than AP-led. Packaging matters because Moss starts at SME-friendly price points with
              modularity, while several competitors either require a sales process, bundle pricing into broader plans,
              or monetize through larger financial-product ecosystems. Trust posture also matters in this category
              because buyers are delegating money movement, data access, and accounting workflows. Moss’s
              BaFin-regulated issuer model and German finance workflow fit are meaningful strengths against vendors that
              rely more heavily on partner-bank rails or are optimized first for non-German accounting contexts.
