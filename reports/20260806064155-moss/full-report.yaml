chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Moss operates through a dual-entity structure anchored in Berlin. Nufin GmbH runs the website, platform,
              and mobile app from Saarbrücker Str. 37A in Berlin, while Moss GmbH is the regulated e-money institution
              that issues Moss cards and provides payment services under BaFin licence number 159024. The company was
              founded in 2019 by Ante Spittler, Anton Rummel, Ferdinand Meyer, and Stephan Haslebacher and officially
              launched its first product in mid-2020 as a corporate-card-led spend platform for German startups before
              moving up-market into SMEs. Today Moss sells a modular finance-operations stack that combines corporate
              cards, accounts payable, reimbursements, budgeting, approvals, accounting automation, and AI-powered
              pre-accounting. Its pricing and product design suggest a revenue model blending software platform fees,
              transaction-volume fees, card economics, and credit-linked monetisation rather than a pure subscription
              SaaS model.
