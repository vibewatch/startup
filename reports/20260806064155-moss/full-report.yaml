              Moss is not operationally standalone. Public materials make clear that partner infrastructure matters in
              several places: Mastercard for card issuance, Airwallex for UK banking capabilities, and major accounting
              systems such as DATEV, NetSuite, and Business Central for customer workflow completion. None of those
              dependencies is inherently unhealthy; in fintech they are normal. The issue is transmission. If a
              regulatory, commercial, or technical disruption affects one of these rails, customers do not experience it
              as a narrow vendor problem. They experience it as a failure of Moss to control spend, reconcile books, or
              settle payments. Economics add a second dependency layer. European interchange regulation structurally
              constrains card monetisation, which helps explain why Moss has expanded into higher-value software
              workflows and AI-led automation. That strategy is sensible, but it also means the business case depends on
