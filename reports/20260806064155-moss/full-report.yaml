companyProfile:
  summary: >-
    Moss was founded in Berlin in 2019 by Ante Spittler, Anton Rummel, Ferdinand Meyer, and Stephan Haslebacher as a
    corporate-card and spend-control platform for German startups and SMEs. It has since expanded into a broader
    finance-operations suite spanning cards, accounts payable, reimbursements, approvals, controlling,
    procurement-adjacent workflows, accounting integrations, and Finance AI. Public 2026 reporting says Moss reached
    5,000+ customers, more than €70M ARR, 350+ employees, and more than 2 million financial transactions per month. In
    August 2026 the company raised a €30M Series C led by Portage at a valuation above €1B, taking total funding to
    roughly €160M. Moss publicly presents itself as a BaFin-regulated e-money institution and ISO/IEC
    27001:2022-certified financial platform.
