  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and who Moss really faces
        blocks:
          - type: paragraph
            body: >-
              Moss no longer competes only against card-led expense tools. The relevant set includes direct European
              spend-management peers such as Spendesk, Payhawk, Pleo, and Soldo; adjacent business-finance platforms
              such as Qonto and Airwallex; U.S. workflow leaders such as Ramp and Brex that shape buyer expectations;
              and status-quo substitutes such as bank cards, spreadsheets, ERP workflows, and travel-led platforms like
              Navan. The category is converging around one promise: a finance team should manage cards, invoices,
              reimbursements, approvals, analytics, and increasingly AI-assisted bookkeeping from one system. That
              convergence helps Moss because its product has already expanded well beyond corporate cards, but it also
              means buyers can compare Moss against better-capitalized or better-distributed platforms whose starting
              point was banking, treasury, travel, or procurement rather than AP automation.
