            claimRefs:
              - CV001
              - CV008
              - CV017
              - CV018
              - CV020
              - CV021
              - CV022
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV008
              - CV025
              - CV033
              - CV035
      - number: '8.6'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The final judgment is that Moss is investable as a company but not yet clearly underwritten as a price.
              That distinction is important. Recent funding, credible scale, and a broadened finance platform argue that
              the company belongs on a serious late-stage watchlist. But the missing public evidence—audited operating
              detail, margin structure, preference terms, customer economics, and risk KPI depth—means investors should
              still treat the latest valuation as something to verify rather than simply accept. The most valuable next
              diligence steps are straightforward: reconcile ARR to audited statements, understand module mix and cohort
              expansion, quantify partner and payment economics, and review the Series C preference stack. A buy case
              strengthens if those requests confirm durable software-like economics. The thesis weakens quickly if
              growth quality disappoints, if financing terms prove investor-protective in a way that hurts new entrants,
              or if operating risks interrupt monetization of the AI suite.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
