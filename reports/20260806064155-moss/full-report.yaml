    sections:
      - number: '7.1'
        title: Regulatory and legal posture
        blocks:
          - type: paragraph
            body: >-
              Moss looks more credible on regulatory posture than many spend-management startups because it does not
              merely imply compliance; it repeatedly foregrounds being a BaFin-regulated e-money institution, ties card
              issuance to Mastercard licensing, and provides a legal centre that separates software services from
              regulated payment services. That is a meaningful positive. It suggests the company understands that the
              product sits inside real-money flows, not just back-office workflow software. At the same time, the
              structure also creates risk complexity. The legal centre shows multiple product surfaces and
              partner-delivered elements, which means that as Moss scales finance AI, AP workflows, cards, wallet, and
              credit-like capabilities, the contractual and supervisory surface grows faster than a single-product SaaS
              business. DORA and the AI Act add another layer: compliance is no longer just about having a licence, but
              about proving resilient operating controls, model governance, and traceable accountability.
