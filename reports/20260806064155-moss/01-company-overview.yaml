- id: funding-and-capitalisation
  title: Funding history and capitalisation
  body: Moss has advanced through three clearly disclosed financing steps plus a debt facility. The August 2021 Series A extension added $29 million (roughly €25 million) at a $264 million valuation and brought total capital to more than $64 million. The January 2022 Series B raised €75 million ($86 million) at a valuation above €500 million and lifted total funding to roughly €130 million. In September 2023, HSBC Innovation Banking UK extended a debt facility of up to €50 million to fund European expansion and credit capacity. In August 2026, Moss closed a €30 million Series C led by Portage with Cherry Ventures participation, reaching a valuation north of €1 billion. The cleanest interpretation of the conflicting total-funding figures is that the about page's “180M raised” includes the HSBC debt facility, while the “~€160M” equity narrative refers only to primary fundraising before debt. Investors publicly linked to Moss across rounds include Valar Ventures, Cherry Ventures, Global Founders
    Capital, Tiger Global, A-Star, and Portage.
