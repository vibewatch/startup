  title: Regulated shell plus workflow breadth is a real moat
  body: Moss is not just another card UI. The BaFin-regulated EMI, debit and credit funding options, deep accounting/ERP integrations, and a product set spanning cards, AP, reimbursements, controls, and AI give it more workflow ownership than single-feature expense tools.
  claimRefs:
  - CO002
  - CO003
  - CO021
  - CO026
  - CO028
  - CO034
- calloutType: risk
  title: Freshness drift in public KPIs is already visible
  body: The official about page still shows 280+ employees and 10,000+ businesses served, while August 2026 coverage cites 350+ employees and 5,000+ customers. That mismatch does not disprove traction, but it does mean investors should demand a reconciled KPI pack rather than rely on website copy.
