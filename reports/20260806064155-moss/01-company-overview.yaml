- id: founders-and-governance
  title: Founders, leadership, and governance
  body: 'Founder continuity is a strength: Ante Spittler remains the public face and CEO, while Anton Rummel, Ferdinand Meyer, and Stephan Haslebacher remain associated with the founding cohort and early product-market buildout. Public legal disclosures name Ante Spittler, Anton Rummel, and Max Ferdinand Meyer as managing directors of Nufin GmbH, while Moss GmbH lists Stephan Haslebacher, Jan Stechele, and Alexander Thomas Hoffmann as managing directors. Moss has progressively professionalised risk and compliance leadership as it became a regulated financial institution; a 2025 trust article is written by the company''s Chief Risk Officer and frames Moss as a regulated financial entity rather than only a SaaS vendor. That said, the public bench remains founder-heavy and opaque relative to its size. There is limited public visibility into board composition, investor seat allocation, succession planning, or the operating authority of non-founder executives, so key-person risk remains meaningful
    even if regulation and institutional investors provide some governance discipline.'
  claimRefs:
