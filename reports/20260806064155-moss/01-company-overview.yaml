company:
  name: Moss
chapter:
  number: 1
  title: Company Overview
  summary: 'Moss is a Berlin-based spend-management fintech founded in 2019 that expanded from a corporate-card product into a broader finance-operations platform spanning cards, accounts payable, reimbursements, budgeting, accounting automation, and Finance AI. Public funding milestones show a rapid ascent from a $29 million Series A extension in 2021 to a €75 million Series B in 2022 and a €30 million Series C in August 2026 that pushed valuation above €1 billion. Current scale evidence is strong but not perfectly consistent: August 2026 media cites 5,000+ customers, 350+ employees, and €70 million+ ARR, while Moss''s about page still shows 10,000+ businesses served, 280+ employees, and €7 billion annual spend, implying either stale website metrics or differing definitions.'
sections:
- id: identity-and-business-model
  title: Identity and business model
  body: Moss operates through a dual-entity structure anchored in Berlin. Nufin GmbH runs the website, platform, and mobile app from Saarbrücker Str. 37A in Berlin, while Moss GmbH is the regulated e-money institution that issues Moss cards and provides payment services under BaFin licence number 159024. The company was founded in 2019 by Ante Spittler, Anton Rummel, Ferdinand Meyer, and Stephan Haslebacher and officially launched its first product in mid-2020 as a corporate-card-led spend platform for German startups before moving up-market into SMEs. Today Moss sells a modular finance-operations stack that combines corporate cards, accounts payable, reimbursements, budgeting, approvals, accounting automation, and AI-powered pre-accounting. Its pricing and product design suggest a revenue model blending software platform fees, transaction-volume fees, card economics, and credit-linked monetisation rather than a pure subscription SaaS model.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
