- id: current-scale-and-metrics
  title: Current scale and operating metrics
  body: 'The strongest current-scale evidence comes from August 2026 reporting around the Series C. EU-Startups says Moss has grown to 5,000+ businesses across Germany, the UK, the Netherlands, and Austria, generates more than €70 million in ARR, and uses AI agents to help customers process more than 2 million transactions per month. FinTech Global adds that the company employs more than 350 people and processes over €6.5 billion in annual spend. Moss''s own about page, however, still advertises 10,000+ businesses served across Europe, 280+ employees, five offices, 49 nationalities, €7 billion annual spend, and 99.99% uptime. Rather than averaging these figures, investors should treat the August 2026 media numbers as the freshest public operating snapshot while preserving the official website discrepancy as an open diligence question about whether Moss is mixing lifetime-served, active-customer, and web-page-staleness definitions. Product evidence confirms the platform has also moved far
    beyond a simple card program: paid plans start at €99 per month, include unlimited users, cards, and invoices, and bundle modules for AP, reimbursements, ERP integration, advanced controlling, and AI pre-accounting.'
