company:
  name: Moss
chapter:
  number: 4
  title: Financials
  summary: 'Moss’s public financial story is attractive but incomplete. The company appears to monetize through a blended model of software subscriptions, payment-card economics, accounts-payable workflow value, and adjacent financing/payment services. Public traction signals are strong—€70M+ ARR, 5,000+ customers, €6.5B+ annual spend, and 2M+ monthly transactions—but the underwriting-critical details remain private: realized pricing, gross margin, loss rates, burn, runway, CAC, retention, and bad-debt exposure. The result is a business that looks more durable than a card-only fintech, yet still needs private-data diligence before investors can price the quality of growth and the capital intensity of its credit and infrastructure stack.'
sections:
- id: revenue-model
  title: Revenue model and pricing architecture
  body: 'Moss does not look like a pure SaaS vendor or a pure card issuer. Public pricing pages show paid software plans starting from €99 per month, plus modular add-ons and free entry points for some workflows. Product pages show monetizable surfaces across cards, AP automation, reimbursements, approvals, intelligence, and international payments. The corporate-cards page adds an important clue: Moss offers both credit and debit products, including flexible repayment cycles and zero interest when repaid on time, which implies that the business model likely combines subscription revenue with interchange, payment-related fees, and possibly credit-linked economics that depend on usage, repayment behavior, and partner-bank or funding costs. That blended model is strategically attractive because it widens ARPA and lowers dependence on any one revenue stream, but it also makes revenue quality harder to assess from public evidence alone.'
  claimRefs:
