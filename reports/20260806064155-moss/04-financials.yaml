    - Paid plans start from €99; free entry points also exist
    - Observed list pricing only
    - What is realized ARPA by segment and module mix?
  - - Card economics
    - Interchange and card usage-related monetization
    - bps or €/transaction
    - Active, but take rate undisclosed
    - Inferred
    - What share of gross profit comes from card activity?
  - - Accounts payable workflow
    - Invoice processing, approval, payment, and accounting automation value
    - €/invoice or bundled platform value
    - Active across product suite; direct pricing not broken out
    - Inferred
    - Is AP monetized as included bundle, add-on, or usage-based?
  - - Payments / FX / wallets
    - Supplier payments, reimbursements, international transfers, FX spread or fees
    - bps / fee per transfer
    - UK wallet and global transfer capabilities publicly described
    - Inferred
    - What gross margin do payment rails contribute?
  - - Credit-related economics
    - Float, short-term financing, or credit product economics
    - spread / fee / interest substitute
    - Credit product exists; 0% interest when repaid on time
    - Low visibility
    - How are credit costs, defaults, and partner economics structured?
  notes: Public evidence supports the existence of these streams, but not their revenue mix.
