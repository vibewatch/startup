- id: traction-and-sales-motion
  title: Public traction and GTM efficiency proxies
  body: 'The public growth signals are unusually strong for a private European spend-management company. August 2026 reporting cites €70M+ ARR, 5,000+ customers, 350+ employees, €6.5B+ annual spend, and 2M+ financial transactions per month via AI agents. Earlier operating datapoints show more than 20,000 issued cards and 250,000 processed transactions by early 2022, plus a quadrupling of customers after the prior round. Moss also said it more than doubled its business in 2023. Those datapoints imply a business that is scaling both software and payment activity. They also support a direct-sales-plus-expansion interpretation: the company likely lands with finance teams on a core workflow and then grows account value through more modules, more cards, more invoice volume, and more entities. Still, GTM efficiency remains mostly opaque. There is no public CAC, payback, gross retention, net retention, or sales-cycle disclosure strong enough to underwrite operating efficiency directly.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  tableRefs:
  - TI003
