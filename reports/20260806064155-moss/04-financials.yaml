    - Cannot underwrite quality of revenue
    - Request gross-margin bridge including network, partner, and support costs
  - - Loss and fraud rates
    - Cannot judge credit risk or operational drag
    - Request bad-debt, charge-off, fraud, and recovery history
  - - Cohort retention metrics
    - Cannot judge expansion durability
    - Request GRR / NRR by segment and first module
  - - CAC payback and sales efficiency
    - Cannot compare Moss with software or fintech peers fairly
    - Request CAC, payback, sales cycle, and win-rate by segment
  - - Facility draw and covenant detail
    - Cannot assess debt dependence
    - Request HSBC facility terms, draw history, and covenant headroom
  notes: Each missing metric is material to valuation and investment sizing.
