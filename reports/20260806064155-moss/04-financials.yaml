- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: 'Moss has clearly had access to capital, but the exact balance-sheet picture remains private. The company raised a $29M Series A extension in 2021, a €75M Series B in 2022, a new debt facility of up to €50M from HSBC Innovation Banking UK in 2023, and a €30M Series C at €1B+ valuation in 2026. The current website’s “€180M funding” figure appears to include debt or other capital sources, while the equity narrative in recent reporting is closer to ~€160M. The debt facility matters because it broadens financing options and supports payment-related credit expansion, but it also adds obligations and raises questions about funding-cost sensitivity. The 2026 Series C is reassuring in one sense: Moss was able to raise at unicorn status rather than obviously as a rescue financing. But without cash, burn, covenant, facility-draw, or runway disclosure, investors cannot conclude much about current balance-sheet strength beyond “capital access exists.”'
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'Moss’s public financial profile supports a constructive but not fully underwritable view. The business is not only selling a corporate card; it appears to be monetizing a broader finance-operations system with meaningful software and workflow value. The scale signals—ARR, customers, spend, transaction volume, and continued capital access—suggest the company has moved beyond experimentation into repeatable commercial traction. The blocker is that nearly every decisive quality metric remains private: realized pricing, gross margin, burn, loss rates, NRR, payback, credit exposure, and facility utilization. That means the public case can support “real business with strong momentum,” but not “fully underwritten economics.” Investors should treat Moss as a business where diligence must shift quickly from storytelling to cohort-quality, funding-cost, and margin-bridge evidence.'
  claimRefs:
  - CI033
  - CI034
  - CI035
  - CI036
