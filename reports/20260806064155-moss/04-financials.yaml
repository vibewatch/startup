  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Gross margin by subscription, interchange, payment rails, and financing exposure.
    whyItMatters: Without a margin bridge, ARR scale cannot be translated into business quality.
    diligencePath: Request monthly gross-margin bridge with partner, network, fraud, support, and infrastructure costs.
    relatedQuestionRefs:
    - QI014
    - QI021
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: credit-exposure
    missingEvidence: Loss, delinquency, fraud, and provisioning metrics for Moss credit and payment activities.
    whyItMatters: A blended fintech model can look SaaS-like on the surface while carrying hidden credit or operational risk.
    diligencePath: Request underwriting policy, loss curves, reserve policy, and charge-off history.
    relatedQuestionRefs:
    - QI015
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
  - type: conflicting-data
    severity: minor
    topic: funding-total-reconciliation
    missingEvidence: A clean reconciliation between the website’s €180M funding figure and the equity-only narrative closer to ~€160M plus debt.
    whyItMatters: Investors need exact capital structure rather than blended marketing totals.
    diligencePath: Request cap table plus debt/facility schedule tied to each announcement.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gTM-efficiency
    missingEvidence: CAC, payback, GRR, NRR, and sales cycle by segment and first module.
    whyItMatters: Without cohort economics, growth quality remains inferential.
    diligencePath: Request go-to-market cohort dashboard and CRM-coded win/loss reasons.
    relatedQuestionRefs:
    - QI008
    - QI021
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
