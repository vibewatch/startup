- id: named-proof
  title: Named customer proof and what it actually shows
  body: 'The named proof is stronger than a simple logo wall, but weaker than a full customer analytics package. The customer-stories page publicly attributes one day of admin saved per month to Pizza Pilgrims, a 70% reduction in month-end close time to Snocks, reduced production spend and time savings to Tonny Media, and simplified VAT recovery to MORI. The AIOS case study is the richest narrative proof: it describes automated accounting, DATEV synchronization, up to €2.5 million card limits, 60-day payment terms, four hours saved per client, and around 30% finance-team working-time savings. Individual customer-story pages for Pizza Pilgrims, Snocks, MORI, Tonny Media, Hive, Mercanis, Team Picnic PostNL, and Venture Beyond at least confirm named deployments even when the fetched article body is thin. This is enough to establish that public customer proof exists across multiple buyer archetypes, but it is not enough to measure revenue concentration, renewal, or module-depth distribution.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
