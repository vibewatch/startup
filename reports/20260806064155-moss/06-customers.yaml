company:
  name: Moss
chapter:
  number: 6
  title: Customers
  summary: Moss has credible public evidence of real customer adoption, but the evidence is unevenly distributed. Company and media sources support a broad European SME / mid-market customer base with at least 5,000 customers, while the customer-stories surface provides named proof across different use cases such as hospitality, ecommerce, media, accounting, and multi-entity finance. The strongest outcome evidence comes from a small set of public case studies—especially AIOS, Pizza Pilgrims, Snocks, MORI, and Tonny Media—while retention, concentration, and revenue exposure remain largely private. Investors can underwrite “real usage and cross-vertical proof,” but not yet “fully visible durability and concentration profile.”
sections:
- id: base-segmentation
  title: Customer base and segmentation
  body: 'Moss serves business customers rather than consumers, and its public surface consistently frames the product around finance teams inside SMEs and mid-market companies. Recent August 2026 reporting cites 5,000+ customers across Germany, the UK, the Netherlands, and Austria, while current careers and about pages use broader “10,000+ businesses served” language that is probably based on a different denominator. The practical takeaway is that Moss clearly has a meaningful multi-country customer base in European SMB finance operations, even if the exact active-customer definition is not fully reconciled publicly. Named public customers and case-study titles point to a broad mix of use cases: hospitality, ecommerce, media, accounting services, multi-entity operations, and startup / scale-up finance teams. That diversity is helpful because it suggests Moss is not locked to one narrow vertical, but it also means investors need segment-level revenue and retention data to know where the economic
    center of gravity really sits.'
  claimRefs:
