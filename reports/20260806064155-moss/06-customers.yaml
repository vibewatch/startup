- id: retention-and-durability
  title: Retention, satisfaction, and durability
  body: 'Public durability evidence is the weakest part of the customer chapter. Moss’s customer-stories page advertises a G2 score of 4.7, and Software Advice review text is broadly positive about ease of use, value, and customer support. Those are directionally encouraging signals, but they are not substitutes for GRR, NRR, renewal rates, contract lengths, expansion cohorts, or churn reasons. Public evidence also does not make customer production maturity uniform: some customer pages show strong outcome statements, while others are mostly title-level proof. That means the right interpretation is not “customer quality is unknown,” but “customer quality is only partially observable publicly.” Retention could be strong if multi-module finance workflows create stickiness; it could also be weaker in smaller or lighter-use accounts where switching costs are lower. Only cohort data can settle that question.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion logic and concentration risk
  body: 'Moss’s expansion logic is easy to see conceptually and hard to measure financially. The product is designed for land-and-expand: cards can lead into reimbursements, AP can lead into approvals and accounting automation, and finance teams can widen deployment across entities, departments, and geographies. Public customer proof across accounting, hospitality, ecommerce, and media suggests the product can travel across different workflows. What is missing is concentration visibility. No public data reveals top-customer share of ARR, the importance of any one channel or partner, or whether a small number of very large accounts contribute disproportionately to payment volume or expansion. The chapter therefore supports a positive view on real customer adoption and plausible expansion, but it leaves concentration and renewal risk as major diligence asks.'
