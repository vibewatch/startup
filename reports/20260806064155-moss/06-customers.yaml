- id: adoption-trajectory
  title: Adoption trajectory and public usage signals
  body: Public adoption signals show that Moss has moved well beyond early pilot status. Media and company reporting track the business from 2021–2022 customer quadrupling and 20,000+ cards issued to 2026 scale metrics of 5,000+ customers and millions of monthly AI-assisted financial events. The customer-stories hub also indicates that Moss is willing to present ROI-style outcomes rather than only logos, including examples such as one day of admin saved per month, month-end close reduction, and VAT recovery. That is useful evidence of active usage, but it remains partial. The public surface does not disclose how many customers are fully multi-module, what portion of accounts are card-only versus AP-heavy, how many are live in production across multiple entities, or what share of the base has adopted AI features. As a result, the adoption trajectory is clearly real, but not fully segmented.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
