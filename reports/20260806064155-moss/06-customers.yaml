- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Module expansion from cards into AP and reimbursements
    - Unknown share of revenue from largest accounts
    - Could lift NRR or mask concentration
    - Request ARR by module and account decile
  - - Multi-entity rollout
    - Unknown dependence on a few heavy-usage customers
    - Could improve stickiness but increase customer-specific implementation risk
    - Request entity-count and volume distribution
  - - Geographic expansion to UK / NL / Austria
    - Partner dependence in some markets
    - May create operational leverage or dependency risk
    - Request revenue split by country and partner exposure
  - - Partner and advisory workflows
    - Channel-driven concentration not public
    - Could accelerate adoption or create lumpy indirect revenue
    - Request partner-sourced pipeline and retained ARR
  - - AI and accounting automation attach
    - Unknown feature-depth concentration
    - Could drive expansion if sticky
    - Request attach rate and active-usage cohorts by feature
  notes: Expansion logic is evident; concentration remains largely opaque.
