  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-reliability
    missingEvidence: Production reliability metrics, override rates, rollback behavior, and severe-error incidence for the Coding Agent.
    whyItMatters: Model precision headlines are useful, but accounting workflows fail on edge cases, not averages.
    diligencePath: Request offline and online evaluation methodology, override rates, incident examples, and rollback playbooks.
    relatedQuestionRefs:
    - QE006
    - QE024
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: implementation-maturity
    missingEvidence: Implementation duration, go-live failure rates, and connector issue frequency by ERP/accounting system.
    whyItMatters: Broad integration surfaces only matter if deployments stay reliable across heterogeneous stacks.
    diligencePath: Request implementation KPI dashboard and support ticket taxonomy by connector.
    relatedQuestionRefs:
    - QE010
    - QE024
    relatedTableRefs:
    - TE002
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: security-execution
    missingEvidence: Penetration-test summaries, incident history, and audit findings behind public trust claims.
    whyItMatters: Public controls show intent and baseline design, but not operational quality under stress.
    diligencePath: Request recent pen-test summaries, incident register, and certificate scope documentation.
    relatedQuestionRefs:
    - QE011
    - QE024
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: TE001 module matrix is representative rather than exhaustive.
    missingEvidence: Complete internal SKU/module list including procurement, payment, analytics, and country-specific differences.
    whyItMatters: Module boundaries affect pricing, implementation scope, and attach-rate analysis.
    diligencePath: Request the internal product catalogue and module adoption data by segment.
    relatedQuestionRefs:
    - QE002
    - QE020
    relatedTableRefs:
    - TE001
