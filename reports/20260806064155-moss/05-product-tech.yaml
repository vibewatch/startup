- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Moss solution
  - Measurable benefit
  - Limitation
  rows:
  - - Issue employee spend access
    - Manual card admin or shared cards
    - Virtual/physical cards with granular controls
    - Faster access with policy enforcement
    - Needs disciplined receipt behavior
  - - Collect and code receipts
    - Email chasing and manual entry
    - Receipt collection plus OCR/AI categorisation
    - Less manual follow-up and cleaner books
    - Accuracy varies with training data quality
  - - Approve invoices and expenses
    - Email chains and fragmented tools
    - Integrated approvals and policy routing
    - More visible control path and faster close
    - Approval bottlenecks still depend on user behavior
  - - Sync finance data into ERP
    - CSV export and manual booking
    - Direct integrations with accounting systems
    - Lower reconciliation effort and fewer booking errors
    - Mapping work still requires implementation effort
  - - Run multi-entity finance ops
    - Multiple tools and local workarounds
    - One control layer for spend, AP, and supporting docs
    - Higher consistency across teams
    - Complex entities still need careful setup
  notes: Benefits are workflow-level and evidence-backed, but not audited ROI claims.
