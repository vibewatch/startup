  topStrengths:
    - Fresh August 2026 Series C at €1B+ provides a current market-clearing price rather than a stale private mark
    - €70M+ ARR and 5,000+ customers suggest genuine operating scale, not pre-revenue narrative financing
    - >-
      Product breadth across cards, AP, reimbursements, controls, integrations, and Finance AI expands wallet-share
      potential
    - >-
      European regulatory and accounting fit, including BaFin-regulated status and DATEV-friendly workflows, supports
      local defensibility
    - >-
      Access to both equity and debt capital gives Moss more strategic flexibility than earlier-stage spend-management
      peers
  topRisks:
    - >-
      Limited public disclosure on audited revenue quality, margins, and cohort retention makes the latest valuation
      hard to underwrite precisely
    - >-
      Critical dependencies on regulated status, card/payment partners, and accounting integrations can transmit quickly
      into customer and valuation risk
    - >-
      Finance AI upside is strategically important, but public evidence does not yet prove durable monetization or low
      error rates at scale
    - >-
      Competitive pressure from larger global and European fintechs could compress pricing or raise customer-acquisition
      costs
    - >-
      Series C preference terms and dilution protections are undisclosed, so entry economics for new investors remain
      opaque
  unresolvedGaps:
    - Audited ARR bridge, gross margin, EBITDA profile, and module-level revenue mix are not public
    - Net revenue retention, churn, cohort expansion, and module-attach data are not publicly disclosed
    - Series C liquidation preferences, anti-dilution terms, and cap-table waterfall are undisclosed
    - Partner concentration and unit economics by payment or banking rail are not public
    - Historical incident, fraud-loss, and chargeback metrics are not publicly available
