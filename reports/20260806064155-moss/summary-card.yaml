  headline: >-
    Moss has credible late-stage fintech scale, differentiated European finance-workflow fit, and a fresh unicorn price
    anchor, but the current public record still leaves too much opacity on audited economics and capital-structure terms
    to justify a high-conviction buy at the latest mark.
