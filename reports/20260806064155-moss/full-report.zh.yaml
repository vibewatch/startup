      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家通常是财务负责人或财务控制负责人，日常工作流归 AP 或财务运营团队负责，用户包括员工和预算负责人，付款方则是公司本身。Moss
              产品材料明确写给现代中小企业财务团队，而不是消费者。采用路径通常从一个痛点工作流开始——卡片、AP 或报销——当系统成为支出数据的单一事实源后，再扩到审批、预算、采购和 ERP
              集成。这种先落地后扩张的打法与更大市场一致：Spendesk、Payhawk、Ramp、Brex、Soldo 和 Qonto 等竞争对手现在也都销售统一工作流，而不是单一模块。Moss 面向卡片或 AP
              的免费入门方案降低了小团队采用摩擦；带无限用户和附加模块的付费方案，则契合正在扩张的欧洲中小企业买家画像——他们想要集中控制，却不想承担企业级 ERP 的复杂度。
