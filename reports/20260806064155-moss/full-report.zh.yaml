      - number: '8.3'
        title: 融资背景与当前价格含义
        blocks:
          - type: paragraph
            body: >-
              Moss 现在有两个很强的公开估值锚：2022 年 Series B 轮约 $573M，以及 2026 年 8 月 Series C 轮 €1B+。后一轮不只是账面沿用旧价格；在比 2021-2022
              年高峰期更挑剔的市场里，它是一次新的定价事件。这一点很关键。新融资比过时的私募估值标记更该被赋予权重。即便如此，这轮融资的信息量仍不完整，因为投资人不知道新资本附带的详细优先权结构、反稀释条款和治理权利。公开登记资料也没有足够新的审计经营细节，无法把
              ARR 主张转成可靠的内在价值模型。因此，当前价格最好被当作市场出清的参考点，而不是上行空间仍然充足的证明。投资人应当认真对待这个锚，但不能让它替代投资测算。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV027
              - CV028
          - type: table
            tableRef: TV005
            claimRefs:
              - CV028
              - CV032
              - CV035
              - CV040
      - number: '8.4'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景分析有用，因为 Moss 已经成熟到不能只买故事，却又私有到无法精确建模。基准情形下，当前估值大致公平：ARR 稳定扩张，AI
              和工作流套件改善收入质量，没有重大监管或合作伙伴问题打断执行。这支撑围绕独角兽估值聚集的价值区间。牛市情形下，Moss 证明自己能比预期更快突破 €70M ARR，深化多模块渗透，并让 Finance AI
              具备商业意义，而不只是营销差异化。这会支撑明确的估值上调。熊市情形下，公司不需要爆出丑闻才会失去价值；增长放慢、客户 cohort 质量走弱、伙伴摩擦，或资本市场更谨慎，都足以压缩倍数。关键是，Moss
              现在的合理结果区间比早期创业公司窄，但价格敏感性依然很高。
            claimRefs:
              - CV013
              - CV014
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV003
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV033
              - CV034
              - CV035
      - number: '8.5'
        title: 可比公司框架
        blocks:
          - type: paragraph
            body: >-
              没有一个可比公司能完全贴合 Moss。Adyen、Payoneer 和 Nu Holdings
              有参考价值，因为它们展示了公开市场如何给大型支付和金融科技基础设施公司定价；但它们规模更大、成熟度更高、披露也完整得多。因此，它们是锚，不是严格意义上的同业。Airwallex
              的方向性更接近：它把支付基础设施和相邻金融工作流结合起来，也仍在大规模吸引私募资本。即便如此，匹配也不完美，因为 Airwallex 全球化程度更高，ARR
              规模也大得多。因此，正确的可比框架应当混合使用：用上市公司压住乐观预期，用高增长私营金融科技公司保留对上行空间的现实感。按这个混合视角，Moss 的 €1B+ 估值可以理解，但并不明显便宜。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
