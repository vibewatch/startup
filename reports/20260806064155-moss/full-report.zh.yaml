        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Moss 的正向估值案例始于近期规模与战略宽度的罕见组合。公开报道称，公司在 August 2026 Series C 轮前后越过 €70M ARR、5,000+ 客户、350+ 员工和 2M+
              月交易。这不是一个只靠愿景定价的种子阶段故事。业务也似乎正从发卡扩到支出控制、AP 自动化、报销、会计集成和 Finance
              AI，这为提高单客户收入和更可防守的工作流主导权打开路径。反向逻辑同样重要。同一组公开证据仍缺少审计后财务披露、优先权细节、队列质量和硬利润率数据。在 €1B+
              估值上，投资人支付的不是低信息折扣，而是一段后期成长故事；这家公司必须继续在受监管支付和财务自动化两条线上干净执行。
