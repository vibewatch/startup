              Central 等主要会计系统则完成客户工作流。这些依赖本身并不有害；在金融科技里它们很正常。问题在于传导。如果监管、商业或技术扰动影响其中一条通道，客户不会把它体验成一个狭窄供应商问题；他们会体验为 Moss
