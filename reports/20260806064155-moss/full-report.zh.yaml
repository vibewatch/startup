      - number: '3.2'
        title: 能力、包装与监管姿态
        blocks:
          - type: paragraph
            body: >-
              功能宽度上，Moss 强于简单的卡片加费用工具，因为它把 AP、报销、审批和 AI 预记账组合在一个栈里。Spendesk 和 Payhawk 是宽度上最接近的欧洲对手；Ramp 更宽，但中心在美国；Qonto
              和 Airwallex 从商业账户或支付基础设施侧切入这个问题；Soldo 则仍更偏支出控制，而不是 AP。包装很重要，因为 Moss
              以适合中小企业的价格点和模块化起步，而几家竞争对手要么需要销售流程，要么把定价打包进更宽方案，要么通过更大的金融产品生态变现。信任姿态在这个品类同样重要，因为买家把资金流动、数据访问和会计工作流交给供应商。Moss
              受 BaFin 监管的发行方模式，以及与德国财务工作流的适配，是它相对那些更依赖合作银行通道、或优先针对非德国会计语境优化的供应商的有意义优势。
