            body: >-
              Moss 显然能拿到资本，但确切资产负债表图景仍是私有信息。公司在 2021 完成 $29M Series A 扩展轮，2022 完成 €75M Series B 轮，2023 获得 HSBC
              Innovation Banking UK 最高 €50M 的新债务额度，并在 2026 以 €1B+ 估值完成 €30M Series C 轮。当前网站的 “€180M
              融资”数字似乎包含债务或其他资本来源，而近期报道里的股权叙事更接近 ~€160M。债务额度很重要，因为它拓宽融资选项，并支持支付相关信贷扩张；但它也增加义务，并引出资金成本敏感度问题。2026 Series C
              轮在一个意义上令人安心：Moss 是以独角兽身份融资，而不是明显的救援融资。但如果没有现金、烧钱速度、契约条款、额度提款或现金跑道披露，投资人无法在“资本渠道存在”之外，对当前资产负债表强度得出太多结论。
