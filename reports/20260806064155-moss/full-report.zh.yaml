      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              创始团队延续性是优势：Ante Spittler 仍是公开门面和 CEO，Anton Rummel、Ferdinand Meyer 和 Stephan Haslebacher
              也仍与创始队列和早期产品市场搭建相关。公开法律披露列出 Ante Spittler、Anton Rummel 和 Max Ferdinand Meyer 为 Nufin GmbH 董事总经理，Moss GmbH
              则列出 Stephan Haslebacher、Jan Stechele 和 Alexander Thomas Hoffmann 为董事总经理。随着 Moss
              成为受监管金融机构，公司逐步把风险和合规领导层专业化；一篇 2025 信任文章由公司首席风险官撰写，将 Moss 定义为受监管金融实体，而不只是 SaaS
              供应商。话虽如此，以公司规模看，公开管理梯队仍偏创始人主导且不透明。董事会构成、投资人席位分配、接班规划、非创始高管运营权限等信息公开能见度有限，因此即便监管和机构投资人提供一定治理约束，关键人风险仍然有意义。
