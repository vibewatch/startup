  customerFocus: 面向欧洲中小企业和中型市场公司的财务团队，德国足迹最清晰，并已扩张到 UK、Netherlands 和 Austria。公开证据覆盖酒店、电商、媒体、会计服务合作伙伴和多实体财务团队。
  businessModel: 混合型金融科技软件模式，收入来自平台订阅价值、工作流变现、卡片 / 交换费经济账、支付相关费用，以及在产品结构和资金线支持下可能产生的信贷相关收入。战略方向不是只靠发卡，而是借多模块采用拿到更高钱包份额。
