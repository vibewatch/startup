      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Moss 通过以 Berlin 为锚点的双实体结构运营。Nufin GmbH 位于 Berlin Saarbrücker Str. 37A，负责网站、平台和移动应用；Moss GmbH
              则是受监管的电子货币机构，依据 BaFin 牌照号 159024 发行 Moss 卡并提供支付服务。公司由 Ante Spittler、Anton Rummel、Ferdinand Meyer 和 Stephan
              Haslebacher 于 2019 创立，mid-2020 正式推出首个产品，最初以企业卡切入德国初创公司的支出平台，随后上移到中小企业。今天 Moss
              销售的是模块化财务运营栈，把企业卡、应付账款、报销、预算、审批、会计自动化和 AI 驱动的预记账组合在一起。它的定价和产品设计显示，收入模式混合了软件平台费、交易量费用、卡片经济账和信贷相关变现，而不是纯订阅
              SaaS。
