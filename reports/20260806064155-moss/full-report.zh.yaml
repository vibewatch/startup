      - number: '2.2'
        title: 市场规模与增长观察口径
        blocks:
          - type: paragraph
            body: >-
              市场显然很大且仍在复合增长，即便公开研究口径衡量的东西略有不同。The Business Research Company 估算，全球支出管理平台市场 2026 年为 $29.19 billion，高于 2025
              年的 $25.78 billion，并将在 2030 年达到 $45.93 billion，CAGR 为 12%。Intel Market Research 估算，更窄的企业费用卡和支出管理市场 2026 年为
              $14.05 billion，高于 2025 年的 $12.06 billion，并预计到 2034 年达到 $48.1 billion，CAGR 为 16.5%。OMR Global 估算，欧洲 AP
              自动化市场 2024 年为 $777.7 million，到 2035 年为 $2.53 billion，说明即使不加入卡片、报销或采购，仅发票处理软件在欧洲也已有可观规模。对 Moss
              来说，正确解读不是把所有市场研究数字相加，而是把它们当成叠放的镜头：AP 自动化定义最低的欧洲工作流池，全球支出平台定义更宽的软件机会，统一支出财务平台定义市场前进方向。
