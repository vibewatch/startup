            body: >-
              对一家私营欧洲支出管理公司来说，公开增长信号异常强。August 2026 报道引用 €70M+ ARR、5,000+ 客户、350+ 员工、€6.5B+ 年支出，以及通过 AI 智能体每月处理 2M+
              笔财务交易。更早运营数据点显示，到 early 2022，公司已发行超过 20,000 张卡、处理 250,000 笔交易，并在上一轮融资后客户数翻了两番。Moss 还称其 2023
              业务增长超过一倍。这些数据点意味着，业务正在同时扩张软件活动和支付活动，也支持“直接销售加扩张”的解读：公司可能先在财务团队的核心工作流落地，再通过更多模块、更多卡片、更多发票量和更多实体提高账户价值。尽管如此，GTM
              效率大多仍不透明。公开材料没有 CAC、回本周期、总留存率（GRR）、净留存率（NRR）或销售周期披露，足以直接支撑运营效率判断。
