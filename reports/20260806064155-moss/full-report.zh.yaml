      - number: '5.4'
        title: 差异化、依赖与开发者信号
        blocks:
          - type: paragraph
            body: >-
              Moss 的差异化似乎来自三层协同：欧洲特定监管和会计适配，横跨卡片和 AP 的模块化工作流宽度，以及针对真实会计行为调校、而不是泛聊天交互的 AI
              层。公开从业者信号支持这样一个判断：公司在这个领域及周边认真建设。招聘页把 Moss 呈现为一家 300+
              人的欧洲金融科技公司，仍在招聘产品和工程岗位；公司自己的开发者工具支出报告也显示，它有足够数据、分析取向和内部财务可信度，能发布基于真实支出的从业者式市场观点，而不只是品牌营销。依赖侧同样重要。Moss 依赖
              DATEV、NetSuite 等会计生态，依赖 Coding Agent 文章提到的云和 ML 基础设施，也依赖 UK 市场的 Airwallex
              等外部金融基础设施。这些依赖对金融科技平台很正常，但重要性在于：合作通道若失败或发生战略变化，会影响产品表现、上线速度或经济性。
