      - number: '8.2'
        title: 建议、置信度与入场纪律
        blocks:
          - type: paragraph
            body: >-
              基于目前公开信息，正确判断是「跟踪」，置信度为中等。是跟踪，不是买入：公司质地看起来确实不错，最新融资锚点很新；如果 ARR 继续复利增长，Finance AI
              提高钱包份额，估值倍数仍有机会获得支撑。但买入需要公开资料之外的更多证据。核心问题不是 Moss 弱，而是入场价格已经反映了相当多的成功。估值约为已披露 ARR 的 14
              倍，对一家高增长金融科技软件混合公司并不荒唐；但价格已经够贵，新投资人必须拿到更扎实的收入质量、利润率结构和稀释条款证据。因此，入场纪律比泛泛称赞公司更重要。只要执行继续出色，在当前估值上小幅溢价仍可能成立；但没有更深入尽调，公开信息还不足以支持明显高于最新披露价格的付款。
            claimRefs:
