  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与 Moss 真正面对的对手
        blocks:
          - type: paragraph
            body: >-
              Moss 不再只和卡片驱动的费用工具竞争。相关集合包括 Spendesk、Payhawk、Pleo、Soldo 等欧洲支出管理直接同行；Qonto 和 Airwallex 等相邻商业金融平台；Ramp 和
              Brex 这类塑造买家预期的美国工作流领导者；以及银行卡、电子表格、ERP 工作流和 Navan
              这类差旅主导平台等现状替代方案。这个品类正围绕一个承诺融合：财务团队应能在一个系统里管理卡片、发票、报销、审批、分析，以及越来越多的 AI 辅助记账。融合对 Moss
              有利，因为它的产品早已扩到企业卡之外；但融合也意味着买家可以拿 Moss 去对比资本更足或分销更强的平台，这些平台的起点可能是银行、资金管理、差旅或采购，而不是 AP 自动化。
