            body: >-
              Moss
              的公开财务画像支持建设性但尚不能完全承保的观点。公司卖的不只是企业卡；它似乎在变现一个更宽的财务运营系统，里面有有意义的软件和工作流价值。ARR、客户、支出、交易量和持续资本渠道等规模信号显示，公司已从实验阶段进入可重复商业牵引。阻塞项在于，几乎每个决定性质量指标仍是私有信息：实际定价、毛利率、烧钱速度、损失率、NRR、回本周期、信贷敞口和额度使用率。因此，公开材料可以支持“这是一家势能很强的真实业务”，但不能支持“经济性已被完整承保”。投资人应把
              Moss 视为一家公司：尽调必须迅速从叙事切到队列质量、资金成本和利润率桥接证据。
