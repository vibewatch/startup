  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Moss 真正参与的竞争
        blocks:
          - type: paragraph
            body: >-
              Moss 不是在一个狭窄品类里竞争。它的运营市场至少横跨三个相连的软件和支付层：支出管理平台、应付账款自动化，以及由企业卡支撑的财务运营。Moss
              的产品页和定价显示，公司把卡片、发票捕捉、报销、审批路由、采购式控制、ERP 同步和 AI 预记账作为一个系统销售。这个定位比纯费用管理应用更宽，但比完整 ERP
              或商业银行更窄。因此，清晰的市场边界应包括企业卡、AP、报销、审批和政策控制、可审计的文档管理，以及面向企业财务团队的会计 / ERP
              集成；不包括薪资、总账所有权、广义资金管理系统和消费者银行。现状替代方案仍是电子表格、银行发行卡、邮件审批、被当成工作流系统使用的老旧 ERP，以及差旅或采购等由财务团队手工拼接的单点工具。
