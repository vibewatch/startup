  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Moss 看起来既不是纯 SaaS 供应商，也不是纯发卡方。公开定价页显示，付费软件方案从每月 €99 起，另有模块化附加项，并为部分工作流提供免费入口。产品页展示了可变现表面：卡片、AP
              自动化、报销、审批、智能层和国际支付。企业卡页面还给出一个重要线索：Moss
              同时提供信贷和借记产品，包括灵活还款周期，以及按时还款零利息。这意味着商业模式很可能把订阅收入与交换费、支付相关费用，以及可能的信贷相关经济账结合起来，后者取决于使用量、还款行为、合作银行或资金成本。混合模式在战略上有吸引力，因为它扩大
              ARPA、降低对单一收入流的依赖；但它也让外部只能凭公开证据更难判断收入质量。
