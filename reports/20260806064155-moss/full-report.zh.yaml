              million，并把累计资本推高到超过 $64 million。January 2022 Series B 轮融资 €75 million（$86 million），估值超过 €500
              million，累计融资升至约 €130 million。September 2023，HSBC Innovation Banking UK 提供最高 €50 million
              的债务额度，用于支持欧洲扩张和信贷能力。August 2026，Moss 完成由 Portage 领投、Cherry Ventures 参与的 €30 million Series C 轮，估值超过 €1
              billion。对相互冲突的累计融资数字，最干净的解读是：关于页面的“已融资 180M”包含 HSBC 债务额度，而 “~€160M” 的股权叙事只指债务之前的一级融资。公开与 Moss 各轮融资相关的投资人包括
              Valar Ventures、Cherry Ventures、Global Founders Capital、Tiger Global、A-Star 和 Portage。
