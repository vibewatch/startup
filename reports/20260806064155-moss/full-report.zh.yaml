      - number: '2.4'
        title: 市场为何现在移动，以及什么拖慢采用
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自可见性、控制、合规和人力杠杆。外部研究反复把实时支出可见性、政策执行、AI 驱动自动化、ERP 集成和云部署列为主要增长引擎。欧洲还有独特的监管顺风：European Commission
              将电子发票视为关键数字化抓手，2025 国别说明书跟踪不断扩大的 B2B 和 B2C 强制要求，ViDA 之后的环境也给成员国更多空间，让它们可在 2030 跨境义务前先在国内强制结构化发票。Moss
              自己的调研证据显示，财务团队已在数字化，但仍对 AI 自主性感到不安。主要采用约束同样清楚：集成成本、工作流变更阻力、安全和合规负担、碎片化供应商栈，以及向仍能忍受电子表格的小团队证明 ROI 的难度。对
              Moss 来说，这些约束很关键，因为公司销售的正是受监管工作流改变最难的地方：资金流动、发票获批、月结数据必须经得起审计的时刻。
