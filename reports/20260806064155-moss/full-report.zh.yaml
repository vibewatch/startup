      - number: '2.5'
        title: 市场结构对 Moss 意味着什么
        blocks:
          - type: paragraph
            body: >-
              Moss 的优势在于原生贴合欧洲财务环境，而不是事后把美国产品改造成欧洲版。OMR 称，公司母国 Germany 已经在 AP
              自动化采用上领先欧洲，欧洲电子发票政策也在把整个大陆推向更结构化、可审计的工作流。这有利于拥有 DATEV 深度、德国监管定位和偏 AP 产品宽度的供应商。与此同时，市场融合也是双刃剑：差旅、采购、卡片、AP 和
              AI 被打包到一起后，Moss 必须面对预算更大或分销更强的大套件。这个品类因此有吸引力，但也很残酷。对 Moss
              更理性的市场论点不是“赢者通吃”，而是“欧洲中小企业财务栈里的工作流主导权正在快速再分配，能把合规适配、AI 辅助和模块化扩张结合起来的供应商，可以在市场完全标准化之前拿到有意义的收入。”
