  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Moss 服务企业客户，而不是消费者；它的公开表面也一直把产品围绕中小企业和中型市场公司的财务团队来讲。近期 August 2026 报道引用 Germany、UK、Netherlands 和 Austria 的
              5,000+ 客户，而当前招聘页和关于页面使用更宽的“10,000+ 服务企业”表述，可能基于不同分母。实际结论是，Moss
              显然在欧洲中小企业财务运营里拥有有意义的多国客户基础，即便精确活跃客户定义尚未公开对账。公开具名客户和案例研究标题指向广泛用例：酒店、电商、媒体、会计服务、多实体运营，以及初创 /
              规模化公司财务团队。这种多样性有帮助，因为它说明 Moss 没被锁在一个狭窄垂直里；但它也意味着投资人需要细分市场层面的收入和留存数据，才能知道经济重心真正落在哪里。
