            body: >-
              最具体的技术证据来自 Moss 自己的工程文章和集成文档。Coding Agent 文章描述了一套系统：它用会计人员操作作为反馈，为每个组织重新训练模型；把模型工件存入 Google Cloud 存储桶；用
              Vertex AI 训练；并用 Airflow 编排管线。Moss 称该系统每月自动编码接近 2 million 个字段，针对自动应用编码目标至少 95% 精度；许多客户和维度可超过 98%
              精度，几个月后部分场景手工编码降到 25% 以下。这是具体运营模型，不是模糊的 AI
              品牌。更宽的架构似乎把应用层工作流控制、OCR、政策逻辑、会计同步和模型辅助编码，叠在受监管支付和卡片基础设施之上。主要技术尽调问题不是 Moss 有没有 AI
              功能，而是这些模型输出能否稳健泛化到混乱、低量或持续变化的客户会计模式。
