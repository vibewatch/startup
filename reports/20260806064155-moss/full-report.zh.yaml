        title: 成本结构、利润率驱动，以及公开数据仍无法证明的事项
        blocks:
          - type: paragraph
            body: >-
              Moss 的成本结构很可能介于 SaaS 和受监管支付基础设施之间。收入侧，软件订阅应有高毛利；成本侧，发卡、合作通道、合规、欺诈 / 风险运营、承保、支持、实施和 AI /
              数据基础设施都会形成拖累，这是纯工作流 SaaS 供应商不需要面对的。EU 交换费制度还对消费者借记和信用交易的核心卡片经济账设限，提醒投资人欧洲卡片利润率上行空间在结构上窄于美国。Moss 可以用软件
              ARPA、AP 变现、FX /
              支付服务和融资产品来抵消，但只有在毛利率保持健康、信贷损失受控时才有用。公开证据在两方面都不足：没有审计后毛利率、没有披露损失率、没有按支出计算的抽成率，也没有按客户队列实现的定价数据。因此，正确的承保姿态是把收入模式视为有潜力，但质量尚未被证明。
