companyProfile:
  summary: >-
    Moss 于 2019 在 Berlin 创立，创始人为 Ante Spittler、Anton Rummel、Ferdinand Meyer 和 Stephan
    Haslebacher，最初面向德国初创公司和中小企业做企业卡和支出管控平台。此后公司扩成更宽的财务运营套件，覆盖企业卡、应付账款、报销、审批、财务控制、采购相关流程、会计集成和 Finance AI。2026
    公开报道显示，Moss 已达到 5,000+ 客户、超过 €70M 年经常性收入（ARR）、350+ 员工，每月处理超过 2 million 笔财务交易。August 2026，公司完成由 Portage 领投的 €30M
    Series C 轮，估值超过 €1B，累计融资大约 €160M。Moss 公开将自己定位为受 BaFin 监管的电子货币机构，以及通过 ISO/IEC 27001:2022 认证的金融平台。
