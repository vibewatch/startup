      - number: '5.5'
        title: 信任、质量、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任是 Moss 产品的核心，因为它处理资金、发票、审批和会计数据。公司公开称自己受 BaFin 监管、通过 ISO/IEC 27001:2022 认证、符合 DORA，数据托管在 Frankfurt 的 EU
              环境，静态数据用 AES-256 加密，传输中使用 TLS
              1.2+，并提供基于角色的访问控制、SSO、MFA、生物识别、审批链和四眼原则控制。安全主题博客显示，公司并未把安全当成单独的企业级勾选框，而是直接嵌入访问、审批和工作流设计中。对财务软件来说，这是合理的产品姿态。剩余尽调风险在于，这些控制在每个模块、合作伙伴边缘、迁移路径和
              AI 辅助工作流中是否都保持一致强度。公开材料展示了正确架构和意图，但只有更深尽调才能确认运营可靠性、事故历史和客户特定实施质量。
            claimRefs:
