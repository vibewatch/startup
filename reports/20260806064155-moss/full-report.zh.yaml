      - number: '8.6'
        title: 退出准备度、论点破裂触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最终判断是，Moss
              这家公司值得投资人跟进，但当前价格还没有被清晰证明。这个区别很重要。近期融资、可信规模和拓宽后的财务平台，说明公司应该进入严肃的后期项目观察名单。但公开证据仍缺：审计后的经营细节、利润率结构、优先权条款、客户经济性和风险
              KPI 深度。投资人应把最新估值当作需要验证的对象，而不是直接接受。下一步最有价值的尽调很直接：把 ARR 与审计报表对齐，弄清模块组合和 cohort 扩张，量化合作伙伴和支付经济性，审阅 Series C
              轮优先权结构。如果这些问题确认 Moss 具备持久、类似软件的经济性，买入论点会增强。若增长质量不及预期，融资条款以保护既有投资人为主并伤害新进入者，或运营风险打断 AI 套件变现，投资论点会很快走弱。
            claimRefs:
