    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 在当前基数上大幅复合增长；AI 和工作流交叉销售加深；无重大风险事件
        - 约 €1.2B-€1.5B 公允价值；增长和产品广度带来上行空间
        - 扩张过程中，执行和控制质量必须守住
        - 有可能，但需要新证据
      - - 基准
        - ARR 稳步增长、适度扩张、当前战略保持不变
        - 约 €0.9B-€1.1B；最新估值标记大致公允
        - 新资金安全边际很小
        - 与当前证据最一致
      - - 悲观
        - 增长放缓、客户群质量不及预期，或出现伙伴 / 监管问题
        - 约 €0.6B-€0.8B；倍数压缩叠加信心下降
        - 价格重置会快于叙事调整
        - 如果尽调发现质量偏弱，这一情景就有实质权重
