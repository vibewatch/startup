  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - European regulatory fit
    - Qonto, Payhawk, Pleo, and Soldo also emphasize regulated entities
    - Medium
    - Test whether Moss wins specifically on German compliance and AP workflow depth
  - - German accounting depth
    - Global platforms may add local accounting connectors over time
    - High
    - Request implementation win/loss data by DATEV-heavy accounts
  - - Unified workflow breadth
    - Spendesk, Payhawk, Ramp, and Qonto are all broadening their stacks
    - High
    - Measure attach rates and usage depth across Moss modules
  - - AI-assisted accounting edge
    - AI features are converging fast across peers
    - High
    - Request measurable accuracy, override, and time-saved benchmarks versus alternatives
  - - SME-friendly packaging
    - Aggressive pricing from Ramp, Brex, and business-account platforms can compress willingness to pay
    - Medium
    - Review realized ARPA and discounting by segment
  - - Partner-enabled UK/global payments
    - Reliance on Airwallex and card networks can reduce control over infrastructure economics
    - Medium
    - Inspect partner terms, migration SLAs, and margin split by region
  notes: Severity reflects likely pressure on Moss differentiation, not existential failure by default.
