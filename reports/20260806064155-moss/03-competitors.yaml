  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Segmented Moss win/loss, realized pricing, and attach-rate data versus Spendesk, Payhawk, Qonto, and Soldo.
    whyItMatters: Public positioning can look similar while underlying conversion, discounting, and multi-product penetration differ materially.
    diligencePath: Request pipeline-loss coding, deal-level competitive reasons, and attach rates by module and geography.
    relatedQuestionRefs:
    - QP023
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: review-depth
    missingEvidence: Independent, high-volume review data and retention metrics proving category-leading satisfaction.
    whyItMatters: The public third-party review surface for Moss is still too thin to underwrite durable product love.
    diligencePath: Request G2/Capterra exports, NPS history, GRR/NRR, and churn reasons by segment.
    relatedQuestionRefs:
    - QP022
    - QP024
  - type: conflicting-data
    severity: minor
    topic: adjacent-boundaries
    missingEvidence: A clean boundary model separating direct peers from banking, travel, procurement, and infrastructure adjacencies.
    whyItMatters: Competitive pressure can come from multiple starting points, so static category labels understate real threat vectors.
    diligencePath: Map buyer alternatives in recent Moss deals by first product considered and final win path.
    relatedQuestionRefs:
    - QP002
    - QP018
  - type: enumeration-incomplete
    severity: minor
    topic: TP001 profile table is representative rather than exhaustive.
    missingEvidence: Additional competitor profiles for Brex, Airwallex, Navan, Pleo pricing, and regional German specialists.
    whyItMatters: The most dangerous competitor varies by buyer archetype and geography.
    diligencePath: Expand the profile table with deal-frequency weighted competitors from CRM data.
    relatedQuestionRefs:
    - QP001
    - QP023
    relatedTableRefs:
