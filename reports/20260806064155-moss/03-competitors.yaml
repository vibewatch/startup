  - - Payhawk
    - Direct peer
    - 6,000+ companies; global payments in 150+ countries / 115 currencies
    - International SMB and enterprise finance teams
    - Very broad platform across cards, AP, travel, procurement, and FX
    - May be heavier than smaller SME buyers need
  - - Ramp
    - Likely entrant / feature bar
    - 70,000+ businesses
    - US-led mid-market and enterprise
    - AI-heavy automation, broad workflow scope, aggressive pricing
    - Europe fit and local accounting depth are not its historic center
  - - Qonto
    - Adjacent incumbent
    - 600,000+ clients
    - European SMBs and entrepreneurs
    - Large distribution via business account plus invoicing, cards, and AI agents
    - Business-account-first motion may not satisfy every AP-heavy finance team
  - - Soldo
    - Direct / adjacent
    - UK+EEA regulated spend platform
    - SMBs needing controlled spend without changing bank account
    - Clear spend-control positioning and transparent list pricing
    - Less visibly AP- and AI-led than Moss or Payhawk
  - - Pleo
    - Direct peer
    - Europe-focused spend solution with FCA-regulated UK entity
    - SMBs wanting easy employee-spend workflows
    - Strong brand in employee spend and European footprint
    - Public surface reviewed here is thinner on AP and pricing specifics
