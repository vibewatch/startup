- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Pricing signal
  - Packaging model
  - Included capabilities / caveat
  - Implication
  rows:
  - - Moss
    - Starts from €99/month on paid plans; free card/AP entry points
    - Modular platform with paid plans and add-ons
    - Unlimited users/cards/invoices on paid tiers; realized pricing unknown
    - SME-accessible land motion supports land-and-expand
  - - Ramp
    - Free / Plus / Enterprise tiers
    - Tiered software + financial products
    - Broad workflow coverage; some tax filing fees and custom enterprise pricing
    - Aggressive packaging can pressure perceived software pricing
  - - Qonto
    - €9 and €39 monthly core plans plus add-ons
    - Business account plan plus add-on monetization
    - Finance admin, invoicing, cards, support, remuneration, add-ons
    - Adjacent incumbents can cross-sell spend into banking base
  - - Soldo
    - £21 Standard; £33 Plus; enterprise custom
    - Transparent tiered spend management pricing
    - Works alongside bank account; additional financial-service fees may apply
    - Clear pricing helps SMB comparison shopping
  - - Spendesk
    - Quote-led fixed fee plus transaction usage
    - Platform fee + variable transaction usage
    - Unlimited users/cards; broad all-in-one positioning
    - Sales-led pricing favors larger or more complex buyers
  - - Brex
    - Plans start at $0/user/month, advanced features at $12/user/month
    - Tiered finance platform pricing
    - Broader treasury and card ecosystem; US context matters
    - Shows how low apparent SaaS entry prices can reset buyer expectations
  notes: List pricing does not imply realized discounting or all-in take rate.
