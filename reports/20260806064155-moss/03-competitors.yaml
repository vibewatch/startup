chapter:
  number: 3
  title: Competitors
  summary: Moss competes in a crowded but still reordering European finance-operations stack. The most direct peers are Spendesk, Payhawk, Pleo, and Soldo; the strongest adjacent threats are Qonto and Airwallex on embedded-finance distribution, while Ramp and Brex define the feature bar for AI-heavy finance automation. Moss is differentiated by European regulatory fit, German accounting depth, and strong AP-plus-card workflow breadth, but it is smaller than several adjacent rivals and faces a category that is converging fast around unified platforms, not isolated products.
sections:
- id: landscape
  title: Competitive landscape and who Moss really faces
  body: 'Moss no longer competes only against card-led expense tools. The relevant set includes direct European spend-management peers such as Spendesk, Payhawk, Pleo, and Soldo; adjacent business-finance platforms such as Qonto and Airwallex; U.S. workflow leaders such as Ramp and Brex that shape buyer expectations; and status-quo substitutes such as bank cards, spreadsheets, ERP workflows, and travel-led platforms like Navan. The category is converging around one promise: a finance team should manage cards, invoices, reimbursements, approvals, analytics, and increasingly AI-assisted bookkeeping from one system. That convergence helps Moss because its product has already expanded well beyond corporate cards, but it also means buyers can compare Moss against better-capitalized or better-distributed platforms whose starting point was banking, treasury, travel, or procurement rather than AP automation.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
