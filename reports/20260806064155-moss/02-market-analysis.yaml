  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-overlap
    missingEvidence: A clean Europe-only market model that reconciles AP automation, spend management, card economics, and procurement overlap without double counting.
    whyItMatters: Public reports measure overlapping categories, so any precise TAM can overstate or understate the real addressable pool.
    diligencePath: Build a bottom-up country-by-country model using finance-headcount, invoice volume, and software spend assumptions for Moss core geographies.
    relatedQuestionRefs:
    - QM022
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Country-level CAC, payback, and win-rate data by first module for Moss.
    whyItMatters: The public market case is positive, but it does not reveal whether Moss captures that demand efficiently.
    diligencePath: Request cohort-level pipeline and payback data split by Germany, UK, Netherlands, and Austria and by cards vs. AP first entry point.
    relatedQuestionRefs:
    - QM014
    - QM016
    - QM025
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: TM004 driver and constraint table is a representative rather than exhaustive list of adoption variables.
    missingEvidence: A complete ranked list of buyer objections, security-review blockers, and integration patterns by segment.
    whyItMatters: Driver lists age quickly in a converging category, especially once travel, procurement, and global payments are bundled.
    diligencePath: Interview recent Moss wins and losses to build a ranked objection and trigger taxonomy.
    relatedQuestionRefs:
    - QM018
    - QM019
    - QM025
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: minor
    topic: market-penetration
    missingEvidence: Current Moss market share by country and by primary workflow in each served geography.
    whyItMatters: ARR alone does not reveal whether Moss is leading any subsegment or still in early penetration mode.
    diligencePath: Request board or investor materials with customer counts, ARR, and share assumptions per market.
    relatedQuestionRefs:
    - QM022
    - QM025
