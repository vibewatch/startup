company:
  name: Moss
chapter:
  number: 2
  title: Market Analysis
  summary: 'Moss sits at the intersection of European spend management, accounts payable automation, and finance-workflow software for SMEs and mid-market companies. External market studies all point to durable double-digit growth, while European regulatory moves around eInvoicing and VAT digitisation increase the urgency of automation for finance teams. The category is large enough to support multiple winners, but it is also converging: card-first tools, AP automation, travel spend, procurement, and AI pre-accounting are collapsing into unified finance-operation platforms, which raises the bar for differentiation and integration depth.'
sections:
- id: market-boundary
  title: Market boundary and what Moss is really competing in
  body: 'Moss does not compete in one narrow category. Its operating market spans at least three linked software and payments layers: spend management platforms, accounts payable automation, and corporate-card-enabled finance operations. Moss product pages and pricing show that the company sells cards, invoice capture, reimbursements, approval routing, procurement-style controls, ERP sync, and AI pre-accounting as parts of one system. That places it broader than a pure expense-management app, but narrower than a full ERP or business bank. The clean market boundary therefore includes corporate cards, AP, reimbursements, approval and policy controls, audit-ready document management, and accounting/ERP integrations for business finance teams. It excludes payroll, general ledger ownership, broad treasury systems, and consumer banking. Status-quo substitutes remain spreadsheets, bank-issued cards, email-based approvals, legacy ERPs used as workflow systems, and point solutions such as travel
    or procurement tools that finance teams stitch together manually.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
- id: market-size-and-growth
  title: Market size and growth lenses
  body: 'The market is clearly large and still compounding, even if the published lenses measure slightly different things. The Business Research Company sizes the global spend-management-platform market at $29.19 billion in 2026, up from $25.78 billion in 2025 and reaching $45.93 billion in 2030 at a 12% CAGR. Intel Market Research sizes the narrower business-expense-card-and-spend-management market at $14.05 billion in 2026 after $12.06 billion in 2025 and projects $48.1 billion by 2034 at 16.5% CAGR. OMR Global sizes the European AP automation market at $777.7 million in 2024 and $2.53 billion by 2035, showing that invoice-processing software alone is already substantial in Europe before cards, reimbursements, or procurement are added. For Moss, the right interpretation is not to sum every market-study number, but to use them as stacked lenses: AP automation defines the minimum European workflow pool, global spend platforms define the broader software opportunity, and unified spend-finance
    platforms define the direction of travel.'
