    {
      "id": "operational-and-dependency-risks",
      "title": "Operational, Supply-Chain, and Dependency Risks",
      "body": "Operational risk is unusually high because Source Foundry appears to be targeting a part of the semiconductor stack where reliability, uptime, masks, process windows, and field support all matter before volume revenue can stabilize. The public scope includes maintenance and technical support, which means service readiness is part of the product promise. Yet there is no public evidence of an installed-base support organization, certification surface, or manufacturing-defense system. Dependency risk compounds the problem. Export-control actions by BIS and analysis from CSIS show that semiconductor manufacturing equipment remains a policy-sensitive chokepoint, especially for DUV, EUV, and related manufacturing items. Commercial dependence on a small number of foundries, pilot institutes, or ecosystem programs further increases concentration risk. Even if demand exists, a startup can still fail if supplier access, partner qualification, or policy permissions become gating items. Public ecosystem pages from Intel, Samsung, TSMC, Rapidus, and GlobalFoundries show how much coordination is normally required to get customers to first silicon, prototype, or production status. In practice, that means operational risk should be read as a chain: quality gaps slow qualification, qualification delays customer proof, and delayed proof increases financing and valuation pressure.",
