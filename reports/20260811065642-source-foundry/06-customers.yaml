      "id": "public-adoption-and-named-proof",
      "title": "Public Adoption Evidence and the Named-Customer Gap",
      "body": "The central commercial fact is negative: no retained public source identifies a named Source Foundry customer, deployment site, evaluation cohort, or production outcome. Funding coverage describes the company as stealth and future-oriented, but does not add customer proof. That matters because adjacent semiconductor-equipment challengers do publish some form of customer evidence when they have it. Canon publicly named TIE as the destination for its NIL system and described the exact use case as advanced-semiconductor R&D and prototype production. TIE itself describes a pure-play foundry and training center model focused on advanced microsystems, indicating the kind of pilot or institutional buyer that can absorb pre-scale manufacturing infrastructure. Foundry ecosystem operators also publish the surfaces through which customers engage: Samsung SAFE, TSMC OIP, Intel Foundry Accelerator, GlobalFoundries manufacturing services, UMC technology offerings, Rapidus pilot-line services, and SkyWater's TaaS model all show that customer adoption in this category often begins through ecosystem enablement rather than simple hardware resale. Source Foundry has not yet disclosed any equivalent public proof, which leaves commercial maturity unverified even if product ambition is credible.",
