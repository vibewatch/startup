    {
      "id": "retention-expansion-and-concentration",
      "title": "Retention, Expansion, and Concentration Risk",
      "body": "Because no public customer roster exists, traditional retention analysis collapses into proxies and explicit nulls. There is no public NRR, GRR, churn, contract-length, renewal, or satisfaction dataset for Source Foundry. The best that can be said is that adjacent category dynamics imply retention would be sticky once a tool or workflow is qualified, because fab process changes and field-service relationships are operationally expensive to unwind. The problem is that durability cannot be credited before adoption is proven. Expansion logic is easier to sketch than retention logic. A single anchor qualification with one major foundry, pilot line, or national semiconductor program could create follow-on demand across process modules, packaging, support services, or adjacent fabs. But the same structure creates severe concentration risk: the realistic near-term account universe is small, every account is technically demanding, and one delayed qualification can move revenue expectations by years. Public comparator ecosystems underline the same point. They are designed to reduce design barriers, shorten time-to-market, and help customers reach first silicon or prototype status more quickly. If Source Foundry lacks similar ecosystem penetration, then customer expansion may be gated less by theoretical demand and more by qualification throughput and trust. Until the company discloses even a narrow reference set, investors should assume concentration will be extreme and durability largely unknowable. That opacity matters especially because there is no public sign yet that customer references are diversified across geographies, buyer types, or procurement channels.",
