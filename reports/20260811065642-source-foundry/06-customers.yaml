  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Source Foundry's customer picture is defined more by buyer logic than by disclosed adoption. No retained public source names a Source Foundry production customer, pilot line, foundry partner, or signed ecosystem participant. Public records only support a narrow thesis about who would matter if the company is building lithography-adjacent infrastructure: leading-edge foundries, advanced-packaging or heterogeneous-integration programs, research or pilot institutes, and equipment-ecosystem partners that can shorten qualification cycles. In that sense the market is high-value but highly concentrated. The strongest public customer proof in adjacent markets comes from comparators such as Canon shipping NIL equipment to the Texas Institute for Electronics and from foundry ecosystems run by Intel, Samsung, TSMC, GlobalFoundries, SkyWater, UMC, and Rapidus. Those references clarify what real adoption evidence normally looks like\u2014and make Source Foundry's own public customer opacity the main underwriting issue."
  },
  "sections": [
    {
      "id": "buyer-segments-and-procurement",
      "title": "Buyer Segments and Procurement Logic",
      "body": "Source Foundry almost certainly does not have a broad SMB or developer-style customer base. The product scope visible in trademark records\u2014advanced-lithography software, wafer-processing software, masks and reticles, semiconductor manufacturing support, and field services\u2014points instead to a narrow set of enterprise buyers with deep process-engineering teams and long qualification cycles. The likeliest top-tier buyers are leading-edge foundries and large integrated device manufacturers that already manage advanced logic, packaging, and process-development programs. A second segment is pilot-line and research infrastructure buyers such as TIE, which show how new manufacturing tools can enter the market through prototype, open-access, or national-capability pathways before mainstream production. A third segment is ecosystem or channel buyers: foundry alliances, packaging providers, design-service partners, or process-enablement programs that can help a new tool earn qualification without requiring immediate fleetwide production commitment. In every segment, the user, buyer, and payer are different people. Process engineers and equipment teams may evaluate the technology, but budget authority often sits with fab leadership, platform owners, or government-backed consortium leadership. That creates a slow, high-friction procurement model with very large strategic value per account. The commercial upside per qualified account could therefore be unusually large.",
