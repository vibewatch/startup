  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Source Foundry is not entering an empty white space. The status-quo solution to advanced lithography bottlenecks is still to buy ASML systems and extend them with DUV, software, and service contracts; the main alternative-architecture challengers are Nikon in DUV and packaging, Canon in nanoimprint lithography, xLight in free-electron-laser light sources, and packaging-focused adjacencies such as EV Group. At the same time, the largest fabs can substitute away from startup adoption by pushing more process and packaging work through Intel, Samsung, or TSMC ecosystems rather than introducing a new front-end tool vendor. Public evidence supports a real strategic opening, but it does not yet support a durable public moat for Source Foundry because the company has not disclosed its first product layer, customer proofs, or production-readiness evidence."
  },
  "sections": [
    {
      "id": "landscape-overview",
      "title": "Landscape Overview: Incumbent Status Quo First, Alternatives Second",
      "body": "The central competitive fact is that Source Foundry is trying to enter a market where the default answer already works. ASML says its EUV systems print the most intricate layers for 7 nm, 5 nm, and 3 nm nodes, while DUV remains necessary in parallel for many other layers. That means the incumbent is not one isolated box but an installed workflow that spans scanners, software, service, and productivity tuning. ASML's own 2025 annual report shows \u20ac32.7 billion of net sales, 535 systems sold, and a supplier base of 5,100, underscoring how much industrial scale a challenger must overcome. Public evidence therefore suggests three rival classes for Source Foundry: first, ASML's installed-base status quo; second, alternative-architecture challengers such as Nikon, Canon, and xLight; and third, substitute paths in which large fabs solve the bottleneck inside broader foundry and packaging ecosystems rather than introducing a new standalone vendor.",
