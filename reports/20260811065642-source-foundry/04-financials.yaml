    {
      "id": "cost-structure-and-unit-economics",
      "title": "Cost Structure and Unit-Economics Proxies",
      "body": "Because Source Foundry discloses no cost data, the best public proxies come from mature semiconductor equipment and foundry operators. ASML's 2025 annual report shows \u20ac32.7 billion of sales, 52.8% gross margin, and \u20ac4.7 billion of annual R&D, while Q1 and Q2 2026 each carried roughly \u20ac1.2 to \u20ac1.3 billion of R&D at 53% to 54% gross margin. Those figures do not imply Source Foundry can approach similar margins soon; they show how much ongoing engineering spend remains necessary even after a dominant vendor reaches scale. Intel's 2025 10-K is even more directly relevant on risk structure, emphasizing significant, long-term, inherently risky investment in R&D and manufacturing facilities, dependence on customer wins for next-generation nodes, and exposure to supply, trade, and incentive policy. For Source Foundry, the likely near-term economics are therefore negative or indeterminate: prototype development, supplier qualification, installation, field support, and possibly custom fab integration are likely to dominate before recurring revenue becomes visible.",
