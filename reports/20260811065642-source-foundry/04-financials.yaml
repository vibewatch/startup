    {
      "id": "capital-adequacy-and-financing-dependency",
      "title": "Capital Adequacy and Financing Dependency",
      "body": "Source Foundry's reported financing is substantial, but the adequacy question depends on what must be financed. If the company is building a capital-equipment and service business with deep integration into frontier fabs, $500 million may fund several years of prototype, hiring, partner qualification, and early field trials, yet still prove modest versus the industrial scale implied by advanced lithography. Public comparables reinforce that point. TSMC's 2 nm and advanced-packaging roadmaps are already in volume production or turnkey deployment, and Intel's filings frame next-generation manufacturing as dependent on large capex, risky R&D, and external-customer milestones. xLight's $150 million CHIPS award also shows that adjacent lithography challengers often need public-capital support before commercialization. Financing concentration adds another wrinkle. TechCrunch and Reuters reporting on Situational Awareness describes a violent drawdown, public-equity unwind, and a much smaller remaining asset base, even though the fund retained private investments. That does not negate Source Foundry's existing funding, but it raises a fair diligence question about future follow-on capacity and sponsor stability if commercialization takes longer than planned.",
