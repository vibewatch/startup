  topStrengths:
    - >-
      The company is aimed at a real AI-era bottleneck: semiconductor-manufacturing tooling, especially lithography,
      where incumbent capacity and lead times are strategic constraints.
    - >-
      Founders have credible Stanford-rooted materials-science and microfabrication backgrounds rather than purely
      financial or promotional profiles.
    - >-
      Publicly disclosed capital is unusually large for a stealth hard-tech startup, with Sequoia support and a reported
      $500M total commitment from Situational Awareness.
    - >-
      Trademark scope suggests a potentially broader equipment-software-services platform rather than a single narrow
      point product.
  topRisks:
    - No retained public source discloses revenue, named customers, installed base, or a clearly bounded first product.
    - >-
      The reported ~$5B valuation already sits near late-stage hard-tech platforms that disclosed materially more
      operating proof.
    - >-
      Sponsor concentration is high, and Situational Awareness itself had to unwind most of its public portfolio before
      making the latest follow-on.
    - >-
      Competing against ASML and adjacent incumbents implies extreme technical, qualification, reliability, and support
      demands.
    - The realistic buyer universe is tiny, so any eventual commercial path is likely to be highly concentrated.
  unresolvedGaps:
    - >-
      Cap-table terms, ownership sold, liquidation preferences, and whether the August 2026 round was entirely primary
      capital remain undisclosed.
    - >-
      Public sources do not identify Source Foundry's first product boundary, prototype metrics, or qualification
      milestones.
    - No public customer, pilot, design partner, or ecosystem validation path has been named.
    - Revenue model, gross-margin targets, cash burn, runway, and capital plan by milestone are not public.
    - >-
      The depth of the investor syndicate beyond Situational Awareness and Sequoia is still unclear from retained
      sources.
