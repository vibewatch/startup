      "id": "disclosure-gaps-and-milestones",
      "title": "Milestones, Proof Gaps & What Is Still Unknown",
      "body": "The core analytical tension in the company overview is that scope ambition and financing scale are both public, while operating proof is not. The dated chronology available today is dominated by formation, trademark filings, and August 2026 media emergence rather than product launches, named customers, tool installations, or quantified production milestones. That is not fatal for a stealth company, but it has underwriting consequences. No reviewed source discloses Source Foundry's process node, wafer size, throughput, tool architecture, customer list, revenue, headcount, or launch date. Even the reported $5 billion valuation arrives via third-party coverage rather than a company announcement. The result is a chapter with unusually high asymmetry: investors have signaled enormous confidence, but outsiders still cannot test the core claims on performance, economics, or adoption. For later chapters, this makes discipline essential. Any statement about product maturity, customer traction, or financial readiness must be framed as either demonstrated, inferred from records, or simply still unknown.",
