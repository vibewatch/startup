  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Source Foundry is a San Francisco-based, Stanford-founded stealth startup that surfaced publicly in August 2026 when Situational Awareness reportedly increased its commitment to $500 million at a roughly $5 billion valuation. Business records and trademark filings show an unusually broad ambition spanning lithography machines, wafer software, manufacturing services, and facility engineering, but public proof of product readiness, customers, revenue, and governance depth remains extremely thin. The current overview is therefore strongest on identity, scope intent, and investor signaling\u2014and weakest on operating evidence."
  },
  "sections": [
    {
      "id": "identity-and-corporate-status",
      "title": "Identity, Formation & Public Footprint",
      "body": "Source Foundry's public identity is unusually sparse relative to its reported valuation, so the most dependable ground truth comes from records rather than marketing. California business filings show an active corporation called Source Foundry Inc. that registered on 2025-07-18, was formed in Delaware, and uses 674 Harrison Street in San Francisco as its principal and mailing address. August 2026 coverage layers a higher-level narrative onto that shell: the company was founded by Stanford researchers Abdulmalik Obaid and Joe Burg in 2025 and is trying to make semiconductor manufacturing faster, cheaper, and more scalable for the AI era. That combination is important. The legal record proves the company exists and where it sits; the reporting explains why investors care. What the reviewed evidence still does not provide is a normal startup front door. No retained source exposes a public semiconductor product site, tool spec sheet, customer case study, or launch roadmap that would let an outsider move from legal existence to commercial understanding in one hop.",
