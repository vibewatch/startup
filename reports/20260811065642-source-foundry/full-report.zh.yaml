      - number: '8.4'
        title: 建议取决于新证据，不取决于更热的叙事
        blocks:
          - type: paragraph
            body: >-
              本报告的建议必须明确对价格敏感。如果进入价位低得多，Source Foundry 兼具国家安全相关性、真实融资事件和可信的宏观瓶颈， 投资者可以先保持跟踪，等待证据。到了报道中的约 $5 billion
              估值，门槛就高得多。公司仍没有公开客户证明、 公开收入、公开产品边界或公开融资条款。资方语境也不是脚注：Situational Awareness 的公开市场减仓，让人有理由追问当前故事中有多少是集中信念、
              又有多少是广泛验证。这并不否定公司，但意味着新投资者在接受价格前应要求更多证据。因此，立场落在继续研究（research-more），
              信心中等，风险高，估值观点偏贵。能改变立场的是具体证据：具名试点或设计伙伴、披露的产品边界、可信的原型里程碑，
              或者证明最新融资结构是在保护而不是拖累未来投资者。会打穿论点的则是相反顺序：公开证明出现前又进行一轮大额融资、
              估值跌破当前水平，或公司继续不透明，却要求外部投资者按成熟半导体设备平台给它定价。尽调清单应当毫不客气地务实： 重建股权结构，梳理产品架构，核验原型里程碑，识别首批客户路径，并判断 $400 million
              跟投究竟是普通增长资本， 还是更不寻常的融资事件。
