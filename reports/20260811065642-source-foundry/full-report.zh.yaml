        - 支持义务就是产品承诺的一部分
        - 中
        - 高
        - 搭建直营服务组织或认证伙伴模式
        - 索取安装与支持手册
      - - 知识产权 / 法务运营
        - 需要自由实施空间和权属转让清洁度
        - 低
        - 中
        - 建立专利、商标和合同管理
        - 索取律师备忘录和权属转让清单
    notes: 执行风险不只是创始人风险；公司还要围绕一个技术野心很高的产品，搭起工业运营系统。
