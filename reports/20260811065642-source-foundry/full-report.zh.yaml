      - number: '8.3'
        title: 情景区间可以成立；传统 DCF 不成立
        blocks:
          - type: paragraph
            body: >-
              Source Foundry 没有披露收入基线、利润率结构、资本开支曲线、烧钱速度或客户转化路径，传统折现现金流模型只会制造伪精确。
              正确方法是把情景分析绑到验证里程碑上。市场背景确实解释了为什么投资者愿意下大注：Crunchbase 称 2026 年半导体创业公司融资仍然很热， 私募市场也支持了 Ayar
              Labs、Etched、Hadrian、Pacific Fusion 和 Helion 这类围绕瓶颈叙事开出的大额支票。 但这些交易反而让纪律更重要，而不是更宽松。Hadrian 近 $8 billion 的
              Series D 伴随了更多关于工厂、软件和客户的公开运营语境。 Helion 的 $5.425 billion 投后估值跟在技术里程碑和具名商业交易对手之后。Pacific Fusion 的 $900
              million Series A 按里程碑分批拨付，明确把资金释放绑定到验证闸门。相比之下，Source Foundry 在公开记录中的估值水位接近这些公司，
              却仍然几乎没有产品、客户或融资结构细节。这会拉宽区间。悲观情景低于当前估值，适用于公司只证明了子系统切口或原型、
              但没跑通多客户认证的世界。基准情景接近当前估值，需要可信的原型进展，以及一条未来通向数亿美元收入的可相信路径。 乐观情景高于当前估值，则要求 Source Foundry
              看起来像真正的本土半导体设备平台，而不是只有论点的挑战者。 三种情景里，当前价格都几乎不容执行打滑。
