      - number: '3.2'
        title: 直接、相邻与替代竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Nikon 和 Canon 是最清晰的公开案例，说明挑战者可以切入更窄楔形市场，而不是直接替代 ASML。Nikon 仍销售半导体光刻、对准和量测系统，其 DSP-100
              封装平台展示了进入先进封装的一条路径：无掩模曝光和大面板支持。Canon 走的是另一条路，即纳米压印光刻：其 FPA-1200NZ2C 宣称 14 nm 最小线宽、通向 2 nm 级图形化的路径，以及相比 EUV
              更低成本、更低功耗的方法，但公开部署仍集中在 TIE 等研究和原型场景。xLight 攻击的又是另一层，试图用可置于晶圆厂外、为多台扫描仪供能的自由电子激光公用设施替代 EUV 光源本身。EV Group 对前道
              EUV 更偏相邻而非直接竞争，但它仍重要，因为其掩模对准机、无掩模工具和封装专长显示，买家注意力可能转向后道和异构集成瓶颈，而不只是停留在前道扫描仪分辨率。
