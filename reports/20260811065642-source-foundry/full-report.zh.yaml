companyProfile:
  summary: >-
    Source Foundry 是一家位于旧金山的隐身半导体设备初创公司，由 Stanford 研究人员 Abdulmalik Obaid 和 Joe Burg 于 2025
    年创立。公开记录和商标申请显示，公司野心很宽：覆盖光刻机、晶圆和芯片加工软件、掩模和光罩、技术支持，甚至设施工程或定制制造服务。投资逻辑押在一个真实瓶颈上：支持者认为，AI
    的约束正从芯片本身上移到制造芯片的工具。但公开证据仍追不上叙事。留存资料没有披露收入、具名客户、精确产品架构或股权结构条款；在据称约 $5B 估值下，公司战略上值得关注，运营上仍高度不透明。
  foundedDate: '2025-07-18'
  founders:
    - name: Abdulmalik Obaid
      role: 联合创始人、CEO 兼 CFO
      background: Stanford 训练出的材料科学与微制造研究人员，公开履历强调可扩展制造工艺和硅电子集成。
