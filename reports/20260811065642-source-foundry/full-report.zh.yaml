  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开定价信号真实，但估值历史很浅，条款披露缺席
        blocks:
          - type: paragraph
            body: >-
              Source Foundry 现在有了真实的估值标记，但公开披露的材料还不够，不能把这个标记当成已经独立验证的公允价值。 Yahoo Finance、AI Weekly、Best AI 和 toflow 给出的
              2026 年 8 月核心事实一致：Situational Awareness 新增 $400 million 承诺，披露总持仓升至约 $500 million，公司估值约 $5
              billion。这足以说明发生了一次严肃的资本事件。 但还不足以说明这个价格已经被充分背书。留存的公开来源都没有披露公司有多少股权易手、最新资金是否全是一级增资、
              是否存在清算优先权或棘轮条款，也没有说明本轮是否改变了治理安排。更早的融资历史也很薄。公开聚合报道显示， 2026 年初可能有一笔 $100 million 初始投资，Sequoia
              参与其中；但这一步没有配套公司一手披露、备案文件或董事会权利细节， 外部投资者无法还原一条干净的估值演进线。结果就是，估值历史里有一个可观察的后期标记，底层公开条款却极少。
              这一点在这里比在软件公司更重要，因为公司仍处于隐身状态，产品边界未披露，客户或收入的公开证据也仍然缺席。 从估值角度看，8 月轮融资首先应理解为资方信念，其次才是市场出清的价格发现。
