  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Source Foundry 最可能的客户旅程，是企业从识别瓶颈出发，先走资质验证路径拿到试点证明，再进入生产和服务扩张。
    data:
      nodes:
        - id: need
          label: 识别瓶颈
          detail: 晶圆厂或联盟识别出光刻、良率或工艺瓶颈
        - id: eval
          label: 技术评估
          detail: 工艺和设备团队评估架构适配度
        - id: pilot
          label: 试点或原型使用
          detail: 试点线、研究机构或受限晶圆厂流程试用
        - id: qual
          label: 资质验证
          detail: 工艺验证和运营支持证明已可投入使用
        - id: prod
          label: 生产或持续支持
          detail: 工具、软件或服务扩展到重复使用
    approximationNotes: 这张图反映商标范围和可比赋能项目隐含的买方逻辑，不代表 Source Foundry 已披露的销售漏斗。
