  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：范围很宽，已验证细节很窄
        blocks:
          - type: paragraph
            body: >-
              最具体的公开产品证据来自商标覆盖范围，而不是公司产品页。USPTO.report 和 Justia 对 Source Foundry
              商标的记录显示，公司意图覆盖半导体、芯片、晶圆、晶圆加工软件、先进半导体光刻软件、光刻掩模和光罩，以及半导体制造机器安装或维护服务。这个组合很重要，因为它把 Source Foundry
              放进了客户工作流：买家接触公司，可能不只是为了买一台机器，也可能为了制程软件、消耗品或使能工件，以及装机后支持。不过，公开证据到此为止。留存资料没有给出商用 SKU
              名称，没有公开架构图，也没有数据表说明公司首个产品到底是光源、扫描仪、软件层还是封装相邻工具。因此，产品定义在范围上部分可知，但具体产品形态不可知。这种缺席应该改变尽调行为。在企业级半导体设备里，即便更深的性能数据保密，买家通常至少能看到一组狭窄公开证明点——产品名称、架构家族、试点引用或应用说明。这里正相反：Source
              Foundry 展示了异常宽的法律范围，却几乎没有公开产品细节。因此，本章把商标范围视为公司希望获准销售内容的下限，而不是证明每一类都已经工程化、集成或商业就绪。
