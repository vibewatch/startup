      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场的多头逻辑很直接。SIA、IDC 和 SEMI 都显示，2026 年的环境里，AI 基础设施正把多年半导体需求增长压缩进更短的投资周期。SEMI 特别把更高支出与先进逻辑、HBM、封装和测试相连；Mordor
              又补充了补贴、节点缩小和异构集成。但空头一面同样真实，而且对初创公司更关键。这个市场受残酷切换成本塑形：跨季度导入验证、深度嵌入制程配方、巨大营运资本需求。Mordor 称 High-NA 工具单台价格可超过
              $400M，且可能要求交付前一年或更早支付定金。出口管制、ESG 约束和供应商集中又增加摩擦。即便需求强劲，买家也不会轻易塞进一种新光刻架构。他们需要对良率、正常运行时间、服务和晶圆厂兼容性有信心；这也是
              Canon、xLight、Nikon、Intel、Samsung 和 ASML 都把产品放在系统层面讲，而不是讲成一次性发明的原因。
