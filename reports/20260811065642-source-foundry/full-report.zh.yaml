      - 事件
      - 已披露资本
      - 公开估值信号
      - 变化
      - 证据质量
    rows:
      - - 2025-07
        - 加州注册记录公开
        - n/a
        - 未披露估值
        - 相比产品成熟度，法律实体和创始人身份更容易核验。
        - 官方公司记录，但不是融资披露。
