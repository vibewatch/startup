      - number: '6.2'
        title: 公开采用证据与具名客户缺口
        blocks:
          - type: paragraph
            body: >-
              核心商业事实是负面的：没有留存公开资料识别出 Source Foundry
              的具名客户、部署地点、评估群体或生产结果。融资报道把公司描述为隐身且面向未来，但没有补充客户证据。这很关键，因为相邻半导体设备挑战者一旦拥有客户证据，通常会发布某种形式的证明。Canon 公开点名 TIE 为其
              NIL 系统去向，并把确切用例描述为先进半导体 R&D 和原型生产。TIE
              自身描述了一种聚焦先进微系统的纯晶圆代工厂和培训中心模式，指示了能吸收规模化前制造基础设施的试点或机构买家类型。晶圆代工生态运营者也会发布客户接触界面：Samsung SAFE、TSMC OIP、Intel
              Foundry Accelerator、GlobalFoundries 制造服务、UMC 技术产品、Rapidus 试验线服务和 SkyWater 的 TaaS
              模式都说明，这一类别的客户采用往往始于生态使能，而不是简单硬件转售。Source Foundry 尚未披露任何等价公开证明，因此即便产品野心可信，商业成熟度仍未验证。
