  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：大于单纯光刻，小于全部半导体资本开支
        blocks:
          - type: paragraph
            body: >-
              分析 Source Foundry 时，第一个陷阱是把市场定义得太宽。若只说公司在攻击半导体瓶颈，标题 TAM
              就会变成半导体制造设备上的每一美元，甚至每一美元芯片需求。这在方向上有用，但对决策没用。更好的起点，是把公司商标定义出的范围与现有厂商对自身技术栈的描述放在一起。Source Foundry
              的公开备案覆盖机器、光刻、晶圆加工软件、工具控制和设施工程。ASML
              同样把自身价值主张放在系统、量测、检测和软件上，而不是一台裸扫描仪。因此，市场边界应该包括光刻工具，以及与其紧密绑定的制程控制层。但默认不应包括商品化后道搬运、通用 EDA
              或全部半导体资本开支。因此，可触达支出池很大，却仍只是晶圆厂和封装投资总额中的一部分。
