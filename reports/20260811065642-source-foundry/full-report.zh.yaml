  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 融资低于当前估值标记
        - 下一轮定价融资或可靠老股交易成交价显著低于 ~$5B
        - 证实今天的价格跑在证据前面。
        - 在新证据或条款披露前，按投资逻辑破裂处理。
      - - 无客户或试点证明
        - 下一次重大融资事件前，没有具名试点、设计伙伴或晶圆厂验证路径
        - 削弱从瓶颈叙事走向商业转化的桥。
        - 建议维持继续研究，或直接退出。
      - - 无产品边界披露
        - 公开记录或尽调材料仍说不清 Source Foundry 销售的具体层级
        - 可比分析和里程碑规划过于模糊，无法纳入投资测算。
        - 第一个切入点清楚前，不要按平台给公司定价。
      - - 赞助方不稳定加剧
        - 领投赞助方融资能力或治理可信度进一步走弱
        - 公司可能仍需要耐心资本时，后续融资和信号风险反而上升。
        - 下调上行空间，提高稀释风险。
      - - 认证延误
        - 原型或集成里程碑延误，且没有客户证据抵消
        - 在当前高估值标记不变时，把收入桥进一步推后。
        - 将期望值向悲观情景移动。
      - - 政策或供应链堵点
        - 出口管制、供应商或设施约束显著拖慢商业化
        - 把艰难技术故事变成延迟兑现的经济故事。
        - 降低乐观情景概率，扩大下行空间。
    notes: 这些触发项强调可观察、可转化为投资动作，而不是修辞。
    claimRefs:
