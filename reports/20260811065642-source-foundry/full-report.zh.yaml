      - CV042
      - CV043
      - CV044
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 宏观瓶颈
        - AI 需求和设备约束，让本土光刻挑战者具备战略价值。
        - 战略重要性不等于一定能商业转化，也不等于定价干净。
        - 证明 Source Foundry 正在解决一个具体瓶颈，并有可衡量的客户拉动。
      - - 融资信号
        - 已披露的 $500M 承诺说明成熟资本认真看待公司。
        - 单一集中赞助方也能制造强信号，并不等于市场已广泛验证。
        - 增加独立估值标记、战略伙伴，或披露条款的更广泛投资人组合。
      - - 公开可比公司
        - 半导体资本设备龙头证明，高质量设备生意可以长期维持溢价倍数。
        - 这些倍数建立在数百亿美元收入、装机基础、服务经济性和披露之上，而 Source Foundry 尚不具备。
        - 披露通往 $268M-$380M+ 收入的可信路径，并证明早期转化。
      - - 私营可比公司
        - Hadrian、Helion、Pacific Fusion 以及 2026 年芯片轮次说明，投资人仍会大规模押注前沿瓶颈。
        - 这些可比对象要么披露了更多证据，要么采用里程碑分期，要么处在不同终端市场。
        - 弥合证据缺口，或围绕里程碑设计新资本，而不是只靠叙事。
      - - 赞助方质量
        - Situational Awareness 在公开清盘期间仍保留私人押注，显示出信念。
        - 但这场清盘也在新投资人最不希望看到的时候，抛出治理和后续出资能力问题。
        - 证明融资韧性不只来自单一赞助方资产负债表。
    notes: 每行都把最强的支持估值论点与最强反制因素配对，确保建议对价格敏感。
    claimRefs:
      - CV007
      - CV009
      - CV019
