              Source Foundry 没有披露成本数据，因此最好的公开代理来自成熟半导体设备和代工运营商。ASML 2025 年年报显示销售额 €32.7B、毛利率 52.8%、年度 R&D €4.7B；2026 年
              Q1 和 Q2 各自约有 €1.2B 至 €1.3B 的 R&D，毛利率为 53% 至 54%。这些数字并不意味着 Source Foundry
              很快能接近类似利润率；它们说明，即便主导厂商已经达到规模，持续工程投入仍然巨大。Intel 2025 年 10-K 在风险结构上更直接相关，强调对 R&D
              和制造设施进行重大、长期且内生高风险的投资，下一代节点依赖客户赢单，并暴露于供应、贸易和激励政策。对 Source Foundry
