            body: >-
              公开证据支持多个市场口径，而不是一个整齐数字。最宽口径是 SEMI 对 2026 年设备市场 $165.9B 的预测。最相关的公开光刻口径，是 Mordor 对 2026 年光刻设备 $30.44B
              的估算。在其内部，Source Foundry 真正可服务市场还会继续收窄，指向那些为领先逻辑、存储、封装和制程控制改进买单的买家子集。买家集中度极高。Mordor 称纯晶圆代工厂占光刻设备支出近一半，而
              TSMC 披露的 534 个客户显示，一家领先制程制造商如何把广泛终端需求聚合到相对少数的制程开发项目里。Samsung 和 Intel
              进一步说明，下一代节点需求集中在少数拥有资本、人员和意愿去验证新工具的组织手中。超大规模云厂商在经济上重要，但它们往往隔着一层，是 AI 需求推动晶圆代工资本开支的间接付款方，而不是直接购买扫描仪。
