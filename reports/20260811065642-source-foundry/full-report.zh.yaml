        blocks:
          - type: paragraph
            body: >-
              Source Foundry 仍处于隐身状态，商标申请眼下就是最有信息量的准产品文件。它们暗示的不是一台秘密机器，而是更宽的东西。2026 年 3
              月的申请覆盖光刻机、半导体制造设备、晶圆加工软件、先进光刻开发工具、技术支持、维护、设施工程、培训，甚至定制制造。换句话说，公开纸面痕迹描述的是横跨机器、软件和制造服务的平台野心。这与 Sequoia 相关内容和
              8 月融资报道反复讲述的投资人故事一致：Source Foundry 不是又一家 AI 芯片设计公司，而是一家试图攻击芯片设计上游制造瓶颈的公司。战略背景解释了这套叙事为什么当下有共鸣。ASML
              仍把持光刻前沿，Intel 已经把 High-NA EUV 带入生产，Canon 和 Nikon 继续占据有意义的相邻地带，xLight 也拿到联邦支持，试图做替代 EUV 光源。Source Foundry
              进入的是一个真实且拥挤的问题集，不是空白市场。
