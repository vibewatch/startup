      - number: '8.2'
        title: 上市半导体可比公司显示，$5 billion 通常需要多少已验证收入
        blocks:
          - type: paragraph
            body: >-
              检验 Source Foundry 估值标记，最干净的方法不是套用私募市场神话，而是看已经反映规模化半导体运营证明的上市收入倍数。 StockAnalysis 显示，ASML、Applied
              Materials、Lam Research 和 KLA 的 EV/Sales 大约在 14x to 19x， 规模化晶圆代工和 IDM 锚点 TSMC、Intel 则更接近 9x to
              13x。这些并不是完美可比。ASML 是垄断级光刻龙头， Applied 和 Lam 位于相邻设备层，KLA 享有制程控制溢价，TSMC 和 Intel 是制造商而不是工具供应商。
              但这个区间仍能说明举证压力。按这些倍数计算，$5 billion 企业价值意味着年收入大致需要 $268 million to $556 million，具体取决于选用哪个上市基准。Source Foundry
              没有披露任何收入。这不代表公司不能成长到值 $5 billion；它只说明当前公开证据还没有搭出这座桥。成熟上市同行还披露了让定价成为可能的信息：收入历史、
              利润率、现金流、装机基础经济性和投资者材料。Source Foundry 没有。宏观背景确实有利——SEMI、SIA 和 IDC 都显示 2026 年 AI
              驱动半导体增长和设备需求——但品类顺风不等于能直接落到某家公司。因此，今天上市半导体设备公司的倍数区间更适合作为纪律工具， 不能直接背书当前私募估值。
