      - number: '1.3'
        title: 融资基础、估值与投资人解读
        blocks:
          - type: paragraph
            body: >-
              资本故事是 Source Foundry 眼下最重要的理由。审阅到的 2026 年 8 月报道口径一致：Situational Awareness 本周新增 $400M 投资，使该基金总承诺达到
              $500M，并支撑约 $5B 估值。公开资料也称 Sequoia
              更早支持了公司，但距离完整股权结构描述还很远。这个缺口重要，因为交易条款基本空白：没有审阅来源披露工具是优先股、债务还是某种承诺额度，也没有给出持股、清算优先权或董事会权利细节。因此，这笔融资必须分两层理解。第一，这是对上游
              AI 制造命题的一次巨大信任票。第二，单靠公开证据，它仍不是一轮可以完整承做的融资。领投方背景也复杂。Situational Awareness 刚经历公开市场仓位的惨烈出清，上市 AI
              基础设施押注失手后，Source Foundry 这张支票既显得大胆，也有几分被迫转向长期私募押注的意味。
