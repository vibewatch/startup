  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买家分层与采购逻辑
        blocks:
          - type: paragraph
            body: >-
              Source Foundry 几乎肯定没有广泛的 SMB
              或开发者式客户基础。商标记录里可见的产品范围——先进光刻软件、晶圆加工软件、掩模和光罩、半导体制造支持与现场服务——指向的是一小群企业买家，他们有深厚制程工程团队和漫长导入验证周期。最可能的一线买家是领先制程晶圆代工厂和大型
              IDM，它们已经管理先进逻辑、封装和制程开发项目。第二类是 TIE
              这样的试验线和研究基础设施买家，说明新制造工具如何先通过原型、开放访问或国家能力路径进入市场，再走向主流生产。第三类是生态或渠道买家：晶圆代工联盟、封装供应商、设计服务伙伴或制程使能项目，它们能帮助新工具获得导入验证，而不要求立刻承诺全厂队列生产。每个细分里，用户、买家和付款方都不是同一群人。制程工程师和设备团队可能评估技术，但预算权往往在晶圆厂领导层、平台负责人或政府支持的联盟领导层手中。这形成了缓慢、高摩擦的采购模式，但每个账户的战略价值很大。因此，单个合格账户的商业上行空间可能异常大。
