      - number: '2.4'
        title: 对 Source Foundry 的含义
        blocks:
          - type: paragraph
            body: >-
              放在一起看，市场毫无疑问足够大，值得关注，但它的大并不会让商业化变容易。相关买家群体很小、技术要求极高，并且已经与现有厂商和可信替代架构供应商深度绑定。这会影响投资判断。Source Foundry
              不需要赢得消费级客户数量；它需要说服少数世界级晶圆厂、IDM 或先进封装项目相信，公司能在前沿瓶颈上改善吞吐量、良率、成本或物理极限。公开证据足以说明奖池以十亿美元计，也足以说明 AI
              需求正把投资向上游拉。公开证据不足以为 Source Foundry 单独推导干净的 SOM
              或时间曲线，因为公司仍未披露首款产品形态到底攻击光源、扫描仪、软件还是晶圆厂服务层。因此，市场章节以一个克制结论收束：机会真实、集中且具有战略重要性，但公开 TAM 叙事仍跑在公开公司细节前面。
