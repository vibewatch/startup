      - CU001
      - CU003
      - CU004
      - CU006
      - CU022
      - CU027
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 理论上漏斗很宽，但很快收窄，因为只有少数组织有能力评估或购买这类基础设施。
    data:
      items:
        - label: 潜在买方范围
          value: 100
          detail: 全球半导体和先进封装生态
        - label: 技术上可行的买方群体
          value: 30
          detail: 具备先进制程或试点线能力的组织
        - label: 近期评估方
          value: 12
          detail: 能够试用新基础设施的晶圆厂、研究机构或项目
        - label: 标杆资质验证
          value: 3
          detail: 只有少数早期胜利可能具有商业意义
        - label: 可规模化复购账户
          value: 1
          detail: 早期收入可能取决于一个锚定客户关系
    approximationNotes: 数值是定性漏斗权重，不是 Source Foundry 披露的数量。它们展示的是集中度逻辑，不是实际管线数字。
