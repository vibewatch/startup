      - CV044
      - CV045
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 基于情景的估值区间（USD M）
      - 假设
      - 概率信号
      - 相对当前据报估值标记的回报
      - 决策含义
    rows:
      - - 悲观
        - $1,500-$3,000
        - Source Foundry 证明了某个技术切入点，但在下一轮融资窗口前，未能展示多客户认证或清晰商业牵引。
        - 只要证据继续留在私下、且客户验证到来前资本市场降温，这一情景就有可能。
        - '-70% 到 -40%，相对 $5,000M 入场价。'
        - 不要为了拿额度硬上；等待价格重置或证据实质改善。
      - - 基准
        - $3,000-$5,000
        - 原型进展变得可信，至少出现一条晶圆厂或生态路径，通往 $200M-$300M 长期收入的桥开始站得住。
        - 这是今天最能支撑的公开区间，因为它假设会有进展，但不假装公司已经去风险。
        - 相对当前据报估值标记持平至 -40%。
        - 密切跟踪，但只有在条款和里程碑可见时才纳入投资测算。
      - - 乐观
        - $5,000-$8,000
        - Source Foundry 拿出公开产品边界、客户或试点证明，并形成可支撑未来数亿美元收入的半导体资本设备平台叙事。
        - 需要截至 2026-08-11 尚未公开的证据。
        - 相对当前据报估值标记 0% 至 +60%。
        - 只有证据改善之后才有吸引力，之前不是。
    notes: 这些是以 USD 百万美元计的情景区间。它们不是已披露的当前估值模型，也刻意避开虚假的 DCF 精度，因为核心运营输入仍未公开。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 交易信号
      - 指标 / 倍数
      - 可比原因
      - 主要限制
      - 对 Source Foundry 的启示
    rows:
      - - Source Foundry
        - 2026 年 8 月后续融资据报估值 ~$5B
        - 已披露总承诺 ~$500M；无公开收入
        - 锚定市场今天隐含愿意为什么付费。
        - 价格主要来自第三方，条款披露缺失。
        - 当前估值标记真实存在，但没有独立投资测算支撑。
      - - ASML
        - 公开上市的垄断级半导体资本设备龙头
        - 16.51x EV/Sales；$40.29B TTM 收入
        - 最直接的光刻基准，也证明这个品类能有多值钱。
        - 成熟、主导、披露充分的平台，且有装机基础经济性。
        - 高质量上沿基准，不是干净的阶段可比。
      - - Applied Materials
        - 公开上市的全线设备供应商
        - 14.25x EV/Sales；$29.02B TTM 收入
        - 相邻制程设备可比公司，装机基础多元。
        - 产品覆盖更广，收入证明远多于 Source Foundry。
        - 说明十几倍中段半导体资本设备倍数通常需要多少收入托底。
      - - Lam Research
        - 公开上市的制程设备专家
        - 16.44x EV/Sales；$23.23B FY2026 收入
        - 能体现设备层战略重要性的公开溢价可比对象。
        - 制程层不同，服务版图也已成熟。
        - 暗示若按公开可比公司衡量，Source Foundry 需要很大收入才能支撑 $5B。
      - - KLA
        - 公开上市的过程控制溢价可比公司
        - 18.64x EV/Sales；$13.58B FY2026 收入
        - 证明当证据和利润率成立时，公开半导体资本设备倍数的上沿在哪里。
        - 溢价来自盈利规模，不是隐身期可选性。
        - 即便是公开高端可比，也假设业务证明远强于 Source Foundry。
      - - Hadrian
        - 美国私营制造平台融资轮
        - Series D 轮融资 ~$1.37B，对应估值 ~$7.9B
        - 可映射主权制造和国家安全资本偏好的可比对象。
        - 终端市场不同，公开运营披露明显更强。
        - 说明市场愿意资助本土工业平台，但通常要求更多证据。
      - - Helion
        - 私营资本密集型登月式项目
        - Series F 轮 $425M，对应投后估值 ~$5.425B
        - 有助于比较前沿硬件公司如何靠具名商业对手方达到相近估值。
        - 聚变是不同市场，也有不同资本曲线。
        - 相比更薄的公开证据，Source Foundry 相近的头部估值显得偏满。
      - - Pacific Fusion
        - 采用里程碑结构的前沿硬件融资轮
        - '>$900M Series A 已承诺；估值未披露'
        - 可作为结构可比：投资人如何把资金释放与证据关卡匹配。
        - 行业不同，估值未披露。
        - 凸显当前沿风险明显时，投资人往往要求里程碑结构。
    notes: 覆盖范围有意保持有限：这里选的是抓取语料中最影响决策的公开半导体资本设备和资本密集型私营参照，不是所有硬件创业公司的全量清单。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public semicap valuation anchors and large private
        frontier-manufacturing transactions visible in the fetched corpus as of 2026-08-11; it is not a full census of
        every semiconductor or hard-tech startup round.
