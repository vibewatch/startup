  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高严重度风险：证据、导入验证与政策暴露
        blocks:
          - type: paragraph
            body: >-
              最高风险来自野心和公开证据之间的缺口。商标记录、创始人履历和融资报道支持一个宽广的半导体制造推进，但没有展示具名产品、已发布客户部署或可见质量体系。这很关键，因为半导体制造买家不会只为新颖性买单。他们需要零缺陷目标、供应商控制、支持基础设施和导入验证路径，并且这些要在成熟代工和设备生态里可见。公开可比来源把门槛说得很清楚：TSMC、UMC
              和 SkyWater 发布质量与风险管理系统；Samsung、Intel 和 TSMC 发布客户使能项目；Canon 和 xLight 发布具名原型或机构证明点。Source Foundry
              尚未发布类似证据。因此，最严重风险不是抽象初创风险，而是具体工业化风险：公司可能必须同时解决产品准备度、客户证明和符合政策安全要求的供应准入。当前问题不是已知这些控制在内部缺失，而是它们尚未在公开层面可见，这迫使外部投资人假设更大的剩余执行风险。
