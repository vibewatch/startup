            title: 本轮融资是价格证据，不是公允价值证明
            body: 从 2026 年 8 月融资中应得出的正确结论，是 Source Foundry 拥有严肃支持者和真实战略叙事。 错误结论则是，外部人已经可以仅凭公开证据承保 $5 billion。
