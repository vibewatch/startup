        title: 收入模式与核心披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开报道给出了 Source Foundry 的估值和融资标题，但几乎没有商业细节。Benzinga 称，公司从 Situational Awareness 新募 $400M，使该基金总承诺达到
              $500M，对应据称 $5B
              估值，并把公司描述为正在开发光刻工具。商标申请进一步拓宽了图景：它们覆盖晶圆加工软件、机器安装、维护、维修和技术支持服务。这意味着可能的收入模式比一次性硬件销售更宽。合理收入流包括工具销售、试点或非经常性工程费、软件或控制许可，以及装机后服务合同。问题在于，这些收入流没有任何一项获得公开量化。留存资料没有披露收入、订单、积压订单、付费试点、平均售价或客户数。因此，财务分析从缺席出发：公开证据足以勾勒变现路径，但不足以确认今天是否已有任何路径启动。
