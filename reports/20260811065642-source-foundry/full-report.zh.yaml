        title: 切换成本、分销权力与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              光刻切换成本不只是技术问题，也是组织和地缘政治问题。ASML 和 Nikon 都推广包含图形化工具、软件、量测、对准和服务网络的组合，因此导入验证既关乎正常运行时间和晶圆厂兼容性，也关乎第一性原理物理。Canon
              的 NIL 漫长开发周期，以及 IEEE Spectrum 对套刻和缺陷挑战的报道，说明从有趣物理走到可靠生产有多难。出口管制不确定性又叠上一层。Bloomberg 报道称，美国官员警告
              ASML，可能有一台先进工具流入中国；CISES 则认为真正瓶颈不是一家公司，而是荷兰、德国、日本和美国供应商组成的联盟。对初创公司来说，这种碎片化会提高可信供应链的价值，也可能让销售周期比标题里的 AI
              需求故事更慢、更窄、更受政治条件约束。
