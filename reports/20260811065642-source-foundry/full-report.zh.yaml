  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局概览：先看现有体系，再看替代方案
        blocks:
          - type: paragraph
            body: >-
              最核心的竞争事实是，Source Foundry 试图进入一个默认答案已经可用的市场。ASML 称，其 EUV 系统能打印 7 nm、5 nm 和 3 nm 节点最精细的层，而 DUV
              仍需并行用于许多其他层。这意味着现有厂商不是一个孤立盒子，而是一套已安装工作流，横跨扫描仪、软件、服务和生产率调优。ASML 自己的 2025 年年报显示净销售额 €32.7B、售出 535 套系统、供应商基础达
              5,100 家，凸显挑战者必须跨过多大的工业规模。公开证据因此提示 Source Foundry 面对三类对手：第一，ASML 装机基础形成的现状；第二，Nikon、Canon、xLight
              等替代架构挑战者；第三，大型晶圆厂在更广的代工和封装生态内自己解决瓶颈，而不是引入新的独立供应商。
            claimRefs:
              - CP001
