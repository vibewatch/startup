  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从真实融资信号出发；一旦检验条款不透明、出资方集中和商业证明缺失，可定价性就走弱。
    data:
      nodes:
        - id: funding
          label: 真实融资事件
          detail: $400M 新资金和约 $500M 已披露总承诺，说明这家公司值得重视。
          tone: positive
        - id: mission
          label: 战略瓶颈逻辑
          detail: 支持方将光刻工具定位为 AI 供应链的关键卡点。
          tone: positive
        - id: terms
          label: 未公开股权结构条款
          detail: 出售的股权比例、优先权和治理变化均未披露。
          tone: warning
        - id: proof
          label: 未公开收入或客户证明
          detail: 缺少常规经营证据，公司仍难以估值。
          tone: warning
        - id: sponsor
          label: 出资方集中风险
          detail: Situational Awareness 的判断真实，但其自身回撤也抬高了背景风险。
          tone: warning
        - id: decision
          label: 继续研究 / 昂贵
          detail: 接受当前价格前，必须先完成证据驱动的尽调。
          tone: neutral
      edges:
        - from: funding
          to: mission
        - from: mission
          to: terms
        - from: terms
          to: proof
        - from: proof
          to: sponsor
        - from: sponsor
          to: decision
    approximationNotes: 该流程用决策关口替代数值公式，因为公开记录披露的输入不足，无法做确定性估值。
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV026
      - CV035
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 按公开基准 EV/Sales 倍数测算，要支撑 $5B 估值所需收入仍然很大，尤其是公司没有公开收入披露。
    data:
      xAxis: 基准倍数锚点
      yAxis: 支撑 $5B 估值所需年收入（USD M）
      items:
        - label: Intel 8.99x
          value: 556
          note: 即便采用较低倍数的 IDM 锚点，也意味着年收入要超过 $500M。
          tone: warning
        - label: TSMC 13.15x
          value: 380
          note: 规模化晶圆代工锚点意味着年收入接近 $400M。
          tone: warning
        - label: Applied 14.25x
          value: 351
          note: 相邻综合型半导体设备公司倍数仍需要约 $350M 收入。
          tone: warning
        - label: ASML 16.51x
          value: 303
          note: 即使按垄断级光刻倍数，也要假设年收入约 $300M。
          tone: neutral
        - label: Lam 16.44x
          value: 304
          note: 工艺设备溢价倍数对应的所需收入与 ASML 接近。
          tone: neutral
        - label: KLA 18.64x
          value: 268
          note: 高端上市半导体设备溢价仍意味着收入接近 $270M。
          tone: positive
    approximationNotes: 收入要求只是简单算术：$5,000M 除以各基准 EV/Sales 倍数。它们是敏感性锚点，不是预测。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间仍然很宽，因为公开记录缺少可做 DCF 的经营输入，而且未来稀释轻重取决于里程碑时点。
    data:
      items:
        - label: 悲观情景
          low: 1500
          mid: 2250
          high: 3000
          displayValue: $1.5B-$3.0B
          detail: 原型有进展，但下一次融资事件前，客户或资质验证证明仍然不足。
          tone: warning
        - label: 基准情景
          low: 3000
          mid: 4000
          high: 5000
          displayValue: $3.0B-$5.0B
          detail: 原型和生态进展变得可信，但收入桥梁仍有一部分落在未来。
          tone: neutral
        - label: 乐观情景
          low: 5000
          mid: 6500
          high: 8000
          displayValue: $5.0B-$8.0B
          detail: Source Foundry 拿出清晰的公开产品说明、客户证明，以及迈向半导体设备平台规模的可信路径。
          tone: positive
    approximationNotes: 这些是基于情景的估值区间，单位为 USD millions。它们不模拟准确瀑布、分期或 DCF 现金流，因为这些条款并未公开。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公开评分最强的是战略相关性和融资信号；最弱的是估值可见度、商业证明和尽调完整度。
    data:
      items:
        - label: 战略瓶颈相关性
          value: 4
          unit: /5
        - label: 融资信号
          value: 4
          unit: /5
        - label: 产品清晰度
          value: 1
          unit: /5
        - label: 商业证明
          value: 0
          unit: /5
        - label: 估值可见度
          value: 1
          unit: /5
        - label: 出资方多元化
          value: 1
          unit: /5
        - label: 尽调完整度
          value: 1
          unit: /5
    approximationNotes: 这些是截至 2026-08-11 基于章节证据得出的定性序数评分，不是经审计的经营指标。
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
