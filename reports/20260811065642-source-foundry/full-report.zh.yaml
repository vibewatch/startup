        blocks:
          - type: paragraph
            body: >-
              运营风险异常高，因为 Source Foundry
              似乎瞄准的是半导体栈中可靠性、正常运行时间、掩模、制程窗口和现场支持都必须先到位，规模收入才能稳定的环节。公开范围包括维护和技术支持，这意味着服务准备度就是产品承诺的一部分。但公开证据没有显示已安装客户基础支持组织、认证界面或制造防御体系。依赖风险又放大这个问题。BIS
              的出口管制行动和 CSIS 的分析显示，半导体制造设备仍是政策敏感瓶颈，尤其是 DUV、EUV
              和相关制造项目。商业上依赖少数晶圆代工厂、试点机构或生态项目，也会进一步提高集中风险。即便需求存在，若供应商准入、伙伴导入验证或政策许可变成门槛，初创公司仍可能失败。Intel、Samsung、TSMC、Rapidus
              和 GlobalFoundries
              的公开生态页面显示，为了把客户带到首片硅、原型或生产状态，通常需要大量协调。实践中，运营风险应该被读成一条链：质量缺口拖慢导入验证，导入验证延迟客户证明，证明延迟又加大融资和估值压力。
