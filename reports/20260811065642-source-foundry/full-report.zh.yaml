      - number: '5.2'
        title: 架构与 Source Foundry 要竞争必须面对的技术栈
        blocks:
          - type: paragraph
            body: >-
              Source Foundry 的确切设计没有披露，但公开可比证据说明，任何可信产品都必须处理哪些层。ASML 技术页面显示，领先制程光刻是光学、机械、控制软件和服务的混合体，EUV 和 DUV
              在不同层中配合使用。Nikon 的技术栈同样横跨光刻、对准、量测和封装，其 DSP-100 又为大尺寸基板加入无掩模投影。Canon 的 NIL
              路径展示了另一种架构，用压印替代光学投影，但它经历了多年开发，仍需要通过研究和原型渠道商业化。xLight 攻击的是光源层，而非完整扫描仪；TSMC 的 3DFabric
              和先进封装材料则显示，部分关键产品价值正从前道光刻迁移到系统级集成。关键产品结论是，除非某个单一组件能解开更大的系统瓶颈，Source Foundry
              不太可能只在一个孤立部件上竞争。这也是为什么产品尽调不能止步于“ASML 替代者”这个标题。Canon 证明，即便方法完全不同，仍需要围绕缺陷控制、对准、试点采用和制造准备度建立完整计划。xLight
              说明，初创公司可以选择楔入一个关键子系统，而不是替代整机。TSMC 和 Intel 表明，部分客户价值可能通过集成或封装层被捕获，而不是直接赢下前道扫描仪之战。Source Foundry
              合理上可能追求这些形态中的任何一种，但公开证据尚无法区分。
