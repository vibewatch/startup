      - number: '7.3'
        title: 财务、团队与论点破裂风险
        blocks:
          - type: paragraph
            body: >-
              财务和团队风险位于运营风险下游。据称 $5B 估值和 $400M 融资可以买到时间，但也抬高了证明门槛。如果 Source Foundry 到 2026
              年公开层面仍处于商业化前阶段，任何客户证明、伙伴验证或产品可靠性的延迟，都可能迅速转化为估值压缩和后续融资风险。客户宇宙很小，因此一个锚点账户分量极重；这让招聘、现场服务和业务开发执行变得关键。创始人的技术深度是正面输入，但不能替代制造、安全、质量、采购和服务领导力。因此，论点不应因为模糊失望而破裂，而应被可观察触发项打破：在合理里程碑前没有具名客户或生态证明、没有公开质量和支持控制证据、无法展示产品专属
              IP
              或导入验证进展，或有证据表明政策约束实质阻断供应链或客户准入。正确的尽调反应，是把这些列为可监控风险并给出明确问题，而不是把它们笼统归为普通初创不确定性。这种框定让风险章节绑定可观察里程碑，而不是泛泛担心硬科技初创。投资人还应注意，下行大概率不会一次性出现。它可能先表现为试点证明滑坡，随后是伙伴验证缺失，再之后是融资谈判变难。把这些视为连续预警灯，比等待单次灾难性失败更能形成有用的治理框架。
