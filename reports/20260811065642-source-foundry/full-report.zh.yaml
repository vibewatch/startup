      - number: '1.2'
        title: 创始人、领导层与治理表面
        blocks:
          - type: paragraph
            body: >-
              创始人画像真实，但厚度仍低于后期硬件估值通常需要的水平。公开记录目前只识别出三个高管角色：Obaid 任 CEO 和 CFO，Burg 任秘书。Stanford 来源让两人的学术背景可读。Obaid 的
              Bio-X fellowship 以及后续 Stanford 神经科学报道显示，他具备强材料科学、微制造和硅电子能力，并反复强调可扩展工艺开发。Burg 的公开 Stanford
              页面不同：重点是有机硅酸盐玻璃和力学性能相关的计算材料工作，而不是光刻工具公司的公开运营经验。这不排除团队资格，但会改变尽调重点。公开记录支持一个技术严肃、扎根 Stanford
              的创始二人组；它还没有展示更宽的高管梯队、董事会委员会、运营型招聘或治理机制，无法为数十亿美元级半导体设备扩张降风险。即便最宽松地解读，公开治理披露也仍处于机构化之前。
