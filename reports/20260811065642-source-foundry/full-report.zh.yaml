      - number: '6.3'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              没有公开客户名单，传统留存分析就会坍缩为代理和明确空白。Source Foundry 没有公开
              NRR、GRR、流失、合同期限、续约或满意度数据。最多只能说，相邻品类动态暗示，一旦工具或工作流完成导入验证，留存会很黏，因为晶圆厂制程变更和现场服务关系在运营上很难撤回。问题是，在采用得到证明前，不能提前给耐久性记功。扩张逻辑比留存逻辑更容易勾勒。一个主要晶圆代工厂、试验线或国家半导体项目完成单一锚点验证，可能带来跨制程模块、封装、支持服务或相邻晶圆厂的后续需求。但同一结构也制造严重集中风险：现实的近期账户宇宙很小，每个账户技术要求都很高，一个导入验证延迟就能让收入预期移动数年。公开可比生态也强调同一点。它们的设计目标是降低设计门槛、缩短上市时间，并帮助客户更快达到首片硅或原型状态。如果
              Source Foundry
              缺少类似生态渗透，客户扩张被卡住的原因可能不是理论需求，而是导入验证吞吐量和信任。在公司披露哪怕狭窄参考客户集之前，投资人应假设集中度会极端高，耐久性大体不可知。这种不透明尤其重要，因为目前没有公开迹象显示客户引用已按地域、买家类型或采购渠道多元化。
