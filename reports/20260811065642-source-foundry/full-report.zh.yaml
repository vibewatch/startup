      - CV044
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
      - 紧迫性
    rows:
      - - 股权结构表与条款
        - 出售股权比例、清算优先权、反稀释、董事会权利，以及 8 月资金是新股还是老股交易
        - 这是判断 $5B 是真实经济价值还是叙事头条价值的核心。
        - 向公司或领投方索取融资文件、董事会同意文件和投资人摘要。
        - 关键
      - - 产品边界
        - 第一个产品或子系统的精确范围、架构层级，以及相对 ASML 哪些在范围内、哪些不在
        - 没有这些，可比分析和里程碑映射仍然太抽象。
        - 索取产品路线图、工程简报和客户问题陈述。
        - 关键
      - - 原型里程碑
        - 原型、子系统和认证就绪的日期、指标和闸门标准
        - 这是映射情景时间和资本充足性的必要输入。
        - 索取里程碑计划和内部评审节奏。
        - 关键
      - - 客户路径
        - NDA 下的具名试点、设计伙伴、生态赞助方或晶圆厂对话
        - 需要把战略重要性转化为实际收入概率。
        - 按客户、阶段和技术卡点索取销售管线。
        - 关键
      - - 经济性桥
        - 收入模型、ASP 或合同结构、服务组成和毛利率目标
        - $5B 估值标记需要一条通往数亿美元收入的可信路径。
        - 索取定价框架、利润率模型和装机基础假设。
        - 高
      - - 融资韧性
        - Situational Awareness 之后谁能继续供资，以及采用什么结构
        - 如果认证周期很长，后续出资能力就很关键。
        - 索取投资财团地图、储备策略和替代融资路径。
        - 高
    notes: 这些问题优先覆盖那些比泛泛市场尽调更快改变建议的事项。
    claimRefs:
      - CV004
      - CV026
      - CV035
      - CV047
      - CV048
  - id: TV007
    title: 估值历史和公开融资背景
