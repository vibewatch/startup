  - id: TR005
    title: 缓释措施与止损标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 客户证明风险
        - 具名试点或生产证明
        - 到下一次重大融资或 2027 里程碑前，仍没有具名客户、试点或生态证明
        - 从观察上调为投资逻辑破裂候选
      - - 质量体系风险
        - 公开或 NDA 下的质量证据
        - 尽调拿不到认证路线图、正常运行时间模型或服务政策
        - 不要把生产规模部署假设纳入投资测算
      - - 政策风险
        - 供应链或出口管制扰动
        - 关键 BOM 项或客户地区落入受阻或延迟的管制路径
        - 下调商业化时间和资本开支效率假设
      - - 执行风险
        - 产品特定里程碑证明
        - 没有产品特定认证、基准测试或集成证据
        - 将建议转向继续研究 / 观察
      - - 融资风险
        - 估值与证据之间的缺口拉大
        - 公司在产品或客户证据没有实质改善时寻求新资本
        - 假设存在降价轮或优先权压顶风险
      - - 集中度风险
        - 客户分散度
        - 销售管线集中在一两个客户，且试点没有分散
        - 给上行情景封顶，提高下行概率
    notes: 这些止损标准强调可观察、可审计，而不是凭印象判断。
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 落在这里的原因
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 融资事件真实存在，但公开记录还不足以用常规估值工具支撑以 $5B 入场。
        - 不要直接按表面信息认定该轮可投，先做更深尽调。
      - - 信心
        - 中
        - 多个独立来源都指向这轮融资，但价格仍主要来自第三方，条款细节缺失。
        - 用情景区间，而不是单一公允价值点估。
      - - 风险评级
        - 高
        - 在公开收入出现之前，认证风险、客户不透明、赞助方集中和倍数压缩都可能先打过来。
        - 假设下行会通过延迟和重定价体现，而不只是彻底失败。
      - - 估值立场
        - 昂贵
        - 当前估值标记已接近那些披露了更多运营证明的后期硬科技平台。
        - 接受价格前，要求证据或结构性保护。
      - - 入场纪律
        - 只在证据驱动条款下入场
        - 叙事变好但没有新证据还不够；钱更多但条款更不清晰，反而可能更糟。
        - 同时坚持里程碑、客户和股权结构清晰。
    notes: 这张表总结了据报道的 ~$5B 估值标记下的投资测算姿态；它是判断表，不是已披露的运营 KPI 表。
    claimRefs:
