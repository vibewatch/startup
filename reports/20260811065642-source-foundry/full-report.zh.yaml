    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、设立与公开足迹
        blocks:
          - type: paragraph
            body: >-
              相比据称估值，Source Foundry 的公开身份异常稀疏，因此最可靠的底层事实来自记录，而不是营销。California 商业备案显示，Source Foundry Inc.
              是一家存续公司，2025-07-18 注册，成立地为 Delaware，并把 San Francisco 的 674 Harrison Street 作为主要地址和邮寄地址。2026 年 8
              月的报道在这个法律壳上叠加了更高层叙事：公司由 Stanford 研究人员 Abdulmalik Obaid 和 Joe Burg 于 2025 年创立，试图让 AI
              时代的半导体制造更快、更便宜、更可扩展。这个组合很关键。法律记录证明公司存在，也说明它在哪里；报道解释投资人为什么在意。审阅过的证据仍没有给出一个普通初创公司的公开入口。留存资料没有公开半导体产品网站、工具规格表、客户案例或发布路线图，外部人无法一步从法律存在走到商业理解。
