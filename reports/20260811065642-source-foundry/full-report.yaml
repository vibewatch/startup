  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Overview: Incumbent Status Quo First, Alternatives Second'
        blocks:
          - type: paragraph
            body: >-
              The central competitive fact is that Source Foundry is trying to enter a market where the default answer
              already works. ASML says its EUV systems print the most intricate layers for 7 nm, 5 nm, and 3 nm nodes,
              while DUV remains necessary in parallel for many other layers. That means the incumbent is not one
              isolated box but an installed workflow that spans scanners, software, service, and productivity tuning.
              ASML's own 2025 annual report shows €32.7 billion of net sales, 535 systems sold, and a supplier base of
              5,100, underscoring how much industrial scale a challenger must overcome. Public evidence therefore
              suggests three rival classes for Source Foundry: first, ASML's installed-base status quo; second,
              alternative-architecture challengers such as Nikon, Canon, and xLight; and third, substitute paths in
              which large fabs solve the bottleneck inside broader foundry and packaging ecosystems rather than
              introducing a new standalone vendor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP026
