          Source Foundry does not have.
        - Disclose a credible path toward $268M-$380M+ revenue and prove early conversion.
      - - Private comparables
        - Hadrian, Helion, Pacific Fusion, and 2026 chip rounds show investors still fund frontier bottlenecks at scale.
        - Those comps either disclose more proof, use milestone tranches, or operate in different end markets.
        - Close the proof gap or structure new capital around milestones rather than narrative alone.
