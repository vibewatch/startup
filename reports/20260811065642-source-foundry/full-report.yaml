  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >-
    Public filings suggest Source Foundry is pursuing more than a single machine: trademark coverage spans lithography
    machines, semiconductor-manufacturing machines, advanced-lithography software, wafer-processing software, masks and
    reticles, and after-sale repair, maintenance, and technical-support services. The likely business is therefore an
    equipment-plus-software-plus-services stack aimed at upstream chip-manufacturing bottlenecks rather than a
    conventional fabless chip company.
  customerFocus: >-
    Enterprise semiconductor buyers with deep process capabilities and capital budgets: leading-edge foundries, IDMs,
    pilot-line or research-infrastructure operators, and ecosystem partners that can help qualify manufacturing tools.
  businessModel: >-
