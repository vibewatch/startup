companyProfile:
  summary: >-
    Source Foundry is a San Francisco-based stealth semiconductor-equipment startup founded in 2025 by Stanford
    researchers Abdulmalik Obaid and Joe Burg. Public records and trademark filings indicate a broad ambition across
    lithography machines, wafer and chip-processing software, masks and reticles, technical support, and even
    facility-engineering or custom-manufacturing services. The investment case rests on a real bottleneck: backers argue
    the constraint in AI is moving upstream from chips to the tooling that manufactures them. Public proof, however,
    still lags the narrative. No retained source discloses revenue, named customers, precise product architecture, or
    cap-table terms, leaving the company strategically interesting but operationally opaque at a reported ~$5B
    valuation.
  foundedDate: '2025-07-18'
  founders:
