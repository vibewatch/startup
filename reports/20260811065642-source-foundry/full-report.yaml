      - number: '8.2'
        title: Public semiconductor comparables show what $5 billion usually buys in proven revenue
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to test the Source Foundry mark is not through private-market mythology but through
              public revenue multiples that already reflect scaled semiconductor operating proof. StockAnalysis shows
              ASML, Applied Materials, Lam Research, and KLA trading at roughly 14x to 19x EV/Sales, while scaled
              foundry and IDM anchors TSMC and Intel sit nearer 9x to 13x. Those are not perfect transfer comps. ASML is
              a monopoly-grade lithography incumbent, Applied and Lam sit in adjacent equipment layers, KLA commands a
              process-control premium, and TSMC and Intel are manufacturers rather than tool vendors. But that range
              still clarifies the burden of proof. A $5 billion enterprise value at those multiples implies something
              like $268 million to $556 million of annual revenue depending on which public benchmark is used. Source
              Foundry discloses no revenue at all. That does not mean the company cannot become worth $5 billion; it
              means the current public evidence does not show the bridge. Mature public peers also expose the
              information that makes pricing possible: revenue history, margins, cash flow, installed-base economics,
              and investor materials. Source Foundry does not. The macro backdrop is supportive — SEMI, SIA, and IDC all
              show AI-driven semiconductor growth and equipment demand in 2026 — but category tailwind is not the same
              thing as company-specific transferability. Today’s public semicap multiple range is therefore useful as a
              discipline tool, not as a direct endorsement of the current private mark.
