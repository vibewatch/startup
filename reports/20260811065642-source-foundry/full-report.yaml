      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The round is price evidence, not proof of fair value
            body: >-
              The correct takeaway from the August 2026 financing is that Source Foundry has serious backers and a real
              strategic narrative. The incorrect takeaway is that outsiders can already underwrite $5 billion from
              public evidence alone.
            calloutType: recommendation
            claimRefs:
