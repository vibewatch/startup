        title: Founders, Leadership & Governance Surface
        blocks:
          - type: paragraph
            body: >-
              The founder profile is real but still thinner than what a late-stage hardware valuation would normally
              warrant. Public records identify only three officer roles today: Obaid as CEO and CFO and Burg as
              secretary. Stanford sources make their academic backgrounds legible. Obaid's Bio-X fellowship and later
              Stanford neuroscience coverage show strong materials-science, microfabrication, and silicon-electronics
              credentials with repeated emphasis on scalable process development. Burg's public Stanford page is
              different: it centers computational materials work on organosilicate glasses and mechanical properties
              rather than public operating experience inside lithography-tool companies. That does not disqualify the
              team, but it does shape diligence. The public record supports a technically serious, Stanford-rooted
              founding pair; it does not yet show the broader executive bench, board committees, operator hires, or
              governance mechanics that would de-risk a multi-billion-dollar semiconductor-equipment buildout. Even the
              most generous reading is that public governance disclosure is still pre-institutional.
