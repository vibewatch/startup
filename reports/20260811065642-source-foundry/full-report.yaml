  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer Segments and Procurement Logic
        blocks:
          - type: paragraph
            body: >-
              Source Foundry almost certainly does not have a broad SMB or developer-style customer base. The product
              scope visible in trademark records—advanced-lithography software, wafer-processing software, masks and
              reticles, semiconductor manufacturing support, and field services—points instead to a narrow set of
              enterprise buyers with deep process-engineering teams and long qualification cycles. The likeliest
              top-tier buyers are leading-edge foundries and large integrated device manufacturers that already manage
              advanced logic, packaging, and process-development programs. A second segment is pilot-line and research
              infrastructure buyers such as TIE, which show how new manufacturing tools can enter the market through
              prototype, open-access, or national-capability pathways before mainstream production. A third segment is
              ecosystem or channel buyers: foundry alliances, packaging providers, design-service partners, or
              process-enablement programs that can help a new tool earn qualification without requiring immediate
              fleetwide production commitment. In every segment, the user, buyer, and payer are different people.
              Process engineers and equipment teams may evaluate the technology, but budget authority often sits with
              fab leadership, platform owners, or government-backed consortium leadership. That creates a slow,
              high-friction procurement model with very large strategic value per account. The commercial upside per
              qualified account could therefore be unusually large.
