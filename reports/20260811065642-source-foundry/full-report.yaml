  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Financing below current mark
        - Next priced round or reliable secondary clears materially below ~$5B
        - Confirms today’s price ran ahead of proof.
        - Treat as thesis break until new proof or terms are disclosed.
      - - No customer or pilot proof
        - No named pilot, design partner, or fab validation path before next major capital event
        - Undercuts the bridge from bottleneck narrative to commercial conversion.
        - Hold recommendation at research-more or step away.
      - - No product boundary disclosure
        - Public or diligence record still cannot say what precise layer Source Foundry is selling
        - Makes comps and milestone planning too fuzzy to underwrite.
        - Do not price the company as a platform until the first wedge is clear.
      - - Sponsor instability worsens
        - Lead sponsor’s financing capacity or governance credibility weakens further
        - Increases follow-on and signaling risk at exactly the time the company may still need patient capital.
        - Haircut upside and elevate dilution risk.
      - - Qualification slippage
        - Prototype or integration milestones slip without offsetting customer evidence
        - Pushes revenue bridge further out while maintaining a rich current mark.
        - Move expected value toward bear case.
      - - Policy or supply-chain blockage
        - Export-control, supplier, or facility constraints materially slow commercialization
        - Turns a hard technical story into a delayed economic one.
        - Reduce probability of bull case and widen downside.
    notes: These triggers are designed to be observable and investment-actionable rather than rhetorical.
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
      - Urgency
    rows:
      - - Cap table and terms
        - >-
          Ownership sold, liquidation preferences, anti-dilution, board rights, and whether August capital was primary
          or secondary
        - Central to whether $5B is clean economic value or narrative headline value.
        - Request financing docs, board consents, and investor summary from company or lead investors.
        - Critical
      - - Product boundary
        - Exact first product or subsystem, architecture layer, and what is and is not in scope relative to ASML
        - Without this, comparable analysis and milestone mapping remain too abstract.
        - Request product roadmap, engineering brief, and customer problem statement.
        - Critical
      - - Prototype milestones
        - Dates, metrics, and gating criteria for prototype, subsystem, and qualification readiness
        - Necessary to map scenario timing and capital sufficiency.
        - Request milestone plan and internal review cadence.
        - Critical
      - - Customer path
        - Named pilot, design partner, ecosystem sponsor, or foundry conversations under NDA
        - Needed to translate strategic importance into actual revenue probability.
        - Request pipeline by account, stage, and technical blocker.
        - Critical
      - - Economics bridge
        - Revenue model, ASP or contract structure, service component, and gross-margin targets
        - A $5B mark needs a plausible route to hundreds of millions in revenue.
        - Request pricing framework, margin model, and installed-base assumptions.
        - High
      - - Financing durability
        - Who can fund the company after Situational Awareness, and on what structure
        - Follow-on capacity matters if qualification cycles are long.
        - Request investor-syndicate map, reserve strategy, and alternative financing paths.
        - High
    notes: These asks prioritize items that can move the recommendation faster than generic market diligence.
    claimRefs:
      - CV004
      - CV026
      - CV035
      - CV047
      - CV048
