            body: >-
              Because Source Foundry discloses no cost data, the best public proxies come from mature semiconductor
              equipment and foundry operators. ASML's 2025 annual report shows €32.7 billion of sales, 52.8% gross
              margin, and €4.7 billion of annual R&D, while Q1 and Q2 2026 each carried roughly €1.2 to €1.3 billion of
