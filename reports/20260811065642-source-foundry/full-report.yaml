        title: Revenue Model and the Core Disclosure Gap
        blocks:
          - type: paragraph
            body: >-
              Public reporting gives Source Foundry valuation and financing headlines, but almost no commercial detail.
              Benzinga says the company raised a fresh $400 million from Situational Awareness, bringing the fund's
              total commitment to $500 million at a reported $5 billion valuation, and describes the company as
              developing lithography tools. Trademark filings broaden the picture further: they cover wafer-processing
              software, machine installation, maintenance, repair, and technical-support services. That means the
              possible revenue model is wider than a one-time hardware sale. Plausible streams include tool sales, pilot
              or non-recurring engineering fees, software or control licenses, and post-install service contracts. The
              problem is that none of those streams is publicly quantified. No retained source discloses revenue,
              bookings, backlog, paid pilots, average selling price, or customer count. Financial analysis therefore
              begins from absence: public evidence is sufficient to sketch monetization paths, but not to confirm
              whether any of them are active today.
