  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a real financing signal into weaker priceability once term opacity, sponsor
      concentration, and missing commercial proof are tested.
    data:
      nodes:
        - id: funding
          label: Real financing event
          detail: $400M fresh capital and ~$500M total disclosed commitment confirm the company matters.
          tone: positive
        - id: mission
          label: Strategic bottleneck thesis
          detail: Backers frame lithography tooling as a critical AI supply-chain choke point.
          tone: positive
        - id: terms
          label: No public cap-table terms
          detail: Ownership sold, preferences, and governance changes are not disclosed.
          tone: warning
        - id: proof
          label: No public revenue or customer proof
          detail: The company remains hard to value through normal operating evidence.
          tone: warning
        - id: sponsor
          label: Sponsor concentration risk
          detail: Situational Awareness conviction is real, but its own drawdown raises context risk.
          tone: warning
        - id: decision
          label: Research-more / expensive
          detail: Require proof-led diligence before accepting the current price.
          tone: neutral
      edges:
        - from: funding
          to: mission
        - from: mission
          to: terms
        - from: terms
          to: proof
        - from: proof
          to: sponsor
        - from: sponsor
          to: decision
    approximationNotes: >-
      The flow uses decision gates instead of a numeric formula because the public record does not disclose enough
      inputs for deterministic valuation.
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV026
      - CV035
      - CV041
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Using public benchmark EV/Sales multiples, the revenue needed to support a $5B valuation is still very large for a
      company with no public revenue disclosure.
    data:
      xAxis: Benchmark multiple anchor
      yAxis: Required annual revenue to support $5B valuation (USD M)
      items:
        - label: Intel 8.99x
          value: 556
          note: Lower-multiple IDM anchor still implies more than half a billion dollars of annual revenue.
          tone: warning
        - label: TSMC 13.15x
          value: 380
          note: Scaled foundry anchor implies almost $400M of annual revenue.
          tone: warning
        - label: Applied 14.25x
          value: 351
          note: Adjacent semicap broad-line multiple still needs roughly $350M of revenue.
          tone: warning
        - label: ASML 16.51x
          value: 303
          note: Even monopoly-grade lithography multiples assume roughly $300M of annual revenue.
          tone: neutral
        - label: Lam 16.44x
          value: 304
          note: Process-equipment premium multiple is similar to ASML on required revenue.
          tone: neutral
        - label: KLA 18.64x
          value: 268
          note: High-end public semicap premium still implies almost $270M of revenue.
          tone: positive
    approximationNotes: >-
      Revenue requirements are simple arithmetic: $5,000M divided by each benchmark EV/Sales multiple. They are
      sensitivity anchors, not forecasts.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario bands stay wide because the public record lacks DCF-grade operating inputs and because future dilution
      could be mild or severe depending on milestone timing.
    data:
      items:
        - label: Bear case
          low: 1500
          mid: 2250
          high: 3000
          displayValue: $1.5B-$3.0B
          detail: >-
            Prototype progress exists but customer or qualification proof remains insufficient before the next financing
            event.
          tone: warning
        - label: Base case
          low: 3000
          mid: 4000
          high: 5000
          displayValue: $3.0B-$5.0B
          detail: Prototype and ecosystem progress become credible, but the revenue bridge remains partly future-dated.
          tone: neutral
        - label: Bull case
          low: 5000
          mid: 6500
          high: 8000
          displayValue: $5.0B-$8.0B
          detail: Source Foundry earns public product clarity, customer proof, and a credible path to semicap-platform scale.
          tone: positive
    approximationNotes: >-
      These are scenario-based valuation bands in USD millions. They do not model exact waterfalls, tranches, or DCF
      cash flows because those terms are not public.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
