          detail: Process and equipment teams assess architecture fit
        - id: pilot
          label: Pilot or prototype use
          detail: Pilot line, institute, or constrained fab workflow trial
        - id: qual
          label: Qualification
          detail: Process validation and operational support prove readiness
        - id: prod
          label: Production or recurring support
          detail: Tool, software, or service expands into repeat use
