      - number: '3.5'
        title: Moat Durability and What Public Evidence Still Cannot Prove
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to say Source Foundry is being funded to attack a real bottleneck, but
              weak evidence for underwriting a public moat. Reported financing and trademark filings imply a broad
              ambition across lithography-related tools, software, maintenance, and support. That breadth could become
              an advantage if the company is building a system-level product rather than one isolated machine. But it
              also means the competitive set cannot yet be pinned down cleanly: if Source Foundry is attacking light
              sources, xLight is more relevant; if it is attacking full scanners, ASML and Nikon dominate; if it is
              attacking packaging or process-control adjacencies, Canon, EVG, TSMC, Samsung, and Intel matter more. The
              underwriting conclusion is therefore conservative. Source Foundry may have strategic timing and capital,
              but public evidence does not yet show customer proofs, pricing leverage, installed service capability, or
              production-readiness metrics that would justify a strong moat claim against entrenched incumbents and
              well-funded substitutes.
