      - number: '7.3'
        title: Financial, People, and Thesis-Break Risks
        blocks:
          - type: paragraph
            body: >-
              Financial and people risks sit downstream of the operational ones. A reported $5B valuation and $400M
              raise can buy time, but they also raise the proof bar. If Source Foundry is still pre-commercial publicly
              in 2026, then any delay in customer proof, partner qualification, or product reliability can quickly turn
              into valuation-compression and follow-on financing risk. The customer universe is tiny, so one anchor
              account matters enormously; that makes hiring, field service, and business-development execution critical.
              Founder technical depth is a positive input, but it does not replace manufacturing, safety, quality,
              procurement, and service leadership. The thesis should therefore break not on vague disappointment but on
              observable triggers: no named customer or ecosystem proof by a reasonable milestone, no public evidence of
              quality and support controls, inability to show product-specific IP or qualification progress, or evidence
              that policy constraints materially block supply-chain or customer access. The right diligence response is
              to rank these as monitorable risks with explicit asks rather than to hand-wave them as normal startup
              uncertainty. That framing keeps the risk chapter tied to observable milestones rather than to generic fear
              about hard-tech startups. Investors should also notice that the downside is unlikely to appear all at
              once. It will probably show up first as slippage in pilot proof, then as missing partner validation, then
              as tougher financing conversations. Treating those as sequential warning lights creates a more useful
              governance framework than waiting for a single catastrophic failure.
