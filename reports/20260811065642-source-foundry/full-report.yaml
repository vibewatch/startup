  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Highest-Severity Risks: Proof, Qualification, and Policy Exposure'
        blocks:
          - type: paragraph
            body: >-
              The highest risks are the ones created by the gap between ambition and public proof. Trademark records,
              founder profiles, and funding reports support a broad semiconductor-manufacturing push, but they do not
              show a named product, a published customer deployment, or an exposed quality system. That matters because
              semiconductor manufacturing buyers do not underwrite novelty alone. They need zero-defect aspirations,
              supplier controls, support infrastructure, and qualification pathways that are visible in mature foundry
              and equipment ecosystems. Public comparator sources make the bar clear: TSMC, UMC, and SkyWater publish
              quality and risk-management systems; Samsung, Intel, and TSMC publish customer-enablement programs; Canon
              and xLight publish named prototype or institutional proof points. Source Foundry has not yet published
              analogous evidence. As a result, the most severe risks are not abstract startup risks but specific
              industrialization risks: the company may have to solve product readiness, customer proof, and policy-safe
              supply access at the same time. The current issue is not that these controls are known to be missing
              internally, but that none of them are publicly visible yet, which forces outside investors to assume
              larger residual execution risk.
