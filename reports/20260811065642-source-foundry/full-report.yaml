        title: 'Product Definition: Broad Scope, Narrow Verified Detail'
        blocks:
          - type: paragraph
            body: >-
              The most concrete public product evidence comes from trademark coverage, not from a corporate product
              page. USPTO.report and Justia records for Source Foundry's marks state that the company intends to cover
              semiconductors, chips, wafers, software for wafer processing, software for advanced semiconductor
              lithography, lithographic masks and reticles, and installation or maintenance services for semiconductor
              manufacturing machines. That combination matters because it places Source Foundry in customer-workflow
              terms: a buyer could engage the company not only for a machine but also for process software, consumable
              or enabling artifacts, and post-install support. However, public evidence stops there. There is no
              retained source naming a commercial SKU, no public architecture diagram, and no data sheet describing
              whether the company's first product is a source, scanner, software layer, or packaging-adjacent tool.
              Product definition is therefore partially knowable in scope but not in concrete product form. That absence
              should shape diligence behavior. In enterprise semicap, buyers normally see at least a narrow set of
              public proof points—product names, architecture families, pilot references, or application notes—even when
              deeper performance data remain confidential. Here, the reverse is true: Source Foundry shows unusually
              broad legal scope but unusually little public product specificity. The chapter therefore treats trademark
              scope as the floor of what the company wants permission to sell, not as proof that every category is
              already engineered, integrated, or commercially ready.
