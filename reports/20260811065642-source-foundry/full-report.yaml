      - number: '3.4'
        title: Switching Costs, Distribution Power, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              Switching costs in lithography are not just technical; they are organizational and geopolitical. ASML and
              Nikon both market portfolios that include not only patterning tools but also software, metrology,
              alignment, and service networks, which makes qualification about uptime and fab compatibility as much as
              first-principles physics. Canon's long development cycle for NIL, and IEEE Spectrum's reporting on overlay
              and defect challenges, show how hard it is to move from intriguing physics to reliable production.
              Export-control uncertainty adds another layer. Bloomberg reported that U.S. officials warned ASML one
              advanced tool may have reached China, while CISES argues the real chokepoint is a coalition of Dutch,
              German, Japanese, and American suppliers rather than one firm alone. For a startup, that fragmentation
              increases the value of trusted supply chains and can make sales cycles slower, narrower, and more
              politically conditioned than the headline AI-demand story suggests.
            claimRefs:
