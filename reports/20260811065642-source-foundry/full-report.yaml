      - number: '8.3'
        title: Scenario ranges are supportable; a conventional DCF is not
        blocks:
          - type: paragraph
            body: >-
              Because Source Foundry discloses no revenue baseline, margin structure, capex profile, burn rate, or
              customer conversion path, a conventional discounted cash flow model would be false precision. The right
              approach is scenario analysis tied to proof milestones. The market backdrop does help explain why
              investors are willing to make large bets: Crunchbase says 2026 semiconductor startup funding is still
              running hot, and the private market has supported unusually large checks into bottleneck narratives such
              as Ayar Labs, Etched, Hadrian, Pacific Fusion, and Helion. But those transactions also sharpen discipline
              rather than relaxing it. Hadrian’s nearly $8 billion Series D came with far more public operating context
              around factories, software, and customers. Helion’s $5.425 billion post-money followed technical
              milestones and named commercial counterparties. Pacific Fusion’s $900 million Series A was
              milestone-tranched, explicitly matching capital release to proof gates. Source Foundry, by contrast, sits
              near those valuation levels in the public record while still offering very little product, customer, or
              financing-structure detail. That leads to wide bands. A bear case below the current mark fits a world
              where the company proves only a subsystem wedge or prototype but not multi-customer qualification. A base
              case around the current mark requires credible prototype progress and a believable route toward hundreds
              of millions of revenue over time. A bull case above the current mark requires Source Foundry to look like
              a true domestic semicap platform rather than a thesis-only challenger. In all three cases, the current
              price leaves little room for execution slippage.
            claimRefs:
              - CV029
