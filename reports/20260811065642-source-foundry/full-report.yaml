      - number: '3.2'
        title: Direct, Adjacent, and Substitute Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Nikon and Canon are the clearest public examples of how challengers can attack narrower wedges instead of
              replacing ASML outright. Nikon still sells semiconductor lithography, alignment, and metrology systems,
              and its DSP-100 packaging platform shows one route into advanced packaging with maskless exposure and
              large-panel support. Canon is pursuing a different path with nanoimprint lithography: its FPA-1200NZ2C
              claims 14 nm minimum linewidth, a path toward 2 nm-class patterning, and a lower-cost, lower-power
              approach than EUV, but public deployment is still centered on research and prototype settings such as TIE.
              xLight attacks yet another layer by trying to replace the EUV light source itself with a free-electron
              laser utility that can sit outside the fab and power multiple scanners. EV Group is more adjacent than
              direct for front-end EUV, but it matters because its mask aligners, maskless tools, and packaging
              expertise show that buyer attention can move toward back-end and heterogeneous-integration bottlenecks
              rather than stay purely at front-end scanner resolution.
