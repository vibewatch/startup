      - number: '1.3'
        title: Funding Base, Valuation & Investor Interpretation
        blocks:
          - type: paragraph
            body: >-
              The capital story is the clearest reason Source Foundry matters now. Reviewed August 2026 reporting
              consistently says Situational Awareness added a fresh $400 million investment this week, bringing the
              fund's total commitment to $500 million and supporting a roughly $5 billion valuation. Public sources also
              say Sequoia backed the company earlier, but they stop well short of a full cap-table description. That gap
              matters because the deal terms are largely blank: no reviewed source discloses whether the instrument was
              preferred equity, debt, or some committed facility, and none gives ownership, liquidation preference, or
              board-right detail. The financing must therefore be understood in two layers. First, it is a huge vote of
              confidence in an upstream AI-manufacturing thesis. Second, it is still not a fully underwritable round
              from public evidence alone. The lead investor context is also mixed. Situational Awareness was coming off
              a bruising public-market unwind, which makes the Source Foundry check look both bold and somewhat forced
              as a long-duration private bet after listed AI infrastructure positions went wrong.
