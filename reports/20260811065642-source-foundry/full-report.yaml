              soon; they show how much ongoing engineering spend remains necessary even after a dominant vendor reaches
              scale. Intel's 2025 10-K is even more directly relevant on risk structure, emphasizing significant,
              long-term, inherently risky investment in R&D and manufacturing facilities, dependence on customer wins
              for next-generation nodes, and exposure to supply, trade, and incentive policy. For Source Foundry, the
              likely near-term economics are therefore negative or indeterminate: prototype development, supplier
              qualification, installation, field support, and possibly custom fab integration are likely to dominate
