      - number: '1.4'
        title: What the Company Appears to Be Building
        blocks:
          - type: paragraph
            body: >-
              Because Source Foundry remains in stealth, trademark filings are currently the most informative
              quasi-product documents. They imply something broader than a single secret machine. The March 2026 filings
              span lithography machines, semiconductor-manufacturing equipment, wafer-processing software, advanced
              lithography development tools, technical support, maintenance, facility engineering, training, and even
              custom manufacturing. In other words, the public paper trail describes a platform ambition across
              machines, software, and manufacturing services. That aligns with the investor story repeated in
              Sequoia-adjacent and August funding coverage: Source Foundry is not being sold as another AI-chip designer
              but as a company trying to attack the manufacturing bottleneck upstream of chip design. The strategic
              context helps explain why this pitch resonates now. ASML still anchors the frontier of lithography, Intel
              is already taking High-NA EUV into production, Canon and Nikon continue to occupy meaningful adjacent
              ground, and xLight has drawn federal support for an alternative EUV light source. Source Foundry is
              entering a real and crowded problem set, not an empty white space.
