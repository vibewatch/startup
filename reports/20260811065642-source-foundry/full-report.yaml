  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Bigger Than Lithography Alone, Smaller Than All Semiconductor Capex'
        blocks:
          - type: paragraph
            body: >-
              The first analytical trap with Source Foundry is defining the market too broadly. If one simply says the
              company is attacking a semiconductor bottleneck, the headline TAM becomes every dollar spent on
              semiconductor manufacturing equipment or even every dollar of chip demand. That is directionally useful
              but not decision-useful. The better starting point is to combine the company’s trademark-defined scope
              with how incumbents describe their own stacks. Source Foundry’s public filings span machines, lithography,
              wafer-processing software, tool controls, and facility engineering. ASML likewise frames its value
              proposition across systems, metrology, inspection, and software rather than a bare scanner. That means the
              market boundary should include lithography tools and the process-control layers tied tightly to them. But
              it should not include commodity back-end handling, generic EDA, or all semiconductor capex by default. The
              spend pool is therefore substantial, yet still a subset of total wafer-fab and packaging investment.
            claimRefs:
