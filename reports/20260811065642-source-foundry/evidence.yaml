evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Exact security type, ownership percentage, liquidation preference, and board rights for the August 2026
      Situational Awareness financing.
    whyItMatters: >-
      Without security terms, public valuation headlines cannot be translated into a clean economic ownership or
      downside-protection view.
    diligencePath: Request full financing documents, cap table, and board consents under NDA from management or lead investors.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, customer count, headcount, pilot installations, backlog, and current cash-burn disclosures.
    whyItMatters: >-
      A reported $5 billion valuation cannot be compared to commercial traction or capital efficiency without even basic
      operating metrics.
    diligencePath: >-
      Obtain monthly financial package, customer pipeline summary, and current organization chart directly from the
      company.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: product-readiness
    missingEvidence: >-
      Process-node target, wafer size, throughput, prototype status, and commercialization timeline for Source Foundry's
      first tool or system.
    whyItMatters: >-
      The difference between concept, prototype, pilot tool, and production-ready system is the difference between a
      moonshot and an underwritable hardware platform.
    diligencePath: >-
      Request product roadmap, technical specification deck, development milestones, and independent benchmark or
      qualification data.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: public-website
    missingEvidence: A semiconductor-company public homepage or official product page for Source Foundry.
    whyItMatters: >-
      The lack of a normal public information surface increases reliance on indirect records and secondary press for
      even basic company-description work.
    diligencePath: >-
      Ask management whether the company intentionally has no public site, or whether a stealth microsite / materials
      room exists for investors.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: governance-depth
    missingEvidence: >-
      Board composition, committee structure, delegated finance controls, and key executive hires beyond the three
      officer roles seen in public filings.
    whyItMatters: >-
      Governance maturity is especially important when a founder is publicly listed as both CEO and CFO inside a
      capital-intensive hardware business.
    diligencePath: Request board deck materials, committee charters, and leadership roster under diligence access.
    relatedQuestionRefs:
      - QO007
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: source-foundry-som
    missingEvidence: First-product definition, pricing model, target buyer layer, and deployment pathway for Source Foundry.
    whyItMatters: >-
      Without product specificity, the market can only be sized with top-down proxies rather than a true serviceable
      obtainable market.
    diligencePath: Request product roadmap, ICP definition, buyer list, and planned sales motion from management.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: private-evidence-only
    severity: material
    topic: customer-conversion-timing
    missingEvidence: Actual qualification timeline from pilot line to high-volume fleet deployment for Source Foundry's first product.
    whyItMatters: >-
      Equipment markets are governed by qualification cycles; the difference between a pilot and a fleet win is often
      years and hundreds of millions of dollars.
    diligencePath: Obtain detailed commercial milestones, target fabs, and proof-of-concept timeline under NDA.
    relatedQuestionRefs:
      - QM018
      - QM020
  - type: conflicting-data
    severity: minor
    topic: market-lens-dispersion
    missingEvidence: >-
      A single agreed industry convention for whether Source Foundry should be benchmarked against all semiconductor
      equipment, lithography only, or lithography-plus-control software.
    whyItMatters: >-
      Different scope choices change the apparent TAM by more than 5x, which can distort strategy and valuation debates
      if not normalized.
    diligencePath: Choose one internal sizing convention and reconcile all later chapters to it before investment committee use.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM022
  - type: missing-source
    severity: material
    topic: buyer-specific-budget-data
    missingEvidence: Public buyer-by-buyer lithography budget allocations for the precise categories Source Foundry appears to target.
    whyItMatters: Knowing that capex is large is not the same as knowing how much budget is contestable by a new vendor.
    diligencePath: >-
      Collect procurement, supplier, and equipment-deployment data from industry databases or direct diligence with fabs
      and tool integrators.
    relatedQuestionRefs:
      - QM007
      - QM023
  - type: private-evidence-only
    severity: material
    topic: source-foundry-market-position
    missingEvidence: >-
      Management explanation of whether Source Foundry intends to complement incumbent EUV fleets, displace specific
      layers, or sell an orthogonal process architecture.
    whyItMatters: >-
      The company’s actual go-to-market posture determines whether the market should be modeled as incumbent
      replacement, budget expansion, or R&D optionality.
    diligencePath: >-
      Ask the company to map its product against ASML, Canon, Nikon, xLight, and internal fab alternatives at the
      workflow level.
    relatedQuestionRefs:
      - QM002
      - QM012
      - QM020
