    {
      "id": "architecture-and-technical-stack",
      "title": "Architecture and the Technical Stack Source Foundry Would Need to Compete Against",
      "body": "Although Source Foundry's exact design is undisclosed, public comparator evidence clarifies the layers any credible product would have to address. ASML's technology pages show that leading-edge lithography is a hybrid of optics, mechanics, control software, and service, with EUV and DUV used together across different layers. Nikon's stack similarly spans lithography, alignment, metrology, and packaging, while its DSP-100 adds maskless projection for large substrates. Canon's NIL path shows an alternate architecture in which imprinting replaces optical projection, but it took years of development and still required commercialization through research and prototype channels. xLight attacks the source layer rather than the full scanner, while TSMC's 3DFabric and advanced packaging materials show that some critical product value is now migrating beyond front-end lithography into system-level integration. The key product takeaway is that Source Foundry is unlikely to be competing on a single isolated component unless that component unlocks a broader system bottleneck. This is also why product diligence cannot stop at the headline \"alternative to ASML.\" Canon demonstrates that even a radically different approach still needs a full program around defect control, alignment, pilot adoption, and manufacturing readiness. xLight shows that a startup can try to wedge into one critical subsystem instead of replacing the full tool. TSMC and Intel show that some customer value may be captured through integration or packaging layers rather than by winning the front-end scanner battle directly. Source Foundry could plausibly pursue any of those shapes, but public evidence does not yet discriminate among them.",
