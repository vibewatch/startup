  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Public evidence does not reveal a named Source Foundry product, but it does reveal a broad product envelope. Trademark filings indicate ambition across semiconductors, wafers, advanced-lithography software, masks and reticles, and after-sale installation and technical support. That is materially broader than a single scanner claim and suggests the company may be targeting a system stack rather than one isolated module. The difficulty is maturity. No retained public source provides a product page, architecture diagram, data sheet, throughput number, roadmap release note, quality certification, or customer deployment for Source Foundry itself. The best-supported product conclusion is therefore cautious: the company appears to be building some combination of lithography hardware, software, and service infrastructure, but the exact operating model, dependencies, and readiness remain largely undisclosed."
  },
  "sections": [
    {
      "id": "product-definition",
      "title": "Product Definition: Broad Scope, Narrow Verified Detail",
      "body": "The most concrete public product evidence comes from trademark coverage, not from a corporate product page. USPTO.report and Justia records for Source Foundry's marks state that the company intends to cover semiconductors, chips, wafers, software for wafer processing, software for advanced semiconductor lithography, lithographic masks and reticles, and installation or maintenance services for semiconductor manufacturing machines. That combination matters because it places Source Foundry in customer-workflow terms: a buyer could engage the company not only for a machine but also for process software, consumable or enabling artifacts, and post-install support. However, public evidence stops there. There is no retained source naming a commercial SKU, no public architecture diagram, and no data sheet describing whether the company's first product is a source, scanner, software layer, or packaging-adjacent tool. Product definition is therefore partially knowable in scope but not in concrete product form. That absence should shape diligence behavior. In enterprise semicap, buyers normally see at least a narrow set of public proof points\u2014product names, architecture families, pilot references, or application notes\u2014even when deeper performance data remain confidential. Here, the reverse is true: Source Foundry shows unusually broad legal scope but unusually little public product specificity. The chapter therefore treats trademark scope as the floor of what the company wants permission to sell, not as proof that every category is already engineered, integrated, or commercially ready.",
