    "number": 8,
    "title": "Valuation",
    "summary": "Source Foundry has crossed the threshold from interesting stealth project to real financing event, but not to public priceability. The public record supports a fresh $400 million follow-on from Situational Awareness, roughly $500 million of total disclosed commitment, and a reported ~$5 billion valuation; it does not support revenue, customer, product, cap-table, or milestone disclosure that would normally justify a hard-tech price call of that size. Against public semiconductor-equipment multiples and recent frontier-manufacturing rounds, the defensible judgment is research-more with medium confidence, high risk, and an expensive valuation stance at the current reported mark."
  },
  "sections": [
    {
      "id": "public-pricing-signal-and-valuation-history",
      "title": "Public pricing signal is real, but valuation history is shallow and term disclosure is absent",
      "body": "Source Foundry now has a real valuation headline, but it still lacks the disclosure surface needed to treat that headline as independently validated fair value. Yahoo Finance, AI Weekly, Best AI, and toflow all converge on the same August 2026 core facts: Situational Awareness added a fresh $400 million commitment, its total disclosed position rose to about $500 million, and the company was marked at roughly $5 billion. That is enough to say a serious capital event happened. It is not enough to say the price is underwritten. No retained public source discloses what percentage of the company changed hands, whether the latest money is entirely primary capital, whether liquidation preferences or ratchets exist, or whether governance changed with the round. Even the earlier financing history is thin. Public aggregator coverage suggests an initial $100 million investment in early 2026 with Sequoia involvement, but that earlier step is not accompanied by the kind of primary company, filing, or board-right detail that would let outside investors reconstruct a clean valuation progression. The result is a valuation history with one observable late-stage mark and very little public term clarity underneath it. That matters more here than it would in a software company because the company is still stealth, the product boundary is undisclosed, and public proof of customers or revenue is still absent. In valuation terms, the August round should be read first as sponsor conviction and only second as market-clearing price discovery.",
