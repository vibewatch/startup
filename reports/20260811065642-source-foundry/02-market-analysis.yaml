    {
      "id": "sizing-lenses-and-buyers",
      "title": "Sizing Lenses and Buyer Segmentation",
      "body": "Public evidence supports multiple market lenses, not one neat number. The broadest lens is SEMI\u2019s $165.9 billion 2026 equipment forecast. The most relevant public lithography lens is Mordor\u2019s $30.44 billion 2026 lithography-equipment estimate. Inside that, the actual Source Foundry serviceable market narrows again toward the subset of buyers funding leading-edge logic, memory, packaging, and process-control improvements. Buyer concentration is extreme. Mordor says pure-play foundries account for nearly half of lithography-equipment spend, while TSMC\u2019s 534-customer disclosure shows how one leading-edge manufacturer aggregates wide end-market demand into a relatively small number of process-development programs. Samsung and Intel further show that next-generation-node demand is concentrated in a few organizations with the capital, staff, and appetite to qualify new tools. Hyperscalers matter economically, but they often sit one layer removed as indirect payers whose AI demand drives foundry capex rather than directly purchasing scanners.",
