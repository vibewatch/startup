    {
      "id": "drivers-and-constraints",
      "title": "Growth Drivers and Adoption Constraints",
      "body": "The bullish case for the market is straightforward. SIA, IDC, and SEMI all show a 2026 environment in which AI infrastructure is compressing years of semiconductor demand growth into a shorter investment cycle. SEMI specifically ties higher spending to advanced logic, HBM, packaging, and test, while Mordor adds subsidies, shrinking nodes, and heterogeneous integration. But the bearish side is just as real and more relevant to a startup. This market is shaped by brutal switching costs: multi-quarter qualification cycles, deep integration into process recipes, and enormous working-capital demands. Mordor says High-NA tools can top $400 million per unit and may require deposits a year or more ahead of delivery. Export controls, ESG constraints, and supplier concentration create further friction. Even when demand is strong, buyers do not casually slot in a new lithography architecture. They need confidence on yield, uptime, service, and fab compatibility, which is why Canon, xLight, Nikon, Intel, Samsung, and ASML all frame their offerings in system terms rather than as one-off inventions.",
