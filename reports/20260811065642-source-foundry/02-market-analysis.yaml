  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Source Foundry is aiming at one of the most concentrated but strategically critical layers in the AI hardware stack: advanced lithography and closely coupled manufacturing-control infrastructure. Public evidence supports a very large macro TAM\u2014$165.9 billion of 2026 semiconductor equipment and roughly $30.4 billion of 2026 lithography spend\u2014but the serviceable market for Source Foundry is materially narrower because buyer concentration, qualification friction, and the company\u2019s still-undisclosed first product keep the real opportunity tied to a small set of frontier fabs and packaging programs. The market is real and growing fast; the exact slice Source Foundry can win remains unproven."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market Boundary: Bigger Than Lithography Alone, Smaller Than All Semiconductor Capex",
      "body": "The first analytical trap with Source Foundry is defining the market too broadly. If one simply says the company is attacking a semiconductor bottleneck, the headline TAM becomes every dollar spent on semiconductor manufacturing equipment or even every dollar of chip demand. That is directionally useful but not decision-useful. The better starting point is to combine the company\u2019s trademark-defined scope with how incumbents describe their own stacks. Source Foundry\u2019s public filings span machines, lithography, wafer-processing software, tool controls, and facility engineering. ASML likewise frames its value proposition across systems, metrology, inspection, and software rather than a bare scanner. That means the market boundary should include lithography tools and the process-control layers tied tightly to them. But it should not include commodity back-end handling, generic EDA, or all semiconductor capex by default. The spend pool is therefore substantial, yet still a subset of total wafer-fab and packaging investment.",
