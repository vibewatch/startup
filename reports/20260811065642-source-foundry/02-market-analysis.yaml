    {
      "id": "implications-for-source-foundry",
      "title": "Implications for Source Foundry",
      "body": "Taken together, the market is unquestionably large enough to matter, but it is not large in a way that makes commercialization easy. The relevant buyer set is tiny, highly technical, and already engaged with incumbents and credible alternative-architecture vendors. That matters for underwriting. Source Foundry does not need to win a consumer-scale customer count; it needs to convince a handful of world-class fabs, IDMs, or advanced-packaging programs that it can improve throughput, yield, cost, or physics at a frontier bottleneck. Public evidence is enough to say the prize is measured in billions and that AI demand is pulling investment upstream. Public evidence is not enough to derive a clean SOM or timing curve for Source Foundry specifically, because the company still has not disclosed whether it is attacking the source, scanner, software, or fab-service layer in first product form. The market chapter therefore ends with a disciplined conclusion: the opportunity is real, concentrated, and strategically important\u2014but public TAM talk still outruns public company specificity.",
