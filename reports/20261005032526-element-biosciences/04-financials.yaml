  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin-and-cogs
      missingEvidence: Audited gross margin percentages and direct unit manufacturing costs for AVITI hardware and ABC consumable reagent kits.
      whyItMatters: Essential to evaluate long-term gross profit contribution and establish whether hardware placements generate positive contribution margins prior to reagent pull-through.
      diligencePath: Request management profit-and-loss statements broken down by hardware and consumables product lines under an institutional non-disclosure agreement.
    - type: private-evidence-only
      severity: material
      topic: consumables-pull-through
      missingEvidence: Annualized consumable reagent spend and run frequency per active instrument across customer segments.
      whyItMatters: Dictates the recurring revenue profile and customer lifetime value of the placed instrument fleet.
      diligencePath: Obtain customer cohort sequencing utilization logs and annualized consumable kit replenishment orders.
    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-and-runway
      missingEvidence: Monthly net operational cash burn rate, working capital requirements, and total cash and liquid equivalents on hand.
      whyItMatters: Critical for assessing runway adequacy following the Series D raise and projecting the timing of subsequent capital calls or debt facilities.
      diligencePath: Review audited balance sheets, trailing twelve-month cash flow statements, and forward 24-month financial budget models.
