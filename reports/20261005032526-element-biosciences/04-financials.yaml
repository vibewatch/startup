callouts:
  - calloutType: insight
    title: Hardware placements drive the recurring consumables engine
    body: Element's business model relies on expanding its placed instrument fleet across academic and biopharma laboratories to unlock long-term recurring consumables revenue. The rapid growth from approximately 40 to over 190 placed AVITI systems demonstrates significant commercial uptake that should drive higher-margin reagent pull-through over time.
    claimRefs:
      - CI003
      - CI006
  - calloutType: risk
    title: Absence of disclosed gross margin and burn masks unit economic health
    body: While cumulative equity financing exceeding $680M and a $1.03B valuation provide substantial balance sheet runway, the complete lack of public disclosures regarding gross margins, reagent manufacturing costs, and net operating burn represents a material diligence hurdle for underwriting equity value.
    claimRefs:
      - CI007
      - CI012
      - CI015
      - CI016
