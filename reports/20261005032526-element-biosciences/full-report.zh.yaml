  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences 的核心可服务市场涵盖专用于下一代测序（NGS）、空间生物学和新兴单细胞多组学的实验室分析仪器（NAICS 334516、SIC
              3826）。市场边界包括台式和生产型测序仪的资本支出、专用流动池和测序试剂等经常性耗材、云端二次分析基础设施，以及定向工作流试剂盒 [CM001,
              CM002]。可服务支出包括学术核心实验室、制药和生物科技药物研发团队、合同研究组织（CRO）以及正在转向分子检测的临床诊断服务商的基因组研究预算 [CM003]。Element 的主要可服务范围不包括传统
              Sanger 毛细管电泳仪器、独立阵列扫描仪、分子测序之外的下游临床病理实验室运营预算，以及第三方样本采集物流 [CM004]。该市场技术进入壁垒高、竞争集中度深；Illumina 历来占据全球测序装机量估计
              75% 至 80% 以上，造成严重的厂商锁定，但也让买方对经济可行的替代方案保持旺盛需求 [CM005, CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与经济边界
        blocks:
          - type: paragraph
            body: >-
              评估 Element 的商业机会，需要在不同的行业预测和产品能力之间厘清总体可服务市场、可获取市场和可获得市场的边界。商业组合分析引用的外部市场研究预计，全球基因组行业到 2029 年将接近 $64.6
              billion；作为底层市场的实验室 DNA 测序仪器和耗材市场在 2024 年约为 $7.8 billion，另有 $1.5 billion 的多组学市场细分 [CM007, CM008]。但 Element
              的近期可服务市场由中等通量台式测序和定向空间多组学构成，而不是集中式高通量生产工厂机群 [CM009]。Element 的可服务可获得市场仍属于新兴挑战者版图，预计占全球 NGS 测序量不足
              5%；不过商业披露显示，在首个商业发货年度，公司约拿下中等通量仪器新增销量的 15% [CM010,
              CM011]。由于缺少分细的公开客户支出数据，且第三方营销预测未经审计，规模核对必须在行业头部预测与实际仪器装机速度之间进行审慎界定 [CM012]。
