      - number: '3.3'
        title: 切换成本、分销阻力与反垄断摩擦
        blocks:
          - type: paragraph
            body: >-
              Element 测序平台的采用面临很高的切换壁垒，根源在于客户已有设备投入、专门化运营流程和在位者的商业策略。在北加利福尼亚州北区联邦反垄断诉讼（案号 25-cv-08026-NW）中，Element 指控
              Illumina 采取反竞争方案维护其主导地位，包括在客户购买 AVITI 时威胁提高既有仪器机群的惩罚性服务价格、以独家采购承诺为条件提供大额折扣，以及质疑 Element 能否长期经营。尽管 Noel
              Wise 地区法官于 2026 年 5 月准许 Illumina 的动议，以允许修改的方式驳回第一份修订起诉书，但司法记录详细呈现了新进入者遭遇的严重阻力。为降低切换阻力，Element 开发 ADEPT
              文库转换协议，让研究人员无需重新扩增即可在约 75 分钟内转换标准 Illumina 兼容文库；公司还与 Twist Bioscience、Roche Kapa 和 10x Genomics
              等主要第三方文库制备商合作。
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP006
              - CP012
