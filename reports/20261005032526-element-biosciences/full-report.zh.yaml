  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心仪器架构：AVITI 台式、AVITI24 5D 多组学和 VITARI
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences 将下一代测序（NGS）和多组学平台商业化，目标是在打破传统测序经济性的同时，把分析能力直接延伸到细胞空间 [CE001, CE002]。硬件产品线以 AVITI
              系统为基础：这是一款紧凑型双流动池台式测序仪，围绕专有 Avidite Base Chemistry（ABC）构建 [CE001, CE002]。相比在位的短读长平台，AVITI
              旨在以更高准确度实现显著的试剂和资本节省 [CE001, CE002]。为服务低通量分布式实验室和预算受限的研究团队，Element 提供 AVITI LT，作为成本和通量更低的测序替代方案 [CE002]。

              在纯 DNA/RNA 测序之外，Element 推出 AVITI24，将其定义为 5D 多组学系统，把高通量测序与样本内直接细胞分析结合起来 [CE003, CE004]。AVITI24 的成像面积为 20
              cm²，可在 24 小时以内的自动化运行周期中，对 RNA 转录本、蛋白质表达和形态特征进行细胞亚空间共检测，且不需要传统的离体文库制备 [CE003, CE004]。在扰动筛选工作流中，Element 的
              Cytos 检测可在同一个细胞内同时检测细胞形态、引导 RNA、蛋白质表达和 3' 全转录组 [CE003]。为服务生产规模的核心设施和群体基因组工作负载，Element 的路线图引入 VITARI，这是一款把
              Avidite 化学体系延伸到大规模测序应用的高通量平台 [CE003, CE005]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
