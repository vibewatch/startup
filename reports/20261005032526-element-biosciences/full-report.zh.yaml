      - number: '1.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 台式测序的资本效率与战略定位
            body: >-
              Element Biosciences 通过聚焦中等通量台式测序这一细分市场，建立了有力的商业立足点：仪器成本为 $289k，相比 NextSeq 的 $335k 更低；运行经济性为 $5–7/Gb，相比
              $16.5/Gb 更优，同时质量达到相当或更高水平（>90% Q30）[CO003, CO004]。推出 VITARI、以 $100 基因组定价为目标，说明 Element
              想在不放弃台式实验室工作流的前提下挑战高通量平台 [CO005, CO007]。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
          - type: callout
            title: 耗材消耗不确定性与知识产权暴露
            body: >-
              尽管累计资本达到 $853M、装机量超过 450 台，Element 的长期企业估值仍取决于每台仪器的耗材消耗、毛利率，以及能否避免 Illumina 或 10x Genomics 带来的致命专利诉讼
              [CO003, CO005, CO011]。由于缺少关于试剂运行速率的经审计公开披露，私人估值仍会受到市场情绪和平台利用率审视的影响 [CO008, CO013]。
