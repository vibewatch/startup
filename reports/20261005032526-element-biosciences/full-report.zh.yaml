  - id: FE001
    title: Element Biosciences 模块化技术与平台架构栈
    type: stack
    summary: 整合五层产品与计算架构，覆盖湿法化学、精密光机、固件、云编排和临床 AI。
    data:
      items:
        - label: 临床与多组学应用层
          detail: 将 SOPHiA DDM 精准肿瘤学和罕见病 AI 分析，与 AVITI24 原位亚细胞空间 RNA 和蛋白共检测及 Cytos 单细胞扰动分析结合。
        - label: 生物信息学与云端二次分析层
          detail: >-
            将 ElemBio Cloud 设备群管理、Amazon Omics Ready2Run Bases2FastQ 流程，与客户 AWS 环境中的原生 Sentieon 和 NVIDIA Parabricks
            二次分析流程执行结合。
        - label: 仪器操作软件与固件层
          detail: 提供实时机载碱基识别、直接 S3 数据流式传输、自动 Trinity 机载外显子制备测序控制及 Expert Mode HD 密度扩展。
        - label: 光机与流体平台层
          detail: 涵盖 AVITI 和 AVITI LT 的双独立流动池台式机箱、AVITI24 的 20 cm² 亚细胞成像腔，以及 VITARI 高通量系统的放大机箱设计。
        - label: 核心分子化学与耗材层
          detail: 以专有多价 Avidite Base Chemistry（ABC）、Cloudbreak Freestyle 通用线性文库兼容试剂盒及 Cloudbreak UltraQ Q50 高准确度测序试剂为核心。
        - label: 硬件级流动池与热子系统层
          detail: 提供高精度 Peltier 热循环模块、流体微阀和自动流动池卡盘对准机制，确保各运行周期表面温度均匀。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 实验室从现有测序平台转向 Element AVITI 生态的商业采用阶段。
    data:
      items:
        - label: 平台评估与基准测试
          description: 目标实验室评估 AVITI avidite 化学技术，并与 Illumina 系统开展准确度和单读长成本对比研究。
          note: 早期客户中 80% 是升级设备或采用双供应商的成熟 NGS 实验室
        - label: 资本采购与安装
          description: 机构通过直销或覆盖 13 个国家的区域分销网络采购 AVITI 台式系统。
          note: Broad Institute 和核心设施均验证了安装速度
        - label: 文库制备集成
          description: 实验室集成 Cloudbreak 化学或标准流程，无需改造上游样本制备流程。
          note: Helixio 和服务商均称流程兼容顺畅
        - label: 生产运行与多仪器扩张
          description: 客户提高仪器利用率，订购经常性耗材，并为扩容增购仪器。
          note: 超过四成的销售来自多仪器订单，客户持续扩充设备群
        - label: 支持与现场运营节奏
          description: 持续排查技术问题、开展现场服务工程和平台维护，确保运行稳定。
          note: Element 正在积极扩充专职 Service Operations 项目团队
        - label: 平台锁定或流失决策
          description: 实验室决定是否将诊断 / 研究流程标准化到 AVITI，或继续采用双厂商模式。
          note: 关键风险：未公开 NRR 或长期耗材支出数据
    approximationNotes: 旅程阶段反映客户案例和招聘记录中记载的商业里程碑及运营支持要求。
    claimRefs:
