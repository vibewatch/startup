      - number: '1.2'
        title: 管理层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Element 由 CEO Molly He 博士与一批测序行业老兵共同创立 [CO005, CO008]。创办 Element 之前，管理团队已在圣迭戈基因组产业集群积累深厚专业经验，并直接参与设计
              AVIDITY 化学体系，以绕开既有的测序合成（SBS）专利丛林 [CO003]。高管团队包括 CFO Logan Zinser、首席法务官 David Melaugh，以及负责公司领导工作的 Brian
              Stolz [CO009]。运营管理层带领公司从早期化学原型开发走向全球商业化，并铺开直销和分销渠道 [CO010]。

              Element 的差异化高度依赖专有化学体系、流动池物理设计，以及规避 Illumina 等成熟竞争者可能提出的知识产权侵权主张；因此，围绕 CEO Molly He 的技术和战略连续性构成实质性的关键人物依赖
              [CO003, CO008, CO010]。此外，公司治理还受到一线医疗健康风险投资人、跨界基金和 Samsung、Wellington Management、Fidelity Investments
              等战略伙伴的监督 [CO011, CO012]。随着员工规模扩大到估计 200–500 人，管理层必须同时维持快速研发迭代，并执行工业制造和现场支持运营 [CO002, CO008]。
            claimRefs:
              - CO002
