      - number: '2.3'
        title: 买方分层、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              Element 的 AVITI 和 VITARI 平台由不同的机构买方画像、采购流程和切换摩擦共同决定采用速度。学术核心设施和基因组中心通过委员会共识评估资本设备，关注降低每 Gb
              成本和灵活使用双流动池，以消除院系研究人员的批次等待 [CM002, CM013]。商业生物制药和 CRO
              买方优先考虑样本周转速度、工作流可复现性和生物信息学管线的无缝集成，并通过直销渠道或专业服务商采购；后者贡献了 2024 年收入的 15% [CM014,
              CM015]。临床诊断实验室是高增长采用目标，但需要大量检测验证、AVITI Dx 等监管许可路径，以及漫长的销售培育周期 [CM003,
              CM016]。市场采用的主要约束包括既有文库制备流程带来的切换成本、临床检测验证要求、在位者的捆绑策略和对第三方软件集成的依赖 [CM005, CM016]。
            claimRefs:
