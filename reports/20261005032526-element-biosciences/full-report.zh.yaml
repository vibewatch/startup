      - number: '2.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 经济颠覆与生态惯性
            body: >-
              Element 的主要市场进入策略依靠最高 75%
              的耗材运行成本优势和双流动池灵活性，争取中等通量需求。但在企业级基因组市场，技术优势必须先跨过深厚的流程惯性、既有文库制备试剂盒和漫长的临床验证周期，才可能实现大规模替代 [CM002, CM005,
              CM016]。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM016
          - type: callout
            title: 在位者主导与竞争反击
            body: >-
              Illumina 估计占全球测序装机量的 75% 至 80% 以上，因此拥有显著的定价杠杆、耗材捆绑折扣和根深蒂固的分销渠道。Element 面临在位者的激烈反制，包括对高通量平台打折，以及潜在的知识产权诉讼
              [CM005, CM006]。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场结构与在位者霸权
        blocks:
          - type: paragraph
            body: >-
              商业 DNA 测序格局高度集中，长期由 Illumina 在短读长下一代测序（NGS）平台上的持续主导地位锚定。Element Biosciences 于 2022 年推出 AVITI，直接挑战 Illumina
              的中等通量业务，并以专有 Avidite Base Chemistry（ABC）对抗 Illumina 的测序合成（SBS）标准。Illumina 估计占整体 NGS 仪器市场的 80% 至 90%，而
              Element 瞄准的是中等通量细分市场；Illumina 的 NextSeq 1000 和 NextSeq 2000 仪器历来是核心实验室的主力设备。竞争范围还包括 Singular Genomics 和
              MGI/Complete Genomics 等短读长替代方案开发商、Pacific Biosciences 和 Oxford Nanopore Technologies 等长读长测序厂商，以及 Illumina
              Infinium 和 Thermo Fisher Axiom SNP 微阵列等传统高通量基因分型平台。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
