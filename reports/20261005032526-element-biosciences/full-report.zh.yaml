      - CV015
      - CV016
figures:
  - id: FO001
    title: Element Biosciences 公司演进与里程碑时间线
    type: timeline
    summary: 标志 Element 从隐身研发走向全球多组学规模化运营的公司、技术、融资和商业里程碑。
    data:
      items:
        - date: '2017-07-01'
          label: 公司成立
          detail: Molly He 与创始科学团队在加州圣迭戈注册成立 Element Biosciences，开发全新的测序架构。
          tone: neutral
          claimRefs:
            - CO001
            - CO008
        - date: '2019-06-18'
          label: Series A 融资（$15M）
          detail: 获得由 Foresite Capital 和 Venrock 领投的早期机构风险投资，用于开发核心化学技术。
          tone: positive
          claimRefs:
            - CO011
        - date: '2020-01-09'
          label: Series B 融资（$80.3M）
          detail: 由 Fidelity Investments 和 JSCapital 领投的跨界融资轮，加速硬件工程开发。
          tone: positive
          claimRefs:
            - CO011
        - date: '2021-06-29'
          label: Series C 融资（$276M）
          detail: 夹层融资轮引入 Janus Henderson、Logos、Meritech 和 T. Rowe Price 等顶级生命科学投资者。
          tone: positive
          claimRefs:
            - CO011
        - date: '2022-03-14'
          label: AVITI 商业发布
          detail: 正式发布 AVITI 台式测序仪，采用专有 AVIDITY 化学技术，资本开支为 $289k，运行成本为 $5-7/Gb。
          tone: positive
