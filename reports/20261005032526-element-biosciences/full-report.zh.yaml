  - id: TV002
    title: 正反论点驱动因素
    columns:
      - 视角
      - 基于证据的论点
      - 什么会改变判断
    rows:
      - - 正论点 - 融资渠道
        - 2026 年 6 月的 Series E 融资额为 $175 million，此前 Series D 约为 $277 million。
        - 未能完成交割、条款明显恶化，或短期内需要再次大额融资，都会削弱这一信号。
      - - 正论点 - 采用
        - 公司新闻稿显示，AVITI 订单从覆盖 13 个国家的 100 多笔，扩展到覆盖 40 多个国家。
        - 经审计的装机基础、活跃客户和留存数据若明显低于公开叙事，将削弱该论点。
      - - 正论点 - 重复需求
        - 2023 年新闻稿称，多仪器销售占比超过 40%，且老客户持续增加产能。
        - 队列数据若显示利用率低或耗材复购弱，将否定这一方向性证据。
      - - 反论点 - 价格不透明
        - Series E 估值和完整轮次规模未公开，二级市场估值数据需要门槛访问。
        - 若有一手融资文件，且进入价格达到基于尽调设定的回报门槛，判断会改善。
      - - 反论点 - 财务不透明
        - 宽泛的第三方收入估计无法证明经审计收入、毛利率、现金消耗、现金或资金续航。
        - 经审计报表及队列层面的贡献利润率若显示经营杠杆持久，置信度会提高。
      - - 反论点 - 稀释与流动性
        - 优先权瀑布未披露，私人股权退出取决于公司事件或符合条件的二级流动性。
        - 清晰的股权结构表、可接受的优先级和可信的退出路径会降低下行风险。
    notes: 公司发布的采用指标视为公司口径；Owler 数据标注为未经审计的估计，EquityZen 则描述访问和流动性机制。
