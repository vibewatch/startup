      - number: '3.2'
        title: 仪器规格与经济性正面对比
        blocks:
          - type: paragraph
            body: >-
              Element 将 AVITI 定位为直接打破在位者价格曲线的产品，挑战 Illumina 的资本开支和运营开支基准。Element 列出的 AVITI 仪器前期资本支出为 $289,000，而 Illumina
              NextSeq 2000 的标价为 $335,000。从运营经济性看，Element 的标准测序试剂盒约为每盒 $1,680，而可比的 Illumina 中等通量试剂盒超过 $6,000；由此估计运行成本为每
              Gb $5 至 $7，而 NextSeq 约为每 Gb $16.50。此外，AVITI 的年度服务和维护合同为 $20,000–$30,000，而 Illumina 通常超过
              $40,000。为扩大标准短读长测序之外的用途，Element 已将 AVITI24 商业化，把 DNA、RNA、蛋白质和细胞成像能力整合到一次台式运行中，并宣布开发高通量 VITARI 架构。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
