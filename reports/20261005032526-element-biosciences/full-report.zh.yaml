        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences 经营以台式测序硬件为中心的生命科学仪器和耗材变现模式。核心产品包括旗舰 AVITI 系统和低通量 AVITI LT，配套专用 Avidite Base
              Chemistry（ABC）测序试剂盒及软件集成包。商业模式在仪器装机时产生前期资本收入，随后研究实验室持续运行测序带来经常性耗材需求。此外，Element 还通过 AVITI24 提供升级路径，让已有
              AVITI 仪器的所有者把装机系统升级为一体化多组学和细胞成像平台，在单个细胞内同时检查 DNA、RNA 和蛋白质。除台式系统外，Element 还宣布
              VITARI，这是一款旨在以有竞争力的价格完成全人类基因组测序的高通量平台。EquityZen 等 IPO 前市场平台称，Element
              正在通过表面化学、仪器和生物化学创新，大幅降低资本和运行成本，同时保持较高数据质量。尽管这些商业路径定义清晰，Element
