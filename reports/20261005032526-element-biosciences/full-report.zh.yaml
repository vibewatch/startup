          - type: callout
            title: 高通量执行与现场服务规模化挑战
            body: >-
              随着 Element 从台式 AVITI 扩展到 VITARI 高通量基因组业务，并以 AVITI24 处理高复杂度空间多组学，仪器复杂度会大幅上升。先进的 5D
              多组学成像与多荧光流体系统并行运行，会增加光学漂移、流体堵塞和现场服务瓶颈的风险。在商业核心实验室中，持续运行时间和现场维护响应速度将决定 Element 能否替代根深蒂固的在位者生产基础设施 [CE003,
              CE005, CE011, CE012]。
