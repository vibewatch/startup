        title: 客户基础分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences 面向希望获得高质量基因组分析、又不愿承担主导测序供应商历来收取的高昂设备资本成本和受限耗材定价的实验室与研究机构。公司主要客户覆盖 13
              个国家的学术核心设施、生物科技和生物制药研发部门、精准肿瘤诊断服务商以及商业基因组服务实验室。在 MIT BioMicro Center、University of Utah DNA Sequencing
              Facility 等学术和机构核心实验室中，经济买方主要是希望获得灵活性、低单次运行资本投入和高准确度 base calling 的部门负责人及设施主管。商业客户包括欧洲服务商 AgenDix
              GmbH、法国服务商 Helixio 和亚洲精准肿瘤专家 Burning Rock Dx；他们看重毛利扩张、文库兼容性，以及快速完成常规全基因组测序、外显子测序和单细胞检测。此外，Revvity
              等大型合同检测网络也部署 AVITI，为全球诊断和转化项目提供服务。尽管客户画像正在扩大，Element
