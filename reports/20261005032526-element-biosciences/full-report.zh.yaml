      - number: '1.3'
        title: 融资历史、估值里程碑与资本结构
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Element 通过 8 笔不同交易累计筹集约 $853M 私人资本，用于平台开发和全球商业化建设 [CO011, CO013]。继 2017–2018 年从 HHS 获得总额超过 $440k
              的非稀释性联邦拨款后，公司于 2019 年 6 月完成 $15M 的 Series A，领投方为 Foresite Capital 和 Venrock [CO011]。随后完成的机构轮包括：2020 年 1 月由
              $30M 的 2020 年 6 月追加融资补充的 $80.3M Series B；2021 年 6 月由 Janus Henderson、Logos、Meritech、T. Rowe Price 和 Morgan
              Stanley 领投的 $276M Series C；以及 2024 年 7 月由 Wellington Management 领投、Samsung、Foresite 和 Fidelity 参与的 $277M
              Series D [CO011]。

              2024 年 7 月的 Series D 将投后股权估值基准定为 $1.03B，正式确认 Element 已成为一家由风险资本支持的基因组独角兽公司 [CO009, CO011]。2026 年 6
              月，Element 获得新增 $175M 的 Series E，Samsung 提供战略支持，使累计融资达到 $853M [CO008, CO011, CO013]。尽管商业势头已带来全球超过 450
              台装机系统和 2025 年 40% 的同比收入增长，但经营亏损和客户群耗材消耗率仍是未披露的私人指标，现金消耗和实现经营盈亏平衡的时间表因此存在尽调缺口 [CO005, CO010]。
            claimRefs:
