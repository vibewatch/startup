chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与市场定位
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences, Inc.（dba ELEMENT BIOSCIENCES INC）是一家总部位于美国加利福尼亚州圣迭戈的生物技术仪器开发商 [CO001]。公司于 2017 年 7
              月成立，并以 NAICS 334516（分析实验室仪器制造）在联邦注册 [CO001]，成立初衷是让更多用户用得上先进基因组检测和高通量测序工具 [CO002]。Element 进入商业化阶段时，正面挑战
              Illumina 长期占据的短读长测序垄断，目标是降低试剂成本、提升学术核心实验室、临床实验室和商业实验室的数据质量 [CO003]。

              Element 最初的商业核心是 AVITI 台式测序平台，于 2022 年正式推出 [CO003, CO004]。AVITI 采用专有的多价 AVIDITY 测序化学体系、非黏附流动池表面钝化和离散
              polony 聚类，把信号检测与核苷酸掺入分开，从而显著降低试剂消耗和成像背景噪声 [CO003]。近期，公司又通过预览并推出 VITARI 扩展产品组合：这是一款面向高通量、目标在规模化实现 $100
              人类基因组经济性的台式平台；同时推出 AVITI24，提供 5D 多组学和样本内直接组织测序 [CO005, CO006, CO007]。借助这套生态，Element
              将自己定位为覆盖基因组、转录组和空间细胞维度的端到端生物分析服务商 [CO005]。
            claimRefs:
