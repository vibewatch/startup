        - 经验证的经常性耗材增长、稳健的毛利率、VITARI 和 AVITI Dx 成功转化，以及充足的资金续航。
        - 公开资料没有可支持的数值区间；只有经审计预测和按优先权调整后的所得满足投资者目标回报时才定价。
        - 队列复购、付费路线图部署和经审计贡献利润率优于尽调基准情景。
        - 路线图延误或利用率偏低会打破溢价增长论点。
      - - 基准
        - 商业触达继续扩张，但经营经济性和资本结构在尽调前仍未公开。
        - 暂不提供估值区间或报价；在一手财务和融资记录足以支持模型前，维持继续研究。
        - 装机基础和复购证据积极，但不足以证明增长可由自身资金支持。
        - 在经营经济性得到验证前再次大额融资，会引发稀释和资金续航担忧。
      - - 悲观
        - 耗材拉动、利润率或路线图转化不及预期，而资本需求仍然很高。
        - 公开资料没有可辩护的估值底线；下轮融资、资本重组或优先权层级挤压可能严重损害次级持有人的所得。
        - 复购放缓、利润率收缩、资金续航缩短，或按高级条款融资。
        - 无法获得资本或优先权条款不利，将成为打破论点的事件。
    notes: 情景为定性判断，因为指定公开证据未披露入场估值、经审计预测或按优先权调整的持股经济性。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
