      - number: '5.2'
        title: Avidite Base Chemistry、文库兼容性与试剂形态
        blocks:
          - type: paragraph
            body: >-
              Element 平台的化学核心是 Avidite Base Chemistry（ABC）。它不再采用传统的测序合成（SBS），而是利用能与匹配模板特异结合的多价核心 avidite
              分子，从而降低背景噪声、提高光学对比度，并大幅减少昂贵荧光试剂的消耗 [CE001, CE003]。为降低客户切换壁垒，Element 发布 Cloudbreak Freestyle 测序试剂盒；无需酶法或
              PCR 文库环化步骤，即可开箱兼容超过 95% 的第三方 NGS 文库制备试剂盒 [CE006]。

              面向液体活检、游离 DNA（cfDNA）和罕见体细胞变异检测等超高准确度应用，Element 推出 Cloudbreak UltraQ 试剂盒，目标准确度达到 Q50（每 100,000 个碱基出现 1
              个错误）；据称相比行业标准 Q30，错误率降低 100 倍 [CE006]。为把前端工作流触点整合到实体仪器上，Element 开发 Trinity
              检测和软件套件，在仪器内部自动完成全面的文库制备，尤其适用于直接进行的定向外显子捕获和富集工作流 [CE006]。Expert Mode HD
              等仪器固件增强功能，则通过改进流动池聚类和图像分析算法，让每盒试剂额外增加 20% 至 70% 的测序读数 [CE006]。
            claimRefs:
              - CE001
              - CE003
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
      - number: '5.3'
        title: 二次分析基础设施、云集成与企业安全
        blocks:
          - type: paragraph
            body: >-
              台式测序的运营采用取决于顺畅且安全的二次分析管线；它们既不能压垮机构 IT 基础设施，也不能把客户锁定在专有云订阅中 [CE007]。Element 通过机载 base-calling，并经由 IAM 角色和外部
              ID，把 base call 和质量指标直接流式传输到客户控制的 Amazon Web Services（AWS）S3 存储桶，来处理一级和二级计算 [CE007]。客户在 Amazon Omics 上运行
              Element 的 Bases2Fastq Ready2Run 工作流，执行拆分样本、生成 FASTQ 和质量控制；150-cycle、300-cycle 和 600-cycle 试剂盒均采用透明的按次运行定价
              [CE007]。FASTQ 输出可原生接入包括 Sentieon 加速套件和 NVIDIA Parabricks 在内的二次分析容器 [CE007]。ElemBio Cloud
              跨分布式机群编排这些运行，并提供交互式执行面板，同时保留客户对云端数据的主权 [CE006, CE007]。

              针对诊断和临床肿瘤研究，Element 与 SOPHiA GENETICS 合作，将 AVITI 和 AVITI24 平台接入 SOPHiA DDM 的 AI 驱动分析，以便在 Institut
              Paoli-Calmettes 等国际医院网络中统一解读肿瘤和罕见病变异 [CE008, CE009,
              CE010]。但在非学术生产环境中，商业吞吐量是否相当、平均故障间隔时间（MTBF）、长期试剂稳定性以及现场仪器可靠性，仍缺少独立验证，构成关键尽调缺口 [CE011, CE012]。
            claimRefs:
