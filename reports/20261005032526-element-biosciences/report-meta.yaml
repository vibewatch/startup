companyProfile:
  summary: >-
    Element Biosciences is a San Diego-based life sciences instrumentation company that sells sequencing and multi-omics
    systems centered on AVITI, AVITI24, and VITARI, with proprietary Avidite Base Chemistry and recurring consumables
    supporting the model. The company has raised more than $853M cumulatively, added a $175M Series E in 2026, and now
    shows real commercial traction across a broad international footprint, but the public record still does not disclose
    audited economics or a defensible current price.
  founders:
