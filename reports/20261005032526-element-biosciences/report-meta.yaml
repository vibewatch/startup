  topStrengths:
    - Proprietary sequencing and multi-omics platform stack has expanded beyond AVITI into AVITI24 and VITARI.
    - >-
      The company reports real commercial adoption, including over 450 installed systems and a footprint above 40
      countries.
    - Fresh 2026 financing extends the capital base and supports continued product and commercial rollout.
  topRisks:
    - Audited revenue, gross margin, burn, and cohort economics remain undisclosed.
    - The current valuation and preference stack are not public, limiting entry-price discipline.
    - Legal, IP, manufacturing, and execution risks remain material for a capital-intensive sequencing challenger.
  unresolvedGaps:
    - Need audited 2026 revenue, gross margin, and consumables pull-through rather than private-market estimates.
    - Need the current cap table and liquidation waterfall to assess preference-adjusted upside.
    - Need counsel-backed assessment of active and potential IP or commercialization disputes.
    - Need fresher headcount and customer-concentration disclosure to test operating leverage and account dependence.
