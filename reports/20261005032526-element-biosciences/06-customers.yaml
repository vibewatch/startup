callouts:
  - calloutType: "strength"
    title: "Validated Rapid Multi-Unit Installation Across Elite Institutions"
    body: "Element has demonstrated that the AVITI system overcomes common capital equipment installation friction. High-profile customer deployments, including the Broad Institute's rapid uncrated installation of three units simultaneously and multi-unit orders from Burning Rock Dx, confirm that experienced sequencing facilities can onboard the platform quickly without protracted operational downtime."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU009"
  - calloutType: "risk"
    title: "Unverified Recurring Consumable Pull-Through and Churn Metrics"
    body: "Despite surpassing 100 commercial instrument orders and establishing relationships in 13 countries, Element discloses neither net revenue retention (NRR) nor annual consumable utilization per instrument. In capital-light or grant-funded academic labs, underutilized benchtop sequencers represent a substantial threat to recurring revenue growth and gross margin expansion."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU014"
      - "CU015"
