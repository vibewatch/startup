    title: "Customer journey map"
    type: "journey-map"
    summary: "Commercial adoption stages for laboratories transitioning from incumbent sequencing platforms to the Element AVITI ecosystem."
    data:
      items:
        - label: "Platform Evaluation & Benchmarking"
          description: "Target lab evaluates AVITI avidite chemistry, running comparison studies on accuracy and cost per read against Illumina systems."
          note: "80% of early customers are experienced NGS labs upgrading or dual-sourcing"
        - label: "Capital Procurement & Installation"
          description: "Institution purchases benchtop AVITI system through direct sales or regional distributor network across 13 countries."
          note: "Rapid installation verified by Broad Institute and core facilities"
        - label: "Library Prep Integration"
          description: "Laboratory integrates Cloudbreak chemistry or standard workflows without retooling upstream sample prep pipelines."
          note: "Workflow compatibility reported as seamless by Helixio and service providers"
        - label: "Production Operation & Multi-Unit Expansion"
          description: "Customer scales instrument utilization, ordering recurring consumables and ordering additional units for expanded capacity."
          note: "Over 40% of sales represent multi-unit orders with repeat fleet additions"
        - label: "Support & Field Operations Cadence"
          description: "Ongoing technical troubleshooting, field service engineering, and platform maintenance to ensure run stability."
          note: "Element actively expanding dedicated Service Operations program team"
        - label: "Platform Lock-in or Churn Decision"
          description: "Laboratory decides whether to standardize diagnostic/research pipelines on AVITI or maintain dual-vendor posture."
          note: "Key risk: lack of published NRR or long-term consumable spend data"
    approximationNotes: "Journey stages reflect commercial milestones and operational support requirements documented in customer case studies and hiring records."
