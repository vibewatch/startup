      - number: '4.2'
        title: Commercial scale, unit placements, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Element demonstrated rapid commercial expansion following the initial delivery of its AVITI platform.
              After commercial shipments began, Element expanded its global installed base from roughly 40 units to more
              than 190 units within a twelve-month period leading up to July 2024. Third-party private market comps from
              Multiples.vc recorded $25 million in historical revenue associated with the Series D milestone, implying a
              41.2x trailing revenue multiple relative to its $1.03 billion post-money valuation. Commercial
              distribution relies on a hybrid go-to-market model combining direct sales teams across major life-science
              clusters with international distribution agreements across global territories. Customer multi-unit
              purchases and repeat expansions—such as the University of Minnesota Genomics Center expanding from one to
              five AVITIs and HALO Precision Diagnostics deploying four units—indicate strong institutional account
              validation. However, sales cycle duration, customer acquisition costs (CAC), payback periods, and net
              revenue retention (NRR) remain undisclosed private metrics.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
