  - id: TV002
    title: Thesis and Anti-Thesis Drivers
    columns:
      - Lens
      - Evidence-Based Argument
      - What Would Change the View
    rows:
      - - Thesis - financing access
        - A June 2026 Series E included $175 million and followed an approximately $277 million Series D.
        - Closing failure, materially worse terms, or a near-term need for another large round would weaken the signal.
      - - Thesis - adoption
        - >-
          Company releases show progression from more than 100 AVITI orders in 13 countries to a footprint above 40
          countries.
        - >-
          Audited installed-base, active-customer, and retention data materially below the public narrative would weaken
          the case.
      - - Thesis - repeat demand
        - The 2023 release reported multi-unit sales above 40% and repeat customers adding capacity.
        - Cohort data showing low utilization or weak consumables reorders would negate this directional proof.
      - - Anti-thesis - price opacity
        - >-
          The Series E valuation and complete round size are not public, and secondary valuation data require gated
          access.
        - >-
          Primary financing documents and an entry price that clears a diligence-built return threshold would improve
          the view.
      - - Anti-thesis - financial opacity
        - A wide third-party revenue estimate does not establish audited revenue, gross margin, burn, cash, or runway.
        - >-
          Audited statements and cohort-level contribution margins showing durable operating leverage would improve
          confidence.
      - - Anti-thesis - dilution and liquidity
        - >-
          The preference waterfall is undisclosed and private-share exits depend on a corporate event or eligible
          secondary liquidity.
        - A clean cap table with acceptable seniority and credible exit pathways would reduce downside risk.
    notes: >-
      Company-issued adoption metrics are treated as claims, while Owler figures are labeled unaudited estimates and
      EquityZen describes access and liquidity mechanics.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Explicit Assumptions
      - Valuation / Return Logic
      - Probability Signal
      - Downside Trigger
    rows:
      - - Bull
        - >-
          Verified recurring consumables growth, durable gross margin, successful VITARI and AVITI Dx conversion, and
          sufficient runway.
        - >-
          No public numeric range is supportable; price only after audited forecasts and preference-adjusted proceeds
          meet the investor's target return.
        - Cohort reorders, paid roadmap deployments, and audited contribution margin outperform the diligence base case.
        - Roadmap slippage or weak utilization breaks the premium-growth thesis.
      - - Base
        - Commercial reach continues to expand, but economics and capitalization remain private until diligence.
        - >-
          Withhold a valuation range and bid; maintain research-more until primary financial and financing records
          support a model.
        - Installed-base and reorder evidence is positive but insufficient to demonstrate self-funded growth.
        - Another large financing before economics are verified raises dilution and runway concerns.
      - - Bear
        - Consumables pull-through, margins, or roadmap conversion disappoint while capital requirements remain high.
        - >-
          No public valuation floor is defensible; a down round, recapitalization, or preference subordination can
          materially impair junior proceeds.
        - Slowing repeat orders, compressed margins, shortened runway, or financing on senior terms.
        - Failure to secure capital or adverse preference terms becomes a thesis-break event.
    notes: >-
      Scenarios are qualitative because the assigned public evidence does not disclose entry valuation, audited
      forecasts, or preference-adjusted ownership economics.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV011
      - CV013
      - CV015
      - CV016
