      - number: '1.3'
        title: Funding History, Valuation Milestones, and Capitalization Structure
        blocks:
          - type: paragraph
            body: >-
              Element has financed its platform development and worldwide commercial build-out through approximately
              $853M in aggregate private capital raised across eight distinct transactions since inception [CO011,
              CO013]. Following non-dilutive federal grants from HHS totaling over $440k in 2017–2018, the company
              closed a $15M Series A in June 2019 led by Foresite Capital and Venrock [CO011]. Subsequent institutional
              rounds included an $80.3M Series B in January 2020 (supplemented by $30M in June 2020), a $276M Series C
              in June 2021 led by Janus Henderson, Logos, Meritech, T. Rowe Price, and Morgan Stanley, and a $277M
              Series D in July 2024 led by Wellington Management with participation from Samsung, Foresite, and Fidelity
              [CO011].


              The July 2024 Series D round established a post-money equity valuation benchmark of $1.03B, officially
              confirming Element's status as a venture-backed genomics unicorn [CO009, CO011]. In June 2026, Element
              expanded its capital cushion by securing an additional $175M Series E round featuring strategic backing
              from Samsung, raising cumulative funding to $853M [CO008, CO011, CO013]. While commercial momentum has
              delivered over 450 installed systems globally and 40% year-over-year revenue growth in 2025, operating
              losses and cohort consumable pull-through rates remain undisclosed private metrics, creating diligence
              gaps regarding ongoing cash burn and operating breakeven timelines [CO005, CO010].
            claimRefs:
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO013
