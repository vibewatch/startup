  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Core Instrument Architecture: AVITI Benchtop, AVITI24 5D Multiomics, and VITARI'
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences commercializes next-generation sequencing (NGS) and multiomics platforms designed to
              disrupt legacy sequencing economics while expanding analytical capabilities directly into cellular space
              [CE001, CE002]. The foundation of Element's hardware line is the AVITI System, a compact dual flow-cell
              benchtop sequencing instrument engineered around proprietary Avidite Base Chemistry (ABC) [CE001, CE002].
              AVITI is designed to provide high-accuracy sequencing with substantial reagent and capital savings
              compared to incumbent short-read platforms [CE001, CE002]. To serve lower-throughput distributed
              laboratories and budget-constrained research teams, Element offers the AVITI LT model as a lower-cost,
              lower-throughput sequencing alternative [CE002].


              Expanding beyond pure DNA/RNA sequencing, Element introduced the AVITI24 instrument, characterized as a 5D
              multiomics system that merges high-throughput sequencing with direct in situ cellular profiling [CE003,
              CE004]. Operating across a 20 cm² imaging area, AVITI24 enables subcellular spatial co-detection of RNA
              transcripts, protein expression, and morphological features in automated run cycles under 24 hours without
              requiring conventional ex vivo library preparation [CE003, CE004]. In perturbations screening workflows,
              Element's Cytos assay co-detects cell morphology, guide RNA, protein expression, and 3'
              whole-transcriptome measurements within the same cell [CE003]. To address production-scale core facilities
              and population genomics workloads, Element's roadmap introduces VITARI, a high-throughput sequencing
              platform that extends Avidite chemistry into high-volume sequencing applications [CE003, CE005].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
