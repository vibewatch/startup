  - id: TE002
    title: Chemistry, assay kit, and workflow optimization matrix
    columns:
      - Reagent / Software Solution
      - Workflow Problem Addressed
      - Technical Mechanism
      - Measurable Operational Benefit
      - Known Operational Limitation
    rows:
      - - Avidite Base Chemistry (ABC)
        - High reagent consumption and dye background noise in SBS
        - Multi-valent avidite core molecules for low-affinity template binding
        - High optical contrast and low fluorophore consumption per cycle
        - Proprietary reagent sourcing and custom flow cell surface chemistry
      - - Cloudbreak Freestyle
        - Sample loss and friction in circular library conversion
        - Direct linear library compatibility with standard NGS protocols
        - Compatibility with >95% third-party library prep kits without conversion
        - Requires optimization for custom indexing and non-standard insert lengths
      - - Cloudbreak UltraQ
        - False positives in liquid biopsy and rare somatic variant calling
        - Advanced fidelity polymerase formulation and high-stringency avidites
        - Achieves Q50 sequencing accuracy (1 error in 100,000 bases)
        - Restricted cycle lengths and premium consumable pricing
      - - Trinity
        - Manual hands-on time and equipment cost in exome capture
        - Automated onboard library capture and enrichment protocols
        - Eliminates separate liquid handler equipment for targeted panels
        - Limited initial panel menu compared to established third-party catalog
      - - Expert Mode HD
        - Fixed read count output constraints on standard reagent runs
        - High-density clustering and optimized base-calling image analytics
        - Yields 20% to 70% additional sequencing reads per flow cell
        - Increased computational load and sensitivity to optical flow-cell flaws
    notes: Matrix details compiled from official product launch disclosures and technical documentation.
    claimRefs:
      - CE001
      - CE003
      - CE006
