  - id: FE001
    title: Element Biosciences modular technology and platform architecture stack
    type: stack
    summary: >-
      Integrated five-tier product and computational architecture spanning wet chemistry, precision opto-mechanics,
      firmware, cloud orchestration, and clinical AI.
    data:
      items:
        - label: Clinical & Multiomic Application Layer
          detail: >-
            Integrates SOPHiA DDM precision oncology and rare disease AI analytics with in situ subcellular spatial RNA
            and protein co-detection on AVITI24 and Cytos single-cell perturbation profiling.
        - label: Bioinformatics & Cloud Secondary Analysis Layer
          detail: >-
            Combines ElemBio Cloud fleet management and Amazon Omics Ready2Run Bases2Fastq workflows with native
            Sentieon and NVIDIA Parabricks secondary pipeline execution in customer AWS environments.
        - label: Instrument Operating Software & Firmware Layer
          detail: >-
            Features real-time onboard base-calling, direct S3 data streaming, automated Trinity onboard exome prep
            sequencing control, and Expert Mode HD density scaling.
        - label: Opto-Mechanical & Fluidic Platform Layer
          detail: >-
            Encompasses dual independent flow-cell benchtop chassis for AVITI and AVITI LT, 20 cm² subcellular imaging
            chamber on AVITI24, and scaled chassis design for the VITARI high-throughput system.
        - label: Core Molecular Chemistry & Consumables Layer
          detail: >-
            Anchored by proprietary multi-valent Avidite Base Chemistry (ABC), Cloudbreak Freestyle universal linear
            library compatibility kits, and Cloudbreak UltraQ Q50 high-accuracy sequencing reagents.
        - label: Hardware-Level Flow-Cell & Thermal Subsystem Layer
          detail: >-
            Provides high-precision Peltier thermal cycling blocks, fluidic microvalves, and automated flow-cell chuck
            alignment mechanisms ensuring uniform surface temperature across run cycles.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Commercial adoption stages for laboratories transitioning from incumbent sequencing platforms to the Element AVITI
      ecosystem.
    data:
      items:
        - label: Platform Evaluation & Benchmarking
          description: >-
            Target lab evaluates AVITI avidite chemistry, running comparison studies on accuracy and cost per read
            against Illumina systems.
          note: 80% of early customers are experienced NGS labs upgrading or dual-sourcing
        - label: Capital Procurement & Installation
          description: >-
            Institution purchases benchtop AVITI system through direct sales or regional distributor network across 13
            countries.
          note: Rapid installation verified by Broad Institute and core facilities
        - label: Library Prep Integration
          description: >-
            Laboratory integrates Cloudbreak chemistry or standard workflows without retooling upstream sample prep
            pipelines.
          note: Workflow compatibility reported as seamless by Helixio and service providers
        - label: Production Operation & Multi-Unit Expansion
          description: >-
            Customer scales instrument utilization, ordering recurring consumables and ordering additional units for
            expanded capacity.
          note: Over 40% of sales represent multi-unit orders with repeat fleet additions
        - label: Support & Field Operations Cadence
          description: >-
            Ongoing technical troubleshooting, field service engineering, and platform maintenance to ensure run
            stability.
          note: Element actively expanding dedicated Service Operations program team
        - label: Platform Lock-in or Churn Decision
          description: >-
            Laboratory decides whether to standardize diagnostic/research pipelines on AVITI or maintain dual-vendor
            posture.
          note: 'Key risk: lack of published NRR or long-term consumable spend data'
    approximationNotes: >-
      Journey stages reflect commercial milestones and operational support requirements documented in customer case
      studies and hiring records.
