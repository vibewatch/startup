chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Scope, and Market Position
        blocks:
          - type: paragraph
            body: >-
              Element Biosciences, Inc. (dba ELEMENT BIOSCIENCES INC) is an American biotechnology instrumentation
              developer headquartered in San Diego, California [CO001]. Founded in July 2017 and federally registered
              under NAICS code 334516 (Analytical Laboratory Instrument Manufacturing) [CO001], the company was
              established to democratize access to advanced genomic assays and high-throughput sequencing tools [CO002].
              Element entered commercialization by challenging the long-standing short-read sequencing monopoly held by
              Illumina, seeking to lower reagent costs and improve data quality across core academic, clinical, and
              commercial laboratories [CO003].


              The core of Element's initial commercial offering is the AVITI benchtop sequencing platform, launched
              commercially in 2022 [CO003, CO004]. AVITI leverages proprietary multivalent AVIDITY sequencing chemistry,
              non-stick flowcell surface passivation, and discrete polony clustering to separate signal detection from
              nucleotide incorporation, markedly reducing reagent consumption and imaging background noise [CO003]. More
              recently, the company extended its portfolio by previewing and launching VITARI, a benchtop
              high-throughput platform engineered to deliver $100 human genome economics at scale, alongside the AVITI24
              platform providing 5D multiomics and direct in-sample tissue sequencing [CO005, CO006, CO007]. Through
              this ecosystem, Element positions itself as an end-to-end biological analysis provider operating across
              genomic, transcriptomic, and spatial cellular dimensions [CO005].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
