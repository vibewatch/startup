  name: "Element Biosciences"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Element Biosciences is a San Diego-based life sciences company founded in 2017 that develops desktop and benchtop next-generation DNA sequencing instruments, most notably the AVITI and newly announced VITARI platforms. The company has raised over $850M in cumulative capital—including a $277M Series D in 2024 valuing it at $1.03B and a subsequent $175M Series E in 2026—positioning itself as a primary lower-cost challenger to Illumina's benchtop sequencing dominance."
sections:
  - id: "identity-and-mission"
    title: "Corporate Identity, Product Scope, and Market Position"
    body: "Element Biosciences, Inc. (dba ELEMENT BIOSCIENCES INC) is an American biotechnology instrumentation developer headquartered in San Diego, California [CO001]. Founded in July 2017 and federally registered under NAICS code 334516 (Analytical Laboratory Instrument Manufacturing) [CO001], the company was established to democratize access to advanced genomic assays and high-throughput sequencing tools [CO002]. Element entered commercialization by challenging the long-standing short-read sequencing monopoly held by Illumina, seeking to lower reagent costs and improve data quality across core academic, clinical, and commercial laboratories [CO003].\n\nThe core of Element's initial commercial offering is the AVITI benchtop sequencing platform, launched commercially in 2022 [CO003, CO004]. AVITI leverages proprietary multivalent AVIDITY sequencing chemistry, non-stick flowcell surface passivation, and discrete polony clustering to separate signal detection from nucleotide incorporation, markedly reducing reagent consumption and imaging background noise [CO003]. More recently, the company extended its portfolio by previewing and launching VITARI, a benchtop high-throughput platform engineered to deliver $100 human genome economics at scale, alongside the AVITI24 platform providing 5D multiomics and direct in-sample tissue sequencing [CO005, CO006, CO007]. Through this ecosystem, Element positions itself as an end-to-end biological analysis provider operating across genomic, transcriptomic, and spatial cellular dimensions [CO005]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Exposure"
    body: "Element was co-founded by Chief Executive Officer Molly He, PhD, alongside a team of sequencing industry veterans [CO005, CO008]. Prior to founding Element, leadership personnel accumulated deep domain expertise within the San Diego genomics cluster, directly informing the architectural design of AVIDITY chemistry to circumvent established sequencing-by-synthesis (SBS) patent thickets [CO003]. Executive management includes Chief Financial Officer Logan Zinser, Chief Legal Officer David Melaugh, and corporate leadership including Brian Stolz [CO009]. Operating leadership has guided the company from early-stage chemical prototyping to global commercial scaling across direct and distributor sales channels [CO010].\n\nBecause Element's differentiation rests heavily on proprietary chemistry, flowcell physics, and avoiding intellectual property infringement claims from entrenched competitors like Illumina, technical and strategic continuity centered around CEO Molly He represents a material key-person dependence [CO003, CO008, CO010]. Furthermore, governance involves oversight from top-tier healthcare venture investors, crossover funds, and strategic partners such as Samsung, Wellington Management, and Fidelity Investments [CO011, CO012]. As the organization expands its headcount to an estimated 200–500 employees, management faces the dual challenge of sustaining rapid R&D iteration while executing industrial manufacturing and field support operations [CO002, CO008]."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Funding History, Valuation Milestones, and Capitalization Structure"
    body: "Element has financed its platform development and worldwide commercial build-out through approximately $853M in aggregate private capital raised across eight distinct transactions since inception [CO011, CO013]. Following non-dilutive federal grants from HHS totaling over $440k in 2017–2018, the company closed a $15M Series A in June 2019 led by Foresite Capital and Venrock [CO011]. Subsequent institutional rounds included an $80.3M Series B in January 2020 (supplemented by $30M in June 2020), a $276M Series C in June 2021 led by Janus Henderson, Logos, Meritech, T. Rowe Price, and Morgan Stanley, and a $277M Series D in July 2024 led by Wellington Management with participation from Samsung, Foresite, and Fidelity [CO011].\n\nThe July 2024 Series D round established a post-money equity valuation benchmark of $1.03B, officially confirming Element's status as a venture-backed genomics unicorn [CO009, CO011]. In June 2026, Element expanded its capital cushion by securing an additional $175M Series E round featuring strategic backing from Samsung, raising cumulative funding to $853M [CO008, CO011, CO013]. While commercial momentum has delivered over 450 installed systems globally and 40% year-over-year revenue growth in 2025, operating losses and cohort consumable pull-through rates remain undisclosed private metrics, creating diligence gaps regarding ongoing cash burn and operating breakeven timelines [CO005, CO010]."
    claimRefs:
      - "CO005"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO013"
