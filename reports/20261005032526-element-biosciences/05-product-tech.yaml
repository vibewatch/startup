        - label: "Clinical & Multiomic Application Layer"
          detail: "Integrates SOPHiA DDM precision oncology and rare disease AI analytics with in situ subcellular spatial RNA and protein co-detection on AVITI24 and Cytos single-cell perturbation profiling."
        - label: "Bioinformatics & Cloud Secondary Analysis Layer"
          detail: "Combines ElemBio Cloud fleet management and Amazon Omics Ready2Run Bases2Fastq workflows with native Sentieon and NVIDIA Parabricks secondary pipeline execution in customer AWS environments."
        - label: "Instrument Operating Software & Firmware Layer"
          detail: "Features real-time onboard base-calling, direct S3 data streaming, automated Trinity onboard exome prep sequencing control, and Expert Mode HD density scaling."
        - label: "Opto-Mechanical & Fluidic Platform Layer"
          detail: "Encompasses dual independent flow-cell benchtop chassis for AVITI and AVITI LT, 20 cm² subcellular imaging chamber on AVITI24, and scaled chassis design for the VITARI high-throughput system."
        - label: "Core Molecular Chemistry & Consumables Layer"
          detail: "Anchored by proprietary multi-valent Avidite Base Chemistry (ABC), Cloudbreak Freestyle universal linear library compatibility kits, and Cloudbreak UltraQ Q50 high-accuracy sequencing reagents."
        - label: "Hardware-Level Flow-Cell & Thermal Subsystem Layer"
          detail: "Provides high-precision Peltier thermal cycling blocks, fluidic microvalves, and automated flow-cell chuck alignment mechanisms ensuring uniform surface temperature across run cycles."
