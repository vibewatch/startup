  name: "Element Biosciences"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Element Biosciences delivers benchtop and high-throughput next-generation sequencing and in situ multiomics instruments anchored by its proprietary Avidite Base Chemistry (ABC). Its commercial portfolio spans the flagship AVITI and AVITI LT benchtop sequencers, the AVITI24 5D multiomics cellular profiler, the VITARI high-throughput system, and integrated secondary analysis pipelines via Bases2Fastq on Amazon Omics and ElemBio Cloud."
sections:
  - id: "sequencing-and-multiomics-hardware"
    title: "Core Instrument Architecture: AVITI Benchtop, AVITI24 5D Multiomics, and VITARI"
    body: "Element Biosciences commercializes next-generation sequencing (NGS) and multiomics platforms designed to disrupt legacy sequencing economics while expanding analytical capabilities directly into cellular space [CE001, CE002]. The foundation of Element's hardware line is the AVITI System, a compact dual flow-cell benchtop sequencing instrument engineered around proprietary Avidite Base Chemistry (ABC) [CE001, CE002]. AVITI is designed to provide high-accuracy sequencing with substantial reagent and capital savings compared to incumbent short-read platforms [CE001, CE002]. To serve lower-throughput distributed laboratories and budget-constrained research teams, Element offers the AVITI LT model as a lower-cost, lower-throughput sequencing alternative [CE002].\n\nExpanding beyond pure DNA/RNA sequencing, Element introduced the AVITI24 instrument, characterized as a 5D multiomics system that merges high-throughput sequencing with direct in situ cellular profiling [CE003, CE004]. Operating across a 20 cm² imaging area, AVITI24 enables subcellular spatial co-detection of RNA transcripts, protein expression, and morphological features in automated run cycles under 24 hours without requiring conventional ex vivo library preparation [CE003, CE004]. In perturbations screening workflows, Element's Cytos assay co-detects cell morphology, guide RNA, protein expression, and 3' whole-transcriptome measurements within the same cell [CE003]. To address production-scale core facilities and population genomics workloads, Element's roadmap introduces VITARI, a high-throughput sequencing platform that extends Avidite chemistry into high-volume sequencing applications [CE003, CE005]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "avidite-chemistry-and-reagent-ecosystem"
    title: "Avidite Base Chemistry, Library Compatibility, and Reagent Formats"
    body: "At the chemical core of Element's platform is Avidite Base Chemistry (ABC), which departs from traditional sequencing-by-synthesis (SBS) by utilizing multi-valent core avidite molecules that bind specifically to cognate templates, driving lower background noise, high optical contrast, and substantially reduced consumption of expensive fluorescent reagents [CE001, CE003]. To minimize customer switching barriers, Element released Cloudbreak Freestyle sequencing kits, which ensure out-of-the-box compatibility with greater than 95% of third-party NGS library preparation kits without requiring enzymatic or PCR library circularization steps [CE006].\n\nFor ultra-high-accuracy applications such as liquid biopsy, cell-free DNA (cfDNA), and rare somatic variant detection, Element introduced Cloudbreak UltraQ kits, engineered to reach Q50 accuracy specifications (one error per 100,000 bases), representing an asserted 100-fold error reduction over the standard industry Q30 benchmark [CE006]. To consolidate front-end workflow touchpoints onto the physical instrument, Element developed the Trinity assay and software suite, enabling comprehensive automated onboard library preparation—specifically for targeted exome capture and enrichment workflows directly inside the instrument [CE006]. Instrument firmware enhancements like Expert Mode HD further unlock an operational gain of 20% to 70% additional sequencing reads per reagent kit through enhanced flow-cell clustering and image analysis algorithms [CE006]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
    tableRefs:
      - "TE002"
  - id: "bioinformatics-integration-and-compliance"
    title: "Secondary Analysis Infrastructure, Cloud Integration, and Enterprise Security"
    body: "Operational adoption of benchtop sequencing hinges on frictionless, secure secondary analysis pipelines that do not overwhelm institutional IT infrastructure or lock customers into proprietary cloud subscriptions [CE007]. Element addresses primary and secondary compute through onboard base-calling and direct streaming of base calls and quality metrics to customer-controlled Amazon Web Services (AWS) S3 buckets via IAM roles and external IDs [CE007]. Customers execute Element's Bases2Fastq Ready2Run workflows on Amazon Omics to execute demultiplexing, FASTQ generation, and quality control across 150-cycle, 300-cycle, and 600-cycle kits under transparent per-run pricing [CE007]. FASTQ outputs natively feed secondary analysis containers, including Sentieon acceleration suites and NVIDIA Parabricks [CE007]. ElemBio Cloud orchestrates these runs across distributed fleets with interactive execution dashboards while preserving customer cloud data sovereignty [CE006, CE007].\n\nFor diagnostic and clinical oncology research, Element partnered with SOPHiA GENETICS to interface the AVITI and AVITI24 platforms with SOPHiA DDM AI-driven analytics, enabling standardized oncology and rare disease variant interpretation across international hospital networks like Institut Paoli-Calmettes [CE008, CE009, CE010]. Nevertheless, independent verification of commercial throughput parity, mean time between failures (MTBF), long-term reagent stability, and field-level instrument reliability across non-academic production environments remains a key diligence diligence gap [CE011, CE012]."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
