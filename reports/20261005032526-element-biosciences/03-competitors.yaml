    title: "Incumbent Fleet Inertia and Contractual Tying Pressure"
    body: "Element's technological and pricing advantages are constrained by Illumina's extensive installed base. Core facilities and commercial sequencing centers with multi-instrument Illumina fleets face significant financial switching penalties when adopting non-Illumina sequencers, driven by tiered service contract structures and bundled consumable pricing across legacy instruments."
