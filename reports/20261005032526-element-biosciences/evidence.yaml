evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-roster
    missingEvidence: >-
      Complete disclosure of the broader senior director, VP-level engineering leadership, and scientific advisory board
      members.
    whyItMatters: >-
      A full executive census is needed to evaluate organizational depth, succession planning, and functional coverage
      across hardware and bioinformatics.
    diligencePath: Review comprehensive corporate org charts and LinkedIn organizational mappings during formal management diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-consumables
    missingEvidence: >-
      Audited financial statements detailing FY2025/2026 annual revenue, gross margins, and recurring consumable
      pull-through per installed instrument.
    whyItMatters: >-
      Without audited figures, Element's revenue run rate and path to operating profitability cannot be independently
      verified.
    diligencePath: Obtain confidential offering memorandum or auditor-reviewed financial statements during formal diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: obtainable-market-sizing
    missingEvidence: >-
      Audited segment revenue, active commercial instrument installed base counts, and average consumable pull-through
      per instrument across customer classes.
    whyItMatters: >-
      Without segmented revenue disclosures, Element's precise market share and serviceable obtainable market (SOM)
      cannot be independently calculated beyond broad directional ranges.
    diligencePath: >-
      Obtain audited 2025/2026 management accounts or confidential customer cohort retention and pull-through filings
      during late-stage diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-resilience
    missingEvidence: >-
      Empirical pricing data on realized discount concessions granted by Illumina in multi-instrument core laboratory
      procurements against AVITI bids.
    whyItMatters: >-
      Determines whether Element's list-price consumable advantage persists in negotiated institutional contracts or is
      eroded by enterprise bundling.
    diligencePath: >-
      Review institutional procurement bids and customer service contracts comparing final realized per-gigabase pricing
      across mixed-vendor core facilities.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Audited gross margin percentages and direct unit manufacturing costs for AVITI hardware and ABC consumable reagent
      kits.
    whyItMatters: >-
      Essential to evaluate long-term gross profit contribution and establish whether hardware placements generate
      positive contribution margins prior to reagent pull-through.
    diligencePath: >-
      Request management profit-and-loss statements broken down by hardware and consumables product lines under an
      institutional non-disclosure agreement.
  - type: private-evidence-only
    severity: material
    topic: consumables-pull-through
    missingEvidence: Annualized consumable reagent spend and run frequency per active instrument across customer segments.
    whyItMatters: Dictates the recurring revenue profile and customer lifetime value of the placed instrument fleet.
    diligencePath: Obtain customer cohort sequencing utilization logs and annualized consumable kit replenishment orders.
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: >-
      Monthly net operational cash burn rate, working capital requirements, and total cash and liquid equivalents on
      hand.
    whyItMatters: >-
      Critical for assessing runway adequacy following the Series D raise and projecting the timing of subsequent
      capital calls or debt facilities.
    diligencePath: >-
      Review audited balance sheets, trailing twelve-month cash flow statements, and forward 24-month financial budget
      models.
  - type: missing-source
    severity: material
    topic: vitari-production-benchmarks
    missingEvidence: >-
      Published independent instrument specifications, list pricing, commercial delivery schedules, and run cost
      economics for the VITARI high-throughput system.
    whyItMatters: >-
      VITARI is essential to determining whether Element can contest high-volume population genomics and core lab
      production accounts against Illumina NovaSeq X and Ultima Genomics.
    diligencePath: >-
      Review commercial launch presentations, early-access customer evaluations, and core lab procurement RFPs following
      the Beyond 2026 product introduction.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: hardware-reliability-and-mtbf
    missingEvidence: >-
      Audited field failure rates, optical realignment intervals, fluidics valve failure rates, and service contract
      response times across production customer cohorts.
    whyItMatters: >-
      High-throughput and clinical diagnostic workflows demand stringent uptime guarantees, where unscheduled downtime
      rapidly erodes reagent cost advantages.
    diligencePath: >-
      Conduct expert calls with commercial reference lab managers and review customer service logs during technical
      diligence.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: customer-retention-and-pull-through
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and average annualized consumable
      pull-through per installed instrument.
    whyItMatters: >-
      Sequencing business durability relies on recurring consumables; instrument placement growth without sustained
      pull-through impairs long-term gross margins and terminal enterprise value.
    diligencePath: >-
      Request customer cohort revenue waterfall, annualized reagent kit shipment logs per serial number, and active
      cartridge utilization telemetry.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-fleet-enumeration
    missingEvidence: >-
      Complete registry of all customer accounts, active instrument serial numbers, and geographic utilization across
      direct and distributor territories.
    whyItMatters: >-
      Public customer disclosures represent a selective marketing sample of high-profile accounts, obscuring possible
      dormant or underutilized instruments in academic laboratories.
    diligencePath: >-
      Examine internal Salesforce customer master registry, active warranty and service contract records, and warranty
      renewal rates.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: operational-quality
    missingEvidence: >-
      Audited instrument mean time between failures (MTBF), warranty reserve expenses, and lot-level consumable scrap
      rates.
    whyItMatters: >-
      Directly determines the operational cost structure, field service team requirements, and gross margin durability
      of the sequencing platform.
    diligencePath: >-
      Request customer service ticketing logs, return material authorization (RMA) rates, and field failure reporting
      from management during confidential data room review.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: regulatory-legal
    missingEvidence: >-
      Detailed schedule of active patent litigation filings, inter partes review challenges, and commercial settlement
      covenants with Illumina.
    whyItMatters: >-
      Intellectual property injunctions could impede commercial distribution or impose substantial royalty licensing
      burdens on Avidity chemistry.
    diligencePath: >-
      Obtain an independent freedom-to-operate (FTO) formal patent opinion from specialized intellectual property life
      sciences legal counsel.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: valuation comparables and return model
    missingEvidence: >-
      Audited forecast, current net debt or cash, comparable-company metric set, relevant transaction terms, entry
      valuation, and ownership percentage.
    whyItMatters: >-
      Without consistent denominators and an entry price, no defensible enterprise-value range, target return, hold
      period, or comparable multiple can be calculated.
    diligencePath: >-
      Obtain audited historicals and management forecast, normalize a stage-appropriate comparable set, and model
      preference-adjusted proceeds at the proposed primary or secondary price.
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: dilution and preference waterfall
    missingEvidence: >-
      Complete capitalization table, Series E pre-money and post-money valuation, round size, ownership, liquidation
      preferences, participation rights, anti-dilution terms, debt, and option-pool expansion.
    whyItMatters: Senior claims and dilution determine the proceeds available to a new or junior investor under every exit scenario.
    diligencePath: >-
      Review the charter, stock-purchase agreements, investor-rights agreements, capitalization ledger, debt schedule,
      and modeled exit waterfall under NDA.
    relatedQuestionRefs:
      - QV006
    relatedTableRefs:
      - TV002
      - TV003
  - type: private-evidence-only
    severity: material
    topic: operating economics
    missingEvidence: >-
      Audited revenue, instrument and consumables gross margin, installed base, active-customer count, utilization,
      reorder cohorts, customer concentration, cash, burn, and runway.
    whyItMatters: >-
      Commercial announcements cannot establish recurring revenue quality, operating leverage, financing needs, or
      downside resilience.
    diligencePath: >-
      Request audited statements, monthly cash bridge, customer and instrument cohorts, consumables reorder data,
      concentration schedule, and board-approved operating plan.
    relatedTableRefs:
      - TV001
      - TV002
      - TV003
