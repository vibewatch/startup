company:
  name: "Element Biosciences"
chapter:
  number: 8
  title: "Valuation"
  summary: "Element has fresh strategic financing, expanding commercial reach, and a broader product roadmap, but the public record does not disclose the Series E valuation, complete round size, audited operating economics, or preference stack. The price-sensitive conclusion is research-more with medium confidence and high risk until those inputs support a defensible entry model."
sections:
  - id: "investment-conclusion"
    title: "Investment Conclusion"
    body: >-
      Element merits continued diligence rather than an immediate investment recommendation.
      Public evidence supports meaningful operating progress: a $175 million Series E was
      reported in June 2026, the company says its customer footprint exceeds forty countries,
      and its roadmap extends beyond AVITI into higher-throughput and multiomic systems.
      Those signals improve the company-quality case but do not establish an investable price.
      The reviewed public sources disclose neither the Series E valuation nor audited revenue,
      gross margin, cash, burn, recurring consumables economics, or the preference waterfall.
      Without those denominators, a target return, valuation range, and ownership outcome would
      be false precision. The appropriate stance is therefore research-more, with medium
      confidence in that process recommendation and high underwriting risk.
    claimRefs:
      - "CV001"
      - "CV010"
      - "CV011"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "financing-and-entry-discipline"
    title: "Financing Context and Entry Discipline"
    body: >-
      The June 2026 financing included $175 million from Samsung Electronics and an
      undisclosed amount from other investors; the company also said closing remained subject
      to regulatory approval. This followed a July 2024 Series D reported at approximately
      $277 million. The sequence confirms access to substantial private capital, but funding
      raised is not cash available and does not reveal current burn or runway. Owler's
      $25 million to $100 million annual-revenue estimate and $853.3 million funding figure are
      unaudited market-data estimates, not substitutes for company financials. EquityZen's
      public page confirms that valuation, share-price, cap-table, and preference information
      exist behind access controls, while its exit description underscores the limited
      liquidity routes for private shares. Entry discipline should require primary documents,
      not infer valuation from round size.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV013"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "commercial-proof-and-execution"
    title: "Commercial Proof and Execution"
    body: >-
      The strongest public commercial evidence is directional rather than financial. A
      company-issued 2023 release reported more than one hundred AVITI orders across thirteen
      countries, with more than forty percent of sales involving multiple units and repeat
      customers adding capacity. By June 2026, Element said its footprint exceeded forty
      countries. That progression is consistent with broader adoption, but it does not disclose
      installed instruments, active customers, utilization, reorder cohorts, retention, or
      consumables gross margin. The original AVITI launch set a $289,000 instrument price and
      claimed $5 to $7 per gigabase run cost, useful historical anchors that do not establish
      current realized pricing or profitability. Leadership continuity and a larger roadmap
      add execution capacity, while simultaneous platform launches increase delivery demands.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
    figureRefs:
      - "FV001"
  - id: "scenarios-exit-and-diligence"
    title: "Scenarios, Exit Readiness, and Diligence"
    body: >-
      Scenario analysis must remain conditional because no public entry valuation or audited
      forecast supports numeric enterprise-value ranges. The bull case requires verified
      recurring consumables pull-through, durable gross margins, and successful conversion of
      the roadmap into paid deployments. The base case recognizes commercial progress but
      withholds a bid until audited economics and capitalization documents can produce a
      risk-adjusted return model. The bear case is a down round, recapitalization, or prolonged
      private holding in which preference seniority impairs junior proceeds. EquityZen
      describes liquidity through an IPO, merger or acquisition, or an eligible secondary
      Express Deal; none is assured. Final diligence should obtain the financing documents,
      audited cohort economics, cash and burn schedule, customer concentration, and launch
      milestones before setting price, hold period, or exit assumptions.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV009"
      - "CV011"
      - "CV013"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
