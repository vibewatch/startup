company:
  name: Altana Technologies
chapter:
  order: 7
  number: 7
  title: Risks
  summary: >-
    Altana's risk profile is dominated by execution rather than survival: customer concentration,
    government and regulatory dependence, opaque retention metrics, and a product surface that
    still relies on trust and implementation quality more than on commoditized software scale.
sections:
  - id: s1
    title: Regulatory, Government, and Trust Dependence
    body: >-
      The company sells into trade, customs, defense, and economic-security workflows, which
      means the product is tied to government procurement cycles, compliance scrutiny, and
      changing policy environments. That concentration creates a real moat, but it also means
      that regulatory changes, procurement delays, or certification gaps can affect revenue
      conversion and expansion.

      Public signals also suggest Altana is increasingly relevant in cross-border government
      partnerships, including customs-adjacent programs and public-sector adoption. That is a
      strength, but it also raises the bar for security, auditability, and deployment discipline.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: s2
    title: Customer and Product Execution Risks
    body: >-
      The biggest commercial risk is that the company must keep proving durable value to a small
      set of large accounts. Altana's customer story is strong on named logos, but weak on public
      retention metrics. In practice, that means the company has to win renewals, avoid one-off
      pilot behavior, and keep the product embedded in daily trade operations.

      Product execution is also a risk because the platform is still being expanded via product
      passports, passport management, and customs automation. Those launches improve the story,
      but they also broaden the surface area that must work reliably in regulated environments.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: s3
    title: Transparency, Competition, and Delivery Risk
    body: >-
      Altana is still opaque on core operating metrics, so diligence has to infer much of the
      risk profile from hiring, launches, and market pages. The public market also remains
      competitive: point tools, ERP add-ons, and trust/compliance suites can still win deals when
      speed, bundle economics, or procurement convenience matter more than network depth.

      The final execution risk is delivery quality. The platform engineering and technical
      account roles make clear that Altana must support both commercial and government-compliant
      deployments. If implementation is slow or governance is inconsistent, the moat weakens.
      A second-order risk is that product breadth grows faster than documentation, testing, and
      support capacity, which would show up first as customer friction rather than headline churn
      or a support backlog.
    claimRefs: [CR009, CR010, CR011, CR012]
    figureRefs: [FR001]
    tableRefs: [TR003]
tables:
  - id: TR001
    slug: regulatory-legal-risk-register
    title: Regulatory / Legal Risk Register
    columns: [Risk, Category, Why It Matters, Evidence, Mitigation]
    rows:
      - [Government procurement cycle, regulatory, 'Long sales cycles can delay growth', 'job posts and public-sector focus', 'Build multi-program pipeline']
      - [Security / trust certification, operational, 'Public-sector deals require auditability', 'platform-engineering hiring', 'Strengthen compliance posture']
      - [Customer concentration, commercial, 'Few large accounts can dominate revenue', 'named-logo customer set', 'Track renewal and top-account mix']
      - [Product complexity, delivery, 'More workflow modules increase failure modes', 'product launches and acquisition coverage', 'Ship in smaller verified increments']
      - [Competitive substitution, market, 'ERP and point tools can still win', 'alternatives pages', 'Keep expanding workflow depth']
      - [Opaque unit economics, financial, 'Hard to underwrite retention and margin', 'missing public metrics', 'Request cohort data']
    notes: 'This is a qualitative risk register built from public signals, not internal controls testing.'
    enumerationScope:
      coverage: partial
      basis: "Covers the main public risk categories visible in current trade, product, and market sources."
    claimRefs: [CR001, CR005, CR009, CR010, CR011, CR012]
  - id: TR002
    title: Adverse Signal Matrix
    columns: [Signal, What It Suggests, Severity, Diligence Ask]
    rows:
      - [No public NRR / GRR, retention durability is unproven, high, 'Request cohort retention by vintage']
      - [Limited market activity on secondary-market pages, liquidity is thin, medium, 'Confirm transfer restrictions and demand']
      - [Crowded alternatives set, substitution risk remains real, medium, 'Ask for win/loss data versus suites']
      - [AI-first SDLC / agent-first push, execution depends on new tooling, medium, 'Review governance and incident process']
      - [Government deployment focus, security and compliance burden rises, high, 'Verify authorization and audit controls']
      - [Product launch velocity, broader surface area may increase bugs, medium, 'Ask for release quality and rollback process']
    notes: 'Negative signals are mostly about transparency and delivery, not existential solvency.'
    claimRefs: [CR006, CR007, CR009, CR010, CR012]
  - id: TR003
    title: Mitigation and Monitoring Table
    columns: [Risk, Current Mitigation, What to Monitor, Trigger]
    rows:
      - [Procurement friction, 'public-sector hiring and partner references', 'pipeline age and close rates', 'quarterly conversion slowdown']
      - [Retention opacity, 'public logos and launch cadence', 'renewal mix and NRR', 'customer exits or flat ARR']
      - [Deployment risk, 'AI-first platform engineering', 'incident rate and rollback time', 'customer-facing outages']
      - [Competitive bundling, 'workflow depth and network data', 'win/loss ratio', 'suite vendors taking share']
      - [Trust posture, 'government-compliant deployment messaging', 'certification and audit status', 'loss of regulated accounts']
    notes: 'These mitigations are inferred from hiring and product messaging rather than disclosed controls.'
    claimRefs: [CR001, CR004, CR005, CR011, CR012]
