chapter:
  order: 6
  number: 6
  title: Customers
  summary: >-
    Altana's public customer story is concentrated in large-enterprise and government trade
    workflows: named logos, public-sector references, and hiring signals all point to a buyer
    base that values trust, compliance, and network visibility over self-serve simplicity.
    The core diligence gap is still retention quality — customer concentration, renewal cadence,
    and contract length remain opaque.
sections:
  - id: s1
    title: Named Customers and Segmentation
    body: >-
      The public customer set is anchored by trade-intensive enterprises and public-sector
      agencies. Business Wire's July 2024 Series C announcement names Maersk, Boston Scientific,
      L.L.Bean, US Customs and Border Protection, and UK government agencies as live customers.
      Earlier and later company materials describe a similar pattern: multinational enterprises,
      customs authorities, logistics providers, and regulated industries that care about cross-
      border visibility and compliance.

      This is not a self-serve SMB motion. The buyer is typically a trade, compliance, logistics,
      or government mission leader who needs cross-functional adoption. Public sources still do
      not provide a clean customer roster or revenue-by-vertical split, so the segmentation here
      is reconstructed from announcements and role descriptions rather than a disclosed CRM export.
    claimRefs: [CU001, CU002, CU003, CU008]
    tableRefs: [TU001]
  - id: s2
    title: Adoption Signals and Workflow Depth
    body: >-
      Altana's hiring signals show that customers do more than consume dashboards. Sales-engineer
      and technical-account roles ask the company to turn platform output into briefings, customer
      analysis, and adoption work. That implies the product lives inside active workflows where
      the customer needs help operationalizing the data, not simply viewing it.

      The company also appears to use proof-point customers as trust anchors: the product story
      repeatedly mentions customs authorities, multinational enterprises, and regulated
      manufacturers. That combination suggests a high-touch sales motion and a relatively
      expensive customer acquisition model, but also a strong fit for mission-critical workflows.
    claimRefs: [CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
  - id: s3
    title: Retention, Concentration, and Open Questions
    body: >-
      The main customer diligence gap is durability. Altana does not publicly disclose renewal
      rates, gross revenue retention, net revenue retention, or customer concentration. Forge
      Global's secondary-market page shows the company is still private and market activity is
      limited, which reinforces the idea that customer economics are still opaque rather than
      fully mature.

      The public record therefore supports a constructive adoption story, but not yet a fully
      underwritten retention story. The right next questions are not whether the company has
      logos, but how sticky the logos are, how concentrated the top accounts are, and how much
      of the platform becomes embedded in daily trade operations.
    claimRefs: [CU009, CU010, CU011, CU012]
    figureRefs: [FU001]
