      - [Executive sponsor, 'prove ROI and resilience', 'briefings and analytics', 'customer-facing roles', 'ROI proof must be concrete']
    notes: 'The product is embedded in operational workflows, not just used as a reporting layer.'
    claimRefs: [CU004, CU005, CU006, CU007]
  - id: TU003
    title: Retention and Concentration Gap Table
    columns: [Metric, Public Status, Why It Matters, Diligence Ask]
    rows:
      - [Customer count, 'claimed >1,000 in BuiltIn; not independently verified', 'Scale signal', 'Ask for active vs. historical customers']
      - [Net revenue retention, 'not disclosed', 'Sticky expansion signal', 'Request cohort NRR']
      - [Gross revenue retention, 'not disclosed', 'Logo churn signal', 'Request renewal / churn data']
      - [Top-customer concentration, 'not disclosed', 'Revenue risk', 'Request top-10 / top-20 concentration']
      - [Average contract length, 'not disclosed', 'Runway and renewal cadence', 'Request contract duration distribution']
      - [Implementation time, 'implied to be significant', 'Onboarding friction', 'Ask for median time-to-live']
    notes: 'The strongest public evidence is adoption breadth, not renewal durability.'
    claimRefs: [CU009, CU010, CU011, CU012]
