  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Actual ARR, burn, and customer-count numbers remain undisclosed.
    whyItMatters: They determine the confidence in the valuation and growth path.
    diligencePath: Request a data-room schedule for ARR, burn, retention, and bookings.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: compliance
    missingEvidence: A current, public verification of the exact FedRAMP / IC authorization posture.
    whyItMatters: The company's government moat is part of the bullish thesis.
    diligencePath: Verify with current security or procurement documentation before underwriting the moat.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sizing
