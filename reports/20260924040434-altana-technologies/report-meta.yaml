companyProfile:
  summary: >-
    Altana Technologies is a New York-based private software company building an AI-powered trusted-trade network for
    governments, logistics providers, and enterprises. The company combines a buyer-supplier knowledge graph, compliance
    workflows, customs automation, and tariff planning into a single platform. It raised a $200M Series C in July 2024
    at a $1B valuation and has since added Cervo AI to broaden customs-entry automation. Public evidence points to a
    roughly 300-person organization with strong traction in trade and government workflows, but private financials
    remain undisclosed.
