    notes: 'Secondary-market pages are directional, not a substitute for audited financials.'
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV011]
  - id: TV003
    title: Valuation Sensitivity Table
    columns: [Scenario, What Moves It, Valuation Implication, Monitoring Signal]
    rows:
