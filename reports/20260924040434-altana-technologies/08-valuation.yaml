  number: 8
  title: Valuation
  summary: >-
    Altana's valuation is still anchored to its July 2024 $1B Series C, but secondary-market
    pages and analyst databases show a spread between reported and modeled values. The company
    remains private and lightly traded, so valuation is still a blend of narrative, private
    market comparables, and limited-liquidity signals rather than a public-market mark.
sections:
  - id: v1
    title: Primary Valuation Anchors
    body: >-
      The clearest anchor remains the July 2024 Series C: Altana's own valuation page and the
      Business Wire announcement both describe a $200M round at a $1B post-money valuation.
      That is still the most defensible headline valuation because it comes from the financing
      event itself rather than from a later secondary estimate.

      The company is still private, so the valuation story should be treated as a late-stage
      venture anchor rather than a continuously marked public-market price. That distinction
      matters because the true underwriting question is not whether Altana is a unicorn; it is
      how durable that unicorn status is versus the growth and liquidity narrative around it.
    claimRefs: [CV001, CV002, CV003, CV009]
    tableRefs: [TV001]
  - id: v2
    title: Secondary Market and Database Signals
    body: >-
      Secondary-market pages do not contradict the unicorn anchor, but they do introduce a spread
      in total capital raised and in the quality of the liquidity signal. Caplight models Altana
      as fair against peers and notes that it is quiet on financing cadence. Forge Global shows
      limited market activity and no public price, while Nasdaq Private Market says the stock does
      not trade on public exchanges.

      Seedtable and Silicon Valley Invest Club both reinforce the same idea: Altana looks like a
      sizable private company with active investor interest, but not one with a deep, liquid
      secondary market. That keeps valuation more narrative-driven than market-cleared.
    claimRefs: [CV004, CV005, CV006, CV007, CV011]
    tableRefs: [TV002]
  - id: v3
    title: Valuation Verdict and Sensitivity
    body: >-
      The valuation verdict is constructive but not fully de-risked. Altana has enough customer,
      product, and capital signal to justify a large private valuation, but the absence of public
      financials, liquidity, and retention data means the market still has to price the company
      off a small set of comparables and a lot of trust in the narrative.

      In practical terms, the most useful valuation sensitivity is whether the company can keep
      expanding the workflow surface while preserving trust and retention. If it can, the $1B
      anchor looks durable; if not, the valuation will depend increasingly on private market
      appetite rather than operating proof.
    claimRefs: [CV008, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
