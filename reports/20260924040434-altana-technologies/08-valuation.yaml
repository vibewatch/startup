      - [Product breadth expands, more workflow ownership, 'multiples stay premium', 'launch cadence']
      - [Liquidity remains thin, no public price discovery, 'valuation stays narrative-led', 'secondary volume']
      - [Customer concentration rises, top accounts dominate, 'valuation discount risk rises', 'top-10 mix']
      - [Public-market optionality appears, IPO or broader secondary liquidity, 'valuation becomes more markable', 'filings / trading']
    notes: 'Sensitivity is directional and intended for diligence, not as a formal pricing model.'
    claimRefs: [CV010, CV011, CV012]
