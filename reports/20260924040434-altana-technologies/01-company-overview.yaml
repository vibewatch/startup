company:
  name: Altana Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Altana Technologies is a New York-based AI supply-chain intelligence company that
    combines a product network, trade-compliance workflows, and federal/government sales
    motion into a single trusted-trade platform. The company remains private, still
    reports $1B valuation from its July 2024 Series C, and appears to be scaling into a
    larger product surface in 2026 through Product Passports and passport-manager launches.
sections:
  - id: identity-and-product
    title: Identity, Product, and Positioning
    body: >-
      Altana Technologies positions itself as the "network for trusted trade": an AI-powered
      product network that helps governments, logistics providers, and enterprises understand
      multi-tier supply chains, pre-validate trade flows, and improve compliance and resilience.
      The official company site and the 2024 Series C announcement both describe the core product
      as a federated knowledge graph / product network that maps buyer-supplier relationships and
      supports trade, compliance, sustainability, and risk workflows. Public hiring materials in
      2026 reinforce that the business spans government, platform engineering, and mission-critical
      trade operations rather than a narrow single-SKU SaaS product.

      The company is still private and does not publish financial statements. Public company-profile
      data and third-party databases agree that Altana is headquartered in New York, serves both
      enterprise and government customers, and remains in growth-stage scaling mode. The exact
      certification posture for FedRAMP / IC environments is not independently re-verified in the
      current refresh; the available evidence only confirms that the company hires for government-
      compliant, air-gapped, and compliance-constrained environments.
    claimRefs: [CO001, CO002, CO004, CO005, CO012]
    tableRefs: [TO001]
  - id: leadership-and-funding
    title: Leadership, Founding, and Funding
    body: >-
      Altana was founded by Evan Smith, Peter Swartz, and Raphael Tehranian. Public profile data
      also points to Ian Cadieu as CTO, while the company continues to hire aggressively across
      federal sales, customer delivery, and platform engineering. The current refresh does not show
      a major leadership shake-up, but it does show continued scaling of the commercial and technical
      organization as the company broadens its product surface.

      Financially, the clearest public anchor remains the July 2024 Series C: $200M at a $1B
      post-money valuation led by Thomas Tull's US Innovative Technology Fund with participation
      from March Capital, Generation Investment Management, Salesforce Ventures, and existing
      backers including GV, Activate Capital, Floating Point, and OMERS Ventures. Third-party
      database pages continue to place total capital raised around $322M and show no IPO listing.
      Nasdaq Private Market also indicates active private-share trading with a September 2026
      reference price.
    claimRefs: [CO003, CO006, CO007, CO011]
    tableRefs: [TO002]
  - id: scale-and-refresh-delta
    title: Scale, Customers, and 2026 Refresh Deltas
    body: >-
      The most visible 2026 refresh delta is product expansion around Product Passports and a
      passport manager. LeadIQ's current company profile says Altana launched Product Passports
      in May 2026 and introduced a passport manager in April 2026; the same profile also says
      Maersk is planning a rollout across 12 international ports representing about 70% of global
      trade. That is a meaningful go-to-market update because it shifts the story from broad trade
      visibility toward more specific workflow ownership around trusted shipment identity and
      customs preparation.

      Public customer references remain concentrated in high-value trade and government use cases:
      Maersk, US Customs and Border Protection, Boston Scientific, L.L.Bean, and UK government
      agencies appear in company materials and reporting. BuiltIn's company profile also claims
      Altana serves over 1,000 customers across multiple countries and three continents, but that
      figure is still best treated as company-claimed rather than independently verified. The
      company therefore looks scaled enough to matter, yet still opaque enough that customer count,
      ARR, burn, and contract concentration remain open diligence items.
    claimRefs: [CO008, CO009, CO010, CO005]
    tableRefs: [TO003]
    figureRefs: [FO001]
