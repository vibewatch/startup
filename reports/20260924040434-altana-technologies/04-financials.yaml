chapter:
  number: 4
  title: Financials
  summary: >-
    Altana remains a private, venture-backed company with a $1B July 2024 Series C anchor,
    but public financial disclosure is thin. Third-party databases disagree on cumulative
    funding, so the safest read is that Altana has raised roughly $322M-$344M and is still
    operating with enterprise-style, negotiated contracts rather than public SaaS pricing.
sections:
  - id: capital-structure
    title: Capital Structure and Funding History
    body: >-
      The clearest public financial anchor is the July 2024 Series C: Altana raised $200M at
      a $1B post-money valuation. Public databases then diverge on what to call the company's
      cumulative capital. Altana's own materials and several public summaries cluster near
      $322M, while Caplight's modeled company page shows $344.1M in total raised. Preqin's
      public preview is materially lower at $200M and should be treated as an incomplete,
      subscriber-gated snapshot rather than the best available total.

      The practical takeaway is that Altana has real venture depth, a large late-stage round,
      and no public listing. That supports continued private-company scaling but also means the
      company still has to manage runway, dilution, and follow-on capital without the discipline
      of public market disclosure.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: monetization-and-ops
    title: Monetization, Contracts, and Operating Model
    body: >-
      Public evidence points to a negotiated B2B model rather than a self-serve SaaS motion.
      Preqin describes subscription-based access with annual or multi-year contracts, which fits
      the product's government and enterprise use cases. That matters because contract value is
      likely tied to workflow scope, data depth, and implementation complexity more than to a
      posted seat price.

      The downside of that model is transparency. Altana does not disclose ARR, gross margin,
      or burn, and no public pricing page establishes a benchmark ACV. A mix of software,
      services, and customer-specific deployment work is plausible, but the gross-margin shape
      remains unverified. In diligence terms, Altana looks like a scaled private platform with
      strong strategic capital support, not a clean recurring-revenue SaaS business with public
      metrics.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial Verdict and Open Questions
    body: >-
      The capital story is constructive: a $1B Series C, multiple strategic and financial
      backers, and enough headcount to imply a meaningful operating footprint. The main
      uncertainty is not whether Altana has raised capital, but how efficiently it converts
      that capital into durable revenue. The company's pricing, customer concentration, and
      contract duration are still opaque, so the next diligence step is less about funding size
      and more about revenue quality.

      On a refresh basis, the posture is stable to improving rather than weakening. Nothing in
      the public record suggests distress, but the absence of public financial statements means
      investors and counterparties still have to infer economics from capital markets signals,
      hiring, customer references, and product launches.
    claimRefs: [CI009, CI010, CI011, CI012]
    figureRefs: [FI001]
