      - number: '8.2'
        title: Secondary Market and Database Signals
        blocks:
          - type: paragraph
            body: >-
              Secondary-market pages do not contradict the unicorn anchor, but they do introduce a spread in total
              capital raised and in the quality of the liquidity signal. Caplight models Altana as fair against peers
              and notes that it is quiet on financing cadence. Forge Global shows limited market activity and no public
              price, while Nasdaq Private Market says the stock does not trade on public exchanges.

              Seedtable and Silicon Valley Invest Club both reinforce the same idea: Altana looks like a sizable private
              company with active investor interest, but not one with a deep, liquid secondary market. That keeps
              valuation more narrative-driven than market-cleared.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: Valuation Verdict and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              The valuation verdict is constructive but not fully de-risked. Altana has enough customer, product, and
              capital signal to justify a large private valuation, but the absence of public financials, liquidity, and
              retention data means the market still has to price the company off a small set of comparables and a lot of
              trust in the narrative.

              In practical terms, the most useful valuation sensitivity is whether the company can keep expanding the
              workflow surface while preserving trust and retention. If it can, the $1B anchor looks durable; if not,
              the valuation will depend increasingly on private market appetite rather than operating proof.
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
