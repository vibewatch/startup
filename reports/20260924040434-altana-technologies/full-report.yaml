  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Primary Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              The clearest anchor remains the July 2024 Series C: Altana's own valuation page and the Business Wire
              announcement both describe a $200M round at a $1B post-money valuation. That is still the most defensible
              headline valuation because it comes from the financing event itself rather than from a later secondary
              estimate.

              The company is still private, so the valuation story should be treated as a late-stage venture anchor
              rather than a continuously marked public-market price. That distinction matters because the true
              underwriting question is not whether Altana is a unicorn; it is how durable that unicorn status is versus
              the growth and liquidity narrative around it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
