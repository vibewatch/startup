        title: Adoption Signals and Workflow Depth
        blocks:
          - type: paragraph
            body: >-
              Altana's hiring signals show that customers do more than consume dashboards. Sales-engineer and
              technical-account roles ask the company to turn platform output into briefings, customer analysis, and
              adoption work. That implies the product lives inside active workflows where the customer needs help
              operationalizing the data, not simply viewing it.

              The company also appears to use proof-point customers as trust anchors: the product story repeatedly
              mentions customs authorities, multinational enterprises, and regulated manufacturers. That combination
              suggests a high-touch sales motion and a relatively expensive customer acquisition model, but also a
              strong fit for mission-critical workflows.
