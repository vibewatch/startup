              - CI004
              - CI010
      - number: '4.2'
        title: Monetization, Contracts, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a negotiated B2B model rather than a self-serve SaaS motion. Preqin describes
              subscription-based access with annual or multi-year contracts, which fits the product's government and
              enterprise use cases. That matters because contract value is likely tied to workflow scope, data depth,
              and implementation complexity more than to a posted seat price.

              The downside of that model is transparency. Altana does not disclose ARR, gross margin, or burn, and no
              public pricing page establishes a benchmark ACV. A mix of software, services, and customer-specific
              deployment work is plausible, but the gross-margin shape remains unverified. In diligence terms, Altana
              looks like a scaled private platform with strong strategic capital support, not a clean recurring-revenue
              SaaS business with public metrics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Financial Verdict and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The capital story is constructive: a $1B Series C, multiple strategic and financial backers, and enough
              headcount to imply a meaningful operating footprint. The main uncertainty is not whether Altana has raised
              capital, but how efficiently it converts that capital into durable revenue. The company's pricing,
              customer concentration, and contract duration are still opaque, so the next diligence step is less about
              funding size and more about revenue quality.

              On a refresh basis, the posture is stable to improving rather than weakening. Nothing in the public record
              suggests distress, but the absence of public financial statements means investors and counterparties still
              have to infer economics from capital markets signals, hiring, customer references, and product launches.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
