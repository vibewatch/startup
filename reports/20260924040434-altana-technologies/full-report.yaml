      - number: '7.3'
        title: Transparency, Competition, and Delivery Risk
        blocks:
          - type: paragraph
            body: >-
              Altana is still opaque on core operating metrics, so diligence has to infer much of the risk profile from
              hiring, launches, and market pages. The public market also remains competitive: point tools, ERP add-ons,
              and trust/compliance suites can still win deals when speed, bundle economics, or procurement convenience
              matter more than network depth.

              The final execution risk is delivery quality. The platform engineering and technical account roles make
              clear that Altana must support both commercial and government-compliant deployments. If implementation is
              slow or governance is inconsistent, the moat weakens. A second-order risk is that product breadth grows
              faster than documentation, testing, and support capacity, which would show up first as customer friction
              rather than headline churn or a support backlog.
