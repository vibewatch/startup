companyProfile:
  summary: >-
    Altana Technologies is a New York-based private software company building an AI-powered trusted-trade network for
    governments, logistics providers, and enterprises. The company combines a buyer-supplier knowledge graph, compliance
    workflows, customs automation, and tariff planning into a single platform. It raised a $200M Series C in July 2024
    at a $1B valuation and has since added Cervo AI to broaden customs-entry automation. Public evidence points to a
    roughly 300-person organization with strong traction in trade and government workflows, but private financials
    remain undisclosed.
  foundedDate: '2019-01-01'
  founders:
    - name: Evan Smith
      role: CEO & Co-Founder
      background: Former tech executive and public face of Altana's trusted-trade thesis.
      claimRefs:
        - CO003
    - name: Peter Swartz
      role: CSO & Co-Founder
      background: Leads the knowledge-graph and applied AI narrative.
      claimRefs:
        - CO003
    - name: Raphael Tehranian
      role: COO & Co-Founder
      background: Runs operations and scaling execution.
      claimRefs:
        - CO003
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: >-
    Altana sells an AI product network / knowledge graph for trusted trade that supports supply-chain intelligence,
    compliance, tariff planning, customs workflows, and government use cases.
  customerFocus: >-
    Large enterprises, logistics providers, and government agencies involved in trade, customs, compliance, and
    supply-chain risk management.
  businessModel: Annual enterprise software subscriptions, government contracts, and implementation / professional services.
  stage: Series C
  fundingStatus: $200M Series C in July 2024 at a $1B valuation; total capital raised around $322M across seed through Series C.
