        blocks:
          - type: paragraph
            body: >-
              Altana Atlas is described across official pages as a federated knowledge graph that maps buyer-supplier
              relationships across the supply chain. In 2026, the company added Product Passports and a passport
              manager, which pushes the platform toward a more explicit record and workflow model for product identity,
              documentation, and clearance.

              The July 2024 Cervo-style expansion and 2026 customs-entry automation messaging suggest the company is
              moving from analysis into execution: draft the customs entry, assemble the record, and help the customer
              act faster. That shift matters because it turns the data network into a workflow engine.
