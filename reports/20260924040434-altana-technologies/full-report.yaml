chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Positioning
        blocks:
          - type: paragraph
            body: >-
              Altana Technologies positions itself as the "network for trusted trade": an AI-powered product network
              that helps governments, logistics providers, and enterprises understand multi-tier supply chains,
              pre-validate trade flows, and improve compliance and resilience. The official company site and the 2024
              Series C announcement both describe the core product as a federated knowledge graph / product network that
              maps buyer-supplier relationships and supports trade, compliance, sustainability, and risk workflows.
              Public hiring materials in 2026 reinforce that the business spans government, platform engineering, and
              mission-critical trade operations rather than a narrow single-SKU SaaS product.

              The company is still private and does not publish financial statements. Public company-profile data and
              third-party databases agree that Altana is headquartered in New York, serves both enterprise and
              government customers, and remains in growth-stage scaling mode. The exact certification posture for
              FedRAMP / IC environments is not independently re-verified in the current refresh; the available evidence
              only confirms that the company hires for government- compliant, air-gapped, and compliance-constrained
              environments.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO008
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, Founding, and Funding
        blocks:
          - type: paragraph
            body: >-
              Altana was founded by Evan Smith, Peter Swartz, and Raphael Tehranian. Public profile data also points to
              Ian Cadieu as CTO, while the company continues to hire aggressively across federal sales, customer
              delivery, and platform engineering. The current refresh does not show a major leadership shake-up, but it
              does show continued scaling of the commercial and technical organization as the company broadens its
              product surface.

              Financially, the clearest public anchor remains the July 2024 Series C: $200M at a $1B post-money
              valuation led by Thomas Tull's US Innovative Technology Fund with participation from March Capital,
              Generation Investment Management, Salesforce Ventures, and existing backers including GV, Activate
              Capital, Floating Point, and OMERS Ventures. Third-party database pages continue to place total capital
              raised around $322M and show no IPO listing. Nasdaq Private Market also indicates active private-share
              trading with a September 2026 reference price.
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
      - number: '1.3'
        title: Scale, Customers, and 2026 Refresh Deltas
        blocks:
          - type: paragraph
            body: >-
              The most visible 2026 refresh delta is product expansion around Product Passports and a passport manager.
              LeadIQ's current company profile says Altana launched Product Passports in May 2026 and introduced a
              passport manager in April 2026; the same profile also says Maersk is planning a rollout across 12
              international ports representing about 70% of global trade. That is a meaningful go-to-market update
              because it shifts the story from broad trade visibility toward more specific workflow ownership around
              trusted shipment identity and customs preparation.

              Public customer references remain concentrated in high-value trade and government use cases: Maersk, US
              Customs and Border Protection, Boston Scientific, L.L.Bean, and UK government agencies appear in company
              materials and reporting. BuiltIn's company profile also claims Altana serves over 1,000 customers across
              multiple countries and three continents, but that figure is still best treated as company-claimed rather
              than independently verified. The company therefore looks scaled enough to matter, yet still opaque enough
              that customer count, ARR, burn, and contract concentration remain open diligence items.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO005
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: figure
            figureRef: FO001
            claimRefs: []
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Altana is best understood as a workflow and data-infrastructure business, not a generic ERP or visibility
              vendor. Its market boundary includes trade compliance, customs entry automation, product-passport
              infrastructure, supply-chain intelligence, and tariff planning. The natural substitutes are manual
              brokerage, in-house trade ops teams, ERP add-ons, and point solutions that cover only one slice of the
              workflow.

              Public materials and hiring pages show that the buying motion spans both enterprise and government users.
              That matters because budget ownership is split: trade/compliance teams pay for operational use cases,
              while government agencies and logistics partners can create institutional adoption that widens the network
              effect.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Demand Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Three demand forces stand out. First, tariff and trade-policy volatility increases the value of scenario
              planning and customs automation. Second, governments and logistics networks want more trusted shipment
              identity and pre-clearance workflows, which makes product-passport style infrastructure attractive. Third,
              Altana's customer references suggest that enterprises with complex cross-border supply chains already have
              a reason to buy before the broader market fully standardizes.

              The main adoption constraints are implementation complexity, cross-functional change management, and
              procurement friction. The product touches trade, compliance, operations, security, and data teams, so the
              sale is not a lightweight self-serve motion. That limits the speed of adoption even when the pain is real.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM012
      - number: '2.3'
        title: Sizing Lenses and Buyer Map
        blocks:
          - type: paragraph
            body: >-
              The best public evidence supports multiple sizing lenses rather than one hard TAM number. One lens is
              customs-brokerage and trade-compliance workflow spend; another is enterprise supply-chain software and
              data-infrastructure spend; a third is government modernization and trusted-trade infrastructure. Each lens
              is large enough to matter, but none is cleanly isolated from public data.

              On the buyer side, the strongest fit is large importers, logistics providers, and customs agencies that
              already manage multi-tier networks. Altana's named customer set and 2026 product launches suggest that the
              company is trying to own a narrow wedge first and then expand into adjacent workflow layers.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs: []
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Altana's direct competition is not a single named vendor. Buyers can solve the same job with manual
              brokerage, ERP extensions, visibility platforms, customs-entry automation, or broader enterprise trust
              software. Public comparison pages and Altana's own materials suggest that the nearest alternatives include
              logistics software, customs workflow tools, and trust / compliance suites rather than one clean peer set.

              The market is therefore fragmented. That fragmentation helps Altana because the buyer often needs multiple
              capabilities at once, but it also makes the competitive threat more durable: incumbents can copy one wedge
              at a time, especially if they already own the customer relationship.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: Capability, Pricing, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Altana's differentiator is not the cheapest point solution. It is the combination of multi-tier network
              data, trade workflow automation, and government-grade trust signals. By contrast, adjacent vendors usually
              win on one axis: logistics execution, brokerage workflow, compliance modules, or broader enterprise
              distribution. That means Altana must keep expanding the platform while defending against suites that
              bundle similar features.

              Pricing evidence is thin across the category. Most public pages either hide pricing or provide only
              indirect evidence, which makes it hard to benchmark realized ACV. That opacity is itself a signal that the
              market is still in negotiated enterprise-sales mode rather than a mature commodity SaaS market.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Moat Durability and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on network effects, proprietary shipment and buyer-supplier data, and institutional
              relationships with customs / government workflows. Those are real, but they are not unassailable. ERP
              vendors and supply-chain platforms can add adjacent features, and customers can multi-home if the workflow
              remains modular.

              The strongest adverse signal is that Altana must keep proving measurable workflow value against more
              established distribution machines. If implementation drag is high or if customer teams treat the platform
              as a one-off compliance tool instead of a network layer, switching costs stay weaker than the bullish
              narrative suggests.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
