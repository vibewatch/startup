  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Government, and Trust Dependence
        blocks:
          - type: paragraph
            body: >-
              The company sells into trade, customs, defense, and economic-security workflows, which means the product
              is tied to government procurement cycles, compliance scrutiny, and changing policy environments. That
              concentration creates a real moat, but it also means that regulatory changes, procurement delays, or
              certification gaps can affect revenue conversion and expansion.

              Public signals also suggest Altana is increasingly relevant in cross-border government partnerships,
              including customs-adjacent programs and public-sector adoption. That is a strength, but it also raises the
              bar for security, auditability, and deployment discipline.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
