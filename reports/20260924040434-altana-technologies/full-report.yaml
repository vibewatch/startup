  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Workflow Scope
        blocks:
          - type: paragraph
            body: >-
              Altana presents itself as "the network for trusted trade" and describes its AI-powered product network as
              a way for governments and businesses to keep trade flowing while improving resilience and security. The
              current public product story is not just generic visibility: it spans supply-chain intelligence, customs
              and trade workflows, and decision support for importers, logistics providers, and compliance teams. That
              makes the product surface more like an operational network layer than a simple dashboard.

              Public job descriptions reinforce the same view. Altana is hiring people who can turn domain complexity
              into practical workflow value, which is a strong signal that the core product problem is not data display
              alone but translating trade data into action.
