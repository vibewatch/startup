  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital Structure and Funding History
        blocks:
          - type: paragraph
            body: >-
              The clearest public financial anchor is the July 2024 Series C: Altana raised $200M at a $1B post-money
              valuation. Public databases then diverge on what to call the company's cumulative capital. Altana's own
              materials and several public summaries cluster near $322M, while Caplight's modeled company page shows
              $344.1M in total raised. Preqin's public preview is materially lower at $200M and should be treated as an
              incomplete, subscriber-gated snapshot rather than the best available total.

              The practical takeaway is that Altana has real venture depth, a large late-stage round, and no public
              listing. That supports continued private-company scaling but also means the company still has to manage
              runway, dilution, and follow-on capital without the discipline of public market disclosure.
            claimRefs:
