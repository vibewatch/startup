  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named Customers and Segmentation
        blocks:
          - type: paragraph
            body: >-
              The public customer set is anchored by trade-intensive enterprises and public-sector agencies. Business
              Wire's July 2024 Series C announcement names Maersk, Boston Scientific, L.L.Bean, US Customs and Border
              Protection, and UK government agencies as live customers. Earlier and later company materials describe a
              similar pattern: multinational enterprises, customs authorities, logistics providers, and regulated
              industries that care about cross- border visibility and compliance.

              This is not a self-serve SMB motion. The buyer is typically a trade, compliance, logistics, or government
              mission leader who needs cross-functional adoption. Public sources still do not provide a clean customer
              roster or revenue-by-vertical split, so the segmentation here is reconstructed from announcements and role
              descriptions rather than a disclosed CRM export.
