      - number: '6.3'
        title: Retention, Concentration, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The main customer diligence gap is durability. Altana does not publicly disclose renewal rates, gross
              revenue retention, net revenue retention, or customer concentration. Forge Global's secondary-market page
              shows the company is still private and market activity is limited, which reinforces the idea that customer
              economics are still opaque rather than fully mature.

              The public record therefore supports a constructive adoption story, but not yet a fully underwritten
              retention story. The right next questions are not whether the company has logos, but how sticky the logos
              are, how concentrated the top accounts are, and how much of the platform becomes embedded in daily trade
              operations.
