              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Customer and Product Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The biggest commercial risk is that the company must keep proving durable value to a small set of large
              accounts. Altana's customer story is strong on named logos, but weak on public retention metrics. In
              practice, that means the company has to win renewals, avoid one-off pilot behavior, and keep the product
              embedded in daily trade operations.

              Product execution is also a risk because the platform is still being expanded via product passports,
              passport management, and customs automation. Those launches improve the story, but they also broaden the
              surface area that must work reliably in regulated environments.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
