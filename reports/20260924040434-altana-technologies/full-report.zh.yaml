        title: 财务尽调定论与核心追问
        blocks:
          - type: paragraph
            body: >-
              资本基础稳健：Series C 投后估值达
              $1B，投资方包括多家战略和财务投资机构，员工规模也显示公司已有一定经营体量。关键不确定性不在于能否融资，而在于能否高效地把资金转化为可持续收入。产品定价、核心客户集中度和合同期限仍不清楚，下一步尽调应从融资规模转向收入质量。

              本次更新显示，公司整体稳定、略有改善，未见走弱迹象。公开记录没有显示经营困境；但由于缺少公开财务报表，投资方和合作伙伴仍只能从融资动态、招聘、客户案例和产品发布等线索推断其经营状况。
