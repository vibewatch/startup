      - number: '5.3'
        title: 工程技术架构与技术隐患
        blocks:
          - type: paragraph
            body: >-
              Altana 的工程岗位显示，其平台团队覆盖云基础设施、开发者体验、SRE、DevSecOps 和 CI/CD，并采用 AI-first、Agent-first 的工作方式。平台工程岗位称，公司正围绕 AI
              编程工具和自主 Agent 重组软件开发生命周期（SDLC），将它们纳入研发流程的核心环节；这也说明公司希望用 AI 辅助软件交付。

              风险在于，公开资料很少披露实际架构、API 范围、安全认证或模型治理机制。因此，目前对其技术壁垒的判断主要来自招聘信息和产品叙事，缺少系统性官方技术文档的验证。
            claimRefs:
