  - number: 7
    title: 核心风险与挑战
    sections:
      - number: '7.1'
        title: 监管合规、政务依赖与信誉绑定风险
        blocks:
          - type: paragraph
            body: |-
              Altana 深入贸易通关、国防和经济安全工作流，业务因此受政府采购周期、合规审查和政策变化影响。这种集中度确实形成门槛，但政策转向、采购延期或认证缺口也可能拖慢订单转化和业务扩张。
              公开信息还显示，Altana 正更多参与跨境政府合作，包括海关相关项目和公共部门部署。这是竞争优势，也提高了对数据安全、审计能力和交付纪律的要求。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: 客群黏性与产品交付执行风险
        blocks:
          - type: paragraph
            body: |-
              最大的商业风险是，Altana 必须持续向少数大型客户证明长期价值。虽然客户名单亮眼，但公开资料没有留存指标。公司必须争取续约、避免项目止步于一次性试点，并让产品融入客户日常贸易运营。
              产品交付也面临考验：平台正在扩展产品护照、护照管理系统和报关自动化等业务。这些发布让产品叙事更完整，但也扩大了必须在强监管环境中稳定运行的产品范围。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
      - number: '7.3'
        title: 财务透明度、存量竞争与实施交付风险
        blocks:
          - type: paragraph
            body: >-
              Altana 仍未披露核心经营指标，尽调只能从招聘、新品发布和行业信息推断风险。同时，竞争压力不减：如果客户更看重上线速度、打包价格或采购便利，而非网络深度，单点工具、ERP
              扩展模块和信任／合规套件仍可能赢得订单。

              最后一项执行风险是交付质量。平台工程和技术客户经理岗位显示，Altana
              必须同时支持商业客户和政府合规部署。如果实施缓慢或治理标准不一致，护城河就会变弱。另一个次级风险是产品扩张快于文档、测试和支持能力；这种问题可能先表现为客户摩擦，而非明显的客户流失或支持积压。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
