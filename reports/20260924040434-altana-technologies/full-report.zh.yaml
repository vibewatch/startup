  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界界定与替代方案
        blocks:
          - type: paragraph
            body: >-
              Altana 更像工作流和数据基础设施公司，而非通用 ERP
              或物流可视化软件厂商。其业务涉及贸易合规、报关单录入自动化、产品护照基础设施、供应链情报和关税规划。可替代方案包括人工报关服务、企业内部关务团队、ERP 扩展模块，以及只覆盖部分工作流的垂直工具。

              公司资料和招聘信息显示，企业和政府都可能成为买方。预算来源分成两路：贸易与合规团队为日常运营买单，政府机构和物流伙伴则可能推动机构层面的采用，扩大网络效应。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: 需求驱动引擎与落地采纳阻力
        blocks:
          - type: paragraph
            body: >-
              三股力量正在拉动需求。第一，关税和贸易政策波动，提升了情景规划与报关自动化的价值。             
              第二，政府和物流网络需要更可信的货物身份核验与预清关流程，这让产品护照类基础设施更具吸引力。第三，Altana 的客户案例显示，拥有复杂跨境供应链的企业在全行业标准统一前就有采购理由。

              采用门槛主要来自实施复杂、跨部门变革成本高，以及政企采购流程漫长。产品牵涉贸易、合规、运营、安全和数据团队，销售过程并非轻量的自助订阅。即使客户确有痛点，部署速度仍会受这些因素限制。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM012
      - number: '2.3'
        title: 市场规模测算视角与买方画像
        blocks:
          - type: paragraph
            body: >-
              现有公开资料不足以给出单一、确切的 TAM
              数字，更适合从多个口径估算：报关和贸易合规工作流支出、企业供应链软件与数据基础设施投入，以及政府系统现代化和可信贸易基础设施采购。每个口径都对应可观的市场，但公开数据无法将它们准确拆分。

              最匹配的买方是管理多层网络的大型进口商、物流服务商和海关机构。结合已披露的客户和 2026 年产品发布，Altana 似乎想先拿下一个较窄的切入口，再拓展到相邻工作流。
