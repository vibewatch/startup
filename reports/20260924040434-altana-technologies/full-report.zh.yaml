  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景与替代品格局
        blocks:
          - type: paragraph
            body: >-
              Altana 并没有一个明确的单一直接对手。买方也可以用人工报关服务、ERP 扩展模块、物流可视化平台、报关录入自动化工具或更广泛的企业信任软件解决类似问题。公开竞品资料和 Altana
              官方信息显示，最接近的替代方案分散在物流软件、报关工作流工具和信任／合规套件中，并无边界清晰的同类厂商群。

              市场因此相当分散，买方往往需要多项能力，这给了 Altana 整合交付的机会；但竞争威胁也更持久。已有客户关系的老牌厂商可以一次复制一个功能切口，逐步跟进。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 产品能力、定价模式与分销渠道
        blocks:
          - type: paragraph
            body: >-
              Altana
              的差异化不在于提供最便宜的单点工具，而在于把多层供应链数据、贸易工作流自动化和政府级信任背书结合起来。相邻厂商通常只在一个环节占优：物流执行、报关流程、合规模块，或更广泛的企业分销渠道。因此，Altana
              必须继续扩展平台能力，同时应对套件厂商捆绑销售的竞争。

              整个行业的定价信息都很有限。多数公开页面没有报价，或只提供间接线索，因此难以对照实际 ACV。这种不透明也说明，市场仍以协商式企业销售为主，尚未成熟为标准化、商品化的 SaaS 市场。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 护城河深浅与负面潜在信号
        blocks:
          - type: paragraph
            body: >-
              Altana 的护城河主要靠网络效应、专有货运数据和买家—供应商数据，以及与海关和政府工作流建立的制度性关系。这些优势确实存在，却并非不可攻破。ERP
              厂商和成熟供应链平台都能增加相邻功能；只要工作流仍可拆分，客户就可能同时使用多家供应商。

              最值得警惕的是，面对渠道更强的老牌厂商，Altana 必须持续证明能带来可量化的业务价值。如果实施迟缓，或客户只把平台当作一次性合规工具，而非网络基础层，实际转换成本就会低于乐观叙事所暗示的水平。
