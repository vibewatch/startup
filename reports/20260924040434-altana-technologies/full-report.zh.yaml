      - number: '1.2'
        title: 创始团队、高管阵容与融资历程
        blocks:
          - type: paragraph
            body: >-
              Altana 由 Evan Smith、Peter Swartz 和 Raphael Tehranian 联合创立。公开资料显示 Ian Cadieu 担任
              CTO；公司也在联邦销售、客户交付和平台工程等岗位积极招人。本次更新未发现核心管理层重大变动，但随着产品范围扩大，商务和技术团队仍在扩充。

              融资方面，最明确的公开基准是 2024 年 7 月的 Series C：融资 $200M，投后估值 $1B，由 Thomas Tull 旗下的 US Innovative Technology Fund
              领投，March Capital、Generation Investment Management、Salesforce Ventures 及老股东 GV、Activate Capital、Floating
              Point、OMERS Ventures 跟投。第三方数据库显示，累计融资约 $322M，公司尚未 IPO。Nasdaq Private Market 也显示其非公开股权交易仍活跃，并给出 2026 年 9
              月的参考价格。
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
      - number: '1.3'
        title: 业务规模、客群基础与2026年核心增量
        blocks:
          - type: paragraph
            body: >-
              2026 年最显著的产品扩展，是推出产品护照（Product Passports）和护照管理系统（passport manager）。LeadIQ 最新企业档案称，Altana 于 2026 年 5 月推出
              Product Passports，并于 2026 年 4 月上线护照管理系统；档案还称 Maersk 计划在 12 个国际港口部署，覆盖全球约 70% 的贸易量。这项更新推动 Altana
              从泛供应链可视化，进一步切入货物身份核验和通关准备等具体工作流。

              已公开的客户集中在高价值跨境贸易和政府关键业务：Maersk、US CBP（美国海关及边境保卫局）、Boston Scientific、L.L.Bean 和英国政府机构均见于公司通稿和媒体报道。BuiltIn
              企业简介称，Altana 的业务覆盖三大洲的多个国家，服务超过 1,000 家客户；这一数字目前只能视为公司自述，尚无第三方独立核实。Altana
              已有一定业务规模和行业知名度，但信息透明度有限，实际客户数、ARR、烧钱额和大客户集中度仍待尽调确认。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO005
