      - number: '4.2'
        title: 商业变现、合同结构与商业模式
        blocks:
          - type: paragraph
            body: >-
              公开信息显示，Altana 采用协商式 B2B 模式，而非自助 SaaS。Preqin
              记载其按年或多年签订订阅合同，这与政府和大型企业客户的使用场景相符。合同金额可能更多取决于工作流覆盖范围、数据深度和实施复杂度，而非公开标价的软件席位费。

              这种模式的代价是财务透明度低。Altana 从未公开披露 ARR、毛利率或烧钱额，也没有公开报价可用来对照
              ACV。收入可能来自软件授权、专业服务和定制部署等多项业务，但实际毛利率结构尚未验证。尽调视角下，Altana 更像一家有战略资本支持、已具一定规模的未上市平台，而非指标透明的纯订阅 SaaS 公司。
            claimRefs:
