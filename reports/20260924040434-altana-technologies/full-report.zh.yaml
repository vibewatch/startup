  - number: 8
    title: 估值分析与定价锚点
    sections:
      - number: '8.1'
        title: 核心估值基准与参考锚点
        blocks:
          - type: paragraph
            body: >-
              最明确的估值基准仍是 2024 年 7 月的 Series C：Altana 官方估值页面和 Business Wire 通稿都披露，该轮融资额为 $200M，投后估值为
              $1B。这一估值来自实际融资交割，而非之后的二级市场估算，因此仍是最有依据的公开基准。

              公司仍未上市，因此这一估值只是后期风险投资的静态参照，不能等同于公开市场持续交易形成的价格。关键不在于 Altana 是否已是独角兽，而在于随着增长和流动性预期接受检验，这一估值能否站稳。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: 二级股权市场与第三方数据库信号
        blocks:
          - type: paragraph
            body: >-
              二级市场资料并未推翻独角兽估值基准，但对累计融资额和流动性信号的呈现并不一致。Caplight 认为 Altana 相对同业估值合理，同时指出融资动态较少。Forge Global
              显示交易活动有限，也没有公开价格；Nasdaq Private Market 则注明该股票未在公开交易所交易。

              Seedtable 和 Silicon Valley Invest Club 的数据也指向相似结论：Altana
              是一家有一定规模、受到投资者关注的未上市公司，但并没有深度、流动的二级市场。因此，其估值更多由战略叙事驱动，而非市场交易定价。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: 估值结论与敏感性研判
        blocks:
          - type: paragraph
            body: >-
              估值判断偏积极，但下行风险尚未充分消化。Altana
              的客户、产品和资本基础足以支撑较高的非公开估值；但由于缺少公开财务数据、二级市场流动性和核心留存指标，市场仍只能参考少数可比公司，并高度依赖对公司叙事的信任来定价。

              估值最敏感的变量是：Altana 能否在拓展工作流的同时，守住政府和企业客户的信任与留存。若能做到，$1B 估值基准仍有支撑；若不能，估值就会越来越依赖一级市场风险偏好，而非经营表现。
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs: []
