  - number: 6
    title: 客群结构与客户验证
    sections:
      - number: '6.1'
        title: 公开代表客户与客群分层
        blocks:
          - type: paragraph
            body: >-
              公开客户以贸易密集型企业和公共部门机构为主。Business Wire 2024 年 7 月的 Series C 通稿称，Maersk、Boston Scientific、L.L.Bean、US
              CBP（美国海关及边境保卫局）和英国政府机构都是在用客户。此前和此后的公司材料也呈现出类似结构：跨国企业、海关机构、物流服务商，以及对跨境可视性和合规要求严格的受监管行业。

              这不是面向中小企业的自助 SaaS
              模式。买方通常是贸易、合规或物流负责人，或政府项目负责人；他们需要推动跨部门采用。公开资料仍未提供完整客户名单或分行业收入，因此这里的客群划分是根据公司公告和岗位描述重构，而非来自公司披露的 CRM 数据。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
          - type: table
            tableRef: TU001
