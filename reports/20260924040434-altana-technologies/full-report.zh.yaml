              - CU008
      - number: '6.2'
        title: 实际采纳信号与业务流嵌入力度
        blocks:
          - type: paragraph
            body: |-
              招聘信息显示，客户不只是用系统看报表。售前方案架构师和技术客户经理需要把平台洞察转化为管理层简报、定制分析，并推动客户采用产品。这说明产品进入了实际工作流程，客户需要把数据用于行动，而不只是浏览。
              公司也常以标杆客户建立信任，产品叙事反复提及海关机构、跨国企业和受监管制造商。这类客户往往需要高接触、深度服务的销售方式，获客成本也相对较高；产品也适合关键任务型工作流。
            claimRefs:
              - CU004
