  - number: 4
    title: 财务状况分析
    sections:
      - number: '4.1'
        title: 股权资本结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开融资基准是 2024 年 7 月的 Series C：Altana 以 $1B 投后估值融资 $200M。各数据库对累计融资额的统计略有出入：Altana 官方资料和多份公开综述大多指向约
              $322M，Caplight 建模页面显示总融资额为 $344.1M，Preqin 公开预览则仅显示 $200M。后者可能只是受订阅权限限制的不完整数据，不宜视为最完整的融资总额。

              总体来看，Altana 获得了充足的风险投资支持，也完成了大额后期融资，但仍未上市。这为其继续扩张提供资金，也意味着管理层必须在没有公开市场披露约束的情况下，平衡现金跑道、股权稀释和后续融资节奏。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
