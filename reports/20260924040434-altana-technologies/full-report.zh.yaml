companyProfile:
  summary: >-
    Altana Technologies 是一家总部位于纽约的未上市软件公司，为政府、物流服务商和企业搭建 AI 驱动的可信贸易网络。平台把买家—供应商知识图谱、合规工作流、报关自动化和关税规划整合在一起。公司于 2024 年 7
    月以 $1B 投后估值完成 $200M Series C 融资，之后收购 Cervo AI，拓展报关单录入自动化。公开信息显示，公司约有 300 名员工，在贸易和政府工作流中已有较强进展；但财务数据仍未公开。
