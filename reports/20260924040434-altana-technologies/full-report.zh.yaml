      - number: '6.3'
        title: 留存表现、客户集中度与尽调核心缺口
        blocks:
          - type: paragraph
            body: >-
              客户尽调的主要缺口是留存表现。Altana 从未公开续约率、GRR（毛收入留存率）、NRR（净收入留存率）或客户集中度。Forge Global
              的二级市场页面显示，公司仍未上市，股权交易也很少，进一步说明客户经济性仍不透明。

              公开资料支持客户拓展势头良好的判断，但还不足以证明长期留存表现。下一步尽调不应只看客户 Logo，而要确认这些客户是否持续使用、头部账户收入占比，以及平台在多大程度上嵌入日常贸易运营。
            claimRefs:
              - CU009
