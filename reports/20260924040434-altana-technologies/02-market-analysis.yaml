      - [Logistics providers, brokerage / ops, brokers, company, entry automation, operations, throughput / margin pressure]
      - [Government agencies, mission owners, case workers, public sector, trusted-trade coordination, procurement / mission, modernization mandate]
      - [Manufacturers, supply-chain / sourcing, planners, enterprise, supplier mapping, supply chain, resilience / sourcing risk]
      - [Retailers, import compliance, planners, enterprise, duty optimization, finance, margin pressure]
      - [Pharma and regulated goods, compliance / quality, analysts, enterprise, provenance and auditability, regulatory, enforcement pressure]
      - [Partner networks, joint programs, account teams, partner-funded, network onboarding, partnership, ecosystem expansion]
      - [Trade consultancies, advisory leads, analysts, client-funded, scenario planning, services, customer demand]
      - [Customs brokers, brokerage leads, operators, firm / client, entry automation, brokerage P&L, labor bottlenecks]
      - [Air-gap / compliance constrained buyers, security and infra, engineers, enterprise / public sector, secure deployment, security, certification or procurement hurdle]
    notes: 'Buyer ownership is split across trade, operations, finance, and security; that is why the sale is slower but stickier.'
    claimRefs: [CM001, CM002, CM004, CM008]
