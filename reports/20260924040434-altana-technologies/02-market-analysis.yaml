    title: Market Definition Table
    columns: [Segment, Included Spend, Excluded Spend, Buyer / Payer, Relevance, Notes]
    rows:
      - [Trade compliance software, customs rules and screening, manual brokerage replacement, trade teams, core, 'Often budgeted as operations and compliance']
      - [Customs entry automation, item classification and clearance workflows, generic ERP licenses, customs brokers and importers, core, 'Most direct workflow wedge']
      - [Supply-chain intelligence, multi-tier network mapping, generic BI tools, ops / compliance teams, core, 'Broadens into network visibility']
      - [Product-passport infrastructure, provenance and identity workflow, consumer-brand CRM, government and logistics networks, adjacent, 'Network effects matter more here']
      - [Tariff scenario planning, duty exposure analysis, spreadsheet modeling, finance / trade teams, adjacent, 'Triggered by policy volatility']
      - [Government trusted-trade programs, pre-clearance collaboration, standalone customs software, agencies and procurement, core, 'Institutional budget owner is public sector']
      - [Manual brokerage labor, in-house customs ops, outsourced brokerage fees, enterprise importers, substitute, 'Incumbent status quo']
      - [ERP add-ons, limited compliance modules, full network platform, finance / operations, substitute, 'Common incumbent extension']
      - [Visibility-only software, shipment tracking and dashboards, workflow automation, logistics / supply chain, substitute, 'Does not close the loop']
      - [Data-infrastructure layer, buyer-supplier graph and network effects, point solutions, enterprises / governments, core, 'Strategic long-term layer']
    notes: 'Included and excluded spend are qualitative boundaries; public sources do not isolate one exact TAM.'
    claimRefs: [CM001, CM002, CM009]
  - id: TM002
    title: Sizing Lens Table
    columns: [Lens, What It Captures, Confidence, Limitation]
    rows:
      - [Customs-workflow spend, brokerage and compliance automation, medium, 'Public spend is fragmented across software, services, and labor']
      - [Trade-compliance software, rules engines and screening tools, medium, 'Does not include service-heavy implementation']
      - [Supply-chain intelligence, network visibility and analytics, medium, 'Overlaps with BI and planning software']
      - [Government modernization, customs and trusted-trade programs, low, 'Budgets are opaque and procurement-specific']
      - [Product-passport infrastructure, provenance and identity workflows, low, 'Still early and only partially standardized']
      - [Tariff-planning tools, scenario analysis and duty optimization, low, 'Demand spikes with policy volatility and may normalize']
    notes: 'No single public TAM source is sufficient; the right answer is a lens stack with explicit limitations.'
    claimRefs: [CM005, CM006, CM009, CM012]
  - id: TM003
    title: Segment / Buyer Map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget Owner, Adoption Trigger]
    rows:
