company:
  name: Altana Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Altana sits in the intersection of trade compliance, customs workflow automation,
    supply-chain intelligence, and trusted-trade infrastructure. The addressable market is
    broad enough to be interesting, but public sources do not cleanly isolate a single TAM;
    the right lens is a stack of adjacent budgets driven by tariff volatility, customs
    complexity, and government digital-trade modernization.
sections:
  - id: market-boundary
    title: Market Boundary and Substitutes
    body: >-
      Altana is best understood as a workflow and data-infrastructure business, not a generic
      ERP or visibility vendor. Its market boundary includes trade compliance, customs entry
      automation, product-passport infrastructure, supply-chain intelligence, and tariff
      planning. The natural substitutes are manual brokerage, in-house trade ops teams, ERP
      add-ons, and point solutions that cover only one slice of the workflow.

      Public materials and hiring pages show that the buying motion spans both enterprise and
      government users. That matters because budget ownership is split: trade/compliance teams
      pay for operational use cases, while government agencies and logistics partners can create
      institutional adoption that widens the network effect.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: market-drivers
    title: Demand Drivers and Adoption Constraints
    body: >-
      Three demand forces stand out. First, tariff and trade-policy volatility increases the
      value of scenario planning and customs automation. Second, governments and logistics
      networks want more trusted shipment identity and pre-clearance workflows, which makes
      product-passport style infrastructure attractive. Third, Altana's customer references
      suggest that enterprises with complex cross-border supply chains already have a reason to
      buy before the broader market fully standardizes.

      The main adoption constraints are implementation complexity, cross-functional change
      management, and procurement friction. The product touches trade, compliance, operations,
      security, and data teams, so the sale is not a lightweight self-serve motion. That limits
      the speed of adoption even when the pain is real.
    claimRefs: [CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
  - id: sizing-and-buyers
    title: Sizing Lenses and Buyer Map
    body: >-
      The best public evidence supports multiple sizing lenses rather than one hard TAM number.
      One lens is customs-brokerage and trade-compliance workflow spend; another is enterprise
      supply-chain software and data-infrastructure spend; a third is government modernization
      and trusted-trade infrastructure. Each lens is large enough to matter, but none is cleanly
      isolated from public data.

      On the buyer side, the strongest fit is large importers, logistics providers, and customs
      agencies that already manage multi-tier networks. Altana's named customer set and 2026
      product launches suggest that the company is trying to own a narrow wedge first and then
      expand into adjacent workflow layers.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
    figureRefs: [FM001]
tables:
