chapter:
  order: 5
  number: 5
  title: Product and Technology
  summary: >-
    Altana's product has widened from a trusted-trade network into a more explicit workflow
    platform: the Atlas graph, Product Passports, passport manager, customs-entry automation
    through Cervo, and AI-first engineering operations all point to a broader product surface
    with tighter workflow ownership. The technical moat still looks real, but the public
    evidence remains light on architecture detail.
sections:
  - id: SE001
    title: Product Surface and Workflow Scope
    body: >-
      Altana presents itself as "the network for trusted trade" and describes its AI-powered
      product network as a way for governments and businesses to keep trade flowing while
      improving resilience and security. The current public product story is not just generic
      visibility: it spans supply-chain intelligence, customs and trade workflows, and
      decision support for importers, logistics providers, and compliance teams. That makes the
      product surface more like an operational network layer than a simple dashboard.

      Public job descriptions reinforce the same view. Altana is hiring people who can turn
      domain complexity into practical workflow value, which is a strong signal that the core
      product problem is not data display alone but translating trade data into action.
    claimRefs: [CE001, CE006, CE007, CE008]
    tableRefs: [TE001]
  - id: SE002
    title: Data Model, Launches, and Automation
    body: >-
      Altana Atlas is described across official pages as a federated knowledge graph that maps
      buyer-supplier relationships across the supply chain. In 2026, the company added Product
      Passports and a passport manager, which pushes the platform toward a more explicit record
      and workflow model for product identity, documentation, and clearance.

      The July 2024 Cervo-style expansion and 2026 customs-entry automation messaging suggest
      the company is moving from analysis into execution: draft the customs entry, assemble the
      record, and help the customer act faster. That shift matters because it turns the data
      network into a workflow engine.
    claimRefs: [CE002, CE003, CE004, CE008]
    tableRefs: [TE002]
  - id: SE003
    title: Engineering Stack and Technical Risks
    body: >-
      Altana's engineering hiring shows a modern platform org: cloud infrastructure, developer
      experience, SRE, DevSecOps, CI/CD, and an explicit AI-first / agent-first operating model.
      The platform engineering role says Altana is reorganizing around AI coding harnesses and
      autonomous agents as first-class participants in the SDLC, which is a direct hint that
      the company expects software delivery itself to be AI-augmented.

      The risk is that the public record remains sparse on actual architecture, API surface,
      security certifications, and model governance. That means the moat is still mostly
      inferred from hiring and product narratives rather than from published technical docs.
    claimRefs: [CE005, CE009, CE010, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
