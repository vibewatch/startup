      - [Passport / product identity data, product records and clearances, 'persistent record model and change tracking', '2026 product launches', 'Data governance risk']
      - [Government compliance workflows, trusted trade operations, 'role-based access and secure deployments', 'public-sector hiring', 'Security / certification risk']
    notes: "Altana's public pages imply a data-heavy workflow engine, but the exact schemas are not published."
    claimRefs: [CE002, CE003, CE004, CE005, CE009]
  - id: TE003
    title: Build / Buy and Moat Comparison
    columns: [Capability, Altana, Commodity Alternative, Moat Implication, Evidence]
    rows:
      - [Trade graph depth, high, low, 'Network depth is the key differentiation', 'official site']
      - [Customs entry automation, medium-high, medium, 'Cervo expands the execution wedge', 'SiliconAngle coverage']
      - [AI-first SDLC, high, medium, 'Engineering velocity may compound faster', 'platform engineering hiring']
      - [Government trust posture, high, medium, 'Security/compliance raises switching costs', 'public-sector job posts']
      - [Public technical transparency, low, high, 'Opaque architecture makes diligence harder', 'no public architecture docs']
      - [Competitive substitutability, medium, high, 'Point tools can still win on simplicity', 'market alternatives pages']
    notes: 'The moat is strongest where Altana combines data, workflow depth, and trust; the weakest area is public technical transparency.'
    claimRefs: [CE009, CE010, CE011, CE012]
