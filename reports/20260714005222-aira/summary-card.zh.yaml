  topStrengths:
    - 欧洲融资最充足的住宅电气化平台，已融资 EUR621M+，背后有 Altor、Kinnevik、Temasek 等一线投资方
    - 自营制造、安装、融资和 15 年质保的垂直一体化模式，抬高切换成本
    - 收入增长快：2024 年营业收入增至超过 SEK175m、为此前三倍，收入运行率奔向约 EUR200m
    - 欧盟逐步淘汰化石燃料锅炉，监管顺风强
  topRisks:
    - 公司仍私有且不透明：收入质量、毛利率、单位经济、现金和现金跑道均未披露
    - 需求依赖补贴；2023-2024 年激励削减后，市场大幅下滑
    - 模式重资产且仍亏损（2024 年经营亏损扩大至约 SEK1,238m），需要持续后续融资
    - Octopus Energy 和传统 OEM 施压，可能复制订阅模式
  unresolvedGaps:
    - 毛利率和单位经济（单次安装成本、回本周期、LTV）未披露
    - 账上现金、烧钱速度和现金跑道未披露
    - 客户数、流失率、续约率和净收入留存率不可得
    - 估值口径在不同来源间冲突（约 EUR1.8B vs 约 USD1.2B）；最新定价轮条款未确认
