  {
   "id": "thesis",
   "title": "Thesis and anti-thesis",
   "body": "The investment thesis is that Aira can own European residential electrification by combining vertical integration, a subscription that creates lock-in and high lifetime value, and the manufacturing and installation scale that competitors relying on third parties lack, all riding a regulatory tailwind as the EU phases out fossil boilers. Top-tier backers including Altor, Kinnevik and Temasek reinforce the thesis by improving follow-on funding access and exit optionality. The anti-thesis is equally coherent: heat-pump hardware commoditises, subsidies swing demand violently, and the subscription model may never reach profitable unit economics, leaving a capital-hungry, loss-making business perpetually dependent on external funding. The decisive point is that the primary return driver from here is disciplined execution converting scale into margin, not further multiple expansion; the multiple is already full. Whether the thesis or anti-thesis prevails depends almost entirely on evidence about margins that is currently withheld.",
   "claimRefs": [
    "CV007",
    "CV008",
    "CV011",
    "CV032",
    "CV033",
    "CV040"
   ],
   "tableRefs": [
    "TV002"
   ]
  },
  {
   "id": "financing-scenarios",
   "title": "Financing context and scenarios",
   "body": "Aira raised a EUR 150 million round in August 2025, its largest, and has raised more than EUR 621 million in total across equity and financing facilities, so it is well capitalised for now, though late-stage entry carries dilution and liquidation-preference stacking risk typical of pre-IPO rounds. Entry discipline is challenged by the stretched multiple and undisclosed margins. Three scenarios frame the outcome. The bull case, roughly a quarter probability, sees Aira compounding revenue as EU boiler bans drive mass adoption toward a multi-billion outcome, supported by regulatory tailwinds. The base case, around half probability, sees steady growth with valuation broadly tracking revenue as economics slowly improve. The bear case, roughly a quarter probability, sees subsidy-driven demand collapse and continued losses forcing a down round. A down round is genuinely credible if the market softens before Aira reaches breakeven, which is why the scenario weighting is not skewed strongly positive despite the strong strategic narrative.",
   "claimRefs": [
