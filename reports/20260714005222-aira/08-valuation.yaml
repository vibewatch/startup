  {
   "id": "comparables",
   "title": "Comparable valuation",
   "body": "Aira's valuation is best read against private European electrification peers rather than public OEMs. Octopus Energy, with its heat pump and energy-retail business, is valued in the multiple billions and dwarfs Aira on scale; Enpal, the German residential solar and energy company, reached roughly EUR 2.4 billion; and 1KOMMA5 reached around EUR 1 billion as a European home-energy platform. These private peers trade on forward growth given policy tailwinds, whereas public heat-pump OEMs such as Daikin and NIBE trade at lower revenue multiples. Aira's valuation therefore sits between hardware-OEM multiples and richer software or energy-platform multiples, which is defensible for a vertically integrated, best-funded challenger but leaves little room for disappointment. Because the private-peer valuations are dated estimates and business mixes differ, the comparable set is directional rather than precise, and it should be refreshed with current transaction evidence during diligence.",
