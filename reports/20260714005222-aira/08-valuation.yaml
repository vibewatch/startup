 "chapter": {
  "number": 8,
  "title": "Valuation & Recommendation",
  "summary": "Recommendation: track. Aira is a strategically strong, best-funded European electrification challenger backed by Altor, Kinnevik and Temasek, but its ~EUR1.8bn valuation against a ~EUR200m run-rate implies a stretched ~9x multiple while unit economics, margins and runway are undisclosed. Confidence is medium, risk rating high, valuation stance stretched, overall ~6.8/10. Against private peers (Enpal ~EUR2.4bn, 1KOMMA5 ~EUR1bn, Octopus far larger) the price is defensible but leaves no room for disappointment; the case hinges on withheld evidence that subscription economics turn profitable at scale."
 },
 "sections": [
  {
   "id": "recommendation",
   "title": "Recommendation and stance",
   "body": "The recommendation on Aira is to track: it is a high-quality, well-backed opportunity that is not yet underwritable at the current price. Confidence is medium because the core drivers of value, unit economics and full financials, are undisclosed, and the risk rating is high given subsidy dependence, widening losses and a capital-intensive model. The valuation stance is stretched: a valuation of roughly EUR 1.8 billion against a run-rate of about EUR 200 million implies an EV/revenue multiple near nine times, rich for a loss-making scale-up, and some providers cite a lower figure around USD 1.2 billion, so even the entry price is uncertain. The overall assessment is moderate, roughly 6.8 out of 10: a genuinely strong strategic position offset by unproven economics. The best-funded-challenger status and EU policy backing justify continued monitoring rather than a pass, but not an unlimited multiple.",
