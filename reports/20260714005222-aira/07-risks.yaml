  {
   "id": "operational",
   "title": "Operational, quality and supply risk",
   "body": "Aira's asset-heavy, vertically integrated model concentrates operational risk. Its Poland manufacturing scale-up carries execution and utilisation risk: capacity for roughly half a million heat pumps a year is only an asset if demand fills it, and a policy-driven demand drop would leave the factory under-utilised. The business depends on the supply of R290 refrigerant, inverter and semiconductor components, and skilled installers, any of which could disrupt output. R290 propane is flammable, imposing strict installation, siting and safety-compliance requirements where a safety incident, though low-probability, would be high-impact. The most frequent operational-quality issue, evidenced directly by customers, is variable installation quality and reliance on subcontractors, alongside occasional app and software reliability problems. Because Aira sells a long-duration service, these operational and quality risks compound over the contract life rather than resolving at the point of sale, making consistent execution a persistent rather than one-off requirement.",
   "claimRefs": [
    "CR009",
    "CR011",
    "CR012",
    "CR013",
    "CR028",
    "CR021",
    "CR038"
   ],
   "tableRefs": [
