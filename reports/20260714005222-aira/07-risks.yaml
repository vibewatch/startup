   ],
   "figureRefs": [
    "FR003"
   ]
  },
  {
   "id": "financial",
   "title": "Financial and model risk",
   "body": "Aira's financial risk profile is that of a fast-scaling but loss-making capital consumer. Operating losses widened in 2024, and the capital-intensive model requires sustained external funding until subscription cash flows mature, so an inability to raise follow-on capital would be existential. By financing hardware over long contracts, Aira also carries credit and loss exposure on customer payments, a risk that grows with the book. Analysts note heat-pump businesses face margin pressure from installation labour costs and subsidy volatility, and electricity-to-gas price spreads strongly influence the economics that drive both demand and unit profitability. The core risk cluster is therefore the combination of loss-making finances with regulation-sensitive, price-sensitive demand: if demand softens while the company is still burning cash, both the funding runway and the path to positive unit economics come under simultaneous pressure. This interaction, more than any single risk, defines Aira's downside.",
   "claimRefs": [
    "CR014",
    "CR015",
    "CR016",
    "CR020",
    "CR021",
    "CR035"
   ],
   "figureRefs": [
    "FR001"
   ]
  },
  {
   "id": "people-strategic",
   "title": "People, execution and strategic risk",
   "body": "Execution and people risks are elevated by Aira's growth stage. The company changed chief executive in May 2025, moving from founding CEO Martin Lewerth to Peter Prem, a leadership-continuity risk during a critical scaling phase. Headcount has grown rapidly past 1,200, straining organisational and quality-control capacity, and the whole industry faces a structural shortage of trained heat-pump installers that directly constrains deployment. Strategically, Aira competes against a well-funded Octopus Energy and scaled OEM incumbents who could replicate its subscription and direct-to-consumer model. These risks are partly mitigated by Aira's owned installer academies and in-house workforce, its early adoption of low-GWP R290 ahead of F-gas deadlines, and its diversification across the UK, Germany, Italy and the Nordics, which hedges single-country policy shocks. Nonetheless, leadership transition plus rapid scaling plus a competitive, capital-hungry market is a demanding execution environment.",
   "claimRefs": [
    "CR017",
    "CR018",
    "CR019",
    "CR022",
    "CR027",
    "CR028",
    "CR034"
   ],
   "tableRefs": [
    "TR004"
   ]
  },
  {
   "id": "mitigation-triggers",
   "title": "Mitigations, triggers and monitoring",
   "body": "For diligence, the risks resolve into a small set of thesis-break triggers and monitoring indicators. The first kill trigger is a sustained collapse in heat-pump demand driven by subsidy removal, which would undermine the entire revenue ramp. The second is a failure to reach positive unit economics as scale grows, indicating the subscription model does not convert volume into profit. The third is an inability to raise follow-on capital for the capital-intensive model. Against these, Aira's mitigations, installer academies, R290 early adoption and market diversification, reduce but do not eliminate exposure, and regulatory tailwinds from the boiler phase-out partially offset subsidy-withdrawal risk over the long term. The monitoring dashboard should track subsidy-policy changes, especially the German GEG design, installer-capacity metrics, and the Trustpilot satisfaction trend as an early warning on installation execution. These indicators give an investor concrete, observable signals to test the thesis over time.",
