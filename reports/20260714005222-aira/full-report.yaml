      - number: '3.4'
        title: Adverse signals and positioning
        blocks:
          - type: paragraph
            body: >-
              Aira's competitive story is not without cracks. Independent reviews and homeowner forums flag
              installation-coordination and subcontracting issues, and some customers openly question the long-term
              value of subscription versus owning a heat pump outright, both of which could erode the service-quality
              advantage Aira relies on. Because Aira competes most directly with Octopus in the UK while OEM incumbents
              dominate continental share, it must win on execution in crowded markets. Its positioning is premium and
              high-service rather than lowest-price, which limits appeal to the most cost-sensitive buyers who anchor on
              cheap gas boilers. The combination of factory, academies, financing and a 15-year guarantee is genuinely
              rare, but no element is individually defensible, so sustained execution is the real moat.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP036
              - CP023
              - CP033
      - number: '3.5'
        title: Incumbent concentration and channel dynamics
        blocks:
          - type: paragraph
            body: >-
              Beyond the challenger duel, the structural shape of the market matters for Aira's odds. Daikin, Bosch and
              Vaillant together control a plurality of European heat-pump share, dwarfing any single challenger and
              giving them purchasing scale, distribution reach and brand recognition that a young company cannot match
              quickly. Their route to market, however, is their weakness: they depend on a fragmented base of
              MCS-certified local installers whose capacity, quality and pricing vary widely, which is precisely the
              friction Aira's in-house installation and academy model tries to remove. NIBE anchors the Nordic and
              Baltic regions, and Mitsubishi Electric competes on cold-climate reliability, so regional strength is
              uneven rather than uniform. For Aira, this means the competitive threat is not monolithic: it can win
              pockets by out-executing installers on service and financing, even while incumbents retain the overall
              volume lead. The open question is whether incumbents mobilise their scale into direct, subscription-style
              offers before Aira's model reaches defensible density.
            claimRefs:
              - CP037
              - CP021
              - CP022
              - CP005
              - CP006
              - CP035
              - CP001
