      - number: '2.3'
        title: Buyers, segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core buyer is the individual owner-occupier replacing an end-of-life boiler, who owns the purchase
              budget and bears the switching decision. New-build residential is a structurally growing segment because
              all new EU buildings must be zero-emission by 2030, while landlord and rental stock adopts more slowly and
              mainly under regulatory pressure. Aira's subscription with no upfront cost is explicitly designed to
              attack the affordability barrier that deters retrofit buyers facing high installation bills, and its Home
              Energy System lets it cross-sell solar and battery adopters. Air-source heat pumps dominate the
              segmentation, holding roughly 72% of the European market and about 63% residential share, because they are
              cheaper and simpler to install than ground-source alternatives.
