      - number: '1.2'
        title: Leadership, founders and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Aira's leadership reflects a builder-plus-operator structure. Vargas and financier Harald Mix supplied the
              founding capital, strategy and industrial playbook. Martin Lewerth ran the company as founding CEO from
              2022 until May 2025, when Peter Prem, a 20-year Tetra Pak veteran who had been COO since 2022, was
              elevated to Group CEO to drive the scale-up phase, with Anthony Loizeau named Deputy CEO. Lewerth
              subsequently left to lead Cibes Lift Group. This transition concentrates execution risk on a new chief
              executive at exactly the moment Aira must convert heavy capital investment into profitable growth. Board
              composition is only partially disclosed publicly, leaving governance depth as a diligence item. The
              recurring presence of listed investor Kinnevik provides some external oversight discipline, since Kinnevik
              must report on its holdings to public shareholders and analysts, giving diligence teams at least one
              arms-length, regularly published disclosure channel into an otherwise opaque private company.
