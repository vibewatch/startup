chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model and stage
        blocks:
          - type: paragraph
            body: >-
              Aira is a Stockholm-headquartered clean energy-technology company founded in 2022 by the Swedish
              impact-investment group Vargas Holding, the same builder behind Northvolt and H2 Green Steel. It sells
              residential air-source heat pumps and, from late 2025, an integrated home energy system spanning solar,
              battery storage and inverters. Aira's distinguishing commercial model is an all-inclusive monthly
              subscription that removes upfront cost and bundles installation, servicing and a 15-year comfort
              guarantee. Having raised hundreds of millions of euros, built its own factory and reached an approximately
              EUR200 million run-rate, Aira is best understood as a late-stage, capital-intensive private scale-up
              rather than an early-stage startup, targeting the replacement of fossil-fuel heating across European
              homes.
