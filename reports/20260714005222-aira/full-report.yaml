              - CM032
              - CM035
              - CM036
              - CM038
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural demand, cyclical volume
            body: >-
              Regulation guarantees a decades-long boiler-replacement cycle, but annual volumes swing sharply with
              subsidy policy, as the 2024 slump showed.
            calloutType: insight
            claimRefs:
