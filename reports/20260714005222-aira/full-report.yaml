  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Aira competes in the European residential heating market, and more precisely in air-source heat pumps sold
              to homeowners as replacements for fossil-fuel boilers. The market excludes commercial and industrial heat
              pumps and district heating, but it now includes adjacent home solar, battery storage and inverters that
              Aira bundles through its Home Energy System. The critical substitute is not another heat-pump brand but
              the entrenched installed base of roughly 130 million fossil-fuel boilers across Europe, together with the
              option to simply replace a broken boiler with another gas unit. Home heating is frequently framed as about
              10% of EU CO2 emissions, which is why regulators treat this replacement cycle as strategically important
              and why the boundary is defined by the pace at which boilers are retired.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM037
              - CM002
