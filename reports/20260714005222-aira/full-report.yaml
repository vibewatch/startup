  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Aira's customers are European residential homeowners replacing fossil-fuel heating with electric heat
              pumps, and in most cases the buyer, user and payer are the same person: the owner-occupier. It sells
              primarily in the UK, Germany, Italy and the Nordics, with some landlord demand, and positions itself for
              the mass market rather than a narrow premium niche. The strategic addressable base is the roughly 130
              million fossil-boiler homes across Europe that regulation is pushing off gas and oil, and in the UK
              specifically Aira has stated an ambition to serve up to five million homes. Demand is underpinned by EU
              rules phasing out fossil boilers and by the subscription model itself, which removes the upfront cost that
              normally deters homeowners from switching. The result is a large, regulation-driven, mass-market customer
              opportunity where affordability and installation execution, rather than awareness, are the binding
              constraints.
