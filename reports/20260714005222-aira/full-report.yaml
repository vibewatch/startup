      - number: '7.3'
        title: Financial and model risk
        blocks:
          - type: paragraph
            body: >-
              Aira's financial risk profile is that of a fast-scaling but loss-making capital consumer. Operating losses
              widened in 2024, and the capital-intensive model requires sustained external funding until subscription
              cash flows mature, so an inability to raise follow-on capital would be existential. By financing hardware
              over long contracts, Aira also carries credit and loss exposure on customer payments, a risk that grows
              with the book. Analysts note heat-pump businesses face margin pressure from installation labour costs and
              subsidy volatility, and electricity-to-gas price spreads strongly influence the economics that drive both
              demand and unit profitability. The core risk cluster is therefore the combination of loss-making finances
              with regulation-sensitive, price-sensitive demand: if demand softens while the company is still burning
              cash, both the funding runway and the path to positive unit economics come under simultaneous pressure.
              This interaction, more than any single risk, defines Aira's downside.
