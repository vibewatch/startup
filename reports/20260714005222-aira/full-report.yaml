  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulation is simultaneously Aira's biggest tailwind and its biggest risk. On the upside, the EU EPBD and
              F-gas rules phase out fossil boilers and high-GWP refrigerants, structurally favouring heat pumps. On the
              downside, demand is acutely sensitive to subsidies, whose withdrawal has historically triggered sharp
              sales drops. Germany's heating-law (GEG) reform creates uncertainty over subsidy levels in Aira's largest
              market, and Italy's Superbonus wind-down shows how national policy shifts cut demand. In the UK, from
              April 2026 installations must be MCS certified to qualify for the Boiler Upgrade Scheme and Clean Heat
              Market Mechanism credits, MCS rules tighten with stricter design and documentation requirements, and from
              May 2026 MCS 020(a) noise assessments add permitted-development steps. Subsidy-compliance errors could
              invalidate grants and trigger disputes, and the fifteen-year guarantee creates long-tail warranty and
              consumer-protection liability. The concentration of demand in a few regulation-sensitive markets amplifies
              this policy exposure.
            claimRefs:
