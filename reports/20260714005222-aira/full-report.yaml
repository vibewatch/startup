      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Subsidy-dependence is the core risk
            body: >-
              Heat-pump demand has dropped sharply when subsidies were cut; Aira's demand is concentrated in
              regulation-sensitive markets.
