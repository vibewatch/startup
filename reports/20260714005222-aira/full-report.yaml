  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and streams
        blocks:
          - type: paragraph
            body: >-
              Aira's core revenue engine is a monthly subscription that bundles the heat pump, its installation, ongoing
              servicing and embedded financing into a single all-inclusive fee with no upfront cost to the homeowner.
              This converts what is normally a large one-off capital purchase into a long-dated recurring revenue
              stream, typically over contracts of up to fifteen years. On top of heating, Aira now sells and installs
              solar panels, battery storage and its integrated Home Energy System, broadening the recurring base and
              increasing revenue per household. Servicing and maintenance are monetised within the subscription rather
              than as separate contracts, adding a sticky service-revenue layer. Revenue recognition for multi-year
              subscriptions most likely spreads the hardware value across the contract term rather than booking it at
              installation, which smooths reported revenue but front-loads cash outlay. The clear direction of travel is
              a shift from selling single heat pumps toward multi-product, higher-value home energy systems.
            claimRefs:
