  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation on Aira is to track: it is a high-quality, well-backed opportunity that is not yet
              underwritable at the current price. Confidence is medium because the core drivers of value, unit economics
              and full financials, are undisclosed, and the risk rating is high given subsidy dependence, widening
              losses and a capital-intensive model. The valuation stance is stretched: a valuation of roughly EUR 1.8
              billion against a run-rate of about EUR 200 million implies an EV/revenue multiple near nine times, rich
              for a loss-making scale-up, and some providers cite a lower figure around USD 1.2 billion, so even the
              entry price is uncertain. The overall assessment is moderate, roughly 6.8 out of 10: a genuinely strong
              strategic position offset by unproven economics. The best-funded-challenger status and EU policy backing
              justify continued monitoring rather than a pass, but not an unlimited multiple.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV031
              - CV037
              - CV039
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV037
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV004
              - CV001
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that Aira can own European residential electrification by combining vertical
              integration, a subscription that creates lock-in and high lifetime value, and the manufacturing and
              installation scale that competitors relying on third parties lack, all riding a regulatory tailwind as the
              EU phases out fossil boilers. Top-tier backers including Altor, Kinnevik and Temasek reinforce the thesis
              by improving follow-on funding access and exit optionality. The anti-thesis is equally coherent: heat-pump
              hardware commoditises, subsidies swing demand violently, and the subscription model may never reach
              profitable unit economics, leaving a capital-hungry, loss-making business perpetually dependent on
              external funding. The decisive point is that the primary return driver from here is disciplined execution
              converting scale into margin, not further multiple expansion; the multiple is already full. Whether the
              thesis or anti-thesis prevails depends almost entirely on evidence about margins that is currently
              withheld.
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV032
              - CV033
              - CV040
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV031
              - CV033
      - number: '8.3'
        title: Financing context and scenarios
        blocks:
          - type: paragraph
            body: >-
              Aira raised a EUR 150 million round in August 2025, its largest, and has raised more than EUR 621 million
              in total across equity and financing facilities, so it is well capitalised for now, though late-stage
              entry carries dilution and liquidation-preference stacking risk typical of pre-IPO rounds. Entry
              discipline is challenged by the stretched multiple and undisclosed margins. Three scenarios frame the
              outcome. The bull case, roughly a quarter probability, sees Aira compounding revenue as EU boiler bans
              drive mass adoption toward a multi-billion outcome, supported by regulatory tailwinds. The base case,
              around half probability, sees steady growth with valuation broadly tracking revenue as economics slowly
              improve. The bear case, roughly a quarter probability, sees subsidy-driven demand collapse and continued
              losses forcing a down round. A down round is genuinely credible if the market softens before Aira reaches
              breakeven, which is why the scenario weighting is not skewed strongly positive despite the strong
              strategic narrative.
            claimRefs:
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV038
