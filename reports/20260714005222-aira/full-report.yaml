      - number: '7.4'
        title: People, execution and strategic risk
        blocks:
          - type: paragraph
            body: >-
              Execution and people risks are elevated by Aira's growth stage. The company changed chief executive in May
              2025, moving from founding CEO Martin Lewerth to Peter Prem, a leadership-continuity risk during a
              critical scaling phase. Headcount has grown rapidly past 1,200, straining organisational and
              quality-control capacity, and the whole industry faces a structural shortage of trained heat-pump
              installers that directly constrains deployment. Strategically, Aira competes against a well-funded Octopus
              Energy and scaled OEM incumbents who could replicate its subscription and direct-to-consumer model. These
              risks are partly mitigated by Aira's owned installer academies and in-house workforce, its early adoption
              of low-GWP R290 ahead of F-gas deadlines, and its diversification across the UK, Germany, Italy and the
              Nordics, which hedges single-country policy shocks. Nonetheless, leadership transition plus rapid scaling
              plus a competitive, capital-hungry market is a demanding execution environment.
