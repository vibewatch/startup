      - number: '7.5'
        title: Mitigations, triggers and monitoring
        blocks:
          - type: paragraph
            body: >-
              For diligence, the risks resolve into a small set of thesis-break triggers and monitoring indicators. The
              first kill trigger is a sustained collapse in heat-pump demand driven by subsidy removal, which would
              undermine the entire revenue ramp. The second is a failure to reach positive unit economics as scale
              grows, indicating the subscription model does not convert volume into profit. The third is an inability to
              raise follow-on capital for the capital-intensive model. Against these, Aira's mitigations, installer
              academies, R290 early adoption and market diversification, reduce but do not eliminate exposure, and
              regulatory tailwinds from the boiler phase-out partially offset subsidy-withdrawal risk over the long
              term. The monitoring dashboard should track subsidy-policy changes, especially the German GEG design,
              installer-capacity metrics, and the Trustpilot satisfaction trend as an early warning on installation
              execution. These indicators give an investor concrete, observable signals to test the thesis over time.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR027
              - CR037
              - CR039
              - CR040
          - type: table
            tableRef: TR005
            claimRefs:
