            body: >-
              Because Aira sells a fifteen-year comfort guarantee covering parts, labour and maintenance, product trust
              and compliance are central to the model. The use of R290 propane, while efficient and low-GWP, is
              flammable (safety class A3), so design and installation must meet strict refrigerant-safety standards, and
              installation quality depends on the competence of Aira's in-house teams and any subcontractors. In the UK,
