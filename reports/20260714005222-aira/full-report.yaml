      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The market's structural driver is regulation: the EU ended subsidies for stand-alone fossil boilers in
              2025, bars new gas boilers in new homes from 2026, mandates zero-emission new buildings by 2030, and
              targets a full fossil-heating phase-out by 2040. National subsidies reinforce this, with Germany covering
              up to 70% of costs. The constraints are equally real. Germany's electricity-to-gas price ratio of about
              3.2x means heat pumps depend on subsidies to be clearly cheaper to run, upfront installation cost remains
              a barrier, and installer capacity is scarce. The 2024 slump, in which sales fell about 22% across 14
              markets, showed how policy-sensitive demand is; early-2026 rebound signals are encouraging but not yet
              proof of durable recovery.
            claimRefs:
              - CM016
              - CM017
              - CM018
