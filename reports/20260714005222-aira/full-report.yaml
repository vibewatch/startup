      - number: '4.4'
        title: Cost structure and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Aira's cost base reflects a vertically integrated, asset-heavy model. It employs more than 1,200 people
              across roughly 18 regional hubs, and its Poland factory has capacity for about 500,000 heat pumps a year,
              anchoring the cost of goods and supported by roughly EUR 15 million in Polish government grants. Vertical
              integration lets Aira capture manufacturing, installation and financing margin that competitors typically
              split with third parties, but it also front-loads capital: hardware, installation labour and factory capex
