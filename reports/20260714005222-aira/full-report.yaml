      - number: '2.5'
        title: Volatility and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The defining feature of this market is the tension between strong long-term structural demand and volatile
              near-term volumes. The 2024 contraction cost the sector at least 4,000 direct jobs and saw Germany fall
              48% and France 39%, while the UK bucked the trend with 63% growth. Market-size estimates also diverge by
              scope, from the ~$13.4 billion residential 2026 figure to larger all-segment numbers, so any single
              headline should be treated cautiously. Broader cleantech private valuations near 3.7x EV/revenue provide a
              rough anchor for how investors currently price hardware-heavy energy businesses. The principal downside
              risk to sizing is subsidy withdrawal, which historically triggers sharp demand drops and would directly
              compress Aira's serviceable market and slow the boiler-replacement cycle that underpins the entire
              long-term thesis.
            claimRefs:
              - CM009
              - CM010
              - CM011
