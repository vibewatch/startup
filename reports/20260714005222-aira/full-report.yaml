      - number: '2.2'
        title: Market sizing across lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the opportunity requires more than one lens. On an annual-spend basis, the Europe residential heat
              pump market was worth roughly $13.4 billion in 2026 and is projected to grow at about 20.3% CAGR to around
              $71.2 billion by 2035. On a volume basis, about 2.62 million residential units sold across 16 major
              European markets in 2025, up roughly 10% year on year. On an installed-base basis, the cumulative
              replacement opportunity is measured against roughly 130 million boilers, implying a
              multi-hundred-billion-euro prize over decades. Against these frames, Aira's serviceable market is the UK,
              Germany and Italy residential air-source subset, and its roughly EUR200 million run-rate represents only
              low-single-digit share, leaving substantial headroom but also underscoring how early the company is
              relative to the prize.
