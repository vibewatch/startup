      - number: '4.2'
        title: Traction and profitability
        blocks:
          - type: paragraph
            body: >-
              Aira is scaling revenue quickly while losses widen. Operating revenue roughly tripled to more than SEK 175
              million in 2024 from about SEK 61 million in 2023, and the annual run-rate is reported to have reached
              roughly EUR 200 million by 2025-2026, with some estimates near USD 233 million. Against that, the
              operating loss widened to about SEK 1,238 million in 2024 from about SEK 437 million a year earlier. This
              is a classic high-growth, growth-over-profit financial profile: revenue is compounding but the loss is
              expanding faster in absolute terms as Aira invests in manufacturing, installation capacity and headcount.
              The scale of accumulated losses raises legitimate questions about the timeline to breakeven, which the
              company has not disclosed. Because Aira is private, the only hard financials are Swedish annual accounts;
              unit-level metrics such as units installed and active subscriptions are not consistently public.
