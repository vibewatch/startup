              - CV022
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV034
              - CV035
              - CV024
              - CV032
      - number: '8.5'
        title: Triggers, exit and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The investment should be governed by explicit thesis-break triggers: a subsidy-driven demand collapse
              across core markets, a failure to demonstrate a credible path to positive unit economics, and a broken
              funding market that blocks the next raise, each of which would break the thesis. Exit readiness is
              medium-term; an IPO or strategic sale is plausible only after profitability becomes credible, so this is a
              multi-year hold rather than a near-term flip. Valuation is highly sensitive to the assumed steady-state
              gross margin, which is undisclosed, and to revenue-growth durability given policy-driven volatility. The
              final diligence asks therefore centre on a unit-economics pack, cash and runway, and cohort retention,
              supplemented by subsidy exposure by market and the cap-table and preference structure. The key investment
              KPIs to monitor are revenue run-rate, gross margin, burn, CAC and payback, and subsidy policy. Ultimately
              the valuation case hinges on evidence, currently withheld, that subscription economics turn profitable at
              scale.
            claimRefs:
