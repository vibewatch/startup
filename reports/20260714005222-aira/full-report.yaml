            body: >-
              Aira is among the best-capitalised heat-pump companies in Europe. It raised EUR 63 million in October 2024
              and a EUR 150 million equity round in August 2025, its largest to date, and reached a cumulative equity
              milestone of about EUR 270 million by late 2024. Including debt and asset-financing facilities, total
