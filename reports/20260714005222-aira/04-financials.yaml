  },
  {
   "id": "funding-valuation",
   "title": "Funding and valuation",
   "body": "Aira is among the best-capitalised heat-pump companies in Europe. It raised EUR 63 million in October 2024 and a EUR 150 million equity round in August 2025, its largest to date, and reached a cumulative equity milestone of about EUR 270 million by late 2024. Including debt and asset-financing facilities, total funding is reported at more than EUR 621 million. Its post-money valuation is estimated at roughly EUR 1.8 billion, although some data providers cite a lower figure of about USD 1.2 billion, underlining genuine valuation uncertainty for a private company. The investor syndicate, spanning Altor, Kinnevik, Temasek, Kallskar and Lingotto, is high quality and improves access to follow-on capital. The willingness of these backers to fund a capital-intensive, loss-making business is itself a signal, but it also means the equity story depends on continued external financing until subscription cash flows mature.",
   "claimRefs": [
    "CI007",
    "CI008",
