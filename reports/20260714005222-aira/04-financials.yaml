  },
  {
   "id": "efficiency-verdict",
   "title": "Sales efficiency and verdict",
   "body": "The weakest-covered area is unit economics. Gross margin per installation, customer acquisition cost, payback period and lifetime value are all undisclosed, so sales efficiency can only be inferred. The subscription structure implies a long payback but potentially high lifetime value from fifteen-year contracts, and the bundled servicing should support retention. However, analysts including BCG note that heat-pump businesses face margin pressure from installation labour and subsidy volatility, and European market softness in 2023-2024 showed the revenue ramp is exposed to policy swings. The overall financial verdict is that Aira has genuine, fast-growing revenue and top-tier backing, but revenue quality, margin path and capital intensity cannot be fully underwritten from public data. The diligence priority is a management-accounts pack covering margins, cohort economics, cash and runway to test whether the model converts scale into profit.",
