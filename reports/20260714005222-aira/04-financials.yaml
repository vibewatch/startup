  },
  {
   "id": "cost-capital",
   "title": "Cost structure and capital intensity",
   "body": "Aira's cost base reflects a vertically integrated, asset-heavy model. It employs more than 1,200 people across roughly 18 regional hubs, and its Poland factory has capacity for about 500,000 heat pumps a year, anchoring the cost of goods and supported by roughly EUR 15 million in Polish government grants. Vertical integration lets Aira capture manufacturing, installation and financing margin that competitors typically split with third parties, but it also front-loads capital: hardware, installation labour and factory capex are spent before subscription revenue accrues. The model is therefore capital-intensive and financing-dependent, creating meaningful working-capital and burn requirements. Cash on hand, monthly burn and runway are not disclosed, so capital adequacy cannot be independently verified. UK affordability is helped by the GBP 7,500 Boiler Upgrade Scheme grant, but the central financial risk remains a financing-dependent, loss-making profile carried at a EUR 1.8 billion valuation.",
   "claimRefs": [
    "CI014",
