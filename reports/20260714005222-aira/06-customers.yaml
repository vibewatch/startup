    "CU035"
   ],
   "figureRefs": [
    "FU003"
   ]
  },
  {
   "id": "retention-expansion",
   "title": "Retention, expansion and concentration",
   "body": "The subscription's fifteen-year contract creates strong structural lock-in, but hard retention metrics such as churn, renewal and net-revenue-retention are not publicly disclosed, so durability can only be proxied by contract length and satisfaction scores. On concentration, Aira's mass-market B2C base means there is little single-customer revenue concentration risk, though its customers are concentrated geographically in a few European markets, creating some regional exposure. Aira pursues a land-and-expand path by adding solar, battery storage and EV charging to existing heat-pump homes through the Home Energy System, which raises revenue per customer, but this expansion motion is emerging and unproven as a retention lever. Overall the customer picture is a large, sticky, regulation-backed base with credible satisfaction, offset by undisclosed retention economics and installation execution risk that must be de-risked in diligence.",
