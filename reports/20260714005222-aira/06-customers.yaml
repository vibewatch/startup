    "CU023"
   ],
   "tableRefs": [
    "TU003"
   ]
  },
  {
   "id": "complaints",
   "title": "Complaints and product-fit limits",
   "body": "The critical customer risk sits at installation. Recurring complaints include installation delays and incomplete or messy work, the use of subcontractors despite assurances of in-house Aira teams, poor pre-installation communication with conflicting information, and app or software glitches with initial teething problems after commissioning. Some feedback also indicates the product range may not suit very large or poorly insulated homes, a genuine product-fit limitation. Because installation experience quality varies significantly between customers and the contract commitment is long, consistent onboarding execution is the decisive factor in customer trust and durability. The mix of strong aftercare and variable installation makes the onboarding moment, from survey through commissioning, the single most important determinant of whether a customer becomes a satisfied fifteen-year subscriber or a vocal critic.",
   "claimRefs": [
    "CU009",
    "CU010",
    "CU011",
    "CU012",
