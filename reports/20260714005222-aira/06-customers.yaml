    "FU002"
   ]
  },
  {
   "id": "satisfaction",
   "title": "Satisfaction and named proof",
   "body": "Aira's public customer proof is strong in aggregate but bimodal in detail. It holds a Trustpilot rating of about 4.3 out of 5 across more than 1,600 reviews as of mid-2026, and satisfied customers frequently praise staff professionalism, responsive customer service, smooth handovers, quick fault diagnosis and the value of the fifteen-year guarantee. Independent review sites generally rate Aira favourably among heat-pump installers. However, the proof is aggregate review-platform evidence rather than marquee named accounts, reflecting the B2C nature of the business, and it is production-scale rather than pilot-only, covering real operating homes. The dual picture, strong aftercare alongside a meaningful cluster of installation complaints, means satisfaction is genuine but uneven, and the quality of the review base is the primary external evidence available for underwriting customer outcomes.",
   "claimRefs": [
    "CU006",
    "CU007",
    "CU008",
    "CU024",
