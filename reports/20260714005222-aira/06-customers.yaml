 "chapter": {
  "number": 6,
  "title": "Customers",
  "summary": "Aira serves European owner-occupier homeowners replacing fossil boilers, a mass-market, regulation-backed base across the UK, Germany, Italy and the Nordics, with an ambition of up to 5 million UK homes out of ~130m addressable. It holds a ~4.3/5 Trustpilot rating over 1,600+ reviews with strong aftercare, but a recurring complaint cluster around installation delays, subcontracting and communication makes onboarding the critical trust moment; 15-year contracts imply lock-in though churn and NRR are undisclosed."
 },
 "sections": [
  {
   "id": "segmentation",
   "title": "Customer base and segmentation",
   "body": "Aira's customers are European residential homeowners replacing fossil-fuel heating with electric heat pumps, and in most cases the buyer, user and payer are the same person: the owner-occupier. It sells primarily in the UK, Germany, Italy and the Nordics, with some landlord demand, and positions itself for the mass market rather than a narrow premium niche. The strategic addressable base is the roughly 130 million fossil-boiler homes across Europe that regulation is pushing off gas and oil, and in the UK specifically Aira has stated an ambition to serve up to five million homes. Demand is underpinned by EU rules phasing out fossil boilers and by the subscription model itself, which removes the upfront cost that normally deters homeowners from switching. The result is a large, regulation-driven, mass-market customer opportunity where affordability and installation execution, rather than awareness, are the binding constraints.",
   "claimRefs": [
    "CU001",
    "CU002",
    "CU003",
