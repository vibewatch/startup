  },
  {
   "id": "adoption",
   "title": "Adoption trajectory and deployment",
   "body": "Because demand is broadly supported by policy, Aira's growth is gated more by deployment capacity than by customer interest. To scale, it committed roughly GBP 300 million to the UK and opened installer training academies, including a Sheffield facility, to certify the installers needed to convert homes at volume. It has since opened its academy to independent installers, extending its deployment network beyond in-house teams and addressing the industry-wide skilled-installer shortage. This capacity build-out is central to the adoption trajectory: the subscription removes the affordability barrier, but only a trained installation workforce can turn addressable homes into installed, revenue-generating customers. The funnel therefore runs from roughly 130 million addressable European homes, through a UK ambition of five million, down to the tens of thousands of homes plausibly installed and operating today, with expansion into add-on products as an emerging final stage.",
   "claimRefs": [
    "CU014",
    "CU015",
