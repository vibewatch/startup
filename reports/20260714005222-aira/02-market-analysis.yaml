 "chapter": {
  "number": 2,
  "title": "Market Analysis",
  "summary": "Aira addresses a European residential heat pump market worth about $13.4bn in 2026 and growing ~20% annually against ~130m fossil boilers, but demand is highly policy-sensitive, as the 22% sales slump in 2024 demonstrated; regulation is the structural driver while price ratios and subsidy dependence are the key constraints."
 },
 "sections": [
  {
   "id": "boundary",
   "title": "Market boundary and substitutes",
   "body": "Aira competes in the European residential heating market, and more precisely in air-source heat pumps sold to homeowners as replacements for fossil-fuel boilers. The market excludes commercial and industrial heat pumps and district heating, but it now includes adjacent home solar, battery storage and inverters that Aira bundles through its Home Energy System. The critical substitute is not another heat-pump brand but the entrenched installed base of roughly 130 million fossil-fuel boilers across Europe, together with the option to simply replace a broken boiler with another gas unit. Home heating is frequently framed as about 10% of EU CO2 emissions, which is why regulators treat this replacement cycle as strategically important and why the boundary is defined by the pace at which boilers are retired.",
   "claimRefs": [
    "CM001",
    "CM002",
    "CM003",
    "CM037",
    "CM002"
   ],
   "tableRefs": [
    "TM001"
   ]
  },
  {
   "id": "sizing",
   "title": "Market sizing across lenses",
   "body": "Sizing the opportunity requires more than one lens. On an annual-spend basis, the Europe residential heat pump market was worth roughly $13.4 billion in 2026 and is projected to grow at about 20.3% CAGR to around $71.2 billion by 2035. On a volume basis, about 2.62 million residential units sold across 16 major European markets in 2025, up roughly 10% year on year. On an installed-base basis, the cumulative replacement opportunity is measured against roughly 130 million boilers, implying a multi-hundred-billion-euro prize over decades. Against these frames, Aira's serviceable market is the UK, Germany and Italy residential air-source subset, and its roughly EUR200 million run-rate represents only low-single-digit share, leaving substantial headroom but also underscoring how early the company is relative to the prize.",
   "claimRefs": [
    "CM004",
    "CM005",
    "CM006",
    "CM028",
    "CM029",
    "CM031"
   ],
   "tableRefs": [
    "TM002"
   ],
   "figureRefs": [
    "FM001",
    "FM002"
   ]
  },
  {
   "id": "segments",
   "title": "Buyers, segments and adoption path",
   "body": "The core buyer is the individual owner-occupier replacing an end-of-life boiler, who owns the purchase budget and bears the switching decision. New-build residential is a structurally growing segment because all new EU buildings must be zero-emission by 2030, while landlord and rental stock adopts more slowly and mainly under regulatory pressure. Aira's subscription with no upfront cost is explicitly designed to attack the affordability barrier that deters retrofit buyers facing high installation bills, and its Home Energy System lets it cross-sell solar and battery adopters. Air-source heat pumps dominate the segmentation, holding roughly 72% of the European market and about 63% residential share, because they are cheaper and simpler to install than ground-source alternatives.",
   "claimRefs": [
    "CM007",
    "CM008",
    "CM025",
    "CM026",
    "CM018",
    "CM034"
   ],
   "tableRefs": [
    "TM003"
   ],
   "figureRefs": [
    "FM003"
   ]
  },
  {
   "id": "drivers-constraints",
   "title": "Growth drivers and adoption constraints",
   "body": "The market's structural driver is regulation: the EU ended subsidies for stand-alone fossil boilers in 2025, bars new gas boilers in new homes from 2026, mandates zero-emission new buildings by 2030, and targets a full fossil-heating phase-out by 2040. National subsidies reinforce this, with Germany covering up to 70% of costs. The constraints are equally real. Germany's electricity-to-gas price ratio of about 3.2x means heat pumps depend on subsidies to be clearly cheaper to run, upfront installation cost remains a barrier, and installer capacity is scarce. The 2024 slump, in which sales fell about 22% across 14 markets, showed how policy-sensitive demand is; early-2026 rebound signals are encouraging but not yet proof of durable recovery.",
   "claimRefs": [
    "CM016",
    "CM017",
    "CM018",
    "CM019",
    "CM020",
    "CM021",
    "CM022",
    "CM023",
    "CM024",
    "CM027",
    "CM033"
   ],
   "tableRefs": [
    "TM004"
   ],
   "figureRefs": [
    "FM004"
   ]
  },
  {
   "id": "volatility-gaps",
   "title": "Volatility and sizing gaps",
   "body": "The defining feature of this market is the tension between strong long-term structural demand and volatile near-term volumes. The 2024 contraction cost the sector at least 4,000 direct jobs and saw Germany fall 48% and France 39%, while the UK bucked the trend with 63% growth. Market-size estimates also diverge by scope, from the ~$13.4 billion residential 2026 figure to larger all-segment numbers, so any single headline should be treated cautiously. Broader cleantech private valuations near 3.7x EV/revenue provide a rough anchor for how investors currently price hardware-heavy energy businesses. The principal downside risk to sizing is subsidy withdrawal, which historically triggers sharp demand drops and would directly compress Aira's serviceable market and slow the boiler-replacement cycle that underpins the entire long-term thesis.",
   "claimRefs": [
