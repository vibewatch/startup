  "number": 3,
  "title": "Competitors",
  "summary": "Aira competes against OEM incumbents (Daikin, Bosch, Vaillant, NIBE) that dominate European share, its closest vertically integrated peer Octopus Energy, fragmented local installers and the fossil-boiler status quo; its differentiation is a rare capability stack of owned manufacturing, installation, financing and a 15-year guarantee, but hardware is commoditising and incumbents could replicate the model."
