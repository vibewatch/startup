  {
   "id": "specs-pricing",
   "title": "Product and pricing comparison",
   "body": "On hardware, Aira positions at the premium, high-efficiency end: its R290 unit reports a SCOP of about 4.7 at 35C with an A+++ rating and a 15-year comfort guarantee, versus the Octopus Cosy 6's stated SCOP of about 3.4 and an 8-year warranty. Vaillant's aroTHERM Plus quotes an even higher SCOP near 5.03 and Worcester Bosch offers up to 12-year warranties, so Aira is not uniquely best on every metric, and efficiency claims are measured under differing conditions. On pricing, the divide is structural. Incumbents sell equipment through installers with separate service contracts, Octopus offers zero-upfront installs via finance and its Zero Bills scheme leveraging the GBP7,500 Boiler Upgrade Scheme grant, and Aira uses an all-inclusive monthly subscription with no upfront cost and bundled servicing.",
