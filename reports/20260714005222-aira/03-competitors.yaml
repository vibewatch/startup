 "sections": [
  {
   "id": "landscape",
   "title": "Competitive landscape",
   "body": "Aira faces a layered competitive set. The largest structural competitor is the fossil-boiler status quo, where a homeowner simply replaces a broken gas boiler with another cheap unit. Among heat-pump players, established original-equipment manufacturers dominate volume: Daikin leads Europe at roughly 18-20% share, followed by Bosch at 10-12%, Vaillant at 8-10%, NIBE at 5-7%, with Mitsubishi Electric also in the top five. These incumbents sell through fragmented networks of MCS-certified local installers. Aira's closest strategic analogue is Octopus Energy, which sells its in-house Cosy 6 heat pump directly to UK consumers. Increasingly, solar-led installers such as Enpal are adjacent entrants bundling heat pumps into home-energy offers, a space Aira itself has entered with its Home Energy System.",
