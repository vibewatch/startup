  {
   "id": "gtm-moat",
   "title": "Go-to-market, switching cost and moat",
   "body": "The decisive competitive axis is the business model rather than the box. Aira and Octopus both compete on vertical integration, direct customer relationships and embedded financing, which incumbents largely lack. Aira's ownership of manufacturing, in-house installers, academies, financing and a long guarantee creates meaningful switching cost and lock-in, and its best-funded status among challengers is an advantage in a capital-intensive market. However, its moat rests more on service quality and financing economics than on hardware uniqueness, which is prone to commoditisation. Octopus brings a large energy-retail base and superior customer acquisition, and OEM incumbents retain brand trust, installer networks and scale. The clearest displacement risk is that these larger players simply replicate the subscription and direct-to-consumer model.",
   "claimRefs": [
