  topStrengths:
    - >-
      Best-funded European residential electrification platform, with EUR621M+ raised and top-tier backers (Altor,
      Kinnevik, Temasek)
    - >-
      Vertically integrated model (own manufacturing, installation, financing and 15-year guarantee) creates high
      switching costs
    - 'Fast revenue growth: operating revenue tripled to over SEK175m in 2024 toward a ~EUR200m run-rate'
    - Strong EU regulatory tailwind as fossil-fuel boilers are phased out across Europe
  topRisks:
    - 'Private and opaque: revenue quality, gross margin, unit economics, cash and runway are undisclosed'
    - Subsidy-dependent demand in a market that fell sharply in 2023-2024 when incentives were cut
    - >-
      Capital-intensive and loss-making (operating loss widened to ~SEK1,238m in 2024), requiring sustained follow-on
      funding
    - Competitive pressure from Octopus Energy and OEM incumbents that could replicate the subscription model
  unresolvedGaps:
    - Gross margin and unit economics (cost per installation, payback, LTV) not disclosed
    - Cash on hand, burn rate and runway not disclosed
    - Customer count, churn, renewal and net-revenue-retention unavailable
    - Valuation figures conflict across sources (~EUR1.8B vs ~USD1.2B); latest priced-round terms unconfirmed
