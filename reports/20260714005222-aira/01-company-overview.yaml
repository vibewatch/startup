   ]
  },
  {
   "id": "milestones-adverse",
   "title": "Milestones and adverse signals",
   "body": "The chronology of record shows a rapid march from founding in 2022 to product launch in 2024 and platform expansion in 2025. Alongside the growth, adverse signals are visible: Aira's reported 2024 operating loss widened to roughly SEK 1,238 million (about EUR108 million) even as revenues tripled, underscoring the cash intensity of the land-grab strategy. Aira is private and does not publish audited group revenue, profit or customer counts, so several headline metrics rest on company statements or third-party estimates rather than filings. Taken together, the milestone record demonstrates strong momentum and investor support, tempered by widening losses, undisclosed unit economics and a fresh leadership team carrying the execution burden.",
