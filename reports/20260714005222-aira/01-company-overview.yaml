   ]
  },
  {
   "id": "funding-valuation",
   "title": "Funding, valuation and investors",
   "body": "Aira has assembled one of Europe's largest residential-electrification war chests. Public reporting describes a EUR145 million Series B in January 2024, an approximately EUR218 million debt facility in June 2024, a EUR63 million equity top-up in October 2024, and a headline EUR150 million equity round in August 2025 that reportedly valued the company at around EUR1.8 billion. Cumulative funding is reported at roughly EUR621 million, though estimates vary between sources from about EUR393 million upward, a discrepancy that itself warrants reconciliation. Backers include Altor, Kinnevik, Temasek, Kallskar, Lingotto and Statkraft Ventures; Temasek's 2025 ticket was reported near $163.5 million. The mix of sovereign-linked, listed and specialist climate capital signals strong investor conviction but also a dependence on continued external financing.",
   "claimRefs": [
    "CO012",
    "CO013",
    "CO014",
