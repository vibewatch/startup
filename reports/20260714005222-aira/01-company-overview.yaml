 "chapter": {
  "number": 1,
  "title": "Company Overview",
  "summary": "Aira is a Stockholm-based, Vargas-founded clean energy scale-up that sells subscription heat pumps and home energy systems across the UK, Germany and Italy; it has raised roughly EUR621 million, is reportedly valued near EUR1.8 billion, and is transitioning leadership while absorbing widening losses."
 },
 "sections": [
  {
   "id": "identity-and-model",
   "title": "Identity, model and stage",
   "body": "Aira is a Stockholm-headquartered clean energy-technology company founded in 2022 by the Swedish impact-investment group Vargas Holding, the same builder behind Northvolt and H2 Green Steel. It sells residential air-source heat pumps and, from late 2025, an integrated home energy system spanning solar, battery storage and inverters. Aira's distinguishing commercial model is an all-inclusive monthly subscription that removes upfront cost and bundles installation, servicing and a 15-year comfort guarantee. Having raised hundreds of millions of euros, built its own factory and reached an approximately EUR200 million run-rate, Aira is best understood as a late-stage, capital-intensive private scale-up rather than an early-stage startup, targeting the replacement of fossil-fuel heating across European homes.",
   "claimRefs": [
    "CO001",
    "CO002",
    "CO003",
    "CO004",
    "CO005",
    "CO030",
    "CO036"
   ],
   "tableRefs": [
