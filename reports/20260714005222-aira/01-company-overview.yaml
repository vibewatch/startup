  },
  {
   "id": "scale-operations",
   "title": "Scale, operations and manufacturing",
   "body": "Aira has vertically integrated faster than most heat-pump peers. It launched commercially in mid-2023, entered the UK in November 2023, and now operates in the UK, Germany and Italy through 18 regional hubs with roughly 1,200 employees. In June 2024 it opened a 220,000 square-metre factory in Wroclaw, Poland, backed by about EUR300 million of investment and designed for up to 500,000 heat pumps per year, complemented by Swedish R&D in Helsingborg. In the UK it has committed around GBP300 million, including training academies to address the installer shortage. This owned manufacturing and installation base is a genuine differentiator, but it makes Aira structurally capital-hungry and sensitive to volume and utilisation.",
   "claimRefs": [
    "CO022",
    "CO023",
