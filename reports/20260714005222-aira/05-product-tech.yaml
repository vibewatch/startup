    "FE003"
   ]
  },
  {
   "id": "maturity-roadmap",
   "title": "Maturity, differentiation and roadmap",
   "body": "Product maturity is uneven by design. The heat pump is a shipping, mature product with a track record, whereas the Home Energy System, battery and inverter range only launched in late 2025 and are earlier in their reliability curve. Customer reports already note occasional app or software glitches and system teething issues after installation, and bundling solar, battery and heat pump raises integration risk if any subsystem underperforms. Aira's differentiation rests on manufacturing know-how, an owned supply chain, and a proprietary AI and data platform whose optimisation should, in principle, improve as more homes are connected, creating a data-driven moat. The roadmap extends the same subscription from heat pumps to solar, battery, EV charging and insulation, with the Home Energy System rolling out across Europe through 2026. Whether the emerging software moat and multi-product integration hold up in the field is the key open technical question.",
