  {
   "id": "home-energy-system",
   "title": "Home Energy System and software",
   "body": "In November 2025 Aira launched a fully integrated Home Energy System that combines solar panels, the Aira Power Store battery, the Aira Power Hub hybrid inverter and the heat pump, all orchestrated by proprietary software called Aira Intelligence. The Power Store banks surplus solar or cheap off-peak grid electricity, while the Power Hub acts as the central manager that routes and converts power between solar, battery, heat pump and grid, enabling load-shifting and grid interaction. Aira Intelligence learns household routines, weather and electricity prices to optimise consumption, and an accompanying app gives real-time visibility of production, storage and use. The system is modular and can be retrofitted to existing solar through the Power Hub, and Aira claims the full stack can cut household energy bills by up to around 90%. The single-vendor, integrated design is pitched as avoiding the complexity of multi-brand, piecemeal installations.",
   "claimRefs": [
    "CE006",
    "CE007",
    "CE008",
    "CE009",
