  {
   "id": "operating-model",
   "title": "Operating model and manufacturing",
   "body": "Aira's defining technical characteristic is deep vertical integration. It designs its own hardware, manufactures at a Poland factory spanning roughly 220,000 square metres with capacity for about 500,000 heat pumps a year, installs with its own teams, and services equipment under warranty. It runs installer academies to train and certify its workforce, addressing the industry-wide shortage of skilled heat-pump installers. This lets Aira control the customer workflow end-to-end, from survey and design through installation, commissioning, AI-driven optimisation and long-term service. The manufacturing scale-up underpins its ability to control quality and unit cost of the hardware stack, and the owned supply chain is a barrier that competitors relying on third-party manufacturers and installers lack. Combined with the proprietary software layer, vertical integration and manufacturing know-how are Aira's clearest sources of differentiation against commodity heat-pump vendors.",
   "claimRefs": [
    "CE013",
    "CE014",
    "CE015",
