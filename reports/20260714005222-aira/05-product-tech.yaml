  },
  {
   "id": "trust-compliance",
   "title": "Trust, safety and compliance",
   "body": "Because Aira sells a fifteen-year comfort guarantee covering parts, labour and maintenance, product trust and compliance are central to the model. The use of R290 propane, while efficient and low-GWP, is flammable (safety class A3), so design and installation must meet strict refrigerant-safety standards, and installation quality depends on the competence of Aira's in-house teams and any subcontractors. In the UK, installations must meet MCS certification to qualify for the Boiler Upgrade Scheme grant, tying product compliance directly to customer economics. Aira's adoption of a low-GWP refrigerant aligns it with F-gas phase-out regulation, and in-house manufacturing supports consistent quality control. These controls matter because the integrated system introduces more components that must all perform, raising the importance of reliable commissioning and after-sales support.",
   "claimRefs": [
    "CE016",
    "CE017",
    "CE018",
    "CE026",
    "CE032",
