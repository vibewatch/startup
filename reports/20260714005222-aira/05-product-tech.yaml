 "chapter": {
  "number": 5,
  "title": "Product & Technology",
  "summary": "Aira delivers a warm home as a service: an R290 air-source heat pump (SCOP ~4.7, A+++) installed and serviced on a 15-year subscription, now extended into a Home Energy System pairing solar, the Power Store battery and Power Hub inverter under proprietary Aira Intelligence software. Deep vertical integration (own Poland factory, installer academies, end-to-end workflow) and a low-GWP refrigerant are its core differentiation, while newly launched multi-component systems carry integration and reliability risk."
 },
 "sections": [
  {
   "id": "product-def",
   "title": "Product definition and hardware",
   "body": "In customer terms, Aira's product is a warm home delivered as a service: a residential air-source heat pump is installed and maintained under an all-inclusive subscription, so the homeowner buys comfort rather than equipment. The heat pump uses R290 propane, a low-GWP natural refrigerant, and reports a SCOP of about 4.7 at 35C with an A+++ efficiency rating, placing it among premium units on paper. Aira offers outdoor units in several capacities, commonly around 6, 8 and 12 kW, so systems can be sized to different homes, and it markets acoustic design for quiet residential operation. Its hardware is positioned for cold-climate performance suited to Northern European conditions. The move to R290 is strategically important because it aligns Aira with tightening F-gas rules that phase out high-GWP refrigerants, turning a compliance requirement into a marketing and durability advantage over legacy equipment.",
   "claimRefs": [
    "CE001",
    "CE002",
    "CE003",
