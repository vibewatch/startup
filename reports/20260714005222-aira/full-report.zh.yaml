            body: >-
              决定竞争的不是盒子，而是商业模式。Aira 和 Octopus 都靠垂直整合、直接客户关系和嵌入式融资竞争，而既有厂商基本缺少这些能力。Aira
              拥有制造、内部安装团队、培训学院、融资和长期保障，带来有意义的切换成本和锁定；在资本密集市场中，其挑战者里资金最充足的地位也是优势。不过，Aira
              的护城河更多来自服务质量和融资经济性，而不是硬件独特性；硬件本身容易商品化。Octopus 拥有庞大的能源零售客户基础和更强获客能力，OEM
              既有厂商则保留品牌信任、安装商网络和规模。最明确的替代风险，是这些大玩家直接复制订阅和直面消费者模式。
