            body: >-
              2025 年 11 月，Aira 发布全整合 Home Energy System，把太阳能板、Aira Power Store 电池、Aira Power Hub 混合逆变器和热泵组合在一起，并由名为 Aira
              Intelligence 的自研软件统一编排。Power Store 存储多余太阳能或低价离峰电网电力；Power Hub
              作为中央管理器，在太阳能、电池、热泵和电网之间分配并转换电力，实现负荷转移和电网互动。Aira Intelligence
              学习家庭作息、天气和电价来优化用电，配套应用则实时展示发电、储能和使用情况。该系统是模块化的，可通过 Power Hub 改造接入既有太阳能系统；Aira 称整套系统可将家庭能源账单最多降低约
              90%。单一供应商的一体化设计，卖点是避免多品牌、拼凑式安装的复杂性。
