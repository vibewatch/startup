      - number: '7.2'
        title: 运营、质量与供应风险
        blocks:
          - type: paragraph
            body: >-
              Aira 的重资产、垂直整合模式集中了运营风险。Poland 制造扩张带来执行和利用率风险：年产约 500,000 台热泵的产能，只有被需求填满才是资产；若政策驱动的需求下滑，工厂会被低利用率拖累。业务依赖
              R290 制冷剂、逆变器和半导体部件，以及熟练安装工的供应；任何一项都可能扰乱产出。R290
              丙烷可燃，对安装、选址和安全合规提出严格要求；安全事故概率虽低，但影响会很高。客户直接证明的最常见运营质量问题，是安装质量不稳定、依赖分包商，以及偶发应用和软件可靠性问题。Aira
              销售的是长期服务，因此这些运营和质量风险会在合同生命周期内复利，而不是在销售时点结束；稳定执行是持续要求，不是一次性要求。
