    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与阶段
        blocks:
          - type: paragraph
            body: >-
              Aira 总部位于 Stockholm，是一家清洁能源技术公司，2022 年由瑞典影响力投资集团 Vargas Holding 创立；Vargas 也是 Northvolt 和 H2 Green Steel
              背后的同一批产业搭建者。Aira 销售住宅空气源热泵，并从 2025 年末起推出覆盖太阳能、电池储能和逆变器的一体化家庭能源系统。公司最突出的商业设计，是用全包月度订阅免去前期成本，把安装、维护和 15
              年舒适保障打进同一份合约。Aira 已融资数亿欧元，自建工厂，年化收入约 EUR200 million。更准确地说，它不是早期初创公司，而是一家后期、资本密集型私营规模化公司，目标是替换欧洲家庭里的化石燃料供暖。
