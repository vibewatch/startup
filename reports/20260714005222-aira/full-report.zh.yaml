  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管既是 Aira 最大的顺风，也是最大的风险。上行方向，EU EPBD 和 F-gas 规则淘汰化石燃料锅炉和高 GWP
              制冷剂，结构性利好热泵。下行方向，需求对补贴极其敏感；历史上，补贴退出会触发销量急跌。Germany 的供暖法（GEG）改革让 Aira 最大市场的补贴水平存在不确定性，Italy 的 Superbonus
              退坡也说明国家政策转向会削弱需求。在 UK，从 2026 年 4 月起，安装必须获得 MCS 认证，才能符合 Boiler Upgrade Scheme 和 Clean Heat Market Mechanism
              credits；MCS 规则会收紧，设计和文档要求更严格；从 2026 年 5 月起，MCS 020(a) 噪声评估还会增加许可开发步骤。补贴合规错误可能导致补贴失效并引发纠纷，15
              年保障也带来长尾保修和消费者保护责任。需求集中在少数监管敏感市场，会放大政策暴露。
            claimRefs:
