      - number: '2.5'
        title: 波动与规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场的核心特征，是长期结构性需求很强，但短期销量波动很大。2024 年收缩让行业损失至少 4,000 个直接岗位，Germany 下滑 48%，France 下滑 39%，而 UK 逆势增长
              63%。市场规模估算也因范围不同而分化，从约 $13.4 billion 的 2026 年住宅口径，到更大的全细分市场数字，因此任何单一头条数都应谨慎看待。更广义的清洁技术私营企业估值约 3.7x
              EV/revenue，可粗略锚定投资人当前如何给重硬件能源企业定价。规模测算最大的下行风险是补贴退出；历史上，这会触发需求急跌，并直接压缩 Aira 的可服务市场，放慢支撑长期投资论点的锅炉替换周期。
            claimRefs:
