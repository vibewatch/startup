      - number: '3.4'
        title: 负面信号与定位
        blocks:
          - type: paragraph
            body: >-
              Aira 的竞争故事并非没有裂缝。独立评论和房主论坛提到安装协调与分包问题；也有客户公开质疑，长期订阅相比直接拥有一台热泵是否划算。这两点都可能侵蚀 Aira 所依赖的服务质量优势。Aira 在 UK 最直接对上
              Octopus，而 OEM 既有厂商主导欧洲大陆份额，因此它必须在拥挤市场里靠执行取胜。Aira 的定位是高端、高服务，而非最低价，这会限制其对最看重成本、以廉价燃气锅炉为锚的买家的吸引力。工厂、学院、融资和
              15 年保障的组合确实少见，但单个要素都不可单独防守，所以持续执行才是真正护城河。
