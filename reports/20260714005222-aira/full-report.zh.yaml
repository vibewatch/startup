  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与硬件
        blocks:
          - type: paragraph
            body: >-
              从客户视角看，Aira 的产品是「作为服务交付的温暖家庭」：住宅空气源热泵以全包订阅安装和维护，房主买的是舒适，而不是设备。热泵使用 R290 丙烷这种低 GWP 天然制冷剂，在 35C 下报告 SCOP 约
              4.7，能效评级 A+++，纸面上属于高端机型。Aira 提供多种容量的室外机，常见约 6、8 和 12 kW，可适配不同房屋；同时强调声学设计，适合安静住宅场景。其硬件定位于适合北欧条件的寒冷气候性能。转向
              R290 具有战略意义，因为它让 Aira 顺应逐步淘汰高 GWP 制冷剂的 F-gas 规则，把合规要求转化为相对传统设备的营销和耐久优势。
