      - number: '2.2'
        title: 多个视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              衡量机会规模不能只看一个口径。按年度支出，欧洲住宅热泵市场 2026 年约为 $13.4 billion，预计到 2035 年以约 20.3% CAGR 增至约 $71.2 billion。按销量，2025 年
              16 个主要欧洲市场销售约 2.62 million 台住宅设备，同比增长约 10%。按装机存量，累计替换机会要对照约 130 million
              台锅炉，意味着未来几十年是数千亿欧元级别的市场。放在这些口径下，Aira 可服务市场是 UK、Germany 和 Italy 的住宅空气源热泵子集；其约 EUR200 million
              年化收入只代表低个位数份额，上行空间很大，也说明公司距离最终奖池仍处早期。
