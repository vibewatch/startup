      - number: '3.5'
        title: 既有厂商集中度与渠道动态
        blocks:
          - type: paragraph
            body: >-
              挑战者对决之外，市场结构本身也决定 Aira 的胜算。Daikin、Bosch 和 Vaillant
              合计控制欧洲热泵份额中的一大块，规模远超任何单一挑战者，带来采购规模、分销覆盖和品牌认知；年轻公司很难快速追上。但它们的市场进入路径也是弱点：它们依赖碎片化的 MCS
              认证本地安装商，产能、质量和价格差异很大，而这正是 Aira 用内部安装和学院模式想要消除的摩擦。NIBE 锚定 Nordic 和 Baltic 地区，Mitsubishi Electric
              则主打寒冷气候可靠性，因此区域强势并不均匀。对 Aira 来说，竞争威胁并非铁板一块：即便既有厂商保持总体销量领先，Aira 仍能靠服务和融资执行在局部市场胜出。开放问题是，在 Aira
              模式形成可防守密度前，既有厂商是否会把规模动员进直接、订阅式方案。
