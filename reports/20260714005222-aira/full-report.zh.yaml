      - number: '7.5'
        title: 缓释、触发点与监测
        blocks:
          - type: paragraph
            body: >-
              尽调中，风险可以压缩成少数打破投资论点的触发点和监测指标。第一个否决触发点，是补贴取消带来的热泵需求持续崩塌，这会破坏整个收入爬坡。第二个，是规模增长后仍无法达到正单位经济，说明订阅模式不能把销量转化为利润。第三个，是资本密集模式无法获得后续融资。面对这些风险，Aira
              的缓释因素——安装工学院、早期采用 R290 和市场多元化——能降低但不能消除暴露；长期看，锅炉淘汰带来的监管顺风会部分抵消补贴退出风险。监测面板应跟踪补贴政策变化，特别是 Germany GEG
              设计；还应跟踪安装工产能指标，以及 Trustpilot 满意度趋势，将其作为安装执行的早期预警。这些指标给投资人提供了具体、可观察的信号，可用于持续检验投资论点。
