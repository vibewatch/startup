              波兰政府补助支持。垂直整合让 Aira
              能拿回制造、安装和融资环节的利润，而竞争者通常要与第三方分配这些利润；但资本也因此前置：硬件、安装人工和工厂资本开支都发生在订阅收入累积之前。因此，这个模式资本密集、依赖融资，带来显著的营运资本和现金消耗需求。现金余额、月度现金消耗和资金续航均未披露，资本充足性无法独立验证。UK
              的负担能力受到 GBP 7,500 Boiler Upgrade Scheme 补贴帮助，但核心财务风险仍是：一家依赖融资、亏损中的公司，承载着 EUR 1.8 billion 估值。
