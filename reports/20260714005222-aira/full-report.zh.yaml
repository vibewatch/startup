        title: 规模、运营与制造
        blocks:
          - type: paragraph
            body: >-
              Aira 的垂直整合速度快过多数热泵同行。公司 2023 年中商业化，2023 年 11 月进入 UK，如今通过 18 个区域中心在 UK、Germany 和 Italy 运营，员工约 1,200 人。2024
              年 6 月，Aira 在 Poland 的 Wroclaw 启用一座 220,000 平方米工厂，背后投入约 EUR300 million，设计年产能最高 500,000 台热泵，并由 Helsingborg
              的瑞典 R&D 体系补足。Aira 在 UK 承诺投入约 GBP300 million，其中包括培训学院，用来缓解安装工短缺。自有制造和安装体系是真正的差异化，但也让 Aira
