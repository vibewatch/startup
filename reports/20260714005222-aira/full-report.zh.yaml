            body: >-
              Aira 已经攒起欧洲住宅电气化领域最大的一批弹药。公开报道显示，公司在 2024 年 1 月完成 EUR145 million B 轮融资，2024 年 6 月获得约 EUR218 million
              债务工具，2024 年 10 月追加 EUR63 million 股权融资，并在 2025 年 8 月完成一轮名义 EUR150 million 股权融资；该轮据报道将公司估值推至约 EUR1.8
              billion。累计融资额被报道为约 EUR621 million，不过不同来源给出的估算从约 EUR393 million 起跳，差异本身就需要核对。投资方包括
