            body: >-
              Aira 收入扩张很快，亏损也在扩大。经营收入从 2023 年约 SEK 61 million 增至 2024 年超过 SEK 175 million，约增长三倍；年化收入据报道在 2025-2026 年达到约
              EUR 200 million，部分估算接近 USD 233 million。与之相对，经营亏损从前一年的约 SEK 437 million 扩大到 2024 年约 SEK 1,238
              million。这是典型的高增长、重增长轻利润财务画像：收入在复合增长，但随着 Aira 投入制造、安装产能和员工，亏损绝对额扩张更快。累计亏损规模让达到盈亏平衡的时间线成为合理问题，而公司尚未披露答案。由于
              Aira 是私营公司，唯一硬财务数据来自瑞典年度账目；安装台数、活跃订阅等单位级指标并未持续公开。
