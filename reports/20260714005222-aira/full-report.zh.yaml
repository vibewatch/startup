              Aira 是欧洲资本最充足的热泵公司之一。公司在 2024 年 10 月融资 EUR 63 million，又在 2025 年 8 月完成 EUR 150 million 股权融资，为迄今最大一轮；到 2024
              年末，累计股权融资约达到 EUR 270 million。若计入债务和资产融资工具，总融资额据报道超过 EUR 621 million。其投后估值估计约 EUR 1.8
              billion，不过部分数据提供商给出较低数字，约 USD 1.2 billion，说明私营公司的估值存在真实不确定性。投资方组合质量高，覆盖 Altor、Kinnevik、Temasek、Kallskar 和
              Lingotto，也改善了后续融资可及性。这些支持方愿意继续资助一家资本密集、亏损中的公司，本身就是信号；但这也意味着，在订阅现金流成熟前，股权故事依赖持续外部融资。
