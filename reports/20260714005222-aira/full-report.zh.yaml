  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与来源
        blocks:
          - type: paragraph
            body: >-
              Aira 的核心收入引擎是月度订阅：把热泵、安装、持续维护和嵌入式融资打包成一笔全包费用，房主无需支付前期成本。原本一次性的大额资本购买，因此被转成一条长期经常性收入流，合同通常最长可达 15
              年。供暖之外，Aira 现在销售并安装太阳能板、电池储能和一体化 Home Energy
              System，扩大经常性收入基座，也提高单户收入。维护和保养被放进订阅里变现，而不是另签服务合同，从而增加一层粘性的服务收入。多年订阅的收入确认很可能会把硬件价值分摊到合同期，而不是在安装时一次性入账；这会平滑报表收入，但现金支出前置。清晰的方向，是从销售单一热泵转向多产品、更高价值的家庭能源系统。
