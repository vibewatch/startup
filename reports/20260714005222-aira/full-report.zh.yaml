              核心客户风险集中在安装环节。反复出现的投诉包括安装延误、工作未完成或现场凌乱；明明承诺使用 Aira
              内部团队，却动用分包商；安装前沟通差、信息互相冲突；调试后应用或软件故障及早期磨合问题。部分反馈还显示，产品系列可能不适合非常大的住宅或保温较差的住宅，这是实质性的产品适配限制。由于安装体验质量在客户之间差异明显，而合同承诺周期又很长，稳定的入户交付执行是决定客户信任和耐久度的关键。强售后和可变安装质量结合在一起，使从勘测到调试的入户交付时刻成为单一最重要节点：它决定客户会成为满意的
