      - number: '7.4'
        title: 人才、执行与战略风险
        blocks:
          - type: paragraph
            body: >-
              Aira 所处增长阶段抬高了执行和人才风险。公司在 2025 年 5 月更换 CEO，从创始 CEO Martin Lewerth 切换到 Peter
              Prem；在关键规模化阶段，这是领导连续性风险。员工数快速突破 1,200，拉紧组织和质量控制能力；整个行业还面临训练有素的热泵安装工结构性短缺，直接限制部署。战略上，Aira 面对资金充足的 Octopus
              Energy 和规模化 OEM 既有厂商，后者可能复制其订阅和直面消费者模式。部分风险被 Aira 自有安装工学院和内部员工队伍、赶在 F-gas 期限前早期采用低 GWP R290，以及覆盖
              UK、Germany、Italy 和 Nordics 的多市场布局缓解；多市场布局也对冲单一国家政策冲击。即便如此，领导交接、快速扩张和竞争激烈且耗资本的市场叠加起来，仍是高要求的执行环境。
