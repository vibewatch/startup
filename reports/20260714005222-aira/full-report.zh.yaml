      - number: '2.3'
        title: 买家、细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              核心买家是替换报废锅炉的个人自住房房主：预算由他们承担，切换决定也由他们做出。新建住宅是结构性增长细分，因为所有 EU 新建筑到 2030 年必须实现零排放；房东和出租房存量采用更慢，主要受监管压力驱动。Aira
              的零前期成本订阅，明确瞄准改造型买家面对高安装账单时的负担能力障碍；Home Energy System 还让公司能向太阳能和电池用户交叉销售。空气源热泵主导细分市场，占欧洲市场约 72%，在住宅中份额约
              63%，因为它比地源方案更便宜、安装更简单。
            claimRefs:
              - CM007
              - CM008
              - CM025
              - CM026
              - CM018
              - CM034
