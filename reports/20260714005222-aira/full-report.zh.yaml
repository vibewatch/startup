      - number: '7.3'
        title: 财务与模式风险
        blocks:
          - type: paragraph
            body: >-
              Aira 的财务风险画像，是一家快速扩张但仍亏损的资本消耗者。2024 年经营亏损扩大；资本密集模式需要持续外部资金，直到订阅现金流成熟。如果无法获得后续融资，风险将是生存级。Aira
              以长期合约为硬件融资，也承担客户付款的信用和损失暴露；随着账本扩大，这项风险同步增长。分析师指出，热泵企业面临安装人工成本和补贴波动带来的利润率压力；电价与气价差也强烈影响需求和单位盈利能力。因此，核心风险簇是亏损财务与监管敏感、价格敏感需求的叠加：若需求转弱而公司仍在烧钱，融资续航和实现正单位经济的路径会同时承压。正是这种相互作用，而不是任何单一风险，定义了
              Aira 的下行。
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR020
              - CR021
              - CR035
