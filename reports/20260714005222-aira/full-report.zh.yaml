  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Aira 所处的是欧洲住宅供暖市场，更精确地说，是面向房主、用于替换化石燃料锅炉的空气源热泵市场。这个市场不包括商业和工业热泵，也不包括区域供热；但如今纳入了 Aira 通过 Home Energy System
              打包的家庭太阳能、电池储能和逆变器。关键替代品并不是另一个热泵品牌，而是欧洲约 130 million 台化石燃料锅炉的既有存量，以及锅炉坏掉后直接再换一台燃气锅炉的选择。家庭供暖常被描述为贡献了 EU CO2
              排放的约 10%，因此监管者把这轮替换周期视为战略重点；市场边界也由锅炉退役速度决定。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM037
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
