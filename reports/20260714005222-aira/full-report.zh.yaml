          - type: paragraph
            body: >-
              投资论点是，Aira 有机会拿下欧洲住宅电气化：垂直整合把链条握在手里，订阅模式创造锁定和高生命周期价值，制造与安装规模又是依赖第三方的竞争对手缺少的能力；EU
              逐步淘汰化石燃料锅炉，也带来监管顺风。Altor、Kinnevik、Temasek
              等顶级投资方增强了这一论点，既提高后续融资可得性，也增加退出选择。反论点同样成立：热泵硬件会商品化，补贴会让需求剧烈摆动，订阅模式也可能永远跑不出盈利的单位经济，最后留下一个持续烧钱、长期依赖外部融资的亏损业务。关键在于，从这里开始，主要回报驱动不是倍数继续扩张，而是有纪律地执行，把规模转成利润率；倍数已经给满。正论点还是反论点胜出，几乎完全取决于目前仍未披露的利润率证据。
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV032
              - CV033
              - CV040
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV031
              - CV033
      - number: '8.3'
        title: 融资背景与情景
        blocks:
          - type: paragraph
            body: >-
              Aira 在 2025 年 8 月完成 EUR 150 million 融资，这是公司迄今最大一轮；股权和融资额度合计已超过 EUR 621 million，因此眼下资本较充足。不过，后期入场仍带有
              pre-IPO 轮常见的稀释风险和清算优先权堆叠风险。估值倍数偏紧、利润率未披露，也让入场纪律更难把握。结果可用三种情景框定。牛市情景概率约四分之一：EU 锅炉禁令推动大规模采用，监管顺风支撑 Aira
              收入复利增长，走向数十亿级结果。基准情景概率约一半：收入稳步增长，估值大体跟随收入，经济性缓慢改善。熊市情景概率约四分之一：补贴驱动的需求坍塌，持续亏损迫使公司 down round。如果 Aira 在达到
              breakeven 前市场转弱，down round 确实可信；因此，尽管战略叙事很强，情景权重并未明显偏正面。
            claimRefs:
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV038
          - type: table
            tableRef: TV003
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV038
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV016
              - CV015
              - CV014
      - number: '8.4'
        title: 可比估值
        blocks:
          - type: paragraph
            body: >-
              Aira 的估值更适合放在欧洲私人电气化同业中看，而不是对标上市 OEM。Octopus Energy 兼有热泵和能源零售业务，估值已达数十亿级，规模远大于 Aira；德国住宅太阳能和能源公司 Enpal 估值约
              EUR 2.4 billion；欧洲家庭能源平台 1KOMMA5 也达到约 EUR 1 billion。这些私人同业受政策顺风支撑，按远期增长交易；Daikin、NIBE 等上市热泵 OEM
              的收入倍数则更低。因此，Aira 的估值落在硬件 OEM
              倍数和更高的软件或能源平台倍数之间；对一个垂直整合、资金最充足的挑战者来说可以辩护，但几乎不留犯错空间。由于私人同业估值是带时间差的估计，且业务组合不同，可比组只能给方向，尽调时应补充最新交易证据。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV022
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV034
              - CV035
              - CV024
              - CV032
      - number: '8.5'
        title: 触发器、退出与尽调问题
        blocks:
          - type: paragraph
            body: >-
              这笔投资应由明确的论点失效触发器约束：核心市场出现补贴驱动的需求坍塌、公司无法证明通往正向单位经济的可信路径、融资市场断裂并阻断下一轮融资；任一项都会打破投资论点。退出准备度偏中期；只有盈利能力变得可信后，IPO
              或战略出售才有可能，因此这是一笔多年持有，而不是近期转手。估值对假设的稳态毛利率高度敏感，而该指标尚未披露；在政策驱动波动下，收入增长能持续多久同样关键。因此，最终尽调问题应集中在单位经济包、现金与
              runway、cohort 留存，并补充按市场拆分的补贴敞口，以及 cap table 与优先权结构。需要跟踪的核心投资 KPI 是收入 run-rate、毛利率、burn、CAC
              与回收期、补贴政策。归根结底，估值能否成立，取决于目前尚未披露的证据能否证明订阅经济性在规模化后转为盈利。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV034
              - CV035
              - CV036
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV038
          - type: table
            tableRef: TV006
            claimRefs:
              - CV028
              - CV034
              - CV036
              - CV013
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV004
              - CV029
              - CV010
              - CV005
              - CV003
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 跟踪，不放弃
            body: 强战略位置和顶级资本背书支持继续跟踪，但约 9x 的偏高倍数和未披露经济性，使今天无法下投资结论。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
          - type: callout
            title: 估值取决于未披露的利润率数据
            body: 投资论证取决于证据能否证明订阅经济性在规模化后转为盈利；这部分尚未公开。
            calloutType: risk
            claimRefs:
              - CV040
              - CV034
          - type: callout
            title: 情景权重均衡
            body: 牛市 / 基准 / 熊市约 25/50/25；如果市场在 breakeven 前转弱，down round 是可信情景。
            calloutType: assumption
            claimRefs:
              - CV015
              - CV038
