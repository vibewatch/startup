      - number: '6.2'
        title: 采用轨迹与部署
        blocks:
          - type: paragraph
            body: >-
              由于需求大体受政策支持，Aira 的增长更受部署产能限制，而不是客户兴趣。为了扩张，公司承诺向 UK 投入约 GBP 300 million，并开设安装工培训学院，包括 Sheffield
              设施，用来认证把家庭大规模转化所需的安装工。Aira
              后来把学院开放给独立安装商，把部署网络延伸到内部团队之外，并回应全行业熟练安装工短缺。这个产能建设是采用轨迹的核心：订阅移除了负担能力障碍，但只有训练有素的安装队伍才能把可触达家庭变成已安装、产生收入的客户。因此，漏斗从约
              130 million 个可触达欧洲家庭开始，经过 UK 服务 5 million 户的目标，下沉到今天可能已经安装并运行的数万户家庭；附加产品扩张则是正在出现的最后阶段。
