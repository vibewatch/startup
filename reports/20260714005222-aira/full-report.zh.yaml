  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >-
              Aira 的客户是欧洲住宅房主，他们把化石燃料供暖替换为电热泵；多数情况下，买家、用户和付款人都是同一个人，即自住房业主。公司主要在 UK、Germany、Italy 和 Nordics
              销售，也有部分房东需求；定位是大众市场，而非狭窄的高端小众市场。战略可触达基座，是欧洲约 130 million 套仍使用化石燃料锅炉的住宅，监管正在推动它们退出燃气和燃油；在 UK，Aira 曾表示目标最多服务
              5 million 户家庭。需求由 EU 淘汰化石锅炉的规则支撑，也由订阅模式本身支撑，因为它移除了通常阻止房主切换的前期成本。结果是一个规模大、监管驱动的大众市场客户机会；约束不在认知，而在负担能力和安装执行。
