      - number: '3.2'
        title: 产品与定价对比
        blocks:
          - type: paragraph
            body: >-
              在硬件上，Aira 把自己放在高端、高效率位置：其 R290 机型在 35C 下报告 SCOP 约 4.7，能效评级 A+++，并提供 15 年舒适保障；相比之下，Octopus Cosy 6 公布的 SCOP
              约 3.4，保修 8 年。Vaillant aroTHERM Plus 报告更高的 SCOP，接近 5.03，Worcester Bosch 最高提供 12 年保修。因此，Aira
              并非在每个指标上都唯一领先，而且效率声明的测试条件不同。定价上，差异是结构性的。既有厂商通过安装商销售设备，服务合同另算；Octopus 借助融资和利用 GBP7,500 Boiler Upgrade
              Scheme 补贴的 Zero Bills 方案，提供零前期安装；Aira 则采用零前期成本、打包维护的全包月度订阅。
