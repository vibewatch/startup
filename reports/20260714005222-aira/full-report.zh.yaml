      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              这个市场的结构性驱动来自监管：EU 在 2025 年结束对独立化石燃料锅炉的补贴，2026 年起禁止新住宅安装新燃气锅炉，2030 年要求新建建筑零排放，并以 2040
              年全面淘汰化石供暖为目标。国家补贴继续加码，Germany 最高可覆盖 70% 成本。约束同样真实。Germany 电价与气价之比约
              3.2x，意味着热泵要明显更便宜地运行仍依赖补贴；前期安装成本仍是门槛，安装工产能也稀缺。2024 年 14 个市场销量下滑约 22%，已经证明需求对政策高度敏感；2026
              年初的反弹信号令人鼓舞，但还不足以证明复苏可持续。
