              Aira 销售覆盖零部件、人工和维护的 15 年舒适保障，因此产品信任和合规位于模式核心。R290 丙烷高效且低 GWP，但可燃（安全等级 A3），所以设计和安装必须满足严格的制冷剂安全标准；安装质量取决于
