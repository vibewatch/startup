  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图
        blocks:
          - type: paragraph
            body: >-
              Aira 面对的是分层竞争。最大的结构性竞争者，是化石燃料锅炉的现状：房主只要把坏掉的燃气锅炉换成另一台便宜设备即可。在热泵玩家中，成熟原始设备制造商主导销量：Daikin 在欧洲以约 18-20%
              份额领先，Bosch 约 10-12%，Vaillant 约 8-10%，NIBE 约 5-7%，Mitsubishi Electric 也在前五。这些既有厂商通过碎片化的 MCS
              认证本地安装商网络销售。Aira 最接近的战略类比是 Octopus Energy，后者把自研 Cosy 6 热泵直接卖给 UK 消费者。与此同时，以太阳能起家的安装商如 Enpal
              也成为相邻进入者，把热泵打包进家庭能源方案；Aira 也已经通过 Home Energy System 进入这个空间。
