      - number: '1.2'
        title: 领导层、创始方与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Aira 的领导层是「搭建者 + 运营者」结构。Vargas 和金融家 Harald Mix 提供创始资本、战略和工业化打法。Martin Lewerth 在 2022 年至 2025 年 5 月担任创始
              CEO；随后，Peter Prem 升任集团 CEO，负责推进规模化阶段。Prem 曾在 Tetra Pak 任职 20 年，并自 2022 年起担任 Aira COO；Anthony Loizeau
              同时被任命为副 CEO。Lewerth 后来离开，转去领导 Cibes Lift Group。这个交接把执行风险压到一位新 CEO 身上，而 Aira
              正处在必须把重资本投入转成盈利增长的时点。董事会构成只披露了一部分，治理深度仍需尽调。上市投资方 Kinnevik 持续出现在股东名单中，至少提供了一层外部监督约束：Kinnevik
              必须向公众股东和分析师报告持仓，让尽调团队能通过一个定期发布的独立渠道观察这家原本不透明的私营公司。
