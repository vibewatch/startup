      - ["Cloud warehouses and regional operating entities", "Owned, leased, and acquired facilities", "Unknown; company claims over 11 million square metres and 100+ branches", "Site outage, integration failure, or local quality variance", "high", "Network control tower and acquisition-plus-build model are claimed", "High"]
