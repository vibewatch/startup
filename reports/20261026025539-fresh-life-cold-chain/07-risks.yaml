      - ["Capital providers", "Equity investors and other funding counterparties", "Terms and available liquidity undisclosed", "Funding terms or unavailable working capital disrupt expansion", "medium-high", "Historical B-round financing is reported", "Medium-high"]
    notes: "Counterparty identities, concentration, and contractual protections are largely undisclosed in the assigned pool; the table separates reported network scope from unverified dependency resilience."
    claimRefs: [CR002, CR003, CR004, CR005, CR013, CR014, CR015]
