  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Fresh Life's described operating model converts customer demand into physical cold-chain execution and potentially
      adjacent technology or infrastructure revenue, but public sources do not quantify the conversion.
    data:
      nodes:
        - id: demand
          label: Restaurant, retail, and food-producer demand
          detail: Customer need for source-to-store cold-chain service
        - id: contract
          label: Contracted service scope
          detail: Warehouse, transport, delivery, and service-level terms
        - id: network
          label: Cold-chain network execution
          detail: Vehicles, warehouses, branches, carriers, and dispatch
        - id: delivery
          label: Delivered orders and tonnes
          detail: Operational activity reported publicly; realized price unavailable
        - id: revenue
          label: Recognized logistics revenue
          detail: Requires reconciliation to billing, rebates, claims, and pass-through costs
        - id: gross-profit
          label: Gross profit after service-delivery costs
          detail: Requires line-level cost and margin disclosure
      edges:
        - from: demand
          to: contract
        - from: contract
          to: network
        - from: network
          to: delivery
        - from: delivery
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: >-
      Conceptual bridge based on described service mechanisms; no values, conversion rates, or margin assumptions are
      inferred.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI007
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Fresh Life's disclosed product architecture layers physical cold-chain capacity, connected data, AI workflow
      controls, and customer-facing visibility.
    data:
      layers:
        - label: Customer outcomes
          detail: Customer-facing fulfillment and traceability outcomes.
          items:
            - label: Source-to-store fulfillment
              detail: Restaurant, fresh-retail, and food-production customers receive coordinated cold-chain service.
            - label: Traceable delivery
              detail: Delivery calendars and signed-receipt photographs are described as customer-facing records.
        - label: Control tower
          detail: Visibility and exception-management surface for the operating network.
          items:
            - label: KPI visibility
              detail: Transport timeliness, cargo integrity, and temperature-compliance indicators are displayed.
            - label: Exception monitoring
              detail: People, vehicles, and goods are described as monitored across fulfillment.
        - label: AI workflow controls
          detail: Decision support and operational controls for dispatch, SOPs, and settlement.
          items:
            - label: Intelligent dispatch
              detail: Capacity matching and vehicle pricing use network and cost inputs.
            - label: AI-SOP and risk controls
              detail: Operational instructions and order, settlement, and fulfillment checks are modeled.
        - label: Data and IoT layer
          detail: Event records and connected assets provide inputs to the control layer.
          items:
            - label: Event data
              detail: Company-issued material claims more than 30 billion records in the Yunlizi system.
            - label: Connected assets
              detail: Company-issued material claims connected refrigerated trucks and cloud warehouses.
        - label: Physical operating network
          detail: Warehouses, vehicles, branches, and partner capacity deliver the physical service.
          items:
            - label: Warehouses and vehicles
              detail: Acquired, self-built, and partner capacity supports refrigerated storage and distribution.
            - label: Branch and route footprint
              detail: Public descriptions cite more than 100 branches and nationwide coverage.
        - label: Expansion layer
          detail: Adjacent technology, vehicle, warehouse, and overseas initiatives extend the operating model.
          items:
            - label: Technology and network extensions
              detail: Public material describes smart warehousing, vehicle design, and overseas supply-chain initiatives.
    approximationNotes: >-
      Layer order represents the disclosed operating logic, not a measured dependency graph or proof that every module
      is deployed at every site.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
  - id: FU001
    title: Customer journey from network access to expansion
    type: journey-map
    summary: >-
      The public evidence supports a staged customer workflow from segment need through network delivery and potential
      expansion, while retention and outcome proof remain open.
    data:
      nodes:
        - id: segment
          label: Segment need
          stage: '1'
          description: Restaurant, fresh-retail, and food-production customers require temperature-controlled movement.
          touchpoints:
            - Procurement brief
            - Supply-chain planning
        - id: origin
          label: Source intake
          stage: '2'
          description: Products enter a source-to-store or source-to-distribution workflow.
          touchpoints:
            - Origin scheduling
            - Warehouse handoff
        - id: transport
          label: Cold transport
          stage: '3'
          description: Ground transport and distribution move perishable goods under temperature requirements.
          touchpoints:
            - Vehicle assignment
            - Route execution
        - id: store
          label: Store delivery
          stage: '4'
          description: The reported network reaches stores across provinces and counties.
          touchpoints:
            - Delivery calendar
            - Store receipt
        - id: visibility
          label: Control and traceability
          stage: '5'
          description: Company materials describe visibility, KPI monitoring, and order traceability.
          touchpoints:
            - Exception monitoring
            - Receipt evidence
        - id: expansion
          label: Expansion loop
          stage: '6'
          description: >-
            Additional warehousing, technology, or supply-chain services are a plausible expansion surface but not a
            disclosed retention outcome.
          touchpoints:
            - Multi-node scope
            - Renewal review
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU010
      - CU013
