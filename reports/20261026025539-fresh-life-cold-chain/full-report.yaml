chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Fresh Life Cold Chain Logistics Co., Ltd. is described as a China-based, privately held cold-chain
              logistics provider founded in 2016. Its stated operating model is end-to-end cold-chain service for
              catering, retail, fresh e-commerce, and food-processing customers, spanning origin, warehousing,
              distribution, and delivery to the user or store. The company is presented as having been incubated by New
              Hope Group's consumer investment platform, Caogen Zhiben, rather than as an independent software-only
              business. The evidence therefore points to a capital-intensive, network-oriented logistics platform whose
              technology layer supports fulfillment, traceability, dispatch, risk control, and customer visibility. A
              public VentureRadar profile places the company in China and identifies it as privately held, while a 36Kr
              project profile identifies the legal entity as 鲜生活冷链物流有限公司 and lists its registered address in Lhasa
              Economic and Technological Development Zone.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership, control, and capital formation
        blocks:
          - type: paragraph
            body: >-
              The retained sources identify Xi Gang as chair of Fresh Life Cold Chain and as president of Caogen Zhiben,
              with the 36Kr profile also linking him to New Hope Dairy. Media reporting attributes effective control to
              Liu Yonghao through Caogen Zhiben and reports a 66.0017% holding, but that ownership figure is explicitly
              relayed from Tianyancha rather than from a filed company disclosure in the retained pool. The financing
              record is more consistently documented than the governance record: the profile lists an angel round in
              July 2018, a RMB600 million Series A in January 2021, an undisclosed A+ round in January 2022, a B round
              in March 2022, and a several-hundred-million-renminbi B+ round in November 2024. Separate reports describe
              the cumulative B-round financing as close to RMB900 million and consistently report the 2022 valuation as
              RMB10 billion. Exact post-money valuation, dilution, preferences, debt, and board composition are not
              established by the retained evidence.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: Scale, milestones, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Company-issued or syndicated descriptions portray Fresh Life as a national B2B cold-chain network with
              more than 100 branches, coverage of 31 provinces and roughly 2,800 counties, and a fulfillment network
              reaching more than 1.08 million stores. The same materials describe technology investments in AI dispatch,
              AI-enabled operating instructions, risk-control verification, and a digital supply-chain control tower.
              Reported operating metrics vary by source and period: one 2023 retrospective cites more than 5,400 served
              cold-chain and food-trade enterprises, daily transport above 20,000 tonnes, and annual fresh-food service
              of 6 million tonnes; another 2024 financing release cites more than 5,000 B2B customers. These are not
              audited KPIs and should not be treated as interchangeable customer or revenue measures. Sector evidence
              shows a growing Chinese cold-chain market, but also highlights infrastructure, technology, and competitive
              execution requirements. Material gaps remain around audited revenue and profitability, customer
              concentration, claims or spoilage history, precise ownership and board rights, and the conversion of the
              reported network footprint into recurring economics. UNEP's sector review also warns that
              private-sector-led cold-chain investment can become sub-optimal and piecemeal, underscoring utilization
              and network-economics risk for asset-heavy operators.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Network scale is the clearest disclosed asset
            body: >-
              Multiple retained reports describe national reach, more than 100 branches, and a fulfillment network
              exceeding one million stores. The figures are company-linked and not independently audited, but they
              indicate that the investment case is built around physical network density plus digital coordination
              rather than a narrow software product.
            calloutType: strength
            claimRefs:
              - CO011
              - CO012
          - type: callout
            title: Capital and governance terms remain opaque
            body: >-
              Public financing coverage identifies rounds and named investors but does not establish current valuation,
              dilution, preference rights, debt, board composition, or the precise relationship between sponsor
              entities. The retained sources do not provide a current valuation or primary transaction documents.
            calloutType: risk
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: callout
            title: Scale metrics are not yet a financial model
            body: >-
              Customer counts, store reach, transport tonnage, and service volume are operating indicators with
              different periods and denominators. They should not be used as substitutes for revenue, gross margin, cash
