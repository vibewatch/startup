              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE008
      - number: '5.3'
        title: Maturity, differentiation, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates meaningful operating scale: company-issued material claims more than 30
              billion records in the Yunlizi system, more than 100 AI-transformed nodes, more than 80 patents, more than
              100 software copyrights, more than 100,000 daily orders, more than 300,000 connected refrigerated trucks,
              and more than 11 million square metres of connected cloud warehouses. A separate industry article repeats
              several network and customer figures but attributes them to the company ecosystem. These metrics suggest a
              mature operating data footprint and a potential differentiation in network orchestration, yet they are not
              the same as independently measured service quality or defensible software revenue. The market context
              raises a countervailing risk: capacity growth and service homogenization can pressure utilization and
              pricing, while fragmented operators and broken-chain practices make consistent temperature and SOP control
              difficult. No retained source establishes a public security certification, incident history, validated
              cold-chain audit, or customer-level before-and-after performance result.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Product diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Fresh Life appears differentiated by combining a nationwide cold-chain operating network with a
              control-tower and workflow-automation thesis. The product is therefore best assessed as a
              technology-enabled logistics operating system layered over physical capacity, not as a pure software
              product. The core underwriting question is whether the digital layer produces repeatable improvements in
              temperature compliance, spoilage, route productivity, settlement speed, and customer retention across
              acquired and subcontracted operations. Public materials provide architecture and scale assertions but
              leave the decisive proof points—service-level distributions, exception rates, data governance, security
              testing, integration effort, deployment cohort outcomes, and unit-level economics—unresolved.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated logistics plus control layer
            body: >-
              Fresh Life's product thesis is a source-to-store cold-chain service with digital dispatch, monitoring,
              risk controls, and traceability; the technology claim is meaningful only if it improves physical-network
              execution.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE006
          - type: callout
            title: Scale claims are not service-level proof
            body: >-
              The retained sources report large network and data figures, but do not independently establish uptime,
              temperature compliance, spoilage reduction, security controls, or realized customer ROI.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              The customer proposition is a business-to-business cold-chain service rather than a consumer product.
              Public descriptions identify restaurant chains, fresh-food retailers, and food producers or traders as the
              principal customer groups, with the service spanning warehouse, transport, and store delivery. This is
              consistent with the broader Chinese market structure: cold-chain work is split among warehousing, ground
              transport, air transport, distribution, infrastructure, and third-party logistics. That fragmentation
              creates a buyer need for fewer handoffs and better end-to-end control, but it also means the economic
              buyer, operational user, and payer can differ by account. The available evidence supports segment
              definition and network reach, not a verified revenue mix by segment or customer-level profitability.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Company-issued and platform materials describe a large operating footprint: more than 5,000 business
              customers, coverage of 31 provinces and 2,800 counties, and access to more than one million stores. A
              separate financing announcement reports more than 5,400 served cold-chain and food-trade enterprises,
              20,000-plus tonnes of daily carriage, and 6 million tonnes of annual fresh-food service in 2023. These
              figures are useful indicators of scale, but they are not a consistent active-customer cohort, contracted
              revenue base, or retention series.       The assigned brand websites establish operating context for
              restaurant and retail formats, but do not validate that those brands use Fresh Life. Exact Fresh Life
              scope, production status, service outcomes, and renewal behavior therefore remain unverified for named
              relationships.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU010
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The public record does not disclose net revenue retention, gross retention, churn, renewal rates, contract
              duration, cohort behavior, or top-customer revenue concentration. The operating model nevertheless offers
              plausible expansion surfaces: a customer can move from transport into warehousing, store delivery,
              visibility, traceability, and other supply-chain services, while a wider network can increase route
              density and procurement leverage. Those are operating hypotheses rather than verified customer economics.
              The same network model creates exposure to procurement cycles, service-level failures, food-loss claims,
              and dependence on large accounts or channels. Independent industry evidence describes cargo damage of as
              much as 20–30% in China's cold chain, so customer durability should be tested against claims, spoilage,
              on-time performance, and renewal data rather than inferred from logos or geographic reach.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Customer evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate market structure from company-reported operating metrics and from customer-facing
              proof. They should be read with the limitations above: no exhibit supplies a retention denominator, and
              the customer pages confirm customer scale or operating context rather than a Fresh Life deployment on
              their own. They are therefore evidence for segmentation and diligence design, not substitutes for signed
              contracts, service-level reports, or customer references. The exhibit set also keeps reported throughput
              separate from the distinct question of whether volume converts into durable margin.
            claimRefs:
              - CU002
              - CU005
              - CU008
              - CU010
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported breadth is substantial
            body: >-
              Public company materials report more than 5,000 business customers, coverage of 31 provinces and 2,800
              counties, and access to more than one million stores, although definitions and active status require
              verification.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Scale does not yet prove durability
            body: >-
              Retention, churn, renewal, customer concentration, and customer-confirmed outcomes are not publicly
              disclosed in the assigned evidence.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Public sources describe a nationwide cold-chain network and multiple digital control systems, but they do
              not provide a company-specific license register, audit opinion, enforcement history, litigation docket,
              data-protection assessment, or food-safety incident history. The national standards platform is available
              as a reference point, yet the fetched homepage does not identify Fresh Life's certifications or compliance
              status. This makes regulatory posture an unresolved diligence item rather than a clean bill of health. The
              company-issued financing and technology descriptions also contain ambitious scale and performance
              assertions, while independent corroboration of controls is limited. The investment implication is that
              regulatory or governance diligence should precede reliance on the network's claimed quality and
              traceability advantages.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Operational, quality, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Cold-chain execution is exposed to temperature excursions, spoilage, vehicle availability, labor and
              technician shortages, energy costs, route complexity, and working-capital timing. Industry evidence
              describes fragmented last-mile networks and spoilage above 10% for leafy greens in some tier-three cities,
              while another source reports a rapidly expanding refrigerated fleet and cold-storage base. Fresh Life's
              2024 company-issued materials claimed access to a 300,000-vehicle pool and more than 11 million square
              metres of networked warehouse space, but the assigned sources do not disclose denominator-based failure
              rates, claims, gross margins, cash conversion, or the share of owned versus third-party capacity. Scale
              therefore increases both the potential operating leverage and the surface area for control failure.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR009
              - CR014
      - number: '7.3'
        title: Partner, dependency, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's model depends on a distributed ecosystem of carriers, warehouses, technology systems,
              acquired regional operators, customers, and financing providers. Company-issued material says that AI
              matching draws on a 300,000-vehicle pool, while independent reporting describes an acquisition-plus-build
              expansion model; those claims imply meaningful counterparty, integration, data, and service-continuity
              dependencies. The assigned sources do not show concentration by carrier, warehouse, customer, lender, or
              acquired entity. A thesis break would occur if temperature compliance, on-time delivery, customer
              retention, or cash funding deteriorated materially while the network continued to require expansion
              capital; each trigger needs a baseline and covenant in diligence rather than an invented public threshold.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence quality is itself a material risk
            body: >-
              The strongest scale, technology, financing, and performance numbers in the assigned pool come from
              company-issued or syndicated material; independent operating-quality and financial evidence remains
              insufficient for a low-risk conclusion.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR014
          - type: callout
            title: Kill criteria should be measurable
            body: >-
              Treat a sustained temperature-compliance miss, material spoilage or claims increase, loss of a major
              customer or carrier, or inability to fund working capital as thesis-break triggers until audited
              thresholds are obtained.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's investable thesis rests on a large and still digitizing cold-chain market, a national
              fulfillment footprint, and repeated institutional financing. The company's current profile describes more
              than 5,000 B2B customers, a network reaching more than 1.15 million stores, and 100-plus branches, while
              independent industry research describes persistent infrastructure, information, standardization, and
              financing constraints. That combination can create operating leverage for a scaled platform, but it does
              not by itself prove attractive equity returns. The anti-thesis is that much of the public operating
              disclosure remains company-issued, while the only visible valuation reference is a 2022 RMB 10 billion
              mark; without audited margins, cash flow, retention, or preference terms, the price can be wrong even if
              the operating story is real.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Financing evidence shows access to capital rather than cash available to common equity. PitchHub lists a
              RMB 600 million A round in January 2021, an undisclosed A+ round in January 2022, a B round in March 2022,
              and a multi-hundred-million-RMB B+ round in November 2024; Toutiao reports that the 2022 B round valued
              the company at RMB 10 billion and that cumulative B-round financing approached RMB 900 million. These
              records are not a cap table, do not disclose liquidation preferences, and do not establish the current
              valuation. An investor should therefore use staged entry discipline: require current financing documents,
              normalize revenue and contribution margin, and test whether the 2022 mark was supported by durable
              economics rather than network expansion alone.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              A model-appropriate valuation approach is a scenario framework tied to throughput, price realization,
              contribution margin, capital intensity, and exit multiples, not a single headline multiple. Industry
              evidence supports demand growth: the 2023 Chinese cold-chain market was reported at RMB 517 billion, while
              2025 logistics volume reached 381.4 million tonnes and cold-storage capacity 267 million cubic metres.
              Those figures describe the addressable industry, not Fresh Life revenue or market share. JD Logistics
              provides a public scale reference with 2025 revenue of $31.03 billion and 2024 revenue of $25.05 billion,
              but it is not a directly comparable private cold-chain pure play. The comparison is useful for scale
              discipline, not for importing a multiple.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV004
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
      - number: '8.4'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports tracking rather than buying at an unspecified price. Upside would require verified
              growth with improving unit economics, repeatable customer retention, transparent financing terms, and
              evidence that software and network density lower loss, dispatch, and working-capital costs. Downside is
              credible because independent research identifies uneven infrastructure, limited enterprise scale,
              financing constraints, and incomplete standardization as industry obstacles; Fruitnet also documents
              continued capacity and technology investment across China, which can increase competition and cap pricing.
              The decision should move toward invest only after audited financials and cap-table terms are supplied, or
              after a price reset creates a documented margin of safety. Exit readiness is not established by the public
              record.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV014
              - CV015
              - CV017
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at an unverified price, not buy
            body: >-
              Operating scale and financing access are credible positives, but public evidence does not support a
              current intrinsic value or common-equity return case. Require financial and preference-term diligence
              before underwriting an entry.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV014
              - CV017
          - type: callout
            title: The central valuation risk is evidence opacity
            body: >-
              Financing raised is not cash available, and a historical valuation reference is not a current price.
              Missing audited margin, cash-flow, retention, concentration, and cap-table data can make a seemingly
              reasonable headline valuation economically unattractive.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV015
