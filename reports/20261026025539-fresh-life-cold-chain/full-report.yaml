  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's relevant market is outsourced, temperature-controlled food-supply-chain fulfillment from
              source or production site through storage, trunk transport, branch distribution, and store delivery. The
              company describes its offer as full-chain service for catering chains, fresh-retail businesses, and food
              producers and traders, while its network model combines acquisitions, self-built capacity, warehouses,
              vehicles, and digital control. That boundary includes third-party logistics, cold storage, refrigerated
              transportation, distribution, and traceability or settlement services. It excludes the full value of food
              sold, ordinary ambient freight, and standalone refrigeration equipment unless the equipment is part of a
              managed logistics contract. The practical substitutes are an enterprise's internal fleet and warehouse,
              direct regional carriers, spot-market brokers, or ambient distribution where product risk permits, but the
              retained sources do not quantify those substitution rates. These are diligence hypotheses rather than
              addressable revenue. This distinction matters because a large food-consumption market is not automatically
              spend available to a cold-chain operator.
            claimRefs:
              - CM001
              - CM002
              - CM017
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM017
      - number: '2.2'
        title: Sizing lenses and comparability limits
        blocks:
          - type: paragraph
            body: >-
              Public estimates support a large and expanding category, but they use different units and scopes. A
              company-issued article hosted by FoodTalks cites a 2024 industry report that places China's cold-chain
              market at $73.3 billion in 2023, while Verified Market Research defines a narrower integrated logistics
              market at $17.2 billion in 2024 and forecasts $51.9 billion by 2032. Xinhua Silk Road reports a $363.8
              billion global market in 2024 and says China accounted for more than 20 percent, alongside a first-half
              2025 food cold-chain demand estimate of 192 million tonnes and logistics value of about RMB4.7 trillion.
              These are not additive TAM, SAM, and SOM layers: they differ in definition, geography, time basis, and
              whether they measure service value, logistics value, or physical demand. The evidence therefore supports a
              constrained market thesis rather than a single precise TAM. Fresh Life's reported 1.08 million-store
              fulfillment reach and 5,000-plus B2B customers show operating scope, not market share, because the
              denominator and revenue conversion are undisclosed.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The retained company-originated evidence identifies catering chains, fresh retailers, food producers, and
              food traders as customer organizations, but it does not identify the contracting cost center, payer,
              procurement authority, or approval path inside those businesses. Store, warehouse, dispatch, and
              distribution teams are plausible operational users, not verified budget owners. Adoption should therefore
              be tested as a lane-, region-, or warehouse-level procurement decision rather than assumed to be
              enterprise-wide. Fresh Life's stated network of more than 100 branches, 31 provinces, 2,800 counties, and
              more than 1.08 million stores supports a national-service proposition, but does not prove utilization or
              module penetration. Company-originated material also reports more than 5,000 B2B customers; contracts,
              retention, utilization, and payer data remain necessary to validate the buyer map.
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by fresh-produce consumption, e-commerce and instant retail, expansion into
              lower-tier cities, and stricter requirements for freshness and traceability. Global Times reports that
              first-half 2025 food cold-chain demand reached 192 million tonnes, while refrigerated-truck sales and
              new-energy refrigerated-truck penetration also increased; Fruitnet links growth to fresh-produce access
              and same-day or same-hour online grocery delivery. These drivers can increase route density and outsourced
              spend, but adoption remains constrained by regional fragmentation, seasonal peaks, temperature and
              food-safety liability, switching risk, and the capital required for vehicles, warehouses, technology, and
              acquisitions. Fresh Life's technology and M&A claims could improve utilization and control, yet the public
              record does not disclose unit economics, gross margin, customer concentration, spoilage claims, or renewal
              rates. Valuation should therefore reward demonstrated density, retention, and cash conversion rather than
              headline market size alone.
            claimRefs:
              - CM004
              - CM014
              - CM015
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Addressable market is large but definition-sensitive
            body: >-
              The strongest public evidence describes several large pools, but the figures mix market value, logistics
              value, physical tonnes, and analyst-defined service scope; they should not be summed.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Network breadth is a plausible adoption advantage
            body: >-
              Fresh Life reports national coverage and a large store-fulfillment network, which could matter to
              multi-site buyers seeking one accountable provider, subject to utilization and service-quality
              verification.
            calloutType: strength
            claimRefs:
              - CM003
              - CM012
          - type: callout
            title: Scale claims do not replace unit-economics evidence
            body: >-
              Public sources do not establish revenue conversion, gross margin, cash generation, retention,
              concentration, or claims history for the reported network and customer counts.
            calloutType: risk
            claimRefs:
              - CM004
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than refrigerated trucking. The academic value-chain review
              defines cold chain around temperature control from production through the final consumer and separates
              fresh agricultural, frozen processed, and pharmaceutical products. It also describes time, temperature,
              and tolerance as the operating constraints that make coordination harder than in ordinary logistics. Fresh
              Life therefore faces direct temperature-controlled 3PLs, integrated storage and transport incumbents,
              Chinese express and supply-chain platforms, regional specialists, and customer-owned or manually
              coordinated status quo operations. The assigned market and company sources identify Americold, Lineage, SF
              Express, JD Logistics, Sinotrans, Kerry, and other players, but do not provide a complete China-specific
              share ranking.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Capability, distribution, and trust differentiation
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's claimed differentiation is an integrated operating layer: AI-assisted vehicle matching and
              pricing, SOP orchestration, automated risk checks, and a control tower spanning people, vehicles, goods,
              warehouses, temperature, and traceability. The company-linked sources also describe a buy-and-build
              footprint reaching 31 provinces, more than 2,800 counties, and more than one million stores. Those
              capabilities address the sector's coordination problem and can improve density, visibility, and exception
              handling. They are not yet a verified moat: Americold markets a global facility and service network, while
              the independent market review lists multiple integrated players and explicitly identifies gaps in
              end-to-end integration, last-mile refrigeration, and pharma-grade compliance. Public evidence here does
              not compare service-level outcomes or customer retention.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP009
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
      - number: '3.3'
        title: Packaging, pricing, and switching economics
        blocks:
          - type: paragraph
            body: >-
              No assigned source publishes a comparable Fresh Life price card, contract minimum, realized gross margin,
              or discount schedule. The company-linked material describes algorithmic vehicle pricing and a broad
              service bundle, but that is a mechanism claim rather than evidence of price leadership. Buyers can
              plausibly compare a bundled national network with incumbent public refrigerated warehouses, integrated
              logistics platforms, regional specialists, or internal coordination; however, the available sources do not
              quantify switching costs, multi-homing, spoilage claims, or service-level penalties. The defensible
              conclusion is that network density, data accumulated across operations, and workflow integration may
              increase operational stickiness, while the absence of public realized-pricing and retention data leaves
              monetization durability unresolved.
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Durability, displacement, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's moat case depends on converting scale and software claims into lower loss, faster settlement,
              better utilization, and repeat purchasing. The sources support the existence of a broad network and a
              technically ambitious control layer, but most operating metrics are company-issued or company-linked. The
              independent academic source supports the importance of integration without validating Fresh Life's
              execution, and the market research source names strong established players while noting competitive gaps
              rather than awarding Fresh Life a position. Lineage's public-market capitalization and Americold's network
              positioning illustrate that larger capitalized incumbents remain credible alternatives. Before
              underwriting durability, a buyer or investor should obtain cohort retention, realized price and margin by
              service, spoilage and claims data, customer concentration, and matched service-level comparisons.
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP010
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Network-plus-software proposition
            body: >-
              Fresh Life's strongest competitive thesis is the combination of national fulfillment coverage and
              operating software rather than a standalone refrigerated-transport product.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP013
          - type: callout
            title: Differentiation is not independently benchmarked
            body: >-
              The assigned evidence does not establish realized pricing, retention, loss reduction, or service-level
              superiority against global incumbents and Chinese integrated platforms.
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization is a full-chain logistics service, not a pure software model
        blocks:
          - type: paragraph
            body: >-
              The available evidence describes Fresh Life as a cold-chain food-channel service provider for restaurants,
              fresh-food retailers, and food producers or traders. Its commercial offer spans warehouse, trunk
              transportation, and delivery from source to store, with a stated strategy of combining self-built
              infrastructure, acquisitions, and digital tools. That mechanism implies revenue is likely tied to physical
              execution, contracted service scope, and shipment activity, rather than recurring software subscriptions.
              Public descriptions also identify several adjacent businesses, including warehouse services, technology
              commercialization, vehicle development, and overseas supply-chain activity; these may be growth options
              but should not be consolidated into one undifferentiated margin assumption. The company reports broad
              customer and network coverage, but the sources do not disclose realized price per shipment, take rate,
              contract duration, or revenue mix. A lender or investor should therefore underwrite each stream separately
              and reconcile billed logistics revenue to delivered volume, claims, rebates, and pass-through costs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI006
      - number: '4.2'
        title: Scale can improve utilization, but the cost base remains opaque
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's described operating model requires refrigerated transport, warehouse capacity, dispatch and
              control-tower systems, labor, partner-carrier payments, and working capital for customer and supplier
              settlement. The company and related coverage describe AI dispatch, pricing, operating instructions, risk
              controls, and a real-time control tower; these tools could improve vehicle matching, route density,
              exception handling, and settlement speed, but they do not establish gross-margin improvement. The public
              record gives no audited gross margin, EBITDA, cash-flow statement, customer-level contribution margin,
              spoilage rate, claims ratio, or acquisition integration cost. Comparative public logistics disclosures in
              the assigned pool demonstrate that listed operators publish formal filings and periodic-report surfaces,
              but they are not evidence of Fresh Life's economics. The central diligence task is to bridge operational
              KPIs to a cohort-level P&L: revenue per order or tonne, carrier and warehouse cost, labor, claims,
              technology overhead, and cash conversion.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI012
              - CI015
      - number: '4.3'
        title: Financing supports expansion, but does not prove runway
        blocks:
          - type: paragraph
            body: >-
              Haiwen's legal-firm announcement records a RMB600 million Series A completed in January 2021, while
              independent project and news profiles describe later A+, B, and B+ financings. The independent profiles
              report a B-round valuation of RMB10 billion in 2022 and a cumulative B-round amount approaching RMB900
              million, but those figures are not audited financial statements and differ in precision and provenance
              from the legal announcement. Operational scale claims are also substantial: the sources report more than
              5,000 B2B customers, coverage of 31 provinces and 2,800 counties, access to 1.08 million stores, and daily
              order volume above 100,000 in one financing account. These figures indicate commercial reach, not cash
              generation. No assigned source reports cash on hand, monthly burn, debt or project-finance obligations,
              committed capex, or the next-round trigger. Capital adequacy is consequently unresolved: acquisition-led
              expansion and refrigerated assets can consume cash before accounting revenue is collected, especially if
              customer concentration or claims reserve needs are high.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest positive financial signal is a repeat-financing path alongside a broad physical network and
              a service model that can monetize logistics execution across multiple customer categories. The strongest
              limitation is evidence quality: most Fresh Life figures are company statements reproduced by advisers,
              project databases, or financing coverage, while the assigned public-company filings are benchmarks rather
              than Fresh Life disclosures. Historical dependence on New Hope Dairy's cold-chain demand is a specific
              concentration risk described by independent coverage; current top-customer concentration and renewal
              behavior are not disclosed. The underwriting conclusion is therefore conditional rather than a forecast:
              the business may have attractive density and utilization economics, but an investment case requires
              audited revenue and cash flow, stream-level gross margins, working-capital aging, capex and lease
              commitments, claims history, and a reconciled financing and capitalization schedule. Until those are
              supplied, revenue quality and capital runway remain material diligence blockers rather than modeled
              outputs.
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI007
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale and repeat financing are real positive signals
            body: >-
              The assigned record supports a 2021 RMB600 million Series A and later reported financing alongside a broad
              physical network, but the operating claims remain largely unaudited.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
              - CI011
          - type: callout
            title: Capital adequacy cannot be inferred from funding raised
            body: >-
              Funding chronology and valuation references do not establish cash available, burn, runway, debt service,
              or the capital required for refrigerated infrastructure and acquisitions.
            calloutType: risk
            claimRefs:
              - CI012
              - CI015
          - type: callout
            title: Underwrite by service line and cohort
            body: >-
              Require audited financial statements, service-line gross margins, customer concentration, working-capital
              aging, and claims history before treating network scale as evidence of durable cash generation.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and delivered service
        blocks:
          - type: paragraph
            body: >-
              Fresh Life Cold Chain is described as a B2B cold-chain food-channel service for restaurant companies,
              fresh-food retailers, and food producers or traders. The service proposition is source-to-store handling
              rather than a single transport leg: warehouse, trunk transport, urban distribution, order traceability,
              and store-facing delivery coordination are presented as one operating workflow. A 36Kr project profile
              similarly describes the company as a provider of cold-chain distribution solutions and says it serves
              restaurant, fresh-retail, and food-production customers. This makes the buyer value proposition
              operational reliability and lower coordination burden, not merely access to refrigerated vehicles.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE009
      - number: '5.2'
        title: Operating and technology architecture
        blocks:
          - type: paragraph
            body: >-
              The public product description separates the operating model into four linked control functions: AI
              dispatch for capacity matching and pricing, an AI-SOP instruction model for dispatch and monitoring tasks,
              an AI risk platform for order, settlement, and fulfillment checks, and a digital supply-chain control
              tower for KPI visibility and traceability. The company-issued description says the control tower displays
              transport timeliness, cargo integrity, and temperature-compliance KPIs, while store users can view
              delivery calendars and signed-receipt photographs. It also describes an underlying layer of software and
              hardware connected by IoT with AI used for decision support. These are credible architecture components,
              but the available material does not independently verify model accuracy, sensor calibration, uptime, API
              integration, or access-control design.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
