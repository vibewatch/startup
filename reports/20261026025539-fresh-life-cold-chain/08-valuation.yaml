company:
  name: Fresh Life Cold Chain
chapter:
  number: 8
  title: Valuation
  summary: "Fresh Life has credible scale, financing access, and a technology-enabled cold-chain proposition, but the public evidence does not establish audited profitability, cash generation, or a current mark that can support a precise underwriting case. The appropriate stance is track / price-uncertain: preserve exposure to sector and execution upside while requiring financial, cap-table, and customer-quality diligence before entry."
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: Fresh Life's investable thesis rests on a large and still digitizing cold-chain market, a national fulfillment footprint, and repeated institutional financing. The company's current profile describes more than 5,000 B2B customers, a network reaching more than 1.15 million stores, and 100-plus branches, while independent industry research describes persistent infrastructure, information, standardization, and financing constraints. That combination can create operating leverage for a scaled platform, but it does not by itself prove attractive equity returns. The anti-thesis is that much of the public operating disclosure remains company-issued, while the only visible valuation reference is a 2022 RMB 10 billion mark; without audited margins, cash flow, retention, or preference terms, the price can be wrong even if the operating story is real.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-and-financing-discipline
    title: Financing context and entry discipline
    body: "Financing evidence shows access to capital rather than cash available to common equity. PitchHub lists a RMB 600 million A round in January 2021, an undisclosed A+ round in January 2022, a B round in March 2022, and a multi-hundred-million-RMB B+ round in November 2024; Toutiao reports that the 2022 B round valued the company at RMB 10 billion and that cumulative B-round financing approached RMB 900 million. These records are not a cap table, do not disclose liquidation preferences, and do not establish the current valuation. An investor should therefore use staged entry discipline: require current financing documents, normalize revenue and contribution margin, and test whether the 2022 mark was supported by durable economics rather than network expansion alone."
    claimRefs: [CV006, CV007, CV008, CV009]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: "A model-appropriate valuation approach is a scenario framework tied to throughput, price realization, contribution margin, capital intensity, and exit multiples, not a single headline multiple. Industry evidence supports demand growth: the 2023 Chinese cold-chain market was reported at RMB 517 billion, while 2025 logistics volume reached 381.4 million tonnes and cold-storage capacity 267 million cubic metres. Those figures describe the addressable industry, not Fresh Life revenue or market share. JD Logistics provides a public scale reference with 2025 revenue of $31.03 billion and 2024 revenue of $25.05 billion, but it is not a directly comparable private cold-chain pure play. The comparison is useful for scale discipline, not for importing a multiple."
    claimRefs: [CV010, CV011, CV012, CV013]
    tableRefs: [TV004]
  - id: decision-and-diligence
    title: Recommendation and thesis-break triggers
    body: The evidence supports tracking rather than buying at an unspecified price. Upside would require verified growth with improving unit economics, repeatable customer retention, transparent financing terms, and evidence that software and network density lower loss, dispatch, and working-capital costs. Downside is credible because independent research identifies uneven infrastructure, limited enterprise scale, financing constraints, and incomplete standardization as industry obstacles; Fruitnet also documents continued capacity and technology investment across China, which can increase competition and cap pricing. The decision should move toward invest only after audited financials and cap-table terms are supplied, or after a price reset creates a documented margin of safety. Exit readiness is not established by the public record.
    claimRefs: [CV014, CV015, CV016, CV017]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Track at an unverified price, not buy
    body: Operating scale and financing access are credible positives, but public evidence does not support a current intrinsic value or common-equity return case. Require financial and preference-term diligence before underwriting an entry.
    claimRefs: [CV006, CV008, CV014, CV017]
  - calloutType: risk
    title: The central valuation risk is evidence opacity
    body: Financing raised is not cash available, and a historical valuation reference is not a current price. Missing audited margin, cash-flow, retention, concentration, and cap-table data can make a seemingly reasonable headline valuation economically unattractive.
    claimRefs: [CV007, CV009, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, "Monitor and diligence; do not underwrite a buy without price and financial evidence"]
      - [Confidence, medium, "Operating and financing signals are public, but core return inputs are not disclosed"]
      - [Risk rating, high, "Network execution, margin, working capital, and financing-term uncertainty remain material"]
      - [Valuation stance, price-uncertain, "The historical RMB 10 billion reference is not enough to establish a current mark"]
    notes: "Assessment is an evidence-weighted investment judgment; no current transaction price or audited return model was publicly available in the retained sources."
    claimRefs: [CV006, CV007, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Scaled network can create density benefits", "The company reports 5,000+ B2B customers, more than 1.15 million stores, and 100+ branches", "Audited route density, utilization, contribution margin, and loss-rate trend"]
      - ["Digital control can improve execution", "Company-linked financing coverage describes AI dispatch, AI-SOP, AI risk control, and a supply-chain control tower", "Independent customer proof showing measurable savings, service-level gains, or retention"]
      - ["Capital access supports consolidation", "PitchHub lists multiple rounds and the 2024 B+ financing", "Cap table, cash balance, debt, use of proceeds, and preference stack"]
      - ["Headline mark may overstate equity value", "Toutiao reports a 2022 RMB 10 billion valuation, while financial performance is not audited in the retained evidence", "Current third-party mark plus normalized revenue, margin, cash flow, and dilution analysis"]
    notes: "Company-linked operating and financing claims are separated from the independent evidence needed to validate economic value."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV014, CV015]
  - id: TV004
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Key risk, Probability signal]
    rows:
      - [Bull, "National network density improves utilization; technology lowers dispatch and loss costs; customer retention is strong", "A current valuation could be justified only if audited growth and margin support a premium platform multiple", "Integration and execution across acquired networks", "Requires verification; not the base case"]
      - [Base, "Market grows, but margins and working capital improve gradually; financing continues without full transparency", "Track and seek a price with a documented margin of safety; no precise target is supportable", "Capital intensity and unclear preference stack", "Most consistent with currently disclosed evidence"]
      - [Bear, "Price competition, underutilized assets, weak retention, or higher working-capital needs limit cash generation", "Down-round or impaired common-equity value becomes possible even with network scale", "Margin compression and refinancing risk", "Material downside; monitor triggers"]
      - [Entry trigger, "Audited revenue, contribution margin, cash flow, retention, and current cap table supplied", "Rebuild a business-model-matched valuation using verified inputs", "Data quality remains insufficient", "Diligence-dependent"]
      - [Exit trigger, "Loss-rate or service-level deterioration, covenant stress, failed financing, or regulatory/commercialization setback", "Reduce exposure or suspend entry regardless of headline market growth", "Thesis break", "Monitor continuously"]
    notes: "Scenarios are qualitative because retained sources do not provide audited Fresh Life revenue, margin, cash flow, retention, or current valuation. Industry figures are context, not company forecasts."
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015, CV016, CV017]
