      - [Supply-chain technology, "AI dispatch, SOP, risk control, and control-tower tools", "Software-enabled service or internal efficiency", "Technology capabilities described; standalone monetization unclear", "Company-issued / syndicated", "Separate external software revenue from internal cost savings and implementation fees"]
      - [Adjacent services, "Warehousing, vehicle development, overseas and industrial services", "Project, asset, or contracted service", "Expansion areas described; mix and profitability unavailable", "Company-issued / reported", "Provide segment reporting, capex, contract backlog, and contribution margin by activity"]
    notes: "Public descriptions identify mechanisms and operating metrics, not recognized revenue. Null or unavailable values mean the assigned sources did not disclose a realized amount."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing dimension, Public evidence, List versus realized, Unknowns, Underwriting implication]
    rows:
      - [Customer contract, "End-to-end service for restaurants, retailers, and food producers or traders", "No public list price or realized price", "Term, minimum volume, service-level credits, rebates", "Contract-level margin and renewal evidence is required"]
      - [Transport pricing, "AI pricing is described as using equipment, labor, management, and supply-demand factors", "Algorithmic pricing claim; not a disclosed realized rate", "Rate per route, surcharge policy, carrier margin, seasonality", "Test whether pricing power offsets peak-season and empty-return costs"]
      - [Technology monetization, "Technology is described as commercializable through a technology business", "No public software price or segment revenue", "Implementation fees, recurring fee, service obligations", "Do not apply SaaS multiples or margins without external-customer revenue evidence"]
    notes: "The source record supports a service architecture and pricing-process description, but not price realization, discounts, or contract economics."
    claimRefs: [CI003, CI006]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue per order or tonne, null, low, "Tests monetization against reported order and volume scale", "Provide monthly revenue, orders, tonnes, mix, and recognition policy"]
      - [Gross margin by service line, null, low, "Separates network density gains from pass-through growth", "Provide audited gross margin bridge for warehouse, transport, delivery, and technology"]
      - ["CAC, payback, or sales efficiency", null, low, "Shows whether customer growth requires continued capital", "Provide sales expense, new-logo cohorts, payback, churn, and renewal data"]
      - [Working-capital conversion and runway, null, low, "Determines whether expansion is financeable between rounds", "Provide cash, burn, receivables aging, payables, capex, leases, debt, and financing plan"]
    notes: "No assigned source discloses these private metrics. Nulls are evidence gaps, not zero values or estimates."
    claimRefs: [CI007, CI008, CI012, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Fresh Life's described operating model converts customer demand into physical cold-chain execution and potentially adjacent technology or infrastructure revenue, but public sources do not quantify the conversion.
    data:
      nodes:
        - id: demand
          label: "Restaurant, retail, and food-producer demand"
          detail: "Customer need for source-to-store cold-chain service"
        - id: contract
          label: "Contracted service scope"
          detail: "Warehouse, transport, delivery, and service-level terms"
        - id: network
          label: "Cold-chain network execution"
          detail: "Vehicles, warehouses, branches, carriers, and dispatch"
        - id: delivery
          label: "Delivered orders and tonnes"
          detail: "Operational activity reported publicly; realized price unavailable"
        - id: revenue
          label: "Recognized logistics revenue"
          detail: "Requires reconciliation to billing, rebates, claims, and pass-through costs"
        - id: gross-profit
          label: "Gross profit after service-delivery costs"
          detail: "Requires line-level cost and margin disclosure"
      edges:
        - from: demand
          to: contract
        - from: contract
          to: network
        - from: network
          to: delivery
        - from: delivery
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: "Conceptual bridge based on described service mechanisms; no values, conversion rates, or margin assumptions are inferred."
    claimRefs: [CI001, CI003, CI005, CI007]
callouts:
  - calloutType: strength
    title: "Scale and repeat financing are real positive signals"
    body: "The assigned record supports a 2021 RMB600 million Series A and later reported financing alongside a broad physical network, but the operating claims remain largely unaudited."
    claimRefs: [CI009, CI010, CI011]
  - calloutType: risk
    title: "Capital adequacy cannot be inferred from funding raised"
    body: "Funding chronology and valuation references do not establish cash available, burn, runway, debt service, or the capital required for refrigerated infrastructure and acquisitions."
    claimRefs: [CI012, CI015]
  - calloutType: recommendation
    title: "Underwrite by service line and cohort"
    body: "Require audited financial statements, service-line gross margins, customer concentration, working-capital aging, and claims history before treating network scale as evidence of durable cash generation."
    claimRefs: [CI007, CI013, CI014]
