company:
  name: Fresh Life Cold Chain
chapter:
  number: 4
  title: Financials
  summary: Fresh Life has a capital-intensive, network-based cold-chain model whose public evidence emphasizes financing, coverage, and technology investment rather than audited revenue or margin. The underwriting case therefore depends on validating monetization by service line, working-capital discipline, and whether scale converts into durable contribution profit.
sections:
  - id: monetization-and-scale
    title: Monetization is a full-chain logistics service, not a pure software model
    body: >-
      The available evidence describes Fresh Life as a cold-chain food-channel service provider for
      restaurants, fresh-food retailers, and food producers or traders. Its commercial offer spans
      warehouse, trunk transportation, and delivery from source to store, with a stated strategy of
      combining self-built infrastructure, acquisitions, and digital tools. That mechanism implies
      revenue is likely tied to physical execution, contracted service scope, and shipment activity,
      rather than recurring software subscriptions. Public descriptions also identify several adjacent
      businesses, including warehouse services, technology commercialization, vehicle development, and
      overseas supply-chain activity; these may be growth options but should not be consolidated into
      one undifferentiated margin assumption. The company reports broad customer and network coverage,
      but the sources do not disclose realized price per shipment, take rate, contract duration, or
      revenue mix. A lender or investor should therefore underwrite each stream separately and reconcile
      billed logistics revenue to delivered volume, claims, rebates, and pass-through costs.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Scale can improve utilization, but the cost base remains opaque
    body: >-
      Fresh Life's described operating model requires refrigerated transport, warehouse capacity,
      dispatch and control-tower systems, labor, partner-carrier payments, and working capital for
      customer and supplier settlement. The company and related coverage describe AI dispatch, pricing,
      operating instructions, risk controls, and a real-time control tower; these tools could improve
      vehicle matching, route density, exception handling, and settlement speed, but they do not
      establish gross-margin improvement. The public record gives no audited gross margin, EBITDA,
      cash-flow statement, customer-level contribution margin, spoilage rate, claims ratio, or
      acquisition integration cost. Comparative public logistics disclosures in the assigned pool
      demonstrate that listed operators publish formal filings and periodic-report surfaces, but they
      are not evidence of Fresh Life's economics. The central diligence task is to bridge operational
      KPIs to a cohort-level P&L: revenue per order or tonne, carrier and warehouse cost, labor,
      claims, technology overhead, and cash conversion.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital-adequacy
    title: Financing supports expansion, but does not prove runway
    body: >-
      Haiwen's legal-firm announcement records a RMB600 million Series A completed in January 2021,
      while independent project and news profiles describe later A+, B, and B+ financings. The
      independent profiles report a B-round valuation of RMB10 billion in 2022 and a cumulative B-round
      amount approaching RMB900 million, but those figures are not audited financial statements and
      differ in precision and provenance from the legal announcement. Operational scale claims are also
      substantial: the sources report more than 5,000 B2B customers, coverage of 31 provinces and
      2,800 counties, access to 1.08 million stores, and daily order volume above 100,000 in one
      financing account. These figures indicate commercial reach, not cash generation. No assigned source
      reports cash on hand, monthly burn, debt or project-finance obligations, committed capex, or the
      next-round trigger. Capital adequacy is consequently unresolved: acquisition-led expansion and
      refrigerated assets can consume cash before accounting revenue is collected, especially if customer
      concentration or claims reserve needs are high.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The strongest positive financial signal is a repeat-financing path alongside a broad physical
      network and a service model that can monetize logistics execution across multiple customer
      categories. The strongest limitation is evidence quality: most Fresh Life figures are company
      statements reproduced by advisers, project databases, or financing coverage, while the assigned
      public-company filings are benchmarks rather than Fresh Life disclosures. Historical dependence on
      New Hope Dairy's cold-chain demand is a specific concentration risk described by independent
      coverage; current top-customer concentration and renewal behavior are not disclosed. The
      underwriting conclusion is therefore conditional rather than a forecast: the business may have
      attractive density and utilization economics, but an investment case requires audited revenue and
      cash flow, stream-level gross margins, working-capital aging, capex and lease commitments, claims
      history, and a reconciled financing and capitalization schedule. Until those are supplied, revenue
      quality and capital runway remain material diligence blockers rather than modeled outputs.
    claimRefs: [CI013, CI014, CI015]
    figureRefs: [FI001]
