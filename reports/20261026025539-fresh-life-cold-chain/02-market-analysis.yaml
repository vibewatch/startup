      severity: material
      topic: adoption-gaps
      missingEvidence: Contract-level buyer, payer, renewal, concentration, utilization, margin, and claims data by segment and region.
      whyItMatters: Network reach and customer counts do not show whether growth converts into durable, profitable outsourced spend.
      diligencePath: Obtain a segmented customer cohort, contract renewal, gross-margin, utilization, spoilage, and claims pack under NDA.
      relatedQuestionRefs: [QM004, QM007, QM008]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: market-size
      missingEvidence: A reconciled market-sizing bridge explaining the different China market values and service definitions.
      whyItMatters: The $73.3 billion, $17.2 billion, and implied China share of the $363.8 billion global estimate are not directly comparable.
      diligencePath: Request source methodologies and reconcile service scope, geography, currency, and inclusion of warehousing, transport, and value-added services.
      relatedQuestionRefs: [QM002, QM003]
      relatedTableRefs: [TM002]
    - type: enumeration-incomplete
      severity: minor
      topic: substitutes
      missingEvidence: Buyer-level evidence on internal-build, regional-carrier, broker, and ambient substitution rates.
      whyItMatters: Substitution determines pricing power and the speed at which a national network can displace local incumbents.
      diligencePath: Review win/loss records, procurement tenders, and lane-level competitive alternatives for the top customer cohorts.
      relatedQuestionRefs: [QM001, QM008]
      relatedTableRefs: [TM001]
