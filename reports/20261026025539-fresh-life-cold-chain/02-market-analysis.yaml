      - [Fresh retail, "Fresh-retail enterprise", "Store and distribution teams", "Not disclosed", "Temperature-controlled replenishment", "Not disclosed", "Freshness, traceability, and rapid-delivery requirements"]
      - [Food production, "Food-production enterprise", "Warehouse and distribution teams", "Not disclosed", "Temperature-controlled outbound distribution", "Not disclosed", "Controlled delivery across regions"]
      - [Food trading, "Food-trading enterprise", "Distribution teams", "Not disclosed", "Source-to-store cold-chain movement", "Not disclosed", "Access to a broader fulfillment network"]
    notes: Customer organizations come from company-originated descriptions; operational users and adoption triggers are analytical hypotheses, while payer, budget owner, contract authority, and conversion rates remain undisclosed.
    claimRefs: [CM001, CM013, CM014]
