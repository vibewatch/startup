callouts:
  - calloutType: strength
    title: Network scale is the clearest disclosed asset
    body: >-
      Multiple retained reports describe national reach, more than 100 branches,
      and a fulfillment network exceeding one million stores. The figures are
      company-linked and not independently audited, but they indicate that the
      investment case is built around physical network density plus digital
      coordination rather than a narrow software product.
    claimRefs: [CO011, CO012]
  - calloutType: risk
    title: Capital and governance terms remain opaque
    body: >-
      Public financing coverage identifies rounds and named investors but does
      not establish current valuation, dilution, preference rights, debt, board
      composition, or the precise relationship between sponsor entities. The
      retained sources do not provide a current valuation or primary transaction documents.
    claimRefs: [CO008, CO009, CO010]
  - calloutType: insight
    title: Scale metrics are not yet a financial model
    body: >-
      Customer counts, store reach, transport tonnage, and service volume are
      operating indicators with different periods and denominators. They should
      not be used as substitutes for revenue, gross margin, cash generation,
      retention, or unit economics.
    claimRefs: [CO013, CO015, CO016]
