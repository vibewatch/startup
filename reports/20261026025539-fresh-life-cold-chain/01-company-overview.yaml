company:
  name: Fresh Life Cold Chain
chapter:
  number: 1
  title: Company Overview
  summary: Fresh Life Cold Chain is a China-focused cold-chain logistics and supply-chain services company founded in 2016 and incubated by New Hope Group's consumer-investment platform. The retained evidence supports a scaled national operating footprint and a multi-round financing history, but public evidence remains fragmented across company-issued releases, databases, and media reports, leaving audited financials, governance detail, and exact capital-stack terms unresolved.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Fresh Life Cold Chain Logistics Co., Ltd. is described as a China-based,
      privately held cold-chain logistics provider founded in 2016. Its stated
      operating model is end-to-end cold-chain service for catering, retail,
      fresh e-commerce, and food-processing customers, spanning origin,
      warehousing, distribution, and delivery to the user or store. The company
      is presented as having been incubated by New Hope Group's consumer
      investment platform, Caogen Zhiben, rather than as an independent
      software-only business. The evidence therefore points to a
      capital-intensive, network-oriented logistics platform whose technology
      layer supports fulfillment, traceability, dispatch, risk control, and
      customer visibility. A public VentureRadar profile places the company in
      China and identifies it as privately held, while a 36Kr project profile
      identifies the legal entity as 鲜生活冷链物流有限公司 and lists its
      registered address in Lhasa Economic and Technological Development Zone.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-control-and-capital
    title: Leadership, control, and capital formation
    body: >-
      The retained sources identify Xi Gang as chair of Fresh Life Cold Chain
      and as president of Caogen Zhiben, with the 36Kr profile also linking him
      to New Hope Dairy. Media reporting attributes effective control to Liu
      Yonghao through Caogen Zhiben and reports a 66.0017% holding, but that
      ownership figure is explicitly relayed from Tianyancha rather than from a
      filed company disclosure in the retained pool. The financing record is
      more consistently documented than the governance record: the profile
      lists an angel round in July 2018, a RMB600 million Series A in January
      2021, an undisclosed A+ round in January 2022, a B round in March 2022,
      and a several-hundred-million-renminbi B+ round in November 2024. Separate
      reports describe the cumulative B-round financing as close to RMB900
      million and consistently report the 2022 valuation as RMB10 billion. Exact post-money
      valuation, dilution, preferences, debt, and board composition are not
      established by the retained evidence.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-evidence-gaps
    title: Scale, milestones, and diligence gaps
    body: >-
      Company-issued or syndicated descriptions portray Fresh Life as a
      national B2B cold-chain network with more than 100 branches, coverage of
      31 provinces and roughly 2,800 counties, and a fulfillment network
      reaching more than 1.08 million stores. The same materials describe
      technology investments in AI dispatch, AI-enabled operating instructions,
      risk-control verification, and a digital supply-chain control tower.
      Reported operating metrics vary by source and period: one 2023
      retrospective cites more than 5,400 served cold-chain and food-trade
      enterprises, daily transport above 20,000 tonnes, and annual fresh-food
      service of 6 million tonnes; another 2024 financing release cites more
      than 5,000 B2B customers. These are not audited KPIs and should not be
      treated as interchangeable customer or revenue measures. Sector evidence
      shows a growing Chinese cold-chain market, but also highlights
      infrastructure, technology, and competitive execution requirements.
      Material gaps remain around audited revenue and profitability, customer
      concentration, claims or spoilage history, precise ownership and board
      rights, and the conversion of the reported network footprint into
      recurring economics. UNEP's sector review also warns that private-sector-led
      cold-chain investment can become sub-optimal and piecemeal, underscoring
      utilization and network-economics risk for asset-heavy operators.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
