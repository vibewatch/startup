      - [Annual fresh-food service, "6 million tonnes", "2023", "Toutiao article citing company materials; medium confidence", "Signals annual operating volume", "Customer count, product mix, loss rate, and revenue conversion"]
      - [Store reach, "108万+ stores", "Undated in 2024 financing coverage", "Sina company release; medium confidence", "Shows reported network reach rather than customer retention", "Unique active stores, direct versus partner reach, and frequency"]
      - [Industry customer coverage, "TOP20 coverage above 60%", "Undated in 2024 financing coverage", "Sina company release; medium confidence", "Claims strong penetration among a defined industry cohort", "Denominator definition, paid status, and share of wallet"]
    notes: Values are reported by company-issued or company-repackaged materials and are not an audited time series; the table preserves periods and explicitly lists missing denominators.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: Public customer-facing pages and public company materials available in the assigned pool as of 2026-10-26; not an exhaustive customer list.
    columns: [Candidate brand, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Burger King China, Restaurant chain, "Official Chinese website confirms the operating restaurant brand", "Brand presence is verified; Fresh Life deployment is not publicly established", "Demonstrates a plausible restaurant-chain target segment", "No public Fresh Life case study, contract, service period, or outcome"]
      - [Sukiya, Restaurant chain, "Official page states approximately 2,000 outlets nationwide and lists menu operations", "Brand footprint is verified; Fresh Life deployment is not publicly established", "Demonstrates a multi-location foodservice operating context", "No public Fresh Life attribution, logistics KPI, or renewal evidence"]
      - [7-Eleven, Convenience retail, "Official site establishes food, drinks, and fuel retail context", "Brand presence is verified; Fresh Life deployment is not publicly established", "Demonstrates a distributed retail use case", "No public Fresh Life attribution, deployment status, or outcome"]
    notes: This is a partial enumeration of public customer-context evidence, not proof that the three named brands are Fresh Life customers; each row requires direct reference validation before being used as a customer logo or case study.
    claimRefs: [CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from network access to expansion
    type: journey-map
    summary: The public evidence supports a staged customer workflow from segment need through network delivery and potential expansion, while retention and outcome proof remain open.
    data:
      nodes:
        - id: segment
          label: Segment need
          stage: "1"
          description: Restaurant, fresh-retail, and food-production customers require temperature-controlled movement.
          touchpoints: ["Procurement brief", "Supply-chain planning"]
        - id: origin
          label: Source intake
          stage: "2"
          description: Products enter a source-to-store or source-to-distribution workflow.
          touchpoints: ["Origin scheduling", "Warehouse handoff"]
        - id: transport
          label: Cold transport
          stage: "3"
          description: Ground transport and distribution move perishable goods under temperature requirements.
          touchpoints: ["Vehicle assignment", "Route execution"]
        - id: store
          label: Store delivery
          stage: "4"
          description: The reported network reaches stores across provinces and counties.
          touchpoints: ["Delivery calendar", "Store receipt"]
        - id: visibility
          label: Control and traceability
          stage: "5"
          description: Company materials describe visibility, KPI monitoring, and order traceability.
          touchpoints: ["Exception monitoring", "Receipt evidence"]
        - id: expansion
          label: Expansion loop
          stage: "6"
          description: Additional warehousing, technology, or supply-chain services are a plausible expansion surface but not a disclosed retention outcome.
          touchpoints: ["Multi-node scope", "Renewal review"]
    claimRefs: [CU001, CU002, CU005, CU010, CU013]
callouts:
  - calloutType: strength
    title: Reported breadth is substantial
    body: Public company materials report more than 5,000 business customers, coverage of 31 provinces and 2,800 counties, and access to more than one million stores, although definitions and active status require verification.
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Scale does not yet prove durability
    body: Retention, churn, renewal, customer concentration, and customer-confirmed outcomes are not publicly disclosed in the assigned evidence.
    claimRefs: [CU010, CU011, CU012]
