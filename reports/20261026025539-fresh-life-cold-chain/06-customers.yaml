artifact: customers
slug: fresh-life-cold-chain
runDate: 2026-10-26
company:
  name: Fresh Life Cold Chain
chapter:
  number: 6
  title: Customers
  summary: Fresh Life Cold Chain targets business customers that need temperature-controlled food movement from source to store. Public materials show broad reported reach, but the assigned evidence does not independently validate named relationships, retention, realized outcomes, or concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      The customer proposition is a business-to-business cold-chain service rather
      than a consumer product. Public descriptions identify restaurant chains,
      fresh-food retailers, and food producers or traders as the principal
      customer groups, with the service spanning warehouse, transport, and store
      delivery. This is consistent with the broader Chinese market structure:
      cold-chain work is split among warehousing, ground transport, air transport,
      distribution, infrastructure, and third-party logistics. That fragmentation
      creates a buyer need for fewer handoffs and better end-to-end control, but it
      also means the economic buyer, operational user, and payer can differ by
      account. The available evidence supports segment definition and network
      reach, not a verified revenue mix by segment or customer-level profitability.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      Company-issued and platform materials describe a large operating footprint:
      more than 5,000 business customers, coverage of 31 provinces and 2,800
      counties, and access to more than one million stores. A separate financing
      announcement reports more than 5,400 served cold-chain and food-trade
      enterprises, 20,000-plus tonnes of daily carriage, and 6 million tonnes of
      annual fresh-food service in 2023. These figures are useful indicators of
      scale, but they are not a consistent active-customer cohort, contracted
      revenue base, or retention series.       The assigned brand websites establish operating context for restaurant and
      retail formats, but do not validate that those brands use Fresh Life. Exact
      Fresh Life scope, production status, service outcomes, and renewal behavior
      therefore remain unverified for named relationships.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      The public record does not disclose net revenue retention, gross retention,
      churn, renewal rates, contract duration, cohort behavior, or top-customer
      revenue concentration. The operating model nevertheless offers plausible
      expansion surfaces: a customer can move from transport into warehousing,
      store delivery, visibility, traceability, and other supply-chain services,
      while a wider network can increase route density and procurement leverage.
      Those are operating hypotheses rather than verified customer economics.
      The same network model creates exposure to procurement cycles, service-level
      failures, food-loss claims, and dependence on large accounts or channels.
      Independent industry evidence describes cargo damage of as much as 20–30% in
      China's cold chain, so customer durability should be tested against claims,
      spoilage, on-time performance, and renewal data rather than inferred from
      logos or geographic reach.
    claimRefs: [CU010, CU011, CU012, CU013]
  - id: customer-exhibits
    title: Customer evidence exhibits
    body: >-
      The exhibits separate market structure from company-reported operating
      metrics and from customer-facing proof. They should be read with the
      limitations above: no exhibit supplies a retention denominator, and the
      customer pages confirm customer scale or operating context rather than a
      Fresh Life deployment on their own.
      They are therefore evidence for segmentation and diligence design, not
      substitutes for signed contracts, service-level reports, or customer
      references. The exhibit set also keeps reported throughput separate from
      the distinct question of whether volume converts into durable margin.
    claimRefs: [CU002, CU005, CU008, CU010]
