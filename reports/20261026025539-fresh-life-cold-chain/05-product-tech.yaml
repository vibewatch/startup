      - ["IoT and data layer", "Connects people, vehicles, goods, warehouses, and event records", "Sensors, connectivity, data capture, and system integration", "Missing or noisy data can undermine traceability and model outputs"]
      - ["Workflow automation", "Dispatch, SOP instructions, monitoring, settlement, and management commands", "Customer-specific processes and operator adoption", "Automation may amplify bad rules or require costly human overrides"]
      - ["AI decision support", "Vehicle matching, pricing, exception handling, and risk checks", "Historical data, model governance, and review controls", "Accuracy, explainability, drift, and accountability are unverified"]
      - ["Control tower and customer surface", "KPI dashboards, delivery calendars, route visibility, and receipt records", "Timely event feeds and role-based access", "Uptime, cybersecurity, privacy, and alert latency are unverified"]
      - ["Commercial expansion layer", "Technology services, smart warehousing, vehicle design, and overseas supply-chain initiatives", "Capital, partners, acquisitions, and regulatory compliance", "Scope expansion may dilute execution focus and raise integration risk"]
    notes: "Architecture is reconstructed from disclosed workflow components; no retained source provides a technical specification, security audit, or independent system diagram."
    claimRefs: [CE004, CE005, CE006, CE007, CE010, CE013]
