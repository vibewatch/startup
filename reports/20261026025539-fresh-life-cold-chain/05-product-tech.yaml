company:
  name: Fresh Life Cold Chain
chapter:
  number: 5
  title: Product & Technology
  summary: Fresh Life Cold Chain presents an integrated cold-chain service model combining source-to-store logistics, acquired and self-built operating capacity, and a digital control layer. Public evidence is strongest for the claimed workflow and network architecture; independent validation of service-level performance, production deployment, security controls, and realized customer outcomes remains limited.
sections:
  - id: customer-workflow
    title: Customer workflow and delivered service
    body: >-
      Fresh Life Cold Chain is described as a B2B cold-chain food-channel service for restaurant
      companies, fresh-food retailers, and food producers or traders. The service proposition is
      source-to-store handling rather than a single transport leg: warehouse, trunk transport,
      urban distribution, order traceability, and store-facing delivery coordination are presented
      as one operating workflow. A 36Kr project profile similarly describes the company as a
      provider of cold-chain distribution solutions and says it serves restaurant, fresh-retail,
      and food-production customers. This makes the buyer value proposition operational reliability
      and lower coordination burden, not merely access to refrigerated vehicles.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating and technology architecture
    body: >-
      The public product description separates the operating model into four linked control
      functions: AI dispatch for capacity matching and pricing, an AI-SOP instruction model for
      dispatch and monitoring tasks, an AI risk platform for order, settlement, and fulfillment
      checks, and a digital supply-chain control tower for KPI visibility and traceability. The
      company-issued description says the control tower displays transport timeliness, cargo
      integrity, and temperature-compliance KPIs, while store users can view delivery calendars
      and signed-receipt photographs. It also describes an underlying layer of software and
      hardware connected by IoT with AI used for decision support. These are credible architecture
      components, but the available material does not independently verify model accuracy,
      sensor calibration, uptime, API integration, or access-control design.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-risk
    title: Maturity, differentiation, and implementation risk
    body: >-
      The available evidence indicates meaningful operating scale: company-issued material claims
      more than 30 billion records in the Yunlizi system, more than 100 AI-transformed nodes, more
      than 80 patents, more than 100 software copyrights, more than 100,000 daily orders, more
      than 300,000 connected refrigerated trucks, and more than 11 million square metres of
      connected cloud warehouses. A separate industry article repeats several network and customer
      figures but attributes them to the company ecosystem. These metrics suggest a mature
      operating data footprint and a potential differentiation in network orchestration, yet they
      are not the same as independently measured service quality or defensible software revenue.
      The market context raises a countervailing risk: capacity growth and service homogenization
      can pressure utilization and pricing, while fragmented operators and broken-chain practices
      make consistent temperature and SOP control difficult. No retained source establishes a
      public security certification, incident history, validated cold-chain audit, or customer-level
      before-and-after performance result.
    claimRefs: [CE008, CE009, CE010, CE011, CE012]
  - id: diligence-verdict
    title: Product diligence verdict
    body: >-
      Fresh Life appears differentiated by combining a nationwide cold-chain operating network
      with a control-tower and workflow-automation thesis. The product is therefore best assessed
      as a technology-enabled logistics operating system layered over physical capacity, not as a
      pure software product. The core underwriting question is whether the digital layer produces
      repeatable improvements in temperature compliance, spoilage, route productivity, settlement
      speed, and customer retention across acquired and subcontracted operations. Public materials
      provide architecture and scale assertions but leave the decisive proof points—service-level
      distributions, exception rates, data governance, security testing, integration effort,
      deployment cohort outcomes, and unit-level economics—unresolved.
    claimRefs: [CE013, CE014]
callouts:
  - calloutType: insight
    title: Integrated logistics plus control layer
    body: Fresh Life's product thesis is a source-to-store cold-chain service with digital dispatch, monitoring, risk controls, and traceability; the technology claim is meaningful only if it improves physical-network execution.
    claimRefs: [CE001, CE004, CE006]
  - calloutType: risk
    title: Scale claims are not service-level proof
    body: The retained sources report large network and data figures, but do not independently establish uptime, temperature compliance, spoilage reduction, security controls, or realized customer ROI.
    claimRefs: [CE008, CE009, CE014]
