  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-security
      missingEvidence: Independent uptime, temperature-compliance, incident, cybersecurity, privacy, and access-control evidence for the control tower and connected asset network.
      whyItMatters: The product thesis depends on trustworthy real-time data and exception handling; without independent control evidence, scale claims cannot be translated into reliability or safety assurance.
      diligencePath: Request SOC or equivalent security reports, sensor and calibration standards, incident logs, uptime by module, alert-latency distributions, and representative customer SLA reports.
      relatedQuestionRefs: [QE005, QE006, QE007, QE009]
    - type: missing-source
      severity: material
      topic: deployment-outcomes
      missingEvidence: Customer-level before-and-after evidence for dispatch productivity, spoilage, temperature excursions, settlement speed, and retention.
      whyItMatters: Network size and record counts do not establish that the technology improves economics or customer outcomes.
      diligencePath: Obtain anonymized deployment cohorts with baseline and post-deployment KPIs, implementation timelines, human override rates, and renewal or expansion outcomes.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: minor
      topic: architecture-integration
      missingEvidence: Technical documentation for APIs, data ownership, model governance, integration with customer systems, and acquired-network system migration.
      whyItMatters: A distributed acquisition and partner model can create integration friction and inconsistent data quality even when the target architecture is coherent.
      diligencePath: Review architecture diagrams, interface inventories, data-retention policies, model cards, migration plans, and representative implementation work orders.
      relatedQuestionRefs: [QE003, QE009]
