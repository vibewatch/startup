              detail: Capacity matching and vehicle pricing use network and cost inputs.
            - label: AI-SOP and risk controls
              detail: Operational instructions and order, settlement, and fulfillment checks are modeled.
        - label: Data and IoT layer
          detail: Event records and connected assets provide inputs to the control layer.
          items:
            - label: Event data
              detail: Company-issued material claims more than 30 billion records in the Yunlizi system.
            - label: Connected assets
              detail: Company-issued material claims connected refrigerated trucks and cloud warehouses.
        - label: Physical operating network
          detail: Warehouses, vehicles, branches, and partner capacity deliver the physical service.
          items:
            - label: Warehouses and vehicles
              detail: Acquired, self-built, and partner capacity supports refrigerated storage and distribution.
            - label: Branch and route footprint
              detail: Public descriptions cite more than 100 branches and nationwide coverage.
        - label: Expansion layer
          detail: Adjacent technology, vehicle, warehouse, and overseas initiatives extend the operating model.
          items:
            - label: Technology and network extensions
              detail: Public material describes smart warehousing, vehicle design, and overseas supply-chain initiatives.
    approximationNotes: "Layer order represents the disclosed operating logic, not a measured dependency graph or proof that every module is deployed at every site."
    claimRefs: [CE001, CE004, CE006, CE008]
