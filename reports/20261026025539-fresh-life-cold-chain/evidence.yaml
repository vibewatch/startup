evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited revenue, gross margin, EBITDA, cash flow, debt, and current balance-sheet data.
    whyItMatters: Network and throughput metrics do not establish profitability, cash generation, or funding capacity.
    diligencePath: Request audited financial statements, management accounts, debt schedules, and KPI definitions for 2023-2026.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Primary financing documents confirming the reported RMB10 billion 2022 valuation and establishing the current
      valuation.
    whyItMatters: A historical media-reported financing mark cannot establish the company's current valuation or investor economics.
    diligencePath: Obtain signed term sheets, closing statements, cap table snapshots, and investor confirmation for each 2022 round.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current shareholder register, board roster, reserved matters, related-party agreements, and preference stack.
    whyItMatters: Sponsor control and investor protections cannot be assessed from media summaries alone.
    diligencePath: >-
      Request current registry extracts, articles, shareholder agreement, board minutes, and financing schedules under
      NDA.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete executive, board, and functional leadership roster with tenure and succession coverage.
    whyItMatters: Only two public figures are retained, so key-person dependence and governance depth remain uncertain.
    diligencePath: Request an organization chart, biographies, tenure dates, and succession / delegation plans.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Customer concentration, active-account definition, renewal behavior, spoilage, claims, and service-level history.
    whyItMatters: Reported customer and store counts may overstate recurring economic quality without retention and loss data.
    diligencePath: Request cohort tables, top-20 customer concentration, renewal/churn, claims, spoilage, and SLA data.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: adoption-gaps
    missingEvidence: Contract-level buyer, payer, renewal, concentration, utilization, margin, and claims data by segment and region.
    whyItMatters: Network reach and customer counts do not show whether growth converts into durable, profitable outsourced spend.
    diligencePath: >-
      Obtain a segmented customer cohort, contract renewal, gross-margin, utilization, spoilage, and claims pack under
      NDA.
    relatedQuestionRefs:
      - QM004
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled market-sizing bridge explaining the different China market values and service definitions.
    whyItMatters: >-
      The $73.3 billion, $17.2 billion, and implied China share of the $363.8 billion global estimate are not directly
      comparable.
    diligencePath: >-
      Request source methodologies and reconcile service scope, geography, currency, and inclusion of warehousing,
      transport, and value-added services.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: substitutes
    missingEvidence: Buyer-level evidence on internal-build, regional-carrier, broker, and ambient substitution rates.
    whyItMatters: Substitution determines pricing power and the speed at which a national network can displace local incumbents.
    diligencePath: >-
      Review win/loss records, procurement tenders, and lane-level competitive alternatives for the top customer
      cohorts.
    relatedQuestionRefs:
      - QM001
      - QM008
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized price, contract minimum, discount, SLA-credit, and gross-margin data for Fresh Life and named
      competitors.
    whyItMatters: >-
      Without transaction-level pricing, the bundle cannot be assessed for price leadership, margin durability, or buyer
      switching economics.
    diligencePath: >-
      Request anonymized customer contracts, rate cards, realized-price cohorts, discount approvals, and SLA-credit
      schedules from management and reference customers.
    relatedQuestionRefs:
      - QP004
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat durability
    missingEvidence: >-
      Independent customer references and longitudinal retention, spoilage, claims, utilization, and service-level
      comparisons against incumbents.
    whyItMatters: >-
      Network and software claims do not prove that the operating model creates durable buyer value or prevents
      multi-homing.
    diligencePath: >-
      Obtain a customer cohort file, top-customer concentration, renewal and churn records, claims history, and matched
      benchmark results by route and temperature band.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: enumeration-incomplete
    severity: minor
    topic: competitor landscape
    missingEvidence: >-
      A current China cold-chain competitor census with comparable regional coverage, storage capacity, fleet, revenue,
      and market-share definitions.
    whyItMatters: >-
      The assigned player lists identify alternatives but cannot establish rank, share, or the completeness of the
      competitive set.
    diligencePath: >-
      Commission a current competitor screen using company filings, official network data, procurement records, and
      customer references across China.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited revenue, gross margin, EBITDA, cash flow, and service-line contribution margins for at least the latest
      two fiscal years.
    whyItMatters: Network and financing scale cannot establish that logistics activity produces durable gross profit or cash.
    diligencePath: >-
      Obtain signed financial statements, segment P&L, revenue-recognition policy, and a bridge from orders and tonnes
      to recognized revenue.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, receivables aging, payables, capex, leases, debt, and committed financing.
    whyItMatters: The described self-build and acquisition model may require external capital even if reported activity is growing.
    diligencePath: Request a 24-month cash bridge, debt schedule, capex plan, liquidity sources, covenants, and next-round trigger.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
