      cold-chain logistics volume reached 381.4mn tonnes in 2025, up 4.5 per cent year on year. According to a report
      from Global Times, consumer demand for high quality, fresh produce has driven more volume, increased capacity and
      technological advances. CFLP data also showed total cold storage capacity rose to 267mn cubic meters in 2025, an
      increase of 5.53 per cent from the year prior.
