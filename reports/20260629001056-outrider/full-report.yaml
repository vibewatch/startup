      - number: '1.4'
        title: Current Readiness and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The strongest 2025–2026 read-through is that Outrider is preparing for broader commercial scale rather
              than basic technical proof. The company announced reinforcement-learning deployment that improved
              path-planning speed, a safety framework reviewed by TÜV SÜD, SOC 2 Type 2 certification for enterprise
              information security, and a support-services layer explicitly built for the 2026 rollout of driverless
              yard operations. Those milestones make the company look more operationally mature than many autonomy
              startups that remain trapped in demo mode. Independent coverage also helps frame why investors continue to
              fund this niche: broader open-road autonomy has proven harder and more expensive than expected, while
              controlled yards offer a more bounded and therefore more financeable environment. Even so, the diligence
              file is incomplete. Public materials still do not reveal current revenue, customer count, board control,
              exact headcount, or a current valuation mark, so the company is easier to underwrite as a technology and
              deployment story than as a fully transparent investment case.
