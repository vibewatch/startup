    Integrated autonomous yard-operations platform spanning dispatch software, autonomous electric yard trucks, trailer
    hitching and brake-line automation, trailer inventory tracking, dock interactions, safety systems, and remote
    support services.
  customerFocus: >-
    Fortune 500 and other logistics-dependent enterprises in package shipping, retail and e-commerce, consumer packaged
    goods, manufacturing, and adjacent high-throughput yard environments.
  businessModel: >-
