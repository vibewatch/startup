      - number: '8.2'
        title: Financing context and comparable boundaries
        blocks:
          - type: paragraph
            body: >-
              The 2026 financing evidence is directionally useful but incomplete. The Form D proves that Outrider was
              still raising capital after the 2024 Series D and that more than $21 million had already been sold, yet it
              does not say at what valuation or on what preference stack. That pushes the analysis toward boundary
              markers rather than clean comps. Public references span a very wide range. Symbotic shows what
              revenue-backed warehouse automation looks like once scale and profitability are visible. Aurora shows that
              public markets will still pay billions for autonomy optionality even when revenue is minimal. Ouster and
              Serve frame smaller-cap technology boundary cases in sensing and emerging robotics. Private peers
              reinforce the same point from another angle: Fernride can still raise growth capital, Gatik can claim
              contract-backed driverless scale, and Kodiak’s discounted raise shows what happens when capital providers
              demand tougher terms. None of these are perfect peers, but together they imply that Outrider’s price
              should be tied to milestone quality, not to the most generous headline multiple in automation.
            claimRefs:
