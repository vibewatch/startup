      - number: '3.4'
        title: Moat durability, adverse evidence, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public record still supports a real Outrider wedge, but not an unassailable one. The company remains
              unusually focused on distribution-yard autonomy, and its visible claims around trailer-line handling,
              mixed-traffic safety, reinforcement-learning gains, and 24x7 support are broader than what many peers
              publish. That matters because buyers care about whether autonomous yard trucks can actually replace
              repetitive labor in messy facilities, not just drive point to point. The adverse case is equally clear.
              OEMs and autonomy developers are converging; Kalmar and Forterra show how quickly a trusted tractor
              platform can gain an autonomy layer, and ISEE plus TICO show that retrofit and factory-integrated routes
              can coexist. Human-assisted autonomy from FERNRIDE may also win cautious customers who prefer a lower-risk
              operating model over a fully driverless claim. Meanwhile, YMS and visibility vendors keep expanding what
              can be improved without robots at all. Independent market commentary is constructive about long-term
              demand, but still emphasizes capital intensity, integration cost, and the need for clear operational value
              before deployment broadens. The main unresolved underwriting gaps are precisely the ones public vendors do
              not want to disclose: realized price per site, head-to-head win rates, customer concentration, autonomous
              cost per move, and how much of the stack is hardware, software, or service revenue. Until those are
              answered, Outrider’s moat looks plausible but only partially proven.
            claimRefs:
