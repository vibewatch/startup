      - number: '7.4'
        title: Mitigations are visible, but kill criteria still depend on private diligence
        blocks:
          - type: paragraph
            body: >-
              Outrider is not treating scale-up as a passive next step. The company says it expanded engineering
              headcount internationally, employs more than 190 people across more than 10 countries, and is still hiring
              across mechanical, reliability, cloud, safety-software, and operator roles. That is the right staffing
              shape for 2026 commercialization, but it also signals that execution complexity is rising at the same time
              that support, partner management, and customer rollout expectations are rising. Public mitigations do
              exist: a real safety-case discipline, remote-support tooling, partner co-development, a visible patent
              portfolio, and an ability to raise fresh capital even after a large prior round. What is still missing are
              the materials that would convert those mitigations into a low-residual-risk verdict: signed customer
              contract exhibits, service-level commitments, incident and intervention logs, state and site compliance
              memos, insurance and indemnity structures, and a current liquidity bridge. The practical investment
              posture is therefore conditional. If the next diligence round shows stable incident handling, contract
              protections, and enough capital to finish rollout, risk compresses materially. If not, the same
              concentration points become thesis-break triggers rather than routine scale-up noise.
