companyProfile:
  summary: >-
    Outrider is a private Colorado-based industrial-autonomy company focused on automating logistics yard operations for
    large enterprises. Its system combines management software, autonomous electric yard trucks, site infrastructure,
    and later support services to move trailers, manage inventory, and integrate with warehouse-adjacent workflows. The
    strategic appeal is a tightly bounded autonomy use case with visible customer validation and strong strategic
    backers; the diligence challenge is that public disclosure still omits current valuation, revenue, pricing, and
    customer concentration.
  foundedDate: '2017-01-01'
