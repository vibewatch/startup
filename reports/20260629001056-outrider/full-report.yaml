  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Outrider is not competing against one clean cohort. The most direct autonomous-yard peers are ISEE and
              FERNRIDE: both pitch safer, more predictable trailer movement in active logistics yards, and both now have
              enough public proof to matter in live buyer conversations. ISEE emphasizes fully autonomous yard moves, a
              Fortune 100 deployment, and a new OEM-integrated path with TICO. FERNRIDE covers yard shunting, container
              terminals, and manufacturing flows, but deliberately uses a human-assisted operating model with remote
              takeovers as a bridge to higher autonomy. Around those pure-play peers sit formidable incumbents. Orange
              EV already owns the electric-yard-truck conversation for many U.S. fleets; Kalmar Ottawa and Terberg bring
              long product histories, service reach, and credibility with terminal-tractor buyers. A second flank comes
              from adjacent yard-software vendors including Kaleris, FourKites, and C3, which solve visibility, gate,
              dock, and spotter-tasking pain without asking buyers to underwrite robot vehicles. The final substitute is
              still the status quo: diesel or electric spotters, spreadsheets, radios, and selective internal workflow
              improvement. That means Outrider must beat autonomous peers on capability, incumbents on trust and uptime,
              software vendors on orchestration ROI, and the manual baseline on speed-to-value.
