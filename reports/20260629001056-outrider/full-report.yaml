      - number: '2.4'
        title: Growth Drivers, Constraints, and Open SAM Questions
        blocks:
          - type: paragraph
            body: >-
              Demand tailwinds are real. CBRE, Cushman & Wakefield, and Link Logistics all describe 2026 demand for
              automation-ready warehouse and logistics space, continued 3PL outsourcing, and power-capable buildings
              that can handle more sophisticated operating systems. Electrification is also a real driver because
              terminal-tractor OEM and analyst sources increasingly frame zero-emission yard fleets as commercially
              relevant in high-duty-cycle environments. But adoption is not frictionless. CARB’s Advanced Clean Fleets
              language now directly compels state and local government fleets rather than creating a blanket
              private-fleet mandate, so decarbonization is a directional tailwind rather than universal coercion for
              Outrider’s target base. Safety governance remains non-trivial: OSHA’s General Duty Clause still applies,
              and ANSI/ITSDF B56.5-2024 provides design, operation, and maintenance guidance for unmanned guided
              industrial vehicles. On economics, Mordor highlights the biggest brake: battery-electric terminal tractors
              still carry meaningfully higher upfront sticker prices than diesel units and often require brownfield
              power upgrades. NREL’s depot-electrification work supports that charging design is a gating workstream.
              The result is a credible growth market with a narrower immediately serviceable segment than top-down TAM
              headlines imply.
            claimRefs:
