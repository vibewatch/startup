            body: >-
              Public evidence supports Outrider as an enterprise-sold, integrated automation offer rather than a narrow
              software tool. The system combines autonomous trailer movement, dispatch and monitoring software,
              trailer-inventory APIs, site infrastructure, and now enterprise-class support services. Outrider itself
              repeatedly describes the business as autonomous yard operations as a service for Fortune 500 logistics
              hubs, which implies recurring commercial relationships even when the exact contract mechanics remain
              private. The support-services launch matters financially because it adds explicit uptime, diagnostics, and
              exception-handling services around the vehicle-and-software stack, creating a service layer that could
              recur even if initial deployments are project-like.


              What the public record does not provide is price realization. No reviewed official page, press release, or
              independent article disclosed list pricing, per-move fees, site subscriptions, implementation charges,
              software seat pricing, or support-contract rates. That means the chapter can describe the monetization
              architecture, but not convert it into audited ARR, GMV, or gross-profit math. The revenue-quality
