      - number: '1.3'
        title: Capital History and Commercialization
        blocks:
          - type: paragraph
            body: >-
              Outrider’s funding history shows steady investor support tied to visible technical milestones. The company
              launched publicly with $53 million across seed and Series A, added a $65 million Series B in 2020, raised
              $73 million in Series C in 2023, and then closed a $62 million Series D in October 2024. Official and
              independent coverage align that the latest round pushed total equity capital above $250 million, with Koch
              Disruptive Technologies and NEA still central and newer strategic backers including NVentures, Prologis
              Ventures, and others. The commercialization story has also matured in sequence: test and pilot programs, a
              dedicated Brighton testing facility, automated hitching, customer production moves with Georgia-Pacific,
              broader AI perception work, and finally 2025 support services aimed at 2026 commercial rollout. The
              missing piece is valuation transparency. Public sources disclose funding scale and investor quality, but
              not a current post-Series D mark, secondary pricing, or other contemporary value anchor.
