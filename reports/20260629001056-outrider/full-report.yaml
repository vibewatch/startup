      - number: '1.2'
        title: Leadership, Governance, and Customer Footprint
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of the strongest public signals around Outrider. Andrew Smith is consistently
              identified as founder and CEO, and later releases add operating depth through executives such as COO Bob
              Hall, CTO and EVP of Engineering Vittorio Ziparo, SVP of Software Engineering Jeremy Nett, and Head of IT
              Operations John Stein. Still, public governance disclosure is thin relative to the capital raised and the
              operational-critical nature of the product. Outrider does not publish a formal board page or governance
              package on its website, so investors largely infer oversight through financing releases, partner quotes,
              and third-party directories. Customer disclosure is similarly selective. Georgia-Pacific is the clearest
              named production reference, while the company repeatedly says additional Fortune 500 customers in package
              shipping, retail, e-commerce, consumer packaged goods, manufacturing, and related sectors account for more
              than 20 percent of North American yard trucks. That suggests material market reach, but the precise
              roster, concentration, and contract economics remain opaque.
