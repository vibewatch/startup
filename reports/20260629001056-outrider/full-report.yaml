      - number: '3.3'
        title: Switching cost, distribution power, and why status quo still matters
        blocks:
          - type: paragraph
            body: >-
              Outrider’s hardest competitors may be the ones that already sit inside the buyer’s procurement process.
              Orange EV has enough vehicles in service, uptime proof, and customer standardization to make electric yard
              trucks feel normal rather than experimental. Kalmar Ottawa and Terberg similarly benefit from
              installed-base trust, dealer or service coverage, and the ability to layer autonomy onto familiar
              platforms later. ISEE and TICO reduce switching friction in a different way by promising autonomy-capable
              tractors off the line and retrofits for existing TICO fleets, which is easier for some buyers than
              changing both workflow and hardware standard at the same time. Software-first alternatives compress risk
              even further. Kaleris, FourKites, and C3 can digitize gate control, trailer visibility, dock scheduling,
              and shunter dispatch while leaving current trucks and labor models largely intact. That is important
              because the manual baseline is still strong in real yards: public 2026 commentary continues to describe
              spreadsheets, paper logs, radio dispatch, and weak trailer visibility as common operating practice. In
              that environment, many operators can improve throughput materially with software, cameras, and process
              redesign before they accept the capital, safety, and organizational burden of full autonomy. Outrider
              therefore has to sell not only a better robot, but a more compelling change-management path than
              incumbents, software vendors, and the buyer’s own operations team.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
