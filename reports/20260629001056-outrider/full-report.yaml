  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Current valuation still undisclosed after diligence kickoff
        - Management refuses to provide a priced cap-table mark or recent term sheet.
        - Without price, no public-comp exercise can become an investable return case.
        - Stop the process or insist on terms-first diligence before spending more time.
      - - Revenue quality disappoints
        - Gross margin remains negative or support labor dominates deployment economics.
        - The full-stack narrative becomes project-services heavy rather than software-plus-automation scalable.
        - Reprice to downside or walk away.
      - - Customer concentration is extreme
        - One or two lighthouse accounts represent most deployed volume or revenue.
        - The commercial proof is less repeatable than public milestones imply.
        - Demand stronger structure, lower price, or additional proof before investing.
      - - Financing terms are investor-protective
        - Preference stack, warrants, or anti-dilution provisions capture most upside for insiders or prior investors.
        - New-money returns can be poor even if operations improve.
        - Do not underwrite at the proposed economics.
      - - Macro and regulatory friction worsen
        - Customer capex timing weakens further while safety-case burden rises.
        - Rollout velocity and sales cycles lengthen, reducing premium-valuation support.
        - Move to bear case and shorten diligence leash.
    notes: >-
      Each trigger is framed as a falsifiable diligence condition rather than as a generic startup risk so that the
      committee can convert it into a go or no-go decision.
