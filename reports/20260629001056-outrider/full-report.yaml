        - Less repetitive labor and better turn-time discipline
        - Blocked docks or unsafe approach conditions can still require human intervention
      - - Move trailer from dock to parking
        - Human driver waits for dock release, pulls trailer out, parks it, and updates systems
        - System checks dock readiness, performs controlled undocking, and parks trailer
        - Reduces driver in/out-of-cab activity and trailer-search friction
        - Physical dock readiness still depends on site process and equipment
      - - Find misplaced trailer
        - Personnel walk or drive yard to confirm location
