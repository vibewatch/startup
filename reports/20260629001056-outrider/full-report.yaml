      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No price discovery, no premium thesis
            body: >-
              The missing current valuation is not a cosmetic gap. It blocks every downstream return judgment, from
              dilution math to comparable-multiple reasonableness.
            calloutType: risk
            claimRefs:
              - CV012
              - CV039
              - CV040
              - CV044
          - type: callout
            title: Comparable dispersion is the message
            body: >-
              The reviewed comp set is useful mainly because it is so wide: it shows how quickly valuation arguments can
              drift if maturity, revenue quality, and business model are not normalized first.
            calloutType: insight
            claimRefs:
              - CV015
              - CV018
              - CV023
              - CV026
              - CV045
              - CV046
          - type: callout
            title: Adverse sources attack economics more than product reality
            body: >-
              The harshest evidence does not say autonomous freight has no market. It says capital markets and customers
              punish models that cannot prove scale economics fast enough.
            calloutType: risk
            claimRefs:
              - CV029
              - CV036
              - CV037
              - CV042
