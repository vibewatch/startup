chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and System Scope
        blocks:
          - type: paragraph
            body: >-
              Outrider’s identity is unusually consistent across its public materials even though some operating details
              remain private. The company emerged from stealth in 2020 describing itself as the first company focused
              specifically on autonomous yard operations for logistics hubs, and it has kept that positioning through
              2025 product, safety, and support announcements. The business is not selling a single robot or a narrow
              perception stack; it markets an integrated system that combines management software, autonomous yard
              trucks, and site infrastructure so yards can dispatch moves, track trailer inventory, interact with
              loading docks, and monitor operations centrally. Across official product pages and later press releases,
              the same mission repeats: replace hazardous, repetitive yard work with autonomous zero-emission operations
              that improve throughput, safety, and sustainability. That coherence matters because it suggests the
              company has stayed tightly focused on a controlled-environment autonomy wedge rather than drifting into
              general-purpose trucking claims.
