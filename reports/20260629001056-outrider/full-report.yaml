  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Current valuation
        - Pre-money, post-money, share count, and price per share for the latest financing
        - No return model is credible without a real entry price.
        - CEO/CFO to provide financing deck, board consent, and cap-table export.
      - - Security terms
        - Preferences, warrants, anti-dilution, and any secondary-sale structure
        - These terms determine downside and who captures upside.
        - Company counsel to share executed term sheet and definitive documents.
      - - Revenue quality
        - ARR or contract revenue by customer, margin by site, and support intensity
        - This distinguishes scalable software-like economics from project-heavy rollout economics.
        - Finance team to provide cohort model, margin bridge, and customer unit economics.
      - - Customer concentration
        - Named customer roster, site counts, renewal history, and expansion pipeline
        - Concentration can turn one lighthouse account into a misleading valuation anchor.
        - Sales ops to provide account concentration and cohort expansion pack.
      - - Runway and burn
        - Current cash, monthly burn, debt, and downside runway forecast
        - A 2026 raise does not reveal whether financing was optional or necessary.
        - FP&A to provide monthly cash bridge and downside runway sensitivity.
      - - Benchmarking pack
        - Banker comps, recent private marks, and internal price positioning versus peers
        - Boundary comps help, but final pricing needs a tailored peer and transaction set.
        - Lead investor or banker to provide current comp sheet and private market color.
    notes: >-
      These are the minimum asks required to convert the chapter from research-more to an actual pricing recommendation.
      Null public disclosures are treated as diligence obligations, not as blanks to guess through.
    claimRefs:
      - CV012
      - CV039
      - CV040
      - CV041
      - CV044
