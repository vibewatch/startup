  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting stance
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to show that Outrider is a real commercialization story, not a
              slideware autonomy concept. The company has a documented 2026 commercial-rollout plan for support-backed
              deployments, one named live distribution-center customer, and a full-stack product narrative that covers
              autonomous trailer moves, site orchestration, and 24x7 support. That matters because it separates the
              company from peers that still talk mainly about roadmap and testing. But those positives do not solve the
              valuation problem. No reviewed 2026 source discloses a current post-money valuation, a share price for the
              new financing, revenue run rate, gross margin, or retention metrics. That means the chapter cannot justify
              paying a premium round price from public facts alone. The appropriate stance is therefore research-more,
              with medium confidence and a high risk rating: credible product and customer proof exist, yet the return
              math is not publicly underwriteable until the company opens private operating and financing data.
            claimRefs:
              - CV001
