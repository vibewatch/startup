              disclosed equity capital above $250 million. Independent coverage aligns that the proceeds were meant to
              fund 2025 commercial scaling and a path toward hundreds of systems with key customers. Those are positive
              financing signals, but they stop short of telling an investor whether the company was already well
              capitalized for that plan.


              The 2026 Form D matters because it shows financing activity continued after the last widely covered round.
              Filing records show a new $50 million offering filed on April 28, 2026, with $21.5 million sold across 36
