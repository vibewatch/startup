  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Outrider’s market is best defined as private-yard trailer movement and control, not generic autonomy. Its
              homepage, system page, and 2025 operating releases all describe a package that combines autonomous
              electric yard trucks, yard orchestration logic, trailer tracking, and remote support for mixed-traffic
              logistics yards. That means included spend covers terminal tractors and yard trucks, the control software
              that dispatches and tracks trailer moves, site integration work, and the support services needed to keep
              driverless yards running. Excluded spend should include long-haul AV networks, inside-the-four-walls
              robotics, and unrelated warehouse software. The status quo is still manual diesel or electric terminal
              tractors coordinated through local operating rules plus YMS, WMS, or TMS systems. This boundary matters
              because broad autonomy headlines can easily inflate Outrider’s opportunity by mixing yard, port,
              warehouse, and public-road categories into one number.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
