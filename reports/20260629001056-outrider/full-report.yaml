      - number: '8.4'
        title: Final diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The exit-readiness question is straightforward: Outrider is not yet transparent enough for a clean
              public-market style valuation debate. The public file still lacks a current valuation mark, financing
              structure, revenue quality metrics, customer concentration, and a cash-runway bridge after the 2026
              offering. Those are not cosmetic gaps; they determine whether the company should be treated as a premium
              automation platform, a milestone-driven private round, or a bridge-risk situation. The right diligence
              posture is therefore to force the company to prove three things before price: first, that
              commercialization is expanding beyond a lighthouse deployment; second, that gross margin and support
              intensity improve as sites scale; and third, that the latest financing terms do not embed downside
              protection that leaves new investors paying for upside they do not receive. If management cannot answer
              those asks with primary evidence, the thesis should break before capital is committed.
            claimRefs:
              - CV012
              - CV039
              - CV040
              - CV041
              - CV044
