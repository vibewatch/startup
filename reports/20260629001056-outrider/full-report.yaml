  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and yard workflow
        blocks:
          - type: paragraph
            body: >-
              Outrider is not selling a single robot feature; it markets an operating system for distribution-yard work.
              Across its system page, product press releases, and partner materials, the same architecture appears
              repeatedly: management software coordinates work, autonomous electric yard trucks execute the moves, and
              site infrastructure plus dock processes make the workflow safe and usable in live facilities. The system’s
              job is narrow but operationally important: move trailers between parking spots and dock doors, track where
              trailers are, and keep a mixed fleet flowing without forcing operators to redesign the rest of the
              warehouse stack around open-road autonomy. Public workflow proof is strongest on the repetitive tasks that
              normally force drivers in and out of cabs—backing, hitching, brake-line connection, inventory scans, and
              exception routing. The support-service launch also clarifies that the customer workflow is not yet fully
              zero-touch. Outrider says the system can find misplaced trailers, search for open spots, and re-queue work
              automatically, but it still notifies site personnel when debris, blocked docks, or other physical
              exceptions require human help. That combination makes the product more real than a demo-only autonomy
              stack, while also showing exactly where humans remain in the loop.
