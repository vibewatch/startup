- id: deployment-safety-security-and-support
  title: Deployment, safety, security, and support controls
  body: 'Outrider’s trust posture is the most mature part of the public technology file. The safety case is not described
    as a light compliance exercise: the company says it uses an exhaustive framework spanning risk assessment, design completion,
    scenario testing, field validation, deployment procedures, and ongoing safety checks. The flagship 2025 safety release
    is unusually concrete, claiming 14 safety mechanisms for more than 200,000 yard-specific hazards, backed by redundant
    hazard detection, fail-safe hardware, and health monitoring that can override unsafe behavior and stop the vehicle. External
    trade coverage largely repeats those specifics rather than contradicting them, which gives the safety story more credibility
    than a lone company post would. Cybersecurity disclosure is also better than normal for an industrial-autonomy startup.
    Outrider says its SOC 2 Type 2 process covered cloud software, APIs, data governance, threat detection, failover, backups,
    and secure development practices for safety-critical functions such as obstacle detection and braking. Still, the support
    launch makes the operating reality clear: safe commercialization depends on 24x7 remote diagnostics, trained specialists,
    and disciplined customer-site procedures, not on a claim that the system can handle every exception autonomously today.'
  claimRefs:
