- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Public maturity signal
  - Technical risk
  rows:
  - - NVIDIA DRIVE compute
    - Processes numerous sensor inputs for perception and inference
    - NVIDIA platform and software libraries
    - Officially deployed across fleet and testing facility
    - Partner roadmap and compute economics remain external dependencies
  - - Multi-modal perception stack
    - Identifies yard actors, orientation, position, and trajectories
    - Sensor suppliers plus proprietary models
    - Latest release claims >3x range and 10x data vs earlier platform
    - No public independent benchmark across weather and lighting regimes
  - - Reinforcement-learning path planning
    - Improves route decisions and turn-time in complex yards
    - Hybrid cloud training plus proprietary data
    - Official release claims 10x path-planning speed improvement
    - No public intervention-rate delta or customer-by-customer throughput audit
  - - TrailerConnect robotic manipulation
    - Connects brake and electric lines without trailer modifications
    - Yaskawa robot hardware plus proprietary control and perception
    - Publicly released as patented production capability
    - Connector diversity and hardware serviceability at scale are not publicly quantified
  - - Autonomy-ready EV truck platform
    - Provides electric yard-truck base, drive-by-wire integration, and charging context
    - Orange EV and other approved hardware vendors
    - Partner page cites 24 autonomy-ready trucks purchased for pilots and tests
    - Partner hardware availability and service network remain critical
  - - Cloud software and APIs
    - Expose trailer inventory and operations data to customer systems
    - Customer WMS/YMS/TMS and Outrider cloud stack
    - Official materials repeatedly cite API-based sharing and centralized management
    - No public API docs, latency targets, or integration backlog metrics
  notes: This table mixes proprietary software layers with partner-supplied hardware because Outrider’s public architecture
    is explicitly ecosystem-based rather than vertically self-built.
