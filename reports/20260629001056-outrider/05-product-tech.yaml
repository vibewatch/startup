tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - What it does
  - Maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Cloud management software
    - Yard dispatchers / operations managers
    - Dispatches work, monitors moves, manages inventory state, and shares data through APIs
    - Commercially described and embedded across multiple releases
    - Coordinates both manual and autonomous trucks instead of isolating autonomy in a demo environment
    - No public screenshots, module-level pricing, or uptime metrics
  - - Autonomous electric yard trucks
    - Site operations teams
    - Move trailers between dock doors and parking spots with autonomous backing and routing
    - Commercial rollout targeted for 2026 after select 2025 driverless deployments
    - Uses electric platforms and purpose-built yard workflow rather than open-road AV scope
    - No fleetwide availability or MTBF disclosure
  - - TrailerConnect robotic line handling
    - Autonomous truck / trailer interface
    - Connects and disconnects brake and electric lines on unmodified trailers
    - Publicly released and presented as patented technology
    - Removes one of the hardest manual steps in yard automation
    - No public failure-rate or cycle-time benchmark by fleet type
  - - Autonomous hitching
    - Autonomous truck / trailer interface
    - Aligns to trailers, attaches fifth wheel, and confirms kingpin connection with sensors
    - Publicly released as production capability
    - Covers diverse trailer heights, weights, and orientations
    - No public precision or miss-rate statistics
  - - Trailer inventory tracking
    - Dispatchers, warehouse, transportation teams
    - Uses sensors, computer vision, and deep learning to capture trailer location and identity and share it via API
    - Commercial release announced and tied to cloud software
    - Extends value beyond movement into yard-state visibility
    - No public benchmark on inventory accuracy or dwell-time reduction
  - - Enterprise support services
    - Customer site staff and remote support teams
    - Provides 24x7 diagnostics, self-diagnostics, exception routing, and remote troubleshooting
    - Launched ahead of 2026 driverless rollout
    - Makes autonomy an operating service instead of a one-time install
    - No public SLA, staffing ratio, or renewal data
  notes: Rows separate physically distinct product modules and service layers. Public evidence is strong on feature scope,
    but weak on module-level performance and commercial terms.
