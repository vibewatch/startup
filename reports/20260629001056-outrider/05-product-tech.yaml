- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Status-quo workflow
  - Outrider workflow
  - Claimed benefit
  - Limitation / exception
  rows:
  - - Move trailer from parking to dock
    - Human driver finds trailer, hooks lines, hitches, drives, and docks trailer
    - Autonomous truck receives job, finds trailer, hitches, connects lines, and moves trailer to dock
    - Less repetitive labor and better turn-time discipline
    - Blocked docks or unsafe approach conditions can still require human intervention
  - - Move trailer from dock to parking
    - Human driver waits for dock release, pulls trailer out, parks it, and updates systems
    - System checks dock readiness, performs controlled undocking, and parks trailer
    - Reduces driver in/out-of-cab activity and trailer-search friction
    - Physical dock readiness still depends on site process and equipment
  - - Find misplaced trailer
    - Personnel walk or drive yard to confirm location
    - Operating trucks capture location, IDs, and occupied/vacant spots during routine work
    - Improves inventory visibility and yard throughput
    - No public proof of audit accuracy by yard type
  - - Handle open-spot or queue changes
    - Dispatchers manually reshuffle work as conditions change
    - System re-queues moves and searches for open parking positions automatically
    - Improves responsiveness inside busy mixed-traffic yards
    - No public disclosure of optimization logic or queue priorities
  - - Resolve edge case
    - Driver or supervisor improvises around debris, blocked doors, or equipment issue
    - System notifies site personnel and remote support, then uses diagnostics and updated data to recover
    - Keeps autonomous operations moving without constant teleoperation
    - Humans remain part of the exception path
  notes: Workflow rows translate product claims into concrete user jobs. Benefits are directional because public sources do
    not publish audited before/after KPI packs by site.
