- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Public evidence
  - Scope
  - Status
  - Remaining gap
  rows:
  - - Safety case framework
    - Risk assessment, design sign-off, testing, deployment procedures, and field verification
    - Vehicle behavior and site operations
    - Publicly described on company safety page
    - No public safety-case dossier or audit artifacts by customer site
  - - TUV SUD AVCF alignment
    - Preliminary assessment of functional safety approach against AVCF requirements
    - Functional safety approach for yard operations
    - Publicly disclosed and externally repeated
    - Assessment alignment is stronger than a published certification package
  - - 14 safety mechanisms / >200k hazards
    - Redundant hazard detection, fail-safe hardware, and health monitoring
    - Mixed-traffic yard operation
    - Repeated in official and trade coverage
    - No breakdown by hazard category or field-incident statistics
  - - SOC 2 Type 2
    - Audit-backed controls for cloud software, APIs, governance, backups, and monitoring
    - Enterprise information security
    - Publicly disclosed for 2025 scale-up
    - No public penetration-test summary or data-retention architecture
  - - 24x7 remote monitoring and diagnostics
    - Specialists monitor, isolate, troubleshoot, and resolve issues remotely
    - Operational uptime and exception recovery
    - Official and trade sources align on support model
    - No published SLA, mean-time-to-recovery, or staffing ratios
  - - Secure development / cloud resilience
    - Threat detection, multi-region failover, backups, and SSDLC for safety-critical functions
    - Cloud and software delivery stack
    - Officially disclosed as part of SOC 2 process
    - No public privacy, model-governance, or third-party-risk detail
  notes: Controls are recorded exactly where the public record is specific. Absence of field-level incident, uptime, and audit-detail
    disclosure is preserved as a diligence gap rather than filled with assumptions.
