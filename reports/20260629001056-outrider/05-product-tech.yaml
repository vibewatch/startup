  evidenceGaps:
  - type: missing-source
    severity: material
    topic: uptime-metrics
    missingEvidence: Fleetwide uptime, intervention rate, mean time to recovery, and contractual SLA metrics for live customer
      deployments.
    whyItMatters: Those numbers determine whether the 2026 commercialization story is operationally proven or still mostly
      a feature-release narrative.
    diligencePath: Request site-level operating dashboards and support SLAs for at least three customer deployments, including
      monthly uptime and intervention logs.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: deployment-scale
    missingEvidence: Customer-by-customer counts for deployed vehicles, live sites, and autonomous move volumes after the
      24-truck Orange EV program and >100k move headline.
    whyItMatters: Scale readiness cannot be underwritten cleanly from aggregate claims alone because concentration and site
      diversity matter for reliability risk.
    diligencePath: Ask management for a deployment roster showing vehicle counts, customer sectors, move volumes, and whether
      each site is pilot, pre-production, or commercial.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: weather-envelope
    missingEvidence: Public test data on rain, snow, dust, nighttime visibility, and rare-failure recovery behavior across
      customer yards.
    whyItMatters: Driverless yard autonomy can fail at the margins even if baseline operations look strong, so edge-case performance
      affects both safety and uptime underwriting.
    diligencePath: Obtain validation reports or field-test summaries segmented by weather, visibility, and intervention trigger,
      with examples from customer yards rather than only the test facility.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: brownfield-retrofit
    missingEvidence: Detailed brownfield facility-readiness requirements by yard type, including dock equipment changes, communications
      systems, and process redesign costs.
    whyItMatters: Facility retrofits can slow rollout economics and limit which customers can scale beyond pilot deployments
      even if the vehicle autonomy works.
    diligencePath: Request implementation scopes and capex or operating-change budgets from recent customer projects, broken
      out by site class and dock configuration.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: security-detail
    missingEvidence: Public architecture detail on identity boundaries, privacy controls, model-governance practices, and
      third-party security testing beyond the SOC 2 summary.
    whyItMatters: Enterprise readiness is directionally strong, but large buyers may still care about how safety-critical
      data, APIs, and model updates are governed in practice.
    diligencePath: Request the SOC 2 bridge letter, security architecture diagrams, and a summary of penetration-testing or
      red-team findings under NDA.
