- id: FE001
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Operating flow from dispatcher instruction through autonomous move execution and exception handling in a live yard.
  data:
    nodes:
    - id: dispatch
      label: Dispatcher / system queues move
      description: Job originates from yard operations software and customer workflow
    - id: locate
      label: Truck locates trailer and yard state
      description: Inventory and perception identify trailer, spot, and traffic context
    - id: connect
      label: Hitch + line connection
      description: Autonomous hitching and TrailerConnect prepare trailer for movement
    - id: move
      label: Autonomous move to dock or parking
      description: Vehicle navigates mixed-traffic yard and executes controlled backing
    - id: exception
      label: Exception detected?
      description: Debris, blocked dock, or maintenance issue may require escalation
    - id: support
      label: Site personnel / remote support assist
      description: Support model resolves conditions the system cannot clear alone
    - id: close
      label: Re-queue / monitor / complete
      description: Cloud software updates inventory and dispatch state after completion
    edges:
    - from: dispatch
      to: locate
      label: assigns move
    - from: locate
      to: connect
      label: finds trailer
    - from: connect
      to: move
      label: safe to move
    - from: move
      to: exception
      label: checks conditions
    - from: exception
      to: support
      label: yes, needs help
    - from: exception
      to: close
      label: no, continue
    - from: support
      to: close
      label: recover and resume
  approximationNotes: Flow abstracts the recurrent yard job rather than mapping every branch of a customer-specific site SOP.
