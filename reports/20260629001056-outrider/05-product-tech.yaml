- id: architecture-and-enabling-technology
  title: Architecture and enabling technology
  body: 'The technology stack is specific enough to underwrite as a real product, not generic autonomy branding. Official
    materials say NVIDIA DRIVE handles perception compute, partner hardware contributes the base EV truck, steering, and robotics
    layers, and Outrider’s own software manages perception, motion planning, dispatch, trailer inventory, and cloud APIs.
    The two most differentiated technical elements are the trailer-handling workflow and the data loop around it. TrailerConnect
    robotically connects brake and electric lines to unmodified trailers, while autonomous hitching uses perception, motion
    planning, and control algorithms to align with varied trailer heights and orientations and confirm a successful kingpin
    connection. On top of that, trailer-inventory capabilities use sensors, computer vision, and deep learning on operating
    trucks to capture location, trailer IDs, and yard-state data and push it into cloud software and customer systems through
    APIs. Outrider’s later perception and reinforcement-learning releases show the company trying to harden the stack for
    scale rather than merely add features: more sensor range, more data, faster path planning, and hybrid-cloud training all
    point to throughput and edge-case handling as the current engineering frontier.'
  claimRefs:
