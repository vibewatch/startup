  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A priced post-Series-D round, secondary transaction, 409A mark, or other current valuation reference point.
    whyItMatters: Without a current valuation anchor, investors cannot judge whether the company’s technical momentum is already fully priced in.
    diligencePath: Request the latest cap-table summary, any secondary transactions since October 2024, and management’s current internal valuation framework.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: current-headcount-and-revenue
    missingEvidence: Current employee count, annualized revenue, gross margin, and deployment-backed recurring revenue metrics.
    whyItMatters: Commercial readiness claims are difficult to underwrite without operating scale and revenue efficiency data.
    diligencePath: Ask management for a current org chart, headcount by function, ARR or revenue-run-rate bridge, and margin disclosure.
