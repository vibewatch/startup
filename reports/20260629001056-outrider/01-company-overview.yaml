company:
  name: Outrider
chapter:
  number: 1
  title: Company Overview
  summary: Outrider is a Colorado-based private company focused on automating logistics-yard operations with autonomous electric yard trucks, management software, and site infrastructure. Public evidence strongly supports its capital progression from $53 million at launch to more than $250 million by the October 2024 Series D, plus 2025 milestones in reinforcement learning, safety review, cybersecurity, and support services, but leaves current valuation, current revenue, exact customer count, and full board governance undisclosed.
sections:
- id: identity-and-system-scope
  title: Identity and System Scope
  body: 'Outrider’s identity is unusually consistent across its public materials even though some operating details remain private. The company emerged from stealth in 2020 describing itself as the first company focused specifically on autonomous yard operations for logistics hubs, and it has kept that positioning through 2025 product, safety, and support announcements. The business is not selling a single robot or a narrow perception stack; it markets an integrated system that combines management software, autonomous yard trucks, and site infrastructure so yards can dispatch moves, track trailer inventory, interact with loading docks, and monitor operations centrally. Across official product pages and later press releases, the same mission repeats: replace hazardous, repetitive yard work with autonomous zero-emission operations that improve throughput, safety, and sustainability. That coherence matters because it suggests the company has stayed tightly focused on a controlled-environment
    autonomy wedge rather than drifting into general-purpose trucking claims.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO039
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance-and-customer-footprint
  title: Leadership, Governance, and Customer Footprint
  body: Founder continuity is one of the strongest public signals around Outrider. Andrew Smith is consistently identified as founder and CEO, and later releases add operating depth through executives such as COO Bob Hall, CTO and EVP of Engineering Vittorio Ziparo, SVP of Software Engineering Jeremy Nett, and Head of IT Operations John Stein. Still, public governance disclosure is thin relative to the capital raised and the operational-critical nature of the product. Outrider does not publish a formal board page or governance package on its website, so investors largely infer oversight through financing releases, partner quotes, and third-party directories. Customer disclosure is similarly selective. Georgia-Pacific is the clearest named production reference, while the company repeatedly says additional Fortune 500 customers in package shipping, retail, e-commerce, consumer packaged goods, manufacturing, and related sectors account for more than 20 percent of North American yard trucks.
    That suggests material market reach, but the precise roster, concentration, and contract economics remain opaque.
  claimRefs:
