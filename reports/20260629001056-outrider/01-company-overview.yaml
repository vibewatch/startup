callouts:
- calloutType: strength
  title: Controlled-environment autonomy is the strategic wedge
  body: Outrider kept its product scope tightly bounded to logistics yards, which are complex but far more controllable than open-road autonomy. That has helped it keep attracting capital and customer pilots while broader AV categories struggled.
  claimRefs:
  - CO022
  - CO037
  - CO038
- calloutType: risk
  title: Commercial readiness is clearer than financial transparency
  body: The company publishes persuasive deployment-readiness milestones, but public investors still cannot see the current valuation, revenue, board control, or customer concentration behind the story.
  claimRefs:
  - CO028
  - CO029
  - CO034
  - CO035
  - CO040
