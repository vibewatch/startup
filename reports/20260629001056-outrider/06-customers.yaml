- id: durability-support-and-expansion-logic
  title: Durability, support, and expansion logic
  body: 'What Outrider does disclose about durability is operational rather than contractual. The system is offered as a subscription
    service that bundles autonomy, cloud software, automated trailer inventory, and 24x7 support, which is the right architectural
    shape for recurring revenue and repeat usage. Support disclosures are unusually concrete: the system self-diagnoses issues,
    tracks moves between maintenance periods, alerts site personnel when blocked docks or debris require human intervention,
    and escalates unresolved issues to trained remote specialists whose findings are used to improve the AI stack. That matters
    because it suggests customer durability depends on uptime and exception handling, not on a fantasy of zero-human operations.
    Expansion logic is similarly plausible. Outrider links current deployments to distribution centers today and future intermodal
    rail and port applications later, while Orange EV’s 2026 market evidence shows customers in adjacent yard-electrification
    markets are moving from pilots to fleet standardization when uptime, service, and financing models are proven. Still,
    none of that substitutes for actual renewal, churn, or multi-site cohort disclosure.'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU024
  - CU035
  - CU037
  - CU038
  - CU041
