  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net revenue retention, gross retention, churn, renewal dates, contract length, and expansion rates by
      cohort.
    whyItMatters: Without retention metrics, the public file cannot distinguish repeat operational usage from true contractual
      durability.
    diligencePath: Request customer-cohort dashboards, renewal schedules, and sample contract language for pilot-to-production
      transitions.
    relatedQuestionRefs:
    - QU013
    - QU024
    relatedTableRefs:
    - TU004
    - TU006
  - type: missing-source
    severity: material
    topic: named-customer-breadth
    missingEvidence: Additional customer-side references beyond Georgia-Pacific, including named operators, go-live status,
      and site-level outcomes.
    whyItMatters: One named operator is not enough to judge concentration, portability, or the repeatability of customer success
      across verticals.
    diligencePath: Obtain at least three named customer references or customer-authored case studies that specify pilot versus
      production status.
    relatedQuestionRefs:
    - QU006
    - QU021
    relatedTableRefs:
    - TU003
    - TU006
  - type: missing-source
    severity: material
    topic: live-site-count
    missingEvidence: Live production site count, number of paying production accounts, and move-volume denominators by site.
    whyItMatters: Commercial milestones are visible, but the rollout pace cannot be underwritten without site-by-site denominators.
    diligencePath: Request a deployment matrix listing each live site, launch date, customer vertical, fleet size, and current
      operational status.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU002
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-and-contract-economics
    missingEvidence: Top-customer revenue share, minimum contract values, pricing structure, expansion clauses, and pilot-conversion
      economics.
    whyItMatters: The public over-20%-of-yard-trucks claim could still mask dependence on a handful of accounts with bespoke
      pricing and support needs.
    diligencePath: Review sample customer contracts, top-5 account mix, and board-level concentration reporting before underwriting
      customer quality.
    relatedQuestionRefs:
    - QU018
    - QU024
    relatedTableRefs:
    - TU005
    - TU006
  - type: missing-source
    severity: minor
    topic: customer-satisfaction-proof
    missingEvidence: Independent customer-authored references, satisfaction metrics, or SLA performance data.
    whyItMatters: Most current satisfaction evidence is company- or partner-authored, which weakens confidence in the durability
      and portability of customer success.
    diligencePath: Request customer reference calls, satisfaction surveys, and SLA reporting for at least one production site
      and two pilot sites.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU004
