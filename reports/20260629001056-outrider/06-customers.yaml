- id: adoption-trajectory-and-deployment-maturity
  title: Adoption trajectory and deployment maturity
  body: 'The public adoption arc is stronger than the named-logo count suggests. Outrider says customers have participated
    in testing and pilot operations since 2019, and successive releases show a staircase rather than a single milestone: more
    than 12,000 autonomous trailer moves informed the next-generation kit, Georgia-Pacific moved from proof of concept into
    daily production use, Outrider disclosed more than 100,000 autonomous trailer moves by October 2024, and later third-party
    reporting described hundreds of thousands of trailer moves over five years. The company also tied commercialization to
    specific near-term commitments: select enterprise deployments beginning in the second half of 2025, support services built
    for 2026 rollout, and order intake for 2026 and 2027 deployments. Procurement evidence also exists. Outrider and its customers
    purchased 24 autonomy-ready Orange EV trucks for expanded pilot programs and test operations, which is stronger than a
    vague partnership announcement. Even so, the chapter keeps an adverse lens because public sources still do not disclose
    live-site counts, production-account count, or site-by-site utilization denominators.'
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU019
  - CU021
