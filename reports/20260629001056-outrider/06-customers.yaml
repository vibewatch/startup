    - Future TAM can distract from current distribution-center execution
    - Series D release
    - Separate live revenue by DCs versus future-use-case pipeline
  - - Electrified yard standardization
    - Grid, permitting, and charging constraints can delay rollout speed
    - Execution risk grows as customers move from pilots to network-wide deployment
    - Electrive and Orange EV 2026 order coverage
    - Request site-level infrastructure readiness and deployment gating items
