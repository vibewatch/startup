- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or execution risk
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - Distribution-center rollouts with Fortune 500 networks
    - Most public proof still rests on one named operator
    - Breadth may be narrower than the commercialization story implies
    - Support-services, safety, and Series D releases
    - Request live-site matrix and top-10 customer list by status
  - - Orange EV-linked equipment procurement
