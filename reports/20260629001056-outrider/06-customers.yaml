  rows:
  - - Package shipping
    - Enterprise logistics leadership / yard ops / enterprise supply chain budget
    - Support-services release and Series C/D funding disclosures
    - Named as active customer vertical; no site count disclosed
    - High-volume yards fit repeatable throughput use case
    - No named operator or contract economics disclosed
  - - Retail and e-commerce
    - Distribution-network leadership / yard dispatchers / operations budget
    - Series C and support-services releases
    - Named as current customer vertical; rollout details withheld
    - Large networks could support multi-site expansion
    - No named logos, renewals, or per-site outcomes public
  - - Consumer packaged goods and grocery
    - Distribution and plant logistics / onsite yard teams / enterprise ops budget
    - Georgia-Pacific production deployment plus Series C sector list
    - One named production account plus broader cohort claim
    - Best public proof because GP is a disclosed operator
    - Named breadth remains only one customer
  - - Manufacturing and automotive
    - Factory logistics leadership / yard operators / central operations budget
    - Series C and Series D sector lists
    - Vertical presence claimed; live site count not public
    - Manufacturing yards are sticky if integrated into WMS/TMS flows
    - No customer names or utilization metrics public
  - - Large logistics real estate / joint-customer channel
    - Innovation teams / tenant operations / shared enterprise budgets
    - Prologis Ventures endorsement of joint customers
    - Channel validation rather than direct customer count
    - Could shorten sales cycles across large networks
    - Joint-customer names and volumes undisclosed
  - - Future intermodal rail and port use cases
    - Terminal operators / yard control teams / infrastructure-heavy capex budgets
    - Series D describes future applications beyond DCs
    - Future path only, not named live deployment
    - Expands TAM beyond distribution centers
    - No named customers or production proof yet
  notes: Rows separate disclosed end markets from channel-like references. Public sources prove enterprise targeting and one
    named production operator, but most vertical claims remain cohort-level rather than customer-by-customer disclosures.
