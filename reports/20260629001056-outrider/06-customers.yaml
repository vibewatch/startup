- id: adverse-read-on-concentration-and-procurement-friction
  title: Adverse read on concentration and procurement friction
  body: 'The adverse case is not that Outrider lacks customer activity; it is that customer transparency lags the commercialization
    narrative. Publicly, the file still leans on one named production account, broad cohort claims, and partner validation
    instead of a broad set of named operator references. That makes concentration impossible to underwrite cleanly. Reviewed
    sources do not disclose top-customer revenue share, contract duration, NRR, GRR, churn, expansion rate, or the number
    of live production sites. Independent sources also point to buyer friction that could slow adoption even if the technology
    works. Terminal Industries describes the yard as one of the least digitized parts of the supply chain, with gate congestion,
    trailer search time, and disconnected workflows still common; FleetOwner argues wider autonomy adoption still needs purpose-built
    platforms, deeper trust, and proof of operational value beyond a demo. Orange EV’s own 2026 rollout data adds a separate
    warning: grid, permitting, and charging readiness can still delay network-wide scaling at customer sites. The customer
    verdict is therefore credible-but-thin, not fully de-risked.'
