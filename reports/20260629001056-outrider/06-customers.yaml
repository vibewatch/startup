company:
  name: Outrider
chapter:
  number: 6
  title: Customers
  summary: 'Outrider’s customer story is strongest on one named production deployment, a broad but mostly unnamed Fortune
    500 customer cohort, and a growing support and procurement stack built for 2026 commercialization. The same public file
    is weak on the facts that determine durability: named-customer breadth, site counts, renewal metrics, contract length,
    NRR/GRR, and concentration by account all remain undisclosed, so the chapter takes a deliberately adverse stance on transparency
    rather than on whether the product is real.'
sections:
- id: customer-segments-and-public-proof
  title: Customer segments and the shape of public proof
  body: 'Public sources consistently position Outrider as an enterprise product sold into large logistics-dependent sites
    rather than a software tool sold seat by seat. Across company releases, partner pages, and supporting trade coverage,
    the buyer is a large enterprise supply-chain organization, the day-to-day user is the yard or distribution-center operations
    team, and the economic payer is an enterprise logistics or operations budget that cares about throughput, labor exposure,
    and safety. The disclosed industry mix is also specific enough to matter: package shipping, retail and e-commerce, consumer
    packaged goods, manufacturing, automotive, grocery, and future intermodal use cases all appear in reviewed sources. But
    the reference quality is uneven. Georgia-Pacific is the only clearly named end customer in the public record reviewed
    here, while the rest of the customer story is carried by broad cohort claims such as 11 priority customers or over 20
    percent of North American yard trucks. That means the segmentation story is directionally credible, yet the named-reference
    base remains thin by enterprise-infrastructure standards.'
