- id: TU006
  title: Public customer disclosure gap table
  columns:
  - Missing fact
  - What is public today
  - Why it is insufficient
  - Impact on judgment
  - Best next diligence step
  rows:
  - - Named customer roster
    - Georgia-Pacific is named; most other accounts are unnamed cohorts
    - A single named operator is not enough to judge breadth or portability
    - Raises concentration and reference-quality risk
    - Obtain three additional named customer references with live status
  - - Live production site count
    - Select-customer deployment windows are public, but live site count is not
    - Rollout pace cannot be underwritten without denominator data
    - Limits confidence in adoption trajectory
    - Request deployment matrix by site, start date, and status
  - - Retention metrics
    - No NRR, GRR, churn, or renewal data disclosed
    - Operational usage does not equal contractual durability
    - Prevents durability underwriting
    - Request cohort retention and renewal schedule
  - - Top-customer concentration
    - Over-20%-of-yard-trucks claim exists, but no customer revenue-share disclosure exists
    - Large footprint claims can still mask dependence on a few accounts
    - Concentration risk remains open
    - Request top-5 customer revenue share and pipeline mix
  - - Contract structure
    - Subscription framing is public; price, term, and expansion mechanics are not
    - Cannot model pilot-to-production economics or land-and-expand motion
    - Caps confidence on revenue quality and expansion potential
    - Review sample customer contracts and order forms
  notes: 'This adverse table is the chapter’s binding verdict: the missing facts are not cosmetic. They are exactly the customer-level
    disclosures investors need to judge durability, concentration, and expansion quality.'
