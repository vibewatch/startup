- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - public assumptions
  - valuation / return logic
  - probability signal
  - key risks
  rows:
  - - Bull
    - 2026 rollout converts into multi-site contracted revenue, support intensity falls with scale, and financing terms are clean.
    - A premium to the current financing could be justified only after private data shows repeatable expansion economics and limited dilution.
    - Would require disclosed revenue quality, customer diversification, and a credible step-up case versus current terms.
    - Execution slippage, preference overhang, or poor renewal data can erase the premium quickly.
  - - Base
    - Operational proof is real but still narrow, and 2026 funding was necessary rather than purely opportunistic.
    - The most defensible case is disciplined participation near the latest terms after confirming margin, runway, and concentration data.
    - 'Matches today’s public evidence: credible product, incomplete price discovery, and mixed market signals.'
    - Any hidden term-stack complexity or weak gross margin would push this toward bear.
  - - Bear
    - Revenue quality remains opaque, financing terms are investor-protective, and customer expansion stays concentrated.
    - A flat or down-round framing becomes more plausible than a premium mark because public evidence would not support forward returns.
    - Discounted autonomy raises elsewhere and weak truck-cycle demand increase this probability if diligence disappoints.
    - The company could still be strategically relevant while delivering poor equity returns to new money.
  notes: The scenario logic is intentionally conditional because no public source discloses a current valuation mark. The table frames return discipline around what diligence must prove, not around invented price targets.
