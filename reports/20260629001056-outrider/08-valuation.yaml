  rows:
  - - Recommendation
    - research-more
    - Commercial proof exists, but price discovery does not.
    - Do not commit at a premium until private metrics and terms are reviewed.
  - - Confidence
    - medium
    - Operational and funding facts are real, but too many return drivers remain undisclosed.
    - Continue diligence, but keep conviction size capped until data room review.
  - - Risk rating
    - high
    - Financing opacity, macro sensitivity, and unsettled regulation all remain material.
    - Underwrite downside before upside; require protective structure if participating.
  - - Valuation stance
    - unknown
    - No current post-money valuation or share price is public.
    - Treat public comps as boundary markers, not as direct pricing authority.
  - - Entry discipline
    - terms-led
    - Security terms, revenue quality, and customer concentration are missing.
    - Anchor on cap-table, margin, and deployment proof before negotiating price.
  notes: This summary intentionally keeps valuation stance at unknown because no reviewed source discloses a current priced valuation or full security terms.
