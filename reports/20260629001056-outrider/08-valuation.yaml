- id: TV004
  title: Comparable valuation table
  columns:
  - reference
  - 2026 operating signal
  - 2026 valuation or funding marker
  - relevance to Outrider
  - main limitation
  rows:
  - - Serve Robotics
    - ~$26M 2026 revenue outlook after $2.7M FY2025 revenue
    - ~$0.51B market cap
    - Lower-boundary marker for emerging autonomy software with thin revenue base.
    - Sidewalk delivery is not a yard-operations workflow.
  - - Ouster
    - Q1 2026 revenue $49M; 43% GAAP gross margin; 12,600+ sensors shipped
    - ~$2.67B market cap
    - Useful component-platform and industrial-autonomy reference.
    - Sensor economics are not full deployment economics.
  - - Aurora
    - Q1 2026 revenue $1M from commercial launch; autonomy optionality still drives value
    - ~$12.47B market cap
    - Shows how public markets can price autonomy before mature revenue.
    - Highway autonomy differs from closed-yard workflow and safety scope.
  - - Symbotic
    - Q2 FY2026 revenue $676M; adjusted EBITDA $78M
    - ~$24.89B market cap
    - Upper-bound warehouse-automation scale reference with real profitability proof.
    - It is a much larger, more mature public business than Outrider.
  - - FERNRIDE
    - Series A extension added €18M; total funding €75M
    - Private funding marker, valuation undisclosed
    - Closest disclosed private yard-autonomy funding reference in Europe.
    - Funding amount is not a valuation mark and geography differs.
  - - Gatik
    - $600M contracted revenue; fully driverless deliveries at scale
    - Private commercial milestone marker, valuation not public
    - Shows what contract-backed autonomy proof can look like.
    - Middle-mile box trucks are not yard tractors.
  - - Kodiak
    - Raised $100M at a steep discount and stock fell 37%
    - Discounted 2026 financing signal
    - Adverse comp for how autonomy stories can be repriced under pressure.
    - Public trading dynamics differ from a private round, and the model is highway freight.
  notes: Public market caps are as of the 2026-06-29 access date. Private rows use funding or contract milestones because reviewed public sources did not disclose comparable private valuation marks.
