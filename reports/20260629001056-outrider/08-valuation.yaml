- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - lens
  - supporting case
  - anti-thesis
  - what would change the view
  rows:
  - - Commercial proof
    - Named live-yard proof, 2026 rollout plan, and support infrastructure show the company is past concept stage.
    - Public deployment breadth is still thin, with only one named distribution-center deployment and no disclosed expansion metrics.
    - Show customer roster, site count, and expansion or renewal history by cohort.
  - - Product scope
    - The product covers vehicles, orchestration, and 24x7 support rather than a single component.
    - A broad workflow story can still hide labor-heavy support and project-services economics.
    - Provide site-level margin bridge and remote-support intensity by deployment stage.
  - - Capital access
    - A new Form D and prior Series D show the company can still attract investors.
    - Fresh financing without pricing detail can also mean bridge need rather than strength.
    - Disclose valuation, proceeds usage, and post-close runway.
  - - Comparable narrative
    - Public and private autonomy peers prove investor appetite for scaled winners.
    - Peer outcomes also show severe dispersion, so a generous comp can be chosen too easily.
    - Add banker comps and current term sheets to narrow the comparable range.
  notes: The anti-thesis deliberately emphasizes what public evidence still cannot prove, consistent with the chapter’s adverse stance toward price transparency.
