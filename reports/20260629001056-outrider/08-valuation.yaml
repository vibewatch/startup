- id: scenario-framing-and-downside-triggers
  title: Scenario framing and downside triggers
  body: 'Because valuation is undisclosed, the scenario work has to stay conditional. The bull case requires more than a strong demo narrative: it needs evidence that 2026 rollout becomes multi-site revenue expansion with reliable uptime, customer concentration that is manageable, and financing terms that do not transfer most of the upside away from common-equity holders. The base case assumes Outrider has enough technical and customer proof to survive diligence, but only at disciplined terms close to the current financing once revenue quality is verified. The bear case is driven less by product irrelevance than by economics and capital markets. TechCrunch’s Kodiak coverage, Truck News macro commentary, and Crunchbase’s concentration snapshot all suggest that capital is still available in autonomy, but it is selective and increasingly punitive toward companies without obvious scale economics. Layer in an unsettled federal rulemaking environment and the result is a company that may deserve
    another look, yet not a blind premium valuation.'
