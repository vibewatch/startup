  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: current-valuation
    missingEvidence: A priced 2026 round, cap-table mark, or secondary transaction memo that discloses valuation and share count.
    whyItMatters: Without a disclosed current valuation, the chapter cannot convert comparable evidence into an underwriteable entry multiple or target return.
    diligencePath: Request the 2026 financing deck, board consent, and cap-table export that show pre-money, post-money, and fully diluted share count.
    relatedQuestionRefs:
    - QV001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Customer-level revenue, gross margin, deployment cost, and expansion-cohort data.
    whyItMatters: These metrics decide whether Outrider deserves autonomy optionality or should be valued like a slower project-services rollout.
    diligencePath: Obtain the monthly cohort model by site, including truck counts, service hours, gross margin, and renewal or expansion history.
    relatedQuestionRefs:
    - QV004
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: security-terms
    missingEvidence: Liquidation preferences, seniority, dilution protections, warrants, and any secondary-sale structure for the 2026 financing.
    whyItMatters: Downside protection and dilution directly affect realized return even if operating performance improves.
    diligencePath: Request signed term sheets, security documents, and the post-close cap table including option pool changes.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named customer count, site count, account concentration, and expansion or renewal metrics.
    whyItMatters: Valuation depends on whether commercialization is diversified across customers or still concentrated in a few lighthouse accounts.
    diligencePath: Request the customer roster, ARR by account, site count by customer, and twelve-month expansion pipeline.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A fuller peer set with disclosed private marks or late-stage autonomy transaction terms closer to Outrider’s exact model.
    whyItMatters: The current comp set is useful for boundary setting but still mixes warehouse automation, autonomy platforms, components, and delivery robots.
    diligencePath: Add banker comps, recent secondary indications, and private round terms for yard-automation or industrial-autonomy peers.
    relatedQuestionRefs:
    - QV027
    - QV028
    relatedTableRefs:
    - TV004
  - type: stale
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, covenant package, and management runway forecast after the 2026 financing.
    whyItMatters: A 2026 Form D proves fundraising activity, but only internal liquidity data can show whether the raise was optional or necessary.
    diligencePath: Request the cash bridge, monthly burn report, debt schedule, and downside runway sensitivity from management.
    relatedQuestionRefs:
    - QV002
    - QV024
    - QV025
    relatedTableRefs:
    - TV003
    - TV006
