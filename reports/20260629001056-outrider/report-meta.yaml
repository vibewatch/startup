  topStrengths:
    - Controlled-yard autonomy is a narrower and more financeable problem than open-road self-driving.
    - Public milestones show real deployment hardening across safety, security, reinforcement learning, and support.
    - Strategic investors and partners create credible hardware, compute, and facility-integration leverage.
  topRisks:
    - Public markets evidence does not reveal current valuation, revenue scale, margins, or customer concentration.
    - Deployment economics and support intensity at hundreds-of-systems scale remain publicly unproven.
    - Safety, regulatory, and customer-change-management risk remain meaningful for heavy autonomous equipment.
  unresolvedGaps:
    - Current valuation mark, cap-table terms, and any secondary pricing since the Series D are undisclosed.
    - Revenue, gross margin, burn, runway, and pricing model detail are not public.
    - Named customer roster, deployment count by site, and concentration/renewal metrics remain private.
    - Board composition, governance committees, and control rights are not publicly documented.
