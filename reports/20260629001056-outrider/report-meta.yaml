companyProfile:
  summary: >-
    Outrider is a private Colorado-based industrial-autonomy company focused on automating logistics
    yard operations for large enterprises. Its system combines management software, autonomous electric
    yard trucks, site infrastructure, and later support services to move trailers, manage inventory,
    and integrate with warehouse-adjacent workflows. The strategic appeal is a tightly bounded
    autonomy use case with visible customer validation and strong strategic backers; the diligence
    challenge is that public disclosure still omits current valuation, revenue, pricing, and customer concentration.
  foundedDate: '2017-01-01'
  founders:
    - name: Andrew Smith
      role: Founder and CEO
      background: Founder-CEO publicly associated with Outrider across launch, financing, facility, and partner materials.
      claimRefs: [CO007]
  foundingLocation: Golden, Colorado, United States
  headquarters: Golden, Colorado, United States
  productSummary: >-
    Integrated autonomous yard-operations platform spanning dispatch software, autonomous electric yard
    trucks, trailer hitching and brake-line automation, trailer inventory tracking, dock interactions,
    safety systems, and remote support services.
  customerFocus: >-
    Fortune 500 and other logistics-dependent enterprises in package shipping, retail and e-commerce,
    consumer packaged goods, manufacturing, and adjacent high-throughput yard environments.
  businessModel: >-
    Enterprise automation platform sold around customer-site deployments of autonomous yard operations,
    combining software, hardware integration, support services, and related fleet/site enablement.
  stage: Growth-stage private company
  fundingStatus: Public funding rounds total $253M through the October 2024 Series D
