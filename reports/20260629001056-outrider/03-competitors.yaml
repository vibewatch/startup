tables:
- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Covers the most material publicly evidenced direct peers, incumbent OEMs, adjacent software vendors, and substitute classes relevant to autonomous yard operations as of runDate.
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - ISEE + TICO
    - Direct peer / OEM channel
    - Fortune 100 production deployment; TICO installed base in tens of thousands
    - Large U.S. distribution, manufacturing, and port-adjacent yards
    - Fully autonomous yard moves plus OEM-integrated and retrofit paths
    - Public pack is stronger on deployment proof than on pricing, customer count, or full workflow breadth
  - - FERNRIDE
    - Direct peer
    - Last disclosed major round reached $50M; 130+ employees disclosed in 2023
    - European yards, manufacturing campuses, and container terminals
    - Human-assisted autonomy and remote takeover lower operating anxiety
    - Last visible funding disclosure is older; public pack implies continued human involvement rather than pure driverless autonomy
  - - Orange EV
    - Incumbent electric yard-truck OEM
    - 1,900+ trucks in service; record 600-truck order deploying through 2026
    - North American fleets electrifying yard operations
    - Scale, uptime, warranty, and service support make EV yard trucks mainstream
    - Does not itself solve the full autonomous workflow; autonomy can sit above the hardware
  - - Kalmar Ottawa + Forterra
    - Incumbent OEM plus autonomy entrant
    - 85,000+ tractors produced; AutoTT full production targeted for late 2026
    - Distribution centers, terminals, industrial yards
    - Automation-ready drive-by-wire platform with incumbent service credibility
    - Autonomy is still in testing/pilot progression in public materials
  - - Terberg
    - Incumbent OEM
    - Global service network; enhanced EV tractor highlighted for TOC Europe 2026
    - Ports, distribution centers, industrial operations
    - Worldwide support footprint and flexible EV battery variants
    - Public pack emphasizes EV/service more than live autonomous-yard deployments
  - - Kaleris / FourKites / C3
    - Adjacent software vendors
    - Enterprise yard software platforms with visible customer proof and integrations
    - High-volume DCs, retail, grocery, parcel, networked shippers
    - Solve gate, dock, visibility, and tasking pain without robot trucks
    - Do not replace trailer-driving labor directly
  - - Lazer Logistics EV program
    - Managed-service substitute
    - 70+ sites across 20 states and Canada
    - Shippers wanting electrification with low operational lift
    - Turnkey truck sourcing, charging, compliance, and reporting
    - Primarily an electrification and managed-operations answer, not autonomous movement
  - - Manual yard ops / internal build
    - Status quo / substitute
    - Existing labor, current spotter fleet, internal IT budget
    - Smaller or capital-disciplined yards, and enterprises sequencing software first
    - Lowest organizational change and easiest to stage with existing trucks
    - Still constrained by manual check-ins, radio dispatch, yard search time, and inconsistent visibility
  notes: Profiles summarize the most decision-relevant competitor classes rather than every named vendor in the market. Where funding, customer count, or pricing were not public in the reviewed pack, the cell states that gap explicitly.
