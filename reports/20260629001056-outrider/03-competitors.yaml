- id: TP003
  title: Pricing / packaging comparison
  enumerationScope:
    coverage: partial
    basis: Most vendors in this market do not publish durable list prices, so the table compares public packaging signals, service terms, and visibility of pricing rather than pretending to know realized contract economics.
  columns:
  - Competitor / class
  - Monetization model
  - Public price visibility
  - Packaging signal in reviewed sources
  - Implication
  rows:
  - - Outrider
    - Automation system sold with support services
    - Unknown
    - System integration, remote support, diagnostics, and autonomous operations framed as enterprise rollout package
    - Buyers likely negotiate on site complexity, fleet size, and support scope rather than list price
  - - ISEE / TICO
    - Autonomous system plus OEM or retrofit truck program
    - Unknown
    - OEM-integrated and retrofit offer across diesel, CNG, and electric TICO platforms
    - May reduce deployment friction, but public economics remain opaque
  - - FERNRIDE
    - Autonomy platform with human-assisted operations
    - Unknown
    - Human-in-the-loop and teleoperations signal an operating-service layer, but no public tariff is visible
    - Could appeal where risk reduction matters more than sticker transparency
  - - Orange EV
    - Vehicle sale, lease, rent, demo, warranty, and field service
    - Partial
    - Purchase, lease-for-less, rent-on-demand, warranty, and on-site service are explicit
    - Most transparent packaging among reviewed hardware vendors even though unit pricing is still not posted
  - - Kalmar Ottawa
    - Vehicle plus battery/charger configuration and service packages
    - Unknown
    - Modular battery sizes, charging options, warranties, and service packages are explicit
    - Pricing likely depends on duty cycle and battery configuration
  - - Lazer Logistics EV
    - Managed-service / truck-as-a-service style program
    - Unknown
    - Site assessment, truck sourcing, charging design, compliance support, and reporting are bundled
    - Strong substitute for buyers that want electrification without self-managing rollout
  - - Kaleris / FourKites / C3
    - Software or SaaS-style yard orchestration and workflow tools
    - Unknown
    - Demo-led software with visible packages, kits, or modules but no public list price
    - Software-first pilots may be cheaper and easier to approve than robot-truck rollouts
  notes: This is a packaging comparison, not a realized-margin table. Unknown means no reviewed official page exposed durable list pricing, discount schedules, or contract-length assumptions.
