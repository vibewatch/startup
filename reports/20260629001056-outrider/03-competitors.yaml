  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Durable public or diligence-room pricing schedules for Outrider, ISEE, FERNRIDE, Kalmar, and major YMS alternatives, including per-site setup, software, support, and truck economics.
    whyItMatters: Without actual price architecture, it is impossible to compare payback periods or determine whether Outrider wins on capability or simply loses on procurement friction.
    diligencePath: Request anonymized proposals or customer invoices by site type and separate hardware, software, and support line items.
    relatedQuestionRefs:
    - QP010
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-concentration
    missingEvidence: Head-to-head win/loss data, customer concentration, expansion rates, and referenceable multi-site production deployments across Outrider and direct peers.
    whyItMatters: Competitive positioning can look strong in marketing while still being fragile if only a small number of lighthouse customers carry most of the revenue or proof.
    diligencePath: Ask management for top-customer concentration, named competitive replacement stories, and cohort expansion metrics by customer.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: material
    topic: realized-roi
    missingEvidence: Customer-level evidence on autonomous cost per move, labor savings, downtime reduction, and the share of ROI driven by hardware, software, or support services.
    whyItMatters: The most important buyer decision is whether autonomy creates superior economics versus software-first improvement or electrification-only programs.
    diligencePath: Obtain production KPI dashboards or third-party audited before-and-after operating metrics from at least two mature customer sites.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: emerging-entrants
    missingEvidence: A fuller census of emerging autonomy entrants and regional specialists beyond the names surfaced in the public English-language pack.
    whyItMatters: The market is evolving quickly, and undercounting adjacent entrants could overstate the durability of today’s direct-peer set.
    diligencePath: Expand source discovery into event rosters, procurement databases, and non-U.S. trade coverage to capture regional or stealth entrants.
    relatedQuestionRefs:
    - QP008
    relatedTableRefs:
    - TP001
  - type: access-blocked
    severity: minor
    topic: third-party-context
    missingEvidence: Accessible copies of the McKinsey autonomy article and the Terberg electric-product detail page fetched during this run but not readable enough to use as evidence.
    whyItMatters: They could have added independent framing on adoption constraints and Terberg’s EV details, but the current access state prevents reliable extraction.
    diligencePath: Re-fetch with an alternate host strategy or use an archived copy with auditable provenance before citing either source substantively.
