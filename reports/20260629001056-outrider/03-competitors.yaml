- id: TP004
  title: Moat durability / competitive risk register
  enumerationScope:
    coverage: partial
    basis: Pairs Outrider’s most visible competitive claims with the most likely displacement vector visible in the public evidence; it is not a closed-form risk inventory.
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Full-stack yard automation
    - ISEE and Kalmar/Forterra are proving rival autonomous yard stacks
    - High
    - Production deployment and OEM-integrated autonomy are already public
    - Request side-by-side customer wins, expansion rates, and task coverage versus direct peers
  - - Trailer-line and coupling automation
    - Rivals can narrow the gap via robotic arms, auto-connect rigs, or modified trailers
    - High
    - ISEE has shown a robotic-arm / auto-connect path and Outrider stresses this area as a differentiator
    - Quantify how often trailer-line automation decides deals and whether trailer modifications are needed
  - - EV-first platform economics
    - Vehicle layer commoditizes as Orange EV, Kalmar, Terberg, and TICO scale supply
    - Medium
    - Hardware incumbents already own uptime, service, and battery/warranty narratives
    - Separate software gross margin from vehicle economics and confirm hardware sourcing lock-in
  - - Operational data and orchestration moat
    - YMS vendors solve gate, trailer visibility, and tasking pain without autonomy
    - High
    - Kaleris, FourKites, and C3 all market real-time orchestration and rule-based tasking
    - Test whether customers buy Outrider for robot moves, for software control, or only for the combined bundle
  - - Enterprise support and uptime model
    - Incumbent dealer/service networks may out-trust startup support teams
    - Medium
    - Outrider now markets support services, but OEMs already have field-service depth
    - Ask for SLA terms, mean time to recovery, and remote-support staffing ratios
  - - North America-focused proof set
    - FERNRIDE and global OEMs may win where buyers want Europe or multi-region reach
    - Medium
    - FERNRIDE customer set is European; Terberg and Kalmar have broader geographic coverage
    - Map pipeline by region and identify whether U.S.-only proof constrains expansion
  notes: 'Severities are author-assigned from public evidence. The key pattern is convergence: hardware incumbents, autonomy specialists, and software-only operators are all moving toward the same yard-control budget.'
