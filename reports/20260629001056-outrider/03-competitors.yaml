- id: capability-and-packaging-comparison
  title: Capability breadth and pricing or packaging posture
  body: 'The most important competitive distinction is not simply who has an autonomous tractor, but who solves the entire yard workflow buyers actually pay for. Outrider publicly markets autonomous trailer moves, hitching and brake-line work, trailer inventory tracking, mixed-traffic operation, and always-on remote support. ISEE appears strongest where buyers want autonomous move execution with minimal infrastructure change and a credible OEM path through TICO. FERNRIDE has a narrower but pragmatic proposition: human-assisted autonomy and teleoperations that can lower operational anxiety in Europe and at cautious industrial sites. Orange EV, Kalmar, and Terberg are less software-rich in public materials, yet they are powerful because they already sell durable electric yard trucks with warranties, service, and charging options. Lazer sits between equipment and service, bundling truck sourcing, charging design, reporting, and compliance. The adjacent YMS set competes even more asymmetrically.
    Kaleris, FourKites, and C3 all promise gate velocity, tasking, ETA-aware orchestration, or multi-site visibility; a buyer can therefore address many yard bottlenecks before ever buying autonomy. Public pricing is notably opaque across nearly all of these vendors. Orange EV is the clearest about packaging through purchase, lease, rent, warranty, and field service options, while software and autonomy vendors mostly route prospects into demos, operational scoping, or bespoke proposals.'
