      - number: '1.2'
        title: 领导层、治理与客户覆盖
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是 Outrider 最强的公开信号之一。Andrew Smith 一直以创始人兼 CEO 身份出现；后续新闻稿又补充了运营厚度，包括 COO Bob Hall、CTO 兼工程 EVP
              Vittorio Ziparo、软件工程 SVP Jeremy Nett，以及 IT 运营负责人 John Stein。不过，相对于已募集资本规模和产品的运营关键性，公开治理披露偏薄。Outrider
              官网没有正式董事会页面或治理资料包，因此投资者主要靠融资新闻稿、合作伙伴引述和第三方目录推断监督机制。客户披露同样选择性很强。Georgia-Pacific
              是最清晰的具名生产参考；与此同时，公司反复称，在包裹运输、零售、电商、消费品、制造和相关行业还有其他 Fortune 500 客户，这些客户代表北美堆场牵引车总量的 20%
              以上。这说明市场触达可能不小，但具体客户名单、集中度和合同经济性仍不透明。
