      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开资本事实很直接。Outrider 在 2024 年 10 月完成超额认购的 $62 million Series D，由 Koch Disruptive Technologies 和 NEA
              领投，并表示该轮使累计披露股权资本超过 $250 million。独立报道一致显示，所得资金用于 2025
              年商业扩张，并通向与关键客户部署数百套系统。这些是正面融资信号，但还不足以告诉投资者，公司是否已经为该计划充分资本化。


              2026 年 Form D 很重要，因为它显示在上一轮广泛报道的融资之后，融资活动仍在继续。申报记录显示，2026 年 4 月 28 日提交了一项新的 $50 million 募集，36 名投资者已认购
              $21.5 million，申报时仍有约 $28.5 million
              待售。这可能意味着为规模化进行谨慎补充融资，也可能说明现金需求仍在；公开记录无法区分这两种解释，因为它从未披露账上现金、月度现金消耗、资金续航、营运资本、债务额度或项目融资义务。从财务角度，正确结论不是困境，而是依赖：商业化正在推进，但仅靠公开来源，仍无法干净承销资本充足性。
