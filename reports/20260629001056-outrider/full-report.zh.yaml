  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品边界与堆场工作流
        blocks:
          - type: paragraph
            body: >-
              Outrider
              卖的不是单个机器人功能；它主推的是一套面向配送堆场工作的操作系统。从系统页面、产品新闻稿到合作伙伴材料，同一架构反复出现：管理软件协调工作，自主电动堆场牵引车执行移动，现场基础设施加月台流程让工作流在真实设施中安全可用。系统任务很窄，但运营上很重要：在停车位和月台门之间移动拖车，追踪拖车位置，并让混合车队保持流动，而不强迫运营方围绕开放道路自主化重做其余仓库技术栈。公开工作流证明最强的，是那些通常迫使司机反复上下驾驶室的重复任务——倒车、挂接、刹车管线连接、库存扫描和异常路由。支持服务发布也说明，客户工作流还不是完全零接触。Outrider
              称系统可以找到放错位置的拖车、搜索空位并自动重新排队工作，但当碎片、被堵月台或其他物理异常需要人工帮助时，仍会通知现场人员。这个组合让产品比仅演示的自主化技术栈更真实，同时也清楚显示人仍在哪些环节留在回路中。
