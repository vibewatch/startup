      - number: '4.4'
        title: 财务结论与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              公开文件支持一个可信的商业化叙事，但不是完整承销案例。Outrider 有聚焦的企业用例、可见客户活动、反复证明的融资能力，并且在商业上做了一个合理选择：借助 OEM
              卡车平台，而不是自建整车栈。这些事实有助于解释，在更广自动驾驶汽车融资变难时，资金为何仍流向堆场自主化。与此同时，最相关的反向证据集中在规模经济性和信任上：FleetOwner 认为，更广部署仍需要专门打造的
              OEM 平台、冗余、承运方信心和运营价值证明，而不只是自主化演示。


              这种反向立场与本章直接相关，因为 Outrider 缺失的数据，正是验证或反驳乐观案例所需的数据。             
              公开来源没有展示实际定价、毛利率、每站点支持成本、CAC、回本期、收入集中度或资金续航。因此，财务结论偏谨慎：收入架构看起来真实，利润率路径可信但未经证明，融资能力可见；不过，在投资者能够有把握承销收入质量、利润率耐久性或现金充足性之前，公司仍需要资料室证据。
