              反向情形不是 Outrider 缺少客户活动，而是客户透明度落后于商业化叙事。公开来看，文件仍依赖一个具名生产账户、宽泛 cohort
              声明和合作伙伴验证，而不是一组广泛具名运营方参考。这使集中度无法被干净承销。已审阅来源没有披露头部客户收入占比、合同期限、NRR、GRR、流失、扩张率或在线生产站点数量。独立来源也指出了可能拖慢采用的买方摩擦，即使技术可行。Terminal
              Industries 把堆场描述为供应链中数字化程度最低的环节之一，闸口拥堵、拖车搜索时间和断裂工作流仍很常见；FleetOwner
              认为，更广自主化采用仍需要专门打造的平台、更深信任，以及演示之外的运营价值证明。Orange EV 自己的 2026 年 rollout
