  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 商业证明存在，但价格发现不存在。
        - 审阅私人指标和条款前，不要以溢价承诺投资。
      - - 置信度
        - 中
        - 运营和融资事实真实，但太多回报驱动因素仍未披露。
        - 继续尽调，但在数据室审阅前控制确信度对应的仓位规模。
      - - 风险评级
        - 高
        - 融资不透明、宏观敏感性和监管未定都仍然重要。
        - 先承保下行，再看上行；若参与，要求保护性结构。
      - - 估值立场
        - unknown
        - 当前投后估值或股价未公开。
        - 将公开可比公司视为边界标记，而非直接定价依据。
      - - 进入纪律
        - 条款优先
        - 缺少证券条款、收入质量和客户集中度。
        - 谈价格前，先锚定股权结构表、利润率和部署证明。
    notes: 本摘要有意将估值立场保留为未知，因为已审阅来源没有披露当前定价估值或完整证券条款。
