  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与责任风险只有在安全论证站得住脚时才可管理
        blocks:
          - type: paragraph
            body: >-
              Outrider 的公开安全流程披露多于典型工业自主化初创公司，但这并不意味着法律栈简单。其安全页面描述了一套明确的安全论证框架，围绕风险评估、设计完成、测试完成和签署；2025
              年安全发布又给出异常具体的数字：14 项安全机制应对 200,000 多个堆场特定危险，并由 TUV SUD 按 AV Conformity Framework
              进行外部审阅。这些是有意义的缓释，因为相关部署环境不是实验室，而是有人员、月台、卡车和拖车混行的堆场。不过，公开监管背景仍不完整。OSHA 的 General Duty Clause
              让客户现场对已知工作场所危险负责，而联邦自主商用车辆规则制定仍在演进，拟议框架将依赖制造商撰写的安全论证，并可能把实时驾驶职责转向制造商。Outrider
              自己的隐私通知和条款也扩大了尽调面，加入求职者数据处理、网站可用性免责声明和强制仲裁语言。正确结论不是法律风险今天已经急性化，而是在私下审阅事故、保险、合规和合同资料包之前，法律风险仍然偏高。
