companyProfile:
  summary: >-
    Outrider 是一家位于 Colorado
    的私营工业自主公司，聚焦为大型企业自动化物流堆场运营。其系统把管理软件、自主电动堆场牵引车、现场基础设施和后续支持服务组合起来，用于移动拖车、管理库存，并接入仓库周边工作流。战略吸引力在于：这是一个边界清晰的自主化场景，客户验证可见，战略投资方也很强；尽调难点在于，公开披露仍缺少当前估值、收入、定价和客户集中度。
