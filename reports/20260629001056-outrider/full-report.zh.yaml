      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方切口是高吞吐配送中心和 3PL 园区，其次是制造业堆场，再往后是部分多式联运和港口环境。Outrider 2025 年材料明确点名包裹运输、电商与零售、消费品和制造业；FactMR
              与码头牵引车出版机构也反复把配送中心、制造设施和港口列为主要终端用途。采用路径也更清楚了。FactMR 描述支出正从实验性试点转向与吞吐和劳动力基准挂钩的分阶段部署；Outrider
              自己的支持服务定位也强化了一点：买方想要的不只是一辆机器人卡车，还要诊断、正常运行时间、软件集成和远程支持。预算归属看起来是跨职能的，而非单线条。运营负责人掌握拖车周转和劳动力节省；IT 或供应链系统团队掌握
              WMS、TMS 和 YMS 集成；设施团队掌握充电和堆场布局约束；可持续发展或 EHS 相关方影响零排放和安全论证。这种结构有利于能销售系统架构和服务层的供应商，而不只是资本设备供应商。
