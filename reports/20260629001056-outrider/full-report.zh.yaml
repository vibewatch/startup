      - number: '8.2'
        title: 融资背景与可比边界
        blocks:
          - type: paragraph
            body: >-
              2026 年融资证据有方向性价值，但不完整。Form D 证明 Outrider 在 2024 年 Series D 之后仍在融资，且已有超过 $21 million
              售出，却没有说明估值或优先权结构。因此，分析更适合使用边界标记，而不是干净可比公司。公开参照的跨度很大。Symbotic 展示了当规模和盈利能力可见时，有收入支撑的仓储自动化会是什么样；Aurora
              说明，即使收入很少，公开市场仍会为自动驾驶可选性支付数十亿美元；Ouster 和 Serve 则从感知和新兴机器人领域框定小市值技术边界。私营同业从另一角度强化同一结论：Fernride
              仍能融到增长资本，Gatik 能声称有合同支撑的无人驾驶规模，Kodiak 的折价融资则说明资本方要求更硬条款时会发生什么。这些公司都不是完美同业，但合在一起说明，Outrider
              的价格应绑定里程碑质量，而不是自动化领域最慷慨的头部倍数。
