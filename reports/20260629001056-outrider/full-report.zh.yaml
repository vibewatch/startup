      - number: '3.2'
        title: 能力宽度与定价或包装姿态
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争差异不只是“谁有自主牵引车”，而是谁解决了买方真正愿意付费的完整堆场工作流。Outrider 公开营销自主拖车移动、挂接与刹车管线作业、拖车库存追踪、混合交通运营和全天候远程支持。ISEE
              在买方希望以最小基础设施变化实现自主移动执行、并通过 TICO 获得可信 OEM 路径的场景中似乎最强。FERNRIDE
              的主张更窄但务实：人机协助自主化和远程操作，能够降低欧洲及谨慎工业场地的运营焦虑。Orange EV、Kalmar 和 Terberg
              在公开材料中软件含量较低，但力量很强，因为它们已经销售带保修、服务和充电选项的耐用电动堆场牵引车。Lazer 介于设备和服务之间，打包卡车采购、充电设计、报告和合规。相邻 YMS
              玩家竞争更不对称。Kaleris、FourKites 和 C3 都承诺提高闸口速度、任务分配、感知 ETA
              的编排或多站点可视化；因此，买方在购买自主化之前，就能先处理许多堆场瓶颈。几乎所有这些供应商的公开定价都明显不透明。Orange EV
              在包装上最清楚，提供购买、租赁、租用、保修和现场服务选项；软件和自主化供应商则大多把潜在客户导向演示、运营范围界定或定制提案。
