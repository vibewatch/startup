      - number: '7.4'
        title: 缓释因素可见，但淘汰标准仍取决于私下尽调
        blocks:
          - type: paragraph
            body: >-
              Outrider 并没有把规模化当成自然发生的下一步。公司称已在国际上扩充工程团队，在 10 多个国家雇用 190 多人，并仍在机械、可靠性、云、安全软件和操作员岗位招聘。这个人员结构适合 2026
              年商业化，但也说明执行复杂度正在上升，支持、伙伴管理和客户部署预期也同步抬高。公开缓释因素确实存在：真实的安全案例纪律、远程支持工具、伙伴共研、可见专利组合，以及在上一轮大额融资之后继续融资的能力。仍缺的是能把这些缓释因素转化为低剩余风险判断的材料：已签客户合同附件、服务级别承诺、事故和干预日志、州级与场站合规备忘录、保险与赔偿结构，以及当前流动性桥接方案。因此，实际投资立场必须带条件。下一轮尽调若能证明事故处理稳定、合同保护到位、资本足以完成部署铺开，风险会明显压缩；否则，同样的集中点就会从常规规模化噪音变成推翻投资假设的触发器。
