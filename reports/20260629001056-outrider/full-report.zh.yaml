  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 支持论据
      - 反论点
      - 改变判断的条件
    rows:
      - - 商业证明
        - 具名上线场院证明、2026 年推广计划和支持基础设施，显示公司已过概念阶段。
        - 公开部署广度仍薄，只有一个具名配送中心部署，也没有披露扩张指标。
        - 展示客户名单、场地数量，以及按 cohort 划分的扩张或续约历史。
      - - 产品范围
        - 产品覆盖车辆、编排和 24x7 支持，而不是单一组件。
        - 宽口径工作流故事仍可能掩盖高人力支持和项目服务经济性。
        - 提供场地级利润率桥接，以及按部署阶段划分的远程支持强度。
      - - 资本入口
        - 新 Form D 和此前 Series D 显示公司仍能吸引投资人。
        - 没有定价细节的新融资，也可能意味着桥接需求，而非实力。
        - 披露估值、募资用途和交割后 runway。
      - - 可比叙事
        - 公开和私有自动驾驶同行证明，投资人愿意为规模化赢家买单。
        - 同行结果也高度分化，因此太容易挑一个慷慨可比项。
        - 加入投行可比公司和当前 term sheet，收窄可比范围。
    notes: 反论点刻意强调公开证据仍不能证明的内容，与本章对价格透明度的反向立场一致。
