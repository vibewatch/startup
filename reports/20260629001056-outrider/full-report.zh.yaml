  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有厂商、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Outrider 面对的不是一个干净的同类群体。最直接的自主堆场同行是 ISEE 和 FERNRIDE：两者都主打在活跃物流堆场中更安全、更可预测的拖车移动，也都有足够公开证明进入真实买方讨论。ISEE
              强调全自主堆场移动、一个 Fortune 100 部署，以及与 TICO 的新 OEM 集成路径。FERNRIDE
              覆盖堆场调车、集装箱码头和制造业流程，但有意采用人机协助运营模式，用远程接管作为迈向更高自主化的桥。围绕这些纯玩家的是强大的既有厂商。Orange EV 已经在许多美国车队中占据电动堆场牵引车话语权；Kalmar
              Ottawa 和 Terberg 带来长期产品历史、服务覆盖和码头牵引车买方信任。第二条侧翼来自相邻堆场软件供应商，包括 Kaleris、FourKites 和
              C3，它们解决可视化、闸口、月台和调车任务分配痛点，却不要求买方承销机器人车辆。最后的替代方案仍是现状：柴油或电动调车车、电子表格、无线电，以及选择性内部流程改进。这意味着 Outrider
              必须在能力上打赢自主化同行，在信任和正常运行时间上打赢既有厂商，在编排 ROI 上打赢软件供应商，并在见效速度上打赢手工作业基线。
