      - number: '5.3'
        title: 部署、安全、安保与支持控制
        blocks:
          - type: paragraph
            body: >-
              Outrider 的信任姿态，是公开技术文件中最成熟的一部分。安全论证没有被描述成轻量合规练习：公司称其使用一套详尽框架，覆盖风险评估、设计完成、场景测试、现场验证、部署流程和持续安全检查。2025
              年旗舰安全发布异常具体，声称用 14 项安全机制应对 200,000
              多个堆场特定危险，并由冗余危险检测、失效安全硬件和健康监控支撑，可覆盖不安全行为并让车辆停止。外部行业报道基本复述这些细节，而不是反驳它们，因此安全故事比单独一篇公司文章更可信。网络安全披露也好于工业自主化初创公司的常态。Outrider
              称其 SOC 2 Type 2 流程覆盖云软件、API、数据治理、威胁检测、故障切换、备份，以及面向障碍物检测和制动等安全关键功能的安全开发实践。不过，支持服务发布把运营现实说清楚了：安全商业化依赖 24x7
              远程诊断、受训专家和严格的客户现场流程，而不是声称系统今天就能自主处理每一个异常。
