      - number: '2.4'
        title: 增长驱动、约束与开放 SAM 问题
        blocks:
          - type: paragraph
            body: >-
              需求顺风真实存在。CBRE、Cushman & Wakefield 和 Link Logistics 都描述了 2026 年对可自动化仓储和物流空间的需求、持续的 3PL
              外包，以及能承载更复杂运营系统的电力充足建筑。电动化也是真实驱动，因为码头牵引车 OEM 和分析师来源越来越把零排放堆场车队视为在高负荷环境中具备商业相关性。但采用并非没有摩擦。CARB 的 Advanced
              Clean Fleets 语言现在直接约束州和地方政府车队，而不是对私营车队形成一刀切要求，因此脱碳对 Outrider 目标客户群是方向性顺风，而非普遍强制。安全治理仍不简单：OSHA 的 General
              Duty Clause 仍适用，ANSI/ITSDF B56.5-2024 为无人引导工业车辆提供设计、运营和维护指引。经济性方面，Mordor
              点出了最大刹车：电池电动码头牵引车的前期标价仍显著高于柴油车，而且常常需要棕地电力升级。NREL 的 depot-electrification
              工作也支持充电设计是门槛工作流。结果是：这是一个可信的增长市场，但可立即服务的细分市场比自上而下 TAM 标题暗示的更窄。
