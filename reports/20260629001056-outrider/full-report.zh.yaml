      - number: '1.3'
        title: 资本历史与商业化
        blocks:
          - type: paragraph
            body: >-
              Outrider 的融资历史显示，投资者支持稳定，而且与可见技术里程碑绑定。公司公开发布时披露种子轮和 Series A 合计 $53 million，2020 年增加 $65 million Series
              B，2023 年完成 $73 million Series C，并在 2024 年 10 月关闭 $62 million Series D。官方与独立报道一致显示，最近一轮把累计股权融资推高到 $250
              million 以上；Koch Disruptive Technologies 和 NEA 仍处核心位置，新的战略支持方包括 NVentures、Prologis Ventures
              等。商业化叙事也按阶段成熟：测试和试点项目、Brighton 专用测试设施、自动挂接、与 Georgia-Pacific 的客户生产移动、更广的 AI 感知工作，最后是面向 2026 年商业推出的 2025
              年支持服务。缺口在估值透明度。公开来源披露了融资规模和投资人质量，但没有当前 Series D 后估值、二级市场定价，或其他同步价值锚。
