      - number: '7.3'
        title: 合作伙伴集中、融资依赖和薄弱公开客户披露推动剩余下行风险
        blocks:
          - type: paragraph
            body: >-
              Outrider 的合作伙伴栈既是护城河，也是集中度问题。Orange EV 为规模化试点提供车辆底盘，Ouster 和 NVIDIA 牵引感知与算力路线图，Rite-Hite
              这类设施伙伴则决定真实场站能否自动化，而不靠不安全的人工绕行。依赖关系不是假设：安全案例发布稿称，安全关键伙伴会审查并批准其组件用于无人驾驶作业；Orange EV 也称，Outrider 及其客户已购买 24
              辆可接入自动驾驶的卡车，用于扩大试点。融资风险也仍然可见。2024 年 Series D 后，已披露股权融资超过 $250 million，公司把这轮融资定位为支撑数百套系统的规模化；但 2026 年 4
              月一份新的 Form D 显示，公司发起 $50 million 发行，备案时仅售出 $21.5
              million，说明头部轮次之后资本活动仍在继续。客户不透明又放大了两类风险。公开材料仍更多谈行业、资产覆盖和铺开雄心，而不是具名生产账户、SLA、赔偿安排、按收入计的集中度或现场可靠性。下行传导路径因此很清楚：关键伙伴停滞、客户部署滑期，或融资收紧，利润率和估值就可能同步承压。
