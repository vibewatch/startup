  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与承销立场
        blocks:
          - type: paragraph
            body: >-
              公开记录已经足以说明，Outrider 是一个真实商业化故事，不是停留在幻灯片里的自动驾驶概念。公司有文件化的 2026
              年商业部署计划，部署带支持服务；有一个具名、正在运行的配送中心客户；也有一套全栈产品叙事，覆盖自主挂车移动、场站编排和 24x7
              支持。这一点重要，因为它把公司和仍主要谈路线图与测试的同业区分开。但这些优点没有解决估值问题。已审阅的 2026 年来源没有披露当前 post-money 估值、新融资股价、收入 run
              rate、毛利率或留存指标。也就是说，仅靠公开事实，本章无法证明应按溢价轮价格买入。合适立场因此是继续研究，置信度中等、风险评级高：产品和客户证据可信，但在公司开放私下运营和融资数据之前，回报数学无法公开承销。
