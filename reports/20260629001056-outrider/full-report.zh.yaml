  - id: TV005
    title: 投资论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 尽调启动后当前估值仍未披露
        - 管理层拒绝提供已定价的股权结构表标记或近期 term sheet。
        - 没有价格，任何公开可比公司分析都无法变成可投资回报案例。
        - 停止流程，或坚持先做条款尽调，再投入更多时间。
      - - 收入质量令人失望
        - 毛利率仍为负，或支持人力主导部署经济性。
        - 全栈叙事变成项目服务偏重，而非软件加自动化可规模化。
        - 按下行重新定价，或直接放弃。
      - - 客户集中度极端
        - 一两个标杆账户代表大部分已部署量或收入。
        - 商业证明没有公开里程碑暗示的那么可重复。
        - 投资前要求更强结构、更低价格或更多证明。
      - - 融资条款偏向保护投资人
        - 清算优先权、认股权证或反稀释条款让内部人或既有投资人大多吃到上行收益。
        - 即便经营改善，新资金回报也可能很差。
        - 不按拟议经济条款承销。
      - - 宏观与监管摩擦加重
        - 客户资本开支节奏进一步走弱，同时安全论证负担上升。
        - 推广速度和销售周期拉长，削弱高估值支撑。
        - 切到熊市情景，收紧尽调观察窗口。
    notes: 每个触发条件都写成可证伪的尽调条件，而不是泛泛的创业公司风险，方便投委会把它转成通过或否决的决定。
