      - number: '1.4'
        title: 当前就绪度与未解问题
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年最强的读数是：Outrider 正在为更广商业规模做准备，而不只是证明基础技术。公司宣布部署强化学习以提升路径规划速度，安全框架经过 TÜV SÜD 审阅，获得面向企业信息安全的 SOC 2
              Type 2 认证，并推出明确为 2026
              年无人堆场运营推出打造的支持服务层。这些里程碑让公司看起来比许多仍困在演示阶段的自主化初创公司更成熟。独立报道也帮助解释投资者为何继续押注这个细分市场：更广泛的开放道路自主化比预期更难、更贵，而受控堆场边界更清晰，因此更容易融资。即便如此，尽调文件仍不完整。公开材料仍未披露当前收入、客户数量、董事会控制、准确员工数或当前估值标记，所以公司更容易被作为技术和部署故事承销，而不是作为完全透明的投资标的承销。
