      - number: '7.2'
        title: 运营可靠性风险来自边缘案例、现场基础设施和严苛堆场条件
        blocks:
          - type: paragraph
            body: >-
              运营风险最强的地方，也是 Outrider
              最坦诚的地方：当边缘案例超出自主恢复能力时，系统仍需要人。支持服务材料反复称，平台会在需要协助时通知现场人员，并把更难问题升级给受训远程专家。这是可信的商业化模型，但也意味着正常运行时间取决于人员质量、诊断工具，以及新事故能多快转化为可重复操作手册。合作伙伴证据强化了同一点。Ouster
              把产品定位为 24/7 严苛环境系统，必须把拖车倒到月台、精准挂接，并在雪、雨和极端温度中运营。Rite-Hite
              显示，堆场不能孤立自动化，因为月台调平板、限位器、通信系统和设施改造仍必须作为运营闭环的一部分一起运转。Terminal Industries 的 2026
              年堆场研究是有用的反向校验：许多设施仍缺少实时堆场可视化，仍因闸口拥堵和拖车错放损失时间。因此，运营问题不再是产品是否存在，而是异常密集的棕地堆场能否支撑可靠的多站点部署，且不让服务强度侵蚀经济性。
