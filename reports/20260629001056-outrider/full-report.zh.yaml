  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Outrider 的市场最好定义为私有堆场内的拖车移动与控制，而不是泛自主化。其首页、系统页面和 2025
              年运营新闻稿都描述了一套组合：自主电动堆场牵引车、堆场编排逻辑、拖车追踪，以及面向混合交通物流堆场的远程支持。也就是说，纳入支出的应是码头牵引车和堆场牵引车、调度并追踪拖车移动的控制软件、现场集成工作，以及维持无人堆场运行所需的支持服务。排除支出应包括长途
              AV 网络、仓库四壁之内的机器人，以及无关仓库软件。现状仍是柴油或电动码头牵引车，靠本地运营规则加 YMS、WMS 或 TMS
              系统协调。这个边界很重要，因为泛自主化标题很容易把堆场、港口、仓库和公共道路类别混在一个数字里，从而抬高 Outrider 的机会。
            claimRefs:
              - CM001
              - CM002
