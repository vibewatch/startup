          label: 联合测试 / 概念验证
          description: 自 2019 年起，客户参与产品测试和试点运营
        - id: fleet
          label: 试点车队承诺
          description: 客户和 Outrider 采购了 24 辆具备自动驾驶准备的 Orange EV 卡车，用于扩大试点和测试运营
        - id: prod
          label: 具名生产使用
          description: Georgia-Pacific 从 POC 转入日常运营，自动挂车转运超过 1,000 次
        - id: support
          label: 24x7 支持和异常处理
          description: 自诊断、现场人员升级和远程专家共同支撑日常使用
        - id: expand
          label: 规模化或停滞
          description: 规模化需要具名多站点证据、基础设施就绪度和合同耐久性指标；这些仍未披露
    approximationNotes: 各阶段综合了已披露的客户生命周期，而非任何单一合同模板。该图有证据支撑，但公开客户名称和续约数据稀少，因此仍不完整。
    claimRefs:
      - CU001
      - CU005
      - CU010
      - CU019
      - CU025
      - CU039
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: Outrider 的公开铺开路径已从试点开发走向分阶段商业化，但分母数据仍落后于里程碑披露。
    data:
      nodes:
        - id: testing
          label: 2019+ 客户测试
          description: 客户参与测试和试点
        - id: moves12k
          label: 12k+ 次转运学习底座
          description: 运营数据反哺下一代套件设计
        - id: gp
          label: Georgia-Pacific 生产站点
          description: POC 转为日常运营，完成 1,000+ 次转运
        - id: moves100k
          label: 截至 2024 年 10 月 100k+ 次转运
          description: 部署站点和测试场活动已放量
        - id: h22025
          label: 2025 年下半年精选企业部署
          description: 最新一代无人驾驶场内卡车开始投运
        - id: '2026'
          label: 2026 支持兜底铺开
          description: 24x7 支持服务支撑 Fortune 500 商业化
        - id: orders
          label: 2026-2027 订单窗口
          description: 已接受订单，但未披露客户数量
      edges:
        - from: testing
          to: moves12k
          label: 运营学习
        - from: moves12k
          to: gp
          label: 试点转生产
        - from: gp
          to: moves100k
          label: 更广部署证据
        - from: moves100k
          to: h22025
          label: 商业就绪
        - from: h22025
          to: '2026'
          label: 支持驱动铺开
        - from: '2026'
          to: orders
          label: 规模化管线
    approximationNotes: 该流程按时间而非合同关系排列。它展示已披露的商业化步骤，不展示逐客户转化率。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU021
      - CU022
      - CU023
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证据质量在一个具名生产站点上最高；广度、留存和集中度披露明显更弱。
    data:
      columns:
        - 具名运营方证据
        - 运营指标具体度
        - 耐久性可见度
        - 商业信号
      rows:
        - label: Georgia-Pacific 生产站点
          values:
            - 强
            - 强
            - 弱
            - 现场客户使用的最佳直接证据
        - label: 11 家优先客户群
          values:
            - 弱
            - 低
            - 弱
            - 显示广度主张，但不显示转化质量
        - label: 24 辆卡车试点群
          values:
            - 弱
            - 中
            - 弱
            - 面向未来规模化的最佳采购信号
        - label: 2026 支持和订单管线
          values:
            - 弱
            - 中
            - 弱
            - 商业动作可见，但客户数量仍未披露
    approximationNotes: 序数标签反映证据质量，而非绝对客户价值。由于未找到公开留存指标，矩阵刻意严格看待耐久性可见度。
    claimRefs:
      - CU005
      - CU019
      - CU025
      - CU039
      - CU040
      - CU042
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最重的剩余风险集中在运营支持强度、合作伙伴集中度和法律 / 责任不确定性，而不是产品纯粹不存在。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 安全论证 / 责任栈
          values:
            - label: 中
              tone: warning
              detail: 监管义务在演进，但并非假设风险。
            - label: 高
              tone: negative
              detail: 责任风险可能同时打到客户信任、保险和铺开速度。
            - label: 中
              tone: warning
              detail: Outrider 已公开安全论证纪律，并接受外部审查。
            - label: 中高
              tone: warning
              detail: 在事故资料包和合同资料包完成审阅前，剩余暴露仍偏高。
        - label: 人工支持 / 正常运行时间强度
          values:
            - label: 高
              tone: negative
              detail: 公开来源反复显示，难例仍需要人参与闭环。
            - label: 高
              tone: negative
              detail: 服务负担可能同时冲击正常运行时间、利润率和客户信任。
            - label: 中
              tone: warning
              detail: 支持服务和诊断能力是可见的缓释项。
            - label: 高
              tone: negative
              detail: 只要不披露人工介入率，剩余风险仍高。
        - label: 合作伙伴栈集中度
          values:
            - label: 中高
              tone: warning
              detail: 车辆、传感、算力和设施依赖都清晰可见。
            - label: 高
              tone: negative
              detail: 单一合作伙伴掉链子，就可能拖慢收入和铺开节奏。
            - label: 中
              tone: warning
              detail: 共同开发和安全论证审批降低意外风险。
            - label: 中高
              tone: warning
              detail: 每个关键节点都没有公开记录替代路径。
        - label: 融资依赖
          values:
            - label: 中
              tone: warning
              detail: 2026 年新融资显示 Series D 后资本活动仍在继续。
            - label: 高
              tone: negative
              detail: 如果融资跟不上铺开需求，商业化会变慢，估值会被压缩。
            - label: 中低
              tone: warning
              detail: 资本获取能力已被证明，但公开流动性细节仍薄。
            - label: 高
              tone: negative
              detail: 在私下证明现金充足前，剩余暴露仍高。
        - label: 客户不透明 / 集中度
          values:
            - label: 中
              tone: warning
              detail: 公开证据可信，但仍集中在很小的具名样本里。
            - label: 中高
              tone: warning
              detail: 披露偏薄时，关键客户一旦流失，下行风险会被放大。
            - label: 低
              tone: warning
              detail: 公开缓释项存在，但没有合同层面的客户细节。
            - label: 中高
              tone: warning
              detail: 剩余暴露仍高于普通工业软件基线。
    approximationNotes: 热力图排序的是有来源支撑的序数暴露，而不是假装用虚假精度估算概率。
    claimRefs:
      - CR003
      - CR010
      - CR015
      - CR022
      - CR024
      - CR025
      - CR026
      - CR027
      - CR036
      - CR039
      - CR040
      - CR041
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Outrider 的主要风险通过少数渠道传导：支持强度、合作伙伴集中度和法律不确定性，最终都会流向利润率、铺开时点和估值。
    data:
      nodes:
        - id: legal
          label: 法律 / 责任栈
          detail: 安全论证、工作场所安全和合同分配暴露。
          tone: warning
        - id: support
          label: 人工支持负担
          detail: 现场人员和远程专家仍不可少。
          tone: warning
        - id: partners
          label: 合作伙伴集中度
          detail: Orange EV、NVIDIA、Ouster 和设施合作伙伴共同决定就绪度。
          tone: warning
        - id: rollout
          label: 铺开时点
          detail: 商业部署速度取决于站点、人员和交易对手。
          tone: warning
        - id: trust
          label: 客户信任
          detail: 外界感知的正常运行时间和安全纪律决定扩张意愿。
          tone: warning
        - id: margin
          label: 利润率压力
          detail: 服务强度和合作伙伴定价可能压缩经济性。
          tone: negative
        - id: funding
          label: 融资需求
          detail: 铺开变慢或成本更高，可能提前拉动资本需求。
          tone: negative
        - id: valuation
          label: 估值风险
          detail: 耐久性更低、资本需求更高，会压缩下行支撑。
          tone: negative
      edges:
        - from: legal
          to: trust
        - from: legal
          to: rollout
        - from: support
          to: trust
        - from: support
          to: margin
        - from: partners
          to: rollout
        - from: partners
          to: margin
        - from: rollout
          to: funding
        - from: trust
          to: valuation
        - from: margin
          to: valuation
        - from: funding
          to: valuation
    approximationNotes: 该图是定性且有来源支撑的。它展示传导方向，不编造概率或权重。
    claimRefs:
      - CR006
      - CR010
      - CR019
      - CR020
      - CR024
      - CR027
      - CR036
      - CR039
      - CR040
      - CR041
      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 商业化栈依赖一组紧凑的硬件、设施、人员、融资和客户节点，它们都汇入铺开执行。
    data:
      nodes:
        - id: orange
          label: Orange EV
          detail: 面向试点和规模化的自动驾驶就绪场内卡车底盘。
          tone: warning
        - id: sense
          label: NVIDIA + Ouster
          detail: 算力和感知栈。
          tone: warning
        - id: site
          label: Rite-Hite + 站点改造
          detail: 月台、限位装置和设施流程集成。
          tone: warning
        - id: staff
          label: 远程专家 + 操作员
          detail: 人工异常处理和一线执行。
          tone: warning
        - id: capital
          label: 后续资本
          detail: 资金支撑建设和部署节奏。
          tone: negative
        - id: customers
          label: 企业客户
          detail: 采用、站点就绪度和扩张决策。
          tone: warning
        - id: outrider
          label: Outrider 铺开引擎
          detail: 产品、部署和支持编排。
          tone: negative
      edges:
        - from: orange
          to: outrider
        - from: sense
          to: outrider
        - from: site
          to: outrider
        - from: staff
          to: outrider
        - from: capital
          to: outrider
        - from: customers
          to: outrider
        - from: outrider
          to: customers
        - from: site
          to: customers
        - from: staff
          to: customers
    approximationNotes: 依赖关系图是对已披露交易对手和用工需求的结构性解读，并不声称每个类别都存在正式排他关系。
    claimRefs:
      - CR010
      - CR016
      - CR018
      - CR019
      - CR020
      - CR030
      - CR031
      - CR037
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 这项建议一边受真实商业化证据驱动，另一边受价格发现输入缺失牵制。
    data:
      nodes:
        - id: proof
          label: 商业证据
          detail: 2026 铺开计划、全栈产品、具名现场客户
        - id: capital
          label: 资本活动
          detail: 2026 Form D 证实融资，但不证实估值
        - id: comps
          label: 可比公司分散度大
          detail: 公开和私有参照覆盖巨大的成熟度差异
        - id: gaps
          label: 关键披露缺口
          detail: 缺少当前估值、收入质量或条款栈
        - id: decision
          label: 建议：继续研究
          detail: 只有在严肃尽调价格和条款后才继续推进
      edges:
        - from: proof
          to: decision
        - from: capital
          to: decision
        - from: comps
          to: decision
        - from: gaps
          to: decision
        - from: capital
          to: gaps
        - from: comps
          to: gaps
    claimRefs:
      - CV006
      - CV009
      - CV011
      - CV012
      - CV039
      - CV040
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 私有尽调到位后，最可能改变承销立场的变量方向性评分。
    data:
      items:
        - label: 披露当前估值，且资本结构表干净
          value: 3
          unit: score turns
        - label: 已验证站点级收入和利润率质量
          value: 3
          unit: score turns
        - label: 客户集中度高于预期
          value: -2
          unit: score turns
        - label: 后续融资折价信号
          value: -3
          unit: score turns
        - label: 宏观或监管时点拖累
          value: -2
          unit: score turns
    approximationNotes: 数值是在 -3 到 +3 标尺上的序数承销转向影响，不是预测回报。该图显示哪些尽调答案对价格纪律最关键。
    claimRefs:
      - CV018
      - CV029
      - CV033
      - CV034
      - CV036
      - CV040
      - CV042
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开参照组覆盖很宽的估值区间，进一步说明不能只靠可比公司给 Outrider 定价。
    data:
      items:
        - label: Serve 公开边界（$B 市值）
          low: 0.51
          mid: 0.51
          high: 0.51
          unit: $B
        - label: Ouster 公开边界（$B 市值）
          low: 2.67
          mid: 2.67
          high: 2.67
          unit: $B
        - label: Aurora 公开边界（$B 市值）
          low: 12.47
          mid: 12.47
          high: 12.47
          unit: $B
        - label: Symbotic 公开边界（$B 市值）
          low: 24.89
          mid: 24.89
          high: 24.89
          unit: $B
    approximationNotes: 这些是截至访问日期的市值边界标记，不是直接估值可比。重点在分散度：必须拿到私有指标后，才能判断 Outrider 应落在区间内哪里。
    claimRefs:
      - CV015
      - CV018
      - CV023
      - CV026
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的紧凑指标，显示公开证据在哪里强、在哪里缺位。
    data:
      items:
        - label: 已披露当前估值
          value: 'No'
        - label: 2026 融资已售出
          value: 21.521
          unit: $M
        - label: 最近披露的已关闭轮次
          value: 62
          unit: $M
        - label: 具名现场客户部署
          value: 1
          unit: named site
        - label: 公开可比市值区间
          value: 0.51-24.89
          unit: $B
        - label: 建议
          value: research-more
        - label: 风险评级
          value: high
    approximationNotes: 这组 KPI 混合二元、金额和类别指标，因为本章瓶颈是证据完整度，而不是某个标准化估值比率。
    claimRefs:
      - CV001
      - CV003
      - CV011
